body:
  text: 玉海卷四十八宋王應麟撰藝文實録實録起於蕭梁至唐而盛雜取編年紀𫝊之法而為之以備史官採擇梁實録唐志梁皇帝實録周興嗣二卷興嗣撰皇帝實録皇徳記起居注謝昊五卷太清實録十卷雜史許嵩唐人建康實録二十卷六朝所都偽史劉昞燉煌實録二十卷晁氏志建康實録始自吳起漢興平元年終於陳末禎眀三年南朝六代四百年間君臣行事及土地山川城池宫苑制置興壞用存古跡有異事則注之唐二十八部實録志凡實録二十八部三百四十五卷始周興嗣終於吳兢中宗實録劉知幾太上皇實録以下至韋保衡武宗實録不著録四百五十七卷六典史官本起居注以為實録崇文總目三十三部八百四十一卷唐髙祖至周世宗唐髙祖實録太宗實録志髙祖實録二十卷敬播撰房𤣥齡監修許敬宗删改起創業盡貞觀九年今上太宗實録二十卷敬播顧𦙍撰房𤣥齡監修盡貞觀十四年㑹要貞觀十七年七月十六日癸巳司空房𤣥齡給事中許敬宗著作郎敬播等上髙祖今上太宗實録各二十卷使諫議大夫禇遂良讀之始讀太宗初生祥瑞感動流涕曰朕富有四海追思膝下不可復得收卷遣編之秘閣賜皇太子諸王各一部封𤣥齡一子縣男賜物千段壐書褒美敬播𫝊與敬宗撰髙祖實録興創業盡貞觀十四年至是又撰太宗實録訖二十三年房喬嘗稱播為陳壽之流通鑑貞觀十七年七月癸巳書成上之上見其書六月四日事語多㣲隠命削去浮辭直書其事初上謂監修國史𤣥齡曰前世史官所記皆不令人主見之何也對曰史官不虚美隠惡人主見之必怒故不敢獻上曰朕欲自觀國史知前日之惡為後來之戒公可撰次以聞諫議大夫朱子奢上言云云上不從𤣥齡乃删為髙祖今上實録唐貞觀實録志長孫無忌貞觀實録四十卷㑹要永徽元年閏五月二十三日史官太尉無忌等修貞觀實録畢上之起貞觀十五年至二十三年五月勒成二十卷通前共四十卷顯慶元年七月三日史官太尉無忌左僕射于志寧等修國史成起義寧盡貞觀末凡八十一卷藏其書於内府至四年二月九日中書令許敬宗等五人受詔撰貞觀二十三年以後至顯慶三年實録成二十卷添成一百卷上以敬宗所記多非實録謂劉仁軌曰此既乖於實録何以垂之後昆髙祖太宗實銶敬播所修頗多詳直敬宗輙以愛増刪改本傳所擿四事書目太宗實録四十卷許敬宗奉詔定起初誕盡貞觀二十三年八月舊史顧𦙍撰太宗實録二十卷永徽中唐髙宗實録志許敬宗皇帝實録三十卷髙宗後修實録三十卷崇文目書目止有後修初令狐徳棻撰止乾封劉知幾吳兢續成起初載盡永淳二年以初顯慶四年許敬宗等撰貞觀二十三年後至顯慶三年成二十卷韋述髙宗實録三十卷武后髙宗實録一百卷唐則天實録志則天皇后實録二十卷書目同魏元忠武三思祝欽眀徐彦伯栁冲韋承慶崔融岑羲徐堅撰劉知幾吳兢删正吳兢𫝊初與劉子𤣥撰定武后實録叙張昌宗誣證魏元忠事頗言說已然可賴宋璟等邀勵苦切故轉禍為忠說為相讀之心不善知兢所為即從容謂曰劉生書魏齊公事不少假柰何兢曰子𤣥已亡不可受誣地下兢實書之其草故在聞者歎其直說屢以情蘄改辭曰徇公之情何名實録卒不改世謂今董狐㑹要神龍二年五月魏元忠至徐堅等修則天實録三十卷文集一百卷上之開元四年十一月十四日子𤣥兢重修則天實録三十卷與中睿實録同上唐中宗實録睿宗實録志吳兢中宗實録二十卷劉知幾太上皇實録十卷書目十卷下止𫝊位睿宗實録五卷㑹要開元四年十一月十四日修史官劉子𤣥吳兢撰中睿實録各二十卷成以聞又引古義白於執政姚崇奏叙事記言所録雖重承恩賜命固不在多請各賜物五百段許之中興書目中宗實録起神龍元年復位盡景龍四年八月𫝊位凡六年睿宗實録十卷起初誕盡先天二年七月禪位凡四年又五卷知幾兢等撰起藩邸盡開元四年其書互為詳畧唐𤣥宗實録志開元實録四十七卷失撰人姓名張説今上實録二十卷説與唐頴撰次𤣥宗開元初事𤣥宗實録一百卷令狐峘撰元載監修峘所纂開元天寳間事唯得諸家文集編其詔册以備一朝之遺事多漏畧名臣傳記十無二三不稱良史中興書目一百卷元載令狐峘撰起先天元年盡上元三年以大厯三年上凡五十年集賢注記唐頴進所撰稽典一百卷燕公奏留史館修史撰今上實録十三卷韋述知史館敕令述寫燕公所撰今上實録二十卷藏集賢史庫㑹要元和十四年九月乙巳上謂宰臣曰朕讀𤣥宗實録見開元之初鋭意求理至十五六年則稍懈至開元末又似不及中年其故何也崔羣對又元和中讀𤣥宗實録見事出一主而興替頓殊李絳對元和四年七月上讀貞觀開元實録見太宗撰金鏡書及帝範𤣥宗撰開元訓誡思繼前躅遂制君臣事跡唐肅宗實録志肅宗實録三十卷元載監修中興書目卷同元載撰起至徳元盡後元年凡六年㑹要元和七年六月上讀肅宗實録見大臣𫝊多浮辭虚美因宣與史官令紀事詣實唐代宗實録志令狐峘代宗實録四十卷中興書目同起寳應元盡大厯十四年九十七年㑹要元和二年七月癸巳大僕丞令狐丕進父峘所撰代宗實録四十七卷詔贈工部尚書書建中初受詔撰未就聽在外成當時名臣如房琯而直諒如顏真卿畧而不載時譏漏畧唐建中實録徳宗實録志沈既濟建中實録十卷舊史崇文目同時沈既濟傳撰建中實録稱其能徳宗實録五十卷蔣乂樊紳林寳韋處厚獨孤郁撰裴垍監修崇文目同建書目同裴垍等撰凡二十五年起元中盡貞元二十一年㑹要元和二年二月詔撰徳宗實録五年十月庚辰宰臣裴垍與史官蔣武韋處厚等五人撰五十卷獻之賜垍錦綵銀噐書目唐建中實録十五卷左拾遺沈既濟撰起大厯十四年以建中二年十月終篇既濟作五例舉終必見始善惡必評月必舉朔史官雖卑出入必書太子曰薨自謂辭雖不足而書法無隠云唐順宗實録志順宗實録五卷韓愈沈𫝊師宇文籍撰李吉甫監修愈表云元和八年十一月監修吉甫授臣以前史官韋處厚所撰先帝實録三卷云未周悉令臣重修臣與修撰𫝊師直館籍等採訪修成五卷削去常事著其繫於政者比舊録十益六七忠良姦佞莫不備書去月二十九日進今月四日重令刋正其奉天功烈更加尋訪已據所聞載於首卷太和二年詔實録所書徳順朝禁中事起於謬𫝊殊非信史令史官詳正愈言禁中事頗切直宦官惡之屢言不實故令路隋等刋正開成二年三月帝曰似未詳實路隋𫝊愈書禁中事切直宦孺訾其非實詔隋刋正隋言愈所書非自出元和以來相循逮今有詔擿貞元永貞間數事為失實餘不復改景祐中編次崇文總目順宗實録有七本皆五卷五本略而二本詳唐憲宗實録志憲宗實録四十卷沈𫝊師鄭澣宇文籍蔣係李漢陳夷行蘇景裔撰杜元頴韋處厚路隋監修中興書目路隋等撰起藩邸盡元和十五年正月按文宗實録長慶二年閏十月己亥路隋以學士處厚以舍人兼修撰更日入史館眀年詔元頴與𫝊師澣籍與處厚隋等分年編次未及成大和中詔景裔夷行漢係等續修成四十卷四年三進丁酉路隋目録一卷目録今不存上之時大和四年也賜錦綵銀器㑹昌元年四月又詔再修撰與先撰成本同進三年十月宰臣李紳史臣鄭亞等進重修四十卷賜銀綵大中二年十一月又詔止行舊本其再修本今不𫝊周墀建言故宰相徳􅁉重定元和實録竄寄他事以廣父功遂制新書循吏𫝊宣宗讀元和實録見韋丹政事卓然命刻於碑唐穆宗實録志穆宗實録二十卷蘇景𦙍王彦威楊漢公蘇滌裴休撰路隋監修書目路隋等撰起元和十五年正月盡長慶四年十一月凡五年隋𫝊云大和七年表上憲穆實録今案上憲録在四年唐敬宗實録志敬宗實録十卷陳商鄭亞撰李讓夷監修書目李讓夷等撰起長慶四年盡寳厯二年凡三年㑹昌五年上鄭亞等修撰唐文宗實録志文宗實録四十卷盧耽蔣偕王渢盧告牛業撰魏謩監修書目崇文目同起寳四二年盡開成五年凡十年㑹要大中八年三月魏謩修成上之賜銀器錦綵有差孫甫曰髙祖至文宗實録敘事詳備差勝他書唐武宗實録志武宗實録三十卷韋保衡監修五代時唯存一卷崇文目一卷書目皇朝宋敏求撰二十卷起開成五年正月盡㑹昌六年三月凡七年宣宗實録三十卷敏求撰起藩邸盡大中十四年二月唐列聖實録㑹要元和三年十一月上鋭於為理徧讀列聖實録見貞觀開元故事竦慕不能釋卷謂宰臣裴垍等曰太宗嗣業如此𤣥宗政理如此我讀國史始知萬倍不及先聖猶須宰臣百官同心輔助况朕今日獨能為理耶事有乖宜望卿盡力正救裴垍等曰陛下及此實宗廟社稷之福自是延英議政率漏下五六刻元和四年上覽貞觀故事嘉鄭公諌諍匪躬詔京兆尹訪其子孫及故居出内庫錢贖賜之七年七月己未延英謂宰臣吉甫曰覽代宗實録見先朝紀綱不立嘉歎卿先人事迹志目録類孫玉汝唐列聖實録目二十五卷崇文目五十卷宋朝續唐録唐朝補遺録唐咸通中宰臣韋保衡與史官蔣偕皇甫燠撰武宣兩朝實録光化初裴䞇撰懿僖實録至五代皆缺唯存武宗録一卷皇朝趙隣幾補實録淳化五年遣錢熈乘𫝊取其書四月戊申得所著補㑹昌以来日厯三十六卷及他書百卷宋敏求續成唐録一百卷慶厯五年王堯臣上之九月癸巳以敏求為館閣校勘書目㑹昌實録二十卷宣懿僖昭實録各三十卷哀帝實録八卷合一百四十八卷今懿宗二十五卷㑹要大順二年杜讓能奏宣懿僖三朝實録未修二月敕吏部侍郎栁玭右補闕裴廷裕十五人修之踰年不編一字唯廷裕撰成東觀奏記三卷納史館晉天福六年二月起居郎賈緯奏唐自武宗以後六朝唯有武宗實録一卷餘皆缺畧今采訪遺文及耆舊傳説編成六十五卷目為唐朝補遺録緯所論次多缺誤而事迹粗存亦有補於史氏崇文目唐年補録六十五卷賈緯備史六卷建隆五代通録書目通録六十五卷建隆間昭文館大學士范質撰以五代實録共三百六十卷為繁遂總為一部命曰通録肇自梁開平迄於周顯徳凡五十三年范質𫝊述朱梁至周五代為通録六十五卷乾徳五年三月戊申范昊上先臣所撰五代通録崇文總目初梁末帝無實録質自以聞見補成之其纘次時序最有條理編年類後唐眀宗命端眀樞宻學士修日厯周世宗用陶榖之言修眀宗之制天成三年何瓉言張昭有史學甞私撰同光實録十二卷又欲撰三祖志并藏昭宗朝賜武皇制詔九十餘篇即以為史館修撰補為紀年録二十卷莊宗實録三十卷上之又修眀宗實録成三十卷顯徳中撰周祖實録三十卷及梁唐漢五朝實録梁事遺失餘三帝實録皆藏史閣咸平重修太祖實録太平興國三年正月己酉命李昉扈䝉李穆董淳趙隣幾同修太祖實録五年九月甲辰史館修為五十卷以獻賜監修沈倫史官李昉扈䝉等襲衣金帶錦綵銀器淳化五年四月癸未命張垍李至等同修國史先是上語宰相曰先朝事耳目相接今實録中多有漏畧可集史官重修蘇易簡對曰近代委學士扈䝉修史䝉性懦逼於權勢多所諱避甚非直筆上因言及太祖受命之際非謀慮所及陳橋之事史册所缺冝令至等重加綴緝是年十月丙午張垍等獻重修太祖紀一卷以朱墨雜書垍所上紀不列於史館凡躬承聖問及史官採摭之事即朱書以别之其書未成真宗咸平元年九月己巳下詔以沈淪所修事多漏略先朝命張垍重修太祖實録未成㑹倫没命右僕射吕端集賢學士錢若水重修丁丑又以王禹偁李宗諤梁顥趙安仁等同修二年六月丁巳書成凡五十卷并事目二卷平章事李沆監修上之表云前集録敘天造之始稽國姓之源發揮無取銓次失當今之所正率由舊章文武羣臣舊載者九十二人或作九十一今増其遺漏一百四人其於制禮作樂經文緯武申眀大政釐改庶務著於甲令垂為法式靡不具載帝覧之稱善癸亥詔褒諭賜襲衣金犀帶銀帛若水而下加散官食邑先是詔並加恩而沆獨辭李沆所修視前録為稍詳而真宗猶謂未備大中祥符九年復詔趙安仁􅄯逈陳彭年夏竦崔遵度同修王旦監修眀年書成自興國至祥符前後凡三修景徳四年閏五月庚寅馬知節曰太祖數事恐實録中未載上令知節具録奏聞以備史闕咸平太宗實録至道三年十一月己巳真宗初即位命集賢院學士錢若水等修太宗實録若水請柴成務宗度吳淑楊億同修請令修實録官逓宿本院十二月甲午又言太平興國八年以前君臣獻替不著於話言淳化五年以後親決萬機不聞於䇿府請降詔㫖於前任宰執三司等處移牒求訪以備缺文從之時有昭宣使王延徳一本作王建徳上太宗南宫事跡三卷命送修實録院咸平元年八月乙巳十九日書成凡八十卷楊億獨修五十六卷若水等奉表以獻表云借箸之畫咸所預聞執簡而書莫非摭實上親覧涕泗嗚咽命坐從容勞問纔九月而畢上甚歎其速以其書入禁中時若水判集賢院因用院印史館無所預以諸王賜食聴為修撰所令莊宅使劉承珪掌其事乙夘若水等加食邑階勲賜器帛長編至道三年十一月乙巳詔工部侍郎集賢院學士錢若水修太宗實録若水舉官同修起居舍人李宗諤預焉上曰自太平興國八年以後皆李昉在中書日事史䇿本憑直筆若子為父隠何以𫝊信於後代除宗諤不可餘悉許至咸平元年以後並同前上前出㑹要祥符九年二月己丑監修王旦言兩朝實録事有未備者望付修史官増修從之遂委趙安仁􅄯逈等増續眀年書成其卷帙如舊乾興真宗實録乾興元年十一月癸酉八日命翰林承㫖李維學士晏殊修撰真宗實録諭以一朝大典謹筆削之意壬午十六日命孫奭宋綬陳堯佐為同修撰官十二月丁巳詔宰臣馮拯提舉監修天聖元年二月乙巳王舉正李淑為檢討拯卒又命宰臣王欽若代之天聖二年三月癸夘書成凡百五十卷事目五卷癸夘欽若等詣承眀殿以獻兩宫覽書涕泣命坐勞問錫㑹進官錫宴於編修院卷一本無事目五甲辰以欽若為司徒丙午李維等遷官第賜器幣襲衣金犀帶鞍勒馬嘉祐仁宗實録嘉祐八年十二月十二日庚辰時英宗已即位命翰林學士王珪賈黯范鎮修仁宗實録以宋敏求吕夏卿韓維為實録院檢討官治平元年二月戊辰命宰臣韓琦提舉治平四年五月上遣使取浄草二篇留觀禁中賜史臣手詔熈寧二年七月己丑韓琦上之凡二百卷又本有事目十卷守長編命王珪等為檢討入内都知任忠管勾敏求時知亳州召用之無韓琦提舉事熈寧英宗實録熈寧元年正月二十四日一云二月丁酉詔以宰相曽公亮提舉吕公著韓維王安石修撰孫覺曽鞏檢討二年七月己丑司徒韓琦等上英宗實録三十卷事目三卷一云曽公亮等上賜詔奬諭時與仁宗實録同上從琦等言書成乞不推恩之元祐神宗實録元祐元年二月六日乙丑詔修閏二月命司馬光提舉鄧温伯陸佃並修撰十月又以吕公著提舉黄庭堅范祖禹檢討四年左僕射吕大防提舉六年三月四日癸亥書成進呈上東鄉再拜然後開編大防於簾前進讀詔止讀令進七日賜宴于實録院丙子大防等遷秩紹聖元年四月戊辰從蔡卞之請重修至三年十一月戊辰書成進之元符三年五月左正言陳瓘言伏聞王安石日録七十餘卷具載熈寧中奏對議論之語此乃人臣私録非朝廷典册自紹聖再修凡日厯時政記及御集所不載者徃徃専據此書追議刑賞宗廟之美皆為私史所攘願詔史官别行刪修詔三省同參對聞奏靖國元年六月壬戌詔熈寧元豐事實具備元祐紹聖編録具存訂正討論宜公乃心務不失實十月詔前降參取元祐實録及刪除王安石日録指揮更不行紹興重修神宗實録紹興五年九月十五日乙酉左僕射監修趙鼎史館修撰范冲直史館任申先著作佐郎張九成等上重修實録五十卷後三日制鼎進二官冲等一官至六年正月癸未成書通已進凡二百卷繕寫三部一為御覽一藏天章閣一付秘省先是建炎初上謂朱勝非曰神宗史録事多失實遂降詔重修勝非薦范冲兼史事冲言神宗實録自紹聖中已命官重修既經删改慮他日無所質證今為考異追記紹聖重修本末朱字係新修黄字係删去墨字係舊文每條即著臣所見於後以示去取世號朱墨史紹興九年二月壬子朔史館進祖宗實録上曰朕欲見景徳講和後故事紹興重修哲宗實録初元符三年詔修哲宗實録至大觀四年四月成書紹興四年五月庚申詔條具重修事件八年六月九日癸亥左僕射監修趙鼎修撰勾濤祕書少監尹焞著作郎張嵲佐郎胡珵校勘朱松李彌正髙䦎范如圭等以重修哲宗元豐八年至元祐八年實録上之至九月甲午書成起紹聖元年至元符三年通前録為一書成一百五十卷先後進呈著作何掄謂舊録一書不應分前後請併紹聖元符接續修纂從之上皆御殿如進神宗實録之制丁未趙鼎遷特進先是宰臣朱勝非言哲宗實録經京卞之手議論不公遂詔史官看詳重修後邵溥上其父伯温辨誣王銍上元祐八年補録送史館參修初舊録係二百卷勾濤言請依英宗實録例目通融裁減卷帙從之乾道七年十一月二十八日詔秘省繕寫太祖至哲宗實録讐校以進神録有考異哲録有辨誣皆出范冲一手紹興徽宗實録淳熈重修乾道欽宗實録紹興七年詔修八年秋即史館開實録院十一年七月戊戌進六十卷自元符三年至大觀四年丁未提舉秦檜遷少保封兾國公庚戌修撰已下各遷秩所修疎畧二十八年二月癸巳修撰賀允中等請重修大觀以前實録八月戊戌十一日提舉湯思退等上一百五十卷以左僕射沈該為禮儀使自八年秋開院踰二十年乃成再加増潤猶多疎畧上御垂拱殿進呈訖奉安於天章閣一云藏于敷文閣又以小本進入禁中癸夘思退遷左正奉大夫丙午同修國史周麟之奏副本在有司者宜謹其藏不許關借𫝊寫乾道四年四月甲寅上欽宗實録四十卷并帝紀乾道二年十一月起居舍人洪邁奏欽宗日厯已成宜修纂十二月詔免進呈因龔茂良所補日厯而修五年十二月秘書少監李燾請重修徽録六年置院重修淳熈四年三月九日上重修徽録二百卷考異二十五卷目録二十五卷進呈如二十八年之制燾薦吕祖謙為檢討審訂増削數百條書遂成汪藻纂元符以來詔㫖至宣和凡八百六十五卷實録所取十盖七八然猶多脱畧燾増修之紹興以後置二相則右相仍領實録院無次輔則以執政權執政權提舉實録自乾道二年十二月魏杞始以無相故也慶元髙宗實録淳熈十五年三月十一日洪邁請開院修纂慶元三年二月五日上二百八十卷起藩邸至紹興十六年修撰傅伯壽等嘉泰二年正月二十一日又上二百二十卷起十七年至三十二年修撰袁説友等自奉詔至成書凡十六年成五百卷嘉泰孝宗實録光宗實録慶元元年七月二十日詔修孝宗實録嘉泰二年詔傅伯壽陸游同修専以委之三年四月十七日上五百卷又上光宗實録一百卷實録自東都以前凡一百六十八年不過一千餘卷南度後髙孝六十餘年亦一千卷孝録比他書尤疏駁淳祐寧宗實録二年二月上重修太祖實録李沆辭加恩太祖太宗史成王旦進秩司徒真録并正史成提舉並遷秩仁英録并兩朝正史成提舉韓琦曽公亮王珪並辭之但賜器幣有差珪又増一子六品服元祐神録成左相吕大防遷兩秩紹興重修神録左相趙鼎進二官為左光祿大夫鼎辭賜銀帛衣帶一子六品服用元豐舊制也記注荀悅申鍳朝有二史左史記言右史記動動為春秋言為尚書君舉必記臧否成敗無不存焉隋志周穆天子𫝊體制與今起居注正同盖周時内史所記王命之副周公記注春秋左氏𫝊隠八年注諸例或發於始事或發於後者固宜有所異同亦或丘眀所𫝊記注本末不能皆備疏周公舊凡於記注之文散在諸事丘眀作𫝊因記注之文發例故或先或後左氏𫝊序周徳既衰官失其守赴告䇿書諸所記注多違舊章仲尼因魯史䇿書成文遵周公之遺制眀將來之法其發凡以言例皆經國之常制周公之垂法史書之舊章仲尼從而修之以成一經之通體注隠公七年始發凡例特云謂之禮經十一年又云不書於䇿建此二句於諸例之端眀書於䇿者皆有經國之常制非仲尼始造䇿書自制此禮也昭二年注春秋遵周公之典以序事故云周禮盡在魯矣疏定四年𫝊稱備物典䇿以賜伯禽典䇿則史官記事之法也漢著記藝文志春秋家漢著記百九十篇一作卷注師古曰若今起居注律厯志劉歆厯譜著紀髙祖即位十二年惠帝著紀七年髙后著紀八年文帝著紀二十三年景帝著紀一十六年武帝著紀五十四年昭帝著紀十三年宣帝著紀二十五年元帝著紀十六年成帝著紀二十六年哀帝著紀六年平帝著紀孺子著紀更始著紀自漢元年訖更始二年凡二百三十嵗光武皇帝著紀以景帝後髙祖九世孫改元建武嵗在鶉尾之張度即位三十三年五行志凡漢著紀十二世二百一十二年日食五十三朔十四晦三十六先晦一日三唐開元厯合朔議考漢元光以來史官注記日食有加時者凡三十七事鄧后紀劉毅上書曰古之帝王左右置史漢之舊典世有注記兒寛𫝊臣瓉曰漢注卒史秩百石宣紀黄龍元年師古曰漢注云此年二月黄龍見廣漢􅄯錯策謂髙皇功徳歴之春秋終軍上對謂異獸奇木宜使著事者有紀劉向封事言星聚等事而曰皆著於漢紀谷永封事言建始以來元年灾異而曰八世著記乆不塞除李竒曰髙祖以來至元帝劉歆之譜三統厯則引髙帝至光武著紀以明即位之年班固之志五行則引十二世著紀驗日食之數遷作史記本於紬金鐀石室之書固作漢書本於探篹前記漢武有禁中起居注永平中撰建武注記明徳后撰明帝起居注劉毅乞修長樂宫注獻帝及晉代以來起居注皆近侍臣所録後志注引獻帝起居注後五行志注所馬融言日蝕曰漢書載史官占候唐陳正卿作續尚書其表謂漢臣著記新體互約於表志則著記為漢起居注昭昭矣漢大事記大年紀漢帝年紀春秋考紀史記漢興以來將相年表所記有曰大事記有曰相位將位御史大夫位大事若髙祖始為漢中王破項羽踐尊位而尊太上皇惠帝城長安文帝除苛律相位若蕭何守關中將位若太尉盧綰為燕王御史大夫若周苛守滎陽裴駰案司馬遷記事迄於太始元年而此表至陽朔鴻嘉後所増也藝文志春秋類有太古以來年紀二篇漢大年紀五篇髙紀五年臣瓉注曰漢帝年紀有信平侯臣陵都武侯臣起文紀三年柴武注臣瓉曰漢帝年紀為陳武武紀天漢元年秋注閉城門大捜臣瓉曰漢帝年紀六月禁踰侈七月閉城大捜則捜索踰侈者也征和元年十一月臣瓉注引漢帝年紀發三輔騎士大捜長安上林中前敘𫝊起元髙祖終于孝平十有二世二百三十年為春秋考紀注師古曰謂帝紀也􅄯錯云刻於玉版蔵於金匱歴之春秋紀之後世為帝者祖宗與天地相終史遷既易編年為紀𫝊而將相名臣年表之作復以漢興以來大事為之記葢以成春秋之法也上自髙祖肇造下迄天漢紀年之後凡闓基剏業則書之髙帝元年春王漢秋定雍二年定塞翟等國據滎陽三年定魏代趙四年定齊及燕五年破楚踐位是也伐畔除􅕝則書之若髙祖之擊信布孝景之擊吳楚是也凡定都營國則書之若都關中城長安若長樂未央之成太倉西市之立是也封建朝覲則書之若髙祖王兄仲於代文帝王諸子於太原等國景立河間諸王武立六安諸王與夫楚元齊悼之來朝諸侯王之至長安是也凡尊親立廟册后建儲之禮則書之若髙祖之尊上皇惠景之立髙文廟與夫太子之立書於髙帝之二年衛后之立書於元朔之初載是也凡肆𤯝除虐導民興利則書之若赦復作除孥律孝悌力田之置八銖錢貨之行是也凡郊祀正朔祥瑞災異則書之渭陽之祀雍畤之幸建元之紀號太初之正厯與夫汾隂寳鼎之出河決地動之異是也漢禁中起居注隋志漢武帝有禁中起居注通典周官有左右史記其言事盖今起居之本漢武帝禁中起居注馬后撰眀帝起居注則漢起居似在宫中為女史之任魏晉著作掌之後皆近侍之臣録記後魏始置起居令周有著作二人掌綴録起居著作之任自此而分西京雜記葛洪家有漢武禁中起居注一卷漢武故事二卷抱朴子論仙按漢禁中起居注北史桞蚪曰漢魏以還宻為記注徒聞後世無益當時漢建武注記顯宗起居注馬嚴𫝊永平十五年顯宗召見詔留仁壽闥與校書郎杜撫班固等雜定建武注記隋志劉珍等撰漢記起光武記注至靈帝眀徳馬后紀后自撰顯宗起居注削去兄防參醫藥事曰不欲後世聞先帝數親後宫之家故不著也荀恱申鑒先帝故事有起居注日用動静之節必書焉宜復其式内史掌之以紀内事楊賜𫝊侍講注籍文選赭白馬賦李善注引漢眀帝起居注帝向太山至滎陽有鳥鳴軛云云漢史官注記見天文書及唐厯議漢長樂宫注古今注和熹鄧后紀初元五年平望侯劉毅以太后多徳政欲令早有注記上書安帝宜令史官著長樂宫注聖徳頌以敷宣景燿勒勲金石垂之日月攄之罔極帝從之伏無忌𫝊不其侯無忌與黄景崔寔等撰漢記又自采集古今删著事要號曰伏侯注隋志雜史伏無忌古今注八卷其書上自黄帝下盡漢質帝唐志三卷晉古今注唐志儀注類崔豹古今注一卷又雜家崔豹古今注三卷輿服都邑音樂鳥獸魚蟲草木雜注問答釋義八篇周䝉續古今注三卷崇文目有之隋志雜家古今注三卷書目雜家古今注三卷晉太傅丞崔豹撰雜取古今名物各為考釋凡八門中華古今注三卷五代唐馬縞撰初崔豹進古今注原釋事物剏始之意縞復増益注釋以眀之凡六十六門晉泰始起居注咸寧注見元㑹起居注梁流别起居注隋志晉泰始起居注二十卷唐志同咸寧起居注十卷唐志二十二卷太康起居注二十一卷唐志二十二卷並李軌撰建武太興元康咸和咸康建元永和升平隆和興寧咸安太和寧康太元隆安元興義熈元熈皆有之唐志有永平永昌宋劉道㑹唐志作薈撰晉起居注三百一十七卷唐志三百二十卷梁徐勉以起居注煩雜乃為流别起居注六百六十卷唐志有四十七卷失姓名蜀志注引晉泰始起居注載詔曰諸葛亮在蜀盡其心力其孫京隨才補吏文選注引晉起居注太康四年詔世說注引惠帝建興太元起居注魏志注案陸機惠帝起居注宋書傅亮與蔡廣書引陸士衡起居注元嘉十四年河西王求晉起居注宋志地理以晉宋起居凡諸記注推討辨折齊永明二年沈約兼著作郎撰次起居注周興嗣撰皇帝實録皇徳記起居注職儀唐六家起居注志起居注類六家三十八部一千二百七十二卷郭璞穆天子𫝊六卷李軌晉太始起居注二十卷何始真晉起居鈔五十卷劉道薈晉起居注三百二十卷王浚之三代起居注鈔十五卷温太雅大唐創業起居注三卷此六家之著録者若漢獻帝晉咸寧太康永平咸和咸康大興建元永和升平隆和興寧太和咸安寧康太元崇寧元興義熈元熈宋永初景平元嘉孝建大眀後魏齊永眀梁大同陳隋起居注及晉起居注鈔流别起居注失姓名者二十六家而不著録者開元起居注姚璹修時政記三家三千七百二十五卷總七家七十七部并實錄詔令隋志自穆天子𫝊漢獻帝起居注至隋開皇南燕注四十四部一千一百八十九卷六典四十一部舊志列代起居注四十一家唐創業起居注貞觀注記藝文志温大雅工部尚書大唐創業起居注三卷中興書目三卷起隋大業十二年為大原道安撫盡義寧二年五月甲子即帝位改武徳元年紀用帥符䜟受命典册事雜史大雅今上王業記六卷百官志起居郎録起居法度舍人修記言之史貞觀初省舍人以給事諌議兼知起居注或知起居事每仗下議政事起居郎一人執筆紀録於前史隨之其後顯慶中復置起居舍人分侍左右秉筆隨宰相入殿若仗在紫宸内閣夾香案分立殿下直第二螭首和墨濡筆皆在坳處永徽後許敬宗李義府為相畏人之知命舍人承㫖仗下與百官皆出不復聞機務矣開元五年九月宋璟建言令史官隨宰相入侍㑹要兼列傳蘇氏記曰貞觀中仗退後太宗與宰臣議政事令起居郎一人執簡記録由是貞觀注記稱為畢備貞觀元年杜正倫以給事中知起居注帝曰朕坐朝不敢妄言正倫曰臣職左史一言之失且筆之書千載累徳九年十月十六日帝欲見起居記録以知得失諌議大夫朱子奢曰聖徳舉無過事史臣所述盡善陛下獨覽扵事無失傳示子孫竊有未喻中主庸君飾非䕶短見時史直辭極陳善惡必不省躬罪已唯當致怨史官全身畏死則悠悠千載尚可聞乎十六年褚遂良以諌議大夫兼知起居事四月二十八日壬子帝曰人君得觀之否對曰起居古左右史善惡必記未聞天子自觀史帝曰朕有不善卿必記耶曰臣職在載筆君舉必書劉洎曰使遂良不記天下之人亦記之矣七月八日帝曰朕行有三一監前代成敗二進善人三斥逺羣小亦欲史氏不能書吾惡也憲宗元和十二年九月舍人庾承休建言天子視朝羣臣以次對言有可𫝊者承㫖宰臣示左右起居載録季送史官如故事詔可執政以機宻不可露罷之㑹要云庾敬休左史猶因制敕筆削右史但編集詔書而已劉知幾曰史官唯自詢采二史不注起居文宗大和九年十二月令郎舍人入閣日於螭頭下記言事開成初張次宗為舍人文宗始詔左右史立螭頭下記宰相奏對既退帝召見審正是非故開成時事為最詳鄭覃曰記注操筆赤墀下所書為後世法開成中鄭朗為起居郎文宗與宰相議政適見朗執筆螭頭下謂曰朕將觀之曰故事天子不觀史帝謂宰相曰朗不俾朕見起居注可謂善守職然庶一見以自改遂上之開成四年十月乙夘帝就舍人魏謩取記注觀之謩不可帝曰我既甞觀之曰史氏為失職陛下一見則後來所書必有諱屈善惡不實後代何信哉帝乃止武宗㑹昌二年十月中書奏起居注記比者不逐季撰録請每季初即納前一季所記與史館以遲速為殿最從之唐開元起居注開元注記古今注記藝文志開元起居注三千六百八十二卷失撰人名于休烈傳云蔵興慶宫厯志大衍中氣議曰較前代史官注記惟元嘉十二年十一月甲戌景長皇極麟徳開元厯皆得癸酉麟徳已前實録所記依時厯書之合朔議曰本史官候簿考漢元光已来史官注記日蝕有加時者三十七事日度議曰考古史及日官候簿以太史注記日蝕衝考日度日蝕議曰較古今日蝕四十三事月蝕九十九事課皆第一五星議曰太初三統厯嵗星十二周天超一次推商周間事大抵皆合驗開元注記差九十餘度較厯必稽古今注記八氣均而行度齊上下相距反復相求茍獨異於常則失行可知較史官所記嵗星二七事熒惑二十八事鎮星二十一事太白二十二事辰星二十四事開元厯課皆第一志凡唐著紀三百八十九年日食九十三朔九十一晦二十一漢賈逵厯論引史官注太史􅀱注劉洪考古今厯注晉乾度厯參校古今記注劉知幾奏記蕭至忠言五不可曰今史官注記類稟監修唐古今注記唐開元紀號九載制詔太史麟徳厯推步闊疏合朔屢爽其更造宻度定大明之制為萬世則繇是臣一行治新厯倚數立法本諸大衍越十五載草具其書申命臣説纂次為術七畧例議十有二而古今注記以稽氣度之行入見於五星議著雍執徐之嵗仲秋乙巳書成越眀年詔行焉維注記之書實欽天授時之樞要是不可亡序夫治厯之法以人占天非難以古驗今為難渾元初基靈曜未紀黄序肇制綜術維六論者猶曰重黎記注象應著名然則遂古之初若有常憲爰周建官太史正嵗年馮相㑹天位保章志變動咸有典籍用記菑祥矧越􅑤五千改厯凡七漢氏厯譜十有八家凖度起元可不參究是故史遷以諜記譜年數班生㠯著紀志日食賈逵議黄赤道按太史候注眀月行日度之遲疾劉洪剙乾象術攷古今厯注定斗分紀法之進退暨晉咸寧乾度泰始二厯參校古今注記之名於是始見疇人日官茍求其故則孟春建正不必虞史而後明入百嵗一日之差不必下閎而後識然數學不邃則運算舛史學不博則立論疏太初至麟徳名家二十三九章至漏經厯算之家三十六春秋至開元厯氣之事三十一上元甲子距開元積算九千六百九十六萬一千七百四十造計秒忽就研其幾維兹新厯參天地二中之數綜八卦六爻之序研九疇五紀之奧本五王一侯之式凡左氏國語夏正時訓歴代之史百氏之書釐錙析銖氷渙縷解有若中氣之議㠯前代史官注記較元嘉之日景合朔之議㠯漢元光以来注記驗日食之加時此稽諸古也月食之衝㠯太史注記攷日度嵗星之次㠯開元注記推商周此揆諸今也至於顓頊攝提之元据於厯記帝堯演紀之端參於古史候簿即氣朔之差訂殷厯之非即日食先後眀周魯厯之偽或辨古厯星度或采麟徳實録躔離發歛脗合載籍推法宻要為唐厯宗微一行數學之邃説史學之博疇克臻兹鋪觀史志古今日食四十三加時三十七月食九十九史官記五星之事百二十有二開元厯課皆第一二十一載龍集癸酉復詔侍御史麟太史令執圭較靈臺候簿而是非堅定盖不通古今無㠯成其數之宻不證古今無㠯表其術之精繇至徳迄崇元損益其法摹規擬矩莫能改錯揆元探耑注記實啟之抑五星議有曰吉㐫之象天㠯警悟人主則是書亦君徳之蓍蔡豈犆為厯數設哉按隋志天文類太史注記六卷開元著録軼而亡𫝊㑹要載古今厯書為卷二十四與太衍厯俱上志亦不著云唐時政記聖政紀百官志兼列傳㑹要舊史永徽後左右史惟對仗承㫖仗下謀議不得聞長壽二年正月戊申文昌左承相姚璹以為帝王謩訓不可缺紀建議仗下後宰相一人録軍國政要月送史館時政有記自璹始志璹修四十卷然推美讓善之道行信史直書之義缺於時事尚十得四五未幾亦罷貞元十二年正月宰臣趙璟對延英上問起居注記奏曰永徽後仗下謀議不得聞注記但於制敕内采録長壽中姚璹撰時政紀此事又廢上曰君舉必書義存勸戒時政紀宰相宜依故事為之元和八年十月延英對宰臣問時政記於監修李吉甫對曰是宰相記天子事以授史官之實録也姚璹修於長壽及璹罷而事廢賈耽齊抗修於貞元及耽罷而事廢十二年九月舍人庾敬休請宰臣及諸司對後事可勸戒者宰相示左右起居綴録季送史館既而宰相以幾宻不以告事竟不行自左右史失職於今幾一百五十年長慶元年四月中書門下奏時政記乆廢史官推寫誥詞除授請以謀議事關政事者許臣等随日撰録號聖政紀嵗末付史官舊紀長慶元年四月戊寅宰臣崔植杜元穎奏請坐日有君臣獻替事􅄏理體随日撰録號為聖政紀嵗終付史館從之事亦不行來鵠為聖政紀頌太和元年十二月詔入閣日郎舍人具筆紙立螭頭下復貞觀故事開成三年二月楊嗣復為相時延英訪對史臣不及知嗣復建言故事正衙起居注在前便坐無所紀録姚璹趙憬皆請置時政記不能行臣請延英對宰臣徃復之辭委中書門下直日紀録月終送史館它宰相議不同止㑹昌二年十月中書門下奏時政記起居注記修史例每聞聖言有慮及生靈事關興替依故事知印宰相撰録嵗末付史館大中六年裴休同平章事奏言宰相論政上前知印者次為時政記所論非一詳已辭畧他議事有所缺請宰相人自為記合付史官詔可五代史後周李榖監修國史請命近臣錄禁中事付史館乃命樞宻直學士就樞宻院録送史館自此始来鵠聖政紀頌序貞觀永徽之代言事者安論紓辭無疑權慮勢正衙一開則臣誠前而啟之帝旒近而鎮之史筆隨而絡之由是君臣謀國圖政之事俞機都要之言豐編照物偕籍于堯典永徽之後宰執不正狼噬虎飡乃奏史官與百僚俱退君有問而宰臣知之史官不得與於聞君有舉而宰臣謀之史官不得記其事次第周行檢録制誥與冗吏同工而已史臣者當國之鏡千億代之眉目也磊磊其事鏜鏜其聲雲諏波訪倦編刓筆唐集賢注記志職官類韋述三卷書目二卷學士韋述紀置院經始及開元天寳中學士名氏皆隨文注釋今本二卷乾道九年六月洪遵以大清楼本校之厪可讀韋述自登書府至天寳十五載凡四十年緬想同時凋亡已盡後来賢彦多不委書院本末嵗月漸乆或慮湮沉敢因東觀之暇聊記置院經始及前後學士名氏事皆親覩不敢遺隠時丙申嵗二月也注麗正殿在東宫正殿崇政殿之北光天殿之南述以開元五年冬敕就秘書省撰續王儉七志及刋校四庫書籍八年入麗正殿校勘十三年三月授集賢院學士自開元十三年四月迄天寳十五載二月集賢院修撰校理待制及文學直等揔五十九人開元十三年四月至天寳十四載集賢院學士直學士三十三人唐司議郎記注見東宫官唐東觀奏記志雜史裴庭裕東觀奏記三卷大順中詔修宣懿僖實録以日厯注記亡缺因摭宣宗政事奏記於監修國史杜讓能㑹要大順二年二月敕吏部侍郎栁玭等修宣懿僖實録始監修杜譲能以三朝實録未修乃奏栁玭右補闕裴庭􅁉左拾遺孫泰駕部郎李嗣太常博士鄭光庭等十五人修之踰年竟不能編録一字惟廷􅁉采宣宗朝耳目聞覩撰成三卷目曰東觀奏記納於史館淳化崇政殿起居注淳化五年四月五日丙戌史館修撰張佖言聖朝編年謂之日厯惟紀報狀序敕文至聖政皇猷羣臣忠邪庶務沿革莫有紀述謹按六典故事請置起居院修左右史之職記録為起居注每月與時政記同送史館上嘉之乃置院於禁中命梁周翰李宗諤掌郎舍人事修撰體式檢討故事以聞丁酉周翰等言禮記左史記言右史記動漢武帝有禁中起居注魏晉職歸著作後魏始置起居令史行幸宴㑹則在御坐左右記録後别置起居注二人北齊有起居省隋置舍人唐初𨽻門下顯慶中郎舍人分屬兩省今陛下重興古道乞今後應有崇徳殿長春殿皇帝宣諭之言侍臣論列之事依舊中書編為時政記月終送史館自餘百官封拜除改沿革之事並令關報起居院以備編録毎月送史館仍命郎舍人分直崇政殿以記言動别為起居注每月先進御後付史館從之起居注進御自周翰等始自後為同修起居注又以注記檢討書籍事屬史館胡銓曰周翰宗諤建言起居注先奏御豈不愧於唐褚遂良魏謩二子哉慶厯三年十一月辛夘同修注歐陽修請上殿臣僚少留殿門俟修注官出面録聖語又請更不進本從之至和元年八月二十四日知制誥賈黯乞修注官入侍邇英閣事有可書随即記録二年三月丁卯令立侍諫官兼修注自熙寧二年四月八日陳襄范純仁始元豐二年五月一日王存兼修注存建言臣僚登對許記注官侍立後不果行五年四月二十五日改修注為郎舍人六年九月戊辰令郎舍人随左右分紀言動元祐元年二月詔不分記崇寧元年十月詔前殿視朝左右史於殿門供奉紹聖二年四月詔修注官講求典故詳定當書者著為式㑹要載政和修注兩朝志天子御正殿記注官不侍左右惟朝㑹對立於香案前常日更番逓直於崇政延和二殿行幸從上出入神宗史志御正殿則俟於門廡外便殿則侍立行幸則從大朝㑹則立於殿下螭首之側凡朝廷命令赦宥執政官以下進對御史刺史以上除拜祭祀燕享臨幸引見之事日月星辰風雲氣候之兆祥瑞之符孝悌之行戸口之數皆書以授著作隆興元年起居郎胡銓言史職之廢有四一曰進史不當二曰立非其地三曰前殿不立四曰奏不直前云云五月一日詔前殿令左右侍立景徳時政記元豐乾道紹興開寳七年閏十月庚申史館修撰扈䝉請委宰相及參政凡事經聖斷可書簡䇿者録付史館乃命參政盧多遜纂録未成書今史館書目有是年時政記草一卷後亦失太平興國中直史館胡旦復以為言八年八月辛亥詔中書門下凡國家之事宣諭之言令參政李昉纂録每季送史館宻院亦令副使一人撰集昉上言請每月先奏御後付所司從之時政記奏御自昉始昉為相參政蘇易簡代之自是中書皆參政編録惟吕䝉正常以宰相領時雖有時政記之名但題云送史館事件至景徳元年始題云時政記端拱二年十月中書門下言每御前殿宻院先上宣諭嘉言無由聞知遂詔副使張齊賢抄録送中書同修為一書而授史館景徳三年五月丙午詔樞宻所修時政記至次月十五日送中書時王欽若陳堯叟同修祥符五年六月壬戌令月送史館先是宻院月録送中書至是欽若等請别撰不關中書直送史館嘉祐六年七月八日詔月終進呈從諫官龔鼎臣之請也實録七月戊子詔中書宻院累年未修時政記自今随月撰進戊子一云己丑詔元祐四年四月壬戌三省官輪修元豐五年五月六日詔兩省樞宻院時政記侍郎同知樞宻修尚書省左右丞逓修三省得㫖及宣諭於當日記録元祐四年四月壬戌二十四日詔三省月以所得㫖及宣諭輪修建炎四年五月九日有三省樞宻院輪修之詔紹興四年三月十八日戊辰詔自建炎元年五月一日至四年四月一日以前時政記令前宰執省記編類十月七日簽書樞宻胡松年以建炎四年十一月至紹興元年四月時政記六卷上之詔付史館五年三月十二日乙酉觀文大學士李綱進建炎時政記二册付史館二十六年九月二十五日知樞宻湯思退請每月具録聖語同時政記上進乾道三年五月丙寅二十四日右史陳良祐請臣僚奏對所聞聖訓令随事疏報不得以無所得聖語為解五年十一月甲寅左史林機言左右史記言動周官也剪桐之戯史佚執以為辭如棠之舉臧僖伯援之而諌慶厯三年歐陽修請臣僚奏事退俟修注官出面録聖語七年王䞇請備録關報遂為定制望舉慶厯之典從之七年正月二十三日詔三省宻院所修時政記於二月一日繳進二十九日中書門下言三省録記聖語舊以宣諭聖語為名進訖付時政記房詔以三省宣諭聖語為名與時政記同進降出付日厯所八年十一月十九日詔次旬終繳進先是七年正月二十三日詔每旬修時政記於次旬一日進天禧聖政紀天禧四年十一月壬戌輔臣請中書宻院取時政記美事别為編録從之命錢惟演王曽編次丁謂等參詳五年三月取至道至祥符時政記日厯起居注美事録為聖政紀凡百五十卷正月癸夘上作序示輔臣仁宗乾興元年八月辛亥賜輔臣又掇其事之要者為真宗政要咸平六年八月戊寅直祕閣錢惟演上咸平聖政録一卷詔付史館修真宗實録而起居注缺命程琳追修祥符以来三十卷上之景祐邇英延義二閣記注元祐附景祐二年正月己酉置邇英延義二閣三年正月乙巳說書賈昌朝言天子諸侯朝有二史厥後兩省置左右史所記事曰起居注唐長壽中姚璹以左右史不預升殿請中書門下修時政記眀皇推愛宗室宴集賜予外不悉知寧王憲請嵗終録之授史官貞元末韋執誼執政日修朝廷政令咸録本朝用長壽貞元故事以樞宻謀參帷幄於本院修時政記隻日便坐決事遊幸宴集左右在列臣幸侍經禁中陛下以清閒之燕向學稽古微言善道最髙前聖事在雙日杳隔嚴宸時政記史館日厯及起居注莫得纂述臣自景祐元年春迄二年冬凡經筵侍臣出處升絀封章進對宴㑹賜予皆用存記列為三卷乞付史館詔可以邇英延義二閣記注為名昌朝誦說眀白上多所質問命章得象等續修之至和元年八月戊午知制誥賈黯言乞令修起居注随入閤中記事詔命賜坐於御榻西南二年三月丁夘詔立於講讀官之次石揚休言恐上有宣諭逺而不聞因令立侍王拱辰乞編集講筵聖諭元祐六年一本作七年八月二十四日范百禄奏復修邇英閣記注從之二十七日甲寅宰相呂大防言近講筵乞修記注已有㫖施行今史院有邇英延義二閣記注具載仁宗與講讀官議論臣甞進仁宗聖學事迹有未備者欲寫二閣記注進入以備聖覽其後詔國史院寫二本進入别寫一本送資善堂紹興邇英記注二十八年五月十八日丁丑起居舍人洪遵言陛下延見儒臣紬繹經史左右二史旅進旅退徽言善行缺無所紀欲自今年八月秋講為始經筵官除罷及封章進對燕㑹錫予講讀問答等事悉行編録以邇英記注為名從之九月二十七日甲申遵請依講讀官奏事遵又言紹興九年以後起居注未修者殆十五年請每月帶修兩月庶幾天徳地業赫然與日星並𫝊從之二十八日詔郎舍人依講讀官奏事從遵之請也時為起居郎二十九年八月己夘舍人楊邦弼言紹興起居注未修者凡十六年望每月帶修一月從之三年二月徐俯進春秋解義上以宰渠伯書名為貶宰臣請編之記注永為大訓癸巳從之乾道祥曦殿記注二年十一月十三日壬子起居舍人洪邁言景祐以来有邇英延義記注數十年来稍廢不續臣伏覩今月五日王曮進讀春秋莒人伐杞上曰春秋無義戰周執羔進讀三朝寳訓論文章之弊上曰文以理為主陳巖肖奏刑部事上曰寛則容奸急則人無所措手足凡此數端皆承學之臣日夜探討累數百語不能盡而陛下蔽以一言然記言動之臣不能究宣乞自今講讀官以日得聖語送修注官使謹書之願倣前制因今所御殿賜名祥曦殿記注從之淳祐緝熙殿記注二年五月二十五日詔經筵遵舊制以每日講讀經史奏對進故事及章䟽纂為緝熙殿記注編類成袠每月進入玉海卷四十八
