body:
  text: 玉海卷四十宋王應麟撰藝文春秋杜預曰春秋魯史記之名記事者以事繫日以日繫月以月繫時以時繫年所以紀遠近别同異也故史之所記必表年以首事年有四時故錯舉以為所記之名周禮有史官掌邦國四方之事達四方之志諸侯亦各有國史大事書之於䇿小事簡牘而已周徳既衰官失其守諸所記注多違舊章仲尼因魯史成文考其真偽而志其典禮上以遵周公之遺制下以明將來之法蓋周公之志仲尼從而明之何休曰夫子之作春秋將以變周之文從先代之質范甯曰平王東遷周室微弱王道盡矣夫子傷之乃作春秋所以明黜陟著勸戒成天下之事業定天下之邪正使夫善人勸淫人懼胡安國曰春秋乃史外傳心之要公好惡則發乎詩之情酌今古則貫乎書之事興常典則體乎禮之經本忠恕則導乎樂之和著權制則盡乎易之變學經以傳為按則當閱左氏玩辭以義為主則當習公穀漢十三家春秋四家公羊穀梁外傳藝文志春秋二十三家九百四十八篇省太史公四篇古經十二篇經十一卷公羊穀梁二家左氏傳三十卷丘明魯太史而左氏微二篇國語二十一篇新國語劉向分五十四篇皆左氏之學也公羊傳十一卷髙人齊外傳五十篇章句三十八篇雜記八十三篇公孫𢎞傳云學春秋雜記顔氏記十一篇董仲舒治獄十六篇皆公羊之學也穀梁傳十一卷赤人魯外傳二十篇章句三十二篇皆穀梁之學也鄒氏夾氏傳皆十一卷有錄無書公穀立學官鄒氏無師夾氏未有書鐸氏微三篇史記諸侯表云楚威王大傅鐸椒為王不能盡觀春秋採取成敗為四十章者也虞氏微傳二篇劉向别錄云左丘明授曾申曾申授吳起吳起授其子期期授楚人鐸椒鐸椒作抄撮八卷授虞卿虞卿作抄撮九卷授荀卿荀卿授張蒼者也又有張氏微十篇議奏三十九篇微謂釋微指若世本十五篇戰國䇿三十三篇秦奏事二十篇楚漢春秋九篇太史公百三十篇十篇有錄無書馮商續七篇太古以來年紀二篇漢著記百九十卷終於漢大年紀五篇皆史官所記春秋之流也王者世有史官左史記言右史記事事為春秋言為尚書仲尼以魯周公之國史官有法與左丘明觀史記據行事有褒貶不可書見口授子弟退而異言丘明論本事作傳明夫子不以空言說經也末世口說流行故有公羊穀梁鄒夾之傳四家之中公羊穀梁立於學官漢春秋古經古文春秋志見上周禮注小宗伯古文春秋經公即位為公即立正義古文春秋者漢藝文志云春秋古經十二卷是此古文經所藏之書文帝除挾書律此本然後行於世史記吳太伯世家余讀春秋古文自序余聞之董生春秋文成數萬其指數千注張晏曰春秋萬八千字正義左氏丘明所修皆古文舊書多者二十餘通藏於秘府伏而未發漢武帝時河間獻左氏及古文周官成帝時劉歆校秘書見府中古文春秋左氏傳大好之傳多古字古言學者傳訓詁而已及歆引傳文釋經轉相發明說文序孔子書六經左丘明述春秋傳皆以古文禮記正義案古春秋左氏說周家封夏殷之後以為上公公羊傳莊七年四月不修春秋曰雨星不及地尺而復君子修之曰星霣如雨注不修春秋謂史記也古者謂史記為春秋疏據此傳則孔子未修之時已謂之春秋春秋正義禮坊記云魯春秋記晉云云皆在孔子之前竹書紀年三事與魯史同唯鄭棄其師出𤨏語晉春秋多是古史全文仲尼修經皆約䇿書成文丘明作傳博采簡牘衆記穀梁疏鄭衆賈逵之徒以為仲尼修春秋約之以周禮聘禮疏服䖍注左氏云古文篆書一簡八字左傳正義鄭𤣥注論語序以鉤命決云春秋二尺四寸書之五傳漢藝文志見上春秋分為五注韋昭曰謂左氏公羊穀梁鄒氏夾氏左氏正義太史公十二諸侯年表序云自孔子論史記次春秋七十子口受其傳魯君子左丘明懼妄意失真故具論其語成左氏春秋沈氏云嚴氏春秋引觀周篇云孔子將修春秋與左丘明乗如周觀書於周史歸而修春秋之經丘明為傳藝文志云左丘明魯史也是言丘明為傳以其姓左故號為左氏傳也或先經以始後經之事或後經以終前經之義或依經以辨理或錯經以合異有無傳之經有無經之傳漢儒林傳又見後漢興張蒼賈誼張敞皆修春秋左氏傳隋志左氏漢初出於張蒼之家左正義漢武時河間獻氏誼為訓故授趙人貫公子長卿授張禹非成帝時張禹禹為蕭望之言左氏望之薦禹徵待詔授尹更始更始傳子咸及翟方進胡常常授賈䕶䕶授陳欽而劉歆從尹咸及方進受由是言左氏者本之賈䕶劉歆劉歆言左丘明好惡與聖人同親見夫子公羊穀梁在七十二子之後後傳建武中鄭興陳元傳左氏學詳見春秋博士史通丘明援經立傳廣苞諸國蓋當時有周志晉乗鄭書楚杌等篇聚而編之混成一錄向使專憑魯䇿獨詢孔氏何以能殫見洽聞若斯之博公羊疏左氏先著竹帛漢時謂之古學平帝時立學官啖氏曰左氏比二傳其功最髙博采諸家叙事尤備吕氏曰左氏於定哀之間載孔子之事皆傳聞失實本不曾登聖門王安石疑左氏六國時人者十一事公羊戴宏序子夏傳與公羊髙穀梁疏公羊子名髙齊人受經于子夏孝經說云春秋屬商是也弟吳兢書目公羊髙乃子夏子髙傳子平平傳子地地傳子敢敢傳子夀至漢景帝時夀乃共弟子齊人胡母子都著於竹帛與董仲舒皆見於圖䜟疏公羊者子夏口授公羊髙五世相授漢景帝時公羊夀共弟子胡母生乃著竹帛儒林傳漢興言春秋於齊則胡母生於趙則董仲舒胡母生與仲舒同業齊之言春秋者宗事之公孫𢎞亦頗受焉武帝尊公羊家由是大興胡母生弟子嬴公授孟卿眭孟眭孟授嚴本姓莊彭祖顔安樂由是有嚴顔之學彭祖授王中中授公孫文東門雲安樂授泠豐任公有泠任之學六藝論云云安樂弟子泠豐劉向王彦彦一作亥疏廣事孟卿授筦路貢禹事嬴公授堂溪惠惠授㝠都有筦㝠之學後傳見春秋博士又唐檀習顔氏馬宫治嚴氏射䇿甲科郅惲治嚴氏李育習嚴氏陳重學顔氏隋志公羊傳十二卷嚴彭祖譔公羊解詁十一卷漢諫議大夫何休注董仲舒四傳至何休例休自謂本胡母生條疏左氏漢時謂之古學公羊漢世乃興故謂之今學許慎五經異義云古者左氏說今者公羊說是也穀梁吳兢書目秦孝公時人出麋信注楊士勛疏穀梁子名俶一云名淑字元始魯人一名赤阮孝緒亦以為名俶字元始風俗通穀梁名赤子夏弟子顔師古曰名喜受經于子夏為經作傳傳孫卿卿傳申公申公傳江翁儒林傳瑕丘江公受穀梁於魯申公傳魯榮廣皓星公受焉蔡千秋周慶丁姓皆從廣受宣帝興穀梁擢千秋為諫大夫尹更始事千秋又受左氏傳為章句傳子咸及翟方進房鳳江博士授胡常常授蕭秉君有尹胡申章房氏學隋志梁有穀梁傳十五卷漢諫大夫尹更始撰漢儒兼通穀梁左氏者胡常尹更始疏景帝好公羊胡母之學興仲舒之義立宣帝善穀梁千秋之學起劉向之意存按漢人以公穀為末世口說流行之學見於其書者又有尸子魯子髙子子司馬子子沈子子女子北宫子之流葉氏曰公羊穀梁受學於子夏出於䜟緯之書所謂說題辭者其言不經見鄒氏王吉傳吉通五經能為鄒氏春秋范升傳奏曰春秋之家又有鄒夾夾氏漢志鄒氏無師夾氏未有書史記正義七錄云建武中鄒夾氏皆絶隋志王莽之亂鄒氏無師夾氏亡孝經序學開五傳注鄒氏傳十二卷夾氏傳十一卷穀梁疏五家之傳鄒氏夾氏口說無文師既不傳道亦尋廢漢春秋博士講郎儒林傳贊武帝立五經博士春秋唯有公羊孝宣立穀梁後儒林傳公羊顔嚴穀梁三家皆立博士光武立十四博士春秋嚴顔嚴彭祖顔安樂左氏漢傳河間獻王立春秋左氏博士劉歆欲列學官哀帝令歆與博士講論其義博士不肻置對歆移書責之平帝時立左氏後傳陳元傳左氏為訓詁建武初議欲立左氏傳博士尚書令韓歆上疏范升奏左氏淺末不宜立升傳四年正月朝見雲臺升對曰左氏不祖孔氏師徒相傳又無其人奏左氏之失凡十四事又上太史違戾三十一事元上疏曰武帝好公羊衞太子好穀梁有詔太子受公羊不得受穀梁孝宣為石渠論而穀梁氏興至今與公羊並存先後所立不必相因升辨難凡十餘上帝卒立左氏學太常選博士四人元為第一帝用其次李封封卒左氏復廢賈逵建初元年奏曰光武奮獨見之明興左氏穀梁二家先師不曉圖䜟故令中道而廢帝令逵自選嚴顔諸生髙才者二十人教以左氏章紀八年十二月戊申選髙才生受左氏穀梁以扶微學廣異義公羊儒林傳兼用列傳齊胡母生為景帝博士與董仲舒同業仲舒孝景時為博士公孫𢎞亦頗受焉為博士眭孟授嚴彭祖顔安樂彭祖為宣帝博士疏廣事孟卿為博士後傳丁恭周澤甄宇習嚴氏建武間為博士張𤣥少習顔氏兼通數家法會顔氏博士闕𤣥試䇿第一拜博士諸生言𤣥兼説嚴氏宣氏不宜專為顔氏博士李育習公羊春秋拜博士建初四年論白虎以公羊義難賈逵穀梁傳瑕邱江公受穀梁於魯申公傳子至孫為博士宣帝善穀梁說以江公孫為博士周慶丁姓皆為博士侯霸事房元為都講申章昌為博士魏志黄初五年四月置穀梁博士隋志晉時穀梁范甯注公羊何休注左氏服䖍杜預注俱立國學至隋杜氏盛行服義及公羊穀梁浸微今殆無師說晉王接傳謂左氏辭義贍富自是一家書不主為經發公羊附經立傳經所不書傳不妄起於文為儉通經為長荀崧傳左丘明張本繼末發明經意多奇偉公羊髙親受子夏辭義清雋斷決明審穀梁赤師徒相傳文清義約是以三傳並行莫能孤廢左氏疏賈逵上春秋大義四十條以抵公穀又與左氏作長義至鄭康成鍼膏盲發墨守起廢疾自此以後二傳遂微左氏學顯何休序曰賈逵緣隙奮筆以為公羊可奪左氏可興公羊疏賈逵作長義四十一條云公羊理短左氏理長鄭衆亦作長義十九條十七事專論公羊之短左氏之長在逵之前戴宏作解疑論何休作墨守以距長義以强義為廢疾以難穀梁造膏盲以短左氏蓋在注傳之前穀梁疏鄭𤣥六藝論云左氏善於禮公羊善於䜟穀梁善於經漢春秋蕃露董仲舒傳所著皆明經術之意及上疏條敎凡百二十三篇志儒家而說春秋事得失間舉玉杯蕃露清明竹林之屬皆所著書名復數十篇十餘萬言皆傳於後世仲舒下帷發憤潛心大業令後學者有所統壹為羣儒首唐志仲舒春秋繁露十七卷七錄隋志同崇文目十七卷其書八十二篇義引宏博然篇第亡舛無以是正又即用玉杯竹林題篇疑後人取而附著云晁氏志史稱仲舒說春秋數十篇今益而為八十二篇又通名繁露未詳陳氏曰通典御覽所引皆今書所無中興書目十卷繁露之名先儒未有釋者案逸周書王會解天子南面立絻無繁露注云冕之所垂也有聨貫之象春秋屬辭比事仲舒立名或取諸此西京雜記仲舒夢蛟龍入懐乃作春秋繁露古今注牛亨問崔豹繁露者何曰綴玉而下垂如繁露也則繁露古冕之旒似露而垂史記上大夫董仲舒推春秋頗著文焉索隠曰繁露禮大司樂注董仲舒云成均五帝之學疏出繁露以為繁多露潤後漢書明徳馬后紀尤善周官董仲舒書注玉杯蕃露清明竹林之屬禮儀志注繁露曰大旱雩祭而請雨郎顗傳注亦引之輿服志注繁露曰劒之在左蒼龍之象通典亦引之止志又引雨書通鑑外紀繁露曰推神農以為九皇太平御覽寰宇記皆引繁露春秋會解所引十三條景祐四年四月歐陽修書其後云今其書纔四十篇又總名繁露失其真也館中見有八十餘篇多錯亂重復民間獻三十餘篇其間數篇在八十篇外董生儒者其論深極春秋之㫖然惑於改正朔而云王者大一元者牽於其師之說不能髙其論以明聖人之道慶厯七年二月樓郁序曰公羊之學後有胡母子都仲舒治其說程大昌曰館本十七卷紹興間董闕所進通以繁露冠書而玉杯清明竹林特各居篇卷之一有垂旒凝露之象玉杯竹林同為託物漢魏人為文名連珠其殆繁露之自出歟大昌為演繁露十四卷又續六卷樓鑰曰潘景憲本有八十二篇說文引仲舒在王道通三第四十四篇傳中對越三仁之問朝廷有大議使使者及廷尉張湯就其家問之求雨止雨三䇿仁愛陰陽徳刑之類皆在書中又有言曰不由其道而勝不如由其道而敗真得夫子心法八十二篇始楚莊王終天道施三篇闕玉杯第二竹林第三玉英第四一卷楚莊王玉杯二竹林三玉英精華四王道五滅國上下隨本消息盟會要正貫十指重政六服制象二端符瑞俞序離合根立元神保位權七考功名通國身三代改制一作文質官制象天堯舜湯武服制八度制爵國仁義法必仁且知九身之養對膠西合作江都觀徳奉本十深察名號實性諸侯五行闕文二篇十一為人者天地五行之義陽尊陰卑王道通三天容天辨在人陰陽位十二陰陽終始陰陽義陰陽出入天道無二暖燠孰多基義闕文一篇十三四時之副人副天數同類相動五行相勝相生五行逆順治水五行十四治亂五行五行變救五行五事郊語十五郊義郊祭四祭郊祀順命郊祀對十六執贄山川頌求雨止雨祭義循天之道十七卷天地之行威徳所生如天之為天地陰陽天道施第八十二玉杯竹林二篇之名未有以訂之仲舒對䇿云孔子作春秋先正王而繋以萬事見素王之文焉仲舒曰詩無達詁易無達吉春秋無達辭漢春秋決獄志儒家董仲舒百二十三篇春秋有公羊董仲舒治獄十六篇隋志仲舒春秋決事十卷唐志法家仲舒春秋決獄十巻黄氏正前傳淮南衡山反使仲舒弟子吕步舒治淮南獄以春秋議顓斷於外不請注應劭曰仲舒居家朝廷每有政議遣廷尉張湯問其得失於是作春秋決獄二百三十二事動以經對言之詳矣繁露曰春秋之聽獄也必本其事而原其志史記正義七錄曰春秋斷獄五卷崇文目春秋決事比十卷論衡董仲舒表春秋之義稽合於律無乖異者鹽鐵論春秋之治獄論心定罪志善而違於法者免志惡而合於法者誅終軍詰徐偃雋不疑論衞太子龔勝議朱博中丞衆奏薛況漢左氏訓故章句條例左氏國語解詁經傳義詁長經釋例三家經本訓詁前儒林傳又劉歆傳漢興北平侯張蒼及梁太傳賈誼張敞劉公子皆修左氏傳誼為訓故授趙人貫公為河間獻王博士尹更始受左氏傳取其變理合者以為章句傳子咸及翟方進房鳳鳳與劉歆共校書歆校秘書見古文左氏傳好之時尹咸治左氏共校經傳歆畧從咸及方進質問大義初學者傳訓故而已及歆引傳文解經由是章句義理備焉歆曰春秋左氏可立哀帝納之以問諸儒皆不對唯房鳳王龔許歆共移書責太常博士正義云鄭興父子及歆創通大義奏上左氏始得立學遂行於世鄭興傳從歆講正大義歆使撰條例章句傳詁言左氏者多祖於興子衆作春秋難記條例又作春秋刪隋志衆撰左氏條例九卷唐志衆牒例章句九卷陳元傳父欽事賈䕶元傳父業為之訓詁見上賈逵傳九世祖誼父徽從劉歆作左氏條例二十一篇逵兼通五家穀梁之說尤明左氏傳國語為解詁五十一篇左氏三十篇國語二十一篇永平中上疏獻之顯宗重其書寫藏秘館建初元年詔入講左氏傳使出左氏大義長於二傳者逵具條奏擿出三十事其餘同公羊者什七八左氏義深君父公羊多任權變且五經家無以證圖䜟明劉氏為堯後者左氏獨有明文帝嘉之令選公羊嚴顔諸生二十人敎以左氏與簡紙經傳各一通竹簡及紙也八年詔選髙才生受左氏逵所著經傳義詁及論難百餘萬言詩疏引賈逵注左傳隋志春秋釋訓一卷左氏經傳朱墨列一卷逵撰春秋左氏長經二十卷漢侍中賈逵章句左氏解詁三十卷春秋三家經本訓詁十二卷宋有三家經二卷亡唐志無經本二字注外傳國語二十卷唐志逵左氏長經章句二十卷李育傳習公羊作難左氏義四十一事與諸儒論於白虎觀以公羊義難賈逵何休追述育義難二傳頴容傳善春秋左氏著條例五萬餘言隋志春秋釋例十卷唐志七卷漢公車徵士頴容撰正義引穎氏有詩疏引穎子容釋例云大廟八名其體一也范􅋫論曰鄭賈之學為諸儒宗桓譚以不善䜟流亡鄭興以遜辭僅免賈逵能附會文致最差貴顯世主以此論學悲哉正義引逵春秋序世其處者為劉氏深疑此句或非本㫖蓋左氏不顯於先儒無以自申挿注比辭將以媚於世又引劉賈先儒云通劉賈許頴既不守例又亦不能盡五雉九扈引賈逵云漢春秋議前儒林傳武帝時董仲舒通五經能持論江公呐於口治穀梁上使與仲舒議不如仲舒而丞相公孫𢎞本為公羊學比輯其義卒用董生上因尊公羊家詔太子受之榮廣傳春秋於江公與公羊大師眭孟等論數困之隋志何休春秋漢議十三卷鄭𤣥駮何氏漢議二卷梁有服䖍漢議駮二卷唐志十一巻又有孔融春秋雜議難五巻麋信理何氏漢議二巻魏人春秋議十卷何休唐志何休漢議十卷鄭𤣥駮麋信注後傳何休以春秋駮漢事六百餘條妙得公羊本意服䖍又以左傳駮何休所駮漢事六十條漢殿中議公穀同異儒林傳宣帝聞衞太子好穀梁問韋賢夏侯勝史髙皆魯人言穀梁本魯學公羊乃齊學也宜興穀梁自元康中始講授郎十人至甘露元年積十餘嵗皆明習召五經名儒太子太傅蕭望之等大議殿中平公穀同異時公羊嚴彭祖申輓伊推宋顯許廣穀梁尹更始劉向周慶丁姓王亥議三十餘事望之等十一人各以經誼對多從穀梁漢春秋左氏圖隋志十巻漢太子太傅嚴彭祖撰唐志七巻止云春秋圖又古今盟會地圖一卷亡冥氏春秋禮冥氏注鄭司農云冥讀為冥氏春秋之冥疏冥氏春秋者冥氏作春秋書名若晏子吕氏春秋之類漢儒林傳堂谿惠授泰山冥都疏廣授琅邪筦路都路事顔安樂故顔氏有筦冥之學春秋五始王褒傳春秋法五始之要在審己正統師古曰元者氣之始春者四時之始王者受命之始正月者政敎之始公即位者一國之始胡廣曰五始一曰元二曰春三曰王四曰正月五曰公即位漢定春秋章句公羊春秋外傳㫖義傳鍾興受嚴氏春秋光武詔令定春秋章句去其複重以授皇太子又使宗室諸侯從興受章句樊鯈刪定公羊嚴氏章句號樊侯學張霸以樊鯈刪嚴氏春秋猶多繁辭減定為二十萬言更名張氏學興鯈並師丁恭光武召見興問經義遷左中郎將楊終著春秋外傳十二篇改定章句十五萬言北海敬王睦顯宗時作春秋㫖義終始論隋志漢末郗萌集圖緯䜟雜占為五十篇十五巻謂之春秋災異漢春秋刪鄭衆傳從父興受左氏春秋肅宗時受詔作春秋刪十九篇孔奮傳從劉歆受左氏春秋子竒作左氏刪刪定其義嘉作左氏說漢五家穀梁說章句賈逵傳能誦左氏傳雖為古學兼通五家穀梁之說注尹更始劉向周慶丁姓王亥見前書前儒林傳尹更始事蔡千秋及受左氏傳取其變理合者為章句隋志十五卷梅福傳明穀梁春秋漢公羊解詁條例何休傳作公羊解詁覃思不闚門十有七年又註訓孝經論語風角七分與其師博士羊弼追述李育之意以難二傳作公羊墨守言不可攻如墨翟之守城也十四巻左氏膏肓十巻穀梁廢疾三巻鄭𤣥傳乃發墨守鍼膏盲起廢疾休見而歎曰康成入吾室操吾矛以伐我乎休始答賈逵事因記左氏之短康成箴附逐章之下發墨守議膏盲詩正義引鄭箴膏盲禮明堂位疏引公羊疏禮大司徒疏器疏引發墨守膏正義引何休膏盲蘇氏釋云又引盲鄭箴云文選注引墨守隋志公羊解詁十一巻漢諫議大夫何休注唐志十三巻公羊條例一巻左氏膏盲十卷崇文目九卷巻中興書目第七闕公羊墨守十四巻唐志一卷公羊諡例一巻梁有公羊傳條例一巻並何休撰穀梁廢疾三卷何休撰鄭𤣥釋張靖箋穀梁疏案鄭釋廢疾張靖䇿廢疾左氏膏盲釋痾十卷服䖍撰唐志二卷序畧依胡母生條例隠括就繩墨講誦師言至於百萬猶有不解疏莊顔之徒疏胡母生本雖以公羊經傳授董氏猶自别作條例故何氏取之荀爽傳著春秋條例作公羊問及辨䜟隋志公羊傳問答九卷荀爽問徐欽答公羊論二卷晉庾翼問王愆期答劉陶傳詔次第春秋條例蜀志孟光好公羊而譏呵左氏吳志唐固為公羊穀梁傳注又國語注晁氏志董仲舒以公羊顯又四傳至何休鄭𤣥曰公羊善於䜟休注引䜟最多公羊疏三十卷徐彥撰以何氏三科九㫖為宗本其說曰何氏之意三科九㫖正是一事爾總而言之謂之三科析而言之謂之九㫖新周故宋以春秋當新王此一科三㫖也所見異辭所聞異辭所傳聞異辭此二科六㫖也内其國而外諸夏内諸夏而外夷狄此三科九㫖也何氏作文諡例云此春秋五始三科九㫖七等六輔二類之義三科九㫖見上五始者元年春王正月公即位是也七等者州國氏人名字子是也六輔者公輔天子卿輔公大夫輔卿士輔大夫京師輔君諸夏輔京師是也二類者人事與災異是也宋氏注春秋三科者一曰張三世二曰存三統三曰異外内九㫖者一曰時二曰月三曰日四曰王五曰天王六曰天子七曰譏八曰貶九曰絶時與日月詳畧之㫖也王與天王天子是錄遠近親疎之㫖也譏與貶絶則輕重之㫖也按三統厯云春為陽中萬物以生秋為陰中萬物以成故名春秋欲使人君動作不失中也晁說之曰何休特負於公羊之學五始三科九㫖七等六輔二類七缺之設何其紛紛邪既曰據百二十國寶書而又謂三世異辭何耶春秋說云有七缺夫婦君臣父子禮漢三傳異同說馬融傳融欲訓左氏春秋及見賈逵鄭衆注乃曰賈君精而不博鄭君博而不精既精且博吾何加焉但著三傳異同說漢左氏解誼達義隋志左氏傳解誼三十一卷九江太守服䖍注左氏膏盲釋痾十卷春秋成長說九卷塞難三巻服䖍撰梁有左氏達義一卷漢司徒掾王玢撰左氏傳三十卷王肅注董遇章句三十卷孫毓義注十八巻又賈服異同畧五卷王朗注十二卷漢諸儒傳左氏者甚衆賈逵服䖍並為訓解至魏遂行於世晉時服杜注俱立國學而唯傳服義至隋杜氏盛行服義浸微正義中興以後陳元鄭衆賈逵馬融延篤彭仲博許惠卿服䖍潁容之徒皆傳左氏魏世則王肅董遇為之注正義多引服說劉炫難服䖍云䖍解誼其文甚煩後漢傳服䖍作春秋左氏傳解行之至今又以左傳駮何休之所駮漢事六十條儒林謝該明春秋左氏建安初樂詳條左氏疑滯數十事問謝該皆為通解之名謝氏釋魏畧云今左氏樂氏問七十二事詳所廣也延篤從唐溪典受左氏論解經傳多駁正後儒服䖍等以為折中鄭𤣥通公羊又從張恭祖受左氏馬嚴通左氏孔喬學左氏蜀志尹黙傳益部多貴今文不崇章句黙從司馬徳操宋仲子等受古學皆通諸經史又專精於左氏春秋自劉歆條例鄭衆賈逵父子陳元服䖍注說咸畧誦述北齊書姚文安難服䖍解七十七條名曰駁妄李崇祖申明服氏名曰釋謬漢國語解詁見上賈逵傳為國語解詁二十一篇隋志春秋外傳國語二十卷賈逵注唐已亡亡鄭衆作國詩章句其為數唐志王義國語章句二十二卷唐固虞翻韋昭注孔鼂解各二十一卷吳韋昭集鄭賈虞唐四家為注史通左丘明既為春秋内傳韋昭注國語謂左傳為内傳又稽逸文纂别說分周魯齊晉鄭楚吳越八國事起周穆王終魯悼公為外傳國語二十一篇書目云其文以方内傳或重出而小異左傳正義傳𤣥云國語非丘明所作有共說一事而二文不同吳志注沈珩尤善春秋内外傳唐志雜家類晉孔衍春秋時國語十卷春秋後國語十卷唐盧藏用春秋後語十卷唐柳宗元非國語二卷劉貺外傳見竹書紀年宋庠補音三卷治平元年上之二月二十五日令國子監鏤板劉攽解駁左氏為内傳國語十巻漢書曰左丘明為傳又纂異同為國語司馬遷據左氏國語孔晁云左丘明集其典雅令辭與經相發明者為春秋傳其髙論善言别為國語漢春秋圖緯列傳魏朗字少英從博士郤仲信學春秋圖緯注孔子作春秋緯十二篇黨錮賈逵永平中上言左氏與圖䜟合者寫傳詁藏之秘書荀爽作公羊問及辨䜟明紀永平八年十月壬寅詔日食之變其災尤大春秋圖䜟所為至譴隋志梁有春秋緯三十卷宋均注史記孔子曰我欲載之空言正義此春秋緯文春秋命厯序詩生民疏緯候之書及春秋命厯序立五帝傳世之事為毛說者皆所不言鄭信䜟緯以命厯序云少昊傳八世顓頊傳九世帝嚳傳十世春秋少陽篇論語正義案春秋少陽篇伯夷叔齊姓名字諡白虎通春秋文義曰天子之社稷廣五丈諸侯半之魏春秋說要三傳論隋志春秋說要十巻魏樂平太守糜信撰春秋三傳論十巻魏大長秋韓益撰魏志孫叔然作周易春秋例毛詩禮記春秋三傳國語爾雅諸註蜀志李譔著古文易尚書毛詩三禮左氏傳太𤣥指歸皆依凖賈馬異於鄭𤣥吳志士燮耽玩春秋為之注解袁徽與荀彧書曰今欲條左氏尚書長義上之魏畧鍾繇不好公羊而好左氏謂左氏為太官而謂公羊為賣餅家數與嚴幹共辨折長短晉經傳集解釋例長厯盟會圖隋志春秋左氏經傳集解三十巻杜預撰梁有服䖍杜預音三巻唐志音二巻釋例十五卷梁有齊杜乾光釋例引序一巻左氏傳評二卷並預撰杜預序集解一卷劉炫注梁有春秋古今盟會地圖一卷杜預傳進爵當陽侯立功之後耽思經籍為春秋左氏經傳集解分經之年與傳相附比其義類隨而解之又參考衆家譜第謂之釋例又作盟會圖春秋長厯備成一家之學比老乃成又撰女記讃祕書監摯虞曰左丘明本為春秋作傳而左傳遂自孤行釋例本為傳設而所發明何但左傳故亦孤行武帝謂預曰卿有何癖對曰臣有左傳癖序傳或先經以始事或後經以終義或依經以辯理或錯經以合異隨義而發其例之所重其發凡以言例皆經國之常制周公之垂法史書之舊章仲尼修之以成一經之通體其微顯闡幽裁成義類者皆據舊例而發義指行事以正褒貶諸稱書不書先書故書不言不稱書曰之類皆所以起新舊發大義謂之變例然亦有史所不書即以為義者此蓋春秋新意故傳不言凡曲而暢之其經無義例因行事而言則傳直言其歸趣而已非例也預專修丘明之傳以釋經經之條貫必出於傳傳之義例總歸諸凡推變例以正褒貶簡二傳而去異端蓋丘明之志也劉子駿創通大義賈景伯逵父子許惠卿淑皆先儒之美者潁子嚴容淺近亦名家故舉劉賈許潁之違以見同異正義云服䖍之徒劣於此故不論分經之年與傳之年相附比其義例各隨而解之名曰經傳集解正義集解謂聚集經傳為之作解月太康元年三成别集諸例及地名譜第厯數相與為部凡四十部十五卷皆顯其異同從而釋之名曰釋例正義云釋例終篇云稱凡者五十其别四十有九蓋以母弟二凡其義不異故也釋例四十部無凡者十五終篇云諸凡雖是周公之舊典丘明撮其體義約以為言非純寫故典之文也隋志春秋五十凡義疏二卷發傳之體有三發凡正例趣新意變例歸非例為例之情有五微而顯志而晦婉而成章盡而不汙懲惡而勸善左傳正義杜别集諸例從而釋之事同則為部小異則附出孤經不及例者聚於終篇其四十部次第從隠即位為首先有其事則先次之唯世族土地事既非例故退之於後終篇宜最處末故次終篇之前終篇處其終土地之名起於宋衞遇于垂世族譜起於無駭地名在世族之前天子之見於經者三十有二稱天王者二十五稱王者六稱天子者一梁諸儒為左氏學者皆以賈服義難駁杜預凡一百八十條王元規引證通析無滯著春秋發題辭及義記十一卷左傳音三卷崔靈恩左氏經傳義二十二卷左氏條例十卷天監中靈恩申服難杜著左氏條義以明之虞僧誕申杜難服世並傳焉靈恩又有公穀文句義十卷後魏衞冀隆精服氏學難杜氏六十三事賈思同駁冀隆十餘條互相是非積成十巻詔下國學集諸儒考之晉春秋條例牒例劉寔傳尤精三傳辨正公羊以為衞輒不應辭以王父命祭仲失為臣之節又撰春秋條例二十巻隋志春秋條例十一巻唐志十巻晉劉寔撰經例十二巻方範撰左傳例苑十九卷劉寔等集解春秋序一卷春秋序論二巻干寶撰干寶獨美左傳以三十巻之約括囊二百四十年之事干寶為左氏義外傳注周易周官凡數十篇唐志劉寔左氏牒例二十巻晉春秋釋疑春秋調人左氏全綜儒林傳汜毓合三傳為解注撰春秋釋疑凡所述七萬餘言劉兆以春秋一經三家殊塗諸儒是非紛然互為讎敵乃思三家之異合而通之取周官調人之義作春秋調人七萬餘言論其首尾使大義無乖不合者舉其長短以通之又為春秋左氏解名曰全綜公羊穀梁解詁皆納經傳中朱書以别之又撰周易訓注及所讃述百餘萬言唐志劉兆三家集解十一卷隋志劉兆公穀集傳十二巻晉王接注公羊傳接謂公羊附經立傳經所不書傳不妄起於文為儉通經為長任城何休訓釋甚詳而黜周王魯大體乖硋且志通公羊而往往還為公羊疾病接乃更注公羊春秋多有新義又撰列女後傳七十二人喪亂盡失長子愆期緣父本意更注公羊又集列女後傳云隋志公羊傳十三巻唐志一卷晉散騎常侍王愆期撰詩鴻鴈疏引王愆期注公羊云梁有髙龍注公羊十二卷孔衍集解十四卷正義按孔舒元公羊傳本云麟孰為而至為孔子之作春秋刁氏例序一卷虞溥傳注春秋經傳郭瑀傳作春秋墨說孝經錯緯載記石季龍遣國子博士詣洛陽寫石經校中經于秘書國子祭酒聶熊注穀梁春秋列于學官晉穀梁集解范甯傳甯字武子以春秋穀梁氏未有善釋遂沈思積年為之集解其義精審為世所重既而徐邈復為之注儒林傳徐邈撰正五經音訓所注穀梁傳見重於時隋志十二巻唐志又傳義十巻音一卷隋志穀梁傳十二卷范甯集解傳例一卷甯撰穀梁先有尹更始隋志梁有十五卷唐固十三卷麋信十二卷孔衍十四卷江熈唐志二傳評三卷叚肅十四卷張靖十一卷等十餘家注解范甯以為膚淺乃商略名例為集解十二卷例一卷隋志同以疏云范所據别為例畧一百餘條甯子泰雍凱從弟邵及其父汪門生故吏商略同異撰諸子之言各記姓名文中子范甯有志於春秋證聖經而詰衆傳序曰左氏艷而富其失巫穀梁清而婉其失短公羊辨而裁其失俗左氏有服杜之注公羊有何嚴之訓晁說之曰穀梁晚出於漢因得監省左氏公羊之違畔而正之至其精深遠大者真得子夏之所傳范甯又因諸儒而博辨之申穀梁之志也其於是非亦少公矣非若征南一切申傳汲汲然不敢異同也晁公武曰三傳之學穀梁所得最多諸家之解范甯之論最善隋志徐乾注十三卷胡訥集解十卷亡六經典序録十巻程闡十卷孔君指訓十巻張程孫劉四家集解四卷殘闕劉兆公羊穀梁傳十二巻兆傳為公羊穀梁解詁晉春秋後語見續春秋唐志盧藏用春秋後語十卷晉春秋博士荀崧傳元帝踐阼太興初轉太常時左傳杜氏服氏各置博士一人其公羊穀梁省不置崧上疏曰春秋公羊其書精𨼆明於斷獄穀梁簡約隠要孔子作春秋左丘明子夏造䣛親受無不精究丘明撰所聞為傳其書善禮多膏腴美辭張本繼末以發明經意信多竒偉儒者稱公羊髙親受子夏立於漢朝辭義清俊斷決明審多可採用董仲舒之所善也穀梁赤師徒相傳暫立於漢時劉向父子猶執一家莫肯相從其書文清義約諸所發明或左氏公羊所不載亦足訂正是以三傳並行博士宜各置一人以傳其學元帝詔曰穀梁膚淺不足立博士餘如所奏見宋志春魏黄初五年四月置秋穀梁博士北史趙世業家有服氏春秋是晉世永嘉舊寫徐遵明往讀之因手撰春秋義章為三十卷劉獻之三傳畧例三卷李􅉗撰定三傳異同唐志李􅉗三傳異同十二巻齊書永明八年晉安王子懋撰春秋例苑三十卷奏之武帝敕付祕閣梁書劉之遴著春秋大意三傳同異合三十事武帝詔答曰丘明傳洙泗之風公羊宗西河之學張蒼傳左氏賈誼襲荀卿源本分鑣指歸殊致隋志春秋五辯二卷梁五經博士沈宏撰春秋三傳評十卷胡訥撰左傳述義四十卷劉炫撰書目今存一巻崇文目同唐志梁簡文帝左氏傳例苑十八卷隋劉炫攻昧十二卷規過三卷正義引劉炫規過述議三十七卷辛惪源集注春秋三傳三十卷唐六十六家春秋藝文志春秋六十六家一百部一千一百六十三卷始於左丘明外傳國語次董仲舒繁露終於楊士勛穀梁疏失姓名五家左氏之學有賈逵董遇王肅王朗杜預鄭衆潁容劉寔服䖍孫毓梁簡文殷興何始真張冲孔潁達之屬公羊之學有董仲舒嚴彭祖何休孔氏王愆期之屬穀梁之學有尹更始叚肅唐固麋信張靖程闡孔衍范甯徐乾徐邈沈仲義蕭邕江熈楊士勛之屬三傳則有劉兆韓益胡訥潘叔度李􅉗之學國語則有王肅唐固虞翻韋昭孔鼂之學又有士燮之注經干寶之義傳吳略之詭例京相璠顧啓期之地名大夫譜王延之李謐之㫖通叢林崔靈恩沈宏文阿之義解義畧劉炫之攻昧規過及答問辭苑辨證義難之流不著錄者始於王𤣥度注左氏傳左氏有纂要集傳義疏音注序釋疑事類公穀有總例以三傳名書有異同指要總例以春秋名書有後語振滯通圖集注集傳纂例微㫖辨疑加減指掌指元通例折衷義鑑而終以柳宗元非國語凡二十二家四百三卷隋志九十七部九百八十三卷崇文目三十三部三百九十六卷中興目一百二十三家一千四百八十卷續書目十八家二十部四百卷唐春秋正義志春秋正義三十六卷孔潁達谷那律楊士勛朱長才奉詔撰馬嘉運王徳韶蘇徳融隨徳素等對趙𢎞智覆審永徽四年二月二十四日上序曰前漢傳左氏者有張蒼賈誼尹咸劉歆後漢有鄭衆賈逵服䖍許惠卿等各有訓詁然雜取公穀以釋左氏晉杜元凱為集解專取丘明之傳以釋孔氏之經晉宋傳授以至于今為義疏者有沈文阿蘇寛劉炫沈氏於經傳極疎蘇氏唯旁攻賈服劉炫實為翹楚而性好非毁規杜氏之失凡一百五十餘條然比諸義疏猶有可觀今據以為本其有疎漏以沈氏補焉宋淳化七年十月孔維等校正上之志又有楊士勛穀梁疏十二卷徐文遠左傳義疏六十卷書目潁達參劉沈之說兩義俱違則斷以己意崇文目春秋正義三十六卷穀梁公羊疏各三十卷公羊疏不知撰人或云徐彦撰邢昺等是正書目同隋志沈文阿左氏經傳義畧二十五卷王元規續十卷經典序錄云梁沈文阿撰春秋義疏闕下袟陳王元規續成之劉炫左傳述義四十卷唐春秋通例韓滉傳治易春秋著通例及天文事序議各一篇舊史著春秋通例及天事序議各一巻志韓滉春秋通一卷陸希聲春秋通例三卷因三傳之例裁正以通聖人之㫖崇文目巻同唐春秋集傳纂例啖助傳善為春秋考三家短長縫䘺漏闕號集傳凡十年乃成復攝其綱條為例統門人趙匡陸質其髙弟也質本名淳質與其子異裒錄助所為春秋集注總例請匡損益質纂會之號纂例志陸質集注二十卷纂例十卷序云啖氏製統例分疏通會其義趙氏損益多所發揮今纂而合之凡四十篇微㫖二卷書目微㫖三卷辨疑七卷辨疑摭三家得失訂以啖趙之說微㫖頗采三傳舊說以聞於師者斷其當否每一篇必稱淳聞於師曰其柳宗元謂明章大中發露公器其道以堯舜為的法以文武為首以周公為翼樊宗師集傳十五卷會要貞元十九年給事中陸質著集注二十卷類禮二十卷君臣圖翼三十五卷上之唐春秋義統書目春秋闡微纂類義統十巻皇朝章拱之作春秋統微序趙氏集啖氏統例集注二書及已說可以例舉者為闡微義統十二卷第三四卷亡逸今本同趙匡字伯循國史志同文中子世家王述著春秋義統唐春秋纂要經傳要畧御集列國經傳志髙重春秋纂要四十卷重士廉五代孫文宗時翰林侍講學士帝好左氏春秋命重分諸國各為書别名經傳要畧經解類髙重經傳要畧十巻會要同許康佐集左氏傳三十卷一作文宗御集實錄太和九年四月癸亥許康佐進纂要左氏傳三十卷五月乙巳朔以御集左氏列國經傳三十卷宣付史館會要太和九年五月御集春秋左氏列國經傳三十卷唐春秋摘微書目盧仝春秋摘微一卷十二公凡七十六事晁氏志唐盧全春秋摘微四卷其經解不用傳然㫖意甚疎韓愈謂獨抱遺經究終始蓋實錄也祖無擇得之於金陵崇文目不載唐三傳異同會要元和四年四月給事中馮伉著三傳異同三卷志馮伉三傳異同三卷李氏三傳異同例十三卷開元中失名劉軻三傳指要十五卷序云先儒以春秋之有三傳若天之有三光會三家必當之言列于經下唐春秋加減志一卷元和十三年國子監修定書目一巻崇文目同訂正左氏句讀字畫訛舛唐三傳總例九經師授譜春秋通例韋表微傳敬宗時為翰林學士遷中書舎人尤好春秋病諸儒執一槩是非紛然著三傳總例志二十卷全會經趍又以學者薄師道不如聲樂賤工能尊其師著九經師授譜詆其違舊史譜一卷總例二十巻志成𤣥公公穀總例十卷咸通山陽令陸希聲春秋通例李氏三傳異同例見上北史張思伯善說左氏撰刋例十卷唐春秋圖志張傑春秋圖五卷又春秋指元十卷崇文目春秋精義二十卷指元十卷書目春秋圖一卷唐會昌中黄敬密撰國史志云春秋兩霸列國指要圖之序有晉霸楚霸語春秋名號歸一圖二卷名字同異錄五卷蜀馮繼先撰春秋龜鑑圖一卷張暄撰自魯周迄陳蔡載其名氏崇文目春秋圖五卷演左傳諡族圖五卷春秋名號歸一圖二卷左氏所書人或字或號或爵諡多互見取以系名下唐春秋指掌圖志李瑾十五卷書目卷同上李瑾集諸家之說為序義凡例各一篇抄孔潁達正義為五篇采摭餘條為碎玉一篇集先儒異同辨正失得為三篇取劉炫規過申訂其義為三篇大抵專主杜學崇文目同國史志春秋指掌圖二卷融據李瑾指掌為圖不著姓唐春秋折衷志陳岳三十卷唐末江西從事晁氏志春秋折衷論三十卷陳岳撰以左氏為上公羊為中穀梁為下比其異同而折中之書目春秋折衷論記三傳異同參求其長唐春秋義鑑義畧志郭翔春秋義鑑三十卷崇文目在類書類儒家章懷太子春秋要錄十巻隋書張冲字叔元撰春秋義畧隋志張冲三十卷春秋十二國年厯國史志一卷不知撰人春秋新義十卷林槩辨國語三卷天禧春秋要言見御製天禧春秋纂類集議畧論統微通義會義機括書目天禧中葉清臣取左氏傳隨事編類為二十六門十卷名春秋纂類慶厯中大理丞李堯俞辨三傳諸家得失及采陳岳折衷總其類例五百餘目而成一百九十五論進表稱春秋集議畧論三十卷今分上下二卷章拱之統微二十五卷據三傳啖趙意所不及者斷以己見并采陸淳可取之義至和中太常博士王晢撰春秋通義十二卷據三傳注疏及啖趙之學其說通者附經文之下缺者用己意釋之又異義十二巻皇綱論五卷二十三篇論辨大義例嘉祐中杜諤撰春秋會義二十六卷自左氏至啖趙及皇朝諸儒三十餘家集其論議繫經下釋例繁露規過膏肓先儒同異篇指掌碎玉折衷掌議纂例辨疑微㫖摘微通例胡氏論箋義總論尊王發微本㫖辨要㫖要集議索𨼆新義經社三十餘家成一書其後仍斷以己意元豐中沈括撰春秋機括三卷上卷以魯公甲子紀周及十二國年譜中卷載周及十二國譜系世次下卷記列國公子諸臣名氏其無異名者不錄景祐春秋集傳春秋要論元年正月甲戌十三日河北漕臣王㳂上集傳十五巻書目明道中撰復上書以春秋論事上嘉其好學詔奬諭加直昭文館十二月二十一日崇政殿說書賈昌朝撰春秋要論十卷五册乞付臣㸃句音切詔令舎人院試二年二月五日詔直集賢院慶厯春秋尊王發微慶厯中國子監直講孫復著尊王發微十一篇大約本於陸淳而增新意書目十二卷又總論三卷總類例而為之斷皇祐春秋列國類纂春秋辨要皇祐五年宋敏修上所著列國類纂四月十三日召試學士院嘉祐三年楊繪獻書意詩㫖春秋辨要十卷閏十二月二十六日命為集賢校理嘉祐春秋新意成都宋堂嘗擬陳子昻作感遇詩以諷上建儲事著蒙書數十篇春秋新意七蠧西北民言頗究時務嘉祐元年翰林學士趙槩上其所著書十月二十三日以為四門助敎元豐左氏春秋年表元豐中楊彦齡撰二巻據經傳嵗月為表首叙周魯繼以齊晉秦宋衛陳蔡曹鄭吳楚越之國其下總記戎狄蠻夷之事紹興中韓璜撰人表一卷環中左氏二十國年表一卷列國臣子表十卷中進春秋年表五年五月己亥沈與求奏先魯後周非尊王意乾徳四年四月庚戌國子丞楊均上魯史分門屬類賦三卷詔褒之紹興十六年三月鄭邦哲進左氏韻類元祐中晁補之撰左氏雜論一卷指左傳之失凡四十六條宋朝春秋傳劉敞著春秋傳十五卷權衡十七卷說例二卷中興書目一卷例凡四十九文權二卷意林五卷中興目意林二卷衡總四十巻無文權權論三傳之失意林叙其解經之㫖劉氏傳其所解經蘇轍傳十二卷本左氏參公穀啖趙趙瞻經解義例三十卷春秋論二十卷孫覺經社要義六卷分為類例攷據諸傳以解經㫖其學亦出啖趙凡四十餘門春秋學纂十三卷其說以穀梁為本及采左氏公羊歴代諸儒所長間以其師胡瑗之說斷之分莊公為上下丁副春秋演聖統例二十卷田偉書目副作論許洞春秋釋幽五卷劉熙古春秋極論二篇演例三篇任伯雨繹聖傳十二卷馬擇言春秋要類五卷崇文目在類書家安國通義二十四卷張大亨通訓十七卷陸佃後傳二十卷鄭昻春秋臣傳三十巻以人類事凡二百十五人附而名者又九十三黎錞春秋經解十二巻劉絢春秋五卷王當春秋十二卷列國諸臣傳五十一卷馮正符得法忘例論三十卷晁氏志其書例最詳悉務通經㫖熙寧八年何郯奏之不報意者王安石不喜故也馮山通解十二卷余安行新傳十二卷張根春秋指南十卷以征伐會盟年經而國緯胡銓集善十三卷鄭樵傳十二卷春秋考十二卷凡經文音義之訛者正之葉夢得春秋讞三十卷春秋考十二卷傳二十卷夢得又有指要總例二卷例論五十九篇紹興中劉本春秋中論三十巻紹興中髙閌春秋集注十四卷洪興祖春秋本㫖二十卷薛季宣經解指要十四卷序言諸侯無史吕本中集解十二卷吕祖謙左傳類編六卷陳傅良春秋後傳左氏章句四十二卷建炎春秋時論春秋類纂書目一卷建炎中李棠撰專采時議為論一十八篇鄭績采左氏為紀傳六十卷名春秋類纂紹興春秋口義二年十一月辛酉詔自今住講日令經筵官輪進春秋口義一授至開講日如舊三年二月丁亥朔右諫議徐俯進春秋解義至天王使宰渠伯糾來聘用左氏說父在故名上謂俯曰魯桓公簒立天王當致討既四年不問乃使其宰往聘失政刑矣故書名以貶之戊子俯乞編之記注紹興中侍講朱震講義三卷侍講范冲左氏講義四卷紹興春秋傳建炎二年六月戊辰江端友請下湖州取崔子方所著春秋傳藏秘書經解十二巻本例例要一巻之紹興六年八月子方之孫岩上紹興五年四月一日詔徽猷待制胡安國經筵舊臣今以所著春秋傳纂述成書進入十年三月書成上之表云六年十二月上詔奬諭除寶文直學士賜銀幣凡三十巻十萬餘言載孟氏而下七家發明綱領之詞于卷首事按左氏義采公穀之精者大綱本孟子而微詞多以程氏之說為證春秋立法謹嚴而宅心忠恕傳外復有總貫條例與證據史傳及學徒問答二百餘章子寧集錄名曰通㫖一卷紹興春秋四譜四年鄧名世上春秋四譜六卷名世以經傳國語參合援據為國譜年譜地譜人譜辨論譜說十篇一卷辨先儒言經傳之失考訂明切三月二十五日引見九月六日賜出身充史館校勘崇文目春秋世譜七卷宗族名諡譜五卷書目唐楊蘊撰春秋公子譜一卷載帝王以來至春秋京兆杜氏春秋譜六卷唐志顧啓期大夫譜十一卷元祐中孫子平練鳴道春秋人譜一卷凡編三十八國千七百六十三人分三卷今合為一紹興春秋明例素志書目一卷紹興中舒州布衣王日休撰凡十篇通謂之明例又冠以例要例意例釋又有孫復解三傳辨失四卷夏休撰春秋素志三百十五卷凡三百萬言謂出於𤣥聖素王之志名曰素志又畧其文而約說之為麟臺獨講十一卷續目淳熙中晁公武進故訓傳三十卷紹興春秋總鑑春秋正辭十二年十二月庚申詔董自任上春秋總鑑可采宜處以太學錄之職其書秘省錄進凡十二卷類集本末而為解義十三年正月戊午畢良史獻春秋正辭二十卷詔諫議羅汝楫司業髙閌看詳來上特改京官又正辭通例十五巻十一年六月壬午吳曾獻所著左氏發揮補右迪功郎隆興左氏國紀春秋分記續目左氏國紀三十卷隆興初徐得之編析諸國之事每國各繋以年疏其說於後春秋分記九十卷程公說撰推春秋㫖義即左氏傳分而記焉又旁采公穀諸子之說附其下又為年表世譜世本及天文疆域禮樂諸書次國小國著錄吳元緒鼓吹鄧埏類對文濟道綱領四卷又有蒙求三卷王舜俞序淳熙春秋集解春秋通志十年六月二十二日知潭州林栗著經傳集解三十三卷乞投進十一年十二月四日上之付秘省十二年二月一日任清叟進曾祖伯雨春秋繹聖傳十二卷十四年九月十七日朱佺進伯父長文春秋通志十册並付秘省書目通志十二卷折衷三傳旁考啖趙陸淳之說及推演孫復之言漢時易與論語分為三詩分為四禮分為二及學者散亡僅存其一餘家皆廢獨春秋三傳並行至今於聖人之㫖各有得焉漢武宣之世信重其書學士大夫誦說用以斷獄決事雖萬目未張而大綱克正其效亦可見矣箋傳之學惟春秋為難工經理也史事也春秋名經而實史也專於經則理虚而無證專於史則事礙而不通所以難也詩正義云漢初為傳訓者皆與經别行三傳之文不與經連故石經書公羊傳皆無經文左氏傳事不傳義是以詳於史而事未必實以不知經故也公穀傳義不傳事是以詳於經而義未必當以不知史故也杜征南作釋例啖助作統例陸淳合啖趙之說作纂例韓滉作通例陸希聲亦作通例李瑾作凡例孫明復作總例孫復丁副作統例王晢作明例隠括胡安國作通例程逈作顯微例目三巻六十五首葉夢得作指要總例崔子方作本例胡母生何休公羊鄭興及子衆賈徽潁容左氏荀爽劉陶總春秋為條例夏五之闕艮八之占春秋始於元終於麟玉海卷四十
