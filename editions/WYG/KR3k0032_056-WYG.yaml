body:
  text: 玉海卷五十六宋王應麟撰藝文圖黄帝緑圖明堂圖風后圖見後賈誼新書修政語上黄帝職道義經天地紀人倫序萬物然後濟東海入江内取緑圖西濟積石涉流沙登於崑崙河圖挺佐輔黄帝齊七日至翠媯之川魚泝流而至汎白圖蘭葉朱文以授帝與天老迎之帝舒視之名曰錄圖中􅀱曰河龍圖出洛龜書感赤文像字以授黄帝淮南子至徳之世洛出丹書河出緑圖書正義緯􅀱之書乃稱有黄龍元龜白魚赤雀負圖銜書以授聖人正典無其事漢自哀平之間緯􅀱始起假託􅀑神妄稱祥瑞選注世本曰史皇作圖宋忠曰史皇黄帝臣圖謂畫物象尚書璇璣鈐孔子曰五帝出授緑圖伊尹九主圖史記伊尹從湯言素王及九主之事注劉向别錄九主者有法君專君授君勞君等君寄君破君固君三嵗社君凡九品圖畫其形索隱曰九主者三皇五帝及禹家語孔子觀於明堂覩四墉有堯舜桀紂之象各有善惡之狀興廢之誡周丹圖禮秋官司約小約劑書於丹圖注丹圖未聞或者雕器簠簋之屬有圖象者與春秋傳著於丹書今俗語有鐵劵丹書豈此舊典之遺言周明堂周公圖家語觀周第十一孔子觀乎明堂觀四門墉有周公相成王抱之負斧扆南靣以朝諸侯之圖孔子曰此周之所以盛也有周盛時褒賞功徳或藏在盟府或紀于太常或銘于昆吾之鼎獨周公有大勲勞於天下廼繪象於明堂之墉期億萬年無忘師保之徳使覩之者肅然動心願竭忠盡瘁追配前人褒崇勸奬之道於是為至齊管子幼官圖管子經言幼官篇第八注幼始也陳從始輔官齊政之法幼官圖第九有五方本圖有五方副圖西南中北東注云此立時之政管氏别五其圖謂之方圖而土位居中漢三禮圖唐三禮圖周明堂宗廟圖後魏禮志阮諶禮圖并載秦漢已來輿服阮氏圖桑車亦飾以雲母魏志注阮諶字士信造三禮圖傳于世隋志三禮圖九卷鄭𤣥及後漢侍中阮諶等撰周室王城明堂宗廟圖一卷祁諶撰梁又有冠服圖五宗圖月令圖各一卷周官禮圖十四卷唐志夏侯伏明三禮圖十二卷著錄張鎰三禮圖九卷不著錄藝術有禮圖等雜畫五十六卷崇文目三禮圖九卷梁正撰續漢志術氏冠官有其圖注光武紀初起明堂注禮圖曰明堂上圓下方隋書宇文愷云建武三十年作明堂禮圖有本仲長統傳發清商之妙曲注三禮圖曰琴本五􅁌曰宫商角徵羽文王增二曰少宫少商絃最清也明堂位疏引阮諶禮圖云犧尊畫以牛形春秋疏引阮諶三禮圖冕制隋禮儀志引禮圖曰璫綴於革帶阮諶以為有章印則佩之又大裘而冕案三禮衣服圖高山冠武弁亦引禮圖北史劉芳傳諸家禮圖社稷皆畫為木惟誡社誡稷無木吳薛綜定五宗圖楊傑補正三禮圖次篇序曰禮圖之次一曰地制八卷二曰丘壇三卷三曰宗廟二卷四曰宫室五曰庠序共一卷六曰衣冠三卷七曰車旗三卷八曰寳貨一卷九曰物用三卷十曰樂制一卷十一曰武制二卷十二曰厯象三卷十三曰失令災應共二卷通圖議三卷叙目三卷為三十八卷漢周公負成王圖霍光傳上察羣臣唯光可屬社稷廼使黄門畫者畫周公負成王朝諸侯以賜光後元二年春光問誰當嗣者上曰君未諭前畫意邪立少子君行周公之事周章傳論身非負圖之託注武帝欲立昭帝為太子乃畫周公負成王圖賜霍光漢禹貢圖王景傳見地理漢汴渠平當以經明禹貢使行河國史志孟先禹貢治水圖一卷漢兵家圖兵形勢圖陳圖見後藝文志兵權謀吳孫子兵法圖九卷齊孫子圖四卷兵形勢十一家圖十八卷楚兵法圖四卷孫軫圖二卷王孫圖五卷魏公子圖十卷兵隂陽圖十卷黄帝圖三卷風后圖二卷鵊冶子圖一卷􅀑臾區圖一卷别成子望軍氣圖三卷兵技巧鮑子兵法圖一卷伍子胥圖一卷苖子圖一卷凡兵書五十三家圖四十三卷任宏校兵書分四種蕭何入咸陽先取秦圖書王儉七志一志專收圖譜謂之圖譜志阮孝緒七録内篇有圖七百七十卷外篇有圖百卷漢宫室制度圖見宫類漢官鹵簿圖見鹵簿漢外屬圖竇融𫝊上書請師期以伐隗囂帝賜融以外屬圖及太史公五宗世家景帝子十三人而母五人同母者為一宗魏其侯列𫝊詔報曰每追念外屬孝景皇帝出自竇氏定王景帝之子朕之所祖昔魏其一言繼統以正長君尊奉師傅修成淑徳施及子孫此皇太后神靈上天所以佑漢也漢御座新屏列女圖宋𢎞傳建武中御座新屏風圖畫列女帝數觀視之𢎞曰未見好徳如好色帝即為撤之梁后紀常以列女圖畫置左右以自監戒注劉向撰列女傳八篇圖畫其象又見屏風類班倢伃賦陳女圖以鏡監兮願女史而問詩漢秘書列仙圖列仙傳東平王蒼傳帝建初六年冬上疏求朝明年正月帝許之遣謁者賜貂裘三月鴻臚奏遣諸王歸國帝特留蒼賜以秘書列仙圖道術秘方隋經籍志漢時阮倉作列仙圖劉向校理經籍始作列士列仙列女傳列仙傳讚三卷劉向撰鬷續孫綽讚又二卷晉郭元祖賛集賢注記云阮倉仙圖一卷集賢無本漢神輸圖藝文志易類神輸五篇圖一劉向云王道得則四海輸之祥瑞也晉爾雅圖見上梁職貢圖見朝貢藝文類聚梁元帝職貢圖名畫記元帝畫職貢圖并序外國貢事唐地理志梁元帝一卷崇文目同書目云其自序云乃纂百國一卷今存二十有七李公麟有帖云梁元帝鎮荆州作職貢圖首虜而終䗺凡三十餘國今纔二十有二其一曰魯國南史及通典太平御覽皆無魯國與丙丙國其下二十國則有之河南中天竺師子北天竺渴盤陀武興蕃滑波斯百濟龜兹倭因古柯呵𤭔檀胡密丹白題末林邑婆利宕昌狼牙修皆朝貢於梁者武帝紀中又有扶南鄧至于闐蠕蠕高麗干陁利新羅盤盤丹丹九國豈圖之所遺邪亦不見所謂䗺者疑丙丙與芮芮相類即蠕蠕也通志云二十八國崇文目又有職貢圖三卷名賢晝錄閻立德職貢圖唐正㑹圖王㑹圖朝貢圖東謝蠻傳貞觀三年其酋元深入朝冠烏熊皮若注旄以金銀絡額被毛帔韋行縢著履中書侍郎顔師古因是上言昔周武王時逺國入朝太史次為王㑹篇今蠻夷入朝如元深冠服不同可冩為正㑹圖詔可帝以其地為應州即拜元深刺史藝文志顔師古正㑹圖卷亡通鑑貞觀三年閏十二月丁未東謝酋長謝元深南謝酋長謝强來朝顔師古請圖寫以示後作王㑹圖從之通鑑考異云實録新舊傳皆云正㑹圖按周書有王㑹篇栁宗元鐃歌吕述黠戞斯朝貢圖皆作王㑹今從之黠戞斯傳阿熱破囬鶻得太和公主遣使衛送還朝復遣注吾合素上書三嵗㑹昌中至京師武宗大悅班渤海使者上以其處窮逺能脩貢命大僕卿趙蕃持節慰其國詔宰相即鴻臚寺見使者使譯官考山川國風宰相徳裕上言貞觀時逺國皆來中書侍郎顔師古請如周史集四夷朝事為王㑹篇今黠戞斯大通中國宜為王㑹圖以示後世有詔以鴻臚所得繢著之詔阿熱著宗正屬籍黠戞斯古堅昆國也貞觀二十二年遣使獻方物其酋長俟利發入朝髙宗世再來朝景龍中獻方物𤣥宗世四朝獻乾元中為回紇所破自是不通中國志地理類吕述黠戞斯朝貢圖傳一卷㑹昌秘書少監栁宗元鐃歌既克東蠻羣臣請圖王㑹百辟拜稽首咸願圖形容如周王㑹書永永傳無窮睢盱萬狀乖吚嗢九譯重詳見朝貢類唐太宗冩真圖舊紀開元十八年奚契丹犯塞六月丙子以肅宗為河北道元帥命百寮於光順門相見張說謂學士孫逖韋述曰嘗見太宗冩真圖忠王雅類聖祖此社稷之福乾元元年四月丁未内出皇帝冩真圖自光順門送太清宫志有韋無忝畫皇朝九聖圖唐忠孝圖君臣圖㑹要貞觀十三年十一月三日揚州長史李襲譽撰忠孝圖二十卷上之太宗覽而稱善陸贄著君臣圖翼三十五卷舊史二十五卷贄永貞年侍東宫為古君臣圖以獻志李襲譽忠孝圖傳讃二十卷傳記類唐本草圖志醫術類本草二十卷藥圖二十卷圖經七卷顯慶四年李勣等撰蘇敬新脩本草二十一卷又新脩本草圖二十六卷圖經七卷雜藝術類王定畫本草訓誡圖貞觀尚方令于志寧傳與李勣脩定本草并圖五十四篇太宗稱善㑹要顯慶二年右監門長史蘇敬上言請加刪補令勣監定并圖五十卷至四年正月十七日上之唐秘閣梁南郊圖車服志睿宗時皇太子將釋奠有司草儀注從臣乘馬着衣冠左庶子劉子𤣥議曰議者以秘閣梁武帝南郊圖有衣冠乘馬者此圖後人所為也古今圖畫多矣如畫羣公祖二疏而有曳芒屩者張僧繇畫昭君入匈奴而有施帷冒者閻立本豈可因二畫以為故實乎謂衣冠乘馬宜省太子從之編于令通典却非冠梁北郊圖執事者縮纓緌隋志禮類梁有郊祀圖二卷亡唐内殿無逸圖崔植傳長慶初穆宗問貞觀開元治道植曰𤣥宗即位得姚宋納君於道璟嘗手寫無逸為圖以獻勸帝出入觀省以自戒其後開元之末朽暗乃易以山水圖稍怠于勤今願陛下以無逸為元龜李珏傳武宗新聽政珏數稱道無逸篇以勸㑹要長慶元年八月崔植對云開元初宋璟為相手寫無逸一篇為圖以獻𤣥宗置之内殿出入觀省唐國史紫宸殿設無逸圖唐明堂圖權德輿傳元和六年三月對曰太宗見明堂圖始禁鞭背之制志云覽明堂針灸圖㑹要貞觀四年十一月十七日制决罪人無得鞭背隋志醫方梁有神農明堂圖一卷甄權傳撰脉經針方明堂等圖傳于時唐五位圖王起傳起字舉之文宗好古學是時鄭覃以經術仕王起以淳朴顯起加皇太子侍讀開成初判太常卿事上使廣五位圖俾太子知古今治亂帝常以疑事令使者口質起具榜子附使者上凡成十篇號曰寫宣志編年類五位圖十卷廣五運圖卷亡曹圭五運錄十二卷崇文總目王氏五位圖三卷書目同自開闢至唐以五運為序宋朝至道二年四月甲申屯田郎吕奉天言司馬遷史記王起五位圖嵗次朔閏皆與經傳不合唐太液亭君臣事迹圖尚書圖文宗太和二年自撰集尚書中君臣事迹命畫工圖太液亭朝夕觀覽明皇内殿無逸自張文宗太液尚書是錄唐孝友傳圖唐朝綱領圖聖運圖李棲筠為常州刺史大起學校堂上圖孝友傳示諸生為鄉飲禮人人知勸為刻石頌徳進銀青封贊皇子志雜史南卓唐朝綱領圖一卷起髙祖訖宣宗以年書一時黜陟廢置之要薛璫唐聖運圖二卷崇文目同唐毛詩草木蟲魚圖見詩類二十卷開成中楊嗣復等上一云毛詩物象圖唐占額供軍圖詳見㑹計類均田圖王彦威傳開成初召為户部判度支奏曰臣按見財量入為出隨色占費終嵗用之無毫釐差因上占額圖又言至徳訖元和大都通邑皆有兵最凡八千餘萬長慶籍户三百五十萬而兵乃九十九萬率三户資一兵今舉天下之入嵗三千五百萬上供者三之一又三之二則衣食仰給焉自留州送使外餘四十萬衆皆仰度支又為供軍圖上之志職官類占額圖一卷均田圖元稹唐帝王厯數圖書目十卷唐路惟衡撰起自周秦至于隋氏曾子玉以惟衡所撰自周已後其開闢以來並不載故依五運圖錄之以備一家之文大唐聖運圖畧三卷薛璫撰起髙祖訖武宗帝王厯數歌一卷大和元年劉軻以帝王年號世數次而為歌晁氏志帝王鏡畧馮鑑續至唐末唐奏樂圖王維傳人有得奏樂圖者不知其名維視之曰霓裳第三疊第一拍也好事者集樂工按之一無差誤咸服其精思新史云按樂圖唐宰輔圖崇文目職官類二卷起高祖訖昭宗宰相名氏拜免年月中興書目云唐宰相歴任訖唐衣冠盛事圖五卷竇氏撰皇朝衣冠盛事一卷錢明逸撰唐三宫圖通志唐太極大明興慶三宫圖一卷晁氏志服飾圖三卷唐李徳裕編共五十五事唐國要圖志職官類大唐國要圖五卷左僕射賈耽纂監察御史褚璆重修崇文目地理類孫結大唐國照圖一卷文宗時人唐制舉科目圖一卷不題撰人凡七十六科仕至宰相者七十二人詳見科舉建隆洛陽宫殿圖見後建隆三年五月詔廣皇城命有司畫洛陽宫殿按圖而修之建隆重集三禮圖至道國子監三禮圖禮象建隆三年五月丙寅國子司業兼太常博士聶崇義表上重集三禮圖二十卷冕服第一至目錄第二十賜三品服仍命詹事尹拙集儒學之士重加參議周世宗詔崇義參定郊廟器玉顯徳四年二月庚午詔有司更造祭器祭玉命國子博士崇義為之圖又詔學士竇儼統領之崇義因取三禮圖再加考正三禮舊圖是隋開皇中勑官脩撰建隆三年表上儼為序曰聶崇義博采三禮舊圖凡得六本凡舊圖之是者則率由舊章否者當理彈射其新圖凡二十卷附於古今通禮之文是書纂述之初詔儼統其事故作序焉太祖覽而嘉之詔所進圖令尹拙駮正崇義復引經釋之乃以儼裁定以尹拙駮議及崇義答議各四卷再加詳閲隨而增損列於注釋共分十五卷詔頒行之拙崇義復上祭玉鼎釡異同之說詔下尚書省集議張昭等議曰四部書目有三禮圖十三卷是隋開皇中敇禮官修撰其圖第一第二題梁氏第十後題鄭氏今書府有三禮圖亦題梁鄭後有梁氏者集前代圖記更加評議題曰陳留阮士信受禮學於潁川綦毋君取其說為圖三卷多不按禮文而引漢事其阮士信即諶也云云請圖釡鑊于鼎下從之尹拙又言袞冕而下君臣合畫充耳竇儀議從之目録序云舊圖十卷形制缺漏文字省畧名數法式上下差違前後六本大同小異唐張鎰洎諸家所撰蓋久傳不知所自崇義於顯徳三年冬十月定郊廟器玉因遂删改其名數雖殊制度不别則存其名畧其制瑚簋車輅之類是也名義多而舊圖畧者就而增之射侯䘮服之類是也有名無制者畧而不圖仍别叙目錄共為二十卷冕服第一至䘮器第十九終以目錄一卷凡所集注皆周公正經仲尼所定康成所注傍引疏義事有未逹則况以漢法圖有未周則詳於目錄建隆二年四月辛丑第叙訖冠冕衣服見吉凶之象宫室車旗見古今之制弓矢射侯見尊卑之别鐘皷管磬見法度之均祭器祭玉見大小之數圭璧繅藉見君臣之序䘮葬飾具見上下之紀竇儼序又曰國朝創制彛器車服博采三禮舊圖凡得六本大同小異遂鑚研尋繹躬命繢素不差毫釐率文而行恐迷其形範以圖為正則應若宫商至道二年丙申八月丙辰十八日詔翰林畫工二人圖三禮品物制度於國學講論堂之壁以舊壁頽落以板代之三年秋七月癸酉始畢李至撰記曰崇義書成天子詔國學圖於宣聖殿後北軒之壁嵗久闇落聖上命改作於論堂之上以版代壁丹青爛然安上治民移風易俗禮樂之本也玉帛鐘皷禮樂之末也聖人務本以求理存末以致用新圖既成與夫畫洛神之賦尚列女之屏豈同年而語哉咸平二年七月甲辰幸國子監詔講書因閲三禮圖天聖二年八月己卯幸監講論語覽七十二子賛觀東序圖繪禮器龍圖直學士馮元援三代制度以對一云閱三禮圖政和五年六月丁巳十九日校書郎賈安宅言崇義圖義皆諸儒臆說王普謂崇義出於臆度未嘗親見古器於經無據國子監三禮堂實存圖繪下至郡縣學間亦有之不足示學者宜詔儒臣編次方今禮樂新制器用宜繪於圖著其義具為成書頒焉詔三禮圖及郡縣學繪畫圖象並改正舊所繪兩壁三禮圖並毁去宣和元年五月二十七日詔諸州祠祭噐令禮制局繪圖攽降依圖製造銅器以漆為之書目三禮圖二十卷崇義博采舊圖凡六本考正是否繢素而申釋之三禮圖駁議二十卷不知作者禮象十五卷陸佃撰圖其物象而為之釋以救舊圖之失元祐七年三月序吕大臨考古圖十卷裒三代秦漢尊彛鼎之屬繪於幅辨論形制文字王楚博古圖二十卷集三代秦漢彛噐繪形範辨欵識秘書省古噐舊藏四百十八續藏四十慶元四年繪畫為圖其高廣大小欵識皆記載為五袠藏于經庫凡商噐七十六周噐一百六十五漢噐一百十二唐噐二不知年代者九十七不知名者二十三嘉定六年七月續藏古噐八十三續畫為一册通前六册續書目六卷觀其噐誦其言形容髣髴以追三代之遺風如見其人太平興國御製囬文圖八年十一月己未御製蓮花心輪回文偈頌十部共一百五十卷回文圖十軸以示宰相近臣國史志有太宗棊圖一卷雍熙運厯圖書目三卷雍熙四年龔頴撰三代未紀甲子以秦昭襄王五十一年乙巳滅周為厯運之始至雍熙四年丁亥計一千二百四十四年紹運圖一卷元祐諸葛深撰自三皇至宋北史後魏張彛上歴帝圖五卷起元庖犧終於晉末凡十六代一百二十八帝歴三千二百七十年雜事五百八十九宣武善之端拱歴代年紀圖端拱元年正月壬午殿中侍御史龔頴編歴代年紀為二圖來上優詔褒之歐陽脩稱其精博晁氏志龔頴運厯圖六卷起秦昭王乙巳止雍熙丁亥淳化大射圖見後淳化入閤圖祥符入閤圖淳化二年上以入閤舊圖承五代草創禮容不備於是命史館脩撰楊徽之等討論故事别為新圖十二月丙寅朔遂行其禮於文徳殿景祐元年李淑上時政十議議入閤曰唐寳厯後常以月朔御紫宸殿行入閤之禮太祖五行其禮多御崇元殿今天安殿備殿中金吾諸仗設待制􅀱對官乾德之後改御大明殿即今集英太宗三行其禮别定新儀就文徳殿廷增設黄麾仗真宗亦三行之繪圖講習藏之禁閤兹禮之廢向踰二紀初景徳四年十二月詔朝㑹並依入閤圖儀制排定祥符七年四月丁巳二日實錄丙辰朔東上閤門使魏昭亮言入閤圖殿上侍立臣僚皆唐時職官與今名品異請依新定儀制重畫從之天禧二年十二月壬寅禮儀院言儀制圖内言閤門通事舍人請去閤門字從之熙寧四年正月韓維以入閤舊圖增損裁定為文徳殿視朝儀甲寅上之李宗諤曰朝㑹圖門下省典儀設版位御史中丞班在丹墀上兩省官後立至道南郊圖見郊祀咸平國田圖見觀書占額圖三年十一月壬午鹽鐵使陳恕上占額圖咸平龍圖閣五經圖見觀書景徳崇和殿尚書禮記圖中庸圖祥符尚書圖景徳四年九月庚午宴近臣于龍圖閣之崇和殿餞翰林學士邢昺赴曹州刑書温仲舒宋白吏侍郭贄預焉昺視壁掛尚書禮記圖指中庸九經事講述其大義序脩身尊賢皆有倫理在位聳聽上嘉納之賜詩二首寵其行命羣臣咸賦祥符二年九月丁丑二十六日召宗室觀書龍圖閣因覽尚書圖皇祐之無逸圖治平之洪範屛景徳歴代君臣圖三年九月庚申草澤許可獻治平書歴代君臣圖景徳禮記圖見禮類陳祥道禮圖亦見禮類景徳合班圖見禮制祥符宗室班圖見宗戚祥符釋奠祭器圖二年正月甲子八日詔禮院定州縣釋奠禮器數圖其制攽之見社稷二十九日禮院言先聖先師每坐酒樽二籩八豆八簠二簋二爼三罍一洗一篚一巾一燭一爵四坫二從祀各籩二豆二簋一簠一爼一燭一爵一十二月龍圖待制戚綸依少府監所用禮器制度繪圖一卷并寫開寳禮外州釋奠儀以獻請付禮院參詳三年六月丙辰九日詔曰嚴師重道勸學之令猷釋奠陳牲薦誠之彛典儒臣上言慮郡國未詳爼豆之事乃命龍圖待制戚綸與太常禮院討論酌簡册之文著庠序之式圖繪頒行其釋奠元聖文宣王廟儀注及祭器圖令崇文院摹印下禮院頒諸路書目有崇寧頒行一卷淳熙七年二月頒尊爵制度見釋奠類歐陽公曰釋奠釋菜祭之畧者也古者士之見師以菜為摯故始入學者必釋菜以禮先師學官四時之祭乃皆釋奠釋奠有樂無尸而釋菜無樂則其又畧也今釋奠幸存然亦無樂又不徧舉於四時獨春秋行事而已祥符四圖五年十二月丁亥召宗室近臣觀祀汾隂后土壇朝覲親奠西嶽廟及祥瑞四圖於龍圖閣六年二月丙寅召詣滋福殿觀聖祖臨降及衆眞列侍圖祥符四夷述職圖見内附類政和六年二月二十八日翁彦約言國家天覆萬國化行方外梯杭輻湊史不絶書其贄幣服飾之瓌竒名稱狀貌之詭異多所未載今圖畫表章藏在禮部宜命有司編集成書如周家王㑹之篇詔禮部編集天禧大禮稱慶合班圖景祐立班圖天禧三年十一月九日辛酉閤門禮院上大禮稱慶合班圖皇太子序位在宰相上太子懇避㓂凖靣陳儲副之重不可謙抑望遵儀制凡再請乃許辛未升壇祀天地禮畢御皇禧殿皇太子賀于殿上宰臣率百官賀于廷中景祐四年九月十一日庚戌詳定閤門儀制所言紫宸垂拱殿起居臣僚左右位上欲鐫字記之并立班圖用絹别寫四本二進内二付閤門從之又見景徳閤門儀制景祐百官圖天聖元年王欽若謂平時百官叙進有常法為叙遷圖以獻冀便省覽景祐三年天章待制范仲淹言治亂係用人得失此宰相之職因為百官圖以獻指遷進次序遲速曰如此而為公為私不可不察五月丙戌出守饒州紹興初命宋棐編脩差除格目景祐雜坐圖四年三月二十三日集賢校理趙良規言按天聖編敇學士知制誥待制三司副使正官未至五品並同五品官例又按雜坐圖學士在兩省侍郎之下尚書丞郎之上中書舍人知制誥待制在留後之下祕書監之上三司副使在少卿監之上又按閤門儀制大宴學士坐殿上與僕射同行知制誥亦坐殿上與尚書丞郎同行若曲宴則三司副使預坐即在知制誥之後重行異位慶厯觀文鑒古圖慶厯元年康定二年辛巳即慶厯元年七月戊申朔出御製觀文鍳古圖記以示輔臣繪列百篇合為十卷初康定二年七月己卯命圖畫前代帝王美惡之迹可為規戒者號曰觀文鑒古圖上自為記凡十二卷藝文志云十卷百二十事每事帝自為一篇始黄帝夢風后力牧終長孫皇后賞魏𤣥成諫慶厯四年二月丙辰御迎陽門召輔臣觀之書目觀文鑒古圖十卷康定二年仁宗親述并為之序先是學士蘇紳言唐憲宗令近臣具前代得失之迹繪圖以觀會要慶厯四年二月二十三日丙辰御崇政殿西閤四壁各張畫圖前代帝王美惡可為規戒者命兩府觀之元祐五年五月范祖禹請哲宗覽此二圖可以見美惡之迹知創業之難紹興五年二月十九日毛剛中上鑒古圖記十卷慶厯三朝訓鑒圖慶厯八年八月庚辰知制誥楊億被㫖檢討三朝事迹乞與内翰李淑同編纂凡得祖宗故實事大體重者百條為十通命待制高克明等設色其上十月庚辰御製序賜名其序畧曰太祖以神武肇基太宗以英文紹復思皇真考對越靈期莫不兢業以臨朝機憂勤而靖王畧總御臣之威柄謹制世之令謨朕明發聳慕夕惕嚴祗申詔信史論次舊聞得祖宗之故實事大體重者百條繪采綴語釐為十通設色在上各載綱源執簡嗣書兼資義解几杖勒銘闕圖取正酌古垂範保邦守成然而稽之先民孰若稽之往訓皇祐元年二月纂成進呈十一月庚寅朔御崇政殿召近臣及臺諫館閣宗室觀之一云召觀於迎陽門當以崇政者為是又鏤板印染賜大臣宗室其圖始於親征下澤潞平惟揚終於真宗禁中觀稼飛山觀礟凡百條書曰皇祖有訓鑒于先王成憲命名之義允協于此舊目缺其圖又誤以仁宗御製後序冠于卷首續書目采繪俱全書目三朝訓鑒圖十卷李淑撰仁宗御製序今繪采皆闕光掩鑒古輝映無逸慶厯百官圖書目文武百官圖二卷慶厯中太常博士萬當世撰採本朝合班儀新令文具員故事等分門引類載階勲爵邑品秩俸祿之要為上卷以天聖中左僕射平章事王欽若所撰遷敘圖及合班儀封爵俸祿例為下卷慶厯景徳禦㓂圖慶厯五年九月癸巳詔近臣考先朝正史實錄為景徳禦㓂圖錄寳訓云中丞王拱辰言乞詔近臣詳定景徳禦㓂圖上命采閲先朝史錄而考詳之皇祐邇英閣無逸圖孝經圖序皇祐四年十二月甲午知制誥王洙蔡襄上所書無逸孝經圖初十一月甲辰侍讀楊安國講尚書無逸上曰朕深知享國之君宜戒逸豫因請書無逸篇於邇英閣之後屏上曰朕不欲背聖人之言當書置之坐左又命侍讀丁度取孝經天子孝治聖治廣要道四章對為右圖因令襄書無逸洙書孝經又命承㫖王拱辰為二圖序而襄書之一云仁宗初建邇英閣書無逸於屏間嵗久而弊以白居易賦代之侍講楊安國請復書無逸上欣然命王洙書之置之左方又命丁度取孝經之天子聖治孝治廣要道四章一本無聖治有至徳對為右圖命蔡襄書之按邇英延義二閣建於景祐二年正月癸丑孫奭為侍講學士嘗畫無逸圖上之請施便坐帝施於講讀閣今曰嵗久而弊者當是奭所上之圖元祐二年十月丁未范祖禹乞於邇英閣復張掛王洙蔡襄所書無逸孝經圖從之周公無逸以勤為先孝經四章以孝為本天聖說無逸慶厯講孝經中負黼扆左顧右盼至和周禮器圖嘉祐周禮樂圖至和元年九月丙寅實錄㑹要同或作皇祐五年翰學王洙上周禮器圖先是洙講周禮上因命畫車服冠冕籩豆簠簋之制及圖成而上之皇祐五年九月十九日上觀新樂及晉鼓三牲鼎鸞刀于崇政殿嘉祐三年閏十二月十九日皇姪克頠上周禮樂圖書目有龔原周禮圖十卷孫奭撰樂記圖仁宗御製洛書五事圖仁宗御集有洛書五事圖一卷范祖禹云仁宗最深洪範之學每有變異恐懼脩省必求其端治平歴年圖治平元年一云三月十四日司馬光自周威烈王二十三年盡周顯德六年為歴年圖五卷凡一千三百六十二年畧舉每年大事編次為圖上之以便觀覽每年一行六十行為一重六重為一卷言人君之徳三仁明武人君之才五創業守成陵夷中興亂亡今本六卷一云七卷起共和庚申訖顯徳己未上下凡千有八百年自威烈二十二年上距共和元年增多四百三十有八年蓋晚年所脩餘見後稽古錄劉攽易其名曰帝統編年紀事珠璣第為十巻以著論為一卷總十一卷首卷序三皇訖皇朝世次大畧歴年圖所無治平八廟圖一卷元祐無逸圖二年平章軍國重事文彦博上奏曰邇英北壁有仁祖朝講官王洙所寫無逸圖臣慮禁中或未有此圖敢寫録四軸并一卷上進望於殿内張掛及置於几案以便聖覽元祐二年十月侍講范祖禹言今邇英閣尚書圖序于屏間而無逸孝經二圖不復張列蔡襄所書圖序置在御座之後因脩展邇英閣方徹去却書于屏間乞依舊張掛三圖並列如仁宗朝故事元祐仁宗御書三十六事圖元祐六年三月庚申朔御邇英閣宰相吕大防言仁宗所書三十六事一本云三十五事請圖寫坐隅以備親覽從之詳見御書上曰宫中有此本蓋向時寳訓所進也宣和博古圖又見錄類劉敞得先秦古器十有一模其文圖其象為先秦古器圖一卷又為贊元祐中吕大臨以所閲三代尊彛鼎之器傳摹靣寫論次為考古圖十卷李公麟為古器圖一卷又為序贊徽宗道兼三皇萬古之器並出㑹于天府品之多五十有九數之多五百三十有七舟車所貢又百倍此清燕之間第其時物繪其形制識其名欵各有次第凡禮之器鼎為先簠簋次之樂之器律為先鐘磬次之有典制之器有征伐之器有常用之器有燕閒之器既成召輔臣親王御崇政殿觀之政和二年七月己亥置禮制局三年六月庚申因中丞王甫乞頒宣和殿博古圖令儒臣考古制度遂詔討論三代古器及壇壝之制改作爼豆籩篚之屬十月十四日手詔云裒集三代盤匜罍鼎稽考取法以作郊廟禋祀之器煥然大備中興書目博古圖三十卷宣和殿所藏彛鼎古器圖其形辨其欵識推原制器之意而訂正同異紹興十三年二月二十七日臣僚請攽宣和博古圖於太常俾禮官討論釐正改造祭器從之晁氏志博古圖二十卷王楚集三代秦漢彛器繪其形範辨其欵識增多吕氏考古十倍此又一書也薛尚功編考古博古之類為鐘鼎欵識二十卷紹興講殿御書無逸圖五年四月庚戌七日上諭輔臣曰昨日己酉范沖論仁宗建邇英閣沖為侍講轉對言命蔡襄等書無逸孝經圖列於左右元祐初沖父祖禹為侍講乞檢尋二圖如仁宗故事哲宗從之沖勸朕手寫無逸為二圖設於講殿之壁今已寫就趙鼎曰沖以世官侍經筵乞修祖宗故事宜也陛下親御翰墨不崇朝而圖成仰見從善汲汲之意沈與求曰願以是圖為元龜夙夜自儆七年九月一日内出無逸篇四軸付講筵所遇講日安掛紹興資善堂孝經圖五年六月己酉建國公孝宗五月己亥封初出資善堂上命見翊善范沖贊讀朱震皆設拜沖等每因牋奏導國公以仁義之言輒標軸藏之時一展玩國公嘗得李公麟所畫孝經圖沖書其後畧曰孝者自然之理天地之所以大萬物之所以生人之所以靈綱常之所以立學然後知之習與性成是謂純孝豈不見夫諸侯車服之美儀物之盛尊榮如此國公以幼學之年享寵禄之厚盍思所以保富貴之道乎故沖以諸侯之事為獻曰戰戰兢兢如臨深淵如履薄氷周之諸侯其入而居於王所皆謂之卿士故沖又以卿大夫之事為獻曰夙夜匪懈以事一人國公其勉之洪邁曰李公麟作孝經圖繪王者朝事母后乾道御製敬天圖七年正月己亥出敬天圖以示輔臣上曰無逸一篇享國久長皆本於寅畏朕近日取尚書所載敬天事編為兩圖朝夕觀覽以自儆省名之曰敬天圖虞允文奏古人作無逸圖猶夸大其事陛下盡圖書中敬天事又逺過之惟聖人盡躬行之實敬畏不已必有明效六月乙卯上曰敬天事已纂成圖置之坐右朝夕自省一日引卿等便殿觀之又曰人主儻不畏天尚何所畏允文奏願頒此圖刻之琬琰上曰作數語并圖付出嘉熙三年亦製是圖淳熙四年五月己酉宗正少卿程叔達進對言玉音許宣示敬天圖願得稽首拜觀上顧左右取圖至命叔達起觀上亦誦讀每至前代王者或不能敬畏脩省則曰此圖美惡並著亦欲以之儆戒至無逸篇則曰無逸言人君享國久長由嚴恭寅畏所致尤當以為法孝宗一議蠲放之令而日有戴氣一萌祈禱之念而雨已霶霈誠心所形其答如響嘉熙敬天圖御製敬天圖序曰朕觀書契以來人極茂建聖賢大訓布在方策其言治國平天下之道無出於六經而求之六經之要一日不可違者其惟天道乎大槩易明其理書正其事詩通其情周典備其禮春秋志其變記禮則雜紀焉者也人主知天之當敬視六經格言如金科玉條罔敢踰越則逸徳鮮矣仰惟祖宗丕靈承帝事撫有方夏列聖垂謨無一息不以敬天為心國史登載難以殫舉然未有不本於六經之㫖朕以寡昧寅奉燕詒懼弗克欽若眷命萬幾之暇稽式古典爰以己意取其關於天道之大而有以啟寅畏之衷者每經表而出之裒列成編目之曰敬天圖庶幾朝夕觀覽對越鑒臨以自警省云爾又御製天人要語楓宸燕閒左顧右盼凛然肅然如在璣衡帝王經世圖譜唐仲友帝王經世圖譜凡天文地志禮樂刑政陰陽度數兵農王覇皆本之經典兼采傳注類聚羣分旁通午貫使事時相參形聲相配或推消長之象或列休咎之證而於郊廟學校畿疆井野尤致詳焉各為總説附其後始終條理如指諸掌門人金式繕寫積百二十二篇又猶子􅂱校讐釐為十卷以類相從周必大題辭云六經㫖趣百世軌範皆聚於此宋朝宰輔圖蔡㓜學皇朝宰輔拜罷圖一卷建隆元年至紹熙五年宰執拜罷月日為圖年經而官緯之河出圖天地有自然之象洛出書天地有自然之理圖經也書緯也一經一緯相錯而成文圖植物也書動物也一動一植相湏而成變化見書不見圖聞其聲不見其形見圖不見書見其人不聞其語圖至約也書至博也即圖而求易即書而求難古之學者為學有要置圖於左置書於右索象於圖索理於書圖書相為經緯尚矣經之以書載前代成敗之實而讀者興焉緯之以圖繪前代成敗之形而觀者鑒焉耳其言者入乎耳而著乎心目其繪者入乎目而著乎心惟圖與書所以開導人君之聰明而交相養也漢畫西閣堯桀並彰唐設連屏以鏡興亡金鋪玉户丹書相宣邦國若否瞻之在前翺翔周覽一息千載攀輪折檻還笏挽裾凛凛生氣凌鑠坐隅瓊室傾宫怠敖侈麗圖其覆轍危竿欹器拱揖令王為吾友朋想像昔賢為吾股肱緑字赤文如河之出命工作繢五采彰施圖象古昔以當箴規明皇内殿無逸是張文宗太液尚書是録貞觀金鏡祗以為書元和事迹目纔十餘漢賜列仙唐述無逸可以配無逸之屏代千秋之鑑玉海卷五十六
