body:
  text: 玉海卷二百一宋王應麟撰辭學指南辭學指南序博學宏辭唐制也吏部選未滿者試文三篇賦詩論中者即授官韓退之謂所試文章亦禮部之類然名相如裴陸文人如劉栁皆繇此選制舉又有博學通議博通墳典學兼流略辭擅文場辭殫文律辭標文苑手筆俊拔下筆成章文學優贍文辭秀逸辭藻宏麗文辭清麗文辭雅麗藻思清華文經邦國文藝優長文史兼優之名皇朝紹聖初元取士純用經術五月中書言唐有辭藻宏麗文章秀異之科皆以衆之所難勸率學者於是始立宏辭科二年正月禮部立試格十條章表賦頌箴銘誡論露布檄書序記除詔誥赦勅不試又再立試格九條曰章表露布檄書以上用四六頌箴銘誡諭序記以上依古今體亦許用四六四題分兩場歳一試之大觀四年五月以立法未詳改為辭學兼茂科除去檄書增入制詔仍以四題為兩􅂣内二篇以歴代故事借擬為題餘以夲朝故事或時事葢質之古以覘記覽之博參之今以觀翰墨之華宣和五年七月職方員外郎陳磷奏歳試不無幸中乃有省闈附試之詔繇是三歳一試紹興三年工部侍郎李擢請别立一科七月詔以博學宏詞為名凡十二體曰制誥詔書表露布檄箴銘記賛頌序古今雜出六題分為三􅂣每場一古一今三歳一試如舊制先是唯有科第者許試至是不以有無出身皆許應詔先以所業三卷每題二篇納禮部上之朝廷下中書後省考其能者召試其取人以三等五年王璧石延慶首與選嘉熈二年立辭學科以今題四篇分兩場行之三年而廢景定二年復辭學科至四年而止今唯存博宏一科葢是科之設紹聖顓取華藻大觀俶尚淹該爰暨中興程式始備科目雖襲唐舊而所試文則異矣朱文公謂是科習諂䛕夸大之辭競駢儷刻雕之巧當稍更文體以深厚簡嚴為主然則學者必涵泳六經之文以培其夲云編題東萊先生曰編題只是經子兩漢唐書實録内編初編時須廣寧汎濫不可有遺失再取其體面者分門編入再所編者並須覆誦不可一字遺忘所以兩次編者葢一次便分門則史書浩博難照顧又一次編則文字不多易檢閲如宣室石渠公車敖倉之類出處最多只一次編必不能盡記題目須預先半年皆合成誦臨試半年覆試庶幾於場屋中不忘魏晉南北朝固不出題亦有相闗處如作厯序則此數代厯皆當略説作書目序則王儉七志嘉則殿書卷皆當略説凡作工夫須立定課程日日有常不可間斷日須誦文字一篇或量力念半篇或二三百字編文字一卷或半卷須分兩冊一冊編題一冊編語巻帙太多編六七板亦得作文字半篇或一篇熟看程文及前輩文字各數首此其大畧也縱使出入及賔客之類亦須量作少許念前人文百字編文字半板非謂寫半板但如節西漢半板作文字數句熟看程文及前輩文一首雖風雨不移欲求繁冗中不妨課程之術古人每言整暇二字葢整則暇矣西山先生曰始須將累舉程文熟讀要見如何命題用事如何作文既識梗概然後理會編題經史諸子悉用徧觀其間可以出題引用並隨手抄寫未須分門且從頭看凡可用者悉抄上冊如尚書則舜典望秩禋宗九官之類皆錄一書畢復理㑹一書以詳且精為先不可少有遺缺經書中周禮題目最多官名皆可作箴制度名物皆可為銘為記周禮題目亦有不入編者葢某别有節本故也其次則禮記外三經皆有之惟易全無工夫多在三禮易詩春秋三經無題目外如尚書周禮儀禮禮記三傳爾雅大戴禮皆有之有題目處須參注疏次及國語戰國策史記兩漢書荀悅袁宏漢紀三國志晉書南北史少題目然亦須涉獵過隋書唐書唐朝諸帝實錄舊唐書通典唐六典唐會要貞觀政要五代史少題目然其中如李琪傳入閣本未司天考王朴律準等事亦須編入之史記兩漢唐史題目最多制誥時事尤為緊要正史外漢有荀袁紀唐有會要六典韋氏兩京新記集賢注記舊唐史皆合㕘會抄録温公通鑑亦可證年月考異最佳晉隋皆有題目南北史雖未必可出題然須畧知夲末可以引用露布檄書亦多不可不編夲朝諸帝實錄太祖太宗真宗仁宗四朝事尤當精考髙宗孝宗國史諸志會要中興會要本朝題目須是盛徳大業禮樂文物崇儒右文等事方可出不必汎記子書則孟荀􅀭管淮南孔叢家語莊列文墨韓非子華亢倉文中鬻劉諸子汲冢周書吕氏春秋賈誼新書説苑新序兵書則六韜司馬法孫吴尉繚李靖問對皆有題目須涉獵抄節集則文選文粹韓栁文文苑英華古文苑皇朝文鑑雖無甚題然可以引用處亦合編錄皆當徧閲捜尋如前法編類不可缺畧俟諸書悉已抄過然後分為門目天文律厯渾儀圭景漏刻地理郡國户口版圖宫殿堂室省臺館閣寺監邸院苑囿樓觀門闕池沼城邉城河渠田制營屯貢賦鹽鐵錢幣倉庾府庫會計漕運儀禮郊丘明堂辟雍靈臺封禪迎氣朝日夕月星祠山川髙禖雩禜社稷羣祀祠官祠壇耤田先農觀稼親􅅙大射視學養老朝會宴享冊禮上夀行幸車輿冕服儀衛旂常鼎鼐祭器寳玉環佩笏帶符節印璽賜物招諫儆戒屏障音樂樂曲樂器樂舞夷樂官制官名祿秩封爵學校科目銓選薦舉考課兵制兵書陣法蒐狩符籍馬政兵車兵器弓矢軍賦刑法律令赦宥圖籍帝學經筵御製宸翰詔令易書詩禮春秋論語孝經小學儒臣經解臣下承詔撰述百家雜著正史實錄記注編年政要寳訓譜牒典故奏疏總集文章書目類書祥瑞夷狄朝貢錫予外夷兵捷紀㓛露布檄書右分為數十門先理會一門竟然後以次編纂謂如厯法則凡經史百家所載厯事悉萃為一處而以年代先後為次第如黄帝厯為先顓帝厯次之夏殷周魯厯又次之漢厯至唐厯又次之本朝厯又次之它可類推初編不厭其詳俟成編旋加刪削凡題目有數出處者須合為一如髙祖五星聚東井紀五行志張耳傳叙傳後魏崔浩髙允傳纔缺一處便不可而抄類之中復要認得出處端的如東井則夲紀為正它皆旁出又如編漢太初厯題凡兩漢紀志所載太初厯事晉隋諸志及後來人評論太初厯事皆當萃為一處仍須認一出處以武帝紀太初元年五月為正餘皆旁出舉此一題他倣此凡編題目須其上可著朝代字如夏如殷如周方可作題出且如曲禮所載徳車結旌徳車二字豈不是題目然曲禮非純是周制不可加周字則不可以為題但當收入漢徳車類以為引援之用若徒知曲禮徳車不可為題而略之或出漢徳車題不知援曲禮亦不可也舉此一事他皆可以類推矣有出處止數句而事散見諸處如漢太初官名建武封功臣之類是也編題之初徧加捜尋不可缺遺箴題如周陶正左傳銘題如漢瓚槃周禮注只三兩字最易漏須著眼力捜求摘其名之雅者錄為一帙要緊切工夫却用於衆家本子所無者用心且如瓚槃車服制度古本何曽有之今所謂長樂未央宫之類皆不必十分熟記年月數目亦無害編題用工數年雖不能全無缺遺然大概備矣兼其間亦有編類得法者頗多試以正文比對方知其不草草非止制舉天祿閣數題而已所編題苑再加工檢㸃諸經子史采括無復遺矣今去試日已無多某所記已及五七分將來不患忘出處但患作文之工少以此敵它人不去耳難題見作括子記頗有條理第恐場屋倉卒易於遺忘紫宸殿正出處只如此若李石傳所載之事不佳故刪去之亦如延英殿出處亦多若宋申錫等傳所載皆非善事故不錄大抵宫殿題目出處多者當以事體重者為主如宣室只是賈誼傳刑法志東方朔傳為急如何武等傳不用可也洛陽宫當以地理志為急如張元素皇甫徳參之諫畧之亦可也若汎然記汎然用適以害大體也唐中華殿出令狐徳棻傳延嘉樓出夷狄傳宣宗事思政殿出段文昌傳然不可出題若此可為題則漢顯徳殿嘉徳殿宣平殿之類皆可為題矣魯壺出處有葬后之事不佳難為出但合入周分物門漢校書郎見竇章􅀭終諸傳但止一校書官亦難作箴如五門三朝曩者不曽看疏故有缺畧今已修正矣所業題目已擬定但未有制表題如記序只是出眼前題葢好題可惜與王器之珨書得平齋洪公曰好題須討論纂組庶幾用如唐十道山川貢賦若非先整比縱使􅂣屋將唐書一部去如何成文漢振旅還京師若非參合諸傳則獨有夲紀山東數語豈無遺事㨂好題畧記端緒陳國正晦云乾元殿四部書百官志乃正出處使藝文志為正非是永平車服制度紀中恣極耳目乃正出處東平王傳及輿服志注但可引用而已此説良當一時取予葢未必可憑與王器之書之又曰東觀事始來教謂元和中有徧尋皆不見唯五行志注建初中有東觀事耳周七律他無出處只見淮南子舜五絃琴注有之周九畿籍只是司馬他無所考漢衛尉八屯出張衡賦與元帝紀司馬門注與城門校尉八屯不同唐著作院只是藝文志一出處黄帝李法周木鐸漢十三家易及賜民爵禮日成山已續編入題矣漢金鼓出郊祀歌廣成苑出馬融傳周封圭莫只是翦桐為圭事否乞批教北宫歳月及光祿四科偶然遺之非不曾考究也隋書無題如經籍天文志已編入冊矣此亦非急務相但以作文為祝若記念則場屋彼此參不患不記得實也水心曰宏詞人世號選定兩制李㣲之曰自紹聖至紹熈至宰執者十一人紹熈後執政三人出題並不載出處如祖宗故事及時事未通曉者臨時同巡捕官於簾前上請禮部榜周禮音注當精考如五射襄尺音讓九簭巫咸讀為筮陳時徐鳯周職錄出禹貢釋文周復舊域出王制注場中無知所出者然出處皆曰周公恐不可止出周字周禮注多引漢制如漢大樂律上計律百官朝會殿之類文籍卷帙不同者如崇文總目中興館閣書目當參考隋杜正𤣥開皇十五年舉秀才試策髙第左僕射楊素志在試退正𤣥乃手題使擬司馬相如上林賦王褒聖主得賢臣頌班固燕然山銘張載劍閣銘白鸚鵡賦曰可至未時令就正𤣥及時並了素讀數徧大驚曰誠好秀才正𤣥弟正藏十六年舉秀才時蘇威監選試擬賈誼過秦論及尚書湯誓匠人箴連理木賦几賦弓銘應時並就此擬題試士之始也錢文僖公曰學士備顧問司典誥於天下之書一有所不觀何以稱職葛文康公曰記問之博當如陶隠居恥一事不知記問之審又當如謝安不誤一事作文法東萊先生曰作文固欲多不甚致思則勞而無功不若每件精意作三兩篇謂如制文武宗室建節作帥各作三兩篇其他詔表箴銘頌贊記序之類亦事事作三兩篇祭祀禮樂之類是也皆須意勝語贍與人商𣙜便無遺恨則能事畢矣􅂣中題目不過此數門但小有異處臨時竄易便可用勝於倉卒下筆者逺甚題常則意新意常則語新初作文字須廣以示人不可恥人指摘疵病而不將出葢文字自看終有不覺處須賴他人指出歐陽公曰勤讀書而多為文自工世患作文少又懶讀每一篇出即求過人如此鮮有至者疵病不必待人指摘多作自能見凡作四六須聲律協和若語工而不妥不若少工而瀏亮上句有好語而下句偏枯絶不相類不若兩句俱用常語古人文字有語似不連屬而意實相貫程文切不可如此在野處洪公曰四六宜警䇿精切謝景思曰四六之工於裁翦若全句對全句何以見工一以經語對經語史語對史語方妥帖李漢老曰為文之法有筆力有筆路筆力到二十歳便定後來長進只就上面添得些子筆路則常拈弄時轉開拓不拈弄便荒廢王平甫曰文章格調須是官様杜牧之曰文以意為主氣為輔以詞采為兵衛陸士衡曰怵他人之我先韓退之曰唯陳言之務去李文饒曰譬諸日月雖終古常見而光景常新朱文公曰古人作文多摹倣前人學之既久自然純熟韓栁荅李翊韋中立書可見其用力處歐陽公曰為文有三多看多做多商量多鶴山曰辭根於氣氣命於志志立於學西山先生曰凡作文之法見行程文可為體式須多讀古文則筆端自然可觀十二體所急者制表記序箴銘賛頌八者而已若詔誥則罕曽出題檄露布又軍興方用皆尚可緩平齋洪公曰制表如科舉之本經所闗尤重隆興元年陳自修試頌及露布冠絶一場偶表制中有疵因不取西山先生問傅公景仁以作文之法傅公曰長褏善舞多財善賈子歸取古人書熟讀而精甄之則蔚乎其春榮薰乎其蘭馥有日矣初見陳國正晦呈漢金城屯田記甚喜其鋪叙之有倫數蒙稱奬次呈漢著記序此篇不及前渠再三為指其瑕疵令别作一篇凡四畨再改方惬渠意又作紫㣲閣賛呈之渠却無説只云讀古文未多終是文字體輕語弱更多將古文涵泳方得渠論此科大要以善作文為本若記問須擇其要者不必泛然徒費工夫其要捷之語甚多與王器之書多器之云制表須做制文武宗室各請一題表賀謝及進書每體亦各請一題攻媿樓公曰申錫赴宏辭多用竒字已在選中用倦􅒵字而有司以為犯廟諱嫌名而罷之徐子儀試垂中以一字疑再試以一事疑倪正父曰前人援引經語欲合律度截長為短避重就輕一字之間必加審訂語忌鄧潤甫撰龍興節祝夀詞用負黼扆憑玉几岑象求云非所當用以祝夀劉嗣明作皇子剃胎髪文用克長克君之語吏持以請曰内中讀文書最以語忌為嫌既尅長又尅君殆不可用也嗣明亟易之陳述古草明堂赦文用奉祠紫宫語犯俗嫌陳去非草朱勝非起復制用方宅大憂言者以為事涉人君陳自明草右相制用昆命元龜倪正父謂人臣不當用乞貼麻又腦詞用故國之有世臣雖有孟子出處後來引用多以為不祥事宜曰天生賢佐國有世臣便無瑕疵矣詞臣草貴妃制用釐降二字𠈁胄制用聖之清聖之和皆犯公論綦北海草吴玠制云陸海神臯既失秦川之利銅梁劍閣敢言蜀道之難辛炳奏玠方屏翰四川乃云既失秦川之利乞改正毋使逺方大將重以為忌遂改秦川為秦中徳夀宫慶典吴挺之客草賀表有􅀭命二字蘇熈之曰導揚未命此顧命中語奈何用之洪景盧紹興中作謝厯日表一聮云神祇祖考既安樂於太平嵗月日時又明章於庶證乾道中外郡采取用之洪曰今光堯在徳夀所謂考者何哉張文潜謝表用我來自東彭汝霖謂表用我字大無禮洪景盧草葉顒制曰無以我公歸兮大慰瞻儀之望本意用公歸之句指邦人而言也故云瞻儀而單時疑之謂人君而稱臣為我公楊文公於契丹荅書用隣壤交懽不免以字嫌又嘗戒門人為文宜避俗語既而公作表云徳邁九皇門人鄭戩曰未審何時得賣生菜公笑而易之開禧用兵詔諭天下首聮云匹夫無不報之仇何其陋也劉炳草嘉王制用烝烝孝友之風言者謂烝烝之語何自而出始誦書者皆能知之命辭立意如是可乎汪彦章草赦書云八世祖宗之澤豈汝能忘一時社稷之憂非予獲已議者謂并道君數之不應曰祖宗信乎作文之難也平齋洪氏曰古今萃於胸中造化運於筆下多讀多做兩盡為勝夏文荘曰美辭施於頌賛明文布於牋奏詔誥語重而體宏歌詠言近而音逺陸士衡曰謝朝華於己披啟夕秀於未振銘博約而温潤箴頓挫而清壮頌優游以彬蔚要辭約而理舉故無取乎冗長立片言以居要乃一篇之警䇿雖衆辭之有條必待玆而效績野處洪公曰文章有淵源有機杼有闗鍵有本根用其文如老農之用禾旦而溉中而芸深耕而熟耰之吾文唐矣不兩漢若乎漢矣不三代若乎欿然自視未能參於栁州吏部之奥則日引月長不至不止也山谷黄公曰古之能為文章者真能陶冶萬物雖取古人之陳言入於翰墨如靈丹一粒㸃鐡成金如世巧女文繡妙一世設欲作錦必得錦機乃能成錦廖明畧曰四六須要古人好語換却陳言朱文公曰作文自有穏字古之能文者纔用便用著宋景文云人之屬文有穏當字第初思之未至也韓子蒼曰為科舉之文已畧倣依三代之體則他日遣言立意自當不愧於古人魯連之檄過於長㦸勁弓陸贄之詔賢於元勲宿將文之不可已也如是裴晉公不喜於平淮而喜於韓愈之碑李衛公不喜於平潞而喜於封敖之制非功之難能明其功之為難也尹師魯曰文忌格弱字冗李徳裕文箴曰文之為物自然靈氣忽恍而來不思而至杼軸得之澹而無味琢刻藻繪彌不足貴如彼璞玉磨礱成器奢者為之錯以金翠美質既彫良寳斯棄朱文公曰前輩文有氣骨故其文壯今人只是於枝葉上粉澤爾後山攜所作謁南豐因留欵語適欲作一文字事多因託後山為之成數百言南豐云大畧也好只是冗字多後山請改竄南豐取筆抹數處每抹處連一兩行凡削去一二百字後山讀之則其意尤全因歎服遂以為法文心雕龍曰風骨乏采則鷙集翰林采乏風骨則雉竄文囿若藻耀而髙翔固文章鳴鳯也鎔冶經典之範翔集子史之術洞曉情變曲昭文體然後能莩甲新意雕畫竒辭才有天資學謹始習斵梓染絲功在初化器成綵定難可飜移情者文之經辭者理之緯才為盟主學為輔佐善為文者富於萬篇貧於一字一字非少相避為難也曾文昭曰文才出於天分可省學問之半西山先生曰傅公景仁以詞學進黄公鈞稱其文猶濯錦於蜀江而虞雍公亦謂其璞玉而加琢也昔雲龕述初寮之文有曰幽𦕈透射若貫珠隙明麗整飭若截綺尺某於公文亦云汪彦章謂傅自得曰今世綴文之士雖多徃徃昧於體製獨吾子為得之不懈則古人可及也趙茂實曰南塘謂自六經左氏國語外至西漢而止又説某料子不曽雜晉唐而下草料王景文曰文章根本皆在六經非惟義理也而機杼物采規模制度無不具備者張安國出考古圖其品百二十有八曰是當為記於經乎何取景文曰宜用顧命游廬山訖事將裒所歴序之曰何以景文曰當用禹貢誦書東萊先生曰先擇史記漢書文選韓栁歐蘇曽子固王介甫陳無已張文潜文雖不能徧讀且擇其易見世人所愛者誦之先讀秦漢韓栁歐曽文字以養根本四六且看歐王東坡三集總類近試半年旋看可也為學須是一鼔作氣才有間斷所謂再而衰也四六當看王荆公岐公汪彦章王履道擇而誦之夏英公元厚之東坡亦擇其近今體者誦之如孫仲益翟公巽之類當節當擇總類佳者誦之不必太求備制膝康滕庾曹中沈介陸韶之湯思退王俊王曮范同洪邁周麟之莫濟王端朝詔羅畸石􅐂吴兹華髙茂晁詠之詹叔羲王雲表羅畸髙麗修貢宴吴兹實錄成賜林虡都城記謝黻老人星晁詠之程量皇子謝生日禮物宣徳樓上梁文滕康野􅅙成繭劉才邵俞授能謝賜御製冬祀慶成詩代樞宻使謝玉帶袁植燕山進士謝及第洪遵洪邁代守臣謝御書周易尚書五色雀瑞麥芝草祝天輔賀慶雲見葉謙亨王端朝慶雲瑞粟野􅅙繭周必大交趾進馴象箴劉才邵歐陽瓌石延慶宣室周麟之上林清臺銘羅畸敧器王雲玉磬謝黻鏤文紅管筆式滕康漢宣徳殿馬詹叔羲漢輔渠鐘周麟之黄帝景洪遵洪适克敵弓莫冲漢瑄玉王端朝漢芝車記吴兹藉田殿丘鄜思文吴幵元豐尚書省玉堂葛勝仲御飛白書晁詠之宗子學孫覿唐學士院王雲重修秘閣宫胡交修唐洛陽陸韶之王俊龍徳太一宫遵唐勤政務本樓詹叔羲漢城長安洪湯思退唐凝暉閣渾天儀端朝莫濟咸平五經圖莫冲唐慶善宫王賛石延慶御書無逸圖麟趾褭蹏湯思退王曮洪邁漢王端朝莫濟漢寳鼎神䇿頌劉弇紹聖元會流丘鄜大河復東吴幵北郊慶成芝草葛勝仲端誠殿晁詠之程量展事郊丘孫覿黄帝封㤗山雍張守漢神魚舞河陸韶之王俊漢三洪遵沈介周成王蒐岐陽冲葉謙亨皇祐大安樂湯思退洪邁明道耤田莫序歐陽瓌唐開元禮王璧統元厯謝黻御書孝經周麟之唐通典莫冲漢石渠議奏臺十二門詩王端朝莫濟漢靈西山先生曰詩書左氏西漢最宜精熟其他各有篇數國語栁子厚曰參之國語以博其趣又與楊誨之書云用莊子國語文字太多反累正氣宣王不籍千畝定王殽烝單襄公過陳景王將鑄無射宣公夏濫泗淵桓公問成民之事如何晉文公元年屬百官悼公朝于武宫使宣子佐下軍晉卿不若楚靈公為章華之臺左史倚相廷見申公吴王昏乃戒令古書之文非可簡擇獨取此數叚者非以其叙事可法則以其間多可用之辭然人所見不同更自為決擇可也古文中如左傳國語西漢文最為緊切其次則選粹及韓栁等文文選班張兩都二京賦左太冲三都賦司馬相如揚雄潘岳諸賦屈平九歌枚叔七發曹子建七啟張景陽七命潘子茂九錫文王元長任彦升䇿秀才文司馬長卿喻巴蜀檄難蜀父老文東方朔荅客難揚子雲解嘲班孟堅賔戲顔延年王元長曲水詩序王子淵賢臣頌揚子雲劇秦美新班孟堅典引張茂先女史箴班孟堅封燕然山銘張孟陽劍閣銘陸佐公石闕刻漏二銘古文苑班固北征頌泗水亭碑銘馮衍傅毅李尤蔡邕王粲諸銘揚雄胡廣百官箴樊毅修西嶽廟記邯鄲淳曹娥碑韓文朱文公曰今人於韓文知其力去陳言之為工而不知其文從字順之為貴元和聖徳詩平淮西碑鄆州溪堂詩南海神廟碑田𢎞正先廟碑栁文平淮夷雅鐃歌鼓吹曲貞符晉問興州江運記嶺南饗軍堂記永州萬石亭記終南山祠堂碑饒娥碑武岡銘劍門銘如唐文粹李華含元殿賦杜甫三賦白居易續虞人箴之類夲朝文鑑石介宋頌慶厯聖徳詩之類皆當擇其文體似此科者類為一帙熟觀西山先生習此科繙閲古今書口不輟吟筆不停綴與王器之書曰某於此甚留心獨恨吏事所纒不得専心致意僅得數刻之暇為讀書作文計所幸編題記念漸已十七八稍可自慰合誦書詩左氏傳國語史記西漢書兩漢詔令文選文粹文鑑宏辭總類大詔令中興玉堂集制草草續制韓文栁文歐文東坡文欒城文南豐文荆公文曾文昭文後山文宛丘文淮海文華陽文初寮文龍溪文夏文莊文元章簡文北海文翟忠惠文孫仲益文平園文三洪制藁東萊進卷朱文公曰讀書須成誦方精熟又曰熟讀漢書韓栁文不到不能作文章歐公東坡皆於經術本領上用功讀誦書宜舒緩不迫字字分明取孟韓子班馬書熟之及歐曽老蘇文字亦當細考乃見為文用力處地東坡曰博觀而約取厚積而薄發山谷曰須要心收汗馬之功讀書乃有味蘇明允曰取古人之文讀之始覺其出言用意與已大異介然端坐終日以讀之及其久也讀之益精而胸中豁然以明然猶未敢自出其言也時既久胸中之言日益多試出而書之己而再三讀之渾渾乎覺其來之易矣昌黎曰用功深者其收名也逺栁子厚曰當先讀六經次論語孟軻書皆經言左氏國語莊周屈原之辭稍采取之榖梁子太史公甚峻潔可以出入又云勿怪勿雜編文東萊先生曰左氏西漢文選韓栁歐蘇曽子固陳無已張文潜秦少游文粹皆須分門節如郊祀禮樂宫室朝㑹官名書籍器用祥瑞車旗聖學御製御書之類是也如左氏三辰旂旗之類皆可入車旗如二京三都賦所言居處皆可入宫室如西漢樂章之類皆可入郊廟禮樂等處如韓文上尊號表潮州謝表皆可節入歌頌功徳如栁文轇轕三光陶鎔帝皇之類皆可節入聖學如歐公會聖宫頌之類皆可節入宫室如東坡御飛白記太宗御書賛之類皆可節入御書餘以類推又當作一冊編四字語先自毛詩編次及秦碑漢章元和聖徳詩平淮夷雅凡四字語可取者編之詩書須節一遍以備四六之用長句作一處節如乃心罔不在王室學有緝熈于光明之類四字作一處如迄用有成熈帝之載之類兩字作一處如疇咨若時燕及之類謝景思曰四六全在編類古語唐李義山有金鑰宋景文有一字至十字對司馬文正有金桴王岐公最多中興館閣書目陸贄備舉文言三十卷摘經史為偶對類事共四百五十二門李商隠金鑰二卷以帝室職官嵗時州府四部分門編類韓愈西掖雅言五卷序云餘暇擬作自大制令逮於百執事或云非愈所作南豐序晏元獻公類要總七十四篇皆公所手抄六藝太史百家之言騷人墨客之文章至於地志族譜佛老方伎之衆説旁及九州之外蠻夷荒忽詭變竒跡之序錄皆披尋紬繹公之得於内者在此所以光顯於世者有以哉觀公所自致者如此則知士不素學而處從官大臣之列備文儒道徳之任其能不餒且病乎此公之書所以為可傳也玉海卷二百一
