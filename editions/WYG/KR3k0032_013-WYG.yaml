body:
  text: 玉海卷十三宋王應麟撰律厯改元黄帝五始文春秋正義春秋緯稱黄帝受圖有五始說公羊者云元者氣之始春者四時之始王者受命之始正月者政教之始公即位者一國之始春秋緯云黄帝坐於扈閣鳳凰銜書致帝前其中得五始之文謂此五事何休又云公即位者一國之始政莫大於正始故春秋以元之氣正天之端以天之端正王之政以王之政正諸侯之即位文王改元詩文王正義尚書運期授注云周文王以戊午蔀二十九年受命受命之月已是季秋至明年乃改元書序云惟十有一年武王伐殷注云本文王受命而數之是年入戊午蔀四十歲矣以厯校之入戊午蔀二十九年歲在戊午其年殷九月二十五日得甲子明年乃改元則元年歲在己未是得赤雀之命後年改元之驗也是類謀注云入戊午蔀二十九年時赤雀銜丹書而命之季秋之月甲子赤雀銜丹書武成正義文王斷虞芮之訟諸侯歸之改稱元年諸侯自於其國各稱元年是已之所稱容或中年得改汲冡周書魏惠王有後元年漢初文帝二元景帝三元此必有因於古也漢改元嘉瑞改元見祥瑞文帝十六年史記十七年九月得玉杯刻曰人主延夀明年改元索隱曰按秦本紀惠文王十四年更為元年又汲冡竹書魏惠王亦有後元當取法於此又按封禪書以新垣平􅀱日再中故改元也武帝建元元年顔師古曰年號起於此封禪書後三年有司言元宜以天瑞不宜以一二數一元曰建二元以長星曰光今郊得一角獸曰狩云劉貢父曰後三年蓋盡元狩六年至元鼎三年也然元鼎四年方得寳鼎無縁先三年而稱之以此而言自元鼎以前之元皆有司所追命其實年號起元鼎故元封改元始有詔書矣吕氏曰封禪書言天子封泰山反至甘泉有司言寳鼎出為元鼎以今年為元封元年然則元鼎年號亦追改也終軍傳對曰今郊祀未見於神祇而獲獸以饋宜因昭時令日改定告元對奏由是改元為元狩劉仲馮曰按紀獲麟在元狩元年史記封禪書元鼎三年有司始言元不宜以一二數乃云三元曰狩蓋追述也漢改元正厯肅宗賈逵傳陛下通天然之明建大聖之本改元正厯垂萬世則是以麟鳳百數嘉瑞雜遝注改元謂改建初九年為元和元年八月癸酉詔正厯謂元和二年始用四分厯二月甲寅章帝時鳳凰見百三十九麒麟五十二白虎二十九黄龍三十四神雀白燕等史官不可勝紀見東觀記陳湯傳耿育上書延夀湯係萬里難制之虜先帝下明詔宣著有功改年垂厯傳之無窮應是南郡獻白虎元帝紀邉垂長無兵革之事其改元為竟寧唐古今年號錄志封演一卷天寳末書目一卷封演集并序以肅宗至徳代宗永泰乃陳後主齊明帝年號為失於考據遂起漢武建元至於唐纂為一卷後蜀杜光庭撰古今類聚年號圖一卷自漢武元年辛丑至蜀乾徳元年己夘凡一千五十九年歴一百八十九君改四百七號内六十號重出崇文目年號厯一卷紀年錄一卷元類一卷乾徳郊祀改元建隆四年十一月甲子郊祀改元乾徳六年十一月二十四日郊陳告謝之儀改開寶興國九年十一月二十一日郊改雍熙五年正月十七日藉田改端拱景祐五年十一月十八日郊改寶元康定二年十一月二十日郊改慶厯至和三年九月十二日㳟謝改嘉祐靖國元年十一月二十三日郊改崇寧乾道元年正月一日郊祀改元法乾德紀元之義九年十一月九日郊改淳熙景德朝元殿受朝改元見禮儀元㑹類紀年通譜書目十二卷參政宋庠撰以古今運厯之書凡十餘家皆無可采遂取十七代正史百家雜記凡正偽年號括為一書斷自漢文後元之戊寅下止周恭帝顯德之庚申凡一千二百二十二歲并本朝建隆之元至慶厯元年之辛巳合為十二卷其十八篇曰統元以甲子貫之其二篇曰類元歴代紀元賦一卷大理丞楊備撰自漢至五代别為宋頌四章紹興中晁公邁撰歴代紀年十卷紹熙五年八月侯望進古今年號録五卷自漢建元至今一千三百三十五年正偽年號總八百三十八為字二百三十五宋朝年號頌天佑下民藝祖立極繇三而五建隆乾德開寶之九享國十七太宗之元改為興國八而改之雍熙乃復四而更之端拱乃續麟正二書淳化是易鳯紀五朌至道是革至三而終二十四訖章聖纘圖咸平凡六景德祥符四九其别天禧乾興五一其畢二紀仍朞仁皇嗣服天聖明道九二先及景祐寶元康定慶厯皇祐至和嘉祐之日曰四而二曰一而八曰五而二曰八而足四十一年政事修飭英皇治平四載善述神考之興聿新制作熙寧十更元豐八閲哲宗紹休元祐凡八紹聖元符四三其列十有五禩徽皇靖國崇觀政重宣和岌岌總其歴年五加二十靖康屯難髙宗正域建炎紹興再立宗祏四與三二紀凡三歴孝廟隆興乾道相襲二九之餘淳熙十六二十七春乾清坤謐光宗五稔紹熙駿遹寧考慶元六更歲律泰禧四三嘉定十七三十年間不皇暇逸吾皇承統光增燕翼寶慶三改紹定六易端平嘉熙歴載凡七淳祐十二寶祐歲六開慶一禩景定更瑟總論改元漢武六年一改號自太初後四年一改孝昭亦六年一改孝宣四年一改孝元五年一改孝成四年一改餘改號皆不常年號及十年已上不改者光武建武三十一孝明永平十八孝和永元十六獻帝建安二十四蜀漢後主建興十五延熙二十吳大帝赤烏十三晉武泰始十太康十穆帝永和十二孝武太元二十一安帝義熙十四宋文帝元嘉三十齊武建元十一梁武天監十八大同十一陳宣大建十四魏昭成稱代建國三十九道武登國十太武真君十一孝文太和二十三西魏文帝大統十七隋文開皇二十煬帝大業十三唐太宗貞觀二十三𤣥宗開元二十九天寶十四代宗大厯十四德宗貞元二十一憲宗元和十四宣宗大中十三懿宗咸通十四春秋正義漢魏以來雖秋冬改元史於春夏即以元年冠之是有因於古也元者氣之本也善之長也人君執大本長庶物欲其與元同體故年稱元也諸侯於其封内各得改元傳説鄭國之事云僖之元年簡之元年是諸侯皆改元非獨魯也隋志道經有延康赤明龍漢開皇是其年號春秋後傳惟王者改元諸侯改元自汾王以前未有也晉竹書曲沃莊伯十一年十一月則用夏正為嵗首而秦譜至宣公初志閏月不惟改元又改厯矣書正義顧氏云殷家猶質踰月即改元年以明世異不待正月以為首也郎顗曰仲終季始歴運變改故可改元所以順天道也文中子曰改元立號非古也其於彼心自作之乎舜典紀元日商訓稱元祀春秋書元年人君之元即乾坤之元也大哉乾元萬物資始天之用也至哉坤元萬物資生地之用也成位乎其中則與天地參元即仁也仁人心也衆非元后何戴后體元則仁覆天下矣即位之一年必稱元年絫數雖久而不易戰國而下此義不明秦惠文王十四年更為元年汲冡竹書魏惠王有後元始變謂一為元之制漢文帝十有六年惑方士説改後元年景帝因之壬辰改中元戊戌改後元猶未以號紀年也武帝因事建號一元曰建二元以長星曰光六年而更始曰朔郊得一角獸曰狩顔氏謂年號起建元劉氏据封禪書謂起元鼎呂氏謂元鼎亦追改也元封改元始有詔曰登封泰山至于梁父然後升䄠肅然自新嘉與士大夫更始其以十月為元封元年及征和之後復改後元年於是武帝厭改元矣歴代襲沿或五六年或三四年或一嵗再更或一嵗三號一嵗四號記注繁蕪莫之勝載哀帝以建平二年為太初元將見于王莽𫝊世祖以建武三十二年為建武中元見于續漢志而本紀削二字梁之大同大通俱有中字亦憲章於建武也經載十二而年名不易陳夀以美諸葛武侯間有復古號為元年如魏廢帝恭帝周閔帝明帝唐肅宗未㡬仍舊葢春秋之義不明久矣即位踰年改元古制也劉禪孫亮石𢎞符生李景未踰年而改亡以議為晉惠帝改武帝太熈為永熈謂欲長奉先皇之制亦非也議者以為違春秋踰年書即位之義令史官没之明年正月復改年唐順宗以貞元二十一年正月嗣位至八月改永貞葢已稱太上皇嫌於獨無紀年故亟更之太平興國之改元不俟踰年史臣謂與常例不同又有踰年而不改元者唐中宗仍武后神龍代宗繼寶應至七月梁末帝追承乾化晉少帝襲天福至九年孟昶仍父明徳漢髙祖追用晉天福隠帝仍父乾祐周世宗仍太祖顯徳皆非禮之正唐哀帝仍昭宗天祐葢畏朱温而不敢云漢獻除光熹昭寧永漢梁元帝黜大寶梁末帝黜鳳厯諉曰繼故晉惠後改永安漢髙祖黜開運最為無謂自唐徳宗慨想貞觀開元之盛改貞元以法二祖紀元用先代名始於唐徳宗貞元合貞觀開元之名用李泌之言我朝因之若淳熈慶元開禧之類是也元祐之號或謂並用元豐嘉祐而有對鈎之談隆興欲隆紹興之治紹熈將紹淳熈之政詞臣草詔乃合建隆紹興及紹興淳熙為義非初意矣夫歴世無窮而美名有盡於是有離合之䜟有重複之嫌如永昌隆昌為二日大亨為一人二月了天正為二人一年而止天保為一大人只十隆化為降死徳昌為得二日宣政為宇文亡日大象為天子冡廣運為軍走大業為大苦末廣明為唐去丑口而著黄家日月大平為一人六十咸字人口有戈宣和為一家有二日靖康為立十二月康建炎為兩火此離合之䜟也炎興應司馬氏之名升平有不滿斗之謡大足若數足而則天改之天元為周號昌字乃二日而李泌議之成字負戈美者犬羊亨為子不成而神宗避之隆興近正隆純熈旁作屯而孝宗更之治平或謂火徳不宜用水康定靖康或謂其如諡法天聖於文為二人明道於文為日月並葢以母后之臨朝也乾道九年而改謂用九之數已極純熈之易為淳避告成大武之語發號告元其謹始如此乃若晉建興同孫劉之號唐至徳永泰襲陳齊之舊晉惠六同漢號一用呉號漢哀之太初晉元之建武魏孝武之永興唐肅宗之上元皆自重一代之號乾徳蜀號也因宫人鑑背而後知隆興偽號也因曽布日録而後見建中靖國之紀元曾肇以唐建中為疑欲改建字為執字任伯雨亦以唐為戒而徽宗謂梁末禪位年號太平太宗不以為嫌重和犯契丹重熈之稱一年而亟改髙孝欲用炎興乾統以劉蜀契丹已用而更議此重複之嫌也至和三年而改以至道末年為忌熈寧崇寧或云同劉宋陵名宣和或云契丹宫門名其避忌又不止於重複矣然晉有立始長順之筮唐有元和咸通之兆我朝有重火之䜟是亦有數存焉若文王以受命之年為元年緯書之説也文王不宜改元而又改元武王宜改元而不改元歐陽子嘗辯其妄矣道家有延康赤明龍漢開皇之紀上皇無極永夀之號事不經見云歴代年號元後元魏惠王或漢文帝後景帝武帝曰征和元中元漢景帝武光武或曰建中元建元漢武帝劉晉康帝苻齊髙帝漢聰秦堅始元漢昭帝初元漢元帝正元魏髙貴鄉公景元魏元帝永元漢和帝凉齊東昬侯張茂太元晉孝武張吳孫權凉駿上元唐髙宗肅宗興元唐德宗貞元唐德宗王金海陵乾元唐肅宗開元唐𤣥宗燕元燕慕容垂昇元唐李昇寶元仁宗慶元寧宗建武中元漢光武中元克復唐譙王重福元光漢武帝昌王渾秦竇衝金宣宗武元朔漢武帝元狩漢武帝元鼎漢武帝元封漢武帝元鳯漢昭帝元平漢昭帝元康漢宣帝晉惠帝元延漢成帝殤帝元夀漢哀帝元始漢平帝元和漢章帝唐憲宗元初漢安帝元興漢和帝吳孫皓晉安帝定安國元嘉漢桓帝宋文帝元熙晉㳟帝漢劉淵元徽宋蒼梧王昱元璽燕慕容雋元象東魏靜帝元慶唐德宗不用元豐神宗元祐哲宗元符哲宗太初元將漢哀帝天天漢漢武帝蜀王建天鳯王莽天監梁武帝天嘉陳文帝天康陳文帝晉桓謙天賜魏道武天