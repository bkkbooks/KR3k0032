body:
  text: 玉海卷五十三宋王應麟撰藝文諸子又見著書等類歐陽修曰仲尼之業垂之六經其道宏博君人治物百王之用微是無以為法故自孟軻揚雄荀卿之徒又駕其説扶而本之歴世諸子傳相祖述自名一家異端其言或破碎於大道然訂其作者之意要之孔氏不有殊焉梁劉勰曰諸子者述道見志之書太上立徳其次立言百姓之羣居苦紛雜而莫顯君子之處世疾名徳之不章唯英才特逹則炳耀垂文騰其姓氏懸諸日月漢諸子畧見書目類志儒家自晏子子思至揚雄所序五十三家八百三十六篇入揚雄一家三十八篇道家自伊尹太公辛甲鬻子至楚子及道家言三十七家九百九十三篇隂陽家自宋司星子韋至雜隂陽二十一家三百六十九篇法家自李悝商君至法家言十家二百一十七篇名家自鄧析尹文子至毛公七家三十六篇墨家自尹佚田俅子至墨子六家八十六篇縱横家自蘇子張子至荘安待詔金馬聊蒼十二家百七篇雜家自孔甲盤盂大至雜家言二十家四百三篇入兵法農家自神農野老至祭癸九家百一十四篇小説家自伊尹説至虞初周説百家十五家千三百八十篇凡諸子百八十九家四千三百二十四篇出蹵鞠一家二十五篇漢校定諸子百家伏無忌傳永和元年詔無忌與議郎黄景校定中書五經諸子百家藝術注藝文志曰諸子凡一百八十九家言百家舉成數也藝謂書數射御術謂醫方卜筮安帝紀永初四年二月乙亥詔謁者劉珍及五經博士校定東觀五經諸子傳記百家藝術整齊脱誤是正文字漢諸子博士劉歆𫝊漢至孝文衆書頗出皆諸子傳説猶廣立於學官為置博士在漢朝之儒唯賈生而已孟子題辭孝文欲廣遊學之路論語孝經孟子爾雅皆置博士後罷傳記博士獨立五經唐十七類子録藝文志丙部子録其類十七一曰儒家類自晏子春秋至君臣政理論六十九家九十二部七百九十一卷二曰道家自鬻子至荘子文句義一百三十七家七十四部一千二百四十卷并神仙三十五家釋氏二十五家總一百三十七家一百七十四部三曰法家自管子至五經析疑十五家十五部一百六十六卷四曰名家自鄧析子至注公孫龍子十二家十二部五十五卷五曰墨家墨隨巢胡非三家三部十七卷六曰縱横家自􅀑谷子至補闕子四家四部十五卷七曰雜家自尉繚至子林六十四家七十五部一千一百三卷八曰農家自范子計然至兆人本業十九家二十六部二百三十五卷九曰小説家自燕丹子至㝠報記三十九家四十一部三百八卷十曰天文自周髀至乙巳占二十家三十部三百六卷十一曰厯筭自九章重差至刻漏經三十六家七十五部二百三十七卷十二曰兵書自黄帝問𤣥女法至懸鏡二十三家六十部三百十九卷十三曰五行自沈思經至地理經六十家一百六十部六百四十七卷十四曰雜藝術自投壺經至五星圖十一家二十部一百四十二卷十五曰類書自皇覽至玉藻瓊林十七家二十四部七千二百八十八卷十六曰明堂經脉黄帝鍼經至内經太素十六家三十五部二百三十一卷十七曰醫術類本草至崔知悌方六十四家百二十部四千四十六卷凡著録六百九家九百六十七部一萬七千一百五十二卷不著録五百七家五千六百一十五卷六典丙部為子其類十有四儒道法名墨縱横雜農小説兵法天文厯數五行醫方梁劉勰云七畧𣲖流諸子鱗萃純粹者入矩踳駁者出規後漢論云貴清静者以席上為腐議束名實者以柱下為誕辭北史云淹中稷下八儒三墨之異漆園黍谷名法兵農之别唐子書要畧意林志雜家孟儀子林二十卷沈約子鈔三十卷隋志十五卷庾仲容子鈔三十卷書目梁庾仲容鈔諸子凡百有五家輯為一書一云一百七家薛克建子林三十卷盧藏用子書要畧一卷馬總意林一卷晁氏志三卷抄諸子百餘總以庾仲容繁畧失中增損成三軸前有戴叔倫楊伯存序晏子漢志儒家八篇名嬰諡平仲相齊景公隋志唐志同晏子春秋七卷史記晏平仲者名嬰萊之夷維人也事齊靈公荘公景公節儉力行既相齊食不重肉妾不衣帛其在朝君語及之即危言語不及之即危行國有道則順命無道則衡命以此三世顯名於諸侯太史公曰吾讀管氏牧民山髙乘馬輕重九府及晏子春秋詳哉其言之也子思子漢志儒家子思二十三篇名伋孔子孫隋志唐志同七卷孔伋晁氏志一卷四庫書目無之載孟軻問牧民之道何先子思曰先利之孟軻曰云云温公采之著於通鑑文選注引子思子曰民以君為心君以民為體其言明且清沈約曰禮記中庸表記坊記緇衣皆取子思子初學記引之曾子漢志儒家十八篇名參隋志二卷目一卷唐志二卷書目參與弟子公明儀樂正子春單居離曽元曽華之徒論述立身孝行之要天地萬物之理今十篇自修身至天圓皆見於大戴禮於篇第為四十九至五十八盖後人摭出為二卷上卷修身至事父母下卷制言至天圓劉清之集録七篇内篇一外篇雜篇各三漆彫子漢志儒家十三篇孔子弟子漆彫啓後韓非子儒分為八有漆彫氏之儒宓子漢志儒家宓子十六篇名不齊字子賤景子三篇説宓子語似其弟子世子漢志儒家二十一篇名碩陳人也七十子之弟子論衡本性篇周人世碩以人性有善有惡舉人之善性飬而致之則善長惡性飬而致之則惡長如此則性情各有隂陽善惡在所飬焉故世子作飬性書一篇宓子賤漆彫開公孫尼子之徒亦論情性與世子相出入皆言有善有惡公孫尼子漢志儒家二十八篇七十子之弟子隋志一卷似孔子弟子唐志一卷儒家禮記緇衣公孫尼子所作沈約曰樂記取公尼子文選注引之孟子見前論語孝經後荀子漢志儒家孫卿子三十二篇名況趙人為齊稷下祭酒注師古曰本曰荀卿避宣帝諱故曰孫志又有孫卿賦一篇劉向序臣向校中孫卿書三百二十二篇除複重二百九十篇定著三十二篇隋志十二卷唐志同荀況集一卷唐志二卷今書自勸學至堯問三十三篇楊倞注并序元和十三年十一月分為二十卷篇第頗有移易使以類相從改孫卿新書為荀卿子史記荀卿推儒墨道徳之行事著數萬言書目陳之方削荀子疵一卷凡四十篇董子漢志儒家一篇名無心難墨子唐志一卷宋朝吳秘注一卷闢戰國時著書墨子書目一卷與學墨者纒子辨上同兼愛上賢明􅀑之非纒子屈焉論衡引董子難纒子魯仲連子漢志儒家十四篇隋志五卷唐志同書目五卷退隠海上論著此書春秋正義引魯連書荀子注引魯連子謂田巴文選注引之王孫子漢志儒家一篇一曰巧心孔叢子一名盤盂子隋志論語類孔叢七卷孔鮒撰孔志十卷梁劉被撰孔子家語二十一卷王肅解書目孔叢子七卷合為二十三篇晁氏志鮒字子魚論集仲尼子思子上子髙子順之言及己之事凡二十一篇為六卷問嘉言至荅孔臧以所為賦與書謂之連叢上下篇為一卷附于末按漢志無孔叢子而儒家有孔臧十篇雜家有孔甲盤盂書二十六篇意者孔叢子即漢志孔甲盤盂書而亡六篇連叢即漢志孔臧書而其子孫或續之也嘉祐三年二月宋咸序四年二月丁亥咸為廣西轉運上所注楊子孔叢子賜三品服并撰釋文以三年十二月表上牟子隋志儒家唐志道家二卷後漢太尉牟融撰文選注引之魏子隋志儒家三卷後漢魏朗撰文中子中説唐志儒家王通中説五卷崇文目十卷王道天地事君周公問易禮樂述史魏相立命關子明王福畤家書雜録中説編為十篇成十卷阮逸注王續𫝊兄通隋末聚徒河汾倣古作六經為中説擬論語不為諸儒稱道惟中説獨存唐李翺以比太公家教及司空圖皮日休始重之日休作碑宋興栁開孫何振而張之遂行於世阮逸序中説者門人對問之書薛收姚義集而名之貞觀二年御史大夫杜淹始序中説及世家龔鼎臣得唐本於齊州李冠家以甲乙冠篇而分篇始末皆不同又本文多與逸異阮龔各以所得本為訓義宋咸撰過文中子十卷义駁中説二十二事程子稱其書勝荀揚陳亮參取阮龔本類次為十六篇其無條目可入與凡可畧者不録司馬光補傳元子唐志儒家元子十卷又浪説七篇漫説七篇元結别集元結文編十卷天寳九載庚寅至十二年癸巳成書五篇一萬六千五百九十五言分為十卷卷首有元氏家録紀其世次中書舎人李紓序其中惡圓惡曲至于世化凡十四篇文編亦有之伸蒙子唐志儒家林慎思三卷咸通中人書目三卷假答問之辭叙三才君臣文武之事凡萬言周生烈子唐志儒家五卷隋志周生子要論一卷録一卷魏侍中周生烈撰冀子唐志儒家五卷冀重字子泉定州容城人元和子唐志儒家杜信二卷鮿子國史志儒家趙隣幾一卷素履子國史志儒家張弧一卷聱隅子書目儒家一卷黄晞著聱隅子楊庭論嘉祐元年十一月十五日以為太學助教唐沈顔聱書十卷子華子書目儒家十卷載劉向校録序曰向所校讎中外書子華子凡二十四篇以相校除複重十四篇定著十篇又曰子華子程氏名本字子華晉人也善持論不肯茍容於諸侯聚徒著書自號程子按漢志及隋唐二志崇文總目國史藝文志悉無此書吳兢李淑二家書目亦不載必近世依託也晁氏志云元豐以後舉子所為雜家荘子稱子華子見韓昭侯陸徳明以為魏人吕氏春秋引子華子曰注子華子體道人也鬻子漢志道家二十二篇名熊為周師自文王以下問焉小説家鬻子説十九篇後世所加唐志道家一百三十七家始於鬻子一卷永徽中逢行珪注行珪序云十四篇書目雜家十四篇鬻熊楚之先也為周文王師著書二十二篇今本十四篇始於大道文王問列子天瑞篇鬻熊曰運轉無已天地宻移力命篇鬻熊語文王曰自長非所増自短非所損文心雕龍鬻熊知道而文王咨謀諸子肇始莫先於斯賈誼新書引文王武王成王問鬻子老子見御製老子經傳漢志道家老子鄰氏經傳四篇李耳傅氏經説三十七篇徐氏經説六篇劉向説四篇史記老子著上下二篇五千餘言老萊子亦楚人著書十五篇言道家之用漢志道家老成子十八篇老萊子十六篇葛𤣥序老子西逰天下關令尹喜曰大道將隐乎願為我著書於是作道徳二篇五千文上下經河上公漢文帝時授素書道徳經章句二卷道經體道至為政第三十七徳經論徳至顯質第八十一晁氏志李耳以周平王四十二年授關令尹喜凡五千七百四十有八言八十一章言道徳之㫖其末云使民復結繩而用之盖三皇之道也集賢注記開元二十年九月左常侍崔沔入院修撰與道士王虚正趙仙甫并諸學士參議修老子疏舊唐史司馬承禎善𨽻書𤣥宗令以三體寫老子經因刋正文句定著五千三百八十言為真本奏上之一本云司馬子㣲開元中帝命以三體寫老子刋正文句梁元帝著講疏四卷賀瑒著老荘講疏陳張譏撰老子義十一卷晉羊祜為老子傳魏王弼老子畧論王禹玉曰今資善堂所寫御本獨無章名章名疑非老氏之意書目三家老子音義一卷徐鉉補正唐徳明傅奕二家音義故名三家道徳經三十家注六卷唐張君相集解集河上公嚴遵王弼何晏郭象鍾㑹孫登羊祜羅升盧􅁉劉仁㑹顧歡陶隠居松靈仙人裴處恩杜弼節解張凴張嗣臧𤣥静大孟小孟竇畧宋文明禇糅劉進喜蔡子晃成𤣥英車惠弼等注唐志嚴遵指歸十四卷隋志老子指歸十二卷子書目十三卷漢嚴遵撰谷神注唐志馮廣注歸列子釋文漢嚴遵字君平作指十四篇演解五千文國史志道徳經節解二卷嚴君平指歸十三卷諸家道徳經疏二卷河上公葛仙公鄭思逺睿宗𤣥宗并自疏不知姓名秦宓𫝊李權曰仲尼嚴平㑹聚衆書以成春秋指歸之文古朴曰嚴君平見黄老作指歸程大昌易老通言十卷司馬光述要吕大臨蘇轍劉涇王安石注各二卷文子漢志道家九篇老子弟子與孔子並時而稱周平王問似依託者也隋志十二卷唐志同曰梁七録十卷書栁宗元十二篇盖駁也凡管孟數家皆見剽竊黙希子注道原至上禮文選注范子曰文子姓辛葵丘濮上人稱曰計然南遊於越范蠡師事之本受業於老子文子録其遺言為十二篇黙希子謂姓辛名研文子其字也師老子今本十二卷元魏李暹注唐徐靈府注即黙希子朱𤣥注關尹子漢志道家九篇名喜為關吏老子過關喜去吏而從之劉向校關尹子永始二年八月庚子上列仙𫝊著書九篇名關令子今本九卷一字至九藥列子漢志道家八篇名圄冦先莊子隋志八卷晋張湛注天瑞至説符舊二十篇劉向去重􅃨存者八篇向校列子書永始二年八月壬寅上栁宗元曰楊朱力命疑其揚子書天寳初號冲虚真經景徳四年二月丙寅加至德二字唐殷敬順撰釋文徽宗御製解王曉列子㫖歸一篇荘子漢志道家五十二篇名周宋人成𤣥英云字子休釋文序録五十二篇即司馬彪孟氏所注内七篇外篇二十八雜篇十四解説三郭子𤣥云一曲之才妄參竒説若閼奕意修之首巵言遊鳬子胥之篇凡諸巧雜十分有三言多詭誕或似山海經或類占夢書注者以意去取其内篇衆家並同其餘或有外而無雜今本十卷三十三篇逍遥遊至天下分為内外雜篇内篇七外篇十五雜篇十一唐成𤣥英疏三十三卷本郭象注為疏義北史何妥義疏四卷南史張譏内篇義十二卷外篇義二十卷雜篇義十卷唐志道家郭象崔譔注十卷向秀注李頤王𤣥古集解陸徳明文句義各二十卷司馬彪注二十一卷成𤣥英注三十卷疏二卷張九垓指要三十三篇書目成𤣥英疏十卷也向郭二注其義一唐文如海正義十卷晁氏志文如海疏十卷隋志徐邈集音三卷梁簡文講疏十卷本二十卷今缺梁曠南華論二十五卷本三十卷史記荘子著書十餘萬言大抵率寓言也文選注引淮南王莊子畧要晉王坦之著廢荘論宋朝王曉莊子㫖歸三篇亢倉子史記莊子𫝊畏累虚亢桑子之屬皆空語無事實唐志王士元亢倉子二卷天寳元年二月丙申號莊子南華庚子號列子冲虚文子通𤣥亢桑子洞靈真經然亢桑子求之不獲王士元謂莊子作庚桑太史公列𫝊作亢桑子其實一也取諸子文義類者為二卷補其亡今本五卷九篇自全道至兵道何璨注栁宗元曰首篇出莊子而益以庸言劉向班固録書無之今之為術者始為𫝊注書目三卷首篇與莊子庚桑楚篇畧同四子治國樞要晁氏志四卷唐范乾九集四子莊文列亢倉謂黄老之道内足以修身外足以治國采其書有益治道者分為二十門鶡冠子漢志道家一篇楚人居深山以鶡為冠隋志三卷書目同楚之隠人韓愈謂其詞雜黄老刑名栁宗元以為好事者偽為其書晁氏志著書十五篇論三才變通古今治亂之道三卷今本博選至學問分為四卷田子漢志道家二十五篇名駢齊人㳺稷下號天口駢吕氏春秋作陳駢廣成子隋志道家十三卷唐志十二卷商洛公撰張太衡注疑近人作晁氏志廣成子解一卷蘇軾取莊子黄帝問道一章為解任子道論隋志道家十卷魏河東太守任嘏撰抱朴子隋志道家抱朴子内篇二十一卷音一卷葛洪撰唐志十卷雜家外篇三十卷梁有五十一卷唐志二十卷晋葛洪傳内篇言黄白外篇駁雜通釋内外一百六十一篇號抱朴子書目内篇二十卷外篇五十卷合内外篇今存共七十卷唐子後漢方術𫝊唐檀著書二十八篇名唐子隋志道家唐子十卷吳唐滂撰唐志同幽求子晋儒林𫝊杜夷著幽求子二十篇隋志道家杜氏幽求新書二十卷陸子唐志道家十卷陸雲天機子晁氏志一卷凡二十五篇一名隂符二十四機諸葛亮撰觀其詞㫖殆李筌所為托之孔明也載道藏中書目道家天機經一卷不知作者鄒子漢志隂陽家鄒子四十九篇名衍齊人為燕昭王師居稷下號談天衍鄒子終始五十六篇師古曰亦鄒衍所説鄒奭子十二篇齊人號曰雕龍奭史記騶衍深觀隂陽消息而作怪迂之變終始大聖之篇十餘萬言其語閎大不經作主運劉向别録鄒子書有主運篇封禅書騶衍以隂陽主運顯於諸侯容成子漢志隂陽家十四篇吕氏春秋容成作厯莊子容成氏曰除日無歳無内無外則陽篇管子管子指畧漢志道家筦子八十六篇名夷吾相齊桓公孝經有弟子職一篇注管仲所作在管子書隋志法家十九卷唐志法家十九卷尹知章注三十卷杜佑管子指畧二卷書目二十四卷法家劉向序管子書三百八十九篇校除複重定著八十六篇其書務富國安民道約言要史記管仲潁上人既任政相齊通貨積財富國彊兵與俗同好惡故其稱曰倉廪實而知禮節衣食足而知榮辱上服度則六親固四維不張國乃滅亡禮義廉耻下令如流水之原令順民心故論卑而易行太史公曰吾讀管氏牧民山髙乘馬輕重九府及晏子春秋詳哉其言之也旣見其著書欲觀其行事故次其傳至其書世多有之是以不論論其軼事注劉向别錄曰九府書民間無有山髙一名形勢傅子管仲之書過半是後之好事所加輕重篇尤鄙俗孔頴逹曰或是後人所錄國史志尹知章注十九卷吳氏西齋書目三十卷此自形勢解亡唐史尹知章傳云注管子唐杜佑抄管氏書為指畧序稱房喬所注而舊錄皆作尹知章文句無復小異今本房𤣥齡注五十八篇有注有經言外言内言短語區言雜篇解輕重牧民第一至輕重庚第八十六丁度管子要畧五篇李子漢志法家三十二篇名悝相魏文侯富國彊兵申子漢志法家六篇名不害相韓昭侯劉向别録申子學號刑名以名責實尊君卑臣崇上抑下宣帝好觀其君臣篇史記列傳著書二篇號曰申子别録民間有上下二篇中書六篇皆合二篇已備過太史公所記唐志三卷韓非子申不害徒術而無法公孫鞅徒法而無術商子漢志法家商君二十九篇名鞅相秦孝公隋志商君書五卷唐志五卷或作商子書目商子五卷史記嘗讀商君開塞耕戰書與其人行事相類今是書具存共二十六篇夲二十九今三篇亡晉庾峻曰秦塞斯路利出一官雖有處士之名而無爵列於朝者商君謂之六蝨韓非謂之五蠧文心雕龍云商韓之六蝨五蠧韓子漢志法家五十五篇名非史記列𫝊作孤憤五蠧内外儲説林説難十餘萬言韓安國受韓子雜家説隋志唐志同二十卷目一卷今夲五十六篇注不詳名氏鄧析子漢志名家鄧析二篇鄭人與子産並時隋志一卷唐志同晁氏志二卷其書大㫖訐而刻尹文子漢志名家一篇説齊宣王先公孫龍注劉向云與宋鈃俱㳺稷下隋志二卷周之處士遊齊稷下唐志一卷書目二卷齊人劉向以其學夲於黄老居稷下與宋鈃彭蒙田駢等同學於公孫龍魏黄初末山陽仲長氏得其書始詮次為上下二篇公孫龍子漢志名家十四篇師古曰即為堅白之辨者唐志三卷書目名家一卷陳嗣古賈大隠注各一卷惠子漢志名家一篇名施與荘子並時莊子惠施多方其書五車其道舛駁其言也不中荀子恵子蔽於辭而不知實田俅子漢志墨家三篇先韓子隋志梁有一卷亡文選注引之墨家漢志墨家七十一篇名翟為宋大夫在孔子後墨家出於清廟之守貴儉兼愛上賢右􅀑非命上同此其所長也墨六家八十六篇始於尹佚二篇周臣次田俅子三篇我子一篇為墨子之學隨巢子六篇胡非子三篇墨翟弟子終於墨子隋志十五卷目一卷隨巢胡非子各一卷唐志同書目十五卷自親士至雜守為六十一篇亡九篇一本自親士至上同凡十三篇墨辨晋魯勝𫝊著正天論著述為世所稱注墨辯存其序曰墨子著書作辯經以立名本恵施公孫龍祖述其學以正刑名顯於世孟子非墨子其辯言正詞則與墨同荀卿莊周等皆非毁名家而不能易其論也墨辨有上下經經各有説凡四篇與其書衆篇連第故獨存今引説就經各附其章疑者闕之又采諸衆雜集為形名二篇畧解指歸以俟君子蒯子雋永漢志縱横家五篇名通史記蒯通者善為長短説論戰國之權變為八十一首索隠曰戰國䇿亦名曰長短書漢𫝊論戰國説士權變亦自序其説凡八十一首號曰雋永論甘美而義深長邊通學短長主父偃學長短縱横術蘇子漢志縱横家蘇子三十二篇秦張子十篇儀吕氏曰蘇秦周人也張儀公孫衍魏人也故言權變辨智之士必曰三晉兩周􅀑谷子唐志縱横家􅀑谷子二卷蘇秦又樂壹隋志云樂一注三卷尹知章注三卷史記正義􅀑谷谷名在雒州陽城縣北五里七錄有蘇秦書樂壹注云秦欲神秘其道故假名􅀑谷也􅀑谷子三卷樂壹注字正魯郡人有隂符七術有揣及摩二篇戰國䇿云得太公隂符之謀伏而誦之簡練以為揣摩期年揣摩成按􅀑谷子乃蘇秦書明矣中興書目三卷周時髙士無郷里族姓名字以其所隠自號􅀑谷先生蘇秦張儀事之授以捭闔下至符言等十有二篇及轉圓夲經持樞中經等篇亦以告儀秦者也楊子曰儀秦學乎􅀑谷術一本始末皆東晉陶𢎞景注一夲捭闔反應内揵抵𡾟四篇不詳何人訓釋中下二卷與𢎞景所注同有飛鉗揣摩之篇元冀為指要幾千言栁宗元辨曰劉向班固錄書無􅀑谷子險盭峭薄世之言縱横者時葆其書晚乃益出七術言益竒而道益陿晁氏志捭闔之術十三章夲經持樞中經三篇隋志􅀑谷子三卷皇甫謐注周世隠于􅀑谷氣兵書有􅀑谷先生占一卷補闕子唐志縱横家梁元帝十卷隋志又有湘東鴻烈十卷雜家金樓子十卷尉繚子漢志雜家尉繚三十九篇六國時劉向别錄云繚為商君學兵形執尉繚三十一篇隋志五卷梁并録六卷梁惠王時人唐志六卷尸子漢志雜家二十篇名佼魯人秦相商君師之隋志二十卷唐志同雜家目一卷梁十九卷秦相衛鞅上客尸佼撰其九篇亡魏黄初中續爾雅疏引廣澤篇仁意篇綽子篇劉向别録楚有尸子疑謂其在蜀今案尸子書晉人造二十篇書凡六萬餘言書目儒家一卷李淑書目所存者四卷今止存二篇合為一卷後漢書注一篇言九州險阻水泉所起十九篇陳道徳仁義之紀淮南子見著書類隋志雜家二十一卷劉安撰許慎髙誘注傅子隋志雜家一百二十卷晉司𨽻校尉傅𤣥撰唐志同晉傅𤣥𫝊論經典九流及三史故事評斷得失各為區例名為傅子為内外中篇凡有四部六録合百四十首數十萬言初作内篇成示司空王沈沈曰足以塞楊墨之流遁齊荀孟於徃代崇文目五卷中興目同書目今存二十三篇餘皆缺劉子北齊書劉晝字孔昭撰袁孝政為序并注凡五十五篇清神至九流書目三卷泛論治國修身之要雜以九流之説北史晝著金箱璧言撰髙才不遇傳唐志雜家十卷劉勰晁氏志齊劉晝撰或以為劉勰或以為劉孝標未知孰是尹子書目雜家五卷不知名設答問之辭雜論天地軍國地里靈神釋老之事并序論凡十九篇唐中黄子書目唐嚴從撰三卷從自號中黄子開元中為著作郎既卒皇太子命侍文吕向訪其遺文得八篇序為三卷唐志嚴從集三卷樊子唐志雜家樊宗師三十卷務成子漢志小説家十一篇稱堯問非古語荀子大畧篇舜學於務成昭注尸子務成昭之敎舜曰避逆從順天下不足取新序子夏對哀公云云炙轂子唐志小説家炙轂子雜錄注解五卷書目炙轂子雜錄五卷唐王叡以二儀實録古今注樂府題解合編為一書又炙轂子詩格一卷叙詩體式所始評其述作之要陳子後漢陳紀著書數萬言號曰陳子韋卿子後漢韋彪著書十二篇號曰韋卿子老耼貴柔孔子貴仁墨翟貴廉關尹貴清子列子貴虚陳駢貴齊楊朱貴已孫臏貴勢王廖貴先兒良貴後吕氏春秋墨子貴兼孔子貴公皇子貴衷田子貴均列子貴虚料子貴别尸子慎子有見於後無見於先老子有見於詘無見於信墨子有見於齊無見於畸宋子有見於少無見於多墨子蔽於用而不知文宋子蔽於欲而不知得慎子蔽於法而不知賢申子蔽於勢而不知知恵子蔽於辭而不知實莊子蔽於天而不知人荀子玉海卷五十三
