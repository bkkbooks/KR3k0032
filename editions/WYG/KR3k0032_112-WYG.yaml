body:
  text: 玉海卷一百十二宋王應麟撰學校學校下辟雍晉太學國子學兩學辟廱紀武帝泰始六年冬十一月幸辟廱行鄉飲酒禮宋志詔曰禮儀之廢久矣乃復講肄舊典賜太常絹百疋丞博士學生牛酒咸寧三年恵帝元康三年並行其禮文選注引陸機洛陽記辟雍在靈臺東相去一里俱魏武所徙咸寧二年五月或作九月立國子學武帝初立國子學定置祭酒博士各一人助敎十五人以教生徒博士皆取履行清淳通明典義者江左初減為九人元帝末増儀禮春秋公羊博士各一人合為十一人後増為十六人不復分掌五經謂之大學博士武帝太元十年損國子助教為十人元帝建武元年十一月丁卯立太學成帝咸康三年正月辛卯立太學孝武太元九年四月己卯増置太學生百人以車𦙍領國子博士十年二月立國學列𫝊王導元帝軍旅不息學校不修導上書曰自頃皇綱失統頌聲不興将二紀矣先進忘揖讓之容後生惟金鼓是聞干戈日尋俎豆不設先王之道彌逺非所以習民靖俗端本抑末也今若擇朝之子弟並入于學選明博修禮之士而為之師化成俗定莫尚於斯帝從之征南将軍戴邈言庠序廢宜向道崇儒以勵風化琅邪王從之始立大學庾亮為征西将軍在武昌開置學宫荀崧元帝太興初轉太常時方修學校簡省博士其儀禮公羊穀梁及鄭易皆省不置崧以為不可上疏曰世祖武皇帝崇儒興學經始明堂營建辟雍告朔班政鄉飲大射西閣東序圗書禁籍臺省有宗廟大府金墉故事大學有石經古文先儒典訓賈馬鄭杜服孔王何顔尹之徒章句𫝊注衆家之學置博士十九人學士如林猶選張華劉寔居太常之官以重儒教今博士準古計今猶未能半舊員十九人今五經合九人宜為鄭易儀禮置博士且三𫝊並行未能孤廢與其過廢寧與過立詔曰穀梁膚淺不足置博士餘如奏時太常賀循請置二禮三傳博士合八人裴頠恵帝時奏修大學刻寫石經恵帝元康三年以多猥雜於是制立學官品第五以上轉入國學袁瓌成帝咸康三年上疏國子祭酒袁􅅛太常馮懐上疏曰若得給其宅地備其學徒博士僚屬粗有其官則臣之願也疏奏成帝從之國學之興自瓌始謝石平苻堅後請興復國學以教胄子太元九年尚書令謝石請興復國學于太廟之南名國子學西有夫子堂畫夫子及十弟子象南有諸生省門外有祭酒省三博士省舊置博士三人通典云云明年増造廟房屋共百五十五間而品課無章當時君子恥與其列云謝𤣥舉臧燾為助教潘岳閒居賦靈臺傑其髙峙其東則有明堂辟廱清穆敞閒環林縈映圓海廽淵聿追孝以嚴父宗文考以配天祇聖敬以明順養更老以崇年注三輔黄圖大司徒宫奏曰明堂辟廱其實一也兩學齊列雙宇如一右延國胄左納良逸祁祁生徒濟濟儒術或升之堂或入之室髦士投紱名王懐璽訓若風行應如草靡注郭縁生述征記曰國學在辟雍東北五里太學在國學東二百歩國學教胄子太學招賢良宋志晉泰始八年有司奏太學生七千餘人才任四品聴留詔已試經者留之其餘遣還郡國大臣子弟堪受教者令入學咸寧二年起國子學葢周禮受教於師氏者太康五年修作明堂辟雍靈臺太元元年尚書謝石請興復國學以訓胄子班下州郡普修鄉校其年選公卿二千石子弟為生増造廟屋一百五十五間而品課無章士君子恥與其列國子祭酒殷茂言之曰輔性成徳必資於學先王所以陶鑄天下津梁萬物舊制國子生皆冠族華胄比列皇儲而中者混雜蘭艾人情恥之竊謂内外清官子姪普應入學制以程課齊志晉初太學生三千人元康三年始立國子學官品第五以下得入國學太學之與國學是晉世殊士庶異貴賤耳自穆帝至孝武並以中堂為太學通典孝武太元初於中堂立行太學依升平元年有司奏復二學生百二十人事訖罷唐六典注晉咸寧四年置國子博士一人梁置二人北齊置國子寺有博士五人隋初𨽻太常置博士五人大業三年置一人唐増置二人晉置助教十五人隋五人大業三年置一人唐増置二人晉元帝増置國子博士十六人謂之太學博士晉書鄒湛仕魏歴太學博士劉琨亦為之隋初置五人仁夀元年罷國子惟立太學七月戊戌改國子為太學置五人大業三年二人唐増置三人後魏置太學助教隋初五人唐置三人長安四年國子監置直講四人後魏官氏志有太學典録晉泮宫列𫝊杜預鎮荆州修立泮宫羊祜鎮南夏開設庠序范汪守東陽大興學校庾亮領江州孟嘉為勸學從事王沉仕郡文學掾熊逺郡辟為文學掾梁元帝為荆州起州學置儒林參軍勸學從事宋四學紀文帝元嘉十五年立儒學館于北郊十六年立𤣥素史文學通典二十年立國子學二十七年二月戊寅廢通鑑元嘉十五年豫章雷次宗好學隠居廬山尤明三禮毛詩以處士召至建康為開館於雞籠山聚徒教授置生百餘人帝雅好文藝十六年使丹陽尹何尚之立𤣥學太子率更令何承天立史學司徒參軍謝元立文學并次宗儒學為四學帝數幸次宗學館令以巾褠侍講資給甚厚又除給事中不就久之還山又築室於鍾山西為招隠館使為太子諸王講自華林東門入延賢堂就業次宗傳時國子學未立朱膺之庾蔚之並以儒學監總諸生大明五年㑹稽立左學召生徒泰始中置總明觀祭酒一人學士十人有四科齊國學南齊志建元四年正月詔立國學置學生百五十人其有位樂入者五十人永明三年正月詔立學置生二百人其冬皇太子講孝經親臨釋奠車駕幸聴尚書令王儉領祭酒十日一還學監試諸生豫章王嶷於邢州立學以王秀之領儒林祭酒謝幾卿補國子生齊太子自臨䇿試王儉發問鍾嶸丘仲孚齊永明中國子生江革請太學補國子生梁五館見館類天監四年詔開五館建立國學置五經博士帝釋奠先師先聖陳天嘉中周𢎞正在國學發周易題梁州郡學國子學紀天監四年正月癸卯置五經博士立州郡學二月初置胄子律博士六月庚戌立孔子廟五年五月置集雅館以招逺學九年三月己丑幸國子學親臨講肄賜祭酒已下有差乙未詔太子及王侯子皆入學十二月癸未幸國子學䇿試胄子儒林𫝊選士徒於會稽受業何𦙍分遣博士祭酒至州郡立學王承為祭酒承祖儉父暕並居此職三代為國師前代未有梁到洽遷博士撰太學碑後魏國子學皇子學四門小學皇宗學鄉學北史魏道武初立太學置五經博士天興二年春増國子太學生員至三千人四年春命樂師入學習舞釋菜于先師明元改國子為中書學太武始光三年春起太學於城東獻文天安初立鄉學郡置博士二人助教二人學生六十人後詔大郡次郡立博士二人中下郡一人學生自百人至四十人通典曰郡縣學始於此太和中十年改中書學為國子學建明堂辟雍尊三老五更九月辛卯又開皇子之學十六年幸皇宗學問博士經義任城王澄請修復皇宗之學開四門之教太和初孫恵蔚為皇宗博士及遷都洛邑立國子太學四門小學孝文太和十九年八月乙巳金墉宫成立國子監太學四門小學於洛陽二十年立四門博士置助教二十人太和末董文發為四門小學博士劉芳表云太和二十年立四門博士於四門置學於是斯文鬱然比隆周漢宣武時復營國學立小學於四門選儒生為小學博士員四十人李謐師事小學博士孔璠邢邵曰西京有六學之義東都有三雍之盛今國子有學官之名無教導之實何異兎絲燕麥南箕北斗魏書作李崇北齊諸郡立學置博士助教後周露門學虎門館後周書武帝天和二年七月甲辰立露門學置生七十二人唐瑾王褒等四人俱為文學博士六年沈重為博士於露門館為太子講論語宣和元年熊安生為博士樂遜在露門教授皇子大象二年二月丁巳幸露門學行釋奠禮辛公義𫝊周武帝召入露門學令與大儒講論蘇世長𫝊上書周武帝使卒學虎門館又有通道館學士武帝立通道觀保定三年尊太傅燕公為三老於是服衮冕乗碧輅陳文物備禮容清蹕而臨太學袒割奉觴内有崇文之觀外重成均之職隋國子郡縣學紀髙祖仁夀元年國子學惟留學生七十人太學四門及州縣學並廢劉炫𫝊云開皇二十年廢國子四門及州縣學惟置太學博士二人學生七十二人下儒林傳序仁夀問廢天學惟存國子一所七月戊戌改國子為太學煬帝復開庠序國子郡縣之學盛於開皇初文帝召馬光張仲讓等六儒為太學博士大業初左氏有徐文逺禮有褚徼詩有魯逹易有陸徳明皆一時冠孔頴逹舉明經髙第授河南郡博士潘徽􅀭州博士京兆郡博士劉焯為冀州博士唐國子監七學六學七館六館三館秘書外省小學京學州縣學貞觀廣學舍選舉志國子監生尚書省補祭酒統焉州縣學生州縣長官補長史主焉經分大中小習業有嵗限每嵗仲冬州縣館監舉其成者送尚書省髙祖初入長安開大丞相府下令置生員自京師至於州縣皆有數既即位詔諸州明經秀才俊士進士明於理體為鄉里稱重者縣攷試州長重覆嵗隨方物入貢吏民子弟學藝者皆送于京學為設考課之法州縣鄉里皆置學焉髙宗龍朔二年東都置國子監明年以書學𨽻蘭臺筭學𨽻秘閣律學𨽻詳刑儒學𫝊序髙祖始受命鉏纇夷荒天下畧定即詔有司立周公孔子廟于國學四時祠求其後議加爵土國學始置生七十二員取三品以上子弟若孫為之太學百四十員取五品以上四門學生百二十員取七品以上郡縣三等上郡學置生六十員中下以十為差選舉志云京都學生八十人上縣學置生四十員中下亦以十為差又詔宗室功臣子孫就祕書外省别為小學太宗鋭情經術即位貞觀六年詔罷周公祠更以孔子為先聖顔子為先師盡召天下名儒老師以為學官數臨幸觀釋奠命祭酒博士講經義生能通一藝者得除吏廣學舎千二百區三學益生員劉禹錫𫝊貞觀時學舍千二百區生徒三千餘外夷遣子来附者五國李觀云學有六館生有三千國子監三百人太學生六百人四門學生千三百人并置書算二學皆有博士官志凡六學束脩之禮督課試舉皆如國子學助教以下所掌亦如之大抵諸生員至三千二百六十員自𤣥武屯營飛騎貞觀十二年始置皆給博士授經能通一藝聴入貢限四方秀艾挾䇿負素坌集京師文治煟然勃興於是新羅髙昌百濟吐蕃髙麗等羣酋並遣子弟入學鼓笥踵堂者凡八千餘人紆侈袂曳方履誾誾秩秩雖三代之盛所未聞百官志國子監祭酒一人周師氏司業二人隋大業三年置武徳初省貞觀六年二月二日置一員掌儒學訓導之政總國子太學廣文四門律書算凡七學六典國子祭酒司業掌六學天子視學皇太子齒胄則講義釋奠執經議嵗終考學官訓導多少為殿最丞一人每嵗七學生業成莅試主簿一人七學生不率教者舉而免之録事一人助教各五人直講四人長安四年四月置直講四人武徳初以國子監為國子學𨽻太常寺貞觀二年復曰監龍朔二年改曰司成館祭酒曰大司成司業曰少司成咸亨元年復曰監垂拱元年改曰成均監祭酒令狐徳棻韓愈􅀭綰鄭覃穎司業陽城歸崇敬禇無量孔逹三世司業後魏於四門置學唐因之置直講四人用禮記四郊立學之説後移與太學同居貞觀二年左僕射𤣥齡等建言周公尼父俱聖人然釋奠於學以夫子也大業以前皆孔子為先聖顔回先師乃罷周公升孔子為先聖顔回配四年詔州縣皆作孔子廟十一年詔尊孔子為宣父作廟於兖州給户二十以奉之㑹要顯慶三年文宣王廟樂詔用宣和之舞博士范頵等作樂章通鑑武徳元年五月壬申置國子太學四門生合三百餘員郡縣學亦各置生員七年二月己酉州縣及鄉皆置學開元二十六年春令天下州縣里皆置學禮志皇帝視學三館學官座武官後孔頴達𫝊撰義贊永徽二年詔國子三館博士𢎞文館學士考正歸崇敬𫝊奏大厯五年八月國子太學四門三館各立五經博士品秩生徒有差旬省月試時考嵗貢眂生徒及第多少為博士考課上下不從何蕃𫝊朱泚反諸生将從亂蕃正色叱不聴故六館士無受汚者六館之士百餘人以蕃之義行言於司業陽城韓愈集請上尊號表云臣得所管國子太學廣文四門及書算律等七館學生狀云又聴琴詩序司業武少儀總太學儒官三十有六人列燕于祭酒之堂李觀書云六館今存者三亡者三會要元和元年正月勅國子祭酒司業及學官並取徳望學識二年八月二十四日勅鄉貢明經進士見訖就國子學官講論質定疑義百僚觀禮國子監請選常參官與學官同講説於是命兵部郎中蒋武考功員外郎劉伯芻等同赴國子監講論十三年十一月祭酒鄭餘慶以太學荒墜奏請率文官俸禄修廣兩京國子監長慶二年閏十月祭酒韋乾度奏四館學生闕員每年請補者監考試通具姓名申禮部唐六學選舉志凡學六皆隸于國子監國子學生三百人以文武三品以上子孫為之太學生五百人以五品以上子孫為之四門學生千三百人以七品以上子庶人之俊異者為之書學生三十人律學生五十人算學生三十人以八品以下子及庶人通其學者為之天寳九載七月乙亥置廣文館總為七學又有𢎞文崇文二館憲宗元和二年十二月始定生員西京國子八十人太學七十人四門三百人廣文六十人律館二十人書算館各十人儒學𫝊序髙祖初置國子生員七十二員太學百四十員四門學生百三十員會要貞觀五年以後數幸國學太學増築一千二百問又増生員書算各置博士凡三千二百六十員唐國子學太學五經博士廣文館詳見館類選舉志國子學生三百人以文武三品以上子孫從二品以上曽孫及勲官二品縣公京官四品帶三品勲封之子為之上元二年國子監置大成二十人取已及第而聰明者為之中宗詔宗室業成堪貢者宗正寺試送監舉如常法三衛願入學者聴附國子學太學及律館習業蕃王及可汗子孫願入學者附國子學讀書𤣥宗開元五年始令鄉貢明經進士見訖國子監謁先師學官開講問義元和二年十二月定生員西京國子館生八十人百官志博士五人掌教三品以上及國公子孫從二品以上曽孫為生者五分其經以為業周禮儀禮禮記毛詩春秋左𫝊各六十人暇則習隸書國語説文字林三蒼爾雅每嵗通兩經求仕者上於監秀才進士亦如之學生以長㓜為序習正業之外教吉凶二禮公私有事則相儀助教五人直講四人掌佐博士分經教授五經博士掌以其經之學教國子歸崇敬𫝊為司業皇太子欲臨國學行齒胄禮大厯五年八月崇敬以學與官名皆不正乃建議古天子學曰辟雍在禮為澤宫前世或曰璧沼璧池亦言學省漢光武一云漢武立明堂辟雍靈臺號三雍宫晉武帝臨辟雍行鄉飲禮别置國子學以殊士庶永嘉南遷帷有國子學北齊立國子寺隋大業中十三年更名國子監今聲明之盛辟雍獨闕請以國子監為辟雍省以祭酒為太師氏位三品司業為左師右師位四品近世明經不課其義先取帖經顓門廢業請以禮記左氏春秋為大經周官儀禮毛詩為中經尚書周易為小經各置博士一員國子太學四門三館各立五經博士旬省月試時攷嵗貢眂生徒及第多少為博士考課上下有詔集百官議皆以省禁非外司所宜名周官世職者稱氏國學非世官不得名太師氏大抵憚改作故無施行者通鑑大厯元年正月乙酉復補國子學生祭酒蕭明上言二月丁亥朔釋奠于國子監辛卯命有司修國子監八月成丁亥釋奠五年三月辛卯以楊綰為祭酒開成二年十月石經成大厯中張參為司業定五經書于論堂東西廂之壁太和七年十二月於國子監講論堂兩廊立石九經舒元輿問國庠記西有髙門曰論堂又至一門曰國子館歴至三館廣文太學四門也館宇鞠為荒圃李絳謂生徒無鼔箧之志博士有倚席之譏李庾西都賦外則國子招徒疏館開軒左立太學前列廣文稽以博士總之成均皮日休移成均博士書庠聲序音􅌑瓏於珩佩鏘訇於金石會要貞觀中孔頴逹為祭酒準故事上日開講五經題儒學傳序孔穎逹等始除祭酒發五經題與諸生酧問太和七年八月九日庚寅置五經博士開成元年奏請給禄鄭覃𫝊文宗以覃名儒故以宰相領祭酒請太學五經經置博士祿廩比王府官選舉志太學生五百人以五品以上子孫職事官五品期親若三品曽孫及勲官三品以上有封之子為之元和二年十二月始定生員太學七十人髙祖置百四十員百官志博士六人掌教五品以上及郡縣公子孫從三品曽孫為生者五分其經以為業每經百人六典太學博士三人五分其經為之業每經各百人課試如國子之法蕭昕傳為祭酒建請崇太學以植教本帝代宗寤其言永泰二年正月詔羣臣有籍於朝及神䇿六軍子弟肄業者聴補生員百官志廣文館博士四人助教二人掌領國子學生業進士者學生六十人東都十人天寳九載置會要七月十三日置博士助教各一人品秩同太學以鄭䖍為博士集賢注記天寳十三載八月楊沖綦母潛遷廣文博士國子博士武徳中徐文逺谷那律劉伯莊貞觀中陸徳明開元中尹知章太學博士貞觀中王恭馬嘉運賈公彦吳武陵李商隠國子助教武徳中朱子奢葢文達文懿直國子學朱子奢直國子監開元中趙元黙歸崇敬國子直講楊瑒為祭酒表薦大儒王迥質尹子路白履忠三人教授國子請明經帖平文生徒立頌太學門開元中禇無量兼祭酒太學生蕭頴士魏元忠郭元振張柬之薛稷趙彦昭何蕃太韓思彦游太學事博士谷那律百田游巖永徽時補學生趙𢎞智永徽初講孝經福殿宰相𢎞文館學士太學生皆在唐四門學選舉志四門學生千三百人五百人以勲官三品以上無封四品有封及文武七品以上子為之八百人以庶人之俊異者為之開元七年勑通一經及未通經而聰悟有文辭史學者入四門學為俊士一云二十一年五月勑元和中定生員三百人髙祖置學生百三十員百官志四門館博士六人助教六人直講四人掌教七品以上侯伯子男子為生及庶人子為俊士生者通典後魏書劉芳表云大和二十年立四門博士於四門置學案禮記曰天子設四學鄭𤣥注云周四郊之虞庠也今以遼逺欲移與大學同處從之栁宗元助教壁記云後魏太和中立學于四門置助教二十人隋𨽻國子置五人唐始合於太學省至三人貞元中為四門助教者三人皆文士栁立武儒衡歐陽詹見前四唐因魏制分經同大學循歐陽詹書門助教十年方易一官資歴級得太學國子助教四施敬本尹思貞為助教年余欽直講施士匄繇門助教為博士凡十九博士韓愈王𤣥感敬㑹真歸崇敬唐書學選舉志書學生三十人以八品以下子及庶人之通其學者為之凡書學石經三體限三嵗説文二嵗字林一嵗凡書學先口試通乃墨試説文字林二十條通十八為第髙宗龍朔二年二月十日以書學𨽻蘭臺初𨽻國子監百官志博士二人助教一人掌教諸生以石經説文字林為顓業兼習餘書武徳初廢書學貞觀二年十二月復置顯慶三年九月四日廢龍朔二年五月十七日復置會要貞觀二年十二月二十一日置六典自漢以来不見其職隋置書學博士一人王孝逸為書學博士唐加置二人周禮保氏教六書漢志八嵗入小學學六甲五方書計之事注蘇林曰五方之異書如今祕書學外國書也晉荀勗𫝊立書博士置弟子教習以鍾胡為法唐律學選舉志律學生五十人以八品以下子及庶人之通其學者為之凡明法試律七條令三條全通為甲第通八為乙第太宗増置書律學進士加讀經史一部髙宗龍朔三年二月十日以律學𨽻詳刑或作司刑寺中宗詔三衛番下日願入學者聴附國子學太學及律館習業百官志博士三人助教一人掌教八品以下及庶人子為生者律令為顓業兼習格式法例隋律學𨽻大理寺武徳初𨽻國子監尋廢貞觀六年復置舊史六年二月戊子初置顯慶三年九月四日廢龍朔二年五月十七日復會要律學顯慶元年十二月十九日于志寧奏置𨽻詳刑寺六典注晉志有律博士又衛覬奏置律學博士轉相教授梁天監四年廷尉屬有胄子律博士南史天監四年二月初置律博士隋有博士八人唐置一人移屬國學唐算學選舉志算學生三十人以八品以下及庶人之通其學者為之凡算學孫子五曹共限一嵗九章海島共三嵗張丘建夏侯陽各一嵗周髀五經算各一嵗綴術四嵗緝古三嵗記遺三等數兼習之凡算學録大義本條為問答明數造術詳明術理然後為通髙宗龍朔三年以算學𨽻祕閣百官志算學博士二人助教一人掌教八品以下及庶人之子為生者二分其經以為業九章海島孫子五曹張丘建夏侯陽周髀五經算綴術緝古為顓業兼習記遺三等數凡六學束脩之禮督課試舉皆如國子學助教以下所掌亦如之唐廢算學顯慶元年十二月十九日復置于志寜奏置令習十部算經分二十卷三年又廢以博士以下𨽻太史局龍朔二年復九數一曰方田二曰粟米三曰差分四曰少廣五曰商功六曰均輸七曰盈朒八曰方程九曰勾股皆有乗除齊同之法孫子算術􅅙所生咮絲為忽十忽為杪十杪為毫十毫為釐十釐為分會要算學貞觀二年十二月二十一日置舊史顯慶元年十二月乙酉置顯慶三年九月四日廢龍朔二年五月十七日復置三年二月十日以𨽻祕書局一云初𨽻國子監未見出處當攷歸崇敬𫝊建議律館算館助教請皆罷詔集議無施行者馬續𫝊觀羣書善九章算術見小學類劉徽九章算術自一曰方田止勾股大畧與百官志同隋始置算學博士一人唐祕書外省小學選舉志髙祖初入長安下令置生貟詔祕書外省别立小學以教宗室子孫及功臣子弟會要武徳元年十一月四日詔皇族子孫及功臣子弟於祕書外省别立小學儒學傳同葢文懿𫝊髙祖於祕書省立學以教王公子弟文懿為國子助教既升席公卿更相質問文懿譬曉密微逺近宗仰李絳請崇國學疏髙祖初立修太學并為功臣宗室子弟别立小學建􅓺舎大加儒訓増置生徒鴻儒碩學盛於朝列質疑應問酌古辨今易言養蒙成湯訓䝉士文王教小子唐増築學舎二館詳見館類選舉志凡館二門下省有𢎞文館生三十人東宫有崇文館生二十人太宗即位益崇儒術乃於門下别置𢎞文館又増置書律學進士加讀經史一部十三年東宫置崇文館自天下初定増築學舎至千二百區雖七營飛騎亦置生遣博士為授經四夷若髙麗百濟新羅髙昌吐蕃相繼遣子弟入學遂至八千餘人王𤣥感撰書糾繆春秋振滯禮繩愆等上之詔兩館學士議廣徳二年七月丙午勑集賢學士精選太學諸生在館習業唐崇𤣥學詳見崇𤣥令選舉志開元二十九年始置崇𤣥學習老子莊子文子列子亦曰道舉其生京都各百人諸州無常員官秩䕃第同國子舉送課試如明經初開元七年帝注道徳經成詔天下家藏其書貢舉人減尚書論語䇿而加試老子則崇𤣥學之肇於此天寳十二載道舉停老子加周易百官志開元二十五年正月十五日置崇𤣥學於𤣥元皇帝廟天寳元年兩京置博士助教各一員學生百人二載正月十五日改崇𤣥學曰崇𤣥館博士曰學士助教曰直學士置大學士二人徐又改崇𤣥學為通道學博士曰道徳博士未幾罷册府元龜開元十年正月己丑詔兩京及諸州各置混元廟並置崇𤣥學習道徳經及莊列文子等二十八年五月謂宰臣曰朕在藩邸有宅在積善里東南隅宜於此地置學通鑑開元二十五年正月初置𤣥學博士每嵗依明經舉㑹要寳應三年六月二十日停道舉會昌五年十月以道士劉𤣥靜為崇𤣥館學士宋朝政和八年八月庚午建道學唐西京東都學選舉志龍朔二年正月十八日東都置國子監㑹要置學官學生分於兩京教授元和二年十二月置東都監生百員自天寳之後學校益廢生徒流散永泰中雖置西監生而館無定貟於是始定生員西京國子館生八十人太學七十人四門三百人廣文六十人律館二十人書算館各十人東都國子館十人㑹要十五人太學十五人四門五十人廣文十人律館十人書館三人算館二人而已李栖筠𫝊肅宗時為常州刺史大起學校堂上圗孝友𫝊示諸生為鄉飲禮登歌降飲人人知勸人為刻石頌徳韓愈𫝊為國子博士分司東都實録元和元年丁卯詔祭酒司業及學官並取有徳望學識者東都國子監諸館共置學生百貟二年十二月丁巳東都國子監増置學生一百人會要元和十三年十一月祭酒鄭餘慶請率文官俸禄修兩京國子監唐州縣學又見上六典魏晉已下郡國有文學即博士助教之任學生三都八十人大都督中都督府上州六十人下都督府中州五十人下州四十人三都縣五十人至四十人諸州上縣四十人中縣二十五人下縣二十人皆有博士助教會要開元二十六年正月十九日令天下州縣里皆置學貞元三年正月右補闕宇文炫請立鄉學不報會昌五年正月制公卿百官子弟及京畿之士業明經進士者𨽻名太學外郡寓學者𨽻所在官學列𫝊陳子昂入鄉校痛修飭倪若水開元初為汴州刺史増修孔子廟興州縣學廬勸生徒李栖筠肅宗時常州刺史大起學校羅珦刺廬州修學宫常衮建中初觀察福建始閩人未知學衮為設鄉校使作文親講導與為客主鈞禮由是俗一變嵗貢士與内州等後閩人春秋配享衮于學宫韋宙刺永州立學宫取仕家子弟十五人充之許伯會舉孝廉上元中為衡陽博士鄭餘慶在興元創學廬子澣嗣修之養生徒風化盛行獨孤及福州都督府新學碑銘閩中無儒學流成公至而俗易李掎大厯八年家有洙泗户有鄒魯大厯十四年十二月五日詔諸州府學博士改為文學位參軍上唐學令會要大和五年十二月祭酒裴通奏按六典丞掌判監事凡六學生每嵗有業成上于監者以其業與司業祭酒試之按學令云諸生先讀經文通熟然後按文講義其試讀每千言内試一帖帖三言講義者每二千言内問大義一條總試三條通二為及第史記索隠功令即今之學令唐醫學唐制太醫局醫博士一人掌療民疾習本草甲乙脉經分而為業武徳中博士一人助教二人貞觀中減一人貞觀三年置醫藥博士及學生開元元年改醫藥博士為醫學博士諸州置助教寫本草百一集驗方藏之未幾博士學士皆省僻州少藥者如故二十七年復置醫學博士掌州境處療㑹要開元十一年七月五日丁亥諸州置醫學博士二十七年二月五日敕十萬户已上州置醫生二十人十萬户已下置十一人例天寳二年十月十六日勑諸州醫學生等隨貢舉人申省補授十年與散官同流外例附申永泰元年復置醫學博士三都學生三十人都督府上中州各有助教一人三人都督府上州二十人中下州十人舊紀貞觀三年九月癸丑十六日諸州置醫學御製廣濟廣利等方書六典注晉令助敎部敎醫子弟宋元嘉二十年太醫令秦承祖奏置醫學三十年省後魏隋有博士助教建隆増修國子監周顯徳二年以天福普利一作刹禪院為國子監置學舎藝祖受禪増修學舎修飾先聖十哲像及先儒何休等二十一人畫像分列兩廡御製先聖亞聖二贊命宰臣兩制以下分撰餘贊三幸太學閱土木之功陶榖為之記建隆三年重修正月癸未幸監二月丙辰幸一本云二月十一日己巳始幸監詔祖宗故事乃云元年正月初幸二月再幸因増葺祠宇塑繪聖賢與諸書異今不取崔頌判監事始聚生徒講書上嘉之六月乙未遣中使徧賜以酒果尋又詔用一品禮立十六㦸於文宣王廟門崔頌𫝊重修國學及武成王廟命頌總領其事建隆三年夏始㑹生徒講説太祖賜以酒果每臨幸國學召頌與語因及經義頌應答無滯太平興國八年正月詔以國子監贊九十四首武成廟贊七十五首付監鏤板即太祖朝所製判監陳鄂書端拱二年二月以國子監為國子學淳化五年三月戊辰復以國子學為監改講書為直講至道三年三月繪三禮圗于壁明年七月畢景徳二年五月臨幸以書庫陿隘増廣之十一月命邢昺等薦該博端良可為直講者十人張賴等試經義于學士院而命之五年九月十六日請於文宣殿北建閣藏太宗御書明年正月王曽撰記志判監二人直講八人丞簿書庫監官各一人天聖七年八月甲午詔國子監以五十人為解額九年重修監命内臣張懐信等典其役又以禮賢宅西北隅地及舎宇晹之以廣學室景祐五年四月二十五日判監鄭戩請修講書及更衣殿康定元年判監葉清臣請給田五十頃為學廩慶厯三年十月壬寅以玉清宫二十二頃賜監四年二月七日又賜上清宫園邸皇祐四年五月六日詔選經行老成者為直講慶厯二年十一月富弼薦孫復治平二年七月韓琦薦崔公度四年十月司馬光薦黄俞嘉祜三年五月詔監生以四百五十人為額吴中復奏請七月復増一百五十人熙寜元年正月諌官滕甫等言慶厯太學内舎生二百員官給食乞増置詔於内舎生外増一百貟名外舍生舊制補試監生六百人五月増為九百人元豐三年正月辛巳改國子直講為太學博士每經二人景徳西京國子監景徳四年二月癸酉詔西京建太祖神御殿乙亥八月詔置國子監武成王廟成日置官講説賜九經書會要云令河南修建國學長編景祐元年五月以河南府學為國子監後唐同光三年初建文宣王廟咸平三年重修止名府學於是直集賢院謝絳論奏乃正監名慶厯三年十二月戊午以南京府學為國子監慶厯四門學慶厯三年二月辛酉國子監請立四門學以士庶子弟為生員以廣招賢之路從之會要二年閏九月天章閣侍講王洙言國子監每科詔下品官子弟試蓺給牒充廣文太學律學三館生或至千餘人即隨秋試既而生徒散歸講官倚席但為游士寄應之所殊無國子肄習之法國子監詳定請在學五百日方許取解釋奠陪位又國學惟七品以上子孫試補八品以下至庶人子不與致容偽妄宜倣唐制立四門學示國家育才之廣詔可慶厯太學熙寧増廣大學慶厯四年四月壬子二十一日判監王拱辰田况王洙余靖等言首善當自京師漢大學二百四十房千八百餘室生徒三萬人唐學舎亦千二百間今取才養士之法盛矣學徒二百而國子監才二百楹制度陿小不足以容學者請以錫慶院為太學葺講殿及更衣殿備乗輿臨幸以路王宫為錫慶院從之太學地隘東為錫慶院又東為朝集院學徒三百講官博士十餘人分經教授至不能居居數月范仲淹罷執政意異四年五月壬申幸國子監五年正月己巳三司言錫慶院不可缺命别擇地營之二月乙巳遂以馬軍都虞侯公宇改葺為太學後胡瑗乃得得錫慶後堂及二廡容諸生以更衣位置録行堂皇祐二年七月四日詔内舎生二百人未能充數宜限百人熙寜四年十月十七日中書言增廣太學益置生員外舎不限員内舎二百員上舎一百員增置直講十員二人共講一經正録諭於上舎生每經選一人戊辰詔具為令先是太學生二百員熙寧六年正月壬寅詔増置一百員己卯二十八日鄧綰言國子監粗容釋奠齋庖之室不足容諸生太學假錫慶院西北隅廊屋數十間生員三百人無容足地乞賜錫慶院為太學修武成王廟為右學詔宋靖國吕嘉問相度十一月丁酉詔從其請五年八月辛卯詔外舎生以七百人為額七年五月壬戌又并朝集院賜之以廣二學為屋百楹元豐二年八月丁巳詔益太學生員舎為八十齋每齋屋五間六年五月八日司業朱服請學生旬休習射志祭酒司業各一人掌三學之教法太學博士十二人分經講授審覆行蓺正録各五人正舉行學規以次考選録糾不不如規者論選士告於正武學博士二人律學博士正各一人太學録五人武學正録各一人選學生為之熙寜初用經術取士廣闢黌舎分為二學増置生徒總二千八百人日給以食元祐元年三月十四日詔太學嵗公試司業博士主之如春秋補試法元祐初置春秋博士三年正録止用上内舍生後復置命官學正一員政和六年七月二十一日御書大成殿牓刻石首善閣下慶厯武學熙寜紹興武學慶厯二年十二月壬寅詔兩制舉官為武學教授三年五月丁亥置武學于武成王廟以太常丞阮逸為教授其年八月戊午罷武學逸改兼國子監丞有願習兵書者許於監聴讀張唐英政要以為議出吴育按育𫝊不見武學議患劉敞曰先王教胄子以道而不及武者非無四夷之恐示民以佻也熙寜五年六月乙亥二十七日樞密院言古者出師受成于學文武弛張其道一也春學秋射以攷遊倅之蓺列于夏官周制也右學葢其遺意歟仁宗嘗建武學既而中輟請復之詔置學於武成王廟選文武知兵者為教授凡使臣未參班及門䕃草澤試人材弓馬應格方入學給常膳習諸家兵法教授纂次歴代用兵成敗及忠義足以訓者講釋之願試陳隊者量給兵伍肄習及三年考其蓺補班行以兵部郎中韓縝判學後改孫固郭固同判閏七月五日詔學生限百人十日蔡碩試邊䇿為教授八年楊伋權武學𫝊授九月辛酉詔試大義十道分兩場元豐元年詔使臣經任者試充外舎生限三十人三年六月十八日上新勅令格式行之官制行改教授為博士靖國元年三月續修勅令格式大觀二年十一月詔上舎生三取一限百人政和二年詔外舎生稱武選士内舎生稱武俊士紹興十六年三月庚午朔詔修建武學四月二日上曰習弓馬稍知書則不負教養十九日進呈兵部試選格十二月二十九日從司業陳試之請並試補入學升趙充國像降韓信從祀二十六年四月癸巳置博士弟子貟二十二日詔武學置博士一員以文臣有出身及武舉髙選人充諭一員用武舉人置六齋受成貴謀輔文中古經逺閱禮生徒以八十人為額七月二十四日癸亥詔外舎以七十人内舎二十人上舎十人為額通一百人乾道二年二月八日復置諭七年七月庚寅詔武學赴解試人以五十人為額五年重修武學淳熙四年二月幸武學十六年二月改堂名立武上一字犯太子名與太學同改焉然郡國未之建也慶元五年六月乙亥詔即諸州學置武士齋宫按武蓺程顥右府同薦除判武學顧臨判武學何去非以教授為博士朱熹隆興元年為博士設武科以取士有周道焉所謂貫革之射息説劒搢笏冕衣裳在西學皆俊游也古者干籥皆學於東序貍首騶虞又皆樂師所以教國子也滋水之學圯橋之言慶厯州縣學國朝自嵩陽廬阜嶽麓睢陽各有師徒錫之經𫝊四書院見院類徒咸平四年六月丁卯詔郡縣有學校聚講誦之所賜九經書一部祥符二年二月辛卯曲阜孔子廟立學舎四年十一月益州言永康軍李畋聚徒授經詔赴闕授校書郎俾還鄉校講説乾興元年十一月兖州立學孫奭言頃知兖州於文宣王廟建學舍四十餘區延生徒數百人以楊光輔為講書賜田十頃明道二年五月庚寅許大名府立學賜九經景祐四年十二月壬申詔藩鎮立學寳元元年三月己酉大郡亦立學穎川為大郡蔡齊有請特許之慶厯三年十月詔州府軍監選有文行學官講説四年三月乙亥詔州縣立學用翰林學士宋祁等言詔諸州立學及二百人以上許置縣學轉運使及長吏選幕職州縣官為教授又許舉有徳行藝業之士為之熙寜六年三月己未詔諸路學官委中書選充元豐元年諸路共五十三員紹聖元年三月選進士及經明行脩人為之五月命三省選差十月翟思請修立諸州學舎元符二年十一月二十七日詔諸州學依太學三舎法考選上舎生每嵗貢一人内舎生嵗貢二人崇寧二年五月六日修州縣學敕令格式行之三年正月十七日増縣學弟子員大縣五十人中四十人小三十人大觀二年九月十八日州縣藏書閣賜名稽古政和三年九月詔諸州每嵗燕貢士于學因講射禮宣和三年二月二十日罷天下三舎建炎二年六月復置教授凡四十三州紹興十二年詔諸州守臣修學十三年閏四月二十七日詔並置教授十八年七月九日賈直清請立縣學教授于鄉嘉祐中福之周希孟􅀭之孫侔潁之常秩元祐中杭之吴師仁虢之尹材襄之田述古邠之蘇昞徐之陳師道紹聖則眉之家素元符則楚之徐積紹興則建之胡憲乾道則遂寧之雍山興化之林彖皆以文行命為本州學官胡瑗主湖州學慶厯中有司請下湖學取其法以為太學法熙寜諸路學官小學政和醫學熙寜四年三月庚寅詔諸路置學官州給田十頃為學糧有田者益之仍置小學教授一本云三月五日詔諸州軍置小學教授崇寧元年八月二十三日州縣置小學十􅀊以上入學五年立課試法政和四年十一月二十一日州郡小學分三舎五年正月己丑州縣置醫學熙寧律學熙寧三年九月己亥始用斷案律義試法官判大理寺崔台符等考試六年四月乙亥以朝集院為律學賜錢萬五千緡以養生徒命官舉人各為一齋教授四員使學而後從政㑹要二月二十七日置六年七月王白為正七年教授李昭逺元豐二年四月以新科明法及第王壬為教授志律學博士正各一人無校定法博士掌𫝊授法律及校試之事元祐三年九月乙丑詔省律學博士一員學生不給食靖國元年三月續修律學敕令格式元豐太學三舎法學令元豐二年八月二十九日詔定太學條制丁巳益生員舎為八十齋齋五間十二月十八日乙巳中丞李定等言藝可以一日而校行非歴嵗月不可攷今酌周官書攷賔興之意為太學三舎選察升補之法上國子監勅式令并學令凡百四十條一云四百十條詔行之初太學生檀宗益上書言太學教養之䇿有七一尊講官二重正録三正三舎四擇長諭五増小學六嚴責罰七崇司業上覽其言命定與畢仲衍范鏜張璪等同立法至是上之長編乙巳太學置八十齋齋容三十人外舎生二千内舎生三百上舎生百總為二千四百員學正増為五人録増為十人參用學生長諭以諸生為之入學試而後入月一私試嵗一公試補内舎生間嵗又一試補上舎生月書行藝以帥教不戾規矩為行治經程文合格為蓺外舎生入第一二等參以行藝升内舎内舎生入優平二等參以行藝升上舎三等俱優為上一優一平為中俱中若一優一否為下上等以官中等免禮部試下等免解以升補人行藝進退計人數多寡為學官之殿最賞罰元祐元年四月王巖叟言博士勞於簿書諸生困於文法請罷三舎法開師生不相見之禁講肄之餘止以公私試第髙下五月十二日詔孫覺顧臨程頥同長貳修立國子監條例頥請改試為課制尊賢堂延道徳之士置待賔吏師齋立檢察士人行檢法自元豐増國學解額五百人来者奔凑欲量留百人餘分於諸郡庶幾士安鄉土奏寢十月劉摰請罷修定學制所正録以上考舊條乖戾者去之七月罷中外學官試法詔兩制司業各舉一員從王巖叟言也六月十八日置春秋𫝊士一人六年九月五日禮部言諸生請益許見長貳博士月至齋考其業紹聖元年三月九日郭知章言元豐以来十餘年上舎生推恩惟林自一人元祐罷之非是閏四月七日復行三舎升補法三年修成太學勑令式二十三冊詔明年正月丙戌朔行之本紀云紹聖四年正月丙戌朔詔頒内外學制元符三年十一月復置春秋博士崇寜元年七月罷大觀元年二月置國子博士四員正録各二員與太學官分掌教導九月國子太學辟雍博士共置二十貟國子太學每經一貟辟雍二貟元豐算學崇寜四學大觀小學元豐七年正月吏部請於四選補算學博士闕從之十二月辛未詔通算學者就試上等除博士中下等為學諭元祐元年國子監請修建算學詔罷之崇寜三年六月壬子十一日建算學書畫學都省上書畫學勅令格式醫學有司業博士主簿録諭置一云二年九月壬辰醫學五年四月十二日詔書畫算醫四學並罷其書畫學附國子監置博士各一貟十一月十九日復置算學𨽻祕省大觀元年二月十七日詔書畫學諭正録直各置一人復置醫學三年十一月算學尊黄帝為先師風后等配饗商巫咸至周王朴七十人從祀四年三月二日詔四學併入太醫局太史局翰林書藝圗畫局政和三年復置算學宣和二年七月己未罷大觀三年四月八日修小學勅令格式政和四年小學生近一千人分十齋十二月頒小學條置立三舎五年五月試小學生優等四人賜上舎童子出身宣和二年八月五日中書奏元豐法在京小學止有就傅初筮兩齋無直學等於是罷三舎教諭選大學生為之元祐宗學元祐六年一本云十月宗室令鑠請建宗學於是詔宗正按熙寧敕諸院建小學自八嵗至十四嵗每嵗首檢舉入學及畢工以賜蔡確家建中靖國元年世雄仲爰言之四月九日己亥詔復置宗學崇寜元年十一月十二日諸宫置大小二學治平初諸王宫増置大小學講官宗子世符獻二學頌見宗戚類増置教授二貟立考選法願入太學律學者聴學宗子分𨽻六學教養未宗子年十嵗以上入小二十以上入大學年及願入者聴二十九日詔諸宫學令宗正寺長貳提舉四年改稱某王宫宗子博士位國子博士上諸宫博士共十三貟立三舎法大觀元年十一月置命官正録各一貟以宗子正録副之二年八月三十日詔曰大司徒以六徳六行教萬民而師氏之教國子則三徳三行而已詳於訓士略於治親崇寜教養宗子法倣辟廱太學宜參酌輕重降於内外之法使易以跂及政和學制宗正卿總治宗子大小學之政令少卿貳之紹興五年六月七日大小學教授錢觀復言國子監有政和學制載宗學法崇寧元年十一月置院别都増學宫邸崇寧以知宗同知宗兼領學事大觀三年三月十六日禮部尚書鄭久中請用宗子中上舎第文行有稱者為宗子學官從之宣和三年六月二十七日増置西南外宗院教授元祐廣文館見館類元祐國子監勅令格式書目十九卷元祐中禮部侍郎陸佃祭酒鄭穆等以新舊條并續降㕘詳修定學制書一百三十卷政和中撰以御筆裁定者列卷首崇寧學製一卷御製崇寜辟雍外學崇寜元年八月己卯建辟雍外學南薰門外一本云置于城南處天下貢士十月十七日戊辰初建辟廱外圓南方為屋一千八百七十二楹宰臣言奉詔天下立學官貢士仍建外學于王國之南待其嵗攷行蓺升之太學増上舎二百人内舎六百人處上舎内舎於太學處外舎於外學十二月二十九日為文宣王殿三年十一月甲戌幸太學遂幸辟雍大觀二年正月朔御製辟廱記紹興太學建炎三年四月詔國子監併歸禮部紹興三年六月丁未二十四日復置國子監詔即駐蹕所在學為之量養生徒置博士三員十二年十二月十二日置祭酒司業博士三正録一詔太學養士以三百人為額十三年正月癸卯以岳飛第為國子監太學前洋街堂一曰崇化淳熙十六年二月改今名齋十有二禔身至時中在髙閌擬齋名二月乙酉七舊太學七十齋二月二十二日詔補太學生司業髙閌條上課試法閌言仁宗時判監胡瑗所補監生止試論今秋補欲依此例七月丙子上試合格三百人詔以元祐紹聖監學法㕘定五月詔國子生限以八十人六月二十一日詔王賞撰太學記太祖重建國學陶榖撰記徽宗初起辟雍薛昻序馮熙載記七月癸未新修太學成奉安文宣王于大成殿御書大成殿及門上自題賜書閣牓曰首善乙未髙閌請車駕臨幸上曰己命討論十月己丑上國子監太武學律學小學勅令格式二十五卷十二月丁酉詔太學養士增二百人十四年三月十八日己巳車駕幸太學命閌講泰卦遂幸養正持志二齋四月二十七日詔太學置小學一齋一作六月乙巳十五年二月戊寅增生員一百人外舎生共七百人内舍一百人上舎三十人八月辛丑又增二百人通舊為九百人十六年正月戊寅以一千人為額二十年六月一日詔修太學二十六年二月壬子廣太學生員十二月二十一日以御製孔子并七十二賢贊碑本徧賜諸郡學校乾道五年重修補弟子員舊制四方舉人皆得就試謂之混補淳熙後乃立待補之法以解試人數百人取六慶元中罷之嘉泰二年復行混補紹興國子監小學紹興十四年四月戊申程允元建請六月乙巳詔國子監置小學十三年十二月癸巳詔試中監學生依嘉祐故事給綾紙二十七年二月甲辰詔武學依監學例紹興諸王宫學嘉定宗學紹興三年六月二十三日謝伋言咸平間醇儒授南北宅經義望詔三省擇大小學教官詔各選一人五年四月七日同知宗士㒟請先差大學教授二人小學二人詔可六月七日大小學教授錢觀復奏請復置宫學七月六日宗司奏大小學成八月十九日觀復言宗子昔分為六宅宅各有學學皆有官今惟有睦親宅南班居之講堂三楹又無齋舍請附近睦親宅增廣學舎俾内外宗子均被教養國朝自嘉祐二年諸宫置教授治平元年増置講書及課試規罰之法崇寜大觀間諸宫置博士十三員立三舍升補與貢士一體孟今止行都及㑹稽南班宫邸各置教授二貟先講論俟通經依大學法十四年二月士䅳恵國公同知大宗正事請建學于臨安二十五日丙午禮部奏學生以百人為額大學生五十人小學四十人職事各五人置諸王宫大小學教授二員在學者皆南宫北宅子孫也若親賢宅近屬則别置教授以館職兼不在宗學之例十一月不溢請復置博士正録二十六年六月黄祖舜言仁宗以吴充為吴王宫教授方正清謹教導有方作六箴以獻命録賜南北宫今西南外教授未嘗講説精擇經行之士講習程試如太學法從之二十七年八月四日丁酉宗正丞吴景偲言宫學釋菜無殿講説無堂請增廣黌舎從之嘉定七年五月二十四日都省言在京舊有宗學中興西南外宗司置學而行在宗學未修八月二十六日詔建宗學置六齋生貟以百人為額𨽻祭酒司業九年十二月五日始復置宗學以諸王宫學重建改為宗學改教授為博士又置諭改𨽻宗正寺於是宗室疏逺者咸得就學十年三月十九日宗正寺擬四齋名曰立愛貴仁大雅信厚堂名明倫十四年四月復置教授一員以廣訓迪令舊籍宫學諸生附公私試試中補學生十五嵗以下許試小學生考補如太學例五學之建上親為首士之生王族也宗有法廟有序學有教仕有養用有别漢永平立小侯學而不知先宗子魏孝文開皇宗學而不知擇師儒唐武徳初於秘書外省立小學而不知立太學今逺追三代之規恵顧於族屬此天地之恩風雨霜露之教也國家始立宫學訓諸王之近屬繼剙宗庠徠四方之宗親衍豐芑之仁參棫樸之盛惟古帝王莫不以學為大務而其教自近始至周官成均教國子其法益詳而同姓先焉葢古之政教逺近親踈固自有次第也惟我治朝丕冒出日鳥言鴂舌知誦簡冊之言髽首卉裳競襲端甫之服而庠序俶營乎睢渙嗣音乎郟鄏規摹大於齊魏􅁌誦聞乎荆吴且遍諸郡矣詩言天子養士者周宣王而已采芑是也言諸侯養士者魯僖公而已泮水是也若夫烝我髦士則甫田思古矣在城闕兮則子衿刺亂矣春秋二百四十二年之間諸侯築宗廟宫室臺榭門廐莫不書而以學校見於六經者魯之頖宫鄭之鄉校而已在周則魯侯申能修泮宫詩有其歌在漢則蜀守文翁能首儒學史有其贊玉海卷一百十二
