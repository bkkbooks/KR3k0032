body:
  text: 玉海卷二十一宋王應麟撰地理河渠古者治水或以佐耕或以通漕白公引涇嚴安導洛農民獲其利而轉漕之功弗聞宇公厮流韋堅堰渭漕運僅得其便而灌溉之績弗著兼斯二者厥惟美哉禹九河禹貢兖州九河既道又北播為九河同為逆河入於海注河水分為九在兖州界平原以北是正義爾雅九河之名曰徒駭太史馬頰覆釡胡蘇簡絜鉤盤鬲津鄭𤣥云周時齊桓公塞之同為一河今河間弓髙以東至平原鬲津往往有其遺處春秋緯寳乾圖云移河為界在齊呂填閼八流以自廣鄭元據此文言塞其東流八枝并使歸􅑫駭也釋水云河出崑崙虛漢西域傳云河有兩源一出葱嶺一出于闐于闐在南山下其河北流與葱嶺河合東注蒲昌海南出於積石為中國河九河將欲至海更同合為一大河名為逆河而入於渤海周頌允猶翕河鄭氏箋河自大陸之北敷為九祭者合為一正義鄭志答張逸云鉅鹿今名廣河澤然則河從廣河之北分為九也爾雅從釋地已下至九河皆禹所名也疏李廵曰禹疏九河以徒衆起故曰徒駭顏氏曰人徒驚駭大使徒衆通其水道故曰太史河勢上廣下狹狀如馬頰故曰馬頰水中多渚往往而處形如覆釡故曰覆釡胡蘇下流也簡河水深而大也絜言水多山石治之苦絜鉤盤言河水曲如鉤屈折如盤鬲津河水狹小可隔以為津也孫炎曰徒駭禹疏九河用功雖廣衆懼不成故曰徒駭胡蘓水流多散胡蘇然顏氏曰下流急疾之貌其餘同郭云徒駭今在成平東光縣今有胡蘇亭鬲盤今皆為縣餘名皆云其義未詳漢地志魏郡鄴縣故大河在東北入海勃海郡東光有胡蘇亭成平虖池河曰徒駭河平原郡鬲平當以為鬲津般顔注云爾雅九河鉤盤郭璞以為水曲如鉤流般旋也禹陳九河云復其故道名應先有不宜徒駭太史因禹立名此郭氏所未詳也或禹治水更别立名許商上書曰古記九河之名云云是知九河所在徒駭最北鬲津最南盖徒駭是河之本道東出分為八枝也許商上言三河下言三縣則徒駭在成平胡蘇在東光鬲津在鬲縣其餘六者大史馬頰覆釡在東光之北成平之南簡絜鉤盤在東光之南鬲縣之北也其河填塞時有故道鄭𤣥云齊桓公塞之詩書正義同馬史記正義徳駭在滄州景城頰覆釡在州安徳胡蘇鬲津在滄州胡蘓簡在貝州歴亭縣界漢志齊人延年上書開大河上領出之胡中東注之海武帝報曰河廼大禹所道也聖人作事為萬世功通於神明恐難改更成帝時許商以為古説九河之名有徒駭胡蘇鬲津今見在成平東光鬲界中師古曰此九河之三也自鬲以北至徒駭間相去二百餘里孫禁所欲開者在九河南馮逡言禹非不愛民力以地形有執故穿九河今既滅難明李尋解光言議者常欲求索九河故迹而穿之今因其自決可且勿塞以觀水埶哀帝初平當奏言九河今皆窴滅宜求能浚川疏河者賈讓言禹鑿龍門辟伊闕析底柱破碣石墮斷天地之性王莽召能治河者關並言河決常於平原東郡左右禹治河時本空此地韓牧以為可略於禹貢九河處穿之縱不能為九但為四五宜有益王横言九河之地已為海所漸禹之行河水本隨西山下東北去周譜云定王五年河徙則今所行非禹之所穿也賛曰中國川原以百數莫著於四瀆而河為宗敘曰商竭周移秦決南涯自兹距漢北亡八支注九河餘有一也杜佑通典九得其六四在景城二在平原其太史簡絜未詳處所許商得其三史河渠書禹以為河所從來者髙水湍悍難以行平地數為敗乃厮二渠以引其河北載之髙地過降水至於大陸播為九河同為逆河入於勃海謂北分為九河以殺其怒又至滄州同合為一大河名逆河至平州碣石山而入勃海皆禹所加功故叙之碣石海邊山名在北平郡驪城西南河口之地今平州之南地志魏郡鄴縣有故大河在東北直達于海疑即禹之故河舜紀唯禹之功為大牧九山通九澤決九河定九州李斯𫝊韓子曰禹疏九河曲九防孟子禹疏九河荀子成相禹北決九河通十二渚疏三江淮南子禹剔河而道九歧鑿江而通九路又曰禹為水以身請于陽旴之河賈誼新書大禹鬟河而道之九牧鑿江而導九路澄五湖而定東海禮匠人注禹鑿龍門播九河為此逆阞與不理孫出也左傳西至于河正義釋例曰河出西平西南二千里從西平東北經金城故北地朔方五原至故雲中南經平陽河東之西界東經河東河内之南界東北經汲郡頓丘陽平平原樂陵之東南入海案驗其地自大伾以上河道不改大伾以下即是汲郡以東河水東流秦漢以來始然也古之河道自大伾而北過洚水故迹不可復知其大陸則趙地之廣澤也大陸以北播為九河九河故道河間成平以南平原鬲縣以北徙駭最西以次而東中候云齊桓覇遏八流以自廣計桓公之時齊之西竟當在九河之最西徙駭齊之西界穆天子𫝊升于盟門九河之隥注尸子曰河出于盟門之上水經注穆天子𫝊曰北登盟門九河之蹬東入般縣為般河盖亦九河之一道也楚詞與女游兮九河選注春秋命厯序曰人皇九頭提羽蓋乘雲車出暘谷分九河徐幹齊都賦川瀆則洪河洋洋發源崑崙九流分逝北朝滄淵驚波沛厲望沫揚奔山海經崑崙墟在西北河水出其東北隅河水出勃海又海水西北入禹所道積石山水經注河出崑崙重源潛發淪于蒲昌出于海水故洛書曰河自崑崙出于重野成公子安大河賦曰潛崑崙之峻極出積石之嵯峨釋氏西域𫝊曰河自蒲昌潛行地下南出積石通鑑開元十六年正月丙寅宇文融請用禹貢九河故道開稻田以融為九河使事不就蔡氏書傳九河其一則河之經流先儒不知遂分簡潔為二徒駭地志云滹沱寰宇記在滄州清池許商云在成平馬頰元和志在徳州安徳平原南東寰宇記在棣州滴河北輿地志即篤馬河覆釡通典在徳州安徳胡蘇寰宇記在滄之饒安無棣臨津三縣許商云在東光簡潔輿地記云在臨津鉤盤寰宇記云在樂陵東南從徳州平昌來輿地記云在樂陵鬲津寰宇記在樂陵東西北流入饒安許商云在鬲縣輿地記云在無棣太史不知所在自漢以來講求九河漢世近古止得其三唐人集累世積𫝊之語遂得其六歐陽忞輿地記又得其一或新河而載以舊名或一地而互為兩説皆無依據鄭氏求之不得又以為齊桓塞其八流以自廣夫曲防齊之所禁塞河宜非桓公所為惟程氏以為九河之地已淪於海引碣石為證今滄州之地北與平州接境相去五百餘里禹之九河當在其地後為海水淪没故其迹不存漢王横言昔天嘗連雨東北風海水溢西南出浸數百里九河之地已為海水所漸酈道元亦為九河碣石苞淪於海碣石之地淪入於海河益徙而南曽氏曰其一不名者河之經流先儒分簡絜為二非也林氏以為不然河自大陸以北播為九道其勢均也安得以一為經流八為支派哉禹之前既有九河洪水湮塞禹乃疏之故此言九河既道但疏通復其故道耳播之者非禹也河自冀之大陸北流入兖分為九道張洎曰河自魏郡貴鄉縣界分為九道下至滄州合為一河禹二渠史河渠書夏書曰禹抑鴻水十三年過家不入門陸行載車水行載漢志作乘舟泥行蹈毳山行即橋漢志作則梮以别九州隨山浚川任土作貢通九道陂九澤度九山然河菑衍溢害中國也尤甚唯是為務故道河自積石歴龍門南到華陰東下砥漢志作底柱及孟漢志作盟津雒汭漢志作内至于大伾臣瓉曰黎陽山於是禹以為河所從來者髙水湍悍難以行平地數為敗乃厮漢志作釃二渠以引其河孟康曰釃分也分其流泄其怒二渠其一出貝丘西南南者也其一則漯川也貝丘河自王莽時其流遂塞唯用漯耳貝丘屬清河今清河郡西書稱北過洚水至于大陸是也漯川在汲郡東一里漯水出東郡東武陽東北至千乘入海桑欽言出平原髙唐書浮于漯是也北載之髙地過洚水在信都至于大陸鉅鹿郡禹貢大陸澤佑程氏曰大陸孫炎曰鉅鹿北廣河澤去古河絶逺杜李吉甫以邢趙深三州為大陸者得之播為九河同為逆河漢志云迎河迎王莽改勃海曰河入于勃海注瓚曰禹貢夾右碣石入于河然則河口入海乃在碣石也武帝元光二年河徙東郡更注勃海禹時不注勃海也九川既疏九澤既灑漢志作陂諸夏艾安功施于三代自是之後滎陽下引河東南為鴻溝索隱曰為二流一南經陽武為官渡水一東經大梁城今之汴河是也以通宋鄭陳蔡曹衛與濟汝淮泗㑹于楚西方則通渠漢水雲夢之野東方則通溝江淮之間於呉則通渠三江五湖於齊則通菑濟之間於蜀蜀守冰李氷鑿離􅕞辟沫水之害穿二江成都之中杜預益州記云二江者郫江流江也此渠皆可行舟有餘則用溉浸百姓饗其利至於所過引水益用溉田疇之渠以萬億計然莫足數也溝洫志同武帝道河北行二渠復禹舊迹同上封禪書至瓠子塞決河徙二渠復禹之故迹大事記周威烈王十三年晉河岸傾壅龍門至于底柱春秋後河患見史傳始於此秦漢以後始為大患賈讓曰隄防起戰國雍防百川各以自利周語太子晉曰古之長民者不墮山不崇藪不防川不竇澤夫川氣之導也澤水之鍾也疏為川谷以導其氣陂唐汚庳以鍾其美故氣不沈滯而亦不散越昔共工壅防百川墮髙堙庳以害天下伯禹疏川道滯鍾水豐物封崇九山決汩九川陂障九澤豐殖九藪汩越九原宅居九隩合通四海孟子禹之行水行其所無事也文選司馬相如難蜀父老夏后堙洪塞原灑沈澹災東歸之海禹溝洫益稷禹曰決九川距四海濬畎澮距川注九州名川通之至海正義以小注大故從畎遂溝洫乃以入澮澮入於川川入於海是畎内之水亦入海也論語泰伯篇禹卑宫室而盡力乎溝洫正義田間通水之道應劭曰溝廣四尺深四尺洫廣深倍於溝史記紀禹致費於溝淢注包氏曰方里為井井間有溝溝廣深四尺十里為成成間有淢淢廣深八尺周溝洫地官遂人掌邦之野野謂甸稍縣都凡治野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有涂千夫有澮澮上有道萬夫有川川上有路以達於畿注十夫二鄰之田百夫一酇之田千夫二鄙之田萬夫四縣之田遂溝洫澮皆所以通水於川也遂廣深各二尺溝倍之洫倍溝澮廣二尋深二仞經畛涂道路皆所以通車徒於國都也萬夫者方三十三里少半里九而方一同以南畮圖之則遂從溝横洫從澮横九澮而川同其外焉稻人掌稼下地以水澤之地種穀以豬蓄水以防止水以溝蕩水以遂均水以列舍水非一道以去水也以澮寫水以涉揚其芟作田注偃豬者蓄流水之陂也防豬旁隄也遂田首受水小溝也列田之畦㽟也澮田尾去水大溝冬官匠人為溝洫主通利田間之水道耜廣五寸二耜為耦一耦之伐廣尺深尺謂之甽田首倍之廣二尺深二尺謂之遂夫間小溝九夫為井井間廣四尺深四尺謂之溝方十里為成成間廣八尺深八尺謂之洫方百里為同同間廣二尋深二仞謂之澮此畿内采地之制采地制井田專逹於川各載其名識水所從出凡天下之地埶兩山之間必有川焉大川之上必有涂焉凡溝必因水埶防必因地埶善溝者水漱之善防者水滛之凡溝防必一日先深之以為式程人功也里為式然後可以傅衆力疏六鄉六遂與公邑皆為溝洫法三等采地乃為井田按遂人則百里之内八十一澮此井田則一同惟一澮彼遂在夫間故以南畝遂則縱矣此井田云田首倍之為遂以南畆圖之遂即横也遂人溝涂之制與匠人異於遂人言五溝之制而始於遂匠人言五溝之制而始甽地形有逆順水埶有遲速故遂人之溝澮䟽匠人之溝澮宻至于下地又有制稻人之法遂人成周之制匠人兼異代之夏官司險設國之五溝注遂溝洫澮川也掌固修溝池渠之固秋官雍氏掌溝瀆澮池之禁春令為溝澮之利民者疏按遂人匠人惟有遂溝洫澮川不見有瀆此云瀆亦田間通水者詩築城伊淢戰國䇿東周欲為稻西周不下水鄭子駟為田洫正封疆而侵四族田子産作封洫呉㑹黄池闕深溝於商魯之間城邦溝通江淮公劉居豳觀其流泉召伯營謝泉流既清秦鄭國渠漢溝洫志至於他往往引其水用溉田溝渠甚多然莫足數也魏史起引漳水溉鄴見後其後韓聞秦之好興事秦嬴政元年欲罷之無令東伐廼使水工鄭國間説秦令鑿涇水自中山以西邸瓠口為渠師古曰中讀曰仲即今九嵏之東仲山也邸至也史記索隠曰瓠口即谷口與池陽相近故曰池陽谷口並北山東注洛三百餘里洛水即馮翊漆沮水欲以溉田中作而覺秦欲殺鄭國鄭國曰始臣為間然渠成亦秦之利也臣為韓延數嵗之命而為秦建萬世之功秦以為然卒使就渠渠成而用溉注填閼之水溉舄鹵之地四萬餘頃收皆畝一鍾六斛四斗於是關中為沃野無凶年秦以富彊卒并諸侯因名曰鄭國渠史記表始皇元年乙卯作鄭國渠地理志始皇之初鄭國穿渠引涇水溉田沃野千里民以富饒馮翊徳洛水東南入渭通典京兆雲陽縣有鄭國渠水經注沮水東注鄭渠唐夷狄傳杜佑謂秦漢鄭渠溉田四萬頃白渠溉田四千五百頃永徽中兩渠灌浸不過萬頃大厯初減至六千畝畝朘一斛嵗少四五百萬斛復兩渠之饒誘農夫趣耕河隴可復秦石犀渠輿地廣記秦時李冰作石犀五以厭水精穿石犀渠於南江命之曰犀牛里唐置犀浦縣屬益州取此為名蜀都賦演以潛沫浸以緜雒溝洫脉散疆里綺錯黍稷油油粳稻莫莫指渠口以為雲門灑滮池而為陸澤雖星畢之滂沱尚未齊其膏液注李冰於湔山下造大堋以壅江水分散其流溉灌平地故曰渠口魏十二渠漳渠史記西門豹為鄴令鑿十二渠以富民漢溝洫志魏文侯時西門豹為鄴令有令名文侯曽孫襄王與羣臣飲酒祝曰令吾臣皆如西門豹史起進曰魏氏之行田以百畝鄴獨二百畝是田惡也漳水在其旁西門豹不知用是不智也知而不興是不仁也仁智豹未之盡何足法也於是以史起為鄴令遂引漳水溉鄴以富魏之河内民歌之曰鄴有賢令為史公決漳水兮灌鄴旁終古舄鹵兮生稻梁括地志漳水源出潞州長子縣西力黄山史河渠書西門豹引漳水溉鄴以富魏之河内漢安帝紀元初二年春正月修理西門豹所分漳水為支渠以溉民田注渠今在相州鄴縣西左思魏都賦西門溉其前史起灌其後墱流十二同原異口菑為屯雲泄為行雨注今鄴下有十二墱晉束晳傳晳上議曰兩周争東西之流史起惜漳渠之浸明地利之重也漢塞決河宣防宫復禹迹瓠子歌溝洫志漢興三十九年孝文時河決酸棗東潰金隄東郡興卒塞之後二十六嵗孝武元光中三年五月河決瓠子東南注鉅野通淮泗上使汲黯鄭當時興人徒塞之輒復壞時田蚡奉邑食鄃鄃居河北河決而南則鄃無水災因言以人力强塞未必應天而望氣用數者亦以為然是以久不復塞後三十餘嵗嵗數不登梁楚尤甚元封元年上封禪祭山川明年二年乾封少雨夏四月使汲仁郭昌發卒數萬人塞瓠子決河上用事萬里沙還括地志在萊州掖縣東北二十里自臨決河湛白馬玉璧以禮水神令羣臣從官自將軍以下皆負薪窴決河下淇園之竹以為揵上悼功之不成廼作歌曰瓠子決兮將奈何浩浩洋洋慮殫為河吾山平兮鉅野溢魚弗欝兮栢冬日歸舊川兮神哉沛不封禪兮安知外一曰搴長茭兮湛美玉河公許兮薪不屬隤林竹兮揵石菑宣防史記作宣房塞兮萬福來歌有二章於是卒塞瓠子築宫其上名曰宣防而道河北行二渠復禹舊迹而梁楚之地復寧無水災武紀元封二年四月至瓠子臨河决塞河隄作瓠子歌宣紀本始二年詔曰武帝封泰山塞宣防蘇林曰隄名在東郡界河渠書余從負薪塞宣房悲瓠子之詩作河渠書封禪書至瓠子自臨塞決河留二日沈祠而去使二卿將卒塞決河徙二渠復禹之故迹焉郊祀志河溢皋陸隄繇不息枚皋𫝊從行至甘泉塞河宣房上有所感輒使賦之石慶𫝊通八神以合宣房叙𫝊文陻棗野武作瓠歌括地志故龍泉宫俗名瓠子宫亦曰宣房宫在濮陽縣北十里今開徳府濮陽有瓠子口河名也九域志濮州有瓠子河又開徳府亦有之水經瓠子河出東郡濮陽縣北注縣北十里即瓠河口亦謂瓠子堰為宣房堰水經又曰瓠河北過東郡范縣東北為濟渠與將渠合又東北過茌平縣東為鄧里渠通典秦始皇二十二年攻魏決河灌其郡決處遂大不可復補前地志金城郡河關縣注積石山在西南羌中河水行塞外東北入塞内至章武入海過郡十六行九千四百里漢河決凡七孝文時酸棗孝武元光中瓠子又北決館陶元帝永元五年清河靈鳴犢口成帝初後三嵗館陶後二嵗平原鴻嘉四年渤海清河信都河水溢張良渠水經注漢中安陽縣水北有七女池池東有明月池狀如偃月皆相通注謂之張良渠盖良所開也漢漕渠漕直渠汾河渠渠田朔方溉渠漢運渠見下唐廣運潭武紀元光六年壬子嵗春穿漕渠通渭溝洫志元光中河決於瓠子時鄭當時為大司農言異時關東漕粟從渭上度六月罷而渭水道九百餘里時有難處引渭水穿渠起長安旁南山下至河三百餘里徑易漕度可令三月罷渠下民田萬餘頃又可得以溉此損漕省卒而益肥關中之地得糓上以為然令齊人水工徐伯表師古曰行穿渠之處而表記之今之立標是也發卒數萬人穿漕渠三嵗而通以漕大便利其後漕稍多而渠下之民頗得以溉矣後河東守畨係言漕從山東西嵗百餘萬石更底柱之艱敗亡甚多而煩費宜穿渠引汾溉皮氏汾隂下引河溉汾隂蒲坂下度可得五千頃故盡河堧棄地民茭牧其中今溉田之度可得糓二百萬石以上糓從渭上與關中無異而底柱之東可毋復漕上以為然發卒數萬人作渠田數嵗河移徙渠不利田者不能償種久之河東渠田廢子越人師古曰越人習於水田令少府以為稍入其後人有上書欲通褒斜道及漕見漕運哀帝初賈讓言多穿漕渠於冀州地使民得以溉田分殺水怒雖非聖人法然亦救敗術也據堅地作石隄冀州渠首盡當卬此水門治渠非穿地也東方一隄北行三百餘里入漳水中其西因山足髙地諸渠股引取之旱則開東方下水門溉冀州水則開西方髙門分河流通渠有三利食貨志先是十餘嵗河決灌梁楚地而縁河之郡隄塞河輒壞決費不可勝計其後畨係欲省底柱之漕穿汾河渠以為溉田鄭當時為渭漕回逺鑿漕直渠自長安至華隂而朔方亦穿溉渠作者各數萬人歴二三期而功未就費亦各以鉅萬十數班固西都賦東郊有通溝大漕潰渭洞河泛舟山東控引淮湖與海通波杜篤賦鴻渭之流徑入于河大船萬艘轉漕相過漢運渠見下唐廣運潭漢六輔渠溝洫志自鄭國渠起始皇元年乙卯至元鼎六年庚午百三十六嵗而兒寛為左内史奏請穿鑿六輔渠師古曰在鄭國渠之裏今尚謂之輔渠亦曰六渠以益溉鄭國傍髙卬之田上曰農天下之本也泉流灌浸所以育五糓也左右内史地名山川原甚衆細民未知其利故為通溝瀆蓄陂澤所以傋旱也今内史稻田租挈重不與郡同租挈收田租之約令也郡謂四方諸郡也其議減令吏民勉農盡地利平繇行水勿使失時平繇者均齊渠堰之力役兒寛𫝊遷左内史表奏開六輔渠韋昭曰六輔謂京兆馮翊扶風河東河南河内也劉徳曰於六輔界中為渠也師古曰二説皆非也溝洫志云益溉鄭國旁髙卬之田此則於鄭國渠上流南岸更開六道小渠以輔助溉灌耳今雍州雲陽三原兩縣界此渠尚存鄉人名曰六渠亦號輔渠河渠書云關内則輔渠靈軹是也焉説三河之地哉定水令以廣溉田為用水之次具立法令皆使得其所收租税時裁濶狹與民相假貸史河渠書自宣房後用事者争言水利朔方西河河西酒泉皆引河及川谷以溉田而關中輔渠靈軹引堵水汝南九江引淮東海引鉅定澤名泰山下引汶水皆穿渠為溉田各萬餘頃佗小渠披山通道者不可勝言志同理道要訣漢文翁為蜀郡太守穿􅋩㳛口溉灌繁田千七百頃漢屯氏河溝洫志自塞宣房後河復北決於館陶分為屯氏河東北經魏郡清河信都勃海入海廣深與大河等因其自然不隄塞也此開通後館陶東北四五郡雖時小被水害而兖州以南六郡無水憂元帝永光五年河決清河靈鳴犢口而屯氏河絶成帝初清河都尉馮逡奏言郡承河下流所以濶無大害者以屯氏河通兩川分流也新絶未久其處易浚許商行視以為可且勿浚地理志魏郡館陶河水别出為屯氏河東北至章武入海過郡四行千五百里清河郡靈縣河水别出為鳴犢河東北至蓨入屯氏河信成張甲河首受屯氏别河漢白渠兩渠溝洫志韓使水工鄭國間説秦令鑿涇水自中山西邸瓠口為渠即谷口並北山東注洛三百餘里渠成而用溉注填閼之水溉舄鹵之地四萬餘頃畝皆收一鍾關中為沃野無凶年秦以富彊後武帝太始二年鄭國渠至此百五十二嵗自六輔渠起至此十六嵗趙中大夫白公復奏穿渠引涇水首起谷口尾入櫟陽注渭中袤二百里水經注云出于鄭渠下南溉田四千五百餘頃因名白渠民得其饒歌之曰田於何所池陽谷口鄭國在前白渠起後舉臿成雲決渠為雨涇水一石其泥數斗且溉且糞長我禾黍衣食京師億萬之口言此兩渠饒也地理志邯郸有堵山牛首水所出東入白渠魏郡武安欽口山白渠水所出武始有拘澗水東北至邯鄲入白渠西都賦鄭白之沃衣食之源提封五萬疆場綺分溝塍刻鏤原隰龍鱗決渠降雨荷臿成雲五糓垂穎桑麻鋪棻潘岳西征賦浸決鄭白之渠漕引淮海之粟水經注渭水又東得白渠口理道要訣唐永徽中雍州刺史長孫祥奏曰鄭白渠昔溉田四萬餘今止萬許於是毁碾磑至大厯中纔六千二百餘頃唐事見後漢龍首渠井渠溝洫志武帝時嚴熊河渠書莊熊羆言臨晉民願穿洛以溉重泉以東萬餘頃故惡地臨晉重泉皆馮翊縣得水可令畝十石于是發卒萬人穿渠自徵引洛水至商顔下徴即所謂澄城也商顏商山之顔岸善傾乃鑿井深者四十餘丈往往為井井下相通行水水隤以絶商顔東至山嶺十餘里間井渠之生自此始穿渠得龍骨故名曰龍首渠作之十餘嵗渠頗通猶未得其饒志不言年月括地志伏龍祠在同州馮翊縣西北四十里故老云漢穿渠得龍骨其後立祠因以伏龍為名長安志龍首渠在長安縣東北五里自萬年縣界流入注于渭一名滻水渠自萬年縣界龍首鄉馬頭控堰滻水入此渠西流由府城東過入長安縣界長西京道里記曰隋開皇三年引滻水北流入苑渠在樂坡上堰近龍首即大明宫所據龍首原也渠漢武所穿在同州商顔山下謂滻名龍首渠者誤也後周武帝保定二年正月壬寅初於蒲州開河渠同州開龍首渠以廣灌溉唐見後漢靈軹渠成國渠湋渠昆明渠修舊渠溝洫志武帝封禪明年塞瓠子是後用事者争言水利朔方西河河西酒泉皆引河及川谷以溉田而關中靈軹地理志扶風盩厔縣有靈軹渠武帝穿五括地志靈軹渠一名䝉籠渠首起雍州盩厔東十里平地水經注䝉籠源亦曰靈軹源成國地理志渠在右扶風郿縣首受渭東北至上林入䝉籠渠湋渠引諸川溉田萬餘頃注如淳曰成國渠在陳倉湋水出韋谷成國地志與本注不同黄圖漢圓丘在昆明故渠南水經注渭水東合昆明故渠後西羌𫝊虞詡曰雍州厥田惟上因渠以溉水舂河漕用功省而軍糧足後紀和帝永元十年三月壬戌詔曰隄防溝渠所以順地理通利壅塞刺史二千石其隨宜疏導安帝元初二年二月辛酉詔三輔河内河東上黨趙國太原