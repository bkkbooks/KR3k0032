口石門門南際河有故碑云惟陽嘉三年二月丁丑使河隄謁者王誨䟽達河川述荒庶土云大河衝塞侵齧金隄以竹籠石葺葦土而為遏壞隤無已功消億萬請以濱河郡徙疏山采石壘以為鄣功業既就徭役用息詔書許誨立功府鄉規基經始詔䇿加命遷在沇州乃簡朱軒授使司馬登令纘茂前緒稱遂休功登以伊洛合注大河南則緣山東過大伾回流北岸其勢鬱幪濤怒湍急激疾一有決溢彌原淹野蟻孔之變害起不測盖自姬氏之所常蹙昔崇鮌所不能治我二宗之所劬勞於是乃䟦涉躬親經之營之比率百姓議之于臣伐石三谷水匠致治立激岸側以捍鴻波隨時慶賜説以勸之川無滯越水土通演役未踰年而功程有畢斯乃元勲之嘉課上徳之𢎞表也昔禹修九道書録其功后稷躬稼詩列于雅夫不憚勞謙之勤夙興厥職充國惠民亦得湮没而不章焉故遂刋石記功垂示于後使河隄謁者司馬登字伯志王誨字孟堅唐志都水監河隄謁者六人正八品下掌隄堰溝瀆漁浦之事涇渭白渠以京兆少尹一人督視漢陽渠張純𫝊建武二十三年為大司空明年上言穿陽渠引洛水為漕百姓得其利注陽渠在洛陽城南水經注城之西南有陽渠周公制之漢汴渠浚儀渠莨蕩渠鴻溝浚儀二渠禹貢圖河渠書明帝紀永平十二年夏四月遣將作謁者王呉修汴渠自滎陽至于千乘海口千餘里注汴渠即莨蕩渠也汴自滎陽首受河所謂石門在滎陽山北一里過汴以東積石為隄亦號金隄順帝陽嘉中所作也前志有狼湯渠説文濄水受淮陽扶溝狼湯渠東入淮十三年夏四月汴渠成辛巳行幸滎陽廵行河渠乙酉詔曰自汴渠決敗六十餘嵗王景𫝊云平帝時汴河壊決加頃年以來雨水不時汴流東侵日月益甚水門故處皆在河中漭瀁廣溢莫測涯岸蕩蕩極望不知綱紀今豫兖之人多被水患乃云縣官不先人急好興他役又或以為河流入汴幽冀蒙利故曰左隄强則右隄傷左右俱强則下方傷宜任水勢所之使人隨髙而處公家息壅塞之費百姓無䧟溺之患議者不同南北異論朕不知所從久而不決今既築隄理渠絶水立門河汴分流復其舊迹陶丘之北漸就壤墳故薦嘉玉潔牲以禮河神東過洛汭歎禹之績令五土之宜反其正色濵渠下田賦予貧人無令豪右得固其利庶幾世宗瓠子之作因遂度河登太行進幸上黨王景𫝊沉深多技藝辟司空伏恭府時有薦景能理水者顯宗詔與將作謁者王呉共修作浚儀渠水經注云渠流東注浚儀呉用景墕流法水乃不復為害初平帝時河汴決壞不及修建武十年陽武令張汜上言改修隄防光武嘗發卒營功浚儀令樂俊上言新被兵革未可修理遂止後汴渠東侵日月彌廣而水門故處皆在河中兖豫百姓怨嘆以為縣官恒興他役不先民急永平十二年議修汴渠乃引見景問以理水形便景陳其利害應對敏給帝善之又以嘗修浚儀功業有成乃賜景山海經禹所作十三篇河渠書太史公禹貢圖及錢帛衣物夏遂發卒數十萬遣景與王呉修渠築隄自滎陽東至千乘海口千餘里景乃商度地勢鑿山阜破砥績直截溝澗防遏衝要疎決壅積十里立一水門令更相洄注無復潰漏之患景雖簡約役費然猶以百億計明年夏渠成帝親自廵行詔濵河郡國置河隄員吏如西京舊制景由是知名王呉及諸從事掾吏皆増秩一等景為侍御史十五年從駕東廵狩至無鹽帝嘉其功績拜河隄謁者賜車馬縑錢章紀元和三年二月壬寅詔曰歴魏郡經平原升踐隄防詢訪耆老徃者汴門未作深者成淵淺則泥塗追惟先帝勤人之徳底績逺圖復禹𢎞業聖迹滂流至于海表月令孟夏善相丘陵土地所宜今肥田尚多未有懇闢其悉賦貧民云通典汴渠在河陰縣南二百五十歩坤元録云亦名莨蕩渠今名通濟渠首受黄河漢書有滎陽漕渠元和郡縣志汴渠在河隂縣南二百五十步漢滎陽縣亦名莨蕩渠禹塞滎澤開渠以通淮泗漢永平命王景修渠自宋武北征之後復堙塞大業元年更開導名通濟渠隋氏作之雖勞後代實受其利水經注浚儀縣竹書紀年梁惠成王三十一年三月為大溝於此郛以行圃田之水陳留風俗𫝊曰縣北有浚水像而儀之故曰浚儀續述征記曰汴沙到浚儀而分汴東注沙南流建寧四年於敖城西北壘石為門以遏渠口謂之石門故世亦謂之石門水門廣十餘丈西去河三里石銘云建寧四年十一月黄場石史記髙紀四年項羽與漢王約中分天下割鴻溝而西為漢東為楚正義應劭云在滎陽東南二十里文頴曰於滎陽下引河東南為鴻溝後志滎陽有鴻溝水以通宋鄭陳蔡曹衛與濟汝淮泗㑹於楚溝洫志河渠書即今官渡水也張華云大梁城在浚儀縣縣西北渠水東經此城南又北屈分為二渠其一渠東南流始皇鑿引河水以灌大梁謂之鴻溝楚漢㑹此處也一渠東經陽武縣南為官渡水今鴻溝口在河口西百里鴻溝歴大梁城東南入睢泗俱入淮㑹於楚地水經注云瓠子之水絶而不通唯溝瀆存焉戰國䇿秦決滎澤而水大梁又曰魏南有鴻溝魏武紀建安七年正月至浚儀治睢陽渠後魏書崔亮議修汴蔡二渠以通邊運説文汳水受陳留浚儀陰溝至蒙為雝水東入于泗漢蒲吾渠石臼河羊腸倉郡國志常山國蒲吾注史記畨吾君杜預曰晉之蒲邑也古今注曰永平十年作常山呼沱河蒲吾渠通漕船也南行唐有石臼谷雁門郡鹵城注山海經曰泰一作大戱之山呼沱之水出焉周禮并州其川呼沱魏志曰建安十年鑿渠自呼沱入汾名平虜渠光武紀至呼沱河注在今代州繁畤縣東流經定州深澤縣東南即光武所度處今俗猶謂之危度口臣賢按呼沱河舊在饒陽南至魏太祖曹操因饒河故瀆決令北注新溝水所以在饒陽北章紀建初三年夏四月己巳罷常山呼沱石臼河漕注石臼河名在今定州唐縣東北時鄧訓上言此漕難成遂罷之漕水運也鄧后紀父訓為謁者使修石臼河嵗活數千人鄧訓𫝊永平中理虖沱石臼河從都慮一作盧至羊腸倉欲令通漕太原吏人苦役連年無成轉運所經三百八十九隘前後没溺不可勝筭建初三年拜訓謁者使監領其事訓考量隱括知大功難立具以上言肅宗從之遂罷其役更用驢輦嵗省費億萬計全活徒士數千人注酈元水經注云汾陽故城積粟所在謂之羊腸倉在晉陽西北石隥縈委若羊腸焉故以為名今嵐州界羊腸阪是也史記蘇秦曰燕南有嘑沱易水唐六典呼沲在定滄二州界與漳水合漢方梁石洫鮑昱𫝊永平五年拜汝南太守郡多陂池嵗嵗決壞費常三千萬餘昱乃作方梁石洫水常饒足溉田倍多人以𣪞富注洫渠也以石為之猶今之水門馬援𫝊嶠南悉平所過為郡縣治城郭穿渠灌溉以利民類要蔡州石塘陂在真陽縣西北二十里鮑昱甃石堰水灌田漢鮦陽渠樊惠渠何敞𫝊和帝時為汝南太守敞疾文俗吏以苛刻求當世名譽故在職以寛和為政又修鮦陽舊渠百姓賴其利墾田増三萬餘頃吏人共刻石頌敞功徳注鮦陽縣屬汝南郡鮦陽在鮦水之陽故城在今新蔡縣北水經注云葛陂東出為鮦水俗謂之三丈陂水經注又云鮦陂東注為富水藝文類聚蔡邕京北樊惠渠頌光和五年京兆尹樊君立新渠漢漳水支渠魏漳渠見上安帝紀元初二年春正月修理西門豹所分漳水為支渠以溉民田注史記曰西門豹為鄴令發人鑿十二渠引水溉田魏志建安十八年九月鑿渠引漳水入白溝以通河前地志上黨郡長子鹿谷山濁漳水所出東至鄴入清漳魏郡武始漳水東至邯鄲入漳又邯㑹縣注云漳水之别魏都賦石杠飛梁出控漳渠疏通溝以濵路羅青槐以䕃塗注魏武帝堰漳水在鄴西二十八里名曰漳渠堰東入鄴城經宫中東出南北二溝夾道東行出城所經石竇也東魏築漳濵堰本朝志相州鄴縣有西門渠漢太原舊渠安紀元初三年春正月甲戌修理太原舊溝渠溉灌官私田注酈元水經注曰昔智伯遏晉水以灌晉陽後人踵其遺跡蓄以為沼分為二派北瀆即智氏故渠也其瀆乘髙東北注入晉陽城以溉灌東南出城注于汾水今所修溝渠即謂此地理志晉陽晉水所出東入汾漢三郡河渠西羌𫝊順帝永建四年虞詡上疏帝乃復三郡朔方西河上郡使謁者郭璜督趣徙者各歸舊縣繕城郭置候驛既而激河浚渠為屯田省内郡費嵗一億計漢鹽監渠見鹽池漢御溝文選注洛陽記曰天淵南有召溝御溝也崔豹古今注曰長安御溝謂之楊溝植楊於溝上亦見黄國戴延之西征記曰御溝引金谷從閶闔門入雍州圖經曰金谷水出藍田西終南山西入霸水漢平虜渠泉州渠魏志建安十一年三郡烏桓承天下亂破幽州略有漢民合十餘萬户袁紹皆立其酋豪為單于遼西單于蹋頓尤彊尚兄弟歸之數入塞為害曹公將征之鑿渠自呼沱入𣲖音孤水名平虜渠又從泃音句河口鑿入潞河名泉州渠以通海一云通運十二年八月斬蹋頓唐亦有平虜渠漢三渠唐吐蕃𫝊大厯十三年虜大酋馬重英以四萬騎冦靈州塞漢御史尚書三渠以擾屯田為朔方留後常謙光所逐史河渠書太史公曰迎河行淮泗濟漯洛渠魏成國渠臨晉陂漕渠詳見屯田魏明帝青龍元年司馬懿穿成國渠築臨晉陂溉田數千頃國以充實焉出晉宣帝紀梁時懿封舞陽侯遷大將軍都督雍二州諸軍事與漢諸葛亮相距方退食貨志開成國渠自陳倉至槐里築臨晉陂引汧溉舄鹵之地三千餘頃元和志在郿縣東北九里受渭水溉田鄧艾傳時欲廣田蓄糓為滅賊之資使艾行陳潁以東至壽春艾為田良水少不足以盡地利宜開河渠可以大積軍糧又通軍運之道乃著濟河論以喻其指正始二年乃開廣漕渠每東南有事大軍出征泛舟而下達于江淮資食有餘而無水害艾所建也正始三年三月司馬仲逹奏穿廣漕渠引入汴溉東南陂始大田於淮北束晳傳晳議曰谷口之謡載在史篇荆揚兖豫汙泥之土渠塢必多不待天時而豐年可獲以其雲雨生于畚臿多稌生於決泄魏淮陽渠百尺渠二渠討虜渠見屯田類文帝紀黄初六年三月行幸召陵通討虜渠晉食貨志魏修廣淮陽百尺二渠上引河流下通淮潁大治諸陂於潁南潁北穿渠三百餘里溉田二萬頃淮南淮北皆相連接隋志潁川郡北舞縣有百尺溝魏賈侯渠晉食貨志賈逵為豫州刺史南與呉接修水戰之具遏汝水造新陂又通運渠二百餘里所謂賈侯渠也魏志遏鄢汝造新陂又斷山溜長谿水造小弋陽陂又通運渠云云魏雁門渠牽招傳為雁門太守郡所治廣武井水鹹苦民皆逺汲招凖望地勢因山陵之宜鑿原開渠注水城内民賴其益胡質都督青徐廣農積糓有兼年之儲置東征臺且佃且守又通渠諸郡利舟楫嚴設備以待敵海邊無事魏五龍渠千金渠九龍渠周陽渠水經注河南縣城東十五里有千金堨洛陽記曰千金堨舊堰穀水魏時更修此堰謂之千金堨積石為堨而開溝渠五所謂之五龍渠渠上立堨堨之東首立一石人腹上刻勒云太和五年二月八日庚戌造築此堨更開溝渠蓋魏文帝修王張故績也堨是都水使者陳協所造語林曰晉文王欲修九龍堰阮步兵舉協掘地得古承水銅龍六枚堰遂成水歴堨東注謂之千金渠晉世又廣功焉石人東脇下文云大始七年六月二十三日大水蕩壞二堨云云今故為令遏更於西開泄名曰伐一作代龍渠増髙千金於舊一丈四尺若五龍嵗久復壞可轉於西更開二堨二渠合用二十三萬五千六百九十八功以其年十月二十二日起作功重人少到八年四月二十日畢代龍渠即九龍渠也朝廷太和中元魏修復故堨晉造石渠於水上案橋西門之南頰文稱晉元康二年十一月二十日改治石巷水門除堅枋更為函枋三年三月十五日畢漢司空王梁為河南將引穀水以溉京都渠成而水不流後張純堰洛而通漕是渠今引穀水蓋純之創也案陸機洛記劉澄之永初記言城之西面有陽渠周公制之也亦謂之九曲瀆故河南十二縣簿云九曲瀆在河南鞏縣西西至洛陽傅暢晉書云都水使者陳良鑿運渠從洛口入注九曲至東陽門陽渠水南暨閶闔門又東逕亳殷南魏車箱渠水經注劉靖碑云魏使持節都督河北道諸軍事劉靖登梁山以觀源流相𤭔以度形勢嘉武安之通渠羡秦民之殷富乃使帳下督丁鴻軍士千人以嘉平二年立遏於水道髙梁河造戾陵遏開車箱渠其遏表云髙梁河水者出自并州黄河之别源時長岸峻固直截中流積石籠以為主遏髙一丈東西長三十丈南北廣七十餘歩依北岸立水門門廣四丈立水十丈灌田嵗二千頃凡所封地百餘萬畝至景元二年辛酉詔書遣謁者樊晨更制水門限田千頃刻地四千三百一十六頃出給郡縣改定田五千九百三十頃水流乘車箱渠自薊西北逕昌平東盡漁陽潞縣凡所潤含四五百里所灌田萬有餘頃髙下孔濟原隰底平疏之斯溉決之斯散導渠口以為濤門灑彪池以為甘澤施加於當時敷被于後世晉元康四年子𢎞持節幽州起長岸立石渠修立遏治水門門廣四丈立水五尺詩載經始勿亟易稱民忘其勞感秦國思鄭渠之績魏人置豹祀之義追述成功元康五年十月十一日刋石立表以紀勲烈並記遏制度永為後式晉河隄謁者汴渠傅𤣥傳泰始四年為御史中丞上疏言便宜五事其三曰魏初未留意於水事先帝統百揆分河隄為四部并本凡五謁者以水功至大與農事並興非一人所周知故也今謁者一人之力行天下諸水無時得徧伏見河隄謁者車誼不知水勢轉為他職更選知水者代之可分為五部使各精其方宜其四曰河隄謁者石恢甚精練水事及田事知其利害乞中書召問得失通鑑義熙十二年劉裕伐秦八月丁巳發建康沈林子劉遵考將水軍出石門自汴入河王仲徳督前鋒諸軍開鉅野入河九月林子自汴入河仲徳水軍入河入滑臺十三年十二月庚子裕發長安自洛入河開汴渠以歸輿地廣記汴渠在河陰縣南二百五十步即古莨蕩渠今名通濟渠首受黄河通典水經云河水又東過滎陽北莨蕩渠出焉酈元注云大禹塞滎澤開渠以通淮泗晉三渠壽春舊渠晉食貨志武帝泰始十年光禄勲夏侯和上修新渠富壽游陂三渠凡溉田千五百頃咸寧三年杜預言自頃户口日増而陂堨嵗決良田變生蒲葦前見尚書胡威啟宜壞陂又宋侯相應遵求壞泗陂徙運道案運道東詣壽春有舊渠可不由泗陂宜敕刺史二千石其漢氏舊陂舊堨及山谷私家小陂皆當修繕以積水荀美自光水引汶通渠以征慕容蘭元魏薛虎子上表云徐州良田十萬餘頃水陸肥沃清汴通流足以溉灌後魏流化渠見塘類後魏督亢渠陂盧文偉𫝊説刺史裴儁案舊迹修督亢陂溉田萬餘頃人賴其利裴延儁𫝊遷幽州刺史范陽郡有舊督亢渠徑五十里漁陽燕郡有故戾陵諸堨廣袤三十里表求修復營造溉田百萬餘畝為利十倍百姓賴之後魏明帝時北齊平州刺史嵇曄開督亢陂置屯田乾明元年括地志陂在幽州范陽縣東南十里劉向别録督亢膏腴之地史記正義亢澤無水斥鹵之謂隋廣通渠漕渠富人渠隋食貨志文帝以渭水多沙深淺不常漕者常苦之開皇四年六月壬子詔左庶子宇文愷帥水工鑿引渭水自大興城東至潼關三百里名廣通渠漕運通利關内賴之三年華州置廣通倉紀開皇四年六月壬子開渠自渭運門以通運九月乙丑幸霸水觀漕渠七年四月庚戌於揚州開山陽瀆以通運漕十五年六月戊子詔鑿砥柱蘇孝慈𫝊上於陜州置常平倉轉輸京下以渭水多沙流乍深乍淺漕運者苦之於是決渭水為渠以屬河令孝慈督役郭衍𫝊開皇元年為開漕渠大監率水工鑿渠引渭水經大興城北東至潼關漕運四百餘里關中賴之名富人渠地理志京兆郡武功有永豐渠普濟渠涇陽有茂農渠華隂有白渠隋利人渠豐兖渠盧賁𫝊為懐州刺史開皇中決沁水東注名曰利人渠又𣲖入温縣名曰温潤渠以溉舄鹵薛胄𫝊開皇中為兖州刺史先是城東沂泗水合而南流汎濫大澤中胄遂積石堰之決令西注陂澤盡為良田又通漕運利盡淮海百姓賴之號為薛公豐兖渠元和志陜縣北利人渠開皇六年蘇成引橐水西北入城百姓賴其利故名南利人渠東南自硤石界流入與北渠同時疏導隋通濟渠永濟渠煬帝紀大業元年三月辛亥開通濟渠自西苑引穀洛水達于河自板渚引河通于淮通鑑大業元年三月發淮南民十餘萬開䢴溝自山陽至揚子入江渠廣四十步築御道植以柳四年正月乙巳開永濟渠引沁水達于河北涿郡地理志滎陽郡浚儀有通濟渠蔡水通典通濟渠西道河洛南達江淮又云魏州魏縣白溝水煬帝引通濟渠亦名御河九域志汴水古通濟渠也元和志通津渠在河南縣南三里隋大業元年分洛水西北名千步磧渠東北流入洛水通濟渠自洛陽西苑引穀洛水逹于河自板渚引河入汴口又從大梁之東引汴水入于泗逹于淮自江都宫入于海亦謂御河築御道植以柳國史志大名府永濟縣有永濟渠玉海卷二十一
