body:
  text: 玉海巻四十四宋王應麟撰藝文小學上歐陽修曰古者教學之法八嵗入小學以習六甲四方書數之藝至於成童而後授經儒者究天地人神事物之理無所不通故其學者次第而後大成焉爾雅出於漢世正名物講説資之於是有訓詁之學文字之興隨世轉易務趨便省乆後乃或亡其本三蒼之説始志字法而許慎作説文於是有偏傍之學五聲異律清濁相生而孫炎始作字音於是有音韻之學篆𨽻古文為體各異秦漢已來學者務極其能於是有字書之學先儒之立學其初為法未始不詳而明後世猶或訛失故小學者不可闕也伏羲六書古三墳伏羲氏始畫八卦命臣飛龍氏造六書江式曰宓羲作而八卦形其畫黄帝興而靈龜彰其采顧野王曰包羲成八卦蒼頡創六文𤣥龜龍馬負河洛之圖赤爵素鱗標受終之命鳳羽為字掌理成書豈但人力亦由天授潘伯彥曰龍莢授河龜威出洛緑綈白檢述勛華之運金繩玉字表殷夏之符銜甲姬壇吐巻孔室墨藪太昊作龍書外紀伏造八卦始作三畫以象二十四氣因而重之爻象備矣虙戲六峜九九數管子輕重戊虙戲作造六峜以迎隂陽作九九之數以合天道而天下化之周人之王循六峜行隂陽虙戲以來未有不以輕重而能成其王者也峜字未詳漢梅福傳齊桓之時有以九九見者桓公不逆所以致大也今臣所言不特九九也注師古曰九九筭術若今九章五曹之輩事見説苑韓詩外傳韓詩外𫝊齊桓公設庭燎東野人有以九九見者選注漢志伏羲畫八卦由數起萬物之數因八卦而起晉志黄帝使𨽻首作筭數蒼頡書石室字淮南子史皇蒼頡生而能書宋均注援神契曰蒼頡視龜而作書蒼頡作書而天雨粟􅀑夜哭説文庖羲氏始作易八卦神農氏結繩為治黄帝之史倉頡見鳥獸蹏迒之迹初造書契倉頡之初作書葢依類象形故謂之文其後形聲相益即謂之字字者言孳乳而浸多也著於竹帛謂之書書者如也通志蒼頡石室記有二十八字在蒼頡北海墓中土人呼為藏書室周時無人識秦李斯始識八字曰上天作命皇辟迭王漢叔孫通識十二字周六書書名地官保氏教國子六藝五曰六書注鄭司農云六書象形㑹意轉注處事假借諧聲正義象形日月之類㑹意武信之類人言為信止戈為武漢書曰象意轉注考老之類處事上下之類漢志曰象事説文序曰指事假借令長之類一字兩用諧聲江河之類水為形工可為聲漢志曰象聲聲説文序曰形書有六體形聲實多若江河之類是左形右聲鳩鴿之類是右形左聲草藻之類是上形下聲婆娑之類是上聲下形圍國之類是外形内聲闤闠衡銜之類是外聲内形此聲形之等有六也孝經緯援神契三皇無文則五帝以下始有文字説者多以蒼頡為黄帝史造文字於後滋益而多大司徒六蓺注書六書之品春官外史掌達書名于四方注謂若堯典禹貢或曰古曰名今曰字使四方知書之文字秋官大行人九嵗屬瞽史諭書名注書之字也聘禮曰百名漢志六書造字之本説文許慎子冲上書曰周禮漢律皆當學六書貫通其意隋志書起黄帝蒼頡比類象形謂之文形聲相益謂之字著於竹帛謂之書古者童子六年教之數與方名十嵗入小學學書計志又有六文書一巻衛恒四體書勢黄帝創制造物沮誦蒼頡始作書契代結繩葢睹鳥迹而興思也因而遂滋則謂之字有六義焉自黄帝至三代其文不改籕篆葢其子孫𨽻草乃其曽𤣥漢六體見後周九數九章筭術漢小學筭術漢九數唐筭經又見厯筭周官大司徒六藝注數九數之計保氏以六藝教國子六曰九數注鄭司農云方田粟米差分少廣商功均輸方程贏不足旁要今有重差夕桀音的勾股也禮記正義周禮注九數方田粟米差分少廣商功均輸方程贏不足旁要今有重差句股九數之名書本多誤儒者所解方田一粟米二差分三少廣四商功五均輸六方程七贏不足八旁要九云今有重差句股者鄭司農指漢時云今世於九數之内有重差句股二篇其重差即與舊數差分一也去舊數旁要而以句股替之為漢之九數即今之九章也先師馬融干寳等云今有夕桀各為一篇未知所出今依司農所注餘並不取見後劉徽筭經序正義方田已下皆依九章筭術而言重差夕桀句股此漢法増之馬氏以重差夕桀亦是筭術之名與鄭異按今九章以句股替旁要則旁要句股之類也後漢鄭康成𫝊通九章筭術注周公所作也凡九篇方田粟米差分少廣均輸方程旁要贏不足鉤股馬續𫝊善九章筭術注劉徽九章筭術曰商功五均輸六盈不足七方程八並無重差夕桀無馬傳注無旁要鄭注商功晉隋律志引九章粟米商功法考工記注引於今粟米法疏云筭術有筭粟為米之法玉人疏引盈不足術曰玉方寸重七兩石方寸重六兩禹貢疏引九章筭術云海島邈絶不可踐量詩綿疏引九章筭術云穿地四為壤五為堅三召旻疏引粟米法春秋疏引九章筭術云粟率五十鑿二十四伏湛𫝊注引九章筭術曰粟五十糲率三十一斛粟得六斗米漢律志一曰備數紀於一協於十長於百大於千衍於萬其法在筭術宣於天下小學是則職在太史羲和掌之夏侯陽序云漢備五數漢志八嵗入小學學六甲五方書計之事厯譜有許商筭術二十六卷杜忠筭術十六巻溝洫志博士許商治尚書善為筭能度功用商及乘馬延年皆明計筭能商功利食貨志耿壽昌習於商功分銖之事研桑心計張蒼傳善筭律厯定章程後傳卓茂習厯筭究極師法劉瑜善厯筭鄭康成善筭翟酺何休善厯筭張衡致思厯筭西京雜記成帝時嵩真曹元理並明筭術夏侯陽筭經序筭數起自伏犧而黄帝定三數為十等𨽻首因以著九章漢備五數云云五曹孫子述作滋多甄鸞劉徽為之詳釋堯典正義天之三光四時變化以此為政故命羲和令以筭術推步累歴其所行法象其所在具有分數節􅀱左傳史趙曰亥有二首六身下二如身是其日數也魏志王粲善筭作筭術畧盡其理吳志趙達治九宫一筭之術南史顧越於九章七曜音律圖緯咸盡精微北史劉焯九章筭術周髀七曜厯書十餘部推步日月之經量度山海之術莫不覈根本窮祕奥蘇綽善筭術隋志古之九數圓周率三圓徑率一其術疏舛自劉歆張衡劉徽王蕃皮延宗之徒各設新率未臻折衷宋祖冲之更開宻法以圓徑一億為一丈圓周盈數三丈一尺四寸一分五釐九豪三秒七忽朒數三丈一尺四寸一分五釐九豪三秒六忽正數在盈朒二限之間宻率圓徑一百一十三圓周三百五十五約率圓徑七周二十二又設開差羃立兼以正員參之指要精宻筭氏之最也所著書名綴術六卷學官莫能究其深奥劉徽九章術義序一卷九章筭術十卷徐岳甄鸞重述二卷李遵義疏一巻楊淑九九筭術二巻岳鸞等撰别術二巻筭經二十九卷又徐岳注二卷劉徽九章六曹筭經一卷重差圖一卷又有孫子趙􅜫夏侯陽張丘建筭經五經筭術黄鍾筭法張峻九章推圖經法又劉炫著筭術一卷唐志劉向九章重差一卷徐岳九章筭術九卷甄鸞九章筭經九卷又董泉三等數一卷甄鸞注注史記正義引甄鸞筭經劉祐九章雜筭文一巻劉徽九章重差圖一卷李淳風注九章筭術九巻要畧一巻謝察微筭經三卷御覽引謝察微筭經曰易稱太極是生兩儀葢數之先也自𨽻首作術容成造厯顯筭斯興子筭經一位筭法按孫又引發象筭經㑹要永隆元年十二月太史令李淳風進注釋孫子等十部筭經分為二十巻傳云奉詔與筭博士梁述助教王真儒等是正五曹孫子等書刋定注解立於學宫志注五曹孫子等筭經二十卷筭經表序一卷一淳風又注周髀二卷注九章九卷注九章筭經要畧卷注五經張丘建海島甄鸞孫子筭經共九卷釋祖冲之綴術五卷注王孝通緝古筭術四卷百官志筭學九章海島孫子五曹張丘建夏侯陽周髀五經筭綴術緝古為顓業兼習記遺三等數王孝通上緝古表周公制禮有九數之名即九章是也其理幽而微其形祕而約漢張蒼刪補殘缺校其條目頗與古術不同魏劉徽為之注觸類増長乃造重差之法列於終篇賀循徐岳王彪甄鸞之輩㑹通之數無聞焉祖暅之綴術時人稱精妙方邑進行之術全錯不通芻亭方亭之間於理未盡九章商功篇有平地役功受袤之術至于上寛下狹前髙後卑闕而不論臣於平地之餘續狹斜之法凡二十術唐志四卷李淳風注徐岳數術記遺黄帝為法數有十等及其用也乃有三焉十等者謂億兆京垓秭壤溝澗正載三等者謂上中下也其下數者十十變之若言十萬曰億十億曰兆十兆曰京也中數者萬萬變之若言萬萬曰億萬萬億曰兆萬萬兆曰京也上數者數窮則變若言萬萬曰億億億曰兆兆兆曰京也從億至載終於大衍徐岳生於漢末受厯學於劉洪其書甄鸞注宇文周時造天和厯者唐志數術記遺一巻世人言三不能比兩乃云捐悶與四維注藝經曰捐悶者周公作也先本位以十二時相從造徐援稱捐悶乃是奇兩之術三不能比兩者孔子所也布十千於其方戊己在西南維四維東萊子所造也布十二時四維魏劉徽九章筭經序包羲氏始畫八卦作九九之術以合六八之變黄帝神而化之引而伸之建厯紀協律吕用稽道原然後兩儀四象可得而效焉記稱𨽻首作數其詳未之聞也周公制禮而有九數九章是矣漢北平侯張蒼大司農中丞耿壽昌皆以善筭命世蒼等因舊文之遺殘各稱刪補故校其目與古或異而所論者多近語也且筭在六藝古者以賔興賢能教習國子其能窮纎入微探測無方以法相傳亦猶規矩度量可得而共今好之者寡雖通才達學未必能綜於此周官説云南戴日下萬五千里按九章立四表望逺及因木望山之術皆端旁互見無有超邈若斯之類蒼等為術猶未足以博盡羣數也九數有重差之名原其指趣乃所以施於此凡望極高測絶深而兼知其逺者必用重差句股則必以重差為率輒造重差并為注解以究古人之意綴於句股之下方田以御田疇界域筭田畆粟米以御交質變易變造榖米精麄分數衰分以御貴賤禀税若律管不成寸者餘分少廣以御積羃方圓若東西廣南北狹商功以御功程積實計功役均輸以御逺近勞費租賦之屬盈不足以御隠雜互見以多補少一云盈朒方程以御錯糅正負開方法若禮為方千里者一句股以御髙深廣逺今天文家筭天象所用李籍周髀音義云以九數句股重差筭日月周天行度逺近之數皆得於股表即推步葢天之法也髀者股也以表為股周天厯度本包犧氏立法其傳自周公受之於大夫商髙周人志之故曰周髀崇文目筭術三十一部七十九卷始於周髀筭經至數術記遺御覽引周髀筭經天不可階而升地不可尺寸而度周髀曰周公問於殷髙曰聞子大夫善數詳見天文景徳二年龍圖閣子書有筭術六卷書目五經筭術二卷漢甄鸞注唐李淳風等注釋引五經之説如詩毛鄭數書定閏法月令黄鍾律管法禮求地中法易策數法之類故名周髀筭經二卷趙君卿君卿趙爽字也注并序甄鸞重述淳風等注釋以葢天有周髀之法大抵句股乘除之數古一卷今分為二海島筭經一卷甄鸞撰李淳風等注釋元豐間袐書監趙彥若等校定皆以物設為乘除法唐志崇文目魏劉徽撰云海島者取其首篇所筭言之注九章筭經九卷不知作者魏劉徽注并序淳風釋其序言九章九九之數也周官測日景求地中亦九章立四表望逺及因木望山之術故輒造重差并為注解以究古人之意綴於句股之下張丘建筭經三卷凡一百問設為乘除法中言臣淳風等當是注釋隋志二卷夏侯陽筭經三卷以明乘除法為首篇條五乘五除之異隋志二卷緝古筭經一巻唐太史丞王孝通撰并注趙彥若等校定以九章商功篇有平地役功受袤之術世人不達遂於平地之餘續狹斜之法凡二十術名曰緝古崇文目云淳風注唐志四卷唐令筭學習業緝古三年今亡其三孫子筭經三卷淳風注彥若等校定首言度量所起次言乘除之法亦設為之數謝察微筭術三卷設為乘除法凡一百六事五曹筭經五卷淳風注彥若等校定以地利生人之本故首田曹田疇必資人功故次兵曹人衆必用食飲故次集曹㑹集必務儲蓄故次倉曹倉廪貨幣交貿變易故次金曹或云五曹法出於孫武九章音義一巻李籍又周髀音義一卷仝上周五馭地官保氏六藝四曰五馭注五馭鳴和鸞逐水曲過君表舞交衢逐禽左正義馭車有五種鳴和鸞者和在軾鸞在衡韓詩云升車則馬動馬動則鸞鳴鸞鳴則和應逐水曲謂馭車隨水勢之屈曲而不墜水也過君表者謂若毛傳云褐纒旃以為門裘纒質以為槸間容握驅而入轚則不得入榖梁亦云艾蘭以為防置旃以為轅門以葛覆質以為槷流旁握御轚者不得入舞交衢者御車在交道車旋應於舞節逐禽左者謂御驅逆之車逆驅禽獸使左當人君以射之人君自左射禮記云佐車止則百姓田獵是也大司徒三物教萬民三曰六藝注御五御之節記問大夫之子長曰能御晉語鐵之戰郵無正王良御曰兩靷將絶吾能止之云云吕氏春秋乘雅作御寒哀作御世本韓哀作御造父始習於大豆造父師泰豆得於足應於心列子淮南子尹需學御三年中夜夢受秋駕於師注善御之術吕氏春秋作尹儒孔叢子孔子曰以禮齊民譬之御則轡也以刑齊民譬之於御則鞭也執轡於此而動於彼御之良也無轡而用策則馬失道矣古之善御者執轡如組兩驂如舞非策之助也吕氏春秋詩曰執轡如組孔子曰審此言也可以為天下韓非子趙襄王學御於王子期對曰御之所貴馬體安于車人心調于馬而後可以進速致逺説苑御者使人恭射者使人端韓詩外傳孔子云善哉顏无父之御也云云至於顏倫少衰矣云云至於顏夷而衰矣範我馳驅車軌塵馬候蹄御者不失其馳吾執御矣周公爾雅釋詁漢小爾雅叔孫通補爾雅晉爾雅音義圖譜魏廣雅隋博雅唐續爾雅元豐埤雅漢志孝經十一家爾雅三卷二十篇張晏曰近正也今本十九篇小爾雅一篇陳涉博士孔鮒撰十三章申衍詁訓見孔叢子乃别行周禮正義引之隋志小爾雅一卷李軌畧解爾唐志李軌解小爾雅一卷今亡書目小雅一卷孔鮒撰十三章古今字一卷弟子職一篇管仲作習在管子雜篇第五十九畧曰朝益暮小心翼翼一此不懈是謂學則春禮酒正注杜子引周旋而貳書目魏博士張揖上廣雅表云周公著爾雅一篇陸徳明釋文云釋詁一篇葢周公所作邢昺疏云其文有周公後事先儒疑焉三朝記哀公曰寡人欲學小辨以觀於政可乎孔子曰爾雅以觀於古足以辨言矣大戴禮小辨篇西京雜記劉歆問揚子雲子雲以為游夏之徒所記以解釋六蓺劉向謂史佚教其子以爾雅或言仲尼所増或言子夏所益或言叔孫通梁文所補文帝置博士周公倡於前子夏和於後自是之後世罕得聞爾雅疏釋詁一篇葢周公所作釋言以下或言仲尼所増子夏所足叔孫通所益梁文所補張揖云昔在周公纉述唐虞宗翼文武克定四海勤相成王六年制禮以導天下著爾雅一篇以釋其義禮三朝記孔子曰爾雅以觀於古足以辨言矣春秋元命包言子夏問夫子作春秋不以初哉首基為始何是以知周公所造也爰暨帝劉魯人叔孫通撰置禮記文不違古今俗所傳三篇或言仲尼所増或言子夏所益叔孫通所補梁文所著皆解家所説先師口傳疑不能明也蓺文志附孝經經籍志附論語類皆非是晉郭璞𫝊注釋爾雅隋志五卷書目三卷别為音義圖譜隋志爾雅圖十卷梁有圖讃二卷唐志郭璞注圖音義各一卷又注三蒼方言爾雅序通詁訓之指歸叙詩人之興詠㧾絶代之離詞辯同實而殊號九流之津步六藝之鈐鍵學覽者之潭奥摛翰者之華苑也興於中古隆於漢氏豹䑕既辨其業亦顯武帝時得豹文鼮䑕孝㢘郎終軍知之賜絹百匹竇氏家傳云竇攸對鼮鼠世祖詔諸侯子弟從攸受爾雅璞考方國之語采謠俗之志錯綜樊孫博關羣言剟其瑕礫搴其蕭稂别為音圖用袪未寤宋朝邢昺等為疏釋十卷陸徳明叙録犍為文學注二巻劉歆李巡孫炎注各三卷隋志炎注七卷唐志六卷樊光注六卷五經正義引某氏謝氏顧氏隋志梁黄門郎沈琁集注十卷及施乾謝嶠顧野王四家在郭氏後唐志江灌圖贊一卷音六卷隋志魏博士張揖廣雅二卷唐志四卷音中興書目今逸唯存分三卷唐志劉伯莊續爾雅一卷曹憲博雅十卷爾雅音義二卷隋志憲廣雅音四卷古今字圖雜録一卷揖憲注廣雅藏秘書改廣為博書目十卷因張廣雅附作音解更為十篇宋朝元豐中陸佃修説文因進書獲對神宗論物性恨未有著書者佃進説魚説木二篇自是益加論撰為埤雅二十卷唐李商隠蜀爾雅三卷嘉祐中劉温潤羌爾雅一卷晁氏志蕃爾雅一卷釋智騫撰爾雅音義二卷景徳二年四月丁酉吳鉉言其多誤命杜鎬孫奭詳定天聖四年五月戊戌國子監摹印陸徳明音義二卷頒行晁氏志蜀毋昭裔音略三卷爾雅舊有釋智騫及陸朗釋文昭裔以一字有兩音或三音後生疑于呼讀今釋其文義最明者為定書目爾雅注五卷唐裴瑜撰其序云依六書八體撮諸家注未盡之義勒成五卷并音一卷今本無音疏十卷邢昺等撰昺序云俗間有孫炎髙璉皆淺俗奉敕校定與杜鎬舒雅李維孫奭等討論以景純為主陸佃爾雅新義二十卷鄭樵注三卷爾雅貫類一卷不知作者取字同者類之梁劉杳撰要雅五巻周禮疏劉杳要雅亦以宜成為酒名韓愈曰爾雅注蟲魚定非磊落人爾雅十九篇釋詁釋器釋言釋樂釋訓釋天釋親上釋釋宫釋釋地丘山魚釋水中釋釋鳥釋草釋獸釋木下釋蟲釋畜周籀書古今文字後魏書江式祖强上書三十餘法延昌三年三月式表曰古史蒼頡剏文字以代結繩周保氏教六書秦有八體一曰大篆二曰小篆三曰符書四曰蟲書五曰摹印六曰署書七曰殳書八曰𨽻書漢興有尉律學復教以籀書又習八體試之課最以為尚書史書省字不正輒舉劾焉又有草書莫知誰始宣王太史史籀著大篆十五篇與古文或同或異時人即謂之籀書秦李斯作蒼頡篇趙髙作爰歴篇胡毋敬作博學篇皆取史籀式頗有省改所謂小篆者也秦官獄繁多以趣約易始用𨽻書古文由此息矣始皇使下杜人程邈附於小篆所作世人以邈徒𨽻即謂之𨽻書水經注𨽻自出古非始於秦左傳疏𨽻書起於秦末亡新居攝使大司馬甄豐校文字之部頗改定古文時有六書一曰古文孔子壁中書也二曰奇字即古文而異者三曰篆書云小篆也四曰佐書秦𨽻書也五曰繆篆所以摹印也六曰鳥蟲所以幡信也壁中書者孔子宅得尚書春秋論語孝經也又北平侯張蒼獻春秋左氏傳書體與孔氏相類即前代古文臣求撰集古來文字以許慎説文為主及孔氏尚書五經音注籀篇爾雅三蒼凡將方言通俗文祖文宗埤蒼廣雅古今字詁三字石經字林韻集諸賦文字有六書之誼者以類編聨文無復重統為一部其古籀竒惑俗𨽻諸體咸使班篆下各有區别詁訓假借之誼隨文而解音讀楚夏之聲逐字而注詔就太常撰集字書號曰古今文字凡四十卷大體依許氏説文為本上篆下𨽻其書竟未能成宋世良撰字畧五篇梁謝善勛能為八體六文方寸千言漢小學十家八體六技六體蒼頡凡將元尚急就篇訓纂三蒼草書尺牘爰書八分書志史籀十五篇周宣王大史作大篆十五篇建武時亡六篇矣八體六技韋昭曰云云見後蒼頡一篇上七章秦丞相李斯作爰歴篇中車府令趙髙作博學七章太史令胡毋敬作凡將急就元尚訓纂各一篇别字十三篇蒼頡傳一篇揚雄杜林蒼頡訓纂各一篇蒼頡故一篇凡小學十家三十五篇入揚雄杜林二家二篇聖人易結繩以書契百官以治萬民以察葢取諸夬夬揚于王庭其用最大也古者八嵗入小學故周官保氏掌養國子教之六書謂之象形象事象意象聲轉注假借造字之本也漢興蕭何草律亦著其法曰太史試學童能諷書九千字以上乃得為史又以六體試之課最者以為尚書御史史書令史吏民上書字或不正輒舉劾石建曰書馬者與尾而五今乃四不足一獲譴死矣六體者古文竒字篆書𨽻書繆篆蟲書皆所以通知古今文字摹印章書幡信也初學記云秦廢古文更用八體大篆至𨽻書王莽居攝使甄豐刋定六體古文至蟲書古制書必同文不知則缺問諸故老至於衰世是非無正人用其私故孔子曰吾猶及史之闕文也今亡矣夫葢傷其寖不正史籀篇者周時史官教學童書也與孔子壁中古文異體蒼頡七章者秦丞相李斯所作也爰歴六章者車府令趙髙所作也博學七章者太史令胡毋敬所作也文字多取史籀篇而篆體復頗異所謂秦篆者也説文序云所謂小篆是時始建𨽻書矣起於官獄多事茍趨省易施之於徒𨽻也漢興閭里書師合蒼頡爰歴博學三篇斷六十字以為一章凡五十五章并為蒼頡篇武帝時司馬相如作凡將篇無復字唐志一卷元帝時黄門令史游作急就篇隋志謂之急就章唐志一卷成帝時將作大匠李長作元尚篇皆蒼頡中正字也凡將則頗有出矣至元始中召天下通小學者以百數各令記字於庭中五年正月召天下通知小學史篇者揚雄取其有用者以作訓纂篇順續蒼頡又易蒼頡中重復之字凡八十九章臣班固復續揚雄作十三章韋昭曰十三章後人不别疑在蒼頡下篇三十四章中唐志有太甲在昔篇凡一百二章無復字六蓺羣書所載畧備矣蒼頡多古字俗師失其讀宣帝時徵齊人能正讀者張敞從受之傳至外孫之子杜林為作訓故并列焉傳云初杜鄴從張吉學吉子竦從鄴學問尤長小學鄴子林清靜好古亦有雅材其是正文字過於鄴竦言小學者由杜公注小學謂文字之學引隋志梁有蒼頡二卷杜林注説文杜林説揚雄説韋昭曰八體一曰大篆二曰小篆三曰刻符四曰蟲書五曰摹印六曰署書七曰殳書八曰𨽻書師古曰古文謂孔子壁中書竒字古文而異者篆書小篆葢秦始皇使程邈所作𨽻書亦邈所獻主於徒𨽻從簡易也繆篆謂其文屈曲纒繞所以摹印章蟲書謂為蟲鳥之形所以書幡信也説文序尉律學童十七已上始試諷籀書九千字乃得為吏又以八體試之郡移太史并課最者以為尚書史書或不正輒舉劾之秦時有八體大篆至𨽻書與韋昭注同亡新使大司空甄豐等改定古文時有六書古文竒字篆書佐書繆篆鳥蟲書佐書即秦𨽻書書疏秦罷古文而有八體亡新六書於秦八體用其小篆蟲書摹印𨽻書而加以古文與奇字去其大篆刻符殳書署書愚按説文序尉律試八體書正義亦云秦有八體而六書乃亡新改定也志以為漢興試六體恐誤尉律者廷尉治獄之律也元帝紀多材蓺善史書注應劭曰史籀所作大篆許后傳善史書後紀安帝年十嵗好學史書和帝稱之數見禁中注史書者周宣王太史籀所作之書也凡五十五篇可以教童幼鄧后六嵗能史書注史籕所作大篆十五篇也梁后好史書揚子或欲學蒼頡史篇曰史乎史乎愈於忘闕也漢官儀能通蒼頡史籀篇補蘭臺令史滿嵗為尚書郎貢禹𫝊郡國擇便巧史書者以為右職俗皆曰何以禮義為史書而仕宦魏志胡昭善史書與鍾繇邯鄲淳衛覬韋誕並有名尺牘之迹動有楷焉史籀六字見法帖唐志古今八體六文書法一卷南史梁謝善勛能為八體六文方寸千言蕭子良古今篆𨽻文體曰殳書者伯氏之職也古者文既記笏武亦書殳秦璽李斯魚蟲篆隋志梁有蒼頡二巻漢司空杜林注亡唐志杜林蒼頡訓詁二巻考工記注蒼頡篇有鞄􅀢又曰蒼頡篇有柯欘疏云蒼頡有七章李斯所作鞄􅀢是其一篇内有治皮之事光武紀安紀注春秋釋文文選注廣韻注曲禮䟽皆引蒼頡篇韓非子曰蒼頡之作書也自環者謂之私背私謂之公顔子推曰蒼頡篇李斯所造而云漢兼天下海内并厠豨黥韓覆畔討滅殘非本文也唐志凡將篇一卷蓺文類聚引凡將篇曰鐘磬竽笙筑坎侯文選蜀都賦注引司馬相如凡將篇曰黄潤纎美宜制禪急就章漢黄門令史游撰雜記姓名諸物五官等字以教童蒙急就者謂字之難知者緩急可就而求焉有皇象鍾繇衛夫人王羲之所書傳於世唐志一巻曹夀解顔之推顔師古注隋志二巻崔浩注太宗即位元年敕浩解又三巻豆盧氏撰北史劉芳急就篇續注音義證三巻陸暐擬急就篇為晤蒙章書目顏師古急就篇注一巻叙曰其源出於小學家漢司馬相如作凡將篇史游景慕擬而廣之元成之間列於秘府文亦清靡義闕經綸至於包括品類錯綜今古詳其意趣實有可觀幼學相承猶競習之既無良師祗增僻謬師古家𫝊蒼雅尤精訓故舊得皇象鍾繇衛夫人王羲之所書篇本備加詳覈凡三十二章又見崔浩劉芳所注未善遂為解訓皆據經籍遺文先達舊指字有難識隨而音之别理兼通亦即並載隋唐志始謂之急就章急就篇舊分三十二章前代能書者多以草書寫之今唯有一本相𫝊是吳皇象寫比顏解本無焦滅胡以下六十三字纔三十一章而已國朝大宗嘗親書此篇又於顏本外多齊國山陽兩章凡為章三十四此兩章葢起於東漢按急就篇末説長安中涇渭街術故此篇亦言洛陽人物之盛以相當而鄗縣以世祖即位之地升其名為髙邑與先漢所改真定常山並列此為後漢人所續不疑急就篇云急就奇觚與衆異羅列諸物名姓字分别部居不雜厠注云觚者學書之牘或以記事削木為之葢簡屬也孔子歎觚即此之謂以有稜角故謂之觚言學僮急當就此竒好之觚其中深博與衆書有異也今俗猶呼小兒學書簡為木觚章葢古文遺語也春秋正義引急就篇頃町界畆天官武成正義引史游章司農少府國之淵考工記天官疏引急就章云蒲蒻藺席考工記正義引别部居文選文賦注引竒觚後漢張敏傳注引臯陶造獄法律存左傳疏引鹽豉書斷云章草書史游所作揚雄𫝊史篇莫大於倉頡作訓纂説文序孝宣召通倉頡讀者張敞從受之凉州刺史杜鄴沛人爰禮講學大夫秦近亦能言之孝平召禮等百餘人説文字於未央庭中以禮為小學元士黄門侍郎揚雄采作訓纂篇凡倉頡已下十四篇凡五千三百四十字司空甄豐等校文書之部頗改定古文時有六書即前六體説文史篇徐鍇曰謂所作倉頡十五篇也史記正義引訓纂云户扈鄠三字一也隋志三蒼三巻郭璞注李斯作倉頡篇揚雄作訓纂篇後漢郎中賈魴作滂喜篇故曰三蒼又三蒼訓詁三巻埤蒼二巻魏博士張揖撰廣蒼一巻樊恭撰唐志同唐志李斯等三蒼三巻郭璞解杜林倉頡訓詁二巻元魏江式曰李斯破大篆為小篆造蒼頡九章趙高造爰歴六章胡母敬造博學七章後人分五十五章為三巻上巻至哀帝元夀中揚子雲作訓纂為中巻和帝永元中賈叔郎接記滂喜為下巻故稱為三蒼徐鉉曰賈魴以三蒼之書皆為𨽻字𨽻字始廣而篆籀轉微春秋釋文史記索隠後漢書注文選注多引三蒼解詁音釋文選注引埤蒼三蒼詁訓詩疏引陸璣疏云三蒼説棫即柞也又引蒼頡解詁埤蒼禮記釋文引郭璞三蒼解詁後漢戴就傳注引説文三蒼張湯傳爰書訊鞠論報劉奉世曰趙高作爰歴獄吏用之李陽冰論篆云秦始皇時王次仲制八分書蕭子良曰漢靈時上谷王次仲與秦同姓名亦作八分書魏鍾繇謂之章程書繇又善𨽻書始為楷法書苑蔡文姬言割程𨽻字八分取二分割李篆字二分取八分於是為八分書漢石經乃蔡邕八分書鍾繇善八分有隼尾波太山銘有此體草書尺牘牘書板長一尺北海敬王睦善史書世以為楷則永平中帝驛馬令作草書尺牘十首章帝好草書名章草杜伯度張芝昶善草書晉庾翼有伯英章草十紙崔子玉著草書埶庾肩吾云北海之牘西河之簡張超善草書文選鶴書注蕭子良古今篆𨽻文體曰鶴頭書與偃波書俱詔板所用在漢則謂之尺一簡或云召隠逸之士陳遵善書與人尺牘主皆蔵去以為榮晉習鑿齒善尺牘宋劉穆朱齡石並便尺牘北齊顏之推工尺牘漢别國方言唐志揚雄别國方言十三卷積二十七嵗而書成名曰輶軒使者絶代語釋别國方名葢爾雅之流也隋志十三卷郭璞注中興書目十四卷雄書云十五巻郭璞序方言之作出於輶軒之使循游方國采覽異言車軌所交人迹所蹈靡不具載古文苑天下計孝㢘及由郡衛卒㑹者雄常把三寸弱翰齎油素四尺以問其異語即以鈆摘次之於槧雄以示張伯松曰是垂日月不刋之書也劉歆從雄取方言書曰詔問三代周秦遒人軒車使者以嵗八月循路采童謠歌戯欲頗得其最目因從事郝隆求之篇中但有其目無見文者歆先君數為成帝言當使諸儒共集訓詁聞子雲獨採集先代絶言異國殊詞以為十五卷其所解畧多矣非子雲澹雅之才沈鬱之志不能經年鋭精以成此書文選注同欲驗考四方之事不勞戎馬髙車之使坐知謠俗雄報曰敕以殊言十五卷云云常聞先代輶軒之使奏籍之書皆藏於周秦之室嚴君平林閭深好訓詁猶見輶軒之使所奏言君平財有千言耳書疏春秋疏詩行葦疏考工記疏髙紀注文選注皆引方言及郭璞注左傳注引揚雄方言孑者㦸也北史劉延明著方言三巻漢志注蘇林曰五方之異書如今祕書學外國書也孟子有夏諺左傳有周諺漢釋名唐糾繆正俗劉珍傳撰釋名三十篇辨萬物稱號吳韋昭傳北海劉熈字成國作釋名物類衆多難詳究時有得失而爵位之事又有非是因作官職訓及辨釋名各一卷隋志唐志同劉熈釋名八卷崇文目云熈即物名以釋義凡二十七目書目同書正義引之韋昭辨釋名一卷尚書釋文引之義選注引韋昭釋名辨位月令正引蔡氏辨名記云十人曰選倍選曰俊春秋正義引辨名記北史李鉉覽説文蒼雅刪正六蓺經注中謬字名曰字辨唐㑹要永徽三年三月三日符璽郎顏揚庭上父師古所撰刋謬正俗八巻付祕閣志及崇文目同書目􅋌謬正俗八卷永徽二年師古子揚庭表上之其表云師古藁草纔半部帙未終揚庭以遺文分為八卷鄭樵跋正八卷辨其差舛唐祭酒李涪刋誤二卷刋正古今沿習舛誤凡五十條漢説文唐説文字源雍熈校定説文元豐重修説文繫傳韻譜引經字源後漢許慎傳字叔重以五經傳説臧否不同撰五經異義又作説文解字十四篇隋唐志十五巻并序目一篇中興書目十五巻雍熈四年徐鉉校定説春秋正義云説文是小篆之書記水經注云許氏字專釋於篆而不本古文考工注引説文解字叔重自叙今叙篆文合以古籒稽譔其説分别部居十四篇五百四十部九千三百五十三文重一千一百六十三解説凡十三萬三千四百四十一字其建首也立一於耑引而伸之以究萬原畢終於亥粤在永元困敦之年十二年庚子孟陬之月朔日甲申演賛其志次列微辭安帝建光元年九月二十日戊午慎子冲上之其書曰先帝詔侍中賈逵修理舊文臣父從逵受古學作説文解字十五巻前以詔書校書東觀教小黄門孟生李喜等詔召冲詣右掖門賜布四十匹即日受詔朱雀掖門江式曰首一終亥各有部屬類聚羣分雜而不越顏之推曰檢以六文貫以部分櫽括有條例剖析窮根源鄭𤣥注書徃徃引以為證徐鉉曰集蒼雅之學研六書之㫖字書精博莫過於是唐志李騰説文字源一巻陽氷從子騰金石録正元五年十月賈躭撰序李篆徐璹正書後蜀林罕撮五百四十一字為字源偏旁小説二卷隋志説文音隠四卷梁有演説文一巻庾儼黙注唐書學博士以石經説文字林為專業宋雍熈三年十一月乙丑朔右散騎常侍徐鉉等獻新校定説文三十卷十五卷每卷分上下以正副本及羣臣家藏者詳考是非補正缺漏十四篇并序目一篇凡萬六百餘字有正體而時俗訛變者具于注中違戾六書者序列于後諸儒箋釋可取者亦附益鉉等亦加訓釋時未有反切後人附益互有異同今並以孫愐唐韻音切為定詔付史館摹板頒行鉉與直史館句中正皆賜銀幣鉉序曰古文既絶譌偽日滋漢宣始命諸儒修蒼頡之法亦不能復故光武時馬援上疏論文字之譌謬其言詳矣和帝時申命賈逵修理舊文許慎采史籀李斯揚雄之書博訪通人考於賈逵作説文解字安帝十五年始奏上之而𨽻書行之已乆加以行草八分紛然間出以篆籀為竒怪不復經心六籍舊文相承傳寫多求便俗漸失本原唐大厯中李陽氷篆迹殊絶刋定説文修正筆法然頗排斥許氏自為臆説今為字者多從陽冰新義所謂貴耳賤目太宗留意字學故詔儒學之臣詳篆籀之迹元豐元年二月六日詔知禮院王子韶於資善堂置局修定説文五月庚寅十七日詔光禄丞陸佃同修定五年六月九日上重修説文各賜銀幣百其書不行王安石字説二十巻以㑹意一體貫通六書於春秋傳以毁則為賊而資以守典以止戈為武而達用兵以反正為乏而定伐惡之謀以皿蟲為蠱而立養生之戒春秋正義説文序云蒼頡之初作書葢依類象形謂之文其後形聲相益謂之字文者物象之本字者孳乳而生魏畧邯鄲淳善蒼雅蟲篆許氏字指書目説文解字繫傳四十卷南唐徐鍇楚金傳釋朱翺反切案鍇系述通釋一至三十部叙三十一至三十二通論三十三至三十五袪妄三十六類聚三十七錯綜三十八疑義三十九系述四十今亡第二十五巻崇文目鍇以許氏學廢推源析流演究其文作四十篇近世言小學惟鍇名家鍇集通釋四十篇三十卷又韻譜十卷五音凡十卷譜李燾為五音吳淑好篆籀取説文有字義者千八百餘條撰説文五義三卷唐林罕小説三卷凡五百四十一字其説頗與許慎不同而互有得失邵必進禮記石經陛對仁宗問罕書如何必曰雖有所長而微好恠一本云林罕著説文二十篇自曰林氏小説刻石蜀中中興書目引經字源二巻熈寧五年李行中取諸家説文與許叔重注義序例校正偏旁制為字源句中正傳太平興國二年獻八體書授直史館詔詳定篇韻與徐鉉重校定説文模印頒行太宗問凡有聲無文字有幾何中正退條為一卷以獻上曰朕亦得二十一字可并録之又命與吳鉉楊文舉同撰定雍熈廣韻中正先以門類上進成一百卷嘗以大小字八分三體書孝經摹石咸平三年表上之十五年方成命藏祕閣書之學出於聖人夬揚王庭官治民察者書契也仲尼見泰山封禪者七十有二家文皆不同可謂不知書邪子雲持三尺素入未央廷中以集訓纂復作竒字許子重為説文解字以佐孔氏伯喈自為三體勒五經於太學未聞以善書為訾也漢古文官書雜字指古文竒字黄帝古文隋志漢議郎衛敬仲宏古文官書一巻儒林傳序師古注引衛宏詔定古文官書序太子中庶子郭顯卿雜字指一巻唐志郭訓字㫖篇一卷古文竒字一卷唐志二卷秦書正義引衛宏古文竒字序云改古文以為篆𨽻朱育異字二卷賈魴字屬一卷唐志云字屬篇晉李肜字指二卷唐志衛宏詔定古文字書一卷後漢傳盧植熹平中言古文科斗降在小學中興通儒班固賈逵鄭興父子並説之杜林於西州得漆書古文尚書説文序古文孝經建武時給事中議郎衛宏所校韓愈科斗書後記李陽冰子服之授余以其家科斗孝經漢衛宏官書兩部合一卷愈寳蓄之而不暇學歸公好古書能通之凡為文辭宜畧識字書序孔壁得科斗文字事始云髙陽氏作字江式云張蒼獻古文左傳體與孔氏相類漢書叙𫝊函雅故通古今正文字劉棻從揚雄學作竒字古文之異者吴志注㑹稽典録曰山隂朱育少好竒字依體像類造作異字千名以上陳庾持好為竒字蜀志來敏精於蒼雅訓詁好是正文字魏志衛覬好古文鳥篆𨽻草無所不善書斷古文者黄帝史蒼頡所造也仰觀奎星圜曲之勢俯察龜文鳥跡之象采衆美合而為字是曰古文後漢陽球傳鴻都文學或鳥篆盈簡注八體書有鳥篆象形為字蔡倫傳自古書契多編以竹簡其用縑帛者謂之為紙倫造意用木膚麻頭及敝布魚網為紙元興元年奏上之漢勸學聖皇太甲在昔飛龍篇晉小學篇字苑唐志隋志同蔡邕勸學篇二卷聖皇章一卷隋志又有女史篇班固太甲篇在昔篇各一卷續揚雄作十三章崔瑗飛龍篇合篆草勢三卷黄初篇一卷陸機吳章篇一卷隋志二卷吳項峻始學十二卷晉楊方少學集十卷隋志九卷朱嗣卿幼學篇一卷隋志朱育二卷束晳發蒙記一卷隋志地理有束晳發蒙記一卷載物產之異顧愷之啓蒙啓疑記各三卷王羲之小學篇一卷隋志作下邳内史王義葛洪要用字苑一卷馮幹括字苑十三卷宋顏延之詁幼文三巻荀楷廣詁幼一巻易晉卦疏引蔡邕勸學篇云鼫鼠五能不成一伎術初學記引項峻始學篇曹植飛龍篇南史劉杳傳引何承天纂文葛洪字苑後漢志注引顏延之幼誥文選注引顧愷之啓蒙記顏延年纂要郭忠恕曰軍陳為陣始於逸少小學章形景為影本於稚川字苑漢三體書法後儒林傳序為古文篆𨽻三體書法見石經注古文謂孔子壁中書篆書秦始皇使程邈所作也𨽻書亦邈所作也主於徒𨽻從簡易也程逈曰𨽻書始於程邈八分始於王次仲東漢以來碑刻用八分書近世乃誤以八分為𨽻如邈書見古帖者自是小楷也書苑曰蔡文姬言割程𨽻字八分取二分割李篆字二分取八分於是為八分書千文曰杜藁鍾𨽻唐孫過庭草書譜曰元常專精於𨽻書伯英尤工於草體彼之二美逸少兼之此以真行為𨽻也梁蕭子雲啓曰見敇㫖論書洞達字體又以逸少不及元常子敬不及逸少因此研思遂悟𨽻式此以真行為𨽻無疑王羲之傳尤善𨽻書為古今之冠漢通俗文顏氏家訓通俗文世間題云服䖍造䖍漢人其叙乃引蘇林張揖蘇張皆是魏人且鄭𤣥以前全不解反語通俗反音甚㑹近俗阮孝緒又云李䖍所造晉中經簿及七志並無其目殷仲堪常用字訓亦引服䖍俗説今復無此書隋志通俗文一巻服䖍撰文選注引之俗春秋釋文引通顏之推訓俗文字畧一卷小學魏古今字詁晉字林韻集梁文字集畧隋志張揖古今字詁三巻難字誤字各一巻張揖魏太和中為博士解司馬相如傳一巻周氏雜字解詁四卷晉吕忱字林七卷宋吳恭字林音義五卷晉王延文字音七卷何承天纂文三卷戴規辨字一巻梁阮孝緒文字集畧六卷唐志同後漢戴就傳注引張揖字詁字林何承天纂文張衡傳注引字詁文選注引字林文字集畧陸徳明釋文多引字林本書目字林五卷或疑非書三朝史止一卷魏世又有八分書其字義訓讀有史籀蒼頡篇三蒼埤蒼廣蒼等諸篇章訓詁説文字林音義聲韻體勢等諸書江式曰魏博士清河張揖著埤蒼廣雅古今字詁埤廣綴拾遺漏増長字類然字詁方之許篇或得或失陳留邯鄲淳亦與揖同博聞古蓺特善蒼雅許氏字指八體六書精究閑理有名於揖以書教諸皇子又建三字石經於漢碑西其文蔚煥三體復宜校之説文篆𨽻大同而古字少異又有韋誕衛覬並號能篆咸傳之子孫世稱其妙晉世吕忱表上字林六卷附託許氏説文别古籀奇惑之字文得正𨽻不差篆意忱弟靜别放故左校令李登聲類之法作韻集五巻使宫商角徴羽各為一篇而音讀楚夏時有不同魏聲類晉韻集梁四聲譜韻畧唐韻隋志魏左校令李登聲類十卷晉安復令吕靜韻集六卷唐志五卷張諒四聲韻林二十八卷唐志四聲部三十卷段𢎞韻集八卷羣玉典韻五卷陽休之韻畧一卷夏侯詠四聲韻畧十三卷梁太子太傅沈約四聲一卷李槩音譜四巻周研聲韻四十一巻唐志趙氏韻篇十二卷陸慈切韻五卷蕭鈞韻音二十卷孫愐唐韻五卷愐増陸法言之書武元之韻銓十五卷𤣥宗韻英五卷李舟切韻十卷顔真卿韻海鏡源三百六十卷釋智猷辨體補脩加字切韻五卷國史志天寶元年集切韻五卷隋書陸法言切韻五卷陸法言云呉楚時傷輕淺燕趙多傷重濁秦隴去聲為入梁益平聲似去南齊陸厥傳周顒善識聲韻顒始著四聲切韻沈約等文皆用宫商以平上去入為四聲以此制韻不可増减世呼為永明體沈約作四聲譜梁武帝雅不好焉沈約宋書謝靈運傳論𤣥黄律吕各適物宜欲使宫羽相變低昂舛節若前有浮聲則後須切響一簡之内音韻盡殊兩句之中輕重悉異妙達此㫖始可言文自靈均以來多歴年代雖文體稍精而此祕未覩沈約荅陸厥書曰宫商之聲有五文字之别累萬以累萬之繁配五聲之約高下低昂非思力所學又非止若斯而已云云約論四聲妙有詮辨而諸賦亦往往與聲韻乖時有王斌著四聲論行於時齊永明中王融謝朓沈約文章始用四聲以為新變至梁轉拘聲韻彌為靡麗復踰往時簡文與湘東王書論之云云世謂蒼頡制字孫炎作音沈約撰韻為椎輪之始不知書契既造字生其間文字既生音傳其内聲音既出韻存其中觀立我蒸民莫匪爾極日月光華𢎞于一人之辭則堯舜之時固有聲韻也不然舜命夔何以曰詩言志歌永言聲依永律和聲唐楊收曰均言韻也古無韻字韻畧之名謂音韻各有畛畧也崇文目五卷求治之法本於形聲始於形也始東終法聲也訓纂字林等書以形相沿韻書既作學者趨便就簡不復知造書之意則比聲而求之或形存聲亡則茫無所考而韻書窮矣徐鼎臣兄弟分韻譜以從世好豈勢之所趨耶因聲求形因形得意吳楚辯音𨽻古分體三十六字母圖一卷僧守温四聲等第圖一卷僧宗彦切韻指𤣥論三卷王宗道玉海卷四十四
