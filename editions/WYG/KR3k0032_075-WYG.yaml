body:
  text: 玉海卷七十五宋王應麟撰禮儀射射者進退周還必中禮内志正外體直然後持弓矢審固持弓矢審固然後可以言中此可以觀徳行矣虞射侯禮書益稷帝曰侯以明之注當行射侯之禮以明善惡之教禮記正義射起於黄帝易弧矢世本揮作弓夷牟作矢是弓矢起於黄帝周大射射儀射正鵠射法射中天官司裘中士二人下士四人王大射則共虎侯熊侯豹侯設其鵠諸侯則共熊侯豹侯卿大夫則共麋侯皆設其鵠注大射者為祭祀射王將有郊廟之事以射擇諸侯及羣臣與邦國所貢之士可以與祭者射者可以觀徳行其容體比於禮其節比於樂而中多者得與於祭諸侯謂三公及王子弟封於畿内者卿大夫亦有采地焉將祀先祖亦與羣臣射以擇之凡大射各於其射宫疏云於西郊小學之中行大射之法侯者其所射也以虎熊豹麋之皮飾其側又方制之以為辜本亦作準謂之鵠著於侯中所謂皮侯王之大射虎侯王所自射也熊侯諸侯所射豹侯卿大夫以下所射諸侯之大射熊侯諸侯所自射豹侯羣臣所射卿大夫之大射麋侯君臣共射焉凡此侯道虎九十弓熊七十弓豹麋五十弓鄭司農云方十尺曰侯四尺曰鵠二尺曰正四寸曰質正鵠皆鳥之捷黠者𤣥謂鵠小鳥而難中是以中之為雋用虎熊豹麋之皮示服猛也士不大射士無臣祭無所擇掌次射則張耦次注大射曰遂命三耦取弓矢于次夏官射人下大夫二人上士四人下士八人掌三公孤卿大夫之位疏儀禮内諸侯有燕朝及射朝以射法治射儀王以六耦射三侯三獲三容樂以騶虞九節五正九十弓諸侯以四耦射二侯二獲二容樂以貍首七節三正七十弓孤卿大夫以三耦射一侯一獲一容樂以采蘋五節二正五十弓士以三耦射豻侯一獲一容樂以采蘩五節二正易氏曰大射則大司馬合諸侯之六耦賔射則諸侯與王射而合卿大夫為六耦至諸侯之四耦孤卿大夫士之三耦各以等辨注射法王射之禮治射儀謂肄之也鄭司農云容者乏也待獲者之所蔽也大射禮唱獲者居乏中中則舉旌以宫下旌以商者鄉射曰司馬命獲執旌以負侯九節析羽九重設於長杠三侯虎熊豹也𤣥謂三侯者五正三正二正之侯也二侯者三正二正之侯也一侯者二正而已此皆與賔射於朝之禮也梓人職曰張五采之侯則逺國屬謂諸侯來朝者也五采之侯即五正之侯也正之言正也儀禮注正亦鳥名齊魯之間名題肩為正射者内志正則能中畫五正之侯中朱次白次蒼次黄𤣥居外三正損𤣥黄二正去白蒼而畫朱綠九節七節五節者奏樂以為射節之差疏大射諸侯禮謂之司射天子謂之射人易氏曰天子之射與諸侯卿大夫之射尊卑雖異而皆發乗矢四矢也故用四節未發矢之前而天子以五節為聽諸侯以三節為聽孤卿大夫士以一節為聽此所以有九節七節五節之辨也若王大射則以貍歩張三侯注貍歩謂一舉足為一歩貍善搏者也其發必獲三侯虎熊豹也易氏曰射人掌賔射之灋而兼及大射之張侯王射則令去侯立于後以矢行告卒令取矢祭侯則為位與太史數射中佐司馬治射正注大射禮曰大射正立于公後以矢行告于公下曰留上曰􅀭左右曰方注射正射之法儀也疏射之威儀乃是禮之正大司馬若大射則合諸侯之六耦注王射三侯以諸侯為六耦射人注列國之君大射亦張三侯數與天子同服不氏射則贊張侯以旌居乏而待獲儀禮大射儀司馬正洗散遂實爵獻服不大僕王射則贊弓矢司弓矢大射共弓矢並夾詳見兵制繕人掌詔王射賛王弓矢之事疏案大射禮大射正授弓小臣授矢天子禮則繕人春官大史凡射事飾中舍筭執其禮事注司農云中所以盛筭𤣥謂設筭於中以待射時而取之中則釋之鄉射禮曰君國中射則皮竪中於郊則閭中於竟則虎中大夫兕中士鹿中天子之中未聞射人注射中數肘者中侯之筭也制禮記投壺之禮主人奉矢司射奉中疏其中之刻木為之狀如兕鹿而伏背以盛筭車僕大射共三乏疏乏者矢至此乏極司常凡射共獲旌大司樂大射王出入令奏王夏及射令奏騶虞詔諸侯以弓矢舞禮記月令季春之末擇吉日大合樂天子率公卿諸侯大夫親往視之注大合樂所以助陽逹物風化天下其禮今亡天子以大射郡國以鄉射代之周鄉射五物地官大司徒鄉三物教萬民賔興之三曰六藝射鄉師正嵗稽鄉器黨共射器射器弓矢楅中之屬黨正主集為之鄉大夫以鄉射之禮五物詢衆庶疏州長春秋二時習射於序名為鄉射物事也一曰和二曰容三曰主皮四曰和容五曰興舞注司農云和閨門内行也容容貌也主皮善射射所以觀士也𤣥謂和載六徳容包六行主皮和容興舞則六藝之射與禮樂與射之時民必觀因詢之也孔子射於矍相之圃觀者如堵墻射至於司馬使子路執弓矢出誓射者又使公罔之裘序㸃􅀭觶而語詢衆庶之儀若是乎庶民無射禮因田獵分禽則有主皮疏儀禮鄉射云豫則鈎楹内堂則由楹外又云序則物當棟堂則物當楣堂謂鄉學鄉大夫所行射禮也豫謂州長春秋習射于序此詢者是三物之内三物其事十有八今六徳之中唯問和六行之中唯問容六藝之中惟問禮樂射既貢賢于王其餘未能盡備畧舉五者問之鄉射記唯君有射于國中其餘則否鄉射在城外衆庶皆觀焉故得詢五物天子諸侯射先行燕禮鄉大夫士射先行鄉飲酒禮孔子為鄉大夫鄉射之禮先行飲酒禮子路為司射易氏曰五物徳之發見於射者也射之物有五而其節有三曰和曰容見於未射之時主皮和容見于射侯之際興舞特見於既射之後此射之序也内志正而其節比于樂是之謂和外體直而其容比于禮是謂之容以中鵠為主是謂主皮禮樂交作是為和容發揚蹈厲是為興舞州行州射之禮鄉行鄉射之禮及三年而賔興州長春秋以禮㑹民射于州序注序州黨之學㑹民而射所以正其志也夏官諸子秋合諸射儀禮鄉射禮第五乃合樂周南闗雎葛覃卷耳召南鵲巢采蘩采蘋工告于樂正曰正歌備司正立司正以監之司射主人之吏也司正為司馬司射適堂西命弟子設豐將飲不勝者豐形似豆而卑樂正東面命太師曰奏騶虞賔興樂正命奏陔禮記王制耆老皆朝千庠鄉學也鄉禮春秋射元日習射上功習鄉上齒論語射不主皮馬融注射有五善一曰和志體和二曰和容有容儀三曰主皮能中質四曰和頌合雅頌五曰興武與舞同家語孔子射於鄉射於是退而與門人習射於矍相之圃周禮大聚解立鄉射以習容射義注鄭目錄云記燕射大射之禮别錄屬吉禮疏此篇中有鄉射又云不失正鵠正則賔射然則鄉射賔射俱有之矣桑弧蓬矢取其質也用六者射天地四方也禮射唯四矢者示事有不用也象禦四方之亂孔子射於矍相之圃子路出延射者是將射之前案鄉射司射比衆耦於堂西但觀者既多庭中不容故出延之入乃比耦以初門外未入觀者既多未有賔主之禮故誓惡者令不入射禮畢旅酬之時乃使二人舉觶鄉射禮畢司馬反為司正樂工升堂復位賔取俎西之觶酬主人主人酬大夫自相旅畢君使二人舉觶於賔與大夫此公罔之裘序㸃二人舉觶之節也又云其侯並同賔射之法鄭注云鄉侯二正漢石渠議見後漢志注甘露三年三月黄門侍郎臨奏鄉射合樂大射否何也韋𤣥成曰鄉人無樂故合之朝廷君臣固有樂矣郊特牲疏王者獵在囿而主皮射亦在澤故鄭注鄉射記引尚書傳主皮射陳於澤然後卿大夫相與射也又云嚮之取也於囿中勇力之取也今之取也於澤宫揖遜之取也澤習禮之處燕禮疏鄉射賔與主人為耦此君與賔為耦亦是異於鄉射也大司馬疏大射是將祭而射故用諸侯為六耦賔射亦用六耦用卿大夫為之燕射三耦用卿大夫已下為之射人疏案鄉射記鄉侯五十弓弓二寸以為侯中行葦疏孔子射於矍相之圃先行飲酒之禮則孔子用鄉射禮公羊注諸侯嵗貢小學之秀者於天子學於大學其有秀者命曰造士行同而能偶别之以射然後爵之周燕射饗射羣臣射禮春官樂師燕射帥射夫以弓矢舞射夫衆耦也司几筵大饗射王立依前南鄉司服饗射則鷩冕注饗食賔客與諸侯射也笙師饗射共其鍾笙之樂夏官司弓矢大射燕射共弓矢并夾注每人一弓乗矢繕人掌詔王射疏王射先行燕禮以大夫為賔賔與王為耦冬官梓人張獸侯則王以息燕注燕謂勞使臣與羣臣飲酒而射儀禮燕禮射人告具注射人主此禮以其或射也射人遂為司正若射則大射正為司射如鄉射之禮大射正射人之長也君與射則為下射袒朱襦樂作而后就物詩行葦四鍭既鈞序賔以賢四鍭如樹序賔以不侮傳鍭矢參亭疏參亭謂三分矢一在前二在後輕重鈞亭四矢皆然周禮司弓矢鍭矢殺矢用諸近射田獵恒矢庳矢用諸散射注云散射謂禮樂之射此養老即是禮射而用鍭矢此與賔客私宴不與常射同箋周之先王將養老先與羣臣行射禮以擇其可與者以為賔疏禮稱將祭而射謂之大射養老與祭相類亦射以擇賔則亦為大射禮射有三賔射在朝而以射娱賔燕射因燕而射以為樂皆無擇士之義此射必大射也王肅以此為養老燕射案燕射於燕旅酬之後乃為之不當設文於曾孫維主之上豈先為燕射而後酌酒也射義云古者天子諸侯將射必行燕禮卿大夫之射必行鄉飲酒之禮大射禮搢三挾一箇謂卿大夫若其君則使人屬矢不親挾也鄉射記君國中射則皮樹中以翿旌獲白羽朱羽揉注國中城中也謂燕射也於郊則閭中以旌獲注於郊謂大射也大射於大學王制曰大學在郊於竟則虎中龍􅎶於竟謂與鄰國君射也周賔射大宗伯以賔射之禮親故舊朋友注射禮雖王亦立賔主疏案大射禮以大夫為賔主小臣賔射掌事如大僕之法注與諸侯來朝者射牛人掌賔射共膳羞之牛鏄師賔射鼓金奏之樂眡瞭賔射奏鍾鼓典庸器賔射設筍虡陳庸器射人以射法治射儀注此賔射於朝之禮詳見前大射不言士此與諸侯之賔射士不與也疏司裘大射不言士案下文士豻侯二正則士得自行賔射不得與君賔射矣大射在學故有著冕在扆之事賔射在路門之外朝與彼異司裘疏賔射射正大射射鵠梓人張五采之侯則逺國屬注五采畫正之侯賔射也射義疏射矍相之圃謂賔射鄭注鄉侯二正是用賔射之正凡賔射之侯謂之正天子賔射用五正三正二正之侯畿内諸侯賔射用三正卿大夫士二正畿外諸侯同天子周郊射樂記武王克殷散軍而郊射左射貍首右射騶虞而貫革之射息也裨冕搢笏而虎賁之士說劍也注郊射謂為射宫於郊也左東學也右西學也疏諸侯習射東學天子習射西學皇氏以為射必中如貍之取物其義非也鄭注大射云貍首逸詩貍之言不求也其詩有射諸侯首不朝者之言因以名篇武成乃偃武修文注倒載干戈包以虎皮示不用行禮射設庠序修文教周禮射書武成乃偃武修文注行禮射禮司弓矢散射注謂禮射及習射詩行葦疏養老即是禮射而用鍭矢者此與賔客私宴不與常射同禮射有三賔射在朝而射以娛賔燕射因燕而射以為樂是無擇士之義樂記云祀於明堂食老更於大學是祭與養老相類故知此射必大射也射義疏禮射唯四矢周五射三射大司徒六藝注射五射之法保氏教六藝三曰五射注白矢參連剡注襄尺襄音讓井儀也疏白矢矢貫侯過見其鏃白參連前放一矢後三矢連續而去剡注羽頭髙鏃低而去剡剡然也襄尺臣與君射不與君竝立襄君一尺而退也井儀四矢貫侯如井之容儀漢陳敬王傳愍王寵善努射十發十中中皆同處華嶠書曰寵射其秘法以天覆地載參連為竒又有三㣲三小三㣲為經三小為緯然要在機牙六韜太黄參連弩見李廣傳注射義疏凡天子諸侯及卿大夫禮有三射一為大射是將祭擇士之射二為賔射諸侯來朝天子入而與之射也或諸侯相朝而與之射也三為鄉射謂燕息而與之射賔之初筵鄭箋射禮有三大射賔射燕射其天子諸侯大夫三射皆具其士無大射故司裘職云大射唯明王及諸侯卿大夫不及於士賔射燕射士皆有之射人云士射豻侯二正是士有賔射也又鄉射記曰士布侯畫以鹿豕是士有燕射矣此三射之外又有鄉射謂鄉大夫貢賢能之後行鄉射之禮而詢衆庶又有州長射于州序之禮其侯並同賔射之法鄭注云鄉侯二正又有主皮之射二一是卿大夫從君田獵班餘獲而射書傳云凡祭取餘獲陳於澤卿大夫相與射鄭注鄉射稱主皮者無侯張獸皮而射之主於獲也二是庶人亦主皮鄭注周禮庶人無侯張皮而射之是也詩行葦正義大夫射禮有五大射賔射燕射鄉射主皮之射又有習武之射司弓矢云弧弓以授射甲革椹質是也畫布曰正則賔射也栖皮曰鵠則大射也周禮正義大射射鵠賔射燕射射侯射人疏梓人有二等侯云張皮侯而棲鵠及司裘虎熊豹皆大射之侯也張五采之侯及五正等皆賔射之侯也張獸侯及鄉射記天子熊侯白質之等皆燕射之侯也三射各有其侯先鄭以皮侯釋正侯非也射義諸侯之射必先行燕禮疏案儀禮大射在未旅之前是先行饗禮而云燕者燕初似饗燕射則尊卑皆用一侯君畫一臣畫二燕射射熊虎豹不忘上下相犯射麋鹿豕志在君臣相養也其耦射人云諸侯以下謂畿内也若畿外諸侯以下則皆三耦大射及鄉射并左傳襄二十九年晉士鞅來聘射皆三耦是也司弓矢恒矢庳矢用諸散射注謂禮射及習射也疏禮射者即大射賔射燕射之等其習亦於此三射中為之通典周初千八百國所以崇三射之制立五善之目於兹選士由此封侯本在戡敵實寓大政晉竹書有繳書二篇論弋射法周皮侯五采侯獸侯祭侯梓人為侯廣與崇方參分其廣而鵠居一焉上兩个與其身三下兩个半之上綱與下綱出舌尋張皮侯而棲鵠則春春讀為蠢蠢動也以功大射張五采之侯則逺國屬賔射張獸侯則王以息燕燕射祭侯之禮以酒脯醢其辭曰惟若寧侯毋或若汝不寧侯不屬于王所故抗而射女注皮侯以皮飾司農曰王大射共虎熊豹侯也又射人曰王大射則以貍歩張三侯五采侯者五采畫正之侯王以六耦射三侯九節五正諸侯朝㑹張之所謂賔射也獸侯畫獸之侯鄉射記曰凡侯天子熊侯白質諸侯麋侯赤質大夫布侯畫以虎豹士布侯畫以鹿豕凡畫者丹質是獸侯之差也息者休農息老物燕謂勞使臣若與羣臣飲酒而射侯之别有三易氏曰後鄭謂大射之侯用鵠賔射之侯用正燕射之侯用質合于梓人之說射人祭侯則為位注祭侯獻服不服不以祭侯為位為服不受獻之位也大射曰服不侯西北三歩北面拜受爵疏大射禮使服不氏負侯將祭之時先設位於侯西北北面射鳥氏矢在侯髙則以并夾取之司弓矢疏天子用王弧射虎侯用唐大射熊侯用夾庾射豹侯禮記正義射義虞書曰侯以明之是射侯見於堯舜夏殷無文周則具矣儀禮大射儀司馬命量人量侯道與所設乏以貍歩大侯九十參七十干五十設乏各去其侯西十北十遂命量人巾車張三侯詩猗嗟終日射侯不出正兮箋正所以射於侯中者天子五正諸侯三大夫二士一皆居侯中參分之一賔之初筵大侯既抗弓矢斯張射夫既同獻爾發功發彼有的以祈爾爵箋天子諸侯之射皆張三侯故君侯謂之大侯鄉射禮注獸侯燕射則張之鄉射及賔射當張采侯二正鄉大夫注主皮者張皮射之無侯周射器地官鄉師正嵗稽鄉器比共二服閭共祭器簠簋鼎爼之屬黨共射器弓矢楅中之屬州共賔器尊爼笙瑟之屬鄉共禮樂之器儀禮鄉射命弟子納射器注弓矢決拾旌中籌楅豐也大射儀命有司納射器射器皆入君之弓矢適東堂賔之弓矢與中籌豐皆止于西堂下衆弓矢不挾總衆弓矢楅皆適次而俟賈誼新書懸弧之禮東方以梧南方以栁中央以桑西方以棘北方以棗大射儀疏熊侯而謂之大者言畿外諸侯亦得用三侯其數上同於天子故於熊侯加大以别之天子三侯則虎熊豹諸侯不得用虎侯而以熊糝豻為三侯若畿内則但有熊豹天子大射賔射六耦三侯畿内諸侯則二侯四耦畿外諸侯大射賔射皆三侯三耦畿外内各有一伸一屈畿外三侯逺尊得申三耦則屈畿内二侯近尊則屈四耦則申若燕射則天子諸侯例同三耦一侯而已以其燕私屈也若卿大夫士例同一侯三耦侯射布也三侯皆以布為之而以皮為鵠侯旁亦以皮飾之乏即周禮所謂容射義疏天子大射射皮侯虎熊豹畿内諸侯大射張熊侯豹侯若畿外諸侯大射亦張三侯鄭注云逺尊得伸故亦張三侯一曰大侯熊二曰糝侯雜也豹鵠而麋飾三曰豻侯胡犬皮飾侯若畿内卿大夫射麋侯畿外卿大夫射侯無文降君一等則糝豻侯其大射之侯皆有鵠鄉射記君國中射則皮樹中以翿旌獲白羽朱羽揉城中也謂燕射也於郊則閭中以旌獲大射於大學王制大學在郊於竟則虎中龍􅎶謂與鄰國君射也大夫兕中各以物獲士鹿中翿旌以獲謂小國之州長也唯君有射于國中其餘否臣不習武事於君側也禮司裘注所射正謂之侯者天子中之則能服諸侯諸侯以下中之則得為諸侯侯中之大小取數於侯道鄉射記曰弓二寸以為侯中則九十弓者侯中廣丈八尺七十弓者侯中廣丈四尺五十弓者侯中廣一丈尊卑異等梓人為侯廣與崇方參分其廣而鵠居一則侯中丈八尺者鵠方六尺丈四尺者鵠方四尺六寸大半寸一丈者鵠方三尺三寸少半寸疏侯中上下俱有布一幅夾之所飾者唯兩旁射人注今儒家云四尺曰正二尺曰鵠鵠乃用皮其大如正此說失之矣疏賔射射正大射射鵠儒家以正鵠為一解故鄭破之侯道者各以弓為度九節者九十弓七節者七十弓五節者五十弓疏弓之上制六尺六寸中制六尺三寸下制六尺六尺與歩相應春秋正義屈蕩為連尹服䖍云連尹射官言射相連屬也周澤宫夏官司弓矢澤共射椹質之弓矢大射燕射共弓矢如數并夾注鄭司農云澤澤宫也所以習射選士之處也射義曰天子將祭必先習射於澤澤所以擇士也已射於澤而後射於射宫射中者得與祭并夾矢籋也疏射椹質是試弓習武在澤宫矢籋之言出於漢時射義天子將祭必先習射於澤已射於澤而后射於射宫疏澤所在無文盖於寛閑之處近水澤而為之非唯祭而擇士餘射亦在其中書傳云凡祭取餘獲陳於澤然後卿大夫相與射論主皮射云嚮之取也於囿中勇力之取也今之取也於澤宫揖讓之取也是主皮之射亦近於澤選士於澤不射侯也但試武而已於澤中射椹質郊特牲卜之日王立于澤親聽誓命受教諌之義也注澤澤宫也所以擇賢之宫也既卜必到澤宫擇可與祭祀者因誓敕之以禮也正義於其宫以射擇士因呼為澤宫王者獵在囿而主皮射亦在澤賔之初筵箋先王將祭必射以擇士射禮有三有大射有賔射有燕射正義將祭再為射禮澤宫言習射則未是正射射於射宫乃行大射鄉射記曰於郊則閭中注云於郊謂大射於學則射宫者西郊之學也澤宫之所在則無明文毛以此篇為燕射注云大侯君侯也有燕射之禮鄭則為大射大射者將祭擇士於射宫賔射者謂諸侯來朝與之射於朝燕射者因燕賔客即與射於寢三者其處不同其侯亦别冬官梓人皮侯即大射也五采之侯賔射也獸侯燕射也不言鄉射者鄉射是州長與其民射於州序之禮天子諸侯無之射禮主於射畧於樂大射云司射命曰不鼔不釋言射不與鼓節相應不釋筭也樂正命大師曰請奏貍首間若一言調其疏數以節射也然則射之樂者撃鼓作歌與射者為節而已不必大作諸樂車攻注禽雖多擇取三十焉其餘以與大夫士以習射於澤宫田雖不得禽射中則得取禽古者以辭遜取不以勇力取疏所謂班餘獲射也書傳榖梁傳畧同分小宗伯注詩傳云習射于澤宮而之尚書大傳已祭取餘獲陳于澤然後卿大夫相與射注澤射宫也又射夫既同疏田無射禮既田乃有班餘獲射在於澤宫言同復將射之位在澤宫之位也鄉射禮云禮射不主皮不勝者降即此是也家語郊問篇王親立于澤宫以聽誓命說文泮諸侯鄉射之宫西南為水東北為牆周射宫諸子掌國子之倅秋合諸射注射射宫也疏射宮即國之小學在西郊則虞庠是也司几筵疏大射席在虞庠大司馬大射合諸侯六耦注大射王將祭射于射宫以選賢也司裘注凡大射各於其射宫疏西郊之學大射儀公入驁注射宫在郊以將還為入射義諸侯嵗貢士於天子天子試之於射宫其容體比於禮其節比於樂而中多者得與於祭已射於澤然後射於射宫正義其射宫天子大射則在廟也司服云享先公饗射則鷩冕天子賔射則在朝射人云諸侯在朝皆北面是也其服皮弁服天子諸侯燕射則在寢諸侯燕於小寢天子路寢之朝謂之燕朝鄉射記云君國中射則皮樹中注謂燕射其服則𤣥冠緇衣素裳諸侯大射在郊學鄉射記於郊則閭中注云大射於大學其服皮弁諸侯賔射若在國則亦在朝若在國外相㑹則在竟鄉射記於竟則虎中其服亦皮弁其卿大夫以下射之所在無明文禮大射之禮王將祭射宫擇士以助祭張虎侯熊侯豹侯若今之的天子射中可以服諸侯也天子侯丈八尺樂記疏郊射射於射宫在郊學之中天子於郊學而射所以擇士簡徳習禮射於學故貫革之射止息也熊氏云殷禮小學在公宫南之左大學在郊武王猶用殷制故小學射貍首大學射騶虞言為射宫於郊者大學也貫革所謂軍射也燕義疏仲秋之時合其諸子在於射宫擇士習射之宫也榖梁傳習射於射宫周射節樂師凡射王以騶虞大司樂及射令奏騶虞諸侯以貍首大夫以采蘋士以采蘩為節注皆樂章名在國風召南惟貍首在樂記射義曰騶虞樂官備貍首樂㑹時采蘋樂循法采蘩樂不失職也鄭司農說以大射禮曰樂正命大師曰奏貍首間若一疏樂記曰左射貍首右射騶虞間若一者謂七節五節之間緩急稀稠如一大師帥瞽而歌射節注王歌騶虞鍾師凡射王奏騶虞諸侯奏貍首卿大夫奏采蘋士奏采蘩射人九節七節五節注奏樂以為射節之差詳見大射騶虞九節貍首七節采蘋采蘩皆五節言節者容侯道之數射義云云詩曰曽孫侯氏四正具舉大夫君子凡以庶士小大莫處御于君所以燕以射則燕則譽注此貍首節也疏鄉射注云五節歌五終四節四拾其一節先以聽也然則九節者五節先以聽七節者三節先以聽皆以四節應乗矢拾發也鄭注大射云貍之言不來也其詩有射諸侯首不朝者之言大射禮獻大夫之後乃後工入樂作而後射若燕射則說屨升堂坐之後乃射矣孔子曰射者何以射何以聽循聲而發發而不失正鵠者其惟賢者乎疏射中與樂節相㑹為難郊特牲孔子曰射之以樂也何以聽何以射士使之射不能則辭以疾懸弧之義注多其射容與樂節相應也大射儀司射與司馬請以樂于公注云請奏樂以為節也射用應樂為難疏禮射其節比於樂也司射命曰不鼓不釋注鼔亦樂之節凡射之鼓節投壺其存者也周禮射節天子九諸侯七卿大夫以下五疏今禮記投壺篇圗出魯鼓薛鼓云取半以下為投壺節盡用之為射節奏貍首注逸詩曾孫也漢郊祀志萇𢎞設射不來史記設射貍首史記有原壤所歌之辭曰貍首之班然或曰貍首鵲巢也篆文貍似鵲首似巢周射見朝儀漢射法射書唐射經又見後藝文志兵技巧十三家百九十九篇逢門射法二篇隂通成射法十一篇李將軍射法三篇李廣魏氏射法六篇強弩將軍王圍射法五卷望逺連弩射法具十五篇䕶軍射師王賀射書五篇晁錯傳居則習民於射法李廣傳世世受射注射法控􅁌貫石威動北隣唐志蓻術有王琚射經一卷張守忠射記一卷通典兵制引趙國公王琚教射經上下篇漢辟雍大射射宫紀明帝永平二年三月臨辟雍初行大射禮月令季春注大合樂今天子以大射郡國以鄉射代之和帝永元十四年三月戊辰臨辟雍饗射順帝陽嘉元年三月庚寅帝臨辟雍饗射大赦改元陽嘉禮儀志永平二年三月上始帥羣臣養三老五更于辟雍行大射禮注袁山松書曰天子皮弁素積親射大侯周雅頌樂辟雍饗射之樂輿服志行大射禮於辟雍公卿諸侯大夫行禮者冠委貌衣𤣥端素裳執事者冠皮弁衣緇麻衣皁領袖下素裳百官志太常卿大射養老皆奏其禮儀東京賦春日載陽合射辟雍設業設虡宫縣金鏞鼖鼓路鼗植羽幢幢伯夷相儀后䕫為工張大侯制五正設三乏厞司旌并夾既設儲乎廣庭天子乃撫玉路時乗六龍發鯨魚鏗華鐘大丙弭節風后陪乗攝提運行徐至于射宫禮事展樂物具王夏闋騶虞奏决拾既佽雕弓斯彀仁風衍而外流誼方激而遐騖列傳曹充建武中議立大射養老禮儀樊凖上疏明帝每饗射禮畢正坐自講雖闕里之化矍相之事不足言陳王羡子思王鈞立不法私行天子大射禮注謝承書曰陳國户曹史髙慎諫曰諸侯射豕天子射熊八彛六尊禮數不同奢僣之漸不可聽也張敏永初元年安帝召拜司空六年春行大射禮陪位漢鄉射郡縣饗射儒林傳序髙帝引兵圍魯魯中諸儒尚講誦習禮於是諸儒始得修經學講習大射鄉飲之禮禮樂志河間王雅樂春秋鄉射作於學宫傳司馬遷鄉射鄒嶧韓延夀為東郡太守修治學宫春秋鄉射陳鍾鼔管􅁌盛升降揖讓及都試講武習射御之事歌者先居射室李竒曰都試射堂也延夀坐射室騎士從者帶弓鞬羅後後儒林傳序本初元年詔於鄉射月一饗㑹注漢官儀春三月秋九月習鄉射禮禮生皆使太學學生後傳劉昆陳留人教授弟子每春秋饗射常備列典儀以素木瓠葉為爼豆桑弧蒿矢以射菟首注歌菟首之詩而為節行禮縣宰率吏屬觀之儒林鮑永為魯郡太守孔子闕里無故荆自除從講堂至于里門永謂府丞及魯令曰闕里自開豈夫子欲令行禮邪乃㑹人衆修鄉射之禮秦彭為山陽太守每春秋饗射修升降揖讓之儀循吏楊厚門人為立廟郡文學掾史春秋饗射常祠之伏湛傳論恵公造次急於鄉射之禮禮儀志注服䖍應劭曰漢家郡縣饗射祭祀皆假士禮而行之樂縣笙磬籩俎皆如士制儀禮注鄉射禮今郡國行此禮以季春今郡國行此鄉射禮皮弁服與禮禮記射義疏儀禮大射云耦進上射在左並行當階北面揖及階揖升堂揖皆當其物北面揖及物揖射畢北面揖揖如升射是射時升降揖讓也大射又云飲射爵之時勝者皆袒決遂執張弓不勝者皆襲說決拾卻左手右加弛弓于其上遂以執弣揖如始升射及階勝者先升升堂少右不勝者進北面坐取豐上之觶立卒觶坐奠於豐下興揖不勝者先降是飲射爵之時揖讓升降也宋蔡興宗為㑹稽太守三吳舊有鄉射禮久不復修興宗行之禮儀甚整先是元嘉中羊𤣥保為郡亦行鄉射漢大射曲臺博士行大射禮見臺類五行志鴻嘉二年三月博士行大射禮有飛雉集於庭歴階登堂晉宴射華林園文選應吉甫有晉武帝華林園集詩注干寳晉紀泰始四年二月晉武帝與羣臣射於華林園晉書應貞字吉甫武帝於華林園宴射貞賦詩最美詩曰於時肄射弓矢斯御發彼五的有酒斯飫的射質也晉鄉射通典晉咸康五年征西庾亮行鄉射之禮依古周制親執其事洋洋有洙泗風宋武帝為宋公在彭城九月九日出戯馬臺射北齊三月三日射晉輿服志行鄉射禮則公卿委貌冠隋志禮類雜鄉射等議三卷晉太尉庾亮撰元魏射宫銘宣武景明中幸鄴帝親射逺及一里五十歩羣臣勒銘於射所後於河内懐縣親射矢一里五十餘歩侍中髙顯等奏聖武自天神藝夙茂巧㑹騶虞之節妙盡矍圃之儀威稜攸疊甝兕懾氣才猛所振勍憝弭心足以肅截九區赫服八宇盛事竒跡請勒銘射宫隋大射武徳殿紀開皇十二年十一月甲子百竂大射於武徳殿大業四年正月庚戌百竂大射於允武殿周武帝保定元年正月丙子大射於正武殿二年十月辛亥御大武殿大射唐大射射殿㑹要武徳二年正月一云五年正月辛丑賜羣臣大射于𤣥武門四年八月一云九月癸亥賜五品以上射於武徳殿貞觀三年三月三日甲辰賜羣臣大射於立一作𤣥徳門五年三月三日癸亥賜文武五品以上射武徳殿九月乙丑同年舊紀貞觀五九月乙丑賜羣公大射於武徳殿六年三月三日丙辰賜羣臣大射武徳殿十一年三月三日戊子引五品以上射於儀鳯一作鸞殿十六年三月三日戊午賜百僚大射於觀徳殿九月九日又賜文武五品以上射於𤣥武門永徽三年三月三日丙辰幸觀徳殿賜羣臣大射五年九月三日乙亥御丹霄樓三品以上行大射禮四日丙子賜五品以上射帝升永光門樓觀之麟徳元年三月三日展大射禮景雲二年源乾耀上表請行射禮先天元年九月九日乙亥御安福門賜公卿射麟徳後此禮久廢今重行之二年三月三日太上皇御安福門觀百僚射至八日乃止開元七年三月三日賜百官射八年九月七日制賜百官九日射給事中許景先駁奏遂罷之二十一年八月詔曰將射侯以觀徳豈愛羊而去禮其三九射禮依舊九月九日五品以上賜射于安福門樓下自此以後射禮遂廢以上並㑹要大射樂章四皇帝射騶虞二奏王公射貍首一奏迎送皇帝入閣奏太和貞觀初張文収定樂皇帝大射以姑洗為宫奏騶虞之曲皇太子奏貍首之曲志射前一日太樂令設宫縣之樂鼔吹令設十二案於射殿之庭張熊侯去殿九十步設三乏於侯西北十步及五楅庭前少