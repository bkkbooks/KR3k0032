淳化二年三月乙卯射瓊林苑三年三月庚申宴瓊林苑因習射中的五六年二月射瓊林苑淳化後苑習射賦詩淳化元年二月己未宴近臣於後苑習射張樂飲酒詔羣臣賦詩上亦賦一章賜宰相吕䝉正等九月辛巳八日召近臣後苑習射因御崇政殿觀角抵之戯二年三月庚子朔宴後苑上臨池釣魚詔羣臣賦詩因習射上中的四三年三月丙午宴後苑因習射五發皆中的淳化大射圖五年九月壬子二十三日中書門下獻大射圖先是八月五日甲申上有意於大射詔有司講求典故實錄云講求大射儀注自周官射禮及開元開寳禮斟酌損益草定其儀大約如朝謁元㑹之禮酒三行有司奏賜王公下射侍中稱制可皇帝改服武弁射於殿上布七埓於殿下自公卿大夫各有著位開樂虡於東廂中設熊虎等侯陳賞物於東階以賞能者設醴爵於西階以罰否者并畫其冠冕儀式表著埻音準埓之位以進上覽嘉之謂宰相曰俟弭兵當與卿等行之至道崇政殿射元年三月己巳令衛士數百射於崇政殿庭召張浦觀之先是上賜李繼遷勁弓三皆力及一石六斗繼遷意上欲威示戎虜非有人能挽也至是士皆引滿平射有餘力浦大駭上向戎人敢敵否曰蕃部弓弱矢短敢拒敵乎咸平苑中宴射玉津園射咸平二年九月戊子九日召宗室宴射于苑中癸卯宴射于後苑帝中的者十一四年閏十二月己巳宴射後苑五年三月戊戌射于水心殿六年三月丁未又射至祥符九年正月丙午朔宴射凡八咸平三年五月丁丑朔幸玉津園召從臣射于西園北亭帝中的者九九月壬辰十八日帝中的十二祥符四年五月丁丑四日中的者八五年五月癸未十七日六年四月丙戌二十五日九年五月乙巳天禧元年五月己亥二日三年四月庚戌七日並射玉津園咸平三年十二月丁巳十四日幸殿前班院閲馬射遂宴射後苑上七中的咸平瓊林苑射咸平三年五月己丑十三日幸瓊林苑南亭命親王帥臣射帝三中的四年四月丁巳十六日六年四月戊辰九日祥符三年三月壬辰四月辛未又射咸平含芳園習射咸平四年八月壬子十一日幸含芳園習射景徳元年正月癸巳三年九月甲寅又射咸平宜春苑宴射潜龍園宴射五年二月己丑幸上清宫宴射宜春苑上中的者六六年二月戊寅十八日幸潜龍園宴射上中的者七祥符元年九月乙亥二年九月乙丑又宴射于潜龍園四年十二月辛亥幸殿前班觀習射移幸潜龍園宴射咸平後苑習射射宫詩咸平四年三月十八日己丑後苑賞花習射帝與近臣言及大射投壺鄉飲酒之禮因命直館各賦射宫五言六韻詩帝詔羣臣極歡八月壬子幸御龍營閲射勁弓賜緡錢有差遂幸含芳殿宴射景徳凱旋燕射元年十二月戊子宴從臣于行宫後苑之西亭因習射上連中的羣臣奉觴稱賀李繼隆等相繼而中上命矢連發疊中之咸賜襲衣金帶鞍馬舉酒屬之戊戌北征凱旋庚子賜近臣宴于冦準第諸帥宴射于本司賜上尊珍膳祥符太清樓宴射元年三月庚午二年正月癸亥三月戊辰三年閠二月辛未四年八月庚戌六年三月丙申七年三月癸巳十月丙寅九年三月丁巳天禧三年三月十三日庚午皆宴射于太清樓下又景徳四年三月甲寅宴後苑射於太清樓下祥符水心殿宴射射堂宴射賜詩元年五月庚申朔幸玉津園水心殿宴射帝中的者十又觀衛士騎射於苑南門二年五月庚申幸玉津園宴射水心亭三年閏二月十七日丁卯幸開封府射堂命宗室牧伯射帝巾的者七三月壬辰幸金明池瓊林苑宴射上作七言詩賜近臣屬和八月十四日庚申幸含芳苑宴射帝中的者再四年十二月十二日辛亥幸殿前班召從臣觀騎士習射移幸潜龍苑宴射五年四月五日壬寅幸瓊林苑宴射帝作五言詩賜近臣和六年四月甲戌幸瓊林苑宴射上作歌丙戌射于水心殿上十中的七年八月八日辛酉幸瑞聖苑宴射於水心殿帝作五言詩賜近臣八年三月十日丙申幸瓊林苑宴射上中的者六帝作七言詩近臣和九年四月九日壬午幸瓊林苑宴射帝作七言詩賜從臣五月二日乙巳宴射玉津園帝作七言詩從臣和祥符幸射堂宴射三年閏二月丁卯幸開封府射堂宴射又至西堂閲太宗御書圖畫上作詩從臣皆賦甲戌增葺射堂為繼照堂設帟張樂許士民㳺觀三日至道初上居府廨太宗命府東建堂習射周起奏陛下嘗所聽事臣不敢居天聖瓊林苑賜射玉津園宴射寳元瑞聖苑射天聖八年四月三日乙酉幸瓊林苑賜從臣射射于苑亭遂燕從臣是日旁有五色雲九年四月己卯景祐三年四月辛亥五年四月癸酉慶厯二年四月甲戌朔六年四月辛亥朔八年四月甲戌皇祐二年四月丁巳朔四年四月丙子朔嘉祐六年四月七年三月又射至和二年四月四日壬辰幸瓊林苑宴射上中的者十四已而閲騎士射栁枝嘉祐七年三月丁丑燕瓊林苑觀衛士射栁枝天聖八年五月十一日幸玉津園宴射上中的者七從臣奉酒貢馬稱賀九年五月丁巳射慶厯五年八月又射四年五月壬申幸玉津觀稻遂燕從臣射于園中上中的十九寳元二年八月丁亥二十八日幸瑞聖苑射上中的十一慶厯元年八月丁丑朔又射五年八月丁巳幸瑞聖園觀刈榖燕從臣射于苑中觀騎士射柳枝皇祐元年八月乙亥凡四幸景祐太清樓宴射景祐二年十月八日戊午宴射太清樓帝中的者四慶厯五年九月九日辛卯六年九月九日乙未又射四年九月丁亥召宗室燕太清射于苑中熙寧瓊林苑宴射熙寧三年四月三日幸瓊林苑宴射元豐二年四月辛丑三日再幸宴射上中的羣臣皆賀廼命羣臣射御苑門觀軍士射栁枝上再幸池苑熙寧八年五月臧景言馬射六事一曰順騌直射二曰背射三曰盤馬射四曰射親五曰野戰六曰輪弄各為說以曉習射者詔即武學敎習并下經畧將官熙寧太學射圃熙寧十年二月癸巳詔太學西門修築射圃聽諸生遇假日習射從國子監請也宋朝神射式書目廣弓經一卷紀旦取韋蘊舊篇仲既新訓李將軍手訣王堅道歌詩削浮辭成此書神射式一卷王徳用分拽弓遣箭去病射親四類又劉懐徳以所聞徳用射法之要分為十篇為射法一卷任權撰弓箭啟䝉一卷謂學射之術有五張仲商射訓一卷馬思永射訣一卷十篇論體法辨弓箭􅁌及射親之要王越石射議一卷有選弓擇矢容體引挽斷發去病取親凡七篇乾道玉津園射燕射舊儀淳熙燕射賦詩乾道二年二月四日幸玉津園射次命皇太子慶王恭王次管軍臣僚射如是者三每射者四發上前後四中的先是閤門討論燕射舊儀輔臣奏曰此政和新儀所載儀式煩苛費亦不少上曰祖宗朝想無樂今宜事事節省别行議定七年二月十二日諭輔臣曰祖宗數召近臣賞花釣魚朕暇日欲命卿等射飲君臣相親則情通九年十二月二十二日庚辰臣僚請令太學生習射上曰玉津燕射唯武臣射文臣亦當與可討論典故以聞淳熙元年三月十三日庚子禮官言按㑹要㳺幸池苑賦宴詔宗室武臣射無文臣射典故於是詔從駕文武臣射用唐貞觀中賜文武五品以上射於武徳殿故事九月壬寅十八日再幸玉津園燕射賜皇太子已下宴酒三行樂作上臨軒有司進弓矢上中的皇太子進酒率羣臣再拜稱賀宣皇太子射射中次宣與射臣僚文臣葉衡等皆射上再射復中的保信節度鄭藻起居舍人王卿月環衛官蕭奪里懶射巾賜襲衣金帶上賦七言詩丞相曾懐已下屬和還宫都人聳觀驩動林野二十七日詔臨安府擇寛閑地建射圃備百僚習射四年三月十日又射九月二十二日選徳殿觀擊毬紹興十八年五月丙子金使賀天申節始燕射于玉津園遂為故事淳熙後苑觀射射鐵簾又見講武類宴凌虚閣上壽二年二月庚辰宣引輔臣使相至後苑觀歩軍司弓弩手射上曰近來諸軍射藝頗精每射訖上親視所中箭多寡并射入鐵簾淺深賚賜有差宴羣臣于凌虚閣下丞相葉衡等席于左少保士輵等席于右酒三行衡率羣臣以次上夀再拜退詔宣勸在列已而舞劍者進其技精絶上曰此軍中之樂衡乞獨班再奉萬年之觴上喜飲釂命以琉璃鍾酌丞相徧及羣臣仍各第其量以賜上曰兹有典故衡奏是乃祖宗賞花釣魚故事越二日選徳殿奏謝上曰猶恨不得與卿欵曲淳熙試進士射孝宗嘗諭輔臣欲令文士能射御武臣知詩書淳熙元年三月庚子禮部胄監言知道州樓源請令太學生習射州縣學置射圃今欲舉行舊法令太學生講習射禮進士殿試上二甲人擇日試射庶合射宫試士之意從之二年五月己丑御射殿引新進士按射元年七月二十六日太學置射圃角孝宗課儒生以金榖懼空言之無補進士以弧矢慮戎偹之或忘元豐六年五月癸未司業朱服請太學生暇日習射從之宋祁上皇帝後苑燕射賦暌取星弧之象樂著天騶之節披虎落之囿㑹麟定之親始講射侯之容將明潔觶之禮天威粹健帝表胖正彫弓栗笴儼若有容栖鵠畫正砉然命中賦曰執徐統歲少皥司秋月著授衣之令日紀吹花之游司射謹官梓人庀具飭虎進侯張貍設步厞崇旌以虹拖畫廣堋而雲布并夾竝儲决拾相旅我物孔陽我儀用光剡矢薦於夏箙彫弓出于扶桑采五施而烈暈歌九節而升堂萬乘來御羣心樂康􅁌隨月上弓與天張捨抜則供應􅁌而中主皮劃其已徹勁羽飲而猶動駭踆烏於日域震封狼於星冡皇衿兌說協氣雲蒸少府之賜錢流地庖人之割肉如陵軒霞蕃后盤石宗英美發的之希代咸奉觴而造庭射之為義是謂觀禮外則審固而正躬内則雍容而繹志支左屈右之能項發口縱之異或合宴序賔或筭多與祭公用隼而射墉觀如墻而􅀭觶中則得為諸侯爭有似乎君子然特人臣之善容未識我皇之射意若夫修五常為弓矯百度為矢緫黎獻以植的罄綿區而除位參天地之控引順陰陽而張弛一發則英雄在􅁌虚撫則蠻夷斷臂豈徒鵠取難中之名騶樂庶官之備曹子建詩控􅁌破左的右發摧月支注引邯鄲淳藝經曰馬射左邉為月支三枚馬蹄二枚曹毗馬射賦曰修埒坦其平舒應瑒馳射賦曰旝動鼓震李充良弓銘力稱顔髙巧發由基射之制尚矣上火下澤象著羲經􅁌弧剡矢利剙黄帝蒼姬定憲其禮益詳曲臺辟雍武德𤣥武間舉漢唐制度卑陋弧矢肇於黄帝射侯見於虞書曲臺習肄辟雍舉行貞觀武徳之儀開元安福之制貍步是分虎侯是辨禮正六耦詩歌九節巾車三乏司裘五正雪鶴銜箭星麟集􅁌附枝觀體定杯水覩心平左㩜繁弱右接綦衛六鈞七規中有疊雙控無虚發始暌畫而取象終井儀以奠名六鈞用壯百中無疑和容就列省括于兹䝉輪之俊超乘如飛聽采蘋之章逞穿楊之妙工歌九夏庭列三侯立豐置福具鹿中歌貍首唐弓九合夏箭三成以祈爾爵反求諸身歌闕采蘩試可乃已簮佩儼立冕旒髙視前疊楊葉後貫㦸支連袂逢䝉比肩由基蹲甲壯基􅀭觶觀孔引滿雷碎騰淩飆疾揮弓電掣激矢風追臨廣望坐百層料武藝品驍騰流藻周施和鈴重設睨影髙鳴將超中折分馳逈場角壯永埒㨗􅂒夫之敏手促華鼓之繁節經𤣥蹄而雹散歴素支而氷裂馬射玉海卷七十五
