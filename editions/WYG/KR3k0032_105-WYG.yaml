body:
  text: 玉海卷一百五宋王應麟撰音樂樂三唐樂三十一家藝文志樂類三十一家三十八部二百五十七卷始於桓譚樂元起終於趙邪利琴叙譜失姓名九家若樂元起信都芳刪注樂書梁武帝樂社大義樂論沈重鐘律釋智匠古今樂錄李𤣥楚樂經元殷樂畧聲律指歸及論樂事推七音律譜義李守真古今樂記蕭吉樂譜集解武后樂書要錄則樂律之書也若荀朂大樂歌辭樂府歌詩謝靈運樂府集鄭譯樂府歌辭聲調蘇䕫樂府志翟子樂府歌詩三調歌辭漢魏呉晉鼔吹曲外國伎曲歴代曲名鼓吹樂章則樂曲之書也琴則有桓譚孔衍之操劉氏周氏陳懐趙邪利之譜及琴集歴頭拍簿管􅁌鐘磬則有留進之記凌秀公孫崇之志不著錄二十家九十三卷自張文收新樂書至南卓羯鼓錄有劉貺崔令欽大樂令教坊記徐景安歴代樂儀呉兢郗昂段安節樂府題解雜錄竇璡正聲樂調蕭祜無射商調譜𤣥宗金風樂琴譜則又有趙惟暕陳拙等九家而離騷譜附焉六典樂大義等三十二部一百四十三卷隋志樂社大義至黄鍾律四十二部一百四十二卷景徳二年龍圖閣經典閣樂書二百八十九卷崇文總目樂四十八部二百八十一卷自歴代樂儀至阮咸曲譜中興目六十三家四百四十卷續目二家二百二卷元魏太和十六年詔髙閭公孫崇考定雅樂景明中崇為太樂令上所調金石及書唐志崇鐘磬志二卷隋蘇䕫著樂志十五篇大唐雅樂十二和十五和新樂書武徳定樂開元三和樂禮樂志隋稍欲改作是時鄭譯牛𢎞辛彦之何妥蔡子元于普明之徒皆名知樂相與撰定依京房六十律因而六之為三百六十律以當一嵗之日又以一律為七音音為一調凡十二律為八十四調其說甚詳而終隋之丗所用者黄鍾一宫五夏二舞登歌房中等十四調而已唐興即用隋樂武徳九年正月己亥始詔太常少卿祖孝孫協律郎竇璡等定樂初隋用黄鍾一宫惟擊七鐘其五鐘設而不擊謂之啞鐘唐協律郎張文收乃依古斷竹為十二律髙祖命與孝孫吹調五鐘叩之而應由是十二鐘皆用孝孫又以十二月旋相為六十聲八十四調其法因五音生二變因變徴為正徴因變宫為清宫七音起黄鍾終南吕迭為綱紀黄鍾之律管長九寸王於中宫土半之四寸五分與清宫合五音之首也加以二變循環無間故一宫二商三角四變徴五徴六羽七變宫其聲繇濁至清為一均凡十二宫調皆正宫也正宫聲之下無復濁音故五音以宫為尊十二商調調有下聲一謂宫也十二角調調有下聲二宫商也十二徴調調有下聲三宫商角也十二羽調調有下聲四宫商角徴也十二變徴調居角音之後正徴之前十二變宫調在羽音之後清宫之前雅樂成調無出七聲本宫遞相用唯樂章則隨律定均合以笙磬節以鐘鼓既成奏之貞觀二年六月乙酉十一年張文收復請重正餘樂帝不許曰朕聞人和則樂和隋末䘮亂雖改音律而樂不和若百姓安樂金石自諧矣初孝孫已定樂乃曰大樂與天地同和也製十二和以法天之成數號為唐雅樂一曰豫和二曰順和三曰永和四曰肅和五曰雍和六曰夀和七曰太和八曰舒和九曰昭和十曰休和十一曰正和十二曰承和用於郊廟朝廷以和人神孝孫已卒張文收以為十二和之制未備乃詔有司釐定而文收考正律吕起居郎吕才叶其音聲樂曲遂備凡三十二曲自髙宗以後稍更其曲名開元定禮始復遵用孝孫十二和其著於禮者一曰豫和會要作元和以降天神二曰順和以降地祇三曰永和以降人鬼四曰肅和登歌以奠玉帛五曰雍和凡祭祀以入俎又以徹豆六曰夀和以酌獻飲福七曰太和以為行節八曰舒和以出入舞九曰昭和皇帝皇太子以舉酒十曰休和皇帝以飯以肅拜三老十一曰正和皇后受冊以行十二曰承和皇太子在其宫有會以行會要周禮旋宫之義絶亡已久莫能知之一朝復古自孝孫始藝文志張文收新樂書十二卷列傳竇璡武徳中與太常少卿祖孝孫受詔定雅樂是正鍾律舊史云璡討論故實撰正聲調一卷張文收善音律著新樂書十餘篇貞觀初召文收與祖孝孫参定雅樂文收採三禮更加釐革通典太宗留心雅正勵精文教貞觀之初命攷隋氏所傳南北之樂梁陳盡呉楚之聲周齊皆胡虜之音乃命太常卿祖孝孫正宫調起居郎吕才習音韻張文收考律吕平其散濫為之折衷漢以来郊祀明堂有夕牲迎神登歌等曲近代加祼地迎牲祼地不用樂公卿攝事又去飲福酒之樂周享神樂多以夏名宋以永名梁以雅名後周亦以夏為名隋氏因之唐以和為名開元中又造三和樂共十五和云云祴和王公升殿會訖下階履行則奏豐和享先農則奏宣和孔宣父殿齊太公廟奏之武徳元年正月十日己亥始詔祖孝孫等考正雅樂貞觀二年六月十日乙酉樂成奏之以十二律各順其月旋相為宫祭圓丘以黄鍾為宫郊廟方澤以林鍾為宫宗廟以太蔟為宫五郊朝賀饗宴則隨月用律為宫又郊廟祭享奏化康凱安之舞會要凡黄鍾㽔賔為宫其樂九變大吕林鍾為宫其樂八變太蔟夷則為宫其樂七變夹鍾南吕為宫其樂六變姑洗無射為宫其樂五變中吕應鍾為宫其樂四變天子十二終上公九終侯伯七子男五卿六大夫四士三然後樂教大備太常樂章祭先農奏豐和之舞顯慶三年郭瑜撰文宣廟奏宣和顯慶三年范頵等撰武成王廟奏宣和貞元六年于邵撰按吹律調鍾事志作髙祖會要作太宗當以志為正髙祖九年八月遜位通鑑祖孝孫斟酌南北考以古聲作唐雅樂凡八十四調三十一曲十二和會要開元八年九月瀛州司法趙慎言表請郊廟加商調去角調唐名臣奏慎言論郊廟樂合用商音周木徳金能剋木故去金唐土王望加商調去角調二舞人取品子顔容修正者充準國子習六樂學五禮號雲門生其國子諸生教以樂經同於禮傳其樂經章目雖詳稍乖㫖要望令通明博識者修撰而攽之通典同唐旋宫樂通典旋宫之樂久䘮漢章帝建初三年鮑鄴始請用之順帝陽嘉二年復廢累代皆黄鍾一均變極七音則五鐘廢而不擊謂之啞鐘祖孝孫始為旋宫之法造十二和樂合四十八曲八十四調云云凡祀昊天上帝及五方大明夜明之樂皆六成祭地祇神州社稷樂皆八成享宗廟之樂九成餘祭祀三成隋開皇初有盧賁蕭吉並撰著樂書貞觀初張文收善音律常覧蕭吉樂譜以為有未詳乃取歴代沿革截竹為十二律吹之備盡旋宫之義云云隋志蕭吉樂論一卷譜蕭吉傳有樂譜二卷唐志樂集解五代會要王朴上疏唐太宗用祖孝孫張文收考正雅樂而旋宫八十四調復見於時太宗之道與三五同功焉八十四調曲有數百今現存者九曲而已皆謂黄鍾之宫聲其餘六曲錯雜諸調盖傳習之誤也唐初雖有旋宫之樂至於用曲多與禮文相違張昭等議孝孫文收整比鄭譯寳常所均七音八十四調絲管並施鐘石俱奏七始之音復振四廂之韻皆調太樂令壁記周享神諸樂多以夏為名宋以永梁以雅後周以夏隋人因之國家以和為名祖孝孫始用旋宫法造十二和樂合三十二曲八十四調旋宫之樂漢章帝建初二年大予丞鮑鄴始請用之順帝陽嘉二年復廢之累代皆黄鍾一均變極七音則鐘廢而不撃反謂之啞鐘孝孫革其非張文收為協律依周禮以圜鍾至夷則為宫食舉隨月律為宫唐九部樂十部樂十四國樂二部樂志燕樂髙祖即位仍隋制設九部樂燕樂伎樂工舞人無變者清商伎者隋清樂也有編鐘編磬獨􅁌琴擊琴瑟秦琵琶卧箜篌筑箏節鼔皆一笙笛簫篪方響䟦膝皆二歌二人吹葉一人舞者四人并習巴渝舞西涼伎有編鐘編磬天竺伎有銅鼔羯鼓都曇鼔髙麗伎有彈箏搊箏鳯首箜篌龜兹伎有彈箏箜篌琵琶五絃設五方師子安國伎有箜篌琵琶五絃横笛疏勒伎云云康國伎云云隋樂每奏九部樂終輒奏文康樂一曰禮畢出庾亮家謂之文康樂太宗時命削去之及平髙昌收其樂有箜篌銅角一琵琶五􅁌横笛簫觱篥答臘鼔腰雞婁羯鼔皆二人舞者二人自是初有十部樂唐東夷樂有髙麗百濟二國北狄有鮮卑吐谷渾部落稽三國南蠻有扶南天竺南詔驃國四國西戎有髙昌龜兹疏勒康國安國五國凡十四國之樂而八國之伎列於十部樂中宗時百濟樂工亡散岐王為太常卿復奏置之然音伎多闕𤣥宗又分樂為二部堂下立奏謂之立部伎堂上坐奏謂之坐部伎太常閲坐部不可教者𨽻立部又不可教者乃習雅樂立部八一安舞通典云安樂二太平樂三破陣樂四慶善樂五大定樂六上元樂七聖夀樂八光聖樂安舞太平樂周隋遺音也破陣樂以下皆用大鼔雜以龜兹樂其聲震厲大定樂又加金鉦慶善舞顓用西凉舞聲頗閑雅坐部伎六一燕樂二長夀樂三天授樂四鳥歌萬嵗樂五龍池樂六小破陣樂天授鳥歌皆武后作也天授年名鳥歌有鳥䏻人言萬嵗因以制樂自長夀樂以下用龜兹舞惟龍池樂則否會要舊志並云貞觀十四年文收制景雲河清歌曰讌樂據此則隋未有燕樂而禮畢列九部之末太宗造景雲河清歌曰讌樂而去禮畢明矣志謂髙祖仍隋設九部樂燕樂樂工舞人無變者髙宗即位文收為景雲河清歌皆差齵不齊通典讌樂武徳初因隋舊制奏九部樂一讌樂二清商三西涼四扶南五髙麗六龜兹七安國八疏勒九康國會要同天志無扶南有竺貞觀十六年十一月宴百寮奏十部先是伐髙昌收其樂付太常増為十部髙昌樂用荅臘鼔至笙凡十二後魏平中原獲龜兹樂周武帝有龜兹疏勒安國康國之樂初張重華時天竺重譯致樂伎宋得髙麗百濟伎周師滅齊二國獻其樂合西涼樂凡七部謂之國伎隋文帝平陳得清樂及文康禮畢而黜百濟至煬帝大業中立清樂龜兹西涼天竺康國疏勒安國髙麗禮畢為九部平林邑獲扶南工人及其匏瑟琴陋不可用但以天竺樂傳冩其聲而不立樂部西魏始有髙昌伎隋開皇六年髙昌獻聖明樂曲唐平髙昌收其樂又造讌樂而去禮畢曲著令十部龜兹疏勒安國康國髙麗西涼髙昌讌樂清樂天竺會要隋開皇中定令置七部樂大業中為九部武徳初因隋舊制奏九部樂六典太樂令凡大燕會則設十部之伎於庭以備華夷一曰燕樂伎有景雲慶善破陣承天樂之舞二曰清樂伎三曰西涼伎四曰天竺伎五曰髙麗伎六曰龜兹伎七曰安國伎八曰疏勒伎九曰髙昌伎十曰康國伎禮志元正冬至受朝賀設九部樂則去樂縣太樂令帥九部伎立於左右延明門外太宗紀武徳四年執竇建徳六月凱旋賜前後鼓吹九部之樂實錄武徳元年十一月己酉降薛仁杲帝大悅置酒髙會奏九部樂二年二月癸巳宴羣臣五月丙寅宴涼州使人奏九部樂三年正月甲午宴突厥八月庚戌宴羣臣奏九部於庭四年三月丁酉宴西突厥使七月戊辰宴羣臣舉酒屬百官七年二月宴突厥使貞觀二年五月丙辰以麥稔宴羣臣九月壬子慶有年賜酺三日並奏九部樂貞觀十七年閏六月庚申於相思殿大饗百僚盛陳寳器奏慶善破陣樂并十部之樂薛延陀突利設再拜上夀武徳元年十月突厥使来朝帝宴太極殿奏九部樂二年閏二月甲辰考羣臣置酒三年五月庚午宴突厥使七年四月癸夘宴羣臣皆奏九部樂六月戊戌丘和謁見髙祖奏九部樂饗之八年四月己丑林邑獻方物設九部樂饗之貞觀十六年十一月乙亥還宫宴百僚奏十部樂二十一年正月己未鐵勒回紇俟利發等諸姓朝見御天成殿陳十部樂而遣之傳云帝坐秘殿陳十部樂龍朔元年沛王宅宴奏九部樂乾封元年封泰山畢宴羣臣陳九部樂四月甲辰景雲閣晏設九部樂貞元十四年二月戊午麟徳殿奏九部樂舊紀貞元四年三月甲寅宴羣臣於麟徳殿設九部樂内出舞馬上賦詩一章羣臣屬和徐景安樂書古今樂纂云隋文帝分九部伎樂以漢樂坐部為首外以陳國樂舞後庭花也西涼與清樂并龜兹五天竺國之樂並合佛曲池曲也石國百濟南蠻東夷之樂皆合野音之曲胡旋之舞也唐分九部伎樂以漢部燕樂為首外次以清樂西涼天竺髙麗龜兹安國疏勒髙昌康國合為十部俗樂之調有七宫七商七角七羽合二十八調而無徴調裴瑾為太常主簿作坐立二部伎圖劉貺太樂令壁記周官韎師掌教韎樂鞮鞻氏掌四夷之樂美徳廣之所及也後魏有婆羅曹門受龜兹琵琶於商人丗傳其業至孫妙達為北齊所重周武帝有龜兹疏勒安國康國之樂張重華時天竺重譯致樂伎後其國王為沙門来遊中土又傳其方音宋丗得髙麗百伎魏平馮䟦亦得之而未具周師滅齊二國獻其樂合西涼樂凡九部通謂之國伎隋文平陳得清樂及文康禮畢曲而黜百濟樂因為九部伎煬帝平林邑獲扶南工人及匏琴以天竺樂傳寫其聲而不齒部魏通髙昌始有髙昌伎唐太宗平髙昌收其樂又造讌樂而去禮畢曲今著令惟此十部自周隋以来管􅁌雜曲數百多用西涼樂鼔舞曲多用龜兹樂唯彈琴家猶傳楚漢舊聲及清調瑟調蔡邕雜㺯西涼樂盖後魏平沮渠氏所得也樂有鐘磬蓋涼人所傳中國之舊樂而雜以羌胡之聲也藝文志崔令欽教坊記一卷開元中教坊特盛載樂工姓氏技藝事迹唐凱樂儀衛志歴代獻㨗必有凱歌太宗平東都破宋金剛執賀魯克髙麗皆備軍容凱歌入京師然其禮儀不傳太和初有司奏凱樂用鐃吹二部将入都門鼓吹振作奏破陣樂應聖期賀朝歡君臣同慶樂等四曲至社太廟門外陳而不作告獻禮畢樂作至御樓前陳兵仗於旌門外兵部尚書介胄執鉞於旌門内中路前導協律郎執麾門外導太常卿跪請奏凱樂樂闋引俘囚出乃退吹律聽聲其術久廢請秉鉞以存體破陣樂詞咸歌破陣樂共賞太平人應聖期詞殊方歌沛澤執贄賀昇平賀朝歡詞四海皇圖泰千年徳水清君臣同慶樂詞主聖開昌厯臣忠獻大猷武徳三年七月討王世充四月竇建徳率兵十萬援世充太宗敗建徳於虎牢執之世充降六月凱旋太宗被金甲陳鐵騎一萬介士三萬前後鼔吹獻俘於太廟髙郢有凱樂賦唐功成慶善樂見樂舞類唐破陣樂見舞類貞觀十三年正月庚戌會羣臣奏慶善破陣樂薛延陀貞觀十六年来求昏十七年閏六月庚申召突利失大享奏慶善破陣盛樂及十部伎唐景雲河清歌四部燕樂承天樂景雲樂志髙宗即位景雲見河水清張文收采古誼為景雲河清歌亦名燕樂有石磬方響之類至桴鼔貝毎器工一人歌二人舞者二十人分四部一曰景雲舞二曰慶善舞三曰破陣舞四曰承天舞景雲樂舞八人慶善樂舞四人破陣樂舞四人承天樂舞四人又見舞類景雲舞元會第一奏之通典貞觀中十四年景雲見河水清協律郎張文收采古朱雁天馬之義製景雲河清歌奏之管絃為諸樂之首此樂唯景雲舞近存餘並亡坐部伎有六一讌樂張文收所作又分為四部有景雲慶善破陣承天崔邠傳故事太常始視事大閱四部樂都人縦觀唐一戎大定樂八紘同軌樂夷来賔曲志髙宗将伐髙麗龍朔元年三月丙申朔上召李勣任雅相等燕洛陽城門觀屯營教舞按親一作新征用武之勢名曰一戎大定樂舞者百四十人被五采甲持槊而舞歌者和之曰八紘同軌樂象髙麗平而天下大定也及遼東平行軍大總管李勣作夷來一作美賔之曲以獻通典云大定樂出自破陣樂又曰大定亦謂之八紘同軌樂又曰太宗平遼時作又云髙宗時造二者不同會要龍朔元年三月一日上召李勣蘇定方等燕於城門觀屯營教舞按新教之舞名之曰一戎大定樂皆新征遼東以象用舞之勢一云名戎衣大定以象平遼之功唐上元樂聖夀樂通典上元樂髙宗所造舞者八十人畫雲水備五色以象元氣聖夀樂武后所作金銅冠五色畫衣舞者百四十人行列成字十六變而畢有聖超千古道泰百王皇帝萬年寳祚彌昌長夀樂武后長夀年所造舞十二人畫衣冠天授樂武后天授年所造舞四人畫衣五綵鳳冠鳥歌萬嵗樂武后所造唐五方師子樂太平樂志燕樂龜兹伎設五方師子髙丈餘飾以方色毎師子有十二人畫衣執紅拂首加紅袜謂之師子郎趙宗儒傳守太常卿太常有五方師子樂非大朝會不作宦官領教坊者移書取之通典太平樂亦謂之五方師子舞志立部八一安舞二太平樂安舞太平樂周之遺音也太樂令壁記立部伎太平樂二亦謂五方師子舞詳見八舞景龍文館記三年晏吐蕃使於大慶殿奏五方師子太平破陣樂唐太常四部樂實錄𤣥宗先天元年八月己酉吐蕃遣使朝賀帝宴之於武徳殿設太常四部樂於庭唐開元雅樂大唐樂㑹要開元二十九年六月十九日太常奏東封泰山日所定雅樂曰元和六變以降天神順和八變以降地祇皇帝行用太和其封泰山也登歌奠玉幣用肅和迎俎用雍和酌飲福用福和送文迎武用舒和亞終獻用凱安送神用元和禪社首用順和享廟迎神用永和獻祖用光大之舞懿祖用長發之舞太祖用大政之舞丗祖用大成髙祖用大明太宗用崇徳髙宗用鈞天中宗用大和睿宗用景雲之舞撤豆用雍和之舞送神用永和之樂自有事東廵親謁九廟皆祠前數月考定音律請編入史册制曰咸韶濩夏皆以大字表樂章今宜曰大唐樂杜佑曰樂用鐘磬柷敔晉鼓節鼓琴瑟箏筑竽笙簫笛篪塤鐃鐸撫拍舂牘等謂之雅樂唯郊廟元會冬至及册命大禮則辨曲度章服而分始終之次志𤣥宗賜宴設酺亦會勤政樓太常卿引雅樂每部數十人間以胡夷之伎文宗詔馮定采開元雅樂製雲韶法曲舊志開元十三年封泰山祀天樂十四首張說作又開元七年享太廟樂章十六首張說作張說集有開元樂章十九首自迎神永和之樂至送神奉勅撰陸贄有冬至日陪位聽太和樂賦唐龍池樂聖夀樂小破陣樂光聖樂君臣相遇樂唐二部樂志明皇為平王有散樂一部定韋后之難頗有預謀者及即位命寜王主於蓬莱宫側居新聲散樂倡優之伎有諧謔而賜金帛朱紫者酸棗縣尉袁楚客上疏極諫初帝賜第隆慶坊坊南之地變為池中宗常泛舟以厭其祥帝即位作龍池樂舞者十有二人冠芙蓉冠躡履備用雅樂唯無磬通典𤣥宗所作舞七十二人又作聖夀樂以女子衣五色繡襟而舞之通典見上又作小破陣樂舞者被甲胄㑹要𤣥宗所作生於立部伎破陣樂舞四人金甲胄自長夀樂以下皆用龜兹樂舞人皆著靴又作光聖樂舞者鳥冠畫衣以歌王迹所興通典𤣥宗所作舞者八十人鳥冠五采畫衣兼似上元聖夀之容以歌王業所興安樂以後皆雷大鼔雜以龜兹樂聲振百里並立奏之其大定樂加金鉦慶善獨用西涼樂最為閑雅又分樂為二部堂下立奏謂之立部伎堂上坐奏謂之坐部伎立部八坐部六是時民間以帝自潞州還京師舉兵夜半誅韋后製夜半樂還京師樂二曲帝又作文成曲與小破陣樂更奏之太常卿韋縚奏商調君臣相遇樂曲會要開元二年閏二月詔祠龍池六月右拾遺蔡孚獻龍池篇集公卿以下百三十篇付太常考其詞合音律者為龍池樂章共錄十首十人姚元崇蔡孚沈佺期盧懐慎姜晙崔日用蘇頲李乂姜晞裴㴶等文為樂章十章文粹舊志同十六年築壇於興慶宫以仲春之月祭之又云龍池樂章十開元元年内入雅樂姚元崇等撰唐金風樂志𤣥宗金風樂一卷詳見法曲會要天寳十三載七月十日改樂曲名自太蔟宫至金風調刋石太常唐三殿觀樂樂志肅宗時山東人魏延陵得律一因李輔國獻之云太常諸樂調皆下不合黄鍾請悉更制諸鐘磬帝以為然乃悉取太常諸樂器入於禁中更加磨剡凡二十五日而成御三殿觀之以還太常然以漢律考之黄鍾乃太蔟也議者以為非是會要乾元元年三月十九日上以太常舊鐘磬五音或有差錯謂太常少卿于休烈曰比親享郊廟每聽樂聲鐘磬失度朕當於内自定太常集樂工考試二十五日一部先畢上臨三殿親觀考擊皆合五音二十八日上又於内造樂章三十一章送太常郊廟歌之唐寳應長寜樂廣平太一樂八紘同軌樂志代宗由廣平王復二京梨園供奉官劉日進製寳應長寜樂十八曲以獻皆宫調也大厯元年馬縚進廣平太一樂涼州曲本西涼所獻聲本宫調有大遍小遍貞元初樂工康崑崙寓其聲於琵琶奏於玉宸殿號玉宸宫調合諸樂則用黄鍾宫會要燕樂門大定樂亦謂之八紘同軌樂太宗平遼時作也恐太宗誤唐繼天誕聖樂定難曲順聖樂奉聖樂中和樂舞麟徳殿觀新樂志徳宗時方鎮多製樂舞以獻貞元三年四月舊紀四月庚午河東節度使馬燧獻定難樂曲御麟徳殿閲試之昭義軍節度王䖍休以徳宗誕辰未有大樂乃作繼天誕聖樂以獻貞元十二年十二月獻舊紀十二年十一月辛夘造此誕聖樂曲以獻䖍休令劉玠造此曲中和樂起於其樂以宫為調帝因作中和樂舞十四年二月山南節度使于頔又獻順聖樂曲将半而行綴皆伏一人舞於中又令女伎為八佾舞雄健壮妙號孫武順聖樂傳以孫武為孫呉會要貞元十四年二月戊午上自製中和樂舞曲百僚於麟徳殿觀新樂上製詩有八卦隨舞五音轉曲之語舊紀貞元十四年二月戊午麟徳殿宴百僚先是上製中和有樂舞曲是日奏之日晏方罷上又賦詩八韻盧照鄰中和樂九章王䖍休傳嘗得太常樂工劉玠撰繼天誕聖樂一曲因帝誕日以獻孟夏十四日其樂以宫為均示五聲有君也以土為徳本五運在中也奏二十五疊取二十四氣而成一嵗奏十六節象元凱登庸於朝云後中和樂本於此李夷簡傳始韋臯作奉聖樂于頔作順聖樂奏之軍中夷簡帥西川輒廢去以為禮樂非諸侯可擅制紀長慶元年二月乙亥觀樂於麟徳殿穆宗會要先天二年正月望夜然燈睿宗御延喜安福門樓觀樂又追作元年酺拾遺嚴挺之諫𤣥宗紀開元二年八月壬戌禁女樂唐賜樂列傳河間王孝恭賜女樂二部李晟賜女樂一列馬燧賜妓樂奉朝請渾瑊賜女樂五人唐六樂官志太常寺有四院三曰樂縣院蔵六樂之器後周天和元年十月甲子初造山雲儛以備六代樂建徳二年十月甲辰六代樂成武帝御崇信殿觀之六代大夏大䕶大武正徳武徳山雲之舞唐鄉飲大射樂㑹要鄉飲樂章十七鹿鳴三奏南陔一奏嘉魚四奏崇丘一奏關雎五奏鵲巢三奏大射樂章四皇帝射騶虞二奏王公射貍首一奏迎送皇帝入閤奏太和唐樂書要錄元萬頃傳為著作郎武后諷帝召諸儒論撰禁中萬頃與范履冰苗神客周思茂胡楚賔與選凡撰列女傳臣軌百僚新誡樂書等九千餘篇志武后樂書要錄十卷唐古今樂記陳古今樂錄志釋智匠古今樂錄十三卷漢班超傳注太平御覧引之李守真古今樂記八卷中興書目古今樂錄十三卷陳光大二年僧智匠撰起漢迄陳隋志十二卷後周王朴上疏曰宣示古今樂録唐大樂令壁記唐志劉貺三卷協律郎書目三卷上卷樂元歌一詩二舞三抃四律吕五中卷正樂雅樂六立部伎七坐部伎八清樂九西涼樂十下卷四夷樂東夷十一南蠻十二西戎十三北狄十四散樂十五樂量十六陳儀十七興廢十八序曰魏明帝曰禮樂之作所以類物表庸不忘其本凡音樂以舞為主自黄帝雲門而下至周文武其官皆號太樂以總領諸物昔者泰帝始造五十絃瑟盖樂量之始也伶倫採嶰谷之竹以為管盖律吕之初也其詳無得言焉而咸池之樂始乎黄帝則樂已備矣漢制氏以知聲律善造鐘丗在太樂明帝改大予以應䜟文徒改其名而曲度仍舊魏杜夔為太樂令專總魏樂晉泰始五年荀朂典樂始黜䕫制使郭夏宋識造二舞阮咸以非新律見斥元康三年詔朂子籓嗣其事東晉省大樂鼓吹官頗得登歌食舉之樂明帝令阮孚等増益之成帝咸和中復太樂以戴綏為令鳩集遺逸而未有金石也冉閔誅羯樂人頗有歸晉謝尚因之以具鐘磬時郊廟雖有歌詞竟不設樂太元中破苻堅得其樂工始備四廂金石宋始復郊廟之樂建平王宏造二舞元嘉九年鍾宗之為太樂令史調以金石十四年治書令史奚縦又改之二十八年南郊始制登歌孝建二年始用舞江南之樂梁丗為盛後魏得慕容氏樂天興元年令鄧淵修之孝文太和六年議郊祀之禮以公孫崇為太樂令史與中書監髙閭共定音律宣武正始初詔八座已下集太樂考異同命太常劉芳専掌其事永平三年成二舞登歌鼔吹諸曲詔可其二舞而已普泰中張乾龜為太樂令與太常祖瑩討論鐘石劉芳舊樂淪缺無能言者孝武以崔九龍為太樂令纂集舊曲齊周庾信邢邵改制郊廟歌詩長孫紹逺斛斯徴等参正音律隋牛宏為太常祖孝孫為協律平陳獲樂官蔡子元于普明等共定雅樂稍備於前唐貞觀之初十有餘載勵精文教合考隋氏所傳南北之樂以梁陳盡呉楚之聲周齊皆北鄙之音乃命太常祖孝孫正宫調起居郎吕才習音韻協律郎張文收考律吕作降神之樂象功之舞則天下靡然向風周大司樂樂官之長也漢太樂令司歌奏之儀平鈞金石魏晉以下其職皆同今採之記傳以考廢興唐歴代樂儀新纂樂書志徐景安歴代樂儀三十卷崇文目同中興書目新纂樂書唐協律郎徐景安撰共三十篇一名歴代樂儀自一至十述聲律器譜自十一至三十述祀樂之儀一律吕相生二聲音成樂三五音旋宫四歴代樂名五雅俗二部六八部樂器七歌舞服飾八四縣設樂九祀祭樂節十樂章文譜十一郊天雅樂儀十二祀昊天上帝十三大享明堂十四祀青帝十五赤帝十六黄帝十七白帝十八黒帝十九朝日二十夕月二十一祀風師二十二祀雨師二十三祭皇地祇二十四祭神州二十五祭社稷二十六享宗廟二十七釋奠文宣王二十八武成王二十九正至朝賀三十臨軒冊命樂章文譜曰樂章者聲詩也章明其情而詩言其志文譜樂句也文以形聲而句以局言五音合數而樂未成文按旋宫以明均律迭生二變方協七音乃以變徴之聲循環正徴復以變宫之律迴演清宫其變徴以變字為文其變宫以均字為譜唯清之一字生自正宫倍應聲同終歸一律雅樂成調無出七聲七聲者宫商角變徴羽均清合宫聲也法自旋宫一均聲矣如以律音倫比咸施於十二均文譜傳聲備顯於八十四調後周正樂十二順雅樂八十四調崇文目大周正樂一百二十卷通鑑顯徳五年十一月庚戌敕竇儼集通禮正樂先是四年九月儼上疏請討論禮儀考正鍾律中興書目大周正樂八十八卷周顯徳間中書舎人竇儼撰儼承詔訂論歴代樂名樂儀樂議樂音樂圖樂章樂器樂曲及夷樂之名甚備按儼末卷論叙云詔編樂書敘論譜記凡八十四卷象八十四調新曲譜三十六卷合前為十二帙象期之數今書八十四卷具存曲譜惟有黄鍾大吕四卷餘皆缺竇儼傳丗宗患雅樂陵替詔儼兼太常與樞宻王朴作律凖儼編古今樂事為正樂成一百二十卷藏史閣會要顯徳六年正月王朴上疏曰唐太常博士殷盈孫鑄鎛鐘十二編鐘二百四十處士蕭承訓校定石磬今在懸者是也梁唐晉漢僅有七聲作黄鍾之宫一調其餘八十三調於是泯絶宜示古今樂録令臣討論遂作律凖十三絃用七聲為均均有七調聲有十二均合八十四調所補雅樂旋宫八十四調并所定尺所吹黄鍾管所作律凖並上進詔百官詳議依新法教習廣順元年八月太常卿邉蔚奏改十二成為十二順二舞名為崇徳象成建隆新定樂舞會要建隆元年二月五日有司上言請改樂名詔恭依令權判太常寺竇儼撰進四月四日癸酉竇儼上新定二舞十二樂曲名樂章三月兼判太常寺竇儼上言三王之興禮樂不相沿襲洪惟聖宋肇建皇極一代之樂宜乎立名禋享宴會樂章固當易以新詞式遵舊典即詔儼改周樂文舞崇徳之舞為文徳之舞武舞象成之舞為武功之舞改樂十二順為十二安盖取治丗之音安以樂之義祭天為髙安祭地為靜安宗廟為理安天地宗廟登歌為嘉安皇帝臨軒為隆安王公出入為正安皇帝食飲為和安皇帝受朝皇后入宫為順安皇太子軒懸出入為良安正冬朝會為永安郊廟俎入為豐安祭享酌獻飲福受胙為禧安祭文宣王武成王同用永安藉田先農用靜安共一十二曲各新定名夏四月癸酉詔儼所定付有司行之一本云五月四日壬寅儼復請僖祖室奏大善之舞順祖奏大寧翼祖奏大順宣祖奏大慶並從之乾徳雅樂文武舞詳見舞門建隆十二安樂章曲名乾徳黄鍾九寸管建隆重造十二律管王朴律準新式廟舞乾徳元年閏十二月二十七日翰林學士承㫖陶糓上祀感生帝樂章曲名降神用大安大尉行用保安奠玉幣用慶安司徒奉俎用咸安酌獻用崇安飲福用廣安亞獻用文安送神用普安四年冬十月辛酉朔詔太常寺自今大朝會復用二舞先是晉天福末兵戈擾攘中原多故禮樂之器浸以淪廢上始命判太常寺和峴講求修復之别造宫懸三十六簴設於庭登歌兩架設於殿上又置鼓吹十二案及舞人所執旌纛干戚籥翟等與其服皆如舊制云十一月癸巳冬至帝御乾元殿受朝賀畢羣臣詣大明殿行上夀之禮始用雅樂登歌二舞先是上以雅樂聲高近於哀思命判太常寺和峴討論其理峴上疏曰十二月聲含在寂黙古聖設法演而出之先立尺寸作為律吕三分損益上下相生取合其音謂之形器但以尺寸長短非書可傳故累秬黍求其準的後代試之或不符合臣謂西京銅望臬可校古法即今司天臺影表上銅臬下石尺是也取王朴所定尺校之短於石尺四分志云以王朴所定律吕之尺較西京銅望臬古制石尺短四分樂聲之髙盖由於此夫影表能測天地律管所宜準繩上乃詔依古法别造新尺并黄鍾九寸之管使工人校其聲果下於朴所定管一律又内出上黨羊頭山秬黍累尺校律亦相符合復下尚書省集議衆皆僉同遂重造十二律管以取聲由是雅樂音始和暢十一月癸巳日南至上御乾元殿受朝畢常服御大明殿羣臣上夀初用雅樂登歌及文徳武功二舞酒五行而罷實錄乾元殿受朝賀用雅樂禮畢上夀乾徳元年九月詔開封府選樂工八百三十人隷太常習樂将行郊祀之禮丙寅大宴廣政殿始作樂六年十月二十七日和峴奏郊祀畢車駕初入奏采茨之曲御樓禮畢還宫奏隆安之樂從之淳化朝元殿雅樂歌見元會三年元日正月丙申朔朝賀畢御朝元殿羣臣上夀復用宫縣二舞登歌五瑞曲和㠓請作四瑞樂章從之先是二年正月㠓言来嵗正會之儀登歌五瑞曲已改製則二舞亦當更名於是更為化成天下威加海内之舞太宗萬國朝天樂平晉樂雅樂譜見舞類祥符龍圖閣太宗聖製曲名祥符六年四月己卯十九日詔以太宗聖製曲名三百九十詔輔臣於龍圖閣宣示及九絃琴五絃阮譜字變絃法調弄操引名共三百三十六付史館太樂局并以太宗製萬國朝天樂曲同和之舞平晉樂曲定功之舞及御製二曲樂章令郊廟祭享参用之會要告饗太廟用萬國朝天之曲亞終獻用平安真宗御製又仁宗御製三曲志亞終獻並用平晉樂御撰凡四十句景徳樂纂崇政殿觀太常新樂樂譜景徳二年八月丁丑朔一本云八月一日殿中侍御史監祭使艾仲孺言毎監祠祭太常樂器多損音律不調郊禋在近望遣使修飾志云仲孺請修飾樂器調正音律乃命翰林李宗諤及左諌議張秉判寺令内臣監修樂器後復以龍圖閣待制戚綸判寺一作倫一云同判寺及宫苑使劉承珪等修之乃命大樂鼓吹兩局工較其優劣黜去濫吹者五十餘人宗諤因編錄律吕法度樂器名數名曰樂纂又裁定兩局工人試補條式及肄習程課三年八月四日樂成甲戌宗諤綸引太常樂工詣崇政殿設宫懸作新習雅樂上召親王輔臣列侍以觀宗諤執樂譜立御前承㫖先以鐘磬按律凖次令登歌鐘鼔塤篪琴阮笙簫笛等各兩色合奏箏瑟筑三色合奏迭為一曲復擊鎛鐘為六變九變之樂又為朝元上夀之樂及文武二舞鼓吹為警夜六周之曲又令樂工單仲辛唱八十四調自是樂府制度頓有倫理自是月再課試詔賜宗諤等器幣帝謂王旦曰曲詞非雅及郊祀五時饗廟朝正御殿樂章乃大周曲並命兩制分撰肄習大樂同和所以崇徳化俗感人神之應三年八月辛未朔詔夏至祭地至祀五帝凡十四祭並用樂奉常自竇儼和峴考正而後訖真宗時詔宗諤幹之然樂聲太髙異於中景祐審肄猶以尺度未便或者緩下亦非至論繄聖人製聲依律得於天賦功大樂備非治平不能舉也宗諤傳云素曉音律著樂纂以獻命付史館自是月再課試大祀則按閲宰相臨視祥符宫縣樂乾徳四年六月判太常和峴請重造宫縣三十六簴設於庭登歌兩架設於殿中十月辛酉朔又置鼓吹十二按開寳九年四月有司言準令宗廟殿庭宫縣三十簴郊社二十簴殿庭加鼔吹十二案開寳四年郊祀誤用宗廟之數詔圜丘増十六簴祥符七年六月辛酉七日詔玉清昭應景靈宫行禮宫懸樂並用三十六簴欽奉真猷載嚴恭館竦熊羆之四列儼金石之九成景靈宫以庭狭止用二十簴天聖承明殿閲大樂九年四月乙巳一本二十九日上御承明殿閲大樂賜樂工錢帛有差先是太常寺以景徳中嘗躬按大樂其後頗多増製故請臨觀焉天聖樂書總要書目補亡樂書總要三卷天聖中房庶撰上卷審樂正當世之非中下卷說樂辨先儒之誤庶曰知樂者由今之器寄古之聲去惉滯歸中和則感人心導和氣不曰治世之音乎景祐登歌樂元年十一月辛亥詔曰樂以諧五降之節導三靈之和其令太常自今享先農釋奠文宣武成王並用登歌樂學士院撰樂章景祐樂本圖古今樂纂景祐二年二月庚申直史館宋祁上大樂圖二卷四月庚午詔博訪知音有洞曉古今雅樂制作及音律得失灰管測􅀱之法所在薦聞将校試之何文廣上古今樂纂六卷樂纂造律一卷樂府秘訣一卷樂府雜錄一卷安宋上樂本圖并奏議一卷七月鄭向言阮逸撰琴準律管十三著論十二篇律吕說一篇庚子召逸八月己巳命集賢校理李照同修樂書三年九月丁亥學士丁度等言奉詔詳定鄧保信阮逸胡瑗所造黍尺律管權量鐘磬及安宋何文廣所進樂本圖樂纂録秘訣於鐘律制度别無可采隨州言進士蘓齊有舊蔵樂書應天旋宫昭慶集十二卷并樂圖景祐樂髓新經律志仁宗著樂髓新經凡六篇志一卷言七宗一變及管分陰陽倍析清濁歸於本律次及間聲合古今之樂参之以六壬遁甲其一釋十二均二明所主事三辨音聲四明律吕相生祭天地宗廟配律吕陰陽之數五著十二管短長六出度量衡辨古今尺謝賜景祐新經状云題名均律下傃八風推本陰陽仰符七緯包龜兹之重譯合御覧之還宫祭享類分黍絫堅定掲量衡之成法考金石之中聲煥若發凡森然復貫又表云由子及午辨位六同自駟得鶉正名七列討中華之餘韻會秘式之經躔案以旋宫配乎苾祀推阮隃之管象較上黨之黍圍度量惟精金石乃定爰表新書之號俾資廣内之傳宗子充已作雅樂圖樂曲以獻景祐廣樂記樂髓新經御製雅樂聲譜郊廟樂章大樂圖崇政殿觀新樂延福宫閲樂器元年十月壬午命燕肅李照宋祁同按試律準二年四月戊寅命翰學馮元集賢校理聶冠卿直史館宋祁同修樂書内御製樂章樂曲六十八及七均十二律曲八十四令太常肄習有司因請刻石八月己巳命李照同修樂書三年六月九日丙辰以新修樂書為景祐廣樂記丙寅鄧保信上所製樂尺并籥且言其法本漢志可用合律度量衡詔元冠卿祁較定七月戊子元等上景祐廣樂記八十一卷己丑遷秩有差先是元年八月二十三日判太常寺燕肅建言金石不調願以周丗王朴律準更加考按詔集賢校理李照博士直史館宋祁及中人李隨共領其事明年二年二月戊午金石一部成御延福宫臨閲奏郊廟五十一曲一云正月乙夘肅等言考騐凖與太常寺鐘聲並合詔後苑按試一云燕肅上考定樂器實錄云御延福宫觀大樂因問照以樂果調否對曰金石之音與王朴律準已協然朴凖比古樂差髙五律比禁坊胡部髙二律願制管以調度帝曰試為之乃取京縣秬黍累尺成律鑄鐘審之其聲猶高更用太府寺布帛尺為法實比古尺一尺二寸有奇以潞州所上羊頭山秬黍擇大者縦累之檢考長短尺成與太府尺合乃堅定下太常四律於是詔内東門供奉官鄧保信與照監視羣工改作金石命聶冠卿檢閲典實佐其興作丞相府總領焉凡所改作皆閲相府以聞别詔臣元臣冠卿臣祁討論樂理為一代之典帝乃親製雅樂聲譜及郊廟樂章二十一曲裁成頌體告於神明詔丞相吕夷簡等分造樂章参施羣祀上又新製景祐樂髓新經凡六篇書目二卷二年八月丁丑以賜羣臣第一釋十二均第二明所主事第三辨音聲第四圖律吕相生并祭天地宗廟所用律及陰陽數配第五論十二管長短第六論歴代量權衡皆本之於陰陽配之於四時建之於日辰通之於鞮竺演之於壬式遁甲之法以授樂府以考正聲以賜羣臣焉初照改造金石所用程員凡七百一十四起五月止九月成實錄止八月照自造笙竽琴琶篳篥等十二種詔但存笙竽金石具七懸焉至鼔吹十二按悉修飾令冠卿等作景祐大樂圖二十篇以載鎔金鑪石之法歴代八音諸器異同之状新舊律管之差崇文目有景祐大樂圖二十卷宋祁大樂圖義二卷見後一本二年九月二十九日上又雜論七篇實錄二年七月癸巳御崇政殿召輔臣觀樂一本云六月十九日辛未八月己巳又御崇政觀新樂上製雙鳯管丁丒出御製樂髓新經賜羣臣九月丁酉照保信以新樂成進秩自監董而下至工徒遷補賚賜有差凡七百餘人照更造新器所定黄鍾律聲極下韻中無射倍聲壬寅獻新樂於崇政殿召輔臣觀焉實錄云御崇政殿召輔臣按鼓吹新樂十一月乙未有事南郊以新樂及聖製與諸臣樂章用之照造鍾律姚仲孫馮元交言其妄三年二月丙辰詔元與阮逸胡瑗較定新書鍾律三月乙未崇政殿召輔臣觀新定鍾律逸瑗言照樂穿鑿再令造律五年五月十九日右司諫韓琦言今兹郊祀不可用照非古之樂其和峴減定王朴舊樂見存可用詔資政大學士宋綬中丞晏殊同兩制詳定綬等言新樂比舊下三律無所考據七月丙辰詔南郊仍用和峴舊樂照所造勿復用䨇鳯管南儀琴十八絃琴皆不用十一月庚戌郊祀改五年為寳元慶厯五年十一月二十一日宋祁言先與馮元等同修樂書照改作鐘磬尋以不協而廢樂書一朝大典宜刪去照樂事一節増未備事跡辛丒命翰學張方平侍讀學士宋祁再修廣樂記㸔詳刪潤六祁傳云撰廣樂記十五卷藝文志景祐廣樂記八十一卷馮元宋祁等撰孫奭撰樂記圖上自景祐初博訪知音通古之士討論雅樂制度歴代沿革考正音器作為新書成一朝之典景祐樂府奏議書目樂府奏議一卷胡瑗集景祐間修制律吕鐘磬積黍之法皇祐樂府奏議一卷瑗撰景祐間承詔制樂後以樂實樂舞樂聲之制條列上之樂書五卷呉良輔撰釋聲律音器四門總四十四篇篇釋其事總論其法上之樂紀三十六卷良輔撰起太昊迄隋開皇諸樂故事歌曲共三十六卷第二十五卷缺古今大樂指掌三卷李南玉編制度之得失樂要三卷令狐揆撰凡二十四篇上卷九篇論聲律度量之制中卷九篇論樂器樂音沿革之法下卷六篇論胡部樂器相生吉凶之理景祐太樂圖義宋祁推本前人六律五聲八音七均之說及三大禘所用之樂古今宫懸升歌之異上列為圖後詁其義并今樂局闕典所當釐補者更為雜論七篇附焉總目曰大樂圖義析其卷為上下惟歌舞於律吕差逺故不著於篇序曰至樂之作本乎天理藏於人心天理難乎象見故推數以成律吕人心易以物假故探和以寫金石聖人之制作也以律吕造夫婦之端宫商合君臣之宜塤箎寄伯仲之睦琴瑟懐志義之恩舞綴以勸勞逸宫軒以等貴賤非為娱於耳目取玩於性情十二律圖十二律詁義五聲位圖詁義八音位圖器屬詁義十二律七均詁義十二律子聲十二律管空徑升歌詁義論引武舞所執九器各有所用論别撰郊廟歌曲明述祖宗積累之業論太樂局雷鼓靈鼔路鼔備而不擊及無三鼗論有舂牘之名而無舂牘之器論竽及巢和笙論精選太常樂工及募能知音者備太常官屬論以尺定律景祐二年九月二十九日己酉上并雜論一篇會要翰林承㫖得象詳定言祁所撰圖義訂正今古辭約義暢崇文目大樂圖義二卷藝文志景祐大樂圖二十卷宋祁大樂圖二卷康定御撰審樂要紀見御製書目二卷康定元年製志云要紀二卷御集有審樂要記四卷樂府要畧三卷樂髓新經二卷皇祐崇政殿閲雅樂御撰明堂樂曲音譜大樂新錄二年九月三日丁亥帝服靴袍御崇政殿召近臣宗室館閣臺諫官閲雅樂自宫懸登歌舞佾之奏凡九十一曲徧作之因出太宗皇帝琴阮譜及御撰明堂樂曲音譜并按習大樂新錄賜羣臣又出御製頌塤匏笙洞簫仍令登歌以八音諸器各奏一曲遂召鼔吹按警塲賜太樂鼔吹令丞至樂工緡錢因謂輔臣曰作樂崇徳薦之上帝以配祖考今将有事於明堂然世鮮知音其令太常益加講求於是内出改制樂名及御撰鼓吹警嚴合宫歌一闋亦下太常肄習又詔鎛鐘特磬未協音律令鄧保信阮逸盧昭序同太常詳典禮别鑄李胡再定而皆不用郊廟依舊用王朴樂辛亥大饗明堂赦文有六樂具修之語皇祐大安樂秘閣定大樂二年閏十一月丁巳十二日詔曰古者作樂以薦上帝配祖考三五之盛不相沿襲然必太平始克明備周武受命至成王時周公始大合樂以和邦國漢初亦沿舊樂至武帝時始定泰一后土樂詩光武中興至明帝時始改大予之名唐髙祖造邦至太宗時孝孫文收始定鍾律明皇方成唐樂國初亦循用王朴竇儼所定周樂太祖患其聲髙遂令和峴減下一律真宗始出聖意大祠用樂又議隨月轉律之法屢加按覈然念樂經久墜學者罕傳歴古研覃亦未就緒頃者博加訪求終未有知聲知經可信之人嘗為改更未適兹意宜委中書門下集兩制及太常禮樂官以天地五方神州日月宗廟社稷祭享所用登歌宫懸審更定奪聲律是非按古合今調諧中和使經久可用以發揚祖宗之功徳云先是羣臣上議故有是詔丁卯詔置局秘閣詳定大樂庚午王堯臣等乞借髙若訥所校十五等古尺従之皇祐三年三月甲午詔令兩制及禮官参稽典制定國朝大樂名七月九日丁巳翰林承㫖王堯臣言按太常天地宗廟四時祠祀樂曲凡八十九曲自景安而下七十五章率以安名曲豈特本道徳政教嘉靖之羙亦緣神祇祖考安樂之故上議國朝樂宜名曰大安詔曰古先哲王隨丗立樂必有名稱故韶以紹堯夏以承舜濩以救民武以象伐國家紹膺顯緒表裏禔福舉隊正失典章咸備獨斯體大而有司莫敢易言之朕閔然念兹列聖之休未能昭掲于天下之聽是用申敕執事逺求博講而考定其衷今禮官學士逮三事之臣同寅一辭以大安之義来復且謂藝祖之勘定暴亂安天下之未安其功大二宗之致太平安天下之既安其徳盛洎朕之承聖烈安祖宗之安其仁厚祗覧所議熟復于懐共惟神徳之造基神功之戢武章聖恢清靜之治冲人䝉成定之業雖因丗之迹亦異而靖民之道同歸以之播鐘球文羽籥用諸郊廟告於神明曰大且安誠得其正恭依先是二月二十一日詔曰朕聞至樂之大統和天人奮雷先聞萬物蠢若聖人觀象於豫以崇薦配百代之興咸有制作眇觀載籍旁採緯諜詠功象徳率著號榮顓嚳題根英之文陶虞紀明紹之羙三王殊憲稱謂炳焉降及後丗鮮克遵尚惟東漢命以大予開元自云唐樂雖摭古未逺而雅於言道希風咸夏朕所慕焉故前詔執事訪圖博議将以立度出均考音正律謹權審量修器協舞以定本朝之述作用章祖考之謨烈夫名生於義義出乎實名正言順然後事成而禮樂興焉庶㡬光輝永畀来裔其令兩制及禮官参稽典制議定國朝大樂名中書門下審加詳閲稱朕意焉皇祐紫宸殿奏新樂新樂圖記二年九月丁亥上御崇政殿閲雅樂謂輔臣曰作樂崇徳薦之上帝以配祖考今将有事明堂其令太常益講求之十一月乙酉召太子中舎致仕胡瑗赴大樂所同定鐘磬制度晁氏志皇祐樂記三卷胡瑗等撰瑗同阮逸等二十餘人再定言者以鎛鐘特磬大小未合古制詔令改作閏十一月丁卯詔中書門下集兩制及太常官置局秘閣詳定大樂五年四月甲午命劉沆梁適監議大樂四年二月庚寅益州進士試校書郎房庶上律吕旋相圖志房庶補亡樂書三卷庶字次元而胡瑗阮逸制樂已有定議止以圖送詳定所推恩而遣之先是三年十二月甲辰以庶為校書郎命上圖六月乙酉直秘閣范鎮上書曰陛下制樂三年有司之論紛然未决由不識其本而爭其末也樂者和氣也發和氣者聲音而聲音生于無形古人以有形之物傳其法然後無形之聲音得有形者秬黍也律也尺也龠鬴斛筭數權衡鐘磬也十者必相合然後為得今皆相戾許慎云秠一稃二米今秬黍一米云云今方定雅樂願令有司人人各議合為一書請罷詳定修制二局俟真黍至然後為樂詔送詳定所又論於執政以為庶自言其法依古以律而起尺此至真之法也鎮自謂得古法然集賢校理司馬光數與論難以為弗合丗鮮鍾律學莫辯其是非十二月壬辰召兩府侍臣觀新樂于紫宸殿凡鎛鐘十二特磬十二詔以圖送中書議者以鍾之形制未中律度斤而不用復詔近侍詳定五年四月乙未王洙奏欲以皇祐中黍尺為法鑄大吕應鍾鐘磬各一従之六月乙亥七日御紫宸殿奏太常寺新定大安之樂召輔臣至省府館閣官預觀之仍觀宗廟祭器賜詳定官器幣有差八月乙卯詔南郊且用舊樂其新定大安樂常祀及朝會用之學士胡宿言自古無並用二樂之理書稱同律今舊樂髙新樂下相去一律難以並用九月乙酉十九日御崇政殿召近臣宗室臺諫省府官觀新樂及新作晉鼔三牲鼎鸞刀以補禮器之闕古者黄鍾為萬事本故度量權衡皆起于黄鍾至晉隋間累黍為尺而制律容受卒不能合及平陳得古樂遂用之唐因之以制樂猶不失于古五代王朴始用尺定律而聲器俱失太祖以其聲髙減一律至是又減半律然太常樂比唐聲猶高五律比于燕樂高三律失之于以尺生律也先是鐘磬之音未合古法詔中書門下集兩制太常禮官與知鍾律者攷定久不決乃命諸家各作鍾律以獻親臨視之李照阮逸改鑄鐘磬䖏士徐復笑之曰聖人寓器以聲不先求其聲而更其器其可用乎嘉祐元年范鎮言自用新樂以来衆異並至乞且用舊樂以俟異時制作丁丑二十八日詔太常恭謝用舊樂書目皇祐新樂圖記三卷二年阮逸胡瑗撰逸瑗承詔改議鐘磬律度量衡鼓鼎鸞刀之制修定制度各圖形範為之記元豐新樂大樂記元豐三年五月戊辰六日詔秘書監劉几乗驛赴詳定禮文所議樂六月九日庚子同判太常寺王存乞召范鎮與凡参考得失従之二十一日命知禮院楊傑同議大樂従劉几請也二十八日己未几言祀明堂樂章字與樂曲聲數多少不同宜遵用御撰樂章委本局依律吕七均之法審定音聲又請依古法具四清聲従之七月二十七日范鎮乞求訪真黍以審音樂八月五日几請依景祐例制大樂器十五日乙巳楊傑言先于去年上大樂十二均圖未䝉施行請審調太常鐘琯依典禮用十二律還宫均法令上下曉知十二律音則鄭聲無由亂雅矣劉几等言傑所請可行従之十八日戊申太常博士呉雍議樂劉几等言太常大樂鐘磬凡三等王朴樂一也李照樂二也胡瑗阮逸樂三也王朴樂其聲太髙李照乃下律法以取黄鍾之聲人疑其太重照改定大樂下王朴樂三律由是不用皇祐中胡阮再定樂比王朴樂㣲下而聲律相近及鑄大鐘成或疑其聲弇鬱因亦不用於是郊廟依舊用王朴樂臣請下王朴二律以定中和之聲就太常鐘磬擇其可用者用之不可用者别製従之廿六日丙辰詔備王朴鐘為清聲毋得銷毁九月二十六日乙酉罷議樂修樂局九月辛巳大享明堂用新樂五年十二月丁巳新作大樂成六年正月丁丑朔受朝用新樂初范鎮與劉几定樂鎮曰定樂當先正律上曰然雖有師曠之聰不以六律不能正五音鎮作律尺龠合升斗豆區鬴斛欲圖上之又乞求真黍以定黄鍾而劉几即用李照樂加用四清聲而奏樂成詔罷局賜賚有加鎮曰此劉几樂也臣何與焉楊傑以前後奏議所承詔㫖編為元豐新修大樂記三卷又以元祐樂議七篇附卷末書目又有沈括樂論一卷論古今律吕樂器制度之得失元祐范鎮樂延祐殿觀新樂元祐樂議端明殿學士范鎮請太府銅為新樂逾年成鎮皇祐中論律尺之法又與司馬光論難凡數萬言自以為獨得于心元祐三年閏十二月二日甲辰京西都監楊安道管押鎮所定鑄成律十二編鐘十二鎛鐘一尺一斛一響石為編磬十二特磬一簫笛塤篪巢笙和笙各二較李照樂下一律有奇并書及圖法上進鎮集有樂書三卷書目有新定樂法一卷晁氏志鎮樂書一卷詔送太常参定仍令従臣御史館職赴太常觀聽翼日賜詔嘉奨據本傳云哲宗御延和殿召執政同􅀚音紀三年閏十二月甲辰詔百官􅀚新樂詔云審聲知以律生尺方詔學士大夫論其法工師有司考其聲鎮撰樂章三章黄鍾宫曲進呈皇帝作大成樂之太皇太后萬夀廟進獻祖文明進表云太祖患今樂太髙特諭和峴令減一律仁宗深詔執事考求至當李照改定新樂又下二律臣預聞論議研精極慮二十餘年乃知樂法非是聲終不合神宗留意制作召臣訪以樂事盖法已失于千載之後聲欲求於千載之前兹為至難理若有待上考周官下稽漢志較景祐中李照所定又下一律有竒求之古法無以易此庶幾祖考来格神人以和論鐘云清聲不見於經惟小胥註云鐘磬者編次之二八十六枚而在一簴謂之堵至唐又有十二清聲其聲愈髙國朝舊有清聲置而弗用至劉几用之與鄭衛無異樂書論律黍尺量鐘磬八音論聲器之失十二律吕損益容受圖旋相圖度量鐘磬書目云鎮取舊樂書去其牴牾各為之論又列十二律容受損益旋相之數與鐘聲大小厚薄之法度量之制上之楊傑言鎮有元祐新定樂法與樂局所議不同竊縁其樂先經仁宗制作後經神考睿斷奏之郊廟朝廷久矣不可用鎮一家之説而遽改遂撰成元祐樂議七篇議樂章議秬秠議量議鐘議聲器議宫懸加磬議十六鐘磬禮部太常亦言鎮樂法自係一家之樂與見行樂制不同遂置不用而樂仍舊制四年正月十三日詔講筵官觀新樂二十六日詔館閣官赴太常寺聽范鎮雅樂元符二年正月二十七日詔前信州司法吳良輔太常寺按雅樂三月二十二日詔修定樂章崇寧大晟樂崇寜三年正月二十九日魏漢津言請三指為法均絃裁管為一代樂従之本朝大樂由建隆迄崇寜凡六改和峴李照阮逸劉几范鎮魏漢津律詳見類四年八月二十六日庚寅崇政殿奏新樂詔曰廼者得隠逸之士于草茅之賤獲英莖之器于受命之邦時端州上古銅器有樂鐘適時之宜以身為度鑄鼎以起律因律以制器按協於庭八音克諧宜賜名曰大晟舊樂更不行用九月朔大慶殿稱慶大觀元年五月九日甲午詔令大晟府頒新樂於天下置大晟府設大司樂一員典樂一員三年五月十二日詔賜宴辟雍用雅樂四年八月一日御製大晟樂記政和三年五月二十九日御崇政殿按燕樂三十日詔頒之天下八月大晟府奏増入徴角二調及土石匏三音詔頒天下六年閏正月九日大晟府編集燕樂八十四調并圖譜令劉炳撰文七年二月十一日賜髙麗雅樂大晟府撰樂府譜辭乃賜樂譜宣和四年臣僚言一嵗凡一百一十八祀作樂者六十二所用樂章五百六十九二年二月依月律撰燕樂詞八十四調大觀三年六月劉炳上樂書二十卷論八篇五聲八音七均十二律八十四調度量權衡二舞各有圖序并􅀱氣軍律教樂運譜四議共二十卷上之刋印頒四方書目卷同晁氏志大晟樂府雅樂圖一卷政和中建大晟府起黄鍾于上躬之中指棄塞古今諸儒異同之論此其譜也崇寜陳暘樂書二年九月六日壬午何執中奏禮部郎陳暘撰樂書二百卷欲加優奨靖國初給筆札冩進暘欲考定中聲更乞送講議司施行遷暘一秩暘樂書首采禮記諸經言樂處為訓義次取成周至本朝事為之圖論又有正誤一卷暘兄祥道為禮書並行于丗楊萬里序曰逺自唐虞三代近逮漢唐本朝上自六經下逮子史百氏内自王制外逮戎索網羅放失貫綜煩悉放鄭而一之雅引今而復之古味其論玩其圖忽乎先王金鐘天球之音鏘如于左右也粲乎前代鷺羽玉戚之容躍如于前後也彭几進樂書論五音云本朝以火徳王而羽音不禁徴調尚闕劉詵亦上徴聲大觀二年三月三十日詔自唐以來世無徴角之音劉詵所上徴聲令大晟府同教坊依譜按習仍増徴角二譜政和二年八月二十八日曹棐撰徴調舜韶新曲命為大晟府制撰呉仁傑樂舞新書二卷凡二十六篇紹興射殿奏新樂見鐘類朝會樂十六年十月二日御射殿召輔臣觀新製郊廟禮器侍従臺諌管軍宗室兩省禮官館閣皆預命作朝會樂次作宫懸樂紹興化成殿樂二十七年十月乙巳十三日經筵讀三朝寳訓終篇賜宴皇城司用化成殿等樂賜香茶慶元樂書元年五月十七日布衣姜䕫進鼔瑟制度樂書三卷送太常㸔詳雷出地奮豫先王以作樂崇徳樂之出虚盖本陰陽之氣自無而生有故因器而成聲禘有樂而嘗無樂因雷之收發聖人作樂以養情性育人材事神祇和上下䕫典樂教胄子周大司樂教國子弟孔子亦曰興於詩成於樂所以養中和之徳救氣質之偏也有舜之徳不可無䕫之音以發之有䕫之樂不可無舜之徳以充之音起於聲聲出於情知此則知先王作樂之本矣后䕫所制有瞽所頌大司樂所掌工人巧士肄業修聲周雅各得其所虞韶無相奪倫頌猗那羙於鑠求器得耕野之尺吹律有聽鳯之簫展詩會舞應律合節玉海卷一百五
