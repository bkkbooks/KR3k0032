body:
  text: 玉海卷六十五宋王應麟撰詔令律令釋名律累也累人心使不得放肆也令領也理領之使不得相犯也唐虞制令臯陶法律黄帝李法見兵法淮南子神農無制令而民從唐虞有制令而無刑罰汜論訓黄帝治天下法令明而不闇管子黄帝治天下置法而不變堯之治也善明法察令而已漢張敏傳建初中上疏曰駁經侮法孔子垂經典臯陶造法律原其本意皆欲禁民為非注史游急就篇曰臯陶造獄法律存也劉向曰今之刑非臯陶之法也而有司請定法削則削筆則筆左𫝊夏書曰昬墨賊殺臯陶之刑也風俗通臯陶謨虞始造律國語展禽曰堯能單均刑法以儀民舜之命官先播榖次敷教而後及於刑葢有以養民之身善民之心不獲已乃置刑焉欽恤者聖人用刑之心明允者聖人用刑之法夏政典見政要類科條禹法隋志書述唐虞之世五刑有服夏后氏正刑有五科條三千左傳晉叔向曰夏有亂政而作禹刑法言唐虞象刑惟明夏后肉辟三千不膠者卓矣吕刑穆王訓夏贖刑注穆王訓暢夏禹贖刑之法更從輕疏夏法行於前代廢已久矣今復訓暢夏禹贖刑之法以周法傷重更從輕以布告天下尚書大傳夏刑三千條見唐長孫無忌律疏序荀子君道篇禹之法猶存而夏不世王得其人則存法者治之端君子者法之原有君子則法雖省足以徧矣湯四方獻令湯令周書王會篇伊尹朝獻商書湯問伊尹曰其為四方獻令伊尹受命於是為四方令曰臣請正東符婁仇州伊慮漚深九夷十蠻越漚鬋髪文身請令以魚支之鞞鮚鰂之醤鮫𤭔利劒為獻正南甌鄧桂國損子産里百濮九菌請令以珠璣瑇瑁象齒文犀翠羽菌鶴短狗為獻正西崑崙狗國􅀑親枳已闟耳貫胷雕題雜丘漆齒請令以丹青白旄紕𦋺江歴珠名龍角神龜為獻正北空同大夏莎車姑他旦畧貌胡戎翟匈奴樓煩月氏􅏽犂其龍東胡請令以橐駞白玉野馬騊駼駃騠良弓為獻湯曰善後漢西南夷傳注引周書伊尹為四方獻令曰正西昆侖狗國云云請令以丹青白旄紕𦋺龍角神龜為獻湯曰善帝王紀湯令未命之為士者車不得朱軒及有飛軫不得乗飾車駢馬衣文繡命然後得以順有徳左𫝊叔向曰商有亂政而作湯刑注言不能議事以制殷刑書康誥王曰外事汝陳時臬司師兹殷罰有倫疏外土以獄事上於州牧之官為奉王事汝當用刑書為布陳是刑法為司牧其衆故受而聴之既衛居殷墟又周承於殷後刑書相因故兼用其有理者謂當時刑書或無正條而殷有故事可兼用若今律無條求故事之比也王曰汝陳時臬事罰蔽殷彛注陳是法事其刑罰斷獄用殷家常法謂典刑故事君陳殷民在辟予曰辟爾惟勿辟予曰宥爾惟勿宥惟厥中周士八成五戒箕子八條秋官大司㓂凡諸侯之獄訟以邦典定之六典大夫之獄訟以邦法斷之八法庶民之獄訟以邦成弊之注八成也罪所不貸有一定之法故曰成以官成待萬民之治若今時决事比也士師下大夫四人掌士之八成曰邦汋邦賊邦諜犯邦令撟邦令為邦盗邦朋邦誣注鄭司農云八成者行事有八篇若今時决事比以五戒先後刑罰注先後猶左右也毋使罪麗于民一曰誓用於軍旅二曰誥用於會同注誓誥於書則甘誓湯誓大誥康誥之屬三曰禁用諸田役四曰糾用諸國中五曰憲用諸都鄙禁則軍禮曰無千軍無自後射此其類也漢地理志殷道衰箕子去之朝鮮教民以禮義樂浪朝鮮民犯禁八條相殺以當時償相傷以榖償相盗者沒入為其家奴婢欲自贖者人五十萬雖免為民俗猶羞之是以民不相盗無門户之閉今犯禁寖多至六十餘條可貴哉仁賢之化也注師古曰八條不具見周盟書秋官大司㓂凡邦之大盟約涖其盟書而登之天府大史内史司會及六官皆受其貳而蔵之司盟下士二人掌盟載之法凡邦國有疑會同則掌其盟約之載及其禮儀北面詔明神既盟則貳之注詔之者讀載書以告之貳者寫副以授六官左𫝊周之宗盟異姓為後隠十一年展喜曰周公太公股肱周室夾輔成王勞之而賜之盟曰世世子孫無相害也載在盟府太師職之僖二十六年平王賜騂旄之盟踐土載書蔵在周府周刑書見後三法管子七法三王法令秋官司刑中士二人掌五刑之法以麗萬民之罪墨罪五百劓罪五百宫罪五百刖罪五百殺罪五百若司冦斷獄弊訟則以五刑之法詔刑罰而以辨罪之輕重注書𫝊云云此二千五百罪之目畧也其刑書則亡夏刑大辟二百臏辟三百宫辟五百劓墨各千周則變焉所謂世輕世重詔刑罰者處其所應不如今律家所署法大司㓂縣刑象之法小司㓂正嵗帥屬觀刑象令以木鐸令羣士乃宣布於四方憲刑禁士師之五禁杜子春曰憲謂幡書以明之士師下大夫四人以木鐸徇于朝書而縣於門閭正嵗憲禁令于國及郊野訝士中士八人讀誓禁布憲中士三人下士四人掌憲邦之刑禁正月之吉執旌節宣令於四方管子七法第六注謂則象法化决塞心術計數此七法之目也任法第四十五堯之法也善明法禁之令而已黄帝之治也置法而不變使民安其法者也周書曰國法法不一則有國者不祥民不道法則不祥國更立法以典民則祥生法者君也守法者臣也法於法者民也漢晁錯𫝊對策曰三王為法令合於人情而後行之晉志汝南王亮奏周縣象魏之書漢詠畫一之法熊逺奏曰周建象魏之制周六約秋官司約下士二人約於妙反言語之約束掌邦國及萬民之約劑治神之約為上謂命祀郊社羣望祖宗治民征税遷移仇讐既和治地經界田莱治功王功國功之屬賞爵所及治器禮樂吉凶車服治摯之約次之玉帛禽鳥大約劑邦國書宗彛小約劑萬民書丹圖注此六約者諸侯以下至於民皆有焉治者理其相抵冐上下之差也六官初受盟約之貳周三法秋官司刺下士二人掌三刺訊羣臣羣吏萬民三宥不識過失遺亡三赦幼弱老旄憃愚之法以贊司㓂聴獄訟以此三法者求民情斷民中而施上服下服之罪疏由用三法故斷民得中小司㓂以三刺斷庶民獄訟之中春官内史執國法及國令之貳以考政事逆會計注國法六典八法八則夏官都司馬以國法掌其政學周律周文王法周法楚僕區法唐韓仲良傳武徳初建言周律其屬三千秦漢後約為五百管子周鄭之禮移則周律廢矣左傳昭七年楚芋尹無宇曰周文王之法曰有亡荒閲所以得天下也吾先君文王作僕區之法曰盗所隠器與盗同罪所以封汝也注有亡人當大蒐其衆僕區刑書服䖍云隠匿亡人之法張斐律序曰鄭鑄刑書晉作執秩楚造僕區趙制國律漢志儒家周法九篇法天地立百官公羊傳文九年云繼文王之體守文王之法度注文王始受命制法度周頌儀式刑文王之典維清緝熙文王之典周圜土嘉石肺石秋官大司㓂以圜土聚教罷民注鄭司農云圜圜上也今獄城圜疏東方主規規主仁恩凡斷獄以仁恩求出之故圜也凡害人者置之圜土而施職事焉以明刑恥之其能改者反於中國不齒三年其不能改而出圜土者殺以兩造禁民訟入束矢於朝然後聴之注矢取其直一弓百矢束矢其百个與詩其直如矢泮水詩束矢其搜以兩劑禁民獄入鈞金三日取其堅乃致於朝然後聴之以嘉石平罷民注嘉石文石也疏嘉善也有文乃稱嘉欲使罷民思其文理以改悔自修樹之外朝門左凡萬民之有罪過而未麗於法而害於州里者桎梏而坐諸嘉石役諸司空重罪旬有三日坐朞役其次九日坐九月役其次七日坐七月役其次五日坐五月役其下罪三日坐三月役使州里任之則宥而舍之以肺石逹窮民注肺石赤石也肺屬南方火火色赤故肺石是赤石也使之赤心不妄告凡逺近惸獨老幼之欲有復于上而其長弗逹者立於肺石三日士聴其辭以告於上而罪其長朝士掌建邦外朝之法左嘉石平罷民右肺石逹窮民焉司圜中士六人下士十二人掌收教罷民任之以事注若今時罰作圜士所收教者過失害人已麗于法者周九刑禮司刑注其刑二千五百罪之目畧也其刑書則亡夏刑云云周則變焉所謂刑罰世輕世重疏夏刑據吕刑而言夏刑三千墨劓俱千至周減輕刑入重刑俱五百是夏刑輕周刑重案文十八年史克云周公制禮曰云云在九刑不㤀鄭注堯典云正刑五加之流宥鞭朴贖刑此之謂九刑賈服以正刑一加之以八議昭六年云周有亂政而作九刑而云周公作者鄭志云三辟之興皆在叔世世末政衰隨時自造刑書不合大中故叔向譏之作刑書必重其事以聖人之號神其書耳九刑之名是叔世所作假言周公其實非周公也掌戮注罪二千五百條上附下附五刑而已曲禮刑不上大夫注其犯法則在八議輕重不在刑書周用人法書周官注言周家設官分職用人之法疏周禮每官言人之員數及職所掌立其定法授與成王成王即政之初即有淮夷叛未暇以立官之意號令羣臣今既滅淮夷天下清泰故以周家設官分職用人之法以詔羣臣使知立官之大㫖也甫刑金選品漢蕭望之𫝊張敞曰甫刑之罰小過赦薄罪贖有金選之品所從来久矣注應劭曰選音刷金銖兩之名也師古曰字本作鋝即鍰也説文鋝鍰也其重一十銖二十五分銖之十三一曰重六兩吕刑曰墨辟疑赦其罰百鍰劓辟疑赦其罰唯倍剕辟疑赦其罰倍差宫辟疑赦其罰六百鍰大辟疑赦其罰千鍰是其品也史記黥疑赦其罪百率注徐廣曰率即鍰也孔安國曰六兩曰鍰黄鐵也禮秋官疏夏侯歐陽説墨罰疑赦其罪百率古以六兩為率鄭𤣥以為古之率多作鍰鄭刑書竹刑晉刑鼎楚憲今左𫝊昭六年三月鄭鑄刑書鑄於鼎以為國之常法叔向詔子産書曰先王議事以制不為刑辟夏有亂政而作禹刑商有亂政而作湯刑周有亂政而作九刑三辟之興皆叔世也今吾子制參辟鑄刑書將以靖民不亦難乎正義采取上世决事之比作書以為後法九刑葢周公别為此名故稱之定九年駟顓殺鄧析而用其竹刑注鄧析造刑罰書於竹簡劉向曰簡法也久逺無其書襄九年宋使樂遄庀刑器注刑書疏載於器物昭二十九年冬晉趙鞅荀寅賦晉國一鼔鐵以鑄刑鼎遂著范宣子所為刑書焉仲尼曰晉其亡乎失其度矣夫晉國將守唐叔之所受法度以經緯其民卿大夫以序守之民是以能尊其貴貴是以能守其業文公作執秩之官為被廬之法僖二十七年文公蒐于被廬修唐叔之法以為盟主今棄是度而為刑鼎民在鼎矣何以尊貴史楚懐王使屈原造為憲令魏安陵君曰手受大府之憲憲之上篇曰云云秦漢舊律令甲魏李悝法經諸儒章句晉志秦漢舊律其文起自魏文侯師李悝撰次諸國法著法經李悝作法蕭何造律以為王者之政莫急於盗賊故其律始於盗賊盗賊劾捕故著囚捕二篇其輕狡越城博戲假借不廉淫侈踰制為雜律一篇又以其律具其加減具律令之名例律也是故所著六篇而已然皆罪名之制也商君受之以相秦漢承秦制蕭何定律除參夷連坐之罪增部主見知之條益事律興廐戸三篇三篇總謂之事律合為九篇蕭何傳先入收秦丞相御史律令圗書蔵之叔孫通益律所不及傍章十八篇張湯越宫律二十七篇趙禹朝律六篇又漢時决事集為令甲以下三百餘篇及司徒鮑昱撰嫁娶辭訟决為法比都目凡九百六卷世有増損率皆集類為篇結事為章一章之中或事過数十事類雖同輕重乖異而通條連句上下相蒙雖大體異篇實相探入盗律有賊傷之例賊律有盗章之文興律有上獄之法廐律有逮捕之事若此之比錯揉無常後人生意各有章句叔孫宣郭令卿馬融鄭𤣥諸儒十有餘家家數十萬言凡斷罪所當由用者合二萬六千二百七十二條七百七十三萬二百餘言言數益繁覧者益難天子魏明帝於是下詔但得用鄭氏章句不得雜用餘家范曄曰律謝臯蘇而法令亟易漢律令三章律九章除挾書律律經律法高紀元年十一月召諸縣豪傑曰父老苦秦苛法久矣誹謗者族耦語者棄市吾與諸侯約先入闗者王之吾當王闗中與父老約法三章耳殺人者死傷人及盗抵罪餘悉除去秦法吏民皆按堵如故初順民心作三章之約天下既定命蕭何次律令惠紀四年三月甲子省法令妨吏民者除挾書律高后紀元年正月除妖言令文紀又史記表大事記元年十二月盡除收帑相坐律令二年五月除誹謗律五年除錢律民得鑄錢十三年除肉刑及田租税律戌卒令五月除肉刑六月除田租用晁錯募民戌邊之策不必勞平民更戌也景紀中六年十二月定鑄錢偽黄金律宣紀本始四年四月壬寅詔曰律令有可蠲除以安百姓條奏元康二年夏五月詔曰獄者萬民之命今用法或持巧心析律貳端深淺不平增辭飾非以成其罪奏不如實二千石各察官屬吏務平法地節四年令甲文頴注蕭何承秦法所作為律令律經是也元紀見宣帝所用多文法吏以刑名繩下注師古云劉向别録云申子學號刑名以名責實尊君卑臣崇上抑下宣帝好觀其君臣篇初元五年四月省刑罰七十餘事除光禄大夫以下至郎中保父母同産之令刑法志漢興初入闗約法三章蠲除煩苛兆民大説其後四夷未附兵革未息三章之法不足以禦姦於是蕭何攈摭秦法取其宜於時者作律九章孝武事外四夷内盛耳目之好調發煩數百姓貧耗窮民犯法酷吏擊斷姦軌不勝於是招進張湯趙禹之屬條定法令作見知故縱監臨部主之法緩深故之罪急縱出之誅其後姦猾巧法轉相比况禁㒺寖宻律令凡三百五十九章大辟四百九條千八百八十二事死罪决事比萬三千四百七十二事文書盈於几閣典者不能徧睹郡國承用者駁或罪同而論異姦吏因縁為市所欲活則傅生議所欲䧟則與死比議者咸寃傷之宣帝時路温舒上疏云云鄭昌上疏言不若刪定律令律令一定愚民知所避姦吏無所弄矣今不正其本而置廷平以理其末宣帝未及修正元帝初立詔曰律令煩多不約自典文者不能分明其議律令可蠲除輕减者條奏惟在便安萬姓而已至成帝河平中復下詔曰今大辟之刑千有餘條律令煩多百有餘萬言竒請他比日以益滋其與中二千石二千石博士及明習律令者議減死刑及可蠲除約省者令較然易知條奏有司無仲山父将明之才徒鉤摭細㣲毛舉數事以塞詔而已必世而未仁百年而不勝殘宜惟思清原正本之論刪定律令纂二百章以應大辟其餘罪次於古當生今觸死者皆可募行肉刑及傷人與盗受賕滛亂皆復古刑為三千章詆欺文致㣲細之法悉蠲除則刑可畏而禁易避班固之言謂刑本不正清酷吏傳序法令者治之具而非制治濁之原也蓺文志小學蕭何草律亦著其法曰太史試學童能諷書九千字以上乃得為史禮志禮儀與律令同録臧於理官法家又復不𫝊功臣表蕭何定諸侯法令列傳蕭何収秦丞相御史律令圖書蔵之蕭何為法講若畫一曹參代之守而勿失張蒼吹律調樂人之音聲及以比律令若百工天下作程品注師古曰言吹律調音以定法令及百工程品皆取則也賈誼文帝諸律令所更定其説皆自誼發之文翁選小吏詣京師學律令鼂錯所更令三十章諸侯皆讙譁錯言冝削諸侯事及法令可更定者凡三十篇孝文不盡聽景帝即位以錯為内史法令多所更定錯曰令法律賤商人尊農夫張湯遷太中大夫與趙禹共定諸律令務在深文拘守職之吏通鑑綱目元光五年七月詔太中大夫張湯中大夫趙禹定律令律趙禹曰前王所是著為後王所是疏為令杜周客謂周曰君不循三尺法周曰三尺安在哉前王所是著為律後王所是疏為令當時為是何古之法乎子延年明法律主父偃上書闕下朝奏暮召入見所言九事其八事為律令兒寛以古法義决疑獄葢寛饒封事曰儒術不行以法律為詩書嚴延年學法律丞相府丙吉治律令孔光明習漢制及法令淮陽王欽好法律朱博傳太守漢吏奉三尺律令以從事耳三尺律令人事出其中掾史試與正監共撰前世决事吏議難知者數十事持以問廷尉薛宣傳廷尉以為律曰云云揚雄曰甫刑靡敝秦法酷烈聖漢權制而蕭何造律冝也造蕭何律於唐虞之世則誖矣鹽鐡論文學曰秦法繁於秋荼而網宻於凝脂方今律令百有餘篇文章繁罪名重郡國用之疑惑或淺或深自吏明習者不知所處而况愚民乎律令塵蠧於棧閣吏不能徧覩陳寵𫝊聖漢初興改從簡易蕭何草律季秋論囚俱避立春之月而不計天地之正二王之春實頗有違崔寔𫝊政論曰蕭何作九章之律有夷三族令云云謂之具五刑文帝除肉刑景帝元年下詔乃定律減笞輕捶梁統𫝊疏曰元哀二帝輕殊死之刑以一百二十三事自是以後著為常凖故人輕犯法吏易殺人高帝受命誅暴約令定律文帝唯除省肉刑相坐之法哀平繼體丞相王嘉輕為穿鑿虧除先帝舊約成律表其尤害於體者傅奏晉志光武中興梁統乃上疏曰臣切見元帝初元五年輕殊死刑三十四事哀帝建平元年盡四年輕殊死刑八十一事丞相王嘉等虧除先帝舊約穿令斷律凡百餘事其四十二事手殺人皆減死罪一等著為常法自是以後人輕犯法吏易殺人通監建武十四年梁統上疏願詔有司詳擇定不易之典事下公卿杜林奏宜如舊制統復上言臣之所奏非曰嚴刑經曰爰制百姓于刑之衷衷之為言不輕不重之謂也刑輕反生大患惠加姦軌害及良善事寝不報郭躬𫝊永平中以明法律召入議元和三年為廷尉多所矜恕乃條諸重文可從輕者四十一事奏之事皆施行著於令郎顗𫝊陽嘉二年正月對曰文帝改法除肉刑之罪至今適三百載宜因斯際大蠲法令官名稱號輿服器械事有所更王者之法譬猶江河當使易避而難犯和帝紀永元十二年三月丙申詔曰巧法析律節文増辭貨行於言罪成乎手朕甚病焉宋志治書御史漢東京使明法律者為之天下讞疑事以法律當是非禮司刑注詔刑罰者處其所應不如今律家所書法小宰注憲謂表懸之若今新有法令高紀注孟康曰漢律吏二千石有予告有賜告文紀注文穎曰漢律三人以上無故羣飲罰金四兩如淳曰律説郡吏今督郵是也諸侯王表注張晏曰律鄭氏説封諸侯過限曰附益周禮秋官疏先鄭舉漢賊律云長孫無忌律疏序魏文侯師李悝集諸國刑典造法經六篇一盗法二賊法三因一作囚法四捕請法五雜法六具法商鞅𫝊受改法經為律漢相蕭何更加李悝所造戸興厩三篇謂之九章之律魏因漢律為一十八篇改漢具律為刑名第一晉命賈充等増損漢魏為二十篇於魏刑名律中分為法例律宋齊梁及後魏因而不改北齊併刑名法例為名例後周復為刑名隋因北齊更為名例唐承不改名者五刑之罪名例者五刑之體例命諸篇之刑名比諸篇之法例故以名例為首篇名冠十二篇之首隋志商君書五卷漢章程高紀天下既定命張蒼定章程注如淳曰章歴數之章術章閏法也程者權衡斗甬丈尺之平法師古曰程法式瓚曰茂陵書丞相為工用程數張蒼傳蒼為計相時緒正律歴吹律調樂入之音聲及以比定律令若百工天下作程品大事記載於高帝七年冬十月定禮儀之後至為丞相卒就之孝文四年正月甲午為相叙𫝊北平志古司秦柱下定漢章程律度之緒詩魯頌疏章程謂定百工用材多少之量及制度之程品唐魏徴曰孝宣以章程練名實漢興以来法令漢法定籍九法志畧舉漢興以来法令稍定合古便今者高后元年正月除三族罪祅言令孝文二年除父母妻子同産相坐及収法高帝七年景中五年九月詔獄疑者讞之後元年正月又詔定讞法近於五罰三宥之意後三年著令老弱朱儒皆頌繫宣元康四年正月詔年八十非誣告殺傷人它皆勿坐成鴻嘉元年定令年未滿七嵗賊鬬殺人及犯殊死者上請廷尉以聞得減死合於三赦幼弱老眊之人此皆法令稍定近古便民者也叙𫝊漢章九法太宗改作輕重之差世有定籍後漢元初四年選通儒讐校漢家法令漢著令紀文帝元年三月養老具為令師古曰使備為條制景帝元年七月詔曰吏所監臨以飲食免重受財物賤買貴賣論輕廷尉與丞相更議著令後三年著令年八十以上八嵗以下頌繫成帝著令令太子得絶馳道哀帝元夀二年九月詔有司無得陳赦前事定著令平帝元始四年正月婦女老弱無得繫定著令吳芮𫝊高帝制詔御史長沙王忠其定著令著於甲令稱忠韋元成𫝊高后時患臣下妄非議先帝宗廟寢園官故定著令元帝蠲除此令成帝又復擅議宗廟之命馮野王𫝊杜欽奏記曰三最予告令也二千石賜告得歸有故事不得去郡亡著令史記平凖書著令令封君以下以差出牝馬太常著功令著廷尉挈令並見後霍去病𫝊定令令票騎將軍秩禄與大將軍等薛宣傳以令奏尹賞與薛恭換縣後紀肅宗著胎養令定律著令助三正之㣲順帝永建四年詔宦官襲封爵定著令郭躬𫝊元和三年躬條重文可從輕者四十一事著于令郎顗𫝊陽嘉二年正月顗條便宜七事漢興以来三百三十九嵗於時三朞宜大蠲法令有所變更王者之法猶江河當使易避難犯風俗通曰律者法也臯陶謨虞始造律時主所制曰令漢書著甲令漢令甲令乙令丙宣紀地節四年九月詔曰令甲死者不可復生刑者不可復息此先帝所重而吏未稱注文頴曰蕭何承秦法所作為律今律經是也天子詔所増損不在律上者為令令甲前帝第一令也如淳曰令有先後故有令甲令乙令丙師古曰甲乙若令苐一苐二篇耳甲者令篇之次吳芮𫝊贊著于甲令而稱忠史記長沙王著令甲稱其忠叙𫝊景紀述務在農桑著於甲令民用寜康賈誼新書天子之言曰令令甲乙是也後厯志令甲第六常符漏品章紀元和元年七月丁未詔曰令丙箠長短有數景帝定箠令皇后紀論向使因設外戚之禁編置甲令注前書音義甲令者前帝苐一令也晉志漢時决事集為令甲以下三百餘篇張釋之𫝊注引乙令蹕先至而犯者罰金四兩江充𫝊注引令乙騎乗車馬行馳道中沒入車馬哀紀名田注引令甲諸侯在國名田他縣罰金二兩平紀顧山錢注令甲女子犯罪作如徒六月顧山遣歸光武紀女徒顧山注引前書音義令甲易先甲後甲注甲者創制之令疏漢謂令之重者謂甲令漢酎金律後禮儀志八月飲酎注丁孚漢儀曰酎金律文帝所加以正月旦作酒八月成名酎酒因令諸侯助祭貢金漢律金布令曰皇帝齊宿親帥羣臣承祠宗廟羣臣冝分奉諸侯列侯各以民口數率千口奉金四兩竒不滿千口至五百口亦四兩皆會酎少府受入大鴻臚食邑九真交阯日南折用犀角二長九寸以上若玳瑁甲一鬱林用象牙一長三尺以上若翡翠各二十凖以當金音義武帝時因八月嘗酎令諸侯出金助祭所謂酎金也左傳晉有嘗酎漢儀注諸侯王畿臣戸口酎黄金於漢廟武紀元鼎五年九月列侯坐獻黄金酎祭宗廟不如法奪爵者百六人志曰飲酎少府省金附諸侯王表武作左官之律設益之法王子侯表地節四年襄隄侯聖坐酧金斤八兩少四兩免五鳯四年朝侯固城坐酎金少四兩免恩澤侯表魏相子𢎞丙吉子顯甘露元年坐酎宗廟騎至司馬門不敬削爵趙廣漢𫝊丞相奉齋酎入廟祠漢田租税律田令史記大事記孝文十三年除田租税律貢禹傳上書曰除其租銖之律注師古曰租税之法皆依田畆不得雜計百物之銖兩後黄香𫝊延光元年遷魏郡守郡有内外園田與人分種香曰田令商者不農王制仕者不耕伐氷食禄之人不與百姓爭利乃悉以賦人課令耕種秦彭𫝊稻田三品條式見田制漢定箠令刑法志漢文帝即位十三年五月除肉刑外有輕刑之名内實殺人斬右趾者又當死斬左趾者笞五百當劓者笞三百率多死景帝元年下詔曰加笞與重罪無異幸而不死不可為人其定律笞五百曰三百笞三百曰二百猶尚不全至中六年又下詔曰加笞者或至死而笞未畢朕甚憐之其減笞三百曰二百笞二百曰一百曰笞者所以教之也其定箠令丞相劉舍御史大夫衛綰請笞者箠長五尺其本大一寸其竹也末薄半寸平其節當笞者笞臀毋得更人畢一罪乃更人自是笞者得全景紀中六年五月詔有司減笞法定箠令元年冬十月詔曰孝文除誹謗去肉刑後紀章帝元和元年七月丁未詔律云掠者唯得榜笞立又令丙箠長短有數漢挈令光禄挈令廷尉挈令張湯𫝊為廷尉時上方鄉文學湯决大獄欲傅古義乃請博士弟子治尚書春秋補廷尉史平亭疑法奏讞疑必奏先為上分别其原上所是受而著讞法廷尉挈令揚主之明注師古曰挈獄訟之要也書於讞法挈令以為後式也韋昭曰在板挈也應劭傳廷尉板令駁唐志刑法類有廷尉决事事雜詔書燕王旦𫝊又將軍都郎羽林道上移蹕太官先置注張晏曰都試郎羽林也師古曰都大也謂大會試之漢光禄挈令諸當試者不㑹都所免之説文𤭔樂浪挈令織徐鉉曰挈令葢律令之書也溝洫志元鼎六年上曰令内史稻田租挈重不與郡同注師古曰租挈收田租之約令也漢水令公令兒寛傳寛表奏開六輔渠定水令以廣溉田收租賦税時裁闊狹與民相假貸注師古曰用水之次具立法令皆得其所也召信臣𫝊遷南陽大守躬勸農耕信臣為民作均水約束刻石立於田畔以防分爭何並傳注如淳曰公令吏死官得法賻漢功令詔書律令儒林𫝊公孫𢎞為學官元朔五年六月悼道之鬱滯廼請曰丞相御史言制曰道民以禮風之以樂㛰姻居室之大倫也今禮廢樂崩朕甚愍焉故詳延天下方聞之士咸登諸朝其令禮官勸學講藝洽聞舉遺典禮以為天下先太常議與博士弟子崇鄉黨之化以厲賢才焉謹與太常孔臧博士平等議請因舊官而興焉為博士置弟子五十人復其身太常擇民年十八以上儀狀端正者補博士弟子郡國縣道邑有好文學敬長上肅政教順鄉里出入不悖所聞令相長丞上屬所二千石二千石謹擇可者常與計偕詣太常得受業如弟子此郡國所擇也詔書既曰崇鄉黨之化則太常所補不過取諸闗中而已一嵗輒課能通一藝以上補文學掌故缺其高第可以為郎中太常籍奏有秀才異等輒以名聞非常選也其不事學若下材及不能通一藝輒罷之而請能稱者臣謹按詔書律令下者明天人分際通古今之誼文章爾雅訓辭深厚恩施甚美小吏淺聞弗能究宣亡以明布諭下以治禮掌故以文學禮義為官遷留滯請選擇其秩比二百石以上及吏百石通一藝以上補左右内史大行卒史比百石以下補郡太守卒史皆各二人邊郡一人先用誦多者不足擇掌故以補中二千石屬文學掌故補郡屬備員請著功令它如律令制曰可自此以来公鄉大夫士吏彬彬多文學之士矣注師古曰功令新立此條請以著於功令功令篇名若今選舉令史記太史公曰余讀功令至於廣厲學官之路未嘗不廢書而嘆也索隠曰謂學者課功著之於令即今之學令是也蕭望之𫝊治齊詩以令詣太常受業如淳引二千石奏上與計偕云云匡衡傳射策甲科不應令漢養老令馬復令見養老及馬政類漢諸姬令秩禄令文紀注臣瓚引秩禄令及茂陵書姬並内官秩比二千石史記吕后紀注同茂陵書禄秩令此二書亡失不得過江明此瓚是晉中朝人疑是傅瓚漢宮衛令張釋之𫝊釋之為公車令劾太子梁王不下司馬門注如淳曰宮衛令諸出入殿門公車司馬門皆下不如令罰金四兩葢寛饒𫝊為衛司馬案舊令遂揖官屬以下行衛者衛尉私使寛饒出寛饒以令詣官府門上謁辭漢六條九條百官表武帝元封五年初置部刺史掌奉詔條察州秩六百石員十三人注師古曰漢官典職儀云刺史班宣周行郡國省察治狀黜陟能否斷治寃獄以六條問事非條所問即不省一條强宗豪右田宅踰制以强凌弱以衆暴寡二條二千石不奉詔書遵承典制倍公向私旁詔牟利浸漁百姓聚歛為姦三條二千石不恤疑獄風厲殺人怒則任刑喜則任賞煩擾刻暴剥截黎元為百姓所疾山崩石裂天祥訛言四條二千石選署不平茍阿所愛蔽賢寵頑五條二千石子弟怙恃榮勢請託所盗六條二千石違公下比阿附豪强通行貨賄割損政令也唐六典惠帝三年舊儀作六年相國奏御史監三輔不法事詞訟盗賊鑄偽錢獄不直繇賦不平吏不廉苛刻踰侈及弩力十石以上作非所當服凡九條鮑宣𫝊遷豫州牧代二千石書史聴訟所察過詔條注出六條之外翟方進𫝊遷朔方刺史所察應條輒舉薛宣𫝊成帝初言陰陽不和咎在部刺史不循守條職注六條宋百官志刺史班行六條詔書漢决事比律三家漢憲令刑法志武帝招張湯趙禹之屬條定法令死罪决事比萬三千四百七十二事朱博傳遷廷尉令掾吏試與正監共撰前事决事吏議難知者數十事持以問廷尉為平處其輕重十中八九官屬咸服博之疏畧材過人也後漢陳寵𫝊和帝永元六年代郭躬為廷尉寵鈎校律令條法溢於甫刑者除之曰臣聞禮經三百威儀三千故甫刑大辟二百五刑之屬三千禮之所去刑之所取失禮則入刑相為表裏者也今律令死刑六百一十耐罪一千六百九十八贖罪以下二千六百八十一溢於甫刑者千九百八十九其四百一十大辟千五百耐罪七十九贖罪春秋保乾圖曰王者三百年一蠲法漢興以来三百二年憲令稍増科條無限又律有三家其説各異宜令三公廷尉平定律令應經合義者可使大辟二百而耐罪二千八百共為三千悉刪除其餘令與禮相應以易萬人視聴以致刑措之美傳之無窮未及施行及寵免後遂寝而苛法稍繁人不堪之寵子忠畧依寵意奏上二十三條為决事比以省請讞之弊又上除蠶室刑解臧吏三世禁錮狂易殺人得减重論母子兄弟相代死聴赦所代者事皆施行桓譚傳世祖時因上疏陳時政所冝又見法令决事輕重不齊或一事殊法同罪易論今可令通理義明習法律者較定科比一其法度班下郡國蠲除故條如此天下知方而獄無寃濫矣書奏不省晉志章帝時陳寵上疏曰唐堯著典曰流宥五刑𤯝災肆赦舜命臯陶以五宅三居惟明克允文王重易六爻而列叢棘之聴周公作立政戒成王勿誤庶獄冝蕩滌煩苛輕薄箠楚以濟羣生帝納寵言永元六年寵代郭躬為廷尉復校律令刑法溢於甫刑者奏除之忠依寵意奏上三十三條為决事比餘同漢傳禮大司㓂庶民獄訟以邦成弊之注鄭司農云若今時决事比也士師八成注若决事比唐志有廷尉决事二十卷駁事十一卷漢尉律昭紀更賦注如淳曰尉律卒踐更一月説文序尉律學僮十七已上始試諷籕書九千字乃得為吏以八體試之郡移太史並課最者以為尚書史書或不正輙舉劾之今雖有尉律不課小學徐鍇曰尉律漢律篇名功臣表靳亭高成孝文後三年坐事國人過律免漢金布令錢律見錢幣蕭望之𫝊金布令甲曰邊郡數被兵離饑寒天絶天命父子相失令天下共給其費注師古曰金布者令篇名也其上有府庫金錢布帛之事因以名篇令甲者其篇甲乙之次高紀八年十一月臣瓉注引金布令師古曰金布者令篇名若今言倉庫令也後漢禮儀志八月飲酎注亦引漢律金布令晉志魏司空陳羣等采漢律為魏法序畧引金布律詳見後漢任子令哀紀綏和二年六月初除任子令及誹謗詆欺法注應劭曰任子令者漢儀注吏二千石以上視事滿三年得任同産若子一人為郎不以徳選故除之王吉傳宣帝時上疏今俗吏得任子弟率多驕驁不通古今宜明選求賢除任子之令注子弟以父兄任為郎父任若張安世蘇武劉向汲黯蕭育兄任若霍光爰盎楊惲族父任若侯覇宗家任若周陽由漢法十家藝文志李子三十二篇名悝相魏文侯富國强兵商君二十九篇名鞅相秦孝公申子六篇名不害相韓昭侯處子九篇史記趙有處子慎子四十二篇名到韓子五十五篇名非游棣子一篇晁錯三十一篇燕十事十篇不知作者法家言二篇右法十家二百一十七篇法家者流葢出於理官信賞必罰以輔禮制隋志六部合七十二卷漢建武律令故事唐藝文志漢建武律令故事三卷隋志三卷漢名臣奏二十九卷廷尉决事二十卷廷尉駮事十一卷廷尉雜詔書二十六卷南臺奏事二十二卷應劭漢朝議駮三十卷陳夀漢名臣奏事三十卷建武二年五月詔民欲歸父母者敢拘執論如律三月議省刑法三年七月詔吏有罪先請五年五月幽係囚非殊死勿案六年五月赦隴西殊死以下十一年二月詔殺奴婢不得減罪八月詔炙灼論如律十八年蠲邉郡殺盗之法同之内郡二十二年九月地震減繫囚罪一等漢胎養令章紀元和二年春正月乙酉詔曰令云人有産子者復勿算三歲今諸懷姙者賜胎養人三斛復其夫勿算一歳著以為令三年春正月乙酉詔曰葢人君者視民如父母有憯怛之憂有忠利之教匍匐之救其嬰兒無父母親屬及有子不能養食者廪給如律論曰章帝長者感陳寵之議除慘獄之科深元元之愛著胎養之令晉志光武時民有産子者復以三年之算宋朝仁宗嘉祐三年韓宗彦請修胎養令以為繼嗣漢室皆章帝苗裔以仁心養民故也紹興二十七年九月范如志請舉胎養令漢元和定律章紀元和二年正月乙酉詔三公曰方春生養萬物莩甲宜助萌陽以育時物其令有司罪非殊死且勿案驗立秋如故秋七月庚子詔曰春秋於春毎月書王者重三正慎三㣲也律十二月立春不以報囚月令冬至之後有順陽助生之文而無鞠獄斷刑之政朕咨訪儒雅稽之典籍以為王者生殺宜順時氣其定律無以十一月十二月報囚魯恭傳初和帝下令麥秋得按驗薄刑而州郡好以苛察為政因此遂盛夏斷獄恭上疏諫曰舊制至立秋乃行薄刑自永元十五年以来改用孟夏月令孟夏斷薄刑出輕繫又曰仲夏挺重囚益其食夫斷薄刑者謂其輕罪已正不欲令久繫故時斷之也臣愚以為孟夏之制可從此令其决獄案考皆以立秋為斷初肅宗時斷獄皆以冬至之前自後論者互多駁異鄧太后詔公卿以下會議恭議奏曰易曰潛龍勿用言十一月十二月陽氣潛蔵未得用事孝章皇帝深惟古人之道助三正之㣲定律著令冀承天心順物性命以致時雍易曰君子以議獄緩死可令疑罪使詳其法大辟之科盡冬月乃斷其立春在十二月中者勿以報囚如故事安帝永初元年五月恭為司徒樊儵𫝊永平元年拜長水校尉議刑辟宜須秋月以順時氣從之襄楷𫝊楷上疏言永平舊典諸當重論皆須冬獄先請後刑所以重人命也和帝紀永元十五年十二月庚子有司奏以為夏至則㣲陰起靡草死可以决小事是嵗初令郡國以日北至按薄刑陳寵𫝊肅宗初寵為尚書是時承永平故事吏政尚嚴切尚書决事率近於重寵以帝新即位宜改前世苛俗帝納寵言毎事務於寛厚其後遂詔有司絶鉆鑽諸慘酷之科解妖惡之禁除文致之請讞五十餘事定著於令元和元年七月詔考獄多酷及秋冬明為其禁十二月蠲除妖惡禁錮元年七月定報囚律是後人俗和平屢有嘉瑞漢舊事斷獄報重常盡三冬之月是時帝始改用冬初十月而已元和二年寵奏曰稽春秋之文當月令之意漢小杜律郭躬𫝊躬父𢎞習小杜律躬少傳父業郭氏自𢎞後數世皆傳法律元和三年拜為廷尉躬家世掌法務在寛平及典理官决獄斷刑多依矜恕又條諸重文可從輕者四十一事奏之奏讞法科多所生全事皆施行著於令注前書杜周武帝時為廷尉御史大夫斷獄深刻小子延年亦明法律宣帝時又為御史大夫對父故言小朱博曰太守漢吏奉三尺律令以從事三尺律令人事出其中漢祀令齋令後漢祭祀志注漢祀令曰天子行有所之出河沈用白馬珪璧各一衣以繒緹五尺祠用脯二束酒六升鹽一升涉渭灞涇雒佗名水如此者沈珪璧各一律在所給祠具及行沈祠佗川水先驅投石少府給圭璧不滿百里者不沈蔡邕表志曰宜具録建武乙未元和丙寅詔書下宗廟儀及齋令入郊祀志永為典式禮儀志凡齋天地七日宗廟山川五日小祠三日蔡邕傳曰自今齋制宜如故典郊祀志官社官稷注臣瓚引漢祀令文紀注如淳引漢祠令陰安侯云云漢令科品品令故事品式安帝紀元初五年七月丙子詔曰舊令制度各有科品注漢令今亡又見車服濟南王康𫝊國傅何敞諫曰輿馬臺𨽻應為科品劉祐𫝊轉大司農中常侍蘇康管霸用事固天下良田祐移書所在依科品沒入之仇香𫝊為蒲亭長勸人生業為制科令馬融對策曰今科條品制四時禁令所以承天順民者備矣百官表少府注如淳曰若盧官名蔵兵器品令曰若盧郎中二十人主弩射漢儀注有若盧獄令宣帝紀品式備具孔光𫝊為尚書觀故事品式數嵗明習漢制及法令漢决事都目辭訟比漢馬將軍故事東觀記建初中司徒辭訟久者至數十年比例輕重非其事類錯雜難知鮑昱為司徒奏定辭訟比七卷决事都目八卷以齊同法令息遏人訟也陳寵𫝊寵辟司徒鮑昱府昱高其能轉為辭曹掌天下獄訟其所平决無不厭服衆心時司徒辭訟久者數十年事類溷錯易為輕重不良吏得生因縁寵為昱撰辭訟比七卷决事科條皆以事類相從昱奏上之其後公府奉以為法馬援傳援破交趾所過輙為郡縣治城郭穿渠灌溉以利其民條奏越律與漢律駮者十餘事與越人申明舊制以約束之自後駱越奉行馬將軍故事建武十九年禮朝士注鄭司農云謂若今時辭訟在劵書者為治之應劭漢儀刪律令議駮律本板令律畧論應劭𫝊為駮議三十篇又删定律令為漢儀晉志作議建安元年乃奏之曰夫國之大事莫尚載籍載籍也者决嫌疑明是非賞刑之冝允獲厥中俾後之人永為監焉故膠東相董仲舒老疾致仕朝廷每有政議數遣廷尉張湯至陋巷問其得失於是作春秋决獄二百三十二事動以經對言之詳矣逆臣董卓蕩覆王室典章焚燎靡有孑遺今大駕東邁廵省許都㧞出險難其命維新臣屢世受恩榮祚豐衍竊不自揆貪少云補輒撰具律本章句尚書舊事廷尉板令决事比例司徒都目五曹詔書及春秋斷獄凡二百五十篇蠲去復重為之節文又集駁議三十篇以類相從凡八十二事其見漢書二十五漢記四皆刪叙潤色以全本體其二十六博採古今瓌偉之士文章煥炳徳義可觀其二十七臣所創造庶㡬觀察増闡聖聽惟因萬機之餘暇㳺意省覧焉獻帝善之𫝊云凡所著述百三十六篇隋志梁有應劭律略論五卷唐志云劉劭漢朝議駮三十卷應劭撰續漢書曰劭又著中漢輯叙漢官儀及禮儀故事凡十一種百三十一卷朝廷制度百官儀式所以不亡者由劭記之律本章句李悝六篇蕭何九篇張湯二十七篇趙禹六篇叔孫郭馬鄭諸儒章句十餘家尚書舊事孔光為尚書觀故事品式鄭𢎞所陳著南宫為故事廷尉板令張湯著讞法廷尉挈令韋昭曰在板挈也决事比例周禮注若今時决事比若陳忠為决事比周禮疏今律其有斷事皆依舊事斷之其無條取此類以决之司徒都目注司徒即丞相總領綱紀佐理萬機故有都目鮑昱為司徒定决事都目八卷百晉志按司徒鮑公撰辭訟嫁娶决為法比都目凡九六卷五曹詔書見詔令春秋斷獄見春秋漢田律周禮夏官大司馬遂以蒐田有司表貉誓民注誓民誓以犯田法之罰也誓曰無干車無自後射疏曰云誓曰無干車無自後射者此據漢田律而言無干車謂無干犯他車無自後射者象戰陳不遂奔走又一解云前人已射中禽後人不得復射彼又云無面傷之等象降者不逆擊之云秋官士師五禁注今野有田律疏云舉漢法以况之漢上計律周禮典路注鄭司農云漢朝上計律陳屬車於庭掌皮注云今時詔書或曰齎計吏小宰注使齎嵗盡文書来若今上計宰夫注治要若嵗計治凡若月計治目若今日計也衛宏漢舊儀曰朝會上計律常以正月旦受羣臣朝賀漢大樂律周禮大胥注鄭司農云漢大樂律曰卑者之子不得舞宗廟之酎除吏二千石到六百石及闗内侯五大夫取適子顔色和順身體脩治者以為舞人與古用卿大夫子同義後漢百官志注盧植禮注曰大予令丞如大胥小胥漢大樂律卑者之子不得舞宗廟之酎取六百石五大夫以上適子三十一以下顔色和順身體修治者為舞人漢律詳見漢蓺文志考記内則三牲用藙注漢律會稽獻焉説文漢律會稽郡獻鮚醤名船方長為舳艫綺絲數謂之絩布謂之總綬組謂之首疁田茠草㑹稽獻􅱣婦告威姑賜衣者縵表白裏祠䃾司命及其門首洒㳻民不繇貲錢二十二禮春官注左𫝊注引漢律隋志漢律久亡初學記漢律吏五日得一下沐秋官司刺注過失若今律不坐三赦注若今律令云云惠紀注漢律人出一算漢令詳見漢蓺文志考説文引漢令曰䞣張百人蠻夷長有罪當殊之蠻夷卒有􅀢漢尚方律宋書有司奏曰車服以庸虞書茂典名器謹假春秋明誡是以尚方所制漢有嚴律諸侯竊服雖親必罪漢法名家後漢𫝊順帝時吳雄明法律斷獄平子訢孫恭三世廷尉為法名家注名為明法之家郭氏自𢎞後數世𫝊法律子孫至公者一廷尉七侯三刺史二千石侍中郎將者二十餘人侍御史正監平甚衆躬奏讞法科多所生全論曰法家慶延于世前漢陳咸欽躬寵忠世典刑法楊賜為廷尉自以代非法家言曰三后臯陶不與葢吝之也遂固辭樊凖上疏曰文吏去法律而學詆欺鋭錐刀之鋒斷刑辟之重宜復召郡國書佐使讀律令元初四年選通儒讐校漢家法令沈約曰漢代律書出乎小杜吳雄三世法家系居理職郭躬律學通明仍業司士晉叔則元凱並各名家南齊崔祖思曰漢来治律有家子孫並世其業聚徒講授至數百人故張于二氏絜譽文宣之世陳郭兩族流稱武明之朝决獄無寃慶昌枝裔槐衮相襲蟬紫𫝊輝孔稚珪曰古之名流多有法學釋之定國聲光漢臺元常文惠績映魏閣蜀漢諸葛武侯十六條書目雜家武侯十六條一卷初蜀主三訪亮於草廬既見亮上便宜事列之文武二篇凡十六條伊籍𫝊與諸葛亮法正劉巴李嚴共造蜀科蜀科之制由此五人魏新律律博士律畧論科令甲子科晉志魏國建鍾繇為相國定甲子科六典云造甲子科條又議肉刑初魏文侯師李悝著法經六篇商君受之以相秦蕭何定漢律益為九篇稍増至六十篇又有三百餘篇决事比九百六卷世有増損錯揉無常後各為章句馬鄭諸儒十有餘家以至於三國魏所當用者合二萬六千二百七十二條七百七十三萬餘言覽者益難明帝乃詔但用鄭氏章句不雜用餘家尚書衛覬奏曰刑法者國家之所貴重而私議之所輕賤獄吏者百姓之所懸命而選用者之所卑下王政之弊未有不由此也九章之律自古所傳斷定刑罪其意㣲妙請置律博士帝從之通監網目太和三年十月立聴訟觀置律博士又詔改定刑制命司空陳羣散騎常侍劉邵給事黄門侍郎韓遂議郎庾嶷中郎黄休荀詵等刪約舊科傍采漢律定為魏法制新律十八篇州郡令四十五篇尚書官令軍中令合一百八十餘篇其序略曰舊律所難知者由於六篇篇少故也篇少則文荒文荒則事寡事寡則罪漏是以後人稍増更與本體相離今制新律宜都總事類多其篇條舊律因秦法經就増三篇而具律不移因在第六罪條例既不在始又不在終非篇章之義故集罪例以為刑名冠於律首盗律有劫略恐猲和買賣人科有持質皆非盗事故分為劫略律賊律有欺謾詐偽踰封矯制囚律有詐偽生死令景有詐自復免事類衆多故分為詐律賊律有賊伐樹木殺傷人畜産及諸亡印金布律有毁傷亡失縣官財物故分為毁亡律囚律有告劾𫝊覆廐律有告反逮受科有登聞道辭故分為告劾律囚律有繫囚鞫獄斷獄之法興律有上獄之事科有考事報讞宜别為篇故分為繫訊斷獄律春秋疏云漢世名斷獄為劾盗律有受所監臨受財枉法雜律有假借不廉令乙有呵人受錢科有使者驗賂其事相類故分為請賕律盗律有勃辱强賊興律有擅興徭役具律有出賣呈科有擅作修舍事故分為擅興律興律有之徭稽留賊律有儲峙不辦廐律有乏軍之興及舊典有奉詔不謹不承用詔書漢氏施行有小愆之反不如令輙劾以不承用詔書乏軍腰斬又減以丁酉詔書漢文所下不宜復以為法故别為之留律秦世舊有廐置乗𫝊副車食厨漢初承秦不改後以費廣稍省故後漢但設騎置無車馬而律猶著其文則為虚設故除廐律取其可用合科者以為郵驛令其告反逮驗别入告劾律上言變事以為變事令以驚事告急與興律燧遂及科令者以為驚事律盗律有還贓畀主金布律有罰贖入責以呈黄金為價科有平庸坐贓事以為償贓律律之初制無免坐之文張湯趙禹始作監臨部主見知故縱之例其見知而故不舉劾各與同罪失不舉劾各以贖論其不見知不坐也是以文約而例通科之為制毎條有餘科不覺不知從坐之免不復分别而免坐繁多宜總為免例以省科文故更制其由例以為免坐律諸律令有其教制本條無從坐之文皆從此取法也凡所定増十三篇就故五篇合十八篇於正律九篇為増於旁章科令為省矣改漢舊律不行於魏者皆除之更依古義制為五刑其死刑有三髠刑有四完刑作刑各三贖刑十一罰金六雜抵罪七凡三十七名以為律首又改賊律云云斯皆魏世所改其大略如是其後正始之間天下無事於是征西將軍夏侯𤣥河南尹李勝中領軍曹羲尚書丁謐又追議肉刑卒不能决其文甚多不載及景帝輔政云云程咸上議曰司㓂作典建三等之制甫侯修刑通輕重之法叔世多變秦立重辟漢又修之大魏承秦漢之弊未及革制然則法貴得中刑慎過制六典魏命陳羣等採漢律為魏律十八篇増漢蕭何律劫掠詐偽毁亡告劾係訊斷獄請賕驚事償贓等九篇也劉劭傳與議郎庾嶷等定科令作新律十八篇著律略論唐志五卷十隋五卷法家梁有法論卷劉劭撰盧毓𫝊青龍二年為侍中先是劉劭受詔定律未就毓上論古今科律之意以為法宜一正不冝有兩端使姦吏得容情隋志魏廷尉决事十卷晉泰始新律律本甲令晉令文紀魏常道鄉公咸熙元年文帝為晉王秋七月帝奏司空荀顗定禮儀中䕶軍賈充正法律尚書僕射裴秀議官制太保鄭冲總而裁焉武泰始四年春正月景戌律令成封爵賜帛各有差刑法志文帝為晉王患前代律令本注煩雜陳羣劉劭雖經改革而科網本宻又叔孫郭馬杜諸儒章句但取鄭氏又為偏黨未可承用於是令賈充定法律令與大傅鄭冲司徒荀顗賈充𫝊以司徒為司空中書監荀朂中軍將軍羊祜中䕶軍王業廷尉杜友守河南尹杜預散騎侍郎裴楷潁川太守周雄齊相郭頎騎都尉成公綏尚書郎栁軌及吏部令史榮劭等十四人典其事就漢九章増十一篇仍其族類正其體號改舊律為刑名法例辨囚律為告劾繫訊斷獄分盗律為請賕詐偽水火毁亡因事類為衛宫違制撰周官為諸侯律合二十篇六百二十條二萬七千六百五十七言蠲其苛穢存其清約事從中典歸於益時其餘未宜除者若軍事田農酤酒未得皆從人心權設其法太平當除故不入律悉以為令施行制度以此設教違令有罪則入律其常事品式章程各還其府為故事減梟斬族誅從坐之條除謀反適養母出嫁女皆不復還坐父母弃市省禁固相告之條去捕亡沒為官奴婢之制輕過誤老少女人當罰金杖罰者皆令半之重奸伯叔母之令棄市淫寡女三嵗刑崇嫁娶之要一以下娉為正不理私約峻禮教之防准五服以制罪也凡律令合三千九百二十六條十二萬六千三百言六十卷故事三十卷泰始三年通監從紀在四年事畢表上武帝詔曰昔蕭何以定律令受封叔孫通制儀為奉常賜金五百斤弟子百人皆為郎中夫立功立事古今之所重宜加禄賞詔簡弟子百人隨材品用賞帛萬餘疋武紀泰始四年正月丙戌律令成封爵賜帛各有差武帝親自臨講使裴楷執讀四年正月戊子大赦天下乃班新律其後明法掾張斐又注律表上之是時侍郎盧珽中書侍郎張華又表抄新律諸死條目掛之亭𫝊以示兆庶有詔從之唐藝文志晉駁事四卷晉彈事九卷隋志十卷賈充杜預刑法律本二十一卷賈充等撰令四十篇户令至雜法晉令四十卷張斐律解二十卷隋志二十一卷隋志杜預律本二十一卷晉雜議十卷晉雜制六十卷晉初甲令已下至九百餘卷武帝命賈充引羣儒刪采其要増律十篇其餘不足經逺者為法令施行制度者為令品式章程者為故事各還其官府列𫝊鄭冲為魏太保平蜀之後命賈充羊祜等分定禮儀律令皆先諮於冲然後施用裴楷字叔則賈充改定律令以楷為定科郎事畢詔楷於御前執讀平議當否叔則元凱並名家杜預字元凱與車騎將軍賈充等定律令既成預為之注解乃奏之曰法者葢繩墨之斷例非窮理盡性之書也故文約而例直聴省而禁簡古之刑書銘之鍾鼎鑄之金石所以逺塞異端使無淫巧也今所注者皆網羅法意格之以名分使用之者執名例以審趨舍伸繩墨之直去析薪之理也詔班于天下賈充所定新律既班於天下百姓便之又有荀煇同典正其事餘同志續咸脩陳杜律明逹刑書永嘉中遷廷尉平六典晉命賈充等十四人損増漢魏律為二十篇一刑名二法例三資律四賊律五詐偽六請賕七告劾八補律九繫訊十斷獄十一雜律十二户律十三典律十四毁亡十五衛宫十六水火十七廐律十八闗市十九違制二十諸侯凡一千五百三十條齊百官志荀朂欲去事煩唯論并省定制成文本之晉令文選注引晉令宋禮志引晉令齊王植曰晉律文簡辭約㫖通大綱事之所質取斷難釋張斐杜預同注一章而生殺永殊自晉泰始以来唯斟酌參用江左相承用晉世張杜律二十卷齊世祖詳正舊注晉六條武紀魏咸熙二年十一月乙未晉王令諸郡中正以六條舉淹滯一曰忠恪匪躬二曰孝敬盡禮三曰友於兄弟四曰潔身勞謙五曰信義可復六曰學以為己隋志晉刺史六條制一卷刑法類穆紀永和元年四月壬戌詔會稽王昱録尚書六條事二月二月癸丑以左光禄大夫蔡謨領司徒録尚書六條事晉五條詔書武紀泰始二年一本泰始元年十二月班五條詔書於郡國一曰正身二曰勤百姓三曰撫孤寡四曰厚本息末五曰去人事隋志班五條詔十卷亡北齊時制五條冩於詔牘以版長二尺二寸雌黄塗之正旦宣示百官一曰去殘賊擇良吏二曰勸農無煩擾三曰六極之人務皆寛養四曰長吏浮華宜謹察之五曰内外混殽所冝糾劾後周時魏大統十一年蘇綽亦為六條詔書一曰修心二曰厚教化三曰盡地利四曰擢賢良五曰恤獄訟六曰均賦役崇文目蘇綽六條一卷周文常置坐右令百司習誦牧守令長非通六條不得居官晉尚書十二條宋百官志漢東京置太傅録尚書事晉康帝世何充表曰咸康中分置三録王導録其一荀崧陸􅎡各録六條事然則似有二十四條若止有十二條則荀陸各録六條導又何所司乎其後每置二録輒云各掌六條事又是止有十二條不知悉何條晉江右有四録則四人參録江右張華江左庾亮並經闗尚書七條亦不知皆何事也晉令祠令後漢欒巴傳注晉令諸郡國不滿五千以下置幹吏二人北史劉芳傳晉祠令云郡縣國祠社稷先農縣又祠靈星南齊百官志晉秘書閣有令史掌衆書見晉令傅咸𫝊按令御史中丞督司百僚皇太子以下其在行馬内有違法憲者皆弹糾之雖在行馬外而監司不糾亦得奏之齊王植集注律漢晉律序注張斐律解晉書初晉張斐杜預等共注律二十卷自泰始以来用之律文簡約或一章之中兩家所處生殺頓異臨時斟酌吏得以為奸齊武留心法令詔獄官詳定舊注永明七年尚書刪定郎王植集定二注表奏之取張斐注七百三十一條杜預注七百九十一條或二家兩釋其義乃備者又取一百七條其注相同者取一百三條集為一書凡一千五百三十二條為二十卷詔公卿八座參議考正竟陵王子良總其事衆議異同不能一者制㫖平决永明九年廷尉孔稚圭表上律文二十卷録序一卷又奏寫律上國學置律助教依五經例事不行隋志漢晉律序注一卷晉張斐撰雜律解二十一卷唐志斐律解二十卷張斐撰梁有杜預雜律七卷亡唐志宗躬齊永明律八卷梁律梁令武帝天監元年秋八月丁未命尚書刪定郎蔡法度法度家傳律學損益王植集注舊律為梁律命尚書王亮侍中王瑩僕射沈約吏書范雲等九人同議定二年四月癸夘法度上梁律三十卷令三十卷户令至軍賞三十篇録一卷隋唐志同刑名至違制制刑為十五等之差科三十卷隋志科三十卷梁時取故事之宜於時者為梁科唐志梁科二卷詔班行之自刑名至違制二十篇大凡定罪二千五百二十九條陳永定元年冬十月置刪定郎治律令范泉徐陵等參定律令律二十卷唐志九卷隋志同令三十卷隋唐志同科三十卷隋唐志同冗隋志云令科四十卷條𣲖雜博而非要又陳新制六十卷隋志晉宋齊梁律二十卷蔡法度撰元魏律令大統式隋新律律令格式西魏六條隋志兼唐六典等書太和十五年五月己亥更定律令先是太和五年新律成八百三十三章於東明觀親决疑獄十六年四月丁亥朔班新律令大赦隋志後魏律二十卷北齊文宣天保元年始命羣臣刋定魏麟趾格李渾邢邵等修撰時政刑不一罕依律文謂之變法於是議造齊律武成大寜元年督修律令河清三年尚書令趙郡王叡等奏上齊律十二篇名例至雜律隋唐志十二卷目一卷定罪九百四十九條又上新令四十卷隋志五十卷唐志八卷采魏晉故事以尚書二十八曹為篇名其制刑名五重罪十條其不可為定法者别制權令二卷隋志北齊權令二卷與之並行三月辛酉班行之是後法令明審科條簡要又敕仕門子弟常講習之故齊人多曉法律西魏大統元年宇文泰以軍旅未息令有司酌古今為二十四條新制行之七年九月度支尚書蘇綽為六條詔書一曰修心二曰厚教化三曰盡地利四曰擢賢良五曰恤獄訟六曰均賦役泰置坐右令百官習誦之牧守令長非通六條及計帳不得居官尋又益新制十二條十年七月更權衡度量命綽損益三十六條之制頒之六典注損益為五卷謂之大統式三志後周太祖命綽撰條隋唐志大統式卷崇文目蘇綽六一卷十五年以泰前後所上二十四條及十二條新制為中興永式周以趙肅為廷尉卿定律保定三年三月庚子乃就紀二月庚子初頒新律凡二十五篇謂之大律刑名至斷獄定罪一千五百三十七條比於齊律煩而不要隋唐志趙肅等後周律二十五卷建徳二年十一月行刑書要制宣政元年八月詔制九條宣下州郡大象元年除高祖所立刑書隋則律令格式並行文帝開皇元年以周法繁而不要命高熲鄭譯及上柱國楊素率更令裴政等七人更加修定政練習典故逹於從政乃參魏晉舊律下至齊梁㳂革重輕取其折𠂻時同修者十餘人凡有凝滯皆取决於是去前世梟轘及鞭法自非謀叛以上無收族之罪始制死刑二絞斬流刑三自二千里至三千里徒刑五自一年至三年杖刑五自六十至一百笞刑五自十至五十又制議請減贖官當之科以優士大夫除前世訊囚酷法開皇元年冬十月戊子始行新律唐志云高熲等隋律十二卷二年七月甲午行新令高熲等撰令三十卷官品至雜令唐志牛𢎞等隋開皇令三十卷三年文帝覧刑部奏斷獄數猶至萬以為律尚嚴宻人多䧟罪敕蘇威牛𢎞等刪定新律除死罪八十一條流罪一百五十四條徒杖等千餘條惟定留五百條凡十二篇名例至斷獄自是刑制簡要疎而不失乃制律博士弟子員斷獄先牒明法定罪五年廢大理律博士刑部曹明法州縣律生六年敕諸州長史已下行參軍已上普令習律集京之日試其通不煬帝以開皇律令猶重大業二年十月更制大業律牛𢎞等造三年四月甲申頒行凡十八篇五百條名例至斷獄五刑降從輕典者二百餘條隋志大業律十一卷卷唐志十八卷夘又大業令三十四年十月乙頒新式東魏麟趾格後魏書孝静帝興和二年詔羣臣於麟趾閣議定法制謂之麟趾格隋志云於麟趾殿制正刑典十月甲寅頒行也唐志北齊麟趾格四卷文襄帝時撰元魏太和元年九月更定律令五年新律成十五年改定十六年班新律玉海卷六十五
