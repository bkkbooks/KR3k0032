body:
  text: 玉海卷八十六宋王應麟撰器用佩帶笏釋名佩倍也言其非一物有倍貳也有珠有玉有容刀有帨巾有觿之屬也帶蔕也著於衣如物之繫蔕也笏忽也君有教命及所啓白則書其上備忽忘也舜白環佩佩環後漢馬融傳廣成頌納僬僥之珍羽受王母之白環注帝王紀曰舜時僬僥氏來貢其沒羽西王母慕舜之徳來獻白環文選景福殿賦納虞氏之白環注世本曰舜時西王母獻白環及佩一云獻白環玉玦瑞應圖黄帝時西王母使乗白鹿獻白環之休符舜時復來獻宋志西王母舜時來獻白環白琯子華子舜出則有鸞和動則有珮環步趨中莖韶之節拾遺録顓頊時勃鞮國獻黑玉之環周武王笏玉笏象笏淮南子齊俗訓武王勝殷搢笏杖殳以臨朝周書武王不閉外門以示無懼去劍搢笏以示無懼樂記武王郊射裨冕搢笏左傳桓二年臧哀伯曰衮冕黻珽帶裳幅舄衡紞紘綖昭其度也注珽玉笏也若今吏之持簿疏管子云天子執玉笏以朝日或曰笏可以簿疏物也徐廣車服儀制曰古者貴賤皆執笏即今手板也然則笏與簿手板之異名耳蜀志稱秦密見太守以簿擊頰則漢魏以來皆執手板故云若今吏之持簿珽一名大圭典瑞云王晉大圭以朝日是也考工記大圭長三尺天子服之是天子之圭長三尺玉藻云笏度二尺有六寸短於天子玉藻天子搢珽方正於天下也諸侯荼前詘後直遜於天子也大夫前詘後詘無所不遜也將適公所史進象笏書思對命笏天子以球玉美玉也諸侯以象大夫以魚須文竹士竹本象可也大夫士笏俱用竹大夫以魚須飾之士以象骨為飾不敢純用一物所以下人君也見天子與射無説笏有指畫於君前用笏受命於君前則書於笏疏凡臣見君皆執笏所以記事隋志五經要義曰笏所以記事防忽忘禮圖云度二尺有六寸中博二寸其殺六分去一晉宋以來謂之手板洞𡨕記周公以玉笏與孟岐穆天子傳天子大服冕褘帗帶搢曶夾佩荀子天子御珽諸侯御荼大夫服笏禮也周遷車服雜事應仲逺云秦侍官執刀劍漢髙祖偃武脩文始制以手板代焉仲長子曰笏以書君教令記善刺過今之手板以象焉胡氏曰古者君臣所執五玉三帛二生一死皆以為贄而已笏則搢之用以記事不執之以為儀也宇文周乃不脩贄而執笏於是攝齊鞠躬之禮廢周禮疏漢有搢紳之士謂搢笏於紳在君前以笏記事後代用簿簿今手板周佩玉服玉周禮玉府上士二人中士四人共王之服玉佩玉珠玉合諸侯共珠槃王齊則共食玉注佩玉王所帶者玉藻曰天子佩白玉而𤣥組綬詩傳曰佩玉上有葱衡下有雙璜衝牙蠙珠以納其間鄭司農云服玉冠飾十二玉三禮圖佩上有雙衡長五寸博一寸下有雙璜徑一寸衝牙長三寸槃盛㰱血珠玉以為飾珠槃以盛牛耳血尸盟者執之禮記玉藻一命緼韍幽衡再命赤韍幽衡三命赤韍葱衡注衡佩玉之衡古之君子必佩玉左徵角右宫羽五聲所中也趨以采齊音茨行以肆夏周旋中規折還中矩進則抑之退則􅀭之然後玉鏘鳴也故君子在車則聞鸞和之聲行則鳴佩玉是以非辟之心無自入也君在不佩玉左結佩右設佩按注云謂世子也出所處而君在焉則去徳佩而設事佩辟徳而示即事也結其左者若於事有未能也結者結其綬不使鳴正義云左佩亦玉佩結其綬不使鳴非謂全去故取賀氏之説愚謂鄭義為是若果如孔説左佩玉而結之必不垂不佩玉之訓也鄭謂去徳佩者釋不佩玉也謂設事佩者左佩亦在其中故曰結其左者若於事有未能居則設佩謂所處君不在朝則結佩朝於君亦結左齊則綪結佩而爵韠凡帶必有佩玉唯喪否佩玉有衝牙居中央以前後觸也君子無故玉不去身君子於玉比徳焉天子佩白玉而𤣥組綬公侯佩山𤣥玉玉色似山之𤣥而朱組綬大夫佩水蒼玉似水之蒼而純組綬世子佩瑜玉玉之美者而綦組綬士佩瓀玫石次玉者而緼組綬通典云周制以注綬所以貫佩玉相承受者正義尊者玉色純公侯下玉色漸雜而世子及士唯論玉質則玉色不定也月令春服倉玉注凡所服玉謂冠飾及所佩者之衝璜也夏服赤玉中央服黄玉秋服白玉冬服𤣥玉周書玉佩解第六十五序曰玉者徳以飾躬用所為佩作玉佩周書又曰武王俘商得佩玉億有八萬詩鄭風女曰雞鳴知子之來之雜佩以贈之知子之順之雜佩以問之知子之好之雜佩以報之注雜佩者珩璜琚瑀衝牙之類有女同車將翺將翔佩玉瓊琚秦風渭陽何以贈之瓊瑰玉佩小雅采芑有瑲葱珩注葱蒼也三命葱珩大東鞙鞙佩璲箋以瑞玉為佩漢杜欽傳佩玉晏鳴關雎歎之注李奇曰后夫人雞鳴佩玉去君所周康王后不然故詩人歎而傷之臣瓚曰此魯詩也穆天子傳七萃之士天子嘉之賜以左佩華注玉華之佩佩之精者左傳衣身之章也佩衷之旗也周玉瑱周禮弁師掌王之五冕皆𤣥冕朱裏延紐五采繅十有二就皆五采玉十有二玉笄朱紘諸侯侯當為公之繅斿九就瑉玉三采其餘如王之事繅斿皆就玉瑱玉笄玉塞耳者詩君子偕老篇玉之瑱也箋充耳所以垂瑱者或名為紞織之人君五色臣則三色淇澳篇充耳琇瑩注充耳謂之瑱琇瑩美石也天子玉瑱諸侯以石左傳疏周禮追師掌王后之首服追衡笄鄭司農云衡維持冠者鄭𤣥云祭服有衡垂於副之兩旁當耳其下以紞垂瑱男子首服亦然追者治玉之名王后之衡以玉為之弁師弁及冕皆用玉笄則天子之衡亦用玉紞者垂瑱之䋲垂於冠之兩旁魯語王后親織𤣥紞公侯夫人織紘綖冕弁皆有笄故用紘緇布冠無笄故用纓論語疏按今禮圖衮冕以下皆有充耳天子以黈纊諸侯以青纊隋志天子玉笄導亦如之唐禮志皇帝加元服殿中監陳衮服緇纚玉簮及櫛三物同箱博古圖宰辟父敦銘曰錫汝華朱芾𤣥衣束帶於鋚革錫戈琱㦸彤侯矢用養乃祖考毛父敦銘曰錫赤芾周朱芾赤芾詩斯干朱芾斯皇箋天子純朱諸侯黄朱疏乾鑿度以為天子之朝朱芾諸侯之朝赤芾白虎通芾者蔽也行以蔽前天子朱芾諸侯赤芾以韋為之上廣一尺下廣二尺采芑朱芾斯皇注黄朱芾也侯人三百赤芾注芾韠也一命縕芾黝珩再命赤芾黝珩三命赤芾葱珩見玉藻大夫以上赤芾乘軒疏芾是配冕之服祭服謂之芾他服謂之韠采菽赤芾在股邪幅在下箋芾太古蔽膝之象也冕服謂之芾其他服謂之韠疏古者衣皮此存其象玉藻韠君朱大夫素士爵韋其制上廣一尺下廣二尺長三尺其頸五寸肩革帶博二寸邪幅如今行縢車攻赤芾金舄王氏曰涖其臣庶則朱芾君道也故方叔服其命服則朱芾㑹同於王則赤芾臣道也故此㑹同有繹則赤芾易困九二朱紱方來利用享祀注朱深云赤周大帶鞶鑑左傳桓二年鞶厲游纓昭其數也注鞶紳帶也一名大帶厲大帶之垂者莊二十一年夏鄭伯享惠王王以后之鞶鑑與之注鞶帶而以鑑為飾今西方羌胡為然古之遺服襄二十九年吴季札聘鄭見子産與之縞帶注大帶也定六年衛公叔文子曰定之鞶鑑易或錫之鞶帶詩都人士垂帶而厲疏禮大帶垂三尺芄蘭容兮遂兮垂帶悸兮鳲鳩淑人君子其帶伊絲箋大帶用素絲有雜色飾焉禮記男鞶革女鞶絲婦事舅姑施縏袠周禮云云疏凡帶有二大帶大夫已上用素士用練即紳也今挿笏者於紳之外帶之内又有革帶所以佩玉若帶劍在紳帶之間同處也武王有帶銘魯語卿之内子為大帶注緇帶也揚子今之學繡其鞶帨周赤舄見服類楚白珩楚語王孫圉聘於晉定公饗之趙簡子鞅鳴玉以相問於王孫圉曰楚之白珩猶在乎注珩佩玉上之横者對曰然曰其為寳也幾何矣曰未嘗為寳楚之所寳者曰觀射父能作訓辭又有左史倚相能道訓典言以賢為寳不以寳為寳又有藪曰雲連徒洲云云此楚國之寳也若夫白珩先王之玩也何寳焉圉聞國之寳六而已聖能制議百物以輔相國家則寳之玉足以庇􅄻嘉榖使無水旱之灾則寳之龜足以憲臧不則寳之珠足以禦火灾金足以禦兵亂山林藪澤足以備財用則寳之若夫譁囂之美楚雖蠻夷不能寳也禮象白珩盖天子之玉葱珩蓋卿大夫之玉左傳蔡昭侯為兩佩獻一佩於楚昭王楚辭被明月珮寳璐孟子諸侯之寳三土地人民政事孔子象環禮記玉藻孔子佩象環五寸而綦組綬注謙不比徳亦不事也象有文理者也環所以循無窮正義失魯司冦故謙不復佩徳佩事佩示已無徳事也象環者象已有文章文教循環無窮五寸法五行言文教成人如五行成物錢起有象環賦白虎通修道無窮即佩環鹽鐵論子思子之銀珮美於虞公之垂棘漢金飭具帶金犀毗匈奴傳孝文前六年遺匈奴服繡袷綺衣長襦錦袍各一比踈一黄金飭具帶一黄金犀毗一注孟康曰要中大帶張晏曰鮮卑郭洛帶瑞獸名師古曰胡帶之鉤亦曰鮮卑亦謂師比孝惠時侍中貝帶穆天子傳天子征至赤烏之人赤烏氏先出自宗周乃賜貝帶五十具漢革舄賜尚書履赤舄見冕服類東方朔傳朔對曰孝文皇帝足履革舄注師古曰革生皮也不用柔韋言儉率也揚雄傳賦曰革鞜不穿王符傳濳夫論孝文躬衣弋綈革舄韋帶貢禹傳孝文衣綈履革器亡琱文金銀之飾鄭崇傳哀帝每見曳革履笑曰我識尚書履聲隋志按圖云複下曰舄單下曰履王喬傳顯宗世為葉令每詣臺有雙鳬從東南飛來舉羅張之但得一雙舄詔尚方診視則四年中所賜尚書官屬履也輿服志注漢舊儀曰乗輿帶七尺斬蛇劍履虎絇履永平赤舄絇履見上班偼伃賦思君兮履綦李尤有文履銘周武王於屨為銘曹植七啓金華之舄動趾遺光本朝重和元年以鞾胡服改用履隆興二年改服鞾參用履之制飾以絇繶純綦漢大佩衝牙玉佩金錯鉤佩佩刀佩劍見後續志古者君臣佩玉尊卑有度上有韍貴賤有殊佩所以彰徳服之衷也韍所以執事禮之共也威儀之制三代同之五伯迭興戰兵不息佩非戰器韍非兵旗於是解去韍佩留其係璲以為章表故詩曰鞙鞙佩璲秦乃以采組連結於璲徐廣曰今名璲為縌光明章表轉相結受故謂之綬漢承秦制用而弗改加以雙印佩刀之飾至孝明皇帝乃為大佩衝牙雙瑀璜初學記引董巴志云渠璜皆以白玉乘輿絡以白珠公卿諸侯以采絲其視冕旒為祭服云注月令章句曰佩上有雙衡下有雙璜琚瑀以雜之衝牙蠙珠以納其間紀永平二年春正月辛未宗祀明堂玉佩絇屨以行事徐廣曰明帝復制韍天子赤皮蔽膝魏晉用絳紗楊賜傳光和四年拜太常賜玉壺革帶金錯鉤佩後五行志注陳宣諫曰車則和鸞歩則佩玉動靜應天雋不疑佩環玦左雄言九卿大臣行有佩玉之節玉藻正義凡佩玉必上繫於衡下垂三道穿以蠙珠下端前後以懸於璜中央下端懸以衝牙動則衝牙前後觸璜而為聲所觸之玉其形似牙故曰衝牙唐人有衝牙賦晉志三夫人金章紫綬佩干寘玉九嬪銀印青綬佩采瓄玉潘岳西征賦飛翠緌拖鳴玉漢革帶晉紫囊楊賜傳光和四年賜玉壺革帶金錯鉤佩晉志革帶古之鞶帶也謂之鞶革其有囊綬則綴于革帶其戎服則以皮絡帶代之八坐尚書荷紫以生紫為袷囊綴之服外加於左肩昔周公負成王制此服至今以為朝服一曰漢世用盛奏事負之以行隋志東觀書詔賜鄧遵獸頭鞶囊一枚班固與弟書遺仲升獸頭旁囊金錯鉤獸一作虎禮圖曰璫綴於革帶阮諶以為有印章則佩之漢簮筆魏白筆晉白筆漢書張安世持橐簮筆事武帝數十年注張晏曰橐契囊也近臣負囊簮筆從備顧問或有所紀也師古曰囊所以盛書無底曰橐簮筆者挿筆於首魏志明帝見殿中侍御史簮白筆側階而立問曰此何官也辛毗曰御史簮筆書過晉志古者貴賤皆執笏笏者有事則書之故常簮筆今之白筆是其遺象三臺五省二品文官簮之王公侯伯子男卿尹及武官不簮加内侍者乃簮之尚書令僕手板頭復有白筆以紫皮褁之宋志紳垂三尺笏者有事則書之云云同晉志朝服肩上有紫生袷囊綴之朝服外俗呼曰紫荷或云漢代以盛奏事負荷以行未詳也魏玉佩王粲傳注摰虞決疑要注曰漢末喪亂絶無玉佩魏侍中王粲識舊佩始復作之今之玉佩受法于粲隋志按禮天子佩白玉今參用杜䕫之法天子白玉太子瑜玉王山𤣥玉自公以下皆水蒼玉魏太子聞鍾繇有玉玦欲得之繇即送之晉賜王祥山𤣥玉珮衛氏玉玦綬笥采賁蓬楹響聞繩户禇淵謝賜佩隋九環金帶李徳林傳開皇元年敕令徳林與于翼髙熲等同修律令事訖奏聞别賜九環金帶一腰駿馬一匹後周武帝賜熊安生九環金帶隋萬釘寳帶楊素傳開皇十八年突厥達頭可汗犯塞以素為靈州行軍摠管出塞討之賜物二千段黄金百斤素奮擊大破之達頭被重創而走殺傷不可勝計優詔褒揚賜縑三萬匹及萬釘寳帶唐志隋文帝云云唯天子之帶有十三環李穆上隋文帝十三環金帶蓋天子服元魏帝解所服金鏤玉梁帶賜侯莫陳順唐萬釘寳鈿金帶紫袍龜帶見賜時服夷狄傳西突厥獻萬釘寳鈿金帶罽賔武徳二年貢寳帶環王貞觀時獻五色帶房𤣥齡傳太宗賜𤣥齡黄銀帶李光顔傳元和十三年春御麟徳殿召對賜金帶錦綵齊田單黄金横帶吳陸遜破曹休脱御金帶以賜唐佩䪓韘佩魚詳見章服類玉梁寳鈿帶車服志初職事官三品以上賜金裝刀礪石一品以下有手巾算袋佩刀礪石㑹要上元元年八月二十一日戊戌敕睿宗時景雲二年四月二十四日敕罷佩刀礪石而五品以上佩䪓韘七事佩刀刀子礪石契苾真噦厥針筒火石是也事泉男生率衆内附髙宗賜袍帶金鈿七帶之制三品以上玉梁寳鈿五品以上金梁寳鈿六品以下金飾隠起而已腰帶一品二品銙以金六品以上以犀九品以上以銀元和十二年太子少師鄭餘慶言百官服朝服者多誤自今唯職事官五品兼六品已上􅄆官者則有佩劍綬其餘皆省文宗詔勲官諸司佩刀礪紛帨百官志中尚令製魚袋給百官㑹要永徽二年四月二十九日開府儀同三司及京官文武職事四品五品並給隨身魚袋舊志五月四新志三品品有飾金與銀之别且出内必合以防召命之詐五年八月十四日己未敕帶魚之法用為褒飾咸亨三年五月三日始令京官四品職事五品佩銀魚是日内出魚袋徧賜之三品已上賜金裝刀子礪石武后垂拱二年正月二十日都督刺史凖京官帶魚天授元年九月二十六日改内外官佩魚為龜至神龍元年二月四日復佩魚朝野僉載唐上元中令九品已上佩刀礪算袋帉帨為魚形結帛作之取魚之衆鯉彊之兆也故程大昌演繁露載武后以𤣥武為龜改龜佩乆視元年十月十三日龜袋三品用金飾四品銀五品銅神龍元年九月十七日嗣王郡王階卑者許佩金魚至開元元年八月二十日親王長子帶郡王者聴佩魚神龍二年八月京文官五品已上依舊式佩銀魚三年八月令特進佩魚散職佩魚自兹始蘇氏記曰自永徽已來正貟官始佩魚至開元八年九月十四日中書令張嘉貞奏致仕及内外官五品已上檢校試判及内供奉官凖正貟例佩魚自後恩制賞緋紫例兼魚袋謂之章服景雲二年四月二十四日魚袋著紫者金裝緋者銀裝金銀銅之飾雖肇於乆視而用以飾魚配於緋紫不限品秩者至景雲而後定開元二年閏二月一云三月癸卯勅靈武等軍賜金魚袋一二十銀魚袋五十枚臨時行賞白居易集賜金紫詩魚佩葺鱗光照地鶻銜瑞帶勢冲天緋魚詩魚綴白金隨步躍鶻銜紅綬遶身飛炙轂子魚袋古之算袋取合魚符之義宋朝雍熙元年十一月丁卯郊祀畢内出魚袋賜近臣由是文武官皆佩魚紫以金緋以銀伎術官不佩元豐二年五月癸巳翰林學士蒲宗孟加佩魚大觀元年十一月詔太中大夫以上至中書舍人犀帶垂魚自霍端友始借服得佩魚始於政和元年十一月十七日兵部侍郎王詔之奏請馬永卿曰今魚袋乃古魚符必以魚者分左右可以合符唐用袋盛魚今以魚飾袋唐紅玉帶白玉帶通監開元七年九月甲寅徙宋王憲為寧王上從複道中見衛士棄餘食憲從容諫釋之是日上宴飲極歡自解紅玉帶并所乘馬賜憲楊元卿傳為金吾長慶初賜白玉帶李載義傳太和三年平李同㨗文宗賜白玉帶就幽州賜之唐金鈿帶突厥傳天寳初賜拔悉密紫文袍金鈿帶西域傳開元初賜天竺錦袍金革帶魚袋官志中尚令蕃客賜寳鈿帶魚袋則授鴻臚唐賜良笏憲宗元和五年二月李絳以直諫進中書舍人諫立聖徳碑故有是拜翌日賜金紫憲宗親擇良笏與之且曰異時膺顧託南面當如此㑹要五年二月面諭吐突承璀兵無勁功本傳論宦官横肆帝曰疾風知草卿當之矣云云絳頓首冊府𤣥龜元和二年絳為司勲郎中充翰林學士因浴堂北廊奏對指切時病及論中官縱恣方鎮進獻上曰真忠正之臣也改中書舍人依前翰林學士翌日面賜金紫帝親為絳擇良笏賜之舊史同唐賜通天御帶賜玉帶裴度傳拜淮西宣慰招討處置使舊紀元和十二年七月丙辰入對延英曰主憂臣辱義在必死賊未授首臣無還期帝壯之為流涕及行帝御通化門臨遣八月三日庚申賜通天御帶舊紀云犀帶發神䇿騎三百為衛平淮西碑度賜汝節斧通天御帶衛卒三百因話録云賜玉帶㑹要元和七年二月癸卯誕節李吉甫進馬二匹賜通天犀帶以答之又宣宗賜中尉馬元贄通天犀帶以遺馬植列傳白敏中以司空平章事兼邠寧節度使大中五年三月時党項數冦邉宜得大臣撫鎮及行宣宗御安福樓以餞璽書慰諭賜通天帶衛以神䇿兵開府辟士禮如裴度討淮西時鄭注節度鳯翔文宗賜通天犀帶封敖李徳裕進太尉敖草其制解所賜玉帶贈之王播自淮南還獻玉帶十有三張允伸咸通十年賜玉帶寳器李徳裕有通犀帶賦李勣贈屬僚二人佩刀玉帶李愬遺牛元翼寳劍玉帶唐甘棠笏笏囊詩笏又見御詩類魏謩傳魏徵五世孫也文宗開成三年為起居舍人帝問卿家書詔頗存乎對曰唯故笏在詔令上送鄭覃曰在人不在笏帝曰此笏乃今甘棠孫樵文貞公笏銘序曰大中六年詔出文貞公笏歸其孫丞相謩銘曰靈豸薦角比干獻骨合以憤烈在公為笏怒虎可唾笏不可挫泰華可裂笏不可折柱天不仄指日不蝕標儀條直起梗開直李衛公故物亦有象笏一差狹不類今笏張九齡傳故事公卿皆搢笏于帶而後乗馬九齡使人持之因設笏囊自九齡始王起傳加皇太子侍讀文宗題詩太子笏以賜㑹要武徳四年七月十六日詔五品以上執象笏六品已下執竹木笏其月敇凡笏周製也晉宋謂之手板近代唯尚書執笏公卿但以手板後周保定四年三月庚辰百官始執笏云云開元八年九月敕諸笏三品已上前絀後直五品以上前絀後挫并用象九品以上上挫下方用竹木車服志象笏上圓下方六品以竹木上挫下方禮志皇太子加元服陳衮冕金飾象笏囘鶻傳貞觀中黠戛斯來朝太宗勞享之奏願得持笏列傳魏徵太宗得徵書一紙始半藁曰去邪勿疑任賢勿猜曰公卿侍臣可書於笏知而必諫褚遂良致笏殿階崔澄一云崔滌𤣥宗以慎密字親書笏端崔琳每歳時宴于家以一榻置笏猶重積其上崔𤣥亮拜右常侍率諫官叩延英苦諍置笏在陛段秀實奪源休象笏擊朱泚顧少連欲擊裴延齡以笏元稹云文皇敕起居郎書居安思危四字于笏為至戒後唐天成元年出象笏三十二面賜百官無笏者唐賜珍器玉帶李光顔傳還鎮忠武長慶元年十二月辛巳穆宗御通化門臨送宰相百官班餞賜珍器良馬玉帶時將伐鎮州寅光顔以十二月戊為忠武節度辛巳赴鎮常衮謝玉帶牙笏表云魚須在手虹玉横腰李賀詩腰圍白玉冷唐佩筆于闐玉帶大觿李靖傳五代孫彦芳太和中為鳳翔司録參軍家故藏髙祖太宗賜靖詔書數函上之一曰兵事節度皆付公吾不從中治也一曰有晝夜視公疾大老嫗遣來吾欲熟知公起居狀皆太宗手墨他大畧如此文宗愛之不廢手其舊物有佩筆以木為管弢刻金其上别為環以限其間筆尚可用也靖破蕭銑時所賜于闐玉帶十三胯記云于闐獻三帶其一也髙祖所賜七方六刓胯各附環以金固之所以佩者又有火鑑大觿算囊椰盃等物常佩于帶者記又有素錦袍紫文綾襖靴袴象笏記云十三物亡其五存者八天子悉留禁中又敕摹詔本還賜彦方并束帶衣服權徳輿常讀太宗手詔至流涕曰君臣之際乃爾邪文粹韋端符衛公故物記曰大帝為兒時與公子某戲賜以皇子服物黄綾袍為龍鸞文素錦襖綷五采素錦半袖小笏皆緻巧又曰文皇賜書二十通多言征討事厚待勞苦信必威賞而已詩童子佩觿注觿所以解結成人之佩疏如錐以象骨為之建隆賜玉帶建隆元年正月賜宰相樞密使諸軍列校襲衣犀玉帶鞍勒馬有差三年四月賜定難節度李彞興玉帶乾徳元年二月丙戌賜天雄節度符彦卿襲衣玉帶熙寧六年十月辛巳十二日熙河奏㨗紫宸殿稱賀上解所服白玉帶賜宰臣王安石翌日表謝宣和七年十二月丁巳賜皇太子碾龍排方玉帶建炎三年四月解所服玉帶命内侍覆去龍飾賜知樞密院張浚曰此祖宗御府所寳也李端懿侍東宫解方玉帶賜之舊㢸若太𫝊史浩淳熙十三年二月壬子賜玉帶金魚宗室若永陽郡王居廣乾道四年十二日嗣濮王士輵九年正月恩平郡王璩十月伯圭淳熙九年九月十七日仲忽徽宗時勲臣若劉光世紹興元年張俊十一年十月己未楊存中二十一年吴璘三十二年戚畹若吳蓋乾道二年四月謝淵年月並無攷楊次山開禧三年十二月甲子皇祐二年十月三日賜致仕太子太傅杜衍少師任布襲衣笏頭金帶王貽永同平章事李昭亮易昭徳節皆賜方團金帶靖康末括金賂敵詔羣臣服金帶者權以通犀帶易之獨存金魚又執政則正透從官則倒透至建炎中興朝廷草創猶用此制吕好問為右丞特賜金帶髙宗面諭曰此帶朕自視上方工為之蓋特恩也紹興三年兵革粗定始詔依故事服金帶太平興國賜進士録袍鞾笏興國二年正月十日癸酉賜新及第進士諸科緑袍鞾笏未命以官先解褐非常則也三年九月二日賜胡旦已下自是以為定制端拱瑞草毬文帶元祐賜犀帶端拱中實録作淳化作瑞草毬路文方團胯帶副以金魚賜中書樞密院文臣景徳四年二月壬午賜太子太師吕蒙正太宗於紫雲樓下命巧匠造金帶三十條一自御之一賜曹彬金帶六種金笏頭帶賜宰輔使相等副以魚袋御仙花帶武臣無魚三司使學士中丞金魚毬文四方五團御仙花排方金塗帶九種文臣換武賜金塗銀寳缾帶軍班換前班賜金塗銀帶有寳缾茘支雙鹿之别伎術官銀帶金束帶八種犀帶一種知制誥賜牯犀帶金魚大觀二年五月丙寅詔中書舍人待制諫議服紅鞓犀帶不佩魚乾道九年十二月詔服紅鞓排方黒犀帶佩魚權侍郎同元祐二年八月戊申以復洮州俘􅀑章賀于延和殿九月辛亥太皇太后遣中使賜宰輔酒果及黄金三百兩犀帶二以奬其留意邉事彦博公著辭不許乃受熙寧中宗旦宗諤以使相遇郊恩告謝特賜毬文方團金帶佩魚著為例宣徽使張方平郭逵王拱辰皆特賜慶厯八年十一月癸亥賜王貽永李用和笏頭金帶故事非二府文臣不賜惟張耆在密院兼侍中嘗賜之宣和後宰執侍從以花犀帶入朝髙宗紹興三年正月壬戌詔自二月朔日繫金帶景徳三年六月癸未詔通犀金玉帶除官品合服及恩賜外餘不得服用祥符四年二月二十日以河中遺逸劉選為評事賜緑袍鞾笏銀帶束帛及五言詩九年正月張士遜崔遵度為夀春王友賜金紫襲衣犀帶錢俶進寳帶太祖曰朕有三條帶與此不同俶請宣示上笑曰汴河恵民五丈河一條俶大服太宗嘗得通天犀命工為二帶一以賜冦準道君賜李綱玉帶髙宗開大元帥府服排方玉帶唐志文宗詔一品二品服玉及通犀三品服花犀斑犀慶厯奏事笏實録慶厯三年十月癸丑諫官余靖使契丹辭書所當奏事於笏各以一字為記上顧見之指其字令一一盡對凡數十條日幾􅉴乃罷蓋上之聴納無倦也知滄州楊偕召還令間日入對凡對必條數十事皆黙記于笏上令横笏以奏之熙寧賜玉帶玉魚熙寧八年岐王顥嘉王頵言蒙賜方團玉帶著為朝儀寳藏于家不敢服用帝命工别琢玉帶賜之顥等固辭請加佩金魚以别嫌詔以玉魚賜之親王佩玉魚自此始宣和中判大宗正事仲忽賜玉帶金魚大臣勲舊佩金魚大觀二年五月乙丑賜宰臣京排方玉帶或誦韓愈詩有玉帶垂金魚之句乃請佩金魚遂為故事靖康元年十一月乙亥康王使河北入辭帝解排方玉帶以賜紹興十二年九月乙巳秦檜為太師賜玉帶使服之而入玉帶乗輿排方東宫不佩魚乾道元年八月二十一日詔皇太子服通天犀玉帶不佩魚蓋禮官言典故無佩魚之文駙馬都尉賜白玉帶宗室服金雕玉白玉通犀帶開寳五年閏二月四日以石保吉為左衛將軍駙馬都尉選尚延慶公主賜襲衣玉帶塗金鞍勒馬自是尚主者賜率如例後又加賜狨毛暖座嘉祐二年七月五日李瑋請乘服趨朝詔可紹興六年四月丙午江西制置大使李綱獻太上皇帝所賜玉帶玉束帶象簡各一畫二軸詔還以賜綱紹興賜笏紹興二年十一月賜韓世忠帶笏狨坐元年賜劉光世玉帶金帶西蕃鞍紹興玉魚隆興玉佩紹興三十年二月丙子皇子進封建王先是甲戌詔立為皇子三月丁未上謂宰輔曰㑹要云上諭樞臣王綸云云朕決此計已九年建王所佩玉魚乃置𣙜場初買之先是上曰普安封真王俟正謝日賜玉帶甲三十二年五月子立為太子隆興二年十月二十九日詔皇子鄧慶恭王大禮朝祭服玉佩綬以真玉為之先是紹興三十二年十月三日命文思院製皇太子瑜玉雙佩見冕服類唐獨孤申叔服蒼玉賦沈逵山𤣥玉賦裴度古君子佩玉賦魏賜劉幹之郭落吳賜陸遜之金環李靖于闐之寶光顔通化之恩御府分珍煥切磋之文采使詔臨賜新指畫之威儀看山拄頰敢為晉士之清狂上馬設囊豈有唐人之風度執以正容書而待命入趨表著知文竹之非珍傳示子孫庶甘棠之不朽謝賜象簡鮫鱗錯刀魚須飾笏玉海卷八十六
