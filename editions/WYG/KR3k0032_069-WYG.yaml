body:
  text: 玉海卷六十九宋王應麟撰禮儀禮制下唐貞觀禮大唐儀禮禮樂志自梁以來始以其當時所行傅於周官五禮之名各立一家之學唐初用隋禮至太宗時中書令房𤣥齡秘書監魏徵與禮官學士等因隋之禮増以天子上陵朝廟養老大射講武讀時令納皇后皇太子入學太常行陵合朔陳兵大社等共二十九事為吉禮六十一篇賓禮四篇軍禮二十篇嘉禮四十二篇凶禮十一篇是為貞觀禮通鑑百三十八篇與禮樂志數合吉禮之别有大祀中祀小祀而天子親祠者二十有四大祀天地宗廟五帝中祀日星社稷岳瀆小祀風雨靈星山川焉賓禮則以待四夷之君長與其使者蕃國來朝遣使迎勞授館将幣擯享之節焉軍禮之分曰親征曰遣将曰宣露布曰講武曰狩田曰大射而其節則有旗鼓刀矟弓矢跪起偃伏之節焉嘉禮之重者曰加元服曰皇太子冠曰冊后曰太子納妃曰元㑹曰臨軒冊太子曰讀時令曰養老更曰鄉飲酒正齒位焉凶禮天子禮闕蓺文志儀注類大唐儀禮一百卷長孫無忌房𤣥齡魏徵李百藥顔師古令狐徳棻孔穎達于志寧等撰八人吉禮六十篇賓禮四篇軍禮二十篇嘉禮四十二篇凶禮六篇國恤五篇揔一百三十篇貞觀十一年上當參㑹要㑹要武徳初朝廷草創未遑制作郊禋享宴悉用隋代舊貞觀初詔房喬魏徵禮官學士修改舊禮王珪與諸儒正定五禮書成封一子縣男著吉禮六十一賓禮四軍禮十二志軍禮作二十篇嘉禮四十二凶禮六國恤五總一百三十篇分為一百卷凡増二十九件餘並依古禮七年正月二十四日獻之詔行用焉通典貞觀七年頒示舊紀貞觀十一年正月甲寅房𤣥齡等進所修五禮詔所司行用之通鑑十一年三月庚子上丙午詔行之按是書以貞觀十一年正月甲寅上三月丙午始詔頒行實録舊史所載可攷通典㑹要乃以為七年髙祖入闗禮典湮缺竇威多識故事裁定制度帝曰今之叔孫通也房杜為相時天下新定臺閣制度憲物容典率二人討裁温大雅與竇威陳叔達參定禮儀㑹要聖厯元年禮官云貞觀顯慶禮及祠令並無王者告朔之事同上唐三師儀注見儲官類㑹要貞觀十一年太宗謂魏王泰曰禮部尚書兼魏王師王珪汝之事師如事我也十七年詔令撰三師儀注太子出殿門迎先拜三師拜每門讓三師坐太子乃坐與三師書前皇恐後名皇恐再拜唐典儀㑹要典儀二人𨽻門下省初用人皆輕李師政貞觀門下典儀貞觀末李義府為之後常用士人六典周官有司儀蓋典儀之任掌贊唱之節及設殿庭版位之次又禮樂志唐類禮義疏魏徵傳始喪亂後典章湮散徵奏引諸儒校集秘書國家圖籍粲然全整嘗以小戴禮綜彚不倫更作類禮二十篇數年而成帝美其書録寘内府朱文公曰今此書不復見甚可惜也志魏徵次禮記二十卷亦曰類禮又陸質類禮二十卷元行沖類禮義疏五十卷集賢注記張説奏曰魏孫嚴炎始改舊本以類相比有同抄書先儒所非皆不行用徵因炎舊書整比為注隋志禮記三十卷魏秘書監孫炎注諫録戴氏禮并為注解二帙二十卷上之詔曰禮經殘缺戴聖爰記舊聞古今所宗條目雜亂先儒傳授莫能釐正徵有志討論依聖所記更事編録以類相從别為篇第并更注解文義粲然宜付秘書仍繕寫賜皇太子及諸王并賜物千匹㑹要貞觀十四年五月二十一日詔以特進魏徵所撰類禮賜皇太子諸王并藏本于秘府徵以禮經遭秦滅學戴聖編之條流不決乃刪其説以類相從為五十篇合二十卷上善之賜物千段志又有禮類聚十卷開元十四年八月八日太子賓客元行沖等撰禮記義疏五十卷上之張説駁奏遂不得立學留其書内府行沖意諸儒排已著論自釋元行沖傳魏光乗請用徵類禮列于經帝命行沖與諸儒集義作疏将立之學乃引國子博士范行恭注記云文元忠四門助教施敬本采獲刋綴為五十篇上于官右丞相張説建言戴聖所録向已千載與經並立不可罷魏孫炎始因舊書擿類相比有如鈔綴諸儒共非之至徵更加整次乃為訓注恐不可用帝然之書留中不出行沖意諸儒間已著論自辯名曰釋疑曰小戴禮行於漢末馬融為傳盧植合二十九篇而為之解世所不傳康成於竄伏之中理紛拏之典雖存探究咨謀靡所具鄭志者百有餘科章句之徒曽不是省王肅因之或多攻詆而鄭學有孫炎雖扶鄭義條例支分箴石間起増革百篇魏氏疾羣言之冗脞采服説之精簡刋正芟礱書畢以聞太宗嘉賞録賜儲貳云云改易章句是有五難集賢注記左賛善大夫魏哲因入内侍讀奏魏文貞所編禮記甚有條流詔行沖修疏唐顯慶禮永徽五禮禮志髙宗又詔長孫無忌杜正倫等増之為一百三十卷是為顯慶禮其文雜以式令議者以為非上元三年詔復用貞觀禮終髙宗世貞觀顯慶二禮兼行王仲丘傳開元中典章差駁仲丘欲合貞觀顯慶二禮據有其舉之莫可廢之誼上言請祈穀雩祀明堂二禮皆用詔可貞觀禮明堂依鄭義祀五帝顯慶禮祀昊天上帝乾封二年敕祀五帝又制兼祀昊天上帝㑹要永徽二年議者以貞觀禮未備又詔長孫無忌等十三人緝定勒成一百三十卷二百九十九篇舊史五十九至顯慶三年正月五日戊子奏上之髙宗自為之序頒行中外蕭楚材孔志約以國恤禮為豫凶事敬宗義府然之於是刪去至上元三年三月敕依貞觀為定儀鳯元年又詔依周禮二年八月少卿韋萬石奏詔尚書省議自是每有大事參㑹古今禮文臨時撰定明堂大饗兼用貞觀顯慶二禮舊紀顯慶三年正月戊子無忌等修新禮成詔頒天下萟文志永徽五禮一百三十卷長孫無忌等八人撰二百九十九篇顯慶三年上賀紀傳高宗時豫修五禮垂拱二年二月新羅匄唐禮武后賜吉凶禮并文辭五十篇路敬淳傳受詔纂輯慶䘏儀典武后稱之韋叔夏傳武后詔五禮儀物司禮博士有所修革須叔夏等評處然後以聞王方慶傳練朝章尤精三禮門人次為雜禮答問唐開元禮開元後禮志𤣥宗開元十年以司業韋縚為禮儀使掌五禮十四年通事舍人王嵒請刪去禮記舊文而益以今事附唐制度詔付集賢院議張説以為禮記不刋之書不可改唐貞觀顯慶禮前後不同宜加折衷以為唐禮通鑑正月奏乃詔集賢學士徐堅李鋭施敬本撰述歴年未就蕭嵩代説為學士奏起居舍人王仲丘撰定為一百五十卷書目同是為大唐開元禮通鑑二十年九月乙巳新禮成上之號曰開元禮通典同由是五禮之文始備二十年九月頒行之中書令嵩賜絹綵二百餘各一百六典禮部凡五禮之儀一百五十有二通典云百五十有一吉禮其儀五十有五圜丘至拜掃賓禮其儀有六蕃國朝至燕蕃使軍禮其儀二十有三親征至儺嘉禮其儀五十皇帝加元服至宣赦凶禮其儀十有八振荒至王公禮制通議新五禮開元二十年修凡一百五十卷太常博士新五禮儀式㑹要開元二十六年六月二十七日渤海求寫唐禮許之貞元二年六月敕習開元禮者舉一人同一經例九年五月敕問大義百條試䇿三道大中五年十一月太常禮院奏私廟並准開元禮及曲臺禮為定制藝文志開元禮一百五十卷張説請修貞觀永徽五禮命賈登張烜施敬本李鋭王仲丘陸善經洪孝昌撰緝蕭嵩總之人名與禮志詳畧不同蕭嵩開元禮儀鏡一百卷書目止第一至第五五卷又有義鏡畧十卷開元禮京兆義羅十卷類釋二十卷國史志類釋十二卷百問二卷書目凡百篇分上下兩卷韋渠牟貞元新集開元後禮二十卷㑹要貞元十七年七月上通典本百五十卷纂例成三十五卷冀尋閲易周集賢注記開元禮序例三卷吉禮七十五卷賓禮二卷嘉禮四十卷軍禮十卷凶禮二十卷辛秘登開元禮科開元五年田再思議曰鄭王祖經宗傳各有異同荀摰采古求遺互為損益唐禮儀使㑹要開元九年正月韋縚除司業仍知太常禮儀事天寳九載十月置禮儀使以左庶子韋述為之至徳二載閏八月二十九日户部侍郎崔器乾元元年四月太常少卿王璵並知禮儀事十八日璵同平章事為禮儀祠祭等使二年九月七日工部侍郎于休烈廣徳元年太常卿杜鴻漸永泰元年八月十三日辛亥禮部尚書裴士淹並為使大厯五年三月二十六日己丑停禮儀使事歸太常七年正月十九日辛丒復置使以太常卿楊綰兼之十四年五月二十日吏部尚書顔真卿為使建中元年停自後南郊大禮權置使畢日停辛秘再辟禮儀使府禮志開元十一年親享圓丘中書令張説衛尉少卿韋縚為禮儀使崔縱傳貞元元年天子郊見為大禮使撙裁文物儉而不陋崇文目儀注類使範一卷王晉記開元以後使者所用章奏文牒之式凡十二篇國史禮志太常禮院領屬太常祥符中増置禮儀院天聖初元年四月辛丑罷為禮院康定初改判院為判寺兼禮儀事其同知院事必先申寺唯大禮則禮儀置使唐曲臺新禮續曲臺禮元和新禮禮志元和十三年八月太常博士王彦威㑹要云禮院檢討官集開元二十一年以後至元和十三年正月五禮裁制敕格為曲臺新禮三十卷上之又採元和以來至長慶典禮故事不同者益以王公士民昬祭之禮為續曲臺禮三十卷志㑹要崇文目卷同藝文志王彦威元和曲臺禮三十卷又續曲臺禮三十卷𫝊彦威為檢討官采獲隋以來下訖唐凡禮沿革皆條次彚分號元和新禮上之詔拜博士㑹要彦威疏曰自開元二十一年已後迄聖朝垂九十餘年法通㳂革禮有廢興每有禮儀大事命禮官博士約舊損益修撰儀注以合時變臣今所集録開元以後至元和十三年奏定儀制不惟與古禮有異與開元儀禮已自不同矣禮科者名數之總與儀注相扶而行闕一不可今備禮科之單複欲使開卷盡在按文易徵其他五禮儀式或舊儀不載而與新創不同者次第編録曲臺實禮之藏故名曰元和曲臺新禮并目録成三十卷大順元年舊章散失禮院用王彦威曲臺禮欲禘别廟太后于太廟博士殷盈孫非之書目續曲臺禮共目録成三十卷先約舊章始從變禮以商𣙜㳂革新説舊規貫於首篇詳為注釋嗣續前事裴瑾為崇豐二陵集禮藏太常書閣栁宗元序曰韋孟以詩禮傳楚而郊廟之制卒正於𤣥成鄭𤣥以箋注師漢而禪代之儀卒集於小同賈誼以經術起而嘉㝡好學盧植以儒學用而諶為祭法舊史咸以為榮五代㑹要武徳議廟之初英才間出如温魏顔虞通今古封蕭薛杜達禮儀制度憲章必有師法唐禮閣新儀志元和十一年秘書郎韋公肅録開元以後禮文損益為禮閣新儀三十卷崇文目二十卷藝文志三十卷曽鞏序曰三十篇韋公肅撰記開元以後至元和之變禮集賢院書二十篇以目録考次序則篇次亦亂因定著從目録而三十篇復完此書所紀雖其事已淺然凡世之記禮者皆有所本而一時之得失具焉昔孔子於告朔愛其禮之存况著於一代之典籍哉禮者其本在於養人之性其用在於視聽言動之間中興書目公肅取開元以後至元和十年㳂革損益為此書凡十五門每門又别其條目為三十卷一卷為目録止二十九卷今卷存而書不全韋公肅傳元和初憲宗将耕籍詔公肅草具儀典唐詳定典制鄭餘慶傳遷左僕射憲宗患典制不倫謂餘慶淹該前載詔為詳定使舊史元和十三年餘慶為禮儀詳定使俾參裁訂正餘慶引韓愈李程為副崔郾陳佩楊嗣復庾敬休為判官増損儀矩號稱詳衷志餘慶書儀二卷裴度書儀二卷唐古今禮要段文昌傳荆州節度使裴胄採古今禮要為書數從文昌質判所疑㑹要大順元年博士殷盈孫議引古今禮要云周立姜嫄别廟唐紫宸禮要志武后十卷唐禮纂要志栁逞六卷崇文目同唐五禮要記志韋叔夏三十卷叔夏通禮學歴太常博士少卿春官員外郎侍郎每立一議衆諮服之子縚唐禮樂集志顔真卿十卷禮儀使所定王方慶古今儀集五十卷書目歴古創制儀五卷顔真卿撰唐五禮精義志經録禮類韋彤十卷崇文目同書目唐太常博士韋彤撰十卷凡二百九十二條每條設問對先援古禮參以唐制辨據為詳唐六十一家儀注志儀注類六十一家一百部一千四百六十七卷始於衛宏漢舊儀次董巴輿服志終於裴矩虞世南唐書儀若衛宏傅瑗張鏡嚴植之沈約鮑泉明山賓賀㻛陸璉司馬褧張彦常景趙彦深髙熲牛𢎞潘徽摰虞崔豹范汪何𦙍何㸃崔皓盧諶張大頤姚璠令狐徳棻孟利貞裴守真郭山惲之類則五禮儀注之書也若董巴之志徐廣車服雜注大駕鹵簿周遷蕭子雲雜事則輿服之書也以議名者有何晏等魏晉諡議魏氏郊丘髙堂隆訪議孔晁明堂郊社蔡謨七廟干寳荀顗雜議以典名者有范汪祭典王景之要典王逸齊典丘仲孚皇典盧辨祀典家儀書儀則有徐爰王儉鮑衡卿謝朏謝允唐瑾裴矩虞世南之書玉璽譜録則有紀僧真姚察徐令言之書雜記則有童悟東宫雜事典記之書失姓名三十二家不著録自竇維鍌禮要以下至杜有晉書儀四十九家八百九十三卷貞觀永徽開元禮在焉隋志儀注自漢舊儀至要典雜事五十九部二千二十九卷六典儀注自漢舊儀等五十九部二千二十九卷崇文目一十八部一百十卷始于正辭録終于鹵簿圖記中興書目六十家一千二百二十三卷唐舊志儀注八十四部一千一百四十六卷自漢舊儀至皇太子方岳亞獻儀周通禮世宗顯徳五年十一月庚戌敕竇儼集通禮儼上言禮者太一之紀品物之宗自五帝之後三代以來損益因革咸有憲章越在唐室程軌量昭采物則有開元禮在紀先後明得失則有通典在録一代之事包五禮之儀比類相從討尋不紊則有㑹要在三者經國之大典也梁朝之後戎祀朝㑹多於市廛草定儀注前代矛盾率多粃粺請依唐㑹要門類上自五帝迄于聖朝悉命編次開元禮通典之書包綜于内名曰大周通禮俾禮院掌之開寳通禮義纂開寳四年五月命中丞劉温叟中書舍人李昉知制誥盧多遜扈蒙詹事楊昭儉補闕賈黄中司勲郎和峴中舍陳鄂以本朝㳂革制度損益開元禮為之劉温叟卒又以知制誥張澹參其事其年六月丙子書成上之凡二百卷目録二卷號曰開寳通禮藏於書府長編云四年六月丙子初命修書六年乃成實録本紀恐誤六年四月十八日辛丒翰林學士盧多遜又上新修開寳通禮義纂百卷長編云通禮二百卷亦四月辛丑與義纂同上詔付禮院是日行通禮其禮部先有鄉貢開元禮一科自今宜改稱鄉貢通禮逐年攷試並以新本出題天聖元年五月庚午改為正禮太祖尤重典禮建隆二年集三禮圖乙熙寧廢通禮科元祐六年四月未復置崇文目通禮二百卷義纂一百卷通畧開寳四年上謂國家㳂革制度多以開元為據然今有所未備乃命撰通禮至是成六月丙子上之淳化内外官儀制又見朝儀四年六月甲戌尚書省重定内外官參集儀制及比視品秩以聞詔有㫖頒行祥符定羣臣儀制見朝儀三年十二月王欽若等上天書儀制五卷四年十月戊辰賜學士李宗諤宴上曰翰林清華之地卿父子為之必周知故事宗諤嘗著翰林雜記國朝新制翌日上之手詔褒答景徳閤門儀制合班圖景徳元年二月壬午翰林學士梁顥知制誥李宗諤通事舍人焦守節等言詔詳定閤門儀制令重加刋正以類分門共成六卷㑹要云咸平六年十一月於長春殿面奉聖㫖閤門儀式若全依典故恐難遵行且約見行儀式重加増損令各分類例共成六卷其有合増損詳定處並貼黄進呈其春秋大宴小宴賞花行幸宴㑹各按合班圖位次為四圖請班下閤門遵守仍先勒三館寫儀制四本一進内二送閤門充正副一送御史臺從之初上以閤門儀制多出於曹史之言殊無規矩乃命顥等詳定至是來上祥符元年八月丁未中書門下言合班儀門下中書侍郎相承在左右常侍之下望升在常侍之上合班次六尚書從之四年六月庚申詔右諫議陳彭年與龍圖閣待制張知白王曉四方館使白文肇東上閤門使魏昭亮同詳定閤門儀制五年六月丁未草具進呈賜食于起居院實録云上儀制詔付有司閏十月庚寅龍圖閣學士陳彭年等進新定閤門儀制十卷客省事例六卷四方館儀制一卷帝曰修録詳備甚有倫理特詔奬諭賜器幣儀制各付有司遵行又以别本留中九年正月己巳詔宗正定宗室班圖景祐三年正月二十一日丙午四月館使夏元亨請修定閤門儀制元亨言祥符後續降詔敕或有重復請復編次命翰林學士承㫖章得象知制誥李淑同詳定康定元年四月修成閤門儀制十二卷四方館條例一卷客省條例七卷長編寳元二年二月庚寅詳定閤門客省四方館儀制所上新編儀制十三卷治平元年閏五月詔閤門一月一次進班簿志熙寧二年四月二十三日命宋敏求編修閤門儀制取唐宣政殿制裁定有司請製大黄麾以立仗帝重其事以為寧闕而未備及政和上大慶文徳紫宸受朝之儀而儀衛益盛書目合班儀仁宗朝修定國史志宋綬内東門儀制五卷李淑閤門儀制十二卷梁顥閤門儀制六卷祥符御史臺儀制書目六卷祥符中參政張知白等詳定天聖禮閣新編天聖五年十月辛未太常博士同知禮院王皥所撰禮閣新編六十卷或作五十卷書盡乾興初天禧中同判太常禮院陳寛請編次本院所承詔敕其後不能就皥因取國初至乾興所下詔敕刪去重複凡千八百三十道類以五禮之目成書上之賜五品服志云大率吏文無著述之體而所載本末全具有司便於檢用熙寧十年七月二十七日丙子詔太常禮院續修禮閣新編天聖内東門儀制九年六月庚辰翰林學士宋綬西上閤門使曹琮夏元亨新編皇太后儀制五卷詔名内東門儀制五代史鄭餘慶采唐士庶吉凶書疏之式雜以當時家人之禮為書儀兩卷後唐明宗詔劉岳刪定與段顒田敏増損其書而事出鄙俚轉失其本然猶時有禮之遺制後世士庶吉凶皆取嶽書為法而十又失其三四五服制度附于今自馬縞始中興書目曲臺奏議集上下兩卷五代唐袐書監陳致雍撰徐鍇序五禮儀鏡六卷致雍撰止有嘉軍凶三禮儀疑非全書儀二卷劉岳撰景祐太常新禮慶厯祀儀景祐四年三月庚子同知太常禮院吳育言今禮院所藏禮文故事未經刋修而類例不一請擇儒臣與本院官約古今制度參定為一代之法從之至慶厯四年正月辛卯提舉賈昌朝編修官孫祖徳李宥張方平吕公綽曽公亮王洙孫瑜余靖刁約上之為太常新禮四十卷慶厯祀儀六十三卷賜器帛書目云凡一百二十篇止慶厯三年志云漏畧短於采獲寶元二年六月丁卯天章待制賈昌朝直史館宋祁同修纂禮書康定元年十月癸巳館閣校勘刁約歐陽修同修禮書嘉祐朝制要覽書目十五卷凡四十門嘉祐中宋咸撰載朝廷制作有司儀式中興書目有皇朝儀物志三卷記皇朝見行禮儀及名物制度訖于神宗朝治平太常因革禮元豐紹興續編因革禮嘉祐六年七月己丑命姚闢蘇洵同禮官編纂禮書初判太常寺歐陽修言太常典禮所在而文字散失請命官纂集庶以備討論而傳後世時朝廷重置局止命禮院官是嵗祕閣校理張洞奏請擇文學該贍者三兩人置局命判寺一員總領知制誥張瓌又奏欲謹擇有學術方正大臣與禮官精議是非釐正紬繹然後成書時修為參政又命之提舉治平二年九月辛酉書成凡百卷有序一篇目録一卷以開寳通禮為之主而記其變其無所㳂於通禮者謂之新禮通禮所有而建隆以來不復舉者謂之廢禮凡立廟有議論謂之廟議餘即用通禮條目修與判寺李柬之等上之詔賜名曰太常因革禮自建隆汔嘉祐藏之祕閣志云異於舊者十三四然繁簡失中缺亡不補元豐七年六月六日甲戌尚書禮部言歐陽修等修因革禮始於建隆迄於嘉祐為百卷嘉祐以後闕而不録熙寧以來禮文制作足以垂法萬世宜下太常委博士接續修纂以備討閲從之九月二十三日詔禮官續編訖于元祐初紹聖三年禮部尚書林希言近年缺而不續四月己巳詔復編政和三年二月中書舍人蒋獻請續修之見後宣和三年四月二十六日臣僚請五年一修從之紹興元年七月七日章傚上歐陽修編纂太常因革禮一百卷詔付太常是年十一月八日辛丑太常少卿趙子晝言政和宣和續編因革禮渡江皆散失欲自渡江以後修纂成書目為紹興續編太常因革禮詔可其後明年太常以總例及吉凶嘉新四禮凡八十六篇二十七卷或云三十卷始於建炎至紹興二年編類粗成未以進御九年太常丞梁仲敏言紹聖三年以後修纂尚缺請委官編類詔本寺續修不克成書淳熙十二年三月庚子始進中興禮書三百卷熙寧閤門儀制見上七年八月癸巳右諫議集賢學士宋敏求上編修閤門儀制十冊元豐郊廟奉祀禮文元豐元年正月十二日戊午詔判太常寺樞密學士陳襄同修注黄履集賢校理李清臣王存詳定郊廟奉祀禮文太常簿楊全著作佐郎何洵直直講孫諤為檢討官先是手詔講求郊廟禮文令奉常置局討論厯代沿革以考得失故命襄等二年正月六日丙子命陸佃兼詳定三年正月二十五日又命張璪詳定閏九月二十五日中書請令檢討官楊全編類上進以備乙夜之覽副在有司從之五年四月壬戌十一日成書三十卷目録一卷崇文院校書楊全編類以進紹興十九年十一月癸未著作佐郎劉章請命官為紹興郊廟奉祀禮文以續元豐之書上嘉納書目每篇先敘厯代沿革次以議奏以見其施行與否四朝志天子鋭意稽古禮文之事招延羣英折衷同異元豐有詳定禮文所大觀有議禮局政和有禮制局元祐禮書五年十一月一日壬戌給事中范祖禹言太祖時聶崇義所撰三禮圖書於國子監講堂伏見太常博士陳祥道専意禮學所進禮書一百五十卷比崇義圖尤為精密請付太常與崇義圖參用詔兩制看詳以聞政和五禮新儀御製冠禮書目二百四十卷鄭居中等撰二百二十卷御製序一卷御筆指揮九卷御製冠禮十卷合二百四十卷又目録六卷在外政和三年正月二十九日壬午頒行五禮新儀先是大觀元年正月朔詔講求典禮十三日尚書省置議禮局二年十一月十七日御製冠禮㳂革十一卷付議禮局餘五禮令視此編次四年二月九日戊寅修成大觀新編禮書吉禮二百三十一卷祭服制度十六卷祭服圖一冊詔行之政和元年三月六日續編成賓軍等四禮四百九十七卷詔頒行於是鄭居中等奏編成政和五禮新儀并序例總二百二十卷目録六卷三年三月癸亥朔御製序曰循古之意而勿泥於古適今之宜而勿牽於今議禮局請刻石太常寺七月己亥詔比裒集三代鼎彛簠簋盤匜爵豆之類五百餘器載於圖詔有司改造祭器置禮制局討論古今㳂革以成一代之典六年閏正月太府丞王鼎言新儀藏在有司民未通曉望依新樂頒行令州縣召禮生肄業使之推行民間并以新儀從事二十五日從之范寅賓新儀撮要十五卷紹熙二年八月黄灝請掇取􅃣昏喪祭儀摹刻攽郡縣奏可元豐六年六月四日詔集議大典禮令秘書省長貳與政和續因革禮四年葛勝仲為太常少卿自建隆至治平初所行典禮嘗為書百篇勝仲續其書自治平迄政和四年部居條目皆視歐陽修之舊總例凡五十三卷吉禮九十四卷賓禮十三卷軍禮四卷嘉禮三十三卷凶禮七十七卷廟議二十七卷合三百卷目録三卷與前書併藏奉常又編纂太常祠祀儀制格目每嵗大祠凡九十有六中祠凡二十有九小祠凡一十有四每祠為一卷嵗再祀或四時祀或月祀若祭名異而祀儀相類則合一卷凡四十八卷標録二卷續因革禮序曰政和三年二月中書舍人蒋猷建言詔命撰次至二年終四年十月詔編至四月終明年六月書成國史志開寳已後三輯禮書推其要歸嘉祐尤悉然繁簡失中訛缺不備豈有所拘而不得騁乎紹興太常初定儀注書目三卷紹興中太常所定明堂元年九月十八日行禮十年再定儀注郊祀大禮十三年十月十三日定儀十一月八日郊大禮前朝獻景靈宫七年八月十七日定明堂朝獻之儀十三年十月四日定迎奉神御欵謁之儀十二日定郊祀朝獻之儀朝饗太廟十三年十月十二日定郊祀朝饗之儀四孟朝獻十三年七月十八日己未定儀親饗太廟十二年十二月十四日定儀藉田十六年正月五日定儀二十二日行禮親祠髙禖二年二月二十一日定宮中飲福受胙之儀十七年二月三日定親祠上皇太后冊寳十年十一月十一日定儀十二月十二日壬午行禮中宫受冊寳十三年閏四月十三日定儀十七日行禮正旦大朝㑹儀注十四年十二月二十三日定儀十五年正旦行之行宫門肆赦儀注十三年十月十三日定天申節紫宸殿上夀儀注十三年五月七日定二事書目中不載紹興元年始作蒼璧黄琮十年明堂始備大樂飲福用金爵十二年製常行儀衛十三年始復朔日視朝之禮又行孟饗備五輅及建金雞肆赦祠祭始用牲十四年復教坊建宗學作渾天儀十五年初藉千畆及行大朝㑹禮作新祭器十六年始備八寶鑄景鍾建御書院太廟祏室及賜講畢御筵十七年始命太常行園陵御史監視及賜新進士聞喜宴十八年始繪配享功臣像于景靈宫庭之兩壁十九年始復蜡祭及諸陵薦新二十七年始復太廟功臣七祀之祭及諸大祀盖自息兵後将二十年而禮樂始備紹興禮器射殿觀郊廟禮器紹興四年四月六日禮官言明堂大禮自天地至從祀諸神七百七十一位當用籩豆簠簋尊罍彛鼎之屬九千二百五太廟用五百九十六舊用銅玉者權以陶木代之㑹要云十三年二月九日禮官討論郊廟祭器云云五月二十五日甲戌太常看詳胄監丞王普所言今祭器倣三禮圖非是請改作普上言十二事普上言陶匏用於郊丘玉爵用於明堂又言十二尊之數每祭特用其四一實醴齊一實明水以待朝踐一實盎齊一實明水以待再獻餘以實五齊三酒是為八尊設而不酌又言按儀禮圖爵如爵形負盞於背不可以反坫簠簋如桶其上為龜不可以郤盖而播餘盖出於意度而未嘗親見古器也自劉敞著先秦古器記歐陽修著集古録李公麟著古器圖吕大臨著攷古圖親得三代之器政和新成禮器制度皆出於此度江散失無存欲並從古器制度為定時政和新成禮器獨存五件請用政和新禮改造皆未克行九年八月十五日詔禮官討論祭服禮器十二年五月十九日有司請増修太廟祭器十三年二月二十七日攽宣和博古圖俾禮官釐正改造大禮祭器悉從古制十四年七月丁巳命有司改作祭器給事中段拂户部侍郎王鈇董其事三年乃成十五年十月二十七日王晉錫言大禮饗廟禮器已對御府博古圖畫様製其尊罍等五百九十六件合討論製造詔拂等討論十一月癸亥宰執奏新製祀享禮器事十二月十七日上諭大臣将來禮器成宜以制度攽示州縣俾之遵用庶革舛誤十六年三月二十六日禮官請如政和六年郊廟禮器之數於天地宗廟每神位用籩豆各二十有六簠簋各八八月庚戌宰臣奏禮器將畢上曰鍾磬音律皆龢惟黄鍾大吕未應律宜詳加講究冬十月郊廟新禮器成戊戌二日上觀于射殿宰執侍從臺諫宗室禮官皆與觀撞景鍾奏新樂用皇祐故事也上曰祀帝享廟禮典一新於是段拂已下皆遷秩十一月丙子合祀天地于南郊備祭器設八寳如政和之儀由是禮器復新乾道九年六月修飾太廟銅器二千一百七十二紹興十六年三月辛卯用政和制賜秦檜家廟祭器其後韋淵吳益楊存中吳璘虞允文皆賜淳熙七年十月上問家廟制度且曰漢唐而下未有賜祭器者令禮官討論八年十月止令有司精製爵勺各一賜韓世忠家餘令禮官定禮式畫圖成冊賜之聴自造並用竹木從崔端詩議也紹興皇宋大典六年五月辛卯二十四日成忠郎李沇以髙祖國子博士文易新編皇宋大典三卷來上詔送秘府沇遷秩其書以皇朝所定班序圖次禮容儀式衮冕車輅旗章冊命之制與夫民兵吏禄祠祭户口之數凡四十門釐為三卷淳熙中興禮書嘉定續中興禮書太常少卿余端禮請編類書久不上淳熙七年七月十一日禮部郎范仲藝言太祖立經陳紀為萬世規首命大臣約唐禮書著為通禮列聖相承有禮閣新編太常新禮因革禮五禮分門各以類舉自時厥後繼纂續編中興以來久缺不録望命太常編次大臣兼領其事以著一代彌文考百世損益詔趣成書八年三月七日太常簿陳賈奏自紹興初載首行明堂至今五十餘年大典禮制作總為目者百一十四分門第卷不知其幾太常編類懼難辨集詔禮部長貳同刪修初紹興間太常少卿趙子晝為續因革禮三十卷其後禮官踵為之書成未得進御十二年三月二十七日權禮部侍郎史彌大言太上再造講明典禮陛下紹統如内禪慶夀之類亘古所無宜宣取以進略經乙覽付之有司俾常遵守不必備儀衛施爵賞詔禮部太常寺繳進四月十七日上之凡三百卷或云三月庚子進常少王信序書目云成於十一年賜名中興禮書總六百八十門嘉泰二年八月十七日禮部尚書費士寅等言禮寺以孝宗一朝典禮續纂中興禮書八十卷詔令繳進嘉定十一年三月丙申禮部員外郎李琪奏請令太常将慶元元年以後典禮編纂成書淳熙書目儀注類六十家定著一千二百二十三卷始於政和五禮新儀終於儀物志三卷續目八家九部四十三卷祥符五年六月己未修國史院言所修禮志舊日厯止存事端令禮院取索國初以來禮文損益沿革制作之事及論議詳定文字尚慮有遺致大典未備孫奭判禮院禮學精博望委檢討從之嘉定通禮六年秘書少監李􅌫纂公侯守宰士庻為通禮三十卷取開寳政和凡通行者分别五禮類為一編朱文公曰祭器經政和改制盡取古器物之存於今者以為法今郊廟所用則其制也而州縣專取聶氏三禮制度非復古制司馬光書儀八卷朱熹纂次古今家祭禮十有六篇許洞撰訓俗書一卷禮謂之文者尊卑異位親踈異情長幼異序内外異宜徃來異守動而相交合而相紀莫不成文而中於義理序其品則曰人倫序其義則曰禮文朝廷所以綱天下之風俗不可以一日無之也禮之為國與天地並上天下澤春靁奮作先王觀象爰制禮樂其本則人心固有其文則聖人為之禮者敬之經敬者禮之情無敬無以行禮無禮無以節敬禮之本出於民情聖人因而導之禮之器出於民俗聖人因而節文之禮始於天而成於人張曹争論於漢朝荀摯競爽於晉世天髙地下萬物散殊而禮制行矣天理之節文人事之儀則韓宣子見周禮盡在魯知周所以王仲孫湫見魯秉周禮知魯未可動為天下國家者不可一日廢禮如此莊公有非禮之舉其臣諫以必書周王有非禮之宴戒其臣以勿籍先王之時凡禮文之事無不載之簡冊也士㑹不知殽蒸歸而講聚三代之典禮以修晉法孟僖子不能相儀答郊勞歸乃講學能禮者必從之君子耻不知禮如此朝廷有大疑不必聚諸儒之訟國家有盛容不必蕝野外之儀禮上下之紀天地之經緯也其事朝聘冠昏喪祭射饗其用郊廟朝廷閨門學校鄉黨田役其物圭璧冠珮車輿贄幣俎豆弓矢其容齋莊恭肅雍和剛毅忻懽慘戚其人君臣父子兄弟夫婦朋友長幼其効嚴上下定尊卑決嫌疑别同異事天地寧􅀑神玉海卷六十九
