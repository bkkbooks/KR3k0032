body:
  text: 玉海卷十九宋王應麟撰地理州鎮漢八鎮揚雄𫝊校獵賦戲八鎮而開闗注應劭曰四方四隅為八鎮如淳曰不言九者一鎮在中天子居之故也三國重鎮通典魏氏有州十二有郡國六十八東自廣陵壽春合肥沔口西陽襄陽重兵以備吳西自隴西南安祈山漢陽陳倉重兵以備蜀蜀置益梁二州有郡二十二以漢中興勢今洋川白帝為重鎮吳置交廣荆郢􅀭五州有郡四十三以建平今巴東西陵樂鄉南郡巴丘夏口武昌皖城牛渚圻今采石濡須塢為重鎮其後得沔口邾城廣陵邾城赤烏四年陸遜常以三萬兵戍之東晉以合肥淮隂壽陽泗口角城為重鎮泗口劉遐鎮守今淮隂郡宿遷縣界角城義熙中置亦在宿遷界大抵上明上明今江陵郡松滋縣江陵夏口武昌合肥壽陽淮隂常為晉氏鎮守宗預曰東益巴丘之戍西増白帝之守皆事埶宜然南鄭襄陽懸瓠彭城歴城東陽皆為宋藩扞齊南鄭樊城襄陽義陽壽春淮陽角城漣口朐山為重鎮梁雍州下溠戍夏口白茍堆硤石城合州即合肥鍾離淮隂朐山為重鎮諸葛亮𫝊荆州北據漢沔利盡南海東連吳㑹西通巴蜀此用武之國益州險塞沃野千里天府之土髙祖因之以成帝業若跨有荆益保其巖阻命一上將將荆州之軍以向宛洛身率益州之衆出於秦川周瑜𫝊得蜀而并張魯因留奮威固守其地據襄陽以䠞操北方可圗也魏王基𫝊孫權再至合肥一至江夏其後全琮出廬江朱然冦襄陽皆無功而還宋志三國鼎跱吳得􅀭荆交三州蜀得益州魏氏猶得九焉吳又分交為廣魏末平蜀又分益為梁宋何承天曰曹孫之霸才均智侔江淮之間不居者數百里魏捨合肥退保新城吳城江陵移入南岸濡須之戍家停羨溪及襄陽之屯民居星散晉宣王謂宜徙沔南以實水北曹爽不用果亡沮中胡氏曰當孫氏時上流欲爭襄陽而不得故以良將守南郡與夷陵下流欲爭淮南而不得故以大衆築東興與皖口中流欲爭安陸而不得故以三萬勁卒戍邾城洪邁曰自荆襄訖丹陽皆晉所經畧為荆州者必都督八州為南徐者必加督兖豫事力雄盛兵將相習一州有缺非中外宿望不輕得處陶侃桓沖為荆州温嶠庾亮為江州皆終其身不它徙故能以再造之國而屹然與北方爭雄吳十鎮元和郡縣志吳黄武元年陸遜大破蜀於夷陵遂改夷陵為西陵陸抗疏曰西陵國之西門雖易得亦易失如有不虞當傾家爭之即此處也謹按孫氏自鼎足後自黄武初破蜀先主後得之天紀四年晉軍沿流來伐守將吳彦請増兵不從即今巴東郡也建安二十四年西蜀將闗羽北討魏將于禁等于襄陽陸遜為宜都守鎮此黄武初蜀來伐遜大破之後步闡陸抗並鎮焉即今夷陵郡也吳建衡三年陸抗所築樂鄉城後朱然修之戍焉晉王濬攻樂鄉獲水軍督陸景平西將軍施洪以城降在江陵郡松滋縣東自建安末尅闗羽後蜀麋芳來降遂得之鳳凰元年將張咸天紀末伍延並守之晉軍平吳杜元凱赴於此即今江陵郡也建安十九年魯肅寳鼎元年萬彧並鎮守即今巴陵郡也建安十三年孫權征黄祖剋之後將軍胡奮赴於此即今江夏郡也甘露元年城武昌陸遜諸葛恪滕收皆鎮守及晉平吳將軍王戎赴此即今江夏郡也建安十九年權征皖音患尅之赤烏四年諸葛恪屯此即今同安郡也天紀末何植鎮守晉平吳大將王渾赴於此即今宣城郡當塗縣采石也建安十七年築塢後曹公頻來攻不尅今在歴陽縣西南八十里右十鎮並為重鎮陸抗𫝊永安二年都督西陵建衡二年都督信陵西陵夷道樂鄉公安諸軍事治樂鄉西陵建平國之蕃表既處下流受敵二境若敵汎舟順流舳艫千里星奔電邁俄然行至非可恃援他部以救倒懸也周瑜𫝊出備牛渚屯據江陵晉氏南遷以揚州為京畿糓帛所資皆出焉以荆江為重鎮甲兵所聚盡在焉三州戸口居江南之半庾翼𫝊八年春上表請據樂鄉廣農稸糓以伺二冦之釁南史荆􅀭二州戸口居江南之半江左以來揚州為根本委荆州以閫外晉江東鎮戍列傳王述歴庾氷征虜長史時庾翼鎮武昌欲移鎮述與庾氷牋曰安西欲移鎮樂鄉彼去武昌千有餘里數萬之衆造創移徙興立城壁公私勞擾又江州當泝流數千供繼軍府力役増倍且武昌實是江東鎮戍之中非但扞禦上流而已急緩赴告駿奔不難若移樂鄉逺在西陲一朝江渚有虞不相接救方嶽重將當居要害之地為内外形勢使闚􅎿之心不知所向翼遂不移鎮桓沖欲移阻江南上疏曰自中興以來荆州所鎮隨宜迴轉温經畧中原因江陵路便即而鎮之事與時遷勢無常定今宜全重江南輕戍江北於是移鎮上明蔡謨成帝時庾亮以石勒新死欲移鎮石城為滅賊之漸事下公卿謨議曰沔水之險不及大江大江不能禦蘇峻而以沔水禦季龍以我所短擊彼所長懼非廟勝之筭亮不果移鎮庾亮上疏曰襄陽北接宛許南阻漢水其險足固其土足食臣宜移鎮襄陽之石城遣諸軍羅布江沔比及數年戎士習練乗釁齊進以臨河洛庾翼欲率衆北伐上疏移鎮安陸至夏口復上表曰襄陽荆楚之舊西接益梁與闗隴咫尺北去洛河不盈千里土沃田良方城險峻水路流通轉運無滯進可以掃盪秦趙退可以保據上流輒量宜入沔徙鎮襄陽陶侃以江陵偏逺移鎮巴陵詔都督江州因移鎮武昌遂平襄陽議者以武昌北岸有邾城宜分兵鎮之侃曰我所以設險而禦冦正以長江耳邾城隔在江北内無所倚外接羣夷必引冦虜且吳時此城乃三萬兵守今縱有兵守之亦無益於江南何充曰荆楚國之西門戸口百萬北帶彊胡西隣勁蜀經略險阻周旋萬里得賢則中原可定勢弱則社稷同憂禇裒假節鎮京口即日戒嚴直指泗口率衆三萬徑進彭城温嶠為江州刺史鎮武昌陳豫章十郡之要宜以刺史居之尋陽濱江都督應鎮其地今以州帖府進退不便且古鎮將多不領州皆以文武形勢不同故也宜選單車刺史别撫豫章専理黎庶詔不許王羲之論時事曰願令殷浩荀羨還據合肥廣陵許昌譙郡梁彭城諸軍皆還保淮為不可勝之基須根立勢舉謀之未晚元魏六鎮見城類魏蘭根說李崇宜改鎮立州分置郡縣崇奏聞不報見於史者懷荒沃野武川懷朔髙平薄骨律通典靈州懷逺漢富平縣也後置六鎮三戍在此縣界北北史正光五年八月丙申改鎮為州太和十八年八月丁未幸懷朔武川撫㝠柔元等四鎮通典又有御夷鎮六鎮並在今馬邑雲中單于界正始中源思禮以跋野置鎮居南與六鎮不齊更立三戍亦在馬邑等郡界唐河曲六州黙啜𫝊求六州降戸初突厥内屬者分處豐勝靈夏朔代間謂之河曲六州降人納言姚璹等建請與之紀貞觀三年是嵗中國人歸自塞外及開四夷為州縣者百二十餘萬人六年是嵗諸羌内屬者三十萬人唐四鎮龜兹傳太宗以阿史那社尒為崑丘道大總管率安西都䕶郭孝恪等討之執焉耆王阿那支龜兹大恐社尒破五大城諭降小城七百餘西域震懼初孝恪之擊焉耆也龜兹有浮屠善數歎曰唐家終有西域不數年吾國亦亡帝受俘紫薇殿貞觀二十三年始徙安西都䕶於其都統于闐碎葉疏勒號四鎮儀鳳時吐蕃攻焉耆以西四鎮皆没咸亨元年四月二十二日罷四鎮紀四月癸夘廢長壽元年十月丙戌武威道總管王孝傑破吐蕃復四鎮地置安西都䕶府於龜兹十一月一日以兵三萬鎮守於是沙磧荒絶民供貲糧苦甚議者請棄之武后不聴吐蕃𫝊議者請廢四鎮勿有也右史崔融獻議曰太宗踐漢舊跡並南山抵葱嶺剖裂府鎮煙火相望吐蕃不敢内侮髙宗時棄四鎮不能有而吐蕃遂張入焉耆之西今孝傑一舉而取四鎮還先帝舊封若又棄之是自毁成功也四鎮無守胡兵必臨西域西域震則威憺南羌南羌連衡河西必危議乃格咸亨元年入殘羈縻十八州率于闐取龜兹撥換城於是安西四鎮並廢狄仁傑𫝊時發兵戍疏勒四鎮仁傑諌曰右戌四鎮左屯安東轉輸不絶若捐四鎮肥中國省軍費於逺方并甲兵於要塞邊州之備豐矣不納郭元振𫝊武后時吐蕃大將論欽陵請罷四鎮兵披十姓之地元振上疏宜以䇿緩之神龍中以御史吕守素處置四鎮焉耆𫝊長安時以過使客不堪其勞詔四鎮經畧使禁止開元七年十姓可汗請居碎葉安西節度使湯嘉惠表以焉耆備四鎮詔焉耆龜兹䟽勒于闐征西域賈各食其征于闐𫝊乾元三年以葉䕶曜為同四鎮節度副使李嗣業為䟽勒鎮使劉沔為振武節度開成三年築都䕶府西北四壘㑹要蘇氏記曰咸亨元年四月罷是龜兹于闐焉耆䟽勒長壽二年十一月復四鎮是龜兹于闐䟽勒碎葉兩敕四鎮不同開元六年三月湯嘉惠除四鎮節度經畧使二十一年十二月王斛斯除安西四鎮節度開元十二年已後或稱磧西或稱四鎮節度十五年三月分伊西北庭為兩節度二十九年十月二十九日屬四鎮節度又分為兩道天寶十二載三月始以安西四鎮節度封常清兼伊西北庭節度通鑑自吐蕃陷河隴伊西北庭節度使李元忠四鎮留後郭昕閉境拒守志隴右道四鎮都督府州三十四咸亨元年吐蕃陷安西罷四鎮長夀二年復置龜兹都督府領州九貞觀二十年平龜兹置毗沙都督府本于闐國領州十貞觀二十二年内附初置州五高宗上元二年置府析州為十焉耆都督府貞觀十八年滅焉耆置有碎葉城調露元年都䕶王方翼築䟽勒都督府貞觀九年内附置領州十五𨽻安西都䕶府六典磧西節度使其統有安西䟽勒于闐焉耆為四鎮經畧使通鑑開元三年郭䖍瓘兼安西大都䕶四鎮經畧大使㑹昌三年三月議復河湟四鎮十八州以給事中劉濛為循邊使通典鎮西節度使統龜兹焉耆于闐䟽勒國唐節度㑹要景雲二年四月賀拔延嗣除涼州都督充河西節度自此始有節度之號通鑑景雲元年以幽州鎮守經畧節度大使薛訥為左武衛大將軍兼幽州都督節度使之名自訥始通典十節度六典八節度賈耽十道錄二十一節度宋朝節鎮節度州郡名鎮鎮東紹興㑹稽柬粤稽山鎮南隆興豫章洪都南昌洪井鎮江潤丹陽京口南徐朱方北固鎮西麟新秦銀城麟府麟城鎮安陳淮寧淮陽宛丘鎮潼華華陰桃塞潼關鎮洮熈臨洮洮河狄道鎮寧澶開徳澶淵澶水北輔鎮海青北海營丘青社安安德閬閬中閬水巴西閬川安逺德安安陸鄖國溳水安化密高密東武臨元祐三年改海軍安武兾信都中兾冀方安國邢信徳鉅鹿邢臺襄國安慶安慶同安舒城龍舒皖城遂安嚴新定嚴陵嚴瀬軍舊曰建徳普安隆慶劒普安劒門陰平劒水昭昭慶安吉吳興苕水苕川霅川昭化金安康淯陽洵水洵陽淯水洵城漢陰媯汭昭信贛南康贛川章貢昭德潞上黨潞國壼關徳靖國元年改隆府武武安潭長沙星沙昭潭武昌鄂江夏夏汭鄂渚武當均武當鄖鄉鄖城均陽武信遂寧遂寧蓬溪武康洋洋川駱谷洋水興勢武泰紹慶黔黔中彭江彭水黔江武成滑靈河滑臺成本名義武勝鄧南陽武寧徐彭城徐方徐土西楚威武福長樂閩山七閩雄武秦天水成紀秦川函秦保保康房房陵上庸防渚庸郡保信廬廬江淝水合肥保寧婺東陽金華星婺保靜宿符離保大鄜洛交鄜畤鄜城洛川保平陜陜陜津芳津召南保順洮臨洮洮河洮陽洮水保慶拱襄邑東輔拱輔保成府建炎元年改府谷安舊曰永軍寧寧武利益川昌綿谷葭萌嘉川利川寧江䕫雲安巴東䕫國寧逺容普寧容管容江寧國宣宣城宛陵寧海臨安餘杭武林錢唐奉寧鄭滎陽新鄭圃田滎澤泰寧兖襲慶魯郡曲阜嶧陽興寧寧彭原寧陽北地慶慶逺宜龍水宜城宜水宜陽慶陽慶安化肇慶端高要端溪集慶亳譙郡譙城景亳亳社蒙城崇慶蜀唐安晉原江源重慶渝南平渝水巴郡三巴巴渝嘉慶嘉定犍為漢嘉永慶康德慶晉康瀧水慶