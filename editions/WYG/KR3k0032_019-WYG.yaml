皆受約束令修庭戶之間人自得於江山之外王仲舒潜藩分閫是為翼軫之區連帥選才無越台衡之舊召伯教明南國韋丹功被八州於江西八州無遺便獨孤及為洪州刺史張鎬頌云家有膏雨户有陽春中興李綱趙鼎周必大㑹府之雄中興牧伯半用政塗之舊紹興三年趙鼎江西大使兼洪州江州安撫使沿江制副都統制尋陽九江湓城浦晉置州初治豫章後治於此中流襟帶常為重鎮國之南藩要害之地舟車衝要湓江帶其右廬阜居其前彈壓九派襟帶上流控西江之要地宿南渡之重師據大江為中流宿勁兵為重鎮西挹武昌東引京口陸通五嶺江行岷漢亦一都㑹南北以長江為限東西以中流為防漢盧植才兼文武拜九江守晉桓沖曰尋陽西連荆郢陶侃温嶠庾亮褚裒為刺史中興朱勝非安撫大使兼守岳飛以江西制置使駐江州備南康興國江西飛兼制置舒蘄荆南鄂岳黄復漢陽德安上流要地中興置都統以廣屯備揚州制垣九郡安撫使兩淮制置大使淮南廣陵斗牛之分江都淮海枕江臂淮重江複關之奥四㑹五達之莊江左大鎮以揚州為根本長淮都㑹南躡鉅海之滸北壓長淮之流俯江湄瞰京口淬蘭錡之戎械増堅金之外郛江漢匪安匪舒淮夷來鋪常武整我六師以脩我戎戒我師旅率彼淮浦省此徐土不留不處三事就緒鋪淮濆執醜虜截彼淮浦王師之所牧臣司揚魏文見江濤以為天限南北吳自西陵至江都五千七百里道里甚逺必爭之地不過數四猶人有八尺之軀䕶風寒亦數處耳魏淮南北有四萬人且田且守晉祖逖屯於淮陰尅譙城黄河以南盡為晉土謝安出鎮詔求文武良將鎮禦北方以謝𤣥為兖州刺史領廣陵相監江北諸軍事郗鑒都督青兖二州鎮此晉末以廣陵控扼三齊故青兖同鎮宋文帝兼置南兖州唐李吉甫德裕宋朝韓琦韓世忠宣撫門户嚴則謝𤣥無後顧之憂藩籬固則祖逖有前進之勢廬州制置副使安撫使九郡强勇軍都統制淮西廬江古廬子國合肥為淮西根本一道都㑹地大以要江北脣齒淮右衿喉南臨江湖北聯壽春腹巢湖控渦潁膺濡須枕􅏦皖為用武之郊淮甸沃壤長淮帶城中嚴王旅之屯外倚帥垣之重魏為重鎮張遼守之以八百人破孫權十萬衆明帝曰東置合肥南守襄陽西固祁山敵來輙破地有所必爭築新城武帝軍合肥開芍陂屯田劉馥鎮合肥廣屯田脩戰守之備興陂堨懷流民魏滿寵鎮此曰合肥城南臨江湖北逺壽春吳屯廬江皖口晉謝𤣥扼肥水敗秦師戴淵屯守若昔濡須之築芍陂之屯郾城士飽馬騰淝水風聲鶴唳欲追往躅宅牧良難訖天誅於洄曲但畏合肥有韋虎紹興七年九月劉錡為守兼營田使淮西制副嘉定十二年善湘為制副濠州招撫使濠梁鍾離郡臨濠阻淮帶山荆山在西濠水合流南北朝為重鎮鄧艾屯田自鍾離以南置營張萬福為刺史江淮草木知威名黃州制副齊安黃岡中襄鄂昇揚而立首尾聯絡内繕諸關外嚴列戍東望夏口前介大江通接巴蜀襟帶湘漢介淮楚之交地連雲夢城倚大江濵江帶山烏林赤壁五關之險惟江表之藩籬在淮壖之屏翰邾城名郡淮甸要衝陸遜以三萬兵戍邾城吳戍此城用三萬兵光州武定軍都統制本雄淮軍嘉定元年改光山弋陽浮光襟帶長淮控扼潁蔡期思舊封面山負野限淮為圻淮安安撫山陽東楚淮陰淮水湯湯至于海邦淮夷來同晉以淮陰為重鎮祖逖為豫州刺史屯淮陰起冶鑄兵器克譙城遂鎮雍丘勸課農桑撫納新附荀羡北鎮淮陰屯田石鼈唐於楚州古射陽湖置洪澤屯韓世忠為宣撫使屯山陽嘉定中賈渉知楚州淮東制使兼京東河北路節制使又兼鎮撫節制大使壽春安撫壽陽下蔡淮南要衝壽陽重鎮劉仁贍之備禦英烈如存鄧士載之經營宏規可想鄧艾令淮北屯二萬人且田且守平淮西碑曰文通汝守壽紹興中李光壽春等州宣撫使江陵京湖制垣安撫使十六郡都統制正在鄂副在襄湖北荆渚南郡荆南南楚鶉尾之分荆南為吳蜀門户楚之郢都南夏劇鎮據江湖之㑹控扼巴蜀襟帶吳粤北繞潁泗南通五嶺西通巫巴東接雲夢地利西通蜀天文北照秦三湘七澤荆州上游北連鄧許西極瀟湘眷荆楚之西門實江漢之南紀大别之南江漢合而東流詩䟽重湖三楚地控上游兵屯重鎮控巴夔之要路接襄漢之上流指作要衝昔分吳蜀列為一道今扼荆襄江漢之滸王命召虎式辟四方徹我疆土于疆于理至于南海來旬來宣經營四方采芑方叔元老克壯其猶方叔率止執訊獲醜征伐玁狁蠻荆來威裒荆之旅有截其所荆楚居國南鄉烈烈征師召伯成之王命卿士大師皇父整我六師以脩我戎既敬既戒惠此南國召公之教明南國申伯之德揉萬邦吳與蜀分荆州吳晉重鎮江左大鎮莫過荆揚有西陜之號諸葛孔明曰荆州北據漢沔利盡南海東連吳㑹西通巴蜀此用武之國又謂先主曰命上將將荆州之軍以向宛洛何充曰荆楚國之西門得人則中原可定周瑜屯據江陵晉陶侃鎮荆州楚郢士女相慶自南陵迄于白帝數千里中路不拾遺桓温經畧中原即而鎮之庾翼為南郡太守鎮江陵唐自至德以來處方面數十人呂諲最有名威惠兩行穆昭嗣對太祖曰荆南即西川江南廣南都㑹也今已克此則水陸皆可趨蜀呂餘慶自江陵為參政趙雄寧武節開府判江陵劉錡以太尉知荆南兼都統牧臣司荆鄂州安撫制都統武昌江夏夏汭夏口兵衝要地宜得其人地接荆峴江漢合流鄂渚扼束江湖襟帶吳楚逺控湖湘旁帶漢沔夏口在荆江之中通接梁雍實為衝要一江天險萬騎雲屯孫吳都之常為重鎮置督將于此周瑜為江夏守請得精兵數萬人進夏口破曹操呂岱屯武昌與陸遜共領荆州同心協規南土稱之晉陶侃為守兼督江州移鎮武昌庾翼修軍器積榖温嶠鎮武昌有惠政王述曰武昌江東鎮戍之中非但扞禦上流而已方嶽重將當居要害之地為内外形勢桓沖曰夏口江沔衝要唐柳公綽陳師鞠旅古名將無以加建炎四年鄂州置安撫大使紹興四年馬廣為江西沿江制副屯武昌紹興元年春分八郡為湖東路安撫置司於鄂隆興二年沈介為守兼鄂岳江黃漢陽沿江制置使嘉定十四年李􅌫以沿江制置副使兼守常德府武陵桃源建炎四年程昌禹為鼎澧鎮撫使紹興元年春分鼎澧辰沅靖等九郡為湖西路安撫置司于鼎昌禹兼寳祐三年常德守湖北安撫兼五郡鎮撫使潭州安撫使九郡湖南長沙星沙熊湘壽沙翼軫為楚分旁一小星為長沙星謂之南楚南五嶺北洞庭控湖湘上游控交廣之户牖扼吳蜀之咽喉翼張四隅襟束萬里長沙鉅屏南紀上游湘川之奥人豐土闢南通嶺嶠襟帶重湖領湖南之地二千里潭府淳古湘水行春地狹不足囘旋右夏汭左荆門控百粤包九疑山川秀麗稱衡湘地勢廣長接青草洞庭之匯民情勁悍狃綠林新市之風星沙於外藩最佚勿謂湖湘之逺在予庭户之間甘棠召伯之教明南國申伯王纉之事南國是式登是南邦世執其功王命申伯式是南邦我圖爾居莫如南土錫爾介圭戎有良翰文武是憲柔惠且直揉此萬邦聞于四國常武整師脩戎惠此南國吳芮之忠著甲令賈誼為長沙傅晉元帝曰湘州控上流之勢據三江之㑹脣齒荆雍皇祐中狄青湖南北宣撫使經制廣南紹興二年李綱湖廣宣撫使兼潭州制云位均分陜四年席益湖南安撫制置大使五年呂頤浩以鎮南節開府為之周必大少保判李椿朱熹劉珙真德秀為帥孫沔為湖南江西安撫使得以便宜從事重湖通川陜之氣脈九郡扼蠻猺之衿喉中興以來見謂重鎮如綱如益如頤浩如珙皆繇政路出殿是邦襄陽京西南安撫使七郡制垣南雍古峴峴首榖城翼軫之分控制上流西控蜀漢東帶吳楚右視湖湘左顧川陜下瞰京洛帶襟漢水屏蔽全吳去江陵歩道五百里埶同脣齒北接宛洛跨對楚沔為鄢郢北門名楚蜀之上游玉節臨南雍方城為城漢水為池天設金湯雲屯貔虎魏為荆州治西極梁州南包臨沮北接陰鄧吳周瑜曰據襄陽以䠞操北方可圖也魯肅曰外帶江漢金城之固沃壄千里魏明帝曰南守襄陽敵來輙破地有所必爭司馬宣王云襄陽水陸之衝禦寇要地不可失也晉羊祜率營兵出鎮南夏綏懷逺近甚得江漢之心戍邏減半分以墾田八百餘頃大獲其利有十年之積以所統諸軍在漢東江夏者皆以益祜祜在軍常輕裘緩帶進據險要開建五城收膏腴之地増脩德信以懷柔初附繕甲訓卒廣為戎備江衢如砥襁袂同歸杜預督荆州繕甲兵簡精銳勤於講武江漢懷德化被萬里錯置屯營分據要害之地通零桂之漕刻石紀勲立峴山之上周訪務農訓卒劉𢎞勸課農桑漢沔肅清庾亮云北接宛許南阻漢水其險足固其土足食晉庾翼䟽襄陽荆楚之舊西接益梁與關隴咫尺北去河洛不盈千里土沃田良方城險峻進可以盪秦趙退可以保上流翼謀北伐鎮于此桓宣招懷初附勸課農桑撫綏有績唐樊澤威惠著襄漢裴度為節度曹王臯勤儉峽州安撫副使始於寶祐二年巴峽月峽吳漢留夷陵泝江而上陸遜言夷陵要害國之關限失之則荆州可憂又以為西陵國之西門陸抗都督西陵國之蕃表若敵汎舟順流非可恃援他部陸遜為宜都守鎮此後陸抗鎮焉元和郡縣志建平歸州陸抗曰西陵建平國之蕃表胡安國曰湖北十有四州其要㑹在荆峽劉表時則軍資寓江陵先主時則重兵屯油口關羽孫權則并力爭南郡陸抗父子則協規守宜都晉大司馬温及其弟沖則保據渚宮與上明皆荆峽之封境也荆南諸邑在江北者三在江南者四峽州大都險要皆在南岸欲保江左必都建康欲守建康必有荆峽重慶四川制置移治古渝巴渝渝水渝南在岷山之北西控僰道北接漢中承三江之㑹晉王濬為巴郡守成都四川制置總三十六郡安撫使十六郡坤維井絡靈關玉壘岷山之精上為井絡帶二江之雙流抗峩眉之重阻魚鳬􅅙叢之國參旗井鉞歴井捫參華陽黑水蜀道青天華陽西極黑水南流井絡輝其上岷嶓鎮其域華山表其陽汶江出其徼外負銅梁緣以劒閣地稱天府止錦江之沸清玉壘之塵鼎峙三分之地坤維半壁之天文翁倡其教文翁之文武侯之武一方之寄非親賢勿居蕭何以丞相留收巴蜀租填撫諭告使給軍食王尊為忠臣叱馭作中和樂職之詩孫寳著名西州朱輔宣示漢德威懷逺夷孔明謂先主曰身率益州之衆出秦川則霸業可成又曰益州險塞沃野千里高崇文曰西川乃宰相囘翔之地韋臯治蜀二十一年撫諸蠻有威惠製紀功碑褒賜之蜀道易武元衡外分兵符中佩相印李德裕籌邊樓按西南道之圖張詠恩威並用呂餘慶以參政守成都趙抃為政簡易自政府復往程戡善撫逺人還當以二府處之文彦博立訓練之法張方平善政前有胡世將後有蕭振張燾以帥臣行四川民事席益以制置大使兼守紹興五年汝愚始以同姓守蜀興元利東安撫使都統制漢中梁州南鄭為巴蜀障蔽顧瞻南鄭屛蔽西陲牧臣司梁漢王都南鄭蕭何曰語曰天漢其稱甚美大王王漢中收用巴蜀還定三秦天下可圖也韓信曰三秦可傳檄而定决䇿東向有拜將壇楊洪曰漢中益州咽喉若無漢中則無蜀先主曰我必有漢川矣蜀以魏延蔣琬屯守為重鎮孔明率諸軍北駐漢中以圖中原上出師表誦武侯出師之章審漢將登壇之䇿唐鄭餘慶鎮興元紹興中楊政以經畧安撫守興元嘉定中安丙以制置大使治興元紹興即蜀北境分置二帥東治漢中西治葭萌利州利西安撫副都統制益昌葭萌綿谷咽喉要路秦自劒道伐蜀即此路劒門銘云右師逾利州左師出于劒門攻出九地上披重雲右逾岷山左直劒門建炎四年利州路置帥後耿興宗守興元兼利州安撫由是帥移興元紹興十四年分利路為東西乾道四年合為一興元兼領淳熙二年復分三年又合五年復分開禧三年復合嘉定十二年丁焴守沔而义分䕫州夔路安撫使十五郡宣撫使䕫子國雲安白帝城夔門控荆楚上游為巴蜀要郡居瞿唐上游楚蜀衿吭水陸衝要全蜀之口介于巴楚咽喉巴峽朝發白帝暮至江陵荆益之衝南控百蠻西南四道之咽喉吳楚萬里之襟帶䕫府蜀西増白帝之守孔明八陳圖在永安宮南平沙上唐李孝恭為總管潼川安撫今在瀘州叙寳祐六年詔移司州梓部東川左蜀左帶涪水右挾中江居水陸衝要東控瀘叙西扼綿茂江山形勝為劒外一都㑹西接二江南連三峽表裏巴庸咽喉褒漢髙崇文為節度金州都統制洵城淯陽姚墟安康洵陽洵水南入沔郡臨漢江蜀以申儀為西城太守王彥始除金房開達州都統郭浩王彥沔州安撫利西路都統制吳璘沔水順政武興武都嘉陵水興城關城外有壘三面周匝地當衝要劉備自陽平關南渡沔水孔明奬率三軍北定中原遂行屯沔北陽平傳云屯沔陽蔣琬欲乘漢沔東下襲魏興上庸瀘州潼川路安撫使十五郡瀘川江陽瀘南控扼六詔為重鎮西連僰道東接巴渝古巴子之國枕帶雙流地兼夷漢江帶梓䕫地聯戎僰境接巴黔地控雲南之六詔疆連井絡之三巴孔明五月渡瀘定南方平南中七縱七禽太祖召瀘州守錢文敏曰瀘近蠻尤宜綏撫乾道升領東川一道十五州為邊隅重地趙雄以舊弼為守景定三年二月改江安州降軍事水經注若水至僰道又謂之馬湖江唐地理志戎州有馬湖鎮兵後漢志犍為郡僰道注華陽國志曰治馬湖江㑹水通越巂舊本有僰人九域志羈縻州商馴浪川騁州在馬湖江𨽻戎州唐乾符二年髙駢脩復卭崍關大度河諸城柵又築城於戎州馬湖鎮號平夷軍築城於沭源川皆蠻入蜀之要道各置兵數千戍之自是蠻不復入寇福州安撫使八郡西外宗正閩中三山七閩重地百粤故區東帶滄溟南望交廣眷全閩之督府奠長樂之奥區惟南閩之都㑹有東魯之文風襟山帶海控廣聨吳任重十連威臨八郡閩粤地肥衍八郡支分封圻廣袤三山鼎峙形勢尊雄常衮優儒生之禮丕變文風崇重學校海濵㡬及洙泗以文詞進民皆化之蔡襄為守張浚為大使條畫海道舟船利害陳俊卿以舊弼再守唐有長樂郡經畧使以防海寇管兵千五百人泉州南外宗正清源朱買臣云發兵浮海直指泉山陳舟列兵蔡襄再守建寧建安建水建溪富沙武夷閩之上游東閩劇地襟山束水碧水丹山潜龍之邸家有詩書自朱熹倡道東南為道義之鄉陳俊卿王淮梁克家以舊弼為守廣州經畧唐安撫使十四郡五府經畧使南海畨禺羊城扶胥黄木交阯蒼梧服領以南帝命南伯嶺南節度為大府鎮海敵其陽五嶺峙其北祝融之宅古南粤之地嶺表地控百粤境接羣蠻殿南服江漢之詩曰于疆于理至于南海眷南粤之封垂宅畨禺之都㑹海山控帶夙稱形勢之雄民蜑雜居尤頼撫綏之畧選帥重於他鎮有文武威風知大體嶺南帥得其人則一邊盡治盡牧南海之民總五筦之政教建三軍之鼔旗五筦之民分五羊而作牧旂􅓚葢海龍户馬人陶侃運甓之志唐經畧使以計度為上考宋璟李勉亷潔孔戣正直方嚴海嶺之陬既足既濡河間王孝恭安輯嶺表號令暢南海馬總抗節畨禺治廣無出王方慶之右賜瑞錦以彰善政向敏中亷清崔與之自廣州除參政靜江經畧安撫二十五郡使寶祐五年命制置大桂林八桂桂管襟蠻帶海為㑹府五筦之地桂為大西控龍編東連鯨海地控諸蠻疆連五嶺地連五嶺川束三江左控荆衡東接嶺海為一都㑹脩戎兵用逷蠻方疆分五嶺疆分五筦連江山篸帶之雄户雜羣蠻有鱗介衣裳之俗撫御之宜有赤子龍蛇之别牧伯之任在嚴師父母之間宣威丹徼領郡二十五羈縻州七十二控制雄劇銅柱之邦戈船之道羈縻七十州封畛四千里風氣清淑東接嶺海右控蠻荒晉陶侃鎮江陵都督交廣忠順勤勞唐李靖平嶺南為嶺南撫慰大使桂州總管王晙為都督築城務農唐經畧之地甚重專西南一面之寄幕府無南鄉之慮曹克明始置溪洞司而兼領之陸詵嶺外處畫無不當者余靖奏團結訓練土丁以備邊經制五筦恩信著嶺外張栻范成大援著安交趾之績固陳靖日南之方祖宗之制不以武人為大帥專制一道必以文臣為經畧以總制之尹真定太原京兆鳳翔河中江陵成都興元江寜大都督徐兖陜潞揚福杭越都督安延洪鄂䕫廣夏文茵暢轂雕戈錫盾赤旂金節朱芾葱珩豹尾神旗旃旌綪茷淑旂綏章貝胄朱綅茸纛騂旄渠門赤旂夀甲琱戈鏚鉞琱戈犀甲熊旂鸞旂鵰綬隼旟鷩冕𤣥纛青旌龍旂四牡長轂千旟龍節蜺旌牙璋犀節玉海卷十九
