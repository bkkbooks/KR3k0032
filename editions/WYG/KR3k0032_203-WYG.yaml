body:
  text: 玉海卷二百三宋王應麟撰辭學指南表賀臣某言或云臣某等言恭覩守臣表云恭聞某月日云云者祥瑞表云伏覩太史局奏云云者云守臣表云伏覩都進奏院報云者云云臣某懽抃懽抃頓首頓首竊以云云恭惟皇帝陛下云云臣云云臣無任瞻天望聖激切屏營之至謹奉表稱賀以聞臣某懽抃懽抃頓首頓首謹言年月日具官臣姓某上表謝臣某言伏蒙聖恩云云者謝除授云伏奉誥命授臣某官職者云云臣某惶懼惶懼頓首頓首竊以云云此後或云伏念臣云云兹葢恭遇皇帝陛下云云臣云云臣無任感天荷聖激切屏營之至謹奉表稱謝以聞進謝恩詩云謹各齋沐撰成謝恩詩隨表上進以聞臣某惶懼惶懼頓首頓首謹言進書進貢陳請臣某言云云臣某惶懼惶懼頓首頓首云云進國史等云恭以某宗皇帝云云云餘用竊以云恭惟皇帝陛下云云臣云云臣無任瞻天望聖激切屏營之至陳請表云臣某等無任祈天俟命云云所有某書若干卷冊謹隨表上進以聞進詩云恭和御製詩之類表進貢云其某物云云陳請表云謹奉陳請以聞臣某惶懼惶懼頓首頓首謹言代宰臣以下陳請表如請御正殿之類中謝後或云竊以云云或云恭惟皇帝陛下云云末云伏望皇帝陛下云云表明也標也標著事序使之明白三王以前謂之敷奏秦改為表漢羣臣書四品三曰表不需頭上言臣某言下言誠惶誠恐頓首頓首左方下附云某官臣甲乙上陽嘉元年左雄言孝亷先詣公府文吏課牋奏又胡廣以孝亷試章奏然則章奏試士其始此歟唐顯慶四年進士試闗内父老迎駕表開元二十六年西京試擬孔融薦禰衡表則進士亦試表東萊先生曰表中謝後當説竊以各隨題意如代樞宻使謝賜玉帶表云竊以裴度視師服章武通天之賞衛公戡難拜文皇于闐之珍視師戡難俱見樞臣之意非泛泛引用比如謝賜御書周易尚書表云竊以法始四營莫辯乎易文兼五典皆聚此書是也或用事或不用事亦無定格如進實錄寳訓表中謝後當説恭以某宗皇帝云云頌徳不用竊以作文字須照顧俗語時忌如徳邁九皇之類是俗語如大行陟遐之類是時忌多改大行如盛行孫仲益秦㑹之湯進之表皆可為格代髙麗王謝賜燕樂表孫覿十行賜札誕彌遼海之邦萬里同文普聽鈞天之樂起頭若如第二人止説寵逮逺邦之語則弱而無力故用此意而擇語言換轉十行賜札萬里同文是也才讀此兩句便見大體俯慚虚受中積愧懐伏念臣錫壤三韓襲封四郡環居島服習聞夷韎之聲仰睇雲門實􅅭咸池之奏先説逺夷不足以知雅樂而後叙作樂之盛受賜之寵凡四夷受賜表皆可倣此方重華之上治躋累洽之閎休監二代以敷文命一䕫而制樂登歌下管天地同流鼓瑟吹笙君臣相説此表警句典全用經句而復麗大凡詞科四六須間有此一兩聮則易入人眼天王志古亦云徴角並揚慶君臣之相悦塤篪迭奏與地以同流事亦與孫仲益同但不合不全用故弱此不善用加賁鹿苹之饗輔成魚藻之歡有懐疏逖之臣亦預分頒之數玉帛萬國干舞已格于七旬簫韶九成肉味遽忘於三月仰止柷將之賜鬱然食侑之光驟此叨居未安殆無前比兹葢伏遇皇帝陛下躬持慈寳丕冐仁天通道八蠻坐致逺人之悦同符五帝肇聞古樂之興出大晟之珍藏作朝鮮之榮觀兠離一變慈惠均歡蕩蕩乎無能名雖莫見宫墻之美欣欣然有喜色咸與聞管籥之音稽首拜嘉周邦來賀臣敢不服膺睿奬謹度遐方仰九門之句傳徒起戴盆之望與百獸而率舞但深傾藿之心此表辭意俱勝可為定格代宰臣以下賀日有五色雲表秦檜聖主當陽庶宷際千齡之運卿雲抱日清臺占五色之祥景耀觀瞻歡均率溥竊以仰模乾象懋建國經君徳無私明有同於日照臣職匪懈勢有類於雲從竊以下説君徳臣職之意極好大凡祥瑞表須如此推原惟心合而益章則效隆而靡忒乃如今日允謂昌期如葢如盤方顯照臨之用非煙非霧共呈承戴之華諒非此道之黙通孰致彼蒼之昭假稽諸徃諜實未前聞歴􅀱躔離但書於合璧慶符震育徒擬於圓車當知上瑞之難全必待盛時而畢見是為常道匪曰私親伏惟皇帝陛下揆道統天膺時御極體離明而燭物霈需澤以懐人上句説日下句説雲極有工輝光發衷徳又新而無蔽臣鄰効力職布列而俱宜休矣祥開灼于貺施臣等假寵惟舊常依日月之光委質何功偶際風雲之㑹大凡題目中字須是兩聮俱用則停當誓勤緜薄永介昭明如緜薄亦是雲昭明亦是日帝表長瞻固已傾心於就望官名久正毋庸紀號於青黄按文苑英華慶雲抱日賦云臣如雲君如日又黄雲捧日賦云日者君之徳雲者臣之狀彼無私以臨下此竭誠而奉上此表命意葢本於此代守臣謝賜御書周易尚書表湯思退宸章帝藻粲如琬琰之傳神畫聖謨較若天人之備此表頭神畫聖謨及天人之備便見易與書之意如此方切題不可汎汎説御書經書也啟函拜賜拭目知榮竊以法始四營莫辯乎易文兼五典皆聚此書續東魯之韋編發先秦之竹簡意廣大而孰測辭灝噩以莫窺其在累朝以為古訓顧宣帝立梁丘之學豈革荄兹之談彼明皇覩洪範之篇徒改陂頗之字荄兹對陂頗亦工未有留神乙夜探𧷤前經刪妄論於九師掇徽言於四代寫之縑帙示於薦紳體飛動於龍鸞義昭囬於星斗月將日就彰聖學於祗勤墨妙筆精竦侯藩之瞻戴懋乃非常之績屬我中興之朝恭惟皇帝陛下識際道真行髙世表垂衣裳而致治葢取乾坤廣視聼以御圖一似堯禹故此躬行之至見乎心畫之間葢取乾坤一似堯禹上句説易下句説書與前表説雲説日之意合而工則過之教兼被於臣鄰賜不殊於中外祕書深刻已參淳化之孝經方國咸頒逺陋漢光之手札固可用不若更尋親切事用之為佳臣叨分符竹獲覩寳奎對未停當八法難如徒驚端勁遒偉之狀一圻所治願布精㣲疏通之風表斷句須要有力如洪景盧但驚奎璧之輝從天而下莫測龜龍之祕行地無疆羅疇老代髙麗修貢表全篇皆穏其間一聮云地瀕日出每輸傾藿之心天闊露零亦被蓼蕭之澤二事人用之極熟此聮稍變言語遂為佳句大抵用事當如此不然則汎濫雷同矣其斷句云矢來肅慎用昭逺慕之誠弓掛扶桑永荷誕敷之徳亦好林虡謝賜修都城記表全篇皆好但斷句無力其中云天造地設示根本於華夷陽曜隂藏壮規摹於今古警句也􅄯之道表頭不甚工劉才邵表竒袁植表傷於太長前人表如謝上表固無用然其間亦有可用者如頌徳之類又謝修史成轉官表則可用於進史表也盤洲洪公擬宰臣賀復河南表有宣王復文武之土光啟中興齊人歸鄆讙之田不失舊物之句齊齋倪公曰荆公表云旌旃所指燕及氐羌樓櫓相望誕彌河隴此摘取詩語兩字用之前輩多如此西山先生曰表章工夫最宜用力先要識體製賀謝進物體各不同累舉程文自可概見前輩之文惟汪龍溪集中諸表皆精緻典雅可為矜式錄作小冊常常誦之其他亦須徧閲前輩表章如夏英公宋景文王荆公歐陽公曽曲阜二蘇王初寮汪龍溪綦北海孫鴻慶諸公之文皆須熟誦而龍溪北海所作尤近場屋之體可以為式一表中眼目全在破題二十字須要見盡題目又忌體貼太露如前輩慶雲瑞粟野蠶成繭表用參著兩儀之瑞五色雀瑞麥瑞芝用覩珍符於動植便見三者分明安南國謝加恩并賜對衣金帶鞍轡表用式兼名器之榮葢只用兩字該盡題目最可法也貼題目處須字字精確且如進書表實錄要見實錄不可移於日厯國史要見國史不可移於玉牒乃為工也進書一門諸書體製各不同玉牒乃紀大事之書國史乃已成紀傳之書實錄乃編年之書寳訓則分門日厯則繋日會要則會稡各是一體若出進玉牒表須當純用玉牒事不可以他事􅄂之舉此一端其餘皆然若汎濫不切可以移用便不為工矣大抵表文以簡潔精緻為先用事不要深僻造語不可尖新鋪叙不要繁冗此表之大綱也表有賀郊祀子孫宗祀肆赦冊寳祥瑞建儲改元立后史誕生皇奉安策禮成之兵捷類有謝賜宴除賜御製官御書類授轉加恩賜器服茶藥等代外國謝賜物賜厯經筵進讀正説訓寳訓三朝兩朝聖髙宗九孝宗畧仁皇典髙宗孝宗政朝通學稽古錄陸通鑑綱目魏帝學錄續帝學奏大衍義贄奏議徴諫名臣議進講易書徹詩象二禮帶春秋香語孟講賜簡金鞍馬茶孝經省中庸大學徹秘書賜宴讀賜金硯匣餘同進或賜御書御製詩及詩有進貢進奉聖節之代外國貢獻類有進書玉諜會要國史紀志傳積實錄仙源類譜慶圖日厯御集寳訓要政要勅經武畧令格式令寛恤詔其體頗不同除單題易區處有總數事為一題者破題須包盡至於瑣碎工夫尤為繁多且如出一賀冊表非胸中有五六件冊寳如何展布得一篇又有不可測者如宣和間順州進枸杞表綦北海作固非場屋中出萬一試日或遇此題平時不知枸杞為何物焉能作靈根夜吠之語哉須燈窻之暇將可出之題件件編類如初學記六帖藝文類聚太平御覽冊府元龜等書廣博捜覽多為之備向年嘗見臨安進野蠶繭及絲綿紗絹因謂同學者曰萬一以此命題中間將何鋪叙皆相顧無語某後擬一聮云檿絲纎纊無慚禹貢之供冰素方空不數齊官之獻絲綿紗絹四者皆全須如此用工可也夷狄貢獻須考證今與中國通者幾國且如安南國日本闍婆須考究在古為何國有何故事可以引用字面可以體貼如安南則有南交浪泊龍編銅柱之類若非素備寧免荒疎須將歴代夷狄傳本朝會要參考則得之矣劉三傑文字合中程忘寫年月日臣某上表遂黜之代嗣髙麗王修貢表俱是先説襲封方及來王之意惟第一人黄符先説夲朝首聮云仰被王靈獲承基緒敬修臣職敢後要荒羅畸曰中國明昌適際聖神之運逺邦奔走宜修臣子之恭雖不及嗣王之意亦以首言中國遂為第二劉弇謝賜重修都城記表首聮先説邇臣而後及上聖不若前名以帝室為首又曰岐鼓靡聞於逮下嶧山何補於示夸辭無所愧皆寫諸琬琰之餘家有其傳非副在京師之比皆警聮也宣和取燕山羣臣稱賀令一館職作表仍語以燕人悦則取之一句不得不使其人捜經句欲對未得王初寮曰何不曰昆夷維其喙矣遂用之胡交修代謝賜御製御書夏祭神應記表曰聖謨煥發紀休應於柔祇宸翰昭垂霈寵恩於邇服第二人便説御書不甚分明歐陽瓌謝賜御製宣徳樓上梁文表曰端門層觀虹梁鬱起於中天奎畫寳章芝檢驟來於清禁首聮雖見賜宰臣之意而奎畫寳章芝檢不無稠疊矧是御製不應用奎畫芝檢此所以為第三人也又曰相周王之考室初無補於涓埃仰虞帝之作歌乃獲窺於黼黻此聮却工范同表曰五門岌業規摹非萬户之奢肆筆縱横彫琢鄙兩都之陋周益公代交趾進馴象表首聮云效牽靈囿備法駕之前驅已見象為有用又曰名應周郊之五路克協馭儀耳聞舜樂之八音能參率舞靡憚奔馳幸捨鳶飛之跕跕無煩教擾俾陪獸樂之般般曲盡馴象生意就試之士僅能形容畫象及塑象俱不見馴服生動態度惟益公説出象之步趨來庭之意遂中首選華陽賀老人星見表曰金行貫叙顥氣肅乎西成珠緯躔空祥輝麗乎南極乾文朗潤宵景澄夷又曰薦人君之夀既稽元命之圖表天下之安又載西京之志一時慶語無出其右謝景思曰荆公在金陵有中使傳宣撫問并賜銀合茶藥公作表云信使恩言有華原隰寳奩珍劑増賁丘園五事見四句中言約意盡攻媿樓公曰順州得枸杞宿根於土中綦北海屬聮曰靈根夜吠變異質於千年馹騎朝馳薦聖人之萬夀眷荒裔沈藏之久實王師恢復之初物豈無知時如有待表既進天子為之改容誠齋楊公曰有用古人全語而雅馴妥貼如已出者介甫賀冊妃表云闗雎之求淑女無險詖私謁之心雞鳴之思賢妃有警戒相成之道四六有作流麗語者須典而不浮汪彦章賀神降萬嵗山表云恍若壺天金成宫闕浩如玉海虹貫山川有作華潤語而重大者最不多得曽子固云鈎陳太㣲星緯咸若崑崙渤澥濤波不驚起聯東觀書林久徯漢儀之覩西崑䇿府載瞻周馭之臨東萊賀車駕幸祕書省皇治憲天垂宏模於萬世史編繫日昭成法於一王倪正父進夀皇日厯徳茂重華接璿源而詒燕書嚴大典續寳牒以垂鴻進夀皇玉牒侍言虎觀陳三聖之宏規錫宴麟臺講一時之盛禮周益公謝讀三朝寳訓終篇宴賜聖皇至孝荷神鑒之溥臨清廟儲祥挺靈華之秀發説齋賀仁宗英宗室前柱上生芝草上聖紹休丕衍洪圖之慶元儲正位茂膺顯冊之儀陳正父賀皇太子受冊治繼三朝丕闡詒謀之懿法垂萬世聿嚴紀事之書西山進三朝國史帝紀聖神御極廣推徧覆之仁動植蒙休共効太平之瑞葉謙亨進五色雀瑞麥芝草圖聖而濟衆親成垂世之經予以馭臣例及稱藩之國李公彦代夏國謝賜聖濟經烈祖文孫一本纉承之懿皇支帝載兩全筆削之公王器之進三祖類譜今上重修玉牒三后在天軼鴻猷於今古百王冠徳紀茂實於典謨東萊進三朝國史規模宏逺更三聖以重光憲度著明參四書而並載進慶元勑令格式惟皇上帝將開與子之祥有侐閟宫肆蕆尊禖之事野處賀祠髙禖舜厯在躬大一人之聖孝堯言布下輯三紀之睿謨東萊進建紹興詔㫖投戈講藝載信三代之風肆筆成書増賁七篇之訓野處謝賜御書孟子九月授衣駿發先庚之㫖百官承式溥霑令甲之恩同上謝冬衣親年有永方齊箕翼之輝聖孝無前併上乾坤之䇿賀太上帝后尊號冊寳禮成宸襟典學稽上古之聖謨帝幙疏恩錫先儒之義賛許蒼舒代講讀官謝賜尚書正義鏤牒編年並紀光華之旦㳙辰蕆事聿新尊閣之儀傅景仁賀奉安玉牒日厯明聖寅恭寫作宸居之監書言深潤勒為冊府之珍代宰臣進秘書省石刻御書御製敬天圖御府分珍煥切磋之文采使軺臨賜新指畫之威儀龍溪謝賜象簡皇天篤佑忽垂象以示人聖主靈承乃側身而修行亟銷變異宜即彞儀率籲庶工仰干淵聽星變請御殿復膳保章瞻象既除星祲之災太僕詔王盍正朝儀之位龍溪星變請御正殿竊以用事真宗著清景之題必言省費仁祖述危竿之諭葢謹居髙周益公謝御製損齋記徳如堯帝祝多子於封人聖若文王詠百男於詩雅賀生皇子世祖推恩長安列六子之舎明皇廣愛華清建百孫之居盤洲代郡王謝賜第周有采薇之詩因命率以衛中國漢著大風之詠期得士以守四方初寮謝賜御詩被阜以生驗漢庭之熈洽食槲而化彰唐室之隆平滕子濟賀野􅅙成繭漢文繼統每惟代邸之優唐帝嗣圖尤軫潞宫之念魯可宗代常徳府謝賜府額姬姓作藩未成人而賜履漢宗受社方在褓以錫封元章簡代皇子謝堯言布下猶資五典之傳漢制恤人尚賴六經之續進續修寛恤恤令永平神爵之頌孝明稱美者五人貞元重九之篇徳宗考第於三等晏元獻進詩笙鏞列于舜陛無相奪倫管磬設于周庭既備乃奏初寮賀燕樂成與史冊以並驅唐有嘉名之創煥文風而可述漢稱洪業之遵陳益父賀奉安玉牒御集犀來徼外表章帝之重熈雉貢越裳慕成王之極治周益公交阯進象擁篲迎門漢祖悟櫟陽之敬望樓執鞚唐宗羞興慶之歡玉巵惟志於夸毗寳冊不忘於授受奮乎百世在我一時野處賀加太上尊號頌采羽於漢賢盛述威懐之應紀來牟於周雅備陳率育之休惟効異之靈華亦騰歌於樂府莫冲五色雀瑞麥芝草圖天錫嘉符芝稱珍物俯延英之御座爰興唐帝之詩生甘泉之齋房嘗下漢皇之詔説齋賀仁宗英宗室前柱上生芝草推原烏本陽精鵲知嵗事方聖祚紹隆於火徳適天時應在於金穰龍溪賀赤烏白鵲極儒者之榮獨髙翰墨之選鼓天下之動莫如號令之孚矧參基命之承尤峻禁林之望王岐公謝翰林學士承㫖皇祖有訓嘉言孔彰開創守持垂億萬年之基業都俞吁咈振六十載之綱條皆聚此書克昌厥後周益公讀三朝寳訓終篇鋪叙形容重隂益固應水澤腹堅之時積潤潜通迎土膏脈起之􅀱常衮賀雪有璞於此必使琢恍驚制作之工匪伊垂之則有餘允謂便蕃之賜洪景嚴謝玉帶鳯生而五色悵丹穴之已遙龍藏乎九淵驚驪珠之忽得吕吉父謝賜神宗御集帝暉下矚光滎河温洛之藏天藻昭垂跨過沛横汾之詠東萊賀幸秘書省金英並秀絢藻井以煌煌紫蒂駢分映蓂階而蔓蔓北海賀芝草如玉韞石虹氣隠乎山川及雲升天龍澤沛乎宇宙南塘賀登極函封逺致不知何國之白環篆刻孔章咸曰寧王之大寳同上賀玉璽太極班朝肅廷紳而咸㑹少陽在列粲卷服之彰施洋洋軌範之言奕奕瓊瑤之刻温文有恪陟降斂承將以鼔鐘對峙黄麾之仗授之璽紱交輝青輅之旂小侯邦備物之彞陋王社初封之誥陳正父賀皇太子受冊品羅羣帙岳峙大庭粲然物采之新將以鼓鐘之奏徹覽觀於宸極重尊閣於禁嚴典籍聿崇小廣内承明之秘圖書畢出會滎河温洛之祥陳益父賀奉安玉牒御集禮成適華編之初徹叨異渥之沓來輝映宫蜍特煥寳奩之飾歡均苹鹿例陪綺席之光文韉名駿之鮮明濃麝龍團之芬郁夸鄭澣析經之賜侈桓榮稽古之蒙輒陳歸美之章丕展逢時之慶詩裒百詠倣麗正之賡酬句寫七言埒栢梁之聮屬徐子儀代經筵讀孝宗聖政終篇謝宴賜進詩編簡旁羅尚想古文於藏壁金絲迭奏如聆雅韻於升堂傅景仁講尚書謝宴樂皦韶英之奏儀修升甫之容甘醴薦令芳秩彌文於主鬯吉日告爾字申嚴訓於臨軒賀皇子冠禮銀潢滉漾玉版閟嚴千八百國之封先乎異姓五三六經之籍展也同符東萊賀進類譜玉牒二后受之同歸于治萬物備矣皆聚此書萃圭璧於緑文㑹日星於漆簡進寳訓旌旗燭耀於洪河金鼓震驚於靈嶽介丘霧息已望翠華之來沂水風生更起舞雩之詠栁子厚賀破東平東臺瑞物冠玉璽之珍符左户輿圖増金城之列障李吉甫賀元㑹璿題灑落煥東壁之星躔藻衛森羅備甘泉之法駕奉雕輿而降格袚玉座以妥安吕希純賀景靈宫奉安御容禮成公孫數萬之詭辭披圖可見虞初九百之小説開卷盡知豈伊龍閣之珍藏乃作雞林之秘寳葛勝仲代髙麗謝賜太平御覽龍蟠虎伏瞻王氣以雲屯螭首龜蚨據神靈而山立林虡謝賜修都城記用事形容名臣畢萃踵劉珍建武之規異域旁該掩徳裕會昌之作李巘進四朝列傳肇易編年脗合馬遷之纂次著為考紀更逾班固之鋪張西山進帝記逺循豳俗先九月以授衣俯陋漢儀因立春而賜帛謝賜冬衣􅆦翔有煒協周家王屋之符粹美而真異莊子雕陵之見龍溪賀赤烏白鵲効貢亳都上掩太宗之迹伻圖蜀郡益増仁祖之光説齋代臨安府進瑞麥末聯撮其機要誡堯典三萬之言奉以周旋取武成二三之策姜凱謝賜尚書正義民勞汔可小康甫迓升平之運仇殲誠為大慶願臻混壹之期野處賀謝完顔亮謹文王安否之問敢怠帥行書唐宗仁孝之詩仰祈札賜攻媿代皇太子謝冊命既與在庭之多士同值文興將令就傅之百男悉從隗始龍溪代嘉王謝及第寳五典之書而為訓獲舉宏綱舉三宗之事以戒王願禆末議西山進三朝帝紀紀周宣舞鎬之年外攘復古按韓愈辨徐之説不戰來戎初寮賀白兎動鼓鐘於長樂何慙漢家為夀之儀響環佩於後宫更邁唐室奉觴之禮周益公賀太上皇后生辰視淮南之書豈但矜誇於下國聽山東之詔固當禆助於中興同上謝翰林學士聼漢詔於山東少補中興之治布堯言於天下庶無内相之慙同上事倣石渠稱制仰勤於臨决才非山甫有司終愧於將明攻媿進吏部去讀列聖之錄諒思風烈之如存上庶事之歌所冀明良之交勑徐子儀讀聖政終篇進詩惟禮可以為國願廣晏嬰之言非道不敢陳前竊效孟軻之敬西山謝禮部侍郎賜宫錦而嘉草詔之能雖非敢望即金鏡而摘任賢之要知所自期謝翰林學士舜裳五色慚惟裨補之長燕駿千金願廣招徠之意謝衣帶鞍馬書大事而小則簡牘願殫緗素之勤藏名山而副在京師終冀汗青之望野處進三朝帝紀鼎餁養賢省已難勝於異數樽酒納約愛君期盡於愚衷西山謝講易終篇賜宴願偕髦士稱棫樸之能官人載詠詩章思采蘩之不失職倪正父代進士謝賜射推賞君已知言熒惑坐移於三舎臣當守職泰階願獻於六符龍溪代宰臣星變謝放罪鄭衣又改為兮莫副尚賢之日禹黻無間然矣永肩歸美之誠謝春衣使忠臣得盡其心敢忘周詩實篚之意如羣生有以自樂願推漢詔賜帛之仁繼中興聖統之編式符瑞應陋皇室維城之錄未究編摩進玉牒修長樂之注已觀景耀之宣誦思齊之詩更侈徽音之嗣同上率羣卿洎宗臣俯陋唐家之制令史官宣景耀願陳漢頌之辭賀皇太后上尊號題代嗣髙麗王修貢紹聖乙亥代宰相已下謝賜新修都城記丙子代宰相等謝實錄成賜宴丁丑代親王謝賜外第元符戊寅代宰相已下賀老人星見己亥代髙麗王謝賜太平御覽庚辰代皇子謝賜生日禮物靖國辛巳代宰臣謝賜重修神宗皇帝御集崇寧壬午代宰臣賀慶雲見癸未代貢士辟雍謝賜宴并御製詩丙戌開封府賀獄空大觀己丑代宰臣已下謝賜御製冬祀慶成詩政和辛夘代宰臣已下賀野􅅙成繭壬辰代髙麗王謝賜燕樂甲午代公相已下謝賜御製夏祭神應記乙未代公相已下謝宣召赴穆清殿賜宴丙申代雲南節度使大理國王謝賜厯日戊戌代公相已下謝賜御製宣徳樓上梁文宣和庚子代夏國謝賜御製聖濟經辛丑代宰臣謝賜御製俯同大成殿詩壬寅代宰臣已下賀日有五色雲癸夘代燕山府路進士謝賜及第甲辰代宰臣已下謝宣召赴經筵聽講建炎戊申代宰臣已下賀收復京西路紹興戊午代樞宻使謝賜玉帶壬戌代守臣謝賜御書周易尚書乙丑代守臣進五色雀瑞麥芝草圖辛未代守臣賀慶雲瑞粟野􅅙成繭甲戌代交趾進馴象丁丑代提舉國史進哲宗徽宗寳訓庚辰代提舉編類聖政所進建炎紹興詔旨隆興癸未代常徳府謝賜府額乾道丙戌代講讀官謝賜尚書正義己丑代文武百官為光堯皇帝太上皇后加上尊號冊寳禮成賀皇帝壬辰代宰臣進修四朝國史列傳淳熈乙未代文武百寮謝宣赴光堯御書閣觀石經戊戌代宰臣進新修仁宗英宗神宗玉牒辛丑代史官進續修資治通鑑長編并舉要甲辰代宰臣已下賀奉安仁宗英宗玉牒四朝國史列傳今上皇帝㑹要禮成丁未代安南國王謝加恩并賜對衣金帶鞍轡紹熈庚戌代提舉實錄院進髙宗皇帝御集癸丑闕慶元丙辰代宰臣已下賀正旦日食雲霠不見立春前一日得雪己未代宰臣已下賀奉安徽宗欽宗玉牒髙宗孝宗光宗御集禮成嘉泰壬戌代提舉國史進髙宗孝宗光宗國史帝紀開禧乙丑代文武百寮為皇太子受冊賀皇帝嘉定戊辰代嗣秀王謝賜玉帶辛未代侍讀官為經筵進讀孝宗聖政終篇謝賜金硯匣并同侍講説書修注官謝賜祕書省御筵及鞍馬香茶進詩甲戌代提舉國史進新修髙宗孝宗光宗國史志并列傳丁丑代提舉編修玉牒進三祖下仙源類譜今上皇帝玉牒及重修玉牒庚辰代經筵講讀官進資治通鑑綱目并九朝名臣經濟奏議中興諸臣奏議發未代寳慶府守臣謝賜府額寳慶丙戌代樞宻院進孝宗皇帝經武要畧壬辰代宰臣以下請皇帝三月二日御正殿端平乙未代宰臣為講筵進讀太祖太宗真宗三朝寳訓終篇謝賜御書臯陶謨及笏帶鞍馬嘉熈戊戌代提舉史館進髙宗孝宗光宗寧宗正史并寧宗實錄辭學代講讀官為經筵進講周易徹章謝賜御書及牙簡金帶鞍馬香茶進詩己亥辭學代宰臣進袐書省石刻御書御製敬天圖庚子辭學代侍讀官為經筵進讀仁皇訓典終篇謝賜金硯匣并同侍講說書侍立官謝賜袐書省御筵及鞍馬香茶進詩淳祐辛丑代沿邊守臣謝元日誡諭沿邊帥守諸將御筆并摹賜御書御製訓亷銘謹刑銘石刻甲辰代提舉國史已下為進髙宗孝宗光宗寧宗史志列傳寧宗御集謝賜祕書省御筵及賜御書御製詩并香茶丁未代宰臣謝賜御書思無邪毋不敬六字仍進二賛庚戌代樞宻院進太祖太宗真宗仁宗英宗神宗哲宗經武要畧寳祐癸丑代皇子謝賜御書孝經十六句丙辰始於事親中於事君口無擇言身無擇行滿而不溢髙而不危天之經也地之義也徳義可尊作事可法通於神明光於四海居則致敬養則致樂進思盡忠退思補過代提舉國史已下進重修孝宗皇帝實錄編類寧宗皇帝御集開慶己未代宰執以下賀奉安重修孝宗皇帝實錄光宗皇帝實錄新編寧宗皇帝御集并今上皇帝玉牒日厯會要經武要畧禮成景定辛酉辭學代侍讀官進唐魏徴諌錄陸贄奏議李絳論事集并九朝名臣奏議壬戌代袐書省官謝賜御書道山堂癸亥辭學代侍讀官擬進三朝寳訓賛真宗皇帝正説賛中庸圖上皇帝咸淳乙丑代提舉官擬進重修寧宗皇帝實錄新修理宗皇帝實錄玉牒日厯㑹要上皇帝戊申代經筵官為進讀大學衍義資治通鑑綱目終篇謝賜笏帶鞍馬香茶并賜袐書省御筵甲戌露布尚書兵部晉曰尚書五兵中隋唐方曰兵部十唐龍朔二年曰臺司戎天寳一載曰尚書武部至徳二載復舊臣某言臣聞云云恭惟皇帝陛下云云臣等云云臣無任慶快激切屏營之至唐露布云不勝慶快之至或云無任慶躍之至謹遣或云謹差某官奉露布以聞紹聖試格如唐人破蕃賊露布之類露布之名始於漢按光武紀注漢制度曰制詔三公皆璽封尚書令印重封露布州郡祭祀志注引東觀書有司奏孝順號露布奏可又鮑昱詣尚書封胡降檄曰故事通官文書不著姓又當司徒露布李雲露布上書注謂不封也魏改元景初詔曰司徒露布咸使聞知蜀漢建興五年春伐魏詔曰丞相其露布天下此皆非將帥獻捷所用通典云後魏攻戰克捷欲天下聞知乃書帛建於漆竿上名為露布自此始也任城王勰曰露布者布於四海露之耳目王肅獲賊二三皆為露布韓顯宗有髙曳長縑虚張功捷之譏孝文稱傅修期下馬作露布齊神武破芒山軍為露布杜弼即書絹不起草唐制下之通上其制有六三曰露布兵部侍郎奉以奏聞集羣官東朝堂中書令宣布隋開皇中撰宣露布禮張昌齡為崑丘道記室平龜兹露布為士所稱于公異為招討府掌書記朱泚平露布曰臣既肅清宫禁祗奉寢園鐘簴不移廟貌如故徳宗咨歎焉薛收為露布或馬上占辭封常清於幕下潜作捷布東晉未有露布隆興初以晉破苻堅命題似有可疑然文章緣起曰漢賈洪為馬超伐曹操作而魏志注謂虞松從司馬宣王征遼東及破賊作露布隋志有魏武帝露布文九卷世説云桓温北征令袁宏倚馬前作露布手不輟筆俄成七紙則魏晉已有之當考宋書云楊文徳建露板馳告朝廷文心雕龍曰露布者葢露板不封布諸視聽也宋朝王元之擬李靖平突厥露布此擬題之始歟東萊先生曰頭四句後再用兩句散語須便用兩事如蠻夷則用前代伐蠻夷之事盗賊則用前代伐僣亂之事尚書兵部臣某等言主帥名臣聞説伐叛之意恭惟尊號皇帝陛下頌徳便説四方向化此賊獨拒命某賊須極罵之須説當時罪臣某等説受命攻伐某賊説當時拒賊次第臣等説攻討次第説禽賊得地斯皆歸善之意臣云云末用一聮結西山先生曰露布貴奮發雄壯少麤無害不然則與賀勝捷表無異矣翟公巽作擒賊露布曰不以賊遺君父已殄凶殘况克敵示子孫毋忘勲伐張燕公平契丹露布曰山川積雨盡消胡騎之塵草木長風咸有王師之氣王元之擬李靖露布叙頡利求降且復謀竄曰穽中餓虎暫為掉尾之求鞲上飢鷹終有背人之意起聯用事春秋復九世之讎世宗遵而伐敵匈奴直百年之運宣帝因以受朝滌蕩平城之憂焜燿渭橋之謁推今盛烈跨古鴻猷東萊破突厥露布電撃雷震瀚海飲冠軍之馬星流彗掃燕然勒車騎之銘憺義勇於龍荒紀鴻勲於麟閣厥開昌會克對前休平薛延陀起聯用散語衆勝天而定勝人終歸助順直為壮而曲為老烏可恃强自古以來斯理可攷所以牧野若林之旅罔敵有周昆陽彗雲之鋒亦殱於漢東萊破苻堅末聮臣等賴天之靈敵王所愾蠻荆率服初無方叔之壮猷江漢既平行對宣王之令聞周益公平淮西臣備數行間獻俘闕下左執律而右秉鉞願先周樂之容東漸海而西被沙共紀禹功之盛東萊平薛延陀登灞岸而望長安共興感慨封狼居而禪姑衍當效驅馳破苻堅唐于公異露布駱賔王集兵部奏姚州露布末云不勝慶快之至謹遣某奉露布以聞軍資器械别簿條上一云别簿錄上尚書兵部臣聞云云伏惟皇帝陛下云云逆賊朱泚云云臣是用云云此皆上天降鑒睿慮旁施云云臣云云不勝慶快之極謹差某官姓某謹奉露布以聞朝制要覽載露布式某道行軍元帥府為申破某賊露布事具官行軍司馬封臣名具官行軍長史封臣名具官某道行軍元帥臣名尚書兵部臣聞云云謹遣某官臣姓名露布以聞軍資器械别簿申上謹上張説為河内郡王平冀州賊契丹露布云其軍資器械别簿條上謹言器樊衝為幽州長史破契丹露布云其所獲首級械别錄申上兵部奏桂州破西原賊露布云其立㓛將士首領别簿奏上年月日具官行軍兵曹參軍事臣姓名上尚書兵部謹奏某道行軍破賊露布事左僕射具官封臣名右僕射具官封臣名兵部尚書具官封臣名兵部侍郎具官封臣名等言臣聞云云不勝慶快之至謹以申聞謹奏年月日兵部郎中具官封臣姓名上給事中具官封臣姓名讀門下侍郎具官封臣姓名省侍中具官封臣姓名審聞其行軍無元帥者載當時軍名餘官無帥者具行軍見在官宣制訖送尚書省頒布文鑑載露布二首嶺南道行營都部潘美副部尹崇珂都監朱憲等上尚書兵部臣等聞云云臣等幸陪戎事倍樂聖功無任快抃歡呼之至謹奉露布以聞昇州行營馬步軍戰棹都部宣徽南院使義成軍節度使臣曹彬上尚書兵部臣等聞云云臣等無任歌時樂聖慶抃歡呼之至謹奉露布以聞題唐西海道行軍大總管破吐谷渾政和丁酉唐擒頡利宣和癸夘唐天下兵馬元帥克復京城紹興乙夘晉征虜將軍征討大都督破苻堅隆興癸未檄某年某月日某官某告某處或曰移某郡葢聞云云末云檄到如章書不盡意或云兹言不欺其聽無惑或云兹言不爽其聽無違故為檄委曲檄到其善詳所處如律令或云檄到宣告咸使聞知司馬長卿喻巴蜀檄首云告巴蜀太守末云檄到亟下縣道使咸喻陛下意無忽陳孔璋為袁紹檄豫州首云左將軍領豫州刺史郡國相守葢聞云云司空曹操云云幕府云云廣宣恩信班􅀭符賞布告天下云云如律令檄吴將校部曲文首云年月朔日子尚書令彧告江東諸將校部曲及孫權宗親中外葢聞云云故令徃募爵賞科條如左檄到詳思至言如詔律令鍾士季檄蜀文末云各具宣布咸使知聞宋告司兖二州末云幸加三思詳擇利害又尚書符征南府末云文書千里驛行檄軍書也祭公謀父所謂威責之令文告之辭東萊先生曰晉侯使吕相絶秦檄書始於此然春秋之世鄭子家使執訊與書以告趙宣子晉之邊吏責鄭王使詹伯辭於晉王子朝使告諸侯皆未有檄之名戰國時張儀為檄告楚相其名始見魯仲連為書約矢遺燕將秦尉佗移檄蒯通說范陽令曰傳檄而千里定韓信曰三秦可傳檄而定漢有羽檄顔師古曰檄以木簡為書長尺二寸有急加鳥羽示速也急就篇注檄以木為之長二尺説文亦云二尺書李左車曰奉咫尺之書自相如之後檄書見史冊者不可勝紀揚雄曰軍旅之際飛書馳檄用枚臯謂其為文敏速也唐以前不用四六周益公擬漢河西大將軍諭隗囂倪正父擬晉奮威將軍豫州刺史諭中原豪傑皆用四六然散文為得體如東萊漢使喻莎車諸國是也説文曰檄激也文心雕龍曰檄皦也宣布於外皦然明白劉勰文心雕龍曰祭公謀父稱文告之辭即檄之本原戰國始稱為檄凡檄之大體或述此休明或叙彼苛虐指天時審人事筭彊弱角權勢標蓍龜於前騐垂鞶鑑於己然譎詭以馳㫖煒曄以騰説故樹義颺辭務在剛健挿羽以示迅不可使辭緩露板以宣衆不可使義隠必事昭而理辯氣盛而辭斷此其要也冊府元龜序曰暴􅀭過惡張皇威武使忠義奮發而邪謀沮壊諭去就之理陳逆順之狀俾之改圖易轍轉禍為福誕告士民使知不獲己而用兵非無名而黷武東萊先生曰檄書頭説某官告某將士葢聞説討叛招攜之意説一段云云惟爾某處將士説為賊拘脅而不能自歸及畧説賊之罪幕府説受命討賊甲兵之盛叙當時形勢賊將欲滅須自歸主上説有過人大度之意開其自新之路末以歸附則有厚賞怙終則有顯戮自擇禍福結之末云凡所賞科其如令甲周益公擬諭隗囂檄云昔吴芮效忠世裂長沙之壤田横亡命身貽海島之羞顧逆順之灼分惟智愚之審擇西山先生曰檄露布乃軍中文字檄貴鋪陳利害感動人意所業檄題欲出唐大將軍河南招慰使傳州縣檄題出夏侯端傳乃髙祖創業之初非因兵興盗起稍覺氣象佳但所疑者一慰字耳漢以前無檄六朝以前未有露布編題之初須要知此漢檄不須四六如司馬相如喻蜀檄之類漢無四六之文故也晉檄亦用散文如袁豹伐蜀檄之類賔隋唐以來方用四六如祖君彦駱王檄鄭畋移檄藩鎮野處洪公作告契丹諸國及中原檄曰葢聞惟天無親作不善者神弗赦得道多助仗大義者衆必歸云云我國家云云惟兹女真之衆云云主上云云幕府云云惟彼諸蕃之大國云云為劉氏左袒飽聞思漢之忠徯湯后東征必尉戴商之望云云侯王寧有種乎人皆可致富貴是所欲也時不再來云云檄到如章書不盡意唐李商隠檄劉稹曰驚地底之鼓角駭樓上之梯橦喪貝躋陵飛走之期既絶投戈散地灰釘之望斯窮盧汝弼檄李克用云致赤子之流離自朱邪之板蕩祖君彦檄洛州云審配死於袁氏不如張郃歸曹范増困於項王未若陳平從漢袁豹伐蜀檄曰當全蜀之彊士民之富子陽不能自安於庸僰劉禪不敢竄命於南中荆邯折謀伯約挫鋭故知成敗有數非可智延此皆益土前事當今元龜也盛如盧循疆如容超凌威南海跨制北岱樓船萬艘掩江葢汜鐵馬千羣充原塞隰然廣固之攻陸無全雉左里之戰水靡全舟或顯戮京畿或傳首萬里故知逆順有勢難以力抗斯又目前殷鑒深切著明者也栁子厚伐黄賊牒云徴側之勇冠一方竟就伏波之戮吕嘉之威行五嶺終摧下瀨之師嗟此陋㣲自貽擒滅李充曰檄不切厲則敵心陵言不誇壯則軍容弱唐説齋擬檄題唐遼東道大總管喻髙麗首領部落幽鎮招撫使諭朱克融右衛率府長史召西域兵討中天竺題諭安西城縁邊蕃部紹聖丁丑别試諭青唐種落元符庚辰緫會要此題有檄字類無檄字唐大將軍河道招諭州縣淳祐甲辰玉海卷二百三
