body:
  text: 玉海卷一百六十九宋王應麟撰宫室門闕上釋名闕在門兩旁中央闕然為道也門闕天子號令賞罰所從出也舜闢四門舜典賔於四門四門穆穆注四方之門四方諸侯來朝者舜賔迎之皆有美徳無凶人詢於四岳闢四門注開闢四方之門未開者廣致衆賢漢武帝制曰虞舜游巖廊之上注晉灼曰堂邊廡嚴峻之廊周五門九門法門三朝詳見朝儀類寢門應門周禮大宰治朝注在路門外宰夫同閽人掌守王宫之中門之禁注中門於外内為中若今宫闕門鄭司農云王有五門外曰臯門二曰雉門三曰庫門四曰應門五曰路門路門一曰畢門康成謂雉門三門也春秋𫝊雉門灾及兩觀疏雉門為中門雉門外有臯庫内有應路於外内為中玉藻疏天子宗廟在雉門之外畢門者從外而入路門為終畢凡諸侯三門曰臯應路詩廼立臯門廼立應門是也若魯三門則有庫雉路眀堂位庫門天子臯門則庫門向外兼臯門雉門天子應門則雉門向内兼應門則天子五門庫門在雉門外眀矣雉門有兩觀師氏居虎門之左司王朝注虎門路寢門也門畫虎以眀勇猛大僕建路鼓於大寢之門外注大寢路寢也門外則内朝之中如今宫殿端門下寢門即路門也小宗伯建神位右社稷左宗廟注庫門内雉門外之左右皆夾治朝春秋所云間兩社槁人外内朝注内朝路門外之朝也疏天子三朝見朝儀小司㓂外朝致萬民而詢注在雉門外朝士外朝注司農云王有五門同閽人注外朝在路門外内朝在路門内康成謂眀堂位説魯公宫曰云云言魯用天子之禮此名制二兼四則魯無臯門應門矣王五門雉門為中門雉門設兩觀與今之宫門同閽人幾出入者窮民盖不得入也小宗伯職曰右社稷左宗廟然則外朝在庫門之外臯門之内與疏後鄭破先鄭外朝在路門外之說若外朝在路門外中門内外朝有肺石達窮民中門既有閽人幾則何得度中門入路門乎以此知外朝在庫門外臯門内也大馭行以肆夏趨以采薺注行謂大寢至路門趨謂路門至應門司士正朝儀之位注此王日視朝事於路門外之位太史閏月詔王居門終月注門謂路寢門也司農云月令十二月分在青陽眀堂總章𤣥堂左右之位惟閏月無所居居於門故於文王在門為閏匠人廟門容大扄七个二丈一尺闈門容小扄參个六尺路門不容乗車之五个大寢門丈六尺五寸應門二徹參个正門二丈四尺疏廟中之門曰闈門即雜記夫人至入自闈門是也路門以近路寢特小為之應門内路門外有正朝臣入應門至朝處君臣正治之所故謂應門鄭云謂朝門也詩緜迺立臯門臯門有伉迺立應門應門將將注毛曰王之郭門曰臯門伉髙貌王之正門曰應門孫炎曰朝門也將將嚴正也美太王作郭門以致臯門作正門以致應門箋云諸侯之宫外門曰臯門朝門曰應門内有路門天子之宫加以庫雉正義言太王本作郭門正門耳文王之興以為臯門應門致者由小致大之辭文王因其制度増而長之以為天子之制郭門者宫之外門正門朝門謂之應門皆宫門也書以應門為南門爾雅曰正門名明堂位云云故以臯應為正門之魯以諸侯而作庫雉則諸侯無臯應衛亦有庫門或以褒康叔也謂應門為朝門寢門一曰路門以朝位在應門内路寢在路門内故名之檀弓魯有庫門春秋定二年雉門及兩觀灾以明堂位攷之庫雉制如臯應成王特襃之使制二兼四餘諸侯不然襄十七年𫝊宋有臯門諸侯法有臯應太王自為諸侯之制非作天子之門毛以諸侯門不名臯應與鄭别禮記文王為世子朝於王季日三鷄初鳴而衣服至於寢門外問内豎之御者曰今日安否何如曰安文王乃喜日中及莫亦如之世子之記曰朝夕至於大寢之門外大寢路寢也門外則内朝之地月令蔡邕王肅云周公作季春之月田獵罝罘羅罔畢翳餧獸之藥毋出九門是月也命國難九門磔攘注天子九門者路應雉庫臯國近郊逺郊闗門也吕氏春秋注九門三方九門也眀堂位九采之國應門之外北面東上注正門謂之應門二伯帥諸侯而入牧居外而紏察之正義明堂更無重門非路門外之應門爾雅正門謂之應門李廵云宫中南嚮大門應門也應當也當朝正門宫内有路寢故應門之内有路門明堂無路寢故無路門及以外諸門但有應門耳聘禮夕幣於寢門外注寢門外朝也書顧命逆子釗於南門之外注路寢門外南榖梁𫝊僖二十一年春新作南門門者法門也注法令所出入二人雀弁執恵立於畢門之内注路寢門一名畢門疏天子五門臯庫雉應路畢門或謂之虎門或謂之路門路門指路鼓而言虎門指虎賁而言一也康王之誥王出在應門之内注出畢門立應門内之中庭太保率西方諸侯入應門左畢公率東方諸侯入應門右文選七命云應門八襲注正南門周書作雒篇應門庫臺元閫嘗麥篇王陟陛在東序乃北向繇書於内楹之門三禮義宗明天子諸侯門數義周禮天子有九門法陽九之義宫門有五法五行外門有四法四時合為九門一曰闗門二曰逺郊門三曰近郊門四曰國門五曰臯門六曰庫門七曰雉門八曰應門九曰路門皆從外而數故月令云天子九門磔攘也臯門者王宫之外門臯之為言髙也謂其制髙顯也庫門因其近庫即以為名也雉門雉施也其上有觀闕以藏法故以施布政教為名也周禮曰乃縣治象之法於象魏闕也應門謂應接諸侯羣臣常在此門之内也路門路寢之門也周禮疏路大也人君所居皆曰路諸侯七門一曰闗門二曰逺郊門三曰近郊門四曰國門五曰臯門六曰應門七曰路門魯以周公之故雉門兼天子應門之制庫門兼天子臯門之制用二兼四明堂位曰庫門天子臯門雉門天子應門明魯雖得用天子之禮但立三門而名制兼五不得特立五門以同天子也郊特牲曰繹之於庫門内失之矣正義魯失禮又曰獻命庫門之内戒百官也注庫門在雉門之外入庫門則至廟門外矣曽鞏曰諸侯有臯應路門天子加庫雉然春秋魯有庫雉家語衛有庫門或謂褒周公康叔非諸侯常制天子諸侯朝位義天子路寢門有五其最外者曰臯門二曰庫門三曰雉門四曰應門五曰路門路門之内則路寢也臯門之内曰外朝朝有三槐左右各九棘近庫門有三府九寺庫門之内有宗廟社稷雉門之上有兩觀連門觀外有詢事之朝在宗廟社稷之間雉門内有百官宿衛之廨應門内曰中朝中朝東有九卿之室九卿治事之所禮象多士𫝊曰古者百里之國三十里之遂二十里之郊九里之城三里之宫七十里之國二十里之遂九里之郊三里之城一里之宫五十里之國九里之遂三里之郊一里之城以城為宫盖百里之國外城九里雉門是也中城七里庫門是也内城五里路門是也七十里之國外城七里中城五里内城三里五十里之國外城五里中城三里内城一里於百里之國言外城則伯子男外城可知於七十里五十里之國言内城則公侯内城可知一里之城以城為宫則其宫府在中城之内矣孟子曰三里之城七里之郭此侯伯之國也由是言之天子外城宜十二里而匠人營國為城九里者盖中城也外城臯門在焉若今南薫門矣中城雉門在焉若今朱雀門矣内城庫門在焉若今宣徳門矣應門若今大慶殿門矣路門若今垂拱殿門矣庫門適當臯雉應路之中謂之中門周官中門之禁盖在是矣鄭氏謂天子加以庫雉非是盖諸侯之宫外門曰雉門朝門曰庫門内有路門天子加以臯應明堂位曰云云此以言魯王禮故制庫門以臯門之制制雉門以應門之制則諸侯之門本無臯應矣王寢宗廟其正門皆曰應門其内一門皆曰畢門言王於此出而應物入而畢也春秋正義凡人君内朝二外朝一内朝二者路門内外之朝也外朝一者庫門外之朝也若諸侯三門臯應路外朝則在應門外魯之三門庫雉路則外朝在雉門外鄭𤣥考校禮文以為魯門三門庫雉路天子諸侯皆三朝圖宗人之嘉事則有路寢庭朝日出視朝則在路門之外其詢國危云云朝士所掌外朝之位乃在雉門之外曲禮正義天子外屏屏在路門之外諸侯内屏屏在路門之内劉敞曰天子諸侯皆三門而名不同以詩書禮春秋考之天子有臯應畢諸侯有庫雉路天子外朝在臯門之内諸侯外朝在庫門之内天子治朝在應門之内諸侯治朝在雉門之内天子内朝在畢門之内諸侯内朝在路門之内又曰何謂畢門畢者蹕也王出至於此則蹕也師氏掌焉何謂應門應應也王居治朝正天下之政四海之内莫不敬應也何謂臯門臯告也王者外朝播告萬民謀大事也楚辭君之門以九重方氏曰天子五門自内而出一曰路門路大也正寢之門二曰應門應和也路門倡之應門和之三曰雉門觀闕築於此四曰庫門器械藏於此五曰臯門臯緩也近則迫逺則緩臯門為五門之逺者陳氏曰臯者始事之辭周官有臯舞五門始於此故曰臯皆五門以路為大故曰路之路車路馬路寢路鼓名曰路明堂位注臯言髙也朱氏曰雉門之外懸治象所以待民應門之外設宗廟社稷所以嚴神位路門之外則九室九卿朝焉路寢之内亦九室九嬪居焉後漢紀明帝永平八年詔曰昔應門失守闗雎刺世注春秋說題辭曰人主不正應門失守故歌闗雎以感之宋均注曰應門聽政之處薛君韓詩章句曰人君退朝入於私宫后妃御見有度應門擊柝鼓人上堂退反宴處體安志明今内傾於色賢人見其萌故詠闗雎說淑女正容儀以刺時中門守禁竒服不入嚴内治也應門擊柝鼔人上堂正燕處也後漢志河南周公時所城雒邑也春秋時謂之王城東城門名鼎門帝王世紀曰東南門九鼎所從入北城門名乾祭唐志顔師古曰周書叙明堂有應門雉門之制太㣲三光之庭南四星執法中端門左右掖門後旁一星將位天文志周虎門地官師氏掌以媺詔王居虎門之左司王朝注虎門路寢門也王日視朝於路寢門外畫虎焉以明勇猛於守宜也司猶察也察王之視朝若有善道可行者當前以詔王疏司士所掌路門外是常朝日所朝之所經云司王朝故鄭以路寢門外解之師氏守中門外保氏守王闈門冬官匠人闈門容小扃參个其廣凡六尺釋宫闈曰宫中之門謂之王元長曲水詩序入虎闈而齒胄注翰曰敎國子之學所也李善曰蔡邕明堂月令論曰周官有門闈之學闈旁出之門也劉氏曰太保命以二千戈虎賁百人逆子釗于南門之外指虎賁而言故曰虎門齊晏平仲端委立於虎門之外漢有白虎闕神虎門周和門渠門見旂類轅門棘門旌門人門大司馬中夏教茇舍帥以門名注以門名者所被徽識如其在門所植者也古者軍將盖為營治於國門魯有東門襄仲宋有桐門右師皆上卿為軍將者也中冬教大閲遂以狩田以旌為左右和之門羣吏各帥其車徒以叙和出左右陳車徒有司平之注軍門曰和今謂之壘門立兩旌以為之叙和出用次第出和門也左右或出而左或出而右有司平之鄉師居門正其出入之行列也正義師克在和故曰和門漢時軍壘為門名曰壘門司馬法殷誓於軍門之外欲民先意以待事都漢中壘校尉掌北軍壘門周亞夫𫝊有軍門尉壁門士虎賁氏守王閑注梐枑為周衛司戈盾及舍設藩盾土方氏王廵守則樹王舍天官掌舍掌王之㑹同之舍設梐枑再重杜子春謂行馬康成謂再重者周衛有内外列設車宫轅門兩乘車轅相向以表門為壇壝宫棘門司農云以㦸為門為帷宫設旌門王行晝止則樹旌以表門無宫則共人門立長大之人以表門春官司常祭祀各建其旂㑹同賓客亦如之置旌門彼官樹之此供旌秋官修閭氏宿互司農云互為行馬以障互禁止人榖梁傳艾蘭以為防置旜以為轅門詩傳褐纒旃以為門戰國策張孟談遇智過轅門之外以車為門而轅外向孫子兩軍相對曰交和軍門曰和和齊章子與秦交而舍漢書文帝後六年冬匈奴入上郡雲中以河内太守周亞夫為將軍次細栁匈奴傳云軍長安西細栁宗正劉禮次㶚上祝兹侯徐厲次棘門孟康曰在長安北秦時宫門也如淳曰黄圖在横門外匈奴傳云渭北棘門㶚上名括地志棘門在渭北十餘里秦王門水經注横門外郭有棘門項羽傳羽見諸侯將入轅門張晏曰軍行以車為陳轅相向為門周王城十二門地官司門下大夫二人上士四中士八下士十六毎門下士二人掌授管鍵以啓閉國門注司門若今城門校尉主王城十二門疏匠人云營國方九里旁三門四面各三門是有十二門凡歳時之門受其餘疏亦謂國門十二充人凡散祭祀之牲繫於國門使之養注國門謂城門司門之官疏司門總主王城十二門天官職内掌邦之賦入疏城十二門亦有税入秋官士師國禁注國城中也疏若王城十二門冬官匠人營國方九里旁三門注天子十二門以通十二子十二辰也疏王城面各三門左傳注乾祭王城北門周語周秩官曰門尹除門注門尹司門也左傳周有圉門周象魏兩觀漢象魏禮太宰正月之吉始和縣治象之灋于象魏注鄭司農云闕也疏雉門之外兩觀大司徒縣敎象大司馬縣政象大司冦縣刑象小宰小司徒正歳帥屬觀治象之灋敎灋之象易氏曰治之見於象也為治象書治象之法者爲象魏兩觀之縣治象者為魏闕左氏傳莊二十一年鄭伯享王于闕西辟注闕象魏也正義其上縣法象巍巍髙大謂之象魏使人觀之謂之觀定二年雉門及兩觀災冬十月新作雉門及兩觀注雉門公宫之南門兩觀闕也釋宮云觀謂之闕郭璞云宫門雙闕劉熙釋名云闕在門兩旁中央闕然為道也哀三年魯司鐸火季桓子御公立于象魏之外命藏象魏曰舊章不可亡也注謂其書為象魏正義觀闕象魏其事一也公羊傳子家駒曰設両觀乘大路天子之禮也注禮天子諸侯臺門天子外闕兩觀諸侯内闕一觀匠人王宫門阿之制五雉疏天子諸侯臺門大夫不臺門禮器云以髙為貴臺門而旅樹反玷大夫之僭禮國語管仲曰先王世法文武設象以為民紀注韋昭曰設象者設教象於象魏也禮運仲尼出游觀之上注象魏舊章之處莊子魏牟身在江海之上心居魏闕之下列女𫝊衛靈公聞車聲轔轔至闕而止過闕復有聲夫人曰此蘧伯玉也漢書武帝策董仲舒曰周室設兩觀文選陸倕曰象闕之制其來己逺春秋設舊章之教經禮垂布憲之文戴記顯遊觀之言周史書樹闕之夢注周書曰太姒夢太子發取周庭之梓樹於闕間化為松栢北荒明月西極流精海岳黄金河庭紫貝蒼龍𤣥武之制銅雀鐡鳯之工或以聽窮省寃或以布治垂法表正王居光崇帝里揚雄甘泉賦前熛闕後應門注晉灼曰赤色之闕應門正在熛闕之内張衡東京賦建象魏之兩觀旌六典之舊章顔真卿有象魏賦周閎門皇門周書序周公㑹羣臣于閎門以輔主之格言作皇門皇門篇第四十九維正月庚午周公格于左閎門㑹羣臣注路寢左曰皇門曰維其有大門宗子勢臣茂揚肅德訖亦有孚以助厥辟勤王國王家方求論擇元聖武夫羞於王所其善臣以至于有分私子茍克有常罔不允通咸獻言在于王所人斯是助王恭明祀敷明刑王用有監明憲朕命用克和有成用能承天嘏命人斯既助厥勤勞王家先人神祇報職用休俾嗣在厥家王國用寧咸祀天神王用奄有四鄰逺土丕承萬子孫用末被先王之靈光周明堂四門家語觀周篇孔子觀乎明堂覩四門墉有堯舜之容桀紂之象而各有善惡之狀興廢之誡又有周公相成王抱之負斧扆南面以朝諸侯之圖孔子曰此周所以盛也明鏡所以察形往古所以知今玉藻朝日東門之外聽朔南門之外注謂國門明堂在國之陽閠月則闔門左扉立於其中注明堂門中疏皇氏曰明堂有四門明堂位注正門謂之應門正義明堂無重門非路門外之應門魯三門春秋正義定二年夏五月壬辰雉門及兩觀災則兩觀在雉門外也禮運仲尼與於蜡賓事畢出遊於觀上蜡祭在廟故祭出而遊於觀也鄭𤣥考校禮文以為魯制三門庫雉路庫者府庫所在也雉者治朝所在也路者路寢所在也雉猶治也陳氏曰有雉之象故曰雉天子諸侯皆三朝圖宗人之嘉事則有路寢庭朝日出視朝則在路門之外其詢國危國遷立君周禮朝士所掌外朝之位者乃在雉門之外耳雉門之外左有亳社哀四年亳社災右有周社間於兩社是在兩社之間朝廷詢謀大事在此處是執政之所在也周禮閽人疏魯有三門雉門有兩觀為中門明堂位庫門天子臯門雉門天子應門注天子五門臯庫雉應路魯有庫雉路則諸侯三門歟檀弓魯有庫門衛亦有庫門家語云繹之於庫門内郊特牲郊之祭獻命庫門之内戒百官也榖梁傳主王姬者必自公門出注公門朝之外門太王徙居岐周為殷諸侯立臯門應門禮宰夫執鐸以令于宫自寢門至於庫門魯四門春秋僖二年春新作南門左傳書不時也正義本名稷門今新修令髙大改名髙門魯人相傳云然魯城南面三門隠公元年開一門故今南有四門僖公復繕治稷門荀子哀公篇孔子曰君出魯之四門以望四郊春秋説題辭曰魯端門魯城十二門春秋魯城凡有十二門其北名上東門左傳定公八年公歛處父帥郕人自上東門入是也西五門一曰鹿門臧紇斬鹿門以出是也三曰稷門即圉人犖能投蓋於稷門南曰雩門左傳自雩門出􅂪臯比而先犯之是也春秋時魯國都又有萊門子駒之門公羊傳有爭門吏門論語石門注魯城外門也漢公車司馬門百官表衛尉秦官掌宫門衛屯兵有丞景帝初更名中大夫令後元年復為衛尉師古曰漢舊儀云衛尉寺在宮内胡廣曰主宫闕之門内衛士于周垣下為區廬若今仗宿屋屬官有公車司馬衛士旅賁三令丞注師古曰漢官儀云公車司馬掌殿司馬門夜徼宫中天下上事及闕下凡徵召皆總領之令秩六百石聘賢才逹章奏事張釋之衛林等見官制紀髙帝七年二月蕭何造未央宫立東闕北闕注未央宫殿雖南面而上書奏事謁見之徒皆詣北闕公車司馬在焉秦長史欣請事咸陽留司馬門三日不見周禮宫正㡬其出入鄭司農注若今時無引籍不得入宫司馬殿門疏漢宫殿門每門皆使司馬一人守門比千石皆號司馬殿門元帝初元五年四月令從官給事宫司馬中者得為大父母父母兄弟通籍注應劭曰宫内門也師古曰宫之外門也衛尉有八屯衛侯司馬主衛士徼巡宿衛每面各二司馬故謂宫外門為司馬門成帝建始三年十二月舉賢良方正能直言極諫之士詣公車又永始二年舉淳樸有行義詣公車永始四年四月未央宫東司馬門災師古曰東面之司馬門也馬宫門四面皆有司門平帝元始二年秋舉勇武有節明兵法郡一人詣公車黄圖未央長樂甘泉宫四面皆有公車公車主受章疏之所司馬門凡言司馬門者宫垣之内兵衞所在四面皆有司馬門司馬主武事故謂宫之外門為司馬門史記索隠天子有兵欄曰司馬門按漢宫衛令諸出入殿門公車司馬皆下不如令罸金四兩列𫝊張釋之為公車令太子與梁王共車入朝不下司馬門釋之劾不下公門不敬賈誼書天子宫門曰司馬門東方朔上書令待詔公車史記東方朔至公車上書凡用三千奏牘公車令兩人共持舉其書武帝置酒宣室使謁者引見董君朔陛㦸殿下辟㦸而前曰云云上更置酒北宫引董君從東司馬門入司馬門更名東交門注以偃從此入門交㑹於内朱買臣詣闕上書乆不報待詔公車又東郭先生待詔公車車千秋召中二千石博士㑹公車門議問法雋不疑暴勝之薦詣公車拜青州刺史後為京兆尹始元五年有男子詣北闕自謂衞太子公車以聞不疑叱從吏収縳注師古曰公車主受章奏者丙吉為丞相馭吏嘗出見驛吏持赤白􅇸邉郡發奔命書馭吏至公車刺取劉向云章交公車谷永建始三年舉直言對䇿待詔公車息夫躬云云哀帝詔舉明兵法有大慮各一人將軍二人詣公車孔光元壽元年正月召詣公車問日食事又元始元年日食譙元詣公車對策拜議郎公孫𢎞子度為山陽太守詔召鉅野令史成詣公車不遣坐論為城旦元始中詔召公孫𢎞子孫為後者詣公車師丹召詣公車西域𫝊武帝詔曰公車方士以為吉五行志公車大誰卒注主問非常之人因以名官有大誰長石顯諧張猛令自殺公車後紀光武建武七年四月壬午舉賢良方正遣詣公車注公車門名公車所在因以名焉章帝建初五年二月庚辰朔舉直言極諫遣詣公車和帝永元六年三月丙寅舉賢良直言遣詣公車靈帝中平元年三月壬子詔舉列將子及史氏有明戰陳之畧者詣公車後紀趙憙光武引見賜鞍馬待詔公車魯恭舉直言待詔公車拜中牟令尹敏建武二年待詔公車拜郎中第五倫為㑹稽太守永平五年坐法吏民上書守闕是時顯宗方案梁松事亦多為松訟者帝詔公車諸為梁氏及㑹稽太守上書者勿復受樊凖上疏曰宜下明詔如趙孝承官者召詣公車丞宫永平中拜博士淳于恭肅宗除議郎崔實桓帝初對策馬融舉淳樸對策皆詣公車楊秉賜彪黄瓊楊厚荀爽左雄張衡李充杜根皇甫規鄭均戴封周勰橋𤣥汝郁侯瑾等皆公車召安帝臨政之初公車禮聘馮良周爽等鄭𤣥公車再召薛包建光中种岱桓帝時公車特召董扶公車三召毛義明帝時鄭太靈帝時公車召不就王符愛日篇明帝時公車以反支日不受章奏帝曰民廢農桑逺來詣闕而復拘以禁忌豈為政之意乎遂蠲其制丁鴻稟食公車寒朗永初二年薦為博士召詣公車郎顗陽嘉二年正月公車召乃詣闕拜章書奏帝復使對尚書條便宜七事蘓不韋召詣公車樊英建光元年詔公車賜策書召英等六人唯郎宗楊倫到洛陽永建四年三月為英設壇帝令公車令導尚書奉引賜几杖待以師傅禮郎宗詣公車對策陳災異揚雄羽獵賦虎路三􅉄以為司馬圍經百里而為殿門注應劭曰外門為司馬門殿門在内也列女傳鍾離春詣齊司馬門漢未央東北闕蒼龍𤣥武闕詳見未央宫髙紀七年二月史記云八年蕭何造未央宫立東闕北闕注師古曰未央殿雖南嚮而上書奏事謁見皆詣北闕公車司馬亦在焉是則以北闕為正門而又有東門東闕西南兩面無門闕蓋厭勝之術蕭子良云署書漢髙六年蕭何所定以題蒼龍白虎二闕闕白虎當為西史記注駰案闗中記曰未央宫東有蒼龍闕北有𤣥武闕又三輔舊事闕廟記曰未央有白虎屬車闕索隠曰東闕名蒼龍北闕名𤣥武秦舊宫皆在渭北立東北闕取其便也文紀七年六月癸酉未央宫東闕罘罳災西京賦北闕甲第水經注未央宫東有蒼龍闕闕内有閶闔止車諸門西京賦表嶢闕於閶闔注紫微宫門名曰閶闔宫門立闕為表史記田蚡罷朝出止車門北有𤣥武闕即北闕也後官志蒼龍司馬主東門注雒陽宫門名為蒼龍闕門蔡質漢儀司徒府與蒼龍闕對見後後紀中平三年注鑄銅人列於蒼龍𤣥武闕外宦者傳注蒼龍東闕𤣥武北闕西都賦植中天之華闕文選注李尤闕銘曰悉理聽省乃無窮寃秦築冀闕於咸陽萬石君過宫門闕必下車趨漢長安十二門城門候西都賦漢之西都在於雍州實曰長安建金城之萬雉呀周池而成淵披三條之廣路立十二之通門東宣平清明霸南覆盎安西安西章直西城北横洛厨城内則街衢洞達閭閻且千九市開塲貨别隧分漢宮殿名長安有宣平覆盎萬秋横門東都宣德元成青綺章義仁壽𤭔石門見蓺文類聚西京賦城郭之制旁開三門參塗夷庭方軌十二街衢相經㕓里端直甍宇齊平注一面三門門三道塗容四軌周禮曰管國方三門百官表城門校尉掌京師城門屯兵征和二年初置城門屯兵有司馬十二城門􅀱師古曰