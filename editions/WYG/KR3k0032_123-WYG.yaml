苑囿無増益令光武損上林池籞之官廢騁望獵之事樊凖請大官尚方考功上林池籞諸官减無事之物以珍禽竒獸勿育于國盤于游田無逸戒之蒐田時騶虞歌之志職屬少府者自大醫大官守官上林凡四官自侍中至御史皆以文屬焉水衡都尉世祖省并少府又省上林十池監胞人長丞宦者昆臺佽飛三令二十一丞又省水衡屬官令長丞尉二十餘人唐司農亦有上林令漢中書令不言謁者省文也表成帝建始四年更名中書謁者令為中謁者令初置尚書貟五人有四丞中謁者有丞見成紀六典云本尚書也自武帝游宴後庭故用宦者主中書司馬遷為中書令即其任也臣瓚曰漢初中人有中謁者令孝武加中書置僕射中書謁者令宣見楊惲𫝊漢舊儀領奏尚書出入奏事秩千石𢎞恭石顯為中尚書宣帝時任中書官恭為令顯為僕射元帝即位顯代為令初元中前將軍蕭望之領尚書事建白以為尚書百官之本國家樞機武帝游宴後庭故用宦者非古制也宜罷中書宦官不聽成紀建始四年春罷中書宦官初置尚書貟五人注漢舊儀云尚書四人為四曺常侍尚書主丞相御史事二千石尚書主刺史二千石事户曺尚書主庶人上書事主客尚書主外國事成帝置五人有三公曹主斷獄事詳見後中謁者漢承華令附唐六典注後漢少府屬官有承華令典黄門鼓吹一百三十五人百戯師二十七人前表太僕有承華監長丞東京賦駙承華之蒲梢令晉置承華丞屬太常漢尚書令左右丞尚書郎四曹五曹六曹表紀同成帝建始四年春初置尚書員五人有四丞續志初置尚書四人注本紀師古曰漢舊儀云尚書四人為四曹云云成帝置五人有三公曹漢官儀三公曹此成帝加一為五者蔡質漢儀曰三公尚書二人典三公文書吏曹尚書典選舉齊祀屬三公曹靈帝末梁鵠為選部尚書漢丞相御史謂之外朝不可至内庭故置尚書掌四方章奏報告之事章文必有敢吿之字乃下成帝使劾奏王章問谷永受所欲言周官宰夫叙羣吏之治待賔客之令臣民之復逆即漢尚書之職然周屬太宰漢徒以少府領之其後為内朝官雖少府亦亡如之何霍光以大司馬大將軍領尚書事其權寖重孝成用士人雖復舊制然領尚書平尚書事大抵加之中朝作周御史掌賛書注若今尚書詔文司㑹注若今尚書志尚書令一人千石承秦所置晉百官表注曰唐虞官也是謂文昌天府詩云仲山甫王之喉舌蓋謂此人青書注納言喉舌之官讀秦置尚書令尚主也漢銅印綬霍光傳尚書令奏三黄霸𫝊尚書令受丞相對令王世家御史臣光守尚書武帝用宦者更為中書謁者令成帝用士人復故掌凡選置及奏下尚書曹文書衆事晉公卿禮秩尚書令為古冡宰以在端右故也張安世唐林侯霸郭伋馮勤虞詡韓稜黄香宋均朱暉劉陶樊凖陳蕃郭賀左雄周景申屠剛劉寛王暢荀彧為之陳忠前後所奏悉條於南宫閣上以為故事州鄭𢎞前後所陳著之南宫為故事晋杜詩曰舊制九五尚書令一郡二人魏陳矯摰虞箴補我衮闕闡我王猷尚書臣臺宋百官表秦時有尚書令尚書僕射尚書丞司空馬説趙王曰文信侯相秦臣事之為尚書後漢有尚書令司𨽻校尉御史中丞朝㑹専席而坐號三獨坐通典云尚書令總領紀綱事無不統魏晉以下任總機衡事無大小咸歸令僕亦總衆務在唐屬尚書省餘見唐官尚書僕射一人署尚書事六百石通典置尚書五人一人為僕射即建始四年事令不在則奏下衆事鄭崇趙元孔光光以博士高第為尚書轉為僕射令典樞機十餘年光舉尚書僕射成公敞可尚書令鍾離意黄香鮑永虞詡樂恢朱暉宋登黄瓊胡廣皆為之注案獻帝初分置左右僕射建安四年以榮邵為尚書左僕射是也六典注建安四年榮邵為尚書左僕射始分置左右表僕射秦官自侍中尚書皆有後漢衆務歸尚書三公受成事而已尚書六人六百石成帝初置尚書四人表建始四年初置員五人分為四曹常侍曹二千石曹民曹主客曹三公曹晉漢舊儀初置五曹有三公曹主斷獄志成帝又置三公曹是為五曹尚孝元時石顯用事劉向𫝊曰尚書五人皆其黨也則書有五人非始於孝成矣為漢以尚書收中書之權遂後世開兩省之漸常侍曹尚書主公卿事蔡質漢儀主常侍黄門御史事世祖改曰吏曺亦謂之選部二千石曹尚書主郡國二千石事漢舊儀云主刺史蔡質漢儀掌中都官水火盗賊辭訟事亦謂之賊曹民曹尚書主凡吏上書事蔡質漢儀典繕治功作監池苑囿客曹尚書主外國夷狄事尚書龍作納言應劭曰今尚書王之喉舌世祖承遵後分二千石曹又分客曹為南主客曹北主客曹凡六曹尚書何敞張敏陳寵成翊世翟酺王龔盧植天順帝永建元年初令三公尚書入奏事韋彪上疏下樞要在於尚書而間者多從郎官超升此位雖習文法長應對然小慧無大能通典周之司㑹其職也周禮天官有司㑹鄭𤣥曰若今尚書秦少府遣吏四人在殿中發書故謂之尚書尚主也漢承秦置武帝用宦者主中書以司馬遷為之中間遂罷其官以為中書之職成帝罷中書宦者又置尚書五人一人為僕射四人分六曹唐六典注漢列曹尚書四人成帝加至五人司馬彪言成帝置列曹尚書恐誤也通掌圖書祕記章奏之事其任猶輕至後漢則優重出納王命敷奏萬幾故李固云陛下之有尚書猶天之有北斗北斗為天喉舌尚書亦為陛下喉舌斗斟酌元氣運乎四時尚書出納王命賦政四海令及左丞總綱紀僕射右丞分掌廩假錢穀漢初尚書雖有曹名不以為號靈帝末以侍中梁鵠為選部尚書始見曹名謂之尚書臺亦謂之中臺後漢尚書五曹六人三公曹二人吏二千石民客曹兩梁冠納言幘陳忠拜尚書居三公曹天翟酺𫝊尚書有缺詔將大夫六百石以上試對政事文道術以高第補之酺對第一晉志光武以三公曹主嵗攷課州郡事改常侍曹為吏曹主選舉祠祀事後漢以前漢五曹更加中都官曹為六曹六曹并令僕八人謂之八座魏改選部為吏部又有左民客曹五兵度支凡五曹尚書二僕射一令為八座晉初有吏部三公客曹駕部屯田度支六曹太康有吏部殿中五兵田曹度支左民六曹渡江有吏祠部五兵左民度支五尚書宋又有都官為六尚書梁别有起部而不常置崔子玉尚書箴出入王命王之喉舌兑吉其和巽吝其頻書臣司命繁欽亦有箴云龍作納言帝命惟允山甫翼周實司喉吻録尚書附晉志漢武時左右曹諸吏分平尚書奏事知樞要者始領尚書事霍光以大將軍張安世史高以車騎王鳳以大司馬蕭望之以前將軍師丹以左將軍周堪孔光以光祿勲張禹鄭寛中以光祿大夫霍山以奉車都尉並領尚書事谷永謂鄭寛中參冡宰之重職于薛宣給事中視尚書事尚光祿大夫定國太中大夫張敞平書事章帝以太𫝊趙憙太尉牟融並錄尚書事尚書始有錄名亦西京領尚書之任猶唐虞大麓之職也和帝時太尉鄧彪為太傅錄尚書事位在三公上毎少帝立則置後以為常猶古冡宰緫已之職桓焉李固張禹徐防龎參錄尚書事魏晉以公卿權重者為之左右丞各一人四百石掌録文書期㑹左丞主吏民章報及騶伯史漢儀曰總典臺中綱紀右丞假署印綬及紙筆墨諸財用庫藏漢儀曰右丞與僕射對掌授廩假錢穀與左丞無所不統黄香拜左丞功滿當遷和帝留増秩後拜尚書遷僕射書楊喬尚書侍郎左丞轉右丞閑練故事應順尚郎轉右丞通典秦置丞一人屬少府建始四年置丞四人光武减其二唯置左右侍郎三十六人四百石一曹有六人主作文書起草注漢儀曰尚書郎初從三署詣臺試初上臺稱守尚書郎中歳滿稱尚書郎三年稱侍郎客曹郎主治羌胡事劇周嘉劉祐為侍郎陽球補侍郎閑達故事章奏處議為臺閣所崇信尚書郎通典西漢置四人史記褚先生補年表云王遷為尚書郎事昭帝以分掌尚書其一人主匈奴單于營部一人主羌夷吏民一人主户口開田一人主財帛委輸光武分六曹之後置三十四人秩四百石并左右丞為三十六人晉志同漢官儀侍郎三十五人續志三十六人當攷郎主作文書起草更直五日於建禮門内陳忠上疏曰諸郎鮮有雅才毎為詔文轉相求請薦光祿郎周興為尚書郎入直官供青縑白綾被或以錦緤為之奏事明光殿省中含鷄舌香奏事以黄門侍郎對揖侍郎稱已聞乃出丞郎月賜赤管大筆隃糜墨決録注故事尚書郎以令史久缺補之世祖始改用孝㢘為郎丁邯稱病不就義馮豹胡廣黄香樊凖徐防桓彬陳重雷皆為之田蚡為諸曹郎魏黄初改袐書為中書置通事郎掌詔草而尚書郎有二十三人青龍二年陳矯奏置都官騎兵合二十五郎晉武時有三十四曹後又置運曹郎中二十三人或為三十六曹東晉十五曹宋十九曹元嘉後二十曹梁加其三天監三年復置侍郎陳二十一曹後魏三十六曹西魏大統十三年改為十二部北齊二十八曹隋初六曹二十四司領三十六侍郎開皇三年二十四司始置員外郎一人煬帝置六曹侍郎各一人貳尚書之職今之侍郎其置始此二十四司侍郎若今郎官改諸司侍郎曰郎唐改為郎中武徳六年廢六司侍郎貞觀二年正月復舊令史十八人二百石曹有二主書後増劇曹三人合二十一人注古今注永元三年七月増尚書令史員功滿補小縣墨綬給事尚書張安世為郎給事尚書擢尚書令馮勤為郎中給事尚書中宫尚書志大長秋有五人六百石宦者主中文書漢侍中表加官侍中中常侍得入禁中志屬少府侍中比二千石漢官秩曰千石周禮大僕干寳注曰若漢侍中無員掌侍左右贊導衆事顧問應對法駕出則多識者一人參乗餘皆騎在乗輿車後本有僕射一人中興轉為祭酒或置或否注蔡質漢儀曰侍中常伯選舊儒高徳博學淵懿仰占俯視切問近對喻㫖公卿上殿稱制參乗佩璽秉劍貟本八人舊與中官俱止禁中輿服志侍中冠武弁大冠亦曰恵文冠加金璫附蟬為文貂尾為飾恵帝時冠鵔鸃貝帯命谷永曰龍筦納言帝惟允勅正左右齊栗之臣戴金貂之飾執常伯之職者使學先王之道知君臣之義則左右肅艾羣僚仰法後五行志南宫侍中寺通典秦侍中本丞相史也五人徃来殿内東箱奏事謂之侍中漢為加官所加或列侯將軍卿大夫將都尉尚書大醫大官令至郎中侍左右分掌乗輿服物武帝以孔安國儒者掌御唾壺朝廷榮之張辟疆年十五三桑𢎞羊十三彤金日磾世名忠孝七世内侍祭曹魴世侍中邳為左曹侍中丁恭承宫為酒丹西都侍中有嚴朱東方吾丘蘇武歐陽地餘王商師劉歆于永傅喜東都有包咸桓郁劉淑戴慿魯恭鄭𢎞宣秉劉平愷寛珍丁鴻趙孝伏無忌李法楊厚賜承宫樓望王逸李育翟酺杜喬盧植李固上疏曰一日朝㑹見諸侍中並皆年少無一宿儒大人可顧問者晉志黄帝時風后為侍中周為常伯之任秦取古名置侍中漢因之秦漢俱無定員􅀭雄侍中箴曰光光常伯儵儵貂璫胡廣箴皇矣聖上神居天處勤求俊良是弼是輔昔在周文創德西隣辛尹是訪八虞是詢亦惟先正克謹左右常伯常任寔為政首侍臣司中敢告執矩中常侍表加官志千石宦者無員後增秩比二千石掌侍左右從入内官贊導内衆事顧問應對宦者𫝊漢興襲秦制置中常侍官引用士人以參其選皆銀璫左貂給事殿省中興之初悉用閹人永平中置中常侍四人延平増至十人改以金璫右貂玉海卷百二十三
