body:
  text: 玉海卷百二十三宋王應麟撰官制九卿屬官漢九卿九列十二卿百官公卿表九卿秩中二千石續百官志同劉熈云漢置十二卿太常太僕衞尉光祿勲宗正執金吾大司農少府大鴻臚廷尉大長秋將作大匠韋昭辨云漢正卿九太常至少府執金吾為外卿不在九列大匠次金吾長秋自皇后官非天子貟卿自漢以来九卿所居謂之寺韋𤣥成𫝊恤我九列注卿之位疏陳蕃上疏備位九列通典漢以太常光祿勲衞尉大僕廷尉大鴻臚宗正大司農少府謂之九寺大卿後漢九卿而分屬三司大常光祿勲衞尉三卿並太尉所部太僕廷尉大鴻臚三卿並司徒所部宗正大司農少府三卿並司空所部春秋漢含孳曰九卿法河海北斗漢奉常大常表奉常秦官掌宗廟禮儀漢官解詁社稷郊畤事重職尊故在九卿之首叔孫通定宗廟儀法袁盎景帝中六年更名太常註師古曰太常王者旌旗畫日月王有大事則建以行禮官主奉持之故曰奉常後改太常尊大之義應劭曰欲令國家盛大常存故稱太常子唐楊收曰藏天旂常奉常髙帝七年叔孫通始為之大常景帝中六年吳利始為之訓元朔二年孔臧為大常綱紀古禮賜如三公韋𤣥成劉慶忌杜業免蘇昌坐泄祕書莽改太常曰秩宗唐六典漢髙名曰太常惠帝復曰奉常景帝又曰太常史記叔孫通傳髙帝拜通為太常太漢官典職亦云惠帝改常為奉常續志卿一人中二千石盧檀禮注曰如大樂正掌禮儀祭祀先奏其禮儀及行事贊天子每選試博士奏其能否大射養老皆奏其禮儀每月前晦察行陵廟漢官曰員吏八十五人掌宗廟郊祀禮樂典經荀悦云漢西京太常行陵赤車千乘三十九人多遷玉鉉職當陵廟繁劇多過令東漢桓榮乗輿幸太常府榮坐東面設几杖天子親自執業丁鴻劉愷周澤桓郁楊震賜律厯志宫商角徴羽太常掌之七畧外有太常太史博士之藏周禮注宗伯宗官典禮於祭祀漢太常是也宋百官志漢志以列侯忠孝敬謹者居之如周大司樂通典唐虞秩宗周曰宗伯秦改奉常云云後漢不必侯也建安中為奉常魏黄初改為太常崔駰太常箴翼翼太常寔為宗伯穆穆靈祗寢廟奕奕稱秩元祀班于羣神我祀既祗我粢孔蠲弗祈弗求惟徳之報不矯不誣庶無罪悔常臣司宗敢吿執書典樂教冑子子魯秉周禮齊不敢謀晏折衝樽爼之間國之典常上下守之則國安而民服史記注鄭𤣥曰禮局稱容臺漢大常屬官大樂令大樂官大予樂令雅樂郎大祝令大宰令大史令大卜令大醫令食官令表奉常有丞志丞一人比千石盧植禮注曰如小樂正掌凡行禮及祭祀小事總署曹事漢舊儀丞舉廟中非法者典韋𢎞為太常丞職奉宗廟諸陵邑鮑徐偃谷永譙𤣥業為之其署曹掾史隨事為員諸卿皆然太常掾朱博以太常掾察㢘主簿漢官儀鹵簿篇太常駕四馬主簿前車八乘表屬官有大樂大祝大宰大史大卜大醫六令丞又均官都水兩長丞諸廟寝園食官令長丞又廱大宰大祝令丞又博士及諸陵縣皆屬焉大樂令律厯志宫商角徵羽職在大樂禮樂志制氏以雅樂聲律世世在大樂官但能紀其鏗鏘鼓舞元光五年河間獻王獻樂詔下大樂官常存肄之律志武帝時樂官考正哀帝罷樂府官丞相光大司空武奏大凡八百二十九人其三百八十八人不可罷可領屬大樂奏可禮大胥注漢大樂律樂桓譚父成帝時為大令表元鼎五年陽平侯杜相為大常五年坐擅繇大樂令論􅀭雄大樂令箴陶唐五帝設為六樂續志大予樂令一人六百石掌伎樂凡國祭祀掌請奏樂及大饗用樂掌其陳序漢官曰員吏二十五人樂人八佾舞三百八十人盧植禮注曰大予令如古大胥漢大樂律卑者之子不得舞宗廟之耐明紀永平三年八月戊辰改大樂為大予令漢官儀曰令一人丞一人盧植禮注曰大樂丞如古小胥晉志魏武平荆州獲漢雅樂郎杜䕫䕫𫝊雅樂四曲黄初中夔為大樂令樂宋志云魏復為大樂令有工以納言時而颺之作崇徳以和神人韶夏容咸英有節放鄭聲大祝令表有廱大宰大祝令丞如淳曰五畤在廱故特置五畤各一尉郊祀志高帝復置大祝大宰文紀十三年夏除祕祝之官景中六年更名太祝為祠祀武太初元年更名曰廟祀志大祝令一人六百石凡國祭祀掌讀祝及迎送神漢舊儀廟祭大祝令主席酒漢官曰員吏四十一人牽牲就庖禮儀志注郊儀大祝令繞牲舉手曰充東觀記陰猛好學温良以郎遷大祝令丞一人掌祝小神事祠祀令一人後轉屬少府注東觀書曰章帝又置祀令丞延平元年省祝史正辭以告秦周大祝屬宗伯祀官有祕祝移過於下大宰令志一人六百石掌宰工鼎爼饌具之物祭祝陳饌具漢官曰明堂丞一人二百石員吏四十二人丞一人郊祀志高帝召故秦祀官復置大祝大宰如其故儀月令仲秋命宰祝循行犧牲注大宰大祝主祭祀之官也元禮樂志注元帝時大宰丞李大史令志一人六百石掌天時星厯凡歳将終奏新年厯國祭祀之事掌奏良日國有瑞應灾異掌記之漢官儀有望郎三十人掌記三十人房鳯待詔三十七人李信其六人治厯三人龜卜二人易筮丞一人明堂及靈䑓丞一人二百石二丞掌守明堂靈䑓掌􅀱日月星氣皆屬太史注漢官曰靈䑓待詔四十二人其十四人􅀱星元光中天星揺問􅀱星者二人􅀱日三人􅀱風十二人􅀱氣望氣正朔帝武帝遣望氣佐􅀱蓬莱氣吉西域𫝊武詔太史治星望氣皆以為三人􅀱晷景七人􅀱鍾律一人舎人通典夏有太史終古執圖法奔殷殷太史高勢一作向摯載圖法奔周周官太史正歳年以序事馮相氏視天文之次序保章氏掌天文之變周宣王時太史官失其守而為司馬氏司馬氏世典周史司馬氏世主天官晉太史屠黍見晉之亂以圖法歸周韓宣子聘魯觀書太史氏秦太史令胡毋敬之作博學七章蕭何草律曰太史試學童漢武置太史公以司馬談為之秦漢以来太史之任盖併周之太史馮相保章三職周太史下大夫二人上士四人小史命士二十有四人而屬乎宗伯猶漢之令丞屬太常也司馬遷𫝊談為太史公注如淳曰漢儀注太史公武帝置位在丞相上天下計書先上太史公副上丞相序事如古春秋遷死後宣帝以其官為令行太史公文書而已師古曰談為太史令遷尊其父故謂之公如説非也晉灼曰百官表無太史公在丞相上又衞宏所説多不實未可以為正郊祀志太史令談注司馬談也天茂陵中書談以太史丞為太史令年史記太史公掌官索隱曰博物志太史令司馬遷二十八三年六月乙邜除六百石太史令司馬遷議張夀王虞恭四分歴尹咸校數術張衡再為之造渾儀通單颺定經又問灾異知孫懿於王立史丞鄧平史曰張衡單颺王立唯占􅀱是太非復記言之司隆魏高堂􅀭雄太史令箴見分紀終崔子玉東觀箴云夏殷摰周􅅨晉黍七畧外有太史之藏荀悦請備置史官掌典文紀行事於盡歳舉之尚書以助賞罰太卜令表大初元年初置太卜六典注漢武置太卜博士續志後省并太史周領於春官史記日者𫝊代王之入任於卜者太卜之起由漢興而有索隱曰周有太卜此云由漢興者謂文帝卜大横之後卜官更興盛龜䇿𫝊高祖時因秦太卜官雖父子疇官世世相𫝊精㣲深妙多所遺失武帝博開藝能之路大卜大集上欲擊匃奴攘大宛收百越預見表象先圖其利褚先生曰臣為郎時與大卜待詔為郎者同署言曰孝武時聚㑹占家有五行堪輿建除叢辰厯天人太一家制曰以五行為主武帝北伐易之卦得大過爻在九五卜諸将貳師最吉今卦兆皆反繆公車方士太史治星望氣及大卜龜蓍皆以為吉龜古者卿大夫與謀參以蓍官占先志謀及卿士庶人太醫令表少府有太醫令太常復有令丞盖禮官之太醫司存之所少府之太醫通乎王内應劭曰周官續志一人六百石掌諸醫藥丞主藥方丞主藥方各一人屬少府漢官曰員醫二百九十三人員吏十九人位郭玉為太醫丞陳忠言太醫令奉方藥從大夫車有韜沂冠有兩梁厚脂習為令有欒布之節永建二年召楊詔太醫致藥通典周官有醫師掌醫之政令秦太醫令李醯兩漢有令丞亦主醫藥屬少府崔寔大醫令箴僧坦為大醫正唐柳公綽太醫箴知梁姚上醫醫國原診政巫咸以鴻術為帝堯之醫外戚𫝊太醫監充國隋志孝成命太醫監李柱國校方技前志云侍醫醫貢禹𫝊侍醫臨治師古曰天子之蓋勲𫝊云小黄門高望為尚藥監均官都水兩長丞表注服䖍曰均官主山陵上槀輸入之官也如淳曰律都水治渠隄水門三輔黄圖云三輔皆有都水少府有均官谷永願減均官用度諸廟寝園食官令長丞馮參竟寜中以王舅出補渭陵食官令如淳曰給陵上祭祀之事廟郎功臣表寢郎馮參高寢令韋方山高寢郎車千秋孝文園令司馬相如渭陵寢中郎馮參延陵園郎班穉續志高廟令一人六百石掌案行掃除世祖廟令一人六百石如高廟每陵園令各一人六百石毎陵食官令各一人六百石掌望晦時節祭祀漢官曰食監一人秩六百石即食官令監丞一人三百石續志中興以來省前凡十官注太宰均官都水雍大祝五畤各一尉也續志即後漢百官志以後止言志漢禮官附容史紀元朔元年十一月詔中二千石禮官博士議不舉孝廉者罪五年六月詔令禮官勸學儒林𫝊魯徐生善為頌孝文時以頌為禮官大夫𫝊子至孫延襄襄亦以頌為大夫延及徐氏弟子公户滿意桓生單次皆為禮官大夫言禮為頌者由徐氏注蘇林曰漢舊儀有二郎為頌貌威儀事有徐氏張氏天下郡國有容史皆詣魯學之郊祀志徐偃曰太常諸生行禮不如魯善兩都賦序武宣崇禮官考文章史記禮書余至大行禮官觀三代損益漢博士五經博士博士十四家五經大夫䇿試博士表奉常秦官博士屬焉博士秦官通古今秩比六百石員多至數十人武帝建元五年初置五經博士宣帝黄龍元年稍増員十二人劉歆𫝊文帝時始使掌故晁錯從伏生受尚書伏生故秦博士詩始萌芽天下衆書往往頗出皆諸子𫝊説猶廣立於學宫為置博士在朝之儒唯賈生而已文選注賈誼作左傳訓詁為文帝博士孟子題辭云孝文皇帝欲廣游學之路論語孝經孟子爾雅皆置博士後罷傳記博士獨立五經而已待漢舊儀文帝時博士七十餘人朝服𤣥端章甫冠為詔博士武紀建元五年春置五經博士元朔五年夏六月詔曰其令禮官勸學講議洽聞舉遺興禮以為天下先太常其議與博士弟子崇鄉黨之化以厲賢材丞相𢎞請為博士置弟子員學者益廣東萊曰孝文尚置傳記博士安有獨遺五經之理建元置五經博士非始置也即獨立五經置傳記之時也元紀初元五年四月詔博士弟子毋置員以廣學者永光三年冬復博士弟子員成紀陽朔二年九月詔儒林之官四海淵源宜皆明於古今温故知新通達國體故謂之博士丞相御史其與中二千石二千石雜舉可充博士位者使卓然可觀劉歆𫝊歆及向始皆治易宣帝時詔受糓梁春秋十餘年大明習及歆校袐書見古文春秋左氏歆大好之以為左丘明好惡與聖人同及歆親近欲建立左氏春秋及毛詩逸禮古文尚書皆列於學官哀帝令歆與五經博士講論其義博士或不肯置對歆曰徃者博士書有歐陽春秋公羊易則施孟然孝宣皇帝猶廣立糓梁春秋梁丘易大小夏侯尚書義雖相反猶並置之儒林𫝊敘高帝誅項籍於是諸儒始得修其經學講習大射鄉飲之禮然亦未皇庠序之事孝恵高后孝文景時諸博士具官待問未有進者孔襄為恵帝博士漢文帝時賈誼為博士又申公為詩最精以為博士春毛公以詩貫公以左氏為河間王博士董仲舒治秋孝景時為博士漢興言易自淄川田生言書自濟南伏生名勝言詩於魯則申培公名培於齊則轅固生名固燕則韓太傅名嬰言禮則魯高堂生言春秋於齊則胡毋生於趙則董仲舒及武安君田蚡為丞相黜黄老刑名百家之言延文學儒者以百數而公孫𢎞以治春秋為丞相封侯天下學士靡然向風矣武帝為博士官置弟子五十人劉歆曰至孝武然後鄒魯梁趙頗有詩禮春秋先師皆起於建元之間一人不能獨盡其經或為雅或為頌相合而成泰誓後得博士集而讀之昭帝増博士弟子員滿百人宣帝末増倍之元帝好儒能通一經者皆復數年以用度不足更為設員千人郡國置五經百石卒史成帝末増弟子員三千人嵗餘復如故成帝時博士選二科平帝時王莽秉政増元士之子得受業如弟子勿以為員嵗課甲科四十人為郎中乙科二十人為太子舎人丙科四十人補文學掌故云贊曰自武帝立五經博士開弟子員設科射䇿勸以官祿迄于元始百有餘年𫝊業者寖盛支葉蕃滋一經説至百餘萬言大師衆至千餘人蓋祿利之路然也魏名臣奏西京學官博士七十餘人初書惟有歐陽禮后易楊春秋公羊而已至孝宣世復立大小夏侯尚書大小戴禮施孟梁丘易糓梁春秋至元帝世復立京氏易平帝時又立左氏春秋毛詩逸禮古文尚書所以罔羅遺失兼而存之是在其中矣元始元年立樂經益博士經各五人文翁𫝊景帝末為蜀守選郡縣小吏張叔等十餘人詣京師受業博士數嵗蜀生皆成就王式𫝊詔除下為博士衣博士衣後漢翟酺𫝊初酺之為大匠上言孝文皇帝始置一經博士注不知所據孝武大合天下之書孝宣論六經於石渠學者滋盛弟子萬數唐六典注高祖時叔孫通始為博士定禮制通典賈誼公孫𢎞董仲舒朱雲匡衡疏廣韋賢皆為之孔安國延年禇大夏侯勝孔霸平當翟方進馬宫師丹龔舎翼奉張禹元帝時孔光成帝時續志博士祭酒六百石本僕射中興轉為祭酒祭酒見後博士十四人比六百石周澤召試博士戴慿舉明經試博士易四施孟梁丘京氏尚書三歐陽大小夏侯氏詩三魯齊韓氏禮二大小戴氏春秋二公羊嚴顔氏掌教弟子國有疑事掌承問對本四百石宣帝増秩章紀建初四年十一月壬戌詔曰漢承暴秦褒顯儒術建立五經為置博士其後學者精進雖曰承師亦别名家宣帝以去聖久逺學不厭博故遂立大小夏侯尚書後又立京氏易至建武中復置顔氏嚴氏春秋大小戴禮博士翟酺𫝊光武起太學博士舎内外講堂此皆所以扶進㣲學尊廣道藝也八年冬十二月戊申詔曰五經剖判去聖彌逺章句遺辭乖疑難正恐先師㣲言將遂廢絶其令羣儒選高才生受學左氏糓梁春秋古文尚書毛詩以扶㣲學廣異義焉安紀元光二年正月詔選三署郎及吏人能通古文尚書毛詩糓梁春秋各一人延平元年納樊凖之言妙簡博士召李充為之徐防𫝊永元十四年十一月癸卯拜司空防以五經久逺聖意難明宜為童句以悟後學上疏曰漢承秦亂經典廢絶開置太學故立博士十有四家設甲乙之科以勉勸學者臣以為博士及甲乙䇿試宜從其家章句開五十難以試之觧釋多者為上第引文明者為高説五經各取上第六人論語不宜射䇿詔書下公卿皆從防言注漢官儀曰光武中興恢𢎞稽古易有施孟梁丘賀京房書有歐陽和伯夏侯勝建詩有申公轅固韓嬰春秋有嚴彭祖顔安樂禮有戴聖戴徳凡十四博士太常差選有聰明威重一人為祭酒總領綱紀也儒林𫝊光武中興愛好經術未及下車而先訪儒雅採求闕文補綴漏逸先是四方學士多懷挟圖書遁逃林藪自是莫不抱負墳䇿雲㑹京師范升陳元鄭興杜林衞宏劉昆桓榮之徒繼踵而集於是立五經博士各以家法教授易有施孟梁丘京氏尚書歐陽大小夏侯詩齊魯韓氏禮大小戴春秋嚴顔凡十四博士大常差次總領焉初田何傳易相授至田王孫授沛人施讎東海孟喜琅邪梁丘賀由是易有施孟梁丘之學博士缺人薦孟喜上聞其改師法不用又東郡京房受易於焦延夀别為京氏學又東莱費直傳易授王璜别為費氏學又沛人高相𫝊易授子康毋將永為高氏學施孟梁丘京氏四家皆立博士費高二家未得立濟南伏生名勝𫝊尚書授張生及歐陽生字和伯歐陽世世相𫝊歐陽高為歐陽氏學歐陽歙八世博士張生授夏侯都尉至夏侯勝為大夏侯氏學建為小夏侯氏學三家皆立博士又孔安國𫝊古文尚書為古學未得立魯人申公受詩於浮丘伯為魯詩齊人轅固為齊詩燕人韓嬰為韓詩三家皆立博士趙人毛萇傳詩是為毛詩未得立魯高堂生傳禮十七篇後瑕丘蕭奮以授后蒼蒼授梁人戴德戴聖沛人慶普於是德為大戴禮聖為小戴禮普為慶氏禮三家皆立博士孔安國所獻禮古經五十六篇及周官經五十六篇前世𫝊其書未有名家中興以後亦有大小戴博士雖相𫝊不絶然未有顯於儒林者建武中曺充習慶氏學𫝊其子褒遂撰漢禮齊胡毋子都𫝊公羊春秋相授至魯人眭孟授東海嚴彭祖魯人顔安樂由是有顔氏嚴氏學又瑕丘江公𫝊糓梁春秋三家皆立博士梁太𫝊賈誼為春秋左氏訓詁授貫公建武中鄭興陳元𫝊春秋左氏學時尚書令韓歆上疏欲為左氏立博士范升與歆争之未决陳元上書訟左氏遂以魏郡李封為左氏博士後羣儒蔽固者數廷争之及封卒光武重違衆議而因不復已上五經博士始末並見後漢儒林傳内朱浮𫝊建武七年轉太僕浮以國學既興宜廣博士之選乃上書曰博士之官為天下宗師舊事䇿試博士必廣求詳選博舉明經惟賢是登伏聞詔書更試五人唯取見在洛陽城者臣恐四方之學無所勸學帝然之注漢官儀曰武帝初置五經博士後増至十四人其舉狀曰生事愛敬䘮沒如禮通易尚書孝經論語兼綜載籍窮㣲闡奥隱居樂道不求聞達身無金痍痼疾世六屬不與妖惡交通王侯賞賜行應四科經任博士下言某官某甲保舉范升𫝊時韓歆上疏欲為費氏易左氏春秋立博士詔下其議建武四年正月朝公卿大夫博士於雲臺遂與韓歆及中大夫許淑等互相辨難日中乃罷升退奏左氏之失凡十四事又上太史公違戾三十一事詔以下博士陳元𫝊范升復與元相辨難凡十餘上帝卒立左氏學太常選博士四人元為第一帝以元新忿争乃用其次司𨽻從事李封於是諸儒以左氏之立論議讙譁自公卿以下數廷爭之左氏復廢賈逵𫝊肅宗立降意儒術特好古文左氏傳建初元年詔逵發出左氏𫝊大義書奏帝嘉之令逵自選公羊嚴顔諸生高才者二十人教以左氏與簡紙經傳各一通八年乃詔諸儒各選高才生受左氏糓梁春秋古文尚書毛詩由是四經遂行於世皆拜逵所選弟子及門生為千乗王國郎朝夕受業黄門署學者皆欣欣羡慕祭遵𫝊博士范升追稱遵曰建為孔子立後奏置五經大夫楊仁傳太常上仁經中博士仁自以年未五十不應舊科上府辭選顯宗詔補北宫衞士令漢舊儀博士限年五十以上楊震𫝊遷太常先是博士選舉不實震薦明經名士楊倫等孫叔通自楚歸漢即拜為博士是時雖有博士之官挾書之律猶未除也至惠帝始除之孝文復廣游學之路而天下衆書往往頗出論語孝經孟子爾雅皆置博士趙岐孟子序至五經得列於學官者惟詩而已申公韓嬰皆以詩為博士即所謂魯詩韓詩楚元王𫝊文帝時聞申公為詩精以為博士儒林𫝊韓嬰文帝時為博士翟酺曰文帝始置一經博士葢謂此景帝復立齊轅固詩儒林傳固景帝時為博士而餘經猶未立至武帝憲章六學始罷𫝊記博士獨立五經此本紀百官表所謂建元五年春初置五經博士是也班固儒林𫝊贊曰武帝立五經博士書唯有歐陽歐陽生禮后蒼易楊何春秋公羊而已且立五經而獨舉其四葢詩已立於文帝今并詩為五耳宣帝復立大小夏侯尚書施孟梁丘易糓梁春秋大小戴禮元帝復立京氏易平帝又立左氏春秋毛詩逸禮古文尚書文帝時申公韓嬰皆以詩為博士所謂魯詩韓詩景帝時轅固為博士所謂齊詩雖置博士亦猶孟子爾雅置博士未名曰詩博士孟子博士爾雅博士也建元之置五經博士乃置書禮易春秋博士與詩為五始有書博士詩博士之名謹按文帝以賈誼為博士初不曰左氏博士宣帝以江公之孫為博士授糓梁未名糓梁博士至甘露三年始置糓梁博士此二事可以為驗晉志少微四星在太㣲西或曰博士官史記秦博士七十人備員弗用非博士官所職藏詩書者悉燒之崔子玉博士箴洋洋三代典禮是修畫為辟雍國有學校侯有泮宫各有攸教德用不陵儒臣司典掌故見後漢祭酒附續志博士祭酒一人六百石本僕射秦官始皇三十四年博士僕射周青臣中興轉為祭酒胡廣曰官名祭酒皆一位之元長者也古禮賓客得主人饌則老者一人舉酒以祭於地侍中僕射一人亦轉為祭酒侍中祭酒更始以卓茂為之興建武二十年丁恭永平初張十七年承宫荀卿在齊三為祭酒蘇竟平帝世以明易為博士講書祭酒注王莽置六經祭酒秩上卿毎經各一人竟為講尚書祭酒龔勝王莽遣使者即拜為講學祭酒劉寛每行縣輒引學官祭酒執經對講伍被傳吳王賜號為劉氏祭酒應劭曰禮飲酒必祭示有先也如淳曰祭時唯尊長以酒沃酹韋昭辨釋名曰凡燕饗必尊長老以酒祭先宣帝以蘇武著節老臣朝朔望號稱祭酒漢舊儀丞相設四科之辟第一科補西曹南閤祭酒周澤建武末辟大司馬府議曹祭酒秦順太守韓崇召為東閤祭酒立薛方為郡掾祭酒子吳都講祭酒以教諸國子祭酒見學校氏宋志周有師之職即今國子祭酒也漢祠官附祠祀官紀高帝二年六月令祠官祀天地四方上帝山川以時祠之贊高祖即位置祠祀官有秦晉梁荆之巫世祠天地綴之以祀應劭曰先人所在之國博求神靈文穎曰巫掌神之位次范氏世仕晉故有晉巫支庶留秦為劉氏故有秦巫隨魏都大梁故有梁巫後徙豐豐屬荆故有荆巫文帝十三年夏除祕祝十四年春詔曰先王逺施不求其報望祀不祈其福今聞祠官祝釐皆歸福朕躬不為百姓朕甚愧之其令祠官致敬無有所祈過則自歸福則衆共古帝王用心也武帝建元元年五月詔曰河海潤千里令祠官修山川之祠為歳事元封元年春正月詔令祠官加増大室祠周春官典祀中士二人下士四人郊祀志秦并天下令祠官所常奉天地名山大川􅀑神可得而序皆太祝常主漢二年冬高帝召故秦祀官復置太祝太宰如故儀詔曰吾甚重祠而敬祭後四歳六年天下已定詔御史令豐治枌榆社令祝立蚩尤祠於長安長安置祠祀官女巫梁巫祠天地天社天水房中堂上之屬晉巫祠五帝東君雲中君巫社巫祠族人炊之屬秦巫祠杜主巫保族纍之屬荆巫祠堂下巫先司命施糜之屬九天巫祠九天皆以歳時祠宫中河巫祠河於臨晉南山巫祠南山秦中各有時日文帝怠於􅀑神之事渭陽長門五帝使祠官領以時致禮孝景即位十六年祠官各以嵗時祠如故武帝敬􅀑神之祀人有言古天子常以春解祠令祠官領之如其方祠官寛舒議后土壇具泰一祠壇令祠官禮東泰山而不封方士所興祠各自主其人終則已祠官不主成帝初罷梁晉秦荆巫贊曰究觀方士祠官之變谷永之言不亦正乎明於天地之性不可惑以神恠知萬物之情不可㒺以非類後鄧后紀以淫祀無福罷諸祠官不合典禮者延平元年四月庚申詔罷祀官不在祀典者祠祀令見大祀表詹事有祠祀令皇后之官續志少府有祠祀令一人六百石典中諸小祠祀丞一人宦者祠王國有祀長漢郎中令光祿勲表郎中令秦官主郎内諸官掌宫殿掖門户如淳曰郎中令府在宫中武帝太初元年更名光祿勲應劭曰明爵功也郎中令高帝五年王恬啓始為之李周仁王臧石建廣李敢光祿勲徐自為始為之自太初以来凡二十八人韓説張安世楊惲周堪匡衡王章辛慶忌孔光師丹平當馬宫彭宣王惲元鳳元年并右將軍初元元年并前將軍蕭望之領尚書事續志光禄勲卿一人中二千石掌宿衞宫殿門户典三署郎五官左右更直執㦸宿衞門户考其德行而進退之漢官曰員吏四十四人丞比千石郊祀之事掌三獻胡廣曰勲猶閽也主殿宫門户之職如周宫伯掌王宫之士庶子杜林内奉宿衞外總三署周密敬謹選舉稱平酺劉昆寛張湛魯恭楊賜陳蕃杜喬桓典荀爽任隗張建炎末復以為郎中令陳平𫝊得宿衞中為郎中令漢儀注郎中令主郎中後儒林𫝊光祿勲王龔以外屬内卿注光祿治宫中􅀭雄箴經兆宫室畫為中外廊殿門闥限以禁界國有周衞民有籓籬各有攸保守以不岐徳人立朝議士充庭祿臣司光栢梁詩有總領從官之句三東方朔曰仲山甫為光祿晉灼注云光祿主大夫諫正之官漢光祿屬官諌大夫中郎三將郎中三將騎郎將羽林令監奉車都尉騎都尉謁者光禄郎表有丞續志丞一人比千石掾于永除王嘉為掾表屬官有大夫郎謁者皆秦官及期門羽林皆屬焉大夫掌議論有大中大夫陸賈石奮賈誼周仁吾丘夀王申公疏廣梁丘賀張敞王嘉劉歆平當董仲舒志大中大夫千石無員漢官曰二十人秩比二千石張湛馬援申屠剛梁統伏隆宋𢎞張純臧宫銚期楊秉中大夫無員張釋之相如晁錯直不疑董仲舒汲黯兒寛嚴助朱買臣中大夫令灌嬰功臣表靈常為中大夫志無諫大夫無員多至數十人大中大夫中大夫同武帝元狩五年初置諫大夫秩比八百石魏相王吉夏侯勝嚴助尹更始何武匡衡翼奉劉輔孫寳母將隆王褒蓋寛饒鄭昌皆為之俸劉更生以行修飭為之貢禹為諌大夫秩八百石錢月九千二百禀食大官郡蕭望之遷諫大夫是時選博士諫大夫通政事者補國守相望之雅意在本朝上疏曰悉出諌官以補郡吏所謂憂末忘本朝無爭臣則不知過國無達士則不聞善齊東郭牙為大諌臣楚有箴尹古者諌爭無常官周保氏掌諌王惡於是諌有專職各髙祖從諌如轉圜建豪英為諌爭時未有諌官官師以其職諌也曰文帝止輦受言鮑諌之名官自武帝始也鄭昌官以諌為名宣曰官以諌爭為職志諌議大夫六百石無員注胡廣曰光祿大夫本為中大夫武帝元狩五年置諌大夫為光祿大夫世祖中興以為諌議大夫漢官曰三十人王良包咸丁恭趙孝江革李尤何休劉陶崔寔諌大夫箴處有誦訓出有旅賁木鐸之求爰納遒人各司攸訊政以不紛禮有五諫諷為上古者諫官無定員而言路益廣後世諫官有常職而言路彌塞表太初元年更名中大夫為光祿大夫秩比二千石太中大夫秩比千石如故貢禹為光祿大夫秩二千石俸錢月萬二千祿弔祠諸侯王則已有其官未詳景帝中二年令光武帝以中大夫為光祿大夫與博士俱以儒雅之選異官通職周官所謂官聫者也谷永曰爭臣之末吾丘夀王蔡義張安世劉辟疆向歆于定國馮奉世周堪金敞孔光匡衡鄭寛中王商史丹蕭育師丹韋賢丙吉龔勝平當谷永夏侯勝文學光祿大夫志同無員漢官曰三人舉張湛楊秉賜杜喬周鄧彪志中散大夫六百石無員漢官曰三十人秩比二千石凡大夫議郎皆掌顧問應對無常事唯詔命所使胡廣曰光祿諫議大中中散大夫此四等於古皆為天子之下大夫視列國之上卿中散大夫蕭由牟長魯丕曹成宋志中散大夫平帝時置元始元年譙𤣥為之表郎掌守門户出充車騎有議郎中郎侍郎郎中皆無員多至千人戰國䇿秦昭王時已有郎中之名郎吕氏曰三署五官左右三郎中郎侍郎中也郎史記索隐三郎謂中郎外郎及散郎按恵紀詔曰中郎中滿六歳爵三級外郎滿六歳二級蘇林曰中郎省中郎也外郎散郎也是散郎即外郎不當分為二進文帝後六年四月損郎吏員孝武損郎員郎之退將實主之中郎将爰盎徙張釋之補謁者者汲黯願為中郎出入禁闥補過拾遺食貨志入財得補郎郎選衰矣七和帝元興元年正月戊午引三署郎召見禁中選除十五人補謁者長相注漢官儀三署五官左右也各置中郎将司之郎選其塗非一有以父兄任子弟為郎者如張安世爰盎是也有以富訾為郎者漢儀注謂訾五百萬得為常侍郎如張釋之司馬相如是也有以獻䇿尚書為郎者婁敬主父偃是也有以孝著為郎者馮唐是也董仲舒云吏二千石子弟選郎吏又以富訾者葢多出此二塗晉志郎位十五星在帝坐東北一曰依烏郎府也周之元士漢官之光祿中散諌議議郎三署郎中是其職也楊秉上疏云大徽積星名為郎位入奉宿衞出牧百姓審忠為郎十五年議郎中郎秩比六百石中郎東方朔陛㦸殿下國吾丘夀王卜式主父偃趙充傅介子陳湯劉向翼奉周堪侍郎比四百石辛慶忌鄭吉郎東方朔常侍郎中比三百石婁敬季布田仁樂馮唐為郎中舎長劉向嚴安徐辛慶忌甘延夀中郎有五官左右三將秩皆比二千石爰盎上幸上林郎署長布席衞綰景帝幸上林詔綰參乗辛司馬相如趙充國蘇武楊惲罷山郎金敞王章慶忌為中郎将蕭育咸為使匃奴中郎将志五官中郎將一人比二千石主五官郎房􅃫張純奮李忠耿國江革馬嚴魏應董鈞周章爰延堂谿典何敞楊彪黄琬公孫祿左中郎將比二千石主左署郎臧宫鍾興樓望張奮賈逵魯丕韋彪何敞楊秉皇甫嵩右中郎將比二千石主右署郎包咸周澤朱儁郎馬成王梁劉隆來歙鄭衆馬防度尚為中将張奐郭丹陳龜為使匃奴中郎将中郎侍郎郎中並無員傅毅陳蕃荀淑爽馬融張衡虞詡馮勤戴憑皆為中郎凡郎官皆主更直執㦸宿衛諸殿門出充車騎唯議郎不在直中蔡質漢儀三署郎見光祿勲執板拜見五官左右将執板不拜於三公諸卿無敬和帝紀永元七年四月辛亥𦍤日食令将大夫御史謁者博士議郎郎官㑹廷中各言封事詔有司詳選郎官寛博有謀才任典城者三十人既而悉