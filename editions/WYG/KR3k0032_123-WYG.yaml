量職在太倉大司農掌之志一人六百石主受郡國𫝊漕穀漢官曰員吏九十九人丞一人均輸令表水衡亦有均輸令丞黄霸為河東均輸長昭帝六年賢良願罷均輸官毋與天下争利志中興省王隆小學漢官篇曰調均報度輸漕委輸平凖令趙廣漢為之平凖書𢎞羊請置平凖于京師都受天下委輸平物賈使相依凖志一人六百石掌知物賈主練染作采色漢官曰員吏百九十人周質人丞一人紀靈帝熹平四年十月改平凖為中凖使宦者為令唐六典注和帝改為中凖以宦者為令丞都内令見錢幣田尹翁歸舉亷遷都内令延年坐盗都内錢藉田令周甸師通典漢文初置東漢及魏闕晉復置江左省宋元嘉又置本朝属太常導官令唐史作䆃表屬少府主擇米張湯治它囚導官度谷永請省導官用志一人六百石主舂御米及作乾糒漢官曰員吏百十二人丞一人導擇也擇鄧后詔減導官珍麗之物又詔稻粱米不得導相如云導一莖六穗於庖菲飲食烝白杵之利取小過鑿或舂或揄或簸或蹂釋之叟叟之浮浮粢食不昭其儉也周舂人舂穀為米􅐪人炊米為食其職事相成米彼疏斯粺詩人所刺九章有粟法斡官表初斡官屬少府中屬主爵後屬大司農如淳曰所謂幹鹽鐵也三輔皆有職官長丞志注郡國鹽官鐵官本屬司農中興皆屬郡縣鹽鐵置官多在西北而東南不多見太宰九兩藪以富得民廩犧令表左馮翊屬官有廩犧令丞尉師古曰廩主藏穀犧主養牲皆所以共祭祀放五鳳元年韓延夀案校蕭望之在馮翊時廩犧官錢散百餘萬谷永請減廩犧用度職扶風有掌畜令職齊儀云周牧人之志大司農注又有廩犧令六百石掌祭祀犧牲鴈騖之屬漢官曰丞一人三百石員吏四十人中興屬河南尹和紀永元十年九月庚戌復置廩犧官董鈞舉明經遷廩犧令禮儀志注郊儀先郊日未晡夕牲廩犧令跪曰請省牲舉手曰腯大祝令繞牲舉手曰充周有牧人共之牛人養之充人繫之展牲告牷若今夕牲碩腯則贊息奉牲以告民力普存孔子為司職吏畜蕃掖庭有牛官令郡國諸倉農監中興省都水六十五官丞皆屬焉食貨志大農置農官志滎陽敖倉官中興屬河南尹騪粟都尉表武帝軍官不常置桑𢎞羊趙過楊敞為之趙過奏平都令光為丞治粟都尉韓信食貨志元封元年桑𢎞羊為治粟都尉領大農續志注魏志曰曹公置典農中郎將秩二千石都尉六百石或四百石校尉比一千石司金都尉附魏志韓暨為監治謁者舊時治作馬排為排以吹炭每一熟石用馬百匹更作人排又費功力暨乃因長流為水排計利三倍於前在職七年器用充實就加司金都尉班亞九卿嵇喜有箴市長表左馮翊有長安四市長丞京兆有長安市令丞司馬遷自序毋懌為漢市長見西京賦廣開九市云云周制大胥今也惟尉詳京輔類周司市下大夫二人士二十八人統於司徒周市一夫志雒陽市長中興屬河南尹注漢官曰市長一人秩四百石丞一人二百石明法補員吏三十六人又有檝櫂丞三百石第五倫為督鑄錢掾領長安市平銓衡正斗斛市無阿枉百姓悦服市洛陽市長沐茂上疏請李雲貶秩禮儀志注舊典長執鴈建安八年始令執雉馬文選注陸機洛陽記曰洛陽凡三市金市市洛陽縣市晋成公綏市長箴大司農史蕭望之𫝊李宫斗食屬薛宣漢少府表少府秦官章邯為之漢周玉府内府猶秦少府也掌山海池澤之税以給共養應劭曰名曰禁錢以給私養自别為藏少者小也師古曰大司農供軍國之用少府以養天子髙帝五年陽城延始為之至宗伯鳯凡四十一人蒼蔡義薛宣陳咸蕭望之梁丘賀后師丹許商召信臣農孝武時咸陽僅言山海宜屬少府陛下不私以屬大佐賦毋將隆曰共養勞賜壹出少府者竟寧中召信臣為少府奏請上林離逺宫館希幸御勿復繕治共張奏省樂府黄門倡優諸戯及宫館兵弩什器減過泰半大官不時非法食物悉奏罷省費數千萬元帝時少府錢十八萬萬初元元年四月詔江海陂湖園池屬少府者以假貧民給列侯至飲酎少府省金正月朔朝㑹少府璧志卿一人中二千石掌中服御諸物衣服寳貨珍膳之屬漢官曰員吏三十四人小故稱少府王者以租税為公用山澤陂池之税以供王之私用古皆作小府漢官儀曰田租芻藁以給經用山澤魚鹽市税少府以給私用杜林楊賜丁鴻丁恭孔融承秦凡山澤陂池之税名曰禁錢屬少府世祖改屬司農周禮注漢法侯國有司農少府錢榖入榖入司農錢少府􅀭雄箴實實少府奉養是供嗜不可不察欲不可不圖未嘗失之於約常失於奢府臣司共栢梁詩乗輿御物主治之減文帝逸游之樂絶竒麗之賂塞後六年四月弛山澤服御明王奉養有節莽改曰共工漢少府屬官符節令符璽郎太官令丞尚食五尚大官獻丞湯官令丞樂府令若盧令左弋令織室令黄門令侍郎給事中鉤盾令尚方令御府令掖庭令守宫令上林令表有六丞志丞一人比千石世祖省五丞譙𤣥為少府主簿朱暉𫝊表屬官有尚書符節大醫大官湯官導官樂府若盧考工室左弋居室甘泉居室左右司空東織西織東園匠十二官令丞此凡十六官言十二誤也左右司空分為二凡十七官又胞人都水均官三長丞胞與庖同又上林十池監又中書謁者黄門鉤盾尚方御府永巷内者宦者七官令丞此八官言七非諸僕射署長中黄門皆屬焉尚書見後符節令有丞志一人六百石為符節臺率主符節事凡遣使掌授節尚符璽郎中四人表無舊二人在中主璽及虎符竹符之半者應劭漢官儀符節令千石位次御史中丞領尚符璽四人符節令史二百石掌書表無髙后紀八年太尉勃欲入北軍襄平侯紀通尚符節廼令持節矯納勃北軍霍光𫝊召尚符璽郎郎不肯授光光増秩二等注孟康曰漢初三璽天子之璽自佩行璽信璽在符節臺奏昌邑王自之符璽取節十六嚴延年𫝊注應劭曰竹使符藏在符節臺欲有所拜召治書御史符節令發符下太尉胡廣曰治書侍御史與符節郎共平廷尉奏事眭孟蔡衍為符節令來歴𫝊符節令張敬詣鴻都門證太子無過輿服志注符節令掌幡信金虎故位從大夫車有韜沂冠有兩梁崔子玉有箴符臣司節周禮掌節典瑞注若今符璽郎秦趙髙兼行符璽令璽趙堯為符御史太醫令見前太官令師古曰主膳食周膳夫表太官七丞東方朔傳伏日賜從官肉大官丞不来志令一人六百石殤紀注周官也秩千石掌御飲食注兼輿服志注漢官曰員吏六十九人衛士三十八荀綽晉百官表注曰漢制大官令秩千石丞四人左甘湯官果秩四百石不與志同漢官儀丞四人郡孝㢘年五十光祿上名乃召拜皆秩四百石三嵗為令又曰建元中尚書陳忠以為令史質堪上言大官宜著兩梁尚書孟希奏太官職在鼎俎不列陛位不宜許臣伏惟太官令典掌王饔綂六清之飲列八珍之饌正百品之羞納四方之貢明詔謹口實之御增崇其選侍御史主捕案太醫令奉方藥符節令掌幡信金虎故位從大夫車有韜沂冠有兩梁博士秩卑以其𫝊先王之訓故尊而異之令服大夫之冕由此言之兩梁冠非必列於陛位也如堪言可行光武時陳正為大官令葛龔為大官丞孫程𫝊長樂大官丞王國紀景帝後二年四月詔不受獻減太官宣帝本始四年正月詔歳不登令太官損膳省宰元帝初元元年八月令損膳竟寧中少府召信臣奏罷不時之物初元五年四月令大官毋日殺所具減半谷永請減用度光武建武十三年正月戊子詔曰徃年已𠡠郡國異味不得有所獻御今猶未止其令太官勿復受和帝時舊南海獻龍眼荔支十里一置五里一􅀱臨武長唐羌上書陳狀帝下詔勅太官勿復受羌諫曰上不以滋味為德下不以貢膳為功殤帝延平元年六月己未詔減大官導官尚方諸服御珍膳靡麗難成之物鄧后詔鄧后紀自非供陵廟稻粱米不得導擇朝夕一肉飯而已舊太官湯官經用歳且二萬萬太后勅止省珍費自是裁數千萬安帝永初五年二月丁卯省減太官口食順帝永建四年五月壬辰詔太官減膳珍玩不御封還桂陽大珠桓帝永夀二年十一月置太官右監丞官漢官儀秩比六百石延熹元年使大官令得補二千石列𫝊霍去病從軍上為遣大官齎數十乗昌邑王詔大官趣其亡闗食監貢禹為諌大夫廩食大官鮑宣為諌大夫羙食大官李尋待詔黄門食大官衣御府張禹為太傅朝夕進食成帝遣大官致餐趙孝大官送供具恵紀宦官尚食比郎中應劭注尚主也舊有五尚尚冠尚帳尚衣尚席尚食如淳曰主天子物曰尚主文書曰尚書又有尚符璽郎漢儀注省中有五尚而内官有諸尚馮唐傳文帝曰居代時尚食監髙袪言趙將李齊之賢條侯顧謂尚席取箸注顧氏按輿服雜事曰六尚尚席掌武帳帷㡢宣帝舎長安尚冠里郊祀志長安厨官雲東觀記永平五年秋御臺召尚席取卦具􅀭雄大官令箴時惟膳夫實司王饔祁祁庶羞口實是共栢梁有大官令詩任六典周庖人外饔之禹菲飲食殽不貴異物海惟辟玉食之厚味腊毒九既醉以酒爾既将窮之錯極陸毛味重沸和兼芍藥兼奉養有節賜文帝食不二味膳明帝食無珍朱暉食江革給醪大官獻丞陳湯𫝊西至長安求官得大官獻食丞張勃舉湯為茂才注蘇林曰主貢獻物周官膳夫掌膳祭祀之致福及以摯見者帝髙帝減獻賦官文帝令郡國無来獻景不受獻減大光武不受異味平紀元始元年六月置少府海丞果丞各一人主海税掌果實志大官左丞主飲食甘丞主膳具果丞主果各一人荀綽云甘丞掌諸甘肥果丞别在外諸果菜茹官六典注桓帝時置四丞又有左右丞晋大令有果官湯官令丞師古曰主餅餌周􅐪人志世祖省湯官令置丞鄧后紀見上湯官丞一人主酒禹惡旨酒碎沬土之誥賔筵之刺掊仲榼堯鍾五齊九醖導官令見前樂府令表樂府三丞樂志武帝定郊祀之禮立樂府注師古曰始置然恵帝二年已有樂府令夏侯寛紀宣帝本始四年正月詔樂府減樂人就農業元帝初元元年六月減樂府貟竟寧中省樂府黄門倡優諸戯哀帝綏和二年六月省樂府王吉言宜去角觝減樂府張放𫝊樂府音監景武注孟康曰監主樂人樂志内有掖庭材人外有上林樂府皆以鄭聲施於朝廷文帝抑止絲竹晏衍之樂憎聞鄭䡓幼眇之聲光武耳不聽鄭衞之音工師誦詩御瞽幾聲協律都尉李延年若盧令表注服䖍曰若盧詔獄也鄧展曰舊洛陽兩獄一名若盧如淳曰官名也藏兵器品令曰若盧郎中二十人主弩射漢儀注有若盧獄令主治庫兵將相大臣師古曰如説是左將軍請召王商詣若盧詔獄孟康曰黄門北寺也王吉補若盧右丞龎參坐法輸作若盧和紀永元九年十二月己丑復置若盧獄官考工室令表武帝太初元年更名為考工臣瓚曰冬官為考工主作器械曾劉輔傳共工獄蘇林曰考工也工用高之規矩田蚡請考工地益宅左弋令師古曰左弋地名秦紀佐弋竭表太初元年更左弋為佽飛掌弋射有九丞兩尉漢儀注佽飛具矰繳射鳬雁給祭祀神爵元年三月發佽飛射士詣金城初元二年三月罷少府佽飛外地士荆有茲非刺蛟取古勇力人以名官周射鳥氏下一人夏官之屬居室令表武帝太初元年更名居室為保宫甘泉居室為昆臺世祖省昆臺五丞灌夫繋居室至甘泉居室衞青嘗從人李陵母繫保宫姓儒林傳周慶丁待詔保宫織室令表河平元年省東織更名西織為織室三輔黄圖織室在未央宫又有東西織室應劭曰主織作文繡郊廟之服五行志云奉宗廟衣服東織室令史張赦地節四年然貢禹言三工官費五千萬東西織室亦谷永請止織室造作以助大農志世祖省織室令置丞周典婦功典絲典枲休誦服之無斁之章知周所以興誦其􅅙織之章知周所以衷中書謁者見後黄門令史游勤心