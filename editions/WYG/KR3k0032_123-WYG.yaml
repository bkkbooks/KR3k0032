公新延廏春秋譏之宗却走馬元帝穀食馬詳見監牧未央廏令上官桀為之志一人六百石主乗輿及廏中諸馬員吏七十人令延光中鄭安世為長樂未央廏與太僕来歴諫長樂廏丞一人員吏十五人舊有六廏皆六百石令中興省約但置一廏後置左駿令廏别主乗輿御馬後或并省考工令表少府有考工室令丞後屬太僕志令一人六百石主作兵器弓弩刀鎧之屬成則傳執金吾入武庫及主織綬諸雜工員吏百九人左右丞各一人見少府車府令秦趙高為之志一人六百石主乗輿諸車員吏二十四人丞一人夏車正周巾車車禮儀志注皇后􅅙車府令設鹵簿呉良𫝊府令徐匡鉤隂就車成帝升車不内顧疾言親指節以徳為車塵不出軌鸞以歩牧師菀令志主養馬漢官儀三十六所分在河西六郡界中隴西天水安定上郡北地西河中興皆省唯漢陽有流馬菀以羽林郎監領周牧師下士四人掌牧地詳見監牧中廏令功臣表祕彭祖疏黄圖中廏皇后車馬所在吕强上中廏聚太僕之馬廏司御夏侯嬰為沛廏司御廏將沛公拜張良為廏將陽王陵以廏將定東郡南漢廷尉大理表廷尉秦官掌刑辟應劭曰聽獄必質諸朝廷與衆共之兵獄同制故稱廷尉師古曰廷平也治獄貴平故以為號儀端門東曰左執法廷尉之象蘇林曰漢注獄二十六所景帝中六年更名大理武帝建元四年復為廷尉哀帝元夀二年復為大理表廷尉高帝五年義渠始為之公凡五十八人吳張釋之于定國彭宣朱愽何武孔光終於大理鍾元吏分寸尺丈引廷尉掌之兒寛𫝊廷尉府盡用文法漢之廷尉與丞相不相干孝文問一歳决獄幾何丞相平以為責在廷尉文子曰臯陶為大理周司㓂之職晋李離為大理理秦廷尉斯秋說苑楚廷理理新序石奢為大吕氏春齊𢎞章為大王莽曰作士志卿一人中二千石掌平獄奏當所應凡郡國讞疑罪皆處當以報漢官曰員吏百四十人吳陳寵郭躬郭氏廷尉七人雄三世廷尉楊賜以世非法家固辭臯吕于張揚䧺箴周輕其制秦繁其辜唐虞象刑天民是全紂作炮烙墜民于淵殷以刑顛秦以酷敗獄臣司理敢吿執謁崔駰箴邈矣臯陶翊唐作士如石之平如淵之清三槐九棘以賢以聽理臣司律孝文除誹謗去肉刑幾致刑措一景帝後元年正月令治獄先寛孝宣齋居决事成不變君子盡心明謹不留哀矜勿喜之仁一夫向隅之念三面執網制禮止刑禮志叔孫通所撰禮儀與律令同錄藏於理官師古曰即法官也藝文志法家出於理官漢廷尉屬官廷平表廷尉有正左右監秩皆千石王制成獄辭史以獄成告于正正聽之以獄成告于大司㓂注正於周鄉師之屬今漢有正平承秦所置武帝時何比干為正張湯𫝊上意所便引正監掾史賢者議平宣帝聞黄霸持法平召為廷尉正數決疑獄廷中稱史記表霸遷為廷尉監廷尉監丙吉者左監陳躬廷朱博傳正監共撰前世決事吏議難知數十事問尉監察也刑法志云天下獄二千餘所刑王朗奏西京蔽罪斷者二十有六獄志正左監各一人注世祖省右而猶曰左永初中陳忠遷廷尉正平郭躬陳琳鍾繇鍾皓不就建武永斷獄少於成哀之間什八廷平表宣帝地節三年初置左右平紀云四人秩皆六百石正監平謂之廷尉三官刑法志宣帝即位廷史路温舒上疏秦有十失其一尚存治獄之吏是也上深愍焉詔曰吏用法巧文寖深决獄不當使有罪興邪不辜蒙戮朕甚傷之今遣廷史與郡鞠獄任輕祿薄其置廷平秩六百石員四人務平之以稱朕意紀地節三年十二月置於是選于定國為廷尉求明察寛恕黄霸等為廷平季秋後請讞上幸宣室齋居决事獄刑號平鄭昌上疏言明主躬垂明聽雖不置廷平獄將自正若開後嗣不若删定律令今不正其本而置廷平以理其末政衰聽怠則廷平將招權而為亂首矣馬宫遷廷尉平時三輔决錄何比干漢武為右平志廷尉左平一人六百石掌平决詔獄前書有左右監平世祖省右而猶曰左輿服志法冠執法者服之侍御史廷尉正監平也四持法如權衡輕重不偏倚平停疑法晉志權北星曰平罪之官星讃曰平星執法正于紀綱廷史漢官廷史文學十六人二百石路温舒守廷史于定國王禁補廷尉史廷廷尉湯請博士弟子治尚書春秋補廷尉史本傳云史謁居周䊸為廷尉史杜周為廷史奏讞掾廷尉湯以兒寛為掾又以為奏讞掾以古法義决疑獄奏曺掾路温舒書佐薛宣志孝武以下置中都官獄二十六所各令長名世祖中興皆省唯廷尉及雒陽有詔獄張説獄箴吏茍吹毛人安措足教或大或小時重時輕無以快志期乎得情明刑弼降典折民明啓刑書咸庶中正君子明慎用刑漢大鴻臚典客表典客秦官周大行人掌諸侯歸義蠻夷景帝中六年更名大行令史記無令字武帝太初元年更名大鴻臚應劭曰郊廟行禮讃九賔鴻聲臚𫝊之韋昭云以大禮陳序賔客於景紀中元二年令諸侯王列侯大鴻臚奏諡誄䇿史景追舉最後官名非表設也表典客髙五年薛歐始為之為劉掲馮敬韓信連敖注典客大行令武建武元年光始為之李王恢張騫息大鴻臚太初元年壺充國始為之王田千秋廣明韋賢蕭望之育馮野王平當嘉終於左咸前後凡三十四人律志權衡規矩凖䋲鴻臚掌之平均曲直齊一逺近莽改大鴻臚曰典樂志卿一人中二千石周禮象胥干寳注曰今鴻臚掌同前表郊廟行禮賛導諸王入朝典其禮儀及郡國上計皇子拜王贊授印綬及拜諸侯四方夷狄封者臺下鴻臚召拜之漢官曰員吏五十五人杜包咸韋彪陳蕃紀竇固喬魏應来歴桓焉􅀭䧺箴人有才能寮有級差遷能授官各有攸宜鴻臣司爵敢告在隣栢梁詩郡國吏功差次之賦中庸九經朝聘以時厚徃而薄来以懐諸侯東京九賔重臚人列史舜紀龍主賔客逺人至漢鴻臚屬官治禮丞治禮郎譯官令主客表有丞劉徳為之志丞一人比千石表屬官