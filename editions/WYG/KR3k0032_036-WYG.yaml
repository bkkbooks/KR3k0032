body:
  text: 玉海卷三十六宋王應麟撰藝文易下擬易附魏王弼注易大衍論易畧例魏志鍾㑹論易無互體山陽王弼好論儒道辭才逸辯注易及老子荀融難弼大衍義雖王濟云見弼易注所誤者多孫盛曰有可觀恐泥大道隋志周易十卷魏尚書郎王弼注六十四卦六卷晉太常韓康伯注繫辭以下三卷弼又撰易畧例一卷梁有周易難王輔嗣義一卷晉顧夷等撰宋書顧悦之難王弼易義四十餘條關康之申王難顧盡神論一卷魏鍾㑹撰梁有周易無互體論三卷亡唐志王弼注七卷又大衍論三卷國史志王弼易論一卷大類畧例而不及中興書目弼有易辯一卷或言晉得之王羲之承詔録藏秘府繫辭注王弼曰演天地之數所頼者五十也正義曰韓氏親受業於王弼唐邢璹注畧例叙曰大則揔一部之指歸小則明六爻之得失承乘逆順之理應變情偽之端用有行藏辭有險易明彖明爻通變明象辨位上卦畧凡十一卦下二篇以辨諸家之惑陸澄曰王弼注易𤣥學所宗今若𢎞儒鄭注不可廢自商瞿之後雖有異家之學同以象數為宗數年後乃有王弼之説輔嗣之易出於馬鄭馬鄭又出於費氏古文易以康成注本無乾傳泰傳字輔嗣加之巻首之卦題曰傳離為六篇伏曼容曰何晏疑易中九事孔頴逹曰輔嗣之意象本釋經宜相附近分爻之象辭各附當爻則費氏時猶若今乾卦彖象繫卦之末歟古文始變於費氏大亂於王弼魏易傳魏志正始六年十二月辛亥詔司徒王朗所作易傳令學者得以課試子肅撰定闞駰注易傳釋文序録王肅注十卷釋文引王肅本西都有丁孟京田東郡有荀劉馬鄭吳虞翻易注隋志虞翻注九卷釋文序録十卷陸績注十卷序錄十三卷梁有周易日月變例六卷虞翻陸績撰吳志虞翻注易奏曰夢道士布易六爻撓其三以飲臣言易道在天三爻足矣晉周易統畧隋志鄒湛統畧五卷楊乂卦序論一卷唐志云統畧論三卷御覽引楊乂易卦序論云儉而止山也儉而動泉也晉周易訓注儒林𫝊劉兆字延世撰周易訓注以正動二體互通其文文苑𫝊李充注尚書及周易㫖六篇隋志晉李顒周易卦象數㫖六卷晉易象論劉惔𫝊時孫盛作易象妙於見形論論曰聖人知觀器不足以逹變故表圓應於蓍龜圓應不可為典要故寄妙迹於六爻簡文帝使殷浩難之不能屈惔與抗答辭甚簡至盛理遂屈嵇康作言不盡意論殷融作象不盡意論何襄城為六象之論曰實象曰假象曰偏象曰圓象曰義象曰用象蕭氏又難之不取偏象圓象而立四象之論晉干寳易傳隋志干寳易注十卷唐志同周易爻義一卷書目寳之易學以卦爻配月或配日時傅諸人事以前世已然之迹證之訓義頗有據晉張璠集解經典序録張璠集解十二卷東晉秘書郎㕘著作集二十二家解序云依向秀本鍾會為易無互體論向秀庾運為易義應貞為明易論荀煇張煇王宏阮咸阮渾為易義楊乂為易卦序論王濟衛瓘為易義欒肇為易論鄒湛為易統畧杜育楊瓉張軌為易義宣舒為通知来藏徃論邢融裴藻許適楊藻並為易義七錄云集二十八家七志云十卷釋文引張璠本晉周易論隋志晉阮渾二卷晉宋岱一卷齊周顒十卷梁有三卷范氏四卷晉欒肇周易象論三卷唐志一卷楊乂卦序論一卷唐志鍾會周易論四巻應吉甫明易論一卷阮長成仲容難答論二卷宋處宗通易論一卷宣聘通易象論一卷范仲淹上李泰伯易論十三篇禮論七篇明堂定制圖序一篇平土書三篇共二十四篇為十巻晉周易畧譜舊唐志一卷袁宏撰周易譜一卷沈熊撰周易四家集解隋志馬鄭二王四家集解十卷楊氏集二王注五卷梁朱异集注一百巻又三十卷一南史孔子袪續朱异集注周易百卷朱震曰鄭氏傳馬融之學多論互體陸績之學始論動爻王弼破互體荀爽九家集注序錄荀爽九家集注十卷不知何人所集稱荀爽者以為主故也其序有荀爽京房馬融鄭𤣥宋𠂻虞翻陸績姚信翟子𤣥為易義注内又有張氏朱氏並不詳何人釋文引九家家説卦釋文引荀爽九集解隋志荀爽九家注十卷唐志荀氏九家集解十卷荀爽曰乾起坎而終於離坤起離而終於坎離坎者乾坤之象而隂陽之府謝萬韓伯袁恱之桓𤣥卞伯玉荀柔之徐爰顧懽明僧紹劉瓛以下十人並注繫辭為易音者三人王肅李軌徐邈蜀才人多不知顔之推云范長生也後魏關子明易傳書目關子明易傳一卷唐趙蕤注魏孝文使并州刺史王虬與子明著成筮論數十篇蕤云亡篇過半今無能詮次但随文解義庻學者觸類而長阮逸詮次刋正洞極𤣥經傳五卷關子明以生資育為傳以釋其藴為經論十一篇又為圖以序其象文中子録子明事太和末穆公與談易言於孝文帝帝曰且與卿就成筮論子明曰乾坤之䇿隂陽之數推而行之不過三百六十六演而伸之不過三百八十四天之道也象生有定數吉凶有前期變而能通故治亂有可易之理王氏易道宗於子明晁氏志關朗字子明太和末王虬言於孝文召見著成筮論數十篇唐趙㽔云恨書亡半隨文銓解才十一篇李邯鄲始著之目云王通贊易盖宗此也子明易傳卜百年義第一次以統言易義大衍乾坤䇿盈虚闔闢理性時變動静神義終於雜義第十一梁周易講䟽見後梁武帝撰周易講疏及六十四卦二繫文言序卦等義元帝周易講疏十卷周易義例隋文中子讃易北史李􅉗字寶鼎撰定孝經論語毛詩三禮義疏及三傳異同周易義例合三十餘卷文中子中説王通字仲淹讃易七十篇讃易道以申先師之㫖唐七十六家易藝文志經録一曰易類七十六家八十八部六百六十五卷始於連山次以歸藏若周易則有卜商之傳二卷孟喜京房費直馬融荀爽之章句四十四卷鄭𤣥劉表董遇宋忠王肅王弼虞翻陸績姚信荀煇蜀才王廙干寶黄頴崔浩崔覲何𦙍盧氏傅氏王又𤣥王凱冲韓康伯謝萬桓𤣥荀諺荀柔之宋褰任希古之注荀氏九家馬鄭二王張璠之集解著義疏者有宋明帝梁武帝張該蕭偉蕭子政張譏何妥褚仲都梁蕃劉瓛孔頴逹陸徳明隂𢎞道著論者有王弼𤣥宗之大衍張璠鍾㑹范氏應吉甫鄒湛阮長成阮仲容宋處宗宣聘欒肇袁宏楊乂爻義則干寶音譜則沈熊新注本義則薛仁貴發揮則王勃終於𤣥宗大衍論不著録十一家三百二十九卷始於李鼎祚集注有東鄉助物象釋疑一行論大衍𤣥圖義決崔良佐忘象元載集注李吉甫注一行易衛元嵩元包髙定外傳終於裴通之書盧行超之義陸希聲之傳隋志六十九部五百五十一卷始於歸藏崇文目一十八部一百七十八卷始於歸藏終於言象外傳中興書目一百一十二家七百六十卷續目二十七家三十四部三百五卷釋文序録後漢費氏興而髙氏遂微永嘉之亂施氏梁丘之易亡孟京費之易人無傳者惟鄭康成王輔嗣所注行於世而王氏為世所重繫辭已下相承以韓康伯注續之唐周易正義文句義疏志正義十六卷舊志十四卷書目十四卷國子祭酒孔頴逹顔師古司馬才章王恭太學博士馬嘉運助教趙乾叶王談于志寧等奉詔撰四門博士蘇徳融趙𢎞智覆審宋朝端拱元年十月祭酒孔維等校正正義有八論易之三名三代易名重卦之人誰卦辭爻辭作翼分上下二篇誰夫子十傳易之人加經字序云傳易者丁孟京田荀劉馬鄭大抵更相祖述非有絶倫惟魏世王輔嗣之注獨冠古今江左諸儒並傳其學河北學者罕能及之江南義疏十有餘家皆辭尚虚𤣥義多浮誕隋志周易義疏十九卷舊唐志二十卷宋明帝集羣臣講於清暑殿詔伏曼容執經又於華林園含芳堂講帝梁又有國子講易義六巻宋明集羣臣講易義疏二十卷齊永明國學講周易講疏二十六卷又沈林周易義三卷周易講疏三十五卷大義二十一卷繫辭義疏一卷梁武帝撰唐志大義二十卷周釋文引梁武帝云文言是文王所制舊唐志易大義二十卷又大義疑問二十卷梁武帝撰講疏十六卷梁褚仲都撰義疏十四卷繫辭義疏三卷蕭子政撰義疏十六卷陳周𢎞正撰繫辭義疏二卷乾坤義一卷劉瓛撰講疏三十卷陳張譏撰南史張譏周易義三十卷又十三卷何妥撰北史云三卷唐志宋明帝注義疏二十卷張該等羣臣講易疏二十卷舊志宋羣臣講易疏二十卷張該等注梁武帝大義疑問二十卷蕭偉發義㡬義各一卷梁蕃文句義疏二十卷又開題論序疏十卷釋序義三卷陸徳明周易文句義疏二十四卷文外大義二卷隋志止云大義隂𢎞道周易新傳疏十卷薛仁貴新注本義十四卷盧行超易義五卷國史志冀震周易義畧十卷亦曰疏何氏講疏十三卷崇文目周易正義補闕七卷中興目邢璹補闕正義畧例䟽二卷晁説之曰易雜荘老而專明人事則自王弼始易家始失其所傳梁丘施孟三家於是亡於晉而孟京有書無師矣江左祖尚𤣥虚弼學滋盛然晉專立鄭學孫盛詆弼之傅㑹浮麗宋元嘉王鄭兩立顔延之為祭酒而黜鄭置王齊之王學大盛河北專祖鄭隋士浮麗慕弼之學唐因之古法始泯唐周易大衍論志𤣥宗周易大衍論三卷又一行易論卷亡又大衍𤣥圖一卷義决一卷大衍論二十卷李吉甫注一行易亡舊史李吉甫討論易象異義附於一行集注之下王弼大衍論三卷舊史一行撰大衍論三卷劉禹錫辨易九六論引一行大衍論一行論三微而一象中興目一行易傳十二卷元闕者四卷一行作厯專用大衍之䇿議曰蓍數之變九六各一乾坤之象七八各三六子之象爻數通乎六十䇿數行者二百四十大衍為天地之樞如環之無端盖律厯之大紀也蓍以七備卦以八周郭雍曰一行之學取三多三少之象以晝竒耦大衍之數五十其用四十有九京房謂五十者十日十二辰二十八宿一不用者天之生氣馬融云北辰居位不動荀爽曰初九潜龍勿用故用四十九姚信董遇云天地數五十有五其六以象六畫鄭𤣥云五行減五大衍又減一故減之用四十九王弼曰其一不用以其虚不用而用以之通非數而數以之成斯易之太極子夏曰一不用者太極也孔頴逹曰虚一以象虚無之氣乾鑿度曰日十干者五音也辰十二者六律也星二十八者七宿也凡五十正義曰天數二十五總合五竒之數地數三十總合五偶之數乾之䇿二百一十有六者以乾老陽一爻有三十六䇿六爻凡有二百一十六䇿也乾之少陽一爻有二十八䇿六爻則有一百六十八䇿此經據老陽之䇿也坤之䇿百四十有四者坤之老隂一爻有二十四䇿六爻故一百四十四䇿也若坤之少隂一爻有三十二六爻則有一百九十二此經據坤之老隂也韓氏注曰乾一爻三十六䇿取其過揲四分而九也坤一爻二十四䇿取其過揲四分而六也關子明大衍義曰夫數兆於一生於二成於三此天地人所以立也衍於五成於六偶於十此五行六爻十日所以錯綜也天一數之兆也雖明其兆未可以用也地二數之生也有生則滋乃可以推之也天三數之極也極乎終則反乎始兼兩之義也五行水生乎一成乎六云云天一必待地六而成之地二必待天七而成之其體雖五而成必六六者非他天地生成之謂也天數五地數五五者非他三天兩地之謂也地二天三合而為五其一不用者六來則一去也既成則無生也有生於無終必有始既有則無去矣既終則始去矣故大衍五十其用四十有九入有去無之謂也物不兩大必曰虚盈日徃月來晝極則夜進盈於此則虚於彼盈於小必虚其大此用所以不窮也程子曰數始於一備於五小衍之而成十大衍之而為五十五十數之成也成則不動故損一以為用朱震曰一者體也太極不動之數四十有九者用也兩儀四象分太極之數總之則一散之則四十九非四十有九之外復有一而其一不用也四十有九者七也故爻用六蓍用七卦用八𤣥用九十即五也十盈數不可衍也朱文公曰大衍之數五十盖以河圖中宫天五乘地十而得之至用以筮則又止用四十有九乾之䇿二百一十有六坤之䇿百四十有四凡三百有六十當期之日二篇之䇿萬有一千五百二十當萬物之數也朱文公曰䇿數生於四象二篇謂上下經凡陽爻百九十二得六千九百一十二䇿隂爻百九十二得四千六百八䇿合之得此數唐仲友曰大衍通於範乎五行隱而皇極虚斯大衍之數用矣五事而次皆曰用初一曰五行不言用大衍之義著矣李泰伯曰揲蓍之法用四十九取其整數增一損一則不可揲陳高曰大衍自虚其一劉牧曰天一居尊而不動胡瑗曰隂不可過於陽地數三十之中去其六䇿歐陽子曰大衍占法也數出於自然而不測四十有九是也用通於變而無窮七八九六是也邵子曰大衍聖人之倚數也五十蓍數六十卦數五者蓍之小衍故五十為大衍八者卦之小成則六十四為大成蓍徳圓以况天數故七七四十九五十者存一言之卦徳方以况地數故八八六十四六十者去四言之十天數二十五合之為五十地數三合之為六十蓍用數卦體數用以體為基故存一體以用為本故去四圓者本一方者本四大衍之數其筭法之原乎郭雍曰此用數揲蓍之法龔夬曰五十總四十九之成數又合而為一此蓍之體四十九自分而為二言此蓍之用楊廷秀曰虚其一者復歸於一也所謂易有太極程迥曰天地之數極於十各五位有合故衍之為五十五十總數其一即㑹五十之全體劉敞曰衍天之參則為三十衍地之兩則為二十一者乾坤所不用乾積三以為九故老陽九坤積二以為六故老隂六少陽七者益一於老隂少隂八者益一於老陽劉氏曰動静一源顯微無間知四十九為一之用即知一為四十九之體或以干支辰宿八卦隂陽求合五十之數恐非分而為二以象兩掛一以象三揲之以四以象四時歸竒於扐以象閏五嵗再閏故再扐而後掛是故四營而成易十有八變而成卦唐集注周易志李鼎祚十七卷元載一百卷書目集觧十卷序亦云十卷唐志誤唐著作郎李鼎祚集子夏孟喜京房馬融荀爽鄭康成劉表何晏宋衷虞翻陸績干寶王肅王輔嗣姚信王廙張璠向秀王凱冲侯果蜀才翟𤣥韓康伯劉瓛何妥崔憬沈麟士盧氏崔覲孔頴逹等凡三十餘家附以九家易乾鑿度凡十七篇其所取荀虞之説為多取序卦冠之卦首案崇文總目云大抵以卦互體緣爻索變盖本易家師承之舊云七篇逸晁氏志十卷其序云自卜商之後傳註百家惟王鄭相沿頗行扵代鄭多􅄁天象王全釋人事易道豈偏滯於天人哉天象難尋人事易習折􅀭黄􅀢學徒多從之今集諸家刋輔嗣之野文補康成之逸象以貽同好盖宗鄭學者也李燾云鼎祚自序止云十卷無亡失經畧例仍舊經本皆避唐諱唐易傳志陸希聲周易傳二卷書目六卷案後説云著易傳十篇傳上經為第一篇下經為第二篇又有演文伸繫等八篇又撰易圖一卷指説一卷釋變㣲㫖各一卷通為十卷又文證一卷非十編之目今惟存上下經傳分為六卷㣲㫖分為三卷朱震曰陸氏削去爻象自謂彌縫其闕諧音以發其辭體正如子雲作太𤣥俾學者為進易之梯階唐周易發揮志王勃五卷王勃𫝊嘗夢有告者曰易有太極子勉思之寤而作易發揮數篇至晉卦會病止文中子世家文中子贊易七十篇列為十卷唐周易元包傳志衛元嵩元包十卷後周人唐蘇源明傳李江注書目同李江序文質更變篇題各異夏曰連山殷曰歸藏周曰周易而唐謂之元包其實一也包者藏也言善惡是非吉凶得失皆藏其書也李江謂六五經四八易雖太玄莫之與京崇文目元包十卷太隂太陽少隂少陽仲隂仲陽孟隂孟陽運蓍説源一本無説源第十卷晁氏志坤為首因八卦世變為六十四卦之次又著運蓍説源二篇統言卦體不列爻位自云周易元包一也元包以坤為首乾後之義祖歸藏宋乾道中張行成以蘇李徒言其理未逹其數著元包數總義二卷唐易圖易外傳高定𫝊定高郢子通王氏易為圖合八出上圓下方合則重轉則演七轉而六十四卦六甲八節備焉志高定周易外傳二十二卷隋志梁有周易乾坤三象周易新圖各一卷周易譜一卷唐志云沈熊譜一卷雜音三巻袁宏譜畧三卷薛景和普𤣥圗八巻唐易書志裴通易書一百五十卷通士淹子文宗訪以易義令進所撰書通自祭酒改詹事因中謝上知通有易學因訪以精義仍命進所習經本著易𤣥觧并總論二十巻易禦冦十二卷易洗心二十卷國史志裴通周易𤣥解三巻韋顗𫝊著易藴解推演終始有深誼唐周易新義㑹要大和元年六月直講徐鄖上三卷志薛仁貴新注本義四卷國史志李翺易詮三卷唐周易物象釋疑志周易物象釋疑一卷書目一卷唐守江陵尹東鄉助撰其説以象之所生生於義也有斯義然後明之以物如以龍叙乾以馬明坤之類采注疏未釋者摽出唐周易舉正書目三卷崇文目同唐蘇州司户郭京撰其序言得王輔嗣韓康伯手寫定本比校今所習者或将經入注用注作經小象中間以下句反居其上爻辭注内移後義却處於前兼有脱遺兩字顚倒謬誤者並依定本舉正其訛總一百三十五處二百七十三字晁公武易解多引用之唐周易開𤣥關流演啓源易軌甘棠正義晁氏志唐蘇鶚撰周易開𤣥關一卷自序云五代祖晉製八卦論編簡尚有存者畧演其㫖如此成𤣥英撰周易流演五卷錯綜六十四卦演九宫以直年月日道藏錄之蔡廣成撰周易啓源十卷凡三十六篇史徵撰口訣義七卷抄録注疏以便講習偽蜀蒲乾貫撰易軌一卷專言流演其序云可以知否泰之源察延促之數盖數學也崇文目周易甘棠正義三十卷任正一撰以孔頴逹為本甘棠者正一為陜州司馬故名其書唐太易志道家張志和太易十五卷張志和𫝊著太易十五篇其卦三百六十五乾鑿度有太易未見氣太初氣之始太始形之始太素質之始先天圖陳摶以傳种放放傳穆修修傳李挺之挺之傳邵雍雍有方圓二圗圖雖無文吾終日言而未嘗離乎是盖天地萬物之理盡在其中矣先天學心法也故圖皆自中起萬化萬事生乎心也先天圖中環中也先天學生乎誠先天之數自一而二自二而四自四而八乾兑離震在左㢲坎艮坤居右乾南坤北以定上下離東坎西以列左右朱震朱熹蔡元定張行成申其説本義載伏羲四圖其説皆出邵氏中圎外為陽方為隂李挺之變卦反對圗八篇六十四卦相生圖一篇伏羲之卦先天也文王之卦後天也開寳王昭素易論演聖通論書目三十三卷崇文目同昭素以王韓注易及孔馬疏義或未盡乃著此論徐徽刪其畧為易論要纂十卷開寶三年知制誥李穆薦王昭素召見便殿昭素著易論三十三篇時年七十餘太祖賜坐令講乾卦召宰臣薛居正等觀之至九五飛龍在天昭素對曰此爻正當陛下今日之事此書非聖人出不能合其象三月辛亥拜國子博士賜茶藥及錢二十萬留月餘遣之晁氏志以注疏異同互相詰難蔽以己意崇文目云取諸家之善參以其言折𠂻之胡旦有易演聖通論十六卷多引注疏及王昭素論為之商㩁天禧易樞易筌證墜簡天禧二年七月戊寅富順監言李見撰易樞十卷詔附驛以聞書目阮逸易筌六卷凡三百八十四卷晁説之易規十一篇晁氏志天禧中范諤昌撰證墜簡一卷其書類郭京舉正如震卦彖辭内云脱不䘮匕鬯四字程正叔取之漸卦上六疑陸字誤胡翼之取之自謂其學出於李處約許堅皇祐周易折藴㫖要皇祐三年九月二十二日評事孫坦上折藴十卷帝嘉其勤博四年五月知益州田况上太常丞代淵所著周易㫖要二十巻丙午以為祠部外郎至和元年十二月十八日宋咸上注周易十卷詔褒諭治平三年四月己丑工部侍郎皇甫泌上所著周易精義賜帛國史志任奉古周易發題一卷周易正經明疑録一卷不知撰人周易言象外𫝊書目十卷崇文目同侍講王洙撰凡十二篇序云論次舊義傅以新説以王弼𫝊為内擿其異者表而正之故云外也紹興中沈該小𫝊六巻每卦别為一論治平周易圗義書目二卷治平中葉昌齡撰以劉牧鉤隱圗之失遂著此書凡四十五門牧撰易數鉤隱圗一卷采摭天地竒耦之數自太極生兩儀而下至於河圗凡六十四位㸃之成圗於圗之下各釋其義凡四十八圗黄黎獻受於牧摭為畧例一卷隱訣一卷吳秘受於黎獻作通神一卷以釋鉤隱奏之凡三十四篇常豫撰易源一卷熈寧周易圗熈寧九年五月二十二日宗子克頠進周易開奥圗克孝進孝經傳詔褒之周易𫝊胡瑗翼之易𫝊十卷門人倪天隱所纂非其自著故序首稱先生鄭夬揚庭周易𫝊十二卷姚嗣宗謂劉牧之學授之吳祕祕授之夬夬又作明數明象明𫝊道明次例明範五篇邵雍言夬竊其學於王豫沈括亦言夬之學似雍云陸秉端夫易學十卷寶元二年奏御邵古天叟周易解五卷古雍之父劉牧長民易十卷書目劉牧新注十一卷慶厯初吳祕獻其書詔奨之田况為序言數者宗之又鈎隱圗三卷書目一卷又卦徳通論一卷徐庸易蘊一卷以春秋凡例易亦有之著書九篇號意縕凡例總論其學祖劉牧陸秉代淵易論二十卷皇甫泌周易述聞隱訣補解各一卷精微一卷石介守道周易五卷王逢易𫝊十卷鮮于侁子駿周易聖斷七卷本王弼劉牧而時辨其非宋咸易訓三卷自序謂既以補注奏御而男億請餘義百餘篇因名易訓吕大防周易古經二卷凡十二篇無解釋蘇軾東坡易𫝊十一卷父洵作易𫝊未完述以成書張載横渠易説十卷程氏頥易十卷序曰易變易也随時變易以從道也推辭考卦可以知變象與占在其中矣朱文公曰交易為體徃此來彼變易為用時静而動邵傳羲畫程演周經王安石易義二十卷龔原注二十卷耿南仲注二十卷張弼易十卷頗宗鄭氏房審權周易義海一百卷集鄭𤣥至王安石凡六家摘取專明人事者熈寧中晁説之以道古易十二卷又太極傳外傳因説朱震子發易集𫝊十一卷易圗三卷叢説一卷自謂學以程頥為宗㑹邵雍張載之論合鄭𤣥王弼之學牛師徳先天易鈐太極寶局二卷石汝礪乾生歸一圖二卷王湜易學一卷潜心邵學郭忠孝兼山易解二卷頗明象數張汝明易索十三卷凌唐佐易集解十卷沈該周易小𫝊六卷晁公武易故訓傳十八卷採古今諸家附以己聞胡銓易𫝊拾遺十卷宗主程説時出新意吕祖謙繫辭精義二卷楊萬里誠齋易𫝊二十卷林黄中周易經𫝊集解三十六卷淳熈中表進項安世周易玩辭十六卷程迥易章十卷外編占法古易考各一巻世稱沙隨易蔡淵周易訓解大𫝊易説易象意言魏了翁周易集義六十四卷麻衣道者正心易法一卷李潜序朱文公以為戴師愈所作周敦頥作太極圖説及通書四十章郭雍著易中庸之書十餘萬言有易説蓍卦辨疑中興書目雍易觧十一卷卦辭㫖要六卷紹興御書周易泰否卦紹興五年十月十一日庚戌右相張浚入見上親書周易否泰卦賜之浚奏自古小人傾陷君子莫不以朋黨為言臣嘗考泰之初九㧞茅茹以其彚征象以為志在外盖言其志在天下國家非為身故也否之初九㧞茅茹以其彚貞象以為志在君則君子連類而退盖将以行善道而未始忘憂國愛君之心焉觀二爻之義而考其用心則朋黨之論不攻而自破矣臣又觀否泰之理起於人君一心之微一念之正其畫為陽泰自是而起矣一念之不正其畫為隂否自是而起矣泰之上六三隂已盡復變為陽則小人在外而泰所由以生焉二十五年八月以所著否泰卦解義進之奏曰其事本諸一心髙宗書乾卦賜侍講秦梓紹興易説六年林儵乞上所著易書詔給事中朱震詳問震言用功至勤仍令明州給札録其所著易説及天道大備書變卦纂集等合二十六卷上之二月甲辰儵循資與堂除八年六年五日李授之上易解除直秘閣十五年十月二十七日劉翔進易解十六年吳沆進易璇璣三卷二十七篇四月十七日郭伸上易觧二十七年九月彭與上周易義解十册神授易圗四册大極歌一册易證詩一册義文圗二軸館學㸔詳謂潜心象數訓釋淹貫詔補上州文學三十年三月七日宋大明上周易解紹興初朱震撰易𫝊十一卷卦圖三卷叢説一卷表云𫝊九卷上采漢魏吳晉元魏下逮有唐及今紹興中晁説之周易太極𫝊六卷外𫝊一卷因説一卷説之從楊賢寶得康節先生自為易圖二作易𫝊四種名曰商瞿𫝊李衡撮要十二卷紹興易變體續書目易變體十六卷紹興中吏部郎中都絜進謂筮有某卦之某卦為變體如蔡墨言潜龍勿用不曰乾初九而曰乾之姤言龍戰于野不曰坤上六而曰坤之剥此謂變體自乾之姤至未濟之解以意演之爻為一篇凡三百八十四篇紹興大衍圖十七年四月左廸功郎吳適進大衍圖庚戌令秘省詳之紹興揲蓍古法紹興中鄭克武子撰一卷以今之言揲蓍法者或不取四營成易不待三變成爻而謂之小衍或不揲右手所分不數小指所掛而謂之新譜故列舊法使有可據程迥有揲蓍詳説淳熈易書淳熈八年八月五日知閬州吕凝之上易書四十卷上問輔臣周必大奏曰此本邵雍之學蜀人張行成推衍之凝之必講學於行成上曰行成所著頗略必大曰凝之配年以卦爻所以加宻乾道二年六月四日以行成進易可采除直徽猷閣行成有述衍十八卷通變四十卷以易數生於衍因先釋繫辭之説而復析衍法窮原䟽流命曰述衍邵雍之學祖於象數二圖其用皆起於交交則變今演解之命曰通變淳熈周易集解圖十二年四月二十六日知潭州林栗進經𫝊集解三十二卷繫辭上下二卷文言説卦序雜本文共為一卷河圖洛書八卦九疇大衍總會圖六十四卦立成圖大衍揲蓍解共為一卷總三十六册詔付祕省敕書奨諭二年曽穜裒程顥頥張載游酢楊時郭忠孝邵雍七先生之説為大易粹言十卷李椿云易以九居五六居二為當位而詞多艱以六居五九居二為不當位而詞多吉盖君以剛健為體而虚中為用臣以柔順為體而剛中為用君以虚中行其剛健臣以剛中守其柔順則上下交而其志同矣程迥云以六居五以九居二為卦十有六雖為時不同其十有五皆吉謂人君柔中虚己而任剛徳之臣其臣亦以剛中應之惟恒卦則不然恒從所應漢元帝似之張掄為易卦補遺其言曰易以初上二爻為定體以中四爻為變系辭謂之中爻先儒謂之互體所謂雜物撰徳辨是與非八卦互成剛柔相易之道非此無見焉坤與坎曰師而長子帥師之象盖出乎震艮與坤曰謙而用涉大川之象盖出乎坎雷在天上大壮而曰羝羊有兊存焉明入地中明夷而曰蒙難有坎存焉張浚易解并雜記共十卷論易數曰太極一也兩儀三之也分為二而七八九六之數五十有五此天地之中數也論剛柔之義曰君道主剛而其義也用柔故乾動則為坤矣臣道主柔而其動也用剛故坤動則為乾矣朱震曰變動之别其𫝊有五曰動爻卦變互體五行納甲而卦變之中又有變焉程頥主理震主數淳熈易學啓蒙本義朱文公熹淳熈四年易本義成十二卷又為諸圖冠首為五贊原象稽類述㫖警學明筮及筮儀附于末音義二卷十三年三月易學啓蒙成四篇以本圖書原卦畫明蓍䇿考變占為次又有蓍卦考誤揲蓍之法見於大𫝊郭雍為蓍卦辨疑三卷熹謂疏家小失其指而辨之者又大失焉説愈多而法愈亂因為考誤畢氏中和揲法視疏義為詳論三揲皆掛一正合四營之義惟以三揲之掛扐分措於三指間為小誤然大數亦不差易本為卜筮而作其言皆依象數以斷吉凶今其法不傳諸儒言象數者皆穿鑿言義理者大汗漫故其書難讀此本義啟蒙所以作也先天之學魏伯陽闚見其意陳摶始發其秘再傳為邵雍方圓圖皇極經世諸書朱震張行成朱文公蔡元定申其說郭忠孝得李挺之卦變論有得焉李舜臣易本傳三十三篇迹坎離之從中起校震巽之偏而不中謂舎本卦而論他卦為不然謂某卦從某卦来為妄復剛長而以日云者幸其至之速臨陽消而以月云者幸其消之遲説卦天地定位山澤通氣雷風相簿水火不相射八卦相錯邵子曰此伏羲八卦之位乾南坤北離東坎西兌居東南震居東北巽居西南艮居西北於是八卦相交而成六十四卦所謂先天之學也帝出乎震齊乎巽相見乎離致役乎坤説言乎兑戰乎乾勞乎坎成言乎艮邵子曰此卦位乃文王所定所謂後天之學也古易五家元豐五年汲郡吕大防始定周易古經分上經下經上彖下彖上象下象繫辭上下各二篇文言説卦序卦雜卦各一篇凡十二篇靖國中嵩山晁説之亦注古文易并十二為八以卦爻彖象文言繫辭説卦序卦各為一篇睢陽王氏東萊吕氏亦各定為十二篇吕祖謙更定經二卷傳十卷而音訓則門人王莘叟所筆受也祖謙因晁氏書參考傳記復定為十二卷其後九江周燔又自改更次序與諸家之説不類故言古易者為五家吳仁傑集為一卷仁傑亦分為十二篇洪興祖謂漢以來諸儒所𫝊各有師承唐陸徳明著音義兼存别本諸儒各以所見去取今以一行所纂古子夏𫝊為正而以諸書附著其下為易古經考異釋疑一卷續書目朱震曰今易乾卦自乾至用九即古易之本文晉汲郡竹書有周易上下經二卷朱子曰易有象然後有辭筮有變然後有占漢揚雄太𤣥本𫝊雄草太𤣥雄以為經莫大於易作太𤣥𫝊莫大於論語作法言太𤣥五千文説十餘萬言雄大潭思渾天參摹而四分之極於八十一旁則三摹九据極之七百二十九賛觀易者見卦而名之觀𤣥者數畫而定之𤣥首四重者非卦也數也其用自天元推一晝一夜隂陽數度律厯之紀九九大運與天終始故𤣥三方九州二十七部八十一家二百四十三表七百二十九賛分為三卷曰一二三與泰初厯相應亦有顓頊之厯焉􅨸之以三䇿注三三而分之關之以休咎絣之以象類播之以人事文之以五行擬之以道徳仁義禮智無主無名要合五經茍非其事文不虚生為其曼漶不可知故有首衝錯測攡瑩數文掜圖告十一篇以解剝𤣥體離散其文章句尚不存焉或嘲以尚白作解嘲有難𤣥太深作解難桓譚謂雄書必𫝊侯芭受其太𤣥穆氏本自𤣥首已下至𤣥告凡十一篇並漢宋衷解詁吳陸績釋而正之為􅄒𤣥並依舊本分賛辭為三卷一方為上二方為中三方為下次列首衝錯測攡瑩數文掜圗告十一篇晋范望叔明始合為十巻為之觧以𤣥首一篇加經賛之上𤣥測一篇附逐賛之末餘自𤣥衝已下至𤣥告九篇列為四卷三家義訓互有得失立虞翻以宋氏解𤣥頗有繆錯更為注并著明揚釋宋以理其滯法言或曰𤣥何為曰為仁義勿雜也童烏九齡而與我𤣥文藝文志儒家揚雄所序三十八篇太𤣥十九張衡𫝊常耽好𤣥經謂崔瑗曰吾觀太𤣥方知子雲妙極道數乃與五經相擬非徒傳記之屬使人難論隂陽之事漢家得天下二百嵗之書也復二百嵗殆将終乎所以作者之數必顯一世常然之符也漢四百嵗𤣥其興矣注桓譚新論曰揚雄作𤣥書以為𤣥者天也道也言聖賢制法作事皆引天道以為本統而因附續萬類王政人事法度故宓羲氏謂之易老子謂之道孔子謂之元而揚子謂之𤣥子雲止云太𤣥經非其自稱太𤣥經三篇以紀天地人之道立三體有上中下如禹貢之陳三品三三而九因以九九八十一故為八十一卦以四為數數從一至四重累變易竟八十一而徧不可損益以三十五蓍揲之𤣥經五千餘言而𫝊十二篇選注引張衡𤣥圗曰𤣥者無形之類自然之根作於太始莫與為先又引揚雄太𤣥賦蜀志李譔著太𤣥指歸魏志王肅從宋衷讀太𤣥更為之解吳志陸凱好太𤣥論演其意以筮輙驗隋志十卷蔡文邵注十四卷虞翻注十三卷陸凱注七卷王肅注九卷宋衷注梁有九卷揚雄自作章句亡唐志陸績注十二卷虞翻注十四卷范望注十二卷范望賛曰桓譚謂之絶倫張衡以擬五經非諸子之疇也為宋衷陸績各以淵通之才窮核道真十篇觧釋宋仲孚一作子注十二卷蔡文邵注十卷唐王涯為説𤣥五篇一卷又注六卷員俶太𤣥幽賛十卷開元四年京兆童子員俶進太𤣥幽賛十卷紫微省召試賦頌及第書目許洞演𤣥十卷其説分三紀二體上紀甲首丙尾日月迭居以辨數中紀丙首戊尾男女異政以辨位下紀庚首癸尾山川冲氣以辨徳二體曰範曰緯章詧太𤣥圖一卷慶厯中撰又發隠一卷始序雄出處本末著𤣥之意中陳準易造𤣥之法末論𤣥之妙以適變通司馬光集漢宋衷解詁吳陸績釋文晉范望解賛唐王涯注經及首測皇朝宋惟幹注解陳漸演𤣥吳秘音義凡七家又時出己意為集注六卷晁説之以光太𤣥歴邵雍𤣥圖合而譜之為易𤣥星紀譜二卷陳漸演𤣥七卷有𤣥統述策紀鐍鍵畧各一篇彈誤二篇𤣥圖一篇𤣥箝一篇字摹十六篇張行成翼𤣥十二篇行成曰太𤣥義取於連山元包義取於歸藏李沂集解義訣十卷集宋陸范王并撰􅨸法占法又為圖并雜説總十五篇徐庸𤣥賾一卷僧全瑩太𤣥畧例一卷國史志徐庸注太𤣥經十二卷張齊太𤣥正義統論一卷釋文𤣥説二卷宋咸音一卷師望𤣥鑒十卷陳漸演𤣥七卷本十卷其間多言星厯自焚三卷前世多詆太𤣥自王涯著説發明淵奥其學遂盛晁氏志宋惟幹太𤣥解十卷惟幹得太𤣥古本于昭應咸平中知滑臺取宋陸范三家訓解别為之注仍作太𤣥宗㫖兩篇附于後其學盖師田告司馬公所謂小宋者也景徳元年五月庚子直昭文館宋惟幹上新注十卷付史館幹一作翰徐庸注太𤣥經解十卷慶厯間章詧太𤣥經注十四卷疏三十卷皇祐五年閏七月二十五日章詧上太𤣥經發隱三篇章詧一作張詧守太𤣥經觧十卷并發隱三卷釋文一卷嘉祐中成都蒋堂獻其書詔奨之陳漸演𤣥十卷凡十四篇漸傳著書十五篇號演𤣥奏之漸謂法言解嘲止云太𤣥然則經非其自稱弟子侯芭之徒尊之耳集注陳氏曰經非子雲自稱侯芭之徒尊之耳張揆太𤣥淵㫖一卷皇祐四年九月甲寅丁度上張揆修冩太𤣥經郭元亨太𤣥經疏十八卷元亨自淳化末迄祥符八年撰成又云太𤣥潤色於君平未知何所據吳陸績述𤣥曰雄建立𤣥經與聖人同趣雖周公繇大易孔子修春秋不能是過唐王涯説𤣥五篇明宗立例揲法占法辨首説𤣥曰八十一首擬乎卦九賛之位類夫爻易以八八為數其卦六十有四𤣥以九九為數其首八十有一易之占以變𤣥之筮以逢數有隂陽而時有晝夜首有經緯而占有旦夕參而得之謂之逢四位成列性在其中矣九虚旁通情在其中矣四位之次曰方州部家以一生二方以三生九州以九生二十七部以二十七生八十一家三相生𤣥之數也一首九賛故有七百二十九賛其外踦贏二賛以備一儀之月數𤣥之首也始於中中之始也在乎一一之所配自天元甲子朔旦冬至推一晝一夜終而復始天元二十七首中至事地元二十七首更至昆人元二十七首减至養馮元以宋陸諸家章句失雄㫖獨王涯稍近作釋文一篇司馬光讀𤣥曰𤣥以賛易易天也𤣥為之階説𤣥曰易與太𤣥大抵道同而法異易畫有二曰陽曰隂𤣥畫有三曰一曰二曰三易有六位𤣥有四重方州部家𫝊謂參摹一而四分之極於八十易以八卦相重為六十四卦𤣥以一二三錯於方州部家為八十一首易每卦有六爻合為三百八十四爻𤣥每首有九賛合為七百二十九賛皆當朞之日易卦起於中孚除震離坎兑氣四正卦二十四爻主二十四外其餘六十卦毎卦六日七分凡得三百六十五日四分日之一中孚初九冬至之初也頥上九大雪之末也周而復始𤣥七百二十九賛毎二賛合為一日一賛為晝一賛為夜凡得三百六十四日半益以踦贏二賛成三百六十五日四分日之一中初一冬至之初也踦嬴二賛大雪之末也亦周而復始易有元亨利貞𤣥有罔直蒙酋㝠易大衍之數五十其用四十有九𤣥天地之數各十有八合為三十六䇿地則虚三用三十三䇿易揲之以四𤣥揲之以三易有七九八六謂之四象𤣥有一二三謂之三摹易有彖𤣥有首易有爻𤣥有賛易有象𤣥有測易有文言𤣥有文易有繫辭𤣥有攡瑩掜圗告易有説卦𤣥有數易有序卦𤣥有衝易有雜卦𤣥有錯殊塗而同歸百慮而一致皆本於太極兩儀三才四時五行而歸於道徳仁義禮也邵雍觀物外篇曰洛下閎改顓頊厯為太初厯子雲凖太初而作太𤣥凡八十一卦九分共二卦凡一五隔一四細分之則四分半當一卦氣起於中心故首中卦揚雄作𤣥可謂見天地之心又凖易圖序曰𤣥之於易猶地之於天也朱震凖易圗曰太𤣥之作與太初相應十一月甲子夜半朔冬至而兼該顓頊之厯首十月發明連山之㫖首艮以凖周易為八十一卦凡九分共一卦一五隔一四細分之則四分半當一日凖六十卦一日卦六日七分也中中孚也律厯之元始於冬至卦氣起於中孚其書本於夏連山首艮踦贏二賛有其辭而無其卦而附之於養者以閏為虚也蘇洵論曰太𤣥之䇿三十有六虚三而三十有三用焉求易之過也欲去其踦與贏加其首之一分損其蓍之三䇿又總例曰雄好竒務深始之以十八䇿中之以三十六終之以七十二積之以二萬六千二百四十四唐仲友曰雄最知大衍數者故𤣥數曰三八為木四九為金二七為火一六為水五五為土𤣥圖曰一與六共宗二與七共朋三與八成友四與九同道五與五相守不言五十為土五與十相守者知藏五之為大衍也蕭該漢書音義衝作衡又案别録告下有𤣥問一篇合十二篇今脱一篇嘉祐二年十一月己亥二十七日吳祕上注太𤣥及音義紹興十三年八月二十三日王銍上太𤣥經解義晉通𤣥經王長文𫝊著書四卷擬易名曰通𤣥經有文言卦象可用卜筮時人比之太𤣥同郡馬秀曰揚雄作太𤣥惟桓譚以為必𫝊後世晚遭陸績𤣥道遂明長文通𤣥經未遭陸績君山耳隋志梁有通經二卷晉王長元撰揚子太𤣥經十四卷晉揚泉撰儒家潜虚司馬光著潜虚一卷曰氣曰體曰性曰名曰行曰命以凶吉臧否平為所遇之占𤣥以凖易虚以擬𤣥萬物皆祖於虚易之卦始於太極𤣥之首始於一元虚之行始於五行易之卦兼河洛之數𤣥之首得河圗之九數虚之行得洛書之十數句皆協韻如易彖爻象𤣥首賛測易曰卦𤣥曰首虚曰名卦有爻首有賛名有變二體四位十等之象八物五行與生成之數乾中𤣥之所以始一三五之所以虚與揲法占法若異實同光又為易説三卷注繫辭二卷朱熹以范仲彪别本補潜虚之闕張行成為潜虚衍義十六卷章分句析後截行成所續不韻晁氏志以五行為本五五相乘為二十五兩之得五十首有氣體性名行變解七圗然其辭有闕者盖未成也太𤣥潜虚或以四十五變八十一或以五十五變一百揚氏之太𤣥八十一首關氏之洞極二十七象司馬氏之潜虚五十五行太𤣥凖易圗太𤣥集解邵雍太𤣥凖易圗序夫𤣥之於易猶地之於天也天主太極而地總元氣元氣轉而為三統在𤣥則謂之三元三元轉而為九州九州轉而為二十七部二十七部轉而為八十一首首有九賛賛分晝夜而剛柔之用見矣故𤣥之賛七百二十九而有竒以應三百六旬有六日之度葢本出乎元氣而作者也太極生兩儀兩儀生四象四象生八卦八卦因而重之為六十四故易有乾坎艮震㢲離坤兑八卦以司八節又以坎離震兑四正之卦二十四爻以司二十四氣以復臨泰大壮夬乾姤遯否觀剥坤十有二卦以司七十二候節也氣也􅀱也既各有統矣然周天之度未見其所司也於是又去四正之卦分取六十卦引而伸之為三百六十爻各司其日則周天三百六十度而寒暑進退之道隂陽之運備矣葢本乎太極而作者也由是觀之則天地各有生成之數而相為表裏之用故天數西行上承而左轉者在地之元氣也地數東行下順而右運者在天之太極也太極運三辰五星於上元氣轉三統五行於下此所謂成變化而行􅀑神者也所謂𤣥之於易猶地之於天者如斯而已凖而作之不亦宜乎若夫分天度列次舎序氣候明卦爻冠首賛位列八重先以夜賛布諸外然後晝賛首位爻象候卦氣卦宫分度數次諸内復㑹於辰極而𤣥易顯仁藏用之道循乎數者可見矣是故始於上元甲子天正朔旦日躔牛宿之初後四千六百一十七年復㑹於太初之上元者元之賛也自上元甲寅青龍之首氣起未濟之九四後三萬一千九百二十年復㑹於太極之上元者易之爻也原始要終究其所窮則體用雖殊其歸一而已矣晁説之易𤣥星紀譜後序曰子雲初為文王易而作𤣥始託基於高辛及太初二厯此二厯之斗分强弱不可下通於今亦無足議温公又本諸太初厯而作𤣥厯康節先生𤣥圗布星辰辨氣候分晝夜而易𤣥相參於中乃朝筭夜思取厯與圗合而譜之於是知子雲以首凖卦非出於其私意盖有星候為之機括張揆傳上所著太𤣥集解數萬言召對邇英閤令揲蓍得斷首且言凖易之夬盖以陽剛决隂柔君子進小人退之象仁宗悦擢天章閣待制兼侍讀慶厯七年十月集賢修撰張揆召見延和殿壬寅朔以為待制有未畫之易易之理有既畫之易易之書易起數以定畫因畫以生辭因辭以明象因象以盡意竒耦七八也交重九六也卦畫七八不易也爻畫九六變易也卦雖不易而中有變易是之謂亨爻雖變易而中有不易是之謂正易之為書辭變象占乃其綱領而繇彖爻象之辭畫爻位虚之别互反飛伏之說乗承比應之例一不知則義理闕焉世之學易者卑入於象數髙入於名理五鹿充宗與諸儒講而朱雲折之何晏不了九事而伏曼容輕之王弼訓注于六爻變化五氣相推多所擯畧而孫盛短之周𢎞正於講席辨析名理而張譏屈之盖其㫖難明如此玉海卷三十六
