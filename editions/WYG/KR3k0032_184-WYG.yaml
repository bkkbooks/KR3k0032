body:
  text: 玉海卷一百八十四宋王應麟撰食貨倉庾史記注胡公曰在邑曰倉在野曰庾漢志胃為天倉其南衆星曰廥積晉志天囷十三星在胃南為倉廪之屬石氏星經天倉六星在婁南倉榖所藏南四星天庾積厨粟之所天囷十三星主御糧周鉅橋倉漢張良𫝊武王發鉅橋之粟注服䖍曰鉅橋倉名許慎云鉅鹿之大橋有漕一作積粟管子武王有巨橋之粟貴糴之數注巨橋倉在今廣平郡曲周縣括地志在洺州曲周縣界楚茨我倉既盈我庾維億公劉乃積乃倉豐年亦有高廪甫田曽孫之庾如坁如京乃求千斯倉乃求萬斯箱箋成王見禾榖之税委積之多於是求千倉以處之萬車以載之周制縣都有委積倉廪有分頒周廪人神倉見藉田地官廪人下大夫二人掌九榖之數大祭祀則共其接盛注藉田之收藏於神倉者也倉人中士四人掌粟入之藏周御廪春秋桓公十四年八月壬申御廪災左氏𫝊注御廪藏公所親耕以奉粢盛之倉說苑魏文侯有御廪晉志天廩四星在昴南一曰天廥春秋所謂御廪也管子黄帝使大常為廪者注謂開廪以給人也漢敖倉高帝紀二年五月屯滎陽與楚戰滎陽京索破之築甬道属河以取敖倉粟孟康注敖地名在滎陽西北山上臨河有大倉四年復取成臯軍廣武就敖倉食史記酈生𫝊漢三年秋項羽㧞滎陽漢欲捐成臯以東屯鞏雒酈生曰知天之天者王事可成不知天之天者王事不可成王者以民為天民以食為天夫敖倉天下轉輸乆矣臣聞其下乃有藏粟甚多楚人㧞滎陽不堅守敖倉乃令適卒分守成臯此乃天所以資漢臣願急復進兵收取滎陽據敖倉漢書作庾之粟塞成臯之險杜大行之道距飛狐之口守白馬之津以示諸侯形制之勢則天下知所歸矣上曰善復守敖倉酈生又曰陳留城多積粟恵帝紀六年夏六月起長安西市修敖倉功臣表程黒擊項羽敖倉下周昌以内史堅守敖倉郭蒙以都尉堅守敖倉列𫝊周勃攻曲遇還守敖倉灌嬰南送漢王還至敖倉靳歙還軍敖倉破項籍軍成臯吳王濞少將桓將軍說王疾西據雒陽武庫食敖倉粟翼奉願徙都成周南北千里以為關而入敖倉武帝王夫人欲立子閎於雒陽武帝曰雒陽有武庫敖倉天下衝阨漢國之大都先帝以來無王子於雒陽者地理志河南郡敖倉在滎陽水經濟水又東逕敖山北注詩所謂搏狩于敖其山上有城即殷仲丁所遷秦置倉於其中故亦曰敖倉城書仲丁遷于囂疏云或曰今河南敖倉後郡國志注宣王狩于敖詩言搏獸于敖左傳宣十二年晉師在敖鄗之間秦於此地築倉秦立敖倉漢因之倉在滎陽臯太康地理志秦建敖倉於成後百官志大司農屬官舊有滎陽敖倉官中興屬河南尹六典注後漢河南尹屬官有滎陽敖倉長丞安帝紀永初七年九月調濵水縣榖輸敖倉注詩曰搏狩於敖即此地秦於此築大倉亦曰敖庾在今鄭州滎陽縣西北蓋延𫝊建武二年遣南擊敖倉虞詡𫝊為朝歌長謁馬棱曰朝歌去敖倉百里賊不知開倉招衆刼庫兵守成臯此不足憂也漢太倉又見宫類甘泉倉高帝紀七年二月蕭何治未央宫立太倉三輔皇圖蕭何造在長安城外東南有百二十楹文景節儉太倉之粟紅腐而不可食百官表漢大司農屬官有太倉令丞律志量有龠合升斗斛職在太倉大司農掌之食貨志文景儉節至武帝之初漢興七十餘年間太倉之粟陳陳相因充溢露積于外居官者以為姓號注貨殖𫝊倉氏庾氏是也王嘉𫝊孝文時吏居官者子孫以為氏有倉氏庫氏賈損之𫝊元狩六年劉仲馮曰誤以建元為元狩太倉之粟紅腐而不可食史記齊太倉長淳于意漢志文帝十三年齊太倉令淳于公後百官志太倉令一人六百石主受郡國轉漕榖堅鐔𫝊注洛陽記曰建始殿東有太倉倉東有武庫晉志獻帝出太倉米為饑民作糜食貨志太倉甘泉倉滿漢長安倉宣紀本始四年正月詔丞相以下至都官令丞上書入榖輸長安倉助貸貧民鮑宣𫝊上書曰龔勝為司直三輔委輸官不敢為姦漢細柳倉嘉倉嘉禾倉三輔黄圖在長安西渭北石徼西有細柳倉東有嘉倉初建一百二十楹樊噲𫝊攻下栁中注細栁地服䖍曰細栁在長安西北萬章傳在城西栁市注師古曰漢宫闕䟽云細栁倉有栁市文紀注如淳曰長安圖細栁倉在渭北近石徼三輔故事漢周亞夫軍於細栁今石徼是也石徼西有細栁倉城東嘉禾倉括地志細栁倉在雍州咸陽縣西南二十里張揖曰在昆明池南今有栁市是也師古曰匈奴傳云軍長安西細栁此則不在渭北漢常平倉宣紀五鳯四年春正月大司農中丞耿夀昌奏設常平倉以給北邊省轉漕賜爵關内侯食貨志宣帝即位用吏多選賢良百姓安土歳數豐穰榖至石五錢農人少利大司農中丞耿夀昌善為筭能商功利得幸於上五鳳中奏言故事歳漕關東糓四百萬斛以給京師用卒六萬人宜糴三輔𢎞農河東上黨太原榖足供京師可以省關東漕卒過半又白増海租三倍天子從其計御史大夫蕭望之奏故御史属徐宫家在東萊言徃年加海租魚不出長老皆言武帝時縣官嘗自漁海魚不出後復予民魚乃出夫隂陽之感物類相應萬事盡然夀昌欲盡糴關内之榖築倉治船費直二萬萬餘有動衆之功恐生旱氣民被其灾夀昌習於商功分銖之事其深計逺慮誠未足任宜且如故顔師古以望之為不知權上不聽漕事果便夀昌遂白令邊郡皆築倉以榖賤時増其價而糴以利農榖貴時減價而糶以贍貧民名曰常平倉民便之上乃下詔賜夀昌爵關内侯而蔡癸以好農使勸郡國至大官元帝時初元五年四月詔罷常平倉天下大水二年齊地饑民多餓死諸儒多言鹽鐵官及北假田官常平倉可罷毋與民爭利上皆罷之夀昌常平亦有從徠酷吏傳嚴延年遷河南太守府丞義道夀昌為常平倉利百姓延年曰丞相御史不知為也夀昌安得權此趙充國𫝊吾謂耿中丞請糴百萬斛乃得四十萬斛義渠費其半魏相𫝊奏王法必本於農而務積聚量入制用以備凶災通典漢明帝永平五年作常平倉後劉般𫝊永平十年帝欲置常平倉公卿議者多以為便般對以常平外有利民之名而内實侵刻百姓豪右因縁為姦小民不得其平置之不便帝乃止魏用平糴之法漢置常平之倉漢郡國諸倉百官表郡國諸倉農監都水六十五官長丞皆属治粟内史即大司農水衡屬官有農倉令丞文紀後六年四月發倉庾振民食貨志武帝遣使虚郡國倉廪以振貧地理志河東有根倉滋倉河南有敖倉汲黯𫝊以便宜持節發河南倉粟振貧民一云河内枚乗𫝊吳東山之府海陵之倉後漢志廣陵東陽縣有長洲潭吳王濞太倉在此漢藉田倉禮儀志注漢舊儀曰種百榖萬斛為立藉田倉置令丞榖皆以給祭天地宗廟羣神之祀以為栥盛皇帝躬秉耒耜而耕古為甸師官賀循曰所種之榖黍稷穜稑漢常滿倉羊腸倉見河渠晉志顯宗即位天下安寧民無横徭歳比稔永平五年作常滿倉洛陽記有常滿倉立粟市於城東粟斛直錢三十草木殷阜牛羊彌望作貢尤輕府廪還積王莽𫝊奏作市常滿倉平帝紀亦有常滿事蓋莽立之揚雄元后誄起常盈倉五十萬斛為諸生儲以勸好學淮南子精神訓許慎注敖倉古常滿倉也述征記東城二石橋舊於王城之東北開渠引洛水名曰陽渠東流經洛陽於城之東南北逥通運至建春門以輸常滿倉王莽傳有京師倉注師古曰在華隂灌北渭口晉太倉常平倉平糴法元魏常平倉齊富人倉武帝紀咸寧二年九月丁未起太倉於城東常平倉於東西市食貨志武帝欲平一江表時榖賤而布帛貴帝欲立平糴法用布帛市榖以為粮儲議者謂軍資尚少不宜以貴易賤帝乃下詔曰夫百姓年豐則用奢凶荒則窮匱是相報之理也故古人權量國用取贏散滯有輕重平糴之法理財均施恵而不費政之善者也然此事乆廢天下希習其宜加以官蓄未廣言者異同財貨未能通逹其制更令國寳散於穰歳而上不收貧弱困於荒年而國無備豪人富商挾輕資藴重積以管其利故農夫苦其業而末作不可禁也今者省繇務本并力墾殖欲令農功益登耕者益勸而猶或騰踊至於農人並傷今宜通糴以充儉乏主者平議具為條制然事竟未行是時江南未平朝廷厲精於稼穡四年正月丁亥帝躬耕藉田庚寅詔以中左典牧馬賜縣令長相及郡國丞是歳立常平倉豐則糴儉則糶以利百姓杜預𫝊拜度支尚書奏立耤田興常平倉定榖價皆納焉水經注洛陽地記曰大城東有太倉倉下運船常有千計江左有龍首倉即石頭津倉也臺城内倉南塘倉常平倉東西大倉東宫倉所貯不過五十餘萬在外有豫章釣磯錢塘倉元魏太和二十年閏十月戊辰置常平倉北齊河清中令州郡别置富人倉後周司倉辨九榖之物宋沈曇慶議立常平倉以救民急事不行齊永明六年擬常平之制市糴榖帛梁陳有常平倉而不糶隋黎陽倉河陽倉常平倉廣通倉常平監洛口回洛倉永豐倉食貨志開皇三年以京師倉廪虛議備水旱詔於蒲陜等十三州募運米丁衛州置黎陽倉洛州置河陽倉陜州置常平倉六典云以此通轉運非糶糴華州置廣通倉轉相灌注漕關東汾晉之粟以給京師募人於洛陽運米四十石經底柱達常平倉者免征戍又河西營田積榖京師置常平監四年開廣通渠五年發廣通之粟三百餘萬石拯關中大業二年十月置洛口倉於鞏城周二十里穿三千窖置囘洛倉於洛陽北城周十里穿三百窖窖容八百石義師入長安發永豐倉振饑地理志鞏縣有興洛倉文紀仁夀三年九月壬戌置常平官唐任瓌𫝊至龍門見高祖曰據永豐積粟雖未得京師關中已定矣留戍永豐倉段志𤣥攻永豐倉竇軌下永豐倉李宻𫝊大業十三年拔興洛倉守囘洛倉城洛口隋義倉社倉食貨志開皇五年五月度支尚書長孫平建言陛下運山東之粟置常平之官發廪振賜莫不豐足但經國之理須存定式奏令諸州勸課當社共立義倉收穫之日隨所得出粟麥委社司檢校以備水旱甲申初詔州縣置倉後關中青兖等州水旱命蘇威等分道開倉振給義倉貯民間多費損十五年二月詔旱儉先給雜種及逺年粟十六年正月又詔秦疊等州置社倉二月詔社倉準上中下三等稅上户一石中户七斗下戸四斗終於開皇人不饑饉後漢黄香為魏郡守年饑豐富之家各出義榖助官稟貸越絶書吳兩倉春申君所造一名均輸成周縣都有委積倉廪有分頒唐社倉義倉㑹要兼用舊志武徳元年九月四日置社倉貞觀中凶荒則有社倉賑給不足則徙民就食諸州貞觀二年四月三日尚書左丞戴胄上言曰隋開皇之制天下輸粟謂之社倉及大業中取充官費今請自王公以下計墾田秋熟所在為義倉歳凶以給民太宗善之乃詔畆稅二升粟麥秔稻隨地所宜寛鄉斂以所種狹鄉據青苖簿而督之耗十四者免其半耗十七者皆免之商賈無田者以其户為九等出粟自五石至五斗為差下户不取焉歳不登以賑民或貸為種子至秋而償户部尚書韓仲良奏云云制可之高宗永徽二年正月戊戌開義倉以賑民閏九月六日令率户出粟上上戸五石餘各有差後稍假義倉以給他費至神龍中畧盡𤣥宗即位復置之開元四年五月二十一日詔義倉本備饑年賑給自今以後不得以義倉變造申賑給之法嚴變造之禁開元二十五年定式天寳八載共六千三百八通典無八字十七萬七千六百六十石陸贄云歴高宗之代五十六載人頼其資國步中艱斯制不弛開元之際漸復修崇是知儲積備災聖王急務也元和六年二月癸巳制宿麥未登以常平義倉粟二十四萬石貸百姓諸道有乏種糧者用常平義倉米貸之七年二月壬辰賑八萬石九年二月丁未賑三十萬石十二年九月辛卯詔諸道遭水人户令以義倉賑給十三年正月户部侍郎孟簡奏常平義倉請減估糶有司更不收管州縣得專以利百姓從之長慶二年閏十月甲寅詔江淮水旱以常平義倉出糶以恵貧民四年三月制令諸州録事參軍專主開成元年八月户部奏請公私田畆别納粟一升添貯義倉從之其年十一月忠武節度使杜悰天平節度使王源中奏當道常平義倉請别置十萬石以備凶年從之四年七月丙午詔曰義倉防水旱先給後奏敕有明文韋倫𫝊請為義倉以捍無年桞宗元貞符鄉為義廪斂發謹飭歳丁大侵人以有年陸贄奏議論稅茶歳約五十萬貫請令轉運使就州縣和糴置義倉以備水旱俟人小休漸勸私積平糴之法斯在社倉之制兼行不出十年之中必盈三歳之蓄滋長不已升平可期貞元十年上事寢高宗咸亨元年十一月乙卯運劍南義倉米百萬石救饑人憲宗元和四年六月發京兆義倉賑給唐常平倉藏粟米令㑹要武徳元年九月二十二日詔置常平監官以均天下之貨五年十二月廢貞觀十三年十二月十三日壬午詔於洛相幽徐齊并秦蒲州置常平倉粟藏九年米藏五年下濕之地粟藏五年米藏三年皆著于令永徽六年八月二十九日己酉京東西二市置常平倉置常平司官開元二年九月二十五日以榖賤傷農令諸州加時價糴米貴減價以糶通鑑云敕諸州修常平倉法七年六月二十八日關内隴右河北河南五道及荆􅀭襄䕫綿益彭蜀資漢劍茂等州並置常平倉十六年十月二日勅加時價三錢收糴開元初修常平倉法淮浙劍南諸道以下濕不堪貯積討論貯儲之方益精而地氣不能病十通典天寳八年四百六萬二千二百十石廣徳二年正月二十五日第五琦請天下常平倉皆置庫以蓄本錢唐常平本錢𤣥宗取之客户開元初宇文融請校天下籍收匿户佐用度於是諸道收没分八十萬田稱是歳終羨錢數百萬緡十三年二月庚申帝乃下詔以客賦所在並建常平倉益儲九榖權發歛官司勸作農社使貧富相恤六典注開元二十四年於京城内大置常平徳宗取之茶漆建中三年九月趙賛上言請於兩都并江陵成都楊汴蘇洪等州置常平輕重本錢上至百萬緡下至數十萬諸道津會置吏閱商賈錢每緡稅二十竹木茶漆稅十一以贍常平本錢徳宗納其䇿軍用迫蹙隨而耗竭不能備常平之積憲宗取之地稅元和元年正月制州府所稅地子數内十分取二分均充常平倉憲宗曰宫中用尺寸物皆有籍惟賑民無所計文宗取之囘易太和九年以天下囘易錢置常平義倉本錢歳増市之非遇水旱不増者判官罸俸書下考州縣假借者以枉法論六典常平令一人太府屬官掌平糴倉儲之事丞為之貳垂拱初兩京初置常平署天下諸州亦置之百官志倉部郎中以社倉常平倉備凶年平榖價劉晏𫝊晏以常平法貴取賤與率諸州米常儲三百萬斛韋宙𫝊為永州刺史始築常平倉收榖羨餘以待饑乏周官旅師掌聚野之耡粟屋粟間粟平頒其興積施其恵散其利凡用粟春頒而秋斂之魏平糴漢常平元帝罷之明帝復之晉泰始四年立倉隋置監唐永徽立於京師漢規先具開邊糴以均輸唐務富藏籍關征而贍本唐太倉含嘉倉又見後長安倉六典司農寺有太倉令掌九榖廪藏之事注東都則曰含嘉倉倉部郎中掌倉庾凡都之東租納於都之含嘉倉自含嘉倉轉運以實京之太倉自洛至陜運於陸自陜至京運於水量其遞運節制置使以監綂之會要太倉出納貞元五年俾司農少卿一人專領少卿李堅立太倉石柱記凡鑿窖置屋銘甎為庾斛之數與其年月日陸贄曰貞元初太倉無兼月之儲而有司奏停水運貞元十四年九月以歳饑出太倉粟三十萬石出糶其年十二月以河南府榖貴人流令以含嘉倉粟七萬石出糶十三年三月以含嘉倉五萬石賑貸十五年二月癸卯以歳饑出太倉粟十八萬石十九年十月太倉奏請依六典置太倉令等員從之元和九年四月詔出太倉粟九十萬石開六場糶之并賑貸外縣長慶四年二月出太倉米三十萬石開元二十一年以久雨出太倉米一百萬石天寳十三載出太倉米百萬石分十場糶食貨志開元二十五年以後以太倉積粟有餘歳減漕數十萬石文宗召監倉御史問太倉粟數崔虞對粟二百五十萬石開成元年正月御紫宸殿召問百官志殿中侍御史一人監太倉出納開元十九年以監察御史莅太倉其後以殿中侍御史上一人為監太倉使列𫝊張說久視中上疏太倉武庫並在都邑崔沔睿宗時請發太倉粟賑貧乏人頼其利楊愼矜弟愼名𤣥宗擢為含嘉倉出納使會要作愼矜愼餘主長安倉崔郾為虢州觀察使詔賦粟輸太倉者歳數萬石民輦而致之河郾乃旁流為大敖受粟竇而注諸艚民忘輸之勞李商隠有太倉箴太和七年十月唐河陽倉㑹要咸亨元年閏九月六日置河陽倉𨽻司農寺開元十年九月十五日廢河陽等倉唐含嘉倉栢崖倉河隂倉集津倉鹽倉洛口倉永豐倉臨渭倉龍門倉太原倉㑹要咸亨三年六月十七日丙子於洛州栢崖置敖倉容二十萬石通典考功郎中王本立置至開元十年九月十一日廢六典太原永豐龍門諸監毎倉監一人注隋初漕關東之粟以實京邑衛州黎陽倉滎陽洛口倉洛州河陽倉陜州常平倉潼關渭南亦皆有倉皇朝因之地理志河南府鞏有洛口倉河清有栢崖倉陜州三門西有鹽倉東有集津倉陜有太原倉孟州河隂有河隂倉華州華隂有永豐倉臨渭倉河中府龍門有龍門倉開元二年置食貨志貞元初關輔宿兵以永豐倉米給禁中又見上列𫝊姜師度為陜州刺史太原倉水陸運所湊轉属諸河師度依高為廥注米于舟郭子儀進取永豐倉關陜始通劉晏按行觀三門遺迹至河隂鞏洛會要云移書曰陜郊見三門集津遺跡開成初湖南觀察盧周仁進羨錢億萬詔置錢河隂院以虞水旱通鑑義寧元年八月癸巳高祖至龍門薛大鼎請直濟河據永豐倉九月戊午華隂令李孝常以永豐倉降丙寅遣劉文静帥數萬人屯永豐倉守潼關庚午自臨晉濟渭至永豐倉勞軍開倉賑饑民任瓌留戍永豐倉開元二年正月戊寅以三輔水旱詔以義倉賑給如不足兼以正倉及永豐倉米八年四月華州請以永豐倉賑給十二年八月蒲同州旱出太原倉永豐倉皆十五萬石減價糶通典天寳八年諸倉千二百六十五萬六千六百二十石北倉太倉含嘉永豐太原龍門正倉總四千二百十二萬六千一百八十四石十道義倉六千三百十七萬七千六百六十石常平倉四百六十萬二千二百二十石和糴一百十三萬九千五百三十石關内河西河東隴右天下米都九千六百六萬二千二百二十石唐渭橋倉㑹要咸亨三年關中饑監察御史王師順運晉絳之粟于河渭之間増置渭橋倉自師順始也唐京倉食貨志𤣥宗時太府卿楊崇禮勾剥分銖次子慎名知京倉亦以苛刻結主恩六典太倉令凡京官之禄發京倉以給唐御廪見太常四院神倉禮志藉田之榖斂而鍾之神倉以擬粢盛及五齊三酒六典廪犧令凡籍田所收九榖納于神倉以共粢盛及五齊三酒之用有餘及穰藁飼犧牲唐濵汾新倉李憲𫝊河中兵本仰食于絳而汾可輸河渭歳租與糴常數十萬石故敖保山為固民之輸者十牛不勝一車憲濵汾相地治新倉當費二百萬請留垣縣粟糶河南以錢還糴絳粟𣙜其贏以葺新倉絳人賴利唐河隂太原倉見上陸贄奏議河隂太原等倉見米猶有二百二十餘萬石河隂一縣所貯尤多舊例從江淮諸道運米一百十萬石至河隂來年請停八十萬石運三十萬石舊例從河隂運米七十萬石至太原倉來年請停五十萬石運二十萬石舊例從太原倉運米四十萬石至東渭橋來年請停二十萬石運二十萬石宋朝義倉建隆慶厯熈寧元豐記建隆四年即乾徳元年十一月方改元三月庚申詔多事之後義倉寖廢歳或少歉失於預備宜令諸州於属縣各置義倉自今宫中所牧二稅每石别輸一斗貯之以備凶歉給與民人乾徳四年三月癸酉詔以百姓供輸勞擾俾從停廢以便物情會要乾徳四年重疊供輸復成勞擾罷之仁宗慶厯元年九月乙亥詔天下立義倉明道二年二月丁未耕藉田詔天下久廢義倉宜相度興置之先是景祐四年或有水旱上常憂恤務要賑救三司判官王琪奏乞行義倉琪言戴胄畆稅二升其實太重永徽計口出粟又且不均莫若自第五等户以上於夏秋二稅外每二斗别納一升隨常稅以入若遇水旱但正稅得減則更不輸各於州郡擇便地立義倉貯之轉運領焉今天下大率取一中郡計之正稅粟麥之類且以十萬石為率則義倉於一中郡歳得五千石矣矧天下之廣卒遇水旱行賑給則兼并之家未必待此而濟中下之室實先受其賜損有餘補不足實天下之大利㑹議者同異而止康定中又上奏至慶厯元年九月乙亥詔立義倉從判三司户部勾院王琪請也二年正月戊午詔天下新立義倉止令上三等户輸之五年詔罷義倉熈寧初神宗欲復之㑹王安石主青苗因言人有餘粟乃使之輸官非良法也乃止二年七月己巳也是歳同州趙尚寛等條奏置義倉事會知陳留縣蘇涓為天下倡乃就陳留行之熈寧末十年九月癸酉開封府界自豊稔縣先立義倉王古為司農簿奏復行之仍聽就縣倉輸自是義倉入縣倉矣紀云立義倉自畿内始於一云元豐元年王古言去歳詔復義倉試京畿已不擾請於豐稔路先推行謂京東西淮南河東陜西如畿縣行之不及斗者免元豐八年又罷之紹聖初元年閏四月復置納米斗五合大觀元年三月戊子増令斗一升以備賑荒紹興二十八年户部趙令詪言請歳以三之一出陳易新又請水旱災傷檢放不及七分即許賑濟九月乙酉從之明年遣使覈實淳熈十一年九月詔不得侵隠他用元豐元年十月己未頒義倉法於川峽四路太平興國御廪興國七年二月六日庚午幸新修御廪元豐二年詳定所言自漢迄唐皆有帝藉神倉今久廢不設祭祀所用皆索諸市非也請於京城東南度田千畆為藉田十月癸卯初置藉田端拱折中倉一作入中倉淳化折博倉端拱二年冬十月癸丑朔詔復置折中倉以范正辭等掌之先是募民及聽商賈入粟給劵於江淮給茶鹽償之謂之折中或有言其濫弊廢之自是歳失國用百萬之入故復之尋以歳旱中止淳化二年改折博倉商人甚便二年五月己巳復置折博倉即折中倉也景祐元年二月丙申命燕肅張宗象與三司議在京置折中倉利害初欲置折中倉以省江淮歳漕而多謂平糴京師則物價翔貴而傷民故令參議張方平言裏河折中倉是在京便糴以助軍儲漢武帝募民入粟縣官而内受錢於都内服䖍曰入榖於外縣受錢於内府淳化常平倉景徳天禧熈寜提舉常平淳化三年六月辛卯詔置常平倉命常參官領之歳熟増價以糴歳歉減價以糶用賑貧民復舊制也會要淳化三年六月詔京畿大穰物價至賤分遣使於京畿四門置場増價以糴令有司虚近倉以貯之命曰常平真宗景徳三年正月戚綸上封事請於京東西河北河東陜西淮南江南兩浙各置常平倉惟沿邊州郡不置以逐州户口多少量留上供錢一二萬貫小州或一二千貫付司農寺係帳三司不問出入委輸運司并本州選幕職州縣官清幹者一員專掌其事每年秋夏加錢收糴遇貴減價出糶以三年為界所有錢榖羨利止委本寺與掌祥符二年二月辛丑分遣使臣出常平倉粟麥於京城開八場減價糶之以平物價六月丙申内出司農寺上榖價以示宰臣六年又併兩赤縣倉入在京常平倉天禧元年詔災傷州以元糴價出糶四年八月詔益梓利䕫荆湖廣南路並置常平倉熈寧二年詔出内藏庫百萬緡分賜河北諸州増糴常平倉及陜西路遣官提舉四年十月十六日以帛七十萬匹為陜西常平糴本五年四月司農寺丞蔡天申請河東路諸經畧安撫使司亦置常平倉其條約並如陜西詔以麟府豐三州尤為貧乏宜如天申所請景祐元年詔漕臣舉所部官專領熈寜始遣使景祐四年八月甲午詔常平倉三司及轉運司毋得借支熈寧二年九月丁卯條例司言今諸路常平廣恵倉畧計千五百萬貫石先是常平倉米五十餘萬石而斂散之政廢三年五月司農寺請用見管封椿易發運司新米分貯諸倉隨時斂散以平市價如淳化舊法治平三年常平入五十萬一千四十八石出四十七萬一千五十七石志淳化恵民倉咸平福建恵民倉㑹要淳化五年十月令諸州恵民倉故榖遇糴稍貴減價糶與貧民人不過一斛咸平三年先詔所在缺食奏聞差官往糶深慮遲延自今止委知州通判幕職互監紀咸平二年十月戊午令福建路置恵民倉實録庫部員外郎成肅請於福建置恵民倉從之先是三司言福建不須置倉肅以逺俗尤宜存䘏故有是請丙寅詔令於諸路運司管内有恵民倉處當熟則増價以糴歉減價出之天禧四年於荆湖川陜廣南増置嘉祐廣恵倉祖宗以來天下户絶田皆估價以錢入官嘉祐二年樞宻使韓琦請罷鬻諸路户絶田募民承佃以夏秋所輸租課每年春夏以賑老幼貧疾十萬户以上萬石下不滿萬戸一千石一年數足依舊出賣從之詔天下置廣恵倉仍詔逐路提刑專領時數未足而官有出賣者侍御史陳經奏自八月二十三日以後更展五周不得出賣庶幾委積充峙實録嘉祐二年八月丁卯二十二日詔天下置廣恵倉歳給具所支納上三司四年二月乙亥詔三京諸州軍自今年終應户絶納官田土未賣者並撥𨽻廣恵倉詔三司以天下廣恵倉𨽻司農寺逐州幕職曹官各一員專監州選官二人主出納毎年十月分差官檢視老幼貧疾不能自存之人籍定姓名自次月一日人給米一升幼者半之三日一給至明年二月止有餘即量大小均給之熈寧二年九月丁卯九日遣官提舉河北浙西常平廣恵倉十一月乙亥諸道悉遣之四年正月壬辰詔鬻天下廣恵倉田為常平本六月王廣亷請以錢斛入常平倉從之元祐元年閏二月丙辰罷提舉常平官依舊常平倉法時天下免役坊場積羨餘五千餘萬緡榖帛二千八百餘萬石匹八月罷青苗元祐三年正月二日庚戌詔復置廣恵倉從侍講范祖禹之言也二月十二日給廣恵倉錢三萬緡紹聖元年九月十二日詔罷之閏四月二日復提舉常平官京師有東西福地院以收養老幼廢疾嘉祐八年又置城南北福田院共為四院熈寧修復社倉通畧熈寧二年正月初知齊州王廣淵唐州趙尚寛同州高賦奏置義倉乃詔三司講求修復社倉且圖經久之法使民樂輸而無擾至是廣淵以其法來上㑹知陳留縣蘓涓亦言臣領畿邑謹為天下倡勸百姓置義倉以備水旱戸口第一等出粟二石二等一石三等五斗四等二斗五等一斗麥亦如之村有社社有倉倉置守者耆為輸納縣為籍記歳豐則量數以輸歳凶則出停藏既久又為借貸之法使新陳相登多寡不一又為通融之法使彼相補上曰陳留輔邑聽行之徐訪利害元豐諸倉宋朝二十三倉四河運元豐元年七月二十五日丁酉提㸃在京倉塲所言在京諸倉名宜改易其延豐永濟廣積廣濟第一倉依舊名欲以延豐第二為元豐倉永濟第二為永豐倉廣積南倉為大盈倉廣濟倉為廣阜倉從之神宗正史職官志司農寺總倉二十有四哲宗史志云總倉二十有五當考㑹要京諸倉總二十三所凡受四河運至京師者謂之船般倉永豐通濟萬盈廣衍初通濟有四倉景徳四年改第三第四曰萬盈廣衍延豐舊曰廣利景徳中改祥符二年増第二順成舊曰常豐景徳中改濟逺舊曰常盈景徳中改富國太平興國中以迎春苑地為之十倉受江淮所運東河永濟永富二倉受懷孟二州所運西河廣濟第一倉受潁夀諸州所運南河廣積廣儲二倉受曹濮諸州所運北河其受京畿之租者曰稅倉京東界則廣濟第二倉受之京北界則廣積第一倉騏驥院天駟監倉受之京西界則左天廐坊倉受之舊有義倉祥符元年停京南界則大盈右天廐倉受之其受商人入中謂之折中倉其後倉名或更則所受小異漕運所㑹則有轉般倉自江南平歳漕米四百萬石給京師乃増廣倉舍選能吏掌出納副以内侍省倉以待廪賜而凶年又資以貸振建隆元年五月以租調委輸吏縁為奸乙巳始擇廷臣王伸等八人分掌京庾二年十二月辛丑幸新脩河倉汴都賦永豐萬盈廣儲折中順成富國星列而棋布其中有元山之禾清流之稻中原之菽利髙之黍利下之稌有穈有芑有秠有秬如坻如京如岡如阜皇畿賦天設二渠曰蔡曰汴通江㑹海縈畿帶甸千倉是興萬庾是建杜預主計劉晏司漕何貢何輸吳秔楚稻月致百萬猶責其少漢之太倉積粟紅腐使彼粒而計之未及我斗量之數成王之庾萬箱以供未若我千艘徃來運江淮而無窮備九年之儲充六軍之給當津處要山積雲入者復有五邑紹興省倉豐儲倉紹興十一年六月癸酉分行在省倉為三界界百五十萬斛白米南倉受之以廪宗室百官為上界次米北倉受之以給衛士五軍為中界糙米東倉受之以備諸軍月糧為下界二十六年夏四月戊戌始置豐儲倉以百萬石為額戸部尚書韓仲通言乾道社倉乾道四年戊子建人大饑朱熹居崇安請于郡得粟六百萬斛賑民是冬有年民願以粟償官因留里中而上其籍于府明年夏又請倣古法為社倉以儲之歳一斂散既以紓民之急又得易新以藏俾願貸者出息什二歳小饑則㢮半息大侵則盡蠲之為倉三經始於七年五月而成於八月既成熹為之記淳熈八年熹將詣左淛取崇安已行事宜抗奏于朝乞推而頒之諸道十一月二十八日命户部看詳十二月二十二日從其請自是婺越鎮江建昌袁潭諸邑多行之成周之制縣都皆有委積以待凶荒而隋唐所謂社倉者亦近古良法也今皆廢矣獨常平義倉尚有古法之遺意然皆藏於州縣為法太宻吏視民之殍而不肯發累數十年不一訾省不獲已發之已化為浮埃聚壤而不可食矣是倉也處於諸邑之里社主於鄉曲之士君子斂散有經維持有要即此鄉之粟活此鄉之民脫遇阻饑朝取暮獲讀周禮旅師遺人之官觀其頒斂之疏數委積之逺邇為之制數甚詳且宻聖人既竭心思繼之以不忍人之政其不可及如此常平義倉二法雖始于漢建于隋唐其意則唐虞三代不易之美國朝盛時府界諸路所積幾千五百萬斛玉海卷一百八十四
