body:
  text: 玉海卷八十四宋王應麟撰車服印璽綬漢髙帝紀應劭注曰古者印璽尊卑共之諸侯大夫印亦稱璽月令固封璽左傳璽書追而與之戰國䇿欲璽者段干子禮璽節秦紀御璽事始曰史記蘇秦佩六國印人臣賜印始於秦通典以為三代之制人臣皆以金玉為印龍虎鈕秦始皇得和璧命丞相李斯篆為傳國璽故天子稱玉璽黄帝符璽河圖舜以太尉即位與三公臨觀于河黄龍五采負圖出置舜前黄金柙白玉檢黄金繩黄芝泥章曰黄帝符璽事始春秋運斗樞曰黄帝時黄龍負圖中有璽章文曰天黄符璽湯璽唐六典注周書曰湯放桀大㑹諸侯取璽置天子之坐周璽節禮掌節貨賄用璽節注今之印章也詳見符節類漢印綬百官表相國丞相太尉秦官金印紫綬髙帝即位置一丞相十一年更名相國緑綬御史大夫秦官銀印青綬太傅太師太保前後左右將軍金印紫綬諸侯王髙帝初置金璽盭綬晋灼曰盭草名出琅邪平昌縣似艾可染緑因以為綬名師古曰璽之言信也古者印璽通名今則尊卑有别漢舊儀云諸侯王黄金璽橐佗紐文曰璽謂刻云某王之璽徹侯金印紫綬避武帝諱曰通侯或曰列侯凡吏秩比二千石以上皆銀印青綬師古曰漢舊儀云銀印背龜鈕其文曰章謂刻曰某官之章也光禄大夫無秩比六百石以上皆銅印墨綬大夫博士御史謁者郎無其僕射御史治書尚符璽者有印綬比二百石以上皆銅印黄綬漢舊儀云六百石四百石至二百石以上皆銅印鼻鈕文曰印謂鈕但作鼻不為蟲獸之形而刻文云某官之印綏和元年長相皆黒綬建平二年復黄綬漢官儀曰孝武元狩四年令通官印五分王公侯金二千石銀千石以下銅續志乘輿黄赤綬四采黄赤紺縹淳黄圭長丈九尺九寸五百首諸侯王赤綬四采徐廣曰太子及諸王金印龜紐纁朱綬太皇太后皇太后皇后綬與乘輿同相國緑綬三采公侯將軍紫綬二采漢官儀馬防為車騎將軍銀印青綬在卿上絶席竇憲始加金紫次司空公主封君服紫綬長公主與諸侯王同九卿中二千石二千石青綬三采一號青緺綬與自青綬以上縌皆長三尺二寸綬同采而首半之縌者古佩璲也紫綬以上縌綬之間得施玉環鐍千石六百石黒綬三采四百石三百石長同四百石三百石二百石黄綬一采自黒綬以下縌綬皆長三尺百石青紺綬一采注東觀書建武元年復設諸侯王金璽綟綬公侯金印紫綬九卿至二千石銀印青綬中外官尚書令至四百石銅印黒綬諸舎長至丞尉校長銅印黄綬漢舊儀六百石至二百石銅印鼻紐文曰印其斷獄者印為章漢官儀曰尚書僕射銅印青綬子百官志大鴻臚皇拜王賛授印綬前傳趙堯髙祖持御史大夫印弄之曰誰可以為御史大夫者周勃謝請歸相印朱買臣拜㑹稽太守懐其印綬步歸郡邸少見其綬守邸前引其綬視其印㑹稽太守章也東郭先生佩青緺綬楊僕懐銀黄垂三組金賞嗣侯佩兩綬朱博敕告吏民欲言縣丞尉者刺史不察黄綬各自詣郡欲言二千石墨綬長吏者行部還詣治所揚雄解嘲紆青拕紫注謂綬之色孔光拜相刻侯印書賛西域傳凡國五十自譯長城長君監吏大禄百長千長都尉且渠當户將相至侯王皆佩漢印綬凡三百七十六人南粤傳髙皇帝幸賜臣佗璽以為南粤王使為外臣時内貢職天子賜其丞相銀印及内史中尉太傅印嚴助傳淮南王安上書曰以方寸之印丈二之組填撫方外烏孫傳都護韓宣奏烏孫大吏大禄大監賜金印紫綬匈奴傳漢賜單于印言璽不言章後傳董宣以嘗為二千石賜艾綬馮石賜紫艾綬仲長統昌言身無半通青綸之命注十三州志曰有秩嗇夫得假半章印張衡綬笥銘服其令服鸞封艾緍捜神記張顥為梁相得金印文曰忠孝侯印議郎樊衡上言堯舜時舊有此官風俗通馮緄為議郎發綬笥有二赤蛇卜曰當為邊將說文漢律曰綬組謂之首揚子五兩之綸半通之銅通典後漢封禪尚書令以五寸印封石檢志同記緇衣注綸令有秩嗇夫所佩也禮秋官疏先鄭引漢法墨綬為貴太元經龜緺漢乘輿六璽傳國璽三璽建武受傳國璽續志乘輿黄赤綬注漢舊儀曰璽皆白玉螭虎紐文曰皇帝行璽皇帝之璽皇帝信璽天子行璽天子之璽天子信璽凡六璽皇帝行璽凡封之璽賜諸侯書信璽發兵召大臣天子行璽策拜外國事天地􅀑神璽皆以武都紫泥封青囊素裏尺一板璽以金銀縢組侍中組負以從虞喜曰六璽殊名與傳國為七霍光傳召符璽郎取璽郎不與光壯之増秩二等周有典瑞掌節秦有符璽令漢有符節令領符璽郎趙堯為符璽御史昌邑王受皇帝信璽行璽就次發璽不封注孟康曰漢初有三璽天子之璽自佩行璽信璽在符節臺元后傳髙祖入咸陽至霸上秦王子嬰降於軹道奉上始皇璽漢元年冬十月秦王子嬰封皇帝璽降及髙祖即天子位因御服其璽世世傳受號漢傳國璽光武紀建武三年閏正月丙午赤眉奉髙皇帝璽綬時帝幸宜陽二月己未祠髙廟受傳國璽晉志乘輿六璽秦制也曰皇帝行璽之璽信璽天子行璽之璽信璽漢遵而不改秦藍田玉璽螭虎紐在六璽外漢髙祖佩之後世名為傳國璽與斬蛇劍俱為乘輿所寳虞喜志林曰傳國璽在六璽外凡七璽唐六典注徐令言玉璽記曰傳國璽秦始皇取藍田玉刻之其書李斯制面文曰受命于天既夀永昌續志注徐廣曰傳國璽文曰受天之命皇帝夀昌璽上隠起為盤龍文文曰受天之命皇帝夀昌方四寸紐五龍盤漢元后投於地遂一角缺公賔就上更始盆子降上光武吳書曰漢亂六璽不自隨掌璽者投井中孫堅入洛甄官井上旦有五色氣入井探得漢傳國璽方圍四寸上有紐文盤五龍瑨七寸管龍上一角缺兩漢皆傳秦六璽及傳國璽袁術奪之徐璆得璽還許上之𫝊魏至晉懐璽沒于劉聦𫝊石勒季龍又刻曰天命石氏冉閔敗蔣幹以送建業永和八年八月也晉紀永和八年八月冉閔子智以鄴降督䕶戴施獲其傳國璽送之文曰受天之命皇帝夀昌百僚畢賀慕容廆獲皇帝玉璽三紐遣長史裴嶷送建鄴歴宋齊梁為侯景所得陳永定三年得之又傳隋西京雜記中書以武都紫泥為璽室加緑綈其上蔡邕獨斷天子六璽東京賦冠通天佩玉璽祭祀志封禪用玉璽一寸二分一枚方五寸尚書令奉玉牒檢皇帝以璽封之漢列侯印髙紀十二年三月詔為列侯食邑者皆佩之印賜大第室東平王蒼傳永平十一年正月來朝月餘還國帝懐思乃遣使手詔國中傅曰日者問東平處家何等最樂王言為善最樂其言甚大今送列侯印十九枚諸子年五嵗以上能趨拜者皆令帶之地理志汝南郡滇陽注闞駰云永平五年失印更刻遂誤以水為心漢大將軍印衛青傳元朔五年春令青將三萬騎出髙闕圍右賢王得右賢禆王十餘人還至塞天子使使者持大将軍印即軍中拜青為大将軍諸将皆以兵屬立號而歸韓信曰漢王授我上将軍印景帝賜汝南王非將軍印擊吴漢乘輿雙印靈殳輿服志佩雙印長寸二分方六分一本云方七分乘輿諸侯王公列侯以白玉中二千石至四百石皆以黒犀三百石以下皆以象牙上合絲乘輿以縢貫白珠赤罽㽔諸侯王以下以綔赤絲㽔縢綔各如其印質刻書文曰正月剛卯既决靈殳四方赤青白黄四色是當帝令祝融以教䕫龍疾日嚴卯帝令䕫龍謹爾周伏化兹靈殳既正既直既觚既方庻疫剛癉莫我敢當凡六十六字王莽傳劉之為字卯金刀也正月剛卯金刀之利皆不得行注服䖍曰則卯以正月卯日作佩之長三寸廣一寸四方或用玉或用金或用桃著革帶佩之韓詩外傳齊桓公出遊遇一丈夫帶著桃殳問之曰人之戒在桃殳來年正月庻人皆佩晉灼曰刻其上面作兩行書云云師古曰今徃徃有土中得玉剛卯者漢正郡國印章馬援傳建武十七年璽書拜伏波將軍注東觀記曰援上書臣所假伏波將軍印書伏字犬外嚮城臯令印臯字為白下羊丞印四下羊尉印白下人人下羊即一縣長吏印文不同恐天下不正者多符印所以為信也所宜齊同薦曉古文字者事下大司空正郡國印章奏可周禮璽節注今之印章也武紀太初元年五月正厯數用五注張晏曰用五謂印文也若丞相曰丞相之印章郊祀志官更印章以五字漢斗檢封周禮司市注璽節印章如今斗檢封矣疏案漢法斗檢封其形方上有封檢其内有書則周時印章上書其物識事而已蜀漢玉璽蜀志關侯圍樊襄陽襄陽男子張嘉王休獻玉璽璽潜漢水伏於淵泉暉景燭燿靈光徹天魏玉璽璧玉印晉志魏太和元年四月洛邑初營宗廟掘地得玉璽方二寸九分其文曰天子羡思慈親明帝為之改容以太牢告廟魏志咸熈元年六月衛瓘至成都得璧玉印文似成信字宣示百官藏于相國府晉神璽鎮璽元帝紀白玉麒麟神璽出於江寕其文曰長夀萬年以為中興之象唐六典注晉陽秋云孝武太元十九年八月西燕慕容永遣子𢎞求救于雍州刺史郗恢獻玉璽一紐方六寸厚一寸七分髙四寸六分與傳國璽同送建業自晉至梁相傳謂之鎮璽及侯景敗侍中趙思齊接以渡江郭元建送于齊傳周隋隋文帝初亦謂之傳國璽開皇二年五月甲子改為受命璽九年平陳得真傳國璽乃改前璽名神璽至大業初著之于令晉玉璽白麒麟璽元帝紀太興三年三月慕容廆奉送玉璽三紐四年春二月鮮卑末波奉送皇帝信璽庚戌告于太廟乃受之穆帝紀永和八年八月冉閔子智以鄴降督䕶戴施獲其傳國璽送之文曰受天之命皇帝壽昌百僚畢賀通鑑云謝尚自枋頭迎至建康宋符瑞志晉建武元年三月己酉丹陽江寜民虞由墾土得白麒麟璽一紐文曰長夀萬年獻晉王宋紀晉義熙十三年九月平長安先收其彛器及秦始皇玉璽元魏太平真君七年四月戊子鄴城得玉璽二其文皆曰受命於天既夀永昌其一刻其旁曰魏所受漢傳國璽西魏大統三年槐里獲神璽大赦晉金璽輿服志皇太子金璽龜紐朱黄綬三夫人金章紫綬九嬪銀印青綬皇太子妃金璽龜紐纁朱綬漢制皇后金璽宋志吳無刻玉工以金為璽六枚晉印龜孔愉傳封餘不亭侯鑄侯印而印龜左顧三鑄如初初愉嘗行經餘不亭見籠龜於路者愉買而放之溪中龜中流左顧者數四至是鑄印而龜左顧宋孔琳之傳曰傳國之璽歴代迭用襲封之印奕世相傳今世唯尉一職獨用一印至内外羣臣每遷悉改謂即用一印無煩改作晉朱綬後漢輿服志注荀綽晉百官表注曰皇太子朱綬三百二十首許曼傳隴西太守馮緄始拜郡開綬笥有兩赤蛇分南北走曼筮之曰當為邊將唐八寶七寶六寶神璽受命元璽承天大寶傳國璽符寶郎寳書車服志天子有傳國璽及八璽皆玉為之神璽以鎮中國受命璽以封禪禮神皇帝行璽以報王公書皇帝之璽以勞王公皇帝信璽以召王公天子行璽以報四方書天子之璽以勞四夷天子信璽以召兵四夷皆泥封大朝㑹則符璽郎進神璽受命璽于御座行幸則合八璽為五轝函封從于黄鉞車之内通典㑹要作八寶儀衛志大駕符寶郎奉六寶百官志門下省符寶郎四人從六品上李安期延壽為符璽郎掌天子八寶及國之符節有事則請於内既事則奉而藏之大朝㑹奉寶進于御座行幸奉以從大事出符則藏其左而班其右以合中外之契兼以敕書小事降符函封使合而行之命將遣使皆請旌節㑹要符璽郎延載元年五月十一日改為符寶郎神龍元年正月二十二日復為符璽郎開元元年十二月十日改符寳郎紀武后垂拱四年六月壬寅作神皇三璽長夀二年九月乙未作金輪等七寶傳云置七寶于廷大朝㑹則陳之元宗開元六年十一月乙巳改傳國璽曰寶㑹要貞觀十六年太宗刻受命𤣥璽以白玉為螭首神筆𨽻書實録云𨽻書然後鐫勒文曰皇天景命有徳者昌車服志同受㑹要拜郊類作命𤣥玉璽十七年十一月十三日己卯南郊侍中負受命𤣥璽以從天寶五載六月十一日改璽書為寶書十載正月十五日改傳國寶為承天大寶車服志同六典注武徳四年克平東夏五月壬申裴矩奉傳國璽及神璽六璽以獻云云通典後周皇帝八璽有神璽傳國璽皆寶而不用其六璽因舊制隋因之唐貞觀十六年太宗刻受命璽云云長夀二年改為寳神龍元年復為璽志開元六年復為寳天寶十載改傳國寶為承天大寶天子之寶八云云同志官志禮部郎中掌符印内官有司寶二人掌神寶受命寶六寶及符契侍中行幸則負寶以從中書舍人璽書册命皆起草李吉甫傳建言軍國大事以寶書易墨詔梁肅受命寶賦序曰鼎之輕重與璽之去留莫不視徳之髙下位之安危若以負扆之尊被竊鈇之言此片玉耳復何為哉六合大同之印肅宗靈武召兵所用貞觀開元印見小學類車服志皇太子璽金為之藏而不用皇太子以左春坊印封令書官志中書令册太子則授璽綬武德七年陜州獲白石璽一紐章與傳國璽同乾元元年七月庚寅朔方節度郭子儀奏東京上陽西金華門外仗下得天子信璽一皆篆書背上雕刻龍獸雀武相盤以為帝徳廣運乾道降祥璿圗永昌坤維耀寳請宣示朝廷貞元元年十一月京兆奏有人於長興坊得玉璽文曰天子信璽中書門下表賀唐黄金印詳見錫予外夷類㑹要貞元十年七月詔賜南詔蠻異牟尋鑄印一用黄金銀為窠其文曰貞元册南詔印先是劒南西川節度韋臯奏南詔前遣清平官尹求寛獻所授吐蕃印五二用黄金今賜印請以黄金從蠻夷所重從之漢賜單于黄金璽印文曰匈奴單于璽賜烏孫金印唐兩省印㑹要建中三年六月詔中書門下兩省各置印長慶三年八月鑄御史臺行從印二出使印二太宗皇帝承天受命寶雍熙書詔寶真宗皇帝恭膺天命寶志舊制乘輿六璽又有傳國璽唐改為寶有八周廣順三年二月始造二寶其文曰皇帝承天受命寶皇帝神寶一本云更作二寶方六寸螭虎紐太祖受禪傳二寶太宗又别製承天受命之寶真宗復制恭膺天命之寶至道三年十一月二十日辛巳真宗即位製之年仁宗乾興元年三月庚午朔復製王曽書之明道元九月重作凡嗣位則更製渡江後不復作凡寶用玉篆文廣四寸九分厚一寸二分填以金盤龍紐係以暈錦大綬赤小綬連玉環玉檢髙七寸廣二寸四分厚四分皆飾金裹以紅錦加紅羅泥金夾帊納於盝祥符登封别製寶盝差小又盝二重裝以金覆以繡帊載以腰輿及行馬並飾以金朝㑹陳於御座前大禮列於仗衛每上尊號有司製玉寶以尊號為文禁中所用别有三印曰天下合同印中書奏覆狀用之曰御前印樞宻院宣命及諸司奏状用之曰書詔印翰林詔敕别錄敕牓用之鑄以金雍熙三年一云三年十月十一日丙午改三印為寶别鑄淳化賜諸王印章淳化五年四月壬午朔賜諸王印章先是親王皆兼領兩鎮詔有司合其名鑄為印一紐賜之至道元年八月鑄左右春坊印紹興三十二年九月十四日鑄皇子鄧慶恭三王印至道玉璽記傳譜唐志儀注類紀僧真玉璽譜一卷姚察傳國璽十卷徐令言玉璽正録一卷六典注有徐令言玉璽記書目玉璽譜一卷博陵崔逢修嚴士元重修皇朝魏損潤色叙秦傳國璽歴代傳授得失本末迄于乾徳五年至道中鄭文寶為玉璽記一卷首圗璽文次載傳授本末仁宗朝晏殊進玉璽傳記及梁肅受命寶賦名傳一卷不載撰人氏秦璽者李斯之魚蟲篆也其圍四寸至漢謂之傳國璽迄于獻帝所寶用者秦璽也歴代皆用其名永嘉之亂沒于劉石永和之世復歸江左者晋璽也晉有天下自刻璽其文曰受命于天皇帝夀昌本書與輿服志以為秦璽誤矣太元之末得自西燕更涉六朝至于隋代者慕容燕璽也隋更謂之神璽劉􅁉北伐得之闗中歴晉暨陳復為隋有者姚秦璽也文與秦同開運之亂没于耶律女真獲之以為大寶者石晉璽也唐璽亡於從珂天福三年七月以受天明命惟徳允昌為文四年製皇帝神寶盖在當時皆誤以為秦璽而秦璽之亡則已乆矣紹聖三年冬咸陽民段義得璽議者以為秦璽受寶之禮昉于此至道皇太子册寶天禧皇太子册寶乾道皇太子册寶至道元年八月二十一日命賈黄中撰册文王旦吕祐之書册寶二十三日丁酉門下省言按開元禮儀册太子寶以黄金為之方一寸又按隋志皇太子寶龜紐文曰皇太子寶方二寸厚五寸係以朱組大綬連玉環金檢髙五寸闊二寸厚二分天禧二年八月二十八日丁巳禮儀院言册太子奏明安之曲中書省言舊制皇太子册用珉玉簡六十枚前後四枚刻龍填金為捧䕶之狀貫以金絲結以金花飾以帉𤭔襯以泥金夾帕藉以錦褥盛以黝漆柙長九尺五寸濶尺二寸髙八寸飾以螭首今請用珉玉簡七十五枚漆匣裝以金鏤銀花鳳葉加以腰輿行馬飾以金鳳絛以魚鈎竿為螭首從之九月七日以冊寶進内乾道元年八月十四日詔簽書樞宻院葉顒篆皇太子寶十七日依舊制造册寳七年二月同祥符天下同文寶封禪玉寶金寶祥符元年五月五日甲子别制天下同文寶以金鑄用於封禪以封石䃭朝謁大清宫祀汾隂封册匱亦用之祥符元年五月甲子詳定所言唐開元中玉匱金匱封訖以受命寶印之又貞觀中議更造玉璽一方一寸二分同受命寶今請别造玉寶方寸二分同受命寶以封金玉匱又開元中石䃭以天下同文印封之舊史無制度今請以金鑄大小同御前寶以天下同文之寶為文二寶封畢進内其玉寶分寸以今尺為凖從之甲申命參知政事馮拯書封禪玉寶金寶祥符龍圗閣印祥符二年三月乙闕鑄龍圖閣印文曰龍圖閣御書記天禧昭受乾符寳慶厯欽崇國祀寶天禧元年十二月壬闕召輔臣於滋福殿觀新刻皇帝昭受乾符之寶金闕制闕鉅妙初祭醮祠表皆用御前之寶上以未盡恭恪故改製焉用以印宻詞後大内火寳焚止用御前之寳慶厯八年下學士院定其文而别刻之十一月己亥三日詔刻皇帝欽崇國祀之寳宰臣陳執中書以代昭受乾符之寳醮祠表章用之天禧四年閏十二月己巳編御集朱允中等言御製書印三請用金鑄從之天禧玉印天禧元年七月秦州奏檀州軍士王貴自云得于闐玉印一以獻文曰國王趙萬永寳元魏孝昌中得古玉印祖瑩曰此于闐國王晉太康中所獻明道改作寳册明道元年禁中火寳册悉焚九月庚寅改作寳及册命參政陳堯佐書受命寳薛奎書尊號册寳宰臣張士遜書仁宗為皇太子册參政晏殊書皇太后册寳二年正月成㳂寳法物易以銀而塗黄金景祐鑄印令式元豐三省銀印景祐三年正月篆文王文盛請于少府監更鑄糧料院印又言舊制親王中書印各方二寸一分樞宻宣徽三司尚書省開封府方二寸節度使寸九分留後觀察使寸八分半防禦團練使轉運使州縣印寸八分凡印各上下寸七分闊寸六分雖有差降而無令式以紀其數詔從其言著于令志無月日治平三年命知制誥邵必殿中丞蘇唐卿詳定天下印文二人通篆籀尋復廢罷無所釐改先是乾徳三年九月二十八日乙未重鑄中書門下樞宻院三司使印初五代所鑄篆刻非工至是蜀鑄印官祝温柔言其祖思言唐禮部鑄印官世習繆篆漢藝文志所謂屈曲纒繞以摹印章者也自是臺省寺監及開封興元尹印悉令温柔改鑄咸平三年十一月三十日鑄東京留守印景徳二年七月庚申判刑部慎從吉言門下省等五十四司印文皆有新鑄字望改鑄從之三年七月壬戌鑄尚書内省出納印初用御寶至是改鑄三朝志諸王及中書門下印方二寸一分樞宻宣徽三司尚書省諸司印方二寸惟尚書省印不塗金餘皆塗金節度使印方一寸九分塗金元豐四年十月庚辰詔三省印銀鑄金塗給事中印為門下外省印舍人印為中書外省印建炎三年七月丁酉鑄三省樞宻院銀印紹興二年三月十日重鑄紹興經筵之印中興重鑄加行在二字或冠年號以别新舊乾道二年四月十一日禮部請郡縣假借印記者悉毀而更鑄從之三年十二月四日鑄三省户房國用司印皇祐鎮國神寶皇祐五年七月十四日辛亥作鎮國神寶先是帝謂大臣曰奉宸庫有良玉廣尺而厚半之希代之珍也且天子八璽其一曰神寶遂命參政梁適撰寶名宰臣龐籍瑑文參政劉沆書牌而刻之八月丁丑更命宰臣陳執中篆文十月壬子寶成召近臣宗室觀于延和殿癸亥禮院言唐六典次序一曰神寶二曰受命寶冬至郊祀大駕儀仗請以鎮國神寶先受命寶為前導著為式嘉祐八年四月乙酉英宗製恭膺天命之寶命參政歐陽修篆文元符二年八月四日製寶符旗二皇祐崇政殿觀寶册皇祐五年十月二十九日召輔臣兩制學士待制崇政殿觀寶册嘉祐八年十月三日翰林學士范鎮言帝后尊號册寶皇太子册與諡册寶同置廟室請别置殿以藏禮院請度太廟神門外建殿從之至和玉寶至和二年七月五日辛酉皇姪從式上其祖徳芳所藏玉寶二篆文曰皇帝信璽蓋太宗所賜元符玉璽治平玉檢紹聖三年咸陽縣民叚義得古玉印四年十二月上之五年即元符元年三月講議官十三人奏按其文曰受命于天既壽永昌又得玉螭首一其玉乃藍田之色青玉色如藍其篆與李斯小篆體合飾以龍鳯鳥魚五月戊申朔御大慶殿行受寳禮羣臣上夀稱賀先期又詔龍圗天章閣齎治平元年閏五月二日耀州所獻受命寳玉檢赴都堂參驗命宰臣書玉檢以天授傳國受命之寶為文志曰紹聖得玉璽有議政和獲𤣥圭有議徽宗黜其璽不用自作受命寶方四寸有竒自為之記書目李公麟古器圖一卷圖所藏器物志所從得而叙釋之又為序贊各一首又圗紹聖四年咸陽得玉璽并所進辯議文于後大觀八寶九寶神宗是正典禮詔侍臣作天子皇帝六璽追琢未就崇寜五年有獻玉印方寸者以龜為紐其文曰承天福延萬億永無極遂以九字為文命工更刻螭紐方盤上圓下方名為鎮國寶又作受命寶皆方四寸有竒篆以蟲魚帝自為記并元豐六璽通為八寳鎮國受命二寶寶而不用藏之内府詔曰獲全玉於異域得妙工於編氓大觀元年遂黜皇祐鎮國元符受命二寶不用二年正月壬子朔御大慶殿受八寶置符寶郎四員𨽻門下省二員以中人掌寶於禁中内外各二員親製八寶九鼎記後又從于闐得大玉踰二尺又制定命寶赤螭紐文曰範圍天地幽賛神明保合太和萬夀無疆篆以魚蟲其寳九寸檢亦如之合前八寶為九以九寳為稱乾元用九之義政和八年正月甲申朔受定命寶皆赦天下宣和四年十一月丙辰朔修飾舊寶璽用之郊禋則輦官奉寶輿導駕九寶為五重前列香案定命受命及天子寶在左鎮國及皇帝寶在右行禮則陳於宫架之前紹興受命中興寶八寶十一寳三御寳靖康二年四月丁卯謝克家奉玉璽至大元帥府文曰大宋受命之寶紹興元年五月八日癸卯内殿宣示大宋受命中興之寳視定命寶猶大半分玉甚明潤追琢精巧是嵗宗祀不陳八寶十六年始陳於郊祀如舊儀二十八年宗祀亦設之乾道初郊復詔省約及皇太子受册符寳郎陳八寶于御坐之左右紹熈二年禮官以八寶非奉神之物請遵乾道省約之制中興御府藏玉寶十有一一曰鎮國神寶文曰承天福延萬億永無極二曰受命寶文曰受命于天既夀永昌二寶封禪用之三曰天子之寳荅外夷書用之四曰天子信寳舉大兵用之五曰天子行寳封册用之六曰皇帝之寶荅隣國書用之七曰皇帝信寳賜隣國書及物用之八曰皇帝行寶降御劄用之所謂八寶也皆髙宗作紹興十六年再郊始備八寶九曰大宋受命之寳太祖作十曰定命寳徽宗作十一曰大宋受命中興之寳髙宗紹興元年作金寳三皆建炎二年秋所作一曰皇帝欽崇國祀之寳印香合祠表二曰天下合同之寳印中書門下省文字三曰書詔之寳印詔書天建炎二年八月甲寅新鑄欽崇國祀下合同書詔之寳自是月乙卯行用紹興尊號册寶天聖二年皇太后玉寳方四寸九分厚一寸二分龍紐元祐元年十二月丙午中書省言太皇太后同此制皇太后太妃並金寳紹興十年奉上慈寧殿册寳三十二年七月朔孝宗詔製太上皇帝尊號册寳册用珉玉簡長尺二寸聮以金繩刻龍鏤金玉寶方四寸九分填以金盤龍紐係以錦大綬太上皇后册寳參用慈寜之制乾道七年正月淳熙二年十二年加上尊號册寳紹熙元年慶元二年上壽皇太上册寳詳見册禮類嘉定大慶殿受寳嘉定十四年京東河北節制使賈涉繳進北方大将撲鹿花所獻皇帝恭膺天命之寳及元符三年御府寳圗一册鎮江都統翟朝宗以玉檢來上其文若合符契又得受命于天既夀永昌玉璽七月丁亥太常奏受寳之禮製寳輿法物十一月詔曰朕觀前代宜陽受瑞江寜闡珍猶能洪濟大業今朕曷敢不承閏十二月丙午奏獻宗廟以内臣為内符寶郎十五年正月庚戌朔御大慶殿設黄麾半仗受玉寳奉安天章閣己未大赦十六年七月置奉安符寳所建殿以内臣掌之後漢李尤有印銘胡廣有印衣銘晉傅𤣥印銘曰乃設印章作信萬國唐咸陽獲寳符賦玉鈕惟舊芝泥尚新螭文外發鳥篆中陳五代史臣曰國以玉璽為傳授神器遂古無聞運斗樞曰舜為天子黄龍受璽世本曰魯昭公始作璽秦兼七國稱皇帝李斯取藍田之玉玉工孫壽刻之方四寸斯為大篆書文之形制如魚龍鳯鳥之狀希世之至寶也玉海卷八十四
