body:
  text: 玉海卷二宋王應麟撰天文天文書上易曰天垂象見吉凶聖人象之釋者謂若璿璣玉衡以齊七政後世作天文之書區區於灾異休祥之驗者末矣夾漈鄭氏謂不言祥異是深知天者包犧周天厯度周髀筭經昔者周公問於商髙曰竊聞乎大夫善數也請問古者包犧立周天厯度注云建章蔀之法易曰包犧仰則觀象于天俯則觀法于地八漢厯志自伏戲畫卦由數起夫天不可階而升地不可得尺寸而度請問數安從出商髙曰數之法出于圓方注圓方者天地之形隂陽之數圓出於方方出於矩矩出於九九八十一故折矩以為句廣三股修四徑隅五既方之外半其一矩環而共盤得成三四五兩矩共長二十有五是謂積矩故禹之所以治天下者此數之所生也注禹望山川之形定髙下之勢周公曰大哉言數請問用矩之道商髙曰平矩以正繩偃矩以望髙覆矩以測深卧矩以知逺環矩以為圎合矩以為方方屬地圓屬天天圎地方注北極之下髙人所居六萬里滂沱四隤而下天之中央亦髙四旁六萬里是為形狀同歸而不殊途隆髙齊軌而易以陳故曰天似盖笠地法覆槃方數為典以方出圎笠以寫天天青黒地黄赤天數之為笠也青黑為表丹黄為裏以象天地之位是故知地者智知天者聖智出于句句出於矩夫矩之於數其裁制萬物惟所為耳周公曰善哉榮方曰周髀者何陳子曰古時天子治周此數望之從周故曰周髀注周都河南為四方之中髀者表也凡為日月運行之圎周七衡周而六間以當六月節六月為百八十二日八分日之五故日夏至在東井極内衡日冬至在牽牛極外衡也衡復更終冬至故曰一嵗三百六十五日四分日之一嵗一内極一外極三十日十六分日之七月一外極一内極天離地八萬里冬至之日雖在外衡常出極下地上二萬里古者包犧神農制作為厯度元之始見三光未如其則日月列星未有分度日主晝月主夜晝夜為一日日月俱起建星建六星在斗上日月起建星謂十一月朔旦冬至日也為厯術者度起牽牛前五度則建星其近也月度疾日度遲日月相逐於二十九日三十日間而日行天二十九度餘未有定分於是三百六十五日南極影長明日反短以嵗終日影反長故知之三百六十五日者三三百六十六日者一故知一嵗三百六十五日四分日之一嵗終也月積後天十三周又與百三十四度餘無慮後天十三度十九分度之七未有定於是日行天七十六周月行天千一十六周及合於建星趙君卿序云渾天有靈憲之文盖天有周髀之法累代存之官司是掌數術記遺注藝經曰捐悶者周公作也先本位以十二時相從周月令疏鄭注四逰之極出周髀之文隋志天文有髀一卷趙嬰注一卷甄鸞重述周髀圖一卷晉天文志蔡邕所謂周髀者即盖天之説也其本庖犧氏立周天厯度其所𫝊則周公受於殷商周人志之故曰周髀髀股也股者表也其言天似盖笠地法覆槃天地各中髙外下北極之下為天地之中其地最髙而滂沲四隤三光隠映以為晝夜天中髙於外衡冬至日之所在六萬里北極下地髙于外衡下地亦六萬里外衡髙於北極下地二萬里天地隆髙相從日去地常八萬里日麗天而平轉分冬夏之間日前行道為七衡六間每衡周經里數各依算術用句股重差推晷影極游以為逺近之數皆得於表股故曰周髀事類賦注劉氏厯正問曰説云顓頊造渾儀黄帝為盖天皆以天象盖也黄帝星𫝊星官書河圖五星占星經續漢志庖犧氏仰則觀象於天謂日月星辰俯則觀法於地謂水土州分形成於下象見於上天者北辰星合元垂燿建帝形運機授度張百精三階九列二十七大夫八十一元士斗衡太微攝提之屬百二十官二十八宿各布列下應十二子天地設位星辰之象備矣三皇邁化協神醇朴謂五星如連珠日月若合璧化由自然民不犯慝至於書契之興五帝是作黄帝始受河圗鬬苞授規日月星辰之象故星官之書自黄帝始至髙陽氏重黎唐虞羲和夏有昆吾湯則巫咸周之史佚萇𢎞宋之子韋楚之唐蔑魯之梓慎鄭之禆竈魏石申夫齊國甘公皆掌天文之官仰占俯視以佐時政歩變擿微通洞宻至秦燔詩書星官之書全而不毁劉昭補注引黄帝占者六黄帝星經者十又引黄帝星占河圗雒書晉志三皇邁徳七曜順軌黄帝創受河圗始明休咎故其星𫝊尚有存焉髙陽命重司天黎司地爰洎帝嚳式序三辰唐虞則羲和繼軌有夏則昆吾紹徳年代緜邈文籍靡傳至殷之巫咸周之史佚格言遺記于今不朽其諸侯之史則魯有梓慎晉有卜偃鄭有裨竈宋有子韋漢志隂陽家司星子韋三篇齊有甘徳楚有唐蔑趙有尹臯魏有石申夫皆掌著天文各論圗驗其巫咸甘石之説後代所宗暴秦燔書天官星占存而不毁葛洪釋渾天引黄帝書曰天在地外水在天外水浮天而載地又引黄帝占參應上將河圗云嵗星之精流為天棓車區占星氣隋志昔者滎河獻錄温洛呈圗六爻摛範三光宛備則星官之書自黄帝始劉智云黄帝為盖天經籍志黄帝五星占一卷史記黄帝考定星厯旁羅日月星辰外紀黄帝受河圗見日月星辰之象始有星官之書周禮馮相氏疏黄帝占云天道有三黄道者日月五星所乗大宗伯疏案武陵太守星𫝊髙允按星𫝊金水二星附日而行班固天文志引星傳曰日者徳也月者刑也又曰客星守招揺蠻夷有亂又引月南入牽牛南戒月入畢五行志劉向以為星傳曰心大星天王也其前星太子後星庶子也唐一行按星𫝊南戒北戒㑹要至和元年七月二十二日楊惟徳言客星見微有光采黄色按黄帝掌握占云客星來犯畢明盛者主國有大賢詔送史館太平御覽引黄帝占書黄帝風經河圗令占篇晉志案河圗占曰日薄也是帝王世紀黄帝逰洛水見大魚始得圗書今河圗也春秋正義引河圗云隂陽相薄為雷乾象新書引河圗帝覽嬉又引黄帝占文苑英華按黄帝占云老人星一名夀星前漢厯志黄帝名察發斂注臣瓉曰史記曰名察宿度謂三辰之度史記索隠黄帝使臾區晉志作車區占星氣張衡應間云渾元初基靈軌未紀黄帝為斯深慘有風后者是焉亮之察三辰於上跡禍福乎下經緯厯數然後天歩有常則風后之為也注史記曰黄帝迎日推策舉風后力牧以理人順天地之紀幽明之占又曰旁羅日月星辰春秋内事曰黄帝師於風后風后善于伏羲氏之道故推演隂陽之事藝文志隂陽有風后十三篇漏刻以程度厯數以授時律管是作隂陽有宜乾象紀泰階之疾神姦形白澤之辭唐志白澤圗一卷黄帝泰階六符經漢東方朔𫝊上使太中大夫吾丘夀王與待詔能用算者二人舉籍阿城以南盩厔以東宜春以西為上林苑建元三年夀王奏事時朔在旁進諫曰謙遜静慤天表之應應之以福驕溢靡麗天表之應應之以異臣願陳泰階六符以觀天變不可不省是日因奏泰階之事注孟康曰泰階三台也每台二星凡六星符六星之符驗也應劭曰黄帝泰階六符經曰泰階者天之三階也上階為天子中階為諸侯三公下階為士庶人上階上星為男主下星為女主中階上星為諸侯三公下星為卿大夫下階上星為元士下星為庶人三階平則隂陽和風雨時社稷神示咸獲其宜天下大安是為泰平云云天子行暴令好興甲兵修宫榭廣苑囿則上階為之奄奄疏闊也以孝武有此失故朔陳之藝文志天文有泰階六符一卷注李竒曰三台謂之泰階兩兩成體三台故六觀色以知吉凶故曰符五行志元封元年五月有星孛于三台三台為秦地能郊祀志已封泰山其秋有星孛于三有司曰天其報徳星云􅀭雄長楊賦聖文躬服節儉是以玉衡正而泰階平文選注云出黄帝六符經史天官書魁下六星兩兩相比曰三能索隠引六符經文選魏都賦注後漢郎顗𫝊注亦引之禮大宗伯疏案武陵太守星𫝊云三台一名天柱天府疏案石氏星𫝊云上能司命為大尉中能司中為司徒下能司禄為司空晉志三台起文昌抵太微一曰天柱三公之位在天曰三台主開徳宣符西近文昌二星曰上台主夀次二星曰中台主宗室東二星曰下台主兵三台為天階泰一躡以上下黄帝推分星次星次律度帝王世紀皇甫謐作見劉昭注補後漢郡國志自天地設闢未有經界之制三皇尚矣諸子稱神農之王天下地東西九十萬里南北八十五萬里及黄帝受命始作舟車以濟不通乃推分星次十二次也以定律度車區占星鬬苞授規星官之書為萬世法自斗十一度至婺女七度一名須女曰星紀之次於辰在丑謂之赤奮若於律為黄鍾斗建在子今吳越分野自婺女八度至危十六度曰元枵之次一名天黿於辰在子謂之困敦于律為大吕斗建在丑今齊分野自危十七度至奎四度曰豕韋之次一名娵訾于辰在亥謂之大淵獻于律為太簇斗建在寅今衛分野自奎五度至胃六度曰降婁之次於辰在戍謂之閹茂於律為夾鍾斗建在卯今魯分野自胃七度至畢十一度曰大梁之次於辰在酉謂之作噩於律為姑洗斗建在辰今趙分野自畢十二度至東井十五度曰實沈之次於辰在申謂之涒灘於律為中吕斗建在已今晉魏分野自井十六度至栁八度曰鶉首之次於辰在未謂之協洽於律為蕤賔斗建在午今秦分野自栁九度至張十七度曰鶉火之次於辰在午謂之敦牂一名大律於律為林鍾斗建在未今周分野自張十八度至軫十一度曰鶉尾之次於辰在己謂之大荒落於律為夷則斗建在申今楚分野自軫十二度至氐四度曰夀星之次於辰在辰謂之執徐於律為南吕斗建在酉今韓分野自氐五度至尾九度曰大火之次於辰在夘謂之單閼於律為無射斗建在戍今宋分野自尾十度至斗十度百三十五分而終曰析木之次於辰在寅謂之攝提格於律為應鍾斗建在亥今燕分野凡天有十二次日月之所躔也地有十二分王侯之所國也故四方方七宿四七二十八宿合一百八十二星東方蒼龍三十二星七十五度北方𤣥武三十五星九十八度四分度之一西方白虎五十一星八十度南方朱雀六十四星百十二度周天三百六十五度四分度之一一度二千九百三十二里分為十二次一次三十度三十二分度之十四各以附其七宿間距周天積百七萬九百一十三里徑三十五萬六千九百七十一里陽道左行故太嵗右轉凡中外官常明者百二十四可名者三百二十合二千五百星微星之數凡萬一千五百二十星萬物所受咸繫命焉此黄帝剏制之大略也厯志注蔡邕分星次度數與皇甫謐不同兼明氣節所在外紀黄帝畫壄分州得百里之國萬區以分星次史記黄帝旁羅日月星辰月令正義天地隂陽日月之名祭法黄帝正名百物其名盖黄帝而有也或後人有増天髙地下日盈月闕觜星度少井斗度多日月右行星辰左轉四游升降之差二儀運動之法非由人事所作皆是造化自然地有升降星辰有四游春秋元命包黄帝龍顔得天庭陽上法中宿取象文昌戴天履地秉數制剛抱朴子黄帝精推歩則訪山稽力牧講占􅀱則詢風后鄭𤣥注中􅀱勅省圖曰徳合五帝坐星者稱帝春秋正義春秋緯稱黄帝受圗有五始外紀地皇氏定星辰分晝夜以三十日為月十一月為冬至祭法帝嚳能序星辰以著衆䟽云紀星辰時􅀱魯語展禽曰帝嚳能序三辰以固民注次序三辰以治厯明時史記髙辛氏厯日月而迎送之黄帝九宫經隋志五行類黄帝九宫經一卷又三卷九宫行棊經三卷並鄭𤣥注房氏九宫行棊法一卷王琛行棊立成法一卷豆盧晃九宫要集一卷李氏九宫經解二卷九宫圗一卷九宫郡縣録一卷九宫八卦式圗一卷九宫推法一卷三元九宫立成二卷梁有黄帝太一雜占十卷吳志趙達治九宫一算之術唐書盧藏用善蓍龜九宫術詳見羣祀類六韜曰天文三人主司星厯候風氣推時日黄帝四序經文後魏術藝𫝊殷紹太安四年夏上四序堪輿表曰遇大儒成公興從求九章要術見道人法穆等以先師和公所注黄帝四序經文三十六卷合有三百二十四章專説天地隂陽之本其第一孟序九卷八十一章説隂陽配合之原第二仲序九卷八十一章解四時氣王休殺吉凶第三叔序九卷八十一章明日月辰宿交㑹相生相為表裏第四季序九卷八十一章具釋六甲刑禍福徳以經文𫝊授於臣抄撮要略集成一卷乞即班用遂行於世又見後堯考中星漢中星堯典乃命羲和欽若昊天厯象日月星辰敬授人時日中星鳥以殷仲春注日中謂春分之日鳥南方朱鳥鳥宿春分之昏鳥畢見以正仲春之氣節轉以推季孟則可知日永星火以正仲夏夏至之日火蒼龍之中星舉中則七星見可知以正仲夏之氣節季孟亦可知宵中星虚以殷仲秋春言日秋言夜互相備虚𤣥武之中星亦言七星皆以秋分日見以正三秋日短星昴以正仲冬日短冬至之日􅄧白虎之中星亦以七星並見以正冬之三節唐天文志堯命羲和出納日月考星中以正四時林氏曰鳥火虚昴以分至之昬見于南方正午位之中星記月令孟春昬參旦尾中仲春昬弧旦建星中季春昬七星旦牽牛中孟夏昬翼旦婺女中仲夏昬亢旦危中季夏昬火旦奎中孟秋昬建星旦畢中仲秋昬牽牛旦觜觽中季秋昬虚旦栁中孟冬昬危旦七星中仲冬昬東壁旦軫中季冬昬婁旦氐中注凡記昬明中星者為人君南面而聴天下視時􅀱以授民事淮南時則訓中星與月令同朱氏曰堯典星鳥以象言火以次言虛昴以宿言云云又按堯冬至日在虛昬中昴今日在斗昬中壁盖天度常平運而舒日道常内轉而縮天漸差而西嵗漸差而東此即嵗差之由唐一行謂日與黄道俱差者是也見日度議堯時昬旦星中於午月令差於未漢晉以來又差今比堯舜時似差及四分之一古時冬至日在牽牛今在斗林氏曰孔氏謂七星畢見不以為中星故唐孔氏云仲春之月日在奎婁入于酉地則初昬之時井􅀑在午栁星張在己翼軫在辰仲夏之月日在東井入於酉地即初昬之時角亢在午氐房心在己箕尾在辰仲秋之月日在角入於酉地即初昬之時斗牛在午女虛危在己室壁在辰仲冬之月日在斗入於酉地則初昬之時奎婁在午胃昴在己畢觜參在辰信如此説則是鳥火虛昴當分至昬皆見於己非正午也其何為四方中星哉王子雍覺其非遂謂宅嵎夷孟月也日中日永宵中仲月也星鳥火虛昴季月也此説並與天象偶合然分孟仲季非書意盖二孔王肅皆不知厯家有嵗差之法以月令日在某宿而求之所以不合按厯家自北齊張子信始首知嵗差法以古厯推之凡八十餘年差一度月令日在某宿比堯時則己差矣以日㑹月在某宿求之中星宜其不合矣故唐一行云日在虛一則鳥火昴虛皆以仲月昬中沈存中云堯典日短星􅄧今乃日短星東壁嵗差之法厯家所通知盖仲春之月日在昴入于酉地則初昬之時鶉火之星見于南方正午之位仲夏日在星入酉初昬大火之星見于南方正午之位仲秋日在心入酉初昬虚之星見于南方正午之位仲冬日在虛入酉初昬昴星見于南方正午之位四方躔度之星以名言凡二十八以日月所㑹言凡十有二以物象言凡四作典者欲備見故互言之書説又見厯象葉氏曰二十八星四方各得其七惟二分二至得仲月中氣皆以昬見于南堯典説陳氏曰書中星常在後月令中星常在前盖月令舉月本書舉月中也方氏曰書言分至之所中月令言昬旦之所中論衡堯􅀱四時之中命羲和察四星以占時氣月令正義案書緯考靈耀云主春者鳥星昬中可以種稷主夏者心星昬中可以種黍主秋者虚星昬中可以種麥主冬者昴星昬中則入山可以具器械王者南面而坐視四星之中而知民之緩急急則不賦力役故敬授民時禮司寤氏以星分夜疏若今時觀參辰知夜早晚是以書傳云春昬張中可以種稷夏大火中可以種黍菽秋虚中可以種麥冬昴中可以収斂盖藏陳氏曰如龍見而雩火流而授衣天根見而成梁水昬正而栽日至而畢奉天順人莫不視乎此月令舉其月初尚書總舉一月故不同孔安國注書自取畢見之義不謂南方之中堯典正義云孔氏取畢見馬鄭舉正中之星不為一方盡見星次西流日行東轉十二月日之所在或舉月初或舉月末不與厯數齊同其昬明中星皆如此案三統厯立春昬畢十度中正月中昬井二度中元嘉厯立春昬昴九度中月半昬觜觿一度中計正月昬參中依三統厯在立春後六日參星初度昬得中也盖月令昬明中星但一月之内有中者皆得載之不可正依厯法餘月從此可知月令舉初朔尚書總舉一月之中詩正義堯典四時言中星者春夏交舉其次言鳥火秋冬交舉其宿言虚昴鄭注云星鳥鶉火之方星火大火之屬虛𤣥武中虛宿也􅄧白虎中宿也東方南方皆三次鶉火大火居其中西方北方俱七宿虛􅄧居其中毎時總舉一方故指中宿與次而互言之宋志何承天曰漢代雜􅀱清臺以昬明中星課日所在日之所在雖不可見月盈則蝕必當其衝以月推日躔次可知捨易而役心于難臣所不解也堯典云日永星火以正仲夏今季夏則火中又宵中星虛以殷仲秋今季秋則虚中爾來二千七百餘年以中星檢之所差二十七八度則堯冬至日在須女十度左右也唐志厯議漢世課昬明中星為法已淺祖冲之曰堯典日短星􅄧以正仲冬以此推之唐代冬至日在今宿之左五十許度漢初用秦厯冬至日在牽牛六度漢武改立太初厯冬至日在牛初後漢四分法冬至日在斗二十二晉時姜岌以月蝕檢日知冬至在斗十七今參以中星課以蝕望冬至之日在斗十一通而計之未盈百載所差二度書以四星昬中審分至者據人君南面為言也南北之正其詳易准流見之勢中天為極夏小正五月昏大火中詩定之方中中天之正當在室之八度臣歴推之元年立冬後四日躔度昏中乃自十月之初鄭氏箋定星昏中而正謂之營室謂小雪時符戴法興議古厯冬至皆在建星元和所用與古厯相書云日短星昴以正仲冬直以月推四仲則中宿常在衡陽羲和正時萬世不易詩七月流火此夏正建寅之時定之方中又小雪之節也冲之辨折之隋志舜在機衡則考靈曜所謂觀玉儀之遊昏明主時乃命中星者也袁充曰堯時仲冬日在須女十度三禮義宗明天有三百六十五度義曰立表于經緯之中又置一逰儀之表於中表之南正當于經上然後從中表之北以􅀱星之光襄楷𫝊皇天不言以文象設教堯舜雖聖必厯象日月星辰察五緯所在水經注堯帝循壇河洛榮光出河有列星之分斗政之度以授之皇極經世唐堯始于星之癸一百八十辰之二千一百五十七甲辰肇位漢厯志十一月甲子朔旦冬至日月在建星注李竒曰古以建星為宿今以牽牛為宿孟康曰建星在牽牛間晉灼曰賈逵論太初厯冬至日在牽牛初牽牛中星也古厯皆在建星建星即斗星也太初厯四分法在斗二十六度史官舊法冬夏至常不及太初厯五度四分法在斗二十一度與行事􅀱法天度相應續漢志章帝詔曰史官用太初鄧平術行度轉差冬至之日日在斗二十二度而厯以為牽牛中星續漢志月令章句曰中星當中而不中日行遲也未當中而中日行疾也見注冬至昏中星奎六弱旦中星亢二少强退中星以日所在為正下漏數刻以考中星漏刻昏明中星刻于下宋志魏楊偉表曰武帝元封七年改正朔更厯數造太初厯校中朔所差以正閏分課中星得度以考疏宻唐志傅仁均為戊寅元厯曰日短星昴合于堯典王孝通曰星昴七宿畢見舉中宿言則餘星可知仁均專守昴中執文害意月令仲冬昏東壁中明􅄧中非為常凖仁均曰孝通未曉嵗差乃執南斗為冬至常星麟徳厯以加日躔得昏旦中星其赤道同太初星距大衍日度議曰自帝堯演紀之端在虛一度日在虛一則鳥火昴虛皆以仲月昏中合于堯典湯作殷厯周人因之距羲和千祀昏明中星率差半次夏時直月節者皆當十有二中故因循夏令吕不韋得之以為秦法更考中星斷取近距夏厯章蔀紀首皆在立春故課中星以十二節為損益之中吕氏春秋黄帝仲春乙夘日在奎以月令在奎謂黄帝時亦在奎漢厯氣後天三日而日先天三度所差尚少洛下閎等雖􅀱昏明中星歩日所在猶未覺其差漢世課昏明中星為法已淺今􅀱夜半中星以求日衝近于得宻又有中星略例歩軌漏術其求距中度及昏明中星日出入皆依陽城法求之夏小正正月初昏參中斗柄懸在下三月參則伏四月昴則見初昏南門正星也五月參則見初昏大火中六月初昏斗柄正在上七月漢案户漢者河也初昏織女正東鄉斗柄懸在下則旦八月辰則伏參中則旦九月内火辰繫于日十月初昏南門見織女正北鄉則旦唐月令正月日在虛昏􅄧中曉心中二月日在營室昏東井中曉箕中三月日在婁昏栁中曉南斗中四月日在昴昏翼中曉牽牛中五月日在參昏角中曉危中六月日在東井昏氐中曉東壁中七月日在張昏尾中曉婁中八月日在翼昏南斗中曉畢中九月日在角昏牽牛中曉東井中十月日在房昏虛中曉張中十一月日在箕昏營室中曉軫中十二月日在南斗昏奎中曉亢中禮記月令孟春日在營室仲春在奎季春在胃孟夏在畢仲夏在東井季夏在栁孟秋在翼仲秋在角季秋在房盖冬在尾仲冬在斗季冬在婺女左傳火星中而寒暑退服䖍云火大火心也季冬十二月平旦正中在南方大寒退季夏六月黄昏火星中大暑退詩七月流火朱氏曰火以六月之昏加于正南午位當東西之中至七月之昏則下而西流三星在天箋心星也為二月之合宿謂定之方中箋定星昏中而正于是可以營制宫室故之營室謂小雪時國語營室之中土功其始周書周月維一月既南至昏昴畢見日短極基踐長是月斗柄建子始昏北指日月俱起于牽牛之初左傳丙子旦日在尾月在䇿鶉火中注是夜日月合朔於尾月行疾故至旦而過在策疏以三統厯推之此夜是月小餘盡夜半合朔在尾十四度云云月令孟冬日在尾昏危中旦七星中七星則鶉火次之星也李肇國史補裴胄問董生曰日右轉星左轉約八十年差一度自漢文帝三年甲子冬至日在斗二十二度至唐興元元年甲子冬至日在斗九度九百六十一年差十三度矣中興書目尚書治要圗有月令後漢志中星圗禹天官寳書文選李善注道學𫝊曰夏禹集天官之寳書書以南和丹繒封以金英之函檢以𤣥都之印周三辰灋禮春官凡以神仕者掌三辰之灋以猶􅀑神示之居辨其名物注猶圗也天者羣神之精日月星辰其著位也以此圗天神人􅀑地示之坐孝經説郊祀之禮曰燔燎掃地祭牲繭栗或象天酒旗坐星厨倉具黍稷布席極敬心也言郊之布席象五帝坐禮祭宗廟序昭穆又有似虛危則祭天圜丘象北極祭地方澤象后妃及社稷之席皆有明法焉國語曰制神之處位次主為牲器時服疏引孝經説郊祀者援神契文敢問章云吕氏春秋夏商太史圗法周九州星土分星分野堪輿郡國所入度禮保章氏以星土辨九州之地所封封域皆有分星以觀妖祥注星土星所主土也封猶界也鄭司農説星土以春秋傳曰參為晉星商主大火國語曰嵗之所在則我有周之分野之屬是也𤣥謂大界則曰九州州中諸國之封域于星亦有分焉其書亡矣堪輿雖有郡國所入度非古數也今其存可言者十二次之分也星紀吳越也𤣥枵齊也娵訾衛也降婁魯也大梁趙也實沈晉也鶉首秦也鶉火周也鶉尾楚也夀星鄭也大火宋也析木燕也此分野之妖祥主用客星彗孛之氣為象正義辨九州之地者據北斗而言所封封域者據二十八宿而説春秋緯文耀鉤云布度定記分州繫象華岐以西龍門積石至三危之野雍州屬魁星大行以東至碣石王屋砥柱冀州屬樞星三河雷澤東至海岱以北兖州青州屬機星蒙山以東至江南㑹稽震澤徐揚之州屬權星大别以東至雷澤九江荆州屬衡星荆山西南至岷山北距鳥鼠梁州屬開星外方熊耳以至泗水陪尾豫州屬揺星此九州屬北斗星有七州有九但兖青徐􅀭并屬二州故七星主九州也周之九州差之義亦可知唐志詩人所記昏禮土功必􅀱天星周禮分星辨國古黄帝時堪輿亡故其書亡矣後代有作堪輿者非古數漢藝文志堪輿金匱十四卷吳越在南齊魯在東今嵗星或北或西不依國地所在者此古之受封之日嵗星所在之辰國屬焉故也吳越二國同次者亦謂同年度受封故同次也大司徒辨十有二土注分野十二邦上繫十二次各有所宜疏天有十二次日月之所躔地有十二土王公之所國唐虞及夏萬國殷周千七百七十三國皆依附十二邦以繫十二次若吳越同次之類凡繫星之法皆因王者所命屬焉參為晉星商主大火皆先王命祀之法案元命包云國君王者封上應列星之位注云若角亢為鄭房心為宋比其餘小國不中星者以為附庸若然附庸不繫星其餘皆繋周書小武開解周公曰九紀一辰以紀日二宿以紀月三日以紀徳四月以紀刑五春以紀生六夏以紀長七秋以紀殺八冬以紀藏九嵗以紀終周語武王伐殷嵗在鶉火嵗星在張十三度張鶉火也月在天駟戊子日月宿房五度日在析木之津日宿箕七度辰在斗柄斗前一度星在天黿辰星在須女伏天黿之首星與日辰之位皆在北維北方水位也顓頊之所建也帝嚳受之木徳受之于水我姬氏出自天黿即𤣥枵齊之分野也及析木者有建星及牽牛焉皆水宿則我大姜之姪伯陵之後逢公之所馮神也齊地屬天黿故祀而配食嵗之所在則我有周之分野也鶉火周之分野月之所在辰馬農祥也房心星也心星所在大辰之次為天駟月在房合于農祥房星辰正而農事起故謂之農祥后稷之所經緯也自鶉及駟七列也從張至房合七宿鶉張衡西京賦秦繆公乃為金䇿錫用此土而翦諸首注漢書曰自井至栁謂之鶉首之次秦之分也年晏子春秋熒惑守虚晏子曰虚齊野也周文王七孟春五星聚房昭理四海齊桓公将霸五星聚于箕唐厯志五星議成湯嵗在壬戌其明年湯始建國為元祀嵗星順行與日合于房所以紀商人之命也後六百一算周文王初禴于畢十三祀嵗在己夘星在鶉火武王克商之年進及輿􅀑而退守東井明年周始革命順行與日合于栁進留于張考其分野則分陜之間與三監封域之際也成王三年嵗在丙午星在大火唐叔始封故國語曰晉之始封嵗在大火日度議鶉火直軒轅之虛土爰稼穡稷星繫焉而成周之大萃也鶉首當山河之右太王以興后稷封焉而宗周之所宅也故國語曰嵗之所在則我有周之分也易氏曰在諸侯謂之分星在九州謂之星土星土之書亡矣考之𫝊記烖祥所應亦有可證不誣者昭十年有星出于婺女禆竈曰今兹嵗在顓頊之虛姜氏任氏實守其地釋者以顓頊之虛為𤣥枵此𤣥枵為齊之分星而青州之星土也昭二十二年吳伐越晉史墨曰越得嵗而吳伐之釋者以為嵗在星紀此星紀為越之分星而揚州之星土也昭元年鄭子産曰參為晉星實沈參神此實沈為晉之分星而并州之星土也襄九年晉士弱曰陶唐氏火正閼伯居商丘故商主大火此大火為宋之分星而豫州之星土也昭十七年星孛及漢申須曰漢水祥也衛顓頊之虚故為帝丘其星為大水此娵訾為衛之分星而冀州之星土也襄二十八年梓慎曰嵗在星紀而淫于𤣥枵蛇乗龍龍宋鄭之星注東方房心為宋角亢為鄭此夀星為鄭之分星而亦豫州之星土也鄭語周史伯曰楚重黎之後也黎為髙辛氏火正此鶉尾為楚之分星而荆州之星土也爾雅曰析木謂之津釋者謂天漢之津梁為燕此析木為燕之分星而幽州之星土也然亦有可疑者武王伐殷嵗在鶉火泠州鳩曰嵗之所在我有周之分野盖指鶉火為西周豐岐之地今乃以當洛陽之東周何也周平王以豐岐之地賜秦襄公而其分星乃謂之鶉首又何也如燕在北而配以東方之析木魯在東而配以西方之降婁秦居西北而鶉首次于東南吳越居東南而星紀次于西北此皆稽之分野有不合者賈氏以古者受封之月嵗星所在之辰恐其不然若謂受封之辰則春秋戰國之諸侯以之占妖祥可也後世占分野而妖祥亦應豈皆古者受封之辰乎此堪輿之書雖足考古而言郡國所入度則非古之灋吕氏曰十二次盖戰國言星者以當時所有之國分配之耳禮大司徒疏案考靈耀曰從上臨下八萬里天以圓覆地以方載河圗括地象曰天不足西北地不足東南西北為天門東南為地户天門無上地户無下又云極廣長南北二億三萬一千五百里東西二億三萬三千里地與星辰四游升降于三萬里之中考靈曜文言云云又云天左動起于牽牛地右動起于畢廣雅云天圜廣南北二億三萬三千五百里七十五歩東西短減四歩周六億一萬七百里二十五歩從地至天億一萬六千七百八十七里半下度地之厚與天髙等天度云東方七宿七十五度南方七宿百十二度西方七宿八十度北方七宿九十八度四分度之一四方三百六十五度四分度之一度二千九百三十二里二十八宿間相距積百七萬九百十三里徑三十五萬六千九百七十里春秋正義諸侯祭其分野之星在地之土各有上天之分見于𫝊紀者云商主大火參為晉星云龍宋鄭之星則蒼龍之方在宋鄭之分也以害鳥帑周楚惡之則朱鳥之方在周楚之分也四月日食魯衛惡之則春分之日在魯衛之分也嵗在顓頊之虛姜任實守其地則於時嵗星在齊薛之分也越得嵗而吳伐之凶則於時嵗星在吳越之分也晉語云實沈之虛晉人是居周語云嵗在鶉火我有周之分野是有分野之言也以九州當十二次周禮雖云皆有分星不知其分誰分之也星紀在于東北吳越實在東南魯衛東方諸侯遙屬戍亥之次又三家分晉方始有趙而韓魏無分趙獨有之漢書地理志分郡國以配諸次詳見後其地分或多或少鶉首極多鶉火甚狹徒以相𫝊為説其源不可得聞分野或有妖祥為占多得其效盖古之聖哲有以度知非後人所能測也三禮義宗星分所主各有由序晉屬實沈者髙辛之子主祀參星宋屬大火者閼伯之墟主祀大辰齊屬𤣥枵者逢公託食其餘國非所悉九州之中國數非一是以吳越同次燕陳共分通典下分地理上配天象所定躔次總標十三凡國之分野上配天象始于周季定其十三其地可辨前漢志天文有海中二十八宿國分二十八卷二十八宿臣分二十八卷陳顧野王撰分野樞要一卷淮南天文訓載星部地名論語摘輔象注九州繋於三台周保章氏五物禮保章氏掌天星以志星辰日月之變動以觀天下之遷辨其吉凶注星謂五星辰日月所㑹五星有贏縮圜角日有薄食暈珥月有虧盈朓側匿之變以星土辨九州之地以十有二嵗之相觀天下之妖祥以五雲之物辨吉凶水旱降豐荒之祲象注視日旁雲氣之色以十有二風察天地之和命乖别之妖祥注十二辰皆有風吹其律以知和不和凡此五物者以詔救政訪序事疏五物謂從掌天星以下己見之物有此五事周九星文選注周書王曰余不知九星之光周公旦曰九星星辰日月四時嵗是謂九星九星九光任昉云不改參辰而九星仰止周書小武開解三極一維天九星二維地九州三維人四佐注九星四方及五星禮大宗伯疏元命包云文王之時五星聚房古文月采篇前漢律厯志三統厯譜召誥曰惟三月丙午朏古文月采篇曰三日曰朏師古曰月采説月之光采其書則亡書召誥正義周書月采云三日曰朏又引周書武成篇惟一月壬辰旁死霸四月既旁生霸死霸朔也生霸望也魄月質也霸古魄字是夕也月在房五度故傳曰月在天駟畢命豐刑曰惟十有二年六月庚午朏孟康曰逸書篇名書正義朔為始死魄二日為近死魄望後一日為始生魄生明死魄俱是月初春秋正義月體無光待日照而光生半照即為􅁌全照乃成望纎阿案晷王氏曰以朏望明魄紀月以甲子紀日書之法也甘石厯五星法漢史官甘石舊文史天官書故甘石厯五星法惟獨熒惑有反逆行逆行所守及他星逆行日月薄蝕皆以為占余觀史記考行事百年之中五星無出而不反逆行嘗盛大而變色日月薄蝕行南北有時此其大度也水火金木填星此五星者天之五佐為經緯嵗隂左行在寅注索隠曰嵗星在正月晨見東方之名已下皆出石氏星經文云星在斗牽牛失次應見于杓也漢書天文志則載甘氏及太初厯星所在之宿不同漢志攝提格嵗星正月晨出東方石氏在斗牽牛甘氏在建星婺女單閼石氏在婺女虚危甘氏在虛危執徐甘石同在室壁大荒落甘石同在奎婁甘氏太初厯不同者以星贏縮在前各録後所見也四星亦畧如此古厯五星亡逆行甘石經以熒惑太白有逆行夫厯者正行也天下太平五星循度亡有逆行又見下後厯志蔡邕議馮光陳晃厯以考靈曜二十八宿度數及冬至日所在與今史官甘石舊文錯異不可考校以今渾天圗儀檢天文亦不合于考靈曜月令正義熊氏引石氏星經云司命二星在虛北司祿二星在司命北司危二星在司禄北司中二星在司危北詳見前類甘氏嵗星經禮保章氏以十有二嵗之相觀天下之妖祥注嵗謂太嵗嵗星與日同次之月斗所建之辰也嵗星為陽右行於天太嵗為隂左行于地十二嵗而小周其妖祥之占甘氏嵗星經其遺象也鄭司農云太嵗所在嵗星所居春秋傳曰越得嵗而吳伐之之屬是也馮相氏掌十有二嵗辯叙事以㑹天位注樂説説嵗星與日常應太嵗月建以見疏曰此太嵗在地與天上嵗星相應而行嵗星右行一嵗移一辰又分前辰為百三十四分而侵一分則百四十四年跳一辰十二辰帀總有千七百二十八年十二跳辰帀以此計之十二嵗一小周謂一年移一辰也千七百二十八年一大周十二跳帀故也嵗左行于地一與嵗星跳辰年數同服䖍注春秋龍度天門是也嵗星在東方謂之龍以辰為天門故以嵗日跳辰為龍度天門大司樂疏引石氏星經又月令疏熊氏引之說文引甘氏星經史天官書察日月之行以揆嵗星順逆索隱曰姚氏案天官占云嵗星一曰應星一曰經星一曰紀星物理論云嵗行一次十二嵗一周天攝提格嵗嵗隂左行在寅嵗星右轉居丑正月與斗牽牛晨出東方名曰監徳索隠曰已下皆出石氏星經文漢書天文志則載甘氏及太初厯星所在之宿不同也單閼嵗嵗隂在夘星居子二月與婺女虛危晨出曰降入執徐嵗嵗隂在辰星居亥三月與室壁晨出曰青章大荒落嵗嵗隂在巳星居戍四月與奎婁胃昴晨出曰跰踵敦牂嵗嵗隂在午星居酉五月與胃昴畢晨出曰開明叶洽嵗嵗隂在未星居申涒灘嵗嵗隂在申星居未作鄂嵗嵗隂在酉星居午曰長列大音為長王閹茂嵗嵗隂在戍星居巳大淵獻嵗嵗隂在亥星居辰曰天睢大章困敦嵗嵗隂在子星居夘赤奮若嵗嵗隂在丑星居寅曰天泉天皓索隠曰按天文志此皆甘氏星經文而志又兼載石氏此皆不取嵗星一曰攝提一曰重華應星紀星漢天文志正月甘氏在建星婺女二月甘氏在虛危三月甘氏同石氏在室壁四月甘氏同在奎婁五月甘氏同在胃昴畢六月甘氏在參罰七月甘氏在弧八月甘氏在注張九月甘氏在七星翼十月甘氏在軫角亢十一月甘氏同在氐房十二月甘氏在心尾秋官注十二月之號謂從娵至荼爾雅正月為娵十二月為涂甘氏太初厯所以不同者以星贏縮在前各録後所見也古厯五星之推亡逆行者至甘氏石氏經以熒惑太白為有逆行張耳𫝊甘公曰東井秦分先至必王楚必屬漢郎顗𫝊石氏經曰嵗星出左有年出右無年史記正義七録云甘徳楚人戰國時作天文八卷宋志祖冲之曰嵗星之運年常過次行天七帀輙超一位甘石之書互為矛楯唐志五星議嵗星自商周汔春秋之季率百二十餘年而超一次戰國後行浸急及哀平間餘勢乃盡更八十四年而超一次姬氏出自靈威仰之精受木行正氣嵗星主農祥后稷馮焉故周人常閲其禨祥以觀善敗其始王也次于鶉火以達天黿其衰也淫于𤣥枵以害鳥帑太初三統厯嵗星十二周天超一次推商周間事大抵皆合驗開元注記差九十餘度大衍厯議淮南天文訓太隂在四仲則嵗星行三宿太隂在四鉤則嵗星行二宿春秋正義嵗行一次舉大數耳其實一嵗之行有餘一次左傳及國語所云嵗在者謂嵗星所在天有十二次地有十二辰一星終也言嵗星十二年而一周天天道多在西北言其年嵗星在亥二十八宿分在四方方有七宿共成一象龍虎皆南首北尾鳥武皆西首東尾嵗星天之貴神福徳之星三禮義宗嵗星者東方蒼龍之宿五星之首在天右行十二嵗一周天太嵗者嵗星之神法五行亦十二嵗一周于地漢志嵗星注晉灼曰太嵗在四仲則嵗行三宿太嵗在四孟四季則嵗行二宿十二嵗而周天隋志五行類東方朔嵗占一卷星備禮馮相氏疏星備云明王在上則日月五星皆乗黄道又黄帝占云天道有三黄道者日月五星所乗案鄭駮異義云三光考靈曜書云日道出于列宿之外萬有餘里通卦驗云春夏晷長七尺二寸四分保章氏疏星備云五星更王相休廢其色不同王則光芒相則内實休則光芒無角不動揺廢則少光色順四時其國皆當也又云立春嵗星王云云案括地象天不足於西北則西為天門大宗伯注星為五緯疏曰二十八宿隨天左轉為經五星右旋為緯星備云五星初起牽牛又案星備云嵗星一日行十二分度之一十二嵗而周天熒惑日行三十三分度之一三十三嵗而周天鎮星日行二十八分度之一二十八嵗而周天太白日行八分度之一八嵗而周天辰星日行一度一嵗而周天漢天官書天官筭術五紀皇極論天文志自序太史公談掌天官學天官於唐都索隠曰星有尊卑若人之官曹列位故曰天官天文有五官正義虞喜志林云古者主天官者皆上公天官書所載五宫五星之位日月國皇星至長庚景星望雲氣卿雲􅀱嵗美惡決八風聴民聲正月數雨日至晷景天官書云為天數者必通三五深觀時變天官備矣索隠曰三謂三辰五謂五星續志景武之際談遷以重黎之後為太史令遷作天官書晉志談父子述天官書明天人之道成帝時劉向廣洪範災條作五紀皇極論以參往行之事孝明使班固序漢書而馬續述天文志今紹作天文志起莽迄建安二百一十五載注謝沈書曰蔡邕撰建武以來星驗著明以續前志譙周接繼其下後漢天文志劉昭注引星經星占韓楊占巫咸占黄帝星占黄帝占荆州星經黄帝星經郗萌占石氏星經黄帝經海中占雒書荆州星占河圗石氏占王鳳對太史公書有天官災異不宜在諸侯王谷永於天官京氏易最密善言災異前後所上四十餘事元始五年正月召天下通知天文厯算鍾律者鄧后從曹大家受經兼天文算數崔子玉明天官厯數單颺明天官算術劉洪好學以天文數術探賾鈎深遂專心鋭思續志注博物記曰任文孫明天官風星秘要文選注引天官星占賈逵引五紀論日月循黄道尚書令忠難衡興以為五紀論推歩行度當時比諸術為近然猶未稽于古虞恭議洪範五紀論云云魏天象志云班史以日暈五星之屬列天文志薄蝕彗孛之比入五行説七曜一也而分為二志故陸機云學者所疑也文選注引蔡邕天文志曰言天體者有三家漢天數臯唐甘石書傳史記天官書昔之𫝊天數者髙辛之前重黎於唐虞羲和有夏昆吾殷商巫咸周室史佚萇𢎞於宋子韋鄭則裨竈在齊甘公名徳楚唐昧一作蔑趙尹臯魏石申夫戰國察禨祥􅀱星氣尤急言從衡者繼踵而臯唐甘石因時務論其書𫝊故其占驗凌雜米鹽自漢之為天數者星則唐都氣則王朔占嵗則魏鮮為天數者必通三五辰星深觀時變察其精粗則天官備矣隋志漢𫝊天數有唐都李尋之倫光武時有蘓伯况郎雅光並能參伍天文漢二十一家天文志天文二十一家四百四十五卷始泰壹雜子星終圗書秘記星有泰壹二十八卷皇公二十二卷淮南雜子十九卷五殘雜變二十一卷泰階六符一卷金度玉衡漢五星客流出入八篇彗客流星行事占驗八卷海中星占十二卷所後天文志注引海中占即張衡謂海人之占也隋志海中星占一卷星圗海中占一卷星經雜事二十二卷五星順逆二十八宿國分臣分並二十八卷氣有黄帝雜子三十三篇常從日月星氣二十一卷漢日旁氣行事占驗十三卷若泰壹雜子雲雨二十四卷國章觀霓雲雨卷同上則霓雲雨之書也若漢日食月暈行事占驗十三卷海中日月彗虹雜占十八卷則日月之書也圗書秘記十七篇附焉又雜占有禳祀天文十八卷天文者序二十八宿歩五星日月以紀吉凶之象星事非湛密者弗能由非明王不能服聴志載甘石及夏氏日月𫝊星𫝊妖祥之占始漢元年五星聚井終元夀元年嵗星入太微日月周輝星辰垂精百官立法宫室混成降應王政景以燭形舉其占應覽故考新李尋學天文唐檀好星占襄楷善天文上疏曰天不言以文象設教郅惲明天文厯數郎宗善星算楊統就鄭伯山受河洛書及天文推歩之術作家法章句及内䜟二卷解説統父春卿曰吾綈袠中有先祖所𫝊秘記為漢家用其修之王景好天文術數姜肱博通五經兼明星緯翟酺善天文厯算時尚書有缺詔將大夫六百石以上試對政事天文道術以髙第補之酺對第一漢典星前志有典星射姓續志賈逵論問典星待詔姚崇井畢等十二人西域𫝊太史治星望氣漢官靈臺待詔四十二人其十四人􅀱星元光中天星㨱上問􅀱星者對曰民勞宋司星子韋漢夏氏日月𫝊前天文志夏氏日月𫝊曰日月食盡主位也不盡臣位也星𫝊曰日者徳也月者刑也功臣表成帝時光禄大夫滑湛日旁占驗曰鄧弱以長沙將兵侯隋志夏氏日旁氣一卷許氏撰又梁四卷魏氏日旁氣圗一卷又見天文二十一家太厯譜有日晷書三十四卷嵗謀日晷二十九卷乾象新書引夏氏占周馮相冬夏致日春秋致月眂祲十煇天文志正朔所􅀱決于日旁日旁雲氣人主象皆如其形以占漢太初星度五星行度又見中星太初厯史厯書今上招致方士唐都分其天部而巴洛下閎運算轉厯然後日辰之度與夏正同乃改元詔御史曰乃者有司言星度未定廣延宣問以理星度未能詹也漢書音義分部二十八宿為距度蓺文志厯譜有傳周五星行度三十九卷自古五星宿紀三十卷後厯志賈逵論案行事史官注冬夏日至常不及太初厯五度願請太史星度課與待詔星象考校方術𫝊班固薦謝夷吾曰推考星度綜校圗錄魏志崔浩集諸厯家考校漢元以來五星行度并譏前史之失唐志日度議淳風以為大初元年得本星度日月合璧俱起建星賈逵考厯亦云古厯冬至皆起建星兩漢冬至日皆後天故其宿度多在斗末漢劉向言域分地理志成帝時劉向略言其地分一作域分今著于篇秦地於天官東井輿􅀑之分壄也自井十度至栁三度謂之鶉首之次秦之分也魏地觜觽參之分壄也周地柳七星張之分壄也自栁三度至張十二度謂之鶉火之次周之分也韓地角亢氐之分壄也陳本太昊之墟自東井六度至亢六度謂之夀星之次鄭之分壄與韓同分趙地􅄧畢之分也燕地尾箕之分壄也自危四度至斗六度謂之析木之次燕之分也齊地虛危之分壄也魯地奎婁之分壄也宋地房心之分壄也衛地營室東壁之分壄也楚地翼軫之分壄也吳地斗分壄也粤地牽牛婺女之分壄也晉天文志班固取三統厯十二次配十二野其言最詳荀悦漢紀載災異分野分自七國時甘石始配十二野續漢志注星經嵗星主徐青兖熒惑主􅀭荆交鎮星主豫太白主凉雍益辰星主冀幽并璇璣謂北極星也玉衡謂斗九星也玉衡第一星主徐二主益三冀四荆五兖六􅀭七豫八幽九并凡有六十郡九州所領自有分而名焉吕氏曰星經出于戰國之末故舉當時東西周疆界言之史天官書二十八舎主十二州斗秉兼之詳見分野圗徐廣雅云樞為雍璇為冀璣為青兖權為􅀭衡為荆開陽為梁搖光為豫吕氏春秋天有九野地有九州淮南子天文訓曰天有九野九千九百九十九隅去地五億萬里漢集星章風角書晉天文志隋志同漢京房著風角書有集星章所載妖星皆見於月旁互有五色方雲以五寅日見各有五星所生天槍嵗星所生至端下辰星所生三十五星即五行氣所生皆出于月左右方氣之中隋志五行有京房周易占事十二卷風角要占三卷風角五音占五卷天文有京氏釋五星災異𫝊一卷日占圗三卷唐志周易四時􅀱二卷周易飛􅀱六卷並京氏京房𫝊長于災變分六十卦更直日用事以風雨寒温為􅀱注孟康曰餘四卦震離兊坎為方伯監司之官五行志多引京房易𫝊晉志引京房易𫝊易占郎顗傳臣案飛􅀱參察衆政注京房作易飛􅀱詳見大衍卦議文選注引京房易飛􅀱曰日不于晦朔蝕者名曰薄又引青雲潤澤御覽引京房易飛􅀱曰太平之時十日一雨凡嵗三十六雨水經注引京房易妖占史記正義引京房易兆􅀱續漢五行志注引京房占石氏占安帝紀注引京房别對災異云云隋袁充引京房别對曰太平日行上道升平行次道霸世行下道御覽引京房對災異曰云云劉向七略京房易説云月與星辰隂也有形無光日照之乃有光月令正義亦引之又引師曠占十洲記月氏占東風入律又引黄子發相雨書京房風角要訣􅀱雨法又引吳範占􅀱風氣秘訣顔氏家訓引風角書曰庶人風者拂地􅀭塵轉削翼奉傳注引翼氏風角谷永於天官京氏易最密郎顗父宗學京氏易善風角星算六日七分注風角謂􅀱四方四隅之風以占吉凶本傳臣以六日七分􅀱之崔子玉明京房易𫝊六日七分張衡上疏律厯卦􅀱九宫風角數有證效世莫肯學謝夷吾學風角占􅀱樊英善風角星算景鸞按風角雜書列其占驗作興道一篇廖扶明風角李南明風角李郃善河洛風星徐穉兼綜風角星官算厯李固明風角星算河圗䜟緯吳伉善風角蔡邕封事曰風者天之號令所以教人注引翼氏風角吳範有占􅀱風氣秘訣任文孫明天官風角秘要劉寛明星官風角算厯何休注訓風角七分陶𢎞景明風角星算隋志翼氏占風一卷風角雜占五音圗五卷東方朔嵗占一卷唐志翼奉風角要􅀱一卷隋志十一卷東方朔占書一卷通典兵類有風雲氣􅀱雜占孫子太白云云崇文目風角五音占一卷保章氏以十二風察天地之和注十二辰氣為風疏師曠吹律以觀楚强弱服注北風無射夾鍾以北南風姑洗以南師曠歌南風北風考異郵曰陽立于五極于九五九四十五日一變以隂合陽故八卦主八風距同各四十五日艮為條震為明庶㢲為清明𩀌為景坤為涼兊為閶闔乾為不周坎為廣莫通卦驗云冬至廣莫風云云三六九十二月皆不見風惟有八以當八卦八節四維之風主兩月雨水猛風與條風俱在正月則猛風非八卦之風史天官書漢魏鮮集臘明正月旦决八風吳子曰將戰之時審􅀱風所從來風順致呼而從之風逆堅陳以待之文選注兵書曰凡􅀱風法以雞羽重八兩建五丈旗取羽繫其巔立軍營中國語虞幕聴協風前志至治之世天地之氣合以生風天地之風氣正十二律定易稽覽圗唯平均乃不鳴條京房易􅀱曰風清明其來長乆不動揺物此有龍徳在下也尚書大傳舜將禪禹八風循通黄帝風經曰調長祥和天之喜風也折􅀭奮厲天之怒風也魏相奏曰日冬夏至則八風之序立萬物之性成應廣莫而修刑則明庶而施惠待閶闔而藏庶物􅀱不周而謹邉備長安靈臺上有相風銅烏漢言天三家周髀渾天宣夜言天地形狀六等葢天昕天渾天穹天宣夜安天張衡傳注漢名臣奏蔡邕曰書疏蔡邕天文志云云言天體者有三家一曰周髀晉志日盖天二曰宣夜三曰渾天宋天文志云言天者有三家宣夜盖天渾天者文選注蔡邕天文志曰言天體有三家宣夜之學絶無師法周髀術數具存考驗天狀多所違失惟渾天近得其情史官所用􅀱臺銅儀則其法也天文志注蔡邕表志曰立八尺圓體之度具天地之象以正黄道察發斂行日月歩五緯官有其器而無本書前志亦闕臣求其舊文連年不得未及成書欲寢伏其下案度成數宜博問羣臣下及巖穴知渾天之意者使述其義以禆天文志晉志靈帝時上書宋志同月令正義凡言天地之殊有六等一曰蓋天文見周髀如盖在上晉志周髀即葢天也其本庖犧氏立周天厯度所𫝊則周公受於殷商周人志之故曰周髀股也股表也其言天似盖笠地法覆槃天地各中髙外下北極之下為天地之中三光隠映以為晝夜日所行道為七衡六間日近而見之為畫日逺而不見為夜又周髀家云天圓如張盖地方如棊局天如磨而左行日月右行隨天如蟻行磨石之上磨疾蟻遲隨磨以左迴天之形如倚盖依算術用句股重差推晷景極游為逺近之數得于表股故曰周髀句股乗除之數漢王仲任據盖天之説以駁渾儀葛洪釋之曰天表裏有水天地各乗氣而立載水而行黄帝書曰天在地外水在天外水浮天載地王生以火炬喻日把火去人逺則光微而日月自出至入不漸小以火喻之謬矣隋志漢末揚子雲難盖天八事以通渾天一曰周天當五百四十度今盖天三百六十度二曰春分日出夘入酉即天葢轉夜當倍晝今夜亦五十刻三曰日入而見星斗當見六月不當見六月今夜常見四曰以葢圗視天河起斗而東入狼弧間曲如輪今視天河直如繩五曰周天四七之宿以葢圗視天星見者常少不見者常多今見與不見等六曰日託天而旋至髙也今從髙山上以水望日日出水下影上行七曰視物近則大逺則小今日與北斗近我而小逺我而大八曰視葢橑與車輻間近杠轂則密益逺益疎今北極為天杠轂四七宿為天橑輻以星度度天南方次地星間當數倍今交密何也其後桓譚鄭𤣥蔡邕陸績各陳周髀考驗天狀多有所違梁武帝於長春殿講義别議天體全同周髀之文以排渾天之論又引周髀云成周土中夏至景一尺六寸冬至一丈三尺五寸月令正義引云月猶水日猶火火外光水含景文選注引周髀三禮義宗亦引之書正義周髀之術以為天似覆盆盖以斗極為中中髙而四邉下日月旁行遶之隋經籍志周髀圗一卷唐志趙嬰甄鸞注周髀各一卷李淳風釋二卷厯算類注周髀算經二卷盧肇云即勾股算灋䖍書目趙君卿注并撰序宋太祖時沮梁茂獻方物并周髀一卷二曰渾天形如彈丸地在其中天包其外猶雞白之繞黄桓譚張衡蔡邕鄭𤣥陸續王肅之徒並所依用詳見儀象類鄭𤣥注考靈曜用渾天法云天者純陽清明無形聖人制璣衡以度其象則天本無形體但指諸星運轉以為天耳鄭注四游之極元出周髀之文但日與星辰四游相反天去地十九萬三千五百里晉志吳王蕃制渾儀立論考度宋志王蕃云渾天遭秦亂失其文惟渾天儀尚在􅀱臺入書正義云日月初登於天後于地引王蕃渾天説隋志宋何承天論渾天象體祖暅亦謂信而有徴唐志張衡靈憲圗渾天儀王蕃渾天象注各一卷言其形體渾渾然渾隋志渾天義二卷天圗一卷石氏圗一卷圗記一卷三曰宣夜舊説云殷代之制晉志宣夜無師法惟漢秘書郎郗萌記先師相𫝊云天無質仰瞻髙逺故蒼蒼日月星辰浮生虚空之中其行止皆須氣無所根繫是以伏見無常進退不同若綴附天體不得爾也抱朴子宣夜之書亡書正義虞喜云宣明也夜幽也幽明之數其術兼之故曰宣夜但無師説不知其狀如何四曰昕天讀曰軒言天北髙南下若車之軒吳姚信所説晉志吳太常姚信造昕天論云人形如天頤臨胷項不覆背天之體南低入地北則偏髙冬至極低天運近南夏至極起天運近北隋志昕天論一卷唐志同五曰穹天云穹隆在上虞氏所説晉志虞聳立穹天論天形穹隆如雞子幕其際周接四海之表浮乎元氣之上譬如覆奩抑水而不沒者氣充其中也日繞辰極沒西還東不出入地中天文録虞昺作穹天論唐志缺六曰安天晉虞喜所論晉志成帝咸康中㑹稽虞喜因宣夜之説作安天論天有常安之形地有居静之體光曜布列各自運行葛洪譏之曰辰宿不麗於天天為無用便可言無何云有之而不動乎太平御覽引安天論唐志安天論一卷隋志六卷又有定天論三卷梁有虞喜圗天圗一卷原天論一卷晉志虞喜虞聳姚信皆好竒徇異之説非極數談天者也賀道養渾天記曰近世有四術方天興于王充昕天起于姚信穹天聞于虞昺皆臆斷浮説惟渾天證驗不疑晉元康初建康令魯勝著正天論表上之文選琴賦注列仙𫝊曰涓子齊人著天地人經三才八篇淮南王少得文不能解其音㫖其琴心三篇有條理焉漢太史官日月宿簿史官􅀱注注記九道術後律厯志賈逵論曰臣前上傅安等用黄道度日月􅁌望多近史官一以赤道度之不與日月同於今厯法望至差一日願請太史官日月宿簿及星度課與待詔星象考校奏可案五紀論日月循黄道南至牽牛北至東井率日日行一度月行十三度十九分度七今史官一以赤道為度不與日月行同以今太史官􅀱注考元和二年九月以來月行牽牛東井四十九事無行十一度者行婁角三十七事無行十五六度者如安言案逵論永元四年也至十五年七月甲辰詔造黄道銅儀又論曰今史官推合朔􅁌望月食加時率多不中在于不知月行遲疾治厯李梵鉅鹿公乗蘓統以史官􅀱注考校月行當有遲疾不必在牽牛東井婁角之間又朒朓側匿乃由月所行道有逺近出入所生據官注天度為分率以其術法上考建武以來月食凡三十八事差密近有益宜課試於是修九道術逵又論曰太初厯冬至日在牽牛初者牽牛中星也古黄帝夏商周魯冬至日在建星即今斗星也太初厯斗二十六度三百六十五分牽牛八度案行事史官注又永平中治厯者考行事史官注冬夏至日常不及太初厯五度石氏星經曰牽牛初直斗二十度黄道規也於赤道斗二十一度也四分法與行事􅀱注天度相應尚書考靈曜斗二十二度無餘分太史令􅀱元和二年至永元元年五嵗中課日行及冬夏至斗二十一度四分一合古厯建星與考靈曜日所起它術遂黜延光二年張衡周興參案儀注考往校今以為九道法最密漢安二年邉韶言孝武更建太初改元易朔行夏之正乾鑿度八十分之四十三為日法設清臺之􅀱驗六異課效觕密太初為最虞恭等議洪範五紀論曰民間亦有黄帝諸厯不如史官記之明也熹平四年蔡邕議獲麟漢相去四蔀年數與奏記譜注不相應二年劉洪上七曜術甲辰詔屬太史課效復作八元術劉固等作月食術四年宗紺孫誠上書言術當復改光和二年己未太史令修部舍人張恂等推計行度三年宗整上書言去年三月不食當以四月詔書下太常其詳案注記平議術之要太常就耽上選侍中韓説博士蔡較穀城門􅀱劉洪右郎中陳調於太常府覆校注記平議難問恂久在􅀱部能揆儀度立術數然協厯正紀欽若昊天宜率舊章如甲辰丙申詔書以見食為比遂施行誠術光和二年萬年公乗王漢上月食注自章和元年到今年凡九十三嵗合百九十六食太史令修言漢所作注不與見食相應者二事以同為異者二十九事宋天文志記魏黄初以來星變以續司馬彪晉志古今記注太隋志天文類史注記六卷史天官書曰觀史記考行事百年之中五星無出而不反逆行五行志凡漢著紀日食五十三朔十四晦三十六先晦一日三劉向𫝊上奏曰漢之入秦五星聚孝惠時日食星見孝昭時大星如月西行皆著于漢紀谷永𫝊言建始以來災異鋒起多于春秋所書八世著記久不塞除後五行志注延光四年四月庚申馬融上書言日食曰漢注所載史官占􅀱羣臣密對陛下所觀覽左右所諷誦唐志大衍合朔議考漢元光已來史官注記日蝕有加時者凡三十七事麟徳厯得五開元厯得二十三漢九道法九道術九道議後志永元中復令史官以九道法􅀱􅁌望驗無有差跌賈逵論曰永平中太史待詔張隆以四分法署􅁌望月食加時所署多失梵統以史官􅀱注考校月行所疾處三度九嵗九道一復凡九章百七十一嵗復十一月合朔冬至合春秋三統九道終數可以知合朔􅁌望月食加時以其術法上考建武以來月食凡三十八事差密近案史官舊有九道術廢而不修熹平中故治厯郎宗整上九道術詔書下太史以參舊術相應部太子舍人馮恂課校恂亦復作九道術增損其分與整術並校差為近太史令颺以恂術參􅁌望加時猶復先後天逺則十餘度延光二年亶誦言當用甲寅元梁豐言當用太初張衡周興參按儀注考往校今以為九道法最密詔下公卿議或主甲寅元或主九道尹祉李𢎞等四十人議四分不宜易太尉愷等八十四人宜從太初尚書令忠以為皆未可取正上納其言遂改厯漢安二年邉韶言劉歆驗之春秋參以易道以河圗帝覽嬉雒書乾鑿度推廣九道百七十一嵗進退六十三分百四十四嵗一超次元和韓説等議日循黄道月從九道厯志下曰極建其中道營于内璇衡追日以察歛光道生焉日有光道月有九行九行出入而交生焉前天文志日有中道月有九行中道黄道一曰光道前志三統厯九章百七十一嵗而九道小終九終千五百三十九嵗而大終晉志劉洪參校漢太初三統四分厯術課􅁌望而月行九嵗一終謂之九道九章百七十一嵗九道小終月令正義日有九道考靈曜曰萬世不失九道謀鄭注河圗帝覽嬉云黄道一青赤白黒道各二日春從青道夏赤秋白冬黑見上隂陽厯紀亦見荀悦漢後志厯法北方九十八度四分一西方八十度南方百十二度東方七十五度右赤道度北方九十六度四分一西方八十三度南方百九度東方七十七度右黄道度晉志徐岳議月行九嵗一終謂之九道九章百七十一嵗九道小終九九八十一章五百六十七分而九終進退牛前四度五分學者務追合四分但減一道六十二分分不下通是以疎濶由斗分太多故也唐大衍厯有九道議漢天文七政論後𫝊鄭𤣥著天文七政論方術𫝊楊由習易并七政元氣風雲占􅀱七政日月五星之政元氣謂開闢隂陽之書劉陶著七曜論史律書七正二十八舎索隠曰七正日月五星尚書大𫝊七政謂春秋冬夏天文地理人道所以為政也人道正而萬事順成馬融注書云北斗七星各有所主一曰主日法天二曰主月法地三曰火熒惑四曰土填五曰水辰六曰木嵗七曰金太白日月五星各異政故曰七政尚書大𫝊七政布位日月時之主五星時之紀日月有薄食五星有錯聚七者得失在人君之政故謂之為政又以天地人四時為七政唐書五行類七政厯一卷漢蔡邕星次度數十二次度數魏郡國宿度晉州郡躔次唐星土後厯志劉昭注月令章句曰周天三百六十五度四分度之一分為十二次日月之所躔也地有十二分王侯之所國也毎次三十三度三十二分度之十四日至其初為節至其中為中氣豕韋自危十度至壁八度立春驚蟄衛降婁壁八至胃一水春分雨魯大梁胃一至畢六趙清明穀雨實沈畢六至井十晉立夏小滿鶉首井十至栁三秦芒種夏至鶉火栁三至張十二小暑大暑周鶉尾張十二至軫六處暑立秋楚夀星軫六至亢八鄭白露秋分大火亢八至尾四宋寒露霜降析木尾四至斗六燕立冬小雪星紀斗六至須女二大雪冬至越𤣥枵須女二至危十寒小寒大齊蔡邕分星次度數與皇甫謐不同兼明氣節所在故載焉邕𫝊云好數術天文晉志十二次度數十二次班固取三統厯十二次配十二野其言最詳又有費直説周易蔡邕月令章句所言頗有先後魏太史令陳卓更言郡國所入宿度今附而次之夀星卓謂角亢氐鄭兖也自軫十二度至氐四度辰在辰東郡入角一東平任城山陽角六泰山角十二濟北陳留亢五濟隂氐一東平氐七費直謂起軫七度蔡邕謂起軫六度大火卓謂房心宋豫也自氐五至尾九辰在夘潁川入房一汝南房二沛郡房四梁國房五淮南心一魯國心三楚國房四直謂起氐十一邕謂起亢八析木卓謂尾箕燕幽也自尾十至南斗十一辰在寅凉州入箕中十上谷尾一漁陽尾三西河上郡北地遼東西尾十右北平尾七涿郡尾十六渤海箕一樂浪箕三𤣥莬箕六廣陽箕九直謂起尾九邕謂起尾四星紀卓謂斗牽牛須女呉越􅀭也自南斗十二至女七辰在丑九江入斗一廬江斗六豫章斗十丹陽斗十六㑹稽牛一臨淮女四廣陵牛八泗水女一六安女六直謂起斗六𤣥枵卓謂虛危齊青也自女八至危十五辰在子齊國入虛六北海虛九濟南危一樂安危四東萊危九平原危十一菑川危十四直謂起女六陬訾卓謂營室東壁衛并也自危十六至奎四辰在亥安定入室一天水室八隴西室四酒泉室十一張掖室十二武都壁一金城壁四武威壁六燉煌壁八直謂起危十四邕謂起危十降婁卓謂奎婁胃魯徐也自奎五至胃六辰在戌東海入奎一琅琊奎六髙宻婁一城陽婁九膠東胃九直謂起奎二邕謂起奎八大梁卓謂昴畢趙冀也自胃七至畢十一辰在酉魏郡入􅄧一鉅鹿三常山五廣平七中山一清河九信都畢三趙郡八安平四河間十真定十三直謂起婁十邕謂起胃一實沈卓謂觜參魏益也自畢十二至東井十五辰在申廣漢入觜一越嶲三蜀郡參一犍為三牂柯五巴郡八漢中九益州七直謂起畢九邕謂起畢六鶉首卓謂東井輿􅀑秦雍也自東井十六至栁八辰在未雲中入井一定襄八鴈門井十六代郡二十八太原二十九上黨鬼二直謂起井十二邕謂起井十鶉火卓謂栁七星張周三輔也一曰屬三河自栁九至張十六辰在午𢎞農入栁一河南星三河東張一河内張九直謂起栁五邕謂起栁三鶉尾卓謂軫翼楚荆也自張十七至軫十一度辰在已南陽翼六南郡翼十江夏十二武陵軫十一桂陽軫六零陵十長沙十六直謂起張十二邕謂起張十三度州郡躔次陳卓范蠡鬼谷先生張良諸葛亮譙周京房張衡並云角亢氐鄭兖房心宋豫尾箕燕幽斗牽牛須女吳越􅀭虛危齊青營室東壁衛并奎婁胃魯徐昴畢趙冀觜參魏益東井輿鬼秦雍栁七星張周三輔翼軫楚荆唐地理志闗内道古雍州之域為鶉首實沈鶉火分河南道古豫兖青徐之域為實沈鶉火夀星大火降婁𤣥枵娵訾星紀分河東道古冀州之域為實沈大梁分河北道古幽冀二州之域為娵訾大梁析木津分山南道古梁荆二州之域為鶉尾鶉火鶉首分隴右道古雍梁境為鶉首分淮南道古揚州之域江南道古揚州南境為星紀鶉尾分劍南道古梁州域州三十八總為鶉首分嶺南道古揚州南境為星紀鶉尾分唐天文志初貞觀中李淳風撰法象志因漢書十二次度數始以唐州縣配焉而一行以為天下山河之象存乎兩戒見地理類近代諸儒言星土者或以州或以國虞夏秦漢郡國廢置不同周之興也王畿千里及其衰也僅得河南七縣今又天下一統而直以鶉火為周分則疆埸舛矣七國之初韓魏綿亘數州相錯如繡考雲漢山河之象多者至十餘宿今同在畿甸之中而或者猶據漢書地理志推之是守甘石遺術而不知變通之數也並一行云通典諸國分野具于漢書帝王世記下分區域上配星躔固合同時不應前後當吳之未亡天下列國尚有數十韓魏趙三卿又未為諸侯晉國猶在自吳滅至分晉凡八十六年時既不同若為分配崇文總目地理類開元分野圗一卷星土占一卷漢星經歴法星𫝊唐天文志漢以後表測景晷以求地中分列境界以當星次皆畧依古而又作儀以􅀱天地而渾天周髀宣夜之説至于星經厯法皆出于數術之學前漢志星傳曰日徳月刑故日食修徳月食修刑五行志亦引星𫝊天文志注晉灼引星經𫝊續漢志注引星經曰六十郡九州所領自有分而名禮秋官疏案星經角有大民小民之星史記正義引天官占星經晉志引星𫝊曰日陽君象也星隂臣道也案劉向説天官列宿在位之象其衆小星無名者衆庶之類翟方進好天文星厯其星厯則長安令田終術師也唐檀好災異星占漢荆州占晉志圗緯舊説及漢末劉表為荆州牧命武陵太守劉叡集天文衆占名荆州占其雜星之體有瑞妖客流星瑞妖日傍氣隋志荆州占二十卷唐志劉表荆州星占二卷劉叡荆州星占三十卷崇文目荆州劉石甘巫占一卷後漢志注引荆州星經周禮疏按武陵太守星𫝊云角有大民小民文昌第一曰上將又案石氏星𫝊晉志引荆州占云老子星淳白周伯星黄色太平御覽引荆州星占史記索隠引荆州占乾象新書引髙宗占荆州占夏氏占董仲舒京房對災異海中占巫咸郗萌甘徳石申陳卓陶隠居又引星讚大象占焦延壽韓楊趙㽔長短經廣古今占玉海卷二
