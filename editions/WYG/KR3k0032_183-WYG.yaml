body:
  text: 玉海卷一百八十三宋王應麟撰食貨府庫武庫附周官有太府内外天玉泉府而無掌庫之官蓋府庫通言曲禮在府言府在庫言庫天有天庫藏府之星軫南衆星曰天庫金十六星天之武庫商六府曲禮天子之六府曰司土司木司水司草司器司貨典司六職注此殷時制也周則皆属司徒司土土均也司木山虞也司水川衡也司草稻人也司器角人也司貨卝人也大禹謨六府水火金木土榖湯武五庫月令季春之月命工師令百工審五庫之量金鐵皮革筋角齒羽箭幹脂膠丹漆毋或不良蔡邕月令章句曰一曰車庫二曰兵庫三曰祭器庫四曰樂庫五曰宴器庫樂記武王克殷車甲衅而藏之府庫而弗復用商子湯武既破桀紂天下大定築五庫藏五兵偃武事行文教周官職金有兵器之府淮南子楚有高庫之兵周九府管氏九府書漢志太公為周立九府圜法注周官太府玉府内府外府泉府天府職内職金職幣六府在太宰泉府地官天府春官職金秋官周禮大府下大夫二人上士四人下士八人為王治藏之長若今司農掌九貢九賦九功之貳以受其貨賄之入頒其貨金玉曰貨于受藏之府若内府也頒其賄布帛曰賄于受用之府若職内也凡官府都鄙之吏及執事者受財用焉凡頒財以式法授之關市之賦以待王之膳服邦中之賦以待賔客四郊之賦以待稍秣家削之賦以待匪頒邦甸之賦以待工事邦縣之賦以待幣帛邦都之賦以待祭祀山澤之賦以待喪紀幣餘之賦以待賜予凡邦國之貢以待弔用凡萬民之貢以充府庫凡式貢之餘財以供玩好之用凡邦之賦取具焉歳終則以其貨賄之入出㑹之淮南道應訓曰楚有太府之貨是楚亦有太府也玉府上士二人中士四人掌王之金玉玩好兵器凡良貨賄之藏共王之服玉佩玉珠玉天子佩白玉而𤣥組綬佩玉上有葱衡下有雙璜衝牙蠙珠以納其間服玉冠飾十二玉王齊則共食玉合諸侯則其珠槃玉敦凡王之獻金玉兵器文織良貨賄之物受而藏之凡王之好賜共其貨賄獸人皮毛筋骨入于玉府􅈄人凡􅈄征入于玉府澤虞守其財物以時入于玉府㕓人則斂其皮角筋骨逐師則入野職野賦職金則入玉石丹青内府中士二人主良貨賄藏在内者掌受九貢九賦九功之貨賄良兵良器以待邦之大用凡四方之幣獻之金玉齒革兵器凡良貨賄入焉凡適四方使者共其所受之物而奉之凡王及冢宰之好賜予則共之典婦功共王及后之用頒之于内府外府中士二人主泉藏在外者掌邦布之入出以共百物而待邦之用凡有法者共王及后世子衣服之用凡祭祀賔客㑹同軍旅共財用之幣齎賜予之財用凡邦之小用皆受焉歳終則㑹惟王及后之服不㑹注布泉也之其藏曰泉其行曰布有法百官公用也泉始一品景王鑄大泉而有二品泉府上士四人中士八人下士十有六人掌以市之征布斂市之不售貨之滯於民用者以其賈買之物楬而書之以待不時而買者各從其抵都鄙從其主國人郊人從其有司然後予之凡賖者祭祀無過旬日喪紀無過三月凡民之貸者與其有司辨而授之以國服為之息康成以莽制擬國服凡國事之財用取具焉歳終則㑹其出入而納其餘司市以泉府同貨斂賖㕓人斂㕓布入泉府珍異有滯者斂而入膳府天府上士一人中士二人言天者尊此所藏若天物然掌祖廟之守藏與其禁令祖廟始祖后稷之廟其寳物世𫝊守之若魯寳玉大弓者凡國之玉鎮大寳器藏焉若有大祭大喪則出而陳之既事藏之凡官府鄉州及都鄙之治中鄭司農云治中謂其治職簿書之要受而藏之以詔王察羣吏之治上春釁寳鎮及寳器季冬陳玉以正來歳之媺惡若遷寳則奉之若祭天之司民司禄司民軒轅角也司禄文昌第六星或曰下能而獻民數榖數則受而藏之鄉大夫鄉老及鄉大夫羣吏獻賢能之書于王再拜受之登于天府大司冦盟書登于天府小司冦及大比登民數自生齒以上登于天府又司民内史司會冢宰貳之又歳終獄訟登中于天府職内上士二人中士四人注若今少内掌邦之賦入辨其財用之物而執其總總其凡目之書以貳官府都鄙之財入之數總者其要數者其詳也執要御詳以逆邦國之賦用凡受財者受其貳令而書之貳令若今御史所寫下本奏王所可者書之及㑹以逆職歳與官府財用之出而叙其財以待邦之移用大府注受用之府若職内職幣上士二人中士四人掌式法以斂官府都鄙與凡用邦財者之幣振掌事者之餘財皆辨其物而奠其録以書楬之以詔上之小用賜予歳終則㑹其出凡邦之㑹事以式法賛之司書叙財受幣入于職幣職歳凡上賜予以叙與職幣授之職金上士二人下士四人掌凡金玉錫石丹青之戒令受其入征者辨其物之媺惡與其數量楬而璽之入其金錫于為兵器之府入其玉石丹青于守藏之府守藏府玉府内府也入其要入于大府旅于上帝則共其金版饗諸侯亦如之槀人掌受財于職金以齎其工爾雅九府與漢書注異醫無閭之珣玗琪㑹稽之竹箭梁山之犀象華山之金石霍山之珠玉崑崙之璆琳琅玕幽都之筋角斥山之文皮岱岳之五榖魚鹽通典太公立九府之貨史記吾讀管氏輕重九府注劉向别録曰九府書民間無有索隠曰錢之府藏其書論鑄錢之輕重鹽鐵論文學曰管仲設九府徼山海周五府列子周穆王築中天之臺五府為虚而臺始成左傳晉軍府成七年注軍藏府也魯長府昭二十五年魯有府人楚高府襄十六年鄭襄庫襄三十年人鄭有府人庫呂氏春秋荆葉公發太府之貨予衆出高庫之兵以賦民周酒府天官酒人凡事共酒而入于酒府注入于酒正之府者是王燕飲之酒酒正當奉之漿人共王之六飲水漿醴涼醫酏入于酒府注亦酒正當奉之魯大庭氏庫禮誦訓道方志注若魯有大庭氏之庫左傳昭五年攻諸大庫之庭注魯城内有大庭氏之虚於其上作庫昭十八年五月壬午宋衛陳鄭火梓慎登大庭氏之庫以望之注大庭氏古國名在魯城内魯於其上作庫高顯故登以望氣正義先儒云炎帝神農氏一曰大庭氏大庭嘗都於魯漢郡國志魯國有大庭氏庫詩正義詩譜云魯國中有大庭氏之庫則大庭氏亦居茲乎漢御府史文紀發御府金錢賜張武以愧其心三王世家虚御府之藏以賞元戎百官表少府属官有御府尚方等七官令丞注師古曰主天子衣服也霍光使中御府令高昌食貨志武帝解乘輿駟出御府禁臧宣紀賜御府衣入未央宫列𫝊賈山至言發御府金賜大臣宗族李尋待詔黄門食大官衣御府谷永元延元年對曰臣願陛下勿許加賦之奏益減太官導官中御府均官掌牲廪犧用度止尚方織室京師郡國工服官發輸造作以助大司農王莽傳長樂御府中御府及都内平準帑臧錢帛珠玉甚衆後百官志御府令一人六百石典作衣服宦者黄瓊𫝊上䟽曰尚方御府息除煩費楊賜𫝊賜御府衣魏楊阜遷少府召御府吏問後宫人數秦始皇三十六年使御府視璧漢武庫令高帝紀七年二月蕭何治未央宫立武庫太倉黄圖武庫在未央宫史記樗里子𫝊漢長樂宫在東未央宫在西武庫正直其墓墓在渭南章臺之東百官表武庫属中尉執金吾有令丞専主兵器而天子又自有若盧以藏兵器考工室以主作器械考工令主作兵器弩弓鎧之属器成則傳執金吾入武庫食貨志武帝時擊南粤西羌邊兵不足發武庫工官兵器以澹之列𫝊叔孫通論恵帝作復道築武庫南田蚡嘗請考工地益宅上怒曰君何不遂取武庫毋將隆當哀帝時為執金吾上使中黄門發武庫兵前後十輩送董賢及乳毋王阿舎隆奏言武庫兵器天下公用國家武備繕治造作皆度大司農錢大司農錢自乘輿不以給共養勞賜一出少府别公私示正路也京師有武庫掌於中尉又有若盧藏兵器考工室作器械以少府主之而武庫兵以大司農錢為之古者諸侯方伯得顓征伐廼賜斧鉞漢家邊吏職在距冦亦賜武庫兵皆任其事然後蒙之春秋之誼家不藏甲請收還武庫杜欽以王鳯奏為大將軍軍武庫令職閒無事欽所好也楊僕武帝責以武庫日出兵而陽不知戾太子據出武庫兵燕王旦詐言以受詔領庫兵飭武備成紀建始元年正月立河間王弟上郡庫令良為王注如淳曰漢官北邊郡庫官之兵器所藏故置令上郡庫令亦緑邊之特置庫者習郡國庫兵蓋以筭賦錢充之亭長亦設備之兵見後漢百官志注西京賦武庫禁兵設在蘭錡申屠聖之反於潁川也亦盜庫兵陽朔三年六月廣漢鄭躬鴻嘉三年十一月山陽蘇令永始三年十二月皆盜庫兵後官志武庫令漢雒陽武庫魏相𫝊田千秋子為雒陽武庫令霍光曰武庫精兵所聚故用丞相子為令吳王濞𫝊桓將軍曰疾西據雒陽武庫阻山河之險以令諸侯天下定矣周亞夫𫝊趙渉遮說曰將軍從此右去走藍田出武關抵雒陽直入武庫擊鳴鼓諸侯聞之以為將軍從天而下史記齊王閎世家上曰洛陽有敖倉武庫褚先生云後堅鐔𫝊與朱鮪戰洛陽武庫下注洛陽記建始殿東有太倉倉東有武庫藏兵之所世祖初即位時已有之馬嚴𫝊顯宗拜將軍長史將兵屯西河敕嚴過武庫祭蚩尤帝親御阿閣觀之後天文志奎主武庫兵晉志奎十六星天之武庫庫隋志星有天兵車之府五行志光和元年蔡邕對曰武庫禁兵所藏東垣庫之外障輿服志輕車建矛㦸幢麾􅞙輒弩箙藏在武庫李尤武庫銘搏噬爪牙鋒距之先毒螫芒刺矛矢以存聖人垂象五兵以陳漢靈金内府三輔黄圖高祖斬白蛇劍藏於寳庫恵帝即位以此庫貯禁兵器名曰靈金内府又見劍類漢委府後百官志餘均輸等皆省注鹽鐵論大夫曰往者郡國各以物貢輸往來煩雜物多苦惡故郡置輸官曰均輸開委府于京師以籠貨物賤則買貴則賣是以縣官不失實商賈無所利曰平準漢少府見官制百官表少府掌山海池澤之稅以給共養詹事屬官私府長一人丞一人後百官志凡山澤陂池之稅名曰禁錢屬少府世祖改属司農中宫私府令一人六百石主中藏幣帛丞一人史記太倉公傳齊中御府長信路温舒傳遷廣陽私府長注師古曰藏錢之府天子曰少府諸侯曰私府田叔𫝊魯王發中府錢注王之財物藏也闕𫝊館陶公主令中府注掌金帛之臧梁王𫝊鴻嘉中梁太傅奏收兵杖藏私府文翁𫝊減省少府用度買刀布蜀物齎計吏以遺博士注師古曰少府郡掌財物之府以供太守者也魏楊阜𫝊上䟽曰昔邵信臣為少府於無事之世而奏罷浮食中少府王昌韓勲漢少内又見錢幣丙吉𫝊少内嗇夫白吉注師古曰少内掖庭主府藏之官也淮南時則訓六月官少内周禮職内注若今泉所入謂之少内䟽案王氏漢官解云小官嗇夫各擅其職謂倉庫少内嗇夫之屬少内藏聚似今之少府但官卑職碎以少為名表内官長丞初属少府中属主爵後属宗正内官長賜見於眭孟之𫝊内官有獄見於東方朔𫝊律厯志度者分寸尺丈引職在内官廷尉掌之史景紀中六年四月以大内為二千石韋昭云大内京師府藏置左右内官索隠主天子私財曰少内正義謂主天子私財物曰少内屬大内見官名漢中黄藏府桓帝紀建和元年五月芝草生中黄藏府注漢官儀曰掌中幣帛金銀諸貨物官志少府屬官有中藏府令一人秩六百石丁孚漢儀中官藏令秩千石比御府令韋彪傳中藏府受賜錢二十萬段紀明𫝊敕中藏府調金錢綵物助軍費王莽𫝊黄門鈎盾臧府文選注曹植令曰皇帝損乘輿之副竭中黄之府晉志少府統中黄左右藏等令魏御府魏志王觀𫝊少府統三尚方御府内藏玩弄之寳楊阜𫝊上䟽欲省宫人乃召御府吏問後宫人數吏守舊令對曰禁宻不得宣露魏白藏庫左思魏都賦白藏之藏富有無隄同賑大内控引世資賨幏積墆琛幣充牣闗石之所和鈞財賦之所底慎注張載曰白藏庫在西城下有屋一百七十四間秋為白藏因以為名大内京邑都内寳藏也漢淮南王曰越人貢財之奉不輸大内曹毗魏都賦白藏之庫戎儲攸歸晉武庫紀恵帝永平五年冬十月武庫火焚累代之寳十二月丙戌新作武庫五行志元康五年閏月庚寅武庫火張華疑有亂先命固守後救火是以累代異寳王莽頭孔子履漢高祖㫁白蛇劒及二百萬人器械一時蕩盡華見劒穿屋而飛莫知所向又曰武帝太康五年正月癸卯一云己亥龍二見於武庫井中紀同孫盛謂武庫帝王威御之器所寳藏非龍所處魏嘉平四年五月有二魚集于武庫屋上太康中鯉魚二見武庫屋上干寳以為武庫兵府魚有鱗甲亦兵類職官志衛尉統武庫令馬隆𫝊為武威太守請自至武庫選仗武庫令與隆忿爭摰虞有武庫銘吳志注張紘見陳琳作武庫賦應機論深歎美之隋左藏院隋書開皇九年以江表新定給復十年餘州並免當年租賦明年又以宇内無事益寛徭賦十二年有司上言府皆滿無所容積於廊廡帝曰朕既薄賦於民又大經賜用何得爾對曰入有常多於出畧計毎歳賜用至數百萬段曽無減損於是闢左藏院以受之詔曰寧積於人無藏府庫河北河東今年田租三分減半功調全免六典注齊梁陳有右藏無左藏北齊太府寺統左右藏令丞後周有外府隋有左藏令丞晉少府属官有左右藏令東晉有庫曹御史復分庫曹置外左庫内左庫唐左藏庫右藏庫六典左藏令掌庫藏之事左藏有東西庫朝堂庫又有東都庫東都朝堂庫掌木雌契一與太府主簿合之右藏令掌寳貨之事隋太府寺統右藏令丞皇朝因之右藏有内外庫東都庫各木雌契一隻與太府主簿合之太府卿諸州庸調折租等物送京者貯左藏其雜送物並貯右藏舊紀貞觀五年正月己卯幸左藏庫賜三品以上帛天寳八載二月戊申引百官入左藏庫縱觀錢幣賜絹而歸十一載八月己丑幸左藏庫賜羣臣帛有差楊炎𫝊舊制天下財賦皆入左藏庫百官志金部掌天下庫藏出納田令孜𫝊僖宗發左藏齊天諸庫金幣楊慎矜𫝊父楊隆禮開元初為太府卿時御府財物羨積如丘山隆禮出納尋尺自按省無不精麗𤣥宗開元十九年正月二十八日敕左右藏太倉以御史監知出納陸贄曰度支出納與太府交相關制出物旬計見物月計符按覆覈有御史董之凡是太府出納皆禀度支文符唐武庫百官志庫部掌武庫器仗兵部長官涖其修完衛尉有兩京武庫令各二人丞各二人掌藏兵械開元二十五年東都亦置武器令一人丞二人掌外戎器祭祀廵幸則納於武庫貞觀中東都亦置少府監凡武庫袍襦皆識其輕重乃藏之左校令供兵械中校令供兵械軍器監掌繕甲弩以時輸武庫六典云北都軍器監劉黒闥𫝊秦王大弓長矢藏之武庫世世寳之張說𫝊久視中說言太倉武庫並在都邑紅粟利器藴若山丘六典武庫令藏兵仗器械辨其名數注周禮有司甲司弓矢司兵司戈盾即武庫之任五隋尚書省有武器監令唐永徽中始置開元三十年置東都武庫武天寳中東都置器所㑹要開元十一年五月五日置北京軍器庫二十六年五月十八日廢依舊為甲坊乾元元年六月十三日軍器監改為軍器使以内官為之貞元四年三月自武徳東門築垣約左藏庫之北屬宫城東垣於是武庫遂廢其軍戎器械𨽻軍器使貞觀政要四年房𤣥齡奏今閱武庫甲仗勝隋日遠矣太宗曰卿等存心治國務盡忠貞使百姓安樂便是朕之甲仗陸贄奏議虚内廐之馬竭武庫之兵唐神䇿庫見兵制唐維城庫宗室𫝊開元後皇子幼多居宫内既長詔附苑城為大宫分院而處號十王宅又諸孫多則於宅内置百孫院禁中置維城庫以給諸王月奉此承平制云或謂約諸王廪入而上下均其用唐大盈庫志天寳後王鉷為戸口色役使歳進錢百億萬緡非租庸正額者積百寳大盈庫以供燕私故事天下財賦歸左藏大府上其數比部覆其出入肅宗時豪將假取不能禁第五琦為度支請皆歸大盈庫供天子給賜主以中官自是為人君私藏有司不能程其多少大厯元年斂天下青苖錢四百九十萬緡輸大盈庫憲宗時劉闢李騎平訾藏皆入内庫憲宗出内帑所餘詔度支評直列𫝊楊炎為相舊制天下財賦入左藏第五琦悉進大盈内庫天子以取給為便宦官持簿奉給炎言於徳宗請出之以歸有司度宫中經費量數奉入帝從之乃詔歳中裁取以入大盈度支具數先聞會要二詔皆歸左藏庫毎歳量進三十萬貫入大盈庫支先以全數聞奏舊制財賦皆納左藏庫而太府四時以數聞陸䞇徳宗於行在夾廡書瓊林大盈二庫别藏貢物䞇諫以為瓊林大盈於古無傳舊老皆言開元時貴臣飾巧以求媚貢獻悉歸天子終以餌冦帝悟即撤其題李泌𫝊請天下供錢歳百萬給宫中勸不受私獻裴延齡言左藏天下歳入不貲請列别舍析為負庫賸庫季庫月庫帝可之永貞初度支言别庫分藏正物無實益而有吏文之煩詔復還左藏唐内府宦者𫝊有五局五曰内府主中藏給納有令丞陸贄奏議裴延齡於左藏之内分建六庫之名意在别貯贏餘以奉人主私欲楊炎𫝊至徳後四方貢獻悉入内庫唐諸司甲庫關播𫝊遷給事中故事諸司甲庫以令史直曹刓脫為姦播悉易以士人時韙其法會要貞元十三年正月云云唐三庫㑹要太和九年十二月勅中書門下吏部各有甲厯名為三庫以防姦偽今請改轉授官先下三庫委給事舎人郎中檢勘唐延資庫備邊庫備邊録食貨志㑹昌末㑹要五年九月置備邊庫收度支户部鹽鐵錢物宣宗㑹要大中三年十月更號延資庫初以度支郎中判之至是四年八月以屬宰相白敏中崔鉉相繼判其任益重户部歳送錢帛二十萬度支鹽鐵送者三十萬㑹要同諸道進奉助軍錢皆輸焉通鑑㑹昌五年九月太尉徳􅁉請置令户部歳入錢帛十二萬緡疋度支鹽鐵歳入十三萬緡疋咸通五年七月延資庫使夏侯孜奏户部每年合送二十六萬四千一百八十五緡匹明年減其三之一凡諸道所進助軍財貨皆入焉以度支郎中判之大中三年十月改曰延資庫四年八月以白敏中判之其後夏侯孜杜琮曹確王繹李徳􅁉又有西南備邊録十三卷宣宗嘗私行經延資庫見廣厦連綿錢帛山積問左右曰誰為此庫對曰李徳􅁉執政以天下每歳備用之餘盡實於此自是以來邊廷有急支用不乏茲實賴用南詔𫝊盧攜奏宣宗收三州七關平江嶺以南至大中十四年内庫資積如山户部延資充滿百官志宰相甚則為延資庫使乾徳講武殿内庫太平興國内藏庫景福内庫崇政殿庫即講武殿太祖削平諸國收其帑藏充内府乾徳中府庫充溢上曰軍旅饑饉當為之備不可臨事厚斂乃於講武殿廊别為内庫以貯金帛凡歳終用度贏餘之數皆入焉號曰封樁庫長編附三年平蜀後太宗太平興國三年十月分左藏北庫為内藏庫置使并以講武殿後封樁庫屬焉改封樁庫為景福内庫初太祖别置封樁庫嘗宻謂近臣曰欲俟斯庫所蓄滿三五十萬遣使與契丹約茍歸我土地民庻則當以金帛充贖直如不可則散財募士以圖攻取太宗初即位幸左藏語輔臣曰金帛如山用何能盡於是分為内藏至道二年七月詔河北淮南山南東道京東江南絹並納内藏歳入不過錢百餘萬緡銀十餘萬兩太宗用劉蒙正掌内藏二十年東京記云國初置景福内庫興國三年改名内藏相對有封樁庫景徳四年賜名内藏西庫四月壬辰徙新衣庫為之别有景福殿庫𨽻焉祥符八年分内藏為四庫志内藏庫天子之别藏也縣官有鉅費左藏之積不足給則發内藏佐之職官志内藏庫在銀臺門外又有西庫景福殿庫𨽻焉以諸司使副為監官内侍一人㸃檢蓋周官内府漢少府禁錢也東京記所云封樁庫乃真宗别以新衣庫地為之實録景徳四年四月壬辰徙新衣庫以其地為内藏西庫非太祖時封樁庫也别有景福殿庫又恐非太宗所改景福内庫今但以食貨志為據更俟考詳惟内府之興自先朝之畫莭用於已圖儉於豐收六尚之羨贏為九年之備豫祖宗盛時止收經費之餘或坊場課利不以多寡初無定額時以州郡上供撥入而不齊集守藏之臣每以為言上亦不察察也内藏歳入金帛皇祐中二百六十五萬七千十一治平中一百九十三萬三千五百五十四真宗咸平元年上嘗幸景福殿庫閱金帛謂左右曰此庫金帛雖多朕不敢私用自今非時取索並經三司出納景徳四年八月壬寅幸内藏庫十月乙巳内出龍圖待制陳彭年所撰内藏庫記示宰臣王旦等曰太祖已來有景福内庫太宗改名内藏所貯金帛備軍國之用非自奉也二聖削平諸國親祀郊丘所費鉅萬皆出於是不取於民三司所假凡六千萬自淳化迄景徳每歳多至三百萬少亦不下百萬累年不能償即蠲除之昨令彭年述其事此庫乃為計司備經費耳且計司有缺必取之民非節用何以濟祥符二年四月戊戌提舉劉承珪新修庫簿一云都帳出納周宻詔奬之賜馬及器幣四年九月陳彭年表請上作内藏庫銘九月壬申作銘王旦曰陛下述先聖制度皆節儉愛民之㫖可以垂訓無窮承規掌是庫三十年檢察精宻動著條式故作銘寵之即承珪也五年十一月丙午承珪編宣敕條貫為須知五卷詔褒之六月癸丑發禁錢佐邊糴粮八年八月五日再幸庫天聖四年十月辛巳出緡錢二十萬糴軍儲慶厯元年五月甲子出内藏緡錢一百萬助軍費二年六月甲戌出銀帛給邊費皇祐二年閠十二月丙辰出錢帛助河北軍儲四年七月乙巳亦如之至和二年十月乙未出錢百萬糴軍儲十一月丙辰出帛三十萬市糴其出以助經費前後莫可勝數至於儲積贏縮有司莫得詳嘉祐元年七月己丑出内藏銀絹三十萬賑貸河北三年十月乙巳同四年出錢助糴常平六年九月癸丑出緡錢一百萬助糴熙寧二年正月十九日神宗語大臣曰太宗時内藏財貨每一千計用一牙錢記之每物不同所用錢色亦異他人莫能曉常匣而置之御閤以參驗帳籍定數晚年出錢以示真宗曰善保此足矣景祐四年正月内藏庫言自天禧三年歳斥緡錢六十萬以助三司祥符九年正月癸亥發内藏錢給三司即詔毋得更貸而明道末距今纔四年所貸錢帛凡九百十七萬請申以舊詔甲午從之然三司切於用緩急不能無請上亦無所吝太平興國中令玉工治美玉為牒冊寘崇政殿庫祥符元年封禪取而用之太平興國左藏庫三庫淳化左右庫在左長慶門内東廊受天下金銀錢帛給邦國之用國初止為左藏一庫太平興國二年正月丙寅分為絲綿金銀疋帛三庫置合同憑由印淳化三年分置左右藏各二庫右藏受之左藏給之俟右藏既盈即復以給凡六庫迭為受給四年廢右并之於左分為四庫曰錢金銀曰絲綿曰生帛疋帛曰雜色疋帛祥符二年併錢金銀絲綿為一庫七年又併生帛雜色二庫為生熟疋叚庫又以祗􅀱庫宣索之物件併入以京朝官諸司使副三班内侍監庫舊兩庫三人後減四人通掌别以三班二人監門祥符以來併為南北兩庫奏祥符八年八月壬辰幸左藏内藏韓琦監左藏復𫝊宣合同一司以相防察罷内臣監受綱運以革稽留之弊慶厯二年五月乙丑罷左藏庫月進錢千二百緡政和六年閏正月建新庫以東西庫為名實録興國二年正月丙寅命賈黄中程能馮瓚分掌三庫先是貨泉與金帛通掌至是以帑藏充溢始命分之漢有中藏晉有左右藏唐有左藏庫以太府少卿知左藏出納自晉始也紹興二十二年作左藏庫二十七年選丞簿為轄官乾道七年始顓置淳熈中左藏幇三衙百官請給約計三千萬緡但合同憑由司歳取金銀錢帛率以百萬計版曹照數除破熈寧二年六月一日詔左藏歳撥金三百兩銀五十萬兩入内藏淳熈末兩浙歳輸在内藏庫錢至千二百萬緡祥符尚衣庫内衣庫在天寧門内掌乗輿衮冕鎮圭服御繖扇筤駕頭之名物祥符二年七月戊寅改為尚衣庫内衣物庫在文徳殿後掌時服給受初為衣庫開寳三年四月命趙孚監之後改熈寧四年六月戊寅併尚衣庫於内衣物庫仍改為尚衣庫新衣庫掌錦綺雜帛在太平坊熈寧四年五月廢御前甲庫紹興中置百工技藝萃焉二十九年冬罷之康定奉宸庫宜聖殿五庫在延福宫一曰宜聖殿内庫二曰穆清殿庫三曰崇聖殿庫四曰真珠庫五曰崇聖樂器庫康定元年九月合為一改今名掌珠寳金銀領以内臣鑄印給之慶厯四年二月丙申出奉宸庫銀下陜西糴榖麥振饑皇祐五年以良玉作神寳熈寧元年十月乙卯出珠二千三百四十萬買馬河北真宗嘗使郭皇后觀宜聖殿諸庫后辭曰國之寳庫非所當入寳元二年十一月戊子朔出禁中真珠賜三司助糴邊儲志太府寺受財賦之入則歸左藏内藏庫金玉良貨賄則歸奉宸庫賜予則歸祗􅀱庫在横門外香藥寳石則歸内香藥庫在謻横門外南廊凡二十八庫舊在内中天禧五年六月徙茗布雜物皆有庫太宗用劉蒙正掌内藏二十年康定神御庫康定元年十二月甲午十三日判太常宋祁言太廟藏神御及㳂寶法物已滿夾室廟壖狭不可更為藏室請於宗正寺西偏别建神御庫命宗寺領之周禮天府掌祖廟守藏寳物世𫝊者皆在唐太常有天府御衣院興國二年置朝服法物庫分三庫一在大慶殿後一在右掖門内北廊一在正陽門外西廊掌百官朝物儀仗景徳四年置玉津園南郊庫元豐庫元祐庫神宗憤北狄倔强有復幽燕之志於景福殿内帑庫聚金帛自製四言詩一章曰五季失圖玁狁孔熾蓺祖造邦思有懲艾爰設内府基以募士曽孫保之敢忘厥志每庫以詩一字目之儲積皆滿又别置庫賦詩二十字分掲其上曰每䖍夕􅅥心妄意遵遺業顧予不武姿何日成戎捷庫在崇政殿後張舜民曰設二十四庫親制庫銘二詩與太祖之意合欲先取靈夏滅西羌乃圖北伐也元豐元年始更庫名三年於司農寺南創元豐庫幾百楹四年正月十八日中書門下言元豐庫已興脩五年三月十一日詔司農趣常平坊場錢五百萬緡輸元豐庫十月壬申二十五日詔户部右曹發十二路京東等常平錢八百萬緡輸之凡山海坑冶等利皆貯焉元祐三年正月丁巳九日改封樁錢物庫為元祐庫𨽻左右司三月乙丑十八日改元豐元祐庫為元豐南北庫五月丙辰併北庫錢物于南庫總名元豐六年九月詔歳出内庫五十萬緡赴元豐庫樁管助邊後有崇寧庫大觀庫貯坑冶所入大觀西庫貯錢不見初置年月㑹要真宗御製詩為庫額曰每歳沉檀來遠裔累朝珠玉實皇居今辰内府初開處充牣尤宜史筆書宋朝軍器五庫見兵器軍器五庫在崇政殿東横門外掌禁兵器衣甲槍弩箭各為一庫又有什物庫在清平坊淳化二年置揀選衣甲器械庫在内弓箭庫門内祥符元年正月甲子内職射于軍器庫太祖討澤潞維􅀭下荆廣川峽征河東平江南命魏丕先期治兵器無不精銳天聖八年六月癸未朔試武舉人弓馬於軍器庫熈寧六年七月甲寅置内弓箭南庫儲御前所製軍器命官提舉曽鞏政要䇿云弓矢取睽始見於經周官考工五兵之法詳矣太祖命魏丕主作每造兵器十日一進謂之旬課上親閱之作治之巧盡矣國工有南北作坊歳造甲鎧具裝鎗劒刀鋸器械箭箶簏皮笠弩橦床子弩凡三萬二千又有弓弩院歳造弓弩箭絃鏃等凡千六百五十餘萬諸州歳造弓弩箭劒甲鍪鏃等凡六百二十餘萬又别造什器凡諸兵械置五庫以貯之戎具精勁近古未有景徳中以歳造之器可支三十年遣秦翰閱武庫所聚權罷作治周邦彦汴都賦云割蛟革以連函剫兕觡以為弭剸魚服以懷鍔百工備盡霜凝電爍故有彊衝勁弩雲梯䡴車修鎩延鏦銛戈兌殳繁弱之弓肅慎之矢谿子之弩夫差之甲龜蛇之旐鳥隼之旟軍事蚤正用戒不虞樞宻院有機要庫見神宗御集類建隆二年十一月丁巳令州縣置勅書庫建炎内軍器庫建炎四年二月一云八月十日以軍器衣甲内弓箭南内外七庫併為一名曰内軍器庫紹興二年五月十二日什物庫亦併入兵百四十八人為額七年正月一日宻院請置軍器局于建康十一月罷乾道五年十二月十二日重修内軍器南庫紹興左藏南庫乾道封樁庫紹興休兵後取户部窠名可必者盡入御前樁管激賞庫士大夫指為瓊林大盈之比紹興四年二月丙午張浚至行在詔浚隨行錢物𨽻内藏為封樁激賞庫三十二年四月己亥詔從臣條具足食足兵之䇿禮侍黄中請用唐楊炎之䇿歸之左藏孝宗受禪諌官袁孚言之七月癸丑遂改内藏激賞庫為左藏南庫然移用皆自朝廷不𨽻版曹為經費淳熈末始併歸户部十年八月二十八日尚書王佐奏無益有損請歸封樁不從十二年正月三日以左藏西上庫為名諸路歳發錢一百九十八萬餘緡紹熈元年十月二日改為封樁下庫仍𨽻户部乾道六年建左藏封樁庫于都省門内其法非奉親非軍需不支逺遵蓺祖景福内庫之遺意顓以為軍旅之備淳熈末徃徃以犒軍或造軍器為名撥入内庫有司不敢執十六年六月光宗命有司稽考以聞開禧元年三月議臣請節用以實封樁乾道備邊庫乾道六年二月五日臣寮言銀坑興發價平宜令諸路監司隨宜收買别立庫以備邊為名緩急支用以代楮幣從之嘉定安邊庫嘉定元年閏四月二日户侍沈詵等條具估籍田産命有司掌之歳收所入貿金増充歳遺名曰安邊所以彦橚主管安邊庫七月陞提領二年九月五日詵等言金銀錢楮總九百十三萬貫田産稅賦等歳收七十萬貫玉海卷一百八十三
