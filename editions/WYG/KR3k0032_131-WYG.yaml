body:
  text: 玉海卷一百三十一宋王應麟撰官制諸侯官制周官施典于邦國而建其牧立其監設其參傅其伍陳其殷置其輔謂諸侯之國魯四代官明堂位虞氏官五十夏后氏官百商二百周三百凡四代之官魯兼用之注周三百六十官此云三百者記時冬官亡矣有虞官宜六十夏宜百二十殷宜二百四十周官唐虞建官惟百夏商官倍注禹湯建官二百正義魯是諸侯按大宰職諸侯惟有三卿五大夫故公羊傳司徒司空之下各有二小卿司馬之下一小卿是三卿五大夫也成王褒魯四代官中雜存官職名號使魯有之非謂盡備其數但記者盛美於魯左傳昭四年杜洩曰夫子叔孫聘于王王賜之路復命而致之君使三官書之吾子季孫為司徒實書名夫子叔孫為司馬與工正書服孟孫為司空以書勲夏父弗忌為宗伯公羽父求大宰昭臧氏為司㓂射孔子以司㓂相魯鉏為左宰十三年司鐸注魯大夫司歴禮太宰施典邦國設其參傅其伍注卿三人大夫三人以三卿之屬大夫兼大宰司㓂之事酒誥正義圻父農父宏父諸侯三卿大史内史康叔國大夫立政司徒司馬司空亞旅注三卿及次卿衆大夫舉文武之初為法則魯博士史記循吏傳公儀休者魯愽士也以髙第為魯相魯史官漢藝文志仲尼以魯周公之國禮文備物史官有法故與左丘明觀其史記據行事仍人道云云丘明論本事而作傳晉職官五正六官六正執秩左傳隠六年翼九宗五正定四年祝佗曰分唐叔懷姓九宗唐之餘民職官五正注九宗一姓為九族五正五官之長正義殷時為五行官長成二年司馬司空輿帥􅀱正亞旅十八年二月乙酉悼公即位使魏相士魴魏頡趙武為卿荀家荀㑹欒黶韓無忌為公族大夫士渥濁為太傅右行辛為司空弁糾御戎荀賔為右卿無共御立軍尉攝之祁奚為中軍尉國語云元尉羊舌職佐之魏絳為司馬張老為􅀱奄國語云元􅀱􅀱襄十九年輿帥奄鐸遏㓂為上軍尉國語云輿尉籍偃為司馬程鄭為乗馬御國語云贊僕六官之長皆民譽也注晉置六卿為軍帥襄二十五年自六正三軍之六卿五吏丈職三十帥武職皆軍卿之屬官僖二十七年冬文公大蒐示之禮作執秩以正其官注主爵秩之官晉國語隨㑹修執秩為法二十八年士榮為大士太傅陽子太師賈陀士㑹為太傅疏云天子太傅三公之官也諸侯太傅孤卿之官也晉語趙宣子召軍吏戒樂正齊三宰齊語臣立三宰三卿也工立三族市立三鄉澤立三虞山立三衡管子王言篇相三月請論百官隰朋進退閑習立為大行甯戚蓻粟盡地利立為大司田王子城父為大司馬賓胥無為大理東郭牙為大諫之官外紀同傳天子之二守國髙為吕氏春秋甯遬為大田東郭牙為大諫臣􅁌章大理注楚有箴尹之官亦諫臣齊列大夫劉向荀子目録方齊宣威王之時聚天下賢士於稷下尊寵之若鄒衍田駢淳于髠之屬甚衆號曰列大夫咸作書刺世是時荀卿年十五始來游學至齊襄王時荀卿最為老師齊尚修列大夫之缺而荀卿三為祭酒焉衛泠官左傳鍾儀曰泠人也疏詩簡兮序衛之賢者仕於泠官鄭𤣥云泠官樂官也泠氏世掌樂官而善焉故後世多號樂官為泠官吕氏春秋黄帝使泠倫取竹斷兩節而吹之昭二十一年傳景王鑄無射泠州鳩非之是泠氏世掌樂官周語云泠人魯語云泠簫詠歌及鹿鳴之三楚五官戰國䇿楚昭王反郢五官失法蒙榖獻典五官得法注離坎之典也箴尹宣四年克黃追襄十五年公子舒諸侯國史後漢班彪傳諸侯國自有史注魯季孫召外史衛史華龍滑曰我太史也楚有左史倚相漢諸侯官相統衆事孝惠元年除諸侯相國法更為丞相令景中五年八月更名諸侯丞相為相抑之異於漢朝初相在郡守上秩直二千石元帝元三年春令位在郡守下大傅輔王衛綰石奮賈誼董仲舒王吉貢禹為傅相漢之擇人如此成帝改太傅但曰傅内史治國民景帝令内史治民成帝綏和元年省内史更令相治民如郡太守中尉如郡都尉丞相方進司空武奏云制以内史為中尉中尉掌武職昌邑王吉淮陽韋𤣥成御史大夫景中三年十一月罷郎中令武帝損其䄮千石昌邑龔遂大夫景中五年大夫謁者郎皆損其員太中大夫薄昭中大夫賁赫中郎伍被侍郎王尊傳郎中趙田叔衛士長昌邑王傳大僕武帝改曰僕秩亦千石廏長王尊傳廷尉少府宗正愽士景中五年省大倉令齊淳于公私府長廣陽路溫舒中御府長太倉公傳中謁者東平王傳黃門郎師丹傳大官令燕王旦傳食官長梁王襄傳尚食監髙袪醫工長燕王旦傳淮建武二十七年第五倫補陽國醫工長太醫侍醫倉公傳尚方欒火主藥方博士河間獻王立毛氏詩左氏春秋愽士常侍楚王騁龔舍為之長史馬宫遷楚長史治書本尚書更名比六百石太史公曰髙帝時諸侯得自除内史以下髙五王贊時諸侯得自除御史大夫羣卿以下衆官如漢朝漢獨為置丞相梁孝王得自置相二千石齊悼惠王得自置二千石表羣卿大夫都官如漢朝景帝中五年令天子為置吏都官長丞皆損其員武帝改漢内史中尉郎中令王國如故劉歆議孝武定諸侯之制永無逆爭之心牧守令長附髙宗聖訓曰牧守本也令長末也若牧守得其人則令長又何患有不稱之職哉黄帝四監左右大監見古官名舜十二牧五長八伯夏九牧通典黄帝立四監以治萬國史記云黄帝置左右大監二伯之職肇端於此唐有九州舜置十二州有牧夏為九州牧書覲四岳羣牧咨十有二牧州十有二師外薄四海咸建五長舜以五長綏四國周以十連率諸侯唐虞内有百揆四岳外有州牧侯伯左傳夏貢金九牧史周紀武王召九牧之君王制疏虞稱牧亦稱伯書傳云四岳八伯又見上堯四伯見古官名類夏王官伯商頌長發相土烈烈箋云相土居夏后之世承契之業入為王官之伯出長諸侯疏王肅云相土在夏為司馬之職掌征伐殷二伯八伯周二伯王制千里之外設方伯五國以為屬屬有長十國以為連連有帥三十國以為卒卒有正二百一十國以為州州有伯注殷之州長曰伯虞夏及周皆曰牧伯帥正長皆因賢侯為之疏鄭答張逸問云畿内之州不置伯有鄉遂之吏主之書盤庚云邦伯師長八州八伯五十六正百六十八帥三百三十六長八伯各以其屬屬於天子之老二人老謂上公分天下以為左右曰二伯文王為西伯秋注周禮九命作伯春傳曰自陜以東周公主之自陜以西召公主之曲禮九州之長曰牧五官之長曰伯是職方注職主也謂為三公者是伯分主東西者也大宗伯八命作牧九命作伯注謂上公有功徳者加命為二伯伯尊於牧牧主一州伯中分天下各主一方書顧命正義公羊傳言周召分主謂成王即位之初康王之誥正義二公率領諸侯知其為二伯王肅云畢公代周公為東伯故率東方諸侯則畢公太師也太保領冢宰相王室任重故先言西方太保召公為西伯康誥孟侯疏孟長也五侯之長謂方伯使康叔為之長者即州牧也虞夏及周既有牧又離騷云伯昌作牧殷亦有牧伯鄭依略說以太子十八為孟侯而呼成王禮制無文國語昆吾為夏伯矣大彭豕韋為商伯矣大司徒注諸侯為牧正帥長及有徳者乃有附庸周牧監長伯九牧九采禮天官大宰乃施典於邦國而建其牧立其監注牧謂八命作牧者以侯伯有功徳者加命作州長謂之牧疏曲禮云州牧於外曰侯殷使大夫三人為三監至周使伯佐牧不使大夫詩旄丘序云責衛伯也鄭云康叔封爵稱侯今曰伯者時為州伯也周之法使伯佐牧即五侯九伯五侯是州牧九伯是牧下之伯監謂公侯伯子男各監一國書曰王啓監厥亂為民春官宗伯八命作牧九命作伯秋官掌交諭九牧之維注九州之牧書立政立民長伯周官六卿率屬以倡九牧左傳五侯九伯鄭志云太公為王官伯分主自陜以東故稱五侯八州有八伯畿内有一伯故為九伯為衛侯爵而為州伯伯之賢者亦可進牧周禮八命作牧明堂位九采之國應門之外北面東上注九采九州之牧典貢職者正門謂之應門二伯率諸侯而入牧居外糾察之孔氏曰畿外邦國有牧畿内不置鄭注曲禮云二王之後不為牧王制正義周於牧下置二伯亦或因殷使大夫為三監之周召為東西伯分陜而主之太公受五侯九伯專征命畢公太保率東西諸侯君陳畢公迭居東郊宣王中興此制未泯韓侯在韓召虎在淮申伯在齊方叔在荆連帥特見於詩序漢郡守箴表郡守秦官通典秦置守丞尉各一人掌治其郡邊郡有長史掌兵馬景帝中二年更名太守諸侯王國置内史治國民成帝綏和元年省内史更令相治民如郡太守王莽改太守曰大尹通典宣帝每拜刺史守相輒親見問後漢亦重其任或以尚書令僕射出為郡守鍾離意黃香桓榮胡廣是也或自郡守入為三公虞延第五倫桓虞鮑昱是也漢諸侯太傅初徐之官大行奏策蕭育為南郡太守入殿受策此䇿拜之制也文帝就加魏尚為雲中守成帝即拜班伯定襄守哀帝即拜龔舍為泰山守此即拜之制也即拜者便道之官藩唐開元三年正月壬申制於京官簡都督刺史外有狀量授京官使出入常均漢汲黯以諸侯相秩居淮陽馮野王為大鴻臚以秩出為上郡太守此秩尊於守也京房守魏郡以八百石居黄霸守潁川以比二千石居官後歸潁川故官以八百石居郡此秩卑於守也元帝建昭二年益三河大郡太守秩劉騊駼郡太守箴守臣司境文選李善注引劉騊駼郡太守箴曰大漢遵周化洽九區又蓺文類聚引劉騊駼郡太守箴秦置郡丞漢因之黄霸河東路温舒右扶風趙温京兆桓寛廬江孔奮武都慶建武十四年罷邊郡太守丞長史領丞職辛忌金城長史盖勲漢陽長史晉咸康七年省惟丹楊丞不省宋元嘉四年復置漢部刺史州牧外臺武紀元封五年夏初置刺史部十三州注師古曰漢舊儀云初分十三州假刺史印綬有常治所常以秋分行部御史為駕四封乗傳到所部郡國各遣一史迎之界上所察六條六條見戒吏類地理志武帝攘郤胡越開地斥境南置交阯北至朔方之州注師古曰胡廣記云漢既定南越之地置交阯刺史别於諸州令持節治蒼梧分雍州置朔方刺史愚按雍州即漢凉州也以廣之言考之則凉州疆界濶逺分朔方諸郡别置刺史察之是凉州有兩刺史也平當傳師古注曰武帝置朔方别令刺史監之不在十三州之限屬後漢郭伋傳建武十一年省朔方刺史并州乃調伋為并州牧紀云省朔方牧兼徐梁幽并夏周之制改雍曰凉改梁曰益凡十三部置刺史新置交州并司𨽻亦征和以前司𨽻所統有刺史察之百官表監御史秦官掌監郡戰國策安邑之御史則六國時已遣御史監郡矣通典謂之監察史髙紀秦泗州監平注文穎曰秦時御史監郡若今刺史如淳曰三十六郡置守尉監蕭何傳秦御史監郡漢省丞相遣史分刺州不常置漢初未置刺史相國下諸侯王御史執法下郡守相國主國御史主郡武帝元封五年初置部刺史掌奉詔條察州秩六百石員十三人成帝綏和元年十二月更名牧秩二千石哀帝建平二年復為刺史元壽二年復為牧注師古曰漢官典職儀云刺史以六條問事非條所問則不省朱博傳初何武為大司空與丞相方進奏今部刺史居牧伯之位秉二州之統選第大吏所薦位髙至九卿所惡立退任重職大春秋之義用貴治賤不以卑臨尊刺史位下大夫而臨二千石輕重不相凖臣請罷刺史置州牧奏可及博奏言部刺史奉使典州督察郡國故事居部九嵗舉為守相其有異材功效著者輒登擢秩卑而賞厚咸勸功樂進請罷州牧置刺史如故奏可續官志孝武初置刺史十三人注古今注曰常以春分行部郡國各遣一吏迎界上成帝更名牧建武十八年復為刺史十二人各主一州其一州屬司𨽻校尉諸州常以八月廵行所部郡國録囚徒考殿最初嵗盡詣京師奏事注胡廣曰所察有條應䋲異者輒覆問之不茹柔吐剛也嵗盡齎所狀納京師名奏事差其逺近各有常㑹每何武傳為揚州刺史每奏事至京師注師古曰刺史嵗盡則入奏事於京師又京房傳中興但因計史注胡廣曰不復自詣京師東觀書曰和帝初張酺上言王者法天熒惑奏事太㣲故州牧刺史入奏事所以通下問知外事者也數十年以来時止勿奏遂因為故事臣愚以為刺史視事滿嵗可令奏事如舊典韓詩外傳曰王者必立牧方三人所以使關逺牧衆也逺方之民聞皆曰我居之辟見我之近也我居之幽見我之明也可欺乎哉紀建武十一年初斷州牧自還奏事司𨽻部郡國七河南至扶風豫州部六潁川至魯國冀州部九魏郡至渤海兖州部八陳留至濟隂徐州部五東海至下邳青州部六濟南至齊國荆州部七南陽至長沙􅀭州部六九江至豫章益州部十二漢中至犍為涼州部十二隴西至居延并州部九上黨至朔方幽州部十一涿郡至遼東交州部七南海至日南凡九十八司𨽻不在數其二十七王國相其七十一郡太守注臣昭曰孝武始置刺史監糾非法不過六條傳車周流匪有定鎮恐誤刺史有常治所故朱愽曰欲言二千石者還詣治所秩裁數百威望輕寡得有察舉之勤未生陵犯之釁成帝改牧其萌始大世祖中興監乎政本復約其職還遵舊制因兹以降彌於嵗年母后當朝綱維撓毁而諸侯莫敢入伐豈非彊榦弱枝控制素重之所致乎郡國志司𨽻治河南豫治譙冀治髙邑兖治昌邑徐治郯青治臨淄荆治漢壽益治雒涼治隴􅀭治歴陽并治晉陽幽治薊交治廣信光武紀建武十八年罷州牧置刺史注王莽變革至建武元年復置牧通典漢興加置郡國其後開越攘胡改雍曰涼梁曰益又置徐州復禹舊號置交阯北有朔方郡朔方復禹并州凡十三部刺史而不常所理司𨽻并荆兖豫􅀭冀幽青徐益交涼後漢亦為十三州部云云靈帝中平五年改刺史置牧劉焉劉虞自九卿領之州牧之任自此重矣司𨽻蓋寛饒諸葛豐上節王尊駿孫寶􅇹宣永昱宣秉牟融李膺宋均張霸虞詡陳禪王龔豫州張敞楊秉周景王允鮑宣為牧冀州張敞陳咸朱博孫寳蕭育賈琮蘇章朱穆羊陟竇融為牧兖州何武蔣詡王渙李恂張禹鮑永為牧徐州王尊楊秉王景青州雋不疑馬宫蕭育魯丕法雄李膺王龔房鳯為牧荆州李固郭賀謝夷吾楊震度尚韋康􅀭州魏相黃霸何武劉祜張禹樊曄為牧益州王陽尊襄孫寳朱輔种暠張喬涼州杜鄴貢禹祝良种暠竇融為牧并州朱博趙岐祝良郭丹郭伋再為牧幽州王駿朱浮為牧交阯張喬賈琮琮為十三州最朱雋周乗夏方周敞張津朔方蕭育翟方進平當光武拜郭伋雍州牧薛宣傳為中丞外總部刺史何武傳刺史古之方伯上所委任一州表率也朱博傳刺史不察黄綬唐李景伯議曰漢刺史掌察墨綏已上其黄綬已下則不察所以行不擾之政謝夷吾傳第五倫薦夷吾曰尋功簡能為外臺之表魏賈逵為豫州刺史時天下初復州郡多不攝逵曰州本以御史出監諸郡以六條詔書察長吏二千石已下故其狀皆言嚴能鷹􅀭有督察之才不言安靜寛仁有愷悌之徳也晉太康之初詔曰諸州無事者罷其兵刺史分職皆如漢氏故事出頒詔條入奏事京城二千石專治民之重監司清峻於上此經久之體也其便省州牧宋志刺言參覘也寫書亦謂之刺漢制不得刺尚書事是也刺史班行六條詔書前漢出乗傳周行郡國無適所治後漢始有定處止八月行部史魏志秦時無刺史但有郡守漢刺史奏六條而已刺稱傳車其吏言從事居無常治吏不成臣詳具上文漢都尉三輔都尉見内西部都尉府玉門關候表郡尉秦官掌佐守典武職甲卒秩比二千石景帝中二年七月更名都尉元帝建昭三年夏令三輔大郡都尉秩皆二千石諸侯王國中尉掌武職成帝綏和元年令如郡都尉漢儀注邊郡置都尉及千人司馬皆不治民地理志京兆華隂京輔都尉治趙廣漢王尊蕭由建武初張宗尉元鼎四年置三輔都丞各一人左馮翊髙陵左輔都尉治蕭由右扶風郿右輔都尉治尹賞史東方朔傳建元三年後丞相御使右輔都尉徼循長楊以東都馬武傳右輔尉陳訢太原廣武蕭由東郡東阿吾丘壽王為之不復置太守陳留外黄汝南汝隂杜詩南陽鄧翟義南郡夷陵九江歴陽滕撫山陽單父沛郡蘄杜詩毋將隆渙沛南部索魏郡魏鉅鹿下曲陽常山南行唐清河貝丘馮浚涿郡安平勃海髙成平原樂陵千乗蓼城濟南於陵甯成泰山盧琅邪姑幕東海費甯乗臨淮盱眙皆有都尉治㑹稽顔駟錢塘西部都尉治任延又囘浦南部都尉治順帝紀陽嘉元年㑹稽有東部都尉丹陽歙何比于豫章新淦毋將永鄧宏漢中褒中廣漢綿竹皆有都尉治又隂平道有北部都尉治馮緄犍為漢陽越巂定莋牂柯夜郎皆有都尉治又進桑有南部都尉治安帝永初元年正月戊寅分犍為南部為屬國都尉巴郡魚服江關都尉治隴西臨洮酈商爰盎南部都尉治天水勇士竇融屬國都尉治又豲道騎都尉治武威休屠都尉治熊水障北部都尉治休屠城張掖日勒史苞郭忠都尉治又畨和農都尉治又居延都尉治酒泉㑹水北部都尉治􅢰水障東部都尉治東部障又乾齊西部都尉治竺曾敦煌郡敦煌縣中部都尉治又廣至宜禾都尉治明帝永平十六年取伊吾盧地置宜禾都尉又龍勒有陽關玉門關皆都尉治辛彤安定參䜌主騎都尉治傅燮又三水屬國都尉治劉歆張奐北地富平韓安國北部都尉治神泉障渾懐都尉治塞外渾懐障上郡匃歸都尉治塞外匃歸障又髙望有北部都尉治又龜兹有屬國都尉治又望松有北部都尉治西河南部都尉治塞外翁龍埤是班况馮參皆為上河農都尉注上河在西河富平又美稷有屬國都尉治班穉又增山有北部都尉治又虎猛有西部都尉治朔方西部都尉治窳渾又渠搜有中部都尉治又廣牧有東部都尉治五原東部都尉治稒陽又蒲澤有屬國都尉治又成宜有中部都尉治原髙西部都尉治田辟雲中陶林東部都尉治又楨陵西部都尉治又北輿中部都尉治定襄武進西部都尉治又武臯中部都尉治又武要東部都尉治鴈門沃陽西部都尉治又平城東部都尉治代郡髙柳西部都尉治又馬城東部都尉治又且如中部都尉治上谷寧杜緩陽並西部都尉治又女祁東部都尉治漁陽郭伋要陽右北平薋皆有都尉治𨖚西柳城西部都尉治又交黎東部都尉治𨖚東涉何無慮西部都尉治又􅀱城中部都尉治又武次東部都尉治樂浪薛宣為都尉丞昭明南部都尉治又不而東部都尉治鬱林領方交阯麊泠合浦朱盧九真魏明為之無切亦皆有都尉治又大河都尉韋𤣥成淮陽都尉尹齊廬江都尉劉敞河南都尉田廣明歐陽歙張宗𢎞農都尉尹翁歸河東都尉樊曄趙護廣平都尉王溫舒武陵都尉溫序上黨都尉杜業志皆不載治所又武帝太初四年徙𢎞農都尉治武關然志𢎞農無都尉當考樊噲傳攻圉都尉則秦已有都尉矣又酈商傳沛公為漢王商以將軍為隴西都尉髙后功臣表醴陵侯越為河内都尉劉氏刋誤曰圉縣名有尉無都尉又郡都尉至景帝方加盖衍一都字天下郡國百有三置都尉者九十山西自三輔而外郡纔十有三而置都尉三十其餘郡國八十七置都尉止六十其不置者盖四十有三也後漢志章懐注云秦毎郡有尉一人今按地理志未必皆有也後官志每屬國置都尉一人比二千石丞一人本注郡國舉孝廉郡口二十萬舉一人典兵禁備盜賊景帝更名都尉武帝又置三輔都尉各一人譏出入邊郡置農都尉主屯田殖穀置屬國都尉主蠻夷降者中興建武六年古今注六年八月省諸郡都尉并職太守無都試之役省關都尉惟邊郡往往置都尉及屬國都尉稍有分縣治民比郡安常復置右扶風都尉京兆虎牙都尉安帝元初三年春置京兆虎牙都尉於長安右扶風都尉於雍如西京京輔都尉故事耿溥為京兆虎牙皇甫旗為扶風後紀和帝永元十六年十二月復置遼東西部都尉官順帝陽嘉二年四月復置隴西南部都尉官注武帝元朔四年初置桓帝永壽元年七月初置泰山琅邪都尉官後東夷傳武帝以沃沮為縣屬樂浪東部都尉光武罷都尉官封渠帥為沃沮侯昭帝始元五年置樂浪東部都尉分領東七縣莋都夷傳元鼎六年為沈黎郡天漢四年并屬為西部置兩都尉一居旄牛主徼外夷一居青衣主漢人永平時郡尉府舍皆雕飾畫山神海靈竒禽異獸以耀之夷人益畏宣帝地節元年省汶山并蜀郡為北部都尉光武建武元年班彪言舊制益州部置蠻夷騎都尉志廣漢屬國都尉故北部都尉屬蜀郡安帝置别領三城延光二年春旄牛夷叛攻靈關益州刺史張喬與西部都尉擊之於是分置蜀郡屬國都尉領四城如太守志元年置靈帝以為漢嘉郡犍為屬國故郡南部永初元年置都尉别領二城趙充國傳神爵元年引兵西至西部都尉府孟康曰在金城初䍐开豪使弟来告都尉和帝紀永元十四年二月乙卯繕修故西海郡徙金城西部都尉以戍之拜曹鳯為都尉屯龍耆古今注曰永平十年置益州西部都尉治巂唐鎮尉哀牢人楪榆蠻夷西南夷傳永平十二年置哀牢博南二縣割益州西部都尉所領六縣為郡先是西部都尉鄭純化行夷貊西羌傳建初二年夏馬防築索西城徙隴西南部都尉戍之南匈奴傳班彪奏宣帝敇邊守尉曰匈奴多詐交接得其情則郤敵折衝續志注安帝時張掖屬國都尉别領五城張掖居延屬國都尉别領一郡賈友居延都尉見西羌傳遼東屬國都尉故邯鄉西部别領六城叚紀明為之詳見後屬國類邊郡又有長史掌兵馬金城長史上官鴻開屯田辛慶忌為金城長史漢儀注邊郡置部都尉有東西南北中千人司馬􅀱皆不治民􅀭雄傳東南一尉西北一􅀱注㑹稽東部都尉敦煌玉門關􅀱也厯志酒泉􅀱宜君注師古曰官號所謂西北一􅀱趙充國傳酒泉􅀱奉世將婼月氏兵四千人又雲中􅀱董恭五原屬國􅀱劉茂敦煌魚澤障􅀱唐林後西域傳陽嘉四年夏北匈奴侵車師後部乃令玉門關􅀱伊吾司馬合六千三百騎救之司馬金城陳立天水田廣明馮譚伊吾毛愷永建二年屯田置伊吾司馬一人丞薛宣為樂浪都尉丞華龍漢中表郡尉有丞秩皆六百石關都尉見前諸中平元年三月戊申關並置都尉護漕都尉朱愽并州刺史護漕都尉受降都尉田廣明傳伊循都尉見屯田昌呉陸遜為海屯田都尉扇水都尉見鹽鐵論典農都尉建武中梁騰為酒泉典農都尉伊闕都尉張承胡廣邉都尉箴巍巍上聖光被八垠矧惟内面罔不来賓威威猛將是攘是闢殷宗周宣用顯其績大漢龍興云云守撫其民尉典其戎五材並用文武程功見御覽漢中興良吏循吏傳序宣帝每拜刺史守相輒親見問二千石有治理效輒以璽書勉厲增秩賜金黄霸蕭咸王尊馮野王孫寳陳立或爵至關内侯公卿缺則選諸所表以次用之是故漢世良吏於是為盛稱中興焉若趙廣漢韓延壽尹翁歸嚴延年張敞之屬皆稱其位王成黄霸朱邑龔遂鄭𢎞召信臣等所居民富所去見思循吏傳六人而五人出於宣帝黄霸為潁川八年張敞為京兆九嵗漢牧守丈中子事君篇三代之興邦家有社稷焉兩漢之盛牧守有子孫焉漢河南尹壁贊百官志河南尹一人主京部特奉朝請又云京師置尹一人丞一人郡國志河南尹注秦三川郡髙祖更名河南河南太守王莽改為大尹世祖都雒陽建武十五年改曰河南尹章綬服秩與京兆同應劭漢官曰郡府聽事壁諸尹畵贊肇自建武訖于陽嘉注其清濁進退所謂不隠過不虛譽甚得述事之實後人是瞻足以勸懼雖春秋采毫毛之善貶纎介之惡不避王公無以過此凡二十一城永和五年户二十萬八千四百八十六口百一萬八百二十七雒陽周時號成周河南周公所城雒邑也春秋時謂之王城河南尹袁安嚴明郭賀清靜應順公清宋嵩節㮣范遷清節召馴徳行田歆薦舉又楊秉橋元李膺劉祜魏司馬芝晉𫝊嘏為河南尹崔駰有箴曰商邑翼翼四方是營選蜀都賦注崔駰河南尹箴曰唐虞商周河洛是居成王命君陳尹東郊漢留守列傳隂識光武每廵郡國識常留鎮守京師留守周君陳似其任也伏湛行大司徒事車駕每出征伐常留鎮守車駕征張歩留湛居守李通光武征討四方常令通居守京師鎮撫百姓張禹和帝南廵祠園廟禹以太尉留守北宫元魏平陽公丕廣陵王羽留守京師並加使持節唐貞觀十七年征遼房𤣥齡為京師留守李大亮為副詔曰公當蕭何之任蕭何以信謹守管籥無西顧之憂又以蕭瑀為東都留守髙宗召李勣授洛陽宫留守咸亨二年正月七日幸洛陽以李晦為西京留守其後車駕發京都則置之神龍元年蘇瓌充京留守𤣥宗將幸東都以宋璟為西京留守開元十一年太原以尹為留守謂之三都留守東都留守儀鳯元年韋𢎞機開元三年薛謙光舊制賜旗甲同方鎮元和九年十月戊辰吕元膺為留守不賜裴度亦為之晉天福七年勅留守降麻制同將相周顯徳三年征淮以王朴為東京副留守四年再征淮以朴留守京師宋朝建隆元年五月征潞呉廷祚為東京留守十月征􅀭太宗為大内都總管廷祚留守開寶三年征太原太宗為之九年三月幸西京沈義倫為之咸平二年幸河北宰臣李沆為之景徳元年幸澶淵王旦為之祥符封泰山祀汾隂向敏中以舊徳再為之建炎元年宗澤為京城留守兼開封尹紹興四年參政孟庾為行宫留守漢雒陽令續志注漢官曰雒陽令秩千石丞三人孝亷左右尉秩四百石橋𤣥為左尉潔王渙公正任峻威風祝廉得百姓心董宣亷六典注洛陽置尉東南西北部晉置六部尉為西漢義縱尹賞朱博薛宣長安令又曰三邊始孝武皇帝所開縣戶數百而或為令荆􅀭江南七郡唯有臨湘南昌呉三令爾及南陽穰中土沃民稠四五萬户而為長表縣令長皆秦官萬户以上為令秩千石至六百石減萬户為長秩五百石至一百石西漢循吏不載縣令者郡守得以自辟而郡亦自課之也六典注齊晉云大夫魯衛云宰楚為令尹秦曰令長通典周官有縣正四百里為縣東都循吏載於傳者十二人而令長居其二雒陽令王渙須昌長童恢長宻中牟之兩令潁川之四元和二年春詔曰安靜之吏悃愊無華襄城令劉方吏民同聲謂之不煩顔師古注曰漢律近塞郡皆置尉百里一人士史尉史各二人鴈門尉史行徼通典主簿漢有之繆彤仇覽晉制不經宰縣不得入為臺郎唐縣有赤三府共六縣畿八十二望七十八緊百十一上四百四十六中二百九十六下五百五十四六等之差凡一千五百七十三縣令各一人漢洛陽寺和紀永元六年七月京師旱丁巳幸洛陽寺官舍也録囚徒舉寃獄未及還宫而雨唐臨軒册刺史賜刺史詩通典兼㑹要魏晉刺史任重者為使持節都督輕者為持節銅印墨綬進賢兩梁冠絳朝服領兵者武冠庶姓為州無將軍者謂之單車刺史隋開皇三年罷郡以州充縣大業初罷州置郡司𨽻臺大夫一人察畿内刺史十四人察畿外諸郡亦有六條之制唐武徳元年六月十九日改郡為州太守為刺史而雍州置牧天寳元年正月二十日改州為郡刺史為太守至徳二年十二月十五日改郡為州太守為刺史通鑑兼紀傳貞觀二年太宗謂侍臣曰治人之本莫重刺史故錄姓名於屛風武后天授二年正月出繡袍賜新除都督刺史𤣥宗因張九齡言詔擇京官為刺史嵗十月按察使校殿最自第一至第五校考使及户部長官總覈為升降凡官不歴州縣不擬臺省開元十二年以山東旱選臺閣名臣補刺史六月壬午王丘崔沔韓休等五人出為刺史十三年二月自擇刺史十一人賜詩十韻十四年六月壬戌詔州傳長官言事二十四年十月甲子次華州賜刺史縣令中上考天寳元年正月丁未詔京文武官材堪刺史者自舉㑹要元和三年正月詔刺史於宣政門謝訖進辭之任舊制凡命都督刺史皆臨軒册命近嵗雖無册拜而牧守受命後便殿召對賜衣服時河南尹裴復求速之任李吉甫為奏請遂有是命非舊制也開元時已辭仍請側門􅀱進止所以光寵守臣唐岳牧舉舊紀調露元年十一月甲寅臨軒試應岳牧舉人員半千舉岳牧髙宗御武成殿問兵家三陣對策擢髙第唐宣政殿策縣令舉縣令詳見詮選闕二字開元四年五月𤣥宗召縣令策于廷問所以安人者對凡二百人惟鄄城令韋濟居第一擢醴泉令考下第者罷之侍郎盧從愿李朝𨼆下遷坐擬選失實縣志云悉集新除令宣政殿臨問以治人之䇿學通鑑云二百餘人不入第且令之官四十五人放歸問元稹詩謂長官清平由姚宋之作相紀兼實録傳等大厯八年正月甲辰詔京官三品以上及郎官御史嵗舉刺史縣令一人貞元三年柳渾為相帝嘗親擇吏宰畿邑政有狀宰相賀得人渾不賀曰此代尹擇令非陛下所宜四年正月庚戌制舉刺史縣令當親策試十月召京兆諸縣令對延英殿訪人疾苦各賜衣一襲薛珏傳時詔舉堪刺史縣令者且百人延問人間疾苦吏得失取尤通達者什二宰相欲校以文詞珏曰求良吏不可責文學宜以上愛人之本為心鄭珣瑜傳貞元初詔擇十省郎治畿赤會要開元四年十一月勅縣令戶口增益界内豐稔清勤著稱賦役均平者先與上考天寳九載三月十二日勅選司取縣令必限書判文學政事本自異科古來良宰豈必文人今後郎官御史先於縣令三考已上有政績中取元和二年正月勅江淮大縣委三省御史臺諸司長官節度觀察使各舉堪任縣令四年正月依平選人例分入三銓注擬停四時集宋朝寶元元年十一月乙卯復奏舉縣令紹興五年四月壬子詔館職正字已上專舉縣令二十八年七月辛未左正言何溥言望用建隆天聖故事擇大縣闕為堂除仍借五品服優其廩給俟終更甄擢之上曰縣令末也監司郡守本也唐牧宰政術令縣新戒見御製藝文志雜家類蕭佚牧宰政術二卷耒陽令魯人初不著姓公侯政術十卷漢循吏𫝊六人而五人出於宣帝唐循吏𫝊十五人而出於武徳貞觀之時者半祥符府牧祥符八年二月丙寅楚王元佐天策上將軍行興元牧府牧自此始天禧元年元佐領雍州牧州牧自此始二年加興元牧其雍州牧如故兼州府兩牧自此始景祐二年荆王元儼為荆南淮南節度大使行荆州􅀭州牧二州牧自此始淳熙四年四月五日魏王授江陵尹五年閏六月授雍州牧親王帶牧隨本鎮虞十二州則十二牧夏九牧周九州則九伯而王制言八州八伯則王畿之内不建伯焉鄭𤣥以為殷制畿内王所自治故不設伯明堂位謂九采左氏𫝊謂九牧唐百官志京兆河南牧皆親王遥領兩府之政以尹主之戒吏劉勰曰戒勅為文實詔之切者戒者慎也禹稱戒之用休漢六條九條詳見律令表武帝元封五年夏初置部刺史掌奉詔條察州郡注師古曰漢官典職云刺史班宣周行郡國省察治狀黜陟能否斷治寃獄以六條問事非條所問即不省一條彊宗豪右田宅踰制以彊凌弱以衆暴寡二條二千石不奉詔書遵承典制倍公向私旁詔守利侵漁百姓聚歛為姦三條二千石不恤疑獄風厲殺人怒則任刑喜則淫賞煩擾刻暴剥截黎元為百姓所疾山崩石裂訞詳訛言四條二千石選署不平茍阿所愛蔽賢寵頑五條二千石子弟恃怙榮勢請託所監六條二千石違公下比阿附豪彊通行貨賂割損正令也以秋分行部到郡國各遣一史迎之界上所察六條漢舊儀云惠帝三年一云六年相國奏遣御史監察三輔郡所察者九條監者二嵗一更常以十一月奏事晉五條詔書刺史六條制宋二十四條梁五條見元㑹西魏六條後周九條唐六條四十八條晉紀武帝泰始四年十二月班五條詔書於郡國一曰正身二曰勤百姓三曰撫孤寡四曰厚本息末五曰去人事隋志班五條詔十卷條晉刺史六條制一卷咸熙六見律令類宋文帝元嘉三年遣使廵行天下班宣二十四條詔書魏丞相泰欲彊國富民度支尚書蘇綽為六條詔書一曰清心二曰厚教化三曰盡地利四曰擢賢良五曰恤刑獄六曰均賦役泰常置座右又令百司習誦其牧守令長非通六條及計帳者不得居官崇文目職官類蘇綽六條一卷後周宣政元年八月制九條宣下州郡唐貞觀二十年正月丁丑遣使二十二人以六條黜陟天下見後監察御史以六條察十道見御史臺武后永昌元年正月戊午布政明堂頒九條訓百官長安三年分命使者以六條察州縣韋方質删定四十八條察州縣五術八計陸䞇傳類見考課晉勅戒百官文心雕龍周穆命鄧父受勅憲及晉武勅戒備告百官勅都督以兵要戒州牧以董司警郡守以恤隠勤牙門以禦衛有訓典焉宋禮志晉武太始四年詔刺史二千石長吏唐百寮新誡令長新戒元萬頃傳武后諷帝召諸儒論撰禁中萬頃與范履氷等與選凡撰列女傳臣軌百寮新誡樂書等九千餘篇志百竂新誡五卷舊志四卷通鑑𤣥宗深於治道開元十三年二月自擇刺史賜詩十一月封泰山庚申還至宋州宴從官於樓上刺史㓂泚預焉上謂張說曰曏屢遣使臣分廵諸道察吏善惡今封禪歴諸州乃知使臣負我多矣又言王丘崔沔裴耀卿皆良吏以㓂泚不借譽於左右舉酒賜之丘沔耀卿皆遷官先是四年五月集縣令二百人於宣政殿廷試以理人策韋濟為第一二十三年十月採訪使以陜洛等十二州刺史崔希逸等治狀異績陸渾及諸道二十六縣令李常等政號循良皆璽書奬飭刺史賜絹八十匹縣令五十匹二十四年二月甲寅宴新除縣令於朝堂上作令長新戒一篇賜天下縣令處分語見地理太平興國淳化祥符天聖戒諭辭興國八年四月丁未二十三日上作戒諭辭二付閤門一戒京朝司有深刻聚歛避事偷安之戒一戒幕職州縣官有正身幹事之訓貪慢殘民之戒朝辭曰舍人宣示之聖訓曰大臣又欲剛柔相濟是嵗賜王顯軍誡淳化五年五月戊寅又出戒勵辭云公務刑政惠愛臨民奉法除奸方為勞績書印紙之前以示知審官院錢若水吕祐之厥後咸平二年二月己酉之詔戒其堅操業祥符元年正月己卯之詔戒其崇匪懈四月丁酉又賜京朝幕職州縣官戒詞俾協大中之道布清靜之風至天聖元年五月令閤門口宣戒諭又有修身勵節之訓寶元元年十月丙寅戒以釣名慶厯四年十一月己巳訓以清靜至和二年五月戊寅戒其邀榮嘉祐五年七月庚戌戒其浮競六年七月癸巳戒其厚行實祥符文武七條手札十六條祥符二年己酉十一月丙辰稽古録云乙卯作七條上謂宰輔曰先帝以儒行篇賜羣臣今當摹印以賜文臣申諭先帝之㫖且漢制刺史以六條問事齊有五條晉有六條武臣有諸葛亮七戒但前世令長未覩訓勉之辭今當諭以舉政經急民病為本乃御製文臣武臣七條文臣一清心平心待物二奉公公直潔已三修徳以徳化人四責實勿競虚譽五明察勤察民情六勸課勸孝悌農桑七革弊求民疾苦以賜京朝官任提刑轉運知府軍監通判知縣者序曰羣臣受命奉法居先武臣一修身使士卒有法則二守職不侵撓民政三公平均撫士卒四訓習教訓武藝五簡閱識勤惰勇怯六存恤甘苦皆同七威嚴制御士卒以賜牧伯洎諸司使而下任外郡鈐轄知州軍縣監押駐洎廵檢者序曰禮存九法傳載七徳又以禮記儒行篇賜親民釐務官仍别勅戒諭三年五月乙未賜輔臣御注文武七條八年六月辛未䕫漕臧奎請令諸道州府軍監縣以所賜七條刻石或書公宇之㕔壁從之仁宗慶厯四年十二月丁酉以官吏不遵守先朝文武七條下詔申儆曰先帝親著七條垂戒百執辭去之日並令拜賜亦有刋石題門書屛示座自今以後務革前失以聖考七條更相誨勵使美績嵗茂善狀日聞元祐四年九月辛卯文彦博請舉行此法命監司遍牒遵守紹興十年十一月辛亥班文武七條十六年四月己酉令鏤板於㕔事從王循友之請也祥符三年九月甲辰内出手札十二條實録云十六條示輔臣頒下江淮安撫使諭以綏撫之道治平戒諸路帥十四條四年十二月壬子樞宻院言西事方興用兵有漸預戒諸路帥凡十四條紹興戒石銘二年六月癸巳頒黄庭堅書太宗戒石銘爾俸爾禄民膏民脂下民易虐上天難欺於郡縣十年十一月十一日臣僚奏成湯制官刑以儆有位成王作周官以訓厥官我朝戒石之銘戒勅之辭及文武七條雖成湯成王用心不是過也紹興戒諭詔書二十九年六月十日癸巳下詔戒諭官吏驕怠十四日丁酉詔崇尚清白禁止賂遺七月十四日知臨安府于潚請以二詔刻石聽事出入觀省為四方郡縣之倡二十四日乙巳右僕射思退等請以崇尚清白詔書刻石置政事堂以墨本分頒中外臣僚奏可一云乞以上親書二詔立石尚書省以墨本頒中外乾道淳熙戒飭詔見詔令類淳熙戒諭將帥御書十二年四月七日御書戒諭賜建康副都統制閻仲仍刋石賜殿帥郭棣已下其文曰將帥之敝在蔽功忌能尊已自用故下有沉抑之歎上無勝算之助昔許歴進北山之策而趙奢卒敗秦師卿當以奢為法毋蹈前敝玉海卷一百三十一
