body:
  text: 玉海卷一百七十九宋王應麟撰食貨貢賦賦出於田自上稅下貢出於土從下獻上堯制賦詩甫田正義禹貢云五百里甸服云云注云甸服者堯制賦其田使入穀禹弼其外百里者賦入總謂入刈禾也二百里銍斷去藁也三百里秸又去穎也四百里入粟五百里入米者逺彌輕也甸服之制本自納總禹為之差使百里者從之耳六韜帝堯王天下其自奉甚薄其賦役甚寡禹九州貢法九州賦法田賦見郡國夏貢書禹别九州任土作貢注禹制九州貢法此堯時事而在夏書之首禹之王以是功冀州既載注堯所都也先施貢賦役載於書疏此州帝都先賦後田殊於餘州不言貢篚差於餘州厥賦惟上上錯疏上上第一也交錯間雜之義鄭𤣥云此州入穀不貢濟河惟兖州厥貢漆絲厥篚織文注地宜漆林又宜蠶織文錦綺之屬疏檿絲中琴瑟之絃織貝織如貝文漢世陳留襄邑縣置服官是兖州綾錦美也海岱惟青州厥貢鹽絺海物惟錯岱畎絲枲鈆松怪石厥篚檿絲海岱及淮惟徐州厥貢惟土五色羽畎夏翟嶧陽孤桐泗濵浮磬淮夷蠙珠暨魚厥篚𤣥纎縞淮海惟􅀭州厥貢惟金三品注金銀銅也瑶琨篠簜齒革羽毛惟木厥篚織貝厥包橘柚錫貢注錫命乃貢言不常荆及衡陽惟荆州厥貢羽毛齒革惟金三品杶榦栝柏礪砥砮丹惟箘簵楛三邦厎貢厥名包匭菁茅注齊責楚包茅不入厥篚𤣥纁璣組九江納錫大龜注龜不常用錫命乃納之荆河惟豫州厥貢漆枲絺紵厥篚纎纊錫貢磬錯華陽黑水惟梁州厥貢璆鐵銀鏤砮磬熊羆狐狸織皮黑水西河惟雍州厥貢惟球琳琅玕梁雍有貢無篚以其地不宜也四州雜賦冀上上錯􅀭下上錯豫錯上中梁下中三錯惟出正賦而無雜賦者五州兖青徐荆雍厎慎財賦咸則三壤成賦中邦注上中下田也凖則其田以定中國之賦法王氏曰土賦有及於四夷田賦止於中邦而已五百里甸服百里賦納總禾藁二百里納銍禾穗三百里納秸服藁四百里粟五百里米注自總至米皆公田之稅近粗而逺精近者易致逺者難致故也畿内不封建故田賦入天子甫田箋上古稅法近者納總逺者納粟米正義其稅皆當什一但所納有精麄逺輕而近重正義曰貢賦之法其來乆矣治水之後更復改新非禹始為貢也此所貢與周禮太宰九貢不殊其賦與周禮九賦全異不言作賦而言作貢取下供上之義或曰貢者夏后氏田賦之總名又曰賦謂稅穀以供天子因九州差為九等稅俱什一而為九等者人功有强弱收穫有多少傳以荆州田第八賦第三為人功脩雍州田第一賦第六為人功少鄭𤣥云貢者百工之府受而藏之其實於篚者入於女功故以貢篚别之篚之所盛皆供衣服之用貢者以所出之穀市其土地所生異物獻其所有謂之厥貢亦有不用賦物直隨地所有採取以為貢者又曰五服堯之舊制洪水平之後禹為節文使賦役有常甸服去京師最近賦稅尤多毎於百里即為一節侯服稍逺近者供役二百里内各為一節三百里外共為一節綏要荒三服去京師益逺毎服分為二内三百里為一節外二百里為一節甸服入榖故首言賦税侯服以外貢不入糓孟子夏后氏五十而貢殷人七十而助周人百畝而徹其實皆什一也徹徹也助藉也注民耕五十畝貢上五畝耕七十畝以七畝助公家百畝徹取十畝為賦詩正義史𫝊説助貢之法唯孟子為明引王制公田注孟子龍子曰治地莫善於助莫不善於貢貢者校數歳之中以為常禹九州之賦雖曰較數歳之中以為常然歳有豐凶又使之錯出他等之賦則凶年必無取盈之理孟子所謂不善者特救戰國之失耳禹法實不然也史記自虞夏時貢賦備矣詩正義禹貢九州之賦法凡有九等漢食貸志禹定九州制土田各因所生逺近賦入貢棐楙遷有無萬國作乂隋食貨志禹制九等而康歌興通典禹任土作貢分田定税十一而賦萬國以康吕氏曰九州之貢皆服食噐用之物所謂惟正之供林氏曰八州之貢兖雍至寡荆􅀭至多然各因地所宜雖有多寡而無輕重左傳夏貢金九牧尚書璇璣鈐禹治九貢殷周軍賦見兵制左傳韓賦七邑皆成縣也成縣賦百乗魯賦八百乗邾賦六百乗天子之老請帥王賦鄭修車賦儆師徒悉索敝賦公羊注十井為一乗公侯封方百里凡千乗伯四百九十乗子男二百五十乗論語由也千乗之國可使治其賦也注孔曰兵賦三禮義宗兵賦義曰鄭注周禮軍旅之數云此先王因農事而定軍令也天子六鄉六遂故有十二軍諸侯三鄉三遂故有六軍次國二鄉二遂故有四軍小國一鄉一遂故有二軍鄉為正軍遂為副倅故云天子六軍諸侯大者三軍次二軍小一軍皆據正軍而言不數副倅周禮疏趙商問校人職云云荅曰司馬法甸有戎馬四匹長轂一乗此為民出軍賦無與於天子國馬之數卿大夫之采地王不特置司馬各自使其家臣為司馬主其地之軍賦夏官疏禮雜問志云稍縣都鄙地有公邑之民口率出泉於土也邦國都無口率之賦唯有軍賦革車匹馬士徒而已凡出軍之法先六鄉賦不止次出六遂賦猶不止召兵於公邑及三等采賦猶不止乃召兵於諸侯大國三軍次國二軍小國一軍此軍等皆出於鄉遂賦猶不止則諸侯有遍境出之法則千乗之賦是也小司徒地之所出唯貢而已口率出錢及軍法乃名賦鄭并言賦者以民有地貢即有錢賦及軍賦故兼言賦且禹貢地貢亦名賦載師疏春秋正義案周禮有夫征家征夫征謂出税家征謂出車徒給徭役小司寇大比登民數登于天府内史司㑹冢宰貳之以制國用注人數定而九賦可知國用乃可制史通夏書則編於禹貢周書則託於王㑹亦有圗形九州之鼎列狀四荒之經周畿内貢法邦國助法見田制殷助見上孟子請野九一而助國中什一使自賦詳見後耕者助而不税使出力助耕公田而不税其私田春秋初税畝胡氏曰譏宣公廢助法而用税也王制古者公田藉而不税注孟子曰殷人七十而助古者謂殷時甫田正義禾庾當在畿内若畿外則禾取羙物以當邦賦不入榖畿内雖有貢法亦校其嵗以為率掌客芻薪倍禾明周法有禾稼之税説文商人七十而耡耤稅也周禮興耡古者上下相親上之於下則曰駿發爾私終三十里惟恐民食之不給下之於上則曰雨我公田遂及我私惟恐公田之不善故助法行而頌聲作矣周九貢九賦九職九均九稅九比九正賦貢九畡經入禮天官大宰八則五曰賦貢以馭其用注貢九職之功所税干寳云賦上所以求下貢下所以納上以九職任萬民曰三農生九榖園圃毓草木虞衡作山澤之材藪牧養蕃鳥獸百工飭化八材商賈阜通貨賄嬪婦化治絲枲臣妾聚歛疏材閒民無常職轉移執事以九賦歛財賄注財泉榖也元謂賦口率出泉今之筭泉民或謂之賦此其舊名一邦中在城郭二四郊去國百里三邦甸二百里四家稍三百里五邦縣四百里六邦都五百里皆平民七闗市八山澤九幣餘皆末作九賦歛於大宰貳於大府小宰執其貳内府外府掌其入司㑹總其㑹計司書叙其財幣職内辨其物職嵗攷其數職幣歛其餘以九貢致邦國之用九貢參之禹貢可見一祀貢司農云犧牲包茅之屬即浮磬菁茅二嬪貢皮帛類𤣥曰絲枲即絲枲絺紵三器貢宗廟之器𤣥謂銀鐡石磬丹漆即銀鏤砮丹四幣貢繡帛𤣥謂玉馬皮帛即纎縞織皮五材貢木材謂杶榦枯栢篠簜六貨貢珠貝自然之物𤣥謂金玉龜貝即金玉蠙珠七服貢祭服𤣥謂絺紵即𤣥纁織纊八斿貢羽毛𤣥謂燕好珠璣琅玕即羽毛璣組九物貢九州之外各以所貴為贄𤣥謂雜物魚鹽橘柚小宰掌執邦之九貢九賦九式之貳以均財節邦用八成一曰聽政役以比居注政賦太府掌九貢九賦九功之貳以受其貨賄之入九功謂九職也闗市之賦以待王之膳服邦中之賦以待賔客四郊之賦以待稍秣家削之賦以待匪頒邦甸之賦以待工事邦縣之賦以待幣帛邦都之賦以待祭祀山澤之賦以待䘮紀幣餘之賦以待賜予凡邦國之貢以待弔用凡萬民之貢以充府庫式貢之餘財以充玩好之用内府掌受九貢九賦九功之貨賄䟽地之所出惟貢而已口率出錢及軍法乃名賦民有地貢即有錢賦軍賦之九賦任地九職任民皆行於王畿千里之間而王畿外則隨其地之逺近小大立為九等之貢司㑹以九貢之法致邦國之財用以九賦之法令田野之財用以九貢之法令民職之財用以九式之法均節邦之財用司書掌邦之九職九正九事注九正謂九賦九貢正稅九事謂九式變言者重其職凡稅斂掌事者受法職内掌邦之賦入辨其財用之物而執其總典絲掌絲入而辨其物注絲入謂九職之嬪婦所貢之絲地官大司徒以土㑹之法辨五地之物生以土宜之法辨十有二土之名物以土均之法辨五物九等制天下之地征以作民職民九職以令地貢斂財賦賦謂九賦及軍賦乃分地職九職所宜制地貢九職所稅頒職事以為地法而待政令頒職事十有二于邦國都鄙使以登萬民登之於籍一曰稼穡二曰樹藝三曰作材四曰阜蕃五曰飭材六曰通財七曰化材八曰斂材九曰生材十曰學藝十有一曰世事十有二曰服事疏八曰斂材已上與大宰同大宰有九此唯八轉移執事闕生材已下四事是民之事業學問鄭司農云自稼穡至生材即九職以間民解生材後鄭易之小司徒稽國中及四郊都鄙之夫家九比之數注九比冢宰職出九賦之入數閭師以時徵其賦注九賦九貢凡任民任農以耕事貢九穀任之以貢太宰任之以職任圃以樹事貢草木任工以飭材事貢器物任商以市事貢貨賄任牧以蓄事貢鳥獸任嬪以女事貢布帛任衡以山事貢其物任虞以澤事貢其物九職以虞衡為一此以為二唯有八者但九職有臣妾及閒民於此不言之凡無職者即閒民出夫布獨言無職者掌其九賦載師任地見上縣師以嵗時徵野之賦貢甸稍縣都䟽郊内賦貢閭師征歛郊外賦貢縣之遂師旅師斂征均人均地政注地征謂地守地職之稅凶札無力政財賦九賦也遂人以土均平政頒職作事令貢賦遂師入野職野賦于玉府里宰斂其財賦委人斂野之賦土均均地貢諸侯之九貢角人羽人掌葛斂于山澤之農當邦賦之政令司稼以年上下出斂法春官大宗伯大均之禮恤衆注均地政地守地職夏官大司馬施貢分職以任邦國注職謂職稅以九畿之籍施邦國之政職凡令賦以地與民制之司勲惟加田無國正注正稅也禄田亦有給公家之賦貢若今時侯國有司農少府錢穀職方氏制其貢各以其所有懐方氏致方貢致逺物達之以節注逺物九州之外無貢法而至者達貢物以璽節秋官大行人邦畿方千里其外方五百里謂之侯服嵗一見其貢祀物甸服二嵗一見其貢嬪物男服三嵗一見其貢器物采服四嵗一見其貢服物衛服五嵗一見其貢財物要服六嵗一見其貢貨物小行人春入貢注六服所貢貢易氏曰因朝而貢則行人之六也嵗之常貢則大宰之九貢也小行人又有所謂令諸侯春入貢其九貢歟掌交掌邦國之通事而結其交好以諭九稅之利注九稅所稅民九職正義唯臣妾聚歛䟽材者無稅左傳昭十三年子産曰天子班貢輕重以列列尊貢重周之制也卑而貢重者甸服也注謂天子畿内共職貢者楚貢包茅晉歸職貢于王國語周史伯曰王者居九畡之田收經入以食兆民注九畡九州之極數也楚語曰天子之田九畡以食兆民王取經入焉以食萬官漢婁敬傳敬曰周公營雒以四方諸侯納貢職道里均晉志一夫之土十畝之宅三日之徭九均之賦揚子七賦之所養注五穀桑麻易氏曰九賦與九職不同鄭氏皆以為民賦且援漢口率出泉之制王制不明不容不辨邦中之賦即載師㕓里場圃葢王城内外之地四郊之賦即載師宅田士田賈田官田牛田賞田牧田盖六鄉百里之内而外距六遂之地也邦甸即公邑之田任甸地盖距國中二百里六遂之餘地天子使吏治之也家削即家邑之田任稍地盖距國中三百里大夫所食之采地也邦縣即小都之田任縣地盖距國中四百里卿及王子弟之䟽者所食之采地也邦都即大都之田任畺地盖距國中五百里公及王子弟之親者所食之采地也闗市若與九職商賈同此則如司市所言市之征司闗所言闗門之征也山澤若與九職虞衡同此則如卝人取金錫玉石角人取齒角之類也幣餘如職幣所言斂官府都鄙用邦財者之幣振掌事者之餘財也前六者皆任地之賦以其田賦之十一者取於民又於一分之中復以十一十二二十而三輸之於王後三者雖非任地然有司所掌利歸公上故亦謂之賦而繼於任地之後太府一職既有九賦之式又别有邦國及萬民之貢則九賦非任民之賦可知矣周籍田法周徹井地大畧魯語季康子欲以田賦訪諸仲尼仲尼曰先王制土籍田以力而砥其逺邇注籍田謂稅也以力謂三十者受田百畝二十者五十畝六十還田也賦里以入而量其有無里㕓也計財業以為差胡氏曰商賈所居任力以夫而議其老幼力謂徭役以夫家為數也於是乎有鰥寡孤疾有軍旅之出則徵之無則已其嵗收田一井出稯禾秉芻缶米不是過也先王以為足若子季孫欲其法則有周公之籍矣籍田之法周公所制也左傳哀十一年仲尼曰欲行而法則周公之典在論語學而篇道千乗之國注馬曰司馬法六尺為步步百為畝畝百為夫夫三為屋屋三為井井十為通通十為成成出革車一乗千乗之賦其地千成居地方三百一十六里有畸唯公侯之封乃能容之包曰古者井田方里為井十井為乗百里之國適千乗也融依周禮包依王制孟子顔淵篇有若曰盍徹乎鄭注周法什一而稅謂之徹天下之通法詩公劉度其隰原徹田為糧箋云什一而稅謂之徹正義孟子言周曰徹徹乃周之稅法公劉夏時諸侯而言徹者召公以周之世上論公劉以其俱是什一其名可以相通崧髙徹申伯土田箋云正其井牧定其賦稅孟子滕文公問為國孟子曰周人百畝而徹徹者徹也詩云雨我公田遂及我私惟助為有公田雖周亦助也使畢戰問井地古井田之法孟子曰仁政必自經界始經界不正井地不均穀禄不平經界既正分田制禄可坐而定也請野九一而助國中什一使自賦卿以下必有圭田圭田五十畝餘夫二十五畝方里而井井九百畝其中為公田八家皆私百畝同養公田此其大略也注九一者井田以九頃為數而供什一郊野之賦也助殷家稅名周亦用之龍子所謂莫善於助也時諸侯不行助法國中什一者周禮園㕓二十而稅一時行重賦責之什一也孟子欲使野人如助法什一而稅之國中從其本賦二十而稅一以寛之集注曰野郊外都鄙之地也九一而助為公田而行助法也國中郊門之内鄉遂之地也田不井授但為溝洫使什而自賦其一盖用貢法也周之所謂徹法者盖如此世禄常制之外又有圭田以厚君子百畝常制之外又有餘夫之田以厚野人公田以為君子之禄而私田野人之所受先公後私以别君子野人之分上言野及國中二法此獨詳於治野者國中貢法當世已行但取之過於什一爾井地之法諸侯皆去其籍此特其大畧而已徹通也均也周制一夫受田百畝而與同溝共井之人通力合作計畝均收大率民得其九公取其一故謂之徹周禮稅法載師注周稅輕近而重逺近者多役也䟽異義第五田稅今春秋公羊說十一而稅周禮國中園㕓之賦二十而稅一近郊十而稅一逺郊二十而稅三有軍旅之嵗一井九夫百畮之賦出禾二百四十斛芻秉二百四十六釜米十六斗案公羊十一稅逺近無差漢制收租田有上中下與周禮同義鄭𤣥之聞也周禮制稅法輕近而重逺者近者勞逺者逸故也漢無授田之法與周禮同義未之思也又周禮無云出禾芻秉釡米之事若然周禮稅法據王畿公羊稅法據諸侯邦國諸侯邦國無逺近之差者以其國地狹少役賦事暇左傳注宣十五年周法民耕百畝公田十畝借民力而治之稅不過此三禮義宗周禮天子畿内稅民之法有二一曰貢二曰賦貢謂有職任而收其稅賦者計其可任而口率出錢諸侯貢稅雖俱什一而郊内郊外收籍不同甫田正義食貨志云井方一里是九夫八家共之各受私田百畝公田十畝是為八百八十畝餘二十畝為廬舍其言取孟子為說而失其本㫖班固既有此言由是羣儒遂謬何休之注公羊范甯之解榖梁趙岐之注孟子宋均之說樂緯咸以為然皆義異於鄭理不可通何則言井九百畝其中為公田則中央百畝共為公田不得家取十畝也八家皆私百畝則百畝皆屬公矣何得復以二十畝為廬舍也言同養公田是八家共理公事何得家分十畝自治之也為廬舍則家别二畝半亦入私矣則家别私有百二畝半何得為八家皆私百畝也此皆諸儒之謬鄭於匠人注云野九夫而稅一此箋云井稅一夫其田百畝嵗取為稅斂之言十千即期限之數參之於司馬之書校之於一成之稅其數正允箋云嵗取十千於井田之法則一成之數也夫通十為成成方十里成稅百其田萬畝魯稅畝田賦春秋宣公十五年秋初稅畝杜氏注公田之法十取其一今又履其餘畝復十收其一故哀公曰二吾猶不足遂以為常故曰初左氏𫝊初稅畝非禮也穀出不過藉以豐財也注周法民耕百畝公田十畝借民力而治之稅不過此榖梁古者什一藉而不稅非公之去公田而履畝十取一也注私得其什官稅其一故曰什一公羊譏始履畝而稅也古者什一而藉什一者天下之中正什一行而頌聲作矣哀公十二年春用田賦左傳注别其田及家財各為一賦公羊注田賦若今漢家斂民錢以田為率禮稅民公田不過什一軍賦十井不過一乗胡氏𫝊田以出粟為主而足食賦以出軍為主而足兵今用田賦軍旅之征非矣家語季氏以一井田出賦法賦畝本籍而為稅井本稅而為賦丘本而為甲皆自四而増左氏𫝊昭公四年九月鄭子産作丘賦注丘十六井當出馬一匹牛三頭今子産則賦其田如魯之田賦服䖍以為子産作丘賦賦此一丘之田使之出一馬三牛復古法耳哀二年初周人與范氏田公孫尨稅焉十一年夏陳轅頗為司徒賦封田注封内之田悉賦稅之王制千里之内曰甸千里之外曰采注甸謂服治田出榖稅曰采九州之地内取其美物以當榖稅也又䟽曰鄭荅臨碩云王畿方千里者凡九百萬夫之地三分去一定受田者三百萬夫出都家之田以其餘地之稅禄無田者管子桓公踐位十九年弛闗市之征五十而取一賦禄以粟案田而稅二嵗而稅一上年什取三中年什取二下年什取一嵗飢不稅嵗飢弛而稅史記年表秦孝公十四年初為賦秦有口賦漢筭賦紀髙帝四年八月初為筭賦注如淳曰漢儀注民年十五以上至五十六出賦錢人百二十為一筭治庫兵車馬二年五月注如淳曰律年二十三𫝊之疇官惠帝六年冬十月令女子年十五以上至三十不嫁五筭注應邵曰漢律人出一筭筭百二十錢唯賈人與奴婢倍筭令使五筭罪謫之也賈捐之𫝊孝文偃武行文民賦四十丁男三年一事注如淳曰常賦嵗百二十􅀊一事時天下民多故出賦四十三嵗一事賈山𫝊禮髙年九十者一子不事八十者二筭不事景紀二年冬十二月令天下男子年二十始傅注舊法二十三後二年五月詔今訾筭十以上廼得官朕甚愍之注服䖍曰訾萬錢筭百二十七也應劭曰十筭十萬也賈人有財不得為吏亷士無訾不得官故減訾四筭訾筭四得官武紀建元元年春二月赦天下年八十復二筭九十復甲卒注張晏曰二筭復二口之筭復甲卒不豫革車之賦鹽鐵論御史曰今陛下寛力役之政二十三始賦五十六而免賈捐之𫝊孝武時民賦數百宣紀地節三年十月詔流民還歸者且勿筭事注師古曰不出筭賦及給徭役甘露二年正月詔減民筭三十一筭减錢三十成紀建始二年正月辛巳詔減天下賦錢筭四十注孟康曰本筭百二十今減四十為八十周禮注寛疾若今癃不可事不筭卒可事者半之也大司徒注老者謂若今八十九十復羡卒也鄉大夫注賦口率出泉也今之筭泉民或謂之賦此其舊名與闗市山澤謂占㑹百物幣餘謂占賣國中斥幣皆未作當增賦者若今賈人倍筭矣大宰注晁錯𫝊秦之發卒也死事之後不得一筭之復食貨志錯論貴粟曰令民有車騎馬一匹者復卒三人如淳曰復三卒之筭錢也或曰除三夫不作甲卒也師古曰當為卒者免其三人不為卒者復其錢車騎天下武備故為復卒西域𫝊征和中詔曰前有司奏欲益民賦口三十助邉用師古曰毎口轉增三十錢也是重困老弱孤獨也當今務在禁苛暴止擅賦文選王元長䇿秀才文充都内之金注桓子新論曰漢宣已來百姓賦錢一嵗餘二十萬藏於都内紀武帝元光六年冬初筭商車元狩四年冬初筭緡錢千錢出筭二十元封元年登封詔四縣無出今年筭自博至梁父昭帝元鳯二年六月令三輔太常郡得以菽粟當賦後紀章帝元和元年二月甲戌募人耕公田與田器勿收租五嵗除筭三年二年正月乙酉詔曰令云人有産子復勿筭三嵗今復其夫勿筭一嵗髙帝七年春民産子復勿事五􅀊光武建武中民有産子者復以三年之筭後漢書論漢法常以八月筭民漢儀注曰八月初為筭賦漢田租帝紀髙帝元年四月留蕭何收巴蜀租給軍糧食二年二月癸未蜀漢民給軍事勞苦復勿租稅二嵗復者除其賦役也十一年冬諸縣堅守者復租三嵗惠帝髙十二年即位五月丙寅減田租復十五稅一鄧展曰漢家初十五稅一中間廢今復之文帝二年九月詔賜天下民今年田租之半三年復晉陽中都民三嵗租十二年三月詔賜農民今年租稅之半十三年六月詔曰農厪身從事而有租稅之賦本末無以異其除田之租稅李竒曰官農與賈俱出租無異故除田租景帝元年五月令田半租武帝元封元年除四縣民田租四年賜汾隂等三縣無出今年租賦五年四月赦天下所幸縣無出今年租賦昭帝始元二年詔毋令民出今嵗田租宣帝本始五年五月鳯皇集赦天下租稅勿收四年四月壬寅地震勿收租賦大赦神爵元年詔所過無出今年田租甘露三年二月詔毋出今年租元帝初元元年夏四月詔曰闗東今年榖不登毋出田租成帝建始元年十二月郡國被災什四以上毋收田租食貨志髙祖約法省禁輕田租十五而稅一量吏禄度官用以賦於民文帝時晁錯說上曰使天下人入粟於邉以受爵免罪邉食足支五嵗可令入粟郡縣足支一嵗以上可時赦勿收農民租上從其言廼下詔賜民十二年租稅之半明年遂除田之租稅後十三年孝景二年令民半出田租三十而稅一武帝時董仲舒說曰秦除井田田租口賦鹽鐡之利二十倍於古或耕豪民之田見稅十五漢興循而未改宜限民名田溝洫志元鼎六年上曰今内史稻田租挈重不與郡同其議減注租挈收田租之約令也列𫝊貢禹上書以為今農夫已奉榖租又出槀稅鄉部私求不可勝供宜除其租銖之律師古曰租稅之法皆依田畝不得雜計百物之銖兩兒寛為左内史以負租課殿當免民輸租繦屬課更以最何武弟顯家有市籍租常不入縣數負其課後紀光武建武六年十二月癸巳詔曰頃者師旅未解用度不足故行什一之稅今軍士屯田糧儲差積其令郡國以見田租三十稅一如舊制二十二年令南陽勿收今年田租中元元年四月己夘改元勿出今年田租二年九月赦隴西勿收今年租調明帝永平五年十月常山三老言於帝曰上生於元氏願蒙優復其復元氏田租更賦六嵗章帝元和二年二月丙子復博奉髙嬴無出今年田租芻槀和帝永平元年三月庚寅復流民田租安帝元初元年十月乙夘詔除三輔三嵗田租更賦口筭順帝永建元年十月甲辰令人半輸今年田租永平四年六年九年十二年十四年十六年元初元年延光元年三年永建元年三年六年永和三年延熹八年已上並勿收田租芻槀禮司稼以年之上下出斂灋注若今十傷二三實除減半史記年表秦簡公七年初稅禾秦作阿房收大半之賦漢獻賦帝紀髙帝十一年二月詔曰欲省賦甚今獻未有程吏或多賦以為獻而諸侯王尤多民疾之令諸侯王通侯常以十月朝獻及郡各以其口數率人嵗六十三錢以給獻費文帝元年六月令郡國無來獻施惠天下諸侯四夷逺近歡洽後六年夏四月令諸侯無入貢景帝後二年四月詔不受獻減大官省繇賦後紀安帝永初五年二月丁夘詔省減郡國貢獻順帝永建四年五月桂陽獻大珠封以還之隋志漢之常科土貢方物漢軍賦即筭賦惠紀髙二十年五月丙寅即位令吏六百石以上及故吏嘗佩將軍都尉印將兵及佩二千石官印者家唯給軍賦他無有所與食貨志殷周之盛云云有賦有稅稅謂公田什一及工商衡虞之入賦共車馬兵甲士徒之役秦頭會箕斂以供軍費漢口賦帝紀昭帝元鳯二年六月詔曰朕閔百姓未贍頗省乗輿馬及苑馬以補邊三輔傳馬其令郡國毋斂今年馬口錢租及六畜三輔太常郡得以菽粟當賦四年春正月丁亥帝加元服毋收四年五年口賦儀注民年七􅀊至十四出口賦者錢人二十三二十錢以食天子其三錢者武帝加口錢以補車騎馬元鳯元年春二月詔減口賦錢有司奏請減什三上許之宣帝五鳯三年三月詔減天下口錢貢禹𫝊禹以為古民無賦筭口錢起武帝征伐四夷重賦於民産子三嵗則出口錢故民重困至於生子輒殺甚可悲痛宜令兒七嵗去齒乃出口錢年二十乃筭天子下其議令民産子七嵗乃出口錢自此始後紀光武建武二十二年九月詔曰其口賦逋稅勿收責明帝永平九年春三月辛丑詔郡國死罪囚減罪與妻子詣五原朔方又復其口筭安帝永初四年正月辛夘詔三輔人庻流冗除三年逋租過更口筭芻槀元初元年十月乙夘詔除三輔三嵗田租更賦口筭六年四月㑹稽除田租口賦建光元年十一月地震被災甚者勿收口賦順帝永建三年正月乙未詔勿收漢陽田租口賦陽嘉元年三月禀冀州貧民勿收更租口賦永和三年春地震除今年田租尤甚者勿收口賦食貨志董仲舒曰秦田租口賦鹽鐡之利二十倍於古鹽鐵論文學曰今田雖三十而頃畝出稅加以口賦更繇之役率一人之作中分其功農夫悉其所得或假貸而益之漢更賦繇賦帝紀文帝二年十一月詔省繇費以便民景帝後二年四月詔省繇賦昭帝元鳯四年正月丁亥帝加元服三年以前逋更賦未入者皆勿收注如淳曰更有三品有卒更有踐更有過更古者正卒無常人皆當迭為之一月一更是謂卒更也貧者欲得顧更錢次直者出錢顧之月二千是謂踐更也天下人皆直戍邊三日亦名為更律所謂繇戍也雖丞相子亦在戍邊之調不可人人自行三日戍又行者當自戍三日不可往便還因更住一嵗一更諸不行者出錢三百入官官以給戍者是為過更也律說卒踐更者居也居更縣中五月乃更也後從尉律卒踐更一月休十一月也食貨志曰董仲舒云月為更卒已復為正一嵗屯戍一嵗力役三十倍於古此漢初因秦法而行之也董仲舒曰漢興循而未改謂卒嵗嵗一月正卒二嵗大畧與秦相似衛正謂二十三􅀊後應為士材官者後遂改易有謫乃戍邊一嵗耳逋未出更錢者也師古曰更卒謂給郡縣一月而更正卒謂給中都官者元平元年二月詔減外繇霍光知時務之要輕繇薄賦與民休息宣帝五鳯四年正月以邊塞亡冦減戍卒什二元帝永光三年冬用度不足民多復除無以給中外繇役百官表爵四不更言不豫更卒之事也十二左更十三中更十四右更言主領更卒部其役使也溝洫志河平元年卒治河者為著外繇六月注以卒治河有勞雖執役日近皆得比繇戍六月也著著簿籍也後二嵗治河卒非受平賈者為著外繇六月注律說平賈一月得錢二千王子侯表祚陽侯劉仁坐擅興繇賦削爵功臣表東茅侯劉到坐事國人過員免文十六年信武侯靳亭祝阿侯髙成文後三年坐事國人過律免列𫝊賈誼上䟽淮南地逺者或數千里吏民繇役往來長安者自悉而補中道衣敝錢用諸費稱此晁錯言今逺方之卒守塞一嵗而更賈山言周用民力不過嵗三日什一而籍陛下減外徭衛卒霍去病率師征匈奴渾邪王降減隴西北地上郡戍卒之半以寛天下繇役史記文十二年除戍卒令吳王濞其居國以銅鹽故百姓無賦卒踐更輒予平賈注師古曰謂庸直也服䖍曰當為更卒出錢三百謂過更自行為卒謂踐更晉灼曰謂借人自代為卒者官為出錢顧其時庸師古曰晉說是卜式賜外繇四百人蘓林曰外繇謂戍邊也一人出三百錢謂之過更式􅀊得十二萬錢也段㑹宗為西域都䕶西域敬其威信三嵗更盡還如淳曰邊吏三􅀊一更下言終更是也魏相河南卒戍中都官者二三千人師古曰若今衛士上畨分守諸司葢寛饒衛卒數千人願復留共更一年身為司𨽻子常步行自戍北邊不取代翟方進綏和二年賜冊曰君聴羣下言用度不足奏請一切增賦稅城郭堧及田園過更筭馬牛羊谷永止諸繕治宫室闕更減賦盡休力役注更卒也文翁為蜀郡守修起學官招下縣子弟為學宫子弟為除更繇循吏郭解隂請尉史曰是人吾所重至踐更而脱之每至直更數過吏弗求游俠王莽傳漢氏減輕田租三十而稅一常有更賦罷癃咸出貨殖𫝊農工商賈率嵗萬息二千百萬之家即二十萬而更繇租賦出其中史大事記髙后五年初令戍卒嵗更詩曰昔我往矣楊栁依依今我來思雨雪霏霏則周初之戍期一年半而更也齊戍葵丘𤓰時而往及𤓰而代則春秋時之戍期一年而更也補兵志更卒非正卒也人直一月猶踐履而去若顧人為之當隨其月緩急貴賤為之直謂之平賈漢錢重不得定為二千也若不直而入錢於官是為更賦其畨上尉主之其不役而收其直謂之更賦更卒給郡國嵗一月不役者官收其庸其輕重未詳唐法嵗役二旬不役者收其庸日絹三尺過更言三日之戍過之即更猶更率一月名踐更也非謂出錢入官乃名過更索隠案姚氏云古者更卒不過一月踐更五月而休又顔云五當為三一嵗之中三月居更三日戍邊總九十三日此所謂一嵗力役三十倍於古鹽鐵論賢良曰古者天子封畿千里繇役五百里無踰時之役後紀光武建武五年十二月詔復濟陽三年徭役二十一年十二月壬寅復六嵗三十年又復六年正月章陵世世復徭役比豐沛十三年文書調役務從簡寡明帝中元二年九月羌㓂隴西發天水三千人復是嵗更賦顧更之錢永平五年冬十月復元氏田租更賦六嵗和帝永元六年三月庚寅詔流民還歸者復一嵗田租更賦安帝永初四年正月辛夘詔三輔除三年逋租過更順帝永建五年四月辛巳詔郡國貧人勿收今年過更永和四年八月癸丑以太原旱民流遣光禄大夫案行禀貸除更賦虞詡𫝊永平章和中州縣以走卒錢給貸貧人走卒伍伯之類令出資錢不役其身仲長統𫝊昌言曰可為法制畫一定科租稅十一更賦如舊板楯蠻夷𫝊程包對曰長吏鄉亭更賦至重漢海租蠻夷租賦食貨志五鳯中耿夀昌白增海租三倍蕭望之奏御史屬徐宫家在東莱言往年加海租魚不出武帝時縣官嘗自漁魚不出復予民魚乃出平紀元始元年置少府海丞師古曰主海稅馮唐𫝊魏尚守雲中軍市租以給士卒髙五王𫝊主父偃曰齊臨菑十萬户市租千金後漢𫝊秦置黔中郡漢改武陵嵗令大人輸布一匹小口二丈是為賨布順帝永和元年武陵太守上書以蠻夷率服可比漢人增租賦尚書令虞詡奏增之必怨叛帝不從其冬蠻争貢布非舊約遂叛秦惠王并巴中君長嵗出賦二千一十六錢三嵗一出義賦千八百錢民户出幏布八丈二尺鷄羽三十鍭漢興南郡守靳彊請依秦故事秦昭王復板楯夷人頃田不租十妻不筭殺人以倓錢贖髙祖發夷人定三秦復渠帥七姓不輸租賦餘户嵗入賨錢口四十永平中鄭純與哀牢夷人約邑豪嵗輸布貫頭衣二領鹽一斛為常賦禹貢蠻夷言貢而不言賦盖荒服之地則異三壤什一之法所不及晉户調式通典晉武帝平吳之後制户調之式丁男之户嵗輸絹三匹綿三斤女及次丁男為户者半輸其邊郡或三分之二逺者三分之一夷人輸賨布户一匹逺者一丈不課田者輸義米戸三斛逺者五斗極逺者輸筭錢二十八文成帝咸和五年始度百姓田取十分之一率畝稅米三升哀帝減田租畝收二升孝武太元二年除度田收租之制公王以下口稅三斛八年又增稅米口五石志同隋減賦役食貨志隋初依周制役丁為十二畨開皇三年減十二畨每嵗為三十日役減調絹一匹為二丈初蘓威父綽在西魏世以國用不足為稅法頗重歎曰今所為如張弓後之君子誰能弛乎威為納言奏減賦役從之唐賦役法紀武徳二年二月十四日乙酉初定租庸調法㑹要武徳六年三月令毎嵗一造帳三年一造籍七年三月二十九日始定均田賦稅寳厯二年正月戸部侍郎崔元畧奏凖賦役令云云六典唐賦役之制有四一曰租二曰調三曰役四曰雜徭注開元二十三年以天下無事敕減諸司色役一十二萬二百九十四嶺南諸州則稅米上戸一石二斗次戸八斗下戸六斗若夷獠之戸皆從半輸蕃胡内附者上戸丁稅錢十文次户五文下戸免附經二年者上戸丁輸羊二口次户一口下户三户共一口食貨志唐授人以口分世業取之以租庸調之法凡授田丁嵗輸粟二斛稻三斛謂之租陸宣公奏議云丁男一人受田百畝嵗納租粟二石丁隨鄉所出嵗輸絹二匹綾絁二丈布加五之一綿三兩麻三斤非蠶鄉則輸銀十四兩謂之調陸云毎丁各隨鄉土所出嵗輸綾若絁共二丈綿三兩其無蠶則輸布二丈五尺麻三斤用人力嵗二十日閏加二日不役者日為絹三尺謂之庸有事而加役二十五日免調六典云旬有五日免調加會要租二石絹一丈綿三兩有事役旬有五日者免調三十日者租調皆免通正役不過五十日凡里有手實嵗終具民之年與地闊狹為鄉帳鄉成於縣縣成於州州成於户部又有計帳具來嵗課役以報度支國有所須先奏而斂水旱霜蝗耗十四者免租桑麻盡者免調田耗十六者免租調耗十七者諸役皆免凡新附之户春以三月免役夏以六月免課秋以九月課役皆免配租以斂穫早晚險易逺近為差庸調輸以八月發以九月同時輸者先逺民皆自槩量州府嵗市土所出為貢其價視絹之上下無過五十匹異物非有詔不獻有加配以代租賦𤣥宗初立蠲徭役者給蠲符以流外及九品京官為蠲使嵗再遣之開元八年正月二十日頒租庸調法于天下好不過精惡不至濫闊者一尺八寸長者四丈開元十六年會要十八年十一日詔每三嵗以九等定籍而庸調折租所取華好先是揚州租調以錢嶺南以米安南以絲益州以羅紬綾絹供春綵因詔江南亦以布代租中書令李林甫為長行㫖以授朝集使二十四年户部修長行㫖條五卷以租庸丁防和糴春綵稅草無定法也凡庸調租皆任土所宜州縣長官涖定麤良二十五年以江淮輸運有河洛之艱而闗中蠶桑少菽粟賤令庸調皆以米凶年樂輸布絹亦從之河南北不通運州租皆為絹代闗中庸天寳五載詔貧者毎鄉免三十丁租庸天下嵗入租錢二百餘萬緡粟千九百八十餘萬斛調絹七百四十萬匹綿百八十餘萬屯布千三十五萬餘端肅宗初第五琦請於江淮置租庸使韋倫為荆襄道租庸使收租庸二百萬緡吳鹽蜀麻銅冶皆有稅廣徳元年詔戸三丁免一丁凡畝稅二升大厯元年天下苗一畝稅錢十五號青苗錢又地頭錢毎畝二十上都秋稅分二等五年始定法夏上田畝稅六升秋上田畝稅五升青苗錢畝加倍陸贄䟽云國家賦役之法曰租曰調曰庸其取法逺其斂財均其域人固有田則有租有家則有調有身則有庸天下為家法制均一雖轉徙莫容其姦故人無揺心天寳之季海内波蕩版圖隳於避地賦法壊於奉軍賦役舊法行之百年人以為便兵興供億不常誅求隳制此時弊非法弊也非力所出則不征非土所有則不貢唐十道貢賦六典戸部郎中凡天下十道任土所出而為貢賦之差志云掌户口土田賦役貢獻對舊額貢獻多非土物開元二十五年敕令中書門下朝集使隨便條革以為定凖調絹闗輔寡蠶詔納米粟其河南河北非通漕州皆大府卿絹分為八等布分為九等貞元元年十二月户部奏貢物至者州府一百五十六地理志太宗因山川形便分天下為十道一曰闗内道厥賦絹綿布麻厥貢毛羽革角布席弓刀二曰河南道厥賦絹絁綿布厥貢絲布葛席埏埴盎缶三曰河東道厥賦布襺厥貢布席豹尾熊皮鵰羽六典有墨蠟石英麝參四曰河北道厥賦絲絹厥貢羅綾紬紗鳯翮葦席五曰山南道厥賦絹布綿紬厥貢金絲紵漆六典有鐵麝縠綾六曰隴右道厥賦布麻厥貢金屑礪石鳥獸革角七曰淮南道厥賦絹絁綿布厥貢絲布紵葛六典􅀭州貢青銅鏡八曰江南道厥賦麻紵厥貢金銀紗綾蕉葛綿綀鮫革藤紙丹沙九曰劒南道厥賦絹綿葛紵厥貢金布絲葛羅綾綿紬羚角犛尾十曰嶺南道厥賦蕉紵落麻厥貢金銀孔翠犀象綵藤竹布百官志度支掌天下租賦物産豐約之宜水陸道涂之利嵗計所出而支調之以近及逺太府卿凡四方貢賦百官俸秩謹其出納賦物任土所出定精麤之差丞四人元日冬至以方物陳于庭者受而進之元和十二年十二月淮西申光蔡等州貢物户部奏以元日陳於樂縣之南用示中外左藏令掌天下賦調卿及御史監閲張廷珪𫝊景龍中詔河南北兩道蠶産所宜雖水旱得以蠶折租廷珪謂股肱走集安可殫其力願依貞觀永徽故事凖令折免詔可崔衍𫝊遷宣歙池觀察使宣歙舊貢金錫凡十八品皆倍直市于它州衍蠲革之通典按令文諸郡貢獻皆盡當土所出凖絹為價多不過五十匹並以官物充市所貢至薄其物易供唐停嵗貢省貢獻紀永徽六年十一月戊子停諸州貢珠儀鳯三年十月丙申停劒南隴右嵗貢開耀元年正月己亥省諸方貢獻開元二年七月乙未焚錦繡珠玉于前殿戊戌禁采珠玉廢織錦坊大厯十四年閏五月丙子徳宗罷諸州府及新羅渤海貢鷹鷂戊寅罷山南貢枇杷江南甘橘非供宗廟者辛巳罷邕府嵗貢奴婢癸未罷劒南貢生春酒丙戌罷獻祥瑞貢器以金銀飾者還之六月己亥減乗輿服御己未罷􅀭州路貢鏡幽州貢麝十月戊午罷九成宫貢立獸炭襄州蔗蒻工元和四年閏月己酉禁刺史境内𣙜率諸道㫖條外進獻大中九年七月庚申罷淮南宣歙浙西冬至元日常貢以代下户租稅順宗罷鹽鐡使月進唐兩稅法徳宗紀建中元年二月丙申初定兩稅舊紀遣黜陟使分行天下食貨志租庸調之法以人丁為本自開元後天下户籍乆不更造丁口轉死田畝貿易貧富升降不實其後國家侈費無節而大盗起兵興財用益屈而租庸調法弊壊一本云所在賦斂廹趣取辦無復常準賦斂之司各隨意征科自目色目民富者丁少率為官為僧以免課役而貧者丁多無所伏匿故上戸優而户勞民率徙為浮户土著者百無五自代宗時始以畝定税而斂以夏秋至徳宗相楊炎遂作兩税法夏輸無過六月秋輸無過十一月置兩税使以總之建中三年八月初分置汴東西水陸運兩税鹽鐵使十二月二十日包吉崔縱分為之量出制入戸無主客以居者為簿人無丁中以貧富為差商賈税三十之一與居者均役田税視大厯十四年墾田之數為定遣黜陟之使按比諸道丁産等級免鰥寡孤獨不濟者敢有加斂以枉法論議者以租庸調髙祖太宗之法也不可輕改而徳宗方信用炎不疑舊户三百八十萬五千使者按比得主户三百八十萬客户三十萬自是人不土斷而地著賦不加斂而增入版籍不造而得其虛實吏不戒而奸無所取嵗斂錢二千五十餘萬緡米四百萬斛以供外錢九百五十餘萬緡米一千六百餘萬斛以供京師稅法既行民力未及寛而朱滔王武俊田恱合從而叛用益不給通典建中初分命黜陟使往諸道收戸口及錢榖名數每嵗天下共斂三十餘萬貫千五百萬貫供外費九百五千餘萬供京師稅米麥千六百餘萬石二百餘萬石供京師十四百萬供外費㑹要大厯四年正月十八日敕王公已下宜准度支長行㫖條稅錢上上戸四千下下戸五百其見在官一品准上上戸稅九品准下下戸稅志大厯元年詔天下苗一畝稅鈔十五以用急不及秋方苖青即征之號青苗錢又有地頭錢每畝二十通名為青苗錢又詔上都秋稅分二等上等畝稅一斗下等六升荒田二升五年始定法夏上田畝稅六升下田四升秋上田畝稅五升下田三升荒田如故青苖錢畝加一倍而地頭錢不在焉紀廣徳二年七月庚子初稅青苗建中元年正月五日辛未遣黜陟使與觀察使及刺史轉運所由計百姓及客等約丁産定等第均率作年支兩稅如當處土風不便更立一限其比來徵科色目一切停罷二月十一日丙申仍與觀察使刺史計人産等級為兩稅法此外斂者以枉法論八月宰相楊炎上䟽奏曰至徳之後軍國之用仰給於度支轉運二使四方征鎮又自給於節度團練使朝廷不能覆諸使諸司不能覆諸州四方貢獻悉入内庫今請作兩稅法以一其名三年五月初加稅時淮南節度陳少游請於當道兩稅錢每一千加稅二百度支因請諸道悉加之貞元八年四月劒南西川觀察使韋臯奏請加稅什二以增給官吏從之志貞元四年詔天下兩稅審等第髙下三年一定戸度支稅物頒諸司皆增本價為虚估謂之折納復有進奉宣索召顧和市比大厯之數再倍陸贄請釐革其甚害者大畧有六國家賦役之法此時弊非法弊也兩稅新制取大厯中一年科率多者為兩稅定法此采非法之權令以為經制總無名之暴賦而立常規也兩稅以資産為宗不以丁身為本資産少者稅輕多者稅重計估筭緡失平長偽挾輕貲轉徙者脫徭稅篤本業者困斂求此誘之為姦敺之避役一曰請每道以知兩稅判官一人與度支㕘計戸數量土地肥瘠物産多少為二等二曰復庸調舊制隨土所宜三曰租以去嵗輸數為常罷據額所率者增闢勿益租廢耕不降數四曰蠶事方興而輸縑農功未艾而斂榖宜定稅期隨風俗時􅀱五曰時稔則廣糴小歉則借貸六曰為占田條限事無施行者憲宗罷除官受代進奉及諸道兩稅外𣙜分天下之賦以為三一曰上供二曰送使三曰留州元和四年十二月宰相裴垍又令諸道節度觀察調費取於所治州不足則取於屬州而屬州送使之餘與其上供者皆輸度支穆宗即位罷諸道貢獻自建中定兩稅而物輕錢重民以為患至是四十年為絹二疋半者為八匹率加三倍元和十五年閏正月十七日詔百官議革弊戸部尚書楊於陵曰宜使天下兩稅𣙜酒鹽利上供及留州送使錢悉輸以布帛榖粟宰相善其議元和十五年八月由是兩稅上供留州皆易以布帛絲纊租庸課不計錢而納布帛唯鹽酒計錢長慶元年正月詔河北諸道均定兩稅九月詔兩稅皆輸布絲纊會要元和四年六月詔兩稅法不定物估爰命帖職周視四方以􅀭子鹽鐡留後為江淮已南兩稅使江陵留後為荆衡漢沔東界彭蠡南及日南兩稅使度支山南西道分巡院官充三川兩稅使收復淄青十二州命諫議大夫王彦威為兩稅使七年七月荆南淛江東道兩稅使崔俊程异以入計叙勞顧少連𫝊改京兆尹先是京畿租賦薄厚不能一少連以法均之李翺𫝊條興復太平大畧曰改稅法不督錢而納布帛翺為平賦書一篇獨孤及𫝊為舒州刺史作口賦法處士楊賁以書譏之後周顯徳三年十月立二稅限夏以六月秋以十月唐平賦書文粹李翺平賦書序云人皆知重斂之可以得財不知輕斂之得財愈多取可行於當時者為平賦書而什一之法存焉凡為天下者眂千里之都為千里之都者眂百里之州為百里之州者起於百里之田開寳均定稅額二年四月己夘詔兩稅折科非土所宜毋得抑配九年正月遣太常丞魏咸熙均定開封屬縣三等戸稅額至道元年六月己夘令諸州重造兩稅版簿頒其式于天下祥符四年七月壬申朔免南方民丁身錢至和元年九月詔滄州均田稅民或未便其令復輸如舊嘉祐五年四月丙戌詔均天下田稅命三司使包拯等詳定髙本以為不可均復罷六月丙寅張掞同詳定六年五月丁酉吕景初同詳定會要凡租稅榖帛金鐡物産為四類榖之品七帛之品十金鐡之品四物産之品六通畧自郭諮均稅之法罷論者謂朝廷徒䘏一時之勞而失經逺之慮至皇祐中天下墾田視景徳增四十萬頃而嵗入榖廼減七十萬石初慶厯中三司言先於淮南亳夀京西蔡汝州如方田法均之於是京西遣郭諮既而中止至是復遣孫琳等五人分往均田三司置局拯與右諫議吕居簡户部副使吳中復詳定其後雖用古法稍均數郡田於天下不能盡行張方平曰景徳以前天下財利所入茶鹽酒稅嵗課一千五百餘萬緡未聞加賦於民而調度克集慶厯以後財利之入三倍前朝諸鑪嵗課上下百萬緡嵗入茶鹽酒稅雜利至五千萬緡而惟日不足景徳定土貢四年閏五月戊辰詔曰任土貢輸雖存舊典經途遐邈亦念重勞三司所定劒隴等三十九州軍所貢土物並從蠲減䕫賀等二十七州軍悉罷所貢毎嵗正旦止具表以聞明道二年六月戊午減天下嵗貢物治平四年四月二十四日神宗詔罷諸道貢之物天聖減畿内民租九年正月辛未減畿内民租志仁宗嗣位首寛畿縣田賦慶厯中患賦役之煩詔下諸路上其數俾大臣議蠲減宋朝五賦國史志嵗賦其類有五曰公田之賦官莊屯營田賦民耕而收其租曰民田之賦百姓各得專之曰城郭之賦宅稅地稅之類曰雜變之賦牛革蠶鹽食鹽之類隨其所出變而輸之曰丁口之賦計丁率米凡賦入州縣有籍嵗一置謂之空行簿以待嵗中催科閏年别置謂之實行簿藏有司天聖初或言實行簿無用罷之景祐元年韓瀆䟽言賦輿之繁但存催科一簿一有散亡耗登無從考請復置實行簿詔再閏一造慶厯中王素言田賦輕重不等請均定歐陽修言孫琳嘗徃肥鄉與郭諮以千步方田法括定名田願召二人者三司請於亳壽蔡汝四州擇尤不均者均之遣諮蔡州諮首括一縣得田二萬六千九百二十餘頃均賦於民州縣未可盡括朝廷重勞人遂罷嘉祐五年復詔均定遣官分行諸路纔均數郡田而已田賦之外佐縣官之用者有山澤之貨關市之征酒麴之入仁宗在位有司言利者多擯不取聞民有疾苦雖厚利舍之無所愛貢獻珍異故事有者或罷之山林川澤陂地之利久與民共者屢敕有司毋輒禁止易之小畜徳之小也則曰富以其鄰泰與謙道之大也皆曰不富以其鄰剥始於下其象曰上以厚下安宅所以救剥也玉海卷一百七十九
