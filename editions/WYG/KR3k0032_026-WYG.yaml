body:
  text: 玉海卷二十六宋王應麟撰帝學帝學學之一字髙宗與𫝊説始言之開萬世聖學之源神農師悉諸黄帝師大橈顓頊師伯夷受學於緑圖髙辛師伯招堯師子州支學君疇尹夀舜師許由莊子云堯師許由學務成招禹師大成摰學西王國湯學威子伯學於伊尹髙宗學甘盤文王師太公望學子期武王問丹書於尚父訪洪範於箕子學虢叔成王師周公學有緝熙于光明穆天子𫝊蠧書于羽陵讀書于菞丘癸巳至于羣玉之山先王之所謂策府漢講六藝羣書石渠論六經紀宣帝髙才好學師受詩論語孝經王褒𫝊宣帝修武帝故事講論六藝羣書召能為楚辭九江被公召見誦讀召髙才劉向張子僑華龍柳褒等待詔金馬門公孫𢎞傳贊孝宣講論六藝招選茂異而蕭望之梁丘賀夏侯勝韋无成嚴彭祖尹更始以儒術進翟酺𫝊孝宣論六經於石渠注甘露三年詔諸儒講五經於殿中兼平公穀同異上親臨決時更崇榖梁𫝊故言六經武帝憲章六學積思六經漢講論五經見白虎議奏孝宣本始四年四月詔博問經學之士元康元年八月詔朕不明六蓺鬱于大道帝王圖籍日陳于前漢禁中授經侍講華光殿侍講注籍世祖召桓榮説尚書善之入授太子朝㑹於公卿前敷奏經書和帝即位竇憲上疏曰昭帝八嵗即位大臣輔政選名儒韋賢魯詩蔡義韓詩夏侯勝歐陽尚書等入授於前卒成聖徳近建初元年張酺魏應召訓講禁中昔五更桓榮為帝師子郁𫝊父業再以校尉入授先帝章和二年五月詔長樂少府桓郁侍講禁中父子給事禁省更歴四世又宗正劉方善為詩經宜令郁方並入敎授由是復入侍講郁子焉順帝時以太傅入授經禁中焉兄孫彬桓帝初為議郎入侍講禁中肅宗令馬嚴勸學省中注王鳯薦班伯宜勸學王吉云明師居前勸誦在後鄧𢎞治歐陽尚書授安帝禁中光武令郅惲授皇太子韓詩侍講殿中永平初樓望為侍中入講省内召馴字伯春習韓詩建初元年侍講拜左中郎將入授諸王永平九年置五經師張酺以尚書數講御前論難稱意入授太子酺子蕃以郎侍講桓帝以楊秉明尚書召入勸講建和初議郎趙典侍講禁内黄瓊以選入侍講禁巾靈帝初劉寛拜太中大夫侍講華光殿賜衣一襲後為太尉常令講經洛陽宫殿簿云在華林園内北洛陽宫殿名曰華光在崇光殿楊賜建寧初侍講華光殿中後帝徙南宫閲録故事得前侍講注籍所注之録籍乃感悟封臨晉侯張濟侍講獻帝好學荀悦彧董遇孔融侍講禁中旦夕譚論漢講論經理永平自講經藝御講堂説經光武數引公卿郎將講論經理夜分乃寐幸太學㑹博士論難正旦朝賀百僚畢㑹令羣臣能説經者更相難詰戴憑重坐五十餘席樊準曰光武投戈講藝息馬論道孝明垂情古典遊意經蓺毎享射禮畢正坐自講諸儒並聽四方欣欣召名儒充禮官如趙孝承宫等或安車結駟或豐衣博帶從見宗廟燕㑹則論難衎衎響如振玉期門羽林之士通孝經伊秩訾王大車且渠入就學化自聖躬流入蠻荒議者稱盛時咸言永平桓榮傳幸太常府令榮東面設几杖㑹百官及榮門生數百人天子親自執業曰太師在是永平二年三雍初成拜五更每大射養老禮畢引榮及弟子升堂執經為下説下語講説帝自制五家要説章句令桓郁校定於宣明殿東觀記上親於辟雍自講所制五行章句復令郁説一篇永平十五年三月幸孔子宅親御講堂㑹皇太子諸王説經永平十年張興拜太子太傅顯宗數訪問經術光武受尚書於廬江許子威通大義召鍾興問經義善之詔令定春秋章句明帝十嵗能通春秋事桓榮通尚書包咸授論語順帝時議郎蔡元講論五經異同建武六年拜杜林侍御史引見問以經書賜車馬衣被漢讀書禁中班固𫝊肅宗雅好文章固數入讀書禁中或連日繼夜前叙𫝊班斿以選受詔進讀羣書成帝召見劉歆誦讀詩賦司馬相如𫝊上讀子虛賦而善之建武三十二年正月夜讀河圖㑹昌符梁大同中於臺西立士林館朱异賀琛孔子袪等逓互講述唐太宗觀經史貞觀政要七年虞世南遷秘書監太宗每機務之隙引之談論共觀經史嘗謂侍臣曰毎與世南商𣙜古今九年太宗曰貞觀已來手不釋卷知風化之本見理政之源十一年李百藥曰日昃必命才學之士賜以清閒髙談典籍雜以文詠乙夜忘疲十二年謂侍臣曰朕讀書見前王善事力行不怠陸䞇曰太宗引文學之流更直宿於内署講求典禮諷誦詩書夜分忘倦唐禁中勸講侍讀開元三年九月戊寅㑹要七月詔左散騎常侍馬懐素與右常侍褚無量更日侍讀盧懐慎所薦儒帝以讀書有疑無從質問選學之士入内侍讀官志𤣥宗選耆儒日一人侍讀以質史籍疑義置集賢院侍講學士侍讀直學士儒學𫝊無量等勸講禁中天子尊禮不敢盡臣之後祕書少監康子元國子博士侯行果亦踐其選賞賚亟加而禮遇衰集賢注記開元十九年三月命學士陳希烈王廻質康子元馮朝隱等於三殿侍講先是講周易畢子元等各蒙錫賚字更洪範圖列無逸孝經是釋月令是刋長慶中侍講學士韋處厚等上六經法言三十卷賜金帛文宗時侍講學士鄭澣稡經史要録酬析無留賜金紫唐翰林侍講學士韋處厚元和末為户部郎中知制誥穆宗即位以處厚與司勲員外郎史館修撰路隋並充翰林侍講學士召入大液亭命分講毛詩關雎尚書洪範等篇訪以理體賜酒果寶厯初崔郾以諫議大夫充翰林侍講學士二年禮部員外宋申錫太和元年三月中書舍人鄭澣駕部郎中許康佐三年四月禮部尚書丁公著五年鄭覃開成七年十月國子祭酒髙重充侍講學士冊府元龜云元和之末始建學士之職列於内署後魏有侍讀馮元興温子昇邢昕李業興侍講賈思伯思同韓子熙王吉曰廣厦之下細旃之上明師居前勸誦在後上論唐虞之際下及殷周之盛考仁聖之風習治國之道訢訢焉發憤忘食日新厥徳吳趙咨曰雖有餘閒博覽書𫝊歴史籍採竒異不效書生尋章擿句而已咸平侍講侍讀天聖真宗講席記三朝講經太宗日閲經史興國八年始用著佐吕文仲為侍讀尋升為翰林侍讀寓直御書院毎召讀經史咸平二年七月丙午以兵侍楊徽之户侍夏侯嶠工部郎中吕文仲為翰林侍讀學士祭酒邢昺為翰林侍講學士按故事唐開元置侍讀其後有翰林侍講學士五代久廢太宗崇尚儒術由是命文仲侍讀寓直禁中以備顧問然名秩未崇上遹尊先志首置此職擇耆儒舊學充其選班次翰林學士禄賜如之設直廬於秘閣侍讀更直侍講長上日給珍膳夜則迭宿多召對詢訪或至中夕八月壬子徽之等赴職賜宴秘閣兩制皆預上作七言詩賜之慶厯二年二月丁丑召中丞賈昌朝侍講邇英閣憲府侍經筵自此始元豐五年省侍讀侍講學士但以為兼官必侍從以上兼之秩卑資淺則為説書元祐七年七月癸巳復増學士之號元符元年二月壬辰省紹興六年范冲為之天禧舊制侍臣皆賜坐講者别坐而聽乾興後侍臣先賜茶畢徹席立講畢復坐賜湯侍讀無所職但侍立而已自宋綬夏竦侍讀始令日讀唐書一𫝊又讀正説講日帝親書古賢詩或經書要言一二紙眞宗自居藩邸升儲官命侍講邢昺説尚書凡八席詩禮論語孝經皆數四焉以史𫝊有褒貶難於講授退而觀閲罔不該詳既即位咸平四年春詔昺講春秋左氏傳五年秋乃畢天禧元年春二月詔直龍圖閣馮元講易至秋九月終六十四卦以元奉使北廷而止天聖元年四月辛亥侍臣以崇政殿閣所講遺編來上命晏殊作真宗講席記景祐元年五月九日侍讀學士李淑言三朝講經皆有舊式太祖非時召王昭素趙孚説經書要義開寳四年十二月十三日辛未召九經李符問經義於内殿賜本科出身太宗則吕文仲為侍讀讀書史訪外事真宗首置侍讀侍講學士常令邢昺説經夜直秘閣又置龍圖閣待制令參預講筵如戚綸陳彭年杜鎬查道李虚己是也天禧初又令馮元説易皆於每日視朝決事再坐之後還内宴憇方召説書賜坐詢問不專講勸而已邢昺在東宫及内庭侍上講説孝經禮記者二論語十書十三易三詩左傳各一據𫝊疏敷引之外多引時事為喻深被嘉奬上問管仲召忽武王以安樂延年昺不能對祥符三年五月辛巳手札曰朕向在藩邸屢令邢昺講習諸書因記春秋息侯伐鄭云云景祐崇政殿説書邇英延義閣記注金華五箴元年正月丁亥二十六日命賈昌朝趙希言王宗道楊安國並為崇政殿説書日以二人侍講説初天聖九年侍講孫奭出守兖州薦昌朝等始置是職命之景祐四年三月甲戌朔進為天章閣侍講慶厯二年二月丙戌趙師民復為之二年正月癸丑二十八日置邇英延義二閣寫無逸篇于屏邇英在迎陽門之北東向延義在崇政殿之西北向是日御延義閣召輔臣觀盛度讀唐書賈昌朝講春秋遂宴崇政殿初孫奭為翰林侍講畫無逸圖上之帝施於講讀閣三年正月乙巳説書賈昌朝上二閣記注七月乙酉侍講學士馮元獻金華五箴詔奬之趙師民獻勸講箴曰西臨邇英北啟延義瞻仰皇明彌綸聖智明年春帝遂御迎陽門召近臣觀圖畫復命講讀經史仁宗以堯舜為師法待儒臣以賔友仁宗以象架庋書策外向以便講讀馮元兼侍講與孫奭以經行並進講讀親近自是仁宗益嚮學英宗嘉祐八年十二月己巳初御邇英閣召侍臣講讀經史元祐帝學嘉定續帝學五年八月侍講范祖禹進八卷集帝王學問及祖宗講讀故事上起伏羲下汔神宗願憲道於三皇稽徳於五帝軌儀於三代法象於祖宗集羣聖之所行體乾健之不息元年進唐鑑二年進三經要語之建炎四年七月己巳詔子冲上嘉定十一年記注之臣李􅌫紀五宗之懿續祖禹之書為十卷有詔通鑑徹章進讀十二年己卯嵗五月丁未竟帙癸亥賜燕講官請宣付史館從之淳祐九年進讀終篇凡寧皇自慶元戊午止嘉定丙子十徹章建炎内殿講讀元年十二月丙辰朔詔朕朝夕延見大臣咨訪庶務羣臣進對隨事盡言退閲四方奏牘少空則披覽載籍鑑觀前古獨於講學乆未遑暇念雖羽檄交馳廵幸未定亦不可廢其以侍從四員充講讀官萬機之暇就内殿講讀先是中丞王賔乞開講筵上納其言紹興十二年正月癸卯上謂大臣曰朕於宫中無嗜好惟好觀書考古人行事以施於政凡學必自得乃可用十三年十一月丁卯上曰無事惟静坐觀書所得甚多紹熙晚講五年寧宗欲増講官至十員各專講兩日一次五人上講早二晚三早講殿上晚小衫坐講嘉定二年十一月十六日侍讀章頴等言前此未有晚講坐講自陛下始行之書之國史為法來世每御殿惟諏經訪史辭簡理到經筵進故事元祐二年侍讀蘇頌請詔史官學士録新舊唐書日進數事十一月壬申詔經筵官遇非講讀日進漢唐故事二條建炎四年八月四日謝克家請日輪侍從進前代本朝故事涉治體者三事十八日綦崇禮奏止命講讀翰林學士兩省官進之九月三日令講筵置厯端平元年二月九日詔侍從經筵官進故事天聖以前講讀官皆坐侍自景祐以來皆立侍皇祐三年九月丁丑詔當講讀臣僚立侍敷對餘皆賜坐侍於閤中熙寧四年八月二十七日王雱為説書崇寧中以隱逸命蔡崈吕注紹興中陳鵬飛以博士乾道末崔端詩以正字兼説書宣和中楊時邇英殿説書經筵前一日進講義自元豐元年説書陸佃始元祐中侍讀蘇軾拜恩之日首陳六事慈儉勤謹誠明紹興二年胡安國侍讀專講春秋時講官四人援例乞各專一經上曰他人通經豈安國比不許隆興元年十一月詔學士院經筵官日以二員宿直乾道八年十月詔止輪一員淳熙三年九月禮侍李燾兼侍講以經筵少開録趙師民勸講箴以諷皇祐賈昌朝淳熙史浩以舊弼而詔讀昌朝吕公著以臺丞而勸講吕希哲司馬康楊時自小官而說書范祖禹司馬康張栻朱熹由庶僚而侍講程頤元祐元年尹焞紹興五年以布衣而特命易漢梁丘賀説易唐開元講易宣帝聞京房為易明求其門人得賀待詔黄門數入説敎侍中以召賀賀入説上善之説於天子之前子臨亦入説帝選髙材郎十人從臨講自宣帝好梁丘氏説元帝好之欲考其同異令充宗與諸易家論朱雲抗首而請連拄五鹿君孝宣時涿郡韓生以易召待詔殿中譙瑛説易授顯宗唐開元初詔張説舉能治易老莊者侯行果薦康子元敬㑹真並賜衣幣侍讀行果㑹真及馮朝隱同進講朝隱能索老莊祕義集賢注記云開元十一年夏詔學士侯行果等侍講周易莊老賜衣一副絹一百疋又令行果隔日為皇太子講易賜酒饌燕飲賦詩凡數百首屢承珍異之賜𤣥宗作大衍論顯慶五年六月御齊聖殿引𢎞文學士上官儀吕才直學士李元植等於御前講論命元植登講坐發易題才等以次問難梁武帝於文徳殿釋乾坤文言建隆開寳講易端平祥符講泰卦天禧講易建隆三年六月召宗丞趙孚講易于後殿嘉其講説精博開寳三年召王昭素賜坐便殿講乾卦至九五飛龍在天曰此爻正當陛下今日之事因風諫上悦三月辛亥以為國子博士端拱李覺講泰卦見視學祥符作周易詩三章王旦薦崇文院檢討馮元八年三月癸卯召見講論語首篇及易泰卦元進説曰上下相與則可輔相財成上悦賜緋元説上下經上稱其誦説通而不泥言外有餘趣馮元傳真宗試進士殿中召元講易元進説曰地天為泰以天地之氣交天禧元年二月元為直龍圖閣講易于宣和門之北閣待制預焉九月終六十四卦查道李虛已行簡預皇祐邇英閣講易元年十二月辛酉詔盧士宗講易乙丑御延和殿命士宗講泰卦賜紫二年三月己丑御閣講三古九聖乾元統天帝王合徳之義甲辰講坤而及權臣壬子講需及建極御天下甲寅講師十一月丁酉講无妄而及堯舜順民心三年三月戊辰講損之懲忿窒慾上謂情慾生於隂陽而節之在人四月庚子講鼎而謂任人之當謹丁未御邇英謂講官曰朕毎以易疑難問卿卿等多所發明丁巳講歸妹隂陽爻位戊申講巽之申命五月辛亥至癸丑講兑謙渙泰節師九月辛酉講既濟東鄰殺牛庚午講極數知來之謂占時講官則楊安國王洙趙師民四年九月己未十三日御閣召賈昌朝講乾卦用九曰外以剛健決事内以謙恭應物詔褒荅以卦義付史館上曰昌朝位將相而執經朝廷美事也解六月壬寅上節紹興淳熙講易紹興二十五年四月二十三日講易終篇五年書否泰卦賜張浚十四年三月幸學講泰卦淳熙八年辛丑嵗九月甲申詔侍講説書共講易講泰九二上曰君子以其類進而為善小人以其類進而為惡未有無助者也萃上六上曰盛極則衰亂極生治十一年九月九日詔日講兩卦十月十日徹章侍讀張大經等奏聖言深得大易之㫖見之事業措之天下皆易之用也請宣付史館十三日推恩十一月一日大經等以賜宴及簡帶鞍馬香茗進詩謝恩嘉泰元年冬講易汔嘉定五年日講二卦隆興元年四月己丑王大寳講乾卦上曰萬物皆生於乾又曰陰陽變化之道也九月癸丑馬騏講乾夕惕若厲上曰當讀為若厲至見龍无首上曰既居其極則當然邢昺太平興國初舉五經廷試日召升殿講易師比二卦書漢武帝問尚書兒寛初見語經學上曰吾始以尚書為樸學不好及聞寛説可觀乃從寛問一篇孔安國承詔作傳漢金華殿説尚書論語白虎觀雲臺講左氏𫝊尚書成帝時班伯為中常侍上方嚮學召鄭寛中張禹朝夕説尚書論語於金華殿中在未央宫詔班伯受焉數年金華之業絶出班斿以選受詔進讀羣書注於天子前讀書肅宗降意儒術好古文尚書左氏𫝊建初元年詔賈逵入講北宫白虎觀南宫雲臺帝善逵説使發出左氏大義長於二𫝊者於是條奏左氏三十事帝嘉之賜布五百疋衣一襲和帝永元四年幸北宫章徳殿講白虎觀肅宗又論五經於白虎觀又令賈逵撰歐陽夏侯古文同異漢永平説尚書庭中講尚書光武受尚書通大義召桓榮入説建武中桓榮入㑹庭中詔賜竒果明帝事榮通尚書永平十年召丁鴻説文侯之命篇賜御衣及綬禀食公車與博士同禮張酺數講御前為郎賜車馬衣裳入授太子肅宗即位為東郡太守帝言酺侍講屢有諫正誾誾惻惻有史魚之風元和二年二月丙辰東廵狩幸東郡引酺及門生并郡縣掾史並㑹庭中帝先備弟子之儀使酺講尚書一篇然後修君臣之禮賞賜殊特莫不霑洽時尚書令王鮪與酺相難帝欣悦唐貞觀觀尚書開元講尚書貞觀十五年八月謂侍臣曰昨觀尚書帝王之道坦然可見朕毎庶幾唐虞亦欲卿等齊肩稷契開元二十年十月講尚書及莊子馮朝隱等侍講各賜衣兩襲𤣥宗改陂頗之字觀無逸之圖唐太液亭講詩書長慶元年三月壬子穆宗召學士韋處厚路隋於太液亭講毛詩關雎尚書洪範等篇賜緋魚太液亭乃唐家右文之地文宗圖尚書君臣事迹於亭宣宗錢崔鉉於是亭賜詩開成二年三月鄭覃曰陛下乙夜觀書無不該涉淳化講堯典説命見視學太祖常讀尚書謂四凶之罪止從投竄而歎近世法網之宻史臣以為有意于措刑咸平後苑講大禹謨元年正月丁丑詔國子監直講崔頤正於後苑講大禹謨賜五品服自後日赴御書院待對説書至十卷二月己亥召頤正講尚書于景福殿二年七月幸學召祭酒邢昺直講崔偓佺講大禹謨賜偓佺緋昺器幣景徳四年崇和殿壁掛尚書圖祥符七年作尚書詩三章邢昺侍講徧講九經有三五過十餘過者惟尚書凡十四講天聖崇政殿講尚書皇祐邇英閣講尚書元祐紹興乾道天聖四年十一月孫奭等薦楊安國并召其父光輔入見令説無逸乙卯以為國子監丞六年二月壬寅召輔臣崇政殿西廡觀侍講孫奭講尚書七年十月丁酉講畢召近臣宗室燕太清樓皇祐四年三月丙辰楊安國講嘉言㒺攸伏六府三事九月庚申講微子己巳講洪範五事帝曰奉天在修徳十一月甲辰講無逸命王洙書為圖五年四月丁酉講冏命元祐四年二月二十一日邇英殿講尚書侍講司馬康講洪範乂用三徳五年二月壬寅七日講無逸篇畢詔詳録講義以進九月壬午二十一日邇英講書賜御書詩一首十月二十九日終篇賜御筵于東宫無逸圖屏洪範旅􅋙紹興七年九月一日内出無逸篇四軸付講筵所講日設之八年八月丙寅詔説書尹焞講尚書三月開講二十三年十一月七日終篇召宰執聽講越二日賜宴講讀官進詩三十二年孝宗即位七月甲子詔講尚書九月甲辰初御講筵張闡講尚書十月二十六日詔周禮尚書分篇進講乾道三年三月癸亥陳巖肖講大禹謨至寧失不經上曰祖宗好生不殺最為忠厚先是二年三月二十一日東宫講孟子徹章上曰可講尚書治國之道莫先於此朕毎無事必看數篇御書益稷旅􅋙賜進士明道元年二月甲辰詔輔臣于崇政殿西廡觀講書晁逈傳仁宗召對延和殿閤訪洪範雨暘之應逈據經以對詩漢武帝説詩武帝詔求能為韓詩者召蔡義待詔上疏願賜清閒之燕得盡精思於前上召見義説詩甚説之擢光禄大夫給事中進授昭帝大將軍光曰以為人主師當為宰相宣帝受詩於東海澓中翁肅宗建初元年召馴以韓詩侍講拜左中郎將韋賢進授昭帝詩張游卿以詩授元帝韋賢授哀帝伏理授成帝陸賈時時前説詩書晉講詩庾峻𫝊武帝講詩中庶子何劭論風雅正變之義峻起難往反四坐莫能屈之唐太液亭講詩見上𤣥宗講讀毛詩賜侍講章綬見張九齡集慶厯邇英閣講詩四年二月丙辰御迎陽門命天章閣侍講曽公亮講詩三月丁亥上曰國風多刺譏殊得以為監戒五年二月戊戌講于邇英閣起鷄鳴盡南山上謂公亮曰善惡皆欲聞豈當有避三月戊午講匪風誰能烹魚上曰老子謂治民若烹小鮮義近是乎丁度曰烹魚煩則碎治民煩則散甲申講節南山問幽王所終三月己卯講六月令再講之曰鹿鳴至菁莪皆周家創業之事四月辛卯講小旻問趙師民以水喻政之㫖趙師民𫝊講如彼泉流曰水之初出喻王政之發順行則通通故清潔賢人用則王政通而世清平丁未講巷伯有謹嫌疑之言壬辰講小弁至巧言十一月甲午講角弓曰睦族帝堯之盛徳乙未講都人士曰冠服必稱其行六年十二月十七日癸巳講徹宴近臣宗室及講讀官于崇政殿賜花作樂從官皆獻詩頌熙寧十年八月丙午講詩豐年祥符作毛詩詩三章紹興書車攻張栻講葛覃進説云治生於敬畏孫逢吉講權輿反覆紬繹以為諷紹興五年八月講詩終於嘉定元年三月寧宗袁燮講詩二南於先王正始之本后妃輔佐之道所以自身而家自家而天下者敷演厥㫖深寓規儆之意至列國變風有關君徳治道者委曲開陳託其義以諷嘉定九年禮唐太宗讀周禮貞觀中太宗召房杜魏入上曰朕昨夜讀周禮眞聖作也文中子附録漢文帝作王制唐𤣥宗刋定月令梁皇侃撰禮記講疏五十卷奏上召入壽光殿説禮記義武帝善之至和邇英閣講周禮元豐隆興皇祐四年十月戊寅詔侍講與賈昌朝先修節解以備講説至和元年九月己巳楊安國講緩刑薄征上曰天下皆吾赤子壬申講三年大比上曰三年選士至為酌中二年三月乙丑盧士宗講眡祲上曰妖祥由人事召之必修徳承天意己卯王洙講至大罍謂祀以質信為本丙戌講典瑞十月壬子講至割羊牲登其首上曰天地簡易非至忱其能應乎至和元年九月丙寅王洙上周禮器圖元豐元年三月辛巳御邇英沈季長講八法丁亥黄履講八柄辛卯季長講九賦癸巳講九式四月丙寅講小宰八月戊辰講宰夫紹興三十二年七月甲子孝宗詔講周禮九月甲辰金安節講召輔臣觀之十二月十六日詔分篇講隆興元年四月癸未安節講大司馬九伐之法上曰兵者徳之末九月乙卯講正月始和上曰此周正月也祥符作周禮詩三章景徳講中庸九經見御詩天聖講禮記讀中庸三年三月己酉召輔臣于崇政殿西廡觀孫奭講曲禮仍賜御書古詩各一章五年十月庚辰講禮記徹燕近臣崇政殿詔兩制館閣賦詩以進四月命宰臣張知白進讀中庸陳修身治人之道辛卯書賜進士熙寧邇英閣講禮記乾道熙寧元年二月十一日御閣召王珪范鎮等講禮記十月戊申詔經筵毋講禮記元祐八年正月丁亥邇英講畢乾道三年九月乙亥中書舍人梁克家講年長以倍父事之因奏孝悌之道庚寅二十四日詔擇諸篇最要切者如王制學記中庸大學之類先次進講先是克家言禮記出漢儒雜記非全經也欲如元祐范祖禹所請從之淳熙四年二月乙亥幸太學講中庸九經紹興書儒行元祐中范祖禹講王制祭祀以犧牲幣帛粢盛皆出於民力范成大講天子不合圍上曰此成湯祝網意也成大奏徳莫大於好生紹熙五年侍講朱熹講大學閏月戊午朔講至盤銘日新又進講義冊上欣然曰要處只在求放心淳祐講禮記賜製詩見後春秋漢殿中議公榖同異白虎觀雲臺講左傳見上宣帝召見蔡千秋説榖梁擢為諌大夫選郎十人從受又召江公孫為博士劉向受榖梁又召周慶丁姓待詔保宫授十人自元康中始講至甘露元年積十餘嵗皆明習廼召五經名儒太子太傅蕭望之等大議殿中平公穀同異以經處是非公羊博士嚴彭祖待詔申輓伊推宋顯榖梁議郎尹更始待詔劉向周慶丁姓並論公羊家請内許廣使者並内王亥各五人議三十餘事望之等十一人各以經誼對多從榖梁朱買臣召見説春秋言楚詞帝甚説之拜中大夫光武令鍾興定春秋章句明帝十嵗通春秋唐論春秋唐髙祖幸學徐文逺發春秋題論難鋒生太宗令羣臣以春秋酬難張後允𫝊文宗讀春秋問許康佐又觀書蓬萊殿咸平講左氏春秋寶元邇英講左氏紹興講春秋咸平三年御便殿命侍講學士邢昺講左氏侍讀與焉時初置講讀五年正月丙辰講畢宴近臣宗室崇政殿賜昺襲衣金帶器幣丁巳遷工部侍郎景祐二年正月癸丑御延義閣賈昌朝講春秋遂宴崇政殿四年十月甲午講春秋詔取君臣政敎事節講寳元二年十月丙寅御邇英觀講左傳及讀正説終上曰春秋述治亂足為監戒辛巳講左氏徹曲宴近臣于崇政殿慶厯四年三月乙酉問輔臣三𫝊異同之説賈昌朝曰左氏多記事公穀專解經皆以尊王室正賞罰然考之有得失皇祐五年十月甲寅上春秋節解八十卷至和二年十月壬子講左傳鄭鑄刑書王洙講上曰使民知法而亂可止不若不知而自化真宗作春秋要言春秋詩三章紹興二年七月癸酉上諭輔臣令胡安國兼讀春秋隨事解釋不必作義朕將咨詢十二月五日上曰孔子作經經之祖左氏作𫝊史之祖也三年二月初侍讀徐俯進春秋解義上以宰渠伯糾書名為貶宰臣勝非又奉親筆請以宸翰編之記注癸巳從之五年三月丁丑詔侍講朱震范冲專講左氏傳上雅好左氏八年八月丙寅詔張九成講春秋吕本中講左氏傳十九年三月二日普安王讀公穀終篇上曰須能識聖人之用心方有自得處隆興元年二月二十八日詔侍講錢周材説書王十朋分篇進講春秋寧宗紹熙五年八月講春秋嘉定七年十月徹章論語孝經漢始元通保𫝊𫝊論語孝經金華殿説論語昭帝始元五年六月詔曰夙興夜寐修古帝王之事通保傅傳孝經論語尚書未云有明令舉賢良文學髙第宣帝師受論語孝經詔夏侯勝撰尚書論語説賜金建武中包咸授太子論語永平五年遷大鴻臚經𫝊有疑輒就問賜珍玩束帛包福授和帝晉講孝經穆帝永和十二年二月帝講孝經升平元年三月帝講孝經壬申親釋奠于中堂孝武寧康三年九月九日帝講孝經僕射謝安侍坐尚書陸納侍講侍中卞耽執讀黄門侍郎謝石吏部郎袁宏執經車武子與丹陽尹王混擿句時論榮之隋志袁敬仲集議孝經一卷唐志車武子講孝經義四卷唐太學講孝經問論語百福殿講孝經太宗貞觀十四年二月丁丑幸太學觀釋奠命孔穎逹講孝經貞觀三年十二月乙酉上問孔穎逹以論語有若無實若虚穎逹具釋其義且曰易稱以䝉養正明夷莅衆永徽初趙洪智為陳王師講孝經百福殿於是宰相𢎞文館學大學士皆在洪智舉五孝諸儒更詰辨隨問酬悉高宗喜曰試為陳經之要對曰天子有爭臣七人帝喜賜絹二百名馬一鄴侯家𫝊徳宗曰朕幼好論語覺其篇名淺近注釋又疎即為卿製一殿名為講論殿殿成與卿日夕討論共注成之天聖慶厯皇祐講論語元祐紹興乾興元年十一月辛巳仁宗初御崇政殿西閤命侍講孫奭馮元講論語侍讀李維晏殊與焉詔以雙日講讀後或以隻日十二月甲辰崇政殿西廡召輔臣孫奭講論語上親書唐賢詩分賜自是召輔臣至經帷多賜御書天聖元年九月戊寅召輔臣觀馮元講論語賜御飛白書二年八月己卯幸國子監命直講馬龜符説論語一篇慶厯七年三月己亥邇英講論語序至安昌侯張禹帝曰師臣不忠讀書何為皇祐元年四月戊子講直哉史魚帝曰蘧伯玉不若史魚之直癸巳講季氏篇帝曰所先無如信趙師民傳講論語問修文徳帝曰所先者無若信復問改火又問子夏子張所言交道孰勝英宗嘉祐八年十二月己巳始御邇英講論語治平元年四月甲申御邇英吕公著講論語因進戒元豐八年十二月乙亥十五日哲宗初御邇英閣講論語宴資善堂賚銀幣講讀官日赴資善堂以雙日講讀元祐二年九月十五日終篇賜宴東宫賜詩建炎二年三月甲午初御經筵侍講王賓講孝悌為仁之本紹興七年閠十月十二日説書尹焞入見講衛靈公末章稱㫖遂給筆札解論語以進八年四月二十日上之五月四日賜緋魚復命解孟子祥符八年三月癸卯崇文檢討馮元講論語首篇賜緋又作孝經詩三章天聖崇政殿講孝經二年二月乙丑召輔臣觀講孝經于崇政殿西廡六月己未講徹賜馬宗元三品服慶厯七年三月丙申講於邇英己亥賜曽公亮三品服皇祐四年書四章為圖孟子元祐紹興講孟子元祐四年司馬康言孟子書最醇正陳王道明白詔進講講官為節解十四卷范祖禹講今樂猶古樂及公劉太王章紹興八年八月丙寅命侍講吳表臣講孟子十六年三月十九日辛卯終篇紹熙五年八月十七日詔續潛邸所講之章嘉泰元年十一月三日講徹史祖訓唐元和讀列聖實録讀政要㑹要元和三年十一月上鋭於為理既相裴垍喜於得人聽政之暇徧讀列聖實録見貞觀開元故事竦慕不能釋卷文宗讀貞觀政要宣宗讀元和實録𤣥宗質史籍疑義天聖景祐讀史天聖四年閏五月甲子召輔臣于崇政殿西廡觀宋綬等讀唐書景祐二年正月癸丑御延義閣召輔臣觀盛度讀唐書賈昌朝講春秋四年九月丁卯御邇英讀唐書詔列傳取事切規戒者讀之慶厯四年二月丙辰御迎陽門召輔臣觀圖畫皆帝王美惡之迹侍講曽公亮講詩王洙讀祖宗聖政録侍讀丁度讀前漢書帝曰漢稱文景景不及文數刻乃罷自元昊及罷講趙師民上疏獻勸講箴復命講讀經史五年二月丙申讀元帝紀語及元成二帝政理三月己卯講陳平躡足事而歎漢祖之從諫七年四月己巳讀賈誼傳三公三少因謂崔遵度為良師辛未讀貞觀政要八年八月甲午讀政要皇祐二年四月己卯讀東方朔傳乙丑讀後漢安帝紀謂推咎台衡莫若罪已荅天眚二年十月癸未丁度等修前史精要至和二年十月丁未孫抃讀史記龜策𫝊十一月丙寅李淑讀太史公𫝊嘉祐八年十一月己巳英宗劉敞讀史記陳舜孝友熙寧十年十月庚辰侍讀潤甫襄讀史記元祐八年八月二十一日侍讀蘇軾等請以鈔節漢唐正史間日進讀紹聖元年七月進讀新唐書祥符作讀十九代史詩景祐邇英讀正説淳熈四年十月甲戌宋綬讀謹罰篇述光武罷梁統從重之奏上曰深文峻法非善政丙戌讀化民篇上曰尸子言君如杅民如水何也丁度曰水隨器方員若民從君好惡是以人君謹所好至養民篇見歴代户口登耗之數問天下民籍幾何梅詢對曰先帝述前代帝王恭儉則増羡因詔編修院三司檢討以聞寳元二年三月壬寅上歴代户數十月丙寅讀終篇上曰先帝訓言敢不遵奉辛巳宴近臣于崇政殿淳熙七年五月乙卯三朝寳訓徹章翌日詔真宗正説藏秘閣宜以進讀九月侍讀臣浩讀正心篇論黄帝無為天下治上曰無為豈燕安無所事事之謂乎讀剛斷篇論郭解事上曰武帝洞照事情讀大中篇論為政之道本乎大中上曰勿渾渾而濁勿察察而明八年四月二十九日壬申詔丞相趙雄等赴經筵聽獨正説終篇浩等言陛下孳孳典訓愈乆愈明嵗時甫浹篇帙再周請付史館五月四日賜宴翌日進詩仁宗詔經筵日讀一篇晏殊有徹篇賜宴詩寳元讀三朝寳訓元祐淳紹興熙寳元二年十月丙寅詔侍讀李淑讀三朝寳訓丁度李仲容讀所編經史規鑒事迹十二月二十日詔淑於資善堂刪整備來春進讀十一月癸巳太清樓讀寳訓賜詩慶厯四年二月丙辰王洙讀祖宗聖政録五年十一月癸未讀三朝經武聖畧康定元年王洙為天章閣侍講專讀實訓要言於邇英閣元祐元年正月甲戌御邇英韓維進讀三朝寳訓至真宗戒尚食殺羔事因言陛下仁愛發於天性見昆虫螻蟻違而過之此仁術也願推此心及百姓四年二月壬戌邇英讀寳訓癸丑終篇五年九月壬午邇英讀寳訓賜御書詩一首上親書姓名于後八年正月丁亥顧臨讀至仁宗家法吕大防言祖宗家法甚善行之足以為天下蘇軾讀寳訓因及時事紹興五年閏二月二十三日丙寅殿中侍御史張絢言陛下復開經筵宜倣仁宗時讀三朝寳訓命侍讀之臣如李淑所請先取論政體聽斷益以謹災祥省費用進讀則内修之道盡矣次取議武備制軍旅論邊防撫夷狄進讀則外攘之䇿舉矣帝命講筵録進讀之更不立義三月丁丑詔鄭滋胡交修進讀八年八月丙寅詔侍讀曽開進讀二十七年十月戊申十六日終篇孝宗紹興三十二年七月甲子詔讀三朝寳訓九月甲辰洪遵進讀至吕䝉正論君子小人事上以君子小人係時運盛衰為不然十月丙寅讀至眞宗論政理上曰天下本無事庚午讀太宗乘快指揮事上曰為人上奈何不敬又讀太宗事上曰祖宗精於治道如此壬午讀孫冕上言事上謂得大體隆興元年九月乙巳張闡讀至太宗欲拜昌言上歎賞癸丑讀寳訓上曰威福不可輕乙卯讀至真宗優容訐直上曰祖宗盛徳之言乾道三年三月癸亥周執羔讀寳訓九月丁丑讀至太宗命官重修太祖實録上曰善惡無遺史臣之職淳熙四年四月壬申周必大讀田錫疏上曰有諫臣風越二日又讀太宗考才器之語上曰剛毅近仁九月乙丑史浩讀太祖用王祜段思恭事奏太祖得王道正𫝊先用儒生上曰須用真儒七年五月四日謂浩必大曰祖宗謨訓日盡一卷未為多雙日休假當特坐自是講讀率漏下十刻十一日終篇賜宴道山堂及牙簡金帶研匣塗金鞍馬香茗翌日進詩詔宣付史館熙寧讀資治通鑑二年九月戊辰初開經筵己巳召中丞吕公著侍經筵先是治平四年神宗已立十月己酉四日初御邇英講讀甲寅司馬光讀通鑑熙寧元年二月十一日御閣召王珪范鎮司馬光吕公著吳申周孟陽講禮記讀史記資治通鑑光讀至蘇秦事二年十一月庚辰光讀通鑑漢紀曹參事因言參得守成之道三年四月癸未讀賈山疏因言從諫之美拒諫之禍丁亥讀張釋之論嗇夫事元豐元年三月壬午侍讀吕公著讀後漢書論治體又論唐太宗公著以屈己從諫諷上元祐讀稽古録見後建炎通鑑解義二年三月甲午詔經筵讀資治通鑑侍讀周武仲進讀上掩卷問曰司馬光何故以紀綱為禮武仲敷述甚詳因為通鑑解義以進紹興二年二月癸未始御講殿經筵久輟至是復乾道三年正月丙寅洪邁對選徳殿上曰朕以閒暇取尚書通鑑孜孜讀之帝王所以為帝王法戒其興亡孝宗毎覽通鑑謂通鑑萬世不刋之書於人主尤切凡前事廢興人才邪正必親題其要或為贊論箴詩寓褒貶之法慶元乙卯二月讀通鑑嘉定十一年戊寅季春終篇進讀續帝學四月己未宴祕書省淳熙讀陸贄奏議八年七月四日丙子進讀十三年癸卯二十七日令日讀半冊作六講終篇五月十三日以終篇宴賜侍讀蕭燧等進詩六月十三日程大昌奏唐人以諫名者更有魏徴贄事徳宗仁義為空言徵事太宗仁義為實效請以魏徵諫録接續覽觀詔繕冩以進先是九年四月辛亥上曰朕每見贄論徳宗事未嘗不寒心恐未免有徳宗之失卿等可條具缺失來上十三年三月十一日燧等言退朝之後聽數千言而不倦又特於雙日躬御邇英盖故事所未有請付史館彰不矜不伐執古御今之意從之淳熙元年九月蔡戡奏論貞觀諫録上曰從諫太宗所長此書置之坐右可為規鑒慶元讀兩朝聖政嘉定讀髙宗寳訓慶元元年正月詔祕省冩髙孝聖政二書御殿日閲數條以為定式髙宗聖政始於嘉泰三年四月凡六年而六十卷之書畢嘉定六年十一月三日讀髙宗寳訓十四年七月閲八年而七十卷之書畢十八日侍讀葉時等奏陛下以聖繼聖駿惠先猷商宗監成憲成王酌祖道不專美矣太平興國讀文選吕文仲𫝊興國中上召文仲與舒雅杜鎬吳淑詣便殿讀古碑一篇又令文仲讀文選賜鞍勒翌日又召文仲讀江海賦賜錢三十萬充翰林侍讀寓直御書院與侍書王著更宿又書學葛湍亦直禁中太宗每暇日或多召從容問文仲以書史著以筆法湍以字學再為侍讀一日召於崇政殿讀上章書經史故實數十軸詔模刻於石崔頤正𫝊雍熈中太宗召見令説莊子一篇賜錢五萬杜鎬𫝊太宗觀書祕閣詢鎬經義賜金帛張揆進讀漢馬后紀至服大練抑止外家因言今妃族太盛不可不裁損使保其家仁宗嘉納趙師民讀漢紀問長安城因陳自古都雍年世舊址所在若畫諸掌帝悦聶冠卿進讀左氏春秋必引尊王黜覇之義以諷孫抃讀史記龜筴傳帝問古人動作必繇此乎對曰聖人不專人謀黙與神契治平二年司馬光言講觧未盡乞賜詰問或記憶未詳許退歸討論敷奏開寳讀漢書而感于張治獄之無寃六年五月雍熙讀晉史而謂後宫煩費之當戒元年正月丁丑端拱讀漢書而感賈誼之激切元年淳化覽唐史而譏太宗之好名真宗謂三國志足為監戒景徳二年二月適時用莫若漢史四年景徳覽六朝實録而言褒貶之不當四年四月丁丑祥符讀前史必䆒事之終始有未見本末者必記之他日異書中可以質正元年正月壬申蘇軾進讀金華日陳六事元祐讀漢書摘切於治體者紹興二十七年十月王師心奏惟昔咸平之盛稍循天策之規遴擇英髦進陪講讀晝則宻承於顧問夕則遞宿於禁嚴程頥以敬涵養君徳范祖禹以和開導主意勸講猶有分章析理之勞進讀專以因事獻言為職進陽爻退隂位如昭素之辨乾龍闢君子闔小人若馮元之推泰象易扶聖人之精意大義安國所以被遇於仁宗繹孔子之善行嘉言尹焞所以受知於髙廟論語玉海卷二十六
