body:
  text: 玉海卷一百十宋王應麟撰音樂樂器琴瑟絲飾物而成聲其卦則離其方則南其時則夏其聲尚宫其律㽔賔先王作樂􅁌之以琴瑟之屬琴瑟之樂君子所常御其大小不同而其聲應一也伏羲瑟泰帝二十五􅁌瑟漢郊祀志或曰泰帝使素女鼓五十􅁌瑟悲帝禁不止故破其瑟為二十五􅁌注師古曰泰帝亦謂泰昊也大晟樂書琴屬陽瑟屬陰昔泰帝使素女鼓五十􅁌其瑟長七尺二寸通厯太昊伏羲氏作二十五􅁌之瑟隋樂志二十七􅁌伏羲所作通典爾雅大琴謂之離二十七􅁌今無其器世本庖犧氏作瑟瑟潔也使人精潔於心淳一於行詩正義伏犧作瑟伏羲琴伏羲五絃琴文選長笛賦庖羲作琴注琴操曰伏羲作琴以脩身理性反天真也琴操曰伏羲作琴廣六寸象六合農宋志馬融笛賦云宓犧造琴世本云神所造呉都賦注楚辭曰伏羲駕辯伏羲作琴始造此曲演連珠注蔡邕琴操曰伏羲氏作琴絃有五象五行歸田賦彈五絃之妙指注同白虎通琴始自伏羲所作晉志農瑟羲琴達靈成性象物昭功後魏樂志伏羲絃琴農皇制瑟廣雅伏羲氏琴長七尺二寸上有五絃爾雅大琴曰離注二十七絃或傳是伏羲所作魏太和中張揖廣雅伏羲琴長三尺六寸五絃後加文武二絃樂書曰伏羲樂曰立基造琴瑟以律吕琴書曰伏羲氏削桐為琴自堯相傳善琴者八十餘人蔡邕論琴曰羲削桐為琴靣圓法天底平象地龍池八寸通八風鳳池四寸象四氣神農琴炎帝五絃瑟一作琴吕氏春秋仲夏紀昔古朱襄氏之治天下也朱襄氏古天子炎帝之别號多風而陽氣蓄積萬物散解果實不成故士達作為五􅁌琴一本云五絃瑟帝王世紀同以來陽氣以定羣生桓譚新論神農始削桐為琴繩絲為絃文選月賦注引之以通神明之徳合天地之和今琴四尺五寸法四時五行又曰神農氏為琴七絃足以通萬物而考理亂也廣雅神農氏琴長三尺六寸有五􅁌曰宫商角徴羽文王增二􅁌曰少宫少商淮南子神農氏初作琴通厯炎帝始作五􅁌琴樂書曰神農樂曰下謀造五􅁌之琴說文神農所作洞越練朱五絃周加二絃隋志絲屬一曰琴神農制為五絃周文王加二絃樂錄曰文王加一武王加一今稱二絃為文武絃帝王世紀神農始作五絃之琴以具宫商角徴羽之音厯九代至文王復增其二絃曰少宫少商徐景安樂書曰自伏犧神農帝舜皆作五絃之琴至周文武各益一絃為少宫少商之聲以至七絃楊雄琴清英曰神農造琴傅毅琴賦云揆神農之初制文選馬融長笛賦曰昔庖犧作琴神農造瑟宋志引之注淮南子曰神農初作瑟以歸神反望及其天心也晉志農瑟羲琴山海經帝俊生宴龍宴龍是為琴瑟注世本云伏羲作瑟神農作琴黃帝琴梁元帝纂要古琴名有清角黃帝之琴韓非子黃帝作清角合􅀑神於泰山之上大晟樂書黃帝鼓清角之琴以大合􅀑神而鳳凰蔽日堯鼓琴而天神格舜歌南風而天下化堯五絃琴謝希逸琴論曰神人暢堯帝所作堯彈琴感神人現故制此弄也通禮纂堯使無句作琴五絃堯十五􅁌瑟舜二十三􅁌瑟見樂類吕氏春秋仲夏紀舜五􅁌琴樂記舜作五􅁌之琴以歌南風䕫始制樂以賞諸侯注䕫欲舜與天下之君共此樂也南風長養之風言父母之長養已其辭未聞也正義第四章名為樂施五􅁌謂無文武二􅁌唯宫商等之五􅁌也南風詩名是孝子之詩舜有孝行故以此五􅁌之琴歌南風之詩而教天下之孝此詩今無案世本神農作琴今云舜作者非謂舜始造也歌南風始自舜或五􅁌始舜也䕫欲天下同行舜道故歌此南風以賞諸侯使海内同孝也制南風之樂以賞諸侯云其辭未聞則非詩凱風之篇熊氏以為凱風非矣聖證論引尸子家語難鄭其辭曰南風之薰兮云云馬昭云家語王肅所增加非鄭所見尸子雜說不可取證家語辨樂解尸子同又古今樂錄舜彈五􅁌之琴造南風之詩注古琴五􅁌至周有七律增為七􅁌其詩曰南風之薰兮可以解吾民之愠兮南風之時兮可以阜吾民之財兮惟脩此化故其興也勃然徳如泉流至于今王公大臣述而不忘樂府詩集云其詩曰反彼三山兮商岳嵯峨天降五老兮迎我來歌有青龍兮自出于河負書圖兮委蛇羅沙案圖觀䜟兮閔天嗟嗟擊石拊韶兮淪幽洞微鳥獸蹌蹌兮鳳凰來儀凱風自南兮喟其增歎史記樂書舜彈五􅁌之琴歌南風之詩而天下治南風之詩者生長之音也舜樂好之樂與天地同意得萬國之驩心故天下治索隱曰此詩之辭出尸子及家語王肅曰南風育養民之詩也其云辭曰南風之薰兮云淮南子泰族訓云云詮言訓舜彈五􅁌之琴歌南風之詩注古琴五絃至周有七律增為七􅁌文選琴賦理重華之遺操注琴道曰舜操者舜聖徳𤣥逺遂升天子喟然念親巍巍上帝之位不足保援琴作操琴書曰豈唯道在思親志兼憂民養萬物故感之通典廣雅曰五􅁌象五行琴長三尺六寸六分象三百六旬六日廣六寸象六合大􅁌為君小􅁌為臣文王武王加二􅁌以合君臣之恩揚雄琴清英曰舜彈五􅁌天下化一作治堯加二􅁌以合君臣之恩三禮圖曰第一􅁌為宫次商角羽徴少宫少商風俗通云法七星孟子舜為天子被袗衣鼓琴史記堯賜舜絺衣與琴子華子舜被袗衣而鼓五􅁌之琴尸子舜作五􅁌之琴云云是舜歌也文中子鼓南風釣者曰不如舜自鼓也聲存而操變矣遂作汾亭操韓非子有若曰舜鼓五􅁌歌南風之詩而天下治韓愈燕太學聽琴序鼓有虞氏之南風賡之以文王宣父之操古今樂錄舜遊厯山見烏飛思親作思親操乃命嶧陽輸爾孤桐乃命海岱檿絲其供事親愛民則惟斯琴五聲之間有孝有仁禹琴大周樂正曰禹上㑹稽者禹之所作也決江河上㑹稽山自是之後百姓降丘黎庻乂安彈琴以自歎樂府集謝希逸琴論曰神人暢堯帝所作舜作思親操孝之至也夏禹治水而作襄陵操周雲和琴瑟大司樂圜丘用孤竹之管雲和之琴瑟方澤用孫竹之管空桑之琴瑟宗廟用陰竹之管龍門之琴瑟注雲和空桑龍門皆山名書注龍門山在河東西界七發云龍門之桐桓譚新論曰五絃第一􅁌為宫其次商角徴羽文王武王各加一絃以為少宫少商唐安涗為文王操以黃鐘為宫奏之以少商應大絃楊收曰少商武􅁌也且文世安得武聲乎漢郊祀歌空桑琴瑟結信成四興遞代八風生殷殷鐘石羽籥鳴景星十二周清廟瑟樂記又吕氏春秋清廟之瑟朱􅁌而疏越一唱而三歎有遺音者矣注朱絃練朱絃越瑟底孔畫疏之使聲遲正義按虞傳云古者帝王升歌清廟之樂大琴練絃不練則體勁而聲清練則絲孰而聲濁史記樂書清廟之瑟注鄭𤣥曰謂作樂歌清廟王肅曰於清廟中所鼓之瑟尚書大傳古者帝王升歌清廟大琴練􅁌達越大瑟朱􅁌達越以韋為鼓謂之摶拊清廟樂章名越下孔也周公琴大周樂正曰越裳操者周公之所作也周公輔相成王天下太平萬國和㑹江黃納貢越裳重九譯而來獻周公援琴而歌成王琴宋符瑞志麒麟遊苑鳳凰翔庭成王援琴而歌曰鳳凰翔兮於紫庭余何徳兮以感靈頼先王兮恩澤臻于胥樂兮民以寧樂府集文王操曰翼翼翺翔彼鳳凰兮銜書來遊以㑹昌兮謝希逸琴論曰文王操文王作也剋商操武王伐紂時制成王作神鳳操言徳化之感也琴集曰鳳皇來儀成王所作孔子琴史記世家後世因廟藏孔子衣冠琴車書孔子學鼓琴師襄襄曰師蓋云文王操也息乎陬鄉作為陬操三百五篇孔子皆􅁌歌之以求合韶武雅頌之音莊子孔子坐杏壇之上絃歌鼓琴韓詩外傳孔子學鼓琴於師堂琴操曰歸耕曾子所作援琴鼓之尚書大傳子夏曰彈琴以歌先王之風齊瑟秦箏文選笙賦齊瑟秦箏注史記蘇秦曰臨菑其民無不吹竽鼓瑟歌錄有齊瑟行廣雅曰瑟二十七絃風俗通箏蒙恬所造風俗通曰筑身而瑟絃不知誰改作曹子建詩齊瑟揚東謳秦箏發西岳通典箏秦聲也傅𤣥箏賦序曰世以為蒙恬所造今觀其器上崇似天下平似地中空准六合絃柱擬十二月設之則四象在鼓之則五音發豈亡國之臣獨關思哉文選注引侯瑾箏賦樂阮瑀箏賦苞羣聲以作主冠衆而為師古琴五曲十二操九引琴操古琴有詩歌五曲曰鹿鳴伐檀騶虞鵲巢白駒又有十二操曰將歸操孔子所作猗蘭操孔子龜山操孔子越裳操周公拘幽操文王岐山操周公為太王作履霜操伯竒雉朝飛操沐犢子别鶴操商陵牧子殘形操曽子水仙操壊陵操伯牙九引曰烈女引樊妃伯妃引魯伯妃正女引伏室女思歸引衛女霹靂引楚商梁走馬引樗里牧恭箜篌引樗里子高琴引屠門高楚引龍丘子高又有蔡氏五弄桓譚新論曰頗離雅操更為新弄傅𤣥琴賦序齊桓公鳴琴曰號鍾楚莊王鳴琴曰繞梁漢二十五􅁌瑟漢空侯泰帝二十五􅁌瑟志元鼎六年春既滅南越李延年以好音見上善之下公卿議曰民間祠有鼓舞樂今郊祀而無樂豈稱乎公卿曰古者祠天地皆有樂而神祗可得而禮或曰泰帝使素女鼓五十絃瑟悲帝禁不止也泰帝太昊也故破其瑟為二十五絃於是塞南越禱祠太一后土始用樂舞益召歌兒作二十五絃及空侯瑟自此起應劭曰帝令樂人侯調始造此器空蘓林曰作侯與瑟通典箜篌漢武帝使樂人侯調所作以祠太乙或云侯暉所作其聲坎坎應節謂之坎侯聲訛為箜篌侯者因樂工人姓耳呉兢解題云漢武依琴造坎侯凡將篇鐘磬竽笙筑坎侯郊宣帝賜單于笙瑟空侯聲古施廟雅樂近代專用於楚爾雅大瑟謂之灑疏云禮圖舊云雅瑟長八尺一寸廣一尺八寸二十三􅁌其常用者十九􅁌頌瑟長七尺二寸廣尺八寸二十五􅁌盡用之通典同莊子言魯遽調瑟二十五􅁌皆動文選注淮南子曰師曠奏白雪白雪五十􅁌瑟樂曲名西京雜記曰秦咸陽宫有琴長六尺安十三􅁌二十六徽用七寶飾之名曰璠璵之樂漢雅琴王襃傳神爵五鳳間天下殷富數有嘉應上頗作歌詩欲興協律之事丞相魏相奏言知音善鼓琴者渤海趙定梁國龔徳志作龍徳皆召見待詔别録云召見温室藝文志樂六家雅琴趙氏七篇名定雅琴師氏八篇名中東海人師曠後龍氏九十九篇名徳與趙定俱召見待詔後拜為侍郎後儒林傳劉昆少習容禮能彈雅琴知清角之操注劉向别錄曰雅琴之意事皆出龍徳諸琴雜事中宣帝元康神爵間丞相奏能鼓琴者渤海趙定梁國龍徳皆召入見温室使鼓琴時閑燕為散操隋志沈約曰劉向别錄龍氏雅琴百六篇師氏八篇趙氏七篇文選注李善引劉向雅琴賦遊予心以廣觀且徳樂之愔愔傅毅雅琴賦時促均而增徽接角徴而控商明仁義以厲已故永御而密觀稽康琴賦至人攄思制為雅琴序云衆器之中琴徳最優左傳襄二年穆姜使擇美檟為頌琴注猶言雅琴元帝贊鼓琴瑟吹洞簫簫無底自度曲被歌聲分刌節度窮極幼眇阮籍樂論漢帝聞楚琴倚扆而悲漢琴頌琴賦藝文志凡樂六家出淮南劉向等琴頌七篇雜賦有雜鼓琴劍戲賦十三篇文選長笛賦序王子淵枚乗劉伯康傅武仲等簫琴笙頌注文章志傅毅作琴賦董仲舒集七言琴歌二首馬融傳著七言琴歌李尤有琴銘蔡邕有琴賦漢琴操琴道唐志桓譚琴操二卷孔衍一卷桓譚傳好音律善鼓琴著書號曰新論琴道一篇未成肅宗使班固續成之注東觀記曰琴道未畢但有發首一章新論云八音廣博琴徳最優又云黃門工鼓琴者有任真卿虞長倩能𫝊其度數妙曲遺聲文選注引琴道曰琴有伯夷之操琴七絃足以通萬物又引琴道雍門周曰云云又琴道曰下徴七絃總㑹樞極張衡賦注引蔡邕琴操隋唐志有孔衍琴操唐志有桓譚琴操並無蔡邕隋志琴經一卷琴説一卷漢黃鍾瑟黃鍾律黃鍾磬黃鍾鼓大予樂器五樂禮儀志冬至夏至陰陽晷景長短之極微氣之所生使八能之士八