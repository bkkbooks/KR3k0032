body:
  text: 玉海卷一百五十八宋王應麟撰宫室宫四唐興慶宫南内勤政樓花蕚樓附詳見樓類興慶宫本明皇舊第也開元二年七月宋王成器等請獻興慶坊宅為離宫甲寅制許之故作興慶宫舊史開元元年二月以隆慶舊邸為興慶宫在隆慶坊要𤣥宗名隆基即位改興慶宫紀作二年九月庚寅㑹作二年七月二十九日志作開元初傳作先天後通鑑作開元二年七月甲寅年月不同九月庚寅有詔興役地理志興慶宫在皇城東南距京城之東開元初置至十四年又増廣之謂之南内二十年六月築夾城入芙蓉園一本云自大明宫夾城複道經通化門以達此宫徃來兩宫而人不知之交城複道即六典所謂磴道潜通也㑹要初上在藩邸與宋王成器等同居子興慶里人號曰五王宅至景龍末邸内有龍池湧出日以浸廣望氣者云有天子氣中宗數幸其地命泛舟以駞象踏氣以厭之至是為宫焉後於西南置樓南題曰勤政務本之樓西題曰花蕚相輝之樓張九齡撰龍池頌刋石興慶宫讓皇帝傳初睿宗五子列第東都積善坊號為五王子宅及賜第上都隆慶坊亦號五王宅舊紀聖厯元年𤣥宗出閤賜第於東都積善坊大足元年從幸西京賜宅於興慶坊𤣥宗為太子嘗製大衾長枕與諸王共之睿宗知喜甚及先天後盡以隆慶坊舊邸為興慶宫而賜寧王及薛王第於勝業坊申岐二王於安興坊環列宫側天子於宫西南置樓其西曰花蕚相輝之樓六典曰取詩人棠棣之意南曰勤政務本之樓帝時登之聞諸王作樂必亟召升樓與同榻坐或就幸第賦詩宴嬉賜金帛侑歡諸王五日朝側門世謂天子友悌古無有者開元二十五年𤣥宗戒諸王曰吾自奉先帝宫室不敢有加時加補葺已愧於勞人矣惟興慶創制乃朝廷百辟卿士以吾舊邸因欲修建不免羣卿考室之辭是俟庶人子來之請亦所以表休徵之地新作南樓本欲察甿俗採風謡以防壅塞是亦吾闢四門達四聰之意時有宴樂不徒然也又因大哥遜朱邸以成花蕚相輝之美歴觀自古聖帝明王有所興作欲以助教化也吾所兾者式崇順睦漸漬薄俗令其人信厚耳六典興慶宫在皇城之東南東距外郭城東垣即今上龍潛舊宅也開元初以為離宫十四年又取永嘉勝業坊之半以置朝自大明宫東夾羅城經通化門磴道潜通焉宫之西曰興慶門其内曰興慶殿即正衙殿有龍池殿次南曰金明門門内之北曰大同門其内曰大同殿宫南曰通陽門北入曰明光門其内曰龍堂通陽之西曰花蕚樓樓西即寧王第取詩人棠棣之義樓西曰明義門其内曰長慶殿宫北曰濯龍門其内左曰芳苑門右曰麗苑門南走龍池曰瀛洲門内曰南薰殿瀛洲之左曰仙雲門北曰新射殿又有同光承雲初陽飛軒主華等門飛仙交秦同光榮光等殿所居宅之東有舊井忽涌為小池至景龍中為龍池焉蓋符命之先也開元十六年正月十三日一云戊戌朔舊云正月庚子始移仗於興慶宫聽政十九年正月丙子耕于興慶宫二十年六月廣花蕚相輝樓築夾城至芙蓉園天寳四載突厥毗伽可汗妻骨咄祿婆匐可敦率衆自歸天子為御花蕚樓宴羣臣賦詩以美其事七載五月壬午上御興慶宫受册徽號十載四月二十一日興慶宫造交泰殿成十一載發華隂扶風馮翊三郡工匠及京城人夫萬三千五百人築興慶宫城四十日畢十三載五月壬戌觀酺于勤政樓北廷都䕶程千里俘阿布思以獻十月一日御勤政樓四科舉人問䇿外更試詩賦各一道制舉試詩賦自此始肅宗至徳二載十二月丁未上皇至自蜀郡居於興慶宫乾元二年十一月丁亥冬至朝聖皇于興慶宫翌日受朝含元德宗貞元十三年四月壬戌雩于興慶宫順宗永貞元年八月辛丑太上皇居興慶宫二年正月丙戌朔太上皇於興慶宫受朝賀皇帝率百僚奉上尊號一本云永貞二年正月丙子朔一云丙寅奉册册文曰功成不處褰裳去之付神器於沖人想汾陽以髙蹈體堯之徳與神同符其動也天其靜也地文見實録憲宗元和三年十月修南内宫牆十四年三月修勤政樓文宗大和元年五月丙寅赴興慶宫上夀十一月甲申南至百僚詣興慶宫及光順門行朝賀之禮四年四月有司貢新𤓰獻興慶宫奉太皇太后及皇太后分賜十宅諸王己下十一月己亥南至謁興慶宫五年正月庚子朔朝賀太皇太后于興慶宫禮樂志𤣥宗嘗以馬舞傾盃數十曲每千秋節舞于勤政樓下後賜宴設酺亦㑹勤政樓其日太常卿引雅樂間以胡夷之伎擊雷鼓奏小破陣樂歲以為常于休烈𫝊肅宗時經大盗後史籍燔毁休烈奏國史開元實録起居注及餘書三千八百餘篇藏興慶宫兵興焚煬皆盡請下御史覈史館所由求之府縣有能得者許上送官一書進官一資一篇絹十疋數月止獲得一二篇惟韋述以家藏國史百三十篇上獻李輔國傳肅宗時太上皇居興慶宫帝自複道來起居太上皇亦間至大明宫或相逢道中太上皇每置酒長慶樓南俯大道裴回觀覽或父老過之拜舞而去王難得傳憲宗朝太后南宫憲宗郭后傳穆宗嗣位后移御興慶宫凡朔望三朝帝率百官詣宫中為夀或歲時慶問宴饗後宫戚里内外命婦車騎駢壅環佩之聲滿宫唐龍池宫地理志河中府安邑縣開元八年置龍池宫唐啟聖宫飛龍宫瑞閣述聖頌𤣥宗紀開元十一年正月己巳如并州庚辰十四日次潞州赦囚給復五年以故第為飛龍宫後又更名啟聖地理志潞州上黨縣有啟聖宫本飛龍宫𤣥宗故第開元十一年置後又更名有瑞閣㑹要作十二年正月十四日改潞州舊宅為飛龍宫舊紀開元二十年十月辛夘至潞州之飛龍宫曲赦張說上黨舊宫述聖頌開元十一祀正月皇帝展義于河東留宴上黨三月庚午飲至長安於是邠王臣守禮開府儀同三司臣璟等抗疏僉曰潞人懐代邸詠泗亭將表潜龍之館勒啟聖之圖陛下昔居是州也紫雲在天神光照室白鹿來擾黄龍上升隴出僊洞而神魚躍山開禪宂而靈鍾韻謡言合䜟巨跡引途嘉李傍連祥蓍自起云云昔龍負圗而大舜登狼銜鉤而后殷昌𤣥圭錫於夏禹赤伏歸於漢光應運協符希代稱寳未有窮祥極瑞俶儻瓌異如今之至者願聽潞人以揚丕烈又曰豐沛著啟祚之美穰鄧有建都之榮今張説集有御製次舊居詩序云向駕駟馬而朝京師乘六龍而問風俗金石録上黨啟聖宫頌明皇撰八分書天寳十二載二月金石録又有上黨宫宴羣臣故老詩唐温泉宫華清宫𤣥宗紀開元十一年十月丁酉幸温湯作温泉宫自開元十五年十二月乙亥至天寳十四載十月庚寅幸華清温泉宫凢二十八率歲一幸或一歲再幸地理志京兆府昭應縣有宫在驪山下貞觀十八年置咸亨二年始名温泉宫天寳元年更驪山曰㑹昌山三載以新豐去宫逺折新豐萬年置會昌縣六載十月己酉更温泉曰華清宫華清宫在臨潼温泉山取魏都賦温泉毖涌而自浪華清蕩邪而難老之意宫有湯井為池環山列宫室又築羅城置百司及十宅十二月壬戌㑹要是年十月三日改華清之名七載省新豐更㑹昌縣及山曰昭應㑹要天寳元年十月造長生殿名為集靈臺以祀神七載十二月二日𤣥元皇帝降于朝元閣改為降聖閣八載四月新作觀風樓在宫外東北隅六載十二月二十一日發馮翊華隂民築會昌羅城於湯所置百司列𫝊房琯天寳五年為給事中時𤣥宗有逸志數廵幸廣温泉為華清宫環宫置百司區舎以琯資機筭詔緫經度驪山疏巖剔藪以為天下游觀陳元禮𤣥宗在華清宫正月望夜將出游元禮諫曰陛下必出游願歸城闕帝不能奪楊妃每十月帝幸華清宫五宅車騎皆從家别為隊隊一色俄五家隊合爛若萬花川谷成錦繡遺鈿墮舄狼籍于道香聞數十里楊國忠𤣥宗常歲十月幸華清宮春乃還必遍諸楊五家韋陟守河東天寳十二載入考華清宫栁子華代宗將幸華清宫先命整葺以子華為昭應令修宫使舊紀天寳九載正月庚寅朔一云辛夘與歲次同始受朝於華清宫十二載正月丁酉朔御華清宫之觀風樓受朝賀穆宗紀長慶二年十一月庚午皇太后幸華清宫韓休有駕幸華清賦李程有華清宫望幸賦云閣有朝元殿有長生温湯在臨潼縣南一百五十歩麗山西北十道志曰貞觀十八年詔閻立徳建温泉宫太宗臨幸製碑咸亨三年名温泉宫唐年小録曰開元十年置實録與元和志曰開元十一年置温泉監一人掌湯池唐望春宫地理志京兆萬年縣有望春宫臨滻水西岸有北望春宫宫東有廣運潭㑹要開元二十六年正月六日修望春宫舊紀太和七年十二月庚子幸望春宫姚南仲傳代宗時上䟽曰王者必據髙明燭幽隠先皇所以因龍首而建望春也李景讓賦青門之左層谷嶙峋標上苑而獨出儼複道而明望南山之翠色盈前渭水之素光在下西京紀西京禁苑内有望春宫在髙原之上東臨㶚滻今上曽登北亭賦春臺詠朝士奉和凡數百唐遊龍宫地理志京兆渭南西十里有遊龍宫開元二十五年更置東十五里有隋崇業宫元和志同唐昇仙宫𤣥宗紀天寳二年正月乙夘作昇仙宫唐三宫杜暹傳開元中帝幸東都以暹為京留守暹率當畨衛士繕三宫城浚池督役不少懈帝聞嘉之數賜書褒勞一本云因抽當番衛士繕修三宫増浚城隍上賜書曰城隍宫室隨事修營且有成功不疲人力甚慰朕懐蕭太后傳太和中懿安郭皇后居興慶宫寳厯王太后穆宗居義安殿后居大内蕭后文宗母也號三宫太后帝五日問安三宫有司獻四時新物送三宫亦稱賜帝曰上三宫何可言賜遽索筆滅賜為奉一本云文宗始即位内園進櫻桃將以賜三宫太后帝曰焉可以為賜援筆易曰奉開成中四年正月望夜丁夘帝御咸泰殿大然燈作樂迎三宫太后奉觴上夀郭太后傳移御興慶宫凡朔望三朝帝率百官詣宫門為夀武宗時徙積慶殿又號積慶太后唐咸宜宫蘇頲傳𤣥宗游咸宜宫羽獵開元十五年唐望賢宫地理志京兆咸陽縣有望賢宫舊紀至徳二載十二月丙午上皇至自蜀上至望賢宫奉迎上皇御宫南樓上望樓辟易下馬趨進樓前再拜舞蹈稱慶丁未居興慶宫藝文志藝術類有楊昇畫望賢宫圖一卷唐靈武受命宫肅宗楊炎作頌序曰靈武宫皇帝躍龍之所丁夘廣平王俶等排闥以訴曰陛下渉渭則洪流涸廻鑾則慶雲見布澤而川池廣勤道而嘉禾生帝乃灑齋宫啓金匱大赦改元曰至徳是日黄龍見於東野紫氣滿於天門以一旅成百萬之師率胡夷平社稷之難是以白鹿擾於王庭靈芝産於延英赫赫河圖啓天之祜雲從億萬皇在九五盡武之善去湯之慙廣平王俶請築宫當考肅宗紀天寳十五嵗七月辛酉太子至靈武甲子即位改元至徳唐魚藻宫又見池類順宗紀為皇太子嘗侍宴魚藻宫禁苑池中有山山上建魚藻宫在大明宫北月徳宗貞元十二年九月癸夘十三年七幸王建詩謂池底張錦亦奢矣張水戲綵艦宫人為櫂歌衆樂間發徳宗歡甚顧太子曰今日何如太子誦詩好樂無荒以對穆宗紀元和十五年九月辛丑觀競渡角抵于魚藻宫舊紀元和十五年七月壬辰幸魚藻池發神䇿六軍二千人浚之九月辛丑大合樂於魚藻宫觀競渡敬宗紀寳厯元年五月庚戌二年三月戊寅五月戊寅觀競渡于魚藻宫西京雜記漢有魚藻宫唐宫室制百官志左校令宫室之制自天子至士庶有等差車服志文宗下詔太和元年五月王公之居不施重栱藻井三品堂五間九架門三間五架五品堂五間七架門三間兩架六品七品堂三間五架庶人四架而門皆一間兩架常參宫施懸魚對鳯瓦獸通栿乳梁建隆洛陽宫殿圖東京大内大寧宫東京大内據闕城之西北宫城周回五里即唐宣武節度使治所梁以為建昌宫後唐復為宣武軍治晉為太寧宫國朝建隆三年五月詔廣皇城命有司畫洛陽宫殿按圖而修之自是皇居壯麗矣南三門曰宣徳左掖右掖東一門曰東華西曰西華北曰拱宸宣徳門内南門曰大慶正殿曰大慶次北文徳殿門次文徳殿殿東南隅有鼓樓漏室西南鐘樓殿次北門曰左右銀臺西紫宸殿即視朝之前殿次西垂拱殿其後福寧殿次後柔儀殿欽明殿其西睿思殿福寧殿東慶夀宫慶夀萃徳二殿福寧殿西寳慈宫寳慈姒徽二殿福寧殿後坤寧殿凡禁中殿閣有嘉慶殿觀文殿延真門積慶殿感真閣福聖殿夀寧堂慶雲殿玉京殿清景殿西凉殿慈徳殿景寧殿垂拱殿門次西皇儀殿次西集英殿殿後需雲殿即玉華殿東有昇平樓舊曰紫雲廊北龍圖閣閣東序資政崇和二殿西序宣徳述古二殿其北天章閣閣東西序羣玉藻珠二殿次北寳文閣閣東西序嘉徳延康二殿東華門外西北廊元符觀有謻門門内南廊慶寧宫西華門内延福宫穆清靈顧性智三殿次北廣聖宫宣祐門内東廊次北資善堂講筵所西廊次北崇政殿殿東西延義邇英二閣閣後隆儒殿次北景福殿殿南延和殿殿西北迎陽門門内後苑有太清樓延春閣儀鳯翔鸞二閣宜聖殿嘉瑞宣明安福寳岐化成金華清心流杯清輝親稼殿華景翠芳亭瑶津亭象瀛山池建隆三年正月甲戌發開封浚儀民數千廣皇城之東北隅命義成節度韓重贇董役四年五月十四日詔重修大内以李懐義趙仁遂䕶役二十四日明徳門成學士陶榖撰碑乾徳修宫闕建隆三年正月十五日廣皇城東北五月大修宫闕乾徳元年即建隆四年五月十四日復増修宫闕長編五月乙丑命李懐義等増修宫闕日當從長編月凡規為制度並上指授既成二十四日明徳門成坐寢殿中令洞開諸門皆端直通豁謂左右曰此如我心少有邪曲人皆見之直史館梁周翰為五鳯樓賦以進其辭曰伊京師之權輿也遐哉邈乎驗河圖之象按輿地之書宅禹貢豫州之域距天文辰馬之墟因四履建侯之地為六代興王之居城峻而都河𣲖而渠結坤之絡振乾之樞星甍櫛堵我民之廬海漕山廥我田之租勢雄跨胡氣王吞吳茫茫萬國魚貫而趨惟聖皇之受命應期運而握符光潛躍於龍徳踐元亨於帝衢道徳何師尊盧赫胥揖讓何比陶唐有虞英畧神武威憚八區長鯨盡刳封豕必誅虎皮包刅鵠板捜儒墜典皆索闕政咸鋪成天下之大務若雷奮而風驅乃顧京室時行聖謨陋宸極之非制稽紫垣之舊圖且曰不壯不麗豈𫝊萬世禹之卑宫蓋勿暇之計堯之茅茨非經乆之制矧象魏之縣法伊億兆之所視况我力如天我貲如地不漁爾民不牟爾利一毫之費差足為易乃詔共工度景之中因舊謀新庀徒僝功臺卑若豐棟易而隆椽斵而礱去地百丈在天半空五鳯翹翼若鵬運風䨇龍蟠首若鼇戴宫丹楯霞繞神光何融朱楹虹植晴文始烘繡楣焜燿彫栱玲瓏椒壁塗赭綺窻暈紅䨇闕偶立突然如峯平見千里深映九重奔星墜而交觸靈景互而相逢門呀洞缺若天之裂縱舉百武横駕六轍金鋪爍人光景明滅舞陽之力莫得而排叔梁之力胡可以抉其下則冠蓋葳㽔劍佩陸離車如流水待漏而馳駕肩排踵兼蠻渾夷萬衆紛錯魚龍尊卑咸去來之由此競奔湊於玉墀亶皇風之無外豈朝盈之有時三事庶尹乃拜表蕭牆謁帝未央以落大壯登謌永昌曰元聖明兮帝道昌威四海兮君萬方時髙闕兮冠百常赫宋徳兮垂無疆瞻天顔兮獻夀觴願君王兮長樂康帝曰俞哉爾觴且置當聽朕言庶曉朕意頃於戎馬之暇詳窺歴代之紀乃知乎夏徳之衰璇室自庇商政之壊傾宫大侈楚王章華一身何寄秦皇阿房三世而棄漢武柏梁孽火隨熾陳后三閣義師尋至豈非乎禍生於漸欲起於恣亦如崇飲不已必至昏醉嗜色不已必至乏瘁遷怒不已必絶人祀窮兵不已必暴人胔甘諛不已必杜忠義溺讒不已必斥賢智亡國之君未嘗不爾朕皆知之得以趍避淫於土木雅不如是羙其成功良以為愧不舉君觴恐驕朕志其大者天地所重者神器尾虎足冰終日惴惴當共重之勿使顛墜謹謝公卿無忘納誨羣臣乃退咸呼萬歲長編開寳元年正月乙巳大内營繕畢賜諸門名令洞開諸門開寳修洛陽宫室西京大内開寳八年十月十九日通畧作丁巳將議巡幸遣王仁珪李仁祚焦繼勲同修洛陽宫室明年三月辛巳帝至洛覩其壯麗甲申繼勲等並進秩四月庚子郊丙午發西京辛亥至東京太祖生於洛陽樂其土風常有遷都之意㑹要西京大内據京城之西北宫城舊名紫㣲城周回九里三百歩南靣三門南曰五鳯樓東曰興教西曰光政東一門曰蒼龍西門曰金虎北門曰拱宸正殿曰太極殿殿前有左右龍尾道日樓月樓次天興殿後有殿閣太極殿門之西靣南曰應天門北乾元門次北敷政門次北文明殿次垂拱殿建禮門之西曰廣夀殿其北明徳殿其次天和殿其次崇徽殿明福門内曰天福殿其次太清樓其次思政殿延春殿北曰武徳殿明福門之西曰金鑾殿唐曰太極其次夀昌殿玉華甘露長夀乾陽嘉興殿金鑾之西曰含光殿殿東廊後有紫雲樓樓前射殿南有講武殿殿後有後殿後苑内有長春殿東宫在蒼龍門之西宫後有飛龍院西有散甲殿景徳二年八月修西京大内以將朝陵故也四年二月命崇文院詳定殿名己巳次西京三月己亥至自西京熙寧四年二月十一日復詔修之政和三年十二月亦詔修大内元豐七年七月四日河南守韓絳請修長春殿等太祖幸西京有留都之意李符陳八難不從李懐忠進說晉王切諫帝悟即日還京上曰吾將西遷者欲據山河之勝而去冗兵循周漢故事開寳歴代宫殿名書目一卷開寳中翰林學士李昉承詔以前代宫殿池苑臺觀門闕名號見於載籍者集為一篇上之古者天子之居總言宫其别名皆曰堂明堂是也詩言自堂徂基禮言天子之堂初未有稱殿者秦紀言作阿房甘泉前殿疑起於秦時咸平萬安宫咸平二年閏三月丁亥宰臣張齊賢等言漢制帝母稱長樂宫唐穆宗郭太后居興慶宫敬宗王太后居義安宫文宗蕭太后居積慶宫今請命有司為皇太后李建宫立名紀云上宫戊子詔以萬安宫為名遂以滋福殿為宫祥符二年又以宫為滋福殿章惠楊后名保慶宫景祐元年九月庚子詔四年改慈徳殿建隆元年二月上太后尊號詔曰王者立顯親之殿所以尊母儀開長樂之宫所以伸子道天聖長寧宫地理志天聖三年延福宫北建長寧宫内有太清玉清冲和集福㑹祥五殿降真閣景祐二年改長寧宫曰廣聖降真閣曰崇真景祐廣聖宫二年正月己酉改長寧宫為廣聖宫宫在禁中在承天門之北前殿有道家天神三清玉皇之像後起觀閣降真閣奉真宗神御占宫城西北隅天聖二年建皇祐元年八月丁亥召近臣宗室臺諫廣聖宫朝拜真宗神御殿以殿新成也景祐延福宫二年二月戊午御延福宫閱樂器政和二年十二月二十三日宴輔臣三年九月朔幸賜宴宣和七年三月十七日宴羣臣于延福宫之睿謨殿宫在承天門北有穆清成平㑹寧睿謨凝和崑玉羣玉七殿地理志延福宫有穆清殿嘉祐潛龍宫嘉祐四年闕月修潛龍宫真宗為開封尹時廨舍也嘉祐慶寧宫嘉祐七年十一月戊辰皇子英宗遷新位實録七年八月庚寅一云嘉祐八年四月十九日於内香藥庫之西偏建皇子位嘉祐八年英宗即位九月庚戌以舊位名興慶宫吕誨言唐有此宫名十二月改名慶寧會要又云在謻門内南廊治平二年賜名有閣藏御覽書籍二月十一日吕公著請俟既郊歲豐乃修宮從之治平慈夀宫治平元年七月二十一日中書門下表言在漢之隆實居長樂有唐之盛亦闡義安請以皇太后曹所居為慈夀宫殿為慈夀殿紀實録云五月丙辰上皇太后宫殿名曰慈夀五月壬子詔皇太后令稱聖㫖出入唯不鳴鞭他儀衛如章獻明肅故事熙寧慶夀宫寳慈宫熙寧元年三月十五日戊子中書門下言太皇太后曹宫殿請以慶夀為名皇太后高宫殿以寳慈為名從之後慶夀宫建慶夀萃徳二殿寳慈宫建寳慈姒徽二殿二年五月太皇太后遷居慶夀宫七月皇太后遷居寳慈宫元祐崇慶宫隆祐宫紹聖慈徳宫聖瑞宫元祐元年閏二月十九日丁未詔曰漢家致孝有朝夕供御之廷唐室承顔嚴歲時慶賀之禮逮于列聖咸有舊章建太皇太后高宫曰崇慶殿曰崇慶夀康皇太后向宫曰隆祐殿曰隆祐慈徽紹聖元年閏四月十八日詔改隆祐宫曰慈徳宫前殿曰慈徳中曰仁明後曰夀昌二年五月以皇太妃朱宫為聖瑞宫昭懐劉后宫曰崇恩顯肅鄭后宫曰寧徳元祐睿成宫元年閏二月二十一日詔神宗所居東宫為睿成宫元符元年四月幸先朝從龍官並推恩元符龍徳宫三年二月辛酉徽宗詔懿親宅潜邸名龍徳宫有申福臻祥二殿政和龍徳太一宫見祠宫類陸韶之記曰臣竊惟皇帝陛下修誠毖祀祗奉上真登秩薦饗昭備典䇿乃政和八年戊戌之歲龍徳太一宫先成宫直都城之西北隅實龍潜之舊邸也仰摹宸極一新祠庭前殿曰黄秘之殿次曰統元之殿次曰神貺之殿門曰黄秘之門髙真象設次序分布棟宇轇轕甍桷飛騫棲金浮翠蔚跂嵽嵲逺而望之祥煙佳氣若與慶霄連接上下既成鑾輿幸焉躬執薦告之禮祈為蒼生致福已而敷大宥於天下又詔儒臣為之記而臣淺陋得以筆札待罪辭不獲命謹拜手稽首而言曰紫宫深嚴天極當中其一明者太一常居太一蓋天地之最貴者也列宿森拱五精宻輔天一犀鋒終旗晻曖招揺左麾攝提右楗陽䰟隂魄下上承臨為一為九稱號隨異㝠樞恍惚靡得測知而五福太一者其十種之一也運行有時數次舎有分野直其所臨之方則諸福徃集歲穰民阜兵㓂寢息蓋上天孚佑下土以助有天下國家者致福於斯民也我宋之興太宗肇建宫於東郊仁宗復立宫於西郊隨其遷次以昭奉事逮神考在位則又迎致中都即都城而立宫焉然則祖宗致福斯民之意槩可見矣今陛下嗣服膺綂而著雍閹茂之歲太一適臨於乾維是歲天道多在西北元命之辰興王之地適然契合新宫之成真莫大之慶龎禧繁祉是降是集天子萬年子孫千億神靈之應如此其意固可黙諭矣抑臣嘗謂乗時任數集福於聖躬者太一之福敷錫於天下無東西南北之異者陛下也作新館御飭躬修欵意在於均福生民所謂敷錫之於天下者是己徳意所在雖不待户曉而人皆知之顧臣為記以詔萬世亦不敢畧此抑臣又嘗聞周家文武之君能下下以成其政於時歸羙之詩曰俾爾單厚俾爾多益繼之言文武之事其說以謂文武不自厚而厚下故為天下所厚不自益而益下故為天下所益福禄來歸文武固不得而辭之也今陛下承太一貺施其得福禄亦當如天保所賦者臣於此不能復贅其辭矣王俊記曰臣竊惟皇帝陛下以聰明睿智之資撫綏方夏湛恩厚澤春育海涵若大若小罔不受賜其顯者固已措諸政教以福天下矣至於髙真貴神敷佑儲祉豐衍穰簡大被於黎元者亦欲欽崇而不怠也比者泰一適臨乾維揆景相方聿求爽塏用伸館御之嚴厥有遂清吉蠲休福所萃之地是為龍徳上意既定有司伻圖斤工墨師勸力不怠粤政和八年宫告成飛宇承電璧門洞開秘殿中敞次舎序列金碧爭輝像設具嚴肅若威神之在㳙日之吉鑾輿臨幸儼恪肅㳟精意昭格己而大啟黄秘明俾都人士女咸得肅心注目以祈福釐稚耋踵塗駢肩以進歡聲協氣充塞穹壤厥惟盛哉有㫖命臣為之記臣以儒學簉迹搢紳泚筆待命臣之職也詎敢以蕪纇為辭謹拜手稽首而言曰惟星經具載天象天極星其一明者太一之常居也太一中居五星環拱是為天神之尊漢人謂天神尊者太一其佐曰五帝蓋謂此也初說者謂貴神有十而尊曰五福遷徙有常率四十五歲而一易靈游所直之方祥慶駢集雨暘時叙農扈婁豐民物阜康無或疵癘由是太宗仁祖即東西郊建宫焉神宗迎致中都奉祠益謹三聖述作所以竭䖍妥靈曲盡其至然建宫乾維實有待於聖時肆真主纂服繼猷益毖祠事郊禋廟享既肅既祗乃新是宫以篤宋祜眷維是宫昔為龍潛之藩今為上真之宇昔為膺籙受圖之地今為延祥集祉之宫告成於戊戌實元㑹之嵗也直都城之西北隅實照臨之方也神謀人事不約而同垂億萬年永集純嘏然臣伏觀皇帝體道觀妙與神為一為福為祉在我而已然則作新殊廷寅奉上真凡以為民祈福者不得不然也臣愚陋誠不能窺見聖徳然嘗讀洪範曰歛時五福用敷錫厥庶民臣愚幸親見之建炎升暘宫元年六月三日辛酉名潛邸為升暘宫建炎隆祐宫元年八月庚午十二日詔以元祐太后孟宫為隆祐宫於是更稱隆祐太后隆祐本欽聖憲肅宫名蓋學士院失之紹興臨安行宫建炎三年二月十三日車駕至杭以州治為行宫紹興元年十一月八日命内臣楊公弼與徐康國剙行宫務簡約去華餙裁為百楹初欲為三百楹上不可所御殿才三楹二年正月十四日自越還臨安九月二十九日南門成名曰行宫之門九年作慈寧宫十二年作垂拱崇政殿十八年三月十四日名南北門曰麗正和寧二十四年九月建六閣二十八年六月八日増築皇城東南之外城五百四十一丈九月二十二日名新南門曰嘉㑹時復營祥曦福寧等殿乾道九年重修後殿門淳熙初作選徳殿八年秋改後殿擁舎為延和殿紹興建康行宫建炎三年四月丁夘改江寧為建康府五月八日駕至建康駐蹕神霄宫紹興三年正月命守臣趙鼎營建康行宫十一日鼎以圖来上命孟庾經畫五年五月戊午命帥漕臣繕治行宫修城壁及省部百司倉庫具圖來上務從簡約癸亥自吳門還臨安七年四月進幸八年二月復還臨安遂定都焉三十一年十二月幸建康次年二月還臨安張守謂建康自六朝為帝王都江流險濶氣象雄偉且據要㑹以經理中原依險阻以扞禦強敵可為别都以圖恢復胡安國建都論曰還都建康環諸路而中持衡則人心不揺駐蹕金陵本以舊邸號稱建康降詔為受命之符建炎元年五月辛夘詔修江寧城及繕治宫室又命築景靈宫其後不克成紹興慈寜宫九年十月二十一日詔皇太后顯仁韋后宫殿名慈寧三十日畢功其後憲聖吳后宫曰慈福成肅謝后宮曰夀慈臣等言徳之大者必盡萬物之報以稱其禮孝之至者必得四表之心以寧其親天祚文武之隆世基任姒之徳仰模太紫前考異宫宜昭掲於鴻名以荅揚於流澤臣中賀竊以東朝置衛逺存長樂之鴻名中禁承顔近著寳慈之茂實皆以體皇居於宸極據寳勢於坤靈廣一人欽愛之風極萬世尊崇之奉載新令典允屬聖時伏惟皇帝達孝通于神明要道形于徳教紹復大業對越祖宗在天之靈抑畏小心躬蹈帝王髙世之行人與能而樂戴天復命以中興上推履武之祥丕啟生商之慶方且致天下之養用夤奉於母儀成路寢之威示日嚴於子道臣等率籲衆志懇欵一詞爰稽合於前章極崇施於顯號叶情文而並舉煥典册以増華輦道中通朝夕燕兩宫之奉珮環入覲時節奉萬年之觴示垂􅁉於無疆益儲休於有羙伏請建皇太后宫殿以慈寧為名紹興九年后有歸耗命有司豫作慈寧殿于禁中遥上册寳十二年九月壬午回鑾十九年正月朔即宫中行慶壽禮二十九年復行於慈寧殿慶典自此始十三年五月壬午臧保衡獻皇太后還慈寧宫頌特進一官紹興徳壽宫淳熙重華宫先是以秦檜舊第為新宫三十二年六月戊辰名曰徳壽丙子太上皇帝内禪即日駕之徳壽宫在太内之北望仙橋東淳熙十五年八月五日擬進皇太后吳宫名曰慈福十六年正月十五日丙午皇太后遷慈福宫表云廼敞六安之舊就經長樂之新己未詔徳壽宫改為重華宫二月壬戌内禪移御光宗内禪以舊福寧殿為壽康宫初曰泰安後改而更建福寧殿御書宫殿名七字五日一朝紹熙末改重華宫為慈福宫以舊慈福宫為重壽殿二太后皆徙居此後又改慈福宫為壽慈以奉太母壽成謝后藝祖遺訓宫中止用赤白為飾仁宗故事欄楯徹去朱緑之采歴代宫名周秦時虒祁晉銅鞮晉章華楚逃夏越咸陽秦長信秦阿房秦望夷秦梁山秦館娃吳前漢未央建章長信長門櫟陽長樂五柞咸陽甘泉徳陽陵陽回中首陽交門昭臺雲陽陽靈林光龍泉明光萬嵗池陽蒲萄黄山太一思子夜光棠棃扶荔鼎湖宜春谷口望仙通天歩髙望逺集靈曜華養徳四寳延壽七里曾城天梁栢梁長楊資陽鼓簧承光長平鉤弋萯陽棫陽永安修池祈年後漢永安長樂池陽長秋永樂胡桃承光徳陽東平前魏永壽永安永寧西晉永昌𢎞訓崇徳六朝建康安徳昭明吳太初吳金華樂安安樂梁樂修陳後魏大夏閶闔金墉盛樂代同下萬壽承華廣徳壽安崇光寧光永樂北齊靜徳金虎聖應崇光三臺後周長春正陽天興雲陽行宫天成行宫隋紫微青城景華明徳朝陽棲雲積翠甘泉仙經仙都仁壽天經松仙阜澗顯仁離光流英紫芝疑華揺景浮彩舒芳懿樂彩璧淑風清暑朱明翼仙翠微層城千金長春行宫臨江行宫汾陽行宫唐太極𢎞義大安通義躍龍慶善太和翠微大明永安蓬萊玉華九成萬年奉天三陽興泰興慶華清温泉仁智飛山明徳合璧萬全紫桂飛龍望春上陽望賢九曲魚藻新沼咸宜冷泉高山龍鱗積翠宿羽青女凌波芳樹紫微積善長春行宫連昌行宫繡嶺行宫五代大明大寧至徳建昌興聖長春大昌積慶廣徳興義慶昌太平長壽昇平十六國建章逍遥未央長安和龍紫陌丹臺新録所載易遷七業上清西紫清上太霞太素繁玉琅華滄浪玉𤣥契丹洪義永興積慶延昌章敏長寧崇徳興聖敦睦見國史𫝊詩曰陟降厥士日監在兹言人君所居天所監也又曰廼眷西顧此維予宅言文王之宅天所顧也天之眷顧在文王居處之間朝寢堂室牖户房夾具有儀則非以奉己也所以疏視瀹聽儲神習體清政令之原也芸若充庭槐楓被宸繁飾累巧僝拱木於林衡授令模於梓匠遐邇恱豫而子來工徒擬議而騁巧揆日晷考星耀木無彫鎪土無綈錦夷庭廣廡厚棟修梁弗陋弗侈惟禮是憲土事不飾木功不彫服珍裘則念人之寒居夏屋則念人之熱非章華是靈臺鑒茅茨於陶唐察卑宫於夏禹周宣斯干之制漢祖壯麗之儀延王爾之竒工命班輸之妙匠星居宿陳綺錯鱗比規景水臬金鋪交映玉題相暉元棟鏤榥若騰虹之􅀭眉飛簷舒咢似翔鵬之矯翼華榱璧璫輦道纚屬奔星更於閨闥宛虹拖於楯軒青龍蚴蟉於東廂象輿宛僤於西清靈圄燕於閒館偓佺之徒暴於南榮陳圭置臬瞻星揆地規矩應天上憲觜陬烈若鉤星在漢煥若雲梁承天碧瓦鱗差瑶階肪截深闈秘殿曼宇疏楹彤軒紫柱文榱華梁綺井含葩金墀玉廂溫房則冬服絺綌清室則中夏含霜應門八襲璇臺九重表以百常之闕闤以萬雉之墉雕欒鏤楶青瑣丹楹鄰斗極之光輝邇天漢之波瀾雲譎波詭雕楹玉磶繡栭雲楣仰福帝居陽曜隂藏命般爾之巧匠詩歌楚室頌羙泮宫雲多甘泉晏恢景福天垂定星易有大壯君人者灋焉周人考室見於風雅魯國作門記備春秋漢起徳陽鍾離抗言魏營宫殿陳羣正辭周宣考室詠於詩人閟宫有侐頌聲是作鳩經始之黎民輯農功之暇豫宏璉豐敲飛宇承霓層榭三休琱簷四注千欒電斜萬桷霓張紅葩植井丹桂承梁千楣鳯起萬栱鸞浮虹梁鯨棟授矩司臬脩棟虹指飛甍鳯翔網户翠錢青軒丹墀陛納九齒閶披四目楯角儲清簷牙袤縟雕牖􅛦閜鏤楹熠煜度𢎞規法大壯虬柱虹梁望玉繩而結極承倒景而開軒赬素炳煥枌栱瑳峨隂蚪負檐陽馬承阿錯以瑶英鏤以金華方䟽含秀圓井吐葩霞駮丹檻雲攅萬楹翔鵾墜於層極宛虹拖於遊梁丹柱歙郝倔佹雲起浮柱岹嵽萬楹磊砢飛梁虹指層櫨磥垝芝栭戢孴圓淵方井朱鳥舒翼以持衡騰虹蟉蚪而遶榱飛櫩翼翥千櫨赫奕萬栱崚嶒邢子才新宫賦擬二儀而建路寢法三山而起翼室大厦眈眈斯干秩秩土成黼黻木化蛟螭隂梁北注陽馬南施百楹列倚千櫨代支玉海卷一百五十八
