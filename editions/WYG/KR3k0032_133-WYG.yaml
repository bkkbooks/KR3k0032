body:
  text: 玉海卷一百三十三宋王應麟撰官制屬國都護都督聖王之徳西被流沙東漸于海朔南暨聲教言欲與聲教則治之不欲與者不彊治也故君臣歌徳含氣之物各得其宜漢五屬國又見都尉紀元朔五年春大將軍衛青將六將軍兵十餘萬人出朔方髙闕獲首虜萬五千級六年二月出定襄數百里仍復克獲元狩二年春三月表云三年必有一誤驃騎將軍霍去病出隴西至臯蘭斬首八千餘級得休屠王祭天金人夏復與公孫敖出北地二千餘里過居延仍大克獲秋匈奴昆邪王殺休屠王并將其衆合四萬餘人來降置五屬國以處之以其地為武威酒泉郡注師古曰凡言屬國者存其國號而屬漢朝故曰屬國分去病傳上嘉去病之功曰降異國王三十二云云廼處降者於邊五郡故塞外而皆在河南因其故俗為屬國注師古曰不改其本國之俗而屬於漢故號屬國表元狩二年昆邪王降復增屬國置都尉丞􅀱千人磔劉歆議武帝置五屬國起朔方郡揚雄賦分黎單于裂屬國杜篤賦幷域屬國一領方師發其騎以擊胡則破奴將之發其騎以伐宛則貳將之趙充國發屬國胡騎為田者游兵功臣表昆侯渠復絫以屬國大首渠擊匈奴侯元鼎五年五月戊戌騏侯駒幾以屬國騎捕單于兄侯五月壬子梁期侯任破胡以屬國都尉間出擊匈奴侯五月辛巳百官表屬國都尉武帝初置輪臺詔曰屬國都尉成忠趙破奴官典屬國卿也所以統邊郡屬國都尉等也地理志安定屬國都尉治三水劉歆盖思齊張奐為之皇甫規奏免安定屬國都尉李翕上郡屬國都尉治龜兹馮奉世傳上郡屬國歸義降胡萬餘人天水屬國其都尉治勇士富平侯張放五原屬國其都尉治蒲澤征和三年煇渠侯雷電以五原屬國都尉與貳師俱擊匈奴馮立亦為之劉茂五原屬國􅀱張掖屬國其都尉治日勒後志今昆邪故地武帝置郭元鳳三年張掖屬國都尉忠發兵擊匈奴屬國千長義渠王騎士射殺黎汗王二月癸丑封成安侯哀帝以班穉為西河屬國都尉匈奴傳竟寧元年侯應曰設塞徼置屯戍非獨為匈奴綏而已亦為諸屬國降民本故匈奴之人恐其思舊逃亡和元年夏侯藩說單于曰匈奴斗入漢地直張掖郡漢三都尉居塞上士卒數百􅀱望久勞宜上書獻此地後官志兼本紀每屬國置都尉一人比二千石丞一人又竇融傳注有屬國徒主蠻夷降者建武六年省都尉惟邊郡屬國都尉往往仍舊稍有分縣治民比郡和永元三年二月己亥復置西河上郡屬國都尉注哀帝省并大鴻臚今復置安永初元年正月戊寅分犍為南部為屬國都尉延光二年又分蜀郡西部為之郡國志安帝命屬國别領比郡者六廣漢别領三城漢馮緄為之擊順帝永和二年二月廣屬國都尉破白馬羌蜀郡别領四城董扶犍為别領二城張掖武帝置安帝時别領五城竇融馮宗馬􅐧居延别領一郡樂浪之遼東别領六城孫段紀明公沙穆為之公瓚為長史上郡之龜兹安定屬國降胡見於馮異傳注張掖精兵萬騎見於竇融之傳屬國盧水胡及湟中月氏見於西羌傳義縱胡屬國有故城永初四年正月梁慬至屬國故城與匈奴戰耿䕫永初三年到屬國故城擊南單于有元甲軍騎千長吏士漢金城屬國詳見屯田類紀昭帝始元六年秋以邊塞濶逺取天水隴西張掖郡各二縣置金城郡宣帝神爵二年夏五月置金城屬國以處降羌地理志金城郡昭帝始元六年置户三萬八千四百七十口十四萬九千六百四十八縣十三注臣瓚曰稱金取其堅固也師古注云郡在京師之西故謂金城金西方之行趙充國傳既破先零其秋羌若零離留且種兒庫共斬先零大豪猶非楊玉首及諸豪弟澤等皆帥煎鞏黄羝之屬四千餘人降漢初置金城屬國以處降羌金城長史辛慶忌上官鴻煎叚紀明曰先零作㓂充國徙令居内當亂邊馬援遷之三輔始服終叛至今為鯁後紀和帝永元十四年二月乙卯繕修故西海郡徙金城西部都尉以戍之漢西河北地屬國單于奉珍朝賀校尉宣紀五鳳三年三月行幸河東祠后土詔曰往者匈奴數為邊㓂百姓被其害朕承至尊未能綏安匈奴虛閭權渠單于地節二年立請求和親神爵二年病死右賢王屠耆堂代立骨肉大臣立虛閭權渠單于子為呼韓邪單于四年擊殺屠耆堂諸王並自立分為五單于屠耆呼揭車犂烏藉更相攻擊死者以萬數畜産大耗什八九人民飢餓相燔燒以求食因大乖亂單于閼氏子孫昆弟及呼遫累單于名王右伊秩訾且渠當户以下將衆五萬餘人来降歸義單于稱臣使弟奉珍朝賀正月北邊晏然靡有兵革之事朕􅅚躬齋戒郊上帝祠后土神光並見或興於谷燭燿齋宫十有餘刻甘露降神爵集已詔有司告祠上帝宗廟三月辛丑鸞鳳又集長樂宫東闕中木上飛下止地文章五色書云雖休勿休祇事不怠公卿大夫其勉焉減天下口錢赦殊死以下置西河北地屬國以處匈奴降者昭帝末西河屬國胡畔馮奉世持節將兵追擊地理志西河縣三十六戶十三萬六千三百九十北地縣十九户六萬四千四百六十一青西河美稷有屬國都尉見上續志北地參䜌注有山謝沈書屬國降羌胡數千人居山田蓄四後漢建武二十三年單于詣西河太守求内附二十年冬北自立為呼韓邪單于十二月癸丑匈奴始分南北二十六年冬詔南單于徙居西河美稷後紀和帝永元十一年四月己巳復置右校尉官注東觀記曰置在西河鵠澤縣漢典屬國九譯令表典屬國秦官周象胥掌蠻夷降者武帝元狩三年紀云二年秋昆邪王降後增屬國置都尉丞候千人竇融傳注有屬國􅀱屬官有九譯令周象胥舌人之類官越裳重九譯故以名成帝河平元年六月省并大鴻臚賈誼傳請試以臣為屬國之官必係單于之頸始元六年詔栘中監蘇武奉使全節以為典屬國常惠代蘇武為典屬國明習外國事昆又馮奉世任立公孫邪安平侯楊譚為之漢西域都護傳西域本三十六國後分至五十餘孝武時張騫始開西域之迹其後驃騎將軍擊破匈奴右地降渾邪休屠王元狩二年秋遂空其地始築令居以西初置酒泉郡後稍發徙民充實之分置武威張掖敦煌元鼎六年秋列四郡據兩關焉自貳師將軍伐大宛之後西域震懼多遣使來貢獻漢使西域者益得職於是自敦煌而至鹽澤往往起亭至輪臺渠黎皆有田卒數百人置使者校尉領護以給使外國者又昭帝始元二年冬發習戰射士詣朔方調故吏將屯田張掖郡至宣帝時遣衛司馬使護鄯善以西數國及破姑師未盡殄分以為車師前後王及山北六國時漢獨䕶南道未能盡并北道也然匈奴不自安矣其後日逐王畔單于將衆來降護鄯善以西使者鄭吉迎之既至漢封日逐王歸徳侯是嵗神爵三年也通鑑神爵二年考異云表傳皆誤乃因使吉并䕶北道故曰都䕶都䕶之起自吉置矣都䕶三嵗一更絶域之中久任則生患故也僮僕都尉自此罷匈奴益弱不得近西域於是徙屯田於北胥鞬披莎車之地屯田校尉始屬都護督察烏孫康居諸外國動靜有變以聞可安輯安輯之可擊擊之都護治烏壘城去陽關二千七百三十八里與渠黎田官相近土地肥饒於西域為中故都護治焉六典注漢宣置都護長史一人至元帝時復置戊己校尉屯田車師前王庭自宣元後單于稱蕃臣西域服從其土地山川王侯戶數道里逺近翔實矣凡國五十自譯長城長將相王侯皆佩漢印綬凡三百七十六人而康居大月氐安息罽賓烏弋之屬皆以絶逺不在數中其來貢獻則相與報不督録總領也後漢傳伊吾車師前部髙昌壁後部金滿城此西域之門戸也故戊己校尉更互屯焉宣紀神爵二年秋匈奴日逐王先賢撣音纒將人衆萬餘來降使都護西域騎都尉鄭吉迎日逐破車師皆封列侯鄭吉傳吉為人强執習外國事自張騫通西域李廣利征伐之後初置校尉屯田渠黎本始中常惠為校尉持節護烏孫兵至宣帝時吉以侍郎田渠黎積穀因發諸國兵攻破車師遷衛司馬使護鄯善以通西南道神爵中二年秋匈奴乖亂日逐王先賢撣欲降漢使人與吉相聞吉發渠黎龜兹諸國五萬人迎日逐王口萬二千人小王將十二人隨吉至河曲頗有亡者吉追斬之遂將詣京師漢封日逐王為歸徳侯三年四月戊戌封吉既破車師降日逐威震西域遂并護車師以西北道故號都護師古曰並䕶南北二道故謂之都都猶大也總也都護之置自吉始焉上嘉其功效詔以吉撫循外蠻宣明威信迎日逐王衆擊破車師兠訾城功效茂著封吉為安逺侯食邑千戶神爵三年四月壬戌封吉於是中西域而立莫府治烏壘城鎮撫諸國誅伐懐集之漢之號令班西域矣始自張騫而成於鄭吉贊曰自元狩之際張騫始通西域至于地節鄭吉建都護之號訖於莽世凡十八人皆以勇畧選其有功迹者具此亷褒以恩信稱郭舜以亷平著孫建用威重顯其餘無稱焉成帝時郭舜言宜歸康居侍子百官表西域都護加官宣帝地節二年初置考異云表誤以神爵為地節以騎都尉諫大夫使護西域三十六國有副校尉秩比二千石丞一人司馬􅀱千人各二人辛慶忌為校尉段㑹宗傳竟寧中為西域都䕶西域敬其威信三嵗更盡還西域諸國上書願得㑹宗陽朔中復為都護谷永予書曰都護之職總領百蠻懐柔殊俗傅鄭甘陳之功没齒不可復見願因循舊貫毋求竒功元延中烏孫數千騎圍㑹宗後罷去復遣㑹宗使安輯與都護孫建并力甘延壽傳為使西域都護與副校尉陳湯斬郅支建昭三年出西域後西域傳武帝時西域内屬有三十六國漢為置校尉領護之宣帝改曰都護元帝又置戊己二校尉哀平間分為五十五國莽簒位西域怨叛建武中二十一年二十二年遣使求内屬願請都護光武不許十四年莎車王賢與鄯善王安遣使貢獻於是西域始通十七年賜賢西域都䕶印綬及車旗黄金錦繡敦煌太守裴遵言不可詔收還印綬猶詐稱大都䕶移書諸國二十一年冬車師前王鄯善焉耆等十八國俱遣子入侍願得都護天子還其侍子二十二年鄯善願復遣子入侍更請都護天子報曰諸國力不從心東西南北自在也永平十六年明帝命將北征取伊吾盧地置宜禾都尉屯田遂通西域于窴諸國皆遣子入侍西域自絶六十五載乃復通焉明年十七年始置都護戊己校尉十八年焉耆龜兹攻没都䕶陳睦建初元年春迎還戊己校尉不復遣都䕶二年復罷屯田伊吾和帝永元二年竇憲擊伊吾破之三年班超定西域因以超為都護十二月復置居龜兹復置戊己校尉戊部􅀱六年超破焉耆於是五十餘國悉納質内屬十三年任尚代超安帝永初元年攻圍都護任尚段禧等六月壬戌詔罷都護遂棄西域永寧元年置護西域副校尉居敦煌永寧元年三月班勇上議宜於敦煌復置營兵三百人及副校尉於是從勇議延光二年夏以班勇為西域長史西屯柳中遂平車師論曰張騫懷致逺之畧班超奮封侯之志終能立功西遐覊服外域自兵威之所肅服財賂之所懷誘莫不獻方竒納愛質露項肘行東向而朝天子故設戊己之官分任其事建都護之帥總領其權先馴則賞籯金而賜龜綬後服則繫頭顙而釁北闕立屯田於膏腴之野列郵置於要害之路西域長史元和三年班超延光三年班勇永元三年徐幹建寧三年張晏為之馮副校尉肅宗時李愉延平元年梁慬為之又豹有才謀拜河西副校尉通鑑永平十六年春伐北匈奴十七年冬十一月遣竇固耿秉劉張出昆侖塞進擊車師秉以為先後王則前王自服引兵進後王安得降前王亦歸命遂定車師而還於是固奏復置西域都護戊己校尉以陳睦為都護司馬耿恭為戊己校尉屯後王部金蒲城謁者關寵為戊己校尉屯前王柳中城屯各置數百人恭况之孫也班超傳永平十八年焉耆攻没