body:
  text: 玉海卷一百三十二宋王應麟撰官制使說苑曰明君之使人也任之以事不制以辭此奉使之事也漢繡衣使者譙𤣥傳元始四年選明達政事能班化風俗者八人元為繡衣使者持節與太僕任惲等分行天下觀覽風俗平當傳使行流民幽州舉奏刺史二千石勞徠有意者奉使十一人為最有繡衣直指假稻田使者見農官行寃獄使者張敞傳護菀使者谷永令見上林漢八使八俊周舉傳順帝漢安元年詔遣八使廵行風俗皆選素有威名者乃拜舉為侍中與侍中杜喬守光祿大夫周栩前青州刺史馮羡尚書欒巴侍御史張綱兖州刺史郭遵太尉長史劉班並守光祿大夫分行天下其刺史二千石有臧罪者驛馬上之墨綬以下便輒收舉有清忠惠利為百姓所安宜表異者皆以狀上於是八使同時俱拜天下號曰八俊紀漢安元年八月丁卯遣杜喬等八人分行州郡班宣風化舉實臧否表賢良顯忠勤喬奏李固政為天下第一張綱傳八使惟綱年少官秩最㣲餘人受命之部而綱獨埋其車輪於洛陽都亭曰豺狼當路安問狐貍遂奏大將軍冀河南尹不疑無君之心十五事他使所劾亦多冀及宦者親黨蔡邕傳上封事曰五年制書議遣八使又令三公謡言奏事是時奉公者欣然得志邪枉者憂悸失色漢清詔使范滂傳冀州饑荒以滂為清詔使案察之滂登車攬轡有澄清天下之志至州境守令自知臧汙望風解印綬去第五種傳以司徒掾清詔使冀州注風俗通曰汝南周勃辟大尉清詔使荆州葢三公府有清詔員以承詔使也雷義使持節督郡國行風俗太守令長坐者凡七十人唐安撫使安撫大使通鑑兼實錄等書武德元年十月庚辰淮安王神通為山東道安撫大使山東諸軍事並受節度貞觀四年李大亮為西北道安撫大使總章元年劉仁軌為遼東道安撫大使垂拱四年六月左丞狄仁傑為江南安撫使天授二年李嗣真等為十道存撫使朝中有詩送之名曰存撫集十卷貞元十一年九月丁巳加韋臯統押近界諸蠻及西山八國雲南安撫等使韋臯為劒南節度就加安撫遂為兼官永貞元年八月己未宰臣袁滋為劒南兩川山南西道安撫大使太和五年七月甲申李踐方兩川安撫使後魏太和十七年廣陵王羽持節安撫六鎮正光五年酈道元為關右大使慰撫六鎮隋仁壽四年楊素為河北道安撫大使又韋師為山東河南十八州安撫大使唐乾封元年李勣為遼東道行軍大總管兼安撫大使儀鳯三年李敬元為洮河道安撫大使神功元年納言狄仁傑為河北道安撫大使長安四年姚元之為靈武道安撫大使㑹要唐武德中唐儉為并州道安撫大使杜伏威為淮南道安撫大使開元四年正月二十九日丙午鄫王嗣真除安北大都䕶充安撫河南關内隴右諸蕃部落大使遥領自兹始西城安撫使解琬畢諴河南安撫使天房式傳韋臯表為雲南安撫副使萬嵗通元年姚璹為榆關道安撫大使武德五年李靖為嶺南撫慰大使九域志云桂州有李靖嶺南道安撫大使平蠻碑頌武德中山東平以大理卿鄭善果為招撫大使吐蕃傳云中書令李敬元為西河鎮撫大使婁師德韋湊為營田大使延載元年張元遇為桂永等州經畧大使唐觀風俗使㑹要貞觀八年正月二十九日壬寅遣大使觀風俗舊紀命尚書右僕射李靖等使于四方觀省風俗於是分遣蕭瑀李靖楊恭仁王珪竇静舊紀作竇誕李大亮劉德威皇甫無逸韋挺李襲譽張亮杜正倫趙𢎞智等巡省天下詔曰觀風俗之得失察政刑之苛弊唐黜陟使唐書通鑑實録貞觀八年將發十六道黜陟大使畿内未有其人正月壬寅令李靖充使李靖傳遷右僕射時遣十六道使察風俗以靖為畿内道大使道十八年遣十七巡察二十年正月丁丑遣孫伏伽等二十二人以六條察四方紀云黜陟于天下多所舉刺太宗命褚遂良具狀以問親自臨決牧宰以下進擢者二十人死者十人或云七人免黜者數百人龍朔三年八月戊申分遣巡察大使黜陟官吏神龍二年二月丙申遣十道巡察使姜師度等二十人開元二十一年四月二十一日乙卯遣使崔翹等黜陟官吏實録二十九年五月命崔翹等八人分行天下詔曰三載考績必鑒吏能八使觀風因求民瘼二十九年十月戊戌遣使黜陟官吏天寶五載三月丙子命席豫等黜陟一云正月至德二載十二月虢王等為使建中元年正月辛未發黜陟使庾何等十一人行天下通鑑二月丙申朔賈陸䞇説使者以五術省風俗曰聽謡誦納市訊簿書覽車服省作業元和十四年七月己丑遣黜陟使于天下開成元年二月庚寅分命盧鈞等五人為黜陟使唐寧朔大使舊紀貞觀十四年三月戊午置寧朔大使以䕶突厥唐按察使見都督景雲二年二月降十道使按察七月分遣都督刺史十道按察紀龍朔三年八月戊申遣按察大使於十道唐節度使詳見兵制通典邊方有冦戎之地則加以旌節謂之節度使呉孫權初置節度官使典掌軍糧自景雲二年四月始以賀拔延嗣為涼州都督充河西節度使其後諸道因用此號㑹要永徽已後除都督帶使持節即是節度使節通鑑綱目景雲元年冬十月以薛訥為幽州經畧度大使節度之名自此始得以軍事專殺行則建節府植六纛外任之重莫比焉本皆兼度支營田使開元九年十一月勅河東河北不須别置並令節度使兼有副使行軍司馬判官掌書記㕘謀隨軍開元中凡八節度使若朝覲則别置留後磧西開元六年三月楊嘉惠始除四鎮節度經畧使十二年已後或稱磧西河西景雲二年四月賀拔延嗣始有節度之號隴右開元元年十二月始除楊矩朔方開元元年十月六日改朔方行軍大總管為朔方節度使表云九年置河東開元十一年已前稱天兵軍節度使其年三月四日改太原已北諸軍節度十八年二月宋之悌除河東節度幽州先天二年二月甄道一除天寶元年十月裴寛除范陽節度開元七年閏七月張敬忠始除平盧軍節度劒南開元五年二月齊景胄除上元二年二月分為兩川廣德二年正月八日合為一道大厯二年正月二十日又分兩川嶺南至德二年正月始除賀蘭進明咸通三年五月分東西道兩節度會要開元四年正月二十九日丙午親王始遥領十六年十一月癸巳宰相始遥領河西節度副大使蕭嵩除平章事節度如故二十六年李林甫遥領隴右天寶十載楊國忠領劒南皆置留後官志其後有持節為節度副大使知節度事者正節度也諸王拜節度大使者皆留京師唐宣撫使通鑑兼㑹要等書開元元年七月壬申命畢建等六人宣撫十道開元初陸餘慶河南北宣撫使十五年八月河北水災宇文融為宣撫使二十年河北飢盧從愿為宣撫處置使德宗初闗播宣撫湖南興元元年正月平章事蕭復充宣慰安撫使貞元八年八月以水災命奚陟等宣撫於延英殿臨遣元和四年正月以旱災命鄭敬德崔芃孟簡裴武宣撫淮南宣歙浙西東山南東道江西鄂岳等道召對告以勤於奉職十四年二月壬戌楊於陵充淄青宣撫使崔戎𫝊雲南蠻亂成都詔戎持節劍南為宣撫使唐採訪使㑹要開元二十二年二月十九日辛亥初置十道採訪處置使三月二十三日置印都畿中丞盧絢京畿中丞裴曠河南嗣魯王道堅關内李尚隠河東崔隠甫河北宋瑶嶺南李朝隠淮南韋虚心河西牛仙客劍南王昱山南韓朝宗江南劉日正隴右裴端復山南西道宋諭江南班景倩張九齡奏置二十五年十二月二十四日命採訪使考課官吏善績三年一奏乾元元年四月十一日停採訪黜陟使通鑑五年壬午是嵗改為觀察處置使地理志開元二十一年百官志云二十年監十五採訪使如漢刺史詳見郡國通鑑開元四年二月辛未以倪若水為汴州刺史兼河南採訪使時􅀭州采訪使班景倩入為大理少卿唐防禦使團練使經畧使應援使㑹要天寶十四載十一月諸州置防禦使寶應元年五月十九日停開元元年幽州置防禦大使至德一載置江東及衡州建中二年正月置潼闗防禦使廣德二年置河中五州都團練觀察使永泰元年置丹延都團練使大厯十二年五月十日停諸州團練是年合浙江東西道置都團練觀察使建中元年分二道貞觀二年邊州别置經畧使先天二年二月除幽州節度經畧鎮守使開元六年除四鎮節度經畧使十一年四月河西節度張敬忠加經畧使二十七年置福建經畧使開耀後桂州置管内經畧使開元二十一年黔州置五溪經畧使天寶十四載置邕容管經畧使十載置安南管内經畧使至德二載正月賀蘭進明除嶺南五府經畧兼節度使建中元年三月除元琇始不帶五府經畧兼安南經畧王式翃黔中郄士美容管戴叔倫元結王邕管徐中桂管馬揔淳廣州都督五府經畧使宋璟見文粹又李尚隠容永元年以婁師德為河源軍經畧副使韋丹拜管經畧招討使始城容州周十三里置屯田二十四所見韓文紀建中四年四月庚申張伯儀為淮西應援招討使唐宣諭使列傳崔渙肅宗時為江淮宣諭選補使潘孟陽永貞元年八月以户部侍郎宣諭江淮裴度元和九年為魏博宣諭使温造穆宗時為太原鎮州幽州宣諭使鄭覃鎮人留王承元不出詔覃為宣諭使傳詔開大義唐鎮守使張鎰傳大厯初為濠州刺史擢侍御史兼縁淮鎮守使唐觀察使東畿至德元載置廣德二年罷大厯十四年復留臺中丞兼京畿廣德二年置中丞兼永泰元年御史大夫兼建中二年二月十八日中丞袁髙兼浙西乾元元年置宣歙池大厯元年置福建六年置洪吉宣歙饒乾元元年置廣徳二年洪吉更名江西鄂岳元和五年置湖南廣德二年置唐安撫制置使通鑑中和二年以王徽為京畿安撫制置使乾寧三年徐彥若為京畿安撫制置使又韓建為之咸平宣撫大使慶厯宣撫使有軍旅大事命執政大臣為之咸平三年六月丁夘參政向敏中為河北河東縁邊宣撫大使宻學馮拯陳堯叟為副御長春殿置宴以遣之慶厯二年三月十六日樞副杜衍為河東宣撫使翰學丁度副之三年七月甲戌樞副任中師河東參政范仲淹陜西八月癸丑樞副韓琦代仲淹四年六月仲淹陜西河東八月六日樞副富弼河北八年正月參政文彥博河北明鎬副之熙寧三年九月乙未參政韓絳陜西即軍中拜昭文相宣和五年左丞王安中河北河東燕山靖康元年六月知宻院李綱河北河東資政劉韐副之建炎三年五月知宻院張浚為宣撫處置使以川陜京西湖南北路為所部命以便宜黜陟九月簽書周望兩浙京湖宣撫使郭仲荀為副紹興元年十一月戊戌參政孟庾為福建江西湖南北宣撫使韓世忠為副四年八月知宻院趙鼎川陜宣撫處置使乾道三年六月知院虞允文四川宣撫使五年三月參政王炎四川七年除樞使依舊七年四月同知院劉珙制襄不拜淳熙元年三月丙申鄭開大資政四川二年六月罷四川宣撫司嘉定十二年同知院曽從龍江淮使相安丙四川嘉熙元年同知院李􅌫四川寶祐六年十一月樞使賈似道兩淮宣撫大使二年資政李曽伯四川前宰相為之者紹興元年八月丁夘觀文殿學士呉敏荆湖廣南二年二月庚午李綱湖廣兼潭守吕頤浩江東朱勝非江西並兼淮南三十二年七月少傅張浚江淮置司建康乾道八年九月少保武安節度虞允文四川寶祐五年正月少保趙葵京湖宣撫大使建炎四年四月己夘觀文朱勝非江西湖南北尋改武臣為宣撫始於皇祐四年九月庚午樞副狄青湖北治平三年十月同簽樞郭逵陜西四路武臣非執政為之者始於建炎三年閏八月太尉劉光世江東紹興元年五月丁酉令江東安撫大使呂頤浩江西安撫大使朱勝非浙西安撫大使劉光世並兼宣撫淮南二年二月賜光世宣撫使印其後光世江東淮西又為淮南韓世忠江東西鎮江建康府淮東又為淮東京東淮東宣撫處置使張俊浙西江東又為江東淮西岳飛湖北京西呉玠川陜呉璘四川楊存中江淮荆襄尋改嘉熙四年孟珙四川紹興五年正月壬戌韓世忠淮東鎮江置司癸亥劉光世淮西太平置司張俊江東建康置司壬申入辭上命升殿出内金盤尊斚賜酒一行光世等飲之釂并所飲器賜之從臣為之始於紹興二年三月端明李光壽春等州九月端明王似川陜十二月龍學盧法原並副使之四年三月似為使法原副開禧二年六月刑書丘崈江淮十一月崈及兵書薛叔似以端明侍讀依舊江淮京湖三年四月兵書宇文紹節除華文學士侍讀為京湖兼江陵守鄧友龍以中丞江淮呉獵以刑侍京湖紹興元年九月己亥資政葉夢得為江東安撫大使兼知建康并壽春等六州宣撫使十一月詔福建制置使辛企宗聼宣撫司節制武臣為宣副始於建炎三年郭仲荀兩浙其後福建韓世忠川陜呉玠紹興二年九月張浚將召歸始命文臣為副岳飛京湖楊存中淮北等皆不置使而第以副使為名熙寧三年韓絳使陜直舍人院吕大防為判官絳就拜相大防為知制誥薛向為待制並命為判官紹興十年七月癸丑太尉楊沂中為淮北宣副劉錡以節度為判官二帥抗禮非熙寧之制矣三十二年張浚宣撫江淮以中書舍人陳俊卿為判官兼權建康府事紹興四年著令宣撫使官屬參謀視提刑參議視運判機幹在諸州通判之上領宣撫使者皆見任二府故行移用劄子韓世忠宣撫淮東詔於所部州縣用劄子紹興二年九月辛巳福建江西荆湖等路宣副韓世忠為江南東西路宣撫使置司建康㳂江三大帥劉光世李囘李光並去所領􅀭楚等州宣撫使名其節制淮南諸州如故湖廣李綱止充湖南安撫使十一年四月壬辰京東淮東宣撫處置使韓世忠淮西宣撫使張俊並為樞宻使湖北京西宣撫使岳飛為樞宻副使乙未詔三宣撫司並罷遇出師臨時取㫖逐司統制官已下各帶御前字入銜開禧二年十一月甲申丘崈以簽樞督視江淮三年正月己夘知樞張岩代之端平二年十一月乙丑曽從龍為樞使督視江淮魏了翁為簽樞督視荆湖嘉熙二年二月辛夘史嵩之以參政督視荆湖江西三年正月癸酉為右相都督兩淮荆湖二月丙寅都督江淮荆湖四川四年四月癸夘結局淳祐七年四月趙葵為樞使督視江淮京西湖北景德安撫使咸平經畧使舊制諸路災傷或邊境用師皆遣使安撫事已則罷其河北河東别置司景德三年四月十四日置河北㳂邊安撫使以雄州守何承矩為之李允則為副使景德中邵􅁮為縁海安撫使祥符元年置河東安撫司三年八月戊辰命昇洪􅀭廬州守臣兼安撫使慶厯二年五月庚申置京東兩路安撫使三年十月置湖南安撫司五年正月二十八日范仲淹知邠州兼陜西四路㳂邊安撫使八年四月辛夘置河北四路安撫使從夏竦之請也昌七年三月判大名府賈朝已兼使皇祐四年六月己丑詔廣桂守臣並帶經畧安撫使八月孫沔為江西湖南安撫使康定二年正月壬戌遣使體量安撫十三路嘉祐五年七月辛夘分京西為南北路南以鄧北以許州守臣兼安撫使建炎元年六月丙戌詔諸道帥府皆帶使名從李綱之言也兩朝志凡諸路安撫以知州充掌撫綏良民而察其姦宄以肅清一道京東東青西鄆京西北許南鄧湖南潭河北定髙陽真定大名廣桂政和四年十一月移京西於河南京東於應天宣和三年九月詔洪州守臣依江寧府兼安撫使中興㑹要浙東紹興西臨安江東建康西隆興淮東揚西廬湖南潭北荆南福建福京西南襄陽廣東廣西靜江成都成都利興元潼川瀘夔夔内廣西成都潼川夔路帶兵馬都鈐轄餘路帶馬步軍都總管廣東帶主管經略安撫司公事廣西帶經畧安撫使淮西以廬州為帥府而壽春府又帶管内安撫使建炎三年五月以江池饒信為江州路知州為安撫使建康太平宣徽廣德為建康府路知府為安撫制置使四年五月罷諸州管内安撫使又江東西路分置三帥鄂州江州建康於池州置帥以建康至鎮江太近故也六月丙戌呂頤浩為大使朱勝非江州路大使浙西安撫使移於鎮江劉光世為大使又詔罷諸路帥臣兼制置使二品以上除大使前執政為帥者例充大使紹興元年正月詔江東池江西江荆湖東鄂西鼎九月詔以建康洪州為江東西帥府江池州帶㳂江安撫使六年五月詔襄陽上流重地依陜西五路例帶京西南路經略安撫使六月荆南帶湖北經畧安撫使十二年十月罷㳂江安撫使十四年九月四川宣副鄭剛中請以利州分東西兩路西呉璘東楊政州又以郭浩為金房開達安撫使乾道三年四月十一日併利州為一路以呉璘知興元為安撫使四年四月二日詔金州帶管内安撫先是十二月併歸利路咸平五年正月甲辰以張齊賢為邠寧等經畧使判邠州七月丙申錢若水為并代經畧使康定元年二月丁亥夏守贇為陜西經畧安撫使五月己夘范仲淹韓琦為副使尹洙為判官紹興十年楊政為經畧安撫使知興元呉璘為階成岷鳯經畧使皇祐四年六月詔廣桂州帶經畧安撫使紹興五年湖北帥王庶依襄陽守臣例帶經畧安撫陜西用兵夏守贇竦陳執中為陜西經畧安撫招討使琦仲淹為副其後琦仲淹龎籍為西路都部㳂邊經畧等使而諸路帶經畧使名者九人劉摰曰祖宗之法不以武臣為大帥專制一道必以文臣為經畧以總制之慶厯招討使慶厯元年五月詔陜西經畧招討使夏竦屯鄜州五年春正月以夏國欵附罷使名熙寧八年十二月命趙卨為安南道經畧招討使建炎四年十二月李成圍江州以張俊為江南路招討使位宣撫使下制置使上著為令紹興五年十二月岳飛為湖北襄陽招討使十年六月一日兀术犯三京以韓世忠張俊岳飛兼河南北招討使三十一年十月四日癸夘以陜西河東命呉璘京東河北東路命劉錡京西河北西路命成閔為使蓋遥領其地十一月又命呉拱李顯忠隆興元年五月李顯忠為淮南京畿京東河北招討使邵宏淵副之慶厯按察使三年五月戊寅詔轉運使皆領按察使提刑不帶使名亦準此轉運使副即漢刺史唐觀察使之職嵗具官吏能否以聞先是元年正月壬戌遣使十五路安撫十月丙午命張昷之王素沈邈又命杜杞歐陽修五年十月辛酉詔按察之名過於煩苛其並罷之皇祐五年十二月置京畿轉運使以按察畿輔王贄為之至和二年罷嘉祐二年知諫院陳升之言天下州三百縣千二百其治否朝廷不得周知付之十八路轉運使令上選用責任考課三法將帥之選多出監司先自逺路漸擢至京東西淮南資望深績效著者乃擢任陜西河東河北三路及成都路自三路及成都召為三司副使熙寧察訪使熙寧七年四月命樞宻都承㫖曽孝寛充河北東路兼青鄆齊濮州察訪使廉車本唐十道採訪之官初無文武之别也咸平錢若水以執政舊臣五年六月祥符王嗣宗以中司峻望三年六月天聖李維以禁林舊徳四年三月陳堯咨以内相清選五年八月慶厯韓琦王㳂范仲淹龎籍皆以一時縉紳冠冕易授此官二年四月中興以來有自次對而得者當時猶謂之優焉建炎元年十二月待制邢煥二年正月十八日詔后族不任侍從著為令甲孟忠辱以顯謨直學士換常徳軍承宣使建炎御營使詳見兵制建炎元年五月丁酉中書侍郎黄潛善兼御營使同知樞宻汪伯彥兼副使四年六月甲戌罷以宰相范宗尹兼知樞宻院事紹興二年九月甲子直徽猷閣郭偉為淮西巡撫使建炎撫諭使元年五月戊戌以路允迪耿延禧為京城撫諭使副始建使名左丞呂好問為京師撫諭使四年正月中書舍人李正民為江浙湖南撫諭使令按察官吏能否紹興元年十二月吏侍傅崧卿為淮東撫諭使後不復置建炎元年八月御史馬伸等八人撫諭東南兩河川陜三年二月方聞撫諭河東紹興二年十二月周隨亨李愿撫諭川陜皆不帶使字乾道元年十一月龍大淵撫諭兩淮軍馬建炎招撫使淳化末趙昌言以參政為川陜招撫使後不復置建炎元年六月丁亥張所為河北西路招撫使紹興三年二月庚戌李横為京西招撫使十年五月劉光世為三京招撫處置使明年七月罷三十一年成閔等三大將為湖北京西淮東西招撫使三十二年七月李顯忠淮西十一月張子蓋淮東隆興元年八月劉寶淮東二年三月王彥淮西乾道元年正月二十五日罷兩淮招撫司開禧二年四月郭倪兼山東京東又有京西北路招撫使副唐廣德二年九月辛亥郭子儀為朔方招撫使貞元元年四月丙戌馬燧渾瑊為河中招撫使元和九年十月甲子嚴綬為申光蔡招撫使長慶元年八月己丑裴度幽鎮招撫使㑹昌二年九月劉沔張仲武回鶻招撫使三年七月盧鈞為招義節度招撫使建炎鎮撫使四年上還㑹稽時羣盜連衡据州郡參政范宗尹請析地以處之稍復藩鎮之制少與之地而專付以權五月甲子宗尹已為相宗尹請以淮南京東西湖南北諸路並分為鎮除茶鹽置官提舉外他監司並罷上供財賦權免劇盜李成桑仲等皆即以為鎮撫使五月二十日進呈二十二日降詔曰周建侯邦四國有藩垣之助唐分方鎮北邊無夷狄節之虞欲隆鎮撫之名為輟按亷之使有民有社得制於境中足食足兵聽專征於間外茍功烈之克彰當永𫝊於後裔二十八日詔諸鎮戮力悉心睦鄰恤難有冦更相應援六月十日解潛為荆南歸峽荆門公安程昌禹為鼎澧鎮撫使紹興初乃不復除久之但餘荆南解潛而已五年召潛主管馬軍遂罷鎮撫使蓋鎮撫使之有聲者文臣惟陳規武臣惟岳飛王彥解潛李横耳嘉定十五年十二月賈涉為京東河北鎮撫節制大使紹興宣諭五使宣和七年十二月宇文虚中為河北河東宣諭使靖康元年二月种師道河北宣諭使紹興元年十二月六日詔吏侍傅崧卿為淮東宣諭使户書孟庾為江東西湖南宣諭制置使未行而秉政二年十一月己夘宣諭五使御史劉大中胡蒙朱異明槖薛徽言同班入見上諭曰今遣卿等務令民被實惠姦臧之吏必須按發公正之人必須薦舉山林不仕賢者亦當具名以聞平反獄訟觀風問俗等事並書于厯朕一一行之非尋常遣使比也異浙東福建蒙浙西太中江東西徽言湖南槖廣東西五使將行上命各賜内帑帛二百凡五使所按吏總七十有九人槖二十七人大中二十人徽言十六人異蒙各八人薦士五十有七人槖二十人大中十六人異十二人蒙六人徽言三人而大中所劾多大吏槖大中異所舉多聞人徽言鋭於有為而槖大中數言公私利病惟胡蒙奉承大臣風㫖六年右司范直方宣諭川陜九年御史方庭實宣諭三京淮北皆使者職也九年復陜西四月詔簽樞樓炤往永興宣諭秘少鄭剛中為參謀予衛卒十人因制置移屯等事宣諭之權自此重十一年十月鄭剛中宣諭川陜始建使名得與邊事三十一年六月八日中丞汪澈為湖北京西宣諭使節制兩路軍馬置司鄂州詔曰凡其所臨如朕親幸三十二年二月兵書虞允文川陜九月户侍王之望代之隆興元年六月允文湖北京西二年四月户侍錢端禮吏侍王之望兩淮九月刑侍呉芾淮西開禧二年鄧友龍兩淮薛叔似京湖三年四月呉獵四川皆以使名自剛中後權任在宣撫之亞紹興經制使宣和間陳亨伯兼紹興初罷九年正月復置戸侍梁汝嘉為使農少霍蠡為判官未㡬省五年閏二月孟庾以參政提領措置財用庾請以緫制司為名七月沈與求領之六年省後二年復置經制發運使建炎元年六月乙丑馬忠為河北經制使七月己丑朔王燮傅亮為河東經制使副使使名雖同實掌兵事焉李綱遣張所與亮措置兩河四緫領淮東西湖廣四川髙宗以大元帥駐軍濟州命隨軍轉運梁楊祖緫領措置財用然未以名官也建炎末張浚用趙開緫領四川財賦名自此始紹興十一年諸將罷兵五月辛丑置三總領命中都官為外司農搃賦入而制其出四川改都轉運司十五年復置四川總領乾道六年四月併淮東於淮西七年復舊江淮荆蜀置治粟使者四擇列等介鄉若尚書郎畀之紹興三年正月甲子命户侍姚舜明往建康總領大軍錢糧時諸軍屯建康者嵗用錢糧五十餘萬皆户部財計故命舜明領之總領名官自此始十一年五月辛丑胡紡淮東呉彥璋淮西江東曽慥湖廣江西京湖置司楚建康鄂各專一路發御前軍馬文字諸軍不聽節制蓋使之與聞軍事不獨職餽餉云總領官正名自此始紹興制置使大使唐建中四年五月乙未劉洽為淄青兖鄆招討制置使紀大中五年三月以白敏中為司空同平章充招討党項行營都統制置等使敏中請用裴度故事擇廷臣為將佐許之後周顯德五年謀伐蜀以髙防為西南面水陸制置使本朝熙寧後多用武臣建炎元年八月二十六日郭仲荀制置東南盜賊十一月王淵為杭州制置使三年二月四日劉光世為行在五軍制置使輔臣以本職為制置使始於建炎三年同簽書宻院呂頤浩為江淮兩浙江浙建炎三年二月四日呂頤浩兼知鎮江陳彥文程千秋為副使浙西建炎三年六月安撫使康元之兼四年四月張俊浙西江東七月劉光世為安撫大使其浙西制置使韓世忠張俊並罷紹興三十一年劉錡浙西淮南江東制置使沿江建炎三年六月劉寧止提領水軍為副使閏八月胡舜陟為㳂江都制置使知建康王羲叔為副紹興四年馬廣為江西㳂江制副屯武昌隆興二年十一月沈介知鄂州兼㳂江制置使乾道三年八月命知建康史正志兼總建康至鄂渚舟師開禧二年七月知建康葉適兼嘉定十二年六月二十日詔置司建康十四年詔制副置司鄂州李􅌫為之江淮開禧二年七月葉適改兼江淮制使措置屯田後徐誼楊輔等為之淮西建炎三年七月胡舜陟紹興七年九月劉錡以廬州守兼安撫營田使兼制副嘉定十二年六月詔淮西制副置司廬州淮東建炎三年劉光世為淮南制置使嘉定十二年詔制副置司楚州沿海紹興二年七月仇悆為福建兩浙淮東沿海制置使置司許浦三年七月以郭仲荀知明州兼之六年二月馬廣兼制副十月梁汝嘉為浙西淮東沿海制置使王彥副之九年併歸浙東安撫司二年呂源為浙東福建沿海制置使置司定海縣六年紹興守孫近兼十年知平江梁汝嘉兼浙西沿海知明州仇悆兼沿海制置使三十一年李寶浙西通泰海州沿海隆興元年七月于潚知明州兼沿海制置使江西紹興三年九月岳飛駐江州節制舒蘄二州州初建炎三年江守臣兼四年四月胡世將以洪守安撫使兼京湖紹興五年九月岳飛為荆湖南北襄陽府路制置使兼節制蘄黄三十一年成閔湖北京西隆興二年十月韓仲通除荆襄四川紹興三年十月呉玠除利州路制置使五年十一月席益除四川安撫制置大使兼成都守八年正月胡世將為四川制置使大使紹興三年九月趙鼎始為江西安撫制置大使置司洪州十六年鼎帥浙東四年七月席益帥潭湖南五年十一月益帥成都呂頤浩帥湖南六年浙西李綱帥江西八年五月李光帥江西開禧三年丘崈江淮兼建康守嘉定二年八月安丙四川守興元寶祐五年十二月李㑹伯廣南序位在宣副之上玉海卷一百三十二
