body:
  text: 玉海卷六十八宋王應麟撰禮儀禮制上古者宫室車輿以為居衣裳冕弁以為服尊爵俎豆以為器金石絲竹以為樂以適郊廟以臨朝廷以事神而治民其嵗時聚㑹以為朝覲聘問懽忻交接以為射鄉食饗合衆興事以為師田學校下至里閭田畮吉凶哀樂莫不一出於禮由以教其民為孝慈友悌忠信仁義常不出於居處動作衣服飲食之間三代以亡遭秦變古後之有天下者一切用秦雖有欲治之主牽於時俗安於茍簡而已自漢以來史官所記皆有司之事爾所謂禮之末節也伏羲嘉禮禮記外傳嘉禮者好㑹之事起自伏羲以儷皮為幣始制嫁娶又禮記正義通典皮月令正義按世本伏羲制以儷嫁娶之禮黄帝五禮禮記正義尊卑之禮起於遂皇伏羲之時易道既彰禮事彌著古史考云制嫁娶以儷皮為禮則嘉禮始於伏犧也郊特牲云伊耆氏始為蜡熊氏曰即神農則祭祀吉禮起於神農也又史記云黄帝戰涿鹿則有軍禮易繫辭黄帝九事章則有凶禮論語撰考云軒轅知地利九牧倡教是賓禮也自伏犧以後至黄帝吉凶賓軍嘉五禮始具論語殷因夏禮周因殷禮則夏商亦有五禮鄭康成注大宗伯云唐虞有三禮至周分為五禮不言夏商者書篇散亡夏商之禮絶據周禮有文者而言周公攝政六年致太平述文武之徳而制禮皇氏云禮理起於太一禮事起於遂皇禮名起於黄帝祭統禮有五經莫重於祭注吉凶賓軍嘉以吉禮為首堯禮後漢曹褒傳元和二年詔曰帝命驗曰順堯考徳題期立象注宋均注曰堯省河洛得龜龍之圖書舜受禪後習堯禮得之演以為考河命題五徳之期立将起之象凡三篇在中候禮記外傳唐虞之際五禮明備虞五禮三禮五典舜典慎徽五典注五常之教父義母慈兄友弟恭子孝舉八元使布之於四方朱氏曰父子有親君臣有義夫婦有别長幼有序朋友有信修五禮五玉注修吉凶賓軍嘉之禮五等諸侯執其玉疏以周五禮為此五禮者此篇類於上帝吉也如喪考妣凶也羣后四朝賓也大禹謨汝徂征軍也堯典女于時嘉也五禮之事並見於經鄭氏云公侯伯子男之禮漢郊祀志修五禮五樂注五禮吉凶軍賓嘉也契作司徒敷五教五常之教五品疏云謂品秩一家之内尊卑之差即父母兄弟子是也婦朱氏曰五品父子君臣夫長幼朋友之名位等級咨伯作秩宗典朕三禮注天地人之禮禮疏秩宗即周之宗伯言三足以包五餘鄭語伯夷能於神以佐堯通典天地唯吉禮其四禮並人事兼之爾春秋正義延篤言張平子説三墳三禮禮為人防雅曰墳大防也書曰典朕三禮臯陶謨天敘有典敕我五典五惇哉天秩有禮自我五禮有庸哉注公侯伯子男五等之禮肅疏五禮再見於虞書而孔注自為牴牾王云五禮謂王公卿大夫士鄭𤣥云天子諸侯卿大夫士庶民各以意説史舜紀堯乃試舜五典百官皆治周禮宗伯疏禮論云唐虞有三禮至周分為五禮通典修贄類帝吉禮也釐降嬪虞嘉禮也羣后四朝賓禮也征于有苗軍禮也遏密八音凶禮也自伏羲以來五禮始彰堯舜之時五禮咸備禮記正義同云舜時五禮具備云三禮者據事天地與人為三禮王制正義鄭志云唐虞之禮五載一巡守虞禮樂制度黄帝禮樂制度王制五年天子一巡守嵗二月東巡守至于岱宗柴望祀山川覲諸侯問百年就見之命太師太師掌樂之官陳詩以觀民風命市納賈以觀民之好惡命典禮考時月定日同律禮樂制度衣服正之山川神祇有不舉者為不敬不敬者君削以地宗廟有不順者為不孝不孝者君絀以爵變禮易樂者為不從不從者君流革制度衣服者為畔畔者君討有功徳於民者加地進律南巡如東禮注天子以海内為家時一巡省之五年者虞夏之制也周則十二嵗一巡守正義典禮之官於周則太史也正定甲乙之日隂管之同陽管之律玉帛之禮鐘鼓之樂及制度衣服各有差等舜典云同律度量衡大意與此同也堯典云五載一巡守正謂虞也連言夏耳王制又曰三公一命卷注虞夏之制天子服有日月星辰又曰諸侯五年一朝注虞夏之制諸侯嵗朝周制六服各以其服數來朝五年一巡守者虞夏之制周則十二嵗一巡正義堯典五載一巡守謂虞也若夏與殷依鄭志當六年一巡守又曰天子三公九卿二十七大夫八十一元士注此夏制也又曰諸侯礿則不禘注虞夏之制諸侯嵗朝廢一時祭通典嵗二月云云又命典禮之官考校四時月日及候氣之律吕所用禮樂宫室車旗等制度君臣上下之衣服皆以王者所頒制度考校之周官六年五服一朝又六年王乃時巡考制度于四岳史秦紀由余曰黄帝作為禮樂法度身以先之揚子問道篇虞夏襲堯之爵行堯之道法度彰禮樂著書覲四岳羣牧班瑞于羣后協時月正日同律度量衡修五禮五玉漢郊祀志作五樂三帛命伯夷作秩宗典三禮命䕫典樂教胄子八音克諧神人以和欲觀古人之象日月星辰山龍華蟲作㑹宗彛藻火粉米黼黻絺繡以五采彰施于五色作服欲聞六律五聲八音在治忽以出納五言夔曰戛擊鳴球搏拊琴瑟以詠祖考來格虞賓在位羣后徳讓下管鼗鼓合止柷敔笙鏞以間鳥獸蹌蹌簫韶九成鳯凰來儀夏禮殷禮夏殷禮中庸子曰吾説夏禮杞不足證也吾學殷禮有宋存焉論語殷因於夏禮周因於殷禮所損益可知也禮器天子之冕朱緑藻十有二旒注朱緑似夏殷禮也周禮天子五采藻祭綂春礿夏禘注謂夏殷時禮祭義注春禘者夏殷禮也周以禘為殷祭更名春祭曰祠詩清廟疏以王制之法及鄭志所云殷禮春礿夏禘内宰疏夏殷之禮爵命不及於士周之禮上士三命中士再命下士一命殷六禮七教周十二教見官制司殷禮商禮俗記王制司徒修六禮以節民性冠昏喪祭鄉相見明七教以興民徳父子兄弟夫婦君臣長幼朋友賓客齊八政以防淫飲食衣服事為異别度量數制正義此六禮七教並是殷禮周則五禮十二教也書洛誥王肇稱殷禮祀于新邑咸秩無文疏時制禮已訖而云殷禮者此殷禮即周公所制禮也雖有損益以其從殷而來故稱殷禮既用騂牛明用周禮顧氏云舉行殷家舊祭祀用周之常法言周禮即殷家之舊禮也鄭𤣥云王者未制禮樂常用先王之禮樂周公制禮樂既成不使成王即用周禮仍令用殷禮者欲待明年即政告神受職然後班行周禮故告神且用殷禮也君奭殷禮陟配天多歴年所郊特牲注魯公之郊用殷禮詩殷武箋商邑之禮俗翼翼然可則傚樂記注武王使箕子視商禮樂之官殷王居明堂禮月令迎春東郊注王居明堂禮曰出十五里迎嵗盖殷禮也周近郊五十里正義逸禮篇名當顔師古以為文王攷仲春髙禖注王居明堂禮曰帶以弓韣季春磔禳注亦引之仲秋水始涸注引季秋除道仲冬引孟冬之月命農畢積聚收牛馬季冬引季冬命國為酒合三族君子説小人樂禮器注引仲秋乃命國醵蔡邕明堂論亦引之唐禮志貞觀中顔師古議明堂曰文王居明堂之篇帶弓韣禮髙禖九門磔禳國有酒以合三族推其事皆與月令合則皆在路寝也㑹要無文王二字一又有置除道以利農夫句詩疏袁準正論云古有王居明堂之禮月令則其事也夏殷國典月令季冬天子與公卿大夫共飭國典論時令以待來嵗之宜注飭國典者和六典之法也周禮以正月為之建寅而縣之今用此月所因於夏殷也周五禮六儀五典武王五教三十六禮禮大司徒六藝注禮五禮之義以五禮防萬民之偽教之中保氏教六藝一曰五禮吉凶軍賓嘉教之六儀曰祭祀賓客朝廷喪紀軍旅車馬之容祭祀齊齊皇皇賓客穆穆皇皇朝廷濟濟翔翔喪紀纍纍顛顛軍旅暨暨詻詻車馬匪匪翼翼大宗伯注禮謂曲禮五其别三十有六疏大宗伯總掌三十六禮之等吉禮之别十有二禋祀實柴槱燎血祭貍沈疈辜肆獻裸饋食祠禴嘗烝凶禮之别五喪荒弔禬恤賓禮之别八朝宗覲遇㑹同問視軍禮之别五大師大均大田大役大封嘉禮之别六飲食昏冠賓射饗燕脤膰賀慶小宗伯掌五禮之禁令與其用等籩人注今吉禮存者特牲少牢諸侯之大夫士祭禮也皆云饋食之禮内宰以隂禮教六宫九嬪都宗人正都禮家宗人掌家禮記明堂位周公攝政六年制禮疏周官儀禮也樂記武王云云五者天下之大教也疏郊射一裨冕二祀明堂三朝覲四耕籍五書周官司徒敷五典注五常之教疏五典即五教謂父義母慈兄友弟恭子孝也君牙𢎞敷五典周九儀九禮五儀大宗伯以九儀之命正邦國之位每命異儀貴賤之位乃正壹命受職始見命為正吏再命受服受𤣥冕之服三命受位列國之卿始有列位於王四命受器公之孤始得有祭器五命賜則則地未成國之名王莽時以二十五成為則方五十里六命賜官王六命之卿使得自置其臣治家邑如諸侯七命賜國王之卿六命出封加一等者八命作牧侯伯有功徳者加命得專征伐九命作伯上公有功徳者加命為二伯得征五侯九伯者作受以義言賜以禮言作以功言賜以君為主受與以臣為主其實一而已小宰八成五曰聴禄位以禮命注司農謂九賜也𤣥謂九命之差等疏謂若大宗伯九儀從一命以至九典命掌諸侯之五儀諸臣之五等之命注五儀公侯伯子男之儀五等謂孤以下四命三命再命一命不命也疏此五儀有三等之命命雖有同者其儀皆異大宗伯據九等之命為九儀命異儀即異此據五等之爵為五儀是以命同儀有異上公九命為伯其國家宫室車旗衣服禮儀皆以九為節侯伯七命以七為節子男五命以五為節王之三公八命其卿六命其大夫四命及其出封皆加一等諸侯適子誓於天子攝其君則下其君之禮一等未誓以皮帛繼子男公之孤四命以皮帛眡小國之君其卿三命大夫再命士壹命侯伯之卿大夫士亦如之子男之卿再命大夫壹命士不命宫室車旗衣服禮儀各眡其命之數典命所言自尊以及卑大宗伯所言由小以及大天子制命於上諸侯承命於下而皆有儀焉内宰疏見上大司馬九法設儀辨位以等邦國謂諸侯及諸臣之儀大行人以九儀辨諸侯之命等諸臣之爵以同邦國之禮而待其賓客九儀謂命者五公侯伯子男爵者四孤卿大夫士諸侯之王事辨其位正其等協其禮小行人協九儀賓客之禮朝覲宗遇㑹同君之禮也存覜省聘問臣之禮也司儀掌九儀之賓客擯相之禮以詔儀容辭令揖讓之節詔王儀南鄉見諸侯土揖庶姓時揖異姓天揖同姓擯之各以其禮掌訝掌邦國之等籍等九儀之籍掌交諭九禮之親九儀之禮大司徒十二教五曰以儀辨等杜子春注謂九儀史藺相如傳秦設九賓於廷注韋昭曰九賓則周禮九儀索隠曰九服之賓客左傳宋左師獻公合諸侯之禮六注其禮六儀子産獻伯子男㑹公之禮六周九儀記先王之制莫急於儀惟周質隆朝有朝儀射有射儀車有車儀樂有樂儀而玉帛弁冕履舄之容藹如也鸞和環佩瑀琚之聲鏘如也升降出入之際翼如也而賓儀之辨尤極纎悉蓋朝覲宗遇嵗有常禮弁冕紳緌四方朝貢麟次輻集交際酬酢爵列少紊則禮容乖錯而位著不恪其係於觀瞻豈細事哉抑嘗紬繹周官辨儀之深意還觀九儀布在六典馭貴富以爵禄詔於太宰聴禄位以禮命敘於小宰以儀辨等見於大司徒正儀辨位見於大司馬至其命秩則掌於春官意者出爵賜命藹然如春所以昭示上仁其儀章則詳於秋官意者序爵秩禮肅然如秋所以森嚴典憲擯相謹於司儀禮籍具於小行人掌訝辨其邦國之等掌交論其九禮之親康成傳經皆以九儀釋之然儀之别雖至於九儀之總不過乎五又約而言之則三而已故典命之敘諸侯曰五儀諸臣曰五命而軻書王制之序爵皆五等也武成之列爵惟五於是可攷矣司服有公之服侯伯之服子男之服掌客有公之禮侯伯之禮子男之禮行人敘諸侯則曰如諸公男則曰如諸子而司儀賛見亦為壇三成序揖皆三等也武成之分土惟三於是可驗矣王朝内臣外眡侯邦之秩上公之孤旁眡小國之君由卿三命下而至士至於一命則侯伯所同由卿再命下而至士㣲或不命則子男所獨大槩亦不越乎三耳儀以九為數故詳而難紊儀以三為等故簡而易明至其品節隆殺之間尤截截可攷三公在朝止於八命及其出封惟加一等故典命之論禮儀必以九為節而王制之論加賜不過九命有如王者衮冕盛於九章上公之服則無升龍别嫌明㣲其分辨嚴矣然至於合諸侯長則具十有二獻盖禮不可以力踰禮不厭其從厚是固先王闢闔之大用王綱不振舊章湮汩玉㲄同賜而等列無所辨繁纓假人而名器無所司金奏施於陪臣雍徹僣夫天子滕薛爭長蔡衛爭先宋不受功鄭不承賦甚至班爵去籍而益蕩然矣漢氏革剏百官之制綿蕞一代之禮長樂朝儀設九賓之臚傳徳陽朝賀作九賓之徹樂韋昭注史謂九賓猶古之九儀若位置之有法然列爵二十等雜用秦制武功十七級特優戰士至於中朝加官之設特進賜位之殊更立紛紛非甚有紀唐之正至受朝太極百官文武之班諸郡朝集之使與夫先聖之裔先代之後文纓武裻濟濟諸蕃宗室莫不咸在當時文士之賦亦有天子端朝明庭九賓之語訊其唐之官制視漢已愧九品敘爵階區區㳂襲隋陋仰企成周不亦大有逕庭乎噫大經大法存乎禮度數纎悉具於儀魯昭習儀君子不謂知禮趙簡子問儀子大叔力辨其非禮其有以也先王盛時九畿有籍外列蠻夷鄭氏之注以為禮差之書大宗伯九儀之命非但行乎六服之内必有大者以維持乎是故曰禮儀三百威儀三千待其人然後行周六禮春官大宗伯以肆獻裸享先王以饋食享先王以祠春享先王以禴夏享先王以嘗秋享先王以烝冬享先王疏此一經陳享宗廟之六禮也詳見宗廟以賓禮親邦國春見曰朝夏見曰宗秋見曰覲冬見曰遇時見曰㑹殷見曰同義宗曰此六者為君禮時聘曰問殷覜曰視二者為臣禮注此六禮者以諸侯見王為文朝猶朝也欲其來之早宗尊也欲其尊王覲勤也欲其勤王事遇偶也欲其若不期而至時見者言無常期諸侯有不順服者王将有征討之事則既朝覲王為壇於國外合諸侯而命事焉春秋傳曰有事而㑹殷猶衆也十二嵗王如不巡守則六服盡朝朝禮既畢王亦為壇合諸侯以命政焉秋官大行人春朝諸侯而圖天下之事秋覲比邦國之功夏宗陳天下之謨冬遇協諸侯之慮時㑹發四方之禁殷同施天下之政注此六事以王見諸侯為文司馬法曰春朝圖同事夏宗陳同謀秋覲比同功冬遇圖同慮時㑹施同政殷㑹發同禁侯服嵗見甸服二嵗見男服三嵗見采服四嵗見衛服五嵗見要服六嵗見蕃國世一見曲禮天子當依而立諸侯北面而見天子曰覲天子當宁而立諸公東面諸侯西面曰朝注夏宗依春冬遇依秋春秋時齊侯唁魯昭公以遇禮相見取易畧也覲禮今存朝宗遇禮今亡周禮經見前六經類大宰建邦之六典注典常也經也法也王謂之禮經常所秉以治天下也邦國官府謂之禮法常所守以為法式也常者上下通名疏釋言云典經也凡言經者以經紀天下左傳序宣子所見周之舊典禮經疏傳稱分魯公備物典䇿典䇿則史官記事之法若發凡言例皆周公制若所記無法何足賜諸侯周衰諸國多違舊章唯春秋遵周公之典以序時事周之所以王文王作易象也春秋獨遵周公典法故先言周公之徳𨼆七年春同盟稱名繼好息民謂之禮經注此言凡例乃周公所制禮經也十一年不告之例又曰不書於䇿明禮經皆當書於䇿疏此為禮之常法丘明意言周公謂之閔元年仲孫曰魯猶秉周禮周禮所以本也魯不棄周禮未可動也僖二十一年成風曰崇明祀保小寡周禮也二十五年卜偃曰周禮未改今之王古之帝也文十八年太史克曰周公制周禮曰則以觀徳徳以處事事以度功功以食民宣十六年王曰享有體薦宴有折俎公當享卿當宴王室之禮也成二年晉獻齊捷王使委於三吏禮之如侯伯克敵使大夫告慶之禮降於卿禮一等僖十一年王以上卿之禮饗管仲受下卿之禮昭四年左師獻公合諸侯之禮六子産獻伯子男㑹公之禮六昭二年韓宣子適魯見易象與魯春秋曰周禮盡在魯矣吾今知周公之徳與周之所以王十五年叔向曰禮王之大經也言以考典典以志經二十六年王子朝告諸侯及先王之經哀七年子服景伯曰周之王也制禮上物不過十二今棄周禮而曰必百牢子貢曰大伯端委以治周禮晉語公子如楚楚成王以周禮享之魯昭公自郊勞至贈賄無失禮女叔齊曰是儀也不可謂之禮禮所以治其國行其政令無失其民趙簡子問揖遜周旋之禮子太叔曰是儀也非禮也禮上下之紀天地之經緯民之所以生也二子知禮之本末矣然制度文為雖禮之末捨此則安上治民之意無以寓周禮籍小行人掌邦國賓客之禮籍以待四方之使者令諸侯春入貢秋獻功王親受之各以其國之籍禮之注名位尊卑之書疏邦之禮籍諸侯及臣皆在大司馬九畿之籍注其禮差之書也掌訝掌邦國之等籍以待賓客注等九儀之差數禮運天子適諸侯必舍其祖廟而不以禮籍入是謂壊法亂紀注謂太史典禮執簡記奉諱惡左傳晉獻齊捷于周王告之曰非禮也勿籍孫伯黶司晉典籍奔王子朝奉周之典籍以楚孟子諸侯惡其害己皆去其籍漢志諸侯惡禮制之害已去其篇籍後輿服志戰國削滅禮籍修竒麗之服飾其輿馬文罽玉纓象鑣金鞍以相夸周語富辰曰鄭未失周典太子晉曰省其典圖刑法周禮書大史下大夫二人大祭祀與執事卜日戒及宿之日與羣執事讀禮書而協事祭之日執書以次位常大㑹同朝覲以書協禮事及将幣之日執書詔王疏當此二日之時與羣執事預祭之官讀禮書而協事執書者執行祭祀之書若今儀注周制見六經禮類三代典禮周語晉侯使隨㑹聘于周定王饗之殽烝原公相禮武子歸乃講聚三代之典禮修執秩以為晉法文公蒐被廬作執秩之法禮記公叔文子聴衛國之政修其班制明堂位注嶡周禮謂之距疏非周禮正文言周代禮儀故少牢禮俎距是也漢志河間周制十八篇似河間獻王所述儒家周灋儀大僕祭祀賓客正王之服位詔灋儀贊王牲事王燕飲相其灋小臣掌王之小命詔相王之小灋儀注趨行拱揖之容齊僕其灋儀各以其等為車送逆之節道僕其灋儀如齊車射人祭祀賛射牲相孤卿大夫之灋儀以射灋治射儀隋志儀注之興久矣上下親疏之别進止威儀之數唐虞已上分之為三在周因而為五周官宗伯所掌而太史執書以協事之類是也周禮樂書儀禮鄉飲酒禮南陔白華華黍注昔周之興也周公制禮作樂采時世之詩以為樂歌所以通情相風切也其有此篇明矣後世衰㣲幽厲尤甚禮樂之書稍稍廢棄魯禮史記齊世家景公二十六年魯昭二十年獵魯郊因入魯與晏嬰俱問魯禮左傳無其事左傳周禮盡在魯諸侯宋魯於是觀禮明堂位魯王禮也天下資禮樂焉中庸吾學周禮今用之吾從周疏鄭答趙商問曰魯與諸侯皆用周之禮法王制注魯禮三年祫郊特牲祭之日被衮注此魯禮也漢叔孫通禮儀朝儀長樂宫朝儀宗廟儀法奉常儀法叔孫通傳漢王并天下諸侯共尊為皇帝於定陶通就其儀號髙帝悉去秦儀法為簡易羣臣飲爭功醉或妄呼按劍擊柱上患之通説上曰願召魯諸生與臣弟子共起朝儀禮者因時世人情為之節文臣願頗采古禮與秦儀雜就之上曰度吾所能行為之通使召魯諸生三十餘人魯有兩生不肯行曰禮樂所由起百年積徳而後可興也通遂與所召三十人西及上左右為學者與其弟子百餘人為綿蕞野外如淳曰以茅翦樹地為纂位尊卑之次也春秋傳曰置茅蕝師古曰蕞與蕝同習之月餘通曰上可試觀上使行禮曰吾能為此迺令羣臣習肄㑹十月漢七年長樂宫成諸侯羣臣朝十月時以十月為正月嵗漢正以十月為首行朝之儀儀先平明謁者治禮引以次入殿門廷中陳車騎戍卒史記云步卒衛官設兵張旗志傳曰趨殿中郎中俠陛陛數百人功臣列侯諸將軍軍吏以次陳西方東鄉文官丞相以下陳東方西鄉行人設九賓今之鴻臚也臚句傳九賓周禮九儀也於是皇帝輦出房百官執㦸傳警引諸侯王以下至吏六百石以次奉賀自諸侯王以下莫不震恐肅敬至禮畢盡伏置法酒諸侍坐殿上皆伏抑首以尊卑次起上夀觴九行謁者言罷酒御史執法舉不如儀者輒引去竟朝置酒無敢讙譁失禮者髙帝曰吾迺今日知為皇帝之貴也拜通為奉常賜金五百斤孝惠徙通為奉常定宗廟儀法及稍定漢諸儀法皆通所論著也贊曰舍枹鼔而立一王之儀禮志命叔孫通制禮儀以正君臣之位以通為奉常遂定儀法未盡備而通終蓻文志不載曹褒傳云十二篇通将制定禮儀見非於齊魯之士叔孫通所撰禮儀與律令同録臧於理官法家又復不傳漢典寢而不著儒林傳叔孫通作漢禮儀因為奉常諸弟子共定者咸為選首然後喟然興於學郊祀志賛叔孫生畧定朝廷之儀若正朔服色郊望之事數世猶未章焉史記禮書秦悉内六國禮儀采擇其善雖不合聖制其尊君抑臣朝廷濟濟依古以來叔孫通頗有増損大抵皆襲秦故自天子稱號下至佐僚及宫室官名少所變改後曹褒傳班固上叔孫通漢儀十二篇見曹褒禮後志注樊長孫曰漢家禮儀叔孫通等所草創皆隨律令在理官藏於几閣無紀録者久令一代之業闇而不彰通典秦收儀禮歸之咸陽但采其尊君抑臣以為時用陳書沈文阿云叔孫定禮尤失前憲奠贄不珪致享無帛公王同璧鴻臚奏賀若此數事未聞於古隋志漢興叔孫通定朝儀武帝始祀汾隂后土成帝初定南北郊節文漸具後漢曹褒定漢儀是後相承世有制作禮記疏案髙祖時皇太子納妃叔孫通制禮以為天子無親迎周禮疏通作漢禮器制度取法於周陸機集功臣頌百王之極舊章靡存漢徳雖明朝儀則昏稷嗣制禮下肅上尊穆穆帝典煥其盈門風晞三代憲流後昆揚子五帝垂典三王傳禮百世不易叔孫通起於枹鼓之間解甲投戈遂作君臣之儀得也漢儀法儀品叔孫通傳髙帝悉去秦儀法為簡易云云孝惠徙通為奉常定宗廟儀法及稍定漢諸儀法志云遂定儀法賈誼傳以為漢興二十餘年天下和洽當改正朔易服色制度定官名興禮樂乃草具其儀法色上黄數用五為官名悉更奏之帝謙遜未皇也史梁世家褚先生曰漢之儀法朝見賀正月者常一王與四侯俱朝見十餘嵗一至梅福傳上書曰叔孫通歸漢制作儀品論衡曰髙祖詔叔孫通制作儀品十六篇後百官志注舊制儀品見官名韓延夀傳守潁川教以禮讓問謠俗陳和睦親愛長老皆以為便因與議定嫁娶喪祭儀品略依古禮不得過法令文學校官諸生皮弁執俎豆為吏民行喪嫁娶禮百姓遵用其教建初元年秦彭守山陽春秋饗射修升降揖譲之儀許后傳壬寅日大長秋受詔椒房儀法御服輿駕皆如竟寧以前故事禮内宰注若今稱皇后為中宫矣疏漢舊儀有此事也漢王制郊祀志文帝十六年四月使博士諸生刺六經中作王制謀議巡狩封禪事史記索𨼆劉向七録云文帝所造書有本制兵制服制篇禮記王制注盧氏云文帝令博士諸生作此篇自王者之制禄爵至六禮七教八政正義鄭氏目録云王制記先王班爵授禄祭祀養老之法度鄭答臨碩云王制在孟子後有正聴之又有古者周尺之言知在秦漢之際或曰王制言爵禄取孟子言巡狩取虞書言嵗三田及大司徒司馬司空三官取公羊氏言諸侯朝聘之節取左氏其餘必皆有所授鄭氏於不可通者必曰此殷制非也史記禮書孝文即位有司議欲定儀禮孝文好道家之學罷去之賈誼請定經制令君君臣臣上下有差父子六親各得其宜王吉言述修舊禮明王制漢禮樂古事志通没之後河間獻王采禮樂古事稍稍増輯至五百餘篇今學者不能昭見但推士禮以及天子説義又頗謬異漢未有立禮成樂此賈誼仲舒王吉劉向之徒所為増歎敘傳河間賢明禮樂是修為漢宗英宋志班氏志禮樂疎簡所漏者多典章事數百不記一漢太初宗廟百官儀漢官禮儀故事朝廷制度史記禮書武帝招致儒術之士令共定儀十餘年不就上制詔御史曰漢亦一家之事典法不傳謂子孫何化隆者閎博治淺者褊狹可不勉歟乃以太初之元改正朔易服色封泰山定宗廟百官之儀以為典常垂於後云封禪自制儀采儒術以文焉郊祀志贊太初改制服色數度遂順黄徳應劭傳建安二年遷都許昌舊章湮沒書記罕存乃綴緝所聞著漢官儀故事唐志職官類應劭漢官五卷漢官儀十卷儀隋志韋昭官職訓一卷亡凡朝廷制度百官典式多劭所立論當時行事著中漢輯序撰風俗通以辨物類名號釋時俗嫌疑文雖不典後世服其洽聞凡所著述百三十六篇續漢書劭著中漢輯叙漢官儀及禮儀故事凡十一種百三十一卷朝廷制度百官儀式所以不亡者由劭記之光武紀行司𨽻校尉三輔吏士見司𨽻僚屬皆喜老吏或垂涕曰不圖今日復見漢官威儀識者皆屬心焉耿純傳謁光武於邯鄲退見官屬將兵法度不與它將同遂自結納漢儀注帝紀注髙紀二年五月注如淳曰漢儀注民年二十二為正一嵗為士一嵗為材官騎士四年八月算賦注如淳曰漢儀注民年十五以上至五十六出賦錢人百二十為一筭五年幸天下晉灼曰漢儀注民臣被其徳為徼幸惠紀如淳曰漢儀注省中有五尚武紀元鼎五年如淳曰漢儀注酎黄金元封元年引漢儀注御史有屬太初二年如淳引漢儀注立秋貙膢宣紀本始四年師古曰漢儀注太宰令哀紀任子令應劭引漢儀注百官表注如淳引漢儀注衛率主門衛秩千石晉灼引漢儀注諸吏給事中平奏列傳注金敞傳緑車晉灼曰漢注緑車名皇孫車司馬遷傳如淳曰漢儀注太史公武帝置晉灼曰衛宏所説多不實未可以為正戾太子傳如淳曰漢儀注女長御比侍中張湯傳蘇林曰漢儀注獄二十六所韋𤣥成傳晉灼曰漢儀注宗廟一嵗十二祠翟方進傳如淳引漢儀注後輿服志注蔡邕表志曰宜集舊事儀注以成志漢儀漢儀式見律令應劭周禮小祝注杜子春引漢儀章帝紀注引丁孚漢儀式祭祀志注引丁孚漢儀祭法疏案漢儀髙帝廟主九寸前方後圓圍一尺后主七寸隋志曹褒定漢儀通典晉顧和按衛宏撰漢儀拜丞相亦無樂唐志職官類丁孚漢官儀式選用一卷漢五禮祭祀志建武三十二年二月上至奉髙刻石文曰建明堂立辟雍起靈臺設庠序同律度量衡修五禮孔安國曰公侯伯子男朝聘之禮也范甯云吉凶軍賓嘉五玉三帛二牲一死贄吏各修職復于舊典漢曹襃新禮漢禮禮簡本傳襃父充建武中為博士從巡狩岱宗定封禪禮受詔議立七郊三雍大射養老禮儀顯宗即位充上言漢再受命仍有封禪之事而禮樂廢缺五帝不相沿樂三王不相襲禮大漢自制禮以示萬世帝善之改大予樂拜充侍中作章句辨難於是有慶氏學襃少篤志傳業尤好禮事常感朝廷制度未備慕叔孫通為漢禮儀晝夜研精沈吟専思寝則懐抱筆札行則誦習文書拜博士肅宗欲制定禮樂元和二年下詔曰河圖稱赤九㑹昌十世以光十一以興尚書璇璣鈐曰述堯理世平制禮樂放唐之文襃知帝㫖欲有興作上疏曰聖人受命制禮作樂以著功徳今皇天降祉嘉瑞並臻制作之符甚於言語宜改文制著成漢禮丕顯祖宗盛徳之美章下太常太常巢堪以為一世大典非襃所定不可許帝知羣儒拘攣難與圖始朝廷禮憲宜時刋立肅宗紀賛左右萟文斟酌律禮明年復下詔曰朕以不徳膺祖宗𢎞烈乃者鸞鳯仍集麟龍並臻甘露宵降嘉穀滋生赤草之類紀於史官朕夙夜祇畏上無以彰於先功下無以克稱靈物漢遭秦餘禮壊樂崩且因循故事未可觀省有知其説者各盡其能襃省詔嘆息復上疏具禮陳樂之本制改之意拜襃侍中以事下三公未及奏詔召𤣥武司馬班固問改定禮樂之宜固曰京師諸儒多能説禮宜廣招集共議得失帝曰諺曰作舍道邊三年不成㑹禮之家名為聚訟互生異議筆不得下昔堯作大章一䕫足矣章和元年正月乃召襃詣嘉徳門令小黄門持班固所上叔孫通漢儀十二篇敕襃曰此制散略多不合經今宜依禮條正使可施行於南宫東觀盡心集作襃既受命乃敘次禮事依準舊典雜以五經䜟記之文撰次天子至於庶人冠昏吉凶終始制度以為百五十篇寫以二尺四寸簡其年十二月奏上帝以衆論難一故但納之不復令有司平奏和帝即位襃乃作為章句帝遂以新禮二篇冠永初三年正月甲子擢襃監羽林左騎後五年十一月乙丑太尉張酺尚書張敏等奏褒擅制漢禮破亂聖術宜加刑誅帝雖寝其奏漢禮遂不行范史論曰孝章永言前王明發興作専命禮臣撰定國憲而業絕天算議黜異端斯道復墜矣樂非䕫襄而新音代起律謝臯蘇而制令亟易修補舊文獨何猜焉張奮傳永元十三年拜太常上疏漢當改作禮樂圖書著明謹條禮樂異議三事願下有司以時考定先帝已詔曹襃今但奉而成之猶周公斟酌文武之道非自為制帝善之未行張衡傳永初中謁者僕射劉珍校書郎劉騊駼等著作東觀撰集漢記因定漢家禮儀上言請衡參論其事㑹並卒衡常歎息欲終成之劉歆書曰綴學之士因陋就寡信口説而背傳記是末師而非徃古至國家將有大事若立辟雍封禪巡狩之儀則莫知其原漢舊儀儒林傳衛宏好古學光武以為議郎宏作漢舊儀四篇以載西京雜事隋志漢舊儀四巻衛敬仲撰唐志同儀注類第一四卷梁有衛敬仲漢中興儀一卷亡中興書目今存者三卷非宏全書崇文目同元封舊儀見封禪武紀注引漢舊儀通天臺高三十丈成紀注師古引漢舊儀云尚書四人為四曹孔光翟方進傳注引之又祭祀志注宋志漢世朝臣見三公並拜丞郎見八座皆持板揖事見漢儀及漢舊儀列傳伏湛光武知湛名儒拜尚書使典定舊制侯霸曰漢家舊制丞相拜日封為列侯張純奏漢舊制三年一祫陳忠上疏大漢之興先王之制稍以施行藉田之耕起於孝文孝亷之貢發於孝武郊祀之禮定於元成三雍之序備於顯宗荀爽對䇿今臣僣君服下食上珍宜略依古禮尊卑之差及董仲舒制度之别注仲舒曰王者正法度之宜别上下之序以防欲也隋志職官類蔡質漢官典職儀式選用二卷唐志職官類蔡質漢官典儀一卷書目漢官典儀一卷衛尉蔡質撰記漢官位序職掌及上書謁見儀式本二卷缺一卷李􅌫補之漢禮威儀漢制度見禮類漢禮器制度續禮儀志夫威儀所以定君臣序六親也若君亡君之威臣亡臣之儀上替下陵是謂大亂可不謹哉故記施行威儀以為志禮威儀每月太史上其月厯合朔立春五供上陵冠夕牲耕髙禖養老先蠶袚褉立夏請雨拜太子拜王公桃印黄郊立秋貙劉案户祠星立冬冬至臘大儺土牛遣衛士朝㑹大喪諸侯王列侯始封貴人公主薨謝沈書太傅胡廣博綜舊儀立漢制度蔡邕依以為志譙周後改定以為禮儀志宋志司馬彪集後漢衆注以為禮儀志校其行事與前漢頗不同漢郊祠禮儀郊祀封禪禮儀郊廟昏冠禮儀七郊三雍大射禮儀後傳樊儵永平元年拜長水校尉與公卿雜定郊祠禮儀以讖記正五經異説梁松遷虎賁中郎將明習故事與諸儒修明堂辟雍郊祀封禪禮儀常與論議張純在朝歴世明習故事建武初舊章多缺每有疑議輒以訪純自郊廟婚冠喪紀禮儀多所正定曹充禮儀見上董鈞永平初為博士時草創五郊祭祀及宗廟禮樂威儀章服輒令鈞參議多見從用漢中興禮儀見養老漢甘泉遺儀文選任彦昇薦士表甘泉遺儀注胡廣漢官制度曰天子出車駕次第謂之鹵簿長安時出祠天於甘泉用之名曰甘泉鹵簿漢洛邑制度班固傳時京師修起宫室濬治城隍固乃上兩都賦盛稱洛邑制度之美以折西賓淫侈之論東都賦遷都改邑有商宗中興之則焉即土之中有周成隆平之制焉永平之際三雍巡守蒐狩㑹同命有司班憲度子徒知阿房之造天而不知京洛之有制也漢禮器制度見三禮類南齊志漢初叔孫通制漢禮而班固之志不載東京大尉胡廣撰舊儀左中郎蔡邕造獨斷應劭蔡質咸綴識時事而司馬彪之書不取魏侍中王粲尚書衛覬集創朝儀而魚豢王沈陳夀孫盛並未詳也吳則太史令丁孚拾遺漢事蜀則孟光許慈草建衆典漢禮儀禮鄉射禮疏中人之迹尺二寸者無正文漢禮云五武成歩步六尺或據此而言也魏官儀衛覬傳受詔典著作又為魏官儀隋志梁有荀攸魏官儀一卷亡齊百官志今有魏氏官儀魚豢中外官王粲傳拜侍中時舊儀廢㢮興造制度粲常典之衛覬與粲並典制度王肅傳所論駮朝廷典制郊祀宗廟凡百餘篇王基傳散騎常侍王肅著諸經傳解及論定朝儀改易鄭𤣥舊説而基據持𤣥義常與抗衡魏晉儀注春秋正義魏晉儀注寫章表别起行頭者謂之跳出晉志魏氏光宅憲章斯美王肅髙堂隆之徒博通前載三千條之禮十七篇之學各以舊文増損當世晉新禮志魏氏承漢末大亂舊章殄滅命侍中王粲尚書衛覬草創朝儀及晉建國文帝命荀顗因魏代前事撰為新禮唐志荀顗等晉雜議十卷在儀注類參攷今古更其節文羊祜任愷庾峻應貞並共刋定成百六十五篇奏之太康初尚書僕射朱整奏付尚書郎摰虞討論之虞表所宜増損曰臣典校故太尉顗所撰五禮臣以為革命垂統帝王之美事隆禮率教邦國之大務也此禮當頒於天下不宜繁多顗為百六十五篇篇為一卷合為十五餘萬言臣猶謂卷多文煩類皆重出按尚書堯典祀山川之禮惟於東嶽備稱牲幣之數陳所用之儀其餘則但曰如初周祀天地享先王其事同者皆曰亦如之文約而義舉今禮儀事同而名異者輒别為篇卷煩而不典皆宜省文而通事隨類合之事有不同乃别其異如此所減三分之一虞討論新禮訖以元康元年上之所陳惟明堂五帝二社六宗及吉凶王公制度凡十五篇有詔可其議後虞與傅咸續其事竟未成功虞之决疑注是其遺事也逮于江左僕射刁協太常荀崧補緝舊文光禄大夫蔡謨又踵修其事晉始則有荀顗鄭沖裁成國典江左則有荀崧刁協損益朝儀魏咸熙元年七月晉王奏司空荀顗定禮儀太保鄭沖揔裁列傳荀顗咸熙中蜀平命顗定禮儀顗上請羊祜任愷庾峻應貞孔顥共刪改舊文撰定晉禮顗明三禮裴秀魏咸熙初荀顗定禮儀賈充正流律而秀改官制議五等之爵創制朝儀張華晉史及儀禮憲章並屬於華多所損益摯虞元康中遷吳王友時荀顗撰新禮使虞討論得失而後施行應貞與荀顗撰定新禮唐志儀注類摰虞決疑要注一卷文選東京賦注後漢祭祀志注魏王粲傳注引決疑要注宋志魏初則王粲衛覬典定衆儀蜀朝則孟光許慈創理制度晉始則荀顗鄭沖詳定晉禮江左則荀崧刁協緝理乖紊其間名儒通學諸所論叙往往新出摰虞新禮議魏氏無巡狩故事齊志光祿大夫蔡謨又踵修輯晉新定儀注隋經籍志儀注類新定儀注四十卷晉安成太守傅瑗撰又晉雜儀注十一卷晉尚書儀十卷甲辰儀五卷江左撰封禪儀六卷職官類晉新定儀注十四卷梁尚書職制儀注四十一卷唐志晉尚書儀曹新定儀注四十一卷晉儀注三十九卷傅瑗晉新定儀注四十卷晉尚書儀曹吉禮儀注三卷晉尚書儀曹事九卷晉雜儀注二十一卷書正義晉初荀顗定新禮以六宗之神諸説不同廢之摰虞駁之謂宜依舊晉修禮學戴邈傳元帝草創學校未立邈上疏曰帝王至務莫重於禮學宜以三時之隙漸就修建於是始修禮學晉中興朝儀中興故事荀崧傳元帝踐阼拜尚書僕射使崧與刁協共定中興朝儀成帝紀咸康六年初依中興故事朔望聴政東堂蔡謨傳於禮儀宗廟制度多所議定刁協傳朝臣無習舊儀者協久在中朝諳練舊事凡制度皆稟於協梁江舊悉朝儀故事撰江左遺典三十卷齊職儀又見官制南齊王珪之有史學撰齊職儀永明九年子顥上啟曰臣父以宋元徽二年被敕纂集等級掌司黜陟遷補章服之差冠佩之飾凡五十卷詔付秘閣百官志諸臺府郎令史職吏以下具見長水校尉王珪之職儀世祖敕儀曹令史撰江左以來儀典令諮受徐孝嗣南史袁樞議引齊職儀隋志齊職儀五十卷長水校尉王珪之撰梁有王珪之齊儀四十九卷亡梁儀注隋禮儀志髙堂生於所傳士禮亦謂之儀黄初之詳定朝儀太始之削除乖謬宋書言之備矣梁武始命羣儒裁成大典陳許亨奏曰梁儀注曰一獻為質三獻為文事天之事故不三獻經籍志梁丘仲孚皇典二十卷仲孚又撰尚書具事雜儀鮑泉撰新儀三十卷鮑行卿撰皇室儀十三卷唐志王逸齊典四卷丘仲孚皇典五卷周興嗣撰職儀北史魏王慧龍撰帝王制度十八篇號曰國典常景修儀注撰大和後朝儀已施行者凡五十餘卷隋志王逡之禮儀制度十三卷儀注唐志常景後魏儀注五十卷齊梁五禮陳五禮通典齊武帝永明二年詔尚書令王儉制定五禮至梁武帝命羣儒又裁成焉吉禮則明山賓㓙禮則嚴植之軍禮則陸璉賓禮則賀瑒嘉禮則司馬褧又命沈約周捨徐勉何佟之張充庾於陵參㑹其事齊志永明二年太子步兵校尉伏曼容表定禮樂詔尚書令王儉制定新禮立治禮樂學士及職局因集前代撰治五禮梁徐勉傳受詔撰五禮普通六年畢表上之曰晉氏新禮荀顗制於前摰虞定於末齊永明五年伏曼容表求制禮樂時置學士十人修五禮諮稟王儉歴年未就又付何𦙍徐孝嗣遺文散失天監元年沈約等議五禮各置學士一人人各自舉二人抄撰嘉禮儀注以天監六年五月七日上十二帙一百十六卷五百三十六條司馬褧傳云一百十二卷賓禮儀注以六年五月二十日上十七帙一百三十三卷五百四十五條賀瑒傳云一百四十五卷軍禮儀注以九年十月二十九日上十八帙一百八十九卷二百四十條吉禮儀注以十一年十一月十日上二十六帙二百二十四卷一千五條凶禮儀注以十一年十一月十七日上四十七帙五百十四卷五千六百九十三條又别副祕閣及五經典書各一通繕寫校定普通五年二月始畢詔有司遵行大凡一百二十帙一千一百七十六卷八千十九條表以為網羅經誥玉振金聲義貫幽㣲理入神契前儒所不釋後學所未聞隋志梁吉禮儀注十卷明山賓撰賓禮儀注九卷賀場撰案山賓撰吉儀注二百六卷録六卷嚴植之撰凶儀注四百七十九卷録四十五卷陸璉撰軍儀注一百九十卷録二卷司馬褧撰嘉儀注一百十二卷録三卷並亡存者惟十九卷自梁以來始以當時所行傳周官五禮之名各立一家之學紀天監初何佟之等述制㫖并撰五禮一千餘卷帝稱制斷疑唐志嚴植之南齊儀注二十八卷沈約梁儀注十卷又梁祭地祇隂陽儀注二卷明山賓等梁吉禮十八卷梁吉禮儀注四卷又十卷梁尚書儀曹儀注十八卷賀瑒等梁賓禮一卷儀注十三卷陸璉梁軍禮四卷司馬褧梁嘉禮三十五卷又嘉禮儀注四十五卷南史陳天嘉元年張崖為儀曹郎廣沈文阿儀注撰五禮文阿撰儀禮八十餘條沈不害修五禮著五禮儀一百卷沈徳威兼五禮學士唐志陳吉禮儀注五十卷張彦陳賓禮儀注六卷隋五禮通典後魏孝文率由舊章擇其令典朝儀國範煥乎復振北齊則陽休之元脩伯熊安生後周則蘇綽盧辨宇文弼並習於儀禮隋文帝命牛𢎞辛彦之等採梁及北齊儀注以為五禮一本云文帝開皇二年命禮部尚書牛𢎞修五禮勒成百卷詔頒行之辛彦之傳與牛𢎞撰新禮撰禮要一部隋志隋朝儀禮一百卷牛𢎞撰開皇初𢎞撰儀禮百卷悉用東齊儀注以為準亦㣲采王儉禮五年正月戊辰行新禮紀仁夀二年閏十月己丑詔楊素蘇威牛𢎞薛道衡許善心虞世基王劭並修定五禮唐志牛𢎞潘徽隋江都集禮一百二十卷隋志一百二十六卷序云十二帙又見禮類玉海卷六十八
