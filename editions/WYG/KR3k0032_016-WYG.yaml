body:
  text: 玉海卷十六宋王應麟撰地理異域圖書漢别國方言唐志小學類揚雄十三卷隋志同郭璞注風俗通義曰為政之要辨風正俗最其上也周秦常以嵗八月遣輶軒之使求一作采異代方言還奏籍之藏於秘室及嬴氏之亡遺脫無見之者蜀人嚴君平有千餘言林閭翁孺才有梗概之法揚雄好之天下孝廉衞卒交㑹周章質問以次注續二十七年爾乃治正凡九千字其所發明猶未若爾雅之閎麗也張竦以為垂諸日月不刋之書晁氏志方言十三卷雄齎油素問上計孝廉異語悉集之題其首曰輶軒使者絶代語釋别國方言書目十四卷題輶軒使者絶代語釋别國方言劉歆與雄書取方言及雄荅皆云十五卷今本疑有亡軼雄為郎一嵗作繡補靈節龍骨之銘詩三章及天下上計孝廉雄問異語紀十五卷積二十七年成帝時劉子駿與雄書曰聞子雲獨採集先代絶言異國殊語為十五卷非澹雅之才沈鬰之思不能經年鋭精以成此書雄答書曰常聞先代輶軒之使奏籍之書皆藏於周秦之室蜀人有嚴君平臨卭林閭翁孺者深好訓詁郭璞序三五之篇著而獨鍳之功顯不出戸庭而坐照四表不勞疇咨而物來能名考九服之逸言標六代之絶語真洽見之竒書不刋之碩記也選注引揚雄蜀王本紀曰蜀之先名曰􅅙叢拍濩魚鳬開明是時人民椎髻左言張衡𫝊注引方言荀子注引方言子雲精於小學多見先秦古書故方言多識竒字太𤣥多竒語本𫝊及蓺文志無方言後魏書劉昞字延明著方言三卷漢異物志隋志東方朔十洲記一卷唐志神仙家文選注引之神異經一卷張華注崇後漢文選注引之文目唐志二卷後漢議郎楊孚撰異物志一卷一云交州異物志唐志同吳萬震南州異物志一卷選江賦注引之束晳撰發蒙記一卷載物産之異朱應扶南異物志一卷張騫出關志一卷凉州異物志一卷許善心撰方物志二十卷大業四年奏之唐志沈瑩臨海水土異物志選注引之陳祈暢異物志各一卷京兆郡方物志二十卷諸郡土俗物産記十九卷房千里南方異物志孟琯嶺南異物志各一卷劉恂嶺表録異三卷武紀元鼎六年珠厓儋耳張晏曰異物志二郡在海中晉書續咸著遠游志異物志皆十卷唐志沈懐遠南越志五卷書目南越志五卷宋沈懐逺載三代至晉南越疆域事跡選注引異物志南越志又蜀都賦注引譙周異物志水經注引楊氏南裔異物志漢匈奴地圖南匈奴𫝊建武二十二年右奥鞬日逐王比宻遣漢人郭衡奉匈奴地圖二十三年詣河西太守求内附漢中興四夷國俗風土後東夷𫝊序自中興之後四夷來賔雖有乖畔而使驛不絶故國俗風土可得略記凡蠻夷戎狄總名四夷猶公侯伯子男皆號諸侯南蠻𫝊論漢氏征伐戎狄文約所沾風聲所流幾將日所出入處著自山經水志者亦略及焉西域𫝊論西域風土之載前古未聞漢世張騫懐致逺之略班超奮封侯之志東夷夫餘挹婁髙句驪句驪一名貊柬沃沮濊韓馬辰弁倭南蠻巴郡南郡蠻板楯蠻夷西南夷夜郎滇王哀牢夷卭都夷莋都夷冉駹夷白馬氐西羌爰劍滇良麻奴湟中月氐胡西域拘彌于窴西夜安息大秦大月氏天竺東離栗弋奄蔡莎車疏勒蒲類東且彌車師前王南匈奴烏桓鮮卑晉華陽國志書目十卷晉散騎常侍常璩撰志巴漢風俗并公孫述以後據蜀事元豐間呂大防為叙云蜀記之可觀未有過此蜀記三卷唐鄭暐載建蜀之因及人物古跡漢地理志注牂柯引華陽國志隋志常寛蜀志一卷宋武北征記隋志一卷戴氏撰梁方國使圖職貢圖裴子野𫝊武帝時西北逺邊有白題及滑國遣使由岷山道入貢子野曰漢潁陰侯斬胡白題將一人服䖍注云胡名也又漢定逺侯擊虜入滑此其後乎時人服其博識敕使撰方國使圖廣述懐來之盛自要服至海表凡二十國梁元帝職貢圖序曰甘泉寫閼氏之形後宮玩單于之圖賛曰北通𤣥菟南漸朱鳶詳見内附類後漢東夷𫝊文選注引外國圖水經注亦引之又見通典南史滑國車師别種漢永建元年八滑從班勇擊北虜有功勇上八滑為後部親漢侯梁天監十五年始遣使獻方物普通元年二月滑國遣使獻黄師白貂裘波斯錦三年八月甲子白題國遣使朝貢七年大同元年三月辛未滑國朝貢七年又朝貢隋西域圖記裴矩𫝊大業二年西域諸國至張掖交市令矩護視乃訪諸商胡國俗山川險易撰西域圖記三卷合四十四國别造地圖凡為三道北道起伊吾中道起髙昌南道起鄯善于闐總湊燉煌還奏之三年矩說髙昌伊吾等入朝後破吐谷渾拓地數千里志三卷唐志同西域道里記三卷諸蕃國記十七卷失姓名方物志二十卷見上史記正義云西域圖記鉢汗古渠搜也唐志裴矩髙麗風俗一卷唐西域記志見後書目十二卷貞觀中𤣥奘譯辨機撰𤣥奘徧歴西域一百三十八國因記其山川聚落風俗古跡之詳一云𤣥奘所歴一百一十國𫝊聞二十八國山川風俗釋氏事迹皆錄志地理有王元䇿中天竺國行記十卷程士章西域道里記三卷韋𢎞機西征記卷亡達奚通海南諸蕃行記一卷書目云西南海諸蕃行記一卷唐上元中唐州刺史達奚𢎞通撰𢎞通以大理司直使海外自赤土至䖍郍凡經三十六國略載其事北史後魏董琬等出鄯善招撫九國來貢獻者十六國琬等使還言西域自漢武時五十餘國後稍相并至太延中為十六國分其地為四域小渠長蓋以百數出西域本有二道後更為四出唐髙麗封域圖髙麗𫝊太宗已禽突厥頡利建武遣使者賀并上封域圖帝曰髙麗地止四郡隋末髙建武嗣王賈言志曰髙麗秘記曰不及九百年當有八十大將滅之唐貞觀方物錄貞觀二十一年三月十一日詔以逺夷各貢方物其草木雜物有異常者所司其詳錄焉按㑹要如葉護之蒲萄康國之金桃伽國之鬱金香伽羅之鉢羅花達國之佛土菜皆竒物也至如環王之大珠于闐之寶帶吐蕃之金鵝髙昌之錯刀又㑹要所不載者詳見朝貢書目有唐夷狄貢一卷始於北突厥終於師子國而以雜記附焉並唐貞觀以來諸國貢獻等事唐西域圖志志西域圖志六十卷西域平髙宗遣使分徃康國吐火羅訪其風俗物産畫圖以聞詔史官撰次許敬宗領之顯慶三年上㑹要顯慶三年五月九日以西域平遣使分徃康國吐火羅國等訪風俗物産及古今廢置畫圖以進令史官撰西域圖志書成學者稱其博西域𫝊同龍朔元年六月十七日吐火羅道置州縣使王名逺進西域圖記并請以十六國分置都督府州縣開元中安西都護蓋嘉惠撰西域記志釋氏類𤣥奘大唐西域記十二卷辨機西域記十二卷見上地理志天寶中𤣥宗問蕃國逺近王忠嗣以西域圖對纔十數國見後通典酈元注水經河之發源引禹記山經釋法顯遊天竺記釋氏西域記唐西域圖㑹要天寶六載四月二十五日上問諸蕃諸國逺近鴻臚卿王忠嗣上言曰謹按西域圖云云自陀拔恩單國至史國凡十有二陀拔恩單羅刹支都槃勃達河没政蘭湼滿沙蘭石國罽賔東术史國魏志云自虞暨周西戎有白環之獻東夷有肅慎之貢皆曠世而至及漢遣張騫使西域窮河源經歴諸國置都護以總領之然後西域之事具存史官得詳載焉張騫至大宛大月氏大夏康居而𫝊聞其旁大國五六具為天子言其地形所有語皆在西域𫝊吏士争言外國竒怪唐西陲要略西戎記志兵書類范𫝊正西陲要略三卷韋臯開復西南夷舊紀作蠻事狀十七卷㑹要云十卷貞元十四年十一月己未進雜𫝊記類裴肅平戎記五卷李德􅁉西蕃㑹盟記三卷西戎記二卷舊史范傳正遊西邊著西陲要略三卷舊紀貞元十四年十一月己未韋臯進開西南蠻事狀十卷叙開復南詔之由唐南詔地圖南詔𫝊貞元十年六月雲南王異牟尋獻地圖方物請復號南詔西域𫝊貞觀二十二年東天竺王送牛馬餽軍迦没路國獻異物并上地圖請老子象唐西極圖元稹進西北邊圖狀臣先畫聖唐西極圖三面草本並畢於思政殿奉㫖云諸家所進河隴圖勘驗皆有差異并檢尋近日烽鎮城堡不得令臣所畫稍須精詳臣别畫京西京北州鎮烽戍道路等圖一面纎毫必載尺寸無遺若邊上奏報煙塵陛下可坐觀處所猶慮閲覽有煩尋於古今圖籍之中纂撰京西京北圖經四卷所冀袵席之上欹枕而郡邑可觀游幸之時倚馬而山川盡在稹樂府云開逺門前萬里堠今來蹙到行原州去京五百而近何其逼天子縣内半没為荒陬田牟為入吐蕃使太和八年四月進入蕃行記圖一軸并圖經八卷唐戴斗諸蕃記書目唐幽州判官張建章撰一卷載朔漠羣蕃囘鶻等族類本末及道里逺近唐志同唐志張建章渤海國記三卷太和中李繁北荒君長錄三卷隋志北荒風俗記諸蕃風俗記各二卷失姓名王貽孫云武后時婦人始拜而不跪張建章渤海記言之唐雲南記南詔錄雲南志書目雲南志十卷咸通中樊綽撰以南蠻程塗山川城鎮名號諸蠻族類風俗物産纂為十門南詔錄三卷唐志卷同唐徐雲䖍撰乾符中南詔請通好邕州節度使辛讜遣雲䖍復命使囘錄所見聞上之㑹要元和十三年六月宰臣袁滋撰雲南紀五卷上之滋貞元十年使南詔舊史云雲南記記志雲南五卷乾符五年七月邕管節度辛讜遣從事徐雲䖍通好南詔凡水陸四十七程至善闡府遇驃信游獵尚去雲南十六程叙好而還進南詔錄三卷志竇滂雲南别錄一卷叙南蠻族類及風土雲南行記一卷樊綽蠻書十卷咸通蔡襲從事書目樊綽南蠻記十卷載南詔國史志辛怡顯至道雲南錄三卷皇朝至道初書所歴崇文目雲南風俗記一卷唐雲南行紀晁氏志韋齊休二卷長慶三年從韋審規使雲南紀徃來道里及見聞序謂雲南所以能為唐患者以開道越巂耳若自黎州之南清溪闗外盡斥棄之疆塲可以無虞不然憂未艾也及唐之亡禍果由此本朝棄巂州不守而蜀遂無邊患唐十道四蕃志見上六典戸部郎中掌天下州縣十道貢賦之差闗内道逺夷則控北蕃突厥之朝貢河南道逺夷則控海東新羅日本之貢獻河北控契丹奚靺鞨室韋隴右控西域胡戎江南控五溪之蠻劍南控西河羣蠻嶺南控百越林邑扶南之貢獻主客掌諸蕃朝聘之事凡四蕃之國經朝貢已後自相誅絶及有罪見滅者蓋三百餘國今所存者有七十餘國三姓葛邏祿至焉耆突騎施等七十國國史志韓郁十道四蕃引一卷舊紀元和二年四月庚辰嶺南節度使趙昌進瓊管儋振萬安六州六十二洞歸降圖史記正義引康氏外國𫝊宋膺異物志廣志裴矩西域記裴氏廣州記道書福地記漢地理志注師古引裴氏廣州記裴淵吳呂岱𫝊表分海南三郡為交州海東四郡為廣州注引王隱交廣記唐志交州以來外國𫝊一卷太平興國海外諸域圖三年正月丁未知廣州李符獻海外諸域圖嶺表花木圖各一八年八月丁酉辰州言溪錦溆富等四州蠻求内附輸租税詔令州長吏察其謡俗情偽并按視山川地形具圖來上天禧二年六月壬寅富州刺史向通漢以五溪地理圖來上乞留京師不允以為防禦使咸平六年五月乙卯知廣州凌䇿上海外諸蕃地理圖國史志崔峻華夷列國入貢圖二十卷吳育錄上真宗時通西域諸蕃事迹真宗命潘羅支攻殺李繼遷其子徳明遂歸順曽致堯西陲要紀十卷范旻邕管記三卷景德交州圖景德三年七月壬戌沿海安撫使邵曄上邕州至交州水陸路及控制宜州山川四圖上曰祖宗開疆若此廣大謹守而已安用勞民以貪無用之土如有叛亂不得不除爾未幾黎龍廷請入貢四年七月乙亥遣弟明昶入貢辛巳授以官爵邵曄𫝊上邕州至交州水陸路及宜州山川等四圖頗詳控制之要曄景德中充交趾安撫國信使改命為緣海安撫使許以便宜設方畧自詒書安南諭朝廷威德康定二年劉渙抵青唐得誓書與西州地圖以獻四月庚辰渙為秦隴招安蕃落使陳承韞撰南越記一卷乾道九年安南入貢客省承詔具風俗及貢物名數為安南土貢風俗一卷天禧雲南錄見錄類康定四夷龜鑑元年九月四日丙辰學士王堯臣等上渭州推官魏庭堅所撰四夷龜鑑三十卷殿中丞王琥獻平戎方略並送史館嘉祐契丹地圖祥符中知制誥王曽奉使撰契丹志一卷載經歴山川城郭嘉祐二年四月辛未通判黄州趙至忠上契丹地圖及北庭雜記十卷言北中事尤詳熙寧北道刋誤志熙寧中集賢校理王瓘承詔撰十五卷載遼使所歴州郡風土人物故實刋其謬誤北敵通好久嵗遣使賔餞以郡邑圖經脱誤不足以對敵人之問詔王瓘考正為一書及成凡十五卷賜名北道刋誤志契丹疆宇圖二卷地理圖一卷不知作者武珪自契丹還上廣平淀受禮圖嘉祐元年蕭扈來賀正言陽武寨天池廟侵北界詔館伴使王洙持圖道本末晁迥𫝊使契丹還奏北庭記陳堯叟著請盟錄三卷劉敞使契丹能知古北口松亭柳河道里之迂直以詰遼人敵驚顧羞恧吐實以告多識博極至此豈不足以外折四夷之姦心表中國之有人哉元豐五路對境圖五年六月己未上批先有西界對境圖西討以來奏報文字指畫山川道里多異同無以考證令逐路選委出界熟知賊境次第者差畫工同指說山川堡寨西賊聚兵處地名畫對境地圖以色别之上樞宻院候到取舊對境圖及軍興奏報比對考校繪為五路都對境圖崇寧雞林志書目雞林志二十卷崇寧中吳拭使髙麗撰載往囘事跡及一時詔誥又三十卷王雲撰其類有八自髙麗事類至海東僃檢雲從拭使髙麗雞林類事三卷崇寧初孫穆撰叙土風朝制方言附口宣刻石等文唐藝文志奉使髙麗記一卷淳熙三國史記元年五月二十九日明州進士沈忞上海東三國史記五十卷賜銀幣百付祕閣淳熙北邊僃對淳熙闕年程大昌在講筵孝宗問北方地里後因追記古來中華北狄樞紐相闗者條列推言之首以四海為之總統次載秦漢以來縁邊州郡凡北狄名號境土山川牙庭城障沙漠闗塞所在加以辨説為六卷李燾著南北攻守錄三十卷三國史記書目五十卷髙麗金富軾撰首載新羅次髙句麗次百濟有紀表海東三國通厯十二卷髙麗髙得相撰係以中朝歴代正朔唐志裴矩髙麗風俗一卷京輔古帝王建都包犧氏都陳神農氏都陳而别營于曲阜黄帝都於涿鹿少皥始自窮桑而遷都曲阜顓頊始自窮桑而徙邑商丘髙辛建都于亳以上見晉志堯都平陽舜都蒲坂禹都陽城自契至湯八遷湯始居亳周文王都豐武王都鎬書陶唐有此冀方孔安國曰冀州堯所都春秋疏堯治平陽舜治蒲坂禹治安邑三都相去各二百餘里俱在冀州後郡國志注汲冢書禹都陽城世本同陽前漢志翟夏禹國師古日本禹所受封括地志涿鹿故城在媯州上谷郡東南五十里本黄帝所都太康地里志城東一里有阪泉史記正義堯都平陽詩唐國徐才宗國都城記曰隋志三卷其北夏禹都穀梁疏冀州者天下之中州自唐虞及夏殷皆都焉是天子之常居鄒衍著書云九州之内名曰赤縣赤縣之畿從冀州而起明王奉若天道建邦設都堯都禹貢冀州既載注堯所都也先施賦役載於書地理志河東郡平陽應劭曰堯都也在平河之陽夏縣内殷邦畿三亳周畿内封畿王制凡四海之内九州州方千里州建百里之國三十七十里之國六十五十里之國百有二十凡二百一十國名山大澤不以封餘為附庸閒田八州州二百一十國注此大界方三千里三三而九方千里者九一為縣内餘八各立一州此殷制也周公制禮大界方七千里方千里者四十有九一為畿内餘四十八八州各有方千里者六一州封地五百里者四大國四百里者六三百里者十一次國方二百里者二十五及方百里者小國正義夏時萬國地餘三千里天子之縣内方百里之國九七十里之國二十一五十里之國六十三凡九十三國餘以祿士為閒田注縣内夏時天子所居州界名也殷曰畿殷頌𤣥鳥邦畿千里維民所止周亦曰畿畿内大國九者三公之田三致仕者副之為六餘三待封王之子弟次國卿之田六致仕者副之又三為三孤田餘六待封王之子弟小國大夫田二十七致仕副之為五十四餘九亦待封王子弟正義殷周稱畿唐虞稱服故云夏時畿内稱縣禹之初有四百國湯承夏制為九十三國穀梁寰内諸侯尹更始曰天子以千里為寰周書度邑因有夏之居即河南是也徐廣云在陽城後居陽翟皇甫謐云都平陽括地志云自禹至太康與唐虞皆不易都城詩殷武設都于禹之績商邑翼翼四方之極注京師也箋商邑之禮俗可則傚書立政三亳阪尹正義鄭𤣥以為三亳蓋湯舊都之民服文王者分為三邑東成臯南轘轅西降谷皇甫謐以為蒙為北亳穀熟為南亳偃師為西亳括地志宋州穀熟西南三十五里南亳故城即湯都北五十里蒙城為景亳湯所盟也因景山為名河南偃師為西亳帝嚳及湯所都盤庚所遷漢志偃師有尸鄉湯所都臣瓉曰湯居亳今濟隂薄縣亳邑故城在偃師縣西四十里帝嚳都亳故曰從先王居湯自南亳遷西亳仲丁遷敖滎陽故城河亶甲居相内黄東南十三里名殷城祖乙居耿龍門東南十二里盤庚渡河南居西亳是五遷也禮職方氏方千里曰王畿注同王制注大司馬方千里曰國畿詳見上縣士注距王城三百里至四百里曰縣大行人邦畿方千里大司徒日至之景尺有五寸謂之地中天地所合四時所交風雨所㑹隂陽所和乃建王國制其畿方千里而封之漢志雒邑與宗周通封畿為千里宋書沈懐文曰周制封畿漢置司𨽻商五邦盤庚上不常厥邑于今五邦注湯遷亳仲丁遷囂河亶甲居相祖乙居耿我往居亳凡五徙國都釋文馬氏云五邦謂商丘亳嚻相耿也周鎬京京師詩公劉京師之野于時處處後志美陽岐有周城太王所徙文王有聲作邑于豐箋徙都于豐宅是鎬京維龜正之武王成之豐豐邑在豐水西鎬京在豐水東十魚藻王在在鎬西括地志周豐宮在雍州鄠縣東三五里鎬在雍州南二十五里紀徐廣曰豐鎬相去二十五里皆在長安南帝王世文王受命徙都豐畢命宗周注鎬京也漢志注師古曰今昆明池北鎬陂是周官注成王雖作洛邑猶還西周漢志周公營雒邑以為在于土中諸侯蕃屏四方故曰京師周東都㑹諸侯洛師卜洛圖匠人營國洛誥乙卯朝至洛師我卜河朔黎水卜澗水東瀍水西惟洛食我又卜瀍水東亦惟洛食伻來以圖及獻卜孔氏曰澗東瀍西今河南城也即王城也瀍水東今洛陽也即下都也遣使以所卜地圖及吉兆來告成王水經注河南縣故郟鄏地京相璠曰郟山名鄏地邑公括地志王城一名河南城本郟鄏郟山名鄏邑名周新築在河南縣北九里苑内東北隅平王以下十二王都此敬王徙成周車攻宣王復㑹諸侯于東都王城也王平王定都于王城敬王徙居成周考以王城故地封其弟威公四牡龐龐駕言徂東東都洛邑也駕彼四牡四牡奕奕赤芾金舄㑹同有繹左傳成王城成周為東都書序東郊成周鄭注云天子之國五十里為近郊今河南洛陽相去則然君陳畢公尹殷民在下都之地命書皆謂之東郊史記武王謂周公曰自洛汭延于伊汭居易無固我南望三塗北望嶽鄙顧瞻有河粤瞻伊洛毋逺天室營周居于洛邑太史公曰學者多稱周伐紂居洛邑其實不然武王營之成王使召公卜之居九鼎焉而復都豐鎬至平王乃遷洛婁敬曰周公營成周都雒以為此天下中諸侯四方納貢職道里鈞帝王世紀后稷始封邰公劉徙邑於豳太王徙邑於岐山之陽南有周原故始改號曰周王季徙程書序曰維周王季宅程是也文王徙都於豐武王營洛邑而定鼎焉今洛陽西南洛水之北有鼎中觀是也周公相成王以豐鎬偏處西方貢不均乃使召公卜居洛水之陽以即土中故援神契曰八方之廣周洛之中遂築新邑營定九鼎以為王之東都公羊傳曰王城者何東周也成王既卜營洛邑建明堂朝諸侯復還豐鎬書序曰還歸在豐世本曰懿王居犬丘平王徙居洛洛誥所謂新邑也敬王東居成周遂徙都至赧徙居西周白虎通夏為夏邑殷為商邑周為京師通鑑外紀七年武王作邑于鎬成王定鼎郟鄏周公至洛營築是為王城郛方七十里曰此天地之中道里均也周公又營成周遷頑民隋李德林𫝊謹案大𫝊周公四年建侯衞五年營成周六年制禮作樂輿地志成周在城東故曰東周博物志周在中樞三河之分風雨所起四險之國後漢志雒陽摯虞曰古之周南周時號成周公羊傳東周也何休日周道始成王之所都也帝王世紀曰城東西六里十一步南北九里一百步晉元康地道記曰城内南北九里七十步東西六里十步為地三百頃十二畆三十六步河南周公所城雒邑也春秋時謂之王城鄭𤣥詩譜曰周公攝政五年成王宅雒邑使召公先相宅既成謂之王城博物記日王城方七百二十丈郛方七十里南望雒水北至陜山地道記曰去雒城四十里東城門名鼎門北城門名乾祭呂氏曰平王東遷之後所謂西周者豐鎬也東周者東都也威烈王之後所謂西周者河南也東周者洛陽也王城非天子時㑹諸侯則虛之下都則保釐大臣所居書之言洛皆謂之成周左氏第言子朝既逐王入于成周敬王請城成周之辭亦謂成王合諸侯城成周以為東都則成周者洛邑之總名周官辨方正位體國經野考工記匠人建國水地置􅈏眡景匠人營國方九里旁三門國中九經九緯經涂九軌左祖右社靣朝後市營謂丈尺其大小室中度以几堂上度以筵明堂度九尺之筵宮中度以尋野度以步涂度以軌内有九室九嬪居之路寢之裏外有九室九卿朝焉路門之表九分其國以為九分九卿治之王宮門阿之制五雉宮隅之制七雉城隅之制九雉經涂九軌環涂七軌野涂五軌門阿之制以為都城之制宮隅之制以為諸侯之城制環涂以為諸侯經涂野涂以為都經涂易氏曰六卿分六職而三孤無正職安得分九卿而且言九分其國考工非成周之全書取其營國之大槩可也諸侯之制降於天子都鄙之制降於諸侯而降殺以兩焉都鄙在王畿之中近君者也雖有八命六命四命之不同而其制例以五諸侯在王畿之外逺君者也雖有九命七命五命之不同而其制例以七然亦異代之制若成周之制各眡其命之數建國建城於始也營國營宮室於後也方九里乃上公之制非天子之制或者禹卑宮室而九里其夏制乎量人營國城郭量市朝道巷門渠造都邑亦如之下士二人掌建國之灋注若匠人職云文王有聲築城伊淢箋謂方十里曰淢文王築城豐邑其方十里與淢同其制大於諸侯小於天子言小於天子則知天子為十二里大於諸侯則知上公為九里周三亳書立政三亳阪尹注亳人之歸文王者三所為之立監疏鄭𤣥以三亳阪尹共為一事云湯舊都之民服文王者分為三邑其長居險故言阪尹盖東成臯南轘轅西降谷也皇甫謐以為三處之地皆名亳蒙為北亳穀熟為南亳偃師為西亳見上周京白虎通詩云命此文王于周于京此言文王誅伐故改號為周易邑為京也漢都長安髙紀五年二月甲午即皇帝位于氾水之陽帝乃西都洛陽夏五月戌卒婁敬求見說上曰陛下取天下與周異而都雒陽不便不如入闗據秦之固上以問張良良因勸上是日車駕西都長安注著是日者言從善之速也長安本秦之鄉名髙祖作都焉拜婁敬為奉春君後九月徙諸侯于闗中治長樂宮七年二月至長安蕭何治未央宮立東闕北闕前殿武庫太倉自櫟陽徙都長安九年十一月徙齊楚大族昭屈景懐田氏五姓闗中與利田宅婁敬𫝊漢五年說上曰陛下都雒陽豈欲與周室比哉上曰然敬曰陛下取天下與周異秦地被山帶河四塞以為固卒然有急百萬之衆可具因秦之故資甚美膏腴之地此所謂天府上疑未能决及留侯明言入闗便即日駕西都闗中西都賦仰悟東井之精俯協河圖之靈奉春建䇿留侯演成天人合應以發皇明乃眷西顧實惟作京史六國表或曰東方物所始生西方物之成孰夫作事者必于東南收功實者常於西北故禹興於西羌湯起於亳周之王也以豐鎬伐殷秦之帝用雍州興漢之興自蜀漢漢長安四市九市五都唐京都四市見太府寺表京兆有長安市令丞馮翊有長安四市長丞黄圖直市在富平津西南二十五里秦文公造物無二價故有直市又有柳市東市西市有當市樓有令舍以察商賈貿易三輔都尉掌之王尊尹京兆鉏耘豪彊長安宿豪東市賈萭城西萬章皆案誅之惠紀六年六月起長安西市第五倫領長安市西都賦九市開場貨别隧分注漢宮闕疏長安立九市六在道西三在道東各方二百六十六步廟記云長安市有九凡四里為一市西京賦廣開九市通闤帶闠旗亭五重俯察百隧周制大胥今也惟尉瓌貨方至鳥集鱗萃三輔舊事長安城中八街九陌閭里一百六十室居櫛比門巷修直食貨志莽於長安及五都西都賦五都之貨殖立五均官更名長安東西市令及洛陽邯鄲臨甾宛成都市長皆為五均司市稱師東市稱京西市稱畿洛陽稱中餘四都各用東西南北為稱皆置交易丞五人錢府丞一人貨殖𫝊莽以王孫卿為京師市師漢司東市令也司馬毋懌為漢市長漢三輔地理志京兆尹故秦内史髙帝元年屬塞國二年更為渭南郡九年復為内史本秦京師為内史武帝建元六年分為左右内史師古日表云景帝分置據史記知志誤太初元年更為京兆尹縣十二長安至杜陵左馮翊故秦内史髙元年屬塞二年更名河上郡九年復為内史武建元六年分為左内史太初元年更名左馮翊縣二十四髙陵至雲陽左扶風故秦内史髙元年屬雍國二年更為中地郡九年復為内史武建元六年分為右内史太初元年更名主爵都尉為右扶風縣二十一渭城至武功光平元始四年分京師置前輝後丞烈二郡表内史周官非治民秦因之掌治京師景帝二年分置左右内史武太初元年更名京兆尹左内史更名左馮翊主爵中尉秦官掌列侯景中六年更名都尉武太初元年更名右扶風治内史地與左馮翊京兆尹是為三輔服䖍云皆治在長安城中黄圖云京兆在尚冠前街東入故中尉府馮翊在太上皇廟西入右扶風在夕陰街北入故主爵府屬官有都水鐵官元鼎四年更置三輔都尉丞各一人元帝建昭三年令三輔都尉秩皆二千石永光六年分諸陵邑屬三輔六典三輔縣丞尉用他郡人京兆馮翊扶風皆秩二千石丞六百石司𨽻校尉征和四年初置察三輔黄圖曰太初元年以渭城以西屬右扶風長安以東屬京兆尹長陵以北屬左馮翊以輔京師謂之三輔内史始於周苛慶表七人石左内史景元年鼂錯及公孫𢎞兒寛自錯至咸宣七人右内史建元四年鄭當時舒汲黯番係至王温九人雖周之六鄉六卿分治之秦止以内史治畿内漢因之失六卿分治之意然内史猶廷臣也至太初分三輔之後去大郡無幾判然與朝廷二體矣京兆尹表四十二人始太初元年無忌至元始五年武襄正京兆郡國首宗劉德行尹事前有趙張後有三王進雋不疑𫝊何武孫寳翟方張敞京兆典京師長安中浩穰於三輔尤為劇郡國二千石以髙第入守及為真久不過二三年近者數月一嵗敞為京兆九嵗鳳後漢延篤邊左馮翊表三十六人始太初殷周王蕭望之韓延夀馮野薛宣朱博右扶風表三十三人始太初咸宣蕭尹翁歸鄭𢎞彭宣王訢育龔勝東方朔𫝊詔中尉左右内史表屬縣草田注師古日時未為京兆馮翊扶風朔諫曰三輔之地盡可以為苑師古曰中尉及左右内史為三輔非必謂京兆馮翊扶風也漢興去三河之地止霸産以西都涇渭之南此所謂天下陸海之地元紀建昭三年夏令三輔都尉大郡都尉秩皆二千石西京賦封畿千里統以京尹景中五年詔三輔舉不如令者時未置三輔郡國志注潘岳闗中記曰三輔舊治長安城中長吏各在其縣治民光武東都之後扶風出治槐里馮翊出治髙陵百官志後漢都雒陽不改三輔之號但減其秩與太守同後志漢初都長安皆秩中二千石謂之三輔趙廣漢𫝊左馮翊右扶風皆治長安中廣漢曰亂吾治者常二輔也今得兼治之直差易耳尹翁歸𫝊京師畏其威嚴盜賊課常為三輔最右扶風薛宣𫝊威德並行盜賊什分三輔之一左馮翊張敞拜膠東相請吏追捕有功效者比三輔尤異元延中尹賞為鄭令以三輔髙第選守長安令馬宫舉陳遵能治三輔劇縣為郁夷令髙紀七年二月自櫟陽徙都長安史記大事記髙帝六年更命咸陽曰長安師古曰長安本秦之鄉名史秦紀獻公城櫟陽徐廣云徙都之今萬年也括地志云櫟陽故城一名萬年城在雍州東北百二十里櫟陽漢七年分城内為萬年縣隋開皇三年遷都於龍首川今京城也改萬年為大興縣唐武徳元年又改萬年在州東七里三輔之制始於太初景帝詔三輔舉不如令表亦云元鼎四年置三輔都尉則已有三輔之名三輔都尉置於元鼎東方朔傳乃云建元三年右輔都尉徼循長楊以東則已有右輔都尉之官豈是時止云左右内史史氏省文以後制書之耶太初始改官名咸宣為右扶風京兆無忌馮翊殷周前有趙張後有三王得人之盛也尹翁歸緩於小弱急於豪強循吏之政也劉徳每行京兆尹事多所平反慈惠之師也陳萬年鄭𢎞皆以守相髙第野王則以治行之髙朝廷用人之法也言其薦賢則馮翊宋畸舉黄霸賢良擢揚州刺史言其考功則以望之守平原日淺復試之以治民任用儒者則嚴彭祖以公羊之學自河南守髙第為馮翊優擢材能則朱博先為馮翊後為京兆學以從政臨事不惑有若雋不疑崇教養善威德並行有若薛宣鄠賊阻山數月平定政尚威嚴有治辨名有若蕭育尹立長安游徼獄吏百石馮翊卒史二百石吏追捕有功調補縣令此謂三輔尤異在他郡莫能儗焉長安於三輔為尤劇郡國二千石以髙第入守而後為真此謂浩穰雖馮扶莫得並焉其任用則尹賞之為鄭令以三輔髙第選守長安令其信必賞罰則薛宣條髙陵櫟陽二令之辠皆解印綬去東都居是職者始則王丹張湛郭丹盖延次則鄭衆左馮翊郅夀京兆尹王堂右扶風陳禪左馮翊陳龜京兆尹楊秉要以河南尹為重詩曰商邑翼翼四方之極禮俗翼翼然四方所則傚王化所以自京師始也周人合公卿大夫之賢通治六鄉記曰古之欲明明德於天下者先治其國夫王畿固天子所自治也漢以來任京兆尹然而智進則德退術勝則道微呂氏春秋古之王者擇天下之中而立國擇國之中而立宮擇宮之中而立廟王制正義周禮太宰云施典于邦國建其牧立其監是畿外邦國有牧畿内不置漢洛邑河南尹漢京後紀建武元年十月癸丑車駕入洛陽遂定都見南宮後志河南尹主京都特奉朝請秩二千石漢初三輔秩中二千石中興更河南為尹三輔不改其號但減其秩注河南尹有案獄仁恕掾尹魯恭𫝊拜中牟令建初七年郡國螟不入中牟河南袁安使仁恕掾肥親徃亷之注屬河南尹見漢官儀翼奉𫝊願徙都成周左據成臯右阻黽池前鄉崧髙後介大河東都賦増周舊修洛邑光漢京于諸夏河南尹歐陽歙光即位王梁五年范遷永平五年以官為司徒郭賀以清靜稱袁安肅宗時言魯恭三異召伯春元和二年宋嵩章和時張酺和帝時楊秉李膺杜宻劉祐羊陟歴歴維見文選天以日月為綱地以四海為紀九土星分萬國錯跱崤函有帝皇之宅河洛為王者之里漢六輔兒寛𫝊遷左内史奏開六輔渠注韋昭曰六輔謂京兆馮翊扶風河東河南河内也師古曰非也文選任昉云六輔殊風五方異俗注引韋昭注漢八都西京賦漢氏初都在渭之涘量徑輪考廣袤經城洫營郭郛取殊裁於八都豈啟度於往舊薛綜注八都猶八方也乃覽秦制跨周法魏都賦畫雍豫之居寫八都之宇漢南都張衡南都賦於顯樂都既麗且康陪京之南居漢之陽注南都在南陽光武舊里以置都郡城周三十六里摰虞曰南陽郡治宛在京之南故曰南都戴逵南都賦圖魏五都魏志注文帝黄初二年正月改長安譙許昌壬午改許縣為許昌縣鄴洛陽為五都立石表西界宜陽北循太行東北界陽平南循魯陽東界郯為中都之地水經注魏因漢祚復都洛陽以譙為先人本國許昌為漢之所居長安為西京之遺迹鄴為王業之本基故號五都晉丹陽尹宋志丹陽尹秦鄣郡治今吳興之故鄣縣漢初屬吳國後屬江都國元封二年為丹陽郡治今宣城之宛陵縣晉武帝太康二年分丹陽為宣城郡治宛陵而丹陽移治建業元帝太興元年改為尹領縣八晉平吳治建業王導曰建康古之金陵舊為帝里又孫仲謀劉𤣥德俱言王者之宅温太真劉真長或功銘鼎彛或德標素尚唐志丹陽尹𫝊十卷梁元帝撰舊唐志分吳㑹丹陽三郡記二卷庾闡􅀭都賦隋新都文帝開皇初嫌長安城制度狹小又宮内多妖異納言蘇威勸帝遷都帝以初受命難之夜與威及左僕射髙熲共議明旦通直散騎庾季才奏曰臣仰觀元象俯察圖記必有遷都之事且營此城將八百嵗水皆鹹鹵不甚宜人願陛下恊天人之心為遷徙之計帝愕然謂熲與威曰是何神也太師李穆亦上表請遷都帝省表曰天道聰明已有證應太師人望復抗此請無不可矣二年六月丙申詔熲等創造新都於龍首山以太子庶子宇文愷有巧思領營新都副監十二月丙子名新都曰大興城三年春正月庚子將入新都大赦天下三月丙辰入新都京師醴泉出詔曰龍首山川原秀麗卉物滋阜卜食相土宜建都邑十三年二月丙子詔營仁夀宫大業元年三月丁未營建東京唐三都五都六典京兆河南太原為三都志上都初曰京師天寶元年曰西京㑹要開元元年十二月三日改為京兆府稱西京張暐為尹至德二載曰中京十二月十五日上元二年復曰西京九月二十一日肅宗元年曰上都建卯月一日東都隋置武德四年廢其年十一月改東都六年九月改洛州貞觀六年號洛陽宮顯慶二年曰東都㑹要二年十二月十三日丁卯光宅元年曰神都九月五日神龍元年復曰東都二月五日天寶元年曰東京二月二十日河開元元年十二月一日改為南府李傑為尹上元元年罷京九月二十日肅宗元年復為東都建卯月河中府本蒲州開元八年置中都為府㑹要九年正月丙辰改己姜師度為尹六月三日卯罷都復為州乾元三年三月二十三日復為府蕭華為尹元年建卯月一日號為中都元和三年三月復為府北都天授元年置㑹要長夀元年九月七日置改并州為太原府神龍元年罷二月四日開元十一年復置正月二十日置韋湊為尹次紀開元十一年正月辛卯并州改為北都天寶元年正月二十日曰北京上元二年罷九月二十一日肅宗元年復為北都志開元十一年為府與㑹要異陳京為北都賦江陵府本荆州肅宗上元元年號南都為府九月七日改吕諲為尹二年罷都是年又號南都尋罷興元府本梁州興元元年為府六月十四日嚴震為尹成都府益州至德二載十二月十五日曰南京為府裴冕為尹上元元年九月七日罷京鳳翔府本岐州至德元載七月二十七日更郡曰鳳翔二載十二月十五日號西京為府李華為尹上元二年九月罷京元年建卯月一日曰西都末幾復罷華州乾寧四年曰興德府光化三年復為州㑹要光化元年六月升府韓建為尹肅宗至德二載十二月戊午以蜀郡為南京鳳翔為西京西京為中京上元元年九月甲午置南都於荆州以為江陵府寶應元年建卯月辛亥朔詔曰五都之號其來自久宜以京兆為上都河南為東都鳳翔為西都江陵為南都太原為北都開元十一年并州置北都詔云國家龍躍晉水鳳翔太原猶成湯之居亳有周之興岐昔堯理唐郊式建丹陵之地漢居洛邑更表南陽之都吕諲𫝊建請荆州置南都於是更號江陵府以諲為尹置永平軍萬人遏吳蜀之衝有自至德以來處方靣數十人諲最名舊紀大厯五年八月辛卯宰臣請置中都於河中府不報唐四輔㑹要開元中定天下州府以近畿之州為四輔同華岐蒲是也六典同志華州闗内華陰郡上輔縣四府二十有鎮國軍肅宗上元元年置甫董晉李絳楊瑒崔隠𢎞禮髙郢同州馮翊郡上輔縣八府二十六姚崇蘇瓌呂元膺岐州扶風郡上輔至德二載為鳳翔府縣九府十三許景先薛登李朝隠蒲州河東河東郡上輔開元八年為河中府縣十三府三十三有耀德軍乾元二年置裴寛韋安石抗陸象先十其餘為六雄十望𦂳開元二十一年分京畿京兆華陰扶風馮翊新安上洛安康等是也都畿河南陜郡滎陽河内臨汝等是也太和元年正月韋處厚奏復置六雄十望十𦂳三十四州别駕後入𦂳者多不復具列六雄陜懐鄭汴魏絳十望虢汝汾晉宋許滑衞相洛見六典唐兩京書目韋述兩京新記五卷開元中撰述謂兩京創自隋代至開元百有餘年乃載其廢置遷徙之由西京始於開皇東都起於大業唐志馬温鄴都故事二卷書目云載曹魏以來鄴中宮殿遺跡及其興廢元和志後魏太和十七年經始洛京十九年九月新都始立韓顯宗言昔周居洛邑猶存宗周漢遷東都京兆置尹朱朴言襄鄧實惟中原人心質良去秦咫尺而上有洛為之限永無夷狄侵軼之虞此建都之極選也宋朝四京皇祐京畿東京開封唐汴州梁為東京開平元年四月二十三日後唐罷晉復為東京天福三年十月建隆二年七月壬申以太宗為開封尹興國元年十月庚申廷美為尹雍熙二年十月甲辰陳王元僖淳化五年九月壬申襄王真宗為尹宣和七年十一月戊午皇太子為牧皇祐五年十二月壬戌用賈昌朝議以曹陳鄭許滑為京畿路為輔郡置漕臣王䞇為之楊大雅作皇畿賦楊億作東西京賦周邦彦作汴都賦宣和四年六月二十九日李長民上廣汴都賦宋敏求撰東京記二卷載宮闕里巷事跡紹興中環中撰汴都名實志三卷西京河南唐東都改為京梁為西都晉為西京開寶八年十月十九日命王仁珪等修洛陽宮明年四月至洛宮室合九千九百九十餘區元豐中王正倫撰古今洛城事類二卷南京應天宋州景德三年二月甲申升應天府祥符七年正月丙辰升南京正殿曰歸德御製南京頌詔曰洪惟蓺祖歴試是邦同豳土之始基應舂陵之王氣稽唐氏晉陽之制肇建新都先是咸平四年八月劉蒙叟上宋都賦王仲旉南都賦曰祥符之際觀紫氣於芒山辨白水於南陽於是建南京陪上國對列乎浚郊相輝乎洛宅頒慶洞開歸德峻峙旁立原廟殿實有三祥符七年二月二日名門曰崇禮雙門曰祥輝外西門曰廻鑾三月十三日名東門曰昭仁延和西曰順成北曰靖安隔門曰承慶正門以東封囘賜赦觀酺賜名重熙頒慶樓漢啟南陽之都唐重北門之館並資壯麗以示威神北京大名唐魏博節度後唐同光元年四月為東京三年三月改鄴都周天雄軍慶厯二年五月戊午升大名府為北京正殿日班瑞詔曰廣萬盈之懿兆冠千里之上腴隠然北門壯我中夏六月戊子任中師為修建使戊戌蘇紳副之七月癸丑名行宮門曰順豫三年二月甲辰名便殿曰靖方熙寧八年十二月九日賜北京内外城門名左右四廂凡二十三坊劉敞作魏京詩崇寧四年七月丁巳京畿四面置輔郡以澶鄭許三州升襄邑為拱州是為四輔景祐元年三月升鄭州節鎮詔曰周制九畿蓋尊寰内漢設二部實陪京師相宅浚都夾右滎圃爰稽扶翊之義參領防遏之兵皇祐五年十二月壬戌以曹陳許鄭滑州為輔郡𨽻畿内置京畿轉運使至和二年十月己丑詔京畿毋領輔郡范仲淹謂洛陽險固而汴為四戰之地太平宜都汴即有事必都洛陽可漸廣儲蓄繕治宫室紹興行都建炎中駐驆臨安三年二月丙戌次杭州紹興八年三月詔復還二年正月以杭州為臨安府十五年十一月十一日髙衮上三都賦十七年十二月十三日施諤上行都賦乾道七年四月甲子皇太子尹臨安辛未宣制九年三月乙丑請解罷専意講學從之髙宗御製中和堂詩曰六龍轉淮海萬騎臨吳津王者本無外駕言蘇逺民續書目有臨安志十五卷紹興臨安定都紹興四年將還臨安始命有司建太廟十二年作太社太稷皇后廟都亭驛太學十三年築圜丘景靈宮髙禖壇祕書省十五年作内中神御殿十六年廣太廟建武學十七年作玉津園太一宮萬夀觀十八年築九宮貴神壇十九年建太廟齋殿二十年作玉牒所二十二年作左藏庫南省倉二十五年建執政府二十六年築兩相第太醫局二十七年建尚書六府凡定都二十年而郊廟宮省始僃玉海卷十六
