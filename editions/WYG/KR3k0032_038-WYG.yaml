body:
  text: 玉海卷三十八宋王應麟撰藝文詩書曰詩言志歌詠言哀樂之心感而歌詠之聲發誦其言謂之詩詠其聲謂之歌故古有采詩之官王者所以觀風俗知得失自考正也孔子純取周詩上采殷下取魯凡三百五篇遭秦而全者以其諷誦不獨在竹帛故也漢興魯申公為詩訓故而齊轅固燕韓嬰皆為之𫝊或取春秋采雜説咸非其本義與不得已皆列於學官漢初又有趙人毛萇善詩自云子夏所𫝊作詁訓𫝊是為毛詩古學而未得立後漢有九江謝曼卿善毛詩又為之訓東海衛宏受學於曼卿鄭衆賈逵馬融並作毛詩𫝊鄭𤣥作箋齊詩魏代已亡魯詩亡於西晉韓詩雖存無𫝊之者惟毛詩鄭箋至今獨立周六詩春官大師教六詩風賦比興雅頌以六徳為本六律為音瞽矇掌諷誦詩掌九徳六詩之歌以役大師疏風雅頌是詩之名也就三者之中有比賦興故總謂之六詩正義六藝論云鄭𤣥著唐虞始造其初虞之君臣迭相賡和始見於書至周分為六詩孔子純取周詩上采商下取魯凡三百五篇詩三百十一篇亡者六篇王自文至頃二十世澤竭而詩不作内則説負子之禮云詩負之註云詩之言承也春秋説題辭云詩之為言志也詩緯含神霧云詩者持也然則詩有三訓書詩言志歌永言工以納言時而颺之注掌誦詩以納諫王制天子五年一廵狩命大師陳詩觀民風大戴禮投壺篇凡雅二十六篇其八篇可歌鹿鳴貍首鵲巢采蘩采蘋伐檀白駒騶虞八篇廢不可歌七篇商齊可歌三篇間歌左𫝊三類注風雅頌也疏一國之事諸侯之詩為風天下之事天子之詩為雅成功告神為頌上林賦揜羣雅注張揖云詩小雅之材七十四人大雅之材三十一人漢六家詩三家詩元王詩傳韓詩翼要藝文志凡詩六家四百一十六卷詩經二十八卷魯齊韓三家應劭曰申公作魯詩后蒼作齊詩韓嬰作韓詩魯志魯故二十五卷師古曰故者通其指義也他皆類此今流俗毛詩改故為詁字失真耳魯説二十八卷漢興魯申公為詩訓故魯最為近之儒林𫝊言詩於魯則申培公申公與楚元王交俱事浮丘伯孫卿門人申公以詩經為訓故以教亡𫝊疑者則闕弗𫝊弟子為博士十餘人瑕丘江公盡能𫝊之徒衆最盛及魯許生免中徐公韋賢治詩事博士大江公即瑕丘江公及許生王式事徐公及許生式以三百五篇諌張長安先事式唐長賔褚少孫亦來事式問經數篇式謝曰聞之於師具是矣自潤色之不肯復授有韋氏張唐褚氏之學博士江公世為魯詩宗列𫝊楚元王與申公俱受詩浮丘伯文帝聞申公為詩最精以為博士申公始為詩𫝊號魯詩元王亦次詩𫝊號元王詩薛廣徳以魯詩教授龔勝舎師事焉為博士論石渠後𫝊高詡曾祖嘉以魯詩授元帝至詡世𫝊之為愽士李昺魯㳟李業習魯詩魯丕以魯詩教授包咸魏應受魯詩陳重雷義俱學魯詩隋志小學有一字石經魯詩六卷齊志后氏蒼故二十卷𫝊三十九卷孫氏故二十七卷𫝊二十八卷雜記十八巻𫝊轅固治詩孝景時為愽士諸齊以詩顯貴皆固弟子夏侯始昌最明后蒼事始昌蒼授翼奉蕭望之匡衡衡授師丹伏理由是有翼匡師伏之學蕭望之治齊詩事后蒼後𫝊伏湛父理以詩授成帝别自名學湛𫝊父業湛弟黯明齊詩改定章句作説解九篇黯章句繁多子㳟省減浮辭定為二十萬餘言景鸞理齊詩作詩解文句馬援受齊詩師事潁川蒲昌韓志韓故三十六卷内𫝊四卷外𫝊六卷説四十一卷隋唐止存外傳析為十篇唐志韓嬰注二十二卷𫝊韓嬰燕人孝文時博士推詩人之意作内外𫝊數萬言頗與齊魯殊然歸一也燕趙間言詩者由韓生河内趙子事韓生授蔡誼誼授食子公與王吉吉授長孫順由是有王食長孫之學蔡義明經詔求能為韓詩者徵待詔願賜清閒之燕得盡精思於前上召見義説詩甚説之進授昭帝後𫝊郅惲理韓詩授皇太子劉寛明韓詩外𫝊杜撫受業於薛漢定韓詩章句其所作詩題約義通學者𫝊之曰杜君法薛漢世習韓詩父子以章句著名召馴習韓詩建初中侍講帝嘉其義學趙􅁮受韓詩著詩細李恂習韓詩教授諸生常數百人鄭𤣥從張㳟祖受韓詩張文通習韓詩作章句唐檀公沙穆夏侯㳟習韓詩隋志韓詩二十二卷薛氏章句文選注多引薛君章句韓詩翼要十卷漢侯苞撰毛志毛詩二十九卷故訓𫝊三十卷𫝊毛公趙人治詩後漢書隋志云毛萇正義小毛公名萇為河間獻王博士獻王修學好古學舉六藝立毛氏詩左氏春秋博士毛公授同國貫長卿長卿授解延年延年授徐敖敖授陳俠由是言毛詩本之徐敖陳俠傳謝曼卿曼卿為訓贊平帝立毛詩鄭氏詩譜云魯人大毛公為詁訓傳獻王得而獻之以小毛公為博士序録子夏授曾申草木疏云申公曾申授李克李克授孟仲子孟仲子授根牟子根牟子授孫卿孫卿傳毛亨亨授毛萇釋文吳徐整曰子夏授高行子高行子授薛倉子薛倉子授帛妙子帛妙子授河間大毛公為故訓𫝊授趙人小毛公後紀章帝建初八年十二月戊申詔選高才生受毛詩安帝延光二年正月選三署郎及吏人能通毛詩者一人後𫝊鄭衆賈逵𫝊毛詩馬融作毛詩𫝊又注十卷鄭𤣥作箋衛宏作毛詩序孔僖世𫝊毛詩隋志毛詩二十卷漢河間太守毛萇𫝊鄭氏箋唐志毛萇𫝊十卷文選注引毛萇詩傳孔氏曰漢初為𫝊訓者皆與經别行故石經書公羊𫝊並無經文毛為故訓亦與經别至馬融注周禮欲省學者兩讀故具載本文詩引經附傳不知誰為之二十九卷不知併何卷也志魯申公為詩訓故齊轅固燕韓生皆為𫝊或取春秋采雜說皆非本義魯最為近之三家列於學官毛公之學自謂子夏所𫝊河間獻王好之未得立隋志齊詩魏代已亡魯詩亡於西晉韓詩存無𫝊者毛詩鄭箋獨立經典序録齊詩久亡魯詩不過江東釋文鄭𤣥作箋申明毛義難三家於是三家遂廢漢詩博士後儒林傳魯齊韓三家立博士毛詩未得立河間獻王立毛詩博士時劉歆哀帝建立魯前傳文帝聞申公為詩最精以為博士弟子為博士十餘人江公世為魯詩宗唐生褚生應博士弟子選詣博士摳衣登堂頌禮甚嚴試誦説有法問何師曰事王式諸博士共薦式詔除式為博士薛廣徳事式以博士論石渠張生唐生褚生皆博士張生授許晏為博士後𫝊高詡建武中召為博士魏應建武初詣博士受業李業師博士許晃齊前𫝊轅固孝景時博士后蒼為博士蕭望之事后蒼復事同學博士白竒師丹事匡衡為博士後𫝊伏恭太常試經第一拜博士韓前𫝊韓嬰孝文時博士其孫商為博士趙子授蔡誼誼授食子公為博士王吉授長孫順為博士後傳薛漢建武初為博士楊仁舉孝亷太常上仁經中博士仁自以年未五十不應舊科上府辭選顯宗詔補北宮衛士令劉歆𫝊文帝時詩始萌牙衆書皆諸子𫝊説猶廣立於學官為置博士至武帝然後鄒魯梁趙頗有詩禮春秋先師皆起建元間一人不能獨盡其經或為雅或為頌儒林𫝊賛平帝時立毛詩漢齊魯韓毛詩異同詳見詩攷賈逵𫝊肅宗令撰齊魯韓詩與毛氏異同隋志梁有毛詩雜議難十卷侍中賈逵撰亡晉孫毓毛詩異同評十卷陳統難孫氏四卷毛詩表隠二卷晉楊乂毛詩辨異三卷異義二卷崔靈恩集注採三家之本正義樂緯動聲儀詩緯含神務尚書璿璣鈐皆云三百五篇者漢世毛學不行三家不見詩序不知六篇亡失謂其惟有三百五篇齊韓之徒以詩經為章句與毛異非有壁中舊本可慿毛氏字與三家異者動以百數毛無破字之理正義序曰漢氏之初詩分為四申公騰芳於䣕郢毛氏光價於河間貫長卿𫝊之於前鄭康成箋之於後魏志注隗禧説齊韓魯毛四家義不復執文有如諷誦杜欽𫝊佩玉晏鳴闗雎歎之注此魯詩也明紀詔應門失守闗雎刺世注引薛君韓詩章句揚子周康之時頌聲作乎下關雎作乎上習治也習治則傷始亂關雎正風之首而齊魯韓三家以為康王政衰之詩陳忠𫝊詩云以雅以南韎任朱離注毛詩無之蓋見齊魯之詩也今亡正義緇衣引詩都人士首章鄭注此章毛氏有之三家則亡今韓詩實無此首章服䖍以行歸于周為逸詩鄭於中候握河紀注云昭王之時鼓鐘之時所為作者依三家為説也生民疏異義齊魯韓説釋文般詩於繹思盖齊魯韓之文毛詩無此句今毛詩有者衍文也崔氏集注取以繼其末禮記憲憲令徳疏齊魯韓詩又郊特牲注為下國畷郵疏云引齊魯韓詩也孔子閒居注讀湯齊為湯躋疏云三家詩周禮注吉圭惟饎疏鄭從三家詩晁説之詩序論曰論四篇齊魯韓三家之詩以關雎葛覃巻耳鵲巢采蘩采蘋騶虞鹿鳴四牡皇皇者華之類皆為康王詩王風為魯詩鼓鐘為昭王詩異同不可悉舉魯詩魯訓楊賜傳康王一朝晏起關雎見㡬而作注此事見魯詩今亡失班固𫝊注文選注同魯詩𫝊曰古有梁鄒者天子之田賈誼曰騶者天子之囿虞者囿之司獸者也又以木𤓰為下報上輿服志注魯訓曰和設軾者也鸞設衡者也漢書注中冓之言魯詩以為夜也魯詩小雅十月之交篇此日而食于何不臧又曰閻妻扇方處詩疏魯詩之義以阮徂共皆為國名異義詩魯説殷中宗周成宣王皆以時毁禮記疏魯詩素衣為綃周禮疏異義今詩韓魯説騶虞天子掌鳥獸官公羊𫝊注魯詩𫝊曰天子食日舉樂説文魯詩説鼐小鼎坊記注先君之思以畜寡人此衛夫人定姜作此是魯詩正義鄭志云為記注時就盧君後得毛𫝊乃改之爾雅注魯詩云傷如之何齊詩翼奉𫝊竊學齊詩聞五際之要十月之交篇注孟康曰詩内𫝊曰五際卯酉午戌亥也隂陽終始際㑹之嵗於此則有變改之政詩正義案詩緯汎厯樞云大明在亥水始也四牡在寅木始也嘉魚在巳火始也鴻鴈在申金始也鄭作六藝論引春秋緯演孔圖云詩含五際六情汎厯樞云午亥之際為革命卯酉之際為改正辰在天門出入候聴卯天保也酉祈父也午采芑也亥大明也然則亥為革命一際也亥又為天門出入候聴二際也卯為隂陽交際三際也午為陽謝隂興四際也酉為隂盛陽微五際也郎顗𫝊四始之缺五際之戹注韓詩外傳云隂陽終始際㑹之嵗於此則有變改之政又引詩汎厯樞漢地志子之營兮遭我虖嶩之間兮注毛詩作還齊詩作營自杜沮漆注齊詩韓詩韓詩章句芣苢傷夫也漢廣悦人也汝墳辭家也蝃蝀刺奔女也黍離伯封作也雞鳴説人也伐木勞者歌其事雨無極正大夫刺幽王也鼓鍾昭王之時作賔之初筵衛武公飲酒悔過也商頌美襄公篇名之異者如枓木標有楳何彼茙矣嫙蓁蓁者峩涔漢地理志周道郁夷苪􅠵之即杜欽𫝊注仲山甫就封于齊樊凖𫝊京邑翼翼四方是則文選注奄有九域在彼穹谷曹褒𫝊奚斯頌魯注薛君章句以是詩公子奚斯所作後漢書注彼岨者岐有夷之行薄言振之東有圃草皆引薛君傳又引薛夫子章句詠闗雎以刺時史記趯趯毚兔注引韓嬰章句爾雅注心焉惕惕韓詩以為恱人釋文引韓詩異字及說如箌彼甫田緑􅗨猗猗之類樂記温良而能斷者宜歌商注商宋詩史記宋襄公之時正考父作商頌又云仁義陵遲鹿鳴刺焉而薄伐獫狁至于太原出輿彭彭城彼朔方為周襄王之詩劉向列女傳衛宣夫人作𨚍柏舟黎莊公夫人作式微蔡人之妻作芣苢周南大夫妻作汝墳申人女作行露衛定姜送歸作燕燕漢匈奴𫝊懿王時戎狄交侵詩人歌之曰靡室靡家獫狁之故宣王詩曰城彼朔方漢天文志詩𫝊曰月食非常也比之日食猶常也日食則不臧矣孟子注小弁伯竒之詩白虎通相鼠妻諫夫之詩孔叢子吾于四月見孝子之思祭國語注六月道吉甫佐宣王征伐復文武之業也秦伯賦鳩飛引小宛之首章采菽王賜諸侯命服之樂也黍苗道召伯述職勞來諸侯也周禮疏案異義韓魯説騶虞天子掌鳥獸官詳見詩攷漢韓詩外傳詳見詩攷志韓内𫝊四卷韓外𫝊六卷四篇名内傳復推詩人之意作外傳數萬言隋唐止存外傳析為十篇唐志韓詩卜商序韓嬰注二十二卷又外𫝊十卷隋志同存歐陽修曰漢志嬰書五十篇今外傳非傳詩之詳者崇文目韓嬰之書至唐猶在今存十篇其遺説時見於他書晁氏志外𫝊雖非解經之深者然文辭清婉有先秦風記經解注韓詩内𫝊曰鸞在衡和在軾禮記䟽引韓詩説傳郊特牲疏引内正義侯包云衛武公刺王室亦以自戒金罍辟廱皆引韓詩説周禮注詩𫝊佩玉上有葱衡下有雙璜疏謂韓詩公羊傳注引韓詩傳白虎通韓詩内𫝊曰太子生以桑弧蓬矢六射上下四方内𫝊曰師臣者帝文選注内𫝊桑弓蓬矢王者舞六代之樂舞四夷之樂大徳廣之所及又内𫝊曰世子者何言世世不絶水經注二南國按韓嬰叙詩云其地在南郡南陽之間漢志注韓詩傳云三月桃花水三禮義宗内傳天子奉玉升柴後漢志注韓詩序云云晁說之論引韓詩叙漢小雅逸篇後紀永平二年十二月壬子詔升歌鹿鳴下管新宫見燕禮注新宫小雅逸篇也逸詩並見詩攷漢詩大義匡衡𫝊學者上書薦衡事下太子太傅蕭望之少府梁丘賀問衡對詩諸大義其對深美望之奏衡經學精習宣帝不用皇太子見衡對私善之漢詩細詩譜詩解趙曄𫝊儒林受韓詩著吳越春秋詩細厯神淵蔡邕至㑹稽讀詩細而歎息以為長於論衡隋志梁有詩神泉一卷漢有道徵士趙曄撰亾鄭𤣥𫝊著毛詩譜唐志鄭𤣥譜三卷隋志二卷太叔求及劉炫注修古今書録有徐正陽注書目歐陽補亡隋志謝氏毛詩譜鈔一卷梁有韓詩譜二卷吳太常卿徐整毛詩譜三卷又有毛詩答問駁譜國史志詩譜世𫝊太叔求注不在祕府經典釋文叙録所稱徐整暢太叔裘隠盖整既暢演而裘隠括之求字訛也歐陽修補注一卷宋均詩譜序云我先師北海鄭司農又云夷厲己上嵗數不明太史年表自共和始歴宣幽平王而得春秋次第以立斯譜鄭於三禮論語為之作序此譜亦是序類避子夏序名以其列諸侯世及詩之次故名譜也易有序卦書有孔子作序故鄭避之謂之為賛賛明也譜者普也注序世數事得周普史記謂之譜牒是也又云欲知源流清濁之所處則循其上下而省之欲知風化芳臭氣澤之所及則傍行而觀之此詩之大綱也見唐劉子𤣥議歐陽修後序慶厯四年奉使河東至綘州得之其文有注而不見名氏自周公致太平以上皆亡之補以孔氏正義之文因為之注自周公以下即用舊注凡補其譜十有五補其文字二百七增損改正者三百八十三而譜復完初修未見鄭譜嘗略考春秋史記合以毛鄭之説為詩圗十四篇今因取以補鄭譜之亡者景鸞𫝊儒林能理齊詩施氏易兼受河洛圗緯作易説及詩解文句兼取河洛以類相從名為交集又撰禮内外記號曰禮畧又抄風角作興道一篇又作月令章句著述五十餘萬言漢毛詩序後儒林𫝊衛宏好古學九江謝曼卿善毛詩賈徽學毛詩於曼卿宏從曼卿受學因作毛詩序善得風雅之㫖正義三百一十一篇子夏作序史記漢書云三百五篇闕其亡者以見在為數也經典釋文沈重云按鄭詩譜大序自風風也訖末名為大序子夏作小序子夏毛公合作或云小序是東海衛敬叔所作序録宋周續之雷次宗齊劉獻並為詩序義隋志先儒相承謂毛詩序子夏所創毛公及衛敬仲又加潤益顧歡等毛詩集解序義一卷雷次宗序義二卷宋阮珍之序注一卷劉炫集小序一卷劉瓛等詩序義疏一卷唐志卜商集序二卷又翼要十卷隋志侯苞韓愈議曰子夏不序詩之道有三焉蘇轍以毛詩序為衛宏作非孔氏之舊止存其首一言餘皆删去晁説之曰説韓詩者謂其叙子夏所作朱氏辨説曰詩序或以為孔子或以為子夏或以為國史皆無明文可考惟後漢儒林𫝊以為衛宏作然鄭氏又以為序本自合為一編毛公始分寘諸篇之首則毛之前其𫝊已久宏特増廣潤色之耳近世諸儒多以序之首句為毛公所分其下為後人所益理或有之但今考其首句則已有不得詩人之本意而肆為妄説者矣凡小序詩文直指其事如甘棠定之方中南山株林之屬若見於書史如載馳碩人清人黄鳥之類决為無可疑者毛𫝊簡要平實三鄭氏惟序是信傳以禮魏毛詩義問隋志毛詩義問十卷魏太子文學劉楨撰七月正義引之王肅毛詩義駁八卷又毛詩奏事一卷問難二卷王基駁一卷謝沉釋義十卷劉璠毛詩義四卷毛詩箋𫝊是非二卷吳韋昭朱育毛詩答雜問七卷晉郭璞毛詩拾遺一卷梁何𦙍毛詩縂集六卷隠義十卷晉楊乂雜義五卷殷仲堪雜義四卷梁武帝發題序義一卷大義十一卷簡文十五國風義二十卷劉瓛篇次義一卷北史劉獻之注毛詩序義一卷劉芳毛詩箋音義證十卷張思伯為毛詩章句南史張譏毛詩義二十卷顧越深明毛詩傍通異義定之方中注仲梁子曰初立楚宫也正義鄭志張逸問仲梁子何時人答曰先師魯人當六國時在毛公前維天之命注孟仲子曰大哉天命之無極而美周之禮也正義譜云子思弟子子思論詩於穆不已仲子曰於穆不似斯干正義古者似巳字同於穆不已師徒異讀絲衣序高子曰靈星之尸也正義鄭志答張逸云高子之言非毛公後人著之不云詩序本有此文孟軻弟子有公孫丑者稱高子之言趙岐以為齊人晉補亡詩隋文中子續詩文選束廣微補亡詩六首南陔白華華黍由庚崇丘由儀注王隠晉書曰束晳字廣微為著作嘗覽周成王詩有其義亡其辭惜其不備故作辭以補之晉傳晳著補亡詩行於世唐志束晳集五巻夏侯湛作周詩朱氏集𫝊以鄉飲酒禮燕禮考之曰笙曰樂曰奏而不言歌則有聲而無詞明矣意古經篇題之下必有譜焉文中子中説續詩備六代有四名化政頌歎有五志美勉傷惡戒三百六十篇列為十卷後亡其小序諸侯不貢詩天子不採風樂官不逹雅國史不明變斯則久矣詩可以不續乎程元問六經之致子曰續書以存漢晉之實續詩以辨六代之俗修元經以斷南北之疑讃易道以申先師之㫖正禮樂以旌後王之失六代晉宋後魏北齊周隋晉毛詩外傳謝沈𫝊著毛詩外𫝊隋志謝沈釋義義疏各十卷晉詩評釋文魏太常王肅述毛非鄭荆州刺史王基駁王肅申鄭義晉豫州刺史孫毓為詩評毛鄭王肅三家同異明於王徐州從事陳統難孫申鄭正義引孫毓評毛春秋正義引王肅注詩隋志王基毛詩駁一卷梁五卷序録孫毓詩同異評十卷梁毛詩集注毛詩圖隋志梁崔靈恩集注二十四卷本𫝊云二十二卷梁武帝毛詩大義一卷梁有毛詩圗三卷毛詩孔子經圖十二卷毛詩古賢聖圖二卷亡釋文崔靈恩集注採三家之本般樂也用注為序文定生民正義案集注及本梁史許懋受毛詩撰風雅比興義十五卷唐二十五家詩藝文志經録三曰詩類二十五家三十一部三百三十二卷始韓詩卜商序韓嬰注二十二卷韓詩有卜商序韓嬰注又外𫝊翼要毛詩有毛萇鄭𤣥王肅業遵宋人號業詩立義多異世所不行注隋志業詩二十卷業遵崔靈恩王𤣥度之𫝊箋譜注劉王孫楊陳謝之問駮評難辨釋元延明之誼府張氏陸璣劉炫孔頴逹之義疏魯世逹鄭𤣥諸家之音義終於毛詩正義不著録三家始於纂義次以毛詩指説斷章終於草木蟲魚圗凡三十三巻隋志三十九部四百四十二卷崇文目八部一百十五卷中興書目三十三家三百七十卷續目十一家二百二十卷文粹李行脩曰劉迅説詩三千言言詩者尚之唐詩正義志毛詩正義四十卷孔頴達王徳韶齊威等撰趙乾夀賈普曜趙𢎞智等覆正宋淳化三年四月校定上之正義序近代為義疏者有全緩何𦙍舒瑗劉軌思劉醜焯炫等焯炫特為殊絶今據以為本削其所煩增其所簡隋志義疏有謝沈十卷又釋義十卷張氏五卷舒援二十卷沈重二十八卷又二十卷二十九卷十卷十一卷二十八卷劉瓛詩序義疏一卷劉炫述義四十卷魯世逹章句義疏四十卷隋書四十二卷選春秋正義引陸璣毛詩義疏文注引劉芳詩義疏唐詩纂義志毛詩纂義十卷許叔牙𫝊貞觀中遷𢎞文館直學士於詩禮尤䆳獻詩纂義十篇太子寫付司經御史大夫高智周見之曰欲明詩者宜先讀此唐毛詩指説志成伯璵毛詩指説一卷書目有指説統論一卷凡四篇畧叙作詩大㫖及師承次序毛詩斷章二卷取春秋賦詩斷章之義鈔詩語彙而出之凡百門序云貞元十年撰唐草木蟲魚圖毛詩物象圖志毛詩草木蟲魚圖二十卷開成中文宗命集賢院修撰并繪物象大學士楊嗣復學士張次宗上之陸璣毛詩草木蟲魚疏二卷吳太子中庻子烏程令書目同按釋文璣字元恪易釋文引之名賢畫録大和中文宗好古重道以晉明帝朝衛協畫毛詩圖草木鳥獸古賢君臣之像不得其真召程修己圗之皆據經定名任意採掇由是冠冕之製生植之姿逺無不詳幽無不顯唐毛詩别録書目毛詩别録一卷張訢撰凡三十二篇毛鄭箋注取其長者述而廣之至道皇太子講詩二年三月癸卯諸王府侍講邢昺上言皇太子召臣於府内講毛詩久之賔客李至李沆皆列坐共聴天禧毛詩正紀元祐詩𫝊補注書目正紀三卷天禧中宋咸撰四十四篇論詩名篇數風雅正變之類又外義二卷元祐四年六月十八日吏部侍郎范百禄進補注二十卷詔付祕省皇祐毛詩大義皇祐中武功蘇子才采鄭譜孔疏僅二百條分為三巻劉宇為詩折𠂻二十卷凡一百六十八篇歐陽修為毛詩本義十六卷凡百十四篇王安石新經毛詩二十卷梅堯臣毛詩小𫝊二十卷蘇轍詩解二十卷程頥詩説二卷門人記其師所談之經楊時毛詩辨疑一卷陳少南詩解二十卷胡旦毛詩演聖通論二十卷紹興毛詩叶韻補音十卷紹興中吳棫撰自序云詩音舊有九家唐陸徳明以己見定為一家之學釋文是也所補之音皆陸氏未叶者已叶者悉從陸氏朱熹多所刋補正義曰詩之大體必須依韻其有乖者古人之韻不協爾朱氏曰周頌多不協謂詩集𫝊朱熹輯詩𫝊二十卷其序曰本之二南以求其端參之列國以盡其變正之於雅以大其規和之於頌以要其止此學詩之大㫖也吕祖謙讀詩記三十二巻正義風雅之篇無一章者頌者述成功以告神故一章而已魯頌不一章非告神之歌也商頌長發殷武重章者或詩人之意所作不同程大昌論曰詩有南雅頌無國風其曰國風者非古也君子之於詩非徒誦其言又將以考其情性考先王之澤正小雅燕饗之樂也正大雅會朝之樂受釐陳戒之辭也或歡欣和悦以盡羣下之情或恭敬齊莊以發先王之徳朱子孟子記孔子言詩以為知道者二論語記孔子弟子許其可與言詩者亦二虞書言詩言志自后䕫以来五聲八音所用以為樂皆主於詩舜作歌以謹天命而臯陶乃賡載歌世治而相勉以善也五子述大禹之戒為歌世亂而相警以惡也列子言立我蒸民莫匪爾極堯之時所謂詩也書大傳言日月光華𢎞余一人舜之時所謂詩也太師陳詩以觀風俗工以納言時而颺之學校教士與禮樂書相參謂之四術至孔子始刪取著以為經小人歌之以貢其俗君子賦之以見其志聖人採之以觀其變詩有天下之作有一國之作有神明之作文中子玉海卷三十八
