body:
  text: 玉海卷一百二十九宋王應麟撰官制儲官訓導東宫事附唐東宮㑹要兼實録武德九年六月改東宮𢎞禮嘉福等門為光宣門貞觀十七年十一月誕皇孫宴宫僚于𢎞教殿自殿北門入幸東宮顯慶元年六月改東宮𢎞教殿為崇教殿咸亨四年七月庚午皇太子新宫成帝親送太子入宫五品已上宴會奏樂長安二年正月十七日左庶子王方慶奏東宫門殿多觸太子名請改之以協舊典永貞元年六月乙未皇太子見百僚於東朝長安志東宮在太極宮中自承天門而東其第三門曰重明門即東宮正門也殿曰明德本顯德殿武德九年八月甲子太宗即位于此中宗為太子改明徳高宗以貞觀二年生于麗正殿皆在東宮魏徴曰武德殿在東宮之西開元後太子不居東宮但居乘輿所幸之别院岑文本𫝊晉王為太子大臣多兼宮官帝欲文本兼攝辭曰不願希恩東宮請一心以事陛下帝乃止但詔五日一叅東宫每進太子答拜又太宗敕劉洎岑文夲馬周遞日直東宫通典受朝集使㕘辭設幄座於東宫正殿東序西向設宫臣次於重明門外謁太廟宿齋於正殿設宮官次于東宫朝堂神異經曰東方有宮青石為牆高三仞左右闕高百丈畫以五色門有銀牓以青石碧鏤題曰天地長男之宮晉太元十七年八月新作東宮北齊議者引晉舊事太子在東宮西面為避尊位通典徐廣東宮頌曰禮樂承軒典册授庭命服惟九龍旗鸞旌初學記唐重明門又見冠禮禮志皇太子加𤣥服九品以上皆詣東宮朝堂宮臣皆朝服其餘公服集於重明門外朝堂納妃前一日衛尉設次於東朝堂之北西向又設宮官次扵重明門外其日皇太子服衮冕出升金輅至承天門降輅就次通典皇太子謁太廟設宮官次扵東宮朝堂典儀設宮臣位於重明門外所司依鹵簿陳設於重明門外皇太子㑹宮臣如常㑹之儀宮臣上禮朝服集東宮南門之左正至受羣臣賀設羣官等次於東宮朝堂四部伎立於左右嘉善門外唐太極殿册太子見册禮及殿類姚珽上書曰銀牓銅樓宮闈嚴秘門閣來往皆有簿籍唐臨軒册命見册禮通典開元禮臨軒册命皇太子設御幄座於太極殿朝皇后謁太廟皇帝㑹羣臣上壽羣臣上禮皇后受羣臣賀皇后㑹命婦上壽皇太子㑹羣臣㑹宮臣宮臣上禮内册皇太子臨軒命使皇太子受册皇太子朝謁詣皇帝皇后所御殿唐貞觀賜太子典籍㑹要貞觀十七年十一月二十八日誕皇孫宴宮僚于𢎞教門太宗幸東宮自殿北門入謂宮臣曰頃來生業稍可非乏酒食而唐突公等宴㑹朕有甲觀之慶故就卿為樂耳謂太子曰爾國之儲貳府藏是同金玉綺羅不足為賜但先聖典籍可為鑒誡耳因賜尚書毛詩孝經各一部太子太傅蕭瑀曰今所賜書請陳其要㫖申明義趣可為深戒者皆委曲言之上大恱以為師傅得人是歳四月立晉王為皇太子己亥御兩儀殿陳孝德以戒之閏六月語侍臣曰自太子立遇物必誨唐貞觀皇太子釋菜于太學景雲皇太子釋奠于國學開元皇太子入學齒胄紀太宗貞觀二十一年二月丁丑皇太子釋菜于太學高宗總章元年二月丁巳二十九日皇太子𢎞釋奠于國學開耀元年二月丙午十九日皇太子釋奠于國學睿宗景雲二年八月丁巳皇太子釋奠于國學先天元年即太極元年二月丁巳皇太子釋奠于國學𤣥宗開元七年十一月乙亥皇太子入學齒胄賜陪位官及學生帛禮樂志貞觀二十一年許敬宗等奏請國學釋奠以祭酒司業博士為三獻㑹皇太子釋奠自為初獻以祭酒張復𦙍亞獻光州刺史攝司業趙𢎞智終獻總章元年太子𢎞釋奠于學贈顔回為太子少師曾參少保睿宗太極元年始贈顔回太子太師曾參太子太保皆配享𤣥宗開元七年皇太子齒胄于學謁先聖詔宋璟亞獻蘇頲終獻臨享天子思齒胄義乃詔二獻皆用胄子祀先聖如釋奠右散騎常侍褚无量講孝經禮記文王世子篇㑹要貞觀二十年二月詔皇太子於國學釋奠于先聖先師皇太子為初獻張復𦙍趙𢎞智亞終獻既而就講𢎞智演孝經忠臣孝子之義右庶子許敬宗上四言詩以美其事永隆二年二月六日皇太子親行釋奠之禮禮畢上表請博延耆碩英髦之士為崇文館學士於是薛元超表薦鄭祖元鄧元挺楊烱崔融等為學士景雲二年七月七月恐誤皇太子親釋奠於國學有司具儀注從臣皆乘馬著衣冠左庶子劉子元進議曰專車馮軾可擐朝衣單馬御鞍宜從䙝服其乘馬衣冠竊謂宜從廢改皇太子令付外宣行仍編入令以為常式車服志亦載此事謂睿宗時太極元年二月二十八日皇太子親釋奠開講筵國子司業禇无量執經開孝經及禮記題太子問疑義數條開元七年十一月十一日以貢舉人將謁先師質問疑義敕皇太子及諸子宜行齒胄禮二十一日皇太子謁先聖為初獻亞獻終獻並以胄子充大厯五年八月皇太子行齒胄禮於國學司業歸崇敬以國學及官名不稱請改之疏奏不從建中元年正月辛未制皇太子時幸太學行齒胄禮諫議孔述睿充侍讀梁天監八年皇太子釋奠周捨議請依東宫元㑹太子著絳紗襮樂用軒懸九年三月乙未詔皇太子及王侯之十年在從師者皆入學唐帝範詳見御製蓻文志儒家太宗帝範四卷賈行注㑹要貞觀二十三年正月二十日太宗撰帝範十二篇崇文館目一卷賜皇太子顧謂王公曰飭躬闡政一作修身治國之道備在其中矣一云貞觀二十二年正月己卯作君體建親求賢審官納諫去讒戒盈崇儉賞罰務農崇文敬宗寳厯二年五月著作郎韋公肅注太宗文皇帝帝範一十二篇上之通鑑貞觀十七年閏六月上謂侍臣曰自朕立太子遇物則誨之云云崇賢有館司議有郎典書有坊開元製訓戒之書元和集君臣之迹唐寢殿别院高宗紀太宗嘗命皇太子遊觀習射辭以非所好願得奉至尊居膝下太宗大喜乃營寢殿側為别院㑹要貞觀二十年使太子居之太宗每視朝皇太子常侍觀决庶政禇遂良傳時帝於寢宮側前置院居太子遂良諫以為朋友深交者易怨父子滯愛者多愆宜許太子間還東宮近師傅專學藝以廣懿德帝從其言開元後太子不居東宮處乘輿所幸别院遂良疏曰周兩問安三至必退漢儲視膳五日乃來崔融表云周儲故事一日三至於寢門晉兩舊儀一月五朝於左閤唐詩纂義許叔牙傳晉王為太子叔牙為府官獻詩纂義十篇太子寫付司經高智周見之曰欲明詩者宜先讀此晉王高宗也唐承華箴李義府𫝊高宗為太子除義府舎人獻承華箴震維標德離宮體正望誠登爼高諭喬枝唐青宮紀要天訓少陽政範藝文志儒家類武后紫樞要録十卷臣軌二卷百寮新誡五卷青宮紀要三十卷少陽政範三十卷列藩正論三十卷凡武后書皆元萬頃等撰章懷太子春宮要錄十卷修身要覽十巻武后訓記雜載十卷采青宮紀要維城典訓古今内範内範要略等書為雜載維城典訓二十卷故事類春坊舊事三卷失姓名杜正倫春坊要録四卷儀注類蕭子雲東宮雜事二十卷陸開明宇文愷東宮典記七十卷舊志青宮要記十卷天后撰崇文總目同㑹要高宗顯慶二年六月上製元首前星維城股肱誡令許敬宗等注釋名曰天訓志高宗天訓四卷章懐太子傳后撰少陽政範孝子𫝊賜賢唐青宮要錄舊志儒家青宮要錄十卷修身要錄十卷並章懐太子撰唐孝經章句見前孔穎達唐孝德後傳郎餘令傳孝敬皇帝在東宮餘令以梁元帝有孝德傳更撰孝德後傳數十篇獻太子太子嗟重之藝文志孝子後𫝊三十巻唐搖山玉彩孝敬皇帝𢎞傳高宗顯慶四年加元服命賓客許敬宗右庶子許圉師中書侍郎上官儀等即文思殿摘采古今文章號搖山玉彩凡五百篇書奏賜物三百段餘臣賜有差藝文志類書許敬宗搖山玉彩五百卷一作瑤山玉彩龍朔元年撰唐諭善箴韋承慶傳為太子司議郎儀鳳中進諭善箴太子頗嘉納唐翼善記褚無量傳𤣥宗為太子拜無量國子司業兼侍讀無量撰翼善記以進厚被禮答景雲元年太子釋奠國學令講經建端立義博敏而辯錫予蕃渥進銀青光禄大夫無量碑云所撰儲君翼善二十篇帝王要覽二十三卷帝王紀錄三卷唐養德傳太子重俊傳右庶子平正謹獻孝經義養徳等傳志傳記類卷亡唐搖山往則維城前軌志儒家裴光庭搖山往則舊史作瑤山往則記光庭碑云瑤山往維城前軌各一卷裴光庭傳為侍中𢎞文館學士造搖山往則維城前軌二篇獻之明皇手詔褒美詔皇太子諸王於光順門見光庭謝所以規諷意搖山譔述元逰從㑹要開元十九年十二月十一日侍中裴光庭上瑤山往則維城前軌各一卷上以賜太子及慶王舊紀十二月戊戌光庭上各一卷上今賜太子諸王各一本山海經大荒西經西海之外有搖山其上有人曰太子長琴顓帝生老童老童生祝融祝融生太子長琴是處搖山始作樂風注此山多搖木因名神異經東明山有宫有銀牓曰天地長男之宫唐開元訓誡實錄開元二十五年八月甲子帝作開元訓誡六篇開元御集誡子書即此書也示諸王其㫖葢明君臣父子之義齋祭稼穡之事宰臣請宣布中外手詔曰周公戒伯禽無以魯國驕人朕方聖雖慚敢忘戒子聊示訓庭何足宣布志小說家開元御集誡子書一卷唐賜太子仁孝詩唐天寶八載𤣥宗製仁孝詩六章札於步障以賜太子令中官以示朝臣宰相林甫奏曰伏見太子生日撰仁孝詩障子并書爰於誕育之日授以仁孝之經望具寫六章頒示中外編諸史策傳之不朽上手詔從之肅宗為太子時肅先是開元二十六年六月庚子立忠王為皇太子宗以景雲二年九月三日生於東宮别殿開元十三年三月甲午徙封忠王唐龍樓箴歸登傳父子為侍讀侍順宗於東宮及即位登復為皇太子諸王侍讀獻龍樓箴以諷一本云正元二十一年正月順宗即位登以東宮恩超拜給事中工部侍郎復為皇太子諸王侍讀獻龍樓箴以諷元和四年十月庚寅冊太子癸巳登充侍讀唐五位圖詩笏王起傳文宗上文好古學是時鄭覃以經術進起以淳朴顯太和七年八月庚寅冊太子制皇太子侍讀委中書門下精擇二人起為太子侍讀帝使廣五位圖俾太子知古今治亂帝數訪建時政題詩太子笏以賜起詔畫像便殿號當世仲尼其寵待如此唐藝文志有王氏五位圖十卷又有五運圖葢編年書也中興館閣書目云王氏五位圖三卷唐開成初判太常卿事王起撰自開闢至唐以五運為序起字舉之唐教本書元稹撰見前唐太子諸王訓蓺文志儒家丁公著太子諸王訓十卷傳憲宗時公著為太子諸王侍讀著太子諸王訓十篇唐玉契見符節類唐賛道賦李百藥傳貞觀四年為右庶子作賛道賦以諷政要貞觀五年李百藥為右庶子作賛道賦曰顧三善而必𢎞祇四德而為行每趨庭而聞禮常問寢而資敬邁觀喬而望梓既彫且琢溫故知新唯忠與敬曰孝與仁則下光四海上燭三辰昔三王之教子兼四時以齒學將交發於中外乃先之以禮樂惟聖上之慈愛訓義方於至道同論政於漢幄修致戒於京鄗鄙韓子之所賜重經術而為寶自禮賢於秋實足歸道於春卿異洞簫之娯侍殊飛葢之緣情太宗遣使謂曰所作賦述古來儲貳事以戒太子甚典要朕選卿輔弼正為此事大稱所委因賜廄馬一綵三百左庶子于志寧撰諫苑二十卷諷之太平興國戒子篇實錄郭贄傳兼皇子侍讀興國二年遷右補闕一日太宗至東宮出戒子篇命贄注解且令委曲講說以諭諸王至道朝元殿冊太子天禧天安殿冊太子見冊禮類有唐太極之舊規至道朝元之故事黄麾設仗眡元㑹之盛儀鱗簨充庭奏明安之雅樂至道東宮官天禧紹興王友至道元年八月壬辰以開封尹壽王為太子九月丁卯朝元殿行册禮以楊徽之畢士安兼左右庶子喬惟岳楊礪兼左右諭德夏侯嶠兼中舎李至李沆兼賓客詔太子見賓客如師傅禮太子每見必先拜迎降階及門動皆咨詢至有答問政牋至等入謝上曰太子仁孝賢明賴正人輔之以道卿等盡心調䕶動由禮則賛成事未當則力言勿因循面從也祥符九年正月壬申張士遜崔遵度為壽春王友仍今班相王府記室張復之下賜犀帶緡錢上作七言詩寵之又賜遵度金紫王將授經擇有德方正者佐之朕初宰相欲以為翊善記室上曰府屬王皆受拜欲令尊禮師友相見答拜故以王友命之議天禧二年進封昇王以王友士遜遵度為諮㕘軍晏殊為記室天禧二年八月庚戌樂黄目兼左庶子張士遜兼右庶子崔遵度魯宗道兼左右諭德晏殊兼舎人壬子參政李迪密學王曉兼賓客黄目出荆南以士遜兼左庶子王隨兼右庶子四年八月庚寅士遜為賓客辛卯宗道左諭徳馮元右諭德九月壬子又以林特兼賓客十一月輔臣言東朝設官未備請以執政大臣兼官寮申羽翼之助戊辰㕘政任中正王曾樞副錢惟演兼賓客特士遜詹事殊左庶子庚午遂以宰臣丁謂兼少師馮拯兼少𫝊樞密使曹利用兼少保先是七月丙寅李迪為相進兼少傅此宰臣兼宮寮之始也治平三年十二月壬寅立太子韓維邵亢兼左右庶子甲辰王陶蔡抗除詹事元豐七年上諭輔臣曰明年建儲當以司馬光呂公著為師保政和五年二月十四日乙巳立太子强淵明劉炳為賓客七年李彌大兼舎人紹興三十一年五月甲子立太子六月己巳張闡為右諭德史浩為右庶子乾道元年八月九日建儲詹事則蔣芾魏杞左庶子兼侍讀則知柔左諭德兼侍講則大猷二年八月任文薦以左庶子兼侍讀七年二月光宗升儲三月王十朋陳良翰詹事李彦頴侍講左諭德劉季裴侍講八年周操詹事林光朝侍讀九年尤袤侍讀開禧三年十一月戊子建儲祭酒戴溪兼太子侍讀十二月起居郎陳希㸃兼侍講十二月辛酉右相錢象祖兼少傅明年命二相左兼少師右兼少傅越明年右兼少師天禧元年陳靖上言願延揖公台充備師傅庶左右周儲賴旦奭之耆德羽翼漢嗣躡園綺之高蹤至道皇太子謁太廟至道元年九月二十七日皇太子謁太廟導從如式天禧二年九月十四日癸酉皇太子朝謁太廟冠服如受册乘金輅設仗如儀三師三少乘車文武宮臣乘馬導從禮畢賜從官酒食日左右有赤黄珥黄雲捧日觀者塞路瞻仰欣抃十三日朝謁昭應景靈宮天禧舊儀無升殿逐室行禮之文政和四年詔逐宮行禮乘車以三師訓導三少訓從至道天禧故事乘輅用鹵簿以雷文一角螭代龍飾政和止依常儀乘馬皇太子不敢當盛儀故也乾道亦免乘輅設仗至道南衙太祖以儲位寓於京尹太宗自尹踐阼至道元年八月十八日立壽王為太子詔兼判開封府宣和七年十二月二十日詔太子除開封牧賜碾玉龍束帶乾道七年四月二十七日甲子詔太子領臨安府尹祥符資善堂詳見堂類大中祥符八年十二月制授皇子慶國公忠正軍節度使壽春郡王九年丙辰歳二月十八日甲午詔元符觀皇太子就學新堂宜以資善為名因製記天禧二年正月上詣元符觀宴宗室于資善堂次日宴羣臣從官于資善堂召壽春郡王府屬咸預焉出聖製資善堂記其年二月制行江寧尹進封昇王二年八月甲辰立為皇太子作元良箴七言十韻詩各一首賜太子又作七言詩二首賜庶子賓客以下先是祥符七年十二月詔左承天祥符門内新建觀宜以元符為名葢縁每歳天慶節左承天門設幄陳供為道場以車駕往來喧雜命葺皇城司廨宇為觀至是建堂天禧四年徙於宣祐門内東廊以北講筵所亦在焉祥符九年張士遜請以聖製資善堂記刻石堂壁從之仁宗皇祐元年七月壬子幸資善堂作詩有曰疇日學文親政地仰懐慈訓倍依依祥符繼照堂見後天禧親賢進封賦冠禮賦天禧二年戊午歳二月丁卯壽春郡王進封昇王先是祥符七年甲寅歳二月丁未封慶國公八年十二月辛卯封壽春郡王晏殊作親賢進封賦曰燕禖啟兆熊夢開祥分暉日域稟秀星潢陪漢幄以遵禮奉堯闈而中式寢門屢至足見於純誠吏牘遙觀葢彰乎敏識接申白以談經越應劉而振藻云云乙酉李虛己丁度等以昇邸進封並上詩頌詔奬之祥符八年十二月戊寅皇子加冠禮戊子集賢校理晏殊上皇子冠禮賦曰闢崇賢而毓德御宣猷而待賓東明之銀牓彌高西海之瑤山特峻冠禮事詳見冕服類天禧元良述六藝箴承華要略勸學吟天禧二年八月甲辰制立昇王為皇太子癸丑上作元良箴七言十韻詩各一首賜之又作七言詩二首分賜賓客庶子以下三年九月二十二日丙子召近臣宗室于清景殿内出御製賜皇太子元良述六藝箴各一卷承華要略十卷授時要錄十二卷正説五十篇十卷又以國史兩朝實錄太宗御集緯術秘書經史子集及前後御集并御覽羣書賜太子命從臣徧閲之又作七言十韻詩賜宰相冦準等遂宴于殿内十二月又賜輔臣元良述六藝箴各一卷承華要略十卷帝以青宮紀要事有未備因博采羣言廣為承華要略十卷每篇著賛三年二月作勸學吟咸平五年召近臣觀書龍圖閣上曰朕在東宮時唯以聚書為急其門已逸者多方尋求頗有所得今已類成正本但恨校對未精如青宮紀要繼體治民論此一書兩名並列篇目天禧賜皇太子元良述與上同三年九月二十三日召宗室宰臣而下對清景殿出御製賜皇太子元良述其辭曰祗膺重器克荷徽章必務保其令名蘊其全德欲全其德在修其身欲修其身在勤其學夫修其身者謹茲語默戒彼端莊動靜之間率遵禮度好尚之際盡去竒邪親賢達之人近忠正之士聞其美譽則汲汲而思齊聽其良箴則孜孜而為戒勿謂小善之無益如滄海之積涓流可以資其廣也勿謂少疵之無害如至寶之負纖瑕可以累其質也去繁華之玩息縱佚之娯飲食以時興居有節常從儉約聿致和平此修身之要也夫勤於學者覃硏典籍探賾古今讀易則究其幾神誦書則味其訓誥閱詩則辨其諷諭觀禮則審其等威諸子百家咸存指趣遺編舊史悉載盛衰溫故而知新近思而切問皎如冰鑑可驗於否臧炳若丹青可占於隆替至於書數之蓻文翰之工足助才能常資講習此勤學之要也其扵愛民恤下當事寬仁御衆治繁宜遵簡易體仁而及逺崇信而致誠自然令問允昭嘉謨克廣兼四術之益播三善之風云云范仲淹有皇儲資聖頌天禧大禮稱慶合班圖三年十一月九日辛酉閤門太常禮院上大禮稱慶合班圖皇太子序位在宰相上太子懇辭冦準等面陳儲副之重不能謙抑凡再請乃許十六日戌辰南郊儀仗使錢惟演言正陽門習儀皇太子立樓上御座之西却繖扇至太廟門下馬歩進至郊壇遙望壝外即下馬謙恭之志實遵聖訓昔桓榮以儲宮專精博學謂之國家福祐書于史册詔奬皇太子宣付史館天禧故事皇太子稱令受冊畢别日正衙稱謝凡慶㑹上壽押百寮於外殿在三公之上乾道元年朝㑹合班東壁押班宰臣前行立班起居賜宴於宰臣前行坐車駕行幸於駕後方圍子内行馬七年三月二十五日特御紫宸殿引皇太子稱謝設仗三百官詣宮參賀上至道天禧故事朝位在恪之下王公之宴則上壽於崇德殿康定少陽嘉範元年九月四日丙辰大理丞王縝獻少陽嘉範十卷詔送史館慶厯青宮懿典國史志類事王純臣青宮懿典十五卷慶厯中進詔藏秘閣嘉祐皇子位伴讀説書祥符九年二月入内供奉官楊懐玉為壽春郡王伴讀嘉祐六年十月壬辰英宗為泰州防禦使知宗正寺癸巳諸王宮侍講王獵為宗正寺伴讀獵為宮僚十三年有輔導功故首用之七年八月己卯立為皇子辛巳上悉召宗室入宮諭以立皇子之意壬午詔扵横門外建皇子位癸未賜名庚寅請以内香藥庫西偏為皇子位壬辰以皇城司廨舎為之辛卯李受為皇子伴讀王獵為説書辛丑皇子入内甲辰見上于清居殿自是日再朝于内東門或入侍禁中九月乙巳朔封鉅鹿郡公十一月戊辰皇子徙入位壬申禮院閤門定皇子立班於宗室之前别為一班殿門候班閤子在使相之下仁宗决大䇿建大本雖禹之知啟文之立武不能踰也六年英宗即位皇子為光國公神宗五月王陶為皇子位伴讀周孟陽孫思恭為説書孟陽辭不拜司馬光請多置皇子官屬博選有學行之士日與皇子居處燕㳺講論道義聳善抑惡輔成懿德紹興三十二年八月十六日置皇子位説書以命何俌陳良祐唐堯封孝宗即位後嘉泰二年閏十二月十五日宗子與談授右内率府副率為資善堂伴讀先是慶元六年四月十五日京鏜奏更擇一人伴讀上曰當更相度唐柳晟年十二代宗養宫中使與太子諸王受學於吳大瓘并子通元率十日輒上所學徐齊聃善文誥令侍太子諸王屬文李泌供奉東宮真廟使蔡伯希侍仁宗周公輔成王使伯禽與之處仁宗未出閤擇宗室子幼悟而年相若者使與游處召濮安懿王置禁中旦莫誦讀仁宗封壽春郡王命雲韶樂送歸邸治平封皇子嘉祐八年十二月乙亥皇子淮陽郡王出閤治平元年六月己亥進封皇子淮陽郡王為潁王祁國公顥東陽王鄠國公頵左衛上將軍元豐五年八月壬子皇子封延安郡王政和四年二月二十七日皇長子行冠禮于文德殿紹興三十年二月甲戌手詔以普安郡王為皇子賜名丙子進封建王先是上諭大臣曰普安郡王除少保使相封真王俟正謝日賜玉帶紹興資善堂翊善賛讀直講説書紹興五年六月建國公就傅朱震范冲為翊善賛讀朝論以為極天下之選信王就傅亦命近臣為之寧皇在嘉邸妙選宮僚黄裳兼翊善陳傅良兼賛讀以詩為壽皆有諷諌王親書所上詩謝之開禧元年七月皇子初封榮王戎監趙夢極兼賛讀三年三月禮侍史彌遠兼翊善直講宣和元年四月置開禧元年七月初命鄒應龍又置説書以命張聲道紹興東宮三十二年五月二十八日詔孝宗升儲始居東宮在麗正門内詔討論宮室官屬儀物制度乾道七年二月二十八日癸丑光宗升儲丁酉受册孝宗語輔臣曰東宮不須剙建朕宮中宮殿甚多宜掇移修立由是工役甚省四月庚午領臨安尹淳熙二年夏始創射堂一為游藝之所五月十四日詔稱皇太子宮圃中有榮觀玉淵清賞等堂鳳山樓皆燕息之地也乾道皇孫賜名元年六月一日皇嫡孫生二十七日百僚表賀三年六月九日封國公賜名五年十一月十二日恭王次男賜名寧皇也漢甘露三年成帝生甲觀畫堂為世適皇孫宣帝愛之自名曰驁唐貞觀十七年十一月二十八日誕皇孫宴宮僚于𢎞教門永淳元年二月戊午立皇太孫一云三月十五日王方慶曰太子在而立太孫載籍未有晉永寧齊永明有太孫官屬唐永淳欲置而止開元十四年十月代宗生三日𤣥宗臨澡之曰一日見三天子樂哉熙祖流聰慧之稱建臨淮之國元仲表岐嶷之譽啟平原之封綠車赤綬金璽銀券結慶璿源垂䕃霄極淳熙東宮小學紹興三十年孝宗為建王時光宗與莊文魏王就傅以王十朋兼小學教授淳熙七年英國公未就傅大理正王尚之乞選儒臣為東宮小學教授上令討論典故正月二十六日以正字楊輔兼皇太子宮小學教授四月十五日右領軍衛將軍陳龜年以伴讀皇孫孝經論語終篇遷秩十年五月三日詔增置小學教授一員以何澹鄭鍔同兼十二年四月二十四日澹及羅㸃兼皇孫平陽郡王府教授淳熙議事堂詳見堂類十四年十一月己亥詔太子參决庶務遠稽貞觀決庶務於承華近法天禧見輔臣於資善明年正月乙巳又詔朝殿令侍立唐貞觀二十一年五月壬辰命百官决事于太子二十三年三月命聽政于金液門龍朔三年十月辛巳詔太子五日一至光順門監諸司奏事小事决之慶元資善堂小學六年四月十五日始置資善堂小學教授以命蕭逵龔頥正時東宮未正名十一月九日詔宗子曮就資善堂授書舊制資善堂有翊善等若皇孫則為皇太子宮小學教授至是㕘用之嘉定東宮規鑒元年八月二十二日觀文殿學士彦逾乞令東宮講讀官以古今歴代帝王治亂事迹編成一書分十門曰畏天愛民法祖宗聖孝用賢能遠小人勤儉聽言明賞罰謹邊防每事釋其下以東宮規鑒為名從之續書目二十卷詔宮僚曾㬇等九人采摭經𫝊格言帝王懿範釐為十門隨事解釋政和五年葛勝仲兼右諭徳以仁孝學三言各著一論獻之復採春秋戰國以來歴代太子善惡成敗之迹日進數事既乆遂成一書號承華詔媺云嘉定御書居仁堂寧宗朝景定東宫講堂名新益御書二字嘉定資善堂㑹議元年四月甲寅詔宰執日赴資善堂㑹議遇朝殿令皇太子侍立宰輔兼師傅賓客用天禧故事天禧四年輔臣每㑹議皇太子秉笏南面而立中書樞密以本司事遞進承令㫖景定皇太子進聖訓五年十月進七册上表曰家有嚴君訓誕敷於皇極謀詒翼子德早􅗱於青宮宜作宋之一經以繼周之百世緝為寶帙冒進玉旒臣竊惟五星聚奎式符建隆乾德之創造三聖一道有開祥符天禧之文明遵太子諭教之規植千歳治安之業記頒資善要舉承華申之頌述之諄勤重以箴詩之懇切形於聖製寵有御書迨及承平之盛時著為非常之鉅典於皇今日益大前猷兹葢恭遇皇帝陛下聖敬日躋聦明時又有典有則昭昭禹子之貽制事制心汲汲湯昆之裕語進德則親師講學論治國則脩身齊家六經四子具有階梯五常百行莫先孝弟以至視聽言動戒於非禮逸樂遊畋貴於毋皇事事存心言言切已寓在帝王筆舌無非經籍陶鈞臣佩服不忘珍儲甚富肆卷嘗加於編集萬年足示於鑑觀歴龜吉以紓忱瞻龍顔而奉表道知君父式同教世子之篇福錫人民莫匪叙􅂜倫之效二十日降付秘書省收掌尚書大𫝊太子年十八曰孟侯孟侯者於四方諸侯來朝迎於郊者問其所不知也問人民之所好惡土地所生山川所有無及父在時皆知之鄭𤣥注十八嚮入大學為成人博問庶事韓詩外傳自唐虞已上經𫝊無太子稱號夏殷雖𫝊嗣其文畧矣至周始見文王世子之制禹有典則貽厥子孫文有丕謨啟佑後人文王世子主於教世子而國之士亦及焉王制主於教造士而王太子王子亦預焉嗜魚不進求玦莫從有王褒之獻箴無卞蘭之奉賦搖山益峻少海增深有翦桐之戲則隨事箴規違侍養之方則應時諫止開望苑以延賓賦洞簫而虞侍進異端事浮靡南陽辨牘銅龍避道居肅成而講藝開博望以招賢賈誼治安之策言忠而道疎義府承華之箴言切而心詐元稹教本之書言華而要寡用智囊為家令則輔之非其人開博望延賓客則處之非其地漢幄朝無怠周門夕復趨桓經既受業賀肆且尊儒徐陵肅成通甲觀承華啟畫堂江總重輪依紫極前耀奉丹霄虞世南乾象開層宇離明啟少陽凌漢帝掩周王珠璧連霄漢萬物仰重光韓王元嘉前星涵瑞采洊雷揚遠聲三善𫝊樂正百行紀司成劉孝威帝體麗明儀辰作貳君彼東朝金昭玉粹顔延年業隆三善道兼四學繼明承序于以顯守祧之貴廟趨郊見于以彰率禮之教授經齒學所以崇道義之則安車金璽所以異車服之等易述主器之義書紀元良之重前星少海之象著乎穹厚撫軍監國之任備于出處敏足以對長安之日智足以辨陳留之牘波澄少海景麗前星上當天意下應人心雖夏后建儲周王繼嗣不之及也玉海卷一百二十九
