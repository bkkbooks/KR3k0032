body:
  text: 玉海卷一百三十四宋王應麟撰官制人物袁宏曰百姓不能自牧故立君以治之明君不能獨治則為臣以佐之宗匠陶鈞而羣才緝熙元首經略而股肱肆力黄帝三公又見官制七輔帝王世紀黄帝以風后配上台天老配中台五聖配下台謂之三公其餘知天規紀地典力牧常先封胡孔甲等或以為師或以為將張衡𫝊師天老而友地典注引云云漢藝文志兵陰陽有地典六篇晉志黄帝置三公之秩以親黎元少昊配九扈之名以為農正史記注鄭𤣥曰風后黄帝三公也論語擿輔象黄帝七輔風后天老五聖知命窺紀地典力牧堯九職説苑君道篇當堯之時舜為司徒契為司馬禹為司空后稷為田疇䕫為樂正倕為工師伯夷為秩宗皋陶為大理益掌敺禽堯知九職之事使九子者各受其事皆勝其任以成九功堯舜八師堯九佐舜七友七佐湯三輔湯二臣周五佐五臣楚辭東方朔七諫雖有八師而不可為王逸注八師謂禹稷卨臯陶伯夷垂益䕫也言堯舜有聖賢之臣八人以為師傅戰國䇿顔斶曰堯有九佐舜有七友禹有五丞湯有三輔注舜七友雒陶一作雄陶方回續牙古今人表作身柏陽東不訾秦不虚靈甫也見陶潛聖賢羣輔録表尸子止載六人古今人止五人皇甫士安逸士傳載七子淮南子道應訓堯之佐九人舜之佐七人武王之佐五人注堯九佐謂禹臯稷契夷倕益䕫龍也舜七佐與堯同武王五佐謂太公周召畢毛也孔叢子孔子曰聞諸老聃昔者虢叔閎天太顛散宜生南宫适五臣同竂比徳以賛文武古今人表義伯中伯注師古曰湯之二臣舜四士五臣三后唐虞九賢周三后管子法法篇舜有天下禹為司空契為司徒皋陶為李后稷為田此四士者精一徳以事君論語舜有臣五人而天下治注孔曰禹稷契皋陶伯益晉書江統上書虞舜以五臣興周文以四友隆書吕刑乃命三后恤功于民伯夷降典折民惟刑禹平水土主名山川稷降播種農殖嘉穀三后成功惟殷于民畢命惟周公克慎厥始惟君陳克和厥中惟公克成厥終三后協心同厎于道新序唐虞崇舉九賢布之於位而海内大康吳志步騭上疏舜命九賢禹七佐湯七佐四佐七大夫鬻子禹政第六禹得臯陶杜子業得既子黥得季子甯得然子堪子玉得七大夫以佐其身而天下治湯政第七湯得慶誧伊尹湟里且東門虚南門蠕西門疵北門側得七大夫佐以治天下而天下治説苑君道篇湯問伊尹曰三公九卿二十七大夫八十一元士知之有道乎對曰昔者堯見人而知舜任人然後知禹以成功舉之明君在上設四佐以自輔有英俊以治官管子堯之五更五官立五厲之祭祭堯之五吏禹五佐吕氏春秋得陶化益真窺横革之交五人佐禹故功績銘于金石著於盤盂荀子成相篇禹敷土平天下云云得益臯陶横革直成為輔臯陶九徳書臯陶謨臯陶曰亦行有九徳寛而栗柔而立愿而恭亂而敬擾而毅直而温簡而亷剛而塞彊而義彰厥有常吉哉日宣三徳夙夜浚明有家日嚴祇敬六徳亮采有邦翕受敷施九徳咸事俊乂在官百僚師師注三徳六徳九徳之中有其三有其六也立政周公曰有夏迪知忱恂于九徳之行成湯乃用三有宅克即宅曰三有俊克即俊嚴惟丕式克用三宅三俊文王武王克知三有宅心灼見三有俊心注湯能用剛柔正直三徳之俊湯左右相孟子注春秋傳曰仲虺居薛為湯左相是則伊尹為右相故二人等徳也莱朱湯賢臣一曰仲虺是也殷六臣書君奭公曰我聞在昔成湯既受命時則有若伊尹格于皇天在太甲時則有若保衡即伊尹在大戊時則有若伊陟臣扈格于上帝巫咸乂王家在祖乙時則有若巫賢在武丁時則有若甘盤注伊尹至甘盤六臣佐其君循惟此道以安治有殷文王五臣書君奭惟文王尚克修和我有夏亦惟有若虢叔有若閎天有若散宜生有若泰顛有若南宫适注五臣佐文王為胥附奔走先後禦侮之任文王四臣四友夫子四友尚書大𫝊文王以閎天太公望南宫适散宜生為四友夫子曰文王得四臣吾亦得四友自吾得回門人益親是非疏附耶自吾得賜逺方之士日至是非奔走耶吾得師也前有光後有輝是非先後耶吾得由也惡言不至於門是非禦侮耶又見孔叢子文選注周書孔子曰文王得四臣詩緜正義君奭注云詩𫝊説有疏附奔走先後禦侮之人而曰四臣周書維人四佐注胥附禦侮奔走先後左𫝊昭二年季武子賦緜之卒章注義取文王有四臣釋文謂太顛閎夭散宜生南宫适以韓子比四輔釋文謂先後奔走疏附禦侮孟子注太公望吕尚也散宜生文王四臣之一也吕尚有勇謀而為將散宜生有文徳而為相晉江統𫝊虞舜以五臣興周文以四友隆武王十臣書泰誓中予有亂臣十人同心同徳論語武王曰予有亂臣十人孔子曰有婦人焉九人而已注馬曰亂治也治官者十人謂周公旦召公奭太公望畢公榮公太顛閎天散宜生南宫适其一人謂文母書注同無劉敞以為子臣母之義盖邑姜也九臣治外邑姜治内武王五佐吕氏春秋武王之佐五人文選五臣兹六注引之注五人周公旦召公奭太公望畢公髙蘇公忿生也周八虞八士晉語文王詢於八虞注即周有八士皆在虞官唐固賈逵云論語周有八士鄭𤣥以為周公相成王時生賈逵以為文王時劉向馬融以為宣王時周書武寤解尹氏八士太師三公咸作有績和寤解王乃厲翼于尹氏八士注武王賢臣古今人表八士在中上等周三士荀子堯問篇周公謂伯禽之傅曰吾所執贄而見者十人還贄而相見者三十人貌執之士百有餘人欲言而請畢事者千有餘人於是吾僅得三士焉以正吾身而定天下吾所以得三士者亡於十人與三十人中乃在百人與千人之中明接士不廣無由得賢也魯八儒韓非子顯學第五十自孔子之死也有子張之儒有子思之儒有顔氏之儒有孟氏之儒有漆雕氏之儒有仲良氏之儒有公孫氏之儒一無公字有樂正氏之儒自墨子之死也有相里氏之墨有相夫氏之墨有鄧陵氏之墨故孔墨之後儒分為八墨離為三陶潛羣輔録魯八儒夫子没後散於天下設於中國成百氏之源為綱紀之儒居環堵之室蓽門圭竇甕牖繩樞併日而食以道自居者有道之儒子思氏之所行也衣冠中動作順大譲如慢小譲如偽者子張氏之所行也顔氏𫝊詩為道為諷諫之儒孟氏𫝊書為道為疎通致逺之儒漆雕氏𫝊禮為道為恭儉莊敬之儒仲梁氏𫝊樂為道以和陰陽為移風易俗之儒樂正氏𫝊春秋為道為屬辭比事之儒公孫氏𫝊易為道為潔浄精㣲之儒鄭七穆左𫝊鄭七穆罕駟國良游豐印穆公十一子子然二子孔三族已亡子羽不為卿故唯言七穆魏三士新序白圭曰魏文侯師子夏友田子方敬段干木名號顯榮者三士翊之也齊四臣史記齊威王與魏惠王㑹田於郊魏王曰齊國亦有寳乎齊王曰無有寡人國雖小尚有徑寸之珠照車前後各十二乗豈以齊大國而無寳乎齊威王曰吾臣有檀子者使守南城則楚人不敢冦東取泗上十二諸侯皆来朝吾臣有盻子者使守髙唐則趙人不敢東漁於河吾吏有黔夫者使守徐州則燕人祭北門趙人祭西門徙而從者七千餘家吾臣有種首者使備盗賊則道不拾遺此四臣者將照千里豈特十二乗哉惠王有慚色陶淵明集聖賢羣輔錄以為齊威王疆場四臣四漢應奉上疏梁惠王偉其照乗之珠齊威王答以臣漢三傑髙紀五年夏五月置酒雒陽南宫上曰夫運籌帷幄之中决勝千里之外吾不如子房鎮國家撫百姓給餉餽不絶糧道吾不如蕭何連百萬之衆戰必勝攻必取吾不如韓信此三者皆人傑也吾能用之新書曰漢祖驂三龍而乗雲路振長䇿而驅天下漢四皓漢書漢興有園公綺里季夏黄公甪里先生此四人者當秦之世避而入商雒深山髙祖聞而召之不至吕后用留侯計使皇太子卑辭束帛致禮安車迎而致之注師古曰四皓稱號本起於此漢三儒循吏傳序文景時循吏如河南守吳公蜀守文翁之屬皆謹身帥先居以亷平孝武之世唯江都相董仲舒内史公孫𢎞兒寛居官可紀三人皆儒者通於世務明習文法以經術潤飾吏事天子器之𢎞寛至三公漢七相五公班固𫝊西都賦南望杜霸北眺五陵冠盖如雲七相五公注七相謂丞相車千秋長陵人黄霸王商並杜陵人韋賢平當魏相王嘉並平陵人五公謂田蚡為太尉長陵人張安世為大司馬朱博大司空並杜陵人平晏為司徒韋賞為大司馬並平陵人李善注公御史大夫将軍通稱也張湯蕭望之馮奉世史丹徙杜陵杜周徙茂陵楊氏四公震秉賜彪楊賜𫝊云三葉宰相五登衮職袁氏四世五公安敞湯逢隗韋平父子至宰相漢武宣名臣公孫𢎞𫝊賛曰公孫𢎞卜式兒寛皆以鴻漸之翼困於燕爵遯跡羊豕之間非遇其時焉能致此位乎是時漢興六十餘載海内乂安府庫充實而四夷未賔制度多闕上方欲用文武求之如弗及始以蒲輪迎枚生見主父而歎息羣士慕嚮異人並出卜式拔於芻牧𢎞羊擢於賈豎衛青奮於奴僕日磾出於降虜斯亦曩時版築飯牛之朋已漢之得人於兹為盛儒雅則公孫𢎞董仲舒兒寛篤行則石建石慶質直則汲黯卜式推賢則韓安國鄭當時定令則趙禹張湯文章則司馬遷相如滑稽則東方朔枚臯應對則嚴助朱買臣厯數則唐都洛下閎協律則李延年運籌則桑𢎞羊奉使則張騫蘇武將率則衛青霍去病受遺則霍光金日磾武帝凡二十有七人其餘不可勝紀是以興造功業制度遺文後世莫及孝宣承統纂修洪業亦講論六蓺招選茂異而蕭望之梁丘賀夏侯勝韋𤣥成嚴彭祖尹更始以儒術進劉向王褒以文章顯將相則張安世趙充國魏相丙吉于定國杜延年治民則黄霸王成龔遂鄭𢎞召信臣韓延夀尹翁歸趙廣漢嚴延年張敞之屬宣帝凡二十有四人皆有功迹見述於世參其名臣亦其次也王褒頌聖主得賢臣漢山西將趙充國𫝊賛曰秦漢已来山東出相山西出將將軍白起郿人王翦頻陽人漢興郁郅王圍甘延夀義渠公孫賀傳介子成紀李廣李蔡杜陵蘇建蘇武上邽上官桀趙充國襄武亷褒狄道辛武賢慶忌皆以武勇顯聞蘇辛父子著節此其可稱列者也凡十有五人漢中興將帥馮岑賈𫝊論中興將帥立功名者衆矣惟岑彭馮異建方面之號自函谷以西方城以南兩將之功為大若馮賈之不伐岑公之義信乃足以感三軍而懐敵人故能剋成逺業終全其慶也賛元侯淵謨明啟帝略子翼守温蕭公是埒陽夏膠東竒鋒震敵岑公義信克成逺業吳公龍驤風行巴梁虎牙猛力功立睢陽宫俊休休是以鷹揚好時經武能畫能兵期啟燕門霸氷虖河祭遵好禮臨戎雅歌任邳識幾嚴城解扉純植義發奉兵佐威悃悃安豐奉圗歸忠李通豪贍舍家從䜟王常知命功惟帝念卓茂欵欵情慤徳滿漢河西五守潁川四長陶潛羣輔録河西五守武威梁統金城庫鈞張掖史苞酒泉竺曽燉煌辛彤共推竇融為河西大將軍東伐隗囂後循吏𫝊潁川四長當塗茍淑嬴韓韶大丘陳寔林慮鍾皓皆潁川人以誠篤使人不欺通鑑桓帝永夀二年尚書選能治劇者以韶為嬴長與同郡荀鍾陳皆以徳政稱時謂潁川四長漢東京士左雄𫝊論順帝備𤣥纁束帛以聘南陽樊英天子降寢殿設壇席尚書奉引延問失得於是處士拂巾衽褐以企旌車之招矣若李固周舉之淵謨𢎞深左雄黄瓊之政事正固桓焉􅀭厚以儒學進崔瑗馬融以文章顯吳祐蘇章种暠欒巴牧民之良幹龎參虞詡將帥之宏規王龔張皓虚心以推士張綱杜喬直道以糾違郎顗陰陽詳密張衡機術特妙東京之士於兹盛焉凡二十人漢涼州三明江表虎臣𫝊段熲字紀明與皇甫威明規張然明奐並知名顯達京師稱為涼州三明賛曰山西多猛三明儷蹤注前書曰秦漢以来山東出相山西出將吳志評凡此諸將皆江表虎臣程普黄盖韓當􅃽欽周泰陳武董襲甘寧凌統徐盛潘璋丁奉漢三賢韓愈作後三賢賛王充王符仲長統漢二十四賢羣輔録魏文帝旌表二十四賢杜喬張奐向詡陳蕃施延李膺朱㝢杜宻韓融荀爽房植姜肱陳球王暢申屠蟠張儉鄭𤣥冉璆李固郭泰朱穆魏少英徐穉皇甫規明帝述撰其狀見明帝令及甄表狀蜀漢三傑四英三國志注傅幹曰劉備寛仁有度能得人死力諸葛亮達治知變正而有謀而為之相張飛關侯勇而有義能萬人敵而為之將此三者皆人傑也以劉備之畧三子之才何為不濟傅子華陽國志蜀人以諸葛亮􅃽琬費禕董允為四相號四英三國名臣袁宏𫝊為三國名臣頌云云文選三國名臣序賛云云魏志九人蜀志四人吳志七人共二十人荀彧字文若諸葛亮字孔明周瑜字公瑾荀攸字公達龎統字士元張昭字子布袁煥字曜卿􅃽琬字公琰魯肅字子敬崔琰字季珪黄權字公衡諸葛瑾字子瑜徐邈字景山陸遜字伯言陳羣字長文顧雍字元歎夏侯元字泰初虞翻字仲翔王經字承宗陳泰字元伯唐文章三變文藝傳序唐有天下三百年文章三變髙祖太宗大難始夷沿江左餘風故王楊為之伯𤣥宗好經術崇雅黜浮則燕許擅其宗大厯貞元間美才輩出韓愈唱之栁宗元李翺皇甫湜等和之唐之文為一王法此其極也若侍從酬奉則李嶠宋之問沈佺期王維制冊則常衮楊炎陸贄權徳輿王仲舒李徳􅁉言詩則杜甫李白元稹白居易劉禹錫譎怪則李賀杜牧李商隠皆卓然以所長為一世冠梁肅云唐二百載文章三變初則陳子昂以風雅革浮侈次則張説以宏茂廣波瀾天寶以還李員外蕭功曹賈常侍獨孤常州比肩而作沈約云自漢至魏四百餘年辭人才子文體三變相如形似二班情理子建仲宣氣質唐開元三傑見御詩類富嘉謩吳少㣲魏谷倚北京三傑唐三賢元徳秀𫝊李華兄事徳秀而友蕭頴士劉迅作三賢論曰徳秀當以道紀天下迅當以六經諧人心頴士當以中古易今世徳秀欲齊愚智迅感一物不得其正頴士呼吸折節而獲重禄不易一刻之安使徳秀據師保之位乃見其仁迅被卿佐服居賔友謀諮治亂根原乃見其妙頴士當廢興去就乃見其節然各有病元病酒劉病賞物蕭病貶惡太亟奨能太重隋大業間房李魏公同師文中子司空圖為三賢賛文粹唐四䕫崔造傳永泰中與韓㑹盧東美張正則三人友善自謂王佐才故號四䕫韓愈集云其義以為道可與古之䕫臯者侔唐轅門二龍唐書開元中烏承恩承玭為平盧先鋒號轅門二龍陳翃撰忠武公郭子儀也將佐略録副佐三十三人大將二十七人官至宰相者七人節度使二十八人尚書丞郎京尹十人亷察使五人所書六十人而顯名於世盖五十人猶言得其六七如杜鴻漸黄裳李光弼光顔之徒偉然名世名志翃為郭令公家𫝊八卷書目十卷將佐畧并人在内第九卷行狀第十卷將佐畧唐三俊李紳𫝊紳為翰林學士與李徳􅁉元稹同時號三俊穆宗時封爵書曰五服之章天所以命有徳禮曰以賢制爵記曰以爵崇徳𫝊曰爵不踰徳盖先王封爵必以賢徳者稱之非人主可私也故王嘉曰王者代天爵人尤宜謹之舜賞爵有功商頌長發疏中􅀱握河紀説堯云斯封稷契臯陶賜姓號是堯封之也考河命説舜之事云褒賜羣臣賞爵有功稷契臯陶益土地是舜益地為大國也自契以上大國百里握河紀注云稷契公也公即周禮三公八命其出封加一等然則堯封契已應百里舜又益之者以有大功特加褒賜如周賜魯衞之屬帝王世紀云舜褒賜羣臣尊任伯禹稷契臯陶皆益地夏五等爵殷三等爵周五等爵周五爵王制王者之制禄爵公侯伯子男凡五等諸侯之上大夫卿大夫上士中士下士凡五等天子之三公之田視公侯卿視伯大夫視子男元士視附庸注此地殷所因夏爵三等之制殷爵三等公侯伯也周武王初定天下更立五等之爵増以子男猶因殷之地以九州為界尚狹也周公致太平始斥大九州之界公五百里侯四百里伯三百里子二百里男百里見大司徒所因殷之諸侯以其功黜陟之其不合者皆益地為百里周世有爵尊而國小虢爵卑而國大者唯天子畿内不増以禄羣臣不主為治民正義夏玉帛萬國若不百里七十五十里則不得為萬國殷㣲子箕子是畿内采地之爵元命包云周爵五等象五精春秋三等象三光説者以為文家爵五等質家爵三等虞書輯五瑞修五禮五玉豈復三等乎禮緯含文嘉云殷爵三等夏亦三等案孝經夏制而云公侯伯子男是不為三等也殷以前大夫以上有爵周士亦有爵五等者虞下及周制殷則三等禮職方氏云云正義王制公侯方百里伯七十里子男五十里此夏制五等爵三等受地殷湯因之合伯子男為一惟有公侯伯三等爵三等受地周武王増以子男爵地與夏同周公斥大九州九州方七千里五等之爵五等受地公惟有二王後及東西伯虞虢舊是殷之公至周仍守百里國以無功故也書武成列爵惟五分土惟三注爵五等公侯伯子男正義周禮大司徒諸公之地方五百里侯四百里伯三百里子二百里男百里盖周衰諸侯相併妄為説耳史記三王世家曰周爵五等春秋三等注鄭𤣥曰孔子變周之文從殷之質合伯子男以為一漢地理志周爵五等而土三等盖千八百國而太昊黄帝之後唐虞侯伯猶存王莽𫝊周爵五等地四等有明文公一等侯伯二等子男三等附庸四等殷爵三等有其説無其文注公一等侯二等伯子男三等􅀭子周建子弟列名臣班五爵陸機五等論五等之制始於黄唐湯制爵禄晉地理志成湯敗桀於焦遷鼎於亳伊摯仲虺之徒大明憲典王者之制爵禄公侯伯子男凡五等八州州有二百一十國天子之縣内百里之國九七十里之國二十有一五十里之國六十有三凡九十三國名山大澤不以班餘以為閑田凡九州千七百七十三國同王制王制注禄所受食爵秩次正義總記三王制度陸士衡五等論成湯親照夏之鑑五等之禮不革於時陳氏曰有爵者必有禄有禄不必有爵庶人在官非有爵也而其禄有差葉氏曰禄以詔功爵以詔徳制其等則自公至於下士爵之名也自天子之田方千里至庶人之在官者禄之差也徐氏曰禄爵二柄聖主所以辨儀等定名分立綱維周班爵禄孟子萬章北宫錡問曰周室班爵禄也如之何注問周家班列爵禄等差孟子曰其詳不可得聞也諸侯惡其害已也而皆去其籍注今周禮司禄之官無其職是諸侯去之故不復存孟子時諸侯兼國愈廣受禄逾制齊方百里者十魯百里者五是以去籍然而軻也嘗聞其畧也注今攷之禮記王制則合天子一位公一位侯一位伯一位子男同一位凡五等君一位卿一位大夫一位上士一位中士一位下士一位凡六等諸侯有君道有臣道有君道故與天子同為五等有臣道故與其臣又同為六等天子之制地方千里公侯皆方百里伯七十里子男五十里凡四等不能五十里不達於天子附於諸侯曰附庸春秋邾儀父之類天子之卿受地視侯大夫受地視伯元士受地視子男大國地方百里君十卿禄卿禄四大夫大夫倍上士上士倍中士中士倍下士下士與庶人在官者同禄禄足以代其耕也自君以下所食之禄皆助法之公田藉農夫之力以耕而收其租士之無田庶人在官者但受禄於官如田之入而已次國地方七十里君十卿禄卿禄三大夫大夫倍上士上士倍中士中士倍下士下士與庶人在官者同禄禄足以代其耕也小國地方五十里君十卿禄卿禄二大夫大夫倍上士上士倍中士中士倍下士下士與庶人在官者同禄禄足以代其耕也耕者之所獲一夫百畝百畝之糞上農夫食九人上次食八人中食七人中次食六人下食五人庶人在官者其禄以是為差自古至秦漢無不以穀粟制禄王制正義云禄有穀也大宰八柄爵馭貴禄馭富大司徒以賢制爵以庸制禄司士以徳詔爵以功詔禄大宗伯五命賜則注𤣥謂則地未成國之名王之下大夫四命出封加一等五命賜之以方百里二百里之地者方三百里以上為成國王莽時以二十五成為則方五十里合今俗説子男之地獨劉子駿等識古有此制焉周封八百國千八百國吕氏春秋周所封四百餘服千八百餘漢諸侯表周監二代三聖制法立爵五等封國八百同姓五十有餘周公康叔建於魯衛各數百里太公於齊亦五侯九百之地詩載其制曰介人惟藩功臣表杜業曰唐以萬國致時雍之政虞夏以之多羣后饗共已之治湯法三聖殷氏太平周封八百重譯来賀内恕之君樂繼絶世至於不及下車徳念深矣後漢書阜陵王延𫝊章和元年詔曰周之爵封千有八百姬姓居半以幹王室晋地理志武王歸豐監於二代設爵惟五分土惟三封同姓五十餘國凡千八百國布列於五千里内王制注孝經説云云八淮南子禹平水土定千百國而太昊黄帝之後唐虞侯伯猶存于時治致太平民口千三百七十一萬四千九百三十三盖周之盛也春秋之初尚有千二百國見帝王世紀而見於春秋經𫝊者百有七十國指掌圗云一百二十四國百三十九知其所居魯邾鄭宋至桐亳韓趙三十一國盡亡其處祭極荀賈至鬷夷窮桑蠻夷戎狄不在其間戰國七王又有宋衛中山不㫁如綫志以夏商時諸侯斟尋過戈豕韋之類並列職方氏凡邦國千里封公以方五百里則四公方四百里則六侯方三百里則七伯方二百里則二十五子方百里則百男注周九州之界方七千里方千里者四十九其一為畿内餘四十八八州各有方千里者六周公變殷制小國皆方百里州二百一十國以男備其數餘以為附庸七伯字誤方三百里為方百里九十九為十一伯疏言凡邦國者畿内要服已内有八州州别置百二十一國總有千六百八十國王制云天子縣内九十三國凡九州千七百七十三國是通畿内外為數並是殷周國數也周禮疏又引洛誥𫝊云天下諸侯悉来進受命於周者千七百七十三諸侯注云八州州立二百一十國畿内九十三國王制正義殷末諸侯千二百全周公制禮準王制千七百七十三國言千八百者舉數通典云殷時大國二百四十九次國五百一小國一千二十三列國卿大夫士十萬一千三十二人後漢志注帝王世紀曰周制五等之封凡千七百七十三國又減湯時千三百矣塗山㑹萬國逮湯受命其能存者三千餘國荀子周公立七十一國姬姓五十二六周書世俘解武王服國百五十有二易氏曰孟子所言百里至五十里者除一易再易及山川附庸之地舉民賦之實數言之也此經所言五百里至百里者廣言一易再易與山川附庸之地舉地域之大數言之也名異而實一若夫其食者半諸公其食者三之一侯伯四之一子男後鄭謂公之地以一易侯伯之地以再易子男之地以三易地域雖廣皆以民賦為正又於民賦之中食其所當食之數如授田之法受田皆百畝者民賦也三百畝以至百五十畝者地域也即大司馬令賦之法大司徒王制天子之縣内諸侯禄也外諸侯嗣也注選賢置之於位其國之禄如諸侯不得世外諸侯有功乃封之使之世冠禮記曰繼世以立諸侯象賢也葉氏曰古者公卿大夫有功徳則出封為諸侯是在外世爵者乃内之世祿臣也諸侯有功徳亦入為公卿是内之世祿者或在外之世爵諸侯也内外更易而輕重所以均周爵名荀子正名篇後王之成名刑名從商爵名從周文名從禮注商之刑法未聞康誥曰殷罰有倫爵名從周謂五等諸侯及三百六十官也文名謂節文威儀制爵以徳制祿以功徳有厚薄故爵有崇卑功有多寡故禄有豐殺表記周人尊禮其賞罰用爵列注以尊卑為差舜輯五等諸侯之瑞而班之則五等之爵自舜以来未之有改鄭氏謂殷爵三等非也武王爵列以五土分以三盖襲殷之舊爾周公増損其制上公五百里至男百里盖指開方言之去王制不大相逺矣三等之地正封也五等之附庸廣封也周公斥大九州之界公侯之國盖有増多附庸而百里七十里五十里之制亦無増損此魯所以有七百里而孟子謂周公封魯地方百里也詩曰錫之山川土田附庸附庸舉虚封言之所謂七百里是也土田舉實封言之所謂方百里是也先王之制出為列國之君入為王朝之臣所以一内外也内為三公稱公外而諸侯亦稱公故畢公以父師保釐東土衛侯以列國入相于周周公居東復相成王山甫徂齊式遄其歸春秋以来鄭武公入為周司徒莊公為平王卿士滕侯曰我周之卜正鄭注司徒云凡諸侯為牧正帥長及有徳者乃有附庸非國國皆有書曰萬邦總四海之内大畧而言也禹㑹塗山執玉帛者萬國此左氏之妄不過見東方諸侯耳豈使四海之内㑹於一山下哉名山大川皆天子使吏治之而入其貢賦九州川浸山藪各有職方不屬諸侯之版春秋諸侯或兼而擅之齊斡山海晉私郇瑕守桃林之塞宋有孟諸楚有雲夢皆不入於王官天子縣内諸侯世其禄而不嗣畢髙以父師而保釐東土衞武以列國而入相于周盖與後世出入均勞之意同春秋列國官制無復王制之舊宋置左右二師以擬三公而又有六卿晉三卿將佐皆卿而司馬司空位大夫之列甸侯建國列國數圻魯三家三分公室而各有其一伯者以意之向背為升降諸國以勢之强弱相上下㑹盟征伐先後易序曹杞伯也或居子男之下楚子也或居侯伯之上魯以周班後鄭楚以衷甲先晉滕薛争長蔡衛争先逞其私意不顧王爵周三恪左𫝊襄二十五年子産曰封陳以備三恪注周封夏殷二王後又封舜後謂之恪并二王後為三國其禮轉隆示敬故曰三恪疏鄭𤣥謂杞宋為二王之後薊祝陳為三恪樂記武王克殷未及下車而封黄帝之後於薊帝堯之後於祝帝舜之後於陳下車而封夏之後於杞投殷之後於宋吕氏春秋封黄帝之後於鑄封帝堯之後於黎史記武王封神農後於焦黄帝後於祝堯後於薊與樂記不同之任宿須句顓臾太皥之後莒郯少昊後郊特牲尊賢不過二代二或為三疏案異議公羊説存二王之後通夫三統之義古春秋左氏説周家封夏殷二王之後以為上公封黄帝堯舜之後謂之三恪韋𤣥成等引外傳曰五王之樂可得觀乎知王者所封五代而已鄭駮曰存二王之後命使郊天恪者敬也敬其先聖而封漢二等爵啓九國諸侯王表周監於二代三聖制法立爵五等封國八百同姓五十有餘魯衛各數百里齊亦五侯九伯之地所以親親賢賢褒表功徳深根固本為不可拔也秦自任私智姍笑三代盪滅古法内無骨肉本根之輔外無尺土藩翼之衛故曰周過其厯秦不及期國勢然也漢興之初海内新定同姓寡少懲戒亡秦之敗於是剖裂疆土二等之爵漢封功臣大者王小者侯也功臣侯者百有餘邑尊王子弟大啓九國自鴈門已東盡遼陽為燕代常山以南太行左轉度河濟漸于海為齊趙穀泗以往奄有龜蒙為梁楚東帶江湖薄㑹稽為荆吳師古曰荆吳同是一國文頴曰即今吳也髙六年為荆國十年更名吳北界淮瀕略廬衡為淮南波漢之陽亘九嶷為長沙史記九國之數有淮陽中陳故都暨陽夏扶溝為淮陽諸侯比境周匝三垂北東南也外接胡越天子自有三河東郡潁川南陽自江陵以西至巴蜀北自雲中至隴西與京師内史凡十五郡公主列侯頗邑其中而藩國大者跨州兼郡連城數十宫室百官同制京師然折諸吕之難成太宗之業亦賴之於諸侯也秦紀列侯之下復有倫侯見琅琊臺刻石史諸侯表漢興序二等韋昭曰大者王小者侯髙祖子弟同姓為王者九國唯獨長沙異姓而功臣侯者百有餘人九國燕代齊趙梁楚荆吳淮南淮陽并長沙為十國索隠曰徐廣九國不數吳盖荆絶乃封吳始封楚元王交位第一師古曰以封日先後為次三王世家髙皇帝封建諸侯爵位二等班氏序九國不言淮陽而列長沙師古謂九國之數在下盖不知班氏之失當以遷表為正班氏析異姓同姓為二表則太史公之封二等之叙與文意不屬盖太史公為異姓言也二等為異姓同姓合而言之也若二等之爵不可不載則唯獨長沙異姓六字不當削遷雖於表序總説而表列淮陽固序既明言荆吳淮南長沙而不言淮陽表復不列梁與淮陽又削長沙異姓一句何以知淮陽為九國之數而長沙在外也髙紀兼表六年春正月丙午以故東陽郡鄣郡吳郡五十三縣立劉賈為荆王以碭郡薛郡郯郡三十六縣立弟交為楚王袁載交為先封居第一壬子以雲中鴈門代郡五十三縣立兄喜為代王以膠東膠西臨淄濟北博陽成陽郡七十三縣立子肥為齊王九年正月徙代王如意為趙王十一年正月己丑立子恒為代王三月丙午立子恢為梁王子友為淮陽王十月庚午立長為淮南王十二年十月辛丑濞為吳王荆更為吳三月甲午建為燕王髙紀九年十月淮南梁趙楚王朝未央宫置酒前殿十年十月淮南燕荆梁楚齊長沙王来朝曹元首六代論諸吕擅權而天下不能以揺動者東牟朱虚授命於内齊代吳楚作衛於外也漢賜爵故事賜民爵紀髙祖二年二月立漢社稷施恩惠賜民爵五年五月詔軍吏爵不滿大夫者皆賜爵為大夫故大夫以上賜爵各一級七大夫以上皆令食邑十二年二月詔賜燕吏六百石以上爵皆一級来歸者赦之加爵亦一級惠帝三即位五月賜民爵一級中郎郎中滿六嵗爵三級四嵗二級外郎滿六嵗二級中郎不滿一嵗一級外郎不滿二嵗賜錢萬宦官尚食比郎中謁者執仗執㦸武士騶比外郎太子御驂乗賜爵五大夫舍人滿五嵗二級元年賜民爵戸一級五年長安城成賜民爵戸一級髙后一元年二月賜民爵户一級文帝二即位賜民爵一級元年建太子賜為父後者爵一級景帝七三年六月立膠西中山王四年六月赦賜民爵一級七年四月丁巳立太子賜民為父後者爵一級中元年四月赦五年六月赦皆賜民爵一級後元年三月賜民爵一級中二千石諸王侯相爵右庶長三年正月太子冠賜民為父後者爵一級武帝五建元元年二月赦賜民爵一級元光元年四月赦賜民長子爵一級元狩元年四月丁夘立太子賜中二千石爵右庶長民為父後者一級元鼎四年十月祠五畤元封元年封泰山皆賜民爵一級昭帝二始元五年六月賜中二千石以下吏民爵各有差元鳳四年正月丁亥帝加元服賜中二千石以下及民爵宣帝十四本始元年五月鳳皇集賜吏二千石諸侯相下至中郎官宦吏六百石爵各有差自左更至五大夫賜人爵各一級孝者二級二年六月尊世宗廟賜民爵一級地節三年四月戊申立太子賜御史大夫爵關内侯中二千石爵右庶長天下當為父後者爵一級元康元年二月鳳皇集甘露降賜勤事吏中二千石㠯下至六百石爵自中郎吏至五大夫佐史以上二級民一級二年三月以鳳皇甘露降集賜吏爵二級民一級三年春四年三月神爵元年三月皆賜吏爵二級民一級神爵四年二月賜民爵一級四月潁川黄霸治行賜吏民有行義者爵人二級力田一級五鳳元年正月太子冠賜列侯嗣子爵五大夫為父後者爵一級三年三月甘露二年正月皆賜民爵一級三年二月單于朝賜民爵一級元帝八初元二年正月賜雲陽民爵一級四月丁巳立太子賜御史大夫爵關内侯中二千石右庶長天下當為父後者爵一級四年三月祠后土賜民爵一級永光元年三月二年二月賜吏民爵建昭五年三月賜民爵一級竟寧元年正月皇子冠賜列侯嗣子爵五大夫天下為父後者爵一級成帝七建始三年三月賜孝弟力田爵二級河平元年三月改元賜吏民爵四年正月賜孝弟力田爵二級鴻嘉元年二月賜民爵一級永始二年二月吏民入穀者百萬以上加賜爵右更三十萬以上賜爵五大夫四年正月賜雲陽吏民爵綏和元年二月癸丑立太子賜天下當為父後者爵哀帝二平帝一光武三建武二十九年二月庚申三十年五月三十一年五月戊辰賜男子爵人二級顯宗六中元二年即位四月丙辰賜天下男子爵人二級三老孝弟力田人三級爵過公乗得移與子及流人無名數欲自占者人一級永平三年二月甲子立太子十二年五月丙辰同十五年四月庚子賜男子爵人三級十七年五月戊子賜男子爵人二級三老孝弟力田人三級流人無名數欲占者人一級十八年四月己未賜男子爵人二級流民無名數欲占者人一級肅宗四永平十八年即位十月丁未大赦賜民爵人二級為父後及孝悌力田人三級脱無名數及流人欲占者人一級爵過公乗得移與子建初三年三月癸巳立后賜爵人二級三老孝悌力田人三級民無名數及流人欲占者人一級元和二年五月戊申詔祖宗舊事或班恩施其賜天下吏爵人三級九月壬辰詔鳳皇黄龍所見亭部加賜男爵人二級先見者帛二十疋近者三疋太守三十疋令長十五疋丞尉半之它如賜爵故事和帝三安帝七順帝五質帝三桓靈獻皆一賜爵故事立社稷即位立皇太子王皇子皇太子冠改元征代力役募民徙塞晁錯言守備曰募民以往皆賜高爵復其家封禪祥瑞帝加元服尊廟號褒吏治灾異匈奴來朝惠六年文後六年令民得賣爵荀氏漢紀曰賜民爵所以宣恩惠慰人心也庾峻曰秦時不知徳惟爵是聞故閭閻以公乗侮其鄉人郎中以上爵傲其父兄大事記普賜天下民爵自惠帝始後紀注商鞅為秦制爵二十級賜爵者有罪得贖貧者得賣與人漢制賜爵自公士已上不得過公乗故過者得移授也明帝紀爵過公乗得移與子注云云漢二十等爵列侯印執帛執圭上聞爵百官表爵一級曰公士師古曰言有爵命異於士卒也二上造言有成命於上也三簮裊以組帶馬曰裊言飾此馬也四不更言不豫更卒之事五大夫列位從大夫六官大夫七公大夫加官公者示稍尊也八公乗得乗公家之車九五大夫大夫之尊也十左庶長卜式桑𢎞羊為之十一右庶長庶長言為衆列之長十二左更十三中更十四右更更言主領更卒部其役使十五少上造十六大上造言皆主上造之士也起商鞅為大良造即大上造也白為左庶長明年為左更遷為國尉明年為大良造公孫衍為大良造十七駟車庶長言乗駟馬之車而為衆長也十八大庶長又更尊也十九關内侯言有侯號而居京畿無國邑二十徹侯言其爵位上通於天子皆秦制左傳正義云成十三年有不更女父襄十一年有庶長鮑庶長武春秋之世已有此名盖後世以漸増之商君定為二十非是商君盡新作也徹侯金印紫綬避武帝諱曰通侯或曰列侯改所食國令長名相又有家丞門大夫庶子諸侯王高帝初置金璽盭綬掌治其國蔡邕云漢制皇子封為王其實諸侯也漢舊儀云諸侯王黄金璽橐駞紐文曰璽髙紀五年五月詔曰民各歸其縣復故爵七大夫以上皆令食邑師古曰七大夫公大夫也爵第七臣瓉曰秦制列侯乃得食邑令七大夫以上皆食邑所以寵之又曰七大夫公乗以上皆髙爵也諸侯子及從軍歸者甚多髙爵吾數詔吏先與田宅及所當求於吏者亟與爵或人君上所尊禮久立吏前曽不為決異日秦民爵公大夫以上令丞與亢禮今吾於爵非輕也吏獨安取此其令諸吏善遇髙爵八年春三月令爵非公乗以上毋得冠劉氏冠十二年三月詔有功者上致之王次為列侯下乃食邑為列侯食邑者皆佩之印賜大第室吾於功臣亡負矣惠紀云爵五大夫上造以上續志列侯所食縣為侯國黄瓊曰諸侯以戸邑為制不以里數為限本注曰承秦爵二十等為徹侯後避武帝諱為列侯金印紫綬以賞有功功大者食縣小者食鄉亭得臣其所食吏民舊列侯奉朝請在長安者位次三公中興以来唯以功徳賜位特進者次車騎將軍胡廣漢制度曰功徳優盛朝廷所敬異者賜位特進在三公下不在車騎下賜位朝侯次五校尉賜位侍祠侯次大夫其餘以肺附及公主子孫奉墳墓於京師者亦隨時見㑹位在博士議郎下諸王封者受茅土歸以立社稷列侯特進朝侯賀正月執璧云云云關内侯承秦賜爵十九等無土寄食在所縣民租多少各有戸數為限荀綽晉百官表注曰時六國未平将帥家皆關中故以為號古今注曰建武六年初令關内侯食邑者奉月二十五斛注劉劭爵制曰春秋𫝊襄十一年有庶長鮑左𫝊不更女父注秦爵為秦紀有庶長弗忌商鞅為左庶長白起左更樗里子爵右更商君為政修其法品為十八級合關内侯列侯凡二十等其制因古義古者天子寄軍政於六卿居則以田警則以戰在國則以比長閭胥族師黨正州長鄉大夫為稱在軍則以卒伍司馬將軍為號所以異在國之名也秦依古制其在軍賜爵為等級其帥人皆更卒也有功賜爵則在軍吏之例自一爵以上至不更四等皆士也大夫以上至五大夫五等比大夫也九等依九命之義也自左庶長以上至大庶長九卿之義也關内侯者依古圻内子男之義也列侯者依古列國諸侯之義也然則卿大夫士下之品皆倣古比朝之制而異其名亦所以殊軍國也古者以車戰兵車一乗步卒七十二人分翼左右公士步卒之有爵者上造造成也古者升司徒曰造士雖依此名皆步卒也簮褭御駟馬者要褭古之名馬也駕駟馬者其形似簮不更者為車右不復與凡更卒同也大夫者在車左者也官大夫公大夫公乗五大夫皆軍吏也吏民爵不得過公乗得貰與子若同産然則公乗者軍吏之爵最髙者也云云自左庶長已上至大庶長皆卿大夫皆軍將也所將皆庶人更卒故以庶更為名大庶長即大將軍也左右庶長即左右偏裨將軍也貨殖𫝊秦漢之制列侯封君食租税嵗率户二百千戸之君則二十萬朝覲聘享出其中列𫝊樊噲卻敵賜爵國大夫即官大夫擊章邯軍賜爵列大夫即公大夫破李由軍賜上聞爵如淳曰魏文侯勝齊天子賞文侯以上聞見吕氏春秋晉灼曰名通於天子也成武卻敵賜爵五大夫破趙貫軍賜爵卿攻宛陵先登賜爵封號賢成君東攻宛城西至酈賜重封師古曰加二號漢王賜噲爵為列侯號臨武侯商君為法於秦戰斬一首者賜爵一級有軍功者各以率受上爵曹參賜爵七大夫遷五大夫封執帛遷執珪張晏曰孤卿執帛侯伯執珪以朝位比之如淳曰吕氏春秋得伍員位執珪古爵也戰國䇿楚昭陽曰官為上柱國爵為上執珪灌嬰賜爵七大夫執帛執圭夏侯嬰賜爵七大夫五大夫執帛執圭賜爵封賜爵列侯號昭平侯周勃下邑先登賜爵五大夫傅寛以魏五大夫騎将從賜爵卿朱博為丞相封陽鄉侯食邑二千戸上書讓曰故事封丞相不滿千戸願還千戸許之表元朔三年十一月乙丑平津侯公孫𢎞以丞相詔所褒侯三百七十三戸征和四年六月丁巳富民侯車千秋以丞相侯八百戸平當𫝊御史大夫至丞相以冬月賜爵關内侯注如淳曰漢儀注御史大夫為丞相更春乃封李竒曰以冬月非封侯時關内侯食邑舊無邑此特恩也田廣明宗正徳典屬國武蕭望之李沮李息竇如意騎士孟已校尉敢陳湯後漢桓榮又鄧彪賜爵關内侯漢賣爵令食貨志文帝十二年􅏯錯説上曰今募天下入粟縣官得以拜爵帝從之令民入粟邊六百石爵上造稍増至四千石為五大夫萬二千石為大庶長各以多少級數為差晁錯𫝊言郡縣之民得買其爵以自増至卿注師古曰二十等爵無卿盖謂其等級同卿者景帝時上郡以西旱復修賣爵令裁其賈音價以招民景紀後二年五月詔曰今訾算十以上召得官云訾算四得官亡令亷士失職注十算十萬也武帝時民多買復及五大夫千夫征發之士益鮮於是除千夫五大夫為吏不欲者出馬令吏入穀補官郎至六百石入財得補郎𢎞羊請令民得入粟補吏入粟甘泉各有差卜式數入財佐縣官超拜中郎賜爵左庶長翊黄霸入錢賞官補侍郎謁者復入穀沈黎郡補左馮二百石卒史紀成帝鴻嘉三年夏四月令吏民得買爵賈級千錢永始二年二月乙酉晦詔關東比嵗不登吏民入穀助賑贍者其百萬以上加賜爵右更第十四爵欲為吏補三百石吏遷二等三十萬以上賜爵五大夫吏亦遷二等民補郎云云後紀安帝永初三年四月丙寅三公以國用不足奏令吏人入錢穀得為關内侯虎賁羽林郎五大夫官府吏緹騎營士各有差桓帝延熹四年七月賣關内侯虎賁羽林緹騎營士五大夫錢各有差亦見後史記秦始皇四年七月令百姓内粟千石拜爵一級惠帝紀元年十二月民有罪得買爵三十級以免死罪應邵曰一級直錢二千凡為六萬若今贖罪入三十疋縑矣六年十月令民得賣爵漢武功爵武紀元朔元年匈奴入遼西漁陽鴈門衛青獲首虜二年匈奴入上谷漁陽衛青獲首虜收河南地置朔方五原郡四年匈奴入代定襄五年衛青將六將軍兵斬首虜萬五千級六年四月復將六將軍絶幕大克獲六月詔曰今中國一統而北邊未安朕甚悼之大將軍巡朔方征匈奴斬首虜受爵賞而欲移賣者無所流貤其議為令有司奏請置武功賞官以寵戰士食貨志武帝時大司農陳臧錢經用賦税既竭不足以奉戰士有司請令民得買爵及贖禁錮免臧罪請置賞官名曰武功爵注臣瓉曰茂陵中書有武功爵一級曰造士二級曰閑輿衛三級曰良士四級曰元戎士五級曰官首六級曰秉鐸七級曰千夫八級曰樂卿九級曰執戎十級曰政戾庶長十一級曰軍衛此武帝所制以寵軍功師古曰此下云級十七萬凡直三十餘萬金今瓚所引茂陵中書止於十一級則計數不足與本文乖戾或有茂陵書所説不盡也級十七萬劉氏曰賣爵當級級稍増其價豈可例云級十七萬盖武功爵其級十七誤衍萬字凡直三十餘萬金請買武功爵官首者試補吏先除千夫如五大夫注師古曰五大夫舊二十等爵之第九級也至此以上始免徭役故每先選以為吏千夫者武功十一等爵之第七級也亦得免役今則先除為吏比於五大夫也其有罪又減二等爵得至樂卿以顯軍功注樂卿者武功爵第八等也言買爵唯得至第八也軍功多用超等大者封侯卿大夫小者郎楊僕傳以千夫為吏注千夫謂武功賞官嬰功臣表須無曽孫秉鐸聖注秉鐸武功爵第六級灌曽孫官首匿注官首爵名荀悦申鑒曰孝武以四夷未賔㓂賊姦軌初置武功賞臣以寵戰士若今依此科而崇其制置尚武之官以司馬兵法選位秩比博士講司馬之典簡蒐狩之事賞軍功爵賞小統於五校大統於太尉既周時務禮亦冝之漢永光録功拜爵見兵捷類馮奉丗漢亦作魏六等爵魏志漢建安十二年二月大封功臣二十餘人皆為列侯建安二十年冬十月始置名號侯爵十八級關中侯爵十七級皆金印紫綬置關内外侯十六級銅印龜紐墨綬五大夫十五級銅印環紐墨綬皆不食租與舊列侯關内侯凡六等以賞軍功裴松之以為今之虚封盖自此始魏明帝太和六年二月詔封諸侯王以郡為國魏五等爵晉封建制五等封晉紀魏咸熙元年七月荀顗定禮儀賈充正法律裴秀議官制太保鄭冲總而裁焉始建五等爵晉武帝泰始二年二月己未詔曰五等之封皆録舊勲本為縣侯者𫝊封次子為亭侯為鄉侯為關内侯亭侯為關中侯皆食本戸十分之一地理志魏黄初三年三月乙丑初制封王之庶子為鄉公嗣王之庶子為縣侯公侯之庶子為亭伯晉文帝為晉王命裴秀等建立五等之制唯安平王孚邑萬戸其餘縣公邑千八百戸地方七十五國大國侯邑千六百戸地方七十里次國侯邑千四百戸地方六十五里大國伯邑千二百戸地方六十里次國伯邑千戸地方五十里大國子邑八百戸地方五十里次國子邑六百戸地方四十五里男邑四百户地方四十里裴秀𫝊魏咸熙初議五等之爵自騎督以上六百餘人皆封於是封秀濟川侯地方六十里邑千四百戸髙柔𫝊咸熙中開建五等封孫渾昌陸子􅃽濟孫凱為下蔡子劉放子正方城子孫資子宏離石子王祥睢陵侯王覽即丘子羊祜鉅平子傅秖涇原子鄭袤宻陵伯傅元鶉觚男賈充臨沂侯為晉元勲職官志咸寧三年楊珧荀朂追裴秀立五等封建之㫖詔議其制有司奏諸王公更制戸邑皆中尉領兵平原汝南琅邪扶風齊為大國梁趙樂安燕安平義陽為次國餘為小國又為郡公制度如小國王中尉領兵郡侯如不滿五千戸王置一軍亦中尉領之増魯公户邑進王沈郡公羊祜郡侯南宫王承隋王萬各増邑為三千户制度如郡侯置一軍自此非皇子不得為王而諸王支庶各推恩受封為公侯伯子男伯子男以下不置軍大國中軍二千人上下軍各千五百次國上軍二千人下軍千人晉改定國秩成帝紀咸和元年十一月壬子改定王侯國秩九分食一石唐三恪㑹要武徳元年五月二十二日以酅公介公共為二王後周隋永昌元年以周漢後為二王舜禹湯之裔為三恪神龍元年五月復舊天寳七載五月詔後魏裔孫為三恪八載孝文十代孫元伯明韓國公九載求殷周漢後為三恪唐九等爵實封鐵券銘功百官志司封凡爵九等一曰王食邑萬戸正一品二曰嗣王郡王五千戸從一品三曰國公三千戸從一品四曰開國郡公二千戸正二品五曰開國縣公千五百戸從二品六曰開國縣侯千戸從三品七曰開國縣伯七百戸正四品八曰開國縣子五百戸正五品上九曰開國縣男三百戸從五品上通典並云其上加實封者仍給租庸皇兄弟皇子封國為親王皇太子子為郡王親王子承嫡為嗣王諸子為郡公以恩進者封郡王襲郡王嗣王者封國公凡封戸三丁以上為率嵗租三之一入于朝廷食實封者得真户分食名山大川畿内地不封㑹要貞觀二十三年九月八日敕諸王食一千户封開元二十年五月十日勅諸食實封並以三丁為限𤣥宗紀兼舊史等書開元五年五月丙辰詔公侯子孫襲封十年十一月乙未詔宰相共食實封三百戸以七丁為限堂封自此始二十四年欲賜牛仙客實封張九齡曰漢法非有功不封唐遵漢法太宗之制也劉幽求𫝊兼月日景雲二年拜侍中十月甲辰璽詔曰幽求翊賛聖儲震殄元惡雖胙以土宇而賦入未廣昔西漢行封更擇多户東京定賞復増大邑宜加賜實封二百戸子孫𫝊國無絶特免十死銘諸鐵券以𫝊其功㑹要劉幽求七百戸先天二年八月十一日勅臨淄王封韋氏預參大䇿唐賜爵紀髙宗乾封元年正月壬申以封禪大赦改元中宗神龍元年九月壬午祀明堂大赦𤣥宗天寳八載閏月丙寅謁太清宫大赦徳宗大厯十四年六月己亥即位大赦皆賜民古爵唐開元新制公主𫝊開元新制長公主封戸二千帝妹戸千率以三丁為限皇子王户二千主半之左右以為薄帝曰百姓租賦非我有士出萬死賞不過束帛女何功而享多户邪使知儉嗇不亦可乎於是公主所廩殆不給車服後咸宜益封至千戸諸王皆増自是著于令主不下嫁亦封千戸㑹要開元十年加永穆公主封一千户至乾元元年三月一日諸公主宜各給五百戸諸王𫝊唐制親王封戸八百増至千髙宗時沛英豫三王始踰制開元後天子睦兄弟宋王戸至五千五百岐薛王五千申王四千邠王千八百帝追思薛王業引見子瑗等下詔共賜實封千户瑗為樂安王瑒滎陽王宗正卿琄為嗣薛王㑹要景龍三年食封邑者一百四十餘家應出封戸凡五十四州百姓著封戸者甚於征行十一月御史宋務光上疏曰近者封建頗縁恩澤功無横草人已分茅沃壤名藩多入侯國邑收家税半於天府伏惟酌宗周之前訓咨武徳之舊章地匪宗盟勲殊社稷不宜加於食邑自可寵以虚名兵部尚書韋嗣立上疏曰食封之家用六十餘萬丁計一百二十萬匹已上皇運之初功臣食封纔三二十家今恩澤受封至百四十家已上私門資用有餘國家支計不足原闕先天二年八月己亥以中書令張説祭酒禇無量輔導有功説封燕國公食實封三百戸無量舒國公二百戸吳湊繇布衣與兄溆一日賜官封皆等端拱賜爵端拱元年閏五月丙申賜髙年百二十人爵為公士秦漢以後不復賜民爵自藉田禮成正月乙亥詔書始復賜焉開寳中澶宻等州民年八十以上吕繼美等二十九人並賜爵公士咸平五年十二月賜京城父老百十九嵗祝道嵒爵公士祥符三年三月戊辰賜祥符等縣年八十以上者爵公士祥符二年七月乾封民以天書降其地賜爵公士景徳天禧間民能禽盜者亦賜景祐封國三等景祐三年正月戊子學士承㫖章徳象上封國名三等皆遞升其宋趙梁夀四國不以封從之唐制食實封者給縑帛唐末五代始有特加邑戸而罷實封之給又去縣公之名封侯以郡皇朝沿其制文臣少卿監武臣副率以上有封爵丞郎學士刺史大將軍以上有實封但以増戸數為差邑過其爵則并進爵焉止於開國郡公每加食邑自千戸至二百戸實封自六百戸至百戸皆六等親王重臣或特加有踰千戸者凡加食邑宰相千戸實封四百戸餘降麻官七百戸實封三百戸直學士以上五百戸實封二百戸舎人待制以上實封一百戸食邑三百戸封縣開國男五百戸封子七百戸封伯千户封郡侯二千戸封公千五百户以上始加實封惟將相食邑萬户即開國景祐三年詔春秋秦漢以来下及皇朝所封舊名别分大次小三等以為定制焉趙至唐為大國相至涼為次國江滕至潤華為小國慶厯七年詔使相未滿萬戸皆得封杜衍特宣皇屬特封郡縣公或贈侯者無開國字又采秦制賜民爵曰公士其王公以下封國之名舊有大次小三等以為進封之叙然每封拜又有權升次小國為大國者元豐三年九月十七日詔見任宰相使相食邑實封通及萬戸前宰相食邑及萬戸封公閏九月御史言曹佾以外戚封郡王祖宗以来未有佾比嘉祐封崇義公嘉祐四年四月癸酉詔以柴氏後為崇義公奉周祀給公田十頃先是著佐何鬲言宜訪唐周苗裔備二王後禮院議唐世已逺惟周義不可廢遂封柴詠丗宗後孫也朝有大禮則入侍祠玉海卷一百三十四
