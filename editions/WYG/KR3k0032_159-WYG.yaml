body:
  text: 玉海卷一百五十九宋王應麟撰宫室殿上說文堂之髙大者周益公曰宫室取諸大壯貴賤可以通稱特崇庳廣狹有别耳秦孝公強盛時大築冀闕由是天子殿名初見商子定分篇臣侍殿上兵陳殿下後載史記荆軻𫝊又莊子說劒云入殿門不趨大抵秦制也至始皇併天下殿屋相屬又作甘泉前殿然後殿之名始立漢黄霸丞相府計吏上殿東漢司徒府有大㑹殿蓋車駕或臨幸㑹議於此而有殿名非專指屋之髙嚴也燕禮當東霤注人君為殿屋也疏曰漢時殿屋四向流水故舉漢以况周王文選注魏武集荀欣等曰漢制所居曰禁中諸公所居曰省中漢武臺殿李陵傳天漢三年召見武臺注師古曰未央宫有武臺殿三輔舊事武帝於未央宫起高門武臺殿翼奉傳孝文時未央宫無武臺殿漢魯靈光殿東海㳟王彊𫝊初魯㳟王好宫室起靈光殿甚壯麗是時猶存故詔彊都魯注㳟王名餘景帝之子殿在今兖州曲阜城中故基東西二十丈南北十二丈高丈餘王延壽遊魯國作靈光殿賦㳟王始都下國好治宫室遂因魯僖基兆而營焉遭漢中微自西京之殿皆見隳壊而靈光巋然獨存豈非神明依憑支持以保漢室然其規矩制度上應星宿亦所以永安也奚斯頌僖歌其路寢云云立靈光之秘殿配紫微而為輔承明堂於少陽昭列顯於奎之分野規矩應天上憲觜陬雲楶藻梲龍桷雕鏤據坤靈之寳勢承蒼昊之純殷窮竒極妙棟宇已來未之有兮神之營之瑞我漢室永不朽兮唐元稹曰魯共王餘畫先賢於屋壁以自警漢前殿見未央宫甘泉宫洛陽南宫北宫宣室周曰路寢漢曰前殿樂志凡鼓八員朝賀置酒陳前殿房中朱博傳拜於前殿延登受䇿揚雄𫝊甘泉賦前殿崔巍兮和氏瓏玲抗浮柱之飛榱兮神莫莫而扶傾後律志天子以冬夏至御前殿史記秦始皇營作朝宫渭南苑中先作前殿漢承明殿承明廬著作庭魏承明門翼奉𫝊孝文時未央宫獨有承明霍光傳皇太后廼車駕幸未央承明殿嚴助𫝊為㑹稽太守數年不聞問賜書曰君厭承明之廬勞侍從之事故出君為郡吏注張晏曰承明廬在石渠閣外直宿所止曰廬揚雄𫝊孝成時有薦雄文似相如者召雄待詔承明庭注師古曰承明殿在未央宫成紀鴻嘉二年三月雉集承明殿注在未央宫中黄圖未央宫有承明殿著述之所也西都賦又有承明金馬著作之庭大雅宏達於兹為羣啓發篇章校理秘文文選魏曹子建詩謁帝承明廬注陸機洛陽記承明門後宫出入之門張公云魏明帝作建始殿朝㑹皆由承明門魏應璩詩三入承明廬注直廬在承明門側璩為侍郎常侍侍中漢高門殿列傳汲黯請間見高門注晉灼曰三輔黄圖未央宫中有髙門殿鮑宣為諫大夫上書陛下擢臣巖穴豈徒欲使臣美食大官重髙門之地哉宣又言髙門去省戸數十歩求見出入二年未省注晉灼曰髙門殿名也師古曰在未央宫中翼奉上疏曰孝文時未央宫無高門殿三輔舊事武帝於未央宫起髙門武臺殿漢猗蘭殿文選注漢武故事武帝以乙酉年七月七日旦生於猗蘭殿又見洞㝠記景帝坐崇芳閣見赤氣如林來蔽戸牖乃改閣為猗蘭殿漢竒華殿承華殿承光殿見建章宫黄圖竒華殿在建章宫旁四海夷狄器服珍寳火浣布切玉刀巨象大雀師子宫馬充牣其中漢武故事七月七日上於承華殿齋正中忽有一鳥從西方來集殿前東方朔曰此西王母欲來也有頃王母至二青鳥夾侍文選注潘岳闗中記曰未央殿東有鴛鸞殿漢玉堂殿揚雄𫝊解嘲歴金門上玉堂注晉灼曰黄圗有大玉堂小玉堂殿漢宫閣名曰長安有玉堂殿銅柱殿李㝷𫝊乆汙玉堂注師古曰玉堂殿在未央宫選注引黄圗同翼奉𫝊上疏曰孝文時未有玉堂殿至武帝有之谷永𫝊抑損椒房玉堂之盛寵注玉堂嬖幸之舍黄圗玉堂殿在未央宫殿西漢書建章宫南有玉堂璧門玉層臺髙三十丈玉堂殿内十二門階陛皆玉為之鑄銅鳯髙五尺飾黄金栖屋上下有轉樞向風若翔椽首薄以璧玉飾之因名曰璧門又建章有玉堂與未央前殿等去地十二丈戺基皆用玉西都賦金華玉堂西京賦神仙長年宣室玉堂麒麟朱鳥龍興含章注皆殿名譬衆星之環極云云靈帝紀中平三年復修玉堂殿鑄銅人四黄鍾四及天禄蝦蟆洛陽宫殿名有玉堂前後殿漢函德殿宣紀神爵元年三月詔曰廼元康四年嘉穀元稷降于郡國神爵仍集金芝九莖產于函德殿銅池中黄圗建章宫有函德等二十六殿漢鳯皇殿又見未央宫溫室殿見室類郊祀志宣帝幸河東之明年神爵二年正月鳯皇集𤭔𤭔於所集處起步夀宫間嵗鳯皇神爵甘露降集京師其冬四年十二月鳯皇又集上林廼作鳯皇殿以荅嘉瑞明年正月改元五鳯宣帝時鳯皇下郡國凡五十六所翼奉𫝊孝文時未央宫無髙門武臺麒麟鳯皇白虎玉堂金華之殿黄圗未央宫有鳯皇飛羽通光等殿闗中記未央殿東有鳯皇殿鴛鸞殿西京賦鳯皇鴛鸞注皆後宫别名漢白虎殿杜欽𫝊兼成紀谷永𫝊建始三年冬十二月舉直言極諫之士四年夏四月復召直言之士杜欽谷永詣白虎殿對䇿注師古曰此殿在未央宫中王商傳河平四年紀春正月單于來朝引見白虎殿丞相王商坐未央庭中單于拜謁商起離席與言單于仰視商貌大畏之遷延却退天子聞而歎之曰此真漢相矣翼奉𫝊文帝時未央宫又無髙門武臺麒麟鳯皇玉堂白虎金華之殿獨有前殿曲臺漸臺宣室温室承明耳外戚𫝊成帝時楚梁王來朝明旦當辭去上宿供張白虎殿王莽傳大置酒未央宫白虎殿勞賜將帥自前殿南下椒除西出白虎門桓子新論與揚子雲奏事坐白虎殿廡下選注引之黄圖未央宫有白虎殿廟記云未央宫有白虎閣西都賦白虎麒麟後廣平王羡𫝊建初四年羡與諸儒講論於白虎殿此後漢殿在東都乂兩都襲其名蓋漢家右文之地後漢甘泉有白虎觀漢昭陽殿曲臺殿見臺類飛羽殿西都賦昭陽獨盛隆於孝成屋不呈材墻不露形注昭陽殿名趙后傳皇后既立寵少衰而弟絶幸為昭儀居昭陽舍其中庭彤朱而殿上髹漆砌皆銅沓冒黄金塗白玉階壁帶徃徃為黄金釭函藍田璧明珠翠羽飾之自後宫未嘗有焉又見後宫元后傳饗飫飛羽或作雨注飛羽殿在未央宫中漢金華殿叙傳成帝時大将軍王鳯薦班伯宜勸學召見宴昵殿親戚宴飲㑹同之殿拜為中常侍時上方鄉學鄭寛中張禹朝夕入說尚書論語於金華殿中詔伯受焉數年金華之業絶翼奉𫝊孝文帝時未央宫無金華殿黄圖未央宫有金華殿西都賦金華玉堂注黄圖曰未央宫有金華殿大玉堂殿漢紫殿成紀永始四年春正月行幸甘泉郊泰畤神光降集紫殿西京雜記成帝設雲帳雲幄雲幕於甘泉紫殿世謂三雲殿張臨登閣殿漢麒麟殿董賢傳上置酒麒麟殿賢父子親屬宴飲翼奉傳孝文時未央宫無麒麟殿西都賦白虎麒麟注黄圖在未央宫西京賦麒麟朱鳥龍興含章注皆殿名譬衆星之環極漢明光殿詳見宫類漢官儀尚書奏事於明光殿省中以丹朱漆地故曰丹墀尚書伏其下奏事黄門侍郎揖疏受事三秦記桂宫中有明光殿皆金玉珠璣為簾箔金戺玉階晝夜光明唐樊鑄有明光殿粉壁賦漢清凉殿延清室黄圖清凉殿夏居之則清凉也亦曰延清室漢書曰清室中夏含霜即此見七啟云漢書誤西都賦清凉宣温注黄圖曰未央宫有清凉殿許昌宫賦魏卞蘭有望舒凉室羲和温房彼避暑九成而忘其親生凉殿閣而忘其民心移於物賢君所當戒也漢臨華殿成紀永始四年四月癸未長樂臨華殿未央宫東司馬門災漢百官朝㑹殿司徒府大㑹殿詳見朝儀類周禮槁人掌共外内朝宂食者之食注外朝司㓂斷獄弊訟之朝也今司徒府中有百官朝㑹之殿云天子與丞相舊决大事焉是外朝之存者與朝士掌建邦外朝之灋注今司徒府有天子以下大㑹殿亦古之外朝正義云以漢法説之小宗伯凡王之㑹同軍旅甸役之禱祠肄儀為位注謂若今時肄司徒府也小宗伯主其位黄霸𫝊張敞奏曰丞相請雜問郡國上計長吏其對有舉孝悌者為一軰先上殿師古曰丞相所坐屋也舉而不知人數者次之不為條教者在後西都賦朝堂百僚之位蕭曹魏邴謀謨其上百官志云云注司徒司空二府光觀壯麗古今注曰永平十五年更作太尉司徒司空府開陽城門内蔡質漢儀曰司徒府與蒼龍闕對厭於尊者不敢號府應劭曰不然丞相舊位在長安時府有四岀門隨時聽事明帝欲依之廹於太尉司空但為東西門耳國每有大議天子車駕親幸其殿殿西王侯以下更衣併存每歲州郡聽採長吏臧否民所疾苦還條奏之是謂舉謡言舉謡言者掾屬令史都㑹殿上主者大言某州郡行狀周禮有外朝干寳注曰禮司徒府中有百官朝㑹殿與鄭注同律厯志熹平四年馮光陳晃言厯元不正乙夘詔書下三府與儒林明道者詳議以羣臣㑹司徒府議注蔡邕集載三月九日百官㑹府公殿下東面校尉南靣侍中郎将大夫千石六百石重行北面議郎博士西靣戸曹令史當中坐而讀詔書公議蔡邕前坐侍中西北近公卿與光晃相難問是非焉趙壹傳光和元年司徒袁逢受計計吏數百人皆拜伏庭中耿秉𫝊每公卿㑹議常引秉上殿訪以邉事多簡帝心漢未央之内為内朝未央之外為治朝司徒府大㑹殿為外朝晉令有朔望集公卿於朝堂而論政事漢却非殿光武紀建武元年冬十月癸丑車駕入洛陽幸南宫却非殿遂定都焉注雒陽宮閣名有却非殿洛陽故宮名曰洛陽有却非門漢宣徳殿馬援傳建武四年冬囂使援奉書洛陽援至引見於宣徳殿東觀記曰敕令中黄門引入時上在宣徳殿南廡下袒幘坐世祖迎笑謂援曰云云又援鑄馬式上之詔置於宣德殿下黄圗未央宫有宣徳殿此係西京王閎帶劍至宣徳殿後闥漢陽明殿㑹稽典録嚴遵字子陵建武五年詔召遵設樂陽明殿命宴㑹暮留宿其夜客星犯天子宿𨽻釋國三老袁良碑云拜梁相帝御九龍殿引對漢南宫前殿光武紀建武十四年正月起南宫前殿五行志南宫長秋和歡殿漢邯鄲温明殿耿弇傳光武居邯鄲宫晝卧温明殿弇入造牀下請間注趙王如意之殿也故基在今潞州邯鄲縣内漢徳陽殿朝賀禮儀志毎月朔歲首為大朝受賀儀夜漏未盡七刻鐘鳴受賀及䞇公侯璧中二千石二千石羔千石六百石鴈四百石以下雉百官賀正月二千石以上上殿稱萬歲舉觴御座前司空奉羮大司農奉飯奏食舉樂百官受賜宴饗大作樂其每朔惟十月旦從故事者髙祖定秦之月元年歲首也注蔡質漢儀曰正月旦天子幸徳陽殿臨軒公卿將大夫百官各陪朝賀蠻貊胡羌朝貢畢見屬郡計吏皆陛覲庭燎宗室諸劉雜㑹萬人以上大官賜食酒御史四人執法殿下虎賁羽林弧弓撮矢陛㦸左右戎頭偪脛啓前向後左右中郎將住東西羽林虎賁將東北五官將中央悉坐就賜作九賓徹樂鐘磬並作樂畢作魚龍曼延小黄門吹三通謁者引公卿羣臣以次拜罷徳陽殿周旋容萬人陛髙一丈皆文石作壇激水殿下畫屋朱梁玉階金柱刻鏤作宫掖之好厠以青翡翠一柱二帶韜以赤緹天子正旦節㑹朝百僚于此雒陽宫閣簿云南北行七丈東西行三十七丈四尺晉樂志鐸舞歌幡舞歌各一篇鼓舞伎六曲並陳於元㑹後漢正旦天子臨德陽殿受朝賀晉禮志漢武帝雖用夏正至於十月朔猶常享㑹大作樂如元正之儀其儀同後漢志鍾離意傳徳陽殿成百官大㑹明帝思意言謂公卿曰鍾離尚書在此殿不立注漢宫殿名北宫中有徳陽殿明帝紀永平八年十月北宫成孔僖傳延光元年河西大雨雹安帝召孔季彦見於徳陽殿親問其故順紀孫程等迎濟隂王順帝於徳陽殿注漢官儀曰崇賢門内西鍾下即帝位近臣尚書以下從輦到南宫登雲臺召百官黄瓊傳永建三年上疏順帝書奏引見徳陽殿使中常侍以瓊奏書屬主者施行周舉傳陽嘉三年河南三輔大旱五穀災傷天子親自露坐徳陽殿東廂請雨桓紀建和二年徳陽殿火洛陽宫閣疏偃師去宫四十三里望朱雀五闕徳陽其上欎律與天連東京賦逮至顯宗既新崇徳遂作徳陽注崇徳在東徳陽在西相去五十歩啓南端之特闈立應門之將將其内則含徳章臺天禄宣明温飭迎春壽安永寧八殿名飛閣神行莫我能形李尤徳陽殿賦曰開三階而參㑹錯金銀於兩楹入青陽而窺總章歴户牖之所經連璧組之爛漫雜虬文之蜿延爾乃周閣廻市峻樓臨門朱闕巖巖嵳峩槩雲青瑣禁門廊廡翼翼達蘭林以西通中方池而特立又銘曰皇穹垂象以示帝王紫㣲之側洪誕彌光大漢體天承以徳陽崇髙𢎞麗包受萬方内總朝貢外供遐荒餘見北宫洛宫漢宣明殿桓郁𫝊遷侍中永平十四年帝自制五家要説章句令郁校定於宣明殿注華嶠書曰殿在徳陽殿後東觀記曰其冬上親於辟雍自講所制五行章句樊儵傳引見宣明殿又永平二年廣陵王荆引見宣明殿漢宣平殿張純𫝊子奮嗣爵歸國永平十年儋耳降附奮來朝上壽引見宣平殿顯宗以為侍祠侯漢崇徳殿安帝紀太后御崇徳殿拜帝為長安侯注洛陽宫有崇徳殿蔡邕𫝊靈帝詔邕與楊賜馬日磾張華單颺詣金商門引入崇徳殿就問災異注洛陽記曰南宫有崇徳太極殿西有金商門東京賦既新崇徳遂作徳陽注皆殿名崇徳在東徳陽在西相去五十歩河南志崇徳殿明帝永平中置漢安福殿黄香傳肅宗時召詣安福殿言政事拜尚書郎東京賦於南則前殿雲臺和歡安福注二殿名並在徳陽殿南又有承福殿見順帝紀又有黄龍千秋萬􅀊殿見五行志漢章臺殿雲臺殿馬防傳馬鉅為常從小侯肅宗以鉅當冠親御章臺下殿陳鼎爼自臨冠之和帝紀兼魯㳟傳永元九年八月飲酎齋㑹章䑓詔小黄門特引見議郎魯㳟宦者𫝊靈帝鑄四鍾皆受二千斛懸於玉堂及雲臺殿前東京賦含徳章臺薛綜注殿在應門之内於南則前殿雲臺張銑注殿名揚雄傳藺生収功於章臺注晉灼曰相如獻璧此臺漢嘉徳殿九龍殿虞詡傳鄧太后以詡有將帥畧遷武都太守引見嘉徳殿袁良碑云帝御九龍殿引對順紀幸嘉徳殿遣侍御史収閻顯孝仁后紀居南宫嘉徳殿宫稱永樂五行志延熹四年南宫嘉徳殿火楊賜傳光和元年有虹蜺晝降于嘉徳殿前帝引賜及蔡邕等入金商門問以災異注洛陽記云殿在九龍門内戴延之西征記云太極殿西有金商門西漢宫殿名正殿名曰明徳本名嘉徳東京賦九龍之内實曰嘉徳注九龍本周時殿名門有三柱柱有三龍皆銅嘉徳殿名在九龍門内在南宫洛陽有却非殿銅馬敬法清凉鳯凰嘉徳黄龍壽安殿竹殿魏青龍三年八月復崇華殿改名九龍殿陳有嘉徳殿學士漢壽安殿敬法殿梁后紀陽嘉元年春有司奏立長秋宫乃於壽安殿立貴妃為皇后注夀安是徳陽宫内殿名東京賦壽安永寧東觀漢記明徳馬后在敬法殿東廂王莽𫝊有敬法闥注師古曰敬法殿名洛陽宫名曰洛陽有敬法門漢顯親殿周舉傳順帝永和元年災異數見省内詔召公卿中二千石尚書詣顯親殿問以災異舉對曰云云又召舉於顯親門問以災𤯝漢華光殿楊賜𫝊建寧初靈帝當受學詔太𫝊三公選通尚書桓君章句夙有名者三公舉賜侍講于華光殿注洛陽宫殿名曰華光殿在崇光殿北劉寛𫝊靈帝初召拜太中大夫侍講華光殿遷侍中賜衣一襲注洛陽宫殿簿云殿在華林園内梁有華光殿武帝命羣臣賦詩漢章徳殿竇后紀見於北宫章徳殿清河王慶𫝊帝移幸北宫章徳殿禮儀志云云注建寧四年七月乙未立宋皇后儀章徳殿臨軒魏景福殿太極殿文昌殿九龍殿又見宫類明帝紀太和六年九月治許昌宫起景福承光殿青龍三年八月丁巳行還洛陽宫命有司復崇華殿時郡國有九龍見改名九龍殿水經注許昌城内有景福殿基魏明帝太和中造元和志在故城西南隅魏明帝上法太極於洛陽南宫起太極殿于漢崇徳殿之故處魏武封於鄴為北宫宫有文昌殿南齊禮志魏武都鄴正㑹文昌殿用漢儀又設百華燈魏文修洛陽宫室權都許昌宫殿狹小元日於城南立氈殿青帷以為門何晏韋誕夏侯惠有景福殿賦文選何平叔晏賦立景福之祕殿備皇居之制度溫房凉室開建陽啟金光注洛陽宫殿簿曰許昌宫景福殿七間魏都賦造文昌之廣殿極棟宇之宏規注正殿名張遼𫝊黄初二年文帝引遼㑹建始殿楊阜傳明帝新作許宫又營洛陽宫殿觀閣阜上疏曰堯尚茅茨而萬國安其居禹卑宫室而天下樂其業及至殷周或堂崇三尺度以九筵耳洛陽宫殿簿有魏太極九龍芙蓉九華承光諸殿漢晉春秋有景福聽政諸殿戴延之西征記太極殿上有金井欄金博山金轆轤蛟龍負山於井上又有金師子在龍下華延儁洛陽記太極殿有四金銅柱魏百子殿文選景福殿賦遂及百子後宫攸處注韋誕景福殿賦曰羙百子之時居嘉休祥之令名毛詩箋云太姒十子衆妾則宜百子殿名盖取於此唐錢起詩有百子殿吳神龍殿建康宫殿簿太初宫中有神龍殿去縣三里左太冲吳都賦云抗神龍之華殿是也赤烏殿在縣東北五里吳昭明宫内制度上應星宿吳都賦云飾赤烏之暐暐宋於臺城立正福清曜等殿陳永初中起昭徳嘉徳壽安乾明有覺等殿晉太極殿帝紀武帝受禪即洛陽宫幸太極前殿太康元年五月臨軒大㑹於太極殿摯虞决疑要注太極殿乃有陛寢山謙之丹陽記太極殿周制路也秦漢曰前殿魏號正殿為太極懐帝即位始遵舊制臨太極殿使尚書郎讀時令元帝時有司嘗奏太極殿廣室施絳帳帝曰漢文集上書皁囊為帷遂令冬施青布夏施青練帷帳穆帝永和元年正月甲戌朔皇太后設白紗帷於太極殿抱