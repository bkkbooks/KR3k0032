body:
  text: 玉海卷一百十八宋王應麟撰選舉考課古者三載考績三考黜陟三嵗而小考正職而行事也九嵗而大考黜無職而賞有功也舜三載考績書舜典三載考績三考黜陟幽明孔氏𫝊三年有成故以考功益稷臯陶方祗厥敘注臯陶敬行其九徳考績之次序於四方周六計六敘見六卿類天官小宰以聴官府之六計弊羣吏之治廉善能敬正法辨太宰八法八曰官計以弊邦治即小宰六計三嵗則大計羣吏之治而誅賞之鄭司農云三載考績宰夫嵗終令羣吏正嵗㑹月終正月要旬終正日成以考其治小宰月終受君臣之要贊冢宰受嵗㑹嵗終致事司㑹掌八法之貳以參互考日成以月要考月成以嵗㑹考嵗成易氏曰日有成日考之也宰夫受之月有要月考之也宰夫令之小宰受之嵗有㑹嵗考之也小宰贊之太宰受之夏官司士嵗登下其損益之數注謂用功過黜陟者三嵗稽士任而進退其爵祿書周官又六年王乃時巡大明黜陟典命注命謂玉遷秩羣臣之書漢考功課吏法功次京房𫝊元帝永光建昭中通鑑建昭二年六月西羌反日食上召問房對曰帝王以功舉賢宜令百官各試其功災異可息詔房作其事房奏考功課吏法晉灼曰令丞尉治一縣崇教化無犯法者遷有盜賊滿三日不覺尉事也令覺之自除尉負其罪率相凖如此法也上令與公卿朝臣㑹議溫室皆以房言煩碎令上下相司不可許部刺史奏事京師上召見令房曉以課事刺史以為不可行惟鄭𢎞周堪言善上意嚮之令房上弟子曉知考功課吏事者欲試用之房上中郎任良姚平願以為刺史試考功法臣得通籍殿中奏事於是以房為魏郡守得以考功法治郡房自請願亡屬刺史得除用他郡人自第吏千石以下嵗竟乘𫝊奏事天子許焉房為太守以建昭三年二月朔拜上封事房未發六月止無奏事七月房上封事曰前白願出任良試考功臣得居内蕭望之𫝊為左馮翊上諭意曰所用皆更治民以考功王駿𫝊御史大夫闕谷永奏言聖主不以名譽加於實効考績用人之法薛宣政事已試云云張敞𫝊為膠東相自謂吏追捕有功效者願得一切比三輔尤異上名尚書云云馮野王𫝊杜欽奏記曰三最予告令也尹翁歸為東海太守必於秋冬課吏卜式為成臯令將漕最義縱縣無逋事舉第一遷長陵令趙廣漢為陽翟令以治行尤異遷張敞拜膠東相上名尚書調補縣令者數十人尹賞以三輔髙第選守長安令焦延夀為小黄令舉最當遷朱博以髙第入為長安令蕭育為茂陵令㑹課育第六而漆令郭舜殿建初中新野令魯丕州課第一豐令牟融為州郡最此郡課縣也刺史以六條問事故事選守相髙第為中二千石兒寛為左内史課更以最尹翁歸為右扶風盜賊課嘗為三輔最韓延夀為東郡守斷獄大減為天下最朱邑召信臣治行第一陳咸鄭昌髙第此州課郡也丙吉曰長安京兆尹嵗竟丞相課殿最奏行賞罰丞相位三公領計簿谷永薦薛宣疏曰宣考績功課簡在兩府宣帝親政地節二年五月自丞相以下各奏職奏事以傅奏其言考試功能地節四年詔郡國嵗上繫囚丞相御史課殿最以聞黄龍元年詔御史察計簿疑非實者按之孝元使尚書選第中二千石而大鴻臚馮野王行能第一班況為上河農都尉大司農奏課連最此公卿課羣吏也御史中丞總領州郡奏事課第諸刺史刺史課郡國二千石而兩府九卿雜考郡國之計天子受相國之要光祿第郎從官博士選三科功次兒寛為掌故功次補廷尉文學卒史田廣明為天水司馬功次遷河南都尉馮奉世為郎功次補武安長馮野王為太子中庶子功次補當陽長馮逡為美陽令功次遷長樂屯衛司馬馮譚為郎功次補天水司馬頻陽令薛恭本縣孝者功次稍遷平當為治禮丞功次補大鴻臚文學周仁為太子舍人積功遷至太中大夫衛綰為郎功次遷中郎將石奮積功勞至太中大夫王訢㠯郡縣吏積功遷被陽令朱博守琅琊移書王卿齎伐閲詣府陳咸等官簿在翟方進右注簿謂伐閲也平當使行流民幽州舉奏刺史二千石勞徠有意者奉使者十一人為最遷丞相司直後官志司徒凡四方民事功課司空水土太尉兵事功課嵗盡奏殿最行賞罰刺史以八月行所部郡國考殿最郡國以春行縣秋冬遣無害吏課殿最嵗盡遣吏上計令長秋冬集課上計於所屬郡國注胡廣曰州課第長吏不稱職為殿有治能為最察上尤異伏恭劉祐魯恭陳重張奐繆彤舉尤異嵗盡齎所狀納京師名奏事郡國嵗盡計縣户口墾田錢榖入出盗賊多少上其集簿丞尉以下嵗詣郡課校其功功多尤最者於廷尉勞勉以勸其後負多尤殿者於後曹别責以糾其慢韋義數上書順帝宜依古典考功黜陟召集名儒大定其制魏都官考課法考課論周官考課魏志兼通典明帝疾浮華之士景初元年詔吏部尚書盧毓曰選舉莫取有名名如畫地作餅不可啖也毓曰名不可以致異人而可以得常士今考績法廢而以毁譽進退故真偽混雜虚實相蒙帝納其言詔散騎常侍劉劭作都官考課法七十二條又作説畧一篇詔下百官議事下三府崔林曰案周官考課其文備矣康王以下遂以陵夷即考課之法存乎其人也萬目不張舉其綱衆毛不振整其領臯陶仕虞伊尹臣商不仁者逺大臣任職式是百辟孰敢不肅烏在考課哉崔林𫝊劉劭作考課論制下百寮林議曰云云杜恕曰明試以功三考黜陟帝王盛制也然歴六代而考績之法不著闗七聖而課試之文不垂其法可粗依其詳難並舉也語曰世有治人而無治法法可専任則唐虞不須稷契之佐商周無貴伊吕之輔矣今奏考功者陳周漢之遺經綴京房之本㫖於以崇揖遜之風興濟濟之治臣以為未盡善也其欲使州郡考士必由四科皆有事効然後察舉試辟公府為親民長吏轉以功次補郡守或就增秩賜爵此最考課之急務也至於公卿及内職大臣當俱以其職考課之且天下至大萬機至衆焉有大臣守職辦課可以致雍熙者哉𫝊嘏曰建官均職清理民物所以立本也循名考實糾厲成規所以治末也本綱未舉而造制末程國畧不崇而考課是先不足以料賢愚之分精幽明之理也議久不決事竟不行盧毓論人及選舉皆先性行而後言才韓暨傳作考課之法王昶傳嘉平初陳治畧五事詔使撰百官考課事昶以為唐虞雖有黜陟之文而考課之法不垂周制冢宰大計羣吏又無校比之制聖王明於任賢畧舉黜陟之體以委達官之長而總其統紀故能否可得而知也晉黜陟課九班制杜預𫝊武帝泰始中守河南尹受詔為黜陟之課一本云泰始四年正月其畧曰臣聞上古之政因循自然虚已委誠而信順之道應神感心通而天下之理得一本云古者黜陟擬議於心不泥於法末世疑心而信耳目疑耳目而信簡書簡書愈繁官方愈偽漢刺史嵗終奏事不制算課而清濁粗舉魏氏考課即京房之遺意失於苛細以遺大體故歴代莫能通也豈若申唐堯之舊去密就簡則易從也神而明之存乎其人去人任法則以文傷理莫若委任達官各考所統嵗第其人言其優劣如此六載主者總集採案其言六優者超擢六劣者廢免優多劣少者平敘劣多優少者左遷今考課之品所對不鈞誠有難易當凖量輕重不足曲以法盡也己丑詔書以考課難成聴通薦例一本云其優劣徇情不叶公論者當委監司隨而彈之事竟不行劉頌為吏部尚書建九班之制欲令百官居職希遷課能否明賞罰干寶曰子雅制九班而不用子真著崇譲而莫省元魏朝堂黜陟考格勳書後魏書太和十八年九月壬申朔詔三載一考考優劣為三等六品以下尚書重問五品以上朕將親與公卿論善惡上上者遷下下者黜中中者守本任壬午帝臨朝堂親加黜陟太和十九年十月壬戌詔州牧考屬官為三等之科郭祚奏景明初考格五年者得一階半正始中考格滿三周為限二制不同景明考法東西省文武官為三等尚書盧昶奏上等三年轉半階今考格復分為九等盧同為左丞明帝世軍功罔冒同閲吏部勳書檢覈竊階者三百餘人表言吏部勳簿多改易校中兵奏案亦舛請集二局勳簿若名級相應於黄素大書之尚書以朱印印之敘階之後名簿具注加補日月尚書印記然後付曹郎别為抄目又請立格酬敘以三年為斷州無中正者不在此限崔鴻延昌二年將大考百寮鴻議曰景明以來考格三年成一考一考轉一階宋元嘉守宰以六朞為斷齊永明一以小滿為限魏世外官代還六年方叙内官四年為限唐考功四善二十七最考簿考課令御製考辭百官志㑹典同考功郎中員外郎掌文武百官功過善惡之考法及其行狀其考法凡百司之長嵗校其屬功過差以九等大合衆而讀之流内之官敘以四善曰徳義有聞清慎明著公平可稱恪勤匪懈善狀之外有二十七最近侍獻可替否拾遺補闕選司銓衡人物擢盡才良考校􅀭清激濁褒貶必當禮官禮制儀式動合經典樂官音律克諧不失節奏判事決斷不滯與奪合理宿衛部統有方警守無失督領兵事調習戎裝充備法官推鞫得情處斷平允校正讐校精審明於刋定宣納承㫖敷奏吐納明敏學官訓導有方生徒充業軍將賞罰嚴明攻戰必克政教禮義興行肅清所部文史詳録典正詞理兼舉糾正訪察精當彈舉必當勾檢明於勘覆稽失無隠監掌職事修理供承强濟役使功課皆充丁匠無怨屯官耕耨以時收穫成課倉庫謹於盖藏明於出納厯官推步盈虚究理精密方術占􅀱醫卜效驗居多闗津檢察有方行旅無壅市司市㕓弗擾奸濫不行牧官牧養肥碩蕃息孳多鎮防邊境清肅城隍修理一最四善為上上一最三善為上中一最二善為上下無最有二善為中上無最有一善為中中職事粗理善最不聞為中下愛憎任情處斷乖理為下上背公向私職務廢缺為下中居官諂詐貪濁有狀為下下凡定考皆集尚書省唱第然後奏流外官以行能功過為四等清謹勤公為上執事無私為中不勤其職為下貪濁有狀為下下凡考中上以上每進一等加祿一季中中守本祿中下以下每退一等奪禄一季中品以下四考皆中中者進一階一中上考復進一階一上下考進二階凡制敕不便有執奏者進其考貞觀初嵗定京官望髙者二人分校京官外官考給事中中書舍人各一人涖之號監中外官考使考功郎中判京官考員外郎判外官考其後屢置監考校考知考使故事考簿朱書吏緣為姦咸通十四年始以墨王徽建議藝文志職官類王方慶尚書考功簿五卷又考功狀績簿十卷通鑑武徳二年閏二月甲辰上考第羣臣以李綱孫伏伽為第一㑹要云上閲羣臣考績李綱孫伏伽以直諫為上第㑹要貞觀三年右僕射房𤣥齡侍中王珪掌内外官考以下雜引列𫝊等書髙宗書滕王元嬰下下考以愧之盧承慶典選校百官考有坐漕舟失所載者考中下更曰非力所及考中中又曰寵辱不驚考中上能著人善類此劉仁軌擢狄仁傑上下考唐臨為大理卿髙宗自述其考蘇瓌治州考課常最睿宗賜李朝隠韓朝宗中上考源乾曜開元十二年帝自較其考與張説偕賜賜上考親製詞十七年説授左丞相校京官考注子中書舍人均考上下時不以為私二十四年賜刺史縣令中下考盧從愿開元四年刺豫州奏課為天下第一宇文融以檢户口功校上下考盧從愿抑不與之從愿數充校考使升退詳確山南黜陟使韋貞薦嚴震理行第一特賜上下考封鄖國公崔隠甫帝詔校外官嵗考異時必委曲參審竟春未定隠甫一日㑹朝集使詢實其暮皆訖議者服其敏何易于以益昌令中上考遷羅江令班宏削劉迺上下考陽城自書下下考乾元二年二月丁未御製郭子儀李光弼等考辭自至徳後考績失實内外悉考中上殿最混淆貞元六年趙宗儒領考功事黜陟詳當無所回憚右司郎中獨孤良器以過黜考左丞裴郁御史中丞盧紹隆考中中凡入中上者纔五十人長慶元年正月考功員外郎李渤嵗終校考自宰相以下升黜之上奏曰宰相俛文昌植不陳徳義振舊典邪正無章陛下幸驪山宰相學士不先事以諫陷君於過俛與學士杜元穎等請考中下御史大夫李絳左散騎常侍張惟素右常侍李益諫幸驪山鄭覃等陳畋游得事君之禮請考上下奏入不報㑹渤請急馮宿領考功以考課令取嵗中善惡為上下郎中校京官四品以下黜陟之由三品上為清望官嵗進名聴内考非有司所得専渤舉舊事為褒貶違朝廷制請如故事渤議遂廢五月貶志節度使嵗以八月考其治否銷兵為上考足食為中考邊功為下考觀察使以豐稔為上考省刑為中辦税為下團練使以安民為上考懲姦為中得情為下防禦使以無虞為上考清苦為中政成為下經畧使以計度為上考集事為中修造為下栁冕上表元日陳貢棐於考堂唱其考第通典開元二十五年十二月二十四日命諸道採訪使考課善績三年一奏𫝊考功嵗終請如至徳故事課殿最左丞趙憬自言薦韋証以貪敗請降考校考使劉滋謂知過更以考升乾陵令薛珏課第一奉天令韋夏課第一唐六條黜陟紀貞觀二十年正月丁丑遣使二十二人以六條黜陟于天下遣大理卿孫伏伽等先是八年正月壬寅遣大臣為諸道黜陟大使畿内以李靖為之凡十三人分行天下龍朔三年八月戊申神龍二年二月丙申開元二十一年四月乙夘二十九年十月戊戌天寶五年三月丙子至徳二載十二月並遣使黜陟建中元年正月辛未遣黜陟使庾何等十一人神龍中李傑為河東黜陟使課最諸道源乾曜河東奏課最盧從愿山南李尚隠闗内倪若水劒南課第一路敬潛表言青州尹思貞善政㑹要貞觀二十年正月孫伏伽等二十一人以六條察四方多所舉刺太宗命褚遂良等具狀以聞乃親自臨決牧宰以下進擢者二十人罪死者七人黜免數百人𤣥宗詔京官有善政者補刺史嵗十月按察使校殿最自第一至第五校考使及户部長官總覈為升降唐御史黄卷㑹要天寶四載十一月十六日敕御史依舊置黄卷書闕失每嵗委知雜御史長官比類能否送中書門下改轉不日褒貶唐吏能四科食貨志陸贄奏曰㢘使㢘吏之能者有四科曰户口増加田野墾闢税錢長數率辦先期國家設考課之法非欲崇聚斂也宜命有司詳考課績州税有定徭役有等覆實然後報户部元稹對䇿曰吏部罷書判身言之選設四式以任人一曰校能之式二曰記功之式三曰任賢之式四曰敘常之式四式行則庶官當唐考遷格志凡居官必四考四考中中進年勞一階敘每一考中上進一階上下二階上中以上及計考應至五品以上奏而别敘六品以下遷改不更選及守五品以上官年勞嵗一敘給記階牒考多者凖考累加盧懷慎上疏比州牧上佐兩畿令或一二嵗或三五月即遷不論課最請未四考不遷通典唐虞九載魏晉以後六周國家因隋為四又減為三考憲宗時宰相李吉甫定考遷之格諸州刺史次赤府少尹次赤令諸陵令五府司馬上州上佐東宫官詹事諭徳以下五品官四品以上皆五考侍御史十三月殿中侍御史十八月監察二十五月三省官及臺省官皆三考餘官四考文武官四品以上五考顯慶中劉祥道知選事上疏陳六事請四考進階入考聴選以息迎新送故之弊陸贄論改轉倫序曰漢制刺史髙第即郡守郡守髙第入為九卿九卿遷亞相相國從六百石吏至台輔歴三四轉耳久在其位亦未失宜近代建官多列級密縣邑有七等之異州府有九等之差省郎有前中後行郎中員外郎五等之殊諫官有諫議大夫補闕拾遺三等之别臺寺率類於斯若依唐虞以九載為期宜髙位乏人下僚白首夫覈才有三術焉拔擢以旌異能黜罷以糾失職序進以謹守常陸贄八計本𫝊徳宗遣黜陟使庾何等十一人行天下贄説使者請以五術省風俗八計聴吏治三科登俊乂四賦經財實六徳保罷瘵五要簡官事八計曰視户口豐耗以稽撫字視墾田贏縮以稽本末視賦役厚薄以稽㢘冒視案籍煩簡以稽聴斷視囚繫盈虚以稽決滯視姦盜有無以稽禁衛視選舉衆寡以稽風化視學校興廢以稽教導時韙其言建隆考課令建隆三年十一月十日有司言考課令州縣户口増者刺史縣令進考一等今請損户口一分以上者降考二年正月戊申初嚴繆舉之法二十一日詔令尉任内無盜者署上考州於考帳定功過等第申省乾徳四年八月十日詔憲府天官秋曹以三年為滿開寶九年十一月庚午太宗詔諸道漕臣㢘訪官吏能否第為三等臨事簡慢為下職務粗治為中治狀尤異為上景徳元年九月丙戌同元祐二年五月十八日三省言文彦博奏請吏部長貳考守令通判才徳功過為上中下三品送中書門下覆其可否給舍看詳請依元豐考課令通取善最分三等監司審覆長貳以功過顯著者奏聞升黜之嵗無得過五人從之四年八月五日吏部言縣令委守倅考察課績以徳義清謹公平恪勤為四善獄訟無寃催科不擾為治事之最農桑墾殖水利興修為勸課之最屏除奸盜振恤貧困為撫養之最通取善最為三等及七事為上二為中餘為下從之元祐著令知州考課委監司考察吏郆析等第優者中書取㫖紹興三年八月十五日詔吏部申明守令四善四最法十月六日舒清國請以户口增否立守令考課法二月朔吏部尚書席益請稽乾徳四年詔書凡當調才行取課績優著者以名聞六年四月三日周祕言國家以十五事考校監司以四善四最法校守令比嵗諸路不奏課績詔吏銓申嚴行之二十六年十二月九日正言凌哲言祖宗考課監司法給御前印紙宜久任以行殿最四朝志考功以七事考監司以四善三最考守令舊置考課院其定殿最有考辭元豐悉罷崇寧二年九月壬寅尚書省立考課三十條詔行之淳化考課院見院類咸平臨軒黜陟慶厯磨勘法建隆二年五月己夘魏仁滌等以羨利增秩舊制文武常參官以閑劇為月限考滿即遷上曰此非循名責實因罷嵗月序遷之制太宗常欲自宰相修唐制書考之事既而但欲責其稱職遂止太平興國二年正月壬申詔曰虞書考績爰及三年漢官奏課聿定九等曹掾官及令簿尉吏部南曹給印紙厯俾州縣長吏書其績用愆過秩滿差其殿最斯舊章也其申明之六年二月癸酉朔詔京朝官釐務於外者咸給御前印紙令書治迹有司但以細事混淆其間自今非課最不得書為勞績一本云二月一日詔羣臣給御前印紙善惡無隠殿最必書雍熙四年三月庚辰詔知州通判給御前印紙書課績罷官日上中書考校淳化五年五月戊寅御書印紙見御書八月庚寅李虚己以得御書印紙上表獻詩上曰吾得良二千石矣咸平四年四月十五日丙辰審官院引對京朝官于崇政殿遷秩有差先是三年七月諭宰臣録庶官功過編冊以進舊制郊恩百僚序進上即位諫官孫何景望請罷之以塞僥倖於是郊禮行慶止加勳階爵邑而命有司考其殿最臨軒黜陟之五年十二月詔京朝官五年以上遷秩景徳四年七月詔三年以上引對特令考課者不在此限祥符九年九月戊辰詔外任京朝官依例考課遷秩京朝官磨勘始此天禧元年二月十三日詔改秩及三嵗審官院磨勘天聖七年十一月庚申詔京朝官依景徳四年七月敕到闕以前轉官及三年聴磨勘未及者須四年其任廣南西川及三年上課審官院景祐元年正月丙戌中書言諸路提刑如舊制給御前印紙書殿最從之慶厯三年十月壬戌詔曰虞典考三載之績周官計羣吏之治祥符之際考課有限年之制入官有循資之格自今京朝官有舉官五人方得磨勘外郎至卿監亦如之舉者不足增二年五年二月辛卯詔以廉士不能自進罷之仍如舊制治平三年二月十九日翰林學士承㫖張方平等言真宗因諫官孫何等上疏罷郊祀序進之制熙寧五年六月朔罷考課院元豐六年正月二十四日尚書省請置六察殿最簿天聖叙遷圖天聖元年王欽若以上初臨政謂平時百官叙進皆有常法乃為叙遷圖以獻冀便省覽仁宗閔積弊下明詔破拘攣之例以薦進人才革因循之法以旌别能否減任子之數設守宰之課嘉祐考績新書慶厯二年正月癸亥詔提刑到闕令磨勘院具功過分三等上與省府判官轉運使副中與大藩下與州郡用中丞賈昌朝之言也康定元年三月三司使鄭戩請後轉運使考課格以行殿最皇祐元年二月五日三司使葉清臣言朝廷謹庶獄置考課一司考提刑朝臣進退請命兩制考轉運使分五等從之陳升之又上選用責任考課三法嘉祐二年七月二十一日辛夘命翰林承㫖孫抃中丞張昇磨勘轉運提刑課績詔常以中丞學士典領五年六月辛未命胡宿趙槩六年八月丁丑詔曰先王考績之法見於經朕以諸路刺舉之官未有法考其賢否比令有司詳議考校課績之法以嵗滿所上功狀定其殿最為上中下三等用唐考功四善之法考行實而升黜之又擇左右可信之良使典治之以新書布天下一云令考校課績院以所定條目行之治平三年六月知磁州李田再考在劣等監淄州税初嘉祐六年立考課法坐考劣降自田始四年八月知潭州王宰以課績優奬諭賜帛十一月十二日丁亥神宗手詔令考課院詳定考課縣令法熙寧二年五月定考校知縣縣令課法分上中下三等三年七月十八日詔中書門下考察内外官置簿記功過嵗終升黜之紹興三十二年孝宗即位十一月丙申詔帥臣監司具部内諸州治行臧否以聞乾道二年四月己亥三年八月癸亥詔經筵給舍討論祖宗考課法淳熙七年二月詔改官定八十員之額八年閏三月辛巳復命監司帥臣嵗以所部郡守臧否來上皆著事實考察不公者御史劾之初元祐二年三月己亥詔改官嵗以百人為額孝宗磨厲人才蒐舉事庸郎陟郡勞臺登縣績武優轉級職待有勲蘇紳陳便宜八事言選人條約太嚴舊制三人保者得遷京官今則五人舊轉運提刑率當三人今止當一人舊大兩省官嵗舉五人今則舉三人陞朝官舉三人今則舉一人舊不以在任及所統屬皆得奏舉今則須在任及統屬後知州視屬邑多少裁定其數又常參官不許薦士志仁宗尤以選人遷京官為重雖有司引對法當與帝亦省察當否乃可之增四考為六考増舉者四人為五人非本部無輒舉又増縣令舉主至三員治平間賈黯言吏部奏舉磨勘選人未引見者至二百五十餘人方天聖中法尚簡選人以四考改官諸路使者薦部吏數未有限而臺閣常參官常任知州通判者雖非部吏皆得薦時改官者嵗才數十其後條約漸繁然磨勘應格者不越旬日即引對未有待次者皇祐中始限監司奏舉之數其法益密而待次不減六七十人今才十年而多至三倍向法疎而數省今法密而數增在薦吏嵗限定員務充數而已明年詔嵗舉京官以三分率之一分舉職官有舉者三人任滿選如法蔡抗言嵗舉無慮千九百員可罷知雜御史觀察使以上嵗得舉官法從之三年五月甲子自是舉官之數彌省矣紀治平二年四月辛丑詔監司知州薦所部吏嵗限定員不問能否一切取足自今務在得人不必充所限之數三年十月丁亥詔禮部三嵗一貢舉元年十月丙申詔中外近臣監司舉治行素著可備升擢者各二人紹興舉薦按察四條紹興二十九年五月十六日己巳左僕射沈該等請傚元祐宰臣司馬光陳請舉按官吏八條令監司郡守按察所部官吏其舉薦四條一曰仁恵二曰公直三曰明敏四曰㢘謹按察四條一曰苛酷二曰狡佞三曰昏懦四曰貪縱州舉之監司監司舉之朝廷監司按察知州軍通判路分都監以上知州軍通判按察兵職曹官以上及諸縣令丞以申監司乾道七年六月十九日右正言許克昌奏日者命臺諫兩省以上以四條薦建隆二年命翰林學士常參官舉幕職令録一人職令用舉主始此開寶三年命翰林學士及升朝官舉升朝一人選人用舉主改官始此祥符三年詔内外所舉幕職州縣官須經三任六考限考受薦始此天禧元年詔兩省五品以上嵗舉京朝官五人升朝官舉三人薦舉限員始此三年中書言舉充朝官者舉主及五人即以名聞舉主用五人始此天聖二年非通判以上不得舉官非見任屬吏不得受薦而舉主須用職司有轉運制置發運提刑勸農使二人若止一人則用常參官二人保舉元符二年每嵗分上下半年奏舉開寶三年三月壬寅詔貢士十五舉以上並賜出身仍勿為例此初行進士特奏名思例元祐元年八月上官均言嘉祐四年以後係特奏名者纔數十人自治平至熙寧三年止有百餘人自熙寧六年至今每次推恩入仕不減四五百人元豐八年係第四等以上者四百餘人麟題信厚之族章敘於内鷺羽羣飛之賢夷儀於外豐芑燕翼之仁棫樸作人之夀薪有芃棫河無伐檀魚罩駒維英收俊攬天庥地涵拔竒取異翹車賁帛任良服官渙爵般秩振鷺之聲充庭鴻鸞之黨漸階豪傑林立謀猷川行披華發輝舒翹􅀭英玉海卷一百十八
