body:
  text: 玉海卷四十六宋王應麟撰藝文古史古者天子諸侯必有國史以紀言行後世多務其道彌繁夏殷已上左史記言右史記事周則太史小史内史外史御史分掌其事而諸侯之國亦置史官虞史大戴禮虞史伯夷書正義堯典雖唐事本虞史所錄以五帝之末接三王之初由舜史勒成一家可以為法上取堯事下終禪禹皆舜史所録鄭序以為虞夏書二十篇商書四十篇周書四十篇賛曰三科之條五家之教是虞夏同科也唐虞史官典籍後漢班彪傳其畧論曰唐虞三代詩書所及有史官以司典籍注見於史籍者夏太史終古殷太史高摰周太史儋見吕氏春秋暨於諸侯國自有史呉志右國史華覈上疏曰五帝三王皆立史官叙録功美垂之無窮帝王輔佐篇籍漢古今人表經傳所稱唐虞以上帝王有號諡輔佐不可得而稱矣而諸子頗言之雖不考虖孔氏然猶著在篇籍歸乎勸戒夏殷春秋太史圖法殷册書典籍左傳後序汲冢得古文其紀年篇起自夏殷周皆三代王事唯特紀晉國其著書文意大似春秋經古者國史䇿書之常也史通汲冢璅語記太丁時事而目為夏殷春秋隋志古文璅語四卷汲冢書六韜禹有史疇吕氏春秋通典同夏太史終古考圖法出奔商商太史向摰一作高考圖法出奔周晉太史屠黍以圖法歸周書多士惟殷先人有册有典注殷先世有册書典籍説殷改夏王命之意盤庚遲任有言注鄭𤣥云古之賢史周志左傳文二年晉狼瞫曰周志有之勇則害上不登於明堂注周書也記疏周之志文六年㬰駢曰前志有之曰敵惠敵怨成四年秋季文子曰史佚之志有之曰非我族類其心必異注周文王太史十五年春子臧曰前志有之曰聖達節昭十二年仲尼曰古也有志克己復禮仁也二十六年王子朝奉周之典籍以奔楚哀三年魯司鐸火南宫敬叔命周人出御書序周禮有史官掌邦國四方之事達四方之志諸侯亦各有國史大事書之於䇿小事簡牘而已中庸文武之政布在方䇿名儀禮百名以上書於䇿不及百名書於方注書文也今謂之字禮小史掌邦國之志注鄭司農曰春秋傳所謂周志國語所謂鄭書之屬外史掌四方之志注若魯之春秋晉乗楚檮杌誦訓道方志家語子夏反衛見讀史志者言晉師伐秦三豕渡河子夏曰非也己亥耳讀史志者問諸晉史梁曰己亥春秋正義沈氏云嚴氏春秋引觀周篇云孔子將修春秋與左丘明乗如周觀書於周史漢志儒家周史六弢六篇即今六韜隋志春秋引周志鄭書之説似當時記事各有職司後又合而撰之總成書記金石録晉太公碑曰太康二年得竹䇿書書藏之年當秦坑儒之前八十六嵗其周志曰文王夢天帝曰昌賜汝望周記見記類周考周紀漢志小説家周考七十六篇考周事臣壽周紀七篇宣帝時周史記詳見書類汲冢周書史記解第六十一穆王思保位惟難恐貽世羞欲自警寤作史記維正月王在成周昧爽召三公左史戎夫曰今朕寤遂事驚予乃取遂事之要戒俾戎夫言之朔望以聞注集取要戒之言月旦月望於王前讀其言皮氏華氏夏后殷商有虞氏平林質沙三苖扈氏義渠平州林氏曲集有巢有鄶共工上衡氏南氏有果氏畢程氏陽氏糓平阪泉縣宗𤣥都西夏績陽有洛之亡周書見書類勇則害上不登於明堂此周志也左氏載於文公二年杜氏以為周書國子賦轡之柔矣此逸詩也左傳載於襄公二十六年杜氏亦以為見於周書千里百縣縣有四郡作雒篇之言杜氏以為上大夫受縣之注南望三塗北瞻有河度邑篇之言臣瓉以為班氏地理志之注天予不取反受其咎蕭何以為格言安危在出令存亡在所用主父偃以為確論記人之功忘人之過見於陳湯傳左道事君者誅見於王商傳鄭𤣥釋大行人曰周書王㑹篇備焉而寳摰之事益明馬融釋魯論曰周書月令篇而改火之義愈著顔師古議明堂叙應門雉門之制復援文王居明堂之篇而後明堂之在路寝其論始定一行厯議援其時訓之篇天根朝覿爰始收潦又以維王元祀二月丙辰朔武王訪於周公為正朔之驗緜緜不絶蔓蔓奈何蘇秦以説魏必参而伍之䝉恬以告秦民有五氣喜氣内蓄雖隠必見李善以注七發湯取天子之璽置天子之座六典既以述符寳穆王有左史戎夫書前代存亡之誡復以論起居注牛𢎞援蔡邕王肅之言乃以為周公所作若一行與釋後漢史者咸以為周公時訓蓋必有所本矣周史六弢六篇周政六篇周法九篇河間周制十八篇並列於儒家蓋與是史互見詳畧者也其書凡七十一篇至顔師古之時存者四十有五隋唐史志汲冢周書皆十卷見於雜史類唐志復載孔晁注周書八卷云今傳於世者視師古所見加多詩皇矣疏引周書稱文王在程作程寤程典大史而下建官惟五左史書動右史書言見於玉藻正義謂大史為左史内史為右史周諸侯史記魯史記魯史䇿書太史氏書國史三國史記隋志周官外史掌四方之志則諸侯史記兼有之左傳序春秋魯史記之名也記事者以事繫日以日繫月以月繫時以時繫年仲尼因魯史䇿書成文左丘明身為國史躬覽載籍正義周世每國有史記當同名春秋隠七年注仲尼修春秋皆承䇿為經丘明之傳博采衆記書序孔子約史記修春秋昭二年春韓宣子來聘觀書於太史氏見易象與魯春秋注云史記之䇿書曰周禮盡在魯序云韓子所見盖周之舊典禮經禮正義魯寳文王之書遵周公之典故云周盡在魯公羊傳莊七年不修春秋注謂史記也古者謂史記為春秋公羊之義以為哀公十四年獲麟之後得端門之命乃作春秋至九月而止筆孔子未修之時已謂之春秋史記陳世家孔子讀史記至楚復陳曰賢哉楚荘王輕千乗之國而重一言晋世家孔子讀史記至文公曰諸侯無召王自序自獲麟以來四百餘嵗諸侯相兼史記放絶孟子晉之乗楚之檮杌魯之春秋一也注此三大國史記之名乗者興於田賦乗馬之事檮杌者興於記惡之戒春秋以二始舉四時春秋正義案外傳申叔時司馬侯乃晉楚之人其言皆云春秋不言乗與檮杌然則晉楚私立别號魯守其本名賈逵云周禮盡在魯史法最備故史記與周禮同名臧齊南史執簡以往言董狐書趙盾以示於朝魯語文仲聞栁下季之書以為三筴公宋華督衛孫甯名在諸侯之䇿晉左傳祝佗曰分魯備物典䇿注典䇿春秋之制徐廣傳乗志顯於晉鄭春秋著乎魯史記隋牛𢎞求遺書劉炫偽造連山易魯史等録上史通史有三彰善貶惡不避彊禦若晉之董狐齊之南史上也編次勒成蔚為不朽若魯之丘明漢之子長次也高才博學名重一時若周之戎夫楚之倚相下也古者王朝五史若諸侯之有史僅見於封康叔封伯禽而他國無所考自晉有乗秦有記魯有史皆私史也或者其周之東乎史之綱要以編年為本而汾王以上諸侯有世而無年至於共和則國各紀元周為天子雖諸侯史記亦得名為周史古者生子則閭史書之二十五家為閭閭尚有史况一國乎養老有信史飲酒或佐之史宫中彤管左𫝊史佚有言曰無始禍無怙亂無重怒因重而撫之其次有立言注史秩周任臧文仲周百二十國寳書公羊疏案閔因叙云昔孔子受端門之命制春秋之義使子夏等十四人求周史記得百二十國寳書九月經立感精符考異郵説題辭具有其文周史而言寳書寳者保也以其可世世傳保以為戒公羊之義据百二十國寳書以作春秋今經止有五十餘國通戎夷宿潞之屬僅有六十有極美可以訓世極惡可以戒俗者取之不可為法者皆棄而不録据百二十國寳書以為春秋非獨魯也而言内者託王於魯故言内戴宏解疑論云聞端門之命有制作之状乃遣子夏等求周史記得百二十國寳書修為春秋春秋説云孔子欲作春秋卜得陽豫之卦宋氏云夏殷卦名也六藝論云春秋者國史所記人君動作之事左史所記為春秋右史所記為尚書孝經説云孔子曰春秋屬商孝經屬参史通墨子曰吾見百國春秋史記正義何休云孔子集百二十國書周載隋志雜史周載八卷東晉臨賀太守孟儀撰畧記前代下至秦本三十卷今亡唐志雜史孟儀注周載三十卷晉春秋楚書鄭書晉語司馬侯對悼公曰羊舌肸習春秋注春秋紀人事之善惡而目以天時謂之春秋周史之法也時孔子未作春秋楚語申叔時曰教之春秋而為之聳善抑惡教之故志使知廢興者而戒懼教之訓典使知族類行比義大學楚書曰惟善以為寳注楚昭王時書左傳襄三十一年子産曰鄭書有之安定國家必大焉先注鄭國史書禮小史注國語所謂鄭書昭二十八年晉司馬叔游曰鄭書有之惡直醜正實蕃有徒注古書名昭十五年景王曰孫伯黶司晉典籍為大政故曰籍氏辛有二子董之晉於是有董史韓詩外傳孫叔敖治楚三年而國覇楚史援筆而書之䇿記坊記魯春秋記晋云云春秋正義云皆在孔子之前史通璅語又有晉春秋記獻公十七年事竹書紀年其所記事皆與魯春秋同齊管仲曰徳刑禮義無國不記作而不記非盛徳也魯曹劌曰君舉必書書而不法後嗣何觀魯紀年隋李徳林傳史者編年也故魯號紀年墨子又云吾見百國春秋史又有無事而書年者春秋正義釋例云仲尼春秋皆因舊史之䇿書義之所在則時加増損春秋止於獲麟自此以下至十六年皆魯史記之文弟子録以續孔子所修之經祭法疏張融評云孔子删書求史記得黄帝𤣥孫帝魁之書管子春秋之記注周公凡例諸侯國史也公羊傳春秋之信史也漢班彪傳定哀之間魯君子左丘明論集其文作左氏傳三十篇又撰異同號曰國語二十篇由是乗檮杌之書遂闇史通竹書曰紀年吕氏春秋肇立紀號左傳正義束晢傳云太康元年汲郡竹書有紀年十二卷孔子三史文中子王道篇謂薛收曰聖人述史三焉注謂孔子書也詩也春秋也三者同出於史而不可雜也故聖人分焉賈逵春秋序云孔子覽史記就是非之説立素王之法家語稱齊太史子餘美孔子云天其素王之乎八代記公羊疏襄九年左傳言魯襄公年十二而冠依八代記即少昊亦十二而冠青史氏記見書類風俗通義引青史子書秦記史記六國表太史公讀秦記索隠曰秦國史記獨有秦記不載日月其文畧不具今在始皇紀賛後盖秦史之殘闕者始皇紀李斯請史官非秦記皆燒之扁鵲𫝊公孫支書而蔵之秦策於是出秦文公十三年初有史以紀事秦内史廖北史栁虯曰南史抗節表崔氏之罪董狐書法明趙盾之愆執筆於朝其來久矣漢魏以還宻為記注徒聞後世無益當時著漢魏者非一氏造晉史者至數家後代紛紜莫知準的正史歴代國史其流出於春秋劉歆叙七畧王儉撰七志史記以下皆附春秋荀勗分四部史記舊事入丙部阮孝緒七錄記𫝊録記史𫝊由是經典史分編年紀𫝊各有所長編年所載於一國治亂之事為詳紀𫝊所載一人善惡之迹為詳編年其來最古而人皆以紀𫝊便於披閲號為正史漢史記司馬遷傳司馬氏世典周史談為太史公有子曰遷云云遷俯首流涕曰小子不敏請悉論先人所次舊聞不敢缺卒三嵗而遷為太史令紬史記金鐀石室之書漢官儀司馬遷父談世為太史遷年十三使乘傳行天下求諸侯之史記又見西京雜記史記正義博物志云遷年二十八三年六月乙夘除六百石五年而當大初元年十一月甲子朔旦冬至天厯始改建於明堂諸神受記太史公曰先人有言周公卒五百嵗而有孔子孔子卒至今五百嵗有能紹而明之正易傳繼春秋本書詩禮樂之際意在斯乎小子何敢讓焉於是論次其文七年而遭李陵之禍天漢三年卒述陶唐以來至於麟止自黄帝始張晏曰猶春秋止於獲麟師古曰遷叙事盡太初太班彪畧論曰上自黄帝下訖獲麟注始二年獲白麟秦撥去古文焚滅詩書故明堂石室金鐀玉版圖籍散亂如淳曰刻玉版畫為文字也漢興百餘年間天下遺文古事靡不畢集太史公仍父子相繼纂其職曰於戯余維先人嘗掌斯事顯於唐虞至於周復典之故司馬氏世主天官至於余乎欽念哉㒺羅天下放失舊聞王迹所興原始察終見盛觀衰論攷之行事畧推三代録秦漢上記軒轅下至於兹著十二本紀既科條之矣並時異世年差不明作十表禮樂損益律厯改易兵權山川􅀑神天人之際承弊通變作八書二十八宿環北辰三十輻共一轂運行無窮輔弼股肱之臣配焉忠信行道以奉主上作三十世家扶義俶儻不令已失時立功名於天下作七十列傳凡百三十篇五十二萬六千六百字正義曰史記起黄帝訖於漢武天漢四年合二千四百一十三年百三十篇象一嵗十二月及閏餘也後漢楊終受詔刪太史公書為十餘萬言為太史公書序畧以拾遺補蓺成一家言協六經異傳齊百家雜語藏之名山副在京師以俟後聖君子遷之自序云爾而十篇缺有録無書賛曰自古書契之作而有史官其載籍博矣至孔氏籑之上繼唐堯下訖秦繆唐虞以前雖有遺文其語不經故言黄帝顓頊之事未可明也及孔子因魯史記而作春秋而左丘明論輯其本事以為之傳又籑異同為國語又有世本録黄帝以來至春秋時帝王公侯卿大夫祖世所出春秋之後七國並争秦兼諸侯有戰國䇿漢興伐秦定天下有楚漢春秋故司馬遷據左氏國語采世本戰國䇿述楚漢春秋接其後事訖於大漢其言秦漢詳矣至於采經摭傳分散數家之事甚多疏畧或有牴牾亦其渉獵者廣博貫穿經傳馳騁古今上下數千載間斯以勤矣又其是非頗繆於聖人論大道則先黄老而後六經序遊俠則退處士而進姦雄述貨殖則崇勢利而羞貧賤此其所蔽也然自劉向揚雄博極羣書皆稱遷有良史之才服其善序事理辨而不華質而不俚其文直其事核不虚美不隠惡故謂之實錄楊惲始讀外祖太史公記史東平王宇求太史公書王鳯言太公書有戰國縱横之謀天官災異地形阨塞不宜在諸侯王不可予蓺文志春秋家太史公百三十篇十篇有錄無書東萊吕氏曰以張晏所列亡篇之目校之史記或其篇具在或草具而未成非皆無書也唯武紀終不見之魏王肅曰漢武帝聞遷述史記取孝景及已本紀覽於是大怒削而投之於今此兩紀有録無書馮商所續太史公七篇注韋昭曰馮商受詔續太史公十餘篇在别錄商字子高師古曰七畧云陽陵人事五鹿充宗後事劉向能屬文與孟栁俱待詔頗序列傳隋志漢史記百三十卷目錄一卷唐志裴駰集解八十卷司馬貞索隠三十卷注開元潤州别駕張守節正義三十卷開元二十四年八月作竇羣史記名臣疏三十四卷王元感徐堅李鎮陳伯宣注韓琬續史記一百三十卷葛洪史記鈔十四卷隋楊素奏陸從典續史記迄於隋書未就裴駰集解序曰徐廣研核衆本為作音義具列異同兼述訓解増演徐氏采經傳百家并先儒之説或義在可疑則數家兼列漢書音義稱臣瓉者莫知氏姓今直云瓉曰又都無姓名者但云漢書音義司馬貞索隠自序曰史記於班書微為古質故漢晉名賢未知見重晉末徐廣作音義十三卷宋裴駰作集解合為八十卷南齊鄒誕生作音義三卷貞觀中劉伯莊作音義二十卷又撰史記地名二十卷許子儒注又音三卷貞釋文演注重為述賛凡三十卷號索隠又作補史記序改定篇目補其缺遺重為之注號曰小司馬史記作三皇本紀補其闕張守節曰班固漢書與史記同者五十餘卷又史記五十二萬六千五百言叙二千四百十三年事漢書八十一萬言叙二百二十五年優劣可知正義有論史例注音字例謚法解晁公武曰班固譏遷云云遷特感當世之所失憤其身之所遭寓之於書有所激而為此言耳非其心所謂誠然也吕氏曰太史公高氣絶識包舉廣而興寄深史通元成之間㑹稽褚先生更補其缺作武帝紀三王世家龜䇿日者等傳辭多鄙陋非遷本意也漢書史記後傳春秋考紀後傳班彪才高好述作專心史籍武帝時司馬遷著史記自太初以後闕而不錄後好事者頗或綴集謂揚雄劉歆褚少孫史孝山之徒然多鄙俗不足以踵繼其書彪乃述採前史遺事傍貫異聞作後傳數十篇因斟酌前史譏正得失其畧論云云今此後篇不為世家唯紀傳而已隋志云遷卒後好事者亦頗著述然多鄙淺不足相繼至彪綴後傳數十篇并譏正前失子固以彪所續前史未詳潛精研思欲就其業有告固私作國史者弟超言固著述意郡亦上其書顯宗竒之史通曰太初以後雜引新序説苑七畧之辭召詣校書郎除蘭臺令史與前睢陽令陳宗長陵令尹敏司𨽻從事孟異共成世祖本紀遷為郎典校秘書固又撰功臣平林新市公孫述事作列傳載紀二十八篇奏之帝乃復使終成前所著書固以為漢紹堯運以建帝業至於六世史臣乃追述功徳私作本紀編於百王之末厠於秦項之列太初以後闕而不錄故採撰前記綴集舊聞以為漢書起元高祖終於孝平王莽之誅十有二世二百三十年綜其行事傍貫五經上下洽通為春秋考紀表志傳凡百篇紀十二表八志十列傳七十考紀謂帝紀也言考覈時事具四時以立言隋志云六十九傳固自永平中始受詔潜精積思二十餘年至建初中乃成學者莫不諷誦焉論曰遷文直而事覈固文贍而事詳固之序事不激詭不抑抗贍而不穢詳而有體然其論議常排死節否正直而不叙殺身成仁之美班昭曹世叔妻彪之女兄固著漢書其八表及天文志未及竟而卒和帝詔昭就東觀藏書閣踵而成之劉昭補志序曰續志昭表以是推之八表其班昭所補天文志其馬續所成歟應劭曰元成帝紀皆班固父彪所作賛曰臣外祖兄弟為元帝侍中語臣曰注臣則彪也外祖金敞也劉昭曰司馬遷作史記爰建八書班固因廣曰十志天人經緯帝政紘維創藏山之祕寳肇刋石之遐貫律厯天文禮樂五行刑法藝文地理食貨溝洫郊祀隋志一百一十五卷漢䕶軍班固撰應劭集解建初中始奏表紀傳其十志不就曹大家續成之中興書目漢書一百卷漢尚書郎班固撰南史劉之遴傳鄱陽王範得班固所撰漢書真本獻東宫皇太子令之遴與張纉到溉陸襄等参校異同之遴錄其異状數十事大畧云古本稱永平十六年五月二十一日己酉郎班固上而今本無上書年月日唐顔師古傳為太子承乾注班固漢書上之賜物二百段時人謂杜征南顔秘書為左丘明班孟堅忠臣其所注漢書急就章大顯於時初師古叔游秦武徳初撰漢書決疑師古多資取其義志正史類顔游秦漢書決疑十二卷唐志御銓定漢書八十七卷高宗與郝處俊等撰姚察漢書訓纂三十卷又著續訓以發明舊義察珽之曽祖珽睿宗時人紹訓四十卷項岱漢書叙𫝊八卷陸澄新注八卷漢書英華八卷失姓名隋志晉葛洪漢書鈔三十卷文史類史漢異義三卷裴傑開元十七年上詳見唐七十家正史文中子史之失自遷固始也記繁而志寡談之書遷能終之彪之史固能修之晉王充著書申班而屈馬張輔持論又劣固而優遷張輔云遷之著述辭約而事舉叙三千年事唯五十萬言班固叙二百年事八十萬言漢書外傳晉謝沈撰宋志序司馬遷於紀傳之外創立八書班氏因之律厯禮樂其名不變以天官為天文改封禪為郊祀易貨殖平凖之稱革河渠溝洫之名綴孫卿之辭以述刑法採孟軻之書用序食貨劉向鴻範始自春秋劉歆七畧儒墨異部朱贛博採風謡尤為詳洽固並因仍以為三志而禮樂疎簡所漏者多典章事數百不記一天文雖為該舉而不言天形致使三天之説紛然莫辨樂經殘缺其來已遠班氏所述抄舉樂記馬彪後書又不備續漢東觀記十意本漢記世祖紀漢史漢志見三統厯隋志東觀漢記一百四十三卷起光武記注至靈帝長水校尉劉珍等撰唐志劉珍等東觀漢記百二十六卷又錄一卷中興書目八卷按隋志本一百四十三卷唐呉兢家藏已亡十六卷今所存止鄧禹呉漢賈復耿弇㓂恂馮異祭遵景丹葢延九傳列傳班固除蘭臺令史與陳宗尹敏孟異共成世祖本紀遷為郎固又撰功臣平林新市公孫述等作列傳載紀二十八篇奏之顯宗時李尤和帝時賈逵薦召詣東觀安帝時受詔與謁者僕射劉珍俱撰漢記張衡永初中安帝謁者僕射劉珍校書郎劉騊駼等著作東觀撰集漢記因定漢家禮儀上言請衡参論其事㑹並卒而衡常歎息欲終成之及為侍中上疏請得專事東觀收檢遺文畢力補綴又條上司馬遷班固所敘與典籍不合者十餘事蔡邕前在東觀與盧植韓説等撰補後漢記㑹遭事流離不及得成因上書自陳奏其所著十意分别首目連置章左帝嘉其才高及王允治邕罪乞繼成漢史太尉馬日磾曰伯喈曠世逸才多識漢事當續成後史為一代大典邕死其撰集漢事未見錄以繼後史作靈紀及十意又補諸列傳四十二篇湮没多不存注十意猶前書十志也邕上書曰光武已來唯記紀傳無續志者臣師太傅胡廣畧以所有舊事與臣積累二十餘年得備著作即建言十志皆當撰錄謹科條諸志臣欲刪定者一當接續者四前志所無臣欲著者五律厯意第一禮意第二樂意第三郊祀意第四天文意第五車服意第六劉洪在東觀與蔡邕共述律厯記伏無忌元嘉中桓帝詔無忌與黄景崔寔等共撰漢記又自采集古今删著事要號曰伏侯注其書上自黄帝下盡漢質帝為八卷侯瑾案漢記撰中興以後行事為皇徳傳三十篇行於世隋志漢皇徳紀三十卷起光武至冲帝盧植拜議郎與馬日磾蔡邕楊彪韓説等並在東觀校中書五經紀傳補續漢記應奉著漢書後序注袁山松書曰删史記漢書及漢記三百六十餘年自漢興至其時凡十七卷名曰漢事子劭集駁議其見漢記四又論當時行事著中漢輯序臨邑侯復好學能文與班固賈逵共述漢史子騊駼入東觀劉珍永寧元年詔珍與劉騊駼作建武已來名臣傳騊駼與珍著中興以下名臣列士傳永平中班固陳宗尹敏孟異共撰世祖本紀固又撰列傳載紀二十八篇而紀傳始立安帝永初永寧間劉珍騊駼張衡李尤等撰集為漢記於是又有名臣列士傳焉永壽中則有崔寔邊韶延篤朱穆鄧嗣伏無忌之著作熹平中則有盧植馬日磾蔡邕韓説楊彪之補續又作靈紀及補諸列傳四十二篇而紀傳益備唯書志缺邕以十意足之隋志明帝召班固為蘭臺令史與陳宗尹敏孟異等共成光武本紀固撰後漢事作列傳載紀二十八篇其後劉珍劉毅劉陶伏無忌等相次著述東觀謂之漢記呉華覈曰班固作漢書文辭典雅後劉珍劉毅等作漢記遠不及固敘傳尤劣唐劉知㡬曰古之國史皆出一家惟後漢東觀大集羣儒而著述無序條章靡立由是伯度譏其不實公理以為可焚張蔡糾之於當代傅范嗤之於後葉侯瑾案之為皇徳傳應奉刪之為漢事華嶠定為漢後書司馬彪修為續漢書范曅集諸家為紀志列傳文選魯靈光賦注引東觀漢記序漢以炎精布耀或幽而光地理志南陽舂陵師古注引漢記元朔五年封買為侯續志注引蔡邕表志光武中興頌東平王蒼傳永平十五年春行幸東平帝以所作光武本紀示蒼蒼因上光武受命中興頌續漢書八志隋志續漢書八十三卷晉秘書監司馬彪撰唐志同錄一卷晉司馬彪傳彪高陽王睦之長子泰始中為秘書丞注莊子作九州春秋以為先王立史官以載善惡是以春秋不修則仲尼理之闗雎既亂則師摰修之前哲豈好煩哉盖不得已也漢氏中興迄於建安忠臣義士亦已昭著而時無良史記述煩雜譙周雖已删除然猶未盡安順以下亡缺者多彪乃討論衆書綴其所聞起世祖終孝獻編年二百錄世十二為紀志傳凡八十篇號續漢書魏志注引司馬彪敘傳梁天監中劉昭集注後漢一百八十卷昭注補志序曰永平執簡東觀紀傳雖顯書志未聞推檢舊記先有地理張衡靈憲天文已煥蔡邕協妙元卓律厯以詳承洽伯始禮儀克舉郊廟社稷祭祀該明輪騑冠章車服贍列於是應譙纉其業董巴襲其軌司馬續書總為八志律厯之篇仍乎洪邕車服之本即依董蔡儀祀得於往制百官就乎故簿接繼班書通其流貫叔駿之書是謂十典范序未周志遂全闕廼借舊志注以補之分為三十卷以合范史律厯本劉洪蔡邕禮儀胡廣蔡邕譙周祭祀蔡邕天文五行應劭董巴譙周郡國東觀記伏無忌等百官東觀延篤等作表輿服蔡邕董巴宋朝乾興元年十一月戊寅孫奭請校定劉昭補注志三十卷鏤板頒行從之職官輿服之制尤為詳備漢後書十典晉華嶠傳武帝時典著作惠帝元康初以嶠有良史之志轉秘書監嶠以漢記煩穢慨然有改作之意為臺郎典官制事由是徧觀秘籍遂就其緒起光終獻一百九十五年為帝紀十二皇后紀二卷十典十卷傳七十卷又三譜序傳目錄凡九十七卷易外戚傳為皇后紀以次帝紀改志為典名漢後書奏之詔朝臣㑹議時中書監荀朂等咸以嶠文質事核有遷固風藏之秘府後汝南王亮衛瓘為東宫傅列上通講嶠撰十典未成子暢續之永嘉䘮亂存者三十餘卷隋志後漢書十七卷本九十七卷今殘缺晉少府卿華嶠撰唐志三十一卷晉諸公賛曰嶠撰後漢書世稱為良史范史班固傳論畧華嶠之辭永平中班固尹敏等作世祖本紀及建武功臣列傳永初中劉珍等作建武後至永初間紀傳及伏無忌等作諸王王子恩澤侯并單于西羗地理志邊韶崔寔等作皇后外戚順帝功臣傳百官表成百十四篇號漢記熹平中盧植馬日磾蔡邕等續補為東觀漢記合百二十六卷薛瑩華嶠之書皆取於此後漢書謝沉後漢書宋書范􅎡為吏部郎元嘉元年左遷宣城太守不得志乃删衆家後漢書為一家之作至屈伸榮辱之際未嘗不致意焉自序畧曰詳觀古今著述及評論殆少可意者班氏最有高名既任情無例唯志可推耳博贍可不及之整理未必愧也吾雜傳論皆有精思深㫖至於循吏以下及六夷諸序論筆勢縱放實天下之竒作其中合者往往不減過秦篇賛自是吾文傑思殆無一字空設此書行故應有賞音者自古體大而思精未有此也隋志後漢書九十七卷宋太子詹事范􅎡撰唐志九十二卷論賛五卷隋志讃論四卷中興書目後漢書一百二十卷并劉昭補注志􅎡作紀十志十列傳八十凡百篇十志未成初􅎡令謝儼撰志搜次垂畢㑹􅎡亡儼蠟以覆車一代為恨梁劉昭補成之注引序例唐章懐太子賢與張士安劉訥言等為之注晁氏志後漢九十卷志三十卷皆叙作書之意以比方班氏然世多譏􅎡創為皇后紀及采風俗通王喬抱朴子左慈等詭譎事列於傳又賛辭佻巧失史之體史通漢中興以來劉珍等作漢記見上晉司馬彪為續漢書華嶠為漢後書其十典不成自後作者相繼為編年者四族創紀傳者五家至宋宣城太守范􅎡乃廣集學徒窮覽舊籍删煩補畧作後漢書㑹􅎡以罪被收十志未成先是晋袁宏抄撮漢氏後書依荀悦體著後漢紀三十篇南史梁劉昭集後漢同異以注范􅎡後漢世稱博悉又呉均注後漢書九十卷唐志章懐太子賢注一百卷賢命劉訥言格希𤣥等注儀鳯元年十二月二日丙申皇太子賢上所注後漢書詔付秘省劉昭補注五十八卷劉熙注范曄書一百二十二卷韋機音義二十七卷蕭該劉芳臧兢音合七卷隋志臧兢范漢音訓三卷劉芳音一卷蕭該音三卷晉謝沈傳有史才著後漢書百卷及毛詩漢書外𫝊行於世其學在虞預之右隋志吳謝承撰後漢書一百三十卷無帝紀唐志錄一卷卷呉志承撰後漢書百餘晉薛瑩後漢記六十五卷本一百卷唐志百卷華嶠書十七卷本九十七卷今殘缺謝沈書八十五卷本一百二十二卷唐志一百二卷外傳十卷張瑩後漢南記四十五卷本五十五卷袁山松書九十五卷本一百卷唐志一百一卷錄一卷晉本傳山松著後漢書百篇劉宋志引山松漢百官志唐志有義慶書五十八卷宋范曄書九十七卷讃論四卷漢書纉十八卷梁劉昭注曄書一百二十五卷梁有蕭子顯書一百卷王韶後漢林二百卷韋闡音二卷雜史有漢侍中劉艾撰二帝紀三卷梁六卷張緬後漢畧二十五卷唐志葛洪後漢書鈔三十卷文心雕龍後漢紀傳發源東觀袁張偏駁薛謝疏繆若司馬彪之詳實華嶠之凖當則其冠也三國志晉陳壽傳壽為著作郎撰三國志凡六十五篇時人稱其善序事有良史才張華深善之曰當以晉書相付夏侯湛時著魏書見壽所作而罷元康七年尚書郎范頵等上表曰故治書侍御史壽作三國志辭多勸戒有益風化文艶不及相如而質直過之詔洛陽令就家寫其書不為丁儀立傳又言諸葛亮将畧非長議者少之壽又撰古國志五十篇益部耆舊傳十篇壽定諸葛亮故事為二十四篇隋志晉陳壽三國志六十五卷敘錄一卷宋裴松之注何常侍論九卷徐爰評三卷唐志徐臮晉王濤序評三卷盧宗道魏志音義一卷三國鼎峙魏氏及呉並有史官晉時巴西陳壽刪集三國之事唯魏帝為紀其功臣及呉蜀之主並為傳各依其國部類相從唐志魏志三十卷蜀十五卷呉二十一卷中興書目初王沈撰魏書四十八卷為時諱惡殊非實錄項峻撰呉書韋昭續成之五十五卷隋志二十五卷壽集為三國志撰魏紀四列傳二十六呉列傳二十蜀列傳十五史通先是魏魚豢私撰魏畧五十卷後孫盛撰魏氏春秋二十卷王隠撰蜀記七卷張勃撰呉錄三十卷宋文帝以志簡畧命裴松之兼采衆書補注其缺世言三國志以裴注為本元嘉六年七月二十四日上之表云詔使采三國異同以注國志壽書銓序可觀事多審正近世之嘉史然失在於畧時有脱漏臣上搜舊聞傍摭遺逸頗以愚意有所論辨國注引呉歴覈隋志有晉環濟呉紀九卷呉左右史薛瑩華隂澹魏紀十二卷後魏書梁祚撰并陳壽三國志名曰國統隋志雜史魏國統二十卷文中子陳壽有志於史依大義而削異端晁氏志以魏為紀而稱漢呉為傳又改漢曰蜀世頗譏其失蜀志注引孫盛異同記又引蜀記孫盛蜀世譜譙周蜀本紀晉史晉紀晉書晉中興書十志列傳王隠父銓有著述之志私録晉事未就隠受父業西都舊事多所諳究太興初元帝召為著作郎隠及郭璞俱為著作郎令撰晉史晉春秋云王隠著國史成八十八卷時虞預私撰晉書而生長東南不知中朝事數訪於隠并借隠所著書竊寫之隠依庾亮亮供紙筆乃成書詣闕上之文辭鄙拙蕪舛不倫其書次第可觀者其父所撰文體混漫者隠之作也本九十三卷隋志八十六卷春秋正義引王隠晉書干寳博覽書記中興草創未建史官中書監王導上疏宜建立國史撰集帝紀宜備史官敕佐著作郎干寳等撰集於是著晉紀自宣迄愍五十三年凡二十卷奏之其書簡直而婉稱良史隋志二十三卷劉彤注四十卷虞預著晉書四十四卷隋志二十六卷訖明帝㑹稽典録二十篇諸虞傳十二篇行於世謝沈有史才康帝時為著作撰晉書三十餘卷沈先著後漢書百卷及漢書外傳郄紹作晉中興書何法盛竊之凡七十八卷起東晉徐廣領著作敕撰成國史廣舉荀伯子王韶之為佐郎同撰晉史義熈初十二年成晉紀四十六卷上之隋志四十五卷鄧粲著元明紀十篇隋志十一卷始文心雕龍鄧粲晉紀立條例荀綽撰晉後書十五篇隋志綽晉後畧記五卷束晳武帝時佐著作郎撰晉書帝紀十志著晉書紀志南史裴松之著晉紀謝靈運為秘書監撰晉書粗立條流沈約撰一百二十卷條流雖舉采掇未周失第五袠齊臧榮緒括東西晉為一書紀録志傳百一十卷後魏書崔浩以晉書諸家多誤著晉後書未就傳世者五十餘卷元帝建武元年十一月丁卯置史官晉史十八家隋志晉書有王隠八十六卷虞預二十三卷朱鳳十卷本十四卷訖元帝謝靈運三十六卷臧榮緒一百十卷蕭子雲十一卷本一百二卷梁有鄭忠七卷沈約一百十一卷庾銑東晉新書七卷亡又蕭子顯晉史草三十卷梁張緬晉書鈔三十卷張氏晉書鴻烈六卷中興書有何法盛七十八卷晉紀有陸機四卷干寳二十三卷曹嘉之十卷鄧粲十一卷宋劉謙之二十五卷南史云二十卷王韶之十卷徐廣四十五卷郭季產續五卷陽秋有習鑿齒孫盛檀道鸞之書卷見上又有荀綽晉後畧記五卷唐志又有晉錄五卷貞觀二十年閏三月詔曰十有八家雖存記注才非良史書虧實錄榮緒煩而寡要行思勞而少功叔寧味同畫餅子雲學堙涸流處叔不預於中興法盛莫通於創業洎乎干陸曹鄧畧紀帝王鸞盛廣松纔編載祀其文既野其事罕有唐御撰晉書志房𤣥齡禇遂良許敬宗來濟陸元佐劉子翼令狐徳棻李延壽等二十一人修名為御撰一百二十卷㑹要貞觀二十年閏三月四日詔宜令修纂所更撰晉書銓次舊聞裁成義類如修五代史故事於是司空房𤣥齡中書令褚遂良太子左庻子許敬宗掌其事來濟陸元佐劉翼李淳風李義府薛元超上官儀崔行功辛𤣥馭劉𦙍之楊仁卿李延壽張文恭並分功撰錄令狐徳棻敬播李安期李懐儼詳其條例以臧榮緒晉書為本為十紀十志七十列傳三十載記其太宗所著宣武二帝及陸機王羲之四論稱制㫖焉房𤣥齡已下稱史臣凡起例皆播獨創其以書賜皇太子及新羅使者各一部案修史事志有二十一人㑹要止有二十人無趙𢎞智名列傳令狐徳棻㑹修晉史房𤣥齡奏起之預柬十有八人徳棻為先進類例多所諏定敬播撰晉書大抵凡例皆播所創書目太宗以晉史何法盛等十八家制作雖多未能盡善於是敕史官更加纂録採正典與舊説數十部兼引偽史十六國書為百三十篇命來濟李淳風李義府等十三人分掌著述令狐徳棻敬播等四人考正類例凡例多出敬播天文律厯則李淳風為之惟宣武紀陸王傳論太宗自為之故總題曰御撰云當時修史者多文辭之士好采詭異以廣聞見學者譏之天寳六載何超撰音義三卷唐志又有徐堅晉書一百十卷又開元二十年高希嶠上注晉書一百三十卷宋書宋略唐志沈約宋書一百卷王智深三十卷又宋紀三十卷裴子野宋略二十卷鮑衡卿王琰宋春秋各二十卷隋志宋書徐爰孫嚴撰皆六十五卷梁有宋大明中所撰六十一卷沈約撰齊紀二十卷梁沈約𫝊齊建元四年敕撰國史永明二年兼著作撰次起居注五年春敕撰宋書六年二月畢上之史通宋史元嘉中著作郎何承天草創紀傳一本云止於武帝功臣其志唯天文律厯自此外委山謙之又命裴松之續成國史尋卒孫冲之表求别自創立為一家之言孝建初蘇寳生續造諸傳元嘉名臣皆其所撰大明六年徐爰踵成前作起義熙初訖大明末其臧質魯爽王僧達諸傳又皆孝武所造沈約本承天舊書兼採謙之冲之寳生徐爰諸説一本云約更製新史始自義熈終於昇平三年為紀十志三十列傳六十合百卷唐志卷同之今本到彦傳卷末殘缺十志乃兼載魏晉論者以為失於限㫁元嘉六年承天攝國史其志十五篇永明末裴子野松之曽孫删為宋畧二十卷叙事評論多善約見而嘆曰吾所不逮也世言宋史者以裴畧為上沈書次之中興書目卷同齊書齊典齊春秋齊紀十志唐志蕭子顯齊書六十卷書目今存五十九卷初江淹著十志沈約著齊紀二十卷子顯表於梁武别為此書紀八志十一列傳四十合五十九篇天文志但紀災祥州郡不著户口祥瑞多載圖䜟表言素不知户口且天文復秘不私載焉曽鞏序謂子顯之文喜自馳騁其更改破析藻繢之變尤多呉均亦表請撰齊史遂撰齊春秋三十篇唐志卷同南史熊襄著齊典上起十代其序云尚書堯典謂之虞書則附所述通謂之齊書名為河洛金匱隋志齊典五卷王逸撰梁有江淹齊史十三卷齊建元二年初置史官以檀超江淹掌史職上表六條例又著十志淹言修史之難無出於志梁書梁典唐志姚思亷梁書五十六卷紀六列傳五十隋志梁典三十卷劉璠撰三十卷何之元撰唐志有謝昊三十九卷姚思亷傳父察在隋修梁陳二史未就採謝昊顧野王等諸家推䆒總括為梁陳二家史以卒父業賜雜綵五百段陳顧野王撰國史陳書紀傳二百卷史通梁武帝時周興嗣鮑衡卿謝昊昊四十九卷本百卷撰録已百篇後亡逸何之元劉璠合撰梁典三十篇之元著梁典起齊永元元年迄於王琳遇獲七十五年行事為三十卷姚察梁書帝紀七卷許亨梁史五十三卷云云陳書唐志姚思亷陳書三十六卷紀六列傳三十魏徵等同撰史通陳史初有顧野王傅縡大建初陸瓊續撰陸瓊陳書四十二卷姚察删改察有志修梁陳二史至貞觀初三年其子思亷為著作佐郎續成之魏徵唯裁其總論陳書歴三世傳父子數十嵗而後成嘉祐六年八月校讎八年七月始校定後魏書魏典北齊天保二年詔魏收撰魏史勒成十一紀九十二列傳合一百一十卷五年三月奏上之十一月奏十志天象地形至官氏釋老凡二十卷合一百三十卷分為十二袠隋以魏收所撰書褒貶失實平繪為中興書事不倫序詔魏澹别成魏史為十二紀七十八列傳史論及例各一卷合九十二卷書目今收書紀闕二卷傳闕二十二卷不全者三卷志闕二卷補以魏澹張太素所作及北史高氏小史修文殿御覽澹及太素書今亡唐志魏收後魏書一百三十卷魏澹一百七卷張太素一百卷裴安時元魏書三十卷唐舊史張太素撰後魏書一百卷天文志未成一行續成之志又有張太素魏書百卷隋志魏彦深撰一百卷唐元行冲傳以系出拓拔恨史無編年乃撰魏典三十篇事詳文約學者尚之㑹要景龍三年十二月志雜史類魏典三十卷北齊書唐志李百藥五十卷紀八列傳四十二後周書唐志令狐徳棻五十卷紀八傳四十二隋書唐志隋書八十五卷志三十卷紀傳五十五卷顔師古孔頴達于志寧李淳風韋安化李延壽與令狐徳棻敬播趙𢎞智魏徴等撰㑹要顯慶四年二月司更大夫吕才著隋紀二十卷唐五家史梁周陳隋齊五代史志令狐徳棻傳武徳初為秘書丞㑹要武徳四年十一月起居舎人徳棻言建言近代無正史梁陳齊文籍猶可據至周隋事多捐脱今耳目尚相及史有所慿一易世事皆汩暗無所掇拾陛下受禪於隋隋承周二祖功業多在周今不論次各為一王史則先烈世庸不光明後無傳焉帝喟然於是五年十二月二十六日詔中書令蕭瑀王敬業殷聞禮主魏封徳彛顔師古主隋崔善為孔紹安蕭徳言主梁裴矩祖孝孫魏徴主齊竇璡歐陽詢姚思亷主陳陳叔達庾檢及徳棻主周由魏迄隋振整論撰歴年不能就罷之貞觀三年復詔撰定議者以魏有魏收魏澹二家已詳惟五家史當立㑹要三年於中書置秘書内省修五代史徳棻更與秘書郎岑文本殿中崔仁師次周中書舎人李百藥次齊著作郎姚思亷次梁陳秘書監魏徴次隋左僕射房𤣥齡總監修撰之原自徳棻發之書成賜絹四百匹遷禮部侍郎㑹要貞觀十年正月二十日壬子尚書左僕射房𤣥齡等撰成周梁陳齊隋五史上之進階頒賜有差顯慶元年五月四日己夘史官修梁齊陳周隋五代志三十卷始禮儀終經籍太尉無忌進之貞觀十五年詔于志寧李淳風李延壽同修五代史志勒成十志三十卷後編入隋書合八十五卷史通十志三十卷雖編入隋書其實别行呼為五代史志孫思邈𫝊魏徴等修齊梁周隋等五家史屢咨所遺其傳最詳志又有呉兢齊史十卷梁史十卷陳史五卷周史十卷隋史二十卷張大素北齊書二十卷隋書三十二卷雜史有張絢古五代新記二卷舊史貞觀十年春正月壬子左僕射房𤣥齡侍中魏徴上梁陳齊周隋五代史詔藏於秘閣呉兢以五代史繁雜乃别撰梁齊周史各十卷陳史五卷隋史二十卷又傷踈畧文中子繁師𤣥将著北齊録子曰無茍作也晁氏志嘉祐中以宋齊梁陳魏北齊周書舛繆亡缺始命館職讎校曽鞏等請詔藏書之家悉上異本乆之始集治平中鞏校定南齊梁陳三書上之劉恕等上後魏書王安國上周書政和中始皆畢頒之學官唐南北史李延壽傳父大師多識前世舊事常以宋齊梁陳魏周隋天下参隔南謂北為索虜北指南為島夷其史本國詳他國畧訾美失𫝊思所以改正擬春秋編年刋究南北事未成而没延壽既預論撰所見益廣表云貞觀以來屢叨史局乃追修先志本魏登國元年盡隋義寧二年凡二百四十四年作本紀十二列傳八十八謂之北史本宋永初元年盡陳禎明三年凡一百七十年作本紀十列傳七十謂之南史其書頗有條理删落釀辭過本書遠甚凡八代合為二書一百八十卷始末修撰凡十六載志李延壽南史八十卷北史一百卷㑹要顯慶四年符璽郎李延壽撰近代諸史南起自宋終於陳北始自魏卒於隋合一百八十篇號曰南北史上自製序唐七十家正史志乙部史録十三類一曰正史類七十家九十部四千八十五卷失姓名二家始於司馬遷史記終於隋書志又有集史總七十三家六十九部見後司馬氏史記有裴駰徐廣鄒誕生許子儒劉伯莊之音解班氏漢書有服䖍應劭諸葛亮孟康晉灼韋昭崔浩孔文祥劉嗣夏侯泳包愷蕭該隂景倫項岱劉寳陸澄韋稜姚察顔游秦僧務静李善顧𦙍顔師古之音注論駮及高宗之銓定失姓名正名氏義英華二家東漢則有劉珍謝承薛瑩司馬彪劉義慶華嶠謝沈袁山松范曄張瑩之書劉昭劉熈蕭該劉芳臧兢太子賢韋機之補注音義三國有王沈陳壽韋昭晉有王隠虞預朱鳳謝靈運臧榮緒干寳蕭子雲何法盛及房𤣥齡等所修宋有徐爰孫嚴沈約王智深齊梁陳有蕭子顯劉陟謝昊姚察顧野王傅縡姚思亷元魏北齊周隋有魏收魏澹李徳林王劭張大素李百藥令狐徳棻顔師古等不著録者王元感至裴安時二十三家一千七百九十卷史記之學則有王元感徐堅李鎮陳伯宣韓琬司馬貞劉伯荘張守節竇羣裴安時漢書之學則劉伯莊敬播元懐景姚珽沈遵李善晉書音注則徐堅高希嶠何超及齊梁陳周隋之史武徳貞觀兩朝史呉兢等唐書國史至裴安時元魏書終焉隋志正史六十七部三千八十三卷通亡書合八十部四千三十卷雜史類阮孝緒撰正史削繁九十四卷古者天子諸侯有國史以紀言行春秋引周志鄭書漢始置太史公自是世有著述皆擬班馬以為正史作者尤廣一代之史至數十家唯史漢師法相傳並有解釋三國後漢亦有音注中興書目三十二家二千一百二十九卷續目三家七十一卷崇文目三十部一千一百六十二卷景徳二年龍圖閣書正史一千四百四十九卷唐承天命世以文理典籍之盛莫若開元竹簡漆書咸萃書秘府鴻生鉅學纂續志録書分四類其二曰史史分十三類其一曰正史漢迄隋篇目彪列藝文有志具詳登載為部九十為卷四千八十五總為七十家失名氏者二家遺文古事靡不畢集觀書於太史氏上下數千載之述作粲然可考庸撮其要指序於篇端曰史與經同出而異名若昔四史昉於黄序五史建於蒼籙右言左動官宿其業言為尚書紀謨訓而舉其綱事為春秋繫日月而詳其目紀𫝊猶未分也邦國之志掌於小史百十二國寳書藏於周室私史猶未作也自鄭書晉乗魯史秦記而國各有史如南董左氏之流史猶出於一家也逮漢六葉有臣曰遷㒺羅舊聞終篇麟止而編年之體始變班劉而下波沿㬌附猶未有正史之名也貴耳賤目見聞異辭而史始雜餘分閠位記注並作而史始偽䃉玉錯陳朱紫易混繇是條分科别粹然一出於正者編為正史隋志所録六十七部三千八十三卷一代史籍至數十家而紀載益詳史漢訓詁師法相𫝊而義例益明或書事記言於當時而勒成删定於後代大䇿小牘支蕃葉滋温故知新聳善抑惡皆足以昭法式垂勸戒豈誇多而愛竒哉有唐肇基襲經補藝五代史成於貞觀之十禩兩朝史成於顯慶之初元然乙部著録尚仍隋書籖幐紛糾寖失緒次號登開元名儒建議乾元麗正博彚羣書臣述臣欽分部治史越九年仲冬丙辰臣行冲奏上四録卷析二百臣照刪為四十卷凡史録五百七十一家八百五十七部一萬六千八百七十四卷曰編年曰偽史雜史曰起居注故事曰職官𫝊記儀注曰刑法目録譜牒地理而正史居其首即篇目考之史記本於司馬氏而裴徐鄒許劉之音解列焉漢書本於班氏而服應孟晉崔孔諸葛夏侯包蕭隂項陸姚李顧二韋二劉二顔務静之音注論駁及高宗銓定名氏英華附焉東漢始於劉珍之記二謝薛司馬劉華袁范張譔其書三劉蕭臧及太子賢韋機釋其義以至王沈陳壽韋昭纂三國之事隠預鳳靈運榮緒寳子雲法盛𤣥齡輯二晉之史宋齊梁陳則徐孫沈王蕭劉謝顧傅二姚續汗青之緒元魏北齊周隋則二魏王張二李令狐顔氏擅載筆之美縹嚢碧軸淵聚林崪治亂興替之鍳是非褒貶之論衮斧於既往蓍蔡於将來天球河圖金匱玉版成一王法為萬世則緯經綴道􅇸括古今兹七十家之醇駁雖殊而廣記備言不可以闕遺也或者猶曰史之失自遷固始夫敘一時之事編年為善敘一人之事紀傳為優㫖哉皇甫湜之言曰合聖人之經以心不以迹得良史之體在適不在同吾有取焉緬稽唐朝簡册尤備倣四繫之法則有唐厯春秋總二史之載則有起居注實録書政事議論之詳則有日厯時政記㑹要肇於貞元玉牒創於開成惟紀表志𫝊為一代鉅典冠冕史録其以是與按六典卷部與隋志同藝文志正史之末附以通史南北史之屬五家六部一千二百二十二卷謂之集史諸儒立言日新月益不著録之書若王元感之下徐李陳韓司馬劉張竇裴皆史記之學也劉伯莊之下敬元姚沈李徐高何皆漢晉書之學也繼以武徳貞觀兩朝史齊梁陳周隋史唐書國史終於裴安時元魏書凡二十三家為卷一千七百九十皇朝崇文總目三十部二千一百六十二卷云擬序唐武徳貞觀兩朝史志八十卷長孫無忌令狐徳棻顧𦙍等撰㑹要顯慶元年七月三日無忌于志寧崔敦禮令狐徳棻李義府劉𦙍之楊仁卿李延壽張文恭修國史成起義寧盡貞觀末凡八十一卷藏於内府通鑑咸亨四年三月丙申詔劉仁軌等改修國史以許敬宗等所記多不實故也㑹要長安三年正月一日敕李嶠等修唐史采四方之志成一家之言唐武徳以來國史唐史唐國史唐書備闕記韋述傳初令狐徳棻呉兢等撰武徳以來國史皆不能成述因二家参以後事遂分紀𫝊又為例一篇開元十九年三月蕭嵩欲蚤就復奏起居舎人賈登著作佐郎李鋭助述紬績逮成文約事詳蕭頴士以為譙周陳壽之流改國子司業充集賢學士述典圖書踰四十年任史官二十年史才博識所著書二百餘篇行於時桞芳𫝊肅宗詔芳與述綴輯呉兢所次國史述亡芳緒成之興高祖訖乾元凡百三十篇叙天寳後事棄取不倫史官病之舊史云芳勒成國史一百三十卷呉兢傳景龍間任史事私撰唐書唐春秋未就至開元中丐官筆札兾得成書詔就集賢院論次時張説在家修史大臣奏國史不容在外詔兢赴館撰録乆之貶荆州司馬以史草自随蕭嵩領國史奏遣使者就兢取書得六十餘篇舊史云奏取兢所撰國史得六十五卷宗呉兢撰國史為則天本紀次高宗沈既濟請合中紀㑹要呉兢云帝載王言所書至重志唐書一百卷又百三十卷呉兢韋述桞芳于休烈等撰國史百六卷又百十三卷雜史呉兢唐書備闕記十卷書目卷同集高宗武后中睿𤣥宗五朝政事以備史官之闕按蓺文志唐書百卷又百三十卷國史百六卷又百十三卷呉兢傳撰唐書唐春秋未就詔就集賢院論次桞芳傳亦曰芳緒成國史興高祖訖乾元凡百三十篇舊傳韋述補遺續闕勒成百十三卷盖兢書百卷而芳所著百三十卷述書百十三卷云舊史徳棻兢累有修撰未成一家言韋述始定類例補遺續闕勒成國史一百十三卷并史例一卷事簡記詳有良史之才集賢注記史館舊有令狐徳棻所撰國史及唐書皆為紀傳之體令狐㫁至貞觀牛鳳及迄於永淳及呉長垣在史職又别撰唐書一百一十卷下至開元之初韋述綴輯二部益以垂拱後事别欲勒成紀傳之書蕭令嵩欲早就奏賈登李鋭太常博士褚思光助之又奏陸善經梁令瓉入院嵗餘不就張始興為相薦起居舎人李融專司其事諫議尹愔入館為史官未施功而罷詳見續春秋又見史館史通長壽中春官侍郎牛鳳及㫁自武徳終於𢎞道撰為唐書百有十卷發言怪誕叙事参差既而悉焚姚思亷許敬宗諸本欲使其書獨行由是皇家舊事殘缺盡矣舊史于休烈奏國史一百六卷開元實録四十七卷起居注并餘書三千六百八十二卷並在興慶宫史館以家藏國史一百十三卷送於官志目録類唐書叙例目録一卷孫玉汝列聖實録目二十五卷張説曰髙宗朝修史學士有十九人李翺曰唐有天下聖明繼於周漢而史官叙事曽不如范曄陳壽所為唐在外修史㑹要開元八年十二月二十日詔張説修國史仍齎史本就并州随軍修撰雖致仕一嵗亦修史於家十四年七月六日敕呉兢就集賢院修唐書二十五年六月二十六日詔左丞相張説在家修史李元紘奏就史館從之長慶三年六月監修國史杜元頴奏班固居鄉里而繼成漢書陳壽處私家而專精國志𤣥宗國史張説在本鎮兼修代宗編年令狐峘自外郡奏上其沈傳師分修憲宗實録就湖南修畢先送史館制可史通曰班固成書出自家庭陳壽為志創於私室宋朝宋祁就亳州修唐書皇祐三年三月乙夘汪藻即湖州領日厯紹興初唐書嘉祐新唐書中興書目五代晉宰相劉昫史官張昭遠等撰唐三百年間國史野録参錯不一至昫删集為紀二十志五十列傳一百五十凡二百卷開運二年六月上計二十帙國史志慶厯五年五月四日己未詔王堯臣張方平宋祁等刋修慶厯四年賈昌朝建議修唐書久而未就至和初至和元年八月戊申乃命歐陽修撰紀表志宋祁撰列傳范鎮王疇宋敏求吕夏卿劉羲叟同編修嘉祐三年十月庚子命参政曽公亮提㸃編修唐書凡十有七年至嘉祐五年而成提舉曽公亮上之七月戊戌一本云六月二十四日進呈紀十志五十表十五列傳百五十凡廢舊傳六十一増新傳三百三十一又増三志四表凡二百二十五卷録一卷舊史凡一百九十萬字新史凡一百七十五萬九百三十字制詞謂閎富精覈度越諸子修等進秩庚子宣和中進士李繪以舊書参新書而為之注崇寧五年董衡為釋音二十五卷呉縝糾繆二十卷宋祁傳修唐書十餘年皇祐元年刋修自出亳州皆以藁自随撰列傳一百五十卷進唐書表唐有天下㡬三百年其君臣行事之始終所以治亂興衰之迹與其典章制度之英宜其粲然著在簡册而紀次無法詳畧失中文采不明事實零落盖百有五十年然後得以發揮幽昧補緝闕亡黜正偽謬克備一家之史其事則増於前其文則省於舊至於名篇著目有革有因立傳紀實或増或損義類凡例具載别録晁氏志劉昫因韋述舊史増損以成繁畧不均多所漏闕又是非失實嘉祐中歐陽修宋祁撰新書議者頗謂永叔學春秋每務褒貶子京通小學唯刻意文章采雜説既多有失實之歎樊先生注新書紀十卷吕夏卿唐書直筆新例一卷五代史五代史記中興書目一百五十卷薛居正等撰開寳六年四月二十五日戊申詔梁後唐晉漢周五代史宜令参政薛居正監修盧多遜扈䝉張澹李穆李昉等同修七年閠十月甲子書成凡百五十卷目録二卷賜器帛有差其事凡記十四帝五十三年為紀六十一志十二傳七十七其書取建康實録為凖胡旦以為褒貶失實書目又七十四卷歐陽修撰徐無黨注紀十二傳四十五考三世家及年譜十四夷附録三總七十四卷修没後熙寕五年八月十一日詔其家上之十年五月庚申詔藏秘閣呉縝纂誤三卷天聖五年二月丙申楊及上重修五代史上謂輔臣曰五代事不足法王曽曰安危之迹亦可監也淳化太祖紀雍熙四年九月直史館胡旦請修紀表志傳詔以史館西廊置修史院淳化五年十月丙午翰林學士張洎等上重修太祖紀十卷以朱墨雜書凡躬承聖問及史官採摭之事即朱以别之先是淳化五年四月癸未以李至張洎張佖范果同修國史宋人殺其大夫咸平元年八月壬戌修國史内翰宋白上言請與學士宋湜秘閣校理吳淑等同就秘閣編録太祖國朝史從之其後白等又請錢若水同修詔可魏太和以史職𨽻中書唐貞觀移史館於門下我朝因之率以台鉉典領景徳太祖太宗兩朝史景徳四年八月丁巳二十四日詔修太祖太宗正史令宰臣王旦監修國史以知樞宻院王欽若陳堯叟参政趙安仁並修國史翰林晁􅒯楊億同修直史館路振崔遵度為編修官先是九月辛夘賜宴修史院三年二月辛巳詔知制誥朱巽直史館張復同編排兩朝日厯時政記起居注行状諸司文字委欽若總領初成紀一卷帝取觀録紀中十二餘條付史官改正自此每一二卷皆先進草本多所改易祥符四年又取夏竦為編修官八年十月己丑旦等上太祖太宗紀賛論各一首九年二月十二日丁亥史成旦率史官詣崇政殿以獻凡百二十卷目録一卷帝紀六太祖太宗各三志五十五天文三地理七律厯三禮四五行二藝文七樂三職官九河渠二選舉三輿服三食貨六兵三刑法二列傳五十九后妃一宗室一臣僚四十八四夷九優詔答之戊子加旦守司徒修史官趙安仁晁逈陳彭年夏竦崔遵度竝進秩賜物王欽若陳堯叟楊億嘗預修亦賜之第賜器幣襲衣金帶命宴於修國史院天聖三朝國史三朝政範三朝聖政見後祥符九年監修國史王旦上太祖太宗兩朝國史其修真宗實録未為紀傳天聖五年二月癸酉仁宗詔曰先朝正史久而未修年祀寖遠事成淪墜宜令参政吕夷簡副樞宻夏竦修國史宋綬劉筠陳堯佐同修仍命宰臣王曽監修又命舘閣王舉正李淑黄鑑謝絳為編修復命馮元同修初於宣徽院編纂後移中書命三司檢討食貨事件三館供借書籍擇司天官編綴天文律厯志帝紀賛論吕夷簡奉詔撰紀即夷簡夏竦修撰餘皆同編修分功撰録六年八月詔别修志傳委綬看詳其帝紀專委夷簡竦八年六月十一日癸巳夷簡等曽率夷簡上詣崇政殿上進賜宴遷官賜衣帶器幣先是太祖太宗紀六志五十五傳五十九目録一凡百二十卷至是修真宗史成増紀為十志為六十傳為八十總百五十卷此所謂三朝國史也凡紀十卷志增道釋符瑞為六十卷列傳八十卷總一百五十卷甲午夏竦等遷官各賜襲衣金犀帶器幣有差監修而下進秩而夷簡辭之熈寧修仁宗英宗兩朝正史熈寧十年五月戊午詔修仁宗英宗兩朝正史以宰臣呉充提舉龍圖閣直學士史館修撰宋敏求編集賢院學士蘇頌同集賢校理王存黄履林希同為編修官七月辛未率官屬以二帝紀草二册進呈上服靴袍御資政殿學士内侍進案充與敏求進讀上立而覽之顧問反復至讀畢始坐充等降階以謝又命坐賜茶元豐兩朝正史熈寧十年丁巳五月戊午命官修兩朝正史元豐五年六月甲寅修成一百二十卷紀五卷志四十五卷天文至河渠傳七十卷比之實録事迹頗多但非㓂凖而是丁謂託之神宗詔㫖上御垂拱殿引監修國史王珪修史官蒲宗孟李清臣王存趙彦若曽肇進讀紀賜珪宗孟銀絹對衣金帶清臣等遷官及與修史官蘇頌黄履林希蔡卞劉奉世以他職罷去各賜銀絹有差故相呉充故史館修撰宋敏求賜銀絹七月丁未以史成於垂拱殿燕修史官三朝史天聖五年二月修至八年六月成凡歴四年兩朝史熙寧十年五月戊午修至元豐四年六月成凡歴五年元豐修五朝史四年七月二十四日己酉詔直龍圖閣曽鞏素以史學見稱士類見修兩朝國史将畢當與三朝史通修成書是年十一月廢編修院入史館宜以鞏充史館修撰專典史事十一月鞏上太祖總論不稱上意五年四月遂罷修五朝史紹興七朝史九年正月丙申十五日王銍上元祐八年補録及七朝國史遷一秩銍以建隆至元符信史屢更書多重􅃨乃以七朝國史自紀志𫝊外益以宰執宗室世表公卿百官年表然所修不克成紹興修三朝史神哲徽二十八年八月戊子朔置國史院修三朝正史一云七月丙子置國史院三十一年提舉陳康伯奏乞進呈帝紀三十卷至乾道二年閏九月二十九日己巳上與太上皇帝聖政同進呈奉安於顯謨閣淳熈修四朝史淳熈五年四月禮部侍郎同修史李燾言今修四朝正史開院已十七年自開院至成書凡二十有八年乞降睿㫖責以近限庶㡬大典早獲備具詔限一年至七年十二月十二日國史院上四朝正史志一百八十卷地理一志全出李燾之手餘多采續通鑑十二年七月同修史洪邁奏神宗至於欽宗𫝊叙相授閲六十五年除紀志巳進外當立𫝊者千三百人其間妃嬪親王公主宗室㡬當其半乞傚前代諸史體例分類載述不必人為一傳至十三年十一月二十二日上國史列𫝊一百三十五卷宣仁欽聖𫝊居首目録二卷初乾道二年胡元質言三朝之史開院纂輯累年於兹竊見靖康繼宣和之後以功緒本末則相闗以嵗月久近則相繼伏望併修欽宗帝紀繳進名為四朝國史四年三月二十四日詔進呈欽宗實録并本紀已畢就修纂四朝正史從洪邁之請也十三年八月十九日邁又請通修九朝正史上許之復言制作之事已經先正名臣之手是非褒貶皆有据依乞命史官無或删改書未就而邁去國初元祐七年七月十二日詔范祖禹趙彥若修神宗正史吕大防提舉八年三月二十二日己亥進紀草元符元年四月進帝紀二册崇寧三年書成八月三日進大觀四年四月二十九日命鄭久中等修哲宗正史政和二年四月三日帝紀成四年五月二十二日進哲宗正史帝紀表志𫝊目録總二百十卷淳熙東都事畧淳熙十三年八月二十六日知龍州王稱上東都事畧百十三卷紀十二世家五列傳百五附録八明年春三月除直秘閣其書特掇取五朝史𫝊及四朝實録附傳而微以野史附益之淳祐四朝史淳祐二年二月進紀十一年命史官分撰志𫝊編修官王撝撰輿服志四卷寳祐二年八月二十三日癸巳進志傳五年閏四月四日修潤上之宋朝蘇氏古史劉羲叟十三代史志書目六十卷蘇轍作因司馬遷史記上觀詩書下考春秋及秦漢雜録起伏羲神農訖秦始皇帝為七本紀十六世家三十七列傳謂之古史紹聖二年三月成子遜為注其去取之意劉羲叟著十三代史志劉氏輯歴春秋災異南北史韻目古者無國無史史未嘗一日無書漢法太史公位丞相上唐及本朝宰相兼史官其重如此故書榻前議論之辭則有時政記録柱下見聞之實則有起居注類而次之謂之日厯修而成之謂之實録所以廣記備言垂一代之典也韓宣子見易象魯春秋而知周公之徳則守文者不可無史蕭何收秦圖書而知天下阨塞户口彊弱則創業者不可無史江淹有言修史之難無出於志司馬遷曰書班固曰志蔡邕曰意華嶠曰典張勃曰録何法盛曰説餘史並謂之志古所謂良史者明周萬事之理道適天下之用智足以通難知之徳文足以發難顯之情司馬談之子遷劉向之子歆班彪之子固王銓之子隠姚察之子簡李大師之子延夀劉知㡬之子餗繼世汗簡非遷固之博聞不足以網羅放失非南董之遺直不足以裁正是非通倚相丘索之書專羊肹春秋之學光武注記定於永平神堯實録上於貞觀采四方之志成一家之言業鉅事叢簡䇿挐繁蕭斧衮章一言褒貶芸籖縹袠百世勸懲綜覈班紀發揮蒼雅鉤深學海囊括詞林玉琰其版金縢其匱四皇墳六帝典在漢之初史職為盛郡國文計先集太史之府欲其詳悉於體國也必閲石室啓金匱抽裂帛檢殘竹欲其博練於稽古也是立義選言宜依經以樹則勸戒與奪必附聖以居宗然後銓評昭整苛濫不作矣然紀傳為式編年綴事文非汎論按實而書嵗遠則同異難宻事積則起訖易疎斯固總㑹之為難也或有同歸一事而數人分功兩記則失於複重偏舉則病於不周此又銓配之未易也俗皆愛竒莫顧實理𫝊聞而欲偉其事録遠而欲詳其跡於是棄同即異穿鑿傍説舊史所無我書則博此訛濫之本源而述遠之巨蠧也玉海卷四十六
