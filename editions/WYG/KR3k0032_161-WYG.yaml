body:
  text: 玉海卷一百六十一宋王應麟撰宫室堂古者為堂自半已前虚之謂堂半已後實之為室堂者當也謂當正向陽之屋堯堂史記太史公曰墨者言堯舜堂高三尺土階三等茅茨不剪采椽不斵論衡蓂莢生於階下須臨堂察之乃知莢數禮器疏天子之堂九尺此周法也明堂位正義多士傳云天子堂廣九雉三分其廣以二為内五分其内以一為高東房西房北堂各三雉孔子堂講堂書序魯共王升孔子堂聞金石絲竹之音後漢紀永平十五年三月幸孔子宅親御講堂説經祭彤𫝊永平中坐孔子講堂顧指子路室云云鮑永𫝊孔子闕里無故荆自除從講堂至于里門郡國志王屋縣有孔子學堂九域志鄆州古講堂孔子為中都宰於此堂教授兖州有孔子學堂雩臺鄭𤣥别𫝊北海有儒林講堂漢朝堂西都賦左右庭中朝堂百僚之位蕭曹魏邴謀謨乎其上佐命則垂統輔翼則成化西京賦朝堂承東温調延北考工記外有九室注如今朝堂諸曹治事處疏謂正朝之左右為廬舍者後明帝紀永平十七年五月公卿百官以帝威徳懐逺祥物顯應並集朝堂奉觴上夀後𫝊袁安為太僕元和二年武威太守孟雲上書南部鈔掠宜還其生口詔百官議朝堂和帝即位竇憲擊北匃奴安與宋由任隗及九卿詣朝堂上書諫至免冠朝堂固争者十上朱暉永平初東平王蒼聞而辟之正月朔旦蒼入賀坐朝堂求璧不可得暉奉之張酺為太尉與司𨽻校尉晏稱㑹於朝堂鄧隲等永初中並奉朝請有大議詣朝堂與公卿參謀斑勇為軍司馬元初六年公卿以為宜棄西域鄧太后召勇詣朝堂㑹議黄瓊争議朝堂莫能抗奪竇武陳蕃共㑹朝堂陳球為廷尉宦者欲别𦵏竇太后詔公卿大㑹朝堂令中常侍監議應劭為車騎將軍掾中平二年漢陽賊與羌胡為冦詔百官大㑹朝堂皆從劭議鮮卑熹平六年秋冦邊召百官議朝堂議郎蔡邕議曰云云蔡邕獨斷赦令召三公詣朝堂受制書晉志漢遣將出征授節鉞於朝堂晉令有朔望集公卿於朝堂漢玉堂詳見建章宫列𫝊李尋對臣位卑術淺過随衆賢待詔乆汙玉堂之署注師古曰玉堂殿在未央宫揚雄解謿幸得遭盛明之世歴金門上玉堂注晉灼曰黄圖有大玉堂小玉堂殿翼奉上疏孝文時未央宫無玉堂殿谷永對抑損椒房玉堂之盛寵注椒房皇后所居玉堂嬖幸之舍史記玉堂璧門正義漢武帝故事云玉堂内殿十二門階陛咸以玉為之門三層臺高十餘丈椽首欂以璧為之因名璧門郊祀志建章宫南有玉堂璧門眺瑤堂後靈帝紀中平三年二月修玉堂殿靈帝又造萬金堂官志玉堂署長一人本注宦者主中宫别處翟酺𫝊上疏曰損玉堂之盛尊天爵之重宦者𫝊使鈎盾令繕修南宫玉堂又鑄四鍾懸於玉堂及靈臺殿前按靈紀已下云云則東都别有玉堂西都賦金華玉堂西京賦宣室玉堂譬衆星之環極三輔黄圖未央宫有殿閣三十二椒房玉堂在其中漢宫閣記云未央宫有玉堂宣室閣漢書曰建章宫南有玉堂璧門三層臺高三十丈玉堂内殿十二門階陛皆玉為之又有玉堂神明堂二十六殿漢武故事玉堂去地二十丈喬公鼎銘延公入于玉堂前廷洛陽宫殿名南宫有玉堂前後殿漢甲觀畫堂成帝紀元帝太子宫甘露三年生甲觀畫堂元后𫝊云甲館黄圖曰宫殿中采畫之堂在北宫應劭曰在太子宫黄圖同霍光𫝊止畫室中不入注雕畫之室西都賦豐冠山之朱堂西都賦左墄右平注摯虞决疑要注曰太極乃有陛堂則有階無陛平以文塼相亞次墄為陛級西京賦云云注墄階齒也天子殿高九尺階九齒各有九級其側階各中分左右左有齒右則滂沲平之令輦車得上漢延清堂見殿類漢始生堂章紀元和三年二月癸酉還幸元氏祠光武顯宗於縣舍正堂明日又祠顯宗於始生堂皆奏樂詔復元氏七年徭役明帝建武四年光烈后從征彭寵生于常山元氏𫝊舍永平五年十月行幸鄴常山三老言曰上生於元氏願䝉優復詔復元氏縣田租更賦六嵗漢黄堂郭丹𫝊太守杜詩勅以丹事編黄堂以為後法注太守之聴事漢承明堂袁紹𫝊抽戈承明注山陽公載記曰紹等入端門遂於承明堂上格殺中常侍高望等二人蜀漢爵堂蜀都賦内則議殿爵堂武義虎威宣化之闥崇禮之闈華闕雙邈重門洞開金鋪交映玉題相暉魏鳴鶴堂魏都賦注聴政殿後有鳴鶴堂椒梓坊木蘭坊文石室後宫所止魏東西堂山謙之丹陽記太極殿周制路寢也秦漢曰前殿今稱太極曰前殿洛宫之號起自魏東西堂亦魏制於周小寢也皇后正殿曰顯陽東曰含章西曰徽音乂洛宫之舊也含章名起後漢顯陽徽音亦起魏輿地志洛陽有顯陽殿皇后正殿也魏明所建昭陽晉避諱改在太極之北鑄黄龍高四丈鳯凰二丈置殿前魏茅茨堂水經注河南魏文帝茅茨堂前有茅茨碑是黄初中所立也晉太極東堂尚書都堂晉制大㑹於太極殿小㑹於東堂列𫝊山簡為尚書左僕射領吏部上疏曰武帝受禪泰始之初躬親萬機時黄門侍郎王恂庾純始於太極東堂聴政平尚書奏事多論刑獄王渾奏先帝時正㑹後東堂見征鎮長史司馬諸王國卿諸州别駕郤詵遷雍州刺史武帝於東堂㑹送摯虞舉賢良武帝詔諸賢良方正直言㑹東堂策問李密賜餞東堂孝友成帝紀咸康六年七月乙卯初依中興故事朔望聴政於東堂宋符瑞志咸康二年四月甘露降尚書都堂桃木魏甘露元年二月丙辰宴羣臣於大極東堂齊東堂校籍晉宣猷堂文選陸士衡機皇太子宴𤣥圃宣猷堂詩云云注宣猷堂名在園中南朝亦有之齊東宫𤣥圃園宣猷堂梁宣猷堂宴餞中庶子謝嘏梁太子於東宫宣猷堂開講晉仁夀堂晉宫閣名洛陽宫有則百堂螽斯堂休徴堂延禄堂仁夀堂綏福堂含芳堂樂日椒華芳音顯成承光五福嘉寧堯母永光長夀堂晉西堂宋志晉咸康元年四月二年四月甘露降西堂周顗𫝊帝燕羣公于西堂桓冲𫝊冲將之鎮帝餞於西堂賜錢五十萬宋書蔡廣荅傅亮曰如今含章西堂足下在僕射下侍中在尚書下宋太子納妃於太極殿西堂叙宴晉樂賢堂五行志成帝咸和六年正月丁巳㑹州郡秀孝於樂賢堂蔡謨傳彭城王紘上言樂賢堂有先帝手畫佛像宜勅作頌帝下其議謨曰佛者夷狄之俗非經典之制遂寢宜城王為之頌庾闡有樂賢堂頌梁太子起樂賢堂使畫工先圖劉孝綽晉積弩堂初學記費北有積弩堂晉成帝作見宋永初山川古今記梁庾肩吾詠疏圃堂晉中堂穆紀升平元年三月帝講孝經壬申親釋奠于中堂禮志穆帝孝武權以中堂為太學宋紀泰始五年三月丙寅幸中堂聴訟晉延賢堂宋志晉太元十九年正月華林園延賢堂西北李連理宋永初元年十二月二年十月癸卯元嘉三年五月丙午臨延賢堂聴訟宋閲武堂梁儀賢堂紀宋孝武帝即位十月癸未聴訟於閲武堂齊永明四年正月辛亥耕籍田甲寅幸閲武堂勞酒戊午幸宣武堂講武建元元年九月戊申幸宣武堂宴㑹詔賦詩梁天監六年九月乙亥改閲武堂為徳陽堂聴訟堂為儀賢堂朱异於儀賢堂述老子義太清元年五月丁酉幸徳陽堂宴羣臣後魏清徽堂觀徳殿流化渠凝閒堂茅茨堂皇信堂宣極堂光極堂後魏傳孝文南征還洛引見王公侍臣於清徽堂帝曰此堂成來未與王公行宴樂之禮今與諸賢欲無高而不升無小而不入因之流化渠洗煩池帝曰此池有嘉魚任城王澄曰所謂魚在在藻有頒其首帝曰且取王在靈沼於牣魚躍次之觀徳殿帝曰射以觀徳故以命之次之凝閒堂帝曰此堂取夫子閒居之義不可縱奢以忘儉自安以忘危故此堂後作茅茨堂謂李冲曰此東曰步元廡西曰游凱廡此堂雖無堯舜之君卿等當無愧元凱帝曰光景垂落朕同宗有載攷之義卿等將出何得黙爾徳音即命黄門侍郎崔光郭祚通直郎邢巒崔休等賦詩燭至公卿辭退冲再拜上千萬嵗夀帝曰卿等以燭至致辭復獻萬夀朕報卿以南山之詩乃曰燭至辭退庶姓之禮在夜載攷宗族之義卿等且還朕與諸王宗室欲成此夜飲又詔延四廟之子下逮𤣥孫之胄申宗宴於皇信堂令宗室賦詩又㑹百寮於宣極堂行飲至策勲之禮紀太和十九年十二月甲子見羣臣光極堂唐朝堂儀衛志百官就班文武列于兩觀監察御史立於東西朝堂甎道以涖之平時𫝊㸃畢内門開監察御史領百官入夾階監門校尉執門籍曰唱籍序班于通乾觀象門南入宣政門朝堂置左右引駕三衛六十人禮志元正冬至朝賀有司設羣官客使等次於東西朝堂設門外位文官於東朝堂介􅈶公在西朝堂之前武官在介公之南少退毎等異位重行皇帝加元服設門外位於東西朝堂如元旦皇太子加元服九品已上皆詣東宫朝堂餘公服集於重明門外朝堂册太子有司設太子次于東朝堂之北西向官志左諫議大夫垂拱二年鑄銅匭四列于朝堂内謁者監命婦下車則導至朝堂奏聞監察御史分日直朝堂入自側門非奏事不至殿庭正門無籍知朝堂左右廂天授中詔側門置籍得至殿庭開元七年又詔随仗入閣鴻臚卿凡獻物駝馬則陳于朝堂太府丞㑹賜及别勅六品以下賜者給於朝堂實録貞觀元年五月癸丑勅中書令侍中於朝堂受訟二年八月甲戌幸朝堂親覽寃屈開元二年二月癸丑宴突厥使新羅王子八月辛巳引見河隴從軍壯士置酒享之十五年四月丙午王君􅎢凱旋置食宴之二十年五月丁卯召河北立功將士宴勞是嵗二月二十二年九月辛巳宴朝集使二十四年二月甲寅宴新授縣令皆於朝堂至徳二載九月丁亥廣平王東討百寮拜送于朝堂㑹要建中元年二月於朝堂别置三司决庶獄辨争者輙擊登聞鼓右司郎中裴諝上疏上命歸於有司太和四年三月三院御史入朝堂前無止泊所請置祗􅀱院長慶元年八月於中書南置僕射祗􅀱院通典朝堂册命諸臣設受册者次於東朝堂魏徴拜太子太師詣朝堂辭六典注棲鳯閣下即朝堂舒元輿御史臺新造中書院記御史府故事於中書之南常有理所太和四年於政事堂直阡之南選地以作之號中書南院院門北闢嚮朝廷也觀者命為御史北臺唐政事堂百官志兼据宰相表唐初三省長官議事于門下省之政事堂高宗𢎞道元年十二月甲戌裴炎自侍中遷中書令乃徙政事堂于中書省㑹要永淳二年七月即𢎞道元年李華記光宅二年徙恐非光宅元年炎已誅通鑑𢎞道元年十二月徙開元中張説為相㑹要十一年又改政事堂號中書門下政事印亦改為中書門下之印列五房於後一曰吏房二曰樞機房三兵房四户房五禮刑房分曹以主衆務焉中書舍人一人知制誥顓進畫給食政事堂五行志乾符六年宣授宰臣制百官班賀于政事堂列𫝊裴炎改中書令永淳二年以侍中遷舊例宰相議事于門下省號政事堂長孫無忌以司空房𤣥齡以僕射魏徴以太子太師皆知門下省事至炎以中書令執政事筆故徙於中書省李靖二日一至中書門下平章事崔元綜天授初同平章事坐政事堂束帯終日不休偃源乾曜進位侍中議者言執政以同休戚不崇異無以責功㑹要開元十年八月帝乃詔中書門下共食實户三百十一月二十八日堂封自此始齊澣有王佐才𤣥宗時張説擇丞轄以王丘為左澣為右李元紘杜暹當國表宋璟為吏部尚書澣及蘇晉為侍郎世謂臺選嘗奏事帝指政事堂曰非卿尚誰居者李峴為相故事政事堂不接客自元載為相中人𫝊詔者引升堂置榻待之峴至勅吏撤榻苖晉卿年老乞間日入政事堂李吉甫為相初政事堂㑹食有巨牀相𫝊徙者宰相輙罷不敢遷吉甫笑曰世俗禁忌何足疑邪徹而新之常衮為相政事堂北門一云後門異時宰相過中書舍人院咨訪政事至衮乃塞之大厯十二年㑹要建中四年以示尊大將辭堂封它相不從方止鄭餘慶為相主書滑渙指畫宰相前餘慶叱去鄭珣瑜為相王叔文内交奄人攘撓政機韋執誼為宰相居外奉行叔文至中書直吏白宰相㑹食百官無見者執誼起就閤與叔文語珣瑜曰吾可復居此乎歸卧家不出鄭覃五日一入中書商量政事杜佑憲宗詔三五日一入中書平章政事㑹要元和二年正月司徒平章事杜佑告老云云裴度文宗詔進司徒平章重事三日一入中書太和四年六月孔緯昭宗送至堂視事㑹要至徳二載三月宰相分直政事堂之筆毎一人知十日謂十日一易貞元十年五月八日又分毎日一人執筆先是九年七月詔宰相以旬秉筆從陸贄之請也總章二年諸宰相以政事堂供饌珍美議減其料張文瓘𫝊云同列以堂饌豐餘欲少損東臺侍郎張文瓘曰此食天子所以重機務待賢才也不可乃止大厯十二年八月癸卯常衮乞停賜饌建中三年正月宰臣請堂厨錢三分省一開元元年十二月蘇頲除中書侍郎仍令宰臣宣指移文政事院便供政事食明日加知制誥本傳云給食自頲始天寳五載六月三日勅三伏内令宰相辰時還宅太和元年四月宰臣對罷召常侍諫議給事舍人起居補闕拾遺集于政事堂宣㫖有論奏並宜對元和八年十一月壬子上命丞相召太史韓愈至政事堂諭以田𢎞正忠義令撰先廟碑李華中書政事堂記云政事堂者自武徳以來常於門下省議事謂之政事堂故長孫無忌起復授司空房𤣥齡授左僕射魏徴授太子太師一作保皆知門下省事至高宗光宅元年裴炎自侍中除中書令執宰相筆乃遷政事堂於中書省記曰君不可枉道於天反道於地覆道於社稷無道於黎元此堂得以議之臣不可悖道於君逆道於人黷道於貨亂道於刑尅一方之命變王者之制此堂得以易之兵不可擅誅權不可擅施貨不可以擅蓄主澤不可以擅奪君恩不可以擅間私讎不可以擅報公爵不可以擅私此堂得以誅之事不可以輕入重罪不可以生入死法不可以剥害於人財不可以擅加於賦情不可委之以倖亂不可啟之於萌代紊不賞削紊不封知荒不救見饉不矜逆諫自賢違道變古此堂得以殺之故曰廟堂之上樽爼之前有兵有刑有梃有刄有斧鉞有酖毒有破家有覆族此堂得以行之故伊尹放太甲之不嗣周公逐管蔡之不義霍光去昌邑之亂梁公正廬陵之位君弱臣强之後宰相主生殺之柄天子掩九重之耳爕理化為權衡論道變為機務傾身禍敗不可勝數列國有𫝊青史有名幸為誡之無罪斯記李庾賦西則月華重啟銀臺内向中書在焉密用宰相杜甫詩落筆中書堂唐號令堂地理志太原府晉陽縣有號令堂高祖誓義師于此西北十五里有講武臺飛閣顯慶五年築唐西堂魏鄭公諫録太宗坐於丹霄門外之西堂引公及李靖温彦博等入宴言羣臣才行唐東堂舊史開元十七年八月乙酉尚書右丞相張説為尚書左丞相開府儀同三司兼吏部尚書宋璟為尚書右丞相尚書左丞相源乾曜為太子少傅宋璟𫝊十七年為尚書右丞相而張説為左丞相源乾曜為太子少傅同日拜有詔大官設饌太常奏樂㑹百官尚書省東堂帝賦三傑詩自寫以賜唐尚書省都堂通典唐開元禮朝集使於尚書省禮見奉禮郎先布版位於尚書省都堂之前舊尚書令有大𠫊當省之中今謂之都堂㑹要貞觀九年十一月二十九日勅冬薦官都堂訪以理術兼時務狀貞觀二十一年正月詔五品已上於尚書都堂餞囘紇等舊紀貞元九年十一月甲辰制薦官宜令尚書丞郎於都堂訪以理術論時務狀考其通否及歴任考課事迹定為三等御史一人監試授官後殿最舉主元和三年四月己卯裴均為尚書省都堂上僕射唐起義堂宸扆台衡銘地理志北都宫城東有起義堂又見晉陽宫類音訓起義堂在乾陽門街𤣥宗立碑仍書理道要訣引𤣥宗起義堂碑舊史開元十一年正月辛卯幸并州上親製起義堂頌及書刻石紀功于南街改本州為大原府㑹要十一年正月二十五日至并州張説曰太原國家大業所起宜因行幸建碑紀徳文粹起義堂頌或云一行撰或云張説高祖龍躍晉水鳯翔太原開咸陽入天門金石一變日月重華癸亥之嵗春正月濟河横汾緬慕本邦姬詠周原劉歌沛邑火旗炎炎雲鳥洋洋五星迓帝萬國謳唐威雅連戮老生摧斃山祗引軍河龍渡帝帝謂太宗表正封畧濤蕩飈掃霆馳雷爍於昭義堂誓衆資始云云張説述聖頌曰開元十有一祀正月整兵耀武入于太原設都建頌以崇王業馬燧𫝊徳宗初為河東節度使朱泚反帝幸梁時天下方擾北邊數有警燧念晉陽王業所基宜固險以示敵乃引晉水架汾而屬之城及平李懐光還太原帝賜宸扆台衡二銘并序以言君臣相成之美勒石起義堂西偏帝榜其顔而寵之㑹要云貞元九年十月上以馬燧平汴宋魏博河中其功益高賜宸扆台衡二銘一云元年唐考堂舊紀建中元年十一月辛酉朔朝集使及貢士見宣政殿兵興以來四方州府不上計内外不朝㑹者二十五年至此始復舊制州府計吏至者一百七十三柳冕傳冕為福建觀察使自以乆疏斥乃上表乞代且推明朝覲之意曰臣竊感江漢朝宗之誼鹿鳴君臣之宴夫朝㑹禮之本也唐虞之制羣后四朝以明黜陟商周之盛五嵗一見以考制度漢法三載上計以㑹課最有唐稽古天下朝集三考一見皆以十月上計京師十一月禮見㑹尚書省應考績事元日陳貢篚集於考堂唱其考第進賢以興善簡不肖以黜惡安史亂常始有不朝臣請率先徳宗許之李林甫𫝊天寳八載張博濟為户部郎中部有考堂天下嵗㑹計處博濟廢為㕔事别取都水監地為考堂㑹要云以諸州籍帳錢造考堂㑹要貞觀三年房𤣥齡王珪掌内外官考權萬紀奏其不平魏徴奏曰萬紀比來常在考堂當時初無駁正及身不得考乃始陳論上乃釋不問唐緑野堂裴度𫝊時閹豎擅威天子擁虚器搢紳道喪度不復有經濟意乃治第東都集賢里午橋作别墅具燠館凉臺號緑野堂激波其下度野服蕭散與白居易劉禹錫為文章把酒窮晝夜相歡不問人間事唐徳星堂徳星社復禮鄉鳴珂里一門六闕三柱里列𫝊崔鄲貝州武城人崔氏四世緦麻同爨兄弟六人至三品邠郾鄲凡為禮部五吏部再唐興無有也居光徳里構便齋宣宗聞而歎曰鄲一門孝友可為士族法因題曰徳星堂後京兆民即其里為徳星社崔邠上疏論裴延齡姦以鯁亮知名郾類六經要言十篇上敬宗治虢以寛涖鄂則嚴鄲節度劍南西川及淮南徐岱蘇州嘉興人大厯中為校書郎觀察使李栖筠欽其賢立所居為復禮鄉名逹于朝張嘉祐蒲州猗氏人兄嘉正為相時任右金吾衛將軍昆弟毎上朝軒盖騶導盈閭巷時號所居坊曰鳴珂里朱敬則亳州永城人以孝義世被旌顯一門六闕相望咸亨中高宗召見異之楊炎鳯翔天興人三世以孝行聞至門植六闕古所未有後為相劉仁軌汴州尉氏人咸亨五年東伐新羅破之進爵為公子及兄子受上柱國者三人州黨榮之號所居為樂城鄉三柱里後漢荀淑有子八人居西豪里縣令苑康曰昔高陽氏有才子八人遂書其里為高陽里時人號曰八龍宋朝都堂國初典禮之事當集議者皆先下詔都省吏以告當議之官悉集都堂設左右丞座於堂之東北南向御史中丞於堂之西北南向尚書侍郎於堂之東廂西向兩省侍郎常侍給事諫舍於堂之西廂東向知名表郎官於堂之東南北向監議御史於堂之西南北向又設左右司郎中員外於左右丞之後三院御史於中丞之後郎中員外於尚書侍郎之後起居司諫正言於諫舍之後如有僕射御史大夫即座於左右丞中丞之前如更集它官即諸司三品於侍郎之南東官一品於尚書之前武班二品於諫舍之南皆重行異位卑者先就席以官高者為表首祥符四年五月一日詔曰文昌揆路師長百僚自今宰相官至僕射者並於中書都堂赴上不帯平章事者亦本省赴上令太常禮院崇文院詳定儀注明年二月禮院上儀注至和二年七月九日詔宰相召自外者百官班迎之自内拜者聴行上事儀文富入相然亦辭之元豐五年五月九日詔新除左右僕射赴尚書省行禮上儀建炎四年五月二十日詔侍從臺諫官並赴都堂議事隆興二年十一月二十一日詔多事宜博謀侍從兩省官毎日一到都堂臺諫亦許㑹議唐六典凡議諡之法太常寺擬訖考功於都堂集省内官議定然後奏聞唐故事藩鎮帶平章事合於都堂治事刋石以紀官族視事之嵗月宋朝政事堂官志中書在朝堂西是為政事堂其屬有舍人専職誥命闕則以它官知制誥或直舍人院院在中書之西南國朝中書門下並列於外又别置中書於禁中是為政事堂與樞密院對掌大政乾徳二年四月十九日置參知政事不升政事堂止令就宣徽㕔上事淳化飛白玉堂二年十月賜承㫖蘇易簡范杲獻玉堂記慶元五年九月二十一日詔學士院創玉堂殿止以玉堂為名祥符繼照堂繼聖堂在開封府廨東真宗尹京府日太宗命創射堂習射太宗淳化五年九月壬辰以皇子襄王行開封尹事後以府尹廨舍為潛龍宮祥符三年寳訓作二年誤閏二月二十四日丁卯上幸開封府射堂宴射謂從臣曰朕昔尹京兆先帝為創此堂俾之習射周覽乆之多所感慕又至堂閱太宗御書圖畫數十軸遂宴射于射堂上作七言詩從臣畢賦上中的者七戊辰制曰昔東漢之隆過宛陵之故事貞觀之盛臨慶善之舊宫所以申愷樂之私宣優􅁉之澤朕頃在儲邸獲尹神京用修相圃之儀遐擬宣猷之地知樞密院事王欽若上駕幸舊邸七言三十一作二十韻詩上作歌以荅仍詔褒之甲戌詔曰朕頃在儲闈允釐京邑仰承訓導幸底謐寧爰就公庭載營完址俾因聴訟之暇用為習射之儀入纂邦基載移星律乘青陽之布令擁法從以來臨感慶兼深惠賚胥洽式徇宰司之議易茲題榜之名庶増煥於黄圖永流芳於元一作矍圃其開封府舊射堂宜名曰繼照堂是日設帟張樂許士庶遊觀三日麻温其進繼照堂頌初營是堂西有井將塞之上曰必有神龍潛蟄命覆巨石未幾果有龍躍出至是八作使張文遨叙其事祥符六年八月丙寅繼照堂芝草生上作歌賜近臣天聖二年八月己卯幸繼照堂景祐元年正月庚寅改為繼聖堂祥符資善堂記賜詩宴從臣讀孝經在元符觀南大中祥符八年置七年十一月己未作元符觀即劉永規廨舍一云七年十二月建觀在承天祥符門内仁宗肄學之所八年十二月戊寅皇子冠辛卯封授皇子慶國公忠正軍節度使夀春郡王祥符九年二月甲午詔以元符觀南皇子就學新堂宜以資善為名因製記取乾資始善長之義習與智長化與心成詔曰利建元子肇開懿藩將崇樂善之規式務從師之教眷惟丹禁夙敞清都就茲曲密之庭以為誦􅁌之地命晏殊崔遵度為記室咨議長編云張士遜崔遵度為友在正月壬申入内押班周懐正為都監入内供奉官楊懐玉為夀春郡王伴讀仍面戒堂中無得戯笑及陳玩弄之具庶事由禮使王親近僚友三月庚申夀春郡王㑹友張士遜等于堂上作七言詩六篇分賜之丁卯讀孝經序終篇賜士遜等㑹于堂上賜詩三首四月戊戌郡王請以聖製堂記及賜諸王詩刻石堂壁五月戊午詔奬王友張士遜等以王讀孝經徹章故也王初為詩即成章有人心懐禮義之句上喜語輔臣九月丁未讀論語第二卷畢賜㑹于資善堂天禧二年正月乙未朔上宴宗室于是堂辛亥詣元符觀資善堂宴從臣召夀春王府官屬因出聖製資善堂記元符觀頌及聖製賜郡王恤黎民守文儉約等七詩及王之詩什書翰示輔臣向敏中等曰王始著吟詠句意精竒天縱才藝咸再拜稱賀二月丁卯制行江寧尹進封昇王八月甲辰立為皇太子癸丒作元良箴又製十韻詩各一首分賜庶子賔客以下九月丁卯天安殿册太子三年九月丙子賜元良述六蓺箴承華要略四年徙御厨北一作禁庖之北東一云宣祐門内廡其講筵所亦在焉十月乙卯資善堂上梁是嵗正月十七日幸太子㑹宫僚觀之十一月庚午御札中書密院常務令宰臣與太子就資善堂㑹議壬申輔臣見皇太子於堂十二月九日乙酉詔隻日承明殿不視事中書樞密院詣資善堂議事辛丑太子㑹師傅宫寮于是堂賜教坊樂先是天禧元年九月甲子讀論語畢苐九卷宴王友于堂四年十月壬辰以太子太保王欽若為資政大學士日赴資善堂侍講讀五年三月庚子宰臣兼太子師傅十日一赴是堂賔客以下隻日更侍講學四月十一日戊午以太子生辰宴輔臣宫僚于堂五月癸未詔皇太子讀春秋輔臣奏曰臣等時入資善堂陪侍講席太子天姿英邁好學不倦寫字有筆法上喜仁宗寳元二年三月癸丑詔賈昌朝王宗道於是堂編排書籍教授内臣以編修為名四月戊辰命趙希言楊安國編排癸未罷之皇祐元年七月壬子帝幸是堂作詩有仰懐慈訓之句説書所寓資善堂慶厯初改為講筵所至和二年三月宴餞知徐州吕溱於是堂臣治平四年五月餞李柬之十月乙卯餞李受命侍賦詩時謂逺過二疎元豐八年哲宗初即位十二月二日詔十五日開講筵講論語讀寶訓講讀日赴資善堂以雙日講讀仍輪一員宿直十五日乙亥初御邇英閣詔宰輔記注講讀官宴于資善堂賚銀帛有差元祐元年三月十六日詔講讀官更不輪資善堂宿直六年詔史院寫邇英延義記注送資善堂徽宗政和元年三月二十七日定王嘉王出就資善堂聴讀二年詔許講筵官到堂參見宣和元年四月詔置直講翊善賛讀明道夀寧堂宫中有清浄堂明道元年十月改曰夀寧明道中奉太祖御容于夀寧堂慶厯定州閱古堂八年夏五月天子以河朔地大兵雄而節制不専詔魏瀛鎮定四路悉用儒帥兼安撫使而以韓琦帥定州郡圃有亭琦廣之為堂既成乃摭前代良守將之事可載諸圖而為法者凡六十條繪于堂之左右壁名為閲古堂富弼為之作詩書目閲古堂詩一卷治平聞義堂元年六月丁未増置同知大宗正事一員以宗惠領其職且降詔申儆之宗惠即所居築堂曰聞義日與學士大夫講肄其間以身倡率宗屬政和摛文堂五年十月二十九日乙丑御書摛文堂牓賜學士院承㫖强淵明等上表謝紹興資善堂孝經圖詳見東宫類五年五月八日辛巳詔擇日除防禦使孝宗舊名為節度使封國公出就資善堂聴讀先是元年四月戊申以至和故事面諭宰臣宗尹等輔臣奏事趙鼎曰昨日得㫖見上臣退而與孟庾沈與求商量皆仰賛陛下為宗廟社稷大慮謹令有司卜本月二十六日吉上曰可與求曰此盛徳之事也上曰朕年二十九未有子然國朝自有仁宗故事藝祖剏業其勤至矣朕取子行下子鞠於宫中復加除拜庶幾仰慰在天之靈初張浚未出使也上嘗以語鼎浚庾與求曰此子天姿特異在宫中儼如成人朕自教之讀書極强記鼎先得㫖於行宫門内造書院屋一區欲令就學有司以圖來上凡建屋十六間從約也至是書院成上曰只以書院便為資善堂俟除授訖命儒臣為直講翊善悉如故事二十六日己亥貴州防禦使為保慶軍節度使封建國公詔宗正少卿直史館㑹要云徽猷待制史館修撰范冲兼資善堂翊善起居郎朱震兼資善堂賛讀上親筆付出朝論以二人為極天下之選六月五日宰臣趙鼎循故事乞謁見上曰朕令國公至資善見冲震皆設拜盖尊師重傅不得不如此己酉建國公初出資善堂冲等毎因牋奏導國公以仁義之言輙標軸藏之時一展玩國公嘗得李公麟所畫孝經圖冲書其後曰孝者自然之理學然後知之行之以不息守之以至誠習與性成是謂純孝不然無以立身矣國公其勉之六年十月乙卯震冲各進官一等以建國公讀孟子終篇也十二月蘇符兼賛讀代范冲也六年九月建國公讀孟子終七年十二月十一日讀尚書終十九年三月二日普安王讀公榖𫝊終篇九年三月十四日崇國公璩赴資善堂聴讀淳祐七年正月詔就内小學建資善堂置賛讀直講俾暫於藩房訓習以其年未可出就外傅也景定東宫講堂名新益紹興御書玉堂周麟之典司内命援淳化故事以為請翼日内出玉堂二大字以賜玉堂本漢别殿在未央宫與清凉宣温神仙長年金華白虎麒麟列峙相望史不詳著而略見於李尋翼奉𫝊然則玉堂盖殿名也待詔者有直廬在焉故尋自謂乆汙玉堂之直易簡所乞太宗所賜實取諸此後避英廟諱至紹聖中始掇取二字榜于院識者非之謂不當以前代殿名皇朝寶札掲之於臣下止息之地今臣建請則所不敢惟勒石旌事以永億載之𫝊廣四方之藏侈儒生千一之遇宋朝載忻堂徳夀宫禁籞周回分四地分東則香逺梅堂清深竹堂南則載忻大堂御宴處淳熙東宫射堂二年夏始創射堂為游蓺之所圃中有榮觀玉淵清賞等堂鳯山樓皆燕息之地景定東宫堂名凝華晉成帝紀常欲於後園作射堂計用四十金以勞費乃止淳熙翠寒堂六年上作翠寒堂於禁中以日本松為之不施丹雘嘗召宰輔趙雄王淮奏事堂下古松數十清風徐來上曰林聲其清逺勝絲竹苑中有偉觀堂碧射堂七年五月壬子雄等奏昨日奏事觀堂錫燕賜宸翰淳熙議事堂十四年十一月己亥詔皇太子參决庶務先是學士洪邁入對言天禧資善之詔可舉行也至是詔右相周必大討論資善堂典禮必大奏天禧時仁宗尚幼始見輔臣恐不可用西晉有宣猷堂今作議事堂可也十五年正月二日戊戌必大請上御延和殿令宰執奏事畢然後過堂議事先是有詔東内門司改充議事堂太子隔日與宰執相見議事九日乙巳又詔毎御朝令皇太子侍立歴代堂名後漢萬金靈帝造於西園後魏凝閑雲母九華宣文代皇信代光極清徽華休茅茨隋紫霄玉華延祥碧華瑶房御福翔龍明華雕綺嘉猷芳輝花梁含光温玉繁露花光儀鸞芳音重璧光華懷芳璧月文綺輝景瑶光東西山齊華渚翠集流風崇蘭麗景鮮雲三十六國諮議琨華湛露宣徳李中媿賢螽斯則百六朝芳香芙蓉太極東西徳陽樂賢閱武崇政東西樂修集賢宣猷貞華畫北齊涼風德陽萬嵗乾壽聖壽丹臺新錄所載髙暉堂鬱絶宇室室實也人物實滿其中也黄帝特室莊子在宥篇黄帝立十九年聞廣成子在空同之上往見之退築特室席白茅閒居三月復往邀之順下風問至道周書黄帝始作宫室堯衢室管子桓公問篇堯有衢室之問者下聽於人也爾雅五達曰康四達曰衢文中子問易篇議其盡天下之心乎昔黄帝有合宫之聽堯有衢室之問舜有總章之訪皆議之謂也并天下之謀兼天下之智注當衢為室以採民言管子曰堯開衢室聽於民也子華子堯居於衢室之宫一作中垂衣而襞幅邃如神明之居輯五瑞以見羣后帶幅舄而入覲者如衆星之拱北魏文帝紀令曰放勛有衢室之問所以廣詢于下陳子昻傳堯衢室調元氣治隂陽列子堯游於康衢聞兒童謠立我蒸民莫匪爾極云云晉志堯衢尊先惠王勃九成宫頌序帝唐復衢室之尊獨孤及傳堯設誹謗之木於五達之衢淮南子堯樸桷不斵素題不枅書稽于衆舍已從人清問下民舜太室文選王融曲水詩序接禮貳宫考庸大室注尚書大傳曰維十有五祀舜為賓客禹為主人樂正進贊曰尚考太室之義唐為虞賓鄭𤣥曰舜既使禹攝天下之事於祭祀避之居賓客之位獻酒則為亞獻尚考猶言往時也太室明堂之中央室也義當為儀禮儀也謂祭太室之禮堯為舜賓也孟子舜尚見帝帝館甥于貳室夏五室冬官匠人營國夏后氏世室堂修二七廣四修一世室者宗廟也五室三四步四三尺注堂上為五室象五行也三四步室方也四三尺以益廣也木室於東北火室於東南金室於西南水室於西北其方皆三步其廣益之以三尺土室於中央方四步其廣益之四尺此五室居堂南北六丈東西七丈疏宗廟制如明堂明堂之中有五天帝五人帝五人神之室皆法五行五行先起東方故東北之室言木其實東北兼水東南兼木西南兼火西北兼金中央大室有四堂四角之室皆有堂中為大室故多一尺大室居中四角之室於大室外接四角為之夏之世室其室皆東西廣於南北周亦五室直言凡室二筵或五室皆方二筵與夏異制鄭意以夏周皆有五室十二堂明殷亦五室十二堂夏度以步殷度以尋周度以筵是王者相改也玉藻疏異義明堂制禮盛徳記曰九室月令説云四堂十二室武王牧室禮記大𫝊牧之野武王之大事也既事而退柴於上帝祈於社設奠於牧室遂率天下諸侯執豆籩逡奔走注柴祈奠告天地及先祖也牧室牧野之室也古者郊闗皆有館焉先祖者行主也莊子湯武之室周路室地官遺人十里有廬廬有飲食三十里有宿宿有路室路室有委五十里有市市有􅀱館􅀱館有積注廬若今野􅀱徒有庌也宿可止宿若今亭有室矣􅀱館樓可以觀望者也一市之間有三廬一宿周龜室春官龜人中士二人工四人掌六龜之屬天靈屬地繹屬東果屬西靁屬南獵屬北若屬凡取龜用秋時攻龜用春時各以其物入于龜室注六龜各異室也史策𫝊褚先生曰今高廟中有龜室藏内以為神寶周九室冬官匠人營國室中度以几内有九室九嬪居之外有九室九卿朝焉内外之九室指王宮后宫對言也注内路寢之裏外路門之表九室如今朝堂諸曹治事處六卿三孤為九卿疏内外據路寢之表裏言之九卿之九室在門外正朝之左右為之九嬪掌婦學之法則九室是教九御之所也周中興宫室漢劉向𫝊上疏諫曰成帝周徳既衰而奢侈宣王賢而中興更為儉宫室小寢廟詩人美之斯干之詩是也美宣王考室上章道宫室之如制下章言子孫之衆多也宫室如制謂殖殖其庭有覺其楹君子攸寧也斯干疏宣王都在鎬京此考室當是西都宫室詩云築室百堵西南其户如跂斯翼如矢斯棘如鳥斯革如翬斯飛鴻鴈之子于垣百堵皆作拾遺記昭王即位二十年王坐祗明之室齊嘖室管子桓公問篇第五十六公問曰吾念有而勿失得而勿忘為之有道乎對曰勿創勿作時至而隨毋以私好惡害公正察民所惡以自為戒黄帝立明臺之議者上觀於賢也堯有衢室之問者下聴於人也舜有告善之旌而主不蔽也禹立建皷於朝而備訊唉湯有總街之庭以觀人誹也武王有靈臺之復而賢者進也公曰吾欲效之其名云何曰名曰嘖室之議以東郭牙為之此人能以正事争君者也燕有厯室樂毅傳磨室戰國策括地志云厯室燕宫名也漢石室祕室高祖紀金匱石室注師古曰以金為匱以石為室重緘封之保慎之義大史公自序秦撥去古文明堂石室金鐀玉版圖籍散亂遷為太史令紬史記石室金鐀之書後𫝊李固對策曰宜開石室陳圖書黄瓊上疏曰宜開石室案河洛注石室藏書之府王允為司徒遷都闗中收歛蘭臺石室圖書祕緯儒林𫝊自辟雍東觀蘭臺石室宣明鴻都諸藏典策文章隋志明章繼軌石室蘭臺彌以充積魏都賦窺玉策於金縢案圖録於石室注􅀭雄遺劉歆書曰得觀書於石室魏文帝為金䇿著令藏之石室劉歆七畧内有延閣廣内袐室之府風俗通周秦以嵗八月遣輶軒之使採異代方言奏之藏祕室王元長云書笏珥彤紀言事於仙室漢五行志有非常室漢宣室列𫝊賈誼為長沙太傅嵗餘文帝思而召之至入見上方受釐坐宣室宣室未央前殿正室釐祭餘肉也漢儀注祭天地皇帝不自行還致釐上因問􅀑神之本誼具道所以然之故至夜半文帝前席既罷曰吾已乆不見賈生自謂過之今不及也東方朔武帝為竇太主置酒宣室使謁者引内董偃是時朔陛㦸殿下辟㦸而前曰偃有斬罪三安得入上黙然朔曰宣室先帝之正處也非法度之政不得入焉上曰善有詔止更置酒北宫陳忠上疏曰武帝納東方朔宣室之正何武宣帝時益州刺史王襄使辯士王褒作中和樂職宣布詩三篇頌漢徳武年十四五與成都楊覆衆等共習歌之是時宣帝求通逹茂異士召見武等於宣室上曰此盛徳之事吾何足以當之陳湯成帝時西域都䕶叚㑹宗為烏孫兵所圍上書願發敦煌兵自救上召湯見宣室對曰臣以為此必無可憂詘指計日曰已解矣王嘉成帝鴻嘉中舉敦朴能直言召見宣室對得失政事刑法志宣帝季秋後請讞時上常幸宣室齋居决事刑獄號為平注如淳曰宣室布政教之室也晉灼曰未央宫中有宣室殿師古曰賈誼𫝊亦云受釐坐宣室盖其在前殿之側也齊則居之宣紀甘露四年十月未央宫宣室閣火黄圖宣室布政教之室也温室清凉皆在未央宫殿北宣明廣明皆在未央宫殿東昆德玉堂皆在未央殿西西京賦宣室玉堂譬衆星之環極王元長策秀才文至於思政明臺訪道宣室注宣室謂漢召賢良之處長安志淮南子曰武王殺紂宣室宣室殿殷宫名一曰獄也漢盖取舊名也胡廣曰宣帝感路温舒言季秋後請讞時帝幸宣室齋居而决事令侍御史二人治書後五行志有南宫宣室殿漢温室魏唐見下黄圖宣室温室皆在未央宫殿北選注同温室殿武帝建冬處之温煖也宣温二室西南其户西京雜記曰温室以椒塗璧取其温且芳也被之文繡香桂為柱設火齊屏風鴻羽帳規地以罽賔􅉊毺漢宫殿䟽在長樂宫又漢宫閣記在未央宫漢書列𫝊孔光為尚書令歸休與兄弟妻子燕語終不及朝省政事或問温室省中植何木光不應注晉灼曰長樂宫中有温室殿京房元帝時奏攷功課吏法上令公卿朝臣㑹議温室霍光與羣臣奏昌邑王夜設九賔温室隋志哀帝徙温室中書于天禄閣劉向别録雅琴趙定龍徳召見温室西都賦清凉宣室今按未央宫建於高帝之七年作延清以避隆暑温室以御祁寒翼奉謂孝文時未央宮獨有前殿曲臺漸臺宣室温室承明然則孝文時有之非武帝建也史記表大事記文九年温室鐘自鳴張衡西京賦云温調延北注殿名後漢洛宫有温飭殿洛陽宫室名曰洛陽有望舒凉室含章鞠室清暑凉室拾遺記云漢武息於延凉室漢考工室畫室百官表少府有考工室居室甘泉居室令丞臣瓚曰冬官為考工主作器械太初元年更名考工室為考工居室為保宫甘泉居室為昆臺昆臺五丞列𫝊灌夫罵坐不敬繫居室注師古曰署名田蚡嘗請考工地益宅衛青嘗從入至甘泉居室劉輔繫共工獄注考工也霍光止畫室中後宫志有畫室長一人宦者主中宫别處宣紀暴室嗇夫許廣漢注應劭曰今曰薄室師古曰掖廷主織作染練之舍故謂之暴室取暴曬為名耳薄亦暴也韓延夀𫝊在東郡時試騎士歌者先居射室注李竒曰都試射堂也文選景福殿賦注李尤鞠室銘曰圓鞠方牆放象隂陽法月衝對二六相當漢文翁石室周公禮殿顔有意益州學館記華陽國志文翁為蜀郡守造講堂石室一名玉堂安帝永初間烈火為災惟石室獨存至獻帝興平元年太守高朕於玉堂東復造一石室為周公禮殿集古録有漢文翁石柱記云漢初平五年修周公禮殿水經注文翁為蜀守立講堂作石室於南城後守更増二石室唐志益州文翁學堂圖一卷金石録有周公禮殿記本朝狄遵度作石室賦慶厯四年益州守蔣堂廣其舍為宮以教諸生治平中韓絳建講堂于文翁石室之西史記索隠同州河西縣有子夏石室學堂漢西王母石室地理志金城郡臨羌縣西北至塞外有西王母石室漢織室凌室百官表少府有東織西織令丞河平元年省東織更名西織為織室中興省織室令一六典注後漢織室丞人惠紀四年七月乙亥未央宫凌室災又成帝永始元年春正月癸丑太官凌室火丙子織室災注師古曰凌室藏氷之室𡺳詩七月之篇曰納于凌隂織室主織作繒帛之處五行志劉向以為凌室所以供養飲食織室所以奉宗廟衣服霍光𫝊上乃下詔曰地節四年七月詔迺者東織室令史張赦云云外戚𫝊漢王入織室見薄姬三輔黄圖未央宫東西織室織作文繡郊廟之服有令史屬少府後周司織下大夫唐織染令後禮儀志季春之月皇后帥公卿諸侯夫人蠶祠先蠶禮以少牢有蠶壇蠶宫繭觀織室馬后紀置織室蠶于濯龍中數往觀視以為娯樂注濯龍園名也前書有東織西織屬少府平帝改名織室鄧后紀御府尚方織室錦繡氷素綺縠之物皆絶不作水經注氷室舊在宣陽門内東京賦謻門注氷室門也宋孝武大明六年置凌室修藏氷之禮周典婦功典絲典枲即漢東西織也藏氷之禮凌人掌之月令載之豳詩歌之漢街彈室周禮地官里宰毎里下士一人以嵗時合耦于耡以治稼穡趨其耕耨行其秩叙注兩人相助耦而耕也耡者里宰治處也若今街彈之室於此合耦使相佐助因放而為名疏鄭以漢法况之漢時在街置室檢彈一里之民於此合耦金石録有都鄉正街彈碑在昆陽城中中平二年正月食貨志春將出民里胥平旦坐於右塾鄰長坐於左塾畢出然後歸夕亦如之注師古曰門側之堂曰塾坐於門側者督促勸之知其蚤晏防怠惰也漢雲臺廣室隂興𫝊建武二十年夏興受顧命於雲臺廣室魏温室詳見上魏都賦丹青炳煥特有温室儀形宇宙歴象賢聖圖以百瑞綷以藻詠茫茫終古此焉則鏡有虞作繢兹亦等競注温室中有畫象賛何晏景福殿賦温房承其東序凉室處其西偏注二殿名卞蘭許昌宫賦其隂則有望舒凉室羲和温房晉宫閣名洛陽宫内有羲和温房晉廣室元帝紀有司奏太極殿廣室施絳帳帝令冬施青布夏施青綀帷周顗𫝊元帝召顗於廣室紀瞻𫝊明帝嘗獨引瞻於廣室唐温室唐大明宫有温室殿李庾西都賦左閤當辰延英耽耽宣徽洞逹温室隅南接以重離緜乎少陽是為二宫複道邃廊玉海卷一百六十一
