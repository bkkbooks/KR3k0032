  text: 玉海卷一百九十三卷一百八十七欽定四庫全書
  hash: sha256:65a082af9126d339de2eb0140ab8b8f3c09485afee59686c621e3678b3ed4ec6
  markers:
  - {type: page-break, offset: 14, content: '', id: KR3k0032_WYG_187-1a, image: WYG0947/WYG0947-0749a.png}
body:
  text: 玉海卷一百八十七宋王應麟撰兵捷檄書上檄軍書也晉侯使吕相絶秦檄書始於此漢以後方有題漢大將軍檄三秦史記兼荀悦漢紀髙祖元年夏四月漢王欲叛楚蕭何諫曰收用巴蜀還定三秦雍章邯塞司馬欣翟董翳天下可圖也乃就國拜韓信為大將軍信曰三秦王詐其衆降諸侯項王坑秦降卒二十餘萬人唯邯欣翳三人得脱秦人父兄怨此三人痛入骨髓大王入闗秋豪無所取除秦苛法無不欲得大王王秦者今舉兵而東三秦可𫝊檄而定也漢王於是舉兵出陳倉荀悦紀五月與韓信俱東漢丞相諭告巴蜀漢使諭巴蜀檄蕭何𫝊沛公為漢王何諫曰願養民以致賢人收用巴蜀還定三秦天下可圖也王曰善以何為丞相進韓信為大將軍説漢王令引兵東定三秦何以丞相留收巴蜀填撫諭告使給軍食髙紀元年夏四月拜韓信大將軍决䇿東向遂聽信䇿部署諸將留蕭何收巴蜀租給軍糧食五月引兵出襲雍定雍地八月塞翟降司馬相如𫝊元光五年夏唐䝉使略通夜郎僰中發巴蜀吏卒千人郡又多為發轉漕萬餘人用軍興法誅其渠率巴蜀民大驚上聞之乃使相如責䝉等因諭告巴蜀民非上意檄曰云云檄到亟下縣道咸諭陛下意毋忽漢左丞相韓信諭燕檄韓信𫝊髙祖三年冬十月信既破趙斬成安君問計於廣武君李左車曰今足下虜魏王禽夏説不旬朝破趙二十萬衆誅成安君名聞海内威震諸侯衆庶莫不輟作怠惰靡衣媮食傾耳以待命者當今之計不如按甲休兵百里之内牛酒日至北首燕路然後發一乘之使奉咫尺之書以使燕燕必不敢不聽從燕而東臨齊雖有智者不能為齊計矣是時燕王臧茶項羽所立於是用廣武君䇿發使燕燕從風而靡漢羽檄髙祖紀十年八月上曰陳豨反吾以羽檄召天下兵未有至者注師古曰檄以木簡為書長尺二寸有急加以鳥羽示速也魏武奏事云今邊有警輒露檄挿羽淮南王𫝊持羽檄從東方来息夫躬曰羽檄重迹而押至董仲舒云羽檄不行中國張儀檄楚尉陀移檄告横浦陽山湟谿闗見史記漢大將軍頴陰侯諭齊王及諸侯本𫝊髙后八年八月朱虚侯章告其兄齊王欲令發兵西齊王遺諸侯書曰諸吕撟制以令天下宗廟以危寡人帥兵入誅不當為王者漢聞之相國吕産等遣大將軍灌嬰將兵擊之嬰至滎陽謀曰諸吕舉兵闗中欲危劉氏而自立今我破齊還報是益吕氏資也乃留兵屯滎陽使人諭齊王及諸侯與連和以待吕氏之變而共誅之漢太中大夫諭南越南粤王𫝊文帝元年三月告諸侯四夷從代来即位意諭盛徳上召陸賈為太中大夫使越賜佗書曰云云使賈馳諭告王朕意佗遂去帝制黄屋左纛漢中大夫諭南越武紀建元六年八月閩越王郢攻南越遣王恢出豫章韓安國出㑹稽擊之未至越人殺郢降兵還嚴助𫝊漢兵踰領㑹餘善殺王以降廼令中大夫助諭意風指於南越曰天下安寧各繼世撫民禁毋敢相并有司疑其以虎狼之心貪據百越之利或於逆順不奉明詔則㑹稽豫章必有長患故遣兩將屯於境上震威武􅀭聲鄉屯曾未㑹天誘其𠂻閩王隕命輒遣使者罷屯毋後農時南越王遣太子嬰齊入侍閩越王數舉兵侵陵百越并兼鄰國陰計竒䇿入燔尋陽樓船欲招會稽之地以踐勾踐之迹西南夷𫝊建元六年大行王恢擊東粤東粤殺王郢以報恢因兵威使番陽令唐䝉風曉南粤漢中郎將諭夜郎牂柯太守諭告夜郎見兵捷西南夷𫝊建元六年唐䝉自南粤還上書曰夜郎精兵可得十萬浮船牂柯出不意此制粤一竒也乃拜䝉中郎將將千人從巴莋闗入見夜郎侯多同諭以威徳約為置吏使其子為令夜郎旁小邑聽約還報以為犍為郡漢中郎將諭烏孫張騫𫝊元狩四年天子數問大夏之屬騫曰烏孫王號昆莫稍强不肯復事匈奴厚賂烏孫是斷匈奴右臂其西大夏之屬皆可招来為外臣拜騫中郎將致賜諭指曰烏孫能東居故地則漢遣公主為夫人結為昆弟共距匈奴不足破也漢使諭滇王西南夷𫝊莊蹻楚威王時畧巴黔中至滇池㑹秦擊楚道不通以其衆王滇元鼎六年春滅南粤夜郎入朝誅且蘭卭君并殺莋侯冉駹震恐請臣置吏使王然于以粤破及誅南夷兵威風諭滇王入朝漢使者告匈奴單于詳見紀功類武紀元封元年冬十月詔曰東越東甌咸伏其辜西蠻北夷頗未輯睦朕將廵邊垂擇兵振旅躬秉武節置十二部將軍親帥師焉行自雲陽北厯上郡西河五原出長城北登單于䑓至朔方臨北河勒兵十八萬騎旌旗徑千餘里威震匈奴遣使者告單于曰南越王頭已縣於漢北闕矣單于能戰天子自將待邊不能亟来臣服何但亡匿幕北寒苦之地為匈奴讋焉匈奴𫝊云使郭吉風告單于漢使諭朝鮮見兵捷漢使諭宛西諸國西域𫝊貳師既斬宛王更立昧蔡為宛王太初四年春後歳餘天漢元年宛貴人殺昧蔡立蟬封為王遣子入侍質於漢漢因使使賂賜鎮撫之又發使十餘軰抵宛西諸國求竒物因風諭以伐宛之威漢長羅侯常惠責龜茲西域𫝊杅彌太子頼丹昭帝以為校尉田輪臺龜茲殺之姑翼曰賴丹佩漢印綬迫吾國而田必為害宣帝時長羅侯常惠使烏孫還便宜發諸國兵合五萬人攻龜茲責以前殺校尉頼丹王謝曰廼我先王時為姑翼所誤執詣惠斬之常惠𫝊本始二年惠使烏孫三年封長羅侯復遣持金幣賜烏孫惠因請龜茲國嘗殺校尉賴丹未伏誅請便道擊之與吏士五百人俱至烏孫還過發西國兵二萬人令副使發龜茲東國二萬人烏孫兵七千人從三面攻龜茲先遣人責其王以前殺漢使狀漢使喻告莎車諸國馮奉世見兵捷漢後將軍告諸羌趙充國𫝊神爵元年春初䍐开豪靡當兒使其弟雕庫来告金城西部都尉曰先零欲反後數日果反都尉留雕庫為質充國遣歸告種豪大兵誅有罪者明白自别毋取并滅天子告諸羌人犯法者能相捕斬除罪斬大豪有罪者一人賜錢四十萬中豪十五萬下豪二萬又以所捕妻子財物盡與之充國欲威信招降䍐开乃陳兵利害曰騎都尉安國前幸賜書擇羌人可使使䍐諭告以大軍當至漢不誅䍐以解其謀臣遣开豪雕庫宣天子至徳䍐开之屬皆聞知明詔羌前後降者萬七百餘人及受言去者凡七十軰復奏曰校尉臨衆承威徳奉厚幣拊循衆羌諭以明詔漢長羅侯常惠責烏孫蕭望之𫝊神爵二年遣惠使送公主配元貴靡未出塞翁歸靡死其兄子狂王背約自立惠從塞下上書願留少主敦煌郡惠至烏孫責以負約因立元貴靡漢渤海太守移屬縣龔遂𫝊宣帝時渤海歳飢盗起以遂為太守乗𫝊至界移書勅屬縣悉罷逐捕盗賊吏諸持鉏鉤田器者皆為良民吏毋得問持兵者乃為盜郡中盜皆罷漢車騎將軍諭呼韓邪單于匈奴傳竟寧元年單于復入朝上書請罷邊備塞吏卒郎中侯應以為不可許天子使車騎將軍許嘉口諭單于曰中國四方皆有闗梁障塞非獨以備塞外也亦以防中國姦邪敬諭單于之意漢益州刺史諭告廣漢羣盗孫寳𫝊鴻嘉中廣漢羣盗起三年十一月鄭躬反寳到部親入山谷諭告羣盗非本造意渠率皆得悔過自出遣歸田里漢中郎將責匈奴匈奴𫝊建平二年烏孫庶子卑援疐翕侯人衆入匈奴西界冦盗單于聞之遣左大當戸烏夷泠將五千騎撃烏孫殺數百人略千餘人卑援疐恐遣子趨逯為質匈奴單于受以狀聞漢遣中郎將丁野林副校尉公乘音使匈奴責單于告令還質子單于受詔漢大司馬移邊郡撃邯鄲檄光武紀更始至洛陽遣光武以破虜將軍行大司馬事十月持節北渡河故趙繆王子林説光武光武不荅林於是立王郎為天子都邯鄲降下郡國二年正月光武以王郎新盛乃北徇薊二月信都太守任光開門出迎世祖因發旁縣得四千人和戎卒正邳彤亦舉郡降劉植耿純據縣邑以奉光武於是北降下曲陽樂附者至有數萬人復北擊中山拔盧奴所過發奔命兵移檄邊郡共擊邯鄲郡縣還復響應更始二年二月任光𫝊光多作檄文曰大司馬劉公將城頭子路刁子都兵百萬衆從東方来擊諸反虜吏民得檄𫝊相告語兵衆大盛耿弇𫝊説光武曰公首事南陽破百萬之軍今定河北據天府之地以義征伐發號響應天下可𫝊檄而定漢大司馬移漁陽檄通鑑更始二年二月王郎遣將徇漁陽上谷急發其兵北州疑惑多欲從之耿况上谷太守遣冦恂東約彭寵欲各發突騎二千歩兵千人詣大司馬秀安樂令吴漢䕶軍盖延亦勸寵從秀而官屬皆欲附王郎寵不能奪漢出止外亭遇一儒生召而食之生言大司馬劉公所過為郡縣所稱邯鄲舉尊號者實非劉氏漢大喜即詐為秀書移檄漁陽使生齎以詣寵令具以所聞説之袁宏紀曰漢獨為檄發漁陽兵漢左大將軍武成侯移鉅鹿檄任光𫝊為信都太守更始二年春光武自薊還不知所向馳赴信都拜光左大將軍封武成侯留南陽宗廣領信都太守事使光李忠萬修將兵從邳彤將兵居前光乃多作檄文曰大司馬劉公將城頭子路刁子都兵百萬衆從東方来擊諸反虜遣騎馳至鉅鹿界中吏民得檄𫝊相告語兵衆大盛漢河内太守行大將軍事移告屬縣冦恂𫝊光武北征燕代朱鮪聞光武北而河内孤度鞏河攻温檄書至恂即勒軍馳出並移告屬縣發兵㑹於温下恂曰温郡之藩蔽失温則郡不可守更始二年漢大將軍發幽州十郡兵檄耿弇𫝊更始立光武為蕭王令罷兵二年夏四月斬王郎遣苖曾為幽州牧韋順上谷守蔡充漁陽守北之部時光武居邯鄲宫弇説曰公首事南陽破百萬之衆今定河北據天府之地以義征伐發號響應天下可𫝊檄而定秋乃拜弇為大將軍與吴漢北發幽州十郡兵弇到上谷斬順充漢亦誅苖曾悉發幽州兵引而南漢瑯邪太守王閎喻吏人檄張歩𫝊更始遣閎為瑯邪太守歩拒之不得進閎為檄曉喻吏人降得贛榆等六縣漢孟津將軍移檄馮異𫝊更始遣李軼朱鮪等共守洛陽光武將北徇燕趙以魏郡河内城邑全乃拜冦恂河内太守異孟津將軍綂二郡軍河上拒鮪等異遣李軼書云云度河擊鮪鮪走異追至洛陽環城一帀而歸移檄上狀諸將入賀并勸光武即帝位漢偏將軍移檄郡國丁綝𫝊莽末守潁陽尉世祖畧地潁陽綝説其宰降世祖以為偏將軍從征伐綝將兵先度河移檄郡國攻營畧地下河南陳留潁川二十一縣漢河西五郡大將軍告武威張掖太守竇融𫝊為張掖屬國都尉懐輯羌虜甚得其歡心是時酒泉太守梁統金城太守庫鈞張掖都尉史苞酒泉都尉竺曾燉煌都尉辛彤並州郡英俊融皆與厚善及更始敗融與統等議曰今天下擾亂未知所歸河西斗絶在羌胡中不同心勠力不能自守權鈞力齊復無以相率乃推融行河西五郡大將軍事武威太守馬期張掖太守任仲並孤立無黨乃共移書告喻之二人即解印綬云通鑑建武元年十二月漢太中大夫伏隆告郡國檄伏隆𫝊建武二年詣懷宫時張歩兄弟各擁强兵據有齊地十一月拜隆為太中大夫持節青徐二州招降郡國隆移檄告曰陛下神武奮發以少制衆故尋邑以百萬之衆潰散於昆陽王郎以全趙之師土崩於邯鄲大彤髙胡望旗消靡鐵脛五校莫不摧破梁主劉永造為詐逆今虎牙大將軍屯營十萬拔睢陽劉永奔迸此諸郡所聞也不先自圖後悔何及青徐羣盗得此惶怖獲索賊右師郎等六校即時皆降張歩遣使詣闕上書獻鰒魚光武紀建武二年冬十一月使太中大夫伏隆招張歩降之漢前將軍髙陽侯勞慰幽冀耿純𫝊真定王劉楊造䜟記與綿曼賊通建武二年春遣騎都尉陳副游擊將軍鄧隆召楊楊閉城門不内乃復遣純持節行赦令於幽冀所過並使勞慰王侯至真定誅楊漢大司馬廣平侯移平原郡檄吴漢𫝊兼紀建武四年四月己巳上幸臨平遣漢等擊破五校於臨平鬲縣注屬平原五姓共逐守長據城而反諸將爭欲攻之漢曰使鬲反者守長罪也敢輕冒進兵者斬乃移檄告郡使收守長而使人謝城中五姓大喜相率降漢征南大將軍移檄喻告蠻夷光武紀建武五年三月遣征南大將軍岑彭率二將軍伐田戎於津鄉大破之十二月交阯牧鄧遜率七郡太守遣使奉貢岑彭𫝊引兵還屯津鄉當荆州要㑹喻告諸蠻夷降者奏封其君長初彭與交阯牧鄧遜厚善與遜書陳國家威徳又遣偏將軍屈充移檄江南班行詔命於是遜與江夏太守侯登武陵守王堂長沙相韓福桂陽守張隆零陵守田翕蒼梧守杜穆交阯守錫光等相率遣使貢獻悉封為列侯或遣子將兵助彭征伐於是江南之珍始通傅俊𫝊與岑彭破秦豐因將兵徇江東􅀭州悉定漢河西大將軍凉州牧諭隗囂竇融𫝊建武六年與隗囂書曰西州地埶局廹民兵離散易以輔人難以自建計若失路不反問道猶迷不南合子陽則北入文伯耳夫負虚交而易强禦恃逺救而輕近敵未見其利也漢中郎將喻囂來歙𫝊為太中大夫建武三年歙始使隗囂五年奉璽書還復往説之遂遣子入質拜歙中郎將六年三月山東畧定帝欲西收囂兵俱伐蜀復使歙喻㫖王遵𫝊為太中大夫建武八年以書喻牛邯曰遵與隗王㰱血為漢冀聖漢復存當挈河隴歸本朝而王之將吏人人抵掌欲為不善之計今吴景驍將雲集四境而以奔離之卒拒要阸當軍衝其形埶何如哉智者覩危思變賢者泥而不滓故夷吾束縛而相齊黥布杖劒而歸漢漢伏波司馬告武陵蠻夷宋均𫝊為謁者㑹武陵蠻反圍武陵將軍劉尚建武二十四年使均乘𫝊發江夏奔命三千人救之㑹伏波將軍援至令均監軍矯制調司馬吕种守沅陵長命种奉詔書入虜營告以恩信因勒兵隨其後蠻夷震怖共斬其帥降漢戊己校尉耿恭移檄烏孫耿恭𫝊永平十七年冬十月置西域都䕶戊己校尉乃以恭為戊己校尉屯車師後王部金蒲城謁者闗寵為戊己校尉屯前王栁中城恭至部移檄烏孫示漢威徳大昆彌以下皆歡喜遣使獻名馬及奉宣帝時所賜公主博具願遣子入侍時南匈奴已附北單于遁走移袁宏漢紀曰永平十七年十月恭檄烏孫大昆彌漢中郎將阮种移度遼將軍檄梁慬𫝊永初三年冬南單于與烏桓大人俱反詔慬行度遼將軍事中郎將龐雄遼東太守耿䕫共撃匈奴奥鞬日逐王破之單于乃自將圍中郎將阮种於美稷連戰數月攻轉急种移檄求救明年正月慬將八千餘人馳往赴之漢司𨽻校尉冀并二州刺史檄安帝紀永初元年十一月戊子敕司𨽻校尉冀并二州刺史民訛言相驚弃捐舊居其各敕所部躬親曉諭若欲歸本郡在所為封長檄不欲勿强注長檄猶今長牒也欲歸者給以為驗漢尚書令告江東諸將校部曲檄尚書令彧漢益州刺史告三郡卭都夷𫝊元初五年卷夷大牛種封離等畔明年永昌益州及蜀郡夷應之衆十餘萬破二十餘縣詔刺史張喬討之喬遣從事楊竦將兵至楪榆先以詔書告示三郡宻求武士重其募賞乃進軍戰大破之斬三萬餘級漢遼東太守喻鮮卑曉慰北匈奴馮緄𫝊順帝時鮮卑冦邊以緄為遼東太守曉喻降集虜皆弭散陳禪傳永寧二年北匈奴入遼東拜禪遼東太守胡憚其威强退還數百里禪不加兵使吏卒往曉慰之漢使責南單于南匈奴傳永和元年夏南匈奴左部吾斯車紐等背畔率三千餘騎冦西河誘右賢王合七八千騎圍美稷度遼將軍馬續與中郎將梁並烏桓校尉王元發緣邊及烏桓鮮卑羌胡合二萬餘擊破之天子遣使責單于開以恩義令相招降單于詣並謝罪漢中郎將持節監闗西兵移營郡皇甫規𫝊延熹四年冬三公舉規為中郎將討零吾等破之先零諸種羌降者十餘萬明年東羌降凉州復通規上䟽曰四年之秋戎醜蠢戾爰自西州侵及涇陽幸䝉威靈羌戎諸種大小稽首輒移書營郡以訪誅納所省工費一億以上漢交趾刺史移交趾賈琮傳中平元年交趾屯兵反執刺史及合浦太守三府舉琮為刺史琮到部訊其狀咸言賦斂重民不聊生故聚為盗琮移書告使安業招撫荒散蠲復徭役誅渠帥為大害者選良吏試守諸縣百姓以安漢幽州牧告烏桓劉虞𫝊中平四年烏桓峭王等歩騎五萬入青冀二州攻破清河平原明年虞到薊罷省屯兵務廣恩信遣使告峭王等以朝恩寛𢎞開許善路漢荆州刺史傳檄八郡劉表傳初平元年為刺史時江南宗賊盛袁術阻兵屯魯陽蒯越曰威徳既行兵集衆附南據江陵北守襄陽荆州八郡可𫝊檄而定長沙零陵桂陽南陽江陵武陵南郡章陵乃使越遣人誘宗賊帥斬之襲取其衆江夏賊降江南悉平漢長沙太守討董卓通鑑初平元年三月長沙太守孫堅率豫州諸郡兵討董卓袁術表堅領豫州刺史漢兖州刺史移天下討董卓臧洪𫝊靈帝末通鑑初平元年正月廣陵太守張超與洪至陳留見兄邈計事大異之致之於劉兖州公山岱孔豫州公緒伷乃設壇場盟誓共升壇操槃㰱血而盟曰漢室不幸皇綱失統賊臣董卓乘釁縱害禍加至尊虐流百姓大懼淪䘮社稷翦覆四海兖州刺史岱豫州刺史伷陳留太守邈東郡太守瑁廣陵太守超等糾合義兵並赴國難凡我同盟齊心戮力以致臣節隕首䘮元必無二志有渝此盟俾墜其命無克遺育先是東郡太守橋瑁詐作三公移書州郡陳卓罪惡召兵赴難漢城門校尉河南尹移州郡討董卓檄朱儁𫝊卓入闗留儁守雒陽儁與山東諸將通謀為内應既而懼為卓所襲奔荆州復引兵還雒乃東屯中牟移書州郡請師討卓初平二年漢太僕移公孫瓚趙岐𫝊獻帝西都岐為太僕帝使太傅馬日磾撫慰天下以岐為副是時袁紹曹操與公孫瓚爭冀州紹操聞岐至皆自將兵數百里奉迎岐深陳天子恩徳宜罷兵安人之道又移書公孫瓚為言利害一本云初平四年天子使太傅馬日磾太僕趙岐和觧闗東岐詣河北住袁紹營移書告瓚漢侍中守司𨽻校尉持節督闗中諸軍移馬騰韓遂魏鍾繇傳闗中諸將馬騰韓遂各擁强兵相與爭繇至長安移書為陳禍福漢冀州牧檄州郡袁紹𫝊建安五年進軍攻許先宣檄曰云云漢北海相馳檄州郡孔融𫝊時黄巾冦數州北海最為賊衝董卓諷三府同舉融為北海相融到郡收合士民起兵講武馳檄飛翰引謀州郡漢丞相露布天下蜀志建興五年春丞相亮出屯漢中注三月詔曰漢祚中㣲網漏凶慝曹操竊執天衡子丕盗據神器欲奮劒長驅指討凶逆朱旗未舉而丕復殞䘮所謂不然我薪而自焚也諸葛丞相𢎞毅忠壯亡身憂國授以旄鉞綂歩騎二十萬衆董督元戎龔行天罰克復舊都在此行也弃邪從正者國有常典昔輔果絶親於知氏而䝉全宗之福㣲子去殷項伯歸漢皆受茅土之慶此前世明騐也若迷沉不反將助亂人不式王命罔有攸赦丞相其露布天下漢吕凱檄雍闓蜀志雍闓降吴永昌郡五官掾功曹吕凱與府丞王伉帥厲吏民閉境拒闓闓數移檄稱説凱荅檄曰雍侯造怨而封竇融歸志世祖皆流名後葉云云楚國不恭齊桓是責夫差僭號晉人不長况臣於非主誰肯歸之魏凉州刺史西鄉侯張既告諭諸羌檄張既𫝊黄初中西平麴光等殺其郡守諸將欲擊之既曰今先使羌胡鈔擊重其賞募所虜獲皆畀之外阻其埶内離其交必不戰而定乃檄告諸羌為光等所詿誤者原之能斬賊帥送首者當加封賞於是光部黨斬送光首餘安堵如故通鑑載於黄初二年魏太尉檄告公孫淵魏志景初二年正月太尉司馬懿伐遼東六月軍至遼東八月使其相王建桞輔請却兵懿命斬之檄告淵云魏帶方太守告喻倭王檄魏志正始六年詔賜倭難升米黄幢付郡假授八年太守王頎到官倭女王卑彌呼與狗奴國男王卑彌弓呼素不和遣倭載斯烏越等詣郡説相攻擊狀遣塞曹掾史張政等因齎詔書黄幢拜假難升米為檄告喻之卑彌呼死立宗女壹與政等以檄告喻壹與因詣臺獻白珠異文雜錦倭人在帶方東南大海中依山島為國邑漢時有朝見者景初二年朝獻魏鎮西將軍檄蜀魏志明帝太和二年正月丁未露布天下并班告益州曰亮自以為能行兵於井底游歩於牛蹄懷李熊愚勇之智不思荆邯度徳之戒元帝景元四年五月詔征西鄧艾鎮西鍾㑹伐蜀十一月蜀平鍾㑹傳景元三年冬以㑹為鎮西將軍假節都督闗中諸軍事四年秋詔鄧艾諸葛緒各綂諸軍㑹移檄蜀將吏士民曰其詳擇利害自求多福投迹㣲子之蹤措身陳平之軌各具宣布咸使聞知魏鎮西軍司宣告諸軍檄晉衛瓘傳蜀既平鍾㑹奏鄧艾專擅瓘夜至成都檄艾所統諸將稱詔收艾云云俄而㑹發兵反瓘作檄宣告諸軍攻㑹敗之咸熈二年晉雍州刺史劉沉馳檄七郡劉沉傳兼紀太安二年十一月張方逼京師王師屢敗河間王顒遣張方將兵七萬出函谷入洛陽詔沉發兵襲顒沉奉詔馳檄四境合七郡之衆及守防諸軍塢壁甲士萬餘人襲長安永興元年顒聞沉起兵召張方還晉都督􅀭州九郡諸軍事𫝊檄州郡通鑑太安二年十二月議郎周玘前南平内史王矩起兵江東以討石冰推前吴興太守顧祕都督􅀭州傳檄州郡殺冰所置將吏於是賀循華譚葛洪甘卓皆起兵應之石冰冦􅀭州諸郡盡沒逐㑹稽相張景晉鎮東大將軍移檄天下征鎮州郡縣國齊王景𫝊元康中趙玉倫宻與相結倫篡遂與豫州刺史何勉龍驤將軍董艾等起軍遣使告成都河間常山新野四王移檄天下􅀭州刺史郗隆承檄猶豫未决參軍王䆳斬之永寧元年三月晉左衛將軍馳檄四方傳成都王頴有無君之心永興初元年左衛將軍陳眕殿中中郎逯苞成輔及長沙故將上官巳等奉大駕討頴馳檄四方赴者雲集晉司空移檄天下晉鎮東大將軍檄四方討石勒晉丞相大都督中外諸軍事移檄晉王傳天下檄元帝紀懷帝䝉塵永嘉五年六月司空荀藩等移檄天下荀組為司𨽻校尉與藩移檄天下推帝為盟主愍帝即位進丞相大都督中外諸軍事建興四年十二月西都不守帝出師露次移檄四方召天下之兵尅日進討建武元年三月辛夘即晉王位改元六月己巳帝傳檄天下曰逆賊石勒肆虐河朔石虎敢帥犬羊渡河縱毒今遣車騎將軍琅邪王裒等九軍鋭卒三萬水陸四道徑造賊場受祖逖節度懷帝紀永嘉六年二月癸丑鎮東大將軍琅邪王睿上尚書檄四方討石勒虞潭𫝊領南康太守被元帝檄使討江州刺史華軼時荀藩移檄以琅邪王為盟主軼不從命故討之晉安豐太守檄周馥𫝊淮南太守裴碩為周馥所敗退保東城求救于元帝琅邪王帝遣􅀭威將軍甘卓建威將軍郭逸攻馥于壽春安豐太守孫惠帥衆應之使謝摛為檄永嘉五年永馥都督揚州嘉四年上書迎天子遷都壽春碩奉東海王越宻㫖圖馥遂襲之晉平北將軍移州郡檄通鑑永嘉六年七月劉琨移檄州郡期以十月㑹平陽擊漢晉征東大將軍都督青州諸軍事青州刺史檄六州茍睎𫝊移告諸州陳東海王越罪狀時懷帝惡越專權乃詔睎曰王彌石勒為社稷憂故復遣詔檄六州協同大舉翦除國難睎復檄諸征鎮州郡晉大將軍都督并州諸軍事移檄州郡通鑑建興二年二月石勒送質子劉琨請討王浚以自効琨大喜移檄州郡稱己與猗盧方議討勒勒走伏無地求拔幽都以贖罪今便當遣六修南襲平陽除僭偽之逆類降知死之逋羯考異琨集檄首云三月庚午朔五日甲戌晉鎮西將軍都督隴右諸軍事馳檄闗中張軌𫝊聞秦王愍帝入闗乃馳檄闗中遣歩騎翼衛乘輿晉都督并冀幽三州諸軍事檄告華夷通鑑建武元年三月劉琨段匹磾同盟期以翼戴晉室辛丑琨檄告華夷琨遣兼左長史右司馬温嶠匹磾遣左長史榮邵奉表及盟文詣建康勸進劉琨𫝊元帝稱制江左琨令長史温嶠勸進於是河朔征鎮夷夏一百八十人連名上表建武元年琨與匹磾期討石勒匹磾推琨為大都督㰱血載書檄諸方守俱集襄國琨匹磾進屯固安以俟衆軍温嶠𫝊琨遷司空以為右司馬元帝初鎮江左以為左長史檄告華夷奉表勸進晉湘州刺史馳檄逺近忠義𫝊易雄為舂陵令湘州刺史譙王承距王敦謀起兵以赴朝廷雄承符馳檄逺近列敦罪惡永昌元年正月承起兵長沙虞悝對承曰宜收衆固守𫝊檄四方其埶必分然後圖之事可捷也樂道融說梁州刺史甘卓襲武昌卓乃與巴東監軍栁純等露檄率所綂致討晉郗鑒檄青州藝文類聚庾闡為郗鑒檄青州文云云郗鑒為龍驤將軍兖州刺史鎮鄒山三年間衆至數萬加輔國將軍都督兖州諸軍事晉廣州刺史平越中郎將諭温邵陶侃𫝊杜𢎞據臨賀與温邵及劉沉俱謀反侃直至廣州擊𢎞破之執劉沉於小桂討王機斬之諸將請乗勝擊温邵侃曰吾威名已著一函紙自足耳於是下書諭之邵懼而走追獲於始興晉江州刺史持節都督平南將軍告四方征鎮檄温嶠𫝊咸和初鎮武昌未幾蘇峻反嶠屯尋陽遣督䕶王愆期西陽太守鄧嶽鄱陽内史紀瞻等率舟師赴難及京師傾覆嶠奉陶侃為盟主於是列上尚書陳峻罪狀有衆七千灑泣登舟移告四方征鎮曰咸和三年四月賊臣祖約蘇峻同惡相濟宜增軍討撲今躬率所綂為士卒先西陽太守鄧嶽尋陽太守褚誕等連旗相繼宣城内史桓彛屯濵江之要江夏相周撫軍已向路昔包胥重趼致誠藺相如案劍秦庭臧洪登壇㰱血况今居台鼎據方州者哉有能斬約峻者封五等侯賞布萬匹嶠與侃書曰近已移檄逺近言於盟府尅後月半大舉南康建萬安晉安三郡軍同赴此㑹侃嶠同赴京師戎卒六郗鑒傳領徐兖州刺史設壇場大誓三軍曰約峻不恭天命不畏王誅凶戾肆逆干國之紀侮弄神器拔本塞原昔戎狄泯周齊桓糾盟董卓陵漢羣后致討義存君親古今一也若二冦不梟義無偷安顧衆𫝊峻反潜圖義舉吴國内史蔡謨檄為本國督䕶賊率張健等據吴城㑹稽内史王舒吴興内史虞潭並檄衆為五郡大都䕶綂諸義軍晉撫軍將軍㑹稽内史假節都督行􅀭州刺史事移告屬郡王舒𫝊蘇峻作逆吴國内史庾氷棄郡奔舒舒移告屬郡以吴王師虞􅔎為軍司御史中丞謝藻行龍驤將軍監前鋒征討軍事率衆一萬與冰俱渡浙江前義興太守顧衆䕶軍參軍顧颺等皆起義軍應舒晉荆州刺史都亭侯庾翼檄石虎藝文類聚檄文曰石勒翦覆舊京窮凶極逆百姓受灰沒之酷王室有黍離之哀石虎負恃其衆陸梁河朔今遣使持節荆州刺史都亭侯翼髙旗連雲組練映日運孫吴之籌按尚父之畧莫不張膽咀鐵人思自伯以此衆戰猶烈火之燔秋蓬衝飇之掃落葉也晉彭城内史劉􅁉移檄都下南史元興三年二月己夘􅁉與何無忌等集義徒凡二十七人推􅁉為盟主軍次竹里移檄都下曰逆臣桓𤣥阻兵荆郢肆暴都邑雖夏后之離浞豷有漢之遭莽卓未足為喻云云􅁉等乗機奮發義不圖全輔國將軍劉毅廣武將軍何無忌鎮北主簿孟昶兖州主簿魏詠之寧逺將軍劉道規龍驤將軍劉藩振威將軍檀憑之等忠烈斷金精貫白日義衆既集文武爭先公侯諸君或世立忠貞或身荷爵寵顧瞻周道寧不弔乎上憑祖宗之靈下罄義夫之節翦馘逋逆蕩清京華益州刺史毛璩掃定荆楚江州刺史郭昶之奉迎主上宫於尋陽鎮北將軍王元徳等保據石頭􅀭武將軍諸葛長人已據厯陽征虜將軍庾賾之等結為内應同力協契所在蠭起即日斬徐州刺史脩青州刺史𢎞益州刺史毛璩執𤣥使不受其命傳檄逺近列𤣥罪狀宋太尉檄蜀宋袁豹𫝊袁豹為宋髙祖太尉長史髙祖遣益州刺史朱齡石伐蜀豹為檄文曰失仁與義難與求安憑阻負釁鮮克有成故成都不世祀華陽無興國蕞爾譙縱同惡相求反噬州相毒害民黎俾我西服隔閡皇澤今北狄露晞南冦埃掃朝風載韙庶績其凝清江原於濫觴澄氛祲於井絡誅叛柔逺今也其時組甲貝胄景煥波燭今三峽之隘在我境内非有岑彭荆門之險罙入其阻平衢四逹實無鄧艾綿竹之艱山川之形抑非曩日攻守難易居然百倍當全蜀之强士民之富子陽不能自安於庸僰劉禪不敢􅇡命於南中荆邯折謀伯約挫鋭故知成敗有數非可智延此皆益土前事當今元龜也盛如盧循强如容超凌威南海跨制北岱樓船萬艘掩江蓋汜鐵馬千羣充原塞隰然廣固之攻陸無完雉右里之戰水靡全舟或顯戮京畿或𫝊首萬里故知逆順有埶難以力抗斯又目前殷鑒深切著明者也豈不遡誠南凱延首東雲普天有來蘇之幸而一方懷後予之怨王者之師以仁為本捨逆取順爰自三驅齊斧所加縱身而已其有衿甲反接自投軍門者一無所問如其迷復姦邪守愚不改火燎孟諸芝艾同爛河決金隄淵丘同體雖欲悔之亦將何及紀在義熈八年十一月伐蜀九年七月平蜀宋後將軍長沙王告司兖二州宋書索虜𫝊元嘉七年三月詔曰河南湮沒可簡甲卒五萬給右將軍到彦之綂安北將軍王仲徳兖州刺史竺靈秀舟師入河驍騎將軍段宏精騎八千直指虎牢豫州刺史劉徳武勁勇一萬以相掎角後將軍長沙王義欣權假節率見力三萬監征討諸軍事先遣殿中將軍田竒告燾河南舊是宋土今當修復義欣出鎮彭城總統羣帥告司兖二州曰云云髙祖内夷篡逆外平冦亂響軼龍堆聲浮雲朔陵天振地拔山蕩海於是華域肅清流澤洋溢中葉委政冢宰强敵乗釁司兖良民重隔王化提吴楚之勁卒總八州之鋭士紅旗絳天素甲奪日虎歩中原龍超河渚夫順從貴速歸徳惡晚賞褒先附威加後服若能審决安危歸投軍門者當表言天臺隨才叙用如其迷心不悛竄首巢穴長圍既周臨衝四至雖欲壺漿厥篚其可得乎幸加三思詳擇利害梁移魏文北伐檄南史普通七年大舉北侵勅裴子野為移魏文又為書喻魏相元义類聚載喻虜檄曰昔由余入秦禮以卿佐日磾降漢華貂七葉周興嗣為北伐檄梁湘東王移檄逺近討侯景梁書太清四年四月丙午湘東王繹下令大舉討侯景移檄逺近魏侍中驃騎大將軍闗西行臺傳檄方鎮後周書時魏帝方圖髙歡泰傳檄方鎮曰詔書稱歡逆亂分命將帥襲其窟穴電繞蛇擊霧合星羅躬自東轅電赴伊洛轘裂賊臣以謝天下東魏西兖州刺史檄東方諸州北齊書武定五年正月辛亥侯景據河南叛歸于魏遣軍士二百人暮入西兖州欲襲取之刺史邢子才覺之掩捕盡獲之因散檄東方諸州各為之備東魏軍司杜弼檄梁梁書梁太清元年東魏武定五年十二月甲子朔東魏使杜弼作檄移梁朝曰吳侵齊境遂為句踐之師趙納韓地終有長平之役侯景周章向背夫豈徒然拒此則氣不足攻彼則勢有餘呼之則反速而釁小不召則叛遲而禍大㑹應遙望廷尉不肯為臣自據淮南亦欲稱帝但恐楚國亡猿禍延林木城門失火殃及池魚外傾中潰今實其時鷸蚌相持我乗其敝後周大司馬檄吐渾周書武成初吐谷渾侵凉州詔大司馬賀蘭祥與宇文貴討之祥遣其軍司檄吐渾曰云云隋大將軍府𫝊諸郡檄唐髙祖紀大業十三年即義寧元年六月己夘𫝊檄諸郡稱義兵開大將軍府癸巳張道源𫝊授大將軍府戸曹參軍京師平十二月癸未遣撫慰山東燕趙諭羅藝降武徳二年十月己亥藝以地歸通鑑元年魏徴𫝊自請安輯山東擢秘書丞馳馹至黎陽武徳元年十一月通鑑義寧元年六月己夘裴寂等請尊天子為太上皇立代王為帝以安隋室移檄郡縣七月癸丑帥甲士三萬發晉陽立軍門誓衆并移檄郡縣諭以尊立代王之意西突厥阿史那大奈帥衆以從八月癸巳至龍門薛大鼎請直濟河據永豐倉𫝊檄逺近闗中可坐取也武徳元年正月丁未朔唐王以書諭諸郡縣東自商洛南盡巴蜀郡縣長吏及盗賊渠帥氐羌酋長爭遣子弟入見請降玉海卷一百八十七
