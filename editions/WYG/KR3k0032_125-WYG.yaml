body:
  text: 玉海卷一百二十五宋王應麟撰官制古官名三皇二帝傳述其官書載唐虞之官夏殷無聞焉周官則備矣太昊九庖官崔寔政論太昊之世設九庖之官黄帝四監左右大監通典州牧黄帝立四監以治萬國宋百官志刺史黄帝四監唐虞十二牧是其職也周改曰伯史黄帝紀以師兵為營衛官名皆以雲命為雲師置左右大監監于萬國萬國和舉風后力牧常先大鴻以治民左右大監即後世二伯也正義若周召分陜月令季夏命四監大合百縣之秩芻以養犧牲季冬命四監收秩薪柴以共郊廟及百祀之薪燎注四監主山林川澤之官吕氏春秋注四監周制也魏文帝詔曰昔軒轅建四面之號黄帝李官見兵法黄帝四史左右史拾遺記黄帝置四史以主圗籍黄帝置四史官令沮誦蒼頡𨽻首孔甲居其職帝王世紀黄帝云云其史蒼頡取像鳥跡始作文字史官之作蓋自此始記其言行䇿而藏之名曰書契唐六典起居郎注宋衷世本云沮誦蒼頡為黄帝左右史一云黄帝之世始立史官至于夏商分置左右周書穆王時左史戎夫書前代存亡之誡諸侯之國亦立之夏終商摯周聃晉黍柱後漢竇章傳注老子為下史四方所記文書皆歸柱下相周有右史武見宋衷世本楚左史倚左史老鬻子注黄帝置史官世本容成造厯大撓作甲子宋衷注皆黄帝史官也荀子注倉頡黄帝史官周禮疏世本作云倉頡造文字頡黄帝之史則文字起於黄帝漢志孔甲盤盂二十六篇注黄帝之史黄帝太醫漢書司馬相如傳詔岐伯使尚方注張揖曰岐伯者黄帝太醫屬使主方藥也黄帝樂師文選張衡思𤣥賦注大容黄帝樂師堯田師農師稷官田正淮南子選注引文子同堯命舜為司徒契為司馬禹為司空稷為大田師奚仲為工選注引文子作工師史周紀棄游戲好種麻菽成人遂好耕農相地之宜宜榖者稼穡焉民皆法則之帝堯聞之舉棄為農師舜封於邰號曰后稷夏后氏政衰去稷不務不窋失其官公劉復修后稷之業務耕種行地宜詩閟宫是生后稷降之百福黍稷重穋稙穉菽麥奄有下國俾民稼穡箋后稷長大堯登用之使居稷官民賴其功後雖作司馬天下猶以后稷稱焉疏舜命羣官使禹宅百揆即天官也契為司徒即地官也商頌𤣥鳥箋契為堯司徒有功封商伯夷為秩宗即春官也咎繇為士即秋官也垂為共工即冬官也唯夏官不言命帝曰棄褒述其為稷之功不言命而為官明是稷作司馬為夏官也且尚書刑徳放云稷為司馬周語稷為天官稷周禮疏堯天官為禮大司徒疏堯時棄為稷官立稼穡之事死乃配稷而食名為田正左傳蔡墨曰稷田正也堯工師木工舜工師文子自然篇堯之治天下也后稷為田疇奚仲為工師文選注引之注造器物以備民用淮南子齊俗訓奚仲為工左傳及淮南修務訓云夏車正當攷說苑倕為工師史記堯紀共工堯試之工師舜紀垂主工師百工致功劉向列仙傳赤松子輿堯時為木工仇生赤湯時為木正堯謁者後漢官志注荀綽晉百官表注明帝詔曰謁者乃堯之尊官所以試舜賓于四門四門穆穆者晉志左執法東北一星曰謁者堯射官弓正月令正義羿為堯時射官說文曰羿帝嚳射官也賈逵云羿之先祖世為先王射官故帝賜羿弓矢使司射帝王世紀羿有窮氏帝嚳以上世掌射正嚳賜以彤弓素矢封之鉏為帝司射唐宰相世系表青陽氏第五子揮為弓正始制弓矢子孫姓張氏左傳閼伯為陶唐氏之火正鄭語黎為髙辛氏火正堯大理堯宗官說苑見樂正唐宗室表臯陶為堯大理管子臯陶為李生益益生恩成歴虞夏商世為大理以官命族為理氏北史序傳庭堅為堯大理史舜紀臯陶為大理平民各伏得其實月令注理治獄官也有虞氏曰士夏曰大理周曰大司冦宗伯注宗伯典禮之官書堯典曰帝曰咨四岳有能典朕三禮僉曰伯夷帝曰俞咨伯汝作秩宗宗官又主鬼神云云唐虞歴三代以宗官典國之禮與其祭祀漢之太常是也堯大農三代世表褚先生曰堯知稷賢才立以為大農姓之曰姬氏堯四伯詩崧髙維嶽注堯之時姜氏為四伯掌四嶽之祀述諸侯之職周有甫申齊許正義四伯既主四時又主方嶽因其時而主其方國語堯使禹治水四岳佐之云云此一王四伯韋昭注一王謂禹四伯謂四嶽也書注孔氏云四岳即義和四子堯共工明堂位垂之和鍾注垂堯之共工疏舜典垂作共工鄭不見古文故以為堯堯司馬見田師文子堯治天下舜為司徒契為司馬禹為司空后稷為田疇奚仲為工師堯司徒太尉封人六官見上魯語展禽曰契為司徒而民輯注為堯司徒能敬敷五教司馬相如傳注張揖曰禹為堯司空卨為堯司徒月令正義三王有司馬無太尉中􅀱握河紀云舜為太尉此堯時置之三王不置也漢表太尉秦官史記正義堯置羲和六官掌天地四方莊子堯出游華封人祝曰云云堯天官周禮疏堯初天官為稷至試舜天官之任謂之百揆舜命禹為之即天官也堯羲和官虞夏天官漢書陽朔二年春詔曰帝堯立羲和之官命以四時之事令不失其序故書云黎民於蕃時雍明以隂陽為本也注應邵曰堯典乃命羲和羲氏和氏世掌天地之官書正義曰書傳有羲伯和伯是仲叔子孫堯典正義少昊五鳩氏即周世之卿官别有鳳鳥氏班在五鳩上上世重厯數堯於卿官之外别命羲和掌天地尊於諸卿傳曰日官居卿以底日楚語堯育重黎之後使典天地以至於夏商史記自序余先周室之太史也自上世嘗顯功名於虞夏典天官事司馬氏世主天官周禮正義堯天官稷也地官司徒也堯掌庾氏族略庾氏堯時掌庾大夫以官命氏舜四方設官舜典帝釐下土方設居方作汩作九共九篇槀飫注言舜理四方諸侯各設其官居其方周禮正義四岳四時之官主四岳之事始義和之時主四岳者謂之四伯至其死分置八伯皆王官書傳云惟元祀巡狩四岳八伯九州而言八伯者據畿外八州也畿内不置伯以鄉遂之吏主之治四岳分掌四岳諸侯即羲和四子堯典咨四岳二水㢲位也舜典咨四岳二熈載典禮也舜樂正堯樂正孔叢子魯哀公問書稱䕫曰於予擊石拊石百獸率舞庶尹允諧何謂也子曰此言善政之化乎物也古之帝王功成作樂其政善者其樂和樂和則天地猶且應之況百獸乎夔為帝舜樂正實能以樂盡治理之情公曰然則政之大本莫尚夔乎子曰樂所以歌其成功非政本也衆官之長既咸熙熙然後樂乃和焉吾聞夔一足有異於人信乎子曰昔重黎舉夔而進又欲求人而佐焉舜曰夫樂天地之精也惟聖人惟能和六律均五聲和樂之本以通八風夔能若此一而足矣故曰一足非一足也公曰善呂氏春秋孔子曰舜欲以樂傳教於天下乃令重黎舉夔於草莽之中而進之舜以為樂正夔於是正六律和五聲以通八風而天下大服荀子成相篇禹勞心力堯有徳干戈不用三苖服舉舜甽畝任之天下身休息得后稷五榖殖夔為樂正鳥獸服契為司徒民知孝悌尊有徳禹有功抑下鴻辟除民害逐共工韓非子堯曰夔一而足矣使為樂正說苑君道篇周公對成王曰天子無戲言周公旦可謂善說矣當堯之時舜為司徒契為司馬禹為司空后稷為田疇夔為樂正倕為工師伯夷為秩宗臯陶為大理益掌敺禽獸左傳昭二十八年叔向母曰樂正后夔注舜典樂之君長舜典帝曰䕫命汝典樂教胄子直而温寛而栗剛而無虐簡而無傲聲依永律和聲八音克諧無相奪倫神人以和䕫曰於予擊石拊石百獸率舞益稷帝曰予欲聞六律五聲八音在治忽工以納言時而颺之注工樂官掌誦詩以納諫夔曰戛擊鳴球摶拊琴瑟以詠祖考來格虞賓在位羣后徳讓下管鼗鼓合止柷敔笙鏞以間鳥獸蹌蹌蕭韶九成鳳皇來儀王制樂正崇四術注樂官之長掌國子之教虞書曰夔典樂教胄子尚書大傳惟十有五祀舜為賓客禹為主人樂正進贊曰尚考太室之義唐為虞賓文選注晉語趙宣子召軍吏戒樂正舜虞官詩正義詩譜堯時有伯翳者實臯陶之子佐禹治水水土既平舜命作虞官掌上下草木鳥獸賜姓曰嬴虞史五帝史官大戴記誥志第七十一公曰何以事神子曰丘聞周太史曰政不率天下不由人則事難成虞史伯夷曰明孟也幽幼也明幽雌雄也雌雄迭興而順至正之統也日歸于西起明于東月歸于東起明于西又見史記厯書虞夏之厯正建於孟春於時冰泮發蟄百草權輿瑞雉無釋物乃嵗俱生于東以順四時卒于冬萬於時雞三號卒明載于青色撫十二月節卒于丑日月成嵗歴再閏以順天道此謂嵗虞汁月天曰作明曰與維天是戴地曰作昌曰與維地是事人曰作樂曰與惟民是嬉四代篇曰夏商之未興也伯夷謂此三帝之眇禮典同注書協時月正日疏舜之巡狩於方岳之下命史官協時月協合也合四時節氣之早晚及月之大小定分正日正定日之甲乙書正義堯典雖唐事本虞史所録後漢班彪傳唐虞三代詩書所及世有史官以司典籍注見於史籍者夏大史終古殷大史向摯周大史儋見吕氏春秋春秋正義禮記内則稱五帝有史官吳華覈曰五帝三王皆立史官爾雅九河大史釋文或曰史官記事之處虞八伯曲禮五官之長曰伯疏堯時為四伯至堯之末分置八伯故虞書傳云元祀巡狩四岳八伯明堯末置之夏則無文殷改置二伯與周同王制州有伯注殷之州長曰伯虞夏及周皆曰牧正義鄭答張逸云幾内之州不置伯有鄉遂之吏主之云云周禮太宰云施典于邦國建其牧立其監是畿外邦國有牧畿内不置故有八伯也周禮疏見上詩崧髙注堯之時姜氏為四伯正義堯典注云堯末年分四嶽置八伯周語謂伯夷為四岳尚書大傳自羲和後分置八伯舜既即位元祀巡狩每至其方各貢兩伯之樂伯夷為陽伯樂舞侏離歌曰析陽詩正義虞傳云東岳陽伯之樂舞侏離注云舞曲名羲仲之後為羲伯樂舞鼚哉歌曰南陽棄為夏伯樂舞謾彧歌曰初慮羲叔之後為羲伯樂舞將陽歌曰朱于咎繇為秋伯樂舞蔡俶歌曰零落和仲之後為和伯樂舞元鶴歌曰歸來垂為冬伯樂舞丹鳳歌曰齊落一曰縵縵後闕一人鄭𤣥注曰有脫辭十有五祀後又有百工相和慶雲八伯稽首而進見陶潜羣輔録國語昆吾為夏伯大彭豕韋為商伯堯時四岳内典王朝之職如周六卿外掌諸侯之事如周牧伯或曰堯時羲和掌天地之官三公為之實為二伯羲伯司東凡南方事皆統之和伯司西凡北方事皆統之殷制大而二伯小而八伯繩牽絲聯相維而不亂周之盛時周召為東西伯分陜而主之伯夷居第一為陽伯及命官之際四岳舉以典禮而帝舜為之不名獨曰咨伯汝作秩宗史述其辭避亦曰伯拜稽首遜于夔龍與衆臣異周有九伯則畿内蓋亦設牧王畿居中八州居外各設一方伯焉黄帝置左右監堯四宅舜始置十二州州置牧周禮疏案尚書傳云惟元祀巡狩四岳八伯注云堯始以羲和為六卿主春夏秋冬并掌方岳之事是為四岳出則為伯其後方置八伯畿外八州畿内不置伯鄉遂之吏主之二十官吕氏春秋大撓作甲子黔如作虜首一作慮首容成作厯羲和作占日尚儀作占月后益作占嵗胡曹作衣夷羿作弓祝融作市狄儀作酒髙元作室虞姁作舟伯益作井赤冀作臼乘雅作駕寒哀作御王冰作服牛史皇作圖巫彭作醫巫咸作筮此二十官者聖王所以治天下也聖王不能二十官之事然而使二十官盡其巧畢其能聖王在上故也聖王之所不能也所以能之也其不知也所以知之也養其神修其徳而化矣奚仲作車倉頡作書后稷作稼臯陶作刑昆吾作陶夏鮌作城此六人者所作當矣易緯通卦驗曰天皇之先與乾曜合元天地成位君臣道生君有五期五行輔有三名公卿大夫也夏車正左傳定元年薛宰曰薛之皇祖奚仲居薛為夏車正注奚仲為夏禹掌車服大夫荀子奚仲作車乘注夏禹時車正漢地理志魯國薛縣注夏車正奚仲所國後遷于邳後輿服志上古聖人見轉蓬始知為輪輪行可載因物知生復為之輿輿輪相乘流運罔極任重致逺天下獲其利後世聖人視斗周旋魁方杓曲以攜龍角為帝車於是迺曲其輈自是以來世加其飾至奚仲為夏車正周敬王十一年薛宰有言事始經見建其斿旐尊卑上下各有等級又通典淮南子堯治天下也舜為司徒奚仲為工夏書𦙍征工執藝事以諫考工記夏后氏上匠注禹治洪水民降丘宅土卑宫室盡力溝洫而尊匠夏遒人虞人書𦙍征每嵗孟春遒人以木鐸徇于路官師相規工執藝事以諫注遒人宣令之官左傳注行人之官疏周禮無此官惟小宰徇以木鐸名曰遒人訓遒為聚聚人而令之故以為名嗇夫馳注主幣之官大戴禮夏小正十有二月虞人入梁注虞人官也梁者主設罔罟者也夏司馬商頌疏王肅云相土在夏為司馬之職掌征伐魯頌疏尚書刑徳放云稷為司馬契為司徒夏大史令吕氏春秋夏大史令終古出其圗法如商淮南子汜論訓夏太史令終古先奔商殷太史令向藝先歸文王漢古今人表中上等終古夏大史公一本作大史令上下智人向摯殷太史史通引吕氏春秋夏太史終古載其圗法奔商商太史髙勢載其圗法奔周通典史官肇自黄帝有之自後顯著夏太史終古商太史髙勢六韜禹有史疇湯時大旱七年殷史卜曰當以人禱夏左史隋經籍志夏殷已上左史記言右史記事六典宋衷世本黄帝沮誦蒼頡為左右史周書周穆王有左史戎夫書前代存亡之數夏日官周日官晉律厯志傳曰火出於夏為三月商為四月周為五月是故天子置日官諸侯有日御以和萬國以協三辰春官注太史日官也春秋傳曰天子有日官諸侯有日御日官居卿以厎日禮也日御不失日以授百官于朝居猶處也言建六典以處六卿之職夏水官國語㝠勤其官而水死注㝠契後六世孫根圉之子為夏水官勤於其職夏大理月令孟秋命理瞻傷察創視折注理治獄官也有虞氏曰士夏曰大理周曰大司冦又司冦疏夏農率月令孟春王命布農事命田舍東郊皆修封疆審端徑術田事既飭先定準直農乃不惑注田謂田畯主農之官也準直謂封疆徑遂也夏小正曰農率均田疏夏小正大戴禮篇也農率則田畯也均田則審端徑遂也湯司直臣淮南子主術訓成湯有司直之臣武王有戒謹之鞀許謹云司直官名不曲也鄧子湯有司直之臣湯司空書序咎單作明居疏馬融云咎單為湯司空傳言主土地之官湯司御門尹莊子則陽篇湯得其司御門尹登恒為之傅之從師而不囿得其隨成為之司其名商守藏史莊子釋文彭祖世本云姓籛名鏗在商為守藏史在周為柱下史史記老子傳周守藏室之史也索隠周藏書室之史殷太史又見上曲禮注太史殷時制也吕氏春秋殷内史向摯載其圗法出之周殷牧師後漢書西羌傳序季歴克余無之戎太丁命為牧師注竹書紀年曰王季為殷牧師詩出車于彼牧矣注出車就馬於牧地周禮夏官牧師下士四人掌牧地皆有厲禁孟春焚牧田事贊焚萊文王七屬大戴禮文王官人第七十二王曰太師倫有七屬屬有九用用有六徵一曰觀誠二曰考志三曰視中四曰觀色五曰觀隠六曰揆徳九用曰有慮曰慈惠曰忠正曰順直曰絜正曰慎廉曰好謀曰接給曰猛毅九用有徵乃任七屬一曰國則任貴二曰鄉則任貞三曰官則任長四曰學則任師五曰族則任宗六曰家則任主七曰先則任賢正月王親命七屬之人三戒然後及論王親受而考之然後論成周虞官晉語文王詢于八虞注周八士皆在虞官伯達伯适仲突仲忽叔夜叔夏季隨季騧周陶正黄帝陶正左傳襄二十五年子産曰虞閼父為周陶正先王賴其利器用也與其神明之後封胡公滿以備三恪注為武王陶正考工記陶人為甗盆甑鬲庾瓬人為簋豆鬴搏埴之工凡陶瓬之事髺墾薜暴不入市器中膊豆中繩拊泥均垂繩正凝土為器聖人所作有虞氏上陶注舜至質貴陶器甒大是也曲禮六工曰土工注殷制陶瓬也於周屬司空列仙傳甯封子為黄帝陶正虞氏泰尊牲舜陶于河濱郊特器用陶匏土簋土鉶瓦古公陶復陶穴見尸子夏昆吾作陶山周書神農作器陶復陶穴於興王之初泰尊罍不忘反始之意之漢有甄官者上之化下下之從上猶泥在鈞唯甄之所為周盟府左傳僖五年宫之竒曰虢仲虢叔王季之穆也為文王卿士勳在王室藏於盟府注司盟之官正義咒諸侯初受封爵必有盟誓之言漢封爵之誓即盟之類二十六年展喜對齊侯曰周公太公股肱周室夾輔成王成王勞之而賜之盟曰世世子孫無相害也載在盟府載載書也太師職之太公為太師兼主司盟之官襄十年伯輿大夫瑕禽曰平王賜之騂旄之盟十一年晉侯以樂賜魏絳曰賞國之典也藏在盟府注司盟之府有賞功之制正義掌藏功勳典䇿故有賞功之制定四年祝佗曰踐土之盟其載書云藏在周府可覆視也周書嘗麥篇大史乃藏之于盟府以為嵗典禮秋官司冦凡大盟約涖其盟書登于天府司盟下士二人掌盟載之法荀子春秋善胥命詩非屢盟外鄭董隧之盟大史書名魯召史盟臧紇隋志王者誅賞具録其事百官史臣皆藏其書周日正子華子召子元而訓之曰昔吾之宗君為周日正周公作成周定鼎於郟鄏修和周郊於是吾之宗君薦其所以為祥者其族有三曰井里之璞大山之器車唐叔異畝之禾是以吾之宗君始有蒲璧以朝作程典令其顯庸書在故府子華子程氏名本左傳桓十七年天子有日官諸侯有日御典厯數者日官居卿以厎日注日官天子掌厯者不在六卿之數而位從卿日御不失日以授百官于朝疏大史下大夫非卿尊之若卿史厯書周室微疇人子弟分散注如淳曰家業世世相傳為疇孟康曰同類之人明厯者少皥厯正史李華云天子日官則佚史扁是也諸侯日御則神竈子韋是也周卜正卜官左傳隠十一年威王八年春滕侯曰我周之卜正也注卜官之長疏按周禮大卜之事薛庶姓也我不可以後之公使羽父請曰周之宗盟異姓為後禮龜人注世本巫咸作筮卜未聞其人也書舜官占先蔽志詢謀僉同龜筮協從卜不習吉殷六大曰大卜史龜䇿傳塗山之兆從而夏啟世飛燕之卜順故殷興百穀之筮吉故周王周室之卜官常寳藏蓍龜書建稽疑五謀而卜筮居其二五占從其多傳曰聖人不煩卜筮記曰卜筮使民信時日敬􅀑神畏法令決嫌疑定猶豫聖人建隂陽天地之情立以為易易抱龜南面易官名春官太卜見上魯卜士齮楚丘晉卜人筮史偃楚開卜大大卜尹秦徒父梁招父鄭詹尹筮瀆不告易以為忌龜厭不告詩以為刺詹尹釋䇿有問焉知鬬㢘立言不疑何卜周官自卜師至于眡祲凡八官大卜以下大夫二人為之長唐太卜令卜正博士各二人掌卜筮之法曰龜曰五兆曰易曰式隋置大卜十人卜正二十人唐減周百官府禮太宰掌建邦之六典一曰治典以治官府二曰教典以教官府三曰禮典以統百官四曰政典以正百官五曰刑典以刑百官六曰事典以任百官以八法治官府一曰官屬以舉邦治二曰官職以辨邦治三曰官聨以㑹官治四曰官常以聽官治五曰官成以經邦治六曰官法以正邦治七曰官刑以糾邦治八曰官計以弊邦治注百官所居曰府疏府百官所居處是府聚之義乃施法于官府而建其正立其貳設其考陳其殷置其輔正謂冡宰至司空貳謂小宰至小司空考佐成事者以法待官府之治嵗終令百官府各正其治受其㑹小宰以官府之六叙正羣吏以官府六屬舉邦治以官府六職辨邦治以官府六聨合邦治以官府八成經邦治以聽官府之六計弊羣吏之治以法掌祭祀朝覲㑹同賓客之戒具軍旅田役䘮荒亦如之七事者令百官府共其財用治其施舍聽其治訟月終則以官府之叙受羣吏之要正嵗率治官之屬而觀治象之法令于百官府曰各修乃職考乃法待乃事以聽王命其有不共則國有大刑宰夫掌百官府之徵令辨其八職曰正師司旅府史胥徒掌治法以考百官府羣都縣鄙之治乘其財用之出入宫正掌王宫之戒令糾禁以時比宫中之官府次舍之衆寡注官府在宫中者若膳夫玉府内宰内史之屬大史掌法以逆官府之治正嵗年以序事頒之于官府及都鄙大府凡官府都鄙之吏及執事者受財用焉司㑹掌六典八法八則之貳以逆官府之治掌國之官府之百物財用職内貳官府之財入之數職嵗貳官府之財出賜之數天府凡官府之治中受而藏之書正義詩赫赫師尹謂三公之官洪範師尹為正官之吏謂大夫衆正官之吏與同類之官為長周禮大司樂為樂官之長大卜為卜官之長此類也周宗正宋百官志春秋傳云周受命封建宗盟封兄弟之國十有五同姓之國三十有五始選其宗正之長而董正之謂之宗正周書嘗麥篇太祝以王命作筴筴告宗正周禮春官小宗伯掌三族之别以辨親疎其正室皆謂之門子注正室適子也將代父當門者也漢百官表宗正注應劭曰周成王時彤伯入為宗正師古曰彤伯為宗伯不謂之宗正古今人表師伯注師古曰周宗伯也尚書作彤伯周司商司載周語仲山甫曰古者司民協孤終司商協名姓注司商掌賜族受姓之官商金聲清謂人始生吹律合之定其姓名司徒協旅司冦協姦牧協職工協革場協入廩協出是則少多死生出入往來皆可知也魯語天子大采朝日與三公九卿祖識地徳日中考政與百官之政事師尹惟旅牧相宣序民事少采夕月與太史司載糾䖍天刑注載天文也司天文謂馮相保章氏周常伯常任凖人立政周公曰王左右常伯注謂三公常任疏六卿也準人注平法之人疏謂士官當謂士師也綴衣注掌衣服疏大僕虎賁武力事王知恤鮮哉立民長伯立政任人準夫牧作三事虎賁綴衣趣馬小尹左右攜僕百司庶府藝人表臣百司大史尹伯庶常吉士文選注環濟要略曰侍中古官或曰風后為黄帝侍中周時號常伯應邵漢官儀侍中周官號曰常伯選於諸伯言其道徳可常尊周司嗇甫田詩田畯至喜箋田畯司嗇今之嗇夫也成王出觀農事親與后世子行疏在田司主稼穡謂之司嗇漢世亦有此官郊特牲曰蜡祭司嗇注云若后稷大田箋同周司過史大戴禮保傅篇此殷周之所以長有道也及太子既冠成人免於保傅之嚴則有司過之史有虧膳之宰太子有過史必書之過書而宰徹去膳習與智長化與心成云云官箴王闕為楚椒舉侍後以規過隨周舍對趙簡子曰願諤諤之臣墨筆操牘君之後司君之過而書之日有記月有效嵗有得也周五史隋志周太史下大夫建典法則小史中士掌邦國志内史中大夫掌䇿命外史上士掌四方志三皇五帝書御史中士掌萬民之治天子之史凡有五天官女史八人書内令小内史尊於大史外史尊於史御史飛春官大史注春秋傳曰楚有雲夾日以楚子使問諸周大史大史主天道周大史有佚辛甲漢志墨家尹佚二篇道家辛甲二十九篇周上黨長子縣周史辛甲所封周語注史佚武王時大史名佚十服䖍注文十五年傳云史佚周成王大史杜預注僖五年傳云周武王時大史名佚襄四年周辛甲為大史注周武王大史籕伯陽叔服伯儋左史戎夫老周任古良史子為守藏室史柱下史馬六韜史編古今人表史扁易郊祀志周室萇𢎞司氏世典周史周史以周見陳侯雍史魯大史氏克里革以死奮筆左丘明急就篇注左丘明本魯之左丘繼守其職遂為姓外史襄二年三年齊大史南史子餘哀十四年傳家語晉董史狐書法不隠史蘇墨趙龜太史屠餘左史楚左史倚相左史老衛大史栁莊華龍滑武公有瞽史之道史不失書鄭大史命伯石為卿董隧盟書名秦内史廖虢史嚚春秋正義所記春秋天子則内史主之外史佐之春秋之時諸侯史官多闕䇿命之事多是太史則太史主之小史佐之諸侯無内史大齊南史是佐史者當是小史也吕氏春秋夏太史令終古殷内史向摯晉太史屠黍洛誥作冊逸誥注王為冊書使史逸誥伯禽封命之書左傳桓二年周内史聞之曰臧孫達其有後於魯乎僖十一年襄王使内史過賜晉侯命十六年周内史叔興聘于宋二十八年王使内史叔興父䇿命晉侯為侯伯襄十年晉使周内史選偪陽族嗣周語虢文公曰大史順時覛土召公曰史獻書注史外史也掌三皇五帝之書襄王使大宰文公及内史興賜晉文公命大宰以王命命冕服内史贊之周左史右史柱下史又見漢柱下令晉職官志著作郎周左史之任也玉藻動則左史書之言則右史書之注其書春秋尚書其存者正義左陽陽主動故記動右隂隂主静周禮有五史無左右之名熊氏云周禮大史抱天時與大師同車襄二十五年太史書崔杼是大史記動為左史也周禮内史掌䇿命僖二十八年王命内史叔興父䇿命晉侯是内史為右史酒誥太史友内史友鄭注太史内史掌記言記行是内史記言大史記行也若有闕則交相攝代洛誥史逸命周公伯禽史佚成王大史襄三十年鄭使太史命伯石為卿皆太史主爵命以内史闕故也若太史闕則内史亦攝之覲禮賜諸公奉篋服太史是右者彼亦宣行王命故居右春秋時特置左右史官故襄十四年左史謂魏莊子昭十二年楚左史倚相藝文志六藝論云右史記事左史記言與此不合周書史記解第六十一維正月王在成周昧爽召三公左史戎夫注穆王也戎夫左史名漢古今人表右史戎夫與祝雍同在成王時倚唐六典注周穆王時有左史戎夫楚有左史相左史老晉左史史周紀伯陽甫注唐固曰周柱下史老子也老子當孔子時唐固說非也平唐宗室表云周王時為太史後漢紀注十三州志曰侍御史周官即柱下史掌記注言行宋志侍御史於周為柱下史周官有御史掌治令亦其任也張蒼秦時為柱下御史世本籛鏗在商為守藏史在周時為柱下史一云即老子也東方朔傳柱下為工注應邵曰老子為周柱下史文選注列仙傳李耳為周柱下史轉為守藏史列仙傳李耳為周守藏史莊子周之藏史有老聃者選思𤣥賦注古文周書曰周穆王問左史氏史豹史良曰云云晉天文志北極東一星曰柱下史梁王僧孺云備聃佚之柱下孔叢子古者人君外朝有國史内朝有女史舉則左史書之言則右史書之史佚曰天子無戲言言則史書之魯曹劌曰君舉必書漢藝文志王者世有史官君舉必書所以謹言行昭法式也左史記言右史記事事為春秋言為尚書荀恱傳古者朝有二史左史記言右史書事事為春秩言為尚書得失一朝而榮辱千載書笏珥彤詩大序國史明得失之迹行葦箋緝御相續代而侍者謂信史也周史官禮春官大史下大夫二人注大史史官之長左傳序周禮有史官掌邦國四方之事達四方之志諸侯亦各有國史大事書之於䇿小事簡牘而已史記老子周守藏室之史也索隠曰藏書室之史老子為柱下史即藏室之柱下因以為官名宋志周世左史記事右史記言周國史詩疏國史者周官大史小史外史御史之等皆是也鄭荅張逸云國史采衆詩時明其好惡令瞽矇歌之周食官禮天官膳夫上士二人注膳夫食官之長也周宫中官禮天官宮正上士二人以時比宫中之官府注正長也宫正主宫中官之長官府之在宫中者若膳夫玉府内宰内史之屬宫伯中士二人注伯長也内宰下大夫二人注内宰宫中官之長寺人王之正内五人注正内路寢周計官天官司㑹上大夫二人注㑹大計也司㑹主天下之大計計官之長若今尚書周市官地官司市下大夫二人注市官之長周關尹司關凡四方之賓客敂關則為之告注鄭司農說以國語曰周之秩官有之曰敵國賓至關尹以告行理以節逆之鄭𤣥謂朝聘者疏國語關尹此經司關一也小行人云凡詩侯入王則逆勞于畿漢藝文志關尹子九篇注名喜為關吏老子過關喜去吏而從之周陽官司事農大夫農正農師音官犧人周語虢文公曰稷以告王曰史帥陽官春官以命我司事主農事者司空除壇于藉命農大夫田畯也咸戒農用及藉后稷監之膳夫農正陳藉禮鬱人薦鬯犧人薦醴司尊也瞽帥音官以省風土樂官也命其旅曰狥農師一之上士農正再之后稷之佐田畯也后稷三之春秋正義百榖稷為其長遂以稷名為農官之長稷五星在七星南農正也工少臯􅨊鳩氏司事春九扈農正堯農師周頌臣嗟嗟保介維莫之如何新畬於皇來牟将受厥明箋保介車右嘻月令參保介之御間葢農官之副也臣工噫戒農官之詩周牧正列子黄帝篇周宣王之牧正有役人梁鴦者能飬野禽獸詩無羊宣王考牧也注宣王復古之牧法牧人職廢宣王始興而復之夏少康為仍牧正周宰旅又見漢宰士左傳襄二十六年晉韓起聘于周曰將歸時事於宰旅注宰旅冡宰之下士禮上士八中士十六旅下士三十二人疏下士稱旅以其理衆事故特言旅公羊傳隠元年七月宰咺曷為以官氏宰士也注天子上士以名氏通周連率詩旄丘正義王制雖殷法周諸侯之數與殷同明亦十國為連此詩周事有連率之文左傳曰公請屬鄫是周亦有連屬周大胥張衡西京賦廣開九市通闤帶闠旗亭五重俯察百隧周制大胥今也唯尉注善曰周禮司市胥師二十人然尊其職故曰大漢市有長丞而無尉葢通呼長丞為尉耳周司工氏族畧司工氏周宣王時司工錡因官氏焉錢氏顓帝曾孫陸終生彭祖裔孫孚周錢府上士因官命氏周軍尉唐文粹歐陽詹韓城縣西尉㕔壁記陶唐有大尉周有軍尉秦亦有太尉東南尉漢復命縣掾曰尉左襄二十一年傳尉氏注討姦之官周舌人見朝貢類周均工唐李綱傳周家均工樂胥不得預士伍雖復妙如師襄才如子野皆繼世不易業玉海卷一百二十五
