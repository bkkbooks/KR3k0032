body:
  text: 玉海卷四十二宋王應麟撰蓺文經解總六經記之經解指詩書禮樂易春秋之教未始正六經之名莊子天運篇始述老子之言曰六經先王之陳迹實昉乎此太史公滑稽傳以禮樂詩書易春秋為六蓺而班史因之又以五學配五常而論語孝經並記於六蓺畧中自時厥後或曰五經或曰六經或曰七經至唐貞觀中谷那律淹貫羣書褚遂良稱為九經庫九經之名又昉乎此其後明經取士以禮記春秋左傳為大經詩周禮儀禮為中經易尚書春秋公榖為小經所謂九經也國朝方以三傳合為一又舍儀禮而以易詩書周禮禮記春秋為六經又以孟子升經論語孝經為三小經今所謂九經也孔子經解記經解第二十六孔子曰入其國其教可知也其為人也温柔敦厚詩教也疏通知逺書教也廣博易良樂教也潔靜精微易教也恭儉莊敬禮教也屬辭比事春秋教也正義按鄭目録云記六藝政教之得失於别録屬通論經解一篇總是孔子之言記者録之皇氏曰解者分析之名此篇分析六經體教不同故名經解六經其教雖異總以禮為本故記者録入於禮荀子善為詩者不説善為易者不占善為禮者不相文中子門人有問姚義孔庭之法曰詩曰禮不及四經何也曰四者非具體不能及故聖人後之經典序録經解以詩為首七畧藝文志用易居前阮孝緒七録亦同此次王儉七志孝經為初孔子十二經莊子天道篇孔子西藏書於周室繙十二經以説老聃釋文六經六緯一説云易上下經并十翼一云春秋十二公經也南史周續之受業范甯通五經五緯號曰十經蜀志秦宓曰文翁遣相如東受七經還教吏民隋志樊文深七經義綱二十九卷七經論三卷宋官志國子助教十人周易尚書毛詩禮記周官儀禮春秋左氏公羊穀梁各為一經論語孝經為一經合十經助教分掌孔子二經二學中庸注孔子曰吾志在春秋行在孝經二經固足以明之孔子祖述堯舜之道而制春秋斷以文王武王之法度公羊何休序孔子有云吾志在春秋行在孝經此二學者聖人之極致治世之要務也疏案孝經鉤命决云孔子在庶徳無所施功無所就志在春秋行在孝經是也二學者春秋孝經也漢古文舊書古今學列傳河間獻王徳景二年立修學好古從民得善書必為好寫與之留其真所得書皆古文先秦舊書周官尚書禮禮記孟子老子之屬其學舉六藝立毛氏詩左氏春秋博士司馬遷十嵗誦古文劉向上方精於詩書觀古文詔向領校中五經袐書劉歆欲建立左氏毛詩逸禮古文尚書列學官移書曰魯恭王得古文於壊壁之中逸禮有三十九書十六篇天漢之後孔安國獻之及春秋左氏丘明所修皆古文舊書多者二十餘通臧於祕府伏而未發孝成閔學殘文缺乃陳發袐臧校理舊文得此三事考學官所傳經或脱簡傳或間編抑此三學以尚書為備謂左氏不傳春秋古文舊書皆有證驗外内相應禮失求之於野古文不猶愈於野乎蓺文志易劉向以中古文易經校唯費氏經與古文同書古文經四十六卷為五十七篇劉向以中古文校三家經文詩毛公自謂子夏所傳禮古經五十六巻出於魯淹中周官經六篇亡冬官以考工記充之春秋古經十二篇論語古二十一篇出孔壁兩子張孝經古孔氏一篇二十二章孔壁古文志又云史籀篇與孔子壁中古文異體史記太史公曰秦撥去古文始皇二十四年始下焚書之令距漢興纔七年耳書序孔子舊宅壁中得先人所藏古文虞夏商周之書及傳論語孝經皆科斗文字以所聞伏生之書考論文義定其可知者為𨽻古定更以竹簡寫之用𨽻書寫古文桓譚新論易連山八萬言歸藏四千三百言古文尚書舊有四十五巻為十八篇古秩禮記有五十六卷古論語二十一卷古孝經一卷二十章千八百七十二字今異者四百餘字葢嘉論之林藪文義之淵海也後傳桓譚好古學數從劉歆揚雄辨析疑異杜林得漆書古文尚書一巻鄭𤣥初中興之後范升陳元李育賈逵之徒爭論古今學後馬融答北地太守劉瓌及𤣥答何休義據通深古學遂明鄭興好古學尤明左氏周官自杜林桓譚衛宏之屬莫不斟酌宏好古學賈逵雖為古學兼通五家榖梁之説崔駰通古今訓詁劉陶推三家及古文是正名中文尚書盧植與鄭𤣥俱事馬融能通古今學好研精而不守章句上書曰臣從通儒馬融受古學古文科斗近於為實而厭抑流俗降在小學衛宏好古學隋志議郎衛敬仲古文官書一巻孔叢子孔臧曰侍中安國受詔綴集古義乞為太常典臣家業紀綱古訓孔大夫謂季彥曰今海内皆為章句内學君獨治古義治古義則非内學非之則危身之道先聖古文臨淮傳義安國不在科策之例世人固莫識也長彥隨時為今學説文序孔子書六經左丘明述春秋傳皆以古文許慎子冲曰臣父從賈逵受古學家語後序孔安國考論古今文字撰衆師之義為古文論語訓十一篇孝經傳二篇尚書傳五十八篇皆所得壁中科斗本也又集録孔子家語為四十四篇公羊序治古學貴文章者謂之俗儒疏左氏先著竹帛故漢時謂之古學公羊漢世乃興故謂之今學治古學者即鄭衆賈逵之徒蜀志尹黙從司馬徳操宋仲子等受古學隋志光武以圖䜟興俗儒趨時益為其學言五經者皆憑䜟為説唯孔安國毛公王璜賈逵之徒獨非之故因漢魯恭王河間獻王所得古文參而考之以成其義謂之古學世儒非毁竟不得行魏代王肅推引古學以難其義王弼杜預從而明之自是古學稍立漢世經先出者不如後出盛傳於後世費氏易古文尚書毛詩小戴禮左氏春秋漢石渠議奏宣紀甘露三年三月詔諸儒講論五經同異易則施讎梁丘臨書則周堪張山拊林尊歐陽地餘假倉詩則韋𤣥成張生薛廣徳禮則戴聖韋𤣥成聞人通漢榖梁則蕭望之劉向尹更始太子太傅蕭望之等平奏其議上親稱制臨决焉迺立梁丘易大小夏侯尚書榖梁春秋博士列傳又儒林傳劉向本名更生初立榖梁春秋召更生受榖梁講論五經於石渠薛廣徳以魯詩為博士論石渠遷諫大夫韋𤣥成受詔與太子太傅蕭望之及五經諸儒雜論同異於石渠閣條奏其對施讎詔拜為博士甘露中與五經諸儒雜論異同於石渠注師古曰三輔故事云石渠閣在未央殿北以藏祕書也梁丘賀子臨為黄門郎甘露中奉使問諸儒於石渠臨學精熟專行京房法歐陽地餘為博士論石渠林尊為博士論石渠周堪為譯官令論石渠經為最髙張山拊為博士論石渠假倉以謁者論石渠戴聖以博士論石渠隋志有石渠禮論四巻戴聖撰張生為博士論石渠聞人通漢以太子舍人論石渠蓺文志書議奏四十二篇禮議奏三十八篇春秋議奏三十九篇論語議奏十八篇五經雜議十八篇凡百五十五篇後陳元傳孝宣為石渠論而榖梁氏興榖梁序漢興以來瓌望碩儒各信所習是非紛錯準裁靡定故有父子異同之論石渠分爭之説禮運正義議郎尹更始待詔劉更生等議石渠以為吉凶不並瑞災不兼麟為周亡之異不得為瑞漢五經雜議通義要義演經雜論通論五經論志孝經家有五經雜議十八篇石渠論唐志經解劉向五經雜義七卷又通義九卷隋志八巻梁九卷要義五卷隋志梁十七卷雷氏撰要舊唐志五經雜義七卷又通義九卷義五巻劉向撰後傳曹襃作演經雜論百二十篇通義十二篇沛獻王輔光武子好經書善説京氏易孝經論語傳及圖䜟作五經論時號曰沛王通論明紀注通典冬夏至寢兵廣韻注引通義百官志注引五經通義二王之後不考功世説注引通義要義隋禮儀志引要義曰笏所以記事通義曰弁髙五寸前後玉飾文選注引五經要義太一一名終南山又曰籍田千畆以先百姓致孝敬文選雪賦注引五經通訓通典引通義曰號所以表功徳北史劉芳引通義太社王社要義社必植以木隋志孫暢之五經雜義六卷梁又有五經義畧一卷劉向辨章舊聞則有五經通義沛獻説易圖䜟則有沛王通論建初㑹羣儒考同異則有白虎通義易通論作於洼丹五經通難著於程曽曽著書百餘篇通義十二篇作於曹褒褒傳慶氏禮又有演經雜論百二十篇鄭𤣥有六藝論許慎有異義魏王肅有聖證論晉束晳亦有五經通論譙周有然否論五卷戴逵大義三巻梁鮑泉六經通數十卷邯鄲綽五經析疑二十八卷元延明宗畧二十三卷漢六藝畧見書目五學志六藝一百三家三千一百二十三篇入三家一百五十九出篇重十一篇六藝之文樂以和神仁之表詩以正言義之用禮以明體故無訓書以廣聽知之術春秋以斷事信之符五者五常之道而易為之原易與天地相終始至於五學世有變改猶五行之更用事叙傳世宗憲章六學儒林叙傳漢存其業六學析分史記太史公論六家曰六蓺經傳以千萬數累世不能通其學當年不能究其禮協六經異傳董仲舒通五經王吉通五經為騶氏春秋以詩論語教授好梁丘臨一作賀説易令子駿受焉夏侯始昌通五經以齊詩尚書教授易書王璜費氏古文詩禮后蒼詩書徐敖古文書毛詩書夏侯始昌齊詩尚書春秋胡常古文榖梁左氏禮春秋孟卿后氏禮疏氏春秋皆出孟卿詩春秋申公江公榮廣魯詩榖梁易詩韓嬰漢六藝九種志序六藝為九種易十三家二百九十四篇書九家四百十二篇詩六家四百十六卷禮十三家五百五十五篇樂六家百六十五篇春秋二十三家九百四十八篇論語十二家二百二十九篇孝經十一家五十九篇小學十家自史籀至杜林蒼頡故三十五篇漢五經章句藝文志易章句施孟梁丘各二篇丁寛有小章句費直長於小學章句書章句歐陽三十一巻大小夏侯各二十九卷張無故善修章句守小夏侯説又秦恭増師法至百萬言春秋公羊三十八篇榖梁三十三篇儒林傳尹更始左氏章句劉歆章句備焉夏侯勝傳曰建所謂章句小儒破碎大道後紀建初四年十一月壬戌詔中元元年詔書五經章句煩多議欲減省至永平元年長水校尉儵奏言先帝大業當以時施行欲使諸儒共定經義於是㑹白虎觀議同異八年十二月戊申詔曰五經剖判去聖彌逺章句遺辭乖疑難正恐先師微言將絶其令羣儒選髙才生受學榖梁左氏春秋古文尚書毛詩以扶微學廣異義易惟樊英習京氏著章句唐志孟喜京房費直馬融荀爽有章句書歐陽有牟長章句牟卿章句四十五萬餘言張奐減為九萬言桓榮受朱普學章句四十萬言入授顯宗減為二十三萬言子郁刪定成十二萬言有桓君大小太常章句盧植作尚書章句詩則伏黯改定齊詩章句子恭減省浮辭定為二十萬言杜撫定韓詩章句張康作韓詩章句薛漢世習韓詩父子以章句著名禮則橋仁從戴徳學著禮記章句四十九篇曹充習慶氏學作章句辨難曹褒新禮章句景鸞月令章句蔡邕月令章句春秋則鄭興撰左氏條例章句樊儵鍾興刪定公羊嚴氏章句又使宗室從興受章句楊終改定春秋章句十五萬言唐志有賈逵左氏長經章句二十巻鄭衆牒例章句九巻列傳桓譚帝方信䜟譚言宜屏羣小之曲説述五經之正義譚徧習五經皆詁訓大義不為章句隋志漢時又詔東平王蒼正五經章句皆命從䜟俗儒趨時言五經者皆憑䜟為説桓郁遷侍中顯宗制五家要説章句令郁校定於宣明殿鄭𤣥傳論東京學者經數家家數説章句多者百餘萬言學徒勞而少功後生疑而莫正傅毅永平中於平陵習章句作迪志詩文苑孔僖子長彦好章句儒林王充好博覽不守章句盧植不守章句荀淑博學不好章句多為俗儒所非梁鴻韓融不為章句徐防和帝永元十四年拜司空以五經乆逺聖意難明宜為章句以悟後學上疏曰詩書禮樂定自孔子發明章句始於子夏其後諸家分析各有異説今不依章句妄生穿鑿臣以為博士及甲乙策試宜從其家章句開五十難試之詔從防言順紀陽嘉元年十一月令孝㢘諸生通章句乃得應選儒林傳順帝更修黌宇游學雖増盛而章句漸疎浮華相尚劉表傳博求儒術綦母闓宋忠等撰立三經章句謂之後定詩正義自古而有篇章之名與詩禮俱興也句則古者謂之為言秦漢以來衆儒各為訓詁乃有句稱句必聨字而言句者局也聨字分疆所以局言章者明也總義包體所以明情六蓺論未有若今傳訓章句明為傳訓以來始辨章句文心雕龍若秦延君之注堯典十餘萬字朱普之解尚書三十萬言所以通人惡煩羞學章句若毛公訓詩安國傳書鄭君釋禮王弼解易要約明暢可為式矣故謂通指義毛書有夏侯解故詩有魯故后故氏故韓故詩故訓傳小學有杜林蒼頡微謂釋微指春秋有左氏微鐸氏微張氏微虞卿微傳通洼君通白虎通風俗通史通韓滉春秋通典籍之存詁訓之傳皆漢儒之力詩有魯故韓故齊后氏故齊孫氏故毛詩故訓傳書有大小夏侯解故前人惟故之尚如此今人乃新之急邪贅以釋老鑿以申韓塗人之耳目而變易其心思經猶的也一人射之不若衆人射之其中者多也傳師所説謂之傳丘明子夏於春秋禮經作傳是也古者以一句為一言一言蔽之曰思無邪大揚之水卒章之四言叔九言秦漢以來衆儒各為訓詁乃有句稱漢儒林傳業前儒林傳賛自武帝立五經博士開弟子員設科射策勸以官禄訖於元始百有餘年傳業者寖盛支葉蕃滋一經説至百餘萬言大師衆至千餘人葢禄利之路然也傳言家世傳業者易士孫張書陳翁生平當詩滿昌伏理禮橋仁徐良春秋王中漢興言易自淄川田生言書自濟南伏生言詩於魯則申培公於齊則轅固生燕則韓太傅言禮則魯髙堂生言春秋於齊則胡母生於趙則董仲舒易本田何有施孟梁丘之學施家有張彭之學孟喜有翟孟白之學梁丘有士孫鄧衡之學有京氏之學有髙氏學髙費皆未立學官書歐陽大小夏侯氏學皆出於倪寛世有歐陽氏學歐陽有平陳之學有大小夏侯之學大夏侯有孔許之學小夏侯有鄭張秦假李氏之學孔氏古文未立學官百兩篇出張霸魯詩有韋氏學有張唐褚氏之學江公世為魯詩宗張家有許氏學齊詩有翼匡師伏之學韓詩有王食長孫之學言毛詩本徐敖禮為頌者由徐氏禮有大戴小戴慶氏之學大戴有徐氏小戴有橋楊氏之學公羊春秋有顔嚴之學顏家有泠任之學有筦㝠之學榖梁春秋有尹胡申章房氏之學言左氏本賈䕶劉歆志春秋分為五左氏公羊榖梁鄒夾氏詩分為四毛齊魯韓易有數家之傳漢師法儒林傳孟喜受易博士缺衆人薦喜上聞喜改師法遂不用秦恭小夏侯書増師法至百萬言唐長賔褚少孫事王式問經數篇式曰聞之於師具是矣自潤色之不肯復授唐生褚生試誦説有法疑者丘葢不言胡毋生治公羊弟子唯嬴公守學不失師法梁丘臨學精熟專行京房法列傳匡衡對詩諸大義説有師道可觀覽張禹對易論語大義經學精習有師法魏相明易經有師法漢五經家法通經名家宋百官志漢武建元五年初置五經博士宣成之世五經家法稍増經置博士一人至東京凡十四人詩正義漢承滅學之後典籍出於人間各專門命氏以顯其家之學故為傳訓者皆云氏不言名後儒林傳序光武立五經博士各以家法教授凡十四博士肅宗詔髙才生受古文尚書毛詩榖梁左氏春秋雖不立學官然皆擢髙第為講郎以網羅遺逸博存衆家東京學者猥衆今但録其能通經名家者以為儒林篇其自有列傳者則不兼書若師資所承標名為證乃著之易施氏劉昆子軼孟氏洼丹𤭔陽鴻任安梁丘楊政張興子魴京氏戴憑魏滿孫期書歐陽歙曹曽陳弇牟長宋登大夏侯張馴字子雋古文尹敏周防孔僖楊倫詩魯髙詡包咸魏應齊伏恭任末景鸞韓薛漢杜撫召伯春楊仁趙曅張康毛謝曼卿衛宏禮慶氏董鈞春秋公羊嚴氏丁恭周澤鍾興甄宇子普樓望程曽顏氏張𤣥公羊李育何休左氏服䖍頴容謝該通五經許慎蔡𤣥如費氏易有陳元鄭衆馬融鄭𤣥荀爽夏歐尚書有牟融王良桓榮古文尚書有杜林賈逵毛詩有鄭衆賈逵馬融鄭𤣥慶氏禮有曹充襃三禮有馬鄭左氏春秋有鄭興陳元自有列傳而標名儒林之篇後紀質帝本初元年詔四姓小侯先能通經者各命隨家法注儒生為詩者謂之詩家為禮者謂之禮家列傳徐防言大學試博士弟子皆以意説不修家法論議紛錯互相是非注諸經為業各自名家左雄言孝㢘諸生試家法楊統父春卿善圖䜟統作家法章句及内䜟二卷解説鄭𤣥傳論漢興諸儒頗修蓺文東京學者亦各名家經有數家家有數説章句多者或百餘萬言學徒勞而少功後生疑而莫正鄭𤣥括囊大典網羅衆家刪裁刋改學者畧知所歸王父豫章君范甯傳授生徒專以鄭氏家法𤣥習春秋顏氏兼通數家法樊準曰孝明多召名儒充禮官博士議郎一人開門徒衆百數賈逵曰先帝博觀異家各有所採易有施孟復立梁丘尚書歐陽復有大小夏侯漢儒林弟子著録經生編牒後儒林傳論自光武中年專事經學其風世篤經生謂博士所處不逺萬里之路精廬暫建贏糧動有千百其耆名髙義開門授徒者編牒不下萬人皆專相傳祖莫或訛雜至有分爭王庭植朋私里繁其章條穿求崖穴以合一家之説張興習梁丘易弟子自逺至者著録且萬人牟長習歐陽尚書著録前後萬人魏應受魯詩弟子著録數千人丁恭習嚴春秋著録數千人樓望習嚴春秋著録九千餘人張𤣥習顏氏著録千餘人蔡𤣥通五經著録萬六千人注著於籍録漢羣臣説經戴憑傳習京氏易召試博士拜郎中時詔公卿大㑹羣臣皆就席憑獨立光武問其意對曰博士説經皆不如臣而坐居臣上帝即召上殿令與諸儒難説多所解釋帝善之拜虎賁中郎將以侍中兼領正旦朝賀百僚畢㑹帝令羣臣能説經者更相難詰義有不通輒奪其席以益通者憑重坐五十餘席京師語曰解經不窮戴侍中藝文類聚殷氏世傳曰殷亮建武中拜博士諸儒講論勝者賜席亮重至八九詳見帝學魯丕傳元和中引見難問經傳永元十一年和帝因朝㑹召見諸儒丕與賈逵黄香等相難數事帝善丕説上疏曰説經者傳先師之言非從己出難者必明其據説者務立其義法異者各令自説師法博觀其義覽詩人之㫖意察雅頌之終始明舜禹臯陶之相戒顯周公箕子之所陳漢白虎議奏通義通徳論章紀建初四年十一月壬戌詔曰中元元年詔書五經章句煩多議欲減省至永平元年長水校尉鯈樊鯈奏言先帝大業當以時施行欲使諸儒共正經義令學者得以自助於戯其勉之哉於是太常將大夫博士議郎郎官及諸生諸儒㑹白虎觀講議五經異同使五官中郎將魏應承制問難侍中淳于恭奏上帝親稱制臨决如孝宣甘露石渠故事作白虎議奏注今白虎通儒林傳建初中大㑹諸儒於白虎觀考詳同異連月乃罷肅宗親臨稱制如石渠故事顧命史臣著為通義即白虎通議是也魏應專掌難問餘同章紀李育建初四年詔與諸儒論五經於白虎觀育以公羊義難賈逵徃反皆有理證最為通儒列傳魯恭習魯詩肅宗集諸儒於白虎觀恭特以明經得召與其議丁鴻建初四年肅宗詔與廣平王羨及諸儒樓望成封桓郁賈逵等論定五經同異於北宫白虎觀使五官中郎將魏應主承制問難侍中淳于恭奏上帝親稱制臨决鴻以髙才論難最明諸儒稱之帝數嘆焉注東觀記與太常樓望少府成封屯騎校尉桓郁衛士令賈逵等集議白虎門名於門立觀因以名焉傳賛云髙論白虎班固遷𤣥武司馬天子㑹諸儒講論五經作白虎通徳論令固撰集其事楊終又言宣帝博召羣儒定論五經於石渠方今天下少事學者得成其業而章句之徒破壊大體宜如石渠故事永為後世則於是詔諸儒於白虎觀論考同異焉㑹終坐事係獄博士趙博校書郎班固賈逵等以終深曉春秋學多異聞表請之終又上書自訟即日貰出乃得與白虎觀陳敬王羨博涉經書有威嚴與諸儒講論於白虎觀蔡邕封事曰孝宣㑹諸儒於石渠章帝集學士於白虎通經釋義其事優大通鑑白虎觀議五經名儒丁鴻樓望成封桓郁班固賈逵及廣平王羨皆與焉隋志白虎通六卷唐志班固等白虎通義六巻崇文目白虎通徳論十卷中興書目白虎通十卷凡四十篇今本自爵號至嫁娶凡四十三篇蔡𤣥傳順帝詔拜議郎講論五經異同甚合帝意𤣥學傳五漢諸經通義又見上太常試經孟子題辭漢興孝文廣遊學之路孟子置博士訖今諸經通義得引孟子以明事謂之博文東萊曰謂課試者也詩小弁引舜年五十而慕害緜引太王不以養人者人禮記王制引貢助徹圭田坊記引舜年五十不失孺子之心周禮大宰八統引爵徳齒田小司徒引仁政自經界始載師士引圭田之説及五畆之宅植桑征㕓人引市㕓而不征法而不㕓税司關引關譏而不函人矢人助有公田野九夫一國中什一之言又引於考工記匠人以孟子論之周制邦國用殷助法列傳鄭衆建武中皇太子及山陽王聘衆欲為通義伏恭明齊詩建武十三年太常試經第一拜博士顏氏博士缺張𤣥試策第一周防儒林世祖狩汝南召掾史試經防能誦讀拜守丞髙彪文苑舉孝㢘試經第一除郎中徐防永元十四年言太學試博士弟子皆以意説不修家法臣以為甲乙策試宜從其家章句五經各取上第六人論語不宜射策官志司𨽻有孝經師主監試經諸經通義者漢五經課試之學也維漢以文立治以經選士鴻生傳業支蕃葉滋闡繹道真探索聖緼决科射策則有通義之目以孟子明事則有博文之名趙岐題辭觕述大槩謹稽合史傳而為之説曰聖人作經載道學者因經明道學博而不詳説無以發羣獻之眇指説詳而不反約無以折衆言之殽亂故必泝正學之源而後能通乎聖人之海粤自木鐸聲寢經與道榛塞孟子闢邪距詖羽翼孔道七篇垂訓法嚴義精知性知天易之奥也以意逆志詩之綱也言稱堯舜書之要也井田爵禄之制可以知禮王霸義利之辨可以知春秋儒者稱之曰通五經噫若孟氏斯謂之通矣媺哉漢之尊經虖儒五十三家莫非賢傳也而孟子首置博士九流百八十九家莫非諸子也而通義得述孟子斯文之統紀以壹多士之趨向以純非徒綴訓故誦佔畢而已若稽前載建元五年春五經始立博士元朔五禩通一蓺者試之孝元好儒通一經者復之博士十四昉于建武選受四經俶于建初科有甲乙試有家法或試經于太常或試誦説于博士永元十四年司空徐防建言開五十難解釋多者為上第演文明者為髙説所謂博文明事雖軼不傳然建武中太子諸王欲為通義而聘鄭衆建初四年㑹諸儒白虎觀命史臣著通義曹褒傳慶氏禮亦篹通義十二篇觀其名可求其畧矣還觀有漢之盛鉅儒石師開門授徒著録至萬六千人經數家家數説章句多者百餘萬言歴禩綿邈湮没居多嘗即詩禮訓注考之小弁述親親之言王制述貢助徹之法爵徳齒釋於大宰經界釋於小司徒圭田市㕓關幾釋於載師㕓人司關助有公田國中什一及函矢之説又詳列于考工記珠貫絲組上下洽通葢傳得其宗無越鄒孟求觀聖道必自兹始否則繢以華薻汩以緯􅀱荄兹詭辨稽古曼辭燕説郢書吾道莠矣焉得而通諸雖然經學至於通而止漢儒之説何其紛紛也五經通義劉向輯之五經通論沛獻著之程曽通難洼丹易通專己黨同轍殊牖異君子已不能無憾況課試之學以明經為禄利之塗則通義乃諸儒之筌蹄也其不傳於今有以夫吁師異道人異論漢儒之説猶得以考同異析是非也暨唐貞觀十二年㑹稡章句為正義百七十卷繇是舉天下宗一説而無深造自得之功若明經又變為帖誦而口義墨義興焉君子又惜通義之不傳於今也擬序漢六蓺篇録張衡傳中興後儒者爭學圖緯衡上疏曰河洛六蓺篇録已定後人皮傳無所容簒注衡集上事云河洛五九六藝四九謂八十一篇也尹敏傳世祖令敏校圖䜟使蠲去崔發所為著録次比隋志七經緯三十六篇並云孔子所作漢代有郗氏袁氏説宋均鄭𤣥並為䜟律之注文辭淺俗不類聖人之㫖北史樊深撰七經異目三卷漢六蓺論鄭志又見後鄭𤣥𫝊事第五元通京氏易公羊春秋三統厯九章算術從張恭祖受周官禮記左氏春秋韓詩古文尚書事馬融質疑義𤣥謂所好羣書不得於禮堂寫定傳與其人門人相與撰𤣥答諸弟子問五經依論語作鄭志八篇凡𤣥所注周易尚書毛詩儀禮禮記論語孝經尚書大傳中􅀱乾象厯又著天文七政論魯禮禘祫義六蓺論毛詩譜駮許慎五經異義答臨孝存周禮難凡百餘萬言謝承書不言注孝經經傳洽熟稱為純儒括囊大典網羅衆家隋志六蓺論一卷鄭𤣥撰唐志同聖證論十二卷王肅撰唐志十一卷鄭志十一巻唐志九卷魏侍中鄭小同撰鄭記六卷唐志同𤣥弟子撰魏志孫叔然授學鄭𤣥之門人王肅集聖證論以譏短𤣥叔然駮而釋之肅規鄭𤣥數千百條馬昭劾肅短詔遣博士張融按經問詰肅記正義聖證論馬昭引榖梁傳以答王之難王基𫝊散騎常侍王肅著諸經傳解及論定朝儀改易鄭𤣥舊説而基據持𤣥義常與抗衡吳虞翻奏鄭𤣥所注五經違義尤甚者百六十七事晉范甯考先儒經訓而長於𤣥傳授生徒專以鄭氏家法唐元行冲曰康成於竄伏之中理紛拏之典雖存探究咨謀靡所具鄭志者百有餘科劉子𤣥曰鄭弟子追論師注及應對謂之鄭志又鄭志目録記鄭所注五經之外有中􅀱書𫝊七政論乾象厯六藝論毛詩譜答臨碩難禮駁許慎異義發墨守箴膏肓及答甄子然等書鄭之弟子分授門徒各述師言更不問答編録其語謂之鄭記趙商作鄭先生碑銘公羊疏鄭君先作六藝論訖然後注書通鑑外紀引鄭𤣥六藝論曰遂皇之後歴六紀九十一代至伏羲始作十二言之教方叔機注曰九頭紀一五龍紀五攝提紀七十二合洛紀三連通紀六序命紀四凡九十一代六藝論曰易者隂陽之象天地所變化政教所生自人皇初起詩禮記左氏榖梁公羊疏曲禮玉藻正義引六藝論宋均孝經緯注引鄭六藝論叙孝經云𤣥又為之注漢四經賈逵傳建初元年入講古文尚書左傳又條奏左氏大義撰歐陽夏侯古文齊魯韓毛詩同異八年紀十二月戊申乃詔諸儒選髙才生受左氏榖梁春秋古文尚書毛詩由是四經遂行於世皆拜逵所選弟子及門生為千乘王國郎朝夕受業黄門學者欣欣羨慕紀建初元年十二月戊申詔見上儒林傳序雖不立學官然皆擢髙第為講郎給事近職所以網羅遺逸博存衆家古文四十六卷為五十七篇毛詩二十九巻又故訓傳三十卷左氏傳三十卷左氏微二篇公榖二家之經十一卷榖梁傳十一卷外傳二十篇章句三十三篇漢五經異義儒林傳許慎字叔重博學以五經傳説臧否不同撰五經異義又作説文解字十四篇説文引用經傳多與今文不同鄭𤣥傳駁許慎五經異義唐志許慎五經異義十巻隋志同鄭𤣥駁齊志隋禮儀志引異義書禮疏史記正義引異義及鄭𤣥駁堯典九族異義夏侯歐陽云云鄭𤣥駁史記注引鄭𤣥駁異義禮記正義案異義公羊説古春秋左氏説許慎案治魯詩韋𤣥成治易施犨等説引外傳曰三王之樂可得觀乎鄭駁之云異義今孝經説云云玉藻疏異義淳于登説明堂樊鯈以䜟記正五經異説隋辛彥之撰五經異義一部漢五經大夫博士見官制五經師見前小侯學祭遵傳博士范升稱遵曰建為孔子立後奏置五經大夫鄭氏九書唐㑹要劉子𤣥孝經注議曰晉中經簿周易尚書尚書中􅀱大傳毛詩周禮儀禮禮記論語凡九書皆云鄭氏注名𤣥至於孝經則稱鄭氏解無名𤣥二字春秋緯演孔圖云康成注三禮詩易尚書論語其春秋孝經别有評論鄭引圖䜟皆謂之説易緯曰易説書緯曰書説嫌引祕書魏六藝課試法髙堂隆傳景初中帝以蘇林秦靜等並老恐無能傳業者乃詔曰先聖餘教著於六藝六藝之文禮又為急今宿生巨儒並各年髙教訓之道孰為其繼昔伏生將老漢文嗣以鼂錯榖梁寡疇宣帝承以十郎其科郎吏髙才解經義者三十人從光禄勲隆散騎常侍林博士靜分受四經三禮主者具為設課試之法文紀黄初五年四月立大學制五經課試之法大學初立樂詳拜博士五業並授魏畧黄初元年之後補舊石碑之缺備學士之員録依漢甲乙以考課漢五經論晉五經然否論譙周傳撰定法訓五經論古史考之屬百餘篇秦宓傳譙允南記録其言為春秋然否論隋志五經然否論五巻晉散騎常侍譙周撰後漢禮儀志注引之晉十九博士太學石經元帝紀大興二年六月置博士員五人四年三月置周易儀禮公羊博士志晉初承魏制置博士十九人及咸寧四年武帝初立國子學定置國子祭酒博士各一人助教十五人江左初減為九人元帝末増儀禮春秋公羊博士各一人合為十一人後又増為十六人不復分掌五經而謂之太學博士元帝立儒林祭酒官以杜夷為之太元中増置太學生百人以車武子領國子博士荀崧傳元帝踐阼召拜尚書僕射轉太常方修學校簡省博士置周易王氏尚書鄭氏古文尚書孔氏毛詩鄭氏周官禮記鄭氏春秋左傳杜氏服氏論語孝經鄭氏博士各一人凡九人其儀禮公羊榖梁及鄭易皆省不置崧以為不可乃上疏曰世祖皇帝經始明堂營建辟雍告朔頒正鄉飲大射西閣東序河圖秘書禁籍臺省有宗廟太府金墉故事太學有石經古文先儒典訓賈馬鄭杜服孔王何顔尹之徒章句傳注衆家之學置博士十九人猶選張華劉寔居太常之官以重儒教伏聞節省之制皆三分置二博士舊置十九人今五經合九人准古計今猶未能半今九人之外猶宜増四宜為鄭易置博士一人鄭儀禮春秋公羊榖梁博士各一人帝詔可共博議者詳之議者多請從崧所奏詔曰榖梁膚淺不足置博士梁天監四年正月置五經博士各一人晉五經通論束晳傳著五經通論晉五經同異評儒林傳徐苗字叔胄為儒宗作五經同異評隋志梁有五經異同評一巻賀瑒撰北史張鳳著五經異同評十卷晉五經音訓儒林傳徐邈博涉多聞孝武延儒士謝安舉邈補中書舍人侍西省雖不口傳章句然開釋文義標明指趣撰正五經音訓學者宗之又注榖梁隋志徐邈五經音十卷左傳正義晉宋古本序在集解之端徐邈定五經音訓為此序作音晉五經鈎沉隋志五經鈎沉十巻唐志同鈎舊唐志云深晉髙凉一作梁太守楊方撰書目十巻晉髙凉太守楊方撰崇文目方作芳自序云晉太寧元年撰鈎經傳之沉義著論難以起滯崇文目云篇第亡缺今缺五篇晉五經大義隋志五經大義戴逵撰三巻後周樊文深撰十巻何妥撰五卷南史沈文阿撰經典大義十八巻隋志十二卷陳王元規續經典大義十四卷齊巾箱五經南齊書衡陽王鈞手自細書寫五經部為一巻置於巾箱中以備遺忘曰於檢閲既易且一更手寫永不忘諸王爭效巾箱五經自此始梁五經講疏梁書武帝撰五經講疏使孔子袪閱羣書為義證釋乾坤文言張譏袁憲與焉簡文於𤣥圃述武帝所製五經講疏後魏五經疑問後魏書房景先作五經疑問百餘篇王神貴益之名為辨疑合成十卷常爽述六經畧注以廣制作隋志梁有五經咨疑八卷周楊撰唐志法家邯鄲綽五經析疑三十巻初學記引之隋諸經義疏六儒儒林𫝊南北所治章句好尚不同江左周易則王弼書則孔安國左傳則杜元凱河洛左傳則服䖍書易則鄭康成詩並主毛禮同遵鄭南人約簡得其英華北學深蕪窮其枝葉髙祖遵問道之儀觀釋奠之禮博士罄傾河之辨侍中竭重席之奥研覈異同渙焉氷釋二劉焯炫學通南北博極今古所製諸經義疏搢紳咸師宗之焯有五經述議章賈馬王鄭所𫝊句多所是非語炫有五經正名十二卷春秋毛詩述議皆四十卷論述議十巻春秋攻昧十巻孝經述議五巻尚書述議二十巻注詩序一巻後魏常爽述六經畧注開皇初召山東義學之士馬光張仲讓孔籠竇士榮張黑奴劉祖仁授太學博士時人號為六儒開皇五年四月乙巳詔召山東馬榮伯等六儒五經决録文中子十四代祖述著春秋義統六代祖元則仕宋述時變論六篇其言化俗推移之理竭矣煥述五經决録五篇其言聖賢製述之意備矣虬北事魏述政大論八篇其言帝王之道著矣彥述政小論八篇其言王霸之業盡矣傑述皇極讜義九篇其言三才之去就深矣隆述興衰要論七篇其言六代之得失明矣今皆亡子謂董常曰吾欲修元經得皇極讜義焉欲續詩得時變論焉欲續書得政大論焉唐十九家經解藝文志經解類十九家二十六部三百八十一巻失姓名一家劉向五經雜義七卷通義九卷要義五巻許慎異義十巻鄭𤣥駁譙周然否論五巻楊方鈎沉十巻晉人楊思咨疑八卷隋志咨疑周楊撰元延明宗畧四十卷隋二十三巻劉炫正名十二卷並五經沈文阿經典𤣥儒大義序録十卷隋二巻班固等白虎通義六卷鄭𤣥六藝論一卷鄭志九卷鄭記六卷王肅聖證論十一卷隋十二巻梁武帝孔子正言二十卷梁武帝撰五經講疏及孔子正言簡文帝長春義記一百卷樊文深七經義綱畧論二十卷隋志二十九卷又質疑五卷張譏游𤣥桂林二十卷隋志九巻南史二十四巻謚法三卷荀顗演劉熈注沈約謚例十卷賀琛謚法三巻隋志云賀瑒五巻集天名稱三卷陸徳明經典釋文三十巻顏師古匡繆正俗八卷不著録十家一百二十七巻始於趙英五經對訣終於劉鎔經典集音有劉迅貺張鎰韋表微裴僑卿髙重王彥威慕容宗本諸家中興目二十一家四百八十四卷續目三家十六卷唐十一類經録志甲部經録其類十一易書詩禮樂春秋孝經論語䜟緯經解小學凡著録四百四十家五百九十七部六千一百四十五卷不著録一百一十七家三千三百六十卷舊志十二類以小學訓詁分為二隋志班固列六藝為九種或以緯書解經合為十種凡六藝經緯六百二十七部五千三百七十一卷通亡書合九百五十部七千二百九十卷唐五經正義五經義訓義賛志周易正義十六卷國子祭酒孔頴達顏師古司馬才章王恭馬嘉運趙乾叶王談于志寧等奉詔撰四門博士蘇徳融趙𢎞智覆審尚書正義二十巻孔頴達王徳韶李子雲撰朱長才等五人覆審無忌勣志寧行成等二十三人刋定毛詩正義四十卷頴達徳韶齊威撰乾叶等三人覆正禮記正義七十卷頴達朱子奢李善信賈公彥栁士宣范義頵張權等撰周𤣥逵等四人覆審賈公彥禮記正義八十卷儀禮疏五十卷周禮疏五十卷春秋正義三十六卷頴達楊士勛朱長才撰馬嘉運等四人覆審楊士勛榖梁疏十二卷孔頴達傳初頴達與顏師古司馬才章王恭王琰受詔撰五經義訓凡百餘篇號義賛詔改為正義雖包貫異家為詳博其中不能無冗繆孔陸正義釋文自多背馳博士馬嘉運駮正其失至相詆譏嘉運貞觀十一年拜太學博士以正義繁釀故犄摭其疵當世諸儒服其精有詔更令裁定功未就永徽二年三月詔中書門下與國子三館博士𢎞文館學士攷正之於是尚書左僕射于志寧右僕射張行成侍中髙季輔就加増損四年三月書始下三月一日㑹要貞觀十二年國子祭酒孔頴達撰五經義疏一百七十巻政要云一百八十巻名曰義賛有詔改為五經正義一本云初太宗以師説多門章句繁雜命孔頴達與諸儒撰五經疏名五經正義太學博士馬嘉運每掎摭之有詔更令詳定未訖而卒永徽三年三月十四日詔太尉趙公無忌等刋正四年三月一日進之正義表永徽四年二月二十四日上頒于天下以為定式凡書二十巻詩四十卷易十六卷春秋三十六卷二禮共百二十巻舊史貞觀七年十一月丁丑頒新定五經于天下永徽四年三月壬子朔頒孔頴達五經正義於天下每年明經依此攷試儒學傳貞觀中廣學舍千二百區吐蕃髙麗等羣酋並遣子弟入學鼓笥踵堂凡八千餘人帝又讐正五經謬缺頒天下示學者與諸儒㑹稡章句為義疏俾乆其傳律疏序云近代已來兼經注而明之謂為義疏疏者識也宋朝端拱元年三月司業孔維等校五經正義百八十巻五月四日鏤板朌行孔維表云貞觀中祭酒孔頴達考前代之文採衆家之説隨經析理去短從長用功二十餘年書成一百八十卷歐陽修以為晉宋而下師道漸亡各為箋傳附著經文唐太宗始詔名儒撰定正義著為定論凡不本正義者謂之異端則學者之宗師百世之取信也然所載既博所擇不精多引䜟緯之書異乎正義之名欲詔名儒取九經之疏刪去䜟緯之文然後經義純一無雜人自為説兩漢之俗也舉天下宗一説唐傳疏之學也唐經典釋文志陸徳明經典釋文三十巻第一巻序録舊史徳明撰經典釋文三十卷老子疏十五卷易疏二十卷太宗後閲徳明經典釋文甚嘉之賜家帛二百叚一本云貞觀十六年四月甲辰太宗閲徳明經典音義美其𢎞益學者賜其家布帛百匹易古文書毛詩周禮儀禮禮記三傳孝經論語老莊子爾雅等音合為三十卷三帙内老子釋文一卷莊子二巻序曰楚夏聲異南北語殊捜訪異同撰集為六經三傳釋文先儒舊音多不音注然讀注不曉則經義難明徳明乃并注音之古人音書止為譬况孫炎始為反切志又有劉鎔經典集音三十巻校定釋文見讎正五經類集賢注記有敇依文字音義改撰春秋毛詩莊子音張九齡奏校理官吕證撰春秋音義鄭欽説撰毛詩音義甘暉衛包撰莊子音義見小學類晁説之曰古人訓詁緩而簡故其意全雖數十字而同一訓雖一字而兼數用唐五經博士官志五經博士各二人正五品上以其經之學教國子易書詩左氏春秋禮記為五經論語孝經爾雅不立官附中經而已㑹要太和七年八月九日庚寅置五經博士一人冊皇子畢下詔國子監請秩比國子博士開成元年宰相領祭酒鄭覃奏請給禄四年二月定為五品舊紀開成元年五月庚申判祭酒宰臣覃奏太學新置五經博士各一人請依王府官賜禄粟覃傳云請太學五經經置博士禄廩比王府官覃一云八月己酉兼祭酒唐開元詳定傳注四書又見孝經㑹要開元七年三月一日敇孝經尚書有古文本孔鄭注㫖趣頗多蹖駁令諸儒質定奏聞六日詔曰孝經獨宗鄭氏孔氏遺㫖今則無文又子夏易傳近無習者輔嗣注老子亦甚甄明諸家所傳互有得失其令儒官詳定所長令明經者習讀四月七日左庶子劉子𤣥上孝經注議曰孝經非𤣥所注其驗十有二條行孔廢鄭於義為允今俗所行老子河上公注序云漢文帝時人以所注老子授文帝因冲空上天乃不經之鄙言案漢藝文志注老子者三家河上所釋無聞焉豈如王弼注義㫖為優又案漢志易有十三家而無子夏作傳者至梁阮氏七録有子夏易六卷或云韓嬰作或云丁寛作豈非後來假憑先哲臣竊以鄭氏孝經河上老子二書訛舛不足流行孔王兩家實堪師授伏見去月十日敇令所司詳定四書得失云云臣議請行王孔二書國子祭酒司馬貞議曰孝經注縱非鄭氏所作而義㫖敷暢近儒妄作孔傳偽作閨門一章近俗之語請鄭注孔傳依舊俱行河上憑虚立號漢史實無其人然其注以養神為宗無為為體辭近理𢎞王輔嗣理暢㫖微請王河二注俱行又案劉向七畧有子夏易傳但此書不行已乆今所存多失真本荀朂中經簿云子夏傳四卷或云丁寛作是先達疑非子夏矣隋志子夏傳殘缺梁時六卷今二卷其書錯謬無益後學不可帖正經五月五日詔曰間者諸儒所傳頗乖通議崇孔學者冀鄭門之息滅尚今文者指左傳為誣偽河鄭二家可令仍舊行用王孔所注傳習者稀亦存繼絶之典子夏傳逸篇令帖易者停劉子𤣥傳嘗議孝經鄭氏學非康成注舉十二條左證其謬當以古文為正易無子夏傳老子書無河上公注請存王弼學宰相宋璟等不然其論奏與諸儒質辯司馬貞等阿意共黜其言請二家兼行惟子夏易傳請罷詔可唐五經文字九經字様見讎正五經唐五經微㫖㑹要建中元年十月濠州刺史張鎰撰五經微㫖十四卷孟子音義三卷上之志經解類張鎰五經微㫖十四卷鎰又撰三禮圖九巻唐詳校九經㑹要貞元二年七月祕書監劉大真上言請擇儒者詳校九經於秘書省令所司陳設及供食物宰臣録其課效從之尋阻衆議寢不行唐六經法言五經法言韋處厚傳穆宗立處厚為翰林侍講學士以帝冲怠不向學與路隋合詩書易春秋禮孝經論語掇其粹要題為六經法言二十篇上之冀助省覽帝稱善並賜金幣集序云賜金紫舊史韋處厚傳穆宗荒怠乃銓擇經義雅言以類相從為二十卷謂之六經法言獻之賜繒帛銀器仍賜金紫路隋傳與韋處厚同入翰林為侍講學士採三代皇王興衰著六經法言奏之冊府元龜云賜錦綵銀器錫服遷官㑹要長慶二年四月癸未翰林侍講學士韋處厚路隋撰五經法言二十卷上之表曰魏稱皇覽梁著遍畧鄴中有修文之作江左有壽光之書但夸衒於見聞非垂謨於理本志儒家類六經法言二十卷韋處厚路隋撰李襲譽五經妙言四十卷鄭澣經史要録二十巻唐六經要言諸經纂要崔郾傳敬宗嗣位郾自侍講學士進中書舍人謝曰陛下使臣侍講歴半嵗不一問經義臣無功不足以副厚恩帝曰朕少間當請益髙釴適在旁因言陛下樂善而無所諮詢天下之人不知有嚮儒意帝重咎謝賜錦幣與髙重類六經要言為十篇上之以便觀省敬宗置侍講學士甚艱其選髙重以簡厚淳正崔郾皆預郾寳厯元年為學士由學士遷中書舍人志儒家類諸經纂要十卷崔郾㑹要寳厯元年三月髙重崔郾進纂要一卷舊史郾與髙重抄撮六經嘉言要道區分事類凡十卷名曰諸經纂要冀人主易省覽賜錦綵銀器唐白氏經史事類志類書白氏經史事類三十卷白居易撰一名六帖居易著事類集要三十部合一千一百三十門時人目為六帖盛均十三家帖以白氏六帖未備而廣之巻亡元稹類集三百卷集古今刑政之書中興書目居易採經傳百家之語摘其英華以類分門悉注所出卷帙名氏於其下孔傳亦有六帖合為一書皇朝陳紹重廣六帖學林三十巻紹興中陳天麟類班史為前漢六帖十二卷唐九經師授譜韋表微傳見春秋類志一卷宋朝李燾著五經傳授尚書百篇圖各一卷崇文總目有授經圖三卷唐經史要録鄭澣傳文宗時入翰林為侍講學士帝使稡擷經史為要録愛其博而精試舉諸條擿問之隨即酬析無留答因賜金紫服舊史云以十九書語類親自發問藝文志鄭澣經史要録二十卷儒家唐經史釋題志目録類李肇二卷崇文目同三書目釋文題巻序云經以學令為定以藝文志為編史以史通為準各列其題從而釋之唐微言注集志經解類裴僑卿二卷開元中鄭縣尉上之唐六説六經外傳志劉迅六説五巻劉貺六經外傳三十七巻經解類𫝊迅續詩書春秋禮樂五説書成不以示人書目迅作六書以繼六經標作書之誼而著其目惟易闕而不叙一本云劉迅著書以擬六經此乃其叙篇唯易闕而不言故止五巻唐五經類語志經解類慕容宗本十卷大中時李適傳譔九經要句唐五經妙言志儒家李襲譽四十卷唐諸經義樞尹思貞撰諸經義樞續史記皆未就端拱校五經正義見讎正五經咸平校定七經疏義見讎正五經書目劉敞七經小傳五卷雜釋詩書春秋周禮儀禮禮記論語七經劉􅂜七經義一百七十卷有易無儀禮景徳二年龍圖閣經典門總三千三百四十一卷目録三十巻正經三百一十四巻經解千三十五卷訓詁四百九十五卷六月庚寅國子監上新刻公榖傳周禮儀禮正義印板先是後唐長興中雕九經板本而正義傳寫蹖駮太宗命刋校雕印而四經未畢上遣直講王煥就杭州刋板至是皆備十月甲申賜輔臣親王周禮儀禮公榖傳疏祥符九經餘義實録祥符五年正月癸未以懐安軍鹿鳴山人黄敏書目云黄敏求為本軍助教敏明經術嘗著九經餘義四百九十三篇㑹要無三字轉運使滕陟一作涉以其書上進帝命學士晁逈等看詳逈等言所著撰可採故特有是命㑹要同書目一百卷崇文目同注疏之外言其餘義凡四百九十有四篇總九經兼孝經論語胡旦演聖通論七十二卷論六經傳注得失易十六書七詩十禮記十六春秋論别行晁氏志四十九卷博辯精詳學者宗焉皇祐五經精義天聖經典徽言皇祐三年十月丙申詔楊安國等以五經正義節解為書令先撰序及名丁酉安國等請名曰五經義宗精義樞要詔以五經精義為名十二月己亥御延和殿安國等上五經精義序進讀畢賜茶而退辛丑降付邇英閣四年六月壬寅延和殿侍講學士上五經精義周易節解二十巻十一月甲寅御邇英閣侍讀上尚書節解三十卷五年四月癸卯上禮記解九十巻十月一本十一月甲寅上春秋節解八十卷仁宗又命侍讀丁度等修纂五經精義周易節解度等言詩書凶服及春秋賊亂皆舊所不講今去留係上㫖上曰先王吉凶之制百代所遵不可以俗忌而簡去春秋喪亂之事皆有善惡鑒戒人主所宜知也亦當存之又曰先儒於經籍有一字之誤者朕未嘗有所改易以正經之義而刪去邪又神宗實録盧士宗在經筵撰五經精義上之詔藏史館天聖初孫奭掇五經切治道者為五十篇號經典徽言上之實録五十巻又撰五經節解皇祐之前寫尚書無逸於屏則景祐二年正月也李淑勸講春秋則寳元二年也曽公亮講詩於慶厯之五年王洙講易於至和元年紹興三經義辨辯學紹興五年六月三日己巳起居郎朱震言故龍圖閣學士楊時所著三經義辨請令本家抄録投進書目三經義辨十卷辨王安石書詩周禮三經義之失是嵗三月庚子王居正進辨學七卷四十二篇詔送秘省時居正為兵部侍郎紹興六經圖書目六卷紹興中布衣楊甲撰乾道中毛邦翰復増補之易七十書五十有五詩四十有七周禮六十有五禮記四十有三春秋二十有九合為圖三百有九乾道四經解九年閏正月二十三日敷文直學士胡銓言聖訓令臣進所解諸經今先繕寫周易周禮禮記春秋四經解詔令投進紹興十六年九月吳沆進羣經正論四巻康成注禮與其書易相偕元凱解傳無係毛鄭詩文心誦腹藏壁扃岩鐍濟秦之險以通於漢者萬無一二訓故之病黨枯䕶朽守缺保殘有不非鄭服之陋無是正左班之忠詩熄轅韓禮興后戴易有无咎悔亡之脱經存郭公夏五之疑齊論多於魯論舜典合於堯典邪釋繆解正漫真渝以禹貢行河以春秋斷獄以三百五篇諫六經之用果止於是歟是自夫子既成六經之後尚為未試之書也鄭康成注二禮引易説書説樂説春秋説禮家説孝經説皆緯􅀱也河洛七緯合為八十一篇河圖九篇洛書六篇又别有三十篇七經緯三十六篇易緯稽覽圖乾鑿度坤靈圖通卦驗是類謀辨終備書緯璇璣鈐考靈曜刑徳放帝命驗運期授詩緯推度災汜歴樞含神務禮緯含文嘉稽命徵斗威儀樂緯動聲儀稽耀嘉汁圖徵孝經緯援神契鈎命决春秋緯演孔圖元命包文耀鈎運斗樞感精符合誠圖考異郵保乾圖漢含孳佑助期握誠圖潛潭巴説題辭又有尚書中􅀱論語䜟在七緯之外按李尋有五經六緯之言葢起於哀平至光武篤信之諸儒習為内學隋焚其書今唯易緯存焉正義多引䜟緯歐陽公欲取九經之疏刪去䜟緯之文使學者不為怪異之言惑亂然後經義純一其言不果行又見困學紀聞玉海卷四十二
