body:
  text: 玉海卷一百五十一宋王應麟撰兵制劒㦸刀釋名劒撿也所以防撿非常口謂之鐔鼻謂之衛鞘謂之室韜謂之衣㦸格也旁有枝格刀到也以斬伐到其所乃擊之也其末曰鋒其本曰環黄帝鳴鴻刀拾遺記一云洞冥記帝解鳴鴻刀賜東方朔方朔曰此刀黄帝時採首陽之金鑄爲此刀雄者已飛雌者獨在洞冥記黄帝採首山之金始鑄爲刀顓頊有畫影劒騰空劒管子葛盧之山出金蚩尤制爲劒鎧矛㦸雍狐之山出金蚩尤以爲雍狐之㦸芮戈舜吳刀吕氏春秋帝舜殛鯀於羽山副之以吳刀歸蔵曰大副之吳刀是用出焉禹劒刀劒錄陶𢎞景撰夏禹子帝啓以庚戌八年鑄一劒長三尺九寸後藏之㑹稽秦望山腰上刻二十八宿文有背面面記星辰背記山水日月少康卒卯三年春鑄一銅劒上有八方面長三尺二寸頭方殷寶劒伊尹佩刀列子衛孔周其祖得殷帝之寳劒曰含光承影霄練此三寳𫝊之十三世矣刀劔錄太甲以甲子嵗鑄一劔文曰定光武丁以戊子嵗鑄一劔銘曰照膽周昭王瑕鑄五劔以投五嶽文選王褒頌注魯連子曰伊尹負鼎佩刀以干湯文子曰吕望皷刀而入周騷經吕望皷刀遭周文而得舉皷鳴也周文王錄劒古良劒荀子性惡篇繁弱鉅􅎟古之良弓也𦂳弱封父之弓鉅􅎟史記曰距來桓公之葱太公之闕文王之錄莊君之曶闔閭之干將莫邪鉅闕辟閭此皆古之良劒也注葱闕錄曶齊桓公齊太公周文王楚莊王之劒名皆未詳所出葱青色也錄與綠同三劒以色爲名曹植七啓說劒云雕以翠綠亦其類也曶劒光采慌忽難視以形爲名也闕未詳或曰劒至利則喜闕因以爲名鉅闕亦是也干將莫邪鉅闕皆吳王闔閭劒名新序云辟閭巨闕天下之良劒也或曰辟閭即湛盧也言湛然如水而黒色驊騮騹讀為騏驥纎離綠耳此皆古之良馬也注皆周穆王八駿名大戴記武王劔銘曰帶之以為服動必行徳周桃氏劒考工記桃氏爲劒劒以止暴桃以辟不祥類相似也故以桃氏爲劒臘廣二寸有半寸兩從半之以其臘廣爲之莖圍長倍之身長五其莖長重九鋝謂之上制長三尺上士服之士國勇力之士樂記所謂虎賁之士說劒身長四其莖長重七鋝謂之中制長二尺五寸中士服之身長三其莖長重五鋝謂之下制此今之匕首也長二尺下士服之因人之材力强弱列爲三等人各以形貌大小帶之弓人亦有上制弓長六尺六寸中制弓長六尺三寸下制弓長六尺上中下士服之以長者爲上士次者爲中士短者爲下士鹽鐵論以道徳為軸以仁義為劔莫之敢當湯武是也周錕鋙劒孔叢子陳士義第十五秦王得西戎利刀割玉如割木以示東方諸國魏王問子順曰古有之乎對曰周穆王征西戎西戎獻錕鋙之劒長尺有咫鍊列子一作練鋼赤刄用之切玉如切泥焉是則古亦有也注十洲記作西胡獻昆吾刀切王如切土也又見列子湯問篇一云昆吾之劒釋文云昆吾龍劒河圖曰瀛洲多積石名昆吾可爲劒尸子云昆吾之劒可切玉其龍魚河圖曰流洲在西海中上有昆吾石石爲鐵作劒光明四照周琱戈戈㦸漢書美陽鼎銘賜爾旂鸞黼黻琱戈張敞謂周所以褒賜大臣冬官冶氏爲戈㦸注㦸今三鋒㦸也左傳昭十五年王曰襄之二路鏚鉞秬鬯文公晉受之鏚斧也鉞金鉞也相如賦楚王建干將之雄㦸周鸞刀漢鸞刀詩信南山執其鸞刀以啓其毛取其血膋注刀有鸞者言割中節也䟽鸞即鈴也刀環有鈴其聲中節禮器割刀之用鸞刀之貴反本修古不忘其初也正義割刀今之刀鸞刀古之刀也今刀便利可以割物之用古刀遲緩用之爲難宗廟不用今刀而用古刀修古也公羊注宗廟割切之刀環有和鋒有鸞郊特牲鸞刀之貴貴其義也聲和而後㫁也正義取其鸞鈴之聲宫商調和而後㫁割其肉祭綂君執鸞刀羞嚌夫人薦豆祭義祭之日君牽牲既入廟門麗于碑卿大夫袒而毛牛尚耳鸞刀以刲取膟膋乃退張衡東京賦執鸞刀以袒割奉觴豆於國叟莊子庖丁奏刀騞然合於桑林之舞文選注引六韜書刀銘曰刀利磑磑周赤刀容刀書顧命赤刀大訓在西序注寶刀赤刄削也䟽吳錄有白削然赤刄爲赤削白刄爲白削鄭氏注武王誅紂刀赤爲飾周正色考工記築氏爲削鄭之刀詩瞻彼洛矣鞞琫有珌注容刀鞞也琫上飾珌下飾天子玉琫而珧珌諸侯璗琫而璆珌大夫鐐琫而鏐珌士珕琫而珕珌出三朝禮說文注同箋既受爵命賞賜而加賜容刀有飾顯其能制斷也公劉何以舟之維玉及瑶鞞琫容刀注下曰鞞上曰琫容刀言有武事也正義容飾之刀鞞刀鞘琫鞘之上飾衛風容兮遂兮垂帶悸兮箋容容刀也左傳藻率鞞鞛昭其數也注鞞佩刀削上飾鞛下飾魯寶刀穀梁傳僖元年冬十月壬午公子友帥師敗莒師于麗獲莒拏公子友謂莒拏曰吾二人不相說士卒何罪屏左右而相搏左右曰孟勞孟勞者魯之寶刀也公子友以殺之典論曰周魯寳赤刀孟勞又曰周有雍狐之㦸屈盧之矛狐父之戈管子雍狐之山發而出水金從之蚩尤受而制之以為雍狐之㦸芮戈博物志谿子之弩狐父之戈栁宗元晉問大鹵之金棠谿之工火化水淬器備以充出太白招蓐收召招搖伏蚩尤若雪山氷谷之積觀者膽掉目出寒液天氣盡白日規為小鑠雲破霄跕墜飛鳥吳湛盧劒吳越春秋楚昭王得吳王湛盧之劒於牀召風湖或作胡子而問曰是何劒也曰臣聞吳王得越所獻寶劒三枚一曰魚腸二曰盤郢三曰湛盧今湛盧入楚也越王元左傳史記作允常使歐冶子造劒五枚以示薛燭燭曰湛盧五金之英太陽之精服之有威可以折衝拒敵去無道以就有道故入楚此劒在越之時客有酬其直者有市之鄉三十駿馬千匹萬戸之都二是其一也雖傾城量金珠玉盈河猶不能得此寶越絶書闔閭無道湛盧之劒去之入水行秦過楚秦王求之楚王不與宋志閩中有山名湛疑湛山之鑪鑄劒爲湛鑪也越五劒吳名劒楚三劒吳粤劒吳越春秋越王允常聘區冶子作名劒五枚一曰純鈞一作鈎二曰湛盧三曰豪曹或曰磐郢四曰魚腸一本作魚腹越絶書三曰莫耶四曰豪曹五曰巨闕秦客薛燭善劒取純鈞示之薛燭曰沉沉如芙蓉始生於湖觀其文如列星之行觀其光如水之溢塘觀其文煥煥如氷將釋見日之光王曰客有買之者以有市之鄉三駿馬千匹千戸之都二其可與乎曰不可王造此劒之時赤堇之山破而出錫若耶之溪涸而出銅雨師灑道雷公發鼓一云擊槖蛟龍捧爐天帝燮炭太乙下觀區冶子因天地之精造爲此劒雖傾城量金珠玉滿河猶不可與取湛盧示之曰善哉服此劒可以折衝待敵人君有逆謀則去之允常以湛盧獻吳吳王闔閭請干將鑄作名劒二枚干將吳人與歐冶子同師陽曰干將隂曰莫耶陽作龜文隂作漫理越絶書越王句踐有寶劒五聞於天下有善相劍者曰薛燭王問之王取豪曹巨闕燭曰非寶劒也考工記吳粤之劒吕氏春秋荆茲非得寶劒於於越莊子於越之劒文選張協七命楚之陽劒歐冶所營邪溪之鋌赤山之精乃鍊乃鑠萬辟千灌豐隆奮椎飛亷扇炭注楚王召風胡子問曰吳有干將越有歐冶子願請此二人作劒於是風胡子之吳見歐冶干將使作鐵劒三枚曰龍淵太阿工市越絶書又云二人鑿茨山洩其谿取鐵子虚賦建干將之雄㦸注張揖曰干將韓王劒師也吳都賦純鈞湛盧吳鈎越棘初學記楚有龍泉秦有太阿工市吳有干將鏌邪屬鏤越有純鉤湛盧豪曹魚腸巨闕諸劒鹽鐵論棠谿之鋌淮南子苖山之鋌羊頭之銷越步光劒史記子貢傳越使大夫種言於吳王曰奉先人藏器甲二十領鈇屈盧之矛越紀作勃盧步光之劒以賀軍吏吳王大說越王送子貢金百鎰劒一良矛二子貢不受越絶書越王被棠夷之甲帶步光之劒以見孔子文選七啓注云䁑夷之甲曹子建七啓步光之劒華藻繁縟飾以文犀彫以翠綠綴以驪龍之珠錯以荆山之玉陸斷犀象未足稱雋隨波截鴻水不漸刄秦昭王以三月置酒河曲見金人奉水心之劔曰令君制有西夏乃霸諸侯因此立為曲水史記自序在趙者以傳劒論顯漢斬蛇劒佩刀寶庫劒靈金内府干將寳劒劒寳見寳玉類紀髙祖以亭長爲縣送徒驪山徒多道亡自度比至皆亡到豐西潭中亭上飲皆解縱所送徒曰公等皆去吾亦從此逝矣徒中壯士願從者十餘人高祖被酒夜徑澤中令一人行前行前者還報曰前有大蛇當徑願還高祖醉曰壯士行何畏乃前拔劒斬蛇蛇分爲兩道開行數里醉困卧後人來至蛇所有一老嫗夜哭人問嫗何哭嫗曰人殺吾子人曰嫗子何爲見殺嫗曰吾子白帝子也化爲蛇當道今者赤帝子斬之秦襄公自以居西主少昊之神作四祠祠白帝自獻公時櫟陽雨金以爲瑞作畦畤祠白帝赤帝堯後謂漢也殺之者明漢當代秦也徐寅斬蛇劒賦龍活三尺霆飛半尋磨霜礪雪神母夜號以章赤帝之符爰兹發迹斬蛇奮旅神母告符朱旗廼舉故哭人以嫗爲不誠欲苦之嫗因忽不見後人告高祖高祖乃心獨喜自負諸從者日益畏之高祖爲沛公祠黄帝祭蚩尤於沛庭而釁鼓旗幟皆赤由所殺蛇白帝子所殺者赤帝子也上曰吾以布衣提三尺以取天下非天命乎贊曰斷蛇著符樊酈灌曹攜劒摧鋒從高帝墨菑除害耘鎡海内三輔黄圖太上皇㣲時佩一刀長三尺上有銘字難識傳云殷高宗伐鬼方時所作也太上皇游豐沛山中寓居窮谷有人冶鑄上皇息其旁問曰鑄何器工笑曰爲天子鑄劒謹勿言見王子年拾遺記曰得公佩刀雜治之即成神器可克定天下昴星精爲輔佐木衰火盛此爲異兆上皇解匕首投爐中劒成殺三牲以釁祭之工問何時得此上皇曰秦昭襄王時余行陌上一野人授余云是殷時靈物工即持劒授上皇上皇以賜高祖高祖佩之斬白蛇劍是也及定天下藏於寶庫見白氣如雲出戸外狀如龍蛇吕后改庫曰靈金藏惠帝即位以此庫貯禁兵器名曰靈金内府至晉惠帝元康三年武庫火燒孔子履高祖斬白蛇劒咸見此劒穿屋飛去莫知所向西京雜記漢高祖斬蛇劒以七彩珠九華玉爲飾五色瑠璃爲匣刃上常如霜雪光景照外開囊㧞矟輒有風氣射人刀劒錄劉季以始皇三十四年於南山得一鐵劒長三尺小篆書銘曰赤霄及貴常服之此即斬白蛇劒也續漢書漢西京法駕出則侍中多識者一人負傳國璽操斬蛇劒參乗齊職儀云東漢文選注漢禮儀志曰皇太子即位中黄門以斬蛇寶劒授續志注漢舊儀乘輿帶七尺斬蛇劒古今注高祖爲亭長提三尺劒及貴别得七尺寶劒故儀因言之郊祀志神爵元年爲劒寶立祠未央長楊賦高祖順斗極運天闗提劒而叱之杜篤賦斬白蛇屯黑雲提干將而呵暴秦東京賦紆皇組要干將班固泗水亭銘靈金曜楚火流烏飛漢佩劒晉志漢制自天子至百官無不佩劒其後唯朝帶劒晉世代之以木貴者猶用玉首張敞晉東宫舊事曰太子儀飾有玉頭劒宋志漢制自天子至百官無不佩刀司馬彪志具有其制漢高祖爲泗水亭長拔劒斬白蛇雋不疑云劒者君子武備張衡東京賦云紆黄組腰干將然則自人君至士人又帶劒也自晉代以來始以木劒代刃劒蕭何傳賜帶劒履上殿輿服雜事上公九命則劒履上殿漢儀諸臣帶劒至殿階解劒賈子古者天子二十而冠帶劒諸侯三十大夫四十庻人有事得帶劒無事不得帶劒史記魏相好武皆令諸吏帶劒前奏事春秋繁露劒在左刀在右韍在前冠在首四者人之盛飾也藝文志兵技巧有劒道三十八篇形法有相寶劒刀二十卷漢文帝劒刀劒錄文帝以初元十六年庚午鑄三劒各長三尺三寸銘曰神龜多刻龜形以應大横之兆文帝以韋帶劒兵本無刃漢六劒衛綰傳爲中郎將景帝賜之劒綰曰先帝賜臣劒凡六不敢奉詔上曰劒者人之所施易獨至今乎綰曰具在上使取六劒皆盛在削室之中未嘗服也漢玉具劒櫑具劒駁犀具劒匈奴傳甘露三年正月呼韓邪單于朝賜玉具劒佩刀弓矢注孟康曰摽首鐔衛盡用玉爲之王莽傳進玉具寶劒後匈奴傳永元四年正月北匈奴乞降賜玉具劒羽蓋車一駟又東觀書漢安二年立單于兠樓儲天子臨軒賜玉具刀劒禮儀志皇太子即位中黄門掌兵以玉具隨侯珠斬蛇寶劒授史記有詔擇衛將軍舎人以爲郎令具鞍馬絳衣玉具劒說苑經侯適魏左帶羽玉具劒右帶環佩襄城君帶玉劒雋不疑傳冠進賢冠帶櫑具劒佩環玦謁暴勝之門下欲解劒不疑曰劒者君子武備所以衛身不可解注應劭曰木標首之劒晉灼曰古長劒首以玉作井鹿盧形上刻木作山形如蓮花初生未敷時今大劒木首其狀似此應奉傳注延熹中詔曰以奉昔守南土威名播越賜駁犀方具劒金錯把刀劒革帶各一奉其勉之列傳安帝賜馮石駁犀具劒佩刀紫艾綬玉玦各一漢斬馬劒朱雲傳願賜尚方斬馬劒注師古曰尚方少府屬官作供御器物故有斬馬劒劒利可以斬馬也後匈奴傳建武二十八年匈奴貢馬裘賜斬馬劒一韓延夀傳鑄刀劒鉤鐔放效尚方匈奴傳元帝遣韓昌張猛送呼韓侍子與單于登諾水東山刑白馬單于以徑路刀金留犂橈酒與飲血盟注應劭曰徑路匈奴寶刀也漢鏌邪寶劒揚雄傳校獵賦杖鏌邪而羅者以萬計注師古曰大㦸也選注引說文同西京雜記昭帝時茂陵家人獻寶劍上銘曰直千金壽萬歲陸賈寳劒直百金漢寳劒名馬循吏傳光武長於民間頗達情僞見稼穡艱難百姓疾苦至天下已定務用安靜解王莽之繁宻還漢氏之輕法身衣大練色無重綵耳不聼鄭衛之音手不持珠玉之玩宫房無私愛左右無偏恩建武十三年異國有獻名馬者日行千里又進寳劒價直百金詔以馬駕鼓車劒賜騎士二十六年秋賜南單于寶劒漢光武劒刀劒錄光武未貴時在南陽鄂山中得一劒文曰秀霸小篆書帝服之漢乘輿具劒袐劒馮異傳建武二年春封異陽夏侯赤眉延岑暴亂三輔郡縣大姓各擁兵衆大司徒鄧禹不能定乃以異爲征西將軍代禹討之車駕送至河南賜以乘輿七尺具劒具爲寶玉裝飾之東觀記作玉具劒敕異曰三輔遭王莽更始之亂重以赤眉延岑之酷元元塗炭無所依訴今之征伐非必畧地屠城要在平定安集之耳異頓首受命引而西二十年賜虞延劒延爲陳留督郵彭寵傳朱浮對光武曰前吳漢發兵時大王遺寵以所服劒蔡倫傳爲尚方令永元九年監作祕劒及諸器械莫不精工堅宻爲後世法官志尚方令六百石掌作御刀劒漢賜劒昭紀元鳳五年正月廣陵王來朝賜劒二傳云賜寶劒後傳桓郁永平十五年入授太子經注東觀記曰皇太子賜郁鞍馬刀劒鄧衍永平初賜輿馬衣服劒佩刀東平憲王元和三年章帝幸東平祀憲王賜御劒於陵前肅宗賜召伯春刀劒漢楚龍淵蜀漢文濟南椎成三寶劒韓稜傳稜爲尚書令與僕射郅壽尚書陳寵同時俱以才稱肅宗嘗賜諸尚書劒惟此三人特以寶劒自手署其名曰韓稜楚龍淵汝南西平縣有龍泉水淬刀劒特堅利汝南即楚分野又見龍淵宫注郅壽蜀漢文陳寵濟南椎成椎直追反謝承書漢官儀作鍜成時論著爲之說以稜淵深有謀故得龍淵壽明達有文章故得漢文寵端朴善不見外故得椎成杜篤賦要龍淵首鏌鎁命騰太白親發狼弧遂興復乎大漢史記蘇秦曰韓卒之劒㦸皆出於冥山棠谿墨陽合賻鄧師宛馮龍淵太阿皆陸斷牛馬水截鵠雁戰國䇿合賻作合伯春秋後語作合相索隱天下之寶劒韓爲衆八曰莫邪九曰干將其劒皆出西平縣今有鐵官鹽鐵論云有棠谿之劒淮南子云墨陽莫邪案晉太康地記云汝南西平縣有龍淵水可用淬刀劒故有龍泉水之劒楚之寳劒也又公孫龍爲堅白同異之辨注云云漢棨㦸匈奴傳兼後傳甘露三年賜單于棨㦸十注有衣之㦸建武二十六年秋賜南單于棨㦸韓延壽傳在東郡試騎士建幢棨功曹引車皆駕四馬載棨㦸後輿服志公以下至二千石爲騎吏四人千石以下至三百石縣長二人皆帶劒持棨㦸爲前列揵弓韣九鞬後傳杜詩建武元年爲侍御史安集洛陽時將軍蕭廣放縱兵士暴横詩殺之還以狀聞世祖召見賜以棨㦸復使河東斬逆賊楊異等郭躬永平中秦彭以法斬人躬對曰彭專軍别將漢制棨㦸即爲斧鉞漢雜事曰漢制假棨㦸以代斧鉞古今注曰殳前驅之器也以木爲之後世滋僞無復典刑以赤油韜之謂之油㦸亦曰棨㦸王公以下通用之以前驅漢孑㦸漢鷄鳴㦸晉鷄鳴㦸周禮注夏官司戈盾戈今時句孑㦸疏曰鄭舉漢法以況之漢時見戈有旁出者爲句孑亦名胡孑考工記注冶氏戈今句孑㦸也或謂之鷄鳴或謂之擁頸䟽曰據漢法而言漢時見胡横之句孑㦸云或謂之雞鳴者以其胡似雞鳴故也云或謂之擁頸者以其胡曲方言㦸其曲者謂之鉤孑鏝胡郭璞注曰即今鷄鳴句孑㦸也匈奴傳莽賜單于戯㦸十師古曰有旗之㦸也張敞晉東宫舊事東列崇福門門各羌楯十幡雞鳴㦸十張東方朔位不過執㦸陛㦸殿下王隆漢書解詁曰衛尉宫闕周廬殿掖屯陳交道當兵交㦸張衡東京賦虎㦸交鎩闟㦸轇轕漢輿服志注薛綜曰闟之言函取四㦸函車邊李尤㦸銘秉執操持邪暴是防張協手㦸銘錟錟雄㦸清金鍊鋼名配越棘用過干將嚴鋒勁枝摛鍔耀芒陶侃表獻金鈴大㦸五十張宋大明四年二月乙巳徐州於汴水得白玉㦸以獻漢佩刀乗輿佩刀唐佩刀輿服志佩刀乗輿黄金通身貂錯半鮫魚鱗金漆錯雌黄室五色罽隱室華諸侯王黄金錯環挾半鮫黒室公卿百官皆純黒不半鮫小黄門雌黄室中黄門朱室童子皆虎爪文虎賁黄室虎文其將白虎文皆以白珠鮫爲􅝑口刀鋒之飾乗輿加翡翠山紆嬰其側注蕭何劒履上殿不稱爲刀繁露曰劒之在左青龍象也刀之在右白虎象也東平王謂王尊曰願觀相君佩刀前匈奴傳兼後傳甘露三年正月單于朝甘泉宫賜以佩刀單于以徑路刀撓酒注寶刀建武三十一年遺冠幘絳單衣三襲童子佩刀緄帶各一建武時賜南單于衣服以中常侍惠文冠中黄門童子佩刀列傳虞延建武二十年賜錢及劒帶佩刀馮石爲安帝所寵賜駁犀具劒佩刀紫文綬玉玦各一應奉延熹中賜金錯把刀鄧后紀蜀漢釦器九帶佩刀並不復調東觀記建初中以佩刀書刀錫馬嚴又賜鄧遵金錯把刀佩刀李尤錯佩刀銘佩之有錯抑武揚文晉王祥傳魏徐州刺史吕䖍檄爲别駕䖍有佩刀工相之爲三公可服以與祥祥以授弟覽唐魏徴傳貞觀十三年三月丙子太宗因宴羣臣誕皇孫宴五品以上於東宫謂曰貞觀以前從我以定天下間闗草昧𤣥齡功也貞觀之後納忠諫以正朕失爲國家長利徴而已雖古名臣何以加親解佩刀以賜二人李勣贈屬僚二人佩刀玉帶張說獻佩刀請先决漢蜀刀金馬書刀文翁傳爲蜀郡守遣小吏詣京師受業減省少府用度買刀布蜀物齎計吏以遺博士注如淳曰金馬書刀今賜計吏是也作馬形於刀環内以金鏤之晉灼曰書刀也蜀郡工官作金馬書刀以佩刀形金錯其拊師古曰凡蜀刀有環者也古者用簡牒吏皆以刀筆自隨氏製筆漢兼用書刀謂之刀筆蒙博古圖有漢刀筆楊僕傳武帝以書敕責之曰欲請蜀刀問君賈幾何對曰率數百武庫日出兵而陽不知是五過也注僕爲將請官蜀刀後鄧后紀蜀漢釦器九帶佩刀並不復調揚雄蜀都賦雕鏤釦器百伎千工東觀記建初中以書刀賜馬嚴釋名書刀給書簡札刋削之刀朱博傳投刀削所記蕭何傳注刀所以削書周禮築氏爲削鄭之刀魯之削長尺博寸合六而成規注今之書刀正義古者未有紙筆以削刻字至漢雖有紙筆仍有書刀古之遺法也李尤金馬書刀銘巧冶鍊鋼金馬託形文選七發注引六韜書刀銘曰刀利磑磑魏飛景劒寶劒典論曰建安二十四年二月壬午一作丙午魏太子丕造百辟寶劒長四尺二寸淬以清漳厲以礛䃴青厲石也飾以文玉表以通犀光似流星名曰飛景又曰選兹良金命彼國工精而鍊之至于百辟以爲三劒三刀三匕首因姿定名以銘其拊惜不遇薛燭青萍也三劍一曰飛景長四尺二寸二曰流采長四尺二寸曰文選注典論曰太子丕劒銘流采色似采虹三曰華鋌色似彩虹長四尺二寸三刀一曰靈寶長四尺二寸似靈龜二曰含章采似丹靈長四尺四寸三曰素質長四尺三寸刀身而劒鋏三匕首一曰清剛長二尺三寸色似堅氷二曰揚文長二尺一寸重一斤六兩曜似朝日三曰龍鱗狀似龍文亢倉子蜚景之劒威奪白日氣成紫蜺文士傳楊脩曽以寶劒與魏文帝帝佩之曰此楊脩之劒也文帝紀黄初元年十一月更授匈奴南單于璽綬賜青蓋車乘輿寶劒玉玦魏三刀吳三刀典論魏太子丕造寶刀三曰靈寶含章素質又作露陌刀魏武帝令曰作百辟刀五枚曹植有寶刀賦云建安中造寶刀五枚以龍熊鳥雀爲識踰南越之巨闕超西楚之太阿又有寶劒銘造兹寶刀既礱既礪匪以尚武予身是衛麟角匪觸鸞距匪蹶文帝露陌刀銘於鑠良刀胡鍊亶時譬諸麟角靡所任兹不逢不若永世寶持王粲刀銘曰君子服之式章威靈無曰不虞戒不在明古今注百鍊青犢漏景吳大帝三寶刀也吳六劒古今注吳大帝有寶劒六白蛇紫電辟邪流星青㝠百里刀三百鍊青犢漏影孫權以寶刀賜費禕荅曰刀以討不庭禁暴亂刀劒錄赤烏中有人得韓信劒帝賜周瑜吳都賦家有鶴膝户有犀渠矛楯也佩干將雄㦸耀芒賀齊討林厯山賊募士作鉞戈晉龍泉太阿張華傳初吳之未滅斗牛之間常有紫氣吳平之後紫氣愈明豫章雷煥曰寶劒之精上徹於天華曰有相者言吾年出六十位登三事當得寶劒佩之斯言豈效歟因問在何郡煥曰在豫章豐城即補煥豐城令煥到縣掘獄基入地四尺餘得一石函光氣非常中有雙劒並刻題一曰龍泉二曰太阿其夕斗牛間不復見焉送一劒與華留一自佩華曰詳觀劒文乃干將也莫邪不至見雷次宗豫章記張協太阿劒銘淬以清波歛以越砥如玉斯曜若影在水不運自肅率土同軌又有文身刀銘豐城寳劒賦異金陵之浮王氣同寳鼎之在汾川李斯書曰服太阿之劒越絶書楚王召風胡子之吳見歐冶子干將作劒三一曰龍淵二曰太阿三曰工市相如賦注張揖曰干將韓王劒師也張協七命云霜鍔水凝氷鐔露潔形冠豪曹名珍巨闕形震薛燭光駭風胡價兼三鄉聲貴二都晉班劒晉書㑹稽王給班劒選注引漢官儀曰班劒以虎皮飾之三朝史志班劒本漢朝服帶劒晉以木代之亦曰象劒取裝飾班蘭之義鞘以黄質紫班文金銅飾紫絛帉錔御刀晉宋以來有之黑鞘金花銀飾靶厄晉泰始中武陵太守羅憲入朝賜𤣥玉佩劔晉銅劒束晢傳太康二年汲郡冡中又得銅劒一枚長二尺五寸山海經注汲郡冡中得銅劒一長三尺五寸名干將劒晉名刀劉琨傳元帝以琨爲侍中并賜名刀琨荅曰謹當躬自執備馘截二虜蒲元於斜谷為諸葛亮鑄刀淬以蜀江之水因曰神刀梁韋叡𫝊武帝賜龍環御刀齊銅劒讃書目江淹銅劒讃一卷齊永明初有人得銅劒淹序而讃之類聚梁簡文謝敕賚方諸劒善勝刀梁神劒刀劒錄梁武帝命陶𢎞景造神劒十三以象閏月陶𢎞景傳大通中𢎞景獻二刀於武帝一名善勝一名威勝並佳寳梁有方諸劒善勝威勝刀水經注梁國多池沼時池中出神劒到今其民像而作之號大梁氏之劒紀天監五年四月丙申廬陵高昌之仁山獲銅劒二沈約有爲東宫謝賜孟嘗君劒啓赫連百鍊為龍雀大鐶號曰大夏龍雀銘其背曰古之利器吳楚湛盧大夏龍雀名冠神都可以懷逺可以柔逋如風靡草威服九區北史齊綦母懐文造宿鐵刀今襄國冶家所鑄宿柔鋌是其遺法唐班劒太宗紀武德四年加號天策上將賜衮冕金輅雙璧黄金六千斤前後鼓吹九部之樂班劒四十人儀衛志大駕鹵簿左右衛將軍二人分左右領班劒儀刀各一人唐寶劒臨軒授鉞李愬傳帥魏博長慶元年六月以玉帶寶劒遺牛元翼曰此劒吾先人以揃大盜吾又以平蔡姦武后時郭元振上寶劒篇官志兵部尚書凡將出征告廟授斧鉞實錄興元元年四月辛丑朔臨軒授副元帥渾瑊節鉞𫝊曰帝臨軒授鉞用漢拜韓信故事制曰冦賊干紀授爾節鉞以戡多難往欽哉唐鈒㦸䂍矟志大駕鹵簿諸衛各督其隊與鈒㦸以次入陳殿庭次持鈒前隊次後持鈒隊自鈒㦸以下執者服如黄麾仗宋朝志鈒㦸無掌有小横木鈒挿也本挿車旁小㦸同史記秦趙良曰持矛而操闟㦸者旁車而趨索隱曰亦作鈒開元禮義鑑金吾將軍執䂍矟騎捧也以黄金塗末執以扈蹕義羅曰犦擊聲也形如劒而三刃連柄及鋒長三尺五寸以虎豹皮爲袋其制起秦漢李綽輦下歲時記曰御殿御樓金吾犦矟前引爾雅云犦牛犎牛也抵觸百獸無敢當者仗内有䂍矟庫刻犦牛首於上如龍虎節之狀碧油籠之宋景祐五年重制如李綽之說以銅爲鐏今八矟安于朝堂行禮以前導其夾大將軍者亦名衛司犦矟從矛者字書不載開元開寶禮作犦㑹要開元十三年四月二十一日敕四軍搶矟左飛騎用綠紛右飛騎緋紛左萬騎紅紛右萬騎碧紛宋沈攸之傳有仇池步矟魏于栗磾持黑矟尉遲敬德從擊世充獲排矟兵六千程知節善馬矟唐門㦸官志武器署凡㦸廟社宫殿之門二十有四東宫之門一十有八一品之門十有六二品及京兆河南太原尹大都督大都護之門十有四三品及上中都督上都護上州之門十有二下都督下都䕶中下州之門各十崔琳與弟珪瑶俱列棨㦸號三㦸崔家張儉弟兄三人五㦸號三㦸張家李峴兄弟門列三㦸尹思貞坎地獲古㦸十二俄而門植㦸李愿父子皆賜㦸韋綬爲山南帥請門㦸十二以行張介然願列㦸故里𤣥宗許之别賜㦸京師第門盧坦傳自貞元以來立㦸十八家不應令並追正之元和六年十二月甲申收元義方盧坦㦸令所司准舊制官階勲至三品然後請宋朝開寶四年七月戊戌賜皇弟開封尹門㦸十四枝慶厯元年十一月丙寅詔功臣不限品數賜私門立㦸張方平建白唐鐵㦸銘李齊物傳天寳元年爲陜州刺史開厎柱通漕路發重石下得古鐵㦸若鏵然銘曰平陸上之詔以名縣志云得古刃有篆文曰平陸更河北縣名平陸魏典韋好持雙㦸長刀軍中語曰持一雙㦸八十斤唐儀鍠儀刀陌刀儀衛志黄麾仗第二行儀鍠五色幡大駕鹵簿儀刀仗銀裝金銅裝皇太子鹵簿儀鋋眊六人儀鍠五色幡六人親王儀鋋二儀鍠六儀矟十一品儀刀十六宋朝志儀鍠鉞屬秦漢有之唐用爲儀仗刻木如斧柄以黄上綴小錦幡五色帶六典武庫令刀之制有四儀刀古班劒之類宋晉以來謂之御刀後魏曰長刀皆施龍鳯環隋謂之儀刀裝以金銀羽儀所執鄣刀以彰身横刀佩刀也陌刀長刀蓋古之斬馬劒龍魏文帝有露陌刀銘一曰鱗高仙芝討勃律李嗣業田珍爲左右陌刀將廣平王收長安統前軍嗣業袒持長刀大呼陣復整步卒二千以陌刀長柯斧堵進所向無前王茂元討劉稹李德􅁉詔王宰合兵援之以河隂所貯兵械内庫甲兵弓矢陌刀賜之王及善除右千牛將軍帝曰爾佩大横刀在朕側唐金削刀徐齊􅆅傳八歲能文太宗召試賜所佩金削刀削音先召反刀劒室也舉𢎞文生調曹王府參軍高宗時爲崇文學士侍皇太子講修書于芳林門終西臺舎人張說作碑云賜以佩刀金鞘稱曰神童漢書質氏洒削唐寶鈿刀寶刀阿史社爾傳貞觀十四年十二月爲交河道行軍總管平高昌諸將咸受賞社爾以未受詔秋毫不敢取見别詔然後受所取皆老暗陳弊太宗美其廉賜高昌寶鈿刀太宗賜薛延陀精刀賜回紇寶刀高宗賜泉男生乘輿馬瑞錦寶刀官志千牛備身掌執御刀房𤣥齡曰突厥弛辮握刀分典禁衛劉敞古器圖一刀以金錯其背曰貞觀十六年并州都督府造又有大夏龍雀刀赫連勃勃造百鍊鋼刀爲龍雀大環銘其背唐鸞刀禮志省牲器官志太官署帥宰人以鸞刀割牲唐欎刃鐸鞘浪劒南詔傳德宗遣袁滋冊異牟尋遣清平官尹輔酋等七人謝天子獻鐸鞘狀如殘刃有孔傍達出麗水飾以金所擊無不洞夷人尤寳月以血祭之浪劒欎刃欎刃鑄時以毒藥并冶取迎躍如星者十年乃成淬以馬血以金犀飾鐔首傷人即死浪人所鑄故亦名浪劒王所佩者傳七世矣㑹要云樂浪人劒舊紀貞元十年九月辛卯南詔獻鐸槊浪人劒吐蕃印八紐太平興國金錯刀興國二年二月癸巳吳越國王貢黄金錯刀四銀錯刀二十修時貢也景德御劒景德二年正月丙寅遣内殿崇班楊保用往河北諸州取所頒御劍先是給諸路令得便宜行事仁宗出御劒二授陜西總管夏守贇知延州范雍戒以臨陣用之祥符金錯契刀祥符三年十一月甲午陳堯叟等言脽上得金錯契刀永安五男錢王莽造錯刀以金錯其文皇祐鸞刀見鼎類及御書類皇祐中阮逸胡瑗等制鸞刀二鸞在鋒聲中宫商三和在環聲中角徵用周禮桃氏爲刃刃齊三分其金而錫居一圜丘以銅爲之宗廟以銅而飾以黄金自是祭祀之用始備劉敞銘曰天子之孝袒而親割四方以效天子之威和而后斷四方以隨執而勿失用而勿缺萬世以不竭禮志皇祐五年閏月制三鼎鸞刀刀有鋒鋭加鸞以銅為之聲中宫商用鈴二鈴在環中角徵羽用鈴三郊以黑漆柄廟以金裝各一熈寧賜斬馬刀熈寧五年作坊造斬馬刀刀長三尺餘鐔長尺餘首爲大環上出以示蔡挺挺奏制作精巧便於操擊戰陳之利器也五月庚辰朔命置局造數萬口分賜邉臣紹興寶劒紹興六年二月四日右相都督張浚言御前降西蕃寳劒十二内庫細甲二十良弓五十給賜有功將士請分賜以爲激勸乾道雁翎刀乾道元年十一月二日命軍器所造雁翎刀以三千柄爲一料蓮影如植龜文若游雄稜霜利銷白虹以影碎耀青蛇而色秋風伯吹盧雲師鍊冶鐵燄朝流金精夜下價直十城名高千馬水文千曲蛇鱗百層燕砥歛刃蜀水開鋒召風胡邀歐冶鱗鋏星鐔步光之妙櫑具之華含景吐商虹蔚波映龜文龍藻清水淬鋒越砥歛鍔七彩九華之飾龜文龍藻之麗陽紋隂縵之竒紫電白虹之異鎧甲易離爲甲胄釋名甲以物有孚甲以自禦亦曰介曰函曰鎧皆堅重之名廣雅曰函甲介鎧管子曰葛盧之山發而出水金從之蚩尤受而制之以爲劒鎧此其始也又世本云輿作甲輿少康子也說文首鎧謂之兠鍪亦曰胄臂鎧謂之釬頸鎧謂之錏鍜周犀甲兕甲合甲闕鞏甲夏官司甲下大夫二人中士八人闕注甲今之鎧也司甲之官列於五兵之首其用博矣䟽古用皮謂之甲今用金謂之鎧考工記燕無函非無函也燕近强胡習作甲胄函人爲甲犀甲七屬兕甲六屬合甲五屬注削革裹肉但取其表合以爲甲屬謂上旅下旅札續之數革堅者札長又支久犀甲壽百年兕甲壽二百年合甲壽三百年凡爲甲必先爲容然後制革權其上旅下旅而重若一以長爲之圍凡甲鍜不摯則不堅已敞則撓左傳昭十五年闕鞏之甲說文作闕鞏武所以克商也唐叔受之以處參墟注闕鞏所出鎧荀子武王定三革偃五兵注三革犀虎牛也魯貝胄齊犀甲鞼盾吳犀渠費誓善􅰴乃甲胄敿乃干備乃弓矢鍜乃戈矛礪乃鋒刃魯頌公車千乘朱英綠縢二矛重弓公徒三萬貝胄朱綅烝徒増増胄以貝爲飾赤綫連綴甲齊語管子制重罪贖以犀甲一㦸輕罪贖以鞼盾一㦸桓公定三革隱五刃韋昭注三革甲胄楯五刃刀劒矛㦸矢左傳齊甲士三千人吳語奉文犀之渠楯也膝吳都賦扈帶鮫函扶揄屬鏤家有鶴戸有犀渠吳鉤越棘純鈞湛盧戎車盈於石城戈船掩乎江淮越語夫差衣水犀之甲者億有三千越絶書曰越王被暘夷之甲拔勃盧之矛吳越春秋越王被唐夷之甲帶步光之劒杖屈盧之矛以三百人爲陣晉語唐叔射兕于徒林殪以爲大甲左傳宋城者謳牛犀兕丹漆楚子重伐吳組甲三百被練三千注漆甲成組文被練練袍晉公介文公駟介趙旃甲裳鄭詩駟介彭彭荀子楚人鮫革犀兕以爲甲鞈如金石禮論寢兕持虎所以養威也魏氏武卒衣三屬之甲鹽鐵論强楚勁鄭有犀兕之甲犀軸兕甲韓非子趙簡子圍衛犀楯犀櫓立於矢石之所及宋樂祁獻楊楯於趙簡子漢鞮鞪𤣥甲韓延壽傳騎士被甲鞮鍪注即兠鍪也鞮一奚鍪莫侯反霍去病傳發屬國𤣥甲軍甲黒色尹賞傳被鎧扞注鎧甲扞臂衣燕然銘𤣥甲耀日李尤鎧銘甲鎧之施扞禦鋒矢尚其堅剛或有犀兕好徳者寧好戰者危専智恃力君子不為書正義經典皆言甲冑秦已來始有鎧兠鍪之名古之作甲用皮秦漢以來用鐵魏明光鎧吳厯魏文帝與吳王明光鎧又孫權傳曹植表曰先帝賜臣鎧黑光明光各一具兩當鎧一領琰鏁鎧一領馬鎧一領今世昇平兵革無事乞悉付鎧曹魏都賦介胄重襲旌旗躍莖弓珧解檠矛鋋飄英三屬之甲縵胡之纓雲撤叛渙席卷䖍劉洗兵海島刷馬江洲蕭斧戢柯以匣刃虹旗攝麾以就卷宋王𤣥謨鎮江州明帝賜以諸葛亮筩袖鎧殷孝祖為兖州朝廷御仗有諸葛亮筩袖鎧鐵㡌二十五弩射之不能入上以賜孝祖北史蔡祐著明光鐵鎧晉犀甲馬隆傳討西羌夾道累磁石賊負鐵鎧行不得前隆卒悉被犀甲無留礙賊以爲神著牛皮鎧兵一云馬隆函犀七屬浴鐵千羣晉重鎧浴鐵桓伊有馬步鎧六百上之廋翼與燕王書致襦鎧隋栁沈甲張奫傳擊賊有功文帝賜綠沈甲獸文具裝後周文帝以所着鐵甲賜田𢎞保定元年四月丁酉白蘭獻犀甲鐵鎧九月甲辰南寧州獻滇馬蜀鎧隋太子飾蜀鎧帝不恱唐金甲太宗紀武德四年執竇建德降王世充六月凱旋一云七月甲子太宗被金甲陳鐵騎一萬介士三萬前後鼔吹獻俘太廟實錄貞觀十九年五月丁丑營于馬首山初太宗遣使於百濟取金漆塗鐵甲色邁兼金又以五采染𤣥金製爲山文甲甲申太宗親率甲騎萬餘金光曜日與李勣㑹遼東城下旌旗數百里張長遜以兵㑹討薛舉賜錦袍金甲杜甫詩有金鎖甲綠沈槍綠沈精鐵其鎖子甲甲之精細者言相銜之宻苻堅使熊邈造金銀細鎧金為綫以縲之蔡琰詩曰金甲耀日光唐金甲雕斧明光鎧金髹鎧山文鎧犀甲舊紀貞觀十二年十月己亥百濟貢金甲雕斧百濟傳武德四年獻果下馬後五年獻明光鎧貞觀中上鐵甲雕斧帝優勞之賜帛高麗傳帝度遼水時百濟上金髹鎧又以𤣥金爲山五文鎧士被以從帝與李勣㑹甲光炫日六典武庫令甲之制十有三曰明光甲光要甲細鱗甲山文甲烏鎚甲白布甲皁絹甲布背甲步兵甲皮甲木甲鎻子甲馬甲元和九年七月甲戌命淮浙江西荆南造甲以進列傳薛仁貴討九姓將行高宗宴内殿曰古善射穿七札卿試五甲射焉仁貴一發洞貫馬燧節度河東造鎧必長短三制稱士所衣以便進趨李德裕節度西川請甲人於安定弓人河東弩人浙西蜀兵器皆犀銳中人謬言楊弁十五里明光甲云云王鍔戈鎧犀宻馬曉大理卿有犀鎧懼而瘞之奴告藏其甲按之無他李元諒裹𦋺爲鎧剡蒿爲矢吕元膺守東都故事賜旗甲至元膺不給曹華爲襄城戍將憲宗初至詔京師賜矛甲繒錦徐商襞紙爲鎧勁矢不能洞郭子儀家傳上賜公犀甲一又賜其將明光甲柳宗元平淮夷雅犀甲熊旂威命是荷孫樵作潼闗甲銘祥符鎖子甲祥符中與馬知節議邊防命制鋼鐵鎖子甲賜之康定元年詔諸軍各與鎧甲十馬甲五皇祐元年四月御崇政殿閱宋守信所獻黒漆順水山字鐵甲至道二年二月戊戌詔先是造明光細網甲無裏宜以紬裹之俾擐者不磨傷肌體建炎明舉甲建炎三年六月六日江東漕臣宗諤奏造明舉甲三千十月二十八日輔臣奏明舉甲每副工費凡八十緡有奇上曰朕召張浚辛企宗示之曰分毫以上皆民力也若棄一葉之甲是棄生民方寸之膚四年十二月二十一日以御前新樣斧一付軍器所製之紹興元年九月十四日造甲五千七年五月二十日以御前所造鞍宣示張浚三年三月甲戌賜韓世忠軍士甲千副紹興犀甲六年十月楊沂中破劉猊於藕塘時張浚在采石十一月庚午賜手書遣内侍賜浚端石研筆墨刀劒犀甲且召浚還勞之曰却敵卿之功也雜兵器易萃之象曰君子以除戎器戒不虞除者治也人既聚㑹不可不防故於此時修治戎器以備戒不虞舜干戚書舞干羽于兩階七旬有苗格淮南子齊俗訓有苗不服舜修政偃兵執干戚而舞明堂位疏赤盾而玉飾斧史記黄帝習用干戈征不享書説命惟干戈省厥躬牧誓稱戈比干詩公劉干戈戚􅀭時邁載戢干戈易説卦離為戈兵湯鉞史記殷紀湯自把鉞以伐昆吾遂伐桀司馬法殷執白戉周武王天鉞黄鉞牧誓武王左杖黄鉞右秉白旄以麾注鉞以黄金飾斧後漢志注引說文周杖黄鉞太公六韜武王軍中有大柯斧刃廣八寸重八斤名爲天鉞牧誓正義引之即今之大鉞也司馬法曰夏執𤣥戉殷執白戉周左杖黄戉右秉白旄說文云戉俗作鉞非是執後輿服志注司馬法曰殷白鉞云云吕氏春秋武王左釋白羽右釋黄鉞勉而自爲係輿服志鉞黄帝所造湯伐昆吾躬把大鉞武王入商周公把大鉞畢公把小鉞六典注石氏星經曰天鉞一星在井旁周五兵五盾七兵夏官司兵中士四人掌五兵五盾辨其物與其等以待軍事司右用勇力之士能用五兵者屬焉軍事建車之五兵㑹同亦如之注五盾干櫓之屬盾有大小其名未盡聞鄭司農云五兵戈殳㦸酋矛夷矛正義曰有朱干中干及櫓聞其三者其二者未聞注車之五兵司農所云是也司農云步卒五兵則無夷矛而有弓矢司戈盾下士二人掌戈盾之物而頒之祭祀授旅賁殳故士戈盾旅賁氏執戈盾子齊侯以二干戈逆釗授舞者兵亦如之軍旅㑹同授貳車戈盾建乘車之戈盾授旅賁及虎士戈盾及舎設藩盾行則斂之師古注司馬法曰弓矢圍殳矛守戈㦸助凡五兵長以衛短短以救長注藩盾可以藩衛者如今扶蘇月令季秋習五戎注弓矢殳矛戈㦸榖梁傳五兵注矛㦸鉞楯弓矢詩正義干伐皆盾别名書正義鄭𤣥云惠狀蓋斜刃宜芟刈戈即今之句孑㦸劉蓋今鑱斧鉞大斧戣瞿蓋今三鋒矛銳矛屬凡此七兵或施矜或著柄周禮戈長六尺六寸其餘未聞長短之數周酋矛夷矛車㦸考工記秦無廬非無廬也廬人爲廬器注謂矛㦸柄竹攢柲秦多細木善作矜柲戈柲六尺有六寸殳長尋有四尺車㦸常酋矛常有四尺夷矛三尋酋夷長短名酋遒也酋近夷長凡兵無過三其身攻國之兵欲短守國之兵欲長大戴禮武王爲矛銘左傳使鍼御持矛衛太子爲右備持矛冉有用矛於齊師周建櫜樂記武王克商散馬牛車甲衅而藏之府庫而弗復用倒載干戈包之以虎皮將帥之士使爲諸侯名之曰建櫜然後天下知武王之不復用兵也注建讀爲鍵兵甲之衣曰櫜鍵櫜言閉藏兵甲也詩曰載櫜弓矢春秋傳曰垂櫜而入詩小戎虎韔疏曰弓有虎皮之韜漢張良傳偃革爲軒馬融傳命師於建櫜偃伯於靈臺止戈爲武周黄戚又見彤弓周書世俘云籥人造王秉黄戚正國伯克殷云周公把大鉞原公把小鉞以夾王典引乘其命賜彤弧黄戚之威周兵器天官玉府掌王玩好兵器内府掌良兵良器待邦之大用地官小司徒大比攷兵器鄉師四時之田簡兵器縣師備兵器詩宣王備器械左傳楚蔿掩數甲兵齊社蒐軍實周軍實凡要夏官大司馬中夏教茇舎羣吏撰車徒讀書契注讀書契以簿書校錄軍實之凡要䟽謂兵士簿書之要契小宰八成云師田以簡稽一也凡軍有三種或以俘凶爲軍實或以戈盾弓矢爲軍實或以禽牲爲軍實此據兵器凡要即名籍之總名掌固設其飾器注兵甲之屬今城郭門之器亦然疏漢時城郭門守器所飾亦若今城郭門傍所執矛㦸皆有幡飾之等是也魯越棘見弓矢類魯朱干玉戚見樂舞類秦龍盾詩小戎美襄公也備兵甲以討西戎國人矜其車甲小戎俴收五楘梁輈游環脅驅隂靷鋈續文茵暢轂駕我騏􅑓龍盾之合注畫龍爲盾䟽云以木爲之鋈以觼軜俴駟孔羣厹矛鋈錞厹三隅矛也以白金爲錞錞鐏也蒙伐有苑伐中千畫雜鳥之羽虎韔鏤膺交韔二弓竹閉緄縢虎虎皮韔弓室也膺馬帶也交韔交二弓於韔中無衣王于興師脩我戈矛漢五兵官表羽林孤兒教以五兵注師古曰弓矢殳矛戈㦸吾丘壽王傳對曰古者作五兵非以相害以禁暴討邪也安居則以制猛獸而備非常有事則以設守衛而施行陣注師古曰五兵矛㦸弓劒戈漢髙紀注師古曰銜枚者止言語讙囂欲令敵人不知其來也周官有銜枚氏枚狀如箸横銜之繣絜於項漢刁斗李廣傳廣不擊刁斗自衛程不識擊刁斗注孟康魏時人曰以銅作鐎受一斗晝炊飯食夜擊持行今在滎陽庫中蘇林曰形如鋗無緣師古曰鋗即銚也西域傳杜欽論遣使罽賓曰斥候士三百餘人五分夜擊刁斗自守漢舊儀曰畫漏盡夜起宫中衛宫城門擊刁斗周廬擊木柝顔延年謂爲金柝漢名臣奏曰丞相韓宣奏漢興已來深考古義宫殿省寺至五六里周衛擊刁斗纂文曰刁斗持時鈴也博古圖有漢熊足鐎斗梁山鋗龍首鐎斗斗可以温者詩酌以大斗氷斗宋何承天識威斗漢渠答晁錯傳上言兵事曰中國之長技五復言守邊備塞曰選常居者家室田作且以備之以便爲之髙城深塹具藺石布渠荅注服䖍曰藺石可投人石也蘇林曰渠答鐵蒺藜也如淳曰藺石城上雷石也墨子曰城上二步一渠立程長三尺冠長十尺臂長六尺二步一荅荅廣九尺袤十二尺漢大將軍鉞黄鉞終軍傳上對曰大將軍秉鉞單于犇幕後傳光武賜侯霸璽書曰黄鉞一下以黄金飾斧也橋𤣥傳四府舉爲度遼將軍假黄鉞東京賦載金鉦而建黄鉞注蔡邕獨斷曰乘輿後有金鉦黄鉞蔡邕有黄鉞銘蜀建興三年春諸葛亮南征賜金鈇鉞一具見亮集魏辛毗杖黄鉞當軍門立晉安平王孚王導爲大司馬皆假黄鉞謝安太保進加黄鉞漢武庫兵器毋將隆傳奏武庫兵器天子公用國家武備繕治造作皆度大司農錢西京賦武庫禁兵設在蘭錡燕王旦傳曰明詔領庫兵飭武備平紀什器儲偫注師古曰軍法五人爲伍二伍爲什共其器物故通謂生生之具爲什器亦猶今之從軍及作役者十人爲火共畜調度也嚴安傳鍜甲摩劍矯箭控􅁌韓延壽傳被甲鞮鞪尹賞傳被鎧扞扞臂衣魏銀鞍曹植上銀鞍表曰武帝代勅此銀鞍一具初不敢乘謹奉上魏百官名曰紫茸題頭髙橋鞍一具西京雜記武帝時身毒國獻白光琉璃鞍後漢李尤鞍銘又轡銘曰轡銜在手急緩必時賞罰在心中和是思又有馬箠銘魏文帝馬腦勒賦傅𤣥馬射賦百馬齊興六驥孔閑金銜玉羈文防鏤鞍明珂景服華𤭔采鮮宋劉義恭有謝金梁鞍啓晉金華楯陶公故事臣侃奉獻金華大羌楯五十幡青綾金革楯五十幡楊泉物理論古有阮師之刀蘇家之瞂皆爲良工利器元魏以馬頭楯破蠕蠕宋銀棨宋禮志皇太子夜開諸門墨令銀字棨傳令信唐兵器名數官志衛尉卿總武庫武器守宫三署兵器入者皆籍其名數詳見武庫丞辨器械出納之數武庫署藏兵械武器署掌外戎器庫部掌戎器元日冬至陳設祠祀辨其名數而供焉凡戎器色别而異處掌武庫器仗六典武庫名數軍鼓三金四弓四弩七箭四刀四槍四甲十三彭排六旗三十二袍五器用八元和九年三月乙亥賜振武軍弓甲八月丙子以戎械賜宥州十年十二月以軍器給徐州唐金鉞㑹要天寶元年正月一日敕黄鉞古以金飾應五行之數宜改爲金鉞威武之義也開寶弓弩院太祖初即位以魏丕爲作坊副使八年乃遷正使魏丕脩創戎器無不精勁開寶九年三月己巳領代州刺史仍典其職兵器十日一進課之旬課上親閱之列五庫以貯焉九月分作坊爲南北歲造甲鎧具裝鎗劒刀鋸器械及床子弩等凡三萬二千舊床子弩射止七百步丕増至千步是歲又置弓弩院舊在太平坊今徙宣化坊歲造弓弩箭鏃等凡千六百五十餘萬又有南北造箭二庫在興國坊景太平興國三年九月十六日幸造箭院德三年三月十八日幸軍器内弓箭庫咸平六年合爲造箭院𨽻弓弩院天禧四年四月詔南作坊之西偏爲弓弩造箭院諸州有作院歲造弓弩箭劒甲胄箭鏃等凡六百二十餘萬又别造諸兵幕甲袋鉦鼓鍋鍬鏁斧等謂之什器凡諸器械列五庫以貯之戎具精勁近古未有景德四年十月以歲造之器可支三十年還秦翰閱武庫所聚權罷繕治舊制軍器領於三司胄案減天聖四年十一月乙丑以武庫山積詔諸州歲造兵器之半熙寧六年六月二十七日始置監七月甲寅置内弓箭内庫又有軍器所元豐八年十月己卯罷製軍器廣西吳彦方製利器械四以式來上則至和三年之三月戎監定中外所獻槍刀及弓式以新造兵器付諸路作院爲式遣官分諭則熙寧七年之正月十三日編修九軍兵仗以河東經畧同提舉元豐元年十一月十五日也命編修軍器法制所以什物精緻者修爲法式尹抃造挿弰弓及閻守慇所定摹則詳宻不復用舊法五年八月二十四日也渭州置平戎器甲庫政和五年十二月也輟禁宇以繕武庫灑宸翰而製庫名七年二月也請置軍器提舉官四員而詔屬之諸路提刑建炎三年三月三日也以御甲一副頭牟等共五件命軍器所依式製之乾道六年閏五月二日也建炎三年八月一日詔諸州歲課上供軍器並輸於内軍器四庫紹興五年三月戊午軍器所始𨽻工部後復以中人典領三十年七月庚子詔工部依條檢察慶厯神楯見龍虎八陣圖左𫝊狄虒彌建大車之輪䝉之以甲以為櫓櫓是大盾漢李尤楯銘曰吳旂魯𤭔方言曰自關而東或謂𤭔或謂干關西謂之楯元豐兵器圖元豐二年内侍押班王中正受詔閱在京馬步軍中正悉以製弓弩兵器及馬步射擊刺施用法上之既試咸可用遂圖其像步射執弓發矢連手舉足移步及馬射馬上使蕃槍馬上野戰格闘步用摽排皆有法凡數千言九月壬辰請頒於諸軍使誦習之天聖六年九月乙巳遣使修諸路兵械詔器甲久不繕治遣使閱視郭諮以所作刻漏圓楯獨轅弩生皮甲來上帝頗嘉其簡要慶厯二年詔鄜延環慶涇原秦鳯路各置都作院五年詔諸路所儲兵械悉報三司三司歲具須知以聞仍約爲程式頒之五年十一月甲午詔諸路進甲仗須知一本命三司簡爲程式頒之七年七月十八日賈昌期請遣官詣北京兵器毋輒改法式嘉祐四年七月庚申詔京師所製軍器多不犀利其選朝臣武臣各一員揀試之天聖四年詔作坊造錐槍景祐四年造拴子槍弧槍康定元年四月詔江南淮南造紙甲三萬給陜西皇祐五年荆南鈐轄王遂上臨陣槍淳熙軍器榘模淳熙六年六月二十七日吏部侍郎閻蒼舒言蜀書最多皆邊防利害修城制度軍器法式專司法令瀘州有軍器榘模一書最詳備請下秘省録書目送制置司參對四川官書目抄冩送省從之魏陳琳武庫一作軍賦其刃則楚金越冶棠谿名工清堅皓鍔脩刺鋭鋒陸陷蕋犀水截輕鴻鎧則東胡闕鞏百鍊精剛函師振旅韋人制縫𤣥羽縹甲灼爚流光弩則幽都筋骨常山檿幹弓則烏號越棘繁弱角端象弭綉質哲拊文身矢則申息肅愼箘簵空流焦銅毒鐵簳鏃鳴鍭麗轂撻輈馬則飛雲絶景直鬐騧駵駁龍紫鹿文的瞷魚魯公子偃蒙臯比先犯宋師晉胥臣蒙虎皮先犯陳蔡資斧易得其資斧資利也鏚秘左傳注斧柄挺鈹吳語扶胥六韜一名行馬棘矜過秦論棘㦸也矜矛鋋之地虎路校獵賦槍雷周禮注䟽云守城禦捍之具㷭㸂史記兠零光武紀䗦燧注鉤援詩鉤梯也引上城者終葵廣成頌斧名翔旝唐褚遂良傳翔旝雲輣注機石也㕹芮史記扶㕹芮飛橋六韜轒輼孫子修櫓轒輼柴離說文徐􅉗曰竪散木爲區落彤珠潘安仁誄注謂冶鉄以灌敵雲梁南詔傳雲梁鵞車渠􅓘荀子攻城之車鉅䥫禮書宛乏鉅鐵鑽如蠭蠆梯衝後公孫瓉傳太公曰必勝之道器械爲寶六韜有軍用一篇漢志兵之技巧十有三家習手足使器械機闗以立攻守之勝古者弧矢之利以威天下其用上矣後世燿金爲刃割革爲甲器械甚備越絶書風胡子曰神農以石爲兵黄帝以玉爲兵禹以銅鐵爲兵玩易之萃知戎器之除誦詩車攻知器械之備萃之象曰除戎器戒不虞泰之九二曰包荒用馮河泰萃之世聖人謹於武備如此干戈不徒興省躬而已弓矢不妄發正已而已德實威本威乃德輔器械之備詩人歌周工巧之精史氏美漢開鶴列之陣靡魚須之旃蛟分承影雁落忘歸雨矢逐天狼電矛驅海若氂旄犀札翻霓塞野劒㧞青鱗􅁌挿赤羽渠門之旂宻須之鼓鐵馬蛇矛大黄白羽天山瀚海噴薄風雨􅁌木六鈞函犀七屬軍總四校兵兼七營運長擊短後實先聲増壘威敵減竈潜兵大弧射法太乙營圖朝兵減竈夜營多鼓秋草將腓寒膠欲析赤羽照日烏號滿月旌旗電舒戈矛林植彤珠星流飛矢雨集被縵胡揮孟勞魚甲烟聚貝胄星羅列缺掉幟招揺耀鋩𤣥甲耀日朱旗絳天暢轂文茵鉤膺鞗革粤金妢笴兊戈和弓象弭鷲羽挾輈曳牛之侣㧞距桀石之夫斬蛟擊兕之士天陣齊舉雲罝備設揮戈電飛激箭飈疾禡蚩尤誓鈎陳黄石兵符白猿劒術飾甲底兵奮士盛師發黄間揮白羽靜如磐石動如飄風合組齧厀鉤膺綺鈴駟秀騏之駮駿載軨獵之輶車羽旄肅紛弧貫月影劒動星􅉭虎牙鷹揚之臣蛇矛犀渠之羣横行而東我伐用張月陣聯雲星旄鬬日𢌞五翎而革面控三庭而詘膝五將獲野萬靈並轂接衝拔距鷹瞵鶚視六軍齊軌五輅舒斾丹楹發照素甲生波樓煩白羽投鞍成岳漁陽墨騎浴鐵爲羣八鑾揺響五牛舒斾千乘雷動萬舳雲囬直而壯律而臧有不戰戰必勝矣玉海卷一百五十一
