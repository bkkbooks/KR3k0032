body:
  text: 玉海卷九十三明王應麟撰郊祀郊祀下恭謝附魏景初洛陽圓丘晉禮志魏景初元年十月乙卯始營洛陽南委粟山為圓丘以始祖帝舜配方丘以舜妃配天郊所祭則皇天之神以太祖配地郊所祭曰皇地之祇以武宣后配宗祀文帝於明堂以配上帝十二月壬子冬至始祀皇皇帝天于圓丘以始祖虞舜配房爼生魚陶樽𤣥酒晉顧和曰魏承後漢正月祭天以地配隋志郊丘議三卷魏太尉蔣濟撰禮類唐志魏氏郊丘三卷儀注類元魏太和十九年十一月庚午如委粟山定圓丘晉二郊志武帝初受禪設壇場于南郊柴燎告類未有祖配泰始二年正月詔曰有司前奏郊祀權用魏禮衆議紛互遂不時定羣臣議五帝即天也王氣時異故殊其號雖名有五其實一神明堂南郊宜除五帝之坐五郊改五精之號皆同稱昊天上帝各設一坐地郊又除先后配祀帝悉從之二月丁丑郊祀宣帝以配天宗祀文帝於明堂以配上帝是年十一月紀十一月己卯有司又議奏古者丘郊不異宜并圓丘方丘於南北郊更修立壇兆其二至之祀合於二郊帝從之一如宣帝所用王肅議也王肅作聖證論言郊則圓丘圓丘即郊天體唯一安得有六天泰始之初定南北郊祭一地一天用肅之議武帝肅之外孫也是月庚寅冬至帝親祠圓丘於南郊自是後圓丘方澤不別立太康三年正月帝親郊祀皇太子皇弟皇子悉侍祠侍祠非前典也十年十月詔曰四望非地則明堂上帝不得為天也往者衆議除明堂五帝位云云其復明堂及南郊五帝位元帝太興二年始議立郊祀儀用司徒荀組議立南郊於建康城之已地其制度皆太常賀循所定多依漢及晉初儀注宋志元年始更立郊兆三月辛卯帝親郊祀饗配之禮一依武帝始郊故事江左不立明堂是時尚未立北壇地祇衆神共在天郊郭璞南都賦時惟青陽云云升金軒撫太僕􅀭六鑾齊八騄造廣場戾壇庭百寮山立萬乗雲縈延祝史肆玉牲登圜丘揖太清禮羣望告皇靈天澄其氣日昭其精宗皇祖而配祀增孝思之惟永明帝太寧三年七月始詔立北郊未及建紀七月辛未詔曰郊祀天地帝王之重事自中興以來惟南郊未曾北郊四時五郊之禮都不復設五嶽四瀆名山大川載在祀典應望秩者悉廢而未舉主者其依舊詳處成帝咸和八年正月追述前㫖於覆舟山南立之是月辛未祀北郊始以宣穆皇后配地魏氏故事非晉舊也成帝立二郊天郊則六十二神五帝之佐日月五星二十八宿文昌北斗三台司命軒轅星后土太一天一太微鈎陳北極雨師雷電司空風伯老人凡六十二神也地郊則四十四神五嶽四望四海四瀆五湖五帝之佐沂山嶽山白霍毉無閭蔣山松江會稽山錢唐江先農凡四十四神也江南諸小山葢江左所立如漢西京闗中小水皆有祭秩也二郊所秩官有其注康帝建元元年正月將北郊有疑議太常顧和表曰太始中合二至之祀於二郊北郊之月古無明文或以夏至或同用陽復漢光武正月辛未始建北郊此則與南郊同月中興草創百度従簡合七郊於一丘憲章未備至咸和中議別立北郊同用正月魏承後漢正月祭天以地配而稱周禮三王之郊一用夏正於是從和議是月辛未南郊辛巳北郊帝皆親奉牲用𤣥宋志晉武之世或用丙或用巳用庚以十二月丙寅南郊受禪又太始二年十一月己卯始并圓丘方澤二至之祀合於二郊三年十一月庚寅冬至祠天郊於圓丘是猶用圓丘之禮非專祈穀之祭故不用辛也晉武捨鄭而從諸儒是以郊用冬至日江左以來皆用正月以傳云三王之郊各以其正髙堂隆云九日南郊十日北郊是為北郊可不以辛也晉武郊以二月晉元禋以三月王納之曰武皇用二月郊元帝以三月郊自晉以來間嵗一郊明堂同日宋大明三年移北郊於鍾山北原道西與南郊對後還舊處通典宋大明三年移郊兆於秣陵牛頭山西在宫之午地移郊正午以定天位齊永明元年立春前郊祀郊壇員兆外内起瓦屋形制宏壯梁南郊為壇在國之南常與北郊間嵗正月上辛行事普通二年四月乙卯改作南北郊陳王元規議曰梁南郊壇上徑十一丈下徑十八丈髙二丈七尺北郊壇上方十丈下方十二丈髙一丈梁簡文有南郊頌潘岳閒居賦天子有事于柴燎以郊祖而展義張鈞天之廣樂備千乗之萬騎晉議立郊祀華恒傳元帝拜太常議立郊祀尚書刁協國子祭酒杜彞議須還洛乃修郊祀恒議漢獻帝居許即便郊柴宜於此脩立司徒荀組驃騎將軍王導同恒議遂定郊祀隋圓丘通典隋冬至日祀天圓丘五方上帝天文並従祀日月五星内官四十二座次官百三十六座外官百十一座衆星三百六十座五帝日月在丘第二等北斗五星十二辰河漢内官在丘第三等二十八宿中官在丘第四等外官在内壝内衆星在内壝外唐南郊圓丘太史圓丘圖祠令従祀星辰圖通典武德初定令冬至祀天圓丘壇於京城明德門外道東二里以景帝配五方上帝天文皆從祀日月内中外官及衆星皆從祀其五方帝及日月七座在壇第二等内官五星以下五十五座在第三等二十八宿以下百三十五座在第四等外官百十二座在外壝之内衆星三百六十座在外壝之外會要髙祖南郊一武徳四年十一月甲申太宗四貞觀二年十一月辛酉五年十一月丙子十四年十一月甲子朔旦冬至十七年十一月己卯髙宗二永徽二年十一月辛酉總章元年十二月丁卯中宗一景龍三年十一月乙丑睿宗二先天元年正月辛巳南郊五月戊寅北郊𤣥宗五開元十一年十一月戊寅天寶元年二月丙申六載正月戊子十載正月甲午十三載二月八日肅宗二乾元元年四月甲寅元年建丑月辛亥代宗一廣德二年二月乙亥德宗四建中元年正月辛未貞元元年十一月癸卯六年十一月庚午九年十一月乙酉憲宗一元和二年正月辛卯穆敬文宗皆一長慶元年正月辛丑寶厯元年正月辛亥太和三年十一月甲午武宗二㑹昌元年正月辛巳五年正月辛亥宣宗一大中七年正月戊申懿宗二咸通元年十一月丁丑四年正月庚午僖昭宗皆一乾符二年正月辛卯龍紀元年十一月己酉己上依本紀月日間與會要不同志禮曰以禋祀祀昊天上帝此天也又曰兆五帝於四郊此五行精氣之神也而鄭康成有六天之説後世莫能廢唐初貞觀禮冬至祀昊天圓丘正月辛日祀感生帝靈威仰于南郊以祈穀孟夏雩于南郊季秋大享于明堂皆祀五天帝髙宗時禮官以謂太史圓丘圖昊天上帝在壇上而耀魄寶在壇第一等則昊天上帝非耀魄寶可知而祠令及顯慶禮猶著六天之説通典永徽二年七月太尉無忌等奏顯慶二年禮部尚書許敬宗議以為六天出於緯書會要二年八月十三日己巳無忌議由是盡黜康成説而南郊祈穀孟夏雩明堂大享皆祭昊天上帝許子儒傳初太尉長孫無忌議祠令及禮用鄭𤣥六天説唐家祀圓丘太史所上圖昊天上帝外自有北辰云云今祠令固守𤣥説與舊式相違宜有刋正説會要云吏部式唯有南郊陪位不别載圓丘今従鄭圓丘之外別有南郊理宜改革乾封元年詔祈穀復祀感生帝二年十二月甲午詔明堂兼祀昊天上帝及五帝開元中起居舎人王仲丘議曰五帝者五行之精所以生九穀也宜於祈穀祭昊天而兼祭五帝月令大雩大享帝皆盛祭也而貞觀禮皆祭五方帝顯慶禮皆祭昊天上帝宜兼用之以合大雩大享之義既而蕭嵩等撰定開元禮雖未能合古而天神之位別矣其配神之主武德中圓丘南郊方丘北郊以景帝配祈穀明堂以元帝配貞觀初圓丘明堂北郊以髙祖配而元帝惟配感帝髙宗永徽二年十月癸巳長孫無忌等議以髙祖配圓丘太宗配明堂通鑑云以髙祖配五天帝太宗配五人帝乾封二年十二月甲午詔圓丘方丘五方明堂感帝神州皆以髙祖太宗並配則天郊丘諸祠常以髙祖太宗髙宗並配開元十一年十一月戊寅㑹要云十一月十六日親享圓丘中書令張説衞尉少卿韋縚為禮儀使乃以髙祖配而罷三祖並配至二十年蕭嵩等定禮而祖宗之配定矣寶應元年杜鴻漸等請以太祖景皇帝郊配乃罷髙祖以景帝配通鑑廣德二年正月甲寅禮儀使鴻漸奏祀圓方丘以太祖祈穀以髙祖大雩以太宗明堂以肅宗配従之會要開元十一年十一月一日參定南郊之禮秘書少監賀知章中書令張説等奏曰晉元建武二年定郊兆於建鄴之南郊去城七里一壇之上尊卑雜位千有五百神臣等案祠令六典令二十七卷八曰祠令五星以下内官五十三座中官一百六十座外官一百四座衆星三百六十座臣勘史傳及星經舊圖坐位升降頗錯今據尊卑升降又新加杠星等座總三百一十九座并衆星三百六十九座具圖如左詔頒於有司以為常式又云顯慶二年八月十二日長孫無忌等議曰祠令及新禮並用六天之義檢太史圓丘圖昊天上帝坐外别無北辰坐與鄭義不同請廢六天之説詔可十五年六月博士錢嘉會議引月令及祠令九月農功畢大享明堂六典祠部冬至祀昊天於圓丘以髙祖配焉又祀五方帝日月於壇之第一等又祀内官五十五坐於壇之第二等又祀中官一百五十九坐於壇之第三等又祀外官一百五坐衆星三百六十坐於内壝之内正月上辛祈穀於圓丘以髙祖配祀五方帝於壇之第一等孟夏之月大雩於圓丘以太宗配通典景雲元年十一月乙丑冬至祀圓丘𤣥宗開元十一年十一月十六日舊紀戊寅親享圓丘命張説為禮儀使韋縚為副使賀知章重定從祀星辰圖見會要及六典革去東晉尊卑錯亂之失志四成而成髙八尺一寸下成廣二十丈而五減之至於五丈而十有二陛者圓丘也八觚三成成髙四尺上廣十有六步設八陛上陛廣八尺中陛一丈下陛丈有二尺者方丘也云云神位之序祀圓丘五帝及大明夜明在壇之第一等天皇大帝北辰北斗天一太一紫微五帝坐並差在前餘内官諸坐及五星十二辰河漢四十九坐在第二等十有二陛之間中官市垣帝坐七公日星帝席天角攝提太微五帝太子明堂軒轅三台五車諸王月星織女建星天紀十七坐及二十八宿差在前列其餘中官一百四十二坐皆在第二等十二陛之間外官一百五在内壝之内衆星三百六十在内壝之外會要建中元年正月五日親拜郊司天冬官正郭獻之奏天皇大帝北極天一太一准星經及天寶中勑並合升第一等制從之凖開元禮並在第二等至貞元元年一云二年十一月十一日親郊司天進圖勑令禮官詳定太常卿漢中郡王瑀博士柳冕等請依禮為定詔復依開元禮長慶元年正月饗太廟禮畢復齋於郊壇行宫出朱雀門命宰臣行馳道中以備顧問王勃南郊頌上稽龍繇下閲龜謀屏翳清曉飛亷警旦奠惟蒼璧藉用白茅風行電舉未寸景而浹九埏鸞旗曉引葆吹晨吟山明野澈日降天臨青帝鳴琴朱靈㑹舞徐彦伯南郊賦維帝唐八十有五載云云左日壑右星圃於穆我皇纂戎而昌青氣搖社白雲入房陳大旅展時事告紫宙之成功定皇天之寶位崇泰壇考星翼載師清野土訓掃㕓繚垣虹合參途電聯籠組帷以艾景覆皇邸以慶煙啟端門警仙蹕雙鳯矯首六龍齊膝青斾罥雲紅旌彗日鏘玉鸞之鳴轙按金椎之廣術呵風伯令戒道制𤣥㝠使司律此靈祇所以保綏昊天所以宥密於是闢龍次幸蜺幬鶉鳥司衮熊羆奉收皇帝乃彰畫黻襲大裘端玉珽肅珠旒翼翼穆穆遂臻于圜丘躬孝享擁神休設天宗之六席援長發之二球盥以明水薦以香羞陳蒼璧而蕆事藉白茅而闡幽絜騂旄之泔淡酌𤣥瓚之觩䚧瑞氣蜿蜒於藪甸祥光熠爚於旄䍐三觶終獻萬祇呈醺擥太𤣥之神䇿張集靈之瑞典張九齡傳𤣥宗即位未郊見開元三年九齡建言繼統之主必有郊配敬天命報所受也願以迎日之至升紫壇陳采席定天位柳冕傳德宗既親郊貞元六年十一月八日重祠事動稽典禮冕以吏部郎中攝太常博士與張薦徐岱陸贄修飭儀矩帝疑郊廟每升輒去劒履及象劍尺寸祝語輕重冕據禮以對會要元和二年正月辛卯郊饗獻之次景物澄霽及鑾輿就次則微雪大駕將動則又止翌日御樓宣赦畢瑞雪盈尺唐南郊合祭漢圓丘合祭志古者祭天圓丘在國南祭地方丘在國北以其類也則天天册萬嵗元年親享南郊始合祭天地睿宗景雲二年正月將郊有司議不設皇地祇位諫議大夫賈曾議曰三輔故事祭于圓丘上帝后土位皆南面則漢嘗合祭矣請合享天地如古祭禮官皆以為然睿宗將祭地北郊曾議寢紀先天元年正月辛巳有事南郊五月戊寅有事北郊𤣥宗定開元禮天寶元年二月二十日丙申遂合祭天地于南郊大赦是時神仙道家之説興建𤣥元廟二月辛卯親享𤣥元廟甲午親享太廟丙申有事于南郊遂以為故事終唐世莫能改杜甫上三大禮賦有事于南郊賦曰春官條頌祇之書獻祭天之紀降帷宫之綝縭屏玉軑以蠼略衝牙鏗鏘以將集周衞轇轕而咸若月窟黑而扶桑寒田燭稠而曉星落雲菡蓞以張蓋春葳㽔以建杓韓愈元和聖徳詩正月元日初見宗祖躬執百禮登降拜俯乃以上辛於郊用牡除于國南鱗筍毛簴廬幕周施開揭磊砢獸盾騰挐圓壇帖妥天兵四羅旂堂婀娜駕龍十二魚魚雅雅宵昇于丘奠璧獻斚衆樂驚作轟豗融冶紫熖噓呵高靈下墮羣星從坐錯落侈哆日君月妃煥赫婐㛂瀆􅀑濛鴻嶽祇嶪峩飫羶燎薌産祥降嘏鳯皇應奏舒翼自拊帝車迴來日正當午幸丹鳯門大赦天下滌濯剗磢磨滅瑕垢郊天告廟神靈歡喜獻紀元和六年正月己丑朝太清宫庚寅朝享太廟辛卯有事南郊大赦會要元和十五年十二月問南郊卜日否禮官奏禮令卜日天寶後先朝太清宫次享廟享天並不卜日唐五郊官志郊社令掌五郊社稷明堂之位會要顯慶二年八月十三日己巳太尉無忌議請憲章姬孔取王去鄭四郊迎氣存太微五帝之祀南郊明堂廢緯書六天之義方丘在祭地之外別有神州謂之北郊分地為二請合於一祀詔可唐郊祀錄德宗貞元中太常禮院修撰王涇考次歴代郊廟沿革之制及其工歌祝號而圖其壇屋陟降之序為郊祀錄十卷志儀注類貞元九年上書目卷同鄭有郊丘異祭六天之説王有郊丘同祭一天之説五使南郊五使元和以前史籍不載長慶後禮儀使太常卿為之大禮使御史中丞為之哀帝時中丞為儀仗使梁以河南尹為大禮使又有儀仗法物二使以武將為之後唐宰相為大禮使兵部尚書為禮儀使中丞為儀仗使兵侍為鹵簿使開封尹為頓遞使周以禮儀歸太常餘如故本朝依唐制大禮儀仗頓遞用宰相及臺丞京尹餘使以學士尚書而頓遞增橋道之名乾德南郊行禮圖南郊壇從祀星辰圖飲福宴唐制每嵗冬至圓丘正月上辛祈穀孟夏雩季秋大享凡四祭昊天上帝五季典章散失建隆四年癸亥八月庚辰朔即乾德元年也内出御札以十一月十六日甲子有事南郊有司言冬至近晦改用甲子二日詔中原多故百有餘載禮樂儀制不絶如綫宜講求遺逸稱朕寅奉之意於是宰相范質等討尋故事唯得唐天成中南郊鹵簿字圖考以今文頗為疏略違戾者多質等參定新本曰南郊行禮圖質自為序乙未上之凡壇壝牲器玉帛醴饌齋戒之制與祠官定儀以聞癸未以司徒范質為大禮使學士承㫖陶穀為禮儀使吏部尚書張昭為鹵簿使中丞劉温叟為儀仗使皇弟開封尹為橋道頓遞使唐有禮儀判官五代有大禮副使判官修裝法物使今皆不置命内臣諸司修飾法物興國九年七月癸丑始鑄郊禮五使印竇儼撰樂章穀議旗常質與禮官議導駕袴褶衣六日太常禮院言親郊嚴辦鹵簿儀仗兵部鼓吹笙歌太常車輅太僕腰輿繖扇殿中省祭器朝祭服諸司法物少府監八日詔太常寺修飾南郊壇禮院定依古制四成十二陛三壝設燎壇於内壝之外丙地髙一丈二尺在南薰門外大又設皇帝更衣次於壇東外壝東門之内道北南向己丑十日司天監上新定南郊從祀星辰圖十一月辛酉十三日宿齋崇元殿壬戌服通天冠絳紗袍執鎭圭乗玉輅鹵簿前導赴太廟宿齋癸亥十五日服衮冕執圭饗四室是夕隂翳及夜分開霽質明乗玉輅赴南郊甲子合祭天地于圓丘以宣祖配初有司請以僖祖配後従張昭議晉王亞獻秦王廷美終獻舊制帝升壇藉以黄褥象天地之黄道上曰朕潔誠事天不必用此命撤之禮畢百僚稱賀於行宫乗輦還御明德門樓大赦改是年為乾德元年宣制畢御崇元殿百寮奉玉册上尊號曰應天廣運仁聖文武至德壬申大宴於廣德殿上壽號曰飲福宴開寶元年十一月癸卯郊祀改元受册乾元殿四年七月甲子朔詔冬至郊祀既平嶺南行報謝禮十一月戊午親饗太廟始用繡衣鹵簿己未合祭圓丘九年幸西京四月庚子三日有事南郊先是霖雨彌旬及己亥赴齋宮雲物澄霽垂白之民相謂曰不圖今日覩太平天子儀衞禮志乾德元年始有事南郊博士和峴言今月十六日親祀二十九日冬至祀天祭不欲數望停南至之祀詔可四年九月詔徙圓丘於舊壇之南五里去新城九里餘俄罷之范質傳乾德初上將有事圓丘以質為大禮使質與鹵簿使張昭儀仗使劉温叟討閲禮閤故事補其闕漏別定南郊行禮圖上之上嘉奬由是禮文始備質自為之序禮畢進封魯國公實錄建隆四年八月乙未南郊大禮使宰臣范質上新定南郊行禮圖宋祁圓丘賦占國南之七里得髙丘之崛然自乾㝢之初闢保坤靈之不遷藹列聖以烝衎總萬靈而賔延晉考卜乎委粟漢肸飾乎甘泉曾不得望我之末光絶炎遡朱鳥以髙蟠槩瑤魁而邪指休氣回復于其椒榮泉滋滲乎其阯攘之辟之其菑其翳修之平之其坎其畷上三陔而積髙外四門而疏陛列道糊赬重營界紫合蕭薌於欽柴塞天淵以隤祉乾道五年秋九月太常少卿林栗等言祀帝于郊在國之南就陽位也國家祀帝者四春祈夏雩秋享冬報其二在南郊圜壇其二在城西惠照院望祭齋宫欲並即圜壇以遵舊制從之在京日孟夏大雩別建雩壇於郊丘之左季秋大享有司攝事就南郊齋宫端誠殿續禮部侍郎鄭聞等言國初沿唐制一嵗四祭昊天上帝於郊丘祈穀大雩享明堂祀圜丘唯明堂當從屋祭因循未正元祐六年從博士趙叡之請有司攝事乃就齋宮行禮元符元年又寓於齋宫端誠殿以此參之蓋既曰明堂當従屋祭故也今郊丘之隅有淨明寺遇明堂親饗則遵紹興三十一年已行典禮常嵗有司攝事則依元祐臣僚所陳權寓淨明寺行禮庶合明堂之義從之興國初再郊皆太祖配天及欲封泰山扈蒙建白以宣祖配天太祖配帝其後封禪禮輟雍熙之郊遂用蒙議至淳化之春合祭圓丘以宣祖太祖同配如永徽故事太平興國南郊頌丹鳯樓大赦太平興國三年十一月乙未親饗太廟丙申合祭南郊御丹鳯樓大赦乾元殿受册國初以來南郊四祭及感生帝皇地祇凡七祭並以四祖迭配上即位以宣祖太祖更配於是合祭天地始奉太祖升侑殿直王操獻南郊頌上悦之己酉以為太子中允六年十一月辛亥合祭圓丘九年扈蒙議以宣祖配圓丘太祖配大享淳化三年十月蘇易簡請祈穀神州大享以宣祖圓丘北郊雩祀感生帝以太祖崇配従之十一月二十七日禮儀使請祈穀壇設赤帝位罷感生之祀淳化上辛祈穀淳化三年十一月己亥二十七日公卿議來年正月二日上辛行郊祀之禮從之漢武以正月上辛祀甘泉圜丘取齋戒自新之義四年正月庚寅朔親享五室辛卯合祭天地於圓丘以宣祖太祖升配先是禮儀使蘇易簡言郊祀以宣祖侑神符嚴父之義太祖光啟丕基以聖授聖謹按唐永徽中以髙祖太宗同配請自今郊丘親祀宣祖太祖同配又按唐永泰中杜鴻漸奏云云諸儒以為得禮今欲孟春祈穀孟冬祀神州季秋大享明堂以宣祖配冬至祀天夏至祀地孟夏雩祀以太祖配從之御乾元門下制曰泰壇燔柴國之大典上辛祈穀禮有舊章祇見上帝祈福天宗癸巳上賦南郊宿齋五七言詩六首賜近臣乙未雨雪作立春日瑞雪詩三首秘書監李至言自廟徂郊纖飇不搖羽衞如植升壇而星象炳煥訖事而雲氣鬱興應門肆赦非煙可挹至道元年以繼遷叛詔用仲春十二月丁亥詔來年正月十日有事南郊二年正月辛亥親郊太子亞獻越王元份終獻天禧初眞宗祈穀南郊賈昌朝獻頌道左紀天禧元年正月辛亥恭謝天地於南郊大赦禮志景德三年十二月陳彭年言來年正月三日上辛祈穀至十日始立春按月令春秋傳當在建寅之月迎春之後自晉泰始二年始用上辛不擇立春之先後齊永明元年立春前郊議者欲遷日王儉啟云宋景平元年元嘉六年並立春前郊遂不遷日其後吳操之又云應在立春後然則左氏所記啟蟄而郊乃三代彞章王儉所啟郊在春前乃後世變禮望常以正月立春之後上辛行祈穀之祀從之天禧元年十二月禮儀院言立春後辛或正月上辛許互用奏可孝宗隆興二年詔十一月二十九日郊祀十一月七日有司言乾德元年初郊冬至近晦改用十六日甲子請改吉日十二月詔以元日正得上辛合魯經啟蟄之文法周室用騂之禮蓋太宗行於至道猶漢帝拜于甘泉乃以乾道元年正月辛亥朔親郊輿衞儀仗十分去六止用六千八百八十九人近晦而避者乾德之事上辛之卜則淳化所行啟蟄而郊飭周人槀秸之具奉牲以告協漢世竹宫之時魯人祀帝用騂剛於上辛漢代祀天歌青陽於肇嵗以元日祈穀於帝遠參吕令之文以上辛用牡於郊近遵唐室之制遵古用辛之義卜郊履端之初齋戒自新與萬民而更始蕭脂載烈興嗣嵗以祈豐髙皇初紀因上朔以更中孝廟始元自新陽而度臘至道南郊圖咸平合祭至道二年正月己酉親饗太廟辛亥合祭天地於圓丘先是禮儀使宋白奏曰伏詳儀注朝饗太廟皇帝先請罍洗後奠瓚其祀天地望先詣罍洗後奠玉幣上以問吕端端言得禮之中遂従白議先一日庚戌上出次南郊齋宫詔有司畫南郊圖初上顧左右瞻具車駕自廟出郊仗衞周列千官奉引旌旗車輅相望無際郊祀之盛儀京邑之壯觀因詔有司畫圖以獻凡為三幅外幅列儀衞中幅車輅及導駕官人物皆長寸餘又圖畫圜壇祭器樂架警場青城別為圖以紀一時之盛令内臣裴愈石承慶於朝元殿集翰林畫工繪之仍命翰林學士承㫖宋白監總再朞而畢咸平元年八月二日戊子宋白上之眞宗詔以示輔臣藏之秘閣賜白雜綵銀器裴愈等緡錢各有差畫待詔髙元吉賜緋郊王延德為行宫使為南錄咸平二年十一月丙戌合祭天地於圓丘以太祖太宗配還御乾元門下制曰天祚明德民懷有仁推千載之膺期實三靈之眷命太祖以武功定亂御制萬方四登泰壇親行大禮太宗以文德柔遠混成一統五奠玉爵合祭二儀太祖四郊太宗五郊粤以沖人御兹宏厯奉三年無改之制臨一日萬幾之繁而昊穹顧懷宗社垂祐嵗時屢稔民俗阜安動植惟和中外咸若若何凉德享此鴻休是用祇見祖宗展因心之義對越天地申報本之誠翕受蕃禧均覃率土羣臣上尊號御乾元門受册南郊正位二配位二每位用犢一羊一豕一五方帝每位用羊豕一日月神州每位羊二豕二從祠七百三十七位皆不用牲並以上件羊豕分充用幣帛七十八段天帝配帝日月五方帝神州外餘六十六版咸平五年詔三司省應奉雜物十萬六千計景德郊壇神位圖鹵簿記南郊位版天禧大禮記景德二年九月丁未上封者言郊丘天地神位版有司臨時題書多不嚴肅望令重造詔鹵簿使王欽若與内臣詳閲修製甲子欽若上言奉詔改造南郊神位版據司天監文籍壇陛之上升降未便者數事漢郊祀志五帝天神之佐今五帝在第一龕天皇大帝在第二龕與六甲嶽瀆之類同處北極衆星所拱與尚書大理之類接席帝坐天帝之尊今與二十八宿積薪騰蛇杵臼之類同在第三龕若以北極帝坐本非天帝蓋是天帝所居則北極在二帝坐在三髙下未等又太微之次少左右執法子星之次少孫星詔禮儀使太常禮院司天監同檢討詳定禮儀使趙安仁等言崇文檢討杜鎬陳彭年狀案開寶通禮天皇大帝即北辰耀魄寶也天以蒼昊為體不入星辰之列又郊祀錄壇之第二等祀天皇大帝北斗天一太一紫微五帝坐並差在行位前餘内官諸位及五星十二辰河漢四十九坐齊列俱在十二陛之間壇之第三等有中官市垣帝坐等十七坐並在前開元禮義羅云帝有五坐一在紫微宫一在大角一在太微宫一在心一在天市垣非直指天帝也又判司天監史序狀太微垣十星有左右執法上將次將之名不可備陳故總名太微垣星經舊載孫星而壇圖止有子星辨其尊卑不可同位望以舊禮為定詔従安仁等議欽若復上言鄭𤣥注周禮謂禮天者冬至祭天皇北極也後魏孝文禋六宗亦升天皇列五帝之上天皇北極帝坐孫星四坐臣己新製板位設天皇北極特升在第一龕又設孫星位于子星之次帝坐如故欽若復上言帝坐止三在紫微太微者已列第二等唯天市一坐位第三詔特升在第二龕十一月乙巳朔欽若以南郊神位版呈於便殿壇上四位塗以朱漆金字餘皆黑漆第一等金字二等黄字三等以降朱字悉貯以漆柙覆以黄縑帊上降階觀之即付有司禮儀使上新定壇圖禮儀使趙安仁上言郊壇神位今依儀注寫定望付司天監製為絹圖凡壇上神位四昊天地祇太祖太宗也第一等神位八五方帝日月神州也第二等神位七十三北辰北斗至岳鎭海瀆也北辰北斗天一太一五帝内座六位差在前五星十二辰河漢暨内官四十九座岳瀆十八座凡六十九位差在後第三等神位百七十九二十八宿至山林川澤也二十八宿至建星天紀凡四十五位差在前中官一百五十九座山川二十座凡一百三十四位差在後内壝之内神位百三十五内壝之外衆星三百六十總七百五十九座第三等四帝黄帝舊圖差在前合在後五帝五岳河漢中鎭舊圖在第三據儀注合在第二並請刋正従之欽若又上鹵簿記三卷是月丁巳合祭南郊天禧元年正月辛亥奉天書合祭天地正陽門肆赦天安殿上尊號二年正月戊午欽若上天禧大禮記四十卷賜器幣嘉泰三年九月二十五日增太子星庶子星宋星感生帝四神位以張宏圖進南郊辨駁從其言也祥符朝元殿行恭謝禮恭謝壇祥符五年十月二十四日戊午天尊降延恩殿後四日帝謂宰臣曰朕欲詣宫觀焚香以申恭謝遂以二十八日幸上清宫景德寺玉清昭應宫閏十月十九日壬午詔以十一月三日於乾元殿恭謝玉皇二十四日戊子内出薦饗玉皇聖祖太祖太宗配饗樂章十六曲文舞曰發祥流慶武舞曰降眞觀德二十九日癸巳奉天書于文德殿行酌獻之禮十一月三日丙申五鼔奉天書于朝元殿服通天絳紗乗步輦至殿門外大次改服衮冕行事殿上北設玉皇位聖祖配坐在東太祖太宗在西以相王元偓舒王元偁為亞終獻羣臣詣崇德殿稱賀賜百官福酒帝作朝謝玉皇觀二鶴神雀詩三首近臣畢和六年八月庚申朔詔協吉春序卜勝神臯恭建壇壝親謝天地朕以來年春正月己酉詣亳州太清宫行欵謁禮先於東京置恭謝壇如南郊之制戊辰司天監請建於城東汴陽鄉七年正月十三日庚子禮院言恭謝壇天地配帝等及内官五十四中官百三十九外官百六嶽鎭海瀆十八請並供制幣二月十三日己巳具鹵簿詣昭應宫宿于集禧殿翌日庚午帝服衮冕詣太初明慶殿薦獻又詣二聖殿畢改服通天絳紗乗玉輅赴太廟十五日辛未朝享十六日壬申奉天書升壇恭謝天地祖宗並配司天言慶雲繞月祥風襲壇還御乾元門肆赦癸酉帝作恭謝禮成七言詩賜近臣天禧元年正月十一日辛亥有事南郊行恭謝禮御乾元門肆赦改元壬子作七言詩近臣咸和乙卯詣玉清昭應宫恭謝晏殊獻頌三年十一月辛未郊祀丁丑詣昭應宫行恭謝之禮己卯作大禮慶成五言詩天聖築圓丘外壝禮志天聖六年用判太常寺孫奭議築圓丘外壝周以短垣置櫺星門親郊則立表施青繩表三壝明道天安殿太廟行恭謝禮紹興景靈宫行恭謝禮明道元年十月二十三日以修宫室成詔以十一月六日天安殿恭謝天地次太廟恭謝二十二日太常請備大駕鹵簿乗輅十一月癸酉齋于崇德殿翌日甲戌天安殿設天地祖宗位登歌宫懸帝服衮冕行恭謝禮禮成備大駕玉輅詣太廟禮畢輦還御正陽門肆赦改元嘉祐元年五月甲申詔權罷南郊親祀以九月十二日辛卯恭謝天地于大慶殿禮成御宣德門肆赦改元先是八月十五日甲子内出御製恭謝樂章下太常肄習大觀四年九月二十二日至二十四日以冬祀禮成恭謝于景靈宫西宫建炎元年五月六日車駕恭謝鴻慶宫紹興十三年十一月庚申冬郊祀景靈宫新成十二月甲午行恭謝禮十九年十一月壬辰郊十二月壬戌恭謝景靈宫癸亥亦如之甲子詣太一宫自是如故事禮畢賜酒恭謝非常禮始於祥符五年元豐詳定所言恭謝藉田歴年不講大觀政和以後率以郊祀禮成恭謝景靈東西宫遂為故事中興因之自紹興十三年始景祐崇祀錄至和郊祀總儀景祐三年七月己卯孫奭子瑜上崇祀錄二十卷詔送史館奭領太常倣唐王涇郊祀錄紀國朝典禮未奏而卒至和二年判太常吕公綽以嵗祠六十一禘祫二祭其薦祼興俯玉帛彞器菁芽醯醢鐘石歌奏集為郊祀總儀上之祥符元年登封太祖太宗配位比郊祀而斜置之其後南郊撰儀既引祥符側置之禮又載西向北上之儀擇一而從慶厯元年十月壬辰禮官吕公綽請南郊祖宗之配以東方西面為定位天聖二年十一月丁酉祭圓丘御正陽門赦天下天安殿上尊號景祐二年十一月乙未郊三聖並侑嘉祐七年正月詔南郊奉太祖定配仁宗御集有欽崇禋祀記三卷吕源曰三嵗之郊非祖宗制也太祖在位十七年四行大禮乾德中歴六年方一講開寶四年南郊之後更五嵗因平江南祭天地於洛京伸告謝之敬而已太宗自雍熙以來五年乃親耕又六年至淳化四年再行郊禋之禮是十年而一郊也太宗二十三年五講郊禮眞宗率三年而一行仁宗明道元年恭謝天地于天安殿又謁太廟明年又親耕最為煩數自是三嵗一郊遂為定制仁宗九見圓丘一蕆春藉再祗合宫嘉祐元年恭謝大慶殿四年祫祭七年明堂蓋九年不行郊禋寶元南郊儀仗法物寶元元年即景祐五年八月十六日庚辰御大慶殿門觀南郊儀仗法物宰臣兩制預焉皇祐南郊並配紀皇祐二年五月甲申朔詔辨崇配之序定二祧之位庚子禮官奏議南郊升侑上帝以太祖定配二宗迭配詔恭依十一月乙未祀天地于圓丘皇祐五年八月壬子詔南郊以太祖太宗眞宗並配十一月己巳祀圓丘嘉祐七年正月乙亥詔南郊以太祖配為定制志景祐二年五月詔太祖太宗眞宗三廟萬世不遷南郊以太祖為定配二宗為迭配親祠三聖皆侑嵗時常祀至日圓丘仲夏地祇配以太祖孟春祈穀夏雩祀冬祭神州配以太宗孟秋感生帝配以宣祖季秋大饗配以眞宗慶厯元年吕公綽言歴代郊祀配位無側向眞宗示輔臣封禪圖配位斜置之其後未考定詔南郊祖宗之配並以東方西向為定位七年禮儀使言四年郊已奉太祖太宗配今合以太祖眞宗配皇祐五年郊詔自今南郊三聖並侑嘉祐元年九月大慶殿恭謝天地三聖並侑六年諫官楊畋論水災繇郊廟未順下禮院言對越天地神無二主唐垂拱中始用三祖同配至開元親享遂罷之皇祐詔書南郊三聖並侑後迭配未幾復並侑為定制雖出孝思然頗違經學士王珪等請如禮官議七年正月詔南郊以太祖定配治平二年合祭天地以太祖配會要乾德元年以禧祖配淳化四年以宣祖太祖咸平二年以太祖太宗景祐二年太祖太宗眞宗三聖並侑又見宗廟類建炎二年以太祖配紹興十三年太祖太宗配熙寧郊祀總要熙寧四年楊傑為禮官識諸司所職祠事為郊祀總要一卷詳見後熙寧南郊殿宇端誠殿熙成殿熙寧七年九月二十四日戊申中書門下言凖詔參定南郊青城内殿宇門名請大内門曰泰禋東曰承和西曰迎禧正東曰祥曦正西曰景曜後曰拱極東側門曰寅明西曰肅成大内曰端誠東西門曰左右嘉德便殿曰熙成從之元豐分祭元祐合祭圓丘六議神宗詢合祭是非熙寧十年十二月甲午詔黄履與禮官講求之元豐元年正月戊午置局詳定郊廟禮文二月六日詳定郊廟禮文陳襄言謹按周禮大司樂以圜鍾為宫冬日至於圜丘奏之六變以祀天神以函鍾為宫夏日至於方丘奏之八變以祀地示夫祀必以冬日至者以陽氣來復於上天之始也故宫用夾鍾于震之宫以帝出乎震也而謂圜鍾者取其形以象天也祭必以夏日至者以隂氣潛萌乎下地之始也故宫用林鍾于坤之宫以萬物致養乎坤也而謂函鍾者取其容以象地也漢元始中姦臣妄議附會周官大合樂之説謂當合祭平帝從之天地共犢禮之失自此始由漢迄唐以五月親祠北郊者惟四帝而已如魏文帝太和周武帝建德隋髙祖開皇唐睿宗先天皆希闊一時之舉也自漢元始合祭後漢光武魏黄初東晉元帝唐武后以來皆因仍之本朝未克釐正臣謂南北二郊當別祀襄初請親祀之嵗夏冬疊舉二祀李清臣請用漢五供之制親祀之嵗㝛廟以告宿北郊以祭宿南郊以祀止以一時王存請以孟冬純隂之月陸佃請用魯三望之制即圓丘之北別祀地示張璪請盛禮容具樂舞遣冢宰攝事三年五月甲子詔更加講求四年四月己巳詔罷南郊合祭天地親祠北郊如南郊儀不親祠以上公行事樂舞如親祠時李清臣上議惟陳薦援成命之詩媪神並况之章以為不始於莽宜仍舊曽肇請損儀衞之虛文以夏至日躬欵北郊六年五月甲申禮部太常上親祭及攝事儀七月庚申築方丘三成四陛壇髙一丈四尺十一月丙午祀天圓丘遂不復設地示位甲辰朝獻景靈宫乙巳朝饗太廟丙午祀天圓丘以太祖配元祐七年五月十七日右丞許將言冬至親祠夏至遣上公則地祇永不在親祠之典此大闕禮不可不議始詔侍從禮官集議顧臨等八人議宜如祖宗故事合祭范純禮等二十人議請依先朝詔旨杜純請於苑中望祠上公攝事舉權火望拜王欽臣請並祭一次孔武仲請孟冬詣北郊親祠九月戊子上議九月十二日壬辰進呈臨等議蘇頌曰仁宗九郊合祭先皇四郊三郊合祭惟元豐六年禮文所參議止祀上帝北郊雖定儀注未及施行今南郊望準故事范百祿曰先帝之詔所宜遵守十四日再進呈頌曰皇帝初郊而不祀地恐未合古請依熙寧十年合祭鄭雍亦主合祭太皇宣諭曰皇帝未親祀合祭不為無名十八日戊戌詔今嵗圓丘依熙寧十年故事設皇地祇位以申始見之禮一云九月二十二日詔書集官詳議十一月癸巳郊合祭天地八年二月二十五日壬申禮部尚書蘇軾引詩昊天有成命郊祀天地為合祭明文發六議以難議臣集云三月上圓丘合祭六議二十二日乞集議之日畫一難臣六議明著可否之狀四月十一日丁巳詔罷集議范百祿執議不従盛陶宇文昌齡亦主分祭紹聖元年五月甲寅張商英請詳議戊午黄履盛陶等請罷合祭二年正月辛亥詔侍從臺諫禮官議王古李琮并亮采常安民主合祭范純禮林希黄履等乞罷合祭盛陶乞如王存議以十月親祀豐稷請望祭三年正月二十七日戊午詔罷合祭以夏至親祭于北郊然未嘗行建中靖國元年八月甲午詔權合祭天地于圓丘起居郎周常以合祭為非禮丙辰詔權罷合祭十一月庚辰合祭圓丘崇寧三年十一月丙申祀天圓丘元豐圓丘三壝南郊增損式元豐元年十一月二日詳定禮文所言東漢壇位天神從祀者一千五百一十四故外設重營以為限唐因齊隋制為三壝所以序祀事也國朝郊祀壇域率循唐制儀注具載圓丘三壝每壝二十五步而有司乃以青繩代内壝不足以等神位請除去青繩如儀注為三壝従之三年正月二十七日集賢校理黄亷上編修南郊增損式元豐祀圓丘元豐六年癸亥嵗十一月丙午祀昊天上帝于圓丘以太祖配始罷合祭天地改曰冬祀帝服大裘被衮冕以出自元豐元年命陳襄等詳定郊廟奉祀禮文大正歴代典禮之失至是祀天之儀粲然一新天下稱慶赦文云齋戒端誠之宫清肅禮神之囿陟配烈祖對侑昊穹元祐七年推本建隆之舊章復舉熙寧之故實祼八室合兩儀劉弇進元符南郊大禮賦建炎二年十一月二十二日祀昊天圓壇以太祖配築壇揚州南門内紹興郊祀儀注圓丘見祠壇建炎二年初郊用元豐禮祀天以太祖配御札曰世祖建武二載始立郊位之規肅宗乾元初年嘗行禋祀之典紹興十三年癸亥三月丙午築圓丘六月九日御札曰四涓路寢之筵久曠圓壇之禮見祖禰於諸室合丘澤之一祠十月丙戌十三日禮官修郊祀大禮儀注警戒致齋奏告陳設車駕詣青城省牲器奠玉幣皇帝行事升壇進熟亞終獻飲福望燎瘞還大次端誠殿受賀還内十一月戊午上服袍履乗輦朝獻景靈宫己未朝饗太廟上服通天冠絳紗袍乗玉輅齋于青城庚申日南至合祀天地于圓丘太祖太宗並配自天地至従祀諸神凡七百七十有一設祭器九千二百有五鹵簿萬二千二百有二十人初備五輅以黑繒為大裘蓋元祐禮也赦文云度土之陽迎日之至建太常而遵玉路被大裘而執鎭圭對越天地並侑祖宗筴授泰元繼黄帝之正統運迎甲子符藝祖之始郊嵗用癸亥與藝祖初郊合符十二月甲午乙未以郊禮畢恭謝景靈宮十六年赦文云粢盛蠲潔出於耕藉之藏筍簴周環冠以景鐘之奏十九年二十二年二十五年二十八年郊祀凡七慶厯四年十一月二十五日赦文云益當居降祥之地而懼其咎席已安之勢而念其危弗徇非彞弗為無益乾道德壽宫行飲福禮隆興二年九月丁亥詔郊祀宜進胙慈闈令有司具儀注乾道元年正月辛亥朔祀圓丘上率羣臣詣德壽宫行飲福禮六年十一月壬午淳熙三年十一月癸丑同乾道元年赦文云進玉巵而介親壽偕椒屋以慶母慈九年赦文云壽慈極以稱觴宋朝親郊太祖南郊四乾德元年開寶元年四年九年太宗南郊五太平興國三年六年雍熙元年淳化四年至道二年眞宗南郊五咸平二年五年景德二年天禧元年三年東郊一祥符七年仁宗南郊九英宗一神宗四哲宗二徽宗八髙宗七孝宗六光宗一寧宗三理宗寶慶三年十一月六日謙德乾德元年十一月甲子南郊將升壇有司具黄褥為道上命撤之還宫將駕金輅上曰於典故可乗輦否乃乗輦慶厯元年帝不御小次徹黄道易拜褥用緋自後皆然志治平二年十一月壬申祀圓丘故事親祠皇帝將就版位祠官皆回班嚮上詔勿回班又侍臣跪讀册至御名則興亦詔勿興熙寧元年十一月丙戌齋于郊宫罷登青城門及幸囿苑丁亥祀圓丘徹黄道褥不御小次命侍祠官勿回班以致敬省約乾德元年八月一日御札務従省約無至勞煩不得以進奉率斂庶遵儉德以奉嚴禋天聖五年七月二十八日詔乗輿服御合雅飾者减省簡約熙寧元年七月四日御札供奉所須務令淳約不忘孝思又詔乗輿服御務従簡約隆興二年正月一日詔遵皇祖之典崇儉德戒勞民除事神儀物諸軍賞給依舊制外其乗輿服御及中外之費並従省約寶慶三年御札藝祖肇禋戒率斂以遵儉德孝皇初祀從省約而去虛文仰企先猷普存民力曾肇議經費曰景德郊費六百萬皇祐一千二百萬治平一千三十萬朝野雜記渡江後郊賞建炎二年用錢二十萬緡金三百七十兩銀十九萬兩帛六十萬匹絲綿八十萬兩皆有竒咸平五年詔三司非禋祀所須並减省是嵗减應奉雜物十萬六千計六月上甲始庀牲十月上甲始繫牲榖梁傳寅威寶命嚴恭帝祖有牷在滌有絜在爼維聖饗帝維孝饗親皇乎備矣有事上春金枝中植廣樂四陳陟配在京降德在民奔精昭夜髙燎煬晨月御案節星驅扶輪百神翳其備降皇剡剡其􅀭靈羲和司日顔倫奉輿奮六經以攄頌酌允鑠肴樂胥歌投頌吹合雅淳濯饗醴春官條頌祇之書獻祭天之紀大孝備矣休德昭明髙張四縣樂充宫庭金支秀華庶旄翠旌七始華始肅倡和聲神來宴娭熙事備成清思聈眑經緯冥冥大矣孝熙四極爰輳王侯秉德其鄰翼翼行樂交逆簫勺羣慝孝奏天儀師象山則蠻夷竭歡象來致福孔容翼翼子孫保光世曼壽放􅜜震澹虞至旦承靈億靈寖鴻長瑄璧縝㮚權火配藜毛牷既疈椒馨爰糈神之出排玉房神之行旌容容騎沓沓穆將愉兮上天之縡佻正嘉吉以候景至佳氣焜于樵蒸美光流于陔陛肸飾鸞路涓熙紫壇縟儀豐藻燕神億明風恬星輝乾熙坤恬協泰齊豫天地開除月星明穊乾端坤倪軒豁呈露惟聖人為能饗帝孝子為能饗親挹太清秩羣望日曜彤精天澄翠色樂懸六代禮備三古奠惟蒼璧藉用白茅萬靈禔祉三辰合慶五畤昭鬯六宗彛序日月宣華卿雲流靄鍾石昭融就陽之位如日之升孝奏而日月光靈斿而風馬下本陶秸以致其忱合羶薌以達其氣望秩羣祀懷柔百神九賔相儀百神受職六宗隨兆五緯陪營我粢既絜我酌惟明百神警衞桂燎蕭脂日下奉圖鮮虞守燎彫禾飾斚翠羽承罍星陳千仗之衞嶽峙重壇之陔列耀秀華凝芳都荔羽旄四合陔陛參登上璧左琮之華合祛而信祝祖蕝宗題之次更侑而迪嘗采壇紺席歴吉習祥龍旂耳耳鷺序振振布蘭之齊爇蕭之馨躬接神於紫幄之次如坐拜於交門之前斗杓直子日至以長禮具樂備千官宿裝皇帝齊祓氊案乃張服則大裘薦鄙亨鬺器用陶匏莫不質良犢以繭栗純忱是彰田燭晰晰爟火煌煌升降祼獻明德馨香天官列宿五嶽河江罔不順序從祀其旁百神受職通乎肸蠁禮成而退隤祉穰穰瑞景和風神心如答乗玉輅駕蒼虬搢方珽服大裘旌旗霧卷冠蓋雲浮覆玉葉之卿雲昭扶桑之初日揖羣望以咸秩列衆靈以備祀幄帟雲黕罍爼鱗次金鏡光耀玉燭融明萬玉鏘鏘龍駕四牡鸞旂九斿陟降既周燎煙始升奔星走虹奉璧薦牲開閶闔兮闢清都后帝燕兮百神愉圓錫蓋兮方獻輿岳輸固兮溟效濡放􅜜靈斿來顧來寧蕙肴蒸兮蘭藉奠桂酒兮椒漿㫖酒令芳籩豆有楚建表蕝設郊宫田燭置權火通六瑚賁室八羽華庭天儀穆穆我有馨明無愧史祝序神腏食用蠲大事習嵗維祥乾端澄霽冬序曣温其奉粢盛豐年之賜其陳牲醴民力之存居歆在上降監如答淳濯圭絜我鐘欽欽我舞俁俁天妥於坐百靈來序禮敬敕備求牛周禮牛人凡祭祀共其享牛求牛霽暘告旦祥飈掠塵從我髦士來祇精禋御史肅吏司馬飾兵雲流日行海運天聲弛威弧戢天戈兮滅蚩尤而折欃槍執飛亷圉商羊兮羲和獻其光明􅀱景初至載秩元祀奉祼圭而先祖聽奠瑄玉而神示格我將我享如幾如式帝臨中壇四方承宇登成甫田百鬼迪嘗惟泰元尊媪神蕃釐鸞路龍鱗罔不肸飾嘉籩列陳庶幾宴享㳙選休成天地並况展詩應律鋗玉鳴飾玉梢以舞歌星留俞塞隕光照紫幄珠熉黄月穆穆以金波日華燿以宣明兆蒙祉福滇滇髙斿休嘉砰隠象載昭庭雅聲逺姚神安坐鴹吉時神嘉虞申貳觴璧玉精垂華光雷電尞勺椒漿靈已醉馮蠵切和河龍供鯉百官濟濟各敬厥事旌容容騎沓沓靈連蜷兮既㽜皇剡剡其􅀭靈八騎􅀭衡雙龍翼葢呵風伯令戒道制𤣥㝠使司律設天宗之六席授長發之二球迴夷庚之翠輦夀觴霞舉福穰穰於絳闕芳菲菲於玉斚旗掩月車奮雷騫七曜燭九陔天清地晏夜星騰晰和景晏温卿靄絪緼假廟之夕象載昭察升燎之際衆星留俞産百斯祥裒萬斯禧焫膋蕭延四方九重開靈之斿垂惠恩鴻祐休靈之車結𤣥雲駕飛龍羽旄紛靈之下若風馬牲繭栗粢盛香尊桂酒賔八鄉靈安留吟青黄德修薦薄吉必泰來古者壇塲有常處尞禋有常用犧牲玉帛雖備而財不匱車輿臣役雖動而用不勞每舉其禮助者歡説大路所歴黎元不知其德足以昭其馨香其惠足以同其民人獻享之精交神積和之氣塞明克羞饋祀靈氶于旅克堪用德惟典神天帝王之事莫大乎承天之序承天之序莫重於郊祀合祛於天地神祇祗戒精專以接神明天地况施著見景象屑然如有聞上獵三靈之流玉海卷九十三
