body:
  text: 玉海卷三十五宋王應麟撰藝文易隋經籍志昔宓羲氏始畫八卦以通神明之徳以類萬物之情盖因而重之為六十四卦及乎三代實為三易夏曰連山殷曰歸藏周文王作卦辭謂之周易周公又作爻辭孔子為彖象繫辭文言序卦説卦雜卦而子夏為之𫝊及秦火書周易獨以卜筮得存唯失説卦三篇後河内女子得之漢初傳易者有田何何授丁寛寛授田王孫王孫授沛人施讐東海孟喜琅邪梁丘賀由是有施孟梁丘之學又有東郡京房自云受易於梁國焦延壽别為京氏學嘗立後罷後漢施孟梁丘京氏凡四家並立而𫝊者甚衆漢初又有東萊費直𫝊易其本皆古字號曰古文易以授琅邪王璜璜授沛人髙相相以授子康及蘭陵毋將永故有費氏之學行於人間而未得立後漢陳元鄭衆皆傳費氏之學馬融又為之傳以授鄭𤣥𤣥作易注荀爽又作易𫝊魏代王肅王弼並為之注自是費氏大興髙氏遂衰梁丘施氏髙氏亡於西晉孟氏京氏有書無師梁陳鄭𤣥王弼二注列於國學齊代唯𫝊鄭義至隋王注盛行鄭學浸微今殆絶矣歸藏漢初已亡案晉中經有之唯載卜筮不似聖人之㫖以本卦尚存故取冠於周易之首以備殷易之缺伏河圖重卦神農重卦説易繫辭河出圖洛出書聖人則之正義春秋緯云河以通乾出天苞洛以流坤吐地符河龍圖發洛龜書感河圖有九篇洛書有六篇孔安國以為八卦九疇畧例邢璹序河龍負圖皇畫卦釋文序伏因河圖而畫八卦因而重之為六十四正義伏雖得河圖復仰觀俯察以相參正然後畫卦繫辭曰八卦成列象在其中矣因而重之爻在其中矣然重卦之人諸儒不同凡有四説王輔嗣等以為伏重卦鄭𤣥之徒以為神農孫盛以為夏禹史遷等以為文王乾鑿度云垂皇策者用蓍在六爻之後即伏已重卦下繫云書契取夬伏羲有書契則有夬卦今依輔嗣朱震曰論重卦者六家王弼虞翻曰伏羲鄭康成曰神農孫盛曰夏禹揚雄司馬遷曰文王孔頴達陸希聲以弼為是歸藏初經八卦六爻則知因而重之者伏羲也重京房引夫子曰神農乎八純禮運河出馬圖正義案中候握河紀堯時受河圖龍銜赤文緑色龍形象馬又云伏氏有天下龍馬負圖出於河遂法之畫八卦書河圖在東序注河圖八卦伏羲氏王天下龍馬出河遂則其文以畫八卦論語河不出圖吾已矣夫文心雕龍云河不出圖夫子有歎陳於東序歴代寳傳漢五行志劉歆以為虙羲氏受河圖則而畫之八卦是也河圖雒書相為經緯漢百官表易叙伏羲龍師名官張晏注庖羲氏將興神龍負圖而至因以命師與官郊祀志三代河洛出圖書不言宓羲元光詔河出圖不言名氏魏志易博士淳于俊曰包羲因燧皇之圖而制八卦神農演之為六十四卦隋志緯書河圖二十卷梁河圖洛書二十四卷亡河圖龍文一卷文選注引之其書出於前漢有河圖九篇洛書六篇云自黄帝至周文王所受本文又别有三十篇云自初起至于孔子九聖之所増演以廣其意又有七經緯三十六篇並云孔子所作并前合為八十一篇云云漢光武以圖䜟興遂盛行於世光武封禪文載河圖赤伏符㑹昌符今古篇雒書甄曜度傳班固傳注引河圖曰地有四瀆以出圖書蔡邕注引河圖祕徴篇五行類神農重卦經二卷通鑑外紀伏造八卦始作三畫以象二十四氣因而重之爻象備矣史記索隠炎帝重八卦為六十四卦淮南子伏羲為之六十四變周室増以六爻子華子論河圖云二與四抱九而上躋六與八蹈一而下沈戴九而履一據三而持七五居中宫數之所由生一從一横數之所由成列子易變而為一一變為七七變為九九變者究也復變為一古三墳伏羲氏皇策辭曰惟天至仁於草生月天雨降河龍馬負圖神開我心古史考庖羲作卦始有筮六藝論易者隂陽之象天地所變化政教所生自人皇初起即遂皇也東京賦龍圖授羲龜書𢌿姒揚雄覈靈賦大易之始河序龍馬雒貢龜書見文選注乾鑿度入戊午蔀二十九年受録應河圖通卦驗言文王得赤烏而演易又云河圖八文易變而為一一變而為七七變而為九九者氣變之究也乃復變而為一九宫數見天文禮緯含文嘉伏羲徳合上下天應以鳥獸文章地應以河圖洛書則而象之乃作八卦孔安國馬融王肅姚信云伏羲得河圖而作易書目易龍圖一卷陳􅅮撰序曰龍馬始負圖出於羲皇之代在太古之先今存已合之位或疑之以陳其未合之數耶於仲尼三陳九卦之義探其㫖所以知之且龍圖本合則聖人不得見其象所以天意先未合而形其象聖人觀象而明其用是龍圖者天散而示之伏羲合而用之仲尼黙而形之始龍圖之未合也惟五十五數上二十五天數也中貫三五九外包之十五盡天三天五天九并十五之用後形一六無位又顯二十四之為用也所謂天垂象矣下三十地數也亦分五位皆明五之用也十分而為六形坤之象焉六分而幾四象七九八六地六不配在上則一不用形二十四在下則六不用亦形二十四後既合也天一居上為道之宗地六居下為氣之本天三幹地二地四為之用三若在陽則避孤陰在隂則避寡陽大矣哉龍圖之變今述其梗槩焉闗子明曰河圖之文七前六後八左九右朱文公曰伏羲仰觀俯察見隂陽有奇耦之數故畫一奇以象陽畫一耦以象隂見一隂一陽有各生一隂一陽之象故自下而上再倍而三以成八卦三畫已具八卦已成則又三倍其畫以成六畫而於八卦之上各加八卦以成六十四卦河圖以五生數統五成數而同處其方洛書以五奇數統四耦數而各居其所皆以五為中又曰河圖與易之天一至地十者合而載天地五十有五之數則固易之所自出也洛書與洪範之初一至次九者合而具九疇之數則固洪範之所自出也八卦者河圖四正四隅之位洛書四實四虚之數也又曰河圖之位一與六共宗而居乎北二與七為用而居乎南三與八同道而居乎東四與九為友而居乎西五與十相守而居乎中劉牧以九數四十五為河圖朱震因之朱文公以五位五十五為河圖董銖曰天地之數五五者數之祖也河圖自天一至地十積數凡五十有五而其五十者皆因五而後得故五虛中洛書自一五行至九五福積數凡四十有五而其四十者亦皆因五而後得故五亦虛中大衍之數五十即此五數衍而乘之各極其十則合為五十也康節邵氏曰圓者星也厯紀之數其肇於此乎方者土也畫州井田之法其倣於此乎圓者河圖之數方者洛書之文故犧文因之以造易禹箕叙之而作範也張行成曰河圖九數五居中央而八卦應其八位伏羲八卦易之體也成體要中故乾上坤下著隂陽之已定文王八卦易之用也致用自初故離南坎北取隂陽之始交河圖無十散為九位洛書有十聚為五類無十者地未成形造物之初天之氣數也故圓以象天有十者地已成形生物之後地之形數也故方以應地八卦數偶用之體也九疇數奇體之用也河圖九而卦止於八以五代九則八數方而奠位然中虛天九以代八者之用則體無非用矣洛書十而疇止於九法十用五則九數圓而運行然中建皇極以幹八卦之體則用無非體矣先天圖外圓為天内方為地圓者河圖之數也方者洛書之文也繫辭曰聖人則之畫易之初葢兼河洛之數備方圓之理矣惟變易之道以天為宗大禹重衍洪範以地承天如揚雄作𤣥贊大易也天究于九地盡于十九十者天地之終也究則不中盡則無變聖人弗用也河圖之數四十五八卦之數三十六一八二七三六四五交數皆九非不用九也藏九于八也洛書之數五十五九疇之數四十五始于五行終于六極實有十事非不用十也藏十于九也以體藏用則用不窮以用藏體則體不窮此天地變化之機聖人用數之法也朱震曰河圖之數四十有五而五十之數具洛書之數五十有五而五十之數在焉惟十即五也唐仲友曰河圖雒書易範兼取之矣河圖之數四十五四象也四象奠方八卦成列而居中以貫之者五也洛書之數五十五五行也以奇生者以耦成以耦生者以奇成而得位以合之者亦五也三五以變錯綜其數者易之取河圖也五位相得而各有合易之取洛書也總其凡則自一至九其數四十五範之取河圖也總其目則自行至極其數五十有五範之取洛書也易之中爻範之皇極則貫象數而通之者中而已河圖象也天五錯綜而地十之數隠於錯綜之間洛書數也天五有合而地十之數顯於有合之際隠顯不同而土之為十五者常自若也大衍之數五十㑹隠顯而通象數圖顯其十書隠其五參天兩地隠於術數之外顯於生爻之中聖人所以則圖書而妙象數也月令河圖十之數也故土藏十主盛徳言故四象皆舉成以見生土之盛徳不以成數言者非土之盛而分寄於四象春八夏七中央五秋九冬六畫井田八家皆私百畝公井居中三三為九以一役八制軍法陳法四頭八尾中為握奇奉時令咸出於此繫辭曰天一至地十天數五地數五位相得而各有合天數二十有五地數三十凡天地之數五十有五此河圖之數也自漢孔安國劉歆魏闗子明有宋邵雍皆謂十為圖九為書至劉牧始兩易其名以九為圖十為書而朱震諸家因之朱震以列子為證朱文公復之悉從其舊然漢書謂八卦九章相為表裏朱文公云圖亦可以為書書亦可以為圖又云河圖洛書皆聖人所取以為八卦者而九疇亦并出焉以其象觀之則虛其中者所以為易實其中者所以為洪範也闗氏洞極經以九數為洛書應九疇而皇極居中十數為河圖應大傳天一至地十河圖九宫洛書五行或曰先天圖為河圖五行生成數為洛書進或曰大衍之數五十退參倚之數五而為河圖之數皇極之數五而為洛書之數伏羲十言教左傳定四年正義云易曰伏羲作十言之教曰乾坤震巽坎離艮兑消息康成曰云云無文字謂之易黄帝河圖晉天文志黄帝受河圖始明休咎魏志注黄帝受命風后受河圖河圖挺佐輔云天老告黄帝曰河有龍圖洛有龜書帝游翠媯之川有大魚出魚没而圖見詩正義六藝論云太平嘉瑞圖書之出必龜龍銜負焉黄帝堯舜周公是其正也堯河圖洛書詩生民疏中候稷起注云堯受河圖洛書后稷有名録苖裔當王握河紀云堯即政七十年受河圖其末云斯封稷契臯陶賜姓號注云或云七十二年夏連山宓戲連山周禮春官大卜掌三易之法一曰連山經卦皆八别皆六十有四注易者揲蓍變易之數可占者連山似山出内氣也杜子春云連山宓戲疏鄭易贊云夏曰連山皇甫謐記亦云夏人因炎帝曰連山連山易其卦以純艮為首艮為山山上山下是名連山雲氣出内於山夏以十三月為正人統艮漸正月故以艮為首􅗺人掌三易以辨九􅗺之名一曰連山唐志連山十卷司馬膺注梁元帝連山三十卷五行類易隋劉炫偽造連山魯史記古三墳書有連山易正義鄭𤣥云夏曰連山象山之出雲連連不絶孫盛以為夏禹重卦帝王世紀連山易曰禹娶塗山之子名曰攸女生余水經注連山易曰有崇伯鯀伏于羽山之野殷歸藏黄帝歸藏殷坤乾周禮大卜三易二曰歸藏經卦皆八别皆六十四注萬物莫不歸而藏於其中杜子春云歸藏黄帝疏鄭易賛云殷曰歸藏案今歸藏坤開筮帝堯降二女為舜妃又見節卦云殷王其國常毋谷盖子春之意宓戲皇帝造其名夏殷因其名以作易是以皇甫謐云殷人因黄帝曰歸藏歸藏易以純坤為首坤為地萬物莫不歸而藏於其中殷以十二月為正地統故以坤為首􅗺人掌三易同上禮運觀殷道吾得坤乾焉注得隂陽之書其書存者有歸藏正義殷易以坤為首唐志歸藏十三卷司馬膺注隋志歸藏十三卷晉薛氏注歸藏漢初已亡案晉中經有之唯載卜筮不似聖人之㫖春秋正義以為偽妄之書非殷易崇文目三卷漢初有歸藏已非古經今書三篇不可究矣中興書目晉太尉參軍薛貞注今但存初經齊母本蓍三篇文多缺亂不可訓釋史記正義七録云歸藏載卜筮之書雜事雜卦正義聖人因時隨宜不必皆相因襲故歸藏名卦之次亦多異於時文心雕龍歸藏之經大明迂怪乃稱羿斃十日常娥奔月又見後毛漸三墳書有歸藏乾坤書正義引歸藏易云羿彃十日爾雅注引兩壺兩羭疏成湯所作也初學記引啓筮文選注引易歸藏曰君子戒車小人戒徒又引夏啓為璿臺又引歸藏殷筮月賦注亦引歸藏莊子釋文引歸藏曰昔穆王子筮卦於禺强御覽引歸藏曰有白雲自蒼梧入大梁昔女媧筮張雲幕枚占之曰吉昭昭九州日月代極平均土地和合四國黄神將戰筮於巫咸明夷曰昔夏后啓乘龍飛以登于天睪陶占之曰吉朱震易叢説引歸藏之乾小畜周易禮太卜三易三曰周易經卦皆八别皆六十四疏鄭雖不解周易其名周易者連山歸藏皆不言地號以義名易則周非地號以周易以純乾為首乾為天天能周帀於四時故名易為周周以十一月為正天統故以乾為首繫辭易之興也其於中古乎正義連山起於神農歸藏起於黄帝周易起於文王及周公此謂周易也繫辭又曰四營而成易十有八變而成卦八卦而小成引而伸之觸類而長之天下之能事畢矣正義每一爻有三變謂初一揲不五則九第二揲不四則八第三揲亦不四則八若三者俱多為老隂俱少為老陽兩少一多為少隂兩多一少為少陽三變既畢乃定一爻朱文公曰四營為分二掛一揲四歸奇也易變也謂一變也三變成爻十八變則成六爻也九變而成三畫得内卦已成六爻而視爻之變與不變以為動静則一卦可變而為六十四卦以定吉凶凡四千九十六卦也左傳莊二十一年周史有以周易見陳侯者筮之遇觀之否注易之為書六爻皆有變象又有互體聖人隨其義而論之正義易之為書揲蓍求爻重爻為卦爻有七八九六七八者六爻皆不變卦下總為之辭曰彖九六者當爻有變每爻别為其辭曰象不變者聚而為彖其變者散而為象二至四三至五兩體交互各成一卦先儒謂之互體巽變為乾六四變為九四從二至四互體有艮之象洪範通龜筮以同卿士之數昭二年韓宣子見易象注上下經之象辭左傳後序汲冢古書周易上下篇與今同别有隂陽説無彖象文言繫辭乾鑿度孔子曰陽三隂四位之正也易卦六十四分而為上下象隂陽也陽道純而奇故上篇三十以象陽隂道不純而偶故下篇三十四以法隂正義案前漢孟喜易本云分上下二經上經三十下經三十四是孟喜之前已題經字子夏傳分為上下二篇未有經字揚子易始八卦而文王六十四其益可知也史記司馬季主曰文王演三百八十四爻越王勾踐倣文王八卦漢志蓍龜十五家有周易三十八卷朱震曰文王作易以乾坤坎離為上篇之用以艮兑震巽為下篇之用邵雍曰乾坤縱而六子横易之本也震兑横而六卦縱易之用也乾坤天地之本離坎天地之用是以易始於乾坤中於離坎終於既未濟而泰否為上經之中咸恒為下經之首皆言乎其用也周三易春官太卜掌三易之法一連山始艮二歸藏先坤後乾三周易始乾其經卦皆八别六十有四以八命賛三易之占太卜又掌三兆玉瓦原注卦别之數同其名占異每卦八别者重之數疏夏殷易以七八不變為占周易以九六變者為占襄九年𫝊云穆姜筮之遇艮之八注云爻有初六九三六四六五上九唯六二不變連山歸藏之占以不變者為正但周易占九六而云遇艮之八是據夏殷不變為占鄭答趙商云非無明文改之無據故著子春説而已近師皆以為夏殷周􅗺人掌三易以辨九􅗺之名同上疏卜用三龜􅗺用三易龜人注世本作曰巫咸作筮疏曰易伏為之但未有揲蓍之法至巫咸乃教人為之易正義三易鄭𤣥易賛及易論云夏殷周周易言易道周普無所不備鄭𤣥云易一名而含三義易簡不易變易案世譜等羣書神農一曰連山氏列山氏黄帝一曰歸藏氏並是代號周易以文王所演故謂之周易猶周書周禮題周以别餘代故易緯云因代以題周是也一説卦辭爻辭並文王作二以為爻辭多文王後事王用亨于岐山箕子之明夷馬融陸續等以為卦辭文王爻辭周公今依而用之彖上下象上下繫上下文言説卦序卦雜卦十翼之辭孔子所作士冠禮筮人執筴注有司主三易者儀禮疏春秋演孔圖孔子修春秋九月而成卜得陽豫之卦宋均注夏殷卦名晉語公子重耳筮得貞屯悔豫皆八夏殷以不變為占周易以變為占三人各占一易三占從二大卜䟽又曰大卜所掌先二兆次三易次三夢者筮短龜長夢以叶卜筮故以先後為次左𫝊襄九年遇艮之八史曰是謂艮之隨穆姜曰是於周易曰云云注周禮太卜掌三易然則雜用連山歸藏周易三易皆以七八為占故言遇艮之八史疑占易不利更以周易占變爻正義洪範言三人占則從二人之言孔安國云夏殷周卜筮各異三法並卜是言筮用三易之事也七為少陽八為少隂其爻不變九為老陽六為老隂其爻皆變周易占九六之爻𫝊之諸筮皆是占變爻連山歸藏占七八之爻二易並亡不知實然以否穆姜司空季子並於遇八之下别言周易知此遇八非周易也洪範三人占則從二人之言注夏殷周卜筮各異三法並卜從二人之言正義杜子春云三易皆非夏殷而孔意必以三代夏殷周相因之法子春之言孔所不取鄭𤣥與孔同三代異法三法並卜法有一人故三人也方箕子時安得遽有周易乎周禮先筮後卜春秋時先卜後筮内卦為貞外卦為悔易通卦驗遂皇燧人始出握機矩表計寘其刻日蒼牙通靈伏羲昌之成文王孔演命明道經虙羲作易仲命徳維紀衡仲謂四仲之卦震兌坎離也維者四角之卦艮巽坤乾也周文増通八八之節轉序三百八十四爻以繫正命之瑞故正其本而萬物理失之毫釐差以千里春秋正義崔靈恩以為筮必以三代之法故大卜掌三兆三易儀禮特牲少牢筮皆旅占卜徒父筮之其卦遇蠱不引易文注云卜人而用筮不能通三易之占據所見雜占而言之劉炫云成十六年筮卦遇復亦是雜占則筮法亦有雜占不必皆取易辭子華子出於一立於兩成於三連山以之而呈形歸藏以之而御氣大易以之而立數桓譚新論連山八萬言歸藏四千三百言通志連山用三十六策歸藏用四十五策周易用四十九策三皇太古書三卷柴霖𫝊亦謂之三墳曰山氣形天皇伏戲氏本山墳而作易曰連山人皇神農氏本氣墳而作易曰歸藏地皇黄帝氏本形墳而作易曰坤乾雖不畫卦而其名皆曰卦爻大象連山之大象有八曰君臣民物隂陽兵象而統以山歸藏之大象有八曰歸藏生動長育止殺而統以氣坤乾之大象有八曰天地日月山川雲氣而統以形皆八而八之為六十四其書漢魏不𫝊至元豐中始出于唐州比陽之民家世疑偽書然其文古其辭質而野其錯綜有經緯恐非後人之能為也緯書猶見取於前世況此乎姚信曰連山氏神農得河圖夏人因之曰連山歸藏氏黄帝得河圖商人因之曰歸藏伏羲氏得河圖周人因之曰周易王洙曰山海經云伏羲氏得河圖夏后因之曰連山黄帝氏得河圖商人因之曰歸藏列山氏得河圖周人因之曰周易斯乃杜子春之所慿姚信之言所從𫝊者異耳朱震曰歸藏初經者伏羲初畫八卦因而重之者也其經初乾初奭坤初艮初兑初犖坎初離初釐震初巽卦皆六畫即此八卦也八卦既重爻在其中薛氏曰昔神農氏既重為六十四卦而初經更本包羲八卦盖八卦成列而六十四具焉神農氏因之也繫辭曰神農耒耨之利盖取諸益王輔嗣以為伏重卦鄭康成以為神農重卦其説源於此子曰天地定位乾與坤對山澤通氣艮與兑對雷風相薄震與巽對水火不相射離與坎對而説卦别象次序皆初卦也連山首艮者八風始於不周實居西北之方七宿之次是為東壁營室於辰為亥於律為應鍾於時為立冬此顓頊之厯所以首十月也無闔則無闢無静則無動此歸藏所以先坤歟又曰伏羲畫卦乾上坤下立天地之位歸藏先坤後乾首萬物之母連山乾始於子坤始於午至周易尊乾卑坤其體乃定艮震巽離坤兊乾坎連山之序也而易兼用之張行成曰伏羲始畫八卦是為先天有圖象而未有書夏曰連山天易也商曰歸藏地易也有法數而未有書文王曰周易人易也始有書矣伏羲先天示易之體故孔子謂之作八卦文王後天明易之用故子雲謂之重六爻程迥曰古之筮者兼用三易之法衛元之筮遇屯曰利建侯是周易或以不變者占季友之筮遇大有之乾曰同復于父敬如君所此固二易辭也既之乾則用變矣是連山歸藏或以變者占葉氏三易辯曰三易經卦皆八其别皆六十四經者其常别者其變也伏羲神農黄帝堯舜取離益等十有三卦文王但為六十四卦之爻辭爾其為六十四者自伏羲以来未之有異也周易象左𫝊昭二年春晉韓宣子来聘觀書太史氏見易象與魯春秋注易象上下經之象辭易象春秋文王周公之制四象繫辭易有太極是生兩儀兩儀生四象四象生八卦正義七八九六之謂朱子曰孔子發明伏羲畫卦自然之形體次第康節曰一分為二二分為四四分為八八分為十六十六分為三十二三十二分為六十四明道以為加一倍法一二三四五天地生數也五中數故不用六七八九十天地成數也十全數故不用四象之書成而以一二三四紀其次九八七六積其實四象者河圖之一合六二合七三合八四合九洛書之一含九二含八三含七四含六也又曰一每生二自然之理也易者隂陽之變太極者其理也兩儀者始為一畫以分隂陽四象者次為二畫以分太少八卦者次為三畫而三才之象始備太陽居一而含九少隂居二而含八少陽居三而含七太隂居四而含六此六七八九之數所由定也一畫為儀二畫為象三畫為卦則八卦備矣此上若旋次各加隂陽一畫積至三重再成八卦者八方有六十四卦之名揲蓍之法三變之中掛扐四以奇偶分之然後爻之隂陽可辨又於中各以老少分之然後爻之變與不變可分所謂用九用六者此也乾鑿度孔子曰易始於太極太極分而為二七九八六故生天地天地有春秋冬夏之節故生四時四時各有隂陽剛柔之分故生八卦八卦成列天地之道立雷風水火山澤之象定矣鄭康成言四象曰布六於北方以象水布八於東方以象木布九於西方以象金布七於南方以象火劉禹錫辯易九六論曰一行大衍論云三變皆剛太陽之象三變皆柔太隂之象一剛二柔少陽之象一柔二剛少隂之象少陽之剛有始有壯有究少隂之柔有始有壯有究因綜四象之變而成八象焉八象之位而八卦之本列矣郭氏曰四象者九八七六隂陽老少之象邵子曰太極既分兩儀立矣陽上交於隂隂下交於陽而四象生矣陽交於隂隂交於陽而生天之四象剛交於柔柔交於剛而生地之四象八卦相錯而後萬物生焉先天圖乾一兑二離三震四巽五坎六艮七坤八歐陽氏明用曰乾爻七九九變而七無為易道占其變曰用九釋所以不用七坤爻八六六變而八無為曰用六釋所以不用八於乾坤見之其餘可知朱子發曰七八不變六九變歸藏連山用七八易用六九而七八在其中八索尚書序八卦之説謂之八索孔子讃易道而黜八索正義以易八卦為主六十四卦三百八十四爻皆出於八卦就八卦求其理則萬有一千五百二十策天下之事得故謂之索非一索再索而已左𫝊左史倚相能讀三墳五典八索九丘國語史伯曰平八索以成人注謂八體以應八卦也禮疏三王之法賈逵云八王之法一作素王張平子説周禮八議之刑索空空設之馬融説八卦杜預云古書名勾微曰五帝時名八索坤三索於乾而得三男乾三索於坤而得三女遂成八卦八八相索廣生六十四孔子十翼易大傳正義十翼孔子所作上彖下彖上象下象上繫下繫文言説卦序卦雜卦先儒以孔子十翼之次乾坤文言在二繫之後説卦之前以彖象附上下二經為六卷則上繫第七下繫第八文言第九説卦第十輔嗣以文言分附乾坤二卦故説卦為第九韓康伯云序卦之所明非易之緼也鄭衆賈逵等以為卦下之彖辭文王所作爻下之象辭周公所作乾郭雍以文王為卦辭孔子為彖辭王弼移文言于坤因以解四徳近世古書亡缺鄭氏所注存第九總文言説卦序卦雜卦四篇學者不能知其次乃謂之鄭氏文言揚雄曰宓犧氏緜絡天地經以八卦文王附六爻孔子錯其象而彖其辭然後發天地之藏定萬物之基張行成曰歸藏首坤以隂為一也周易先乾以陽為一也二者不同孔子通之繫辭曰闔戸謂之坤闢戸謂之乾坤先於乾歸藏義也天尊地卑乾坤定矣乾先於坤周易義也至序卦剝受之以復夬受之以姤隂陽迭用混而為一也凡一隂一陽之卦各六皆自復姤而來二隂二陽之卦各十有五皆自臨遯而來三隂三陽之卦各二十皆自泰否而來四隂四陽之卦各十有五皆自大壯觀而來五隂五陽之卦各六皆自夬剝而來史記太史公論六家要指曰易大傳曰天下一致而百慮同歸而殊塗注張晏曰大𫝊謂易繫辭郊祀志劉向對曰易大傳曰誣神者殃及三世易正義繋辭焉以斷其吉凶以盡其言是繋屬其辭於爻卦之下則上下二篇經辭是也夫子申説上下二篇總曰繫辭上篇十二章下篇九章儒林傳序孔子晚而好易讀之韋編三絶而為之傳子夏易傳釋文序錄子夏易傳三卷卜商夏釋文引子傳七畧云漢興韓嬰傳中經簿錄云丁寛所作張璠云或馯臂子弓所作薛虞記虞不詳何許人唐㑹要開元七年三月六日詔子夏易𫝊近無習者令儒官詳定四月七日劉子𤣥議曰案漢志易有十三家無子夏作𫝊者至梁阮氏七録有子夏易六卷或云韓嬰作或云丁寛作司馬貞議曰案劉向七畧有子夏易𫝊但此書不行已久今所存多失真本又荀朂中經簿云子夏𫝊四卷或云丁寛所作是先達疑非子夏矣其書錯謬無益後學不可帖正經五月五日詔子夏𫝊逸篇令帖易者停國史志子夏易𫝊十卷假託真子夏𫝊一行所論是然殘缺中興書目十卷或題卜子夏按隋志周易二卷魏文侯師子夏𫝊已殘闕梁六卷唐志卜商𫝊二卷今乃十卷案陸徳明音義所引與今本間有合者若云地得水而柔水得地而流故曰比今本作地藏水而澤水得地而安但小異爾至束帛戔戔作􅋊􅋊又云五匹為束三𤣥二纁象隂陽今本並無此文盖後人附益者多自唐已無全文諸儒請不帖正經晁氏志此書約王弼注為之者止雜卦十卷景迂云唐張弧偽作正義子夏𫝊元始也亨通也利和也貞正也家語孔子讀易至損益喟然而嘆子夏避席問云云孫坦曰世有子夏傳以為親得孔子之緼觀其辭畧而不粹間或取左氏春秋𫝊語證之晚又得十八占稱天子曰縣官嘗疑漢杜子夏之學及讀杜傳見引明夷對策疑始釋然不然班固叙儒林何以言易始於商瞿子木而遽遺卜商也哉程迥曰子夏易傳京房為之箋先儒疑非卜商作近世有陋儒用王弼本為之注亦託云子夏凡先儒所引此本皆無之朱震曰孟喜京房之學其書槩見於一行所集大要皆自子夏傳所出晁説之云今號為子夏易傳者崇文總目亦斥其非是而不知其所作之人予知其為唐張弧之易也子夏序詩傳禮公羊髙親受經焉孔子以春秋屬之尚書大傳引子夏曰云云子夏造䣛親受春秋夫子讀易至韋編三絶鐵擿三折矧未及將聖者乎漢易十三家三家易經九師説古文易經志易經十二篇上下經及十翼施孟梁丘三家易𫝊周氏二篇字王孫服氏二篇光齊劉向别録云人號服光楊氏二篇何字叔元蔡公二篇衛人事周王孫韓氏二篇嬰王氏二篇同丁氏八篇寛字子襄梁人古五子十八篇自甲子至壬子説易隂陽淮南道訓二篇淮南王安聘明易者九人號九師説古雜八十篇雜災異三十五篇神輸五篇圖一孟氏京房十一篇災異孟氏京房六十六篇五鹿充宗畧説三篇京氏段嘉十二篇唐志孟喜京房章句十卷章句施孟梁丘氏各二篇凡易十三家二百九十四篇易道深矣人更三聖世厯三古漢興田何𫝊之訖于宣元有施孟梁丘京氏列學官而民間有費髙二家之説劉向以中古文易經校施孟梁丘經或脱去无咎悔亡字唯費氏經與古文同漢言易者六家費氏最近古最見排擯千載之後巋然獨存豈非天哉釋文序録孟喜章句十卷無上經七録云又下經無旅至節無上繫京房章句十二卷七録云十卷一卷目文中子九師興而易道微文選七啓注引九師道訓思𤣥賦注引淮南九師道訓曰遯而能飛吉孰大焉劉向别録曰所校讐中易𫝊淮南九師道訓除複重定著十二篇淮南王聘善為易者九人從之採獲故中書題曰淮南九師書所校讐中古五子書除複重定著十八篇分六十四卦著之日辰自甲子至壬子凡五子初學記商瞿受易孔子五𫝊而至田何漢之易書盖自田何始何而上未嘗有書易家著書自王同始不過訓詁舉大義云耳太史公受易於楊何魏相明易經有師法漢易四家博士前儒林傳初易唯有楊孝宣世立施孟梁丘甘露三年立梁丘元帝立京氏後𫝊田何授丁寛寛授田王孫王孫授施孟梁丘由是有施孟梁丘之學又京房受於焦延壽别為京氏學費直授王璜為費氏學本以古字號古文易又髙相授子康及毋將永為髙氏學施孟梁丘京氏四家皆立博士費髙二家未得立光武中興立五經博士易有施孟梁丘京氏蘇竟平帝世以明易為博士施氏前𫝊施讐從田王孫田王孫為博士復從卒業梁丘賀薦讐詔拜讐為博士張禹從施讐受易甘露中對易及論語大義久之試為博士彭宣治易事張禹舉為博士孟氏前𫝊博士闕人薦孟喜上聞喜改師法遂不用喜授白光翟牧皆為博士後𫝊洼丹建武初以孟氏易為博士任安受孟氏易除博士梁丘氏前𫝊梁丘賀從京房更事田王孫子臨代五鹿充宗為少府充宗授士孫張為博士朱雲從博士白子友受易時少府五鹿充宗為梁丘易自宣帝時善梁丘氏説元帝好之欲考其異同令充宗與諸易家論雲抗首而請既論難連拄五鹿君繇是為博士後𫝊范升習梁丘建武二年遷博士辭曰臣與博士梁恭山陽太守吕羌俱修梁丘願推博士以避恭羌不許時尚書令韓歆上疏欲為費氏易左氏春秋立博士四年正月朝公卿大夫博士見於靈䑓帝曰范博士可前平説升對云云與歆辨難退而奏曰近有司請置京氏易博士羣下執事莫能據正京氏既立費氏怨望左氏春秋亦希置立京費已行次復髙氏春秋之家又有騶夾五經奇異並復求立乖戾分爭云云今費左二學無有本師而多反異疑道不可由疑事不可行張興習梁丘建武中遷博士京氏前傳京房授殷嘉姚平乘𢎞皆為郎博士後𫝊戴慿習京氏易徵試博士樊英習京氏安帝初召為博士郎顗父宗學京氏以博士召之顗𫝊父業晉江左中興大興初唯置王氏博士太常荀崧奏請置鄭易博士不果立崧上疏曰鄭𤣥注其書根源宋元嘉王鄭兩立顔延之為祭酒黜鄭置王漢易𫝊儒林𫝊自魯商瞿受易孔子授魯橋庇庇授江東馯臂馯臂授燕周醜醜授東武孫虞子乘子乘授齊田何及秦禁學易為筮卜之書𫝊者不絶漢興田何授王同周王孫丁寛服生皆著易𫝊數篇四人皆注易傳同授淄川楊何齊即墨成廣川孟但魯周霸莒衡胡臨淄主父偃皆以易至大官要言易者本田何五行志光和元年蔡邕對引易傳周舉引易傳曰陽感天不旋日有郎顗引易𫝊曰公能其事序賢進士後必喜當靁不靁太陽弱也韓嬰言詩亦以易授人推易意而為之𫝊涿郡韓生曰嘗受韓詩不如韓氏易深盖寛饒本受孟喜見韓生更受焉寛饒引韓氏易傳蓺文士心易𫝊見前崇文目田何之易卦象爻彖與文言説卦等離為十二篇而自為章句易之本經也陸澄云易自商瞿之後雖有異家之學同以象數為宗晁説之曰易家著書自王同始同授楊何所謂易楊者是也丁寛授田王孫王孫授施讐孟喜梁丘賀三家皆立學官其子弟顓門者衆後又有京房之學亦得立而學官自楊何始其後有費直髙相之易唯𫝊民間房自謂其學即孟氏學相自言出於丁將軍惟費氏之傳晚而益盛東都陳元鄭衆馬融鄭𤣥荀爽魏王肅王弼皆其人也自肅而上莫敢悖其所𫝊唯弼厭舊喜新擯棄師法攘莊老虛無之論専於人事釋文序録馬融𫝊十卷七録云九卷荀爽注十卷七録云十一卷鄭𤣥注十卷録一卷七録云十二卷劉表章句五卷中經簿録云注易十卷七録云九卷録一卷宋𠂻注九卷七志七録云十卷虞翻注十卷陸績述十三卷七志云録一卷董遇章句十二卷七志七録云十卷王肅注十卷王弼注七卷七志云十卷一注易上下經六卷作易畧例卷又注老子姚信注十卷七録云十二卷王廙注十二卷七志七録云十卷干寳注十卷黄頴注十卷蜀才注十卷范長生尹濤注六卷費元珪注九卷漢易説小章句儒林𫝊丁寛字子襄梁人事田何學成東歸何謂門人曰易以東矣至雒陽復從周王孫受古義號周氏傳景帝時寛為梁孝王將軍號丁將軍作易説三萬言訓故舉大誼而已師古曰故謂經之㫖趣他皆類此今小章句是也志丁氏八篇寛授同郡田王孫王孫授施讐孟喜梁丘賀繇是易有施孟梁丘之學施讐為博士甘露中論石渠授張禹彭宣繇是施家有張彭之學孟喜得易家候隂陽災變書詐言師田生枕喜䣛獨𫝊喜又蜀人趙賓為易飾易文以為箕子明夷萬物方荄兹也釋文劉向云今易箕子作荄滋賓持論巧慧易家不能難皆曰非古法也云受孟喜喜為名之賓死喜因不肯仞博士缺衆人薦喜上聞喜改師法遂不用喜授白光翟牧繇是孟家有翟白之學隋志孟氏易八卷曲臺長孟喜章句梁十卷易唐志十卷袁建武中范升𫝊孟氏易景鸞理施氏作易説良夏恭習孟氏易梁丘賀以筮有應近幸子臨亦入説甘露中奉使問諸儒於石渠臨學精熟専行京房法自别一京房楊何弟子也賀從受易梁丘有士孫張鄧彭祖衡咸之學京房受易梁人焦延壽名贛延壽云嘗從孟喜問易房以為延壽易即孟氏學翟牧白生不肯皆曰非也至成帝時劉向校書考易説以為諸易家説皆祖田何楊叔丁將軍大誼畧同唯京氏為異黨焦延壽獨得隠士之説託之孟氏房授殷嘉姚平乘𢎞繇是易有京氏之學易傳見後漢易家異同朱雲𫝊見上施氏讐從田王孫授梁丘臨張禹禹授彭宣有張彭之學劉昆受施氏易於戴賓建武二十二年授太子諸王小侯子軼𫝊業孟氏喜師田王孫授白光翟牧有翟白之學洼丹世𫝊孟氏觟陽鴻任安范升授楊政袁安祖父良與子京習孟氏易作難記三十萬言敞𫝊易經本傳徐淑夏恭文苑傳梁丘氏賀從楊何弟子京房更事田王孫傳子臨臨授五鹿充宗王駿充宗授士孫張鄧彭祖衡咸有士孫鄧衡之學楊政從范升善說經張興著錄萬人為梁丘家宗京氏房受易焦延壽房以為延夀即孟氏學戴憑習京氏沛獻王輔善說京氏以下本𫝊度尚通京氏郎宗善京氏費氏陳元鄭衆𫝊之馬融為傳授鄭𤣥本𫝊注何休見鄭𤣥易謂其道出繫表髙氏相授子康及母將永其學亦亡章句自言出於丁將軍費髙皆未立博士以上並前後儒林傳漢古文易儒林𫝊費直字長翁東萊人長於卦筮亡章句徒以彖象繫辭十篇文言解説上下經王璜𫝊之髙相沛人亦亡章句専説隂陽災異自言出於丁將軍繇是易有髙費皆未立於學官後𫝊費直𫝊易其本皆古字號曰古文易以𫝊王横未得立陳元鄭衆皆𫝊費氏學馬融為𫝊授鄭𤣥𤣥作易注荀爽又作𫝊自是費氏大興京氏遂衰隋志同前志漢興田何傳之有施孟梁丘京氏列於學官而民間有費髙二家之説劉向以中古文易經校施孟梁丘經或脱去无咎悔亡唯費氏經與古文同隋志費直注四卷亡章釋文序録云費直句四卷殘缺唐志費直章句四卷馬融荀爽章句鄭𤣥董遇宋忠王肅注各十卷晉志十二次度數費直説周易所言頗有前後中興書目王肅𫝊十一卷後人纂釋文所取者附益之隋志肅注十卷非肅本書管輅易𫝊一卷訓解名義不盡流於卜筮釋文引古文如彚作􅥖翩作偏介作砎枕作沈蹢躅作􅤲𤭔繻作襦歐陽氏曰易至漢分為三有田何之易焦贛之易費直之易今行世者惟有王弼易其原出費氏費氏興而田學遂息古十二篇之易遂亡其本朱震曰秦漢之際易亡説卦宣帝時河内女子發老屋得説卦古文老子至後漢荀爽集解又得八卦逸象三十有一司馬遷傳易曰差以毫釐謬以千里注師古曰今之易經及彖象繋辭並無此語易緯則有之葢易象之别記者也東方朔𫝊易曰正其本萬事理記經解易曰君子謹始漢易林隋志五行類京房周易守林三卷集林十二卷七録云伏萬壽撰唐志伏曼容焦贛易林十六卷梁又本三十二卷易林變占十六卷費直易林二卷梁五卷又周易筮占林五卷後漢方士許峻易新林一卷梁十卷虞翻周易集林律厯一卷郭璞周易新林四卷又九卷梁有郭璞易林五卷易洞林三卷魯洪度易林三卷郭氏易立成林二卷梁元帝洞林三卷梁元帝洞林序説海中之書巫咸之羡門五將韓終六王周王白雉之筮殷人飛燕之占書名聚雪卦有宻雲唐志崔氏周易林十六卷崔篆管輅四卷張滿七卷杜氏新易林占三卷北史吳遵世著易林雜占百餘卷南史梁簡文易林十七卷元帝筮經十二卷庾詵易林二十卷書目易林傳十六卷焦贛以一卦轉之六十四卦各有繇言著吉凶占驗然不𫝊推用之法朱氏曰之卦者變而之他卦也易以變為占一卦變為六十四卦六十四卦變為四千九十六卦崇文目卜筮有周易林十八卷郭璞林一卷陶隠居林一卷子夏林占一卷諸家易林一卷周易飛伏例二卷河圖術一卷晁氏志焦氏易林十六卷費直題其前曰六十四卦變每卦變六十四總四千九十六首皆為韻語與左氏𫝊所載鳳皇于飛和鳴鏘鏘漢書所載大横庚庚予為天王之語絶相類京房易三卷隋有京房章句十卷此書舊題京房傳吳陸績注大抵星行氣候之學非章句也後漢崔駰𫝊崔篆建武初舉賢良辭歸著周易林六十四篇用決土凶多取占驗孔僖傳僖拜臨晉令崔駰以家林筮之謂為不吉注崔篆所作占卦也方術𫝊許峻善卜占之術多顯驗時方之京房著易林行於世唐志許氏周易雜占七卷晉郭璞𫝊璞撰前後筮驗六十餘事名為洞林書目止存一卷載二十二事朱震易叢説引之唐志洞林觧三卷又抄京費諸家要最更撰新林十篇文選注東觀漢記曰永平五年秋京師少雨上御雲臺召尚席取卦具自卦以周易卦林占之其繇曰蟻冗封戸大雨將集明日大雨以詔書問沛獻王輔輔曰案易卦震之蹇月令正義案易林云震主庚子午巽主辛丑未坎主戊寅申離主己夘酉艮主丙辰戌兑主丁巳亥注未屬巽漢京房易𫝊易占分卦直日法京房𫝊治易事焦延壽其説長於災變分六十四卦更直日用事以風雨寒温為候孟康曰分卦直日之法一爻主一日六十四卦為三百六十日餘四卦震離兑坎為方伯監司之官所以用震離兑坎者是二至二分用事之日又是四時各専王之氣各卦主時其占法各以其日觀其善惡各有占驗房用之尤精建昭三年二月朔上封事曰少隂倍力而乘消息孟康曰房以消息卦為辟辟君也息卦為太陽消卦為太隂其餘卦曰少隂少陽謂臣下也并力雜卦氣干消息也又曰臣前以六月中言遯卦不効法曰寒涌水為災至其七月涌水出又曰少隂并力而乘消息戊子益甚到五十分􅂪氣復起孟康曰分一日為八十分分起夜半是為戊子之日日在己酉而䝉也此陛下欲正消息雜卦之黨并力而争消息之氣不勝書目京房易𫝊三卷陸績注以五行飛伏五星氣候訓解卦義又易𫝊積筭法以五行及卦六爻隂陽升降各主其位凡吉凶自互體豹象而知之京房易積數曰二三四為互體三四五為約象隋志京房周易占事十二卷飛候六卷四時候二卷錯卦七卷混沌四卷委化四卷占災異十二卷前五行志京房易𫝊曰尊卦用事注孟康曰尊卦乾坤也臣瓉曰京房謂之方伯卦震兊坎離也永始二年二月乙酉晦日食谷永以京房易占對後五行志陽嘉元年李固對策京房易𫝊云云志注引京房占唐厯志卦議曰十二月卦出於孟氏章句其説易本於氣而後以人事明之京氏又以卦爻配期之日坎離震兑其用事自分至之首皆得八十分日之七十三頥晉并大畜皆五日十四分餘皆六日七分止于占災眚與吉凶善敗之事至於觀隂陽之變則錯亂而不明谷永𫝊於京氏易最宻故善言災異後𫝊劉寛學京氏易鄭𤣥通京氏易崔瑗明京房易𫝊六日七分徐稚學京氏易楊秉明京氏易戴慿魏滿孫期習京氏易儒林傳樊英習京氏易著易章句世名樊氏學方術唐檀少學習京氏易方術郎顗𫝊易天人應曰君子不思遵利兹謂無澤伏案飛候參察衆政京房作易飛候正月三日至乎九日三公卦注凡卦法一為元士二為大夫三為三公四為諸侯五為王位六為宗廟魏髙堂隆引易𫝊上不儉下不節云云晉𫝊董景道明春秋京氏易郭琦注京氏易隠逸臺產専京氏易筭六日六分之學藝術晉五行志京房易𫝊易妖占文選注曲水詩序京房易飛候曰青雲潤澤蔽日在東北為舉賢良唐一行集京房易𫝊論卦氣納甲飛伏世應中孚曰九二處和體震正義大衍之數引京房云五十者謂十日公羊注引易中孚記又引京房易𫝊榖梁注引京房易𫝊易緯稽覽圖非太平而雜卦以其度效一辰則可矣注雜卦九三上六決温九三上九微温六三上九決寒六三上六微寒日七分中一辰效則可也唯消息及四時卦當盡其日盡六日七分四時七十二分也太平之時太隂用事謂從否至臨而少陽卦當效時至則於效分上一時非太平以其卦分效則可六日七分一分效未可責時至立效也太陽用事謂從㤗至遯少隂卦效亦如之小畜乾位比然息之卦當勝雜卦也六日八十分之七而從八十分為一日之七者一卦六日七分也從得一卦四時卦十一辰餘而從謂四正卦坎離震兊四時方伯之卦也七十三分而從得一卦坎常以冬至日始效復生坎七日消息及雜卦傳相去各如中孚卦上有隂百二十日為雨剥隂氣上達􅀢霜以降乾元序制記坎初六冬至廣莫風云云易卦之位震東離南兊西坎北為一説十二辟卦分屬十二辰為一説焦延壽為卦氣直日之法合二説而一之既以八卦之震離兊坎二十四爻直四時又以十二辟卦直十二月分四十八卦為公侯卿大夫而六日七分之説生焉揚雄太𤣥次第乃全用焦法其八十一首盖亦去震離兊坎而但擬六十卦耳虞翻崔憬用互體京房郎顗用五行凡學隂陽占察者皆祖焦氏漢易卜蓍書劉歆𫝊漢興天下唯有易卜未有他書漢志蓍龜有蓍書二十八卷周易三十八卷大筮衍易二十八卷易卦八具顔延之有大筮箴張騫𫝊天子發書易曰神馬當從西北来魏相𫝊學易數表采易隂陽奏之前西域𫝊武帝詔曰易之卦得大過爻有九五匈奴困敗梁后紀太史卜兆得壽房又筮得坤之比後漢𫝊黄瓊上疏曰卦位錯謬寒燠相干注易乾鑿度以乾坤始數二卦而得一嵗魯恭上疏案易五月姤用事陳忠上疏頃季夏大暑消息不協寒氣錯時水涌為變注息卦曰太陽消卦曰太隂雜卦曰少隂少陽郎顗奏今月九日至十四日大壯用事消息之卦也於此六日之中靁當發聲易𫝊曰當靁不靁太陽弱也記易抱龜南靣注易官名周禮曰太卜唐六典太卜令卜筮之法一曰龜二曰兆三曰易四曰式五兆之策三十有六易之策四十有九其變有四單拆交重十八變而成卦内卦為貞朝占用之外卦為悔暮占用之易乾鑿度孔子曰嵗三百六十日而天氣周八卦用事各四十五日方備嵗焉注其中猶自有斗分此重舉大數而已晁公武曰乾鑿度二卷獨九官之法頗明通卦驗冬至四十五日以次周天三百六十五日復當卦之炁進則先時退則後時皆八卦之效也後魏正光厯有推四正卦術四正為方伯中孚為三公復為天子屯為諸侯謙為大人睽為九卿升還從三公周而復始九三應上九清淨微温陽風九三應上六絳亦決温陰雨六三應上六白濁微寒隂雨六三應上九麴塵決寒陽風諸卦上有陽爻者陽風上有隂爻者隂雨朱子發曰乾生三男坤生三女乾交乎坤自姤至剥坤交乎乾自復至夬十有二卦謂之辟卦坎離震兊謂之四正分主四時十有二卦各主其月乾正於子而左行坤正於未而右行左右交錯六十卦周天而復伏爻者京房所傳飛伏也乾坤坎離震巽兊艮相伏見者為飛不見者為伏説卦巽其究為躁卦例飛伏也荀子曰善為易者不占大舜志定謀同然後用筮揚雄曰不以其占不如不筮王通曰驟而語易則玩神其㫖一也六壬推日月行度叅以時日得易之坎離者也遁甲九宫八門得易之河圖者也壬遁得易一端而不盡易之道散而為隂陽術數之學易何往而非隂陽哉故曰易以道隂陽管輅曰善易者不論易輅謂易安可注其得先儒之心歟正義云八卦方位之所六爻上下之次七八九六之數内外承乘之象實象若地上有水比地中生木升假象若天在山中風自火出漢易𫝊太初篇六日七分祭祀志注蔡邕明堂論引易𫝊太初篇郎顗𫝊易内𫝊曰凡災異所生各以其政變之則除又曰久隂不雨注易稽覽圖易中孚𫝊曰陽感天不旋日注又引易稽覽圖曰甲子卦氣起於中孚六日八十分日之七今春當旱夏必有水臣以六日七分候之可知顗父宗學京氏易楊賜𫝊於中孚經曰注易稽覽圖中孚經之文也公羊注引易中孚記隋志梁有周易飛候六日七分八卷又見大衍厯議正義七日来復案易緯稽覽圖云卦氣起中孚故離坎震兑各主其一方其餘六十卦卦有六爻爻别主一日凡主三百六十日餘有五日四分日之一每日分為八十分五日分為四百分四分日之一又為二十分是四百二十分六十卦分之六七四十二卦别各得七分是每卦得一日七分也漢上朱氏曰陽生於子隂生於午自午至子七月必復乾坤消息之理也故以一日言之自午時至夜半復得子時以一年言之自五月至十一月復得子月以一月言之自午日凡七日復得子日以一紀言之自午嵗凡七嵗復得子嵗天道運行其數自爾合之為一紀分之為一嵗一月一日莫不皆然故六十卦當三百六十日而兩卦相去皆以七日於復言七日来復者明卦氣也金君卿曰七日来復或謂日當為月言自五月陽剥而隂長至十一月而一陽生是七月而来復六日七分之説謂一日八十分一卦之内六爻主六日而只餘七分也六日七分孔頴達述而明之王昭素王㳂宋咸著論駁之胡旦明其不然又虞翻注七日来復曰消乾六爻為六日剛来反初七日来復天行也陸績注京房傳曰六陽涉六陰反下七爻在初故稱七日日亦陽也房作復𫝊曰六爻反復之稱晁説之學京氏易據其𫝊為式漢易通論易賛易論後儒林𫝊洼丹字子玉世𫝊孟氏易建武初為博士十一年為大鴻臚作易通論七篇世號洼君通丹學義研深易家宗之稱為大儒荀爽𫝊著易𫝊荀悦漢紀馬融著易解頗生異説爽著易𫝊據文象承應陰陽變化之義以十篇之文解説經意由是兖豫之言易者咸𫝊荀氏學而馬氏亦頗行於世爽又著詩傳皆附正義無他説隋志漢司空荀爽注十一卷九家注十卷梁有馬融注一卷鄭𤣥注九卷何休見其注謂道出繋表詩疏引鄭注中孚坊記疏引鄭易注既濟九五爻周禮疏引鄭注鼎九四禮記疏引鄭注易訟卦引儀禮疏引困九二郎顗𫝊注鄭注乾卦梁陳鄭𤣥王弼二注列於國學齊代唯𫝊鄭義至隋王注盛行鄭學浸微今殆絶矣正義鄭𤣥作易賛及易論朱震曰康成始以彖象連經文王弼又以文言附乾坤二卦自康成而後其本加彖曰象曰自弼而後加文言曰至於文辭連屬不可附卦爻則仍其舊篇魏淳于俊曰康成合彖象於經欲使學者尋省易了孔子恐其與文王相亂是以不合費氏之後易經上下離為六卷繋辭而下五篇合為三卷是以鄭注九卷王弼雖宗莊老其書固鄭氏書也易緯書目易緯案隋志八卷鄭𤣥注梁九卷舊唐志九卷宋均注唐志宋𠂻注崇文目九卷康成或引以解經今篇次具存宋注不𫝊李淑書目九卷凡乾鑿度稽覽圖通卦驗各二辨終備是類謀坤靈圖各一今三館所藏乾鑿度通卦驗皆别出為一書而易緯止有鄭氏注七卷稽覽圖第一辨終備第四是類謀第五乾元序制記第六坤靈圖第七二卷三卷無標目易乾鑿度二卷崇文目同易通卦驗二卷稽覽圖一卷流演通卦驗一卷不知作者正義引易緯乾鑿度云易一名而含三義所謂易也變易也不易也易者其徳變易者其氣不易者其位也鄭𤣥依此義作易賛及易論云易簡一也變易二也不易三也又云有太易太初太始太素垂皇策者犧卦道演徳者文成命者孔通卦驗云蒼牙通靈昌之成孔演命明道經稽覽圖云卦氣起中孚郎顗𫝊易天人應曰云云五行志注引易䜟易緯晉五行志引易萌氣樞晁氏志乾鑿度二卷坤鑿度二卷題曰包犧氏先文軒轅氏演古籕文蒼頡修為上下二篇隋唐志崇文目皆無之當是國朝人依託為之周易參同契唐志五行類魏伯陽周易參同契二卷後漢人書目明金丹之訣篇題盖倣緯書之目詞韻皆古奥雅難通首言乾坤坎離四卦橐籥之外其次即言屯䝉六十卦以見一日用功之早晚又次即言納甲六卦以見一月用功之進退又次即言十二辟卦以分納甲六卦而兩之盖内以詳理月節外以兼統嵗功此書大要在坎離二字崇文目道書有參同契太易志圖丹書各一卷易釋文虞翻注參同契云字從日下月三洞珠囊魏伯陽撰參同契其説以周易爻象論作丹之意而世不知神丹之事多作隂陽注之殊失其㫖朱子曰參同之説見一息之間有晦朔􅁌望上􅁌者氣之方息自上而下也下􅁌者氣之方消自下而上也望者氣之盈日沈于下而月圓于上也晦朔之間者日月之合乎上所謂舉水以滅火金来歸性初之類是也朱文公推策數之法月以十二卦分之卦得二日有半各以本卦之爻行本爻之策又曰參同本不為明易借納甲之法以寓行持進退之候云甲乙丙丁庚辛者乃以月之昏旦出沒言之非以分六卦之方也上察河圖文下序地形流中稽於人心參合考三才金碧古文龍虎上經取法參同彭曉分章通真義三卷分為九十章納甲乾納甲壬坤納乙癸震納庚巽納辛坎納戊離納己艮納丙兊納丁蠱先甲後甲巽先庚後庚革已日乃孚玉海卷三十五
