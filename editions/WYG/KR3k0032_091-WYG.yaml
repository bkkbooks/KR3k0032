body:
  text: 玉海卷九十一宋王應麟撰器用屏障釋名屏風言可以屏障風也帷圍也帳張也賈公彦云屏風之名岀於漢世春秋後語云孟嘗君屏風後常有侍史記客語則前已有屏風周黼依春官司几筵大朝會大饗射凡封國命諸侯王位設黼依依前南鄉注斧謂之黼其繡白黑采以絳帛為質其制如屏風斧取割斷之義畫斧無柄設而不用之意外有虎門昭其勇也内有黼依昭其斷也正義依狀如屏風絳質長八尺屏風之名出於漢世典絲凡飾邦器者受文織絲組注謂茵席屏風之屬明堂位周公朝諸侯於明堂之位天子負斧依南向而立注負之言背也斧依為斧文屏風於戸牖之間覲禮天子設斧依於戸牖之間左右几天子衮冕負斧依詩公劉既登乃依正義既登堂負扆而立也明堂位注云云然則斧者是屏風之名扆則户牖之閒地耳北史李謐傳鄭氏禮圖説扆制曰従廣八尺畫斧文於其上今之屏風也周氊案皇邸天官掌次王大旅上帝則張氊案設皇邸注以氊為牀於幄中鄭司農云皇羽覆上邸後版也𤣥謂後版屏風與染羽象鳯凰羽色以為之疏大旅謂冬至祭天圓丘氈案皇邸謂王坐所置也并有大次小次之幄後版者為大方版於坐後畫為斧文言屏風者據漢法况之禹貢羽畎夏翟謂貢夏翟之羽後世無周禮鍾氏染鳥羽象鳯皇色以為之覆於版上明堂位司几筵皆云黼扆此不在寢廟無扆故別名皇邸公羊傳注禮天子外屏諸侯内屏大夫帷士簾漢黼依嚴助傳淮南王安上書陛下玩心神明負黼依南面而聽斷注師古曰依讀為扆扆形如小屏風而曲之畫以黼文張於户牖之間白與黑畫為斧形謂之黼西域傳贊天子負黼依注同上東京賦負斧扆注屏風曲禮天子當依而立疏依狀如屏風以絳為質髙八尺東西當戸牖之間繡為斧文亦曰斧依覲禮鄭注云依如今綈素屏風也有繡斧文所以示威也爾雅牖户之間謂之扆注窻東户西也漢書囊帷東方朔傳文帝集上書囊以為殿帷文帝紀贊帷帳無文繡示朴為天下先丙吉傳驛騎持赤白囊邊郡發奔命書翟酺傳酺上疏曰文帝愛百金於露臺飾帷帳於皁囊皁囊見上類周舉上疏欲帝置章御座以為規戒上書言事始於孝文二年賈山王嘉傳哀帝初易帷帳去錦繡乗輿席緣綈繒而已漢武帳汲黯傳上嘗坐武帳黯前奏事望見黯避帷中使人可其奏注應劭曰武帳織成帳為武士象也孟康曰今御武帳置兵蘭五兵於帳中也韋昭曰以武名示威霍光傳太后被珠襦盛服坐武帳中期門武士陛㦸陳列殿下史記索隠引輿服雜事云六尚尚席掌武帳帷幔梅福𫝊上書曰願壹登文石之陛涉赤墀之塗當户牖之法坐注師古曰户牖之間謂之扆法坐正坐也猶言法宮法駕漢甲乙帳東方朔傳陛下誠能用臣之計推甲乙之帳燔於四通之衢注帳多故以甲乙第之貢禹傳陛下誠深念髙祖之苦醇法太宗之治去甲乙之帳西域傳孝武興造甲乙之帳落以隨珠和璧天子負黼依襲翠被馮玉几而處其中注師古曰扆如小屏風畫為黼文帳其數非一以甲乙次第名之漢武故事以琉璃珠玉明月夜光雜錯珍寶為甲帳其次為乙帳甲以居神乙上自御之漢紫幄見郊祀類四合象宮曰幄饗神之幄漢劉向列女傳屏御坐列女屏劉向七畧別錄臣向與黄門侍郎歆所校列女傳種類相従為七篇以著禍福榮辱之效是非得失之分畫之於屏風四堵後漢宋𢎞傳御坐新屏風圖畫列女帝數顧視之𢎞曰未見好德如好色者也帝即撤之漢幄坐畫屏風班固叙傳班伯為侍中光祿大夫時乗輿幄坐張畫屏風畫紂妲己因指畫而問伯云云上曰今日復聞讜言子房運籌帷幄中漢綈素屏風覲禮天子設斧依於户牖之間注依如今綈素屏風也疏綈赤也素白也漢時屏風以綈素為之象古者白黑斧文白與黑謂之黼刃白而銎黑則為此斧字漢屏風銘三輔决錄何敞為汝南太守章帝南巡過郡設刻鏤屏風帝命侍中黄香銘之曰古典務農彫鏤傷民忠在竭節義在修身李尤亦有屏風銘東方朔傳有屛風賦淮南王有屛風賦羊勝屛風賦重葩累繡沓璧連璋漢雲母屏風吳御屏鄭𢎞傳元和元年𢎞為太尉時舉將第五倫為司空班次在下每正朔朝見𢎞曲躬而自卑帝問其故遂聽置雲母屏風分隔其間由此以為故事吳錄景帝時紀亮為尚書令子隲為中書令每朝㑹詔以御屛風隔其座焉古今注孫亮作瑠璃屏風鏤作瑞應圖一百二十種魏素屏几魏志太祖平柳城以素屏風素馮几賜毛玠曰君有古人之風賜以古人之服唐貞觀十六年七月以素屏几賜魏徵唐疏屛十漸屛又見奏議類魏徴傳日月据通鑑貞觀十三年五月甲寅詔五品以上上封事徴上疏極言不克終十漸疏奏帝曰朕今聞過矣方以所上疏列為屏障庶朝夕見之兼錄付史官賜金十斤廏馬二匹政要貞觀三年太宗謂司空裴寂曰比有上書奏事條數甚多朕黏之屋壁出入觀省吳兢傳上疏曰太宗好悦至言有上書益於政者黏寢殿之壁坐望臥觀宋璟傳開元十二年璟為留守帝曰宜有嘉謀以示朕璟因一一極言手制答曰所進當書之坐右出入觀省裴耀卿傳𤣥宗有事岱宗上書數百言帝曰朕置書坐右以自戒唐刺史姓名屏風循吏傳序唐興承隋亂離剗袚荒荼始擇用州刺史縣令太宗嘗曰貞觀二年太宗謂侍臣曰云云見貞觀政要通鑑同㑹要作三年朕思天下事丙夜不安枕永惟治人之本莫重刺史故錄姓名於屏風臥興對之得材否狀輒疏之下方以擬廢置又詔内外官五品以上舉任縣令者於是官得其人民去愁歎就妥安通鑑貞觀二年上曰朕為養民惟在都督刺史云云同上縣令尤為親民不可不擇乃命内外五品以上各舉堪為縣令者以名聞通典太宗疏督守之名于屛俯仰視焉其人善惡必書其下州郡無不率理會要貞觀十一年八月馬周上疏云云太宗因謂侍臣曰刺史朕當自簡縣令詔京官五品以上舉一人唐列女傳屏風虞世南傳太宗命寫列女傳於屏風于時無本世南暗疏一作書之無一字謬一云一無遺失唐眞草書屏風見御書類梁蕭子雲上飛白書屏風唐黼扆官志尚舎局奉御大朝㑹設黼扆施躡席薰鑪朔望設幄而已李德裕傳文宗指坐扆前示宰相曰此德裕爭鄭注處唐古今家誡屏房𤣥齡傳集古今家誡為屏令諸子各取一具曰留意於此足以保躬矣唐五王帳通鑑𤣥宗素友愛於殿中設五幄與諸王更處其中謂之五王帳五王宋申兄也岐薛弟也豳従兄也傳世謂天子友悌古無有者帝於順睦蓋天性然雖讒邪無以搖唐麟德殿漢名臣屏風見圖類貞元十二年二月唐連屏李絳傳元和二年為學士憲宗稱太宗𤣥宗之盛欲庶幾二祖道德風烈何行而至絳曰陛下誠能正身勵已尊道德遠邪佞進忠直與大臣言敬而信無使小人參焉與賢者游親而禮無使不肖與焉去官無益於治則材能出斥宫女之希御則怨曠銷將帥擇士卒勇矣官師公吏治輯矣法令行而下不違敎化篤而俗必遷如是可與祖宗合德號稱中興言之不行無益也行之不至無益也帝曰美哉斯言朕將書諸紳即詔絳與崔羣錢徽韋𢎞景白居易等搜次君臣成敗五十種為連屏張便坐帝每閲視顧左右曰而等宜作意勿為如此事論事集四年圖畫美惡題寫其事文王得呂望以興周桓公得管仲以覇齊宣王誅阿大夫京房對漢元帝周幽二世陳後主梁武帝聖君明主忠臣義士既不敢遺而闇君亂臣亦取鑒戒君臣合體事跡可觀錄五十條賢愚成敗勒為兩卷張之便坐按藝志實録㑹要君臣事迹十四篇書於六扇屏風自君臣道辨邪正至于簡田獵錄勲賢與絳等所次五十種詳畧之不齊篇數之不類一為絳等所次一為憲宗所製未可合而為一唐前代君臣事跡屏風見雜御製類㑹要元和四年七月實錄乙巳朔云會要宰相雜錄三年七月宣示宰臣非舊紀元和四年秋七月乙巳朔御製前代君臣事迹十四篇書於六扇屛風志儒家類十四篇是月出書屏以示宰臣李藩等表謝之實錄李藩等表賀曰列在玉座分為書屏覩名臣之事業誠所厚顔觀聖主之規模我無慙德豈敢於此屏之後輒近諛佞詔答曰卿等徇公獻納正救之益既多朕亦遐想聖賢諫諍之規是渇所以列其事跡文以丹青庶幾啟發蒙昧辨察正邪白居易批李夷簡賀御撰君臣事迹屏風表云朕思求理化親閲典墳至於去邪納諫之規勤政謹兵之戒取而作鑒書以為屏與其散在圖書心存而景慕不若列之繪素目覩而躬行庶將為後事之師不獨觀古人之象明君直臣前言往事森然在目如見其人李絳論事集所載答宰相賀屏風狀卿等獻納云云與實錄所載詔答之辭叶同但五十種之事如呂望管仲皆絳等所次而事跡十四篇乃憲宗御製固未可合為一也唐政要屏風通鑑宣宗大中二年二月庚子以令狐綯為翰林學士上嘗以太宗所撰金鏡授綯使讀之至亂未嘗不任不肖至治未嘗不任忠賢上止之曰凡求致太平當以此言為首又書貞觀政要於屏風每正色拱手而讀之咸平御覽御屏風太宗太平御覽見著書類咸平中通畧咸平四年十二月田錫知通進銀臺封駁司嘗因對曰陛下好古不倦若師皇王之道十年必致太平舊有御覽但記分門事類不如鈔略經史子集為御覽三百六十卷日覽一卷周嵗而徧又取經史要切之言為御屏風十卷置御座之側上嘉納詔史館以羣書借之每成數卷即先進内又先上御覽三十卷御屏風五卷御覽序曰可以銘於座隅者書之於御屏可以用於帝道者錄之於御覽經語取易曉之意史傳取其可行之事或總之於雜錄文集或附之於逐篇悉求切當之言用達精詳之理御屏風序曰古者帝王之盤盂皆銘几杖有戒軒帝輿几皆銘焉曰吾居民之上惴惴恐不及武王户席必訓焉席銘曰無行可悔户之銘曰名難得而易失太公金匱亦曰武王銘於几杖墨子又曰堯舜湯禹書事於竹帛瑑之盤盂曰君子福大而愈懼臣每覽經史子集因取其語要總一十卷輒因進獻可題於屏置之御座之右則聖德日新矣二書不就而終天禧五年以賜皇太子梁鼎守吉州太宗記其名於御屏楊徽之能詩太宗寫其警句十聮御屏上呂夷簡治開封有聲眞宗識其姓名於屏風景祐邇英延義閣無逸屏景祐二年正月癸丑二十八日置邇英延義二閣寫尚書無逸篇於屏邇英在迎陽門之北東向延義在崇政殿之西南向是日仁宗御延義閣召輔臣觀仍命讀唐書讀春秋既而宴崇政殿後又命王洙書之治平欽明殿洪範屏治平三年六月壬子英宗改清居殿曰欽明殿召直龍圖閣一云直集賢院王廣淵書洪範於屏帝謂廣淵曰先帝臨御四十年天下承平得以無為朕方屬多事豈敢自逸故改此殿名因訪廣淵先儒論洪範得失廣淵對張景所得最深以景論七篇進明日復召對延和殿帝曰景所説過先儒逺矣以三德為馭臣之柄尤為善論朕遇臣下常謙柔聽納之間則自以剛斷此屏置之左右豈特無逸之戒也㑹要廣淵傳英宗召對於邇英閣帝曰朕所燕居欽明殿有綈屏朕每讀洪範得髙明沉潛之義剛内以自强柔外以應物此人君之體也素愛卿筆札為朕書於屏以備觀省豈特開元無逸圖也賜廣淵御紙筆墨黄金元豐周官屏元豐五年建尚書省六年十一月十九日臨幸蘇頌謝表云三朝漢省已叨過輦之恩六典周官願謹書屏之戒尚書省諸㕔壁書周官為屏見葉夢得燕語七年正月右諫議趙彦若言尚書省寫周官一篇此朝廷稽古命官之本也建炎御書旅獒易卦孟子屏紹興御屏奏疏圖實錄建炎二年九月己亥一作戊戌賜己亥謝以御書通鑑第四册賜宰相黄潛善等曰一作建炎二年九月十八日己亥黄潛善謝賜資治通鑑上曰云云朕近將孟子論治道處手寫於絹屏積久自多他日回鑾亦留屛於此潛善曰陛下寫孟子王道政教之言在左右前後屏障亦古人自警發之意又曰朕每日温習孟子五卷愛其簡明知要故樂書之汪伯彦曰陛下留神此書取其宜於今者力行之天下甚幸二十二日癸卯宣示親書素屏二十三日甲辰潛善致詞曰臣等昨晚蒙遣中使宣示御書座右素屏旅獒一篇大有大畜二卦與孟子七篇凡十扇於書取謹德昭度之規於易記有賢畜徳之義蓋曰正心誠意以齊家治國者在德立政造事以致君澤民者在賢所摭孟軻當年之格言皆切本朝今日之急務屏幃之内聖賢滿前因知心術之接在兹非以字畫之好為貴上曰孟子自幼所習至今成誦在口不覺寫出如旅獒因葉夢得進讀資治通鑑及之又欲寫無逸篇但其字多屏狹不能容見别營度游意翰墨朕意殊不倦汪彦伯曰陛下書聖賢垂範之言置諸座右以自警此進德脩業之效又曰孟子言左右皆曰賢又左右皆曰可殺一章詳咏斯言欲謹守之夙夜不忘神交尚友如與孟子端拜而議臣寮言引憲宗英宗實錄故事紹興三年四月一作二月四日依史館上十二門分六卷當攷紹興五年五月辛卯右司諫趙霈奏疏令尚書省將所奏修寫成圖進入六年八月庚子左司諫陳公輔入對亦以其奏疏寫圖髙宗委明珠於巨壑焚翠飾於通衢反馴象於安南却羨金於川陜紹興中興君臣事迹屏紹興六年三月辛未言者請命館職編纂前古中興君臣事迹有資治體者分以篇目總為一書寫之御屛置之便殿萬幾之暇得以參驗古今鑒戒美惡従之後不克成髙宗命鄭諶書盤庚無逸詩之車攻篇孝經孝治章列于左右嘗以諭輔臣乾道選德殿御屏華夷圖又見殿類連屏乾道元年七月癸丑晚御選德殿御坐後有金漆大屏分畫諸道各列監司郡守為兩行以黄簽標識職位姓名上指示洪适等曰朕新作此屏其背是華夷圖甚便觀覽卿等於都堂亦可依此适奏曰唐太宗嘗列守令姓名于屏風今日之舉逺過前代内外大小之臣列之屏以待黜陟山川險要之地指諸掌以立防閑三年三月庚子鄭聞奏司馬光進五規簡當明白乞命翰墨之臣書為連屏如唐太宗以諫疏為屏障又以法仁宗邇英故事上曰當便書之紹興間左史樓炤請命従臣舉監司上従之已而謂輔臣曰朕當書之屏風以時揭貼乾道元年十一月十四日執政晚對上出牙牌一面鐫吏户兵刑禮工贓吏字疏事目下方上曰朕已令製造數副朝廷事卿等亦當依此以備遺忘雜器黄帝華蓋武王曲蓋漢華蓋古今注華蓋黄帝所作黄帝與蚩尤戰于涿鹿之野常有五色雲氣金枝玉葉止于帝上有花蘤之象因而作華蓋後漢蔡邕傳擁華蓋注引上云云曲蓋太公所作武王伐紂大風折蓋因制焉漢朝乗輿用四謂之䡶輗有軍號者賜其一唐大駕鹵簿有俾倪十二今作睥睨揚雄傳甘泉賦昭華覆之威威注服䖍曰華蓋也文選西京賦天子駕雕軫六駿駮華蓋承辰天罼前驅注薛綜曰華蓋星覆北斗王者法而作之李善曰劉歆遂初賦奉華蓋於帝側西京雜記漢祠甘泉華蓋中道晉天文志大帝上九星曰華蓋下九星曰杠華蓋之柄也孝經援神契房為龍馬華蓋覆鉤黄帝巾机詳見御銘類文選刻漏銘注蔡邕銘論曰黄帝有巾机之法孔甲有盤盂之戒李尤几銘叙曰帝軒作輿几之法黄帝墨海漢寶跗文房四譜黄帝得玉一紐治為墨海焉其上篆文曰帝鴻氏之硯西京雜記天子玉几加綈錦以玉為硯以酒為書滴皆取其不冰玉蟾蜍為盛滴器進御筆以錯寶為跗毛以秋兔之毫官師路扈為之間以玉璧翠羽之飾雜寶為匣太公金匱硯之書比石墨於讒説魯國孔子廟石硯一枚甚古朴傅子曰文犀之植象齒之管豐狐之柱秋兔之翰女史彤管白筆赤管筆晉儀注太子納妃有漆硯傅𤣥有水龜銘博古圖有龜蛇水滴色掩緇帷香含漆簡芳松之淳烟墨舜陶器考工記有虞氏上陶注舜至質貴陶器甒大是也史記舜紀陶河濵器不苦窳定陶西南陶丘亭作什器於壽丘周書神農作瓦器尸子黄帝有陶正昆吾作陶説文呂氏春秋同唐書貞觀十七年太宗問褚遂良曰舜造漆器禹雕其爼當時諫者十餘人舜寶甕銘拾遺記黄帝碼碯甕至堯時甘露在中謂之寶露以班賜羣臣舜遷寶甕於衡山之上有寶露壇壇下起月館以望夕月南至衡山賜百辟露泉秦皇於零陵得赤玉甕容八斗在舜廟之堂前漢東方朔識之乃作寶甕銘曰寶雲生於露壇祥風起於月館望三壺如盈尺視八鴻如縈帶左傳昭七年燕賂齊以瑤甕玉櫝斝耳斝耳玉爵也舜五明扇古今注五明扇舜所作也既受堯禪廣開視聽求賢人以自輔故作五明扇秦漢公卿士大夫用之魏晉非乗輿不得用殷髙宗有鳴雉之祥服章多用翟羽故有雉尾扇周制王后輦車緝雉羽為扇漢乗輿服之後以賜梁孝王世本武王作箑西京雜記天子夏設羽扇冬繒扇禹席初學記韓子曰夏禹為茵蔣席禹貢篚禹貢兖州篚織文注盛之箱篚而貢焉疏鄭𤣥云貢者百功之府受而藏之其實於篚者入於女功故以貢篚别之諸州無篚者無入篚之物故不貢漢地理志作棐與篚同竹器青檿絲徐𤣥纖縞􅀭織貝荆𤣥纁璣組豫纖纊周武王几杖書後漢崔駰傳注見御製類文選刻漏銘李善注蔡邕銘論曰武王踐阼咨于太師而作席机楹杖雜銘又曰黄帝有巾机之法孔甲有盤盂之戒隱几擁杖始於神農輿几剏法具於黄帝周庸器春官典庸器下士四人掌藏樂器庸器及祭祀饗食賔射帥屬設筍虡陳庸器注庸器伐國所獲若崇鼎貫鼎及以兵器所鑄銘也陳功器以華國國語臧文仲曰鑄名器注鐘鼎也周五几春官司几筵下士二人掌五几五席之名物左右玉几彫几彤几漆几素几注左右有几優至尊也疏生人則几在左鬼神則几在右太公隂謀机之書曰安不忘危存不忘亡選注引之楚語衞武公倚几有誦訓之諫注工師所誦之諫書之於几周繅席司几筵凡大朝覲饗射封國命諸侯王位設黼依依前南鄉設莞筵紛純加繅席畫純加次席黼純左右玉几注繅席削蒲弱展之編以五采若今合歡矣次席桃枝席有次列成文五席莞藻次蒲熊疏漢有合歡席漢世以桃枝竹為席王受朝覲席在廟牖間大射席在虞庠祀先王在廟奧及堂酢席在廟室西面自諸侯已下亦皆在廟惟熊席漆几設在野所征之地左傳大路越席注結蒲為席書正義史游急就篇云蒲蒻藺席踐阼篇武王席銘周金版詳見銘類秋官職金上士二人旅上帝則共金版饗諸侯亦如之注鉼金謂之版所施未聞文選劉孝標論聖賢鏤金版注太公金匱曰屈一人之下申萬人之上武王曰請著金版莊子金版六弢周遂鑒漢方諸秋官司烜氏下士六人徒十有二人掌以夫遂取明火於日以鑒取明水於月以供祭祀之明齍明燭共明水凡邦之大事共墳燭庭燎注夫遂陽遂也鑒鏡屬取水者世謂之方諸取日之火月之水欲得隂陽之絜氣也明燭以照饌陳明水以為𤣥酒疏日者太陽之精取火於日故名陽遂取火於木為木遂鑒是鏡可以照物取水者漢世謂之方諸明者潔也日月水火為明水明火取日月隂陽之潔氣也春官大祝大禋祀肆享祭示則執明水火而號祝注司烜所共日月之氣以給烝享明圭潔也考工記攻金之工金有六齊金錫半謂之鑒燧之齊注鑒燧取水火於日月之器周紀毛叔鄭奉明水漢舊儀皇帝八月酎以鑑燧取水於月以火燧取火於日唐李靖賜物有火鑑通鑑外紀遂人氏鑽木取火管子黄帝鑽燧生火明堂位夏后氏尚明水周氷鑑天官凌人掌氷春始治鑑祭祀共氷鑑注鑑如甀大口以盛氷置食物于中以禦温氣春而始治之為二月將獻羔而啟氷疏鑑是盛氷之器氷政著於豳詩備於成周詳叙於左氏申豐之説漢有凌室晉庾倐有氷井賦宋孝武大明六年五月丙戌置凌室藏氷唐有氷井上林令掌之本朝建隆二年始置氷井務以孟夏用幣黑牡祭𤣥𡨕乃開氷博古圖有唐冰鑑漢氷斗周仲丁壺博古圖周仲丁壺銘曰惟六月初吉丁亥召仲丁父自作壺用祀用饗多福滂用蘄眉壽萬年無疆子子孫孫永寶是尚漢太官壺銘曰太官銅鍾容一斛建武二十年工伍輿造考工令史凷丞或令通主太僕監掾蒼省綏和壺銘曰綏和元年供王昌為湯官造三十鍊銅黄塗壺容二斗重十二斤八兩塗工乳䕶級掾臨主守右丞同守令寶省孔子縹筆孝經援神契孔子制作孝經使七十二子向北辰磬折曾子抱河洛事北向孔子簪縹筆衣絳單衣向北辰而拜太公隂謀筆之書曰云云漢金鐀玉版石室又見後髙紀與功臣剖符作誓丹書鐵契金匱石室藏之宗廟注如淳曰金匱猶金縢晁錯傳對䇿曰髙帝之建功業陛下之德厚刻於玉版藏於金匱歴之春秋紀之後世為帝者祖宗與天地相終注如淳曰刻玉版畫為文字也司馬遷傳遷為太史令紬史記石室金鐀之書秦滅詩書故明堂石室金鐀玉版圖籍散亂郎顗傳書玉版之䇿李固傳對䇿曰陛下宜開石室陳圖書招會羣儒引問得失皇后紀順帝上母李氏尊諡為䇿書金匱藏于世祖廟張衡傳永元中宋景以厯紀推言水灾而偽稱洞視玉版文選王文憲集序金版玉匱之書注七略曰太公金版玉匱雖近世之文然多善者後漢書注并選注引太公金匱書正義鄭云凡藏秘書藏之於匱必以金緘其表漢栢寢銅器岐山銅器見上郊祀志武帝有故銅器李少君曰此齊桓公十年陳於栢寢已而按其刻果齊桓公器括地志栢寢臺在青州千乗東北韓子曰景公豋栢寢之臺漢承露盤玉盤郊祀志作栢梁銅柱承露仙人掌之屬注三輔故事建章宮承露盤髙二十丈大七圍以銅為之上有仙人掌承露和玉屑飲之欲以求仙西都賦抗仙掌以承露擢雙立之金莖注金莖銅柱也西京賦立脩莖之仙掌承雲表之清露屑瓊蘂以朝餐必性命之可度廣記云有銅仙人舒掌捧盤以承雲表之露長安記云仙人掌大七圍應劭漢官儀封禪壇南有玉盤中有玉龜文選注引之魏曹植露盤頌曰明帝鑄承露盤立於芳林園甘露仍降又有銘曰岧岧承露峻極太清下潛醴泉上受雲英母丘儉有賦銘并叙漢翠被一章西域傳贊孝武興造甲乙之帳落以隨珠和璧天子負黼依襲翠被馮玉几而處其中西京賦大駕幸乎平樂張甲乙而襲翠被左傳楚子皮冠秦復陶翠被豹舄注以翠羽飾被蔡質漢官儀曰尚書郎入直臺中官供青縑白綾被或錦被梁武帝䇿錦被事問劉峻疏十餘事漢綺席郊祀志丞相衡御史大夫譚奏議曰紫壇有文章采鏤黼黻之飾及玉注師古曰漢舊儀云祭天用六綵綺席六重用玉几玉飾器凡七十初學記漢舊儀曰祭天紫壇紺席文帝莞蒲為席史記古者封禪席蒩稭漢青蒲史丹傳竟寧中丹直入臥内頓首伏青蒲上注服䖍曰青緣蒲席應劭曰以青規地曰青蒲非皇后不得進此漢綈几西京雜記漢制天子玉几冬月則加綈錦其上謂之綈几晉張華有倚几銘漢御唾壺漢官儀武帝時孔安國為侍中以其儒者特聽掌御唾壺朝廷榮之孔叢子孔臧與子琳書云云梁天監初天竺獻瑠璃唾壺漢華勝司馬相如傳大人賦戴勝而穴處注如淳曰山海經曰西王母挮几而戴勝師古曰勝婦人首飾也漢代謂之華勝漢尚方鑑博古圖漢册禮鑑銘四十八字尚方鑑銘五十三字長生鑑銘四十字唐萬春鑑銘四十字龍鑑瑞圖鑑銘四十三字黄帝液金以作神物為鑑凡十有五有周治鑑之數亦十有三唐開元間李太進水心鑑背負蟠龍蜿蜒若生仍表其鑑曰龍䕶所作真龍託於是焉漢髙祖入咸陽得方鑑漢梁山鋗博古圖鋗銘曰梁山銅二斗鋗重十斤元康元年造外復有一扶字錠銘曰王氏銅虹燭錠字畫與漢五鳯鑪相類實漢物也説文以錠為鐙漢靈殳見印綬類乗輿雙印宋孔雀蓋宋元嘉二十九年起居注曰訶羅單國奉孔雀蓋一具晉元帝紀將拜貴人有司請市雀釵帝以費煩不許唐金雞百官志中尚令赦日樹金雞於仗南竿長七丈有雞髙四尺黄金飾首銜絳幡長七尺承以綵盤維以絳繩將作監供焉擊棡鼔千聲集百官父老囚徒坊小兒得雞首者官以錢募或取絳幡而已武庫令丞有赦建金雞置鼔宮城門之右囚徒至則擊之六典注海中星占天雞星動必有赦王者以雞為赦候其制始於後魏或云起呂光或曰雞者巽之神巽為號令含元殿賦揭金雞於太清楊巨源詩丹鳯闕前歌九奏金雞竿上鼓千聲武后傳封嵩山封壇南有大槲赦日置雞其杪賜號金雞木崔發以囚坐雞干下皇朝祥符元年十月二十六日東封禮成御朝覲壇肆赦少府監言所設金雞送山下其竿盤木馬夾耳等物下經度制置使製造従之唐華蓋羽扇六典又百官志尚輦局掌輿輦繖扇大朝會則繖一翰二陳于庭大祭祀陳于廟孔雀扇一百五十有六分居左右舊翟尾扇開元初改為繡孔雀常朝則去扇左右留者三一云各留其三以備常儀左尚令供大小方圓華蓋百五十有六翟尾扇及大小繖翰辨其名數翟尾扇起於商髙宗有雉翟之祥服章多用翟羽儀衞志大駕鹵簿雉尾障扇四小團四方十二又雉尾扇八小雉尾扇朱畫團扇皆十二次花蓋二俾倪十二大朝會扇一百五十有六三衞三百人執之會要開元中蕭嵩奏朔望受朝宣政殿請備羽扇於殿兩廂上將出索扇扇合上坐定乃去扇將退又索扇如初唐金壺見賜予器物類唐方諸會要乾封元年李敬眞論封禪須明水實樽今司宰陽燧形如圓鏡以取明火隂鑑形如方鏡以取明水但比年祠祭用陽燧立驗隂鑑取水未有得者常用井水今若依古取明水法合用方諸淮南子云大蛤也敬真八九月中用蛤尺有二寸者依法試之自人定至夜半得水四五斗望差敬眞自取蚌蛤赴泰山敕與所司對試淮南子方諸見月則津而為水髙誘注方諸隂燧大蛤也熟摩令熱以向月則水生以銅盤受之可至數石六典太官令取明水於隂鑑取明火於陽燧唐五等帳排城六典大駕行幸設三部帳幕有古帳大帳文帳小次帳小帳凡五等古帳八十連大帳六十連次帳四十連小次帳三十連小帳二十連凡五等之帳各三是為三部其外置排城以為捍蔽排城連板為之每版皆畫辟邪猛獸表裏漆之百官志尚舍奉御掌張設云云同上右尚令凡五品三部之帳皆儗其用會要貞觀十三年造烏漆盾於三衞幕外偏以為城畫獸頭外向令馬騎見之不敢進顯慶三年九月二十四日有司奏造排車七百乗擬車駕行幸載排城上以為勞煩令於舊頓築牆為固顯慶元年十月上曰行日止用兩部帳幕不須三部周氈案皇邸漢紫幄並見上類周禮幕人掌王帷幕幄帟綬五者王出宫則掌次張之注在旁曰帷在上曰幕四合象宫室曰幄帟王在幕若幄中坐上承塵凡四物者以綬連繫焉帷幕以布幄帟以繒為之疏帷在下幕在上共為室唐銀硯鏤牙管景龍文館集中宗令諸學士入館其北壁列書架架前有甘露殿銀硯一碧鏤牙管十銀函盛紙數十種楊師道硯詩圎池類璧水輕翰染煙華趙國名毫遼東仙管梁元帝謝白牙鏤管唐金甌崔琳傳與弟珪瑤俱列棨㦸初𤣥宗每命相皆先書其名一日書琳等名案上欲用為相㑹太子入覆以金甌帝謂曰此宰相名若意之誰乎即中且賜酒太子曰非崔琳盧從愿乎帝曰然後不用事李徳裕明皇十七云上命相先以八分書書姓名金甌覆之直開元遺事以金筯賜宋璟以表其後唐書清望官姓名内琉璃瓶中夜焚香祝天以筯挾之首得盧文紀相之唐金竈舊紀乾元元年四月戊辰上進鍊石英金竈於興慶宮唐貢鏡仁壽鏡實錄大厯十四年六月己亥朔德宗詔竒器異服不得進獻己未詔揚州每嵗端午日鑄貢鏡於江中罷之書目鑑龍圖記一卷張説記開元楊州鑄鏡祥異白居易詩江心波上舟中鑄五月五日日午時鏡成將獻蓬萊宮背有九五飛天龍太宗常以人為鏡鑒古鑒今不鑒容乃知天子別有鏡不是揚州百鍊銅文苑英華仁壽鏡賦序云天寶初有獻書闕下言巴蜀之間有石鏡見於巖之半仁壽之字昭然可觀唐香案鑪香蹬鄭覃傳文宗嘗謂百官不可一日弛惰因指香案鑪曰此始華好用久則晦不治飾何由復新儀衞志宣政殿朝日殿上設黼扆躡席薰鑪香案宰相兩省官對班于香案前百官班于殿庭會要開成元年正月敕每入閤日次對官待宰相奏事退令至香案前各奏事百官志尚舎局大朝會設黼扆施躡席薰鑪朔望設幄而已儀衛志大駕鹵簿香蹬一有衣繡以黄龍執者四人服如折衝本朝志香蹬唐制也朱漆案緋繡花龍衣上設金塗香鑪漢武為雜寳案於桂宫劉向有薰鑪銘見選注梁昭明有銅博山香鑪賦唐藻席禮志皇太子納妃臨軒醮戒其日尚舍設皇太子席位於户牖間南向莞席藻席尚食設酒尊於東序下皇太子再拜詣階脱舄升席西南面立皇帝加元服藻席緇純禮祭天則蒲越槀鞂漢舊儀祭天用六綵綺席六重髙帝配天用紺席成帝初丞相衡等言其非是遂用槀鞂東漢用莞簟晉江左用蒯隋祭天用稾鞂配帝用蒲越唐麟德詔改用裀褥開元開寶禮上帝用稾鞂配帝用莞簟景德中孫奭請席皆加褥慶厯祀儀上帝以黄配帝以緋元豐中始不設褥於明堂神席之上以莞代蒲越稾鞂政和郊祀設蒲越明堂用莞簟太平興國玉杵臼太平興國五年五月己酉鄭州言修東嶽祠宇穿土得玉杵臼以獻太平興國王羲之石硯八年十月己丑越州以王羲之畫像并其石硯來獻唐詢有硯錄三卷端州嵗貢研皇祐金鑪皇祐二年六月七日少府監言明堂親獻神位前每座用塗金銀爐香合匕漆案朱羅衣元豐雉扇元豐三年詳定所言古者扇翣編次雉羽尾為之故於文従羽唐開元中改為孔雀凡大朝會陳一百五十六分居左右國朝復雉尾之名而四面略為羽毛之形中繡雙孔雀又有雙盤龍扇皆無所本遂改製偏扇團方扇為三等繡雉皇朝扇有朱團雉尾四等漢桓帝賜常侍尚方竹扇名曰九華魏曹植作賦傅毅有羽扇賦文選注晉傅咸羽扇賦上比列於南箕下等美於萐莆梁庾肩吾團扇銘曰武王𤣥覽造扇於前班生贍博百綺所傳魏王九華漢臣百綺題竹流譽贈葵稱美五明開製七華擅竒政和繖扇繖人臣通用以青絹為之國初京城内獨親王得用諸王儀物視宰相張青絹蓋繡鞍韉政和三年二月賜二王燕越三接青羅繖一紫羅大掌扇二塗金花鞍韀凡儀物皆用塗金以壯維城之固舊諸王不施狨座宣和末亦賜之東宮用三簷青羅繖紫花羅掌扇四開元禮義羅王公已下繖用青大駕八角紫繖王公已下四角青繖本朝鹵簿圖但引紫繖元祐七年十月二十七日太常議改用青皇太子妃茜紅羅掌扇四三簷青羅繖檐子前塗金銀香毬紹興十三年九月九日詔郊禮繖扇依舊制拂撒扇等不用珠飾太宗賜錢昱御書金花扇及急就章眞宗在東宫圖山水扇命錢易作歌賞愛之建炎玉管筆建炎三年七月乙巳呉國長公主入朝以易元吉畫玉管筆小玉山為獻上諭以朕平生無玩好復還之紹興象牙牌紹興五年十一月庚午朔初置節度使已下象牙牌其法自節鉞正任至横行遥郡第其官資書之於牌御書押字刻金塡之仍合同製造一留禁中一降付都督府相臣主其事緩急臨敵果有建立竒勲之人量功勞先給賜以為執守自軍興以來皆宣撫使便宜給劄補轉至是都省有此請紹興金唾壺二十八年三月四日上謂輔臣曰向者童子萬頃二年八月二十三日以頃為文林郎自言能詩嘗指金唾壺命題試之筆閣不下蓋出其不意耳淳熙琉璃鍾見射類乾道牙牌乾道元年十一月十四日執政晚對上出牙牌一面鐫吏户兵刑禮工𧷢吏字疏事目於下方上曰朕已令製造數副朝廷事卿等亦當依此以備遺忘兌戈和弓離磬崇鼎三代傳以為寶非頼其用也亦云上古而已堯旌舜琴禹鼎湯盤汾隂之鼎犍為之磬不足以為竒勃律之玉昆吾之金不足以為異夏后之鼎湯之典寶周之琬琰魯之大弓晉之闕鞏衞之大呂陳之石砮和之弓垂之矢離之磬𦙍之舞衣赤刀大訓天球河圖秦璽漢劒趙璧隋珠犍為之磬汾隂之鼎曲阜之履天䇿之弧歴世相傳以華國都陳器栢寢出鼎汾隂誦祈招之詩哦石鼓之歌工材百工之事爍金為刄凝土為器作車行陸作舟行水此皆聖人之所作也少皥五工正春秋正義賈逵云西方曰鷷雉攻木之工也東方曰鶅雉搏埴之工也南方曰翟雉攻金之工也北方曰鵗雉攻皮之工也伊洛而南曰翬雉設五色之工也樊光注爾雅四方之雉配工亦與賈同量樊光服䖍云雉者夷也夷平也使度器用平也考工記有刮摩之工凡六工非唯五也記是後世之書少皥時工未必如記所説殷六工曲禮見官制六卿類周五材三十工八材匠師大宰九職任萬民五曰百工飭化八材注八材珠曰切象曰瑳玉曰琢石曰磨木曰刻金曰鏤革曰剝羽曰柝考工記國有六職百工與居一焉注監百工者唐虞已上曰共工審曲面埶以飭五材以辨民器謂之百工五材金木皮玉土凡攻木之工七又有輈人為輈其實八也輪人為輪為蓋輿人為輿弓人為弓廬人為廬器戈柲殳車㦸酋矛夷矛匠人營國建國為溝洫車人為車為耒梓人為荀虡為飲器為侯攻木曰人無稱氏者蓋制木必以巧人一器而工聚者車為多周家所尚也疏三十工無輈車官別主此職扁莊子齊輪魯棒慶攻金之工六築氏執下齊為削冶氏執上齊為殺矢戈㦸鳧氏為鍾㮚氏為量段氏為鎛器桃氏為刃為劔習攻金曰氏無稱人者蓋貴乎世金有六齊鍾鼎斧斤戈㦸大刃削矢鑒燧攻皮之工五函人為甲鮑人為韋革韗人為臯陶韋裘氏闕設色之工五畫繢獨言所職之事雜五色二畫繢分為二實則四也疏畫繢者别官同職鍾氏染羽筐人闕㡛氏湅絲刮摩之工五玉人為玉周考工記非成之全書惟玉人與典瑞同榔雕人闕矢人為矢磬氏為磬搏埴之工二陶人為甗盆甑鬲庾旊人為簋豆注事官之屬六十此識其五材三十工略記其事耳曰人者以其事名官曰氏者官有世功若族有世業言人所謂工有巧言氏所謂守之世謂之工有虞氏上陶夏后氏上匠殷人上梓周人上輿注官各有所尊鄉師涖匠師注事官之屬梓人為飲器勺爵觚梓師罪之注梓人之長大射儀工人士注司空之屬説文逸周書有竘匠夏書工執藝事以諫魯工正匠師春秋傳叔孫豹為司馬與工正書服魯語匠師慶注掌匠大夫周語百工諫注謂若匠師慶諫魯莊公丹楹刻桷宋工正出車楚蒍賈為工正子西為工尹工尹路楚工尹商陽注官名齊侯使敬仲為工正注掌百工之官衞三匠莊子梓慶削木為鐻注魯大匠也輪人議齊桓公讀書檀弓注公輸若匠師月令孟冬命工師効功陳祭器案度程毋作淫巧以蕩上心注工師工官之長齊大匠晏子春秋景公新成栢寢之室使師開鼓琴師開左撫宮右彈商曰室夕東方之聲薄西方之聲揚公召大匠曰室何為夕大匠曰立室以宮矩為之於是召司空曰立宮以城矩為之明日晏子朝公曰先君太公立宮何為夕對曰古之立國南望南斗北戴樞星彼安有朝夕哉而以今之夕者周之建國國之西方以尊周也公曰古之臣乎漢工官見官名類漢考工令表少府有考工室令丞太初元年更名考工室為考工注臣瓚曰冬官為考工主作器械志中興改屬太僕太僕有考工令一人六百石漢官曰員吏百九人主作兵器弓弩刀鎧之屬成則傳執金吾入武庫及主織綬諸雜工章和以下宦者為之周官有考工記田蚡請考工地益宅傳漢尚方令詳見官制續志少府有尚方令六百石掌工作御刀劔諸好器物秦少府屬官器師古曰主作禁物崔寔有箴宦者傳蔡倫為尚方令永元九年監作秘劔及器械精工堅密為後世法元興元年造紙奏上之六典注後漢分尚方為三中左右魏晉因之前傳劉更生典尚方鑄作事張敞諫曰願明主游心帝王之術後尚方待詔皆罷王吉上疏宜減樂府省尚方明示天下以儉朱雲願賜尚方斬馬劔注尚方作供御器物後傳樊準請令太官尚方考工减無事之物唐百工監五監百官志將作監百工就谷庫谷斜谷大隂伊陽監監各一人副監一人丞一人掌采伐材木武德初置百工監掌舟車及營造雜作又置就谷庫谷斜谷太隂伊陽五監貞觀中廢百工監髙宗置百工部掌東都土木瓦石之功開元十五年為監六典庫谷在鄠縣就谷在盩厔百工在陳倉太隂在陸渾伊陽監在伊陽縣周禮山虞澤衡唐中尚令百官志少府監有中尚令一人掌供郊祀圭璧及天子器玩后妃服飾雕文錯綵之制凡金木齒革羽毛任土以時而供赦日樹金雞於仗南嵗二月獻牙尺寒食獻毬五月獻綬帶夏至獻雷車七月獻細針臘日獻口脂唯筆琴瑟絃月獻金銀曁紙非旨不獻製魚袋以給百官蕃客賜寶鈿帶魚袋則授鴻臚左尚令一人掌供翟扇蓋繖五路五副七輦十二車及皇太后皇太子公主王妃内外命婦王公之車路凡畫素刻鏤與宮中蠟炬雜作皆領之右尚令二人六典注開元十八年省一人掌供十二閑馬之轡凡五品三部之帳刀劔斧鉞甲胄紙筆茵席履舄皆儗其用皮毛之工亦領焉開元以前軍器皆出右尚署晉志少府統中左右三尚方令過江惟置一尚方又省御府唐藝文志王定畫本草圖貞觀尚方令貞觀十五年太子少師房𤣥齡右僕射髙士亷逄少府監竇徳素問北門有何營造宋朝營造法式李誡紹聖三年為將作監丞元符中被㫖著營造法式二十四卷晁公武志云三十四卷詔頒之天下熙寧初勑將作監編脩營造法式誡以為未備考䆒經史詢訪匠氏成此書頒于列郡世謂喻皓木經精詳此書蓋過之元祐七年三月詔將作監編修到營造法式共二百五十一册内淨條一百一十六册許令頒降玉海卷九十一
