body:
  text: 玉海卷二十七宋王應麟撰帝學經筵燕賜漢夏侯勝撰尚書論語説賜金賜桓榮輜車乘馬賈逵襲衣丁鴻御衣綬張酺車馬衣裳劉寛侍講華光賜襲衣魯丕冠幘履襪衣一襲魏正始中劉劭執經講學賜爵關内侯唐高祖釋奠講經賜陸徳明帛太宗文學館給珍膳元宗麗正院講易賜燕飲學士賦詩集仙殿置酒賜趙𢎞智名馬韋處厚金帛賜鄭澣金紫太液亭賜酒咸平崇政殿宴天聖慶厯景祐天聖太清樓宴賜章服附咸平五年正月丙辰講左氏畢宴崇政殿賜侍講邢昺襲衣金帶器幣遷工侍二年幸國子監召崔偓佺講大禹謨賜緋章服乾興賜御書唐賢詩見論語天聖二年六月己未講孝經徹賜馬宗元三品服五年十月庚辰講禮記畢宴崇政殿七年十月丁酉十二日講尚書畢曲宴太清樓凡講書終卷多賜會資善堂終一書有小宴寶元宴太清樓讀寶訓賜詩見後景祐讀唐書講春秋宴崇政殿見前慶厯二年四月卄五日説書徹章宴近臣崇政殿六年十一月十七日講詩徹宴近臣賜花作樂從官皆獻詩頌七年三月己亥講孝經賜曽公亮三品服皇祐元年十二月乙丑盧士宗講泰卦賜紫元祐講論語賜宴及御書詩講尚書賜宴元豐八年十二月十五日哲宗初御邇英講論語讀寶訓賜宴資善堂賚銀帛元祐二年九月十五日講論語畢賜輔臣講讀官宴于東宫上親書唐賢律詩分賜之凡十三人拜賜鳯蘇軾謝賜紫薇花詩一紙驚鸞囘字袖有驪珠三十四五年九月二十一日邇英講書讀寶訓賜御書詩一首十月二十九日講書終篇賜宴東宫嘉祐七年五月癸亥賜講讀官燕于資善堂以讀後漢書徹也司馬光有邇英閣讀畢後漢書蒙恩賜御製詩紹興賜講讀官御書扇賜茶墨元年四月九日賜侍讀王綯胡直孺侍講汪藻胡交修侯延慶御書杜詩扇王綯曰霖雨思賢佐丹青憶老臣直孺曰文物多師古朝廷半老儒交修曰相門韋氏在經術漢臣須十一年四月九日賜侍讀吳表臣蘇符新茶二十七日賜復古墨紹興講孟子書易賜講讀官讀寶訓燕賜十六年三月十九日辛卯講孟子終篇翌日賜講官鞍馬象笏金硯水瓶筆墨等越三日賜御筵于城隍司賜侍讀香茗初復故事也二十三年十一月七日講尚書終篇賜侍讀侍講說書修注官金帶象簡鞍馬越二日乙巳賜御筵于祕書省就賜香茗皆作詩以進自是為故事二十五年四月二十三日講易終篇以犀帶象牙簡金鞍勒馬賜宰相賜侍讀已下金帶象簡鞍馬銀幣内王珉加賜金魚硯匣越二日賜御筵二十七年十月十六日經筵讀三朝寶訓終篇賜侍讀王師心象簡金鞍勒良馬象管端研檀香匣復古殿墨象牙粘板壓紙金研水瓶越二日乙巳賜御筵始用化成殿樂遣中使賜香茶舊例春季賜茶墨隆興元年止賜茶淳熙四年九月丙辰召侍讀史浩錫燕澄碧殿浩進古詩三十韻御製俯同其韻云皓首持六經日侍明光裏翼乎鴻遇風縱矣魚在水眷言澄碧行勝賞得迂趾亦屢引公卿對此談政理虚心欲受人忠言資逆耳朕瘠天下肥至樂無易此期爾罄嘉謀使我勲業起七年五月六日詔讀三朝寶訓終篇就秘書省賜御筵宰執賜牙簡金帶鞍馬香茶侍讀金硯匣端硯鞍馬香茶侍講説書修注官鞍馬香茶餘見前周必大進詩云肇開講席臨清廂赭袍玉斧光照廊台司夾侍書案黃翰林進讀天容莊終篇正値恩德洋道山肆筵酌天漿宫花壓帽羅絲簧硯來復古翰墨光馬出帝閑眞驌驦閩山正焙隨寶香君賜如天不可量胡宿有講畢周禮詔賜御筵詩西清閒縹帙東面授丹書經中禮樂之器詔圖繪其狀隨經所説省覽觀書漢覽書林和帝永元十三年正月丁丒帝幸東觀覽書林閲篇籍博選術藝之士以充其官儒林傳孝和數幸東觀覽閲書林唐乾元殿觀書見書目類開元六年八月十四日制令中書門下及文武百官入乾元殿就東廊觀書内庫出絹綵分賜無量及四庫官有差無量奉詔整比四部書總施縹軸籖帙上下架太平興國崇文院觀書上初即位建三館臨幸者再輪奐壯麗三年二月丙辰朔名曰崇文院西序啓便門以備臨幸六庫書籍正副本凡八萬卷辛未幸西綾錦院觀織室還幸崇文觀書宰輔諸王檢閲問難賜飲中堂盡醉而罷淳化閲秘閣圖籍又見後淳化元年八月癸卯朔召近臣閲秘閣圖籍一云淳化元年五月以史館所藏天文圖畫一百十四卷付秘閣八月賜宴大陳圖籍觀之㑹要元年八月一日癸卯祕書監李至請李昉宋琪徐鉉及學士侍郎給諫舍人等詣閣觀御書圖籍帝知之詔賜御筵出書籍令縱觀翌日甲辰又詔御史中丞王化基及三館學士縱觀賜宴實録癸卯朔賜宴於祕閣先是遣使於諸道求募古書奇畫及先賢墨迹小償以金帛大授以官數年間獻書者不可勝計諸道募得者數倍復詔史館取天文占候䜟緯方術等書五千一十二卷并内出古畫圖跡百四十軸悉藏祕閣圖籍之盛近代無比三年九月己未上幸祕閣觀書賜從臣館閣官飲又命傅潛戴興等宴飲縱觀羣書上意欲武將知文儒之盛也咸平崇文院閲羣書秘閣觀太宗御書館閣閲四庫書咸平二年七月甲辰幸崇文院召秘書監楊徽之集賢學士錢若水等開書庫徧閲羣書登秘閣觀太宗御製御書墨跡賜館閣官器幣有差又見視學五年七月庚戌幸三館秘閣閲四庫書賜直官校理器幣因召從臣射後苑景德國子監觀羣書漆板二年五月戊申朔幸國子監觀羣書漆板眞宗既和戎偃革志在右文是年五月戊申朔幸國子監謁拜先聖既而御講堂召從臣學官賜坐因歴覽書庫觀羣書漆板及匠者摹刻問祭酒邢昺曰板數幾何昺曰國初印板止及四千今多至十萬經史義疏悉備上曰非四方無事何以臻此以書庫迫隘與錢俶第相接命易隟地十歩以益之又幸玉津園南觀刈麥九月國子監言尚書孝經論語爾雅四經字體訛缺請以李鶚本别雕命杜鎬孫奭校勘鶚字是廣順三年書熈寧七年監書一百二十五部詳見五經景德崇文院觀四庫圖籍三年四月丙子幸崇文院觀四庫圖籍及所編君臣事迹徧閲門類詢其次序王欽若楊億悉條對或未當者上立命改正因謂侍臣曰今編此書欲為將來典法使開卷者有益也賜編修官器帛有差遂宴百官于崇政殿四年八月壬寅幸崇文院觀書賜修書官器幣實録八月壬寅幸崇文院觀所編君臣事迹王欽若楊億以草本進御上徧覽之又入四庫閲視圖籍賜修書官器幣又幸内藏庫宴從官於崇政殿景德太清樓觀四部書見御書又見後祥符召宗室觀書龍圖閣尚書圖龍圖閣書目二年九月丁丑召宗室觀書于龍圖閣因覽尚書圖寧王元偓曰侍講近説尚書論語間即習射上喜其勤學長編云召元偓等赴龍圖閣觀書目九年三月戊申召宗室觀書于玉宸殿祥符觀書龍圖閣天禧祥符三年八月甲寅召近臣觀書龍圖閣上閲元和國計圖又觀國初已來所獲瑞物于崇和殿遂宴資政殿上作七言詩從臣皆賦五年十二月丁丒召近臣至龍圖閣閲書開宴觀新造宣德述古二殿又幸資政殿上作七言詩命即席皆賦九年十一月二十三日癸亥召近臣觀書龍圖閣楊億吕夷簡與上作詩五章分賜王旦以下儒臣即席賦詩天禧二年四月丁卯五年二月丁未召輔臣觀書龍圖閣詳見後祥符太清樓觀書景德書見御祥符七年三月癸巳八日賞花宴後苑登太清樓觀書射于樓下特詔知雜御史與㑹作賞花觀書詩二首從臣畢和天禧二年十一月辛未二十一日召近臣至是樓觀太宗御書及聖製羣書賜宴樓下上作太清樓閲書歌詩二首歌七言十韻三年三月十三日庚午翔鸞閣觀書射于樓下前此觀太宗御製及四部書于景德四年之三月奉安太宗御集于祥符五年之八月而二年正月癸亥六年三月丙申七年三月癸巳十月丙寅皆燕射于此巍巍太清璇題耀日四庫羣書彪列昈析丹霄侍宴僅奬勲力勤政賜酺夸肆過實黼帳霞開華纓霧集晏殊表云受羲姒之珍録舉云亭之吉儀絳殿紫扄鴻鸞景從刻懿律於龜趺絢英辭於芸簡山經海志多郭璞之靡詳縹帙松籖盡黃香之未見天聖太清樓觀書七年十月丁酉講尚書徹卷召輔臣講讀近臣宗室觀書太清樓宴於樓下八年三月壬申觀山水字石宴是樓從臣應制賦歌詩令中書第優劣九年閏十月戊辰餞孫奭宴是樓樓四壁陳御飛白書分賜從臣寶元二年十一月癸巳宴輔臣宗室于樓觀三朝寶訓賜詩出天人祥異書若天聖之三年三月癸卯六年三月壬子七年之閏二月戊午九年之三月甲子賞花宴射以至景祐慶厯嘉祐賞花觀稻之集不一景祐崇政殿觀書三年十月乙丑御崇政殿觀三館秘閣新校子集書凡萬二千餘卷賜校勘官器幣有差宴輔臣兩制館閣之臣于崇文院詳見書目觀御製御書咸平龍圖閣觀太宗御書龍圖閣五經圖秘閣觀御書觀書龍圖閣太宗御書目録咸平四年十一月丁亥上御龍圖閣召輔臣觀太宗草行飛白篆籕八分書及古今名畫移御崇和殿閲張去華元元論及國田圖上曰經國之道必以養民稼穡為先朕嘗冀邊鄙稍寧兵革粗息則可以力行其事富庶吾民矣初去華獻元元論二萬餘言大抵以養民務穡為急眞宗嘉賞命寫以縑素為十八軸列置龍圖閣之四壁朝夕觀焉先是二年七月甲辰幸崇文院閲羣書登祕閣觀太宗御製御書墨迹五年十月己卯召近臣觀書於龍圖閣於閣之四壁設五經圖閣上藏太宗書帖三千七百五十卷上執目録示近臣曰先帝留意詞翰朕孜孜綴緝片幅寸紙不敢失墜至於題記時事及書在屏扇或微損者悉加装背又幸崇和殿後閣悉藏本朝名臣集次御資政殿壁有唐楊相如政要論上作七言詩侍臣皆賦時楊億應制詩云羣玉中天開策府神龜温洛薦圖書景德龍圖閣閲太宗御書六閣龍圖閣賛景德二年四月戊戌幸龍圖閣近臣畢從种放預焉作龍圖閣贊閲太宗御書及觀諸閣書畫宴于崇和殿上作五言詩從臣皆賦命知制誥李宗諤楊億作序龍圖閣在會慶殿之西偏北連禁中東曰資政殿西曰述古殿閣上藏太宗御書及典籍圖畫寶瑞之物太宗御製御書文集總五千一百一十五卷軸册又有御書素扇數十下列六閣一作閣曰經典閣總三千三百四十一卷目録三十卷史傳閣總七千三百五十八卷目録四百四十二卷子書閣總一萬三百六十三卷一云八千四百八十九卷文集閣七千一百八卷天文閣二千五百六十一卷圖畫閣七百一軸卷册又古聖賢墨跡二百六十六卷上曰朕退朝之暇無所用心聚此圖書以自娛耳庚子以御製龍圖閣贊賜輔臣上曰龍圖閣書屢經讎校最為精詳已復傳寫一本置後苑太清樓朕自居藩邸以至臨御凡亡缺之書捜求備至毎於藏書之家借其本必令置籍出納國學館閣經史未有板者悉令刋實録恐出㑹要當攷今按長編云閣在㑹慶殿西偏北連禁中閣上藏太宗御書五千一百十五卷軸下設六閣經典閣三千七百六十三卷史傳閣八千二十一卷子書閣一萬三百六十二卷文集閣八千三十一卷天文閣二千五百六十四卷圖畫閣一千四百二十一軸卷册與前文全不同景德大清樓觀太宗聖製御書及四部書見御書類又天禧二年十一月辛未詳見後晏殊謝觀書表丹函翠藴藏先聖之寶章綈􅐆縹􅌩集九流之閟籍祥符觀龍圖閣太宗御書及四部書籍天禧觀文論歌詩祥符三年正月戊寅二十八日召近臣觀龍圖閣太宗御書及四部書籍又至閣西觀畫賜酒閣下上作觀書開宴五言詩令即席皆賦又出聖製㑹眞宫碑九天司命天尊殿銘泰山重修聖像記作五言詩賜王旦等和二年四月七日壬辰宴餞种放上作詩是日閲諸閣圖畫太宗御書宴崇和殿九月二十六日丁丑召寜王元偓等觀書八月甲寅又召近臣觀書五年十二月丁丑至龍閣閲書開宴九年十一月二十三日癸亥召近臣觀書于是閣楊億吕夷簡與上作詩五章分賜王旦等天禧二年四月丁卯四日召近臣謁太宗御容于宜聖殿遂至龍圖閣觀書及聖製賛頌石本時昇王未出閤始預坐令從官賦觀書賞花詩四年十一月戊午召近臣龍圖閣觀圖籍御製文論歌詩上曰朕聽政之暇以翰墨自娛丁謂請鏤板許之遂宴資政殿詳見御集五年二月丁未又觀御書于是閣慶厯八年幸閣觀遊藝集嘉祐七年觀三聖御書祥符玉宸殿觀太宗文翰苑中觀太宗聖製四部羣書聖製書籍記射堂閲太宗御書見御詩四年十月丙寅二十八日召輔臣至苑中山亭觀太宗聖製四部羣書又至玉宸殿觀古今書讀聖製書籍記石帝作五言詩王旦等皆賦景德四年三月乙巳玉宸殿事見殿類七年三月十日乙未召輔臣于玉宸殿觀太宗聖文神翰上各製文于篇末仍總其數刻石皇子從上指詩牌字問之應聲以對賜宴翔鸞閣又浮觴曲水奏雲韶樂上賦觀書流杯七言詩侍臣皆賦八年四月癸丒復詔輔臣於此殿觀書及太宗御書移御别殿觀御製皇帝王覇五臣等論遂臨水軒賦詩各賜衣帶器幣王欽若陳堯叟趙安仁等與焉九年二月以御撰玉宸殿記刻石翔鸞閣三月四日戊申召宗室觀書于是殿後觀書觀稻於此如天禧之二年三年四年不一而止御集有玉宸集五卷祥符七年六日藏之秘閣餘見殿類祥符國子監觀論辯七年四月己巳宰臣文武百官詣國子監觀太宗御集御書及新刻聖製論辯遂宴近臣於監詳見御書祥符翔鸞閣觀太宗御書天禧附九年二月癸卯二十七日召近臣于後苑翔鸞閣觀太宗御書因示聖製太宗聖文神筆頌玉宸殿記一云觀聖製樂府文論五臣論樂府辭上作歌詩二篇命從臣賦詩移幸流杯殿登象瀛山翠芳亭遂宴玉宸殿殿在苑中密邇宫禁天禧三年三月庚午宴後苑登翔鸞閣觀太宗御集及聖製又御儀鳯閣玉宸安福殿作賞花釣魚五七言詩命皇太子書以示近臣羣臣皆賦翰學盛度面求賜本詔與之遂燕射太清樓天禧太清樓觀聖製羣書閲書歌詩二年十一月辛未召近臣至後苑太清樓觀太宗御書及聖製羣書賜宴樓下上作太清樓閲書歌詩二首歌七言十韻從臣皆和晏殊和閲書歌瓊字金扉逈倚天南齊七志罕遺逸西漢九流咸粲然天禧清景殿觀御製三年九月丙子詔宗室宰臣兩制二館以上對内中清景殿觀御製元良述承華要略玉清宫白鶴贊太清樂歩虚詞玉宸殿記清景殿書事詩又作詩十韻賜㓂準等遂宴殿内晏殊集云慶雲殿玉京殿讀御製銘記賜宴五年四月十六日壬戌召近臣館閣官觀御書於天章閣宴羣玉殿詳見御集天聖御書院觀太宗眞宗御書五年十月甲午八日上與皇太后幸御書院觀太宗眞宗御書賜本院内臣等器幣院太宗所置在東宫翰林學士宋綬撰記刻石院壁皇祐三年五月丁卯召近臣館閣臺諌官觀書于御書院天聖龍圖天章閣觀三聖御書慶厯觀游藝集嘉祐觀三聖御書天聖八年八月丁亥六日召輔臣兩制宗室於龍圖天章閣觀三聖御書元眞殿觀瑞穀宴蘂珠殿宰臣以下賦詩慶厯八年三月甲寅幸二閣召近臣宗室觀太宗游藝集及三朝瑞物新刋眞宗幸澶州回鑾詩碑文初祥符中取太宗御製樂譜棊圖曲歌詩為百二十卷至是上命侍講曽公亮詳校親為後序以示羣臣嘉祐七年十二月丙申幸二閣召皇子輔臣兩制宗室臺諫觀三聖御書又幸寶文閣分賜從臣飛白書賦詩作觀書詩庚子再幸天章召從臣觀三朝瑞物十三種又觀太宗眞宗御集治平三年九月丙辰幸天章寶文閣命兩府觀學士王珪所書仁宗御詩石刻慶厯崇政延和殿觀御書七年八月丙寅二十四日御崇政殿召近臣觀御書眞宗御諡位版及新作郊廟祭器八年九月己亥四日御延英殿召輔臣觀御書及天地祖宗位版嘉祐六年三月乙酉二日御崇政殿召輔臣觀御書兖州文宣王廟榜上巾櫛而書其恭如是轉運使張師中進寶奎輝文歌皇祐迎陽門觀御書觀三朝御書元年十一月庚寅觀三朝訓鑒圖于迎陽門二年九月癸巳五日召輔臣觀三朝御書及唐明皇山水圖於此門至和二年二月辛丒十三日召近臣觀飛白御書鳯翔上清宫榜于此門嘉祐二年六月癸亥觀御書寶章閣牓于此門三年五月丙戌觀御書并州舍利閣榜七月壬辰二十四日觀御書妙法院正覺殿牓于此門次觀三聖御容于天章閣九月丙戌御迎陽門觀景靈宫天興奉眞廣孝殿御飛白書牓宣和秘書省觀書四年三月辛酉幸秘省御右文殿宣羣臣觀書及古器遂幸太學紹興秘閣觀書十四年七月丙子上幸秘書省至道山堂降輦遂幸秘閣先是戊午游操等上表請幸召羣臣觀累朝御製御書晉唐書畫三代古器還御右文殿賜羣臣茗飲賜少監㳺操御書扇戊寅上曰秘府書籍尚少宜廣求訪賜詔曰周建外史掌三皇五帝之書漢選才儒定九流七略之奏八月丙戌拜表稱賀淳熙秘閣觀御書五年九月十二日壬申幸秘書省受朝右文殿移御秘閣入東西壁觀累朝御書上手以光堯太上皇帝所書琴賦示羣臣諭曰此鍾王所不及既又修太平興國故事張宴右文酒五行罷翌日癸酉賜御製詩詩有宴開芸閣坐對蓬山之語又曰稽古右文慙菲德禮賢下士法前王賜宰臣史浩以下亦是時三衙皆與坐閣門舍人列西廡帝暉下曯光榮河温洛之藏天藻昭垂邁過沛横汾之詠表宋朝三聖御書太祖建隆初作文宣兖公贊乾德開寶中作應天厯本草序建隆御札令轉對乾德南郊首出御札書八字賜李符書一統賜王溥太宗雍熙三年飛白賜李昉端拱二年急就章付秘閣淳化中飛白玉堂賜蘇易簡又為眞草行三體書御詩又為四體書賜近臣祕閣字賜李