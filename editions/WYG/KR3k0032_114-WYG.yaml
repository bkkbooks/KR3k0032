body:
  text: 玉海卷一百十四宋王應麟撰選舉科舉取士科目自夏商以前不見於經其可見者至周始著自周後數千載其間廢置因革皆可考大抵自重而漸輕自緩而漸速周三物賢能書天官宰夫書其能者與其良者以告於上注鄭司農云若今舉孝亷賢良方正茂才異等疏此謂宫中諸吏也地官大司徒以鄉三物教萬民而賔興之一曰六徳藴於内知仁聖義忠和二曰六行形於外孝友睦婣任恤三曰六蓺禮樂射御書數注物猶事也興猶舉也民三事教成鄉大夫舉其賢者能者以飲酒之禮賔客之既則獻其書於王鄉大夫三年則大比攷其徳行道藝而興賢者能者鄉老及鄉大夫帥其吏與其衆寡以禮禮賓之注賢者有徳行能者有道藝衆寡謂鄉人之善者無多少也鄭司農云興賢者謂若今舉孝亷興能者謂若今舉茂才賓敬也𤣥謂變舉言興者謂合衆而尊寵之以鄉飲酒之禮禮而賓之䟽吏謂州長以下衆寡謂鄉中有賢能者皆集在庠學鄉飲酒堂上堂下皆有衆賓不言其數厥明鄉老及鄉大夫羣吏獻賢能之書于王王再拜受之登于天府内史貳之䟽賢能之書亦寳物故藏于天府内史副寫一通文書擬授爵禄退而以郷射之禮五物詢衆庶此謂使民興賢出使長之使民興能入使治之注使民自舉賢者因出之而使之長民教以徳行道蓺於外使民自舉能者因入之而使之治民之貢賦田役之事於内州長正月之吉屬民讀法以攷其徳行道藝而勸之三年大比則大攷州里以賛鄉大夫廢興黨正正歲屬民讀法而書其徳行道藝族師月吉則屬民讀邦法書其孝弟睦婣有學者閭胥凡春秋云云聚衆庶既比則讀法書其敬敏任恤者遂大夫三嵗大比則帥其吏而興甿明其有功者注舉民賢者能者如六鄉之為也又因舉吏治有功者䟽帥其吏者縣正至鄰長司諌掌糾萬民之徳以時書其徳行道藝辨其能而可任於國事者夏官司士王族故士注故為士者䟽新升試士未得正爵者為新士不得留宿衛也記學記比年入學中年考校注周禮三嵗大比乃考焉䟽此中年考校非周禮也皇氏以中年考校謂鄉遂學一年視離經辨志以下皆謂國學非也王制䟽鄉人故三年一舉學者故中年考試殷周同也文王世子凡語于郊者必取賢歛才焉或以徳進或以事舉或以言􅀭注語謂論説於郊學大樂正論造士之秀者升諸司馬曰進士謂此矣射義諸侯嵗獻士於天子注引舊説大國三人次國二人小國一人鄉送一人至君所管子昭王穆王合羣􅙕比校民之有道者注謂興賢者詩甫田或耘或耔黍稷嶷嶷攸介攸止烝我髦士自國子而下為士者不出於鄉遂夫家管子所謂秀民之能為士者也閭月書族時考州嵗比鄉三年賔興古者使民興鄉之賢能還以長治其鄉士自修於家民自為鄉謀故毁譽公賢否明衆賔之席弗屬堂下之觀禮者弗坐無異辭也遂以耕為主故其事畧鄉以教為主故其事詳周選士王制命鄉論秀士升之司徒曰選士司徒論選士之秀者注秀士鄉大夫所考而升之學曰俊士升于司徒者不征于鄉升于學者不征於司徒曰造士樂正崇四術立四教順先王詩書禮樂以造士大樂正論造士之秀者以告于王而升於司馬曰進士司馬辨論官材論進士之賢者以告于王而定其論論定然後官之任官然後爵之位定然後禄之司士注王制曰司馬辨論官材云云漢志先王之制里有序而鄉有庠序以明教庠以行禮而視化焉八嵗入小學學六甲五方書計之事始知室家長幼之節十五嵗入大學學先聖禮樂而知朝廷君臣之禮其有秀異者移鄉學于庠序庠序之異者移國學于少學諸侯嵗貢少學之異者於天子學于太學命曰造士行同能偶則别之以射然後爵命焉漢紀武帝元朔元年十一月詔曰進賢受上賞古之道也有司奏議曰古者諸侯貢士壹適謂之好徳再適謂之賢賢三適謂之有功注臣瓉曰尚書大𫝊云儀禮古者五十而后爵射義古者天子之制諸侯嵗獻貢士於天子天子試之射宫注嵗獻獻國事之書及計偕物也三嵗而貢士舊説云見上古者天子以射選諸侯卿大夫士注選士者先考徳行乃後决之於射詩菁菁者莪樂育材也箋云人君教學國人秀選俊造進士養之以漸至於官之濟濟多士文王以寧天倬彼雲漢為章于天周王壽考遐不作人有鳶飛戾魚躍于淵豈弟君子遐不作人肆成人徳小子有造古之人無斁譽髦斯士藹藹王多吉士舜典敷奏以言明試以功臯陶謨翕受敷施九徳咸事俊乂在官益稷萬邦黎獻共惟帝臣惟帝時舉敷納以言明庶以功車服以庸殷周鄉塾貢士齊三選北史劉景安曰殷周以郷塾貢士射義古天子制諸侯嵗獻獻國事之書及計偕物也貢士於天子三嵗而貢士舊說云見上尚書大傳諸侯三年一貢士一適謂之好徳再適謂之賢賢三適謂之有功賜以車服弓矢再賜以秬鬯三賜以虎賁號曰命諸侯後漢左雄傳古者諸侯嵗貢士進賢受上賞非賢貶爵土升之司徒辨論其材齊語正月之朝鄉長復事君親問焉曰於子之鄉有居處好學慈孝於父母聰慧質仁發聞於鄉里者有則以告又曰有拳勇股肱之力秀出於衆者有則以告鄉長退而修徳進賢公親見之遂使役官令官長期書伐選其官之賢者而用之公召與語訾相其質退問其鄉以觀其所能升以為上卿之賛謂之三選謂鄉長所進官長所選公所訾相也漢舉賢良方正極諫文學親䇿賢良三道紀髙祖十一年二月詔曰賢士大夫有肯從我游者吾能尊顯之其有意稱明徳者必身勸為之駕遣詣相國府書行義年文帝二年十一月癸邜晦日食詔曰適見於天其悉思朕之過失以啓告朕及舉賢良方正能直言極諫者以正朕之不逮十五年九月詔諸侯王公卿郡守舉賢良能直言極諫者上親䇿之傅納以言晁錯傳詔有司舉賢良文學士錯在選中上親䇿詔之曰惟十有五年九月壬子皇帝曰詔有司諸侯王三公九卿及主郡吏各帥其志以選賢良明於國家之大體通於人事之終始及能直言極諫者各有人數二三大夫之行當此三道大夫其上三道之要及永惟朕之不徳吏之不平政之不宣民之不寧四者之闕悉陳其志錯對曰平陽侯臣窋等所選賢良太子家令臣錯云云對䇿者百餘人唯錯為髙苐遷中大夫注三道國體人事直言也武帝建元元年冬十月詔丞相御史列侯中二千石二千石諸侯相舉賢良方正直言極諫之士丞相綰奏所舉賢良或治申商韓非蘇張之言亂國政請皆罷奏可建元中上招賢良公卿言鄧先帝即位求賢良唐時年九十餘馮唐為楚相武嚴助郡舉賢良百餘人帝善助對擢中大夫士轅固以賢良召良公孫𢎞傳帝初即位招賢良文學𢎞年六十以賢召為博士制帝舉賢良文學之士前後百數董仲舒以賢良對䇿曰郡國諸侯公選賢良修絜博習之士欲聞大道之要至論之極復䇿之曰詳延特起之士今子大夫待詔百有餘人天子復冊之仲舒對䇿推明孔氏抑黜百家立學校之官州郡舉茂材孝廉皆自仲舒發之元光元年五月詔賢良曰賢良明於古今王事之體受䇿察問咸以書對著之于篇於是董仲舒公孫𢎞等出焉公孫𢎞傳元光五年復召賢良文學菑川國復推上𢎞𢎞謝國人固推𢎞至太常上䇿詔諸儒制曰云云時對者百餘人太常奏𢎞第居下䇿奏櫂為第一昭帝始元元年閏月遣王平等五人持節行郡國舉賢良問民所疾苦五年六月詔令三輔太常舉賢良各二人郡國文學髙第各一人魏相舉賢良對䇿髙第為茂陵令王吉舉賢良為昌邑中尉六年二月詔有司問郡國所舉賢良文學民所疾苦議罷鹽鐵𣙜酤始元中賢良唐生文學萬生之徒六十餘人咸聚闕庭宣帝本始元年四月庚午地震詔内郡國舉文學髙第各一人内史舉温舒文學髙第遷右扶風丞四年四月壬寅地震詔博問經學之士令三輔太常内郡國舉賢良方正各一人地節三年三月令内郡國舉賢良方正可親民者十月詔曰廼者九月壬申地震有能箴朕過失及賢良方正直言極諫之士以正不逮毋諱有司神爵四年四月令内郡舉賢良可親民者各一人元帝初元二年三月詔曰二月戊午地震丞相御史中二千石舉茂才異等直言極諫之士初元中王尊舉直言遷虢令永光二年三月壬戌朔日食詔令内郡國舉茂才異等賢良直言之士各一人朱雲舉方正為槐里令光禄勲匡衡舉孔光方正為諫大夫成帝建始二年二月詔三輔内郡舉賢良方正各一人三年十二月戊申朔日食地震詔丞相御史將軍列侯中二千石及内郡國舉賢良方正能直言極諌之士詣公車谷永傳建始三年冬太常劉慶忌舉永待詔公車對奏天子特召見其夏皆令諸方正對䇿對者數十人永與杜欽為上第杜欽傳合陽侯梁放舉欽史丹舉班斿對䇿對王音舉何武賢良方正䇿拜為諫大夫河平四年三月癸丑朔日食舉淳厚有行能直言之士鴻嘉二年三月詔舉淳厚有行義能直言者元延元年七月詔以日食星隕公卿大夫與内郡國舉方正能直言極諌者各一人北邉二十二郡舉勇猛知兵法者各一人何武為京兆尹坐舉方正召見槃辟雅拜左遷當紅陽侯立舉陳咸對䇿拜光禄大夫翟方進奏咸不蒙方正舉並劾立選舉不以實太常舉房鳯方正言蕭由舉賢良為定陶令遷鴻嘉中王嘉舉淳朴能直召見宣室對政事得失大中大夫平阿侯舉樓䕶方正為諫大夫永始三年正月己夘晦日食舉淳樸遜順有行義者各一人譙𤣥詣公車對䇿髙苐拜為議郎哀帝建平元年二月舉孝弟淳厚能直言通政事可親民者各一人扶陽侯韋育舉杜鄴方正對䇿賢良周䕶宋崇等對䇿平帝元始元年五月丁巳朔日食詔公卿舉淳厚直言太鴻臚左咸舉譙𤣥詣公車對策申屠剛忠賢良方正對䇿後紀光武建武六年冬十月丁丑日食勅公卿舉賢良方正各一人七年夏四月壬午日食詔公卿司𨽻州牧舉賢良方正各一人章帝建初元年三月甲寅地震己巳詔太傅三公中二千石郡國守相舉賢良方正能極諌之士各一人五年二月庚辰日食詔舉直言極諌能舉過失者各一人趙熹舉魯恭直言待詔公車對建初元年詔舉賢良方正大司農劉寛舉魯丕時策百餘人維丕在髙第衛尉馬廖舉李育方正為議郎直太尉牟融舉江革賢良方正司徒鮑昱舉鄭均言不就將作大匠任隗舉髙鳯直言到公車名魯恭為中牟令㑹詔百官舉賢良方正恭薦中牟士王方召詣公車禮之與公卿所舉同和帝永元六年三月丙寅詔三公中二千石内郡守相舉賢良方正能直言極諌各一人永元九年李法應賢良方正對策除博士拜郡及大司農舉戴封對䇿第一議郎安帝永初元年三月癸酉日食詔公卿守相舉賢良方正有道術之士明政術達古今能正言極諌各一人五年閏三月戊戌日食地震詔三公特進列侯中二千石郡守諸侯舉賢良方正有道術達政化能直言極諌之士各一人公卿舉樊英方正有道賢楊厚郎顗張楷周燮皆不就蘇章安帝時舉良方正對䇿髙第為議郎順帝延光四年九月京師大疫辛亥詔公卿守相舉賢良方正直言極諌各一人陽嘉二年六月丁丑地拆引公卿所舉純樸之士對策李固馬融張衡以固為第一漢安元年二月丙辰詔大將軍公卿舉賢良能探賾索隐者各一人冲帝建康元年九月地震庚戌詔舉賢良方正之士䇿問以皇甫規對為上第拜郎中杜喬房植舉荀淑對䇿法真舉賢不就桓帝建和元年四月庚寅詔舉賢良方正直言極諌三年六月庚子同永興二年二月癸夘舉各一人司徒种暠舉劉淑賢良方正對䇿為天下第一延熹八年正月永康元年五月皆以日食舉賢良方正爰延舉賢良方正再遷為侍中太尉舉孔昱方正對䇿不合正夏馥舉直言陳蕃舉方正不就荀爽舉賢良方對䇿張奐舉賢良對䇿第一千延熹八年舉賢良方正正楊秉舉劉瑜對灾異八餘言趙典舉有道方賀純三舉賢良不就問五行志注廣州先賢傳曰和帝時䇿陰陽不和方正欎林養奮對靈帝初太尉黄瓊舉檀敷方正對䇿合時宜遷議郎建寧二年舉有道之士謝弼對䇿拜郎中許孫期郡舉方正不就扶桓􅁮舉有道方正道劭舉方正淳樸董再舉賢良方正有不就張胡廣舉劉矩賢良方正範以方正拜議郎前𫝊貢禹舉賢良為河南令疏受以賢良舉為太子家令黄霸左馮翊宋畸舉霸賢良髙第擢􅀭州刺史朱邑舉賢良為大司農丞蓋寛饒舉方正對䇿髙第周禮宰夫書其能者良者以告于上注鄭司農云若今時舉孝亷賢良方正茂才異等漢射䇿甲科令列傳蕭望之以射䇿甲科為郎注師古曰謂為難問疑義書之於䇿量其大小署為甲乙之科列而置之不使彰顯有欲射者隨其所取得而釋之以知優劣射之言投射也對䇿者顯問以政事觀其文辭定髙下也匡衡以射䇿甲科不應令除為太常掌故注師古曰投射得甲科之䇿而所對之指不應令條是不應甲科之令史記禇先生曰匡衡數射䇿不中至九中丙科兒寛以射策為掌故馬宫翟方進何武王嘉並以射策甲科為郎房鳯以射策乙科為太子掌故儒林召信臣以明經甲科為郎循吏􅀭雄解嘲鄉使上世之士處乎今策非甲科行非孝亷舉非方正獨可抗䟽時道是非髙得待詔下觸聞罷又安得青紫儒林傳平帝時嵗課甲科四十人為郎中乙科二十人為太子舍人丙科四十人補文學掌故賛曰武帝設科射策後傳張元光武時顔氏博士缺試䇿第一拜博士徐防永元十四年上䟽曰博士及甲乙策試宜從其家章句開五十難以試之論語不宜射策詔從防言李廵以為博士試甲乙科争第髙下更相告言乃刻石經争者用息順帝紀陽嘉元年七月丙辰増甲乙科貟各十人漢孝悌力田常貟唐孝悌力田見制舉紀髙帝二年二月舉民年五十以上能帥衆為善置以為三老鄉一人擇一人為縣三老恵帝四年正月詔舉民孝弟力田者復其身髙后元年二月初置孝弟力田二千石者一人注師古曰特置孝弟力田官而尊其秩欲以勸厲天下令各敦行務本文帝十二年三月詔曰孝悌天下之大順也力田為生之本也三老衆民之師也亷吏民之表也朕甚嘉此二三大夫之行令萬家之縣云無應令是吏舉賢之道未備也其遣謁者勞賜三老孝者帛人五匹悌者力田二匹亷吏二百石以上率百石者三匹以户口率置三老孝悌力田常貟令各率其意以道民師古曰増置其貟廣教化也武帝建元元年四月詔曰於郷里先耆艾奉髙年古之道也民年九十以上復子孫復孝敬謂此也元朔元年十一月詔曰旅耆老復孝敬董仲舒傳制曰勸孝悌崇有徳元狩元年四月詔曰朕嘉孝弟力田其遣謁者存問致賜賜縣三老孝者帛人五匹鄉三老弟者力田帛人三匹六年六月詔曰諭三老孝弟㠯為民師舉獨行之君子徴詣行在所宣帝地節三年十一月詔曰傳曰孝弟仁之本其令郡國舉孝弟有行義聞於鄉里者各一人四年二月詔曰導民以孝則天下順元康元年三月賜三老孝弟力田帛元帝初元五年四月永光二年二月建昭五年三月賜帛級成帝建始元年二月賜錢帛三年三月賜爵二綏和元年二月賜帛成帝陽朔四年正月詔曰洪範八政以食為先先帝勸農薄其租稅寵其彊力令與孝弟同科哀帝建平元年二月詔舉孝弟傳晁錯對䇿曰尊賜孝悌農民不租馮唐以孝著為郎文翁為蜀郡守學官弟子髙者補郡縣吏次為孝弟力田黄霸神爵四年四月詔潁川孝弟有行義民三老力田皆以差賜爵及帛五鳯三年張敞言宜令貴臣明飭長吏守丞歸告二千石舉三老孝弟力田孝亷亷吏務得其人韓延壽守左馮翊民有昆弟訟田延壽曰三老孝弟受其恥薛宣頻陽令薛恭本縣孝者功次稍遷嚴詡本以孝行為官拜為美俗使者明帝中元二年四月丙辰賜三老孝悌力田爵人三級注三者皆鄉官之名三老髙帝置孝悌力田髙后置章帝元和二年二月乙丑詔曰三老尊年也孝弟淑行也力田勤勞也國家甚休之其賜帛人一匹勉率農功韓信家貧無行不得推擇為吏陳湯匄貣無節不為州里所稱舉茂才待遷司𨽻奏湯無循行虞詡年十二縣舉順孫國相竒之趙咨延熹元年舉至孝有道遷博士江革元和中天子思革至行制詔齊相曰夫孝百行之冠衆善之始也縣以見穀千斛賜巨孝任子及博士弟子猶有課試之法力田孝亷止從察舉猶有周人鄉遂之意漢舉孝亷四科紀文帝十二年賜孝悌廉吏帛馮唐以孝著為郎中武帝元光元年十一月初令郡國舉孝廉各一人董仲舒對䇿請令諸侯郡守二千石各擇吏民之賢者嵗貢各二人以給宿衛故州郡舉茂才孝廉皆自仲舒發之猶有鄉舉里選諸侯貢士之遺法未廉為已仕孝為仕者元朔元年冬十一月詔曰朕旅耆老復孝敬選豪俊講文學稽參政事祈進民心深詔執事興亷舉孝庶幾成風紹休聖緒夫十室之邑必有忠信三人並行厥有我師今或闔郡而不薦一人是化不下究而積行君子雍於上聞也其與中二千石禮官博士議不舉者罪有司奏議曰不舉孝不奉詔當以不敬論不察廉不勝任也當免奏可孝與廉待之有輕重故法有輕重後漢陳忠曰孝廉之貢發於孝武宣帝地節三年十一月詔令郡國舉孝弟有行義聞於鄉里者各一人𫝊張敞奏明飭長吏舉孝廉廉吏務得其人孟喜王吉京房蓋寛饒王駿師丹杜鄴鮑宣馮譚逡並以孝廉為郎龔勝為郡吏三舉孝廉路温舒劉輔舉孝廉為丞令劉茂察孝廉再遷五原屬國侯後紀章帝建初元年三月詔曰鄉舉里選必累功勞今刺史守相不明真偽茂才孝亷嵗以百數既非能顯而當授之政事甚無謂也前世舉人貢士或起甽畝不繫閥閲其令太傅三公二千石舉賢良方正直言極諌之士各一人夏五月辛酉初舉孝亷郎中寛博有謀任典城者以補長相和帝永元七年四月詔曰舊典因孝亷之舉以求其人云云悉以所選郎出補長相十三年十一月丙辰詔幽幷涼州户口率少邉役衆劇良吏進仕路狹撫接夷狄以人為本其令縁邉郡口十萬以上嵗舉孝亷一人不滿十萬二嵗一人五萬以下三嵗一人從丁鴻劉芳之請也終孝亷之始得也人務本行其失也計口繆舉安帝永初二年九月庚子詔王主官屬墨綬下至郎謁者其經明任博士居鄉里有亷清孝順之稱才任理人者國相嵗移名與計偕上尚書公府通調令得外補元初六年二月地震壬子詔選孝亷郎寛博有謀清白行髙者五十人補令長丞尉順帝即位十二月甲申令郡國守相視事未滿嵗者一切得舉孝亷吏注漢法視事滿嵗乃得舉陽嘉元年十一月辛夘初令郡國舉孝廉限年四十以上諸生通章句文吏能牋奏乃得進選其有茂才異行若顔淵子竒不拘年齒閏月丁亥令諸以詔除為郎年四十以上課試如孝亷科者得參亷選嵗舉一人桓帝本初元年七月丙戌詔曰孝亷亷素皆當典城宰民禁姦舉善興化之本其令秩滿百石十嵗以上有殊才異行迺得參選杜絶邪偽請託之原令亷白守道者得信其操百官志凡郡國嵗盡遣吏上計并舉孝亷郡口二十萬舉一人列傳丁鴻時大郡口五六十萬舉孝亷二人小郡二十萬并有蠻夷者亦舉二人帝以為不均下公卿㑹議鴻與司空劉防上言自今郡國率二十萬口嵗舉孝廉一人四十萬二人至百二十萬六人不滿二十萬二嵗一人不滿十萬三嵗一人從之樊儵永平元年上言郡國舉孝亷率取年少能報恩耆宿大賢多見廢棄宜勅郡國簡用良俊顯宗從之左雄陽嘉元年太學新成雄上言郡國孝亷古之貢士出則宰民宣協風教孔子曰四十而不惑禮稱强仕請自今孝亷年不滿四十不得察舉皆先詣公府諸生試家法文吏課牋奏副之端門練其虚實以觀異能若有茂才異行自可不拘年齒帝從之胡廣駁曰可宣下百官參其同異帝卒用雄奏於是頒下郡國明年有廣陵孝廉徐淑年未及舉臺郎疑而詰之對曰詔書有如顔回子竒不拘年齒雄詰之曰顔回聞一知十孝亷聞一知幾淑無以對乃遣還郡於是濟隂大守胡廣等十餘人皆坐繆舉免黜唯汝南陳蕃潁川李膺下邳陳球等三十餘人得拜郎中自是牧守畏慄莫敢輕舉迄于永嘉察選清平多得其人張衡為太史令陽嘉二年六月對䇿自初舉孝亷迄今二百嵗皆先孝行行有餘力始學文法辛夘詔書一以能誦章句結奏案為限雖有至孝不當其科所謂捐本而求末者也黄瓊為尚書令以雄前所上孝亷之選專用儒學文吏於取士之義猶有所遺乃増孝廉及能從政者為四科通鑑漢安二年亷作悌又雄前議舉吏先試之於公府又覆之於端門後尚書張盛奏除此科瓊復上言覆試之作將以覆實虚濫不宜改革帝乃止論曰漢初詔舉賢良方正州郡察孝亷秀才斯亦貢士之方也百官志注决録注云故事尚書郎以令史久缺補之世祖始改用孝亷為郎以丁邯補焉邯稱病不就詔問實病羞為郎乎對曰臣實不病耻以孝亷為令史耳世祖怒杖之數十詔問欲為郎否對曰能殺臣者陛下不能為郎者臣詔遣出竟不為郎中興以後復増敦朴有道賢能直言獨行髙節質直清白敦厚之屬榮路既廣觖望難裁自是竊名偽服浸以流競權門貴仕請謁繁興自左雄任事限年試才雖頗有不察固亦因識時宜而黄瓊胡廣張衡崔瑗之徒泥滯舊方互相詭駁循名者屈其短筭實者挺其効故雄在尚書天下不敢妄選十餘年間稱為得人胡廣順帝時尚書令左雄議改察舉之制廣與尚書郭䖍史敞上書駁之不從周防韋彪包咸陳龜唐檀杜根髙彪郡舉孝廉試經第一舉為郎中江革鍾興楊仁張元崔琦徐防桓彬桓典舉為郎周嘉雷義舉為尚書侍郎謝夷吾第五訪劉寵劉梁劉陶舉為令長劉平鍾離意第五倫董鈞宋意鄭𢎞袁安曹褒魏霸張敏程曽周磐誦詩至汝墳之卒章乃觧韋帶就孝亷舉張霸周章許荆龐參葛龔左雄王龔李郃陳禪陳蕃杜喬李膺朱穆陳球劉祐宗慈檀敷羊陟賈彪延篤吳祐范滂尹勲劉矩孟嘗王脩荀彧陳重應劭許慎服䖍傅燮臧洪皆舉孝廉法雄察胡廣孝廉到京師試以章奏安帝以為天下第一江革永平中舉孝廉為郎元和中天子思革至行制詔齊相曰夫孝百行之冠衆善之始也國家每推志士未嘗不及革种暠始為縣門下史河南尹田歆謂王諶曰今當舉六孝廉多得貴戚書命不宜相違欲自用一名士以報國家諶見暠異之白歆曰得孝廉矣近洛陽門下史也舉孝廉不就者劉昆趙孝淳于恭張衡周燮蔡順戴良張綱黄憲种岱孔季彦周勰頴容王烈王暢楊彪桓􅁮趙咨向栩而四察孝廉皆不應者徐穉也禮宰夫注若今舉孝廉賢良方正茂才異等䟽孝廉謂孝弟廉絜賢良即良者謂有賢行而良善也方正方幅正直者茂才漢光武諱秀時號為茂才即能者也云異等者四科不同等級各異故云異等鄉大夫注變舉言興者謂合衆而尊寵之疏文王世子云或以事舉或以言􅀭故今貢人皆稱舉魏志黄初二年正月乙亥初令郡國口滿十萬者嵗察孝廉一人其有秀異無拘户口華歆傳三府議舉孝廉本以徳行不復限以試經歆以為恐學業從此而廢通典魏黄初三年正月庚午始除漢限年之制令郡國所選勿拘老幼儒通經術吏逹文法到皆試用晉袁宏曰古者四十而仕非謂仕必是年也舉其大限耳顔淵子竒曠代一有而欲以斯為格不亦偏乎漢察廉紀文帝十二年詔廉吏民之表也朕甚嘉此二三大夫之行今萬家之縣云無應令詔賜三老孝悌廉吏帛有差景帝後元二年五月詔其唯廉士寡欲易足今訾筭十㠯上廼得官廉士筭不必衆云云訾筭四得官亡令廉士久失職宣帝黄龍元年夏四月詔曰舉廉吏欲得其真也六百石位大夫毋得舉平帝元始元年正月令宗室其為吏舉廉佐史補四百石傳趙廣漢為平準令察廉為陽翟令朱博以太常掾察廉補安陵丞薛宣以大司農斗食屬察廉補不其丞光禄勲于永除王嘉為掾察廉為南陵丞復察廉為長陵尉馮逡太常察孝廉為郎平當以大鴻臚文學察廉為順陽長此九卿察廉也御史大夫魏相除蕭望之為屬察廉為治禮丞班彪察司徒廉為望都長此三公察廉也黄霸察補河東均輸長復察廉為河南太守丞王尊以幽州刺史從事察廉補鹽官長尹賞以郡吏察廉為樓煩長瑯邪守趙貢察薛宣廉遷都尉丞尹翁歸以督郵舉廉為緱氏尉𢎞農都尉張敞以太守卒史察廉為甘泉倉長嚴延年察獄史廉坐選舉不實貶秩此郡國察廉也池陽令舉廉吏獄掾王立此縣道察廉也韓安國所推舉皆廉士賢於已者於梁舉壺遂臧固張敞奏宜明飭長吏舉孝廉廉吏務得其人天子召上計吏使侍中臨飭光武詔三公中二千石嵗察廉吏一人凡郡國守相視事未滿嵗不得察㢘以未久不周知也漢舉茂才建武詔書紀武帝元封五年名臣文武欲盡詔曰跅弛之士在御之而已令州郡察吏民有茂才異等可為將相及使絶國者注應劭曰舊言秀才避光武諱傅子曰元封五年舉秀才宣帝元康四年正月遣太中大夫彊等十二人循行天下存問寡衆覽觀風俗察吏治得失舉茂才異倫之士元帝初元二年三月詔舉茂才異等直言極諌之士陳湯元光元年三月壬戌朔詔郡國舉茂才異等賢良直言之士各一人薛宣建昭四年夏四月詔舉茂才特立之士漢官目錄建武十二年八月乙未詔書三公舉茂才各一人廉吏各二人光禄嵗舉茂才四行各一人察廉吏三人中二千石嵗察廉吏各一人廷尉大司農各二人將兵將軍嵗察廉吏各二人監察御史司𨽻州牧嵗舉茂才各一人列傳董仲舒對䇿推明孔氏立學校之官州郡舉茂才孝廉皆自仲舒發之陳湯得大官獻食丞元帝詔列侯舉茂才張勃舉湯湯有罪勃坐削户二百薛宣幽州刺史舉茂才馮逡光祿勲舉茂才龔勝州舉茂才為重泉令趙廣漢舉茂才賈捐之薦楊興曰明詔舉茂才列侯以為首蕭咸為丞相史尹賞為樓煩長舉茂才師丹建始中州舉茂才復補博士後傳牟融以司徒茂才為豐令班彪舉司𨽻茂才拜徐令王渙舉茂才除温令孟嘗䇿孝廉舉茂才拜徐令玉堂舉光祿茂才楊震周舉崔瑗應奉皇甫嵩葛龔陳重皆舉茂才种岱桓曄趙典楊彪舉茂才不就徐穉三舉茂才不就張儉舉茂才以刺史非人不起黄琬𫝊稍遷五官中郎將時陳蕃為光祿勲數議事舊制光禄舉三署郎以髙功久次才徳尤異者為茂才四行然權富子弟多得舉而貧約守志者見遺京師謡曰欲得不能光禄茂才於是琬蕃同心顯用志士平原劉醇河東朱山蜀郡殷參等並以才行蒙舉周禮鄉大夫興賢者能者注鄭司農云興賢者若今之舉孝亷興能者若今舉茂才漢察舉丈翁傳通春秋以郡縣吏察舉為蜀守蜀生皆成就以為右職用次察舉官有至郡守刺史者漢計偕貢舉簿紀武帝元光五年八月徵吏民有明當世之務習先聖之術者縣次給食令與計偕注師古曰計者上計簿使也令所徵之人與上計者俱來後世誤謂上計為計偕闞駰妄解云秦漢謂諸侯朝使曰計偕偕次也晉代有計偕簿又改偕為階失之逺又見功令後紀明帝永平九年四月甲辰令司𨽻部刺史嵗上墨綬長吏視事三嵗以上治狀尤異者各一人與計偕上注與計吏俱上和帝永元十四年初復郡國上計補郎官注武帝令郡國舉孝廉各一人與計偕拜為郎中中廢今復之安帝永初二年九月庚子詔王官屬墨綬下至郎謁者其經明任博士居鄉里有廉清孝順之稱才任理人者國相嵗移名與計偕上尚書公府通調令得外補禮記射義諸侯嵗獻貢士於天子注嵗獻獻國事之書及計偕物也三嵗而貢士舊説云大國三人次國二人小國一人䟽漢時謂郡國送文書之使為計吏其貢獻之物與計吏俱來故謂之計偕物漢舊儀御史大夫敕上計丞長史曰郡國有茂才不顯者言續志郡國嵗盡遣吏上計并舉孝廉郡口二十萬舉一人上計今計吏也前書音義曰舊制使郡丞奉嵗計郡國志注案今計偕簿朱買臣随上計吏上書文翁買蜀刀布齎計吏遺博士黄霸召上計吏使侍中臨飭范式長沙上計掾到京師上書表式行狀三府並辟劉翊皇甫規舉上計掾王逸元初中舉上計吏為校書郎度尚為郡上計吏拜郎中許靖舉計吏龐參為太尉時當㑹茂才孝廉參以被奏稱疾不得㑹上計掾廣漢段恭因會上䟽楊秉桓帝時郡國計吏多留拜為郎秉上言三舍見郎七百餘人自此計吏無復留拜者趙壹光和元年舉郡上計光和三年帝問刺史計吏以征討方畧漢中上計程包對云韋誕建安中為郡上計吏拜郎中吳志注志林曰案㑹稽貢舉簿建安十二年至十三年闕無舉者漢博士弟子貟功令太常品式武紀元朔五年夏六月詔太常其議予博士弟子崇鄉黨之化㠯厲賢材焉丞相𢎞請為博士置弟子貟學者益廣儒林傳公孫𢎞為學官悼道之鬰滯廼請白丞相御史言制曰盖聞導民以禮風之以樂婚姻者居室之大倫也今禮廢樂亡朕甚愍焉故詳延天下方聞之士咸登諸朝立學校之官自仲舒發之其令禮官勸學講議洽聞舉遺興禮以為天下先太常議興博士弟子崇郷里之化以厲賢材焉師古曰自此以上𢎞所引詔文謹與太常臧博士平等議曰聞三代之道鄉里有教夏曰校殷曰序周曰庠其勸善也顯之朝廷其懲惡也加之刑罰故教化之行也建首善自京師始繇内及外今陛下昭至徳開大明配天地本人倫勸學興禮崇化厲賢以風四方太平之原也古者政教未洽不備其禮請因舊官而興焉為博士官置弟子五十人復其身太常擇民年十八以上儀狀端正者補博士弟子皆太常所補也不詔書既曰崇鄉黨之化則太常所補過取諸闗中而已郡國縣官有好文學敬長上肅政教順鄉里出入不悖所聞令相長丞上屬所二千石謹察可者常與計偕詣太常得受業如弟子此郡國所擇也一嵗皆輙試一作課能通一藝以上補文學掌故缺其髙第可以為郎中者太常籍奏即有秀才異等輙以名聞其不事學若下材及不能通一藝輙罷之而請諸能稱者臣謹案詔書律令下者明天人之際通古今之誼文章爾雅訓辭深厚恩施甚美小吏淺聞弗能究宣亡以明布諭下以治禮掌故以文學禮義為官遷留滯請選擇其秩比二百石以上及吏百石通一藝以上補左右内史大行卒史注師古曰左右内史後為左馮翊右扶風大行令後為大鴻臚比百石以下補郡太守卒史皆各二人邉郡一人先用誦多者不足擇掌故以補中二千石屬文學掌故補郡屬備員請著功令師古曰新立此條請以著於功令功令篇名若今選舉令他如律令制可自此以來公卿大夫士吏彬彬多文學之士矣昭帝時舉賢良文學増博士弟子員滿百人宣帝末増倍之元帝好儒能通一經者皆復數年間以用度不足更為設員千人郡國置五經百石卒史初元五年罷博士弟子毋置員以廣學者永光三年冬復博士弟子員成帝末或言孔子布衣養徒三千人今天子太學弟子少於是増弟子員三千人嵗餘復如故賛曰自武帝立五經博士開弟子員設科射䇿勸以官祿訖於元始百有餘年傳業浸盛一經説至百餘萬言大師衆至千餘人王式傳唐生禇生應博士弟子選詣博士摳衣登堂頌禮甚嚴試誦説有法諸博士問何師對曰事式共薦式為博士列傳文翁選郡縣小吏十餘人遣詣京師受業博士循吏終軍選為博士弟子至府受遣兒寛㠯郡國選詣博士受業孔安國張湯請博士弟子治尚書春秋補廷尉史蕭望之㠯令詣太常受業即功令杜業為太常選舉不實免何武詣博士受業鮑宣下廷尉獄博士弟子王咸舉幡大學下曰救鮑司𨽻者㑹此下息夫躬為博士弟子受春秋表山陽侯張當居元朔五年坐為太常擇博士弟子不以實免史記擇作程後傳伏湛成帝時以父任為博士弟子伏恭太常試經第一拜博士史記太史公曰余讀功令至於廣厲學官之路未嘗不廢書而嘆也大事記前此博士雖以經授徒而無考察試用之法至是官為置弟子員所謂興太學也通典後漢本初元年詔大將軍以下至六百石悉遣子弟就學建和初詔諸學生課試補官永壽二年課試補郎舍人建安中侍中鮑衡奏公卿至六百石子弟為郎舍人皆聼詣博士受業其髙才秀達學通一藝太常為作品式從之漢博士選三科孔光傳成帝時博士選三科髙為尚書次為刺史其不通政事以久次補諸侯大傅光以髙第為尚書觀故事品式數嵗明習漢制及法令上信任之成紀陽朔二年九月詔儒林之官四海淵源宜皆明於古今温故知新通逹國體故謂之博士丞相御史其與中二千石二千石雜舉可充博士位者後官志太常每選試博士奏其能否後傳蔡茂哀平間召試博士對策陳灾異以髙第擢拜議郎翟酺安帝時尚書有缺詔將大夫六百石以上試對政事天文道術以髙第補之酺對第一王暢時政事多歸尚書特詔三公令高選庸能漢舊儀漢刺史察六條舉民有茂材移名丞相丞相考召取三科明經一科明律令一科能治劇一科各一人魏明帝太和二年六月詔髙選博士才任侍中常侍者漢光祿四行紀元帝永平元年二月詔丞相御史舉質樸敦厚遜讓有行者光祿嵗以此科第郎從官嵗舉二人注師古曰始令丞相御史舉此四科人擢用之而見在郎及從官又令光祿每嵗依此例考校定其第髙下用知其人賢否何武為郎光禄勲舉四行遷鄠令師古注永光元年匡衡為光禄勲舉王駿有專對才孔光方正成帝河平四年三月舉淳厚有行能直言之士鴻嘉二年三月詔舉敦厚有行義能直言者冀聞嘉謀匡朕之不逮王嘉鴻嘉中舉敦朴能直言召見宣室永始三年正月日食詔遣太中大夫嘉等循行天下與部刺史舉淳樸遜讓有行義者各一人譙𤣥舉淳樸行義對䇿髙第拜議郎哀帝建平元年二月詔舉孝悌敦厚平帝元始元年五月丁未朔日食舉敦厚能直言者各一人大鴻臚左咸舉譙𤣥詣公車對䇿後紀光武建武十二年八月乙未詔光禄嵗舉郎茂才四行各一人漢官目録見百官志注通典安帝元初六年二月壬子詔光禄勲與中郎將選孝亷郎寛博有謀清白行髙者五十人後傳吳祐以光祿四行遷膠東侯相注漢官儀曰敦厚質樸遜讓節儉也范滂舉孝亷光祿四行李固陽嘉二年公卿舉固對䇿續漢書曰詔公卿舉敦樸之士衛尉賈建舉固六月丁丑李固馬融張衡對䇿以固為第一舊任三府選令史光禄試尚書郎時皆特拜不復選試固言選舉可歸有司復與光禄勲劉宣上言選舉牧守多非其人馬融舉敦樸召詣公車對䇿於北宫端門拜議郎張儉舉敦樸公車特徵拜少府杜林建武十一年為光禄勲選舉稱平魯恭遷光禄勲選舉稱平陳忠為尚書舉光禄郎周興孝友之行清厲之志陳蕃延熹六年為光禄勲與五官中郎將黄琬共典選舉不偏權富黄琬舊制光禄舉三舍郎以髙第久次才徳尤異者為茂才四行琬與蕃同心顯用志士志光禄勲卿一人典謁署郎更直執㦸宿衛門户考其徳行而進退之爰盎為中郎將徙張釋之謁者則郎之進退將調之也爰盎調隴西都尉則將之進退光禄勲調之也周宫正以時比宫中之官府稽其功緒糾其徳行宫伯掌王宫之士庶子行其秩序漢辟士四科建武詔書和紀注漢官儀曰建初八年十二月己未詔書辟士四科一曰徳行髙妙志節清白二曰學通一作經明行修經中一作能任博士三曰明逹文法一作曉法律足以决疑能案章覆問文中一作任御史四曰剛毅多畧遭事不惑明足以照奸勇足以决斷才任三輔令皆存孝悌清公之行文選注云三輔劇縣令自今以後審四科辟召務盡實校試以職考選有非人不習曹事正舉者故不以實法百官志太尉長史署諸曹事掾史屬二十四人注漢官儀曰世祖詔方今選舉賢佞朱紫錯用丞相故事四科取士同和紀注漢官目録曰建武十二年八月乙未詔書三公舉茂材各一人廉吏各二人光禄嵗舉茂材四行各一人察廉吏三人中二千石嵗察吏各一人廷尉大司農各二人將兵將軍嵗察亷吏各二人監察御史司𨽻州牧嵗舉茂才各一人漢舊儀故事丞相設四科之辟以博選異徳為上稱量不宜者還故官第一補西曹南閤祭酒二科補議曹三科補四辭八奏四科補賊决胡廣曰漢武丞相設四科之辟徳行髙妙為第一補南閤祭酒文選永明䇿秀才文注崔寔政論云詔書故事三公辟召以四科取士一曰徳行志節二曰經學通行修三曰明曉法令四曰剛毅多畧才任三輔劇縣令通典元光元年舉賢良董仲舒請令諸侯列卿郡守二千石嵗貢各二人以給宿衛於是令郡國舉孝亷各一人又制郡國口二十萬以上嵗察一人四十萬以上二人六十萬三人八十萬四人百萬五人百二十萬六人不滿二十萬二嵗一人不滿十萬三嵗一人限以四科一曰徳行云云同漢官儀章帝建初元年紀二月己巳是年正月詔二千石謹選舉鄉舉里選必累功勞今刺史守相不明真偽茂才孝亷嵗以百數既非能顯而當授之政事甚無謂也始復用前漢丞相故事以四科辟士凡所舉事先試之以職乃得充選注元光初武帝因董仲舒之言立制故事在丞相府今復用之第一科補西曹南閤祭酒云云同漢舊儀為案四科取士通典以元光和紀注作建初官志注作世祖未知孰是後黄瓊以孝亷用儒學文吏猶有遺乃奏増孝悌及能從政者為四科非前四科比紀章帝建初五年五月辛亥詔曰朕思遟直士側席異聞其先至者欲置左右建武詔書又曰堯試臣以職不直以言語筆札今外官多曠並可補任和帝永元五年三月戊子詔曰選舉良才為政之本科别行能必由鄉曲郡國舉吏先帝明敕在所令試之以職乃得充選宣布以來出入九年二千石曽不奉命注引漢官儀見上志漢官曰太常貟吏八十五人其十二人四科光禄勲貟吏四十四人其十人四科衛尉貟吏四十一人其九人四科太僕貟吏七十人其七人四科廷尉貟吏百四十人其十一人四科大鴻臚貟吏五十五人其六人四科治禮郎四十七人其四人四科宗正貟吏四十一人其六人四科大司農貟吏百六十四人其十八人四科少府員吏三十四人其一人四科執金吾員吏二十九人其十人四科漢官儀博士舉狀曰行應四科經任博士書其板舉主保之御史大夫貢禹除諸葛豐為屬張忠辟孫寳魏相除蕭望之為屬大司馬王商辟鮑宣薦為議郎大司空何武除宣西曹掾此以徳行志節舉者也御史大夫蕭望之除薛廣徳為屬大司馬史髙辟匡衡為議曹史丞相方進除李尋為史大司馬根奏房鳯補長史王商位特進得舉吏除杜鄴主簿此以經學舉者也張湯為甯成掾以無害言大府丞相武安侯召湯為史薦補侍御史廷尉湯召兒寛為掾廷尉光請路温舒署奏曹掾嚴延年除御史掾鄭賓以明律令為御史薛宣以明習文法補御史中丞此以文法舉者也大將軍鳯薦薛宣為長安令請王尊補軍中司馬大司空武舉何並能治劇為長陵令左馮翊宣舉尹賞能治劇為頻陽令大司徒馬宫舉陳遵能治三輔劇縣拜郁夷令原渉為大司徒史舉能治三輔為谷口令此以才畧舉者也四科以徳行志節辟者若司徒侯霸辟閔仲叔鍾離意楊震辟杜喬胡廣辟李膺杜宻大司馬吳漢辟王良周澤辟大司馬府為議曹祭酒太尉楊賜辟趙咨宋田辟何敞驃騎將軍蒼開東閤延賢俊辟荀恁朱暉等大將軍隲辟楊震太尉府辟趙孝范冉司徒府辟陳重其三府更辟不應者楊倫三公辟不就者髙獲五府連辟不應者黄瓊張楷李固劉淑荀爽徐穉五辟宰府不應宗慈鐘皓九辟公府不就而陳寔紀諶公府同辟羔鴈成羣以經行辟者如周榮董鈞桓榮皆辟於司徒牟長陳元尹敏鄭衆皆辟於司空周防任安皆辟於太尉東平王蒼辟吳良為西曹薦其學通師法經任博士行中表儀以為議郎太傅趙熹辟魯恭以文法辟者衛颯舉能案劇為侍御史郭躬以明法律辟公府司徒鮑昱辟陳寵為辭曹司徒桓虞辟李恂拜侍御史劉愷舉陳忠明習法律宜備機宻司𨽻鮑永辟鮑恢都官從事張綱王允桓典楊球辟司徒府髙第种暠羊陟辟太尉府髙第朱穆辟大將軍髙第並為御史以才畧辟者李善以能治劇守日南袁安以能治劇守楚郡韋義舉治劇為廣都長法雄舉治劇為平氏長王堂以治劇為巴郡守陳寔以理劇為聞喜長賈琮以能吏為交阯刺史皆公府辟舉劇令伏恭細陽令陳重及魯恭繆彤皆舉尤異刺史所辟若王充陳禪州辟治中從事周景辟陳蕃别駕從事豫州刺史王允辟荀爽孔融為從事太守所辟若韓崇召蔡順為東閤祭酒劉授召黄香為門下孝子梁湛召繆彤為決曹掾縣令所辟若外黄令以爰延為廷掾范丹為功曹考城令以仇覽為主簿張酺曰三府辟史多非其人司𨽻校尉晏祖奏令三府各案其掾漢舉獨行有道至孝武紀元狩六年六月詔舉獨行之君子徵詣行在所朕甚喜賢者樂知其人士有特招使者之任也遣博士大下夫循行天後逸民傳光武側席幽人求之若不及旌帛蒲車之所招賁相望於岩中薛方逢萌聘而不肯至嚴光周黨王霸至而不能屈所謂舉逸民而天下歸心肅宗亦禮鄭均召髙鳳以成其節方術傳郭憲光武求有道之人徵拜博士李南舉有道不行紀兼列𫝊安帝建光元年三月尚書陳忠薦隐逸及直道之士周爕杜根等四月令公卿下至郡國守相各舉有道之士一人詔拜有道髙第士施延為侍中桓帝元嘉元年十一月辛巳地震詔公卿郡國舉至孝獨行之士涿郡舉崔寔詣公車不對䇿延熹元年大司農舉趙咨至孝有道遷博士九年正月辛亥朔日食詔公卿校尉郡國舉至孝太常趙典舉荀爽至孝對䇿靈帝建寧元年五月丁未朔日食詔公卿及郡國守相舉有道之士各一人二年舉謝弼對䇿除郎中樊英楊厚郎顗荀爽宗慈郭泰申屠蟠趙曄舉有道不就侯瑾張芝公車有道徵不到徐穉四舉有道不就周磐以有道特徵唐髙適舉有道科李白州舉有道不應漢舉將帥勇猛紀成帝元延元年七月詔北邉二十二郡舉勇猛知兵法者各一人哀帝建平四年八月詔將軍中二千石舉明兵法有大慮者平帝元始二年秋舉勇武有節明兵法郡一人詣公車史記任安田仁為衛將軍舍人有詔募擇將軍舍人以為郎少府趙禹悉召舍人百餘人以次問之曰獨此兩人可耳詔召見問能畧使安護北軍仁護田糓於河上列傳路温舒遷右扶風丞詔書令公卿選可使匈奴者温舒上書願給厮養下問狀罷歸趙充國本始中舉可先行羌者辛武賢段㑹宗竟寧中五府舉為西域都䕶馮奉世宣帝時選可使外國者前將軍増舉奉世帝召見韓増曰賀將軍所舉得其人後紀安帝永初五年七月己巳詔三公特進九卿校尉舉列將子孫明曉戰陳任將帥者建光元年十一月癸夘詔三公特進侯卿校尉舉武猛堪將帥者各五人順帝永和三年九月丙戌令大將軍三公各舉故刺史二千石及見令長郎謁者四府掾屬剛毅武猛有謀謨任將帥者各二人特進卿校尉各一人司隷左雄舉馮直大長秋良賀無所薦漢安元年十一月癸夘詔大將軍三公選武猛試用有効驗任為將校者各一人靈帝中平元年三月壬子舉明戰陣之畧者詣公車傳滕撫建康二年朝廷博求將帥三公舉撫有文武才拜為九江都尉應奉四府舉才堪將帥永興元年拜武陵守皇甫規延熹四年冬三公舉為中郎將規薦張奐才畧宜正元帥崔寔詔三公舉威武謀畧之士司空黄瓊薦寔拜遼東守宣帝本始元年四月庚午詔内郡國舉文學髙第各一人注韋昭曰中國為内郡縁邊有夷狄障塞者為外郡成帝時内郡舉方正北邊二十二郡舉勇猛士光武建武三年詔書求天下義士孫福言劉茂召拜議郎晉武泰始五年十二月詔州郡舉勇猛秀異之才七年六月詔公卿以下舉將帥各一人馬隆傳泰始中將興伐吳之役下詔曰吳㑹未平宜得猛士以濟武功雖舊有薦舉之法未足以盡殊才其普告州郡有壯勇秀異才力傑出者皆以名聞將簡其尤異擢用之兖州舉隆才堪良將稍遷司馬督謝𤣥傳朝廷求文武良將可以鎮禦北方者安以𤣥應舉魏太和二年十月詔公卿近臣舉良將各一人漢舉宗室茂材昭紀始元二年春正月以宗室母在位者舉茂材劉辟彊劉長樂皆為光禄大夫辟彊守長樂衛尉𫝊云擇宗室可用者辟彊子徳待詔丞相府漢郡國選行義紀昭帝元鳯三年三月賜郡國所選有行義者涿郡韓福等五人帛人五十匹遣歸詔曰朕閔勞以官職之事其務修孝悌以教鄉里令郡縣常以正月賜羊酒宣帝地節三年十一月詔令都國舉孝弟有行義聞於鄉里者各一人漢郡國貢舉貢舉制韋彪傳章帝時通鑑元和元年六月陳事者多言郡國貢舉率非功次詔下公卿朝臣議彪為大鴻臚上議曰國以簡賢為務賢以孝行為首其要在選二千石二千石賢則貢舉得人胡廣𫝊上書曰漢承周秦兼覽殷夏參雜霸軌貢舉之制莫或回革蔡邕傳曰孝武世郡舉孝廉又有賢良文學之選名臣輩出文武並興漢之得人數路而已前鮑宣𫝊曰龔勝為司直郡國皆謹選舉唐書薛登曰漢世求士必觀其行士自脩為鄉里推舉然後府署交辟北史劉景安曰兩漢由州郡薦才漢明經紀章帝元和二年五月戊申令郡國上明經者口十萬以上五人不滿十萬三人順帝陽嘉元年七月丙辰試明經下第者補太學弟子質帝本初元年四月庚辰令郡國舉明經通典桓帝建和初詔諸學生年十六以上比郡國明經試次第上名髙第十五人上第十六人為中郎中第十七人為太子舍人下第十七人為王家郎永壽二年甲午詔復課試諸生補郎舍人其後復制學生滿二嵗試通二經者補文學掌故其不能通二經者須後試復随軰試試通二經者亦得為文學掌故已為文學掌故者滿二嵗試通三經者為太子舍人其不得第復試髙者亦得為太子舍人舍人滿二嵗試通四經者為郎中不得第者復試髙者亦得為郎中郎中試通五經者補吏随才而用其不得者復試第復高亦得補吏前傳孔安國平當貢禹夏侯勝張禹並以明經為博士眭𢎞翟方進舉明經遷議郎葢寛饒諸葛豐以明經為郡文學王嘉以明經射䇿甲科為郎召信臣以明經甲科為郎龔遂以明經為官後傳袁良舉明經為太子舍人平帝時戴憑郡舉明經召試博士李業舉明經為郎魏應舉明經除濟隂王文學張𤣥舉明經補𢎞農文學周榮董鈞舉明經劉寵以明經舉孝廉獻帝紀初平四年九月甲午試儒生四十餘人上第賜位郎中次太子舍人下第罷之詔曰結童入學白首空歸朕甚閔焉其依科罷者聼為太子舍人注長安中謡曰裹衣褰裳當還故鄉聖主愍念悉用補郎漢舉隐士見舉獨行後李充傳延平中詔公卿中二千石舉隐士大儒特召充為博士易賁卦䟽漢聘隐士或乃用羔鴈𤣥纁蒲輪駟馬豈止束帛之間玉海卷一百十四
