body:
  text: 玉海卷八十七宋王應麟撰噐用圭璧玉噐附良玉比德君子圭璋見美詩人黄帝玉策堯玉版禹玉牒後漢張衡傳注山海經曰西北曰密山黄帝取密山之玉策穆天子傳注作玉榮投之鍾山陰蔡邕傳鍾山之玉注同𤣥選注引此云宻山是生玉華按山海經黄帝取峚山之玉榮注謂玉也汲冢書所謂昭華之玉峚即密字拾遺記堯聖徳光洽河洛之濱得玉版方尺圖天地之形又獲金璧之瑞文字炳列記造化之始後漢郡國志注湘中記曰衡山有玉牒禹案其文以治水遙望衡山如陣雲盛𢎞之荆州記禹登南岳而祭之獲金簡玉字之書祝融司方發其英沐日浴月百寶生堯禺氏玉舜昭華玉管子揆度篇對桓公曰堯舜之王所以化海内者北用禺氏之玉禺氏西北戎名玉之所自出周書王㑹篇禺氏騊駼南貴江漢之珠令諸侯之子將委質者皆以雙虎之皮為裘卿大夫豹飾列大夫豹幨外紀髙陽薦玉以赤繒髙辛以黒繒堯以白繒尚書大傳堯得舜推而尊之贈以昭華之玉淮南子泰族訓同文選石闕銘受昭華之玉納龍叙之圗注引大傳云云王元長曲水序昭華之珍既徙注同上堯璧尚書中候堯沉璧於河白雲起帝王世紀堯刻璧為書東次於洛言當傳舜之意淮南子禹不貴尺璧而重寸隂堯五瑞子華子堯居於衢室之中輯五瑞以見羣后帶幅舄而入覲者如衆星之拱北舜五瑞五玉五器書舜典輯五瑞注公侯伯子男之瑞圭璧既月乃日覲四岳羣牧班瑞於羣后還五瑞於諸侯肆覲東后修五禮五玉五等諸侯執其玉如五器器謂圭璧文疏諸侯執之以為王者瑞信故稱瑞五玉即上五瑞鄭𤣥云執之曰瑞陳列曰玉器即五玉是也器典瑞注人執以見曰瑞禮神曰疏人執亦名器史記正義孔文詳云宋末㑹稽修禹廟於土中得五等圭璧百餘枚形與周禮同皆短小此禹㑹諸侯以禮山神虞三帛舜典三帛注謂諸侯世子執纁公之孤執𤣥附庸之君執黄王肅注多同法公羊傳注束帛謂𤣥三纁二𤣥三法天纁二地周禮孤與世子皆執皮帛曲禮正義禮説含文嘉云天子三公諸侯皆以三帛以薦玉宋均注云其殷禮三帛謂朱白倉象三正其五帝之禮薦玉用一色之帛鄭注虞書三帛髙陽氏之後用赤繒髙辛氏之後用黒繒其餘用白繒其餘謂堯舜之諸侯禹延喜玉玉圭尚書琁璣鈐天錫禹𤣥圭刻曰延喜之玉注禹功乃成天錫𤣥圭文選延喜之玉攸歸注引同上遯甲開山圗禹遊東海得玉珪碧色長一尺二寸圓如日月以自照目達幽㝠文選注引之又張衡傳注書正義堯賜𤣥圭以彰顯之必以天色圭者言天功成也禹貢雍州貢球琳夏后氏璜左傳定四年祝佗曰成王分魯公以夏后氏之璜美玉名八年盜竊寶玉注夏后氏之璜哀十四年向魋出於衛地公文氏攻之求夏后氏之璜明堂位大璜封父龜淮南子夫有夏后氏之璜匣匱而藏之寶之至也精神之可寶非直夏后氏之璜也夏后之璜不能無考注半璧曰璜珍玉也魯語古者分同姓以珍玉展親也注玉謂若夏后氏之璜書中侯太公即磻溪之水釣其涯得玉璜刻曰姬受命吕佐旌山海經海外西經大樂之野夏后啓於此儛九代馬名乗兩龍雲蓋三層左手操翳右手操環佩玉璜在大運山北禹貢揚州貢瑤琨梁州貢璆雍州厥貢惟球琳琅玕淮南子禹禹不貴尺璧而惜寸陰湯球玉二玉商頌長發受小球大球注球玉箋湯既為天所命則受小玉謂尺二寸圭也受大玉謂珽長三尺執圭搢珽與諸侯㑹同疏受小球玉謂尺二寸之鎮圭也大球玉謂三尺之珽也受此二玉為下國諸侯之表章鄭言湯受二玉與諸侯㑹同諸侯心繫天子如旌旗之旒綴著於縿春官典瑞云王晉大圭執鎮圭以朝日覲禮云拜日東門之外注引朝事儀曰天子冕而執鎮圭率諸侯朝日退而見諸侯考工記玉人云天子所服所守惟此二玉而玉人云天子執冒四寸以朝諸侯者此謂國外㑹同彼謂在國受朝也下諸侯故執冒周禮疏與下國結定其心故執鎮圭不執冒書序湯伐三朡俘寳玉注玉以禮神故取而寳之誼伯仲伯作典寳言國之常寳玉藻笏天子以球玉注球美王也通歴殷湯有黄金黒玉之瑞禹貢球雍州所貢周天球在東序周六瑞春官大宗伯以玉作六瑞以等邦國王執鎮圭公執桓圭侯執信圭伯執躬圭子執穀璧男執蒲璧典瑞中士二人掌玉瑞之藏云云秋官小行人成六瑞王用鎮圭公用桓圭侯用信圭伯用躬圭子用穀璧男用蒲璧注瑞信也皆朝見所執以為信言成其等邦國之用也舜典言五瑞而大宗伯六瑞者兼王而言冬官玉人天子用全純玉上公用尨尨雜色侯用瓚伯用將皆雜名卑者下尊以輕重為差公侯四玉一石伯子男三玉二石繼子男執皮帛謂公之孤也贄用束帛而以豹皮表之為飾天子之孤表帛以虎皮周鎮圭瑱圭大宗伯王執鎮圭注鎮以安四方蓋以四鎮之山為瑑飾圭象仁鎮以鎮四方山體仁以養萬物執者守而不失徳顯於仁也典瑞王晉大圭執鎮圭繅藉五采五就以朝日注繅有五采文所以薦玉木為中幹用韋衣而畫之故書鎮作瑱五就五帀也小行人王用瑱圭瑱劉吐電反釋文宜作鎮音玉人鎮圭尺有二寸天子守之疏詩注小球尺二寸禮緯天子純玉尺二寸三禮圖凡圭廣三寸厚半寸剡上左右各半寸天子圭中必必以組約其中執之以備失墜疏必絢組周桓圭信圭躬圭命圭大宗伯公執桓圭注公二王後及王之上公雙植謂之桓桓宫室之象所以安其上也亦以桓為瑑飾疏桓謂若屋之桓楹植即稜也下二稜著圭不見惟有上二稜故云雙植桓圭言其德之植立不撓足以輔乎王侯執信圭伯執躬圭信當為身身圭躬圭皆象人形為瑑飾文有麤縟耳欲其謹行以保身屈信圭言其徳之伸而直躬圭言其躬而舊圖瑑為人形誤矣典瑞掌玉瑞玉器之藏辨其名物與其用事設其服飾人執以見曰瑞禮神曰器公執桓圭侯執信圭伯執躬圭繅皆三采三就以朝覲宗遇㑹同於王諸侯相見亦如之春秋傳曰邾子執玉髙其客仰大行人以九儀等諸臣之爵上公之禮執桓圭九寸繅藉九寸冕服九章諸侯之禮執信圭七寸繅藉七寸冕服七章諸伯執躬圭其他皆如諸侯之禮玉人之事命圭九寸謂之桓圭公守之命圭七寸謂之信圭侯守之命圭七寸故書或云五寸杜子春云當為七寸謂之躬圭伯守之注命圭王所命之圭也朝覲執焉居則守之疏䇿命諸侯之時非直加之以車服以圭授之為瑞信唐張仲素信圭賦將比徳以省躬云云比楚玉之無瑕哂夏璜之有考吴語命圭有命固曰呉伯左傳朝聘有珪周榖璧蒲璧大宗伯子執穀璧男執蒲璧注穀所以養人蒲為席以安人二玉蓋或以穀為飾或以蒲為瑑飾璧皆徑五寸不執圭者未成國也典瑞子執穀璧男執蒲璧繅皆二采朱緑再就以朝覲宗遇㑹同于王諸侯相見亦如之注鄭司農云以圭璧見于王覲禮曰侯氏入門右坐奠圭再拜稽首侯氏見于天子諸侯亦執圭璧以相見大行人諸子執穀璧五寸繅藉五寸冕服五章諸男執蒲璧其它皆如諸子之禮小行人成六瑞公用桓圭侯用信圭伯用躬圭子用穀璧男用蒲璧不言執而言用言其為上下之所通用尊卑有定用名分正而禮法嚴故謂之成子華子吾之宗君始有蒲璧以朝雜記圭子男五寸注子男執璧此失之覲禮乃朝以瑞玉有繅注瑞玉謂桓圭至蒲璧沈括云今人得蒲璧刻文如蒲花敷時穀璧如粟粒周大圭介圭玉人大圭長三尺杼上終葵首天子服之注王所搢大圭也或謂之珽終葵椎也為椎於杼上眀無所屈也杼閷也相玉書曰珽玉六寸明自炤疏以其長故稱大圭搢於衣帶之間同於衣服故以服言之齊人謂椎為終葵典瑞王晉大圭執鎮圭繅藉五采五就以朝日注繅有五采文所以薦玉木為中幹用韋衣而畫之就成也故書鎮作瑱鄭司農云晉讀為搢謂插於紳帶之間若帶劒也五就五帀也易氏曰圭以大名象道之體三尺為數象道之成抒上終葵首象道之用不瑑象天道之質朝日次於祀天故晉之三禮圖曰比它圭最長故謂之大圭詩崧髙錫爾介圭以作爾寶箋圭長尺二寸謂之介非諸侯之圭故以為寶諸侯之瑞圭自九寸而下韓奕以其介圭入覲于王箋覲於宣王奉享禮貢國所出之寶書曰黑水西河貢璆琳琅玕疏毛氏於崧髙以介圭為所執之瑞魯語大采朝日少采夕月注周禮王搢大圭執鎮圭藻五采五就少采三采也左傳衮冕黻珽疏珽一名大圭荀子天子御珽諸侯御荼大夫服笏禮也注荼古舒字玉之上員下方者禮象珽與大圭異珽無所屈天子見諸侯見卿大夫之笏也大圭椎其上猶諸侯荼前屈後直見天地見先王之笏也珽玉六寸大圭長三尺眀非一物王執鎮圭晉大圭鎮圭尺有二寸故大圭長三尺王執冒搢珽冒圭四寸故珽六寸周冒圭玉人天子執冒四寸以朝諸侯天子用全注名玉曰冒者言徳能覆蓋天下也四寸者方以尊接卑以小為貴全純色也疏案書傳云古者圭必有冒言不敢專達之義天子執冒以朝諸侯見則覆之注云君恩覆之臣敢進此冒朝覲諸侯時執之詩疏在國受朝下諸侯故執冒書上宗奉同瑁注見上疏禮天子執瑁者諸侯即位天子賜之以命圭圭頭邪鋭其瑁當下邪刻之其刻濶狹長短如圭頭諸侯來朝執圭以授天子天子以瑁之刻處冒彼圭頭若大小相當則是本所賜其或不同則圭是偽作知諸侯信與不信故天子執瑁所以冒諸侯之圭以齊瑞信猶今之合符以一瑁冒天下之圭則公侯伯之圭濶狹等也此瑁惟冒圭不冒璧易氏曰其形方正其制邪刻之天子之冒圭邪刻其下而諸侯之瑞圭邪鋭其首合以為驗周六器禮神玉大宗伯以玉作六器以禮天地四方以蒼璧禮天黄琮禮地青圭禮東方赤璋禮南方白琥禮西方𤣥璜禮北方皆有牲幣各放其器之色云云涖玉鬯注玉禮神之玉也疏天地有禮神之玉無鬱鬯宗廟無禮神之玉而有鬱鬯宗廟仍有圭瓉璋瓉亦是玉天府季冬陳玉以貞來嵗之媺惡注陳玉陳禮神之玉典瑞掌玉器之藏注禮神曰器大祭祀大旅凡賓客之事共其玉器而奉之郊特牲疏五時迎氣其中央無文先師以為亦用黄琮熊氏以為亦用赤璋三禮義宗云昊天及五精之帝圭璧皆長尺二寸周蒼璧大宗伯以蒼璧禮天徑九寸好三寸兩邊各三寸注此禮天以冬至謂天皇大帝在北極者也禮神又象其類璧圓象天疏蒼是天色故用蒼此六玉所用上璧下琮覲禮惟上圭下璧與此違彼上下之神是日月故陳玉與此不同爾雅肉倍好謂之璧肉邊也好孔也三禮圖阮鄭二圖皆云蒼璧九寸厚寸周黄琮大宗伯以黄琮禮地剡出一寸六分長八寸厚一寸注禮地以夏至謂神在崑崙者也琮八方象地疏用黄琮依地色黄者中之色郊特牲疏祀中央黄帝亦用黄琮宜九寸以别於地祇開元禮避諱云禮西方白帝以騶虞晉中興書云白琥尾參倍其身周青圭赤璋大宗伯以青圭禮東方徑九寸厚寸博三寸剡上各一寸半以赤璋禮南方注禮東方以立春謂蒼精之帝而太昊勾芒食焉禮南方以立夏謂赤精之帝而炎帝祝融食焉圭鋭象春物初生半圭曰璋象夏物半死疏雜記圭剡上左右各寸半公羊傳璋判白周白琥𤣥璜大宗伯以白琥禮西方長九寸廣五寸髙三寸以𤣥璜禮北方注禮西方以立秋謂白精之帝而少昊蓐收食焉禮北方以立冬謂黒精之帝而顓頊𤣥㝠食焉琥猛象秋嚴半璧曰璜象冬閉藏地上無物惟天半見也疏半璧曰璜者逸禮記文色黄家春秋傳賜子雙琥周四圭典瑞四圭有邸以祀天旅上帝注鄭司農云於中央為璧圭著其四面一玉俱成爾雅曰邸本也圭本著於璧圭末四出故也祀天謂夏正郊天上帝五帝也疏用一大玉琢出中央為璧形亦肉倍好為之四面琢各出一圭四廂圭各尺二寸與鎮圭同其璧為邸蓋徑六寸總三尺與大圭長三尺又等故云一玉俱成也或説四圭有邸有四角也以無正文故兩釋之玉人四圭尺有二寸以祀天易氏曰四圭備天德也尺有二寸備天數也典瑞共其玉器注謂四圭祼圭之屬三禮圖四圭亦博三寸厚寸色赤周官義四圭邸璧兩圭邸琮典瑞掌其用玉人掌其制周兩圭典瑞兩圭有邸以祀地旅四望三禮圖色青一於六寸璧兩邊各琢圭長二寸半注兩圭者以象地數二也僢而同邸祀地謂所祀於北郊神州之神疏僢謂兩足相向兩圭亦兩足同邸四圭同邸者亦是各自兩足相向玉人兩圭五寸有邸以祀地以旅四望注邸謂之抵有邸僢共本也疏一玉俱成兩圭足相對為僢易氏曰天以健為體其徳無不周故其用為四圭地以順為體其徳有所止故半之為兩圭周祼圭玉瓉祼器祼玉魯鬯圭漢瓉槃春官典瑞祼圭有瓉以肆先王以祼賓客注鄭司農云於圭頭為器可以挹鬯祼祭謂之瓉國語謂之鬯圭魯語臧文仲以鬯圭如齊告糴容鄭瓘斚玉瓉為明堂位灌用玉瓉大圭注瓉形如槃五升以大圭柄是謂圭瓉康成謂爵行曰祼漢禮瓉槃大五升口徑八寸下有槃口徑一尺疏肆先王謂祭祀先王則宗伯六享也祼賓客則大行人云上公再祼侯伯一祼也云漢禮瓉槃云云者此漢禮器制度文叔孫通所作大祭祀大旅凡賓客之事共其玉器而奉之注玉器謂四圭祼圭之屬小宗伯祭祀賓客以時將瓉祼注天子圭瓉諸侯璋瓉鬱人掌祼器凡祭祀賓客之祼事和鬱鬯以實彜以陳之凡祼玉濯之陳之以賛祼事注祼器謂彛及舟與瓉鬱鬯謂築鬱金草煮之以和鬯酒鄭司農云鬱草名十葉為貫一百二十貫為築祼玉謂圭瓉璋瓉疏王制云諸侯賜圭瓉然後為鬯王度記云天子以鬯諸侯以薰大夫以蘭芝士以蕭庶人以艾禮緯云鬯草生庭以和鬯酒因號為鬯草郊特牲云灌以圭璋用玉氣也王用圭瓉后用璋瓉鬯人共秬鬯以飾之注秬鬯不和鬱者也司尊彜云云注祼謂以圭瓉酌鬱鬯始獻也后以璋瓉酌亞祼祼用鬱齊冬官玉人祼圭尺有二寸有瓉以祀廟注祼始獻酌奠也瓉如盤其柄用圭有流前注詩旱麓六章其二章曰瑟彼周禮注云䘏彼玉瓉黄流在中注玉瓉圭瓉也黄金所以飾流鬯也九命然後錫以秬鬯圭瓉箋云黄流秬鬯也圭瓉之狀以圭為柄黄金為勺與玉人云黄金勺鼻等同也青金為外朱中央殷王帝乙之時王季為西伯以功徳受此賜見孔叢子子思云江漢釐爾圭瓉秬鬯一卣召虎棫樸左右奉璋注半圭箋云璋瓉亞祼書序平王賜晉文侯秬鬯圭瓉洛誥王入太室祼注太室清廟祼鬯告神祭統君執圭瓉祼尸大宗執璋瓉亞祼注祼器以圭璋為柄甘泉賦𤣥瓉觩䚧秬鬯泔淡周圭璧典瑞圭璧以祀日月星辰注圭其邸為璧取殺於上帝三禮圗色白長六寸璧上琢出一圭五寸玉人圭璧五寸以祀日月星辰注同上之五寸象天中疏圭璧謂以璧為邸旁有一圭詩圭璧既卒是燔牲玉也覲禮設方明上圭下璧謂日月之神禮象曰圭邸璧則以青圭揷蒼璧璋邸琮則以赤璋揷黄琮周璋邸典瑞璋邸射以祀山川以造贈賓客注璋有邸而射取殺於四望鄭司農云射剡而出也詩書注及三禮圗云半圭曰璋射言剡出而貫於邸象山川阻固賔客藩屛之功玉人璋邸射素功以祀山川以致稍餼注素功無瑑飾也公羊傳璋判白注璋所以郊事天尤重詩云奉璋峩峩髦士攸宜箋云璋瓉也王祼以圭瓉諸臣亞祼以璋瓉璋詩又云載弄之左傳享頫有璋周土圭詳見圭景類大司徒以土圭之灋測土深正日景以求地中日南則景短多暑日北則景長多寒日東則景夕多風日西則景朝多隂日至之景尺有五寸謂之地中天地之所合也四時之所交也風雨之所㑹也隂陽之所和也然則百物阜安乃建王國焉凡建邦國以土圭土其地而制其域注土圭之長尺有五寸以夏至之日立八尺之表景適與土圭等謂之地中今潁川陽城地為然典瑞土圭以致四時日月封國則以土地注鄭司農云以求地中故謂之土圭疏洛邑以求地中自餘或致四時之景或封諸侯所用不必要求地中先鄭據大司徒而言耳玉人土圭尺有五寸以致日以土地注土猶度也建邦國以度其地疏日景一分地差百里五等諸侯取五分景周珍圭典瑞珍圭以召守恤荒注杜子春云珍當為鎮召守國諸侯若今召郡守以竹使符鎮者國之鎮諸侯亦一國之鎮故以鎮圭召之荒則民有逺志故以鎮圭鎮安之𤣥謂珍圭王使之瑞節制大小當與琬琰相依王使人召諸侯憂凶荒之國則授之執以往致王命如今使者持節凡瑞節歸又執以反命正義玉人琬圭九寸此珍圭玉人不言故約與琬琰同荀子聘人以珪問士以璧周牙璋典瑞牙璋以起軍旅以治兵守注鄭司農云瑑以為牙牙齒兵象故以牙璋發兵若今以銅虎符發兵也𤣥謂牙璋亦王使之瑞節疏牙璋亦素功大軍旅用牙璋小軍旅用中璋璋為南方陽極生隂兵隂也故以起旅牙有森列之義戰守不同璋亦隨異玉人牙璋中璋七寸射四寸厚寸以起軍旅治兵守注二璋皆有鉏牙之飾於剡側先言牙璋有文飾也疏軍多用牙璋軍少用中璋中璋亦有鉏牙但牙璋文飾多故得牙名而先言也典瑞無中璋以其大小等周璧羨典瑞璧羨以起度三禮圖云色白注鄭司農云羨長也此璧徑長尺以起度量𤣥謂羨不圜貌蓋廣徑八寸袤一尺疏爾雅云肉倍好謂之璧此璧本徑九寸今言羨則減傍一寸以益上下玉人璧羨度尺好三寸以為度注鄭司農云羨徑也好璧孔也𤣥謂羨猶延其袤一尺而廣狹焉疏璧好三寸好即孔也兩畔肉各三寸共六寸是肉倍好也圜徑九寸今減廣一寸以益上下之袤一寸則上下一尺廣八寸故云其袤一尺而廣狹焉天子以為量物之度易氏曰以好三寸推之肉倍好為六寸是兩畔各三寸則璧之圓凡九寸延其旁之一寸以益上下則横徑八寸袤十寸矣以十寸之尺而起度則十尺為丈十丈為引以八寸之尺而起度則八尺為尋倍尋為常古人之度在樂則起於黄鍾在禮則起於璧羨駔琮為權其意與此同璧之體圓琮之體方周穀圭典瑞穀圭以和難以聘女注穀圭亦王使之瑞節穀善也其飾若粟文然聘女則以納徴焉疏執善圭和之使善聘女亦和好之事故用善圭昏禮有六五禮用鴈納徴不用鴈以其有束帛可執徴成也春秋謂之納幣玉人穀圭七寸天子以聘女注納徴加於束帛疏士已上皆用𤣥纁束帛天子加穀圭諸侯加大璋子執穀璧周琬圭典瑞琬圭以治徳以結好注琬圭亦王使之瑞節諸侯有徳王命賜之使者執以致命也結好者諸侯使大夫來聘為壇㑹之使大夫執以命事大行人職曰時聘以結諸侯之好鄭司農云琬圭無鋒芒故治徳以結好玉人琬圭九寸而繅以象徳注琬猶圜也王使之瑞節也繅藉也疏象徳據圭體而説治徳據使者而言書琬琰在西序注琬琰之圭漢司馬相如傳析圭而爵注如淳曰析中分也白藏天子青在諸侯也周琰圭剡圭典瑞琰圭以易行以除慝注琰圭亦王使之瑞節鄭司農云琰圭有鋒芒傷害征伐誅討之象易惡行令為善者以此圭責誚喻告之𤣥謂除慝亦於諸侯使大夫來覜既而使大夫執而命事於壇大行人職曰殷覜以除邦國之慝玉人琰圭九寸判規以除慝以易行注凡圭琰上寸半琰圭琰半以上又半為瑑飾諸侯有為不義使者征之執以為瑞節也誅惡逆去煩苛疏判半也半以上琰至首規半以下為瑑飾調人則與之瑞節注玉節之剡圭也易氏曰琬圓其鋭以和順為義彰諸侯之善琰剡其末以剛斷為義癉諸侯之惡九寸陽數之極以馭諸侯周瑑圭璋璧琮典瑞瑑圭璋璧琮繅皆二采一就以覜聘注璋以聘后夫人以琮享之也大夫衆來曰覜寡來曰聘鄭司農云瑑有沂鄂瑑起疏此遣臣行聘問之所執若君自朝執桓圭等若遣臣聘不得執君之圭璧無桓信躬蒲穀之文直瑑之而已朱緑二采共為一就圭以聘天子與諸侯而璧享之玉人璧琮九寸諸侯以享天子注享獻也聘禮享君以璧享夫人以琮疏二王後享天子及后用圭璋此引聘禮者見享天子用璧享后用琮九寸據上公九命若侯伯當七寸子男當五寸瑑圭璋八寸璧琮八寸以覜聘注瑑文飾也覜視聘問衆來曰頫特來曰聘聘禮曰凡四器者唯其所寶以聘可也疏此謂上公之臣執以頫聘用圭璋享用璧琮於天子及后也若兩諸侯自相聘亦執之侯伯之臣宜六寸子男之臣宜四寸瑑琮八寸諸侯以享夫人注獻於所朝聘君之夫人疏諸侯自相朝所用致享者五等諸侯朝天子享用璧琮不降瑞若自相享降瑞一等上公二王後自相享用璧琮八寸侯伯當六寸子男用琥璜四寸不言瑑璧以享君文畧可知也覲禮總稱侯氏用璧明五等同也聘義圭璋特達徳也注特達謂以朝聘也璧琮則有幣有徳者無所不達不有須而成也雜記賛大行曰圭公九寸侯伯七寸子男五寸博三寸厚半寸剡上左右各寸半玉也藻三采六等藻薦玉者以朱白蒼畫之再行也聘禮所以朝天子圭與繅皆九寸繅三采六等朱白蒼問諸侯朱緑繅八寸周語為贄幣瑞節以鎮之左傳朝聘有珪享覜有璋公羊傳注凡贄天子用鬯諸侯用玉卿用羔大夫用鴈士用雉禮珪以朝璧以聘琮以發兵璜以發衆璋以召周大璋中璋邉璋三璋冬官玉人之事大璋中璋九寸邉璋七尺射四寸厚寸黄金勺青金外朱中鼻寸衡四寸有繅天子以廵守宗祝以前馬中璋勺口徑九寸鼻射寸邉璋七寸勺徑璋厚薄鼻寸注射剡出者也鼻勺流也凡流皆為龍口衡古文横假借字也衡謂勺徑也三璋之勺形如圭瓉天子廵守有事山川則用灌焉大山川則用大璋加文飾也中山川用中璋殺文飾也小山川用邉璋半文飾也其祈沈以馬宗祝亦執勺以先之禮王過大山川則大祝用事焉將有事於四海山川則校人飾黄駒詩正義云皆是璋瓉書秉璋以酢正義圭瓉之形大三璋之勺徑四寸所容似小大璋亦如之諸侯以聘女或曰錯文當繼於榖圭之後大字恐誤注亦納證加於束帛也大璋者以大璋之文飾之也亦如之者如邉璋七寸射四寸疏天子穀圭七寸以聘女諸侯不可過於天子為九寸中璋以起軍旅見上圭璋皆祼玉也圭以象陽之生物璋以象隂之成事祼圭尺有二寸象陽以偶成大璋中璋九寸象隂以竒立此宗廟賓客山川隆殺之辨也周駔琮大琮玉人駔琮五寸宗后以為權注駔讀為組以組繫之因名焉鄭司農云以為稱錘以起量疏后所用五寸降於天子以駔琮可以為權之始而不可為權之用五中數也中數為權則中而不可易大琮十有二寸射四寸厚寸是謂内鎮宗后守之注如王之鎮圭也射其外鉏牙疏大琮對駔琮五寸為大内鎮對天子執鎮圭為内射其外鉏牙者據八角鋒駔琮七寸鼻寸有半寸天子以為權注以為權故有鼻七成數也以成數為權則成而不可變周玉案玉人案十有二寸棗㮚十有二列諸侯純九大夫純五夫人以勞諸侯注鄭司農云案玉案也夫人天子夫人𤣥謂案玉飾案也夫人王后也玉案十二以為列王后勞諸侯皆九列聘大夫皆五列則十有二列者勞二王之後也棗㮚實於器乃加於案聘禮曰夫人使下大夫勞以二竹簋方𤣥被纁裏有蓋實棗烝㮚擇兼執之以進疏聘禮諸侯夫人使下大夫勞無案直有棗栗此后勞有案易氏曰后夫人皆與賓客之事掌次設重案注牀重席也文選注楚漢春秋淮隂侯曰漢王賜臣玉案之食周六幣秋官小行人成六瑞云云合六幣圭以馬璋以皮璧以帛琮以錦琥以繡璜以黼此六物者以和諸侯之好故注合同也兩兩相配故言合六幣所以享王也五等諸侯享天子用璧享后用琮其大各如瑞皆有庭實用圭璋者二王之後也子男於諸侯則享用琥璜下其瑞也疏馬皮二者本非幣以用之當幣故總號為幣六幣配以六器之玉象徳也覲禮設六玉上圭下璧南方璋西方琥北方璜東方圭注六色象其神六玉以禮之設玉者刻其木而著之上宜以蒼璧下宜以黄琮而不以者上下之神非天地之至貴者也書賓稱奉圭兼幣疏幣即馬是也圭是文馬之物鄭云此幣圭以馬蓋舉王者之後以言耳諸侯當璧以帛亦有庭實覲禮諸侯享天子馬卓上九馬隨之大宰之幣貢釋者曰玉幣皮馬也左傳庭實旅百奉之以玉帛疏覲禮侯氏執圭見王王受圭禮成乃出又入行享禮獻國之所有云云覲禮侯氏既見王乃云四享皆束帛加璧庭實唯國所有鄭𤣥云四當為三大行人職曰詩侯廟中將幣皆三享初享或用馬或用虎豹之皮其次享三牲魚腊籩豆之實龜也金也丹漆絲纊竹箭也其餘無常貨分為三享皆以璧帛致之禮器云束帛加璧尊徳也郊特牲曰往徳也贄幣即璧帛也侯氏致享執玉致命王撫之而已不受之也侯氏降授宰幣是庭實之幣皆庭受之唯馬受之於門外覲禮侯氏用璧琮侯氏升致命王撫玉注王不受玉撫之而已輕財也禮掌訝將幣為前驅至于朝詔其位小宗伯受其將幣之齎服不氏抗皮校人受其幣馬鄭注曲禮云春受贄於朝受享於廟楚語共幣帛以賓享於諸侯周玉鎮大寳器玉瑞春官天府上士一人中士二人掌祖廟之守藏始祖后稷之廟其寶物世傳守之若魯寶玉大弓凡國之玉鎮大寶器藏焉若有大祭大䘮則出而陳之既事藏之注玉鎮大寶器玉瑞玉器之美者禘祫陳之以華國顧命曰陳寶赤刀大訓𢎞璧琬琰在西序大玉夷玉天球河圖在東序𦙍之舞衣大貝鼖鼓在西房兌之戈和之弓垂之竹矢在東房上春釁寶器寶鎮季冬陳玉以貞來歳之媺惡典瑞中士二人掌玉瑞玉器之藏辨其名物注人執以見曰瑞鎮圭之等禮神曰器四圭之等瑞符信也疏若天子受瑞於天諸侯不得受瑞於天唯受瑞於天子故名為瑞周書世俘篇武王俘商舊玉億有百萬書越玉五重陳寶正義西序東序列玉五重又陳先王所寶之器物鄭𤣥云大璧大琬大琰皆度尺二寸王肅云夷玉東夷之美玉天球玉磬也鄭𤣥云大玉華山之球也夷玉東北之珣玗琪也説文醫無閭珣玗琪周書所謂夷玉也天球雍州所貢之玉色如天者皆璞未見琢治故不以禮器名之古者寳玉世守罔敢失墜以昭先祖之徳存肅敬之心楚語國之寳六而已聖玉龜珠金山林藪澤周珠槃玉敦天官玉府若合諸侯則共珠槃玉敦注敦槃類音對珠玉以為飾古者以槃盛血以敦盛食合諸侯者必割牛耳取其血㰱之以盟珠槃以盛牛耳尸盟者執之疏槃敦以木為之珠玉為飾夏官戎右盟則以玉敦辟盟遂役之賛牛耳桃茢周玉齍天官九嬪凡祭祀賛玉齍音咨賛后薦徹豆籩注玉齍玉敦也受黍稷器后進之而不徹疏云后親執而設之春官大宗伯凡祀大神享大􅀑祭大示涖玉鬯奉玉齍注玉禮神玉也疏天地有禮神之玉而無鬱鬯宗廟無禮神之玉而有鬱鬯齍謂黍稷小宗伯辨六齍之名物與其用注齍讀為粢六粢謂六穀黍稷稻粱麥苽秋官司烜氏下士六人掌以夫遂取明火於日以鑒取明水於月以共祭祀之明齍明燭共明水注夫遂陽燧也鑑鏡屬取水者世謂之方諸明齍謂以明水滌粢盛黍稷晉志火出於陽燧燧員而火不員水生於方諸諸方而水不方周玉幣爵玉獻玉爵瑶爵太宰祀五帝賛玉幣爵之事注玉與幣所以禮神爵所以獻齊酒不用玉尚質疏禮神幣與玉亦各如其方色祭天無祼無彛尊享先王用玉爵尚文祭天不用玉爵尚質三者執以從王至而授之王親自執玉幣奠於神坐親酌以獻尸賛玉几玉爵注玉几所以依神天子左右玉几疏祭宗廟用玉几宗廟獻用玉爵明堂位獻用玉琖謂王朝踐饋獻時若祼則用圭瓉大朝覲㑹同賛玉幣玉獻玉几玉爵注玉幣諸侯享幣也其合亦如小行人所合六幣玉獻獻國珍異亦執玉以致之玉几王所依也玉爵王禮諸侯之酢爵疏行享之時亦璧琮加束帛以致之三享之外别有獻國珍異以玉致獻諸侯酢王用玉爵則冡宰賛王受之内宰大祭祀后祼獻則賛瑶爵亦如之凡賓客祼獻瑶爵皆賛注祭宗廟王既祼而出迎牲后乃從後祼獻謂王薦腥薦孰后亦從後獻瑶爵謂尸卒食后亞獻之其爵以瑶為飾賓客謂王同姓及二王之後祼之禮亞王而禮賓獻謂王饗燕亞王獻賓疏王以玉爵酌朝踐醴齊謂之朝獻后於後以瑶爵酌饋獻時盎齊謂之再獻王用玉琖后用璧角瑶爵謂王饗燕酬賓時后亦助王酬賓饗禮在廟獻依命數爵盈而不飲燕禮一獻四舉旅降脱屨升坐其爵以醉為度小宰凡祭祀賛王執爵之事疏小宰執以授大宰大宰執以授王司尊彜疏眀堂位璧角璧散即内宰所云瑶爵一也以瑶玉為璧形以飾角散爵是通名注王用玉爵再獻者用璧角璧散祭統疏爵為雀形以尾為柄禮象曰以薦鬯則謂之同以薦酒則謂之修書上宗奉同盥以異同荀卿曰修爵無數周官曰凡酒修酌周玉鬯大宗伯宿眡滌濯涖玉鬯注玉禮神之玉也疏曲禮云玉曰嘉玉郊特牲云用玉氣小宰祼將之事注賛王酌鬱鬯疏宗廟有祼天地無祼王以圭瓉酌鬱鬯獻尸后以璋瓉酌祭天地既言無灌案宗伯涖玉鬯表記云親耕粢盛秬鬯以事上帝春官鬯人掌供秬鬯社稷山川等外神皆用秬鬯不用鬱用鬯唯有宗廟及祼賓客王制賜圭瓉然後為鬯未賜圭瓉則資鬯於天子郊特牲周人尚臭灌用鬯鬱合鬯灌以圭璋用玉氣也注灌謂以圭瓉酌鬯洛誥伻來毖殷乃命寧予以秬鬯二卣曰明禋拜手稽首休享李氏曰卣鬯之樽也賜則實之於卣祭則陳之於彛宋書黄帝時南夷乘白鹿來獻秬鬯孔叢子子思曰聞諸子夏曰殷王帝乙之時王季以九命作伯於西受圭瓉秬鬯之賜宣王錫召虎平王錫晉文侯襄王賜晉文公秬鬯玉府王齊共食玉注玉是陽精之純食之以禦水氣周封圭榖梁傳定八年冬云云寶玉者封圭也注始封之圭大弓者武王之戎弓也周公受賜藏之魯注受賜於周亢倉子鄭有相之封圭戎弓史記成王削桐葉為珪予唐叔曰以此封若又吕氏春秋韓詩外傳春秋成八年秋七月天子使召伯來賜公命杜預注諸侯即位天子賜以命圭與之合瑞周簡圭淮南子説山訓第十六明月之珠出於蛖蜄周之簡圭出於垢石注許慎大圭也美玉出於石中左傳昭二十四年王子朝用成周之寶珪于河郊特牲大圭不瑑美其質也帝王世紀武王命歸璇臺之珠玉周介圭後漢張衡傳作應間云申伯樊仲實幹周邦服衮而朝介圭作瑞注詩注圭長尺二寸謂之介周靈珪墨子周之靈珪出於土石周紉璐亢倉子靈王使祭公致篚帛與紉璐子華子井里之璞魯璵璠白璋文選魏文帝書曰晉之垂棘魯之璵璠宋之結緑楚之和璞璵璠又見左傳公羊傳定八年冬寶者何璋判白弓繡質龜青純注半圭曰璋白藏天子青藏諸侯魯得郊天故錫以白璋所以郊事天詩云奉璋峩峩初學記逸論語璵璠魯之寶玉也孔子曰美哉璵璠逺而望之奐若也近而眎之瑟若也一則理勝一則孚勝又見説文戰國䇿應侯曰宋有結緑梁有垂黎楚􅪛氏璧晉垂棘璧蔡邕琴操楚明光者楚王大夫也昭王得􅪛氏璧􅪛古和字欲貢於趙王於是遣明光奉璧之趙文選注史記趙恵王得和氏之璧秦昭王遺趙王書願以十三城易璧趙王使藺相如奉璧至秦秦王無意償趙城相如持璧倚柱曰臣頭與璧俱碎於柱矣韓子楚人和氏得玉璞於楚山之中荀子和之璧井里之厥也玉人琢之為天子寶左傳晉以垂棘之璧假道於虞以伐虢虞公許之宫之竒曰虞不臘矣文選魏文帝與鍾繇書垂棘出晉虞虢雙禽和璧入秦相如抗節孔子圭禮記玉藻圏豚行不舉足齊如流注圏轉也豚之言若有所循不舉足曵踵則衣之齊如水之流矣孔子執圭則然此徐趨也儀禮聘禮注孔子之執圭鞠躬如也如不勝上如揖下如授勃如戰色足縮縮如有循漢瑄玉郊祀志元鼎五年公卿言皇帝始郊見泰一雲陽有司奉瑄玉嘉牲薦饗是夜有美光及晝有黄氣上屬天注孟康曰璧大六寸曰瑄秦詛楚文敢用吉玉宣璧告於不顯大神巫咸漢玉梢紫幄禮樂志郊祀歌十九章天門十一飾玉梢以舞歌體招揺若永望星留俞塞隕光照紫幄珠熉黄注梢竿也舞者所持玉梢以玉飾之也紫幄饗神之幄也漢璧玉禮樂志郊祀歌五神章十六扢嘉壇椒蘭芳璧玉精垂華光注言禮神之璧乃玉之精英天地章展詩應律鋗玉鳴注鋗鳴玉聲漢介珪文選王延夀魯靈光殿賦粤若稽古帝漢祖宗濬哲欽明乃命孝孫俾侯于魯錫介圭以作瑞宅附庸而開宇注介大也圭長尺二寸謂之介諸侯錫大圭為瑞信又以為寶申伯之封錫介圭以作寶史岑出師頌有漢云云介珪既削列壤酬勲漢倉璧食貨志王侯宗室朝覲聘享必以皮幣薦璧然後得行顔異曰今王侯朝覲以倉璧直數千而其皮薦反四十萬本末不相稱史記褚先生曰諸侯王正月朔旦奉皮薦璧玉賀正月後禮儀志贄公侯璧注決疑要注曰漢魏正旦大㑹諸侯執玉璧薦以鹿皮公卿以下所執如古禮中二千石二千石羔千石六百石鴈四百石以下雉舊典市長執鴈建安八年始令執雉百官志王國大夫奉璧賀正月朱暉傳故事少府給璧北海敬王睦傳嵗終遣中大夫奉璧朝賀蔡邕獨斷三公奉璧上殿周禮大宗伯以禽作六摯以等諸臣孤執皮帛卿執羔大夫執鴈士執雉庶人執鶩工商執雞注皮帛者束帛而表皮以為之飾皮虎豹皮帛即今璧色繒也曲禮飾羔鴈者以繢自雉以下執之無飾凡摯無庭實漢玉寶寶璧玉器郊祀志上自幸河東之明年正月鳯皇集祋祤於所集處得玉寶起步夀宫史記將相名臣年表禇先生續大事記孝宣神爵二年上郊雍五畤祋祤出寶器玉器志在神爵二年正月與此同但宣紀五鳳二年郊雍而神爵二年不書大事記亦不書五鳳郊雍然禇氏補表耳目不逺固無舛誤祀天之誠地不愛寶漢玉寶璧劒寶郊祀志神爵元年又以方士言為隨侯劒寶玉寶璧周康寶鼎立四祠於未央宫中劉敞曰隨侯珠一也劎寶即斬蛇劒二也玉寶璧即受命寶和氏璧三也周康鼎似汾上所獲鼎也晉輿服志傳國璽斬蛇劒俱為乘輿所寶傳國璽即受命寶漢藍田璧外戚傳昭陽舎璧帶往往為黄金釭函藍田璧明珠翠羽飾之西都賦藍田美玉注范子計然曰玉英出藍田甲乙之帳落以和璧武帝束帛加璧迎申公禮器束帛加璧尊徳也漢五玉祭祀志建武三十二年封禪刻石文同律度量衡修五禮五玉三帛吏各修職復于舊典注范寗曰五等諸侯之瑞珪璧也漢珪璧明帝紀永平二年春正月辛未宗祀明堂詔曰親執珪璧恭祀天地王尊傳為東郡太守河水溢尊親執圭璧文紀十四年春詔曰朕獲執珪幣以事上帝宗廟云云其廣增珪幣郊祀志云圭幣以差加之溝洫志孝武臨決河湛玉璧漢嘉玉紀永平十三年四月乙酉詔薦嘉玉潔牲以禮河神注禮記曰凡祭玉曰嘉玉漢玉牒詳見封禪類祭祀志封禪用玉牒書藏方石牒厚五寸長尺三寸廣五寸有玉檢時以印工不能刻玉牒欲用丹漆書之㑹求得刻玉者遂書秘刻方石中命容玉牒尚書令奉玉牒檢皇帝以寸二分璽親封之尚書令以五寸印封石檢封禪儀曰以金為繩漢玉珪古今注章帝建初七年玉珪出𢎞農華隂晉玉佩又見上類玉璧羅憲傳泰始初入朝詔給鼓吹又賜山𤣥玉佩劒王祥傳賜山𤣥玉佩禮志江左以來太子婚納徴禮用玉璧一獸皮二獸取其威猛有班彩玉以象徳而有潤宋玉璧符瑞志大明元年五月戊寅江乗縣得玉璧徑五寸八分以獻四年二月乙巳徐州於汴水得白玉㦸以獻南齊永明七年錢塘獲蒼玉璧一唐寧真玉像二十七宿圖贊玉冊地理志寧州寧真縣本羅川天寶元年獲玉真人像二十七因更名一本云天寳六年寧州羅川縣金華洞獲玉像皆列宿之真惟少氐宿改縣為寧真洋州真符縣本華陽天寶八載因鑿山得玉冊更名藝文志道家類寧州通其觀二十七宿真形圖讃一卷唐大圭鎮圭禮志凡祭祀之節質明皇帝服大裘而冕至中壝門外搢大圭執鎮圭皇帝執大珪迎三老六典殿中監凡大祭祀進大圭執鎮圭官志殿中省尚衣奉御祭祀奉鎮圭於監而進於天子蔣防鎮圭賦雲虹發色氷雪成姿元稹鎮圭賦鋭上象天方下法地備采章以盡飾瑑崇髙而定位李華含元殿賦執鎮圭導朱紘杜甫詩勃律天西采玉河堅昆碧盌最來多唐穀珪禮志納皇后執事者奉穀圭以匵晉禮志有司奏禮皇后聘以穀珪唐禮神六器禮神九玉圭幣郊廟圭玉郊祀圭璧㑹要天寳九載十一月三日詔禮神六器宗廟奠玉並用真玉諸祀用珉一本云天寳十載十一月壬午詔曰禮神以玉取其精潔温潤自馮紹正奏後有司並用珉人力普存備物以享安可以珉代玉自今禮神六器宗廟奠玉並用真玉諸祀用珉如玉難得大者寧小其制度以取其真神楚語玉足以庇廕嘉榖韋昭注云玉禮之玉也太和九年十一月判太常卿禮儀詳定使王起請造禮神九玉奏議曰周禮以蒼璧禮天黄琮禮地青圭赤璋白琥𤣥璜禮四方又云兩圭有邸以祀天四圭有邸以祀地圭璧以祀日月星辰凡此九器禮神之玉也周禮有焚玉有藏玉鄭𤣥釋禋祀禋煙也為玉幣祭訖焚之而作煙以報陽也此焚玉之證也天府掌國之玉鎮大寶器若大祭祀既事而藏之此收玉之證也三禮義宗云凡祭天神有二玉禮神者訖事却收祀神者與牲俱燎今國家郊祀天地祀神之玉常用禮神之玉則無請下有司求良玉造蒼璧黄琮等九器祭訖則藏之其燎玉依常制從之禮志冬至祀昊天上帝以蒼璧上辛明堂以四圭有邸幣皆以蒼地祇黄琮幣以黄青帝青圭赤帝赤璋黄帝黄琮白帝白琥黒帝黒璜幣如其玉日圭璧幣青月圭璧幣白神州社稷兩圭有邸幣以黒嶽鎮海瀆兩圭有邸幣如其方色神農赤伊耆黒五星以方色先農青先蠶黒其長丈八尺此玉幣之制也官志少府監供郊廟圭玉百官儀物太府卿祭祀幣帛皆供焉六典中尚令供郊祀之圭璧志同唐定國寶玉紀寶應元年建巳月壬午楚州獻定國寶玉十有三舊紀云楚州刺史崔侁表獻定國寶玉十三枚一曰元黄天符如笏長八寸闊三寸上圓下方近圓有孔黄玉也二曰玉雞毛文悉備白玉也三曰穀璧白玉也徑可五六寸其文粟粒無雕鐫之迹四曰西王母白環二枚白玉也徑六七寸五曰碧色寶圓而有光六曰如意寶珠形圓如雞卯光如月七曰紅靺鞨大如巨粟赤如櫻桃八曰琅玕珠二枚長一寸二分九曰玉玦形如玉環四分缺一十曰玉印大如半手斜長理如鹿形陷入印中以印物則鹿形著焉十一曰皇后採桑鈎長五六寸細如筯屈其末似真金又似銀十二曰雷公石斧長四寸闊二寸無孔細緻如青玉十三寶置于日中皆白氣連天侁表云楚州寺尼真如者恍愡上昇見天帝投以十三寳曰中國有災宜以第二寶鎮之乙丑改元寶應禮志親蠶尚功奉金鉤皇后受鉤采桑地理志楚州寶應縣上元三年以獲定國寶更名五行志云上元二年獻寶玉十二其一闕建隆于闐玉圭建隆元年一云二年十二月甲午于闐王李聖文遣使貢玉圭一盛以玉匣興國三年三月沙州曹延禄貢玉圭乾徳鎮圭乾徳元年十一月十三日齋崇元殿翌日服通天冠絳紗袍執鎮圭乗玉輅由明徳門朝饗太廟十六日服衮冕執圭合祭天地圭以表特達之美鎮以示彈壓之强藴五徳之符采冩四鎮之峰巒周禮王搢大圭執鎮圭鎮圭顯諸仁大圭藏諸用開元開寶禮明堂親祠皆搢鎮圭非古也元豐奠鎮圭於繅上而執大圭後周張昭該博問六璽所出并議三禮圖祭玉鼎釡援引經據至道皇太子桓圭乾道桓圭至道元年八月二十五日戊戌詔以九月册皇太子有司言禮天子執鎮圭公執桓圭無太子執圭之文請定制太子服逺遊冠朱明衣執桓圭以受册朝㑹謁廟亦如之詔可乾道元年八月癸巳十七日禮官言禮玉人命圭九寸謂之桓雙植謂之桓博三寸厚半寸剡上左右各寸半玉色如政和新儀之制二十九日詔皇太子桓圭用玉製以一尺祥符玉牒唐蒼璧祥符元年七月甲子文思院玉工言封禪玉牒玉册請用階州石可速就上曰碔砆目之曰玉以奉天於禮可乎翌日曰朕記即位初内府文籍有玉牒玉印之目因徧召玉工詢之有趙榮言太平興國中至内府閲視美玉與衆工為牒册嵗餘方就納于崇聖殿庫亟命取之明潤與常玉不類此先帝聖謨垂裕也即遣知制誥朱巽等監視瑑刻八月壬寅遣中使齎唐明皇禪社首玉册及蒼璧付王欽若等令藏於舊處先是興國中議封禪内官至嶽下得之藏於内府十月辛亥享上帝于圜臺太祖太宗並配攝中書侍郎周起讀玉册訖又讀玉牒文曰以仁守位以孝奉先祈福逮下侑神昭徳云云又讀配座玉册上飲福酒攝中書令王旦跪稱曰天賜皇帝太一神策周而復始永綏兆人三獻畢封金玉匱壬子禪地祇于社首山封玉册石䃭同封祀之禮先是五月壬戌詳定所言開寶通禮封祀玉牒長尺二寸廣五寸厚三分唐貞觀中顔師古奏長尺三寸廣厚各五寸麟徳中許敬宗奏長尺二寸廣寸二分厚三分編以金繩盛以玉匱太平興國九年詳定玉牒用五簡毎簡長尺二寸廣五寸厚五寸刻玉為字填以金聯以金繩盛以玉匱切詳制度歴代不同今請為五牒毎牒長尺二寸廣五寸厚一寸刻字填金聫繩緘匱如興國之制甲子又言泰山圜臺祀天社首壇祭地並以太祖太宗升配共用玉冊六依開寶通禮制度毎簡長一尺二寸廣寸二分厚三分刻字填以金昊天玉冊牒地祇玉冊並盛以玉匱配帝玉冊盛以金匱匱長尺三寸檢厚二寸濶五寸長尺三寸纒以金繩封以金泥又為石䃭石檢金繩石泥五色土封封石䃭用天下同文寶封金玉匱用受命寶丙寅命王旦撰昊天玉牒文馮拯撰地祇玉冊文趙安仁撰祀天及泰山社首二壇配坐太祖太宗玉冊文仍各書之首叙上天降監次述為民祈福之意七月己未朔上玉牒玉冊文祥符大食國玉圭祥符元年將封禪七月己未朔大食航主陁婆棃請以方物陪位太山十月戊申其國蕃官李麻𤭔遣使貢玉圭長尺二寸自言五代祖得於西天竺長者傳云謹守此􅀱中國聖君行封禪禮即馳貢之知青州凌䇿貢玉環玉版各一仁宗闕年永興奏長安民穿井得二玉璧上曰郊廟之寶弃於此國家常戒其亡則玉為國寶祥符桓圭二年三月二十五日庚辰賜兖州曲阜文宣王廟桓圭先是以木為圭至是始易以玉大觀闕年始用鎮圭紹興十四年正月戊寅内出鎮圭付國子監以奉文宣王先是有司請以珉石上曰崇奉先聖豈可用假玉詔以真玉圭降出祥符蒼璧黄琮兩圭三年八月辛未詔汾隂壇后土地祇黄琮神州兩圭有邸令文思院以美玉製之五年閏十月甲申詔恭謝玉皇用蒼璧六年八月戊寅詔奠獻太清宫用蒼璧先是聖祖用四圭有邸禮象曰謂之邸以託宿取名圭邸璧則以青圭挿蒼璧璋邸琮則以赤璋挿黄琮慶厯三年七月乙亥禮院言祀天用蒼璧感生帝用四圭有邸近制同用四圭請考正從之元豐七年八月己丑禮部言開元禮社稷以兩圭有邸詔有司造之皇祐明堂禮神玉皇祐二年三月詔享明堂五月丁亥朔太常禮院上新作明堂禮神玉及燔玉丈彦博表曰瑑十玉之温潔明堂祭玉惟蒼璧不用外定用四圭有邸黄琮圭璧各二青圭赤璋白琥黝璜兩圭有邸凡十一玉並擇嘉玉參周禮義疏聶崇義三禮圖造之指尺為度一以禮神置於神位祀畢藏之少府一以為燔玉加牲體之上燔燎之十月辛未詔明堂禮神玉令少府監擇寛潔庫室奉藏九月四日禮官言神道尚右禮神玉置位版之右詔可實録初上謂輔臣曰前代禮神有祭玉燔玉今獨有燔玉於祀典無乃缺乎文彦博曰唐以來禮神之玉已不備王起為太常卿下有司求良玉造琮璧九器而燔玉止用珉上曰朕事天地祖宗玉有所愛乎其令有司備製時四月甲子沙州適貢良玉乃造璧琮九器其黝璜尤粹祭玉之備始於此一云囘紇貢璞數十枚剖之製為琮璧九品各二㑹要少府供玉太府供幣其長一丈八尺元豐三年八月辛卯詔明堂改用蒼璧禮天五帝依大宗伯陳玉社稷有瘞玉而無禮神玉元豐七年八月二十二日禮官請造兩圭有邸二為社稷禮神之器從之皇祐兩圭二年六月五日禮院言明堂行禮分祀九宫貴神用兩圭有邸凡九玉制以珉玉隨幣色依九宫一白二黒三緑四碧五黄六白七赤八白九紫政和夏祭方澤兩圭與黄琮並用明堂大享蒼璧及四圭並用慶厯七年郊制昊天用蒼璧開寶通禮明堂祀天用四圭有邸皇祐明堂如通禮元豐大圭政和元圭嘉泰圭邸志元豐三年五月詳定所言郊廟之禮有鎮圭無大圭於禮為闕詔議大圭尺度考工記大圭長三尺杼上終葵首天子服之説者曰或謂之珽後魏以降又改為笏珽以白玉為之長尺有二寸方而不折考之周禮長三尺西魏隋唐長尺有二寸蓋隨宜為之請揆玉之有無制之按孔頴達言天子執鎮圭以朝日夕月祭天地宗廟以奉祭祀執鎮圭者摯也搢大圭者笏也唐禮親祀天地搢大圭執鎮圭有事宗廟執鎮圭而已王涇郊祀録曰大圭質也事天地之禮質故執而搢之鎮圭文也宗廟之禮文故無兼執之義不知大圭天子之笏通用於郊廟請自今親祠郊廟搢大圭執鎮圭既接神再拜執鎮圭為摯執大圭為笏儀注曰搢鎮圭宜改為奠盥手飲福則授之人又請乘輅不執圭御大輦亦如之又言大圭中必之制中必與絢組一也聘禮𤣥纁繋長尺絢組絢以薦玉組以約圭二者謂之繅藉今鎮圭無之請製薦玉繅藉以木板為中榦廣袤如其玉用韋衣之韋上畫五采前後垂之約圭繅藉長尺上𤣥下絳五采五就為飾奠圭則以薦繅陳于地執圭以約繅備失隊因垂之為飾從之元豐二年四月詳定所請元㑹朝賀上夀不執鎮圭元祐元年五月禮部言元豐新禮祀天搢大圭其制圓首前絀於禮未合欲放西魏隋唐玉笏之制方而不折上下皆博三寸長尺二寸其厚以鎮圭為約從之政和二年宦者譚穆獻𤣥圭一云王景文上之兩旁刻十二山上銳下方外黑内赤長尺有二寸議者以為周王執鎮圭飾以四鎮之山云云帝乃以是嵗冬十一月戊寅御大慶殿受圭三年又詔冬祀搢大圭執𤣥圭紹興元年五月八日癸卯以𤣥圭宣示輔臣上曰𤣥圭映日則色紅嘉泰四年十月九日侍讀顔棫等言近進讀髙宗聖政至紹興元年降出蒼玉璞因奏竊聞有以四圭有邸來獻陛下付之奉常事與光堯相類上曰此中原舊物極大且厚色甚温潤臣奏髙宗得蒼璧而喜陛下得圭邸而喜蓋誠於奉天故喜於得祀天之器况中原故物湮沒七十年一旦得之至誠所感也乞付史館書簡策從之紹興禮神玉蒼璧赤璋鎮圭見上禮神十二玉天以蒼璧地以黄琮感生帝以四圭有邸神州社稷以兩圭有邸日月以圭璧五帝以青圭赤璋白琥𤣥璜中興闕祭玉紹興元年二月五日命隨方色奠幣八月七日始命訪美玉為蒼璧黄琮辛未八日出蒼玉璞付文思院上喜見玉色曰祀天不當計費時明堂不祀五帝等他玉未及也四年宗祀四月十六日始制五帝日月等玉初未得美璞將用天聖故事以珉為之既而得真玉五月十六日乙丑遂命改制其中赤璋最粹美他玉多不及禮經尺寸云先是闕蒼玉禮官請以木為璧繪天地之色聖意不以為安乃徧求得之日舊制圭瓉璋瓉惟用珉石政和六年十一月一禮制局請改用玉建炎四年大食貢珠玉詔却之紹興二十六年罷㢘州貢珠玉海卷八十七
