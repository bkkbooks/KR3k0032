body:
  text: 玉海卷三十三宋王應麟撰聖文御書伏羲龍書神農穗書少昊鸞鳯書堯龜書韋續字源云包犧氏獲景龍之瑞始作龍書炎帝神農氏因上黨嘉禾八穗乃作穗書用頒時令黄帝因卿雲見作雲書堯因靈龜負圖作龜書少昊作金天鸞鳳書髙陽氏製科斗書亦見墨藪書斷夏禹螺書禹碑緑字文粹崔融碑曰於鑠大禹顯允天徳龍畫旁分螺書徧刻韓愈詩􅒖嶁山尖神禹碑科斗拳身薤葉披鸞飄鳯泊拏虎螭劉禹錫詩嘗聞祝融峰上有神禹銘晉志禹受緑字墨藪夏后氏作鐘鼎書又書斷書注神龜負文列于背禹第之成九類淳化法帖有禹書真誥三皇之世演八㑹之文為龍鳳之章雲篆之跡文房四譜黄帝得玉一紐治為墨海上篆文曰帝鴻氏之硯衡山記甘泉東有石壁禹所刻文在此漢髙祖手勅隋志總集梁有漢髙祖手詔一卷亡古文苑漢髙祖手勅太子韓王信𫝊上賜信書責之漢武帝賜淮南書見詔策漢寳跗見器物類墨藪鶴頭偃波書詔板所用漢尺一之簡是也蚊脚書上詔板也漢光武賜方國手迹循吏𫝊以手迹賜方國者皆一札十行細書成文勤約之風行于上下隗囂傳帝報以手書公孫述𫝊帝與述書又下詔諭述曰詔書手記不可數得唐真草書屏風㑹要貞觀十四年四月二十二日太宗自為真草書屏風以示羣臣筆力遒勁為一時之絶初募求人間書凡真行二百九十紙裝為七十卷草二千紙裝為八十卷每聴政之暇則臨看之嘗謂朝臣曰書學小道初非急務時或留心猶勝棄日凡諸藝業未有學而不得者也病在心力懈怠不能専精耳今吾臨古人書殊不學其形勢惟在求其骨法及得骨力而形勢自生耳吾之所為皆先作意是以果能成也又見張懐瓘叙書法王羲之𫝊制曰烟霏露結狀若斷而還連鳳翥龍蟠勢如斜而反直心慕手追此人而已唐太宗飛白詔權徳輿記曰太宗文皇帝飛白書十二句五十五字者貞觀十六年答左散騎常侍劉洎之詔也縹緲鴻翥之勢輕濃蝉翼之狀子敬白而不飛子雲飛而不白稽合衆美裁成絶藝書圃之逸品也通鑑貞觀十八年四月洎上書上飛白答之曰今聞讜言虛懐以改梁武謂蕭子雲曰蔡邕飛而不白羲之白而不飛顔師古聖徳頌磥硌新勢奮發竒鋒李嗣真曰飛白猶烟空炤灼霧縠卷舒鮑照飛白書勢銘超工八法盡奇六文鳥企龍躍珠解泉分珪角星芒明麗爛逸絲縈髮垂平理端宻君子品之是最神筆唐李約飛白贊曰蕭子雲始變蔡張二王飛白古法又作小篆飛白惟建業古壁餘此蕭字崔備有子雲飛白蕭字記張王繼作子雲精極翻飛露白乍輕乍濃浮雲委地游霧縈空煙霧交霏虯鸞飛動李嶠賀見御書表究黄軒鳥迹之巧殚紫府結空之勢偃波垂露㑹寳意而成新半􅅎全曦象天形而得妙蘇軾作文同飛白贊曰霏霏若輕雲之蔽月翻翻若長風之卷斾猗猗若游絲之縈裊裊若流水之舞天聖四年錢惟演為飛白書序録一卷劉邵飛白書勢唐貞觀飛白書飛白扇㑹要太宗攻羲之書尤善飛白帝工𨽻書又好飛白于王衛之間别更立意精妙絶倫貞觀十八年二月十七日辛酉召三品以上賜宴于𤣥武門太宗操筆作飛白書羣臣乘酒就太宗手中相競散騎常侍劉洎登牀引手然後得之其不得者咸稱洎登牀罪當死請付法太宗笑曰昔聞媫妤辭輦今見常侍登牀是年五月五日太宗為飛白書作鸞鳯蝶龍等字筆埶驚絶謂司徒長孫無忌吏部尚書楊師道曰五日舊俗必用服翫相賀今朕各賜君飛白扇二庶動清風以増美徳劉洎上書曰紆寳思于天文則長河韜映摛玉筆于仙札則流霞成采固已錙銖萬代冠冕百王岑文本述飛白書勢詩有飛毫拂素鳳舉鸞驚之句端拱元年出古墨跡藏秘閣有唐太宗𤣥宗墨迹唐太宗賜馬周飛白書馬周為中書侍郎貞觀十八年表八月丁夘遷中書令太宗以飛白書賜之曰鸞鳳冲霄必假羽翼股肱之寄要在忠力太宗常體目羣臣各有其詞唐太宗筆法文房四譜唐太宗筆法云攻書之時當收視聴絶慮怡神心正氣和則契于𤣥妙墨藪貞觀六年正月八日整理御府書鍾王等真跡得一千五百一十卷唐李靖家藏髙祖太宗詔書太宗手墨李靖𫝊五代孫彦芳太和中為鳳翔司録參軍家故藏髙祖太宗賜靖詔書數函上之一曰兵事節度皆付公吾不從中治也一曰有晝夜視公疾大老嫗遣来吾欲熟知公起居狀皆太宗手墨他大略如此文宗愛之不廢手其舊物有佩筆以木為管刻金其上别為環以限其間筆尚可用也靖破蕭銑所賜于闐玉帶十三胯七方八刓各附環以金固之所以佩者又有火鑑火觿算囊等物常佩于帶者天子悉留禁中詔本還賜彦芳并束帛衣服物權徳輿嘗讀太宗手詔至流涕曰君臣之際乃爾耶韋端符記曰文帝賜書二十通多言征討事太宗製魏徴碑文并御筆書石唐龍朔與遼東諸將書㑹要龍朔二年四月上自為書與遼東諸將謂許敬宗曰許圉師嘗自愛書可於朝堂開示圉師見而驚喜私謂朝官曰圉師見古跡多矣魏晉以後惟稱二王然逸少少力而妍子敬妍而少力今觀聖跡兼絶二王鳳翥鸞迴實古今書聖圉師𫝊曰髙宗自書詔賜遼東諸將唐髙宗賜侍臣飛白書賛戴至徳𫝊為宰相咸亨中實録咸亨五年八月戊寅朔髙宗為飛白書賜侍臣賜同東西臺三品戴至徳曰汎洪源俟舟楫同東西臺三品郝處俊曰飛九霄假六翮同中書門下三品李敬𤣥曰資啓沃罄丹誠中書侍郎崔知悌曰竭忠節賛皇猷皆見意于辭又書隠士田游巖宅榜其門崔知悌𫝊與戴至徳郝處俊李敬𤣥等同賜飛白書賛而知悌敬𤣥以忠勤見表議者以戴郝寛厚而李崔忠勤故帝以此言褒美冠六文而首出掩八體而孤騫眇乎若游霧之拂春林靄乎似輕雲之上秋漢李嶠謝飛白飛白始於蔡邕待詔鴻都撰聖皇篇見役人堊帚因成字邕之後有張敬禮備盡其妙王僧䖍曰是八分之輕者創法於八分窮㣲乎小篆唐御書集賢院額王維集有謝表云陛下發求書之使置冩書之官九流百家韋編緗袠爛然虎觀盛彼鴻都自運銀鉤俯題金榜龍騰金榜鳯轉銀鈎河漢昭囬煙雲飛動張説謝御書大通禅師碑額狀云畫起平雲㸃蹲芒玉戈矛攅倚鸞鶴交飛台州桐栢觀碑𤣥宗御書額天寳元年三月為司馬鍊師立桐栢觀其碑崔尚文韓擇木八分書王屋山陽臺觀司馬子微所居開元中御書額𫝊云上自題額集賢注記開元二十六年十二月御書開元觀寺額令集賢搨以賜諸州天寳元年五月加天寳寺上改題姚崇碑𤣥宗御書張説銘云洒恩仙翰鏤澤豐珉帝令頻軫仙毫特紆鐫金刻石鳳篆龍圖又握乾符頌曰文含玉律字吐銀鈎明皇雜録拾遺蔡孚進龍池篇其詞甚美上為八分書賜岐王王因製龍池曲以其篇為樂章崔澄𫝊𤣥宗以謹宻字親書笏端王君􅎢𫝊詔張説刻文墓碑帝自書以寵之一行𫝊上為一行製碑文親書於石司馬子微𫝊𤣥宗為親製碑文𤣥宗題張説父碑額曰積善謝表曰孔篆吳札之墳鳳書旌墓御書盧懐慎碑題韓思復碑曰有唐忠孝韓長山大相國寺先天中御書題榜孝經序冩之琬琰庶有補於將来五色牋八分書學士賛御書刺史詩三傑詩並見上手寫六條見六典開元以降御題碑榜標桐栢以尊道掲麗正以崇儒顔真卿請肅宗題放生池碑額徳宗貞元四年八月御書章敬寺額順宗善𨽻書穆宗問栁公權筆法對曰心正則筆正帝悟其以筆諫宣宗御筆題崔氏徳星堂僖宗光啓元年書孫氏書樓帝中第一王僧䖍對齊髙帝五色絲綸九霄雨露符載舞鳳回翔於懐袖飛龍顧盼於縑緗元稹謝御札唐明皇書道徳經祥符三年十月己巳王貽慶獻明皇所書道徳經九域志亳州有道徳經碑明皇書開元間書六大字賜醴陵縣登真宮太宗時取閲而還之又賜御書飛白字張説謝示金字八分道經曰天毫發彩太平興國三年正月丁酉潭州輦送唐𤣥宗所書道林寺王喬觀二碑揚子曰聖人肆筆而成書漢元帝善史書應劭注史籕大篆宋高祖縱筆為大字一字徑尺一紙不過六七字章帝好杜度草書因名章草章帝賜韓稜寳劍自手書其名後漢姜肱傳注引謝承書靈帝手筆下詔魏楊阜傳天子感其忠言手筆詔荅梁武帝評書從漢末至梁有三十四人建隆御札三年二月二十三日内出御札曰渇聴讜言庶臻治道令朝臣以次轉對太祖御書大宋一統賜王溥乾徳親郊御札元年八月一日庚辰朔内出御札以十一月十六日甲子有事南郊開寳五年八月李符為京西轉運書李符到彼似朕親行賜之掲于大旗符條奏便宜百餘其四十八事施行著于令紹興十六年四月十四日修武郎張燕上太祖御書一卷賜帛洪适進太祖御筆六卷親征澤潞有賜孝明皇后御札天禧四年二月光禄丞沈惟温故相倫之孫獻太祖與倫御書十六日賜進士出身宣和四年三月五日幸祕省上親出建隆真跡詩帖數幅於是羣臣始識藝祖書又出太宗真仁宗翰墨至神考書孟子章句上曰此藩邸所作也雍熈草書雍熈二年出御草書謂宋琪曰朕聴政之外未嘗晝寢讀書寫字自得其趣正書之外草書飛白尤愛臨學雖非帝王事業但遊畋聲樂性所不好宫中釋悶惟書籍筆札而已琪曰陛下躬親庶務固前代所未有又讀書染翰無有棄日信聖心務學之至也嘗夜召書學葛湍問徐􅉗草書如何湍曰鉉留心籕篆不聞草聖上曰鉉嘗見朕書否湍曰臣僚非詔賜無由得觀上喜於軸中出御草書二紙曰一以賜汝一以賜􅉗太宗實録興國中王著習羲獻草𨽻擢為侍書趙壹曰草書之興其於近古乎書斷曰草書之先因於起草杜伯度章帝所好作章草書雍熈賜近臣詩草書扇雍熈二年五月癸亥賜近臣御製五言詩草書扇各一又草書李白廬山瀑布詩共二十幅分賜之摛藻尺素之上弄翰團扇之中雍熈賜宰臣飛白書雍熈三年十月丙申朔上出飛白書一軸賜宰臣李昉等曰朕退朝之暇未嘗虛度光隂觀書之外嘗留意於真草近又學飛白書此雖非帝王事業然不猶愈於遊畋聲樂乎昉等頓首謝雍熈書六韜兵法平戎陣圖雍熈四年五月以北方未服召北面諸將田重進潘美崔翰及殿前劉延翰對于便殿上訪以禦戎備邉之䇿延翰曰臣等皆鷹犬之才奉指蹤之命猶懼不給破虜之䇿惟聖心裁處上因手書六韜兵法將有五才十過之説以賜之庚寅又内出平戎陣圖指畫卷舒進退號令出没以賜端拱書急就章賦魏丕以黄州刺史来朝召對便坐太宗賜以御書急就章朱邸集端拱二年七月丙戌以御書急就章藏於祕閣急就章者漢黄門令史游之所作也帝留心字學先是下詔求前賢墨跡有以鍾繇書急就章為獻字多踳駁上親草書一本藏於秘閣仍刻石分賜近臣太宗實録起居舍人宋惟幹獻御草書急就章賦太宗命以一軸賜之淳化秘閣御書十二部御書淳化元年七月内降御草書詩十首故實二紙又出御製四十一卷藏於祕閣太宗嘗書於龍鳳花牋上及紈扇上以賜王公近臣嘗出飛白書四字占四幅廣袤數尺先以一幅賜宰臣吕端俄而樞宻趙鎔相繼進帝曰昔聞劉洎登牀信有之矣上筆法英異學無不成親製真定王趙普碑并御八分書篆額多士稱為三絶題相國寺及上清宫額筆力精宻曉書法者皆歆服有趙州隆平簿王著唐相方慶之後善行草書興國七年六月甲戌以為翰林侍書始置御書院善嘗遣中使王仁睿持御札示著曰未盡也上臨學益勤又示著著荅如初久之復示之著曰功至矣非臣所能及仁睿問其故著曰帝王始學書或驟稱善則不復留心矣祥符元年二月戊戌真宗語其事以為善規益又選趙闕七人待詔翰林故有三體書八分草行故事六十三卷兩韻詩十卷草書急就章二卷千字文二卷孝經一卷賞花釣魚詩一卷雜草書五十三卷飛白六十九卷八分千文二卷行書秘閣賛三卷五體書四體書各一卷合二百九卷為十二部藏秘閣淳化書紅綾扇飛白書淳化元年四月辛亥上親草書飛白書紅綾扇賜宰相樞宻使翰林學士尚書丞郎兩省給舍以上各一三年五月丁酉上親草書紅綾扇賜宰相李昉等各一五年五月戊寅賜近臣御飛白書各一軸庚辰初伏上親書紅綾扇賜近臣各一一本云三年三月甲午朔文徳殿百官入朝上親書綾扇賜近臣李昉等王元之謝賜御書紅綾扇上草書趙嘏絶句詩表曰絳綃半幅霞舒舞鵠之紋宸翰三行雲遶回鸞之勢宫中刀尺翦雲霧於赤城筆下風雷走龍蛇於碧落堪咲二王非墨妙筆精之作如逄伯禹得金簡玉字之書太宗又嘗草書紈扇作古詩賜諸將王昭逺等言多比諷又賜何承矩御書前後凡五十餘軸又面付手札寵之又嘗賜戴興以玉篇唐韻御飛白書三十卷張洎謝賜八分表曰念次仲之遺範采元帝之名家古文變體之後唯此書并大小篆與時偕行况仙毫揮洒體偹剛柔犀利譬長劒之倚天壯觀類洪河之紀地潤澤如春雲之出岫明媚若曉漢之横空祥符元年二月戊戌王欽若曰近日四方之人工習筆札由太宗精書翰所致五代有朝體書絶無楷法今則盡學鍾王歐栁之蹟矣上曰太宗筆法夐出今古淳化新校御書聖翰讃淳化二年閏二月戊寅秘書監李至進新校御書三百八十卷上從容謂之曰人之嗜好不可不謹人君當淡然無欲勿使嗜好形見於外則奸佞無自入焉朕他無所欲但喜讀書多見古今成敗善者從之不善者改之至拜舞稱賀四年閏十月二十四日右諫議大夫張佖獻聖翰讃及以行草篆書寫御製詩詔除史館脩撰淳化賜飛白玉堂書三體書賜詩四體書淳化二年十月辛巳翰林承㫖蘇易簡獻續翰林志二卷詔藏於史館仍賜御書二章以寵之批紙尾云意美卿居清華之地也又飛白玉堂之署四字以賜易簡因謂宰相曰易簡告朕求此數字可召至中書授之他日為翰林中美事因賜李昉等草書各一幅作真草行三體凡五十一字十一月戊午易簡上言願以上所賜詩刻石上為真草行三體書各一本命待詔吳文賞模勒刻石以賜易簡仍以百本分賜近臣十二月己夘易簡受詔以上三體書石本遺秘書監李至等三館學士凡二十五人皆上表稱賀范杲獻玉堂記辛夘易簡於本院㑹學士韓丕畢士安李至楊徽之梁周翰柴成務吕佐之錢若水王旦潘慎修王著吕文仲等觀御飛白玉堂之署四字并三體書詩石上聞之賜上尊酒大官設盛饌至等各賦詩以紀其事宰臣李昉等亦有詩易簡編次以聞上謂李昉曰易簡以卿等詩来上斯足以見儒墨之貴學士之榮也别録一本進入因以詩賜易簡其字以素繒書之徑二尺餘觀之曲盡神妙明道二年八月辛亥詔學士院以四字刻石景祐元年五月甲申學士院上石本賜待詔以下器幣至紹聖初翰林承㫖建言因命掇取玉堂二字掲之上牌日錫燕近臣識者謂不當以前代殿名皇朝寳札掲之於臣下止息之地紹興中御書玉堂二字賜周麟之見後徽宗御書摛文堂書目天聖四年錢惟演為飛白書叙録一卷首録太宗御書帝王名臣飛白以次編記又有禁林宴㑹集一卷淳化草書飛白賜近臣淳化二年草書飛白簇賜近臣上謂之曰夫欲學書當須澄神静慮具在筆端方臻其要飛白近少習者朕因得一古飛白障子倣而書之盡用筆之法古人書札之妙上聖之人有能窮其理是知筆札至難淳化飛白秘閣淳化三年五月甲寅詔増脩秘閣八月壬戌秘閣成帝作賛賜之秘書監李至上表引顔真卿題放生池碑額近翰林學承㫖蘇易簡乞御飛白玉堂之署為比乞御書新額以光秘府翌日戊辰詔中書樞宻院近臣觀新閣又賜上尊酒太官供膳是日遣中使齎御飛白書秘閣二字以賜李至李昉等相率稱謝退就宴三館學士預焉又賜御詩以美其事李至上表請以御製刻石詔賛并序朕為親書并篆額以旌秘府淳熈九年知福州汝愚得飛白秘閣字碑本於州治止戈堂知寧國府陳騤得御製書賛序碑本於昭亭山上之秘府如鳳之舞如龍之從如月蔽雲如旍卷風纎而不晦穠而不豐奇古迭出變通不窮淳化秘閣碑隂書孝經淳化三年十月癸亥以御書千字文遣中使李懐節付秘閣李至請於御製秘閣賛碑隂摹石上曰千字文盖梁武得鍾繇書破碑千餘字俾周興嗣次韻而成非垂世立教之言孝經百行之本朕當躬書勒之碑隂仍賜至以詔書諭㫖龜飾厥趺龍踠其顔孔言曽行炳丹青而燦星日淳化帝王名臣法帖四年四月先是求先賢墨跡擇其善者為歴代帝王名臣法帖十卷命工勒石丙戌賜近臣詳見小學帝王法帖始於漢章帝晉武帝書淳化八分書千字文淳化四年四月丙戌内出御八分書千字文賜宰臣李昉以下各一卷三年九月己未上草書千字文賜近臣各一本淳化書大言賦淳化四年八月丙辰朔上草書宋玉大言賦賜翰林承㫖蘇易簡易簡召近列同觀因擬宋玉作大言賦以獻其詞曰皇帝書自龍牋作大言賦賜玉堂臣易簡御筆煌煌聖詞洋洋瓌瑋特達不可備詳因伏而奏曰恨宋玉不與陛下同時帝曰噫何代無人焉卿為朕言之易簡因為大言賦曰聖人興兮告成功登崑崙兮展升中上覽賦嘉賞詔褒之又草書勸酒戒酒二詩賜之淳化書印紙淳化五年五月庚午十九日上臨軒親選郭玘等四人並為常參官仍給印紙令滿秩日自賫於御前較其課最戊寅上自書一幅曰公務刑政惠愛臨民奉法除奸方可書為勞績又别書二十餘幅賜大理正尹玘等人一通皆京朝官之選也召知審官院錢若水曰奉法除姦之語恐不曉者因而生事可語之曰除奸之要在乎奉法時被選者二十餘人而知榮州李虛已首預獻詩陳所以感遇之意八月庚寅帝批其紙尾曰虛己學古入官榮親事主奉書為郡知恩奉上欲布新規朕已得良二千石矣乃賜五品服命儒臣閲所批詔兼賜五十萬錢後卞衮通判宣州廉幹聞亦預焉四年七月飛白書向敏中張詠姓名付宰相曰此名臣也己酉並命為宻學御筆題殿柱曰真鹽鐡陳恕雍熙四年三月庚辰詔知州通判給御前印紙又見考課查道通判遂州出御書厯俾録其課給以實奉凌䇿通判定州賜御書厯淳化賜近臣飛白書至道淳化五年五月戊寅賜近臣飛白書各二軸十一月丙辰賜近臣御飛白書各一軸别賜參政寇準飛白草書十八軸先是宰相吕䝉正等皆已得賜準出使在外至是始及焉上因謂吕䝉正曰書札者六藝之一也固非帝王之事朕盖聴政之暇聊以自娯耳至道二年五月丙午上飛白書數幅以示近臣字皆廣袤盈尺先賜宰相吕端一幅侍臣因競前争取上曰劉洎登牀正如此矣六月甲戌上遣使賫飛白書二十軸賜端等人五軸又以四十軸藏於秘閣字皆方圓數尺端等詣便殿稱謝上謂之曰飛白依小草書體與𨽻書不同朕君臨天下復何事於筆硯乎中心好之不能輕棄嵗月既久遂盡其法焉實録暇日召翰林善書數十軰對便殿課習鍾王雜體淳化秘閣草書淳化五年六月己酉命内供奉官盧敏正賫御草書五軸藏祕閣詔史館脩撰張佖與三館祕閣學士觀焉至道書上清宫額至道元年正月丙辰新作上清宫成御書額以金填其字賜之車駕臨幸謂近臣曰造此祠宇為民祈福二年五月壬寅相國寺三門成上親書額金填字賜之至道草書經史故事至道元年六月戊戌上草書經史故事三十紙詔翰林侍讀吕文仲一一讀之因刻石以數百本并祕閣官吏姓名付内侍裴愈令於江東名山福地道宫佛廟各藏三五本或髙逸不仕純樸有行好古博雅為州里所稱者分以賜之㑹要先是六月乙酉遣裴愈往江南求圖籍淳化五年十一月丁夘令史館檢討前代宰相舉官故事上因書孫叔敖故事為一幅以賜吕䝉正䝉正等退而各舉所知祥符二年十月癸巳對輔臣崇政殿出太宗御書故事皆有監戒太宗御書曲禮見箴類咸平龍圖閣太宗御書目録見觀書至道三年六月乙未真宗詔以先帝御書墨跡賜天下名山勝境九月戊寅賜曲阜文宣王廟十一月癸未詔所藏太宗御書委官吏檢校景徳龍圖閣太宗御書咸平龍圖閣觀太宗草行飛白書見觀書類景徳校勘新寫御書元年三月丁酉直祕閣黄夷簡等上校勘新寫御書凡二萬四千一百六十二卷賜錢帛有差校勘官劉筠等六人授校理先是詔流内銓取選人内及第無過者以名聞命陳恕楊億試之凡七人於崇文院校勘太官供膳踰年乃畢而有是命當入校書類景徳大清樓觀太宗聖製御書天禧附四年三月乙巳七日召輔臣對於苑中水閣臨池垂釣又登太清樓命内臣啓扃鑰觀太宗聖製御書及新寫四部羣書上親執目録令黄門舉其書示之總太宗聖製詩及故事墨迹三百七十五卷文章九十二卷經庫二千九百十五卷史庫七千二百四十五卷子庫八千五百七十一卷集庫五千三百六十一卷四部書共二萬五千百九十二卷長編太清樓藏太宗御製及墨迹石本九百三十四卷軸四部羣書二萬三千七百二十五卷與此不同其後羣書増及一萬一千二百九十三卷太宗御集御書又七百五十三卷祥符太宗御札祥符三年四月己酉内出太宗御札二十六卷示輔臣皆上在宫邸時所賜令録付修國史院六月己亥内出太宗賜吕端上官正手詔付修國史院祥符内出太宗御書御製二年十月癸巳内出太宗聖製歌詩御書故事皆有鑒戒對輔臣崇政殿西廡示王旦等曰此先帝朱才人所藏近者上進十一月甲寅遣使以太宗御製御書各六十二卷賜輔臣人一本皆未嘗朌於外者後數日又出太宗鏤文紅管筆三年十二月以太宗御書一百軸賜交州李公藴從其請也祥符太宗鏤文紅管筆祥符二年十一月丁巳内出太宗鏤文紅管供御筆十二管分賜王旦以下人一雙因謂王旦等曰先帝聴政之暇常以觀書及攻筆法為意每見諸家字體精妙無不學者學之必成旦等曰先帝筆法英異非人臣所及如侍書王著有名於時然望先帝甚逺上曰著於侍書待詔中善規益亦無其比朕頃在東宫侍先帝嘗見學鍾繇書或至夜分或自夙興手不釋筆㑹要祥符國子監御書閣五年九月辛巳國子監請建閣奉藏太宗御書從之明年五月辛丑閣有赤光上燭六月己巳閣上梁命近臣臨觀帝作七言詩賜之又賜二帝御集御書摹本詔王曽記之㑹要祥符七年三月文武百官表請赴國子監觀太宗御製御書及聖製御書刻石從之先是帝以太宗御製御書并帝所製祥瑞論勤政論俗吏辨為君難為臣不易論崇儒術論五篇藏于國子監監之官屬乞建閣以安之又輔臣言乞以聖製刻石于閣下至是始成因求觀長編七年四月己巳羣臣詣國子監觀太宗御書及新刻御製辯論遂宴本監寳軸星繁翠珉玉立羲爻文繇世異重熙舜典禹謨事殊繼志祥符太宗御書法帖賜筆五年十一月丙辰内出新編太宗皇帝御集及御書法帖凡十五部總三百三十六卷示輔臣上曰太宗學由天縱屬思援翰必極精妙王旦曰以文章化人成俗由太宗始也五代以来筆札無體鍾王之法幾絶太宗留意翰墨斷行片簡𫝊之於外則争求之自是學者書體丕變聖教之至也上曰太宗所用筆亦與人間不同顧向敏中丁謂曰卿等未嘗見咸再拜陳乞翌日命賜之人一雙太宗御草孝經一卷刻石秘閣法帖十二卷小字法帖一卷古詩一卷倣鍾繇書一卷草書筆法一卷草書故事急就千文等為卷軸三十一八分書故事千文為卷二飛白書為軸者七四體書五體書大字各一卷已上刻石御書院墨蹟雜書四千八百九十四卷冊御製四千十六卷冊古詩故事墨蹟一千六百七十一卷雜書扇百三十六刻石雜書八百十八卷御製七百九十三卷古詩故事刻石雜書四百五十二軸分藏於龍圖閣太清樓祕閣御書院刻石雜書三百四十七卷七百五十三軸賜名山寺觀中外臣僚并兖州文宣王廟祥符先猷殿太宗皇帝御書天禧天章閣御書祥符八年四月丁夘詔玉清昭應宫奉安太宗御製御書殿名先猷其御製御書殿名繼文即迎禧迎祥殿天禧二年正月壬寅具鈞容清衛樂奉安太宗文集于先猷殿翌日奉御集安于繼文殿五年三月召輔臣觀御書于龍圖閣四月以御書石本為九十編藏天章閣祥符景靈宫御書七年七月二十八日輔臣請御書真逰殿額從之九年四月丁丑御書景靈宫天興殿保寧閣己亥有司奉御書兖州景靈宫太極觀額上作七言詩紫殿琳庭琅函緑藴玉海卷三十三
