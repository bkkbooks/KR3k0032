為秦州防禦使知宗正寺癸巳王獵為宗正寺伴讀元豐改制掌修牒譜圗籍丞初除趙君錫主簿初除楊全六年詔長二不專用國姓蓋自有大宗正司以統皇族崇寧三年詔提舉諸宫學紹興五年復置寺宗正不除卿常以亞列署寺事大理國朝以朝官判寺建隆二年用尚書竇儀熙寧九年置大理獄官制行分斷刑治獄為左右司農國初有判寺熙寧三年以新法自司農講行始重其任官制改掌倉儲委積之政總苑囿庫務之事官屬凡五十倉二十有五草場十有二排岸司四園苑四紹興三年十一月庚戌復置太府國初有判寺但掌祠祭香幣及造量衡元豐改制始掌財貨出納貿易之事總局二十有四紹興三年五月戊午復置光祿舊以朝官判衛尉以下並同元豐改制有卿少分案五總局八元佑元年五月省太官令元祐初罷二年正月卿令鑠請復置衛尉總局十有三大僕總局十有二鴻臚總同文館至資聖宫院提點所十有三中興光祿併太常衛尉併兵部大僕併駕部鴻臚併禮部紹興二十三年二月丙子復光祿置丞一員二十五年十月庚辰復鴻臚朱端儒為少卿淳化元年四月丁未詔九寺三監國之羽儀其選郎官張洎吕端等為少卿監建隆少府監四年七月命左庶子楊格監修少府監法物少府監掌造門戟旌節祭玉法物及供祭器鑄印以朝官判元豐四年十一月五日詔鑄省臺等監印記凡六十三官制行總局四掌百工技巧乘輿服御之物祭祀朝會禮樂之器服皆有法式册寶符節度量權衡之制亦如之嘉祐都水監三年十一月己丑初置罷三司河渠司詔曰漢用平當領河隄劉向護都水皆名儒風迹可觀以吕景初判監楊佐同判孫琳王叔夏知丞事八年正月用龍圗直學士韓贄元豐改制使者一人丞二人外監丞一人總局五元祐四年七月乙亥復置外都水使者熙寧將作軍器監國初以朝官判監凡工匠之政隸三司修造案熙寧四年十一月二日以嘉慶院為將作監范子竒判向宗儒同判元豐改制總局九元祐元年三月十八日頒編修營造法建炎三年併工部紹興三年十二月己丑復置十一年四月置長二國初軍器四庫領於三司胄案熙寧六年六月己亥二十七日按唐令置軍器監兩制二人領之以吕惠卿曾孝寬判監續詔以西作坊置監十月朔命朱伯虎等以軍器付諸州為式元豐分案五總局五建炎併工部紹興三年十一月庚戌復置丞十一年置長二隆興元年七月二十六日省唯置一丞乾道五年四月復少監六年十一月復監器械之備詩人詠周工巧之精史氏美漢吳之犀渠魯之貝胄除戎之象著于羲易常德之戒載於周詩玉海卷一百二十四
