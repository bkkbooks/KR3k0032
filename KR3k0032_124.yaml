body:
  text: 玉海卷一百二十四宋王應麟撰官制九卿屬官寺監漢中尉執金吾表中尉秦官掌徼循京師曹參傳以中尉從漢王常功臣表唐厲陶舍丙猜靈朱進張平許盎以中尉韓周亞夫衛綰張歐程不識安國武太初元年更名執金吾應邵曰吾禦也掌執金革禦非常師古曰金吾鳥名主辟不祥天子出行職主先導以禦非常故執此鳥之象因以名官小崔豹古今注金吾棒也以銅為之黃金塗兩末禮司寇大賓客前王而辟鄭司農云若今時執金吾下至令尉奉引自太常至執金吾秩皆二千石中尉髙元年職志周昌始為之至王偉執金吾武天漢二年杜周始為之止王駿任馮奉世辛慶忌蕭育千秋廉褒公孫祿髙祖功臣表蟲達從起碭至霸上為執金吾未詳當時為何官志執金吾一人中二千石漢官秩云比二千石掌宫外戒司非常水火之事月三繞行宫外及主兵器胡廣曰衛尉巡行宫中則金吾徼於外相為表裏以擒姦討猾吾猶禦也漢官曰員吏二十九人主緹騎緹騎二百人無秩比史食奉漢官曰輿服導從光滿道路羣僚之中斯最壯矣世祖至長安見金吾緹騎嘆曰仕宦當作執金吾隂識守執金吾常留鎮守京師委以禁兵所用掾吏簡用賢者吾冦恂朱浮馬防來歷為之永平元年劉般行執金事從至南陽建初中巡幸景秉常領禁兵宿衛左右馮魴宿衛南宫揚雄執金吾針張設武官以御冦賊如虎有牙如鷹有爪猛不可重任威不可獨行吾臣司金魏王朗奏曰西京執金吾從騎六百走卒倍焉漢執金吾屬官中司馬武庫令式道候表有兩丞楊僕為中尉丞志丞一人比千石漢官秩千六百石表有候司馬千人候及司馬及千人皆官名吾平紀元始二年九月戊申晦遣執金候陳茂假以鉦鼓募勇敢吏士夫季心為中司馬注中尉之司馬灌以千人與父俱屬官有中壘寺互武庫都船四令丞都船武庫有三丞中壘兩尉又式道左右中候及左右京輔都尉尉丞兵卒皆屬焉初寺互屬少府中屬主爵後屬中尉都船詔獄王嘉傳獄吏薛志中興省中壘寺互都船令丞尉武庫令杜欽為大將軍武庫令田千秋子為雒陽武庫令河間王弟上郡庫令良毋將隆諫以武庫兵送董賢表三丞志武庫令一人六百石主兵器丞一人晉屬衛尉德干戈省躬常立武式道候表式道左右中候候丞應邵曰式道凡三候車駕出還式道候持麾至宫門宮門乃開師古曰式表也若東方朔傳對曰譬若以宋萬為式道候注表道之候今武候引駕河東賦云衆神使式道志本有式道左右中候二人六百石車駕出掌在前清道還持麾至宫門宫門乃開中興但一人又不常置每出以郎兼事已罷不復屬執金吾西京雜記漢朝輿駕式道候二人駕一左右一人晉志中朝大駕鹵簿靜室令駕一中道式道候二人駕一分左右王融曲水序式道執殳御白龍魚服見困豫且一清道而後行清室而後出入罔遊于逸遊一豫為諸侯度左右京輔都尉志中興省虞延建武初仕執金吾府漢將作少府大匠表將作少府秦官掌治宗室周官匠人景帝中六年更名將作大匠許商蟜望謝堯為大匠恐文帝宫室苑囿無增罷露臺奉先帝宫室惟羞宣帝工匠咸精志大匠一人二千石漢儀曰位次河南尹光武中元二年省謁者領之章帝建初元年復置掌修作宗廟路寢宫室木土之功并樹桐梓之類列于道側任隗傳自建武以來大匠常謁者兼之至隗乃置真建初元年劉寵自會稽守為之竇融馬嚴魏霸趙典應順翟酺李固王堂張奮橋玄尹勳曹褒陳球孔融鄧豹永平三年夏詔以天旱敕大匠止作諸官減省不急將作謁者王吳顯宗詔修浚儀渠揚雄針侃侃將作經營宫室昔在帝世茅茨土階夏卑宫觀在彼溝洫桀作瑤臺紂為璇室人力不堪帝業不卒兩觀雉門魯以不恢秦築驪阿嬴姓以顛作臣司匠敢告執猷舜職命垂周官舉冬工慕唐虞之茅茨思夏后之卑宫事少皥五雉虞共中庸九經日省月試既稟稱以勸百工美上棟下宇取大壯改奢即儉合斯干為之者勞居之者逸漢將作屬官木工表有兩丞左右中候屬官有石庫東園主章左右前後中校七令丞如淳曰章謂大材也舊將作大匠主材吏名章曹掾又主章長丞掌凡大木武太初元年更名東園主章為木工堯有木工殷六工亦有之地理志云蜀嚴道有木官成陽朔三年省中候及左右前後中校五丞昭紀元鳯四年五月發中二千石將五校作治孝文廟正殿辛慶忌以父任為右校丞志丞一人六百石左校令六百石掌左工徒右校令六百石掌右工徒丞各一人安帝復安紀延光三年七月丁酉初復右校令左校丞官注中興末置今始復龎參拜左校令令度尚自右校為荆州刺史漢大長秋詹事見東宫官表詹事秦官掌皇后太子家又中長秋私府永巷倉廏祠祀食官令長丞諸宦官皆屬焉師古曰皆皇后之官成帝鴻嘉三年省詹事官并屬大長秋師古曰省皇后詹事總屬長秋長信詹事掌皇太后宫景中六年更名長信少府張晏曰以太后所居宫為名居長信宫則曰長信少府居長樂宫則曰長樂少府夏侯勝以尚書授太后遷長信少府夏侯堯貢禹薛廣德平當皆為長信少府平帝元始四年更名長樂少府章和二年五月和帝詔長樂少府桓郁侍講禁中將行秦官應邵曰皇后卿也景帝中六年更名大長秋師古曰秋者收成之時長者常久之義或用中人或用士人春官世婦每宫卿二人下大夫四中士八注皇后六宫漢始大長秋詹事中少府太僕亦用士人志大長秋一人二千石宫卿之位中興常用宦者職掌奉宣中宫命凡給賜宗親及宗親當謁見者關通之中宫出則從良賀為大長秋趙熹長秋長丞一人六百石良賀為丞中宫僕一人千石主馭太僕秩二千石中興省太減秩千石中宫謁者令一人六百石謁者三人四百石主報中章中宫尚書五人六百石主中文書私府令一人六百石主中藏幣帛諸物丁孚漢儀曰中宫藏府令秩千石儀比御府令丞一人永巷令一人六百石主宫人丞一人丁孚漢儀曰給事中宫侍郎六人比尚書郎宦者為之給事黃門四人比黃門侍郎給事羽林郎一人比羽林將長信長樂宫置少府一人職如長秋位在長秋上戴崇劉寬般李膺寬永樂少府長樂有衛尉僕為太僕皆二千石在少府上丁孚漢儀曰丞六百石漢水衡都尉表水衡都尉武帝元鼎二年初置掌上林苑應邵曰古上林之官曰衡掌諸池苑故稱水衡張晏曰主都水及上林苑故曰水衡主諸官故曰都有卒徒武事故曰尉師古曰衡平也主平其稅入元鼎二年張罷始為之終於成子淵班于定國馮奉世金敞辛茂伯王禹丙禹都趙充國為後將軍兼水衡如故遂龔遂自渤海召為尉議曹王生為水衡丞以褒顯水衡典上林禁苑共張宫館為宗廟取牲官職親近莽改曰豫虞平準書初大農管鹽鐵官布多置水衡欲以主鹽鐵及揚可告緡錢上林財物衆乃令水衡主上林五行以水為本水為凖平水至平端不傾心術如此象聖人紀宣帝本始二年春以水衡錢為平陵徙民起第宅注應邵曰水衡與少府皆天子私藏耳縣官公作當仰給司農今出水衡錢異政也初元元年九月詔水衡省肉食獸二年詔罷水衡禁囿人西都賦水衡虞修其營表志武帝初置秩比二千石别主上林苑有離宫燕休之處世祖省之并其職於少府每立秋貙劉之日暫置水衡都尉事訖乃罷之又省水衡屬官令長丞尉二十餘人都水屬郡國舜命益作虞以掌山澤太宰九職以虞衡作山澤之材又有林衡川衡越魏絳稱虞針以諷晉悼相如諫猛獸以戒漢武胡起於轂下而羌夷接軫搜如棠之諫斷罟之規方盤于遊田無逸所戒騶虞田以時文王之囿四十里芻蕘雉兔者往池元鼎元年九月詔山林澤之饒與民共之漢水衡屬官上林三官河隄使者謁者都尉表有五丞王生為丞屬官有上林見上均輸大農亦有均輸御羞如淳曰地名揚雄傳謂之御宿黃圖御羞宜春皆苑名師古曰長安城南御宿川也禁圃輯濯如淳曰船官漢官有擑擢丞鍾官主鑄錢官技巧六廏師古曰漢舊儀天子六廏技巧之徒供六廏者劉氏曰技巧六廏各一物蓋上林自有六廏辨銅如淳曰主分别銅之種類九官令丞又衡官水司空晉灼曰主囚徒都水農倉甘泉上林都水七官長丞皆屬焉劉氏曰都水官處處有之甘泉上林長是一官甘泉都水是一官自衡官以下凡六官言七者誤上林有八丞十二尉均輸四丞御羞兩丞都水三丞禁圃兩尉甘泉上林四丞成帝建始二年三月丙午省技巧六廏官初御羞上林衡官及鑄錢皆屬少府成帝建始元年正月罷上林詔獄漢舊儀主治苑中禽獸宫館事屬水衡上林三官鑄錢見後坐均輸鍾官辨銅三令主隗囂檄王莽曰民挾銅炭沒入鍾官注鑄錢之官溝洫志河決金堤河隄使者王延世使塞以竹落長四丈盛以小石兩船夾載而下之三十六日河隄成以五年為河平元年三月詔尉平當為騎都尉領河隄李尋為騎都使護河隄馮野王以故二千石使行河隄夫郭昌使行河地節中光祿大河隄都尉許商續志注舊河隄謁者世祖改以三府掾屬為謁者領之王景拜河隄謁者陳宣為河隄謁者崔子玉河隄謁者針伊昔鴻泉浩浩滔天有夏作空爰奠山川爰及周衰夏績陵遲使臣司水王道公正修明則百川理在百川沸騰咎卿士晉志漢東京省都水置河隄謁者魏因之及武帝省水衡置都水使者一人以河隄謁者為官屬江左省漢都水長丞三輔都水水官詳見河渠表太常大農少府水衡有都水長丞水衡又有甘泉上林都水長丞都水三丞京兆有都水長丞即內史左馮翊左都水長丞右扶風都水長丞劉向領護三輔都水護左都水使者臣向馮參領護左馮翊都水息夫躬領護三輔都水志都水屬郡國郡有都水官者置令長及丞有水池及魚利多者置水官主平水收漁稅唐六典注漢成帝以都水官多置左右使者各一人至哀帝罷之任延傳拜武威太守河西舊少雨澤乃為置水官吏修理溝渠皆蒙其利前地理志九江郡有陂官湖官南海郡中宿有洭浦官南郡編縣江夏郡西陵有雲夢官漢內史主爵都尉表內史周官秦因之掌治京師始於髙元年周苛景二年分置左右石慶為內史右朝錯公孫弘兒寬為左右鄭當時汲黯番係為元封中左內史咸宣王溫舒田內史稻租挈重武太初元年更名京兆尹京大兆衆忌始於無左內史更名左馮翊馮輔翊佐也始於殷周主爵都尉秦官掌列侯景中六年更名都尉始於景中五年不疑趙建元六年汲黯中朱買臣食其楊僕元狩武太初元年更名右扶風扶助風化也始於咸宣治內史右地與左馮翊京兆尹是為三輔秩二千石注服虔曰皆治在長安城中師古曰三輔黃圗云京兆在尚冠前街東入故中尉府馮翊在太上皇廟西入右扶風在夕隂街北入故主爵府長安以東為京兆長陵以北為左馮翊渭城以西為右扶風廣漢尹京延夀作翊翁歸承風風長安天子之都親承聖化教化原本俗樞機宜先正者也京兆尹屬官有長安市厨兩令丞又都水鐵官兩長丞馮翊屬官有廩犧令丞尉又左都水鐵官雲壘長安四市四長丞皆屬焉扶風屬官有掌蓄令丞尹翁歸傳豪強有論罪輸掌蓄官又有都水鐵官廏雍厨四長丞皆屬焉五畤在雍故有厨三輔皆有兩丞六百石列侯更屬大鴻臚元鼎四年更置三輔都尉都尉丞各一人元帝建昭三年夏令三輔都尉秩皆二千石中興省張宗傳建武六年都尉官省京輔趙廣漢治行尤異遷建王尊行尹事田仁蕭由武初張宗左輔蕭由右輔尹賞趙恢王欣陳欣晉九卿九卿禮秩梁十二卿志太常光祿勳衛尉太僕廷尉大鴻臚宗正大司農少府將作大匠太后三卿大長秋皆為列卿武紀太康四年六月增九卿禮秩列傳荀朂曰九寺可併於尚書九卿稱寺久