月二十五日御書夀康宫夀康之殿七字并臣御名恭書四字安先是紹熙五年十月三日改泰曰夀康紹興崇政垂拱殿紹興十二年十一月庚子十二日命内侍王晉錫作崇政垂拱二殿移諸司屋宇共一百四十七間時言者請復朔日視朝之禮而行宫止一殿故改作焉以杭州州治為行宫崇政以故射殿為之朔望則權置帳門以為文徳紫宸殿案射則以為選徳策士則以為集英垂拱以故内諸司地為之在皇城司北二十八年九月甲子重修朝射垂拱三殿成崇政垂拱二殿其修廣僅如大郡之設㕔淳熈再修亦循其舊每殿為屋五間十二架修六丈廣八丈四尺殿南簷屋三間修一丈五尺廣亦如之兩朶殿各二間東西廊各二十間南廊九間其中為殿門三間六架修三丈廣四丈六尺殿後擁舎七間孝宗因以為延和殿蓋卑宫室之意寢殿仍舊謂之福寧苑中亭殿名稱可見者僅有復古殿損齋觀堂芙蓉閣翠寒堂清華閣羅木堂隠岫澄碧倚桂隠秀碧琳堂之類紹興四年八月壬寅知臨安府梁汝嘉奏明堂行禮殿成九月辛酉祀明堂紹興穆清殿見皇后册禮東京延福宫有是殿紹興欽先孝思殿内中神御殿東都有之紹興十五年秋始創於崇政殿之東凡朔望節序生辰酌獻行香用家人禮紹興純福殿紹興二十六年六月丁亥作皇帝本命殿於萬夀觀依在京以純福為名隆興康夀殿見御詩類德夀宫太上皇帝曰徳夀殿太上皇后曰康夀殿淳熙選徳殿又見屏障類孝宗皇帝構便殿於禁垣之東名曰選徳乾道初作是殿一云淳熙初作射殿謂之選徳當考規模樸壯為陛一級中設漆屏書郡國守相名氏羣臣有圖方畧来上可采者棲之壁以備觀覽數延文武講論治道詢求民隠至於中外奏報若軍國㡬務皆於此省決暇則紬繹經傳或親御弧矢雖大寒暑不廢因命周必大為之記畧云勝負之爭而揖遜之寓勇力之尚而仁義之貴閑邪安於真積習慣同於自然可以興賢能可以詢衆庶合兵民於已判同文武之異轍將於是乎在殿不主乎射也而託名焉射不専於覿武也而尚徳焉治有先後功在不舎沈剛克時乃天道淳熈戊戌五年閏六月十四日進呈於倚桂殿九月五日令冩進欲刻之石盖留禁中八十日往往黏置屏間十一月二十五日召必大至選徳殿訓諭欲以御書寵示尋遣中使賜白居易七徳舞七徳歌一軸乾道元年五月三日詔執政毎日暮召入東華門詣選徳殿奏事上欲從容論治故也三年正月丙寅洪邁對是殿論古今治亂及祖宗以仁守天下紀綱法度後世有以持循者且謂邁曰此殿朕即位後所作也命名之㫖雖取選射觀徳之義周有射朝唐有觀徳殿然退朝之餘嚴號施令圖事揆策無不在是取尚書通鑑孜孜讀之法其興戒其壊口誦心惟未嘗一日去手近侍外臣畫接夕訪大廷㢘陛之儀一切畧去紬繹政理從容問荅頗有漢宣室唐浴殿遺意至於騶虞時㑹抗志決拾以弛張文武之道特其一事耳因命邁為之記二月庚午撰記曰成天下之事莫大於至勤洞天下之理莫大於至明陛下天縦之聖經之以至勤緯之以至明公卿已下有外朝之覲延英之對金華之講而又朝斯夕斯舜好問察言禹之惜寸隂文王之日昃不遑食皆已匹休伉美然自强不息願陛下以今日之心為心云云記凡九百四字五年十一月五日選徳殿出用人論示宰相俊卿等七年二月七日御選徳殿宣示立皇太子御札宰臣允文再拜賀淳熙四年九月選徳殿觀擊毬淳熙延和殿淳熙八年秋改後殿擁舍為别殿取舊名謂之延和至今因之孝宗作敬天之圖闢延和之殿躬講讀之勤設遺補之官淳熙六年六月後殿上梁文云聽朝决事兼汴都延和崇政之名論道談經殆炎漢虎觀金華之比紹興中禁中營祥曦福寧等殿苑中有澄碧觀堂凌虚閣等福寧殿側有清暑樓澄碧殿淳熈四年九月丙辰宣召侍讀史浩錫宴澄碧殿抵莫送以金蓮燭宿玉堂直廬上命作詩叙此㑹浩進古詩三十韻上御製俯同其韻二年五月辛夘宴輔臣澄碧寳慶慈眀殿恭聖楊太后所居紹定緝熙殿紹定五年十一月二十七日御製敬天命法祖宗事親齊家而下凡四十八條御札十二軸詔講讀說書官撰箴辭明年六月甲午緝熙殿成御書緝熙二字牓之親為記文以所製箴辭親洒宸翰列殿上備覽觀便殿名膺福厯代殿名六國甘泉秦温眀趙前漢昭陽眀光清凉宣明神仙長年金華白虎麒麟合歡曽城安處常寧椒風披香蘭林蕙草曹參三雲雲光天梁温調昆徳長樂林光鳳凰鵷鸞鳴鸞宣室含徳承眀臨華猗蘭蔬圃飛羽飛翔銅柱延休靈光光明大夏獲福長秋臯門廣陽永寧永夀朱雀朱鳥飛雨飛雲鴛鴦漸臺永延釣臺蕭何韓信椒房宣徳通光髙明後漢崇徳徳陽含徳天徳宣明温飾迎春夀安永寧雲臺和歡安福嘉徳章臺章徳宣室建章甘泉萬嵗温徳温明玉堂承福陽安宣徳華光蔬圃黄龍文昌銅馬敬法崇光雲氣前魏文昌温房梁室永寧安昌臨圃百子承光永始嘉福九華式乾芙蓉太極建始景福昭陽九龍西晉含章崇賢太極顯陽文明徽音明光仁夀式乾暉章建始言思百福章華嘉福宣光修明嘉樂芙蓉章陽清暑芳徳靈雲承光永寧景福延休九華百子虞泉青冥安昌靈圃陽春百兒後魏光明宣光嘉福建始九龍永寧光極景陽清暑清凉太華神徳式乾顯陽眀光萬夀乾安文昌天文代下同天華紫極昭陽永安安樂廣徳太和安昌永樂遊觀六合靈泉乾象景羲鑒玄經武太極代登鸞後周延夀正武大武大徳上善崇信㑹義含仁雲和思齊太極天徳麟趾隋乾陽光福儀鸞武成仁風紫微文成武安大業永安徽猷大儀桂華弘徽流盃觀文安福合歡翠華臨華光璧香風凝華澄華紫鱗含涼仁智澄光瑶光凝芳巢鸞成務大順文華景華和春顯仁明徳大寳仁夀大興修文含景清暑翔螭水殿浮景水殿成象凝暉崇徳觀