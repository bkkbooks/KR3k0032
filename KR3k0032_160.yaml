政殿元祐三年試於集英殿咸平元年二月己亥召崔頤正講尚書於景福殿志云正月講於廣福殿志宫後有崇政殿閲事之所也太平興國文徳殿文明殿後唐曰端眀國初改文眀太平興國九年五月丁丑殿災七月壬子改今名即正衙殿一本云乾徳三年八月文明殿成雍熙元年七月改為文徳殿殿志右昇龍門西北偏正衙曰文徳太祖時元朔亦御此殿其後常陳入閤儀如大慶殿饗明堂恭謝天地即齊於殿之後閤熙寧以後月朔視朝御此殿殿庭東南隅有鼓樓其下漏室西南隅鐘鼓殿兩挾有東上西上閤門東西兩廊門曰左右嘉福南門曰長慶北門曰嘉肅東西門曰左右勤政淳化中張洎奏今之文徳殿即唐之宣政在周為中朝在漢為前殿在唐為正衙凡朔望起居大册拜對四夷君長試制舉人皆在此眀道元年八月壬戌修文徳殿成熙寧四年八月髙麗使金悌等見於文徳殿乾徳三年冬至四年正旦皆受朝賀於文徳殿天聖二年十一月文徳殿上皇太后尊號治平二年熙寧二年元祐二年崇寧二年發皇太后册寳於文徳殿發中宫册寳亦於文徳殿熈寧三年宋敏求言本朝惟入閤乃御文徳殿視朝乾徳四年文明殿入閤淳化二年文徳殿入閤三年咸平二年祥符三年皆御文徳殿入閤憲張洎謂文徳殿正衙為上閣非度也今既不用入閤儀欲約唐制宣政殿定朔望御文徳殿儀以備正衙視朝之制詔定儀注元豐四年五月十九日御文徳殿視朝太平興國五年正月庚寅改端眀殿學士為文明殿學士以程羽為之自李昉後不復除以殿命官縁麟趾之舊文明學士位樞副之下明道二年置端眀殿學士與文明之職並存而班差降南史梁文徳殿置學士省召髙才碩學待詔袁峻直文徳學士省唐有文明殿太宗清心殿宣明殿太宗於禁中建清心殿藏圖籍以資游覽視朝之暇日讀太平御覽三卷有蒼鸛飛止殿之鴟尾逮掩卷而去翌日語侍臣宰相宋琪曰好學所感也太宗又創宣明射殿真宗清心殿奉道之所雍熙玉華殿雍熙三年十二月一日乙未雨雪帝御玉華殿集英殿後需雲殿舊曰玉華召宰臣謂曰云云又出御製雪詩令侍臣屬和熙寧四年後苑作玉華殿七年玉華殿後作山亭祥鸞閣基春殿志後苑東門曰宣和苑内有崇聖殿太清樓其西又有宜聖玉宸金華西凉清心殿翔鸞儀鳳二閣華景芳瑶津亭咸平嘉慶殿嘉瑞殿咸平初明徳太后居嘉慶殿後徙萬安宫明肅皇后所居殿曰㑹慶慶夀莘徳寳慈姒徽殿並見前真宗時以瑞蓮生龍翔池於其側立嘉瑞殿景徳資政殿崇和殿在龍圖閣之東序景徳二年四月癸夘以參政王欽若為資政殿學士特置是職以寵之位在翰林學士之下侍讀學士之上五月庚戌欽若赴職宴近臣於秘閣賜七言詩自是令寓直於秘閣十二月辛巳以欽若為資政殿大學士班在文明殿學士之下翰林學士承旨之上己丑賜㑹秘閣咸平五年十月十七日觀書龍圖閣幸崇和殿殿之後閣悉藏本朝名臣文集次御資政殿殿壁有楊相如政要論帝作七言詩侍臣皆賦景徳二年五月宴近臣於資政殿餞种放祥符三年八月八日甲寅觀書龍圖閣觀瑞物於崇和殿遂宴資政殿帝作七言詩從臣皆賦五年十二月十四日閲書龍圗閣幸資政殿帝作七言詩天禧四年十一月十一日御龍圖閣詔近臣觀書宴於資政殿崇和殿亦在龍圖閣東序咸平四年十一月二十日丁亥御龍圖閣曲宴移御崇和殿閲張去華所著元元論國田圖景徳二年四月二十一日幸龍圗閣閲太宗御書宴於崇和殿帝作五言詩四年九月七日宴近臣於龍圖閣之崇和殿餞侍講邢昺賜詩以寵行命羣臣咸賦祥符三年觀瑞物見上十一月壬辰召向敏中等對是殿陳従易等賦詩景徳玉宸殿眀道化成殿景徳四年三月乙巳召近臣觀書太清樓因至於玉宸殿殿在樓之東殿在苑中密邇宫禁即上偃息之所茵幃皆黄絹為之無文采之飾聚書八千餘卷上曰此唯正經正史累校定者小説他書不置於此盖附近禁中最便觀覽國家搜訪圖書其數漸廣臣寮家有聚書朕先借其目參校所少併令抄補所得漸多今秘閣後即新衣庫若遷此庫以廣其地尢為佳事當喻劉承珪増葺之大中祥符四年十月甲辰召宰臣於山亭觀玉宸殿御製書籍記石上作詩王旦等皆賦七年三月乙未召近臣觀太宗聖文神筆於玉宸殿作觀書流杯詩羣臣皆賦六月晁逈等請以玉宸集五卷副本藏秘閣從之八年四月癸丑召輔臣觀書於玉宸殿吏部尚書王欽若陳堯叟等四人預焉始觀太宗御書移御别院觀御製皇帝王覇及良臣忠臣姦臣權臣等論遂臨軒賦詩九年二月癸夘召近臣於後苑翔鸞閣觀太宗御書及御製聖文神筆頌玉宸殿等記遂宴於玉宸殿殿在苑中宻邇宫禁帝優寵輔臣每大禮慶成従容一召至兩制皆預蓋特恩也三月四日召宗室觀書於玉宸殿天禧二年十月十一日庚子召近臣於玉宸殿觀刈占城稻三年三月十三日曲宴後苑登翔鸞閣觀太宗聖製又御儀鳳閣玉宸安福殿遂射於太清樓下作賞花釣魚詩四年七月觀内苑榖遂宴於玉宸殿十月詔皇太子宗室近臣赴玉宸殿翠芳亭觀稻賜宴眀道元年十月改玉宸殿曰化成殿四方貢珍果常貯此殿景祐四年五月御化成殿觀芝草帝作詩嘉祐三年三月丙子御化成殿觀角觝祥符泰山天貺祥符元年七月乙酉詔㤗山靈液亭北天書再降之地建殿以天貺為名先是六月丁酉六日臣欽若奏天書降於泰山十月壬子幸天貺殿十二月庚子命學士楊億撰碑祥符穆清殿崇聖殿嘉瑞殿祥符元年十月二十六日封禪禮畢宴百官卿監以上於穆清殿又祥符元年封禪十月戊申上齋於穆清殿又寳鼎縣行宫名曰奉祗前殿亦曰穆清祥符二年正月七日癸亥對宗室輔臣於後苑便殿賜衣帶器幣遂宴於崇聖殿以封禪慶成故也崇聖