body:
  text: 玉海卷一百六十宋王應麟撰宫室殿下唐麟徳殿舊紀髙宗上元元年九月辛亥百僚具新服上宴於麟徳殿殿在大明宮拾翠殿西徳宗貞元四年三月甲寅宴羣臣於麟徳殿設九部樂内出舞馬上賦詩一章羣臣屬和寧王憲傳眀皇天性順睦雖讒說亂其間而卒無以揺時有鶺鴒千數集麟徳殿廷木翔棲浹日左清道率府長史魏光乗作頌以為天子友悌之祥帝喜亦為作頌寧王尤謹畏未嘗干政而與人交帝益信重以書賜憲等曰魏文帝詩西山一何髙髙髙殊無極上有兩仙童不飲亦不食賜我一丸藥光曜有五色服之四五日身體生羽翼朕每言服藥而求羽翼寧如兄弟天生之羽翼乎陳思王之材足以經國文帝絶其朝謁卒使憂死魏祚未終司馬氏奪之豈神丸效邪虞舜捨象傲以親九族朕所歎慕也頃因餘暇選得神方云餌之必夀此藥願與兄弟共之偕至長齡於無極也㑹要貞元三年三月造㑹慶亭於麟徳殿前十年九月南詔使朝見於麟徳殿上所錫賚甚厚十二年二月己夘以寒食節御麟徳殿内宴於宰臣位後施漢名臣圖屏風仍題其嘉言美行於下又永隆二年太子初立宴麟徳殿長安元年日本使宴是殿貞元中東蠻三王入朝宴是殿詳見燕享類四月庚午上降誕日㑹沙門道士兼儒官討論三教於麟徳殿十四年二月戊午上自制中和樂舞百僚於麟徳殿觀新樂十六年正月南詔進奉聖樂舞御麟徳殿以閲之元和十年閱新作指南車記里鼓車於麟徳殿十三年二月詔六軍使創修麟徳殿之右廊上御麟徳殿對翰林學士張仲素段文昌沈傳師杜元穎文宗開成三年十一月庚午於麟徳殿召學士栁公權丁居晦對授居晦中丞開成四年正月御麟徳殿對入朝賀正南詔三十七人賜錦綵金銀帶衣服穆宗紀長慶元年二月乙亥觀樂於麟徳殿癸夘擊鞠於麟徳殿列傳韋渠牟貞元十二年四月庚午徳宗誕日召徐岱渠牟及佛老二師並對麟徳殿質問大趣渠牟有口辯雖於三家未究解然問荅鋒生帝聽之意動徐岱傳召岱及趙需許孟容韋渠牟講説張茂昭自義武來朝貞元二十年十月從容言河朔事召見麟徳殿賜良馬甲第器幣回紇徳宗時請和親詔使者見咸安公主於麟徳殿趙昌對麟徳殿杜悰召見麟徳殿李光顔平蔡召對麟徳殿賜予蕃渥田弘正元和十四年八月來朝對麟徳殿眷勞殊等引見僚佐將校二百餘人皆有班賜王智興文宗時入朝燕麟徳殿實録永貞元年六月丙申皇太子見四方使於麟徳殿西亭元和二年二月丁丑以寒食御麟徳殿宴宰臣杜佑等七年正月癸酉御麟徳殿宴南詔渤海䍧柯等使乙酉宴涇原節度使朱忠亮丁亥御麟徳殿宴南詔使九年二月己丑御麟徳殿召見渤海使宴賜十三年正月御麟徳殿對韓公武賜銀器繒錦及馬二月辛酉御麟徳殿宴回鶻南詔使乙亥御麟徳殿宴羣臣大合樂賜錦綵銀器九月癸巳御麟徳殿對吐蕃使十四年正月癸未宴回鶻使三月乙酉以齊魯初平宴百僚于麟徳殿宰臣裴度等舉觴獻夀七月甲申麟徳殿宴宣武節度韓弘八月丁夘麟徳殿宴魏博田弘正九月己亥麟徳殿宴親王穆宗元和十五年二月庚寅對新羅渤海朝貢使於麟徳殿宴賜九月辛酉御麟徳殿宴李光顔愬賜錦綵銀瓶盤衣馬戊辰對吐蕃使於麟徳殿宴賜長慶元年二月辛夘寒食御麟徳殿賜百僚宴二年正月壬子宴渤海使八月壬午宴吐蕃使十月壬子宴回紇使太和元年五月戊辰宴諸道端午使六年二月己丑寒食宴羣臣七年三月庚戌宴回鶻開成二年正月癸巳宴南詔渤海使並於麟徳殿兩京記金鑾西南曰長安殿長安北曰仙居殿仙居西北曰麟徳殿此殿三面故以三殿名東南西南有閣東西有樓内宴多於此大福殿在三殿北拾翠殿在大福殿東南案此麟徳殿在拾翠西大福南仙居西北又名三殿音訓在右銀臺門北漢有麒麟殿後周有麟趾殿招集學士考校圖籍唐三殿見上三殿者麟徳殿也一殿而有三面故名亦曰三院結隣鬱儀樓即三殿之東西廊也兩京新記西京大明宫中有麟徳殿三面玄宗與諸王近内臣宴多於此殿開元元年十二月丁酉以吐蕃遣大臣求和命有司引吐蕃使宴於三殿乾元二年十二月戊申宴蕃胡拓翔代宗寳應元年七月辛丑宴六軍將八月己酉宴奚契丹來朝大厯二年八月癸未宴李抱玉杜鴻漸劉晏衛伯玉三年五月戊午宴劒南陳鄭神策將士三千五百人六年十一月宴文單國王婆彌等二十五人十年八月乙亥宴宰臣至京兆尹十三年正月甲戌宴宰臣以下二月庚辰宴侍臣五品以上十四年二月壬辰燕百僚癸巳宴至徳已來勲臣子弟及藩邸舊臣子弟元和八年五月戊午宴回鶻使寳厯元年三月壬子宴百寮二年二月丁巳宴百官並於三殿肅宗於三殿觀樂憲宗嘗閲月不賜對李綘謂大臣持禄有詔眀日對三殿元祐十三年鳳翔節度李惟簡忠武節度司空光顔邠寧尚書釗來朝上為之燕三殿張百戯公卿侍臣咸與韓文開成二十年春於三殿對學士獻替記五年十二月㑹昌二年正月於三殿對南詔㑹要咸通三年奉鄭太后宴於三殿命翰林學士侍立結綺樓下傳杜審言有蓬萊三殿侍宴詩李庾西都賦啟九重開三殿齒羣官於次坐召公族於内宴唐集賢殿集仙殿張説傳帝召説與禮官學士置酒集仙殿開元十三年四月丙辰曰朕今與賢者樂於此當遂為集賢殿乃下制改麗正書院為集賢殿書院㑹要開元十三年四月五日因奏封禪儀注敕中書門下禮官學士等賜宴集仙殿上曰今與卿等賢才同宴於此宜改集仙殿為集賢殿麗正書院為集賢院乃下詔曰云云舊紀開元十三年四月丁巳云云同上改院内五品上為學士六品以下為直學士百官志永泰時勲臣罷節制無職事皆待制於集賢門凡十三人桓彥範傳時武后處迎仙官之集仙殿唐萬夀殿見夀星壇唐拾翠殿六典拾翠殿在大明宫杜甫詩賦詩拾翠殿佐酒望雲亭唐大同殿六典大同殿在興慶宫金明門之北舊紀天寳七載三月乙酉大同殿柱生玉芝有神光照殿八載六月大同殿又産玉芝一莖五行志天寳十載六月乙亥大同殿前鍾自鳴㑹要太和三年十月修南内大同殿及勤政樓眀光樓唐長生殿樂志玄宗幸驪山楊妃生日命張樂長生殿因奏新曲㑹要華清宫天寳元年十月辛丑造長生殿名為集仙臺以祀神張廷珪傳武后召見長生殿此殿東唐蓬萊殿六典大明宫有蓬萊殿兩京記蓬萊殿在紫宸殿北列傳李泌在蓬萊書院叚秀實大厯十三年來朝對蓬萊殿代宗問所以安邊者畫地以對許康佐文宗觀書蓬萊殿問康佐李訓春秋之義敬宗寳厯元年八月己丑蓬萊殿㑹沙門道士唐玉宸殿見玉宸宫調唐延英殿六典大眀宫宣政殿之左曰東上閤右曰西上閤次西曰延英門其内之左曰延英殿右曰含象殿按延英實在東内貞觀八年置永安宫明年曰大眀宮龍朔二年始大興葺曰蓬莱宫四月辛巳宫成獨是殿經始史缺嵗月㑹要上元二年七月甲辰延英殿御坐梁上生玉芝一莖三花上親製玉靈芝詩三章章八句按五行志係肅宗之上元韋述兩京記成於開元十年不書是殿至三十六年六典書成歴歴維見然則創於開元中歟兩京記不載而六典紀之開元中置可知楊瑒傳玄宗召對宰相議天下户版延英殿惟瑒户部侍郎言利病尤詳在封泰山前按六典㑹要延英在西上閤之西而李庾賦乃曰左閤當辰誤矣李庾西都賦東則左閤當辰延英耽耽宣徽洞達温室隅南接以重緜以少陽是為二宫複道邃廊㑹要穆宗元和十五年二月庚辰詔於西上閤門西廊右畔一作西廊内開便門以通宰臣自閤中赴延英路示優禮也則不在紫宸殿東矣六典所記為可信初有大明即有是殿召對大臣則始於代宗苗晉卿傳代宗立初即位十月庚申年老乞間日入政事堂帝優之為御小延英召對宰相對小延英自晉卿始代宗寶應元年九月壬午御延英殿㑹羣臣議政事自辰至午乃罷丙戌自辰至巳韓臯曰延英之置也肅宗以苗晉卿年老難步故設之耳宰相晉卿對延英羣臣初無許預之例韓臯為中丞有所陳必於紫宸上謂曰與卿言不盡可来延英與卿従容則是特許其對也貞元元年十二月詔延英視事日令常參官七人對政得失七年詔每御延英諸司官長奏本司事則百官許對延英矣薛珏傳徳宗疑下情不達因詔延英坐日許百司長官二員言缺失謂之廵對十八年詔有陳奏宜延英門請對勿令正衙奏事舊紀貞元七年十月癸丑詔毎御延英令諸司官長二人奏本司事尋又敕常參官毎一日二人引見訪以政事謂之廵對㑹要云訪以政事又引見常參官二人訪政道謂之次對官十八年七月敕比来百官奏事毎於正衙至於移時自今以後不須於正衙奏事如要陳奏事者並於延英進狀請對憲宗時元稹為拾遺乞於延英訪問舊紀元和元年四月壬戌武元衡請尚書省六品已上職事官東宫師傅賓詹王傅等每坐日令兩人待退朝於延英候對從之新紀云日二人待制四年御史臺奏延英開日羣臣不得前知遇坐時方進狀請對是開延英無定日文宗開成二年八月丙午望日御延英對刑法官又諫議馮定請許左右史従宰相至延英記所言故事兩省轉對延英獨常侍不與鄭畋為右散騎建言宜備顧問詔可遂著於令則羣臣亦得對矣大厯三年十月庚辰御延英殿見畿縣令貞元四年十月上召京兆諸縣令對延英訪以人之疾苦且慰勉之各賜衣一襲六年九月同文宗開成元年中書門下奏舊例刺史授官遇延英開日候對奏發日盖重理民之官欲觀去就察言語近日刺史進狀便辭自今刺史遇開延英即入陛辭二年楚州刺史蕭俶延英候辭則是外官亦得見辭也入朝而對者郭子儀大厯九年入朝對延英代宗與語吐蕃方彊慷慨流涕張建封貞元十三年十月丁丑以泗濠節度来朝帝不待日一云雙日召對召見延英眷遇異等時宫市為民患因間言之頗順聽還鎮帝賦詩以餞張茂昭元和二年一云五年冬自義武入朝至京師十二月十二日不待日雙日開延英對五刻罷故事雙日不坐裴度王師討蔡度視行營諸軍詔毋須宣政衙即對延英度自請督戰拜同平章事長慶二年四月由太原入朝帝曰朕當延英待卿帝以度勲徳故待以殊禮李吉甫元和六年召自淮南秉政入對延英凡五刻罷論政事李景畧對徳宗論奏衎衎有大臣風許孟容為給事中貞元十八年三月特開延英門召對樊澤召對延英徳宗歎其論兵與我意合崔珙為嶺南節度入對延英文宗訪問珙對有理趣鄭覃元和十五年十月穆宗詔閤中殊不欵欵後有為我言者見卿延英張仲方敬宗詔王播遣競渡舟三十艘仲方見延英論爭韋奥為京兆大中十年於延英問别賢佞陽城詣延英門論裴延齡伏閤不去救陸贄約拾遺王仲舒守延英殿閤上疏崔元亮鄭注陷宋申錫元亮率諫官叩延英苦諍獨孤郁元和四年十月戊子御延英對度支使李鄘京兆尹許孟容中丞李夷簡諫議孟簡給事中呂元膺穆質右補闕獨孤郁等皆言承璀不可統師郁言尤激切實録王質與諫官伏閤文宗開延英召見李景遜寳厯初命王播承恩奬李晟馬燧貞元五年九月見延英殿徳宗嘉其勲下詔圖凌烟閣九年十月燧對延英殿蘇弁徳宗召見延英賜金紫蔣乂貞元九年擢史館修撰徳宗重其職先召見延英乃命之崔芊貞元十六年五月召山人崔芊對延英穆賛徳宗對延英擢中丞韋渠牟延英奏事雖大臣率漏下二三刻止及渠牟為諫議大夫毎奏事五六刻乃罷徳宗武元衡中丞對延英徳宗目送之曰真宰相器李景儉澧州刺史延英奉辭穆宗詔為郎牛元翼長慶中見延英薛存慶劉總以幽州歸穆宗謂宰相曰必用存慶可以宣朕意對延英一刻遣之對宰臣自中葉以後雙日及非時大臣奏事别開延英楊綰對延英給扶李綘為相元和六年相九年罷嘗盛夏對延英帝汗浹衣綘欲趨出帝曰宫中所對唯宦官女子欲與卿講天下事乃甚樂也穆宗數遊畋綘扣延英切諫裴垍元和二年既相垍因奏引太宗躬勤聴覽以諷上嘉納之延英議政率漏下五六刻李吉甫元和七年七月己未御延英謂吉甫曰畋遊悉廢唯務讀書李徳裕與三宰相見延英而武宗赦嗣復珏韋處厚太和元年四月丙辰宰臣於延英既出再召處厚獨對一刻極論不能堅决之失請遜位牛僧孺太和六年延英召見宰相曰公等有意太平乎何道以致之僧孺曰太平亦無象楊嗣復建言延英殿對宰相乞録付史館若崔損延英進見不敢出一言竇參每對延英它相罷必留令狐綯奏事延英汗沾衣見御史李直方貞元十一年二月召見延英殿宴羣臣代宗寳應元年八月丁巳宴宰臣已下九月戊寅宴郭子儀等丙申宴回紇使永泰元年正月辛亥宴宰臣大厯八年十一月戊午宴宰臣子儀等開成元年十月慶成節宴㑹諸將代宗寳應元年十月雍王東討帝御延英殿大㑹南北軍諸將問以東征之事諫官叩延英穆宗時言不可罷裴度兵見上不御正殿則視朝延英貞元元年七月蝗八月甲子詔不御正殿奏事悉於延英丙寅視朝延英羣臣列位延英門外次對元和元年四月詔日令兩人待制退朝詣延英候對二年二月己巳停次對元和七年四月壬子開延英對宰臣八年六月辛巳朔以積雨延英門不開者十五日帝謂宰臣毎至三日雨亦對十年三月壬申朔御延英殿召對宰臣特以事召也十四年八月己未上謂宰臣曰今天下雖漸平尤須勤於政理若通休暇頻不坐有事即詣延英請對勿拘常制十月下元假召宰臣對於延英議邊事也㑹要憲宗初讀實録見貞觀開元故事竦慕不能釋卷自是延英議政晝漏率下五六刻方退舊史賛文宗即位鋭意於治毎延英對宰臣率漏下十一刻唐制天子隻日視朝乃命輟朝放朝皆用雙日本紀賛三大和元年月開成四年召宰相見延英退坐思政殿仇士良傳文宗坐延英論詩工否僖宗易延英名靈芝後復舊一云延英殿在大明宫東上元以來置宰相欲論事天子欲咨度皆非時召對旁無侍衛人得盡言相對有思政殿元和中建通典唐自上元以来置延英在上閤之東故李庾賦云東則左閤當辰延英耽耽唐六典云在上閤之西誤也長安志曰在紫宸殿東㑹要在紫宸殿西愚謂六典㑹要可信豈不愈於李庾洛陽亦有延英殿天祐元年詔毎月一五九開延英唐交泰殿㑹要天寳十載四月二十一日興慶宮造交泰殿成唐承暉殿㑹要元和十三年二月浚龍首池起承暉殿唐思政殿通鑑穆宗即位召學士段文昌薛放丁公著對於思政殿至夕乃出文宗開成四年坐思政殿召學士周墀㑹要長慶四年十二月髙重崔郾髙釴於思政殿中謝郾奏曰臣職侍講未嘗召問經義上賜錦綵銀器憲宗册文曰編書辨謗創殿思政則是殿憲宗所作歟延英相對有思政殿元和中建元稹云思政對學士往往宫官傳詔洛陽太極殿又名思政後梁改思政殿為金鑾殿唐寳慶殿㑹要穆宗元和十五年七月甲寅新作永安殿及寳慶殿大張樂九月戊申御宣和殿宴貴戚唐積慶殿蕭后傳武宗時徙居積慶殿號積慶太后開成五年十月徙居殿在興慶官唐雍和殿㑹要大中元年七月敕親親樓號雍和殿别造屋宇廊舎七百間通鑑大中元年八月上崇睦兄弟作雍和殿於十六宅數臨幸置酒作樂唐靈臺殿髙駢傳咸通中帝將復安南拜都䕶召還京師見靈臺殿梁金鑾殿文明殿朝元殿梁開平二年正月改思政殿為金鑾貞觀殿為文明含元殿為朝元西京洛陽乾化元年置金鑾殿大學士以敬翔為之本朝太平興國三年改金鑾六殿名後唐端明殿端明殿西京同光二年正月丁未改天成元年五月以馮道趙鳳為學士太平興國三年改為武德殿在延春殿北唐趙鳳為相奏事中興殿晉天福二年五月以汴州行闕為大寧宫劉昫以端明殿學士拜相入謝端明殿時以為榮建隆講武殿即崇政殿也建隆元年七月戊午宴韓令坤等於講武殿乾德三年九月己巳御殿閱諸道兵四年四月宴近臣八月乙卯錄囚開寶五年閏二月壬辰召進士安守亮等對于是殿始下詔放牓新制也六年三月庚午十九日覆試進士宋凖等於是殿八年二月戊辰試進士王嗣宗等於是殿三月二十九日召契丹使觀射於此十月己亥朔召瀘州守臣見於此興國二年正月戊辰三年九月甲申五年閏三月甲寅八年三月丙子皆試進士於此雍熙二年三月始試進士於崇政殿乾徳鑿池習戰太宗築臺大閲皆名講武西京亦有此殿景徳四年二月己巳次西京壬申宴從臣於講武殿燕朝穆清神心經緯四征九伐咸入睿算上延良平借箸運籌之謀下程賁育扛鼎掲旗之技沈㡬於樽俎之間收功於疆場之表後魏有經武殿後周有正武殿唐有戢武殿建隆萬春殿建隆元年九月辛丑宴近臣於萬春殿後九日又宴廣徳殿皆曲宴也二年閏三月丙戌宴令坤延釗於廣德殿節度使赴鎮錫宴自此始乾徳乾元殿崇元殿天安殿朝元殿景祐大慶殿梁曰崇元梁開平元年四月改正衙殿為崇元受建隆元年八月朔入閣二年正月五月朔朝於崇元乾徳四年四月庚戌重修一云二月十一日修改乾元太平興國九年五月殿災改朝元一本云雍熙元年七月壬子改為朝元興國九年即雍熙元年也大中祥符八年四月殿災六月己酉實録甲子改天安景祐元年正月一本作明道二年十二月甲寅改大慶殿九間挟各五間東西廊各六十間有龍墀沙墀正至朝㑹册尊號御此殿饗明堂恭謝天地即此殿行禮郊祀齋宿殿之後閣蓋正殿也淳化中張洎奏即