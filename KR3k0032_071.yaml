body:
  text: 玉海卷七十一宋王應麟撰禮儀元會文選注董仲舒䇿曰春秋之文正次王王次春春者天之所為正者王之所為三朝歲首朔日也谷永曰三朝之會周禮曰時見曰會漢元會儀朝會志晉志漢以高帝十月定秦且為歲首至武帝雖改用夏正然每月朔朝至於十月朔猶常饗會如元正儀宋禮志叔孫通傳載通所制漢元會儀綱紀粗舉施於今未備也魏黃初三年始奉璧朝賀何承天云魏元會儀無存者案何禎許都賦曰元正大饗壇彼西南旗幕峨峨簷宇弘深王沈正會賦曰華幄映於飛雲朱幕張于前庭亘青帷於兩階象紫極之峥嶸延百辟于和門等尊卑而奉璋此則大饗悉在城外不在宫內也案魏司空王朗奏事曰故事正月朔賀殿下設兩百華燈木於二階之間端門設庭燎火炬端門外設五尺三尺鐙月照星明雖夜猶晝如此則不在城外也何王二賦不在洛京王亦賦許昌正會也晉武帝世更定元會注今有咸寧注是也齊志漢末蔡雍立漢朝會志竟不就元會大饗四廂樂歌辭晉泰始五年太僕傅玄撰正旦大會行禮歌詩四章壽酒詩一章食舉東西廂樂十三章黃門郎張華作上壽食舉行禮詩十八章中書監荀朂侍郎成公綏言數各異齊檀超傳王儉議云朝會志前史不書蔡雍稱先師胡廣説漢舊儀此伯喈一家之意匡衡傳成帝初上疏諸侯正月朝覲天子觀以禮樂饗禮乃歸今正月初幸路寢臨朝賀置酒以饗萬方漢三朝會同班固東都賦春王三朝會同漢京是日也天子受四海之圖籍膺萬國之貢珍內撫諸夏外綏百蠻盛禮興樂供帳置乎雲龍之庭陳百僚而贊羣后究皇儀而展帝容庭實千品旨酒萬鍾列金罍班玉觴嘉珍御太牢饗食舉雍徹太師奏樂陳金石布絲竹鐘鼓鏗鏗管絃煜煜抗五聲極六律歌九功舞八佾韶武備泰古畢四夷間奏德廣所及僸佅兜離罔不俱集萬樂備百禮暨皇歡洽羣臣醉降煙煴調元氣撞鐘告罷百僚遂退張衡東京賦孟春元日羣后旁戾百僚師師于斯胥洎藩國奉聘要荒來質爾乃九賓重臚人列崇牙張鏞鼓設郎將司階虎戟交鎩龍輅充庭雲旗拂霓夏正三朝庭燎晢晢撞洪鐘伐靈鼓稱警蹕已下雕輦於東廂冠通天佩玉璽紆黃組要干將負斧扆次席紛純左右玉几穆穆而南面以聽矣然後百辟乃入司儀辨等尊卑以班璧羔皮帛之贄既奠天子乃以三揖之禮禮之穆穆焉皇皇焉濟濟焉將將焉信天下之壯觀也前樂志凡鼓十二朝賀置酒陳殿下應古兵法凡鼓八朝賀置酒陳前殿房中不應經法朝賀置酒為樂楚巴銚齊四會蔡齊謳皆鄭聲可罷漢德陽殿朝賀元會儀禮儀志嵗首為大朝受賀其儀夜漏未盡七刻鐘鳴受賀及贄公侯璧中二千石二千石羔千石六百石鴈四百石以下雉百官賀正月二千石以上上殿稱萬嵗舉觴御坐前司空奉羮大司農奉飯奏食舉樂百官受賜宴饗大作樂後漢先上壽次賜酒與叔孫儀不同注蔡質漢儀曰正月旦天子幸德陽殿臨軒公卿將大夫百官各陪朝賀蠻貊胡羌朝貢畢見屬部計吏皆升覲庭燎宗室諸劉雜會萬人以上太官賜食酒御史四人執法殿下虎賁羽林弧弓撮矢陛戟左右作九賓徹樂含利含利獸名即西京賦所云含利颬颬化為仙車驪駕四鹿芝蓋九葩從西方來戲於庭乃入激水化比目魚作霧鄣日化成黃龍炫曜日光樂畢作魚龍曼延小黃門吹三通謁者引公卿羣臣以次拜其每朔惟十月旦從故事者髙祖定秦之月元年嵗首也晉樂志鐸舞歌幡舞歌各一篇鼓舞伎六曲並陳於元會後漢正旦天子臨德陽殿受朝賀漢儀有正會禮見後列傳范升建武四年正月朝公卿大夫博士見於雲臺戴慿正旦朝賀帝令羣臣説經更相難詰義不通者奪席儒林虞延建武二十三年元正朝賀帝望而識延朱暉永平初正月朔旦東平王蒼當入賀故事少府給璧時隂就為少府驕不奉法蒼坐朝堂漏且盡求璧不可得暉望見少府主簿持璧即往紿之主簿以授暉顧召令史奉之就更以他璧朝鄭弘元和元年為太尉以舉將司空第五倫班在下每正朔朝見弘曲躬自卑帝置雲母屏隔其間帝紀明帝永平元年正月帝率公卿以下朝於原陵如元會儀安帝永初四年正月元日會徹樂不陳充庭車注每大朝會必陳乘輿法物車輦於庭魏文昌殿正會小會魏都賦置酒文昌高張宿設有客祁祁載華載裔岌岌冠縰纍纍辮髮清酟如濟濁醪如河凍醴流澌溫酎躍波豐肴衍衍行庖皤皤愔愔醧燕酣湑無譁延廣樂奏九成云云曹植有元會詩晉元會儀咸寧注元正宴會詩賦晉禮志五禮三曰賔蓋朝覲宗遇會同之制是也漢儀有正會禮正旦夜漏未盡七刻鐘鳴受賀公侯以下執贄來庭二千石以上升殿稱萬嵗然後作樂宴饗魏武帝都鄴正會文昌殿用漢儀設百華燈晉武帝更定元會儀咸寧注是也傅玄元會賦曰考夏后之遺訓綜殷周之典藝採秦漢之舊儀定元正之嘉會則兼採衆代可知矣咸寧注唐志咸寧起居注二十二卷先正一日宿設夜漏未盡十刻羣臣集庭燎起火七刻百官及受贄郎官至計吏皆入立其次陛衛如臨軒儀五刻羣臣就位定漏盡侍中奏外辦皇帝出鍾鼓作百官皆拜伏太常導皇帝升御坐大鴻臚跪奏請朝賀藩王奉白璧太尉中二千石等奉璧皮帛羔雁雉再拜賀禮訖以贄授贄郎太樂令奏雅樂乘黃令出車晝漏上六刻蠻夷以次入再拜謁者引王詣樽酌夀酒授侍中奉觴再拜四廂樂作乃行百官酒奏登歌進飯奏食舉樂乃召諸郡計吏前受敕戒於階下羣臣再拜出夜漏未盡七刻謂之晨賀畫漏上三刻更出百官奉夀酒謂之晝會别置女樂三十人於黃帳外奏房中之歌江左不復晨賀元會設白獸樽於殿庭樽蓋上施白獸有能獻直言者發樽飲酒乃杜舉之遺式為白獸示忌憚也宋志云白虎魏晉冬至日受方國及百僚稱賀因小會其儀亞於獻嵗之旦宋志云晉有其注樂志正旦大會上夀歌荀朂作冬至初嵗小會歌張華作成帝咸康七年尚書蔡謨奏八年正會儀注惟作鼓吹鍾鼓餘伎樂並不作北齊樂辭百華照曉千門洞晨懷黃綰白鵷成行傳王渾武帝常訪渾元會問郡國計吏方俗之宜云云熊逺建興初逺曰履端元日貢士雲集有識於是觀禮咸寧起居注十二月庚子詔正會日百僚賜醽酒晉起居注穆帝升平二年正月朔朝會賜醁醽酒唐志晉元正宴會詩集四卷伏滔哀豹謝靈運集傅玄賦又曰於是先期戒事衆發允敕萬國來享各以其職翼翼京邑巍巍紫極坐太極之正殿儼嵯峨以崔嵬羣后德讓獻贄奉璋前三朝之夜中庭燎晃以舒光華燈若乎火樹熾百枝之煌煌王沉正會賦曰華幄映乎飛雲兮朱幕張于前庭曜五旗於東序兮表雄虹而為旌備六代之象舞兮釐簫韶於九庭唐杜佑三朝上夀議漢故事上夀四會曲注言有鍾鼓無歌詩魏初有琴築又易古詩名曰羽觴行用為上夀曲晉代歌詩傅玄述具存晉太極殿大會晉起居注武帝太康元年詔江表初平於東堂小會作樂五月庚寅臨軒大會於太極殿成帝咸康六年依中興故事朔望聽政東堂摯虞決疑要注漢制會建始殿晉大會太極殿小會東堂燕之與會威儀不同會則隨五時朝服庭設金石縣虎賁著旄頭文衣鶡尾以列陛燕則服常服設絲竹之樂唯宿衛者列仗梁元會禮隋志梁元會之禮未明庭燎設文物充庭太階東置白獸樽羣臣並集皇帝服衮冕升坐王公升殿奉贄帝興入徙御坐于西壁下皇帝服通天冠升坐王公上壽大官進御酒主書賦黃甘逮二品以上尚書騶騎引計吏受詔侍中讀五條陳便宜者聽詣白獸樽北齊正日班五條詔書於羣國梁陳亦依禮唐太極殿受朝賀上壽壽尊志皇帝元正冬至受羣臣朝賀會前一日尚舍設御幄於太極殿有司設羣官次於東西朝堂展縣置桉陳車輿設解劒席列黃麾仗於殿庭羣官就次侍中奏中嚴羣官出次侍中奏外辦皇帝衮冕冬至服通天冠綘紗袍御輿出自西房即御坐符寶郎奉寶置前公王以下就位典儀曰再拜皆拜上公一人詣西階席脫舄解劒北面跪賀元正首祚景物惟新伏惟陛下與天同休冬至去天正長至伏惟陛下如日之升乃佩劔納舄復位制曰履新之慶與公等同之冬至云履長在位再拜舞蹈三稱萬嵗初羣臣將朝中書侍郎陳諸州鎮表給事中陳祥瑞按户部陳諸州貢物禮部陳諸蕃貢物冬至不奏祥瑞無諸方表其會則大樂令設登歌於殿上二舞入立於縣南尚舍設羣官升殿者坐又設解劔席尚食設壽尊於殿上東序之端西向設坫於尊南加爵一太官令設升殿者酒尊於東西廂近北設在庭羣官酒尊各於其座之南皆有坫羃俱障以帷羣官出次侍中奏外辦皇帝通天絳紗即御坐羣官就位侍中跪奏請延諸公王等升光祿卿請賜羣臣上壽上公詣酒尊所北面尚食酌會要舊制元日大陳設皇太子獻壽次上公獻壽次中書令奏諸州表黃門侍郎奏祥瑞户部尚書奏諸州貢表禮部尚書奏諸蕃貢表太史奏雲物侍中奏禮畢然後中書令又與供奉官獻壽殿上皆呼萬嵗按舊儀闕供奉官獻壽禮開元二十五年李林甫革其舊儀奏而行之冬至亦然永徽二年八月二十九日詔來月一日太極殿受朝後每五日一御太極殿視事朔望朝即永為常式開元八年九月敕正冬朝會宴見蕃國王臨軒設樂虡陳車輅備黃麾仗其朔日受朝儀注減半志設九部樂則去樂虡無警彈太樂令率九部伎於左右延明門外羣臣初唱萬嵗即引九部伎聲作而入各就座以次作其年十一月十三日敕冬至宜取以次日受朝六典禮部郎中凡元日大陳設於太極殿今大明宫於含元殿在東都則於乾元殿皇帝衮冕臨軒展樂陳歷代寶玉輿輅備黃麾仗皇太子獻壽次上公獻壽冬至如元正之儀其異者皇帝服通天冠無諸州表奏祥瑞貢獻會要貞元四年李泌請冬至朝賀中書令讀諸方表元和十二年淮西平申蔡州始輸貢物户部以其久不至請元日陳於庭十三年正月乙酉朔含元殿受朝賀御丹鳯樓大赦尚天寶六載十二月丙寅仗下後百官於書省閲貢物百官志殿中侍御史元日冬至朝會則乘馬具服戴黑豸升殿太宗有正月臨朝詩元日朝羣臣岑文本奏三元頌曰詔司存命掌故考憲章修法度三朝之禮畢陳九賓之儀咸具庭燎晃以飈舉明燈􅏎以星布月正元日節應勾芒浮非煙而泛佳氣闢閶闔而敞德陽虞賔光於列位呼韓厠於周行百寮濟濟萬國皇皇腰金鳴玉執贄奉璋五輅接軫九旗揚斾羽蓋葳㽔雲罕暗靄唐含元殿受朝賀大饗實録開元七年正月辛卯朔御含元殿受朝十年正月癸卯朔十六年十一月乙巳南至太史奏黃雲扶日十八年正月癸酉二十一年正月庚子朔二十三年正月戊申朔二十六年正月庚午朔二十八年正月戊子朔二十九年正月癸未朔並受朝賀建中元年十一月戊寅含元殿受朝賀初令親王出閣就班舊紀元和元年正月丁卯朔御含元殿受朝賀丹鳯樓大赦改元會要永泰二年即大厯元年十一月三日詔以十三日甲子冬至令有司祭南郊於含元殿受朝賀建中元年十一月辛酉朔御宣政殿朝集使及貢士見自兵興典禮廢墜州郡不上計內外不會同者二十有五年至是始復舊典州府計吏至者一百七十有三丁丒南至戊寅含元受朝賀二年正月朔庚申御含元殿四方貢獻列為庭實復舊制也會昌三年四月中書門下奏元日御含元殿百官就列唯宰相兩省官扇開侍立御前不拜而退令請對班於香案前侯扇開再拜升殿從之盧鈞傳宣宗元日大饗含元殿太中十一年裴度傳由太原朝京師及陛見謁者欲宣旨帝遽曰朕當延英待卿舊儀閣中羣臣未退宰相不奏事稱賀則謁者答帝以度勳德故待以殊禮唐含元殿元日受朝賀以實録考之玄宗十八南至一肅宗三南