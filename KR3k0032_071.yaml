紹聖賀元會表東臺瑞物冠玉璽之珍符左右輿圗增金城之列障紹興大慶殿朝會紹興十二年十月十六日詔來歲行大朝會設黃麾大仗車輅逍遙平輦法物樂舞既而不果十一月禮部請先舉文德殿視朝十四年八月二十四日閣門請御大慶殿大朝會十月三日兵部言黃麾大仗五千二十七人請減三分之一十二月二十三日御史臺太常寺修大朝會儀注十五年正月丁未朔御大慶殿受朝百官朝賀用黃麾仗三千三百五十人簾時無大慶殿權於崇政殿行之免駐輦設不設地衣學士院撰十二曲有瑞木成文滄海澄清瑞粟呈祥之曲自是一行而止是嵗冬至亦止文德殿稱賀上夀亦用和安之曲淳熙大慶殿稱賀乾道九年九月上諭大臣曰正至既免大朝會百官更不稱賀似於典禮未至翌日詔禮官討論冬至正旦稱賀儀注以聞十二月十七日禮官言正旦皇帝服鞾袍御大慶殿皇太子文武百僚常服稱賀用黃麾半仗從之淳熙元年正旦始行稱賀之禮是歲冬至朝賀用黃麾角仗一千五十六人慶元夀康宫朝賀二年十月二十六日禮部大常寺言正至皇帝率百僚詣壽康宫行朝賀禮設黃麾角仗從之四年八月丙戌詔將率羣臣詣宫上壽既而不克行紹聖元會頌臣伏覩唐虞盛隆五服迭朝更夏商周斯制加密禹會塗山玉帛萬國至于商湯爰有景亳豐宫岐陽成康是因三朝受圗漢人賦之區區朝儀末造有唐亦或不疑况膺正統席歸運未有若我宋之盛而陛下之躋閎休緝墜典也邪若乃出千品具萬方計億事材兆物此而不綴非翰墨者罪歟小臣被學最舊於頌為宜為頌曰皇帝嗣位十有二載天庥地涵與物開泰曰臣曰妾罔有內外章甫短後秀顛髫晬陶粹飲和萬室一態朝躋畯良獄洗鉗釱緇文黃輝𤭔籞嬉瀨皇帝曰嘻當飭蠱壞奉先紀元庶靡恫悔有司跽言月征日邁往雖郊見繼又禰配協休登平民物和會惟是班朝亦禮之大懿典徽綱不可弗再請以孟陬百執前戒帝曰俞哉往踐毋懈于時三朝錯事展宷初陽載暾晨隂剝解梢􅂒抶魑飛廉肅𤭔旄頭陛楯韎韐金介萬官翔洋至止藹藹鵷分鷺綴屏息收噫冠纚聮聮璀璨韍珮五輅中陳駟虬沛艾芝蓋葩華煜爚綷䌨如星拱極如水委海如天斯臨如日斯挂衆樂備舉縹以清籟乾安正安迭用並採虡業騰拏柷裒敔殺麼刋落兜離僸佅奄臻八紘效琛走貝地官宗伯履貢斯在四夷君長立列蕞蕞濮鉛鳬更遼差羌輩藿心晞陽左言椎䯰舌人象胥委體司語尉司稽首赫我昭代農敏于疇吏康于縡卧鼓韔弓不怵邊蠆萬宇更始擁相駢賚天子萬年福祿攸屆尉臣稽首禮則不忲玉色粹溫旁諏下逮孰為蟊螟孰致劬勱財力孰贏仕課孰最孰為國急孰斯民害孰俊未搜孰冗未汰孰懲孰革孰勞孰徠百辟愈愈並受誥誡天子萬年衎衎樂豈尉臣稽首竣事而退於皇緝熙裒時之對零我渥恩鴻濛汪濊聖敬日躋取乾用大天子萬年萬世永賴山峙鶴立人聲寂然侍山峙鶴立人聲寂然侍中奏而中外肅也日角龍犀天光下照黼坐升而臣鄰伏也劒佩相磨百辟俱進則如衆星之拱北辰蠻琛夷寶四逺咸集則如百川之赴巨海樽陳白獸宴設華燈萬官翔洋鵷朌鷺綴駕鸞輅以充明庭撞黃鐘而御太極踰沙軼幕辮髮卉裳咸奉玉帛而介九賓襲衣冠而獻萬壽臚湊羣辟雙闕峨峨上覆慶雲峨冠垂紳魚雅就列庭燎析光雞人呼旦納言入奏中嚴外辦黃麾龍旗葳㽔婀娜星辨金介于右于左玉海卷七十一
