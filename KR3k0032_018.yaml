body:
  text: 玉海卷十八宋王應麟撰地理郡國下漢中興郡國後郡國志漢書地理志記天下郡縣本末及山川竒異風俗所由至矣今但録中興以來郡縣改異及春秋三史會同征伐地名以為郡國志凡前志有縣名今所不載者皆世祖所并省也前無今有者後所置也凡縣名先書者郡所治也漢承秦三十六郡至于孝平凡郡國百三縣邑道侯國千五百八十七世祖中興惟官多役煩乃命合并省郡國十縣邑道侯國四百餘所中興海內人民才什二三建武二十一年遣中郎將馬援謁者分築烽候堡壁稍興立郡縣十餘萬户或空置令長上笑如春秋素王乃建三營屯田至明帝置郡一章帝置郡國二和帝置三安帝又命屬國别領比郡者六又所省縣漸復分置至于孝順凡郡國百五縣邑道侯國千一百八十注東觀書曰永興元年鄉三千六百八十二亭萬二千四百四十三民户九百六十九萬八千六百三十口四千九百一十五萬二百二十以河南言之二十一城比前則無故市焉以河東言之二十城比前則無左邑長修四邑又更彘城之名焉以弘農言之比前無商析四邑而湖與華隂乃自京兆割隸焉京兆舊十二城而省其二馮翊舊二十四而存其十三右扶風舊二十一而廢其六邑此屬司隸者也潁川省西京之三縣梁國增西京之一城沛二十一城以前志則省其十六陳九城比前淮揚則仍其舊魏郡十五城省前史之三巨鹿十五城省前史之五常山改鄗為髙邑而并五邑焉中山更漢昌蒲隂而并一邑焉改信都為安平而邑省其四改清河為甘陵而邑省其七河間復於永元而邑增舊之七趙國加以中丘而邑增舊之一勃海止於八城而省舊之十八此屬豫冀者也東郡則省范茌平之七邑東平則改屬夀張須昌寧陽之三邑而分三邑為任城泰山十二城比前省其半山陽十城比前省其十三濟北并泰山而復分於永元下邳舊臨淮而更名於永平濟隂之邑增前志之二彭城之邑增前志之一東海之縣省前志之二十五琅邪之縣省前志之三十八廣陵兼泗水之城則又增前志之七此屬兖徐者也以青荆二部考之若濟南省四城平原省十城樂安易千乘之號而邑并其六北海兼三國之疆而邑并其八東萊缺其四邑齊國虛其六城南郡邑減其一南陽零陵武陵邑增其一以揚益二部考之廬江兼六安而增二城會稽分吳郡而省十二城九江牂柯越巂并省皆一邑豫章巴郡漢中增損皆三邑益州省七城而分為昌郡犍為廣漢蜀郡共省九邑而分為屬國以涼并幽交四部考之若天水省三城而改漢陽張掖省二城遼東省七城而分屬國及上黨鬱林之一邑武都九真之二邑金城漁陽之三邑朔方之四邑太原之五邑定襄代上谷樂浪之七邑遼西之九邑上郡右北平之十二城安定北地之十三城涿郡之省者二十二西河之省者二十三皆損於前者也廣陽南海之增一邑玄菟之增三邑武威之增四邑及蒼梧之置鄣平交址之置封溪望海皆增於舊者也先是中興六載六月辛卯令郡國不足置者上二府於是條奏併省四百餘縣而建武十一年并朔方於并州十二年省金城屬隴西又其明年省并西京十三國今以志考之屬司隸之部郡七縣邑侯國百六豫州部郡國六縣邑侯國九十九冀州部郡國九縣邑侯國百其餘若兖若徐若青若荆暨揚益涼并幽交其部郡國凡七十七而屬國六不與其數共八十三而縣邑侯國道凡七百六十蓋自明帝置一章帝置二和帝置三安帝又命屬國别領比郡六又所省縣漸復分置至于孝順凡郡國百五比前史反增二縣邑道侯國千一百八十比前史猶少三百九十七漢中興郡縣改異并省又見上志録中興以來郡縣改異凡前志有縣名今不載者皆世祖所并省也并合省郡國十縣邑道侯國四百餘所紀建武六年六月辛卯詔曰張官置吏所以為人也今户口耗少吏職尚煩其令司隸州牧各實所部省減吏員縣國不足置長吏可并合者上大司徒大司空二府於是條奏并省四百餘縣十年省定襄郡十一年省朔方牧并并州十二年省金城郡十三年復置十三年二月并省西京十三國廣平真定城陽泗水災川膠東六安廣陽河間注此有九國云十三國誤也二十年省五原郡百官志世祖并省郡縣四百餘所後世稍復增之晉志光武郡國并省者八城陽淄川髙密膠東六安真定泗水廣陽廣一本云郡國志注所省者十國後復河間陽郡省八國耳宋志東京無復朔方改交址曰交州凡十二州司隸所部如故郡縣改異省都尉并太守則建武六年河南改為尹則十五年州牧復為刺史則十八年湖華隂故屬京兆今屬弘農長陵陽陵商雒故屬馮翊弘農今屬京兆建武十五年也陳留山陽三縣屬梁國元和元年也建武十一年十月西河上郡屬魏二十七年七月代郡魯國屬幽豫皆改屬者也汝南東平之固始夀張常山會稽南陽之髙邑章安章陵則世祖之所改臨淮為下邳天水為漢陽則永平十五年十七年之所更章帝改楚為彭城又改中山之三縣陳留之考城章和二年改淮陽為陳元和元年分東平為任城永元七年延光建和二年改千乘為樂安樂成清河為安平甘陵陽嘉三年改武陵之漢夀皆更名者也省六安屬廬江省廣平真定災川髙密膠東屬巨鹿常山北海則建武十年及十三年也省河間屬信都至永元三年而復省廣陽屬上谷至永平八年而復以至城陽泗水之屬琅邪廣陵皆并省而分屬者也交址之封溪望海武陵之沅南置于建武十九年二十六年分益州置永昌郡分泰山置濟北見于永平之十二年永元之二年順帝分會稽置吳郡永元二年八年十六年永和初元之置充國臨汝建昌漢寧永平元年二年八年之復鄀郃陽武功建初四年五年永和二年延光元年三年之置輪氏復贛榆杜陽陽信汶江以至鄣平哀牢博南之置祋祤粟邑淳于昌安下密之復厭次林慮臨濟臨睢樂平蒲隂湖陸髙平漢嘉漢昌之改未易悉數中平五年改刺史新置牧六年置漢安郡初平六年分巴郡為二建安十三年房陵别屬新城十八年復禹九州二十年復置漢寧上庸郡則漢季矣漢置永昌郡又見內附類明紀永平十二年春正月益州徼外夷哀牢王相率內屬於是置永昌郡罷益州西部都尉注西南夷傳曰罷益州西部所領六縣合為永昌郡置哀牢博南二縣去洛陽七千里志永昌郡八城户二十三萬一千八百九十七口百八十九萬七千三百四十四哀牢夷傳始通博南山度蘭倉水行者歌曰漢德廣開不賓度博南越蘭津漢郡邑侯國總入郡縣本末續志凡郡國百五縣邑道侯國千一百八十一自河南至扶風郡七而縣邑侯國百六則屬之司隸自潁川至魯國郡六而縣邑侯國九十九則屬之豫自魏郡至渤海郡九而縣邑侯國百則屬之冀自陳至濟隂郡八縣邑侯國八十則屬之兖徐州則自東海至下邳郡五而縣邑侯國六十二焉青州則自濟南至齊國郡六而縣六十五焉荆州則自南陽至長沙郡七而縣邑侯國百十七焉揚州有六郡而縣邑侯國九十二焉益州則郡國十二而縣道百一十八涼州則郡國十二而縣道候官九十八并州之郡九而縣邑侯國九十八幽州之郡國十一而縣邑侯國九十交州之郡七而縣五十六漢春秋三史地名續志録春秋三史會同征伐地名注臣昭案志猶有遺闕今衆書所載不可悉記其春秋土地通儒所據而未備者皆先列焉山川地名悉為細注今進為大字今以河南一郡考之如河南謂之王城尸鄉謂之尸氏密謂之新城則考之春秋者也如狄泉唐褚氏東圉解乾祭垂隴扈蒯原圃棐林制瑣清訾旃然汜京溪泉則考之左氏者也若公羊之成周史記之程注長城垣雍陽武什谷成睪陘山􅓆狐髙都前書之曲遇闕劉昭補注於河南郡引左傳者三十八若大野澤觀魚臺丹徒之引春秋梁山沙鹿之引公穀不可勝紀所證他書若爾雅詩譜説文帝王世紀鄭志越絶古史考皇覽劉向别録古今注及吕氏漢晉魏氏交廣春秋黃圖決録計偕簿汲冢書襄陽耆舊傳西征南都三都賦注以記名者三齊三秦上黨荆州秦州營陽始安伏滔北征戴延之西征潘嶽關中劉薈騶山晉太康元康地道周處風土干寶搜神慧逺廬山任豫益州及博物耆舊豫章交州巴吳興湘中等書以志名者巴漢南中華陽陳留及廣志河內之修武春秋曰寧潁川之􅋣陵春秋曰􅋣汝南之城父春秋曰夷陳之苦縣春秋曰相東郡濮陽春秋曰濮穀城春秋曰小穀東平之夀張春秋曰良山陽之東緡春秋曰緡東海之祝其春秋曰夾谷琅邪之即丘春秋曰祝丘廣陵之堂邑春秋曰堂良成春秋曰良平原之祝阿春秋曰祝柯漢中之錫春秋曰錫穴皆見志之本注春秋正義引釋例土地名世族譜隋志春秋土地名三卷晉裴秀客京相璠撰九州郡縣名九卷古來國名二卷古今地譜二卷唐志劉伯莊史記地名二十卷杜預左傳序别集諸例及地名譜第厯數相與為部凡四十部十五卷名曰釋例宋州郡志以班固馬彪二志太康元康定户王隱地道晉世起居永初郡國何徐州郡及地理雜書互相考覆以續漢郡國校太康地志參伍異同本朝楊湜編春秋地譜十二卷十三國地皆釋以今州縣名并為圖於後常氏有此書湜增廣焉漢四履州域通典秦制天下為四十郡其地則西臨洮北沙漠東縈西帶皆臨大海漢興以秦地太大加置郡國凡為十三州部刺史至哀平之際凡新置郡國六十三焉與秦四十合百三地東西九千三百二里南北萬三千三百六十八里此漢之極盛也光武并省郡國十縣道侯國四百餘所其後亦為十三州部漸復加置郡國至于靈獻凡百有五東樂浪西燉煌南日南北鴈門西南永昌四履之盛亦如前漢敘傳凡漢書分州域物土疆漢省州并郡復禹貢九州平紀元始四年冬更十二州名分界百官志注獻帝起居注曰建安十八年正月庚寅省州并郡復禹貢九州兖豫青徐荆揚冀益雍益九數雖同而禹貢無益有梁然梁亦一地也冀州三十六郡省司隸分屬豫冀雍州二十一郡省涼州荆州十三郡省交州得交州五郡益州十四郡本十二得交州二郡豫州八郡并河南滎陽都尉徐州八郡青州五郡魏十二州通典魏有州十二司隸豫兖青徐涼秦冀幽并揚雍涼分置秦州魏王觀傳明帝即位下詔書使郡縣條為劇中平者外劇有任子於役條當有降差太和六年二月詔改封諸侯王皆以郡為國三國形勢胡安國設險論曰魏人都許不恃方城而守襄陽蜀人都益不恃劍門而守漢中吳人都秣陵不恃大江而守荆渚宋志三國鼎跱吳得揚荆交三州蜀得益州魏氏猶得九焉吳又分交為廣魏末平蜀又分益為梁北史夀春形勝南鄭要嶮乃建鄴之肩髀成都之喉嗌晉殷仲堪曰劍閣之隘蜀之關鍵巴西梓潼宕渠三郡去漢中遼逺在劍閣之內而統屬梁州蓋定鼎中華慮在後伏自南遷守在岷邛襟帶之形事異曩日是以李勢初平割三郡隸益州將欲重復上流為習坎之防王羲之曰保淮之志非復所及莫過還保長江都督將各復舊鎮自長江以外羈縻而已孫綽曰中宗龍飛實賴萬里長江畫而守之耳晉十九州增置郡國司冀兖豫荆徐揚青幽平并雍秦涼梁交廣及益寧晉志魏武所置十二新興至襄陽所省七上郡至廬江文帝置七朝歌至安豐明及少帝增二上庸平陽得漢郡五十四蜀先主置郡九巴東至涪陵後主增二雲南興古得漢郡十有一吳大帝置郡五臨賀至廬陵南部少帝景帝各四臨川至合浦北部歸命侯置十二始安至宜都得漢郡十有八晉武太康元年平孫氏凡增置郡國二十有三滎陽至南平二通典二十有省司隸置司州别立梁秦寧平四州仍吳之廣州凡十九州郡國一百七十三仍吳所置二十五仍蜀十二仍魏二十一仍漢