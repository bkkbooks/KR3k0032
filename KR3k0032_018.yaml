年所置也以至征髙麗而置蓋遼巖三州分骨利幹部而置元闕州分回紇部而置十八州九府他如永徽之置渾河狼山金滿顯慶之置雙河隂山拱州龍朔之置桑乾府吐火羅道儀鳯二年之置納晏鞏奉浙州則由山洞之開咸亨三年之置總敦殷州則由昆明之內屬及開元貞元之間廢置分合不可遍舉羈縻諸州皆傍塞外或寓名於夷落邠天寶後王官之戍北不踰河西止秦州領于府如定襄之四雲中之五桑乾之四呼延之三達渾之五是也縣領于州如嵯州之一祐淳州之二諾州之三蓋州之四是也唐太宗併省州郡志天下初定權置州郡頗多太宗元年始命併省實録一月丁巳通鑑二月會要三月十日今考之志會要關內則泉稷林彭麟州廢于元年南夏會要五年北吉魏羅正西和北連州廢于二年會要又廢利州北仁廢于三年會州廢于六年八年則廢西韓北永北基上州九年十一年則廢環豐州十三年廢回柘長化十七年六月十七日廢宜州河南則熊邵汝芮管道沈息舒洧杞邳漣談東泰廢于元年莒鄫廢于二年志莒八年鄫元年嵩鼎仁東梁魯廢于三年八年九年戴北譙廢于十七年六月河東則元年廢昌邵中介蓋西德北溫二年三年廢東和西定北和九年十七年廢受虞吕韓河北則元年廢毛殷莘元廉蠡景澶礠滿東鹽六年十二月九日廢棣州十七年六月廢黎井深觀山南則元年省均重純直郢湖沙萬西康南井八年省東松鄀浙二年九年十年六月七日志十七年省西平北澧靜州十二年十七年省覆溫州隴右則八年省旦州十年十一年省米烏州淮南則元年省方義霍谷州江南則豐池夷南雲東嘉併于元年道州併于十七年牢州併于十八年郎州併于十七年復置于十三年劍南則犍維併于元年二年復維州蒙賢霸併于二年八年十三年嶺南則威齊至前真十三州併于元年玉山至後真五州併于二年十年南康荔晏之省十一十二年也潯岡至南建燕九州之廢十三十六十八年也李吉甫傳元和六年吉甫奏今列州三百縣千四百通典一千五百七十二縣願詔有司博議州縣有可併併之六典三都城內曰京縣奉先同京城通典曰赤縣外曰畿縣又望縣八十五通典七十八餘為上中下縣唐諸州名志武德元年六月十九日更諸郡為州天寶二載以州為郡紀元年二月丙申會要元年正月二十日乾元元年復以郡為州紀至德二載十二月戊午復諸州及官名云考異云頒下四方已涉明年故皆乾元元年凡州郡縣無所更置者皆仍隋舊凡乾元後所置州皆無郡名及其季世所置州縣又不列上中下之第武德更州名若汾夔僰欒嵐嶽白繡楚貞觀更州名若韶歡伊辨邵汝亳慈媯忠萬道茂潘竇柳澄雍橫蒙雷容廉富昭康播龍朔乾封總章上元之際則更冀宜鬱林禺陸先天開元寶應永貞大厯之際則更儀閬劒邠莫褒福蔡巒充處天寶元年更郡名則關內七河南七河東四河北九山南十一隴右淮南皆三江南嶺南皆九劔南十嶺南五管廣桂雍容安南皆隸嶺南節度使咸通三年五月分兩道節度廣為東雍為西會要崔涖議曰則天分割雍州為四益州為三減削其權不使専統大中元年正月敕古者郎官出為邑宰公卿外領郡符唐二十四府都督按察使百官志武德初邊要之地置總管以總軍六月七日加號使持節蓋漢刺史之任有行臺有大行臺其員有尚書令一人掌管內兵民總判省事僕射二之左右丞以下諸司郎中略如京師七年二月十二日改總管曰都督總十州者曰大都督貞觀二年去大字凡都督府有刺史以下如故然大都督又兼刺史而不檢校州事其後都督加使持節則為將諸將亦通以都督稱會要開元元年著令戶滿二萬以上為中都督不滿者為下都督府景雲二年六月二十八日制於天下分置都督府二十四察刺史以下善惡置司舉從事二人秩比侍御史揚益荆并四州為大都督汴兖魏冀蒲綿秦洪潤越十州為中都督皆正三品齊鄜涇襄安潭遂通梁夔十州為下都督府從三品其年七月詔置都督議者以為權重難制罷之惟四大都督府如故置十道按察使道各一人開元二年曰十道按察採訪處置使至四年罷八年復置十道按察使秋冬巡視州縣十年又罷十七年復置十道京都兩畿按察使二十年曰採訪處置使分十五道天寶末又兼黜陟使乾元元年改曰觀察處置使通鑑開元十五年五月癸酉上悉以諸子慶王潭等領州牧刺史都督節度大使大都護經略使實不出外十七年五月壬辰復置十道及京都兩畿按察使唐十五道志景雲二年六月壬午分天下郡縣置二十四都督府以統之既而以權重罷之會要景雲二年五月分山南為東西兩道又自黃河已西分河西道開元二十一年又因十道分山南江南為東西道增置黔中道及京畿都畿置十五採訪使檢察如漢刺史之職關內道蓋古雍州之域為府二都護府二州二十七縣百三十五京畿採訪使治京城內京兆至邠州關內採訪使以京官領隴州至鎮北河南道蓋古豫兖青徐之域為府一州二十九縣百九十六都畿採訪使治東都城內東都至汝州河南採訪使治汴州陜州至密州河東道蓋古冀州之域為府二州十九縣百一十採訪使治蒲州河中至澤州河北道蓋古幽冀二州之域為州二十九都護府一縣百七十四採訪使治魏州孟州至安東山南道蓋古梁荆二州之域為府二州三十三縣百六十一東道採訪使治襄州江陵至金州西道採訪使治梁州興元至渠州隴右道蓋古雍梁二州之境為州十九都護府二縣六十採訪使治鄯州秦州至安西淮南道蓋古揚州之域為州十二縣五十三採訪使治揚州揚州至申州江南道蓋古揚州南境為州五十一縣二百四十七東道採訪使治蘇州潤州至漳州西道採訪使治洪州宣州至邵州黔中採訪使治黔州黔州至溱州劍南道蓋