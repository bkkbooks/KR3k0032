年所置也以至征髙麗而置蓋遼巖三州分骨利幹部而置元闕州分囘紇部而置十八州九府他如永徽之置渾河狼山金滿顯慶之置雙河隂山拱州龍朔之置桑乾府吐火羅道儀鳯二年之置納晏鞏奉浙州則由山洞之開咸亨三年之置總敦殷州則由昆明之内屬及開元貞元之間廢置分合不可徧舉羈縻諸州皆傍塞外或寓名於夷落邠天寶後王官之戍北不踰河西止秦州領于府如定襄之四雲中之五桑乾之四呼延之三達渾之五是也縣領于州如嵯州之一祐淳州之二諾州之三蓋州之四是也唐太宗併省州郡志天下初定權置州郡頗多太宗元年始命併省實錄一月丁巳通鑑二月㑹要三月十日今攷之志㑹要闗内則泉稷林彭麟州廢于元年南夏㑹要五年北吉魏羅正西和北連州廢于二年㑹要又廢利州北仁廢于三年㑹州廢于六年八年則廢西韓北永北基上州九年十一年則廢環豐州十三年廢迴柘長化十七年六月十七日廢宜州河南則熊邵汝芮管道沈息舒洧杞邳漣譚東泰廢于元年莒鄫廢于二年志莒八年鄫元年嵩鼎仁東梁魯廢于三年八年九年戴北譙廢于十七年六月河東則元年廢昌邵中介蓋西徳北温二年三年廢東和西定北和九年十七年廢受虞吕韓河北則元年廢毛殷莘元廉蠡景澶礠滿東鹽六年十二月九日廢棣州十七年六月廢黎井深觀山南則元年省均重純直郢湖沙萬西康南井八年省東松鄀浙二年九年十年六月七日志十七年省西平北澧静州十二年十七年省覆温州隴右則八年省旦州十年十一年省米烏州淮南則元年省方義霍谷州江南則豐池夷南雲東嘉併于元年道州併于十七年牢州併于十八年郎州併于十七年復置于十三年劍南則犍維併于元年二年復維州蒙賢霸併于二年八年十三年嶺南則威齊至前真十三州併于元年玉山至後真五州併于二年十年南康茘晏之省十一十二年也潯岡至南建鷰九州之廢十三十六十八年也李吉甫傳元和六年吉甫奏今列州三百縣千四百通典一千五百七十二縣願詔有司博議州縣有可併併之六典三都城内曰京縣奉先同京城通典曰赤縣外曰畿縣又望縣八十五通典七十八餘為上中下縣唐諸州名志武徳元年六月十九日更諸郡為州天寶二載以州為郡紀元年二月丙申㑹要元年正月二十日乾元元年復以郡為州紀至徳二載十二月戊午復諸州及官名云考異云頒下四方已涉明年故皆乾元元年凡州郡縣無所更置者皆仍隋舊凡乾元後所置州皆無郡名及其季世所置州縣又不列上中下之第武徳更州名若汾䕫僰欒嵐岳白繡楚貞觀更州名若韶驩伊辯邵汝亳慈媯忠萬道茂潘竇柳澄邕橫蒙雷容廉富昭康播龍朔乾封緫章上元之際則更冀宜鬱林禺陸先天開元寶應永貞大厯之際則更儀閬劒邠莫褒福蔡巒充處天寶元年更郡名則闗内七河南七河東四河北九山南十一隴右淮南皆三江南嶺南皆九劔南十嶺南五管廣桂邕容安南皆隷嶺南節度使咸通三年五月分兩道節度廣為東邕為西㑹要崔涖議曰則天分割雍州為四益州為三減削其權不使専統大中元年正月勅古者郎官出為邑宰公卿外領郡符唐二十四府都督按察使百官志武徳初邊要之地置總管以總軍六月七日加號使持節蓋漢刺史之任有行臺有大行臺其員有尚書令一人掌管内兵民總判省事僕射貳之左右丞以下諸司郎中畧如京師七年二月十二日改總管曰都督總十州者曰大都督貞觀二年去大字凡都督府有刺史以下如故然大都督又兼刺史而不檢校州事其後都督加使持節則為將諸將亦通以都督稱㑹要開元元年著令戸滿二萬以上為中都督不滿者為下都督府景雲二年六月二十八日制於天下分置都督府二十四察刺史以下善惡置司舉從事二人秩比侍御史揚益荆并四州為大都督汴兖魏冀蒲綿秦洪潤越十州為中都督皆正三品齊鄜涇襄安潭遂通梁䕫十州為下都督府從三品其年七月詔置都督議者以為權重難制罷之惟四大都督府如故置十道按察使道各一人開元二年曰十道按察採訪處置使至四年罷八年復置十道按察使秋冬巡視州縣十年又罷十七年復置十道京都兩畿按察使二十年曰採訪處置使分十五道天寶末又兼黜陟使乾元元年改曰觀察處置使通鑑開元十五年五月癸酉上悉以諸子慶王潭等領州牧刺史都督節度大使大都䕶經畧使實不出外十七年五月壬辰復置十道及京都兩畿按察使唐十五道志景雲二年六月壬午分天下郡縣置二十四都督府以統之既而以權重罷之㑹要景雲二年五月分山南為東西兩道又自黄河已西分河西道開元二十一年又因十道分山南江南為東西道增置黔中道及京畿都畿置十五採訪使檢察如漢刺史之職闗内道蓋古雍州之域為府二都䕶府二州二十七縣百三十五京畿採訪使治京城内京兆至邠州闗内採訪使以京官領隴州至鎮北河南道蓋古豫兖青徐之域為府一州二十九縣百九十六都畿採訪使治東都城内東都至汝州河南採訪使治汴州陜州至宻州河東道蓋古冀州之域為府二州十九縣百一十採訪使治蒲州河中至澤州河北道蓋古幽冀二州之域為州二十九都䕶府一縣百七十四採訪使治魏州孟州至安東山南道蓋古梁荆二州之域為府二州三十三縣百六十一東道採訪使治襄州江陵至金州西道採訪使治梁州興元至渠州隴右道蓋古雍梁二州之境為州十九都䕶府二縣六十採訪使治鄯州秦州至安西淮南道蓋古揚州之域為州十二縣五十三採訪使治揚州揚州至申州江南道蓋古揚州南境為州五十一縣二百四十七東道採訪使治蘇州潤州至漳州西道採訪使治洪州宣州至邵州黔中採訪使治黔州黔州至溱州劍南道蓋古梁州之域為府一都䕶府一州三十八縣百八十九採訪使治益州成都至瀘州嶺南道古揚州南境為州七十有三都䕶府一縣三百一十四採訪使治廣州廣州至武安通典開元二十一年通鑑同分為十五道置採訪使以檢察非法京畿治西京城内闗内多以京官遙領都畿治東都城内河南治陳留郡河東治河東郡河北治魏郡隴右治西平郡山南東治襄陽郡山南西治漢中郡劒南治蜀郡淮南治廣陵郡江南東治呉郡江南西治章郡黔中治黔中郡嶺南治南海郡又於邊境置節度經畧使式遏四夷節度使十經畧守捉使三大凡鎮兵四十九萬人戎馬八萬餘疋㑹要開元二十二年二月十九日辛亥初置十五道採訪處置使以盧絢等為之張九齡奏置年李尚隠傳二十二置京畿用中丞盧奐大夫不充使永泰後大夫王翊崔渙等乃為之通鑑乾元元年五月壬午停採訪使改黜陟使為觀察武徳令三萬户已上為上州永徽令二萬户以上為上州顯慶元年九月十二日勅户三萬以上為上州二萬以上為中州開元十八年三月七日勅户四萬以上為上州二萬五千户為中州不滿二萬為下州縁邊州三萬户以上為上二萬户以上為中其親王任中下州刺史亦為上州去任仍舊凡天下三百六十州自後併省迄于天寶凡三百三十一州存焉而羈縻之州八百尹京之府有三京兆河南太原大都督府有五潞揚益荆幽都䕶府有六單于安西安北為大安南安東北庭為中又有上中下都督府凡天下軍有四十府有六百三十四鎮有四百五十戍有五百九十守捉有三十五㑹要理道要訣唐郡府三百二十八縣千五百七十三折衝府五百九十三鎮二百四戍三百九十三寺五千一百八十五驛千三百八十八觀千八百五闗二十七通典同通鑑開元二年閏二月丁卯復置十道按察使以益州長史陸象先等為之四年閏十二月辛丑罷晉傅咸上言曰舊都督有四今并監軍乃盈於十夏禹敷土分為九州今之刺史幾向一倍户口比漢十分之一而置郡縣更多空校牙門無益宿衛而虛立軍府動有百數五等諸侯復坐置官屬以為當今之急先并官省事静事息役唐依漢法於四邊立都䕶府以鎮重邊陲招懷憬俗開元時安東都䕶府在營州東界至洛陽二千九百里安南都䕶府在交阯至洛陽七千二百里安西都䕶府在龜兹至洛陽八千三百里安北都護府在中受降城至洛陽二千二百里制㫖兵法唐嶺南五府六典廣循至瓊振廣府管内桂昭至古嚴桂府容藤至平琴容府邕賓至環澄邕府安南驩愛至福祿龎安南管内凡七十州其五府又管羈縻州通典嶺南五府經畧使理南海郡統經畧軍南海清海軍恩平桂管容管鎮南安南邕管經畧使通鑑云統桂容邕交四管治廣州唐十節度經畧使又見兵制通典節度使十鎮西治安西北庭都䕶府河西武威朔方靈武河東太原范陽范陽平盧柳城隴右西平劒南蜀郡嶺南南海五府經畧使又有經畧守捉使三以防海宼長樂郡經畧使東萊東牟郡守捉通鑑天寶元年正月壬子分平盧别為節度是時天下聲教所被之州三百三十一羈縻之州八百置十節度經畧使以備邊安西節度撫寜西域治龜兹城兵二萬四千北庭節度防制突騎施堅昆治北庭都䕶府兵二萬人河西節度斷隔吐蕃突厥治涼州兵七萬三千人朔方節度捍禦突厥治靈州兵六萬四千七百人河東節度與朔方犄角以禦突厥治太原府兵五萬五千人范陽節度臨制奚契丹治幽州兵九萬一千四百人平盧節度鎮撫室韋靺鞨治營州兵三萬七千五百人隴右節度備禦吐蕃治鄯州兵七萬五千人劒南節度西抗吐蕃南撫蠻獠治益州兵三萬九百人嶺南五府經畧綏静夷獠治廣州兵萬五千四百人此外又有長樂經畧福州領之兵千五百人東萊守捉萊州領之東牟守捉登州領之兵各千人凢鎮兵四十九萬人馬八萬餘匹開元之前每歲供邊兵衣糧費不過二百萬天寶之後邊將奏益兵浸多每歲用衣千二十萬匹糧百九十萬斛四載二月己酉以朔方王忠嗣兼河東自朔方至雲中邊數千里要害之地悉列置城堡斥地各數百里唐開元户部帳志開元天寶之際東至安東西至安西南至日南北至單于府蓋南北如漢之盛東不及而西過之開元二十八年户部帳凡郡府三百二十有八縣一千五百七十三户八百四十一萬二千八百七十一口四千八百一十四萬三千六百九應受田一千四百四十萬三千八百六十二頃通典同六典開元二十二年數天下之户八百一萬八千七百一十口四千六百二十八萬五千一百六十一唐來威國舊紀天寶三載十月丁未改史國為來威國開寶并省嶺南州縣開寶五年四月上按嶺南圖籍州縣多而户口少命知廣州潘美轉運使王明度其地里并省以便民甲午初廢白州及常樂州五月乙丑廢澄賓等十三州又廢縣四十九十一月甲戌又廢春勤二州及七縣又廢南義州開寶二年十月契丹藏才千酋長王甲帥衆來降置豐州以處之自是世襲三年七月丙辰減州縣官員數太祖禦戎不勤逺畧夏州李彞興河西折御勲朔方馮繼業許以世襲邊圉無事帝騭下民集大命于藝祖厥既百神受職六服軌道迺惟李唐叔季彊藩畔援五代八姓民生如燬圖所以久長治之䇿肆發宸指召諸鎮以還邸遣廷紳以牧民開寶較州縣數開寶九年十二月史官較州縣數元年有州百十一縣六百三十八户九十六萬七千三百五十三至是州二百九十七縣千八十六户二百五十萬八千九百六十建隆元年五月詔天下縣除赤畿次赤次畿外重升降地望四千户以上為望三千户以上為緊二千户以上為中不滿千户為中下五百户以下為下每三年一次升降乾徳二年七月己丑詔階成二州並直隷京師太平興國二年八月戊辰罷節鎮領支郡之制從右拾遺李瀚之言也七年五月辛亥以涇州直屬京太祖平湖南始令潭州等属京其後大縣亦有直属者興元之三泉是也太宗即位之初命髙保寅守懐得自奏事懐州故隷河陽至是邠寜涇原等州並屬京節鎮無領支郡者矣建隆元年七月己未始以知州易方鎮十一月乙丑始以朝臣監諸州稅乾徳元年四月乙酉州置通判始命賈玭等通判湖南諸州六月庚戌始命常參官知縣淳化十道至道十五路租稅淳化四年十月分十道五年十月罷見三司使國初罷節鎮統支郡以轉運使領諸路事其合别未有定制至道三年始定為十五路京東京西河北河東陜西淮南江南湖南湖北兩浙福建西川陜西路廣東廣西咸平三年三月戊辰荆湖南北路始置兩使凡租稅有穀帛金鐵物産四類穀之品七布帛絲綿之品十金鐵之品四物産之品六至道末歲收穀二千一百七十一萬七千餘石錢四百六十五萬餘緡絹一百六十二萬餘疋紬絁二十七萬三千餘疋絲綿六百五十餘萬兩云後又增三路為十八路國初西川路開寶六年始分陜西路咸平四年分川峽為四路益梓利䕫天聖八年分江南為東西路五皇祐三年正月二十四日分淮南為東西揚廬熙寜年八月二十四日分京西為南北十二月十三日分陜西為二永興秦鳯六年七月二十七日分河北為東西熙寜五年十月以熙河洮岷通逺軍為熙河路王韶取洮河王贍夷青唐王厚復湟鄯遂建熙河一道十一月陜西分六路各置經畧司永興鄜延環慶涇原秦鳯熙河政和中初置珍思承溱播五郡宣和末廢其四紹興二年欲省珍州後不果廢十四年九月丁酉分利州為東西兩路司馬光曰上下一千七百餘年天下一統者五百餘年而已大觀元年十二月癸巳詔東南久安兵勢寡弱人輕易搖當謹不虞之戒可以揚江寧杭越洪荆南潭福及廣桂為帥府真江潤明䖍靖邵泉封邕為望郡帥府仍兼總管用侍從官望郡以郎官以上為之又詔帥府屯兵二千望郡一千慶厯省縣邑慶厯四年五月己丑省河南府潁陽夀安偃師緱氏河清五縣為鎮又析王屋縣隷孟州省孟州汜水縣為行慶闗隷河南時參政仲淹以天下縣邑多役衆民貧故首自河南府省之未幾悉復熙寜省州縣熙寜中省併天下州縣迄八年凡廢州軍監三十一儀滑至宣化廢縣一百二十七晉之趙城至潤之延陵九域志載省廢州軍京東軍一廣齊京西軍一光化河北軍二通利承天陜西州三乾儀綏河東州二沁慈軍二平晉静樂淮南軍二天長漣水兩浙軍二順化江隂荆湖州一復軍二漢陽荆門利州路州二集壁軍一大安廣南路州二十五富至崖軍一太平建炎十九路建炎元年六月己卯宰臣李綱請以河北地建為藩鎮是以兵力援之而於沿河沿淮沿江置帥府要郡次要郡以備控扼沿河帥府十一沿淮帥府二沿江帥府六大率自川陜廣南外總分為十九路每路文臣為安撫使馬步軍都總管總一路兵政許便宜行事武臣副之要郡以文臣知州領兵馬鈐轄次要郡以文臣知州領兵馬都監許參軍事皆以武臣為副沿河帥府八軍要郡六軍次要郡三軍非要郡二軍沿淮帥府五軍要郡三軍次要郡二軍非要郡一軍沿江帥府五軍要郡三軍次要郡二軍非要郡半軍軍二千五百人自帥府外要郡三十九次要郡三十八總為兵九十六萬七千五百人非要郡不預又别置水軍帥府兩將要郡一將從之先遣楊觀復往江淮造舟丙戌詔京東西河北東路永興軍江淮荆湖等路皆置帥府要郡屯兵有差初綱欲因帥府以㝢方鎮之法四年五月京畿東西湖北淮南分為鎮置鎮撫使㳂江分三路置安撫大使鄂江池州置司江又詔浙西置司鎮建炎元年五月辛卯趙子崧建三屯之議陜西河東北之兵合六萬人一屯澶淵一屯河中陜華一屯青鄆壬辰胡舜陟言以三京闗陜析為四鎮拱滑潁昌隷東京鄭汝河陽隷西京恩濮開徳隷北京同華陜府隷京兆擇人為節帥詔付三省議格大江七渡紹興二年八月辛丑司諫呉表臣言大江之南上自荆鄂下至常潤不過十郡之間其要不過七渡上流最急者三荆南之公安石首岳之北津中流最緊者二鄂之武昌太平之采石下流最緊者二建康之宣化鎮江之瓜洲此七渡當擇官兵修器械其餘數十處或道路迂曲水陸不便非大軍往來徑捷之處畧為之防足矣詔以付沿江守帥甲辰給事中程瑀言三國東晉雖各保長江實宿重兵於淮南紹興二年九月乙丑初命沿江岸置烽火臺以為斥堠自當塗之褐山東采石慈湖繁昌三山至建康之馬家渡大城堙池州之鵲頭山凡八所旦舉煙暮舉火各一以為信有警即三之用李綱請也五年李綱言淮甸荆襄東南屏蔽六朝能保守江左以强兵巨鎮盡在淮南荆襄間今當於淮南東西及荆襄置三大帥屯重兵以臨之以揚廬襄陽為帥府分遣偏師進守支郡小築城壘如開新邊淮東以江東路財用淮西以江西荆襄以湖北財用給之徐議營田使自贍養假以歲月藩籬成矣近年以來大將握重兵於江南將吏守空城於江北雖有天險初無戰艦水軍之制故敵人侵伺淮南有藩籬形勢之固然後建康可都四年知建康吕祉上東南防守利便三卷胡安國曰欲固上流必先保漢沔欲固下流必先守淮泗欲固中流必以重兵鎮安陸魏武困於居巢曹丕困於濡須拓跋困於瓜洲苻堅困於淝水皆不得渡左傳昭十七年楚司馬子魚曰我得上流注順江而下易用勝敵呉志魏文帝出廣陵望大江曰彼有人焉未可圖也宋朝郡國名景祐三年正月翰學承㫖章得象等評定三等國名今以司封格參訂趙晉梁宋夀昇韓襄慶蜀寜光均端嘉潁康恭定建英延以上不封秦秦川齊臨菑營丘魏大名燕薊城楚彭城魯曲阜大以上舊陳宛丘呉姑蘇越㑹稽以於越上舊次今升夏朔方商上洛商於周雒陽漢廣漢唐唐城今泌陽添徐徐方徐土冀冀方信都雍