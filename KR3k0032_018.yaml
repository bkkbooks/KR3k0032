年五月辛亥以涇州直屬京太祖平湖南始令潭州等屬京其後大縣亦有直屬者興元之三泉是也太宗即位之初命髙保寅守懷得自奏事懷州故隸河陽至是邠寧涇原等州並屬京節鎮無領支郡者矣建隆元年七月己未始以知州易方鎮十一月乙丑始以朝臣監諸州稅乾德元年四月乙酉州置通判始命賈玭等通判湖南諸州六月庚戌始命常參官知縣淳化十道至道十五路租稅淳化四年十月分十道五年十月罷見三司使國初罷節鎮統支郡以轉運使領諸路事其合别未有定制至道三年始定為十五路京東京西河北河東陜西淮南江南湖南湖北兩浙福建西川陜西路廣東廣西咸平三年三月戊辰荆湖南北路始置兩使凡租稅有穀帛金鐵物産四類穀之品七布帛絲綿之品十金鐵之品四物産之品六至道末歲收穀二千一百七十一萬七千餘石錢四百六十五萬餘緡絹一百六十二萬餘匹紬絁二十七萬三千餘匹絲綿六百五十餘萬兩云後又增三路為十八路國初西川路開寶六年始分陜西路咸平四年分川峽為四路益梓利夔天聖八年分江南為東西路五皇祐三年正月二十四日分淮南為東西揚廬熙寧年八月二十四日分京西為南北十二月十三日分陜西為二永興秦鳯六年七月二十七日分河北為東西熙寧五年十月以熙河洮岷通逺軍為熙河路王韶取洮河王贍夷青唐王厚復湟鄯遂建熙河一道十一月陜西分六路各置經略司永興鄜延環慶涇原秦鳯熙河政和中初置珍思承溱播五郡宣和末廢其四紹興二年欲省珍州後不果廢十四年九月丁酉分利州為東西兩路司馬光曰上下一千七百餘年天下一統者五百餘年而已大觀元年十二月癸巳詔東南久安兵勢寡弱人輕易搖當謹不虞之戒可以揚江寧杭越洪荆南潭福及廣桂為帥府真江潤明虔靖邵泉封雍為望郡帥府仍兼總管用侍從官望郡以郎官以上為之又詔帥府屯兵二千望郡一千慶厯省縣邑慶厯四年五月己丑省河南府潁陽夀安偃師緱氏河清五縣為鎮又析王屋縣隸孟州省孟州汜水縣為行慶關隸河南時參政仲淹以天下縣邑多役衆民貧故首自河南府省之未幾悉復熙寧省州縣熙寧中省併天下州縣迄八年凡廢州軍監三十一儀滑至宣化廢縣一百二十七晉之趙城至潤之延陵九域志載省廢州軍京東軍一廣齊京西軍一光化河北軍二通利承天陜西州三乾儀綏河東州二沁慈軍二平晉靜樂淮南軍二天長漣水兩浙軍二順化江隂荆湖州一復軍二漢陽荆門利州路州二集壁軍一大安廣南路州二十五富至崖軍一太平建炎十九路建炎元年六月己卯宰臣李綱請以河北地建為藩鎮是以兵力援之而於沿河沿淮沿江置帥府要郡次要郡以備控扼沿河帥府十一沿淮帥府二沿江帥府六大率自川陜廣南外總分為十九路每路文臣為安撫使馬步軍都總管總一路兵政許便宜行事武臣副之要郡以文臣知州領兵馬鈐轄次要郡以文臣知州領兵馬都監許參軍事皆以武臣為副沿河帥府八軍要郡六軍次要郡三軍非要郡二軍沿淮帥府五軍要郡三軍次要郡二軍非要郡一軍沿江帥府五軍要郡三軍次要郡二軍非要郡半軍軍二千五百人自帥府外要郡三十九次要郡三十八總為兵九十六萬七千五百人非要郡不預又别置水軍帥府兩將要郡一將從之先遣楊觀復往江淮造舟丙戌詔京東西河北東路永興軍江淮荆湖等路皆置帥府要郡屯兵有差初綱欲因帥府以宇方鎮之法四年五月京畿東西湖北淮南分為鎮置鎮撫使沿江分三路置安撫大使鄂江池州置司江又詔浙西置司鎮建炎元年五月辛卯趙子嵩建三屯之議陜西河東北之兵合六萬人一屯澶淵一屯河中陜華一屯青鄆壬辰胡舜陟言以三京關陜析為四鎮拱滑潁昌隸東京鄭汝河陽隸西京恩濮開德隸北京同華陜府隸京兆擇人為節帥詔付三省議格大江七渡紹興二年八月辛丑司諫吳表臣言大江之南上自荆鄂下至常潤不過十郡之間其要不過七渡上流最急者三荆南之公安石首嶽之北津中流最緊者二鄂之武昌太平之采石下流最緊者二建康之宣化鎮江之瓜洲此七渡當擇官兵修器械其餘數十處或道路迂曲水陸不便非大軍往來徑捷之處略為之防足矣詔以付沿江守帥甲辰給事中程瑀言三國東晉雖各保長江實宿重兵於淮南紹興二年九月乙丑初命沿江岸置烽火臺以為斥堠自當塗之褐山東采石慈湖繁昌三山至建康之馬家渡大城堙池州之鵲頭山凡八所旦舉煙暮舉火各一以為信有警即三之用李綱請也五年李綱言淮甸荆襄東南屏蔽六朝能保守江左以強兵巨鎮盡在淮南荆襄間今當於淮南東西及荆襄置三大帥屯重兵以臨之以揚廬襄陽為帥府分遣偏師進守支郡小築城壘如開新邊淮東以江東路財用淮西以江西荆襄以湖北財用給之徐議營田使自贍養假以歲月藩籬成矣近年以來大將握重兵於江南將吏守空城於江北雖有天險初無戰艦水軍之制故敵人侵伺淮南有藩籬形勢之固然後建康可都四年知建康吕祉上東南防守利便三卷胡安國曰欲固上流必先保漢沔欲固下流必先守淮泗欲固中流必以重兵鎮安陸魏武困於居巢曹丕困於濡須拓跋困於瓜洲苻堅困於淝水皆不得渡左傳昭十七年楚司馬子魚曰我得上流注順江而下易用勝敵吳志魏文帝出廣陵望大江曰彼有人焉未可圖也宋朝郡國名景祐三年正月翰學承旨章得象等評定三等國名今以司封格參訂趙晉梁宋夀升韓襄慶蜀寧光均端嘉潁康恭定建英延以上不封秦秦川齊臨災營丘魏大名燕薊城楚彭城魯曲阜大以上舊陳宛丘吳姑蘇越會稽以於越上舊次今升夏朔方商上洛商於周雒陽漢廣漢唐唐城今泌陽添徐徐方徐土冀冀方信都雍