body:
  text: 玉海卷六十宋王應麟撰藝文銘碑又見紀功銘名也觀器必也正名審用貴乎慎德詩正義曰因其器名書以為戒釋名曰述其功美使可稱名也碑埤也上古封禪樹石埤岳宗廟有碑樹之兩楹事止麗牲未勒勲績而庸器漸闕故後代用碑以石代金同乎不朽釋名曰臣子述君父之功美以書其上後世因焉湯盤銘武王銘見御製碑銘類商銘晉語郭偃曰商之衰也其銘有之曰嗛嗛之德不足就也不可矜而祗取憂也周嘉量銘楛矢銘見弓矢考工記㮚氏為量其銘曰時文思索允臻其極嘉量旣成以觀四國永啟厥後兹器維則疏鬴器之上銘文在模上刻之周金版銘金人銘文選劉孝標論聖賢鏤金版而鐫盤盂注太公金匱曰屈一人之下申萬人之上武王曰請著金版周書大聚解第三十九維武王勝殷撫國綏民乃觀於殷政告周公旦曰嗚呼殷政總總若風草周公曰聞之文考來遠賓廣近有道别陰陽之利相土地之宜營邑制命之曰大聚乃令縣鄙商旅曰能來三室者與之一室之禄以一大夫之祿耕闢闗修道五里有郊十里有井二十里有舍遠旅來至闗人易資舍有委市有五均早暮如一送行逆來振乏救窮以國為邑以邑為鄉以鄉為閭五户為伍以首為長十夫為什以年為長合閭立教以威為長合旅同親以敬為長鄉立巫醫具百藥以備疾災蓄五味以備百草立勤人以職孤立正長以順幼立君子以修禮樂立小人以教用兵立鄉射以習容云云旦聞禹之禁春三月山林不登斧以成草木之長夏三月川澤不入網罟以成魚鼈之長且以并農力勢成男女之功則有生不失其宜萬物不失其性人不失其事天不失其時以成萬財稱賢使能而賢歸之闗市平商賈歸之分地薄歛農民歸之水性歸下民性歸利王若欲來天下民先設其利而民自至譬之若冬日之陽夏日之陰不召而民自來五德旣明民乃知常武王再拜曰允哉乃召昆吾冶而銘之金版藏府而朔之昆吾古之利冶月旦朔省之六韜金板曰太公曰以賢者為人下何人不與文王曰善請著之金板家語孔子觀周入太祖后稷之廟廟堂右階之前有金人三緘其口而銘其背曰古之慎言人也晉潘岳有兩階銅人訓周穆王舂山銘穆天子傳天子觀舂山之上乃為銘疏於玄圃之上以貽後世天子升于奄山乃紀迹于奄山之石而樹之槐眉曰西王母之山奄山即崦嵫山一云紀名迹于弇山之石曰西王母之山集仙錄曰刻石紀迹于弇山之上山海經穆王至崑崙之丘眺鍾山之嶺勒石王母之山紀迹玄圃之上劉勰曰穆王紀迹弇山之石亦碑之意魯林鍾銘宋正考父鼎銘見鼎類左傳襄十九年季武子以所得於齊之兵作林鍾而銘魯功臧武仲曰非禮也夫銘天子令德銘德不銘功諸侯言時計功大夫稱伐夫大伐小取其所得以作彞器銘其功烈以示子孫昭明德而懲無禮也注鑄鍾聲應林鍾因以為銘詩傳作器能銘可以為大夫韓非子先王之賦頌鍾鼎之銘皆畨吾之跡華山之博也文心雕龍夏鑄九鼎周勒楛矢令德之事也呂望銘昆吾仲山鏤庸器計功之義也魏顆景鍾孔悝衞鼎稱伐之類也事始靈后氏象形篆以銘鍾鼎晉景鍾銘見樂器類晉䜛鼎銘衞孔悝鼎銘見鼎鼐類庾信文維師尚父昆吾載寶鼎之銘王命尸臣栒邑傳琱戈之賜吕氏春秋云功名著乎盤盂銘篆著乎壺鑑魯視豐碑衞銘烝彞栒戈考篆魯鼎著銘栒鼎悝銘之欵羽陵汲冢之書秦刻石名山文漢藝文志春秋家秦奏事二十篇秦時大臣奏事及刻石名山文也始皇登名山凡六刻石史記載其詞孫何碑解曰管子稱無懷氏封泰山刻石記功出自寓言書正義曰管子書古之封太山者七十二家夷吾所識十二而已其登封者皆刻石紀號宣王石鼓或曰獵碣延陵墓表俗目為夫子十字碑其事皆不經見始皇刻石頌德亦無勒碑之說古之為碑以識日景節賓揖麗祭牲晉衞恒傳秦李斯工篆諸山及銅山銘皆斯書也禹廟銘後漢郡國志巴郡江州注杜預曰巴國也有塗山華陽國志曰帝禹之廟銘存焉雍丘縣注引曹植禹廟讃金石録有禹廟碑在龍門文中子宿禹廟觀其碑首曰先君獻公所作也其文典而達漢泗水亭碑高帝紀十一年師古注引班固泗水亭碑後郡國志沛有泗水亭亭有高祖碑班固為文并十八侯銘銘曰承累流裔襲唐末風寸木尺土無俟斯亭水經注碑延熹十年立沂任彦升曰配天之迹存乎泗水之上素王之道紀於川之側漢四皓碑文章縁起有漢恵帝四皓碑高士傳高車山上有四皓碑及祠漢恵帝所立漢揚雄銘詩古文苑雄為郎一嵗作繡補靈節龍骨銘詩三章成帝好之方言類銘詩今亡杖或曰繡補䄄褥之靈節靈壽龍骨水車也漢燕然山銘見紀功類紀𡹮嵫勒之罘頌嶧山銘燕然螭蟠龜戴蟲篆鳥章漢三鼎銘水經注睢陽縣漢太尉橋玄廟碑陰有右鼎文建寧三年拜司空又有中鼎文建寧四年拜司徒又有左鼎文光和元年拜太尉鼎名文曰述公之行咨度體則文德銘于三鼎武功勒于征鉞書于碑陰以昭光懿又有鉞文稱是用鏤石假象作兹征鉞軍鼓陳之于東階亦以昭公之文武之勲焉石鼔仍存鉞今不知所在漢冠葢里銘水經注宜城縣有太山山下有廟漢末多士其中刺史二千石卿長數十人朱軒華葢同會於廟下荆州刺史行部見之雅歎其盛號曰冠葢里國史志襄陽有冠葢里刻石銘之其辭曰峨峨南岳烈烈離明寔敷儁乂君子以生惟此君子作漢之英德為龍光聲化鶴鳴宋伏曼容為南海太守至石門作貪泉銘漢李尤圍棋銘馮衍車銘藝文類聚李尤圍棋銘馮衍車銘杖銘刀陽銘刀陰銘杯銘太平御覽李尤博銘壺籌銘文章流别傳李尤為銘自山河都邑至于刀筆笇契無不有銘而文多穢病李尤集序尤好為銘讃門階户席莫不有述初學記馮衍席前右後右銘文選注有馮衍爵銘文章流别曰後世器銘之佳者有崔瑗几銘朱公叔鼎銘王粲硯銘周顯德六年王仁𥙿進回文金鏡銘漢銘論蔡邕銘論曰昔肅慎納貢銘之楛矢所謂天子令德也黄帝有巾几之法孔甲有槃盂之誡殷湯有丼誓之勒䜛鼎有丕顯之銘武王踐阼咨于太師作席几楹杖器械之銘十有八章周廟金人緘口書背銘之以慎言所以勉于令德也呂尚作周太師封于齊其功銘于昆吾之冶獲寶鼎于美陽仲甫有補衮闕式百辟之功周禮司勲凡有大功銘之太常所謂諸侯言時計功也宋正考父三命滋益恭而莫侮其國衞孔悝之祖莊叔隨難漢陽左右獻公衞國賴之皆銘于鼎晉魏顆獲秦杜回于輔氏銘功于景鍾所謂大夫稱伐也近世以來咸銘于碑文選漏刻銘注蔡邕銘論曰武王作席几楹杖雜銘呂尚銘昆吾鼎黄帝有巾几之法孔甲有盤盂之戒德非此族不在銘典王簡栖碑注引銘論曰碑在宗廟兩階之間近代以來咸銘于碑晁公武曰蔡邕所著文章百四篇今錄止存九十篇而銘墓居其半或曰碑或曰銘或曰神誥或曰哀讃其實一也自云為郭有道碑獨無愧辭則其他可知也郭林宗陳仲弓碑見文選魏九寶銘典論文帝為三劒三刀三匕首因姿定名以銘其拊此即九寶其詳曰選兹良金命彼國工精而鍊之至于百辟以為三劒三刀三匕首因姿定名以銘其拊惜乎不遇薛燭青萍也其三劒一曰飛景長四尺二寸二曰流采長四尺二寸三曰華鋌色似綵虹長四尺二寸其三刀一曰靈寶長四尺二寸似靈龜二曰含章采似丹靈長四尺四寸三曰素質長四尺三寸刀身而劒鋏其三匕首一曰清剛長二尺三寸色似堅冰二曰揚文長二尺一寸重一斤六兩曜似朝日三曰龍鱗狀似龍文文心雕龍魏文九寶器利辭鈍初學記文帝露陌刀銘文選注典論有劒銘魏寶器銘見小學晉衞恒傳魏氏寶器銘題皆韋誕書晉劒閣銘張載傳父收蜀郡太守太康初至蜀省父道經劒閣載以蜀人恃險好亂因著銘以作誡曰巖巖梁山積石峩峩遠屬荆衡近綴岷嶓南通邛僰北達襃斜狹過彭碣高踰嵩華惟蜀之門作固作鎮是曰劒閣壁立千仭窮地之險極路之峻世濁則逆道清斯順一人荷㦸萬夫趑趄形勝之地非親勿居興實由德險亦難恃自古及今天命不易慿阻作昏尠不敗績公孫旣滅劉氏銜璧覆車之軌無或重跡勒銘山阿敢告梁益益州刺史張敏見而奇之乃表上其文武帝遣使鐫之於劒閣山隋文帝毁劒閣之路立銘垂戒唐栁宗元作劒門銘梁石闕銘梁典天監七年正月戊戌詔曰今禮盛化光役務簡便便可營建象闕以表舊章於是選匠量功䥴石為闕陸倕吳郡人仕至太常卿詔使為漏刻石闕二銘冠絕當世二銘見文選吾刻漏銘叙曰寧可多謝曾水有陋昆金字不傳銀書未勒唐醴泉銘見地瑞類魏徵唐砥柱銘二門勒銘鐵㦸銘太宗紀貞觀十一年九月丁亥河溢壞陜州河北縣毁河陽中潬幸白司馬坂觀之賜瀕河遭水家粟帛十二年二月癸亥如河北縣觀底柱書注底柱山名河水分流包山而過山見水中若柱然在西虢之界舊紀二月癸亥觀砥柱勒銘以紀功德通典陜州硤石縣底柱山太宗命魏徵勒銘或云銘乃特進魏徵之辭有仰臨底柱北望龍門茫茫禹迹浩浩長源之語命有司勒銘會要十二年二月幸河北縣勒銘底柱地理志陜州峽石縣有底柱山山有三門河所經太宗勒銘十四年命正字薛純書之平陸縣本河北太守李齊物開三門通漕得古刀有篆文曰平陸天寶元年更名齊物傳為陜州刺史開底柱通漕路發重石下得古鐵㦸若鏵然銘曰平陸上之詔以名縣陜縣茅津貞觀十一年造浮梁又使丘行恭開南渠唐朝覲碑銘崔融傳武后幸嵩高見融銘啓母碣歎美之及已封即命銘朝覲碑梁昇卿工八分書東封朝覲碑為時絶筆舊史貟半千傳則天封中嶽半千撰封禪四壇碑十二首以進唐彞尊銘崔渙傳亳州司功還調於是入判者千餘吏部侍郎嚴挺之施特榻試彞尊銘曰子清廟器故以題相命唐孔子廟碑文選注沂水南有孔子舊廟漢魏以來列七碑二碑無字選注有尼父頌會要大中五年十一月祭酒馮審奏孔子廟堂碑太宗建立睿宗書額金石録武德元年十二月虞世南撰幷書唐棠棣碑循吏傳賈敦頤永徽中遷洛州發姦擿伏下無能欺咸亨初弟敦實為洛州長史亦寛惠人心懷向始洛人為敦頤刻碑大市旁及敦實入為右庶子人復為立碑其側故號棠棣碑兩京記碑建於東都唐泰華二山碑安金藏傳玄宗屬其事於史官詔鑱其名於泰華二山碑以為榮通鑑開元二十年三月賜爵代國公於東西嶽立碑以銘其功唐韋丹刻功碑韋丹傳憲宗時韋丹為江西觀察使計口受俸罷八州冗食者教民陶瓦置南北市為營以舍軍築隄扞江長十二里為陂塘五百九十八所灌田萬二千頃大和中裴誼上言為丹立祠堂刻石紀功不報宣宗讀元和實錄見丹政事卓然與宰相語元和治民孰第一大中一年正月周墀對臣嘗守江西韋丹有大功德被八州没四十年老幼思之不忘乃詔觀察使紇干泉上丹功狀命刻功于碑乙亥詔史館修撰杜牧撰遺愛碑擢其子宙為御史元和中韓愈為丹銘曰爰及江西功德具全子宙亦為江西觀察使政簡易南方稱為世官韓愈傳父仲卿為武昌令有美政旣去縣人刻石頌德淳化公政銘五年九月真宗以壽王尹京呉王元傑獻公政銘元豐黄樓銘陳師道撰蔡邕銘論見上文心雕龍飛廉有石槨之錫靈公有蒿里之諡莊子博物志石槨銘云靈公奪之我里趙靈勒跡於畨吾秦昭刻博於華山趙主父令工施鈎梯而緣畨吾刻疎人迹其上而勒之曰主父嘗遊於此秦昭王令工施鈎梯而上華山以松栢之心為博勒之曰昭王嘗與天神博於此始皇勒岳政暴而文澤若班固燕然之勒見後漢書張昶華陰之碣見古文苑文選注有張昶華山堂闕銘序亦盛矣蔡邕銘思獨冠古今橋公之鉞吐納典謨橋玄黄鉞銘見藝文類聚朱穆之鼎全成碑文文章流别云見上敬通雜器馮衍見上準矱戒銘崔駰品物讃多戒少李尤積篇義儉辭碎魏文九寶器利辭鈍唯張載劒閣其才清采事始無懷氏封泰山刻石紀功此碑之始述異記崆峒山中有堯碑禹碣皆籀文檀弓注豐碑斵大木為之形如石碑桓楹形如大楹祭義祭之日牽牲入廟門麗于碑聘禮賓自碑内聽命又曰東面北上碑南宫必有碑所以識日景知陰陽也孫何曰古所謂碑乃葬祭饗聘之際所植一大木耳其字從石取其堅且久易之以石者後儒所增耳六經所載無刻石之事又曰碑非文章之名也葢後人假以載其銘耳陸機曰碑披文而相質則本末無據焉王儉曰石誌不出典禮宋元嘉中顔延之為王球石誌歐陽公曰後漢以來始有冢墓碑文門生故吏相與立碑頌徳頌頌者容也所以美盛德而述形容也朱文公曰頌容古字通有焱氏頌莊子天運篇北門成問於黄帝曰帝張咸池之樂於洞庭之野云云帝曰天機不張而五官皆備此之謂天樂無言而心說故有焱氏為之頌曰聽之不聞其聲視之不見其形充滿天地苞裹六極注此乃無樂之樂樂之至也孔子歌焱氏之風黄帝六德頌類要黄帝妃嫫母訓宮人而有淑德奏六德之頌黄帝龍袞頌太平御覽夏侯玄辨樂論曰昔伏羲氏因時興利教民田漁天下歸之時則有網罟之歌神農繼之教民食穀時則有豐年之詠黄帝備物始垂衣裳時則有龍衮之頌拾遺記軒轅始造書契服冕垂衣故有衮龍之頌文心雕龍帝嚳之世咸墨為頌以歌九招虞樂頌董仲舒傳虞氏不為政久矣然而樂頌遺風猶有存者是以孔子在齊而聞韶也商名頌魯語閔馬父曰正考父校商之名頌十二篇於周太師以那為首注名頌頌之美者鄭司農云自考父至孔子又亡其七篇故餘五那烈祖玄鳥長發殷武五篇十六章百五十四句史記襄公脩行仁義其大夫正考父美之作商頌注裴駰引韓詩章句美襄公樂記注商宋詩周成王冠頌見冠禮類家語冠頌周文公頌周語祭公謀父曰周文公之頌曰載戢干戈載􅐤弓矢詩正義時邁篇外傳引思文時邁皆言周文公之頌國語云周文公之為頌曰思文后稷克配彼天此篇周公所自歌與時邁同春秋正義常棣之詩周公所作周語曰周文公之詩呂氏春秋周公旦乃作詩曰文王在上於昭于天以繩文王之德王襃講德論周公詠文王之德而作清廟史記樂書成王作頌推已懲艾周頌三十一篇多周公所定魯頌四篇商頌五篇漢高祖頌高紀賛劉向頌高祖云漢帝本系出自唐帝降及于周在秦作劉涉魏而東遂為豐公志劉向賦二十五篇漢高祖著錄勲臣頌祭遵傳博士范升上疏高祖著錄勲臣頌其德美晉陸機作漢高功臣頌自蕭何至侯公三十一人漢孝景皇帝頌志李思孝景皇帝頌十五篇賦家漢長安都國頌淮南王安傳入朝獻頌德及長安都國頌每宴見談說得失及方技賦頌漢聖主得賢臣頌中和樂職宣布詩王襃傳宣帝修武帝故事講論六藝羣書博盡奇異之好神爵五鳳間天下殷富數有嘉應上頗作歌詩欲興協律之事益州刺史王襄欲宣風化於衆庶聞王襃有俊才請與相見使襃作中和樂職宣布詩選好事者令依鹿鳴之詩習而歌之時氾鄉侯何武選在歌中武等學長安歌太學下轉而上聞宣帝召見武等觀之皆賜帛謂曰此盛德之事吾何以當之襃旣為刺史作頌又作其傳益州刺史因奏襃有軼材上乃徵襃旣至詔襃為聖主得賢臣頌唐志襃集五卷漢甘泉洞簫頌王襃傳太子喜襃所為甘泉及洞簫頌令後宮貴人左右皆誦讀之宣帝詔襃等之太子宮虞侍太子朝夕讀誦奇文及所自造文選有洞簫賦類聚有甘泉宮頌漢碧雞頌又見郊祀文選劉孝標論注王襃碧雞頌曰持節使者王襃謹拜南崖敬移金精神馬縹一作剽碧之雞云云歸來歸來漢德無疆廣乎唐虞澤配三皇黄龍見兮白虎仁歸來歸來可以為倫歸來翔兮何事南荒漢趙充國畫頌趙充國傳以功德與霍光等列畫未央宮成帝時西羌有警上思將帥之臣追美充國乃召黄門郎揚雄即充國圖畫而頌之曰明靈惟宣戎有先零先零猖狂侵漢西疆漢命虎臣惟後將軍整我六師是討是震旣臨其域諭以威德有守矜功謂之弗克請奮其旅于䍐之羌天子命我從之鮮陽營平守節屢奏封章料敵制勝威謀靡亢遂克西戎還師於京鬼方賓服罔有不庭昔周之宣有方有虎詩人歌功乃列于雅在漢中興充國作武赳赳桓桓亦紹厥後漢列女傳頌志劉向所序六十七篇新序說苑世說列女傳頌圖也漢光武受命中興頌東平王蒼傳顯宗永平十五年春行幸東平帝以所作光武本紀示蒼顯宗作光武本紀蒼因上光武受命中興頌帝甚善之以其文典雅特令校書郎賈逵為之訓詁東觀記上問校書郎此與誰等皆言類相如揚雄史岑文選東平齊聲於揚史魏志昔唐叔歸禾東平獻頌漢德頌傳臨邑侯復北海興王之子永平中著漢德頌復子騊駼與從兄平望侯毅並有才學毅元初元年上漢德論并憲論十二篇又曹朔作漢頌四篇漢神爵頌賈逵傳顯宗永平中東觀記永平十四年有神爵集宮殿官府冠羽有五采色帝異之以問臨邑侯劉復復不能對薦逵博學多識帝乃召逵問之對曰昔武王終文之業鸑鷟在岐宣帝威懷夷狄神雀仍集此胡降之徵也因敕蘭臺給筆札使作神雀頌拜為郎唐志逵集二卷論衡永平中神雀羣集孝明詔上神雀頌百官上頌文比瓦石唯班固賈逵傅毅楊終侯諷五頌金玉孝明覽焉西域都䕶班超獻大雀詔曹大家作頌隋許善心亦有神雀頌漢顯宗頌傅毅傳建初中肅宗博召文學之士以毅為蘭臺令史拜郎中與班固賈逵共典校書追美孝明皇帝功德最盛而廟頌未立乃依清廟作顯宗頌十篇奏之由是文雅顯於朝廷唐志毅集五卷文選注引傅毅顯宗頌曰蕩蕩川瀆既瀾且清又引杜篤衆瑞頌傅毅明帝頌表太平御覽引傅毅西征頌晉袁宏見傅毅作顯宗頌乃作頌九章頌簡文之徳上於孝武帝漢四巡頌廣成頌章帝記建初七年冬十月癸丒西巡狩幸長安丙辰祠高廟遂有事於十一陵以中牢祠蕭何霍光岐山得銅器形似酒樽獻之又獲白鹿帝曰上無明天子下無賢方伯斯器曷為來哉又幸長平御池陽宮每有所到幸輒會郡縣吏人勞賜作樂十二月丁亥車駕還宮八年十二月東巡狩幸陳留梁國淮陽潁陽元和元年八月丁酉南巡狩詔所經道上無得設儲峙賜鰥寡孤獨人不能自存者粟人五斛九月辛丒幸章陵祠舊宅冬十月乙未進江陵詔廬江太守祠南岳又詔長沙太守祠長沙定王舂陵侯還幸宛十一月乙丒車駕還宮二年二月丙辰東巡狩乙丒耕于定陶使使者祠堯於成陽靈臺成陽縣有堯母慶都墓辛未幸泰山柴告岱宗有黄鵠三十經祠壇進幸奉高壬申宗祀五帝於汶上明堂癸酉告祀二祖四宗大會内外羣臣丙子赦天下復博奉高嬴無出今年田租戊寅進幸濟南三月己丒進幸魯祠東海共王陵庚寅祠孔子于闕里及七十二弟子賜襃成侯及諸孔男女帛進奉祠陵四月乙夘還宮帝東巡鳳皇黄龍并集楊終賛頌嘉瑞上述祖宗洪業十五章上之三年正月丙申北巡狩辛丒帝耕于懷二月戊辰進幸中山遣使祠北岳癸酉幸元氏祠光武顯宗於縣舎正堂明日又祠顯宗於始生堂皆奏樂三月丙子詔高邑令祠光武於即位壇復元氏七年徭役辛夘還宮章和元年八月南巡狩幸梁沛彭城壽春汝陰賛曰儒館獻歌謂崔駰游太學時上四巡等頌戎亭虛候崔駰傳元和中肅宗始修古禮巡狩方岳駰上四巡頌以稱漢德辭甚典美文多故不載帝嗟歎之謂侍中竇憲曰卿寧知崔駰乎對曰班固數為臣言之然未見也帝曰公愛班固而忽崔駰此葉公之好龍也試請見之崔駰集有南北東西四巡頌隋唐志駰集十卷駰東封頌曰伊漢中興三葉矩坤度以範物規乾則以陶鈞重雍襲熈代増其德乘輿登大靈之威輅駕太一之象車升九龍之華旗建掃霓之旌旄班固數入讀書禁中每行巡狩輒獻上賦頌固有東巡南巡頌見類聚張衡東巡誥惟二月初吉帝將狩于岱岳展義省方備法駕届靈宮是日也有雙鳳集千臺壬辰祀上帝于明堂帝曰上帝有靈不替朕命誕敢不祗承馬融傳永初四年校書東觀鄧太后臨朝俗儒以為文德可興武功宜廢遂寢蒐狩之禮息戰陣之法故猾賊縱横乘此無備融以為文武之道聖賢不墜五材之用無或可廢元初二年上廣成頌以諷諫述蒐狩之義廣成苑在今汝州梁縣西延光三年東巡岱宗融上東巡頌帝奇其文唐志融集五卷漢頌從臣嘉頌論衡宣漢篇觀杜撫班固等所上漢頌頌功德符瑞汪濊深廣滂沛無量踰唐虞入皇域西都賦采游童之歡謠第從臣之嘉頌注宣帝頗好神仙王褒張子僑等並侍詔所幸宫館輒為歌頌第其高下以差賜帛漢孝竹頌秦中記一云述異記章帝三年子母笱生白虎殿前時謂之孝竹羣臣獻孝竹頌詩義曰南中生子母竹今慈竹是也漢百官頌見樂舞類漢高士頌梁鴻傳仰慕前世高士而為四皓以來四十四人作頌因東出闗過京師作五噫之歌唐志鴻集二卷文選注引梁鴻安丘嚴平頌曰無營無欲澹爾淵清崔琦有四皓頌漢胡廣黄瓊圖畫頌見圖繪名臣類漢出師頌文選史孝山出師頌西零不順東夷遘逆乃命上將授以雄㦸威威上將是天所啓允文允武明詩悅禮鼓無停響旗不蹔褰澤霑遐荒功銘鼎鉉注涼部叛羌搖蕩西州詔鄧騭將兵擊之車駕幸平樂觀餞送騭西屯漢陽征西校尉任尚與羌戰大敗之遣中郎將迎拜騭為大將軍旣至大會羣臣賜以束帛乘馬流别集及集林載史岑和熹鄧后頌并序魏皇子生頌初學記陳王曹植皇子生頌嘉月令辰篤生聖嗣慶由一人方國作喜魏宗廟詩頌宋樂志魏王肅私造宗廟詩頌十二篇不被歌晉太康頌摰虞傳除聞喜令時武帝留心政道又吳冦新平天下乂安虞上太康頌以美晉德其辭曰云云邈矣聖皇參乾兩離陶化以正取亂以奇洋洋四海率禮和樂穆穆宮廟歌雍詠鑠光天之下莫匪帝略窮髪反景承正受朔喬山惟嶽望帝之封猗歟聖帝胡不封哉唐志虞集十卷隋志九卷張載元康頌見文選注左貴嬪名芬帝重芬詞藻每有方物異寶必詔為賦頌晉釋奠頌潘尼傳元康三年閏月丙申太子入學釋奠太子舍人潘尼上釋奠頌其辭曰元康元年冬十二月上以皇太子富於春秋而人道之始莫先於孝悌初命講孝經於崇正殿至三年春閏月將有事于上庠釋奠于先師禮也越二十四日丙申侍祠者旣齊輿駕次于太學太傅在前少傅在後云云隋唐志尼集十卷晉袁宏三國名臣頌袁宏傳為三國名臣頌荀文若諸葛孔明等二十餘人見文選云序賛七魏九人蜀四人吳人又作北征賦皆其文之高者隋志宏集十五卷梁儲德頌梁書上黄侯蕭曄兼宗正卿簡文居監撫獻儲德頌唐藉田三元頌又見藉田元會類岑文本傳貞觀三年太宗既藉田又元日朝羣臣文本為秘書郎奏藉田三元頌二篇文致華贍志文本集六十卷頌見初學記晉劉臻妻陳氏正旦獻椒花頌唐釋奠頌孔穎達傳太宗幸太學觀釋菜貞觀十四年二月命孔頴達講經上釋奠頌詔襃美穎達集五卷唐文皇帝頌張文琮傳永徽初獻文皇帝頌太宗優制襃美賜絹百匹時為亳州刺史顔師古有聖徳頌李百藥有皇徳頌見初學記唐孝德頌狄仁傑頌臨川公主上孝德頌高宗詔襃之吕温狄仁傑頌曰取日虞淵洗光咸池潛授五龍夾之以飛世以為名言又作凌煙勲臣頌唐洛出寶圖頌崔融傳融為文華婉其洛出寶圖頌尤工融集六十卷志别集崔融寶圖賛一卷王起注舊史富嘉謨作雙龍泉頌千燭谷頌唐龍池頌宗子璆傳襃信王初帝賜第隆慶坊坊南之地變為池中宗嘗泛舟厭其祥帝即位作龍池樂張九齡撰龍池頌刋石興慶宮西天寶元年五月宗子以為不稱盛德更命璆為頌建花萼樓北會要五王子宅景龍末有龍池涌出日浸廣望氣者言有天子氣中宗泛舟厭之明皇以為興慶宮開元二年詔右拾遺蔡孚獻龍池篇公卿已下百三十篇付太常考其辭合音律者為樂章録姚元崇沈佺期等十首十六年置壇十八年十二月二十九日有龍見于池敕太常韋縚草祭儀縚奏祭用二月牲用少牢樂用鼓鍾奏姑洗歌南呂二十三年五月一日宗子請於興慶宮龍池建聖德頌以紀符命望令皇太子書張九齡為文寧王憲題額從之舊紀開元二十三年五月戊寅宗子請率月俸於興慶宮建龍池聖德頌天寶二年五月五日重建襃信王璆撰太子書題額五行志開元二十三年十二月乙巳龍池聖德頌石自鳴集賢註記開元二十七年四月光祿卿襃信郡王璆進龍池頌建立訖梁上有黄芝之瑞唐封禪壇頌朝覲壇頌並見封禪類唐鶺鴒頌見麟德殿詩注常棣脊令雝渠也飛則鳴行則搖不能自舍爾雅作䳭鴒左傳同唐金鑾殿奏頌李白傳天寶初召見金鑾殿論事奏頌一篇文苑英華云上宣唐鴻猷篇上重之唐慶鴻名頌獨孤及撰唐興百三十有八載春正月請増明號二月乙酉朝太清宮丙戌享太廟丁亥朝羣臣于蓬萊前殿展禮奉䇿䖍受大號穆穆閟宮敷時繹思天有成命孝孫受之鋪衍下土報功神祇我瑞如山我福孔夷誕受鴻名載揚緝熈風動雲行雨飛露垂恭已南面無為之師永錫多祜萬壽無期唐中興頌文粹元結作大唐中興頌曰天寶四年安祿山陷洛陽明年陷長安天子幸蜀太子即位於靈武明年皇帝移軍鳳翔其年復兩京於戱前代帝王有盛德大業者必見於歌頌今若歌頌大業刻之金石非老於文學者其誰宜為頌曰噫嘻前朝孽臣姦驕為昏為妖邊將騁兵毒亂國經羣生失寧大駕南巡百寮竄身奉賊稱臣天將昌唐繄睨我皇匹馬北方獨立一呼千麾萬旟戎卒前驅我師其東儲皇撫戎蕩攘羣㓙復服指期曾不踰時有國無之事有至難宗廟再安二聖重驩地闢天開蠲除妖災瑞慶大來盛德之興山高日昇萬福是膺能令大君聲容沄沄不在斯文湘江東西中直浯溪石崖天齊可磨可鐫刋此頌焉何千萬年金石錄顔真卿正書大厯六年六月楊炎作鳳翔出師紀功頌唐太階頌文粹梁肅鄴侯李泌文集序至德初宣皇以元良受禪公則獻太階頌昭纂堯之道唐無疆頌李華述列聖為無疆頌高祖元太宗烈高宗康中宗興睿宗德玄宗文肅宗孝今上昭唐親政頌呂温皇帝親庶政頌天道福謙我則奉天人生在勤我則率先求人之瘼思國之經年亦豐止御膳不馨夜如何其皇寢未寧偃武修文大和氤氲海不揚波天無纎氛鳥章之長椎髻之君會朝明庭其從如雲唐新羅織錦頌見内附類唐驃國獻樂頌開州刺史唐次開寶聖功頌太祖克澤潞下維揚湖湘得荆渚收劒南取嶺表及平江左武功震耀開寶九年丙子嵗正月戊辰朔受朝乾元殿降王在列聲明大備知制誥扈蒙上聖功頌以述其事赫矣昌運巍乎成功大荒夷夏高格旻穹始肅禋祀蒼璧黄琮爰命將帥玈矢彤弓乃定湘楚乃服巴卭乃平嶺表乃殄江東四隩旣宅八表攸同皇明所被如日之融帝業之盛如嶽之崇六合之内其樂邕邕萬方之外其來憧憧慕我慶澤熙我薫風闕里諸彥康衢游童咸歌大化悉願東封耀德如是儲休永隆臣蒙作頌播告寰中詔襃之本傳開寶武功仁德頌二年十一月壬戌太常博士董淳進太平興國南郊頌三年王操獻南郊頌稱㫖十一月己酉以為太子中允太平興國平晉頌四年五月甲申太原平直史館宋白從征因獻平晉頌太平興國初刁衎撰聖德頌端拱聖德頌梁鼎端拱初獻聖德徽號頌萬餘言端拱秘閣頌端拱初新建秘閣命中書試崔遵度作頌一首擢著作佐郎太宗議封禪趙孚上封禪頌咸平幸太學頌劉鍇咸平二年擢進士第嘗獻幸太學頌真宗中夜觀書得鍇頌頗嘉賞之出以示輔臣召試直史館景德五頌夏竦進平邊廣文朝陵廣農周伯星五頌并大中祥符頌明鎬上真宗頌四十六篇詔奬之祥符頌元年正月甲申以錢惟演知制誥獻祥符頌故擢之三年一月壬辰直史館陳靖上祥符超古頌又夏竦進太中祥符頌祥符河清頌三年十一月庚子陜州靈寶縣言黄河清十二月庚戌寶鼎縣黄河再清上作七言詩賜近臣畢和集賢校理晏殊上河清頌宋元嘉中河濟清鮑照作河清頌祥符汾陰朝覲壇頌五年三月初命王旦撰祀汾陰壇頌王欽若撰朝覲壇頌陳堯叟撰親謁后土廟頌庚戌旦等以頌成進邑封天禧惟德動天頌元年十月丁夘集賢校理晏殊以嵗經蝗旱上軫聖慮災沴已息稼穡大稔獻惟德動天頌詔襃之序曰雲漢興詠周宣厲兢業之懷雩場改祈漢明述哀戚之詔雨螽墜地祲孽坐銷原菽穭生良苗自熟天禧聖德頌五年五月太常博士鄭向上天聖文明頌四年九月一日程戡進文明頌二年胡宿作烈文即政頌明道藉田頌皇祐明堂頌見藉田及明堂類慶厯聖德頌三年四月直講石介作慶厯聖德頌凡九百六十字言進賢退姦之不易曰明與斷宋頌仁宗時石介甫取太祖太宗真宗仁宗功德之尤著見者為宋頌九篇一曰皇祖太祖初用師伐潞州殺李筠伐揚州滅李重進也二曰聖神太祖出師援長沙且假道徑遂取荆潭也三曰湯湯太祖收蜀取孟昶也四曰莫醜太祖用周渭之䇿命潘美取廣州也五曰金陵太祖命師取李煜也六曰聖文錢俶以吳越歸也七曰六合雷聲太宗親征太原取劉繼元也八曰聖武戎犯我疆至于澶淵真宗親臨六師射殺戎首軍不得歸乞盟請和也九曰明道今皇帝獨臨軒墀聽決萬幾睿謨聖政赫然日新也惟帝之道與時語黙靜則坤闔動則乾開十年深宮不有其權今日南面退姦進賢德與辭表裏功與文相埒然後奮為宏休摛為英聲昭為烈光暐暐曄曄如日之華鏗鏗訇訇如雷之行暢於無前揚於無上江浸海流天高地厚不有窮盡張方平為宋頌十五章上下二什天假之什八篇繫之先帝日之初升之什七篇繫之今上作於再臨軒錄士之春天假先帝封岱薦諡告祖宗也大定祀烈祖也曰嗟祀太宗也報成告上帝上岱宗封也有北北鄙始賓也有諶上帝天錫寶書也祈汾陰祀后土也龍登于天升陪京營祖廟也日之初升上始即政也天監有事南郊也民懷母后佑臨御也皇造祀真宗也有浚者泉大袷祖宗也載耜修千畝也成重民政也宋祁有皇帝神武頌皇祐聖政惟公頌皇祐手詔禁貴戚近習私謁王疇獻聖政惟公頌詔奬之遂召試直秘閣嘉祐袷享受釐頌四年十二月十五日磁州防禦使承亮上袷享受釐頌詔奬之梅堯臣袷禮頌聖德詩曰溥哉孝享將事于寧文武卿士冠劒在庭帝入靈宮左撞黄鍾升階置玉日氣曈鴻鴻鴻杲杲氣駁除掃宿于太宫月星皓皓世滋進恭謝禮成頌世準進鼎頌皇祐中紹興聖德頌淳熙中興聖德頌紹興十三年十一月一日王仲嶷上紹興聖德頌詔復職淳熙七年二月二十七日陳岩肖上中興聖德頌宣付史館十年五月文林郎李揆上頌堯賦孝宗初崔端詩作紹隆聖德詩二百七韻具載二聖傳授之盛淳熙明堂頌見明堂文心雕龍昔帝嚳之世咸墨為頌以歌九韶自商以下文理允備頌主告神義必純美文章流别論曰頌詩之美者也魯以公旦次編商人以前王追録斯乃宗廟之正歌非饗讌之恒詠也商頌非以成功告神其體異於周頌魯頌詠僖公功徳纔如變風之美者耳又與商頌異至於秦政刻文爰頌其徳見史記漢之恵景李思孝景帝頌十五篇亦有述容若夫子雲之表充國見漢書孟堅之叙載侯竇融仲武之美顯宗傅毅作顯宗頌十篇史岑之述熹后流别集及集林載史岑和熹鄧后頌并序或擬清廟或範駉那至於班傅之北征西逝變為序引班固傅毅竇將軍北征頌又班固東巡南巡頌馬融之廣成上林雅而似賦見本傳崔瑗文學蔡邕樊渠瑗南陽文學頌蔡邕京兆樊恵渠頌並見藝文類聚後漢郡國志引蔡邕作樊陵頌陳思所綴以皇太子為標皇子生頌見初學記皇太子頌見類聚陸機積篇唯功臣最顯見文選原夫頌惟典雅辭必清鑠敷寫似賦而不入華侈之區敬慎如銘而異乎規戒之域文章流别論班固為安豐戴侯頌史岑為出師頌和熹鄧后頌與魯頌體意相類揚雄趙充國頌頌而似雅傅毅顯宗頌文與周頌相似而雜以風雅之意若馬融廣成上林之屬純為今賦之體而謂之頌失之遠矣玉海卷六十
