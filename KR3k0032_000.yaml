body:
  text: 玉海附辭學指南類書類提要臣等謹案玉海二百卷附辭學指南四卷宋王應麟撰應麟有鄭氏周易注已著録是書分天文律憲地理帝學聖文藝文詔令禮儀車服器用郊祀音樂學校選舉官制兵制朝貢宫室食貨兵捷祥符二十一門每門各分子目凡二百四十餘類宋自紹聖置宏辭科大觀改辭學兼茂科至紹興而定為博學宏辭之名重立試格於是南宋一代通儒碩學多由是出最號得人而應麟尤為博洽其作此書即為詞科應用而設故臚列條目率巨典鴻章其採録故實亦皆吉祥善事與他類書體例迥殊然所引自經史子集百家傳記無不賅具而宋一代之掌故率本諸實録國史日厯尤多後來史志所未詳其貫串奧博唐宋諸大類書未有能過之者何焯評點困學紀聞動以詞科詆應麟特故為大言不足信也其書元時嘗刋於慶元路板已久佚今江寧有南京國子監刋本以應麟所著詩考詩地理考漢藝文志考通鑑地理通釋王會篇解漢制考踐阼篇急就篇解小學紺珠姓氏急就篇周易鄭注六經天文編通鑑答問等書附梓於後案明貝瓊清江集有所作應麟孫王原墓志稱應麟著玉海未脫藁而失後復得之中多闕誤厚考究編次請于閫帥鋟梓并他書十二種以傳據此則諸書附梓實始於元代惟瓊稱慶元初刻之時附書十二種而今為十三種慶元刋書原序亦言公書鋟于郡學者凡十有四玉海其一則十三種為不誤或清江集傳寫之誤歟又卷首載浙東道宣慰司刋書牒文稱玉海實二百卷而今本乃合辭學指南為二百四卷婺郡文學李桓序所列卷目已與今同疑即當時校刻者所附入相沿已久今亦仍之至他書之附刻者則各從其類别著于録焉其曰玉海者本於張融集名實則仿梁武所集金海之例而變其稱也乾隆四十六年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書子部十一玉海目録類書類卷一天文天文圖卷二天文天文書卷三天文天文書卷四天文儀象卷五天文圭景卷六律厯律呂卷七律厯律呂卷八律厯度量衡卷九律厯厯法卷十律厯厯法卷十一律厯漏刻卷十二律厯時令迎氣讀時令卷十三律厯改元卷十四地理地理圖卷十五地理地理書卷十六地理異域圖書京輔卷十七地理郡國卷十八地理郡國卷十九地理州鎮卷二十地理山川户口縣卷二十一地理河渠卷二十二地理河渠卷二十三地理陂塘堰湖隄埭卷二十四地理泉井道塗關塞卷二十五地理標界議邊卷二十六帝學帝學講經史附卷二十七帝學經筵燕賜觀書觀御製御書卷二十八聖文御集雜御製卷二十九聖文御製詩歌卷三十聖文御製詩卷三十一聖文御製賦御製碑銘御製論卷三十二聖文御製針贊頌御製記序御製諭述卷三十三聖文御書卷三十四聖文御書卷三十五藝文易卷三十六藝文易擬易附卷三十七藝文書卷三十八藝文詩卷三十九藝文三禮卷四十藝文春秋卷四十一藝文續春秋論語孝經卷四十二藝文經解卷四十三藝文經解總六經讎正五經卷四十四藝文小學卷四十五藝文小學卷四十六藝文古史正史卷四十七藝文雜史編年卷四十八藝文實録記注卷四十九藝文政要寶訓聖政附論史卷五十藝文譜牒卷五十一藝文玉牒圖譜典故會要卷五十二藝文書目卷五十三藝文諸子卷五十四藝文總集文章承詔撰述卷五十五藝文類書著書别集附賜書卷五十六藝文圖卷五十七藝文圖繪名臣記志卷五十八藝文傳録卷五十九藝文詩歌附賦針卷六十藝文銘頌卷六十一藝文奏疏卷六十二藝文論序贊經卷六十三藝文藝術卷六十四詔令詔䇿卷六十五詔令律令卷六十六詔令律令卷六十七詔令赦宥刑制卷六十八禮儀禮制卷六十九禮儀禮制卷七十禮儀朝儀卷七十一禮儀元會卷七十二禮儀册禮卷七十三禮儀燕享鄉飲附卷七十四禮儀上壽養老卷七十五禮儀射卷七十六禮儀耕藉卷七十七禮儀觀稼務農附親蠶卷七十八車服車服制度車輿卷七十九車服車輿卷八十車服鹵簿儀仗行幸卷八十一車服冕服卷八十二車服冕服冠禮卷八十三車服旌旗卷八十四車服印綬璽卷八十五器用符節卷八十六器用佩帶笏卷八十七器用圭璧玉器附卷八十八器用鼎鼐卷八十九器用尊彛爵附籩豆卷九十器用賜豫器物敧器招諫卷九十一器用屏障雜器卷九十二郊祀郊祀卷九十三郊祀郊祀恭謝附卷九十四郊祀郊祀恭謝附北郊后土附卷九十五郊祀明堂三雍附卷九十六郊祀明堂卷九十七郊祀宗廟禘祫附親饗附卷九十八郊祀封禪卷九十九郊祀社稷祀日月星祠蠟祭禖祀卷一百郊祀祠宫觀附卷一百一郊祀祠壇卷一百二郊祀羣祀卷一百三音樂樂樂書附蕪樂附卷一百四音樂樂卷一百五音樂樂卷一百六音樂樂章御製樂章附卷一百七音樂樂舞卷一百八音樂夷樂卷一百九音樂樂器卷一百十音樂雜樂器卷一百十一學校學校辟雍附卷一百十二學校學校卷一百十三學校視學釋奠卷一百十四選舉科舉卷一百十五選舉科舉卷一百十六選舉科舉卷一百十七選舉銓舉卷一百十八選舉考課卷一百十九官制官名卷一百二十官制三公宰相卷一百二十一官制臺省卷一百二十二官制六卿卷一百二十三官制九卿屬官附卷一百二十四官制九卿屬官附寺監附卷一百二十五官制古官名卷一百二十六官制漢官名拾遺卷一百二十七官制官數官品省官卷一百二十八官制儲官卷一百二十九官制儲官訓道東宫附卷一百三十官制宗戚訓皇族附宗官附卷一百三十一官制諸侯官制牧守戒吏卷一百三十二官制使卷一百三十三官制屬國都護都督卷一百三十四官制人物封爵卷一百三十五官制褒功紹封附祿秩卷一