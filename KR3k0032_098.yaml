body:
  text: 玉海卷九十八宋王應麟撰郊祀封禪袁宏曰夫揖遜受終必有至德於天下征伐革命則有大功於萬物是故王者初基則有封禪之事以其成功告於神明者也夫東方者萬物之所始山嶽者靈氣之所宅故求之物本必於其始取其所通必於其宅崇其壇場則謂之封明其代興則謂之禪然則封禪者王者開務之大基也德不周洽不得擅議斯事功不弘濟不得髣佛斯禮曠代一有其道至髙故自黃帝堯舜至三代各一得封禪未有中修其禮者也夫神道貞一其用不煩天地易簡其禮尚質故藉用白茅貴其誠素器用陶匏取其易從然封禪之禮簡易可也若夫白函玉牒非天地之性也文中子曰封禪之費非古也徒以夸天下其秦漢之侈心乎伏羲黃帝封泰山管子齊桓公既霸會諸侯於葵丘欲封禪管仲曰古者封泰山禪梁父者七十有二家而夷吾所記者十有二焉昔無懷氏封泰山禪云云鄭氏曰無懷氏古之王者在伏羲前見莊子服虔曰云云在梁父東山名也晉灼曰山在蒙隂縣故城東北下有云云亭虙羲封泰山禪云云神農封泰山禪云云炎帝封泰山禪云云李竒曰炎帝神農後愚按神農即炎帝也分為二妄矣黃帝封泰山禪亭亭服虔曰山在牟隂晉灼曰地理志巨平有亭亭山祠顓頊封泰山禪云云帝嚳嚳封泰山禪云云堯封泰山禪云云舜封泰山禪云云禹封泰山禪會稽湯封泰山禪云云周成王封泰山禪於社首山名在巨平南十二里大戴禮云成王封泰山禪梁父皆受命然後得封禪古之封禪鄗上黍北里禾所以為盛江淮之間一茅三脊所以為藉東海致比目之魚西海致比翼之鳥物有不召自至者十有五比目魚謂之鰈比翼鳥謂之鶼禮記注引孝經説曰封乎泰山考績燔燎禪乎梁甫刻石紀號禮記疏引白虎通孔子曰三皇禪於繹繹之山五帝禪於亭亭之山三王禪於梁甫之山梁許懋謂燧人之前世質民淳安得泥金檢玉結繩而治安得鐫文告成黃帝封東泰山漢郊祀志太初三年公玉帶曰黃帝時雖封泰山然風后封巨岐伯令黃帝封東泰山在琅邪朱虛界有小泰山禪几山在朱虛合符天子既令設祠具東泰山卑小令祠官禮之不封其後令帶奉祠候神物復還泰山修五年之禮黃帝山川封禪見羣祀類周成王封泰山又見上漢郊祀志周成王封泰山禪於社首注應邵曰山名在博縣晉灼曰在巨平南十二里師古曰晉説是也大戴禮成王封泰山禪梁父詩時邁巡守告祭柴望也箋巡行邦國至於方嶽之下而封禪武王漢武帝封泰山封禪儀增修封禪禮中嶽靈星祠禪肅然禪石閭玉牒封禪議對紀元封元年冬上巡朔方歸甘泉春正月幸緱氏遂東巡海上夏四月癸卯還登封泰山降坐明堂詔曰朕以眇身承至尊兢兢焉惟德菲薄不明于禮樂故用事八神遭天地况施著見景象屑然如有聞聞呼萬嵗震于珍物欲止不敢遂登封泰山至于梁父然後升禪肅然山名自新嘉與士大夫更始其以十月為元封元年行所巡至博奉髙蛇丘歷城梁父民田租逋賦貸已除加年七十以上孤寡帛人二匹四縣毋出今年算賜天下民爵一級女子百户牛酒注孟康曰王者功成治定告成功於天封崇也助天之髙也刻石紀號有金䇿石函金泥玉檢之封焉應劭曰封者壇廣十二丈髙二丈階三等封於其上示增髙也刻石紀績也立石三丈一作二丈一尺其詞曰後志注引風俗通云事天以禮立身以義事親以孝育民以仁四守之內莫不郡縣四夷八蠻咸來貢職與天無極人民蕃息天祿永得尚玄酒而爼生魚下禪梁父祀地主示增廣此古制也武帝封廣丈二尺髙九尺其下有縢書祕語郊祀志其來年冬元鼎六年冬上議曰古者先振兵釋旅然後封禪乃遂北巡朔方勒兵十餘萬騎還祭黃帝橋山釋兵涼如地名上曰吾聞黃帝不死有冡何也或曰黃帝以仙上天羣臣葬其衣冠既至甘泉為且用事泰山先類祠泰一師古曰且將也類謂以事類而祭之自得寶鼎上與公卿諸生議封禪封禪用希曠絶莫知其儀體而羣儒采封禪尚書周官王制之望祀射牛事齊人丁公年九十餘曰封禪者古不死之名也秦始皇不得上封陛下必欲上稍上即無風雨遂上封矣上於是乃令諸儒習射牛草封禪儀索隱曰見應劭漢官儀天子既聞公孫卿及方士之言黃帝以上封禪皆致怪物與神通欲放黃帝以接神人蓬萊高世比德於九皇而頗采儒術以文之羣儒既已不能辨明封禪事又拘於詩書古文而不敢騁上為封禪祠器示羣儒或曰不與古同徐偃又曰太常諸生行禮不如魯善周霸屬圖封事於是上黜偃霸而盡罷諸儒弗用二月乃東幸緱氏按武紀元封元年春正月行幸緱氏詔曰朕用事華山至於中嶽禮登中嶽太室從官在山上聞若有言萬嵗云問上上不言問下下不言於是以三百户封太室奉祠命曰崈髙禁毋伐其山木上因東上泰山泰山草木未生乃令人上石立之泰山顛遂東巡海上禮祠八神齊人之上疏言神怪竒方者以萬數乃益發船令言海中神仙者數千人求蓬萊神人公孫卿持節常先行候名山至東萊言夜見大人長數丈羣臣有言見一老父牽狗言吾欲見巨公鄭氏曰天子也為天下父故曰巨公師古曰巨大也已忽不見上既見大迹未信及羣臣又言老父則大以為仙人也宿留海上與方士傳車及間使人求神仙以千數四月還至奉髙上念諸儒及方士言封禪人人殊不經難施行天子至梁父禮祠地主至乙卯令侍中儒者皮辨縉紳射牛行事封泰山下東方如郊祠泰一禮封廣丈二尺髙九尺其下則玉牒書書祕禮畢天子獨與侍中奉車子侯上泰山子侯霍去病子也亦有封其事皆禁明日下隂道丙辰禪泰山下址東北肅然山如祭后土禮天子皆親拜見衣上黃而盡用樂焉江淮間一茅三脊為神藉五色土益雜封縱逺方奇獸飛禽及白雉諸物頗以加祠兕牛象犀之屬不用皆至泰山然後去封禪祠其夜若有光晝有白雲出封中天子從禪還坐明堂羣臣更上夀下詔改元元封元年語在武紀又曰古者天子五載一巡狩用事泰山諸侯有朝宿地其令諸侯各治邸泰山下天子既已封泰山無風雨其秋有星孛于東井後十餘日有星孛于三能望氣王朔言候獨見填星出如瓜食頃復入有司皆曰陛下建漢家封禪天其報德星云元封三年夏旱據改元後又有來年冬郊如是則舉乾封事合見三年當考公孫卿曰黃帝時封則天旱乾封三年言三嵗不雨暴所封之上令乾也上乃下詔天旱意乾封乎其令天下尊祠靈星五年四月至奉髙修封焉詔曰朕巡荆揚輯江淮物會大海氣以合泰山上天見象增修封禪紀云春二月還至泰山增封夏四月詔曰云云太初元年冬十月行幸泰山十二月甲子朔旦冬至祀上帝於明堂後每修封其贊饗曰天增授皇帝泰元神䇿周而復始皇帝敬拜泰一十二月甲午朔上親禪禪禪同髙里云云其後復還泰山修五年之禮如前而加禪祠石閭石閭者在泰山下址南方方士言仙人閭也紀太初三年四月還修封泰山禪石閭其後五年復至泰山修封紀天漢三年三月修封還過祭常山自封泰山後十三嵗而周遍於五嶽四瀆矣後五年復至泰山修封東幸琅邪禮日成山登之罘浮大海用事八神延年又祠神人於交門宫若有鄉坐拜者云紀云大始三年二月幸琅邪禮日成山登之罘浮大海四年三月行幸泰山甲申修封丙戌禪石閭四月幸不其祠神人于交門宫後五年上復修封于泰山東遊東萊臨大海紀征和四年正月行幸東萊臨大海三月還幸泰山修封癸巳禪石閭泰山五年一修封武帝凡五修封兒寬傳上欲議倣古巡狩封禪事諸儒對者五十餘人未能有所定先是司馬相如病死有遺書頌功德言符瑞足以封泰山上奇其書以問寬對曰享薦之義不著於經以為封禪告成合祛天地神祇祗戒精専以接神明總百官之職各稱事宜為之節文惟聖王所由制定其當非羣臣之所能列今將舉大事優遊數年使羣臣得人人自盡終莫能成惟天子建中和之極兼總條貫金聲而玉振之以順成天慶垂萬世之基上然之乃自制儀采儒術以文焉既成將用事拜寬為御史大夫從東封泰山還登明堂寬上夀曰三代改制屬象相因間者聖統廢絶陛下發憤合指天地祖立明堂辟雍宗祀泰一六律五聲幽贊聖意神樂四合各有方象以承嘉祀為萬世則天下幸甚將建太元本瑞登告岱宗發祉闓門以候景至癸亥宗祀日宣重光上元甲子肅雍永享光輝充塞天文粲然見象日昭報降符應臣寬奉觴再拜上千萬嵗夀制曰敬舉君之觴太平之世日抱重光謂日有重日也將甫始之辭也太元初厯也本瑞謂白麟寶鼎之屬也以候景至冬至之景也上元甲子太初元年甲子朔旦冬至也司馬相如傳其遺札言封禪事所忠奏焉天子異之相如既卒五嵗上始祭后土八年遂禮中嶽封于泰山至梁父禪肅然東方朔傳朔之文辭有封泰山篇藝文志禮家有封禪議對十九篇武帝時漢封禪羣祀三十六篇古封禪羣祀二十二篇小説家有封禪方説十八篇武帝時風俗通岱宗上有金篋玉䇿能知人年夀修短漢武帝探䇿得十八因倒讀曰八十果夀長八十後漢志東萊黃縣注地道記曰東二百三十里有始皇漢武帝二碑漢禮登中嶽太室祠紀元封元年春正月幸緱氏詔曰用事華山至于中嶽獲駁麃見夏后啓母石翌日親登崇髙御史乘屬在廟旁吏卒咸聞呼萬嵗者三登禮罔不答其令祠官加增太室祠禁無伐其草木以山下户三百為之奉邑名曰崇髙獨給祠郊祀志二月東幸緱氏禮登中嶽太室地理志潁川崇髙武帝置以奉太室山是為中嶽有太室少室山廟古文以為外方山後紀永平六年十二月幸陽城遣使者祠中嶽熹平五年四月復崇髙山名為嵩髙山東觀記靈帝使中郎將堂溪典請雨因上言改崇髙山為嵩髙魏明帝太和四年八月辛巳以特牛祠中嶽括地志嵩山亦名大室在洛州陽城縣西北二十三里嵩髙山記山髙二千八百丈周回七十五里漢武封禪史記正義伍緝之征記曰漢武封壇廣丈三尺髙丈尺下有玉籙書以金銀為鏤封以璽漢建武封泰山柴望岱宗元封舊儀刻石文玉牒河雒圖記紀中元元年柔兆執徐之嵗春正月丁卯東巡狩二月己卯幸魯進幸太山北海王興齊王石朝于東嶽辛卯柴望岱宗登封太山甲午禪于梁父注封謂聚土為壇禪謂除地而祭續漢志曰時上御輦升山即位於壇南北面尚書令奉玉牒檢皇帝以寸三分璽親封之藏玉牒已復石覆訖尚書令以五寸印封石檢畢皇帝再拜禪祭地于梁隂以髙后配羣神從祀焉四月癸酉車駕還宫己卯大赦天下復嬴博梁父奉髙勿出今年租田芻藁改年為中元志建武三十年二月羣臣上言宜封禪泰山詔書曰即位三十年百姓怨氣滿腹何事汙七十二代之編録不許三十二年正月上齋夜讀河圖會昌符曰赤劉之九會命岱宗不慎克用何益於承誠善用之姦偽不萌感此文乃詔中郎將梁松等復案索河雒讖文言九世封禪事者松等列奏乃許焉注東觀書曰有司奏河雒圖記凡三十六事與博士兖等議請親定刻石紀號文太常奏儀乃求元封時封禪故事議所施用有司奏當方石再纍置壇中皆方五尺厚一尺用玉牒書藏方石牒厚五寸長尺三寸廣五寸有玉檢又用石檢十枚列於石旁東西各三南北各二皆長三尺廣一尺厚七寸檢中刻三處深四寸方五寸有蓋檢用金鏤五周以水銀和金以為泥玉璽一方寸二分一枚方五寸方石四角又有距石皆再纍枚長一尺厚一尺廣二尺皆在圓壇上其下用距石十八枚皆髙三尺厚一尺廣二尺如小碑環壇立之去壇三步距石下皆有石跗入地四尺又用石碑髙九尺廣三尺五寸厚尺二寸立壇丙地去壇三丈以上以刻書上以用石功難又欲及二月封故詔松欲因故封石空檢更封而已松上疏爭之以為登封之禮告功皇天垂後無窮以為萬民也承天之欽尤宜章明奉圖書之瑞尤宜顯著今因舊封竄寄玉牒故石下恐非重命之義受命中興宜當特異以明天意遂使泰山郡及魯趣石工宜取完青石無必五色以印工不能刻玉牒故用丹漆書之會求得能刻玉者遂書祕刻方石中合容玉牒二月上至奉高注應邵漢官馬第伯封禪儀記曰車駕正月二十八日發雒陽宫二月九日到魯十日魯遣宗室諸劉及孔氏瑕丘丁氏上夀十一日發十二日宿奉髙十五日始齋泰山上石二枚狀博平圓九尺此壇上石也其一石武帝時用五車不能上因置山下為屋號五車石云云十九日車駕之山雲氣成宫闕百官並見之二十一日夕牲時白雲廣一丈遣侍御史與蘭臺令史將工先上山刻石文曰維建武三十有二年二月皇帝東巡狩至于岱宗柴望秩于山川班于羣神遂覲東后從臣太尉喜行司徒事特進髙密侯禹等漢賔二王之後在位孔子之後褒成侯序在東后蕃王十二咸來助祭河圖赤伏符曰劉秀發兵捕不道四夷雲集龍鬬野四七之際火為主河圖會昌符曰赤帝九世巡省得中治平則封成合帝道孔矩則天文靈出地祗瑞興帝劉之九會命岱宗誠善用之姦偽不萌赤漢德興九世會昌巡岱皆當天地扶九崇經之常漢大興之道在九世之王封于太山刻石著記禪于梁父退省考五河圖合古篇曰帝劉之秀九名之世帝行德封刻政河圖提劉子曰九世帝方明聖持衡拒九州平天下雒書甄曜度曰赤三德昌九世會修符合帝際勉刻封孝經鉤命決曰子誰行赤劉用帝三建孝九會修専兹竭行封岱青河雒命后經讖所傳昔在帝堯聰明密微遜與舜庶後裔握機王莽以舅后之家三司鼎足冡宰之權勢依托周公霍光輔幼歸政之義遂以篡叛僣號自立宗廟隳壞社稷喪亡不得血食十有八年揚徐青三州首亂兵革橫行延及荆州豪傑并兼百里屯聚往往僣號北夷作冦千里無煙無雞鳴犬吠之聲皇天眷顧皇帝以匹庶受命中興年二十八載興兵起是以中次誅討十有餘年罪人則斯得黎庶得居爾田安爾宅書同文車同軌人同倫舟輿所通人迹所至靡不貢職建明堂立辟雍起靈臺設庠序同律度量衡修五禮五玉三帛二牲一死贄吏各修職復于舊典在位三十有二年年六十二乾乾日􅉴不敢荒寧涉危歷險親巡黎元恭肅神祇惠恤耆老理庶遵古聰允明恕皇帝惟慎河圖洛書正文是月辛卯柴登封泰山甲午禪于梁隂以承靈瑞以為兆民永兹一宇垂于後昆百寮從臣郡守師尹咸蒙祉福永永無極秦相李斯燔詩書樂崩禮壞建武元年已前文書散亡舊典不具不能明經文以章句細微相况八十一卷明者為驗又其十卷皆不昭晢後有聖人正失誤刻石記班固典引曰作者七十有四人注古封禪七十二君加以二漢二十二日辛卯晨燎祭天於泰山下南方羣神皆從用樂如南郊諸王王者後二公孔子後褒成君皆助祭事畢將升封或曰泰山雖已從食於柴祭今親升告功宜有禮祭於是使謁者以一特牲於常祠泰山處告祠泰山如親耕貙劉先祠先農先虞故事至食時御輦升山日出後到山上更衣早餔時即位于壇北面羣臣以次陳後西上畢位升壇注虎賁陛戟臺下尚書令奉玉牒檢皇帝以寸二分璽親封之訖太常命人發壇上石尚書令藏玉牒已復石覆訖尚書令以五寸印封石檢論衡曰光武升封天晏然無雲太平之應也事畢皇帝再拜羣臣稱萬嵗注音動山谷有氣屬天命人立所刻石乃復道下注封禪儀曰封畢明日上夀暮宿奉髙三十里明日發至梁甫九十里夕牲二十五日甲午禪祭地于梁隂以髙后配山川羣神從如元始中北郊故事注封禪儀曰功效如彼天應如此羣臣上夀國家不聽四月己卯大赦天下以建武三十二年為中元元年復博奉髙嬴勿出元年租芻藁以吉日刻玉牒書函藏金匱璽印封之乙酉使太尉行事以特告至髙廟乃奉匱藏于廟室西壁石室髙主室之下張純傳建武三十年奏上宜封禪曰自古受命而帝治世之隆必有封禪以告成功焉書曰嵗二月東巡狩至于岱宗柴則封禪之義也陛下受中興之命平海內之亂黎元安寧夷狄慕義今攝提之嵗蒼龍甲寅太嵗在寅曰攝提格建武三十年嵗在甲寅年德在東宫宜及嘉時以二月東巡狩封于岱宗中元元年帝乃東巡岱宗以純視御史大夫從并上元封舊儀及刻石文趙熹傳建武三十年上言封禪正三雍之禮中元元年從封泰山紀章帝元和二年二月辛未幸泰山柴告岱宗有黃鵠三十從西南來經祠壇上東北過于宫屋安帝延光三年二月辛卯幸太山柴告岱宗志元和二年二月至泰山修光武山南壇兆辛未柴祭天地羣神如故事延光三年上東巡狩至泰山柴祭如元和二年故事魏明帝使髙堂隆草封禪儀卒不行晉太康元年九月庚寅衛瓘等奏封禪不許漢封禪儀記紀號石玉泰山銅物日觀盤玉龜後志注應劭漢官馬第伯封禪儀記曰建武三十二年車駕正月二十八日發雒陽宫二月九日到魯遣守謁者郭堅伯將徒五百人治泰山道十日魯遣宗室諸劉及孔氏瑕丘丁氏上夀受賜皆詣孔氏宅賜酒肉十二日宿奉髙十五日始齋馬第伯自云某等七十人先之山虞觀祭山壇及故明堂宫觀治石石二枚狀博平圓九尺此壇上石也其一石武帝時石也時用五車不能上因置山下為屋號五車石四維距石四枚檢石十枚紀號石髙一丈二尺廣三尺厚尺二寸名曰立石一枚刻文字紀功德是朝上山晡後到天門郭使者得銅物銅物狀如鍾又方柄有孔莫能識疑封禪具也得之者汝南召陵人姓楊名通東上一里餘得木甲木甲者武帝時神也東北百餘步得封所秦始皇立石及闕在南方漢武在其北東山名曰日觀日觀者雞一鳴時見日始欲出長三丈所秦觀望見長安吳觀望見會稽周觀望見齊西北有石室壇南有玉盤中有玉龜山南神泉飲之清美郭璞注山海經曰泰山從山下至頭四十八里二百步魏志太和中蔣濟上疏宜遵古封禪使高堂隆撰其禮儀北史魏收傳試為封禪書下筆便就文將千言梁書許懋傳時有請會稽封禪者武帝因集儒學士草封禪儀將行焉懋建議獨以為不可帝嘉納焉隋封禪圖隋書開皇九年平陳咸願登封七月丙午詔禁絶紀兖州刺史薛胄遣博士登泰山觀古迹撰封禪圖及儀上之傳十四年百官固請命牛弘辛彥之等撰定儀注十五年春幸兖州次岱嶽為壇如南郊服兖冕備法駕行禮遂詣青帝壇而祭志未嘗升山也唐志唐貞觀封禪禮儀注志太宗已平突厥年榖屢豐羣臣請封泰山太宗初頗非之已而遣杜正倫行泰山上七十二君壇迹會要貞觀初羣臣屢請魏徴以為不可六年太宗問禮官兩漢封禪儀注遣杜正倫行泰山上至十一年始議封禪乃命顔師古魏徴等集名儒博士議於是房玄齡魏證楊師道博采衆議奏之上其議曰為壇泰山下祀昊天上帝玉牒玉檢玉䇿四已祀而歸格于廟盛以金匱繩以金繩封以金泥印以受命璽而玉牒藏於山又為告至壇以燔柴告至望秩羣神遂著于禮顔師古傳帝將有事泰山詔公卿博士雜定其儀而論者爭為異端師古奏臣撰封禪儀注書在十一年于時諸儒謂為適中於是以付有司多從其説會要十一年師古奏議曰今請祭於山下封於山上云云十三年房玄齡等遂采師古之議附于新禮以為定式二十一年詔以來年有事泰山八月以河北大水而止實録貞觀五年正月朝集使趙郡王孝恭等請封禪手詔不許十二月己亥朝集使表請帝曰未遑六年百僚又請不許十一年帝將有事封禪國子博士劉伯莊等皆上封禪事言新禮簡略勑名儒及顔師古朱子奢參議得失議者數十家遞相駁難不決於是玄齡徴師道采衆議以為永式十四年十月甲戌趙王元景等表請壬辰詔從之通鑑十四年十一月丙子百官表請許之更命諸儒詳定儀注十五年三月庚辰肅州言所部川原遍生芝草先是百僚及雍州父老詣朝堂表請四月辛卯朔詔以來嵗二月有事于泰山紀同詔太常卿韋挺為檢校封禪大使禮部侍郎令孤德棻副焉祕書少監顔師古奏臣撰禮書在十一年春詔公卿定可否多從師古之禮六月己酉有星孛太微宫辛亥起居郎褚遂良進曰行至洛陽彗星輒見或有未允合者丙辰停封泰山紀同二十年十一月司徒無忌等表請十二月己丑又請詔有司議方石圜壇之制草封禪射牛之禮修造羽儀輦輅送洛陽宫二十一年正月丁酉詔以二十二載仲春有事泰山司空玄齡等議社首去泰山五里是周家禪處請禪社首八月壬戌停謝偃傳貞觀間獻玉牒真紀勸登封藝文志令狐德棻皇帝封禪儀六卷儀注類唐髙宗封泰山封禪碑録舞鶴萬嵗景雲臺紀髙宗麟德二年十月丁卯如泰山乾封元年即麟德三年正月戊辰封于泰山庚午禪于社首以皇后為亞獻壬申大赦改元賜文武官勳爵民年八十以上版授下州刺史司馬縣令婦人郡縣君七十以上至八十賜古爵一級民酺七日免所過今年租賦給復齊州一年半兖州二年通鑑顯慶四年六月會要二十四日許敬宗議封禪儀己巳請以髙祖太宗俱配昊天上帝太穆文德二后俱配皇地祇麟德元年七月丁未朔詔以三年正月有事岱宗云云會要乾封元年正月封禪禮畢上謂羣臣曰升中大禮不行數千年近代帝王雖稱封禪其間事實不同或為求仙克禋或以巡遊望拜近隋朝喪亂髙祖發迹晉陽撥亂反正先朝躬擐甲胄贊成大業朕丕承大厯十有七年躬親展禮褒贊先功情在歸功志非為己大禮既畢深以慰懷公等休戚是同故應共有此慶欲與公宴飲盡歡縱酒設樂羣臣及諸嶽牧競來上夀起舞日宴方止禮志髙宗乾封元年封泰山為圓壇山南四里如圓丘三壝壇飾以青四方如其色號封祀壇玉䇿三刻而金文玉匱一以藏上帝之册金匱二以藏配帝之册纒以金繩五周金泥玉璽石䃭古禫反以容玉匱䃭纒以金繩五周封以石泥又為壇於山上廣五丈髙九尺四出陛一壝號登封壇玉牒玉檢石䃭石距玉匱石檢皆如之為降禪壇於社首山上八隅一成八陛如方丘三壝上飾以黃四方如其色其餘皆如登封其儀略定會要麟德二年十月十四日有司進儀注云云而天子詔曰古今之制文質不同今禪以玉牒金繩而瓦尊匏爵秸席宜改從文於是昊天上帝褥以蒼地祇褥以黃配褥皆以紫而尊爵亦更焉是嵗正月戊辰朔天子祀昊天上帝于山下之封祀壇以髙祖太宗配如圓丘之禮親封玉册置石䃭聚五色土封之徑一丈二尺髙尺已事升山明日又封玉册于登封壇舊紀己巳帝升山行封禪之禮又明日庚午祀皇地祇于社首山之降禪壇如方丘之禮以太穆皇后文德皇后配而皇后武氏為亞獻越國太妃燕氏為終獻率六宫以登其帷帟皆錦繡羣臣瞻望多竊笑之又明日御朝覲壇以朝羣臣如元日之禮舊紀壬申御朝覲壇受朝賀改元大赦乃詔立登封降禪朝覲之碑名封祀壇曰舞鶴臺登封壇曰萬嵗臺降禪壇曰景雲臺以紀瑞焉舊紀癸酉燕羣臣陳九部樂丙戌發泰山辛卯至曲阜贈孔子太師以少牢祭車鼻可汗傳髙宗既遣髙侃擒車鼻可汗裂其地為郡縣以酋長為都督刺史帝封禪都督葛邏祿叱利等三十餘人皆從至泰山下已封請勒名於封禪碑云會要突厥于闐等十一蕃長扈從髙麗傳髙麗王髙藏遣子男福從封泰山流鬼傳有儋罪者麟德中酋長來朝從封泰山金石録唐登封紀號文髙宗撰并行書飛白書額乾封元年二月杜光庭靈驗記天皇東封鶴集其壇使諸州為老氏築宫號以白鶴唐開元封泰山封禪儀注東封記圖封禪壇頌紀泰山銘封禪録朝覲碑頌圓臺方壇玉牒紀開元十三年銘序曰宅帝位十有四載十月辛酉如兖州庚午次濮州賜河南北五百里內父老帛十一月丙戌至泰山下丁亥於行宫致齋十一月庚寅封于泰山辛卯禪于社首山壬辰大赦賜文武官階勳爵諸蕃酋長來會者一官免兖州租二嵗賜天下酺七日會要開元十二年閏十二月辛酉百官上表請封嶽手詔不從於是甲子侍中源乾曜中書令張説上言曰自古受命居大寶者必登崇髙丘行封禪之禮髙宗因文武之業盛岱亭之禮方䇿所記虞夏同風陛下即位十有四載創九廟禮二郊睦九族友兄弟天平地成人和嵗稔可以拜於神明矣從之丁卯十三年四月乙丑撫州三脊茅生八月己未詔張説徐堅韋縚等於集賢院刋撰東封儀注十一月九日己丑日南至上備法駕登山十日庚寅祀昊天上帝于封臺之前壇以神堯配享禮畢還齋宫慶雲隨馬祥風繞輅張説等蹈舞拜賀十一日辛卯祀享地祇於社首之泰折壇以睿宗配享初畢至嶽西大風裂幕折柱張説昌言海神來迎至升壇休氣四塞登歌奏樂有祥風自南而至絲竹之聲飄若天外及禪社首五色雲見日重輪十二日壬辰上御朝覲之帳殿朝羣臣大赦天下上製紀泰山銘親札勒於山頂之石中書令張説撰封祀壇頌侍中源乾曜撰禪社首壇頌禮部尚書蘇頲撰朝覲壇頌以紀聖德禮樂志開元十二年四方治定嵗屢豐稔羣臣多言封禪中書令張説又固請乃下制以十三年有事泰山於是説與徐堅韋縚康子元侯行果刋定儀注立圓臺於山上廣五丈髙九尺土色各依其方又於圓臺上起方壇廣一丈二尺髙九尺四面為一階又積柴為燎壇為圓壇於山下三成十三階如圓丘之制又為玉册石匱石䃭如髙宗之制上問前代何為祕玉牒賀知章曰玉牒以通意於天前代或祈長年希神仙旨尚微密故外莫知帝曰朕今為民祈福無一祕請即出玉牒示百僚其辭曰有唐天子臣某敢昭告于昊天上帝天啓李氏運興土德髙祖太宗受命立極髙宗升中六合殷盛中宗紹復繼體不定上帝眷佑錫臣忠武底綏內難推戴聖父恭承大寶十有三年敬若天意四海晏然封祀岱嶽謝成于天子孫百祿蒼生受福乃祀昊天上帝於山上壇以髙祖配祀五帝以下諸神於山下其祀禮皆如圓丘大駕所經及告至問百年朝覲皆如巡狩之禮列傳張説為中書令倡封禪議受詔與諸儒草儀及登封還詔説撰登封壇頌刻之泰山蘇頲從封泰山頌朝覲壇世咨其文裴光庭玄宗有事岱宗中書令張説以天子東巡京師空虛恐夷狄乘間竊發議欲加兵守邊召光庭與謀曰封禪所以告成功也成功者德無不被人無不安萬國無不懷今將告成而懼夷狄非昭德也大興力役用備不虞非安人也方謀會同而阻戎心非懷逺也此三者名實乖矣且諸蕃突厥為大贄幣往來願修和好若遣一使召大臣使赴行在必欣然應命突厥受詔則諸蕃君長必相率而來我偃旗息鼓不復事矣説曰善吾所不及因奏用其䇿突厥果遣使來朝契丹天子封禪其酋長邵固與諸蕃長皆從行在韋述為起居舍人開元十三年從封泰山奏東封記一卷詔褒美賜絹五十劉晏玄宗封泰山晏始八嵗獻頌行在李雍帝封泰山還見帝汴州詔獻辭賦吕向玄宗自為文勒石西嶽詔向為鐫勒使梁升卿工八分書東封朝覲碑為時絶筆會要開元十三年詔康子元注解東封儀注以進金石録紀泰山銘明皇撰并八分書開元十四年九月通典載紀泰山銘曰欽若祀典丕承永命至誠動天福我萬姓道在觀政名非從欲銘心絶巖播告羣嶽張説頌曰泰山升中建號惟七十而有五我髙宗六之而今七矣天壇三襲辰陛十二咸秩衆靈列坐有次出天門臨日觀赤霄可接白雲在下蘇頲頌曰十四年考虞氏嵗巡之嵗諷周王時邁之什十月辛酉步自有洛十一月丙戌帳殿齋於嶽趾云云藝文志儀注類孟利貞封禪録十卷裴守真神嶽封禪儀注十卷韋述東封記一卷劉禹錫進開元東封圖表臣謹按開元十三年玄宗以天下太平登封東嶽聲明文物振耀古今伏惟陛下丕承景光再闡鴻業祖宗盛事紹復有期臣所以編成此圖輒敢上獻至於繢畫躬自指揮證史氏之文纂禮容之要山川氣象悉擬真形羽衛威儀咸稽故實劉禹錫為裴相公進東封圖狀韓愈勸憲宗紀泰山之封鏤白玉之牒祥符封禪儀注頌圖記録含光殿大宴朝元殿受册太平興國九年四月甲午詔有事于泰山丙申定封禪儀六月壬寅有詔寢罷大中祥符元年舊編云二年三月甲戌兖州父老詣闕上表請東封壬午文武百官宰臣王旦等繼請時天書降左承天門正月乙丑四月甲午下詔以今年十月有事於泰山乙未以王旦為大禮使王欽若為禮儀使馮拯為儀仗使陳堯叟為鹵簿使趙安仁為橋道頓遞使建本謂乙未王欽若趙安仁為泰山封禪經度制置使實録丙申命五使丁酉鑄五使及計度制置使印命翰林學士朝逈李宗諤楊億龍圖閣學士杜鎬待制陳彭年與太常禮院詳定儀注丙午詔於京城擇地依道教建宫以昭應為名辛亥太子中舍夏侯晟上漢武帝封禪圖繢金匱玉匱石䃭石距之狀有注釋甲寅命宰臣王旦撰封祀壇頌王欽若撰社首壇頌陳堯叟撰朝覲壇頌五月乙亥太常丞王曉上前代封禪雜録丁丑詳定所言封禪畢御朝覲壇諸州所貢方物陳列如元正之儀戊寅太常博士劉炳上封禪禮儀集辛巳對王旦等於龍圖閣出封禪壇圖示之丁亥翰林學士朝逈等上封祀社首壇樂章八首六月壬辰詳定所上封禪儀注上覽之曰此儀久廢非典禮具備豈為盡美即手札疑互凡十七事令與五使參議釐正而行之壬子詳定所言準詔旨取封禪之義易樂章之名望改酌獻昊天上帝禧安之樂皇地祗禪安皇帝飲福祺安丁巳詳定所上封禪儀注四卷詔付有司八月甲辰令禮官朝逈以下習儀都亭驛八月己酉王欽若獻芝草召輔臣同閲之九月戊午朔嶽州上三脊茅己未詔告太廟日以芝草嘉禾瑞木列于天書輦前及陳於六室庚申皇城使劉承圭詣便殿上新制天書法物有鶴十四就舞於庭甲子扶侍使等奉天書升玉輅赴太廟幄殿車駕詣酌獻奠告六室是日有黃雲迎日若橋梁狀五色雲如錦錢惟演黃宗旦宋綬劉筠邵煥晏殊以靈瑞紛集咸上贊頌以美盛德庚辰趙安仁獻芝草乙酉上躬習封禪儀于崇德殿十月辛卯上御大輦發京師丁未備法駕入乾封縣奉髙宫戊申上齋于穆清殿己酉五色雲覆嶽頂上與羣臣登嶽亭望之名亭曰瑞雲一本云有黃白雲如幢蓋龍鳯狀起太平頂命輔臣後亭焚香再拜雲變五色後有雲如橋梁紫雲覆之久而不散遂名其亭張知白請以泰山瑞繪圖祕府傳示不朽王欽若等獻泰山芝草詔令封禪日列于天書輦前庚戌上服通天冠乘金輅備法駕至門幄次乘步輦以登天氣溫和纎塵不動辛亥享昊天上帝於山上圜臺奉太祖太宗並配命羣臣享五方帝諸神於山下封祀壇帝服玄衮升圜壇奠獻飲福攝中書令王旦跪稱天賜皇帝太一神册周而復始永綏兆人三獻畢封金匱王旦置於石䃭攝太尉馮拯奉金匱以降將作監領徒封䃭帝復登圜臺閲視訖還御幄宰臣率從官稱賀上還御幄攝司天監王欽元跪奏慶雲繞壇月有黃輝于時星斗輝燦祥風肅然法駕降山百官奉迎傳呼萬嵗震動山谷日有冠戴黃氣紛郁壬子禪祭皇地祇於社首奉天書升壇以太祖太宗配天宇澄霽紫氣蒙壇黃光如星繞天書匣封玉册石䃭並同封祀之禮法駕還奉髙宫日重輪五色雲見鼓吹振作觀者塞路詔改上泰山奉髙宫曰會真宫癸丑有司設仗衛宫懸于朝覲壇下上被衮冕御壇上之夀昌殿受朝賀諸州貢奉使僧道父老蠻夷大會各陳方物于下御製慶成詩大赦天下文武官遞進官勳一本云二十六日癸丑宴百官于穆清殿又宴近臣及父老於殿門賜父老茶帛時服功明年五月戊午內出御製書登泰山謝天書述二聖德銘示宰相命內侍賫付泰山刻之十一月戊午朔幸曲阜謁文宣王廟行酌獻之禮親製贊令刻石廟中丁丑車駕至自泰山上御乾元樓召近臣觀衛士甲馬還營乙酉大宴含光殿勞旋也十二月辛卯御朝元殿受册尊號壬辰龍圖待制陳彭年請自天書降後至上尊號以前制敕章奏儀注特召臣寮二三人編録丁酉內出泰山封祀上尊酒及玉女白龍王母池水新醴泉賜輔臣二年五月壬戌知兖州朱巽言泰山修封畢詔奬之圜臺增髙一丈五尺又增社首壇髙一丈六尺並廣五十尺云七月丁卯王旦欽若上封祀社首壇頌甲戌陳堯叟上朝覲壇頌三年四月王旦等奉詔撰封禪頌成甲戌並加尚書又為大中祥符封禪記詔李宗諤丁謂戚綸與陳彭年撰録自天書降至修封畢三年十月庚申書成凡五十卷帝自製序目録二卷藏祕閣賜謂等器幣朝逈而下獻賦頌歌詩以紀盛德者三十四人王旦表云自唐室中微皇綱不振洎四方之叛亂逮五代之陵夷盛德之事未遑振舉國家接千載之統宅九州之中藝祖以揖遜開基太宗以文明闡化允屬重熙之運茂宣善繼之猷漢武獲汾鼎之瑞乃議升中世祖閲河圖之文是思紀號髙宗以六合全盛詔蹕時巡明皇以纍年太平封巒展禮莫不以懿文之業成神武之績著雅頌之聲作珍奇之貺集然後納羣臣率籲之請遵哲王順考之規肆覲東后事載於虞書陟其髙山美溢於周頌升中於天者經籍之攸紀勒功於嶽者八九之所同在昔哲王率循斯道昔西漢陳師鞠旅以事朔方之循而真宗再御戎衣五兵已戢東京垂精遊神以徯元符之至而真宗親受乾文萬國咸規以天下未一為念則真宗之時際天所覆無不州縣矣以邊鄙未寧為念則真宗之時鼓卧戎亭燧息烽火矣以嵗靡豐穰為念則真宗之時民物富庶海內阜安八路連稔米斗至七八錢其可謂豐穰也以政猶堙鬱為念則真宗之時禮樂交修憲章大備建中和之極流懿鑠之義其可謂得宜也於是採夷吾之舊説詢相如之往議鳴鑾日觀按蹕魯郊陳金石以奏音執籩豆而享帝對越穹昊嚴配祖宗神光焜耀下燭於柴壇白雲紛綸上浮於玉檢考圜壇泰折之制陳五玉六器之容用事介丘告禪社首肆覲東后受計明堂政和五年十一月李升進登封告成録一百卷祥符封禪樂章詳見樂舞類元年四月戊戌詳定所言封禪用樂章八首命學士院撰五月丁亥朝逈上之六月丙午上奉天書入太廟升泰山圜臺社首山登歌瑞文曲樂章二首壬子易樂章之名為封安禪安祺安十月甲午判太常李宗諤上圜臺登歌亞終獻樂章二首太宗時田錫上封禪書謂宜崇檢玉之禮以答天意祥符封禪朝覲壇圖祥瑞圖天書儀仗圖二年十二月辛丑三司使丁謂翰林學士李宗諤等上泰山登封社首山降禪朝覲壇圖三祥瑞圖百五十二昭宣使劉承圭義上天書儀仗圖一列于滋福殿召宗室輔臣刺史以上觀焉三年正月丁丑內出封禪三壇及祥瑞圖於朝堂示百官從御史中丞王嗣宗之請也王欽若著五嶽廣聞記漢武封禪圖大中祥符初夏侯晟上漢武封禪圖繢金匱玉匱石䃭石距之狀咸有注釋上覽而善之陳堯叟受詔撰朝覲壇碑獻封禪聖製頌上作答之太宗時宋白知兖州召還泰山有唐玄宗刻銘白摹本以獻且述承平東人望幸之意公羊傳天子有事于泰山諸侯皆從泰山之下諸侯皆有湯沐之邑焉注禮四井為邑邑方二里東方二州四百二十國凡為邑廣四十里袤四十二里取足舍止共稿榖而已禮器因名山升中于天疏白虎通云增泰山之高以報天附梁甫之基以報地或曰封者金泥銀繩或曰石泥金繩封之印璽馬第伯封禪儀記曰是朝上山仰望天關如從谷底仰觀抗峰其為高也如視浮雲其峻也石璧窅窱如無道徑遙望其人或為白石或雪久之乃知是人也仰視巖石松木鬱鬱蒼蒼若在雲中俯視溪谷碌碌不可見丈尺遂至天門之下仰視天門窔遼如從穴中視天書正義韓詩外傳稱古封太山禪梁甫者萬餘人仲尼觀焉不能盡識又管子書古之封太山者七十二家夷吾所識十二而已其登封者皆刻石紀號通典載晉太康郡國志秦立石頌德文史記正義道書福地記云泰山高四千九百丈二尺周回二千里括地志梁父山在兖州泗水縣北八十里西接徂來山肅然山在博城縣東六十里晉太康地志云肅然山太山趾東北名也秦儒生議曰古者封禪為蒲車掃地而祠席用苴秸劉歆曰若立辟雍封禪之儀則幽冥莫知其原唐顔師古議昔在元封兒寬專輔其決逮乎建武梁松獨尸其事搢紳雜議不知所裁隋志自古帝王之興皆稟五精之氣每易姓而起以致太平必封乎太山所以告成功也封訖而禪乎梁甫梁甫者太山之支山卑下者也能以其道配成高德故禪乎梁甫亦以告太平也封禪者高厚之謂也天以高為尊地以厚為德增太山之高以報天也厚梁甫之基以報地也明天之所命功成可就有益於天地若天地之更高厚云唐志文中子曰封禪非古也其秦漢之侈心乎蓋其曠世不常行而於禮無所本故自漢以來儒生學官論議不同而至於不能決則出於時君率意而行之爾大舜巡嶽顯乎虞典成康封禪聞之樂緯易著觀民省方禮有升中于天詩頌陟其高山鳴鑾日觀勒牒仙閭容成諏日乾册丹篆河圗紫文召萬玉以警途詔八神而弭䇿詔蹕梁父張樂介丘榮鏡六合對越三神玉海卷九十八
