body:
  text: 玉海卷一百九十四宋王應麟撰兵捷獻功左傳凡諸侯有四夷之功則獻於王王以警於夷蠻夷戎狄不式王命王命伐之則有獻捷王親受而勞之周王師大獻周禮大司樂王師大獻則令奏愷樂大獻獻捷於祖愷樂獻功之樂傳曰振旅愷以入于晉大司馬若師有功則左執律右秉鉞以先愷樂獻於社江漢告成于王漢振旅還京師紀建武五年六月建義大將軍朱祐拔黎丘獲秦豐而龎萌蘇茂圍桃城帝時幸蒙因自將征之先理兵任城乃進救桃城大破萌等秋七月丁丑幸沛祠高原廟進幸湖陵征董憲又幸蕃遂攻憲于昌慮大破之八月己酉進幸郯留吳漢攻劉紆董憲等車駕轉徇彭城下邳吳漢拔郯獲劉紆漢進圍董憲龎萌于朐冬十月耿弇等與張步戰于臨淄大破之帝幸臨淄進幸劇張步斬蘇茂以降齊地平車駕還宫六年正月揚武將軍馬武等拔舒獲李憲二月大司馬吳漢拔朐獲董憲龎萌山東悉平諸將還京師置酒賞賜吳漢傳建武四年冬率建威大將軍耿弇漢忠將軍王常等擊富平獲索二賊於平原明年春大破賊衆因追餘黨進擊渤海皆平之又征董憲圍朐城明年春拔朐斬憲東方悉定振旅還京師後與公孫述戰斬述漢振旅浮江而下耿弇傳車駕至臨淄自勞軍羣臣大會帝謂弇曰韓信破厯下以開基將軍攻祝阿以發迹其功乃難於信也弇復追步步負斧鑕於軍門傳詣行在所勒兵入據其城植十二郡鼓旗令各以郡人詣旗下衆十餘萬皆遣歸弇復至城陽降五校餘黨齊地悉平振旅還京師又馬援平南嶠建武二十年秋振旅還京師又顯宗初中元二年九月西羌冦隴右十一月拜馬武捕虜將軍以中郎將王豐副與監軍使者竇固右輔都尉陳欣將烏桓黎陽營三輔募士涼州羌胡兵及弛刑合四萬人擊之戰金城浩亹斬首六百級復追擊到東西邯大破之武振旅還京師增邑七百户紀永平元年七月馬武與燒當羌戰大破之又延熹五年十月武陵蠻反冦江陵辛丑以太常馮緄為車騎將軍將兵十餘萬討武陵蠻十一月緄軍至長沙賊聞之悉詣營乞降進擊武陵蠻夷斬首四千餘級受降十餘萬人荆州平定振旅還京師又滕撫傳東南悉平振旅而還在漢八葉宣帝後將軍趙充國平羌振旅而還出曰治兵入曰振旅禹之格苖周之采芑教陳於周愷入于晉告成于王來歸自鎬晉勞師紀太元八年冬十月乙亥諸將及苻堅戰於淝水大破之俘斬數萬計獲堅輿輦及雲毋車十一月庚申詔衛將軍謝安勞旋師于金城十二月庚午以冦難初平大赦唐獻俘太廟會要兼實録等書武德元年十一月二十三日秦王平薛仁杲凱旋獻俘太廟二年五月二十四日破宋金剛獻捷太廟三年五月辛卯平并州獻捷太廟四年七月九日甲子平東都秦王被金甲陳鐵騎俘世充建德及隋神器寶輅獻捷於太廟貞觀四年三月二十九日李靖俘頡利獻捷太廟二十年三月至自遼東獻俘授馘備法駕具凱旋之禮二十三年正月執龜兹王辛亥獻社廟一作稷壬子獻于紫微殿永徽元年九月七日庚子高侃執車鼻可汗癸卯獻太廟社昭陵甲寅獻于武德殿顯慶三年十二月蘇定方俘賀魯十五日甲午獻於昭陵十七日丙申告于太廟一作社皇帝臨軒大會百僚夷狄君長定方戎服操賀魯獻於樂懸之北總章元年十二月高麗平獻俘于含光殿乾封元年十月二十一日册府元龜亦云總章元年李績平高麗還上令領高藏等便道獻于昭陵備軍容奏凱歌獻於太廟十二月親祠南郊以高麗平昭告上帝永隆二年十月裴行儉俘突厥伏念等獻之開元二十二年六月幽州節度副大使張守圭大破契丹林胡遣使獻捷敕曰邊境為患莫甚於林胡輒變梟聲敢為獸搏守圭等乘間電發表裏齊攻積年逋誅一朝翦滅宜擇日告廟二十八年八月二十日破奚契丹擇日告廟自後有軍捷必先告廟傳云詔有司告九廟李光弼傳上元元年進圍懷州令郝廷玉由地道入禽安太清揚希仲送京師獻俘太廟狄仁傑傳久視元年李楷固駱務整討契丹克之獻俘含樞殿凱旋后舉酒屬仁傑賞其知人唐順天樓受俘觀德殿獻俘並見前兵捷類唐涇陽受回紇獻功詳見御詩及賜與外夷類舊紀貞觀二十年八月己巳幸靈州庚午次涇陽鐵勒回紇十一部各遣使朝貢九月甲辰諸部落俟斤頡利發等相繼而至靈州者數千人於是北荒悉平為五言詩勒石序其事紀貞觀三十年八月己巳如靈州庚辰次涇州九月甲辰鐵勒諸部請上號為可汗十月丙戌至自靈州回紇傳突厥已亡惟回紇與薛延陀為最雄強胡祿俟利發吐迷度與諸部攻薛延陀殘之并有其地遣使獻欵太宗為幸靈州次涇陽京兆涇陽縣受其功於是鐵勒十一部皆來言延陀不事大國以自取亡其下麏駭鳥散不知所之今各有分地願歸命天子請置唐官有詔張飲高會引見渠長等以唐官官之凡數千人唐紫微殿受俘見前平龜兹唐乾陽殿受俘會要顯慶五年正月癸卯蘇定方討都曼獻俘于東都上御乾陽殿定方操都曼以獻有司請論如法定方請曰臣間諭陛下意許以不死願丐其命帝曰朕為卿全信乃宥之唐含元殿數俘見前平高麗唐含光殿獻俘見上唐應天門受俘舊紀開元二十年五月戊辰信安王獻奚契丹之俘上御應天門受之唐獻俘太清宫册府元龜天寶五載正月己巳獻隴右節度使皇甫惟明所獲吐蕃突厥俘于太清宫庚午獻于太廟至德二載九月元帥廣平王收西京甲辰捷書至行在百僚稱賀即日告捷於太上皇遣宰相裴冕入京告郊廟社稷上元元年十月廣平王奏收懷州城禽七千餘衆是月獻俘于太廟二年二月河南破劉展告太廟代宗寶應二年四月命有司享太廟告獻史朝義首大厯二年正月華州賊周智光平命有司具儀奏告太清宫及太廟七陵貞元元年八月河中平傳李懷光首至告太廟長慶元年四月河北諸道平中書門下奏太宗平突厥高宗平高麗皆告陵廟蓋以高祖嘗蓄憤於北虜太宗亦鋭氣於東夷武功未終所宜啓告鎮冀幽薊盡復區宇祖宗宿憤霧擴煙銷詩曰維天之命太平告文王也望下禮官撰儀擇日薦告太廟以彰纘服之業五月己酉告于太廟二年八月汴州平賊李㝏告社廟太清宫中和四年六月徐州獻黃巢首獻于行廟龍紀元年二月汴州獻秦宗權帝御延喜門受俘告廟社乾寧元年十一月慶州傳王行瑜首帝御延喜樓獻於太廟唐開逺門獻俘見前禽石國王唐勤政樓獻俘紀天寶十三載五月壬戌觀酺於勤政樓北庭都護程千里俘阿布思以獻詔斬以徇傳突厥九姓首領阿布思開元初內附賜氏李名獻忠叛還磧外數盜邊十一載二月庚午冦邊十一載六月部落降詔程千里將兵討捕千里諭葛邏祿隂令掎角獻忠以窮歸葛邏祿縛之并妻子帳下數千人送千里所十二載九月甲寅執之乃獻俘勤政樓唐回鶻獻俘通鑑貞元七年吐蕃冦靈州為回鶻所敗九月回鶻遣使獻俘十二月甲午又獻所獲吐蕃酋長尚結心傳是嵗回鶻擊吐蕃葛祿於北廷勝之且獻俘明年使藥羅葛來朝會要貞元七年九月回鶻敗吐蕃於北庭使獻捷唐南詔獻捷紀貞元十年正月壬辰南詔蠻敗吐蕃于神川來獻捷通鑑正月戊戌遣使來獻捷南詔傳烏蠻别種也自舍尨以來有譜次可考高宗時遣使者入朝開元末皮邏閣賜名歸義五詔微歸義獨強求合六詔為一制可已并羣蠻遂破吐蕃入朝天子加禮馳遣中人册為雲南王賜錦袍金鈿帶七事大厯十四年異牟尋立吐蕃封為日東王然吐蕃責賦重奪其險立營候異牟尋稍謀內附會節度使韋臯撫諸蠻有威惠時貞元四年也遣諜遺書吐蕃疑之責大臣子為質後五年九年五月乃決䇿遣使者趣成都遺臯帛書願歸欵獻金示順革丹赤心也德宗嘉之賜詔書命臯遣諜往覘十月甲子臯令其屬崔佐時宣天子意十年正月至雲南異牟尋再拜受命與佐時盟點蒼山乃發兵攻吐蕃使者殺之刻金契以獻遣曹長隨佐時入朝自將數萬人大破吐蕃於神川遂斷鐵橋溺死以萬計俘其五王乃遣弟湊羅棟清平官尹仇寬等二十七人入獻地圖方物請復號南詔明年十年夏六月癸丑册為南詔王賜黃金印舊紀七月庚辰賜印以袁滋持節使滋至大會享使者出銀平脫馬頭盤二曰此天寶時先君宿衛皇帝所賜也有笛工歌女皆垂白曰此先君歸國時皇帝賜胡部龜兹音聲二列今唯二人在滋曰當抱忠竭誠永為西南藩屏復遣清平官尹輔酋等七人謝天子獻鐸鞘浪劒鬱創生金瑟瑟牛黃虎珀㲲紡絲象犀越睒統倫馬舊紀十年九月辛卯獻唐興安門受俘會要兼夲紀通鑑元和元年十月高崇文平蜀戊子禽劉闢以獻上御興安門觀之詰反狀命獻太清宫廟社二年十月平浙西禽李錡至闕下十一月甲申朔上御興安門親詰反狀十二年十一月丙戌朔李訴平淮西禽吳元濟以獻上御興安門大陳甲士旌旗於樓南羣臣諸蕃使皆列位元濟見于樓下命獻太廟太社文武百官分序街之左右六軍備衛十四年二月戊午劉悟斬李師道壬戌田弘正捷奏至己巳師道首函至上御興安門受田弘正所獻俘先獻太廟郊社羣臣稱賀於樓下大和三年五月宣慰使柏耆奏斬李同捷丁亥御興安門受滄州所獻俘百僚稱賀於樓前會昌四年八月辛巳朔平澤潞梟劉稹丙申宰相入賀十二日御興安門受獻戊戌稹首至京師獻于廟社百官樓前稱賀乾德崇元殿受俘見兵捷類開寶明德門受俘見兵捷類咸平崇德殿賀奏捷二年九月癸卯宴射後苑有頃鎮定高陽關部署傅潛遣騎奏先鋒田紹斌石普敗虜衆於亷良路從臣再拜稱賀是日上中的十一甲辰羣臣詣崇德殿賀奏捷景德潘羅支獻捷元年二月丁巳環慶鄜延言李繼遷以去嵗十一月劫西蕃至西涼府潘羅支詐降集蕃部合擊之繼遷大敗中流矢至靈州界死戊午潘羅支遣鄭延美貢名馬獻捷詔奬之先是咸平六年二月庚辰以西涼府六谷首領潘羅支為朔方軍節度使靈州西面都巡檢使時羅支遣蕃官來貢又集騎兵一萬乞會王師復靈州故有是命慶厯契丹獻戎捷五年十月五日宴契丹獻戎捷使於紫宸殿西征所獲馬三百匹羊二萬口九龍車一乘乙卯遣使獻之元祐崇政殿獻俘見兵捷類紀功碑銘附克敵必示子孫以無忘武功穆天子傳天子五日觀於舂山之上乃為名疏於懸圃之上以詔後世注勒石銘功德天子升于弇山乃紀其迹于弇山之石曰西王母之山迹文心雕龍周穆紀于弇山之石秦嶧山刻石大事記云刻石始於此後漢郡國志魯國注有騶山秦始皇刻石焉琅邪臺刻石曰古之帝者地不過千里猶刻金石以自紀愚按此秦以前已有刻石之罘刻石會稽刻石魯林鍾銘功晉景鐘銘勳漢封狼居胥山霍去病傳元狩三年秋胸奴入右北平定襄殺略漢千餘人四年春上令大將軍青票騎將軍去病各五萬騎步兵轉者踵軍數十萬而敢力戰深入之士皆屬去病始為出定襄當單于捕虜言單于東乃更令去病出代郡令青及四將軍出定襄青至幕北見單于兵陳而待於是青令武剛車自環為營衛而縱五千騎往當丐奴丐奴亦縱萬騎會日且入大風起漢兵縱左右翼圍單于自度戰不能與漢兵遂獨與壯騎數百潰漢圍西北遁走漢兵夜追之丐奴兵散走會明行二百餘里不得單于頗捕斬首虜萬餘級遂至填顔山趙信城而還青之入塞凡斬首虜萬九千級去病騎兵車重與大將軍等而亡禆將悉以李敢等為大校當禆將出代右北平二千餘里直左方兵所斬捕功多于青既皆還上曰票騎將軍去病率師躬將所獲葷允之士葷音熏葷允熏鬻也約輕齎絶大幕涉獲單于章渠單于臣也以誅北車耆王號也轉擊左大將雙獲旗鼓厯度難侯山名濟弓盧水名獲屯頭王韓王等三人丐奴王號將軍相國當户都尉八十三人封狼居胥山禪於姑衍登臨翰海張晏曰登海邊山以望海也有大功故增山而廣之也如淳曰翰海北海名也師古曰積土增山曰封為墠祭地曰禪執訊獲醜七萬四百四十三級師率減什二取食於敵卓行殊逺而糧不絶以五千八百戶益封票騎將軍武紀元狩四年夏武帝即位之二十四年去病與左賢王戰斬獲首虜七萬餘級封狼居胥山乃還注師古曰登山祭天築土為封刻石紀事以彰漢功丐奴傳票騎出代二千餘里與左王接戰漢兵得胡首虜七萬餘人左王將遁走票騎封於狼居胥山禪姑衍臨翰海而還是後丐奴逺遁幕南無王庭漢度河自朔方以西至令居通渠置田官兩將所殺虜八九萬單于用趙信計遣使好辭請和親敘傳票騎冠軍猋勇紛紜長驅六舉電擊雷震飲馬瀚海封狼居山西規大河列郡祁連揚雄書孝武深惟社稷之計規恢萬載之䇿興師數十萬使衛霍操兵前後十餘年於是浮西河絶大幕破填顔襲王庭窮極其地追奔逐北封狼居胥山禪於姑衍以臨翰海虜名王貴人以百數丐奴震怖益求和親快心於狼望之北忍百萬之師以摧飢虎之喙運府庫之財填盧山之壑揚雄賦聖武勃怒爰整其旅乃命票衛汾沄沸渭雲合電發猋騰波流機駭蜂軼疾如奔星擊如震霆碎轒輼破穹廬腦沙幕髓余吾遂獵王庭驅橐它燒􅪈蠡分梨單于磔裂屬國金鏃淫夷者數十萬人皆稽顙植頷扶服蛾伏杜篤賦遂命票騎勤任衛青勇惟鷹揚軍如流星燒罽帳燔康居灰珍奇椎鳴鏑釘鹿蠡獲昆彌馭宛馬鞭駃騠拓地萬里威震八荒捶氐僰攠卭莋轔濊貊南羈鉤町水劔強越連緩耳瑣雕題云云夏竦補封狼居胥山銘征朔幕兮振元戎鏖黠虜兮翦元凶車騎旋兮氛䘲空刻隆石兮山之峯永萬年兮漢之崇漢登單于臺武紀元封元年冬十月詔曰南越東甌咸伏其辜西蠻北夷頗未輯睦朕將巡邊垂擇兵振旅躬秉武節置十二部將軍親帥師焉行自雲陽北厯上郡西河五原出長城北登單于臺至朔方臨北河勒兵十八萬騎旌旗徑千餘里威震胸奴遣使者告單于曰南越王頭已懸於漢北闕矣單于能戰天子自將待邊不能亟來臣服何但亡匿幕北寒苦之地為胸奴讋焉丐奴傳天子巡邊親至朔方勒兵十八萬騎以見武節而使郭吉風告單于輿地廣記雲中有單于臺通典雲中郡雲中縣單于臺在縣西北百餘里水經注大碣石山在右北平驪城縣西南漢武帝登之以望巨海而勒其石漢出師頌見頌類漢勒功燕然山告類薦功和紀永元元年夏六月車騎將軍竇憲出雞鹿塞度遼將軍鄧鴻出棝陽塞南單于出滿夷谷與北丐奴戰于稽落山大破之追至和渠傳云私渠北鞮海憲遂登燕然山刻石勒功而還北單于遣弟右溫禺鞮王奉奏貢獻閏七月丙子詔曰丐奴背叛為害久逺賴祖宗之靈師克有捷醜虜破碎遂掃厥庭役不再籍萬里清蕩有司其案舊典告類薦功以彰休烈類祭天也九月庚申以憲為大將軍二年九月北丐奴遣使稱臣竇憲傳南單于請兵北伐乃拜憲車騎將軍金印紫綬以執金吾耿秉為副發北軍五校黎陽雍營緣邊十二郡騎士及羌胡兵出塞明年憲與秉各將四千騎及南丐奴左谷蠡王師子萬騎出朔方雞鹿塞南單于屯屠河名也將萬餘騎出滿夷谷度遼將軍鄧鴻及緣邊義從羌胡八千騎與左賢王安國萬騎出棝陽塞皆會涿邪山文選注引班固涿邪山祝文曰杖莭擁旄鉦人伐鼓憲分遣副校尉閻盤司馬耿夔耿談將左谷蠡王師子右呼衍王須訾等精騎萬餘與北單于戰於稽落山大破之單于遁走進擊諸部遂臨私渠北鞮海丐奴中海名斬名王已下萬三千級獲生口馬牛羊橐駝百餘萬頭於是溫犢須日逐溫吾夫渠王栁鞮等八十一部率衆降者前後二十餘萬人憲秉遂登燕然山去塞三千餘里刻石紀功紀漢威德令班固作銘曰惟永元元年秋七月理兵於朔方鷹揚之校螭虎之士爰該六師暨南單于東烏桓西戎氐羌侯王君長之羣驍騎三萬元戎輕武長轂四分雲輜蔽路萬有三千餘乘勒以八陳兵法有八陳圖蒞以威神玄甲耀日朱旗絳天遂凌高闕下雞鹿經磧鹵絶大漠斬溫禺以釁鼓血尸逐以染鍔然後四校橫徂星流彗掃蕭條萬里野無遺冦於是域滅區單反斾而旋考傳驗圖窮覽其山川遂踰涿邪跨安侯乘燕然躡冒頓之區落焚老上之龍庭將上以攄髙文之宿憤光祖宗之玄靈下以安固後嗣恢拓境宇振大漢之天聲乃遂封山刋石昭銘上德鑠王師兮征荒裔勦凶虐兮截海外敻其邈兮亘地界封神丘兮建隆嵑熙帝載兮振萬世憲乃班師而還南單于於漠北遺憲古鼎論曰率羌胡邉雜之師一舉而空朔庭追奔稽落之表飲馬北鞮之曲銘石負鼎薦告清廟贊曰聽笳龍庭鏤石燕然丐奴傳論破龍祠焚罽幕銘功封石倡呼而還班固北征頌曰揔三選簡虎校勒部隊明誓號援謀夫於末言察武毅於俎豆羌戎相率東胡爭騖不召而集未令而諭於是雷霆九原電曜高闕金光鏡野武旗罥霓衡雞鹿超黃磧斷溫禺分尸逐電激私渠星流霧落名王交贄稽顙請服封燕然以隆高擅廣鞬以弘曠崔駰北征頌曰順天機兮把刑德戈所指兮罔不尅前丐奴傳二師引兵還至速邪烏燕然山師古曰速邪烏地名也燕然山在其中漢班超紀功碑唐薑確傳出伊州距栁谷百里其處有漢班超紀功碑詳見兵捷類漢江陵刻石紀功馮緄傳延熹五年緄擊武陵蠻夷荆州平定振旅還京師於江陵刻石紀功詳見前類漢諸葛亮紀功碑銘隋志史萬嵗為行軍總管擊南寧夷至南中見諸葛亮紀功碑銘其背曰萬嵗之後勝我者過此開皇十七年二月癸未萬嵗平南寧羌勒石頌美隋德唐南詔傳廣德初鳯迦異築柘東城諸葛亮石刻故在文曰碑即仆蠻為漢奴夷畏誓常以石榰梧魏丸都山刻石紀功毋丘儉傳青龍中明帝圖討遼東以儉有計䇿徙幽州刺史明年討公孫淵定遼東正始中儉以高句驪數侵叛督諸軍步騎萬人出玄菟從諸道討之句驪王宫破走儉遂束馬垂車登九都屠句驪所都斬首虜千數宫逃竄六年復征之宫奔買溝儉遣玄菟太守王頎追之過沃沮千有餘里至肅慎氏南界刻石紀功刋丸都之山銘不耐之城所誅納八千餘口論功受賞侯者百餘人高句麗傳正始三年宫冦西安平五年為儉所破通鑑正始七年晉峴山紀績碑杜預傳刻石為二碑紀其勳績一沉萬山之下一立峴山之上隋林邑刻石紀功劉方傳大業元年正月軍至海口林邑王梵志遣兵守險方擊走之徑馬援銅柱南行八日至其國都梵志奔海獲其金人刻石紀功而還唐貞觀紀功業碑銘舊紀貞觀三年十二月癸丑詔建義已來交兵之處各立一寺命虞世南李百藥褚亮顔師古岑文本許敬宗朱子奢等為之碑銘以紀功業會要貞觀二年十二月一日詔破劉武周於汾州立洪濟寺李百藥為銘破宋老生於吕州立普濟寺許敬宗為銘破薛舉於豳州立昭仁寺朱子奢為銘破宋金剛於晉州立慈雲寺禇遂良為銘破王世充於邙山立昭覺寺虞世南為銘破竇建德於汜水立等慈寺顔師古為銘破劉黑闥於洺州立昭福寺岑文本為銘並貞觀四年正月建造畢禇遂良當作禇亮唐可汗山銘文苑英華貞觀十三年己亥二月八日辛巳大使右武衛大將軍慕容寶節副使朝散大夫任雅相等奉詔册真珠毗伽可汗嫡嗣為肆葉護可汗命謝偃為可汗山銘以紀其事萬鋒齊舉鞭電鼓雷拔山蹴嶽龍庭栁塞之外煙滅雲銷瀚海天山之前波澄霧卷震皇威於萬葉星劍騰兮虹旗揚繁欽征天山賦轒輼雲趨威弧雨發唐克高昌紀功薑確刋石頌見兵捷類高昌傳侯君集勒石紀功凱而旋俘智盛君臣獻觀德殿行飲至禮酺三日唐駐蹕山紀功破陳圖漢武臺紀功太宗紀貞觀十八年七月甲午營州都督張儉率幽營兵及契丹奚以伐高麗十一月甲午張亮為平壤道行軍大總管李世績馬周為遼東道行軍大總管率十六總管兵以伐高麗十九年二月庚戌如洛陽宫以伐高麗四月癸卯誓師于幽州城南大饗軍癸亥李世績克蓋牟城五月己巳平壤道行軍總管程名振克沙卑城庚午次遼澤丁丑軍于馬首山甲申克遼東城六月丁酉克白巖城己未大敗高麗於安市城東南山九月癸未班師十月丙午次營州丙辰皇太子迎謁于臨渝關戊午次漢武臺刻石紀功十一月癸酉大饗軍于幽州實録云十九年十月班師次漢武臺餘基三成傍有祠室塋域帝顧問侍臣對曰此是燕齊之士為漢武求仙之處其地俯臨大海長瀾接天岸多峻石奇怪之狀帝製文刻於石九域志滄州有漢武臺後魏志章武漢屬渤海有漢武帝臺舊紀貞觀十九年五月丁丑車駕度遼帝度遼凡十徙營甲申上親率鐵騎與李績圍遼東城拔之六月丁巳名所幸山為駐蹕山刻石紀功十月戊午次漢武臺刻石以紀功德二十年三月至自遼東獻俘授馘備法駕凱旋蠻夷君長夾道陳高麗傳本扶餘别種也隋末其王建武嗣武德初四年七月乙丑再遣使入朝高祖下書修好太宗已禽突厥頡利建武遣使者賀並上封域圖有蓋蘇文者殘凶不道殺建武更立建武弟之子藏為王貞觀十六年十一月丁巳營州都督張儉奏帝聞建武為下所殺惻然帝不欲因喪伐罪乃拜藏為高麗王十七年六月戊辰會新羅遣使者上書九月庚辰言高麗百濟連兵將見討謹歸命天子於是遣司農丞相里玄奬以璽書責高麗使止勿攻高麗違詔不從十八年二月乙巳朔玄奬還帝欲自將討之召耆老勞曰遼東故中國地而莫離支賊殺其王朕將自行經略之於是北輸粟營州東儲粟古大人城帝幸洛陽十月甲寅幸十一月壬申至乃以張亮為平壤道行軍大總管以李績為遼東道行軍大總管甲午又發契丹奚新羅百濟諸君長悉會庚子先造梯衝於安蘿山十九年二月帝自洛陽次定州謂左右曰今天下大定唯遼東未賔後嗣因士馬盛強謀臣導以征討喪亂方始朕故自取之不遺後世憂也三月丁丑幸定州壬辰發定州佩弓矢手結雨衣於御鞍四月戊戌朔李績濟遼水高麗皆嬰守帝大饗士帳幽州之南癸卯詔長孫無忌誓師乃引而東丁未發幽州績攻蓋牟城壬子拔之癸亥得户二萬糧十萬石以其地為蓋州程名振攻沙卑城夜入其西城潰五月己巳虜其口八千遊兵鴨緑上績遂圍遼東城帝次遼澤庚午高麗發新城國內城騎四萬救遼東道宗率張君乂逆戰君乂却道宗以騎馳之虜兵辟易奪其梁收散卒乘高以望見高麗陳囂急擊之斬首千餘級誅君乂以徇乙亥帝度遼水營馬首山丁丑藺甲光炫日石如雨城潰甲申獲勝兵四萬户糧五十萬石以其地為遼州進攻白崖乙未虜酋孫伐音以城降六月丁酉獲男女凡萬兵二千以其地為巖州次安市丙辰於是高麗北部傉薩高延壽南部傉薩高惠真引兵及靺鞨衆十五萬來援丁巳帝曰彼若勒兵連安市而壁據高山取城中粟食之縱靺鞨略吾牛馬攻之不可下此上䇿也拔城夜去此中䇿也與吾爭鋒則擒矣有大對盧官名為延壽計曰吾聞中國亂豪雄並奮秦王神武敵無堅戰無前遂定天下南靣而帝北狄西戎罔不臣今掃地而來謀臣重將皆在其鋒不可當今莫若頓兵曠日隂遣兵絶其糧道不旬日糧盡欲戰不得歸則無路乃可取也延壽不從引軍距安市四十里而屯帝曰虜墮吾䇿中矣命左衛大將軍阿史那社爾以突厥千騎當之虜以靺鞨鋭兵居前社爾兵接而北延壽曰唐易與耳進一舍倚麓而陳帝詔延壽曰我以爾有強臣賊殺其主來問罪交戰非我意延壽謂然按甲俟帝夜召諸將使李績率步騎萬五千陳西嶺當賊長孫無忌牛進達精兵萬人出虜背狹谷帝以騎四千偃旗趨虜北山上令諸軍曰聞鼓聲而縱張幄朝堂曰明日日中納降虜於此是夜流星墜延壽營旦日戊午虜視績軍少即戰帝望無忌軍塵土命鼓角作兵幟四合虜惶惑將分兵禦之衆已囂績以步槊擊敗之無忌乘其後帝自山馳下虜大亂斬首二萬級延壽收餘衆負山自固無忌績合圍之撤川梁斷歸路帝按轡觀虜營壘曰高麗傾國來一麾而破天贊我也下馬再拜謝况于天延壽等度勢窮舉衆降己未入轅門膝而前拜手請命帝曰後敢與天子戰乎惶汗不敢對帝料酋長三千五百悉官之許內徙餘衆三萬縱還之誅靺鞨三千餘人獲馬牛十萬明光鎧萬領高麗震駭后黃銀二城自拔去數百里無舍煙乃驛詔太子并賜諸臣書曰朕自將若此云何因號所幸山為駐蹕山圖破陳狀令將作造破陳圖勒石紀功又攻安市城不克有詔班師拔遼蓋二州之人以歸會要上征遼東進次安市城名其山為駐蹕山遂還命中書侍郎許敬宗為文刻石紀功敬宗曰一云敬播山名駐蹕蓋天意也乘輿不復東矣敬宗傳駐蹕山破賊命草詔馬前列傳楊弘禮駐蹕之役領步騎二十四軍跳出賊背所向摧靡帝自山下望其衆劉弘基戰駐蹕山有功李績從戰駐蹕山功多唐靈州勒石通鑑貞觀二十年八月己巳如靈州庚午回紇等十一姓各遣使入貢壬申上幸漢故甘泉宫詔以戎狄與天地俱生朕禽頡利滅延陀鐵勒百餘萬戶內屬混元以降殊未前聞宜備禮告廟九月上至靈州敕勒諸部俟斤遣使至者數千人咸云請上號可汗甲辰上為詩曰雪恥酬百王除凶報千古公卿請勒石靈州從之又見實録會要天寶九載三月二十五日靈州都督張齊丘請於新築安北大都護府建紀聖德碑頌許之唐龜兹刻石紀功阿史那社爾傳禽龜兹王刻石紀功而還見兵捷類唐平蠻頌碑九域志桂州有唐李靖嶺南道安撫大使平蠻頌碑唐汜水刻石立頌實録高宗顯慶二年十月幸鄭州壬子次泛水河南府汜水鄭制邑虎牢漢成臯以先帝於汜水擒竇建德因平王世充於是刻石立頌以紀功烈帝自為頌文玄宗開元二十三年二月巳亥以奚契丹既平宰臣耀卿九齡等奏賀曰初奉聖謀高深未測及聞凱捷晷候不差卧鼓滅烽誠自此始請宣付史館仍許將吏等刋石立頌以紀功德天寶十載十二月庚申敕安國寺以所撰先皇聖德頌刻石李絳傳安國佛祠立石紀聖德欲使絳為之頌絳上言秦刻嶧山不足為法帝悟唐西域紀聖德碑又見都督類會要龍朔元年六月十七日癸未吐火羅道置州縣使王名逺進西域圖記并請于闐以西波斯以東十六國分置都督府及州八十縣一百一十軍府一百二十六仍于吐火羅國立碑以紀聖德從之置月氏都督府先是顯慶二年十一月蘇定方破賀魯西域悉平置濛池崑陵二都護府金石録有顯慶四年八月高宗撰紀功碑飛白題額唐封禪碑勒名突厥傳高宗封禪都督葛邏祿叱利等三十餘人皆從至泰山下詔勒名於封禪碑云凡三十年北方無戎馬警麟德二年十月丁卯發東都赴東嶽突屈于闐波斯天竺罽賓烏萇崑崙倭國及新羅百濟高麗等諸蕃酋長各率其屬扈從忠義傳安金藏玄宗屬其事於史官擢右驍騎將軍爵代國公詔鑱其名於泰華二山碑以為榮開元二十年三月上思金藏忠烈封代國公仍于東西嶽立碑以銘其功一云勒其名唐姚巂道立石著功循吏傳裴懷古儀鳯中遷監察御史姚巂道蠻反命懷古馳驛往懷輯之申明誅賞歸者日千計俄縛首惡遂定南方蠻夏立石著功唐碎葉城刻石紀功裴行儉傳見兵捷類紀調露元年六月辛亥吏部侍郎裴行儉伐西突厥九月壬午執其可汗都支唐紀功大度山吐蕃傳武后永昌元年五月丙辰詔文昌右相韋待價為安息道大揔管明年天授二年五月復詔文昌右相岑長倩為武威道行軍大揔管以討吐蕃兵半道罷又明年長夀元年夏五月大酋領曷蘇率貴川部與黨項種三十萬降武后以右玉鈐衛將軍張玄遇為安撫使率兵二萬迎之次大度水六月吐蕃禽曷蘇去而它酋咱插又率羌蠻八千自來玄遇即其部置葉州咱插為刺史刻石大度山以紀功是嵗又詔右鷹揚衛將軍王孝傑為武威道行軍揔管率西州都督唐休璟左武衛大將軍阿史那忠莭擊吐蕃大破其衆復取四鎮更置安西都護府於龜兹以兵鎮守之武后紀長壽元年十月丙戌武威道行軍總管王孝傑敗吐蕃克四鎮唐鐵柱勒功見標界類吐蕃傳唐九徴建鐵柱於滇池以勒功舊書云神龍三年唐太原刻石紀功舊紀開元十一年幸并州以為太原府上親製起義堂頌及書刻石紀功于太原府之南街紀開元十一年正月乙巳如并州辛卯次并州改為北都唐紀聖德神功碑唐紀聖德碑見安北都護九域志河陽三城節度古迹有唐紀聖德神功碑天寶中建唐鳯翔出師紀功文粹楊炎作頌序曰維唐七葉姦臣盜二京皇帝肅宗龍鳴河北觀兵雍上於是巢山駕海之羣狼纛鳥章之君不期而趨于闕下者四十有三萬大陳于東郊皇帝建白麾以誓於軍天威動六合兵氣連太白乾坤為之坱軋河嶽為之震蕩狐鳴鑿齒之徒不崇朝而聲反於謳歌故鄠杜之師以形勝灞上之凶以威逐桃林之陳以奇破河洛之孽以氣摧帝乃間天牢回豹尾陵皓氣鎖欃槍雲髦玉輅山動地踊降自西雍幸於京師以成功告宗廟以雷雨洗川澤清蹕而奉聖皇稱觴以朝前殿華戎踊躍喜氣磅礴於是相與鑿石於誓師之場頌曰日為車兮雷為鼓醢鯨鯢兮掃煙雨紀至德二載二月戊子次于鳯翔至德元載改扶風為鳯翔郡八月癸巳大閲九月癸卯復京師甲辰捷書至鳯翔十月壬戌復東京癸亥上發鳯翔丁卯上入西京居大明宫唐河西聖德頌文粹楊炎河西平胡聖德頌至德二載春正月武威郡胡洎九蕃夷落通鑑武威九姓商胡安門物等伺師旅之間據金城害州伯二月乙丑詔太僕崔稱總中權又命內常侍劉日新護羌戎之長林竦蝟合會于東郊庚午引熊虎之師杖龍蛇之劔矛戟四起煙塵火色風雲入陳草木為兵通鑑河西兵馬使蓋庭倫殺節度使周泌度支判官崔稱與中使劉日新以二城兵攻之旬有七日平之頌曰詔虎臣兮殪天弧載火旗兮耀昆吾霽塵壘兮被戎都唐東渭橋紀功碑李晟傳帝至自梁晟以戎服見三橋帝駐馬勞之有詔賜第永崇里涇陽上田延平門之林園女樂一列晟入第京兆供帳教坊鼓吹迎導詔將相送之帝紀其功自文于碑敕皇太子書立于東渭橋以示後世又令太子録副以賜詳見前晟表謝云昭宣造化之情黼黻羲文之制上援彥範次述子儀唐興元紀功述李紓傳奉詔為興元紀功述及郊廟樂章紓德宗時為兵部侍郎聖功録見前唐韋臯破吐蕃紀功碑見兵捷類金石録碑德宗撰太子誦書貞元二十年十二月德宗又為段太尉紀功碑唐鹿頭山紀功高崇文傳鹿頭山南距成都百五十里扼二川之要劉闢城之旁連八屯以距東兵崇文始破賊二萬於城下明日戰萬勝堆凡八戰皆捷賊心始搖大將阿跌光顔軍鹿頭西斷賊糧道賊大震其將李文恱以兵三千自歸仇良輔舉鹿頭城二萬衆降遂趣成都餘兵面縛送欵闢走追禽之崇文刻石紀功于鹿頭山紀元和元年九月辛亥克成都司碑云十月遷檢校空領全蜀會要元和元年九月平西蜀詔刻石紀功于鹿頭山下崇文碑云命侍從之臣紀功篆石建碑于鹿頭之下蓋今相國裴公之詞有舊史成都北一百五十里有鹿頭山斷志漢州德陽鹿頭關杜甫鹿頭山詩連山西南俯見千里豁唐劔門銘栁宗元作皇帝元年八月帥喪衆暴劉闢滔天阻兵惟梁守臣嚴公礪遣前軍嚴秦奉揚王誅誕告南土十一月右師逾利州左師出劔門諭引劫脅蟻潰鼠駭􅬧鼓一振元戎啓行取其渠魁以為大戮銘曰井絡坤垠時惟外區界山為門環于蜀都攻出九地上披重雲攀天蹈空夷視阻艱破裂層壘殄殱羣頑銘功鑒亂永代是觀唐平淮西紀功平淮碑見兵捷類藩鎮傳帝美裴度功詔韓愈為平淮西碑李訴妻訴愈文不實帝命斫其文更命段文昌為之齋壇命信靈旗指越文粹韓雲卿平淮碑上元辛丑嵗叛臣劉展竊地弄兵命田神功統盧龍徑卒涉淮浮江梟魁逆銘石江滸曰昔在上元中夏猶虞姦宄矯攘鯨毒楚吳威威信都奮髯提戈援桴軍門氣凌山河地祇號風江靈鼓波上隕旄頭下除巴蛇肅宗紀上元元年十一月甲午揚州長史劉展反陷潤州丙申陷升州二年正月乙卯展伏誅唐淄青紀績碑舊書元和十四年二月田弘正獻李師道首命左右軍如受馘儀先獻太廟郊社憲宗御興安門受之百寮稱賀詔分其十二州為三節度俾馬總等分鎮命宰臣崔羣撰碑紀其績憲宗知人善任削平亂迹兩河復為王土唐盧龍紀聖功幽州紀功銘張仲武傳武宗時節度幽州盧龍烏介託天德塞上仲武請擊之拜副大使會回鶻特勒那頡啜擁赤心部七千帳逼漁陽仲武使弟仲至與别將遊奉寰率鋭兵三萬破之獲馬牛橐它旗纛遣吏獻狀進檢校兵部尚書會昌二年五月始回鶻常有酋長監奚契丹以督歲貢因詗刺中國仲武使禆將石公緒等厚結二部執諜者八百餘人殺之回紇欲入五原乃先以宜門將軍四十七人詭好結歡仲武得其謀因逗遛不遣使失師期回紇人馬多病死由是不敢犯五原塞烏介可汗失勢往依康居回紇遂衰名王貴族相繼降碑云前後受降三萬人仲武請立石以紀聖功詔德𥙿為銘揭碑盧龍以告後世回鶻傳帝詔德𥙿紀功銘石于幽州以夸後世張守圭傳徙幽州長史河北節度斬契丹酋屈刺及突于次紫蒙川閲軍實傳其首東都開元二十三年入見會藉田畢即酺燕為守圭飲至帝賦詩寵之拜輔國大將軍賜金綵官二子詔立碑紀功郭知運傳詔張説紀其功碑曰開元二年吐蕃入隴右掠坰牧公兵以奇勝冦不復蹤積甲山齊而有餘收馬谷量而未盡潛軍一舉大俘九曲鎖甲文劔僰馬㹈牛既獻戎捷遂頒朝賜糟粕韜鈐芻狗風角平西征北震戎疊獯文宗時河東節度李戴義立碑紀功李程為之辭景德禦冦圖見兵捷類元豐理戎碑三年鄜延經略司刻石紀邉計誦聖德錫名元豐理戎碑熙寧十年三月甲寅臣惠卿帥鄜延四月乙酉賜對五路邊防自十年至元豐三年凡三期乃具凡城之授守者所一百六十有六兵之備戰者其將八十有四凡戰守之器械以物計之無慮一萬三千三百三十八萬有竒皇帝至神成務以幾授成於初迄守不移遂立武事以申天威元豐三年八月辛卯朔陜西轉運權鄜延經略李稷言前經略使呂惠卿親奉聖訓措置邊計講頌聖德刻之樂石詔以元豐理戎之碑為額定功繼伐碑崇寧二年先事於青唐三年夏城鄯善以為西寧州冬誘偽王子趙懷德降獻于闕下大觀二年拔溪哥城以為積石軍收青藏川以為洮州政和六年築震武軍德威城鎮安城七年築制戎城宣和元年舉國來冦上用不赦乾順欵塞請命有詔班師凡平青唐吐蕃全國置州四軍一關一城六寨十堡十二收復夏國地數千里築軍一城七寨五堡壘二十四繼遷盜靈武嵗在壬寅今嵗復壬寅適百有二十年再周之數極矣命王安中撰定功繼伐碑御筆賜名平蠻碑余靖於桂州北門之外就崖石磨刻出師平賊受算凱旋年月以宣示皇朝威令用肅逺方又撰京觀記刻石于雍州歸仁鋪蠻冢之側殿中丞馮炳掌機宜撰平蠻記一卷帝赫斯怒王師有征寰海鏡清方隅砥平兵動若神謀不再計翦豺狼如拉朽掃欃槍如拾芥欃槍旬始竹破瓦解皇風用宣邊草齊偃震戎疊獯雲行電邁谷靜山空箭下聊城泥封函谷象浦通關龍沙開候神兵電掃夙沙自歸渭橋屈膝戈船泛月劍騎橫霜赤羽交而三軍風生金鼓鳴而萬夫氣作禡蚩尤誓鉤陳勢如雷霆功在漏刻涉龜沙薄烏壘暢轂文茵鉤膺鞗革朝至暮捷班馬蕭蕭歸旌奕奕解甲倒戈冰銷葉散卓行深入致果忘身以律則臧在和而克動惟膺揚靜則山立鼓之則震斾之則畏三謀協從七緯告慶狼態猘心滄波灌螢巨華拉殘挽天弧建神矛乘破竹順轉圜玉海卷一百九十四
