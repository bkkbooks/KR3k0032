body:
  text: 玉海卷一百八十一宋王應麟撰食貨鹽鐵茶法吕成公曰洪範五行一曰水水曰潤下潤下作鹹此鹽之根原品目甚多世所共知者如青州出東海幽薊北海嶺南南海皆出於海劍南西川出於井河東出於池鹽之尤著者河北鹵地出於地者永康軍崖鹽為出於山又有出石木大抵生民日用不可一日闕所以天地間無處不有自禹貢青州貢鹽絺此海鹽之見於經三代鹽雖入貢與民共之未嘗有禁自管仲相桓公始興䇿奪民利自後鹽禁方開漢興除山澤之禁武帝時孔僅桑弘羊祖管仲之法始禁榷昭帝召賢良文學論民疾苦請罷鹽鐵弘羊論難不能廢元帝雖暫罷而復建此後法雖有寛有急然禁榷與古今相為終始以此知天下利源不可開一開不可塞本朝南方之鹽全在海其利廣最資國用北方全在解池與契丹西夏相參雜所以議論最詳海鹽全資於人解池全資於天自章惇行禁榷蔡京專利變法鹽法既變犯禁者多矣胡致堂曰鹽為天地自然之利盡捐之民則縱末作資游惰盡屬之官則奪民日用公室有近寳之害官為厲禁俾民取之而裁入其税則政平害息鐵官非世所重故論者詳於鹽法禹鹽鐵書禹貢青州貢鹽絺梁州貢鏐鐵周禮九貢銀鐵物貢吕氏春秋伊尹曰大夏之鹽廣韻注古者宿沙初作煮海為鹽說文同周鹽人禮鹽人奄二人掌鹽之政令以共百事之鹽祭祀共其苦鹽散鹽賔客共形鹽王之饍羞共飴鹽凡齊事鬻鹽以待戒令注杜子春讀苦為盬鄭司農云散鹽湅治者玄謂鬻水為鹽疏盬謂出於鹽池今顆鹽是也散鹽出於東海形鹽鹽之似虎形疏左氏傳鹽虎形是也飴鹽鹽之恬者今戎鹽有焉疏即石鹽是也齊事和五味之事鬻鹽湅治之鹹鹺建其明號虎形昭其盛飾商書載説命之辭周官列鹽人之職周安邑鹽池水經汾水注穆天子傳曰乙酉天子西絶鈃蹬西南至盬穆天子傳曰乃遂于盬注盬鹽池在河東解縣涑水注涑水又與景水合水出景山北谷山海經曰景山南望鹽販之澤郭景純曰即解縣鹽池也谷口嶺上有巫咸祠其水又逕安邑故城南又西流注于鹽池地理志曰鹽池在安邑西南許慎謂之盬袤五十一里廣七里周一百一十六里宿沙煮海謂之鹽河東鹽池謂之盬今池水東西七十里南北十七里紫色澄渟渾而不流水出石鹽自然印成朝取夕復終無減損惟暴雨則耗公私共堨水徑防其淫濫謂之堨水故山海經謂之鹽販之澤池西又有一池謂之女鹽澤東西二十五里南北二十里在猗氏故城南春秋成六年晉大夫曰郇瑕地沃饒近盬服䖍曰引水分灌川野畦水耗竭土自成鹽即所謂鹹鹺也而味苦號曰盬田鹽本司鹽都尉治領兵千餘人周穆王漢章帝並幸安邑而觀鹽池故杜預曰猗氏有鹽池後罷尉司分猗氏安邑置縣以守之河水又東過金城允吾縣北注十三州志曰湟水又東南逕卑禾羌海北有鹽池河水又東北髙平川水注之注三水温泉東有鹽池河水又東南逕朔方縣故城東北注按地理志云金連鹽澤青鹽澤在縣南魏土地記曰縣有大鹽池其鹽大而青白名曰青鹽又名戎鹽左傳郇瑕氏之地沃饒近盬注猗氏縣鹽池韓獻子曰山澤林盬國之寳也近寳公室乃貧史記正義河東鹽池是畦鹽縁黄河鹽池有八九所而鹽州有烏池猶出三色鹽有井鹽畦鹽花鹽西方鹹地堅且鹹即出石鹽及地鹽柳子晉問猗氏之鹽晉寳之大也決源釃流脉寫膏浸神液隂漉甘鹵密起孕靈富媪不愛其美迴眸一瞬積雪百里鍜圭椎璧印纍珠剖家獲作鹹之利人被六氣之用其賚天下也與海分功周觀安邑之池晉寳郇瑕之利兹民仰食與海分功釃以千畦必待薫風之至凝而一色每同積雪之珍真潤下以作咸鹵異熬波而出素齊鹽筴管子海王篇海王之國謹正鹽筴十口之家十人食鹽百口之家百人食鹽終月大男食鹽五升少半少半猶劣薄也大女食鹽三升少半吾子食鹽二升少半吾子謂小男小女也此其大厯也禺筴之商禺讀為偶日二百萬有二國之籍者六千萬注鹽官之利當一國而三萬人鐵官之利當一國而三萬人故能有二國之籍者六千萬人鐵官之數曰一女必有一鍼一刀耕者必有一耒一耜一銚行服連軺輂者必有一斤一鋸一錐一鑿鍼之重加一三十鍼一人之籍刀之重加六五六三十五刀一人之籍耜鐵之重加七三耜鐵一人之籍注一女之籍三十鍼五刀一農之籍三耜鐵其器彌重其加彌多舉臂勝事無不服籍者桓公曰國無山海不王乎管子曰因人之山海假之名地數篇出銅之山四百六十七出鐵之山三千六百九輕重甲篇齊有渠展之鹽請君伐菹薪煮水為鹽一云煑泲水征而積之十月至正月成三萬六千鍾下令曰孟春農事起無得煮鹽此則坐長十倍桓公糶之得成金萬一千餘斤管仲之鹽鐵税之而已鹽雖官自煑鐵則官未嘗冶鑄重計口食鹽而禺筴之算密計人用鐵而加籍之數王道浸㣲王伯爭騖設祈望之守興榷筦之法以佐兵賦寛地征國語齊通魚鹽於東萊左傳晏子曰海之鹽祈望守之漢貨殖傳猗頓用盬鹽起盬鹽池也郭縱以鑄冶成業蜀卓氏用鐵冶富程鄭亦冶鑄羅裒擅鹽井之利期年所得倍宛孔氏用鐵冶為業大鼓鑄魯丙氏以鐵冶起刁間逐魚鹽之利凡名氏見于貨殖傳四十人力田務本以其道而富者宣曲任氏而已漢郡國鹽鐵官幹官鹽鐵令品鹽澤地理志河東郡安邑縣鹽池在西南千乘郡東萊郡東牟縣蜀郡臨卭縣犍為郡南安縣隴西郡遼東郡平郭縣皆有鐵官鹽官京兆鄭馮翊夏陽扶風雍漆弘農郡宜陽縣河東郡皮氏平陽絳縣太原郡大陵河内郡隆慮河南郡潁川郡陽城汝南郡西平南陽郡宛廬江郡皖山陽郡沛郡沛魏郡武安常山郡都鄉涿郡千乘郡千乘濟南郡東平陵歴城泰山郡嬴齊郡臨淄琅邪郡東海郡下邳朐縣臨淮鹽瀆堂邑桂陽郡漢中郡沔陽犍為郡武陽漁陽郡漁陽右北平郡夕陽中山國北平膠東國郁秩城陽國莒東平國魯國魯楚國彭城廣陵國皆有鐵官太原郡晉陽縣南郡巫鉅鹿郡堂陽渤海郡章武北海郡都昌夀光東萊郡曲成㡉縣昌陽當利琅邪郡海曲計斤長廣㑹稽郡海鹽益州郡連然巴郡朐忍安定郡三水北地郡弋居上郡獨樂龜兹西河郡富昌朔方郡沃壄又朔方縣有金連鹽澤青鹽澤皆在南五原郡成宜鴈門郡樓煩又鹽澤在沃陽東北有長丞漁陽郡泉州遼西郡海陽南海郡畨禺蒼梧郡髙要皆有鹽官地理志自京兆至廣陵凡郡四十有鐵官五十一作四十八自河東至蒼梧凡郡二十五有鹽官三十五一作三十六有或曰天下郡縣有鹽鐵官者七鐵官者四十三有鹽官者二十九置洪氏曰鐵官三十八鹽官二十九有終以史攷之鹽鐵官多布于西北而東南之郡不多軍詰徐偃日為膠東魯國器用食鹽取給鄰郡且鹽鐵郡國有餘藏縱膠東魯國廢不足為國家利害則知孝武猶未竭利盡取也食貨志元狩四年以東郭咸陽孔僅為大農丞領鹽鐵事咸陽齊之大鬻鹽僅南陽大冶鄭當時進言之桑弘羊賈人子三人言利事析秋豪矣明年大農上鹽鐵丞孔僅咸陽言山海天地之藏宜屬少府陛下弗私以屬大農佐賦願募民自給費因官器作䰞鹽官與牢盆敢私鑄鐵器鬻鹽者􅎂左趾没入其器物郡不出鐵者置小鐵官鑄故鐵使屬在所縣使僅咸陽乘傳舉行天下鹽鐵作官府主鬻鑄出納除故鹽鐵家富者為吏通鑑綱目元狩四年冬置鹽鐵官大事記五年初榷鹽鐵大農幹鹽鐵官布多置水衡欲以主鹽鐵大農以均輸調鹽鐵助賦元封元年弘羊代僅幹天下鹽鐵請置大農部丞數十人分部主郡國各徃徃置均輸鹽鐵官紀昭帝始元六年二月詔問郡國所舉賢良文學民所疾苦議罷鹽鐵榷酤丞相奏罷關内鐵官見上宣帝地節四年九月詔減鹽賈元帝初元五年四月詔罷鹽鐵官永光三年冬以用度不足復鹽鐵官志曰三年而復成帝河平三年正月沛郡鐵官冶鐵飛五行志征和二年涿郡鐵官鐵飛陽朔三年六月潁川鐵官徒百八十人盗庫兵永始三年十二月山陽鐵官徒二百二十八人盗庫兵列傳張湯請造白金及五銖錢籠天下鹽鐵師古曰籠羅其事皆令利入官官傳又云趙國以冶鑄為業王數訟鐵事賈捐之對武帝時民賦數百造鹽鐵酒榷之利以佐用度貢禹言漢家鑄錢及諸鐵官皆置吏卒徒攻山取銅鐵一歳十萬人已上中農食七人是七萬人常受其饑也王尊補遼西鹽官長如淳曰地理志遼東有鹽官翟方進請増益鹽鐵百官表治粟内史更名大司農屬官有斡官鐵市兩長丞初斡官屬少府中屬主爵後屬大司農注如淳曰主均輸之事所謂斡鹽鐵而榷酒酤也史記自序司馬昌為秦王鐵官貨殖傳山東食海鹽山西食鹽鹵嶺南沙北固往往出鹽鹽鐵論本議篇大夫曰先帝建鐵官以贍農用水旱篇賢良曰縣官鼓鑄多為大器務應貟程不給民用鹽與五穀同賈民或木耕手耨復古篇大夫曰故扇水都尉彭祖寧歸言鹽鐵令品令品甚明卒徒衣食縣官作鑄鐵器給用甚衆而吏或不良禁令不行故民煩苦之後百官志大司農屬官舊有郡國鹽官鐵官中興皆屬郡縣注出鹽多者置鹽官主鹽税出鐵多者置鐵官主鼔鑄紀和帝章和二年夏四月戊寅詔曰昔孝武致誅胡越故權收鹽鐵之利以奉師旅之費自中興以來匈奴來賔永平末年復脩征伐先帝即位務休力役然猶深思逺慮安不忘危探觀舊典復收鹽鐵欲以防備不虞寧安邉境而吏多不良動失其便以違上意先帝恨之故遺戒郡國罷鹽鐵之禁縱民煮鑄入税縣官如故事永元十五年七月丙寅復置涿郡故安鐵官列傳鄭衆建初六年為大司農肅宗議復鹽鐵官衆諫以為不可注昭帝罷之今議欲復詔數切責至被奏劾衆執之不移帝不從朱暉元和中穀貴縣官經用不足尚書張林上言鹽食之急者雖貴人不得不須官可自䰞詔諸尚書通議暉奏林言不可施行事遂寢後陳事者復重述林前議以為便帝然之有詔施行暉復獨奏曰鹽利歸官則下人窮怨帝怒切責諸尚書暉等皆自繫獄云云帝乃意解寢其事馬稜章和元年遷廣陵太守時穀貴民饑奏罷鹽官以利百姓循吏傳衛颯建武二年遷桂陽太守耒陽縣山鐵石續志耒陽縣有鐵官他郡民庶私為冶鑄多致姦盗颯乃上起鐵官罷斥私鑄歳所増入五百餘萬漢鹽鐵論見論類本議第一曰惟始元六年有詔使丞相御史與所舉賢良文學問民疾苦文學對曰抑末利開仁義御史大夫桑弘羊難以為安邉足用之本罷之不便文學曰有山海之貨而民不足於財者不務民用而淫巧衆是開利孔為民罪梯也禁耕第五大夫曰異時鹽鐵未籠布衣有朐邴人君有吳王專山澤之饒私威積而逆節之心作文學曰王者不蓄聚下藏於民逺浮利務民之義故權利深者不在山海在朝廷一家害百家在蕭牆不在朐邴文帝時無鹽鐵之利而民富今有之而百姓病文帝縱民得鑄錢冶鐵煑鹽吳王擅鄣海澤鄧通專西山復古第六大夫曰古者名山大澤不以封為下之專利也豪民欲擅山海以致富業故沮事者衆文學曰今公卿辨議所謂抱小利而忘大利利議第二十七大夫曰明主憂勞萬人思念北邉故舉賢良文學髙第將欲觀殊議異䇿諸生無能出竒計徒守空言不知取舎之宜時世之變文學曰諸生對䇿殊路同歸指在於崇禮義退財利復往古之道匡當世之失執事闇於明禮而喻於利末以故未決國病第二十八丞相史曰辯國家之政事論執政之得失何至切切如此乎賢良文學曰諸生之諤諤乃公卿之良藥鍼石也執務第三十九丞相史曰先王之道軼乆而難復賢良文學之言深逺而難行非當世之所能及也遂罷議請且罷郡國榷酤關内鐵官奏可雜論第六十曰汝南朱子伯言當時豪俊輻輳賢良茂陵唐生文學魯萬生之倫六十餘人云云然蔽於雲霧終廢而不行公卿知任武可以辟地不知徳廣可以附逺知權利可以廣用不知稼穡可以富國也漢勃海鹽池鹽井平當傳使行流民幽州舉奏吏二千石勞徠有意者言勃海鹽池可且勿禁以救民急宣紀蓮勺鹵中注如淳曰有鹽池縱廣十餘里名為鹵中師古曰今在櫟陽縣東地理志金城臨羌有鹽池越巂定筰出鹽後西羌傳虞詡疏雍州之域有龜兹鹽池為民利注上郡龜兹縣有鹽官貨殖傳成哀間成都羅裒擅鹽井之利遂殖其貨王莽傳羌豪良願等獻鮮水海允谷鹽池漢安邑鹽池唐寳應靈慶池地理志河東安邑鹽池在西南魏都賦墨井鹽池注在猗氏南東西六十四里南北七十里洛陽記曰河東鹽池長七十里廣七里後漢志河東鹽池注水氣紫色有别御鹽四面刻如印齒文章字妙不可述後紀章帝元和三年秋八月乙丑幸安邑觀鹽池許慎說文云河東鹽池袤五十一里廣七里周一百一十六里在今蒲州虞鄉縣西靈帝熹平四年六月遣守宫令之鹽監穿渠為民興利注今蒲州安邑縣西南有鹽城監揚雄傳上河東賦云三月將祭后土回安邑顧龍門覽鹽池注師古曰鹽池在今虞州安邑南唐地理志河中府安邑有鹽池與解為兩池大厯十二年生乳鹽賜名寳應靈慶池見池類郭璞鹽池賦水潤下以作鹹莫斯鹽之最靈鍔剡棊方玉潤膏澤雪白凌岡粲若散璧煥若布璋若乃煎海鑠泉或湅或漉飴戎見珍於西隣火井擅竒乎巴濮豈若兹池汲靈潤於河汾總膏液乎澮涑漢㢮山澤紀文後六年夏四月大旱㢮山澤解而不禁與衆庶同其利武元鼎二年秋九月詔曰山林池澤之饒與民共之元初元元年四月詔江海陂湖園池屬少府者以假貧民勿租賦唐開元十六年十二月甲辰㢮陂澤禁魏鹽池蜀漢鹽池徐邈傳魏明帝以徐邈為凉州刺史河右少雨乏穀邈上脩武威酒泉鹽池以收虜穀又廣開水田蜀志先主定益州置鹽府校尉王連傳遷司鹽校尉較鹽鐵之利利入甚多有禆國用文選蜀都賦濵以鹽池魏都賦墨井鹽池元滋素液後魏志自遷鄴後於滄瀛幽青四州之境傍海煮鹽滄州置竈一千四百八十四瀛州四百五十二幽州一百八十青州五百四十六又邯鄲置竈四計終歳合收鹽二十萬九千七百八斛四升太和二十年十二月乙丑開鹽池禁魏有水精戎鹽九種鹽通河東鹽池歳絹三十萬匹隋初鹽池鹽井與民共之景明四年七月庚午復收鹽池利正始三年四月乙未罷之從甄琛議琛表云周禮山林川澤有虞衡之官為之厲禁蓋取之以時不使戕賊實為民守之也今縣官鄣䕶河東鹽池而收其利是專奉口腹不及四體也神龜元年復置監官陳書天嘉二年虞茘孔奐以國用不足奏立煮海鹽税隋志後周掌鹽掌四鹽政令散鹽煮海以成之盬鹽引池以化之形鹽掘地以出之飴鹽於戎以取之理道要訣陳虞茘孔奐之徒魏髙陽清河之輩皆言煮海之説用明利國之方唐鹽池鹽井鹽院觀鹽池鹽屯鹽法食貨志唐有鹽池十八井六百四十皆隷度支蒲州安邑解縣有池五總曰兩池歳得鹽萬斛以供京師鹽州五原有烏池白池瓦池細項池地理志夏州朔方有鹽池二靈州有温泉兩井㑹要無靈州長尾五原紅桃囘樂弘靜池地理志京兆富平有鹽池澤㑹州有河池地理志因雨生鹽三州皆輸米代鹽安北都䕶府有胡落池歳得鹽萬四千斛給振武天徳地理志宥州長澤有胡洛鹽池甘泉張掖凉州姑臧肅州福禄伊州納職皆有池黔州有井四十一成巂州井各一果閬開通井百二十三山南西院領之卭眉嘉州有井十三劍南西川院領之梓遂綿合昌渝瀘資榮陵簡等州井四百六十劍南東川院領之皆隨月督課幽州大同横野軍有鹽屯每屯有丁有兵歳得鹽二千八百斛下者千五百斛明皇時姜師度尹河中時安邑鹽池涸廢師度大發卒洫引其流置鹽屯公私收利不貲負海州歳免租為鹽二萬斛以輸司農青楚海滄棣杭蘇等州以鹽價市輕貨輸天寳至徳間鹽每斗十錢乾元元年第五琦為使初變鹽法就山海井竈近利之地置監院游民業鹽者為亭户及為榷鹽鐵使盡榷天下鹽後劉晏上鹽法輕重之宜琦始榷鹽佐軍興晏代之法益密以出鹽鄉因舊監置吏亭户糶商人縱其所之江嶺去鹽逺者有常平鹽商人不至則減價以糶民官收厚利而人不知貴吳越揚楚鹽廪至數千有漣水湖州杭州越州四場嘉興海陵鹽城新亭蘭亭臨平永嘉太昌候官富都十監歳得錢百餘萬緡以當百餘州之賦自淮北置巡院十三揚州至鄭滑捕私鬻者姦盗衰息晏之始至也鹽利歳纔四十萬緡大厯末六百餘萬緡天下之賦鹽利居半宫闈服御軍饟官俸皆仰給傳初歳收緡錢六十萬末乃什之計歳入千二百萬而榷居大半京師鹽貴詔取三萬斛赴關中自揚州四旬至都人以為神貞元四年江淮斗増二百為錢三百一十後復増六十河中兩池鹽斗三百七十豪賈射利官收不能半劉晏鹽法既成商人納絹代鹽利者緡加二百備將士春服徳宗詔中書度支議減鹽價曰煮海之利所入歳倍田租軍費日增榷價日重有以穀一斗易鹽一升順宗始減江淮鹽價斗二百五十河中兩池鹽斗錢三百増雲安渙陽塗􅀢三監其後江淮斗減錢十以便民元和元年四月一云二年三月李㢲為使以鹽利皆歸度支物無虚估會要㢲奏去年收緡錢七百二十七萬比舊法張其估一千七百八十餘萬非實數請以其數付度支鹽利繫度支自此始天下糶鹽税茶其贏六百六十五萬緡初歳之利如晏季年後三倍晏時傳自劉晏後賦入朘耗㢲涖職一年較所入如晏最多之年明年過之又明年増百八十萬緡㢲薦程异為揚子留後計較増於㢲四年五月㢲卒兩池鹽利歳收百五十餘萬緡四方豪商雜處解縣主以郎官其佐貳皆御史鹽民田園籍於縣而令不得以民治之李晟傳城鹽州復故池以新鹽賜宰相憲宗討淮西度支使皇甫鎛奏加劍南東西川山南西道鹽估以供軍峽内四監自兵興河北鹽法羈縻而已鎛奏置榷鹽使如江淮榷法一云税鹽院三兩池置榷鹽使自貞元十九年史牟始元和十四年月鄆兖青三州置榷鹽院十五年九月庚子朔改河北税鹽使為榷鹽使長慶元年三月戊申停河北榷鹽法太和五年王承元徙節平盧淄青始鹽禁未嘗行兩河承元請歸有司由是兖鄆諸鎮皆奉行長慶二年户侍張平叔議榷鹽法弊請官自糶鹽可以富國疏其利十八事詔公卿議中書舍人韋處厚發十難抗論不可以為强人所不能事必不立禁人所必犯法必不行兵部侍郎韓愈條詰之平叔屈服會要太和三年四月安邑解兩池榷課以錢百萬緡為定額及大中六年度支收榷利一百二十一萬五千餘緡宣宗即位判度支盧弘宣傳作盧弘止以兩池鹽法敝遣司空輿更立新法其課倍入遷榷鹽使輿為安邑兩池榷鹽使先是法疏濶吏輕觸禁輿為立約數十條宣宗擇嘗更畿輔望縣令者為監院官户部侍郎裴休為使上鹽法八事法皆施行兩池榷課大増後諸鎮擅利兩池為河中王重榮所有歳貢鹽三千車田令孜請以屬鹽鐵使竟不能奪地理志總括諸道凡天下有鹽之縣一百五關内自富平至長澤縣九河南自掖至莒縣六河東安邑解縣二河北自鉅鹿至清池三山南自秭歸至西充十八隴右自長道至玉門縣八淮南海陵鹽城縣二江南自嘉興至彭水縣十二劍南自彭州蒲江至江安縣三十九嶺南自東筦至義倫縣六並有鹽太宗紀貞觀十二年二月乙丑如陜州丁卯觀鹽池㑹要開元元年十二月河中尹姜師度以安邑鹽池漸涸疏決水道置為鹽屯公私大收其利前世鹽皆自生開元中姜師度為尹而池涸故唐格自開元後遂有畦夫營種之課皇朝張席上書論鹽漫生之利遂罷畦夫其年十一月五日左拾遺劉彤上表論鹽鐵請官收其利表曰取山澤則公利厚而人歸於農取貧人則公利薄而人去其業先王之作法也山海有官虞衡有職輕重有術禁發有時一則專農二則饒國上令宰臣議可否咸以鹽鐵之利甚益國用遂令將作大匠姜師度户部侍郎强循俱攝御史中丞與諸道按察使檢校鹽鐵之課傳云俄為議者沮閣不行十年八月十日敕諸州鹽鐵令刺史上佐檢察收課貞元二十一年二月乙丑順宗停鹽鐵使月進王播傳長慶初復領鹽鐵以正額月進為羡餘歳百萬緡和又請鹽院糶鹽與商人斗加五十通舊三百文元五年王播奏江淮河南嶺南峽中兖鄆等鹽利錢六百九十八萬貫比改法以前舊鹽利時價四倍虚估此錢當為一千七百四十餘貫請付度支從之七年播奏去年鹽利除割峽内鹽收錢六百八十五萬從實估也六年詔峽内鹽五監屬度支列傳齊抗以倉部郎中斡鹽利劉晏正鹽官法以裨用唐鹽鐵使鹽鐵使乾元元年度支郎中第五琦充諸道鹽鐵使琦三為使劉晏三元載包吉崔縱韓滉竇參張滂王緯李錡杜佑李巽李鄘盧坦王播三柳公綽王涯令狐楚李石楊嗣復崔珙杜悰再馬植裴休柳仲郢夏侯孜劉鄴于琮崔彦昭王凝裴坦髙駢蕭遇韋昭度孔緯杜遜能崔昭緯李知柔徐彦若崔嗣裴樞柳璨自乾元元年至天祐元年為鹽鐵使者四十有二人安邑解縣兩池置榷鹽使一貟烏池在鹽州温池置榷税使貞元二十一年鹽鐵度支合為一使以杜佑兼領杜悰兼度支鹽鐵并二使財以贍兵王涯亦兼領寳應元年劉晏領度支鹽鐵轉運鑄錢租庸使鹽鐵兼轉運自晏始長慶二年張平叔請宰相領使韋處厚曰論道之地不宜雜以鹺務有鹽之縣一有鐵之縣一唐榷鹽院舊紀長慶元年三月戊申罷河北榷鹽法計課利數付榷鹽院唐兩池鹽法盧弘止傳領度支初兩池鹽法弊得費不相償弘止使判官司空輿檢鉤釐正條上新法即表輿兩池使自是課入歳倍理道要訣大厯中舉天下鹽利九百餘萬貫唐税茶法紀徳宗建中三年九月丁亥初税商錢茶漆竹木興元元年正月罷竹木茶漆税貞元九年正月癸酉復税茶舊紀初税茶文宗太和七年正月壬辰罷吳蜀冬貢茶食貨志徳宗納户部侍郎趙賛議税天下茶漆竹木十取一以為常平本錢税茶肇於此及出奉天下詔罷之興元元年正月癸酉罷之貞元八年以水災減税明年諸道鹽鐵使張滂奏出茶州縣若山及商人要路以三等定估十税其一歳得錢四十萬緡茶税自滂始然水旱未嘗征之也十年陸贄請以税茶錢置義倉云歳約得五十萬貫勅令貯户部救飢凶穆宗即位長慶元年五月壬子王播増天下茶税率百錢増五十右拾遺李珏諫言不可有三不從珏傳曰播増茶税十之五其後王涯判二使太和九年王涯判二使改江淮嶺南茶法増其税十月乙亥涯兼榷茶使徙民茶樹於官場焚其舊積天下大怨令狐楚代為鹽鐵使十二月復令納榷加價而已詔罷榷茶李石為相開成元年以茶税歸鹽鐵復貞元之制㑹要太和五年九月敕税茶法起來年付鹽鐵使收管九年令狐楚請付州縣而入其租于户部人悦焉開成元年李石以中書侍郎判收茶法武宗即位崔珙又増江淮茶税諸道置邸收税謂之搨地錢私販益起大中初鹽鐵轉運使裴休著條約天下税茶増倍大中六年正月二十六日裴休奏釐革横税招諭私販四月天平浙西請依舊税茶五月休又立税茶之法凡十二條上大悦貞元江淮茶為大摸一斤至五十兩鹽鐵使于悰每斤增稅錢五謂之剰荼錢咸通中列傳庾敬休為户部侍郎西川山南道歳征茶募賈人入錢京師敬休請置院秭歸收度支錢敬晦觀察浙西時南方連饉有詔弛榷酒茗裴休立税茶十二法人以為便時方鎮設邸閣居茶建言許收邸直毋擅賦商人陸羽著茶經三篇常伯熊因羽論復廣著茶之功其後尚茶成風囘紇入朝始驅馬市茶何易于為益昌令鹽鐵官榷取茶利詔下所在毋敢隠易于命吏閣詔地理志湖州長城顧山有茶以供貢義興貢茶自李栖筠始憲宗元和十四年八月乙亥歸光州茶園於百姓穆宗元和十五年三月罷歳貢茶丁謂曰元和國計圖税茶歳不過四十萬緡乾徳榷貨務乾徳二年八月辛酉置榷貨務京師及建安漢陽蘄口並置開寳三年七月丁亥移建安務於揚州令客旅入金銀錢帛於揚州給憑就建安請領茶貨交引始於此州十月甲申禁私販河東及幽盖為契丹北漢設也開寳七年閏十月有司欲請湖南新茶之估以出於民上曰是不重困吾人耶遂置其議詔書屢下㢮鹽禁於河北實鹽價於海瀕興國元年十月二十二日詔茶鹽榷酤以開寳八年額為定不得復増二年正月辛夘江南漕臣樊若水奏増茶價二月敕於沿江置榷貨八務五年八月禁私茶淳化四年二月四日癸亥廢八榷務自江之南悉免其算先是秘丞劉式請廢榷務許商人輸錢京師給劵就茶山給以新茶縣官減轉漕之直而商價獲利從之七月十二日戊戌詔仍舊貫復置八務至道元年七月十九日以楊允恭兼制置茶鹽使李廷遂王子輿副之二年九月詔連州歳造龍鳯茶咸平二年九月二十三日子輿言江淮浙茶鹽收錢三百九十七萬餘緡増五十萬八千餘緡萬自江淛納士山場榷務總四百餘緡祥符已後歳及二百萬緡六年七年並及三百萬緡八年榷務茶引錢一百五十萬緡比新額虧十萬緡惟川峽廣南茶聴民自賣買禁其出境餘悉榷淮南則蘄黄廬舒夀光六州官置吏總之謂之山場者十有三蘄州四黄州一舒州二廬州一夀州五六州採茶之民隷焉謂之園戸先受本錢而後入茶又有折税茶總為歳課八百六十五萬餘斤其江浙荆湖福建等州歳如山場輸租折税總歳課江南千二十七萬餘斤兩浙福建三十九萬三十餘斤皆轉輸要㑹之地為六榷貨務江陵漢真州六海州買蘄州蘄口商無為陽凡務受納茶以給人於景徳二年八月癸巳或請興元府置榷茶務上不許㑹要税租之數總二十二萬八千七百五十二斤山澤之入總四十八萬二千一百七十九斤租錢之數總二十二萬三千七百九十六貫本錢之數總四十四萬七千一百四十四貫榷易之利總八萬貫税錢之數銅錢四十五萬八千六百六十貫鐵錢六萬五千七百七十一貫咸平元年茶利錢一百四十萬貫為額景徳中歳課緡錢至三百六十餘萬祥符中歳收息五百餘萬緡沈括云六榷務十三山場鬻茶歳一千五十三萬三千七百四十七斤咸平元年茶利錢以一百三十九萬二千一百十九貫三百十九為額乾徳榷茶乾徳五年初榷江淮湖浙福建路茶蓋禁南商擅有中州之利故置場以買之自江以北皆為禁地興國中樊若水奏江南諸州茶官市十分之八其地分量税聴自賣踰江涉淮乗時射利望嚴禁之謂乾徳榷法也自若水建議其法始密凡茶之利一則官賣以實州縣一則沿邉入中糧草算請以省餽運一則榷務入納金銀錢帛筭請以贍京師而河東北互市川陜折博又以所有易所無而其大者最在邉備蓋祖宗以西北宿兵供億之費重困民力故以茶引走商賈而虚估加擡以利之其後理財之臣以遺利在民數務更張然大槩無過李諮林特二法大槩以折茶商及便邉民特以實錢算茶諮祖劉式之意使自就山園買茶而官場坐收貼納之利行之三年而罷景祐以後西邉事興始復行加擡法嘉祐四年一切弛禁自此茶不為民害者六七十載至蔡京始復榷法於是茶利自一錢以上皆歸京師矣真宗時胡則提舉二浙榷茶法紹興十二年十月丁亥詔福建專置提舉茶事官置司建州先是歳貢片茶二十餘萬斤建炎二年罷之以市舶官兼茶事紹興四年市五萬斤為大禮賞及是將鬻建茶於臨安始别置官淳化制置茶鹽使建隆二年正月戊午以解州刺史周訓兼兩池榷鹽制置使解鹽制置使始見此淳化三年十月丙子命雷有終為江淮兩浙制置茶鹽使張觀薛映副之上欲更立榷制初以趙昌言為使昌言力陳非便以有終代之至道元年七月癸亥以楊允恭為都大發運使改擘劃為制置茶鹽使咸平二年制置使王子輿言江淮浙收錢三百九十七萬餘貫比舊額増五十萬八千餘貫景徳三年二月癸巳馮亮制置茶鹽兼都大發運使康定元年五月十七日王滋為陜西河東制置青白鹽使慶厯二年以度支判官范宗傑為制置解鹽使始詔復京師榷法八年范祥制置解鹽一切通商嘉祐中即發運司置官專領運鹽事咸平江淮鹽法建隆二年五月丁丑以兩池鹽給徐宿鄆濟州乾徳三年正月減西川鹽價四年十月寛犯鹽之罪開寳三年四月庚子除河北鹽禁收其征四年四月己巳詔榷嶺南鹽七年七月減成都鹽價興國三年二月甲子罷昌州鹽井虚額雍熙元年五月除江南鹽禁二年六月戊子尋復之端拱元年七月除蜀鹽禁至道二年十一月楊允恭言淮南十八州軍其九禁鹽餘不禁商人由海上販鹽官倍數而取之至禁鹽地則上下其價今請悉禁遣吏主之詔知制誥張秉與鹽鐵使陳恕等㑹議恕等言不可允恭力請詔從之是歳收利巨萬咸平元年十月十八日以允恭建議江淮鹽法擢康州刺史釋恕不問慶厯六年五月十一日戊子減卭州鹽井歳課十一月詔罷河北榷鹽嘉祐三年冬十月癸亥除河北陪納鹽錢河北滄濵二州鹽務歳課九千餘石以給一路自開寳以來聴商人貿易官收其算歳為額錢十五萬緡十景徳中諸路鹽課三百五十五萬緡慶厯五年七百五萬緡嘉祐二年十月三司言商旅於榷貨務入錢算東南鹽歳課四百萬緡乙亥以朱處仁為江淮荆湖制置司幹當運鹽治平中李復圭等請減淮南鹽價然不果行元祐元年正月二十八日詔河北鹽復用舊法通商紹聖四年復榷太祖放河北鹽稅太宗通金商鹽真宗㢮儀渭榷法國朝鹽池二監七場二十二井八百二十二鹽四種一曰末鹽海鹽也其次顆鹽解州鹽澤及晉絳潞澤所出又次井鹽鑿井取之又次崖鹽生土崖之間淮南鹽置倉以受之通楚州各一泰州三又置轉般倉二一於真州以受五倉鹽一於漣水軍以受海州漣水鹽江南荆湖歳漕米至淮南受鹽以歸祥符瑞鹽祥符三年八月辛未解州言東池水自成鹽潔白晶瑩九月辛巳賜近臣及二館秘閣解州瑞鹽時兩池自生凡數十里陳堯叟等繼獻凡四千七百斤知制誥錢惟演直史館盛度集賢校理宋綬咸奏賦紀其事四年二月丙寅又出解池自生鹽賜近臣及列校崇寧四年六月十一日以興復解池鹽寳百官表賀政和元年八月生紅鹽祥符茶法祥符二年五月乙亥二十一日鹽鐵副使林特昭宣使劉承珪江淮制置發運使李溥等編茶法條貫上之歳益課百餘萬序曰山澤之饒茶茗居最頃備邉費許折緡錢以入芻米給茗便商助軍國之用歳乆弊多公私俱耗臣等訪利病閲詔條㕘酌逺猷别議新式歳序再周課程増羨其所定制勅條貫共二百九十九道内二百道出於權制非可乆行今止列事宜不復備録其法程及課利總數共成三十三冊一云二十三䇿宜為永制八年閏六月庚寅上謂輔臣曰有言茶法不便於小商丁謂曰未改法日歳虧茶本錢九千餘貫改法後歳入常二百餘萬貫邉防有儲蓄榷場無陳積㑹要茶利舊收七十三萬八百五十貫自特改法收七百九萬二千九百六十貫七十月九日李溥言十二山場比元額増五百十二萬八千餘斤九年二月庚辰上謂輔臣曰榷務去年茶引錢一百五十萬緡比新額僅虧十萬緡丁謂曰比來改法利且倍矣辛巳三司上歳校茶利數上問輔臣王旦對元和國計圖税茶歳不過四十萬緡今若守改定之法則歳利三百萬貫不失矣天禧二年十月二十八日又詔諫議孫奭與三司同定茶法務從寛簡三年合六榷務十三山場所收十二萬緡時言者愈多不過欲惠小商優市户朝廷亦嘗優其直饒其給祥符元年六月壬子罷諸路貢茶先是貢茶者三十餘州祥符議茶鹽制度九年十月二十六日丁酉詔曰山澤之禁慮傷厚斂令翰學李迪中丞凌䇿十二月十一日改命侍御史吕夷簡與三司同議茶鹽制度俾園亭戸無失所商旅便興販百姓供用不匱入中算射一依往例國家茶鹽之利兼唐數倍天聖詳定鹽法咸平四年十一月直史館孫冕言江湖通商放鹽為公私之利有十而議事之徒疑沮者有三詔吏侍陳恕等議己卯恕言江湖禁絶私商葢由近煮海之地息犯禁之人近者陜西鹽法亦令納秸資邉但有虚名異時豐羨可用其所畫未可施於令議遂寢六年正月十二日度支使梁鼎言解鹽通商減價以利民也而邉民販青鹽犯條禁請官自鬻鹽詔輔臣議陳堯叟言禁鹽利博吕蒙正等言可助邊費乃以鼎為陜西制置使閤門祇候杜承睿同制置青白鹽既而議者言其煩費請復通商乃命太常博士林特與永興守臣張詠議復舊通商五月鼎以前議非當罷使職景徳元年九月陜西以鹽錢均於部民三年五月五日度支副使李士衡言永興尤多於民不便請減十分之四詔悉除之祥符四年十月十八日以江淮鹽酒價不等命三司與發運使李溥規定有司言慮失嵗課帝曰茍便於民何顧嵗入九年四月陜西漕臣言安邑解縣兩池貯鹽三億八千八百八十萬八千九百二十八斤計直二千一百七十六萬一千八十貫慮有遺利請行條約帝曰地財之阜至矣過求増羨不可許也天聖初置司議茶鹽利害見上因言解鹽兩池舊募商人入錢在京榷務乾興初歳入纔二十三萬緡視天禧損十四萬請罷之令入中並邉芻粟乆之復令入錢于京從啇人所便而民困轉輸至是上書者言禁鹽利㣲而害博請聴通商八年八月丙戌命學士盛度中丞王隨詳定鹽法利害度等上通商五利十月丙申十六日詔除解鹽禁行通商法聴商旅入錢若金銀在京榷務受鹽兩池人便之九年十一月十八日度言在京鹽院請權罷輦運明道元年十二月二十三日命三司李諮與學士度隨同議通商之法二年八月十九日度請自正月後另起條貫改更新例報詳定所景祐元年二月壬辰朔以解州鹽池貯鹽可支十年權停種鹽二年十三日度言奉詔與參政隨及三司官詳定解鹽三年收種鹽二百七十五萬八千六百餘斤始立法於一年復考績於三載仰遵聖制已集成規請以鹽法宣付史館詔可丁未隨度各與一子官寳元二年六月十四日乙亥右司諫韓琦請以新舊二法取其利博者以為經乆之制詔學士宋庠知制誥王堯臣與三司議庠等言新法視舊法歳課損三百六十萬緡慶厯四年二月乙未命知汝州范祥使陜西與漕臣程戡議解鹽法八年十月除陜西鹽禁以范祥為陜西提刑兼制置解鹽使推行其法舊禁鹽地一切通商鹽入蜀者亦縦不問仍罷並邉入中芻粟令入實錢以鹽償之所入緡錢以市芻粟弛輦運之役峻青鹽之禁公私便之先是慶厯二年范宗傑建禁榷之議官自輦運民力頗困故祥建言通商歳課緡錢一百六十萬以計置沿邉九州軍一百二十餘城寨芻粟可助十分之八罷在京見錢文引法皇祐元年十月壬戌命户部副使包拯與陜西漕臣議鹽法李徽之言通啇不便命兩制與祥徽之議率以祥為是拯至陜西力主祥議三年十月二日詔解鹽聴通商二年較其増損以聞後拯權三司使言范祥建議通陜西鹽法行之十年歳減榷貨務緡錢數百萬其勞可録九設制置解鹽司置九折博務議熙寧二年七月二十日翰學司馬光及吕公著監鹽法時張靖薛向論陜西鹽熙寧中江西提刑蔡挺兼提領鹽事三年十一月二十二日詔陜西漕司以西川四路物帛變見錢二十萬緡充制置解鹽司鈔場本錢四年正月行交子罷永興軍鈔場三月十四日復舊六月二十四日命淮浙江湖諸路提刑趙濟等並兼提舉本路鹽事十年四月二十三日三司言兩池鹽歳入以二百三十萬緡為額自明年始八月制置解鹽使皮公弼請復范祥舊法平凖市價二十五日詔三司借錢三十萬緡於京師置場買賣鹽鈔元豐元年六月二十九日命福建轉運使蹇周輔兼提舉本路鹽事二年二月十七日令解池歳以二百四十二萬緡為額先是嘉祐中解鹽鈔定一百六十六萬三千四百緡為歳額元祐元年十月六日户部請以二百萬緡為額建炎元年五月十八日詔發運使梁楊祖兼提領茶鹽事工部貟外郎楊淵同提領乾道六年三月一日詔定三榷務都茶場茶鹽歳額行在八百萬緡建康一千二百萬緡鎮江四百萬緡天聖茶法景祐茶法乾徳五年始禁私鬻茶興國二年刪定禁法淳化三年七月行貼射法四年初行交引罷貼射是歳罷榷務尋復至道元年鹽鐵使陳恕為三説法自西北始入芻粟度逺近増其虚估給劵以茶償之又益以東南緡錢香藥象齒謂之三説咸平五年三司使王嗣宗始立三分法六年改四分景徳二年許人入中錢帛金銀謂之三説祥符九年茶引益輕乾興元年改三分法茶引三分東南見錢二分半香藥四分半云天聖元年正月丁亥詔曰三路軍儲出山澤之利比移用不足命三司使李諮侍御史王臻中丞劉子儀較茶鹽礬課歳入登耗更定其法三司置計置司二月庚申命樞副張士遜參政吕夷簡魯宗道摠之紀云議茶鹽法三月辛卯諮等考茶法利害請罷三説行江淮十三山場貼射之法論者言其未便三年八月二十二日命孫奭夏竦再詳定九月四日命三司使范雍同定十一月庚辰從奭等議復行三説法香茶緡錢詔三司罷貼射景祐元年九月二十一日樞副李諮請依天聖初改定三年正月九日命諮及參政蔡齊三司使程琳中丞杜衍知制誥丁度更議茶法三月十四日復令商賈以見錢算請五年正月二十九日丙寅命王博文張觀等與三司以新舊茶法定酌中之制六月三司副使司馬池侍御史程戡司諫韓琦各上茶法利害七月丁酉損京師入錢河北入中之直康定元年十二月詔三司以見行茶法裁定慶厯八年十二月増以南鹽為四説河北並邉入中芻粟改行四説法内地以康定詔書從事自是三説四説之法並行於河北皇祐二年正月行入中對貼法用見緡仁宗朝茶利歳得九十餘萬緡或云嘉祐初行通商法歳入不過八千餘萬嘉祐弛茶禁嘉祐三年九月始命韓絳陳升之吕景初即三司置局議㢮茶禁先是著佐何鬲請通商收浄利以疏利源寛民力故命絳等議其十月三司言宜約至和之後一歳之數以息錢均賦茶民恣其買賣所在收算詔遣王靖等分行六路詢察利害及還皆言如三司議便己巳詔曰古者山澤之利與民共之自唐建中始有茶禁上下規利垂二百年如聞比來為患益甚民被誅求之困官受濫惡之入私藏盗販犯者實繁嚴刑重誅情所不忍是於江湖之間幅員數千里為䧟穽以害吾民也朕心惻然念此乆矣間遣使往就問之驩然皆願弛其禁歳入之課以時上官一二近臣條析其狀朕猶若慊然又於歳輸裁減其課使得饒阜以相為生剗去禁條俾通商利歴世之弊一旦以除著為常經弗復更制損上益下以休吾民尚慮喜於立異之人縁而為姦之黨妄陳議奏以惑有司必寘明刑無或有貸一本云四年二月己巳詔開江淮茶禁聴民自賣通商收税罷十三山場六榷務歳輸不過三十三萬有竒謂之茶租錢以歳課均賦於茶户有初慶厯三年六月甲辰詔曰議者多言茶鹽銀銅之遺利朕懼開掊克之政抑而弗宣為按長編初所遣官議弛禁比三司歳課均賦茶户凡緡六十八萬有竒比輸茶時其出幾倍朝廷損其半歳輸緡錢三十三萬八千有竒謂之租錢儲以待邉糴唯臘荼禁如舊餘肆行天下矣崇寧以後歳入至二百萬緡視嘉祐五倍矣政和元年正月始剏引法置都茶場歳收四百餘萬緡中興循其法紹興末東南十路六十州二百四十二縣歳産茶一千五百九十餘萬斤收鈔錢二百七十餘萬紹興二十五年九月十七日辛亥宰臣奏三都茶場收鈔錢二百七十餘萬淳熙初收四百二十萬政和以來不置場不定價茶商買引就園户交易依引内之數赴合同場秤發至今不易公私便之元豐鹽額解鹽為池二解安邑元豐三年以二百四十二萬貫以為額江東路一百二萬五千九百貫江西路百二十二萬三千二百貫淮南一百十六萬六千四十貫湖南七十八萬九百貫湖北七十七萬四千二百貫兩浙八十七萬一千八百貫福建二十萬二千五百貫河東永利東西監十一萬四千四百十八貫咸平四年二月己巳改河東榷鹽院為永利監成都路為井四十二收二百四十八萬九千三百六十二斤利州路為井一百二十七梓州路為井四百二十五䕫州路為監三為井十四鹽税京東十八萬八千六百貫京西七萬五千二百六十一貫河北兩路三十六萬七千貫元豐四年三月蹇周輔上江西廣東鹽法總目十二月九日三司使李承之奏東南鹽法詔與編修官董唐臣自二年八月終敕札奏請已行者修成一百八十一條分為勅令格共四卷以江淮湖浙路鹽敕令賞格為名鏤板頒行五年二月八日上編修鹽法六年六月十五日詔以京東鹽法推之河北七年七月盡榷河東鹽九月十二日修湖南廣東西鹽法條約總目上之紹興茶鹽法紹興二十一年七月二十八日一云八月四日宰臣上鹽法敕令格式并目録續降指揮共一百五十五卷茶法敕令格式并目録續降指揮共一百四卷詔以紹興編類茶鹽法為名以元豐法并續降㫖八千七百三十條并見行法看詳編類茶鹽二書共二百六十卷冊先是八年七月七日陳康伯請編成一書大觀四年閏八月十二日修東南鹽法百三十條沈立撰茶法易覽述茶之利害著為令又著鹽筴總類又論東南鹽利害條亭户倉塲漕運之弊謂愛恤亭户使不至困休息漕卒使有以為生防制倉場使不為掊克率斂絶私販減官估能行此五者嵗可増緡錢一二百萬集鹽筴二十卷以奏言亭户之困尤甚紹興鹽額紹興三十二年鹽額浙西路秀州有鹽場十平江四臨安十浙東路紹興府有場四明州有場六台州三温州五淮東路通州六泰州十一楚州三廣東路廣州九潮州三惠州三南恩州二廣西路廉州一高州二欽雷各二化州二福建路福州有倉二興化有倉一紹興末年東南歳産鹽二萬七千八百十六萬斤歳收錢二千一百萬餘緡紹興中胡安國上恤民論曰祖宗時鹽法行於西者與商賈共其利行於北者與編户共其利行於東南者與漕司共其利所謂以義為利也淳熙解鹽圖淳熙六年七月二十八日右司員外郎周舜元上解鹽圖一冊付史館書目髙聿鹽池録一卷宣和六年攷解池事迹寫山川溝渠器用等為圖各立説繫下方國史志鹽之類有二引池而化者周官所謂盬鹽也或煮海煮井煮鹻而成者周官所謂散鹽也引池為鹽曰解州解安邑兩池墾地為畦引池沃之水耗鹽成籍民給役謂之畦户總三百八十戸復其家户歳岀夫二謂之畦夫歳二月墾畦四月引水八月而止歳為鹽百五十二萬六千四百二十九石石五十斤青白鹽出烏白兩池西羌擅以為利淳化中陜西轉運鄭文寳議禁毋入塞煮海為鹽曰京東河北淮南兩浙福建廣南凡六路地曰亭場民曰亭户竈户户有鹽丁煮井為鹽曰成都梓利䕫四路大為監小為井監則置官井則募民煮鹻為鹽曰河東永利東西監東隷并西隷汾州籍民為鐺户河北陜西亦有煮鹻者然其利薄東南鹽利視天下為最厚水經注鹽井一百所巴川資以自給粒大者方寸中央隆起形如張傘因名傘子鹽有不成者形亦必方王隠晉書地道記曰入湯口四十三里有石煑以為鹽水竭鹽成郭義恭廣志曰甘水有石鹽武都有平田百頃煑土成鹽政和中有司言解鹽便於煮海為罷東北鹽而利入頓虧八年閏月丙寅復行末鹽遂改袋製且許所過損其税必更買新鈔方帶給舊鈔號對帶法宣和二年始歳給陜西錢四百萬緡以代解鹽課上自督課茶鹽日令具奏三年河北亦行鈔法紹興二年六月癸丑李健提舉江西茶鹽初復提舉官聖人斂山澤之貨以寛田疇之賦收關市之税以助什一之儲魏邢巒云夀昌習分銖之事弘羊析秋毫之數小人為能君子不忍為也唐李徳𥙿云弘僅建􅎂趾之刑桑羊畫安邉之䇿衛覬張林踵陳其計此煮海之利也張滂倡於貞元王涯議於太和趙贊鄭注並沿其術此摘山之税也自齊人賦鹽漢武榷酒唐徳宗税茶民之日用飲食而皆無遺算言礬課則劉熈古深茶禁則樊若水峻酒榷則程能變鹽令則楊允恭山海之入征榷之算古禁之尚疏者皆密焉夏禹青州之貢穆王安邑之觀漢煮海以稱饒唐置官而兼領周詩記苦荼茗飲出近世春秋書齊荼漢志書荼陵陸顔諸人雖已轉入茶音而未易字文也自陸羽茶經志三卷盧仝茶歌趙贊茶禁以後遂易荼為茶爾雅注早采者為荼晚取者為茗一名荈釋文曰埤蒼作􅟒塌地剰茶之名三説貼射之法招啇收税之令紛紛見于史冊杜育有荈賦温庭均有採茶録志一卷毋景著茶飲序唐李珏曰價髙則市者稀價賤則市者廣未見阜財徒云斂怨中世徙場而榷茗諸藩塌地以名錢玉海卷一百八十一
