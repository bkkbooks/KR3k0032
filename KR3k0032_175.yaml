body:
  text: 玉海卷一百七十五宋王應麟撰宮室亭釋名亭停也人所停集堯亭王韶之始興記堯山下有平陵陵上有古大堂基十餘處謂曰堯故亭父老相傳堯南廵登此山故亭即其行宮湯亭左傳商湯有景亳之命注河南鞏縣西南有湯亭或言亳即偃師續漢志注同水經注尸鄉故湯所都亦曰湯亭風俗通國語有寓望謂今亭也召亭詩召南釋文召地名也在岐山之陽扶風雍縣南有召亭召南十四篇正義春秋時周公召公别於東都受采存本周召之名晉書地道記云河東郡垣縣有召亭周則未聞今為召州是也左傳注召采地扶風雍縣東南有召亭水經注雍水又東逕邵亭南亭故邵公之采邑也京相墦曰亭在周城南五十里後漢郡國志郿縣有邵亭漢泗水亭後郡國志沛有泗水亭沛國秦泗水郡注亭有髙祖碑班固為文見固集髙祖為泗上亭長豐有枌榆亭注案前志注枌榆社在縣東北十五里戴延之西征記縣西北有漢祖廟為亭長所處高紀師古注引泗水亭碑班固作碑銘并十八侯銘秦法十里一亭十亭一鄉國語有寓望即今之亭也括地志泗水亭在徐州沛縣東一百歩有髙祖廟文選注酈善長水經注曰泗水南有泗水亭漢高祖廟前有碑延熹十年立漢萬歳亭見萬歳宮三齊畧記曲城齊城東有萬歳水水北有萬歳亭李固傳夏門亭長注洛陽北面西頭門外有萬壽亭漢千秋亭見即位壇漢雒陽亭見先虞壇漢官典職洛陽二十四街街一亭十二城門門一亭漢洛陽都亭又見邸驛類張綱傳漢安元年選遣八使徇行風俗皆耆儒知名多厯顯位唯綱年少官次最微餘人受命之部而綱獨埋其車輪於洛陽都亭曰豺狼當路安問狐貍漢洛陽宣徳亭五行志陽嘉二年六月雒陽宣徳亭地拆李固對䇿云云周禮司市注思次若今市亭也介次市亭之屬别小者也遺人注宿可止宿若今亭有室䟽案漢法十里有亭蜡氏注有地之官有部界之吏今時鄉亭是也晉新亭王導傳過江人士暇日出新亭飲宴丹陽記新亭吳舊亭也隆安中丹陽尹司馬恢移創今地京師三亭太元中謝石創征虜亭三吳搢紳創冶亭宋孝武即位于新亭元嘉末四月壬申改為中興亭陳大建七年閠九月丁未幸樂游苑采甘露宴羣臣於苑龍舟山立甘露亭晉蘭亭書目蘭亭詩一卷晉永和九年上已右將軍王羲之㑹羣賢于㑹稽山陰之蘭亭一十一人詩各二篇一十五人詩各一篇羲之為序孫綽為後序水經注湖口有亭號曰蘭亭亦曰蘭上里梁北顧亭見樓類唐九曲亭臨渭亭舊紀景龍三年九月壬戌幸九曲亭宴侍臣學士四年三月甲寅幸臨渭亭修褉飲唐含象亭又見開元十八學士圖翰林盛事開元中拜張說等十八人為學士於東都上陽宮含象亭圖寫御贊述之翰林志開元中張說等十七人寫真含象亭御製贊唐鴻臚亭會要天寳三載三月敇兩省五品以下於鴻臚亭祖餞朝集使永泰元年正月宰臣王縉等奏大臣入朝百僚朝罷於中書行相見之禮宴餞凖故事集於鴻臚亭從之安禄山傳天寳三載詔三省御史中丞餞鴻臚亭唐振旅亭舊紀天寳八載五月辛巳㑹要十八日於開逺門外作振旅亭以待兵迴唐沉香子亭李白傳元宗坐沉香子亭使白為樂章李漢傳敬宗時為左拾遺長慶四年九月丁未舶賈獻沉香亭材帝受之漢諫曰以沉香為亭何異瑶臺瓊室乎栁公權傳為翰林書詔學士文宗夜召對子亭燭窮而語未盡宮人以蠟液濡紙繼之唐望春亭公主傳嘉誠莊懿公主貞元元年下嫁徳宗幸望春亭臨餞長安志南北望春亭在禁苑東南高原之上唐㑹慶亭會要貞元三年三月造㑹慶亭于麟徳殿舊紀云於十三年三月戊子造十二年十二月度支郎中蘇弁奉敇改造三殿前㑹慶亭實録元和十四年九月戊戌御㑹慶亭宴田弘正及宰相以下賜物有差唐曲江亭會要兼舊紀實錄貞元四年九月癸丑重陽節賜百僚宴曲江亭帝賦詩六韻賜之六年二月戊辰朔百官以中和節宴曲江亭上賦詩七韻錫之八年二月庚戌朔宰相宴於曲江亭十四年三月上已賜羣臣宴曲江亭十七年二月癸巳朔賜羣臣宴曲江亭上賦中和節賜宴曲江詩六韻賜之三月乙丑賜羣臣宴曲江亭九月戊辰羣臣宴曲江上賦九日賜宴曲江亭詩六韻賜之元和二年三月辛卯賜羣臣宴曲江亭長慶二年九月戊申宴百僚曲江亭太和八年三月甲寅上已賜羣臣宴曲江亭開成二年十月慶成節賜百官宴曲江亭唐太液亭實録太和四年七月文宗於太液亭召翰林學士鄭覃已下對賜錦綵又見尚書圖崔鉉傳為淮南節度使帝餞太液亭賜詩寵之大中九年八月元稹詩網索西臨太液池注網索在太液上學士候對於此唐彩霞亭見紫雲樓祥符靈液亭延慶亭宣澤亭祥符元年六月庚寅朔泰山建醴泉亭名曰靈液十月壬子幸十二月庚子丁謂為碑二年八月庚戌泰山再出醴泉建亭曰瑞濟三年十月庚戌名寳鼎縣行宮後亭曰延慶四年二月戊午召近臣登之南望仙掌北瞰龍門二十六日丙戌次華州頓賜酺宴于行宮南垣之望仙亭賜亭名曰宣澤祥符瑞雲亭又見祥瑞類元年六月乙未天書再降于泰山之靈液亭十月己酉五色雲起嶽頂上與近臣登後亭望之名亭曰瑞雲祥符翠芳亭九年二月二十七日詔近臣觀書後苑移幸流杯殿登象瀛山翠芳亭天禧四年十月二十九日玉宸殿翠芳亭觀稻賜燕景佑中橙實命近臣觀皇祐三年九月辛未講讀以翠芳亭橙實賜講筵官各一枚又有瑶津亭華景亭皆在後苑淳熈羣玉亭袐省有芝香亭淳熈四年二月更名羣玉中書舍人范成大書嘉定元年三月少監汪逵改建易名曰堂國史志西京内園有長春殿淑景亭歴代亭名後漢萬壽後魏五石隋飛花散菊迎風落花囘廊圓珠方玉積翠飛香囘流芝田蘭皋露華長塘芳洲翠阜芳林飛華留春澂秋洛浦翠葩逍遥翠微閬風彩霞臨月飛芳合璧含暉凝碧紫巖澄景尚陽唐㑹慶放鴨彩霞沈香坡頭臨渭永泰南北昌國琉璃曜掌九洲芳樹金谷六朝征虜勞勞觀稼閬風甘露醴泉臨芳清露臨淵景風齋燕居之室曰齋晉讀書齋王孚安成記太和中陳郡殷府君引水入城穿池殷仲堪又於池北立小屋讀書百姓呼曰讀書齋梁髙齋襄沔記金城内刺吏院有髙齋梁昭明太子於此齋造文選簡文為晉安王鎮襄陽日引劉孝威等於此齋綜覈詩集凡十人資給豐厚時號髙齋學士南史庾肩吾傳在雍州劉孝威等十人抄撰衆籍豐其果饌號為髙齋學士紹興損齋見前淳熈善樂齋八年皇孫英國公自以善樂名齋親書扁歴代齋名隋文猷文徴珠露流風回雪含涼唐山齋六朝髙齋梁宅說文宅所託居之義釋名宅擇也㨂擇吉處而營之堯表門閭六韜文韜盈虛篇帝堯王天下民有孝慈者愛敬之盡力農桑者慰勉之旌别淑徳表其門閭書畢命旌别淑慝表厥宅里彰善癉惡樹之風聲吕氏春秋魏文侯過叚干木之閭而軾之舜宅戴延之西征記蒲坂城外有舜宅宋永初山川記蒲坂城中有舜廟城外有舜宅及二妃壇夫子宅水經注夫子故宅大一頃所居之堂後世以為廟漢髙祖十三年過魯以太牢祀孔子廟屋三間夫子牀前有石硯一枚甚朴云平生時物魯人藏孔子所乗車於廟中是顔路所請者也魏黄初二年令郡國修起孔子舊廟置百户吏卒廟有夫子像列二弟子執卷立侍漢魏以來廟列七碑二碑無字齊晏子宅晏子春秋齊晏公使更晏子之宅曰子之宅近市湫隘嚻塵不可居請更宅曰臣之先臣居此宅焉臣不足以代之將更於豫章之圖括地志晏子故宅後人名曰清節里齊威王養士稷門之下自淳于髠以下七十餘人髙者為列大夫為開第康莊之衢髙門大屋尊寵之漢髙祖宅述征記豐水西九十里有漢髙祖宅漢舊儀髙皇帝家在豐中陽里為沛泗上亭長及為天子立沛廟祠豐故宅漢北第東第甲第高紀五年五月詔曰法以有功勞行田宅云云十二年三月詔為列侯食邑者賜大第室吏二千石受小第室注孟康曰有甲乙次第故曰第列傳夏侯嬰惠帝徳之賜北第第一注近北闕之地西京賦北闕甲第當道直啟司馬相如檄位為通侯居列東第注師古曰東第甲宅也居帝城之東故曰東第霍去病武帝為治第令視之蘇武始元六年賜宅一區韋賢地節三年以老病乞骸骨賜金百斤加賜第一區元成詩曰既耉致位惟懿惟奐厥賜祁祁百金洎館胡建射甲舍門注師古曰甲舍即甲第公主之宅霍光宣帝賜甲第一區張放賜甲第欒大賜列侯甲第景况建武五年賜甲第郭伋為太中大夫建武二十二年賜宅一區及帷帳鮑永賜洛陽商里宅辭不受洛陽記上商里在洛陽東北本殷人所居劉昆賜洛陽第舍第五倫元和二年賜宅一區魏文為張遼起第舍晉賜王祥鄭冲賀循第一區漢尚冠里舍宣紀時㑹朝請舍長安尚冠里元平元年秋七月遣宗正徳至曾孫尚冠里舍洗沐賜御府衣太僕以軨獵車奉迎曾孫就齋宗正府注師古曰尚冠長安中里名黃圖長安閭里百六十有宣明建陽昌隂尚冠修成黄棘北煥南平大昌戚里漢幸孔子宅唐幸孔子宅顯宗紀永平十五年三月幸孔子宅祠仲尼及七十二弟子親御講堂命皇太子諸生說經注孔子宅在兗州曲阜縣闕里中背洙面泗矍相圃之東北也初魯恭王壊孔子舊宅以廣宮室聞金石絲竹之聲乃不敢壊於壁中得古文經傳唐玄宗紀開元十三年十一月甲申通鑑庚申舊紀丙申幸孔子宅遣使以太牢祭其墓給復近墓五户詔曰思闕里之風想雩壇之詠括地志孔子舊宅在兖州曲阜西南三里有闕里中有宅宅中有廟漢南陽舊宅祠舊宅紀光武建武三年冬十月壬申幸舂陵祠園廟因置酒舊宅大㑹故人父老東觀記光武征秦豐幸舊宅十七年十月甲申幸章陵建武中更名舂陵為章陵修園廟祠舊宅觀田廬置酒作樂賞賜宗室諸母因酣恱相與語曰文叔少時謙信與人不欵曲惟直柔耳今乃能如此帝聞之大笑曰吾理天下亦欲以柔道行之乃悉為舂陵宮室起祠堂注光武舊宅在今隨州棗陽縣東南宅二里有白水焉即張衡所謂龍飛白水也荆州記義陽安昌有光武宅枕白水明帝永平三年冬十月甲子從皇太后幸章陵觀舊廬隂后紀永平三年冬帝從太后幸章陵置酒舊宅㑹隂鄧故人諸家子孫並受賞賜十年閏四月南廵狩幸南陽日北至又祠舊宅禮畢饗校宮弟子作雅樂奏鹿鳴帝自御塤篪和之以娛嘉賔章帝元和元年九月辛丑幸章陵祠舊宅八年八月南廵狩祠舊宅園廟見宗室故人和帝永元十五年十月戊申幸章陵祠舊宅㑹宗室于舊廬勞賜作樂桓帝延熹七年十月庚申幸章陵祠舊宅遂有事于園廟南都賦曜朱光於白水㑹九世而飛榮察兹都之神偉啟天心而寤靈園廬舊宅崇隆崔嵬御房穆以華麗連閣煥其相徽聖皇之所逍遥靈祗之所保綏章靈鬰以青䓤神廟肅以微微頌曰皇祖止焉光武起焉據彼河洛統四海焉本支百世位天子焉永世克孝懷桑梓焉真人南巡覩舊里焉南都在南陽光武舊里以置都焉成帝時議欲廢之故張衡作是賦以諷漢精舍列傳包咸於東海立精舍講授劉淑立精舍講授諸生常數百人檀敷立精舍教授數百人李充立精舍講授漢諸葛亮宅文選出師表三顧臣於草廬之中注漢晉春秋曰亮家于南陽之鄧縣荆州圖副曰鄧城舊縣西南一里隔沔有諸葛亮宅是漢昭烈三顧處水經沔水東逕隆中注歴孔明舊宅北劉季和鎮襄陽命李安作宅銘云天子命我于沔之陽聽鼔鞞而永思庶先哲之遺光後六十餘年永平五年習鑿齒又為宅銘荆州記襄陽西北十許里名為隆中有孔明宅郡國志長沙南寺賈誼宅國史志果州相如縣有司馬相如故宅成都記成都縣百歩有揚雄宅今草玄亭餘迹尚存抱朴子葛廬佐光武有大功受爵立宅舍於博望里魏志衞臻遜位賜宅一區荀彧家傳既定冀州為公起大第於鄴魏奏事爵雖列侯食邑不滿萬户不得作第其舍在里中皆不稱宅唐賜甲第列傳河間王孝恭平公祏賜甲第一區謂人曰所居頗壯麗非吾心也裴寂髙祖賜田千頃甲第一區魏徴太宗輟小殿之材為建第馬周求勝地為創第市宅詔有司給直狄仁傑武后賜第一區杜暹開元十四年賜甲第一區廄馬一匹姚崇玄宗欲自近詔徙寓四方館郭子儀宅居親仁里四分之一中通永巷賜良田美器名園甲館李泌代宗賜光福里第孔述睿為諫議徳宗賜第宅李晟殄大盗詔賜第永崇里涇陽上田延平門之林園晟入第京兆供帳教坊鼔吹迎導詔將相送之渾瑊賜大寧里甲第將相送歸第張茂昭貞元二十年十月賜甲第李光顔賜開化里第孔緯賜善和里第符璘賜靖恭里第一區藍田田四十頃郭鏦尚徳陽郡主詔為主營第長興里房玄齡傳帝幸芙蓉園觀風俗玄齡敕子弟汛掃廷唐曰乗輿且臨幸果幸其第因載還宮崔鄲傳居光徳里建便齋宣宗題曰徳星堂唐祠舊宅高宗紀顯慶五年二月甲午祠舊宅麟徳元年八月己卯幸舊第一本云丁丑幸舊第宴羣臣舊紀髙宗龍朔元年天宮寺是髙祖濳龍時舊宅九月甲辰上周歴殿宇感愴久之睿宗景雲二年八月一云七月乙卯詔以興聖寺是髙祖舊宅有枯杮復生赦天下地理志京兆府髙陵西四十里有龍躍宮本髙祖舊宅髙祖置為宮武功南十八里臨渭水有慶善宮武徳元年髙祖以舊第置宮會要太宗貞觀六年蘇世長奏曰臣昔在武功見陛下宅宇纔蔽風雨初學記太宗嘗過舊宅賦詩曰新豐停翠輦譙邑駐嗚笳一朝辭此去四海遂成家唐隠士宅田游巖傳髙宗營奉天宮游巖舊宅直宮左詔不聽毁天子自書牓其門曰隠士田游巖宅通鑑永隆元年二月戊午幸嵩山處士田游巖所居太宗貞觀十二年幸洛陽髙年甄權宅權年一百三嵗拜朝散大夫賜几杖唐五王子宅十王宅寧王憲傳初睿宗五子列第東都積善坊號五王子宅及賜第上都隆慶坊亦號五王子宅先天後盡以隆慶舊邸為興慶宮開元後皇子㓜多居禁中既長詔附苑城為大宮分院而處號十王宅在安國寺東所謂慶忠棣鄂榮光儀頴永壽延盛濟等以十舉全數也十三年三月甲午封十三王㑹要十王謂慶忠棣鄂榮光儀穎永濟宅後盛壽陳豐常凉六王又就封入内宅是為十六杜悰傳宣宗世䕫王以下五王處大明宮内院而鄆王居十六宅舊書先天後興慶是龍濳舊邸因以為宮寧申岐薛王賜宅邸第相望環於宮側諸王每日於側門朝見通鑑上即位附苑城為十王宅以居皇子宦官押之就夾城參起居自是不復出閤雖開府置官屬及領蕃鎮惟侍讀時入授書官屬但歳時通名起居宣宗大中二年上欲作五王院於大明宮以處王子之㓜者會要諸王府在宣平坊東南寳厯三年六月賜延康坊宅俾諸府合而共局庶寮㑹而異處世祖推恩長安列六子之舍明皇廣愛華清建百孫之居張垍尚主即禁中置内宅岐陽公主下嫁杜悰開第昌化里建隆濳龍宅建隆元年二月宋州以歸徳軍旌節來詔置於濳龍宅建隆賜宅建隆二年三月乙巳賜樞副趙普宅一區開寳中詔有司建第將以賜郭進悉用銅瓦興國三年正月宅成賜之建隆三年慕容延釗石守信賜宅開寳三年王審琦賜甲第留京師興國四年正月癸巳賜簽樞石熈載宅一區五年三月庚辰賜文明殿學士程羽浚儀縣泰寧坊宅一區八年十二月庚戌賜參政呂䝉正麗景門宅簽樞張齊賢宜秋門宅咸平五年九月种放至乙卯賜昭慶坊第一區加帷帳什物銀器五百兩錢三十萬中謝日賜食學士院祥符元年十一月賜樞使陳堯叟宅五年閏十月賜王欽若安逺坊宅皇祐五年二月賜狄青崇教坊宅治平四年九月賜韓琦宅紹興十五年賜秦檜第命駕親臨二十一年張浚太師制曰比敕乘輿徃臨居第因觀風而幸事擬元齡思避講之談禮加朱祐淳熈中少傅侍讀史浩賜第開寳禮賢宅開寳九年三月丁巳詔於朱雀門外馳道之左建大第甲於輦下既成名曰禮賢宅以待錢俶己未俶入朝即令居焉三月二十日幸三十日又幸九月二十七日再幸興國五年四月丙子賜之祥符八年四月錢惟演上表納所居宅以處諸王五月癸巳賜惟演第于昭化坊逆予有刑視彼揚州順予有封視此錢侯祥符二年十二月癸卯令江州修唐白居易舊第以廬山有居易書堂江州有舊宅畫像猶存故命葺之景祐睦親宅慶厯廣親宅元祐親賢宅元符懿親宅宣和蕃衍宅見宗戚類元符二年四月八日崇寧元年三月十七日幸懿親宅宣和元年三月七日幸蕃衍宅祥符八年七月庚戌諸王各賜第于外分置諸宫都監之職熈寧賜芳林園宅四年九月二日詔賜濮王子通州防禦使宗隠芳林園宅一區六年十月二十五日賜彰武留後承選芳林園宅紹興睦親宅三年十二月甲辰詔南班宗室新第仍以睦新宅為名魯語車服表之章也宅章之次也注有章服者之次舍韓詩外傳諸侯有徳錫朱户文選注諸侯朱户故曰朱邸狼望未平冠軍辭宅馬池猶隔雍丘遜邸晏嬰湫溢齊景營其爽塏孫歴無家晉武為之築館齊招賢士宅於康莊之衢漢寵列侯賜之甲乙之第漢錫五倫魏寵衛臻梁元帝謝賜第宅云稽以尺籍令以鼛鼓斵者如風築者如雨茨者雲舒慢者波卷餼廩稱事忘勞競勸方湖匯澤章簜泭集我材孔良我工惟時般倕𤭔人獻巧林立絜百圍而置楹度千仞以架棟宫室制度易曰上古穴居而野處後世聖人易之以宫室上棟下宇以待風雨舜巖廊廊一作郎見門類周夏屋士冠禮設洗直于東榮注榮屋翼也周制自卿大夫以下其室為夏屋疏其室兩下而四周之鄭注檀弓曰夏屋今之門廡也兩下為之亦舉漢制況之也燕禮設洗當東霤注人君為殿屋也案考工記匠人注四阿若今之四注屋疏云四霤也殷人始為四注屋則夏后氏之屋南北兩下而已周制天子諸侯得為殿屋四注卿大夫以下但為夏屋兩下四注則南北東西皆有霤兩下則唯南北有霤而東西有榮是以燕禮言東霤而大夫士禮則言東榮也霤説文曰屋水流也又曰屋梠之兩頭起者為榮室月令疏古者窟居開其上取明故雨霤之後因名為中霤開牖者象中霤之取明也下上林賦高廊四注注廊謂堂四周屋也詩夏屋渠渠注夏大也漢西清上林賦青龍蚴蟉於東箱象輿婉僤於西清靈圄燕於閒館偓佺之倫暴於南榮注師古曰西清者西廂清靜之處郭璞曰榮屋南檐也甘泉賦覽樛流於髙光兮溶方皇於西清注服䖍曰髙光宮名師古曰西清西廂清閒之處周昌傳呂后側耳於東箱聽注師古曰正寢之東西室皆曰箱言似箱篋之形晁錯傳趨避東箱虞詡傳張防趨就東箱注埤蒼云箱序也東京賦下彫輦於東廂注爾雅東西廂謂之序魯靈光殿賦西廂注西序也覲禮注東箱東夾之前相翔待事之處漢銅池璇題璧璫藻井宣紀神爵元年詔金芝九莖産于函徳殿銅池中注如淳曰銅池承霤也師古曰以銅為之甘泉賦珍臺閒館璇題玉英蜵蜎蠖濩之中注應劭曰題頭也榱椽之頭皆以玉飾言其英華相燭上林賦華榱璧璫輦道纚屬注師古曰榱椽也華謂彫畫之璧璫以玉為椽頭之當即所謂璇題玉題一曰以玉飾瓦之當西都賦雕玉瑱以居楹裁金璧以飾璫注彫刻玉礩以居楹柱瑱與磌通徒年切韋昭曰裁金為璧以當榱頭西京賦蔕倒茄於藻井披紅葩之狎獵飾華榱與璧璫流景曜之韡曄彫楹玉磶繡栭雲楣三階重軒鏤鑑文㮰注藻井當棟中交木方為之如井幹也藻水草之有文者風俗通曰今殿作天井井東井之象菱木中之物皆所以厭火磶礩也栭斗也王褒甘泉頌曰采雲氣以為楣魯靈光殿賦齊玉璫與璧英芝栭欑羅以戢孴注芝栭山節方小木為之牚眉梁之上圓淵方井反植荷蕖雲楶藻梲龍桷雕鏤包咸曰梁上楹畫為藻文景福殿賦列髹彤之繡桷垂琬琰之文璫爰有禁楄勒分翼張承以陽馬接以員方繚以藻井編以綷䟽繁飾絫巧不可勝書金楹齊列玉舄承䟦青瑣銀鋪是為閨闥注楄附陽馬之短桷也陽馬四阿長桁也馬融梁將軍西第賦曰騰極受檐陽馬承阿青瑣銀鋪為閨闥之飾鋪以銀為鋪首也長門賦曰擠玉户而撼金鋪蜀都賦金鋪交映玉題相暉張景陽七命隂虯負檐陽馬承阿楚辭曰仰觀刻桷畫龍虯方䟽含秀圓井吐葩曹子建七啓彤軒紫柱文榱華梁綺井含葩金墀玉廂甘泉賦炕浮柱之飛榱宋志殿屋為員淵方井兼植荷華漢殿檻朱雲傳攀殿檻檻折及後當治殿檻上曰勿易因而輯之以旌直臣西京賦三階重軒鏤檻文㮰注檻闌也皆刻畫又以大板廣四五尺加漆澤焉重置中間闌上名曰軒甘泉頌曰編瑇瑁之文㮰上林賦步櫩周流注今步廊也宛虹拖於楯軒漢丹墀梅福傳願壹登文石之陛涉赤墀之塗當户牖之法坐注應劭曰赤墀以丹淹泥塗殿上師古曰户牖之間謂之扆法坐正坐也聽朝之處猶言法宫法駕也西京賦右平左墄青瑣丹墀注墄限也謂階齒也天子殿髙九尺階九齒各有九級其側階各中分左右左有齒右則滂沲平之令輦車得上漢官典職曰丹漆地故稱丹墀賦又曰金戺玉階彤庭煇煇西都賦左墄右平重軒三階注七畧曰王者宫中必左墄而右平摯虞决疑要注曰凡太極乃有陛堂則有階無陛平者以文塼相亞次也墄者為陛級也賦又曰昭陽特盛隆於孝成屋不呈材牆不露形元墀釦砌玉階彤庭碝磩綵緻琳珉青熒班倢伃賦俯視兮丹墀思君兮履綦注丹墀赤地也七啟金墀玉廂注劉梁七舉曰丹墀縹壁紫柱紅梁漢武故事上起神屋鑄銅為柱黄金塗之赤玉為階唐有龍墀士冠禮阼階注阼酢也東階所以答酬賔客也毎階有東西兩廉聘禮饔鼎設于西階當内廉疏匠人云天子之堂九尺賈馬以為階九等賈誼曰陛九級上廉逺地則堂髙考工記夏后氏世室九階注南面三階餘三面各二疏賈馬諸家皆以為九等階鄭不從者夏卑宫室當一尺之堂為九等階於義不可故為旁九階也明堂位中階阼階西階故知南面三階也大射禮云北階記云側階東階此四面有階明堂位三公中階之前諸侯之位阼階之東諸伯之國西階之西正義南面三階故稱中阼階近王位也書舞干羽于兩階注賔主階間也史記堯舜土階三等漢浮思明堂位魯大廟之飾山節謂欂盧刻為山形藻棁謂侏儒柱畫為藻文復廟上下重屋重檐重承壁付也刮楹以宻石摩柱達鄉毎室四户八窓牖户通達反坫兩君相見反爵之坫也築土為之在兩楹間近南人君飲酒既獻反爵於坫上出尊尊在兩楹間坫在尊南崇坫康圭為高坫受賔之圭舉於其上康音抗䟽屏注屏謂之樹今浮思也刻之為雲氣蟲獸如今闕上為之矣正義䟽刻也漢時為屏為浮思天子外屏匠人注云城隅謂角浮思也漢時東闕浮思災浮思小樓也城隅闕上皆有之然則屏上亦為屋以覆屏牆或解屏則闕也古詩云雙闕百餘尺則闕於兩旁不得當道與屏别也文紀七年六月癸酉未央宮東闕罘罳災注師古曰罘罳謂連闕曲閣也以覆重刻垣墉之處其形罘罳然一曰屏也渭陵延陵園門亦有罘罳哀紀元壽元年九月孝元廟殿門錮龜蛇鋪首鳴注師古曰門之鋪首所以衘環楚辭網户朱綴刻方連東方朔有殿上拍柱賦説文扁從户册春秋作者三作丘甲作三軍作僖公主新作亦三新作南門新延廐新作雉門及兩觀左傳清廟茅屋以茅飾屋昭其儉也周書括柱茅茨為民愛費董生書曰禮天子之宫在清廟左涼室右明堂後路寢四室者足以避寒暑而不髙大也仲長統昌言曰今為宫室者崇臺數十層長階十百仞延袤臨浮雲上樹九丈旗珠玉翡翠以為飾連帷為城結帳為宫起臺榭則髙數百丈壁帶珠玉土被緹錦藝文類聚楚辭曰像設居室靜閒安髙堂邃宇檻層軒層臺累榭臨髙山網戶朱綴刻方連冬有突厦夏室寒經堂入奥朱塵筵朱塵筵席也砥室翠翹挂曲瓊蒻阿拂壁羅幬張翡帷翠帳飾髙堂紅壁沙板玄玉梁仰觀刻桷畫龍蛇坐堂伏檻臨曲池芙蓉始發雜芰荷紫莖屛風文綠波玉海卷一百七十五
