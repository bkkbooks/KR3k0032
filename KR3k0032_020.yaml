body:
  text: 玉海卷二十宋王應麟撰地理山川黃帝空桐山史記紀東至於海西至於空桐韋昭曰在隴右正義曰括地志山在肅州福祿縣東南六十里古西戎地抱朴子内篇黃帝從廣成子受自然之經即此山又笄頭山一名空桐山在原州平髙縣西百里酈元云大隴山異名莊子廣成子學道空桐山黄帝問道在此蓋二處皆云黄帝登之未詳孰是登雞頭南至於江登熊湘北逐葷粥合符釡山而邑于涿鹿之阿贊予西至空桐北過涿鹿長老各稱黃帝堯舜之處風敎固殊莊子黃帝立為天子聞廣成子在於空桐之上往見之釋文爾雅云北戴斗極為空同一曰在梁國虞城東三十里司馬云當北斗下山也漢武帝元鼎五年冬十月至隴西登空桐王元之有空桐山銘黃帝五山見羣祀堯山前地理志中山國唐縣注堯山在南應劭曰故堯國也唐水在西張晏曰堯為唐侯國於此堯山在唐東北望都界望都縣注張晏曰堯山在北堯母慶都山在南登堯山見都山故以為名張衡南都賦奉先帝而追孝立唐祀乎堯山注水經曰南陽縣西堯山酈元曰魯縣立堯祠於西山謂之堯山舜十二州山川舜典肇十有二州封十有二山濬川程氏曰封表其山為一州之鎮夏氏曰封殖十二州之山與其川而深濬之孔氏以封訓大每州取山之殊大者以為一州之鎮胡氏曰川之交㑹非若山之可以州别若江出岷山梁州而患在荆揚河出崑崙雍州而患在徐兗故不言十二舜歴山續志濟陰郡成陽有雷澤注帝王世紀舜耕歴山漁雷澤濟陰有歴山河東郡蒲坂注縣南二十里有歴山舜所耕處水經蒲坂注郡南有歴山謂之歴觀舜所耕處有舜井嬀汭二水出焉上有舜廟曾鞏曰圖記皆謂齊之南山為歴山禹九州山山川名山川次秩禹貢奠髙山大川序禹别九州隨山濬川正義奠髙山大川言禹治九州之水水害既除定山川次秩自導岍至嶓冢所治之山首尾相及導弱水至洛所治之水發源注海定其次秩尊卑使知祀禮所視山髙者莫髙於岳川大者莫大於瀆五岳嵩岱衡華恒四瀆江河淮濟舜典云望秩山川故言定其差秩王制云五岳視三公四瀆視諸矦其餘視伯子男荆岐既旅蔡蒙旅平九山刋旅是次秩既定故旅祭之九州之次以治為先後治水皆從下為始冀州帝都於九州近北故首從冀起自兗已下皆準地之形勢從下向髙從東向西雍地最髙故在後此經大體毎州之始先言山川後言平地青梁先山後川徐雍先川後山兗揚荆豫有川無山揚豫不言平地史以大略為文冀州之分言及雍州之山從東循山治水而西故也班固漢書地理志據前漢郡縣言山川所在禹貢分州必以山川定經界古州縣之設有時而更山川之形千不易吕刑禹平水土主名山川注禹治洪水山川無名者主名之史記夏本紀禹乃行相地宜所有以貢及山川之便利禹行自冀州始漢張騫傳贊言九州山川尚書近之矣至禹本紀山經所有放哉史大宛傳同又曰所有怪物余不敢言之也爾雅從釋地已下至九河皆禹所名也莊子天下篇墨子曰禹湮洪水决江河通四夷九州名川三百支川三千小者無數冀之壺口梁岐岳陽碣石雷首底柱析城王屋太行恒山大伾靑之岱萊徐之蒙羽嶧陽揚之敷淺原荆之荆衡内方大别豫之熊耳外方桐柏陪尾梁之華陽岷嶓蔡䝉雍之荆岐終南惇物鳥䑕三危積石龍門岍西傾朱圉華陰此九州之山也冀之衡漳恒衞孟津洚沇兗之九河雷夏灉沮濟漯靑之濰淄汶徐之淮沂泗大野揚之彭蠡三江震澤荆之江漢九江沱濳雲夢滄浪三澨澧豫之伊洛瀍澗滎波菏澤孟豬梁之黑水桓沔雍之西河弱水涇渭漆沮灃此九州之川也每州言境内之山川又聯貫首尾從西而東以著自然之形勢先隨山而後濬川自導岍至敷淺原皆導山之事自導弱水至導洛凢九條皆導水之事自北而南言山以為水之經言水以為山之紀九山刋旅九川滌源九澤既陂四海㑹同禹功之全可見矣禹九江九水九江圖禹貢荆及衡陽惟荆州江漢朝宗于海九江孔殷注江於此州界分為九道甚得地勢之中釋文尋陽地記曰禹疏九江一曰烏白江二曰蚌江三曰烏江四曰嘉靡江五曰畎江六曰沙源江七曰廪江八曰提江一作隄九曰箘江一作菌張須元緣江圖云一曰三里江二曰五州江三曰嘉靡江四曰烏土江五曰蚌江六曰白烏江七曰箘江八曰沙提江九曰廩江參差隨水長短或百里或五十里始於鄂陵終於江口㑹于桑落洲太康地記曰九江劉歆以為湖漢九水入彭蠡澤也正義傳以江是此水大名九江謂大江分而為九猶大河分為九河鄭云九江從山谿所出其孔衆多言治之難也鄭意九江各自别源其源非大江也下流合于大江耳應劭注地理志云江自潯陽分為九道符於孔説潯陽記有九江之名烏蜯烏白嘉靡畎源廩提箘雖名起近代義或當然賈耽謂江有八洲與江為九所導凢有九水大意自北為始弱水最在西北水又西流故先言之黑水雖在河南水從雍梁西界南入南海與諸水不相參渉故又次之四瀆江河為大河在北故先言河也漢入于江故先漢後江其濟發源河北越河而南與淮俱為四瀆故次濟次淮其渭與洛俱入于河故後言之流水多矣此舉大者言耳弱黑沇水不出于山其餘六水文與山連不言水積石山非河上源記施功之處淮渭洛言自某山皆是發源夏本紀九江甚中注鄭玄曰地理志在尋陽南皆東合為大江索隱曰張氏九江圖所載有三里五畎烏土白蚌河渠書太史公曰余南登廬山觀禹疏九江漢志蜀郡湔氐道注禹貢㟭山在西徼外江水所出東南至江都入海過郡七行二千六百六十里廬江郡尋陽縣注禹貢九江在南皆東合為大江九江郡注應劭曰江自廬江尋陽分為九文選江賦源二分於崌崍流九派乎潯陽注尚書曰荆州九江孔殷淮南子禹鑿江而通九路曾氏曰沅漸元辰敘酉湘資醴水皆合洞庭中東入于江是為九江導江曰過九江至于東陵今之巴陵巴陵之上即洞庭也因九水所合遂名九江水經九江在長沙下雋西北楚地記曰巴陵瀟湘之淵在九江之間夏氏取曾説水經引庾仲雍江記選洞簫賦注引江圖選詩注引庾仲雍江圖隋志庾仲雍江記五卷漢水記五卷尋江源記一卷唐志五卷釋道安四海百川水源記一卷張氏江圖一卷劉氏江圖二卷唐志失姓名唐志張容九江新舊錄三卷文選注周書曰禹渫七十川大利天下莊子禹親自操橐耜而九雜天下之川禹三江禹貢淮海惟揚州彭蠡既豬陽鳥攸居三江既入震澤底定釋文韋昭曰三江謂吳松江錢塘江浦陽江也吳地記云松江東北行七十里得三江口東北入海為婁江東南入海為東江并松江為三江庾仲初吳都賦注同郭璞曰岷浙松江正義孔傳云自彭蠡江分為三入震澤遂為北江入海鄭玄以為入于海不入震澤今南人以大江不入震澤震澤之東别有松江等三江史記夏本紀三江既入注索隱曰按地理志有南江中江北江是為三江其南江從㑹稽吳縣南東入海即松江也中江從丹陽蕪湖東北至㑹稽陽羡縣東入海北江從㑹稽毗陵縣東北入海故下文東為中江又東為北江孔安國云有北有中南可知也正義吳郡東南三十里名三江口一松江古笠澤一上江亦曰東江一下江亦曰婁江周禮職方氏揚州其川三江疏江至尋陽南合為一東行至揚州入彭蠡復分為三道入海漢地理志注師古曰三江謂北江中江南江也震澤在吳西即具區也溝洫志於吳則通渠三江五湖管子夏人之王外鑿二十䖟渫十七湛疏三江鑿五湖道四涇之水以商九州之髙以治九藪民乃知城郭門閭室屋之築而天下化之荀子成相禹有功抑下鴻北决九河通十二渚疏三江淮南子舜乃使禹疏三江五湖闢伊闕導瀍澗水經南江東北為長瀆歴河口東南注于具區謂之五湖口東則松江出焉謂之三江口又曰江水竒分謂之三江口蘇氏曰豫章江入彭蠡而東至海為南江岷山江之經流㑹彭蠡以入海為中江漢自北入江滙于彭蠡以入海為北江三江入海則吳越始有可宅之土而水所鍾者獨震澤而已禹貢正義孔意江從彭蠡分為三又共入震澤從震澤復分為三乃入海蘇氏破其說謂安國未嘗南遊曾氏曰考於地志豫章之川如彭水鄱水塗水之類凡九水合於湖漢東至彭蠡入江此九水蓋南江也南江乃江之故迹非禹所導禹導漢水入焉與舊江合流而水之派分為南北故漢為北江又導岷山之江入焉其流介乎二江之中故為中江南江乃故道故經不志夏氏取曾説葉氏曰漢至大别南入于江為南江與中江北江為三蔡氏曰庾仲初吳都賦注松江下七十里分流東北入海者為婁江東南流者為東江并松江為三江其地今亦名三江口呉越春秋所謂范蠡乘舟出三江之口者是也吳越春秋以三江為浙浦陽剡諸家各指近震澤諸江為三江蘇氏指秣陵京口一江為三江按今大江所行以求三江猶按漢大河所行以求九河其不可得明矣山海經浙江出三天子都在其東在閩西北入海餘曁南廬江出三天子都一曰天子鄣入江彭澤西禹九山禹貢九山刋栞旅注九州名山已槎木通道而旅祭史記道九山汧及岐至於荆山正義九州之山謂汧壺口砥柱太行西傾熊耳嶓冢内方汶索隱曰岍壺口底柱太行西傾熊耳嶓冢内方岐是九山也古分為三條故地理志有南北條之荆山馬融以岍為北條西傾為中條嶓冢為南條鄭康成分四列岍為陰列西傾次陰列嶓冢為次陽列岷山一作荆正陽列禹貢正義馬融王肅皆為三條陳氏曰岍岐之列河濟所經西傾之列伊洛淮渭所經嶓冢之列漢水所經岷山之列江水所經案孔注岍西傾雍壺口底柱冀熊耳豫嶓冡岷梁内方荆疏太行在河内郡山海經禹曰天下名山五千三百七十居地六萬四千五十六里出銅之山四百六十七出鐵之山三千六百九十管子同周語禹封崇九山漢溝洫志禹通九道陂九澤度九山文選子虛賦注張揖曰禹為堯司空辯九州名山别草木蘇氏曰地之有山猶人之有脉有近而不相連有逺而相屬雖江河不能絶自蒙恬始言地脉鄭氏以為四列一行以為兩戒禹九川禹貢九川滌源注九州之川禹貢九州之水曰浮曰逹曰入曰沿曰逾曰至曰亂曰滙曰迤曰溢曰流曰别曰道曰被曰㑹曰過曰同九州之澤曰豬曰澤益稷禹曰予决九川距四海注决九州名川通之至海史記道九川弱水至于合黎注索隱曰弱黑河瀁江沇淮渭雒為九川周語禹決汩九川劉子見河雒而思禹功管子地數篇地之東西二萬八千里南北二萬六千里其出水者八千里受水者八千里賈誼新書禹曰鬟河而導之九牧鑿江而導之九路治水有兩端川流畎澮轉相入以達于海使之有所歸也或不可達海則捐數百里之地因其埶以為澤使之有所容也衆水皆東而弱水獨西黑水獨南因其埶之不得不然行其所無事也禹四瀆史記湯還亳作湯誥曰古禹臯陶久勞于外其有功于民民乃有安東為江北為濟西為河南為淮四瀆既修民乃有居封禪書武帝詔昔禹疏九江决四瀆禹貢正義四瀆江河為大河在北故先言河漢入于江故先漢後江濟發源河北越河而南與淮俱為四瀆故次濟次淮江出岷山濟出王屋山河出崑崙而後至積石淮出胎簮山而後至桐栢酈道元謂東南地卑萬水所湊觸地成川故川舊瀆難以為憑然則禹迹不可考者多矣天文五潢地圖四瀆禹龍門山水經又南出龍門口注魏土地記曰梁山北有龍門山大禹所鑿通孟津河口廣八十歩巖際䥴跡遺功尚存岸上並有廟祠祠前有石碑三所二碑不可識一碑太和中立史記正義龍門山在絳州龍門縣括地志云龍門在同州韓城縣北五十里其山更黃河夏禹所鑿者也龍門山在夏陽縣禹貢正義地理志云龍門山在馮翊夏陽縣北此山當河之道禹鑿以通河東都之西界也吳越春秋禹周行㝢内東造絶迹西延積石南踰赤岸北過寒谷徊崑崙察六扈脉地理名金石冩流沙於西隅决弱水於北漢青泉赤淵分入洞穴通江東流至於碣石疏九河於涽淵開五水於東北鑿龍門闢伊闕平易相土觀地分州禹七十川陂塘文選木華海賦禹乃鏟臨崖之阜陸决陂潢而相沃注淮南子曰禹有洪水之患陂塘之事啟龍門之岝嶺􅀢陵巒而嶄鑿羣山既畧百川潜渫注周書曰禹渫七十川大利天下商傅巖說命說築傅巖之野注傅氏之巖在虞虢之界通道所經有澗水壞道常使胥靡刑人築䕶此道説賢而隱代胥靡築之以供食吕温有銘周九州山川九藪夏九藪禹九澤禮夏官職方氏辨九州之國使同貫利東南曰揚州其山鎮曰㑹稽其澤藪曰具區其川三江其浸五湖正南曰荆州其山鎮曰衡山其澤藪曰雲瞢其川江漢其浸潁湛河南曰豫州其山鎮曰華山其澤藪曰圃田其川滎雒其浸波溠正東曰青州具山鎮曰沂山其澤藪曰望諸其川淮泗其浸沂沭河東曰兖州其山鎮曰岱山其澤藪曰大野其川河泲其浸盧維當為雷雍正西曰雍州其山鎮曰嶽山注吳嶽也其澤藪曰弦蒲其川涇汭其浸渭洛東北曰幽州其山鎮曰醫無閭其澤藪曰貕養其川河泲其浸菑時河内曰冀州其山鎮曰霍山其澤藪曰楊紆其川漳其浸汾潞正北曰并州其山鎮曰恒山其澤藪曰昭餘祁其川虖池嘔夷其浸淶易注鎮名山安地德者也大澤曰藪凢九州及山鎮澤藪言曰者以其非一曰其大者耳正義九州皆有鎮所以安地德山師掌山林之名川師掌川澤之名地官土訓掌道地圖注說地圖九州形勢山川所宜告王以施其事澤虞云云鄭氏注澤水所鍾水希曰藪禹貢曰九澤既陂爾雅有八藪疏爾雅藪在釋地之篇不入釋水職方澤藪以其有水則為澤無水則為藪禹貢九澤通畿内一州則有九爾雅云八藪除畿内一州而言案爾雅釋地有十者以周秦同在雍州秦有楊陓周有焦穫一州有二故十又爾雅秦有楊陓職方冀州有楊紆蓋異所而同名也爾雅釋地十藪魯有大野晉有大陸秦有楊陓宋有孟諸楚有雲夢呉越之間有具區齊有海隅燕有昭余祁鄭有圃田周有焦䕶管子輕重戊夏人之王云云以商九州之髙以治九藪周語伯禹釐改制量共之從孫四岳佐之髙髙下下疏川道滯鍾水豐物封崇九山決汩九川陂障九澤豐殖九藪汩越九原宅居九隩合通四海馬融傳融上廣成頌曰揫斂九藪之動物繯槖四野之飛征注周禮職方氏掌九藪注云澤無水曰藪吕氏春秋九藪越之具區楚之雲夢秦之陽華晉之大陸梁之圃田宋之孟諸齊之海隅趙之鉅鹿燕之大昭淮南子曰秦之陽紆燕之昭余左傳四嶽三塗陽城大室荆山終南九州之險也是不一姓地理志注臣瓚曰汲郡古文梁惠王發逢忌之藪以賜民周國都山川夏官掌固凡國都之竟有溝樹之固郊亦如之民皆有職焉若有山川則因之注山川若殽皋河漢疏謂殽有二陵東成臯楚國漢水以為池河為四瀆之險又齊西有濁河皆因之為固周岐山選注說文曰岐山在長安西美陽縣界山有兩岐因以名焉周語内史過曰周之興也鸑鷟鳴於岐山緜詩箋周之原地在岐山之南閟宮言大王居岐山之陽漢志右扶風美陽縣注岐山在西北中水鄉周大王所邑詩譜豳在岐山之北史記正義括地志云岐山岐州岐山縣東北十里徐廣云其南有周原周名山詩終南注周之名山中南也史記傳騶衍作十餘萬言先列中國名山大川推及海外云九州各有禆海環之有大瀛海環其外淮南子墬形訓何謂九山㑹稽泰山王屋首山太華岐山太行羊腸孟門選注抱朴子曰聞鄭君言道書之重莫尚於三皇文五岳真形圖遁甲開山圖曰有巨靈胡者徧得坤元之道能造山川出江河孔子記山川中庸注此孔子兼包堯舜文武之盛德而著之春秋述天時謂編年四時具也因水土謂記諸夏之事山川之異秦五領張耳傳秦北為長城之役南有五領之戍注師古曰領者西自衡山之南東窮于海一山之限耳而别標名有五裴氏一云裴淵廣州記云大庾始安臨賀桂陽揭陽是為五領鄧德明南康記曰大庾領一也桂陽騎田領二也九真都龐領三也臨賀萌渚領四也始安越城領五也裴說是也輿地志一曰臺嶺亦名塞上今名大庾二曰騎田三曰都龍四曰萌諸五曰越嶺漢郡縣山川詩書山川郡縣山川風俗叙傳三代損益降及秦漢革剗五等制立郡縣畧表山川彰其剖判地理志先王之迹既逺地名又數改易是以采獲舊聞考迹詩書推表山川以綴禹貢周官下及戰國秦漢續志漢志記郡縣本末及山川奇異風俗所由至矣禹貢疏班固作漢書地理志據前漢郡縣言山川所在又曰地理志云禹貢北條荆山在馮翌懷徳縣南南條荆山在南郡臨沮縣東北是舊有三條之說也故馬融王肅皆為三條導岍北條西傾中條嶓冢南條鄭玄以為四列導岍為陰列西傾為次陰列嶓冢為次陽列岍山為正陽列鄭玄創為此說孔亦當為三條也三輔其山驪華梁荆九嵏岐汧終南敦物其川沂霸洛渭酆潏漆杜弦蒲汧芮褒斜弘農河東太原上黨其山熊耳雷首析城王屋霍壺口鹿谷羊頭其川伊育澗雒汾晉丹絳昭餘祁虖池漳沁河内至南陽七郡則有太行大騩太室陽城髙陵中陰桐柏之山淇蕩圃田瀍漯逢忌泲濮洧潁汝澧之川南郡至常山十郡則有荆内方陪尾天柱常山九江廬江淮肥清河沮常之川及大壄大陸雲夢菏雷之澤清河而下齊魯燕之分也山則泰岱原蒙羽澤之罘壺菜川則汶維甾時洙泗膠沂淶易術㑹稽而下吳楚粤之境也山則歴㑹稽天門武林傅昜九疑川則具區三江彭蠡以至鬵漢沔之在漢中㟭蒙江沱之在蜀郡鳥䑕嶓冡西傾養水之在隴西揭石無慮遼沛沮夏之在右北平武都遼東若金城之積石天水之朱圄長沙之衡六安之大别皆禹貢所紀之山也張掖之流沙安定之涇武威之豬壄梁之盟諸信都之絳皆禹貢所紀之川也若考迹詩書扶風之郁夷芮􅠵魏之淇浚河汾溱洧之於鄭嶩之於齊則考之詩者也吳山之為汧太一之為終南崇髙之為外方章山橫尾之為内方陪尾葛嶧傅昜之為嶧陽傅淺源具區震澤之異名居延流沙之殊稱則考之書者也奚養之澤參諸秦地之圖鬲津淮漯絳易汶弱水訂諸平當桑欽之説其采獲舊聞又若此繫水土之風氣謂之風隨君上之情欲謂之俗風俗見上郡國春秋正義地理志以風為本俗為末言聖王必移本而易末廣谷大川異制民生其間異俗剛柔輕重遲速異齊器械異制衣服異宜顧豐水洛汭而思平水之功瞻陽城中南而監恃險之失艮兼兌麗具載諸書卷石勺水氣積形生鴻濛嶫峩漢武之世凢五嶽盡在天子之郡而不隷矦國漢上林八川司馬相如傳上林賦獨不聞天子之上林乎左蒼梧右西極丹水更其南紫淵徑其兆終始霸産出入涇渭酆鎬潦潏紆餘委蛇經營其内蕩蕩乎八川分流相背異態東西南北馳騖往來出乎椒丘之闕行乎洲淤之浦徑乎桂林之中過乎泱莾之壄汩乎混流順阿而下赴隘陿之口觸穹石激堆埼云云東注太湖郭璞曰太湖在吳縣所謂震澤衍溢陂池注師古曰霸水出藍田谷西北入渭産水亦出藍田谷北至霸陵入霸涇水出安定涇陽开頭山東至陽陵入河渭水出隴西首陽縣鳥䑕同穴山東北至華陰入河張揖曰灃水出鄠南山灃谷北入渭鎬在昆明池北潦行潦也潏水出南山師古曰潦音牢亦水名出鄠縣西南山潦谷北流入于渭地理志鄠縣有潏水北過上林苑入渭霸産涇渭灃鎬潦潏是為八川李善注引潘岳關中記云云亡是公言上林廣大川谷水泉萬物及子虛言雲夢所有甚衆漢河源張騫傳漢使使窮河源天子案古圖書名河所出山曰崑崙贊曰禹本紀言河出崑崙崑崙髙二千五百里餘日月相避隱為光明自騫使大夏之後窮河原惡睹所謂崑崙者乎注鄧展曰尚書道河積石河原出于積石在金城河關不言出崑崙也後漢西域傳河有兩源一出葱嶺東流一出于闐南山下北流與葱嶺河合東注蒲昌海一名鹽澤去玉門三百餘里前傳又云潛行地下南出于積石為中國河班固傳西盪河源注河源在崑崙山通典張騫實不見河源徒見兩水入蒲昌海耳吐蕃自言崑崙在國之西南即河所出也水經崑崙墟在西北河水出其東北陬又出海外南至積石山下有石門河水冒以西南流河水又南入葱嶺山其一源出于闐國南山北流與葱嶺河合東注蒲昌海又西北流注于河注河水重源有三非為二也凉土異物志曰葱嶺之水分流東西西入大海東為河源禹記所云崑崙者焉張騫使大宛而窮河源謂極於此而不達于崑崙河水重源又發于西塞之外出于積石之山按山海經自崑崙至積石一千七百四十里唐西域傳李靖破吐谷渾望積石覽觀河源唐劉元鼎使吐蕃自成紀西南出塞二千餘里得河源于莫賀延磧尾曰悶摩黎山而謂之崑崙河東南流與積石河相連隱測其地在劔南之西李大亮傳涉青海觀河源史記正義括地志河州有小積石山即禹貢浮于積石至龍門者然黄河源從西南下出大崑崙東北隅東北流經于闐入鹽澤即東南濳行入吐谷渾界大積石山又東北流至小積石山河始闓圖云黃河出崑崙東北角剛山東自北行千里折西行于浦山南流千里至文山東流千里至秦澤西流千里至潘澤陵門東北流千里至華山之陰東南流千里至下津然河水九曲其長九千里入渤海爾雅云河出崑崙虚其色黃百里一小曲千里一曲一直史記索隱按山海經河出崑崙東北隅西域傳云南出積石山為中國河積石本非河之發源河源本崑崙而潛流至于闐又東流至積石始入中國則山海經及禹貢各互舉耳禹貢正義河行塞外東北入塞内積石非河之源故云河所經河從西來至此北流故禹沿河流而北爾雅釋文案山海經云東望泑澤河水之所潛也圖讚云崑崙三層號曰天柱實惟河源水之靈府唐志賈耽吐蕃黃河録四卷呂氏曰河源逺出絶域禹不窮其所至故導河止自積石積石雍州之山在金城西南先儒以為河之所經則非河源明矣導淮曰自桐柏渭曰自鳥䑕洛曰自熊耳導河獨不言自豈非源之所自出或未究歟漢祁連山霍去病傳上曰票騎將軍渉鈞耆濟居延遂臻小月氏攻祁連山揚武乎鱳得注師古曰祁連山即天山也匈奴呼天為祁連叙傳西規大河列郡祁連注張晏曰置郡至祁連山紀元狩二年夏將軍去病公孫敖出北地二千餘里過居延注師古曰居延匈奴中地名張掖所置居延縣以安處所獲居延人而置此縣天漢二年夏五月貳師將軍三萬騎出酒泉與右賢王戰于天山注師古曰即祁連山也匈奴傳其夏票騎將軍復與合騎侯數萬騎出隴西北地二千里過居延攻祁連山得胡首虜三萬餘級禆小王以下十餘人通典元和志於張掖縣既著祁連山矣而伊西庭三州皆有此山則是自甘張掖而西至于庭州相去三千五六百里而天山皆周徧其地亦廣長矣去病至祁連山武帝數其功曰云云小月氏者河西四州皆是也而鱳得地理志作觻得乃張掖之屬縣則此之所攻祁連者固在張掖矣至天漢二年貳師出酒泉又擊右賢王于天山酒泉肅州也漢八藪嚴助傳淮南王安上書天子之兵有征無戰陛下以四海為境九州為家八藪為囿江漢為池注師古曰八藪謂魯有大野晉有大陸秦有陽紆宋有孟諸楚有雲夢呉越之間有具區齊有海隅鄭有圃田漢水經山經水志隋志水經三卷郭璞注唐志桑欽三卷舊志云郭璞撰酈道元注四十卷後魏人字善長博采地志窮遠水源書道元好學厯覽竒書撰注水經四十卷目同李吉甫刪水經十卷自河水至斤江水河漯汾澮涑文原洞晉湛濟清沁淇蕩洹漳易􅋤聖巨馬濕沽鮑丘濡遼浿洛糓甘漆滻沮渭漾丹汝潁洧潩潧陰汳睢匏子汶泗沂沭洋淄汶濰膠沔潛湍均粉白泚淮滍淯㶏灈瀙潕溳漻蘄決沘泄肥施沮漳夏羌涪潼涔江青衣桓若沫延江沅酉存温淹葉榆夷油澧沅泿資漣湘灕溱洭深鍾耒洣漉瀏㵋贑廬漸江斤江非經水常流不在記注之限末卷載禹貢山水澤地所在凡六十道元序曰昔大禹記著山海周而不備地理志所錄簡而不周尚書本紀與職方俱畧唐六典注桑欽水經所引天下之水百三十七江河在焉酈善長注引枝流一千二百五十二漢地理志引桑欽之説於上黨曰絳水出西南於平原曰漯水所出泰山丹陽之汶水淮水敦煌郡之魚澤效糓張掖曰弱水自此至酒泉合黎中山曰易水出西北東入􅋤通典云水經不詳所撰者名氏亦不知何代之書經云壽張光武更名臨濟安帝更名湖陸章帝更名永安順帝更名故知順帝以後纂序也詳水經所作殊為詭誕按後漢志濟水王莽時因旱渠塞不復截河南過既順帝時所撰都不詳悉景純注解疎畧亦多迂怪經云河出崑崙山者出於禹本記山海經云南入葱嶺及出于闐南山者出于漢書西域傳而酈元所注亦引禹記山經釋法顯遊天竺記釋氏西域記後代纂錄者務廣異聞如范曄敘廪君盤瓠之類撰水經者亦同蔚宗之㫖趣又云是和帝以後所撰經云武矦壘又云魏興安陽縣注云諸葛武矦所居魏分漢中立魏興郡又改信都從長樂則晉太康五年事也然則非後漢人所撰隋志不言桑欽晁志云漢桑欽撰成帝時人前儒林傳古文尚書塗惲授河南桑欽君長漢地理志注文選注史記正義引水經後漢注引水經注後漢蠻夷傳論漢氏征伐戎狄云云著自山經水志者亦畧及焉隋志有僧道安四海百川水源記一卷漢雍州山川又見羣祀西都賦漢之西都在於雍州實曰長安左據函谷二崤之阻表以太華終南之山右界褒斜隴首之險帶以洪河涇渭之川睎秦嶺睋北阜挾灃灞據龍首溝洫志左右内史地名山川原甚衆水經注潘岳關中記曰關中有涇渭灞滻酆鄗漆沮之水漢太一山西京賦於前則終南太一隆崛崔崪隱轔欝律連岡乎嶓冢抱杜含鄠欱灃吐鎬注漢書曰太一山古文以為終南五經要義曰太一一名終南山在扶風武功縣蓋終南南山之總名太一一山之别號耳選注引班固終南山賦蜀二江漢溝洫志於蜀則蜀守李冰鑿離􅕞避沬水之害穿二江成都中蜀志秦宓曰蜀有汶阜之山江出其腹帝以㑹昌神以建福故能沃野千里淮濟四瀆江為其首此其一也禹生石紐今之汶山郡是也禹疏江決河東注於海為民除害功莫先者此其二也天帝布治房星决政參伐參伐則益州分野三皇乘祗車出谷口今之斜谷是也蜀都賦帶二江之雙流水經注沬水自蒙山至南安而溷崖水脉漂疾害舟船李冰發卒鑿平溷崖即離􅕞通正水路開處即冰所穿也風俗通秦昭王使冰為蜀守開成都兩江漑田萬頃狄遵度鑿二江賦唐十道名山大川地理志太宗因山川舊志云山河㑹要云關河形便分天下為十道貞觀元年三月十日一曰關内道其名山太白九嵕吳岐梁華其大川涇渭灞滻二曰河南道其名山三崤少室砥柱蒙嶧嵩髙太岳六典嵩岱二岳其大川伊洛汝潁沂泗淮濟三曰河東道名山雷首介霍五臺六典嵉山其大川汾沁丹潞六典汾晉丹沁四曰河北道其名山林慮白鹿封龍井陘碣石常岳其大川漳淇呼沱五曰山南道其名山嶓冢熊耳銅梁巫荆峴六典巫峽其大川巴漢沮淯六曰隴右道其名山秦嶺隴坻鳥䑕同穴朱圉西傾積石合黎崆峒三危其大川河洮弱羌休屠之澤七曰淮南道其名山灊天柱羅塗八公六典又有大别霍山其大川滁肥巢湖八曰江南道名山衡廬茅蔣天目天台㑹稽四明括蒼縉雲金華大庾武夷其大川湘贑沅澧浙江洞庭彭蠡太湖九曰劒南道其名山岷峨青城鶴鳴其大川江涪雒西漢十曰嶺南道其名山黃嶺靈洲其大川桂欝天寳五載正月詔天下山水名稱或同義且不經多因里諺令所司據圖籍改定水經注劉澄之著永初山川記唐山河兩戒唐天文志李淳風漢書度數而一行以為天下山河之象存乎兩戒漢天文志元封中星孛于河戒占曰南戒為越門北戒為胡門又星傳月入牽牛南戒又曰積薪在北戒西北積水在北戒東北北戒自三危積石負終南地絡之陰東及太華逾河並雷首底柱王屋太行北抵常山之右乃東循塞垣至濊貊朝鮮是謂北紀所以限戎狄也南戒自岷山嶓冡負地絡之陽東及太華連商山熊耳外方桐柏自上洛南逾江漢攜武當荆山至于衡陽乃東循嶺徼達東甌閩中是謂南紀所以限蠻夷也故星傳謂北戒為胡門南戒為越門河源自北紀之首循雍州北徼逹華陰而與地絡相㑹並行而東至太行之曲分而東流與涇渭濟瀆相為表裏謂之北河江源自南紀之首循梁州南徼達華陽而與地絡相㑹並行而東及荆山之陽分而東流與漢水淮瀆相為表裏謂之南河故於天象則弘農分陜為兩河之㑹五服諸侯在焉自陜而西為秦涼北紀山河之曲為晉代南紀山河之曲為巴蜀皆負險用武之國也自陜而東為成周宋鄭陳蔡邶衞申隨皆四戰用文之國也北紀之東至北河之北為邢趙南紀之東至南河之南為荆楚自北河下流為三齊北燕自南河下流為鄒魯吳越皆負海之國貨殖之所阜也自河源循塞垣北東及海為戎狄自江源循嶺徼南東及海為蠻越觀兩河之象與雲漢之所始終而分野可知矣自南正達於西正得雲漢升氣為山河上流自北正達于東正得雲漢降氣為山河下流娵訾在雲漢升降中居水行正位故其分野當中州河濟間星紀得雲漢下流百川歸焉析木為雲漢末派山河極焉斗杓謂之外廷以治外故鶉尾為南方負海之國斗魁謂之㑹府以治内故娵訾為中州四戰之國其餘列舎在雲漢之陰者八為負海之國在雲漢之陽者四為四戰之國降婁玄枵負東海歲星位焉星紀鶉尾負南海熒惑位焉鶉首實沈負西海太白位焉大梁析木負北海辰星位焉鶉火大火壽星豕韋為中州鎮星位焉以七宿之中分四象中位自上元之首以度數紀之而著其分野其州縣雖改隷不同但據山河以分爾七國甘石分十二分野張衡蔡邕以配漢州縣史記正義南河北河三星分夾東井南河為南戒一曰陽門亦曰越門北河為北戒一曰陰門亦曰胡門兩戒間三光之常道也朝鮮之㧞星茀于河界禹貢正義地理志云禹貢北條荆山在馮翊懷德縣南南條荆山在南郡臨沮縣東北是舊有三條之說後漢天文志注星經曰歲星主泰山徐靑兖州熒惑主霍山揚荆交州鎮星主嵩髙山豫州太白主華陰山涼雍益州辰星主常山冀幽并州玉衡九星主六十郡九州第一星主徐凡五郡二主益凡七郡三主冀八郡四主荆五郡五主兖八郡六主揚六郡七主豫五郡八主幽八郡九主并八郡周禮保章氏疏春秋緯文耀鈎云布度定記分州繫象華岐以西龍門積石至三危之野雍州屬魁星大行以東至碣石王屋砥柱冀州屬樞星三河雷澤東至海岱以北兖州靑州屬機星蒙山以東至南江㑹稽震澤徐揚之州屬權星大别以東至雷澤九江荆州屬衡星荆山西南至岷山北嶇鳥䑕梁州屬開星外方熊耳以至泗水陪尾豫州屬搖星此九州屬北斗星有七州有九但兖靑徐揚并屬二州故七星主九州也李吉甫郡縣志序天漢萌而兩戒分南宫正而五均敘崇文總目開元分野圖一卷唐天下水泉六典水部掌天下川瀆陂池之政令以導達溝洫堰決河渠凢天下水泉三億三萬三千五百五十有九其在遐荒絶域殆不可得而知矣其江河自西極達於東溟中國之大川也其餘百三十有五是為中川桑欽水經所引天下之水百三十七江河在焉其千二百五十有二水斯為小川酈善長注水經引其支流一千二百五十二若渭洛汾濟漳淇淮漢皆亘達方域通濟舳艫徙有之無利于生人凢水有漑灌者碾磑不得與争其利仲春通溝瀆立隄防孟冬而畢凡用水自下始舊史同唐駐蹕山見紀功類敬播從太宗伐髙麗而帝名所戰山為駐蹕播謂人曰鑾輿不復東矣所以名蓋天意也其後果然吕氏春秋九山㑹稽太山王屋首山太華岐山太行羊腸孟門六川河水赤水遼水黒水江水淮水山海經五藏山經五篇大凡一萬五千五百三字後漢書注尸佼作書二十篇一篇言九州險阻水泉所起十九篇陳道德仁義之紀唐吳均天柱觀記太史公稱太荒之内名山五千其在中國有五岳作鎮羅浮括蒼軰十山為之佐命其餘不可詳載鄭樵曰州縣之設有時而更山川之形千古不易所以禹貢分州必以山川定經界使兖州可移而濟河之兖不能移使梁州可遷而華陽黑水之梁州不能遷是故禹貢為萬世不易之書後之為史者主於州縣故州縣移易而其書遂廢矣户口民數為國之本庶事所自出以分田里令貢賦造器用制祿食起田役作軍旅國以建典家以立度五禮用脩九刑用措今之為政户口漏於國版夫家脱於聨伍姦心生而偽端作嚴刑峻令不能救禹民口周民口後郡國志注帝王世紀禹平水土為九州民口千三百五十五萬三千九百二十三人周公相成王致治刑錯民口千三百七十一萬四千九百二十三人多禹十六萬一千人周之極盛也地十倍而民居其一故穀有餘而地力不耗東遷三十餘載至齊桓公二年周莊王十三年五千里内非天王之御自世子公侯以下至於庶民凡千一百八十四萬七千人定受田者九百萬四千人至于戰國蘇張計秦及山東六國戎卒尚踰五百餘萬推民口數當千餘萬通典同周民數禮天官小宰聽閭里以版圖注户籍地圖鄉宮伯注鄭司農云今時户籍謂之户版司書掌邦中之版知田野夫家之數地官大司徒掌人民之數小司徒掌四郊都鄙夫家九比之數頒比灋於六鄉大夫各登其鄉之衆寡以歲時入其數均土地稽人民周知其數三年大比鄉師以國比之灋稽夫家衆寡鄉大夫以歲時登其夫家之衆寡以歲時入其書閭師掌國中及四郊之人民之數以任其力縣師辨夫家人民田莱之數媒氏男女成名以上書年月日名春官天府祭天之司民獻民數則受而藏之夏官大司馬簡稽鄉民以用邦國簡比數之稽計也司士周知邦國都家縣鄙之數職方氏辨人民財用九榖之數要秋官小司㓂大比登民數自生齒以上登天府孟冬祀司民獻民數於王王拜受之以圖國用進退之鄉士遂士縣士各掌其民數而糾戒令司民登萬民之數自生齒以上皆書於版三年大比以詔司㓂孟冬祀司民之日獻數于王王拜受之登于天府内史司㑹冢宰貳之小行人萬民利害為一書康樂和親安平為一書禮記内則子生三月父名之宰書而藏之告閭史閭史書為二其一藏閭府一獻州史州史獻州伯州伯命藏州府管子太史旣布憲入籍于太府周語宣王三十九年料民太原仲山父曰王治農于籍蒐于農隙耨穫亦于籍獮於旣烝狩於畢時是皆習民數者也漢高紀五年五月詔民相聚保山澤不書名數注名數謂户籍也石慶傳元封四年關東流民二百萬口無名數者四十萬注師古曰名數若今户籍孔覇傳子福還名數於魯漢提封户口見墾田郡國志注晉志通典頗不同注為一作帝王世記曰孝惠文景與民休息民衆大增至于孝平元始二年民户千三百一作二百二十三萬三千六百一十二一作六十二口五千九百一十九萬一作五十九萬四千九百七十八人多周成王四千五百四十八萬五十五人漢之極盛也光武中元二年民户四百二十七萬千六百三十四口二千一百萬七千八百二十人迄于孝和民户滋殖至孝桓頗增於前永壽二年晉志云三年户千六百七萬九百六一作九百六十口五千六萬一作五千六百四十八萬六千八百五十六人魏景元四年與蜀通計民户九十四萬三千四百二十三口五百三十七萬二千八百九十一人又案正始五年呉所領兵户凡十三萬二千但其民數不能多蜀矣昔漢永和五年南陽户五十餘萬汝南户四十餘萬方之於今三帝鼎足不踰二郡自禹至今二千餘載六代損益備於兹焉志云至于孝順民户九百六十九萬八千六百三十口四千九百一十五萬二百二十注應劭漢官儀曰永和中户至千七十八萬口五千三百八十六萬九千五百八十八又帝王世紀永嘉二年户則多九十七萬八千七百七十一口七百二十一萬六千六百三十六未詳孰是伏無忌所記毎帝最户口及墾田大數光武中元二年户四百二十七萬九千六百三十四口二千一百萬七千八百二十明帝永平十八年户五百八十六萬五百七十三口三千四百一十二萬五千二十一章帝章和二年户七百四十五萬六千七百八十四口四千三百三十五萬六千三百六十七和帝永興元年户九百二十三萬七千一百十二口五千三百二十五萬六千二百二十九安帝延光四年户九百六十四萬七千八百三十八口四千八百六十九萬七百八十九順帝建康元年户九百九十四萬六千九百十九口四千九百七十三萬五百五十循吏傳王成為膠東相流民自占八萬餘口師古曰謂自隱度其户口而著名籍也黃霸為潁川太守户口歲增元帝紀建昭二年三月户十二萬為大郡陳平傳髙帝顧問御史曲逆户口幾何對曰始秦時三萬餘户間者兵數起多亡匿今見五千户隋志漢平帝户一千二十三萬漢户籍禮司㑹注版户籍也疏漢之户籍皆以版書之宫伯注鄭司農云今時鄉户籍謂之户版漢高紀注名數謂户籍也石慶傳注名數若今户籍仲長統傳明版籍以相數閱審什伍以相連持秦獻公十年初為户籍相伍始皇十六年初令男子書年晉户口晉志劉備章武元年户二十萬口九十萬孫權赤烏五年户五十二萬二千口二百四十萬通典魏平蜀得户二十八萬口九十四萬時魏氏惟有户六十六萬三千四百二十三口有四百四十三萬二千八百八十一晉武太康元年平吳收其圖籍户五十三萬吏三萬五千兵二十三萬口二百三十萬大凡户二百四十五萬九千八百四十口一千六百一十六萬二千八百六十三此晉之極盛也傅咸傳上書曰禹分九州今之刺史幾向一倍户口比漢十分之一而置郡縣更多咸寜五年哀帝紀興寧二年正月庚戌朔大閱户人嚴法禁稱為庚戌制宋書州郡志以太康元康定户互考隋志晉太康之後文軌方同編户二百六十餘萬魏志注案晉太康三年地紀晉户有三百七十萬吳蜀户不能居半太平御覽晉令曰郡國諸户口黃籍籍皆用一尺二寸札已在官役者載名隋經籍志地理類元康六年户口簿記三卷通典宋孝武大明八年户九十萬六千八百七十口四百六十八萬五千五百一陳氏威力所加不出荆揚之域州有四十二郡唯一百九縣四百三十八户六十萬後齊户三百三萬隋大業二年志云五年户八百九十萬七千五百三一作四十六口四千六百一萬九千九百五十六隋氏之盛極於此隋志同南史荆揚二州户口居江南之半江左以來揚州為根本委荆州以閫外隋書大業五年諸郡計帳進丁二十四萬三千新附口六十四萬一千五百南齊書太祖命黃門郎虞玩之等檢定黃籍建元二年詔朝臣曰黃籍民之大紀國之治端虞玩之上表曰元嘉中光祿大夫傅隆年出七十猶手自書籍躬加隱校後魏書太和十年二月甲戌初立黨里鄰三長定民户籍蘇綽傳綽始制文案程式朱出墨入及計帳户籍之法唐開元户部帳户籍科品州縣籍通鑑開元十四年五月癸卯户部奏今歲户七百六萬九千五百六十五口四千一百四十一萬九千七百一十二十六年十二月是歲制户籍三歲一定分為九等㑹要十八年十一月敕戶籍三年一造郷别為卷總冩三通定為九等二十九年二月敕造籍令州縣長官錄事參軍勘覆為兩本送户部户武德令三萬户已上為上州五千户以上為上縣量口定州縣等第永徽顯慶開元更易不一地理志開元二十八年户部帳户八百四十一萬二千八百七十一口四千八百一十四萬三千六百九詳見采訪使㑹要武德六年三月令天下户量資產定為三等九年三月二十四日詔為九等永徽五年二月八日敕二年一定户貞元四年正月詔兩稅審定等第三年一定為常式定户等第武德六年三月令毎歲一造帳三年一造籍儀鳳二年二月二十四日敕裝潢省籍及州縣籍天寳三載二月二十五日制天下籍造四本京師東京尚書省户部各貯一本十二載正月十二日敕東京停籍帳大中九年閏四月以州縣差役不均每縣作差科簿送刺史書訖鎖於令㕔闕證聖元年李嶠上表曰天下流散非一宜令御史督察設禁令以防之垂恩德以撫之施權衡以御之為制限以一之逃户建中元年十二月定天下兩税户凡三百八十萬五千七十六户口數貞元三年五月詔諸州户口減耗三分去二亦合省官元和二年十二月李吉甫等撰元和國計簿十卷見定戶二百四十四萬二百五十四十五道七十一州不申户口數率以兩户資一兵雜錄六典天下之户定為九等定户以仲年造籍以季年州縣籍留五比省籍留九比通鑑武德四年九月己卯詔括天下户口列傳楊瑒為户部侍郎玄宗嘗召宰相大臣議天下户版延英殿瑒言利病尤詳崔瓘為澧州刺史增户數萬詔進五階以寵異政楊炎為相初定令有租賦庸調法自開元承平久不為版籍而户部歲以空文上之天寳中王鉷為户口使以籍存而丁不在乃按舊籍除當免者積三十年責其租庸炎疾其敝請為兩税法户無主客以見居為簿人無丁中以貧富為差歲終以户賦増失進退長吏天下利之版籍不造而得其虛實李方玄為池州刺史鉤檢户籍差量徭賦皆有科品條章吏不得私常曰沈約年八十手冩簿書蓋為此云唐歴代户口數㑹要貞觀二十年太宗問民部侍郎盧承慶歴代户口多少之數承慶叙夏殷迄周隋皆有依據貞觀初户不滿二百萬永徽三年七月二十二日丁丑通典云元年上問户部尚書髙履行去年進户多少奏進户一十五萬因問隋有幾户奏隋開皇中户八百七十萬今户三百八十萬永徽去大業末三十六年户武德初二百餘萬顯慶二年十月上幸許汝州問中書令杜正倫曰隋有幾户奏如前開元九年正月二十八日御史宇文融請檢察逃户二月乙酉詔作招携法丁亥融充使奏置勸農判官長安尉裴寛等二十九人並攝御史分往天下檢責田疇招携户口皇甫景楊相如上疏以為煩擾不便寛等使還得客户八十餘萬田亦稱是十二年八月融除中丞充安輯户口使二十年户七百八十六萬一千二百三十六口四千五百四十三萬一千二百六十五天寳元年户八百三十四萬八千三百九十五口四千五百三十一萬一千二百七十二十四載户八百九十一萬四千七百九口五千二百九十一萬九千三百九此唐之極盛也通典自武德初至天寳末凡百三十八年可以比崇漢室而人户纔比於隋氏天寳中編户九百餘萬肅宗乾元三年見到帳百六十九州户百九十三萬三千一百三十四至大厯中唯有百三十萬户建中初命黜陟使往諸道按比户口得主户百八十餘萬客户百三十餘萬共三百二十萬六六典凡天下之户八百一萬八千七百一十口四千百二十八萬五千二百六十一開元二十二年數建隆版籍至道版籍式天禧計帳元年十月有司請據諸道版籍數升降天下縣望以四千户以上為望三千户以上為緊二千户以上為上千户以上為中不滿千户為中下仍三年一責户口之籍别定升降從之凡縣望五十户二十八萬一千六百七十緊六十七户二十二萬八千六百九十三上縣八十九户二十萬八千二百八十中縣一百一十五户一十七萬九千三十中下縣一百十户五萬九千七百七十總九十六萬七千五百五十三户此國初版籍之數也曾鞏曰太祖元年有州一百十一縣六百三十戶九十六萬七千三百五十三末年州二百九十七縣一千八百六户二百五十萬八千九百六十五乾德元年即建隆四年十月庚辰詔天下造版籍及户帖户鈔詔曰蕭何入關先取圖籍沈約為吏手冩簿書十二月初置形勢税簿至道元年六月己卯詔重造天下郡縣二税户口版籍攽其式於天下景德二年五月度支判官黃世長請令三司歲較耗登以聞興國二年閏七月丁巳有司上諸州所貢閏年圖故事天下貢地圖版籍以閏為限咸平五年四月壬午詔三司以天下户口數置籍較定以聞景德四年七月實錄丙子三司使丁謂言景德三年新收户三十三萬二千九百九十八流移者四千一百五十總七百四十一萬七千五百七户一千六百二十八萬二百五十四口比咸平六年增五十五萬三千四百十户三百萬二千二百十四口賦入總千三百七十三萬一千二百二十九貫石匹斤比咸平六年増三百四十六萬五千二百九十請以咸平六年户口賦入為額歲校其數上史館從之祥符二年六月乙酉攽招携户口旌賞條制天禧二年六月丙辰三司言毎歲帳籍省九萬餘道三十四萬五千二百餘紙詔三司諸路計帳毋得增益以滋煩擾天聖元年十一月詔閏年所供實行版簿空文煩擾宜停之止以空行版簿催科明道二年十月庚子詔天下閏年造五等版簿先錄示之不實者聽民自言皇祐元年四月丁亥右司諫錢彦逺上勸農疏曰唐開元户八百九十餘萬而定墾田一千四百三十餘萬頃今國家户七百三十餘萬而定墾田二百一十五萬餘頃逃廢之田不下三十萬頃是田疇不闢㳺手多也宜置勸農司以墾田頃畆户口陂塘山澤溝洫桑柘著籍歲終轉運考較賞罰之上嘉納開寳形勢版簿四年正月詔諸州置形勢版簿熈寧四年四月曾孝寛奏罷之七月九日尋以産税錢均定免役錢併罷五等户簿五年六月一日今州縣版簿皆保甲簿也自以保甲催科而民始大困寳元歴代户數寳元二年正月壬寅編修院與三司上歴代天下户數前漢千二百二十三萬三千六十二後漢千六百七萬七千九百六十魏九十四萬三千四百二十二晉二百四十五萬九千八百宋九十六萬六千八百七十後魏二百三十七萬五千三百六十八北齊三百三萬二千五百二十八後周三百五十萬隋八百九十萬七千五百三十六唐九百六萬九千一百五十四太祖朝二百五十萬八千九百六十五太宗朝三百五十七萬四千二百五十七真宗朝八百六十五萬九千七百九十九寳元元年一千一十一萬四千二百九十先是上御邇英閣讀正說養民篇見歴代户口登耗之數顧謂侍臣曰今天下民籍幾何梅詢對曰先帝所作蓋謂恭儉有節則户口充羡賦斂無度則版籍衰減自五代之季生齒彫耗太祖受命而太宗真宗繼聖承祧休養百姓今天下户口倍於前矣因詔三司及編修院檢閱以聞至是上之是歲天下主户六百四十七萬九百九十五口千四百三十九萬九千九百五客户三百七十萬八千九百九十四口六百十九萬五千四百二英宗治平三年天下户一千二百九十一萬七千二百二十一口二千九百九萬二千一百八十五神宗元豐六年户一千七百二十一萬一千七百十三口二千四百九十六萬九千三百哲宗元祐六年户一千八百六十五萬五千九十三口四千一百四十九萬二千三百一十一徽宗大觀二年户増十二萬四千一百七十三口十九萬二千四十六髙宗紹興三十二年户一千一百十三萬九千八百五十四口三千三百十一萬二千三百二十七孝宗乾道元年户一千一百七十萬五千六百六十二口二千五百十七萬九千一百七十七光宗紹熙元年户一千二百三十五萬五千八百口二千八百五十萬二百五十八嘉祐户口國史志天禧末天下户六百三萬九千三百三十一而客户不預焉嘉祐八年合主客户一千二百四十六萬二千三百十一口二千六百四十二萬一千六百五十一治平三年戸增四十五萬四千九百一十口增二百六十七萬五百三十四開寳末天下户三百九萬五百四至道末户四百十三萬二千五百七十六天禧末戸六百三萬九千三百三十一客户不預役出民乾興初始立限田法自是數下詔督州縣長吏與轉運使議蠲冗役以寛民力景祐中稍欲寛里正牙前之法命三司議慶厯中下令京東西河北陜西河東裁損役人皇祐中韓絳蔡襄論江南福建之弊絳請行鄉户五則之法襄請以産錢多少定役重輕至和中命與三司置司參定因行五則法時益欲去民疾苦置寛䘏民力司遣使四出自是州縣力役多所裁損凡省二萬三千六百二十二人鄉五家為比五比為閭四閭為族五族為黨五黨為州五州為鄉遂五家為鄰五鄰為里四里為鄼五鄼為鄙五鄙為縣五縣為遂軍五人為伍五伍為兩四兩為卒五卒為旅五旅為師五師為軍井牧九夫為井四井為邑四邑為丘四丘為甸四甸為縣四縣為都古不料民而知其多少所謂易以知險簡以知阻也掌二十五家閭胥里宰掌百家族師鄼長掌五百家黨正鄙師掌二千五百家州長縣師掌萬二千五百家鄉師鄉大夫鄉士師遂人遂大夫遂遂士尚書大傳古者處師八家而為鄰三鄰而為朋三朋而為里五里而為邑十邑而為都十都而為師州十有二師焉家不盈三口者不朋由命士以上不朋洛誥帝或云黄法鶡冠子五家為伍十伍為里四里為扁扁為之長十扁為鄉其上為縣為郡周書大聚云五户為伍以首為長十夫為什以年為長王若欲來天下之民先設其利而民自至譬若冬日之陽夏日之隂不召而民自來中論民數篇先王制六鄉六遂之法所以維持其民也陸贄曰古之王者設井田之法以安其業立五宗之制以綴其恩猶懼其未也又教之族墳墓敬桑梓因人之志定人之居又督以出鄉遊惰之禁糾以版圗比閲之方通典曰古之為理在周知人數乃均其事役周官有比閭族黨鄉遂之制維持其政綱紀其人孟冬獻民數于王王拜受之其敬之守之如此其重也及理道乖方版圗脱漏人如鳥獸飛走莫制家以之乏國以之貧縣縣萬戸以上為令子國也千户為長男國也黃恭云周百縣説文周制天子地方千里分為百縣縣有四郡故春秋傳曰上大夫受縣下大夫受郡是也至秦初置三十六郡以監其縣史記正義引風俗通云同上陳氏曰周官有在鄉之縣有在遂之縣有閒田之縣故王畿謂之縣漢聞喜縣志河東郡聞喜故曲沃秦改為左邑武帝元鼎六年行過更名漢獲嘉縣志河内郡獲嘉故汲之新中鄉武帝行過更名見前本朝天聖四年以懷州獲嘉隷衛州漢新豐縣志京兆新豐秦曰驪邑高祖七年置應劭曰大上皇思東歸高祖改築城寺街里以象豐徙豐民以實之故號新豐潘岳西征賦摹寫舊豐制造新邑故社易置枌榆遷立街衢如一庭宇相襲注引三輔舊事西京雜記漢破羌縣志金城郡破羌縣神爵二年置晉懷徳縣元帝紀太興三年七月丁亥詔先公武王先考恭王臨君琅邪四十餘年惠澤加百姓遺愛結人情朕創基江表兆庶宅心繦負子來琅邪國人近有千户在此今立為懷徳縣統丹陽郡優復之科一依漢氏沛及南頓故事成帝咸康元年立南琅邪郡唐平陸縣見銘類唐明堂縣見明堂㑹要京兆府萬年縣總章元年析置明堂縣以鄧惲為令長安二年六月二日廢涇州鶉觚縣天寳元年八月二十四日改為靈臺縣河南府河南縣垂拱二年改為合宫縣神龍元年正月復舊紀總章元年二月己夘分長安萬年置乾封明堂二縣分理於京城之中太平興國平晉縣九域志建隆二年以太原府晉陽縣建平晉軍興國四年廢為平晉縣太原府初降為州嘉祐四年復為府大中祥符奉符縣元年十月丁未法駕入乾封縣奉髙宫辛亥享天於圜臺太祖太宗並配壬子祭地祇禪社首癸丑御朝覲壇受朝賀大赦改乾封縣為奉符縣兖州慶厯中范仲淹執政謂天下縣多故役蕃而民瘠首廢河南府諸縣欲以次及他州當時以為非是未幾悉復風俗通周禮百里曰同所以奬王室協風俗尚書大傳五里為邑春秋正義周禮四甸為縣縣方二十里周書作雒篇千里百縣方千里者為方百里者百縣方百里則出車百乗晉有四十縣遺守四千乗是縣别有百乗與作雒之言合玉海卷二十
