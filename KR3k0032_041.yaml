body:
  text: 玉海卷四十一宋王應麟撰藝文續春秋又見編年古者謂史記為春秋後世有所著述多托春秋之名其屬辭比事不與春秋相似非史䇿之正也夏殷春秋史通案汲冢璅語記太丁時事目為夏殷春秋後漢注竹書紀年曰太丁四年七年十一年云云璅語又有晉春秋記獻公十七年事竹書紀年其所記事皆與魯春秋同孟子曰晉乘楚檮杌魯春秋其實一也故墨子曰吾見百國春秋汲冢所得書尋亦亡逸今惟紀年瑣語師春在焉隋志古文璅語四卷汲冢書春秋正義水經注引瑣語周春秋周語注周春秋曰云云晏子春秋史記晏平仲嬰萊之夷維人事齊靈莊景公以節儉力行重於齊太史公曰吾讀晏子春秋漢志儒家晏子八篇名嬰相齊景公隋志唐志同儒家晏子春秋七卷晏嬰家為儒之首書目十二卷崇文目同或以為後人采嬰行事為書故卷頗多於前志晁氏志著其行事及諫諍之言昔司馬遷讀而髙之而莫知其所以為書或曰晏子之後為之柳宗元辨曰疑其墨子之徒有齊人者為之言問棗及古冶子等尤怪誕後之錄諸子書宜列之墨家非晏子為墨也為是書者墨之道禮記投壺注引晏子春秋呂氏春秋呂覽史記吕不韋傳始皇初不韋為相食客三千人是時諸侯多辨士如荀卿之徒著書布天下吕不韋乃使其客人人著所聞集論以為八覽六論十二紀二十餘萬言髙誘云訓解各十餘萬言以為備天地萬物古今之事號曰吕氏春秋布咸陽市門懸千金其上延諸侯遊士賓客有能增損一字者與千金時人無一能損增其書諸侯年表吕不韋秦莊襄王相亦上觀尚古刪拾春秋六國事以為八覽六十三篇六論三十六篇十二紀凡六十一篇為吕氏春秋不韋春秋成于始皇八年曰維秦八年嵗在涒灘秋甲子朔日良人請問十二紀此其書成之嵗月也漢書司馬遷傳不韋遷蜀世傳吕覽注蘇林曰吕氏春秋篇名八覽藝文志雜家吕氏春秋二十六篇注秦丞相不韋輯智畧士作唐志雜家吕氏春秋二十六卷髙誘注髙誘序曰以道徳為標的以無為為紀綱以忠義為品式以公方為檢格與孟軻荀卿淮南揚雄相表裏也為之解以述古儒之㫖凡十七萬三千五十四言書目是書凡百六十篇以月紀為首故以春秋名書十二紀篇首與月令同禮運注吕氏説月令而謂之春秋事類相近焉虞氏春秋史記諸侯年表又虞卿有傳趙孝成王時其相虞卿著書上採春秋下觀近世曰節義稱號揣摩政謀凡八篇以刺譏國家得失世傳之曰虞氏春秋太史公曰虞卿非窮愁不能著書以自見於後世漢志春秋有虞氏微傳二篇趙相虞卿儒家虞氏春秋十五篇史記八篇志十五篇未詳李氏春秋二篇孔叢子虞卿著書名曰春秋魏齊曰無然也春秋孔聖所以名經也今子之書大抵談說而已亦以為名何答曰經者取其常事也可常則為經矣且不為孔子其無經乎齊問子順曰魯之史記曰春秋春秋因以名焉又晏子之書亦曰春秋注虞卿遊說之士為趙孝成王上卿後與魏齊間行去趙困於大梁不得志乃著書云云語出本傳史通晏子虞卿吕氏陸賈其書篇第本無年月而亦謂春秋呉越春秋越絶書後漢趙曄傳著吳越春秋詩細厯神淵蔡邕至會稽讀詩細而歎息以為長於論衡邕還師傳之學者咸誦習焉晉書楊方補髙梁涼太守在郡積年著五經鉤沈更撰吳越春秋并雜文行於世隋志雜史類吳越春秋十二卷趙曄撰吳越春秋削繁五卷楊方撰唐志云削煩吳越春秋十巻皇甫遵撰唐志云吳越春秋傳吳越記六卷越絶相承以為子貢所作本志越絶記十六卷子貢撰唐志同中興書目十五巻十九篇周禮疏引越傳絶後漢書注引越趙曄又為吳越春秋其屬辭比事皆不與春秋史記漢書相似蓋率爾而作非史策之正也中興書目吳越春秋十卷内吳外越以紀其事吳起太伯止闔閭越起無余止勾踐崇文目越絶書有内紀八外傳十七文題舛缺纔二十篇書目或云子貢子胥然載春申君及紀年至建武二十八年疑後人續成今存十九篇十五卷第一卷荆平王内傳二外傳記吳地三吳内傳四計倪内經五請糴内傳六外傳策考七外傳記范伯内傳陳成恒八外傳記地傳九外傳計倪十外傳記吳王占夢十一外傳記寳劒十二内經九術外傳記軍氣十三外傳枕中十四外傳春申君徳序外傳十五篇叙外傳第一巻有越絶外傳本事一篇此其為十六巻歟魯後春秋唐志雜史劉允濟魯後春秋二十卷劉允濟傅中宗時遷著作佐郎采魯哀公後十二世接戰國為魯後春秋獻之允濟嘗曰史官善惡必書使驕主賊臣懼此權顧輕哉而班生受金陳壽求米僕乃視之如浮雲耳戰國春秋北齊書李槩撰戰國春秋及音譜隋志戰國春秋二十卷李槩撰古史及霸史偽舊志編年唐志史左史六卷李槩撰雜史楚漢春秋後班彪傳漢興定天下太中大夫陸賈記錄時功作楚漢春秋九篇藝文志春秋家楚漢春秋九篇陸賈所記隋志雜史楚漢春秋九卷陸賈撰述誅鋤秦項之事司馬遷述楚漢春秋接其後事漢春秋明帝紀永平十五年祠仲尼注漢春秋曰帝時升廟立群臣中庭北面皆再拜帝進爵而後坐志元和八年祠孔子注漢晉春秋曰闕里仲尼之故宅云云光武紀建武五年注案范曄序例云帝紀畧依春秋唯孛彗日食地震書餘悉備於志司馬遷傳太史公注如淳曰漢儀注太史公武帝置位在丞相上天下計書先上太史副上丞相序事如古春秋晁錯䇿刻於玉版藏於金匱厯之春秋楊惲傳天陰不雨此春秋所記夏侯君所言也注張晏曰漢史記勝所言故曰春秋所記叙傳為春秋考紀東漢之初春秋之名尚存王命論垂䇿書於春秋注師古曰史書記事之總稱唐志雜史孔衍漢春秋十卷後漢春秋六卷袁曄獻帝春秋十卷魏志注引袁曄獻帝春秋國史志胡旦漢春秋百卷問答一卷因四百年行事立褒貶以擬春秋淳化五年旦自言願給借館吏繕寫帝曰褒貶出於胸臆豈得容易流傳祥符三年謝泌又為言敕襄州給紙寫天聖中獻之仁宗稱歎遷旦秘書監漢晉春秋見編年漢魏春秋晉習鑿齒傳為滎陽太守在郡著漢晉春秋起漢光武終晉愍帝於三國之時蜀以宗室為正魏武雖受漢禪晉尚為簒逆至文帝平蜀乃為漢亡而晉始興凡五十四卷唐志同隋志漢魏春秋九卷孔舒元撰蜀魏志注引孔衍漢魏春秋漢晉陽秋四十七卷訖愍帝習鑿齒撰魏氏春秋晉陽秋晉孫盛傳篤學不倦著魏氏春秋隋志二十巻古史晉陽秋隋志二十三卷迄哀帝一作三十二卷詞直理正咸稱良史直書枋頭之事桓溫見之怒其子請刪改之盛不可子遂私改之太元中孝武博求異聞始得别本於遼東考校多不同書遂兩存書目晉陽秋孫盛撰隋志本二十二卷今止存宣帝一卷懷帝下一卷唐人所書康帝一卷餘亡盛不名春秋而曰陽秋者避鄭太后名也唐志編年類孫盛魏武春秋二十卷鄧粲晉陽秋三十二卷本傳粲著元明紀十篇檀道鸞晉春秋二十卷隋志云續晉陽秋雜史類孫壽魏陽秋異同八卷王韶之私撰晉安帝陽秋除著作佐郎使續後事訖義熙九年善叙事辭論可觀為後代佳史三國春秋唐志雜史員半千三國春秋二十卷崔良佐三國春秋卷亡良佐深州安平人日用從子門人諡曰貞文孝父晉九州春秋隋志雜史九州春秋十卷司馬彪撰記漢末事唐志九卷書目紀漢末州郡之亂司冀兖徐青荆揚涼幽九州各一篇司馬彪髙陽王睦之長子專精學術泰始中為秘書丞注莊子作九州春秋三國志引之吳志注臣松之案太康八年廣州大中正王範上交廣二州春秋玄晏春秋舊唐志雜傳玄晏春秋二卷皇甫謐撰晉皇甫謐傳謐自號玄晏先生撰玄晏春秋重於世任子春秋晉杜夷傳兄崧字行髙有志節惠帝時俗多浮偽著任子春秋以刺之晉春秋後語史通孔衍字舒元以戰國䇿所書未為盡善乃引太史公所記參其異同刪彼二家聚為一錄號為春秋後語除二周及宋衞中山所留者七國而已始自秦孝公終於楚漢之際比於春秋亦盡二百四十餘年行事始衍撰春秋時國語復撰春秋後語勒成二書各為十卷今行世者唯後語存焉書目十巻唐志雜史孔衍春秋時國語春秋後國語各十卷漢春秋十卷後漢春秋六巻後魏春秋九卷通鑑外紀引後語晉春秋後傳史通晉著作郎樂資采二史撰為春秋後傳其書始於周貞王續前傳魯哀以後至王赧入秦又以秦文王繼周終於二世合作三十卷唐志同卷隋志三十一雜史隋志雜史何承天春秋前傳十卷唐志同前雜傳九卷唐志前傳雜語十卷水經注引春秋後傳十六國春秋北史後魏崔鴻以劉元海石勒慕容儁符健慕容垂姚萇慕容徳赫連屈孑張軌李雄吕光乞伏國仁秃髮烏孤李暠沮渠蒙遜馮䟦等並因世故跨僭一方各有國書未有統一鴻乃撰為十六國春秋勒成百卷因其舊記時有增損褒貶鴻二世仕江左故不錄晉劉蕭之書稽以長厯考諸舊志又别作序例一卷年志一卷凡一百二卷隋志霸史崔鴻撰十六國春秋一百卷唐史偽史類一百二十巻國史志鴻書世有二十餘卷舊志乃五十卷蓋獻書者妄分篇第晁說之曰司馬公休言溫公所考十六國春秋非崔鴻全書三十國春秋隋志古史三十國春秋三十一卷梁湘東世子蕭方等撰唐志偽史類蕭方三十國春秋三十卷武敏之三十國春秋一百卷舊志同蔡允恭後梁春秋十卷中興書目三十卷方等採削諸史以晉為主附列漢劉淵以下二十九國又上取吳孫皓事起宣帝迄恭帝又三十國春秋鈔一卷晉春秋畧唐志編年杜延業晉春秋畧二十卷中興書目唐祕書省正字杜公業撰唐志作延業并序起晉宣帝迄恭帝一百五十六年以後魏崔鴻撰十六國春秋尚未究盡梁蕭方等著三十國春秋以晉為主附列二十九國採集為廣遂加刪緝號曰晉春秋畧凡一百八萬餘言宋春秋齊春秋隋志古史宋春秋二十巻梁吳興令王琰撰齊春秋三十卷梁奉朝請吳均撰唐志編年類鮑衡卿宋春秋二十卷王琰二十卷吳均齊春秋三十卷裴子野欲撰齊梁春秋草創未就文中子元經元經五十篇列為十五卷自獲麟後歴秦漢至後魏著紀年之書謂之元經薛收傳阮逸注中說天下無賞罰三百載元經得不興乎薛收曰始於晉惠何也曰元經褒貶以代賞罰董常曰夫子以元經為賞罰子述元經皇始之事歎焉後魏初年叔恬曰蓋歎命矣子謂叔恬曰春秋元經於王道是輕重之權衡曲直之繩墨也子曰元經其正名乎皇始之帝徵天以授之也晉宋之王近於正體於是乎未忘中國齊梁陳之徳斥之於四夷也以明中國之有代太和之力也曰元經興而帝制亡矣元經其衰世之意乎義直而微言曲而中董常曰元經之帝元魏自文帝太和元年皇始之授魏而帝晉何也子曰云云曰元經以人事終故止於陳亡書陳亡而具五國褒貶不及仁壽元經抗帝而尊中國正厯數則斷南北感帝制而守太熙尊中國而正皇始紀年書帝春正月宋始以晉系正統自劉立國始進魏於經而南北並列終也遂黜齊而進魏垂符堅淝水之役不書曰為謝玄所敗而書曰為慕容所敗春秋誅心之法也桓溫之卒不具官為晉誅惡也皇甫湜曰天闡元經續為元經繼之尼父中興書目元經薛氏傳十五卷阮逸學始於晉帝終於陳亡如春秋經傳之體疑此非通本書唐春秋又見編年志編年類吳兢唐春秋三十卷韋述三十卷陸長源六十卷吳兢傳景龍間任史事時武張監領事多不實兢不得志私撰唐書唐春秋未就至開元中匄官筆札冀得成書詔兢就集賢院論次後貶荆州司馬以史草自隨蕭嵩領國史遣使者就兢取書得六十餘篇李元紘傳初左庶子吳兢為史官譔唐書及春秋未成後上書請畢其功詔許就集賢成書張說致仕詔在家修史元紘因言國史記人君善惡王政損益褒貶所繫前聖尤重今國大典分散不一且太宗别置史館禁中祕嚴之也請勒說以書就館參會譔錄詔可會要開元十四年七月六日左庶子吳兢奏臣潛心積思别撰唐書九十八卷集賢注記云一百巻唐春秋三十巻用藏私室歴二十餘年尚刋削未就於是彌綸舊紀重加刪緝雖文則不工而事皆從實斷自隋大業十三年迄于開元十四年春三月即皇家一代之典盡在斯矣詔兢就集賢院論次俄令就史館其書未就兢遷荆州司馬上令中使往荆州取得五十餘巻記事疏略韋述傳舉進士時方少考功宋之問曰童子何業述曰性嗜書所撰唐春秋三十篇未畢他唯命之問曰本求茂才乃得遷固遂上第國史志陸長源唐春秋今存十八卷孫氏西齋錄孫樵長源唐春秋乃編年雜錄掇其切峭獨可示懲勸自為十八通書號孫氏西齋錄宋朝趙瞻著唐春秋五十卷五代春秋書目五代春秋一卷尹洙撰國史志雜史王軫五朝春秋二十五卷論語漢世通謂論語孝經為傳書序言及論語孝經程子曰論語之書成於有子曾子之門人故其書獨二子以子稱論語䜟曰子夏六十四人共撰仲尼微言鄭康成曰仲弓游夏等撰定正義曰以口相傳授故經焚書而獨存漢十二家論語藝文志論語十二家二百二十九篇論語古二十二篇出孔子壁中兩子張如淳曰分堯曰篇後子張問何如可以從政已下為篇名曰從政分堯曰下章子張問以為一篇其篇次又不與齊魯同新論云文異者四百餘字齊二十二篇多問王知道其二十篇中章句頗多於魯論魯二十篇傳十九篇齊說二十九篇魯夏侯說二十一篇魯安昌侯說二十一篇張禹魯王駿說二十篇王吉子燕傳說三卷議奏十八篇石渠論孔子家語二十七卷孔子三朝七篇孔子徒人圖法二卷論語者孔子答弟子時人及弟子相與言而接聞於夫子之語也漢興有齊魯之說傳齊論者昌邑中尉王吉何晏序又有琅邪王卿少府宋畸御史大夫貢禹尚書令五鹿充宗膠東庸生唯王陽名家傳魯論者常山都尉龔奮長信少府夏侯勝丞相韋賢序云及子玄成魯扶卿前將軍蕭望之安邑侯張禹皆名家張氏最後而行於世魯論傳於學官二論廢亡何晏序論語孔子弟子記諸善言也張禹本受魯論兼講齊說善者從之號曰張侯論為世所貴包氏周氏章句出焉古論唯博士孔安國為之訓解而世不傳順帝時南郡太守馬融亦為訓說漢末大司農鄭玄就魯論篇章考之齊古為之注故司空陳羣太常王肅博士周生烈皆為義說晏集諸家為解邢昺疏張禹擇齊魯之善而為論鄭玄考齊古之長而為注孝文置論語博士平帝詔召通知論語者駕一封軺傳詣京師唐薛放曰漢時論語首立學官光武令虎賁士皆習孝經說文逸論語曰玉粲之璱兮其璵猛也如玉之瑩文選注逸論語曰如玉之瑩初學記逸論語曰璠璵魯之寳玉也春秋正義論語哀公問主於宰我案古論語及孔鄭皆以為社主張包周等並為廟主家語孔安國為古文論語訓二十一篇孝經傳二篇魯讀論語釋文傳不習乎鄭注云魯讀傳為專今從古案鄭校周之本以齊古讀正凡五十事鄭本或無此注然皇覽引魯讀六事則無者非也崔子魯讀崔為髙未嘗無誨魯讀為悔五十以學易魯讀易為亦正唯弟子不能學也魯讀正為誠魯讀坦蕩為坦湯冕衣裳者鄭本作弁云魯讀弁為絻今從古瓜祭魯讀瓜為必賜生魯讀生為牲車中不内顧魯讀車中内顧詠而歸鄭本作饋魯讀饋為歸仍舊魯讀仍為仁折獄魯讀折為制小慧魯讀慧為惠古之矜也廉魯讀廉為貶魯讀躁為傲窒為室歸孔子豚鄭本作饋魯讀為歸天何言哉魯讀天為夫不知命無以為君子也魯論無此章今從古漢尚書論語説漢尚書傳見尚書蕭望之傳從勝問論語禮服後以授太子漢易論語大義論語章句張禹傳從沛郡施讐受易琅邪王陽膠東庸生問論語皆明習諸儒曰欲為論念張文甘露中諸儒薦禹有詔太子太傅蕭望之問禹對易及論語大義望之善焉奏禹經學精習有師法可試事奏寢久之試為博士初元中授太子論語禹為成帝師以上好論語難數對己問經為論語章句獻之後儒林傳包咸建武中入授太子論語又為章句何休注訓孝經論語沛王輔傳善說孝經論語傳漢鄭玄注論語論語釋義晉論語注讚唐志鄭玄注論語十卷又注論語釋義十巻隋志論語九卷鄭玄注晉散騎常侍虞喜讚梁有古文論語十卷鄭玄注又王肅虞翻譙周等注論語各十卷亡鄭玄以張侯論為本參考齊古而為注齊論亡古論先無師說梁陳唯鄭玄何晏立國學而鄭甚微周齊鄭學獨立隋何鄭並行鄭氏盛於人間北史鄭玄論語序云書以八寸䇿誤作八十宗徐遵明曲為之說春秋正義鄭玄注論語序以鉤命決云春秋二尺四寸書之孝經一尺二寸書之故知六經之䇿皆稱長二尺四寸聘禮疏鄭作論語序云易詩書禮樂春秋䇿皆二尺四寸孝經謙半之論語八寸䇿者三分居一又謙焉是其䇿之長短鄭注尚書三十字一簡之文服䖍注左氏云古文篆書一簡八字是其簡之字數魏論語集解唐志何晏集解十卷隋志同孫綽集解十卷盈氏集義江熙集解各十卷晉鄭冲傳與孫邕何晏曹羲荀凱等共集論語諸家訓注之善者義有不安者輒改易之名集解正義集孔安國包咸周氏不詳何人馬融鄭玄陳群王肅周生烈之說兼以己意為集解正始中上之包周就張侯論為訓解宋朝周式撰集解辨誤十卷又有續辨誤一卷附其後吳志虞翻為老子論語國語訓注晉論語集注集解隋志集注六巻太保衞瓘注江熙孫綽集解皆十卷李充注十卷唐志宋明帝補衞瓘注十卷隋志云論語補闕二巻晉論語集義㫖序體畧隋志集義八巻晉左中兵郎崔豹集梁十卷解唐志崔豹大義十巻盈氏集義十巻體畧二卷太傅主簿郭象撰㫖序三卷晉衞尉繆播撰唐志二巻釋疑三卷王弼撰又釋疑十卷晉尚書郎欒肇撰集注六卷晉八巻晉大尉衞瓘注有太史叔明集解陶弘景集注各十巻虞喜新書對張論十巻梁論語疏唐志皇侃疏十巻邢昺以為援引不經詞意淺陋褚仲都講疏十卷賈公彦疏十卷中興書目梁國子助敎皇侃以何晏集解去取為疏十卷又列晉衞瓘繆播欒肇郭象蔡謨袁宏江厚蔡奚李充隋志十卷孫綽周懷范甯王珉等十三人爵里于前云此十三家是江熙所集其解釋於何集無妨者引取以廣異聞隋志宋張畧等疏八卷褚仲都義疏皇侃義疏劉炫述義本傳述義各十卷徐孝克講疏文句義五巻張冲義疏二卷南史張譏孝經義八巻論語義二十巻國史志皇侃疏雖時有鄙近然博極群言補諸家之未至為後學所宗咸平中詔邢昺刋定正義論語圖隋志梁有論語義注圖十二卷亡古論語義注譜一卷徐氏撰唐志同唐三十家論語志經錄八曰論語三十家三十七部三百二十七卷失姓名三家始於鄭玄注釋義終於賈公彦疏為注釋者有鄭玄王弼王肅李充梁覬孟釐袁喬尹毅張氏暢惠明宋明帝欒肇崔豹劉炫為集解集義者有何晏孫綽盈氏江熙為講疏者有皇侃褚仲都賈公彦又有徐氏之譜虞喜之贊繆播㫖序郭象體畧戴詵述議徐邈之音王勃之次論語及家語十卷孔叢七巻篇目弟子一卷附焉不著錄二家十二卷韓愈注十卷張籍注辨二卷隋志六典同論語并五經異義等七十二部七百八十一卷崇文目十三部二百十卷中興目二十三家一百八十一卷續目十六家一百三十三卷唐論語筆解書目二十卷題韓愈撰唐志韓愈注論語十巻皇朝許勃為序其問翺曰者蓋李習之同與琢磨非獨韓製此書也宋咸增注論語十巻序云韓愈注論語與筆解大槩多竊先儒義而遷易其辭因擇二書是否并舊注未安辨正焉劉正叟謂筆解皆後人之學托韓愈名以求行徒坫前賢悉無所取為重注十巻以袪學者之惑唐次論語志王勃次論語十卷咸平論語正義見孝經書目論語正義十卷翰林侍講學士邢昺等撰咸平中頒其書於章句訓詁名器事物之際詳矣元祐論語要義見孝經論語説蘇軾子瞻說謫居黄州時所為大觀間弟轍子由辨正其義有未安者二十七章謂之拾遺范祖禹醇夫說元祐中所進數引劉敞程頤之說程頤正叔解門人記其師所解謝良佐顯道解師程正叔吕大臨與叔解與叔雖程氏之徒解經不盡用師說尹焞彦明解紹興中為崇政殿說書被㫖訓解楊時中立注游酢定夫解皆程氏門人王鞏定國注秦少游序汪革信民直解紹聖中禮部試第一王安石介甫解王雱口義葉夢得少蘊釋言張栻敬夫說以上各十巻張九成解二十巻胡宏指南一卷胡寅詳說洪興祖說謂此書始於不慍終於知命蓋君子儒吳棫續解考異說例十二卷曾幾撰義二卷薛季宣少學鄒補之贅解紹興論語解義三十二年三月己未刑部侍郎兼侍講黄祖舜進論語解義詔給事中金安節等看詳安節等言詞義明粹令國子監板行賜詔奬諭胡宏指南評論黄祖舜沈大廉之說八年四月戊寅詔尹焞解論語書成賜六品服十三年正月二十四日王普進父賔講論語口義送史館淳熙論語孟子集注或問朱文公熹撰淳熙四年六月癸巳成初編次集義輯二程之說又取張范二吕希哲大臨謝游楊侯仲良尹氏九家初名要義改名精義最後名曰集義三十四巻又本注疏參釋文會諸老先生之說間附所聞於師友得於心思者為詳說舊名訓蒙口義既而約其精粹為集注十巻又疏其所以去取之意為或問十卷其後集注刪改日益精密而或問不復釐正故其去取間有不同者黄氏曰朱子集注於一字未安一語未順覃思靜慮更易不置或一二日而未已用心如此學者顧以易心讀之安能得聖人之意哉朱子言三十始為集注至老改猶未已非草草看者陳氏曰集注遍閲諸家說雖一句一字皆為抄掇旋加磨刮翦繁趍約不啻數百過又曰學者須專事集注為標凖復讀饜飫胸中已有定見然後參以集義方識諸家是非得失始知集注明潔親切辭約而㫖富義精而味長信為萬世不刋之書黄榦撰論語通釋十卷輔廣論語答問魏了翁要義編疏論語二十卷孟子十四卷淳熙論語拾遺五年六月九日軍器少監張𤭔上二十篇付秘閣孔子家語孔叢孔志孔子弟子目録孔氏古文弟子籍漢志論語家孔子家語二十七巻注師古曰非今所有家語隋志孔子家語二十一卷王肅解梁有家語三巻魏博士張融撰亡孔叢七卷陳勝博士孔鮒撰梁有孔志十巻梁太尉參軍劉被撰亡孔子弟子目錄一卷鄭玄撰孔叢家語並孔氏所傳之㫖唐志王肅注孔子家語十卷舊志云王肅撰孔叢七卷論語篇目弟子一卷書目家語十卷王肅注孔叢一名盤盂取其事維也家語今自相魯至曲禮公西赤問四十四篇漢元封中孔安國集錄孔子十一世孫孔叢今自嘉言至答問二十一篇為六卷集仲尼子思子上子髙子順之言以為孔鮒子魚所作孔臧又以所為賦與書謂之連叢上下篇為一卷合為二十三篇附于末嘉祐四年三月宋咸注上之史記太史公曰弟子籍出孔氏古文近是余以名姓文字取論語弟子問并次為篇自子石已右三十五人有年名及受業聞見于書傳其四十二人無年及不見書傳紀于左冉季至公西蒧索隠家語此例唯有三十七人其公良孺秦商顔亥叔仲會四人家語有事迹史記闕自公伯寮秦冉鄡單三人家語不載而别有琴牢陳亢縣亶如文翁圖所記又有林放蘧伯玉申棖申堂後人增益今不可考宋朝李燾著大傳雜說七十二子名籍各一卷馬昭曰家語王肅增加非鄭玄所見肅私定以難鄭玄孝經隋志孔子既叙六經題目不同指意差别恐斯道離散故作孝經以總會之明其枝流雖分本明於孝魏文侯孝經傳漢祭祀志注蔡邕明堂論曰魏文侯孝經傳曰太學者中學明堂之位也漢十一家孝經四家孝經藝文志孝經十一家五十九篇古孔氏一篇二十二章孝經一篇十八章長孫江后翼氏四家長孫氏說二篇江氏翼氏后氏說各一篇雜傳四篇安昌侯說一篇五經雜義十八篇石渠論爾雅三卷二十篇小爾雅一篇古今字一巻弟子職一篇應劭曰管仲所作說三篇孔子為曾子陳孝道夫孝天之經地之義民之行也舉大者言之故曰孝經漢興長孫氏博士江翁少府后倉諫大夫翼奉安昌侯張禹傳之各自名家經文皆同唯孔子壁中古文為異父母生之續莫大焉故親生之膝下諸家說不安處古文字讀皆異王式傳博士江公著孝經說後漢儒林傳自期門羽林之士悉通孝經章句明帝時禮記周禮注引孝經說秋官注孝經說曰云云疏云援神契郊特牲疏引異義今孝經說穀梁疏亦引孝經說孝文置孝經博士司隷有孝經師荀爽對䇿漢火徳其徳為孝漢制使天下誦孝經選吏舉孝亷何休注訓孝經馬融注孝經髙誘作孝經解宋梟曰涼州寡於學術屢致反暴今欲多寫孝經令家家習之詔書詰責漢古文孝經志孝經古孔氏一篇二十二章注師古曰劉向云庶人章分為二曾子敢問章分為三又多一章閨門章凡二十二章漢興云云見上唯孔氏壁中古文為異父母生之續莫大焉故親生之膝下諸家說不安處古文字讀皆異師古曰桓譚新論云古孝經千八百七十二字今異者四百餘字書序孔子舊宅壁中得古文虞夏商周之書及傳論語孝經皆科斗文字說文叙建光元年九月戊午許冲上父慎說文曰古文孝經者孝昭帝時魯國三老所獻建武時議郎衞宏所校皆口傳官無其說臣父學孔氏古文撰具一篇并上家語後序孔安國為古文論語訓二十一篇孝經傳二篇皆壁中科斗本也晉衞恒傳漢武時魯恭王壞孔子宅得尚書春秋論語孝經時人不復知有古文謂之科斗書漢世秘藏希得見之隋志古文孝經一卷孔安國傳梁未亡逸今疑非古本古文孝經述義五卷劉炫撰本傳云述議秦焚書為河間顔芝所藏漢初芝子貞出之凡十八章而長孫江后翼張皆名其學又有古文孝經與古文尚書同出而長孫有閨門一章其餘經文大較相似篇簡缺解又有衍出三章并前合為二十二章孔安國為之傳至劉向典校經籍以顔本比古文除其繁惑以十八章為定鄭衆馬融並為之注又有鄭氏注相傳或云鄭玄梁代安國及鄭氏二家並立國學而安國之本亡於梁亂至隋秘書監王劭於京師訪得孔傳送至河間劉炫炫因述其議疏講于人間後遂著令與鄭氏並立儒者皆云炫自作之非孔舊本鄭氏注一巻梁有馬融鄭衆注二卷言崇文目康成注一卷鄭玄傳注謝承書不注孝經惟此書有之唐志古文孔安國傳劉邵注各一卷唐玄宗時議者排毁古文以閨門一章為鄙俗不可行魏孝經傳王肅傳奉詔令諸儒注述孝經以肅說為長唐會要劉子玄云王肅孝經傳首有司馬宣王之奏奉詔令諸儒注述孝經以肅說為良吳嚴畯著孝經傳潮水論孝經解讚隋志一卷韋昭解集解孝經一卷謝萬集蕭子顯孝經敬愛義一卷太史叔明孝經義一卷晉講孝經義見帝學隋志梁有晉孝經一卷穆帝時祁嘉依孝經作二九神經晉集議孝經隋志一卷晉東陽太守袁敬仲集又一卷中書郎荀朂撰唐志荀朂孝經集解梁孝經義疏隋志梁武帝義疏十八卷皇侃三卷梁簡文五卷蕭子顯一卷亡梁武帝釋孝經義中大通四年三月置制㫖孝經助敎一人簡文於士林館發孝經題張譏論議往復譏有孝經議八卷沈文阿有孝經論語義記趙景韶一卷徐孝克講疏六巻唐志何約之大明中皇太子講義疏一巻齊書永明三年太子於崇正殿講孝經晉太子講孝經於崇政殿梁書昭明太子講孝經殿中中庶子徐勉祭酒張充執經天監八年九月於壽安殿講孝經論語講畢親臨釋奠于國學南史陳王元規孝經義記兩卷北史何妥義疏二卷齊周顒撰義疏孝經圖隋志梁有孝經圖一卷孝經孔子圖二卷舊唐志孝經應瑞圖一卷䜟緯有孝經古祕圖一卷左右契圖一卷分野圖一卷内事圖二卷内事星宿講堂七十二弟子圖一巻又口授圖一卷崇文目農家大農孝經一卷小說有正順孝經一卷女孝經一卷酒孝經一卷唐二十七家孝經志經錄孝經二十七家三十六部八十二卷失姓名一家始於古文孔安國傳終於元行冲疏古文有孔安國之傳劉邵之注為注者王肅鄭玄韋昭孫熙蘇林謝萬虞盤佐孔光殷仲文叔道徐整魏克己而唐玄宗制㫖附焉為講義義疏者車胤皇侃何約之梁武帝劉炫賈公彦任希古元行冲而荀朂集解太史叔明發題張士儒演孝經附焉應瑞圖一卷失姓名不著錄六家一十三卷尹知章王元感之注孔頴達之義疏李嗣真之指要及平貞眘孝經義終於徐浩廣孝經唐舊令行孔鄭二注隋志六典同古今孝經等十八部六十三卷崇文目五部九卷中興目十五家二十巻續目一家一卷鄭氏序孝經者三才之經緯五行之綱紀孝為百行之首經者至易之稱玄宗序雖五孝之用則别而百行之源不殊國史志孔安國傳古二十二章有閨門篇為世所疑鄭氏注今十八章相承言康成作鄭志目錄不載通儒皆驗其非開元中孝明纂諸說自注以奪二家然尚不知鄭氏之為小同經典序錄鄭注相承以為鄭玄案鄭志及中經簿無唯中朝穆帝集講孝經云以鄭玄為主檢孝經注與康成注不同未詳是非江左中興孝經論語共立鄭氏博士一人唐孝經章句孔頴達傳兼舊史太宗時為太子右庶子承乾令頴達撰孝經章句因文箴諷貞觀十四年詔頴達講孝經於國學志頴達義疏卷亡集賢注記壽王通孝經賜王逈質束帛酒饌及衣被唐孝經注議會要開元七年三月一日敕孝經尚書有古文本孔鄭注㫖趣頗多踳駮令諸儒質定六日詔曰孝經徳敎所先頃來獨宗鄭氏孔氏遺㫖今則無文又子夏易傳近無習者輔嗣注老子亦甚甄明其令儒官詳定所長令明經者習讀四月七日左庶子劉子玄上孝經注議曰今俗所行孝經題曰鄭氏注云即康成而魏晉無此說至晉穆帝永和十一年孝武大元元年再聚群臣共論經義有荀昶撰集孝經諸說始以鄭氏為宗宋梁已來多有異論陸澄以為非玄所注請不藏祕省王儉不依其請遂傳於時魏齊立於學官著在律令然則孝經非玄所注其驗十有二條鄭自序無注孝經之文一也弟子追論師注及應對時人謂之鄭志不言注孝經二也鄭志目錄記鄭所注不言孝經三也鄭記不及孝經四也趙商作鄭先生碑銘亦不言注孝經晉中經簿稱鄭氏解無名玄二字五也春秋緯演孔圖云春秋孝經别有評論宋均於詩譜序云先師則均是傳業弟子也而云唯有評論六也宋均孝經緯注引鄭六藝論叙孝經云玄又為之注而均無聞焉七也宋均春秋緯注云玄為春秋孝經畧說非注之謂八也後漢史書謝薛司馬袁為傳載所注皆無孝經九也云云古文孔傳曠代亡逸隋開皇十四年秘書學生王孝逸得一本送王邵以示劉炫炫率意刋改因著孝經稽疑一篇邵以為經文盡在正義甚美而歴代未嘗置於學官愚謂行孔廢鄭於義為允國子祭酒司馬貞議曰今孝經是漢河間王所得顔芝本劉向定為十八章其注相承云鄭玄作而鄭志及目錄等不載往賢共疑焉唯荀昶范曄以為鄭注昶集解孝經具載此注序云以鄭為主是以此注為優其古文二十二章元出孔壁安國作傳世未之行荀昶集注之時尚有孔傳中朝遂亡其本近儒妄作此傳假稱孔氏又偽作閨門一章劉炫詭隨妄稱其善且閨門之義近俗之語非宣尼正說又分庶人章故自天子已下别為一章仍加子曰二字非但經文不真亦傳習淺偽議者取近儒詭說殘經缺傳而廢鄭注理實未可請鄭孔俱行五月五日詔鄭仍舊行用孔注傳習者稀亦存繼絶之典頗加奬飾唐六家孝經見御製明皇取王肅劉邵虞翻韋昭劉炫陸澄六家之說參倣孔鄭舊義自作序云舉六家之異同劉邵古文注一卷王肅韋昭注各一卷劉炫述義五巻陸澄言鄭玄注用辭不類虞翻隋唐志載唐孝經制㫖疏志玄宗孝經制㫖一卷梁武帝撰制㫖孝經義元行冲御注孝經疏二卷舊志三卷王開元七年為國子司業謝志有孔安國劉邵肅鄭玄韋昭孫熙蘇林萬尹知章王元感注皇侃孔穎達賈公彦義疏隋何妥孝經義疏二卷元行冲傳玄宗自注孝經詔行冲為疏立于學官會要開元十年六月二日上注孝經頒天下及國子學天寳二年五月二十二日上重注亦頒天下紀天寳三載十二月癸丑詔天下家藏孝經會要云精勤敎習學校之中倍加傳授州縣官長申勸課焉五載二月二十四日詔孝經書疏雖粗發明未能該備今更敷暢以廣闕文令集賢寫頒中外薛放曰漢立論語於學官光武令虎賁士習孝經玄宗親為注訓論語六經菁華孝經人倫之本也開元中親注孝經并製序八分書之立于國學以層樓覆之洛中記異唐孝經指要志李嗣真孝經指要一卷唐廣孝經志徐浩廣孝經十卷浩稱四明山人乾元二年十一月上授校書郎張士儒演孝經十二卷唐科斗書孝經李陽氷子服之貞元中授韓愈以其家科斗孝經衞宏官書兩部合一卷後以歸歸登其後以凡為文辭宜畧識字再乞觀之張籍令賀㧞恕寫之韓愈科斗書後記又渭上耕者亦得古文孝經唐孝經新義志任希古越王孝經新義十卷後周顯徳六年八月髙麗遣使進别叙孝經一巻越王孝經新義八卷别叙者記孔子所生及弟子從學之事新義以越王為問目釋疏文是非淳化御書孝經見御書咸平孝經論語正義至道二年判監李至請命李沆杜鎬等校定周禮儀禮穀梁傳疏及别纂孝經論語正義從之梁皇侃為論語義疏援引不經詞意淺陋咸平三年三月癸巳命祭酒邢昺代領其事杜鎬舒雅李維孫奭李慕清王煥崔偓佺劉士元預其事凡賈公彦周禮儀禮疏各五十卷公羊疏三十卷楊士勛穀梁疏十二卷皆校舊本而成之孝經取元行冲疏論語取梁皇侃疏爾雅取孫炎髙璉疏約而修之又二十三巻四年九月丁亥以獻賜宴國子監進秩有差十月九日命杭州刻板書目孝經正義三卷邢昺撰初世傳元行冲疏外餘家尚多皆淺近不足取咸平中昺等奉詔據元氏本而增損焉咸平三體書孝經三年四月辛未直昭文館句中正上石本大小篆八分三體書孝經書目一卷具古文秦篆漢隷三體又有楊南仲書二體孝經一卷真篆二體真宗召至便殿坐問所書幾時方畢曰凡十年遂賜金紫藏其書秘閣命别進三本送三館八月二十四日賜中正詔曰汝精通字學得史籕之舊法見蔡邕之古文精夏竦古文韻曰中正刻孝經字體博書目孝經一卷案隋志鄭氏注邢昺正義云世傳康成所注而鄭志不載先儒疑之荀昶集解以此注為優請與孔傳並行今陸徳明音釋用此五代散亡咸平中日本僧奝然來獻祥符資善堂讀孝經見堂類天聖孝經論語要言天聖四年閏五月侍讀學士宋綬錄惟皇誠徳賦孝經論語要言唐太宗帝範二卷開元中楊浚聖典三卷楊相如君臣政理論三巻以進時帝好儒學太后命綬擇前代文字資孝養補政治者以備帝覽故也慶厯七年三月丙申邇英講孝經皇祐孝經圖四年命丁度書天子孝治聖治廣要道四章為圖至和古文孝經指解實錄至和元年十二月丁未殿中丞直秘閣司馬光上古文孝經指解一卷詔送秘閣或作皇祐四年誤序曰聖人言則為經動則為法孔子與曾參論孝而門人書之謂之孝經漢興顔芝之子得十八章儒者傳之是為今文及魯恭王壞孔子宅而古文始出凡二十二章今文之學已盛古文排擯不得列於學官獨孔安國及馬融為之傳隋開皇中王孝逸得之河間劉炫作稽疑一篇將興墜起廢時人已多譏笑之唐開元中詔議孔鄭二家劉知幾以為宜行孔廢鄭諸儒爭難蠭起卒行鄭學及明皇自注遂用十八章為定前世孝經多者五十餘家少亦不減十家今秘閣所藏止有鄭氏明皇及古文三家古文有經無傳按孔安國以古文時無通者以隷書寫尚書而傳之則論語孝經不得獨用古文蓋後世好事者用孔氏傳本更以古文寫之其文則非其語則是也臣輙以隷寫古文為之指解其今文舊注有未盡者引而伸之其不合者易而去之表曰聖人之徳莫加於孝猶江河之有源草木之有本源逺則流大本固則葉繁秘閣所藏古文孝經先秦舊書傳注遺逸孤學堙微不絶如綫妄以所聞為指解一卷范祖禹復為之說一卷元祐中上桓譚新論古孝經一巻二十章千八百七十二字今異者四百餘字見上元祐尚書論語孝經要義三經要語元祐二年九月庚午吕公著言伏覩今月十五日以經筵講論語畢賜執政及講筵官御筵是日内出御書唐賢律詩分賜臣等各一篇次日臣於延和謝今來論語終失進講尚書二書皆聖人之格言為君之要道臣輙於尚書論語及孝經中節取要語凡一百段惟取明白切於治道者庶便省覽他日太皇太后宣諭公著曰所進尚書論語等要義百篇皇帝每日書寫看覽甚有益學問與寫詩不同范祖禹言臣謹節尚書論語孝經要切之語訓戒之言得二百一十九事以備聖札所冀手書之目覩之心存之以助聖徳之萬一名曰三經要語紹興御書孝經二年八月十六日癸卯上出其寫孝經詩書篇章宣示吕頥浩等九年六月十二日辛酉宰臣檜乞以上所賜御書真草孝經刻之金石上曰十八章世以為童蒙之書不知聖人精微之學不出乎此十四年七月辛未詔諸州以御書孝經刋石賜見任官及學生從汪勃之言也紹興資善堂孝經圖見堂類紹興孝經解八年四月庚午王悱獻孝經解義詔賜帛十年十二月十日程全一進孝經解命為大學職事十一年十一月二十七日林獨秀進孝經指解賜束帛紹興中王文獻進詳解一卷趙湘進孝經議一卷沈處厚進解一卷漢忠經附書目儒家一卷馬融撰鄭玄注融述孝經之意作忠經陳事君之要道始於立徳終於成功凡十八章崇文目小說兩朝志海鵬忠經唐武孝經附書目一卷崇文目小說唐郭良輔設太公孫子問答倣孝經篇章以述武事崇文目有兵書論語三卷國史志一卷民生日用之常后王降徳之本孝經道之根本學之基址其言近其㫖遠其守約其施博自微至顯自小至大自身體髪膚受之至於嚴父配天自親生之膝下至於天下和平自事父母至於天地明察通神明光四海充其道者舜文王周公是也范祖禹孟子韓愈曰孔子之道大而能博獨孟軻氏之傳得其宗故求觀聖人之道者必自孟子始孟子十一篇漢志儒家孟子十一篇名軻鄒人子思弟子有列傳注師古曰聖證論曰軻字子車而此志無字未詳其所得史記列傳軻與萬章之徒序詩書述仲尼之意作七篇漢志十一篇四篇外書也韓文軻之書非自著既沒其徒萬章公孫丑相與記所言耳朱子集注史記近是道性善注曰門人不能盡記其詞決汝漢注曰記者之誤吳伯豐問朱子答曰兩處失之晁氏志按此書韓愈以為弟子所會集今考其書載孟子所見諸侯皆稱諡死然後有諡軻著書時所見諸侯不應皆前死且惠王元年至平公之卒凡七十七年軻始見王目之曰叟必已老矣決不見平公之卒也漢趙岐注孟子隋志孟子十四卷齊卿孟軻撰趙岐注唐志趙岐注孟子十四卷分上下篇梁惠王至盡心趙岐傳字邠卿又字臺卿多所述作著孟子章句題辭孟子治儒術之道垂憲言以詒後人著書七篇二百六十一章三萬四千六百八十五字包羅天地揆叙萬類仁義道徳性命靡所不載帝王公侯遵之可以致隆平頌清廟卿大夫士蹈之可以尊君父立忠信守志厲操者儀之可以崇髙節抗浮雲孔子自衞反魯然後樂正雅頌各得其所乃删詩定書繫周易作春秋孟子退自齊梁述堯舜之道而著作焉此大賢擬聖而作者也七十子會集夫子所言以為論語孟子之書則而象之秦滅經術孟子徒黨盡矣書號諸子篇籍得不泯絶漢孝文置博士後罷迄今諸經通義得引以明事謂之博文儒家惟有孟子閎遠微妙蘊奧難見宜在條理之科外書四篇題辭又有外書四篇性善辨文說孝經為正其文不能弘深不與内篇相似非孟子本真後世依放而託之者也論衡孟子作性善之篇以為人性皆善及其不善物亂之也法言孟子曰夫有意而不至者有矣未有無意而至者也說苑太平御覽孟子曰人皆知糞其田而莫知糞其心顔氏家訓圖景失形漢伍被傳孟子曰紂貴為天子死曾不如匹夫是紂先自絶久矣非死之日天去之也史記注孟子稱禹生石紐西夷人也藝文類聚滕文公云云孟子諫曰坊記注舜生五十而不失其孺子之心史通堯舜不勝其美桀紂不勝其惡文選注太山之髙參天入雲漢孟子章句儒林傳程曾著書百餘篇皆五經通難又作孟子章句髙誘正章句唐六家孟子志趙岐注十四卷劉熈注七巻鄭玄注七卷綦母䆳注七卷隋志梁有綦母䆳撰九巻亡陸善經注七卷張鎰音義三卷儒家六十九孟子有六家唐續孟子崇文目續孟子二卷唐咸通中林慎思撰祥符孟子音義正義晁氏志孫奭採張鎰丁公著所撰參附益其闕為二卷大中祥符中書成上于朝又撰正義元祐五臣解孟子晁氏志十四卷范祖禹孔武仲吳安詩豐稷吕希哲元祐中同在經筵所進講義貫穿史傳辭㫖精贍又伊川孟子解十四卷程頥横渠孟子解十四卷張載王安石王雱許允成解各十四卷馮休删孟二卷十七篇司馬光疑孟一卷並晁氏志紹興中吳表臣於經筵講髙宗書于坐右屏又書刋石太學淳熙孟子集注或問精義朱文公熹撰各十四卷詳見論語類程子曰學者當以論語孟子為本二書既治則六經可不治而明又曰讀論語孟子而不知道所謂雖多亦奚以為張栻孟子說十七卷魏了翁要義十四卷玉海卷四十一
