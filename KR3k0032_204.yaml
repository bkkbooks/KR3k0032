body:
  text: 玉海卷二百四宋王應麟撰辭學指南針序云云針辭用韻語末云敢告云云紹聖試格如揚雄百官九州針之類針銘贊頌並逐句空字針者諫誨之辭若針之療疾故名針盤庚無伏小人之攸針庭燎因以針之召公曰師針師曠百工誦針諫文心雕龍曰夏商二針餘句頗存夏針見于周書文傳篇商針見于吕氏春秋名類篇又謹聽篇有周針周辛甲為大史命百官官針王闕虞人掌獵為針漢揚雄擬其體為十二州二十五官針後之作者咸依倣焉隋杜正藏舉秀才擬匠人針擬題肇於此唐進士亦或試針顯慶四年試貢士針開元十四年考功針廣德三年轅門針建中三年學官針周虞人針芒芒禹迹畫為九州經啓九道民有寢廟獸有茂草各有攸處德用不擾在帝夷羿冒于原獸忘其國恤而思其麀牡武不可重用不恢于夏家獸人司原敢告僕夫告僕夫不敢斥尊東萊先生曰凡作針須用官針王闕之意各以其官所掌而為針辭如司隸校尉針當説司隸針人君振紀綱非謂使司隸振紀綱也如廷尉針當説人君謹刑罰非謂廷尉謹刑罰也針尾須依虞針獸臣司原敢告僕夫之類止是隨題日改如上林清臺針則云史臣司天宗正針則云宗臣司族廷尉云官臣司刑司隸校尉云官臣司直太常云禮臣司典其下句敢告隨韻改之大抵如敢告贄御敢告僕臣之類是也西山先生曰針銘贊頌雖均韻語然體各不同針乃規諷之文貴乎有警戒切劘之意詩庭燎沔水等篇左氏虞人針揚子雲百官針古文苑張茂先女史針白居易續虞人針柳公綽太醫針王元之端拱針文粹中諸針可寫作一帙時時反復熟誦便知體式出針用官名須先理會置官之意謂如將作大臣則戒宫室之侈虞人則戒遊田之數程文中唯上林清臺考工令針最佳可以為法針者下規上之辭須有古人風諫之意惟官名可以命題所謂百官官針王闕各因其職以諷諫如出周保章針則當以敬天為説其他皆然又有非官名而出針者若宣室上林清臺之類亦當引從規諷上立説針題最多自周禮外歷代百官表志前漢後漢唐皆當詳考凡其名雅馴者皆可出又有散在傳記間者如周陶正不在周禮而在左傳舜樂正不在虞書而在荀子須著意搜尋然後無遺忘針銘題有雜出於他書者只兩字易于漏失東萊先生考工令針監于太宗罷露臺役一言興邦萬杵咸息監于中宗肅然齋居器械技巧圭黍莫誣就用漢事可以為式王器之騎郎將針考官批云就用漢事為針甚佳所引吸廣輩諸卷所不及王器之曰劉才邵宣室針序甚有意四字語差不及胡廣百官針敘曰針諫之興所由尚矣聖君求之於下忠臣納之于上故虞書曰豫違汝弼汝無面從退有後言墨子著書稱夏針之辭文心雕龍曰揚雄稽古始範虞針卿尹州牧二十五篇及崔胡補綴總稱百官所謂追清風于前古攀辛甲于後代題太史紹聖丙子漢宣室宣和庚子出紹興乙卯重漢上林清臺紹興戊辰漢考工令庚辰周師氏隆興癸未武學乾道己丑周司會淳熙丁未漢詩博士嘉定戊辰漢內史辛未漢騎郎將庚辰漢護羌校尉癸未周陶正慶元己未漢講郎紹定己丑漢湯官丞淳祐甲辰漢式道候庚戌周馮相氏寶祐癸丑堯謁者開慶己未漢公車令咸淳乙丑銘序云云銘詩用韻語紹聖試格如張孟陽劒閣銘柳宗元塗山銘之類政和元年試格厯代史故事借擬為題如周成王封泰山頌張衡渾天儀銘之類銘始于黃帝漢藝文志道家有黃帝銘六篇應劭曰盤㿻諸書黃帝史孔甲所作銘也禹銘筍虞湯銘于盤銘者名也因其器名書以為戒也武王聞丹書之言為銘十六臧武仲曰夫銘天子令德諸侯言時計功大夫稱伐文心雕龍曰夏鑄九鼎周勒楛矢令德之事也吕望銘昆吾仲山鏤庸器計功之義也魏顆景鐘孔悝衛鼎稱伐之類也蔡雍銘論曰德非此族不在銘典詩傳曰作器能銘可以為大夫考工記嘉量有銘文選序曰銘則序事清潤陸倕石闕漏刻二銘皆有序張載劒閣銘末云勒銘山阿敢告梁益則寓警戒之旨隋杜正元舉秀才擬燕然山劒閣銘杜正藏擬弓銘唐崔渙還調吏部侍郎嚴挺之施特榻試彛尊銘謂曰子清廟器故以題相命建中三年進士别頭試欹器銘興元元年朱干銘則以銘試士尚矣東萊先生曰詹仲和輔渠銘序極佳但須便説內史兒寬言為妙西山先生曰古之為銘有稱述先人之德善勞烈者衛孔悝鼎銘是也有著警戒之辭于器物者如湯盤銘武王几杖楹席之銘是也今詞科所作雖未能全復古體亦須略倣其意可也銘題散在經傳極多自器物外又有用山川溝渠宫室門關為銘者若劒閣泗水亭銘是也如唐駐蹕山銘則所以揚人主之威武如劒閣銘則所以戒殊俗之僣叛或出此等題又當象題立説茍無主意止于鋪敘何緣文字精神銘文體貴乎簡約清新大抵以程文為式熟讀前代韻語以為命意造語之法趙大本唐黃道遊儀銘序粵十三年龍尾伏辰之月哉生明以遊儀成奏此年月只是銅儀非遊儀詔置景運此門唯置銅儀集賢注記載遊儀之下續云十三年十月渾儀成舊史十三年十月癸丑銅儀成志十一年遊儀成會要以為十三年十月三日劉三傑試漢瓉槃銘序云先儒釋經不明先鄭後鄭云曰大曰容尺升備載不記八寸一尺李獻之黃道遊儀銘序越既四載王器之抹四載字謂十三年乃銅儀又抹景運字此門唯置銅儀陳壽南中選孝宗曰鐵簾銘題目甚新峴為銘亦好文心雕龍曰針貴確切銘貴弘潤事必核以辨文必簡而深朱文公曰武王諸銘有切題者如鑑銘是也亦有不可曉者古人只是述戒懼之意隨所在寫以自警今人為銘要就此物上説得親切如湯盤銘之類題欹器紹聖乙亥分賜鏤文紅管御筆元符己卯玉磬崇寧壬午夏禹九鼎政和辛卯漢宣德殿馬式壬辰漢楚龍淵宣和癸卯漢輔渠紹興戊午克敵弓壬戌黃帝景鍾戊辰漢瑄玉辛未漢芝車甲戌漢廟鼎丁丑漢玉巵乾道丙戌周太常壬辰唐黃道遊儀淳熙乙未禹待賢􅒶辛丑漢漏刻四十八箭甲辰新製鐵簾丁未魯鼓紹熙庚戌漢緑車癸丑漢律凖慶元丙辰漢瓉槃嘉泰壬戌漢農輿寶慶丙戌堯諫鼓紹定壬辰周元戎嘉熙戊戌熙寧神臂弓辭學周九和弓淳祐丁未唐武庫大弓寶祐癸丑堯衢室丙辰漢名馬式景定癸亥辭學重出漢安車咸淳戊辰少皡氏度量甲戌記末云謹記今題云臣謹記記者紀事之文也西山先生曰禹貢武成金縢顧命記之屬似之文選止有奏記而無此體古文苑載後漢樊毅修西嶽廟記其末有銘亦碑文之類至唐始盛獨孤及風后八陳圖記今之擬題倣此若今題則以承詔撰述者為式東萊先生曰記序有混作一假説者有分兩節説者如未央宫先略説高帝蕭何定天下作宫一假乃説為之記曰此下立意或説奉若天道建邦設都或説都邑四方之極皆得作記有敘其事于首者如宫殿經始於某年某月落成於某年某月之類先説在頭一假然後人為之記曰云云周子充漢末央宫記首云漢高皇帝云云八年丞相蕭何始治未央宫云云是也有敘其事于尾者如詹叔羲漢城長安記末云城肇功於元年正月已事于五年九月云云為門者十有二南北則象斗形云云洪景伯唐勤政務本樓記末云樓成于開元二年之九月云云是也凡作文字先要知格律次要立意次要語贍所謂格律但熟考總類可也所謂立意如學記泛説尚文是無意也須就題立意方為親切柳子厚柳州學記説仲尼之道與王化逺邇此兩句便見嶺外立學不可移于中州學校也所謂語贍如韓退之南海神廟文乾端坤倪軒豁呈露一假老蘇兄渙字序説風水一假是也雖欲語贍而不可太長謂専事言語不可近俗如青編中對聖賢語黃卷上從古人遊之語皆是不可多用難字熟看轉柳歐蘇先見文字體式然後遍考古人用意下句處又須作一册編體製轉換處不拘古文與今時程文大略編之如喜雨亭記亭以雨名志喜也柳文宣王廟碑仲尼之道與王化逺邇似此之類此作記起頭體製也歐公真州發運園記中間一節此記中間鋪敘體製也柳萬石亭記附零陵故事之類此記末後體製也西山先生曰記以善敘事為主前輩謂禹貢顧命乃記之祖以其敘事有法故也後人作記未免雜以論體詞科所試唯南渡前元豐尚書省飛白堂等記及紹興新修太學記猶是記體皆可為法後來所不逮須多讀前輩敘事之文則下筆方有法度蓋有出處事多如唐折衝府者出處事少如漢步壽宫者事多貴乎善翦截不然則繁冗矣事少責乎鋪張不然則枯瘠矣如漢金域屯田出處幾五士板而欲欽為一篇漢步壽宫出處才數句而欲演為一記須將本科之文如此類者細觀其布置之法事多者筆端自為融化不全用古人本語事少者自作一規模不使局趣則得之矣記題最多如宫室興造制度名物皆可為題須詳加編纂庶無遺失記序用散文須揀擇韓柳及前輩文與此科之文相類者熟讀韓南海神廟碑柳興州江運記蘇儲祥官碑之作類凡文體嚴整者皆是又曰取興則簡嚴者為文之式作文貴乎嚴整不可少類時文須忌之乎者也虛字重字太多多字痛自裁節纍舉程文可以槩見兹不詳述記序以簡重嚴整為主而忌堆疊窒塞以清新華潤為工而忌浮靡纎麗文心雕龍曰思贍者善敷才核者善刪善刪者字去而意留善敷者辭殊而義顯字刪而意缺則短辭敷而意重則蕪綻學在博缺事貴約朱文公曰記文當考歐曾遺法料簡刮摩使清明峻潔之中自有雍容俯仰之態又曰歐文敷膄溫潤南豐文峻潔坡文雄健水心曰如歐公吉州學豐樂亭南豐擬峴臺道山亭荆公信州興造桂州修城記張文潛曰文人好竒者或為缺句斷章使脈理不屬又取古人訓詁希於見聞者衣被而説合之反覆咀嚼卒亦無有此最文之陋也石林曰今世文章只是用換字減字法張伯玉吳郡六經閣記云六經閣諸子百家皆在焉不書尊經也元祐中新作御史臺詔曾子開為記其略曰責人非難責已為難云云惟其不難于責已則施于責人能稱其任矣茍異于是得無餒于中哉世以為名言平齋曰如漢郡國風俗本末唐山河兩戒等記若非平居考訂成次序寸晷之下雖以全史翻閲殆未易著手陳自明試已入等以試卷申省進呈同試之人指其微纇摘周五射記用襄尺字以為犯濮安懿王諱未與推恩侍從言記問文采逈出流輩既單用襄字初不從言雖曰同音即是嫌名自不應避詔與下等推恩紹熙元年試慶元四年推恩淳熙八年先取二名內一名第六篇記漏寫限三百字以上止取莫叔光今題式曾子開重修御史臺記首云元祐三年新作御史臺有詔臣某為之記云云末云輒因承詔誦其所聞以告在位者使有以仰稱列聖褒大崇顯之意焉東萊隆儒殿記首云仁宗皇帝皇祐紀元之三載云云末云臣既述其事謹待制旨而勒之右周益公選德殿記首云皇帝踐阼以來宫室苑囿無所增修獨闢便殿于禁垣之東名之曰選德云云一日命臣汝為之記臣愚學不足以推廣聖意詞不足以鋪陳盛美謹采詩禮云云次第其説末云陛下神聖必于此有得焉而臣何足以知之題藉田紹聖丁丑元豐新修尚書省丁丑别試思文殿元符戊寅詔賜宗室坐右銘己卯重摹太宗皇帝御飛白書玉堂庚辰宗子學靖國辛巳重修祕閣崇寧壬午重修都亭驛癸未新建殿中省丙戌新建書學大觀己丑唐集賢殿書院政和辛卯漢六輔渠壬辰唐修文館癸巳唐學士院甲午唐洛陽宫乙未唐太微宫丙申漢麒麟閣名臣圖丁酉唐史館戊戌新修龍德太一宫宣和己亥唐花蕚相輝樓辛丑大唐雅樂甲辰唐八坊建炎戊申唐折衝府紹興乙卯漢城長安戊午唐勤政務本樓壬戌唐凝暉閣渾天儀乙丑紹興新修太學戊辰唐慶善官辛未咸平龍圖閣五經圖甲戌繡衣鹵簿丁丑少皥氏官名庚辰漢武功爵乾道丙戌唐義倉己丑漢南北軍屯壬辰漢漕渠淳熙乙未周乘馬法戊戌漢雒陽城十二門辛丑漢太初官名甲辰漢步壽宫丁未周五射紹熙庚戌漢建武封功臣癸丑漢增置郡國慶元己未漢永平車服制度嘉泰壬戌漢留田十二便開禧乙丑周四學嘉定戊辰漢七郊辛未唐十六衛甲戌漢剖符封功臣丁丑唐十道山川庚辰唐鹵簿癸未漢功臣增邑更封寶慶丙戌漢西域都護壬辰漢四姓小侯學端平乙未漢論功定封嘉熙戊戌天聖廣科目辭學大中祥符皇族諸院入學己亥辭學淳化常平倉庚子辭學漢郡國鹽鐵官淳祐辛丑周復舊域甲辰周畿內貢法丁未景祐權量律度式庚戌皇祐鎮國神寶寶祐癸丑周山川圖丙辰漢郡縣山川風俗開慶己未漢五屬國景定壬戌初置文思院癸亥辭學周爵名咸淳乙丑虞米廪戊辰周采地甲戌贊頌説附序云云贊曰云云贊者贊美贊述之辭文選序曰圖像則贊興文章緣起曰司馬相如作荆軻讃班史以論為贊范曄更以韻語隋志曰後漢魯廬江有名德先賢之贊蜀楊戲著季漢輔臣贊漢明帝殿閣畫陳思王為贊夏侯湛東方朔畫贊序云云乃作頌焉其辭曰云云袁宏三國名臣序贊序云云故復撰序所懷以為之贊云云云先序後贊與今體相類唐建中二年進士以針論表贊代詩賦此試贊之始中興書目云顧雲鳯䇿聫華三卷有補十八學士寫真像贊安西都護府重築碎葉城碑皆因舊事而作亦擬題之類也西山先生曰贊頌皆韻語體式類相似贊者贊美之辭頌者形容功德然頌比於贊尤貴贍麗宏肆須鋪張揚厲以典雅豐縟為貴昌黎聖德詩徂徠慶厯頌此正格也其用事造語最忌塵俗須熟讀三百篇博觀司馬相如揚雄諸賦與夫漢郊祀歌文選所載二京三都七啓七發之類及韓柳文韻語文字則筆下自然豐腴矣更將選粹及本朝歐蘇諸公所作凡四言韻語之文誦味吟哦便句中有意于鋪張揚厲之中而有雍容俯仰頓挫起伏之態乃為佳作若止將華言綺語一向堆疊而無風味韻致亦何足取哉李充翰林論曰贊宜辭簡而義正梁武帝謂郊廟歌辭應須典誥大語不得雜用子史文章淺言唐説齋寶奎殿御書贊序云慶厯二載無月日辛實録正月未云煥乎堯章親加紀述實録命宰臣吕夷簡撰記皆有缺誤題御書無逸圖紹興乙卯漢麟趾裊􅕭乙丑漢寶鼎神䇿甲戌寶奎殿太宗皇帝御書庚辰漢諸葛亮八陳圖乾道己丑天禧御製元良述壬辰淳化大射圖淳熙乙未御製敬天圖戊戌景德龍圖閣中庸圖紹熙癸丑大中祥符御製太宗皇帝聖文神筆頌嘉泰壬戌天禧清景殿書事詩開德乙丑慶厯觀文鑒古圖嘉定戊辰大中祥符館閣御製甲戌唐開元十八學士圖丁丑高宗皇帝書車攻詩庚辰乾道御製春賦癸未皇祐邇英閣無逸孝經圖寶慶丙戌周武王丹書端平乙未大中祥符御製守官針嘉熙戊戌慶厯邇英聖問庚子辭學唐開元二十二賢圖淳熙辛丑天聖崇政殿講論語賜御飛白書甲辰慶厯三朝訓鑒圖丁未慶厯新修太常禮開慶己未御書賜皇太子講堂新益二字景定辛酉詞學高宗皇帝御書儒行篇壬戌孝宗皇帝御書益稷篇咸淳甲戌頌序云云頌曰云云紹聖試格如韓愈元和聖德詩柳宗元平淮夷雅之類詩有六義六曰頌莊子曰黃帝張咸池之樂有猋氏為頌文心雕龍曰帝嚳之世咸墨為頌以歌九韶商周及魯皆有頌所以遊揚德業褒讃成功隋杜正元舉秀才擬聖主得賢臣頌唐開元十一年進士試黃龍頌十五年試積翠宫甘露頌宋朝淳化三年楊億於學士院試舒州進甘露頌遂賜及第則試頌尚矣宋書曰鮑照為河清頌其序甚工頌詩有序亦不可略也有終篇同韻者如元和聖德詩有四句換韻者如平淮西碑針銘贊倣此西山先生曰見贊類纍舉以前程文唯渡江以前之文如導洛通汴北郊慶成大河東流紹聖元會皆妙絶不可不熟讀文心雕龍曰擬清廟範駉那崔爰文學蔡雍樊渠並致美于序而簡約乎篇取鎔經意自鑄偉辭又曰賈誼枚乘兩韻輒易劉歆桓談百句不遷亦各有其志也昔魏武論詩嫌于積韻而善于貿代陸雲亦稱四言轉句以四句為佳金樓子曰班固碩學尚云贊頌相似癸未陳自修試閲武頌及露布冠絶一埸表中有瑕疵不取知舉言文詞警拔詔注教官王器之漢西域三十六國內屬頌序云小國二十有七九次大國紀述其事備於班固列傳列敘其國見于荀悅漢紀總而名以內屬則有范曄所著本傳存焉敘事之法題紹聖元會紹聖丙子導洛通汴丁丑北郊大禮慶成丁丑别試大河復東流元符戊寅端誠殿芝草庚辰皇帝展事于郊丘靖國辛巳崇寧聖德崇寧癸未崇寧繼述聖政丙戌大慶殿受八寶大觀己丑堯大章政和癸巳黃帝封泰山甲午漢祀雍獲一角獸乙未漢函德殿金芝丙申圓象徽調閣奉安隆鼐丁酉漢神魚舞河戊戌漢三雍宣和己亥漢開籍田辛丑漢甘露降未央宫壬寅漢單于朝甘泉宫甲辰周成王搜岐陽紹興壬戌明道藉田乙丑皇祐紫宸殿奏大安樂辛未漢紫壇丁丑太祖皇帝閲武便殿隆興癸未舜韶簫乾道丙戌唐涇陽受回紇獻功壬辰唐獻獲大安宫淳熙戊戌天禧太清樓觀書辛丑皇祐御製明堂樂舞甲辰紹熙孟春皇帝朝獻景靈宫禮成紹熙庚戌乾德初郊禮成慶元丙辰景祐高禖壇乙未漢闕里作六代樂開禧乙丑舜五樂嘉定甲戌唐紫微殿受龜兹俘丁丑漢西域三十六國內屬庚辰唐興安門受俘紹定壬辰孝宗皇帝閲武白石端平乙未皇祐寶岐殿觀麥淳祐辛丑唐突利請入朝庚戌漢華平寶祐丙辰漢行饗禮景定壬戌淳熙煥章閣藏高皇帝御集咸淳乙丑天聖五色雲戊辰序末云謹序今題云臣謹序紹聖試格如顔延之王融曲水詩序之類序者序典籍之所以作也文選始于詩序而書序左傳序次之宋朝端拱元年王元之試詔臣僚和御製雪詩序遂為直史館則試序亦舊制也東萊先生曰作記序若要起頭省力且就題説起謂如太宗金鑑書序則便説太宗皇帝云云説鑑治亂賢不肖之意如花蕚相輝樓記則便説唐元宗明皇帝云云説兄弟友悌之意不可泛説功德須便入題意西山先生曰序多以典籍文書為題序所以作之意此科所試其體頗與記相類姑當以程文為式而措辭立意則以古文為法可也書目有異同者如南豐戰國䇿目録序末云此書有高誘注者二十一篇或云三十二篇崇文總目存者八篇今存者十篇云卷數有序于首者如唐開元禮序云明皇帝之十四年云云為開元禮一百五十卷是也有序于末者如唐大衍厯序云其書有厯術七篇厯議十篇略例一篇云是也徐子儀甘石巫咸三家星圖序引周禮簭人巫咸事按本處注巫字當為筮非殷之所謂巫咸貢院言是旁證即非本處有差未敢取放開院日知舉請與升擢是年試者二十四人今題式周益公皇朝文鑑序首云臣聞云云賜名曰皇朝文鑑而命臣為之序云云末云臣雖不肖尚當執筆以頌作成之效云韓子蒼國朝會要序首云臣聞云云末云若其條貫舛謬辭語淺薄臣之罪也無所逃戾冒昧聖覽惟陛下幸赦之題邇英閣無逸孝經圖後序亥紹聖乙三朝寶訓元符戊寅御書孝經千字文勒祕閣贊碑隂後序己卯占天萬年厯崇寧癸未新修六典政和癸巳唐大衍厯宣和己亥唐開元禮庚子唐羣書四録壬寅新修汴都志癸卯漢定著三十五家兵法建炎戊申統元厯紹興乙卯唐會要戊午漢五家要説章句壬戌漢中和樂職宣布詩乙丑唐通典戊辰漢石渠議奏辛未漢靈臺十二門詩甲戌漢白虎議奏丁丑唐文思博要庚辰漢輿地圖隆興癸未邇英延義二閣記注乾道丙戌漢陸賈新語己丑唐帝範淳熙乙未漢十八家厯譜戊戌漢元功侯籍辛丑唐車輿衣服令甲辰唐武德貞觀兩朝史丁未晉摯虞文章流别集紹熙庚戌唐羣書治要癸丑唐太宗政典慶元丙辰漢建武詔書己未唐乾元殿四部書嘉泰壬戌唐八厯開禧乙丑唐太宗集嘉定戊辰唐開元厯議辛未甘石巫咸三家星圖甲戌嘉祐昭文館書丁丑周時訓癸未唐祕書四部圖籍寶慶丙戌淳化祕閣羣言壬辰漢十二家論語端平乙未漢二十一家天文嘉熙戊戌皇祐御撰明堂樂曲己亥辭學周職録淳祐辛丑唐開元著録丁未周史記庚戌漢鹽鐵論寶祐癸丑天禧編御集丙辰唐定戎闋圖開慶己未夏針景定壬戌唐六十一家儀注咸淳乙丑周官三易戊辰唐六經法言甲戌試卷式本貫云云應博學宏辭具官姓某年若干一習制誥詔書表露布檄針銘記贊頌序一出身一無過犯一三代一合家口一今試如曾試亦開具年分奉試博學宏辭二首第一首題限以上字第二首同前塗注乙制誥詔表露布檄針銘贊頌限二百字以上記序限三百字以上凡言祖宗及上字並别行言聖恩之類並空字針銘贊頌逐句空字辭學題名乙亥黃符羅畸高茂華趙鼎臣慕容彥逄丙子林虛劉弇滕及丁丑吳兹周燾王孝迪方叔震别試吳幵戊寅丘鄜吉觀國王天倪己卯謝黻庚辰葛勝仲辛巳朝詠之程量孫宗鑑壬午王雲石􅐂謝潛癸未祝天輔杜林丙戌孫近王劭己丑樊察李鞉李子竒以上宏辭三十一人兄弟二吳辛卯談世績蔡經國俞授能壬辰滕康盧益李熙靖薛倉舒癸巳孫傳甲午孫覿王志古滕庾乙未胡交修李木張忞丙申曹中艾晟王諶丁酉李正民薛嘉言宋惠直戊戌崔嗣道宇文彬張守己亥陸韶之王俊李長民庚子范同劉才邵歐陽瓌辛丑李公彥壬寅曾益柔癸卯秦檜甲辰何掄袁植戊申袁正功以上辭學兼茂三十六人滕李袁三家兄弟相踵乙卯王璧石延慶戊午詹叔羲陳巖肖王大方壬戌洪遵沈介洪造後改名適乙丑湯思退王曮洪邁戊辰周麟之季南壽辛未莫沖葉謙亨甲戌莫濟王端朝丁丑周必大庚辰唐仲友癸未吕祖謙丙戌魯可宗己丑薑凱許蒼舒壬辰傅伯壽湯邦彥乙未李巘趙彥中戊戌周洎倪思辛丑莫叔光甲辰李拱丁未陳峴庚戌陳晦癸丑陳宗召壬戌陳貴謙乙丑真德秀留元剛戊辰陳貴誼以上博學宏辭三十八人兄弟三洪二莫父子三陳丙辰王應麟己未王應鳯寶祐四年丙辰博學宏辭第一場二首二月十一日試昭慶軍承宣使左金吾衛大將軍荆湖北路安撫副使兼知鄂州授寧武軍節度使龍神衛四廂都指揮使夔路安撫使兼知夔州兼提領措置屯田兼控扼瀘敘昌合四州邉面加食邑食實封制門下建齋旄而啓鎮密聫廂部之班分帥閫以留田兼飭邉城之備乃眷承流之俊夙參宅收之權兵農方急于坤維表裏載更於師律王言作命士聽無譁昭慶軍承宣使左金吾衛大將軍荆湖北路安撫副使兼知鄂州某沈毅而善謀忠純而知義臨機料敵明四種之兵書御衆牧人備五材之將略率先爪士婁奏膚公有嘉衛社之勤􅎊服執金之職二荆州之方面江界肅清殿鄂渚之雄藩民心靖謐治效已聞于南紀朕衷尤軫于西陲念蜀道之孔囏恃夔門之堅守逺連夷徼先江陽僰水之扞防近護風寒謹昌元巴川之控禦欲整軍而經武必徹土以峙粻惟爾之能敵王所愾是用易苕霅宣風之秩新葭萌賜節之儀十乘以先啓行植中權之牙纛四鄰若防制水壯列郡之喉襟繇副帥以褒升進上遊而綏撫畀端拱使名之寵總紹興穡事之綱虜可勝而奏屯田亟上便宜之十二蠻來威而伐玁狁往陳師旅之三千欽哉實畎以實墉于以維藩而維翰申陪采賦增賁戎昭於戲按德裕南道之圖慨想籌邉習農之績覽孔明平沙之陳毋忘渡瀘耕渭之規務本所以省轉輸設險所以嚴保障祗若豫訓式固爾猶可授寧武軍節度使龍神衛四廂都指揮使夔路安撫使兼知夔州兼提領措置屯田兼控扼瀘敘昌合四州邉面加食邑食實封主者施行周山川圖記相古先民有周德隆澤洽用造區夏章亥所步莫不砥屬建櫜戢武斧藻王度四嶽河海咸秩無文名頌曰般裒時之對鄭元釋允猶翕河之語謂按山川圖次序祭之孔氏正義謂共為一圖雖畿籍方志湮軼亡傳謹敷繹舊聞而為記曰太極肇分有浮而清有沈而奧卷石之積結為巍巍雲蒸雨霈萬物育焉勺水之積融為浩浩源迤流衍萬物潤焉聖人有作乃封乃濬乃刊乃滌肇稱明祀為民祈禠若封禪于黃望秩于虞旅祭于禹維見可觀然風后受圖九州始布山海有經為篇十三圖牒猶未詳也蒼姫開統憲章稽古以地圖知山川之數職于司書以地圖辨山川之名物職于大司徒以九州圖周知山川之阻職于司險天下之圖職方逌掌其山鎮曰會稽衡華曰沂岱嶽及醫無閭霍常其大川曰三江江漢曰榮雒淮泗曰河泲涇汭及漳呼池嘔夷又有山師川師掌其名山虞川衡掌其守艮兼兊麗目擊掌運抑猶以為略也卑高小大則其位殊次主屏攝則其數異我是以有秩祭之圖河先海後辨源委也九河合一同等列也嶽視三公瀆視諸侯禮文别也天子四望諸侯三望名分嚴也按圖定序因序蕆事于是宗伯為壇典瑞奉璋牧人毛牲校人飾駒乃奏㽔賔歌函鍾舞大夏服毳冕而祀焉上下有章無越望之僣祝史薦信無矯舉之愧山澤通氣歆馨降嘏百嘉鬯楙四極艾寧盛哉鑠乎遹觀詩序祀于巡守時邁其邦爰及柴望意者土訓夾車道圖詔事其在斯時與考之傳記天下名山五千三百七十名川三百支川三千周國其在雍州而立吳嶽為西嶽三代居河洛而四瀆咸在山東公羊春秋謂天子有方望之事何休以為望祭凡三十六所若義之修而禮之藏獨于般詩見之夙夜毖祀作周恭先丕天之大律也下逮穆王大朝黃山披圖視典殷武疏述鄭元之言亦參周漢之域驗山川之圖孔安國為漢博士具見圖籍山川所在學者尚有稽焉春官掌三辰之法猶神示之居注亦訓猶為圖仰觀俯察兩盡其摯矣雖然德懋而山川寧道公而百川理懷柔河嶽厥有本元無設官為極之意則經野之圖不足以致治無敬德祈天之忱則卜洛之圖不足以永年是圖之陳左右也顧岐陽豐水而念王業之孔囏瞻洞庭孟門而監地險之難恃江漢想廣及之德南山思疆理之功清明在躬與山川出雲同一運化然後能靈承于旅惟典神天嶪峩濛鴻洋洋如在玉帛云乎哉兹圖外之眇指敢正列其義以詔萬世謹記第二埸二首十三日代皇子謝賜御書孝經十六句表臣某言伏蒙聖慈賜臣御書孝經十六句者睿謨垂𥙿夙承父訓之嚴神畫疏恩備舉聖經之要因心立教拭目知榮臣某惶懼惶懼頓首頓首惟夫子之發微言為曾參而陳孝道首述君親之事謹始及中復虞富貴之移戒危與溢身行口言之無失天經地義之兼該事可法德可尊表裏俱正居致敬飬致樂造次弗違神明四海以交孚進退一忱而匪懈有倬飛鸞之翰於昭詒燕之謀二八句之特書撮其樞要千萬人之咸悅始于家邦仰倣邇英之屏俯殊制旨之注矧熙朝資善之學肇祥符丙辰之春詔儒臣而續是經錫宸章而刋諸石洊觀洪藻宏賁前猷臣德愧溫文性慙岐嶷出有師入有保蚤齒虞庠親則父尊則君恪趨周寢曩者分封之渙號誨之全孝以移忠旨趣會于五經未窺聖緼德教加于百姓徒仰皇明載覩河雒圖書之光如親洙泗問答之語兹蓋恭遇皇帝陛下學稽古典筆寓天常祚嗣萬年受祉而施于子冠冕百行得手而應于心約漆簡千有餘言灑驪珠六十四字淳化祕丘之刻祖武可繩紹興方國之朌人文增煥臣敢不聿嚴琰寫式廣家藏仁孝製六章之詩逺邁唐宫之賜札夙夜事一人之訓緬思建邸之陳圖臣無任感天荷聖激切屏營之至謹奉表稱謝以聞臣某惶懼惶懼頓首頓首謹言堯衢室銘衢室堯所以采民言也惟堯舍己稽衆從缺四字昔黃帝睿哲逺覽合宫有聽明臺有議并謀兼知詒燕後昆乃考室四達之衢垂聽而問焉邇而百揆四嶽逖而九州四表聰明光被嘉言罔伏猗與媺哉善旌謗木昭其明也素題朴桷昭其儉也清問而鰥寡靡不達疇咨而共吺不能蔽先惠之意寓于衢尊爾極之謡聞于康衢仁天知神隆寬博問廣覽兼聽八荒在闥言布天下誦聖至今厥後訪以總章觀以總街復以靈臺詢以外朝揆元探專帝實肇之炳諸典謨卓蹤冠德鋪觀方䇿下聽于人則管子紀其事議盡天下之心則文中子申其説垂衣襞幅邃如神明之居則子華子詳其制魏文帝紀亦曰廣詢于下豐規淵指厯厯維見或者有調元氣治隂陽之言以為明堂異名堯心未昭晰于億萬祀禹之聽治猶銘簨虛矧惟帝世必有銘詩而漆書軼焉皇皇針諫之路二室尊賢太室考庸未足匹休岡羅舊聞補其辭曰於穆放勳道泰朝清光被四表在豫戶庭唯天為大德寓恢閎儲思法官羣龍翼承從人稽衆聖而不矜五達之衢謗木求針康衢遊童洋洋頌聲衢尊先惠涵泳至仁于焉築室廣聽垂明合宫之聽率祖攸行茅茨流化俯數階蓂幅舄入覲若星共辰彤車黃收巍乎天臨帝暉邇止垂衣如神上開言路下達民情何以來之有鼓有旌清問鰥寡爾隱畢申疇咨四嶽朕愆悉陳側陋在下罔閼豫聞象恭庸違罔惑孔壬相在爾室咫尺八紘誰謂民逺察其嚬呻夏鐸徇路規諫于君湯有總街觀誹于民爰周質隆外朝是詢維昔盛帝軌迹易遵君聞無壅天衢以亨熟曰道謀不潰于成嘖室之議陋彼齊人宣室之問卑哉漢文堯在萬世如見其心敢告後王貽此休銘第三場二首十四日天禧編御集序宋受命於穆清五緯集奎觀人文化天下維三葉重光真宗章聖皇帝濬哲欽明體堯蹈舜遊意藝圃積思書林睿藻天葩轇轕元化慶霄在上萬物五色宜刻玉板藏金匱垂訓姚逺以三二典七六經天禧之元月旅黃鍾日躔庚子臣虛已裒次御集百二十卷爰即禁庭俯示丞弼明年孟春嚴儲于繼文殿四年季夏甲午列局崇文分命注釋仲冬庚申出聖製七百二十二卷畀輔臣五年季春庚子欽奉御集尊閣天章定著為三百卷仲秋庚午藏之名山以副墨朌焉赫乎盛哉集有序篇實出御製五年正月癸卯偕聖政記序召邇列觀之臣俟罪翰墨衣被昭回之光稽首書下方曰帝王之文即天地自然之文仰而觀則漆政三辰之炳耀俯而察則山川卉木之彪列帝堯煥有文章文王經緯天地繇此其選道心淵粹發為英華聖學精微寫為謨訓豈有意于文哉若昔黃帝丹書及銘傳至周漢聖文裒集其昉此乎高文有傳著在七略武帝有集始折二卷貞觀開元成集並垂理愧於辭駁亡以議惟我藝祖紹天覺民贊述孔顔道統復續太宗繼序緝熙光明皇文掞天簫勺宇􅨚臣文仲編為三十卷臣彭年編為二百十四卷燕謀詒翼用敷遺于章聖厥既北讋葷允西縻靈夏幅員清謐威械戢藏升中岱宗展采汾隂禮葉樂華葳㽔蔥蒨帝益思持盈制治啓迪化原乃增講員乃御延閣左右圖籍鎔經鑄辭緑字瓊章璧明奎粲歌有念農閲兵奉先為政豐年觀麥喜雨瑞雪之屬斯元首薰風之雅詠也論有勤政崇儒祥瑞解疑思政欹器為君難寬財利之屬斯畫卦重爻之邃學也龍閣有贊聖文有頌元龜有序泰山有銘庇民有述修河有碑三記五針之作清景百篇之製經史遍詠明良載賡肆筆而成戞切韶濩帝心謙鞏未議彚輯祥符四祀九月丙子臣敏中請録宸章襲藏渠觀而文頌歌詩十五卷上于五年四月癸卯號登天禧遂金聲玉振而集大成臣竊從太史氏欽覿集目凡頌碑銘贊之卷二十六詩歌辭章樂府之卷一百十四論述序針條記文書其卷四十正説承華要略靜居玉宸法音集其卷四十有五春秋要言五卷曥分試題表詞卷别七十藝籖鈿軸數盈三百視滋福殿所觀為益備雲漢之章風行水上之文作者不可及已鴻生巨學屬辭摛藻有三代風非金玉追琢之功鳶飛魚躍之化與抑臣管窺國史祥符丙辰之春開資善訓元良針記歌吟日賚月錫天禧四祀仲冬甲戌臣殊編摩賜東宫御製成五十卷育蒙泉之德培豐水之仁帝範金鏡訓戒等書方斯蔑矣文子文孫監先憲酌祖道至于萬年永保民罔不自斯文始臣謹表而出之乾興初元八月辛亥以是集錫該輔併識于篇以鋪敡我宋重規疊矩之盛美臣謹序漢華平頌皇漢中興三葉緝熙康乂燕及皇天惠露德風坯冶泰和暢垓泝埏照景飲醴瑞命總集嘉祥備致仁及于木效異吐竒而華平生焉平之義大矣哉在天為泰階在地為嘉木世道夷陂氣感類從維木之祥品彚匪一賔連闊達紫脫平露白虎禮緯彪列其名而華平獨著于孝經援神契謂德至地則是物盛張衡作賦敡厲東京之媺春圃是植爰紀神異薛綜注釋指為瑞本謂天下平則其華平册府元龜載元和二年至章和元年華平見郡國藝文類聚述東觀記以為芝英華平史官不可勝紀沈約宋志亦曰其枝正平王者有德則生漢元和中生郡國其當章帝之世與帝也左右藝文斟酌律禮道無偏陂如砥如衡根于正心發于平治有泰之吉無否之傾煌呼休哉植物之欹器也昔在孝武竒木兆祥胡粵冠帶亦越永平木枝內附朝堂奉觴矧時珍物見象知治應圖合諜警戒默寓蘭臺諸彥獻歌踵聞景況洪禠鋪藻猶缺敢稽選注以頌以規頌曰皓穹槃物木神則仁漢以仁興木瑞爰轃赤符膺統丕闡坤珍德豐澤鬯萬象一春允文肅宗豈弟宜民仁及于木匹休周成支附葉著函夏謐清言觀于朝賢庸雋登言觀于邊柝靖燧沈美發英華治浹升平泰和融液嘉卉挺生植之春圃吐葩揚榮祥參平露光掩芝英五衢四照末數山經含章自天絢耀槐宸啓篇稽諜咨爾儒臣德至于地緯書昭敶乾行謙施帝德之純曄曄其華元氣儲精維平不猗式如玉衡太平有象品物流形其象維何萬國咸寧醴泉下滋潏露上凝匪棣之偏匪葵斯傾隨方表應欹器在庭考祥視履毖于末萌用人必公淑别慝明敷政必和直錯枉言天壽平格葆命日新右我災祚本支蕃蓁竒木旁出對述終軍解編削祍殊俗來賔木枝內附永平昌辰壽觴敬舉歡溢簮紳於赫神物敻軼前聞辨章化洽肴核仁林咸曰我后能蒔堯蓂俯陋後棄并柯成文瑞圖逌紀政令之均維德弱剛低卬以分木匪于祥戒在持盈無平不陂保泰兢兢顧名思義有媺有針文之雅詩以繼逵駰博學宏辭所業制特進觀文殿大學士提舉臨安府洞霄宫授少保寧武軍節度使荆湖廣南宣撫使判潭州軍州荆湖南路安撫大使加食邑食實封制門下位左棘以建旄兼總宣威之任殿南邦而分閫益隆統牧之名疇咨祕殿之英越在羣公之表倚重臣而強本釋真館以圖庸參錫徽章載揚顯册特進觀文殿大學士提舉臨安府洞霄官某忱恂而寬裕剛毅而沈潛緯武經文可大則賢人之業集思廣益至公以天下為心亮采日嚴訏謨辰告久贊襄于衮職遄燕佚于琳庭冠元豐寓祿之階羽儀賜位峻皇祐崇儒之秩領褎延恩養恬雖適於雅懷應變未殫于遠略眷武安之巨鎮屹方面之要衝地控重湖內欲腹心之先備疆連五嶺外如脣齒之相依銷患未形維人無競迪思高廟有若臣綱繇舊弼而命旬宣即中權而領藩翰徒得君重載纘武功是用篆車升亞保之班茸纛授益昌之節兵事不由中御合楚粵以撫師戎乘以先啓行指衡湘而植屏數路聽和門之令十連尊元帥之稱申衍圭畬陪輸幹食以新采薇治外之畫以謹徹桑未雨之防於戲陶侃啓長沙之封嘗督軍於交廣方叔振中鄉之旅佇執訊於蠻荆精神折衝則國勢張指授當任則人心靖欽承猷訓懋建膚公可授少保寧武軍節度使荆湖廣南宣撫使判潭州軍州荆湖南路安撫大使加食邑食實封主者施行寧江軍承宣使左驍衛上將軍金州駐劄御前諸軍都統制授武康軍節度使右金吾衛上將軍興元府駐劄御前諸軍都統制加食邑食實封制門下錫齋旄而啓鎮載聮中尉之華總禁旅以修戎益重西陲之寄乃眷蕃宣之俊夙殫守衛之厪疏陟典以褒勳更要衝而統戍明揚渙號敷告師虞寧江軍承宣使左驍衛上將軍金州駐劄御前諸軍都統制某果毅而朴忠沈雄而肅括營平節深料敵之威謀票騎抗旌凛冠軍之猋勇列武威而拱極臨淯水以乘邊王旅嘽嘽克壯金湯之藝戎容暨暨聿張箕翼之形迪簡豫衷茂嘉乃績念漢中之保鄣控益部之襟喉復險要於舊圖于疆于理峙屯營于東道維屏維藩師徒甫集而未和陴壘方更而未固將飭不虞之備亡踰已試之良是用新駱谷之建牙易夔江之留務鶡冠魚服升峻秩于執金犀甲熊旗侈多儀于授鉞如乾道顯忠之並命若紹興楊政之進屯以嚴細栁堅壁之威以恢采薇治外之略申加井賦增賁坤維於戲登拜將之壇決䇿蓋繇于南鄭上出師之表駐軍欲定于中原惟山川未改于昔時則事業盍參于前哲典聽朕毖式固爾猶可授武康軍節度使右金吾衛上將軍興元府駐劄御前諸軍都統制加食邑食實封主者施行誥翰林學士知制誥兼侍讀除同知樞密院事誥勑股肱一體相成祗遹時幾之戒文武萬邦為憲儀圖翰墨之英朕迪前人光毖成功所在咸平有若臣旦在嘉祐有若臣修擢繇禁林登二樞極帷幄收頗牧之績樽俎折葷允之謀無競維人式序在位翰林學士知制誥兼侍讀某養剛大之氣好深湛之思學道乎中庸總五經之眇論文澤乎仁義信三代之餘風灼見俊心贊為名命代言溫雅發號施令罔不臧勸誦從容陳善閉邪謂之敬婁訪河西之邊事咸聳山東之詔書嘉其知軍戎之情進而與甲兵之問爾猷則告我武惟揚噫夙夜基宥單厥心勿替協恭之助國家間暇明其政具嚴思患之防以乂受民俾紹先烈可授同知樞密院事起居舍人兼侍講除中書舍人兼禮部侍郎誥勑周史之掌贊書列于禮典舜官之出帝命先以秩宗朕登崇譽髦薻飾治具迪簡敷經之彥久儀簮筆之聮錫我茂恩對時妙選起居舍人兼侍講某簡亷載采博謇好修砥行立名濟濟扶陽之禮弸中彪外褎褎樂安之文仁義其言藹如直諒多聞益矣欽起居而在右君舉必書考仁聖以陳前古訓有獲丕從朕志曰求厥章昔元祐擢軾于螭塗晉司帝制紹興置遵于鳯閣復二春卿惟文學咸精能俾播告不匿指咨爾兼組賁于演綸為誥有古風罔俾仲舒之媺同日加兩命允謂知章之榮豫欲善辭令以華國汝為豫欲觀會通以秩典汝翼庶幾終譽式克欽承可授中書舍人兼禮部侍郎詔舉亷吏詔勑門下周聽治以六計亷善居先漢辟士以四科清白為首朕灼知有俊誕保受民惟前代迪厥官不肩好貨凡正人羞其行庶幾成風嘗賜劄以律貪復作銘而申訓曽是在位猶從匪彛鞭鞾不已而寵賂章簠簋不飾而節行缺退食鮮羔羊之操虐民多碩鼠之譏念激濁在于揚清而疸惡莫如彰善神爵奬朱邑之潔治盛循良開元旌王丘之亷風移苛嬈一賢蒙擢百辟鄉方肆公道之天開閔頽波之瀾倒克正罔敢弗正既昭德以塞違進良以率不良與厲精而更始咨爾承休之彥體豫美俗之懷亷欲得其真公選潔修之士舉皆賢于己博詢操履之原內則如光祿之薦王嘉外則如河東之察黃霸人之有猷有守具以實言豫其懋賞懋官亦克用勸故兹詔示想宜知悉舉將帥詔勑門下朕鑑徹桑未雨之戒軫采薇治外之憂熊羆乂王家昔何多于英傑蛇豕食上國今未敉于疆垂風寒僅數處以護吳道敝欲多方而誤楚荆益慮深于脣齒湘廣備缺于腹心雖錫斧鉞而啓元戎猶聽鼓鼙而思猛士食靡忘於巨鹿志孰奮于伊吾內無舉奉世之臣外乏代崇文之將朕為拊髀戎將生心昔高廟嵗舉六科智勇是選孝祖薦格五等謀略為先率由舊章深詔執事詩書如郤縠豫思元帥之儲䇿慮若陳湯勿求循行之備摉異能于藪澤拔竒節于偏禆爪牙官備不虞汔成固圉之績履屐間得其任無愧知人之明惟爾之能求朕攸濟故兹詔示想宜知悉表代侍講説書官為經筵進講孟子終篇謝賜金帶牙簡同侍讀修注官謝賜祕書省御筵及鞍馬香茶進詩表臣某等言伏蒙聖恩以經筵進講孟子終篇賜臣等金帶牙簡并賜祕書省御筵及鞍馬香茶者華光講藝備觀亞聖之書蓬省賜筵並錫多儀之寵感洪恩而播詠瞻丹扆以揚言臣某等惶懼惶懼頓首頓首竊以漢帝論經虎觀侈賜衣之渥唐宗嚮學瀛洲疏給膳之榮意皆寓于隆儒禮犆豐于接下矧軻書之眇指傳孔道之正宗由義居仁七篇之言靡不載垂憲詒後百世之王莫能違於穆熙朝若稽丕訓祖禹闡明于元祐表臣繹于紹興逮聖神尊德以有為于問學逄原而自得細旃晝訪聆責難陳善之規峩辨星環探知性盡心之藴華編甫徹謏聞奚禆疇侍言誦説之勞暨著記纂修之職鏐鞶絢采復朌象齒之珍玉斝示慈咸綴麟臺之席上駟式調于沃轡團龍交粲于竒芬稽古所蒙省躬莫稱歸美以報拜手載歌贊智聖之大成述君臣之相説辭陳約禮逺睎積翠之篇句寫賜箋俯效集仙之飲退慙斐墨曷對閎休兹蓋恭遇皇帝陛下居安資深守約施慱存神過化與天同流明物察倫取人為善覽大賢之論集興盛治之雍熙德醉從容秩太清之華燕幣將舄奕邁崇政之彛文臣等識愧窹疑恩霑同樂讀古書而尚友諒懷望道之思頌清廟以致平期盡正君之義臣等無任感天荷聖激切屏營之至謹各齋沐撰成謝恩詩隨表上進以聞臣某等惶懼惶懼頓首頓首謹言代宰臣以下賀奉安光宗皇帝寧宗皇帝寶訓寧宗皇帝經武要略今上皇帝玉牒日厯會要禮成表臣某等言恭覩奉安光宗皇帝寧宗皇帝寶訓寧宗皇帝經武要略今上皇帝玉牒日厯會要禮成表文謨武烈並揚二后之休漢興唐經參著一王之法森寶儲而日揭粲縟禮以星敶臣某等歡抃歡抃頓首頓首竊以監先憲求多聞啇書垂範有常德立武事周雅紀功逮開成標帝籍之名暨魯史謹䇿書之體至若觀會通而行禮尤先撮機要以舉綱兹萃進于一時冝輯成于五典允哲光皇之揖遜於昭寧考之儉勤燕翼詒謀焜耀億萬年之訓攘夷復古堅凝三十載之規有嚴論述于史筵申命纂修于宥省天啓離明之治日新賁象之文洽媺化于登三煥鴻猷于襲六瑶編溫潤金匱閟嚴繫日繫時裒嘉熙淳祐之記注有倫有要稡寶紹端平之憲章討裁分飭于羣儒尊閣載差于榖旦韶鈞焜煜羽衛葳㽔緬繅采以展儀曕冕旒而執讀事該經緯備清覽于邇英瑞集圖書肅祕藏于廣內恭惟皇帝陛下心傳精一學懋緝熙道德風烈之庶幾遹追來孝制度紀綱之能永勿替厯年功光祖宗政布方䇿率彛章而由舊據行事以鑒新文武大略舉焉聖而繼聖禮樂庶事備矣書不一書臣等欽覿聲明欣逄熙洽始于勤而治內外願駿惠于閎摹祓厥文而作春秋嗣鋪張於偉迹臣等無任瞻天望聖激切屏營之至謹奉表稱賀以聞臣某等歡抃歡抃頓首頓首謹言露布晉前鋒都督平兖青州露布尚書五兵臣元等言臣聞天下之義當混為一我伐用張仁人之兵所存者神無遠弗屆迪上帝命付中國民徐方既同而來庭宣王復古齊地悉平而振旅世祖重光整我六師如雷霆植十二郡之旗鼓不圖今日載纘武功恭惟皇帝陛下體乾粹精位履中正凝江寧神璽之祚至于萬年開吳分嵗星之祥綏以多福有方行海表之略無宴安江沱之心惟氐鞠凶至堅孔熾吞燕涼而薦食介鱗易我衣裳闖荆益以長驅蟊賊荒我居圉敢行稱亂不戢自焚師克在和雖武騎無所用天助者順聞風鶴皆為兵一戰成肥水之勳三捷取壽陽之境匹馬觭輪無反乃滅而亡簟食壺漿以迎曰徯豫后謳吟思漢震動附周臣安請乘破竹之機分命采薇之率復舊都在此行也清四海可失時哉臣等以先啓行敷奏其勇辟四方徹我土誕將天威奬三軍定中原翦此朝食推鋒而造渦頴抗旌而次彭城彗掃星流席卷雲徹欲快心于狼望庶舉秦若鴻毛虓濯征困獸猶鬪張崇守兖河而假息苻明據青社以每生食椹靡懷寢薪莫悟矧河南城堡之皆附寧山東德化之未孚乃遣劉襲攻鄄城崇棄甲而遠􅋟復俾高素向廣固明因壘而來降穆如清風丕冒出日齊變至魯魯變至道載戢干戈汶逹于濟濟逹于河底謹財賦遂鼓行于司豫汔蕩穢于羌髳時靡爭而心載寧君之訓而臣何力斯皆帝德廣運聖武布昭歸鄲歡田用儒無敵揚文武烈圖功攸終于以正六龍御天之居豈止保一馬浮江之緒臣等共武之服賴天之靈洛邑朝諸侯望翠華之回軫營丘發嘉號竣玉牒之修封臣等無任慶快激切屏營之至謹遣某官奉露布以聞唐劔南西川節度使同中書門下平章事破吐蕃露布尚書兵部臣臯等言臣聞天討有罪兵應者勝義者王暴不勝仁師直為壯曲為老多助之至四極爰轃貞觀則同羅擊延陀開元則九姓殄默啜曰商莫不來享犯漢雖遠必誅德風翔呼河源武節憺呼月􅒸率寧人之有指先元戎之啓行用信威光祖宗不以賊遺君父恭惟皇帝陛下宣昭義問敉寧武功纘八葉之鴻圖奮四征之雄略懷梟鴟銷祲沴稟卬大和剪鯨鯢清郊原掃除羣穢王猶允塞我武惟揚竒幹善芳各修貢職條支若木咸順指令邈積石之遐陬有吐蕃之醜類侵敗王略倍姦齊盟乘邊將之騁兵瞰戎亭之虛候為蛇豕食上國盡盜河湟帥蝥賊搖我疆再驚畿旬騎壒敢於深入鑾蹕至于親屯􅏌然授兵協以謀我尚納汙而含垢姑通使以結和清水之盟未乾好畤之師已聚指涇靈而徼賂闖鹽夏以搗虛夷德無厭弗悔袵金之禍楚氛甚惡輒興衷甲之謀蠢爾為讎整居匪茹維時南詔慕化中朝先零之質諸羌雖嘗并力麇人之率百濮罔不離心頓顙于邊受命于吏斷丐奴之右臂羈南粵以長纓燕貉輸致騎之勤晉戎成掎鹿之藝彼既失鐡橋之險我遂克峨和之郛盍竄匿于龍􅂒復虔劉于麟塞戕我守將墮我陴隍修戈矛與同仇靡室家不遑處臣等請奮其旅以殱乃讎鳯翔振武靈武之騎獵其西邠寧太原涇原之兵震其北率山南熊羆之校暨東川貙虎之師烏蠻撓其腹心回鶻搗其肘腋衆素飽矣一大治之諸將陳泊等統五萬軍出十一道濟師西皓之半䇿勳北陸之初蕩平七城斬馘萬級獲鎧械十五萬計燔堡壘百七十餘遂賈勇而圍昆明將乘勝而定青海偽東境五節度大使論莽熱釋朔方之衆援維州之城九攻九却之計窮七縱七禽之威速連連執訊矯矯獻囚不然我薪而自焚有如破竹之立解拂廬魚潰甌脫兔奔谷靜山空行就焉耆之僇區殫域滅汔聞智盛之降斯皆廟謨淵深神斷天造明見萬里運竒掌上之兵守在四夷制勝目中之虜勤功滇池之柱植表赤嶺之碑一怒安民文之勇也三軍用命克何力焉臣等承帝之明敵王所愾開遠門揭候坐收西極之舊封紫微殿受俘重覩崑丘之茂績臣等無任慶快激切屏營之至謹遣某官奉露布以聞檄漢丞相諭告巴蜀漢元年夏四月丞相何諭告巴蜀郡縣蓋聞天之所助者順民罔常懷懷于有仁秦失其正豪俊麋沸雲擾摩牙而爭之惟漢王先入關扶義而西為百姓請命秋毫亡所害代虐以寬若時雨降民大恱項王滅德作威為天下宰不平反易天明思肆其罔極義帝越在荆蠻未有攸底漢王失職之蜀民亡不恨者項王有背約之名天下畔之諸侯之兵四面而至夫一里之厚而動千里之權者地利也昔秦西有漢中南有巴蜀謂之天府沃壄千里餘糧棲畝轉粟西鄉方舟而下天所以資漢也秦三將亡尺寸功鬻其國而王之慈父孝子將接刃以復怨及其鋒用之若奔兒之觸魯縞未足以喻其易王已拜大將軍信決策東伐朱旗一麾三秦必從風而靡被山帶河四塞以為固乘利席勝人人自為戰雖有智者不知為楚計矣項王亢不乘姦齊盟不順所過殘滅不仁師曲為老其疆易弱傳曰不嗜殺人者能一天下湯武是也漢取天下可以萬全巴蜀固多竒士有從漢者尊顯之雲起龍襄維其時矣爾父兄其帥子弟比善戮力墾災除害毋隂拱以觀其孰勝王之入關悉除去秦法舊染汚俗咸與惟新縞素為資珍物無所取非富天下也養其民以致賢人行仁政而王莫之能禦也楚雖大何畏焉用歷告爾新造邦尚永力畋爾田寧爾居毋蠢不靜以自速辜吏以仁誼教訓辨告勿行苛政明聽之毋忽唐河東保寧等軍行營副元帥諭晉隰慈州檄興元元年八月某日河東保寧奉誠軍行營副元帥北平郡王燧檄告晉州要君廷珍隰州毛君朝𤭔慈州鄭君抗及將士吏民等蓋聞率土莫非臣盍念在三之訓明王伐不敬有嚴討二之刑義士不求生以害仁智者能轉禍而為福其畢棄咎咸與惟新我國家九葉繼明億年凝命天保以上采薇以下內撫外綏濮沿于北祝栗于南德洋恩普神旌遞引窫窳咸誅堯治時雍猶有青丘之梗舜風天幬未除丹浦之凶李懷光奮渤海之俘授蒲津之節始謂狙之作使不虞鷹之易揚奔命醴泉粗展勤王之績請朝行闕輒衷犯上之謀猶念前勳婁靡好爵張萌牙于霜雹悖木水之本原升鸞之諜肆行巢父之使弗返奪二軍而殱良將剽三道而翦近畿豕心莫悛梟音不革已復漢京之日月載掦周旅之霆雷幕府承命齋壇建牙列鎮正正之旗堂堂之陳莫我敢承赫赫厥聲濯濯厥靈有征無戰渾侍中率同陜之士韓僕射統邠寧之師唐節度虎視鄜坊駱將軍熊跱鎮國風雲助氣草木為兵詔參伐以清氛命招誓而繕怒不俟前茅之邁行成獨桞之誅惟爾三州之士夫夙被絫朝之德澤嶠從處仲適受逆汙遵事隗囂豈為賊守鼎魚假息穴免阽危犯大義者衆必攜作不善者神弗赦厯數古今所記未聞叛逆獲全惟嶽阻兵汔膏齊斧朱泚竊號亦梟稿街矧兹狄孥敢干天罰犬馬猶有主覆載不容鯨鯢取以封脅從罔治聖上禹湯罪已文武行仁凡鳴狐假王之妖首鼠觀釁之將莫不匿瑕宥戾磢垢滌郵雖三子猶存蓬艾之間豈太陽不回葵藿之照尚式王命共惟帝臣勿相依于輔車以俱焚于玉石儻能洗心效順解甲來歸績獻關東疏封帶礪融全河右紀烈旗常若迷復怙終冘豫不斷蹈于顯戮諡為至愚豈惟敷虐多方亦將遺臭千載請擇二者永肩一心耆定爾功復見弓􅐤而戈戢式化厥訓庶幾世變以風移檄到如章書不盡意針漢典星針惟天不言以象設教惟聖時憲以星為紀昔在顓帝司天有職堯命四子爰考星中蒼籙質隆靈承乾則保章志變馮相會位下逮列國亦有司星宿離步占咸宿其業炎劉闓統顧諟明命治星列于太史候星設于靈臺厯志逌紀復有典星太初之元更造密度時則射姓與其議永元四祀考驗黃道時則姚崇并畢等十二人言其法厥初建官將以欽厯象在璣衡非徒傳臯唐甘石之術而已夫星體生于地精成于天為名百一十八積數七百八十三在朝象官在野象物在人象事此動彼應上下同流存于君心著于祲象伏見蚤晚政治之候飛流陵厯踐履之符宋有善言星斯徙度齊無穢德彗乃可禳以人占天休咎景嚮漢之星官茂明斯道必將誦節儉之規而泰階六符不待臣朔之陳矣必將述寅畏之訓而清燕指圖不待臣向之奏矣若稽史籍針諌蔑聞而元光星搖之異僅載候星者之言視虞人贄御寧無愧與紬繹漢事為補亡之針曰煌煌乾度臨下有赫百十八名象載昭察星官有書肇自有熊德隆晷星清明在躬舜察璣衡勑天之命周辨妖祥以詔救政我漢懋德寅畏明威步占列宿臣敢不祗衡正階平維文節儉民勞星搖維武征伐見道知治以人占天暗室修省辰緯森然心曰前星建嗣必豫畢為天街邊氛是懼三能未齊論相惟人營室雖中土功勿興五緯珠連填為之主心思先正五事咸敘女宫在後次乎少微賢賢易色對越不違監于建始爵私外屬祲象著郵流星下燭監于永建寵任左貂彗茀垂異適見招搖毋曰蓋髙陟降左右毋曰不顯景嚮休咎鏡考已行應不以文滿讕誣天匪臣攸聞長星紀元德星貢侫皓穹仁愛云何弗敬毋汩緯候謂災可移毋泥分壄謂國無危朔陳階符向指圖狀矧臣庀職敢忘諷上欽若厯象兢兢如堯小臣司占敢告內朝漢柱下令針聖人法天建官卬稽乾文北極之東一星彪列柱下有史是則是憲在周曰聃在秦曰蒼以記言行以掌方書漢祖肇基蒸髦籲俊官師諫爭罔匪正人旦夕承弼厥辟若昔哲王起居必欽號令必臧實賴左右之士迪于丕彛秉筆殿楹如戎夫倚相之職曷可不謹其選維五年命山都侯王恬啓為柱下令所以司紀載謹言動也百官表書恬啓為郎中令功臣表兼述之顔氏以為主書之史考諸傳記法冠曰柱後侍御史曰柱下尹東都樂何之徒抗議柱下有繩愆格非之責焉夫衛武之聖史不失書魯莊之暗書而不法君德崇贊常必繇之二漢舊章世有注記而孝武録于禁中永平纂于宫掖官失其守豈識高皇帝閎遠之規與敢擬揚雄之作而針其闕針曰巍巍萬乘天臨淵默厯之春秋言法動則載筆有史造專帝鴻我漢初基山都是庸表裡交修身度聲律臣節不回方駕狐佚媺惡無隱欽乃逌司百九十篇著記昭垂監于周季仇忠比侫𣆀居是職雖賢罔任監于嫚秦翳諫飾非蒼備厥官雖失不規作而不記匪德之盛必逺其猶訏謨定命書而不法俾後可觀必謹其行無敢逰盤剪桐有諷如棠有諫毋味諂言以直為訕倚几有訓書楹有銘毋邇宵人以逸肆情思古良史左誦右頡云何成憲墜于中葉內廷纂録自親其文諸儒雜定直筆蔑聞君舉必書繩其祖武史臣司過敢告􅉏御銘商王磬銘樂以玉振之終條理也惟商王受球膺命作樂曰濩九招晨露是修是歌八音鈞諧神人洽熙垂𥙿後昆明德恤祀猗那有頌奏假蒸嘗鼓管和平來依磬聲先祖聽之歆馨降嘏微哉淵呼若稽毛傳磬象物成鄭箋述之指為玉磬蓋和聲依永無相奪倫非泗濵石所能致必縝栗其璞清越其音始克為衆樂之綱紀昔者簫磬九成鳴球在上四代樂器拊摶並敶虞夏舊章惟啇時憲想夫三朡之寶空同之玉乃磨乃琢從律中度虹氣孚逹煥乎崇牙于廟于郊翕純皎繹視叔之離磬周之笙頌不侔矣頴逹書疏兼述啇頌且謂磬垂堂下尊而進之宜與湯盤俱列銘典漢有璆磬猶播雅詩兹不可亡識其銘曰瑟彼球玉畀于武湯維玉之聲清越以長思昔鳴球合奏舜堂后夔拊之獸舞鳯鴹矧豫湯孫奉時蒸嘗豈無玉豆肆享先王亦有玉斝清酤是將奏假維何猗那一章曰鼓淵淵曰管將將衆音疇依磬為之綱典寶之珍烈祖所藏載攻載錯摩其專旁銷鳴應律崇牙髙張大濩始作萬舞洋洋集厥大成雅韻清揚聞樂知德如圭如璋王假有廟申錫無疆禹興九招貢石徐梁東生西頌周典有常孰若英璞鍾粹乾剛神之聽之自天降康鬯圭並寶僅見魯邦紀甗偕賂器存實亡惟德其物專媺有啇制陋漢梢瑞軼夏璜勤銘于虞德音孔彰周瑞節銘維周王撫萬邦征不庭旁作迓衡治定制禮論志以使遣使以節制節以瑞重命令昭德信也若稽周官掌節有職行人攸逹厥制惟六金有虎人龍之别竹有旌符管之異都鄙貨賄曰角曰璽昈分殊事用各有冝惟時邦節瑑以良玉庸輔王命珍圭召守牙璋治兵榖圭七寸和難聘女用焉琬圭琰圭九寸治德易行用焉典瑞辨其名王人著其法康成釋經兼述五者謂之瑞節想夫井里之璞禺氏之珍追琢其章虹氣孚逹張旜濡轡肅將明指執而致命拭而展幣燀威彰信風動霆行文告義征罔敢不率覲圭摯寶臚湊羣辟欽我王度如玉之純十有一歲則命廣行而逹之和難弗辟則與調人而執之逺揚邇昭德鬯禮洽皇呼媺哉其守邦國之大寶與內史過曰瑞節以鎮之秦西乞術曰瑞節以結好聘禮圭繅九寸康成亦以為瑞節冝在銘典匹休嘉量敢為補亡之辭曰於皇時周王度如玉宣昭義問函夏砥屬節傳四馳法式鼎新侯角侯璽或竹或金皇皇者華有嚴遣使追琢虹璞犆名曰瑞守以掌節逹于廣行玉人裁模典瑞辨名瑟彼珍圭鎮安方國召爾封守惠爾囏厄七寸鉏牙起旅之璋和聘有圭榖文孔彰羣辟承德時聘嵗覲曰琬九寸要結好命彼不庭方慝行未除判規之琰乃諭乃誅咨爾王人所實惟信來旬來宣圭璋其聞寶不踰把光溢周原以瑞等邦式禮莫愆軼漢虎符異魯龍輔舜玉湯球參媺前古侯氏奉璧蠻方獻琛不令而行佩我德音瑞雖有五王心惟一欽哉膚使視此瑑刻記漢百官朝會殿記皇漢稽古建官立三公應台鼎司徒為丞相之任贊元穆縡位冠列辟中興二葉憲度鴻明號登承平越十五載更作司徒府于開陽門內光觀壯麗萬國具瞻迪惟詢謀僉同虞書垂訓謀及卿士禹範陳法時有大政政有大疑必集羣臣議之咨一相決之乃於司徒府建朝會之殿以繹師言審國是煥呼一代閎規也棟宇修廣史䇿無述獨於周禮注漢官儀律厯百官志注概見顛末庸識其事以禆史闕太微中居列宿環拱聖王正表著之位辨亷陛之等法呼天也蒼姬制禮天子三朝燕朝列路寢之庭太僕掌之治朝居路門之外宰夫司士職之惟時外朝視內為重雉門外者小司冠以詢萬民三公州長暨羣吏敘進臯門內者朝士掌建其法孤卿大夫暨衆庶咸列蓋建朝于外則尊卑之分肅咨謀于朝則上下之情孚公聽並觀訏謨定命聚精會神之地其可忽諸漢監秦轍逹聰垂明髙皇肇基下詔長樂相國建議實始權輿或大議殿中或會議溫室朝堂百僚之位有蕭曹魏邴之謀謨公卿以下朝會坐載于成紀建始元年之注坐而論道流風猶存丞相府有四門隨時聽事坐未央廷中單于拜謁體貌匪不嚴也然問望之計䇿則遣中朝持單于之語則視中朝具復廟之文則詔中朝臣議王嘉之事則下將軍中朝者丞相以下為外朝顧不與焉宫府體分與周異矣黃霸問郡國計吏舉孝悌為一輩先上殿説者謂丞相所坐外朝之制略而未詳東都重熙卬憲周典德陽朝羣后象魏旌舊章上儀祲容焜耀千古眷詹公府輪奐未崇經之營之遹新廣殿彤庭殖殖左墄右平王侯更衣于殿之西位寧森嚴規撫璉敞堯衢室舜總章何以侈兹國有大議車駕親幸其殿則應劭之書可證百官會府公殿下則蔡雍之言可稽續志逌紀熹平四祀臣光臣晃傳奏厯元乙卯詔書會司徒府議雍集所載在三月九日其位校尉東面侍中中郎將大夫千石六百石南面議郎博士北面戶曹令史西面中坐讀詔臣雍前坐侍中西北近公卿與光晃問難朝章邦典賁然明著想夫三事在位百辟在庭周爰咨諏知略輻輳帝暉下矚稱制臨決衡石公論蓍蔡羣疑匪徒會同有繹而已故龍闕對峙榱題翬飛人不以為華鈴鼓不設扉闥洞闓人不以為簡鳴玉峨冕翼翼翔翔吏治否臧民生休戚天聰四闢無隱不敶受計則計吏數百人拜于庭中舉謡言則掾屬令史會于殿上崇輔弼以尊國體意深遠哉若乃論于白虎朝于雲臺見于宣明問于崇德隆寬盡下史不絶書兼聽廣謀莫若斯殿康成釋禮兼述漢法于朝士曰今司徒府有天子以下大會殿亦古外朝于稿人曰百官朝會殿天子與丞相舊決大事是外朝之存者劉昭謂于寶之説殆未深考小宗伯肄儀為位康成謂若今肄司徒府又非止為大會設矣蔡雍紬書東觀立朝會志未就詳莫得聞竊嘗考之周中朝聽治漢前殿也周內朝圖嘉事漢宣室也東都前殿為路寢嘉德為燕息見于張衡之賦而景秉傳云公卿會議常上殿訪邊事若袁安班勇皆于朝堂上書會議又有召百官議朝堂詔百官大會朝堂亦外朝遺意通典曰周有四朝而言三朝者詢事非常朝也是殿其詢事之朝歟聘禮君與卿圖事康成曰謀事者必因朝其位君南面卿西面大夫北面士東面漢制蓋倣此云謹記唐七學記有唐觀人文化天下高祖太宗戢兵耆武尊右儒術綴禮正樂憲度著明庠聲序音鏘訇金石稽古建學厥制維六元宗纘緒復增其一課試有法訓迪有師德藝兼該總于胄監譽髦斯士雲合霧雧豐規茂矩冠冕百王宜祓厥文具詳登載謹參合百官選舉志儒學傳序六典會要而記其略夫教亦多術矣開數路而翕受皇極之化也萃羣材而樂育菁莪之仁帝治時雍成均肇建有虞養老庠分上下夏氏設教序列東西左右郊宫啇學殊制作人造士匪一而足蒼姬之盛教典尤備國學合子弟太學食老更四郊有庠門闈有學或讀邦法或習書數逹材成德道化渾融祭義攸述為學有四保傅所紀為學有五學記之注曰內設師保外有庠序六學之制于兹可考治古逾逺彛憲無傳漢立三雍晉興兩學元嘉四學之創天監五館之開名存實亡駁呼亡議惟唐文治炳蔚上軋成周鉏纇夷荒鴻業甫定生員之置肇于武德元年五月周孔之祠建于二年六月恢儒鄉學敷遺後聖爰暨貞觀駿惠前猷臨幸國庠延籲儒彥肄業之舍廣為千二百區著録之生益為三千二百六十員施于六葉增闢學館襲舊為七若三品以上子孫國子學教之五品以上子孫太學教之曰廣文以領國子生之業進士者實維天寶九載七月乙亥之制曰四門以授七品之子及庶人之俊異者實維元魏太和二十年之制律學昉于晉梁復于貞觀六年之二月又復于龍朔二年之五月越明年以隸詳刑而律令格式法例于是習焉書學昉于晉隋復于貞觀二年之十二月又復于龍朔二年之五月越明年以隸蘭臺而石經説文字林於是習焉算學沿隋之舊置于貞觀二年復于顯慶元年越三年九月廢之以隸太史及龍朔二年復之以隸祕書而九章五曹綴術緝古之屬於是習焉訓導之職有祭酒司業博士助教直講孫其業也舉選之科有秀才明經俊士進士明法明字明算興其能也業成則丞蒞試不率則簿舉法嚴其訓也國子有五經博士廣文有知進士助教重其選也助教或十年始遷博士或十九年不易顓其任也生徒之數國子二百人太學五百人四門千三百人書律及算總百十人元和三祀申命更定西京自八十至十人東都自十人至二人而國子學有大成上元二年初置二十人開元二十年復省其半若舍奠齒胄之儀皆行于國子學又本末先後之序也想夫紆袂鼓笥來遊來歌鴻生石師論難衎衎投紱懷璽濡化染學元武飛騎垂襟講習新羅百濟挾䇿吟誦豐芑燕翼之澤棫朴追琢之章政媺俗醇作周匹休猗歟懿哉鋪觀唐史立學闡教蓋非一端左省弘文武德之制東宫崇文貞觀之規並置生員是為二館祕書小學以誨皇族內文學館以訓官掖崇元有學以習老莊郡縣諸生差列二等若崇化厲賢之原則自七學始以至龍朔改司成館垂拱更成均監司成宣業官名婁易兹不備載按鄭虔傳廣文寓治國子館李庾西都賦曰左立太學前列廣文選舉志止言六學何蕃傳亦云六館意者二學合為一與韓愈上表有七館之稱併書以識舊典謹記贊寶元紫微閣御篆贊天隲下民闓我宋離明之運三聖傳序文治彬蔚睿謨宸藻光摩壁奎越我仁宗皇帝重暉襲明日燭月霽稽經典學苞舉蓻囿穗書緑字入神出天顧瞻玉堂爰暨祕閣昔在淳化龍箋紅管躬灑飛白霞舒鴻翥昭揭霄漢矧時右掖發令代言常揚髙崔振纓接舄儲清聮邃冝闡宏規寶元之元律中夷則日躔庚戌渙發宸指鳩工建閣翬飛鳥革穹麗豐璉凌轢石渠天祿翔鸞棲鳯右乃御帝鴻之墨海掞漢宫之寶跗冠名紫微載篆户册金壺霏泚爐錘造化如商盤周鼎之識如羲畫禹銘之文非煙祥風緣飾萬象丹青綸綍益煥其章開元集賢之題莫能窺帝書萬分一臣竊惟仁皇多能天縱邇英延義左右圖籍羣玉蘂珠優繇篇翰景祐律凖之字皇祐明堂之顔八體六書神謨心造韜軼頡籕前無千古斯閣之扁文化恢焉儒術崇焉彼漢篆未央晉書太極奚異螢耀之擬龍燭與於萬斯年極天比峻環宫列宿是衛是翼冝敡厲而顯詩之為無窮觀臣俟罪書命衣被昭回之光拜手祗贊贊曰乾緯宣精紫微環極維聖時憲設官分職開元名省延籲鴻生秉筆贊命神化丹青濬哲維宋煟興文治星旅奎鈎麗離明賁常揚接武鴹于鵷池參盤襲典潤色綸絲允文仁皇積思書圃天葩聖藻萬象咸覩旃夏穆清瑶管春容被物成飾吉雲祥風律凖之畫明堂之扁河龍獻藝有赫竒篆眷言西掖英彥所躔傑閣鼎新上薄凌煙錯寶之跗元氣沕穆錙銖斯冰粳粃籕邈金字特書玉題揭名雲漢昭回粲為列星翠緌鳴佩於焉遊息仰睇慶霄斧藻失色若宓戲畫原于緑圖若神禹碑刻于螺書􅑕騫鳯逸超絶畦徑八法森嚴心正筆正淳化飛白木天玉堂維帝之書祖武重光祥符聖製翔鸞鏤石維帝之書文典時式毫專膚寸雨露羣生訓謨渾噩虞周比崇追琢其章辭尚體要如篆之古摛華演誥鸞刀刻銘寶奎題顔邇英分錫迎陽縱觀天球閟臧鏐繩鈿軸俯陋唐宗平雲芒玉倬彼曽宇虹采屬天詩以揚之何千萬年周七律贊律者音之本也河圖授羲粵有律法含少比竹昭華刻琯立均出度成於十二黃虞迭造聲數靡易律之有七其周之盛呼武王燮伐遹駿有聲於鑠王師致天之屆惟十有三年嵗躔鶉火月旅天駟日紀析木辰集斗柄星次須女是協天黿五位三所合而用之繇張及房其宿七列繇午至子其揆七同數合聲和播之音律二月癸亥畢陳以夷則之上宫于牧之野布戎以黃鍾之下宫太蔟下宫以布令無射上宫以布憲曰羽曰厲曰宣曰嬴簫勺隂陽正變咸備翕純皎繹神人洽熙勝殷遏劉無競維烈律之時用大矣哉司樂典同宋寥亡詔景王二十三年問伶州鳩意謂五聲及宫徴之變州鳩鋪敶數度外傳載之鏗訇渾鍠如聞象武宿夜之奏隋志明舜樂之七始社預釋左氏之七音琴為七弦則淮南之注律為八十四則服虔之説戊午至甲子七日則孔頴逹之疏楚語七事樂纂七聲或云七宗或為七調七均咸自州鳩啓之稽諸六韜律可知敵大師執律爰聽軍聲武王兵書昭著丕式史遷謂推春至冬桞宗元謂大武律變漢加應鍾唐終南吕至有除黃鍾而首林鍾者音官失傳久矣周玉律有八江左世薦之兹律不以器傳而武之七德寓焉庸墨筆操牘而作贊曰龍畫肇分律繇數起鳯鳴既聽聲以月紀於皇時周燮伐戎商廣文之聲我武維揚印詹北維俯察周壄姬出天黿稷緯辰馬維鶉及駟躔次有經自午至子會朝清明位協于五列揆以七聲數自然寫之玉律太師載吹下上其宫羽以夷則厲以黃鍾太蔟無射布宣憲令昭德柔民徂維求定隂陽遞代宫為之綱既備乃奏鍠鍠將將矢于牧野莫不震疊振旅嬴內愷歌鏜鞳爰命司馬執以獻功功成作樂和鳴肅雍琴增七弦頌美七德興文匽武簫勺羣慝往著再始復綴六成窮本知變樂行倫清七衡之響紀于含少侯今之制威聲燀耀七始之詠揚于簫㲈侯今之制德音孔昭宿夜失傳象武孰志均調猶存正五變二一氣二體八風九歌終始相成天地同和聲與政通兹律維則播以雅詩時萬時億頌至道朝元殿册皇太子頌天以宋克堪用德迪從子保萬億年永孚休太宗皇帝廣聲揚烈燕及皇天幼海五潢發祥流慶壽街辨牘虎闈齒胄金聲玉裕敷聞在下帝惟有道之長必蚤定豫建鞏我邦丕丕基至道之元仲秋壬辰誕布明制肇闓承華丁酉詔臣白贊禮儀申敇有司曰上嗣主鬯古有册命百官會位太極臨軒則漢唐之典在備物盛容揚于大廷丕天之懿鑠也咨汝悉奏其儀朕將御路朝行之繇是頌家儒官稽經綴禮范金為寶厥方二寸龜紐朱綬鏤瑉為册厥簡六十錯以龍螭展詩應律厥名正安奏以二曲疇咨太史厯吉季秋供張宿陳容衛肸飾黃麾設仗鸞車充庭薦佾旅階鐘石在簴萬官千品駢璧交舄中嚴外備禮牟元會銅扉洞啓玉契載朌皇太子冠逺遊服朱明端士正人前導後翼丁卯之旦皇帝被衮龍下雕輦御于朝元殿天華爽霽日宣重光聖言溫純參盤襲誥紫微令讀之左庶子受之穆穆儲儀丕承顯命上公羣辟蹈舞稱賀遂展慶于清宫目銀榜之題耳搖山之音煥呼重離之光麗焉赫呼洊震之響發焉越三日庚午金路羽衛祗見世室班輪回軫都人具瞻眉龎齒鯢未覿巨媺湛恩作解靁動四域光溢雲漢榮鏡宇宙猗與休哉是殿為周外朝唐含元實朝會册拜之地雍熙元年七月壬子改乾元為今名天禧行于天安乾道藏于大慶衣言繩武永作彛憲洋洋帝者之上儀宣政紫宸之禮比兹褊矣冝命鴻生弦次初詩繼樂府四章之作臣敢鋪藻而揚言曰古帝命宋靈承于旅葉萬年億重規疊矩皇矣太宗盛德淵溥文條武鬯四方無侮永錫祚嗣椒實螽羽鴹吉二觴有秩斯祜於昭元良賢能繼禹朝夕寢門春冬胄序溫文恭敬川原卬浦若昔令猷入監出撫離照相續電鬯是主萬國以正建立必豫遹駿有聲知子惟父渙其大號命爾儲副刺經攄頌自我作古司空讀册漢有憲度暨唐太極肇新儀注豫其時式徽典備舉范金瑑瑉龜紐朱組繅龍繪螭騫其欲翥昭時令日禮展樂具巍巍朝元聖皇當寧天臨日燭龍卷繡黼臚人虎士擯相何扈麾仗上黃星敶雲布巾車展軨彪列鹵簿四垂高張鱗簨毛虞正安入奏鋗鳴律吕翼翼皇儲夙駕金輅逺遊朱明命服有楚雞戟鸞旌從以師傳延登受册陟降拜俯是承是將惟左中護尉臣奏賀萬官抃舞扶光若英重耀霄宇碧鏤啓扉肅肅鵷鷺移班展慶聳觀玉裕銅輦班輪祗見烈祖乾闓坤懌神人樂胥于時公卿于時臣庶于時夷貉交相告語上儀鴻明曠古一遇滌瑕肆青巽風解雨少海之波流澤率土唯聖立聖頌聲載路長治久安冠軼三五燕詒世哲蹈則繩武天安大慶祲容重覩神孫承承旗翼丕緒暉潤作歌贊述有賦允鑠聖代禮崇媺巨下臣獻頌式綴樂府唐觀德殿飲至頌唐太宗文皇帝天錫勇智開闢乾坤丕降霖雨剗茶滌茀仁聲義實邇昭逺揚羽族卉儀面內稟朔凌煙置酒頡剎就霸未央髙會智戴入侍元武燕饗酋長畢雧豐貂文駟旅于象胥榛履熊冠圖于王會際天接地武猋旁魄逖彼麴氏長雄髙昌文泰猖狂怛威赧德狐裘納摯扶伏入朝鼠匿雉奔不式王命稱兵焉耆西域遂梗粵十三載季冬壬申爰命驍將濯征交河馹騎龍旗踰沙軼幕虜渠怖駴日照雪消臨衝間間應鼓如截明年八月癸酉克之智盛請降襟甲鼓下青海如鏡欃槍不芒遂砰轒輼藉甌脫灰罽帳雲徹席卷披置郡邑九嵕之植于蔥嶺鎸功紀伐卷斾而還左律右鉞軍容燀耀振旅愷入京師十二月丁酉龍駕帝服御觀德殿庭燎晰晰羽衛葳㽔鴻臚舌人虎賁爪士九賔四貉咸造在庭諸將戎服振振奉俘馘以獻天子臨軒受之乃舍爵飲至以數軍實禮也于是宗伯奏儀司馬辨位旌茷林植供張星敷金介緹衣髶髦戴鶡萬旅鳧藻踊躍就列鼎脀俎載百籩千品罍斝交錯犧象靜嘉房殽體節之羞醙清鄼白之勺稿飫于顔行七德九功之舞羽薦橫吹之音曄煜于觀聽既醉之歡洽偃伯之頌興執訊連連慕風嚮義單于日逐圜視膽栗金幣軨積圭組繽紛班勞䇿勳周匝宏溥禮成畢賀于廟薦功皇澤賜酺雲油雨霈前而順天之獻捷後而紫微之受俘稱伐計功莫此為盛拓地萬里威震八荒隨流而攘鄉風馳義芳蘭張飲天成浮酒上儀偉觀史不絶書施于開元契丹授首爰即酺宴復行是禮宸章賦詠丕顯祖烈於戲盛哉殿在元武門因射立名貞觀永徽咸以上巳賜羣臣射總章之元遼東底平即是宴百官然武功文容二媺兼備未有斯舉若者是役也有臣行本刋頌桞谷布昭威靈維兹茂典鋪張猶缺昔飲御諸友小雅歌之飲至大賞春秋紀之是用作詩以鴻厥慶頌曰曄曄太宗涉禹之迹天戈遞討函夏清謐劙隂披霧耀以月日明謨指授將猛四七纓厥緤渾神扶電擊陵海越障蛾伏詘膝聲暨德綏條支祝栗簫勺嚚頑正心翊翊狡焉麴戎狼性隼質雍閼琛賮不庭不率皇赫斯怒剪此朝夕命率交河成師而出旦秣我馬夕臨其國長轂雷輜機駴蜂軼酋渠灰釘餘種氷釋鏤體卉衣係頸銜璧州三縣五如入吾室坦步蔥雪疆宇載闢葉護齒寒不戰自屈抗稜荒裔銘功樂石振旅于亰秉鉞執律愷歌示喜鼓吹轟激執訊連連象胥絫譯六師大獻天容愈懌序情閔勞匪疚匪棘展儀廣殿時維觀德校隊案部羽林壘壁削祍改襟星共陛戟衮龍臨幄綵仗肸飾纍纍其俘厥角丹墄百蠻破膽墮玉失舄逆子有誅視彼攸馘飲至大饗乃數軍實矛不折寸鏃不遺一悠悠斾旌萬旅如植矯矯虎臣韎韐有奭班馬無聲顔行山則干羽陳階金匏在席鞮鞻效技僸離俱集樂增十部於粲葆佾蒲筵紛純黼帷藻帟山豆瀛尊左右有秩酒車騰酌鐐盎浮溢殽蒸房俎羞炮燔炙一朝饗之在師中吉湛露晞陽帝暉咫尺舌人體委惠浹夷貊式燕以衎率禮無失都護奉觴臚湊羣辟舍爵䇿勳皇有蕃錫扶圭綴組湛恩沕潏熊羆鳬藻賈勇奮力肇開西昌膺貢受籍帝惟不矜常武無逸紫微獻捷涇陽鳴蹕祲容婁書鴻烈赫奕開元繼代耆定徦逖行於酺宴播咏宸筆乃武乃文丕昭帝式宵雅歌周勞率暨役歸鎬飲御吉甫紀績於鑠唐兵爰轃四極鐃曲未奏崖頌靡述維以頌歌震于殊域序漢保傅傳序保傅傳者漢梁太傅誼所作也漢朝之儒惟賈生粹學淵識通逹治體謂元良天下之本本正而天下定若昔大猷保身傅德罔匪正人涵養薰陶相觀而善用敷遺後人休乃乩往證今參經訂史總眇論以詔萬世孝昭嗣服鄉學崇儒是傳與孝經論語尚書迭敶旃夏大義之通見于始元五年六月之詔煌呼休兹育德之淵原典學之矩范也庸鋪繹要指而為序曰聖人觀洊雷之象是以詒孫謀燕翼子蓋取諸震觀山下出泉之象是以選左右蚤論教蓋取諸蒙相古先民丕若厯年罔不在初自貽哲命禹戒湯訓文謨武謀啓迪後昆兹率厥典立之師保謹輔道也教之禮樂頥德性也抗法以聳其善齒胄以孫其志斆學之制文王世子備矣是傳尤正于始而謹于微八嵗入虎闈束髮就太學不待成人而教也太子始生舉必以禮太師吹銅正聲太宰持升正味不待就傳而教也胎教之道書玉版臧金匱不待初生而教也有道有充有弼有承史司過工誦諫巾車有教膳宰有規不惟三公三少孝仁禮義之道習也始敶周秦之隆替終論賢佐之得失復以詩禮易春秋明謹始敬終之義曰學禮曰明堂之位曰青史氏之記三代文獻森然在目如旦佚之立前後望奭之翼左右其末章曰鏡所以察形古所以知今誼之意深矣傳亥匪人嬴轍未逺逸民翼惠亦罔克夀孝文初載肇立元子越六年誼孰數于前曰選端士曰去邪人然智囊之進刑名之習以規為瑱聽之藐藐後九十餘年昭帝始誦習之業隆于繦褓德牟于成后誼之書有助焉乃若大夫進諫白虎通述之帝入五學雍宗元識之鸞在衡和在軾頴逹詩疏又稱之㢙與王度記太初篇韓詩內傳並言班史本傳概而未詳嘉言丕彛千載眇覿愚謂著翼善之記不如監是書而善自明撰飬德之傳不如寶是書而德自進青宫之紀博矣讀是書知其寡要也榣山之則媺矣讀是書知其亡實也輔翼之臣有能采而獻之可以衍幼海之潤增前星之暉萬年惟王永保民蓋自兹始敢著諛聞于篇端按新書五十八篇是傳分為傳職保傳容經胎教四篇文頴謂在禮大戴記今列于第四十八篇凡二章三千五百五十四字云謹序唐西南備邉録序唐大和四年十月戊申制詔兵部侍郎臣德裕節度劒南西川維蜀西控戎索南接蠻服昔在中葉武尅不剛蟊賊內訌蛇豨荐食表撑裏拓猶懼侵軼未隂綢户莫急二邉于是先事候情并謀合知料敵藝攬地險討軍實而備邉録作焉即十三卷之簡見萬里外之情所以制勝無形銷患未萌也兹不可亡序夫備敵于一方其䇿易備敵於多方其謀囏朔方既城薄伐于西方王其勤也玁允既攘鞠旅于南宣王其武也針芒寫氣蟻穴潰隄知慮不周扞防不密則壃場之虞不生所玩吁可懼哉然山川厄塞非圖莫見兵財盈虗非書莫著是故軍防有録撰于天寶九州别録上于貞元禦戎新録奏于元和元振述安邉之䇿敬輿條備邉之失前英後傑帷籌幄畫詳已然之變忽未動之憂寢薪為安折栁為固猷之不逺寇將生心德裕身佩西垂之任得不為南鄙慮乎方唐盛際德威溥暢北縻突厥東憺遼海窮髮反景悉主悉臣文恬武嬉喪羊于易吐蕃間釁河隴失險締縱南詔協以謀我岷江飲馬倚為先鋒井絡紳垠我圉孔棘有守曰臯鑿青溪道要結蠻好犄鹿效順纂集事狀為卷十七質幣結轍闓户誨盜戎瞻雖讋蠻禍始牙罙入成都如升虛邑唐之君臣且旰食矣疇咨良翰嬌失刷耻爰命德裕抗旌秉鉞葺殘奮怯改紀其政乃建籌邉之樓凡險要與蠻相入者圖之左與戎密邇者圖之右而部落饋餫靡不察乃立雄邉之軍其精兵曰南燕及連弩騎士曰飛星及突騎而農戰器械靡不飾大度孰制城以杖義榮經孰控城以禦侮西山郭厄城以柔逺復卭崍關徙越嶲治而蠻之齒寒怛謀納欵維川歸壁而戎之氣奪猶盧敵去而備弛也兵將糧械之數城鎮種落之名嵗計經用之目講求利病輯為一書諸郡固實外夷情狀昈分縷析粲如指掌創立陴壘咸以朱書總會小圖標之首卷而第四卷敘維州本末尤悉書成于大和六祀逮會昌中秉國之均始奏上之觀諸文集猶有可考二邉方騷而金湯之二虜孔熾而雷霆之匪石畫沈幾曷克轃兹藏之禁嚴副在邉瑣日戒夕愓庶克有定大中而後慆憂好暇懷燕安之毒玩鷙擊之形河湟歸疆西顧無騎壒矣厲階之梗惟蠻為其𤭔粳及米繇劒而嶺乾符之季有臣雲虔自雍管涉川陸四十七程至善闡以南詔録三卷獻于朝吁德裕之録以蜀備蠻藩籬之寇也雲虔之録以雍備蠻則闖然入户庭矣憂先於事事至而憂奚翅銖石之差與據舊鑒新不可不毖患于微眇也易之蹇曰利西南必有六二匪躬之臣而後能濟蹇難德裕以之按唐藝文志是録列在兵書今館閣書目存者一卷餘軼不傳我思古今愛莫起之撫陳編而三歎謹序玉海卷二百四玉海後序鴻濛既判六經載道厯代諸儒著述辨析至宋而道復大明事類之書亦至宋而益廣廣其述者厚齋先生為最焉先生由詞科擢登祕府讀天下之書而識于一心以一心之所識而著述玉海之一書極天地萬物與夫古今禮樂制度咸備于此祕藏于家逮今百有餘載至元丁丑嵗浙東宣閫都元帥資德公知是書而發其祕俾鋟梓以廣其傳是時經厯賈君亨都事耿君朵羅歹來贊賓幕俱篤意斯文以是書為己任盡心協力克成厥功而元德實奉檄董其役閲二載而刋始完嗟夫是書也昔為王氏家藏之書今則為天下之書矣以先生一心之微博覽天下之書而著于一書今復以是書而行于天下其惠後學也豈小補哉若夫論著書之旨要已見于序文愚不復贅姑記刋書嵗月之始末于卷後庶使後學之士知是書之幸傳于世不易也至元六年四月朔日勤郡文學正東嘉薛元德序
