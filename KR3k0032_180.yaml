body:
  text: 玉海卷一百八十宋王應麟撰食貨錢幣太玄經曰古者寶龜而貨貝自虞以上後世君子易之以金幣自夏以下通典曰夏商以前幣為三品太公立九府圜法周景以母子相權秦為上下二等漢為八銖莢錢白金赤仄八銖五分王莽又為數十品公孫述始作鐵錢魏文穀帛相貿劉備以一當百孫權以一當千理道陵夷有鵝眼線環之别王綱解紐有風飄水浮之異虞夏三品幣通典自神農列鄽於國以聚貨帛日中為市以交有無虞夏商之幣史無商字金為三品或黃或白或赤或錢或刀或布或龜貝史記平凖書虞夏之幣金為三品或黃或白或赤索隱金銀銅也國語注賈侍中云虞夏商周金幣三等黃為上幣銅鐵為下幣後魏任城王澄傳言夏殷之政九州貢金以定五品周仍其舊列星圖天錢十星在北落西禹湯金幣管子山權數篇輕重八湯以莊山之金鑄幣禹以歷山之金鑄幣而贖民之無􅕷賣子者地數篇出銅之山四百六十七史記殷紀鹿臺之錢鹽鐵論大夫曰禹以歷山之金湯以嚴山之銅鑄幣天下稱仁後魏史髙謙之表曰堯遭大水以歷山之金鑄錢救民周上中下幣武王國策管子地數篇輕重十桓公問曰以天財地利立功成名於天下者誰子也管子曰文武是也夫玉起於禺氏金起於汝漢珠起於赤野此皆距周七千八百里其塗逺而至難故先王各用於其重珠玉為上幣黃金為中幣刀布為下幣令疾則黃金重令徐則黃金輕先王權度其號令之疾徐髙下其中幣而制上下之用則文武是也輕重乙篇武王問於癸度癸度對曰吾國衢處之國也茍入吾國之粟因吾國之幣然後載黃金而出故君請重重而衡輕輕運物而相因則國策可成武王曰行事奈何癸度曰金出於汝漢之右衢珠出於赤野之末光玉出於禺氏之旁山因以珠玉為上幣餘與上同周九府圜法漢志太公為周立九府圜法黃金方寸重一斤錢圜函方荀悅曰外圓內方輕重以銖布帛廣二尺二寸為幅長四丈為匹故貨寶於金利於刀流於泉布於布束於帛太公退又行之於齊注師古曰太府玉府內府外府泉府天府職內職金職幣曰九府圜謂均而通也後魏書熙平初任城王澄上言太公立九府之法於是國貨始行定銖兩之楷齊桓循用以霸諸侯及秦始漢文遂有輕重之異唐會要崔沔議曰太公之創九府將以貧殷人賈生之陳七福規於更漢令姒乙鼓於莊歷姬薑均于九府鄭樵曰謂之泉者言其形金言其質刀言其器貨布言其用古文錢字作泉者言其形如泉文一變而為刀器再變而為圜法自圜法流通於世民實便之故泉與刀遂廢後人不曉其謂觀古錢其形即篆泉文後世代以錢字故泉之文借為泉水之泉其實泉之篆文下體不從水也先儒不知本末為流於泉布於布寶於金利於刀皆沿鑿之義周泉府泉二品邦布周六幣見圭璧禮天官外府中士二人掌邦布之入出以共百物而待邦之用注布泉也其藏曰泉其行曰布泉始蓋一品周景王鑄大泉而有二品後數變易不復識本制至漢唯有五銖久行王莽作泉布多至十品疏泉始蓋一品者即此經泉布是也莽之大泉與景王所鑄大泉亦異韋昭注國語曰單穆公云古者有母權子而行則二品之來古而然矣鄭君云一品省之不熟耳地官泉府上士四人中士八人下士十六人掌以市之征布斂市之不售貨之滯於民用者司市下大夫二人上士四人中士八人下士十有六人以商賈阜貨而行布以泉府同貨而斂賒㕓人掌斂市絘布總布質布罰布㕓布而入于泉府注布泉也絘布列肆之稅布總玄謂讀如租􅖽之􅖽布謂守斗斛銓衡之稅質布質人之所罰犯質劑者之泉罰布犯市令者之泉㕓布貨賄諸物邸舍之稅鹽鐵論錯幣第四大夫曰教與俗改幣與世易夏后以元貝周人以紫石後世或金錢刀布説文古者貨貝而寶龜周而有泉秦廢貝行錢宋沈演之以為龜貝行於上古泉刀興自周代管子桓公曰何謂藏於民請散棧臺之錢散諸城陽鹿臺之布散諸濟隂闕泉之興蓋自燧人氏以輕重為天下至黃帝成周其法寖具泉取水泉流行無不遍周大錢寶貨漢食貨志景王患錢輕將更鑄大錢古曰泉後轉曰錢單穆公曰不可古者天降災戾於是量資幣權輕重以救民患輕則為之作重幣以行之重曰母輕曰子於是有母權子而行民皆得焉若不堪重則多作輕而行之亦不廢重於是乎有子權母而行大小利之今王廢輕而作重民失其資能無匱乎民若匱王將用有所乏乏將厚取於民民不給將有逺志是離民也且絶民用以實王府猶塞川源而為潢汙也竭亡日矣王其圖之弗聽鑄大錢文曰寶貨肉好皆有周郭以勸農贍不足百姓蒙利國語景王二十一年魯昭之十八年也云云注韋昭曰或云文曰寶貨皆非事實周時已名泉為錢劉秩曰錢以平輕重權本末齊桓得其術而國以霸周景失其道而人用敝齊鑄錢管子九府書管子輕重戊管子令桓公與民通輕重令左司馬伯公將白徒鑄錢於莊山令中大夫載錢二千萬求生鹿於楚史記吾讀管氏輕重九府見府庫類楚三錢府史記越世家楚王赦常封三錢之府注金幣三等也孫叔敖傳莊王以為幣輕更以小為大百姓不便皆去其業市令言之相後五日朝相言之王請復如故王許之下令三日而市復如故蘇秦傳秦之燕貸人百錢為資及冨貴以百金償之吕氏春秋趙宣孟見餓人與錢百而遂去之漢莢錢八銖五分四銖錢食貨志秦兼天下始皇二十六年幣為二等黃金以溢為名上幣注孟康曰二十兩為溢師古曰改周一斤之制髙祖初賜張良金百溢此尚秦制也上幣者二等之中黃金為上而錢為下也銅錢質如周錢古今注云徑寸二分重十二銖文曰半兩重如其文而珠玉龜貝銀錫之屬為器飾寶藏不為幣然各隨時而輕重無常漢興以為秦錢重難用更令民鑄莢錢注如淳曰如榆莢曰通典云文曰漢興伏無忌重三銖黃金一斤注復周之制孝文五年為錢益多而輕乃更鑄四銖錢其文為半兩除盜鑄錢令使民放鑄賈誼諌曰銅布於天下其為禍博矣今博禍可除而七福可致也見新書銅布篇黥罪不積一矣偽錢不蕃民不相疑二矣采銅鑄作者反於耕田三矣上挾銅積以御輕重貨物必平四矣作兵器假貴臣多少有制五矣臨萬貨調盈虛收竒羡六矣制吾棄財與胸奴逐爭其民七矣退七福行博禍臣誠傷之上不聽是時吳即山鑄錢富埒天子鄧通鑄錢財過王者故吳鄧錢布天下文帝賜鄧通蜀嚴道銅山得自鑄錢吳王濞亂天下幣紀髙后二年七月行八銖錢應劭曰本秦錢質如周錢文曰半兩重如其文即八銖也漢以其太重更鑄莢錢今民間名榆莢錢是也民患其太輕至此復行八銖錢六年六月行五分錢應劭曰所謂莢錢者文帝五年夏四月除盜鑄錢令應劭曰聽民鑄也更造四銖錢應劭曰文帝以五分錢太輕小更作四銖錢文亦曰半兩今民間半兩錢最輕小者是也景帝中六年十二月定鑄錢律應劭曰文五年聽民放鑄律尚未除賈山傳上疏諌以為富貴人主之操柄令民為之是與人主共操柄不可長也其後復禁鑄錢云惠紀注晉灼曰食貨志黃金一斤直萬錢師古曰諸賜言黃金者皆與之金不言黃者一金與萬錢也史記秦惠王二年初行錢始皇三十七年復行錢平凖書秦中一國之幣為三等後南蠻傳秦昭襄王時巴郡閬中夷人得以倓錢贖死髙祖為漢王發夷人伐三秦復其渠帥七姓餘户乃歲入賨錢口四十楚漢春秋項梁鑄大錢漢三銖錢白金皮幣武紀建元元年春二月行三銖錢注師古曰新壞四銖錢造此五年春罷三銖錢行半兩注又新鑄作也元狩四年冬有司言關東貧民徙隴西北地西河上郡會稽凡七十二萬五千口縣官衣食振業用度不足請收銀錫造白金及皮幣以足用初算緍錢管子曰桓公朝周請天子號令諸侯以石璧賀獻此亦鹿皮銀錫為幣之義也六年六月詔曰日者有司以幣輕多姦農傷末衆故改幣以約之注李竒曰更去半兩行五銖皮幣稽諸往古制宜於今廢期有月而山澤之民未諭遣博士大等六人循行天下王子侯表建武侯拾元鼎二年坐使行人奉璧皮薦賀元年十月不會免志武帝元狩間山東被水災民多飢乏天子遣使虛郡國倉廩以振貧猶不足富商賈或墆財役貧轉轂百數廢居居邑封君皆氐首仰給焉冶鑄鬻鹽財或纍萬金而不佐公家之急黎民重困於是天子與公卿議更造錢幣以贍用而榷浮淫并兼之徒是時禁苑有白鹿而少府多銀錫自孝文更造四銖錢至是歲四十餘年從建元以來用少縣官往往即多銅山而鑄錢民亦盜鑄不可勝數錢益多而輕物益少而貴有司言曰古者皮幣諸侯以聘享金有三等黃金為上白金為中赤金為下赤金丹陽銅也今半兩錢法重四銖而姦或盜摩錢質而取鋊西京黃圖敘曰民摩錢取屑錢益輕薄而物貴則逺方用幣煩費不省乃以白鹿皮方尺緣以繢為皮幣直四十萬王侯宗室朝覲聘享必以皮幣薦璧然後得行又造銀錫白金以為天用莫若龍地用莫若馬人用莫如龜故白金三品其一曰重八兩圜之其文龍名白撰直三千二曰以重差小方之其文馬直五百三曰復小撱之音他果反其文龜直三百令縣官銷半兩錢更鑄三銖錢重如其文盜鑄諸金錢罪皆死而吏民之犯者不可勝數上與湯既造白鹿皮幣問顔異異曰今王侯朝賀以蒼璧直數千而其皮薦反四十萬本末不相稱天子不説漢五銖錢志更鑄三銖錢其明年大將軍票騎大出擊胡賞賜五十萬金軍馬死者十餘萬匹轉漕車甲之費不與焉是時財匱戰士頗不得祿矣有司言三銖錢輕輕錢易作姦詐乃更請郡國鑄五銖錢周郭其質令不可得摩取鋊然自造白金五銖錢後五歲而赦吏民之坐盜鑄金錢死者數十萬人其不發覺相殺者不可勝計赦自出者百餘萬人然不能半自出天下大抵無慮皆鑄金錢矣武紀元狩五年春三月行五銖錢罷半兩錢志元狩四年冬更鑄三銖錢今乃罷三銖而行五銖也列傳張湯遷御史大夫會渾邪等降山東流徙皆印給縣官湯承上指請造白金及五銖錢籠天下鹽鐵出告緡令汲黯免官隱於田園會更立五銖錢民多盜鑄楚地尤甚召拜淮陽太守義縱為定襄守會更五銖錢白金起民為姦以縱為右內史漢赤仄上林三官錢後漢五銖錢魏五銖錢志天子既下緡錢令而尊卜式百姓終莫分財佐縣官於是告緡錢縱矣郡國鑄錢民多姦鑄錢多輕而公卿請令京師鑄官赤仄注應劭曰所謂子紺錢也子或作紫如淳曰以赤銅為其郭今錢郭見有赤者不知作法云何曰元鼎元年鑄初鑄錢屬少府平凖書鑄鍾官赤側一當五賦官用非赤仄不得行白金稍賤民弗寶用大事記元鼎二年行赤側罷白金縣官以令禁之無益歲餘終廢不行是歲湯死而民不思紀元鼎二年冬十一月御史大夫張湯有罪自殺其後二歲元鼎四年赤仄錢賤民巧法用之不便又廢於是悉禁郡國毋鑄錢專令上林三官鑄錢通鑑元鼎二年三月鑄既多而令天下非三官錢不得行諸郡國前所鑄錢皆廢銷之輸入其銅三官而民之鑄錢益少計其費不能相當惟真工大姦乃益為之鹽鐵論曰幣數易而民益疑於是廢天下諸錢而專命水衡三官作自元狩五年三官初鑄五銖錢至平帝元始中成錢二百八十億萬餘云百官表水衡屬官有上林均輸鍾官辨銅令丞元鼎二年初置水衡都尉掌上林苑然則上林三官其是此三令乎功臣表蒯成侯周仲居元鼎三年坐為太常收赤側錢不收完為城旦曲成侯蟲皇柔元鼎二年為汝南太守不用赤側錢為賦為鬼薪貢禹傳元帝時言古者不以金錢為幣專意於農今漢家鑄錢取銅鐵一歲十萬人不耕自五銖錢起七十餘年民坐盜鑄陷刑者衆富人積錢滿屋猶亡厭足民心動搖商賈求利而不出租稅故民棄本逐末窮則起為盜賊何者末利深而惑於錢姦邪不可禁其原皆起於錢宜罷采珠玉金銀鑄錢之官亡復以為幣除其租銖之律租稅祿賜皆以布帛及穀議不從師丹傳哀帝時有上書言古以龜貝為貨今以錢易之民貧宜改幣上問丹丹對可改有司以行錢久難卒變易志王莽變漢制更造大錢徑寸二分重十二銖文曰大錢五十又造契刀長二寸文曰契刀五百錯刀文曰一刀直五千與五銖錢凡四品並行以書劉字有金刀乃罷錯刀契刀及五銖更作金銀龜貝錢布之品名曰寶貨錢貨六品小錢直一么錢十幼錢二十中錢三十壯錢四十大錢五十銀貨二品龜寶四品貝貨五品布貨十品凡寶貨五物六名二十八品置錢府丞一人天鳯元年改作貨布貨泉二品並行民坐挾銅炭沒入鍾官數十萬人注鍾官主鑄錢世祖受命蕩滌煩苛復五銖錢與天下更始後公孫述傳述廢銅錢置鐵官錢置鐵官以鑄錢童謡曰黃牛白腹五銖當復光武紀建武十六年復五銖錢列傳馬援在隴西上書言宜如舊鑄五銖錢事下三府以為未可許及入為虎賁中郎將求前奏難十餘條隨牒解釋東觀記凡十三難援一一解之帝從之天下賴其便朱暉元和中為尚書僕射時穀貴縣官經用不足尚書張林言穀貴由錢賤可盡封錢一取布帛為租暉奏林言不可施行劉陶遊太學桓帝時永夀三年夏或言改鑄大錢事下四府羣僚及太學能言之士陶議曰伏讀鑄錢之詔平輕重之議當今憂不在貨在乎民飢蓋民可百年無貨不可一朝有飢議者不達農殖之本多言鑄冶之便或欲因緣行詐以賈國利國利將盡取者爭競造鑄之端生萬人鑄之一人奪之猶不能給况一人鑄之萬人奪之乎欲民殷財阜要在止役禁奪則百姓不勞而足帝竟不鑄紀靈帝中平三年鑄四出文錢獻帝初平元年董卓壞五銖更鑄小錢曹公罷之還用五銖第五倫傳長安鑄錢多姦巧京兆尹以倫為督鑄錢掾領長安市鍾離意傳詔班賜羣臣更以庫錢三十萬賜意漢少府禁錢百官表少府注應劭曰名曰禁錢以給私養自别為藏賈捐之傳議棄珠崖竊以往者羌軍言之暴師曽未一年兵出不踰千里費四十餘萬大司農錢盡乃以少府禁錢續之食貨志武帝時胡降者數萬人皆得厚賞縣官不給天子乃損膳解乘輿駟出御府禁藏以贍之漢水衡錢表水衡都尉掌上林苑屬官有上林鍾官注鍾官主鑄錢官志上林三官鑄錢楊可告緡錢上林財物衆乃令水衡主上林宣紀本始二年春以水衡錢為平陵徙民起第宅王嘉傳奏封事曰元帝溫恭少欲都內錢四十萬萬水衡錢四十五萬萬少府錢十八萬萬常幸上林獸圈猛獸出馮貴人前當之賜錢五萬賞賜節約是時外戚資千萬者少故少府水衡見錢多也注應劭曰水衡與少府皆天子私藏都內錢食貨志武帝時乃募豪民田南夷入粟縣官而內受錢於都內師古曰都內京師主藏者也恩澤侯表本始二年田延年為大司農盜都內錢三千萬如淳曰天子錢藏中都內又曰大內百官表治粟內史屬官有都內中興省內尹翁歸補都令列傳張安世辭祿詔都內别藏張氏無名錢以百萬數賈捐之對武帝元狩六年都內之錢貫朽而不可校王嘉奏曰元帝溫恭少欲都內錢四十萬萬淮南王安書越人名為藩臣貢酎之奉不輸大內應劭曰大內都內也國家寶藏也文選注桓子新論曰漢宣以來百姓賦錢一嵗餘二十萬藏於都內後漢紀桓帝延熹五年十月辛丑換王侯租以助軍糧出濯龍中藏錢還之漢錢官銅官史記北軍有錢官地理志丹陽郡有銅官錢官長丞五十有一而專其官以主丹陽之銅越巂卭都南山出銅犍為朱提山出銀益州懷山出銅石空山出錫盢町山出銀鉛采山出錫羊山出銀鉛烏山出錫從􅞼山出銅常山蒲吾有鐵山豫章鄱陽有黃金采采取金之處鹽鐵論大夫曰丹章有金銅之山史記章山之銅山吳有豫章郡銅山海經禹曰天下名山五千三百七十出銅之山四百六十出鐵之山三千六百九十管子地之東西二萬八千里南北二萬六千里其出水者八千里受水者八千里出銅之山四百六十七出鐵之山三千六百九錢官漢氏初屬少府後屬水衡後漢屬司農魏晉以下或屬少府或屬司農漢錢官長丞五十有一而專其官以主丹陽之銅唐諸道置爐九十有九而重其使以總江淮之鐵淮揚荆衡之壤厥貢三品會稽具區之畛其利金錫魏五銖錢魏志文帝黃初二年三月初復五銖十月以穀貴罷五銖使民以穀帛相貿明帝太和元年司馬芝議用錢豐國省刑四月乙亥復行五銖錢至晉用之韓暨為監冶謁者舊時冶作馬排每一孰石用馬百匹更人排又費功力暨乃因長流為水排利益三倍加司金都尉班亞九卿蜀志張裔為司金中郎將典作農戰之器南齊崔祖思云劉備取帳鈎銅鑄錢以充國用齊建元四年孔覬上議曰自漢鑄五銖錢至宋文帝歷五百餘年制度有廢興而不變五銖者明其輕重可法得貨之宜也漢建安十九年先主用劉巴之言以一當百孫權嘉禾五年春鑄大錢以一當五百赤烏元年春鑄一當千大錢晉元帝過江用赤烏舊錢輕重雜行大者比輪小者四文沈充鑄小錢謂之沈郎錢安帝元興中議欲廢錢用穀孔琳之以為救弊之術無取於廢錢議遂不行前涼張軌參軍索輔言於軌曰二漢制五銖錢通易不滯晉太始中河西荒廢遂不用錢今宜復五銖以濟通變之會軌納之錢遂行人賴其利宋四銖梁五銖後魏五銖隋五銖通典文帝元嘉七年十月戊午鑄四銖重如其文人盜鑄多剪鑿取銅帝患之江夏王義恭建議以一大錢當兩以防剪鑿二十四日何尚之議曰泉貝之興事在交易數少則幣輕數多則物重多少雖異濟用不殊以一當兩徒崇虛價沈演之以為以大錢當兩則國傳難朽之寶家贏一倍之利不俟加憲巧源自絶上從演之議六月以一當兩行之經時公私非便乃罷明年五月己卯言事者欲禁私銅以充官鑄五銖范泰曰貨存貿易不在多少孝武孝建元年正月壬戌更鑄四銖文曰孝建徐爰議收銅繕鑄詔可之以銅贖刑又以為銅轉難得欲鑄二銖錢顔竣言不可者三不聽景和二年鑄二銖錢又永光元年二月庚寅鑄二銖錢三月甲辰罷文曰景和形式細人模效之剪鑿者謂之萊子薄者謂之荇葉永光元年九月戊午沈慶之啓通私鑄於是錢貨亂一千錢長不盈三寸謂之鵝眼綖環明帝泰始初禁之唯用古錢齊志永明八年劉悛言蒙山下有嚴道銅山舊鑄錢處上遣使入蜀鑄錢頃之以功費多而止隋志梁武帝天監元年鑄錢文曰五銖重四銖三絫三黍又别鑄除其肉郭謂之公式女錢徑一寸文曰五銖重如新鑄五銖二品並行百姓私以古錢交易五銖太女銖平百錢對文定平一百五銖此稚錢重五銖豐貨男錢等輕不一至普通四年十二月戊午更鑄鐵錢人皆私鑄八十為百名曰東錢七十為百名曰西錢京師九十為百名曰長錢末年以三十五為百梁末又有兩柱鵝眼錢陳文帝天嘉五年閏五月甲子改鑄五銖一當鵝眼十宣帝大建十一年七月辛卯鑄大貨六銖一當五銖之十後還當一人皆不便後魏志孝文帝始用錢太和十九年公鑄粗備文曰太和五銖宣武永平三年冬又鑄五銖孝莊初私鑄者益更薄小乃至風飄水浮楊侃奏更鑄五銖髙恭之以為有五銖之名無二銖之實永安二年秋更鑄文曰永安五銖盜鑄彌衆髙謙之求鑄三銖錢事未就隋志北齊文宣天保四年正月己丑改鑄常平五銖重如其文後周武帝保定元年七月更鑄布泉之錢建德五年正月廢以一當五與五銖並行建德三年六月壬子鑄五行大布錢以一當十宣帝大象元年十一月丁巳又鑄永通萬國錢一以當千凡三品並用隋文帝開皇元年九月鑄五銖重如其文十年詔晉王廣聽於揚州立五爐鑄錢漢王諒於并州立五爐又詔晉王置十爐蜀王秀於益州立五爐是時錢益濫惡自漢至隋時或輕重皆用五銖唐開元通寶乾元重寶乾封泉寶食貨志隋末行五銖白錢髙祖入長安民間行線環錢八九萬才滿半斛武德四年會要七月十日丁卯鑄開元通寶徑八分重二銖四參十錢重一兩得輕重大小之中其文以八分隸篆三體舊紀武德四年七月丁卯廢五銖行開元通寶錢舊志開元錢之文歐陽詢制詞其字含八分及隸體賜齊秦王三爐裴寂一爐以鑄乾封元年四月庚寅月通鑑五月會要五二十五日改鑄乾封泉寶錢以一當舊錢之十明年復行開元通寶錢會要二年正月二十九日詔乾封新錢更不須鑄私錢犯法日蕃武后時盜鑄蜂起先天之際兩京錢益濫郴衡錢才有輪郭鐵錫五銖之屬皆可用之開元初六年正月十八日敕宋璟請禁惡錢行二銖四參錢行三銖四分已上舊錢毁舊錢不可用者江淮有官爐偏爐錢稜錢時錢璟又請出米十萬斛收惡錢少府毁之七年二月十一年詔所在加鑄二十六年宣潤等州初置監其後錢又漸惡詔出銅所在置監鑄開元通寶錢京師庫藏皆滿盜鑄益起兩京錢有鵝眼古文線環之别至剪鐵而緡之天寶十一載內作判官韋倫請厚價募工役用減而鼓鑄多肅宗乾元元年七月經費不給鑄錢使第五琦鑄乾元重寶錢以一當十詔曰周興九府實啓流泉之利漢造五銖亦弘改鑄之法琦為相二年九月戊辰三日復鑄重輪乾元錢一當五十肅宗以新錢不便命百官集議不能改二年三月十三日詔變法非良令百官集議上元元年六月七日減重輪一當三十開元乾元一當十由是錢有虛實之名代宗即位寶應元年五月重寶以一當二重輪當三凡三日十九日而大小錢皆以一當一人便之其後二錢鑄為器不復出矣劉晏以江嶺粗賤之貨積之江淮易銅鉛薪炭廣鑄錢歲得十餘萬緡輸京師及荆揚二州錢日增矣建中初四年六月判度支趙贊采連州白銅鑄大錢一當十以權輕重貞元初禁錢出駱谷散關張滂奏禁江淮鑄銅為器時商賈至京委錢諸道進奏院及諸軍諸使以輕裝趨四方合券乃取之號飛錢元和四年六月禁錢出嶺京兆尹裴武請禁與商賈飛錢者六年二月貿易錢十緡以上者參用布帛自禁飛錢家有滯藏物價浸輕判度支盧坦請許於户部度支鹽鐵三司飛錢每千錢增給百錢然商人無至者太和三年峻鉛錫錢之禁文宗詔禁銅器宰相李珏請加爐鑄錢武宗廢浮屠法永平監官李都彥請以銅像鐘磬爐鐸皆歸巡院淮南節度李純請天下以州名鑄錢京師為京錢大小徑寸如開元通寶會要會昌六年二月敕十月以後行新錢其舊錢權停宣宗立新錢復鑄為像柳仲郢傳為鑄錢使吏請以字識錢者不答既淮南鑄會昌字久之僧反取為鐘鈸云舊紀武德四年七月丁卯廢五銖錢行開元通寶錢乾封元年四月庚寅改鑄乾封泉寶錢二年正月罷乾封錢復行開元通寶陸贄奏議謂宜廣即山殖貨之功峻用銅為器之禁制捋得所則錢不乏矣唐鑄錢議鑄錢使食貨志兼用會要開元二十二年三月二十一日宰相張九齡奏請縱民鑄錢議下百官裴耀卿等皆以為許私鑄則下皆棄農而競利祕書監崔沔議曰錢貴通貨何待私鑄然後足用左監門衛録事參軍劉秩上議曰今之錢古之下幣也今若捨之任人自鑄則上無以御下下無以事上其不可一也物賤則傷農錢輕則傷賈輕則由於物多多則作法收之使少少則重重則作法布之使輕奈何而假於人其不可二也夫鑄錢不雜以鉛鐵則無利雜以鉛鐵則惡其不可三也人去南畝者衆其不可四也昔吳濞富埓天子鄧通財侔王者皆鑄錢所致必欲許其私鑄是與人利權其不可五也夫錢重者由人鑄日滋於前而爐不加於舊盜鑄者破重錢以為輕錢禁寬則行禁嚴則止止則棄矣此錢所以少也夫銅不布下則盜鑄者無因而鑄而公錢不破人不犯死刑錢又日增是一舉而四美兼也時公卿皆以縱民鑄為不便事既不行但嚴斷惡錢而已杜佑以為自昔言貨幣者皆不達其要唯賈生劉秩頗詳其旨信安王褘復言國用不足請縱私鑄獨韋伯陽以為不可褘議亦格肅宗以新錢不便命百官集議不能改會要開元二十五年二月羅文信為諸道鑄錢使天寶三載九月楊慎矜除御史中丞充鑄錢使六載楊釗上元元年五月劉晏寶應元年劉晏又充廣德二年第五琦李峴永泰元年正月十三日劉晏第五琦分領諸道大歷五年三月二十六日停晉天福三年十一月詔許天下私鑄四年七月復官鑄周世宗顯德二年九月丙寅詔禁天下銅器始議官鑄錢毁天下銅佛以鑄唐鑄錢七監錢官洛源桂陽飛狐監百官志諸鑄錢監監各一人副監各二人丞各一人凡鑄錢有七監屬少府會昌中增至八監每道置鑄錢坊一大中初三監廢韓洄傳上言江淮七監歲鑄錢四萬五千緡每緡度二千本倍於子請復洛源廢監江淮七監請皆罷洄又言天下銅鐵冶隸鹽鐵使從之食貨志天下銅坑五十歲采銅一十六萬六千斤地理志商州有洛源監錢官食貨志建中初户部侍郎韓洄以商州紅崖冶銅多請復洛源廢監起十爐歲鑄錢七萬二千緡每千錢費九百郴州有桂陽監錢官志元和三年五月李巽以郴州平陽銅坑二百八十餘復置桂陽監兩爐日鑄錢二十萬天下歲鑄錢十三萬五千緡命商賈蓄錢者皆出以市貨詔曰著錢令以出滯藏加鼓鑄以資流布錢譜曰咸通十一年桂陽監鑄錢官進新鑄錢文曰咸通元寶尋廢不行河東蔚州飛狐有三河銅冶有錢官志蔚州三河冶距飛狐故監二十里而近河東節度王鍔置鑄以刺史李聽為使以五爐鑄每爐月鑄錢三千萬自是河東錫錢皆廢至太和八年錫錢復起鹽鐵使王涯置飛狐鑄錢院於蔚州天下歲鑄錢不及十萬緡傳會要元和六年三月鍔奏請李聽開五爐官鑄錢日五萬河中府解縣有紫泉監乾元元年置有銅穴十二揚州有丹陽監廣陵監錢官宣州南陵有梅根宛陵二監錢官鄂州有鳯山監錢官饒州有永平監錢官有銅坑三信州有玉山監錢官有銅坑一鉛坑一絳州有銅源翔臯錢坊二梓州銅山縣貞觀二十三年置鑄錢官調露元年罷食貨志武德四年洛并幽益桂等州皆置監會要七月十八日癸酉置監於洛并幽益等州五年五月二十四日桂州置監開元二十六年宣潤等州初置監天下爐九十九絳州三十揚潤宣鄂蔚皆十益郴皆五洋州三定州一每爐歲鑄錢三千三百緡役丁匠三十費銅二萬一千二百斤鐵三千七百斤錫五百斤每千錢費七百五十天下歲鑄三十二萬七千緡穆宗時元和十五年閏正月十七日令百僚議錢貨輕重户部尚書楊於陵曰開元中天下鑄錢七十餘爐歲盈百萬今才十數爐歲入十五萬而已大厯以前淄青太原魏博雜用鉛鐵嶺南雜以金銀丹砂象齒今一用泉貨故錢不足宜使兩稅榷酒鹽利上供及留州送使錢悉輸以布帛穀粟然後出內府之積收市㕓之滯廣山鑄之數限邉商之出禁私家之積六典鑄錢監屬少府監各一人皇朝少府置十爐諸州皆屬焉及少府罷鑄錢諸州遂别今絳州三十揚宣鄂蔚各十益鄧郴各五洋州三定州一鑄錢監以所在州府都督刺史判之副監二人上佐判之丞一人以判司代宗實録大厯四年正月丁酉關內道鑄錢等使第五琦上言請於絳州汾陽銅源兩監增置五爐鑄錢許之唐銀銅鐵錫冶瑞金監山澤寶冶食貨志凡銀銅鐵錫之冶一百六十八陜宣潤饒衢信五州銀冶五十八銅冶九十六鐵山五錫山二鉛山四汾州礬山七麟德二年廢陜州銅冶四十八開元十五年初稅伊陽五重山銀錫德宗時韓洄建議山澤之利宜歸王者自是隸鹽鐵使洄傳云德宗初上言天下銅鐵冶乃山澤利當歸王者請悉隸鹽鐵使從之元和初天下銀冶廢者四十歲采銀萬二千兩銅二十六萬六千斤鐵二百七萬斤錫五萬斤鉛無常數開成元年復歸州縣宣宗時裴休請復歸鹽鐵使增銀冶二鐵山七十一廢銅冶二十七鉛山一元和三年六月詔天下自五嶺以北銀坑並禁斷令其採銅四年六月詔依前開採裴休傳收山澤寶冶悉歸鹽鐵紀大厯十四年七月庚午弛雍州金坑禁地理志凡天下有銀者三十六縣關內一河南五河東二山南二隴右三江南十九劍南一嶺南三有銅者六十三縣關內二河南五河東九河北一山南一隴右一淮南四江南三十一劍南六嶺南三有鐵者一百三縣關內六河南八河東十五河北九山南十隴西一淮南三江南二十七劍南十八嶺南六有錫者十三縣河南二河東一河北一山南一江南六嶺南二有金之郡縣十八關內一河南一山南三隴右一江南七劍南二嶺南三天祐元年虔州置瑞金監虔之雩都有金百官志少府監有掌冶令丞諸冶監令丞列傳河間王孝恭治荆州為立銅冶百姓利之權萬紀為侍書御史奏宣饒部中可鑿山冶銀歲取數百萬太宗斥之曰不能推賢乃以利規我韓思復遷滁州刺史州有銅官人鏟鑿尤苦思復為賈他鄙費省獲多國史兩朝志金銀銅鐵鉛錫之冶總二百七十一金産六州冶十一銀産二十三州三軍一監冶八十四銅十一州一軍冶四十六鐵二十四州二軍冶七十七銅九州一軍冶三十錫七州冶十六又丹砂二州冶二水銀四州冶五皆置吏主之九牧修貢篚草人申厲禁唐錢譜藝文志農家類顧烜錢譜一卷顧氏為書凡歷代造立之原大小輕重之度皆有倫序小説類封演續錢譜一卷隋志又有錢圖一卷朝氏志梁顧烜嘗撰錢譜一卷唐張台亦有錢録兩卷本朝紹聖間李孝美以兩人所纂舛錯增廣成十卷分八品陶嶽撰貨泉録一卷記五代諸侯擅改錢幣之由五篇董逌撰續錢譜十卷紹聖元年國史志張台錢録一卷本朝金光襲錢寶録于公甫古今泉貨圖一卷崇文目杜鎬鑄錢故事一卷書目咸平二年杜鎬承詔撰録前代書史鑄錢故事分五門紹興十九年洪遵得古泉百有餘品旁考傳記下逮稗官所紀攟托為泉志十五卷有正用偽不知年代品國竒神厭勝刀布品外錢之九錢輕重得中五銖漢開元唐錢重赤仄漢一當五比輪晉大泉王莽一直五十又吳嘉禾五年一當五百大貨六銖陳一當五銖之十四柱梁一準二十又改一準十兩柱梁末布泉後周一當五大布後周五行大布一當十永通萬國後周一當千當兩宋乾封唐髙宗一當十建中初趙贊鑄大錢一當十當十唐永通梁元帝八銖漢乾元肅宗一當十重輪乾元一當五十直百蜀梁當千吳周後得一史思明一當百錢輕榆莢三銖漢風飄水浮元魏鵝眼綖環耒子荇葉二銖宋沈郎四分晉開寶便錢務開寶三年五月丁巳詔於兩京置便錢務命陳鄂監取唐朝飛錢故事許民入錢左藏庫以諸州錢給之敕諸州候劵至即給唐會要元和七年王播奏商人於户部鹽鐵三司飛錢謂之便換開寶錢監至道永豐監皇祐永通監建隆二年三月禁鐵錫錢乾德五年十二月丙辰禁惡錢開寶四年正月雅州百丈縣興置錢監歲鑄九千餘貫增十爐九年七月升州言歲鑄三十萬緡命通判杜見素經度采銅江南舊用鐵錢十當銅錢之一太祖平吳因舊制開監于鄱陽錢俶入朝又得杭州錢監尋廢興國二年二月壬辰朔漕臣樊若水奏復用銅錢四年九月乙酉初聽銅錢入蜀八年三月奚嶼請於建州鑄大鐵錢文曰太平通寶尋以不便罷先是李煜因唐制於饒之永平監歲鑄六萬緡江南平增為七萬患銅少不給漕臣張齊賢調丁采饒信虔等州銅鉛錫是年增數十倍明年得銅八十五萬斤鉛二十六萬斤錫十六萬斤歲鑄錢三十萬貫以丁釗領三郡銅山初永平監用開通元寶錢法肉好精妙至雜以鉛錫雖歲增數倍稍惡矣天聖間歲鑄百餘萬貫慶厯間至三百萬熙寧六年後歲鑄銅鐵錢六百餘萬貫至道二年十月己未池州新置錢監賜名永豐先是饒之永平歲鑄四十萬貫今分置是監共鑄六十四萬貫楊允恭言其事始分鑄於池咸平二年五月宰臣齊賢請置監廣鑄命虞部郎馮亮等按視至建州置豐國監江州置廣寧監明年凡鑄一百二十五萬八月丙子祕閣校理杜鎬等承詔檢討鑄錢故事上之廣寧監歲鑄二十萬貫肇四月癸亥終七月己卯王元之為記慶厯元年九月壬申以虢州監為朱陽監十一月詔江饒池錢監鑄鐵錢百萬緡六年五月壬寅以興元府西縣錢監為濟逺監八年六月乙未詔陜西所用江南儀商等州大銅錢以一當三其小鐵錢三當銅錢之一先是慶厯初兵興用乏知商州皮仲容議采洛南縣紅崖山虢州青水冶青銅置阜民朱陽二監以鑄錢陜西漕臣張奎永興守范雍又請鑄大錢一當十四年復采儀州黃銅置博濟監鑄大錢而江南亦鑄大銅錢江池饒晉儀虢州鑄小鐵錢並輦送關中雜行大約小銅錢三可鑄當十大錢一民多盜鑄物價翔踊命翰林學士張方平宋祁中丞楊察與三司雜議至是與三司使葉清臣等先上陜西之議謂救弊不先自損則法不可以下行遂下是詔七月辛丑詔河南所用小鐵錢以三當銅錢之一仍罷諸州官所置爐元年晉州鑄小銅錢二年晉澤州鑄大錢一當十未幾三司奏罷鑄大錢五年小錢獨留用河東盜鑄無窮至是如陜西行之其後罷商州鑄青黃銅錢皇祐二年二月詔大銅鐵錢並當常錢之二嘉祐四年二月癸未盜鑄乃止慶厯八年九月癸亥韶州置鑄錢監時天興場歲采銅二十五萬斤皇祐元年二月丁卯以韶州新置監為永通監淳熙十二年三月省至和二年三月詔韶州岑水場銅發令漕司益鑄錢治平四年置惠州阜民監熙寧三年八月二十四日詔阜民監錢專給岑水場市銅之費七年七月十八日廣東漕臣言永通阜民二監歲鑄八十萬比又增鑄二十萬近改鑄折二錢歲增二十萬詔羡餘復歸內藏庫熙寧三年七月十三日陜西興置鑄錢監市岑水場銅鉛增鑄百萬緡六年六月壬辰行折二錢七月四日詔京西淮浙江西荆湖六路各置鑄錢監一江荆以十五萬餘以萬緡為額七年三月二十八日以永興鑄折二錢備熙河之用二十四日三司言河北有銅五十七萬九千九百餘斤錫九千八百九十餘斤詔度地置監乃置黎陽監於衛州歲鑄三萬五千緡八年二月一日商虢洛南增置三監耀鄜權置二監凡九監鄜州等五監俟改鑄省樣錢畢併入商州等四監鑄大錢九月九日岷州置監十月十四日詔黎陽監歲增鑄折二錢五萬緡十一月十一日進熙河當二鐵錢樣九年六月八日罷折二錢初薛向鑄折二錢於陜西許彥先又鑄於廣南宰臣安石曰錢有二品自周巳然乃復行之十月五日命饒州增鑄三十萬緡元豐元年八月興州濟衆監增鑄并舊為七萬二千餘緡二年二月二十九日通逺軍監改鑄銅錢罷鳯翔郿縣置監三年六月二十九日徐州置監十一月二十六日興復雅州錢監歲鑄三萬緡餘見後元祐二年七月二十一日置河中府龍門韓城錢監八年五月十一日罷二廣鑄折二錢八月陜西復鑄小銅錢紹聖二年十二月施州置廣積監崇寧元年八月户部言江池饒建四監歲額上供新錢一百三十餘萬貫二年十月行當十錢三年二月復置寶豐黎陽監九月詔東南十監舒衡睦鄂韶梧六監鑄小錢餘五監鑄當十錢四年閏二月汝州魯山置監并陜西兩河京西十八監鑄夾錫錢大觀二年七月懷衛州建鑄錢院政和四年四月復融州寶興監六年四月置雍州通寶監宣和六年七月罷萬州廣濟監江東鑄銅錢始于樊若水以鉛錫雜鑄始于張齊賢有嘉祐有折二之令雖鑄於陜廣至熙寧而始行慶厯當三之請雖發于鄭戩至崇寧而始鑄三品之錢至今便之淳化御書三體錢國初錢文曰宋元通寶淳化元年五月乙未改鑄淳化元寶錢上親書其文作真草行三體自後每改元必更鑄以年號為文景德權衡式以御書三體錢較定祥符元年六月癸巳賜輔臣新鑄御書祥符元寶錢淳化鑄錢議淳化二年十二月宗正少卿趙安易言蜀鐵錢賤而物騰請如劉備鑄大錢十當百事下尚書集三省議可否吏部尚書宋琪等議曰備患鈔少而改作今乃患多改之恐難經久安易論請不已鹽鐵使李惟清言非便度支使魏羽請於一州鑄而行之以觀其效乃命安易以錢式往川峽鼓鑄歲僅得三千餘緡議者以為非便罷之五年正月庚申安易復請鑄帝不從但令兩川以銅錢一當鐵錢十民頗便之景德二年二月知益州張詠鑄大鐵錢于嘉卭四年五月詔行之一當十祥符七年二月凌䇿又請鑄當十鐵錢與舊錢兼行慶厯事見後興國二年九月丁酉詔所在用七十七陌初因漢乾祐之制以八十五為百益利夔三州皆有鐵冶邛州舊鑄歲十萬緡建炎二年六月乙卯罷之紹興十五年七月戊申始即利州鑄錢歲十萬緡其後增至十五萬二十三年六月丁酉復置監于卭明年四月乙酉詔卭州歲鑄三萬緡利州九萬緡二十五年又詔利州鑄大小錢各二萬緡三十一年二月戊申卭州復置惠民監歲鑄鐵錢三萬緡再減利州錢為六萬緡大小各半許景衡曰元豐左藏庫月支約三十六萬緡宣和費一百二十萬咸平鑄錢使咸平三年五月庚申馮亮以江南運副兼都大提點鑄錢亮等言饒池江建州歲鑄百三十五萬貫景祐二年八月己卯置提點坑冶鑄錢官初命魏兼乙既罷發運使故别置官十月丑詔俸賜同提刑寶元元年八月丁卯復置發運使提點鑄錢事宋朝鹽鐵領於三司後鑄錢屬發運使其後專置使以總九路故鑄銅之數視歷代為多自元豐二年七月癸酉增使者為二其一領湖廣江西其一領閩浙淮南江東逮至元祐復合於一又慮諸道莫與之協力也紹聖二年始命提點刑獄兼治坑冶明年又詔轉運使預聞其事崇寧間則提舉常平亦與焉中興以來用度既廣泉府之入浸虧於舊議者謂數錢之費可得一錢而官屬吏卒其費不可計始也分命兩使于贛于饒蓋倣元豐之制也未幾廢一而存一又未幾舉廢之而歸其職於户部蓋倣三司之制也議者不以為便則又委之諸道轉運使蓋酌紹聖之制也既而課入益朘尋既復其一繼又增為二今蓋定為一司矣乾道六年四月一日併於發運司七年二月復置八年十二月置提點官二員分治饒贛淳熙二年併於饒州初虔饒分鑄歲解緡錢四十九萬後總九路為一司歲額僅十五萬祥符九年五月發運司言饒池江杭四監共鑄百二十五萬緡用銅四百五十三萬餘斤元豐二年七月七日三省言鑄錢司舊領五監近歲江池饒增歲鑄額及興國睦衡舒蘄惠創置六監宜增提點一員乃命錢昌武領淮浙建江東李棻領湖廣江西元祐元年二月庚申朔合為一司從李深請也崇寧五年九月三日中書奏錢監鑄銅錢總二百八十九萬四百貫諸路支費錢一百五十六萬貫詔蘇莊提舉九路銅事先是遊經言有膽水可浸鐵為銅者韶岑水潭瀏陽及鉛山德興建蔡池婺銅山汀赤水邵武黃齊潭礬山溫南溪池銅山凡十一所惟岑水鉛山德興已經理餘未也靖國元年四月九日命經提舉措置銅事大觀四年三月壬戌罷江淮等路銅事併入鑄錢司紹興二十七年七月庚午户部侍郎林覺奏請復饒永平贛鑄錢院韶永通監選通判主之領以漕臣饒贛八萬緡韶七萬緡為額奏可殿中御史王圭言岑水鉛山興利三場唯給兩監韶州監久廢難復用十七錢鑄一錢費多得寡請先收本錢然後專置一司八月庚申户侍榮嶷兼提領鑄錢二十八年八月壬寅選官二員往嚴饒州措置命户部侍郎趙令詪提領二十九年七月乙巳復置鑄錢司上曰利害大槩有四坑户銅本工役木炭是也三十年五月丙戌權以五十萬緡為額然亦止鑄十萬緡而止耳乾道二年二月庚子設饒贛兩司會要有金之州十有銀之州四十二有銅之州十三渭饒信興國南安郴興建南劍汀漳邵武英有鐵之州三十六西京至融水有鉛之州十一有錫之州十三凡山澤之入金一千四十八兩銀十二萬九千四百六十兩銅二千一百七十四萬四千七百四十九斤鐵五百六十五萬九千六百四十六斤鉛七百九十四萬三千三百五十斤錫六百十五萬九十餘斤歲總收金三萬七千九百八十五兩銀二百九十萬九千八十六兩諸路上供金萬七千四兩銀百十四萬六千七百八十四兩凡賦入之數金萬七千九十七兩銀百二十三萬一千二百七十七兩續會要有金二十五州十三州土貢有銀七十四州二十一州土貢銅二十一州元豐元年計一千四百六十萬五千九百六十九斤鐵三十六州元豐元年收五百五十萬一千九十斤鉛三十一州錫二十七州紹興三十二年虞部具諸道坑冶數金坑興者一百三十四廢者一百四十銀坑興者八十四廢者八十三銅坑興者五十七廢四十五鐵坑興者三百七十廢二百五十六鉛之興三十二而廢十五錫之興九十四而廢四十四凡銅場十四鐵場三十八鉛場二十四錫場五乾道二年七月鑄錢司言銅歲取七百五萬七千二百六十三斤有竒鐵歲收二百十六萬二千一百四十四斤有竒鉛三百二十一萬三千六百二十二斤有竒錫七十六萬一千二百四斤開寶二年十一月乙巳詔未能捐金於山豈忍奪民之利減桂陽監歲入白金三之一至道元年三月廢邵武金場二年正月廢成州金坑詔曰捐金於山前聖盛德所寶惟穀舊史格言九月廢衢州銀冶景德元年正月建州寶通山出銀以圖來獻天聖四年十二月乙未虔州石城産銀置義豐場建炎元年八月十六日依祖宗舊法山澤坑冶隸金部轉運先是崇寧二年隸右曹及常平正和六年有措置東南坑冶寶貨司乾道二年五月二十五日命工部侍郎薛良朋措置諸路坑冶良朋言歲鑄錢一百六十一萬七千九百三十五貫約用銅五百五萬六千餘斤以銅少權以五十五緡為額韶之岑水銅六十二萬斤今增為七十七萬潭之永興五萬斤今增為十五萬信之鉛山三十八萬斤潼州利州一萬四千六百六十二斤九年閏正月五日以江淮浙潼利路隸饒司江西湖閩廣隸贛十月二十三日李大正言岑水永興鉛山場銅課最盛師􅋷著寶司撮要五卷趙有管仲則藏富於國得劉晏則錢流於地天聖交子務初蜀民以鐵重私為劵謂之交子以便貿易至大中祥符末薛田為轉運使請官置交子務以榷其出入久不報冦瑊守蜀請廢交子不用瑊去而田代之詔田與轉運使張若谷度其利害田若谷議請官為置務禁民私造詔從之置益州交子務時天聖元年十一月戊午也每界以一百二十五萬六千三百四十為額大觀元年夏四月甲子詔改交子為錢引熙寧四年正月詔陜西行交子元豐二十七監會要元豐三年是歲諸路鑄錢總二十七監一作二十六監鑄銅鐵錢五百九十四萬九千二百三十四貫銅錢一十七監鑄錢五百六萬貫鐵錢九監鑄錢八十八萬九千二百三十四貫銅錢西京阜財監二十萬貫衛州黎陽監二十萬貫永興軍監陜州華州監各鑄二十萬貫絳州垣曲監二十六萬貫舒州同安監十萬貫睦州神泉監十萬貫興國軍富民監二十萬貫衡州熙寧監二十萬貫鄂州寶泉監十萬貫江州廣寧監二十四萬貫池州永豐監四十四萬五千貫饒州永平監六十一萬五千貫建州豐國監二十萬貫韶州永通監八十萬貫惠州阜民監七十萬貫鑄錢監唯饒之永平最古自唐乾元初已創至道中增池之永豐咸平中增江之廣寧而虔之鑄錢院大觀末二年四月始建四皇祐會計録饒池建江韶五州鑄一百十萬貫鐵錢虢州朱陽兩監十二萬五千貫慶歷元年九月壬申置商州阜民洛南兩監各十二萬五千貫威逺鎮通逺軍滔山鎮岷州兩監二十萬貫興州濟衆監四萬一千貫嘉州豐逺監二十萬五千貫卭州惠民監七萬三千二百三十四貫三州鑄大錢以一當十凡銅錢行一十三路銅鐵錢兩路鐵錢四路元豐四年二月十四日詔秦州置監六年三月丙子朔詔徐州置寶豐監以四十萬緡為額七年四月二十五日以利國監鐵置寶豐下監五月三日梧州置監以十五萬緡為額八日萬州置鐵錢監八月朔同州置鐵錢監渭州復置博濟監七年天下坑冶凡一百三十餘所八年十二月八日戊寅詔罷增置監十有四漕軺兼統肇於興國都提命官昉于咸平合江淮荆浙閩廣而建一臺則景祐之憲度東治於饒西治於虔則元豐之章程自崇寧以迄宣和崇寧至宣和錢法五六變庫務所積一千三百餘萬諸監鑄九百餘萬諸路餘鏹三十餘萬通內外所有凡五千萬有竒宣和元年都省言云云許景衡曰元豐左藏庫月支約三十六萬緡宣和費一百二十萬中興鑄錢監中興會要饒州永平監額四十六萬五千貫池州永豐監三十四萬五千貫江州廣寧監二十四萬貫後以十萬貫為額建寧府豐國監二十五萬四百貫淳熙二年罷九一云紹興二年月罷韶州永通監四萬七千十七貫淳熙十二年罷贛州鑄錢監嚴州神泉監並無定額慶元三年八月戊子復置紹興二年八月癸巳令永豐監卒寓役於饒廣寧監卒寓役於虔移少就多二十七年七月庚午户部侍郎林覺奏慶厯嘉祐以來歲鑄一百八十餘萬緡後亦不下一百餘萬紹興二十五年猶得一十四萬六千緡二十六年得二十三萬緡孝宗定鑄額歲十五萬緡冶場之盛名在幹官者鉛山濛山石堰岑水昭寶富寶寶成寶瑞雙瑞嘉瑞大挺大濟永興新興興國興利大富廣富通利通濟監務坑井殆幾萬計建炎元年七月丙辰工部郎李士觀言江池饒建州四監歲鑄錢百三十三萬餘緡多未輸者今發運司委官催督九月庚戌始通當三大錢於淮浙荆湖諸路政和舊法大錢止行於京畿東西河東北由是東南小平錢甚重而物輕張夀言改當十為當三無私鑄之利請行於東南從之九月壬辰鑄建炎通寶三年六月三日命江池饒錢監以二萬五千緡為一綱紹興元年八月十八日工部進真篆當二小平銅鐵錢牙樣詔下鑄錢司三年八月工部侍郎李擢言國初得唐乾元中所置永平監舊址因之歲鑄四十六萬緡逮至道咸平置永豐廣寧豐國三監總鑄八十六萬餘緡一歲上供百三十餘萬緡紹興二年八月併廣寧永豐於虔饒兩司分歲額是年又罷豐國令虔司閩漕各立歲額鑄不及往時十二三才八萬緡十五年七月四日置利州鑄錢監二十六年六月十六日上謂錢法開元始精緻國家太平祥符崇寧錢亦精二十八年七月庚辰嚴銅禁紹興三十年五月丙戌諸路歲鑄錢以五十萬緡為額明年才鑄及十萬緡惟嚴州神泉監直輸行在而建韶饒贛皆輸內帑乾道三年三月以左藏庫銅九萬八千八百十斤下嚴州神泉監鼓鑄可鑄錢三萬九千五百餘緡六年四月命朝臣往淮西措置鑄錢六月舒曰同安監蘄曰蘄春監黃曰齊安監七年十一月興置撫之𥙿國六萬緡臨江之豐餘五萬緡興國之富民監十萬緡慶元三年二月癸巳復禁銅器紹興會子務紹興元年六月壬午張俊始置見錢關子於婺州後行於淮南江東議者言不便有五六年二月甲辰先是張澄請依四川法造交子三十萬行於江淮至是遂置行在交子務造百五十萬緡充糴本五月乙酉改為關子三十年十二月一日户侍錢端禮言奉詔以臨安府應支官錢造會子欲以見錢品支三十一年户部請以都茶場會子務為名二月丙辰始立會子務分一千二千三千凡三等乾道三年正月度支郎唐瑑言自紹興三十一年印造至乾道二年七月住印共印二千二百餘萬道五年正月辛酉詔以一千萬緡為一界周官小宰八成四曰聽稱責以