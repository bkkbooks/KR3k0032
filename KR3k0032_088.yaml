body:
  text: 玉海卷八十八宋王應麟撰器用鼎鼐以木巽火飬人之象泰帝神鼎見後汾陰鼎黃帝神鼎黃帝寶鼎三鼎詳見漢汾陰鼎段子華子黃帝之治天下百神受職於明堂之庭帝乃采銅於首山作大爐鑄神鼎於山上鼎成羣龍下迎史記黃帝紀天下有不順者黃帝從而征之平者去之未嘗寧居東至於海登九山及岱宗西至於空洞登雞頭南至於江登熊湘北逐葷粥合符釡山而邑千涿鹿之阿遷徙往來無常處以兵師為營衛官名皆以雲命為雲師置左右太監監於萬國萬國和而鬼神山川封禪與為多焉獲寶鼎迎日推䇿舉風后力牧常先大鴻以治民郊祀志公孫卿曰今年得寶鼎其冬辛巳朔旦冬至與黃帝時等卿有札書鬼臾區對曰黃帝得寶鼎神䇿是嵗己酉朔旦冬至凡二十推三百八十年黃帝仙登於天瑞應圖黃帝造三鼎以象太一曹植有黃帝三鼎贊文選江淹詩廣成愛神鼎虢州有黃帝鑄鼎原唐王闕作銘舜甑韓詩外傳舜甑盆無膻飯乎土簋啜乎土型古史考黃帝始作甑丹甑神鼎禮運山出器車注器謂若銀甕丹甑也唐薛雍丹甑賦曰中含虗兮體道上應規兮法天以孝以享兮可以饙饎多稌多黍兮屢惟豐年史􅔘丹甑賦曰既申命以自天類有孚而盈缶不汲而滿寶鼎齊列不炊而沸溫泉比崇異陶鈞之有作符造化之為功白虎通王者德至山陵丹甑見宋志丹甑五穀豐熟則出神鼎者質文之精也知吉知凶能重能輕不炊而沸五味自生王者盛德則出玉甕不汲而滿王者清廉則出晉志神鼎仁器也典略神鼎丹甑醴泉以為大瑞禹九鼎周郟鄏鼎唐銘九鼎左氏傳宣公三年定王元年春楚伐陸渾之戎遂至於雒觀兵於周疆定王使王孫滿勞楚子問鼎之大小輕重焉對曰在德不在鼎昔夏之方有德也逺方圖物圖畫山川竒異之物而獻之貢金九牧使九州之牧貢金鑄鼎象物象所圖物鑄之於鼎百物而為之備使民知神姦圖鬼神百物之形使民逆備之故民入川澤山林不逢不若螭魅罔兩莫能逢之用能協於上下以承天休桀有昏德鼎遷於商載祀六百商紂暴虐鼎遷於周德之休明雖小重也其姦回昏亂雖大輕也天祚明德有所底止成王定鼎於郟鄏今河南也武王遷之成王定之服虔注今河南有鼎中觀卜世三十卜年七百天所命也周德雖衰天命未改鼎之輕重未可問也桓公二年四月臧哀伯曰武王克商遷九鼎於雒邑義士猶或非之注九鼎殷所受夏九鼎也義士蓋伯夷之屬正義其鼎有九故稱九鼎漢郊祀志禹收九族之金鑄九鼎象九州云云見後段漢汾隂寶鼎墨子夏后鑄鼎四足而方拾遺記禹鑄九鼎五者以應陽法四者以象隂數説文禹鑄鼎荆山之下帝王世紀在馮翊懷德之南子華子周之九鼎禹所以圖神姦也黃帝鑄一禹鑄九揚子周室九鼎寶乎曰器寶待人而後寶書召誥正義九牧貢金為鼎故稱九鼎其實一鼎顔率説齊王云武王遷九鼎用九萬人以為鼎有九此虗誕之辭然鼎之上備載九州山川異物亦又可疑史記武王命南宫括史佚展九鼎寶玉周書克殷解乃命南宫伯達史佚遷九鼎三巫注地也威烈王二十三年九鼎震後漢郡國志雒陽東城門名鼎門注帝王世紀曰東南門九鼎所從入唐書鍾紹京武后時諸宫殿明堂及銘九鼎皆其筆也李泌天寶中復獻明堂九鼎議唐志許康佐九鼎記四卷雜傳記書目陳太子中庶子虞荔撰鼎録一卷録自古鼎形象欵識始於夏九鼎終於王羲之書鼎夏昆吾鼎周昆吾鼎後漢崔駰傳達旨辭曰乃將鏤玄圭册顯功銘昆吾之冶勒景襄之鍾注蔡雍銘論曰吕尚作周大師封于齊其功銘於昆吾之鼎一作冶文選注引同上墨子耕篇夏后開使飛廉析金于山而陶鑄之於昆吾使翁難雉乙卜于白若之龜龜曰鼎成四足而方不炊而自亨不舉而自藏不遷而自行祭於昆吾之墟乙又言兆之繇曰饗矣逢逢白雲一南一北一東一西九鼎既成遷于三國文選張景陽七命却馬於糞車之轅銘德于昆吾之鼎注墨子曰昔夏開使飛廉採金於山以鑄鼎於昆吾崔駰傳注同鼎録太公於渭水得玉璜鑄一鼎刻其文曰璜鼎湯鼎外紀又荀子説苑吕氏春秋湯之時大旱七年遂齋戒剪髮斷爪素車白馬身嬰白茅以身為犧牲禱於桑林之野持三足鼎祝山川以六事自責曰政不節歟民失職歟宫室崇歟女謁盛歟苞苴行歟讒夫昌歟何不雨之極也言未已大雨文選注引説苑曰持三足鼎祝山川辭未已而天下大雨伊尹鼎楚辭天問緣鵠飾玉注伊尹修飾玉鼎以事湯湯賢之以為相魯連子伊尹負鼎佩刀以干湯文選注殷湯廟鼎書髙宗肜日序髙宗祭成湯有飛雉升鼎而雊正義王肅云髙宗豐於禰故有雉升逺祖成湯廟鼎之異周鼎淮南子周鼎鑄倕使銜其指明大巧之不可為也注倕堯之巧工周鑄鼎鏤倕身於鼎使自銜其指吕氏春秋周鼎著叨餮有首無身食人未咽害及其身以言報更也周鼎著鼠令馬履之為其不陽也周鼎著倕而齕其指有以見大巧之不可為也注周家鑄鼎象百物之又曰殷之鼎陳於周廷吾丘夀王傳鼎為周出故名曰周鼎賈誼賦斡棄周鼎寶康瓠兮史記西周武王曰居三代之傳器索隱曰謂九鼎周崇鼎貫鼎庸器銘明堂位崇鼎貫鼎大璜封父龜天子之器也禮典庸器下士四人注鄭司農云有功者鑄器銘其功春秋傳作林鍾銘魯功庸器伐國所獲之器若崇鼎貫鼎及其兵物所鑄銘祭祀饗射陳庸器注陳功器以華國也周曽氷鼎召公鼎文選刻漏銘注蔡雍銘論曰昔召公作誥先王賜朕鼎出于武當曽氷周康寶鼎漢郊祀志宣帝以方士言立周康寶鼎祠於未央宮中周十二鼎膳夫王日一舉鼎十有二物皆有俎注牢鼎九陪鼎三物謂牢鼎之實亦九俎內饔王舉則陳其鼎俎匠人注牛鼎之扃長三尺膷鼎之扃長二尺疏以為漢禮器制度聘禮宰夫朝服設飱飪一牢在西鼎九羞鼎三腥一牢在東鼎七注羞鼎則陪鼎也以其實則曰羞以其東則曰陪上介飪一牢在西鼎七羞鼎三郊特牲鼎俎竒疏聘禮牛一羊二豕三魚四臘五腸胃六膚七鮮魚八鮮臘九是正鼎九陪鼎膷一臐二膮三鼎别一俎俎亦九少牢陳五鼎羊一豕二膚三魚四臘五特牲三鼎牲一魚二臘三亦有俎肵俎一非正俎左傳飱有陪鼎陪加也周甗考工記陶人為甗實一釜厚半寸脣寸盆甑實二釜鬲實五觳庾實二觳厚脣同注甗無底甑左傳齊賂晉以紀甗釋文王甑也公羊傳注或説玉甑皇朝太宗時長安民得甗其狀下為鼎三足上為方甑中設銅箄可以開闔有銘在其側句中正識其文曰甗也遂藏祕閣周仲山甫鼎見下崔駰仲山甫鼎銘曰鼎耳革其行塞雉膏不食方雨虧悔終吉有福足勝其任公餗乃珍於髙思危在滿戒溢可以永年天之大律周瑞鼎公羊傳注見下段晉莒二方鼎宋正考父鼎銘左傳昭七年夏鄭子産聘晉晉侯有疾韓宣子問曰寡君有疾今夢黃熊入于寢門對曰云云賜子産莒之二方鼎莒所貢也器金石録有方鼎銘藏岐山馮氏張舜民云夏時也正義服虔云鼎三足則圓四足則方秋九月孟僖子曰正考父弗父何之曽孫佐戴武宣三命兹益共三命上卿也言位髙益共故其鼎銘云考父廟之鼎一命而僂再命而傴三命而俯俯共於傴傴共於僂循牆而走亦莫余敢侮饘於是鬻於是言至儉以糊余口其共也如是僖子之言在二十四年公羊傳注郜所以有大鼎者周家以世孝天瑞之鼎以助享祭諸侯有世孝者天子亦作鼎以賜之禮祭天子九鼎諸侯七卿大夫五元士三詩注作器能銘可以為士夫考工記六分其金而錫居一謂之鍾鼎之齊魯郜鼎左傳桓公二年春宋以郜大鼎賂公郜國所造器夏四月取郜大鼎於宋戊申納於太廟非禮也臧哀伯諫曰官之失德寵賂章也郜鼎在廟章孰甚焉公不聽公羊曰器從名魯岑鼎吕氏春秋齊攻魯求岑鼎魯君載他鼎以往齊侯弗信又見劉子及新序吳夀夢鼎春秋襄十九年春王正月諸侯盟于祝阿左傳公享晉六卿於蒲圃賄荀偃束錦加璧乘馬先吳夀夢之鼎注夀夢吳子乘也獻鼎於魯因以為名古之獻物必有以先淮南子闔廬入郢破九龍之鼎史記秦武王與孟説舉龍文赤鼎晉讒鼎左傳昭三年叔向語晏嬰曰讒鼎之銘曰昧旦丕顯後世猶怠況日不悛其能久乎注讒鼎名也正義服虔云疾讒之鼎也明堂位所云崇鼎一云讒地名禹鑄九鼎於甘讒之地故云讒鼎二者無據故杜云鼎名而已韓非子齊伐魯索讒鼎齊甲父鼎左傳昭十六年二月丙申徐人及郯人莒人會齊侯盟于蒲隧賂以甲父之鼎注甲父古國名徐人得鼎以遺齊晉刑鼎左傳昭二十九年冬晉趙鞅荀寅賦晉國一鼓鐡鑄刑鼎著范宣子所為刑書焉仲尼曰晉國將守唐叔之所受法度以經緯其民文公作執秩之官為被廬之法以為盟主今棄是度也而為刑鼎民在鼎矣何以尊貴蔡史墨曰擅作刑器以為國法昭六年三月鄭子産鑄刑書注鑄於鼎衛舒鼎左傳定公六年二月衛公叔文子曰昭公之難魯昭公君將以文之舒鼎衛文公鑄此鼎其名曰舒成之昭兆衛寶龜也名兆文分明故為昭兆定之鞶鑑鞶帶而以鏡為飾茍可以納之擇用一焉注求納昭公也燕樂毅書故鼎反於歷室衛孔悝鼎銘祭統夫鼎有銘者論撰其先祖之有德善功烈勳勞慶賞聲名列於天下而酌之祭器以崇孝也故衛孔悝之鼎銘曰六月丁亥公假於太廟孔悝衛大夫也公衛莊公蒯瞶也以其立已故賜之疏以為在魯哀公十六年六月夏之孟月禘祭之時公曰叔舅乃祖莊叔悝七世祖衛大夫孔達也左右成公成公乃命莊叔隨難於漢陽即宫於宗周奔走無射啓右獻公獻公乃命成叔蒸鉏纂乃祖服乃考文叔圉興舊嗜欲作率慶土躬恤衛國其勤公家夙夜不懈民咸曰休哉公曰叔舅豫汝銘若纂乃考服悝拜稽首曰對揚以辟之勤大命施於蒸彛鼎彛尊也周禮大約劑書於宗彛漢紀功鼎鼎録蕭何為丞相鑄一鼎大如三石甕自表己功其文曰紀功鼎武帝登泰山鑄一鼎銅銀為之其形若甕文曰登于太山萬夀無疆四海寧謐神鼎傳芳成帝鑄鼎刻王商功以勸忠臣漢汾隂寶鼎汾水鼎文鼎鼎書漢寶紀元鼎元年夏五月宋志云五月五日得鼎汾水上應劭曰得寶鼎故因是改元四年十一月甲子立后土祠于汾隂脽上蘇林曰脽音誰如淳曰脽者河之東岸如人尻脽故以名云二説皆是六月得寶鼎后土祠旁秋馬生渥窪水中作寶鼎天馬之歌東萊曰得鼎在四年武紀因改元而誤增得鼎一事耳非兩曾得鼎於汾水上也元鼎年號亦如建元元光皆後來追改五年冬十一月辛巳朔旦冬至立泰畤於甘泉天子親郊見詔曰朕巡祭后土以祈豐年冀州脽壤乃顯文鼎獲薦于廟渥窪水出馬朕其御焉志其贊饗曰天始以寶鼎神䇿授皇帝朔而又朔終而復始郊祀志夏六月汾隂巫錦注應劭曰錦巫名為民祠魏脽后土營旁應劭曰魏故魏國也師古曰汾脽本魏地之墳故云魏脽也營謂祠之兆域也見地如鈎狀掊視得鼎師古曰掊謂手杷土也音蒲鈎反杷蒲巴反其字從木鼎大異於衆鼎文鏤無欵識韋昭曰欵刻也師古曰識記也音式志反其下美陽鼎亦同也怪之言吏吏告河東太守勝勝以聞天子使驗問巫得鼎無姦詐乃以禮祠迎鼎至甘泉從上行薦之如淳曰以鼎從行上甘泉將薦之于天師古曰上音時掌反至中山晏溫如淳曰三輔謂日出清濟為晏晏而溫乃有黃雲故為異也師古曰中讀曰仲即今雲陽之中山也下云合兹中山亦同也有黃雲焉有鹿過上自射之因之以祭云至長安公卿大夫皆議尊寶鼎天子曰間者河溢嵗數不登故巡祭后土祈為百姓育穀今年豐楙未報鼎曷為出哉師古曰楙美也言稼穡美也未報者獲年豐而未報賽也一曰雖祈穀而未獲年豐之報其下張敞引此詔文云榖嗛未報嗛者少也有司皆言聞昔泰帝興神鼎一師古曰泰帝即泰昊伏羲氏也一者一統天地萬物繫象也黃帝作寶鼎三象天地人禹收九牧之金師古曰九牧九州之牧也鑄九鼎象九州皆嘗鬺亨上帝鬼神服虔曰以享祀上帝師古曰鬺亨一也鬺亨煮而祀也韓詩采蘋曰于以鬺之唯錡及釡亨普庚反其空足曰鬲蘇林曰鬲音厯足中空不實者名曰鬲也以象三德如淳曰鼎有三足故也三德三正之德師古曰如説非也三德一曰正直二曰剛克三曰柔克事見周書洪範饗承天祜師古曰祜福也音怙夏德衰鼎遷於殷殷德衰鼎遷于周周德衰鼎遷於秦秦德衰宋之社亡鼎乃淪伏而不見史記周紀云秦取九鼎寶器秦紀昭襄王五十二年九鼎入秦年表顯王三十三年宋太丘社亡秦興師求九鼎見戰國䇿秦紀始皇二十八年過彭城齋戒禱祠欲出周鼎泗水使千人沒水求之弗得封禪書文帝後元年新垣平言曰周鼎亡在泗水中今河溢通泗臣望東北汾隂直有金寶氣意周鼎其出乎上使治廟汾隂南欲祠出周鼎注徐廣曰後三十七年鼎出汾隂周頌曰自堂徂基自羊徂牛鼐鼎及鼒不吳不敖胡考之休師古曰周頌絲衣之詩也基門孰之基也鼎絶大者謂之鼐圜弇謂之鼒吳歡譁也敖慢也考夀也休美也言執祭事者或升堂室或之門孰視羊牛之牲及舉大小之鼎告其致潔神降之福故獲夀考之美曰何夀之美何夀之美者歎之之言也鼐乃代反鼒音兹敖讀曰傲詩注大鼎謂之鼐小鼎謂之鼒今鼎至甘泉以光潤龍變承休無疆合兹中山有黃白雲降師古曰言鼎至甘泉之後光潤變見若龍之神能幽能明能小能大承此休福無窮竟也有黃白雲降與初至中山黃雲之瑞相合也蓋若獸為符服虔曰雲若獸在車蓋也晉灼曰蓋辭也符謂鹿也師古曰二説非也蓋發語辭言甘泉之雲又若獸形以為符瑞也路弓乘矢集獲壇下李竒曰宜言盧弓韋昭曰路大也四矢曰乘師古曰韋説是也又於壇下獲弓矢之應報祠大亨唯受命而帝者心知其意而合德焉服虔曰髙祖受命知之宜見鼎于其廟也師古曰合德與天合德鼎宜視宗禰廟臧於帝庭以合明應師古曰視讀曰示宗謂先帝有德可尊者禰父廟也帝庭甘泉天神之庭制曰可其秋上雍且郊師古曰雍地形髙故云上也音時掌反或曰五帝泰一之佐也宜立泰一而上親郊之上疑未定齊人公孫卿曰今年得寶鼎其冬辛巳朔旦冬至與黃帝時等師古曰等同也卿有札書師古曰札木簡之薄小者也曰黃帝得寶鼎冕侯問於鬼臾區師古曰鬼臾區黃帝臣也藝文志云鬼容區而此志作臾區臾容聲相近蓋一也今流俗本臾字作申字非也鬼臾區對曰黃帝得寶鼎神䇿是嵗己酉朔旦冬至得天之紀終而復始於是黃帝迎日推䇿晉灼曰迎數之也臣瓉曰日月朔望未來而推之故曰迎日後率二十嵗復朔旦冬至凡二十推三百八十年黃帝仙登於天卿因所忠欲奏之師古曰所忠人姓名也解在食貨志所忠視其書不經師古曰不合聖典也疑其妄言謝曰寶鼎事已決矣尚何以為師古曰謂不須更言之卿因嬖人奏之上大説師古曰説讀曰悅乃召卿對曰受此書申公申公已死上曰申公何人也卿曰齊人與安期生通受黃帝言無書獨有此鼎書云云黃帝采首山銅鑄鼎於荆山下晉灼曰地理志首山屬河東蒲坂荆山在馮翊懷德縣也鼎既成有龍垂胡髯下迎黃帝師古曰胡謂頸下垂肉也髯其毛也音人占反黃帝上騎羣臣後宫從上龍七十餘人龍乃上去餘小臣不得上乃悉持龍髯龍髯拔墯墯黃帝之弓百姓卬望師古曰卬讀曰仰黃帝既上天乃抱其弓與龍髯號故後世因名其處曰鼎湖其弓曰烏號吾丘夀王傳汾隂得寶鼎武帝嘉之薦見宗廟臧於甘泉宫羣臣皆上夀賀曰陛下得周鼎夀王獨曰非周鼎天祚有德而寶鼎自出此天與漢乃漢寶非周寶也郊祀歌景星十二元鼎五年得鼎汾隂作汾隂出鼎皇祜元始張敞云鼎大八尺一寸髙三尺六寸漢鼎官東方朔傳夏育為鼎官注今殿前舉鼎官漢美陽鼎周雕戈郊祀志宣帝時美陽得鼎獻之師古曰美陽扶風之縣也下有司議多以為宜薦見宗廟如元鼎時故事張敞好古文字按鼎銘勒而上議曰臣聞周祖始乎后稷后稷封于斄公劉發迹於豳太王建國於􅑢梁文武興于豐鎬由此言之則􅑢梁豐鎬之間周舊居也固宜有宗廟壇場祭祀之臧今鼎出於􅑢東中有刻書曰王命尸臣官此栒邑師古曰尸臣主事之臣也栒邑即豳地是也栒音荀賜爾旗鸞黼黻雕戈師古曰雕戈刻鏤之戈也尸臣拜手稽首曰敢對揚天子丕顯休命臣愚不足以迹古文竊以傳記言之此鼎殆周之所以褒賜大臣大臣子孫刻銘其先功藏之於宫廟也昔寶鼎之出於汾脽也河東太守以聞詔曰朕巡祭后土祈為百姓蒙豐年今榖嗛未報鼎焉為出哉博聞耆老意舊臧歟誠欲考得事實也有司驗脽上非舊臧處鼎大八尺一寸髙三尺六寸殊異於衆鼎今此鼎細小又有𣢾識不宜薦見於宗廟制曰京兆尹議是神爵年中當考漢鼎蘇軾漢鼎銘善夫吾丘夀王之説曰汾陰之鼎漢鼎也非周鼎夫周有鼎漢亦有鼎此易所謂正位凝命者豈三趾兩耳之謂哉郊祀志神爵元年為周康寶鼎於未央宫中劉敞曰似汾上所獲鼎也漢王雒山寶鼎廟鼎寶鼎詩紀明帝永平六年二月王雒山出寶鼎宋志云雒或作雄廬江太守獻之夏四月甲子詔曰昔禹收九牧之金鑄鼎以象物使人知神姦不逢惡氣遭德則興遷于商周周德既衰鼎乃淪亡注史記曰周鼎亡入泗水中秦始皇過彭城齋戒欲出周鼎於泗水使千人沒水求之不得祥瑞之降以應有德方今政化多僻何以致兹易曰鼎象三公豈公卿奉職得其理邪太常以其礿祭之日禮記曰夏祭曰礿陳鼎于廟以備器用賜三公帛五十匹九卿三千石半之班孟堅寶鼎詩嶽修貢兮川效珍吐金景兮歊浮雲寶鼎見兮色紛縕煥其炳兮被龍文登祖廟兮享聖神昭靈德兮彌億年東觀記廬江獻鼎詔召鄭衆問齊桓公之鼎在柏寢臺見何書春秋左氏有鼎事幾衆對狀除郎中郡國志汝南鮦陽注皇覽曰永平中葛陂城北祝里社下於土中得銅鼎而銘曰楚武王之冢漢古鼎仲山甫鼎竇憲傳和帝永元元年秋七月車騎將軍竇憲伐單于大敗之稽落山憲登燕然山勒石紀功南單于於漠北遺憲古鼎容五斗其傍銘曰仲山甫鼎其萬年子子孫孫永保用憲乃上之時憲登燕然山勒功也庭憲舉羌胡邉雜之師一舉而空朔追奔稽落之表飲馬北鞮之曲銘石負鼎薦告清廟列其功庸茂於前多矣崔子玉有竇大將軍鼎銘曰持盈若沖滿而不溢黃耳不革玉鉉終吉禹鏤其鼎湯刻其盤紀功申戒貽則後人説文序曰郡國往往於山川得鼎彛其銘即前代之古文漢橋公三鼎銘又見銘類橋玄三鼎東鼎銘曰維建寧二年秋八月丁丑延公入于玉堂前廷乃詔曰其以大鴻臚橋玄為司空中鼎銘曰四年延公登于玉堂前廷其以為司徒西鼎銘曰光和元年延公入崇德前殿乃制詔曰其以光祿大夫橋玄為太尉又黃鉞銘云拜度遼將軍始受旄鉞征鼓之任是用鏤石作兹征鉞軍鼓陳之東階以昭公文武之勛焉蔡雍集橋公廟碑云文德銘于三鼎武功勒于征鉞魏五熟釡周九寶魏神鐘寶鼎魏志魏國初建鍾繇為相國文帝在東宫賜繇五熟釡為之銘注魏略云太子與繇書曰昔有黃三鼎周之九寶咸以一體使調一味豈若斯釡五味時芳夫周之尸臣宋之考父衛之孔悝晉之魏顆彼四臣者並以功德勒銘鍾鼎今執事寅亮大魏以隆聖化堂堂之德于斯為盛誠太常之所宜銘彛鼎之所宜勒故作斯銘勒之釡口云云魏曹植作文帝誄曰神鍾寶鼎形自舊土雲英甘露纎塗被宇宋志陳思王大魏萹黃鵠遊殿前神鼎周四阿晉玉鼎頌宋志晉成帝咸和元年十月辛卯宣城春穀縣山岸摧獲石鼎重二斤受斛餘咸康八年九月廬江春榖縣留圭夜見門內有光取得玉鼎一枚外圍四寸豫州刺史路永以獻著作郎曹毗上玉鼎頌晉陽秋曰榖成縣民此文明之應宋元嘉古鼎神鼎符瑞志元嘉十三年四月辛丑武昌縣章山出神鼎江州刺史南譙王義宣以獻二十一年十二月新陽獲古鼎有篆書四十二字雍州刺史蕭思話以獻泰始五年五月壬戌豫章南昌獲古銅鼎容斛七斗江州刺史王景文以獻七年六月甲寅義陽郡獲銅鼎受一斛并蓋並隱起鏤豫州刺史段佛榮以獻吳赤烏十二年六月戊戌寶鼎出臨平湖又出東部酃縣南齊永明二年丹水上下得古鼎一枚唐古鼎銘闕四字貞觀二十二年九月遂州涪水中獲古鼎受五石三斗傍有銘刻響若洪鐘開元十三年十月壬申萬年人工慶築垣掘地獲寶鼎五獻之四鼎皆有銘銘曰垂作尊鼎萬福無疆子孫永寶用二十一年六月庚子眉州獻寶鼎重七百斤無耳足有篆書數字天寶元年五月平涼獲古鐡鼎獻之元和二年正月詔以湖南所獻古鼎付有司初永州人唐履昌得之重一百十二斤白虎通云澤出神鼎唐東都九鼎銘元宗開元二年八月十八日乙酉太子賓客薛謙光獻東都九鼎銘其蔡一作豫州鼎銘武后所製文曰上天降祉方建隆基宰相姚崇等奏聖人啓運休兆必彰故化馬為龍預流謡頌秀為天子早著冥符請宣付史官頒示內外從之通典武后萬嵗通天元年四月三日鑄九鼎成置於明堂之庭鼎上寫山川物産之象又造大儀鍾不成紀神功元年四月戊辰置九鼎于通天宫各位其方列廷中文粹有并州長史張仁旦進九鼎銘表傳鍾紹京善書武后時銘九鼎其筆也李泌天寶中獻明堂九鼎議志許康佐九鼎記四卷唐開元寶鼎地理志河中府寶鼎縣本汾隂開元十年獲寶鼎更名有后土祠舊史十一年獲鼎改縣名容册府玄龜云獲古銅鼎二其大者一斗會要開元十二年二月二十二日紀十一年二月壬午會要恐誤祠后土初有司奏修壇獲銅鼎二大者容四升小者容一升色皆青舊史開元二十二年四月丁未眉州鼎皇山江水得寶鼎盧庾梓潼神鼎賦不假雕鐫宛然文字咸平古銅鼎甗咸平三年九月丙戌會要作八月實録作九月乾州獻古銅鼎狀方而四足上有古文二十一字直昭文館句中正或作屯田郎中與杜鎬詳其文曰維六月初吉史信父作鬵甗期萬年子子孫孫永寶用中正等言按墨子云夏后鑄鼎四足而方春秋傳云晉侯賜子産二方鼎此其類也又説文云甗甑也爾雅曰甑謂之鬵詩云溉之釡鬵此所獲有無疆之兆請紀史册傳示千載從之是嵗八月庚申同州民獲古銅斗於河濱趙明誠曰方鼎與甗是兩物祥符古鼎寶録祥符五年十二月辛未南康軍獻古鼎有篆字人莫能識皇祐銅鼎鸞刀銘皇祐五年九月戊寅一作丙寅鑄鼎十有二圓丘用五宗廟七又作鸞刀郊廟各一初賈昌朝侍經筵帝問鼎卦聖人亨以享上帝今郊何以無鼎昌朝不能對曰容退而講求於是詔禮官議以為郊有亨牲進熟遂命阮逸胡瑗鑄銅鼎制鸞刀帝親書刻之牛鼎容一斛羊鼎五斗豕鼎三斗乙酉十九日御崇政殿觀新樂及新作晉鼓三牲鼎鸞刀以補禮器之闕劉敞為新律鍾鼎鸞刀銘四章鼎銘曰帝興神鼎象天地人赫赫神鼎聿維國珍光潤龍變其德日新建隆中聶崇義上重集三禮圖尹拙有祭玉祭鼎異同之説而張昭奏請圖釡鑊於鼎下元豐元年詳定禮文所議圓丘用犢不設羊豕鼎及俎奏罷之皇祐三鼎禮志皇祐五年閏月制三鼎鸞刀郊壇正配二位太廟七室牛羊豕鼎各一郊十二鼎扃無文飾廟二十一鼎三聖加三鼎奉慈后廟分命大臣行禮常祀公卿攝事十鼎皆塗金扃以玉飾天文志有周鼎三星在右攝提比西國之神器也崇寧九鼎隆鼐銘商六鼎崇寧二年二月以魏漢津言鑄鼎四年三月戊午成中曰帝鼐八方曰蒼彤晶寶魁阜牡岡上為鼐銘八鼎命宰臣撰於中太一宫南為九殿奉安名曰九成宫大觀元年鄭居中上鼎書一卷政和六年徙大內建圓象徽調閣藏之改帝鼐曰隆鼐八鼎曰育明藏寶健順和潔宣和元年三月庚戌安州得商六鼎上之大觀三年以鑄鼎之地作寶成宮政和七年又鑄神霄九鼎明年成置于上清寶籙宫神霄殿遂為十八鼎崇寧鼎書書目一卷九鼎制度并銘文帝鼐銘御製餘八鼎銘宰臣撰政和宗祀三鼎政和七年四月十八日禮制局言宗廟用九鼎其三為牲六為庶羞周頌我將云云明堂所用牲而已庶羞之鼎不當設元豐奉祀禮文明堂正配各用牛一羊一豕一請宗祀止用三鼎而不設庶羞之鼎其俎亦用六方於郊為文方於廟為質博古圖歷代之鼎形制不一有腹著叨餮而間以雷紋者父乙鼎父癸鼎之類是也有鍊色如金著飾簡美者辛鼎癸鼎之類是也有緣飾旋花竒古可愛者象形鼎橫戈父癸鼎之類是也有密布花雲或作雲雷迅疾之狀者晉薑鼎雲雷鼎之類是也有隱起叨餮間以雲龍或作細乳者亞虎父丁鼎文王鼎王伯鼎之類是也或如孟鼎之侈口中鼎之無文伯碩史頙鼎之至大金銀錯鼒之絶小或自方如簠或分底如鬲或設蓋如敦曰崇曰貫則名其國也曰讒曰刑則著其事也曰牢曰陪則設之異也曰神曰寶則重之極也商鼎二十六父乙至公非命父乙鼎銘三十字册鼎銘十一字周文王鼎銘曰魯公作文王尊彛仲忽于元祐間進之晉薑鼎銘一百二十一字取乃吉金用作寶尊鼎用蘄綰綽眉夀保其子孫三夀是利云云伯碩父鼎銘五十字惟六年八月初吉巳子史伯碩父追孝于朕皇考釐仲王母乳母尊鼎用祈丐百祿眉夀綰綽永命萬年無疆子子孫孫永寶用享史頙鼎銘四十三字王伯鼎銘曰王伯作寶彛鼎季妘鼎銘四十九字中鼎銘曰中作寶鼎南宫中鼎銘六十二字又銘三十九字又銘曰惟王命南宫伐反虎方之年王命中先相南國貫行藝王居在射圃真山中呼歸生刋王藝刋寶彛穆公鼎得於華隂銘二百十二字不可辨者八十二字父已鼎銘二十八字雍公緘鼎銘曰惟十有四月既死霸王在下保一作都雍公緘作尊鼎用追享孝于皇祖考用乞麋夀萬年無疆子子孫孫永寶用一云商洛鼎劉敞得于上雒叔液鼎銘曰惟五月庚申叔液自作饋鼎用蘄眉夀萬年無疆永夀用之伯􅥇父鼎銘曰晉司徒伯􅥇父作周姬寶尊鼎其萬年永寶用宋鼎銘曰宋公䜌作餗鼎宋夫人鼎銘曰宋君夫人之餗釪鼎漢孝成鼎銘五十六字長安厨孝成廟銅鼎容三斗一合建平三年十月工王褒造左丞輔掾談守令史永省第一好畤供厨鼎銘曰長樂飼官太官中丞汾隂宫鼎銘曰汾隂供官銅鼎二十枚又曰汾隂宫銅鼎一又曰平陽一斗鼎定陶鼎蓋有髙廟二字又曰定陶廟容十斗唐三螭鼎劉敞得鼎韓城銘文有晉薑有文侯釋其名以今文以為曲沃宗廟器又得汾隂侯鼎于鄠縣似古陪鼎汾隂侯蓋漢周昌形之圜者如父癸李妘形之方者如文王單景其銘乃曰作尊彛作從彛何也法度之器曰彛器尊彛者禮器之總名博古圖母乙鬲蔑敖鬲伯鬲帛女鬲師鬲慧季丁父京薑鬲皆有銘仲父鬲銘曰仲父作尊鬲子子孫孫其萬年永寶用爾雅鼎款足謂之鬲漢志空足曰鬲以象三德阜父丁盉銘共六字又盉銘曰孫父癸散季敦銘惟王四年八月初吉丁亥散季肇作朕王母叔薑寶敦散季其萬萬年子子孫孫永寶毁敦銘惟王元年正月初吉丁亥伯和父若曰師毁乃祖考有婚于我家汝右惟小子余命汝死我家繼治我西偏東偏僕馭百工牧臣妾東栽內外毋敢不善錫汝戈矛戟縞必彤侯矢十五錞鍾一五金𤭔乃夙夜用事毁拜稽首敢對揚皇君休用作朕文考乙仲鬺敦毁其萬年子子孫孫永寶用享敔敦銘惟王十月王在成周南淮節􅂒及內伐浪昴王命敔追迎于上洛執徯臼雜孚人三百十有一月王格于成周太廟武公入佑敔告禽馘百徯臼尹氏受釐敔圭鬲幣貝五十朋錫田于𤭔五十田于早五十田敔敢對揚天子休用作尊敦敔其萬年子子孫孫永寶用宰辟父敦銘惟四月初吉王在辟宫宰辟父佐周位王册命周曰錫汝華朱芾玄衣束帶於鋚革錫戈雕戟彤矦矢用養乃祖考事官􅯊節僕小射底敷周稽首對揚王休命用作文考寶敦其孫孫子子永寶用刺公敦銘伯據祖肇作皇考刺公尊敦用享用孝萬年眉夀畯在位子子孫孫永寶毛父敦銘惟六月既生魄戊戌旦王格于太室師毛父即位邢伯佑內史册命錫赤芾對揚王休用作寶敦其萬年子子孫其永寶用􅌏敦亦云毛伯內門立中庭佑孟薑敦銘叔孫父作孟薑尊敦綰綽眉夀永命彌生萬年無疆子子孫孫永寶用享父已甗銘三字又銘七字父乙甗銘曰子父乙虎祖己甗銘曰作祖己尊彝癸易卦獨於鼎言象圜象陽方象陰三足象三公四足象四輔光涵沒泗氣溢歊汾取乃吉金用作寶尊鼎牛首之鑄泗水之亡所謂正位凝命者在乎明尊卑之分成教命之嚴豈區區三趾兩耳之間哉苞木火於六爻之象鏤山川於九牧之金影射金晶光飛玉鉉煥彼龍文昭其象物峙其足以象三德虛其心以含萬類內亨飪以養賢上歊雲而作瑞黃耳才之中金鉉才之斷玉海卷八十八
