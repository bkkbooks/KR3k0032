body:
  text: 玉海卷一百九十二宋王應麟撰兵捷兵捷露布四唐天下兵馬元帥廣平郡王復兩京中書侍郎同平章事兼河南節度使都綂淮南諸軍事張鎬克河南郡縣紀天寳十四載十一月安祿山反陷河北諸郡十五載六月己亥祿山陷京師至徳二載閏八月丁夘廣平郡王俶代宗為天下兵馬元帥郭子儀副之以朔方安西囘紇南蠻大食兵討安慶緒九月壬寅廣平郡王俶及慶緒戰于灃水敗之癸卯復京師慶緒奔于陜郡十月戊申戰于新店敗之克陜郡壬子復東京慶緒奔于河北興平軍兵馬使李奐及慶緒之衆戰于武闗敗之克上洛郡癸亥迎上皇天帝于蜀郡丁夘至自靈武己巳闗内節度使王思禮及慶緒戰于絳郡敗之十一月丙子張鎬率四鎮伊西北廷行營兵馬使李嗣業陜西節度使來瑱河南都知兵馬司嗣吴王祗克河南郡縣十二月丙午上皇至自蜀郡乙丑史思明降乾元元年十一月壬申王思禮及慶緒戰于相州敗之通鑑至徳二載九月癸卯大軍入西京甲辰捷書至鳯翔百寮入賀十月壬子克上洛郡己未廣平王俶郭子儀入陜城壬戌廣平王俶入東京癸亥上發鳯翔丙寅上至望賢宫得東京捷奏丁夘上入西京百姓奉迎舞躍上入居大明宫郭子儀傳從元帥廣平王率蕃漢兵十五萬收長安李嗣業為前軍元帥為中軍子儀副之王思禮為後軍陣香積寺之北距灃水臨大川彌亘一舍賊李歸仁領勁騎薄戰官軍囂嗣業以長刀突出斬賊數十騎乃定囘紇以騎兵繚賊背夾攻之斬首六萬級生禽二萬賊帥張通儒夜走陜郡翌日王入京師老幼夾道呼曰不圖今日復見官軍王休士三日遂東安慶緒聞王師至遣嚴莊悉衆十萬屯陜助通儒旌幟鉦鼓徑百餘里師至新店賊以二百騎掩軍未戰走子儀悉軍追横貫其營賊張兩翼包之官軍却嗣業帥囘紇從後擊塵且坌飛矢射賊賊驚曰囘紇至矣遂大敗僵尸相屬于道嚴莊等走洛陽挾慶緒渡河保相州遂收東都於是河東河西河南州縣悉平李嗣業傳收長安嗣業綂前軍陣于香積寺北賊首李歸仁擁精騎薄戰王師注矢射之走未及營賊大出掩追騎還蹂王師於是亂不能陣嗣業謂子儀曰今日不蹈萬死取一生則我軍無類矣即袒持長刀大呼出陣前殺數十人陣復整歩卒二千以陌刀長柯斧堵進所向無前歸仁匿兵營右覘軍勢王分囘紇鋭兵擊其伏嗣業出賊背合攻之自日中至晏斬首六萬級填澗壑死幾半賊東走遂平長安進收東都僕固懷恩傳囘紇使葉䕶四千騎濟師帝使懷恩統囘紇兵從廣平王戰香積寺北賊以一軍伏營左懷恩馳掩之馘斬無遺者賊氣沮既合戰以囘紇夾攻賊戰酣脱甲援矛直擣陣殺十餘人衆驚靡亦㑹李嗣業鏖鬬尤力賊大潰及從王破賊於新店復兩京有殊功代宗紀安祿山反玄宗幸蜀肅宗留討賊代宗嘗從于兵間肅宗已即位郭子儀等率師討安慶緒未克肅宗在岐至徳二載九月以廣平郡王為天下兵馬元帥率朔方安西囘紇南蠻大食等兵二十萬以進討以安西北庭行營節度使李嗣業為前軍朔方河西隴右節度使郭子儀為中軍闗内行營節度使王思禮為後軍屯于香積寺敗賊將安守忠斬首六萬級賊將張通儒守長安聞守忠敗棄城走遂克京師乃留思禮屯于苑中代宗率大軍以東慶緒遣其將嚴莊拒于陜州代宗及子儀嗣業戰陜西大敗之慶緒奔于河北遂克東都肅宗還京師安祿山傳祿山營州栁城胡也天寳三年為范陽節度河北採訪使時太平久人忘戰祿山計天下可取逆謀日熾九載又兼河東節度使既兼制三道意益侈十四載十一月反范陽兵凡十五萬號二十萬敗封常清取東都明年正月僣稱皇帝國號燕西攻長安至徳二載正月為慶緒所弑慶緒既襲偽位以張通儒安守忠等屯長安於是廣平王率師東討通儒等裒兵十萬陣長安中賊皆奚素畏囘紇既合驚且囂王分精兵與李嗣業合擊之守忠等大敗引而東王師入長安悉師追賊嚴莊將兵十萬與通儒合鉦鼓震百餘里尹子竒已殺張廵悉衆十萬來并力次曲沃先是囘紇旁南山設伏按軍北崦以待莊大戰新店以騎挑戰六遇輒北王師逐之入賊壘賊張兩翼攻之追兵沒王師亂幾不能軍嗣業殊死鬬囘紇自南山繚撃其背賊驚遂亂王師復振合攻之賊大敗追奔五十餘里莊等走鄴王入洛陽大陳兵天津橋陳留殺尹子竒以城降嚴莊亦降肅宗在靈武披草萊立朝廷自郭子儀以兵五萬自河北至軍威始盛而囘紇吐蕃相繼請助國威討賊時至徳元載八月也祿山既得長安民復思唐皆傳太子以兵至賊見北方兵起輒驚欲走京畿豪傑往往殺吏應官兵誅而復起相繼不絶其始自京畿鄜坊至于岐隴皆附之至是四門之外率為敵壘賊兵力所及者南不出武闗北不過雲陽西不過武功江淮奏請貢獻之蜀與靈武皆自襄陽取上津路抵扶風道路無壅上又借兵外夷以張軍埶以宗室承寀為敦煌王與僕固懷恩使囘紇請兵又發拔汗那兵且使轉輸城郭諸國許以厚賞使從安西兵入援是歳十月囘紇遣其臣葛邏支將兵入援先以二千騎奄至范陽城下來與子儀軍合河曲皆平十二月于闐王勝身將兵五千入援又聞安西北庭及拔汗那大食諸國兵已至涼鄯上乃自彭原至保定郭子儀以河東居兩京之間扼賊要衝得河東則兩京可圖潜遣人入河東與唐官䧟賊者謀俟官軍至為内應至徳二年二月自洛交引兵趣河東分兵取馮翊楊炎作鳯翔出師紀功頌元結中興頌常衮賀收西京云壘揭終峯塹囘渭水鼓譟白刃來聚毳幕之羣旗靡黄塵旋就䲔鯢之戮祓腥羶于宫闕洗毒螫于閭閻澄丹霄而瞻羽衛肅黄道而復鑾輿唐荆襄招討山南東道處置兵馬使擒康楚元紀乾元二年八月乙巳襄州防禦將康楚元張嘉延反逐刺史王政九月甲子䧟荆州丁亥太子少保崔光逺為荆襄招討山南東道處置兵馬使十二月乙巳楚元伏誅韋倫傳擢啇州刺使荆襄道租庸使楚元亂自稱東楚義王南襲江陵絶漢沔餉道倫調兵屯鄧州擊禽楚元以獻唐平盧節度副使平劉展紀上元元年十一月甲午揚州長史劉展反䧟潤州丙申䧟昇州二年正月乙夘展伏誅宋州刺史劉展有異志淮西節度使王仲昇表其狀詔遷揚州長史宻詔淮南節度鄧景山執送京師展知之擁兵二萬度淮景山逆撃不勝奔壽州因引平盧節度副使田神功討展展叛凡三月平傳唐劒南節度使克東川紀上元二年四月壬午東川兵馬使叚子璋反䧟綿州遂州刺史嗣虢王巨死之節度使李奐奔成都五月庚子劒南節度使崔光逺克東川子璋伏誅唐天下兵馬元帥雍王平史朝義紀乾元二年九月庚寅史思明䧟東京上元二年史朝義弑思明寳應元年代宗即位甲戌以奉節郡王适徳宗為天下兵馬元帥乙亥進封魯王又徙雍王五月丙申李光弼及史朝義戰于宋州敗之十月辛酉雍王适討朝義癸酉适克懷州甲戌敗朝義于横水克河陽東都朝義將張獻誠以汴州降廣徳元年正月甲申朝義自殺通鑑甲戌朝義首至京師徳宗紀朝義據東都以适為天下兵馬元帥寳應元年十月屯于陜州諸將進擊朝義敗之朝義走河北遂克東都十一月朝義死幽州守將李懷仙斬其首來獻河北平丁亥薛嵩以相衛洛邢四州降丁酉張忠志以趙定深恒易五州降廣徳元年正月甲申懷仙以幽州降田承嗣以魏州降史朝義傳在東都召諸將不至輒欲還幽州㑹雍王适為元帥以河東朔方囘紇兵十餘萬討賊僕固懷恩與囘紇為先鋒魚朝恩郭英乂殿入自黽池李抱玉薄河陽李光弼徑陳留合兵次洛陽馳兵下懷州王師部伍靜嚴賊有懼色朝義以師十萬距横水戰大敗俘馘凡六萬閱四旬賊八戰八奔明年正月以騎五千夜出至范陽云云僕固懷恩傳時諸節度皆以兵㑹次黄水賊堅壁自固懷恩陣西原多張旗旝使突騎與囘紇稍南出繚賊左舉旗為應破賊壁死者數萬朝義擁精騎十萬來援埋根決戰殺獲相當魚朝恩令射生五百攅矢注射賊多死而陣堅不可動馬璘怒單騎援旗直進奪兩盾率部士薄賊屯出入三反賊辟易大軍乘以入斬首萬六千級禽四千餘人降者三萬轉戰石榴園老子祠賊再敗自相犇蹂死朝義燒明堂東奔進收河陽東都封府庫釋賊所署許叔冀田伷等衆皆按堵留囘紇屯河陽使其子瑒及北庭兵馬將髙輔成以萬騎逐北懷恩常壓賊再捷瑒大戰下博朝義復敗率殘衆奔幽州王師追躡朝義走平州自經死河北平實錄寳應元年十月朝義故將薛嵩張忠志李懷仙田承嗣見懷恩皆叩頭願效力行伍懷恩悉請裂河北分大鎮以授之唐河南副元帥知河南淮南山南東荆南五道節度行營事平袁晁代宗紀寳應元年八月辛未浙東台州賊袁晁反癸夘䧟信州十月乙夘䧟温明二州十二月甲戌李光弼及晁戰于衢州敗之廣徳元年三月丁未又敗之光弼傳晁建元寳勝以建丑為正殘剽州縣光弼遣麾下破其衆於衢州廣徳元年禽之浙東平使張伯儀討平之功第一光弼授柏良器兵平山越以部兵隷浙西平袁晁方清唐闗内兵馬副元帥復京師紀廣徳元年七月吐蕃䧟隴右諸州八月僕固懷恩反十月庚午吐蕃䧟邠州辛未寇奉天武功京師戒嚴壬申雍王适徳宗為闗内兵馬元帥郭子儀副之丙子如陜州戊寅吐蕃䧟京師立廣武郡王承宏為帝辛巳次陜州癸巳吐蕃潰子儀復京師十二月甲午至自陜州郭子儀傳懷恩屯汾州陰召囘紇吐蕃寇河西殘涇州犯奉天武功拜子儀為闗内副元帥鎮咸陽初子儀自相州罷歸部曲離散逮承詔麾下纔數十騎驅民馬補行隊至咸陽虜已過渭水並南山而東天子跳幸陜子儀聞流涕董行營還京師率騎南收兵得武闗防卒及亡士數千軍浸完㑹六軍將張知節迎子儀洛南大閲兵屯商州威震闗中乃遣知節率烏崇福羽林將長孫全緒為先鋒營韓公堆擊鼓讙山張旗幟夜叢萬炬以疑賊初光祿卿殷仲卿募兵藍田以勁騎先官車為遊奕直渡滻民紿虜曰郭令公來虜懼㑹故將軍王甫結俠少夜鼓朱雀街呼曰王師至吐蕃夜潰於是遣大將軍李忠義屯苑中渭北節度使王仲昇守朝堂子儀以中軍繼之射生將王撫亂京城子儀斬以徇破賊書聞以子儀為京城留守唐都統朔方邠寧鄜坊節度事敗党項羌紀廣徳元年三月甲子党項羌冦同川郭子儀敗之于黄堆山党項傳乾元間寇邠寧肅宗詔子儀都統以鄜州刺史杜冕邠州刺史桑如珪分二隊出討子儀至党項潰去唐闗内河東副元帥河中朔方節度大使破吐蕃紀永泰元年八月庚辰僕固懷恩及吐蕃囘紇党項羌渾奴刺寇邊九月甲辰吐蕃寇醴泉奉天党項羌寇同州渾奴刺寇盩厔京師戒嚴己酉屯于苑郭子儀屯于涇陽十月己未吐蕃至邠州與囘紇寇邊辛酉寇奉天癸亥寇同州乙丑寇興平丁夘囘紇党項羌請降癸酉子儀及吐蕃戰于靈䑓敗之通鑑廣徳二年二月郭子儀至河中九月辛亥充北道邠寧涇原河西通和吐蕃使永泰元年懷恩誘囘紇吐蕃數十萬衆入寇子儀使司馬趙復入奏請使諸道節度使鳯翔李抱玉滑濮李光庭一作進邠寧白孝徳鎮西馬璘河南郝廷玉淮西李忠臣出兵扼其衝要懷恩死吐蕃至奉天京師大震九月丙午急召子儀于河中使屯涇陽己酉忠臣屯東渭橋光進屯雲陽璘廷玉屯便橋抱玉屯鳯翔上自將六軍屯苑中庚戌下制親征丁巳吐蕃大掠而去十月遇囘紇復相與入寇辛酉至奉天丙寅圍涇陽子儀嚴設備而不戰丁夘囘紇在城西子儀使李光瓉等説之欲與共撃吐蕃囘紇曰郭令公在乎汝紿我耳子儀與數騎開門而出傳呼曰令公來囘紇舍兵下馬拜曰果吾父也子儀責之曰囘紇有大功唐之報汝不薄柰何負約深入藥葛羅曰吾為懷恩所誤請為公撃吐蕃以謝過子儀與之誓定約而還吐蕃聞之夜引兵遁藥葛羅帥衆追吐蕃子儀遣白元光帥精騎與之俱癸酉戰于靈臺西原大破之殺吐蕃萬計丙子又破之涇川東辛巳京城解嚴閏月辛夘朔方副將李懷光克靈州白孝徳傳子儀使渾瑊以兵五千出奉天命孝徳應之大戰赤沙烽斬獲甚衆懷恩傳吐蕃既持久又與囘紇爭長更相疑莫適先進囘紇乃詣子儀降請擊吐蕃自效子儀分兵隨之破其衆于涇州唐嶺南節度使平五嶺李勉傳節度嶺南番禺賊馮崇道桂州叛將朱濟時等負險為亂殘十餘州勉遣將李觀率容州刺史王翃討斬之五嶺平紀大厯四年廣州人馮崇道桂州人朱濟時反容管經畧使王翃敗之唐嶺南節度使克廣州紀大厯八年九月壬午循州刺史哥舒晃反殺節度吕崇賁十年十一月丁未嶺南節度使路嗣恭克廣州晃伏誅路嗣恭傳為江西觀察使兼嶺南節度使封冀國公嗣恭募勇敢八千人使孟瑶督大軍當其衝敬冕率輕兵由間道出不意遂斬晃及支黨萬餘築京觀俚洞為惡者夷之唐京畿渭北商華兵馬副元帥合川郡王李晟復京師紀建中四年十月涇原節度使姚令言反犯京師戊申如奉天朱泚反丁巳朱泚犯奉天興元元年三月壬辰次梁州四月甲辰李晟為京畿渭北商華兵馬副元帥五月乙未李晟及朱泚戰于苑北敗之戊戌又敗之于白華復京師六月癸夘姚令言伏誅甲辰朱泚伏誅七月壬午至自興元李晟傳晟圍朱滔將于清苑不克引還定州帝出奉天有詔召晟拜神䇿行營節度使進臨渭北壁東渭橋㑹李懷光反帝進狩梁州晟為繕甲兵治陴隍以圖收復於是駱元光以華州衆守潼闗尚可孤以神䇿兵保七盤皆受晟節度戴休顔舉奉天韓游瓌悉邠寧軍從晟帝進晟京畿渭北鄜坊商華兵馬副元帥引兵叩都門賊不敢出㑹諸將圖所向衆對先拔外城然後清宫晟曰外城有里閈之隘若伏兵格戰居人囂潰非計也賊重兵精甲聚苑中今直擊之是破其腹心將圖走不暇諸將曰善乃自東渭橋移壁光泰門以薄都城連溝栅而賊將張庭芝李希倩求戰晟曰賊不出是吾憂也今乃冒死來天誘之矣勒吴銑等縱兵鏖擊賊攻華師急晟以精騎馳救中軍譟而從大破之乗勢入光泰門再戰賊却僵尸相籍餘衆走白華賊大哭終夜不息翌日將復戰或請待西師晟曰賊既散敗當乘機撲滅茍俟西軍是容其為計豈吾利也乃悉軍軍光泰門使王佖李演將騎史萬頃將歩抵苑北晟先夜隤苑垣為道一百歩北兵至賊已伐木塞以拒戰晟叱諸將萬頃懼先登拔柵以入佖督騎繼之賊崩潰執其將叚誠諌大兵分道進雷譟震地令言庭芝希倩等殊死鬬晟令唐良臣等歩騎奔突賊陣陣成輒北十餘遇皆不勝䠞入白華賊伏千騎出官軍背晟以麾下百騎自馳之左右呼云相公來賊驚潰禽馘畧盡泚率殘衆萬人西走田子竒追之餘黨悉降分慰居人秋毫無所擾坊人之逺者宿昔乃知王師之入也擇文武攝臺省官以俟乘輿露布至梁帝感泣羣臣上壽朱泚傳節度使朱希彩為下所殺衆推泚為留後後入朝請留京師徳宗立為鳯翔節度使朱滔叛召泚還京師李希烈圍哥舒曜於襄陽詔涇原節度使姚令言督鎮兵五千東救曜過闕下京尹王翃使吏供軍糲飯菜殽衆怒乃反薄丹鳯門詔集六軍無至者帝幸奉天賊無屬畏不能久以泚昔在涇有恩且失權久庸思亂令言乃率騎見泚迎泚舍前殿僣即帝位號大秦自將逼奉天圍凡三旬有六日而李懷光破賊于魯店泚引去後為李晟所破姚令言等十鬬皆北引殘軍西走其黨梁庭芬斬泚傳首以獻于公異傳李晟表為招討府掌書記朱泚平露布徳宗曰臣既肅清宮禁祇奉寢園鍾簴不移廟貌如故帝覽泣下曰誰為之辭或以公異對帝咨歎再三通鑑先是泚遣張光晟將兵五千屯九曲去東渭橋十餘里光晟宻輸欵于晟及泚敗光晟勸泚出亡泚乃與姚令言帥餘衆西走猶近萬人光晟送泚出城還降晟晟遣兵馬使田子竒以騎兵追泚晟屯含元殿前舍右金吾仗公私安堵秋毫無犯是日渾瑊戴休顔韓遊瓌亦克咸陽敗賊三千餘衆聞泚西走分兵邀之己亥晟使京西兵馬使孟渉屯白華門尚可孤屯望仙門駱元光屯章敬寺晟以牙前三千屯安國寺以鎮京城舊傳興元元年六月癸夘晟遣于公異作露布上行在略曰泚長戈指闕流矢射天既緩雷霆之誅遂延晷刻之命臣祗承睿算恭行天討未鼓而人心粗厲先庚而軍令凝嚴各懷報國之心争淬復讐之刃將士超乘賈勇免胄啟行陳兵於光泰門外盡鋭於神䴥倉東指麾而貙兕作威感激而風雷動色七擒連發而星馳兩翼旁張而雲合且稽分體未即燃臍云云晟蕩夷凶祲市不易廛長安之人不識旗鼔雖三代用師不能加八月癸夘晟改封西平郡王唐晉慈隰諸軍行營兵馬副元帥平河中紀興元元年二月甲子李懷光反丁夘如梁州懷光將孟庭保以兵來追三月懷光奪李建徽陽惠元兵惠元死之四月䧟坊州八月癸夘馬燧為晉慈隰諸軍行營兵馬副元帥渾瑊為河中同絳陜虢諸軍副元帥瑊進兼朔方十二月渾瑊敗績貞元元年四月壬午瑊及懷光戰長春宮敗之丙戌燧瑊為河中招撫使戊子燧及懷光戰陶城敗之八月甲戌懷光伏誅賊將牛名俊斬懷光降衆猶萬六千誅其黨它脅附赦之不閲月河中平李懷光傳渤海靺鞨人也帝狩奉天懷光率所部奔命自蒲津絶河敗泚軍于醴泉又敗賊于魯店泚解圍去進副元帥中書令懷光不得朝恚恨數暴盧杞等罪帝貶杞懷光自疑陰連朱泚詔賜鐵劵抵于地約韓游瓌為變又遣將趙升鸞諜奉天為内應以脅乘輿渾瑊發其姦請帝幸梁州懷光追帝不及乃奪李建徽陽惠元等軍屯好畤引兵掠涇陽三原富平遂如河中詔以為太子太保不奉詔取同絳二州按兵觀望京師平興元元年七月庚辰命孔巢父召之為所害於是帝遣渾瑊討之帝以河東馬燧威名白著拜副元帥與瑊及鎮國駱元光邠寧韓游瓌鄜坊唐朝臣㑹兵進討諸軍遂圍河中貞元元年八月朔方部將牛名俊斬懷光傳首獻唐華州潼闗節度使克鹽夏二州紀貞元二年十一月辛丑吐蕃䧟鹽州十二月丁巳䧟夏州馬燧為綏銀麟勝招討使三年二月己夘華州潼闗節度使駱元光克鹽夏二州唐劒南西川節度使韋臯破吐蕃克巂州紀功紀貞元五年九月丙午劔南西川節度使韋臯敗吐蕃于臺登北谷克巂州八年九月丁巳韋臯及吐蕃戰于維州敗之十年六月丙寅韋臯敗吐蕃克峨和城十六年七月己未韋臯克末恭城十七年二月乙巳及吐蕃戰于鹿危山敗之七月戊寅吐蕃寇鹽州乙丑䧟麟州九月乙亥韋臯敗吐蕃于雅州克木波城南詔傳貞元十七年春吐蕃大料兵率三戸出一卒欲悉師出西山劒山收巂州以絶南詔時虜兵三萬攻鹽州帝以虜多詐疑繼以大軍詔韋臯深鈔賊鄙分虜勢俄聞虜破麟州臯督諸將分道出或自西山或自平夷或下隴陀和石門或徑神川納川與南詔㑹是時囘鶻太原邠寧涇原軍獵其北劒南東川山南兵震其東鳯翔軍當其西蜀南詔深入克城七焚堡百七十所斬首萬級獲鎧械十五萬圍昆明維州不能克乃班師振武靈武兵破虜二萬涇原鳯翔軍敗虜原州惟南詔攻其腹心俘獲最多吐蕃傳貞元十七年冦䀋州䧟麟州韋臯出西山與虜戰破之雅州籠官馬定徳虜之知兵者周知山川險易比年冦黎巂臯常折其兵定徳遂降因定昆明諸蠻吐蕃侵靈州時臯圍維州賛普使論莽熱引兵十萬援維州臯率南詔兵薄險設伏以待遂禽之獻京師通鑑十八年正月禽莽熱乙亥臯遣使獻之韋臯傳貞元初為劒南西川節度使初雲南蠻羈附吐蕃其盗塞必以蠻為鄉道臯潜計得雲南則斬虜右支乃間使招徠之稍通西南夷招褒封其大酋領苴那時烏星明年雲南求内屬約東蠻鬼王驃傍苴夢衝等絶吐蕃盟貞元五年東蠻斷瀘水橋攻吐蕃請臯濟師臯以劔南精卒二千與蠻共破吐蕃于臺登東北谷殺虜酋乞臧遮遮悉多揚朱及論東柴等遮遮尚結賛子虜將悍雄者也既敗屯柵以次降定西南少安初東蠻地二千里勝兵常數萬南倚閤羅鳯西結吐蕃狙勢强弱為患臯能綏服之故戰有功詔以那時為順政王夢衝懷化王驃傍和義王刻兩林勿鄧等印以賜之而夢衝復與吐蕃盟臯召之斬于琵琶川立次鬼王様弃等蠻部震服乃建安夷軍于資州維制諸蠻城龍溪于西山保納降羌九年天子城鹽州䇿虜且來襲詔臯出師牽維之乃命大將董勔張芬分兵出西山靈闗破峩和通鶴定廣城踰的博嶺遂圍維州搏棲雞攻下羊溪等三城取劒山屯焚之南道元帥論莽熱來援與戰破其軍進拔白岸及城鹽州于是西山羌八國酋長皆因請入朝乃詔臯統押諸蠻八國雲南安撫使俄進同中書門下平章事十三年復巂州吐蕃恐完壘造舟謀擾邊臯破却之自是曩貢臘成等九節度嬰嬰籠官馬定徳舉落皆降昆明管些蠻又内附賛普怒遂北掠靈朔破麟州以取償焉十七年七月己丑帝詔臯深入以撓虜臯遣大將陳洎等出三竒崔堯臣趨石門仇冕董振走維州邢玭出黄崖略棲雞老翁城髙倜王英俊繇峨和清溪道薄故松州元膺出濕山成溪凡十一道濟師無慮五萬以八月悉出塞十月大破吐蕃拔其保鎮捕候追奔轉戰千里遂圍維州吐蕃釋靈朔兵使論莽熱以内大相兼東境五節度大使率雜虜十萬來救師伏以待虜乘勝深入師譟而奮虜大潰生禽莽熱獻諸朝帝恱進中書令南康郡王十月庚子帝製紀功碑褒賜之臯治蜀二十一年凡破吐蕃四十八萬紀貞元八年十一月庚午山南西道節度使嚴震及吐蕃戰于黒水堡敗之十年正月壬辰南詔蠻敗吐蕃于神川來獻捷書稱即叙詩美來威捨其脣齒之資為我爪牙之用唐嶺南節度使克瓊州紀貞元五年十月李復克瓊州李復傳安南佐李元度胡懷義阻兵脅州縣復至杖流之南裔肅然鐫諭蠻獠収瓊州置都督府綏定之唐黔中經畧觀察使平溪州郗士美傳溪州賊向子祺以衆八千阻山剽刼士美討平之唐左神䇿行營節度使東川節度副使平劉闢興安樓受俘紀永貞元年八月癸丑西川韋臯卒行軍司馬劉闢自稱留後元和元年四月癸未髙崇文為左神䇿行營節度使率左右神䇿京西行營兵馬使李元奕山南西道節度使嚴礪劒南東川節度使李康以討劉闢甲申闢䧟梓州執李康三月丙子崇文克梓州六月丁酉崇文及劉闢戰于鹿頭柵敗之癸卯嚴礪又敗之于石碑谷七月癸丑崇文及劉闢戰于元武敗之九月丙午嚴礪戰于神泉敗之辛亥崇文克成都十月戊子闢伏誅通鑑永貞元年八月韋臯薨闢自為留後求節鉞不許八月己未以袁滋為東西川山南西道安撫大使十月戊戌滋為節度使紀云戊戌滋罷召闢為給事中十一月闢不受詔阻兵自守十二月己酉詔以為西川節度副使元和元年正月闢得旌節志益驕求兼領三川不許遂發兵圍東川李康于梓州欲以同幕盧文若節制東川上欲討闢而重于用兵公卿議者亦以為蜀險固難取杜黄裳獨曰闢狂戇書生取之如拾芥耳臣知神䇿軍使長武城使髙崇文勇略可用願陛下専以軍事委之勿置監軍闢必可禽從之戊子命左神䇿行營節度使髙崇文將歩騎五千為前軍神䇿京西行營兵馬使李元奕將歩騎二千為次軍與山南西道節度使嚴礪同討闢時元和元年正月也時宿將名位素重者甚衆皆自謂當征蜀之選及詔用崇文皆大驚崇文屯長武城練卒五千常如寇至卯時受詔辰時即行一作卯漏受命辰巳出師器械糗粮一無所缺甲午崇文出斜谷李元奕出駱谷同趨梓州崇文軍至興元軍士有食于逆旅折人匕筯者崇文斬之以徇時闢䧟梓州執李康二月嚴礪拔劒州斬其刺史文徳昭三月崇文引兵自閬州趨梓州劉闢將邢泚遁崇文入屯梓州闢歸李康于崇文以求自雪丙子礪奏克梓州丁丑諭將帥罪止渠魁東川節度使韋丹至漢中表言髙崇文客軍逺闘無所資若與梓州綴其志必能有功四月丁酉以崇文為東川節度副使知節度事五月闢城鹿頭闗連八柵屯兵萬人以拒崇文六月丁酉崇文擊敗之闢置柵于闗東萬勝堆戊戌崇文遣驍騎將范陽髙霞寓攻奪之下瞰闗城八戰皆捷庚子崇文破闢于徳陽癸夘又破之于漢州嚴礪遣將嚴秦破闢衆萬餘人於綿州石碑谷秋七月癸丑崇文又破其衆於元武九月壬寅崇文又敗其衆于鹿頭闗嚴秦又破其衆于神泉河東將阿跌光顔將兵㑹崇文于行營愆期一日懼誅欲深入自贖軍于鹿頭之西斷其糧道城中憂懼于是闢綿江柵將李文悦鹿頭等守將仇良輔皆以城降崇文獲闢壻蘇强士卒降者萬計崇文遂長驅直指成都所向皆潰軍不留行辛亥克成都劉闢盧文若帥數十騎西奔吐蕃崇文使髙霞寓等追之及羊灌田禽闢赴江不死文若自沈于江崇文入成都屯于通衢休息士卒市肆不驚珍寳山積秋毫不犯檻劉闢送京師十月戊子闢至長安神䇿以兵迎之詔左右神䇿兵領闢等自臨臯驛至闕下係其首曳而入帝御興安樓受俘崇文傳刻石紀功于鹿頭山李吉甫言漢伐公孫述晉伐李勢宋伐譙縱梁伐劉季連蕭紀凡五攻蜀繇江道者四韓愈詩曰闢黨聚謀鹿頭是守崇文奉詔進退規矩戰不貪殺擒不濫數八月壬午闢棄城走分散逐捕搜原剔藪闢窮且窘若杵投臼來獻闕下以告廟社優賞將吏扶珪綴組興戈矛于闗西發介馬于并部五營禁旅七萃神兵合貔武之雄授鷹揚之帥守無絶險進靡堅營唐安南都䕶破環王紀元和四年八月丙申環王本林邑漢日南象郡之圯寇安南都䕶張舟敗之㑹要元和四年八月張舟奏破環王國偽驩愛州都統殺三萬餘人獲王子五十九人器械戰船戰象稱之唐容管經略使招討使破西原蠻紀元和二年二月癸酉邕管經略使路恕敗黄洞蠻執首領黄承慶三年六月西原蠻首領黄少卿降十一年八月戊申䧟賔蠻二州十月乙丑邕管經略使韋悦克賔蠻十二月己未䧟巖州十二年容管經略使陽旻克欽横潯貴四州傳蠻居廣容之南邕桂之西天寳初黄氏彊貞元十年首領黄少卿攻邕管俄䧟欽横潯貴八月少卿子昌沔趫勇前後䧟十三州憲宗以陽旻為招討引師掩賊一日六七戰皆破之侵地悉復唐彰義節度使淮西宣慰處置使裴度平淮西興安門受俘紀元和九年閏八月丙辰彰義節度使吴少陽卒其子元濟自稱知軍事十二年七月丙辰裴度為淮西宣慰處置使十月癸酉一云丁夘克蔡州辛巳御宣政殿受朝賀十一月丙戌吴元濟伏誅吴元濟傳元和九年吴少陽卒子元濟匿不發䘮以病聞偽表請元濟主兵不得命乃悉兵四出焚舞陽及葉掠襄城居人皆竄伏榛莽間剽係千餘里闗中大恐弔使至弗克入乃還乃詔烏重胤兼汝州刺史引軍壓其境寧州刺史曹華為之副以戍襄城李光顔為忠武節度使總兵臨屯析山南東道節度使嚴綬為申光蔡等招撫使以中人崔潭峻監其軍下詔奪元濟官爵趣諸道進討時大旱詔既下雨雪凡三日田弘正韓弘各遣子率兵隷授光顔軍又詔李文通為壽州刺史進討九月丁亥討之㑹裴度輔政賊始懼光顔大破賊于時曲十年五月丙申復與重胤敗之天子以韓弘兼都統九月癸酉賊敗髙霞寓又文通銜枚夜出九女原屠堡壁三十所降者萬餘執兩將光顔敗郾城兵二萬俘六將復與重胤合攻凌雲柵拔之十一年四月庚子復以李愬為唐鄧随節度使愬引兵攻其西破屯柵十餘所執丁士良吴秀琳皆賊剽健者賊帥張伯良以兵三萬與光顔戰郾城大敗獲馬千匹甲三萬首伯良奔還賊將鄧懷金降愬略興橋得守將李祐不殺引至帳下與計議始謀襲蔡自少誠盗有蔡四十年王師未嘗傅城下又嘗敗韓全義于頔以是兵驕無所憚内恃陂浸重阻故合天下兵攻之三年纔克一二縣帝責罷霞寓滋等諸將乃用命裴度為彰義節度使兼申光蔡四面行營招撫使十二年梁守謙與諸將計先度未至諸將亟戰不勝度至大勞戰士皆感泣請戰光顔每戰冠軍故元濟悉衆抗時曲祐為愬謀曰蔡之守者市人疲卒耳勁兵在外若直擣懸瓠賊成禽矣愬然之以精騎夜襲蔡坎垣入之戍者不知也賊恃董重質之兵在洄曲不虞師之至及愬攻城防卒尚千餘人接戰元濟始驚被甲乘城以待重質降愬而李進誠取賊庫兵即攻之明日燒其門民相率抱薪增火王師縱火城上鏃可拾也居二日門壞執元濟舉族傳之長安申光戍兵尚三萬皆降帝御興安門受俘十一月丙戌朔羣臣稱賀以元濟獻社徇于市斬之帝美度功即命韓愈為平淮碑裴度傳于時討蔡數不利羣臣爭請罷兵㑹唐鄧節度使髙霞寓戰却它相知帝厭兵欲赦賊惟度請以身督戰十二年即拜門下侍郎同平章事彰義軍節度使淮西宣慰招討處置使表馬總為副度屯郾城勞諸軍宣朝廷厚意士奮于勇奏罷監軍將専號令一戰氣倍未幾李愬夜入蔡十月壬申自懸瓠城縛吴元濟以報度遣馬總先入蔡明日綂洄曲降卒萬人持節徐進撫定其人辛巳度入蔡大饗賚功初元濟禁偶語夜不然燭酒食相饋者以軍法論度下令一切蠲除民始知有生之樂十二月壬戌制叙平寇之功度加金紫光祿大夫封晉國公愬銀青光祿大夫凉國公李愬傳憲宗討吴元濟愬求自試為随唐鄧節度使蔡人以嘗敗辱霞寓等又愬名輕不為備愬沉鷙推誠待士衆願為愬死居半年戰嵖岈山取爐冶城擒騎將丁士良不殺署捉生將用其謀降吴秀琳取文城柵秀琳為愬䇿取李祐署六院兵馬使始定襲蔡之謀時光顔戰數勝愬知其隙可乘乃告裴度師期元和十一年十月己夘師夜起祐為前鋒出文城柵襲張柴殱其戍㑹大雨雪天晦凛風偃旗裂膚馬縮慄士抱戈凍死于道十一二愬分輕兵斷橋以絶洄曲道又以兵絶朗山道夜行七十里夜半至懸瓠城雪甚城旁多鵞鶩池愬令撃之以亂軍聲賊恃吴房朗山戍晏然無知者祐等坎墉先登衆從之殺門者持柝傳夜自如黎明雪止愬入駐元濟外宅蔡吏驚曰城䧟矣元濟尚不信及聞號令始驚率左右登牙城田進誠兵薄之愬計元濟且望救于董重質乃慰其家以書召董重質重質降檻送元濟京師申光諸屯尚二萬衆皆降不戮一人李光顔傳裴度築連城于沲口率輕騎觀之賊以竒兵自五溝至光顔力戰却之先是光顔䇿賊必至宻遣田布伏精騎五溝下扼其歸賊顛死溝中者千餘由是賊悉以鋭士當光顔而李愬得乘虚入蔡矣藝文志路隋平淮西記一卷鄭澥凉國公李愬平蔡錄一卷栁宗元作平淮夷雅皇武方城唐魏博節度使田弘正平李師道紀元和十三年七月乙酉宣武魏博義成横海軍討李師道十四年正月丙午田弘正及李師道戰陽榖敗之二月戊午師道伏誅李師道傳師道師古異母弟也師古卒髙沐李公度與家奴立之請于朝憲宗方誅劉闢未遑東討故以師道知留後歳中加檢校尚書為副大使自正已至師道四世未嘗不叛間雖外奉王命而嘯引亡叛有得罪于朝者厚納之以嚴法持下凡所付遣必質其妻子有謀順者類夷其家以故能脅汙士衆傳三世云帝討蔡詔興諸道兵而不及鄆師道選卒二千人抵壽春言為助王師實欲援蔡也又用亡命少年謀盗焚河陰漕院緡糧令刺客殺武元衡傷裴度又潜聚兵于東都之邸椎牛釃酒既衷甲矣其徒白于官乃克掩殺之黨與數千皆伏誅又得其所藏弓材五千并斷建陵門㦸四十七初師道素倚淮西為援及聞李光顔拔蔡凌雲柵始大懼遣使歸順帝重分兵支兩寇故命栁公綽慰撫之又遣張宿諷令割地質子師道許納三州遣子入侍既還師道中悔召諸將議皆曰蔡數州戰三四年乃克公今十二州何所虞大將崔承度獨曰公初不示諸將腹心而今委以兵此皆嗜利者朝以一漿十餅誘之去矣帝復遣李遜諭㫖元和十三年正月乙巳師道以軍不協為解帝怒下詔削其官詔諸軍進討七月乙酉武寧將王智興破其衆斬二千級横海節度使鄭權戰福城斬五百級武寧將李祐戰魚臺敗之宣武節度使韓弘抜考城淮南節度使李夷簡命李聼趨海州下沭陽朐山進戍東海魏博節度使田弘正身將兵自陽劉濟河拒鄆四十里而營十一月再接戰破三萬衆擒三千人陳許節度使李光顔攻濮陽收斗門杜莊二屯弘正又戰東阿殘其衆五萬師道每聞敗輙悸成疾及李祐取金鄉左右莫敢白初遣大將劉悟屯陽榖當魏博軍疑其逗遛悟懼不免引兵反攻城傳首京師十四年二月田弘正之渡河也擒其將夏侯澄等四十七人有詔悉赦之父母在欲還者優遣賊皆感慰相告由是劉悟得行其謀通鑑初師道謀逆命其判官髙沐郭明李公度屢諌之李文㑹林英素言於師道由是疎沐等及淮西平師道憂懼不知所出乃請納地獻質既而悔上怒其反覆决意討之賈直言冒刃諌師道者二輿襯諌者一又畫縳載檻車妻子係累者以獻師道亦囚之元和十三年七月乙酉下制罪狀李師道令宣武節度韓弘魏博節度田弘正義成節度李光顔武寧節度李愬横海節度鄭權兵共討之十一月田弘正自楊劉渡河拒鄆州四十里築壘賊中大震再戰破三萬衆十二月武寧節度使李愬與平盧兵十一戰皆捷己夘攻金鄉克之十四年正月淮南節度使李夷簡命李聽趨海州丙戌下沭陽聽乃楚州刺史丙申弘正又敗其兵於東阿殺萬餘人丙午復敗之于陽榖師道既累敗于李愬田弘正二月乃發民治鄆州城塹修守備役及婦人民懼且怨都知兵馬使劉悟捕師道與二子斬之首傳京師弘正露布以聞十二州皆平壬戌弘正捷奏至甲子御宣政殿受賀己巳興安門稱賀恃東秦十二之險誇臨菑三七之兵竊據一方歳踰五紀鄆城自潰寧同莒魯之爭齊地悉平無俟耿陳之戰盡建十二郡之旗鼔以列降人削十六年之厲階歸皇化裴度傳李師道怙强度宻勸帝誅之乃詔宣武義成武寧横海四節度㑹田弘正致討弘正請自黎陽濟合諸節度兵度曰魏博軍度黎陽即叩賊境封畛比聨易生顧望是自戰其地不如飬威河北須霜降水落絶陽劉深抵鄆以營陽榖則人人殊死賊勢窮矣上詔弘正如度言師道果擒舊史命宰臣崔羣撰碑紀績韓信伐齊耿弇討歩唐滄州行營招撫使平李同捷紀寳厯二年四月戊戌横海節度李全略卒其子同捷反太和元年五月丙子横海節度烏重胤討之十一月李寰討之十二月庚戌王智興為滄州行營招撫使傳云檢校司徒同平章事滄徳行營招撫便二年七月辛丑魏博史憲誠及同捷戰于平原敗之八月辛巳又敗之十月庚申又敗之壬午盧龍節度李載義又敗之于長蘆三年四月壬辰滄景節度使李祐克徳州同捷降乙亥滄徳宣慰使栢耆以同捷歸于京師實錄云云太和三年五月乙夘朔宰臣稱賀于紫宸殿丙戌滄州進栢耆表并露布李同捷傳文宗立遣弟入朝奉表請命有詔拜兖海節度以烏重胤代之同捷計窮矯言軍中留已于是王智興武寧節度請以全軍出討魏博史憲誠令大將傳手詔入于軍同捷不受詔削官爵命重胤率鄆齊兵進討憲誠智興及汴滑李聽平盧康志睦易定張璠幽州李載義以兵傅境同捷傾玉帛子女市河北三鎮載義絶交執使者獻諸朝智興攻棣州火譙門引水灌城凡七月其將張叔連降智興進圍滄州後更以李祐代重胤而智興將李君謀絶河殘無棣降饒安壁五千兵明年祐拔無棣平原兵薄徳州帝遣諫議大夫栢耆宣慰祐攻拔徳州同捷益急乞降耆引兵入城取同捷至將陵斬之傳首京師滄景平憲誠請納地王智興傳請悉師三萬齎五月糧討賊既戰降其將十輩鋭士三千遂拔棣州使石雄先驅度河鼓行無前十一月壬辰賞功唐河東節度使囘鶻南面招撫使破烏介可汗紀功幽州紀㑹昌二年正月己亥囘鶻寇横水柵略天徳振武軍三月寇雲朔七月寇大同川九月劉沔為囘鶻南面招撫使張仲武為東面招撫使李思忠為河西党項都將西南面招討使三年正月庚子天徳軍行營副使石雄及囘鶻戰于殺狐山敗之通鑑云丙午劉沔捷奏至劉沔傳節度振武囘鶻寇天徳武宗詔以兵據雲伽闗虜引去㑹昌二年拜河東節度兼招撫囘鶻使進屯雁門闗虜寇雲州沔擊之斬七禆將敗其衆虜殘衆走詔沔追北仍錄李靖平頡利事賜之王逢傳從沔雄破囘鶻于天徳回紇傳穆宗立囘紇固請昏俄而可汗死崇徳可汗立詔以太和公主下降主憲宗女也敬宗即位之年可汗死其弟立冊為昭禮可汗太和六年為其下所殺明年帝復遣使冊其從子胡特勒為彰信可汗開成四年相掘羅勿作難引沙陀兵共攻可汗可汗自殺國人立㕎馺特勒為可汗武宗即位其國亂黠戛斯乘之攻回紇城殺可汗焚其牙可汗牙部十三姓奉烏介特勒為可汗㑹昌元年二月黠戛思已破回紇得太和公主遣使奉主來歸烏介怒追擊使者殺之刼主南度磧進攻天徳城振武節度使劉沔屯雲伽闗却之宰相李徳𥙿建言回紇曩有功今飢且亂可汗無歸不可擊宜遣使贍安之而公主亦遣使來言烏介已立因請命又其大臣頡干伽思等表假振武居公主可汗帝詔十二月庚辰右金吾大將軍王㑹持節慰撫其衆輸糧二萬石不許借振武明年回紇奉主至漠南入雲朔剽横水殺略甚衆轉側天徳振武間乃詔諸道兵合討然烏介兵尚强號十萬駐牙大同北閭門山而其王子嗢沒斯等以所部來降二年四月甲申帝賜嗢沒斯姓李氏名思忠八月丁丑欲使助可汗復國而可汗已攻雲州劉沔與戰敗績可汗遣使者藉兵欲還故廷且假天徳城帝不許可汗恚進略大同川轉戰攻雲州於是詔劉沔張仲武為招撫使李思忠為西南靣招討使九月又詔乙巳何清朝契苾通以蕃渾兵出振武與沔仲武合思忠數深入諭降其下沔分沙陀兵益思忠河中軍以騎五百益李弘順沔進次雲州思忠屯保大柵率河中陳許兵與回紇戰敗之十二月明年三年正月又為弘順所敗沔與天徳行營副使石雄料勁騎夜出雲州走馬邑抵安衆塞逢虜與戰破之烏介方薄振武雄馳入夜穴壘出鏖兵烏介驚引去雄追北至殺胡山烏介被創走庚子雄遇公主奉主還降特勒以下衆數萬烏介走依黒車子為黑車子所殺帝詔李徳裕紀功銘石于幽州張仲武傳云云見紀功類破囘鶻特勒那頡啜李徳𥙿傳初帝問計於徳裕徳裕曰今烏介所恃公主耳得健將出竒兵奪還之王師急擊彼必走今鋭將無易石雄者得以蕃渾勁卒與漢兵銜枚夜擊之勢必得帝即以方畧授劉沔令雄邀撃可汗於殺胡山敗之迎公主還石雄傳㑹昌初回紇入寇連年掠雲中牙五原塞詔佐劉沔屯雲中沔召雄謀曰虜離散當掃除久矣國家以公主故不欲亟攻我若徑趨其牙不及備必棄公主走我當迎主歸有如不捷吾則死之雄曰諾即選沙陀李國昌及契苾拓拔雜虜三千騎夜發馬邑且登振武城望之見罽車十餘乘從者朱碧衣諜者曰公主帳也雄前使諭之曰天子取公主兵合苐無動雄穴城夜出縱牛馬鼓譟直擣烏介帳可汗大驚單騎走追至殺胡山斬首萬級獲牛羊不貲逆公主還李徳裕幽州紀聖功碑曰回鶻北狄之裔吐迷度欵塞太宗幸靈武納降置瀚海郡督代宗戡難葉䕶親扈戎旌猶羌髳翼周北貉助漢厥後飾宗女配之立宫室居之被我文繢帶我金犀蝎蠧上國百有餘年本國薦饑黠戛斯遂焚龍庭烏介竊號沙漠質貴主以前驅依大國而為援丐米糒邀甲兵以呼韓故事願居光祿塞保受降城張仲武命弟仲至率鋭兵二萬建斾而前介胄雪照戈矛林植虜侯王貴人以千數谷靜山空靡有子遺通鑑㑹昌二年五月大破那頡啜降其七千帳命從事李周瞳馳傳入奏又命牙門將國從玘繼獻戎俘皇帝受而勞之羣臣畢賀銘曰太和之初赤氣宵興開成之末彤雲暮凝異烏南來胡滅之徴北夷颷掃厥國土崩逼廹遷徙震我邊鄙長蛇去穴奔鯨失水皇赫斯怒羽檄召兵謀而淵黙斷乃雷聲天街之北旄頭已落絶轡之野蚩尤未縛俾我元侯恢弘逺略取彼單于係之徽索唐晉絳行營節度使石雄平劉稹興安門受俘紀㑹昌三年四月乙丑昭義軍節度使劉從諫卒其子稹自稱留後五月辛丑成徳軍節度使王元逵為北靣招討澤潞使魏博節度使何弘敬為南靣招討澤潞使及河中節度使陳夷行河陽節度使王茂元劉沔以討劉稹十月己巳晉絳行營節度使石雄及劉稹戰于烏嶺敗之十二月丁巳王宰克天井闗四年八月昭義軍將郭誼殺劉稹以降李徳裕傳劉從諫死其從子稹擅留事以邀節度徳裕曰澤潞内地非河朔比捨而不討無以示四方帝曰可勝乎對曰河朔稹所恃以脣齒如魏鎮不與則破矣乃以李回持節諭元逵弘敬皆聽命始議用兵中外交爭徳裕獨曰贏縮勝負兵家之常惟聖䇿先定不為浮議所揺則有功矣有如不利臣請以死塞責帝忿然曰有沮吾軍議者誅之羣論遂息因請敕諸將直取州勿攻縣故元逵等下邢洺濨而稹氣索矣稹糧乏未幾郭誼持稹首降劉從諌傳以從子稹為嗣病甚與妻裴謀令主軍事置大將王協郭誼劉武徳劉守義等佐稹秘不發䘮脅監軍崔士康請如河朔故事帝怒敕稹䕶䘮還東都稹不奉詔李徳裕建言稹所恃者河朔耳若遣大臣諭上㫖出山東兵破之必矣有詔敕諸軍進討於是王茂元以兵屯萬善劉沔守昂車闗壁榆社何弘敬柵肥鄉侵平恩王元逵次臨洺略任堯山陳夷行營冀城侵冀氏帝詔忠武王宰以本軍下天井闗入懷澤宰進破劉公直拔陵川劉沔又取石㑹闗從諫妻弟裴問守邢州斬大將自歸成徳軍四年閏七月壬子王釗守洺州送欵魏博軍磁州將髙玉等以次降成徳軍閏七月稹聞三州降大懼大將郭誼與王恊斬稹首八月送王宰獻京師戊戌帝御興安門受之自悟至稹三世二十六年藝文志李徳裕㑹昌伐叛記上黨紀叛各一卷李徳裕玉册文曰雄斷霆聲羣疑氷釋任馮異則拔天井而震上黨仗吴漢則發突騎而傾邯鄲討劉稹制曰從諫生禀戾氣幼習亂風暫展執圭之儀終無上綬之請隙駒為喻魏豹姑務于絶河井蛙自居孫述頗聞于恃險顧苕卵之可矜豈淵魚之是察烈祖在藩先天啓聖符瑞昭晰繢事煥于泗亭鑾輅循游金石刻于代邸必非同惡咸許自新上黨居天下之脊當河朔之喉重耳在䘮不聞利父雄渠受戮祗以拒君太行夷儀為扄闗健馬强力為羽翼肘京洛而履蒲津倚太原而跨河朔唐幽州盧龍軍節度使破奚北部紀大中元年五月張仲武及奚北部落戰敗之傳破奚北部及山奚俘獲雜畜回鶻遏捻可汗殘部五千仰食奚王石舍朗仲武討奚破之回鶻浸耗滅轉依室韋仲武誘令羈致可汗遏捻懼夜委衆西走奚傳東胡種也居鮮卑故地有五部武徳中髙開道借其兵再寇幽州長史王詵破之貞觀中内附置饒樂府太和四年盗邊盧龍李載義破之執大將二百餘人縛其帥茹羯來獻四月丁未敗之大中元年北部諸山奚悉叛仲武禽酋渠燒帳落二十萬取其刺史以下靣耳三百羊牛七萬輜貯五百乘獻京師田遜之獲鮮卑莫能深入祭肜之軍遼水唯遣相攻懷駒支漏泄之奸同三師而肄楚侔五餌以開戎坎三鼓而河流自却聲六校而屋瓦皆飛鴞懼䘮林兎忙迷穴未驚紫陌之烏前軍已蹙不唳淮山之鶴後隊仍窮遂分袁尚之頭顱仍裂蚩尤之肩髀山積雲屯大收車乘角羸耳濕盡獲牛羊栁水載澄桑河無事震肅九圍歡呼萬國昔艱難云始胡塵首起于盧龍今開泰有期漢將先清于涿鹿人謀允若靈貺昭然賀幽州破奚寇唐招討南山平夏党項行營兵馬都統破党項紀㑹昌三年十月党項羌寇鹽州十一月寇邠寧兖王岐為靈夏六道元帥安撫党項大使御史中丞李回副之大中四年十一月寇邠寧十二月鳯翔節度李安業河東李拭為招討党項使五年三月白敏中為司空招討南山平夏党項行營兵馬都統四月赦平夏羌八月乙巳赦南山羌傳党項西羌别種貞觀三年舉部降以為軌州刺史乾元間寇邠寧郭子儀至潰去太和中數寇掠大中四年内掠邠寧詔鳯翔河東合節度兵討之宰相白敏中為都統帝出近苑屬二矢曰党項窮寇仍歳暴吾鄙今我約射竹中則彼當自亡不中我且率天下兵翦之不以此賊遺子孫左右注目帝一發矢徹於外不閱月羌破崔鉉言須大臣鎮撫故敏中以司空平章事兼邠寧節度招撫制置使及行帝御安福樓以餞賜通天帶衛以神䇿兵禮如裴度次寧州諸將已破羌賊敏中説諭其衆皆願弃兵乃自南山並河按屯保又規蕭闗通靈威道通鑑大中五年三月以敏中為司空平章充招討行營都統制置等使南北兩路供軍使兼邠寧節度使四月敏中軍於寧州壬子定逺城使史元破党項九千餘帳於三交谷敏中奏党項平唐安南都䕶克播州懿宗紀大中十三年雲南蠻䧟播州咸通元年十月安南都䕶李鄠克播州唐歸義軍節度使克凉州紀咸通三年三月戊寅張義潮克凉州唐檢校右僕射義成節度使徐泗行營兵馬都招討使破龎勛紀咸通九年正月龎勛反于桂州十月庚午䧟宿州丁丑䧟徐州觀察使崔彦曾死之十一月䧟濠州刺史盧望回死之右金吾衛大將軍康成訓為徐泗行營兵馬都招討使神武大將軍王晏權為北靣招討使羽林將軍戴可師南靣招討使十二月䧟和滁二州壬申可師死之是月馬舉為南靣曹翔為北靣招討使十年四月康承訓及龎勛戰于桞子敗之六月宋威為西北靣招討使九月癸酉勛伏誅初武寧卒六百戌桂六歳不代殺都將刼糧料判官龎勛為長入徐殺彦曾乃拜承訓云云率魏博鄜延義武鳯翔沙陀吐渾兵二十萬討之宋威兵三萬屯蕭豐王師破臨渙斬萬級承訓十遇皆勝張元稔降賊走蘄縣縱擊之斬萬級唐京城東北靣行營都統復京師中和三年正月雁門節度使李克用為京城東北靣行營都統三月壬申克用及黄巢戰零口敗之四月甲辰又敗之渭橋丙子復京師玉海卷一百九十二
