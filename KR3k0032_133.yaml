賦自是嵗入貢致金桃銀桃詔令植苑中髙宗永徽時以其地為康居都督府即授其王拂呼縵為都督會要顯慶三年遣果毅董寄生列其所居城為康居都督府唐隂山大漠元池三都督府志隴右道顯慶三年分葛邏祿部置三府以謀落部置隂山州都督府以葛邏祿熾俟部置大漠州都督府以葛邏祿踏實部置元池州都督府金附州都督府析大漠州置回紇傳葛邏祿亦突厥諸族在北廷西北金山之西有三族一謀落二熾俟三踏實力永徽初三族皆內屬顯慶二年以謀落部為隂山都督府熾俟部為大漠都督府踏實力部為元池都督府志初元池咽麴為州隸燕然長安二年為都督府隸北庭通鑑顯慶二年春正月癸巳十四日分哥羅祿又作葛邏祿三部置隂山大漠二都督府唐河西二都督府志河西內屬諸胡州十二烏壘州至乞乍州府二媯塞都督府渠黎都督府唐百濟五都督府通鑑顯慶五年八月蘇定方平百濟百濟故有五部分統三十七郡二百城七十六萬戶詔以其地置熊津馬韓東明金漣德安五都督府并置帶方州隸安東都護府麟德後廢以其酋長為都督刺史傳云左衛中郎將王文度為熊津都督總章元年劉仁軌為熊津道安撫大使儀鳳元年二月甲戌徙熊津都督府於建安故城唐西域十六國都督府志隴右道西域府十六州七十二龍朔元年六月癸未以隴州南田令王名逺為吐火羅道置州縣使自于闐以西波斯以東凡十六國以其王都為都督府屬部為州縣凡州八十八縣百一十軍府百二十六月氏領州二十五大汗領州十五條支領州九天馬領州二髙附領州二修鮮領州十寫鳳領州四悅般領州一竒沙領州二姑墨領州一旅獒崑墟至拔鳥飛領州一王庭波斯右隸安西都護府通鑑龍朔元年六月癸未以吐火羅嚈噠訶達羅支解蘇骨咄施罽賓帆延石汗那護時犍怛沒烏拉喝多勒建俱蜜護蜜多久越得犍波斯十六國置都督府八州七十六餘同志會要云州八十圖又見後西域上元二年正月丙寅以于闐國為毗沙都督府分十州開元十五年張守圭為瓜州刺史築故城朝廷嘉其功以瓜州為都督府以守圭為都督唐髙麗九都督府志河北道髙宗滅髙麗置都督府九州四十二一百縣會要總章元年十二月七日分後所存州止十四府九新城遼城哥勿衛樂舍利居素越喜去旦建安州都督府髙麗舊有五部一百七十六城六十九萬七千戶人擢酋渠為都督刺史與華參理隸安東都護府唐毗沙都督府詳見四鎮志隴右道毗沙都督府本于闐國貞觀二十二年內附初置州五髙宗上元二年置府分州為十通鑑上元二年正月丙寅以于闐國為毗沙都督府分其境內為十州顯慶三年以渴塞城為休循州都督授阿了參刺史吐谷渾傳咸亨三年二月八日諾曷鉢自鄯州徙靈州帝為置安樂州拜刺史貞元十四年以慕容復為安樂都督青海王唐營州都督詳見上東夷都護會要萬嵗通天元年云云其後營州都督寄置於幽州漁陽城開元五年三月奚契丹欵附上欲復營府於舊城宋璟以為不可獨宋慶禮盛陳其利詔慶禮與薑師度更柳城築營州城三旬而畢拜慶禮營州都督開屯田八十餘所唐黑水州都督府志河北道黑水州都督府開元十四年置隸幽州都督府李獻誠領黑水經略使唐隂山府都督又見下通鑑元和三年五月沙陀酋長朱邪盡忠與其子執宜背吐蕃自歸帥部落三萬自甘州循烏得建山而東為吐蕃所追戰死子執宜執其餘衆猶近萬人騎三千詣靈州降靈鹽節度范希朝自率衆迎於塞上置之鹽州為市牛羊廣其蕃牧詔置隂山府以執宜為兵馬使未幾盡忠弟葛勒阿波又率衆七百詣希朝降詔以為隂山府都督自是靈鹽每月征討用之所向皆捷靈鹽兵益強蓋以沙陀徑勇冠諸胡也王鍔節度太原請析其族隸諸州遂建十府以處沙陀傳太和中柳公綽奏陘北沙陀素為九姓六州所畏請委執宜治雲中塞下廢府十一料部人三千禦北邊號代北行營授執宜隂山府都督代北行營招撫使隸河東節度開元三年大漠都督特進朱斯陰山都督匐雞元池都督胡鼻率衆內附詔處其衆於金山開寶安南都護交趾本南越之地漢置交趾刺史唐交州總管調露中改安南都護皇朝乾德初其部內亂有攝歡州刺史丁部領與其子璉率衆討平之部民共立部領為交州帥凡三年私命璉為節度使開寶六年五月己巳璉遣使貢方物制以璉特進檢校太師充靜海軍節度管內觀察處置等使安南都護兼御史大夫上柱國封濟隂郡開國公仍賜推誠順化功臣至八年八月丙午又制授部領太師上柱國封交趾郡王朝廷以璉再修職貢特崇寵其父也興國初丁璉死為黎桓所篡子黎龍延景德四年七月辛巳制授交趾郡王賜名至忠祥符間天書降亦例加恩二年至忠卒為李公蘊所篡授公蘊都護郡王公蘊傳子德政寶元元年進南平王孫曰尊曾孫乾德陽煥後有天祚龍􅩾昊旵襲封交趾初封交趾郡王久之進南平王死則進侍中南越王淳熙元年二月李天祚自南平王特封安南國王四年丁酉三月二十四日授龍􅩾安南王制云即樂國以肇封既從世襲極真王而錫命何待次升蓋言不封郡王也今安南國王乃陳日煚效忠順化功臣靜海節度象郡浪泊龍編銅柱南交鳶江真臘大同軍節度雲州刺史闍婆懷逺節度琳州刺史訶陵大理雲南節度政和七年其王段和譽占城同闍婆封林邑之環王銅古越裳界柱紹興都督府督視軍馬紹興二年四月二十七日戊子吕頥浩以左僕射都督江淮荆浙諸軍事置司鎮江以都督府為名九月命孟庾以參政兼權同都督十二月二十八日除同都督四年八月十一日趙鼎自知密院為都督川陜荆襄諸軍事五年二月十二日丙戌鼎與張浚並相兼都督諸路軍馬十四日詔都督府以諸路軍事為名二十六日詔臨遣相臣按行師壘有或難從於中覆即宜專制於事幾六年七月十七日詔浚暫赴行在奏事三十一年十一月十九日知樞密院葉義問為督視江淮荆襄軍馬中書舍人虞允文參謀軍事朝議以非相臣故其名下都督一等蓋不考趙鼎故事也三十二年五月十三日義問結局遷三官孝宗即位七月九日詔汪徹以參政督視湖北京西軍馬隆興元年正月庚子張浚以樞使都督江淮二年九月二十一日癸卯湯思退以左僕射都督二十三日命太傅楊存中同都督十一月七日參政王之望同都督之望辭思退解職九日以存中為都督非宰相而都督自存中始乾道元年二月結局考葛亮總統之稱用謝安督軍之號中興都統制又見兵制諸軍都統制古無其官宣和間西南用兵大將不相統一即其中拔一人為都統制以總之建炎元年五月既置御營司遂擢王淵為都統制名官自此始其後劉光世為之其下分為五軍紹興初御營司罷有旨諸大將之軍稱神武五軍諸小校兵少者謂之神武副軍並隸樞密院俄又改為行營五護軍韓世忠稱左軍劉光世稱右軍張浚稱中軍王􅊅稱前軍巨師古稱後軍其後右護軍叛於是吳玠軍始以右護軍為號四年吳璘為右軍都統制又以楊政為宣撫司都統制屯興元郭浩為樞密院都統制屯金州十一年諸將罷兵四月乙未乃收其所部為御前諸軍而統制皆以屯駐州名冠軍額之上獨川陜如故十八年五月甲申罷四川宣撫司楊政改御前都統制紹興十二年壬戌嵗以金陵選鋒一軍移於池州始有御前都統制之號自王進始十九年漢沔亦改為御前諸軍璘稱利州西路政稱利州東路三十一年王彥昭始除金房開逵州都統制乾道五年十月令蜀三都統隨駐劄處係銜副都統紹興七年始置後省乾道三年五月除員琦為荆南副都統江上始有京口秣陵武昌三大軍紹興末楊存中請置江池二軍劉琦請置荆渚一軍嘉定初安丙奏分興州十軍為沔利二軍沔州除都統制利州除副都統制自是天下有十都統矣荆鄂一軍而正帥任鄂副帥在襄淳熙新旨也改又有平江許浦水軍都統制舊隸沿海制司乾道中隸殿前司五年冬改為御前水軍八年春並歸許浦置副都統制統之淳熙四年冬以七千人為額月又乾道六年分立前中後三軍於許浦建寨萬間四二十四日水軍統制馮湛謂以平江府許浦駐劄為稱詔可鎮江軍韓世忠部曲也建康大軍張浚部曲也鄂州軍嶽飛部曲也惟荆南江池皆紹興末新創荆南則劉錡所招效用而頗以鄂軍益之江池軍則三衙之疲弱而江州一軍又雜以江西茶盜東南惟以潤升鄂三軍為根本興州興元府金州三司兵本曲端吳玠關師古之徙關西部曲也三大將之兵惟興元偏重乾道三年閏七月一日上諭宰執曰朕欲江上諸軍各置副都統兼領軍事豈惟儲他時統帥亦使主帥不敢專擅於是以郭剛為鎮江副都統制張榮為建康副都統制以贊主帥議軍事次將亞旅副戎二矛重弓魏何昌曰先王制法建官授任則置副佐陳師命將則立監二宣命遣使則設介副當難則權足相濟員缺則才足相代韓信伐趙張耳為二馬援討越劉隆副軍李德𥙿詔吳漢征蜀劉尚副軍李績取平壤參以道宗李靖襲隂山副之公謹唐志天寶末置都統興元元年置副都統黃巢之難置諸道行營都統玉海卷一百三十三
