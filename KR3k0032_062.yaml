body:
  text: 玉海卷六十二宋王應麟撰藝文論鄭康成曰論者綸也可以經綸世務劉熙曰論倫也有倫理也劉勰曰聖哲􅉓訓曰經述經叙理曰論陳政則與議説合契釋經則與傳注參體辯史則與贊評齊行銓文則與叙引共紀彌綸群言而研精一理者也漢素王妙論史記越世家注太史公素王妙論云范蠡本南陽人正義二卷七略云司馬遷撰隋志五行類梁有太史公素王妙議二卷太平御覽太史公素王妙論曰諸稱富者非貴其身得志也乃貴恩覆子孫澤及鄉里也黄帝設五法布之天下用之無窮蓋世有能知者莫不尊親如范子可謂曉之矣管子設輕重九府行伊尹之術則桓公以霸范蠡行十術之計二十一年之間三致千萬再散與貧太史公自序司馬談習道論於黄子論六家之要指隂陽儒墨名法道德文中子謂史談善述九流漢鹽鐵論蓺文志儒家桓寛鹽鐵論六十篇本議第一曰惟始元六年有詔使丞相御史與所舉賢良文學問民疾苦注師古曰寛字次公汝南人也孝昭帝時丞相御史與諸賢良文學論鹽鐵事寛撰次之昭紀始元六年二月詔有司問郡國所舉賢良文學民所疾苦議罷鹽鐵榷酤秋七月罷榷酤官贊光知時務之要輕徭薄賦與民休息至始元元鳯之間匈奴和親百姓充實舉賢良文學問民所苦議鹽鐵而罷榷酤中興書目云雜論致理之言崇本抑末之書也食貨志昭帝即位六年詔郡國舉賢良文學之士問以民所疾苦教化之要皆對願罷鹽鐵酒榷均輸官毋與天下争利視以儉約然後教化可興弘羊難以此國家大業所以制四夷安邊足用之本不可廢也迺與丞相千秋共奏罷酒酤取下萹曰公卿愀然遂罷議奏且罷郡國榷酟關内鐵官奏可杜延年傳舉賢良議罷酒酤鹽鐵皆自延年發之車千秋傳始元六年詔郡國舉賢良文學之士問以民所疾苦於是鹽鐵之議興焉注師古曰議罷鹽鐵之官百姓皆得煑鹽鑄錢因總論政治得失也贊曰所謂鹽鐵議者起始元中徵文學賢良問以治亂皆對願罷郡國鹽鐵酒榷均輸務本抑末毋與天下争利然後教化可興御史大夫弘羊以為不可廢當時相詰難頗有其議文至宣帝時汝南桓寛次公治公羊春秋舉為郎至廬江太守丞博通善屬文推衍鹽鐵之議増廣條目極其論難著數萬言亦欲以究治亂成一家之法焉師古曰即今之所行鹽鐵論十卷是也其辭曰觀公卿賢良文學之議異乎吾所聞聞汝南朱生子伯言當此之時英俊並進賢良茂陵唐生文學魯國萬生之徒六十有餘人咸聚闕庭舒六蓺之風陳治平之原知者贊其慮仁者明其施勇者見其斷辯者騁其辭齗斷焉行行焉雖未詳備斯可略觀矣中山劉子推論作劉子雍言王道矯當世反諸正彬彬然宏博君子也九江祝生奮史魚之節發憤懣譏公卿桑大夫據當世合時變上權利之畧雖非正法鉅儒宿學不能自解車丞相履伊吕之列當軸處中括囊不言容身而去若夫丞相御史兩府之士不能正議以輔宰相阿意茍容以説其上隋志儒家鹽鐵論十卷漢廬江府丞桓寛撰唐志崇文目中興玄目卷同鹽鐵論六十篇卷一本議力耕通有錯幣禁耕復古卷二非鞅晁錯刺權刺復論儒憂邊卷三園池輕重未通卷四地廣貧富毁學褒賢卷五相刺殊路頌賢遵道論誹孝養刺議利議國疾卷六散不足救匱鹽鐵箴石除狹疾貪後刑授時水旱卷七崇禮備胡執務能言鹽鐵取下擊之卷八結和誅秦伐功西域世務和親卷九繇役險固論勇論功論鄒論蓄卷十刑德申韓周秦諸聖大論雜論凡六十篇後百官志注史記荆軻傳注引漢鹽鐵論漢桓譚新論桓譚傳譚博學多通徧習五經尤好古學從劉歆揚雄辨析疑異著書言當世行事二十九篇號曰新論上書獻之世祖善焉琴道一篇未成肅宗使班固續成之注新論一曰本造二王霸三求輔四言體五見徵六譴非七啓寤八祛蔽九正經十識通十一離事十二道賦十三辨惑十四述策十五閔友十六琴道本造述策閔友琴道各一篇餘並有上下東觀記曰光武讀之敕書卷大今皆别為上下凡二十九篇東觀記曰琴道未畢但有發首一章唐志儒家桓子新論十七卷隋志同梁有集五卷高帝紀陳平祕計注師古曰應劭之説出新論夏侯湛亦有新論十卷並在儒家華譚新論十卷呉顧譚著新言二十篇薛瑩著書八篇名曰新議賈誼新書陸賈新語劉向新序裴玄新言漢王命論叙傳班彪著王命論言高祖之興有五一曰帝堯之苖裔二曰體貌多竒異三曰神武有徵應四曰寛明而仁恕五曰知人善任唐志彪集三卷傅幹王命叙言世祖之興有四曰帝皇之正統形相多異表體文而知武履信而好士文選注引傅幹王命叙漢沛王通論演經雜論沛獻王輔傳輔矜嚴有法度好經書善説京氏易孝經論語傳及圖䜟作五經論時號之曰沛王通論曹褒傳作通義十二篇演經雜論百二十篇又傳禮記四十九篇慶氏學遂行於世漢論衡六儒論王充傳字仲任㑹稽上虞人好論説始若詭異終有理實以為俗儒守文多失其真乃閉目潛思絶慶弔之禮户牖牆壁各置刀筆著論衡八十五篇二十餘萬言釋物類同異正時俗嫌疑充造養性書十六篇注袁山松書充聰明入太學觀天子臨辟雍作六儒論充作論衡中土未有傳者蔡邕入呉始得之常祕玩以為談助其後王朗為㑹稽太守又得其書及還許下時人稱其才進或曰不見異人當得異書問之果以論衡之益由是遂見傳焉抱朴子曰時人疑蔡邕得異書或搜求其帳中隠處果得論衡數卷持去邕丁寧之曰唯我與爾共之勿廣也唐志雜家王充論衡三十卷隋志二十九卷今本亦三十卷八十五篇逢遇第一至自紀八十五韓愈三賢贊閉門潛思論衡以修崇文目有續論衡二十卷當攷漢潛夫論王符傳字節信自和安之後世務游宦當塗者更相薦引而符耿介不同於俗以此遂不得升進志意藴憤乃隠居著書三十餘篇以譏當時得失不欲章顯其名故號曰潛夫論其指訐時短討擿物情足以觀當時風政著其五篇云爾貴忠篇浮侈篇實貢篇愛日篇述赦篇唐志儒家王符潛夫論十卷隋志同同崇文目韓愈三賢贊述赦之篇其㫖甚明漢六蓺論隋志論語類唐志經解類六蓺論一卷鄭玄撰别集類鄭玄集二卷漢禦冦論趙岐傳延熹九年應胡廣之辟㑹南匈奴烏桓鮮卑叛公卿舉岐擢并州刺史岐欲奏守邊之策未及上㑹坐黨事免因撰次以為禦冦論注決録注曰是時綱維不攝閹宦專權岐擬前代連珠之書四十章上之留中不出漢政論崔寔傳字子真少沈静好典籍桓帝初詔公卿郡國舉至孝獨行之士寔以郡舉詣公車病不對策除為郎通監元嘉元年十一月明於政體吏才有餘論當世便事數十條名曰政論指切時要言辨而确當世稱之仲長統曰凡為人主宜寫一通置之坐側其辭曰漢興以來三百五十餘嵗矣政令垢翫上下怠懈風俗彫弊人庶巧偽咸復思中興之救矣且濟時拯世之術豈必體堯蹈舜然後乃理哉期於補䘺決壊枝柱邪傾隨形裁割要措斯世於安寧之域而已故聖人執權遭時定制步驟之差各有云設不强人以不能背急切而慕所聞也昔孔子對葉公以來逺哀公以臨人景公以節禮非其不同所急異務也今縱不能純法八世固宜參以霸政嚴之則理寛之則亂宣帝嚴刑峻法海内清肅元帝多行寛政為基禍之主文帝以嚴致平非以寛致平也當大定其本使人主師五帝而式三王弃茍全之政蹈稽古之蹤復五等之爵立井田之制然後選稷契為佐伊吕為輔云云論曰雖晁錯之徒不能過也贊曰崔為文宗世擅雕龍子真持論感起昬俗唐志法家崔氏政論六卷隋志同作正論梁有五原太守崔寔集二卷録一卷舊唐志崔氏正論五卷崔寔撰司馬公曰寔論以矯一時之枉非百世之通義隋唐志法家魏劉廙阮武政論各五卷隋志阮子正論雜家陸澄述政論十三卷選注引阮子政論又引崔寔本論漢仲長統昌言仲長統傳字公理建安中統為尚書郎參丞相操軍事通監十一年每論説古今及時俗行事常發憤歎息因著論名曰昌言凡三十四篇十餘萬言繆襲稱統才章足繼西京董賈劉揚今簡撮其書有益於政者略載云理亂篇損益篇法誡篇隋志雜家仲長子昌言十二卷録一卷漢仲長統撰唐志儒家十卷二崇文目二卷魏志注云十四篇中興書目今存十六篇餘皆缺八卷雜家文選注引仲長子昌言漢申鑒荀悦傳建安中遷秘書監侍中通監十年志在獻替而謀無所用乃作申鑒五篇其所論辨通見政體既成奏之其畧曰道之本仁義而已五典以經之群籍以緯之前鑒既明後復申之為政之術先屏四患乃崇五政養生正俗章化秉威統法又著崇德正論及諸論數十篇其自著漢記嘗載其畧范曄擿篇首數百言及次篇尚主之制備置史官之法隋志儒家五卷唐志同中興書目今所載政體時事俗嫌雜言上下凡五卷本傳止載政體篇文選注引申鑒漢德論劉毅傳封平望侯北海敬王子少以文辨稱元初元年上漢德論并憲論十六篇一云十二篇劉珍馬融共上書稱其美安帝嘉之拜議郎賜錢百萬文選演連珠注班固功德論曰朱軒之使鳯舉於龍堆之表曹植有魏德論文選注引之漢四子講德論見詩類漢明世論杜篤傳著明世論十五篇文選魏都賦注引杜篤通邊論漢辨和同論崇厚論劉梁傳字曼山常疾世多利交以邪曲相黨乃著破羣論時之覽者以為仲尼作春秋亂臣知懼又著辨和同論云云隋志劉梁集二卷朱穆傳字公叔感時澆薄作崇厚論云云注穆著論甚美蔡邕嘗至其家自寫之穆集二卷晉劉寔崇讓論漢七曜論劉陶傳字子竒拜諫議大夫著書數十萬言作七曜論正老子反韓非復孟軻隋志陶集三卷梁二卷後漢文武釋論舊唐志雜史後漢文武釋論二十卷王越客撰魏聖證論晉禮樂聖真論王肅傳肅善賈馬之學而不好鄭氏采㑹同異為尚書詩論語三禮左氏解撰定父朗易傳皆列學官時樂安孫叔然炎授學鄭玄之門人肅集聖證論以譏短玄叔然駮而釋之及作周易春秋例毛詩禮記春秋三傳國語爾雅諸注又著書十餘篇隋志聖證論十二卷難鄭玄唐志經解類十一卷通典引之又有王肅政論十卷殷興續論隋志正十卷元澹曰王肅規鄭玄數千百條鄭學馬昭詆劾肅短詔遣博士張融按經問詰融推處是非而肅酬對疲於嵗時禮記正義案聖證論王肅難鄭馬昭申鄭云張融謹案郊與圓丘是一為鄭學者馬昭等通之晉皇甫謐傳號玄晏先生著禮樂聖真之論魏中論徐幹傳字偉長北海人病辭人工麗美之文乃著中論二十篇闡宏大義以示學者其書雜論治道修身學問之要旁及厯象壽夭之説注魏文帝書曰偉長懐文抱質恬淡寡欲有箕山之志著中論三十餘篇辭義典雅足傳於後文選注引中論隋志儒家徐氏中論六卷魏太子文學徐幹撰梁目一卷卷唐志崇文目同曽鞏目録序貞觀政要太宗稱嘗見幹中論復三年喪篇而今書此篇缺攷之魏志稱二十餘篇世所有者非全書也幹能考六藝推仲尼孟軻之㫖述而論之求其辭時有小失要其歸不合於道者少矣其所得於内者又能信而充之有去就顯晦之大節因其書以求其為人又知其行之可賢也李獻民云别本有復三年制役二篇鞏特不見之爾中興書目十卷今本二十篇分上下兩卷上帙治學法象修本虚道貴驗貴言藝紀覆辨智行爵禄下帙考偽譴交厯象别夭壽説藝審大臣謹所從亡國賞罰民數魏典論隋志典論五卷魏文帝撰魏陳思王征蜀論春秋正義陳思王征蜀論云下礧成雷榛殘木碎魏德論文選王元長序注曹植魏德論曰越八九於往素踵黄帝之靈矩魏萬機論蔣濟傳字子通上萬機論文帝善之隋志雜家八卷唐志十卷舊志八卷書目蔣子萬機論十卷凡五十五篇雜論立政用人兵家之説及考論前賢故事雜問三國志注引萬機論唐志雜家陸澄述正論十三卷隋志述政論晉楊偉撰時務論十二卷隋志同魏體論篤論杜恕傳著體論八篇隋志四卷儒家又著興性論一篇興於為己也唐志雜家杜恕篤論四卷鍾㑹蒭蕘論五卷隋志同劉劭樂論見人物志唐志法家劉氏劭法論十卷隋志梁有之桓範世要論十二卷梁二十卷文選注引之宋朝邵亢體論十卷論王體者三教體者四兵體者五政體者十三凡二十五篇魏要論隋志儒家梁有周生子要論一卷録一卷魏侍中周生烈撰袁子正論十九卷袁凖撰梁又有袁子正書二十五卷魏曹羲作至公論王蔚善之而著至機論辭義甚美唐志法家陳子要言十四卷陳融章隋志云呉豫太守任子道論隋志道家任子道論十卷舊唐志同魏任嘏撰梁有養生論三卷嵇康撰晉阮籍著達莊論王坦之著廢莊論坦之非時俗放蕩不崇儒教頗尚刑名著廢莊論孔嚴著通葛論坦之贊美之九州人士論舊唐志名家九州人士論一卷盧毓撰晉五等論陸機傳以聖王經國義在封建著五等論又作辨亡論二篇魏曹冏宗室字元首作六代論晉安邊論徙戎論杜預傳拜度支尚書建安邊論處軍國之要江統傳時關隴屢為氐羌所擾統深懼四夷亂華宜杜其萌作徙戎論一本云元康九年正月太子洗馬江統云云伏滔傳從桓温伐袁真至壽陽咸安元年著論二篇名曰正淮上篇曰自戰國至晉中興六百餘年保淮南者九姓稱兵者十一人皆亡不旋踵壽陽東連三呉之富南引荆汝之利北接梁宋平塗不過七百西援陳許水陸不出千里龍泉之陂良疇萬頃舒六之貢利盡蠻越其俗尚氣其人習戰先王之宰天下選於有德訪於三吏正分位明等級畫封疆宣政令宋何承天上安邊論陳四事晉五行三統論索靖傳作五行三統正驗論辨理隂陽氣運隋志梁有三統五德論曹思文撰晉翰林論隋志揔集翰林論三卷晉著作郎李充撰梁五十四卷唐志文史類三卷中興書目凡二十八篇論為文體要文選注初學記引翰林論文心彫龍魏文述典陳思序書應瑒文論陸機文賦仲冶流别弘範翰林又云翰林博而寡要晉竹林七賢論唐志傳記類戴逵竹林七賢論二卷孟仲暉七賢傳七卷晉公謙論王坦之傳與殷康子書論公謙之義曰公道體於自然故理泰而愈降謙義生於不足故時弊而義著康子及袁宏並有疑難坦之標章擿句一一申而釋之韓伯傳坦之著公謙論袁宏作論難之伯作辨謙以折中曰懲忿窒欲著於損象卑以自牧實繫謙爻皆所以存其所不足拂其所有餘晉新論物理論隋志新論十卷散騎常侍夏侯湛撰梁有楊子物理論十六卷徵士楊泉撰文選注引之隋興衰要論文中子文中子之父王隆以博士待詔雲龍門承詔著興衰要論七篇每奏帝稱善王道篇曰其言六代得失明矣唐帝王畧論志雜家虞世南五卷崇文目同類舊史雜史中興書目貞觀間太子中舍人世南承詔撰起太昊訖于隋凡帝王事迹皆畧紀載假公子荅問以攷訂云唐封建論㑹要貞觀二年十二月十六日太宗問子孫長久之道蕭瑀對以封建上然之始議封建禮部侍郎李百藥論曰云云乃欽明昏亂自係安危非守宰公侯以成興廢唐宗室傳帝與名臣蕭瑀喟然講封建事而魏徵李百藥皆謂不然天子由是罷不復議劉秩政典文皇惠侔前古下無山甫將明之才乃聽百藥偏昧之説百藥不詳秦漢晉宋齊隋得失之異謂不足法復忽淳于賈曹劉陸成敗之説委之天命天之所命人事而已棄人事捨天理滅聖智任存亡也柳宗元有封建論唐聖德論通監貞觀六年閏七月戊辰祕書少監虞世南上聖德論上手詔稱卿論太高朕何敢擬上古但比近世差勝耳實録八月戊辰上武德九年四月給事中歐陽詢上帝德論唐列藩正論正論忠孝論十代興亡論析滯論志儒家武后列藩正論三十卷雜傳記類云章懐太子儲光羲正論十五卷開元進士法家李敬玄正論三卷儒家又有袁子正論二十卷詩靈臺疏引袁準正論云明堂宗廟太學非一體也正書二十五卷袁凖十晉人隋志九卷干寶正言十卷雜家朱敬則十代興亡論十卷魏晉至周隋賢忠義之節聖厯中撰各載一代興亡之迹先淳化二年閏二月己丑祕書監李至等獻新補注正言十代興亡論二部十卷手詔荅之藏祕閣許王素節傳著忠孝論自明盧藏用傳以俗徇隂陽為析滯論以暢其方徐彦伯傳武后時王公卿士以言語為酷吏所排彦伯著樞機論以為世戒唐大衍論舊史僧一行尤明著述撰大衍論三卷改撰新厯推周易大衍之數立術以應之撰開元大衍厯經唐君臣政理論志儒家楊相如君臣政理論三卷崇文目同書目開元十三年河南府陸渾主簿楊相如撰上中卷論君臣之體下卷論治理之要咸平五年十月十七日幸龍圖閣觀五經圖賜宴次御資政殿觀楊相如政要論即政理論天聖四年閏五月學士宋綬録進晉張昭撰唐朝君臣正論二十五卷上之唐八卦論唐書蘇晉數嵗知為文作八卦論人謂後來王粲魏志注文章序録曰裴秀著易及樂論裴頠著崇有貴無二論以矯虚誕之弊書目張説才命論一卷假才命荅問以叩窮達之理又隨句注釋唐五代論于休烈傳肅宗中興文物未全休烈獻五代論討著舊事天子嘉之舊史云五代帝王論宋朝韓丕著五代興亡論唐戰論守論杜牧傳作罪言原十六衛作戰論守論唐福禄論舊史孫思邈撰五卷咸平資政論咸平四年十二月乙卯工部侍郎致仕朱昻上資政論三卷論時政賞罰得失且言天下至廣宜急於擇才以張治具倘限以常牒則英俊無由升舉詔付史館仍寫本留中㑹要實録作資理文資理論三卷凡六篇崇目同祥符製勤政論咸平元元論咸平四年十一月丁亥上御龍圖閣召輔臣觀太宗御書移御崇和殿閲張去華所著元元論二萬餘言大指以養臣務穡為急上命寫以縑素為一十八軸列置龍圖閣之四壁國田圖上曰養民之道稼穡為先冀兵革粗息可以力行其事富庶吾民矣去華雍熙中獻大政要録三十篇祥符五年淛漕臣上湖州進士許既濟所著四民論授本州助教六月二十九日景德聖德論四年八月丁未直祕閣錢帷演上聖德論天聖演聖通論天聖五年十二月二十二日祕書監胡旦上七十二卷駁正五經景祐元年七月壬辰又上續演聖通論崇文目云三十六卷胡旦演聖通論論六經傳注得失易十六卷書七卷詩十卷禮記十六卷而春秋論别行博辨精詳學者宗焉康定通志論康定元年十二月十七日翰林學士王堯臣上祕書丞蔡亶一作旦通志論十三篇備言攻守之策如其可采乞於陜西縁邊任使詔知乾州慶厯朋黨論歐陽修至和兵民總論三年正月趙肅上十卷定州進士范仲淹為四論以獻譏指時政仁宗頗以好名為非田况著論上之紹興時政論胡安國為時政論二十篇紹興二年七月乙丒安國為給事中入對曰臣聞保國必先定計定計必先定都建都擇地必先設險設險分土必先遵制制國以守必先恤民行此有道必先立政立政有經必先核實然顧人主志尚如何耳尚志所以立本也正心所以決事也養氣所以制敵也宏度所以用人也寛隠所以明德也具此五者帝王之能事備矣乞以覈實而上十有五篇付宰相參酌施行安國又有制國論先是建炎三年四月以給事中召安國未至先上中興策十四篇施昌言上政論三十篇紹興十君論紹興六年四月宋藻上所著十君論召對辛丒補迪功郎紹興中興統論紹興十二年五月十七日辛亥給事中程克俊言漢州布衣陳靖所獻中興統論其三始五要八實之説深明治體論事之外自為文章詔補右迪功郎紹興十六年呉澥進寡見論責實論各二卷謹始論五卷九月六日詔免解二年閏四月二十四日林珦進砭石論可采召赴都堂審察六年十月二十七日王湛上負薪論循資八年二月二日呉武陵獻更化論循資十六年三月二十六日徐存上鑑古十論免解乾道六年正月十八日王信進十論除學官紹興八朝聖孝通紀論三朝正論紹興十四年三月戊寅王銍獻祖宗八朝聖孝通紀論詔遷一官五年四月庚午曽紆上其父布所著三朝正論二卷詔付史館以布熙寧記市易本末及紹聖以來奏對要語集為正論乾道恢復十論乾道七年太常簿趙粹中進恢復機密十論俾邊帥招中原之人用竒以擣燕山又進制狄權鑑取書傳制狄之説參考歴代事迹總歸條例為十六門四十卷又富彊要策十卷專論屯田文心雕龍自論語以前經無論字六韜二論後人追題六韜霸典文論文師武論莊周齊物以論為名莊子内篇齊物論第二不韋春秋六論昭列吕氏春秋六論三十六篇石渠論藝隋志石渠禮論四卷戴聖撰白虎講聚肅宗㑹諸儒講論五經作白虎通德論述聖通經論家之正體也班彪王命嚴尤三將太平御覽引嚴尤三將論卷唐志雜家一蘭石之才性傅嘏㑹嘏論才性同異鍾集而論之仲宣之去伐隋志王粲去伐論集三卷叔夜之辯聲嵇叔夜聲無哀樂論見世説注太初之本玄夏侯玄著樂毅張良及本無肉刑論輔嗣之兩例平叔之二論隋志何晏撰老子道德論二卷又見世説以所注老子為道德二論並師心獨見鋒穎精宻蓋論之英也李康運命陸機辨亡並見文選宋岱郭象晉宋岱周易論一卷郭象注選注引郭象論夷甫裴頠裴頠著崇有論王衍之徒攻難交至頠著崇有貴無二論以矯虚誕並獨步當時流聲後代序贊序緒也緒述其事使相胤續贊明也稱人之美曰讚漢新序見著書類漢劉向揚雄所序見著書等類漢蓺文志劉向所序六十七篇揚雄所序三十八篇唐志别集類向集五卷雄集五卷書目雄集六卷四十三篇向集五卷十八篇漢梁竦七序傅幹王命叙見論類梁竦傳閉門自養以經籍為娯顯宗時著書數篇名曰七序班固見而稱曰孔子著春秋而亂臣賊子懼梁竦作七序而竊位素餐者慙文選注引傅幹後漢王命叙漢三輔耆舊節士序名德先賢贊隋志後漢光武始詔南陽撰作風俗故沛三輔有耆舊節士之序魯廬江有名德先賢之贊郡國之書由此而作魯沛三輔序贊並亡蜀志楊戲以延熙四年著季漢輔臣贊其所頌述多載于蜀書北史李仲尚著前漢功臣序讚漢河南尹壁贊見牧守類京兆五守西漢難追河南二尹東京罕繼梁邵陵王表云漢太學贊見學校類漢明帝畫讚唐志雜傳類漢明帝畫讚五十卷舊志書讚五十卷漢明帝撰隋志總集類畫讚五卷漢明帝殿閣畫魏陳思王讚梁五十卷藝文類聚有曹植帝堯畫贊漢文帝時詔繪古帝王名臣像於殿壁明帝好畫立畫官詔班固賈逵輩取經史事畫之起伏羲凡五十謂之畫贊徐陵曰甘泉之殿舊禮羲軒長樂之宫本圖堯舜魏温室畫像讚百瑞圖魏都賦丹青煥炳特有温室儀形宇宙歴像賢聖圖以百瑞綷以藻詠芒芒終古此焉則鏡有虞作繪兹亦等競張載注鳴鶴堂之前次聽政殿之後東西二坊之中央有温室中有畫像讚景福殿賦命共工使作繢明五采之彰施圖象古昔以當箴規椒房之列是準是儀故將廣智必先多聞立德必先近仁朝觀夕覽何與書紳玄軒交登騶虞承獻晉三國名臣贊見頌類文苑英華嚴從有擬三國名臣讚序文心雕龍昔虞舜之祀樂正重贊尚書大傳益贊于禹伊陟贊于巫咸尚書漢置鴻臚以唱拜為讚相如屬詞始讚荆軻文章縁起史班書記託贊褒貶景純注雅動植必讚隋志郭璞爾雅圖讚二卷翰林論曰容象圖而讚立宜使辭簡而義正晉諸公讚唐志雜史傅暢晉諸公讚二十二卷隋志二十一卷晉祕書監傅暢撰魏志注文選注引之晉傅暢著晉諸公贊及晉公卿禮秩故事見典故類晉厯贊晉