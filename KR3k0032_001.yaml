body:
  text: 玉海卷一宋王應麟撰天文天文圖天道隱而難測可見莫如象天象逺而難究可考莫如圖中宫漢天文志史天官書同中宫天極星其一明者泰一之常居也旁三星三公或曰子屬後句四星末大星正妃餘三星後宫之屬也環之匡衛十二星藩臣皆曰紫宫前列直斗口三星隨北專鋭若見若不見曰陰德或曰天一紫宫左三星曰天槍右四星曰天棓後十七星絶漢抵營室曰閣道北斗七星所謂璿璣玉衡以齊七政杓攜龍角衡殷南斗魁枕參首用昏建者杓杓自華以西南夜半建者衡衡殷中州河濟之間平旦建者魁魁海岱以東北也斗為帝車運于中央臨制四海史作鄉分陰陽建四時均五行移節度定諸紀皆繫於斗斗魁戴筐六星曰文昌宫一曰上將二曰次將三曰貴相四曰司命五曰司祿六曰司災在魁中貴人之牢魁下六星兩兩而比者曰三能三能色亝君臣和不亝為乖戾柄輔星明近輔臣親強斥小疏弱杓端有兩星一內為矛招搖一外為盾天蜂有句圜十五星屬杓云晉志兼隋志同北極五星鉤陳六星皆在紫宫中北極北辰最尊其紐星天之樞也第一星主月太子也第二星主日帝王也亦太一之坐第三星主五星庶子也鉤陳後宫也北四星曰女御宫鉤陳口中一星曰天皇大帝其神曰耀魄寶北極四星曰四輔所以輔佐北極出度授政也大帝上九星曰華蓋蓋下九星曰杠華蓋下五星曰五帝內坐杠旁六星曰六甲極東一星曰柱下史柱史北一星曰女史傳舍九星在華蓋上近河賔客之館河中五星曰造父御官也河中九星鉤狀曰鉤星天一星在紫宫門右太一星在天一南相近亦天帝神也主使十六神知風雨水旱兵飢災疫所在之國也紫宫垣十五星其西蕃七東蕃八在北斗北一曰紫微大帝之坐也東垣下五星曰天柱門內東南維五星曰尚書尚書西二星曰陽德陰德宫門左星內二星曰大理門外六星曰天牀西南角外二星曰內厨東北維外六星曰天厨北斗七星在太微北七政之樞機陰陽之元本也魁四星為琁璣杓三星為玉衡又魁第一星曰天樞二曰旋三曰機四曰權五曰衡六曰開陽七曰搖光一至四為魁五至七為杓石氏云一主秦二主楚三主梁四主吳五主燕六主趙七主齊杓南三星及魁第一星皆曰三公宣德化調七政和陰陽之官也文昌六星在北斗魁前天之六府也主集計天道文昌北六星曰內階相一星在北斗南太陽守一星在相西大將西北四星曰勢天牢六星在北斗魁下太微天子庭也五帝之坐也其外蕃九卿也一曰太微為衡南蕃中二星間曰端門東曰左執法廷尉之象也西曰右執法御史大夫之象也左執法之東左掖門也右執法之西右掖門也東蕃四星南第一曰上相北東大陽門第二星曰次相北中華東門第三星曰次將北東大陰門第四星曰上將所謂四輔也西蕃四星南第一曰上將北西太陽門第二曰次將北中華西門第三曰次相北西太陰門第四曰上相亦四輔也西南角外三星曰明堂天子布政之宫也明堂西三星曰靈臺觀臺也主觀雲物察符瑞候災變也左執法東北一星曰謁者主贊賔客也謁者東北三星曰三公內坐朝會之所居也三公北三星曰九卿內坐治萬事九卿西五星曰內五諸侯內侍天子不之國也辟雍之禮得則大微諸侯明黃帝坐一星在太微中含樞紐之神也四帝坐四星俠黃帝坐東方蒼帝靈威仰之神也南方赤帝赤熛怒之神也西方白帝白招拒之神也北方黑帝叶光紀之神也五帝坐北一星曰太子帝儲也太子北一星曰從官侍臣也帝坐東北一星曰幸臣屏四星在端門之內近右執法郎位十五星在帝坐東北依烏郎府也郎將一星在郎位北武賁一星在太微西蕃北下名南靜室旄頭之騎官也常陳七星如畢狀在帝坐北三台六星兩兩而居起文昌列抵太微一曰天柱三公之位在天曰三台主開德宣符也西近文昌二星曰上台為司命主壽次二星曰中台為司中主宗室東二星曰下台為司祿主兵又曰三台為天階太一躡以上下一曰泰階上星為天子下星為女主中階上星為諸侯三公下星為卿大夫下階上星為士下星為庶人中台之北一星曰太尊貴戚也攝提六星直斗杓之南主建時節西三星曰周鼎大角一星在攝提間北三星曰帝席梗河三星在太角北招搖一星在其北玄戈一星在招搖北天槍三星在北斗杓東女牀三星在紀星北天棓五星在女牀北東七星曰扶筐七公七星在招搖東貫索九星在其前九星皆明天下獄煩天紀九星在貫索東織女三星在天紀東端天女也東足四星曰漸臺臨水之臺也主晷漏律呂之事西足五星曰輦道漢輦道通南北宫其象也左右角間二星曰平道之官平道西一星曰進賢角北二星曰天田亢北六星曰亢池氐北一星曰天乳主甘露房西二星南北列曰天福東咸西咸各四星在房心北鍵閉一星在房東北天市垣二十五星在房心東北帝坐一星在天市中候星西候一星在帝坐東北宦者四星在帝坐西南宗正二星在帝坐東南宗大夫也宗人四星在宗正東族人有序則如綺文而明正宗星二在候星東宗室之象也天江四星在尾北天籥八星在南斗柄西建星六星在南斗北東南四星曰狗國北二星曰天雞天辨九星在建星北河鼓三星旗九星在牽牛北左旗九星在鼓旁旗端四星南北列曰天桴離珠五星在須女北天津九星橫河中騰蛇二十二星在營室北王良五星在奎北居河中天子奉車御官也其四星曰天駟旁一星曰王良亦曰天馬前一星曰策星閣道六星在王良前飛道也傅路一星在閣道南東壁北十星曰天廏天將軍十二星在婁北南一星曰軍南門太凌八星在胃北北九星曰天船昴西二星曰天街卷舌六星在昴北五車五星三柱九星在畢北其中五星曰天潢天潢南三星曰咸池五車南六星曰諸王其西八星曰八穀天關一星在五車南東井鉞前四星曰司怪司怪西北九星曰坐旗坐旗西四星曰天髙天髙西一星曰天河南河北河各三星夾東井南河南三星曰闕丘五諸侯五星在東井北一曰帝師二曰帝友三曰三公四曰博士五曰太史此五者常為帝定疑議五諸侯南三星曰天樽積水一星在北河西北積薪一星在積水東北水位四星在積薪東軒轅十七星在七星北軒轅右角南三星曰酒旗酒旗南三星曰天相軒轅西四星曰爟爟北四星曰內平少微四星在太微西士大夫之位也一曰處士或曰博士官明大而黃賢士舉也南四星曰長垣李尋曰紫宫極樞通位帝紀太微四門廣開大道五經六緯尊顯術士翼張舒布燭臨四海少微處士為比為輔故次帝廷女宫在後聖人承天賢賢易色取法於此春秋緯紫微宫為大帝太微為天庭天官上相上將皆顓面正朝中宫天極星其一明者太乙常居三公侍旁藩臣環翊璇璣玉衡髙揭衡峙文昌泰階森布暉映其垣為紫微其象為樞紐在人則廣朝路寢造命出政之廷萬方之所內靣而觀卬也蒼龍主東赤鳥司南於菟神龜儼列西北其舍二十有八其度三百六十有五在人則九畿五服庶邦庶尹之位上之所賴以幹方而作屏也昊穹無言示人以象在上欲其宅心正德秉綱執要以為四方之極在下欲其叶恭和衷并志一慮以同尊乎五位之極端其在我即所以對乎在天二十八舍漢志史天官書同東宫蒼龍房心心為明堂大星天王前後星子屬房為天府曰天駟其陰右驂旁兩星曰襟襟北一星曰牽東北曲十二星曰旗旗中四星曰天市房南衆星曰騎官左角理右角將大角者天王帝坐廷其兩旁各有三星鼎足句之曰攝提攝提直斗杓所指以建時節故曰攝提格亢為宗廟其南北兩大星曰天門氐為天根尾為九子箕為敖客后妃之府南宫朱鳥權衡衡太微三光之廷筐衛十二星藩臣西將東相南四星執法中端門左右掖門掖門內六星諸侯其內五星五帝坐後聚十五星曰哀烏郎位旁一大星將位也藩西有隨星四曰少微士大夫權軒轅黃龍體晉隋志軒轅十七星在七星北前大星女主象旁小星御者後宫屬東井為水事其西曲星曰鉞北北河南南河兩河天闕間為關梁輿鬼鬼祠事柳為鳥喙主木草七星頸為員宫張嗉為厨主觴客翼為羽翮主逺客軫為車主風其旁一小星曰長沙星軫南衆星曰天庫西宫咸池曰天五潢五帝車舍奎曰封狶為溝瀆婁為聚衆胃為天倉其南衆星曰廥積昴曰旄頭胡星也畢曰罕車為邊兵其大星旁小星為附耳昴畢間為天街參為白虎三星直者是為衡石下有三星鋭曰罰其外四星左右肩股也觜觽為虎首主葆旅事其南有四星曰天厠厠下一星曰天矢其西有句曲九星三處羅列一曰天旗二曰天苑三曰九斿東大星曰狼下四星曰弧直狼比地有大星曰南極老人老人見治安不見兵起常以秋分時候之南郊文選注樂緯曰商為五潢北宫玄武虛危危為蓋屋虛為哭泣其南有衆星曰羽林天軍軍西為壘或曰鉞旁有一大星為北落危東六星兩兩而比曰司寇營室為清廟曰離宫閣道漢中四星曰天駟旁一星曰王梁史作良旁有八星絶漢曰天橫史作潢旁江星杵臼四星在危南匏瓜南斗為廟其北建星建星者旗也牽牛為犧牲其北河鼓婺女其北織女天女孫也晉志隋志同東方角二星為天闕其間天門也其內天庭也黃道經其中七曜之所行也左角為天田為理右角為將其星明大王道太平亢四星天子之內朝氐四星王者之宿宫房四星為明堂天子布政之宫也亦四輔也中間為天衢為天闕黃道之所經也七曜由乎天衢則天下和平又北二小星曰鈎鈐天之管籥心三星天王正位也中星曰明堂天子位為大辰漢五行志劉向以為星傳曰心大星天王也前星太子後星庶子也尾九星妃后之府大小相承則後宫有敘多子孫箕四星一曰天雞主八風北方南斗六星天廟也亦為壽命之期牽牛六星天之關梁須女四星天少府虛二星冢宰之官危三星主天府墳墓四星屬危之下營室二星天子之宫也離宫六星天子之别宫東壁二星圖書之祕府也星明王者興道術行國多君子西方奎十六星天之武庫也婁三星為天獄胃三星天之厨藏昴七星天之耳又為旄頭胡星也天子出旄頭罕畢以前驅畢八星主弋獵附耳一星在畢下觜觽三星為三軍之候明則軍儲盈將得勢參十星黃帝占參應七將南方東井八星天之南門黃道所經用法平則井星明而端列鉞一星附井之前輿鬼五星天目也柳八星主雷雨星七星主衣裳文繡張六星主珍寶宗廟翼二十二星主天之樂府星明大禮樂興四夷賔動則蠻夷使來軫四星冢宰輔臣也軫星明則車駕備轄星傅軫兩旁左轄為王者同姓右轄為異姓長沙一星在軫之中隋志曰四方二十八宿并輔官一百八十二星星官在二十八宿之外者庫樓十星在角南旁十五星三三而聚者柱也中央四小星衡也東北二星曰陽門南門二星在庫樓南平星二星在庫樓北天門二星在平星北亢南七星曰折威頓頑二星在折威東南騎官二十七星在氐南若天子武賁主宿衛東端一星騎陳將軍南三星車騎陳車三星在騎官東北積卒十二星在房心南從官二星在積卒西北龜五星在尾南傅説一星在尾後魚一星在尾後河中杵三星在箕南粳一星在箕舌前杵西北鱉十四星在南斗南農丈人一星在南斗西南狗二星在南斗魁前天田九星在牛南羅堰九星在牽牛東九坎九星在牽牛南九坎間十星曰天池虛南二星曰哭哭東二星曰泣泣南十三星曰天壘城如貫索狀敗臼四星在虛危南危南二星曰蓋屋其南四星曰虛梁羽林四十五星在營室南一曰天軍主軍騎壘壁陳十二星在羽林北羽林之垣壘也北落師門一星在羽林南長安城北門曰北落門以象此也北落西北有十星曰天錢北落西南一星曰天綱北落東南九星曰八魁八魁西北三星曰鈇質奎南七星曰外屏外屏南七星曰天溷天溷南一星曰土司空婁東五星曰左更西五星曰右更天倉六星在婁南南四星曰天庾天囷十三星在胃南天廪四星在昴南天苑十六星在昴畢南苑南十三星曰天園畢附耳南八星曰天節天節下九星曰九州殊口畢柄西五星曰天陰參旗九星在參西玉井四星在參左足下西南九星曰九遊東南四星曰軍井軍市十三星在參東南野雞一星在軍市中軍市西南二星曰丈人丈人東二星曰子子東二星曰孫東井西南四星曰水府東井南垣之東四星曰四瀆狼一星在東井東南北七星曰天狗弧九星在狼東南弧南六星曰天社昔共工氏之子句龍能平水土故以配社其精為星老人之星在弧南一曰南極常以秋分之旦見于景即丙字春分之夕沒于丁見則治平主壽昌常以秋分候之南郊柳南六星曰外厨厨南一星曰天紀稷五星在七星南農正也張南十四星曰天廟天子之祖廟也翼南五星曰東區蠻夷星也軫南三十二星曰器府樂器之府也青丘七星在軫東南青丘西四星曰土司空土司空北二星曰軍門主營候彪尾威旗已上晉志頗詳於隋志乾象新書石申列舍星一百六十六角至軫石申中官星三百十八招搖至郎將石申外官星二百七十一平星至長沙甘德中官星二百一平道至謁者甘德外官星二百九天門至青丘巫咸中官星三十一列肆至虎賁巫咸外官星九十五陽門至土司空石申紫微垣星五十四紫微垣至文昌甘德紫微垣星一百一四輔至八穀巫咸紫微垣星十八御女至鈎後魏書永熙中詔通直散騎常侍孫僧化與太史令胡世榮張龍趙洪慶及中書舍人孫子良等在門下外省校比天文書集甘石二家星經及漢魏以來二十三家經占集為五十五卷後集諸家撮要前後所上雜占以類相從日月五星二十八宿中外官圖合為七十五卷中興書目星簿讃厯一卷載星宿躔度應驗事案隋志石氏星簿經讃一卷唐志石氏星經簿讃石申注今本所載州名有徐潁婺台之類疑後人所附益也朝氏志司天考占星通元寶鏡一卷題曰巫咸氏甘石星經一卷甘公石申撰以日月五星三垣二十八宿常星圖象次舍有占訣以候休咎漢天文志星者金之散氣其本曰人星衆國吉少則凶注孟康曰星石也金石相生三五厯記星者元氣之英水之精也河圗括地象川德布精上為星河精象為天漢朱子易傳班固曰隂陽之精其本在地張衡曰地有山嶽精鍾為星蓋星辰者地之精氣上發乎天而有光耀者也星日之餘也辰月之餘也月生於日之所照也衆星被耀因水轉光三辰同形隂陽相配其體則艮也河洛篇曰天中極星崑崙之墟天門明堂太山之精中挺三台也五靈諸侯也岍岐荆山壺口雷首太嶽砥柱東方之宿也析城王屋太行常山碣石西傾朱圉北方之宿也鳥鼠太華熊耳外方桐柏嶓冡陪尾西方之宿也荆山內方大别岷山衡山九江敷淺原南方之宿也九隘之險九河之曲漾水三危汶江九折上為列星邵子曰日隨天而轉月隨日而行星隨月而見周易分野星圖隋經籍志五行周易分野星圖一卷又天文梁有天官宿野圖一卷亡天下十二次圖一卷二十八宿分野圖一卷讖緯有孝經分野圖一卷唐藝文志天文類周易分野星圖一卷崇文目地理類開元分野圖一卷晉志十二次度數費直説周易所言頗有先後費直周易分野壽星起軫七度大火起氐十一析木起尾九星紀起斗十玄枵起女六諏訾起危十四降婁起奎二大梁起婁十實沈起畢九鶉首起井十二鶉火起柳五鶉尾起張十三度唐志雲漢自坤抵艮為地紀北斗自乾攜巽為天綱乾維內為少昊之墟乾維外為顓頊之墟巽維內為太昊之墟巽維外為列山氏之墟賁彖曰觀乎天文以察時變日陽也而為離月隂也而為坎緯星動者陽也而太白辰星為隂經星不動者隂也而析木鶉首為陽北斗振天二極不動故曰天文也發繫辭曰在天成象在地成形象者形之精華於上形者象之體質留於下十二次之分野若周禮保章氏注星紀吳越至析木燕春秋正義謂秦漢以來地分天次是也二十八宿之分野若史記天官書二十八舍主十二州角亢氐兖房心豫尾箕幽斗江湖牽牛婺女揚虛危青營室東壁并奎婁胃徐昴畢冀觜觽參益東井輿鬼雍柳七星張三河翼軫荆淮南子角亢鄭至翼軫楚漢志昴畢間為天街其隂隂國陽陽國藝文志有海中二十八宿國分臣分各二十八卷是也五星之分野若天官書秦之疆候太白占狼弧吳楚候熒惑占鳥衡燕齊候辰星占虛危宋鄭候歲星占房心晉亦候辰星占參罰中國在東南為陽日歲星熒惑填星占於街南畢主之西北胡貉旃裘引弓之民為隂月太白辰星占於街北昴主之秦晉好用兵復占太白胡貉數侵掠獨占辰星續漢志注星經歲星主泰山徐青兖熒惑主霍山揚荆交鎮星主嵩髙豫太白主華隂山涼雍益辰星主恆山冀幽并唐志岱宗歲星位焉至嵩丘鎮星位焉是也北斗之分野若天官書杓自華以西南衡殷中州河濟之間魁海岱以東北星經玉衡一徐二益三冀四荆五兖六揚七豫八幽九并春秋緯文耀鉤雍屬魁冀屬樞兖青機徐揚權荆衡梁開豫搖晉志一秦二楚三梁四吳五燕六趙七齊唐志杓以治外故鶉尾為南方負海之國魁以治內故陬訾為中州四戰之國是也干支之分野若天官書甲乙四海之外丙丁江淮海岱戊己中州河濟庚辛華山以西壬癸常山以北淮南子甲齊乙東夷丙楚丁南夷戊魏已韓庚秦辛西夷壬衛癸越子周丑翟寅楚卯鄭辰晉已衛午秦未宋申齊酉魯戌趙亥燕漢志壬燕趙癸北夷辰邯鄲未中山戌吳越亥燕代星經玉衡第一星以五子日候之二亥三戌四卯五辰六巳七午八寅九申是也河漢之分野若漢志南戒為越門北戒為胡門唐志山河之象存兩戒觀兩河之象與雲漢所始終是也諸星之分野若晉志東區青丘隋志齊趙鄭越周秦代晉韓魏楚燕之星是也詳見星土分野一卷隋志春秋有左氏通典云諸國分野具於班固漢書皇甫謐帝王世記下分區域上配星躔漢天文圖籍史天官書所見天變皆國殊窟冗家占物怪以合時應其文圖籍禨祥不法是以孔子論六經紀異而説不書前天文志晉志馬續云凡天文在圖籍昭昭可知者經星常宿中外官凡百十八名積數七百八十三星皆有州國官宫物類之象其伏見蚤晚邪正存亡虛實闊狹及五星所行合散犯守陵歷鬭食彗孛飛流日月薄食暈適背冗抱珥虹霓迅雷風祅怪雲變氣此皆隂陽之精其本在地而上發于天政失於此則變見於彼明君覩之而寤飭身正事若角亢氐兗至翼軫荆甲齊至亥燕代秦占弧至晉占參而州國之象著焉三公三能上將貴相執法騎官文昌郎位諸侯羽林藩臣司寇而官名之象著焉泰一常居營室閣道心為明堂房為天府亢為宗廟軫胃為庫倉箕為后妃之府及端門掖門帝坐車舍苑街清廟之屬皆宫象也槍棓矛盾駟驂襟牽旗市關梁弧矢杵臼狼虎犧牲溝瀆之屬皆物象也日月周耀星辰垂精百官立法宫室混成降應王政景以燭形舉其占應覽故考新妖祥之占始漢元年五星聚東井終元壽元年歲星入太微藝文志天文二十一家四百四十五卷自泰一雜子星至圖書祕記有日月五星霓雲雨之占厯譜有月行帛圖月五星行度日晷書自古五星宿紀顓頊五星厯日月宿厯厯志引古文月采篇天文志引星傳古厯甘石氏經夏氏日月傳續志孝明帝使班固敘漢書而馬續述天文志注謝沈書曰蔡雍撰建武已後星驗著明以續前志譙周接繼其下晉志諸侯之史梓慎卜偃禆竈子韋甘德唐昧尹臯石申夫皆掌著天文各論圖驗隋志河洛圍緯雖有星占星官之名未能盡列壽昌圖儀成于甘露賈逵星圖論于永元漢月行帛圖日月交會圖藝文志厯譜耿昌月行帛圖二百三十二卷月行度二卷隋志月行黃道圖一卷梁有日月交會圖鄭元注一卷又日月本次位圖一卷京氏日占圖三卷魏氏日旁氣圖一卷日旁雲氣圖五卷日月薄蝕圖一卷日月暈珥雲氣圖占一卷太玄測曰盛哉日乎丙明離章五色淳光夜則測隂晝則測陽晝夜之測或否或臧陽推五福以類升隂幽六極以類降升降相關大正乃通經則有南有北緯則有西有東巡乘六甲與斗相逢厯以記歲而百穀時雍中次六月闕其慱不如開明于西測曰明始退也元攡曰察龍虎之文觀鳥龜之理運諸漆政繫之泰始極焉以通璇璣之統正玉衡之平元瑩曰天元咫步日月紀數斗振天而進日違天而退元告曰地坎而天嚴月遄而日湛注月日行十三度故疾日日行一度故遲月令注日月之行一歲十二會聖王因其會而分之以為大數觀斗所建命其四時正義凡二十八宿及諸星皆循天左行一日一夜一周天一周天之外更行一度一年三百六十五周天四分度之一日月五星則右行日一日一度月一日十三度十九分度之七此相通之數也今厯象之説月一日至四日行最疾日行十四度餘五日至八日次疾日行十三度餘九日至十九日行遲日行十二度餘二十日至二十三日又小疾日行十三度餘二十四日至晦又最疾日行十四度餘此月行之大率也二十七日月行一周天至二十九日強半月及於日與日相會乃為一月故考靈耀云九百四十分為一日二十九日與四百九十九分為月周髀云日猶火月猶水火則外光水則含景故月光生於日所照魄生於日所蔽當日則光盈就日則明盡京房云月與星辰隂也有形無光日照之乃有光先師以為日似彈丸月似鏡體或以為月亦似彈丸日照處則明不照處則暗元命包云日實也月闕也説題辭云星精陽之榮也陽精為日日分為星故其字日下生也日行遲一月行二十九度半餘月行疾一月行天一匝三百六十五度四分度之一過而更行二十九度半餘逐及於日而與日會所會之處謂之辰鄭注周禮大師職云十一月辰在星紀十二月玄枵正娵訾二降婁三大梁四實沈五鶉首六鶉火七鶉尾八壽星九大火十析木此一歲十二會也兩月各有二十九日強半之日合兩半而成一日是月一大一小之外仍有餘分一年揔三百五十四日是十二會之實數也仍少十一日四分日之一未得周天聖王總以三百六十五日四分日之一為十二會之大數每辰有三十度九十六分度之四十二是分之為大數也星次西流日行東轉東西相逆若月初日在星分之初月半在半月終在末凡十二月日之所在或舉月初或舉月末皆據大略不細與厯數齊同其昏明中星亦皆如此季冬日窮于次月窮于紀星回于天注言日月星辰運行于此月皆周匝於故處次舍也紀會也正義日還次玄枵月與日還復會於玄枵二十八宿隨天而行每日雖周天一匝早晚不同至此月復故處左傳昭七年晉伯瑕曰日月之會是謂辰故以配日傳又曰龍尾伏辰注日月之會曰辰日在尾故尾星伏不見汲冢周書周月解維一月既南至昏昴畢見日短極是月斗柄建子日月俱起于牽牛之初右回而行月周天起一次而與日合宿日行月一次而周天厯舍干十有二辰終則復始是謂日月權輿武順解天道南右日月西移地道尚左水道東流人道尚中耳目役心周禮疏指星體言謂之星日月所會名宿亦曰辰曰次曰房蔡雍曰宿者日所在離月所歷洪範正義張衡蔡雍王蕃等説渾天云天體圓如彈丸北髙南下北極出地上三十六度南極入地下三十六度南極去北極直徑百二十二度弱其依天體隆曲南極去北極百八十二度強當天之中二極中等之處謂之赤道去南北極各九十一度春分日行赤道從此漸北夏至赤道之北二十四度去北極六十七度去南極百十五度日行黑道從夏至後日漸南至秋分還行赤道與春分同冬至行赤道之南二十四度去南極六十七度去北極百十五度日行處謂之黃道又有月行之道與日道相近交終而過半裏半表當交則兩道相合交去極逺處兩道相去六度此日月行道之大略也梓慎曰日月之行也分同道也至相過也詩十月之交注日月之交會正義日月行相逮及交而會聚謂朔日也古厯緯及周髀言日月皆右行於天月行疾日行遲二十九日有餘月行天一周追及於日與之會每月皆交會而月或在日道表或在裏故不食月與日同道乃食厯象為交會之術大率以百七十三日有竒為限而日月行天各自有道雖至朔相逢而道有表裏若月先在裏依限而食者多月先在表雖依限而食者少杜預見其參差乃云日月動物雖行度有大量不能不少有盈縮有雖交會而不食或有頻交而食者唯正陽之月君子忌之春秋正義日月同處日被月映而形魄不見云日有食之以月不可見故不言月日食者月掩之也日月之道互相出入或月在日表從外入內或月在日裏從內出外道有交錯故日食朔則交會故食必在朔自隱元年盡哀二十七年積二百五十五年凡三千一百五十四月唯三十七食是雖交而不食也襄二十一年九月十月頻食二十四年七月八月頻食是頻交而食也劉歆三統以為五月二十三分月之二十而日一食空得食日而不得加時漢末劉洪作乾象厯始推月行遲疾求日食加時後代修之漸益微密今為厯者推步符合但無頻月食法漢初以來殆將千歲為厯者皆一百七十三日有餘而始一交會未有頻月食者漢書髙祖三年十月十一月晦日頻食則日有頻食之理前五行志凡日所躔而有變則分野之國失政者受之人君能修政共御厥罰則災消而福至前律厯志三統厯曰傳不曰冬至而曰日南至極於牽牛之初日中之時景最長以此知其南至也斗綱之端連貫營室織女之紀指牽牛之初以紀日月故曰星紀五星起其初日月起其中凡十二次日至其初為節至其中斗建下為十二辰視其建而知其次堯史以星正時周史以月正日恐歷久必差而星月則明著易見也月與日同度謂之朔邇一遐三謂之弦衡分天中謂之望光盡體伏謂之晦晦朔而日月之合東西同度南北同道則月掩日而日食望而日月之對同度同道則月亢日而月食日體徑一度半所行曰黃道月體徑亦如之所行曰白道日一歲一周天月二十九日有竒而一周天月乾曰自強晉日自昭天行日進孰使之哉坎為水為離為火為日坎坤體也坎中乾之二五也乾陽流於坤隂故月以速為退月體不明待日而明明者乾也離乾體也其中畫乃坤之二五行遲者隂麗乎陽也月受明於日陽大隂小故曰大明續厯志極建其中道營于外琁衡追日以察斂光道生焉日有光道月有九行九行出入而交生焉朔會望衝鄰於所交虧薄生焉月有晦朔星有合見月有弦望星有留逆其歸一也步術生焉淮南子日行九州七舍有五億萬七千三百九里周髀日光外照徑八十一萬里地説書日照四十五萬里論衡月行一日一夜行二萬六千里徐整長厯月徑千里周圍三千里下於天七千里抱朴子七曜皆東行白虎通天道左旋日月東行范子計然日者寸也月者尺也尺者紀度而成數寸者制萬物隂陽之短長日行天日一度終而復始如環無端後漢鄭興傳建武七年三月晦日食興上疏曰日月交會數應在朔頃年日食每多在晦先時而合皆月行疾也日君象月臣象君亢急則臣下促迫故行疾也南史梁顔協撰日月災異圖兩卷南齊志漢尚書令黃香曰日蝕皆從西月蝕皆從東無上下中央者周禮疏斗柄所建十二辰而左旋日體十二月與月合宿而右轉召誥疏治厯者必先正望朔史官因紀之將言望後之事必以望紀將言朏後之事則以朏紀望之在月十六日為多十六日者四分之三十五日者四分之一此年入戊午蔀五十六歲二月小乙亥朔孔云十五日即為望是己丑為望顧氏云日月正相望也周髀隂陽之數日月之法十九歲為一章四章為一蔀七十六歲二十蔀為一遂遂千五百二十歲三遂為一首首四千五百六十歲七首為一極極三萬一千九百二十歲生數皆終萬物復始天以更元作紀厯月與日合為一月日復日為一日日復星為一歲外衡冬至日在牽牛內衡夏至日在東井冬至從坎陽在子日出巽而入坤見日光少故曰寒夏至從離隂在午日出艮而入乾見日光多故曰暑法言月未望載魄于西既望終魄于東其遡於日乎桓談新論揚子雲因衆儒之説以天為常左旋日月星辰隨而東西乃圖畫形體行度參以四時厯數昏明晝夜正蒙天左旋處其中者順之少遲則反右矣虧盈法月於人為近日逺在外故月受日光常在於外人視其終初如鈎之曲及其中天如半璧然此虧盈之驗也蘇氏曰交而食陽微而隂乘之也交而不食陽盛而隂不能掩也邵氏曰日隨天而轉月隨日而行朱氏曰天最健一日一周而過一度日之健次於天而少遲常不及天一度月尤遲一日常不及天十三度有竒厯家算所退之度云日行一度月行十三度有竒此乃截法故有日月五星右行之説其實非右行也胡氏曰天之形望之其色蒼然南樞入地下三十六度北樞出地上三十六度一晝一夜行九十餘萬里人一呼一吸謂之一息一息之間天已行八十餘里人之一書夜有一萬三千餘息故一書一夜天行九十餘萬里天之健可知漢星圖蓋圖見言天三家續厯志賈逵論問典星待詔姚崇井畢等十二人皆曰星圖有規法日月實從黃道劉向傳晝誦書傳夜觀星宿或不寐達旦又後漢郎顗晝研精義夜占象度元延中元年七月辛未星孛東井上奏曰書曰伻來以圖天文難以相曉臣雖圖上猶須口説願賜清燕之間指圖陳狀上輒入之唐志孝經內記星圖一卷失姓名漢靈憲圖星官名數唐藝文志張衡靈憲圖一卷又渾天儀一卷隋志天文靈憲一卷衡文選注引張靈憲圖注續漢志注臣昭以張衡天文之妙冠絶一代所著靈憲渾儀略具辰耀之本靈憲曰昔在先王將步天路用定靈軌尋緒本元先凖之于渾體是為正儀立度而皇極有逌建樞運有逌稽也乃建乃稽斯經天常故靈憲作興元氣剖判剛柔始分清濁異位天成於外地定於內天體於陽故圓以動地體於隂故平以靜在天成象在地成形天有九位地有九域天有三辰地有三形人之精者作聖實始紀綱而經緯之八極之維徑二億三萬二千三百里南北則短減千里東西則廣增千里自地至天半於八極則地之深亦如之通而度之則是渾已將覆其數用重鉤股懸天之景一作晷薄地之儀皆移千里而差一寸宇之表無極宙之端無窮天有兩儀以儛道中其可覩樞星是也謂之北極在南者不著故聖人弗之名焉陽道左回故天運左行星者體生於地精成隋志作發於天列居錯跱各有逌屬紫宫為皇極隋志作帝皇之居太微為五帝之廷明堂之房大角有席天市有坐蒼龍連蜷於左白虎猛據於右朱雀奮翼於前靈龜圈首於後狼蚖魚鱉罔有不具在野象物在朝象官在人象事於是備矣懸象著明莫大乎日月其徑當天周七百三十六分之一地廣二百四十二分之一日者陽精之宗積而成鳥象烏而有三趾陽之類其數竒月者隂精之宗積而成獸象兔隂之類其數耦日譬猶火月譬猶水火則外光水則含景月光生於日之所照魄生於日之所蔽當日則光盈就日則光盡衆星被耀因水轉光當日之衝光常不合者蔽於地也衆星列布其以神著有五列焉是為三十五名一居中央謂之北斗動變挺占隋志作動係於占實司王命四布於方為二十八宿中外之官常明者百有二十四可名者三百二十為星二千五百而海人之占未存焉隋志星圖海中占一卷海中星占一卷微星之數蓋萬一千五百二十庶物蠢蠢咸得繫命不然何以總而理諸文曜麗乎天其動者七日月五星是也周旋右回天道者貴順也近天則遲逺天則速攝提熒惑地候見晨附于日也太白辰星見昏附于月也二隂三陽參天兩地老子四星周伯王逢芮各一錯乎五緯之間其見無期其行無度本傳著靈憲算罔論言甚詳明注靈憲序曰云云衡集無算罔論蓋網絡天地而算之因名焉應間云經思天衢內昭獨智方將師天老而友地典與之高睨而大談稟著懸圖衡集作玄圖太平御覽引玄圖曰橐籥元氣受無原隋志張衡集十一卷梁十二卷又一本十四卷隋志張衡為太史令鑄渾天儀總序經星謂之靈憲衡所鑄之圖遇亂堙滅星官名數今亦不存文選蜀都月賦注藝文類聚引靈憲太平御覽引自地至天一億萬六千二百五十里靈憲注曰太素之前幽清元靜春秋正義引靈憲曰當日之衝光常不合是謂暗虛在星則星微遇月則月食隋志引張衡靈憲曰日之薄地暗其明也類聚引靈憲圖曰崑崙東南有赤縣之州後魏信都芳撰厯書名曰靈憲厯算月頻大頻小食必以朔證據甄明崇文目有靈憲圖三卷仲林子撰晉陳卓星圖三家星官圖録甘石巫咸三家星圖甘石二家星經二十三家經占晉志武帝時太史令陳卓揔甘石巫咸三家所著星圖大凡二百八十三官一十四百六十四星以為定紀今略其昭昭者以備天官云隋志自攝提至軍門凡二百五十四官一千二百八十三星并二十八宿輔官一百八十二星名曰經星中宫始於北極次以文昌次以黃帝坐次以攝提二十八舍星官在二十八宿之外者庫樓至軍門天漢十二次度數州郡躔次陳卓云七曜雜星氣客星流星雲氣十輝雜氣天變史傳事驗已上並天文志所載自雜星氣以下皆圖緯舊説及荆州占魏太史令陳卓更言郡國所入宿度史天官書昔之傳天數者髙辛之前重黎唐虞羲和有夏昆吾殷商巫咸周室史佚萇弘於宋子韋鄭則禆竈在齊甘公名德楚唐昧趙尹臯魏石申夫藝文志楚有甘公未知孰是揚子或問星有甘石曰在德不在星德隆則晷星星隆則晷德歸藏昔黃神將戰筮於巫咸隋志星官之書自黃帝始三國時吳太史令陳卓始列甘氏石氏巫咸三家星官著於圖録并注占贊總有二百五十四官一千二百八十三星并二十八宿及輔官附坐一百八十二星總二百八十三官一千五百六十五星宋元嘉中太史令錢樂之鑄渾天銅儀以朱黑白三色用殊三家而合陳卓之數商巫咸用黃色七十一座八百一十星魏石申夫用朱色九十四座百四十四星齊甘德用黑色一百八十座五百一十星內官七十六座二百八十一星外官四十二座二百二十三星元嘉十七年作小渾天以白青黃珠為三家星隋庾季才等參校周齊梁陳及祖暅孫僧化舊圖刋正踈密依凖三家星位以為蓋圖三家圖録以隋志考之巫咸五星占一卷甘氏四七法一卷石氏星經簿讃一卷星經二卷又星官十九卷渾天圖十卷吳襲撰石氏星占一卷又梁有石氏甘氏天文占各八卷陳卓記石氏星經七卷史記正義云楚甘德作天文星占八卷石申作天文八卷崇文總目有荆州劉石甘巫占一卷中興書目有星簿讃厯一卷疑後人附益家中興書目甘石巫咸氏星經一卷集三悉圖其象有後人附益非本經若陳卓之書則隋唐志有四方星占五星占各一卷天官星占天文集占各十卷唐一行按甘石巫咸衆星明者圖之北史魏永熙中詔孫僧化胡世榮等在門下外省校比天文書集甘石二家星經及漢魏以來二十三家經占集為五十五卷後集諸家撮要前後所上雜占以類相從日月五星二十八宿中外官及圖合為七十五卷唐志孫僧化等星占三十三卷隋志云二十八卷書伊陟贊巫咸作咸乂四篇世本以為作筮楚辭亦著其名劉昭注後漢志述巫咸辰守奎太白守井熒惑守參五星入軫水見翼之占晉志述巫咸彗星出西方之占郭璞巫咸山賦序巫咸以鴻術為帝堯醫漢志河東安邑巫咸山在南周禮注引甘氏歲星經説文引甘氏星經女媊史記索隱按天文志皆甘氏星經文而志又兼載石氏前志雜占有甘德長柳占夢二十卷周禮疏史景紀索隱按石氏星傳郎顗傳續天文志注及賈逵論黃道規皆引石氏經索隱引石氏星讃槍棓二星備變龍體主后妃文選注亦引之月令疏熊氏及周禮疏亦引石氏星經後漢天文志注引石氏星占巫咸占五行志注引石氏占宋志引石氏説禮大司樂疏案春秋緯文耀鈎及石氏星經云房心為天帝之明堂布政之所出又案星經天社六星太平御覽引甘氏天文占梁天文五行圖隋志唐志同天文橫圖一卷高文洪撰天文集占圖十一卷又星圖二卷二十八宿二百八十三官圖一卷雜星圖五卷星圖海中占一卷梁有天文五行圖十二卷亡日月暈圖二卷星書圖七卷隋蓋圖詳見儀象志隋高祖平陳得善天官者周墳并得宋氏渾儀之器乃命庾季才等參校周齊梁陳及祖暅孫僧化官私舊圖刋正大小疏密依凖三家星位以為蓋圖旁摛始分甄表常度并具赤黃二道內外兩規懸象著明躔離攸次星之隱顯天漢昭回宛若穹蒼將為正範以墳為太史令墳博考經書太史觀生始能識天官黃顓以來始作圓蓋以圖列宿唐黃道圖蓋圖覆矩圖見圭景天文志蓋天之説李淳風以為天地中高而四隤日月相隱蔽以為晝夜繞北極常見者謂之上規南極常隱者謂之下規赤道橫絡者謂之中規及一行考月行出入黃道為圖三十六究九道之增損而蓋天之狀見矣漢有耿昌月行帛圖亦此類削篾為度徑一分厚半之長與圖等冗其正中植針為樞令可環運自中樞之外均刻百四十七度全度之末旋為外規規外大半度再旋為重規以均賦周天度分又距極樞九十一度少半旋為赤道帶天之紘距極三十五度旋為內規乃步冬至日躔所在以正辰次之中以立宿距按渾儀所測甘石巫咸衆星明者皆以篾橫考入宿距縱考去極度而後圖之其赤道外衆星踈密之狀與仰視小殊者由渾儀去南極漸近其度益狹而蓋圖漸逺其度益廣若考其去極入宿度數移之於渾天則一也又規度黃道月道則周天咸得其正矣大衍厯十議有九道議七術有步月離步日躔梁令瓉黃道遊儀虛北星舊圖入虛今測在須女九度危北星舊圖入危今測在虛六度半古人重厯數之意將欲敬授人時欽若乾象不在於渾蓋之是非或者各守所傳之器以術天體謂渾元可任數而測大象可運算而窺終以六家之説迭為矛楯以為蓋天邪則南方之度漸狹以為渾天邪則北方之極寖髙此二者又渾蓋之家盡智畢議未有以通其説也王仲任葛稚川之徒區區異同之辨何益哉唐木渾圖渾天圖厯志麟德初李淳風為甲子元厯起二年頒用謂之麟德厯損益中晷術以考日至為木渾圖以測黃道當時以為密會要開元八年六月十五日左金吾衛長史南宫説奏渾天圖空有其書今無其器臣既修九曜占書須量較星象請造兩枚一進內一留司占測許之吳志陸績作渾天圖唐南郊星圖見郊祀類通典會要同顯慶二年太史淳風言昊天上帝圖位在壇上北辰在第二等與北斗並别為星官內座之首乃羲和所掌觀象制圖推步有證又按天官書太微宫有五帝自是五精之神五星所奉以其人主之象故况之曰帝亦如房心為天王之象豈是天乎唐二十七宿圖贊見玉器類唐五星宿度圖藝文志長慶算五星所在宿度圖一卷司天少監徐升崇文目云二卷國史志云一卷通志又崇文目靈憲圖三卷仲林子撰為日紀太隂紀五星紀三篇天心紫微圖歌一卷李淳風撰大象列星圖一卷太平御覽引大象列星圖正色列象注解圖一卷玄黃十二次分野圖一卷唐志孝經內記星圖一卷太白會運逆兆通代記圖一卷李淳風與袁天綱集開寶渾天圖實録開寶二年十月戊寅有司上渾天圖太一圖各一景祐古今天文圖景祐三年九月丙子朔司天監丞邢中和上所藏古今天文格子圖熙寧二年十一月學士司馬光言司天監吏員數百欲試以經史增置卜筮天文三式厯算四科初天禧元年六月戊辰朔王欽若上列宿朝真萬靈朝真二圖并目録六卷祥符三年七月壬午冬官正韓顯符上外宫星位去斗極度數康定元年二月辛卯天文官李自正上星變圖言日與太白犯昴當有邊兵上曰王者當祗畏天道在人事應之如何耳慶厯六年六月流星出營室南則有修德之言皇祐三年九月太隂犯畢宿則有備邊之詔書目列宿圖一卷嘉祐中張宋臣考傳記馬遷厯漢晉墮唐諸史凡星有其名者具事迹本末編為圖玄象隔子圖一卷序云依開元新度入象星經修定凡二百八十四座總一千四百六十四星不知作者至和列象拱極至和元年十月九日庚子虔州祥符宫言道士洞淵大師李思聰撰集到璇霄列象拱極圖凡三面進納詔思聰特與進妙元先生名號元祐四時中星圖見蘇頌元祐儀象崇文目大象垂萬列星圖三卷天象圖一卷紹興蓋天圖紹興七年六月八日日厯戊戌四川帥司進資州翠微洞隱士張大楫用唐制創捷法蓋天圗新式又進翠微洞隱書寶軸司天玉匣祕書金鍵要訣等詔津遣詣行在所日厯載大楫狀用唐舊制創為捷法蓋天圖新式亦欲以坐觀天道備上聖乙夜清覽行軍幕中候驗不勞仰觀陳於几案覆視乎上則乾象雖逺如在目前今造捷法蓋天畫圖及四正地規為板圖大小四面繳進旨津遣赴行在仍賫天文祕書前來進呈大觀四年十二月戊戌宰臣張商英上三才定位圖乾道御製敬天圖見後疏經傳法語於其下朝夕省覽黃裳天文圖黃裳天文圖曰經星三垣二十八舍中外官星是也二百八十三官一千五百六十五星其星不動三垣紫微太微天市也二十八舍東西南北皆七宿中外官星如三台諸侯九卿之類象官如雞狗狼魚龜鱉之類象物如離宫閣道華蓋五車之類象事經星守常位如百官萬民守職業而聽命於七政緯星五行之精歲熒惑填太白辰并日月為七政天行速七政行遲故與天俱東出西入五星輔日月旋五氣如六官分職而治天漢四瀆之精起鶉火至箕尾十二辰斗綱所指謂之月建十玄次日月所會玄枵至陬訾十二分野辰次所臨天為十二辰十二次地為十二國十二州洛書甄曜度周天三百六十五度四分度之一夫一度為千九百三十二里則天地相去十七萬八千五百里春秋元命包曰天不足西北陽極於九故周天九九八十一萬里孝經援神契曰周天七衡六間者相去萬九千里八百三十三里三分里之一合十一萬九十里從內衡以至中衡中衡以至外衡各五萬九千五里呂氏春秋曰天道圜日夜一周月躔二十八宿軫與角屬圜道也極星與天俱遊而天樞不移鹽鐵論曰常星猶公卿也衆星猶萬民也列星正則衆星齊論衡天之去地六萬餘里天日行一周日行一度二千里日晝行千里夜行千里月行十三度十度二萬里三度六千里月一旦夜行二萬六千里天行三百六十五度積凡七十三萬里左傳天以七紀注二十八宿面七鄉飲酒義注三光三大辰也天之政教出於大辰焉淮南子注三光日月星也公羊傳大火心伐參北辰北極為大辰書正義天有日月照臨晝夜猶王官之伯率領諸侯也北斗環繞北極猶卿士之周衛天子也五星行於列宿猶州牧之省察諸侯也二十八宿布於四方猶諸侯為天子守土也月令疏案考靈曜云一度二千九百三十二里千四百六十一分里之三百四十八周天百七萬一千里是天圜周之里數也以圍三徑一言之則直徑三十五萬七千里此二十八宿周廽直徑之數也然二十八宿之外上下東西各有萬五千里是為四遊之極謂之四表四表之內并星宿內總有三十八萬七千里天之中央上下正半之處則一十九萬三千五百里地在於中是地去天之數也列子注自地而上則皆天矣春秋正義云三統厯娵訾初日在危十六度立春節在營室十四度雨水中終於奎四度也降婁初日在奎五度驚蟄節在婁四度春分中終於胃六度也朱子曰在地之位一定不易在天之象運轉不停惟天之鶉火加于地之午位乃與地合而得天運之正厯家以為周天赤道一百七萬四千里日一晝夜而一周春秋二分晝夜各行一半而夏長冬短一進一退又各以其什之一焉凡星皆出辰沒戌故五星為五辰十二舍亦為十二辰歲星司肅典致時雨熒惑司哲典致時燠太白司乂典致時暘辰星司謀典致時寒填星司聖典致時風經星有常不變緯星有伏見進退與日相終始二十八宿為經五星為緯揚子曰史以天占人聖人以人占天楊賜曰王者心有所惟意有所想雖未形顔色而五星以之推移隂陽為其變度杜牧注孫子云歲為善星不福無道火為罰星不罰有德宋有善言星期必退齊無穢德彗或可禳宋景公出人君之言三熒惑為之退舍水土之氣升為曽宙萬物之精凝為列緯皆本於地而發於天者也爾雅月陽月在甲曰畢在乙曰橘丙曰修丁曰圉戊曰厲已曰則庚曰窒辛曰塞壬曰終癸曰極月名正陬二如三寎四余五臯六且七相八壯九玄十陽十一辜十二塗厯書謂太初十月為畢聚離騷孟陬國語至于玄月詩嵗亦陽止周禮注十二月之號謂從娵至荼角亢鄭夀星辰氐房心宋大火卯尾箕燕析木寅斗牽牛吳星紀丑須女虛危齊玄枵子營室東壁衛陬訾亥奎婁胃魯降婁戌昴畢趙大梁酉觜觿參伐晉實沈申東井輿鬼秦鶉首未栁星張周鶉火午翼軫楚鶉尾已玉海卷一
