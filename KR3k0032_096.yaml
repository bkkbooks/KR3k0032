body:
  text: 玉海卷九十六宋王應麟撰郊祀明堂唐明堂寓圓丘明堂議圖禮志隋無明堂季秋大享寓雩壇通典開皇十三年議立明堂不就季秋祀於雩壇唐髙祖太宗時寓于圓丘貞觀中豆盧寬劉伯莊議從昆侖道上層以祭天下層以布政而孔穎達以為非會要五年太宗將造明堂穎達上表曰未有重樓之上而有堂名魏徴以為五室重屋上圓下方上以祭天下以布政顔師古曰十七年五月師古議周書敘明堂有應門雉門之制以此知為王者之常居其青陽總章玄堂太廟左右個皆路寢之名也謂宜近在宫中又上表曰聖情創造即為大唐明堂何必論戶牖少多疑階庭廣狹髙宗改元總章分萬年置明堂縣欲必立之而議者紛然或以為五室唐昕等或以為九室于志寧等髙宗依兩議以帟幕為之與公卿臨觀議益不一乃率意班其制度至取象黃琮上設鴟尾而明堂亦不能立會要永徽二年七月二日癸巳詔禮官學士議立明堂柳宣依鄭玄議五室孔志約據大戴禮及盧綰蔡雍議九室趙慈皓薛文思等各造明堂圗樣上以九室可依令所司詳定明堂形制大小階基髙下及辟雍門闕等制度三年六月二十八日內出九室樣令有司損益有司奏言內樣堂基三重每基階各十二上基象黃琮為八角室各方三筵開四闥八窗上令於觀德殿前依兩議張設上觀之謂公卿何者為宜閻立德奏兩議不同俱有典故九室似暗五室似明上亦以五室為便乾封三年二月十二日詔造明堂於是改元總章置明堂縣先是二年十二月甲午詔合祀昊天五帝於明堂總章二年三月九日又詔制為明堂屬歲飢而止光宅元年十月陳子昻上疏明堂之制有天地之則隂陽之統二十四氣八風十二月四時五行二十八宿莫不率備願案周禮月令而建之聖厯元年閏月十九日制每月於明堂告朔依王方慶議四時孟月朔日及季夏於明堂告朔以頒天下用鄭玄議告五時帝於堂上舊紀乾封三年二月丙寅以明堂制度歷代不同漢魏以還彌更訛舛遂增古今新制其圗下詔大赦改元總章通鑑總章二年三月丁亥詔定明堂制度其基八觚其宇上圓議不決而止孔穎達傳兼司業與諸儒議厯及明堂事唐東都明堂會要兼用本紀武后垂拱二年通鑑四年二月庚午毁乾元殿造明堂四年正月五日畢功凡髙二百九十四尺凡有三層十二月辛亥改為萬象神宫因改河南縣為合宫縣左史劉允濟上明堂賦百官賀表曰丹鷟踶甍蒼虬繞棟永昌元年正月乙卯享于萬象神宫戊午布政頒九條以訓百官證聖元年正月丙申火萬歲通天元年三月丁巳復作明堂號通天宫會要天册萬歲二年三月二日成中宗神龍元年九月五日壬午祀天地于明堂以髙宗配通典云復就圓丘行事開元五年七月甲子改為乾元殿十年十月五日癸丑復題為明堂而不行饗祀之禮二十七年十月二日毁上層留下層為正殿卑於舊制九十五尺覆以瓦復為乾元殿志則天毁東都乾元殿以其地立明堂其制淫侈不足記其後火焚之又復立開元五年復以為乾元殿而不毁迄唐之世季秋大享皆寓圓丘陳貞節傳開元五年正月玄宗將大享明堂會要云幸東都將行大享之禮貞節惡武后所營非古木不鏤土不文之制乃與王仁忠馮宗上言明堂必直丙巳以憲房心四方是則天子聽政乃居便坐一作馮字無以尊示羣臣願以明堂復為乾元殿使人識其舊詔詳議刑部尚書王志愔等僉謂明堂瓌怪不法天燼之餘不容大享請因舊制還署乾元正寢正至天子御以朝會若大享復寓圜丘制曰可通鑑開元二十七年十月辛巳改修東都明堂十一月甲辰明堂成通典開元禮明堂讀五時令設幄座於青陽左個仲春青陽太廟季春右個孟夏明堂左個仲太廟季右個季夏太廟太室孟秋總章左個仲太廟季右個孟冬玄堂左個仲太廟季右個設羣臣次於璧水東門之外夏南秋西冬北入自青龍門夏朱雀秋白虎冬玄武升自寅陛夏巳陛秋申冬亥劉允濟賦度七筵以垂憲分四室而通輔訪子輿於前迹揆公玉之遺芳順春秋之左右法天地之圓方乘八風而統刑德觀四序而候炎涼覽時則證月令羅九賔之玉帛舞六代之咸韶又萬象明堂賦粵正月庚午始創明堂之制穆穆四門吐納四氣明明八忩均調八風王諲賦寫神規之大造嶷神基之正陽任華賦思文烈以宗祀象天地之圓方李白明堂賦序經始明堂年紀總章天后繼作中宗成之軒皇草圗羲和練日經之營之不彩不質聽天語之察察擬帝居之鏘鏘軋地軸以盤根摩天倪而創規採殷制酌夏步蔑蓬壺之海樓吞岱宗之日觀唐明堂新禮志儀注類員半千明堂新禮三卷李嗣真十卷宋朝王圭等議代宗即位用禮儀使杜鴻漸等議季秋大享明堂以考肅宗配昊天上帝德宗即位亦以考代宗配王涇郊祀録注云即孝經周公嚴父之道唐明堂儀注大饗議志儀注類張大頥明堂儀一卷姚璠等明堂儀注三卷李襲譽明堂序一卷郭山惲大享明堂儀注二卷會要顯慶元年六月十八日太尉無忌等奏祠令以髙祖配五天帝大宗配五人帝於明堂案孝經云嚴父配天無父子同配明堂之義武德時令以元帝配明堂貞觀初奉髙祖配故事有遞遷之典請祀髙祖於圓丘以配天宗祀太宗於明堂以配上帝凖武德故事兼配感帝從之儀鳯二年八月太常少卿韋萬石奏明堂義準鄭玄義祀五天帝王肅義祀五行帝貞觀禮依鄭義顯慶新禮祀昊天上帝乾封三年勑祀五帝兼祀昊天詔尚書省議自此明堂大享兼用貞觀顯慶二禮天授二年春官郎中韋叔夏奏明堂大饗議曰明堂正禮唯祀五帝以配祖宗及五帝五官五神等餘神並不預請依禮從祀於二至垂拱元年七月五日議圎丘南郊明堂嚴配之禮成均助教孔元義請奉太宗髙宗配天於圓丘神堯配感帝于南郊太宗髙宗配明堂右諭德沈伯儀議曰得禮之序莫尚于周禘嚳郊稷不聞二主明堂宗祀始兼兩配文王上主五帝武王下配五神孝經緯曰后稷為天地主文王為五帝宗則神無二主之道禮崇一配之義貞觀永徽共遵專配顯慶之後始創兼尊請髙祖配圎丘方澤太宗配南北郊髙宗配五天鳯閣舍人元萬頃范履氷議請髙宗配五祠從之自是郊丘諸祀以三祖俱配配開元十一年十一月十六日中書令張説奏以髙祖祭始罷三祖同配之禮二十年享明堂以睿宗配永泰元年正月杜鴻漸奏以肅宗配元和元年八月以順宗十五年太常奏以憲宗配開寶八年十一月丙申西京明堂殿成皇祐大饗明堂記序紀要圗五室制度圗鹵簿圗御篆明堂紫宸殿稱賀宣德樓肆赦集英殿飲福宴皇祐二年二月十八日乙亥上謂輔臣曰孝莫大于嚴父嚴父莫大於配天今冬至日當親祀圜丘欲以季秋有事于明堂行饗帝饗親之禮以極孝恭然前代諸儒議論皆異將安適從先是宋庠建議以今年當郊而日至在晦用建隆故事宜有所避因請季秋享明堂文彥博等奏曰臣等檢討舊典昊天上帝一歲四祭皆於南郊以公卿攝事惟至日圜丘率三歲一親祠開寶中藝祖幸西京以四月庚子有事于南郊行大雩禮淳化四年至道二年太宗皆以正月上辛躬行祈榖之祀悉如南郊之祀唯季秋大享缺而未舉真宗祥符初以元符昭降議行此禮以魯國諸生東土耆老徯望升平只有事於岱宗故未遑合宫之事將上帝祖宗之意以俟陛下上曰明堂布政之宫朝諸侯之位天子路寢今大慶殿是已况明道之初嘗合祀天地於此不當因循尚於郊壝寓祭其以大慶殿為明堂分五室於內三月一日戍子朔御札曰事天事地邦國之善經享帝享親聖王之盛節緬稽先憲祗事穹祇祈榖于春祭雩以夏逮升禋於景至嘗親展於國容惟明堂布政之方尊嚴父配天之禮雖崇精享未即躬行言念及兹心焉載惕今將涓季秋之吉旦舉宗祀之上儀躬接神明奉將牲幣庶幾繼孝豈敢憚勤朕取今年九月二十七日辛亥有事於明堂其今年冬至親祀南郊宜即輟罷恩賞依南郊例至日御宣德門行禮己丑詔以大慶殿為明堂戊戌詔羣臣毋得請上尊號于時宰相文彥博為大禮使宋庠為禮儀使王貽永為儀仗使龎籍為鹵簿使髙若訥為橋道頓遞使先是禮官議王者郊用辛蓋取齋戒自新之義又通禮祀明堂亦用辛遂下司天擇日得辛亥吉己亥詔乘輿服御務裁簡丙辰判太常禮儀事宋祁上明堂通議二篇四月丁巳朔禮院言周禮夏世室鄭玄云堂上有五室象五行木室於東北火東南金西南水西北土中央崔靈恩亦如之請如崔鄭之説設五室於大慶殿又舊禮五帝位為縵室今旁帷上幕宜用青繒朱裏四户八牖赤綴户白綴牖宜飾以朱白繒從之乙丑手詔祖宗親郊即遍祭天地太祖雩祀太宗真宗祈榖二禮本無地祇位當時皆合祭天地祖宗並配百神從祀今祀明堂當親郊之期而禮官所定止祭昊天五帝不及地祇配坐不及祖宗未合三朝之制比年稼穡不登移郊為大饗亦為民祈福宜合祭天地並侑三聖百神從祀以昭孝息民亦虞典類上帝禋六宗望山川遍羣神之義五帝神州亦親獻日月河海諸神悉如圜丘從祀因謂彥博等曰禮非天降地出緣人情爾禮官習拘儒之舊傳捨三聖之成法朕甚不取彥博曰惟聖明能達禮之情適禮之變翌日奏五帝神州命官分獻上曰朕於大祀豈敢憚勞禮官議從祀神位未決復諭曰郊壇第一龕者在堂第二三龕者設於左右夾廡及龍墀上在壝內外者列於堂東西廂及後廡以象壇壝之制先繪圗以聞及祀之日上下有序皆上裁定壬申詔輔臣禮官相視設神位于大慶殿上五室內五月丁亥朔奏太室中北天地在左皆南面三聖位在東西面五帝各從本室神州日月北極天皇大帝並設於五室之間五官勾芒以下設於廷中五緯十二次以下七十二位設於東西夾廡二十八舍以下一百七十九位於丹墀龍墀東西黃道外天官以下四百九十六位設於東西廡甲午禮院上明堂五室制度圗五月七日禮院請下司天監繪圗以進六月己巳鹵簿使言用法駕鹵簿減大駕三分之一兵部無字圗詔禮官定圗七月戊子出御製樂曲八月乙卯朔罷前一夕警場辛未上鹵簿字圗法駕用萬一干八十八人九月丁亥三日御崇政殿閲試雅樂宫懸登歌舞佾之奏凡九十一曲遍作之上服鞾袍五日詔乘新玉輅丙申十一日詔杜衍任布陪祠皆力辭不至賜衣帶器幣庚子會要二十一日乙巳太常禮院言大慶殿榜當以黑繒金書明堂二字門榜以朱繒墨書明堂之門四字上曰朕皆親書二字金篆四字飛白書於禁中鞾袍書二榜自晝至夜而畢宣示羣臣一本云乙巳書二榜禮畢詔表飾加軸藏宗正寺又摹刻為副本頒二府及近侍中外榮之五使請各以銜名書二軸之後許之戊申齋于文德殿閣輔臣宗室夕于齋次百官致齋朝堂先是積雨彌旬上虔禱方午而霽至夜月星明穊己酉上服通天絳紗具法駕乘玉輅薦享景靈宫禮畢謁太廟庚戌祼獻七室質明還文德齋次辛亥二十七日未明三刻服鞾袍乘小輦至大次侍中奏嚴辦衮冕執圭禮儀使太常卿奉導入明堂中門至版位樂舞作自大階升詣天地一祖二宗坐奠玉幣每詣神坐行禮畢鞠躬却行須盡褥位方改步移嚮又令侍臣偏諭獻官及進徹俎豆悉安徐謹嚴質明禮畢還大次解嚴改服乘輦御紫宸殿百僚稱賀常服御宣德樓肆赦鈞容樂奉引宣制畢復賀召從臣升樓閲諸軍馬隊酒五行罷下詔止絶請託曰成湯以六事責躬女謁苞苴之先戒管氏以四維正國禮義廉恥之具張應內降恩澤及原減罪犯者中書密院執奏不得施行臣庶有結託貴近者御史諫官覺察論奏於是中外咸竦初宋庠請因大祀後絶內降橫恩以新聖政乃別為手詔與赦書同下彥博等六人各進詩兩禁館閣及中外之臣上詩賦頌凡奏御者三十有八詔褒答十月癸酉七日以大饗慶成謁太平興國寺開先殿酌獻又詣啓聖院永隆殿慈孝寺彰德殿萬夀觀翌日謁會靈祥源觀賜從官食初上將宗祀命罷秋宴十三日丙寅賜飲福宴於集英殿上舉觴屬羣臣畢釂曰與卿等均受其福酒至九行罷乙亥燕京畿父老百五十人於錫慶院宋祁明堂頌序曰作聲歌瑑圭邸帳帟無文夜鼜不嚴以竭恭致誠頌曰二十九載惟秋九月乃即大慶度筵度室寶字題顔震照多物置使有五悉詔輔弼吉日辛亥進祀于堂衣畫衮龍環瑀瑲瑲六帝二祇三后侑旁前祀二日區霧如閉皇帝既齊一夕而霽天清地宴夜星騰晰皇帝小心恭與虔并偏見神祇拜跪送迎久立於次須樂之成器必全玉牢不愛牲制為諸安以正和清夜鼓徹嚴敷致厥誠二年十月辛未五日詔宰臣彥博庠參政若納史官王洙纂集其事為記注三年二月甲申彥博等請上製序冠篇從之丙戌五日彥博等上大饗明堂記二十卷目一卷表云禁中論述方伉曲臺之編聖世典容寧後江都之集又言明堂記起三月戊子下詔汔季秋辛亥禮成廣記備言垂萬世法然簡牘頗繁慮煩乙覽因纂成大饗明堂紀要以聞二卷紀書目彥博以親被訓諭者纂成要凡正記已具者不書庚寅內出御製序賜彥博令崇文院鏤板賜近臣彥博言先帝東薦岱牒右奠汾琮祀譙苦之密都䇿天祖之徽稱並存注記政和七年七月二十三日詔以明堂制度編類成書與明堂記相為表裏八年四月二十二日修宗祀敕成仁宗躬籍以率天下之耕祫祭以教天下之孝八見郊畤而拜况肇禋之禮成再祀明堂而嚴父報本之志盡皇祐明堂禮神玉樂舞樂曲明堂通議圗宗祀書皇祐二年五月一日丁亥朔禮院言奉詔詳定明堂祭玉今惟蒼璧不用外定用四圭有邸黃琮圭璧各二青圭赤璋白琥黝璜兩圭有邸凡十一玉並合擇佳玉準三禮圗參選周禮義疏造依聶崇義所説指尺為度從之仍令內侍盧昭序領焉一以禮神置于神位禮畢藏之少府一以為燔玉加牲體之上并燎燔之實録五月丁亥朔禮院新作明堂禮神玉及燔玉初上謂輔臣曰前代禮神有祭玉燔玉今獨有燔玉毋乃於祀典缺乎文彥博對曰唐太和中太常卿王起以當時祀事止有燔玉因請造璧琮等九器止用珉蓋唐以來禮神之玉已不復備上曰朕奉天地祖宗盡物盡志豈于寶玉有所愛乎其有司備製之時沙州適貢玉四月甲子沙州貢玉乃擇其良者制為琮璧等九器各二其黝璜尤粹祭玉始備一作回紇貢璞十段剖之製琮璧九器己酉御製明堂樂曲及二舞名見樂類十月辛未五日詔禮神玉令少府擇寬潔之室奉藏是年三月丙辰一本云三月二十九日判太常禮儀事宋祁上明堂通議二篇或作六篇國史志宋祁通議二卷序略曰上稽三代旁搜漢唐禮之過者折之説之謬者正之以合一王之典其書自內出復有詔進入後閣門祗候劉舜臣上明堂議并圗一卷范仲淹上建昌軍草澤李泰伯明堂圗序八月丙寅福州草澤鄭叔豹上宗祀書三卷述明堂制度及配享冕服之義泰伯稽考工記大戴盛德記月令白虎通禮記外傳為明堂定制圗序一篇授泰伯太學助教仲淹作明堂賦惟藝祖修大雩之祀惟神宗展祈榖之儀獨季秋之令時闕明堂之大饗由是憲章唐漢祖述姬黃禮官博士之議躬定于節文奠玉祼鬯之歌親成于樂曲景德中祀南郊內外賞賚緡錢金帛總六百一萬皇祐饗明堂增至一千二百餘萬嘉祐大饗明堂七年七月丙午朔詔大饗明堂壬子禮院言皇祐參用南郊百神之位不應祀法宜如隋唐舊制設昊天上帝五方帝位以真宗配而五人帝五官神從祀餘皆罷又開元開寶禮五帝無親獻儀詔恭依而五方帝位並親獻八月乙亥朔出御製明堂樂章下太常肄習九月辛亥七日大饗于明堂設昊天五帝位以真宗配前者祖宗並侑今獨配前者地祇神州並享今以配天而亦罷赦文云物無上帝之稱非躬祠不足昭虔聖維文考之尊非嚴配不足盡孝十月十三日大宴集英殿治平明堂配饗議治平元年正月詔近臣議仁宗配祭學士王圭等與禮官議唐代宗用禮儀使杜鴻漸議大饗明堂以考肅宗配德宗即位以代宗配王涇郊祀録注云即孝經嚴父之道今大饗明堂請以仁宗配帝知制誥錢公輔議以周公言則嚴父以成王言則嚴祖也政則周公祭則成王安在乎嚴父哉我將之詩是也太祖周之后稷配于郊太宗周之文王配于明堂真宗周之武王宗乎廟而不祧者也明堂配祭東漢為得孝武始營明堂以髙帝配其後又配以景帝後無聞焉孝明以光武配適符嚴父之説章安二帝亦弗之變最為合禮詔再詳定中丞王疇侍讀學士孫抃請如圭議知諫院光誨等議宜遵舊禮配以真宗二十五日辛酉詔從疇抃等議以仁宗配十月二十五日御史趙鼎請用唐故事遞遷真宗配雩祭太宗配祈榖神州圭等議真宗配天之祭於禮當罷不當復分雩祭之配講讀官李受等言嚴父非專謂考也乞以仁宗真宗並配明堂詔從圭等議治平四年請以英宗配元祐元年二月二十六日請以神宗配元豐三年七月丁亥二十六日詔逺而尊者祖則祀于圓丘而配天邇而親者禰則祀于明堂而配上帝圓丘祀天則對越諸神明堂則上帝而已歷代以來合宫所配既紊於經至雜以六天之説朕甚不取祀英宗於明堂以配上帝餘從祀羣神悉罷八月十三日詔禮官詳定儀注禮文所言配祀宜及五帝知禮院君錫等五人議六天之説不經見宜如聖詔從之九月辛巳大饗明堂赦文云念神莫帝之大肇新專饗之儀念人莫親之隆載陳嚴配之禮元祐元年二月二十六日辛卯大饗明堂奉神宗配赦文云革顯慶之並尊隆永徽之專配成於獨斷畀豫沖人政和七年八月八日詔明堂五室祀五帝禮部尚書許光凝等議神考黜六天陛下正五室其揆一也詔可仍親祀淳熙十五年九月辛丑宗祀先是上問輔臣配位如何周必大言禮官奏髙宗几筵未除用徽宗故事未應配坐儒者多因孝經之説謂宗祀專以考配不知自周公言之故曰嚴父耳晉紀瞻曰周制明堂宗其祖以配上帝此其證也淳祐五年以寧宗參侑寶祐五年髙宗陟配一祖三宗並侑政和明堂五年七月十日詔曰朕刺經稽古度以九筵分其五室通以八風上圜下方參合先王之制相方視址于寢之南僝工鳩材自我作古八月壬子以明堂小樣於崇政殿宣示百官御書明堂字七年六月明堂成御製上梁文及明堂頌十月御明堂頒朔布政十一月御明堂朝百辟紹興宗祀明堂儀注御書明堂金爵紹興元年二月十六日詔宗祀明堂一遵皇祐二年詔書合祭天地並侑祖宗四月禮官言皇祐移郊為大饗以大慶殿為之今請於常御殿行禮九月九日壬寅內殿進呈仁皇親篆明堂及飛白門榜上曰行宫殿小難以模設遂别書六字十八日辛亥上合祭天地于明堂以太祖太宗並配四年五月甲戌國子監丞王普言明堂有未合典禮者十二事一祭器據政和新儀宗祀用玉爵今誤用陶匏請改正二太牢以牛羊豕為序政和間以我將之詩言維羊維牛於薦牲之時顛倒其序宜改正三按周禮六尊之數凡十有二所用者四設而不酌者八今明堂所用尊罍初無考據以實六罍反在三酒之下請改正四按政和禮泛齊代以供內法酒醴齊代以祠祭法酒供內在祠祭之上非菲飲食致孝鬼神之意請以五齊三酒為稱五禮器放三禮圗不應經典宜從古器制度六改冕服之制七致齋改用質明以成三日之禮八致齋去給酒之文九唐大祀致齋以侍臣夾侍今兩省官不侍立於舊典不合十設席升煙以太社令設版以太史令奠册以太祝十一雅樂先製樂章而後運譜崇寧以來製譜而後命祠故不協聲律宜如舊制十二還版位奏黃鍾誤用郊祀樂請改正從之八月壬寅明堂行禮殿成九月辛酉合祀天地于明堂元年九月太常定儀注自齋戒至進熟九年八月討論祭服禮器十年九月十日辛亥復行明堂禮太常定儀注自誓戒致齋至飲福燎瘞是歲始用大樂飲福用金爵十三年六月二十九日禮官言十年明堂設昊天地祇太祖太宗天皇神州以下從祀四百四十三位共四百四十七位今郊祀增設衆星三百二十四位通七百七十一位從之三十年八月禮官言徽宗配帝明堂若依皇祐遍羣神其禮煩依元豐罷從祀其禮略欲如熙寧設五方五人帝五方神從祀位從之三十一年九月辛未祀明堂以徽宗配紹興宗祀見上初紹興宗祀止設天地祖宗四位至四年始設從祀神位四百四十三用祭器七千五百七十一登歌樂四十祭服六十三玉十二犢四羊豕各二十有二分獻官五十八奉禮郎四樂舞工共二百八十七而五帝神州地祇上不親獻用崇寧禮也始議設從祀諸神七百十一位議者請裁省禮官言十二階三百六十位無神名請每階各設三十五位七月戊辰請如祖宗故事權御臺門肆赦議者以宫門地隘儀衛不能容乃止宣赦於常御殿前赦文云遵皇祐之遺則舉合祠並配之儀續會稽之缺文處四望六宗之位淳熙明堂御書詩賦頌六年九月辛未十六日有事明堂先是三月十七日禮官奏黃帝祀上帝于明堂唐虞祀五帝於五府成王歌我將之頌以祀文王皇祐紹興合祭天地並侑祖宗蓋得聖經遺意陛下一講祈榖四躬冬祀國家大祀四春祈榖夏雩祀秋明堂冬郊祀惟合宫雩壇之禮猶未親行今若用仁宗時李泰伯明堂嚴祖説及治平中吕誨司馬光錢公輔等集議近歲李燾奏疏特舉秋饗於義為允從之四月十九日禮官奏依南郊例設神位七百七十一大慶殿四位從祀七百六十七位於東西朵殿二十五東廊二百八十西廊二百四十八南廊六十六七月二十八日御書明堂明堂之門六字并嗣天子臣御名恭書六字令修內司製碑禮成上曰積雨驟霽星月粲然殊可喜九月三日詔明堂免奏祥瑞上曰朕自有真祥瑞豐年是也百姓家給人足瑞莫大焉十月八日以少傅史浩等三十四人進明堂慶成詩忠州文學程宏繇進明堂賦太常丞胡南逢等三人進明堂頌送日厯所采擇七年四月二十二日太常寺奉安太上御書及今上御書明堂并明堂之門牌四面於玉牒殿門內建殿奉安畢上曰朕字畫豈敢望太上皇帝宰臣趙雄等奏帝王中之羲獻也既而令臨安府刋石賜近臣九年十五年洊舉是禮見上開禧明堂嚴父配天議仁宗皇祐二年以太祖太宗真宗配神宗熙寧四年以英宗配元豐三年同哲宗元祐元年以神宗配見蘇軾制詞追配烈考以侑上帝又曰陟配文考自後兩行明堂無改配之文徽宗大觀元年考會要無改易神宗配之文自政和七年之後皆以神宗配髙宗紹興七年議臣以道君山陵未卜不可遽議配侑三十一年以徽宗配二十九年五月二日詔曰孝莫大於嚴父禮莫重於饗帝宗祀昭配之儀久闕不講何以彰皇考之烈令有司討論典禮孝宗淳熙六年以太祖太宗配十五年髙宗几筵未除亦止配祖宗開禧二年禮部侍郎倪思奏周家明堂本為嚴父自皇祐定制以太祖太宗真宗參配事祖嚴父於是兩盡獨夀皇纍行重屋之禮是時髙宗尊御德夀陛下初款合宫而光宗頥神夀康是以止於並侑祖宗今光宗颷御在天升祔云久望亟命有司討論舊典以光宗與祖宗並配天地詔集議參政李璧奏竊考神宗聖訓有曰周公宗祀乃在成王之世成王以文王為祖則明堂非以考配明矣大哉王言皇祐故事後為南郊止云且奉三聖並侑司馬光謂孔子以周公輔成王致太平之業而文王其父也故引之以證聖人之德莫大於孝答曾子之問而已非謂凡有天下者皆當以父配天然後為孝也近世祀明堂者皆以其父配帝此誤識孝經之意而違先王之禮不可以為法也光所指近世謂唐故事代宗用杜鴻漸等議以考肅宗配天一時誤禮本不足據故錢公輔等於治平初推本經訓亦謂當先朝時惜無一引古義而爭者使宗周令典不明於聖代有唐曲學流弊乎後人光公輔之言與神宗聖訓相為表裏有合乎祀無豐昵之義思又奏易之豫曰配祖考則是饗帝可以兼配祖考也晉摰虞之議曰郊丘之祀掃地而祭牲用繭栗器用陶匏事反其始故配以逺祖明堂之祭備物以薦三牲並陳籩豆成列禮同人理故配以近考此諸儒之論有合於經者皇祐參配紹興專配未嘗不嚴父璧又奏淳熙詔書曰具殫尊祖之誠則是嚴父之説已經釐正足以刋千載之誤垂萬世之規欲再舉淳熙以前典禮則與夀皇所既改者又將抵梧因阜陵之已行申神考之明訓復先王之舊禮一洗魏晉以來之曲説詔祀事日迫候將來别議思又奏聖莫聖於神宗賢莫賢於司馬光固可以為定論然熙寧四年元豐三年兩行明堂親祠實以英宗配元祐初光相哲宗而明堂之祀實以神宗配已見於議論終不輕改舊制蓋以經文及漢晉以來典章故耳集議官謂豫卦非為明堂立文考之正義云配祀明堂以考文王也則是為明堂立文分明思著合宫嚴父書皇祐二年明堂詔若有虞之典類禋遍于羣方叶東漢之文舉秩僅乎千腏祖考並侑軒廡具延交百靈於窈冥瑑十玉之溫潔篆素輝煥笙鏞和清淳熙六年明堂赦文云纍躬泰畤之禋未備總章之饗維周成宗祀洛中陟配於文王維漢武合祠汶上推嚴於髙帝皆用親郊之禮具殫尊祖之誠俶經路寢有皇祐之彛儀遍秩羣神有紹興之近制兩儀合祛二后並侑扁榜大書祺祥免奏九年赦文云禮間舉於宗祈義咸推於祖侑若成王有我將之頌蓋配以文王如武帝得公玉之圗故對惟髙帝新作彤庭大書華榜懷多福者雖上帝之祐畏無難者乃聖人之圗慶元六年赦文云謂黍稷非馨既有慚於至治謂神明可考又蔑底於成功特以肅祗之心冀回開右之意嘉定十七年赦文云雖旗常婀娜不能御法駕以安行然羽衛周張亦已敞明庭而對越其奉粢盛端出豐年之賜其陳牲醴必言民力之存昔河北阻山川之隔鬼神為之不寧今岱宗率海嶽以朝靈祉無乎不下陳祥道禮書明堂論附諸家論明堂之名見於周頌孝經左傳孟子荀卿考工記禮記家語其制不見於經特考工記曰夏后氏世室堂修二七廣四修一五室三四步四三尺九階四旁兩夾忩白盛門堂三之二室三之一商人重屋堂修七尋堂崇三尺四阿重屋周人明堂度九尺之筵凡室二筵此三代明堂之别也南北為修東西為廣夏堂修二七則十四步也其廣益以四分修之一則十七步有半也室三四步則大室方四步四角室角三步也四三尺則東西益廣各三尺而中四尺也以此計之南北室各一丈八尺與太室二丈四尺則六丈也東西室亦一丈八尺而各益三尺大室亦二丈四尺則七丈也門堂三之二以堂修之十四步三分取二而南北九步二尺矣堂廣十七步者半三分取二而東南十一步四尺矣夏世室商重屋周明堂則制漸文矣夏度以步商度以尋周度以筵則堂漸廣矣夏言堂修廣而不言崇商言堂修而不言廣言四阿而不言室周言堂修崇廣而不言四阿其言蓋皆互備鄭康成曰夏堂崇一尺商堂廣九尋理或然也月令中央太室東青陽南明堂西總章北玄堂皆分左右個與太廟則五室十二堂矣明堂位前中階阼賔階旁四門而南門之外又有應門則南一階東西北各二階而為九階矣考工記五室九階蓋木室於東北火室於東南金室於西南水室於西北土室於中央其外别之以十二堂通之以九階環之以四門而南門之外加以應門此明堂之大略也詩正義月令云明堂太廟者謂明堂之太室非宗廟之太廟也明堂位云太廟天子明堂謂制如明堂非太廟名明堂也考工記曰夏后氏世室殷人重屋周人明堂度九尺之筵東西九筵南北七筵堂崇一筵五室凡室二筵鄭氏曰世室宗廟也重屋者王居正堂若大寢也明堂者明政教之堂此三者或舉宗廟或舉王寢或舉明堂互言之以明其同制月令孟春天子居青陽左個青陽左個太寢東堂北偏仲春居青陽太廟東堂當太室季春居青陽右個東堂南偏孟夏居明堂左個太寢南堂東偏也仲夏居明堂太廟明堂之廟南堂當太室也季夏居明堂右個南堂西偏也中央居太廟太室中央室也孟秋居總章左個太寢西堂南偏仲秋居總章太廟西堂當太室也季秋居總章右個西堂北偏孟冬居玄堂左個北堂西偏也仲冬居玄堂太廟北室太室季冬居玄堂右個北堂西偏明堂位昔者周公朝諸侯于明堂之位天子負斧依南向而立三公中階之前北面東上諸侯之位阼階之東西面北上諸伯之國西階之西東面北上諸子之國門東北面東上諸男之國門西北面東上九夷之國東門之外西面北上八蠻之國南門之外北面東上六戎之國西門之外東面南上五狄之國北門之外南面東上九采之國應門之外北面東上四塞世告至此周公明堂之位明堂者明諸侯之尊卑也又曰太廟天子明堂詩曰我將祀文王於明堂孝經曰昔者周公郊祀后稷以配天宗祀文王於明堂以配上帝月令季秋大享帝唐月令九月大享於明堂樂記祀乎明堂而民知孝祭義祀乎明堂所以教諸侯之孝也玉藻曰天子聽朔於南門之外閏月則闔門左扉立于其中南門謂國門也天子廟及路寢皆如明堂制明堂在國之陽每月就其時之堂而聽朔焉卒事反宿路寢亦如之閏月非常月也聽其朔於明堂門中還處路寢門終月左傳周志曰勇則害上不登于明堂孟子稱齊宣王問曰人皆謂我毁明堂毁諸已乎趙氏曰泰山明堂本周天子東巡狩朝諸侯之處孟子曰夫明堂者王者之堂也王欲行王政則勿毁之矣家語曰孔子觀於明堂觀四門墉有堯舜桀紂之象各有善惡之狀廢興之戒荀子強國篇曰雖為之築明堂於塞外而朝諸侯使殆可也孔穎達曰孝經緯云明堂在國之陽又異義淳于登説明堂三里之外七里之內故知南門亦謂國城南門也在國之陽丙巳之地漢立明堂於丙巳由此為之三里之外七里之內水木用事交於東北木火用事交於東南火土用事交於中央金土用事交於西南金水用事交於西北周人明堂五室每帝一室大戴記盛德篇云明堂九室室有四戶八忩三十六戶七十二牖蓋之以茅上圓下方其外水名辟雍政穆篇稱太學明堂之東序明堂月令説曰髙三丈東西九仞南北七筵九室十二門四戶八牖宫三百步在近郊三十里又云堂方百四十四尺坤之䇿也屋圎徑二百一十六尺乾之䇿也太廟明堂方三十六丈通天屋徑九丈隂陽九六之變且圎蓋方載六九之道也八闥以象八卦九室以象九州十二宫以應十二辰三十六户七十二牖以四戶八牖乘九室之數也戶皆外設而不閉示天下不藏也通天屋髙八十一尺黃鍾九九實也二十八柱列於四方亦七宿之象也堂髙三尺以應三統四鄉五色各象其行外博二十四丈以應節氣也又戴德云明堂辟雍是一物古周禮孝經説以明堂為文王廟左傳魯僖公五年既視朝遂登觀臺服氏云明堂祖廟並與鄭説不同鄭注玉藻云天子廟及路寢皆如明堂制即鄭意以為三者名異而同制云小學在公宫之左太學在郊即云天子曰辟雍是學不得與明堂同一物又天子宗廟在雉門之外孝經注云明堂在國之陽玉藻又云聽朔於南門之外是明堂與祖廟别處不得為一也蔡雍明堂章句云一云月令論明堂者天子太廟所以宗祀夏世室商重屋周謂明堂東曰青陽南曰明堂西曰總章北曰玄堂中曰太室人君南面故王以明堂為名在其五室之中央皆曰太廟詩正義潁子容春秋釋例云太廟有八名其體一也饗射養老教學選士皆於其中故言其正室之貌則曰太廟取其尊崇則曰太室取其堂則曰明堂取其四門之學則曰太學取其周水圎如璧則曰辟雍雖各異名而事實一也晉袁準正論明堂宗廟太學事義不同各有所為而世之儒者合為一體取詩書放逸之文經典相似之語推而致之考之人情失之逺矣宗廟之中人所致敬幽隱清靜鬼神所居而使衆學處焉饗射於中人鬼慢黷死生交錯囚俘截耳瘡痍流血以干犯鬼神非其理也茅茨采椽至質之物建日月乘玉輅以處其中非其類也夫宗廟鬼神之居而祭天於鬼神之室非其處也王者五門宗廟在一門之內若在廟而張三侯又辟雍在內人物衆多非宗廟之中所能容也明堂太廟者明堂之內太室非宗廟之太廟也如準所論與鄭義合或以周時德澤洽和蒿茂以為宫柱名蒿宫此天子之路寢也吕氏春秋曰茅茨蒿柱土階三等晏子春秋曰明堂之制木工不鏤示民知節也漢武帝封泰山泰山東北址有古時明堂處險不敞上欲治明堂奉髙旁未曉制度濟南公玉帶上黃帝時明堂圗其制中有一殿四面無壁以茅蓋通水水圜宫垣為復道上有樓從西南入天子從之以拜祀上從之晉侍中裴頠以為直可為殿以崇嚴祀其餘雜碎一皆除之隋無明堂而季秋大享常寓雩壇唐髙祖太宗時寓於圜丘貞觀中禮部尚書豆盧寬國子助教劉伯莊議從昆侖道上層以祭天下層以布政而太子中允孔穎達以為非侍中魏徴以謂五室重屋上圓下方上以祭天下以布政自前世儒者所言雖異而以為如此者多同至於髙下廣大丈尺之制可以因事制宜也祕書監顔師古曰周書敘明堂有應門雉門之制以此知為王者之常居爾其青陽總章玄堂太廟左右個皆路寢之名也文王居明堂之篇帶弓韣禮髙禖九門磔禳國有酒以合三族推其事皆與月令合則皆在路寢也大戴記曰在近郊又曰文王之廟也此奚足以取信哉且門有臯庫豈特施於郊野謂宜進在宫中徵及師古等皆當世名儒其論止於此髙宗時改元總章分萬年置明堂縣示欲必立之而議者紛然或以為五室或以為九室而髙宗兩議以帟幕為之與公卿臨觀而議益不一乃下詔率意班其制度至取象黃琮上設鴟尾其言益不經而明堂亦不能立至則天始毁東都乾元殿以其地立明堂則制淫侈無復可觀皆不足紀其後火焚之既而又復立開元五年玄宗遣將作大匠康辨素毁之辨素以為勞人乃去其上層易以真瓦而迄唐之世季秋大享皆寓圜丘唐志曰自漢以來諸儒之論不一臨時增損不能合古李泰伯曰考工記五室鄭康成解云木室於東北火室於東南金室於西南水室於西北土室於中央聶崇義三禮圗接太室四角以為四室蓋用此盛德記蔡伯喈之徒傳之接四室之角又為四室崇義誤以為秦人明堂圗案秦實無明堂月令有居明堂之文疑為秦爾唐注月令但知十三室各在其辰之上不謀所以建立之處後魏李謐作明堂制度論謂太室四面各為一室則四角闕處各方二筵二筵之地乃為兩便房臣以為月令之文最為明著取以為本而通之周戴白虎通曰上圓下方八窗四闥上圓法天下方法地八窗象八風四闥法四時九室法九州十二坐法十二月三十六户法三十六雨七十二牖法七十二風斯言合於事理因亦取之但周禮言基而不及室大戴言室而不及廟稽月令則備矣然非白虎通無以知窗闥之制崇義所謂秦人明堂其制有十二階似古之遺法禮記外傳曰四面各五門鄭注明堂位云正門謂之應門又鄭注考工記舉宗廟正寢明堂互言之以明其同制又注玉藻曰天子廟及路寢皆如明堂制切謂不然今泛取諸書定明堂制度九尺之筵取於考工記九室戶牖協於盛德記九室四廟本月令八窗四闥稽白虎通十二階采三禮圗四面各五門酌明堂位外傳定制圗唐氏曰世室重屋明堂同制異名而鄭氏離之明堂辟雍清廟路寢制有同者其實異所蔡雍合之朱子曰青陽之左個乃明堂之左個東之南即南之東明堂之右個乃總章左個總章之右個乃玄堂右個西之北即北之西玄堂之左個乃青陽右個北之西即西之北但隨時方位開門耳太廟太室則每時十八日居焉古人制事多用井田遺意葉氏曰天子三朝外朝以大詢內朝以日視朝燕朝退而聽政諸侯來朝則見於太廟明堂以頒朔而已明堂位蓋周公之為萬物本乎天人本乎祖故冬至祭天而祖配之氣至之始也萬物成形於帝而人成形於父故季秋享帝而父配之物成之時也郊而曰天所以尊之也故以后稷配焉亦以尊稷也明堂而曰帝所以親之也故以文王配焉亦以親文王也郊者古禮明堂者周制也周公以義起之也周公宗祀文王漢明配以世祖憲乾度房星之位規汶陽玉帶之圗耳聽鋗玉目瞻熉珠樂備周奏儀參漢圗仁宗祀明堂二皇祐二年嘉祐七年神宗二熙寧四年元豐三年哲宗三元祐元年四年紹聖二年徽宗二大觀元年政和七年髙宗五紹興元年四年七年十年三十一年孝宗三淳熙六年九年十五年寧宗七紹熙三年慶元六年開禧二年嘉定二年八年十一年十四年玉海卷九十六
