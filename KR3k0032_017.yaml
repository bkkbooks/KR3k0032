body:
  text: 玉海卷十七宋王應麟撰地理郡國神農九州管子輕重戊第八十四神農作植五穀淇山之陽九州之民乃知穀食而天下化之帝王世紀諸子稱神農之王天下地東西九十萬里南北八十五萬里周禮職方疏自神農以上有大九州柱州迎州神州之等至黃帝以來德不及逺惟於神州之內分為九州括地象云崑崙東南萬一作方五千里名曰神州文選注引河圖括地象曰崑崙東南地方五千里名曰神州中有五嶽地圖帝王居之禹鄒衍以為中國名赤縣神州赤縣神州內自有九州所敘也中國外若赤縣神州者九所謂九州也續漢志注張衡靈憲曰天有九位地有九域天有三辰地有三形有象可效有形可度聖始紀綱而經緯之八極之維徑二億三萬二千三百里南北則短減千里東西則廣增千里自地至天半於八極則地之深亦如之用鉤股懸天之景薄地之儀皆移千里而差一寸宇之表無極宙之端無窮其可覩樞星是也謂之北極在南者不著故聖人弗之名焉山海經海外東經曰帝命孺亥步自東極至于西極五億十選選萬也九千八百步孺亥右手把算左手指青丘北一曰禹令孺亥八一曰五億十萬九千百步注詩含神霧曰天地東西二億三萬三千里南北二億一千五百里天地相去一億五萬里吕氏春秋四海之內東西二萬八千里南北二萬六千里水道八千里受水者亦八千里通谷六名川六百陸注三千小水萬數四極之內東西五億有九萬七千里南北亦五億有九萬七千里黃帝畫壄分州九州萬國前漢地志黃帝作舟車濟不通旁行天下方制萬里畫壄分州得百里之國萬區故易稱建萬國親諸侯書云協和萬國周爵五等千八百國太昊黃帝之後唐虞侯伯猶存帝王圖籍相踵可知郊祀志申公曰黃帝萬諸侯而神靈之封君七千地理志敘自昔黃唐經略萬國通鑑外紀黃帝畫壄分州以分星次經地設井以塞爭端立步制畝以防不足八家為井井開四道而分八宅鑿井於中其利有十地氣不泄無費一家同風俗齊巧拙通貨財存亡相守出入相司嫁娶相媒有無相貸疾病相救是也井一為鄰鄰三為朋朋三為里里五為邑邑十為都都十為師師十為州出通典史記黃帝置左右監監于萬國萬國和而山川封禪與為多焉通典黃帝方制天下立為萬國易稱首出庶物萬國咸寧晉志黃帝則東海南江登空躡岱至於崑峯振轡風山訪道禹貢釋文黃帝布九州見職録後漢天文志庖犧氏觀法於地謂水土州分顓頊九州通典顓頊置九州帝嚳受之創制九州統領萬國九州之區域在昔顓頊及于陶唐分而為九其制最大周之本制起於顓頊辨其疆界始於禹貢後漢志注帝王世紀曰顓頊帝嚳建萬國而制九州晉志高陽帝嚳東踰蟠木西濟流沙北至幽陵南撫交趾日月所經舟車所至莫匪王臣史記高陽北至于幽陵南交趾西流沙東蟠木動靜之物大小之神日月所照莫不砥屬高辛日月所照風雨所至莫不從服堯九州説文堯遭洪水民居水中高土故曰九州禹貢正義九州之境舊定而云禹别者堯遭洪水萬事改新陶唐有冀方是冀州堯所都也諸州冀為先治水先從冀起堯五服益稷弼成五服至于五千孔氏注每服五百里四面相距為方五千里正義王肅云五千里者直方之數二千五百人為師每州十有二師通計之一州用三萬人功九州用二十七萬孔注同鄭玄云面方各五千里四面相距為方萬里九州州立十二人為諸侯師以佐牧堯初制五服服各五百里要服之內方四千里曰九州其外荒服曰四海此禹所受地記書曰崑崙山東南地方五千里名曰神州者禹弼五服之殘數亦每服者合五百里故有萬里之界萬國之封猶用要服之內為九州方七千里百國一師州十有二師則州千二百國也八州凡九千六百國其餘四百國在圻內王肅難之詩綏萬邦豈周之建國復有萬乎禹貢五百里甸服正義甸侯綏要荒五服之名堯之舊制洪水既平禹乃為之節文使賦役有常逺近有較故其任不等周語云先王之制邦內甸服邦外侯服侯衛賓服夷蠻要服戎狄荒服彼賓服當此綏服詩殷武正義鄭以禹所導山川西被流沙東漸滄海南距衡陽北臨碣石經塗萬有餘里周禮九服蠻畿之內尚至七千舜禹之功不應劣於周世若要服內止四千以下等計之容六千餘國安得有萬國乎禹平水土後每服更以五百里輔之里禹貢言五百里一服是堯舊更言三百二百里是禹所弼鄭以尚書之文上下相校至於禹貢厯數服名正合五千之數參之以周漢之域驗之於山川之圖則廣萬里為得其實王肅云禹之功在治山川不在廣土土地之廣三倍於堯而書傳無稱焉司馬遷以諸小數皆五百里服之别名大界與堯不殊得之矣晉志帝堯協和萬邦制八家為鄰三鄰為朋三朋為里五里為邑十邑為都十都為師州十有二師鄭玄曰州凡四十三萬二千家蓋虞夏之制顧野王云堯時制禹貢五服自侯服而外有百里二百三百里之别與周九畿何異禹貢一面言之率五百里為限周禮二面言之率二百五十里為限自鎮畿而內二畿而當一服蕃畿在九州之外所謂東漸西被朔南暨聲教也行人之言與周官六服合康誥注五服與禹貢異制舜十二州舜典肇十有二州咨十有二牧注禹治水之後舜分冀州為幽州並州分青州為營州始置十二州正義舜攝位元年九州始畢當是二年之後以境界太逺始别置之禹登王位還置九州益稷州十有二師史記注馬融曰禹平水土置九州舜以冀州之北廣大分置並州燕齊遼逺分燕置幽州分齊為營州於是為十二州舜紀十二牧行而九州莫敢辟違漢志堯遭洪水天下分絶為十二州禹平水土更制九州列五服與孔馬説異後郡國志注帝王世記曰堯遭洪水分為十二州今虞書是也及禹平水土還為九州今禹貢是也鄭玄曰舜以青州越海分齊為營冀州南北太逺分衛為並燕以北為幽禹貢正義營州即遼東也易氏周禮説曰孔安國以禹貢九州為堯之制遂謂治水分十二州非也舜典始言肇十二州次言咨牧然後命禹平水土其序可考班固之言所以發明置州之意夏氏曰周官有幽并而無徐梁爾雅有幽營徐而無梁青并若洪水之前有此名平水土之後豈至商周而猶存唐虞舊域舜山河疆界周九州地域六服王制凡九州千七百七十三國天子之元士諸侯之附庸不與注禹會諸侯於塗山執玉帛者萬國唯謂中國耳禹承堯舜而然要服之內地方七千里乃能容之夏衰夷狄內侵諸侯相并地減國少殷湯承之更制中國方三千里之界分為九州而建千七百七十三國周公復唐虞之舊域分其五服為九其要服之內亦方七千里而因殷諸侯之數廣其土增其爵孝經説曰周千八百諸侯布列五千里內正義謂治水之後舊域許慎以漢地考之自黑水至東海衡山之陽至朔方經略萬里周官六服羣辟注周禮九服此惟言六者夷鎮蕃在九州之外王者於夷狄羈縻而已不可同華夏六服惟言侯甸者二服去圻最近六年五服一朝周禮無此法孔以五服為侯甸男采衛蓋以要服逺不能常及期故不數大行人注六服去王城三千五百里相距方七千里公侯伯子男封焉周語先王規方千里以為甸服其餘以均分公侯伯子男使各有寧宇大司徒以天下土地之圖周知九州之地域廣輪之數注九州揚荆豫青兖雍幽冀并職方氏注周九州之界方七千里疏先王作土有三太平之時土廣萬里中國七千中平之世土廣七千中國五千衰末之世土廣五千中國三千晉志堯帝時禹平水土為九州虞舜登庸表提類而分區宇判山河而考疆域冀北創并部之名燕齊起幽營之號書所謂肇十有二州封十有二山也周成王時改作禹貢徐梁入於青雍冀野析於幽并職方均天下之土以周厥利保章辨九州之野皆有分星東南曰揚正南曰荆河南曰豫正東曰青河東曰兖正西曰雍東北曰幽河內曰冀正北曰并干寶晉紀論掩唐虞之舊域注賈捐之曰堯舜之盛地方不過數千里舜分置州域舜典正義史言舜既巡守復分置州域於禹治水後始分置十有二州每州以一大山為鎮殊大者十有二山深其州內之川使水通利黃唐經略萬國漢地理志敘自昔黃唐經略萬國燮定東西疆理南北左傳楚無宇曰天子經略諸侯正封古之制也人皇氏九州通鑑外紀人皇氏依山川土地之勢財度為九州謂之九囿各居其一而為之長人皇居中州以制八輔駕六羽乘雲車使風雨禹九州禹迹禹貢禹别九州舜十二州禹并為九冀帝都不説境界濟河兖海岱青海岱及淮徐淮海揚荆及衡陽荆荆河豫華陽黑水梁黑水西河雍林氏曰自兖而下八州皆以高山大川定逐州之疆界左傳虞人針茫茫禹迹畫為九州經啓九道左傳又曰夏貢金九牧後漢郡國志注帝王世紀曰堯遭洪水分為十二州今虞書是也及禹平水土還為九州今禹貢是也是以其時九州之地凡二千四百三十萬八千二十四頃定墾者九百一十萬八千二十四頃不墾者千五百萬二千頃民户千三百五十五萬三千九百二十三人至于塗山之會諸侯承唐虞之域執玉帛亦有萬國是以山海經稱禹使大章步自東極至于西垂二億二一作三萬三千五百里七十一步又使竪亥步南極盡于北垂二億三萬三千五百里七十五步亦見淮南陸形訓四海之內則東西二萬八千里南北二萬六千里出水者八千里受水者八千里名山五千二百五十山海經禹曰云云經六萬四千五十六里出銅之山四百六十七出鐵之山三千六百山海經云六百九十以供財用山海經名山五千三百七十神農之地過日月之表洎于高陽之地北至幽陵南暨交趾西蹈流沙東極蟠木是以制九州而建萬國堯遭洪水之患始分十二州與書及漢書不同逮湯受命存者三千餘國晉志大禹觀於濁河而受緑字寰瀛之內可得而言也天有七星地有七表天有四維地有四瀆八紘之外名為八極八極之廣東西二億三萬一千三百里南北二億三萬一千三百里自地至天半八極之數自下亦如之昔黃帝令竪亥步自東極至于西極五億十萬九千八百八步夏后氏窮竪亥所步莫不率俾於是九州之內作為五服尚書大傳夏成五服外薄四海孟諸靈龜隂谷元玉鄭玄注所貢物禹九州風俗禹貢錫土姓祗台德先不距朕行正義此一經皆史美禹功言九州風俗既同可以施其教化擇賢者共治之既言九州同風法壤成賦而四海之內路有逺近更敘弼成五服之事禹九州田賦九州山川貢賦夏采地冀田中中第五賦上上錯正賦第一雜出第二専先賦後田與八州異甸賦不出於田土白壤兖田中下第六賦貞與田相當土黑墳青田上下第三賦中上第四土白墳徐田上中第二賦中中第五土赤埴墳揚田下下第九賦下上上錯第七雜出第六土塗泥荆田下中第八賦上下第三土塗泥豫田中上第四賦錯上中第二雜出第一土惟壤下土墳壚梁田下上第七賦下中三錯第八雜出第七第九土青黎雍田上上第一賦中下第六土黃壤青徐雍本上豫冀兖分中唯有揚居下荆梁序亦同山淮之末流在兖江之末流在揚二州多水患梁地多故賦居下尤輕於揚故兖賦為正梁之賦輕於揚重於兖地青徐雍三州以上出中賦禹貢正義九州之次以治為先後水性下流治水皆從下為始冀州帝都於九州近北故首從冀起而東南次兖青南次徐揚從揚而西次荆從荆而北次豫從豫而西次梁從梁而北次雍雍地最高故在後每州之下言水路相通通向帝都之道九州差為九等傳以荆田第八賦第三為人功修雍田第一賦第六為人功少冀以上上為正而雜為次等少在正下故先言上上而後言錯豫少在正上故先言錯而後言上中揚變文言下上上錯梁之賦凡有三等以下中為正故言三錯多者為正少者為錯鄭玄云賦之差一井上上出九夫稅下下出一夫稅通率九州一井稅五夫餘州先田後賦冀州先賦後田諸州賦無下下兖賦為第九故變文為貞治水十三年乃有賦法始得貢賦與他州同也馬融曰禹治水三年八州平十二年而八州平十三年而兖平在舜受終之年衆土俱得其正謂壤墳壚貢賦從地而出分其土壤為上中下計其肥瘠舉其大較定為三品為貢賦之差細分三品以為九等故皆法三壤成九州之賦隋經籍志書録禹别九州定其山川分其圻界條其物産辨其貢賦貢法見貢賦類於冀州堯所都先施貢賦役載書梁雍無篚黃氏書説曰夏后氏五十而貢其賦法本名貢禹貢三砥績皆為與戎夷接界行中國貢法而見夷三種和夷出田賦與中國同故敘於賦上島萊淮夷入貢不出田賦故敘於貢下崑崙析支渠搜無貢節故又敘於貢道之下林氏曰九州賦稅計其出入之總數而多少比較有此九等冀之賦比九州為最多故為上上兖之賦比九州為最少故為下下其餘七州例皆如此非取民之制有此九等輕重之差又曰八州之貢揚荆最多兖雍最少九州之賦言錯者有四蓋制貢之時青徐雍荆所入之賦每得其常數惟此四州實有凶豐之年故其賦有雜出於它等者而兖州則曰作十有三載乃同是皆彼此相為髙下周官載師漆林之征二十而五周官以為征而此以為貢蓋周時豫州在畿內故載師掌其征而不以為貢禹時豫在畿外故有貢推此則知冀州不言貢之意唐孔氏云此九等所較無他諸州相凖為等級耳此計大率所得非止科定孟子言治地莫不善於貢林氏謂禹法既有每歲常數又有雜出他等之時凶不取盈無不善者切意後世子孫不善用之惟取必於每歲之常賦無有雜出之時或戰國重斂託貢法以文過禹法實不然也畿內之地天子之封內無所事於貢夏氏曰禹貢上言田賦篚之事而下言所以達都之道皆以達于河為至蓋達于河則達于帝都也秦少遊曰今之沃壤莫如吳越閩蜀古揚梁州也按禹貢揚田第九梁田第七皆在下等之中夏本紀禹開九州通九道陂九澤度九山禹行相地宜所有以貢及山川之便利禹行自冀州始詩正義禹貢九州之賦法凡有九等漢書坤作地藝高下九等大司徒注王制曰天子之縣內方百里之國九云云此蓋夏時采地之數疏殷周皆稱畿內王制云縣內疑是夏時史貨殖傳關中自汧雍以東至河華膏壤沃野千里自虞夏之貢以為上田春秋正義堯治平陽舜治蒲阪禹治安邑三都相去各二百餘里俱在冀州王制方一里者為田九百畝一里方三百步方十里者為方一里者百為田九萬畝方百里者為方十里者百為田九十億畝方千里者為方百里者百為田九萬億畝正義九萬億畝當云九千億畝此論間方之法西不盡流沙南不盡衡山東不盡東海北不盡恆山凡四海之內斷長補短方三千里為田八十萬億一萬億畝九州之大計方百里者為田九十億畝山林川澤溝瀆城郭宫室塗巷三分去一其餘六十億畝以一大國為率其餘所以授民也孟子夏后殷周之盛地未有過千里者也注三代之盛封畿千里耳禹萬國千八百國又見封爵益稷禹曰弼成五服至于五千州十有二師外薄四海咸建五長各迪有功劉敞曰十長之師凡五十國一州十二師則六百國也州六百國計十二州則七千二百國也十二州之外薄于四海又有五長是以禹會諸侯於塗山執玉帛者萬國也左傳禹合諸侯於塗山執玉帛者萬國注諸侯執玉附庸執帛正義禹會諸侯諸國盡至附庸從其所附之國共見天子故有執帛者鄭玄注尚書以為數正滿萬國每一師領百國每州千二百國畿外八州總九千六百國其餘四百國在畿內尚書傳云百里之方三為國七有竒以百里之方一為百里之國一又以百里之方一為七十里之國二有竒吕氏春秋禹疏河決江為彭蠡之障乾東土所活者千八百國書曰堯正萬邦堯典協和萬邦詩曰綏萬邦是殷周之時皆萬國禹四極眺錯傳大禹勤求賢士施及方外四極之內舟車所至人迹所及靡不聞命爾雅東至於泰逺西至於邠國南至於濮鉛北至於祝栗謂之四極皆四方極逺之國觚竹北户西王母日下謂之四荒九夷八狄七戎八蠻謂之四海岠齊州以南戴日為丹穴北戴斗極為空桐東至日所出為太平西至日所入為太蒙釋地已下皆禹所名殷九州書以有九有之師詩九有有截奄有九有帝命式于九圍爾雅兩河間曰冀河南曰豫濟東曰徐河西曰雍漢南曰荆江南曰揚燕曰幽濟河間曰兖齊曰營注殷制周禮疏云似夏法釋文禹貢有青徐梁而無并幽營爾雅有徐幽營而無青梁并職方有青幽并而無徐梁營三代不同故也殷有舜之幽營徐而無舜之青梁并是青入於徐梁入於雍并入於冀也既分禹貢冀之境而復舜之幽又併青於徐而復舜之營殷之九州粲然可考李郭以為毁制周又分冀為并而併營於幽復禹之青而省徐以入青職方視夏殷不同此損益之制詩譜雍梁荆豫徐揚之民咸被其化周禮疏云禹貢所云堯舜法爾雅所云似夏法詩譜所云似殷法賈捐之傳武丁成王殷周之大仁也然地東不過江黃西不過氐羌南不過蠻荆北不過朔方是以頌聲並作殷九州建國王制凡四海之內九州州方千里州建百里之國三十七十里之國六十五十里之國百有二十凡二百一十國名山大澤不以封其餘以為附庸間田八州州二百一十國鄭注此殷制也天子之縣內注縣內夏時天子所居州界名殷曰畿方百里之國九七十里之國二十有一五十里之國六十有三凡九十三國名山大澤不以肦其餘以祿士以為間田凡九州千七百七十三國天子之元士諸侯之附庸不與鄭注此殷所建天子百里之內以共官千里之內以為御千里之外設方伯五國以為屬屬有長十國以為連連有帥三十國以為卒卒有正二百一十國以為州州有伯注殷州長曰伯八州八伯畿內之州不置伯有鄉遂之吏主之五十六正百六十八帥三百三十六長八伯各以其屬屬於天子之老二人分天下為左右曰二伯千里之內曰甸甸謂服治田千里之外曰采注九州之內也曰流注九州之外也天子使其大夫為三監監於方伯之國國三人天子之縣內諸侯祿也外諸侯嗣也正義殷制中國方三千里書正義爾雅釋地九州之名於禹貢無梁青而有幽營孫炎疑是殷制戰國䇿顏斶曰大禹之時諸侯萬國及湯之時諸侯三千今乃二十四論語摘輔象曰兖豫屬上台九州繫於三台荆揚屬下級上之下等一台各有上下梁雍屬中上中台之上冀州屬錯中台之下下台之上青州屬下土下台之上徐州屬下下下台之下周書郊甸方六百里因四土為方千里分以百縣縣有四郡郡有鄙鄙不過百室以便野事周九州疆界職方疆域夏官量人掌建國之法以分國為九州注定天下之國分也疏謂分諸侯之國為九州假令土廣萬里中國七千方千里者四十九七七四十九其一為畿內其餘四十八八州各得方千里者六是為九州至於中平通夷狄七千中國五千衰世通夷狄五千中國三千分國為九州州各有疆界故詩云帝命式於九圍是州各有圍限也地官小司徒分地域注謂建邦國造都鄙制鄉遂疏各有營域逺近疆界畿外邦國畿內都鄙及六鄉六遂雖不言公邑地域之中亦有四等公邑可知禮象曰鄭氏謂周公斥大九州之界方七千里此讀周官之誤也蓋禹貢言面周官言方言方則外各二百五十里非一面五百里也後魏地形志夏書禹貢周氏職方中畫九州外薄四海析其物土制其疆域此蓋王者之規模也吕氏春秋河漢之間為豫周也兩河之間為冀晉也河濟之間兖衛也東方為青齊也泗上為徐魯也東南為揚越也南方為荆楚也西方為雍秦也北方為幽燕也伏湛傳文王受命征伐五國注伐犬夷密須耆邘音于崇周九州封域禮太宰九兩一曰牧以地得民注牧州長也九州各有封域以居民也周九州星土漢分壄保章氏中士一人下士四人世守天文之變以星土辨九州之地所封封域皆有分星以觀妖祥注星土星所主土也鄭司農謂春秋傳參為晉星商主大火國語歲之所在則我有周分野之屬是也玄謂星亦有分其書亡堪輿雖有郡國所入度非古數也今其存可言者十二次之分也星紀吳越玄枵齊娵訾衛降婁魯大梁趙實沈晉鶉首秦鶉火周鶉尾楚夀星鄭大火宋析木燕大司徒以土宜之法辨十有二土之名物注分野十二邦上繫十二次甘石分十二分野張衡蔡雍以配漢州縣班固以二十八宿配之東井輿鬼為秦自弘農故關以西暨牂柯越嶲益州皆屬焉自井十度至桞三度謂之鶉首之次秦分也桞七星張為周自河南雒陽穀城平隂暨緱氏皆屬焉初雒邑與宗周通封畿東西長而南北短短長相覆為千里自栁三度至張十二度謂之鶉火之次周分也角亢氐韓之分壄自南陽暨新安宜陽皆屬焉陳鄭星分同之井六度至亢六度謂之夀星之次鄭與韓同分陳則大昊之虛也尾箕為燕自漁陽右北平及勃海之安次皆屬焉危四度至斗六度謂之析木之次燕分也大略與保章星土之分同觜觽參魏之分壄自高陵以東至陽武酸棗卷屬之昴畢趙之分壄自信都真定至五原上黨屬之虛危為齊東有災川西及平原奎婁為魯東至東海南至泗水宋之分曰房心今沛梁及須昌夀張也衛之分曰室壁今東郡魏郡黎陽至野王朝歌也翼軫為楚南郡至汝南皆其分斗為吳會稽至臨淮皆其分牛女為粵蒼梧鬱林暨南海日南皆其分也出地理志費直易蔡雍月令頗有先後陳卓言所入宿度皇甫謐世紀有黃帝推分星次一行山河兩戒職方氏疏周之兖州於禹貢侵青徐之地周之青州於禹貢侵豫州之地周之雍豫於禹貢兼梁州之地周之冀州小於禹貢時冀州以北有幽并故也周無徐梁禹貢無幽并揚禹貢先冀治水自下始周禮先尊陽方晉志春秋元命包云五星流為兖鉤鈐星别為豫昴畢散為冀箕星散為幽營室流為并參伐流為益虛危流為青天氐流為徐軫星散為荆牽牛流為揚春秋文耀鉤云北斗七星主九州吕氏春秋天有九野地有九州賈捐之曰殷周地東不過江黃西不過氐羌南不過蠻荆北不過朔方周四衛巾車革路以即戎封四衛注四方諸侯守衛者蠻服以內疏庶姓在四方六服以內七國形勢秦四塞之國被山帶渭東有關河西有漢中南有巴蜀北有代馬此天府也燕東有朝鮮遼東北有林胡樓煩西有雲中九原南有滹沱易水地方二千餘里南有碣石鴈門之饒所謂天府也趙地方二千餘里西有常山南有河漳東有清河北有燕國韓北有鞏洛成臯之固西有宜陽商阪之塞東有宛穰洧水南有陘山地方九百餘里魏南有鴻溝陳汝南許郾昆陽召陵舞陽新都新郪東有淮潁煮棗無胥西有長城之界北有河外卷衍酸棗地方千里齊南有泰山東有琅邪西有清河北有渤海此四塞之國也地方二千餘里楚西有黔中巫郡東有夏州海陽南有洞庭蒼梧北有陘塞郇陽地方五千餘里竊以天下地圖案之諸侯之地五倍於秦料度諸侯之卒十倍於秦蘇秦云史十二諸侯表齊晉秦楚其在成周微甚封或百里或五十里晉阻三河齊負東海楚介江淮秦因雍州之固四國迭興更為伯主文武所褒大封皆威而服焉賈捐之曰秦務欲廣地然地南不過閩粵北不過大原秦分三十六郡史年表始皇二十六年初併天下二十七年分為三十六郡三十三年為桂林南海象郡以適戍西北取戎為四十四縣又云二十四縣始皇紀賈生曰南取北越之地以為桂林象郡使蒙恬北築長城而守藩籬却胸奴七百餘里漢南粵傳秦併天下略定揚粵置桂林南海象郡閩粵傳閩粵王無諸粵東海王搖秦廢為君長以其地為閩中郡理道要訣秦置四十郡通典秦制天下為四十郡其地則西臨洮而北沙漠東縈南帶皆臨大海漢高祖置郡紀二年十月申陽降置河南郡三月虜殷王卬置河內郡六月雍州定八十餘縣置河上渭南中地隴西上郡師古曰凡新置五郡九月定魏地置河東太原上黨郡三年十月獲趙王歇置常山代郡十一年正月詔曰代之雲中以西為雲中郡漢新置郡國晉志始皇削罷列侯分天下為三十六郡郡置守尉監二十六年初并天下三川即漢三河高帝更名河南河東三川河東在諸郡之首所以陪輔關中也南陽南郡九江鄣郡武帝更名丹陽會稽潁川碭郡即梁泗水即沛薛郡即魯東郡琅邪齊郡上谷漁陽右北平遼西遼東代郡巨鹿邯鄲即趙上黨九原武帝更名五原雲中太原鴈門上郡隴西北地漢中巴郡蜀郡黔中即武陵長沙凡三十五郡與內史為三十六郡師古曰京畿所統時號內史言在內以别諸郡守説文秦初置三十六郡以監其縣於是興師踰江平取百越又置閩中南海桂林象郡凡四十郡郡一守焉其地則西臨洮而北沙漠東縈西帶皆臨大海漢祖龍興革秦之弊分內史為三部更置郡國二十有三增郡十八以郡為國四肇建國名四合二十六桂陽江夏豫章河內魏郡東海應劭曰秦郯郡楚國平原梁國定襄泰山汝南淮陽千乘東萊燕國清河信都常山中山渤海廣漢涿郡合二十三也三內史者河上渭南中地也地理志曰高祖增二十六武帝改河上渭南中地以為京兆馮翊扶風是為三輔文增厥九廣平城陽淄川濟南膠西膠東河間廬江衡山武帝改衡山曰六安景加其四濟北濟隂山陽北海也宣改濟北曰東平武帝開越攘胡初置十七南海蒼梧鬱林合浦交趾九真日南珠崖儋耳九郡平西南夷置牂柯越巂沈黎汶山犍為益州六郡西置武都郡又分立零陵合十七郡食貨志初郡十七晉灼注同拓土分疆又增十四弘農臨淮西河朔方酒泉陳留安定天水玄菟樂浪廣陵燉煌武威張掖昭帝少事又增其一金城也至平帝元始二年凡新置郡國七十有一與秦四十合一百一十有一改雍曰涼改梁曰益又置徐州復夏舊號南置交趾北有朔方凡為十三部涼益荆揚青豫兖徐幽并冀十一州交趾朔方二刺史合十三部志云郡國百三郡八十三國二十光武投戈之歲在雕耗之辰郡國蕭條并省者八城陽淄川高密膠東六安真定泗水廣陽建武十一年一云十八年省牧復為刺史員十三人各掌一州明帝置一永昌也章帝置二任城吳郡和順改作其名有九和置濟北廣陽順改淮陽為陳改楚為彭城濟東為東平臨淮為下邳千乘為樂安信都為安平天水為漢陽省朔方刺史合之於司隸凡十三部注其與西漢不同者司隸校尉部治河南朔方隸於并州部而郡國百有八焉注省前漢八分置五改舊名七因舊九十六少前漢三也續志云郡國百五桓靈頗增於前復置六郡桓高陽高涼博陵靈南安鄱陽廬陵續志巴郡注初平六年分巴為二郡欲得巴舊名以墊江為治安漢以下為永寧郡建安六年以永寧為巴東郡墊江為巴西郡前紀昭帝始元五年六月罷儋耳真畨元鳯五年秋罷象郡宣帝地節三年省文山郡并蜀元帝初元三年春罷珠崖唐李吉甫曰漢初治郡不過六十而文景化幾三王漢開置郡國新置五郡志秦分天下為郡縣左傳克敵者上大夫受縣下大夫受郡注周書作雒篇曰千里百縣縣有四郡春秋時郡屬於縣戰國時縣屬於郡周顯王四十一年魏納上郡十五縣于秦後十餘年秦紀始書置漢中郡釋文縣方百里郡方五十里守後漢左雄曰秦剗革五等更立郡縣縣設令長郡置尉通典秦制天下為四十郡漢本秦京師為內史分天下作三十六郡漢興以其郡太大稍復開置又立諸侯王國高紀二年六月定雍州八十餘縣置河上渭南中地隴西上郡師古曰凡新置五郡服虔曰河上左馮翊渭南京兆中地扶風武帝開廣三邊故自高祖增二十六文景各六武帝二十八昭帝一見上訖於孝平凡郡國一百三縣邑千三百一十四道三十一侯國二百四十一百官表凡縣道國邑千五百八十七鄉六千六百二十二亭二萬九千六百三十五地東西九千三百二里南北萬三千三百六十八里提封田一萬萬四千五百一十三萬六千四百五頃其一萬萬二百五十二萬八千八百八十九頃邑居道路山川林澤羣不可墾其三千二百二十九萬九百四十七頃可墾定墾田八百二十七萬五百三十六頃民户千二百二十三萬三千六百二口五千九百五十九萬四千九百七十八漢極盛矣成帝時劉向略言其地分丞相張禹使屬潁川朱贛條其風俗猶未宣究故輯而論之終其本末著於篇後郡國志承秦三十六郡縣邑數百後稍分析至于孝平凡郡國百三縣邑道侯國千五百八十七世祖中興惟官多役煩乃命并合省郡國十縣邑道侯國四百餘所應劭漢官曰世祖中興海內人民可得而數裁十二三邊陲蕭條靡有孑遺障塞破壞亭隧絶滅建武二十二年始遣中郎將馬援謁者分築𤇺候堡壁稍興立郡縣十餘萬户或空置太守令長招還人民上笑曰今邊無人而設長吏治之難如春秋素王矣乃建營屯田殖穀弛刑謫徒以充實之至明帝置郡一章帝置郡國二和帝置三安帝又命屬國别領比郡者六又所省縣漸復分置至于孝順凡郡國百五縣邑道侯國一千一百八十東觀書曰永興元年鄉三千六百八十二亭萬二千四百四十三一作二十民户九百六十九萬八千六百三十口四千九百一十五萬二百二十諸侯表齊分為七趙分為六梁分為五淮南分為三朱博奏漢家至德溥大宇內萬里立置郡縣云云秦孝公十二年聚小都鄉邑為一十一縣置令丞此慶都邑為郡縣之始也枚乘諫吳王曰漢并二十四郡十七諸侯燕王上書曰孝武增郡數十斥地且倍嚴安上書曰今外郡之地或幾千里列城數十形束壤制帶脅諸侯非宗室之利也晉志光武中興不踰前制東海王強以去就有禮優以大封兼食魯郡二十九縣其餘稱為寵錫者兼一郡而已隋志昭宣之後罷戰務農户口既已滋多郡縣亦有增置漢山川不出禹貢分域而里數倍加古今尺步不同耳漢同姓九國史諸侯表漢興序二等高祖子弟同姓為王者九國徐廣曰齊楚荆淮南燕趙梁代淮陽索隱曰不數吳蓋以荆絶乃封吳故也下文所列有十國以長沙異姓故言九國唯獨長沙異姓而功臣侯者百有餘人自鴈門太原以東至遼陽為燕代國常山以南太行左轉渡河濟阿甄以東薄海為齊趙國自陳以西南至九疑東帶江淮穀泗薄會稽為梁楚吳淮南長沙國皆外接於胡越而內地北距山以東盡諸侯地大者或五六郡連城數十漢獨有三河東郡潁川南陽自江陵以西至蜀北自雲中至隴西與內史凡十五郡而公主列侯頗食邑其中云云天子觀於上古然後加惠使諸侯得推恩分子弟國邑故齊分為七城陽濟北濟南災川膠西膠東趙分為六河間廣川中山常山清河梁分為五濟陽濟川濟東山陽淮南分三廬江衡山及天子支庶子為王王子支庶為侯百有餘焉吳楚時前後諸侯或以適削地是以燕代無邊郡吳淮南長沙無南邊郡齊趙梁楚支郡名山陂海咸納於漢諸侯稍微大國不過十餘城小侯不過數十里上足以奉貢職下足以供養祭祀以藩輔京師而漢郡八九十形錯諸侯間犬牙相臨秉其厄塞地利強本幹弱枝葉之勢也形勢雖強要之以仁義為本楚都彭城六年正月丙午初王交齊都臨災六年正月甲子初王肥荆都吳六年正月丙午初王賈十二年更為吳國十月辛丑初王濞淮南都夀春十一年十二月庚午王長燕都薊十二年二月甲午初王建趙都邯鄲九年初王如意梁都雎陽十一年三月丙午初王恢淮陽都陳十一年三月丙寅初王友代都中都十一年二月丙子初王文帝漢功臣八國漢書贊曰高祖定天下功臣異姓而王者八國張耳趙吳芮長沙彭越梁黥布淮南臧荼燕盧綰與兩韓信楚韓咸得裂土唯吳芮傳號五世慶流支庶著于甲令而稱忠盧綰傳時諸侯非劉氏而王者七人上欲王綰乃立為燕王漢三河史貨殖傳昔唐人都河東殷人都河內周人都河南夫三河在天下之中若鼎足王者所更居也建國各數百千歲土地小狹民人衆都國諸侯所聚會故其俗纖儉習事地理志河東郡秦置縣二十四河內郡高帝二年更名縣十八河南郡故秦三川郡高帝更名縣二十二天文志柳七星張三河五行志三代居三河河洛出圖書注夏都安邑即河東殷都朝歌即河內周都洛陽即河南帝紀高帝二年十月置河南郡三月置河內郡告諸侯曰悉發關中兵收三河士韋昭曰河南河東河內也南浮江漢以下九月置河東郡昭帝始元元年夏有司請河內屬冀州河東屬并州師古曰蓋屬京師司隸所部宣帝神爵元年三月發三河材官詣金城元帝建昭二年三月益三河大郡太守秩户十二萬為大郡光武紀贊三河未澄諸侯王表天子自有三河百官表司隸校尉察三輔三河弘農東方朔傳漢興去三河之地止霸産以西都涇渭之南劉歆為河內太守以宗室不宜典三河徙守五原田仁為丞相長史請先刺舉三河杜周兩子夾河為郡守河東太守劉祐政為三河表河內太守魏少英政稱三河表後漢漢地分風俗本末風俗輯論志漢承百王之末國土變改民人遷徙成帝時劉向略言地分一本作域分丞相張禹使屬潁川朱贛條其風俗猶未宣究故輯而論之終其本末著于篇井鬼之於秦觜參之於魏柳星張之於周角亢氐之於韓陳鄭胃昴畢之於趙尾箕之於燕女虛危之於齊奎婁之於魯房心之於宋室壁之於衛翼軫之於趙斗牛之於吳粵是其地分也民之剛柔緩急繫于水土謂之風好惡取舍隨于君上謂之俗聖王必移其本易其末酆鎬務本由文武晉之深思本唐堯衛有康叔之風朝鮮有箕子之化齊之經術魯之好學則太公周公之教宋之重厚則舜湯之澤此風俗之本也秦俗不純魏俗剛強周魯失之偽陳失之巫鄭衛之俗淫而剛燕趙之俗悍而離魏薄於恩晉過於嗇楚􅏽於利齊有魚鹽而俗侈吳粵好勇而民輕死此風俗之末也涼州有寬厚之政則俗有和氣之應巴蜀廣漢被文翁之化變譏刺為文章潁川南陽被召父黃韓之化易商賈為本業轉爭訟為篤厚所謂君子之德風小人之德草也黃支之南譯使自此反矣匡衡傳上疏曰竊考國風之詩周南召南被賢聖之化深故篤於行而亷于色鄭伯好勇而國人暴虎秦穆貴信而士多從死陳夫人好巫而民淫祀晉侯好儉而民蓄聚太王躬仁邠國貴恕治天下者審所上而已道德之行由內及外自近者始然後民知所法水經注漢官曰秦用李斯議分天下為三十六郡几郡或以列國陳魯齊吳是也或以舊邑長沙丹陽是也或以山陵太山山陽是也或以川原西河河東是也或以所出金城城下得金酒泉泉味如酒豫章樟木生庭鴈門鴈之所育是也或以號令禹合諸侯大計東冶之山會計國名會稽是也漢五屬國安定上郡天水五原張掖見官制鏤蔽空之山梁無涯之水鳥竄單于於瀚海之背南置交趾北置朔方之州天地之間一為寧宇漢蒼海郡又見下武紀元朔元年秋東夷薉君南閭等口二十八萬人降為蒼海郡三年春罷蒼海郡平紀元始四年冬置西海郡後西羌傳云王莽輔政令譯諷諸羌獻西海之地初開以為郡築五縣邊海亭隧相望永元十四年時西海及大小榆谷左右無復羌寇隃麋相曹鳯上言宜及此時建復西海郡縣規固二榆廣設屯田隔塞羌胡交關之路拜鳯為金城西部都尉屯龍耆食貨志彭吳穿穢貊朝鮮置滄海郡東置滄海郡人徒之費疑注讀曰擬於南夷漢朔方五原郡紀元朔元年秋東夷薉君南閭服虔曰薉貊在辰韓之北髙麗沃沮之南等口二十八萬人降為蒼海郡二年春正月收河南地置朔方五原郡三年春罷蒼海郡秋罷西南夷城朔方城五年春大將軍衛青出朔方元鼎六年秋遣浮沮將軍公孫賀出九原元封元年冬十月詔曰行自雲陽北歷上郡西河五原出長城北登單于臺至朔方臨北河志朔方郡元朔二年開西部都尉治窳渾户三萬四千三百三十八口十三萬六千六百二十八縣十三封沃壄元狩三年城臨戎五年城五原郡秦九原元朔二年更名東部都尉治棝陽户三萬九千三百二十二口二十三萬二千三百二十八縣十六公孫弘傳弘為御史大夫時東置蒼海北築朔方郡弘數諫以為罷弊中國奉無用之地上使朱買臣等難弘置朔方之便發十䇿弘不得一謝曰不知其便願罷西南夷蒼海専奉朔方許之主父偃傳偃為中大夫盛言朔方地肥饒外阻河蒙恬城以逐胸奴內省轉輸戍漕廣中國滅胡之本也上覽其説下公卿議皆言不便公孫弘曰秦時嘗發三十萬衆築北河終不可就已而棄之朱買臣難詘弘遂置朔方本偃計也詳見城食貨志衛青歲以數萬騎出擊胸奴遂取河南地築朔方又興十餘萬人築衛朔方光武紀建武十一年省朔方牧并并州注朔方郡在今夏州朔方縣北漢西域四郡又見下紀元狩二年秋胸奴昆邪王殺休屠王來降置五屬國處之以其地為武威志休屠地太初四年開户萬七千五百三十一口七萬六千四百十九縣十今涼州酒泉郡志太初元年間戶萬八千一百三十七口七萬六千七百二十六縣九今肅州以胸奴傳西置酒泉郡隔絶胡與羌通之路元鼎六年秋分武威酒泉地置張掖志昆邪地太初元年開户二萬四千三百五十二口八萬八千七百三十一縣十注張國臂掖故曰張掖燉煌郡志後元年分酒泉置户萬一千二百口三萬八千三百三十五縣六徙民以實之昭紀始元六年秋七月以邊塞闊逺取天水隴西張掖郡各二縣置金城郡志始元六年置戶三萬八千四百七十口十四萬九千六百四十八縣十三里趙充國傳候四望狹文穎曰金城有三狹在南六百師古曰山峭夾水曰狹光武紀建武十二年省金城郡屬隴西十三年復置金城郡班固西域傳贊孝武圖制胸奴患其兼從西國結黨南羌表河曲列四郡開玉關通西域斷胸奴右臂隔越南羌月氏胸奴失援幕南無王庭本傳列四郡據兩關焉地理志自武威以西本昆邪休屠王地武帝時攘之初置四郡以通西域鬲絶南羌胸奴習俗頗殊地廣民稀張騫傳其秋渾邪王降而金城河西並南山至鹽澤空無胸奴漢始築令居以西縣名屬金城初置酒泉郡以通西北國因發使抵安息奄蔡犛靬條支身毒國漢既滅越蜀所通西南夷皆震請吏置牂柯越巂益州沈黎文山郡欲地接以前通大夏乃遣使歲十餘輩出此初郡文山以上初置者嚴助傳征伐四夷開置邊郡周禮職方疏夷狄中漢時不置郡國惟置校尉掌之漢河西四郡又見下西域傳降渾邪休屠王遂空其地始築令居以西初置酒泉郡分置武威張掖燉煌列四郡接西域焉贊孝武表河曲列四郡地理志自武威以西本胸奴昆邪休屠王地武帝時攘之初置四郡以通西域鬲絶南羌胸奴霍去病傳開河西酒泉之地西方益少胡寇後西羌傳武帝北卻胸奴西逐諸羌乃度河湟築令居塞初開河西列置四郡臧宫馬武建武二十七年上書曰發河西四郡天水隴西羌胡擊其右北虜之滅不過數年陳忠上疏曰孝武開河西四郡以隔絶南羌班勇傳遣張明將河西四郡兵注金城燉煌張掖酒泉梁慬傳永初二年春羌豪三百餘人降河西四郡復安漢河西五郡晉志秦美陽甘泉宫本胸奴鑄金人祭天之處胸奴既失甘泉使休屠渾邪王等居涼州之地二王降漢漢置張掖酒泉燉煌武威郡後又置金城謂之河西五郡改雍為涼州獻帝時合關右以為雍州竇融傳行河西五郡大將軍事以梁統為武威史苞為張掖竺曽為酒泉辛彤為燉煌庫鈞為金城太守及隴西平詔融與五郡太守奏事京師漢初郡十七南越九郡西南夷五郡食貨志漢連出兵三歲誅羌滅兩粵番禺以西至蜀南者置初郡十七注晉灼曰元鼎六年定越地以為南海蒼梧鬱林合浦交趾九真日南珠崖儋耳郡定西南夷以為武都牂柯越巂沈黎汶山郡及地理志西南夷傳所置犍為零陵益州郡凡十七且以其故俗治無賦稅南陽漢中以往各以地比給初郡而初郡又時時小反漢發南方吏卒往誅之間歲萬餘人費皆仰大農大農以均輸調鹽鐵助賦故能淡之云云其明年元封元年食貨志又曰武帝即位數年嚴助朱買臣等招徠東甌事兩粵唐蒙司馬相如始開西南夷鑿山通道千餘里以廣巴蜀又通西南夷道作者數萬人南海郡志秦置元鼎六年開屬交州户萬九千六百十三口九萬四千二百五十三縣六後漢南蠻傳秦并天下始開領外置南海桂林象郡蒼梧郡志元鼎六年開屬交州户二萬四千三百七十九口十四萬六千一百六十縣十鬱林郡志秦桂林郡元鼎六年開屬交州户萬二千四百十五口七萬一千百六十二縣十二合浦郡志元鼎六年開屬交州户萬五千三百九十八口七萬八千九百八十縣五交址郡志元鼎六年開屬交州户九萬二千四百四十口七十四萬六千二百三十七縣十九真郡志元鼎六年開户三萬五千七百四十三口十六萬六千十三縣七後漢南蠻傳光武中興錫光為交址任延守九真導之禮義安帝永初元年九真徼外夜郎蠻夷舉土內屬開境千八百四十里注引南中八郡志日南郡志秦象郡元鼎六年開屬交州户萬五千四百六十口六萬九千四百八十五縣五師古曰言其在日之南珠崖郡志不録元鼎六年開武紀注臣瓚曰茂陵書珠崖郡治瞫都去長安七千三百一十四里元紀初元三年春罷珠崖郡賈捐之傳初武帝征南越元封元年立儋耳珠崖郡皆在南方海中洲居廣袤可千里合十六縣户二萬三千餘應劭曰二郡在大海中崖岸出珠故曰珠崖儋耳者種大耳渠率自謂王者耳尤緩下肩三寸張晏曰異物志二郡在海中東西千里南北五百里珠崖言珠若崖儋耳鏤其頰皮上連耳分為數支狀似雞腸纍耳下垂其民暴惡自初為郡至昭帝始元元年二十餘年間凡六反叛至五年罷儋耳郡并屬珠崖宣神爵三年珠崖三縣反甘露元年九縣反擊定之元帝初元元年又反發兵擊之連年不定捐之建議不當擊上使侍中王商詰問捐之對曰秦興兵逺攻務欲廣地然地南不過閩越北不過太原而天下潰畔孝武西連諸國至于安息東過碣石以元菟樂浪為郡北卻胸奴萬里更起營塞制南海以為八郡臣以為非冠帶之國禹貢所及春秋所治皆可無以為願遂棄珠崖丞相于定國以為議是上從之珠崖由是罷唐狄仁傑曰宣用魏相之策而棄車師之田元納賈捐之之䇿而罷珠崖之郡十杜佑理道要訣云朱崖為郡凡六五歲而罷儋耳郡志不録元鼎六年開詳見珠崖武紀注臣瓚曰茂陵書儋耳去長安七千三百六十八里領縣五昭紀始元五年六月罷儋耳真畨郡後漢傳云罷臨屯武都郡志元鼎六年開户五萬一千三百七十六口二十三萬五千五百六十縣九牂柯郡志元鼎六年開屬益州户二萬四千二百十九口十五萬三千三百六十縣十七越巂郡志元鼎六年開屬益州户六萬一千二百八口四十萬八千四百五縣十五沈黎郡志不録元鼎六年開武紀注臣瓚曰茂陵書沈黎治笮都去長安三千三百三十五里領縣二十一後漢莋都夷傳武帝所開以為莋都縣元鼎六年以為沈黎郡至天漢四年并蜀為西部置兩都尉一居旄牛主徼外夷一居青衣主漢人輿地廣記云沈黎漢武置郡既而罷之黃霸入穀沈黎郡文山郡志不録元鼎六年間武紀注應劭曰今蜀郡岫山本冉駹是也宣紀地節三年十二月省文山郡并蜀後漢冉駹夷傳武帝所開元鼎六年以為汶山郡至地節三年省并蜀郡為北部都尉靈帝時復分蜀郡北部為汶山郡犍為郡志建元六年開屬益州故夜郎國户十萬九千四百十九口四十八萬九千四百八十六縣十二西南夷傳建元六年大行王恢擊東粵粵人食唐蒙蜀枸醬蒙歸上書説通夜郎道乃拜蒙以郎中將元光五年將七人從巴莋關入見夜郎侯多同諭以德威約為置吏夜郎旁小邑貪繒帛聽蒙約乃以為犍為郡發巴蜀卒治道自僰道指牂柯江司馬相如亦言西夷邛莋可置郡使相如以郎中將往諭皆如南夷為置一都尉十餘縣數歲道不通上使公孫弘往視還言不便罷西夷獨置南夷兩縣一都尉益州郡志元封二年開屬益州故滇王國户八萬一千九百四十六口五十八萬四百六十三縣二十四西南夷傳使王然于以粵破及誅南夷兵威風諭滇王入朝滇王降以為益州郡賜玉印復長其民零陵郡志元鼎六年置屬荆州户二萬一千九十二口十三萬九千三百七十八縣十武紀元鼎六年冬十月將幸緱氏至左邑桐鄉聞南越破以為聞喜縣春至汲新中鄉得以嘉首以為獲嘉縣遂定越地為南海蒼梧鬱林合浦交址九真日南珠崖儋耳郡南粵傳南粵已平遂以其地為儋耳珠崖南海蒼梧鬱林合浦交址九真日南九郡征西南夷平之為武都牂柯越巂沈黎文山郡西南夷傳平南夷為牂柯郡夜郎入朝邛君并殺莋侯冉駹震恐請臣置吏以邛都為粵巂郡莋都為沈黎郡冉駹為文山郡廣漢西白馬為武都郡張騫傳是時漢既滅越蜀所通西南夷皆震請吏置牂柯越嶲益州沈黎文山郡欲地接以前通大夏乃遣使歲十餘輩出此初郡皆復閉昆明後復遣使竟不得通注師古曰文山以上初置者地理志武帝攘却胡越開地斥境南置交址北置朔方之州注師古曰胡廣記云漢既定南越之地置交址刺史别於諸州令持節治蒼梧分雍州置朔方刺史夏侯勝傳宣帝詔曰孝武躬仁誼厲威武北征胸奴單于逺遁南平氐羌昆明甌駱兩越東定薉貊朝鮮立郡縣百蠻率服欵塞自至紀元封元年冬十月詔曰東越險阻反覆遷其民於江淮間遂空其地西域贊孝武睹犀布玳瑁則建珠崖七郡感枸醬竹杖則開牂柯越嶲聞天馬蒲陶則通大宛安息劉歆議孝武南滅百粵起七郡北攘胸奴降昆邪十萬之衆置五屬國起朔方東伐朝鮮起元菟樂浪以斷胸奴之左臂西伐大宛并三十六國結烏孫起燉煌酒泉張掖以鬲婼羌裂胸奴之右臂單于逺遁四垂無事斥地逺境起十餘郡終軍曰大將軍秉鉞單于奔幕票騎抗旌昆邪右袵是澤南洽威北暢也嚴安曰今徇南夷朝夜郎降羌僰略薉州建城邑深入胸奴燔其龍城漢朝鮮四郡紀元封三年夏朝鮮降以其地為樂浪志三年開戶六萬二千八百十二口四十萬六千七百四十八縣二十五屬幽州臨屯臣瓚曰茂陵書治東𤭔去長安六千一百三十八里十五縣年後漢傳云昭帝始元五罷臨屯玄菟志四年開户四萬五千六口二十二萬一千八百四十五縣三真畨郡茂陵書治霅縣去長安七千六百四十里十五縣始元五年六月罷真畨郡朝鮮傳定朝鮮為四郡三方之開皆自好事之臣西南夷發於唐蒙司馬相如兩粵起嚴助朱買臣朝鮮由涉何漢十三部武紀元封五年初置刺史部十三州在夏四月之後注師古曰漢舊儀云初分十三州假刺史印綬有常治所常以秋分行部御史為駕四封乘傳到所部郡國各遣一吏迎之界上所察六條紀元鼎四年詔祭地冀州大事記曰十三部河東汾隂屬司隸是時未分十三部以禹九州言之故屬冀州地理志武帝攘卻胡越開地斥境南置交址北置朔方之州注師古曰胡廣記云漢既定南越之地置交址刺史别於諸州令持節治蒼梧分雍州置朔方刺史復通典交址後為交州朔方後屬并州