虜單于聞之引去注師古曰五原朔方雲中代郡鴈門定襄右北平上谷漁陽四萬騎分屯而充國總統之後漢延熹元年十二月南胸奴諸部與烏丸鮮卑寇緣邊九郡九年六月鮮卑入緣邊九郡南胸奴傳建武二十六年冬詔南單于徙居西河美稷悉復緣邊八郡北地朔方五原雲中定襄鴈門代郡西河梁慬傳永初三年冬南單于烏桓反以何熙行車騎將軍龎雄為副將羽林五校營士及發緣邊十郡兵二萬餘人注比前增遼西竇憲傳北伐發緣邊十二郡騎士地理志漢興六郡良家子選給羽林期門以材力為官名將多出焉注師古曰六郡謂隴西天水安定北地上郡西河文帝從六郡良家之子馳騁上林趙充國傳始為騎士以六郡良家子注同地理志郡後漢志詔選漁陽隴西安定北地上郡西河凡六良家子續志牧師苑分在河西六郡界中昭紀元鳯三年冬遼東烏桓反以范明友為度遼將軍將北邊七郡郡二千騎擊之光武紀建武八年閏月自征隗囂河西太守竇融率五郡太守會髙平注五郡謂隴西金城天水酒泉張掖漢書贊山西出將虞詡云關西出將關東出相白起郿人王翦頻陽人漢興郁郅北地王圍為強弩將軍有射法甘延夀少以良家子善騎射為羽林斬郅支義渠北地公孫賀傅介子賀以車騎將軍從大將軍出有功介子刺樓蘭成紀天水李廣號飛將軍李蔡出朔方有獲王之功杜陵京兆蘇建蘇武建從大將軍擊胸奴武使胸奴上邽隴西上官桀以騎都尉封趙充國擊胸奴誅先零襄武隴西廉褒在西域以恩信稱狄道隴西辛武賢為破羌將軍有威西夷慶忌為國虎臣西域敬其威信皆以勇武顯聞蘇辛父子著節山西天水隴西安定北地處勢迫近羌胡民修習戰備髙上勇力鞍馬騎射故秦詩曰王于興師修我甲兵與子偕行其風聲氣習自古而然今之歌謠慷慨風流猶存秦漢間稱山北山南山東山西者皆指太行虞詡曰烈士武臣多出涼州士風壯猛便習兵事羌胡不敢入據三輔以涼州在後也六郡良家子趙充國李廣隴西馮奉世上黨甘延夀北地玉海卷十七
