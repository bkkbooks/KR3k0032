body:
  text: 玉海卷一百十九宋王應麟撰官制官名論語撰考云黄帝受地形象天文以制官伏羲已前雖有三名未必具立官位至黄帝名位乃具黄帝官名史記官名皆以雲命為雲師左傳文八年注縉雲黄帝時官名少皥氏官名炎帝太皥氏顓頊官名左傳昭十七年秋郯子來朝公與之宴昭子叔孫問焉曰少皥氏以鳥名官何故也郯子曰吾祖也我知之昔黄帝以雲紀故為雲師而雲名注黄帝姬姓之祖也黄帝受命有雲瑞故以雲紀事百官師長皆以雲名號縉雲氏盖一官也青應劭曰黄帝受命有雲瑞故以雲紀事也故春官為雲夏官為縉雲秋官為白雲冬官為黒雲中官為黄雲正義服䖍注同張晏曰黄帝有景雲之應史記正義黄帝置五官見後炎帝氏以火紀故為火師而火名注炎帝神農氏姜姓之祖也亦有火瑞以火紀事名百官為應劭曰春官為大火夏官為鶉火秋官為西火冬官北火中官為中火服䖍注同火張晏曰有星之瑞共工氏以水紀故為水師而水名注共工以諸侯覇有九州在神農前太皥後受水瑞以水名官服䖍曰春官為東水夏南秋西冬北中官為中水大皥氏以龍紀故為龍師而龍名注大皥伏羲氏風姓之祖也有龍瑞故以龍命官應劭曰春官為青龍夏官為赤龍秋官為白龍冬官為黒龍中官為黄龍服䖍注同張晏曰神龍負圖而至方春秋正義曰此皆虚而不經五少皥不以五名官焉知彼四代皆以四時方名官焉我髙祖少皥摯之立也鳯鳥適至故紀於鳥為鳥師而鳥名鳯鳥氏厯正也注鳯鳥知天時故以名厯正之官正義厯正主治厯數主天時之官玄鳥氏司分者也玄鳥燕也以春分來秋分去伯趙氏司至者也伯趙伯勞也以夏至鳴冬至止青鳥氏司啟者也青鳥鶬鷃也以立春鳴立夏止丹鳥氏司閉者也丹鳥鶩雉也以立秋來立冬去入大水為蜃上四鳥皆厯正之屬官正義分至啟閉立四官使主之鳯皇氏為之長祝鳩氏司徒也祝鳩䳡鳩也䳡鳩孝故為司徒主教民瞗鳩氏司馬也瞗鳩王鳩也鷙而有别故為司馬主法制鳲鳩氏司空也鳲鳩鴶鵴也鳲鳩平均故為司空平水土爽鳩氏司寇也注爽鳩鷹也鷙故為司寇主盜賊昭二十年齊晏子曰昔爽鳩氏始居此地鶻鳩氏司事也注鶻鳩鶻鵰也春來冬去故為司事正義司事謂營造之事五鳩鳩民者也注鳩聚也治民上聚故以鳩為名事五官之名與曲禮同但司士為司五雉為五工正注五雉雉有五種西方曰鷷雉東方曰鶅雉南方曰翟雉北方曰鵗雉伊洛之南曰翬雉正義賈逵云鷷雉攻木之工鶅雉搏埴之工翟雉攻金之工鵗雉攻皮之工翬雉設五色之工利器用正度量夷民者也雉夷也夷平也九扈為九農正注扈有九種也春扈鳻鶞夏扈竊玄秋扈竊藍冬扈竊黄棘扈竊丹行扈唶唶宵扈嘖嘖桑扈竊脂老扈鷃匕以九扈為九農之號各隨其宜以教民事昊晏子春秋曰爽鳩氏始封此少氏之農正也扈民無淫者也注扈止也止使不淫放自顓頊以來不能紀逺乃紀於近為民師而命以民事則不能故也仲尼聞之見於郯子而學之曰天子失官學在四夷注於是仲尼年二十八聖人無常師正義厯正及司徒司空工農之屬皆以後代之官所掌之事託言之言如今之此官也汲冡周書黄帝乃命少昊請司馬鳥師以正五帝之官周禮疏易通卦驗云天地成位君臣道生君有五期輔有三名注三名公卿大夫政教君臣起自人皇之世至伏羲因之故文耀鈎云伏羲作易名官者也論語撰考云云云左傳服䖍注春官為木正夏官為火正秋官為金正冬官為水正中官為土正髙辛氏因之唐氏系表少昊氏以烏鳥名官以世功命氏烏氏堯官名六官周禮疏堯舜官號稍改堯典乃命羲和注云堯育重黎之後羲和氏之子使掌舊職天地之官亦紀於近命以民事其時官名盖曰稷司徒是天官稷也地官司徒也又云命羲和仲叔使分主四方注仲叔亦羲和之子堯既分隂陽四時又命四子為之官掌四時者字曰仲叔則掌天地者其曰伯乎是有六官分命仲叔注云官名盖春為秩宗夏為司馬秋為士冬為共工通稷與司徒是六官之名鄭玄分隂陽為四時者分髙辛時重黎之天地官使兼主四時耳共工注水官也堯天官為稷又司徒士此三官是堯時事舜述前功秩宗舜時官也唯無夏官之名夏傳云司馬在前則羲叔為夏官是司馬也鄭云初堯冬官為共工舜舉禹治水堯知其必成功故改命司空以官名寵異之非常官也至禹登百揆之任捨司空之職為共工與虞垂益是也始羲和之時主四岳者謂之四伯後分至八伯堯初天官為稷至試舜謂之百揆舜命禹為之即天官也以稷為天官羲叔為夏官共為六官通典舜為六官以主天地四時注崔靈恩曰重黎世掌天地號羲和堯置天地四時之官復羲和職掌天地又命仲叔使主四時為六卿舜改地官曰司徒秋官為士冬官為司空春官為秩宗唐虞建官設官分職書周官唐虞稽古建官惟百内有百揆四岳外有州牧侯伯夏商官倍疏百揆為羣官之首立一人四岳内典四時之政外主方岳之事立四人牧一州之長侯伯五國之長各監所部之國外内置官各有所掌百揆四岳象天之有五行少昊立五鳩氏顓頊已來立五行之官其數亦有五魏志王肅上疏唐虞設官分職申命公卿各以其事惟龍為納言猶今尚書也周定官分職禮設官分職疏設天地四時之官官各有主漢地理志周既克商監于二代而損益之定官分職後百官志周公作周官分職著名法度相持周官正義周禮每官言人之員數及職掌立其定法授之成王立三公九卿是設官也各言所掌是分職也書召詔王先服殷御事比介于我有周御事注有周治事之臣左傳襄十五年春官師從單靖公逆王后于齊注官師劉夏也天子官師非卿也楚語伍舉曰天子以公侯為官正以伯子男為師旅詩鹿鳴箋周行周之列位也左傳王及公侯伯子男甸采衛大夫各居其列所謂周行也周秩官禮司闗凡四方賔客敂闗則為之告注鄭司農説以國語曰周之秩官有之曰敵國賔至闗尹以告行理以節逆之周語單襄公吿定王曰周之秩官有之曰敵國賔至闗尹以告行理小行人以節逆之候人為導卿出郊勞門尹司門除門宗祝宗祝大祝執祀司里授館司徒具徒司空視塗司寇詰姦虞人入材甸人積薪火師監燎水師監濯膳宰致餐廩人獻餼司馬陳芻工人展車百官官以物至賔入如歸其貴國之賔至則以班加一等益䖍至於王使則皆官正涖事上卿監之若王廵守則君親監之注秩官周常官篇名又引夏令時儆周制先王之令亢倉子政道篇周之秩官云人强勝天注周書篇小宰官府六叙注叙秩次也謂先尊後卑典命注命謂王遷秩羣臣之書晉文公作執秩正其官主爵秩之官也鄭子産曰文公之為盟主也司空以時平易道路圬人以時塓館宫室諸侯賔至甸設庭燎僕人巡宫車馬有所賔從有代巾車脂轄隷人牧圉各瞻其事百官之屬各展其物師服曰天子建國諸侯立家卿置側室大夫有貳宗士有隷子弟庶人工商各有分親皆有等衰衛武公位宁有官師之典周官政史記周公世家成王在豐天下已安周之官政未次序周公作周官别其宜作立政以便百姓周官政法隋志漢時有李氏得周官周官盖周公所制官政之法上於河間獻王文選王融策秀才文周官三百漢位兼倍注漢書曰秦立百官漢因循不革自佐史至丞相十二萬三百八十五人今云兼倍略言之耳漢中六年官名史記景帝紀中六年四月更命廷尉為大理将作少府為大匠主爵中尉為都尉長信詹事為長信少府将行為大長秋大行為行人奉常為太常典客為大行治粟内史為大農表在後元年以大内為二千石置左右内官屬大内漢百官表中六年太祝更名祠祀漢書景紀中六年十二月改諸官名定鑄錢偽黄金棄市律紀又云中二年春二月有大鴻臚大行顔師古注以為表誤云中六年更名大行令武太初元年更名大鴻臚劉原父以為追舉最後官名百官公卿表景帝初更衛尉為中大夫令二年令内史置左右中二年更郡守尉曰太守都尉中五年令諸侯王不得復治國天子為置吏改丞相曰相省御史大夫廷尉少府宗正博士官大夫謁者郎諸官長丞皆損其員後元年復衛尉之名治粟内史更名大農令餘同史記史記禮書髙祖襲秦故自天子稱號下至佐僚及官室官名少所變改賈誼傳為官名悉更奏之文帝未皇也漢太初官名武帝紀太初元年夏五月正厯定官名劉歆議武帝建封禪殊官號存周後表更祠祀曰廟祀郎中令曰光禄勲中大夫為光禄大夫家馬為挏馬大行令為大鴻臚行人為大行令大農令為大司農考功室為考功左弋為佽飛韓非子衛人有佐弋者居室為保宫甘泉居室為昆臺永巷為掖庭中尉為執金吾東園主章為木工右内史為京兆尹左内史為左馮翊主爵中尉為右扶風諸侯王大僕改曰僕初置則太常之太卜光禄之羽林建章營騎太僕之路軨鴻臚之别火建元二年省太尉明年置期門又明年復廷尉自是増益若五經博士大司馬司直諌大夫水衡部刺史三輔都尉其後置司隷遣直指曰屬國搜粟農奉車駙馬以命都尉之官曰中壘屯騎歩兵越胡騎長水射聲虎賁䕶羌以命校尉之官大事記曰入校尉奉車駙馬農都尉皆武帝初置不載年漢復官名漢官威儀光武紀光武行司隷校尉時三輔吏士東迎更始見諸将過皆冠幘而服婦人之衣諸于綉镼莫不笑之及見司隷僚屬皆歡喜老吏或垂涕曰不圖今日復見漢官威儀由是識者皆屬心焉光武持節北渡河鎮慰州郡考察黜陟如州牧行部事輒平遣囚徒除王莽苛政復漢官名吏人喜悦争持牛酒遺勞前百官表兼王莽傳秦立百官之職漢因循不改明簡易隨時宜也王莽慕從古官而吏民弗安元始四年冬更公卿大夫八十一元士官名位次改太常曰秩宗廷尉曰作士并宗正於秩宗改少府曰共工水衡曰予虞改大農曰羲和後更為納言大鴻臚曰典樂光禄曰司中太僕曰太馭衛尉曰大衛執金吾曰奮武中尉曰軍正改郡太守曰大尹都尉曰大尉縣令長曰宰御史曰執法後又置卒正連率耿純傳謁光武於邯鄲退見官屬将兵法度不與他将同遂自結納郎顗傳陽嘉二年顗言七事漢興以來三百三十九嵗官名稱號輿服器械宜有所更漢百官簿置官本末百官志班固著百官公卿表記漢承秦置官本末訖于王莽差有條貫然皆漢武奢廣之事又職分未悉世祖節約之制宜為常憲故依其官簿粗注職分以為百官志注曰百官簿劉昭補志序司馬續書總為八志律厯之篇仍乎洪邕所作車服之本即依董蔡所立儀祀得於往記百官就乎故簿安帝紀延光元年八月己亥詔三公中二千石舉刺史令長相視事一嵗以上至十嵗清白愛利能敕身率下者無拘官簿注謂不拘常牒也翟方進傳陳咸逢信官簿皆在方進之右及御史大夫缺而方進得之漢官多襲秦舊上自三公九卿内則中尉将作詹事将行典屬國主爵䕶軍博士僕射與侍中等之加官外則爵二十級監御史郡守尉闗都尉縣令長與游徼嗇夫之小吏皆秦置漢因者也官名改於景帝之六年増置於建元之後定於太初之元司直以佐丞相司隷以察中都五經博士諫大夫大卜路軨别火列于九卿之屬水衡捜粟奉車駙馬三輔農屬國列于都尉之職期門營騎之設八校直指之置大司馬之冠将軍内史主爵之更三輔監御史之改十三部刺史廷平都䕶肇于地節戊己校尉尚書五人昉于初元建始或以太師太保冠司馬将軍或以司徒司空易丞相御史皆西都初置者也太傅師保之法乎古司隷内史将軍之仍乎周漢五曹官制前志隂陽家五曹官制五篇漢制似賈誼所條賈誼傳以為漢興二十餘年宜定官名興禮樂廼草具其儀法為官名悉更奏之文帝謙遜未皇也丙吉傳召東曹案邊長吏瑣科條其人張晏注瑣録也漢官篇舊制儀品隋志漢官解詁三篇漢新汲令王隆撰胡廣注唐志三卷後百官志世祖中興務從節約并官省職故新汲令王隆作小學漢官篇諸文倜説較畧不究注按胡廣注隆此篇其論之注曰前安帝時越騎校尉劉千秋校書東觀樊長孫與書曰宜撰次依擬周禮定位分職劉君甚然其言與郎中張平子參議未定㑹劉君遷為宗正衛尉平子為尚書郎太史令各務其職未暇恤也至順帝時平子為侍中典校書方作周官解説乃欲以漢次述漢事㑹遷河間相遂莫能立顧見新汲令王文山小學漢官篇畧道公卿内外之職旁及四夷博物條暢足知舊制儀品聊集所宜為作詁解各隨其下綴續其事隆馮翊人建武中著詩賦銘書凡二十六篇漢官儀應劭傳建安二年時遷都於許舊章湮没劭乃綴緝所聞著漢官禮儀故事凡朝廷制度百官典式多劭所立又論當時行事著中漢輯序撰風俗通以辨物類名號釋時俗嫌疑凡所著述百三十六篇詳見禮制隋志應劭漢官儀十卷唐志同又有應劭注漢官五卷韋昭官儀職訓一卷亡漢志注多引漢官儀又有漢書目録中興書目一卷載光武以來三公百官名氏爵里今漢官儀存一卷李􅌫補續一卷漢官典儀唐志蔡質漢官典儀一卷隋志漢官典職儀式選用二卷漢衛尉蔡質撰蔡邕傳注質字子文著漢職儀邕之叔父唐志丁孚漢官儀式選用一卷漢永元置官和帝紀永元二年二月己亥復置西河上郡屬國都尉官三年十二月復置西域都䕶騎都尉戊己校尉官九年十二月己丑復置若盧獄官十年九月庚戌復置廩犧官十一年四月己巳復置右校尉官在西河鵠澤十四年五月丁未初置象林将兵長史官是嵗初復郡國上計補郎官十五年七月丙寅復置涿郡故安鐵官十六年十二月復置遼東西部都尉官漢官列職續志注臣昭曰凡漢官所載列職人數今悉以注雖頗為繁盖周禮列官陳人役於前宏模不可闕也始於太傅次太尉司徒司空次将軍九卿自太常至少府次執金吾太子太傅少傅大長秋将作大匠城門校尉北軍中候司隷校尉河南尹三輔州郡縣郡亭里匈奴中郎将烏桓校尉䕶羌校尉次王國宋衛國列侯闗内侯四夷國終於百官奉凡五卷漢宫所載太常以下員吏之數見九卿類官數見省官類漢官名秩簿前百官表注師古曰漢官名秩簿云斗食月奉十一斛佐史月奉八斛後禮志注漢官名秩曰賜司徒司空帛四十匹九卿十五匹又曰大将軍三公臘賜云云官志注引應劭漢官名秩丞皆選孝㢘郎又引晉公卿禮秩荀綽晉百官表注漢百官典式見官儀漢百官表晉百官表注中興書目東漢百官表一卷不知作者紀建武至建安三公百官罷免月日隋志晉荀綽百官表注十六卷後漢志注多引之魏官儀魏晉官品令齊職儀梁職官要録隋志梁有荀攸魏官儀一卷南齊志今有魏氏官儀魚豢中外官名徐宣瑜晉官品一卷晉百官儀服録五卷大興二年定官品事五卷百官品九卷亡晉志案魏晉官品令又有禁防御史第七品隋志齊職儀五十卷長水校尉王珪之撰永明九年其子顥上之詔付祕閣宋職官記九卷亡書目梁陶彦藻撰職官要録隋唐志皆云三十卷今殘缺後求得七卷又有補遺十八卷與前七卷首尾互見唐志三十六卷郎楚之隋官序録十二卷魏咸熙元年七月晉文王奏尚書僕射裴秀議官制大保鄭冲總裁始建五等爵秀傳云改官制議五等之爵漢百官志注引劉劭爵制晉百官名隋志魏晉百官名五卷晉百官名三十卷唐志陸機晉百官名三卷晉官屬名四卷晉過江人士目一卷六典注引元康百官名文選注引晉百官名世説注引晉東宫官名晉官品令後魏禮志案晉官品令所制九品皆正無從故以第八品凖古下士今皇朝官令皆有正從劉芳議晉志魏晉官品令又有禁防御史第七品元魏職員令後魏書太和十五年十一月乙亥定官品十七年六月乙巳作職員令二十一卷行之十九年十二月乙未朔見羣臣於光極堂宣下品令為大選之始唐志魏官品令一卷通典後周酌周禮建六官隋書大業三年始行新令有三臺五省五監十二衛十六府唐志有隋所有而唐廢之者謁者臺内謁者局諸衛察非掾都督府典籖之屬有隋所廢而唐復置者三師左右司郎散騎常侍殿内侍御史詹事府之類唐武徳官名定令舊職官志髙祖發跡太原官名皆依隋舊元年改納言殿中置諌議廢越騎歩兵二年置宗師三年改侍中中書省四年改祕書少監著作局太史局五年改左右衛等武徳七年通鑑三月定令以太尉司徒司空為三公尚書中書門下祕書殿中内侍為六省次御史臺次太常至太府為九寺次将作監次國子學次天䇿上将府次左右衛左右驍騎左右領軍左右武候左右監門左右屯左右府為十四衛府東宮置三師三少詹事府門下典書兩坊次内坊次家令率更僕三寺次左右衛率府至左右内率府為十率府王公以下置府佐國官公主置邑司並為京職事官通鑑云云州縣鎮戍岳瀆闗津為外職事官又以開府儀同至将仕郎二十八階為文散官驃騎大将軍至陪戎校尉三十一階為武散官上柱國至武騎尉十二等為勲官輔國至游擊十将軍為散號将軍以加武士之無職事者九年六月乙酉罷天䇿上将軍府武徳九年頒令定用上柱國至武騎尉凡十二等起正二品至從七品十二轉武徳七年正月置大中正二月戊午改大總管為大都督府武徳令唯有公侯伯子男爵貞觀十一年加封國之稱又武徳令禮部次吏部兵部次之民部次之武徳令御史中丞從五品吏部郎中正五品上諸司郎中正五品上祕書丞正五品諸陵令從七品萬年長安令從五品中下州刺史正四品下州刺史從四品上