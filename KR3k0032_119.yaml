載元年習藝館之改太史局之復保章正靈臺郎中臺之改又見於如意之元及長安之二年三年先是垂拱元年改都臺鸞臺麟臺司宫臺之名成均水衡尚方監之職司封珍羞之號在光宅後唐開元刋定職次開元格令通典開元二十五年刋定職次著為格令盖尚書省以統㑹衆務舉持繩目門下省以侍從獻替規駁非宜中書省以獻納制冊敷揚宣勞祕書省以監録圖書殿中省以供修膳服内侍省以承㫖奉引凡六省御史臺以肅清僚庶九寺五監以分理羣司六軍十二衛左右衛驍衛威衛領軍金吾監門千牛為十六衛以嚴其禁禦一詹事府二春坊三寺十率俾乂儲宫牧守督䕶分臨畿服設官以經之置使以緯之自六品以下率由選曹居官者以五嵗為限於是百司具舉庶績咸理亦一代之制焉注此格皆武徳貞觀之舊制永徽初已詳定之至開元二十五年再刋定焉二十一年又省文武六品以下三百餘員舊志侍中中書令吏部尚書舊班在左相上開元令移在下太子賔客舊兼無品開元令定入官品御史大夫舊班在祕書監九卿下開元令移在上大都䕶府副都䕶舊正四品上開元令加入從三品黄門侍郎中書侍郎舊正四品下開元令加入上階大理正太常丞太史令舊正六品上開元令改從五品下下牧丞武徳令正八品開元前令有沙苑丞通鑑開元五年九月復舊官名令史官隨宰相入侍羣臣對仗奏事唐官制名號禄秩品爵勲階志唐之官制名號禄秩雖因時増損而大抵皆沿隋故其官司之别曰省曰臺曰寺曰監曰衛曰府各統其屬以分職定位其辨貴賤叙勞能則有品有爵有勲有階以時考覈而升降之所以任羣才治百事其為法則精而宻其施於事則簡而易行由職有常守而位有常員也唐之盛時其制如此陸贄傳贄曰按甲令有職事官有散官有勲官有爵號其賦事受俸者惟職事一官以敘才能以位勲徳所謂施實恵而寓虚名也勲散爵號止於服色資䕃以馭崈貴以甄功勞所謂假虚名而佐實利者也逆羯亂中原遣戍嵗増䇿勲日廣財賦不足供賜而職官之賞興職員不足容功而散試之號行唐官名増損志唐之官制名號禄秩雖因時増損而大抵皆沿隋云以官名之更易言之若侍内為納言殿中監為殿中省殿内侍御史曰殿中将作令少曰大匠少匠鷹揚郎将曰軍頭又改驃騎将軍鷹擊曰府副又改車騎将軍功義良曹曰親勲翊衛太守曰刺史賛治丞曰治中别駕州主簿曰録事參軍縣書佐曰尉九減宫有監則武徳初元也諸司郎中員外之改禮部主客工部之更納言為侍中紀三月庚午給事郎為給事中内書省曰中書省内史令曰中書令内充管記曰中舍人舍人則三年也通事謁者曰舍人祕書少令曰少監著作曹太史監曰局長秋監曰内侍監内承奉承直曰内常侍給事選部曰吏部及左右驍威領軍三率中郎将等之改則四年五年七年也功曹司功以下書佐曰參軍修文館曰弘文則武徳中及九年也中允河隄謁者改於正觀初國子監改於二年互市都水監弩甲坊改於六年折衝果毅都尉改於十年民部為户部治禮為奉禮治中别駕為司馬為長史改於髙宗之初龍朔咸亨見上神龍元年二年館有昭文修文之名景雲二年監復渾儀之號又改左春坊諸王傅之稱祕書省復於太極元年胄曹復於延和元年丞相黄門紫微監令紀十二月庚寅符寳珍羞兩都尹司録改於開元元年中書門下侍中復於五年九月壬寅弘文館復於七年太史監改於二年至十四年而復為局翰林有供奉至二十六年而改為學士天寳元年復僕射太史監之官而左右相門下侍郎太守皆改於舊紀二月丙申十一載改八部名十三載改内侍曰少監乾元元年改黄門侍郎司天臺觀察處置使之名大厯二年五年復門下中書侍郎之名開成元年改奉諸王講讀之名乃若太子正書曰正字司府令曰家令宫門衛曰監門率皆不載其年以官名之増置言之若諫議大夫詹事府武器百工監經學博士助教雍州牧邊要地總管則武徳初元所置也州之宗師十二軍之将軍門下之修文館典儀門僕八百人畨上大中正則二年四年五年七年所置也諸王師及常侍侍郎舍人諮議友文學祭酒則武徳中所置也十原闕三字中散騎常侍少府監吏部侍郎書學史館起居郎置於貞觀元年二年三年律學博士舟楫令三師三公司議郎王府侍講弘文講經博士京城留守置於六年十一年十八年左右常侍之分洛州司馬賛善大夫詳正學士之置則顯慶二年儀鳯四年漆園監上州别駕之置則上元一年左右遺補諸衛長史兵曹之置則垂拱聖厯之元年司階中候司戈執㦸置于天授二年挈壺正内供奉置于長安二年員外郎復置于永昌元年神龍元年省員外郎二年後置掌書記修文館大學士司田參軍置於景龍元二三年諭徳至贊善之復置景雲二年也御史右臺之復置延和元年也景雲元年置龍武将軍二年又置都督二十四開元三年置軍器監五年六年又置乾元院使刋正官麗正修書使學士以至七年置弘文校書郎八年加修撰校理復置十道按察使十一年置麗正修書學士太原尹少尹十三年置集賢侍講學士而太公廟令十五道采訪使崇玄學神武軍置於十九年二十年二十五年二十六年崇玄博士助教學士廣文館内侍監置於天寳元二九載十三載集賢大學士置於至徳二年五官監候禮生正副團練守捉使置於乾元元年十六衛於貞元二年而置上将軍諌議於四年而分左右集賢院於八年而置校書正字六軍統軍行營副都統置於興元元年兩輔六雄十望十緊州别駕置於太和元年以官名之廢省言之武徳初廢少府都水越騎歩兵四年廢謁者臺七年省吏部侍郎太史監候九年置天䇿府二年置十二軍六年而廢八年復置焉七年廢軍器監八年復置九年又廢焉衣冠局令起居舍人廢于貞觀元年三年寺觀監百工監司農二倉督諸王府鎧田水曹廢于貞觀中津尉廢于永徽中諸衛司馬太史副監及丞廢于聖厯元年長安一年修文館學士員數御史右臺省于景雲元年三年王傅常侍侍郎行軍參謀廢于開元二年十二年殿中天藏府沙苑等監太廟令舟楫令廢于二十三年二十四年二十六年進馬别駕天寳八載省之兵馬元帥大厯八年罷之集賢崇玄大學士貞元四年罷之八年罷校理元和二年復置而罷校書正字六年廢中下州文學至是東都留臺中丞省於元和之後詳正學士講經博士罷於長慶三年通典唐内外文武官員凡萬八千八百五文官萬四千七百七十四武官四千三十一内官二千六百二十外官萬六千一百八十五唐改尚書省八部名紀天寳十一載三月乙巳改尚書省八部名志十一載改吏部曰文部金倉部曰司金司儲兵部曰武部駕部曰司駕刑部曰憲部比部曰司計虞水部曰司虞司水舊志十載正月改又改庫祠膳部曰司庫司禋司膳文武憲駕庫金儲計禋膳虞水改将作大小匠曰監㑹要十一載二月二十七日㑹要至徳二載十二月十五日復文部曰吏部紀至徳二載十二月戊午通監十二月復諸州及官名唐官品令又見前王彦威傳文宗時以僕射上事儀注前後不定中丞李漢奏定朝議未以為允中書門下奏請依元和七年已前儀注左右僕射上日請受諸司四品六品丞郎以下拜彦威奏曰按開元禮凡受冊官並與卑官答拜國朝官品令三師三公正一品尚書令正二品並是冊拜授官上之日亦無受朝官再拜之文僕射班次三公請依无和七年敕為定雖不從其議論者稱之舊唐書唐職官十九家六典史類六曰職官以紀班序品秩漢官解詁等二十部三百三十六卷蓺文志史録七曰職官十九家二十六部二百六十二卷失姓名十家始於王隆漢官解詁次以應劭漢官以官儀名者有應劭蔡質丁孚荀攸王珪之及干寳之司徒儀注以官名為書者有陸機晉百官名晉官屬名梁百官人名及晉過江人士目衛禹晉永嘉流士官簿則登城三戰簿徐勉梁選簿陳将軍簿大建百官簿状官品則范曄荀欽明百官階次魏官品令沈約梁官品百官春秋則宋六卷王道秀十三卷百官注職官要録則郭演十卷陶彦藻三十六卷故事則有傳暢之公卿禮秩故事及職員舊事王方慶官卿舊事不著録二十九家二百八十卷自六典至楊鉅學士院規舊志歴代職官二十一家隋志職官二十七部三百三十六卷周官冡宰總六卿之屬以治其政御史掌其在位名數先後之次漢書百官表列衆職之事紀在位之次古之制也漢末王隆應劭等作解詁官儀等書是後相因正史表志無復百僚在官之名矣或取官曹官品之書撰録别行於世宋齊已後其書益繁中興書目二十三家一百九十一卷續目八家一百二十四卷唐百司舉要蓺文志職官類李吉甫元和百司舉要一卷八年二月上集唐興以來百官名品要舊史云纂六典諸職為百司舉一卷唐職該書目唐京兆杜英師撰一卷採周禮六典具員唐職儀漢官志官品令等撮其員數品秩掌隷職局勲爵散試歴代沿革著于篇今缺其序目别本首尾卷秩皆備題曰職源乃其全書唐職儀舊史韋述撰唐職儀三十卷梁周興嗣撰職儀南齊志臺府郎令史職吏以下具見長水校尉王珪之職儀三公長史以下干寳撰立官府職儀已具蔚宗選簿欽明階次開寳班簿天聖班簿開寳七年閏七月詔除授京官依朝官例降敕御史臺寫班簿十日一上中書太宗閲班簿擇近臣舉官咸平三年七月命宰臣録内外庶官歴任功過編冊以進其該恩復用者别編以備觀覽景徳四年十月乙巳親閲班簿擇朝臣得翰林學士晁逈等五十人令各舉大籓守臣二人天聖元年四月乙未詔諸行郎中至京官以出身歴任功過具為班簿進内李淑上時政十議議擇官曰興國初文武朝官班簿才二百人至咸平初四百人天聖元年已踰千人慶厯六年四月壬子中丞張方平言臣在翰林為學士見天聖中具員兩制兩省不及三十員今五十餘員及領御史中丞見本臺天聖班簿京朝官不及二千員今二千七百餘員又領三班院見景祐中使臣不及四千員今六千餘員又領流内銓約在銓選人僅以萬計皇祐元年包拯言景徳祥符中文武官總九千七百八十五員今内外官一萬七千三百餘員今天下州郡三百二十縣一千二百五十而一州一縣職有定額不過五六千員則有餘矣今乃三倍其多龍圖直學士李柬之請更定選舉補䕃之法科塲取士以皇祐四年進士限四百人諸科毋得過其數治平中中丞賈黯言今京朝官至卿監凡二千八百餘員吏部奏舉磨勘選人未引見者至三百五十餘人治平班簿見後熙寧元年六月中書門下言御史臺季進班簿多差誤請徧令所屬以職位名氏報臺庶班簿整齊從之三年六月十八日命密院毎季進使相至閣門祗候以上班簿真宗時宗室吏員受祿者九千七百八十七寳元以後萬五千四百四十三治平視皇祐增十之三宋祁上疏曰一官未缺十人競逐紆朱滿路襲紫成林州縣之地不廣於前而官五倍於舊咸平職林元祐職官分紀咸平中諫議大夫楊侃撰二十卷集歴代沿革自三公至東宫官善惡成敗各編其事為一百五十二門明道中校書郎胡昉又采唐事七百四十五條附于末書目職官分紀五十卷元祐中孫逢吉撰編類前代至本朝百官沿革故事僅一千門逢吉字彦同熙寧百官公卿表晁氏志百官公卿表一百四十二卷司馬光等撰卷數多當攷光行状云六卷熙寧中光建議欲據國史旁采異聞叙宋興以來百官除拜效漢書作表以便御覽詔許之光請宋敏求同修敏求卒請趙彦若繼之歴十二年書成熈寧二年十一月甲子朔翰林學士史館修撰司馬光言欲據正史實録所載旁采異聞敘宋興以來迄今百官沿革公卿除拜倣漢書舊法作大宋百官公卿表以備奏御便省覽從之詔所用文字委檢討官檢閲是月命知制誥宋敏求同修敏求卒元豐二年五月己巳集賢校理趙彦若代之元豐四年八月辛巳二十七日光彦若上所修六卷盡治平二年國㑹要云十卷史云六卷自建隆元年至治平四年依司馬遷法記大事於上方書成詔附于國史一云後續修至十五卷書目百官公卿表十五卷彦若又自撰宗室世表三卷詔進入並送編修院賜銀帛有差元豐新定官制正官名寄祿新格禄令元豐二年五月乙丑二十二日右正言知制誥李清臣言官制踵襲前代官與職不相凖差遣與官職不相凖其他勲爵食邑實封章服品秩俸給班位各為輕重後先皆不相凖願詔有司講求釐正以成一代之法三年六月丙午詔中書置局詳定官制命張璪張誠一領之王陟臣李徳芻為檢討文字七月戊辰又以何洵直兼檢討八月己未十五日詔中書曰朕嘉成周以事建官以爵制禄分職率屬萬國條理國家受命百年而官政尚愧前聞今将推本制作董正之原若稽祖述憲章之意參稽損益趨時之宜使臺省寺監之官實典職事領空名者一切罷去而易之以階因以制禄凡厥恩數悉如舊章九月乙亥十六日詳定官制所上以階易官寄禄新格中書令侍中同平章事為開府儀同三司左右僕射為特進吏部尚書為金紫光禄大夫五曹尚書為銀青光禄大夫左右丞為光禄大夫六曹侍郎為正議大夫給事中為通議大夫以上無磨勘法左右諌議為太中大夫待制以上六年遷兩官至大中止祕書監為中大夫光禄卿至少府監為中散大夫太常至司農少卿為朝議大夫以七十員為額六曹前中後行郎中為朝散朝請朝奉大夫凡三等員外郎為朝散朝請朝奉郎凡三等起居舍人為朝散郎左司諌為朝奉郎正言太常國子博士為承議郎太常祕書殿中丞著作為奉議郎太子中允賛善中舍洗馬為通直郎著作大理丞為宣徳郎後改宣教郎光禄衛尉将作丞為宣義郎評事為承事郎太常寺太祝奉禮郎為承奉郎校書正字将作監簿為承務郎以上四年遷一官而寄禄階隋唐二十有九今二十有五右元祐四年寄禄官分左紹聖三年罷之其禄令並以職事官俸禄賜料舊數與今新定官擬定從之四年七月戊申二十三日命蘇頌司詳定官制五年四月癸酉二十三日一本云四月甲戌官制成詔以五月辛巳朔頒行御文徳殿視朝新除職事官立班七月壬午尚書省奏自五月一日行官制指揮條制集為二冊一本云五年五月新制行舍人曽鞏專令命告四月丙子鞏除舍人元豐正名凡文階官之等二十有五武選官之等五十有六而幕職州縣官之等七總為品十有八九品正從畢仲游曰昔之官品難於進今之階秩易為高又降七品為八五品為六三品為四章服之令降五為六降三為四以遷就新品之失淳熙元年三月戊子階官去左右先是紹興行元祐之法職官志神宗即位謂中書政事之本首開制置中書條例司設五房檢正官以清中書之務又置制置三司條例司以理天下之財置諸路提舉常平廣恵農田水利差役官隷於司農以修農政簡樞密武選而置審官西院創民兵保甲法以歸兵部作軍器監以除戎器新大理寺以省滯獄増國子監太學官以大興庠序復将作監以董百工然名未正也熙寧末上欲正官名始命館閣校唐六典元豐三年以摹本賜羣臣遂下詔命官置局以議制作上自考求故實間下手詔或親臨決以定其論凡百官庶務皆以類别有正而治之者有旁而治之者有統而治之者省曹寺監以長治屬正而治之者也故其法詳御史非其長而以察為官旁而治之者也故其法畧都省無所不總統而治之者也故其法當考其成於是長吏察月御史察季都省察嵗四年十一月丁酉開天章閣對輔臣呈官制除目五年三省六曹御史臺祕書省九寺五監之法成即宫城之西營新省省成上親臨幸召問以職事而訓誡之省官遷秩有差自是繼有増損唯倉庫百司武臣外官未暇釐正崇寧二年九月鄧洵武奏改選人七階政和二年九月二十九日易武選官稱元祐三年二月癸未詔三光䘵正議中散朝議大夫六階各分左右大觀初改左光䘵為宣奉右光䘵為正奉右正議為通奉左中散為中奉右朝議為奉直元符二年六月廿四日劉賡請以官制敇令格式藏館閣從之元豐備選具員元豐六年八月吏部尚書李清臣編承務郎以上鄉貫出身歴任功過為備選具員十冊上之壬午令依本録上中書上謂於官使人才有助備選具員總目一事目一别録一冊聖訓及吏部人才之辨編次承務郎以上出身歴任功過以備選擇元祐修官制元祐八年十二月二日乙巳本紀甲寅左僕射吕大防言乞倣唐六典置局修官制一書以為國朝大典詔於祕書省置局令范祖禹王欽臣編修宋匪躬晁補之檢討紹聖元年五月詔罷之崇寧元年六月二十九日癸丑詔史院以神宗所定官制依唐六典修成一書政和三年八月修參照官制格目凡九百餘冊又修中書門下省官制格初天僖二年正月庚戌中丞趙安仁請修國朝六典不就嘉祐三年十二月學士韓絳言官制未立宜加裁定正其名體倣周禮唐六典著為一書辛亥劉敞胡宿同詳定敞奏先條數事送中書門下參詳可否然後刪定詔許焉明年三月絳再奏趣之敞曰本朝隨事建官有司奉法守職可矣茍不能爾雖成書且復廢宇文之周官唐六典是也書卒不成紹興祖宗官制舊典三卷紹興間蔡元道纂以元豐改制號為名正爵位浸輕品流淆雜故著是書每官先述舊典而後及新官得失以存祖宗制官之意又有官制正誤補蔡氏所不及仍正其誤官制沿革黄琮撰職官記張演撰趙曄萃三書為三卷中興百官題名五十卷紹熙間監察御史何異編紹興續皇朝公卿百官表二十九年七月戊戌翰林學士修國史周麟之言知雙流縣李燾著續皇朝公卿百官表九十卷詔給札録付史館燾以司馬光百官表未有繼者乃徧求正史實録旁求家集野史増廣門類起建隆迄靖康合新舊官制踵而成書其後續通鑑長編盖始于此國朝新舊官制通考曽三異十卷引證詳説為通釋三卷國朝兩朝志有官有職有差遣官以寓禄秩敘位著職以待文學之選差遣以治内外之事其次又有階有勲有爵士人以登臺閣陞禁從為顯宦而不以官之遲速為榮滯以差遣要劇為貴途而不以階勲爵邑有無為輕重惟王建國惟典命官上叶星象下符川嶽玉海卷一百十九
