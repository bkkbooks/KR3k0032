body:
  text: 玉海卷一百六十六宋王應麟撰宫室觀觀觀也周置兩觀以表宫門其上可居登之可以逺觀故謂之觀周兩觀見門闕類漢宜春觀水經注澇水北逕漢宜春觀合美陂水入渭東方朔傳注師古曰觀在鄠縣在長安城西秦上林苑北王道志宜春觀武帝造漢龍臺觀細柳觀司馬相如傳上林賦登龍臺掩細柳注張揖曰龍臺觀在豐水西北近渭三輔故事曰龍臺髙六丈漢時龍見陂中故作此臺括地志曰龍臺觀在雍州鄠縣東北三十五里郭璞曰細柳觀在昆明池南黄圖云在長安西細柳市匈奴傳軍長安西細柳注如淳曰細柳倉在渭北近石徼張揖曰在昆明池南今有柳市文紀事索隠按三輔故細柳在直城門外阿房宫西北云在渭北非也西京賦上林禁苑云云邪界細柳注在長安西北漢豫章觀昆明觀西都賦集乎豫章之宇注館名黄圖曰上林有豫章觀武帝造在昆明池中亦曰昆明觀史平準書大修昆明池列觀環之括地志昆明觀在雍州長安西二十里黄圖上林苑有昆明觀天文志昆明東觀西京賦昆明靈沼云云豫章珍館揭焉中峙牽牛立其左織女處其右薛綜注皆豫章木為臺館也李善曰黄圖上林有豫章觀相羊乎五柞之館旋憩乎昆明之池登豫章簡矰紅注豫章池中臺也西征賦潘岳昔豫章之名宇披玄池而特起儀景星於天漢列牛女以雙峙宫殿閣疏昆明池有二石牛女象也校獵賦揚雄先置乎白楊之南注服䖍曰白楊觀名漢甘泉四觀司馬相如傳上林賦蹷石闗歴封巒過鳷鵲望露寒注張揖曰此四觀建元中作在雲陽甘泉宫外史記甘泉更置前殿始廣諸宫室正義揚雄云甘泉本秦離宫既奢泰武帝増通天臺迎風館近則有洪涯儲胥逺則有石闗封巒鳷鵲露寒棠梨等觀又有髙華白虎温徳相思觀曾城走狗天梯瑶臺等黄圖武帝先作迎風館於甘泉山後加露寒儲胥二館建元中作石闗封巒鳷鵲觀揚雄甘泉賦封巒石闗施靡乎延屬師古曰皆宫名李善曰黄圖曰甘泉有石闗觀封巒觀度三巒李善曰即封巒觀也武紀注晉灼曰雲陽甘泉有宫觀故稱都漢延夀觀史紀益延夀觀正義括地志云延夀觀在雍州雲陽縣西北八十一里通天臺西八十步漢成山觀日觀魏志田豫督青州入成山登漢武之觀黄圖成山在東萊不夜縣於其上築宫闕為觀封禪儀泰山東南有山名日觀見封禪漢屬玉觀宣紀甘露二年十二月行幸萯陽宫屬玉觀注晉灼曰屬玉水鳥似鵁鶄以名觀也應劭曰宫在鄠秦昭王起黄圖屬玉觀在右扶風西都賦天子乃登屬玉之館歴長楊之榭注服䖍曰以玉飾因名焉漢甲觀成紀元帝在太子宫生於甲觀畫堂甘露三年畫元后傳作甲館堂顔師古謂甲者甲乙丙丁之次元后傳言見於丙殿此其例也而應劭以為在太子宫之甲地謬矣畫堂但畫飾耳又以為畫九子母非也霍光止畫室中是則宫殿中通有采畫之堂室漢宫閻疏曰未央宫有畫堂甲觀非常室如淳曰黄圖云太子宫有甲觀後清河王慶傳以長别居丙舍後官志有丙舍長一人漢上蘭觀元后傳校獵上蘭注師古曰上蘭觀名在上林中羽獵傳揚雄望舒彌轡翼乎徐至於上蘭注晉灼曰在上林西都賦饒酆鄗歴上蘭西京賦陳虎旅於飛亷正壘壁乎上蘭注黄圖曰上林有上蘭觀漢平樂觀西域傳元康二月烏孫元貴靡願復尚漢公主天子自臨平樂觀㑹匈奴使者外國君長大角抵設樂而遣之東方朔傳有平樂觀賦後漢李尤賦曰設平樂之顯觀章秘偉之奇珍習禁武以講捷厭不羈之遐鄰彌平原之廣敞處金商之維陬南切洛濵北隣倉山武紀注應劭曰明帝永平五年至長安迎飛廉并銅馬置上西門外名平樂館鄧隲傳涼都畔羌揺蕩西州安帝詔隲將兵擊之車駕幸平樂觀餞之何進傳靈帝講武於平樂觀東京賦其西則平樂都場示逺之觀龍雀蟠蜿天馬半漢瑰異譎詭燦爛炳煥注平樂觀名都謂為大場於上作樂使逺觀之謂之平樂在城西也龍雀飛亷也天馬銅馬也華嶠後漢書曰明帝至長安迎取飛亷并銅馬置上西門平樂觀也西京賦注平樂館大作樂處也漢東觀洛陽宫殿名南宫有東觀漢氏圖籍所在有石渠石室延閣廣内蓄之於外府又有御史掌蘭臺秘書及麒麟天禄二閣藏之於内禁桓帝延熹二年始置秘書監官秩六百石掌典書古今文字攷古今同異屬太常紀和帝永元十三年正月丁丑帝幸東觀覽書林閱篇籍博選藝術之士以充其官注陸機洛陽記曰在南宫髙闕十二間介於承鳳觀安帝永初四年二月乙亥詔謁者劉珍及五經博士校定東觀諸子傳記百家藝術整齊脱誤是正文字和熹鄧太后定策立安帝臨朝政太后自入宮掖從曹大家受經書兼天文算數晝省王政夜則誦讀而患其謬誤懼乖典章乃博選諸儒劉珍等及博士議郎四方掾史五十餘人詣東觀校讐傳記事畢奏御賜葛布各有差又詔中官近臣於東觀受讀經傳以教宫人列傳曹褒章和元年召詣嘉徳門令小黄門持班固所上叔孫通漢儀敕褒今宜依禮條正使可施行於南宫東觀盡心集作黄香元和元年肅宗詔詣東觀讀未見書文苑北海靖王興子復為臨邑侯好學能文章承平中毎有講學事輒令復典掌焉與班固賈逵共述漢史傅毅等皆宗事之復子騊駼及從兄平望侯毅並有才學永寧元年鄧太后詔毅及騊駼入東觀與謁者僕射劉珍著中興以下名臣列士傳劉珍永初中為謁者僕射鄧太后詔使與校書劉騊駼馬融及五經博士校定東觀五經諸子傳記百家藝術整齊脫誤是正文字文苑班昭曹世叔妻兄固著漢書其八表及天文志未竟而卒和帝詔昭就東觀藏書閣踵而成之列女孔僖元和二年校書東觀儒林李尤和帝時侍中賈逵薦尤有相如揚雄之風召詣東觀受詔作賦其賦曰上承重閣下屬周廊前望雲臺後匝徳陽道無隠而不顯書無闕而不陳覽三代而來宜包郁郁之周文又東觀銘曰周氏舊區皇漢實循房闥内布綺疏外陳升降三除貫啓七門是謂東觀書籍林淵列侯弘雅治掌藝文選注引之拜蘭臺令史安帝時為諫議大夫受詔與謁者僕射劉珍等俱撰漢記文苑張衡永初中謁者僕射劉珍校書郎劉騊駼等著作東觀撰集漢記因定漢家禮儀上言請衡參論其事會並卒衡常歎息欲終成之及為侍中上䟽請得専事東觀收拾遺文畢力補綴又條上司馬遷班固所叙與典籍不合者十餘事數上不聽後之著述多不詳典時人追恨之馬融永初四年拜為校書郎中詣東觀典校祕書在東觀十年窮覽典籍竇章少好學有文章與馬融崔瑗同好更相推薦永初中學者稱東觀為老氏臧室道家蓬萊山太僕鄧康薦章入東觀為校書郎注老子為守臧史復為柱下史四方所記文書皆歸柱下言東漢經籍多也蓬萊海中神山為仙府幽經祕籙並皆在焉蔡倫為長樂太僕元初四年帝以經傳之文多不正定選劉珍等詣東觀讎校漢家法令倫監典其事宦者鄧嗣禹之後永夀中與伏無忌延篤著書東觀崔實桓帝時與朱穆邊韶延篤等著作東觀邊韶拜太中大夫著作東觀張奐奏尚書章句詔下東觀盧植能通古今學熹平四年拜九江太守以疾去官作尚書章句三禮解詁時始立太學石經以正五經文字植乃上書願得將能書生二人共詣東觀就官財糧専心硏精合尚書章句考禮記得失庶裁定聖典刋正碑文拜議郎與諫議大夫馬日磾議郎蔡邕楊彪韓說等並在東觀校中書五經記傳補續漢記蔡邕拜郎中校書東觀以經籍去聖人久逺俗儒穿鑿疑誤後學奏求正定六經靈帝許之邕在東觀與盧植韓說等撰補後漢記㑹遭事流離不及得成奏其所著十意分别首目連置章左注猶前書十志也有律歴意一禮意二樂意三郊祀意四天文意五車服意六欲刪定者一接續者四前志所無臣欲著者五髙彪舉孝亷為郎中校書東觀因事諷諫數奏賦頌奇文靈帝詔東觀畫彪像以勸學者文苑陽球奏罷鴻都文學曰今太學東觀足以宣明聖化願罷鴻都之選以消天下之謗酷吏李勝有文才為東觀郎儒林傳孝和數幸東觀覽閱書林初光武遷還洛陽其經牒祕書載之二千餘兩自此以後參倍於前及董卓移都吏民擾亂自辟雍東觀蘭臺石室宣明鴻都諸藏典䇿文章競共剖散其縑帛圖書大則連為帷蓋小乃制為縢囊通典漢東京圖書悉在東觀多使名儒碩學入直東觀撰述國史謂之著作東觀皆以他官領焉班固傅毅以蘭臺令史陳崇以洛陽令尹敏以長陵令孟冀以司隷校尉並著作東觀厯志注袁崧書曰劉洪在東觀與蔡邕共述律厯記五行志注孔叢曰建初元年大旱侍御史孔豐上疏天子納其言三日雨即降拜黄門郎典東觀事崔子玉東觀箴洋洋東觀古之史官左書君行右記其言辛尹顧訪文武明宣倚相見寶荆國以安云云史臣司藝吳華敷傳東觀儒林之府當講校文藝處定疑難漢時皆名學碩儒乃任其職吳有東觀令晉職官志漢東京圖籍在東觀故使名儒著作有其名尚未有官唐百官志後漢東觀藏書之室亦著作之所當時文學之士使校讐其中故有校書之職隋經籍志漢中興於東觀及仁夀閣集新書東觀記一百四十三卷起光武記注至靈帝長水校尉劉珍等撰唐蓺文志正史類劉珍等東觀記一百二一本作三十六卷目録一卷中興書目東觀漢記八卷案隋志一百四十三卷唐吳兢家藏已亡十六卷今所存只鄧禹吳漢賈復耿弇冦恂馮異祭遵蓋延八傳漢記按史通云劉珍李尤作之自建武至永初後伏無忌邊韶崔實繼作百四十篇號曰漢記熹平中馬日磾蔡邕等續修之晉華嶠曰劉向父子世典史籍馬融博通三入東觀唐劉知幾曰古之國史皆出一家未聞藉功於衆唯漢東觀集羣儒纂集無主條章不建漢白虎觀白虎通徳論章紀建初四年十一月壬戌詔曰三代導人教學為本漢承暴秦褒顯儒術建立五經為置博士其後學者精進雖曰承師亦别名家孝宣皇帝以為去聖逾逺學不厭博故遂立大小夏侯尚書後又立京氏易至建武中復置顔氏安樂嚴氏彭祖春秋大小戴禮博士此皆所以扶進微學尊廣道藝也中元元年詔書五經章句繁多議欲減省至永平元年長水校尉儵樊儵奏言先帝大業當以時施行欲使諸儒共正經義頗令學者得以自助孔子曰學之不講是吾憂也又曰博學而篤志切問而近思仁在其中矣於戲其勉之哉於是下太常將大夫博士議郎郎官及諸生諸儒㑹白虎觀西都以名殿杜欽谷永於此對六經之問豈非漢家右文之地歟講論五經同異使五官中郎將魏應承制問侍中淳于恭恭善老子奏帝親稱制臨決如孝宣甘露石渠故事作白虎議奏今白虎通應尚書則丁鴻桓郁魯詩則魏魯恭春秋則楊終公羊則樓望李育古文左氏則賈逵儒林傳建初中大㑹諸儒於白虎詳考同異連月乃罷肅宗親臨顧命史臣著為通義又詔髙才生受古文尚書毛詩穀梁左氏春秋即白虎通義列傳賈逵拜為郎與班固並校祕書應對左右肅宗立降意儒術特好古文尚書左氏傳建初五年詔逵入講北宫白虎觀南宫雲臺使發出左氏傳大義長於二傳者逵於是條奏之曰臣謹擿出左氏三十事尤著明者皆君臣之正義父子之紀綱至如祭仲紀季伍子胥叔術之屬左氏義深於君父公羊多任於權變光武欲立左氏穀梁㑹二家先師不曉圖䜟故中道而廢願陛下留意廢學以廣聖見帝嘉之令逵自選公羊嚴顔髙才生教以左氏與簡紙經傳各一通八年乃詔諸儒各選髙才生受左氏穀梁春秋古文尚書毛詩由是四經遂行於世自建武二年韓歆為費氏易左氏春秋立博士四年正月公卿㑹於雲臺范升力排左氏費氏時陳元立左氏帝以李封為左氏博士封卒復廢賈逵亦通左氏學永平中上左氏傳國語解詁五十一篇明帝令藏祕館肅宗好古文尚書左氏傳建初中詔賈逵入講北宫白虎觀南宫雲臺逵言劉氏為堯後左氏有明文與圖䜟合又言古文尚書當立建初八年乃詔諸儒各選髙才生授左氏穀梁春秋毛詩尚書由是四經行於世繼立學官然皆立髙第為講郎給事楊終肅宗時為校書郎言宣帝博徵羣儒論定五經於石渠閣方今天下少事學者得成其業而章句之徒破壊大體宜如石渠故事永為後世則於是詔諸儒於白虎觀論攷同異焉魏應習魯詩建初四年拜五官中郎將肅宗甚重之時㑹京師諸儒於白虎觀講論五經同異使應専掌難問淳于恭奏之帝親臨稱制如石渠故事儒林丁鴻兼射聲校尉肅宗詔鴻與廣平王羨及諸儒樓望成封桓郁賈逵等論定五經同異於北宫白虎觀鴻以才髙論難最明諸儒稱之帝數嗟焉時人歎曰殿中無雙丁孝公注廣平王羨明帝子也東觀記曰與太常樓望少府成封屯騎校尉桓郁衛士令賈逵等集議也白虎門名於門立觀因以名之焉李育為博士建初四年詔與諸儒論五經於白虎觀育以公羊義難賈逵皆有理證號為通儒儒林魯恭習魯詩肅宗㑹諸儒白虎觀特以經名得召與與預同其議班固為玄武司馬天子㑹諸儒講論五經作白虎通徳論令固撰集其事書凡十卷四十四門爵號禮樂巡狩情性衣裳三綱六紀五刑三軍之事悉備廣平王羨博涉經書有威嚴建初四年與諸儒講論於白虎殿清河王慶永元四年帝移幸北宫章徳殿講白虎觀慶得入省宿止蔡邕封事孝宣㑹諸儒於石渠章帝集學士於白虎明紀永平三年起北宫八年十月北宫成鄧后紀有北宫増喜觀漢聽訟觀晉刑法志光武中興留心庶獄常臨聽獄訟躬決疑事明帝即位常臨聽訟觀録洛陽諸獄帝性既明察能得下姦故尚書奏決近於煩碎漢長樂觀髙彪傳靈帝時京兆第五永為督軍御史使督幽州百官大㑹祖餞于長樂觀議郎蔡邕等皆賦詩彪獨作箴鼎中觀陸機洛陽地記洛陽南宫有承風觀北宫有增喜觀城外有宣陽觀千秋鴻地泉城揚威石樓等觀城外有鼎中觀輿地志洛陽西南洛水上有鼎中觀是成王定鼎處後漢有承禄觀清河王慶居之魏聽訟觀魏志明帝太和三年十月改平望觀為聽訟觀帝常言獄者天下之性命毎斷大獄常幸觀臨聽之又置律博士水經注自天淵池東出華林園逕聽訟觀南觀西北接華林隷簿魏總章觀崇文觀魏志明帝青龍三年三月大治洛陽宫築總章觀髙十餘丈建翔鳳於上四年四月置崇文觀召善屬文者充之王肅領秘書監兼崇文觀祭酒荀朂檢校大樂總章鼔吹八音洛陽宫殿簿總章觀閣十三間王元長曲水詩序協律總章之司厚倫正俗崇文成均之職導徳齊禮文選景福殿賦碣以髙唐崇觀表以建城峻廬注二觀名輿地志洛陽有廣望閬風臨商觀夏侯惠景福殿賦高樓承雲列觀若浮魏凌霄觀魏志明帝作凌霄觀華延雋洛陽記洛陽城十八觀洛中記有昌都觀東北有百尺樓魏都水使者陳熙造魏紀勲觀五代史魏賞彭陽之功别創紀勲之觀齊旌泗水之績乃崇嘉徳之樓晉聽訟觀後魏東明觀武帝紀泰始四年十二月庚寅臨聽訟觀録囚徒親平決焉五年春正月丙申帝臨聽訟觀録囚徒多所原遣十年六月癸巳臨聽訟觀録囚徒多所原遣元帝紀大興元年十一月庚申新作聽訟觀陸機洛陽地記宫中有臨髙陵雲宣曲廣望閬風萬世修齡總章聽訟凡九觀皆髙十六七丈雲毋窗日曜之有光後魏史太和十五年五月於東明觀太和四年十月改作折疑獄符堅置聽訟觀於未央之南宋延賢堂聽訟見堂類晉宣武觀武帝紀泰始九年十一月丁酉臨宣武觀大閱諸軍甲辰乃罷十年十一月庚午帝臨宣武觀大閱諸軍咸寧元年十一月癸亥大閱於宣武觀三年冬十一月丙戌帝臨宣武觀大閱太康四年十二月庚午大閱於宣武觀一本此年六月又閱宣武觀前後凡五閱若是五閱則别本十年及此六月者非當攷禮志武帝泰始四年九月咸寧元年太康四年六年皆自臨宣武觀大閱衆軍一本泰始元年十一月庚午帝臨觀十一年十一月咸寧元年十一月癸亥三年冬十一月大閱於宣武觀山濤傳武帝常講武於宣武塲濤時有疾詔乘步輦從因與盧欽論用兵之本以為不宜去州郡武備時咸以濤不學孫吳而闇與之合帝曰天下名言也而不能用禮志元帝大興四年詔左右衛及諸營教習依大習儀作雁羽仗水經注其一水自大夏門東逕宣武觀宋紀文帝元嘉五年正月甲申臨玄武館閱武陳紀宣帝大建十一年八月丁卯幸大壯館閱武吳有白爵觀蜀李輔討破羌虜築平羌觀於秦亭宋通天觀建康宫闕簿通天觀在縣東北五里一百步舊臺城内宋元嘉中築二十三年更修廣之造景陽樓大壯觀又立鳳光殿醴泉堂建業宫有迎風觀宋大明中起宋總明觀東觀南史明帝泰始六年九月戊寅立總明觀召學士以充之置東觀祭酒訪舉各一人學士二十人分為儒道文史隂陽五部學言隂陽者遂無其人以國學廢初置總明觀祭酒一人王儉傳明帝置總明觀以集學士或謂之東觀置東觀祭酒一人總明訪舉郎一人儒玄文史四科科置學士十人令史以下各有差齊紀永明三年五月乙未省總明觀志建元中掌治五禮永明三年國學建省傳王諶領東觀祭酒即明帝所置總明觀也虞愿領東觀祭酒司馬憲待詔東觀為學士齊武帝築商飈觀梁立曾城觀更起重閣後周崇文觀通道觀北史明皇尚學藝内有崇文之觀外重成均之職握素懐鈆重席解頥之士間出於朝廷員冠方領執經負笈之生著録於京邑武帝紀建徳三年六月戊午立通道觀唐宗聖觀元和志樓觀在盩厔縣東三十二里本周康王大夫尹喜宅也穆王為召幽逸之人置為道士相承至秦漢皆有道士居之晉恵帝時重置其地舊有尹先生樓因名樓觀武徳初改名宗聖觀事具樓觀本記及先師傳紀武徳七年十月丙子謁樓觀老子祠唐明義觀見大明宫唐兩觀百官志御史大夫正百官班序遲明列於兩觀禮閽人疏魯有三門雉門有兩觀為中門天子五門雉門亦為中門有兩觀顔真卿象魏賦濬重門於北極聳雙闕以南敞唐明堂四門八觀㑹要永徽二年七月詳定明堂門闕制度三年六月二十八日有司奏方垣四門去堂步數准太廟南門仍立四門八觀依太廟别各安三門施元閫四角造三重巍闕後以制度未定而止唐紫雲觀舊紀乾封元年正月丁丑兖州置紫雲仙鶴萬嵗三觀封巒非烟重輪三寺唐望仙觀武宗紀㑹昌三年夏通鑑五月作望仙觀於禁中元稹集云玉晨觀在紫宸殿後祥符元符觀元年正月戊辰改左承天門為左承天祥符門以天書降故也上梁日車駕親臨以御製大中祥符頌刻石門側七年十二月己未一作庚申詔以左承天祥符門内新建觀宜以元符為名帝自製序九月建資善堂於南先是毎嵗天慶節就右承天祥符門内設幄陳供為天書道塲以車駕往來喧雜後命葺皇城司廨宇為之天禧二年常宴從臣于此其詳見御製資善堂記内資善堂即觀九年五月庚戌以御製元符觀頌刻石在承天祥符門次西北廊天禧元年與宗室宰相臨幸歴覽觀中丹竈藥金寶器之品上作洞天記燒藥殿賛示之四年正月十七日詣元符觀幸資善堂後罷之併入皇城司歴代觀名前漢屬玉青相後漢平樂長平魏髙昌廣望總章西晉宣武後魏涼風宣慈代臨望代東明代慿雲隋崇安太微宣平紫微飛雲臨霄永泰瓊林霞輝含華飛芳相風通真栖霞後周通道三十六國聽訟融明宣武戲馬酆明御龍如意凌霄六朝北辰含章乾陽朱明昇陽司元望善威明威懐信明仁風臨滄商飊齊雲通天曾城甲陳麗日大壯北齊望秋宣風東明臨春漢宫殿名長安有臨仙渭橋仙人霸昌蘭池平樂九華豫章三章昆明走馬華光封巒走狗天梯瑤臺㳅渠相思長平宜春華池射熊迎風露寒三輔黄圖武帝起鳷鵲神明集靈陽禄府禮注百官所居曰府又曰府治藏府聚也周百官府盟府見古官名周䇿府記府穆天子傳天子北征還癸巳至於羣玉之山即山海經玉山西王母所居四徹中繩容氏所守先王所謂䇿府注古帝王藏書策之府史蒙恬傳周公旦書而藏之記府成王觀於記府得周公旦書晉故府又見周日正周祕府文選七命云云注風俗通曰秦周常以八月輶軒使採異代方言藏之秘府漢兩府四府五府三公府司徒府司空府大尉府列傳杜延年嘗與兩府及廷尉分章注如淳曰兩府丞相御史府也為御史大夫居父官府不敢當舊位坐臥皆易其處丙吉曰以三公之府有案吏之名吾竊陋焉公府不案吏自吉始翟方進為丞相司直故事司隷校尉位在司直下初除謁兩府趙充國為後將軍詔舉可䕶羌校尉者四府舉辛湯充國奏不可後五府復舉湯薛宣為少府谷永上䟽曰宣為左馮翊衆職修理辭訟者歴年不至丞相府考績功課簡在兩府段㑹宗竟寧中五府舉為西域都護王商以特進領城門兵得舉吏如五府申屠嘉坐府中為檄召鄧通詣丞相府張湯為寗成掾以湯為無害言大府調茂陵尉注師古曰大府丞相府也趙禹為丞相史周亞夫曰文深不可以居大府張安世聞有詔令使吏之丞相府問劉徳待詔丞相府匡衡封樂安鄉十餘嵗封臨淮郡郡上計簿更定圖言丞相府陳遵張竦並入公府曹參為丞相相舍後園近吏舍髙祖紀十一年二月詔其有意稱明徳者遣詣相國府署行義年後明帝紀永平三年起北宫及諸官府後百官志太尉公司徒公司空公各一人注古今注曰永平十五年更作太尉司徒司空府開陽城門内漢官儀曰明帝欲更太尉府時公趙熹也西曹掾鄭均以為朝廷造北宫整官寺旱魃為虐民不堪命曾無商湯六事周宣雲漢之辭今府本館陶公主第舍員職既少自足相受熹表陳之其冬臨辟雍歴二府見皆壯麗而太尉獨卑陋云蔡質漢儀曰司徒府與蒼龍闕對厭於尊者不敢號府應劭曰不然丞相舊位在長安時府有四出門隨時聽事明帝欲依之迫於太尉司空但為東西門耳荀綽晉百官表注曰漢丞相府門無闌不設鈴不警鼓深大廣逺無節限也後厯志熹平四年乙卯詔書下三府與儒林明道者詳議以羣臣㑹司徒府議後傳趙典建和初四府表薦注四府太尉司徒司空大將軍府也虞詡曰宜令四府九卿各辟數人注四府謂太傅太尉司徒司空之府也郎顗曰今選舉牧守委任三府王堂永初中三府舉堂治劇拜巴郡守种暠羊續杜撫辟太尉府朱浮光武用明察不復委任三府而權歸刺舉之吏浮上疏曰覆案不闗三府陳紀四府並命弟諶與紀齊徳並行父子並著髙名毎宰府辟召常同時旌命羔雁成羣陳球辟公府楊震曰三府辟召宜有尚書敕蔡邕封事臣自在宰府謂司徒橋玄府宰府孝亷士之髙選左雄上疏吏職滿嵗宰府州郡乃得辟舉又言孝廉先詣公府副之端門黄瓊五府俱辟徐璆辟公府應奉四府舉才堪將帥劉陶桓帝時或言改鑄大錢事下四府羣僚陶議曰云云應劭為車騎將軍掾中平二年北軍中候鄒靖上言宜開募鮮卑事下四府劭駮之盧植四府選才兼文武韓韶辟司徒府尚書選三府掾能理劇者以韶為嬴長韓融五府並辟鍾皓辟司徒府九辟公府黄憲辟公府徐穉屢辟公府董扶宰府十辟范冉三府辟雷義陳重三府同時俱辟寒朗詔三府為辟首由是辟司徒府袁安永平十四年三府舉能理劇賈琮為京兆令中平元年特敕三府精選能吏有司舉琮為交趾刺史范滂為太尉所辟後詔三府掾屬舉謡言滂奏云云何顒辟司空府毎三府㑹議莫不推顒之長鄭太三府辟不就李雲延熹二年露布上書移副三府劉淑五府連辟延篤五府並辟召馴董鈞辟司徒府周澤辟大司馬府趙孝永平中辟太尉府王琳辟司徒府郝絜等連名奏記三府薦海内髙士郭躬辟公府南蠻傳永和三年召公卿百官及四府掾屬問方畧大將軍從事中郎李固駮曰宜更選刺史四府悉從固議周禮小宗伯注肄儀若今時肄司徒府也朝士注今司徒府有天子以下大㑹殿槁人注今司徒府中有百官朝㑹之殿左傳注如今計獻詣公府卿寺疏自漢以來三公所居謂之府九卿所居謂之寺風俗通曰府聚也公卿牧守府道徳之所聚也藏府私府財貨之所聚也寺司也庭有法度今官所止皆曰寺唐㑹要魏玄同上表曰漢家云云州郡積其功能然後為五府所辟五府舉其掾屬而昇於朝三公參得除授尚書奏之天子一人之身所闗者衆一賢之進其課也詳晉紀咸康元年三月乙酉幸司徒府時王導為司徒漢祕府書府藝文志諸子傳説皆充祕府書序孔安國悉上送官藏之書府書正義職方在周禮出於山巖屋壁即藏祕府孔君為武帝博士於祕府而見焉劉歆書曰古文舊書多者二十餘通藏於祕府伏而未發馬融頌發天府之官常漢樂府百官表少府屬官有樂府令丞禮樂志武帝立樂府采詩夜誦有趙代秦楚之謳内有掖庭才人外有上林樂府紀宣帝本始四年正月詔樂府減樂人使就農王吉言宜減樂府明化天下以儉元帝初元元年六月減樂府員以振困乏竟寧中少府召信臣奏省樂府黄門倡優諸戲哀帝即位綏和二年六月罷樂府李夫人傳上武帝作詩令樂府諸音家絃歌之霍光傳昌邑王發樂府樂器史記孝恵文景無所増更於樂府習常隷舊而已張放傳樂府音監景武監主樂人也樂府游徼文選古樂府注武帝立樂府采齊楚趙魏之聲兩都賦序外興樂府協律之事注聚樂之所大事記元狩二年夏立樂府師古曰武帝始置樂府之名蓋起於此然恵帝時已有樂府令夏侯寛見志後律志京房知六律雜試於樂府五行志成周宣榭所以藏樂器晉志翼二十二星主天之樂府晉紀泰始元年十二月乙亥禁樂府靡麗百戲之技漢莫府列傳李廣行無部曲行陳莫府省文書大將軍令長史封書與廣之莫府長史急責廣之莫府上簿注以軍幕為府古字通用軍旅無常居故以帳幕言之廉頗李牧市租皆入幕府馮唐曰魏尚上功莫府張安世為衛將軍莫府長史遷辭去之官安世問以過失趙充國中郎將卬入莫府司馬中亂屯兵霍光為大將軍燕王言光擅調益莫府校尉楊敞給事大將軍莫府為軍司馬田延年給事大將軍莫府遷為長史酷吏蔡義以明經給事大將軍莫府鄭吉中西域而立莫府陳湯大將軍鳳奏以為從事中郎莫府事壹決於湯匡衡元帝初楊興説車騎將軍史髙召衡置莫府與參事議朱博為郡功曹大將軍王鳳奏請陳咸為長史咸薦蕭育朱博除莫府屬杜欽召詣大將軍莫府張放為侍中中郎將監平樂屯兵置莫府儀比將軍凡將兵皆有莫府佞幸後傳吳漢至莫府上兵簿李充為侍中鄧隲曰幕府初開欲辟天下竒偉獨行班固永平初奏記驃騎將軍東平王蒼曰幕府新開廣延羣俊竇憲以班固傅毅置幕府典文章崔爰大將軍梁商初開莫府首辟之漢御史府朱博傳成帝時何武為九卿建言宜建三公官於是以御史大夫何武為大司空是時御史府吏舍百餘區井水皆竭又其府中列柏木常有野烏數千棲宿其上晨去暮來號曰朝夕烏烏去不來者數月長老異之後二嵗餘朱博為大司空奏髙帝置御史大夫位次丞相典正法度以職相參總領百官上下相監臨臣願盡力以御史大夫為百僚率從之通典漢御史所居曰御史府亦曰御史大夫寺在大司馬門内無塾其門用梓板不雘色亦謂之憲臺後漢謂之御史臺蘭臺寺漢舊儀御史大夫寺在司馬門内門無塾門署用梓板不起郭邑題曰御史大夫寺漢宗正府宣帝紀云云漢記府鹽鐵論結和第四十三大夫曰漢興以來修好結和親先帝廣將帥招奮擊以誅厥罪功勲粲然著於海内藏於記府漢太常府桓榮傳榮為太常年踰八十乘輿嘗幸太常府令榮坐東面設几杖後厯志於太常府覆校注記平議難問晉祕府隋志晉世祕府所存有古文尚書經文唐書府内府褚亮傳圖賛十八學士藏之書府魏徵傳作類禮二十篇帝美其書録寘内府唐雲韶府志武徳後置内教坊於禁中武后如意元年改曰雲韶府以中官為使熙寧東西府嘉祐中孫坦請為兩府治第以便詔召神宗即位集賢學士髙賦亦言之熙寧三年九月二十六日癸丑作東西府一本七月作於掖城之南凡八位總千二百楹東府第一位一百五十六間餘各一百五十三間明年秋八月東西府成命知制誥陳繹為之記畧曰國朝襲李唐故大臣不及建地而僦居古之公卿入則相與謀於朝出則相與謀於家今未明而入進見請決於陛席之前退而百執事叩閤稟事吏持書奏周走閭巷終日不得與二三大臣謀乃出聖畫親剏二府度地於闕之西南輪廣方制房皇鉤折繪圖以聞即刋定於禁中自熈寧二年秋七月興作云云出則寵之淑旂綏章鉤膺之駕入則具之列鼎蒲筵粉純之居仰而視其宫則有榱題之礱宻俯而攝其衣則有衮舄之嚴麗不如是不足以待其人非其人不足以相天下之政九月二十六日丁未幸新作東西府亦為三司使薛向治公廨十月丁巳賜宴於王安石位始遷也元祐三年四月辛巳右僕射吕公著拜司空同平章軍國事一月三赴經筵二日一朝因至都堂議事於是建府於東府之南啓北扉以便宰執㑹議三省宻院條列所當闗者目曰軍國事以三公平章者四人二人公著父子也紹興二十六年正月九日建執政府三位癸丑令遷入二十六日建左右相第於都省北元豐文昌府唐尚書省圖元豐五年官制初行七月新省成掲牓曰文昌府㑹要作六年十月庚子成十一月十九日幸前為都省令㕔在中僕丞分左右六曹列於後東西向合三千一百間有竒崇寧三年六月二十九日家安國上得唐都省圖六曹在前遂遷舊七寺監更建後宰執往往賜第㑹要安國言神宗得唐制尚書省圖按視已有意改作詔将作監繪圖修建政和四年四月五日駕幸尚書省周邦彦汴都賦其次則有文昌之府分省為三列寺為九殊監為五左選為文右選為武曰三十房二百餘案二十四部黜隋之陋更唐之故合千司之離散儼星羅於一宇崇寧大晟府崇寧初議大樂四年八月二十七日賜名大晟置府建官府在宣徳門外天街之東隷禮部以大司樂典樂為長貳次曰大樂令主簿協律郎工有樂正至舞師宣和七年十二月罷玉海卷一百六十六
