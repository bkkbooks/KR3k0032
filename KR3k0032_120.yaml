body:
  text: 玉海卷一百二十宋王應麟撰官制三公宰相三公參天子坐而議政無不總統故不以一職為官後世宰相兼三公之事伏羲六佐燧人四佐陶淵明集聖賢羣輔録金提主化俗鳥明主建福視黙主災惡紀通為中職仲起為海陸陽侯為江海右伏羲六佐見論語擿輔象明由必育成博隕丘右燧人四佐黄帝六相三公管子五行篇黄帝得六相而天下治神明至蚩尤明天道故使為當時太常察地利故使為廩者奢龍通典注作蒼龍辨東方為土師祝融辨南方為司徒大封辨西方為司馬后土辨北方為李獄官也晉志黄帝置三公之秩以親黎元事始黄帝以風后配上台天老配中台五聖配下台為三公也後漢張衡傳注帝王紀云云三文選東京賦注鄭玄曰風后黄帝公也通典黄帝六相為之輔相不必名官外紀黄帝舉風后力牧太山稽常先大鴻得六相而天地治神明至蚩尤外紀作風后羣輔録論語擿輔象黄帝七輔風后至力牧黄帝侍中晉志黄帝時風后為侍中通典云出兵家䜟緯不足證也周禮疏易通卦驗云君有五期輔有三名注三名公卿大夫伏羲已前雖有三名至黄帝名位乃具堯百揆九佐三公舜典納于百揆揆度庶政之官周禮疏周官云唐虞内有百揆堯初天官為稷至堯試舜天官之任謂之百揆舜命禹為之即天官也戰國䇿顔斶云堯有九佐淮南子堯之佐九人禹臯稷契夷垂益䕫龍文子堯之治天下也舜為司徒契為司馬禹為司空注三公之官舜十六相左傳文十八年髙陽氏才子八人蒼舒隤敳檮戭大臨尨降庭堅仲容叔達注此即垂益禹臯陶之倫謂之八愷髙辛氏才子八人伯奮仲堪叔獻季仲伯虎仲熊叔豹季貍注此即稷契朱虎熊羆之倫謂之八元愷和元善也舜臣堯舉八愷使主后土以揆百事莫不時序地平天成舉八元使布五教于四方内平外成舜舉十六相十六族世濟其美舜四輔書欽四鄰注四近前後左右之臣予違汝弼汝無面從臣哉鄰哉史記禹紀帝曰汝無面諛退而謗予予敬四輔臣注尚書大傳古天子必有四鄰前疑後丞左輔右弼荘子舜問平丞又見後家語舜左禹右臯陶不下席而天下治湯二相三輔晉志成湯居亳初置二相以伊尹仲虺為之左傳仲虺為湯左相正義以諸侯相天子宋志湯以伊尹為右相孟子注亦云相伊尹號阿衡太甲時伊尹為太保伊尹湯之也仲虺時佐伊尹者故曰左相戰國䇿湯有三輔詩正義阿衡保衡皆公官言卿士者三公兼卿士也書髙宗得傅説爰立作相置諸左右墨子武丁得傅説舉以為三公通典大師古官殷時箕子三公三少書周官立太師太傅太保兹惟三公論道經邦爕理隂陽少師少傅少保曰三孤貳公弘化寅亮天地弼予一人周公為師召公為保相成王為左右通典文王時太公武王時周公畢公為太師成王時畢公為太傅召公為太保逸禮曰太公為太師周公為太傅召公為太保公羊傳天子三公者何天子之相也天子之相何以三自陜而東周公主之自陜而西召公主之一相處乎内詩三事左傳王使委於三吏注三公也漢賈誼傳成王幼召公為太保周公為太傅太公為太師保保其身體傅傅其徳義師道之教訓此三公之職也於是為置三少皆上大夫也曰少師少傅少保是與太子宴者也漢表記曰三公無官言有其人然後充之舜之於堯伊尹於湯周召於周是也或説司馬主天司徒主人司空主土是為三公周禮疏周三公各兼一卿之職詩常武太師皇父正義以三公兼卿士之官周四輔書洛誥誕保文武受民亂為四輔注為我四維之輔疏周公事無不統故一人為四輔禮記文王世子云云曰虞夏商周有師保有疑丞設四輔及三公不必備惟其人語使能也正義案尚書大傳古者天子必有四鄰作記者取以成世子之記大戴禮保傅篇明堂之位曰篤仁而好學多聞而道順天子疑則問應而不窮者謂之道道者導天子以道者也常立於前是周公也誠立而敢斷輔善而相義者謂之充充者充天子之志也常立於左是太公也絜㢘而切直正過而諫邪者謂之弼弼者弼天子之過者也常立於右是召公也博聞强記捷給而善對者謂之承承者承天子之遺忘者也常立於後是史佚也故成王中立而聴朝則四聖維之是以慮無失計舉無過事殷周之長久其輔翼天子有此具也注立道於前處承於後置充於左列弼於右順名義也道者有疑則問或謂之疑充者輔善或謂之輔竇憲上疏引大戴之文見後漢谷永傳四輔既備成王靡有過事注師古曰謂輔弼疑丞尚書大傳天子必有四鄰前曰疑後曰丞左曰輔右曰弼天子有問無以對責之疑有志而不志責之丞可正而不正責之輔可揚而不揚責之弼其爵視卿禄視次國之君孔叢子孟懿子問書欽四鄰孔子曰前疑後丞左輔右弼謂之四近周文王胥附奔輳先後禦侮謂之四鄰後漢翟酺傳昔成王之政周公在前召公在後畢公在左史佚在右四子挾而維之目見正容耳聞正言一日即位天下曠然言其法度素定也桓郁傳竇憲上疏曰禮記云昔成王幼小越在襁褓周公在前史佚在後太公在左召公在右中立聽朝四聖維之是以慮無遺計舉無過事孝經天子有争臣七人鄭注七人謂三公及疑丞輔弼師保謂之三公充其數則有傅疑丞謂之四輔充其數則有輔弼公羊謂二伯為相而一相處乎内彼徒見周召分陜之時周公處乎内而召公處乎外所謂召伯之教明於南國是也周召相成王為左右之時召公處乎内而周公處乎外所謂周公初于新邑洛是也殊不知召公畢公並為二伯以相康王之時召公為冡宰畢公為司馬曷嘗不並立於王朝乎至康王十有二年命畢公保釐東郊以代君陳於是畢公處乎外而代周公為東伯則亦久矣太保率西方諸侯畢公率東方諸侯漢丞相相國大司徒表相國丞相皆秦官金印紫綬掌丞天子助理萬機秦有左右悼武王二年始置丞相以樗里疾甘茂為左右始皇尊吕不韋為相國二世又有中丞相荀悦曰秦本次國命卿二人是以置左右相無三公官秦以左為上漢以右為尊髙帝置丞相十一年更名相國緑綬表髙九年丞相何遷為相國孝恵六年髙后元年置左右丞相文元帝八月辛未右丞相勃免位第一左丞相平専為丞相位第二自是専置一相西漢丞相再入者惟周勃孔光二人右髙三年以韓信為左丞相曹參樊噲左酈商皆借此名以出軍尹恢以右丞相守淮陽兩長史秩千石哀元夀二年五月甲子更名大司徒武元狩五年初置司直秩比二千石掌舉不法征和二年雖詔分丞相長史為兩府以劉屈氂為左丞相然右相未嘗拜也續志司徒公一人掌民事世祖初為大司徒鄧禹二十七年五月丁丑去大注府中有百官朝㑹殿崔駰司徒箴敬敷五教九徳咸事徒臣司衆隋志干寳司徒儀一卷亡翟方進奏春秋之義尊上公謂之宰海内無不統焉丞相進見聖主御坐為起在輿為下陳忠薦劉愷曰往者孔光師丹近世鄧彪張酺皆去宰相復序上司漢太尉大司馬表太尉秦官金印紫綬掌武事月令注亦曰秦官太三王之官有司馬無尉賢尚書中侯舜為太尉置月令孟夏命太尉贊俊傑遂良史髙后紀四年太尉官絳侯勃為太尉表髙帝五年太尉盧綰十一年周勃後官省孝恵六年勃復為太尉紀文帝三年十一月罷太尉官屬丞相景帝紀云三年正月遣太尉亞夫擊七國七年二月罷太尉官武建元二年省黄覇傳宣帝曰太尉官罷久矣丞相兼之偃武興文也籍福曰太尉相尊等耳元狩四年初置大司馬以冠将軍之號衛霍将後元二年三月丁卯霍光大軍票騎将軍皆為大司馬宣地節三年置大司馬不冠将軍亦無印綬官屬張安世韓増許延夀史髙成綏和元年初賜大司馬金印紫綬置官屬禄比丞相去将軍哀建平二年復去印綬官屬冠将軍如故元夀二年復賜印綬置官屬去将軍位在司徒上有長史秩千石續志太尉公一人世祖即位為大司馬吴漢行劉隆大司馬建武二十七年五月丁丑改為太尉太尉古官也自上安下曰尉故武官以為號三中平六年劉虞為大司馬與太尉並置府門無闕公以災異䇿免自太尉徐防始魏黄初二年始罷此例府趙憙初拜太尉帝令典邊事永平八年行太尉事居如真楊震至彪四世靈帝中平三年遣使者就長安拜張温為太尉三公在外自温始崔駰太尉箴師錫有帝命虞作尉春秋合成圗曰堯坐中舟與太尉舜臨觀鳯皇授圗茍非其人斁我帝載書中候曰舜為太尉劉昭以為追稱非實號也宰臣司馬宋志魏黄初二年復置大司馬曹仁居之而太尉如故唐㑹昌四年八月戊申李徳裕拜太尉見後漢御史大夫蘭臺大司空漢定三公官表御史大夫秦官位上卿應劭曰侍御史之率故稱大夫云臣瓉曰茂陵書御史大夫秩中二千石銀印青綬掌副丞相有兩丞秩千石髙帝元年周苛四年周昌十年趙堯遷十一年二月詔御史大夫昌下相國掌命令大夫丞相自文四年張蒼始後二年申屠嘉史宣地節二年詔御大夫相給事中一曰中丞在殿中蘭臺掌圗籍祕書外督部刺史内領侍御史員十五人受公卿奏事舉劾案章成帝綏和元年更名大司空金印紫綬禄比丞相哀帝建平二年復為御史大夫元夀二年復為大司空御史中丞更名御史長史侍御史有繡衣直指出討姦猾治大獄武帝所制不常置通典漢御史所居曰御史府亦曰御史大夫寺晉志端門西曰右執謹御史大夫之象亞相宰相之副九卿之名蕭望之傳故事朝奏事㑹庭中差居丞相後馮野王傳御史大夫在位多舉野王上使尚書選第中二千石而野王行能第一詔繇下第用張譚越次避嫌薛宣傳谷永上疏曰御史大夫内承本朝之風化外佐丞相統理天下任重職大今當選於羣卿以充其缺宣考績功課簡在兩府遂以宣為大夫續志司空掌水土凡營城邑浚溝洫修墳防之事則議其利建其功世祖為大司空二十七年五月丁丑去大班固傳注引揚雄司空箴官臣司土通典漢制常以列侯為相唯公孫弘布衣數年登相位乃封為平津侯其後為故事至丞相而封自弘始後漢以三公綜理衆務中年以後事歸臺閣則尚書官為機衡之任論道之官備員而已獻帝建安十三年復置丞相而以曹公居之又有相國魏黄初元年改為司徒建武二十七年省大司馬以太尉代之故常與太尉迭置不並列吳漢為大司馬至靈帝末始置獻帝建安十三年罷司空置御史大夫紀六月罷三公官置丞相御史大夫魏初又置司空應劭漢官儀載建武迄初平三公名一百四十五人哀紀元夀二年五月甲子正三公官分職董賢為大司馬孔光為大司徒彭宣為大司空孔光傳定三三公官光更為大司徒光武紀建武元年七月辛未鄧禹為大司徒丁丑王梁為大司空赤伏符曰王梁主衛作玄武帝以玄武水神司空水土之官乃拜梁大司空從縣宰超拜陳邳彤行大司空事袁竇融寵朱浮牟融宋弘安壬午吳漢為大司馬二十七年五月丁丑詔曰昔契作司徒禹作司空皆無大名其今二府去大又改大司馬為太尉以大僕趙憙為太尉大司農馮勤為司徒列傳朱祐奏宜令三公並去大名遂從其議東平王蒼為驃騎将軍置長史掾史員四十人位在三公上自以至親輔政上疏歸職曰自漢興以來宗室子弟無得在公卿位者劉愷陳忠薦愷曰三公上則台階下象山岳春秋漢含孳曰三公象五岳在天法三台股肱元首鼎足居職協和隂陽調訓五品往者孔光師丹近世鄧彪張酺皆去宰相復序上司詔引愷拜太尉楊秉曰漢世故事三公之職無所不統仲長統曰光武矯枉過直雖置三公事歸臺閣徐防為太尉凡三公以災異䇿免始自防永初元年九月庚午漢官目録太常光禄衛尉三卿太尉所部太僕廷尉大鴻臚三卿司徒所部宗正大