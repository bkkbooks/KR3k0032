府皆從詡議永和三年令大将軍三公各舉故刺史二千石及四府掾屬建和初四府薦趙典是時皆缺太傅故章懐注典傳云太尉司徒司空大将軍府也然詡傳注又謂太傅太尉司徒司空者盖未深究當時爾丙吉曰夫以三公之府有案吏之名吾竊陋焉後人代吉因以為故事唐韋嗣立景龍中曰古者取士先鄉曲之譽然後辟於州州已試然後辟五府五府著聞乃升諸朝漢宰士司直公府掾表丞相有兩長史秩千石田仁為長史請先刺舉三河征和二年分丞相長史為兩府臣吕歩舒為朱買黄覇亦之武元狩五年初置司直秩比二千石掌佐丞相舉不法漢舊儀司直督刺史譬若以史魚為司直東方朔曰平帝召金欽為大司馬司直漢舊儀武帝元狩五年初置列傳龔勝為司直郡國皆謹選舉翟方進為司直丞相御史請遣掾史與司隷部刺史并力逐捕司隷校尉涓勲奏言臣幸得奉使以督察公卿已下為職今丞相宣請遣掾史以宰士督察天子奉使命大夫甚悖逆順之理平當奏言方進國之司直師丹何武平當蕭望之孫寳郭欽緐延夀皆為丞相司直哀紀元夀二年五月正司直職鹽鐵論丞相史曰春秋士不載文而書咺者以為宰士也文學曰處宰士之列無忠正之心周官大宰之屬有上中下士公羊所謂宰士隠元年傳宰咺後周榮傳榮辟司徒府今得備宰士丞相史尹咸張湯李尋卓茂孫禁嚴安少史王夀王禁從史匡衡傳丞相掾嚴延年西曹掾蕭由集曹掾奏曹陸賜匡衡傳議曹李尋為鍾離意司徒議曹侍曹陳遵傳大車屬鄭崇如淳曰如今之公府御屬屬朱贛續志太尉長史一人千石盧植禮注曰如周小宰書諸曹事掾史屬二十四人溝洫志太尉史張戎漢儀注秩四百石大司馬召揚雄為門下史正曰掾副曰屬漢舊注東西曹掾比四百石餘掾比三百石屬比二百石故曰公府掾比古元士三命者也或曰漢初掾史辟皆上言之故有秩比命士其所不言則為百石屬其後皆自辟除故通為百石云司徒長史一人千石橋玄吳良劉寛為之掾屬三十一人漢官目録三十人令史及御屬三十六人世祖即位以武帝故事置司直居丞相府助督録諸州建武十一年四月丁卯省宣秉王良杜林為大司徒司直伏湛為司直行大司徒事注建安八年十二月復置司直不屬司徒掌督中都官不領諸州九年十一月詔司直比司隷校尉坐同席在上中平六年令三府長史兩梁冠五時衣袍事位從千石六百石馬嚴傳故事州部所舉上奏司直察能否以懲虚實省吳良為司徒長史處大議據經典注建武十一年司直置長史王允以司徒髙第為侍御史司空屬長史一人千石令狐略江革掾屬二十九人漢官目録二十四人令史及御屬四十二人太尉掾議曹應劭西曹鄭均司徒掾云敞班彪第五種鍾皓蔡邕史鮑恢司空掾何武除鮑宣西曹趙岐應珣何並屬陳寔司空祭酒陳元太尉議曹祭酒周澤大司馬長史谷永房鳯大司馬議曹祭酒周澤大司馬屬任延光武為大司馬石李章置東曹屬從事郎中王音以毋将隆為之西曹主府史除用東曹主二千石長吏遷除及軍吏户曹主民户祠祀農桑奏曹主奏議事辭曹主辭訟事司徒鮑昱辟陳寵為之法曹主郵驛科程事尉曹主卒徒轉運賊曹主盜賊決曹主罪法兵曹主兵金曹主貨幣鹽鐵倉曹主倉穀丙吉傳西曹主吏白欲斥馭吏陳遵傳西曹以故事適之大将軍王鳯除蕭育功曹大司馬史髙辟匡衡為議曹史黄閣主簿録省衆事大司馬商除杜鄴主簿令史及御屬二十三人漢舊注公令史百石御屬主為公御閤下令史主威儀記室令史主上章表報書記門令史主府門餘各典曹文書並屬太尉漢丞相少史昭紀元鳯元年丞相少史王夀注如淳曰漢儀注丞相太尉大将軍史秩四百石武帝又置丞相少史秩四百石曹參傳擇郡國吏長大訥於文辭謹厚長者即名除為丞相史漢儀同三司晉志兼通典開府儀同三司漢官也殤帝延平元年鄧隲為車騎将軍儀同三司儀同之名始此章帝建初三年車騎将軍馬防班同三司同三司之名始此魏黄權以車騎将軍開府儀同三司開府之名始此漢文元年始用宋昌為衛将軍位亞三司自晉以來又有如開府同三司之儀者自羊祜始唐為文散官從一品班視衮章象參台曜晉羊祜為車騎將軍開府如三司之儀祜除征南大將軍開府儀同三司得専辟召張華以光禄大夫儀同三司王戎裴楷以光禄大夫開府辟召儀同三司魏舒位同三司陸玩賀循以左光禄虞潭以右光禄大夫開府儀同三司王導謝安唐開元後唯姚崇宋璟王仁皎毛仲得之宋璟不以名稱止曰宋開府魏三公通典建安十三年罷三公官魏初復置與後漢同謂太傅太尉司徒司空然皆無事不與朝政初封司空崔林為安陽亭侯三公封列侯自林始初置太傅以鍾繇為之末年始置太保以鄭冲為之位在三司上又置大丞相第一品又有相國黄初元年十一月改相國為司徒御史大夫為司空吳蜀皆有丞相吳有左右之名陸機有丞相箴晉八公通典晉武即位之初以安平王孚為太宰鄭冲為太傅王祥為太保義陽王子望初為太尉義陽王為太尉大司馬父孚為太宰父子為上公何曽為司徒荀顗為司空石苞為大司馬陳騫為大将軍凡八公同時並置唯無丞相焉時所謂八公同辰攀雲附翼者也恵帝永寧元年罷丞相復置司徒永昌元年罷司徒并丞相則與司徒不並置矣成帝以王導薨復為司徒府王導為司徒太傅謝安為太保宋有八公之官而不言八公齊時唯置太傅志晉初以景帝諱師故採周官官名置太宰以代太師惠帝初衛瓘為太保志輔星傅開陽佐斗成功丞相之象也後魏三師三公通典後魏以太師太傅太保謂之三師上公也大司馬大将軍謂之二大太尉司徒司空謂之三公舊制有大将軍不置太尉有丞相不置司徒正光後俱置之北齊皆有三師二大三公之官置丞相後分為左右後周改三師為三公兼置三孤以貳之亦置左右丞相六典三師訓導之官也其名即周之三公漢哀平間始尊師傅之位在三公上謂之上公明雖天子必有所師無所統職後魏特稱三師以正其名然非道徳崇重則不居其位無其人則闕之近代多以為贈官隋煬三年廢三師官隋三師通典隋置三師不主事但坐而論道置太尉司徒司空以為三公參議國之大事依北齊置府僚無其人則闕有内史納言是為宰相唐三師三公志太師太傅太保各一人是為三師為天子所師法無所總職太尉司徒司空各一人是為三公佐天子理隂陽平邦國無所不統隋廢三師貞觀二十一年復置皆不設官屬宰相表三公三師七十一人宗室親王二十人以宰相及前宰相遷者二十七人以軍功進者二十人以恩澤進者四人通鑑貞觀六年上以新令無三師官二月丙戌詔特置之六典三師親王拜者但存其名太尉武徳初秦王兼之永徽中長孫無忌為之其後親王拜三公者皆不視事祭祀則攝者行焉隋文帝罷三公府僚唐因之其或親王拜者亦但存其名位王思禮傳上元元年加司空自武徳以來三公不居宰輔唯思禮而已李徳裕傳拜太尉固辭言唐興太尉惟七人尚父子儀乃不敢拜近王智興李載義皆超拜保傅盖重惜此官裴度為司徒十年亦不遷帝曰吾恨無官酬公唐宰相政事堂同三品平章事志唐因隋制以三省之長中書令侍中尚書令共議國政此宰相職也後以僕射為尚書省長官與侍中中書令號為宰相品位既崇不欲輕授人常以他官居宰相職而假以他名太宗時杜淹以吏部尚書參議朝政表作㕘預月貞觀元年九辛酉魏徴以祕書監參預朝政三年二月戊寅其後或曰參議得失十年六月魏徴參知政事之類十三年十一月戊辰劉洎皆宰相職也貞觀八年十月丙寅李靖辭位三兩日一至中書門下平章事而平章事之名起於此其後十七年四月己丑蕭瑀以太子太保李勣以詹事同中書門下三品六月丁酉髙士亷同三品平章政事而同三品之名起於此然二名不専用自髙宗以後為相者必加同三品雖品髙者亦然其後改易官名而張文瓘以東臺侍郎同東西臺三品總章二年二月辛酉同三品入銜自文瓘始永淳元年四月丁亥以郭待舉等同承受進止平章事平章事入銜自待舉等始是年十月劉齊賢同中書門下平章事自是以後終唐世不改初三省長官議事於門下省政事堂後裴炎自侍中遷中書令弘道元年十二月乃徙政事堂于中書省開元中十一年張説為相又改政事堂號中書門下列五房于後曰吏樞機兵户刑禮房分曹以主衆務焉表參議朝政貞觀四年二月甲寅蕭瑀專典機宻十六年正月辛未岑文本同掌機務十九年二月乙卯髙士亷等參知機務二十二年正月己亥崔仁師參掌機宻二十三年五月癸巳李勣同知軍國政事麟徳元年十二月戊子孫處約等兼知政事二年十月壬戌大司憲劉仁軌軍國重事宜共平章先天元年七月乙亥右僕射竇懷正知軍國重事開元元年八月癸巳右僕射劉幽求參謀政事相王參豫機務景雲元年六月辛丑劉幽求等三五日一入中書平章政事杜佑宰相三百六十九人再入五十七人長孫無忌至裴樞三入十二人武承嗣至鄭畋四入三人韋巨源姚元之韋安石五入三人蕭瑀裴度崔胤凡九十八族宗室宰相十一人又有李麟親王宰相四人見於世系者凡九十七族三百三十四人又親王宗室又元載不著又劉幽求等二十二人不見於表合三百七十一人㑹要髙祖宰相十六人太宗二十五人髙宗四十七人武后七十四人中宗三十人睿宗二十五人玄宗三十四人肅宗十六人代宗十二人徳宗二十五人順宗七人憲宗二十六人穆宗十四人敬宗七人文宗二十四人武宗十五人宣宗二十三人懿宗二十一人僖宗二十三人昭宗二十五人哀帝六人通典唐侍中中書令是真宰相其餘以他官參掌者無定員但加同三品及平章事知政事參知機務㕘與政事及平章軍國重事之名者神龍元年六月癸亥豆盧欽望太和四年六月丁未裴度並平章軍國重事度三五日一至中書並為宰相亦漢行丞相事之例也韓安國為御史大夫行丞相事又張湯自先天之前其員頗多景龍中至十餘人開元以來常以二人為限或多則三人天寳十五年之後天下多難故備位者衆然秉鈞亦一二人而已至徳二載三月宰相分直主政事筆一人知十日貞元九年七月詔以旬秉筆十年五月八日又分毎日一人執筆六典尚書令為端揆之官魏晉已來其任尤重武徳中太宗初為秦王嘗親其職自是不復置國政樞密皆委中書八座之官皆受成事郭子儀傳拜尚書令懇辭且言太宗嘗踐此官累聖曠不置員皇太子為雍王定闗東乃得授詎可隳大典帝許之蓺文志柳芳大唐宰相表三卷韋琯國相事状一卷李華作中書政事堂記崇文書目有大唐宰相歴任記二卷不知作者紀髙祖至昭宗朝宰臣名氏拜罷月日崇文書目題云唐宰輔圖開成三年十一月癸酉楊嗣復曰太宗用房玄齡十六年魏徴十五年李徳裕傳開元初輔相率三考輒去雖姚宋不能逾韋弘質言宰相不可兼錢穀禹以司空兼百揆周以六卿兼三公猶以他官平章事知政事之比唐左右丞相六典左右僕射開元初元年十二月一日改為左右丞相掌總領六官紀綱百揆初亦宰相之職也開元中張説兼之後罷知政猶為丞相自此之後遂不知國政天寳元年復為僕射二年改侍中為左相中書令為右相通典按僕射秦官其職甚微東漢以後委任漸重職司㑹府而非百寮師長之職也丞相亦秦官羣臣上表皆云丞相臣某為首漢之宗臣蕭何為丞相漢儀丞相進天子御坐為起在輿為下霍光廢昌邑上表太后丞相臣敞為首大司馬大将軍臣光次之其尊崇如此龍朔中天寳初嘗改侍中中書令為左右相逺協伊尹仲虺為左右相周公召公相成王為左右之義斯誠允當齊慶封為左相秦樗里右甘茂左漢孝恵六年王陵右陳平左髙后元年平及審食其左文帝初立周勃右平左秦之斯與去疾或謂尚書令僕則録尚書之職是官之師長按前代録尚書霍光張安世王鳯趙憙牟融鄧彪張禹李固王導褚淵齊明帝之徒或是丞相或是三公或是大将軍大司馬兼之皆秉朝政其時别有令僕令僕射改為丞相名同而職異品秩又未崇極上有三師三公尚書令七人豈得比前代丞相之任也龍朔改侍中為東臺左相中書令為西臺右相光宅改左右僕射為文昌左右相㑹要左右僕射自武徳至長安四年已前並是正宰相初豆盧欽望拜左僕射不言同中書門下三品不敢參議政事數日後始加知軍國重事景雲二年十月韋安石除左僕射東都留守不帶同三品自後空除僕射不是宰相遂為故事開元中張説為右丞相玄宗令選日上因制儀注自非中書門下諸三品以上皆坐受其禮因為故事元和六年十月禮官案開元禮有冊拜官上儀咸與卑官答拜今僕射皆冊拜官也㑹昌二年陳吏行崔珙拜僕射奏僕射始視事受四品官拜無著令比左右丞吏部侍郎御史中丞皆為僕射拜階下謂之隔品致敬凖禮皇太子見上臺羣官羣官先拜而後答無二上也僕射與四品官並列不容獨優開元元年以僕射為丞相位次三公三公上日答拜而僕射受之非是望敕所司約三公上儀著定令詔可李絳言左右僕射師長庶官開元名丞相雖去機務然猶總百司書位不著姓上日班見百官而中丞御史在廷政和三公三少舊制太師太傅太保為三師太尉司徒司空為三公並為宰相親王使相加官五代之制司徒遷太保太保遷太傅太傅遷太尉太尉遷太師檢校者亦如之國朝因之政和二年九月癸未詔以太師太傅太保為三公少師少傅少保為三孤以左輔右弼太宰少宰易侍中中書令左右僕射之名太尉司徒司空尚書令並罷甲申改太尉為武階一品居執政之次宰臣生拜太師者惟趙普文彦博史浩京檜以相臣特拜親王生拜太師者元佐元儼顥俁偲伯圭伯圭以近屬特拜乾道左右丞相見三省詔曰在商湯時則有若伊虺在成王時則有如周召或左或右皆見于經厥後位號定於漢而稱謂汩於唐前輩記自建隆元年至元祐五年一百三十年宰相凡五十人自元祐五年至紹興六年四十六年凡二十八人自紹興七年至嘉泰二年六十二年凡二十有四人自建隆至靖康宰相凡七十二人執政凡二百三十一人至和二年七月甲子詔宰相召自外者令百官班迎之自内拜者行上事儀文富入相辭之乾徳二年正月庚寅趙普相普獨相十年四月乙丑初置參知政事薛居正吕餘慶先是帝問陶穀下丞相一等何官對曰唐有參知機務參知政事翊日命居正等不宣制不押班知印不升正事堂就宣徽㕔上事殿廷别設位於宰相後書銜敕尾降宰相數字月俸半之開寳六年六月壬寅詔參知政事升都堂與宰相同議政事又詔趙普與居正等同知印押班奏事史臣謂唐平章事亞於參知政事榖不能引漢御史大夫為對失之矣文徳殿常朝未有塼位雍熙四年九月始設之至道元年四月戊子詔與宰相分日知印二年復舊制舊相特命平决軍國事者凡四人天禧元年王旦拜太尉遇軍國大事不以時入參决不拜慶厯二年吕夷簡司空平章軍國重事三年拜司徒同議軍國大事辭之元祐元年太師文彦博平章軍國重事三年吕公著拜司空同平章軍國事中書令國初錢俶等十五人同時兼中書令宗太宗朝唯除石守信而趙普以故相拜真但以處親王五嘉祐末允弼允良元豐中曹佾紹熙年十二月除伯圭兼辭不拜宰臣拜太師趙普以文彦博拜史浩皆還政加恩蔡秦宰相特鄭清之辭不拜宰臣拜太傅張士遜逺曽公亮皆還政加恩史彌鄭清之以宰相拜宰相拜太保趙普史王旦以宰相拜浩還政加恩書目有宰輔年表一卷建隆至治平不知作者宰臣拜罷録一卷熙寧中同知禮院陳繹承詔編又樞府拜罷録一卷同上宰輔拜罷圗四不知作者起建隆庚申止紹興庚辰因新舊官制載拜罷月日為圗續目國朝相輔年表一卷起建隆庚申訖治平丙午序曰臣繹上續年表起治平丁未迄紹興十四年序曰臣易記皆不著姓又自紹興十四年至嘉定六年終不著纂者名氏李燾著歴代宰相年表二十三卷唐宰相譜一卷治平三年五月戊辰帝謂宰相曰朕欲與公等從容日講治道中書常務可歸有司自是小事以状進有定制者付有司行之前漢相國凡三人丞相哀帝為大司徒凡四十四人再入者二人周勃孔光御史大夫大司空凡六十八人再入者三人孔光何武王崇太尉凡四人大司馬凡二十二人不兼司馬稱大将軍者一人竇嬰太師孔光太傅孔光王莽太保王舜凡四人後漢太尉凡六十四人胡廣三入劉矩馬日殫再入司徒凡五十人魯恭胡廣再入司空凡五十七人牟融三入太傅凡十一人大将軍凡十三人太師相國一人大司馬一人丞相一人前漢再世為相周勃亞夫韋賢元成平當晏後漢四世太尉楊四世五公袁唐三世為相張再世為相凡二十家蕭氏八葉玉海卷一百二十
