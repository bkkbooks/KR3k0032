body:
  text: 玉海卷十五宋王應麟撰地理地理書禹山海經禹山川圖禹咸平山海經圖治水錄漢志形法家山海經十三篇唐志隋志同地理類郭璞注二十三卷又圖讃二卷音二卷舊唐志山海經十八卷讃圖二卷音二卷郭璞撰中興書目山海經十八卷晉郭璞傳凡二十三篇每卷有讃按漢志十三篇劉歆序云禹别九州任土作貢伯益等類物善惡著山海經崇文目晁氏志十八卷郭璞序曰東方生曉畢方之名劉子政辨盜械之尸王頎訪兩面之客海民獲長臂之衣精驗潜効絶代垂符此書跨世七代歴載三千雖暫顯於漢尋亦寢廢總十八卷本三萬九百十九字注二萬三百五十字總五萬一千二百六十九字南山經第一西山經北山東山中山海外南海外西海外北海外東海内南海内西海内北海内東大荒東大荒南大荒西大荒北海内經第十八臣秀言太常屬臣望所校山海經凡三十二篇今定為一十八篇劉歆所定書其南西北東及中山號五藏經為五篇其文最多海内海外大荒三經南西北東各一篇并海内經一篇總十八篇多者十餘簡少者二三簡遂為定本其卷後或題建平元年四月丙戌待詔太常屬臣望校治侍中光祿勲臣龔侍中奉車都尉光祿大夫臣秀領主省劉歆序曰山海經者出於唐虞之際禹定髙山大川蓋與伯翳主驅禽獸命山川類草木别水土四嶽佐之以周四方逮人跡之所希至及舟輿之所罕到内别五方之山外分八方之海紀其珍寳竒物異方之所生水土草木禽獸昆蟲麟鳳之所止休祥之所隱及四海之外絶域之國殊類之人古文之著明者也孝武時東方朔言異鳥之名孝宣時臣父向對貳負之臣皆以是書朝士由是多竒山海經者可以考休祥變恠之物見逺國異人之謠俗五藏山經五篇禹曰天下名山經五千三百七十山六萬四千五十六里居地也言其五藏蓋其餘小山甚衆不足記云天地之東西二萬八千里南北二萬六千里岀水之山者八千里受水者八千里出銅之山四百六十七出鐵之山三千六百九十吳越春秋禹行七年案黄帝中經見聖人所記曰九疑山東南天柱號曰宛委其書金簡玉字編以白銀瑑其文禹登衡山夢赤繡文衣自稱元夷蒼水使者曰欲得我山神書者齋於黄帝嶽岩之下禹退又齊三月庚子登宛委山發石取書案金簡玉字得通水之理復返歸嶽從三子乘四載以行川始於霍山徊集五嶽遂循行四瀆與益䕫共謀行到名山大澤召其神而問之山川脉理金玉所有鳥獸昆蟲之類及八方之民俗殊國異域土地里數使益疏而記之名曰山海經使大章步東西豎亥度南北暢八極之廣旋天地之數論衡禹主治水益主記異物海外山表無逺不至以所聞見作山海經董仲舒睹重常之鳥劉子政曉貳負之尸皆見山海經故能立二事之說史大宛傳太史公曰至禹本紀山海經所有怪物余不敢言之也通典禹本記山海經不知何代之書恢怪不經疑夫子刪詩書後尚竒者所作或先有其書如詭誕之言必後人所加也若古周書吳越春秋越絶書諸緯書之流是矣水經云河出崑崙山出於禹本記山海經云南入葱嶺及出於于闐南山出漢西域傳後漢永平十二年賜王景山海經注禹所作漢志山海經十三篇劉歆所校凡三十二篇定為十八篇固已不同尤袤定為先秦之書非禹及伯翳所作隋志漢初蕭何得秦圖書故知天下要害後又得山海經相傳以為夏禹所記水經注敘昔大禹記著山海周而不備引元中記穆天子竹書及山海經皆埋緼嵗久編韋稀絶書䇿落次難以緝綴史通夏禹敷土實著山經漢張騫傳賛禹本紀言河出昆侖言九州山川尚書近之矣至禹本紀山經所有放哉列子大禹行而見之伯益知而名之夷堅聞而志之書禹平水土主名山川家語子夏曰商聞山書曰地東西為緯南北為經吳都賦名載於山經形鏤於夏鼎周禮疏案古山海經鄒書云騶虞獸説與毛詩同惠帝紀注師古引貳負之臣地理志注引琅邪臺匈奴傳注引黄帝生苖龍列子注引大荒經文選注引東荒中山海南海外西山海外東經海内西經水經後漢書注王逸注楚辭天問多引之左傳疏服䖍用山海經又案神異經唐志神仙家東方朔神異經二卷張華注又十洲記一卷載神仙珍異之迹别本題云西王母及東方朔所說武帝書而記之皆依託張衡傳注引十洲記西南夷傳注引開山圖神異經志唐志又有矩威渾輿經一卷魏云桓威莊子釋文引海外經爾雅釋文引山海經圖讚顔之推曰山海經禹益所記而有長沙零陵桂陽諸暨後人所羼非本文也晁氏曰長沙零陵鴈門皆郡縣名又載禹鯀後人參益之杜預釋例曰天有列宿之號地有山川之名尚矣與人倫並今其遺文禹貢及山海經載其大略而春秋經國邑之名又詳非書無以志古非圖無以志形坐乎堂宇之内瞻天下之廣居究古今之委曲可以行可以言可以鑑可以觀多識山川分野之别賢愚成敗得失之跡雖千載之外若指諸掌圖書之謂也論衡禹之治水以益為佐益之記物極天之廣窮地之長辨四海之外竟四山之表二十五國之地鳥獸草木金石水土莫不畢載淮南王地形之篇道異類之物外國之怪列三十五國之異案禹之山經淮南之地形以察鄒子之書虛妄之言也左傳夏之方有徳也禹之世逺方圖物注圖畫山川竒異之物而獻之貢金九牧鑄鼎象物象所圖物著之於鼎百物而為之備使民知神姦吕氏春秋禹東至搏木之地日出九津青羌之野攅木之所㨉天之山鳥谷青海之鄉黒齒之國南至交阯孫樸續樠之國丹粟漆木沸水漂漂九陽之山羽人裸民之處不死之鄉西至三危之國巫山之下飲露吸氣之民積金之山共肱一臂三面之鄉北至人正之國夏海之窮衡山之上犬戎之國夸父之野禺疆之所積水積石之山不有懈墮通典張騫傳按古圖書名河所出曰崑崙古圖書即禹本記初學記河圖曰禹既治水功大天帝以寶文大字賜禹佩渡北海弱水之難尚書中候禹自臨河河精授河圖注云謂括地象也刑德放曰禹長於地理得括地象圖故堯以為司空中興書目山海經圖十卷本梁張僧繇畫咸平二年校理舒雅銓次館閣圖書見僧繇舊蹤尚有存者重繪為十卷又載工侍朱昂進僧繇畫圖表於首僧繇在梁以善畫著每卷中先類所畫名凡二百四十七種其經文不全見崇文目同舒雅修題晁氏志圖十卷舒雅等撰或曰張僧繇畫妄也漢志形法者大舉九州之勢以立城郭室舍六家百二十二卷山海經為之首書目又有圖十卷首載郭璞序節錄經文而圖其物如張僧繇本不著姓名大禹治水元奥錄一卷不知作者叙禹貢治水本末南齊江淹欲為赤縣經以補山海之缺不成本朝李誠續山海經十卷見程俱集禹受地記三禮義宗見記類周九畿籍周禮大司徒制其畿疆而溝封之注千里曰畿小司徒凡建邦國正其畿疆之封注九畿封人掌為畿封而植之注畿上有封大司馬以九畿之籍施邦國之政職方千里曰國畿其外方五百里曰侯甸男采衛蠻夷鎮蕃畿注畿猶限也自王城以外五千里為界有分限者九籍其禮差之書也故書畿為近鄭司農云春秋傳曰天子一畿列國一同殷頌邦畿千里正義曰九畿之籍謂以面五千里為九畿皆有典籍之書國畿據王畿内千里而言非九畿之畿但九畿以此國畿為本向外每五百里加為一畿也六服是中國之九州三服是夷狄之諸侯總號蕃服大行人云九州之外謂之蕃國九籍者諸侯賦貢多少有常則大國貢半次國三之一小國四之一是其禮差也注政職所共王政之職謂賦税也云五千里為界者兩面相距則方萬里堯舜未治洪水時五服各五百里兩面相距止有五千里禹治水之後弼成五服服加五百則亦萬里若孔君義則不然若據鳥飛直路此周之九服亦止五千若隨山川屈曲則禹貢亦萬里彼此不異也易氏曰九畿即職方氏之九服禹五服計一面之數周九服計兩面之數王畿與禹甸服同不言五百里而兼言千里是計兩面之相距也野廬氏掌達國道路至于四畿注去王城五百里曰畿職方氏辨九服之邦國大行人以蠻服為要服三服為蕃國掌訝掌邦國之等籍小行人各以其國之籍禮之掌交諭九牧之維注九州之牧易氏曰大司徒所謂圖者周知九州地域廣輪之數為建國分封之地職方氏所掌不特九州而已凡中國夷狄畫為九畿皆以圖而籍之故曰掌天下之圖又曰禹五服王畿在内王畿千里而兩面各五百里數其一面故曰五百里甸服自甸至荒皆數一面每面各五百里總為二千五百里兩面相距凡五千里職方氏所載則王畿不在九服之内自方五百里之侯服至方五百里之蕃服其名凡九九服每面各二百五十里通為二千二百五十里兩面相距通為四千五百里并王畿千里通為五千五百里増於禹者五百里之蕃服耳然禹九州之外咸建五長東漸西被即成周蕃服之域其名雖増而地未嘗増也孫氏曰禹制五服王畿與焉周分九畿而王畿不與九畿即九服也禹要荒周為采衞蠻禹侯綏周為侯甸男禹甸服周為王畿夷鎮藩則海外之國書康誥侯甸男邦采衛周官六服羣辟罔不承徳六年五服一朝周語祭公謀父曰先王之制邦内甸服邦外侯服侯衞賔服蠻夷要服戎翟荒服甸服者祭侯服者祀賔服者享要服者貢荒服者王日祭月祀時享歳貢終王襄王曰先王規方千里以為甸服其餘以均分公侯伯子男使各有寧宇商頌邦畿千里肇域彼四海王制司空執度度地居民荀子周公履天下之籍注圖籍詩正義詩譜云周公致太平敷定九畿復夏禹之舊制成王用周公之法制廣大邦國之境而齊受上公之地更方五百里隋志周千里以制畿甸九服以别要荒大司馬疏九畿侯為天子伺候非常職方為王斥候甸為天子治田出賦貢男任王者之職事采采取美物共天子衛為天子衞守職方衞禦蠻以近夷狄縻繫以政教要者要束以文教蠻畿與大司徒云要服一也案大行人是要服大司徒無之當考夷以夷狄得夷稱鎮去中國稍逺理須鎮守蕃最逺故得蕃屏稱在外為藩籬行人蕃國世一見此三服也職方九服方千里曰王畿其外方五百里曰侯服下並同司馬但以畿作服蕃作藩周邦國志四方志方志周禮春官小史中士八人下士十六人掌邦國之志注周志鄭書之屬正義諸侯國内紀錄之事隋志云其書蓋亦揔為史官之職外史上士四人中士八人下士十六人掌四方之志注若晉乘楚檮杌魯春秋地官土訓中士二人下士四人史二人道地圖以詔地事説地圖九州形勢山川所宜道地慝辨地物以詔地求王循守則夾王車誦訓中士二人掌道方志以詔觀事說四方所識久逺之事若魯有大庭氏之庫殽之二陵道方慝以詔辟忌知地俗夏官訓方氏中士四人道四方之政事與其上下之志誦四方之傳道世世所傳說往古之事正嵗則布而訓四方而觀新物正義訓方氏訓四方美惡而言之周四方地名周禮夏官山師中士二人下士四人掌山林之名辨其物與利害頒于邦國使致珍異之物川師中士二人下士四人掌川澤之名邍師中士四人下士八人掌四方之地名辨其丘陵墳衍邍隰之名物之可以封邑者注地名謂東原大陸之屬正義禹貢有東原底平大陸既作是地名也形方氏中士四人注主制四方邦國之形體大司徒辨其山林川澤丘陵墳衍原隰之名物注十等之名與所生之物以土㑹之法辨五地之物生量人邦國之地與天下之涂數皆書而藏之注書地謂方圜山川之廣狹書涂謂支湊之逺近漢地理志周定官分職改禹徐梁二州合於雍青分冀州為幽并先王之迹既逺地名又數易改周書世俘解武王遂征四方凡服國六百五十有二賈捐之曰武丁成王殷周之大仁也地東不過江黄西不過氐羌南不過蠻荆北不過朔方是以頌聲並作晉志成王改禹貢徐梁入青雍冀野析幽并職方掌天下之土保章辨九州之野左傳自夏以后稷魏駘芮岐畢吾西土也及武王克商蒲姑商奄吾東土也巴濮楚鄧吾南土也肅慎燕亳吾北土也吾何邇封之有水經注圏稱曰昔天子建國名都或以令名或以山林故豫章以木氏都酸棗以棘名邦穆天子傳天子自崑山入于宗周萬里西土之數自宗周瀍水以西北至于河宗之邦陽紆之山三千有四百里自陽紆西至河首四千里合七千四百里京相璠著春秋地名璠與裴司空彦季修晉輿地因作春秋地名爾雅釋地九州十藪八陵九府五方野四極釋丘丘厓岸釋山釋水水泉水中河曲九河從釋地已下至九河皆禹所名也孔子作春秋虎牢不係鄭沙麓不係晉緣陵不係杞楚丘不係衞蓋别天子之守地也周公職錄九州志九丘孔安國書序九州之志謂之九丘丘聚也言九州所有土地所生風氣所宜皆聚此書也楚左史倚相能讀九丘孔子述職方以除九丘正義左傳或謂之九區賈逵曰九州亡國之戒馬融云九州之數也禹貢禹别九州釋文周公職錄云黄帝受命風后受圖割地布九州鄹子曰中國為赤縣内有九州春秋説題辭州之為言殊也又見上易氏曰周基王業而東南先服王化故首九州而言功之所自始劉敞曰九共九篇共當作丘古文丘與共相近故誤傳以為共耳按小序九丘者乃所謂方設居方别生分類者也九州殊土異俗各因其性順其舊而教擾之故為九篇篇言一州也孔安國為隷古定書不知丘字誤為共遂肆臆説云述職方以除九丘按職方氏之書一官所守耳周禮出於周公仲尼未嘗刪述而云除九丘乎禹貢所言形質也九丘所言情性也惜此書之亡不及見有虞氏之明德也尚書大傳古之處師八家而為鄰三鄰而為朋三朋而為里五里而為邑十邑而為都十都而為師州有十二師焉鄭玄注曰州凡四十三萬二千家此蓋虞夏之數也顧野王云此堯時制周度邑篇作洛篇汲冢周書序武王平商維定保天室規擬伊洛作度邑周公既誅三監乃述武王之志建都伊洛作作洛度邑解第四十四維王尅殷國君諸侯乃厥獻民九牧之師見王于殷郊王乃升汾之阜以望商邑云云王曰自洛汭延于伊汭居陽無固其有夏之居有夏之居即河南也我南望過于三塗我北望過于有嶽丕顧過于河宛瞻延于伊洛無逺天室其名兹曰度邑作雒解第四十八周公俘殷獻民遷于九畢俾康叔宇于殷俾中旄父宇于東乃作大邑成周于土中城方千七百二十丈郛方七百里南繫于洛水地因于郟山以為天下之大湊制郊甸方六百里國西土為方千里分以百縣縣有四郡郡有闕鄙大縣立城方王城三之一小縣立城方王城九之一乃設丘兆于南郊以上帝配后稷日月星辰先王皆與食建大社于周中其壝東青土南赤西白北驪中央黄將建諸侯鑿取其方一面之土苞以黄土苴以白茅以為土封故曰受則土於周室乃位五宮大廟宗宮考宮路寢明堂五宮宮府寺也大廟后稷二宮祖考廟也路寢王所居也咸有四阿反坫重亢重郎常累復格藻棁設移旅楹惷常畫内階玄階堤唐山廧應門庫臺玄閫左傳哀二年注引周書作雒篇千里百縣縣有四郡漢地理志注臣瓚引周書度邑篇曰武王問太公曰吾將因有夏之居南望過于三塗北瞻望于有河史周紀注徐廣引度邑文選曲水詩序注引度邑篇曰維王克殷自鹿至于丘中具明不寢隋牛弘傳引作洛篇明堂咸有四阿孔晁注云云漢水經見山川漢郡國地志郡國書隋志武帝時計書既上太史郡國地志固亦在焉而史遷所記但述河渠其後劉向略言地域朱貢條記風俗班固因之作地理志其州國郡縣山川夷險時俗之異經星之分風氣所生區域之廣戸口之數各有攸敘與古禹貢周官所記相埓雜傳類云後漢光武始詔南陽撰作風俗故沛三輔有耆舊節士之序魯廬江有名德先賢之賛郡國之書由是而作序賛並亡水經注桑欽地理志曰漯水出髙唐漢山經水志後西南夷論漢開四夷之境欵殊俗之附文約之所沾漸風聲之所周流幾將日所出入處也著自山經水志者亦略及焉張騫傳漢使窮河源其山多玉石采來天子案古圖書名河所出山曰昆侖云水經見後山海經見前漢方志十三州志揚雄州箴後西域傳論甘英抵條支而歴安息臨西海以望大秦拒玉門陽闗者四萬餘里靡不周盡若其境俗物類川河領障氣節凉暑梯山棧谷之道風災鬼難之域莫不備寫至於佛道神化興自身毒而二漢方志莫有稱焉唐志闕駰後魏書有傳十三州志十四卷隋志十卷南史梁吳均著廟記十卷十二州記十六卷蓺文類聚有苗恭十四州記禹貢正義引十三州記水經注引黄義仲十三州記漢地理志注師古引闞駰云師古日中古以來説地理者多矣或解釋經典或撰述方志競為新異妄有穿鑿今並不錄揚雄荆揚兖豫徐青幽冀并雍益交十二州箴著蜀王本紀蜀都賦雄傳云箴莫善於虞箴作州箴漢陳留耆舊傳隋志漢議郎圏稱二卷唐志云圏稱陳留風俗傳三卷魏散騎郎蘇林陳留廣舊傳一卷東晉江敞陳留志唐志云人物志十五卷選注水經注御覽引陳留風俗傳髙紀注臣瓚引陳留傳傳耆舊若韋氏四海一卷王基東萊一卷陳夀益部十四卷又續一卷雜唐志益州耆舊傳記二卷習鑿齒襄陽記五卷傳先賢如魏明帝海内四卷兖州徐州各一卷劉義慶徐州賛九卷范瑗交州三卷四唐志卷諸國清賢一卷晉白褒魯國二卷張方楚國賛十二卷魏周斐汝南五卷陳英宗陳留像賛一卷濟北一卷廬江七賢一卷謝承㑹稽七卷鍾離岫㑹稽後賢傳記二卷㑹稽先賢像賛五卷氏唐志賀四卷吳陸凱吳國四卷張勝桂陽畫讃五卷零陵一卷郭縁生武昌志二卷卷唐志三陸胤劉芳廣州各七卷髙範荆州三卷仲長統山陽一卷王羲度徐州九卷劉義慶讃八卷吳均吳郡錢塘五卷諸國一卷南齊崔慰祖著海岱志起太公迄西晉人物為四十卷半未成唐趙武孟著河西人物志十篇蜀志陳術著益部耆舊傳及志御覽引荆州先德傳選注引習鑿齒襄陽耆舊傳記書日五卷載先賢事迹及山川地理末有賀鑄題疑記述無倫貫非全書云淮南墬形訓淮南子天地之間九州八極土有九山山有九塞澤有九藪風有八等水有六品何謂九州東南神州曰農土正南次州曰沃土西南戎州曰滔土正西弇州曰并土正中冀州曰中土西北台州曰肥土正北濟州曰成土東北薄州曰隱土正東陽州曰申土記曲禮疏案地統書括地象云地中央曰崑崙又云其東南方五千里曰神州以此言之崑崙在西北别統四方九州其神州者是崑崙東南一州耳於一州中更分為九州則禹貢九州是也史記騶衍以為儒者所謂中國者於天下乃八十一分居其一分耳中國名曰赤縣神州赤縣神州内自有九州禹之序九州是也不得為州數中國外如赤縣神州者九乃所謂九州也有裨海環之如此者九乃有大瀛海環其外應劭地理風俗記水經又東至鬱林注應劭地理風俗記曰周禮鬱人云云一曰鬱人所貢因氏郡矣又曰日南故秦象郡冠石山應劭地理風俗志曰武水出焉應劭地理風俗記云河内殷國也周名之為南陽魏土地記水經注魏土地記曰縣有榖城山又引魏書郡國志舊唐志魏諸州記二十卷地説曰漢與江合于衡北翼際山傍沔水東行過三澨合流禹貢正義鄭玄引地記書云三危之山在鳥䑕之西南正義引張氏地理記益稷正義鄭玄引地記書曰崑崙山東南地方五千里名曰神州晉畿服經齊地理書梁地記陳輿地志隋區㝢圖志諸州國經集皇甫士安地理書隋經籍志晉世摰虞依禹貢周官作畿服經其州郡及縣分野封略事業國邑山陵水泉鄉亭城郭道里土田民物風俗先賢舊好靡不具悉凡一百七十卷今亡齊陸澄聚一百六十家之説依其前後逺近編而為部謂之地理書隋志二百四十九卷澄合山海經已來一百六十家以為此書唐志鄧基陸澄地理志一百五十卷家隋志又有陸澄地理書抄二十卷地南史庾仲容衆地理書二十卷選注引劉澄之理書任昉又増陸澄之書八十四家謂之地記志二百五十二卷又書抄九卷唐志同陳顧野王抄撰衆家之言作輿地志三十卷文選注引之隋大業中詔天下諸郡條風俗物産地圖上于尚書故隋代有諸郡物産土俗記一百五十一卷區宇圖志一百二十九卷崔祖濬姚思廉修廣三尺從三丈三尺明九域山川之要究五方風俗之宜五崔賾傳大業五年受詔與諸儒譔區宇圖志二百十卷帝更令虞世基許善心衍為六百卷諸州圖經集唐志云隋圖經集記一百卷郎蔚之撰即郎茂其餘記注甚衆許善心撰方物志二十卷今任陸二家所記之内而又别行者各錄在其書之上自餘次之於下陸澄書見存别部自行者唯四十二家山海經簿水經城黄圖述洛陽記二征洛陽宫殿洛圖征記西記南婁地記徐州記風土記地吳興記稽吳郡記王京口記㑹稽土記㑹記隋入沔記荆州記珠崖傳神壤記俗豫章記中蜀王本紀土三巴記衡陳留風傳鄴記春秋地名山記國傳遊名山志外聖賢冡墓記記佛國記經遊行外交州以南國傳十洲神異異物志蜀南州異物志志發蒙記任昉書見存别部行者唯十二家三輔故事名湘州記西吳郡記廬日南傳雲江記記漢水記居山志征記山南陵精舍永初山川古今記帖元康三年地記司州記并省置諸郡舊事地理一百三十九部一千四百三十二卷通計亡書合一百四十部一千四百三十四卷隋地理志大凡郡一百九十縣一千二百五十五姚思㢘傳詔與崔祖濬修區㝢圖志崔賾傳詔問何處有羊腸坂賾曰漢地理志上黨壺闗帝曰不是又曰皇甫士安撰地理書太原北九十里有之帝曰是也志又有劉黄門地理書抄十卷郎茂傳字蔚之撰州郡圖經一百卷奏之賜帛三百段以書付祕府唐志虞茂區宇圖一百二十八卷顧野王輿地志三十卷地理志書鈔十卷雜地志五卷失姓名晉太康地記唐志晉太康土地記十卷太康州郡縣名五卷舊唐志並太康三年撰前漢梁王傳地理志師古注史記正義引晉太康地記史索隱引太康地理志選注引太康地志元康地記後漢志注水經注引晉地道記吳志注引太康三年地記宋書州郡志引晉太康地志王隱地道後漢志注禹貢正義引張氏地理記史記注引晉太康地記龍淵水梁陶弘景著古今州郡記晉交廣二州春秋吳志注晉太康八年廣州大中正王範上交廣二州春秋唐志王範交廣二州記一卷水經注引王氏交廣春秋中興書目廣東㑹要四卷治平中知廣州王靖撰載十六郡四十一縣地里事實廣西㑹要二卷治平中知桂州張田撰載二十九郡及羈縻化外諸蕃山川地理晉闗中記中興書目闗中記一卷晉葛洪撰載長安山川及宫殿陵廟唐志云潘岳撰文選注引之唐志葛洪西京雜記二卷文選注引雍州圖經程大昌雍錄十卷晉風土記隋志晉平西將軍周處撰風土記三卷唐志十卷選注引之晉地道記水經注引王隱晉書地道記又引樂資九州志太康地道記詩正義引晉書地道記隋志元康三年地記六卷後魏地形志晉又一統地道所載又其次也史記正義引徐才宗國都城記蓺文類聚引苗恭十四州記曰秦以公國為大郡侯伯為小郡大郡曰守小郡曰尉齊山川古今記隋志永初山川古今記二十卷齊都官尚書劉澄之撰唐志同又司州山川古今記三卷隋地形志髙祖令庾季才與其子質撰垂象志一百四十二卷地形志八十七卷經籍志五行類八十卷季才撰隋大業拾遺曰大業初勑秘書學士十八人修十郡志虞世基總檢先令學士各序一郡風俗擬奏請體式付世基擇善用之乃鈔吳郡序為體式及圖志第一副本新成八百卷奏之帝以郡帙太少重修成一千二百卷卷頭有圖别造新様紙卷長二尺敘山川則卷首有山水圖敘郡國則有郭邑圖敘城隍則有公館圖其圖上山水城邑題書字極細並用歐陽肅書唐括地志坤元錄河圖括地象見上魏王泰善屬文即府置文學館得自引學士貞觀十二年奏撰括地志引著作郎蕭德言秘書郎顧胤記室蔣亞卿功曹謝偃蘇朂撰次衞尉供帳光祿給食分道計州繙緝疏錄凡五百五十篇歴四期成詔藏袐閣賜物萬段志五百五十卷泰命德言等五人撰又序略五卷㑹要貞觀十五年正月三日上通鑑十六年正月乙丑上史記正義多引之太宗詔曰博采方志得於舊聞旁求故老考於傳信内殫九服外極八荒簡而能周博而尤要度越前載垂之不朽宗岌仕魏王與謝偃撰括地志中興書目坤元錄十卷泰撰即括地志也其書殘缺通典引之文選東都賦注引括地圖唐貞元十道錄華夷圖古今郡國縣道四夷述九州别錄郡國别録吐蕃黄河錄賈耽傳嗜觀書尤悉地理四方之人與使夷狄者見之必從詢索風俗故天下土地區産山川夷岨必究知之方吐蕃盛强盜有隴西州縣逺近有司不復傳耽乃繪布隴右山南九州具載河所經受為圖又以洮湟甘凉屯鎮頟籍道里廣狹山險水原為别錄六篇河西戎錄四篇貞元十四年上之㑹要十四年十月左僕射賈耽撰郡國别錄六卷通錄四卷德宗賜幣馬珍器又圖海内華夷一軸廣三丈從三丈三尺以寸為百里并譔古今郡縣道四夷述四十卷其中國本之禹貢外夷本班固漢書古郡國題以墨今州縣題以朱刋落疏舛多所釐正貞元十七年十月上之舊紀辛未古㑹要上海内華夷圖一軸并序今郡縣四夷述三十卷帝善之賜予加等或指圖問其邦人咸得其真又著貞元十道錄以貞觀分天下隷十道在景雲為按察開元為採訪天寶以州為郡乾元復郡為州廢置升降備焉志賈躭古今郡國縣道四夷述四十卷闗中隴右山南九州别錄六卷貞元十道錄四卷吐蕃黄河錄四卷㑹要㑹昌三年黠戛斯遣使來朝莫詳更改之名中㫖訪求唯賈躭所撰四夷述具載其號然後知耽之通習權德輿作貞元十道錄序云自夏書禹貢周官職方漢志地理厥後史臣繼有其書相國魏國公以為言區域者未備於是獻海内華夷圖一軸古今郡國縣道四夷述四十卷盡瀛海之地窮鞮譯之詞陳農不獲之書朱贛未條之俗貫穿切劘靡不詳究又撮其要㑹切於今者為貞元十道錄四卷首篇自貞觀初以天下諸州分隷十道隨山河江嶺控帶紆直割裂經界而為都㑹云云六典地域之差次四方貢賦之名物廢置升降提封險易皆備于編又考迹疆理以正繆誤采獲要害而陳開置大凡十有二條凡今三十一節度十一觀察與防禦經略以守臣稱使者共五十列於首篇之末其三篇則以十道為凖縣距州州距兩都書道里之數與其四鄙所抵其事覈其言詳賈耽碑云通夷裔之風俗盡山川之險易歴代沿革之自百王廢置之由闗塞通塞之因牧圉盛衰之異道程疎宻之凖要荒享獻之數聚米畫地成於指掌興元元年詔撰國圖貞元十四年先獻闗中隴右及山南九州等圖又撰别錄六卷吐蕃黄河錄共四卷優詔褒異賜馬一匹銀器錦綵十七年冬撰海内華夷圖成并撰古今郡國縣道四夷述四十卷貞元十道錄四卷賜馬兩匹銀器錦綵又内出銀榼二蓋殊渥也唐皇華四達記西域圖見後志賈耽地圖十卷又皇華四達記十卷貞元十四年上載驛程逺近文中興目亦同崇目同地理志唐置羈縻諸州皆傍塞外或寓名於夷落而四夷之與中國通者甚衆若將臣所征討勑使所慰賜宜有以記其所從出天寶中玄宗問諸蕃國逺近鴻臚卿王忠嗣以西域圖對纔十數國見後其後貞元宰相賈耽考方域道里之數最詳從邊州入西夷通譯于鴻臚者莫不畢紀其入四夷之路與闗戍走集最要者七一曰營州入安東道二曰登州海行入髙麗渤海道三曰夏州塞外通大同雲中道四曰中受降城入回鶻道五曰安西入西域道六曰安南通天竺道七曰廣州通海夷道其山川聚落封略逺近皆槩舉其目州縣有名而前所不錄者或夷狄所自名國史志地理名家者賈耽世之所傳有皇華四達記餘多殘缺元和志引賈耽古今述唐郡國志十道志地理志志劉之推文括九州要略三卷郡國志十卷孔述睿傳為史館修撰重次地理志本末最詳中興書目郡國志二卷曹大宗撰始於闗内終於嶺南韋瑾域中郡國山川圖經一卷始闗内終劒南據郡縣山川為之圖唐太府少卿梁載言十道四蕃志十卷以十道為本而以州縣圖志附列其下十道圖見上南唐徐鍇等撰方輿記一百三十卷本傳云百二十卷紀郡國事跡及程塗逺近甚詳唐志梁載言十道志十六卷崇文目十三卷寰宇記引唐開元十道要略晁氏志十道志十三卷所載頗詳博其書多稱咸通中沿革載言蓋唐末人開元十道圖其山川所分貢賦所出得禹貢别州任土之制今載六典唐新集地理志九卷李吉甫徐鍇樂史諸書雖詳略不同大抵皆相因唐元和郡縣圖志唐志著錄是書為五十四卷㑹要析而兩之一曰州縣郡國志三十卷一曰郡國圖其卷與新志同皆冠以元和三者不相似今所刻凡四十卷目錄二卷㑹要元和八年二月辛卯宰臣李吉甫撰元和州縣郡國圖三十卷百司舉要一卷上之又嘗綴錄東漢魏晉元魏周隋故事記其成敗損益為六代略三十卷又分天下諸鎮絶域山險各寫其圖於篇首為五十四卷號元和郡國圖舊史同志李吉甫元和郡縣圖志㑹要無志字五十四卷又十道圖十卷古今地名三卷舊史二月辛卯吉甫上元和郡國圖三十卷十道圖五十四卷六代畧三十卷志又有刪水經十卷吉甫序曰臣上元和國計簿審戸口之豐耗續撰元和郡縣圖志辨州域之疆理豈欲希鄼侯之規摹庶乎盡朱贛之條奏國家自貞觀至開元兼夏商之職貢奄秦漢之文軌梯航絫乎九譯廐置通乎萬里分疆置吏差貢賦制名物守其要害險其走集經理之道冠乎百王然聖人雖設險而未嘗恃險施於有備之内措於立德之中其用常存其機不顯弛張開闢因變制權古今言地理者數十家於兵饟山川攻守利害畧而不書此微臣所以精研聖后所宜周覽也中興書目自京兆府至隴右道凡四十七鎮毎鎮皆圖在篇首冠於敘事之前今本四十卷并目錄共四十二卷圖闕題為郡縣圖志年淳熙二年五月程大昌為序三十一月洪邁為後序吉甫又上河北險要圖又言漢伐公孫述晉伐李勢宋伐譙縱梁伐劉季連蕭紀凡五攻蜀繇江道者四為相嵗餘凡易三十六鎮方趙公為相强藩悍帥狃貞元餘習擅地自予朝廷莫敢訶而能以期年易三十六鎮魏田季安病請以滑任薛平戌重兵邢洺因圖上河北險要憲宗張於浴堂門壁毎歎曰朕日按圖信如卿料則所著書蓋已見之行事矣豈直區區紙上語而已哉吉甫再相蓋元和六年此志自載其所嘗建白者二事改復天德舊城則在八年更置宥州於經略軍則在九年憲宗經略諸鎮吉甫實賛成之其於河北淮西悉嘗圖上地形坐覽要害隃定䇿畫圖之助多也後三百六十有三年刻板于襄陽唐家郡縣疆境方面險要必熟按圖籍言之最為可據國史志元和郡國志四十卷唐東都記志鄧行儼東都記三十卷貞觀著作郎鄧世隆東都記三十卷韋機二十卷舊史鄧世隆採隋代舊事撰東都記三十卷唐兩京新記志晉潘岳闗中記一卷葛洪西京雜記二卷陸機洛陽記一卷戴延之洛陽記一卷後周薛寘西京記三卷後魏洛陽記五卷鄧世隆東都記三十卷又有鄧行儼貞觀著作郎韋機東都記二十卷韋述兩京新記五卷兩京道里記三卷書目不知作者書目新記韋述開元中撰西京始於開皇東都起於大業皇朝宋敏求演之為長安志十卷河南志二十卷元豐三年永興守呂大防案長安都邑城市宮殿故基為圖元豐中王正倫撰古今洛城事類二卷南史梁蕭賁著西京雜記六十卷隋諸葛穎洛陽古今記一卷宇文愷東都圖記二十卷唐韋述為兩京記宋敏求演之為河南長安志凡其廢興遷徙及宫室城郭坊市茅舍縣鎮鄉里山川津梁亭驛廟寺陵墓之名數與古先之遺迹人物之俊秀守令之良能花卉之殊尤靡不備載考之韋記其詳十餘倍真博物之書也長安志二十卷熙寧九年二月五日趙彦若序河南志二十卷元豐六年二月戊辰司馬光序東京記三卷唐山河地名要略處分語志韋澳諸道山河地名要略九卷一名處分語一名新集地理書崇文目國史志同本傳為學士時宣宗常曰朕遣方鎮刺史欲各悉州郡風俗卿為撰一書大中九年令澳纂次諸州境土風俗及諸利害為一書澳乃取十道四方志手加紬次題為處分語後鄧州刺史薛弘宗中謝帝敕戒州事人人驚服出謂澳曰上處分驚人皆處分語中事也唐須知國鏡書目二卷唐左武衞兵曹曹璠撰璠案六典戸部十道纂及採諸節府賦税戸額物産京畿文武百官俸給以至岳瀆山川四夷八蠻並撮其機要使覽者纎毫無遺隋志梁地鏡圖六卷御覽引地鏡圖唐洽聞記晁氏志鄭常三卷雜記郡國舊事唐華陽風俗錄志張周封一卷李德𥙿從事志有揚雄蜀王本紀一卷譙周三巴記一卷李充益州記三卷唐地理六十三家志史錄十三曰地理類始於三輔黄圖終於劒南地圖六十三家一百六部一千二百九十二卷失姓名四十一家六典山海經等一百三十九部一千四百三十二卷隋志通計亡書合一百四十部一千四百三十四卷舊志九十三部一千七百八十二卷地圖則有三輔黄圖洛城圖區㝢周地圖隋圖經集記地域方丈圖方尺圖潤州圖注職貢圖湘州圖記江圖長安開元十道圖終於薊南地圖地志則有三輔舊事漢宮閣洛陽宮殿簿西京雜記西京闗中洛陽記地理志地記雜記雜地志書鈔職方記太康地記郡縣名諸州風土記陳留風俗傳蜀王本紀三巴益州荆南雍兖徐京口豫章東陽潯陽齊州吳齊鄴中徐荆南交廣中岳潁秣陵湘州京邦吳㑹丹陽十國都城國都城記西河舊事十三州輿地志終於東都記括地志序略述山川則有山海經圖讃音水經四海百川水源江漢水尋江源永初宜都山川記述異物則有臨海交州南州扶南凉州京兆諸郡土俗物産及陳祈暢之志述征行則有廟記輿駕東幸循撫揚州西征述征述行入沔聘使行記及聖賢冢墓之記述異域則有魏國以西十一國南越西域道里赤土國中天竺游行外國歴國日南林邑真臘交州以來外國髙麗西南蠻入朝首領記及髙麗風俗之書不著錄者自李播方志圖至徐雲䖍南詔錄五十二家九百八十九卷若方志元和郡縣諸道行程與賈耽地圖此以圖名者也若古今地名十道皇華四達古今郡國縣道四夷述九州别錄十道錄諸道山河要略九州要略郡國志東都兩京戎州鄴城記鄴都故事成都益州記太原事迹華陽風俗吳興零陵北戸雜錄九江渚宫閩中桂林此以記志錄略名者也述山川則刪水經與黄河之錄九嵕嵩廬之記紀征行則燕吳行役之記載異物則南方嶺南與錄異之書記異域則西域新羅渤海戴斗諸蕃雲南海南諸蕃北荒君長四夷及黠戛斯朝貢圖傳蠻書南詔錄太平興國修江表事跡三年正月己酉命湯悦徐鉉王克正張洎同修江表自楊行宻以來事跡太平寰宇記書目直史館樂史撰凡二百卷載天下州郡圖志所著古今事跡太平興國中天下一統史取自古山經地志考正訛謬纂成此書上之始於河南道終於四夷又有揔記傳一百三十卷坐知天下記四十卷掌上華夷圖一卷樂黄目著聖朝郡國志二十卷至道江左記書目三卷至道中張參撰載江左人物守宰寺觀州郡等事景德地理記四年二月己巳次西京乙亥七日命侍講學士邢昺侍讀學士呂祐之龍圖待制杜鎬戚綸陳彭年編集車駕所經地理古跡以聞祥符元年八月乙巳昺等纂成三十卷一本云六十卷目曰景德朝陵地里記詔褒之又嘗命官撰兩京記不及成書景德二年龍圖閣書目地理四百二十一卷崇文總目地理八十三部八百四十七卷始於山海經終於雲南風俗記祥符土訓錄三年十二月癸酉御史知雜事趙湘言車駕祀汾陰請依周禮置土訓誦訓地官土訓中士二人下士四人史二人誦訓中士二人下士四人史二人注土訓謂訓説土地善惡之勢誦訓能訓說四方所誦習及人所作為久時事錄所經州縣山川古跡風俗繼日聞奏以資宸覽從之四年正月戊子命直集賢院錢易直史館陳越秘閣集賢校理劉筠宋綬修所過圖經毎頓進一卷賜名土訓纂錄詳見上晏殊亦預修土訓二月甲寅湘為考制度副使馮起為使宋綬傳云集所過地志風物故實毎舍止即奏方岳志五十卷晏殊等撰天禧梁益記書目天禧中任升晁氏志云任弁以蜀書有數家皆穿鑿誕妄於是刪次十卷成都記五卷唐大中中盧求總載成都所管十八郡及羈縻州道里逺近事跡乾德中杜光庭續成都記一卷天聖海潮圖論吳嚴畯潮水論唐盧肇海潮賦圖書目一卷天聖中燕肅知明州為海潮圖著圖論二篇書目謝頤素海潮圖論一卷論進退大小之候竇叔䝉海濤志一卷木玄虛海賦庾闡張融亦有賦余靖有海潮圖序潘洞浙江論一卷丘光庭海潮論一卷崇文目小說有海潮論一卷記一卷潮説㑹最三卷張君房盧肇云潮之生因乎日盈虛係乎月日月之運知海潮之道枚乘云朝夕之池郭璞江賦呼吸萬里吐納靈潮自然往復或夕或朝海潮之説或謂天河激涌葛洪潮説亦云地機翕張洞真正一經盧肇以日激水而潮生封演云月周天而潮應挺空入漢山涌而濤隨僧隱之言析水大梁月行而水盛竇叔蒙海濤志潮附於日依於月盈於朔望消於朏魄虛於上下弦息於朓朒故有小大焉惟浙江夾岸有山南曰龕北曰赭二山相對謂之海門岸狹勢逼涌而為濤皇祐地理新書唐地理經隋庾季才撰地形志八十七卷唐志五行類呂才大唐地理經十卷貞觀中上一行五音地理經十五卷書目云地里經初真宗朝史序等撰乾坤寶典四百五十篇其三十篇地理也其書叢謬景祐三年六月己酉命嵇頴胡宿重校陰陽地理書五年而畢司天少監楊惟德等别修成三十篇賜今名皇祐五年書目云三年正月癸亥一本甲戌復命知制誥王洙提舉修纂地理圖書直集賢院掌禹錫著作劉羲叟刪修嘉祐元年十一月書成三十卷上之賜名地理新書賜洙等器幣書目形法類凡三十卷首以城邑營壘府寺郵傳市宅衢衖為地事二十篇次以冢穴埏門道陌頃畝為葬事十篇地圖一篇目錄一卷成三十二卷圖一篇今不存地漢志形法六家百二十二卷有宮室形二十卷大舉九州之埶以立城郭室舍熙寧九域志四年二月甲戌命趙彦若考圖籍畫天下地圖六年十月甲午一云戊戌上十八路圖二及圖副二十卷八年七月十一日辛丑詔三館秘閣刪定九域圖以都官員外郎劉師旦言今九域圖自大中祥符六年修定至今涉六十餘年州縣有廢置名號有改易等第有升降所載古迹有出於俚俗不經者乞選有地理學者重修乃命集賢校理趙彦若館閣校勘曽肇充刪定官彦若辭復命光祿丞李德芻刪定而知制誥王存審其事既而上言以舊書不繪地形難以稱圖更賜名九域志壤地之離合戸版之登耗名號之升降鎮戍城堡之名山澤虞衡之利皆著于書始四京終化外州道里廣輪之數昔人罕得其詳今一州之内首敘州封次及旁郡彼此互舉弗相混淆總二十三路京府四次府十次州十州二百四十二軍二十七監四縣一千一百三十五為十卷曲阜集有進表㑹要元豐三年閏九月延和殿進呈六年閏三月詔鐫八年八月頒行十卷熙寧都水名山記政和郡國人物志職方機要輿地廣記熙寧八年七月四日甲子右諫議沈立上都水記二百卷名山記一百卷詔奬之書目職方機要四十卷大觀中晉原丞程縯撰縯案新舊九域二書上據歴代諸史地志旁取左傳水經注釋并通典言郡國事采異聞小説紬次為書輿地廣記三十八卷政和中歐陽忞撰考摭史傳及山經地志為三十八篇政和元年漢州教授陳坤臣進郡國人物志一百五十卷四月十七日詳定九域志何志同言其書包括千載文婉事詳詔蔵秘府宣和三年十一月二十四日乙酉修汴都志從太常博士范子竒之言也詔鄭居中提領修纂子竒及祕書丞李錞編類趙瞻知威州以威茂雜夷獠險甚而難守不若合之而建郡汶川因條著其詳為西山别録一卷熙寧中經畧西南取其書考焉熙寧成都古今集記三十卷熙寧中趙抃再守成都延博識之士參攷衆書述其郡邑山川都城邑郭府寺宫室之詳分百餘門抃自慶厯至熙寧凡四入蜀元豐郡縣志元豐三年十月辛酉詳定官制所檢討文字光祿寺丞李德芻上元豐郡縣志三十卷圖三十卷紹聖四年九月十七日兵部侍郎黄裳言今九域志所載甚略願詔職方取四方郡縣山川民俗物産古跡之類輯為一書補綴遺缺詔祕省錄山海經等送職方檢閱大觀二年四月二日詳定九域圖志强淵明上言續修其書詔四方以事來上宣和罷書局不及成元豐土貢錄書目一卷元豐中翰林學士李清臣同樞宻副都承㫖張誠一撰先是清臣詳定朝㑹儀注所承詔稽案圖誌推原物産凡輕重多寡為條次開列上之治平四年四月壬申神宗出諸州貢物名件自漳州山薑花至同州榅桲凡四十三州七十種手詔曰四方入貢雖云古禮考之禹制未有若兹之繁今一郡嵗有三四而至者自今其悉罷之景德四年閏五月詔大抵相似宋祁撰劒南方物略圖賛一卷紹興歴代疆域志十六年九月六日撫州布衣吳澥上宇内辨歴代疆域志各十卷詔免解余嚞進聖域記二十五卷以本朝州縣沿革山川風物及古今守備之處彚書之紹興海道圖二年五月辛酉樞宻院言據探報敵人分屯淮陽軍海州竊慮以輕舟南來震驚江浙緣蘇洋之南海道通快可以徑趨浙江詔兩浙路帥司速遣官相度控扼次第圖本聞奏癸未中丞沈與求言海舟自京東入浙必由泰州石港通州料角陳貼通明鎮等處次至平江南北洋次至秀州金山次至明州向頭又聞料角水勢湍險儻於石港料角等處拘收水手優給庸直而存養之以待緩急之用彼亦安能衝突七月甲申呂頤浩言近置沿海制置司最為得䇿然敵舟從大海北來抛洋直至定海此浙東路也自通州入料角放洋至青龍港又沿流至金山村海鹽縣直泊臨安府江岸此浙西路也望令仇悆専管淮東浙西别除一員専管浙東福建路從之建炎元年八月何洋召對獻河防守禦圖言利害五十一事甲申補廸功郎太平御覽引吳時緣江戌圖隋志江圖張氏一卷劉氏一卷禹貢釋文引張須元緣江圖紹興春秋地名譜書目十卷紹興中鄭樵撰凡分類國邑地六山一水六為敘十釋例地名譜一卷據天下郡國縣邑冠以春秋盟㑹地名不知作者掌禹錫著郡國手鑑一卷淳熙九丘總要三百四十卷先是王日休新池州守上二十卷詔寧國府給札寫之六年七月進八月八日詔遷秩郡邑廢置地理逺近人物所聚古迹所在物産所宜該載詳備附郡縣以今名為正舊所名者隨聲韻編次之卷末崇文總目方輿記一百三十卷徐鍇自翠華南狩輿地之登于職方者東薄明粤南斥瓊崖西盡岷嶓北極淮漢僅當舜十二州之三漢十三部之四晉十九州之七祖宗務廣德不務廣地初開并門匪疚匪棘北棄幽都西捐朔方四夷左袵㒺不咸賴三代地理志崇文目六卷新集地理志九卷禹貢疆理廣記易祓編六卷為之説春秋二十國年表中興書目左氏春秋二十國年表一卷紹興中環中撰由周魯而下二十國又春秋列國臣子表十卷春秋類州名急就章歐陽修闕禹貢甸侯綏服謂之中國要荒謂之夷蠻中國之地方廣不過三千里聖人務廣德不務廣地際天接地咸盡賔服鄒衍所不議方朔所難紬鳥䇿篆素玉諜石記東枕蟠木南控丹穴西瞰大䝉北薄祝栗西厭月􅒸東震日域扶桑戴斗之區度索尋撞之國上仁所不化茂德所不綏南踰銅柱西亘金河北彌狼望東越鯷波鄒衍環海之談倚相九丘之要分道而錄竊慕魏泰之坤元三載而成頗愧野王之輿地作九州箴揜神禹底平之迹表萬里道過開元全盛之時皆聚此書如指諸掌必才兼倚相九丘風土以周知非學至揚雄諸國方言之孰正咨耆訪耋搜籍索圖王母之國孺亥之筭地理之最莫功於圖書周官職方氏掌天下之圖周知利害沛公入闗蕭何收秦圖籍具知阸塞光武與鄧禹論天下郡國亦披輿地圖乃克見不出戸庭而九州萬里在吾目中如䇿馬并轡振衣絜領自始基之艱奄有之漸功名纎悉俾一過前而輒不忘于心蓋神禹氏别九州而為書有典則以貽子孫者也方春秋時大皥之後猶有任宿須句顓臾四國存而少皥之祀莒郯實司之至於戰國獨任僅見於孟子之書管子凡天下名山五千二百七十出銅之山四百六十七出鐵之山三千六百有九河圖括地象曰八極之廣東西二億三萬三千里南北二億三萬一千五百里夏禹所治四海内地東西二萬八千里南北二萬六千里尸子曰天左舒而起牽牛地右闢而起畢昴三禮義宗天有十二次日月所經地有十二分王侯所國玉海卷十五
