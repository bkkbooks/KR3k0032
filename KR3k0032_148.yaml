body:
  text: 玉海卷一百四十八宋王應麟撰兵制馬政一古者牧養之馬有養之官有藏之於民官民通牧者周也牧於民而用於官者漢也牧於官而給於民者唐也黄帝馬師列仙傳劉向撰馬師皇者黄帝馬師淮南子黄帝治天下飛黄服皁吕氏春秋乗雅作駕寒哀作御夏九代馬山海經大樂之野夏后啓於此舞九代馬乗兩龍文選王元長序夏后兩龍載驅璿臺之上注良曰夏后啓有馬號為兩龍乗游於璿臺之上以饗諸侯百官也殷牧師後漢西羌傳殷太丁之時周季歴復伐燕京之戎後二年周人克余無之戎於是太丁命季歴為牧師注季歴文王之父也竹書紀年曰太丁四年周人伐余無之戎克之周王季命為殷牧師秦紀費昌為湯御太戊使中衍為御吕氏春秋伊尹說湯曰青龍之匹遺風之乗注馬名詩出車我出我車於彼牧矣注出車就馬於牧地我我殷王也禹貢萊夷作牧注可以放牧記夏戎事乗驪殷戎事乗翰周乗騵夏駱馬黒鬛殷白馬黒首周黄馬蕃鬛疏魯有三代之馬宋志夏馬駵殷馬駱周馬騂周十二閑六廏馬政夏官校人中大夫二人上士四人下士十有六人注校人馬官之長掌王馬之政注政謂差擇養乗之數也月令曰班馬政左傳昭公二十七年楚都君子及王馬之屬注王之養馬官屬校人也辨六馬之屬種馬一物戎馬一物齊馬一物道馬一物田馬一物駑馬一物玉路駕種馬戎路駕戎馬金路駕齊馬象路駕道馬田路駕田馬駑馬給宫中之役詩車攻我馬既同注宗廟齊豪尚純也戎事齊力尚强也田獵齊足尚疾也先魯頌正義天子戎路無飾故卑於象路戎馬尚强故於齊馬詩六月比物四驪注毛物也正義戎車雖以齊力為主亦不厭其同色故曰駟騵彭彭又曰乗其四騏田獵齊足而曰四黄既駕皆同色也無同色者乃取異毛騏駵是中騧驪是驂是也輈人國馬之輈注國馬謂種戎齊道馬髙八尺凡頒良馬而養乗之乗馬一師四圉三乗為皁皁一趣馬三皁為繫繫一馭夫六繫為廏廏一僕夫六廏成校校有左右駑馬三良馬之數麗馬一圉八八疑為六字之誤麗一師八師一趣馬八趣馬一馭夫良善馬五路之馬鄭司農云四匹為乗養馬為圉康成謂二耦為乗自乗至廏其數二百一十六匹易乾為馬此應乾之筴也至校變為言成者明六馬各一廏此云六馬者蓋合下駑馬三分之一言之自此而王馬小備也校有左右則良馬一種者四百三十二匹五種合二干一百六十匹駑馬三之則為千二百九十六匹五良一駑凡三千四百五十六匹然後王馬大備詩云騋牝三千此謂王馬之大數與麗偶也駑馬自圉至馭夫凡馬千二十四匹與三良馬之數不相應八皆為六字之誤也師十二匹趣馬七十二匹則馭夫四百三十二匹然後而三之無僕夫者不駕於五路卑之也天子十有二閑每廏為一閑馬六種邦國六閑晉六騶馬四種家四閑馬二種諸侯無種戎而有齊道田駑大夫有田馬其駑馬皆分為三魯頌傳有良戎而無齊道凡馬特居四之一春祭馬祖執駒馬祖天駟也夏祭先牧頒馬攻特先牧始養馬者秋祭馬社臧僕馬社始乗馬者臧僕謂簡練馭者世本相土作乗馬冬祭馬步獻馬講馭夫馬步神為災害馬者凡大祭祀朝覲會同毛馬而頒之軍事物馬而頒之毛馬齊其色物馬齊其力趣馬下士皁一人掌賛正良馬而齊其飲食簡其六節注差王馬以為六等常書立政趣馬小尹庶吉士巫馬下士二人醫四人掌養疾馬而乗治之牧師下士四人掌牧地皆有厲禁而頒之孟春焚牧中春通淫掌其政令凡田事贊焚萊廋人下士閑二人掌十有二閑之政教以阜馬佚特教駣音肇攻駒及祭馬祖祭閑之先牧及執駒散馬耳圉馬九者皆有政教正校人員選校人謂師圉也馬八尺以上為龍月令駕蒼龍七尺以上為騋詩騋牝三千六尺以上為馬圉師乗一人四馬為乗掌教圉人養馬春除蓐釁廏始牧夏庌馬冬獻馬蓐馬兹也馬既出而除之新釁焉神之也庌音雅庌廡所以庇馬涼也圉人良馬匹一人駑馬麗一人麗耦也掌養馬芻牧之事以役圉師凡賔客喪紀牽馬而入陳廞馬亦如之周秩官曰司馬陳芻注司馬掌帥圉人養馬故陳芻周制曰國有郊牧注放牧之地載師有牧田馬質中士二人掌質馬馬量三物曰戎田駑皆有物賈綱惡馬禁原蠶注天文辰為馬蠶書蠶為龍精馭夫分公馬而駕治之注乗調六種之馬秋官蠻隸掌役校人養馬月令仲夏班馬政養馬之政教廋人職曰掌十有二閑之政教季秋班馬政命僕及七騶咸駕馬政謂齊其色度其力使同乗也周官馬政養之以皁乗廏校視之以圉牧廋巫設祖牧社步之祭以謹其本時出入游靡之節以宣其性情分庌棧牝牡之别以一其種嚴攻講刻剔之䇿以就其才又為之禁原驅䗽綱惡去害春祭房星尊祖也夏祭先牧尚養也秋祭馬社敬乗也冬祭馬步存祖也𤭔之秣之斯馬斯才既伯既禱有駜有容芻秣之式掌于太宰以馬名卿列于夏官駟騵彭彭武王所乗駟鐵孔阜秦襄以田是齊色不專宗廟詩正義干旄傳驂馬五轡王肅云古者一轅之車駕三馬則五轡其大夫皆一轅車夏后氏駕兩謂之麗殷益以一騑謂之驂周人又益一騑謂之駟本從一驂而來亦謂之驂王基云商頌約軝錯衡八鸞鏘鏘則殷駕四不駕三也又異義天子駕數易孟京春秋公羊說天子駕六毛詩說天子至大夫同駕四士駕二詩之四騵彭彭武王所乗龍旂承祀六轡耳耳魯僖所乗四牡騑騑周道倭遲大夫所乗禮王度記天子駕六諸侯與卿同駕四大夫駕三士駕二庶人駕一說與易春秋同玄之聞也周禮校人乗馬一師四圉四馬為乗此一圉養一馬而一師監之也尚書布乗黄朱言獻四黄馬朱鬛也既周天子駕六則校人何不以馬與圉以六為數諸侯何以不獻六馬王度記曰大夫駕三經傳無所言是自古無駕三之制也詩吉日庚午疏必用午日者蓋於辰午為馬故也無羊疏擬駕用者屬牧師令生息者屬牧人周戎馬左傳成元年三月作丘甲注周禮九夫為井四井為邑四邑為丘丘十六井出戎馬一匹牛三頭四丘為甸甸六十四井出長轂一乗戎馬四匹牛十二頭甲士三人步卒七十二人此甸所賦今魯使丘出之正義注多是司馬法而以周禮冠之以司馬法祖述周禮所陳即周法也司馬法六尺為步步百為畆畆百為夫夫三為屋屋三為井四井為邑四邑為丘丘有戎馬一匹牛三頭是曰匹馬丘牛四丘為甸甸六十四井出長轂一乗馬四匹牛十二頭甲士三人步卒七十二人戈楯具謂之乗馬鄭注論語云司馬法成方十里出革車一乗注小司徒云成出革車一乗甲士十人徒二十人與此不同者謂公卿大夫畿内采地之制此謂諸侯邦國出軍之法甸即乗也六十四井出車一乗故以甸為名書周官注夏官卿主戎馬之事掌國征伐詩秦駟驖四馬既閑正義四種之馬諸侯無種戎四馬當八轡言六轡者以驂馬内轡納之於觖故在手唯六轡聘禮云賔覿總乗馬注云總八轡牽之謂賛者步牽馬故八轡皆在手也大叔于田言六轡如手謂馬之進退如御者之手為御之良此言在手謂不假控制為馬之良曲禮前有車騎則載飛鴻疏古人不騎馬經典無言騎者今言騎是周末時禮陸氏曰古稱黄帝以車戰蚩尤以騎戰又齊魯相遇以鞍為几則軍之有騎尚矣詳見後周八駿圖穆天子傳癸酉天子命駕八駿之乗右服𤭔騮而左騄耳右驂赤蘎古驥字而左白天子主車造父為御為右次車之椉右服渠黄而左踰輪右驂盜驪而左山子柏天主車參伯為御奔戎為右至于黄澤官樂謡曰黄之池其馬歕沙皇人威儀黄之澤其馬歕玉皇人夀榖列子周穆王肆意逺遊命駕八駿之乗左服􅢒華字騮而右綠耳右驂赤驥而左白􅠋古義字主車則造父為御􅀢泰字丙字為右次車之乗右服渠黄而左踰輪左驂盜驪即纖離而右山子柏天主車參百為御奔戎為右驅馳千里至於巨蒐氏之國宿于崑崙之阿赤水之陽别日升于崑崙之丘以觀黄帝之宫遂賔于西王母觴于瑶池之上乃觀日之所入一日行萬里史記秦本紀造父以善御幸于周繆王得驥温驪驊騮一云華騮綠耳之駟集解郭璞曰紀年云北唐之君來見以一驪馬是生綠耳八駿皆因其毛色以為名號駰按穆天子傳有八駿之乗此紀不具郊爾雅疏云穆天子傳丙寅天子屬官効器乃命正公父受勅憲用中八駿之乗以飲于枝洔之中積石之南河郭注云盜驪者為馬細頸綠耳者紀年云北唐之君來見以一驪馬是生綠耳栁宗元觀八駿圖說云好事者為之圖宋齊以來傳之西巡狩樂而忘歸徐偃王作亂造父為繆王御長驅歸周一日千里以救亂繆王以趙城封造父白此為趙氏非子居犬丘好馬及畜善養息之犬丘人言之周孝王孝王召使主馬于汧渭之間馬大蕃息孝王曰昔栢翳為舜主畜畜多息故有土賜姓嬴今其後世亦為朕息馬其分土為附庸邑之秦使復續嬴氏祀拾遺記穆王即位三十二年巡行天下馭黄金碧玉之車傍氣乗風起朝陽之岳自明及晦窮㝢縣之表御八龍之駿一名絶地足不踐土二名翻羽行越飛禽三名奔霄夜行萬里四名超影逐日而行五名踰輝毛色炳耀六名超光一形十影七名騰霧乗雲而奔八名挾翼身有肉翅遞而駕焉按轡徐行以匝天地之域書穆王命伯冏為太僕正正于羣僕侍御之臣造父為御周遊天下導其侈者果出于僕御之間人心操舍之無常可懼哉隋志五行類有周穆王八馬圖選七命注駿馬圖有含陽侯驃國史志史道碩畫八駿圖一卷崇文目八駿圖一卷小說唐李觀有八駿圖序栁宗元有觀八駿圖說淮南子散宜生得騶虞雞斯之乗說文馬赤鬛縞身目若黄金名曰𤭔吉皇之乗周文王時犬戎獻之左傳唐成公有兩驌驦馬古今注秦始皇有七名馬一追風二白兔三躡影四追電五飛翮六銅雀七晨鳬張說集秦汧渺渺尚想非子之風魯野區區猶傳史克之頌穆王八駿有驊騮騄耳之號漢文九逸有浮雲絶塵之目周良馬穆天子傳壬戌天子至于雷首犬戎觴天子雷首之阿乃獻良馬四六天子使孔牙受之水經注引云云受之於雷水己巳天子東征食馬于漯水之上水經注引之水經注湖水出桃林塞之夸父山其中多野馬造父于此得驊騮綠耳盜驪之乗以獻周穆王使之馭以見西王母揚雄河東賦注師古曰翠龍穆天子所乗馬也魯延廏法廏坰牧晉六騶小駟左傳莊二十九年春新作延廏書不時也凡馬日中而出日中而入正義春分百草始繁則牧於坰野秋分農功始藏水寒草枯則皆還廏此周典之制也詩箋乗馬繫於廏無事則委之以莝有事乃予之榖愛國用也榖梁傳延廏者法廏也注六閑之舊制魯頌駉頌僖公也僖公牧於坰野駉駉牡馬有驈皇驪黄首章言良馬朝祀所乗故云彭彭騅駓騂騏二章言戎馬齊力尚强故云伾伾驒駱駵雒三章言田馬齊足尚疾故云繹繹駰騢驔魚卒章言駑馬給雜使貴肥壯故云祛袪思無疆期斁邪馬思臧才作徂正義禮諸侯六閑馬四種傳謂有良戎田駑不言齊道魯金象路共駕良馬戎路駕戎馬田路駕田馬駑給宫中之役衛風騋牝三干衛兼弼鄘而有之馬數過禮制齊語桓公封衛與之繫馬三百命彼倌人主駕者秦風小戎文茵暢轂駕我騏馵四牡孔阜六轡在手騏駵是中騧驪是驂俴駟孔羣厹矛鋈錞李斯書乗纖離之馬左傳僖十五年晉乗小駟鄭入也慶鄭曰大事必乗其産生其水土知其人心安其教訓服習其道冀之北土馬之所生無興國焉良晉問云牽以荀息御以王超以范鞅掀以欒鍼成十八年晉程鄭為乗馬御六騶屬焉使訓羣騶知禮注六閑之騶周禮諸侯有六閑馬正義周禮掌馬之官無名騶者襄三十三年傳豐㸃為孟氏之御騶則騶亦御之類每廏有趣馬十八人六閑之騶有一百八人晉語謂之賛僕秋晉屈産之乗月令季班馬政命僕及七騶咸駕注七騶謂趣馬主為諸官駕說者正義皇氏云天子馬有六種種别有騶則六騶也又有總主之人并六騶為七故為七騶襄二十五年楚蒍掩賦車籍馬注籍疏其毛色嵗齒以備軍用鄭有馬師楚有監馬尹宫廏尹楚語國馬足以行軍公馬足以稱賦注國馬民馬公馬公之戎馬也韓非子秦穆公起卒革車五百乗疇騎二千步卒五萬輔重耳入于晉疇等也言馬齊等史記蘇秦傳燕車六百乗騎六千匹趙車千乗騎萬匹魏車六百乗騎五千匹楚車千乗騎萬匹秦北有代馬戰國䇿蘇厲說趙曰代馬胡駒公羊注禮大夫以上至天子皆乗四馬所以通四方也天子馬曰龍髙七尺以上諸侯田馬髙六尺以上卿大夫曰駒髙五尺以上禮大司馬帥師執提鄭司農云謂馬上鼓疏曰先鄭葢據當時已有單騎舉以況周其實周時皆乗車無輕騎法也春秋正義古者馬以駕車六國時始有單騎蘇秦云車千乗騎萬匹是也司馬法孫子無騎戰吳起之為武侯戰以車五百乗騎三千匹而破秦五十萬衆其書六篇往往皆有騎戰蘇秦說六國於燕言騎六千匹於趙楚言騎萬匹於魏言騎五千匹張儀說韓言秦騎萬匹趙變胡服招騎射此皆戰國用騎戰之驗今六韜言騎戰決非太公所作古亦未有無車而乗馬者故易曰舍車而徒餘又見周戎馬段漢五監六廏六牧師苑三十六苑騎馬令駿馬監建章監家馬官長樂未央廏中廏令百官表大僕秦官掌輿馬有兩丞屬官有大廏未央家馬三令各五丞一尉大廏者天子之法廏惠帝紀所謂都廏也家馬供天子私用非大祀戎事軍國所需故謂之家馬上官桀為未央廏令又車府路軨騎馬駿馬四令丞又龍馬閑駒槖泉騊駼承華五監長丞如淳曰槖泉廏在槖泉宫下騊駼野馬也師古曰閑闌養馬之所也故曰閑駒騊駼出北海中其狀如馬非野馬也嚴安為騎馬令又邊郡六牧師苑令各三丞注師古曰漢官儀云牧師諸苑三十六所漢儀注云太僕牧師諸苑三十六所奴景紀注如淳曰漢儀注置北邊西邊以郎為苑監官婢三萬人養馬三十萬匹又牧槖昆蹏令丞槖槖駝昆蹏好馬名也蹏音蹄爾雅曰昆蹏趼善升甗者也師古曰牧槖言牧養槖駝也苑郭璞曰昆蹏善上山秦時昆蹏是也皆屬焉中太僕掌皇太后輿馬不常置也武帝太初元年更名家馬為挏徒孔反馬樂志孔光奏省樂官七十二人給大官挏馬酒初置路軨五行志未央殿輅軨中云云孟康曰廏名也門黄圖路軨蓋在未央宫中掌宫輿馬亦曰未央廏水衡都尉元鼎二年初置屬官有技巧六廏令丞成帝建始二年三月丙午省技巧六廏官秋減乗輿廏馬路漢舊儀云天子六廏未央承華騊駼騎馬軨大廏也馬皆萬匹據此表太僕屬官已有大廏未央路軨騎馬騊駼承華而水衡又云六廏技巧官是技巧之徒供六廏者其官别屬水衡也廏劉氏曰上林自有六一令丞主之地理志北地郡靈洲縣有河竒苑號北苑歸德縣有堵苑白馬苑郁郅縣有牧師苑官苑謂馬牧遼東郡襄平縣有牧師官西河郡鴻門縣有天封苑太原郡有家馬官注漢有家馬廏一廏萬匹後改曰挏馬功臣表兼史記張良以廏將從起下邳王陵以廏將别定東郡南陽祕彭祖為中廏令夏侯嬰為沛廏司御為滕令因奉車復為太僕齊受以家車吏入漢師古曰家車非軍國所用紀文帝二年十一月癸夘詔太僕見馬遺財足餘皆以給傳置賈山至言云省廏馬以賦縣傳去諸苑以賦農夫昭帝始元四年七月詔往時令民共出馬其止勿出諸給事中都官者且減之元鳯三年正月罷中牟苑賦貧民注在滎陽元帝初元元年九月詔太僕減穀食馬貢禹言髙祖文景循古節儉廏馬百餘匹今廏馬食粟將萬匹惟深察古道從其儉者可無過數千匹乃下詔太僕減榖食馬省宜春苑與貧民二年三月詔罷黄門乗輿狗馬五年四月詔乗輿秣馬無乏正事而已武紀太初二年五月籍吏民馬補車騎馬武帝初廏馬四十萬匹口鹽鐡論云賢良曰一馬伏櫪當中家六之食無丁男一人之事列傳李陵為建章監監諸騎衛青亦為之金日磾為馬監日磾弟倫輸黄門養馬吾丘夀王願養馬黄門衛青使咸宣買馬河東召為廏丞史記云大廏丞傅介子元鳯中以駿馬監求使大宛遷平樂監戾太子傳發中廏車載射士師古曰中廏皇后車馬所在駙楚有宫廏尹養由基扈魏王朗曰西京中廏則騑騄馬六萬餘匹外牧則養三萬而馬十之續志太僕有未央廏令長樂廏丞鄭衆子安世為長樂未央廏令與來歴俱詣鴻都門注廏令秩六百石本注舊有六廏令中興省約但置一廏後置左駿令廏别主乗輿御馬後或并省太子廏長一人四百石主車馬古今注漢安元年七月置承華廏令安帝紀永初元年九月壬午詔廏馬非乗輿常所御者皆減半食漢九廏三輔黄圖未央大廏在長安故城中翠華大輅果馬軛梁騎馬大宛胡河騊駼凡九廏在長安城外霸昌觀馬廏在長安城外都廏天子車馬所在中廏皇后車馬所在太平御覽云黄圖未央宫有金廏輅軨廏大廏果馬廏軛梁廏騎馬廏大宛廏胡河廏騊駼廏凡廏尢在城内漢都廏霸昌廏交道廏濯龍廏惠紀三年七月都廏災大廏者天子法廏所謂都廏也是時天子居未央宫供天子之用也家馬供天子私用非戎祀軍國所須故謂家馬也騎馬所用雖未詳然非天子所御也龍馬以下五監皆牧養之所也牧槖師古曰牧養槖駝也昆蹏爾雅云昆是蹏趼善升甗郭璞謂蹏如趼而健上山秦時有騉蹏苑也邊郡六牧師苑漢官儀所謂三十六所是也此西都馬政之大畧史記田叔還至霸昌廏括地志在雍州萬年東北三十八里郡國志在長安西二十五里谷永傳敕過交道廏勿追注去長安六十里近延陵文選赭白馬賦注盧植集曰詔給濯龍廏馬三百匹銑曰濯龍内廏名晉志漢侍御史五曹四曰尉馬曹掌廏馬廏嗇夫田廣明傳騶馬猥佐楊惲傳給騶使乗之佐主猥馬吏也恵紀武士騶騶騎也漢馬復令馬弩關食貨志文帝時鼂錯說曰令民有車騎馬一匹者復卒三人車騎天下之武備也故為復卒師古曰當為卒者免其三人不為卒者復其錢武帝令民得畜邊縣官假馬母三嵗而歸及息什一用充入新秦中車騎馬乏縣官錢少買馬難得乃著令令封君以下至三百石吏以上差出牝馬天下亭亭有畜字馬嵗課息武紀元狩五年春三月天下馬少平牡馬匹二十萬注如淳曰貴平牡馬賈欲使人共畜馬西域傳征和中搜粟都尉弘羊請屯田輪臺以東上詔曰當今務在禁苛暴止擅賦力本農修馬復令以補缺毋乏武備而已郡國二千石各上進畜馬方畧補邊狀與計對師古曰馬復因養馬以免繇賦也貨殖傳馬蹏噭千為馬二百景紀中四年春二月御史大夫綰奏禁馬高五尺九寸以上齒未平不得出關昭紀始元五年夏罷天下亭母馬及馬弩關注孟康曰舊馬高五尺六寸齒未平弩十石以上皆不得出關今不禁也新序上從主父偃之計因關馬及弩不得出作唐貞元二年八月庚戌禁大馬出蒲潼武關㑹要元年霍去病傳衛霍兩軍之出塞閱官及私馬凡十四萬匹後入塞不滿三萬匹乃置大司馬位大將軍票騎皆為大司馬自青圍單于後不擊匈奴者以漢馬少王温舒傳為河内太守令郡具私馬五十匹為驛自河内至長安周校人六廏凡三千四百匹頒之官府卿大夫之共軍事者也而丘甸之馬民自備之以從戎自井田既壊凡有師役皆賦馬與民孝武末年籍吏民馬而課息徧于天下古之軍賦殆不如此漢苑馬牧師苑内外廏又見前流馬苑景紀中六年六月匈奴入鴈門至武泉入上郡取苑馬注如淳曰漢儀注太僕牧師諸苑三十六所分布北邊西邊以郎為苑監官奴婢三萬人養馬三十萬匹師古曰養鳥獸者通名為苑故謂牧馬處為苑留侯曰關中北有胡苑之利食貨志景帝始造苑馬以廣用師古曰為苑以牧馬武帝時吿緍没入奴婢分諸苑養馬昭紀元鳯二年六月詔頗省乗輿馬及苑馬㠯補邊郡三輔傳馬傳馬驛馬也令郡國毋斂今年馬口錢元紀初元二年六月省苑馬以振困乏地理志武威以西水草宜畜牧故涼州之蓄為天下饒安定郡參䜌有主騎都尉和紀永元五年二月戊戌詔有司省減内外廏及涼州諸苑馬注漢官儀曰未央六廏長樂承華等廏令皆秩六百石又云牧師諸苑三十六所分置西北邊分養馬三十萬頭安紀永初六年春正月庚申詔越巂置長利髙望始昌三苑又令益州郡置萬嵗苑犍為置漢平苑續志太僕有牧師苑皆令官主養馬分在河西六郡界中六郡隴西天水安定上郡北地西河中興皆省唯漢陽有流馬苑但以羽林郎監領未央廏令一人六百石長樂廏丞一人注漢官曰苜蓿苑官田所一人守之漢陽即天水永平十七年更名爾雅注秦有騉蹄苑周官牧師掌牧地下士四人主牧放馬而養之高紀至陽城收軍中馬騎四年八月北貉燕人來致梟騎助漢八年三月令賈人毋得乘騎馬注乗駕車騎單騎食貨志漢初天子不能具駟武帝初衆庶街巷有馬天子為伐胡盛養馬馬徃來食長安者數萬匹卒掌者關中不足乃調旁近郡縣官不給天子乃解乘輿駟郄昂曰始皇并㝢内六萬騎之國馬盡歸秦漢武崇飾戰馬至四十萬匹匈奴傳票騎之出匈奴雖逺去漢馬少無以復徃平準書發三河以西騎擊西羌貨殖傳塞之斥也唯橋桃以致馬千匹眺錯傳益以邊郡之良騎趙充國傳軍馬一月之食度支田士一嵗奏罷騎兵省大費至四月草生發郡騎及屬國胡騎伉健各千倅馬十二就草揚雄賦方馳千駟校尉萬師光武以所乗大驪馬賜李忠寇恂拜河内太守委以率厲士馬恂講兵肄射養馬三千匹吳漢曰漁陽上谷突騎天下所聞選烏桓突騎三千餘人張堪遷謁者使領騎七千匹詣大司馬吳漢軍元初中虞詡說任尚以兵法弱不攻强走不逐飛莫如罷數郡兵各令出錢數千二十人共市一馬以萬騎之衆逐數千之虜追尾掩截其道自窮順帝永建元年五月丁丑詔幽并涼州刺史嚴勑障塞繕設屯備立秋之後簡習戎馬漢九逸西京雜記文帝自代還有良馬九匹皆天下駿足也名曰浮雲赤電絶羣逸驃紫燕騮綠螭驄龍子驎駒絶塵號為九逸有來宣能御選注引此一名飛燕騮穆王八駿有驊騮騄耳之號漢文九逸有浮雲絶塵之目漢千里馬四駿馬滇池神馬魏澤馬賈捐之傳孝文時有獻千里馬者詔曰朕乗馬獨先安之還馬與道里費詔曰朕不受獻也令四方毋獻太宗卻走馬匈奴傳千里馬匈奴寶馬也西域賛蒲梢龍文魚目汗血之馬充於黄門注孟康曰四駿馬名後循吏傳建武十三年異國有獻名馬者日行千里東觀記曰名都王國獻名馬詔以馬駕鼔車南蠻傳肅宗元和中蜀郡王追為益州太守政化尤異有神馬四匹出滇池中滇池周迥二百餘里源深廣而末淺狹有似倒流馬七命注隴西神馬山有淵池龍所生東京賦圉林氏之騶虞擾澤馬與騰黄注山海經大封國有丈馬縞身朱鬛名曰吉良乗之夀千嵗瑞應圖曰騰黄神馬一名吉光吉良騰黄一馬異名也却走馬於糞車何惜騕褭與飛兔晉載記苻堅時大宛獻天馬千里駒皆汗血朱鬛五色鳯膺麟身命羣臣作止馬詩而遣之宋顔延之賦帝軒陟位飛黄服皁后唐膺籙赤文候日漢道亨而天驥呈才魏德懋而澤馬效質謝莊傳河南獻舞馬詔羣臣為賦莊上其辭曰輝大馭於國皁賁上襄於帝閑雙璧應範三封中圖又作舞馬歌令樂府歌之魏文帝以纖驪馬遺吳李斯書乗纖离之馬宋志騰黄王者德御四方則出白馬朱鬛王者任賢良則見澤馬王者勞來百姓則至蜀都賦乗驥子服魚文玄黄異校結駟繽紛漢余吾水馬渥洼水天馬中盧馬武紀元狩二年夏馬生余吾水中在朔方北元鼎四年秋馬生渥洼水中注南陽新野有暴利長當武帝時遭刑屯田敦煌界數於此水旁見羣野馬中有竒者與凡馬異來飲此水利長先作土人持勒絆於水旁後馬既玩習之代土人持勒絆收得其馬獻之欲神異此馬云從水中出作寶鼎天馬之歌五年十一月詔曰渥洼水出馬朕其御焉禮樂志郊祀歌十九章第十章曰太乙況天馬下沾赤汗沫流赭志俶儻精權竒籋浮雲晻上馳體容與迣萬里今安匹龍為友元狩三年馬生渥洼水中作按武紀乃云元鼎四年又云元狩二年夏馬生余吾水中亦非三年後郡國志南郡中盧盧一作廬注襄陽耆舊傳曰縣西山中有一道漢時常有數百匹馬出其中馬形皆小似巴滇馬華子云堯漢皆得馬者以皆火德正斗南方乗德而至漢烏孫天馬西極馬宛天馬西極天馬歌汗血馬張騫傳元狩中得烏孫馬好名曰天馬及得宛汗血馬益壯更名烏孫馬曰西極馬宛馬曰天馬初天子發書易曰神馬當從西北來漢使少從率進孰於天子隨使而出外國者為少從進孰者但進成熟之言言大宛有善馬在貳師城匿不肯示漢使天子旣好宛馬聞之甘心使壯士車令等持千金及金馬以請宛王貳師城善馬宛國饒漢物相與謀曰漢去我逺而鹽水中數有敗出其北有胡冦出其南乏水草又且往往而絶邑乏食者多漢使數百人為輩來常乏食死者過半是安能致大軍乎且貳師馬宛寶馬也遂不肯予漢使怒妄言椎金馬而去宛中貴人怒曰漢使至輕我李廣利傳太初元年為貳師將軍發屬國六千騎及郡國數萬人期至貳師城取善馬益發戍甲卒十八萬七科適而拜習馬者二人為執驅馬校尉備破宛擇取善馬攻四十餘日迺出其馬令漢自擇之漢軍取其善馬數十匹中馬以下牝牡三千餘匹西域傳宛别邑七十餘城多善馬汗血言其先天馬子也張騫始為武帝言之遣使者持千金及金馬以請宛善馬宛王以漢絶逺大兵不能至愛其寶馬不肯與漢使妄言宛遂殺漢使期門車令取其材物於是天子遣貳師將軍李廣利將兵前後十餘萬人伐宛連四年宛人斬其王毋寡首獻馬三千匹漢軍乃還貳師斬宛王更立貴人素遇漢善者名昧蔡為宛王後嵗餘宛貴人以為昧蔡讇使我國遇屠相與共殺昧蔡立毋寡弟蟬封為王遣子入侍宛王蟬封與漢約嵗獻天馬二匹孟康曰言大宛國有髙山其上有馬不可得因取五色母馬置其下與集生駒皆汗血因號天馬云傳賛聞天馬則通大宛武紀太初四年春貳師將軍李廣利斬大宛王首獲汗血馬來作西極天馬之歌應劭曰大宛舊有天馬蹋石汗血汗從前肩髆出如血一日千里禮樂志天馬徠從西極涉流沙九夷服天馬徠出泉水虎脊兩化若鬼天馬徠歴無草徑千里循東道天馬徠執徐時太嵗在辰曰執徐時嵗在辰將揺舉誰與期天馬徠開逺門竦予身逝昆侖天馬徠龍之媒游閶闔觀玉臺上帝所居天馬十太初四年誅宛王獲宛馬作史記樂書得神馬渥洼水中為太一歌後伐大宛得千里馬名蒲梢作天馬歌馮奉世傳宣帝時至大宛得名馬象龍而還師古曰言馬形似龍者後傳建初三年賜東平王蒼及琅琊王京書云并遺宛馬一匹血從前髆上小孔中出常聞武帝歌天馬霑赤汗今親見其然也又建武二十六年南單于獻文馬十匹二十八年北匈奴貢馬永平十七年耿恭檄烏孫遣使獻名馬論都賦馭宛馬鞭駃騠晉武帝泰始六年九月大宛獻汗血馬漢栘中監平樂監昭紀始元六年詔栘中監蘇武前使匈奴云云注如淳曰栘園之中有馬廏也監官也按詩注栘唐棣也金日磾傳拜為馬監傅介子傳以平樂廏監使誅樓蘭王後漢禮震為淮陽王廏長馬融為河間王廏長史漢宣德殿馬式東門京銅馬法相馬經馬援傳字文淵好騎善别名馬建武二十年征交趾還於交阯得駱越銅鼔乃鑄為馬式還上之因表曰夫行天莫如龍行地莫如馬馬者甲兵之本國之大用安寧則以别尊卑之序有變則以濟逺近之難昔有騏驥一日千里伯樂見之昭然不惑伯樂秦穆公時善相馬者也桓寛鹽鐵論曰騏驥負鹽車垂頭於太行之坂見伯樂噴而長鳴近世有西河子輿亦明相法子輿傳西河儀長孺長孺傳茂陵丁君都君都傳成紀楊子阿臣嘗師事子阿受相馬骨法考之行事輒有效驗臣愚以為傳聞不如親見視影不如察形今欲形之於生馬則骨法雖備具又不可傳之於後孝武皇帝時善相馬者東門京鑄作銅馬法獻之有詔立馬于魯班門外更名魯班門曰金馬門臣謹依儀氏䩭居竒反中帛氏口齒謝氏唇鬐丁氏身中備此數家骨相以為法馬髙三尺五寸圍四尺五寸有詔置宣德殿下以為名馬式焉注援銅馬相法曰水火欲分明水火在鼻兩孔間也上唇欲急而方口中欲紅而有光此馬千里頷下欲深下唇欲緩牙欲前向牙欲去齒一寸則四百里牙劒鋒則千里目欲滿而澤腹欲充膁欲小季肋欲長懸薄欲厚而緩懸薄股也腹下欲平滿汗溝欲深長而膝本欲起肘腋欲方蹄欲厚三寸堅如石武紀注應劭曰永平五年至長安取飛亷并銅馬置上西門外平樂館東京賦平樂都塲天馬半漢注銅馬也金馬式賦哂求市之三年無相肥於一槩仰沛艾以龍翥若驂驔而鹿超牛以石駝以銅作賂大宛為神蜀郡作鏡域中垂衡天下稱驥德頌駉牧銅馬賦研精以範酌憲于心張戎容程國步狀赤文之呈瑞方候日于堯庭隋志五行類伯樂相馬經一卷闕中銅馬法崇文目周穆王相馬經三卷文選張協七命秦青不能識其衆尺九方堙不能覩其若滅班固云良樂軼能於相馭注相馬經曰夫法千里馬有三十六尺四寸吕氏春秋古之善相馬者寒風氏相口齒麻朝相頰女厲相目衛忌相􅧋許鄙相􅪉投伐褐相胷脅管青膹肳一作脣吻陳悲股脚秦牙相前賛君相後十人皆良工也所以相者不同見馬之一徵也若趙之王良秦之伯樂九方堙尤盡其妙漢承華廏髙車廏順帝紀漢安元年秋七月始置承華廏東觀記曰時以逺近獻馬衆多園廏充滿始置承華廏令秩六百石百官志注引古今注年月同東京賦駙承華之蒲梢注廏名華漢官儀有承廏杜篤傳建武十九年作髙車廏於長安吕强傳諫曰中廏聚大僕之馬郡國志陳留尉氏注陳留志曰北有澤澤有天子苑囿有秦樂廏漢諸帝以養猛獸漢騄驥廏靈帝紀光和四年春正月初置騄驥廏丞領受郡國調馬注騄驥善馬也調謂調發豪右辜榷馬一匹至二百萬魏乗黄廏又見唐乗黄廏令六典大僕有乗黄廏漢為未央廏魏改乗黄晉因之乗黄古神馬因以為名乗黄一名飛黄淮南子天下有道飛黄伏皁漢志日出入詩曰訾黄其何不徠下應劭曰訾黄一名乗黄龍翼而馬身黄帝乗之而仙魏都賦冀馬填廏而駔駿注鄴城西下有乗黄廏魏書曹公列鐵騎五千為十重陣精光曜日縱虎騎夾擊馬超大破之鍾繇為司隸送馬二千餘匹以給軍陳王植於武帝世得大宛紫騂馬一以獻文帝黄伯仁龍馬頌耳如剡筩目象明星雙璧似月蘭筋參情晉典牧都尉三廏職官志太僕統左右中典牧都尉車府典牧乗黄驊騮龍馬三廏令郭展為太僕廏馬充多渡江後太僕省故驊騮為門下之職江左初侍御史置庫曹掌廏牧晉有赤龍騄驥諸苑六典注魏置牧官都尉晉因之梁書天監七年置太僕卿統南牧左右牧龍廏内外廏唐改龍廏為典廏傅玄乗輿馬賦文榮其德武曜其威藉田賦龍驥騰驤而沛艾載記慕容廆有駿馬曰赭白有竒相逸力雋比之於鮑氏驄命鑄銅以圖其象親為銘賛鐫勒其旁置之薊城東掖門元魏太武太延二年冬於雲中置野馬苑平朔方隴右以河西水草善以為牧地馬三百餘萬匹槖駝半之孝文復以河陽為牧塲戎馬十萬匹嵗自河西徙牧并州漸南欲其習水土馬之盛無如後魏太和二年龜兹獻龍馬十五年冬二千石考上上者賜乗黄馬一匹晉太元神馬晉武帝太元十四年寧州刺史費統言晉寧郡滇池縣兩神馬一白一黒盤戲河水之上水經注滇池中有神馬家馬交之則生駿駒日行五百里典畧曰神馬河之精梁馬寶頌又見祥瑞文苑英華梁簡文馬寶頌五月丁酉朔詔以馬寶示羣臣太僕效官趣馬掌賛八麗四圉給役相趨暉煜金鑣陸離寶勒鸞眄善鳴龍儀美稱總轡崑岑周非吾馭張樂大野夏有慙德乾道應坤馬來度玉關升玉臺千天駟百龍媒永伏皁掃騊駼秣瑶粟委芳芻九夷款四表清甿胥樂輿頌興初學記黄章龍馬賦生河海之濵涯被華文而朱翼玉海卷一百四十八
