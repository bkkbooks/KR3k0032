body:
  text: 玉海卷七十九宋王應麟撰車服車輿漢金根車徳車安車立車五時車大旂金路後輿服志即續志秦并天下攬其輿服漢興承秦之制後稍改定近於雅正或曰殷瑞山車金根之色殷人以為大路於是始皇作金根之車殷曰桑根秦改曰金根以金為飾玄旗皂斿以從水徳漢承秦制御為乗輿孔子所謂乗殷之路者也乗輿金根安車立車蔡邕曰五安五立徐廣曰立乗曰髙車坐乗曰安車輪皆朱班重牙貳轂兩轄東京賦曰重輪貳轄疏轂飛軨金薄繆龍為輿倚較文虎伏軾龍首銜軛左右吉陽筩鸞雀立衡􅏹文畫輈選注引此云五采文羽蓋華蚤徐廣曰翠羽蓋黄裏所謂黄屋車也金華施橑木有二十八枚即盖弓也東京賦曰樹翠羽之髙盖建大旂十有二斿畫日月升龍駕六馬東京賦六玄蚪之奕奕象鑣鏤錫金鍐方釳揷翟尾獨㫁曰金鍐者馬冠也髙廣各五寸上如玉華形在馬髦前方釳鐵也廣數寸在馬騣後後有三孔挿翟尾朱兼樊纓赤罽易茸金就十有二左纛以氂牛尾為之在左騑馬軛上大如斗徐廣曰馬在中曰服在外曰騑是為徳車五時車安立亦皆如之各如方色馬亦如之白馬為朱鬛云所御駕六餘皆駕四後從為副車古文尚書曰馭六馬逸禮王度記曰天子駕六馬諸侯駕四大夫三士二庶人一周禮四馬為乗毛詩天子至大夫同駕四士駕二易京氏春秋公羊説皆云天子駕六許慎以為天子駕六諸侯及卿駕四大夫駕三士二庶人一史記秦始皇以水數制乗六馬鄭玄以為天子四馬今帝者駕六此自漢制與古異蔡邕表志曰以文義不著之故俗人多失其名五時副車曰五帝車鸞旗曰雞翹耕根曰三盖其比非一也耕車戎車獵車其飾皆如之諸車之文乗輿倚龍伏虎􅏹文畫輈龍首鸞衡重牙班輪升龍飛軨薛綜曰飛軨以緹油廣八寸長注地畫龍虎繫軸頭為應劭漢官鹵簿圖曰乗輿大駕則御鳳皇車以金根列列宋志作副曲禮徳車結旌注不盡飾也結謂收歛之徳車乗車疏徳車謂玉金象木四路不用兵故曰徳車徳美在内不尚赫弈故結纒其旒著於竿也何胤云以徳為美故略於飾此坐乗之車也云乗車必正立則非坐乗徳車者取天子以徳為車之義記曰國君不乗竒車獵衣之屬車上不廣欬妄指立視五嶲式視馬尾顧不過轂蔡邕獨㫁五路之外復設五色安車立車各一乗皆駕四馬是謂五時副車永安七年建金根耕根諸御車皆一轅或四馬或六馬金根箱輪皆以金鏄正黄兩臂前後刻金以作龍虎鳥龜形上但以青縑為盖羽毛無後戸宋志禮論輿駕議曰周則玉輅最尊漢之金根亦周之玉路也漢制乗輿金根車云云建太常十二旒駕六黑馬施十二鸞如周玉路之制符瑞志有金車根車又五色安車五色立車各五乗建龍旂駕四馬施八鸞餘如金根之制猶周金輅也其車各如方色所謂五時副車俗謂為五帝車也江左闕旂大明三年即以金根為金路建大青十有二旒駕玄馬四羽葆蓋安車者坐乗又有建華蓋九重凡婦人車皆坐乗周體王后有安車而王無也禮巾車王后安車漢制乗輿乃有之晉先蠶儀皇后安車駕六以兩轅安車駕五為副江左駕四而已東京賦順時服以設副注五時之服各隨其車車各一色以為副貳副車各一乗今謂之五帝車傅毅洛都賦列翠蓋方龍輈備五路之時副㩜三辰之旗斿傳説作僕羲和奉時千乗雷駭萬騎星鋪班固東廵頌翿六龍較五輅備天官之羽衞盛輿服而東行馬融廣成頌乗輿乃以吉月之陽朔登于疏鏤之金輅六驌騻之玄龍建雄虹之旌夏揭鳴鳶之修橦曳長庚之飛髾載日月之太常棲招揺與玄弋注枉矢與天狼羽毛紛其髟鼬揚金㚇而拖玉瓖杜欽對成帝曰數御安車由輦道親二宫之饔膳通典安車制如金根周致仕之老及后乗之晉志車坐乗者謂之安車倚乗者謂之立車亦謂之髙車其色有青赤黄白黑立安車合十乗名曰五時車建旂十二各如車色立車則正竪其旂安車則邪注駕馬亦隨五時之色左右騑驂金㚇鏤錫黄屋左纛如金根之制行則從後五牛旗平呉後所造以五牛建旗車設五牛青赤在左黄在中白黑在右竪旗於牛背行則使人輿之盖取負重致逺旗常纒不舒所謂徳車結旌也天子親戎則舒所謂武車綏旌也綏旌垂舒之也牛宋志云五色各一旗以木承其下金根車駕四馬不建旗幟其上如畫輪車下猶金根之飾元帝造大路戎路各一即古金根之制過江之後無復五時車以馬車代之建旗其上其後以五色木牛象五時車惟天子親戎五旗舒斾梁依晉置五牛旗車執唐志五牛旗輿五皆八人之潘岳藉田賦表朱玄於離坎飛青縞於震兊中黄曅以發揮方綵紛其繁㑹注謂安立車合十乗鹵簿之儀車騎旌旗各依方色黄香天子冠頌皇輿幸夫金根六玄蚪之連蜷建螭龍以為旂鳴節路之和鑾初學記董巴輿服志曰太后太皇太后法駕六御金根車隋志司馬彪志云漢備五輅或謂徳車駕馬皆如方色漢太子諸王皆乗金輅及安車續志注魏武帝令問東平王有金路何意漢芝車耕根車農輿春路後輿服志耕車其飾皆如金根有三蓋一曰芝車置􅞙耒耜之箙上親耕所乗也注新論桓譚謂揚雄曰君為黄門郎居殿中數見輿輦玉蚤華芝及鳳皇三蓋之屬皆玄黄五色飾以金玉翠羽珠絡錦繡茵席東京賦曰立戈迆戛農輿路木薛綜曰戈句孑㦸戛長矛置車上者邪柱之是謂戈路農輿三蓋所謂耕根車也車耕于藉乗馬無飾故稱木也賀循曰漢儀親耕青衣幘東京賦説親耕亦云鸞路蒼龍賀循曰車必有鸞而春獨鸞路者鸞鳳類而色青故以名春路也賦又曰介御問以剡耜薛綜曰天子車參乗帝在左御居中介處右以耒置御之右甘泉賦登鳳皇翳華芝注華盖也漢藉田文開藉之景親耕武鉅定下昭之鈎盾定永平邳元和陶晉志耕根車駕四馬建赤旗十有二旒天子親耕所乗也一名芝車一名三蓋車置耒耜于軾上泰始二年金根耕根車並建赤旗通典晉渡江闕宋大明制之乗以親耕駕蒼駟青旂明帝泰始中乗木輅以耕南齊以侍中奉耒耜載於象輅後周碧輅以耕藉隋乗木輅大業中制耕根車青質三重蓋羽葆彤装並同玉路駕六馬以青囊盛耒耜於上唐因之隋志置耒耜於軾上即潘岳所謂紺轅綴於黛耜者也漢戎車獵車戎路志戎車其飾皆如金根蕃以矛麾金鼓羽析晉志作旂幢翳􅞙胄甲弩之箙注漢制度曰戎立車以征伐獵車其飾皆如之重輞縵輪宋志云幰輪繆龍繞之一曰闟猪車親校獵乗之魏文帝改曰闟虎車虎宋志云蹋禮儀志立秋之日乗輿御戎路白馬朱鬛躬執弩射牲馬融廣成頌屯田車於平原曲禮疏隠義曰獵車之形今之鉤車是也晉志戎車駕四馬天子親戎所乗置弩於軾上其建矛麾悉斜注獵車駕四馬天子校獵所乗一名闟㦸車一名蹋猪車晉鹵簿闟猪車駕駟中道無旗魏文帝改名蹋獸車記云國君不乗竒車亦獵車也古天子獵則乗木輅後人代以獵車宋志戎車立乗漢乗輿東都大駕法駕甘泉鹵簿屬車小駕漢輿服制後輿服志即續志漢乗輿大駕公卿奉引太僕御大將軍參乗屬車八十一乗屬言相連屬也備千乗萬騎西都行祠天郊甘泉備之官有其注名甘泉鹵簿東都唯大行乃大駕大駕大僕校駕法駕黄門令校駕乗輿法駕八卿不在鹵簿中河南尹執金吾雒陽令奉引奉車郎御侍中參乗屬車四十六乗漢官儀屬車三十六乗前驅有九斿雲䍐鳳皇闒㦸皮軒鸞旗皆大夫載鸞旗者編羽旄列繫幢旁胡廣曰建蓋在中民或謂之雞翹非也後有金鉦黄鉞黄門鼓車古者諸侯貳車九乗秦滅九國兼其車服故大駕屬車八十一乗法駕半之屬車皆皂蓋赤裏木轓戈矛弩箙尚書御史所載後一車懸豹尾侍御史載之豹尾以前比省中小學漢官篇曰豹尾過後罷屯解圍胡廣曰過後屯圍乃得解所以戒不虞行祠天郊以法駕祠地明堂省什三一本云北郊明堂則省副車祠宗廟尤省謂之小駕每出大僕奉駕上鹵簿中常侍小黄門副尚書主者郎令史副侍御史蘭臺令史副皆執法以督整軍騎謂之䕶駕春秋上陵尤省於小駕注應劭漢官鹵簿圖曰乗輿大駕則御鳳皇車以金根為副通典初秦有大駕之制漢武天漢四年始定輿服之制郊祀所乗謂之大駕車千乗騎萬匹其儀甚盛大駕八十一乗法駕三十六乗紀天漢四年春正月朝諸侯王于甘泉宫漢書驂乗髙祖以夏侯嬰為太僕常奉車周緤常為參乗代王令宋昌驂乗師古曰乗車之法尊者居左御者居中又有一人處車之右戎事稱車右餘曰驂乗文帝就車召張釋之驂乗上朝東宫趙談驂乗爰盎伏車前曰云云景帝幸上林詔中郎將衞綰參乗金日磾出則驂乗宣帝始立謁見髙廟大將軍光從驂乗後車騎將軍張安世代光驂乗西都賦乗鸞輿備法駕薛綜注闟㦸曰闟函也取四㦸函車邊西京賦乃駕彫軫六駿駁戴翠㡌倚金較瓊弁玉纓遺光儵爚建玄弋植招揺栖鳴鳶曳雲梢弧旌枉矢虹旃蜺旄華蓋承辰天畢前驅千乗雷動萬騎龍趨東京賦及將祀天郊報地功乃整法服正冕帶珩紞紘綖玉笄綦㑹火龍黼黻藻繂盤厲結飛雲之祫輅祫輅次車也植翠羽之髙蓋次車植翠羽為盖今世謂之羽盖車建辰旒之太常紛飈悠以容裔六玄虬之奕奕齊騰驤而沛艾龍輈華轙金鋄鏤錫方釳音乞左纛鉤膺玉瓖音襄鸞聲噦噦和鈴鉠鉠重輪貳轄疏轂飛軨羽盖葳㽔葩瑵音爪曲莖獨㫁曰凡乗輿車皆羽盖金華爪順時服而設副咸龍旂而繁纓五時之服各隨其車之方色立戈迆戛戛長矛也農輿輅木所謂耕根車屬車九九乗軒並轂屬車有藩者曰軒皆在後為三行􅕈伏弩重旃朱旄青屋奉引既畢先輅乃發鸞旗皮軒通帛蒨斾雲罕九斿旗名鈒㦸轇轕髶而利反髦被繡虎夫戴鶡駙承華之蒲梢飛流蘇之騷殺緫輕武於後陳奏嚴皷之嘈囐戎士介而揚揮戴金鉦而建黄鉞清道按列天行星陳上林賦歴吉日以齋戒襲朝服乗法駕建華旗鳴玉鸞河東賦將謁汾陰于東郊於是命羣臣齊法服整靈輿迺撫翠鳳之駕六先景之乗掉犇星之流旃彏天狼之威弧張燿日之玄旄揚左纛被雲梢奮電鞭驂雷輜鳴洪鍾建五旗羲和司日顔倫奉輿前漢傳周亞夫軍細栁文帝勞軍天子先驅至導駕者若今武候隊不得入天子按轡徐行為動改容式車梁孝王入朝景帝使使持乗輿迎梁王於關下臣瓉曰天子副車駕四馬薛廣徳當乗輿車頓首翟方進曰丞相進見在輿為下漢軿車志太皇太后皇太后法駕皆御金根加交路帷裳徐廣云青帷裳非法駕則乗紫罽軿車雲􅏹文畫輈黄金塗五末蓋蚤左右騑駕三馬長公主赤罽軿車大貴人貴人公主王妃封君油畫軿車大貴人加節畫輈皆右騑而已軿屛也有衣蔽有邸曰輜無邸曰軿後魏志阮諶禮圖云山軿車后行乗之紺罽軿車后小行乗之山軿車按圖飾以紫禮巾車注翟車如今軿車是也后所乗以出桑疏曰漢法軿車無蓋呉志賜賀齊軿車駿馬李尤小車銘見後小車晉志中宫初建及祀先蠶皆用法駕漢王青蓋車緑車志皇太子皇子皆安車朱班輪青蓋金華蚤黑􅏹文畫幡文輈金塗五末皇子為王錫以乗之故曰王青蓋車徐廣曰旂旗九旒畫降龍魏武帝問東平王有金路侍中鄭稱對曰天子五路金以封同姓諸侯得乗金路非特賜也皇孫緑車以從皆左右騑駕三獨㫁曰緑車名曰皇孫車天子有孫乗之宋志魏晉太子諸王皆駕四諸車之文乗輿云云皇太子諸侯王倚虎伏鹿􅏹文畫輈轓吉陽筩朱班輪鹿文飛軨旂旗九斿降龍安帝紀以玉青蓋車迎帝齋于殿中鄧后紀太后賜周馮貴人王青蓋車前傳金涉為侍中使持幸緑車載送衞尉舍如淳曰以皇孫車送之寵之也晉志皇孫緑蓋車隋志皇嫡孫金輅緑質降太子一等去盤輿重轂轅上起箱末以金飾旌七旒漢安車三公使車後輿服志公列侯安車朱班輪倚鹿較伏熊軾皂繒蓋黑轓右騑車有轓者謂之軒公列侯倚鹿伏熊黑轓朱班輪鹿文飛軨九斿降龍卿朱兩轓五斿降龍二千石以下各從科品鄭弘傳三公車轓畫作鹿蕭育傳為南郡太守上以育耆舊名臣乃以三公使車載育入殿中受䇿注孟康曰三公奉使之車若安車也漢皂蓋朱轓後志中二千石二千石皂蓋朱兩轓千石六百石朱左轓中二千石以上及使者乃有騑駕轓長六尺而後謙一寸若月初生示不敢自滿景帝中元五年始詔六百石以上施車轓得銅五末軛有吉陽筩見前車服制度景紀詔令長吏二千石朱兩轓云云見前注師古曰轓車之蔽也左傳曰以藩載欒盈是有障蔽之事也黄霸傳守潁川賜車蓋特髙一丈别駕主簿車緹油屏泥於軾前以章有徳楊惲傳乗朱輪者十人王氏乗朱輪華轂二十三人揚雄曰朱丹其轂漢大使車小使車朱軒車後輿服志大使車立乗駕駟赤帷持節者重導小使車不立乗有騑赤屏泥油重絳帷導無斧車近小使車蘭輿赤轂白蓋赤帷諸使車皆朱班輪四輻赤衡軛舊典傳車驂駕乗赤帷裳唯郭賀為兾州勅去襜帷列傳陳忠曰朱軒軿馬相望道路注朱軒車使者所乗皇甫規上疏備單車一介之使勞来三輔張綱分行州郡埋其車輪於洛陽都亭范滂為清詔使登車攬轡慨然有澄清天下之志揚雄方言輶軒之使文選注班固曰朱軒之使朱買臣傳注張晏曰故事大夫乗官車駕駟如今州牧刺史漢屬車詳見前乗輿晉屬車玉輦晉志一曰副車一曰貳車一曰佐車漢因秦制大駕屬車八十一乗行則中央左右分為行法駕屬車三十六乗最後車懸豹尾豹尾以前比之省中屬車皆皂蓋朱裏云漢傳賈捐之對孝文帝詔曰鸞旗在前屬車在後吉行日五十里師行三十里注屬車相連屬而陳於後相如諫獵疏屬車之清塵揚雄當成帝時趙昭儀方大幸每上甘泉常法從在屬車間豹尾中故揚雄作甘泉賦聊盛言車騎之衆參麗之駕非所以感動天地逆釐三神注師古曰法從者以言法駕從耳非失禮一曰從法駕也服䖍曰大駕屬車八十一乗作三行尚書御史中乗最後一乗懸豹尾豹尾以前皆為省中張敞諫曰昌邑東迎之日惟恐屬車之行遲嚴延年劾大司農田延年持兵于屬車韓嫣從上獵上林天子先使嫣乗副車東都賦先驅復路屬車按節西京賦華盖承辰天畢前驅千乗雷動萬騎龍趨屬車之簉載獫𤭔獢匪唯玩好亦有秘書東京賦屬車九九乗軒並轂注副車曰屬相連也李善注引漢雜事同蔡邕獨斷古諸侯貳車九乗秦滅九國兼其車服故為八十一乗漢武祠太一甘泉盡用之明帝上原陵又用之法駕三十六乗小駕十二乗賈誼新書天子佐輿十乗以明貴也昭紀注蔡邕云禁中門閤有禁非侍御之臣不得妄入行道豹尾中通典晉屬車因後漢制東晉屬車五乗加緑油幢朱絲絡輪轂猶素其一車又是軺車舊儀天子所乗駕六元明時屬車唯九乗太元中苻堅敗得車輦增為十二乗晉復制御衣御書御軺御藥等車駕牛陽燧四望幰皂輪小形通典以周良車散車為屬車之流周末諸侯有貳車秦有屬車潘岳賦前驅魚麗屬車鱗萃常伯陪乗太僕秉轡乃御玉輦蔭華蓋金根照耀龍驥沛艾注玉輦大輦也大駕鹵簿有大輦華蓋中道五輅鳴鑾九旗揚斾瓊鈒入蘂雲罕晻藹漢象路象車皮軒道車游車建華車九斿車司馬相如傳上林賦天子校獵乗鏤象六玉虯拖蜺旌靡雲旗前皮軒後道游孫叔奉轡衞公參乗扈從横行出乎四校之中注張揖曰鏤象象路也以象牙疏鏤其車輅駕六馬以玉飾其鑣勒文穎曰皮軒以虎皮飾車天子出道車五乗游車九乗在乗輿車前師古曰道游次皮軒之後皮軒之上以赤皮為重蓋今此制尚存非猛獸之皮飾車也西京雜記漢鹵簿有象車皷吹十三人中道武剛車九游車雲罕車皮軒車闟㦸車鸞旗車建華車並駕四中道晉輿服志象車漢鹵簿最在前後魏有象輦駕白象漢輿服志九斿注徐廣曰斿車有九乗前史不記形武王克紂百夫荷罕旗以先驅東京賦曰雲罕九斿薛綜曰旌旗别名上林賦載雲罕皮軒注胡廣曰以虎皮為軒郭璞曰革車或曰即宋志即曲禮前有士師則載虎皮淮南子軍正執豹皮以制正其衆乗輿豹尾亦其義類乎通典皮軒車晉宋駕四馬皆大夫載唐大駕鹵簿次辟惡車後漢制九斿車九乗大駕為先乗晉宋因之校獵賦撞鴻鍾建九旒六白虎馬名蚩尤並轂蒙公先驅淮南子髙帝建九斿乗大路王元長文九斿齊軌注天子之車九乗名曰九斿車開寳通禮義纂古有先驅清游車九乗前史不記形飾唐禮遂無其制以清游隊白澤旗為前驅漢瑞應車象載象輿郊祀歌象載瑜白集西注師古曰山出象輿瑞應車也瑞車瑜然色白而出西方赤蛟章靈禗禗象輿轙相如上林賦象輿婉僤於西清注師古曰象輿瑞應車也西清西箱清靜之處大人賦駕應龍象輿之蠖略委麗顔延年馬賦代驂象輿注引韓子黄帝象車漢雲罕車相如上林賦載雲罕掩羣雅注張揖曰罕畢也前有九旒雲罕之車張衡東京賦雲罕九斿注薛綜曰雲罕旌旗别名九斿亦旗名也揚雄校獵賦罕車飛楊武騎聿皇師古曰畢罕之車徽車輕武師古曰建徽幟之車續志法駕前驅有九斿雲罕注武王罕旗先驅西京雜記雲罕車駕四中道前天文志畢曰罕車為邊兵主弋獵昴七星為旄頭昴畢間為天街天子出旄頭罕畢以前驅宋志薛綜東京賦注以雲罕九游為旌旗别名亦不辨其形案魏命晉王建天子旌旗置旄頭雲罕是知雲罕非旌旗也徐廣車服注以為九游車九乗雲罕疑是罼罕罼罕本施游獵遂為行飾潘岳藉田賦先叙五路九旗次言瓊鈒雲罕宜是今畢綱漢豹尾車見上古今注通典周制也象君子豹變以尾言者謙也古者軍正建之淮南子軍正執豹皮以正其衆晉志自豹尾車後而鹵簿盡唐志豹尾車在黄鉞車後駕二馬右武衞隊正一人在車執之西京雜記漢朝輿駕祠甘泉汾陰司馬車辟惡車記道車靖室車並駕四中道晉郭璞南郊賦云整豹尾於後屬薛綜曰侍御史載之今唯乗輿得建漢安車蒲輪武紀建元元年七月議立明堂遣使者安車蒲輪束帛加璧徵魯申公傳云安車以蒲裹輪駕駟枚乗傳武帝以安車蒲輪徵乗郊祀志秦諸儒曰古者封禪為蒲車以蒲裹輪明紀永平二年十月行養老禮詔曰安車輭輪供綏執授注以蒲裹輪徐穉傳欲蒲輪聘穉桓帝以安車玄纁召穉等楊厚傳賛仲威術深蒲車屢尋旌帛蒲車之所召賁相望于巖中宋志梁惠王以安車駕三送淳于髠大夫之儀史記云送以安車駕駟張良傳太子安車迎四皓嚴光傳光武以安車玄纁聘之杜延年傳注安車坐乗之車唐王起蒲輪賦丘園共賁巖穴皆虚載脂載舝既攻既堅經營􅋄澤􅞂轢雲烟織而為席臧孫不仁緝以成宫令尹非禮旁捜叢桂逺掇幽蘭選注傳暢晉諸公賛曰傳祗版輿上殿一名歩輿周遷輿服雜事記曰歩輿方四尺素木為之以皮為襻掆之自天子至庶人通得乗漢安車駟馬杜延年趙充國于定國薛廣徳彭宣史丹史髙劉常廣陵王胥傳皆云賜安車駟馬杜延年傳注安車坐乗之車也後漢輿服志云公列侯安車云云廣元鳳五年正月廣陵王来朝賜安車一乗馬三駟徳懸安車傳子孫韋孟詩云懸車之義以洎小臣匈奴傳甘露三年賜呼韓邪安車一乗莽賜單于安車皷車各一阜陵王傳章和元年詔賜安車一乗樊凖傳言趙孝承宫安車結駟告歸鄉里晉志太康四年制依漢故事給九卿朝車駕四及安車各一乗曲禮大夫七十適四方乗安車晉王祥陳騫賜安車駟馬漢駟馬車列傳朱買臣拜㑹稽太守長安廏吏乗駟馬車来迎遂乗傳去于定國父于公曰少髙大閭令容駟馬髙蓋車韋玄成以列侯侍祀不乗駟馬車騎至廟下有司劾奏後輿服志公卿中二千石郊廟明堂祠陵法出皆大車立乗駕駟他出乗安車續志注服䖍曰大路總名也如今駕駟髙車漢乗傳軺傳軺車帝紀髙帝五年田横乗傳詣雒陽注如淳曰律四馬髙足為置傳四馬中足為馳傳四馬下足為乗傳一馬二馬為軺傳急者馳一乗傳師古曰古者以車謂之傳車其後又單置馬謂之驛騎文帝從代令張武等六人乗六乗傳詣長安平帝元始三年春詔親迎立軺併馬注立乗小車併馬驪馬也五年正月召天下通曉逸經古記者在所為駕一封軺傳注如淳曰律諸當乗傳及發駕置傳者皆持尺五寸木傳信封以御史大夫印章其乗傳參封之有期㑹累封傳端端各兩封凡四封也乗置馳傳五封之兩端各二中央一也軺傳兩馬再封之一馬一封也師古曰以一馬駕軺車而乗傳食貨志武帝筭軺車注軺小車也郊祀志與方士傳車求神仙列傳呉王濞攻梁壁袁盎歸報條侯乗六乗傳㑹兵滎陽申公魯人武帝使使安車以蒲裹輪駕駟迎申公弟子二人乗軺傳從儒林司馬相如建節往使西南夷馳四乗之傳朱買臣長安廏吏乗駟馬車来迎遂乗傳去昌邑王乗七乗傳詣長安邸龔遂乗傳至渤海界單車獨行至府循吏楊僕請乗傳行塞因用歸家酷吏鮑宣遷豫州牧行部乗傳去法駕駕一馬龔勝曰徵賢者宜駕上曰大夫乗私車来邪京房行按郡請乗傳奏事梅福求假軺傳詣行在所條對急政注小車之傳也後傳賈琮為兾州刺史舊典傳車驂駕垂赤帷裳迎於州界及琮之部乃命御者褰之武紀注漢舊儀云刺史常以秋分行部御史駕四封乗傳後輿服志注舊典傳車驂駕云云唯郭賀勅去䄡帷百官志注刺史傳車周流匪有定鎮風俗通今刺史行部車號傳車魏志漢刺史稱傳車其吏言從事居無常治吏不成臣晉志軺車古之時軍車也一馬曰軺車二馬曰軺傳漢世貴輜軿而賤軺車魏晉重軺車而賤輜軿三品將軍以上尚書令軺車黑耳有後戸僕射但有後戸無耳並皁輪尚書及四品將軍無後戸漆轂輪宋志傳暢故事尚書令軺車黑耳後戸僕射但後户無耳中書監令如僕射漢舊儀奉璽書使者乗馳傳其驛騎也三騎行日夜千里為程隋志軺車按六韜一名遥車盖言遥逺四顧之車也漢武帝迎申公弟子二人乗軺傳從此又是馳傳車也晉氏鹵簿御史軺車行中道晉公卿禮秩云尚書令軺黑耳後户今軺車青通幰駕二馬王侯入學五品朝婚通給之左傳晉以傳召伯宗楚子乗馹鄭子産乗遽漢乗輿路車車府百官表路軨令丞注伏儼曰主乗輿路車太初元年初置路軨五行志未央殿輅軨中注廏名輅與路同藝文志車郎張豐注如淳曰主車後百官志車府令主乗輿諸車永平中車駕近出陰就干禁衞車府令徐正鉤就車收其御者丁孚漢儀皇后出車府令設鹵簿漢軨獵車小車宣紀元平元年七月太僕以軨獵車奉迎曾孫庚申入未央宫注文穎曰軨獵小車前有曲輿不衣也李竒曰蘭輿輕車也師古曰未備天子車駕且取其輕便耳又見戰車類百官表太僕有路軨令丞注伏儼曰主乗輿路車又主凡小車軨今之小馬車曲輿也後輿服志注李尤小車銘曰軨之嗛虚疏達開通曲禮注安車坐乗若今小車也疏云漢世駕一馬坐乗車千秋傳年老朝見得乗小車霍光傳昌邑王御小馬車注張晏曰皇太后所駕遊宫中輦車也漢廏有果下馬髙三尺以駕輦魏晉御小出常乗馬亦多乗輿車輿車今之小輿漢皷車三漢志黄門皷車燕王旦傳建旌旗鼓車韓延夀傳駕皷車歌車注孟康曰如今郊駕時車上皷吹也漢光武紀以千里馬駕皷車南匈奴傳光武詔賜鼓車晉志鹵簿㦸皷車駕牛二乗分左右漢相風車崔豹古今注伺風烏夏禹所作也西京雜記相風烏車駕四中道漢西京鹵簿有相風車晉令曰車駕出入相風以前侍御史令史周禮無之何承天謂戰國師旅數出懸烏之設務察風祲周遷輿服雜事曰相風周公所造即鳴鳶之象後改為烏隋為車唐為輿宣和鹵簿記傳玄相風賦蜿盤獸以為趾建修竿之亭亭棲神烏於竿首俟祥風之来征張華賦爰在保章世序其職辨風候方必立準極眇修幹之迢迢凌高墉而莖植玄鳥偏其增翥晞雲霄而矯翼步元氣於尋木寄先識於兹禽既在高而思危又戒險而自箴潘岳賦棲靈烏於帝庭似月離乎紫宫飛輕羽於竿杪若鸞翔乎雲中廣莫興而習坎景風發而遡離閶闔揚而西指明庶起而東移陶侃賦華蓋擎乗奉引先驅豹飾在後葳㽔清路漢指南車見後漢輜車乗馬桓榮傳建武二十八年拜張佚為太子太傅以桓榮為少傅賜以輜車乗馬榮大㑹諸生陳其車馬印綬曰今日所蒙稽古之力也可不勉哉字林曰軿車有衣蔽無後轅有後轅者謂之輜有邸曰輜無邸曰軿贊曰五更待問應若鳴鍾庭列輜駕堂修禮容穆穆帝則擁經以從張良傳强載輜車注衣車也周禮良車散車注若今輜車後户之屬疏曰漢時輜車與古者從軍所載輜重財貨之車皆車後開户宋志傳玄子曰周曰輜車輜車即輦也列女傳齊孟姬曰妃后踰閾必乗安車輜軿今立車無軿非所敢受命也使者更取安車漢玉輅彫玉輿輦東都賦登玉輅乗時龍鳳蓋棽麗和鑾玲瓏天官景從䘲威盛容山靈䕶野屬御方神雨師泛灑風伯清塵千乗雷起萬騎紛紜東京賦天子乃撫玉輅時乗六龍發鯨魚鏗華鍾大丙弭節風后陪乗攝提運衡下彫輦於東廂甘泉賦方玉車之千乗肆玉而下馳注以玉飾車子虚賦楚王乗彫玉之輿陽子驂乗纎阿為御隋志輿漢室制度以彫玉為之方徑六尺爰盎曰天子所與共六尺輿者皆天下豪英上笑下談通典夏氏制輦秦為人君之乗漢因之以彫玉為之方徑六尺或使人輓或駕果下馬選注王符羽獵賦天子乗碧瑶之彫軫建曜天之華旗漢龍輅大輅東京賦龍輅充庭西都賦大輅鳴鑾容與徘徊後宫乗輚輅張衡思玄賦轙琱輿而植葩擾應龍以服輅琱以玉飾葩建華蓋僕夫儼其正䇿八乗攄以超驤左青琱青文龍以揵芝芝蓋右素威白虎以司鉦前長離使拂羽委水衡於玄㝠曳雲旗之離離鳴玉鑾之譻譻漢六輦六典注古謂人牽為輦秦始皇去其輪而輿之漢為人君之乗後漢有乗輿六輦通鑑文帝每朝郎官上書疏止輦受其言輦過郎舍問馮唐梁王入侍景帝同輦出同車遊獵上林中漢武故事武帝輦過郎舍劉更生傳為輦郎注如今引御輦郎張敞傳諌昌邑曰小輦先遷李竒曰挽輦小臣也後祭祀志光武封禪御輦升山隋志漢成帝遊後庭乗之徐爰釋問曰天子御輦侍中陪乗齊志叔孫通傳云皇帝輦出房成帝輦過後宫此朝宴並用也輿服志云輦車具金銀丹青采艧雕畫蒲陶之文乗人以行晉中朝又有香衣輦宋志輦車周禮王后五路之卑者后從容宫中所乗非王車也漢制乗輿御之或使人輓或駕果下馬成帝欲與班倢伃同輦漢羽蓋車又見劒㦸類葆車後輿服志乗輿羽蓋華蚤注徐廣曰翠羽蓋黄裏所謂黄屋車也東京賦云云薛綜曰植翠羽為蓋如雲龍矣東京賦植翠羽之髙蓋注薛綜曰今世謂之羽蓋車楚王英傳赤綬羽蓋華藻如嗣王儀虞延傳光武到魯還經封丘城門門下小不容羽蓋陰興傳每從出入常操持小蓋障翳風雨前外戚傳上官桀從武帝上甘泉天大風桀奉蓋雖風常屬車周禮王后輦車有羽蓋注以羽作小蓋為翳日道右王下則以蓋從注表尊疏非謂在車時輪人注乗車無蓋周禮五路建旌旗故無蓋疏凡蓋所以表尊亦所以禦雨光武紀建武十三年益州傳送公孫述葆車輿輦於是法物始備注葆車謂車上建羽葆也西京賦垂翟葆建羽旗韓延夀傳在東郡試騎士治飾兵車植羽葆成帝升車正立不内顧疾言親指東京賦君人車中不内顧珮以制容鑾以節塗行不變玉駕不亂步漢鸞旗車見上漢重翟車宋志漢制太皇太后皇太后皇后法駕乗重翟羽盖金根車隋志漢制后法駕乗翟車周禮疏凡言翟者謂翟鳥之羽以為兩旁之蔽重翟者皆二重為之厭翟者謂相次以厭其本翟車者不厭其本也翟車有幄無盖安車重翟無幄而有容蓋西都賦注應劭漢官儀曰皇后婕妤乗輦餘皆以茵四人輿以行漢充庭車和紀安帝永初四年春正月元日㑹徹樂不陳充庭車注每大朝㑹必陳乗輿法物車輦於庭故曰充庭車以年飢故不陳晉志建武十三年呉漢平蜀始送葆車輿輦充庭之飾漸以周備東京賦孟春元日羣后旁戾龍輅充庭雲旗拂霓周禮春官典路大祭祀則出路大賔客亦如之注漢朝上計律陳屬車于庭叔孫通傳長樂朝儀廷中陳車騎宋志舊有充庭之制臨軒大㑹陳乗輿車輦旌鼓于殿庭晉江左廢宋大明中脩復漢赤車鮮卑傳安帝永初中詣闕朝賀賜赤車參駕前南越傳桂蠧注蘇林曰漢舊常以獻陵廟載以赤轂小車魏志注西京太常行陵赤車千乗漢鸞路金輅晉志元帝大興三年皇太子釋奠制曰今草創未有髙車可乗安車太元中東宫建乗路有青赤旂致疑徐邈議太子既不備五路赤旂冝省漢制太子鸞路皆以安車為名安帝為太子乗石山安車制如金路義不經見張敞晉東宫舊事太子鹵簿有黄麾徐廣東宫頌曰龍旗鸞旌一晉東宫舊事曰皇太子初拜有石山安車建九旗青色四馬宋志魏晉之制太子及諸王皆駕四泰始三年制太子安車乗象路四年九月甲戌議東宫車服降天子二等驂駕四馬乗象輅降龍碧旂九葉隋志漢太子乗金輅及安車宋起居注泰始四年尚書令休仁議天子之元子士也故齒胄於辟雍欲使知教而後尊既命之後禮同上公天子賜之金輅但減旂章為等級自晉過江唯有太子禮秩崇異又乗山石安車義不經見事無所出賜金輅者此為古制降乗輿二等駕用四馬皇太子輅古者金飾宋齊以来並乗象輅皇太子鸞輅駕三馬左右騑朱班輪倚獸較伏鹿軾九旂畫降龍青蓋畫轓文輈黄金塗五末近代亦謂之鸞輅即象輅也梁東宫初建及太子釋奠元正朝㑹則乗之以畫輪為副若常乗畫輪以軺衣書車為副畫輪車上開四望緑油幢朱繩絡兩箱裏飾以錦黄金塗五末隋太子金輅赤質制同副車安車班輪赤質制略同乗輿駕四馬唐儀衛志皇太子出金路駕四馬駕士二十三人僕寺僕馭次副路後魏志皇太子皇子鸞輅立乗畫輈龍首朱輪繡轂綵蓋朱裏龍旂九斿畫雲楱皇子封則賜之皆駕駟又有軺車緇漆紫􅚫朱裏駕一馬為副乗漢鳩車博古圖二器狀鳲鳩形置兩輪間輪行則鳩從之前一器漢物也後一器六朝物也杜氏幽求子謂兒年五嵗有鳩車之樂七嵗有竹馬之歡漢車車銘食貨志漢初天子不能具醇駟將相乗牛車晉志武帝後諸侯王弱者乗牛車後漢服志景帝中元五年詔賈人不得乗馬車周官注漢制定張車嬴蘭車然不可攷衛綰傳以戲車為郎注師古曰戲車若今之弄車之技西京賦建戲車植修旃百馬同轡騁足並馳烏孫傳馮夫人錦車持節注服䖍曰以錦衣車也漢有衣車厨車軒車藩車輓輅輿轎唐志開成末定制宰相三公師保尚書令僕射諸司長官及致仕官病疾許乗檐如漢魏載輿步輿之制李尤小車銘見小車傅毅車左銘東京賦注云崔駟君子建左法天之陽正立授綏車中不顧塵不出軌鸞以節步彼言不疾彼指不躬逺覽于道以思厥中魏司南車魏紀明帝青龍三年注魏畧曰通引穀水過九龍前為玉井綺欄蟾蜍含受神龍吐出使博士馬均作司南車水轉百戲嵗首建巨獸魚龍曼延弄馬到騎備如漢西京之制韓非子先王立司南以端朝夕晉五路法車金鵾車晉輿服志玉金象革木等路是為五路並天子之法車皆朱班漆輪畫為􅏹文三十輻法月之數朱橑二十八象宿兩箱之後皆玳瑁為鵾翅加以金銀彫飾世俗謂之金鵾車轅皆曲向上取禮緯山車垂鉤之義其制重轂貳轄有黄屋左纛有飛軨玉路最尊建太常十有二斿九仞委地畫日月升龍以祀天金路建大旂九斿以㑹萬國之賓亦以賜上公及王子母弟象路建大赤通赤無畫視朝亦所以賜諸侯革路建太白以即戎兵事亦以賜四鎮諸侯木路建大麾以田獵其麾色黑亦以賜藩國玉輅駕六黑馬餘四路駕四馬齊志五路江左相承駕四馬左右騑為六並以黄金為文髦挿以翟尾象鑣鏤錫金㚇方釳繁纓赤罽易茸金就十有二五路皆有鍚鸞之飾和鈴之響鉤膺玉瓖龍輈華轙朱幩法駕行則五路各有所主不俱出臨軒大㑹則陳乗輿車輦於殿庭武帝始備五路江左闕其三元帝始造大輅戎輅各一因金根飾皆駕黑駟而已齊志江左之始但有金戎省充庭之儀通典晉武受禪設五輅並為法駕旗斿服用悉取周制文物華藻因金根車更增其飾宋大明三年始備五路四年有司奏南郊舊儀乗金根宜改為玉輅初左丞荀萬秋造五路玉輅擬金根而赤建青旂施羽葆蓋因漢之安車以金根為金輅建大青旂象革輅建赤旂木輅建赤麾六年始制法駕五輅俱出舊法駕出五輅各有所主不俱出齊永平初伏曼容議車旗先青加玉輅為重蓋棲寳鳳皇綴金鑷珠璫金龍銜五采毦建武中省之梁天監三年旗麾同用赤而斿不異陳天嘉初錯綜漢晉舊飾造五輅元魏大和中李韶制五輅太和十五年五月丙辰初造五輅各依方色駕五馬金後周司輅皇帝之輅十二等曰蒼青朱黄白玄玉碧象革木隋開皇元年改造玉輅宋志江左副車五乗孝建三年五月壬戌尚書令宏議案周官云上公九命貳車九乗侯伯七子男五然則帝王十二乗詔可晉氏江左六駕未立故郊祀用法駕宗廟以小駕齊志晉摰虞治禮議五輅制度晉金根車五時車見上見漢金根車晉雲罕皮軒鸞旗建華司南記里鼓車志游車九乗駕四先驅之乗也雲罕車駕四皮軒車駕四以虎皮為軒鸞旗車駕四先輅所載析羽旄編之列繫幢旁建華車駕四凡二乗行則分居左右輕車駕二古之獸車也建矛㦸麾幢置弩箙於軾上司南車一名指南魏馬鈞作駕四馬如樓三級四角金龍銜羽葆刻木為仙人衣羽衣立車上記里鼓車駕四形制如司南其中有木人執搥過江亡失義熙五年劉裕屠廣固復獲焉使工人張綱補緝十三年九月定關中又獲司南記里諸車制度始備齊加華蓋畫鼓機在内宋志晉代又有指南舟晉畫輪車四望車象車漢象車志畫輪車駕牛以綵漆畫輪轂上起四夾杖左右開四望緑油幢朱絲絡青交路形制如輦下如犢車大駕次羊車後因通典宋齊梁相為羣公所乘陽遂四望皁輪小形車駕牛東宫舊儀皇太子及妃皆有畫輪四望車東宫舊事皇太子初拜有畫輪四望車象車漢鹵簿最在前武帝太康中平呉後南越獻象詔作大車駕之以載黃門鼓吹數十人使越人騎之元正大㑹駕象入庭中朝大駕鹵簿先象車鼓吹一部十三人中道通典大駕行則試橋道後魏有象輦駕白象四望車駕牛中道魏舒傳武帝詔給陽燧四望小車隋志畫輪車制同犢車金飾青油幢紫幰網太子緑幢青幰晉鸞路雲母車志皇太子安車駕三左右騑朱班輪倚獸較伏鹿軾九旒畫降龍青蓋金華蚤二十八枚黑􅏹文畫轓文輈黃金塗五采亦謂之鸞路非法駕則乗畫輪車上開四望緑幢朱絡副車三乗不畫輪隋志云即象路也王青蓋車皇孫緑蓋車駕三左右騑雲母飾犢車臣下不得乗以賜王公傅子曰以雲母飾車皇后先蠶乗油畫雲母安車駕六騩馬騩淺黑色安平王孚傳武帝給以雲母輦青蓋車孝武紀太元八年謝玄破苻堅獲輿輦及雲母車後魏志晉先蠶儀注皇后乗雲母安車駕六騩按周秦漢晉車輿儀式互見圖書雖名號小異畧相依擬金根雖起自秦造即殷遺制阮氏圖桑車亦飾以雲母晉之雲母車與周翟車其用正同安車名同周制用同重翟山軿車按圖飾以紫紺罽軿車雖制異厭翟而實同用陸機詩銅輦太子車也晉皂輪志駕四牛制如犢車皂漆輪轂青油幢朱絲絡諸王三公有勲徳者特加之或四望三望夾望車油幢駕牛不漆轂制如皂輪王公大臣有勲徳特給之軺車古軍車也一馬曰軺車二馬曰軺傳漢貴輜軿魏晉重軺車尚書令軺車黑耳後户鹵簿御史軺車行中道陶侃傳元帝假侃赤幢曲蓋軺車鼓吹盧欽傳給追鋒軺車一乗第二駙馬二乗騎具刀器御府人馬鎧晉追鋒車志追鋒車去小平蓋加通幰如軺車駕二追鋒之名蓋取其迅速也施於戎陳之間是為傳乗魏志司馬望給追鋒車一乗杜預傳拜鎮南大將軍都督荆州給追鋒車第二駙馬盧欽傳給追鋒軺車泰始九年鄭冲何曾進太宰朝㑹劔履乗輿上殿如漢相蕭何田千秋魏太傅鍾繇故事晉金鉦車金鉞車黄鉞車金鉦輦志中朝大駕鹵簿金鉞車金鉦車並駕三中道㦸鼓車駕牛二乗分左右黄鉞車駕一在左輦自過江亡制度太元中謝安率意造焉及破苻堅獲京師舊輦形制無差大小如一人服其精記義熙五年劉裕執慕容超獲金鉦輦豹尾舊式猶存通典晉有金鉞車金鉦車駕三馬唐黄鉞車貞觀後備於大駕鹵簿天寳元年改為金鉞車晉時路樂志夏苖田王軍啓八門行同上帝居時路建大麾雲旗翳碧虚晉安車宋禮志晉元帝太興三年太子釋奠詔曰未有髙車可乗安車髙車即立乗車也傅暢故事三公安車駕三特進駕二卿一太康四年詔依漢故事給九卿朝車駕及安車各一乗去位致仕皆賜安車四馬晉令王公之太子安車駕三旂七旒其侯太子五旒晉先蠶儀注皇后乗油畫雲母安車駕六騩馬油畫兩轅安車駕五騩馬為副公主油畫安車駕三三夫人青交路安車駕三皆以紫綘罽軿車駕三為副九嬪次婦軿車駕二宫人輜車駕一王妃公侯特進夫人封君皂交路安車駕三晉大輦文選藉田賦御玉輦蔭華蓋注臧榮緒晉書曰大駕鹵簿有大輦華蓋中道玉輦大輦也隋志輦制象軺車而不施輪通幰朱絡飾以金玉梁鼓吹車隋白鷺車梁大輦志鼓吹車上施層樓四角金龍銜旒蘇羽葆凡鼓吹陸則樓車水則樓船在殿庭則畫筍簴為樓樓上有翔鷺棲烏或為鵠形通典隋制白鷺車上施層樓有翔鷺唐因之駕四馬大駕出在記里鼓車後本朝志一名鼓吹車赤質上有朱柱貫五輪繡飛鷺柱杪刻木為鷺銜鵝毛筩紅綬帶一轅駕四馬六典注古之輦輿大率以六尺為度齊武帝造大小二輦下棡轅軛金花銀獸梁大輦中方八尺左右開四望金鸞棲軛梁大同五年正月丁巳賀琛奏二郊藉田御輦不復乗輅從之郊祀宗廟仍乗玉輦一云佩輦改素輦名大同輦辛未祀南郊唐五路屬車十乗十二乗車輿衣服令車服志唐初受命車服因隋舊武徳四年始著車輿衣服令上得兼下下不得儗上凡天子之車曰玉路者祭祀納后所乗也青質玉飾末金路者享射祀還飲至所乗也赤質金飾末象路行道所乗也黄質象飾末革路臨兵巡守所乗也白質輓以革木路蒐田所乗也黑質漆之五路皆重輿左青龍右白虎金鳳翅畫苣文鳥獸黄屋左纛金鳳一鈴二在軾前鸞十二在衡龍輈前設障塵青蓋三層繡飾上設博山方鏡下圓鏡樹羽輪金根朱班重牙左建旂十有二旒畫升龍其長曳地青繡綢杠右載闟㦸長四尺廣三尺黻文旂首金龍銜錦結綬及緌帶垂鈴金鍐方釳揷翟尾五焦鏤鍚鞶纓十二就旌旗蓋鞶纓皆從路質惟蓋裏皆用黄五路皆有副耕根車者耕藉所乗也青質三重蓋餘如玉路安車者臨幸所乗也制如金路金飾重輿曲壁紫油纁朱裏通幰朱絲絡網朱繁纓朱覆髪具絡駕赤駵副路耕根車安車皆八鸞耕根駕六馬安車駕四四望車制如安車青油纁朱裏六典注駕四馬又有屬車十乗一曰指南二曰記里皷三曰白鷺四曰鸞旗五曰辟惡六曰皮軒七曰羊車駕果下馬一與安車耕根四望車為十乗㑹要武徳初著令天子鸞輅五等屬車十乗貞觀元年十一月始加豹尾車黄鉞車通為十二乗行幸陳于鹵簿則分前後大朝㑹則分左右施於儀仗之中通典大駕屬車十二乗分前後儀六典注十二乗駕牛駕士各八人衞志同開元定禮又别設屬車十二乗天寳元年改黄鉞為金銊國朝復舊髙祖太宗大禮乗大路髙宗不喜乗每大禮則御輦開元十一年冬祀南郊乗輅而往禮畢騎還自是行幸郊祀皆騎於儀仗之内其五輅腰轝陳於鹵簿而已㑹昌六年十一月太僕寺重脩御輅法駕等車二十四乗并調馬拖車十三乗六典乗黄令掌天子車輅辨其名數五輅十副車屬車二大駕則大僕卿馭五路駕士各三十二人駕六馬五副路駕四駕士二十八人五輅皆有副車隋開皇十四年始造五路及副百官志大僕卿行幸供五路屬車奉車都尉掌馭副車駕部掌輿輦車乗之籍尚輦局掌輿輦内官有司輿典輿掌輿乗黄令供車路有羊車小史十四人左尚令供五路五副七輦十二車六典有三轝及皇太子王公之車路隋何稠傳舊制五輅於轅上起箱天子與參乗同在箱内稠以為君臣同所為相偪乃廣為盤輿别設闌楯侍臣立於中其内復起平坐天子獨居其上隋閻毗傳帝曰開皇之日屬車十二乗今八十一乗欲減之毗曰八十一乗起於秦遂為後式次及法駕三分減一為三十六乗此漢制也晉遷江左唯設五乗宋孝建時設十二乗開皇平陳因以為法今憲章往古大駕依秦法駕依漢小駕依宋以為差等帝曰大駕宜三十六法駕宜十二小駕除之通典開皇元年李徳林等奏廢後魏輿輦唯留太和時李韶所制五輅隋五輅逺酌周禮旗斿藻飾近約漢制文質相半唐因之隋志皇后屬車三十六乗唐皇后六車志皇后之車六重翟車受冊從祀饗廟所乗也青質青油纁朱裏通幰繡紫絡帶及帷八鸞鏤鍚鞶纓十二就金鍐方釳樹翟羽朱緫厭翟車親桑所乗也赤質紫油纁朱裏通幰紅錦絡帶及帷翟車歸寧所乗也黄油纁黄裏通幰白紅錦絡帶及帷三車皆金飾末輪畫朱牙箱飾翟羽朱絲絡網鞶纓色皆從車質安車臨幸所乗也制如金路紫油纁朱裏通幰四望車拜陵所乗也青油纁朱裏通幰金根車常行所乗也紫油纁朱裏通幰後魏金根車公主得乗之但右騑夫人乗厭翟車九嬪乗翟車婕妤以下乗安車外命婦公主王妃乗厭翟車一品乗白銅飾犢車青油纁朱裏通幰朱絲絡網二品以下去油纁絡網四品有青偏幰官志内僕局令掌中宫車乗禮志納皇后制書以油絡網犢車載之内僕進重翟以下於大門之外皇太子納妃内廏尉進厭翟唐皇太子三車志皇太子之車三金路駕赤駵四從祀朝賀納妃所乗也赤質金飾末重較箱畫苣文鳥獸黄屋伏鹿軾龍輈金鳳一在軾前設鄣塵朱黄蓋裏輪畫朱牙左建旂九旒右載闟㦸旂首金龍銜結綬及鈴緌八鸞二鈴金鍐方釳樹翟尾五焦鏤鍚鞶纓九就軺車駕一馬五日常服朝饗官臣出入行道所乗也四望車駕一馬臨弔所乗也二車皆金飾末紫油纁朱裏通幰官志僕寺掌車輿乗騎儀仗太子出則率廏牧令進路親馭率更令出入乗軺車為導禮志冊太子僕進金路納妃升金輅開元二十六年七月己巳御宣政殿冊太子故事太子乗輅至殿門至是太子不就輅自其宫步入唐王公車路車服志親王及武職一品有象路青油纁朱裏通幰朱絲絡網大駕五輅其質有五王公象輅以下其質皆朱二品三品有革路朱裏青通幰四品有木路五品有軺車皆碧裏青偏幰象路象飾末班輪八鸞左建旂畫升龍右載闟㦸革木路左建旜軺車曲壁碧裏青通幰諸路朱質朱蓋旂朱班輪一品之旜九旒二品八旒三品七旒四品六旒繁纓就亦如之三品以上珂九子四品七子五品五子六品以下去通幰及珂王公車路藏于太僕受制行冊命則給之餘皆以騎代車開成末定制宰相三公師保尚書令僕射諸司長官許乗檐如漢魏載輿步輿之制官志車府令掌王公以下車路六典車輅四曰象革木輅軺車後周諸公之輅九三公之車輅九唐七輦唐舊制輦有七大鳳大芳小輕仙遊芳亭大玉小玉轝有三五色常平腰大駕鹵簿先五路行用玄宗以輦不中禮廢不官志尚輦局尚輦二人七輦主輦各六人掌輦四十二人奉輦十五人龍朔二年改曰奉輦局左尚令供七輦儀衞志大輦一方輦一小輦一腰轝小輿一李叔明傳朝京師賜錦輦令官士肩舁以見閻立徳傳武徳初制腰輿有典法周巾車王后有輦車小司徒掌車輦漢以彫玉為之方徑六尺晉大駕有大輦華蓋中道梁有蓬輦後周閲視武庫得魏舊物有乾象輦駕二十四馬又有大樓輦車駕二十牛象輦駕二象皆魏天興中所製隋開皇元年以非古制皆廢毁隋有六輦大禮乗之六典注唐金輅裴寂傳貞觀初三年十二月太宗親郊命寂與長孫無忌升金輅舊史云御大輦引陪乗寂辭帝曰公有佐命勲無忌宣力王室非二人誰可參乗者遂同載歸李勣傳振旅還王為上將勣為下將皆服金甲乗戎輅告捷于廟唐指南車記里皷車五牛旗輿儀衞志指南記里皷車皆四馬有正道匠一人駕士十四人皆平巾幘緋衫太卜令一人居辟惡車服如佽飛執弓箭次相風轝行漏轝正道匠一人五牛旗輿五赤青居左黄居中白黒居右皆八人執之平巾幘衫從旗色㑹要元和十年十月閲新作指南車記里皷車於麟徳殿舊紀穆宗元和十五年十月辛巳金公亮修成指南記里皷車栁宗元記里皷賦觀其象可以守威儀之三千節其音可以表吉行之五十配和鸞並司南載考載擊匪疾匪徐唐蒲車隠逸傳玄宗在東宫表以蒲車召王友貞不至禮志老更乗安車唐相風轝儀衛志大駕鹵簿有相風轝其皷吹有掆皷金鉦宋朝玉輅唐顯慶輅慶厯金玉輅三朝志玉輅之制箱上置平盤黄屋四柱皆油畫刻鏤左青龍右白虎金塗銀装間以玉飾云云左建青旂右載闟㦸青繡綢杠金輅色赤象輅淺黄革輅黄木輅黒副輅當用銀飾者皆以銅初五輅副輅輿輦多仍唐舊而玉輅自唐顯慶中傳之號顯慶輅太僕所藏親郊則乗之制度精巧行止安重載太常闟㦸分左右均輕重後世良工莫能為之自唐至本朝凡三至太山登封世傳神物䕶之祥符二年四月庚寅别飾玉輅奉天書題曰天書玉輅九年十二月二十五日崇政殿觀天書金輅明道二年二月三日己亥御天安殿即大慶殿門閲太僕寺新製車輅景祐五年七月十一日丙午詔太常禮院詳定鹵簿儀物未合典制者釐正之玉金輅重加修飾唯二路旂㦸有金塗銀龍頭餘則否既成八月庚辰親閲於大慶殿門慶厯七年將郊祀正月十六日辛夘御大慶殿門閲新作金玉輅制頗崇廣皇祐二年大享明堂詔試二輅新輅頗減其崇舊輅亦修飾九月五日詔明堂法駕乗新玉輅舊輅亦從行及宿太廟詔朝饗禮畢乗舊玉輅以還沈括云慶厯玉輅乗之動揺遂不用元豐四年十一月己丑禮文所依周禮增製五輅六年正月丁丑朔大慶殿受朝先夕陳諸庭夜半撤幕屋新玉輅壓焉自是乗舊輅四朝志熙寧七年詔太常看詳兵部大駕鹵薄字圖奏言諸輅之副宜次正輅除去羊車五牛旗元豐初四年十二月己丑禮文所言古者五輅載旗謂之道徳之車漢鹵薄前驅有鳳皇闟㦸猶未施於五輅江左乃加棨㦸於車之右請去闟㦸而建太常又増近臣一員立車右又請用金輅至太廟祠畢御玉輅詣郊其後製五輅玉建太常金大旂象大赤革大白木大麾仍存闟㦸焉政和三年四月二十九日議禮局上車輅之制大朝㑹冊命設五輅於大慶殿庭為充庭之儀四年改修正副輅旂常並建於左右遂去闟㦸十二月庚午改脩五輅又增造大路建隆大輦祥符登封輦紹興大安輦建隆四年南郊翰學陶穀創意造大輦赤質正方油畫金塗銀葉龍鳳装祀郊謁廟省方還都用之祥符初元年東封命更造以舊輦重減七百餘斤後常用焉祥符元年東封六月丁巳别造升山天平輦施機關名登封輦今平輦制因此二年五月乙夘朔詔以天平輦為登封辟塵逍遥輦為省方加窻隔黄繒為裏周廣順中廢殿中細仗内芳亭鳳輦小輿建隆四年復用之芳亭輦黒質鳳輦赤質小輿赤質又有腰輿香蹬宋朝鹵簿以象居先又有涼車逍遥輦平頭輦乾興元年九月己丑禮院造皇太后輦名曰大安紹興十三年正月十五日製大安輦建隆五時副輅四年八月辛丒始復制大駕五時副輅各一乾徳進賢車明逺車崇徳車進賢車古安車也乾徳元年八月改赤質兩壁紗窻一轅緋幰紅絲網中設朱漆床香案朱漆行馬駕四馬周制致仕之老及后乗之明逺車古四望車也齊亦曰皂輪車駕以牛乾徳元年八月改仍駕四馬赤質制如屋重欄上有金龍四角垂銅鐸上層四面垂簾下層周以花板三轅崇徳車本秦辟惡車見古今注上有桃弧棘矢以攘却不祥乾徳元年八月改赤質四角刻辟惡獸中載黄旗亦繡此獸太卜令在車中執旗駕四馬宣和元年禮制局請以巫易大卜弧矢易辟惡獸從之三朝志耕根車制如五輅駕六青馬羊車亦為畫輪車赤質兩壁畫龜文金鳳翅門簾繡瑞羊指南車記里皷車白鷺車一名鼓吹車繡飛鷺一轅鸞旗車赤質曲壁一轅上載赤旗繡鸞鳥皮軒車以虎皮為軒赤質曲壁黄鉞車赤質曲壁駕赤馬二中設黄銊左武衞隊正在車中執鉞豹尾車上載朱漆竿首綴豹尾右武衞隊正執之屬車唐大駕用十二乗皇朝因之黑質兩箱金装前有曲闌金銅飾上施紫通幰絡帶門簾皆繡雲鶴紫絲網帉錔每乗駕三牛四朝志宣和六年七月禮制局言鹵簿記有白鷺鸞旗皮軒三車其制非古按曲禮曰青旌鳴鳶飛鴻虎皮貔貅欲改五車相次於中道繼之以崇徳車開寳鉦鼓行漏十二神輿三朝志相風烏輿上載長竿竿杪刻木為烏垂鵝毛筩紅綬帶下承以小盤周以緋裙繡烏形交龍鉦鼓輿各一皆刻木為二青龍相交一挂畫鼓一挂金鉦有緋蓋亦繡交龍鐘鼓樓各一本隋大駕鐘車鼓車也刻木為屋中置鐘鼓下施木臺長竿行漏輿隋大業行漏車也設刻漏如稱衡首垂銅鉢末有銅像漆樻貯水渴烏注水入鉢中十二神輿赤質四門旁刻十二辰神緋繡輪衣絡帶自鉦鼔以下舊禮令無文開寳定禮所增景徳二年詔王欽若脩飾唐儀衞志相風轝正道匠一人行漏轝正道匠一人刻漏生四人隋大業雜記大駕有㣔漏車鍾鼓車至道皇太子金輅皇太子車輅唐制三等至道元年九月二十七日皇太子真宗謁太廟乗金輅常朝則乗馬天禧二年九月十四日皇太子仁宗朝謁太廟乗金輅設仗如儀政和中以雷文一角螭代龍飾太子言不敢當盛儀止依常儀乗馬乾道元年八月十四日七年二月十一日皆控免乗金輅設仗九年七月二十三日詔大禮從祀乗金輅太子亦辭之政和三年四月二十九日議禮局上皇太子車輅之制金輅軺車四望車端拱耕車耕根車端拱元年耕藉有司議乗玉輅以耕車載耒耜先驅又請載於象輅以重其事明道二年制如玉輅而無飾駕士服繡鳳㘅嘉禾紹興十五年詔来春親耕閏十一月二十三日禮官言端拱親耕以耕根車載耒耜耕藉使不乗車從之侍中奉耒耜載于耕根車耕藉使乗騎從行於仗内祥符王公車輅實録祥符四年七月二十九日庚子先是知宻院王欽若言王公車輅用龍飾請改製景徳二年十二月癸夘王欽若請依六典令式别制王公已下車駕從之命禮院詳定太常禮院言准鹵簿令王公以下象輅以象飾諸末朱班輪八鑾在衡左建旂右載闟㦸革輅以革飾左建旃木輅飾以漆軺車曲壁青幰碧裏諸輅皆朱質朱蓋朱旂旜一品九旒二品八旒三品七旒四品六旒其鞶纓就數皆如之望付太僕寺修製從之志親王一品二品奉使給革輅制如乗輿之副惟改龍飾為螭六引内三品以下乗革車赤質制如進賢車駕赤馬四繡文司徒以瑞馬京牧以隼御史大夫以獬豸兵部尚書以虎太常卿以鳳縣令乗軺車黑質元豐二年七月講求車旃旂物制度元祐七年十月太常言按開元禮義羅大駕八角紫繖王公以下四角青繖今鹵簿圖但引紫繖乞改用青政和三年四月議禮局上王公車輅制并鹵簿制天聖指南車周司南軿車見上歴代指南車三朝志指南車一曰司南車赤質兩箱畫青龍白虎四面畫花鳥重臺闌鏤栱四角垂香囊上有仙人車雖轉而手常南指一轅鳳首駕四馬駕士舊十八人雍熙四年增為三十人四朝志頂有五采飾縷仙人一童子四天聖五年十一月壬寅紀云壬寅復作指南車直昭文館一云定王府記室燕肅請造指南車其表云黄帝與蚩尤戰涿鹿蚩尤起大霧將士不知所向帝遂作指南車又周成王時越裳氏重譯来獻使者迷惑失道周公賜軿車以指南使大夫張窶送之周年至國還以屬巾車王出常為先導示服逺人而正四方其後器法俱亡以上見古今注漢張衡魏馬鈞繼作屬世亂離其器無傳宋武平長安嘗為此車而製不精順帝令祖冲之復造之後魏太武帝使工人郭善明造彌年不就又命扶風馬岳造之垂成而為善明鴆死其法遂絶唐元和十五年十月辛巳典作官金公立一作云亮立云凡三見此及通鑑作立唐㑹要十年以其車及記里鼓車上之憲宗閲於麟徳殿以備法駕厯五代至國朝不聞得其制者今創意成之其法用獨轅車立木仙人於上引臂南指車雖轉而手常指南又内侍盧道隆上所創記里鼓車其車獨轅雙輪箱上為兩重上皆以其法下有司製之皇祐五年十月二十一日丙辰御延和殿召輔臣觀指南車大觀元年内侍呉徳仁始獻指南車記里鼓車之制天子宗祀大禮用之始廢天聖中燕肅盧道隆所製晉志司南車一名指南車駕四馬其下制如樓三級四角金龍銜羽葆刻木為仙人衣羽衣立車上車雖囘運而手常指南大駕出行為先啓之乗南齊志四周廂上施屋畫輪駕牛記里鼓車駕四馬形制如司南其中有木人執槌向鼓行一里而打一槌南齊志制如指南上施華蓋機皆在内宋志指南車其始周公作後漢張衡始復創造漢末其器不存義熙十三年宋武帝平長安始得此車其制如鼓車設木人於車上舉手指南車雖囘轉所指不移大駕鹵簿最先啟行此車機數不精雖曰指南多不審正囘曲步驟猶須人功正之范陽祖冲之有巧思謂宜更造隋志指南車出為先啟之乗漢初置俞兒騎並為前驅左太冲賦曰呉都賦俞騎騁路指南司方後廢其騎而存其車崔豹古今注通典注車法具在尚方故事其制未詳黄樂臺注鬼谷子曰肅慎還周公作或曰管仲作又帝内傳唐志天子有屬車十乗一曰指南行幸陳于鹵簿則分前後大朝㑹則分左右詳見唐屬車十乗志林黄帝戰涿鹿蚩尤作大霧彌三日將士昏迷人皆惑帝令風后法斗機作指南車以别四方通典宋志同魏明帝青龍中令博士馬鈞再造車上有木仙人手掌指南車箱囘轉所指微差晉亂復亡石虎使解飛姚興使令狐生又造崔鴻後趙録曰尚方今解飛機巧若神妙思竒發造指南車賜關内侯秦姚興使令狐生又造宋武平關中得之晉義熙十三年劉裕平長安始得此車於姚興外有形而無機杼每行使人自轉之義熙五年屠廣固獲指南使工人張綱補緝宋順帝昇明末齊髙帝輔政使祖冲之追修古法冲之改造銅機圓轉不窮而司方如一馬鈞以来未之有也車成使王僧䖍劉休試之其制甚精百屈千囘未嘗移變齊因宋制加飾四周箱上施木木字一作屋指南人衣裙襦天衣在箱中上四角皆施龍子干懸雜色真孔雀毦布皂複幔駕牛皆銅鉸飾唐六典亦云如前宣和鹵薄記唐初指南車有其名而車破壊將作大匠楊務亷性巧奉勅改作終不能至開元中衛普善造車令直少府監元和中巧工金忠義作指南車記里皷憲宗於麟徳殿觀之述征記云去端門百餘步道南得尚方北門中有指南車上有木仙人持信幡車雖東西手常指南唐元和中作指南與記里車憲宗閲之麟徳殿五代至國朝皆車中令人運轉天聖記里鼓車大章車三朝志記里鼓車一名大章車赤質四面畫花鳥重闌鏤栱一轅鳳首駕四馬駕士舊十八人雍熙四年増為三十人行一里則上層木人擊鼓十里則次層木人擊鐲天聖五年十一月内侍盧道隆剏記里鼓車其車獨轅雙輪箱上為兩重刻木人手執木槌輪一周而行地三步其中平輪轉一周車行一里下一層木人擊皷上平輪轉一周車行十里上一層木人擊鐲凡用大小輪八合二百八十五齒遞相鈎鎖犬牙相制周而復始四朝志銅鉦畫皷各一大觀元年呉徳仁獻其制燕肅傳嘗造指南記里皷二車及欹器以獻又上蓮花漏法黄帝内傳曰玄女為帝制司南車當其前記里皷居其右崔豹古今注曰大章車所以記道里起於西京亦曰記里車車上為二層皆有木人行一里下層擊鼓行十里上層擊鐲尚方故事有作車法然則自黄帝造之非兩漢所作也漢甘泉鹵簿晉中朝大駕有之並駕四漢曰記道車晉滅後秦獲之形如指南車宋志記里車未詳所由来亦髙祖定三秦所獲制如指南其上有鼓車行一里木人輒擊一槌大駕鹵簿以次指南文苑英華張彦振指南車賦北斗在天司南在地扄關脉湊衡樞星設帝容順動王途允泰備屬車引行斾候薫風而進指仰卿雲而垂蓋援枹鼓於天街動輗軏於霜仗候之節步先以啓行節六鼓以鼉駭首五路而鱗次張衡應間曰參輪可使自轉木彫猶能獨飛明道六車志皇后之車唐六等皇朝鹵簿唯用厭翟車常出用副金塗銀装白藤輿上覆椶屋飾以鳳輦咸平中萬安太后輿上設行龍六明道元年十二月辛丑詔有司製重翟等六車以皇后将謁廟紹興十三年皇后受冊乗龍飾肩輿至穆清殿乾興元年九月二十三日禮儀院言皇太后檐子依式製造詔名大安輦宣仁謙恭不乗大安輦元豐八年六月十二日詔皇太后乗輿上設行龍六紹聖元年十月六日禮官言皇太后坐六龍輿皇太妃輿上設行龍五又再詳定進皇太妃龍鳳輿政和三年四月二十九日議禮局上皇后車輿之制周禮疏上公侯伯夫人乗厭翟子男夫人乗翟車王之三夫人與三公夫人同乗翟車左傳夫人魚軒卿犀軒直蓋陳髙凉洗氏繡幰油絡駟馬安車崔篆母文軒丹轂富弼賈昌朝母賜銀飾肩輿明道天安殿閲車輅元豐五輅並見上明道二年二月己亥御天安殿門即大慶殿閲太僕寺新製車輅景祐五年七月丙午詔太常禮院詳定鹵簿儀物未合典制者釐正之玉金路重加修飾唯二路旂㦸有金塗銀龍頭餘則否既成八月庚辰親閲於大慶殿門慶厯七年將郊祀正月辛夘御大慶殿門閲新作金玉輅皇祐二年大享明堂詔試二輅云云元豐四年十一月己丑禮文所依周禮増製五輅詳見上皇祐小輦二年五月八日禮院言明堂往囘宫禁地近止乗常御小輦九月二十七日未明三刻服鞾袍乗小輦殿中繖扇侍衞至大次服衮冕執圭入自明堂中門至版位解嚴改服乗輦御紫宸殿百寮稱賀元豐充庭車政和大路大旂元年十一月二十三日詳定儀注所言正旦朝㑹用黄麾仗以車輅與輦充庭具圖以進詔車輅未設餘依所請政和六年七月五日造大路如玉路之制唯不飾以玉樊纓一就以尚質又製大旂十有二旒龍章而設日月建於大路之上以象天四年十一月詔增修五輅正副十乗制度始備舊自齋宫乗大輦越大次今改用大路紹興玉輅五輅十二年七月己酉十八日詔太常詳定車輅儀仗制度太常請先造玉輅命工部尚書莫將等同内侍邵諤製造八月三日将等言以天禧宣和鹵簿圖參攷制度酌文質之中九月戊申十八日新玉輅成上御射殿臨軒令百官觀之十月癸未詔車輅院復置官吏十三年正月己亥親享太廟平旦上自宫乗玉輅祕書少監秦熺執綏是年春遂作金象革木四輅及大安輦閏四月十六日太常請依周禮各建所載之旗唯玉輅並建旂常玉輅青飾左建太常十二斿右龍旂金輅黄飾建大旂九斿象輅朱飾建大赤七斿革輅銀褐飾建大白六斿木輅黑飾建大麾四斿玉輅髙一丈九尺四輅各減五寸十一月己未朝饗太廟禮畢上服通天絳紗乗玉輅齋于青城庚申祀圜丘鹵簿萬二千二百二十人應用文繡者皆以纈代之初備五輅禮官以行在御街狹故自宫徂廟不乗輅權以輦代之戊午服袍履乗輦詣景靈宮朝獻邵諤識舊制姓名刻于玉輅上紹熙二年八月修玉輅更造四輅隆興平輦七寳輦元年七月二十三日製平輦及絛衣褥郊祀禮畢用之二年正月五日詔御輦院製七寳輦進徳夀宫如道君之制有司言東都舊制輦飾以玉裙網用七寳上皇不肯重費遂止先是紹興七年八月製逍遥輦詔文思院務令檏素九月二日臣僚請申飭攸司以崇儉之意二年二月八日禮官言郊祀止用玉輅四輅特一時觀美禮經玉輅以祀鄭氏釋曰王乗一輅餘從行以華國請權不以從詔四輅及大安輦並省自齋殿服履袍乗平輦還宫乾道六年九月一日詔復用五輅大安輦如舊儀玉輅有執綏官備顧問有牌篆玉輅二字以玉為之文徳殿發冊尚輦陳大輦於西階下東向隆興元年權不陳設玉海卷七十九
