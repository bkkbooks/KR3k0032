body:
  text: 玉海卷五十宋王應麟撰藝文譜牒鄭樵氏族畧曰三代之前姓氏分而為二男子稱氏婦人稱姓氏以别貴賤貴者有氏賤者有名無氏姓所以别婚姻故有同姓異姓庶姓之别三代之後姓氏合而為一皆所以别婚姻而以地望明貴賤於文女生為姓故姓之字多從女如姬姜嬴姒姚媯姞妘婤姶㚰嫪之類是也大傳正義云始祖為正姓者若炎帝姓姜黄帝姓姬周姓姬本於黄齊姓姜本於炎宋姓子本於契云髙祖為庶姓者若魯之三桓慶父叔牙季友之後鄭之七穆子游子國之後為游氏國氏云若今宗室屬籍者以漢之同宗有屬籍則周家繫之以姓是也古者聖人吹律定姓以記其族後之命氏其義有九蓋號諡爵國官字居事職之謂也自世本起于漢氏昭穆著于晉家錫土之制著于夏書司商所掌表於周典黄帝二十五宗國語晉司空季子曰黄帝之子二十五人其同姓者二人而已唯青陽與夷鼔皇甫謐云夷鼔一名蒼林皆為己姓青陽方雷氏之甥也夷鼔彤魚氏之甥也其同生而異姓四母之子别為十二姓凡黄帝之子二十五宗史記紀云二十五子其得姓者十四人為十二姓得姓以徳居官而賜之姓也二人為姬二人為已故十二姓姬酉祁巳滕箴任荀僖姞儇依是也唯青陽與倉林氏同于黄帝故皆為姬姓同徳之難也如是史記索隠曰姬姓青陽當為玄囂史記嫘祖為黄帝正妃生二子其後皆有天下曰玄囂昌意漢王莽傳黃帝二十五子分賜厥姓十有二氏命厯序黃帝傳十世二千五百二十年或云十八代唐吕才曰堪輿經黄帝對天老有五姓之言後漢書蘇竟曰三十五姓注春秋運斗樞曰五七三十五人皆兆一徳古之典禮者皆以宗名伯夷作秩宗周官有宗伯下及都家有宗人五帝繫牒史記三代世表太史公曰五帝三代之記尚矣索隠曰此表依帝繫世本自殷以前諸侯不可得而譜周以來乃頗可著孔子因史文次春秋紀元年正月日時蓋其詳哉至於序尚書則畧無年月或頗有然多闕不可録故疑則傳疑蓋其慎也余讀牒記注牒者記系諡之書黄帝以來皆有年數稽其厯譜牒終始五德之傳褚先生引黄帝終始傳古文咸不同乖異夫子之弗論次其年月豈虚哉於是以五帝繫牒尚書集世紀黄帝以來訖共和為世表索隠曰大戴禮有五帝德帝繫篇太史公取此二篇之牒及尚書集而紀黄帝以來為系表也起黄帝至顓頊三世帝嚳四世帝堯五世至桀二十世至湯十七世至紂四十六世至武王立十九世自黄帝至堯舜禹皆同姓而異其國號以章明德五帝考德前漢厯志帝考德曰少昊曰清黄帝之子青陽也注師古曰考德者考五帝德之書也又有堯舜禹帝系之書史記太史公曰予觀春秋國語其發明五帝德帝繫姓章矣見下歐陽修帝王世次圖序云司馬遷作本紀出於大戴禮世本諸書今依其說圖而考之堯舜夏商周同出黄帝云云唐帝系虞帝系禹帝系前律厯志唐帝帝系曰帝嚳四妃陳豐生帝堯封於唐蓋髙辛氏衰天下歸之木生火故為火徳天下號為陶唐氏即位七十載虞帝帝系曰顓頊生窮蟬六世生舜處虞之媯汭堯嬗以天下火生土故為土德天下號曰有虞氏即位五十載伯禹帝系曰顓頊六世而生禹虞帝嬗以天下土生金故為金德天下號曰夏后氏繼世十七王四百三十二歳大戴禮帝繫篇第六十三始於少典終於塗山史記太史公曰孔子所傳宰予問五帝德及帝繫姓儒者或不傳予觀春秋國語其發明五帝德帝繫姓章矣正義大戴禮及孔子家語篇名索隠同春秋正義司馬遷采帝系世本以為史記蜀志秦宓見帝系之文五帝皆同一族辨其不然之本太平御覽引帝系譜女媧充樂堯百官族姓堯典九族既睦平章百姓注百官也正義此下既言黎民故知百姓即百官族姓也左傳隠八年無駭卒羽父請諡與族公問族於衆仲對曰天子建德因生以賜姓立有德為諸侯因其所由生以賜姓若舜由媯汭故陳為媯姓胙之土而命之氏諸侯以字位卑不得賜姓故其臣因氏其王父字為諡因以為族或即先人之諡稱以為族官有世功則有官族邑亦如之公命以字為展氏諸侯之子稱公子公子之子稱公孫公孫之子以王父字為氏正義氏族一也釋例曰别而稱之謂之氏合而言之則曰族例言别合者若宋華向出戴桓公獨舉其人則云華氏向氏并指其宗則云戴族桓族記謂之庶姓者以始祖為正姓髙祖為庶姓庶姓亦氏族之别名也姓則受之於天子族則禀之於時君其不賜者各從父之姓族黄帝之子兄弟異姓周之子孫皆姓姬者古今不同賜姓者亦少唯外姓媯滿之徒賜族者有大功德宜世享祀者方賜之王朝大夫不封為國君者王賜之族春秋尹氏武氏之徒魯挾鄭宛皆未賜族故單稱名華督生立華氏魯之翬挾柔溺名見於經其後無聞是或不得族也其士㑹之帑處秦者為劉氏伍員之子在齊為王孫氏知果自别其族為輔氏皆身自為之非復君賜釋例曰子孫繁衍枝布葉分始承其本末取其别故其流至於百姓萬姓服䖍云公之母弟則以長幼為氏貴適統伯仲叔季是也庶公子則以配字為氏尊公族展氏臧氏是也春秋未賜族而身為大夫則稱名無駭挾之類是也已賜族而使之世為大夫則稱族如仲叔季孫之類是也古者置卿必求賢徳不以世官伊陟象賢復相大戊丁公世美入掌兵權不以世故疑之也襄公十年伯輿之大夫曰平王東遷吾七姓從王賜之騂旄之盟襄十一年同盟于亳載書曰七姓十三國之祖晉魯衞鄭曹滕姬姓邾小邾曹姓宋子姓齊姜姓莒巳姓杞姒姓薛任姓實十三國三十一年鄭公孫揮辨於大夫之族姓班位楚語觀射父曰民之徹官百王公之子弟質能言能聽徹其官者物賜之姓以監其官謂之百姓物事也以功事賜之姓若司馬太史之屬姓有徹品十于王謂之千品單襄公曰有分族于周後魏禮志許叔重五經異義云今春秋公羊穀梁說卿大夫世位則權并一姓謂周尹氏齊崔氏也古春秋左氏說卿大夫皆得世祿傳曰官族易曰食舊德書曰世選爾勞詩云不顯亦世堯賜姓號商頌正義中候握河紀云堯曰嗟朕無德欽奉丕圖賜爾二三子斯封稷契臯陶賜姓號注契為子稷為姬臯陶未聞禮記正義鄭駁異義云炎帝姓姜太皥所賜黄帝姓姬炎帝所賜故堯賜伯夷姓曰姜禹姓曰姒契姓曰子稷姓曰姬著在書傳是天子賜姓也諸侯賜卿大夫以氏若同姓公之子曰公子公子之子曰公孫公孫之子其親已逺以王父字為氏若適子以五十字伯仲為氏若魯之仲孫季孫是也庶子以二十字為氏則展氏臧氏是也異姓則以父祖官及所食邑為氏則司馬司城是也以邑為氏若韓趙魏是也凡賜氏族者為卿乃賜大功德生賜以族若叔孫得臣是也以公子之字賜為族若仲遂是也無功德死後乃賜族若無駭是也若子孫不為卿其君不賜族自以王父字為族也高陽高辛十六族左傳高陽氏有才子八人蒼舒隤敳檮戭大臨厖降庭堅仲容叔達謂之八愷高辛氏有才子八人伯奮仲堪叔獻季仲伯虎仲熊叔豹季貍謂之八元此十六族也世濟其美不隕其名祝融八姓鄭語史伯曰黎為高辛氏火正吳回也故命之曰祝融能昭顯天地之光明以生柔嘉材其後八姓祝融之後已董彭秃妘曹斟芉於周未有侯伯巳姓昆吾蘇顧温董莒其後董姓鬷夷豢龍巳姓之别彭姓彭祖豕韋諸稽大彭也豕韋諸稽其後别封秃姓舟人彭祖之别妘姓鄔鄶路偪陽曹姓鄒莒斟姓無後融之興者其芉姓乎芉姓䕫越不足命也惟荆實有昭德春秋疏世本氏姓篇云任姓謝章薛舒吕祝終泉畢過禹錫土姓禹貢錫土姓注天子建德因生以賜姓謂有德之人生此地以此地名賜之姓以顯之鄭玄注謂胙之土賜之姓舜典别生分類注生姓也别其姓族分其類使相從國語帝胙禹以天下賜姓曰姒氏曰有夏胙四岳國命為侯伯賜姓曰姜氏曰有吕史記紀舜封契于商賜姓子氏棄别姓姬氏秦之先柏翳舜賜姓嬴氏傳舜賜董父姓曰董氏曰豢龍胡公周賜之姓論衡古者因生賜姓若夏吞薏苡而生則姓苡氏商吞燕子而生則姓子氏周履大人綦則姬氏古者有本姓有氏姓陶氏田氏事之氏姓也上官氏司馬氏吏之氏姓也孟氏仲氏王父字之氏姓也夏商姓氏史記太史公曰禹為姒姓其後分封用國為姓故有夏后氏有扈氏有男氏斟尋氏彤城氏襃氏費氏杞氏繒氏辛氏冥氏斟氏戈氏契為子姓其後分封以國為姓有殷氏來氏宋氏空桐氏稚氏北殷氏目夷氏商民六族七族見分器周譜春秋厯譜牒漢溝洫志大司空掾王横引周譜云定王五年河徙注如淳曰世統譜牒也藝文志厯譜帝王諸侯世譜二十卷古來帝王年譜五卷漢元殷周牒厯十七卷史記三代世表云云見五帝繫牒十二諸侯年表太史公讀春秋厯譜牒至周厲王廢書而歎索隠自古為春秋學者有年厯譜牒之說南史劉杳云桓譚新論云太史公三代世表旁行邪上並效周譜漢張衡傳一介之策各有攸建子長牒之爛然有第注功臣等傳唐栁芳曰司馬遷因周譜明世家張蒼厯譜五徳杜元凱作春秋長厯及公子譜周繫世世本禮瞽矇諷誦詩世奠繫注杜子春云小史主次序先王之世昭穆之繫述其德行瞽矇主誦詩并誦世繫以戒勸人君故國語曰教之世以怵懼其動玄謂世之而定其繫謂書於世本也小史掌邦國之志定繫世辨昭穆注帝繫世本之屬疏天子謂之帝繫諸侯謂之世本魯語宗有司曰工史書世工瞽師官史大史世世次先後宗祝書昭穆宗伯掌其禮大祝掌其位宗廟之有昭穆以次世之長幼等胄之親疏傳曰文曰昭武曰穆大王之昭王季之穆楚語申叔時曰教之世而為之昭明德廢幽昏先王之世繫也大傳繫之以姓而弗别周道然也始祖為正姓髙祖為庶姓繫之弗别若今宗室屬籍漢志春秋家世本十五篇古史官記黄帝以來訖春秋時諸侯大夫隋志世本王侯大夫譜二卷世本一卷劉向撰世本四卷宋衷撰司馬遷已采世本恐非向撰漢初得世本叙黄帝以來祖世所出言姓氏皆本世本公子譜上書皆本左傳唐志宋衷世本四卷世本别録一卷宋均注帝譜世本七卷王氏注世本譜二卷顔之推云世本左丘明所書此說出帝王世紀漢司馬遷贊世本録黄帝以來至春秋時帝王公侯卿大夫祖世所出遷采世本梅福傳綏和元年以世本相明封孔子世班彪傳世本一十五篇司馬遷刪世本史記注鄭康成駁異義曰天子賜姓命氏諸侯命族族者氏之别名也姓者所以統繫百世使不别也氏者别子孫之所出故世本之篇言姓則在上言氏則在下也劉向曰世本古史官明於古事者所記録黄顓以來至春秋時王侯諸國世卿大夫名字號與左氏合索隠云録黄帝以來帝王諸侯及卿大夫系諡名號凡十五篇春秋正義今之世本與司馬遷言不同世本多誤不足依憑又引世本氏姓篇言十國皆任姓書正義案今世本帝繫二禮注引世本作疏世本有作篇記諸作事云孟子注引世本録諸侯之世宋詩正義引仲子注史通能言吾祖郯子見師不識其先籍談見笑周撰世本式辨諸宗楚置三閭實掌王族通鑑外紀世本經秦歴漢儒者改易大戴禮出於世本國史志崔表世本圖一卷周語仲山父曰司商協名姓注司商掌賜族受姓之官商金聲清謂人始生吹律合之定其姓名白虎通古者聖人吹律定姓以記其族人含五常而生聲有五音是類謀黄帝吹律以定姓孔子京房亦然禮秋官司約治民之約注若懐宗九姓在晉殷民六族七族在魯衞易正義按世譜等羣書神農一曰連山氏云云詩生民疏大戴禮帝繫篇云帝嚳卜其四妃之子皆有天下云云家語世本其文亦然毛傳司馬遷為五帝本紀皆依用焉唐張說曰古未有姓自炎帝之姜黄帝之姬始因所生地而為姓其後天子建德因生賜姓小司馬三皇紀神農其後有州甫甘許戲露齊紀怡向申吕皆姜姓之後並為諸侯古三墳有姓紀一篇太古河圖代姓紀五宗禮記大傳别子為祖繼别為宗繼禰者為小宗有百世不遷之宗有五世則遷之宗疏百世不遷謂大宗也五世則遷謂小宗也百世不遷者别子之後也宗其繼别子之所自出者百世不遷者也五世則遷者繼髙祖者也宗其繼髙祖者五世則遷者也注别子諸侯之庶子别為後世為始祖也别子之世適族人尊之謂之大宗是宗子也别子庶子之長子為其昆弟為宗謂之小宗以其將遷也小宗有四或繼髙祖或繼曾祖或繼祖或繼禰疏小宗雖四初皆繼禰為始書大傳宗室有事族人皆侍終日大宗已侍於賓奠然後燕私注禮志云别子為祖繼别為大宗繼禰為小宗白虎通宗族篇大宗能率小宗小宗能率羣弟宗其為始祖後者為大宗此百世之所宗也宗其為髙祖後者五世而遷者也髙祖遷於上宗則易於下宗其為曾祖後者為曾祖宗宗其為祖後者為祖宗宗其為父後者為父宗以上至髙祖宗皆為小宗以其轉遷别於大宗也别子者自為其子孫為祖繼别也各自為宗小宗有四大宗有一凡有五宗儀禮大宗者尊之統也收族者也詩公劉君之宗之注為之君為之大宗也吕氏曰古者建國立宗其事相須左傳大夫有貳宗注宗子之副貳者保姓受氏以守宗祊周書允文篇選同氏姓位之宗子隋志禮類梁有五宗圖一卷晉九宗見官制三代世表譜牒史記自序三代尚矣年紀不可考蓋取之譜牒舊聞作三代世表第一周室衰微諸侯専政春秋有所不紀而譜牒經畧作十二諸侯年表第二吕氏曰史記十表意義弘深三代世表以世系為主以觀百世之本支黄帝之初先列譜系以祖宗為經子孫為緯則五帝三代皆出黄帝可知矣世系未必可盡信然叙載本支則古法也周成王之後詳列諸侯以世為經以國為緯則親疏之相輔可知顓頊以下周武以上有經無緯止列世系而大治亂附焉則正嫡旁支之繼統可知今本自顓頊至帝芒猶有經有緯蓋子長借譜系上方書帝王之世耳春秋公子譜書目春秋公子血脈譜其傳本曰荀卿撰秦譜下及項滅子嬰之際非荀卿作明矣然枝分派别如指諸掌非殫見洽聞不能為其間不無訛謬中興書目一卷唐楊藴撰崇文目春秋類演左傳諡族圖五卷春秋世譜七卷帝王厯紀譜二卷春秋宗族名諡譜五卷春秋正義杜預采太史公書世本旁引傳記以為世族譜預作春秋公子譜隋志春秋左氏諸大夫世譜十三卷屈原為楚三閭大夫掌王族三姓曰昭屈景序其譜屬率其賢良以厲國士漢帝本系漢髙紀贊春秋晉史蔡墨有言陶唐氏既衰其後有劉累學擾龍事孔甲范氏其後也而大夫范宣子亦曰祖自虞以上為陶唐氏在夏為御龍氏在商為豕韋氏在周為唐杜氏晉主夏盟為范氏范氏為士師魯文公世奔秦後歸于晉其處者為劉氏劉向云戰國時劉氏自秦獲于魏秦滅魏遷大梁都于豐是以頌髙祖曰漢帝本系出自唐帝降及于周在秦作劉涉魏而東遂為豐公豐公蓋太上皇父及髙祖即位置祠祀官則有秦晉梁荆之巫世祠天地綴之以祀豈不信哉王命論劉氏承堯之祚氏族之世著乎春秋唐據火德而漢紹之漢帝王譜世譜年譜志厯譜十八家帝王諸侯世譜二十卷古來帝王年譜五卷又見上隋志漢氏帝王譜三卷唐志二卷漢初得世本叙黄帝已來祖世所出而漢又有帝王年譜盧植傳獻書竇武曰今同宗相後披圖案牒以次建之漢屬籍見宗戚類漢諸王世譜宗正著録並見後漢官譜譜學見下舊德名氏唐栁冲傳後漢有鄧氏官譜隋志云晉亂已亡應劭有氏族一篇王符潛夫論亦有姓氏一篇何承天有姓苑二篇譜學大抵具此又有潁川太守聊氏萬姓譜文選注七畧曰子雲家牒言以甘露元年生西都賦士食舊德之名氏漢居官姓號考工記注其曰某氏者官有世功若族有世業以氏名官者也若築冶鳬㮚桃韋裘之類食貨志武帝之初國家亡事為吏者長子孫居官者以為姓號王嘉傳孝文時吏居官者或長子孫以官為氏倉氏庫氏則倉庫吏之後也廣韻王符潛夫論姓氏志曰東門西郭南宫北郭皆是因居也風俗通曰凡氏之興九事一氏於號唐虞夏殷是也姓氏篇序四氏於國齊魯宋衞是也漢外屬圖竇融傳在河西聞光武即位決策東向五年夏遣長史劉鈞奉書獻馬隗囂反融與五郡太守共砥礪兵馬上疏請師期帝深美之賜以外屬圖及太史公五宗外戚世家魏其侯列傳詔報曰每追念外屬孝景皇帝出自竇氏定王景帝之子朕之所祖昔魏其一言繼統以正長君少君尊奉師傅修成淑德施及子孫此皇太后神靈上天祐漢也薛綜五宗圖吳志薛綜定五宗圖通典薛綜述鄭氏禮五宗圖曰天子之子稱王子王子封諸侯若魯衞是也諸侯之子稱公子公子還自仕食采於其國為卿大夫若魯公子季友是也則子孫自立此公子之廟謂之别子為祖則嫡嫡相承作大宗百代不絶大宗之庶子則皆為小宗小宗有四五代而遷已身庶也宗禰宗已父庶也宗祖宗已祖庶也宗曾祖宗已曾祖庶也宗髙祖宗已髙祖庶也則遷而唯宗大宗晉杜元凱宗譜云云賀循宗義曰太祖之代則為大宗宗之本統故也支子旁親非太祖之統謂之小宗傅純問賀云云殷浩問范宣云云曹述初集解明宗義曰其士大夫之嫡者此為諸侯别子之後也庾亮問賀循曰祖宗之正不易則本枝昭穆厯百代而不亂此立宗之大㫖也答曰禮宗子之義所以明本祖之正統紀百代而不紊漢石渠禮議曰聞人通漢戴聖云云賀循宗義曰奉宗加於常禮平居即每事諮告文中子曰宗祖廢而氏姓離矣張勃吳録吳八族陳桓吕竇公孫司馬徐傳四姓朱張顧陸魏管寧傳注傳子曰寧以世多妄變氏族者著氏姓論以原本世系晉族姓昭穆記隋志晉摯虞作族姓昭穆記十卷晉亂已亡摯虞傳以漢末喪亂譜傳多亡失雖其子孫不能言其先祖撰族姓昭穆十卷上疏進之以為足以備物致用廣多聞之益史通晉有摯虞族姓記郭須撰魏晉世譜十卷祭統有事於太廟羣昭羣穆咸在而不失其倫注謂同宗父子皆來孝經疏昭明也穆敬也故昭南向穆北向後漢志注決疑要注曰凡昭穆父南面故曰昭昭明也子北面故曰穆穆順也始祖特於北其後以次夾始祖而南昭在西穆在東相對蔡邕明堂論引禮記昭穆篇曰祀先賢于西學所以教諸侯之德朱子曰昭之言明也其讀為韶者晉避諱而改之禮書作佋字者假借而通用耳祫于廟室羣昭南向取其向明羣穆北向取其深逺晉姓氏簿狀宋百家譜齊百家譜梁百家譜宋姓苑姓氏英賢譜國親傳姓氏要狀百氏譜記譜學南齊賈淵傳字希鏡祖弼之父匪之世傳譜學先是譜學未有名家弼之廣集百氏譜記専心治業晉太元中朝廷給弼之令史書吏撰定繕寫藏祕閣乃遷左民曹及淵三世傳學凡十八州士族譜合百袠七百餘卷該究精悉當世莫比永明中衞軍王儉抄次百家譜與淵參懐撰定撰氏族要狀及人名書並行於世梁王僧孺傳入直西省知撰譜事武帝留意譜籍因詔僧孺改定百家譜始晉太元中賈弼篤好簿狀廣集衆家大捜羣族撰十八州一百十六郡合七百十二卷凡諸大品畧無遺闕劉湛為選曹始撰百家以助銓序傷於寡畧隋志梁有宋譜四卷劉湛百家譜一卷顧協撰異姓苑五卷齊王儉復加去取得繁省之衷僧孺通范陽張等九族以代鴈門解等九姓其東南諸族别為一部不在百家之數集十八州譜七百一十卷百家譜集抄十五卷隋志同東南譜集抄十卷徐勉該薛綜百氏皆避其諱隋志案梁有王司空新集諸州譜十二卷又别有諸姓譜一百十六卷益州譜四十卷關東關北譜三十三卷梁武帝總責境内十八州譜六百九十卷儀注有國親皇太子序親簿一卷唐栁冲傳晉太元中散騎常侍河東賈弼撰姓氏簿狀十八州百十六郡合七百一十二篇藏在祕閣副在左戸甄析士庶無所遺宋王弘劉湛好其書弘日對千客可不犯一人諱湛為選曹譔百家譜二卷以助銓序文傷寡省王儉又廣之隋志云儉十卷王逡之續四卷王僧孺演益為十八篇隋志三十卷東南諸族自為一篇不入百家數隋志南族譜二卷拾遺一卷弼傳子匪之匪之傳子希鏡希鏡撰姓氏要狀十五篇尤所諳究希鏡傳子執執更作姓氏英賢一百篇文選注引姓氏英賢録又著百家譜隋志二十卷廣兩王所記執傳其孫冠冠撰梁國親皇太子序親簿四篇王氏之學本於賈氏唐興言譜者以路敬淳為宗栁冲韋述次之李守素亦明姓氏時謂肉譜者後有李公淹蕭頴士殷寅孔至為世所稱初漢有鄧氏官譜應劭有氏族一篇王符潛夫論亦有姓氏一篇宋何承天有姓苑二篇隋志何氏二卷複姓苑一卷譜學大抵具此魏大和時詔諸郡中正各列本土姓族次第為舉選格名曰方司格人到于今稱之藝文志賈冠國親皇太子親傳四卷王儉百家集譜十卷王僧孺百家譜三十卷又十八州譜七百一十二卷賈執百家譜五卷隋志又有傅昭百家譜十五卷百家譜世統十卷鈔五卷又姓氏英賢譜一百卷隋志同何承天姓苑十卷賈希鏡氏族要狀十五卷孫愐唐韻引姓氏英賢傳姓苑王僧孺百家譜沈約謂周漢之道以智役愚魏晉以來以貴役賤裴子野謂三公之子傲九棘之家黄散之孫蔑令長之室元魏孝文大和二十年正月定諸州士族後魏書有官氏志李彪謂若取門地魯三卿孰若四科隋志魏遷洛有八氏十姓三十六族九十二姓其中國人士有四海大姓郡姓州姓縣姓史通譜牒之作盛於中古漢有趙岐三輔決録晉有摯虞姓族記江左有兩王百家譜中原有方思殿格唐志有方司格一卷柳芳論善言譜者繫之地望而不惑質之姓氏而無疑綴之昏姻而有别山東之人質故尚婚婭江左之人文故尚人物關中之人雄故尚冠冕代北之人武故尚貴戚鄭樵曰魏立九品置中正州大中正主簿郡中正功曹各有簿狀以備選舉晉宋齊梁因之晉賈弼宋王弘齊王儉梁王僧孺各有百家譜徐勉有百官譜宋何承天撰姓苑與後魏河南官氏志二書尤以為姓氏家所宗晉籍南史王僧孺傳梁武帝時知撰譜事先是尚書令沈約以為晉咸和初蘇峻作亂文籍無遺後起咸和二年以至于宋所書皆詳實並在下省左户曹前廂謂之晉籍有東西二庫宋元嘉二十七年以七條召發偽狀巧籍滋廣齊患其不實於是東堂校籍置郎令史掌之競行貨以新換故詔書甲子不與長厯相應校籍諸郎亦所不覺宋齊士庶不分職由於此竊以晉籍所餘宜加寶愛武帝以是留意譜籍因詔僧孺改定百家譜見上齊書建元三年詔曰黄籍人之大綱乃别置校籍官置令史晉陽秋初陳羣為吏部尚書制九格登用皆由中正考之簿世然後授任王戎門調户選唐譜牒十七家藝文志乙部史録十二曰譜牒類十七家三十九部一千六百十七卷宋衷世本四卷世本别録一卷宋均注帝譜世本七卷王氏注世本譜二卷漢氏帝王譜二卷齊永元年中表簿六卷梁大同四年表簿三卷齊梁宗簿三卷梁親表譜五卷後魏皇帝宗族譜四卷元暉業後魏辨宗録二卷後魏譜二卷後魏方司格一卷齊髙氏譜六卷周宇文氏譜一卷賈冠國親皇太子親傳四卷王儉百家集譜十卷王僧孺百家譜三十卷又十八州譜七百一十六卷徐勉百官譜二十卷賈執百家譜五卷又姓氏英賢譜一百卷何承天姓苑十卷賈希鏡氏族要狀十五卷官族傳十五卷冀州姓族譜七卷洪州諸姓譜九卷袁州諸姓譜七卷司馬氏世家二卷楊氏譜一卷楊氏蘇氏譜一卷孫氏譜記十五卷韋氏譜十卷韋鼎裴氏家譜二十卷裴守真大唐氏族志一百卷髙士廉撰姓氏譜二百卷許敬宗撰柳冲大唐姓族系録二百卷路敬淳衣冠譜六十卷著姓畧記二十卷不著録二十二家三百三十三卷王元感姓氏實論至諱行録紀百氏之譜牒者有姓苑畧氏族録開元譜新定譜牒元和姓纂姓林唐官姓氏記及家譜之屬紀皇室之譜牒者有永泰新譜續譜皇唐玉牒行樓維城録天潢源派譜皇室新譜皇孫郡縣主譜之類他如宰相甲族孔子系葉傳不可勝紀唐世譜牒備士大夫以世家相髙喜自植立六典譜系類世本等四十一部三百六十卷隋志同通亡書合五十三部一千二百八十卷舊志雜譜牒五十五部一千六百九十一卷崇文目氏族四十一部一百一十二卷中興書目譜牒五十五家一百十一卷續目四家四十六卷景德龍圖閣史傳閣譜牒九十九卷隋志書稱别生分類傳曰天子建徳因生賜姓周家小史定繫世辨昭穆亦史之職也唐氏族志姓氏録髙士廉傳太宗嘗以山東士人尚閥閱後雖衰子孫猶負世望嫁娶必多取資故人謂之賣昏由是詔士廉韋挺岑文本令狐德棻責天下譜牒參攷史傳檢正真偽進忠賢退悖惡先宗室後外姓退新門進舊望左膏粱右寒畯合二百九十三姓千六百五十一家為九等號曰氏族志而崔幹仍居第一帝曰我於崔盧李鄭無嫌顧其世衰不復冠冕猶恃舊地以取貲不肖子偃然自髙販鬻松檟不解人間何為貴之髙齊據河北梁陳在江南雖有人物偏方下國無可貴者故以崔盧王謝為重今謀士勞臣以忠孝學蓺從我定天下者何容納貲舊門向聲背實買昏為榮耶貞觀十六年六月己酉詔禁鬻昏太上有立德其次有立功其次有立言其爵為公侯卿大夫世世不絶此之謂門戸今皆反是豈不惑耶朕以今日冠冕為等級髙下遂以崔幹為第三姓班其書天下贊古者受氏以旌有功是時人皆土著故名宗望姓舉郡國自表而譜系興焉遭晉播遷胡醜亂華百宗蕩析士去墳墓子孫猶挾系録以示所承而閥閱顯者至賣昏求財汩喪㢘恥唐初流弊仍甚天子屢抑猶不為衰至中葉風教又薄譜録都廢公靡常産之拘士無舊徳之傳言李者悉出隴西言劉者悉出彭城悠悠世祚訖無考按冠冕皁隷混為一區可太息哉藝文志大唐氏族志一百卷士廉挺文本德棻等撰㑹要貞觀十二年正月十五日修氏族志一百卷崔幹為第三餘同士廉傳舊紀十二年正月乙未吏部尚書髙士廉等上一百三十卷顯慶四年九月五日改為姓氏録上親製序仍自裁其類例鄧名世曰唐宰相表九十三族至鍾陳韓髙之氏亦有訛舛唐姓氏録勲格髙士廉傳髙宗時許敬宗以氏族志不叙武后世李義府恥其家無名更以孔志約楊仁卿史玄道吕才等十二人刋定之裁廣類例合二百三十五姓二千二百八十七家帝自叙所以然以四后姓酅公介公及三公太子三師開府儀同三司尚書僕射為第一姓文武二品及知政事三品為二姓各以品位髙下叙之凡九等取身及昆弟子孫餘屬不入改為姓氏録顯慶四年六月丁卯當時軍功入五品者昇譜限縉紳恥言焉目為勲格義府奏悉索氏族志燒之又詔後魏隴西李寶太原王瓊滎陽鄭温范陽盧子儀盧潭盧輔清河崔宗伯崔元孫前燕博陵崔懿晉趙郡李楷凡七姓十家不得自為昏姻十月壬戌㑹要顯慶四年十月十九日詔三品以上納幣不得過三百匹四品五品二百六品七品百悉為歸裝夫氏禁受陪門財先是後魏大和中定四海望族以寶等為冠其後尚門地故氏族志一切降之王妃主壻皆取當時勲貴名臣家未嘗尚山東舊族房玄齡魏徵李勣復與昏故望不減然每姓第其房望雖一姓中髙下縣隔李義府為子求昏不得始奏禁焉其後天下衰宗落譜昭穆所不齒者皆稱禁昏家益自貴凡男女潛相聘娶天子不能禁世以為敝云張說傳武后嘗問氏族皆本炎黄之裔則上古乃無百姓乎若為朕言之說曰古未有姓若夷狄然自炎帝之姜黄帝之姬始因所生地而為之姓其後天子建德因生賜姓黄帝二十五子而得姓者十有四徳同者姓同徳異者姓殊其後或以官或以國或以王父之字始為賜族久而為姓降唐虞抵戰國姓族漸廣周衰列國既滅其民各以舊國為之氏下及兩漢人皆有姓故姓之以國者韓陳許鄭魯衞趙魏為多后曰善藝文志姓氏譜二百卷許敬宗李義府孔志約楊仁卿史玄道吕才撰㑹要顯慶四年九月五日通鑑六月丁卯詔改氏族志為姓氏録上親製序仍自裁其類例凡二百四十五姓二百八十七家吕才等十二人商量編録趙瑩曰古者衣冠之家書于圖籍中正清議以定品流故有家史家傳族譜族圖江左百家軒裳綴軌山東四姓簪組盈朝唐姓族系錄族譜總說栁冲傳景龍中遷左散騎常侍修國史初太宗命諸儒撰氏族志甄差羣姓其後門胄興替不常冲請改修其書帝詔魏元忠張錫蕭至忠岑羲崔湜徐堅劉憲吳兢八人及冲共取功徳時望國籍之家等而次之夷蕃酋長襲冠帶者析著别品㑹元忠等相繼物故至先天時復詔冲及堅兢與魏知古陸象先劉子玄等討綴書乃成號姓系録冲表曰姓氏之初世本著其義昭穆之叙周譜列其風漢晉之年應摯明宗系之說齊梁之際王賈述衣冠之源開元初詔冲與薛南金復加刋竄乃定後柳芳著論甚詳芳之言曰氏族者古史官所記也昔周小史定繫世辨昭穆故古者有世本録黄帝以來至春秋時諸侯卿大夫名號繼統左丘明傳春秋亦言天子建德因生以賜姓胙之土而命之氏諸侯以字為氏以諡為族昔堯賜伯禹姓曰姒氏曰有夏伯夷姓曰姜氏曰有吕下及三代官有世功則有官族邑亦如之後世或氏於國則齊魯秦吳氏於諡則文武成宣氏於官則司馬司徒氏於爵則王孫公孫氏於字則孟孫叔孫氏於居則東門北郭氏於志則三烏五鹿氏於事則巫乙匠陶於是受姓命氏粲然舉矣禮記疏天子賜姓賜氏諸侯但賜氏以伯仲為氏魯之仲孫李孫是也以字為氏展氏臧氏是也異姓以官為氏司馬司城是也以邑為氏韓趙魏是也姓風俗通氏於事巫卜陶匠是也姓廣韻注風俗通氏篇序云云王符潛夫論志氏云東門西門東郭北郭所謂居也三烏五鹿青牛白馬所謂志也仲或王父字為氏或公子公孫為氏或父之母弟列伯叔季為氏其族也或以先諡或以世功或以君賜秦既滅學諸侯子孫失其本系漢興司馬遷父子乃約世本修史記因周譜明世家乃知姓氏之所由出虞夏商周昆吾大彭豕韋齊桓晉文皆同祖也更王迭伯多者千祀少者數十代先王之封既絶後嗣蒙其福猶為彊家漢髙帝興徒步有天下命官以賢詔爵以功誓曰非劉氏王無功侯者天下共誅之先王公卿之胄才則用不才弃之不辨士與庶族然則始尚官矣然猶徙山東豪傑以實京師齊田與楚屈昭景皆右姓也其後進拔英豪論而録之蓋七相五公之所由興也魏氏立九品置中正尊世胄卑寒士權歸右姓以其州大中正主之晉宋因之始尚姓已然其别貴賤分士庶不可易也于時有司選舉必稽譜籍而考其真偽故官有世胄譜有世官賈氏王氏譜學出焉由是有譜局令史職皆具過江則為僑姓王謝袁蕭為大東南則為吳姓朱張顧陸為大山東則為郡姓王崔盧李鄭為大關中亦號郡姓韋裴栁薛楊杜首之代北則為虜姓元長孫宇文于陸源竇首之虜姓者魏孝文帝遷洛有八氏十姓三十六族九十二姓八氏十姓出於帝宗屬或諸國從魏者三十六族九十二姓世為部落大人並號河南洛陽人郡姓者以中國士人差第閥閱為之制凡三世有三公者曰膏粱有令僕者曰華腴尚書領䕶而上者為甲姓九卿若方伯者為乙姓散騎常侍太中大夫者為丙姓吏部正員外郎為丁姓凡得入者謂之四姓故江右氏族凡郡上姓第一則為右姓大和以郡四姓為左姓齊浮屠曇剛類例凡甲門為右姓周建德氏族以四海通望為右姓隋開皇氏族以上品茂姓為右姓唐貞觀氏族志凡第一等為右姓路氏著姓畧以盛門為右姓栁冲姓族系録凡四海望族則為右姓不通歴代之說不可以言譜也志栁冲大唐姓族系錄二百卷岑羲氏族錄卷亡㑹要神龍元年五月十八日栁冲上表願修氏族之譜上從之令左僕射魏元忠等八人重修至先天二年三月栁冲奏所修姓族録成上之凡二百卷又令刋定至開元二年七月二十二日畢上之昭文館學士栁冲左庶子劉子玄舊紀七月丙午上徐堅碑云及栁冲等同修姓氏系録鄭樵氏族畧曰姓氏之學最盛於唐而國姓無定論林寶作元和姓纂而自姓不知所由來自隋唐而上官有簿狀家有譜系官之選舉必由簿狀家之婚姻必由譜系歴代並有圖譜局置郎令史掌之仍用博通古今之儒知撰譜事凡百官族姓之有家狀者上之官為考定詳實藏於秘閣副在左戸唐編古命氏書目永隆二年李利涉撰三卷凡二百五十六姓著胄系之始其末又載諸氏族譜一卷云梁天監七年中丞王僧孺所撰俾士流案此譜乃通昏姻貞觀六年又命髙士廉等定氏族明加禁約云崇文目同唐官姓氏記志李利涉唐官姓氏記五卷初十卷後亡其半又編古命氏三卷唐劉氏譜㑹要長安四年鳳閣舎人劉知幾撰劉氏譜推漢氏為陸終苗裔非堯之後彭城叢亭里諸劉出自宣帝曾孫司徒居巢侯劉愷之後不承楚元王交皆援據明白前代所誤雖為流俗所譏學者服其該博志劉氏譜考三卷家史十五卷並劉子玄隋河間劉善經亦著諸劉譜三十卷左傳其處者為劉氏正義曰漢初左氏不顯明帝時賈逵上疏曰五經皆無證圖䜟明劉氏為堯後者左氏獨有明文前世借此以求道通故後引之為證宋朝河南劉氏由政㑹至燁十一世而世牒具存唐衣冠譜著姓略記路敬淳傳武后時數受詔纂輯慶䘏儀典武后稱之尤明姓系自魏晉以降推本其來皆有條序著姓略衣冠系譜等百餘篇云唐初姓譜學惟敬淳名家其後栁冲韋述蕭頴士孔至各有撰次然皆本之路氏志路敬淳衣冠譜六十卷又著姓略記二十卷唐開元譜韋述傳述好譜學見柳冲所撰姓族系録二百卷每私寫懐之還舍則又繕録故於百氏源派為詳乃更撰開元譜二十篇述典掌圖書餘四十年任史官二十年志韋述開元譜二十卷唐姓源韻譜晁氏志張九齡撰五卷依春秋正典柳氏萬姓録世本圖捃摭諸書纂為此譜分四聲以便尋閱唐新定諸家譜録志一卷李林甫等書目天下郡望姓氏族譜一卷李林甫等撰崇文目同記郡望出處凡三百九十八姓天寶中頒下非譜裔相承者不許昏姻唐百家類例孔至傳歴著作郎明氏族學與韋述蕭頴士柳冲齊名撰百家類例以張說等為近世新族剟去之說子垍方有寵怒曰天下族姓何豫若事而妄紛紛耶垍弟素善至以實告初書成示韋述述謂可傳及聞垍語懼欲更增損述曰丈夫奮筆成一家書奈何因人搖動有死不可改遂罷時述及頴士冲皆撰類例而至書稱工志韋述百家類例三卷孔至姓氏雜録一卷㑹要乾元元年著作郎賈至按賈至傳由單父尉拜起居中書舍人徙岳州司馬寳應初召復故官不曽遷著作郎疑是孔至撰百家類例十十六十九卷其序㫖曰以其婚姻成家冠冕備盡則存諸大譜所紀者唯尊官清職傳記本元分為十卷爰列百氏其中須有剖析各以當族注之通為百氏以隴西李氏為第一至貞元中左司郎中柳芳論氏族序四姓則分甲乙丙丁之次列四海士族則先山東載在唐厯中興書目百家類例一卷工部侍郎韋述撰又以大唐縉紳進姬周十八姓大唐相門甲族八十六家附其後書目姓氏古今雜録一卷孔至載氏族冠冕昏姻之盛又以方數甲乙紀之陸羽有江表四姓譜十卷唐永泰新譜皇室新譜宗正譜牒栁璟傳初芳永泰中㑹要二年十月七日按宗正譜牒斷自武德以昭穆系承撰永泰新譜二十篇其孫璟開成初㑹要四年正月因召對文宗歎新譜詳悉詔璟攟摭永泰後事綴成之復為十篇戸部奉筆札廩料志柳芳永泰新譜二十篇一作皇帝室新譜柳璟續譜十卷李衢大唐皇室新譜一卷㑹要舊紀永泰二年冬十月七日己丑宗正卿吳王祗奏修史官太常博士柳芳撰皇室永泰新譜二十卷上之開成四年閏正月勅翰林學士柳璟修續皇家永泰譜中興書目皇室新譜一卷李林甫撰玄宗御製序其譜言李氏之先出於髙陽氏之子咎繇為堯理官以官命族因為理氏其後理證得罪于紂證之子利正避難於伊侯之墟食李而得全因改理為李氏咎繇七代孫曰乾字先果天寶二年三月追尊為先天太皇帝乾生耳字伯陽乾封元年二月追尊為混元皇帝天寶三年三月又加大聖祖自此載唐二十帝後周武帝敕鮑宏修皇室譜分為帝緒疏屬賜姓三篇北史元暉業撰魏藩王家世號曰辨宗録四十卷唐志二卷唐續古今人表志雜史有韓祐續古今人表十卷開元十七年上授太常寺太祝梁江子一續班固九品唐元和姓纂志林寶元和姓纂十卷林寳自序壬辰之歳詔加邉將之封朔方之别帥閻某者有司建之邑於太原列郡焉閻子上言治爵九士族之而封乖本郡恐非舊典翌日上謂相國趙公曰宜召通儒碩士辨卿大夫之族姓者綜修姓纂每加爵邑則令閱視庶無遺謬凡二十旬纂成十卷自皇族之外各依四聲類集每韻之内則以大姓為首元和七年壬辰十月知制誥王涯為後序鄧名世曰姓纂稍能是正數十條而齊秦之屬亦所未暇至鉏丘茅夷指為複姓又不勝其謬矣㑹要元和七年王涯撰姓纂十卷上之志又有陳湘姓林五卷王元感姓氏實論十卷崔日用姓苑畧一卷唐孔子系葉傳志黄恭之二卷崇文目三卷中興書目闕里譜系一作世系一卷元豐中孔子四十六代孫宗翰刻而傳之紹興五年洪興祖正其缺誤又作先聖年表列之卷首成鐸重定文宣王家譜一卷南史劉縚著先聖本記十卷家語有本姓解第三十九春秋正義引家語本姓篇唐諸臣門族宰相世系表唐傳世多諸臣亦各修其家法以門族相髙材子賢孫不隕世德或父子相繼居相位或累數世而屢顯終唐世不絶盛矣唐相二百六十九人凡九十八族始於裴氏宰相二十三人崔氏十房十七人裴氏五房六趙郡李氏房張氏十三人王氏三房十四人韋氏九房十二人劉氏七房十一人楊氏杜氏十人李氏四房蕭氏二房九人鄭氏二房南祖北祖八人盧氏六人竇氏二房陸氏魏氏五人蘇氏武氏四人趙氏郭氏韓氏髙氏三人薛氏南祖西祖于氏栁岑文馬徐陳袁房宇氏二人戴姚姜周孫狐許牛樂齊宗令賈氏蕭氏八葉表云齊梁房九人張氏三世唐相譜書目一卷不知作者紀武德元年裴寂為相訖李忠臣大厯十四年拜平章事末云今上大厯十四年五月即位十五年正月一日改元建中所記宰相六人至關播而止葢德宗時所譜也崇文目宰相甲族一卷藝文志同韋述蕭頴士撰記相門甲族王方慶李義琰崔元暐以下凡十四家唐百氏譜書目五卷國子助教裴揚休撰凡三百五十八姓漢姓三百七蕃姓一百二十五姓源韻譜五卷唐曹大宗采諸書述姓氏郡望以四聲類之又一本云張九齡撰所存止三卷崇文目唐氏譜畧一卷唐書總紀帝系國史志三卷帝系圖一卷聖朝臣僚家譜國史志一卷太宗時韓溥好談唐朝氏族近世之肉譜景祐姓解熙寧姓纂景祐二年邵思撰姓解三卷凡一百七十門二千五百六十八氏以偏旁類次自序云歴代功臣名士布在方冊者次第而書所以恢張世胄其餘疎族異望削之熙寕姓纂六卷熙寧中錢明逸撰用聲韻類次以國姓為首羣史姓纂韻譜六卷建炎中黄邦俊纂録史傳姓氏先儒欲收世族復小宗立譜法吕大臨有宗子議祖謙有宗法紹興姓氏書辨證春秋譜百族譜四年三月乙亥撫州鄧名世以所著春秋四譜六卷辨論譜說十篇古今姓氏書辨證四十卷來上吏部尚書胡松年看詳學有淵源辭亦簡古考訂明切多所按據詔引見殿上二十五日九月六日賜進士出身充史館校勘㑹要一十四卷書目十二卷序曰春秋時善論姓氏者魯有衆仲晉有胥臣鄭有行人子羽皆能探討本源自炎黄而下如指諸掌専取左氏國語為主參以五經子史之文自風俗通以來如姓苑百家譜姓纂凡有所長盡用其說穿鑿訛謬必辨駁之始於國姓餘分四聲終於漢姓蕃姓補遺凡四十卷續書目卷同復以熙寧姓纂皇朝百官公卿家譜參訂書始於政宣而成於紹興之中年名世子椿年裒集次序之其書始備紹興中丁維臯撰百族譜三卷自皇朝司馬氏以下百官族姓皆推源流疏派别志名字爵位録世譜家傳及行狀神道碑之類周必大為序宋朝氏族志鄭樵為氏族志五十七卷又有氏族源氏族韻等書幾七十卷通志有氏族畧論得姓受氏有三十二類此外則有四聲又有複姓四聲以氏族不得其所系之本祿以報功故其世可延位以尊賢故其官當擇陳田互出虢郭俱開束晳改疏傅之宗輔果易晉卿之號千秋去田宗隨㑹别劉氏漢賜秺侯尚采祭天之義魏親程昱用疇捧日之心賜姓名潘岳述家風陸機陳世徳玉海卷五十
