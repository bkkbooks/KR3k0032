body:
  text: 玉海卷一百九十一宋王應麟撰兵捷兵捷露布三唐左翊衛郎將俘車鼻可汗髙宗紀貞觀二十三年十一月乙丑左翊衛郎將傳及通鑑云右驍衛郎將髙侃伐突厥永徽元年六月侃及突厥戰金山敗之九月癸卯俘車鼻可汗以獻傳車鼻突利部人名斛勃世為小可汗薛延陀將殺之乃竄金山之北三垂斗絶惟一靣容車騎勝兵三萬自稱乙注車鼻可汗距長安萬里延陀衰藝益張貞觀二十一年十一月遣子獻方物且請入朝帝遣將軍安調遮郎將韓華迎之車鼻無入朝意華鬬死調遮被殺帝怒二十三年遣侃發回紇僕骨兵擊之大酋長歌邏祿等降永徽元年侃師至阿息山部落不肯戰車鼻從數百騎走侃帥精騎追至金山獲之獻京師髙宗責曰罪當死然先帝獲酋長必宥之乃釋縳數俘社廟見昭陵處其衆鬱督軍山建狼山都督府統之其子羯漫陀降建新黎州使領其衆葛邏祿三族皆內屬突厥盡為封疆臣矣唐左領軍將軍行軍總管破白水蠻紀永徽二年八月己卯白水蠻寇邊左領軍將軍趙孝祖為郎州道行軍總管以伐之十一月戰于羅仵候山敗之三年四月庚寅又敗之按南蠻傳有顯養東魯諸蠻永徽三年與胡叢皆叛以曹繼叔為巂州道行軍總管戰斜山拔十餘城斬首七百獲馬㹈牛萬五千唐伊麗道行軍大總管俘賀魯臨軒受俘紀永徽二年正月乙卯瑶池都督阿史那賀魯叛六年五月癸未程知節為蔥山道行軍大總管以伐賀魯顯慶元年八月辛丑程知節及賀魯戰敗之九月癸未又敗之二年閏正月庚戌以右屯衛將軍蘇定方為伊麗道行軍總管以伐賀魯十二月丁巳蘇定方敗賀魯于金牙山執之三年十一月甲午蘇定方俘賀魯以獻通鑑髙宗顯慶二年蘇定方擊西突厥沙鉢羅可汗至金山北擊處木昆部大破之其俟斤懶獨祿等帥萬餘帳來降定方撫之發其千騎與俱右領軍郎將薛仁貴上言泥孰部素不伏賀魯為賀魯所破虜其妻子今唐兵有破賀魯諸部得泥孰妻子者宜歸之仍加賜賚使彼眀知賀魯為賊而大唐為之父母則人致其死不遺力矣泥孰喜請從軍共擊賀魯定方至曳嘻河西沙鉢羅帥十姓兵十萬來拒戰定方唐兵及回紇萬餘人擊之沙鉢羅輕定方兵少直進圍之定方令步兵據南原攢矟外向自將騎兵陳於北原沙鉢羅大敗追奔三十里斬獲數萬人眀日勒兵復進於是胡祿屋等五弩失畢悉衆來降沙鉢羅獨與處木昆屈律啜數百騎西走時阿史那步真出南道五咄陸部落聞沙鉢羅敗皆詣步真降定方乃命蕭嗣業回紇婆閏將胡兵趨邪羅斯川追沙鉢羅定方與任雅相將新附之衆繼之會大雪平地二尺軍中咸請俟晴而行定方曰虜恃雪深謂我不能進必休息士馬亟追之可及若緩之彼遁逃浸逺不可復追省日兼功在此時矣乃踏雪晝夜兼行所過收其部衆至雙河與阿史那彌射步真兵合去沙鉢羅所居二百里布陳長驅徑至其牙帳沙鉢羅與其徒將獵定方掩其不備縱兵擊之斬獲數萬人得其鼓纛沙鉢羅與其子嘻運壻閻啜等脫走趨石國定方於是息兵諸部各歸其所居通道路置郵驛掩骸骨問疾苦畫疆場復生業凡為沙鉢羅所掠者悉括還之十姓安堵如故乃命蕭嗣業將兵追沙鉢羅定方引軍還沙鉢羅至石國西北蘇咄城人馬飢乏遣人齎珍寶入城市馬城主伊沮逹官詐具酒食出迎誘之入閉門執之送于石國蕭嗣業至石國石國人以沙鉢羅授之蘇定方傳從程知節征賀魯至鷹婆川賀魯率精騎五百馳搗賊衆大潰擢定方伊麗道行軍總管復征賀魯以任雅相回紇婆潤為副出金山北先擊處木昆部云云同通鑑賀魯奔石國為所拘彌射子元爽以兵與嗣業會縳賀魯以還由是修亭障列蹊隧定疆畛問疾苦唐之州縣極四海矣髙宗臨軒定方戎服奉賀魯以獻䇿功行賞賀魯傳本西突厥點密可汗五世孫也始阿史那步真來歸國咄陸可汗以賀魯為葉護代步真居多邏斯川咄陸失國貞觀十六年乙毗射匱可汗以兵迫逐賀魯無常居部多散亡有執舍地三種以賀魯無罪往請可汗可汗怒欲誅之乃與三種內附二十二年四月乙亥太宗優撫之纍擢左驍衛大將軍瑶池都督二十三年二月戊子處其部於庭州莫賀城密招擕散廬幕益衆帝方崩即謀取西廷二州刺史駱弘義以聞永徽二年髙宗令賀魯遣子嘻運入宿衛帝遣還嘻運即勸賀魯引而西取咄陸可汗故地建牙于雙河千泉自號沙鉢羅可汗遂統咄陸弩失畢十姓以嘻運為莫賀啜葉護寇定州敗數縣殺掠數千人去髙宗乃詔梁建方契苾何力為弓月道行軍總管與髙德逸薩孤吳仁等討之然但能破處月永徽四年又以程知節為蔥山道行軍大總管擊之斬獲雖衆亦未得其要領至是乃遣定方為伊麗道行軍大總管率衆窮討定方以精騎至曳嘻河西擊處木昆破之賀魯與十姓兵十萬騎來拒定方以萬人破之俘斬二萬衆乘勝逐北至賀魯牙二百里陳而行抵金牙山縱兵破其牙俘數萬人賀魯跳度伊麗水定方追至碎葉水盡奪其衆賀魯將奔鼠耨設至石國蘇咄城城主伊涅逹干迎之既入拘送石國會蕭嗣業兵至取之乃悉散諸部兵開道置驛收露胔問人疾苦賀魯所掠悉還之西域平髙宗命執賀魯獻昭陵赦弗誅唐沙磚道行軍總管破奚契丹紀顯慶五年五月戊辰定襄都督阿史德樞賔為總管伐契丹十二月壬午及奚契丹戰敗之通鑑四月戊午樞賔及延陀梯真李合珠並為冷岍道行軍總管各將所部討叛奚奚降更以樞賔等出砂磚道討契丹擒其松漠都督阿卜固獻東都薛仁貴傳與辛文陵破契丹于黑山執其王阿卜固獻東都唐左驍衛大將軍安撫大使俘都曼乾陽殿受俘紀顯慶四年十一月癸亥賀魯部悉結闕俟斤都曼冦邊蘇定方為安撫大使以伐之五年正月癸卯俘都曼以獻通鑑顯慶四年思結俟斤都曼帥疏勒朱俱波竭槃陀三國反擊破于闐十一月癸亥以左驍衛大將軍蘇定方為安撫大使以討之蘇定方軍至業葉水思結保馬頭川定方選精兵萬人騎三千匹馳往襲之一日一夜行三百里詰旦至城下都曼敗退保其城及暮諸軍繼至遂圍之都曼懼而出降五年春正月定方獻俘於乾陽殿法司請誅都曼定方請曰臣許以不死故都曼來降願丐其餘生上曰朕屈法以全卿之信乃免之蔥嶺以西遂定唐神丘道行軍大總管蘇定方俘百濟紀顯慶五年三月辛亥右武衛大將軍蘇定方為神丘道行軍大總管新羅王金春秋為嵎夷道行軍總管率三將軍及新羅兵以伐百濟八月庚辰蘇定方及百濟戰敗之十二月戊戌蘇定方俘百濟王以獻通鑑顯慶五年百濟恃髙麗之援數侵新羅新羅王春秋上表求救三月辛亥以左武衛大將軍蘇定方為神丘道行軍大總管帥左驍騎將軍劉伯英等水陸十萬以伐百濟以春秋為嵎夷道行軍總管將新羅之衆與之合藝八月定方引軍自成山濟海百濟據熊津江口以拒之定方進擊破之百濟死者數千人餘皆潰走定方水陸齊進直趨真都城未至二十餘里百濟傾國來戰大破之殺萬餘人追奔入其郭百濟王義慈及太子隆逃北境定方進圍其城義慈次子泰自立為王帥衆固守隆子文思曰王與太子皆死而叔季擁兵自王借使能却唐兵我父子必不全矣遂率左右踰城來降百姓皆從之泰不能止定方命軍士登城立幟泰窘迫開門請命於是義慈隆及諸城主皆降百濟故有五部分統三十七郡二百城七十六萬户詔以其地置熊津等五都督府以其酋長為都督刺史十一月戊戌朔上御則天門樓受百濟俘自其王義慈以下皆釋之蘇定方傳定方為神丘道大總管定方名烈率師討百濟自成山濟海至熊津口賊瀕江屯兵定方出左涯乘山而陳與之戰賊敗死數千王師乘潮而上舳艫銜尾進鼓而譟定方將步騎夾引直趨真都城賊傾國來酣戰破之殺虜萬人乘勝入其郛王義慈及太子隆北走定方進圍其城義慈子泰自立為王率衆固守義慈之孫文思率左右縋城下人多從之泰不能止定方使士登城建唐旗幟於是泰開門請命其將植與義慈降隆及諸城送欵百濟平俘義慈隆泰以獻定方滅三國皆生執其王東夷傳百濟扶餘别種也濵海之陽直京師六千里而贏武德四年其王扶餘璋遣使獻果下馬自是朝貢髙祖册為帶方郡王後五年訟髙麗梗貢道太宗貞觀初遣使平其怨又與新羅世仇數相侵帝賜璽書令忘前怨璋奉表謝然亦兵不止再遣使入朝上優勞之十五年璋死太宗册其子義慈為柱國紹王其國明年與髙麗連和伐新羅取四十餘城又謀取黨項城絶貢道新羅告急帝遣司農丞相里元奬齎詔解諭之聞帝親討髙麗乃間取新羅七城久之又奪十餘城因不朝貢髙宗立乃遣使來帝詔義慈還新羅城永徽六年新羅訴髙麗百濟靺鞨取北境三十城顯慶五年乃詔左衛大將軍蘇定方率將軍劉伯英馮士貴龎孝恭等發新羅兵討之自成山濟海百濟守熊津口定方縱擊敗之王師乘潮帆以進趨真都城虜悉衆拒復破之斬首萬餘級拔其城義慈挾太子隆走北鄙定方圍之次子泰自立為王云云同通鑑定方令士超堞立幟泰開門降遂執義慈隆及小王孝演酋長五十八人送京師一本云十一月定方執義慈等案紀當在十二月必誤平其國五部三十七郡二百城户七十六萬乃析置熊津馬韓東明金漣德安五都督府唐鐵勒道行軍大總管破鐵勒紀龍朔元年十月癸酉鄭仁泰為鐵勒道行軍大總管蕭嗣業為仙蕚道行軍大總管阿史那忠為長岑道行軍大總管以伐鐵勒二年三月庚寅仁泰及鐡勒戰于天山大敗之三年正月仁泰討餘種平之薛仁貴傳九姓衆十餘萬令驍騎數十來戰仁貴發三矢殺三人軍中歌曰將軍三箭定天山將士長歌入漢關會要乾封元年三月鐵勒道行軍大總管右武衛大將軍鄭仁泰左武衛將軍薛仁貴破鐵勒之衆于天山唐熊津道行軍總管破百濟紀龍朔二年七月戊子右威衛將軍孫仁師為熊津道行軍總管伐百濟三年九月戊子仁師及百濟戰于白江敗之通鑑龍朔元年初蘇定方既平百濟留其將劉仁願守百濟府城又以左衛中郎將王文度為熊津都督撫其餘衆文度濟海而卒百濟僧道琛故將福信聚衆據周留城迎故王子豐於倭國而立之引兵圍仁願於府城詔起劉仁軌檢校帶方州刺史將文度之衆便道發新羅兵以救仁願仁軌喜曰天將富貴此翁矣於州司請唐厯及廟諱而行曰吾欲掃平東夷頒大唐正朔于海表仁軌御軍嚴整轉鬬而前所向皆平下百濟立兩柵於熊津江口仁軌與新羅兵合擊破之殺溺死者萬餘人道琛等乃釋府城之圍退保任存城新羅糧盡引還道琛自稱領軍將軍福信自稱霜岑將軍招集徒衆其藝益張仁軌衆少與仁願合軍休息士卒二年秋七月丁巳仁願仁軌大破百濟於熊津之東拔真峴城初仁願仁軌等屯津熊城上與之敕書以平壤軍回一城不可獨固冝拔就新羅若金法敏藉卿留鎮宜且停彼若其不須即宜泛海還也將士咸欲西歸仁軌曰人臣徇公家之利有死無二豈得先念其私主上欲滅髙麗故先誅百濟留兵守之制其心腹雖餘冦充斥而守備甚嚴宜厲兵秣馬擊其不意理無不克既捷之後士卒心安然後分兵據險開張形藝飛表以聞更求益兵朝廷知其有成必命將出師聲援才接凶醜自殱非直不棄成功實亦永清海表今平壤之軍既還熊津又拔則百濟餘燼不日更興髙麗逋冦何時可滅今且以一城之地居敵中央茍或動足即為禽虜縱入新羅亦為羈客脫不如意悔不可追况福信殘虐君臣猜離行相屠戮正宜堅守觀變乘便取之不可動也衆從之時百濟王豐與福信等以仁願等孤城無援遣使謂之曰大使等何時西還當遣相送仁願仁軌知其無備忽出擊之拔其支羅城及尹城太山沙井等柵殺獲甚衆分兵守之仁軌伺其稍懈引新羅兵夜傅城下攀草而上比明入據其城遂通新羅運糧之路仁願乃奏請益兵詔發淄青萊海之兵七千人以赴熊津福信専權與百濟王豐浸相猜忌福信稱疾卧於室欲俟豐問病而殺之豐知之帥親信襲殺福信遣使詣髙麗倭國乞師以拒唐兵三年九月戊午熊津道行軍總管右威衛將軍孫仁師等破百濟餘衆及倭兵于白江拔其周留城初劉仁願劉仁軌既克真峴城詔孫仁師將兵浮海助之百濟王豐南引倭人以拒唐兵仁師與仁願仁軌合軍藝大振諸將以加林城水陸之衝欲先攻之仁軌曰加林險固急攻則傷士緩之則曠日持久周留城虜之巢穴羣凶所聚除惡務本宜先攻之若克周留諸城自下於是仁師仁願與新羅王法敏將陸軍以進仁軌與别將杜爽扶餘隆將水軍及糧船自熊津入白江以會陸軍同趨周留城遇倭兵于白江口四戰皆捷焚其舟四百艘煙熖灼天海水皆赤王豐脫身奔髙麗王子忠勝忠志等帥衆降百濟盡平惟别帥遲受信據任存城不下仁軌使黑齒常之沙吒相如攻任存城拔之遲受信棄妻子奔髙麗詔留劉仁軌將兵鎮百濟召孫仁師劉仁願還百濟兵火之餘比屋雕殘僵尸滿野仁軌始命瘞骸骨籍戶口理村聚置官長通道塗立橋梁補隄堰復陂塘課耕桑賑貧乏養孤老立唐社稷頒正朔及廟諱百濟大悅闔境各安其業金石録有百濟班師碑麟德元年馬大斌撰唐遼東道行臺大總管李績俘髙麗獻俘昭陵檄髙麗含元殿數俘紀乾封元年十二月己酉李績為遼東道行臺大總管率六總管兵以伐髙麗二年八月辛未李績及髙麗戰于新城敗之總章元年二月壬午李績敗髙麗克扶餘南蘇木底蒼城巖城九月癸巳李績敗髙麗王髙藏執之十二月丁巳俘髙藏以獻丁卯郊祭以髙麗平謝成于天己巳謁太廟髙麗傳髙麗扶餘别種其地本周箕子之國漢樂浪玄菟郡貞觀中蓋蘇文弒其君髙建武而立其弟之子藏為王自為莫離支専國帝聞自討之貞觀十九年破髙麗于駐蹕山攻安市城不克班師其詳見駐蹕山假二十一年三月詔牛進逹李績等伐髙麗取石城而還二十二年詔薛萬徹等伐髙麗圍泊灼城斬大酋一破其援兵三萬乃還帝與長孫無忌計曰髙麗困吾師之入不勝敝矣明年以三十萬衆公為大總管一舉可滅也乃詔劒南大治船儲糧械於三山浦烏胡島越州治大艎偶舫以待會帝崩乃罷永徽五年藏以靺鞨兵攻契丹大風矢還激大敗契丹遣使告捷髙宗為露布于朝六年新羅訴髙麗靺鞨奪三十六城有詔程名振蘇定方帥師討之三月乙丑至新城敗髙麗兵而還五月壬午戰于貴端水敗之顯慶三年復遣名振率薛仁貴攻之未能克六月壬子拔赤烽鎮後二年五年十二月壬午天子已平百濟乃以左驍騎大將軍契苾何力右武衛大將軍蘇定方率諸將討之龍朔元年八月甲戌定方破虜于浿江奪馬邑山遂圍平壤明年龎孝恭以嶺南兵壁蛇水蓋蘇文攻之舉軍沒定方解而歸乾封元年蓋蘇文死子男生代為莫離支與弟男建男産相怨男生據國內城遣子獻誠入朝求救蓋蘇文弟亦請割地降六月壬寅乃詔契苾何力為遼東道安撫大使龎同善髙侃為行軍總管左武衛大將薛仁貴左監門將軍李謹行殿而行九月同善破髙麗兵男生帥師來會十月詔以李績為遼東道行軍大總管兼安撫大使與何力同善并力詔獨孤卿雲由鴨緑道郭待封積利道劉仁願畢列道金待問海谷道並為行軍總管受績節度明年正月績次新城合諸將謀曰新城賊西鄙不先圖餘城未易下遂壁西南山臨城城人縳戎酋出降績進拔城十有六郭待封以舟師濟海南趨平壤三年乾封三年即總章元年二月績率仁貴拔扶餘城它城三十皆納欵同善侃守新城男建遣兵襲之仁貴救侃戰金山不勝髙麗鼓而進鋭甚仁貴橫擊大破之斬首五萬級拔南蘇木底蒼巖三城引兵略地與績會侍御史賈言忠計事還帝問軍中云何對曰必克昔先帝問罪所以不得志者虜未有釁也今男生兄弟鬩很為我鄉道虜之情偽我盡知之將忠士力臣故曰必克且髙麗祕記曰不及九百年當有八十大將滅之髙氏自漢有國今九百年績年八十矣虜仍荐飢地震裂狼狐入城蚡穴於門人心危駭是行不再舉矣男建以兵五萬襲扶餘績破之薩賀水上斬首五千級俘口三萬器械牛馬稱之進拔大行城契苾何力會績軍鴨緑拔辱夷城悉師圍平壤九月藏遣男産率首領百人降且請入朝男建猶固守出戰數北大將浮屠信誠遣諜約內應門啓兵譟而入男建自刺執藏男建等收凡五部百七十六城户六十九萬詔績獻俘昭陵十二月丁巳帝御含章殿引見績等數俘于庭赦藏為司平太常伯男産司宰少卿投男建黔州剖其地為都督府者九州二十四縣百復置安東都護府咸亨元年四月其酋鉗牟岑反立安舜為王庚午詔髙侃為東州道李謹行燕山道行軍總管討之二年七月乙未朔侃破之安市城三年十二月又敗之泉山俘新羅援兵二千四年閏五月謹行破之於發盧河俘馘萬計凡四年乃平薛仁貴傳乾封初髙麗泉男生內附遣將軍龎同善髙侃往慰納弟男建率國人拒弗納乃詔仁貴率師援送同善至新城夜為虜襲仁貴擊之斬數百級同善進次金山衄虜虜不敢前髙麗乘勝進仁貴擊之凡數百級衆即潰斬馘五千拔南蘇木底蒼巖三城遂會男生軍仁貴負鋭提卒二千進攻扶餘城諸將以兵寡勸止仁貴曰在善用不在衆殺賊萬餘人拔其城與李績軍合扶餘既降它四十城相連送欵威震遼海有詔仁貴率兵二萬與仁軌鎮平壤拜安東都護移治新城撫孤制盜隨才任職髙麗士衆皆欣然忘亡元萬頃傳從李績征髙麗管書記使萬頃草檄責髙麗契苾何力傳率兵五十萬先趨平壤績繼進攻凡一月拔之虜其王以獻唐姚州道行軍總管平姚州蠻紀咸亨三年正月辛五姚州蠻寇邊太子右衛副率梁積壽為姚州道行軍總管以伐之傳姚州境有永昌蠻咸亨三年叛髙宗以梁積壽為總管討平之中宗紀景龍元年六月戊子吐蕃及姚州蠻寇邊姚巂道討擊使唐九徴敗之會要神功元年閏十月蜀州刺史張柬之上表曰姚州古哀牢國光武季年始請內屬諸葛破南中使渠帥統之不置漢官不留鎮守龍朔中武陵簿石子仁奏置姚州麟德元年五月八日置其後將軍李義總往征郎將劉惠戰死州遂廢垂拱四年王善寶又請置州延載中司馬成琛更置瀘南七鎮戍以蜀兵自是蜀中騷擾乞罷姚州隸巂府不納駱賔王集姚州道破諾波弄楊虔露布浮竹遺嗣沉木餘苖地接冉駹詞屢殫於喻蜀俗通槃瓠聲不輟於吠堯又破設蒙儉露布竹浮三節肇興外域之源木化九隆頗為中國之患三年疲衆徒聞定莋之譏五月出師未息渡瀘之役鄭純之化不追孟獲之風逾扇黃龍之約白馬之盟唐雞林道行軍大總管敗新羅紀上元元年二月壬午劉仁軌為雞林道行軍大總管以伐新羅二年二月戰于七重城敗之通鑑上元元年春正月紀二月壬午以左庶子同中書門下三品劉仁軌為雞林道大總管衛尉卿李弼右領軍大將軍李謹行副之發兵討新羅時新羅王法敏既納髙麗叛衆又據百濟故地使人守之上大怒詔削法敏官爵其弟右驍衛員外大將軍臨海郡公仁問在京師立以為新羅王使歸國二年二月劉仁軌大敗新羅之衆於七重城又使靺鞨浮海略新羅之南境斬獲甚衆仁軌引兵還詔以李謹行為安東鎮撫大使屯新羅之買肖城以經略之三戰皆捷新羅乃遣使入貢且謝罪上赦之復新羅王法敏官爵金仁問中道而還改封臨海郡公新羅傳新羅辨韓苖裔也武德四年王真平遣使入貢後三年拜枉國封樂浪郡王貞觀五年獻雅樂更數世並襲封為王龍朔元年以其國為雞林州大都督府授其王法敏都督咸亨五年納髙麗叛衆略百濟地守之帝怒云云同上劉仁軌傳咸亨五年即上元元年東伐新羅率兵絶瓠蘆河攻大鎮七重城破之唐吏部侍郎裴行儉執都支碎葉城刻石紀功紀調露元年六月辛亥吏部侍郎裴行儉伐西突厥九月壬午裴行儉敗西突厥執其可汗都支十一月癸未帝親勞宴曰行儉提孤軍深入萬里兵不血刃叛黨禽夷可謂文武兼備矣傳咸亨二年阿史那步真死以西部突部酋阿史那都支為左驍衛大將軍兼匐延都督以安輯其衆四月甲申儀鳯二年乃自號十姓可汗及李遮匐誘蕃落以動安西與吐蕃連和朝廷欲討之行儉曰吐蕃叛渙方熾安可更生事西方今波斯王死其子泥涅師質京有如遣使立之即路出蕃若權以制事可不勞而功也帝因詔行儉册送波斯王且為安撫大食使至西州諸蕃郊迎行儉召豪傑千餘自隨揚言大熱未可以進宜駐軍須秋都支覘知之不設備行儉徐召四鎮酋長偽畋遊謂曰吾念此樂未始忘孰能從吾獵者於是子弟願從者萬人乃隂勒部伍數日倍道而進去都支帳十餘里先遣其所親問安否若外間暇非討襲者又使人趣召都支都支本與遮匐計及秋拒使者已而聞軍至倉卒不知所出率子弟五百餘人詣營謁遂禽之是日傳契箭召諸部渠長悉來請命並執送碎葉城簡精騎約齎襲遮匐道獲其使者釋之俾諭其主遮匐乃降悉俘至京師將吏為刻石碎葉城以紀功王方翼築碎葉城唐定襄道行軍大總管裴行儉破泥孰可汗平突厥通鑑髙宗調露元年冬十月單于大都護府突厥阿史德溫傅奉職二部俱反立阿史那泥孰匐為可汗單于管二十四州酋長應之衆數十萬遣鴻臚卿單于大都護府長史蕭嗣業左領軍衛將軍苑大智左千牛衛將軍李景嘉等將兵討之嗣業等先戰屢捷因不設備會大雪突厥夜襲其營嗣業狼狽拔營走衆遂大亂為虜所敗死者不可勝數十一月癸未上宴裴行儉謂之曰卿有文武兼資今授卿二職乃除禮部尚書兼檢校右衛大將軍甲辰以行儉為定襄道行軍大總管將兵十八萬合西軍檢校豐州都督程務挺東軍幽州都督李文暕總三十餘萬以討突厥並受行儉節度永隆元年三月裴行儉大破突厥于黑山禽其酋長奉職可汗泥孰匐為其下所殺以其首來降奉職既就禽餘黨走保狼山詔戶部尚書崔知悌馳傳詣定襄宣慰將士且區處餘冦行儉引軍還紀調露元年十一月甲辰禮部尚書裴行儉為定襄道行軍大總管以伐突厥永隆元年三月戰于黑山敗之開耀元年正月寇原慶二州癸巳裴行儉為定襄道大總管以伐突厥閏七月庚申敗之九月壬戌裴行儉俘突厥溫傅可汗阿史那伏念以獻乙丑改元突厥傳行儉既破虜於黑山其下斬泥孰匐以首降禽溫傅奉職以還餘衆保狼山永隆中溫傅又迎頡利族子伏念于夏州渡河立為可汗諸部響應明年遂寇原慶二州復詔行儉總諸軍以曹懷舜李文暕副之壁代州之陘口縱反間説伏念令與溫傅相二因遣兵擊伏念敗之伏念與懷舜遇戰一日為伏念所敗伏念益北留輜重妻子保金牙山會行儉縱單于鎮兵躡之伏念意王師不能逺不設備及兵至惶駭不得戰遂遣使間道詣行儉且請縛溫傅自效行儉祕不布密以聞後數日煙塵漲天而南溫傅來降行儉虜送京師斬東市於是突厥餘黨悉平帝悅遣户部尚書崔知悌勞軍唐河源軍經略大使敗吐蕃紀髙宗永隆元年七月己卯吐蕃寇河源辛巳左武衛將軍黑齒常之為經略大使開耀元年五月己丑及吐蕃戰于良非川敗之黑齒常之傳贊婆等入寇屯良非川常之為河源軍副使引精騎三千夜襲其軍斬二千級獲羊馬數萬拜經略大使建言河源當賊衝增兵鎮守乃斥地置烽七十所墾田五千頃食衍士精永隆二年贊婆營青海常之掩破之燒糧廥獲羊馬甲首不資吐蕃傳贊婆復入良非川常之擊走之武后紀長壽元年十月丙戌武威道行軍總管王孝傑敗吐蕃克四鎮久視元年閏七月丁酉吐蕃寇涼州隴右諸軍副大使唐休璟敗之于洪源谷吐蕃傳長壽元年武威總管王孝傑率西州都督唐休璟左武衛大將軍阿史那忠節擊吐蕃大破其衆復取四鎮更置安西都護於龜兹以兵鎮守唐休璟請復四鎮遂命王孝傑擊吐蕃勒會要十一月一日復四鎮龜兹于闐疏碎葉唐休璟傳久視元年秋吐蕃大將麴莽布支率騎數萬寇涼州入洪源谷休璟以兵數千臨髙望之被甲先登六戰皆克斬二將獲首二千五百築京觀而還吐蕃來請和休璟儒而知兵自碣石踰四鎮山川夷阻障塞之要皆能言行師未嘗敗證聖元年欽陵贊婆攻臨洮王孝傑戰素羅汗山虜敗還又攻涼州殺都督贊婆死遣左肅政臺御史大夫魏元忠為隴右諸軍大總管率大使唐休璟出討方虜攻涼州休璟擊之斬二千級於是論彌薩來朝請和明年獻馬黃金求昏唐瓜州長史薛仁貴破突厥通鑑永淳元年突厥餘黨骨篤祿元珍等據黑沙城寇并州及單于府北境薛仁貴擊元珍于雲州大破之薛仁貴傳為瓜州長史右領軍衛將軍檢校代州都督率兵擊突厥元珍於雲州突厥問曰唐將為誰曰薛仁貴突厥曰吾聞薛將軍流象州死矣安得復生仁貴免胄見之突厥皆相視失色下馬羅拜稍稍遁去仁貴因進擊大破之斬首萬級獲生口三萬牛羊稱是唐安西副都護敗突厥紀永淳元年二月突厥車薄十姓咽麵三姓寇邊四月辛未裴行儉為金牙道行軍大總管率三總管兵以伐突厥安西副都護王方翼及車薄咽麵戰於熱海敗之傳車薄啜圍弓月城方翼戰伊麗河敗之咽麵兵十萬踵至方翼次熱海遣騎分道襲之禽首領突騎施等三百人初葛水暴漲沈祭以禱即涉而濟葉河無舟而冰一夕合時以為祥西域平弘道元年二月庚午突厥冦定州刺史霍王元軌令開城門偃旗幟虜疑不敢入敗之垂拱三年八月冦朔州燕然道行軍大總管黑齒常之敗之唐朔方道行軍大總管破突厥通鑑景龍元年五月戊戌右屯衛大將軍張仁願為朔方道行軍大總管備突厥十月丁丑命擊之引兵夜掩其營破之明年二月丙辰築三受降城唐磧西節度使執西突厥紀開元二年三月己亥磧西節度使阿史那獻執西突厥都簷六月丁邜獻于闕下傳長安中獻為北庭大都護擢節度使十姓部落都簷叛獻擊斬之傳首闕下取碎葉以西帳落三萬內屬一云五萬餘帳璽書嘉慰壺漿塞陌襁負而來唐北庭都護敗突厥紀開元二年二月突厥寇北庭都護郭虔瓘敗之閏月癸未阿失畢降十月十姓胡祿屋等降三年二月帝置酒勞虔瓘郭虔瓘傳開元初遷右驍衛將軍兼都護金山道副大總管明年二年二月乙未默啜子同俄特勒圍北庭虔瓘飭壘自守同俄單騎馳城下勇士狙道左突斬之虜亡酋長丐降二年四月戊午賞功封虔瓘太原郡公食二千户郭知運介休縣公一千户摧日逐之遺種斬天驕之愛息唐左羽林將軍隴右防禦大使破吐蕃紀開元二年八月乙亥吐蕃寇邊薛訥攝左羽林軍將軍為隴右防禦大使右驍衛將軍郭知運為副以伐之十二月甲子薛訥及吐蕃戰于武階敗之吐蕃傳本西羌屬居析支水西祖曰鶻提勃悉野健武多智後其子孫曰吐蕃而姓勃窣野或曰南涼秃髮利鹿孤之後直京師八千里其國多雷霆積雪自棄宗弄贊貞觀八年始遣使來朝太宗下書臨撫乃遣使求昏帝不許遂勒兵二十萬入寇乃詔吏部尚書侯君集為行軍大總管及執失思力牛進逹劉蘭並為行軍總管率步騎五萬進逹自松州夜鏖其營斬首千級弄贊懼引而去以使者來謝罪固請昏十五年妻以宗女文成公主褫氊罽襲紈綃為華風遣子弟入國學習詩書帝伐遼還冶黃金為鵝以獻髙宗擢駙馬都尉進封西海郡王賜餉蕃渥永徽初弄贊死立孫幼不事故祿東贊相其國顯慶三年復請昏未幾擊吐谷渾破其國東贊死兄弟並當國自是歲入邊盡破有諸羌羈縻十二州咸亨元年復入殘羈縻十八州於是安西四鎮並廢詔以大將軍薛仁貴等進討初劒南度茂州之西築安戎城以迮其鄙俄為生羌導取之以守因并西洱河諸蠻盡臣羊同黨項諸羌其地東與松茂巂接南極婆羅門西取四鎮北抵突厥幅員萬餘里漢魏諸戎所無也幾三十年為邊患皆其臣欽陵贊婆二人所為其王棄弩悉弄以其専欲誅之欽陵自殺贊婆以所部欵塞贊普自將兵萬騎攻悉州都督陳大慈四戰皆克長安二年十月戊申明年乃獻馬黃金求昏而虜南屬帳皆叛會贊普死棄隸蹜贊立中宗以雍王守禮女為金城公主妻之詔左衛大將軍楊矩持節送之景龍元年四月吐蕃隂銜怒厚餉矩請河西九曲為公主湯沐矩表與之九曲者水甘草良宜畜牧自是虜益張雄開元二年八月乙亥其相坌逹延將兵十萬寇臨洮入攻蘭渭掠監馬詔薛訥為隴右防禦使與王晙等并力擊之晙等戰武階斬首萬七千級獲馬羊二十萬又戰長子豐安軍使王海濵戰死乘之虜大敗衆奔突不能去相枕藉死洮水為之不流薛訥傳又王晙傳吐蕃大酋坌逹延乞力徐等衆十萬寇臨洮次大來谷坌逹延以兵踵而前晙率所部二千與臨洮軍合料竒兵七百易胡服夜襲去賊五里士大呼鼓角應之賊驚疑自鬬死者萬計訥至武階距大來谷二十里晙迎訥郭知運與訥晙相犄角夜使壯士銜枚鏖突虜駭去追至洮水敗之俘獲如積又戰長城堡殺鹵數萬禽其酋六鄉彌洪命紫微舍人倪若水即軍陟功狀先是十月丙辰下詔欲親征甲子戰武階驛大克乙丑罷親征唐松州都督破吐蕃紀開元四年二月辛酉吐蕃寇松州癸酉都督孫仁獻及吐蕃戰敗之七月丁丑請和唐大武軍子將斬默啜紀開元四年六月癸酉大武軍子將郝靈佺殺突厥默啜突厥傳骨啜祿死默啜自立為可汗篡位數年始攻靈州多殺略士民武后以薛懷義發十八將軍擊之延載元年三月不見虜還會契丹李盡忠反默啜請擊賊自效詔册拜遷善可汗又册立功報國可汗通鑑元年十月遣使求六州降戶并粟農器鐵等神功元年后不許默啜怨為慢言執使者田歸道乃歸粟器降人數千帳由是突厥遂強負勝輕中國有驕志大振兵與頡利時略等中宗詔張仁亶為朔方總管明年築三受降城於河外障絶寇路初景雲中默啜西滅婆葛遂役屬契丹奚因虐用其下既年老愈昏暴部落怨叛玄宗時開元二年四月壬子十姓請降葛邏祿等亦率衆內附虜勢浸削會默啜討九姓拔野古戰獨樂河拔野古大敗默啜歸不為備道大林中拔曳固野古殘衆突出擊斬之乃與入蕃使郝靈佺傳首京師唐冠軍大將軍隴右諸軍節度大使鄯州都督兼隴右經略使敗吐蕃獻獲紀開元五年七月壬寅郭知運及吐蕃戰敗之郭知運傳突厥降户叛執單于都護張知運詔以朔方兵追擊至黑山呼延谷敗之取副都護還詔兼經略使營栁城開元五年大破吐蕃獻俘京師六年正月甲子獻俘明年復出將輕兵丙夜至九曲獲精甲名馬犛牛甚衆既獻獲詔分賜文武五品以上及朝集使紀開元二十八年三月壬子益州司馬章仇兼瓊敗吐蕃克安戎城五月癸卯寇城又敗之詔改城曰平戎唐朔方軍節度大使執蘭池胡紀開元九年八月蘭池胡康願子寇邊是年四月庚寅康待賔寇邊七月己酉王晙執之己丑進封十年四月己亥張説持節朔方軍節度大使閏月壬申張説巡邊九月張説敗康願子于木盤山執之張説傳王晙討蘭池叛胡康待賔詔説經略時黨項羌亦攻銀城説擊破之羌胡相猜待賔遁入鐵建山餘衆奔潰明年為朔方大使時慶州方渠降胡康願子反自為可汗掠牧馬西陟河出塞説進討至木槃山禽之俘獲三千唐北庭節度使破吐蕃紀開元十年九月癸未吐蕃攻小勃律北庭節度使張孝嵩敗之吐蕃傳十年攻小勃律國其王沒謹忙詒書孝嵩曰勃律唐西門失之則西方諸國皆墮吐蕃都護圖之孝嵩遣疏勒副使張思禮以步騎四千晝夜馳與謹忙兵夾擊吐蕃死者數萬多取鎧仗馬羊復九城故地始勃律王來朝父事帝還國置綏逺軍以扞吐蕃故歲常戰吐蕃每曰我非利若國我假道攻四鎮爾及是纍歲不出兵於是隴右節度使王君㲋請深入取償十二年破吐蕃獻俘其後吐蕃西擊勃律帝諭令罷兵不聽卒殘其國唐朔方軍節度大使兵部尚書信安王禕破突厥實録開元十年十一月丙申禕凱旋引將士見帝置酒享之敕曰窮寇覆巢而奔北羣師掉鞅而來歸又册府元龜唐河西隴右節度使破吐蕃紀開元十五年正月辛丑河西隴右節度使王君㲋及吐蕃戰于青海敗之四月丙午君㲋凱旋詔置食朝堂宴之及將士並賜物一云置酒內殿王君㲋傳為節度判涼州都督事十四年悉諾邏寇大斗拔谷遂攻甘州君㲋勒兵避不戰會大雪吐蕃趨西道歸豫遣諜出塞燒野草皆盡悉諾邏頓大非川無所牧馬死過半間其怠率秦州都督張景順約齎窮躡出青海西乘氷渡襲破之虜留輜重疲弱俘以旋凱旋玄宗宴君㲋及妻夏於廣逹樓賜金帛蹈赤山焚罽幕獵青海驅犛牛唐河西節度使判涼州事破吐蕃露布紀開元十五年九月吐蕃寇瓜州執刺史田元獻閏月回紇襲甘州王君㲋死之十六年七月吐蕃寇瓜州刺史張守圭敗之乙巳隴右節度使張志亮河西節度使蕭嵩克吐蕃大莫門城通鑑云破吐蕃於渴波谷八月辛卯及吐蕃戰于祁連城敗之蕭嵩傳吐蕃大將悉諾邏恭祿及燭龍莽布支陷瓜州回紇又殺涼州守將王君㲋河隴大震帝擇堪任邊者十五年十月辛巳徙嵩河西節度使判涼州事嵩以建康軍使張守圭為瓜州刺史及裴寬郭虛已牛仙客置幕府立埤塢保邊人於是悉諾邏恭祿威憺諸部吐蕃倚其健噬邊嵩乃縱反間贊普誅之使悉末明攻瓜州守圭拒甚力虜引郤會鄯州都督張志亮破賊青海西破大莫門城焚橐它橋嵩又遣副將杜賔客隴右節度使率強弩四千戰祁連城下自晨鬬迄晡斬一將吐蕃傳云斬副將一上級五千首虜哭震山谷露布至帝大悅又明年十七年三月戊戌守圭率伊沙等州兵破虜大同軍唐巂州都督克雲南紀開元十七年二月丁卯巂州都督張審素克雲南昆明城鹽城傳玄宗詔特進何履光以兵定南詔境取安寧城及五鹽井復立馬援銅柱天寶八載十月履光率十道兵伐雲南唐隴右節度副大使信安王褘克石堡吐蕃傳開元中十八年三月甲寅信安王褘出隴西拔石堡城即置振武軍獻俘於廟四月其後吐蕃請和不許乃悉衆四十萬攻承風堡又襲攻振武軍蓋嘉運不能守天寶四載八月隴右節度皇甫惟明戰石堡不克又明年惟明破虜獻俘京師帝以哥舒翰節度隴右八載詔翰以朔方河東郡兵十萬攻石堡城數日未克翰怒捽其將髙秀巖張守瑜將斬之秀巖請三日期如期而下更號神武軍又擒其相兀論樣郭遂以赤領為西塞開屯田備軍實紀天寶八載六月乙卯隴右節度使哥舒翰及吐蕃戰石堡城敗之閏六月乙丑以為神武軍實録哥舒翰收石堡獻功帝御丹鳯樓會羣臣下制褒奬唐河北河東道行軍元帥禽奚契丹紀開元十八年五月乙酉奚契丹附于突厥六月丙子忠王浚肅宗為河北道行軍元帥九月丁巳忠王浚兼河東道諸軍元帥二十年正月信安王褘為河東河北道行軍副元帥以伐奚契丹三月己巳信安王褘及奚契丹戰于薊州敗之五月戊申忠王浚俘奚契丹以獻通鑑開元十八年初契丹王李邵固遣可突干入貢同平章事李元紘不禮焉左丞相張説謂人曰奚契丹必叛可突干狡而很専其國政久矣人心附之今失其心必不來矣五月乙酉可汗干弒劭固帥其國人并脅奚衆叛降突厥奚王李魯蘇及其妻常氏劭固妻陳氏皆來奔制幽州長史趙含章討之又命中書舍人裴寬給事中薛侃等於關內河東河南北分道募勇士六月丙子以單于大都護忠王浚領河北道行軍元帥以御史李朝隱京兆尹裴胄先副之帥十八總管以討奚契丹命浚與百官相見于光順門張説退謂學士孫逖韋述曰吾嘗觀太宗畫像雅類忠王此社稷之福也可突干寇平盧先鋒使張掖烏承玭破之於捺祿山秋九月丁巳以忠王浚兼河東道元帥然竟不行二十年春正月乙卯以朔方節度副大使信安王禕為河東河北行軍大總管將兵擊奚契丹壬申以户部侍郎裴耀卿為副總管三月信安王禕帥裴耀卿及幽州節度使趙含章分道擊奚契丹含章與虜遇虜望風遁去平盧先鋒將烏承玭言于含章曰二虜劇賊也前日遁去非畏我乃誘我也宜按兵以觀其變含章不從與虜戰于白山果大敗承玭别引兵出其右擊虜破之己巳禕等大破奚契丹俘斬甚衆可突干帥麾下逺遁餘黨潛竄山谷奚首李詩瑣髙帥五千餘帳來降禕引兵還賜李詩爵歸義王歸義州都督徙部落置幽州境內肅宗紀開元十八年奚契丹寇邊乃以帝為河北道行軍元帥遣御史大夫李朝隱等八總管兵十萬伐之居二歲朝隱等敗契丹于范陽北信安王傳率裴耀卿諸將分道出范陽北擊二蕃破之禽酋長以還餘部竄伏契丹傳本東胡種其先為胸奴所破保鮮卑山至元魏自號曰契丹其君大賀氏開元二年王失活率部落來歸玄宗賜丹書鐵劵後三年失活死弟娑固襲封玄宗置松漠府以失活為都督松漠郡王有可突干者勇悍得衆娑欲去之反為所攻娑固死可突干遣使者謝罪詔赦之乃奉邵固統衆詔許襲王明年可突干來朝不為宰相李元紘所禮鞅鞅去後三年遂殺邵固立屈烈為王脅奚衆共降突厥詔拜忠王浚河北道行軍元帥云云可突干走奚衆降王以二蕃俘級告諸廟王不行唐幽州長史河北節度副大使俘契丹紀開元二十二年六月壬辰幽州節度使張守圭俘契丹以獻十二月乙巳守圭及契丹戰敗之殺其王屈烈詔自今戰有功必告廟傳開元三年契丹娑固襲封松漠郡王有可突干者反攻娑固奉娑固弟鬱于為君遣使謝罪詔拜鬱于為王而赦可突干擢左羽林衛將軍鬱于死弟吐于嗣與可突干有隙攜公主來奔可突干奉邵固統衆詔許襲王從封禪徙王廣化郡以宗室出女為東華公主妻邵固後三年可突干殺邵固立屈烈為王脅奚衆共降突厥公主走平盧軍拜忠王浚河北道元帥信安郡王禕副元帥與范陽節度趙含章擊之大破之明年二十一年閏三月癸酉可突干盜邊幽王長史薛楚玉等不能制烏知義羅守忠敗郭英傑吳克勤死之帝擢張守圭為幽州長史河北節度副大使每戰輒勝虜遂大敗帝喜詔有司告九廟屈刺及突干恐懼乃詐降守圭得其情遣左衛騎曹王悔詣部計事屈刺即屈烈也無降意徙帳稍西北密引突厥衆將殺悔其衙官李過折與可突干爭權不叶悔因間誘之夜斬屈刺及可突干盡滅其黨以衆降守圭次紫蒙川大閲軍實賞將士傳屈刺突干首於東都拜過折北平郡王為松漠都督册府元龜開元二十年三月信安王禕及幽州長司趙含章大破叛奚及契丹于幽州之北敕曰干旄所指不戰而潰山谷遺類盡為俘馘疾如震霆動若神助宜擇日告享陵廟張九齡作開元紀功德頌曰出幽陵兮􅞂九夷簸赤山兮蕩滄海唐磧西節度使執突騎施太廟獻俘紀開元二十三年十月戊申突騎施寇邊二十四年正月丙午北庭都護蓋嘉運敗之八月甲寅請和二十七年八月乙亥磧西節度使蓋嘉運敗突騎施于賀邏嶺執其可汗吐火仙傳嘉運俘吐火仙骨啜獻太廟突厥傳突騎施别種蘇祿自為可汗雄西域開元五年來朝然詭猾不純臣于唐天子羈係之進號忠順可汗陰結吐蕃掠四鎮圍安西城俄而大首領莫賀逹于都摩支殺蘇祿通典二十六年都摩支立蘇祿子吐火仙骨啜為可汗居碎葉城共擊逹干帝使磧西節度使蓋嘉運和撫西方諸國逹干與嘉運率石王史王共擊蘇祿子破之碎葉城吐火仙棄旗走禽之斬黑姓可汗與弟撥斯入曵建城諸國皆降諸部上書謝願以部落附安西永為外臣許之以阿史那懷道子昕為十姓可汗逹干怒誘諸落叛詔嘉運招諭乃率纛官首領降遂命統其衆通典開元二十七年安西都護蓋嘉運率將士詣闕獻俘上御花蕚樓宴之以吐火仙獻太廟唐河西節度副大使敗吐蕃紀開元二十五年三月辛卯河西節度副大使崔希逸及吐蕃戰于青海敗之二十六年三月癸巳寇河西希逸敗之鄯州都督杜希望克其新城二十七年八月壬午寇邊河西隴右節度使蕭景敗之天寶元年十二月戊戌隴右節度使皇甫惟明及吐蕃戰于青海敗之庚子河西節度使王倕克吐蕃漁海遊奕軍二年四月己卯皇甫惟明克吐蕃洪濟城傳蕭景河西留後杜希望隴右留後分道經略碎赤嶺碑希望發鄯州兵奪虜河橋並河築鹽泉城號鎮西軍破吐蕃兵三萬天寶元年惟明破虜大嶺軍戰青海破莽布支斬三萬級孫逖賀云合戰之時反風破敵決勝之後卿雲靄空唐四鎮節度使克逹奚諸部傳夫蒙靈察為四鎮節度會逹奚諸部叛自黑山西趨碎葉有詔邀擊靈察使都知兵馬使髙仙芝以二千騎追躡逹奚行逺人馬疲禽馘略盡封常清於幕下潛作捷布具記井泉次舍克賊形勢謀略唐朔方節度使靈州都督王忠嗣破米施可汗大同靜邊城平戎十八䇿王忠嗣傳開元二十九年節度朔方兼靈州都督天寶元年十二月庚子北討奚怒皆戰紫乾河三遇三克耀武漠北髙會而還時突厥新有難忠嗣進軍磧口經略之烏蘇米施可汗請降忠嗣以其方強特文降爾乃營木剌蘭山諜虛實因上平戎十八䇿縱反間於拔悉蜜與葛邏祿回紇三部攻多羅斯城涉昆水斬米施可汗三載八月丙午築大同靜邊二城徙清塞橫野軍實之併受降振武為一城自是虜不敢盜塞突厥傳天寶初突厥大部回紇葛邏祿拔悉蜜並起殺葉護國人奉判闕特勒子為烏蘇米施可汗帝使使者諭令內附烏蘇不聼其下不與拔悉蜜等三部共攻烏蘇米施三載八月丙午拔悉蜜等殺米施傳首京師獻太廟其弟白眉可汗立於是突厥大亂國人推拔悉蜜酋為可汗詔朔方節度王忠嗣以兵乘其亂抵薩河內山擊其左阿波逹干十一部破之四載正月丙戌獨其右未下而回紇葛邏祿殺拔悉蜜可汗奉回紇骨力裴羅為骨咄祿毗伽闕可汗明年殺白眉可汗傳首以獻毗伽可汗妻骨咄祿婆匐可敦亦率衆自歸天子御花蕚樓宴羣臣賦詩美其事突厥遂滅通鑑天寶元年八月丁亥突厥西葉護千餘帳來降九月辛亥上御花蕚樓宴突厥降者賞賜甚厚以狄攻狄寧勞六月之師有征無戰豈待三年之克唐安西副都護平小勃律國紀天寶六載安西副都護髙仙芝及小勃律國戰敗之髙仙芝傳開元末為安西副都護小勃律其王為吐蕃所誘妻以女故西北二十餘國皆羈屬吐蕃自田仁琬以來三討之皆無功天寶六載詔仙芝以步騎一萬出討仙芝自安西過撥换城入握瑟德經疏敕登蔥嶺涉播密川遂頓特勒滿川行凡百日特勒滿川即五識匿國也仙芝分軍為三使疏勒趙崇玭自北谷道撥換賈宗瓘自赤佛道仙芝與監軍邊令誠自護蜜俱入約會連雲堡涉婆勒川遂登山挑戰日未中破之拔其城斬五千級生禽千人馬千餘匹衣資器甲數萬計仙芝欲遂深入遂引師過坦駒嶺下娑夷河弱水也既行三日越胡來迎明日至阿弩越城遣將軍席元慶以精騎一千先往謂小勃律王曰不窺若城吾假道趨大勃律耳城中大酋領皆吐蕃腹心仙芝密令元慶賜以繒綵至皆縳以待仙芝至悉斬之王蘇失利之及妻逃山穴仙芝招諭乃出降因平其國急遣元慶斷娑夷橋其暮吐蕃至不克渡八月仙芝以小勃律王及妻自赤佛道還連雲堡與令誠俱班師於是拂􅀢大食諸胡七十二國皆震懾降附詔改其國號歸仁置歸仁軍募千人鎮之帝赦蘇失利之不誅西域傳小勃律去京師九千里王居孽多城臨娑夷水開元初王沒謹忙來朝玄宗以兒子蓄之以其地為綏逺軍吐蕃奪其九城求救北庭節度使張孝嵩遣疏勒副使張思禮率鋭兵四千倍道往大破吐蕃復九城詔册為小勃律王唐安西四鎮節度使執突騎施石國王開遠門獻俘紀天寶十載正月戊申髙仙芝執突騎施可汗及石國王傳仙芝劾石國王無蕃臣禮九載請討之王約降仙芝遣使者護送至開逺門俘以獻斬闕下實録帝御勤政樓會羣臣引見石或曰柘支曰柘析漢大宛北鄙也武德貞觀間數獻方物顯慶三年以瞰羯城為大宛都督府授其王都督開元初封石國王二十八年又册順義王天寶初封王子那俱車鼻施為懷化王賜鐵劵玉海卷一百九十一
