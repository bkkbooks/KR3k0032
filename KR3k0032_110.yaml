器也命易以木弦之其聲清雅樂家謂之阮咸通典阮咸亦秦琵琶也而項長過於今制列十有三柱武后時蜀人蒯明得之晉竹林七賢圖阮咸所彈與此類同因謂之阮咸樂志絲為阮咸樂書云本名月琴自開元元年編入雅樂阮咸以善彈琵琶妙解音律稱崇文書目阮咸調弄二卷金羽調一卷譜二十卷曲譜一卷志琵琶圓體修頸而小號曰秦漢子蓋絃鼗之遺製出於胡中傳為秦漢所作漢中王瑀傳聞康崑崙奏琵琶曰琵聲多琶聲少是未可彈五十四絲大絃也樂家以自下逆鼓曰琵自上順鼓曰琶云宋志傅玄琵琶賦曰漢遣烏孫公主使工人裁箏築為馬上之樂中虛外實天地象也盤圓柄直陰陽敘也柱十有二配律吕也四絃法四時也從方俗語名琵琶風俗通云以手琵琶因以為名杜摰云長城之役弦鼗而鼓之未詳孰實其器不列四廂成公綏賦盤圖合靈太極形也三材判合兩儀生也分柱列位歲數成也文選注引孫該琵琶賦虞世南有琵琶賦至道九絃琴五弦阮譜十二律旋相宫圖太宗謂舜作五絃琴後王加文武二弦乃作九弦琴五弦阮至道之元年十月十二日乙酉上以新增九弦琴五弦阮宣示近臣曰古樂之用與鄭衛不同朕內治心術外觀時政求古人之意有未盡者增琴為九弦曰君臣文武禮樂正民心為五弦阮曰金木水火土别造新譜凡三十七卷琴譜二十卷阮譜十七卷祥符五年八月丁巳陳彭年表上請付中書門下詳校俾太常樂工肄習之以備登薦因令待詔朱文濟蔡裔賫琴阮詣中書彈上製鳳歸林鶴唳天等曲實録云新弄成文濟以為不可增裔以為增之善琴阮呂文濟撫之辭以不能召樞密院及翰林學士中書舍人等聽焉戊子以新琴阮譜藏祕閣甲午翰苑祕閣三館學士以上新增琴阮絃各獻歌賦詩頌上謂宰相曰朝廷文物甚盛羣臣所獻頌校其工拙唯李宗諤趙安仁楊億詞理精當吳淑安德裕胡旦或詞采古雅或學問優博明年正月十九日庚申太常寺言音律官田琮以上新增九絃琴五絃阮配十二律旋相為宫隔八相生並已叶律冠于雅樂以旋宫相生之法畫為圖以獻上覽之喜詔遷琮職皇祐二年九月丁亥帝御崇政殿召近臣閲雅樂因出太宗皇帝琴玩譜賜羣臣祥符六年四月十九日詔以太宗所製曲名三百九十及九絃琴五絃阮譜字變絃法并調弄操引名共三百三十六付史館大樂局見上至道二年正月庚午裴愈自江南還求得古書六十餘卷名畫四十五軸古琴九墨迹八本詔藏祕閣景祐兩儀琴十二絃琴景祐元年秋九月燕肅言金石不調願以王朴律準更加考案詔許之又命李照宋祁領其事明年正月金石一部成二月戊午帝御延福宫臨閲照因自造葦籥清管一云大管葦篥簫管清笛雅笛大笙大竽宫琴宫瑟大阮大稽凡十一種詔許以大竽大笙下大樂用之餘悉罷不用時又出兩儀琴十二弦琴以備雅樂兩儀琴者施兩絃十二柱十二絃琴者如常琴之制增其絃以象律吕之數又敇更造七絃九絃琴圓其首以祀天方其首以祀地五年八月詔李照所造更不行用實録七月丙辰詔南郊且用和峴舊樂即寶元元年景祐阮逸琴準二年四月鄭向言阮逸自撰琴準用求律吕相生之聲圜轉應律靡不符合七月庚子詔赴闕宋朝琴譜書目協律郎吳良輔集王安石胡笳十八拍曲及元豐行譜歌六篇協之音律附於琴聲為琴譜一卷胡笳十八拍四卷漢蔡琰撰琰幽憤成此曲入琴中唐劉商皇朝王安石李元白各以集句效琰體共四家阮咸弄譜一卷李昌文撰按唐段安節樂府雜録云阮咸所造月琴謂之阮咸昌文為譜法及載新製曲調十二首琴聲律圖一卷麴瞻撰圖前代琴樣十二家各以所應律吕十二時附圖下琴聲韻圖一卷王大方述琴調操名琴樣指法琴序與瞻序頗同琴義一卷劉籍琴譜三均一卷馬少良載黃鐘中吕無射三均之曲志唐以前有劉氏周氏琴譜四卷陳懷琴譜二十一卷琴集歷頭拍簿一卷崇文目唐正聲新徴琴譜十卷崔遵度琴箋書目一卷皇朝吏部郎中直史館崔遵度撰論琴音絃徽之法遵度善鼓琴得其深趣著琴箋云唐協律郎劉貺以樂器配諸節候而謂琴為夏至之音愚謂象天地自然之節耳豈止夏至之音而已聖人不能作易而能知自然之數不能作琴而能知自然之節先儒謂八音以絲為君絲以琴為君愚謂琴以中徽為君紹興御銘琴盾樣琴髙宗賜洪皓御銘盾制琴一十三年二月己巳上謂大臣曰古人琴制不同各有所屬朕近出意作盾樣以示不忘武備之意史記騶忌曰大絃濁以春溫者君也小絃亷折以清者相也攫之深醳之愈者政令也鈞諧以鳴大小相益回邪而不相害者四時也復而不亂者所以治昌也連而徑者所以存亡也故曰琴音調而天下治樂記絲聲哀哀以立亷亷以立志君子聽琴瑟之聲則思志義之臣儀禮絲聲不可犯挎越嵇康琴賦斫孫枝制雅琴離子督墨匠石奮斤夔襄薦法般倕騁神鎪會厠朗密調均華繪雕琢布藻垂文錯以犀象藉以翠緑絃以園客之絲徽以鍾山之玉爰有龍鳯之象古人之形伯牙揮手鍾期聽聲華容灼爚發采揚明伶倫比律田連操張進御君子新聲憀亮初涉渌水中奏清徵雅昶唐堯終詠微子注七略雅暢第十七曰琴道曰堯暢逸又云達則兼善天下無不通暢故謂之暢次其曲引所宜則廣陵止息傅玄琴賦曰馬融覃思於止息東武太山飛龍鹿鳴鵾雞遊絃八者並曲名下逮謡俗蔡氏五曲王昭楚妃千里别鶴器和故響逸張急故聲清間遼故音庳絃長故徽鳴性潔靜以端理含至德之和平愔愔琴德冠衆藝兮蔡雍琴賦繁絃既抑雅韻乃揚仲尼思歸鹿鳴三章梁甫悲吟周公越裳青雀西飛别鶴東翔飲馬長城楚曲明光張協賦翦㽔賔之陽柯剖大吕之陰莖營匠琢其朴伶倫均其聲音明號鍾韻清繞梁奏緑水吐白雪激楚回流風結成公綏賦君山獻曲伯牙奏弄劉向雅琴賦彈少宫之際天授中徵以及泉風俗通曰和樂作者其曲曰暢憂愁作者其曲曰操朱文公曰琴之有徽所以分五聲之位配以當位之律以待抑按取聲而布徽之法當隨聲數多少律管之長短而三分損益上下相生以定其位鄭樵曰琴之九操十二引以音相授並不著辭琴之有辭自梁始物理論琴欲高張瑟欲下聲何妥曰伏羲減瑟文王足琴樂器鼓牽牛曰河鼓張衡賦云伐河鼓之磅硠世本云夷作鼓又曰巫咸作鼓學記曰鼓無當於五聲五聲不得不和是樂之所成在於鼓伊耆氏土鼓明堂位土鼓蕢桴葦籥伊耆氏之樂也注伊耆氏古天子有天下之號禮運注築土為鼓以土塊為桴桴擊鼓之物黃帝鼓吹金鼓宋志鼓吹蓋短簫鐃歌蔡雍曰軍樂也黃帝岐伯所作以揚德建武勸士諷敵也雍門周説孟嘗君鼓吹于不測之淵漢世有黃門鼓吹孫權觀魏武軍作鼓吹而還魏晉世又假諸將帥及牙門曲蓋鼓吹陸機鼓吹賦原鼓吹之所始蓋稟命於黃軒黃帝出軍決曰牙旗者將軍之精金鼓者將軍之氣一軍之刑候也詩方叔率止鉦人伐鼓注鉦以靜之鼓以動之黃帝內傳帝伐蚩尤玄女為帝製夔牛鼓八十靣一震五百里連震三千里莊子釋文黃帝得竒獸名曰夔取皮以冒鼓聲聞五百里劉獻定軍禮曰鼓吹未知其始漢以雄朔野而有之鳴笳以和簫聲非八音也少昊建鼓通禮義纂建鼓大鼓也少昊氏作焉為衆樂之節夏加四足商挂而貫之周縣而擊之近代植而建之本出商制唐禮設於四隅五經要義鼓所以檢樂為羣音之長徐景安樂書曰建鼓者謂少昊氏作大鼓為衆樂之節高辛鞞鼓見樂類帝王世紀帝嚳命倕作鞞宋符瑞志高辛氏使鼓人拊鞞鼓擊鐘磬鳳皇鼓翼而舞廣韻吕氏春秋曰帝嚳令人作鼙鼓之樂堯敢諫鼓舜敢諫鼓見招諫類淮南子云云漢劉輔傳昭有虞之聽注師古曰舜有敢諫之鼓故言有虞之聽堯鼛鼓淮南子主術訓堯舜禹湯武王伐鼛而食奏雍而徹已飯而祭可謂至貴矣然戰戰栗栗日慎一日堯鼛鼓王者之食樂也詩云鼓鐘伐鼛雍已食之樂也大司樂王大食三宥皆令奏鐘鼓詩鼓鐘伐鼛正義鼛即臯也韗人曰臯鼓尋有四尺長丈二是大鼓也舜鼗鼓殷鞉鼓置鼓虞書下管鼗鼓注堂下樂王制注鞉所以節樂春官疏尚書鄭注云下管鼗鼓謂舜廟堂下之樂故言下商頌那置我鞉鼓注鞉鼓樂之所成夏后氏足鼓殷人置鼓周人縣鼓箋置讀曰植植鼗鼓者為楹貫而樹之湯受命而作濩樂改夏之制始植我殷家之樂鞉與鼓也鞉雖不植貫而搖之亦植之類鞉鼓淵淵禹建鼓禹鞀管子桓公問第五十六禹立建鼓於朝而備訊唉訊問也唉驚問也淮南子鬻子同禹鞀小鼓有柄曰鞀大鞀謂之鞞月令仲春修鞀鞞吕氏春秋倕作鞀白虎通鞀者震之氣也上應昴星以通王道水經注禹有立鼓之訊夏足鼓殷楹鼓周縣鼓明堂位夏后氏之鼓足四足殷楹鼓楹謂之柱貫中上出也殷頌曰植我鼗鼓周縣鼓周頌曰應朄縣鼓殷建鼓儀禮大射儀建鼓在阼階西南鼓注建猶植也以木貫而載之植之跗也疏周人縣鼓今言建鼓則殷法也主於射略於樂故用先代鼓隋志革之屬五一曰建鼓夏后氏加四足謂之足鼓殷人柱貫之謂之楹鼓周人縣之謂之縣鼓近代相承植而貫之謂之建鼓蓋殷所作也又棲翔鷺於其上不知何代所加或曰鵠也取其聲揚而逺聞或曰鷺鼓精也越王句踐擊大鼓於雷門以厭吳晉時移於建康有雙鷺哾鼓而飛入雲或曰皆非也詩云振振鷺鷺于飛鼓咽咽醉言歸飾鼓以鷺存其風流未知孰是周靁鼓靈鼓路鼓春官大司樂靁鼓靁鼗於圜丘奏之靈鼓靈鼗方丘奏之路鼓路鼗宗廟奏之注鄭司農云雷鼓雷鼗謂六靣有革可擊靈鼓靈鼗四靣路鼓路鼗兩靣玄謂雷鼓雷鼗八靣靈鼓靈鼗六靣路鼓路鼗四靣穆天子傳天子讀書于黎丘奏廣樂而遺其靈鼓又天子靈鼓警衆周六鼓雷鼖靈鼛路鼓晉臯鼓應鼓鼉鼓地官鼓人掌教六鼓四金之音聲以節聲樂以和軍旅以正田役教為鼓而辨其聲用以雷鼓鼓神祀注雷鼓八靣神祀祀天神也神大司樂雷鼓雷鼗祀天圜丘奏之以靈鼓鼓社祭靈鼓六靣社祭祭地示也大司樂靈鼓靈鼗祀地示方丘奏之秋官冥氏攻猛獸以靈鼓驅之以路鼓鼓鬼享路鼓四靣鬼享饗宗廟也大司樂路鼓路鼗宗廟奏之大僕御僕大司樂見上下以鼖鼓鼓軍事大鼓謂之鼖鼓長八尺諸侯執賁鼓以鼛鼓鼓役事鼛鼓丈二尺典司者掌之以晉鼓鼓金奏晉鼓長六尺六寸金奏謂樂作擊編鐘軍將執之鎛師掌金奏之鼓注主擊晉鼓以奏鐘鎛以金錞和鼓錞錞于也以金鐲節鼓鐲鉦也形如小鍾軍行鳴之以為鼓節以金鐃止鼓鐃如鈴無舌有柄以金鐸通鼓大鈴也凡軍旅夜鼓鼜鼜夜戒守鼓司馬法曰昏鼓四通為大鼜守掌固夜三鼜以號戒鎛師夜三鼜皆鼓之鼜亦如之注守鼜備守鼓也鼓之以鼖鼓冬官韗人為臯陶注司農云韗書或作􅕦臯陶鼓木也玄謂􅕦者以臯陶名官疏臯陶即是長六尺六寸者依先鄭從􅕦為鼓木還以􅕦為􅕦人之官是臯陶官名也字從革不取韗字為官名穴儀禮大射疏臯陶鼓名長六尺六寸言如陶之中虛也長六尺有六寸左右端廣六寸中尺厚三寸穹者三之一玄謂此鼓合二十版上三正賈侍中云晉鼓大而短近晉鼓也玄謂此鼓兩靣以六鼓差之鼓長八尺鼓四尺中圍加三之一謂之鼖鼓靣四尺其圍十二尺加以三分一四尺則中圍十六尺徑五尺三寸三分寸之一也今亦合二十四版則版穹六寸三分寸之二耳為臯鼓長尋有四尺鼓四尺倨句磬折磬折中曲之不三正也中圍與鼖鼓同以磬折為異凡冒鼓必以啓蟄之日孟春之中蟄蟲始聞雷聲而動鼓所取象也良鼓瑕如積環革調急也鼓大而短則聲疾而短聞鼓小而長則其聲舒而逺聞夏官大司馬中春教振旅王執路鼓諸侯執賁鼓軍將執晉鼓師帥執提謂馬上鼓有曲木提持鼓立馬鬛上者旅帥執鼙卒長執鐃兩司馬執鐸公司馬執鐲辨鼓鐸鐲鐃之用鐸疏案司馬法云十人之長執鉦百人之帥長千人之帥執鼙萬人之主執大鼓中冬教大閲羣吏以旗物鼓鐸鐲鐃各帥其民而致中軍以鼙令鼓鼓人皆三鼓司馬執鐸羣吏作旗車徒皆作鼓行鳴鐲車徒皆行及表乃止三鼓摝鐸羣吏弊旗車徒皆坐注中軍中軍之將令鼓鼓以作其士衆之氣也鼓人者中軍之將帥帥旅帥也司馬兩司馬也振鐸以作衆鼓人擊鼓以行之伍長鳴鐲以節之鄭司農曰司馬法曰鼓聲不過閭鼙聲不過闒鐸聲不過琅又三鼓振鐸作旗車徒皆作鼓進鳴鐲車驟徒趨及表乃止坐作如初乃鼓車馳徒走及表乃止鼓戒三闋車三發徒三刺乃鼓退鳴鐃且卻疏左傳張侯曰師之耳目在吾旗鼓進退從之於是右援枹而鼓之趙簡子云鼓音不衰是皆將居鼓下卒長執鐃以下皆金非鼓也陳子云吾聞鼓不聞金亦是鳴鐃退軍法詩綿鼛鼓弗勝注鼛大鼓也言樂功勸事疏韗人為臯鼓長尋有四尺一丈二尺疏傳以鼛鼓為二鼓凡大鼓之側有小鼓謂之應鼙朔鼙此經鼛是大鼓也鼓謂鼙也大射云一建鼓在阼階西應鼙在東一建鼓在西階之西朔鼙在其北靈臺賁鼓唯鏞鼉鼓逢逢賁鼓大鼓也賦書賁鼓在西房漢上林建靈鼉之鼓樂記鼓鼙之聲歡歡以立動動以進衆君子聽鼓鼙之聲則思將帥之臣穀梁傳天子救日置五麾陳五兵五鼓周應鼓鞉鼓春官小師上士四人掌教鼓鼗注鼗如鼓而小持其柄搖之旁耳還自擊疏云依漢法而知大祭祀登歌擊拊下管擊應鼓徹歌大饗亦如之注應鼙也應與朔皆小鼓其所用别未聞瞽矇眂瞭掌播鼗詩有瞽應田縣鼓鞉磬柷圉注應小鞞也縣周鼓也鞉鞉鼓也朔綿箋凡大鼓之側有小鼓謂之應鼙鼙禮器廟堂之下縣鼓在西應鼓在東注小鼓謂之應疏按大射禮建鼓在阼階西南鼓應鼙在其東應鼙應朔鼙也西階之西建鼓在南東鼓朔鼙在北朔始也先擊朔鼙次擊應鼙乃擊大鼓建鼓在西階之東南靣諸侯之法宋志小鼓有柄曰鞀大鞀謂之鞞月令仲夏修鞀鞞是也周路鼓又見上夏官大僕建路鼓于大寢之門外而掌其政以待達窮者與遽令聞鼓聲則速逆御僕與御庶子注大寢路寢也政鼓節與早晏司農云窮謂窮寃失職則來擊此鼓以達於王若今時上變事擊鼓矣遽傳也若今時驛馬軍書當急聞者亦擊此鼓玄謂達窮謂朝士以肺石達窮民聽其辭告於王遽令郵驛上下程品御僕御庶子直事鼓所者受其事以聞御僕以序守路鼓大司馬中春教振旅王執路鼓玄謂王不執賁鼓尚之於諸侯也疏王用路鼓者以雷靈祭天地之鼓不敢用故用祭宗廟之路鼓也大僕凡軍旅田役贊王鼓注王通鼓佐擊其餘靣周土鼓春官籥章掌土鼓豳籥仲春晝擊土鼓吹豳詩以逆暑中秋夜迎寒亦如之凡國祈年于田祖吹豳雅擊土鼓以樂田畯國祭蠟則吹豳頌擊土鼓以息老物注杜子春云鼓以瓦為匡革為兩靣可擊也鄭司農云豳籥豳地之竹玄謂豳籥豳人吹籥之聲章明堂位曰蕢桴土鼓葦籥伊耆氏之樂也籥如笛三孔疏土鼓因於中古神農之器黃帝已前未有瓦器秋官壺涿氏炮土之鼓注瓦鼓也周密須鼓左傳定四年衛子魚曰成王分唐叔大路之旗密須之鼓闕鞏之甲姑洗之鍾命以唐誥而封於夏墟昭十五年晉荀躒如周以文伯宴樽以魯壺文伯荀躒也魯壺魯所獻壺尊王曰景王也叔父唐叔成王之母弟也其反無分乎密須之鼓與其大路文所以大搜也密須國也在安定陰密縣文王伐之得路鼓以搜武王鞀鼓淮南子主術訓武王立戒慎之鞀注欲戒君令慎疑者搖鞀鼓鄧析子同周石鼓郡縣志李吉甫撰石鼓文在鳳翔天興縣南二十里許石形如鼓其數有十蓋紀周宣王畋獵之事即史籕之迹也竇泉以為宣王獵碣貞觀中吏部侍郎蘇勉紀其事云虞褚歐陽共稱古妙雖歲久訛缺遺迹尚可觀歷代地理志不記録尤可歎惜杜詩曰陳倉石鼓又已訛大小二篆生八分韋應物詩有周宣大獵岐陽之語或曰應物以為文王之鼓至宣王始刻韓愈以為宣王搜岐陽鐫功勒成從臣撰刻愈為博士請於祭酒欲致太學鄭餘慶始遷之鳳翔孔子廟而鼓亡其一皇祐四年向傳師得於民間十鼓乃足大觀中致之辟雍以金填其文後入保和殿三代石刻存於世者壇山吉日癸巳刻與此耳歐陽氏有三疑以為字畫高妙非史籕不能作蘇子瞻詩曰上追軒頡下挹氷斯薛尚功鄭樵為音釋王厚之考正集録之程大昌以為成王之鼓鄭樵摘丞殹二字見於秦斤秦權而指為秦鼓書目鄭樵石鼓文考一卷其文可見者四百六十五有曰我車既攻我馬既同麀鹿速速君子之求其豆孔庶其魚維何維鱮維鯉何以之維楊及柳田車既安左驂幡幡右驂騝騝秀弓時射崆洞之碑不傳後世卒以為陶唐氏之碑岣嶁之碣不存後世卒以為有夏氏之碣岐陽石鼓之文漫滅蕪穢至不可考後世或以為周宣王搜于岐陽而作開明堂受諸侯朝賀之後銘功勒成以告萬世漢宣祠蓬山石社石鼓於臨朐後漢鄧隲傳注今岐州石鼓銘云云橋玄廟有石鉦鉞石鼓見蔡雍集魯鼓薛鼓禮記投壺第四十魯令弟子辭曰云云薛令弟子辭曰云云注記魯薛者禮衰乖異不知孰是鼓半魯鼓半薛鼓注此魯薛擊鼓之節圜者擊鼙方者擊鼓古者舉事鼓各有節聞其節則知其事矣取半以下為投壺禮盡用之為射禮注投壺之鼓半射節者投壺射之細也射謂燕射正義鼓節有圜點有方點記者因魯薛擊鼓之異圖而記之魯鼓半薛鼓半注此二者記兩家之異故兼列之漢十二鼓八鼓大樂鼓志哀帝詔罷樂府官郊祭樂及古兵法武樂在經非鄭衛之樂者條奏别屬他官丞相孔光大司空何武奏郊祭樂人員六十二人給祠南北郊大樂鼓員六人嘉至鼓十人邯鄲鼓二人騎吹鼓三人江南鼓員三人淮南鼓四人巴渝鼓三十六人歌鼓二十四人楚嚴鼓一人梁皇鼓四人臨淮鼓二十五人兹邡鼓三人凡鼓十二員百二十八人朝賀置酒陳殿下應古兵法不可罷安世樂鼓二十人十九人可罷沛吹鼓十二人族歌鼓二十七人陳吹鼓十三人商樂鼓十四人東海鼓十六人長樂鼓十三人縵樂鼓十二人凡鼓八員百二十八人朝賀置酒陳前殿房中不應經法楚鼓員六人皆鄭聲可罷案大樂伶官八百二十九人奏罷四百四十一人唯置三百八十八人漢金鼓郊祀歌天地八璆磬金鼓靈其有喜百官濟濟各敬厥事吳王傳弓高侯執金鼓見膠西王紀元始二年九月戊申晦使謁者大司馬掾行邊兵遣執金吾侯陳茂假以鉦鼓注應劭曰將帥乃有鉦鼓韓信傳建大將旗鼓鼓行出井陘口尉繚勒卒令曰鼓之則進重鼓則擊金之則止重金則退一鼓一擊而左一鼓一擊而右一步一鼓步鼓也十步一鼓趨鼓也音不絶騖鼓也商將鼓也角帥鼓也小鼓伯鼓也三鼓同而將帥伯其心一也竒兵則反是周禮鼓人云軍動則鼓其衆疏曹劌云一鼓作氣齊語三軍故有中軍之鼓有國子之鼓有高子之鼓史記秦紀天子使召公過賀繆公以金鼓漢建鼓何並傳建鼓注建鼓一名植鼓縣有此鼓者所以召集號令為開閉之時漢嚴鼓鼙鼓史丹傳元帝建昭之間留好音樂或置鼙鼓殿下天子自臨軒檻上隤銅丸以擲鼓聲中嚴鼓之節定陶王亦能之注晉灼曰疾擊鼓師古曰鼙騎上之鼓晉傅玄有節鼓賦上林賦鼓嚴簿注張揖曰鼓嚴鼓也李善注擊嚴鼓鹵簿之中也東京賦奏嚴鼓之嘈囐西京賦注嚴更督行夜鼓樂志楚嚴鼓員一人漢鼉鼓上林賦建翠華之旗植靈鼉之鼓注以鼉皮為鼓漢剛鼓志哀帝時丞相孔光奏剛别拊員二人給盛德不可罷注師古曰剛及别拊皆鼓名拊音膚西京雜記漢甘泉鹵簿有剛鼓中道漢銅鼓馬援傳於交趾得駱越銅鼓鑄為馬式注廣州記曰狸獠鑄銅為鼓鼓惟高大為貴面濶丈餘初成縣之於庭尅晨置酒招致同類來者盈門豪富子女以金銀為大叉執以叩鼓叩畢留遺主人虞喜志林曰漢建武二十四年南郡獻銅鼓有銘宋大明七年六月江夏蒲圻獲銅路鼓四靣獨足漢靈鼓鼖鼓東京賦夏正三朝撞洪鐘伐靈鼓注六靣鼓也旁震八鄙軯礚隱訇若疾霆轉雷而激迅風也鼖鼓路鼗漢陔鼓周禮注鄭司農云若今時行禮於太學罷出以鼓陔為節樂師杜子春云裓讀為陔鼓之陔疏漢有陔鼓之法鐘師禰衡為鼓史作漁陽參撾晉登聞鼓唐登聞鼓晉武紀泰始五年六月西平人麴路伐登聞鼓言多妖謗衛瓘傳劉繇等執黃幡撾登聞鼓上言後魏書世祖闕左懸登聞鼓以達寃人水經注闕右置登聞鼓以納諫通鑑神麚四年十月唐會要顯慶五年八月有人賫鼓於朝堂訴上令東都置登聞鼓嘉石西京亦然六典大明宫東朝堂置肺石西朝堂置登聞鼓按通典隋文帝已嘗置鼓唐詔令云太宗建登聞鼓垂拱元年二月敕朝堂登聞鼓肺石不須防守令御史臺受狀為奏裴諝傳德宗時大厯十四年六月己亥朔朝堂别置三司決庶獄辨爭者輒擊登聞鼓諝上疏於是悉歸有司宋朝國初曰鼓司景德四年五月改登聞鼓院雖一猳豚之失猶得以聞况大於此乎中興置院于闕門之前晉石鼓張華傳吳郡臨平岸出一石鼓九域志云武帝時槌之無聲華曰取蜀中桐材刻為魚形扣之則鳴矣如其言聲聞數里水經沔水注晉太康中得鳴石於此水撞之聲聞數里晉諫鼓元紀太興元年六月戊戌初置諫鼓謗木唐三鼓六典武庫令軍鼓之制有三一曰銅鼓二曰戰鼓三曰鐃鼓注世本曰巫咸作鼓銅鼓蓋南中所制金之制四錞鐲鐃鐸官志衛尉卿祭祀朝會供羽儀節鉞金鼓禮志講武都外大將立旗鼓之下六軍各鼓十二鉦一大角四鼓三嚴唐節鼓樂志見鐘類又見鼓吹清商伎有節鼓一通典狀如博局中開員孔適容其鼓擊以節樂隋志不知誰所造宋志節鼓賦云口非節不詠手非節不拊所從來逺矣唐桴鼓志張文收燕樂有毛員鼓連鞉鼓桴鼓貝皆二每器工一人唐銅鼓志天竺伎有銅鼓羯鼓都曇鼓毛員鼓高麗伎有腰鼓齊鼓簷鼓龜頭鼓龜兹伎有答臘鼓侯提鼓雞婁鼓安國伎康國伎有正鼓和鼓水經注赫連鑄銅為大鼓以金飾之唐羯鼓志玄宗好羯鼓而寧王善吹橫笛帝嘗稱羯鼓八音之領褎諸樂不可方也蓋本戎羯之樂其音太簇一均龜兹高昌疏勒天竺部皆用之其聲焦殺特異衆樂通典羯鼓正如漆桶兩頭俱擊出羯中亦謂之兩杖鼓藝文志南卓羯鼓録一卷書目會昌中撰述鼓曲故事多開元天寶時曲唐駕鼓見狩田禮唐方鼓大周正樂曰方鼓大厯元年司馬滔進廣平樂兼此鼓以應黃鐘一均聲乾德銅鼓淳化景德乾德四年四月辛亥南蠻進銅鼓以請內附七月丁丑溪州刺史田思遷以銅鼓來貢一本並作二年當考興國三年五月丁亥廣州獻銅鼓一淳化元年七月南丹州刺史洪皓貢銅鼓三景德元年四月癸酉象州貢銅鼓高一尺八寸闊二尺五寸旁有四耳銜環鏤人騎花蛤椎之有聲來賔縣民獲之至是來上景祐三鼗晉鼓建鼓景祐廣樂記云先是臣祁建言建鼓初不考擊又無三鼗於是敕臣元等詳求典故二年七月甲辰臣等上言建鼓四今樂局皆具而不擊别設四散鼓擊之乾德四年尹拙上言散鼓於古無文去之便時雖可之而於今仍在又雷鼓靈鼓路鼓擊之不成聲而雷鼗靈鼗路鼗缺而未製宜作諸鼓使擊考有聲創為三鼗播之以通三鼓罷四散鼓如乾德詔書從之建鼓植縣四隅皆有左鞞右應隨月建依律吕之均擊之詔可其奏照等更以殿庭備奏四隅建鼓既隨月協均無以節樂而周官晉鼓應施用遂依舊法制焉於是縣內始有晉鼓矣照廢散鼓止以晉鼓一靣應節又舊建鼓四架并左鞞右應共十二靣設於宫縣而不擊照樂以建鼓與鎛鐘相應考擊又舊樂雷鼓兩架各八靣用一人擊照别造雷鼓每靣各一人椎鼓又令三人搖鞉以應之實録二年七月甲辰修撰樂書所言雷鼓靈鼓路鼓建鼓並應考擊其縣內散鼓準乾德四年詔廢不用未幾照所建白皆罷元豐二年七月十二日戊寅詳定朝會儀注所言周禮以晉鼓鼓金奏今樂架四隅設建鼓相傳不擊别施散鼓代之乾德中尹拙奏去散鼓而樂工積習遂不能罷李照又請别作晉鼓以為樂節未幾照所建白亦罷請去散鼓設晉鼓以鼓金奏宫架設鼗為樂節從之五年正月葉防請以晉鼓節金奏二十五日楊傑詳定從之皇祐新製晉鼓仁宗嘗曰鐘磬之音未合古法其集兩制太常與知音者考定其當既而議者各矜所習久而不決上乃命各為鍾律以獻又新作晉鼓三牲鼎鸞刀以補禮器之缺御崇政殿召輔臣諫官宗室御史省府推判臨視之時皇祐五年九月十九日乙酉也元豐二年七月十二日詳定儀注所言請樂架內設晉鼓以鼓金奏設鼗以為樂節從之國朝雅樂登歌有節鼓一建鼓四雷鼓二武舞鞉鼓二雅相二太廟改雷鼓用路鼓紹興郊祀鼓吹紹興十二年五月太常言郊祀仗內鼓吹八百八十四人今樂工全缺乞下三司差撥從之鼓吹用鉦鼓鐃角觱篥管笛等晝在仗內導駕夜在警場奏嚴雜樂器竹土匏木八音樂之器而樂非器也君子知樂之情以制器工師因樂之器以考音伏犧簫通禮義纂伏犧作簫十六管風俗通舜作簫其形參差象鳳翼十管長尺二寸黃帝十二簫文選長笛賦十二畢具黃鐘為主注吕氏春秋曰黃帝命伶倫為律伶倫制十二簫今吕氏春秋作筒云筒吹日舍少次制十二聽鳳鳥之鳴以别十二律以比黃鐘之宫故黃鐘宫律之本也高誘曰六律六吕各有管故曰十二簫笙賦注引吕氏春秋制十二筒竹説文云筒斷也漢志曰云云述十二月之音氣也琴賦注引漢書亦曰十二簫當考黃帝九寸管五代會要周顯德六年正月樞密使王朴上疏夫樂作於人心成聲於物聲氣既和反感於人心所假之物大小有數九者成數也是以黃帝吹九寸之管得黃鐘之聲為樂之端半之清聲也倍之緩聲也三分其一以損益之相生之聲也十二變而復黃鐘聲之總數也乃命之曰十二律旋迭為均均有七調合八十四調播之於八音著之於歌頌宗周而上率由斯道自秦而下旋宫聲廢東漢雖有鮑鄴興之亦人亡而音息唐太宗用祖孝孫張文收考正雅樂而旋宫八十四調復見於時黃帝笛太平御覽引史記曰黃帝使伶倫伐竹於昆溪斬而作笛吹之作鳳鳴當考黃帝五音吕氏春秋黃帝又命伶倫與榮猿鑄十二鐘以和五音女媧笙簧伊耆氏葦籥見鐘鼓類世本女媧作簧宋均曰黃帝臣也隋志伊耆氏有葦籥之音少昊樂器通厯少昊作樂器高辛氏塤箎見樂類世本暴辛公作塤蘇成公作箎古史考云古有塤箎尚矣舜簫玉琯鳳簫書下管鼗鼓合止柷敔笙鏞以間鳥獸蹌蹌簫韶九成鳳皇來儀隋志簫十六管長二尺舜所造其形參差以象鳳翼俗見風通説文笙十三簧象鳳之身古者玉琯以玉舜之時西王母來獻其白琯前零陵文學姓奚於泠道舜祠下得笙白玉琯夫以玉作音故神人以和鳳皇來儀昭華琯見律厯風俗通漢帝時零陵文學奚景仲於泠道舜祠下得玉管後人易之以竹文選注引之徐景安樂書曰舜樂為簫韶九成鳳皇來儀故制鳳簫洞簫以彰德也舜柷敔嘉祐登歌柷敔書戛擊鳴球云云合止柷敔注戞擊柷敔所以作止樂上下合止樂各有柷敔疏郭璞云柷如漆桶方二尺四寸深一尺八寸中有椎柄連底挏之敔如伏虎背上有二十七鉏鋙刻以木長一尺擽之擊柷之椎名為止戞敔之木名為籈爾雅樂之初擊柷以作之樂之將末戞敔以止之柷敔之狀漢禮器制度及白虎通馬融鄭玄李循其説皆然惟郭璞為詳禮小師掌教柷敔瞽矇亦掌之注柷如漆筒敔木虎也詩有瞽鞉磬柷圉王制天子賜諸侯樂以柷將之三禮圖柷鄭注書云投椎其中而撞之宜從鄭注敔全唐禮用竹長二尺四寸破為十莖於敔背橫櫟之白虎通柷敔者終始之聲唐六典協律郎大祭祀饗燕奏樂于庭則升堂執麾以為之節舉麾鼓柷而後樂作偃麾戞敔而後止宋朝景祐二年九月辛巳朔李照言今太常所用柷四靣皆畫時卉請易以青龍丹鳳騶虞靈龜裸蟲以配五方撞擊之法用康成之説又與鄧保信上銅方響五架詔教坊準其聲以授諸器初照既定雅樂而聲極下故又製燕樂之器欲寫其聲已而樂工以為不可施用罷之實録記廣樂云塤舊以漆飾敕令黃其色以其土音云嘉祐七年八月四日翰林學士王圭言今郊廟升歌之樂有金石絲竹匏土革而無木音夫柷敔以著樂之始終豈容有缺今祠明堂願詔有司合八音之和禮官議堂上增置柷敔乙酉詔太常登歌用之九月辛亥大饗明堂舜廟堂樂宗廟禮見樂類舜大㲈樂周禮大司樂疏虞書云云是舜祭宗廟之禮禹五音見招諌類夏籥見樂類仲尼燕居夏籥序興疏謂大夏文舞之樂殷管弦樂祭義禘有樂而嘗無樂疏曰春夏陽來似神之來故祭有樂秋冬陰象神之去故祭無樂然周禮四時之祭皆有樂殷則蒸嘗之祭亦有樂故那詩云庸鼓有斁萬舞有奕下云顧豫蒸嘗則殷秋冬亦有樂熊氏云殷秋冬但有管弦之樂又云蒸嘗全無樂郊特牲殷人尚聲滌蕩其聲樂三闋然後出迎牲唐志留進管絃記十二卷淩秀管絃志十卷隋志作記湯禮樂器郊特牲疏湯以制禮樂之器而得民心殷人尚梓是也考工記云周南籥豳籥左傳舞象簫南籥疏舞者所執劉炫謂南如周南禮籥師中士四人教國子舞羽吹籥文王世子秋冬學羽籥詩左手執籥廣笙師注籥如笛三空之詩注六孔雅七孔釋文以竹為長三寸籥章中士二人下士四人吹籥以為詩章掌土鼓豳籥先鄭注豳國之地竹後鄭云豳人吹籥之聲章疏云籥中吹豳詩雅頌謂之豳籥何得有豳國之地竹乎中春吹豳詩祈年吹豳雅祭蠟吹豳頌言王業所自始周孤竹管簫管頌簫漢大豫管春官大司樂孤竹之管竹特生者陰竹生於山北者孫竹竹枝根末生者小師教鼓鼗柷敔塤簫管弦歌鄭注司農云管如箎六孔玄謂管如笛而小併兩而吹之今大豫樂官有焉疏案通卦驗云簫長尺四寸廣雅簫大者二十四管小者十六管有底三禮圖簫長尺四寸頌簫長尺二寸廣雅管象簫長尺圍寸八孔無底八孔誤當從六後鄭引漢法大豫樂官為况以不與諸家同詩有瞽既備乃奏簫管備舉箋簫編小竹管管如笛併而吹之商頌嘒嘒管聲左傳叔孫穆子曰伶簫詠歌及鹿鳴之三三禮圖云舊圖雅簫長尺四寸二十四管爾雅注二十三管周竽笙塤箎鐘笙春官笙師中士二人下士四人疏東方之樂謂之笙笙生也東方生長之方也教吹竽笙塤籥簫箎笛管舂牘應雅以教裓樂注司農云竽三十六簧笙十三簧箎七空疏禮圖云九空廣雅八孔舂牘以竹大五六寸長七尺短者一二尺其端有兩空髹畫以兩手築地應長六尺五寸其中有椎雅狀如漆筒而弇口大二圍長五尺六寸以羊韋鞔之有兩紐疏畫杜子春讀笛為滌今時所吹五空竹􅐟疏通卦驗竽長四尺二寸廣雅笙以匏為之十三管宫管在左方竽象笙三十六管宫管在中央箎以竹為之長尺四寸八孔一孔上出寸三分司農云七空蓋寫者誤又曰牘應雅皆約漢法知之小師注塤六孔廣雅塤象稱錘以土為之祭祀饗射共其鐘笙之樂燕樂亦如之注與鐘聲相應之笙疏笙師不掌鐘而兼言鐘知義然也瞽矇掌塤簫管弦歌儀禮鄉射三笙一和而成聲注爾雅笙小者謂之和大射儀簜在建鼓之間注竹也笙簫之屬詩鹿鳴吹笙鼓簧樂記訊疾以雅漢志注應劭曰世本隨作笙師古曰匏瓠也列管瓠中施簧管端爾雅大笙巢小者和注云大者十九簧小者十三簧舊圖云笙長四尺諸管參差亦如鳥翼白虎通笙者太簇之氣象萬物之生枚乘為笙賦説文笙正月之音物生故謂之笙王廙笙賦曰不周之竹曾城之匏潘嶽賦曰河汾有曲沃之縣匏鄒魯有汶陽之孤篠基黃鍾以舉韻望鳳儀以擢形寫黃翼以插羽摹鸞音以厲聲大不踰宫細不過羽唱發章夏導揚韶武惟簧能研羣聲之清惟笙能總衆清之林韓非子曰竽者五聲之長竽先則鐘瑟皆隨竽唱則諸樂皆和周十二管大司樂疏以六律六同者此舉十二管以表其鐘樂器之中不用管也周三器禮笙師注玄謂牘應雅教其舂者謂以築地笙師教之則三器在庭可知矣奏裓樂以三器築地為之行節明不失禮周象簫朱干玉戚左傳注象簫舞所執南籥以籥舞也皆文王之樂疏賈逵云簫舞曲名言天下樂簫去無道杜云簫舞者所執南籥既是文舞象簫當是武舞詩維清奏象舞則此象簫之舞武王制焉詩云維清緝熙文王之典此象樂之所舞故知是文王樂也簫梢字同史記注賈逵曰象文王之樂武象也簫舞曲也南籥以籥舞也漢董仲舒傳武帝策曰周室朱干玉戚八佾陳於庭而頌聲興注朱丹其盾玉為戚把也佾列也天子八列六十四人禮司兵祭祀授舞者兵注授以朱干玉戚武王八音樂詩箋武王處於鎬京樂八音之樂羣臣飲酒魚藻篇武王既定天下祭祖考之廟奏樂而八音克諧執競篇宣王樂器公羊傳宣十六年成周宣謝宣宫之謝也樂器藏焉注宣王中興所作樂器周官器用周樂器漢志周詩既備而其器用張陳周官具焉注師古曰謂大司樂以下諸官所掌隋志周官大司樂一千三百三十九人漢郊廟及武樂三百八十八人樂又經籍志有春官部五卷禮典同凡為樂器以十有二律為之數度十有二聲為之齊量典庸器下士四人掌藏樂器庸器司干掌舞器大胥比樂官展樂器大師下管播樂器鄉師正樂稽鄉器鄉共禮樂之器詩有瞽箋大合諸樂而奏之正義合諸樂器一時奏之即經所謂鞉磬柷圉簫管之屬是也止説周之樂器言既備乃奏詩正義大庭以還漸有樂器大庭有鼓籥之器魯四代樂器明堂位拊搏以韋為之玉磬揩擊大琴大瑟中琴小瑟四代之樂器也注揩擊謂柷敔四代虞夏殷周也正義四代漸文不如土鼓葦籥之質故别起其文漢禮樂器記八音樂郊廟樂器見樂類大豫樂器見琴瑟類律志竹曰管注孟康曰禮樂器記管漆竹長一尺六孔尚書大傳西王母獻白玉琯明紀永平二年正月詔樂和八音樂記正義鄭司農云雅狀如漆筒而弇口大二圍長五尺六寸以羊韋挽之有兩紐疏畫並以漢時制度而知也漢築高祖紀十二年十月上還過沛置酒沛宫上擊築自歌曰大風起兮雲飛揚云云注應劭曰築狀似琴而大頭安弦以竹擊之故曰築師古曰今築形似琴而細頸通典築不知誰造高漸離善擊築漢高祖過沛所擊釋名曰以竹鼓之似箏細頸身長四尺三寸項長三寸圍四寸五分漢簫管見安世樂志孔光奏簫工員一人不可罷竽工員三人一人可罷注竽三十六簧笙類漢羽籥玉梢金支翠旌見安世房中樂志郊祀歌景星十二元鼎元年得鼎汾陰作殷殷鐘石羽籥鳴注師古曰羽籥韶舞所持文始舞人執羽籥羽翟羽謂雉之羽也郭璞曰籥如笛三孔而短小天門十一飾玉梢以舞歌體招搖若永望注師古曰梢竿也以玉飾之舞者所持春秋疏上林賦拂鷖鳥梢鳳皇則梢亦拂之類簫梢字同河東賦云被雲梢漢洞簫元帝紀贊元帝善史書鼓琴瑟吹洞簫注如淳曰簫之無底者自度曲被歌聲分刌節度窮極幼眇洞者通也王褒傳太子喜褒所為甘泉及洞簫頌令後宫貴人左右皆誦讀之文選洞簫賦王褒撰原簫幹之所生于江南之丘墟幸得諡為洞簫兮蒙聖主之渥恩般匠施巧夔襄準法帶以象牙掍其會合鎪鏤離灑絳脣錯雜吹參差而入道德楚辭吹參差王逸曰參差洞簫從容中道樂不淫兮條暢洞達中節操兮終詩卒曲尚餘音兮宋志其器今亡蔡雍曰簫編竹有底然則雍時無洞簫矣釋名簫大者二十三管長三尺四寸小者十六管一名籟丹陽記江寧慈母山臨江生簫管竹厯代常給樂府隋何妥曰聖賢多習樂伏羲減瑟文王足琴仲尼擊磬子路鼓瑟漢高擊築元帝吹簫劉伯康簧賦枚乘笙賦侯瑾筝賦漢笛黃鐘笛長笛隋志笛凡十二孔丘仲所作京房備五音有七孔以應七聲黃鐘之笛長二尺八寸四分四釐有竒其餘上下相次以為長短風俗通曰丘仲造笛漢武帝時人長尺四寸七孔三禮圖六孔笛滌也所以滌邪恐按宋玉有笛賦此説非通典漢靈帝好胡笛唐志寧王善吹橫笛馬融長笛賦夔襄比律子壄協吕十二畢具黃鐘為主定名曰笛以觀賢士陳於東階八音俱起食舉雍徹勸侑君子簫管備舉金石並隆無相奪倫以宣八風上擬法於韶簫南籥中取度於白雪淥水下采制於延露巴人溉盥汙濊澡雪垢滓笛生乎大漢有庶士丘仲言其所由出不知其弘妙其辭曰近世雙笛從羌起注風俗通曰笛元羌出又有羌笛與笛二器不同長於古笛有三孔大小異故謂之雙笛龍鳴水中不見已截笛吹之聲相似剡其上孔通調之裁已當薖便易持易京君明識音律故本四孔加以一君明所加孔後出是謂商聲五音畢李尤笛銘云出自西涼伏滔長笛賦序桓子野有長笛云蔡雍所製文選注引宋玉笛賦竒篠異幹罕節簡文國史志有笛律一卷漢塤箎明紀永平十年閏四月甲午幸南陽祠章陵召校官弟子作雅樂奏鹿鳴帝自御塤箎和之以娛嘉賔前志孔光奏主調箎員二人注箎七孔三禮圖舊圖云雅箎長尺四寸頌箎尺二寸廣雅云八孔漢箏笛録通典宋志同笳杜摰有笳賦云李伯陽入西戎所造西京賦校鳴葭注引杜摰葭賦晉先蠶儀注車駕住吹小箛發吹大箛箛即笳也又有胡笳漢舊箏笛録有其曲不記所出本末孫楚笳賦銜長葭以泛吹篳篥出於胡中其聲悲胡人吹角以驚馬一名笳管以蘆為首竹為管晉黃鍾笛律笛梁十一笛樂纂黃鍾笛晉時三尺八寸元嘉九年大樂令鍾宗之減為三尺七寸十四年治書令奚縱又減五分為三尺六寸五分餘見律類桓伊有蔡雍柯亭笛常自吹之隋雅樂二十器隋志大業元年以禮樂之事付祕書監柳顧言等增多開皇樂器大益樂員郊廟樂懸並令新製其雅樂鼓吹多依開皇之故雅樂合二十器今列之如左金之屬二一曰鎛鐘每鐘縣一簨虡二曰編鐘十六鐘縣於一簨虡上下皆八石之屬一曰磬用玉若石為之絲之屬四一曰琴神農五絃周文王加二弦為七二曰瑟二十七弦伏羲作三曰築十二絃四曰箏十三絃秦聲蒙恬所作竹之屬三一曰簫十六管長二尺舜造二曰箎長尺四寸八孔蘇公作三曰笛十二孔漢武帝時丘仲作匏之屬二一曰笙二曰竽並女媧作笙列管十九於匏內施簧而吹之竽大三十六管土之屬一曰塤六孔暴辛公作革之屬五一曰建鼓殷所作靈鼓靈鼗八靣雷鼓雷鼗六靣路鼓路鼗四靣鼗鼓以桴擊貫其中而手搖之節鼓不知誰所造木之屬二曰柷曰敔以節樂止樂簨虡以懸鐘磬橫曰簨飾以鱗屬植曰虡飾以裸及羽屬簨加木板於上謂之業殷人刻其上為崇牙周人畫繒為翣戴之以璧垂五采羽於下植於簨虡之角近代又加金博山於簨上垂旒蘇以合采羽經籍志總集類梁有樂器賦十卷律志大業中用梁表尺調律以制鐘磬等八音樂器乾德拱震管見律類景德巢笙和笙景德二年八月丁丑朔修樂器舊制巢笙和笙每變宫之際必換義管然難於遽易三年六月樂工單仲辛遂改為一定之制不復旋易與諸宫調皆協巢笙和笙其篁十有九又令仲辛唱入十四調景祐雙鳳管清管簫管清笛雅笛笙竽笳管景祐二年八月十八日己巳太常言準降到樂器一管閲習笛工徐惟德閲習黃鍾大吕十二均並合聲韻詔以雙鳳管為名下太常肄習其制合二管以足聲律管端刻為雙鳳之飾施兩簧焉實録云上製雙鳳管下太常肄習命集賢校理李照同修樂書是日御崇政殿召輔臣觀新樂李照又造葦籥清管簫管清笛雅笛大笙大竽詔以笙竽下大樂用之九月四日詔笳管以牙骨參用染以紅景祐延福宫閲樂器八音新器景祐二年二月戊午燕肅等考定樂器畢詔於延福宫進呈按試五月七日李照言新鐘磬將成若絲竹笙竽止依舊制則音韻難和請並造雅樂八音新器以備獻饗從之六月九日司諫姚仲孫言伏聞議者改制雅樂謂舊律太高裁之使下至如練白石以為磬範中金以作鐘又欲以三辰五靈二十四孝為樂器之飾率多詭異望止用舊樂六月十三日乙丑李照請編鐘磬止用十二馮元宋祁等議曰前代制樂取法非一故有十三管之和十九管之巢三十六簧之竽二十五弦之瑟十三弦之箏九絃七絃之琴十六枚之鐘磬寧有一之於律吕專為十二之數也且鐘磬八音之首春秋言金奏詩頌依磬聲二器非可輕改班固志康成注杜預釋傳文阮氏圖三禮十六之數初無異論惟唐段安節樂府雜録有編鐘十二之説其書舛駁當僖昭之際樂缺安節但率所見筆於書李照以舊鐘磬聲高乃以太府布帛尺為法實比古一尺二寸有竒凡五月造作止八月得鐘磬石七縣而照自造新樂笙竽琴瑟篳篥等十二種皆不可施用詔但存笙竽數種而已又謂今篳篥乃豳詩葦籥製為大管葦篥議者嗤之九月壬寅御崇政殿召輔臣按鼓吹新樂皇祐頌塤匏笙洞簫皇祐二年九月三日丁亥御崇政殿閲雅樂出新製頌塤匏笙洞簫仍令登歌以八音諸器各奏一曲先是八月十三日教習音律所言奉詔依樂書造洞簫成詔令與底簫並用宣和古籥元年三月十九日樂工張從寶上古籥一管自陳世習其藝按之以聲悉協音律大少正聲律吕咸備乞頒行從之詩簡兮正義鍾儀曰伶人也周語景王鐘成伶人告和魯語伶簫詠歌及鹿鳴之詩此云仕於伶官以伶氏世掌樂官而善焉故後世多號樂官為伶官黃帝使伶倫氏取竹吹之為黃鍾之宫周景王問伶州鳩是伶氏世掌樂官國語伶州鳩曰琴瑟尚宫鐘尚羽石尚角匏竹利制大不踰宫細不過羽夫宫音之主也第以及羽金尚羽石尚角瓦絲尚宫匏竹尚徵草木一聲聲以和樂律以平聲金石以動之絲竹以行之詩以道之歌以詠之匏以宣之瓦以贊之革木以節之鑄之金磨之石繫之絲木越之匏竹節之鼓而行之以遂八風於是氣無滯陰亦無散陽伶人告和春秋隱五年正義服虔云乾音石其風不周坎音革其風廣莫艮音匏其風融易緯通卦驗作調風調與融一風二名震音竹其風明庶巽音木其風清明離音絲其風景坤音土其風涼兑音金其風閶闔楊傑曰金聲舂容失之則重石聲溫潤失之則輕土聲函胡失之則下竹聲清越失之則髙絲聲纎微失之則細革聲隆大失之則洪匏聲叢聚失之則長木聲無餘失之則短人稟中和之氣有中和之聲足以權量八音朱氏曰歌聲長而濁者為宫以漸而清且短則為商角徵羽以十二律和之乃能成文而不亂以三分損益隔八相生禮運所謂還相為宫舜典所謂律和聲也人聲既和乃以其聲被之八音而為樂公羊注八音者德之華也歌者德之言也舞者德之容也八音金石為衆音之綱領絲竹匏土包括於中而革木二音無當於五聲十二律故居最後而但為象樂之節樂出於虛而寓於器本於情而見於文樂所以移風於善亦所以易俗於惡故絲竹之器未改而桑濮之流已作竹來嶰谷律寫歸昌鈞臺之樂葛天之歌翠鳳揚旌靈鼉植鼓大司樂中大夫二人樂師下大夫四人上士八人下士十有六人此乃天子之官也諸侯有樂正之屬玉海卷一百十
