body:
  text: 玉海卷一百七十八宋王應麟撰食貨農官農家者流出於農稷之官播百穀勸耕桑以足衣食故八政一曰食二曰貨孔子曰所重民食周官冢宰以九職任萬民其一曰三農生九榖司稼巡邦野之稼而辨穜稑之種周知其名與其所宜地而懸于邑閭是也及鄙者為之欲使君臣並耕悖上下之序少皥九農正見官名春秋正義賈逵云春扈分循相五土之宜趣民耕種夏扈竊玄趣民耘苖秋扈竊藍趣民收斂冬扈竊黃趣民蓋藏棘扈竊丹為果驅鳥行扈唶唶晝為民驅鳥宵扈嘖嘖夜為農驅獸桑扈竊脂為蠶驅雀老扈鷃鷃趣民收麥令不得晏起舍人樊光注爾雅其言亦同謂以扈為官還令依此諸扈而動作也其言不經難據杜云以九扈為九農之號各隨其宜以教民事稷五星在七星南農正也堯農師稷官史周紀棄為兒時其遊戲好種殖麻菽及為成人遂好勸農相地之宜宜五穀者稼穡焉民皆法則之堯聞之舉為農師天下得其利又見淮南子書舜典帝曰汝后稷播時百穀詩誕后稷之穡有相之道誕降嘉穀秬秠穈芑詩箋后稷堯用之居稷官閟宫周語農師一之稷為大官漢胸奴傳夏道衰而公劉失其稷官北史始均舜命為田祖晉石苞傳為司徒詔曰陶唐之世稷官為重其使司徒督察州郡播殖增置掾屬十八夏農率月令注夏小正曰農率均田釋文率謂田正疏農率則田畯也周農師農正農大夫見官名禮里宰注季冬之月令命農師計耦耕事修耒耜具田器周田畯詩七月三之日于耜四之日舉趾同我婦子饁彼南畝田畯至喜注四之日周四月也民舉足而耕田畯田大夫也甫田曾孫來止田畯至喜箋田畯司嗇今之嗇夫也成王來止謂出觀農事親與后世子行使知稼穡艱難司嗇至又加以酒食記月令孟春王命布農事命田舍東郊注田謂田畯主農之官也禮冢宰九職一曰三農生九穀三農鄭司農云平地山澤玄謂原隰及平地司稼辨穜稑之種稻人稼下地吕氏春秋季冬紀命司農計耦耕事修耒耜具田器晉志詩曰一之日于耜二之日舉趾農官澤虞各有攸次漢志后稷封斄公劉處豳大王徙岐文王作酆武王治鎬其民有先王遺風好稼穡務本業故豳詩言農桑衣食之本甚備管子墾田大邑辟土藝粟盡地力之利臣不若寧遫請置以為大田漢農官田官農都尉屯田校尉宜禾都尉食貨志武帝時水衡少府太僕大農各置農官往往即郡縣比沒入田田之元鼎六年上郡朔方西河河西開田官斥塞卒六十萬人戍田之見屯田類元紀初元五年四月詔罷北假田官王莽傳五原北假膏壤殖榖北假在五原今勝州鹽鐵論大夫曰北邊置田官以贍諸用王褒講德論省田官損諸苑胸奴傳漢遣大將軍青票騎將軍去病擊丐奴胸奴逺遁幕南無王庭漢度河自朔方以西至令居往往通渠置田官吏卒五六萬人稍蠶食地接胸奴以北百官表司農有郡國農監長丞農都尉武帝初置續志邊郡置農都尉主屯田殖穀馮參傳陽朔中為上河農都尉師古曰上河在西河富平敘傳班况為上河農都尉奏課連最地理志張掖郡畨和農都尉治敦煌郡廣至有宜禾都尉治見屯田西域傳宣帝置都護胸奴益弱不得近西域於是徙屯田於北胥鞬披莎車之地屯田校尉始屬都護即渠犁田官元鳯四年遣司馬一人吏士四十人田伊循其後更置都尉伊循官置始此後西域傳永平十六年征胸奴取伊吾盧地置宜禾都尉以屯田遂通西域魏梁習傳建安十八年拜西部都督從事表置屯田都尉二人領客六百夫於道次耕種菽粟棗祗為屯田都尉董祀屯田都尉宣帝時蔡癸以好農使勸郡國至大官光武拜梁騰酒泉典農都尉建武八年田仁護邊田穀於河上王莽置田禾將軍屯田北邊漢稻田使者昭紀元鳯元年冬十月詔安陽侯桀與燕王謀逆故稻田使者燕倉先發覺如淳曰為諸稻田置侍者假與貧民收其稅入也唐六典漢尚書郎四人其一人主户口墾田汜勝之為議郎教田三輔是也魏有農部郎曹晉始置屯田郎中溫嶠請司徒置田曹掾州一人勸課農桑察吏能否漢藉田令通典漢文初立藉田置令東京及魏不置晉武泰始十年十二月復置江左省宋元嘉中又置漢力田常員紀惠帝四年正月舉民孝悌力田者復其身髙后元年初置孝悌力田二千石者一人文帝十二年三月詔置三老孝悌力田常員成帝陽朔四年正月詔曰先帝劭農薄其租稅寵其強力令與孝弟同科其令二千石勉勸農桑出入阡陌致勞來之地理志敦煌效穀縣注師古曰本魚澤障桑欽説孝武元封六年崔不意為魚復尉教力田以勤效得穀因名縣詩箋田畯司嗇今之嗇夫朱邑倫鮑宣延鄭玄第五爰漢穀石五錢唐米斗三錢宣紀元康四年比年豐穀石五錢趙充國傳金城湟中榖斛八錢唐食貨志貞觀四年米斗四五錢天寶三載是時海內富實米斗之價錢十三青齊間斗才三錢魏徴傳帝即位四年米斗三錢舊紀麟德二年是嵗大稔米斗五錢牟麥不列市漢大有年唐有年後漢紀永平九年是嵗大有年十二年是嵗天下安平人無徭役嵗比登稔百姓富庶粟斛三十牛羊被野永平二年始迎氣五郊三年春詔有司勸農桑四年親耕五年作常滿倉唐紀太宗貞觀二年九月壬子以有年賜酺三日五年八月己卯以大有年賜羣臣羊酒宴樂髙宗麟德二年大有年又見祥瑞魏典曲辰都尉魏志典農都尉校尉曹公置任峻為典農中郎將裴潛為魏郡潁川典農中郎將奏通貢舉比之郡國鄧艾為典農功曹謝竒為蘄春典農屯皖王昶毌丘儉為洛陽典農孟康正始中為弘農領典農校尉盧育為睢陽典農校尉時苗典農中郎將司馬芝傳武帝開屯田之官專以農桑為業建安中倉廩充實百姓殷足太祖欲廣置屯田使國淵典其事咸熙元年罷屯田官以均政役典農為太守都尉為令長魏志注漢陶謙表陳登為典農校尉盡鑿溉之利粳稻豐積晉書太僕統典農都尉泰始二年罷農官為郡縣後復有之何曾汲郡典農中郎將傅玄領典農校尉唐營田使稻田使髙宗時婁師德兼河源軍司馬知營田事天授初為豐州都督衣皮袴率士屯田積穀數百萬延載元年春二月為河源積石懷逺軍及河蘭鄯州檢校營田大使聖厯元年四月辛丑為隴右諸軍大使復領營田開元五年三月庚戌復置營州都督以薑師度為營田支度使開元八年六月同州刺史薑師度兼營田長春宫使十月十七日開置朝邑屯田與宋慶禮築之慶禮開屯田八十餘所慶禮傳以習邉事拜河東河北營田使十四年七月王晙為關內支度營田使十五年十二月張志亮為隴右支度營田使李尚隱為河北營田使二年四月楊執一兼隴右營田使六典諸軍萬人已上置營田副使一人列傳崔隱甫玄宗擢兼河東道支度營田使張延賞大厯中為諸道營田副使段秀實為邠寧支度營田副使潘孟陽元和中兼京北五城營田使王遂為西北供軍使持營田不可憲宗以韓重華為振武京西營田和糴水陸運使孔緯僖宗時兼京畿營田使張介然為河隴郡守營田支度等使忠義賈循遷靜塞軍營田使忠義張九齡遷中書令開元二十一年五月始議河南開水屯兼河南稻田使宰相表開元二十一年七月甲申九齡為河南開稻田使紀二十六年正月丁丑以京兆稻田給貧民通鑑開元十六年正月宇文融請因九河故道開稻田丙寅充九河使事不就唐農圃監韋雲起傳髙祖授司農卿武德初進上開府判農圃監見東都苑類唐田正會要舊紀同景龍三年八月二日庚寅敇諸州置司田參軍一員主農事唐隆元年七月十九日戊辰廢開元十五年四月十三日朔方五城各置田曹參軍一員知營田上元二年九月二十一日壬寅又置并每縣置田正二人唐勸農使通鑑開元十二年六月壬辰以兵部員外郎宇文融為勸農使循行州縣議定賦役宇文融傳玄宗以融為覆田勸農使擢兵部員外郎融乃奏慕容琦等二十九人為勸農判官分按州縣括正丘畝太平興國農師興國七年閏十二月庚戌詔民為邦本食乃民天令諸道州府擇練土地之宜明種植之法者為農師通略丁酉詔實録庚戌大詔令同九年五月廢端拱營田使淳化屯田使見前紹興營田使端拱二年二月癸亥遣營田使副詔曰河朔膏腴之地法井賦作方田至道元年六月丁酉募民耕曠土紹興元年九月丙午王實為淮南東路營田副使上召對使往鎮江與劉光世同集其事四年五月甲寅詔淮南帥臣兼營田使知通縣令銜內兼帶營田令監司守臣條畫屯田利便限一月聞奏六年二月庚子江西制置大使李綱湖南吕頤浩兼營田大使辛丑詔宣撫使劉光世韓世忠張浚兼營田大使招討嶽飛宣副吳玠兼營田使壬寅安撫使郭浩等兼營田使都督行府奏改江淮營田為屯田七月壬申置營田司至道勸農使至道二年八月辛酉以陳靖為京西勸農使按行陳許襄鄧等州勸民墾田皇甫選何亮副之景德三年二月丙子詔諸路轉運使副知州府少卿監司刺史以上並領勸農使餘知州軍通判並兼勸農事天禧四年正月丙子改諸道提刑為勸農使副使兼提點刑獄凡農田事悉領之各賜農田勑十一月乙卯令以提點刑獄勸農使副為稱天聖四年中書言諸路提轉皆别置勸農司文移煩擾三月甲申詔罷勸農司而領使如故錢彥逺傳上疏謂宜置勸農司以知州為長官通判為佐官幕職州縣官為判官慶厯四年八月辛卯命參政賈昌朝領天下農田初范仲淹援唐故事請以輔臣分領未有施為而事寢農書圖神農田法詩甫田以御田祖注先嗇也疏神農始造田法典田大夫以其法教民始教造田謂之田祖先為稼穡謂之先嗇神其農業謂之神農名殊而實同也郊特牲注先嗇若神農司嗇若后稷漢食貨志朝錯引神農之教曰有石城十仭湯池百步帶甲百萬而亡粟弗能守也藝文志農家神農二十篇六國時諸子疾時怠於農業道耕農事託之神農劉向别録云疑李悝商君所説雜占有神農教田相土耕種十四卷孟子有為神農之言者許行管子神農作植五穀淇山之陽九州之民乃知穀食揆度篇神農之數曰一穀不登減一穀穀之法十倍淮南子世俗之人多尊古而賤今故為道者必託之于神農黃帝而後能入説神農之播穀因苗以為教文子神農之法劉子神農之法曰丈夫丁壯而不耕天下有受其飢者婦人當年而不織天下有受其寒者吕氏春秋神農之教曰士有當年而不耕則天下或受其飢矣吕氏春秋有上農任地辨土審時篇劉孝標世説注引神農書藝文類聚文選注汜勝之書亦引神農之教周南畝圖禮遂人凡治野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有塗千夫有澮澮上有道萬夫有川川上有路以達于畿注十夫二鄰之田百夫一鄼之田千夫二鄙之田萬夫四縣之田遂溝洫澮皆所以通水於川也遂廣深各二尺溝倍之洫倍溝澮廣二尋深二仞徑畛塗道路皆所以通車徒於國都也徑容牛馬畛容大車塗容乘車一軌道容二軌路容三軌萬夫者方三十三里少半里九而方一同以南畝圖之則遂從溝橫洫從澮橫九澮而川周其外焉正義案詩今適南畝又南東其畝故以南畝圖之匠人為溝洫九夫為井井間有溝十里為成成間有洫百里為同同間有澮注此畿內采地之制采地井田異於鄉遂及公邑漢議賑貸帝紀文元年三月詔春和議所以賑貸之後六年夏四月大旱蝗發倉庾以振民武元狩三年秋遣謁者勸有水災郡種宿麥舉吏民假貸貧民者以名聞六年六月詔遣博士大等六人循行天下存問鰥寡無以自振業者貸與之元鼎二年夏大水九月遣博士中等分循行吏民有振救飢民免其厄者具舉以聞昭始元二年三月遣使振貸貧民無種食者八月詔所振貸種食勿收責元鳯三年正月詔三年以前所振貸勿收責宣本始四年正月詔嵗不登已遣使者振貸困乏丞相以下至都官令丞入榖輸長安倉助貸地節元年三月假郡國貧民田三年三月詔前下詔假公田貸種食其加賜鰥寡孤獨髙年帛二千石嚴教吏謹視遇毋令失職十月詔池籞未御幸者假與貧民流民還歸者假公田貸種食元初元元年三月丙午以三輔公田及苑可省者振業貧民資不滿千錢者賦貸種食六月省苑馬以振困乏二年三月詔苑囿池籞假與貧民七月詔民有菜色已詔吏虛倉廪開府庫振救賜寒者衣永光元年三月詔假田貸種食四年二月詔所貸貧民勿收責建昭四年四月遣諫大夫博士賞等二十一人循行存問乏困成建始三年三月赦所振貸勿收河平四年正月同上三月癸丑朔遣光祿大夫博士嘉等十一人行舉瀕河之郡水所毁傷困乏不能自存者財振貸鴻嘉元年二月詔逋貸未入者勿收四年秋河溢被災者振貸之永始二年二月乙酉晦詔所振貸勿收漢汜勝之書農書又見上藝文志農九家神農二十篇野老十七篇六國時在齊楚間宰氏十七篇董安國十六篇尹都尉十四篇趙氏五篇汜勝之十八篇成帝時為議郎劉向别録云使教田三輔有好田者師之徙為御史汜音凡又音敷劒反王氏六篇蔡癸一篇宣帝時以言便宜至弘農太守九家百一十四篇農家出於稷官八政一曰食孔子曰所重民食及鄙者為之欲使君臣並耕悖上下之序隋志汜勝之書二卷農五部十九卷始於是書農者播五穀藝桑麻周官三農生九穀司稼辨穜稑之種周知其名與其所宜地以為法而縣于邑閭唐志尹都尉書三卷隋志無汜勝之書二卷北史蕭大圜云穫菽尋汜氏之書露葵證尹君之録别録云尹都尉書有種蓼篇月令注農書曰土長冒橛陳根可拔耕者急發正義鄭所引農書先師以為汜勝之書也國語土乃脈發注農書曰春土冒橛陳根可拔耕者急發詩大田箋將稼者必先相地之宜而擇其種季冬命民出五種計耦耕事修耒耜具田器此之謂戒至孟春土長冒橛陳根可拔而事之正義曰出於農書禮草人掌土化之法以物地相宜而為之種騂剛赤緹墳壤渴澤鹹潟勃壤埴壚疆㯺輕爂注化之使美若汜勝之術也疏漢時農書有數家汜勝為上故月令注亦引汜勝後漢劉般傳區種增耕注汜勝之書曰上農區田云云文選養生論注汜勝之田農書曰上農區田王元長策秀才文杏花菖葉耕穫不愆注汜勝之書曰神農之教無粟者弗能守也又曰杏始華榮輒耕輕土弱土望杏花落復耕之輒藺之此謂一耕而五穫初學記汜勝之書三月榆莢雨藝文類聚汜勝之書雪五榖之精榖帛天下之命衛尉前上蠶法今上農事人所忽略衛尉勤之可謂忠國憂民之至杏花如何可耕白沙太平御覽汜勝之奏曰昔湯有旱災伊尹為區田教民糞種負水澆稼收至畝百石勝之試為之收至畝四十石御覽又引汜勝之書曰種桑法桑至春生一畝食三簿蠶又曰三月榆莢雨時髙地強土可種禾爾雅釋文汜勝之種殖書無稷兒寬水令黃霸鄉亭條教召信臣均水約束秦彭稻田文簿九真牛耕教於任延桂陽蠶織教於茨充仇覽為蒲亭長勸生業制科令童恢為不其令耕織種收皆有條章王景守廬江訓蠶織作法制著于鄉亭晉農要杜預傳拜度支尚書奏立藉田又作人排新器興常平倉定穀價較鹽運制課調內以利國外以救邉者五十餘條咸寧四年秋大霖雨上疏多陳農要事在食貨志志預上疏曰陂多則土薄水淺潦不下潤宜修繕陂堨以積水大壞兖豫州東界諸陂隨其所歸而宣導之分種牛三萬五千頭付二州將吏士庶穀登之後頭責三百斛賈思協齊民要術隋志農家齊民要術十卷賈思協撰元魏唐志農家賈思協十卷李淳風演齊人要術卷亡崇文目農家八部二十四卷始於齊民要術十卷齊民要術記民俗嵗時治生種蒔之事凡九十二篇賈元道大農孝經一卷開寶中人中興書目三卷凡種藝資生之事畢書後周竇儼請於齊民要術及四時纂要韋氏月録中采其關田蠶園圃之事集為一卷頒下諸州宋朝天禧四年八月二十六日利州轉運李昉請頒行四時纂要齊民要術二書皆古書陳耕植之法詔館閣校勘鏤本摹賜又出繪龍封鵝祈禳袐法令長吏遵行劭農之道備矣國史志天禧中頒齊民要術于天下教種植蓄養之方兩朝志農家十二部十七卷篇唐兆人本業記中和節進農書會要垂拱二年四月七日武后撰百寮新誡兆人本業記頒賜朝集使貞元五年正月十一日以二月一日為中和節二十八日李泌奏請文武百寮以是日進農書司農獻穜稑之種六年二月戊辰朔舊紀同中和節始令百官進天后所撰兆人本業記舊紀無記字三卷呂溫進表云書凡十二篇成三卷司農獻黍粟種各一斗一作升以李泌傳百官進農書示務本柳宗元進農書三卷狀平秩東作虞書立制俶載南畝周雅垂文文宗太和二年二月庚戌以宰臣李絳所進天后刪定兆人本業三卷令刺史舊紀云州縣寫本散鄉閭志農家類十九家二十六部三百三十五卷始于范子計然終於武后兆人本業三卷王方慶草木疏以下十一家六十六卷不著録書目兆人本業載農俗四時種蒔之法凡八十事崇文目三卷唐均田圖五代史周世宗嘗夜讀書見唐元稹均田圖歎曰此致治之本也詔頒其圖法使吏民先習知之期以一嵗大均天下之田為木偶耕人陶榖為頌崔頌傳世宗讀唐元稹均田疏命寫為圖賜近臣遣使均諸道租賦會要見元稹在同州時所上均田表因製素為圖賜諸道通鑑後周顯德五年七月丁亥頒均田圖于諸道十月丁酉命艾頴等二十四人使諸州定民租元稹集有同州奏均田云因農務稍暇令百姓自通手實狀又令里正書手等傍為穩審並不遣官吏擅到村鄉略無欺隱除去逃荒其餘頃畝取兩稅元額通計七縣沃瘠一例作分抽稅咸平國田圖祥符豐年圖淳化咸平勸農奏議咸平四年十一月丁亥上御龍圖閣召輔臣觀太宗草行飛白篆籀八分書及閲古今名畫移御延和殿閲張去華所著元元論國田圖上曰經國之道必先養民務穡為先朕嘗冀邊鄙稍寧兵革粗息則可以力行其事富庶吾民矣張去華所著元元論大旨以養民務穡為急真宗嘉之以縑素寫之為十八軸列置龍圖閣之四壁祥符四年三月戊子知并州劉綜獻豐年圖陳靖多所建言尤於農事為詳取淳化至咸平以來陳利害表章合三十餘通目曰勸農奏議録上之然其説多泥古難盡行國史志陳靖勸農奏議三十篇景德農田敕崇文目五卷景德元年詔三司使丁謂取戶稅條目及臣民所陳農田利害編為書謂乃與副使判官崔端張若谷樂黃目王曾參議刪定成農田敇五卷二年十月庚辰上之一本云三年正月七日上令雕印頒行民以為便三年正月庚戌詔頒農田敇于天下二月丙子丁謂又言唐宇文融置勸農判官檢戶口田土請諸州長吏兼勸農使事轉運使副兼勸農使詔可勸農使入銜自此始己丑以農田編敇賜輔臣洎資政大學士王欽若一本云二月癸未詔郡國領勸農事天禧四年正月丙子詔提刑為勸農使副賜農田敇熙寧二年十一月十三日以農田條約頒諸路紹聖二年七月命詳定敕令所重編修農田水利夏竦上廣農頌見務農類錢彥逺上勸農疏髙錫作勸農論明道土牛經明道藉田記見耕藉類國史志土牛經四篇景祐元年詔日官取舊文刪定丁度序頒之實録景祐元年十月己巳頒諸州軍土牛經前詔日官取舊文刪校重復為四篇知制誥丁度撰序而印行之其牛色及策人衣並以歲月支干納音相配寶元初詔諸州旬上雨雪著為令月令季冬出土牛以送寒氣鹽鐡論發春而後垂青幡而策土牛後漢禮儀志季冬立土牛六頭於國都郡縣城外丑地以送大寒立春之日百官衣青衣立青幡施土牛耕人于門外以示兆民束晳勸農賦青幡禁遊惰建炎本政書建炎三年八月辛酉廣州教授林勳獻本政書十三篇疆理至地圖今本十五篇十卷勳以為農貧兵驕宜倣古井田之制使民一夫占田五十畝其有羡田之家毋得市田其無田與遊惰末作皆驅之使為隸農以耕田之羡者而雜紐錢穀以為什一之稅本朝二稅之數視唐增至七倍今本政之制每十六夫為一井提封百里為三千四百井率稅米五萬一千斛錢萬二千緡每井賦二兵馬一匹率為兵六千四百人馬三千四百匹歲取五之一以為上番之額以給征役無事則又分為四番以直官府給守衛是民凡三十五年而役始一遍也悉上則歲食米萬九千餘斛錢三千六百餘緡無事則減四分之三皆以一同租稅供之匹婦之貢絹三尺綿一兩非蠶鄉則布六尺麻二兩行之十年則口算酒酤與茶鹽香礬之榷皆可弛以豫民其説甚備書奏以勳為桂州書記其後勳又獻比校書二篇建昌李泰伯著平土書范如圭有夫田書程迥有田賦書紹興中夏休撰周禮井田譜二十卷書目陳敷農書三卷紹興屯田集議詳見前紹興元年九月庚申措置屯田侍御史沈與求言今欲因沿江間田募人屯耕用為籬落兼資儲餉乃陳屯田利害為古今集議上下二卷詔付戶部後亦未克行紹興耕織圖紹興中於潛令樓璹畫耕織二圖四十五事為五言詩四十五章高宗召對以進呈宣示後宫嘉定中樓鑰以是圖上東宫曾安止撰禾譜五卷安止從孫之謹撰農器譜三卷農器天田九星在牛宿南天子畿內之田也亦主農器神農耒耜易繫辭神農氏作斫木為耜揉木為耒耒耨之利以教天下蓋取諸益益震下巽上震巽二木之象木道乃行釋文耜耒下耓也廣五寸耒耜上句木也疏明神農取卦造器之義大庭氏教民耕農謂之神農獲天雨粟之瑞周禮匠人耜廣五寸二耜為耦一耦之伐廣尺深尺謂之甽注古者耜一金兩人併發之今之耜岐頭兩金象古之耦也車人為耒庛音刺長尺有一寸中直者三尺有三寸上句者二尺有二寸耒謂耕耒庛謂耒下岐自其庛緣其外以至於首以弦其內六尺有六寸與步相中也堅地欲直庛柔地欲句庛直庛則利推句庛則利發倨句磬折謂之中地里宰以歲時合耦于鋤以治稼穡趨其耕耨注兩人相助耦而耕也鋤者里宰治處若今街彈之室於此合耦使相佐助合人耦則牛耦亦可知也疏周時未有牛耦耕至漢時搜粟都尉趙過始教民牛耕今鄭云合牛耦可知者或周末兼有牛耦至趙過乃絶人耦用必大曰疑耕犂起於春秋之間孔子有犂牛之言冉耕亦字伯牛月令出土牛示農耕早晚賈誼新書劉向新序載鄒穆公曰百姓飽牛而耕暴背而耘山虞凡服耜斬季材注季猶稚也記月令季冬命農計耦耕事修耒耜具田器孟春天子親載耒耜注耜者耒之金也廣五寸釋文字林耒耕曲木垂所作祭義天子為藉千畝躬秉耒詩三之日于耜四之日舉趾以我覃耜俶載南畝畟畟良耜俶載南畝載芟載柞其耕澤澤千耕其耘徂隰徂畛齊語耒耜耞芟擊菒除田以待時耕深耕疾耰以待時雨説文耜耒端木也耒手耕曲木也垂作耒耜以振民周稼器鑄器禮遂人以時器勸氓注鑄作耒耜錢鎛之屬遂大夫正歲簡稼器修稼政注耒耜鎡基之屬鄼長歲時簡器注稼器也考工記粵鎛段氏為鎛器注田器錢鎛之屬詩臣工庤乃錢鎛良耜其鎛斯趙周語農修其疆畔日服其鎛詩大田箋將稼者必先相地宜而擇其種季冬命民出五種計耦耕事修耒耜具田器至孟春土長冒橛陳根可拔而事之論語長沮桀溺耦而耕注耜廣五寸二耜為耦漢田器又見代田列傳朝錯言勸農力本曰為室廬具田器趙充國上田處及器用簿龔遂至渤海敕屬縣持鉏鉤田器者皆為良民後傳杜詩建武七年遷南陽太守造作水排鑄為農器力少功多百姓便之任延建武初守九真俗不知牛耕乃令鑄作田器教之墾闢田疇歲廣百姓充給章紀元和元年二月甲戌詔郡國募人欲徙他界者恣聽之到在所給公田為雇耕傭賃種餉貫與田器勿收租武帝元鼎元年詔江南之地火耕水耨唐耦耕法農器王方翼傳為夏州都督屬牛疫民廢田作方翼為耦耕法張機鍵力省而見功多百姓順賴百官志諸冶監令鑄兵農之器給軍士屯田舊紀太和二年閏三月丙戌朔內出水車樣令京兆造給鄭白渠溉田唐籍田耒耜官志司農卿藉田則進耒耜乾元二年詔去耒耜雕刻命有司改造之淳化踏犂式景德踏犂式實録淳化五年三月癸亥內出踏犂數千分給宋亳人戶先是太子中允武允成獻踏犂一具不用牛以人力運之至是上以宋亳間牛多死求得此制令尚方工官造成數千具先遣直史館陳堯叟齎於宋州大起冶鑄以給與貧民先是借民錢於江淮間市牛未至上以時雨沾足恐耕墾失時也參政蘇易簡曰昔長沮桀溺耦而耕此其遺象也按耦耕以雙耜並耕耳非踏犂之制也一本以陳潁宋亳民無牛者多自挽犂而耕二月乙卯命直史館陳堯叟齎踏犂數千具往宋州委本處鑄造以賜民戶先是武允成嘗進踏犂至是其制猶存命鑄造賜焉景德二年正月戊寅內出踏犂式付河北轉運使令詢訪民間可用則官造給之河朔戎冦之後耕具頗闕淮楚間民用踏犂凡四五人力可比牛一具自尚方造樣二月甲午以河朔民乏農器除鐵渡河之禁建炎二年三月二十六日有司言諸道闕耕牛請下轉運訪求舊制詔可太宗嘗貸陳蔡民錢使市牛而耕真宗用耿望之言置牛湖南而治屯田雍熙藉田耒耜見耕藉類大中祥符農器圖二年六月庚子河東轉運杜夢證上子詹所撰農器圖詔褒之六年七月詔農器免稅從知濱州吕夷簡之言也天聖二年九月辛卯祠太一宫駐輦賜道左耕者茶帛九年九月癸亥祠西太一宫賜耕者茶帛玉海卷一百七十八
