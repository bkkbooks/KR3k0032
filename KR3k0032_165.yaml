授集賢殿修撰就任刋定新編唐書故事史館修撰不外領故易之嘉祐四年九月修撰歐陽修言正史進入禁中而焚其草史院唯守空司而已乞詔龍圖閣别寫一本下編修院以備討閲從之熙寕二年十月九日修撰司馬光請寫仁英實録留本院元祐五年十一月十三日尚書省言舊置編修院専掌國史元豐四年十一月廢院入史館官制行史館歸著作局國史院有故則置乾徳初首以趙普監修國史開寳後命中書樞密書時政記淳化中置起居院興國三年二月以新修三館為崇文院西廡為史館書庫三年十二月以王著為史館祗候俾刋正切韻八年七月吳鉉為史館勘書八月楊文舉為史館編修雍熙四年四月宋炎為史館校勘編修淳化二年十月郭延澤董元亨為史館檢討至和二年八月十四日史官言修曰厯有檢討官詔韓維為史館檢討嘉祐八年七月二十三日又命吕夏卿兼政和八年四月二十九日工部員外郎滕康請秘閣四部書以秘書郎掌之列史館于左以法東觀從之建隆昭文館太平興國三館四館三館之名起於唐修文武徳史館貞觀集賢開元梁正明中以右長慶門右掖門内東北小屋數十楹為三館湫隘庳陋衛士喧雜書纔數櫃每受詔有撰述徙就他所建隆元年二月改弘文館為昭文館太宗興國二年臨幸舊館顧左右曰若此之陋何以待天下賢俊詔有司度左升龍門東北車府地為三館棟宇之制皆帝親授左掖門内左升龍門外前列三館後置秘閣分藏羣書三年二月丙辰朔功畢實録云於乾元殿東創修三館列四庫書雍熙中於三館北建秘閣分内府書藏之詔以三館新修書院為崇文院通鑑庚辰詔車駕再臨視十六日辛巳幸壯麗冠内廷遷西館書分於兩廡東廡為昭文書庫南為集賢西為史館書庫凡四庫分經史子集四部六庫書皆以類相從正副本僅八萬卷先是但有直史館淳化元年八月二十五日丁卯以吕祐之等四人直昭文館二十六日戊辰和㠓直集賢院備三館之職祥符八年四月宫城延燔上以内廷火禁嚴寓宿非便命翰學陳彭年檢討故事五月壬辰彭年言唐制中書門下兩省宫城内有内省城外有外省今請為内外院内院奉安太宗聖容御書天文圖書四廡為書庫史館日厯等庫於右掖門外道北為外院别置三館書庫館閣官宿直於外院從之天禧元年八月丁亥詔崇文外院以三館為額天聖九年上以通近市囂非多士討論之所直集賢院謝絳言唐麗正史局並在大明華清宫内太宗肇修三館更立秘閣于昇龍門左景徳中圖書寖廣益以内帑西庫四年五月己亥分内藏西庫地廣秘閣二聖數幸焉逓宿者有不時之召人人力道術究藝文名臣由此選徃遭延燔别剏外館陛下未嘗迂翠蓋幸册府宜開内館以恢景徳之制從之十一月辛巳八日徙三館于崇文院先是權寓右掖門外至是修崇文院成命還舊所昭文大學士夷簡表謝元豐改為秘書省政和五年遷秘省於新左藏庫昭文集賢有大學士史館有監修國史皆以宰相兼領昭文集賢置學士直學士史館集賢置修撰史館有直館檢討集賢有直院校理崇文有檢討校書皆以他官領之初昭文隷門下省史官寓於集賢後合為一咸平五年七月庚戌幸三館閲四庫書嘉祐四年二月置館閣編定書籍官九月以内藏西庫地還崇文院熙寧四年十月二十九日宋敏求言三館秘閣各有四部書㡬四萬卷每帙止用元寫本一再校更無兼本類多訛舛欲於藏書之家借本繕寫叅定七年置補寫所元祐四年五月秘書省言崇文總目書籍將四館分書併合著録令以黄紙書一本藏秘閣自嘉祐中編校所寫書未能足數欲添補依崇文總目編次内有唐朝舊書乞别藏秘閣五年九月十六日復置集賢院學士六年八月十六日以命李周先是元年三月二十八日詔内外官許帶集賢殿修撰直院校理之職直紹聖二年四月三日詔易集賢學士為集賢殿修撰院為直秘閣校理為秘書校理政和六年四月十日詔集賢殿無此名改為右文殿修撰元豐元年十二月七日秘閣校理蘇棁言四館書籍因置編校所借書校證云云欲不許帶出從之通畧嘉祐四年右正言吳及請擇館職分校四館書二月丁丑命蔡抗陳襄蘇頌陳繹編定四館書籍遂用黄紙寫正本以防蠧敗六年九月丁巳翰林學士王珪判史館馮京判昭文館又置編校四員一云置八員十一月辛未以編校秘閣書籍孫洙為館閣校勘供職二年補校勘自洙始兩制缺人必取於館閣名卿賢相多出此途進經術十卷試而後除則慶厯三年十一月癸未也輔臣舉二十人先召試十人則治平三年十一月丙辰也輔臣各舉文學政事三人則元祐元年四月辛丑也圖書之府著作之庭與夫校文之處三者各有司存譬之蓬瀛方壺鼎峙瀛海臺觀金玉隣居往來而均為道家山焉舊制館閣取之以三路進士高科大臣薦舉嵗月疇勞書目史館故事録三卷纂輯歴代史官建置史筆之體卷末云廣順末當時周史臣撰又館閣録十一卷秘閣校理宋匪躬載興國訖元祐中館閣故事共八門元十五卷今存十一卷又蓬山志五卷崇寧四年秘書少監羅綺撰編次館閣故實近事為十五門上之麟臺故事五卷紹興元年秘書少監程俱撰時復置秘書省俱采摭三館舊聞及法令因革别為十二門上之續史館故事録一卷著作佐郎洪興祖編次開寳訖建炎中史館職任廢置恩賜事迹續周代之書中興館閣録十卷淳熙中秘書監陳騤載建炎以來三館㳂革故實及官聨廩禄職掌等事以補麟臺故事之缺續録十卷葉夢得曰端拱中始分三館書萬餘卷别為秘閣命李至兼秘書監宋泌兼直閣杜鎬兼校理三館與秘閣始合為一故謂之館閣然皆但有書庫而已元豐官制行改為秘書省李燾曰本朝因唐故事命宰輔兼領三館首相曰昭文館大學士次曰監修國史又次曰集賢院大學士或虛相位則命參政權領監修自景徳二年王旦始昭文大學士熙寧九年王安石罷遂不復除集賢大學士元豐三年王珪遷亦不復除惟監修國史相傳至今自王珪後宰輔皆不入銜監修之名廢于元豐而復于紹興淳化四方館四年始置四方館使列于内職吏屬同在京官府四方館在朝堂門外掌通事分畨供奉宣賛之名籍諸道章表朝會進奉元祐廣文館太平興國三年九月詔廣文館及州府禮部試進士律賦以平側次用韻元祐七年六月十三日甲子復置廣文館生員一云解額年都省言開封科舉有四方士及太學未及者冐貫應舉舊制試于國子監先於廣文館補試給牒請復置廣文館生員禮部修立十九條紹聖二年三月二十八日以廣文館二百四十人分於諸路解額紹興史館元年四月八日詔修日厯以修日厯所為名國元豐之制日厯歸秘省史案三年十一月十六日以修國史日厯所為名四年五月二十四日癸酉改為史館六月二十四日置編修校勘八年八月二十一日以重修神宗哲宗實録正史及徽宗實録增校勘一員十年二月二十二日併歸秘省國史案以著作郎佐纂日厯其史館官皆罷見修淵聖及今上日厯命宰臣提舉名監修國史四月復為國史日厯所從王揚英之言史館在省之東九年二月二十二日修徽録即以為實録院十三年十二月重建秘省十四年六月二十二日遷新省二十九年八月二十四日詔史館修撰檢討官更不置都大提舉承受並罷先是三年八月二十三日詔修日厯命侍從為史館修撰餘官為直史館及檢討若著作郎佐闕用元豐制以郎官兼領六年正月修神宗實録成八年九月哲録成十年七月十四日又詔史館修徽録十五年移史館於省之側别為一所今國史日厯所在道山堂東次著作之庭三楹庭後為汗青軒蓬巒嘉定六年六月十八月重修三館八年七月畢紹定四年秋延燔十一月一日重建三館五年十月畢工規模一如舊式繫年録紹興三年八月乙巳詔復置史館以從官兼修撰餘官兼直館檢討若著作郎佐有闕依元豐例差郎官兼領四年二月辛丑翰林學士綦崈禮兼史館修撰始除修撰官也歴代館名前漢迎風露寒儲胥飛亷平樂臨池後魏仙人露寒金陵燕然扶桑崦嵫唐修文三十六國來賓六朝儲胥顯仁集雅顯信職方行人來逺北齊文林丹臺新録所載金庭紫㣲玉海卷一百六十五
