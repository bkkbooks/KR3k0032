body:
  text: 玉海卷一百六十五宋王應麟撰宫室館周禮注候館樓可以觀望者也説文館客舍也黃帝大庭館列子黃帝即位十有五年云云退而閒居大庭之館齋心服形商陽館見明堂類周候館詳見邸驛地官遺人凡賓客㑹同師役掌其道路之委積十里一廬三十里有宿宿有路室五十里有市市有候館候館有積注宿可止宿若今亭有室候館樓可以觀望者委人凡四方之賓客館焉秋官環人掌送迎賓客舍則授館小行人眡館司儀致館國語周之秩官有之曰敵國賓至候人為導卿出郊勞司里授館漢磃氏館郊祀志武帝即位六年云云明年召文學之士明年上初至雍郊見五畤上求神君舍之上林中磃氏館史記云磃氏觀栢武帝故事云起梁臺以處神君紀元光二年冬十月行幸雍祠五畤舍神君在此年上林賦靈圉燕於閒館封禪書鬼神接靈圉賓于閒館注謂神君漢飛亷館桂館益夀延夀館平樂館見下延壽觀武紀元封二年春幸緱氏遂至東萊夏四月還祠泰山至瓠子臨决河還作甘泉通天臺長安飛亷館注應劭曰飛亷神禽能致風氣者也明帝永平五年至長安迎取飛亷并銅馬置上西門外名平樂館董卓悉銷以為錢晉灼曰身似鹿頭如爵有角而蛇尾文如豹文郊祀志兼紀年月元鼎六年冬公孫卿候神河南言見僊人迹緱氏城十月天子親幸緱氏元封二年春公孫卿言見神人東萊山若云欲見天子於是幸緱氏城拜卿為中大夫遂至東萊無所見見大人迹云公孫卿曰僊人可見上常往遽以故不見今陛下可為館如緱氏城置脯棗神人宜可致且僊人好樓居於是上令長安作飛亷桂館二館名桂史記云蜚亷館甘泉則作益夀延壽館亦二館名史記作益延夀觀索隠曰漢武故事云作延夀觀高三十丈十括地志曰在雍州雲陽西北八十一里通天臺西八歩使卿持節設具而候神人乃作通天臺置祠具其下將招徠神僊之屬西都賦披飛亷入苑門西京賦陳虎旅於飛亷漢平樂館又見上詳見觀類武紀元封六年夏京師民觀角抵于上林平樂館又元封三年春作角抵戲注文頴曰蓋雜技樂也巴俞戲魚龍蔓延之屬也漢後更名平樂觀枚臯傳上書北闕詔使賦平樂館上善之武帝東方朔傳董偃常從馳逐平樂朔有平樂觀賦霍光傳禹山走馬馳逐平樂館風后握機武帝令霍光等習於平樂館羽獵賦望平樂徑竹林注張晏曰平樂館名晉灼曰在上林中西京賦大駕幸乎平樂張甲乙而襲翠被攅珍寳之玩好紛瑰麗以奓靡臨逈望之廣場程角觝之妙戲烏獲扛鼎都盧尋橦薛綜注平樂館大作樂處也李尤平樂觀賦曰設平樂之顯觀處金商之維陬李尤平樂館銘曰層樓通閣禁闈洞房選注引之棼梁照曜朱華飾璫騁武舒秘以示幽荒又賦曰習禁武以講㨗厭不羈之遐鄰彌平原之博敞處金商之維陬大厦累而鱗次承岧嶤之翠樓過洞房之轉闥歴金環之華鋪南切洛濵北陵倉山龜池泱漭果林榛榛天馬沛艾鬛尾布分方曲既設秘戲連叙逍遥俯仰節以鞀鼓張元傳中平二年張温以車騎將軍出征涼州元説温曰聞中貴人公卿已下當出祖道於平樂觀水經注穀水又南逕平樂觀東漢宫殿名長安有平樂觀霍光傳北臨昭靈南出承恩注服䖍曰皆館名漢豫章館見觀類漢迎風館文選陸士衡詩置酒迎風館注見西京賦既新作於迎風增露寒與儲胥武帝因秦林光宫元封二年增通天迎風儲胥露寒曹子建詩迎風高中天注地理書曰迎風觀在鄴漢三館欽賢接士翹材平津客館類説平津侯公孫弘開東閤營客館以招天下賢士其外曰欽賢館以待大賢徳任毗賛佐理陰陽者處之次曰翹材館以待大材任九卿將軍二千石者處之次曰接士館以待國士其有一介之善一方之藝者居之自李蔡至石慶丞相府客館丘虛而己至公孫賀劉屈氂時壞以為馬廐車庫奴婢室矣出西京雜記公孫弘傳起客館開東閤以延賢人注師古曰閤小門也東向開之避當庭門而引賓客以别於掾史官屬嚴助傳公孫弘至丞相開東閤延賢人與謀議朝覲奏事因言國家便宜上令助等與大臣辨論中外相應以義理之文鹽鐵論賢良曰公孫丞相兒大夫分禄以養賢卑已以下士葛繹澎侯隳壞其緒毁其客館議堂以為馬廐掃舍黄圖河間獻王徳築日華宫置客館二十餘區以待學士漢高陵館漢武故事上自封禪後夢高祖坐明堂羣臣亦夢想於是祀高祖於明堂以配天還作高陵館後漢李尤高安館銘曰巍巍高安明聖是修嶕嶢麗館窻闥列周王莾更名霸昌館為長存館漢長平館宣紀甘露三年春正月匈奴呼韓邪單于稽侯㹪來朝使有司導單于先行就邸長安宿長平上自甘泉宿池陽宫上登長平坂詔單于母謁注如淳曰阪名也在池陽南上原之坂有長平觀去長安五十里師古曰涇水之南原即今所謂晆城阪元后傳饗飲飛羽校獵上蘭登長平館臨涇水而覽焉注師古曰館在長平阪也漢屬玉館西都賦見觀類漢白鶴館元紀初元三年茂陵白鶴館災詔曰孝武園館漢射熊館元紀永光五年冬幸長楊宫射熊館布車騎大獵揚雄傳上將大誇胡人以多禽獸成紀在元延二年冬秋命右扶風發民入南山西自褎斜東至弘農南敺漢中張羅罔罝罘捕熊羆豪豬虎豹狖玃狐兎麋鹿載以檻車輸長楊射熊館縱禽獸其中令胡人手搏之自取其獲上親臨觀焉是時農民不得收歛雄從至射熊館還上長楊賦以風七畧云綏和元年上黄圖長楊宫有射熊館在盩厔地理志秦昭王起一本元光五年冬幸射熊館漢上林宫館相如賦天子之上林云云離宫别館彌山跨谷高廊四注重坐曲閣華榱璧璫輦道纚屬歩櫩周流長途中宿夷嵕築堂絫臺增成巖窔洞房頫杳眇而無見仰􅦁橑而捫天奔星更於閨闥宛虹拖於楯軒青龍蚴蟉於東箱象輿宛僤於西清靈圉燕於閒館偓佺之倫暴於南榮醴泉湧於清室通川過於中庭紀元帝初元元年九月令宫館希御幸者勿繕治五年夏四月罷上林宫館希御幸者成帝建始元年秋罷上林宫館希御幸者二十五所召信臣為少府竟寧中奏上林諸離逺宫館希幸御者勿復繕治共張西都賦西郊則有上囿禁苑林麓藪澤陂池連乎蜀漢繚以周牆四百餘里離宫别館三十六所神池靈沼往往而在注黄圖上林有建章承光等十一宫平樂繭觀等二十五凡三十六所按黃圖又有昆明逺望燕昇象觀便門白鹿三爵陽禄陰徳走馬柘觀上蘭郎池當路等觀又有飛亷觀建章有駘盪馺娑枍詣天梁竒寳鼓簧等宫又蒲萄扶荔宫在上林苑宣曲宫在昆明池西東京賦云云三輔故事秦上林苑中作離宫别觀一百四十六所外戚傳上林有涿沐館陽禄柘館雲林館王褎傳宣帝令褎與張子僑等並待詔所幸宫館輙為歌頌漢内外宫館三輔宫館郡國宫館又見上黄圖漢畿内千里並京兆治之内外宫館一百四十五所班固西都賦前乗秦嶺後越九嵕東薄河華西渉岐雍宫館所歴百有餘區行所朝夕儲不改供秦離宫三百漢武帝往往修治之又麒麟朱鳥龍興含章皆館名西京賦封畿千里統以京尹郡國宫館百四十五右極盩厔并卷酆鄠左暨河華遂至虢土注三輔故事秦時殿觀百四十五所郊祀志元鼎五年其冬郡國各除道繕治宫館以望幸枚臯傳遊觀三輔離宫館輙使賦之王訢傳武帝過扶風宫館馳道修治供張辦宣紀地節三年冬十月詔郡國宫館勿復修治漢繭館元后傳王莽欲娛太后市權迺令太后四時車駕巡守四郊春幸繭館率皇后列侯夫人桑遵灞水而祓除注師古曰漢宫閣疏云上林苑有繭觀蠶繭之所也洛都賦傳毅桑宫繭館區制有矩后帥九嬪躬勑工女咸宣傳闌入上林中蠶室門後禮儀志注桑于蠶宫手三盆于繭館漢秘館賈逵傳明左氏傳國語為之解詁五十一篇永平中上疏獻之顯宗寫藏秘館蔡邕傳上書曰臣得以學問執事秘館操管御前漢恭館班固典引啓恭館之金縢御東序之秘寳以流其占注恭館宗廟金縢之所在漢南北兩部質館鮮卑傳安帝永初中鮮卑大人燕荔陽詣闕朝賀鄧太后賜燕荔陽王印綬赤車参駕令止烏桓校尉所居寗城下通胡市築南北兩部質館鮮卑邑落百二十部各遣入質注築館以受降質魏崇文館唐六典注魏有崇文館魏玄武館水經河水又東逕平縣故城北注魏氏起玄武館於芒垂張景陽協玄武觀賦所謂高樓特起竦跱岧嶤直亭亭以孤立延千里之清飈也蓺文類聚有玄武館賦宋招隠館雷次宗傳元嘉中召詣京邑為築室於鍾山西巖下謂之招隠館齊於剡白石山立太平館以居褚伯玉宋儒學館宋書元嘉十五年立儒學館于北郊命雷次宗居之齊王儉宅學士館緫明館詳見觀類王儉傳武帝永明三年既立國學省緫明觀五月乙未時儉以左僕射領國子祭酒詔於儉宅開學士館以緫明四部書充之又詔儉以家為府自宋世祖好文章士大夫悉以文章相尚無以専經為業者儉少好禮樂及春秋言論造次必於儒者由是衣冠翕然更尚儒術撰次朝儀國典自晉以來故事無不諳悉故當朝理事决斷如流每博議引證八座丞郎無能異者何佟之為緫明館學士六典注宋太始齊永明有緫明館齊永明五年立商飈館於孫陵岡九月辛卯幸焉梁五館南史儒林傳梁武天監四年正月癸卯朔詔開五館建立國學緫以五經教授置五經博士各一人以明山賔陸沈峻嚴植之賀瑒補博士各主一館館有數百生給其餼廪其射䇿明經者除為吏於是懐經負笈者雲會又分遣博士祭酒到州郡立學植之兼五經博士登講五館畢至袁憲傳帝開五館憲常招諸生論新義大同八年帝撰孔子正言章句詔下國學召憲為正言生梁集雅館士林館梁書天監五年五月置集雅館以招逺學又見前五館大同七年十二月丙辰於宫城西立士林館延集學者胄子蘇世長上書周武帝使六十學虎門館又有通道館學士長孫熾為之見學校唐三館修文館史館見後集賢殿書院見院類唐武徳四年始置修文館隷門下省貞觀二年又建史館於禁中專掌國史開元十三年改集仙殿為集賢殿書院三館之名肇於此矣自是集賢昭文置大學士史館置修國史皆宰相兼領又置學士直學士修撰直館校理之職亦以他官領之其昭文館隷門下省史館寓於集賢尚未合為一至梁正明中始以汴都左長慶門東北為三館即所廢四館也於是合為一矣百官志弘文館属門下省集賢書院及史館属中書省永徽元年六月詔三館學士有高第淳良者所司簡試名聞會要大中六年正月馬植奏始著令三館學士不避䑓自植始六月弘文館奏三館制置既同事例宜等宋建隆初改昭文因唐故事命宰輔兼領三館李訓傳秘館圖籍蕩然無餘唐文學館十八學士圖賛褚亮傳武徳四年太宗為天䇿上將軍冦亂稍平乃向儒術十月於宫城西作文學館收聘賢才於是下教降㫖曰昔楚國尊賢道光申穆梁邦接士徳重鄒枚以大行臺司勲郎中杜如晦記室考功郎中房玄齡及于志寧軍諮祭酒蘇世長天䇿府記室薛收文學褚亮姚思亷太學博士陸徳明孔頴達主簿李玄道天䇿倉曹參軍李守素王府記室參軍事虞世南參軍事蔡允恭顔相時著作郎攝記室許敬宗薛元敬太學助教蓋文達軍諮典籤蘇朂並以本官為學士七年收卒復召東虞州録事㕘軍劉孝孫補之凡分三畨逓宿閤下悉給珍膳每暇日訪以政事討論墳籍榷畧前載無常禮之間命庫直閻立本圖像具題名字爵里使亮為之賛號十八學士藏之書府以章得賢之重方是時在選中者天下所向慕謂之登瀛洲舊書賛曰十八文星運輝炳耀紀高宗時許敬宗奏曰雲臺畫像十有八人三于兹惟臣僅在藝文志閻立本畫秦府十八學士圖一卷儒學傳太宗身櫜鞬風纚露沐然鋭情經術即王府開文學館召名儒十八人為學士與議天下事既即位殿左置弘文館悉引納學士番宿更休聴朝之間則與討論古今道前王所以成敗或日昃夜艾未嘗少怠魏王泰傳帝以泰好士善屬文詔即府置文學館得自引學士唐修文館昭文館弘文館弘文與崇文館通弘文殿四部書書樓十八學士唐二館景龍文館記選舉志凡館二門下省有弘文館生三十人會要作三十八人東宫有崇文館生二十人以皇族緦麻以上親皇太后皇后大功以上親宰相及散官一品功臣食實封者京官職事從三品中書黄門侍郎之子為之試一大經一小經或二中經史記漢書三國志各一或經通六史及時務䇿通三皆帖孝經論語十條通六為第官志弘文館學士不定員數掌詳正圖籍教授生徒朝廷制度㳂革禮儀輕重皆參議焉注武徳四年􅙰置修文館於門下省九年會要三月更當攷改曰弘文館九月太宗即位貞觀元年詔京官職事五品以上子嗜書者二十四人隷館習書出禁中書法以授之六典注云敕虞世南歐陽詢教示楷法其後又置講經慱士六典注黄門侍郎王珪奏學生學書之暇請置博士兼肄業敕太學助教侯孝遵授經典著作郎許敬宗授史漢二年珪又請置講經慱士考試經業准式貢舉儀鳳中置詳正學士校理圖籍武徳後五品以上曰學士六品以上曰直學士又有文學直館皆他官領之武后垂拱後以宰相兼領館務號館主六典始於貞觀初給事中一人判館事神龍元年十月十九日改弘文館曰昭文館以避孝敬皇帝之名二年曰修文館徐堅兼學士景龍二年四月二十二日癸未置太學士四人以象四時學士八人以象八節直學士十二人以象十二時景雲中二年三月八日己未減其員數復為昭文館開元七年九月四日甲子曰弘文館置校書郎十二月三日置四人二十三年減二人又有校理讎校錯誤等官長慶三年七月與詳正學士講經博士皆罷顓以五品以上曰學士六品以下曰直學士未登朝為直館學士劉伯莊許子儒元行冲李敬元王彦威直學士上官儀高智周許叔牙魏謩校書郎奚陟鄭覃直館王元威劉允濟孔緯柳珪弘文生裴行儉徐齊𥅆房琯韓泗崔植裴炎修文生楊神昌人名詳見下文會要武徳九年九月大宗即位於弘文殿聚四部羣書二十餘萬卷於殿側置弘文館選天下賢良文學之士虞世南褚亮姚思亷歐陽詢蔡允恭蕭徳言等以本官兼學士令更宿直引入内殿講論文義商榷政事或至夜分方罷貞觀初令褚遂良檢校館務號館主因為故事其後有張太素劉禕之范履冰相次為館主貞觀二年移於納義門西九年又移於門下省南其後移仗大明宫其館亦在門下省南云云長慶三年二月弘文館奏請造書樓選舉志太宗即位益崇儒術乃於門下置弘文館儒學傳太宗鋭情經術王府開文學館即位殿左弘文館畨宿更休聴朝之間則與討論古今道成敗或日昃夜艾未嘗少怠李適傳中宗景龍三年通鑑二年四月癸未案唐書文藝傳作景龍二年於修文館置大學士四員學士八員直學士十二員以象四時八節十二月李嶠宗楚客趙彦昭韋嗣立為大學士李適劉憲等為學士薛稷馬懐素等為直學士凡天子宴會遊豫惟宰相及學士得從春幸棃園並渭祓除則賜細柳圏辟癘夏宴蒲陶園則賜朱櫻秋登慈恩浮圖獻菊花酒稱壽冬幸新豐歴白鹿觀上驪山賜浴湯池給香粉蘭澤從行給翔麟馬帝有所感即賦詩學士皆属和當時人所歆慕翰林故事貞觀中秘書監虞世南等十八人或秦府故僚或當時材彦皆以弘文館學士會于禁中内參謀猷延引講習出侍輿輦入陪宴私十數年間多至公輔當時號為十八學士弘文館學士禇遂良館主杜正倫直館馬嘉運歐陽詢朱子奢蓋文達谷那律蕭徳言虞世南褚亮姚思亷蔡允恭趙弘智吕才謝偃直學士弘文館中有四部書世南為學士與房玄齡對掌太宗令冩列女傳以粧屏風于時世南暗䟽之姚思亷撰梁陳書蕭徳言為學士每開五經必束帶盥濯焉六典注後漢有東觀魏有崇文館宋元嘉有玄史兩館宋太始至齊永明有緫明館梁有士林館北齊有文林館後周有崇文觀或典校理或司撰著或兼訓生徒若今弘文館之任也韋述兩京記弘文館在門下省東李華含元殿賦弘文教以開館對日華之清閾蓋左學之遺制協前王之講徳會要顯慶四年二月二十八日䇿問舉人九百人惟李巢崔行功五人上第令待詔弘文館隨仗供奉開元七年十二月三日省弘文崇文兩館讎校置弘文館校書四員崇文館校書兩員二十二年二月二十五日省弘文館校書兩員開元二十六年正月八日詔弘文崇文生貴胄子孫不専經業自今依令式考試天寳十四載二月十日弘文生依國子監生例帖試帖經减半廣徳元年七月二十六日敕弘文崇文兩館生皆以資蔭補所習經業湏精熟楷書字體皆正通七者與出身建中三年十一月敕先補皇宗次宰輔子孫六年九月敕兩館生選勲賢胄嗣嚴律冐假代之禁大和七年八月九日敕兩館生試經畢郎官二人覆試九年十二月弘文生二十四人减四人崇文生十六人减一人開成三年二月兩軍使狀稱請准大和元年五月十七日以前敇文官階至三品許用蔭與子孫補兩館生出身貞元十一年二月公主之子進補兩館生許孟容執奏元和三年少府監請蔭子為兩館生韋貫之論奏權徳輿弘文館大學士壁記太宗敷文徳建皇極思與大雅閎達之倫切劘理道金玉王度盛選重名虞世南禇亮而下為學士更直密侍誕章逺猷講議啓迪景龍初始置大學士多以宰司處之登閎古先腴潤大政漢廷金馬石渠蘭臺延閣方斯陋矣書目景龍文館記十卷武平一撰景龍二年四月癸未詔修文館置大學士學士直學士凡二十四員得李嶠宗楚客輩每游燕必賦詩賡唱是書咸紀録為七卷又别載學士二十九人傳為三卷後唐同光三年七月改弘文館為崇文館唐史館史局百官志史館修撰四人掌修國史貞觀三年移史館於門下省以他官兼領或位卑有才者亦以直館稱以宰相涖修撰又於中書省置秘書内省修五代史開元二十年李林甫以宰相兼修國史建議以為中書切密之地史官記事隷門下省疏逺於是諫議大夫史官修撰尹愔奏徙于中書省天寳後他官兼史職者曰史館修撰初入為直館元和六年會要四年六月奏宰相裴垍建議登朝官領文職者為修撰以官高一人判館事未登朝官皆直館以凖六典著于令大中八年七月廢史館直館二員增置修撰四人分掌四季會要云監修鄭明奏云云添修撰二員通舊為四員分修四季之事左右史開元初詔史官非供奉者皆隨仗而入位於起居郎舍人之次會要武徳初因隋舊制隷秘書省著作局貞觀二年閏十二月一云二十三年非也志云三年移史官於門下省北以他官兼領位卑有材者以直館稱故事以未通籍者為直館宰相監修撰自是著作局始罷史職又於中書省置秘書内省修五代史及大明宫初成徙史館於門下省南凡祥瑞天文祥異蕃國朝貢入冦來降變律造曲州縣廢置孝義旌表法令變改斷獄新議有年及饑水旱蟲霜風雹地震流水泛溢諸色封建京諸司長官及刺史都督都䕶行軍大緫管副緫管除授刺史縣令善政異跡碩學異能高人逸士義夫節婦京諸司長官及刺史都督都䕶副大緫管已下薨卒公主百官定諡諸王來朝所由有即勘報史館修入國史開元二十五年三月一日一作開元二十年無月日宰臣李林甫監修國史以中書宻切之地史官記事隷門下省疎逺於是史官諫議大夫尹愔遂奏移於中書省北侍中凡官爵廢置刑政損益授之史官既成復茫其記注中書令凡制誥文章獻納以授記事之官永貞元年九月監修國史宰相韋執誼奏史官修撰皆於私家記録褒貶之間恐傷獨見今後望令修撰官各撰日厯凡至月終即於館中都會詳定是非使寫姓名並不得私家置本仍請永為常式從之李元紘傳初左庶子吳競為史官撰唐書及春秋未成以喪解後上書請畢其工會要開元十四年七月六日奏詔許就集賢院成書張説致仕詔在家修史開元二十五年會要六月二十六日元紘因言國史記人君善惡王政損益褒貶所係前聖攸重今張説在家修史吳競在集賢院撰録國之大典分散不一且太宗别置史館禁中所以秘嚴也會要云所以重其職秘其事謹勒説以書就館參會撰録詔可于休烈傳遷大常少卿兼修國史㑹要至徳二年六月二十三日肅宗曰良史者君舉必書朕有過失顧卿何如禇遂良于休烈魏謩並不欲人主觀史朱敬則傳遷正諫大夫兼修國史請高史官選以求名才長安二年七月韋安石嘆曰史官權重宰相劉知幾傳史局深籍禁門所以杜顔面防請謁也蔣乂傳貞元九年擢史館修撰徳宗重其職先召見延英乃命之監修貞觀房玄齡以左僕射永徽令狐徳棻以禮侍于志寧張行成以侍中高馮以中書令禇遂良以吏書來濟以中書侍郎修史學士貞觀初鄧世隆崔仁師慕容善行劉顗庾安禮敬播直國史李延壽修撰蔣乂伸偕韓愈李翺張薦高鉞獨孤郁韋處厚裴休王彦威直館吳競柳芳沈傳師蔣係韋處厚韋述任史官二十年蔣乂居史職二十年蔣氏三世修史張薦在史館二十年劉子玄領國史三十年六典中書省史館注周有太史小史内史而諸侯之國亦置史官漢武置太史命司馬談為之後漢班固劉珍等著述東觀皆他官兼領史職魏明帝太和中始置著作郎及佐郎隷中書省專掌國史晉惠帝元康二年改隷秘書省歴宋齊梁陳後魏並置著作北齊因之亦謂之史閣史館故邢子才作詩詶魏收冬夜直史館是也隋曰著作曹隷秘書省貞觀初别置史館於禁中專掌國史史通齊梁置修史學士梁任孝恭入西省撰史陳顧野王許善心傅縡為撰史學士張正見阮卓為撰史著士元魏始於秘書置著作局普泰以來别置修史局其職有六人魏命崔浩揔監史任齊及周隋史官以大臣統領者謂之監修國史高隆之魏收陽休之監國史柳敏監修國史唐貞觀三年左僕射房玄齡揔監諸代史秘書監魏徵緫知其務凡賛論多預焉龍朔中詔敬宗以太子少師緫統史任按晉起居注康帝詔著述任重以武陵王領秘書監唐修本草徐世勣監統史官掌修國史本起居注以為實録然後立編年之體為褒貶焉兩京記門下省東有弘文館次東史館史通今之史館即古之東觀别置史館通籍禁門西京則與鸞渚為隣東觀則與鳳池相接館宇華麗酒饌豐厚史曹崇扄峻宇深附九重馬融三入東觀張華再典史官會要長安二年修史劉允濟言史官善惡必書言成軌範昔班生受金陳壽求米僕視之如浮雲耳景龍二年四月二十日紀處訥蕭至忠等並監修國史史官劉知㡬求罷史職奏記於至忠曰知㡬三為史官再入東觀不能勒成國典有不可者五也古國史出一家唯漢東觀集羣儒著述無序今史司取士滋多人自為荀袁家自為政駿閣筆相視含毫不斷首白可期汗青無日言未絶口朝野咸知筆未栖毫搢紳咸誦孫盛實録取嫉權門王劭直書見讎貴族常人之情能無畏乎史官注記類禀監修十羊九牧其令難行一國三公適從焉在監者不肯指授修者或不遵奉云云知㡬著史通二十卷知㡬又言史有三長才學識父子三人更涖史官至徳二年十一月二十七日修史官于休烈奏國史一百六卷開元實録四十七卷起居注并餘書三千六百八十二卷在興慶宫史館云云前史官韋述家藏國史一百一十三卷送官長慶三年六月杜元頴奏班固居鄉里而繼成漢書陳壽處私家而專精國志玄宗國史張説在本鎮兼修代宗編年令狐自外郡奏上今史官修憲宗實録