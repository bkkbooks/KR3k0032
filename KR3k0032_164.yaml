body:
  text: 玉海卷一百六十四宋王應麟撰宫室樓初學記公玉帶上黃帝明堂圖為復道上有樓從西南入蓋樓之始也其後魏有麗譙越有飛翼漢有井幹黃帝五城十二樓迎年漢郊祀志太初三年東巡海上考神仙之屬未有驗者方士有言黃帝時為五城十二樓崑侖玄圃五城十二樓仙人之所居以候神人于執期地名名曰迎年上許作之如方名曰明年言明其得延年也上親禮祠上犢黃焉十洲記崑崙山有十二玉樓周候樓司市思次注鄭司農云次市中候樓也又見候館陸機洛陽記洛陽城周公所制城上百步有一樓櫓上林賦見後孟子之滕館於上宫注上宫樓也墨子城備三十步置坐候樓出堞四尺百步一木樓樓前靣九尺二百步一立樓去城中二丈五尺越飛翼樓吳越春秋范蠡為句踐立以象天門為兩蟉繞棟以象龍角魏麗譙莊子徐無鬼見魏武侯曰無盛鶴列於麗譙之間注鶴列陳兵也麗譙高樓也亦作嶕謂華麗而嶕嶢戰樓名漢井幹樓詳見建章宫郊祀志注在建章宫中高五十丈積木而高為樓若井幹音寒之形也井幹井上木欄也其形或四角或八角張衡兩京賦云井幹疊而百層即此樓也太初二年起西都賦攀井幹而未半目眴轉而意迷史記正義幹司馬彪云井欄也關中記云宫北有井幹臺高五十丈積木為樓言築纍方木轉於交架如幹漢玉女樓見建章宫甘延夀傳超踰羽林亭樓趙充國傳為塹壘木樵校聨不絶注師古曰樵與譙同謂為高樓以望敵也上林賦泰山為櫓郭璞曰櫓望樓也東觀記光武至廣阿止城門樓上披輿地圖魏層樓水經注籍水即洋水也北西北角築之謂之金墉城魏文帝起層樓於東北隅晉宫閣名曰金墉有崇天堂即此地上架木為榭故曰樓南曰乾光門夾建兩觀觀下列朱桁於塹以為御路東曰含春門北有退門城上西面列觀五十步一睥睨屋臺置一鍾以和漏鼓洛陽記云陵雲臺西有金市金市北對洛陽壘又東歷大夏門下故夏門也陸機云門有三層高百尺魏明帝造門內東側際城有魏文帝所起景陽山餘基尚存吳疑城假樓魏志黃初五年吳黃武三年八月魏主御龍舟至廣陵吳安東將軍徐盛列舟艦于江植木衣葦為疑城假樓自石頭至江乘聯綿數百里一夕而就時江水盛長魏主臨望歎曰雖有武騎千羣無所用也未可圖也吳落星樓吳都賦饗戎旅乎落星之樓置酒若淮泗積肴若山丘金陵地記吳嘉禾元年於桂林苑落星山起三重樓名曰落星樓吳紀吳有白雀樓晉鳳皇樓翔鳳樓儀鳳樓晉宫閣名洛陽有鳳皇樓總章觀儀鳳樓在觀上廣望觀之南又别有翔鳳樓又有慶雲樓伺星樓宋慶雲樓連理堂嘉禾殿南史孝武大明元年五月丙寅芳香琴堂雙橘連理改為連理堂景陽樓上梁栱間有紫氣改曰慶雲樓清暑殿西甍生嘉禾一株五莖改嘉禾殿後周長孫儉為荆州刺史吏民請為儉建清德樓立碑頌德詔許之南齊却敵樓百官志宫城諸却敵樓上本施鼓持夜者以應更唱太祖以鼓多驚眠改以鐵磬武帝登烽火樓詔羣臣賦詩漢趙充國奏曰今留步士萬人屯田地勢平易多高山逺望之便部曲相保為塹壘木樵校聨不絶便兵弩飭鬪具烽火幸通勢及并力以逸待勞兵之利者也梁北顧樓晉北固樓梁史武帝大同十年三月己酉幸京口城北固樓更名北顧初京城之西有别嶺入江高數十丈三面臨水號曰北固見水蔡謨起樓其上以置軍實頂有小亭梁南徐州刺史正義廣其路傍施欄楯上登望久之武帝有登北顧樓詩柳惲和武帝登景陽樓詩文選謝靈運從遊京口北固應詔詩庾亮傳登武昌南樓唐丹霄樓丹霄殿魏徵傳太宗宴丹霄樓貞觀六年閏八月乙卯實録云丹霄殿樓長孫無忌魏徵王圭等侍酒上謂長孫無忌曰魏徵王圭事隱太子巢刺王時誠可惡我能棄怨用才無羞古人然每諫我不從輒不應何哉徵曰事有不可故諫若不從輒應恐遂行之帝曰第别陳論顧不得耶徵曰若面從别論非稷卨所以事堯舜因言舜戒羣臣汝無面從退有後言之義帝大笑曰人言徵舉動疏慢我但見其嫵媚耳通鑑貞觀六年七月辛未宴三品以上於丹霄殿上曰四海乂安皆公卿之力勿矜強盛以自滿閏月乙卯宴近臣於丹霄殿在九成宫長孫無忌曰云云此閏八月也會要永徽五年秋九月乙亥高宗御丹霄樓觀三品以上行大射禮唐順天樓太極宫南即承天門李靖傳擒頡利太宗告俘于太廟帝御順天樓陳仗衛士民縱觀唐安福樓鍾鼓樓應天樓孫樵讀開元雜報云某日百寮行大射禮於安福樓南高宗永徽三年二月甲寅御安福門樓觀百戲乙卯謂侍臣曰昨登樓欲觀人情風俗玄宗開元二十二年閏十一月壬午朔長至日食癸未御應天樓受朝賀會要太和二年八月敇修安福樓開元二十一年賜射於安福樓下六典皇城西面二門北曰安福嚴挺之傳先天二年正月睿宗上皇御安福樓門觀樂挺之諫白敏中傳為邠寧節度宣宗御安福樓以餞儀衛志朝日百官班于殿庭左右巡使二人分隸于鐘鼓樓下唐神武制勝樓舊紀神龍三年八月丙子改玄武門為神武門樓為制勝樓會要神龍三年八月二十一日改為神武制勝樓唐勤政樓花蕚樓並詳見興慶宫六典興慶宫在皇城之東南東拒外郭城東垣即明皇潛龍舊宅開元初以為離宫宫之南曰通陽門西曰花蕚樓樓之西即寧王故第蓋取詩人常棣之義讓皇帝傳初睿宗五子列第東都號五王子宅及賜第上都隆慶坊亦號五王宅玄宗為太子常置大衾長枕將與諸王共之睿宗知之喜甚先天後開元二年九月盡以隆慶舊邸為興慶宫而賜寧王薛王第於勝業坊申岐二王居安興坊環列宫側天子於宫西南置樓西曰花蕚相輝之樓南曰勤政務本之樓一本作開元二年七月於是宫置樓韋述東京記開元八年造二樓帝時時登之聞諸王作樂必召升樓與同榻坐或就幸第賦詩燕嬉賜金帛侑歡諸王五日朝側門既歸則具樂縱飲擊毬鬪雞馳鷹犬為樂如是歲月不絶世謂天子友悌古無有者帝於敦睦蓋天性然十六年正月庚申御興慶宫樓宴羣臣會要二十五年玄宗戒諸王曰吾奉先帝宫室不敢有加興慶創制所以表休徵之地謂宫側小池有龍祥也新作南樓本欲採風謡察氓俗是亦闢四門達四聰之意時有宴樂不徒然也又因大哥寧王遜朱邸以成花蕚相輝之美歷觀自古聖王有所興作所以助教化也吾所冀者式崇教化漸漬薄俗令其人信厚爾二十年六月一本作天寶十三年六月不一本作開元二十六年此是出處同非誤廣花蕚樓築夾城入芙蓉園十二月三日毁東市西北角道政坊西北角以廣花蕚樓二十八年八月己未誕日宴花蕚天寶二載帝御花蕚樓覆實選人判入等人中才十一二突厥傳天寶四載殺白睂可汗以獻毗伽可汗妻率衆自歸天子御花蕚樓宴羣臣賦詩美其事紀天寶十三載五月壬戌觀酺勤政樓北廷都護程千里俘阿布思以獻選舉志十月一日御勤政樓試四科舉人楊綰及第策外更試詩賦各一道制舉試詩賦自此始登科記開元十三年進士試花蕚樓賦樂志玄宗教舞馬百匹舞於勤政樓下後賜宴設酺亦會勤政樓高仙芝傳安祿山反榮王為元帥仙芝副之玄宗御勤政樓引榮王受命宴仙芝以下哥舒翰傳守潼關御勤政樓臨送玄宗大陳樂勤政樓盧絢按轡絶道去帝美其有藴藉五行志肅宗乾元二年十月詔百官上勤政樓觀安西兵赴陜州實録穆宗元和十三年八月乙亥御勤政樓問人疾苦會要元和十四年三月詔左右軍容各以官健三千修勤政樓四年乙卯御閣陳雜樂太和三年十月修勤政樓明光樓舊史明皇八月五日生因名其日為千秋節燕百僚於樓下觀舞傾杯開元二十五年正月己丑以望日宴羣臣八月丁未千秋節宴羣臣二十八年正月壬寅望日御樓宴羣臣天寶元年正月丁未朔御樓受朝賀改元四載三月甲申宴羣臣七載五月壬午御樓大赦十三載三月壬戌御樓大酺十四載三月丙寅宴羣臣奏九部樂上賦詩效柏梁體八月辛卯宴羣臣並於勤政樓開元十七年八月癸亥以誕日張樂宴百寮於花蕚樓下十八年四月丁卯侍臣宴于春明門外寧王憲之園池上御樓邀其回騎八月丁亥千秋節百官獻賀上御樓賦八韻詩又制秋景詩二十八年正月壬寅望日宴天寶元年九月辛亥御樓宴突厥降者毗伽可汗妻一云辛卯十月庚辰宴蕃客並於花蕚樓李庾西都賦對里開街帝宅王家青門列檻常棣分華勤政外名花蕚分題屹雲中而佩鳯杳天外而舒霓家人齒筵愈愈濟濟此王者示悌也又見後高蓋花蕚樓賦開元中築長安東郛起樓瞰於外銀榜天題金扉御闕望馳道而通禁林走建章而抵長樂攢畫栱以交映列綺窗以相薄金鋪珠綴飛梁廽繞於虹光藻井倒垂乎蓮蕚王諲賦朝有土階之約宫靡瑶臺之奢飾舊館而納景建飛觀而臨霞非徒擬花蕚之麗蓋取諸棠棣之華歸梁國於上苑通代邸於平樂于城之陬建此飛樓橫邐迤而十丈上峻嶒而三休仰接天漢俯瞰皇州榜題仲將之手頌登文公之賦宫闕超遙其若浮陶舉賦睦親親以相及樂韡韡以同華敬括賦羅綵仗駐鳴騶開繡户之銀鎖卷珠簾之玉鉤奉常陳百戲之樂大官進千鐘之酒虹梁􅝦蟉而霞赩皓壁晶晃而月素張甫賦陰移翠仗日上金題欽其號則知昆弟之相穆見其儀則知君臣之有序唐丹鳳樓舊紀開元九年九月丁巳御丹鳯樓宴突厥首領至德二載十一月壬申御丹鳳樓下詔十二月戊午赦天下又見後元和元年正月丁卯御丹鳳樓大赦改元二年正月辛卯郊祀御丹鳳樓大赦三年正月癸巳十四年七月己丑册號十三年正月乙酉朔受朝十五年二月丁丑穆宗即位並御樓大赦長慶元年正月辛丑郊祀改元七月己酉册號大和元年正月乙巳改元會昌元年正月庚戌大中元年正月戊申享圓丘並御丹鳳樓大赦會要貞元九年十一月乙酉日南至上郊祀禮畢御丹鳳樓大赦天下通典開元十八年蘇祿使至京師上御丹鳳樓設宴時突厥使同宴爭長開元七年三月壬子御丹鳳樓宴九姓同羅契丹各賜物八年十一月己巳宴九姓蕃安等九年四月戊辰宴王晙郭知運等皆御丹鳳樓含元殿賦其南則丹鳳啓途遐矚荆吳十扇開閉陰陽睢盱容鼎七扄方駕五車示王者之無外不樹屏於清都唐廣達樓東都萬歲樓王君㲋傳開元十四年君㲋破吐蕃奏凱還玄宗宴君㲋及妻夏於廣達樓賜金帛夏亦自以戰力封武威郡夫人實録開元二十四年八月壬子千秋節御廣達樓宴羣臣奏九部樂內出舞人繩伎頒賜有差文苑英華李濯廣達樓賦建崇樓於闕下聳飛閣於城隅德陽傍倚少室前瞻讓皇帝傳玄宗按舞萬歲樓從復道見衛士棄食帝怒詔殺之憲從容曰豈以性命輕於餘飱乎唐五鳳樓東都通鑑開元二十三年正月乙亥上耕藉田都城酺三日上御五鳳樓酺宴元德秀傳為魯山令玄宗在東都酺五鳳樓下命三百里內縣令刺史各以聲樂集且第勝負加賞黜河內太守輦倡伎數百被錦繡瓌譎光麗德秀惟樂工數十人聯袂歌于蒍于蒍者德秀所為歌也帝聞異之嘆曰賢人之言哉謂宰相曰河內人其塗炭乎乃黜太守德秀益知名唐觀風樓會要華清宫天寶八載新作觀風樓舊紀四月作十載十一月丙午冬至十三載正月丁酉朔御觀風樓受朝賀唐鬱儀結鄰樓長安志在東內大明宫李肇韋執誼所記書為結麟恐誤麟德殿東廊有鬱儀樓西廊有結儀樓學士院即在西樓重廊之外六典作鬱儀結鄰閣七聖記曰鬱儀一作華赤文與日同居結鄰一作鱗黃文與月同居鬱華日精結鄰月精也黃庭經曰鬱儀結鄰梁丘子注曰鬱儀奔日之仙結鄰奔月之仙亦見登真隱訣九真中經唐結綺樓見三殿唐弘文館書樓見後唐長慶樓詳見興慶宫上皇居興慶宫每置酒長慶樓南俯大道裴回觀覽父老過之皆拜舞而去唐金明樓明光樓肅宗乾元元年八月甲辰上皇誕日於金明樓在興慶宫宴百官賜綵五百匹册府元龜元和三年十月修南內殿十三間墻舍共一千六百間及勤政樓明光樓會要同唐望春樓在禁苑東南高原之上德宗紀建中二年二月丁巳發兵屯關中誓師于望春樓陽惠元傳為京西神策兵馬使鎮奉天德宗初立稍繩諸節度跋扈者於是李正己屯曹州田悅增河上兵河南大擾詔惠元移兵萬二千戍關東御望春樓誓師因勞遣諸將亦見廣運潭姚南仲傳王者必據高明燭幽隱先皇所以因龍首而建望春也玄宗時韋堅鑿池於望春樓以聚舟帝升樓觀賜名廣運潭郭子儀傳乾元元年七月破賊河上執安守忠以獻遂朝京師百僚班迎帝御望春樓待之劉憲和春幸望春宫詩有商山積翠滻水浮光之句即望春亭也舊紀多云望春宫其東正臨滻水唐延喜樓又見門闕類會要貞元四年十月二十五日户部侍郎班宏修延喜樓築夾城五年正月十九日宏又修玄武樓八年正月新作玄武門及廡會鞠場宣宗事見下唐望仙樓會要貞元十二年八月六日戶部尚書裴延齡奉敇修望仙樓十三日又令築望仙樓東夾城元龜云十二年八月增修望仙樓及廣夾城及十六王宅會昌元年六月修望仙樓及廊舍共五百三十九間武宗紀會昌五年六月甲申作望仙樓于神策軍先是作望仙觀仙臺連昌宫辭上皇正在望仙樓大明宫東曰望仙門含元殿賦望仙闢於巽維唐晨輝樓紫雲樓舊史兼用會要元和二年六月丙子詔左神策軍新築夾城置元化門晨輝樓舊紀云宸輝十五年穆宗幸晨輝樓觀角抵戲大和九年七月庚戌敇造紫雲樓彩霞亭於曲江芙蓉園北垣九月內出新造紫雲樓彩霞亭額以鼓吹迎於銀臺門左右軍奏修曲江樓畢進圖一軸十月詔左右軍各一千五百人建紫雲樓十二月甲申罷修曲江亭館大和八年三月甲寅上日賜羣臣宴曲江亭文宗嘗味杜甫曲江詞有宫殿千門語意天寶時環江有觀榭臺室會鄭注云秦雍災當興役厭之九年正月辛卯即語兩神策治曲江昆明池二月詔修葺曲江芟除裁填九月發神策一千五百人修浚實録元和二年七月丁亥御晨耀樓神策神威六軍內外教坊大合樂康駢劇談録曰曲江池本秦時隑州唐開元中疏鑿為勝境南即紫雲樓芙蓉苑西即杏園慈恩寺唐興安樓大明宫西門憲宗御興安樓受俘元和元年俘劉闢二年俘受李錡十二年受吳元濟俘十四年李師道俘文宗大和三年受滄州俘武宗會昌四年受劉稹俘唐拾翠樓西京記大福殿重樓連閣綿亘西殿有走馬樓南北長百餘步樓下即九仙門西入苑拾翠樓在大福殿東北唐浴日樓韋述兩京新記上陽宫有麗青臺浴日樓唐春明樓韋肇駕幸春明樓試武藝絶倫賦唐籌邊樓山川險要圖李德𥙿傳文宗太和中四年十月戊申自兵部侍郎為劒南西川節度蜀自南詔入寇敗杜元頴而郭釗代之病不能事民失職無聊李德𥙿至則完殘奮怯皆有條次成都既南失姚協西亡維松由清溪下沫水而左盡為蠻有始韋臯招來南詔復嶲州傾內資結蠻好示以戰陳文法德𥙿以臯啓戎資盜養成癰疽第未決耳至元頴時遇隙而發故長驅深入蹂剔千里蕩無孑遺今瘡痍尚新非痛矯革不能刷一方耻乃建籌邊樓孔明有籌筆驛按南道山川險要與蠻相入者圖之左西道與吐蕃接者圖之右其部落衆寡饋餫逺邇曲折咸具乃詔習邊事者與之指畫商訂凡虜之情偽盡知之又料舊獠與州兵之任戰者廢遣獰耄十三四士無敢怨又請甲人於安定弓人河中弩人浙西由是蜀之器皆犀鋭率户二百取一人使習戰貸勿事緩則農急則戰謂之雄邊子弟其精兵曰南燕保義保惠兩河慕義左右連弩騎士曰飛星鷙擊竒鋒流電霆聲突騎凡十一軍築仗義城以制大度清溪關之阻作禦侮城以控榮經掎角勢作柔逺城以厄西山吐蕃復卭崍關徙嶲州治臺登以奪蠻險於是二邊浸懼南詔請還所俘略四千人吐蕃維州將悉怛謀以城降初廣德建中間吐蕃再飲馬岷江常以南詔為先鋒操倍常之戟且戰且進蜀兵折刃吞鏃不能斃一戎戎入日深蜀人語曰西戎尚可南蠻殘我至韋臯鑿青溪道以和羣蠻使道蜀入貢擇子弟習書算成都業成而去習知山川要害文宗時大入成都自越嶲以北八百里民畜為空自是羣蠻常有吞蜀之心唐親親樓舊紀宣宗大中元年七月修百福殿成名曰雍和樓曰親親以會諸王子孫通鑑大中元年八月作雍和殿於十六宅數臨幸置酒作樂唐睿武樓會要大中二年正月敇修右銀臺門樓屋宇及南面城牆至睿武樓唐延喜樓又見前宣宗大中三年八月己丑既復河湟河隴高年千餘見闕下天子為御延喜樓賜冠帶唐明義樓會要大中五年詔修明義樓在興慶宫乾德紫雲樓明道升平樓會要廣政殿後有玉華殿東有紫雲樓明道元年十月改曰升平樓宫中觀宴之所乾德四年八月辛丑九日召宰臣以下翰林學士竇儀知制誥王祜等宴紫雲樓下論及民間事謂趙普等曰下愚之民雖不分菽麥如藩侯不為撫養務行苛虐朕斷不容之普等曰陛下愛民如此堯舜之用心也富弼曰斯言一傳天下聳動皆以民政為務致太平之本也會要云元年今從實録長編是年五月庚寅二十七日親試制舉人于紫雲樓下賜酒食遣之是日與學士陶榖論前代帝王得失日晡乃罷樓在廣政殿之後玉華殿之東每大宴則宫中登而觀焉廣政後改集英西京含光殿東廊後亦有紫雲樓正殿曰太極殿前有日月樓日月華門開寶五鳳樓開寶八年十月丁巳修西京宫室九年四月三日庚子合祭圓丘御五鳳樓肆赦制云御鳯闕揭雞竿西京大內正南門曰五鳳樓國初建名景德四年二月十七日御五鳳樓觀酺祥符四年三月丁亥祀汾陰回駐蹕將賜酺有司請改五鳳樓名上曰太祖建樓因瑞應建名不可更也己丑十六日上御五鳳樓觀酺三日梁周翰有五鳳樓賦乃東京也太平興國丹鳳樓端拱樓興國三年十一月乙未親享太廟丙申合祭南郊御丹鳳樓大赦受册尊號於乾元殿始奉太祖升侑殿直王操獻南郊頌先是七月庚戌改明德門為丹鳯五年五月丁卯作端拱樓咸平太清樓建隆三年五月戊午重修東京大內崇政殿西北迎陽門內有後苑苑有太清樓走馬樓與延春儀鳳翔鸞閣相接貯四庫書樓下設六閣經史子集天文圖畫咸平三年閏三月甲午詔三館寫四部書一本來上當置禁中太清樓以便觀覽景德元年三月丁酉直祕閣黃夷簡上校勘所寫御書二萬四千一百六十二卷四年三月乙亥曲宴後苑又登太清樓觀太宗聖製御書及新寫四庫羣書遂宴太清樓下上執目録令黃門舉書示之總太宗御製及故事墨迹三百七十五卷文章九十二卷經庫二千九百一十五卷史庫七千三百四十五卷子庫八千五百七十一卷上曰惟以正經史屢經校定者小説他書不預甲寅射於樓下大中祥符二年正月七日賜射太清樓下七年三月癸巳登太清樓觀書十月丙寅射于太清樓下作詩賜宗室天禧二年十一月十三日辛未召近臣觀書太清樓天聖二年八月十三日宴宗室太清樓三年三月癸卯四年四月己酉五年三月辛亥六年三月七年閏二月戊午八年三月宴射太清樓九年三月十七日甲子宴從臣太清樓九年閏十月戊辰召近臣觀書太清樓召太子太保朝逈預景祐二年六月辛未十月戊午宴太清樓三年十月戊申幸後苑宴太清樓寶元二年十一月六日癸巳以皇子生宴輔臣宗室太清樓讀三朝寶訓賜御書又出寶元天人祥異書示輔臣慶厯四年九月丁亥宴宗室太清樓射于苑中五年九月九日辛卯宴近臣宗室太清樓命賦詩六年九月十八日也未宴近臣太清樓嘉祐六年三月戊申宴太清樓出御詩一首命從臣和太清樓藏太宗御製及墨迹石本九百三十四卷軸四部羣書三萬三千七百二十五卷其後羣書增及一萬一千二百九十三卷太宗御集御書又七百五十三卷即景德四年三月己亥率從臣登樓所觀西京天福殿之次有樓後唐曰絳霄太平興國三年改為大清樓寢殿曰大清咸平屬籍樓咸平二年正月甲申建屬籍樓藏宗籍祥符回鑾覃慶樓升中延福樓告成均慶樓祥符元年十月丁巳名兖州府門樓曰回鑾覃慶十一月己未御樓觀酺癸亥次鄆州乙丑宴從臣于升中延福樓賜酺丁卯賜名己巳次濮州宴從臣父老于告成均慶樓四年二月乙丑二十一日駐河中府御樓觀酺賜名駐驆宣恩一作詔蹕三月二十六日駐鄭州酺宴先是己丑名樓曰回鑾慶賜壬辰尋罷宴乙亥祠汾陰回次陜州御南門樓宴從臣父老賜名霈澤惠民樓七年正月己酉名南京正門樓曰重熙頒慶亳州樓曰奉元均慶庚戌御奉元均慶樓觀酺辛亥宴父老丙辰御重熙頒慶樓觀酺祥符薰風樓河中府市中樓唐廣明中王重榮誓衆于此名為克復祥符四年二月上幸河中曰克復一時事不若因舜都為號丁卯乃賜名薰風樓命陳堯叟為記甲子次河中府幸紫極宫還召從臣登逍遙樓觀唐帝詩石又登白樓觀令狐楚登白樓賦王祜詩上作登逍遙樓詩賜從臣熙寧寶津樓熙寧三年四月三日幸金明池觀水嬉移幸瓊林苑登寶津樓宴從臣教坊作樂宋朝聚逺樓德壽宫太上名曰聚逺自題額大書蘇軾詩於屏歷代樓名前漢開襟井幹六朝鳳凰入漢落星北顧青雲朝日夕月景雲景陽麗日後魏玄武北齊逍遙披雲鸚鵡鴛鴦萬歲千秋玄武隋朝日明月乘雲照日唐花蕚相輝勤政務本明義明光觀風制勝延喜玄武望仙晨輝安福紫雲親親睿武五代玄武三十六國凌霄玉海卷一百六十四
