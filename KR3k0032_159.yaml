館後周有麟趾殿學士皆掌著述隋於東都置觀文殿東西廂貯書云云實録髙祖武德九年九月戊戌帝宴舊府佐及學士於弘教殿賜物有差晉皇太子講孝經於崇正殿唐乾元殿又見明堂類乾陽殿政要貞觀四年發卒修洛陽之乾元殿張元素諫初武德四年髙祖以殿太奢使屈突通焚之會要洛陽宫顯慶元年敕司農少卿田仁汪修乾元殿洛陽正殿也髙一百二十尺東西三百四十五尺南北一百七十六尺麟德二年三月十二日舊紀辛未殿成垂拱四年二月十日以殿為明堂開元二十七年九月十日於明堂舊址造乾元殿十月毁明堂上層改下層為乾元殿舊紀開元五年七月甲子詔改明堂為乾元殿通天門為乾元門十年十月癸丑乾元殿復題為明堂天寶二年十二月東京應天門改為乾元門褚無量傳開元中詔無量等於乾元殿整比四部書詳見書目類蘇定方傳降都曼俘獻於乾陽殿會要顯慶五年正月定方俘于東都上御乾陽殿云云見兵捷類王勃上乾元殿頌大壯摛爻斯干韻雅道凝茅屋業盛蒿宫隋曰乾陽唐曰乾元明堂後改含元梁曰朝元後唐曰明堂晉曰宣德後復為明堂本朝興國三年改太極改金鸞第六殿曰乾陽貞觀十一年十一月丙午宴五品已上及蕃夷於貞觀殿十八年十一月乙酉日南至皇太子王公已下展賀於貞觀殿顯慶二年二月癸亥宴貞觀殿唐臨華殿實録貞觀四年十二月乙未誕皇太子宴三品已上於臨華殿唐丹霄殿又見樓類實録貞觀六年二月戊辰幸九成宫戊寅宴三品已上於九成宫丹霄殿賜從官帛四月癸卯醴泉出丹霄殿之西七月辛未宴三品已上於丹霄殿閏八月乙卯宴近臣於丹霄殿樓賜錢帛十八年五月甲戌召司徒長孫無忌以下十餘人宴丹霄殿各賜膜皮魏公諫録宴羣臣於丹霄殿命公圍棊賜尚乘馬并金裝鞍轡勒又坐丹霄門外之西堂引入宴丹霄殿謂羣官曰為政之要務全其本宴丹霄門樓極歡唐披香殿蘇世長傳武德六年世長侍宴披香殿在慶善宫酒酣進曰此煬帝作邪何雕麗若此髙祖曰卿豈不知此殿我所營乃詭云煬帝對曰臣但見傾宫鹿臺琉琉之瓦非受命聖人所為者陛下武功舊第才庇風雨時自以為足帝咨重其言唐戢武殿實録太宗與公卿謁太上皇於戢武殿置酒為歡乙夜方散賜帛有差明日復置酒凌煙閣唐兩儀殿舊紀又夷狄傳貞觀八年三月甲戌髙祖宴西突厥使者泥孰遣使來朝於兩儀殿顧謂長孫無忌曰當今蠻夷率服古未嘗有無忌上千萬嵗夀髙祖大恱以酒賜太宗太宗奉觴上夀流涕而言曰百姓獲安四夷咸附皆奉遵聖旨豈臣之力於是太宗與文德皇后互進御膳并上服御衣物同家人常禮十一年正月壬辰宴五品已上於兩儀殿十四年九月乙巳冥五品已上於兩儀殿奏九部樂十六年十月庚子宴諸蕃使於兩儀殿賜帛十七年四月丙戌太宗即兩儀殿建立晉王為皇太子己亥御兩儀殿皇太子侍戒以孝德十八年四月己酉御兩儀殿皇太子侍側兩京記貞觀五年太宗破突厥於兩儀殿宴突利可汗賦七言詩柏梁體御製絶域降附天下平神通曰八表無事恱聖情無忌曰雲披霧斂天地明玄齡曰登封日觀禪雲亭蕭瑀曰大常具禮方告成諫録云太上皇幸兩儀殿羣臣奉見魏徴傳髙昌平帝宴兩儀殿曰髙昌若不失德豈至於亡朕亦當自戒不以小人之言議君子庶幾獲安也徵舉管仲桓公事長孫無忌傳帝欲立晉王未決坐兩儀殿羣臣已罷獨留無忌玄齡績言東宫事遂定武平一傳中宗宴兩儀殿令胡人唱合笙平一上書諫曰兩儀承慶殿者陛下受朝聽訟之所比大饗羣臣不宜以倡優媟狎景龍二年十一月辛巳宴羣臣于兩儀殿十二月丙申宴堅昆使于兩儀殿武攸緒傳中宗即兩儀殿設位行問道禮隱士玄宗紀討韋氏亂玄宗率總監羽林兵會兩儀殿六典兩儀殿在太極殿後常日聽朝視事蓋古之內朝隋曰中華殿貞觀五年改兩京記亦云長安志兩儀殿在太極宫太極殿後會要大和二年八月修兩儀及甘露殿共一百七十二間唐儀鸞殿見洛陽宫及養老類實録太宗貞觀十一年三月三日戊子引五品已上大射于儀鳯殿十八年十一月壬午宴父老儀鸞殿唐觀德殿唐射殿見大射會要貞觀十六年三月三日戊午賜百僚大射于觀德殿太極宫曰西內其玄武門之外有殿曰觀德永徽三年三月三日丙辰幸觀德殿賜羣官大射永徽三年六月二十八日議明堂制度上令于觀德殿前依五室九室兩議張設上觀之舊紀貞觀十四年十二月丁酉侯君集執高昌王麴智盛獻捷于觀德殿行飲至之禮賜酺二日永徽三年三月庚申幸觀德殿賜羣官大射實録總章元年十月癸丑文武官獻食賀破髙麗帝御玄武門之觀德殿宴百官設九部樂賜帛隋開皇二年十月庚寅享百僚于觀德殿唐齊政殿芳蘭殿天成殿延福殿至德殿壽昌殿通鑑貞觀十三年七月庚戌詔李思摩為泥孰俟利苾可汗上御齊政殿在九成宫餞之思摩奉觴上壽二十年十二月庚辰回紇等酋長來朝賜宴芳蘭殿詳見外夷類二十一年正月丙申御天成殿陳十部樂總章二年八月辛亥御延福殿在九成宮召五品已上議巡守一作議幸涼州册府元龜貞觀二十二年正月乙未奏十部樂會四夷君長於天成殿王公稱觴上夀賜帛有差十八年褚遂良上疏曰臣於芳春殿奏聞實録順宗永貞元年六月乙未召翰林學士鄭絪衛次公王涯等入至德殿撰制詔會要元和十年五月臨碧院使奏壽昌殿南獲白鹿麑長慶元年七月壽昌殿內柱上産玉芝一莖長六尺相思殿大饗見外夷類唐武成殿舊紀貞觀十五年五月壬申并州僧道老人請幸太原上於武成殿賜宴相與道舊以為樂員半千傳高宗御武成殿問半千曰兵家有三陳何謂邪半千曰星宿孤虛天陳山川向背地陳偏伍彌縫人陳臣謂不然師以義出沛若時雨得天之時為天陳足食約費且耕且戰得地之利為地陳舉三軍之士如子弟從父兄得人之和為人陳帝曰善則天紀光宅元年二月甲子皇帝率羣臣上尊號于武成殿王方慶傳武后御武成殿觀方慶十世從祖羲之以下二十八人書遍示羣臣詔崔融序其閥閲號寶章集復賜方慶李元紘傳開元中十五年為相五月五日丁丑宴武成殿賜羣臣襲衣特以紫服金魚賜元紘及蕭嵩會要開元十三年新造銅儀成命之曰水運渾天俯視圖置於武成殿前以示百寮詳見儀象類實録神龍元年四月己巳宴皇親及內外親於武成殿唐飛霜殿實録太宗貞觀二十年七月辛亥宴五品以上於飛霜殿絲竹遞奏羣臣上壽賜綾錦殿在玄武門北因地形髙敞層閣三成引水為潔渌池以滌炎暑貞觀四年三月戊辰宴三品以上於林光殿七月壬辰宴羣臣於芳華殿賜帛十六年二月壬寅帝謂侍臣曰因覽劉聰傳將起凰儀殿陳元達諫朕於藍田市木將别為一殿取制兩儀仍建重閣逺想聰事遂止唐瑶池殿魏鄭公諫録太宗嘗御瑶池殿顧謂侍臣曰西蕃通來幾時唐文思殿房玄齡傳太宗命玄齡等撰文思博要一千三百卷太子弘傳龍朔元年命賔客許敬宗等即文思殿集瑶山玉彩隋有文思殿梁改文思院為乾文院唐紫微殿實録貞觀二十二年十月己巳破龜兹帝聞之大恱宴五品以上於紫微殿謂羣臣曰四海寧一六合無塵帝王之樂也二十三年正月壬子受俘紫微殿初二十二年七月帝遊幸敕奉御王孝積於顯道門內起紫微殿十三間文甓重基高敞宏壯帝見之甚恱襄邑王神符傳太宗令乘小輿入紫微殿唐嘉壽殿賀魯傳貞觀二十二年賀魯內屬會討龜兹請先馳為嚮導詔授崑丘道行軍總管實録四月乙亥宴嘉壽殿厚賜豫解衣衣之實録云賜繒綵隋有嘉則殿開皇十三年二月戊子宴考使唐含涼殿會要龍朔二年六月一日睿宗生於蓬萊宫含涼殿唐紫宸殿紫宸內閣受朝賀見前會要龍朔三年四月二十二日移仗就蓬萊宫二十五日始御紫宸殿聽政百寮奉賀殿在大明宫開元十六年五月六日唐昌公主出降有司進儀注紫宸殿行五禮右補闕施敬本拾遺張烜右拾遺李鋭等連名上疏曰紫宸殿者漢之前殿周之路寢陛下所以負黼扆正黃屋饗萬國朝諸侯人臣至敬之所猶玄極可見不可得而升也上納其言移於光順門外設次行禮實録開元十二年三月庚午宴朝集使于紫宸殿玄宗又嘗宴突厥使者於此肅宗乾元元年二月戊戌宴回紇使於此二十八年四月庚辰有慈烏巢紫宸殿之栱舊紀開成元年正月乙巳御紫宸殿宰臣李石奏放京兆租稅五月乙卯御紫宸殿上謂宰臣曰為政之道自古所難李石對曰朝廷法令行則易又大和元年三月御紫宸殿延英視事凡十一刻宰臣口陳大政異日對翰林學士於思政殿對南北軍使於麟德殿通鑑寶厯元年十月上欲幸驪山溫湯拾遺張權輿伏紫宸殿下叩頭諌云云六典紫宸殿即內朝正殿也兩京記大明宫有紫宸殿在宣政殿北即內衙正殿貞觀五年正月詔諫官隨中書門下及京官入閣官志起居郎舍人秉筆隨宰相入殿若仗在紫宸內閣則夾香案分立殿下直第二螭首張洎曰唐置紫宸上閣唐含元殿大明殿會要大明宫龍朔三年四月二十二日移仗就蓬萊宫新作含元殿長安元年十二月一日改為大明殿神龍元年二月復為含元舊紀龍朔三年十月丙午含元殿前麟趾見十二月庚子詔改來年為麟德開元九年四月甲戌上親策試應制舉人於含元殿天寶八載閠六月丁卯上御含元殿受册大赦乾元元年正月庚寅大閲諸軍於含元殿庭上御棲鸞閣觀之會要作翔鸞閣二年正月己巳朔上御含元殿受册尊號廣德元年御含元殿受册永泰元年正月癸巳朔大赦改元實録云御含元殿大厯元年十一月甲子日長至上御含元殿下制大赦改元貞元元年正月丁酉朔御含元殿受朝賀大赦改元十九年正月癸丑朔御含元殿受南詔朝賀二月丁亥修含元殿元和元年正月丁卯御含元殿受朝賀禮畢御丹鳯樓大赦改元十三年正月乙酉朔御含元殿受朝賀御丹鳯樓大赦紀開元二年九月宴京師侍老于含元殿十年正月乙巳御含元殿宴羣臣賜帛十五年十一月庚子同十六年十一月丙午亦如之髙麗傳總章元年滅髙麗十二月帝坐含元殿獻俘于庭會要開元八年三月上親䇿試應制舉人於含元殿又舊紀九年四月同永泰二年十一月三日詔以十三日甲子冬至於含元殿受朝賀建中二年正月朔御含元殿四方貢獻列為庭實會昌二年四月中書門下言含元殿百官就列請宰相兩省官俟扇開拜訖升殿從之五行志貞元四年正月庚戌朔德宗御含元殿受朝賀含元路寢大朝會之所御也李華傳作含元殿賦蕭頴士曰景福之上靈光之下后妃傳建中元年具册上皇太后尊號帝供張含元殿具衮冕出自左序立東方羣臣在位帝再拜奉册盧鈞傳宣宗元日大饗含元殿鈞年八十升降如儀音吐鴻暢舉朝咨歎六典丹鳯門內正殿曰含元殿注元正冬至於此聽朝詳見大明宫兩京紀含元殿左右有砌道盤上謂之龍尾道殿陛上髙於平地四十餘丈南去丹鳯門四百步康駢劇談録含元殿左右立栖鳯翔鸞二閣龍尾道出於閣前殿門去南門五里元會來朝者仰瞻玉座如在霄漢王仁𥙿曰含元殿前玉階三級李華賦命般石之匠下荆揚之材山祇效靈波神作氣為桴為筏羽疊鱗萃張為廣庭考正極星剗盤岡以為趾大階積而三重四墉既列太階如截其始也星鎚電交於萬堵霜鋸氷解於千尋重簷切霞素壁留日崇髙之制靈丘上盤鄰斗極之光輝邇天漢之波瀾捧帝坐於三辰銜天街之九達騫龍首而張鳯翼左翔鸞而右棲鳯翹兩闕而為翼環阿閣以周墀象龍行之曲直去雕幾與金玉絀漢京之文飾紫微晨𤭔彤墀夜明雲薄萬栱風交四榮貯昭訓之崇崇瞵光範之揭揭其南則丹鳯啓途隂陽睢盱容鼎七扄方駕五車望仙闢於巽維建福敞於坤隅其後則深闈祕殿曼宇疏楹瑞木交隂玄墀砥平古有六寢御兹一人今也三朝繇古是因布大命於宣政淡宸心於紫宸羲和弭節於通乾望舒停景於觀象左黃閣而右紫微命伊臯以為長歌之頌之管磬宜之穆穆皇居壽考無期唐含光殿會要總章元年十二月髙麗平獻俘于含光殿舊紀太和九年八月丁丑幸左軍龍首殿因幸黎園含光殿大合樂唐宣政殿會要髙宗永隆二年正月十日以太子初立欲大會羣臣命婦合宴宣政殿在大明宫含光殿後即正衙殿也太常博士袁利正上疏曰前殿正寢象闕路門非命婦宴會倡優進御之所帝從之改向麟德殿選舉志明皇即位厲精為治張九齡上疏刺史縣令尤親於民者也願少重其選於是下詔擇京官有善政者補刺史凡官不歷州縣不擬臺省已而悉集新除縣令宣政殿親臨問以治民之䇿而擢其髙第者開元四年鄄城令韋濟為第一擢醴泉令餘二百人不入第且令之官四十五人放歸學問儀衛志百官入宣政門文班自東門入武班自西門入五行志開元二十八年四月庚辰慈烏巢宣政殿栱辛巳又巢韋縚傳初帝詔歲率公卿迎氣東郊開元二十五年詔親迎氣至三時嘗以孟月讀時令於正寢二十六年詔縚月奏時令一篇朔旦於宣政殿側設榻東向置案縚坐讀之諸司官長悉升殿坐聽歲餘罷肅宗紀乾元元年正月戊寅上皇天帝御宣政殿授皇帝傳國受命寶符册二年九月丙寅誕日宴百官於宣政殿舊紀至德二載十二月甲子上皇御宣政殿授上傳國璽三載正月戊寅上皇御宣政殿册皇帝尊號乾元二年九月丁亥上御宣政殿試文經邦國等四科舉人建中元年十一月辛酉朔朝集使及貢士見於宣政殿又見朝會類元和三年正月癸巳御宣政殿受徽號移仗御丹鳯樓大赦三月乙巳御宣政殿試制科舉人元和十四年七月己丑御宣政殿册尊號丹鳯樓大赦寶厯三年十二月乙巳文宗即位于宣政殿大和三年五月乙酉滄州平稱賀於宣政殿開成元年正月辛丑朔御宣政殿大赦改元李晟傳德宗貞元三年引晟見於宣政殿備册禮拜太尉中書令會要大厯十四年五月臨軒册尚父子儀於宣政殿元和十年三月壬申朔御延英殿召對宰臣故事朔望日御宣政殿見羣臣謂之大朝玄宗始以朔望陵寢薦食不聽政今之見宰臣特以事召也長慶二年十二月御紫宸殿册皇太子故事册太子御宣政殿時從便也貞元二十一年四月乙巳順宗御宣政殿册皇太子大中三年復河湟追尊順憲諡號至册日上御宣政殿受玉册於太尉兩京記大明宫含元殿後有宣政殿即正衙殿也朔望大册拜則御之李華賦布大政於宣政淡宸心於紫宸唐同明殿東都薛訥傳突厥擾河北武后詔訥經略對同明殿齊浣傳太子還武后召浣宴同明殿曰朕母子如初卿有力焉六典同明殿在東都集賢殿東唐金華殿東都陳子昂傳武后竒其才召見金華殿唐含樞殿東都狄仁傑傳武后時李楷固駱務整討契丹克之獻俘含樞殿后舉酒屬仁傑賞其知人唐億歲殿東都崔神慶傳武后時待制億歲殿會要玄宗開元十五年閏九月億歲殿生芝草唐觀風殿武后傳徙上陽宫帝率百官詣觀風殿問起居隋宇文愷造觀風行殿唐端扆殿東都會要神龍元年正月二十四日乙亥中宗即位於通天宫端扆殿唐承慶殿甘露殿舊紀中宗景龍二年七月癸亥御承慶殿慮囚徒肅宗上元元年太上皇居西內甘露殿實録景雲二年九月丁酉宴吐蕃使於承慶殿會要大和二年八月修兩儀殿及甘露殿共一百七十二間景龍文館記中宗令諸學士入甘露殿其北壁列書架架前有銀硯碧鏤牙管銀函盛紙六典百福殿之西曰承慶殿兩儀殿之北曰甘露殿見太極宮兩京記百福殿在太極宫中公主院西承慶殿又在百福殿西唐射殿禮志射前一日大樂令設宫縣之樂鼓吹令設十二按於射殿之庭唐萬春殿千秋殿六典兩儀殿之東曰萬春殿西曰千秋殿唐前殿紀開元二年七月乙未焚錦繡珠玉于前殿回紇傳葉護助破安慶緒肅宗坐前殿召葉護宴且勞之姚崇傳玄宗尊遇崇每見便殿必為之興去輒臨軒以送循吏傳刺史受命日對便殿賜衣物乃遣唐金鑾殿李白傳天寶中賀知章言之召見金鑾殿論當世事奏頌一篇賜食親為調羮衛次公傳貞元末與鄭絪皆召金鑾殿建議立順宗宦者傳劉正亮惡王叔文勸順宗立廣陵王為太子監國召學士李程王涯等至金鑾殿草制議者美其忠陸扆傳天子金鑾作賦命學士和扆先成兩京記大明宫紫宸殿北曰蓬萊殿其西曰還周殿還周西北曰金鑾殿長安殿在金鑾殿西南蓬萊殿西龍首山支隴起平地上有殿名金鑾殿在蓬萊正西微南殿旁坡名金鑾坡翰林故事韋執誼置學士院後又置東學士院於金鑾坡殿在學士院之左蓋近寢殿續翰林志蘇易簡唐制駕在大內則明福門內置學士院駕在興慶宫則金明門內置院德宗移院於金鑾坡上一本亦云德宗召學士對浴堂門又移學士院於金鑾殿西對御起草賦詩會要學士院在銀臺門內又置東翰林院於金鑾殿西德宗造院金鑾坡上即坡别建一院開元之院原不廢恐續志誤謂之移五代會要殿因金鑾坡以為名與翰林院相接六典大明宫有金鑾殿藝文志雜史類韓偓金鑾密記五卷書目一卷李白詩著書獨在金鑾殿拾遺記瀛洲南有金鑾之觀中有寶几唐躍龍殿舊紀天寶十三載三月丙午御躍龍殿門張樂宴羣臣唐長樂殿紀至德二載十一月庚子作九廟神主告享於長樂殿唐興慶殿舊紀乾元元年二月乙巳上御興慶殿奉上皇徽號册唐浴堂殿會要貞元十二年九月德宗謂裴延齡曰所居浴堂殿一棟將壓念易之未能也延齡請以本分錢治殿數十猶不乏况一棟哉又本傳列傳李綘元和中浴堂北廊奏對云云對浴堂殿帝曰比諫官多朋黨論奏不實皆陷謗訕欲黜其尤者綘曰自古納諫昌拒諫亡雖開納奬勵尚恐不至今乃欲譴呵之使直士杜口非社稷之利也帝曰非卿言我不知諫之益又李吉甫讚鄭絪帝坐浴堂殿召學士綘語其故李吉甫圗上河北險要所在帝張於浴堂門韋處厚長慶四年七月於浴堂中諫遊獵及晏起賜銀綵長安志文宗於浴堂門對鄭注於浴堂殿對學士在大明宫蓬萊殿東又别有浴堂院六典無此殿元稹承旨廳壁記曰乘輿奉郊廟則承旨得乘廄馬自浴殿由內朝以從按內朝者紫宸殿也疑在紫宸之東殿在蓬萊殿東即與紫宸殿相屬稹詩曰未勘銀臺契先排浴殿關館本圖浴殿在綾綺殿南在蓬萊殿東唐學士多對浴堂殿李絳之極論中官栁公權濡紙繼燭皆此地也唐延和殿元和殿見甘露見武元衡權德輿栁宗元表唐中和殿清思殿宣和殿敬宗紀長慶四年二月丁未擊鞠于中和殿四月丙申擊鞠于清思殿寶厯二年九月甲戌觀百戲于宣和殿唐會昌殿實録文宗太和四年八月戊辰一云七月庚辰幸梨園會昌殿觀新樂大宴樂五年正月乙巳幸會昌殿奏樂唐咸泰殿蕭后傳開成中正月望夜四年正月丁卯夜帝御咸泰殿然鐙作樂迎三宫太后奉觴進壽玉海卷一百五十九
