body:
  text: 玉海卷一百五十九宋王應麟撰宫室殿上説文堂之髙大者周益公曰宫室取諸大壯貴賤可以通稱特崇庳廣狹有别耳秦孝公強盛時大築冀闕由是天子殿名初見商子定分篇臣侍殿上兵陳殿下後載史記荆軻傳又莊子説劒云入殿門不趨大抵秦制也至始皇併天下殿屋相屬又作甘泉前殿然後殿之名始立漢黃霸丞相府計吏上殿東漢司徒府有大會殿蓋車駕或臨幸會議於此而有殿名非專指屋之髙嚴也燕禮當東霤注人君為殿屋也疏曰漢時殿屋四向流水故舉漢以况周王文選注魏武集荀欣等曰漢制所居曰禁中諸公所居曰省中漢武臺殿李陵傳天漢三年召見武臺注師古曰未央宫有武臺殿三輔舊事武帝於未央宫起高門武臺殿翼奉傳孝文時未央宫無武臺殿漢魯靈光殿東海恭王強傳初魯恭王好宫室起靈光殿甚壯麗是時猶存故詔強都魯注恭王名餘景帝之子殿在今兖州曲阜城中故基東西二十丈南北十二丈高丈餘王延壽遊魯國作靈光殿賦恭王始都下國好治宫室遂因魯僖基兆而營焉遭漢中微自西京之殿皆見隳壞而靈光巋然獨存豈非神明依憑支持以保漢室然其規矩制度上應星宿亦所以永安也奚斯頌僖歌其路寢云云立靈光之祕殿配紫微而為輔承明堂於少陽昭列顯於奎之分野規矩應天上憲觜陬雲楶藻梲龍桷雕鏤據坤靈之寶勢承蒼昊之純殷窮竒極妙棟宇已來未之有兮神之營之瑞我漢室永不朽兮唐元稹曰魯共王餘畫先賢於屋壁以自警漢前殿見未央宫甘泉宫洛陽南宫北宫宣室周曰路寢漢曰前殿樂志凡鼓八員朝賀置酒陳前殿房中朱博傳拜於前殿延登受䇿揚雄傳甘泉賦前殿崔巍兮和氏瓏玲抗浮柱之飛榱兮神莫莫而扶傾後律志天子以冬夏至御前殿史記秦始皇營作朝宫渭南苑中先作前殿漢承明殿承明廬著作庭魏承明門翼奉傳孝文時未央宫獨有承明霍光傳皇太后乃車駕幸未央承明殿嚴助傳為會稽太守數年不聞問賜書曰君厭承明之廬勞侍從之事故出君為郡吏注張晏曰承明廬在石渠閣外直宿所止曰廬揚雄傳孝成時有薦雄文似相如者召雄待詔承明庭注師古曰承明殿在未央宫成紀鴻嘉二年三月雉集承明殿注在未央宫中黃圖未央宫有承明殿著述之所也西都賦又有承明金馬著作之庭大雅宏達於兹為羣啓發篇章校理祕文文選魏曹子建詩謁帝承明廬注陸機洛陽記承明門後宫出入之門張公云魏明帝作建始殿朝會皆由承明門魏應璩詩三入承明廬注直廬在承明門側璩為侍郎常侍侍中漢高門殿列傳汲黯請間見高門注晉灼曰三輔黃圖未央宫中有髙門殿鮑宣為諫大夫上書陛下擢臣巖穴豈徒欲使臣美食大官重髙門之地哉宣又言髙門去省戶數十步求見出入二年未省注晉灼曰髙門殿名也師古曰在未央宫中翼奉上疏曰孝文時未央宫無高門殿三輔舊事武帝於未央宫起髙門武臺殿漢猗蘭殿文選注漢武故事武帝以乙酉年七月七日旦生於猗蘭殿又見洞冥記景帝坐崇芳閣見赤氣如林來蔽戶牖乃改閣為猗蘭殿漢竒華殿承華殿承光殿見建章宫黃圖竒華殿在建章宫旁四海夷狄器服珍寶火浣布切玉刀巨象大雀師子宫馬充牣其中漢武故事七月七日上於承華殿齋正中忽有一鳥從西方來集殿前東方朔曰此西王母欲來也有頃王母至二青鳥夾侍文選注潘嶽關中記曰未央殿東有鴛鸞殿漢玉堂殿揚雄傳解嘲歷金門上玉堂注晉灼曰黃圗有大玉堂小玉堂殿漢宫閣名曰長安有玉堂殿銅柱殿李尋傳久汙玉堂注師古曰玉堂殿在未央宫選注引黃圗同翼奉傳上疏曰孝文時未有玉堂殿至武帝有之谷永傳抑損椒房玉堂之盛寵注玉堂嬖幸之舍黃圗玉堂殿在未央宫殿西漢書建章宫南有玉堂璧門玉層臺髙三十丈玉堂殿內十二門階陛皆玉為之鑄銅鳯髙五尺飾黃金栖屋上下有轉樞向風若翔椽首薄以璧玉飾之因名曰璧門又建章有玉堂與未央前殿等去地十二丈戺基皆用玉西都賦金華玉堂西京賦神仙長年宣室玉堂麒麟朱鳥龍興含章注皆殿名譬衆星之環極云云靈帝紀中平三年復修玉堂殿鑄銅人四黃鍾四及天祿蝦蟆洛陽宫殿名有玉堂前後殿漢函德殿宣紀神爵元年三月詔曰乃元康四年嘉穀元稷降于郡國神爵仍集金芝九莖産于函德殿銅池中黃圗建章宫有函德等二十六殿漢鳯皇殿又見未央宫溫室殿見室類郊祀志宣帝幸河東之明年神爵二年正月鳯皇集𤭔𤭔於所集處起步夀宫間嵗鳯皇神爵甘露降集京師其冬四年十二月鳯皇又集上林乃作鳯皇殿以答嘉瑞明年正月改元五鳯宣帝時鳯皇下郡國凡五十六所翼奉傳孝文時未央宫無髙門武臺麒麟鳯皇白虎玉堂金華之殿黃圗未央宫有鳯皇飛羽通光等殿關中記未央殿東有鳯皇殿鴛鸞殿西京賦鳯皇鴛鸞注皆後宫别名漢白虎殿杜欽傳兼成紀谷永傳建始三年冬十二月舉直言極諫之士四年夏四月復召直言之士杜欽谷永詣白虎殿對䇿注師古曰此殿在未央宫中王商傳河平四年紀春正月單于來朝引見白虎殿丞相王商坐未央庭中單于拜謁商起離席與言單于仰視商貌大畏之遷延却退天子聞而歎之曰此真漢相矣翼奉傳文帝時未央宫又無髙門武臺麒麟鳯皇玉堂白虎金華之殿獨有前殿曲臺漸臺宣室溫室承明耳外戚傳成帝時楚梁王來朝明旦當辭去上宿供張白虎殿王莽傳大置酒未央宫白虎殿勞賜將帥自前殿南下椒除西出白虎門桓子新論與揚子雲奏事坐白虎殿廡下選注引之黃圖未央宫有白虎殿廟記云未央宫有白虎閣西都賦白虎麒麟後廣平王羡傳建初四年羡與諸儒講論於白虎殿此後漢殿在東都乂兩都襲其名蓋漢家右文之地後漢甘泉有白虎觀漢昭陽殿曲臺殿見臺類飛羽殿西都賦昭陽獨盛隆於孝成屋不呈材墻不露形注昭陽殿名趙后傳皇后既立寵少衰而弟絶幸為昭儀居昭陽舍其中庭彤朱而殿上髹漆砌皆銅沓冒黃金塗白玉階壁帶往往為黃金釭函藍田璧明珠翠羽飾之自後宫未嘗有焉又見後宫元后傳饗飫飛羽或作雨注飛羽殿在未央宫中漢金華殿敘傳成帝時大將軍王鳯薦班伯宜勸學召見宴昵殿親戚宴飲會同之殿拜為中常侍時上方鄉學鄭寬中張禹朝夕入説尚書論語於金華殿中詔伯受焉數年金華之業絶翼奉傳孝文帝時未央宫無金華殿黃圖未央宫有金華殿西都賦金華玉堂注黃圖曰未央宫有金華殿大玉堂殿漢紫殿成紀永始四年春正月行幸甘泉郊泰畤神光降集紫殿西京雜記成帝設雲帳雲幄雲幕於甘泉紫殿世謂三雲殿張臨登閣殿漢麒麟殿董賢傳上置酒麒麟殿賢父子親屬宴飲翼奉傳孝文時未央宫無麒麟殿西都賦白虎麒麟注黃圖在未央宫西京賦麒麟朱鳥龍興含章注皆殿名譬衆星之環極漢明光殿詳見宫類漢官儀尚書奏事於明光殿省中以丹朱漆地故曰丹墀尚書伏其下奏事黃門侍郎揖疏受事三秦記桂宫中有明光殿皆金玉珠璣為簾箔金戺玉階晝夜光明唐樊鑄有明光殿粉壁賦漢清涼殿延清室黃圖清涼殿夏居之則清涼也亦曰延清室漢書曰清室中夏含霜即此見七啓云漢書誤西都賦清涼宣溫注黃圖曰未央宫有清涼殿許昌宫賦魏卞蘭有望舒涼室羲和溫房彼避暑九成而忘其親生涼殿閣而忘其民心移於物賢君所當戒也漢臨華殿成紀永始四年四月癸未長樂臨華殿未央宫東司馬門災漢百官朝會殿司徒府大會殿詳見朝儀類周禮稿人掌共外內朝冗食者之食注外朝司寇斷獄弊訟之朝也今司徒府中有百官朝會之殿云天子與丞相舊決大事焉是外朝之存者與朝士掌建邦外朝之法注今司徒府有天子以下大會殿亦古之外朝正義云以漢法説之小宗伯凡王之會同軍旅甸役之禱祠肄儀為位注謂若今時肄司徒府也小宗伯主其位黃霸傳張敞奏曰丞相請雜問郡國上計長吏其對有舉孝悌者為一輩先上殿師古曰丞相所坐屋也舉而不知人數者次之不為條教者在後西都賦朝堂百僚之位蕭曹魏邴謀謨其上百官志云云注司徒司空二府光觀壯麗古今注曰永平十五年更作太尉司徒司空府開陽城門內蔡質漢儀曰司徒府與蒼龍闕對厭於尊者不敢號府應劭曰不然丞相舊位在長安時府有四出門隨時聽事明帝欲依之迫於太尉司空但為東西門耳國每有大議天子車駕親幸其殿殿西王侯以下更衣併存每歲州郡聽採長吏臧否民所疾苦還條奏之是謂舉謡言舉謡言者掾屬令史都會殿上主者大言某州郡行狀周禮有外朝干寶注曰禮司徒府中有百官朝會殿與鄭注同律厯志熹平四年馮光陳晃言厯元不正乙卯詔書下三府與儒林明道者詳議以羣臣會司徒府議注蔡雍集載三月九日百官會府公殿下東面校尉南靣侍中郎將大夫千石六百石重行北面議郎博士西靣戶曹令史當中坐而讀詔書公議蔡雍前坐侍中西北近公卿與光晃相難問是非焉趙一傳光和元年司徒袁逢受計計吏數百人皆拜伏庭中耿秉傳每公卿會議常引秉上殿訪以邉事多簡帝心漢未央之內為內朝未央之外為治朝司徒府大會殿為外朝晉令有朔望集公卿於朝堂而論政事漢却非殿光武紀建武元年冬十月癸丑車駕入洛陽幸南宫却非殿遂定都焉注雒陽宮閣名有却非殿洛陽故宮名曰洛陽有却非門漢宣德殿馬援傳建武四年冬囂使援奉書洛陽援至引見於宣德殿東觀記曰敕令中黃門引入時上在宣德殿南廡下袒幘坐世祖迎笑謂援曰云云又援鑄馬式上之詔置於宣德殿下黃圗未央宫有宣德殿此係西京王閎帶劍至宣德殿後闥漢陽明殿會稽典録嚴遵字子陵建武五年詔召遵設樂陽明殿命宴會暮留宿其夜客星犯天子宿隸釋國三老袁良碑云拜梁相帝御九龍殿引對漢南宫前殿光武紀建武十四年正月起南宫前殿五行志南宫長秋和歡殿漢邯鄲溫明殿耿弇傳光武居邯鄲宫晝卧溫明殿弇入造牀下請間注趙王如意之殿也故基在今潞州邯鄲縣內漢德陽殿朝賀禮儀志每月朔歲首為大朝受賀儀夜漏未盡七刻鐘鳴受賀及贄公侯璧中二千石二千石羔千石六百石鴈四百石以下雉百官賀正月二千石以上上殿稱萬歲舉觴御座前司空奉羮大司農奉飯奏食舉樂百官受賜宴饗大作樂其每朔惟十月旦從故事者髙祖定秦之月元年歲首也注蔡質漢儀曰正月旦天子幸德陽殿臨軒公卿將大夫百官各陪朝賀蠻貊胡羌朝貢畢見屬郡計吏皆陛覲庭燎宗室諸劉雜會萬人以上大官賜食酒御史四人執法殿下虎賁羽林弧弓撮矢陛戟左右戎頭逼脛啓前向後左右中郎將住東西羽林虎賁將東北五官將中央悉坐就賜作九賓徹樂鐘磬並作樂畢作魚龍曼延小黃門吹三通謁者引公卿羣臣以次拜罷德陽殿周旋容萬人陛髙一丈皆文石作壇激水殿下畫屋朱梁玉階金柱刻鏤作宫掖之好厠以青翡翠一柱二帶韜以赤緹天子正旦節會朝百僚于此雒陽宫閣簿云南北行七丈東西行三十七丈四尺晉樂志鐸舞歌幡舞歌各一篇鼓舞伎六曲並陳於元會後漢正旦天子臨德陽殿受朝賀晉禮志漢武帝雖用夏正至於十月朔猶常享會大作樂如元正之儀其儀同後漢志鍾離意傳德陽殿成百官大會明帝思意言謂公卿曰鍾離尚書在此殿不立注漢宫殿名北宫中有德陽殿明帝紀永平八年十月北宫成孔僖傳延光元年河西大雨雹安帝召孔季彥見於德陽殿親問其故順紀孫程等迎濟隂王順帝於德陽殿注漢官儀曰崇賢門內西鍾下即帝位近臣尚書以下從輦到南宫登雲臺召