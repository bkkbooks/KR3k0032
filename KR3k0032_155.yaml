body:
  text: 玉海卷一百五十五宋王應麟撰宫室宫一白虎通謂黃帝作宫室世本謂禹作宫室爾雅謂宫穹也屋見垣上穹穹然古者貴賤所居皆得稱宫至秦漢以下乃定為至尊所居之稱黃帝合宫東京賦黃帝合宮注尸子曰欲觀黃帝之行於合宫文中子問易篇黃帝有合宫之聽初學記云見管子穆天子傳吉日辛酉天子升於崐崘之丘觀黃帝之宫選注引之五帝法宫晁錯傳五帝神聖處于法宫之中明堂之上動靜上配天下順地中得人注如淳曰法宫路寢正殿也堯成陽宫室漢地理志昔堯作游成陽注如淳曰成陽在定陶師古曰作游者言為宫室游止之處六韜帝堯王天下宫垣屋室不堊甍桷椽楹不斵茅茨徧庭不剪揚雄曰木摩而不彫牆塗而不畫周宣所考盤庚所遷夏早宫室唐虞採椽三等之制嚴助相貌經堯垂貝殻於撝宫堯宫貳官世本堯使禹作宫帝王世紀堯見舜處於貳宫孟子舜館于貳室文選曲水詩序接禮貳宫有虞氏宫莊子外篇知北遊仲尼曰有虞氏之宫湯武之室易繫辭宫室取大壯論語禹卑宫室湯鑣宫殷王宫墨子天命湯於鑣宫初學記云湯所受命之宫有神來告曰夏德大亂徃攻之予必使汝大戡之文選注引之禮冬宫匠人殷人重屋四阿重屋注重屋者王宫正堂若大寢也四阿若今四注屋重屋復笮也疏燕禮云設洗當東霤則此四阿四霤者也明堂位重檐注重承壁材也周王宫東宫西宫北宫蒿宫中興宫室天官宫伯中士二下士四掌王宫之士庶子凡在版者宫正上士二中士四下士八掌王宫之戒令糾禁以時比宫中之官府次舍之衆寡為之版以待夕擊柝而比之宫人中士四下士八掌王之六寢之修注路寢一小寢五疏路寢制如明堂以聽政師氏司朝僕臣正位小宰掌治王宫之政令凡宫之紏禁乃退以宫刑憲禁于王宫内宰治王内之政令㑹内宫之財用憲禁令于王之北宫注北宫后之六宫閽人掌守王宫之中門之禁考工記匠人營國方九里旁三門國中九經九緯經涂九軌左祖右社面朝後市注王宫所居也市朝一夫注方各百步室中度以几堂上度以筵宫中度以尋野度以步涂度以軌廟門容大扄七个闈門容小扄參个路門不容乗車之五个應門二徹參个内有九室九嬪居之外有九室九卿朝焉九分其國以為九分九卿治之王宫門阿之制五雉宫隅之制七雉城隅之制九雉經涂九軌環涂七軌野涂五軌門阿之制以為都城之制宫隅之制以為諸侯之城制環涂以為諸侯經涂野涂以為都經涂三禮義宗天子宫方一千二百步三分四為路寢之前一為路寢之後五門之間合八百步為三朝皆方百步故用市朝皆百步路寢以後四百步為寢室大戴禮周時德澤和洽蒿茂大以為宫柱名曰蒿宫此天子之路寢也不齋不居其屋待朝在南宫揖朝出其南門周書本典解第五十七維四月既生魄王在東宫召公告周公淮南子周公踐東宫注太子宫也左傳虢公為王宫于玤文公作王宫于踐土唐韋温傳舊周文王為太子雞鳴問安西宫漢劉向傳宣王中興更為儉宫室小寢廟詩人美之斯干之詩是也漢五行志董仲舒以為西宫小寢夫人之居左氏以為西宫公宫也東宫太子所居周六宫六寢天官宫人掌王之六寢之修注路寢一小寢五玉藻曰朝辨色始入君日出視朝退適路寢聽政使人視大夫大夫退然後適小寢釋服是路寢以治事小寢以時燕息焉疏諸侯三寢路寢一燕寢一側室一寺人王之正内五人注正内路寢北冬官匠人疏案書傳云周人路寢南七雉東西九雉室居二雉内宰以陰禮教六宫憲禁令于王之北宫注鄭司農云六宫後五前一康成謂六宫謂后也婦人稱寢曰宫后象王立六宫而居之亦正寢一燕寢五教者不敢斥言之若今稱皇后為中宫矣北宫后之六宫㑹内宫之財用疏云六官之内内小臣注陰令王所求為於北宫疏言北宫者王六寢在南后六宫在北春官世婦每宫卿一人下大夫四人中士八人注后宫官也王后六宫記昏義古者天子后立六宫三夫人九嬪二十七世婦八十一御妻以聽内治明章婦順注天子六寢而六宫在後六宫在前所以承副施外内之政也三夫人以下百二十人周制也疏六宫在王之六寢之後亦大寢一小寢五九嬪以下亦分居之三夫人雖不分居六宫亦分主六宫之事或二宫則一人也六卿之官在王六寢之前三孤亦分主六宫之職緫謂九卿考工記云外有九室九卿朝焉公羊傳西宫者何小寢也有西宫則有東宫矣注夫人居中宫魯子曰諸侯有三宫何休注天子諸侯皆有三寢曰高寢路寢小寢詩正義譜云路寢之常樂風之正經天子以周南諸侯以召南是天子諸侯皆有房中之樂也斯干箋云宗廟及路寢制如明堂則天子路寢有五室無左右房矣此路寢之樂謂路寢之下小寢之内作之非於正寢作樂也玉藻云云是路寢以聽政政小寢以燕息樂實不在路寢譜云路寢房中者以小寢是路寢之下室天子小寢如諸侯之路寢故得有左右房斯干西南其戸箋云天子之寢左右房異於一房者之室户也路寢制如明堂書疏寢有東夾西夾曲禮注周禮女御以御序王之燕寢疏王有六寢一是正寢餘五寢在後東西南北中央各一順四時居之六月居中央通名燕寢始於家邦終於四海故刪詩以后妃為首明堂位正義天子宫内有路寢故應門之内有路門明堂内無路寢故無路門及以外諸門但有應門耳蟲飛而㑹盈日出而視朝朝退而路寢聽政日中而考政夕而糾䖍天刑日入而㓗奉粢盛后妃御見有度應門擊柝鼓人上堂女史授環彤管記過貢禹曰古者宫室有制牆塗而不琱木摩而不刻公食大夫禮司宫具几與蒲筵注司宫大宰之屬掌宫廟者也䟽燕禮注司宫天子曰小宰與此不同彼是設尊此設几席大宰之下有宫人即此司宫諸侯兼官司宫兼小宰也周閟宫禖宫周禮大司樂乃奏夷則歌小吕舞大濩以享先妣注姜嫄也姜嫄履大人跡感神靈而生后稷是周之先母也周立廟自后稷為始祖姜嫄無所配是以特立廟而祭之謂之閟宫詩閟宫頌僖公能復周公之宇也閟宫有侐實實枚枚赫赫姜嫄其德不囬上帝是依無灾無害彌月不遲是生后稷降之百福注云閟閉先妣姜嫄之廟在周常閟而無事孟仲子曰是禖宫也侐清靜實實廣大也枚枚礱密也周酆宫左傳昭四年六月丙午楚合諸侯于申椒舉曰康有酆宫之朝注酆在始平鄠縣東有靈臺康王於是朝諸侯詩文王有聲箋文王作邑於豐立宫室豐邑在豐水之西續漢志右扶風鄠縣豐水出注引左傳長安志豐宫文王宫也詩曰既伐于崇作邑于豐宫在雍州鄠縣東三十五里括地志元和志同詩思齊雝雝在宫穆天子傳天子作居范宫注離宫之名紀年穆王元年築祇宫於南鄭初學記鄭宫春宫見紀年穆王所居宫爾雅釋文竹書穆天子傳西王母來賔昭宫魯南宫泮宫見學校申公傳漢興高祖過魯申公以弟子從師入見于魯南宫史記正義括地志云泮宫在兖州曲阜縣西南二百里魯城内宫之内鄭云泮之言半也其制半於天子之璧雍齊雪宫孟子齊宣王見孟子於雪宫劉熙曰離宫之名説苑齊有梧宫秦祈年宫漢志右扶風雍秦惠公都之有槖泉宫孝公起祈年宫惠公起史記正義蘄年宫在岐州城西故城内棫陽宫昭王起陳倉有羽陽宫秦武王起好畤有梁山宫始皇起史記三十五年幸梁山宫即此也虢有虢宫秦宣太后起史記正義三秦記云霸城秦穆公築為霸宫漢於此置霸陵縣史記騶衍如燕昭王築碣石宫身親往師之作主運劉向别録云鄒子書有主運篇後漢志汝南城父有章華臺注杜預曰章華宫在華容縣城内漢雒陽南宫後漢見下高祖紀五年二月甲午即位西都雒陽五月置酒雒陽南宫上曰吾所以有天下者能用三傑六年十二月至雒陽正月壬子上居南宫張良傳云上居雒陽南宫從複道上見諸將徃徃耦語用張良計三月置酒南宫封雍齒七年四月行如雒陽魏畧漢火行忌水故洛去水而加佳魏於行次為土土水之牡也故變雒為洛地理志注師古引魚豢曰云云如魚氏説則光武以後改為雒括地志南宫在雒州雒陽縣東北二十六里洛陽故城中大事記高祖置酒雒陽南宮注輿地志云秦時巳有南北宫更始自洛陽而西馬奔觸北宫鐵柱門光武幸南宫却非殿則自高帝迄于王莽洛陽南北宫武庫皆未嘗廢車千秋子為雒陽武庫令趙涉勸周亞夫抵雒陽直入武庫葢秦雖都關中猶放周東都之制建宫闕於雒陽漢長樂宫長信宫又見下朝儀屯衛紀高祖五年五月車駕西都長安後九月徙諸侯子關中治長樂宫史記七年二月宫成丞相已下徙治長安十年十月淮南梁燕荆楚齊長沙王皆來朝長樂宫正義長樂宫在長安縣西北十五里惠帝四年長樂宫鴻臺灾宣帝即位元平元年十一月壬子皇太后歸長樂宫初置屯衛吕后紀有長樂衛尉元康四年三月神爵集長樂未央北宫高寢甘泉泰畤殿中及上林苑五鳳三年三月辛丑鸞鳳又集長樂宫東闕中樹上張晏曰門外闕内行馬之裏樹也成帝永始四年四月長樂臨華殿灾功臣表陽城延為少府作長樂宫叔孫通傳十月漢七年長樂宫成諸侯羣臣朝因行朝儀惠帝四年為東朝長樂宫及間往數蹕煩民作複道方築武庫南通奏事乃詔立原廟鄒陽傳梁孝王嘗上書願賜容車之地徑至長樂宫自使梁國士衆築作甬道朝太后公孫玃見梁王曰能歴西山徑長樂抵未央攘袂而正議者獨大王耳東方朔傳武帝微行齎五日糧㑹朝長信宫注太后之宫也漢表有長信少府注曰太后所居宫名也居長信則曰長信少府居長樂則曰長樂少府後漢都洛陽亦有長信官長樂官又有長秋宫劉屈氂傳太子敺四市人至長樂西闕下逢丞相軍合戰魏相傳高帝所述書天子所服第八曰大謁者臣章受詔長樂宫令羣臣議王后傳載至長樂宫謁太后許后五日一朝太后於長樂官元后傳漢傳國璽藏長樂宫後鄧太后紀元初五年平望侯劉毅以太后多德政欲令早有記注乞史官著長樂宫注從之匽皇后紀宫曰永樂置大僕少府以下皆如長樂宫故事注漢官儀曰帝祖母稱長信宫帝母稱長樂宫後曰永樂宫馬廖傳皇太后躬履節儉廖慮美業難終上疏長樂宫以勸成儉徳黄圖長樂宫本秦之興樂宫也髙祖始居櫟陽七年長樂宫成徙居長安城三輔舊事宫殿疏皆曰興樂宫秦始皇造漢修飾之周囘二十餘里前殿東西四十九丈七尺兩序中二十五丈深十二丈有鴻臺臨華殿温室殿長信宫長秋永壽永寧等四殿又曰長樂宫有椒房殿有鍾室闗中記宫中有殿十四髙帝始居此宫後太后常居之有衛尉在長安城中近東直杜門水經杜門北對長樂城南東來第一門也孝恵至平帝皆居未央惟高帝居此官也王莽改長樂宫為長樂室坤元録漢長樂宫在長安縣北故城中元和志長樂宫在長安縣西北十五里一作在縣十四里長安志史記曰始皇二十七年作長信宫又成帝母王皇后居長信宫班媫妤賦求共養於東宫兮託長信之末流黃圖曰從路門至周廟門有長信宫在其中隋志京兆郡大興有長樂宫三輔故事漢徙秦金狄寘長樂大厦殿前後漢初未央已焚故更始居長樂朝羣臣長安志長樂有宣德通光高明長秋永壽永寧長亭林華温室建始廣陽中室月室神仙椒房大夏殿惠帝自未央朝長樂武帝曰東朝廷辨之七國反景帝徃來東宫謀於太后則長樂多為母后所居矣水經曰殿西有長信長秋永壽永昌等殿則長信長秋皆在長樂宫也長樂者高帝既以為居又以受朝無異於正宫矣自惠帝後人主皆居未央而長樂常奉母后唐亦有長樂宫韋雲起迎謁高祖于長樂宫然非太后之居未央在漢城西隅而長樂乃東隅也秦樗里子百年前巳言之李吉甫元和志言兩宫相去止隔一里此一里所即武庫漢未央宫前殿東北闕東西宫紀高祖七年史記八年上擊韓王信還二月至長安蕭何治未央宫立東闕北闕前殿武庫太倉上見其壯麗甚怒曰天下匈匈勞苦數歲成敗未可知奈何治宫室過度也何曰天下方未定故可因以就宫室且天子以四海為家非令壯麗亡以重威且亡令後世有以加也上說自櫟陽徙都長安九年冬十月淮南梁趙楚王朝未央宫置酒前殿上奉玉巵為太上皇壽羣臣皆稱萬歲大笑為樂惠帝四年七月未央宫凌室織室災吕后八年朱虛侯從勃請卒千人入未央宫掖門注非正門而在兩旁文帝即位夕入未央宫還坐前殿七年六月未央宫東闕罘罳災景帝中五年八月未央宫東闕災五行志武帝太初元年十一月未央宫柏梁臺災昭帝元鳳二年四月上自建章宫徙未央宫大置酒宣帝入未央宫見皇太后羣臣奏上璽綬即位元康元年三月詔曰甘露降未央宫四年三月詔曰神爵集未央郊祀志甘露元年夏建章未央長樂宫鍾簴銅人生毛時以為美祥又因方士言為隨侯劒寳玉寳璧周康寳鼎立四祠於未央宫中成帝建始元年六月未央官殿中朝者坐注服䖍曰公卿以下朝㑹坐也晉灼曰内朝臣之朝坐三年秋關内大水虒上小女走入橫城門闌入尚方掖門至未央宫鈎盾中王商傳建始三年秋京師民無故相驚言大水至天子親御前殿召公卿議十二月地震未央宫永始四年四月未央宫東司馬門灾五行志未央宫帝所居也功臣表陽城延為少府作未央宫列傳翼奉上疏曰孝文時未有甘泉建章及上林中諸離宫館也未央宫又無高門武臺麒麟鳳皇白虎玉堂金華之殿獨有前殿曲臺宣室温室承明耳李廣入為未央衛尉程不識時亦為長樂衛尉灌夫丞相蚡謂曰程李俱東西宫衛尉注孟康曰李廣為東宮程不識為西宫范明友鄧廣漢東西宫衛尉衛太子使舍人持節夜入未央宫殿長秋門發長樂宫衛霍光召丞相御史將軍列侯中二千石大夫博士㑹議未央宫趙充國以功德與霍光等列畫未央宫中王商為丞相河平四年單于見白虎殿丞相坐未央廷中單于拜謁朱博為丞相趙元為御史大夫並拜於前殿延登受冊傅昭儀傳哀帝即位王太后詔令傅太后丁姬十日一至未央宫孔光傳北宫有紫房複道通未央宮傅太后果從複道朝夕至帝所孝平后傳便時上林延壽門入未央宫前殿羣臣就位行禮後紀順帝永和二年十月庚子幸未央宫㑹三輔郡守都尉及官屬勞賜作樂西京雜記漢髙帝七年蕭相國營未央宫因龍首山制前殿建北闕未央宫周迴二十二里九十五步五尺街道周迴七十里臺殿四十三其三十二在外其十一在後宫池十三山六池一山一亦在後宫門闥凡九十五黃圖未央宮周囬二十八里前殿東西五十丈深十五丈高三十五丈一云三丈五尺前殿曰路寢見羣臣諸侯處也營未央宫因龍首山以制前殿潘岳關中記曰未央官殿皆疏龍首山上作之山長六十里秦時有黑龍從南山出飲渭水其行道因成土山西京賦所謂疏龍首以抗殿是也至孝武以木蘭為棼橑文杏為梁柱金鋪玉戸華榱璧璫彫楹玉磶重軒鏤檻青瑣丹墀漢官典職曰丹漆地稱丹墀左墄右平有宣室麒麟金華承明武臺鈎弋等殿又有殿閣三十有二壽成萬歲廣明椒房清涼永延玉堂壽安平就宣德東明飛羽鳳皇通光曲臺白虎等殿増城昭陽延平合歡囬東宣明長年温室昆德承明等殿玉臺增盤閣麒麟天祿閣金馬青瑣門畫堂甲觀非常室按舊圖云王莽改未央宫曰壽成室前殿曰王路堂漸臺織室凌室見惠紀皆在未央宫中注一本宣室温室清涼在未央殿北宣明廣明在未央殿東昆德玉堂在未央殿西其中又有麒麟金華承明殿石渠天祿麒麟閣金馬青瑣門元武蒼龍二闕畫堂朱省堂甲觀非常室又宣室閣見甘露四年鉤盾中見建始三年水經注渭水逕長安城北又東合昆明故渠故渠東逕未央宫北蕭何斬龍首山而營之山長六十餘里頭於渭尾達樊川頭高二十丈尾漸下高五六丈土色赤而堅北有元武闕即北闕也東有蒼龍闕闕内有閶闔止車諸門未央殿東有宣室玉堂麒麟含章白虎鳳凰朱雀鵷鸞昭陽諸殿天祿石渠麒麟三閣未央宫北即桂宫也周十餘里内有明光殿走狗臺柏梁臺舊乗複道用相逕通故渠出二宫之間謂之明渠明渠又東歴武庫北舊樗里子葬於此漢長樂宫在其東未央宫在其西武庫直其墓明渠又東逕漢長樂宫北本秦之長樂宫也周二十里殿前列銅人殿西有長信長秋永壽永昌諸殿詩正義未央者前限未到之辭故漢有未央宫古詩有樂未央史記正義括地志云未央宫在雍州長安縣西北十里長安故城中元和志同十四里史大事記高九年未央宫成置酒前殿太上皇輦上坐僝工於八年訖事於九年說文序孝平時召爰禮等百餘人令說文字未央廷中夏侯勝傳宣帝初議廟樂羣臣大議廷中闕門觀也劉熈釋名云闕在門兩旁中央闕然為道也門闕天子號令賞罰所從出也東闕長安志漢書曰高祖七年蕭何立文帝七年六月未央宫東闕罘罳災師古曰罘罳為連闕曲閣也以覆重刻垣墉之處其形罘罳然一曰屏也罘音浮北闕長安志漢書顔師古曰未央殿雖南嚮而上書奏事謁見之徒詣北闕公車司馬亦在北焉是則以北闕為正門而又有東門東闕至於西南兩面無門闕矣葢蕭何立宫以厭勝之術關中記曰未央宫東有蒼龍闕北有元武闕所謂北闕也闕中有閶闔門止車門廟記曰未央宫有白虎闕屬車闕西都賦其宫室也體象天地經緯陰陽據坤靈之正位倣太紫之圓方注七畧曰明堂之制内有太室象紫微南出明堂象太微植中天之華闕豐冠山之朱堂因瓌材而究竒抗應龍之虹梁彫玉填以居楹裁金璧以飾璫上林賦曰華榱璧璫左墄右平重軒三階閨房周通門闥洞開列鍾簴於中庭立金人於端闈徇以離宫别寢承以崇臺閒館煥若列宿紫㣲是環清涼宣温神仙長年金華玉堂白虎麒麟區宇若兹不可殫論增盤崔嵬登降炤爛殊形詭制每各異觀西京賦覽秦制跨周法正紫㣲於未央注辛氏三秦記曰未央宫一名紫㣲宫表嶢闕於閶闔注閶闔紫微宮門名閶三秦記未央官有堯閣闔疏龍首以抗殿狀巍峩以岌嶪亘雄虹之長梁結棼橑以相接飾華榱與璧璫流景曜之韡曄雕楹玉磶繡栭雲楣三階重軒鏤檻文㮰右平左墄青瑣丹墀重門襲固姦宄是防仰福帝居陽耀陰藏洪鍾萬鈞猛虡趪趪朝堂承東温調延北西有玉臺聯以昆德長年神仙宣室玉堂麒麟朱鳥龍興含章衆星環極赫戲煇煌正殿路寢用朝羣辟大夏耽耽九戸開闢注九室室有一戸高門有閌列坐金狄三輔故事大夏殿始皇造銅人十枚在殿前東京賦高祖因秦宫室作洛之制我則未暇西匠營宫目翫阿房損之又損然尚過於周堂觀者狹而謂之陋帝已譏其泰而不康晉義熙十三年劉𥙿克闗中九月大㑹文武於未央殿石虎建武十一年城長安未央宫漢櫟陽宫紀高帝二年十一月還歸都櫟陽地理志左馮翊櫟陽秦獻公自雍徙六月還櫟陽壬午立太子令諸侯子在關中者皆集櫟陽為衛蕭何傳守闕中侍太子治櫟陽六年三月上歸櫟陽五日一朝太公五月丙午詔曰子有天下尊歸於父尊太公曰太上皇七年二月至長安蕭何治未央宫自櫟陽徙都長安唐盧懷慎傳高祖受命五日一朝太公於櫟陽宫漢沛宫高紀十二年冬十月上破黥布軍於㑹缶注蘄縣鄉名還過沛留置酒沛宮悉召故人父老子弟佐酒發沛中兒得百二十人教之歌酒酣上擊筑自歌起舞忼慨傷懷泣數行下謂沛父兄曰游子悲故鄉吾雖都關中百歲之後吾魂魄猶思沛其以沛為朕湯沭邑復其民世世無有所與沛父老諸母故人日樂飲極歡道舊故為笑樂十餘日乃去沛中空縣皆之邑西獻上留止張飲三日并復豐比沛禮樂志孝惠時以沛宮為原廟令歌兒習吹相和以百二十人為員哀帝時孔光定鼓員十二人光武紀幸沛祠高原廟肅宗紀章和元年幸梁遣使祠沛高原廟豐枌榆社與太宗幸武功故宫光武置酒南陽舊宅相類蓋延傳建武二年延定沛修高祖廟置嗇夫祝宰樂人括地志沛宫故地在徐州沛縣東南二十里一步史記正義十三州志云漢興四年改泗水為沛郡理相城故以沛為小沛括地志云泗水亭在徐州沛縣東一百步有高祖廟周庾信作置酒沛宫賛栁宗元漢原廟銘曰原廟沛宫之舊也祀蚩尤於是庭而赤精降導靈命於是邦而羣雄至登布衣於萬乗而子孫得以纉其緒化環堵為四海而黎元得以安其業基岱岳之高源洪河之長蓄靈擁休此焉發跡或云班固為碑宗元為銘漢黃山宫地理志右扶風槐里有黃山宫孝惠二年起在澇水入渭之下渭在宮南黃圖黃山宫在興平縣西三十里元和志云西南武帝㣲行西至黃山宫即此見東方朔傳元后傳太后秋歴東館望昆明集黃山宫注在槐里冬饗飫飛羽殿在未央宫中羽或作雨校獵上蘭觀在上林中登長平館臨涇水而覽焉水經渭水東北逕黃山宫南西京賦上林禁苑繞黃山而欵牛首漢甘泉宫竹宫前殿紫殿雲陽宫林光宫明庭宫紀文帝三年五月十年冬幸甘泉注師古曰甘泉在雲陽本秦林光宫武帝元鼎四年六月得寳鼎以禮祠迎至甘泉蔵帝庭合明應五年十一月辛巳朔旦冬至立泰畤于甘泉天子親郊見朝日夕月漢儀注郊泰畤皇帝平旦出竹宫東向揖日其夕西向揖月不用春秋也晉禮儀志同黄圖甘泉祠宫以竹為宫天子居中漢舊儀竹宫去壇三里天漢四年正月朝諸侯王于甘泉宫太始三年三月行幸甘泉宫饗外國客後元二年正月朝諸侯王于甘泉宫宣帝元康四年三月神爵集甘泉泰畤殿中甘露三年正月黃龍元年正月行幸甘泉匈奴呼韓邪單于稽侯狦來朝匈奴傳甘露三年正月朝天子于甘泉宮元帝初元三年六月詔罷甘泉宫衛令就農成帝永始四年正月幸甘泉郊泰畤神光降集紫殿郊祀志兼紀年月建元三年武帝因齊人少翁拜為文成將軍言作甘泉宫中為臺室畫天地太乙諸鬼神而置祭具以致天神元鼎四年夏六月得鼎汾陰得寶鼎藏於甘泉宫羣臣皆上壽賀公孫卿曰黃帝接萬靈明庭明庭者甘泉也五年冬十月幸甘泉具泰一祠六年冬公孫卿言見仙人迹緱氏城天子幸緱氏元封二年春公孫卿言見神人東萊山天子幸緱氏遂至東萊無所見見大人跡云公孫卿曰仙人可見上往常遽以故不見今陛下為舘如緱氏城置脯棗神人冝可致且仙人好樓居於是上令長安作飛亷桂舘甘泉作益壽延壽二舘使卿持節設具而候神人迺作通天臺置祠具其下於是甘泉更置前殿始廣諸宫室選注因秦林光宫増通天迎風儲胥露寒夏六月有芝生甘泉殿房中史記云防内中天子為塞河興通天若有光云漢舊儀九莖金色緑葉朱實夜有光廼下詔甘泉房中生芝九莖赦天下太初元年春受計甘泉公孫卿曰黃帝就青靈臺十二日燒黃帝乃治明庭明庭者甘泉也方士多言古帝王有都甘泉者其後天子又朝諸侯甘泉甘泉作諸侯邸宣帝神爵元年正月幸甘泉郊見泰畤數有美祥修武帝故事盛車服齊祠之禮頗作詩歌甘露三年正月上郊泰畤因朝單于於甘泉宫黃龍元年正月復幸甘泉郊泰畤又朝單于於甘泉宫元帝即位遵舊儀間歲正月一幸甘泉郊泰畤成帝建始元年十二月徙甘泉泰畤於長安南北郊永始元年三月復甘泉祠禮樂志武帝祠大一於甘泉就乾位也師古曰言在京師之西北正月上辛用事甘泉圜丘昏祠至明夜有神光集祠壇天子自竹宫望拜韋昭曰以竹為宮天子居中師古曰漢舊儀云竹宫去壇三里列傳金日磾母詔圖畫於甘泉宫又圖畫李夫人於甘泉宮上幸林光宫注師古曰林光宫秦二世所造郊祀志注秦離宫名漢又於其旁起甘泉宫括地志秦之林光宫漢之甘泉在雍州雲陽西北八十里劉德數言事召見甘泉宫武帝謂之千里駒翟方進為司直從上甘泉行馳道中既至甘泉宫㑹殿中揚雄孝成帝時方郊祀丼泉泰畤汾陰后土以求繼嗣雄從上丼泉還奏賦以諷文選注漢書曰永始四年正月行幸丼泉七畧曰丼泉賦永始三年正月待詔臣雄上漢書無幸丼泉之文疑七畧誤其辭曰惟漢十世將郊上玄定泰畤云云􅉨􅉨離宫般以相燭兮封巒石關迆靡虖延屬大夏雲譎波詭嶊嶉而成觀翠玉樹之青葱兮璧馬犀之瞵㻞金人仡仡其承鍾虡兮嵌巖巖其龍鱗配帝居之縣圃兮象泰壹之威神洪臺崛其獨出兮㨖北極之嶟嶟列宿乃施於上榮兮日月纔經於柍桭歴倒景而絕飛梁兮浮蔑蠓而撇天左欃槍而右玄冥兮前熛闕而後應門熛赤色覽樛流於高光兮服䖍曰高光宫名溶方皇於西清西箱前殿崔巍兮和氏瓏玲炕浮柱之飛榱兮神莫莫而扶傾乗雲閣而上下兮紛蒙籠以棍成曵紅采之流離兮颺翠氣之宛延排玉戸而颺金鋪般倕棄其剞劂兮王繭投其鉤繩珍臺閒館琁題玉英蜵蜎蠖濩之中齊虖陽靈之宮集虖禮神之囿登乎頌祗之堂度三巒兮偈棠棃増宫㠁差駢嵯峨兮云云甘泉本秦離宫既奢泰武帝復增通天高光迎風宫外近則洪厓旁皇儲胥弩阹逺則石關封巒鳷鵲露寒棠棃師得遊觀屈竒瑰偉師古曰棠棃官在甘泉苑垣外師得宫在櫟陽界其餘皆甘泉苑垣内之宫觀也其為已久非成帝所造欲諫則非時欲黙不能已故遂推而隆之乃上比於帝室紫宫若曰非人力所為儻鬼神可也又是時趙昭儀方大幸每上甘泉常法從王褒甘泉頌甘泉山天下顯敞之處也文選注甘泉山名下有甘泉水因以名之前接大荆後臨北極左撫仁鄉右望素域其宫室也鏤螭龍而造牖采雲氣以為楣神星羅於題鄂虹蜺往往而繞榱想聖主之優游時娛神而欵縱坐鳳皇之堂聽和鸞之弄臨麒麟之域驗符瑞之貢詠中和之歌讀太平之頌本傳元帝為太子喜褒所為洞簫及甘泉頌西京賦注引王褒甘泉頌曰編瑇瑁之文㮰魏都賦注引王褒甘泉賦劉歆賦迴天門而鳳舉躡黃帝之明庭續志大駕公卿奉引大將軍驂乗屬車八十一乗備千乗萬騎西都行祠天郊甘泉備之官有其注名曰甘泉鹵簿服䖍曰大駕八十一乗作三行尚書御史乗之最後一乗揷豹尾以前皆為省中長東方朔别傳武帝幸甘泉平阪朔在屬車中黄圖甘泉宫一曰雲陽宫史記始皇二十七年作甘泉宫及前殿築甬道自咸陽屬之又三十二年為直道道九原通甘泉闗輔記甘泉宫一曰雲陽宫一曰林光宫本秦造在今池陽縣西甘泉山宫以山為名周匝十餘里漢武建元中增廣之周十九里去長安三百里望見長安城黃帝以來員丘祭天處開山圖雲陽先王之墟也武帝造赤闕於南以象方色於甘泉宫更置前殿始廣造宫室有芝生甘泉殿邊房中漢舊儀九莖金色緑葉朱實夜有光乃作芝房歌又起紫殿彫文刻鏤黼黻以玉飾之甘泉有高光宫又有林光宫黄圖又云林光宫縱廣各五里在雲陽縣界有長定宫竹宮通天臺通靈臺武帝作迎風館元封二年後加露寒儲胥二館皆在甘泉中西廂起彷徨觀築甘泉苑建元中作石關封巒鳷鵲觀於苑垣内宫南有昆明池苑南有棠梨宫西都賦冠以九嵕陪以甘泉乃有靈宫起乎其中秦漢之所極觀淵雲之所頌歎注漢宫闕疏曰甘泉林光宫秦二世造西京賦覛往昔之遺館獲林光於秦餘臣賛曰林光秦離宫名處甘泉之爽塏乃隆崇而弘敷既新作於迎風增露寒與儲胥李善注元封二年増託喬基於山岡直墆霓以高居文景常幸甘泉不言有宫恐是林光如故武帝後方増剏一宫耳元和郡縣志甘泉宫武帝以五月避暑於此八月乃還漢傳征和二年夏上辟暑甘泉宫洞㝠記武帝起超仙之臺於明庭宫北明庭者甘泉别名思趙倢伃起通靈臺於甘泉宫漢甘泉宫記唐仲友漢有區夏作都長安封畿之内宫館環列葢數十百所天子以時講事鑾輿行幸各有攸處而文物之盛莫如甘泉葢自孝文迄於元成嘗於此整軍經武祀神考政行慶賞朝㑹之禮非止為清暑也其珍臺閒館增飾崇麗極屈竒偉之觀亦非它宫比當時鴻儒碩生若相如枚臯王褒揚雄之儔從屬車之清塵預觀盛典類能持簡操筆揚厲偉蹟故讃功論德則有子淵之頌主文譎諫則有子雲之賦辭意既盛美矣獨未聞登載本末勒諸金石非闕文歟謹追述而記之曰琁穹垂象躔次彪列營室之東離官辨位王良之南閣道循軌王者憲天御極肇建宸居必有增宫别館以備臨幸夫豈事奢泰以侈遊觀哉葢將隆上都規億載非壯麗亡以重威不軌物何以示訓是以夏都冀方啓有鈞臺之饗周宅鎬京康有酆宫之朝考室之制其來尚矣粤兹靈宫奠居乾維昔帝鴻氏於此接萬靈祭上帝是謂明庭天嘗假力于秦以營宫室是謂林光漢曰甘泉葢因山以更命之也爰自孝文實始巡幸命將撫師克固吾圉稽古禮文我則未暇洎我孝武重熈累洽迺詔共工繕治增益元朔之初則作臺室以畫鬼神元鼎之間則立泰畤以展郊拜延壽通天前殿諸侯王邸又剏於元封太初之際故其繚牆之内宫館相望近則洪厓旁皇儲胥弩阹逺則石關封巒鳷鵲露寒高光迎風起於中棠梨師得接於外光明神麗迤靡連屬紫宫元圃之居不是過也始元朔迄于後元法駕清蹕相繼戾止蒐講墜典靡不在焉受計者一郊泰畤者三朝諸侯王者再外國之客饗於是汾陰之鼎藏於是祠神君賜宗室東封北巡發軔弭節周旋于兹號令文章煥焉可述矣孝宣中興復修故事葢嘗即此四拜泰一再朝呼韓功烈茂盛增光祖宗降及元成猶遵遺業執珪幣以事上帝凡九至焉兹禮樂之所自出徳業之所由著豈與長楊五柞為校獵之地萯陽宣曲置更衣之所窮奢極欲以快心目者同日道哉武宣之世上天降鑒眷顧與宅靈芝産齋房黃雲覆寳鼎路弓獲鹿於中山美光兆祥於泰畤神爵五采萬數翔集神光並見燭曜齋宫滋至之休著於兹宫者史不絕書矣成帝之初丞相御史議罷泰畤則天出警戒風毁作宫暨帝復行薦饗則仍有神光降集紫殿得非斯宫之作克厭帝心哉雖然虒祈築而謗興靈臺作而民附宫室之建禍福之階也則夫垂衣拱手蜵蜎蠖濩之中可不思乎是故飭躬齋精必念夫逆釐三神負扆聽斷必念夫施澤四海四夷君長俯伏渭橋必思夫威德之所加冠裳玉帛羣后咸在必思夫恩禮之所浹神祗降嘏則抑畏自度天戒垂示則恐懼修省夫然故事無過舉方外蒙福宫室之奉可安享也茍不思政事而樂逸游不修典禮而懷宴安則厥鍳不逺在秦皇之世居是宫者甚可畏哉若乃玉樹馬犀金人鍾虡之屬子雲已能賦之至於日磾之母圖於宫中昭儀之寵麗於法從衞尉之罷置郊畤之因革皆不係於作宫之㫖班史具在兹不復書程大昌曰古以甘泉名宫者三秦甘泉在渭南漢甘泉在雲陽磨石嶺上隋甘泉在鄠縣長安志曰磨石嶺有甘泉十道志曰甘泉出石皷西原漢宫在山上即秦林光宫旁取石皷甘泉以名隋宫在鄠縣西南二十里對甘泉谷鄠即夏之扈古有甘亭唐有甘泉鄉惟秦之甘泉史嘗明言在渭之南而無言在渭南何地者始皇紀迎太后于雍入咸陽復居甘泉宫括地志秦甘泉官去長安三百里望見長安徐廣曰表云咸陽南宫秦時咸陽跨渭南北則此宫在渭南又曰章臺上林皆在渭南自極廟道通酈山作甘泉前殿築甬道自咸陽屬之則甘泉前後必近上林即鄠縣也安知隋宫不襲秦舊邪秦之林光至漢猶存元封二年始即磨盤嶺山秦宫之側為宫是為漢甘泉孟康曰甘泉一名林光師古曰漢於林光旁起宫非一名也文景皆幸甘泉不曰有宫當是秦林光尚可用也戰國策范睢說秦王曰北有甘泉谷史記秦地北有甘泉谷口之固即雲陽縣甘泉山也武帝雖别剏一宫而林光如故帝非特備游觀信方士明庭之語求自通於仙故增之又增如泰畤仙掌露盤泰壹諸畫象盡在其上此山距長安巳三百里而望見長安城堞上有通天臺雲雨悉在臺下宫殿臺觀略與建章比而百官皆有邸舍帝以五月避暑八月乃歸元和志曰登山必自車箱阪阪在雲陽西北三十八里縈紆才通單軌上阪即平原宏敞樓觀相屬黃圖與史不合如思子宫在湖之渭南也萬歲宫在汾陰河東也而圖皆以宫隷甘泉甘泉自在渭北非誤邪北史後周有雲陽宫唐志京兆府鄠縣東南三十里有隋太平宫西南二十二里有隋甘泉宫雲陽有甘泉山通鑑唐太宗貞觀二十年八月鐡勒十一姓入貢壬申上幸漢故甘泉宫漢高光宫見上漢長楊宫五柞宫地理志扶風盩厔縣有長楊宫有射熊館秦昭王起紀武帝後元二年二月行幸盩厔五柞宫注有五柞木因以名宫武帝徃來長楊五柞宫注師古曰二宫並在盩厔皆以樹名之宣紀元帝永光五年冬幸長楊宫射熊館布車騎大獵成帝元延二年冬幸長楊官從胡客大校獵宿萯陽宫賜從官列傳東方朔武帝微行丞相御史使右輔都尉徼循長楊以東後乃私置更衣從宣曲以南十二所投宿諸宫長楊五柞倍陽宣曲尤幸朔進諫云云司馬相如嘗從武帝至長楊獵天子好自擊熊豕馳逐壄獸因上疏諫揚雄上長楊賦曰振師五柞習馬長楊張放從上微行出游北至甘泉南至長楊五柞黄圖長楊宫在盩厔縣東南三十里元和志三十三里本秦舊宫漢修飾之以備行幸宫中有垂楊蔭數畝因以為名門曰射熊秦漢游獵之所長楊榭在長楊宫秋令校獵其下命武士搏射禽獸天子登此以觀焉臺上有木曰榭五柞宫漢之離宫也元和志云秦五柞宫在盩厔元和志在縣東南三十八里宫中有五柞樹因以名中有青梧觀執金吾廣意待詔五柞官水經注渭水北流長楊宫西西都賦歴長楊之榭西京賦集乎長楊之宫相羊乎五柞之館上林禁苑掩長楊而聯五柞注長楊五柞皆宫中五柞亦館名有五株柞樹潘岳西征賦清暑之館五柞之宫交渠引漕激湍生風乃有昆明池乎其中漢棫陽宫文紀後二年夏行幸雍棫陽宫注秦昭王所作也地理志右扶風雍縣棫陽宫秦昭王起郊祀志武帝征和四年修封泰山是歲雍縣無雲如靁者三或如虹氣蒼黃若飛鳥集棫楊官南有司以為美祥蘇武傳長君武兄嘉為奉車從至雍棫陽宫黃圖棫陽宫在今岐州扶風縣東北文選注東觀漢記曰濟陽有武帝行過宫漢回中宫匈奴傳孝文十四年騎兵入燒回中宫候騎至雍甘泉注師古曰回中在安定原州其中有宮應劭注同黃圖秦始皇二十九年巡隴西過回中文帝十四年匈奴入蕭關燒回中宫元封四年冬十月幸雍通回中道注見下首山宫遂北出蕭關天漢二年春行幸東海還幸回中又有三良宫相近括地志秦回中宫在岐州雍縣西四十里一云三十里秦元和志謂宫為官在鳯翔天興縣西黄圖曰官在汧玉海卷一百五十五
