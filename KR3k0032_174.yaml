河北諸郡發鎮兵增築城壘遣翟守素田仁明等四人分路按行端拱二年二月令沿邊作方田列置寨柵至道三年九月楊允素上地圖帝御滋福殿歷指山川堡壁曰朕已令屯兵內地而省冗費咸平四年十二月壬戌陜西漕臣劉綜言鎮戎軍本古原州請於軍前後置堡寨且耕且戰祥符二年始置橫陽神堂銀城三寨皆在屈野河東置寨將祥符三年四月己未內出曹韋張宗貴所上涇原環慶兩路山川城寨圖示宰臣曰虜置藩部俱當儲備亦詳宜别畫二圖一付本路一留密院康定元年陜西漕龐籍請諸寨互相應援慶厯元年曹綜於三都谷靜邊堡置寨二年三月環慶於柔逺寨東擇利益建城寨又於細腰城建寨四年宣撫韓琦請令涇原修葺堡寨五年十月甲子以延州城馬蹄川為安定堡嘉祐四年二月十一日詔留麟州鎮州府州中候百勝清寨四堡寨餘皆廢之治平四年三月環慶蔡挺築荔原堡閠三月涇原修堡寨賜名治平寨又有雞川寨熙寧十年延州建四堡咸平六年六月己卯賜環州大名乾川新寨名肅逺九月辛亥府州西寒嶺置寨賜名寧逺慶厯三年正月乙未詔河北轉運提刑安撫司提舉修城壘咸平彭陽城鎮戎軍咸平六年築九域志軍東八十三里景德肅寧城瀛州雍熙中置平虜寨淳化元年改平虜城景德元年十二月甲辰改肅寧城天禧清水城秦州天禧元年十一月曹瑋築熙寧元年秦州置甘谷城九域志甘谷在州西北一百八十五里明道懷逺城明道元年十月甲寅鎮戎軍新修赤藁城名為懷逺城慶厯元年十月三日户部副使李宗詠等往河東修寧逺寨渭州牧隆城天禧元年築祥符七年築籠竿城咸平四年閏十月築綏州城康定青澗城元年九月庚午以种世衡知延州青澗城种世衡傳建請營故寬州州西南直延安二百里當冦衝右捍延安左可致河東粟北可圖銀夏詔即廢壘興築壘近虜屢出爭且戰且城之初苦無水鑿地百五十尺至石屑石得泉城成賜名青澗城遷知城事開營田二千頃九域志青澗城在延州東北一百十五里慶厯韓公城秦州初建隆三年築伏羌城祥符九年二月城南市慶厯初守臣韓琦以東西城外有民居軍營恐資冦元年十月己卯詔增築外城乃廣外城十一里與內城聯合為一城秦民德之號韓公城興功於元年十月三日己卯成於二年正月二十七日廣四千一百步髙三丈五尺計工三百萬一云東西關城慶厯水洛城德順軍慶厯三年以渭州隴竿城置軍靖邊寨西南去略陽二百里有城曰水洛川地平土沃曹瑋嘗經營之劉滬密使城主鐸斯那內附因城之慶厯三年十月甲子鄭戩奏遣劉滬董士廉築城涇原帥尹洙令罷役不從四年七月二十六日奏城成䚰役以滬任城事城中有碑紀滬事九域志城在軍西南一百里至和元年八月廣西余靖作桂州新城二年六月成王安石為記慶厯大順城慶厯二年范仲淹於慶州柔逺寨東北四十里大順川建城四月辛巳詔城名大順張載為之記五年閠五月甲申仲淹宣撫請建細腰城在三川間命种世衡蔣偕城之自環州隸原州范仲淹傳慶之西北馬鋪寨當後橋川口深在賊腹中仲淹欲城之度賊必爭密遣子純佑與蕃將趙明先據其地引兵隨其後諸將初不知所向行至柔逺始號令之版築畢具旬日城成今大順城是也賊覺以騎三萬來戰佯北仲淹戒勿追已而果有伏大順既成白豹金湯皆截然不敢動環慶自此冦益少張亢傳為并代都鈐轄管麟府軍馬以州東焦山有石炭穴為築東勝堡下城旁有蔬畦為築金城堡州北沙坑有水泉為築安定堡置兵守之戰于兔毛川賊大潰不踰月築清塞百勝中侯建寧鎮川五堡麟州之路始通熙寧綏德城延州熙寧二年置元豐七年正月十九日陜西漕臣范純粹言綏德城當冦衝請立軍以七城寨隸焉在州東北二百三十里建隆二年秦州置伏羌寨熙寧三年以寨為城在州西九十里熙寧六年河州置定羌城九域志七年置在州東七十里元豐四年通逺軍北一百二十里置定西城元祐定逺城七年五月甲申熙河蘭岷路進築凡二十四日畢功經略使范育等賜詔奬諭金湯城延州元符二年以舊寨改銀川城崇寧五年以銀川改定西城蘭州元豐六年增軍築閏六月隸通逺平夏城鎮戎軍紹聖四年以石門城改德威城舊清水河政和六年置安西城紹聖二年章栥築定邊城元符二年三月十四日韓升築安邊城環州崇寧五年置興平城元符元年三月十七日環慶築元豐三年十一月二十一日曾鞏奏秦鳯鄜延涇原環慶并代五路嘉祐城堡一百十二熙寧二百十二元豐二百七十四熙寧較嘉祐一倍元豐再倍而熙河城堡又三十有一夫將於兵猶奕於棋善奕者置棋雖踈取數必多得其要而已敵雖萬變塗雖百出而形勢足以相援攻守足以相赴所保必其地所應合其變用力少而得算多紹興築皇城今大內舊杭州州治也紹興十八年三月十四日名皇城南北門曰麗正和寧二十八年七月己未增築皇城東南之外城修築五百四十一丈計工三十餘萬九月二十二日新城增置便門詔新南門名嘉會乾道九年十二月二十一日修禁城紹興山水寨建炎二年命揚州增修城壁紹興十一年二月十二日昭王㬇兼通泰制置使措置水寨鄉兵建炎四年六月臣僚言江北諸郡之民往往自為寨柵羣聚以守和州則有雙山雞籠二三寨麻胡阿育二水寨廬州則有浮槎方山等寨滁州則有獨山等寨每寨多至二萬餘家宜諭以恩意有功者命鎮撫使保奏推恩從之十一月遣使兩浙點檢寨柵乾道五年九月遣淮西參議許子中措置淮西山水寨民兵漢鼂錯言邉事曰選常居者家室田作為髙城深塹其藺石布渠答復為一城其內城間百五十步要害之處通川之道調立城邑毋下千家為中周虎落先為室屋具田器幕人居之文王城朔方以南仲宣王城東方以仲山甫慮以悄悄之勞發以赫赫之名承以翼翼之勤續以明明之功其君臣如此而守衛有其具也古者哲夫以為城衆心以為城禮義廉恥以為城易曰天險不可升也是險也無象無形不兵而不可犯不城而不可踰所以持山川丘陵者也昔之人以大師為垣得道為助在德者險茍得民心雖畫地而守效死者莫肯去不然崇城到天嚴扉重閉金鋪銅環鐵扇石樞無以結民心至於攜叛不若折柳之樊圃也禦外之道莫若設險制勝之方莫若因形重門擊柝設險也髙屋建瓴因形也雅有營謝美召伯也傳稱城沂賢蒍敖也城朔方而玁狁之難除禦戎狄之道守備為本不以攻戰為先陵崢岸峭豐牆峭址以行義為阻道德為塞賢人為兵則邊境無鹿駭狼顧之憂春秋之法大事書之於策其於土功尤致其謹始於隱之城中丘卒於哀之城邾瑕其事幾三十條莒城惡而弗備巫臣以為譏由于城麇不知髙厚子西以為誚子囊之城郢蒍艾獵之城沂深嘉屢歎以為善相一國崒若斷岸矗似長雲扼敵國之襟喉據邊障之樞會屈伸指臂開闔風雷啓關而敵不敢入下兵而敵不敢當堞雉崢嶸嶽立雲連鼓鼙晝鳴刁斗夜嚴渠答藺石凡備畢具隱以金椎蒙以石壁巋乎峭巘斷岸之不可攀峙芻糧穀甲兵具藺石杜擭穽察相翔謹號戒王公設險以守國孔子書於習坎之彖城郭溝池以為固孔子所以答言偃之問體天之險等威以敘因地之宜溝封以固猶慮有欲不相保聚弧矢取暌門柝取豫俾居無甈而害有禦乃量弘閷乃審薄厚先壞而防先變而懼毋生戒心棄成恃陋古者天子守在四夷故城成周而君子小之雖然清風至而城郭不修入其國者有以觀政矣石城湯池著於神農之教固圉重閉載乎春秋之訓敵無脆有備者勝國無小善守者全樂毅能下齊而不能拔莒即墨之二城佛貍能飲江而不能克旴𣅿之孤壘以習安為懼以恃陋為戒墨翟之智子囊之忠也正其疆場修其土田險其走集親其民人明其伍侯萬雉鬱起矗如長雲植表作旗萬鍤競奮實墉實壑深與髙稱城有制役有時大都不過三國之一邑無百雉之城制也凡土功龍見而戒事火見而致用水昏正而栽日至而畢時也周之以水樵校聨布之以藺石渠答玉海卷一百七十四
