body:
  text: 玉海卷一百七十四宋王應麟撰宮室城下邊城附唐京城地理志上都關內道古雍州之域京城前直子午谷後枕龍首山左臨灞岸右抵灃水其長六千六百六十有五步廣五千五百七十五步周二萬四千一百二十步其崇丈有八尺高祖紀大業十三年十一月丙辰克京師命宋公弼收圖籍約法十二條八月庚午進屯長安故城十一月攻大興城下之武德元年五月改隋大興殿為太極殿昭陽門為順天門紀髙宗永徽五年十月癸卯築京師羅郭起觀于九門會要十一月十一日和雇四萬一千人修京羅城郭三十日畢九門各施觀明德觀五門工部尚書閻立德為使玄宗開元十八年四月乙卯會要一日築京師外郭九十日罷德宗貞元四年冬築夾城長安志兩京記同京城隋文帝開皇二年自故都徙其地呂氏圖云南直石鱉谷在漢故城之東南屬杜縣周之京兆郡萬年縣界南值終南山子午谷北據渭水東臨灞西枕龍首原外郭城隋曰大興城文帝初封大興公及即位以名城縣門殿園池及寺焉唐曰長安城亦曰京師城東西一十八里一百一十五步南北一十五里一百七十五步周六七十里隋志同殿隋開皇二年六月築正曰大興殿宮曰曰大興宮宮北苑曰大興苑唐永徽四年率天下口稅一錢更築之韋述曰宮之太極殿本大興材故因用其名宫髙宗於大興城北别建大明而大興城遂名西內南面三門正中曰明德門北當皇城朱雀門南出抵終南山八十里東曰啓夏門門外西南二里有圓丘先農藉田三壇西曰安化門東面三門北曰通化門裴度討蔡州憲宗送于此中曰春明門南曰延興門西面三門北曰開逺門中曰金光門西趣金明池南曰延平門北面一門曰光化門隋志同里一百六市二皇城俗號子城東西五里一百一十五步南北三里一百四十步南面三門正南曰朱雀門東曰安上門西曰含光門東南二門南曰景風門北曰延喜門西南二門南曰順義門北曰安福門城中南北七街東西五街六典曰一百十一坊宋務曰今霖雨閉坊門六典工部京城左河華右隴阺前終南後九㚇南三門中明德左啓夏右安化東面三門中春明北通化南延興西面三門中金明北開逺南延平皇城在京城之中南面三門中朱雀左安上右含光東面二門北延喜南景風西面二門北安福南順義其中左宗廟左安上門內之東右社稷在含光門之西百寮廨宇列乎其門凡省六寺九臺一監四衛十有八左右衛左右金吾衛左右驍衛左右武衛左右威衛左右領衛軍左右監門衛左右千牛衛左右羽林軍衛東宮官屬凡府一坊二左右春坊內坊寺三家令率更僕率府十左右衛左右靑道左右司禦左右內左右監門內劉弘基傳次長安故城所以别大興城振隊金光門許敬宗傳舊顯慶三年髙宗於古長安城遊覽令敬宗與弘文學士檢秦漢以來歷代宫室處所奏其年代會要云顯慶二年十月十七日上因於古長安城遊覽問侍臣曰朕觀故城舊址自秦漢以來幾代都此許敬宗曰秦都咸陽渭水貫都以象天河漢惠始築此城唐都城三重京城皇城宫城有皇城使三都上都東都北都唐太微城東都皇城地理志東都隋置河南道古豫州之域京隋紀大業元年三月丁未營建東二年正月辛酉東京城市隋志里一百三三皇城長千八百一十七步廣千三百七十八步周四千九百三十步崇三丈七尺曲折以象南宮垣名曰太微城通典開元元年改洛州為河南府宋會要京城周回五十二里城內一百二十坊唐東都紫微城地理志東都宮城在皇城北長千六百二十步廣八百有五步周四千九百九十一步崇四丈八尺以象北辰藩衛名曰紫微城武后號曰太初宮皇朝開寶八年十月丁巳修西京宮室將議幸洛也宮室周回九里三百步舊名曰紫微城唐東都金城地理志東都都城前直伊闕後據邙山左瀍右澗洛水貫其中以象河漢東西五千六百一十步南北五千四百七十步西連苑北自東城而東二千五百四十步周二萬五千五十步其崇丈有八尺武后號曰金城凡一百三坊二市會要天寶二年正月二十八日築神都羅城號曰金城通典洛陽金墉城在故城西北角魏明帝築唐北都都城大明城又見晉陽宫地理志北都河南道古冀州之域都城左汾右晉潛丘在其中長四千三百一十一步廣三千一百二十二步周萬五千一百五十三步其崇四丈汾東曰東城貞觀十一年長史李績築兩城之間有中城武后時築以合東城宮南有大明城故宮城也宮城東有起義堂倉中有受瑞壇崔神慶傳武后擢井州長史親為按行圖遣之初州隔汾為東西二城神慶跨水聨堞合而一之省防禦兵數千東魏武定三年正月丁未於并州置晉陽宫唐宮城見宮類唐碎葉城地理志焉耆都督府貞觀十八年滅焉耆置有碎葉城北庭都護府渡伊麗河至碎葉界又西行千里至碎葉城水皆北流入磧安西都護府有保大軍屯碎葉城碎葉川口至裴羅將軍城又西二十里至碎葉城城北有碎葉水會要調露元年九月安西都護王方翼築碎葉城四面十二門為屈曲隱伏出沒之狀五旬而畢又云瀚海軍大軍並在碎葉城裴行儉傳儀鳳二年十姓可汗阿史那都支及李遮匐誘蕃落以動安西調露元年裴行儉因策送波斯奏王方翼為副兼檢校安西都護權以制事至西州揚言大熱未可進徐召四鎮酋長偽約畋隂勒部伍倍道而進去都支帳二十餘里使人召之都支倉卒不知所為詣營謁遂禽之是日傳契箭召諸部酋長悉來請命並執送碎葉城襲遮匐遮匐降悉俘至京師將吏為刻石碎葉城紀功王方翼傳裴行儉奏為安都護築碎葉城面三門紆還多趣以詭出入五旬而畢西域胡縱觀莫測其方略悉獻珍貨波斯傳調露元年詔裴行儉將兵護還以道逺至安西碎葉焉耆傳開元七年十姓可汗請居碎葉西域傳有碎葉者出安西西北千里繇勃逹嶺北行贏千里得細葉川東曰熱海地寒不凍西有碎葉城天寶七載北庭節度使王正見伐安西毁之通鑑開元二年三月己亥磧西節度使阿史那獻克碎葉等鎮斬都簷唐伊吾城西域傳伊吾城者漢宜禾都尉所治商胡雜居勝兵千附鐵勒人驍悍土良沃隋末內屬置伊吾郡貞觀四年城酋來朝頡利滅舉七城降列其地為西伊州通鑑九月戊辰入朝唐永定壘地理志邠州新平有永定壘二太宗討薛舉置唐長安城許敬宗傳帝嘗幸故長安城按蹕裴回視古區處問侍臣秦漢以來幾君都此敬宗曰秦居咸陽漢惠帝始城之其後苻堅姚萇宇文周居之帝復問漢武開昆明池實何年對曰元狩三年將伐昆明實為此池以肄戰帝乃詔與弘文學士討古宮室故區具條以聞高宗顯慶三年十月十七日唐和戎城郭元振傳武后時突厥吐蕃連兵冦涼州長安元年十一月拜元振為涼州都督初州境廣輪才四百里虜來必傅城下元振始於南硤口置和戎城北磧置白亭軍制束要路拓境千五百里自是州無虜憂又遣甘州刺史李漢通闢屯田盡水陸之利稻收豐衍地理志涼州西北五百里有白亭軍本守捉天寶十四載為軍唐河北三受降城中宗紀景龍元年五月戊戌張仁亶為朔方道行軍大總管以備突厥通鑑十月丁丑擊突厥大破之事景龍元年景雲二年紀中不見築城當考張仁願傳仁願本名仁亶以音類睿宗諱改焉神龍三年朔方軍總管沙吒忠義為突厥所敗詔仁願攝御史大夫以代之始朔方軍朔方即豐州也隸靈州有朔方軍豐州焉與突厥以河為界北崖岸也有拂雲祠突厥每犯邊必先謁祠禱解然後料兵度而南時默啜悉兵西擊突騎施會要作娑葛仁願請乘虛取漠南地於河北築三受降城絶虜南冦路唐休璟以為兩漢以來皆北守河今築城虜腹中終為所有仁願固請中宗從之表留歲滿兵以助功時咸陽兵二百人逃歸仁願盡擒之斬於城下軍中股栗役者盡力六旬而三城就論弓仁傳神龍三年為朔方軍前鋒遊奕使時張仁願築三受降城弓仁以兵出諾真水草心山為邏衛宗會要景雲二年三月一日張仁亶請築三受降城睿從之三城皆據津濟遙相應接通鑑景龍二年戊申二月丙申朔仁願築三受降城于河上七月癸巳以仁願同中書門下三品元和志神龍三年仁願置以拂雲為中城南直朔方西城南直靈武東城南直榆林勝州三壘相距各四百餘里其北皆大磧斥地三百里而逺又於牛頭朝那山元和志作牛頭牟那山北置烽候千三百所會要一百八十所通典同同舊史一千八百所元和志自是突厥不敢逾山牧馬朔方無冦歲損費億計減鎮兵數萬初建三城也不置壅門曲敵戰格或曰邊城無守備可乎仁願曰兵貴攻取賤退守冦至當併力出拒敢回望城者斬何事守備退忸其心哉後常元楷代為總管始築壅門議者益重仁願而輕元楷地理志豐州九原郡東受降城景雲三年朔方總管張仁願築三受降城寶厯元年五月振武節度張惟清以東城濵河徙置綏逺烽南會要云賜錢一百萬城之至十月功畢中受降城有拂雲堆祠接靈州境高霞寓傳元和十三年拜振武節度吐蕃攻鹽豐霞寓以兵五千屯拂雲堆虜引去有關元和九年五月置又有橫塞軍天寶八載三月置十二載廢西二百里大同川有天德軍大同川之西有天安軍皆天寶十二載置天德軍乾元後徙屯永濟柵故大同城也元和九年宰相李吉甫奏修復舊城北有安樂戌志又云安北大都護府開元二年治中受降城十二年徙治天德軍定通鑑開元二年閠二月王睃兼安北大都護令豐安逺三受降城皆受節度徙大都護府於中受降城置兵屯田西受降城開元初為河所圯十年總管張説於城東别置新城北三百里有鸊鵜泉天寶元年王忠嗣併受降振武為一城呂溫三受降城銘曰韓侯受命平在朔易北方之強制以全策亘漢橫塞揭茲雄壁如三鬬龍躍出大澤並入襟帶各閉風雷俯視隂山仰看昭回一夫登陴萬里洞開日晏秋盡纎塵不來我聖耀德罷扄北門優而柔之用息元元曷若全守推亡固存于襄于夷永𥙿後昆序曰斥候迭望幾二千所損費億計減兵萬人東極于海西窮于天納隂山於寸眸拳大漠於一掌仁願封韓公制曰橫却月於天街劃長雲於地脈李華韓公廟碑銘曰公忠貫神明慮幾造化鎮以長策潰其姦謀奪塹拂雲維而城之並河之阿列築三鎮將精志鋭談笑就役胸奴不敢南視號哭而遁憑墉而望匹馬單兵不匿形影虜中是械手足而刳腹心天下減征役之半三城既就刋木標櫓記之種落刻其降年後皆如之銘曰沉泉雷動機發冥冥功奮三城人謡億齡北狄頓顙山戎來庭萬里寢柝緣河罷扄後人思仁願為立祠受降城出師輒享焉按傳志會要通典等書築三城嵗月不同會要作景雲二年三月一日志作景雲三年傳作神龍三年元和志同通典景龍中吕溫紀景龍二年通鑑同今考之紀神龍三年五月戊戌仁願為總管會要同其年九月改景龍當以傳為定傳云神龍三年請中宗從之會要乃云景雲二年三月一日築睿宗從之通典同恐志會要年月非而呂溫記與傳通鑑是實録兼紀傳通鑑元和七年正月癸酉振武河溢毁東受降城八年七月辛酉李光進請修東受降城通鑑止云受降城盧坦傳以為西城兼理河防李吉甫請移其兵於天德故城李絳盧坦以為城當磧口據虜要衝得制胸奴上策豐水美草邊防所利今避河患退二三里可矣奈何捨萬代久安之䇿為一時省費之謀况天德故城僻處確瘠去河絶逺烽候不接虜忽唐突是蹙國二百里也城使周懷義奏利害與綘坦同上卒用吉甫䇿以受降城騎士隸天德軍通鑑在八年七月當從之會要在十二年九月是誤實録云以中受降城及所管騎士一千一百四十人隸天德軍或是三城都數李司空論事云中城舊屬振武有鎮兵四百人會要元和九年五月豐州奏中受降城與靈州城接界請置關從之列傳王睃為朔方大總管􅎤跌部及僕固都督勺磨等散保受降城之鄙潛引突厥內擾睃誘誅之開元八年張齊丘為朔方節度天寶八載三月於中域西北五百餘里築橫塞軍郭子儀為使渾瑊大厯十四年兼振武東受降城鎮北大都護李景略貞元中為天德軍西受降城都防禦使李吉甫元和八年請起夏州至天德復驛候十一區以通緩急發夏州精騎五百屯經略故城以護黨項張惟清為振武節度請户部錢十四萬修東受降城韓重華為十五屯就髙為堡東起振武西過雲州界極於中受降城出入河山之際六百餘里通鑑會昌二年二月李德𥙿請修東中二受降城以壯天德形勢從之地理志中受降城正北八十里呼延谷口有歸唐柵車道也入回鶻使所經幽州城內有經略軍有約降軍本納降守捉城故丁零川也西南有安塞軍赫連城李光顔傳裴度伐蔡築赫連城於沱口唐三受降城見上段元和志天德軍本安北都護貞觀二十一年於今西受降城東北四十里置燕然都護天寶八年張齊丘置橫塞軍十二年安思順奏廢軍請於大同川西築城置軍賜名天安軍十四年築城功畢乾元後改為天德軍西南移三里權居永清柵又移西受降城後頻為河水所侵元和八年春河溢城南面多毁壞防禦使周懷義上表請修築約錢二十一萬李吉甫密陳便宜請修天德舊城以安軍鎮曰西城是開元十年張説所築今河水毁其半不堪重修其子城猶堅量留千人足得居住案天德舊城在西城正東微南一百八十里其處見有兩城本永清柵即隋大同城去本城約三里城甚牢小今隨事宜置仍存天德軍額北城周回十二丈髙四丈下濶二丈七尺天寶十二載安思順所置其城居大同川中當北戎大路屬䘵山有事為賊將破焚遂移永清柵别置理所於西城力所不足實非逺圖臣計料修此城不過二萬貫錢今若於天德舊城隨事增飭因有移換仍取城隸天德軍别置使名自為雄鎮可讋殊鄰詔從之於是復移天德軍理所於舊城焉東受降城本漢雲中郡地在榆林郡東北八里今屬振武節度中受降城本秦九原郡地漢元朔二年更名五原開元十年又於此城置安北大都護府後又移徙事具天德軍敬本古城在中城北四十里鄭虔軍録曰時人以張仁願河外築三城自古未有今敬本城周一萬八百七十二步壕塹深峻亦古之堅守也賈耽古今述曰以地理求之前代九原郡城也西受降城在豐州西北八十里蓋漢朔方郡地臨河縣故理處開元初為河水所壞十年總管張説於故城東别置新城今城西南隅又為河水所壞舊天德軍理此城元和九年移理天德軍城東受降城在朔州北三百五十里本漢定襄郡之盛樂縣也武德四年置雲州貞觀二十年改都督府麟德三年改單于大都護府垂拱二年改鎮守使聖厯元年改置安北都護開元七年隸屬東受降城八年復置單于大都護府今為振武理所通鑑開元二年閏二月以王睃兼安北大都護朔方大總管令豐安定逺三受降城皆受節度徙大都護府於中受降城置兵屯田唐休璟云豐州控河遏冦號為襟帶唐豐安定逺城又見下羊馬城郭元振傳先天元年為朔方大總管二年正月築豐安定逺城關內道兵得保頓地理志靈州黃河外有豐安定逺新昌等軍豐寧保寧等城武德四年析回樂置豐安縣豐安軍在靈州黃河西去州一百八十里治威州鳴沙神龍元年為默啜所冦移故豐安城警州本定逺城在靈州東北二百里先天二年郭元振置後為上縣隸靈州景福元年靈威節度使韓遵表為州杜鴻漸傳太子按軍平涼議出蕭關趣豐安曰靈州我之關中逺王海賔豐安軍使王晙為朔方副大總管豐安定等城並受節度白元光為靈武留後定逺城使渾瑊兼定逺西城天德軍節度羊馬城幅員十四里信安王禕所築元和志定逺城在靈州東北一里即漢北地郡方渠縣之地以豐安勢孤置此有兵五千五百鎮之見後六典朔方節度使其統有豐安軍定逺城唐長城地理志媯州懷戎縣北九十里有長城開元中張説築東南五十里有居庸塞東連盧龍碣石西屬太行常山實天下之險有鐵門關通典古居庸關在幽州昌平縣西淮南子天下九塞居庸是其一也元魏以柔然冦邊自赤城西至五原築長城二千餘里隋開皇五年使司農少卿崔仲方發丁三萬於朔方靈武築長城東距河西止綏州綿歷七百里以遏胡冦太宗貞觀二年九月己未突厥冦邊或請修古長城上曰朕方掃清沙漠安用勞民志過河經後魏沃野鎮城傍金河過古長城九十二里至綏俱麟川唐威戎城地理志安西撥換城一曰威戎城唐營州城宋慶禮傳為河北營田使初營州都督府治桞城扼制奚契丹武后時趙文翽失兩蕃情攻殘其府更治東漁陽城志聖厯元年玄宗以奚契丹欵附欲復治故城宋璟爭不可慶禮執處其利詔與薑師度邵宏等為使築裁三旬畢志開元五年還治柳城兼營州都督張九齡曰慶禮城營州士才數千無甲兵強衛指期而往不失所慮遂罷海運邊亭晏然唐鹽泉城石堡城唐厯開元二十六年三月隴右節度留後杜希望攻吐蕃新城拔之以為威武軍志在茂州七月希望發鄯州兵奪虜河橋并河築鹽泉城號鎮西軍破吐蕃兵三萬人志河州西百八十里有鎮西軍二十六年置會要開元十八年三月二十四日甲寅朔方節度信安王禕攻吐蕃石堡城本名鐵仞城拔之四月改為振武軍二十九年十二月六日陷天寶八載六月哥舒翰又拔之閠六月三日乙丑以為神武軍哥舒翰傳下石堡城以赤嶺為西塞渾瑊傳從拔石堡城龍駒島勇常冠軍地理志鄯州鄯城定戎城又南隔澗七里有天威軍軍故石堡城天寶八載克之更名唐平戎城安戎城唐厯開元二十