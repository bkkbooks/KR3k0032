body:
  text: 玉海卷七十四宋王應麟撰禮儀上夀杜佑曰禮有獻醻無上夀詩雅曰虎拜稽首天子萬夀豳風曰為此春酒以介眉夀左傳曰武伯為祝上夀酒也漢未央宫為夀置酒前殿史紀髙祖紀九年未央宫成髙祖大朝諸侯羣臣置酒未央前殿髙祖奉玉巵起為太上皇夀殿上羣臣皆呼萬嵗大笑為樂漢長樂宫上夀上夀四㑹曲見禮制朝儀唐文粹杜佑三朝上夀有樂議云漢叔孫通定禮儀七年長樂宫成諸侯朝禮畢復置酒侍坐殿上皆伏尊卑次起上夀漢故事上夀四㑹曲注言但有鐘鼓無有歌詩魏初作四㑹有琴筑但無詩郭瓊云青龍二年以長笛食舉第十二古置酒曲代四㑹又易古詩名曰羽觴行用為上壽曲鹿鳴以下十二曲名食舉樂而四㑹之曲遂廢張華上雅樂詩表云魏上壽食舉詩及漢代所施用其文句短長不齊皆未合於古雅漢故事云上夀四曲華亦言有歌辭注當是闕文晉代歌詩傳玄述具存昭紀始元元年二月黄鵠下太液池公卿上夀元鳯二年四月自建章宫徙未央宫大置酒元紀建昭四年正月以誅郅支單于羣臣上夀置酒漢諸王上夀太子宫上夀見宫類長沙王發傳注應劭曰景帝後二年諸王來朝有詔更前稱夀歌舞帝以武陵零陵桂陽益焉漢明堂上夀見明堂吾丘夀王傳汾隂得寳鼎薦見宗廟藏於甘泉宫羣臣皆上夀賀曰得周鼎漢朝堂上夀明帝紀永平十七年夏五月戊子見總瑞類漢徳陽殿上夀見元㑹唐未央宫上夀通鑑貞觀七年十二月丙辰閱武於城西髙祖自臨勞將士戊午還宫置酒故漢未央宫命頡利可汗起舞南越酋長馮智戴詠詩笑曰胡越一家古未之有也大宗舉觴上夀羣臣皆呼萬嵗紀八年十二月丁卯從太上皇閲武于城西唐兩儀殿上夀舊紀貞觀八年三月甲戌太上皇髙祖燕西突厥使者於兩儀殿顧謂長孫無忌曰蠻夷率服古未嘗有無忌上千萬嵗夀髙祖大悅以酒賜太宗太宗又奉觴上夀於是太宗與文徳皇后互進御膳并上御服一同家人常禮殿在太極宫後古之内朝西突厥傳泥孰冊號可汗賜鼓纛泥孰遣使謝太上皇宴使者兩儀殿謂長孫無忌曰今蠻夷率服古亦有乎無忌上千萬嵗夀太上皇喜以酒屬帝帝頓首謝亦奉觴上太上皇夀唐慶善宫上夀舊紀貞觀十六年十二月丁卯宴武功士女於慶善宫南門酒酣上與父老泣涕論舊事老人等遞起為舞爭上萬嵗夀上各盡一杯通鑑十六年十一月壬戌上校獵于岐陽因幸慶善宫召武功故老宴賜極歡而罷庚午還京師紀云甲子賜所過六縣高年氊衾粟帛遂幸慶善宫庚午至自慶善宫唐千秋節上夀延英上夀實錄玄宗以垂拱元年八月五日生於東都開元十七年八月癸亥宴百寮於花蕚樓下左相乾曜右相說上表曰少昊著流虹之感商湯本玄鳥之命陛下二氣合神九龍浴聖月惟仲秋日在端五常星不見之夜祥光照室之朝請以為千秋節著之甲令布之天下咸令宴樂羣臣以是日獻甘露醇酎上萬嵗夀酒王公戚里進金鏡綬帶張九齡千秋金鑑録張彚有千秋鏡賦祥光夜合佳氣晨飛士庶以結絲承露囊相遺問村社作夀酒宴樂名為賽白帝報田神十八年八月丁亥御花蕚樓以千秋節百官獻賀賜四品已上金鏡珠囊縑綵賜五品以下束帛上賦八韻詩又製秋景詩二十三年八月五日御花蕚樓宴羣臣御製千秋節詩序是日大雨百官表賀二十四年八月壬子御廣逹樓宴羣臣奏九部樂天寳七載八月己亥改為天長節肅宗天成地平節九月三日代宗天興節十月十三日徳憲不置名樂志徳宗不立節止於羣臣稱觴上夀順宗聖夀節見齊抗寺碑正月十二日實録文宗大和七年八月中書門下奏太宗幸慶善宫即降誕之所賦詩錫宴播為樂章玄宗降聖之辰為千秋節王公上夀士庻交歡流于管絃書之甲令請以十月十日為慶成節是日於宫中奉迎太皇太后與昆弟諸王盛陳宴樂羣臣詣延英門奉觴上千萬嵗夀州府置宴一曰八年九月敕延英上夀令太常具儀注奏仍准上已重陽例於曲江錫宴開成元年十月慶成節宴于延英殿太常進雲韶樂乂賜百僚宴于曲江武宗慶陽節六月十二日宣宗夀昌節六月二十二日懿宗延慶節十一月十四日僖宗應天節五月八日昭宗嘉㑹節三月二十二日哀帝乾和節九月三日玄宗誕日崔日用采詩大小雅二十篇及相如封禪書獻之借以諷諭且勸告成詔賜衣一副物五十段張說皇帝誕日集賢殿宴詩曰瑞表壬寅露光傳甲子宵杜甫詩鳯紀編生日御氣雲樓敝含風綵仗髙獨孤及表置天興節曰紀載震之辰與八節同號玄宗天長肅宗天平地成上夀作樂悉如開元故事又有天長節進鏡表于邵降誕頌曰甲觀畫堂繞樞神光十月良月降生我皇舜膳以甘堯尊以酣誕彌之朔旬而有三代宗徳宗孟夏十四日降誕節王䖍休獻繼天誕聖樂侯嘉作獻夀文唐太極殿上夀見元㑹通典開元禮冊命皇太子㑹羣臣皆如元㑹之儀其日上夀辭曰皇太子岐嶷夙著令月吉日光踐承華謹上千萬嵗夀皇太子納妃皇帝㑹羣臣於太極殿如正至之儀上夀辭云皇太子嘉聘禮成克崇景福唐麟徳殿上夀舉觴獻夀實錄元和十四年三月乙酉以齊魯初平宴文武百僚于麟徳殿宰臣裴度等舉觴獻夀跪而言曰神武獨斷冦逆削平願與四海九州之人同上千萬嵗夀帝執酒為飲之賜繒綵丙戌又宴宰輔大臣翰林學士于禁中一本云元和十四年齊魯初平宴文武百寮裴度舉觴獻夀跪而言曰神武獨斷冦逆削平錫宴羣臣當兹令節願與四海九州之人同上千萬嵗夀上執酒為飲之舊紀云三月丁酉宴麟徳殿唐興慶宫上夀文宗太和元年五月壬戌朔赴興慶宫起居太皇太后丙寅帝赴興慶宫上壽中外端午進獻如常嵗萬夀節後唐荘宗應聖節明宗千春節未帝天和節晉髙祖啓聖節少帝聖夀節漢髙祖嘉慶節隱帝永夀節周太祖天清節世宗天夀節恭帝大明節梁太祖明聖節末帝建隆廣政殿上夀大宴元年以二月十六日為長春節丙戌賜羣臣襲衣百官詣廣政殿上夀十九日辛卯大宴廣政殿誕節後大宴始此國初上夀大樂令設登歌於殿上二舞立縣南一爵奏禧安之樂二爵奏神龜之樂羣臣授酒正安樂作尚食進食大樂丞引元徳升聞舞入三變三爵奏甘露之樂四爵登歌奏紫芝之樂天下大定之舞入三變五爵奏嘉禾之樂六爵登歌奏玉兎之樂後止用教坊樂太平興國崇徳殿上夀太平興國二年以十月七日為乾明節十月甲子羣臣上夀崇徳殿渤泥契丹使咸陪位淳化元年正月己卯改為夀寧節宣和二年四月乙丑詔正月四日開基節咸平崇徳殿上夀獻夀歌真宗以至道三年即位八月庚子以十二月二日為承天節咸平元年十二月丁亥羣臣詣崇徳殿上夀祥符八年十二月戊寅承天節羣臣及契丹西戎髙麗注輦女真使上夀壬午王欽若作獻夀歌上和之晏殊作承天節述聖賦楊億作承天節頌天禧上夀儀注五年十月十日中書言凡慶㑹皇太子押文武百官班奉觴上夀令禮官别定儀注天聖崇徳殿上夀乾興元年仁宗即位二月乙丑以四月十四日為乾元節仁宗以祥符三年生章懿夢二日在天其一忽墜以裾承之天聖元年四月丁未親王樞宻使以下詣長春殿上夀宰臣文武百官契丹使詣崇徳殿上夀賜酒三行五年八月趙良規上乾元節祝聖夀賦召試學士院十四日賜及第天聖㑹慶殿上夀乾興元年十一月乙亥詔以正月八日皇太后誕日為長寧節天聖元年正月庚午契丹使來賀四年十二月丁亥上欲元日率百官先上皇太后夀命禮官具儀戊戌學士院上甘露瑞木嘉禾三曲五年正月壬寅朔率百官上皇太后夀于㑹慶殿禮畢皇帝乃御天安殿受朝賀是日景雲見己酉長寧節近臣詣崇政殿上夀庚戌大宴㑹慶殿七年十一月癸亥率百官上夀于㑹慶殿八年十二月乙未詔長寧節百官上夀于崇政殿九年正月丙辰上夀㑹慶殿其後宣仁曰坤成節夀明楊太后曰夀慶節治平熙寧元祐紫宸殿上夀英宗以正月三日為夀聖節治平元年正月己亥親王樞宻以下詣垂拱殿宰臣百官以下及契丹使詣紫宸殿上夀神宗以四月十日為同天節熙寧元年垂拱紫宸殿上夀哲宗以十二月八日為興龍節元祐二年十二月羣臣及遼使詣紫宸殿上夀徽宗以十月十日為天寧節紹興紫宸殿上夀建炎元年五月乙未以五月二十一日為天申節詔寢上夀禮羣臣拜表稱賀二年四月己巳詔郡縣錫宴勿用樂紹興十三年五月丁丑始復上夀之禮用樂宰臣率百僚詣紫宸殿上夀己卯大宴集英殿十七年正月丙戌班天申節宴設之制紹興慶夀禮十九年正月甲申朔以皇太后年登七十即宫中行慶夀之禮二十九年正月丙辰朔以年八十詣慈寧殿行慶夀禮百官詣文徳殿賀慶典自此始紹興慈寧宫上夀十二年十月甲申皇太后生辰燕于慈寧宫始用樂上夀十三年五月丁丑天申節宰臣率百官上夀始用樂三月庚子許近臣進金酒器銀香合馬郡縣錫宴皆如承平時二十六年十月丙戌上皇太后回鑾事實進讀畢内庭行捧觴上夀之禮隆興紫宸殿上夀孝宗以六月二十二日為㑹慶節元年紫宸殿上夀光宗以九月四日為重明節寧宗以十月十九日為瑞慶節理宗以正月五日為天基節淳熙徳夀宫慶夀禮淳熙二年十二月十七日甲午立春詣徳夀行慶夀禮太上皇帝新嵗七十皇帝服鞾袍升輦至宫八次簪花云云赦天下十三年正月一日庚申朔行慶夀禮聖夀八十賀表曰位在九五而事父母於一堂年登八十而閲子孫于四世涓辰而陳寳冊獻夀而奉玉巵十年太上皇后新嵗七十十二月十六日丙子以立春行慶夀禮紹熙五年后年八十行慶夀禮淳煕康夀殿上夀十三年正月庚辰朔上率百官花簪用樂太上皇夀登八十逐行慶典上夀于康夀殿廷癸未百官稱賀于文徳殿又移班稍東箋賀中宫又奉玉巵於前殿漢展未央之儀響鸞佩於後宫唐行興慶之禮雖云盛舉曾不同時前殿奉巵企髙皇而踵武大安進膳邁貞觀之彌文慶元重明節上夀五年重明節上詣夀康宫起居上夀如宫中儀宰臣百寮拜表賀六月丙戌以重明節前十日上初詣夀康宫進香陛㦸百重鸞旂的歴輦降雲霄劃聞鳴蹕庻邦冡君駢玉交舄鼎臑俎胾籩豆有秩挹彼注兹泰樽盎齊貂蟬鵔鸃驩聲傳臚日華五色嶽靈三呼祥風和氣蜿蜒扶輿汎漾璧璫披拂綺疏澄河一色瑞日再中感星夢日舒虹爍電山稱萬夀河慶千年百末㫖酒酌彼金壘乾闓坤懌叢祥効竒社鳴河清養老三禮義宗天子養老義曰一以尊年敬徳二以乞言修治三王養老燕禮饗禮食禮王制凡養老有虞氏以燕禮夏后氏以饗禮啇人以食禮周人修而兼用之又詳見學校類五十養於鄉六十養於國七十養於學逹於諸侯有虞氏深衣夏燕衣啇縞衣周玄衣而養老凡三王養老皆引年燕者體解節折而共飲食之又為折俎加豆惠豐而徳洽饗以訓恭儉酒盈而不飲肉乾而不食設几而不倚一獻而百拜食者無百拜之恭無一獻之節所謂養口體者也劉敞曰以養老莫善於燕養其體也以養義莫善於饗養其賢也正義皇氏曰人君養老有四一養老更二子孫死難養其父祖三養致仕之老四養庻人之老饗禮有四一諸侯來朝天子饗之大行人上公饗禮九獻是也二王親戚及諸侯來聘王饗之國語親戚宴享則有殽烝左傳王饗有體薦宴有折俎公當饗卿當宴是也三戎狄之君使來王享之國語戎狄坐諸門外而體委與之是也四饗宿衛及耆老孤子酒正凡享士庶子耆老孤子共其酒是也食禮有二一禮食大行人諸公三食之禮有九舉及公食大夫禮是也二燕食謂臣下自與賔客共食曲禮酒漿處右是也燕禮有二燕同姓夜則飲之燕異姓譲之則止詩湛露鄭箋是也饗禮在廟燕禮在寢内則云云同王制凡養老五帝憲三王有乞言五帝憲養氣體而不乞言有善則記之為惇史三王亦憲既養老而後乞言亦微其禮皆有惇史餘見四代學文王世子天子視學適東序釋奠於先老遂設三老五更羣老庶老也之席位焉適饌省體養老之珍具遂發咏焉退修之以孝養也及登歌清廟既歌而語以成之也下管象舞大武而上下之義行矣有司告以樂闋王乃命公侯伯子男及羣吏曰反養老幼于東序終之以仁也郊特牲饗有樂食無樂春饗孤子秋食耆老疏謂夏殷禮也夏官羅氏中春羅春鳥獻鳩以養國老行羽物通監外紀皇甫謐云大戊修先王之政明養老之禮尚書大傳武丁明養老之道三禮義宗簡民中賢者及朝之致仕者養之若朝之賢者但養於太學不養於鄉若民中賢者則由鄉而進先養於鄉然後養於學凡一年之中養國者有四皆用天子視學之時一年之内視學有四故養老之法亦有四皆用視學之明日春夏以饗禮為先秋冬以食禮為主鄭注文王世子合樂云謂春入學秋頒學此為二也學記未卜禘不視學禘常在夏既有夏視學之禮冬不宜無詩書禮樂四時教之故知有四視學之義一時教一術郊特牲云饗禘有樂而食嘗無樂一云此乃夏殷法周禮之文食禮有樂文王養老詩思齋雝雝在宫箋云宫謂辟雍宫也羣臣助文王養老則尚和尚書大傳齊宣王問於春子曰寡人欲行孝弟之義為之有道乎春子曰昔者衛聞之樂正子曰文王之治岐也五十者杖於家六十者杖於鄉七十者杖於朝見君揖杖八十者杖於朝見君揖杖君曰趨見客無俟朝以朝乗車輲輪御為僕送至於家而孝弟之義逹於諸侯九十杖而朝見君建杖君曰趣見毋俟朝以朝車送之舍太子重鄉養卜筮巫醫御于前祝咽祝哽以食乗車輲輪胥與就膳徹送至於家君如有欲問明日就其室以珍從而孝弟之義逹於四海此文王之治岐也君如欲行孝弟之大義盍反文王之治岐孟子西伯善養老文王為西伯制其田里使養其老文王之民無凍餒之老者周食三老五更樂記武王克商食三老五更於大學禮運三老在學天子袒而割牲執醬而饋執爵而酳冕而總干所以教諸侯之弟也注老人知三徳五事者周名大學曰東膠夏官羅氏見上詩行韋序養老乞言以成其福祿肆筵設席授几有緝御或獻或酢洗爵奠斚酌以大斗以祈黄耉陳祥道云古者建國必立三卿鄉飲酒必立三賔而養老必立三老禮曰三公在朝三老在學三公非一人則三老五更亦非一人矣鄭康成曰三老五更各一人皆年老更事致仕者名以三五者取象三辰五星誤矣漢養老令文紀元年三月詔曰老者非帛不煖非肉不飽今聞吏稟當受鬻者或以陳粟豈稱養老之意哉具為令有司請令縣道年八十已上賜米人月一石肉二十斤酒五斗其九十以上賜帛人二匹絮三斤賜物及當稟鬻米者長吏閱視丞若尉致不滿九十令史嗇夫致二千石遣都吏循行不稱者督之有罪耐以上不用此令晁錯䇿賔禮長老愛育少孤事賈山至言陛下禮髙年九十一子不八十者二筭不事武紀建元元年二月八十復二筭九十復甲卒四月詔民九十以上有受鬻法為復子若孫遂其供養元朔元年十一月詔曰旅耆老復孝敬章紀章和元年七月壬戌詔令是月養衰老授几杖行麋粥飲食其賜髙年二人共布帛各一匹以為醴酪元和二年五月賜天下髙年爵三級安紀元初四年秋九月辛丑詔曰月令仲秋養老授几杖行麋粥方今案比之時郡縣多不奉行甚違詔書養老之意髙祖二年冬十月漢王如陜鎮撫關外父老漢辟雍養三老五更辟雍禮殿饗禮後禮儀志永平二年三月與紀不同上始帥羣臣躬養三老五更于辟雍行大射之禮養三老五更之儀先吉日司徒上太傳若講師故三公人名用其徳行年耆髙者一人為老次一人為更皆服都紵大袍單衣皁緣領袖中衣冠進賢扶玉杖五更亦如之不杖皆齋于太學講堂其日乗輿先到辟雍禮殿御坐東廂遣使者安車迎三老五更天子迎于門屏交禮道自阼階三老升自賔階天子揖如禮三老升東面三公設几九卿正履天子親袒割牲執醬而饋執爵而酳祝鯁在前祝饐在後五更南面公進供禮亦如之明日皆詣闕謝恩以見禮遇大尊顯故也前志注鄧展曰漢直以一公為三老用大夫為五更行禮乃置李竒曰王者父事三老兄事五更詩云三夀作朋注宋均云三老知天地人事者也五更知五行更代之事者也鄭玄禮記注曰三五者取象三辰五星又一注云老人更知三徳五事者也應劭曰三者道成於天地人老者久也舊也五者訓於五品更者五世長子更更相代言其能以善道更改已也蔡邕明堂論云更應作叟叟老人之稱月令章句曰三老國老也五更庶老也明紀永平二年冬十月壬子志月與此不同非誤也幸辟雍初行養老禮詔曰間者暮春吉辰初行大射令月元日令月十月也復踐辟雍尊事三老兄事五更安車輭輪供綏執授侯王設醬公卿饌珍朕親袒割執爵而酳祝鯁在前祝饐在後升歌鹿鳴下管新宫八佾具修萬舞於庭三老李躬年耆學明五更桓榮授朕尚書其賜榮爵闗内侯賜天下三老酒人一石肉十斤有司其存耆耋恤幼孤稱朕意焉八年冬十月丙子臨辟雍養三老五更賛曰登臺觀雲臨雍拜老懋惟帝績增光文考章紀有司奏孝明備三雍之教躬養老之禮儒林傳序中元元年初建三雍明帝即位親行其禮天子始冠通天衣日月備法物之駕盛清道之儀坐明堂朝羣后登靈臺望雲物袒割辟雍之上尊養三老五更射享禮畢帝正坐自講諸儒執經問難於前冠帶縉紳之人圜橋門而觀聽者盖億萬計列傳桓榮永平二年三雍初成拜為五更大射養老禮畢引榮及弟子升堂執經自為下説周澤永平中拜侍中後數為三老五更儒林馮魴建初三年冬為五更詔朝賀就列侯位伏恭永平四年帝臨辟雍於行禮中拜恭司空建初二年冬肅宗行饗禮以恭為三老楊賜光和元年冬行辟雍禮以光祿大夫為三老東京賦日月㑹于龍􅔀恤人事之勞疚因休力以息勤致懽忭於春酒執鸞刀以袒割奉觴豆於國叟降至尊以訓恭送迎拜於三夀敬慎威儀示民不偷我有嘉賔其樂愉愉聲教布濩盈溢天區辟雍詩皤皤國老乃父乃兄魏甘露三年八月丙寅王祥為三老鄭小同為五更行養老禮於大學晉志云甘露二年然宋志云今無其注漢禮具存漢中興養老禮儀通典譙周五經然否曰漢中興定禮儀羣臣欲令三老答拜城門校尉董鈞鈞永平初為博士駮曰養三老所以教事父之道也若答拜是使天下答子拜也詔從鈞議虞喜曰據漢儀於門屏交禮交禮即答拜中興謬從鈞議後革之和帝以魯丕為三老安帝以魯丕李充為三老靈帝以袁逢為三老賜以玉杖漢勞饗三老紀建武十九年九月幸汝南南頓縣舎置酒㑹賜吏人永平十年閏月甲午幸南陽日北至祠舊宅禮畢召校官弟子作雅樂奏鹿鳴帝自御塤箎和之以娛嘉賔還幸南頓勞饗三老官屬建初七年九月己酉幸鄴勞饗魏郡守令已下至三老漢賜髙年帛紀地節三年三月元康二年三月三年春神爵元年三月四年二月五鳯二年三月甘露二年正月初元四年正月永光元年正月三月鴻嘉元年二月永始四年正月元始四年二月並賜帛又後漢章和元年七月元魏養老賜鳩杖漢鳩杖見賜物紀孝文太和十六年二月賜京邑老人鳩杖舊說云鳩不噎之鳥一云取春物始化以助生氣八月己酉養老于明堂尉元為三老游明根為五更又養國老庶老於階下祿三老以上公五更以元卿二十年三月丙寅宴羣臣及國老庶老於華林園假守令賜鳩杖衣裳後周紀武帝保定三年四月以于謹為三老賜延年杖戊午幸太學以食之北面立而訪道再拜受言唐太學養三老五更禮樂志皇帝親養三老五更於太學所司先奏三師三公致仕者用其徳行及年髙者一人為三老次一人為五更五品以上致仕者為國老六品以下致仕者為庶老尚食具牢饌前三日尚舍設大次於太學堂之後前一日設御座於堂上東序西向三老座於西楹之東近北南向五更座於西階上東向皆莞筵藻席衆國老座於堂下西階之西東面北上蒲筵緇布純加莞席大樂令展宫縣於庭設登歌堂上如元㑹儀其日鑾駕將至學生青衿服就位鑾駕入大次鑾駕出宫遣使迎三老五更於第俱冠進賢冠乗安車前從導從其國老庶老則有司預戒之鑾駕既至太學三老五更及羣老俱赴集侍中奏外辦殿中監進大珪皇帝執大珪降迎三老於門内老更皆杖各二人夾扶左右敦史執筆以從皇帝再拜三老五更攝齊荅拜俱坐三公授几九卿正履殿中監尚食奉御進珍羞及黍稷等皇帝省之遂設於三老前皇帝執醬而饋乃詣酒尊所取爵侍中賛酌酒皇帝執爵而酳尚食奉御以次進珍羞於五更前皇帝即座三老乃論五孝六順典訓大綱格言宣於上恵音被於下皇帝乃虚躬請受敦史執筆錄善言善行禮畢老更升安車導從而還通典仲秋之月謹擇良辰唐宴父老乾元殿實錄武徳五年三月宴京城父老賜布貞觀六年五月宴岐州父老賜帛十一年正月宴長安父老於玄武門賜以粟帛三月癸卯幸洛陽宫召宴父老於乾元殿賜粟帛十二年二月宴洛陽父老十五年五月壬申并州父老請臨幸賜宴武成殿賜物遣之十八年十一月壬午宴洛州父老一百九十人於儀鸞殿班賜有差二十年幸并州宴太原父老八月丁卯見京城父老於北闕賜食及粟帛顯慶元年正月辛未立皇太子年八十以上賜粟帛己卯宴之開元二十四年八月千秋節宴京兆父老二十六年七月冊太子賜粟帛冊府元龜貞觀十五年二月癸丑宴從官及山東宗姓洛陽髙年於貞觀殿奏九部樂賜帛十六年十一月甲子幸慶善宫召武功之邰城立節三時豐義四鄉士女七十已上及居宫側數百人賜宴父老爭上夀賜帛有差十八年十月癸卯宴雍州父老千一百人於上林苑循省風俗則先問髙年時臨舊都乃宴衎故老或賜飲於端闕或迴輿於私室而又因靈休之集畢嘉祀之禮則錫之鳩杖賁之束帛登版授之秩開石窌之封斯敎化之大本盛王之令典也唐宴侍老含元殿賜鳩杖玄宗紀開元二年九月丁酉宴京師侍老于含元殿賜九十以上几杖八十以上鳩杖婦人亦如之賜於其家十一年正月癸巳版授侍老八十以上上縣令十七年十一月戊申賜侍老帛二十年十一月庚申同二十三年正月乙亥耕籍田侍老百嵗以上版授上州刺史二十六年七月己巳賜侍老粟帛加版授立太子大赦二十七年二月己巳上尊號版授侍老百嵗以上下州刺史九十以上上州司馬八十以上縣令唐賜氊衾紀髙宗顯慶二年二月癸亥幸洛陽賜百嵗以上氊衾粟帛四年閏十月辛巳賜民八十以上氊衾粟帛五年三月丙午皇后賜婦人八十以上氊衾粟帛貞觀十八年十月癸卯宴雍州父老百嵗以上氊被袍各一唐祐燕京畿父老二年九月辛亥大饗明堂十月乙亥燕京畿父老於錫慶院玉海卷七十四
