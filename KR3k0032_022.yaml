李景引安陽水東流溉田入廣潤陂咸亨三年開水經注濮陽城側有寒泉岡即詩在浚之下世謂之髙平渠非也唐平虜渠薑師度傳神龍初試易州刺史河北道巡察度支營田使好興作厮渠於薊門以限奚契丹循武帝故迹並海鑿平虜渠以通餉路罷海運省功多遷司農卿地理志薊州漁陽有平虜渠傍海穿漕以避海難又其北漲水為溝以拒契丹皆神龍中滄州刺史薑師度開滄州清池東南二十里有渠注毛氏河東南七十里有渠注漳並引浮水皆刺史薑度開會要神龍二年滄州刺史薑師度於薊州之北漲水為溝以備契丹奚之入冦又約舊渠旁海穿漕號為平虜渠以避海難通糧者至今賴焉唐玉梁渠長豐渠李渠地理志蔡州新息西北五十里有隋故玉梁渠開元中令薛務增浚溉田三千餘頃瀛州河間西北百里有長豐渠貞觀二十一年刺史朱潭開又西南五里有長豐渠開元二十五年刺史盧暉自束城引滹沱東入淇通漕溉田五百餘頃袁州宜春有李渠引仰山水入城刺史李將順鑿唐西渠地理志魏州貴鄉有西渠開元二十八年九月刺史盧暉徙永濟渠自石灰窠引流至城西注魏橋製樓百餘間以通江淮之貨唐青神渠地理志眉州青神太和中榮夷人張武等百餘家請田于青神鑿山釃渠溉田一百餘頃唐咸應永清渠李景略傳回紇將南冦拜景略豐州刺史天德軍三受降城兵馬都防禦使豐州當回紇通道窮塞苦寒地瘠鹵邊户勞悴景略至節用約已與士同甘苦鑿咸應永清二渠溉田數百頃儲廩器械畢具威令肅然聲雄北疆回紇畏之地理志豐州九原有咸應永清二渠貞元中刺史李景略開溉田數百頃唐蜀岡渠興成渠蜀岡見塘類興成見堰類唐右史渠考功堰特進渠御史渠溫造傳為殿中侍御史以起居舍人宣慰鎮州出為朗州刺史開後鄉渠百里溉田二千頃民獲其利號曰右史渠地理志朗州武陵北有永泰渠光宅中刺史胡處立開通漕且為火備西北二十七里有北塔堰開元二十七年刺史李璡增修溉田千餘頃東北八十九里有考功堰長慶元年刺史李翺因故漢樊陂開溉田千一百頃又有右史堰二年刺史溫造增修開後鄉渠經九十七里溉田二千頃又北百一十九里有津石陂本聖厯初令崔嗣業開翺造亦從而增之溉田九百頃翺以考功員外郎造以起居舍人出為刺史故以官名東北八十里有崔陂三十五里有槎陂亦嗣業所修以溉田後廢大厯五年刺史韋夏卿復治槎陂溉田千餘頃靈州回樂有特進渠長慶四年七月詔開溉田六百頃會要云置營田六百頃冀州衡水有羊令渠載初中令羊元圭引漳水北流貫城注隍孟州濟源有枋口堰太和五年節度使溫造浚古渠溉田五千頃會要云太和五年七月造為河陽節度使奏浚懷州古渠枋口堰役功四萬云云武本傳云奏復懷州古秦渠枋口堰以溉濟源河內溫陟四縣田五千頃虢州弘農南七里有渠貞觀元年令元伯武引水北流入城郭子儀家傳公請開豐寧軍御史渠溉田二千頃元和志千金陂在靈武縣北四十二里長五十里濶十里漢渠在縣南五十里從漢渠北流四十餘里始為千金大陂其左右又有胡渠御史百家等八渠溉田五百餘頃唐永濟渠宗室傳靈龜為魏州刺史鑿永濟渠通新市百姓利之劉黑闥傳躡北至毛州整衆背永濟渠陳隋書大業四年正月乙巳開永濟渠引沁水達于河北涿郡國史志塘水東起乾寧軍西信安軍永濟渠為一水唐龍首渠交渠唐以渠導水入城者有三一曰龍首渠自城東南導滻至長樂坡釃為二渠其一北流入苑一經通化門興慶宫自皇城入太極宫貞元十三年五月引龍首渠水自通化門入至太清宫前二曰永安渠開皇三年開導交水自大安坊西街入城北流入苑注渭三曰清明渠導水自大安坊東街入城由皇城入太極宫括地志按王商傳穿城引豐水入第至貞觀間又堰豐鎬以入昆明而二水於是斷流會要元和八年四月以神䇿軍士修城南交渠唐七級渠代宗紀大厯八年八月己未吐蕃冦靈州郭子儀敗之于七級渠宋朝四渠四河四渠惠民金水五丈汴四河汴黃惠民廣濟至道元年九月丁未上問侍臣汴水疏鑿之由張洎講求其事奏曰惠民金水五丈汴水等四渠派引脈分會于天邑舳艫相接贍足京師以無匱乏惟汴水橫亘中國首承大河漕引江湖利盡南海半天下之賦由此而進大禹疏鑿煬帝開甽終為國家用其天意乎四河漕運興國六年始定數見漕運汴水禹於榮澤下分大河為隂溝出之淮泗酈元注水經曰大禹塞滎澤開渠以通淮泗至浚儀西北復分二渠其後或曰鴻溝始皇疏之以灌魏都者是也或曰莨菪渠自滎陽五池口來注鴻溝者是也或曰浚儀渠漢明帝時循河流故瀆作渠渠成流注浚儀者是也自漢末河入于汳灌注兖豫永平中導汳自滎陽别而東北至千乘入于海故瀆在新渠之南注所謂絶河而受索自此始汲即汴字或曰石門渠靈帝建寧四年於敖城西北纍石為門以遏渠口者是也石門渠東合濟水與河渠東注至敖山之北而兼汴水又東至滎陽之北而旃然之水東流入汴滎陽之西有廣武二城汴水自二城小澗中東流而出濟水至此乃絶桓溫將通之而不果者晉太和之中也晉桓溫自兖州伐燕郗超曰道逺汴水又淺恐漕運難通劉裕浚之始有湍流奔注而岸善潰塞裕更疏鑿以運漕者義熙之十三年也皇甫誼發河南丁夫百萬開之起滎澤入淮千餘里更名之曰通濟渠者隋大業之初也大業元年三月辛亥開通濟渠自西苑引榖洛水逹于河自板渚引河通于淮或曰隋開皇中因漢之舊道河于汳大業初合河索為通濟渠别而東南入于淮而故道竭今於畿為白溝於宋為沙於單為石渠於徐為汳而入於南清通典注坤元録云自宋武北征之後復皆湮塞大業元年更令開導名通濟渠西通河洛南逹江淮唐皮日休作汴河銘曰在隋則害在唐則利裴耀卿言江南租船自淮西北泝鴻溝轉輸河陰含嘉太原等倉凡三年運米七百萬石者唐開元之際也唐初改通濟渠為廣濟渠水德宗朝杜佑請改漕路入琵琶溝經蔡河至陳合潁會徐州順命而止時嵗漕江淮米四十萬石太宗嘗命張洎論著其興鑿漕運之本末如此宋至道之元年也是嵗汴河運米至五百八十萬石唐貞元十四年正月戊子董晉作汴州東西水門三月辛巳朔成周顯德二年疏汴水四年疏汴水入五丈河又東北逹于濟五年三月汴渠成六年二月導汴入蔡水以通陳潁之漕建隆二年春導索水自旃然與須水合入于汴興國三年正月浚汴口九年正月命胡公霸治汴隄四年九月名汴河水門曰上善通津大通淳化二年六月己酉汴決上乘步輦視之命戴興督步卒數千塞之隄立而水藝定河陰汴口每嵗均節水藝濟江淮漕運景德元年十月以許元豹為河陰都監後常以知水事者為之三年六月汴溢上乘步輦幸西水門觀水藝七月築隄畢祭汴口祥符二年八月選知水者減汴口水藝圖上利害四年十月白波發運判官史瑩言尋古碑請於泛水孤柏嶺下緣南岸山趾開汴口以均水藝上以圖付楊守遒同經度內臣閻承翰請於下流開減水四道以防泛溢從之瑩議寢瑩所上開元十五年二月二十五日碑云貞觀中文皇帝命洛州長史李傑創堰鑿山隨山導水連隄以決浪釃河以延濤或言此之溝洫無異涓涔一葦則浮巨艗則膠乃起渠口琢石為門剡木為閣費廣遄塞皇帝疇咨俾乂命范公為開鑿使張琰介焉召水工審地勢調五州數萬卒疏疆劃分荷鍤如雲人百其力皋鼓弗闐平塘成澮夷岸成埧植以柳杞揭以杠梁八年八月馬元方請浚汴河中流廣五丈深五尺命韋繼升度之十二月甲午請自泗州夾岡浚之又於中牟滎澤各開減水河以圖來上奏可天聖六年十月廢梁固舊斗門三於北岸創減水斗門二汴河本禹迹也首受黃河在孟州河陰南每嵗均調水藝止深六尺民蓄浚河器備天聖初始罷春夫減役費九年正月庚申調畿內及近州丁夫五萬浚汴渠皇祐二年八月修中牟汴隄三年九月丙子詔河渠司嵗一濬汴河嘉祐六年都水監奏汴河自泗州至南京道直流駛不復須治自南京以上至汴口水散漫故多淺請自南京都門三百里修狹河木岸扼束水藝從之凡用木揵竹索三百八十四萬二百役工百八十六萬四千為岸三萬一千四百步嘉祐元年九月癸卯自京至泗州置狹河木岸治平三年成人便之七月賞官吏有差舊制汴口啓閉有時熙寧六年十一月用范子竒議遂不閉熙寧二年閏月侯叔獻言汴河兩岸沃壤千里欲稍置斗門泄其餘水分為支渠及引京索河并三十六陂以溉田戊申以提舉府界常平使行之八年六月丙午侯叔獻議因故道鑿隄置閘釃汴水入蔡河通漕十年名北水門曰宣澤郭咨謂導洛入汴河以四時行運張君平及子鞏管汴口君平建言嵗開汴口當審擇其地得其地則水湍駛而無留沙嵗可省疏濬工百餘萬詔用其䇿嘉汴口靈津廟有真宗御製汴水發願文碑祐六年十一月戊辰修碑殿為崇訓殿汴都背倚燕趙面控江淮泰嶽鎮其左溫洛縈其右為天下奧區隋鑿漕渠梁立廟市眷顧經營以俟有德上帝監觀四方相定王國乃眷大梁之野原隰廣博岡陵重復宜受命而帝者建都畫圻以為萬世之業都浚宿兵釃渠引漕黃河禹於頓丘疏二渠分水藝一渠疏畎引傍西山以東夾右碣石入于渤海書所謂北過洚水至于大陸者也一渠自舞陽縣東引入漯水其水東北流至千乘入海即今黃河是也自大伾而北既釃為二至大陸又播為九然後為逆河以與海屬周定王之時禹迹遂改河之為敗自此始周顯德初大決鄆州李穀監治隄以禦之水患少息乾德元年四月甲辰重鑿砥柱三門淳化四年梁睿言滑州每嵗河決南岸請於迎陽鑿渠引水凡四十里至黎陽合大河乃命興役五年正月新渠成又命杜彥鈞鑿河開渠自韓村掃至州西凡十五餘里合于河以分水藝天聖七年五月髙辨髙繼密等上黃河諸掃圖承命殿示輔臣議所行十二月繼密請度河北岸就髙阜築遙隄辨請於澶州分作兩隄詔龍圖閣待制韓億等議餘見後惠民河與蔡河一水即閔河也建隆元年四月浚蔡河設斗門二年正月浚蔡渠命右領軍上將軍陳承昭督其役發京畿陳許丁夫數萬導閔水自新鄭與蔡水合貫京師南歷陳潁逹壽春以通淮右之漕舟楫畢至都人利之於是以西南為閔河東南為蔡河乾德二年二月鑿渠自長社引潩水至京師合閔水渠成民無水患閔河之漕益通潩水出密縣大騩山歷許田開寶六年三月壬午改閔河為惠民河興國四年九月名惠民河水門曰普濟廣利淳化二年以潩水泛溢自長葛開小河導潩水分流二十里合于惠民河咸平五年七月霖雨惠民河溢開封守寇凖治丁岡古河泄導之祥符二年四月陳州請自許之長葛浚減水河及治棗村舊河以入蔡河從之十月於頓固減水河口修雙水門以減陳潁水患九年許州請於大流堰穿渠置二斗門引沙河以漕天聖二年正月修大流堰斗門開減水河通漕二月渠成宋祁作尉氏縣新門泄水河頌嘉祐三年正月開京城西葛家岡新河分入魯溝熙寧八年十月議開惠民河道以便修城九年七月於順天門外直河至染院後入護龍河至咸豐門南入京索河元祐四年六月知陳州胡宗愈議古八丈溝可開浚分蔡河之水自為一支由潁壽入淮詔羅闕治之蔡河貫京師兼閔水洧水潩水以通舟植木橫棧為水之節啓閉以時金水河本京索水導自滎陽黃堆山其源曰祝龍泉過中牟名曰金水建隆二年春命陳承昭鑿渠引水百餘里抵都城西架其水橫絶於汴設斗門入浚溝東滙于五丈河公私利焉乾德三年又引貫皇城歷後苑內庭池沼開寶九年上步自左掖親按地勢命水工引金水鑿渠為大輪注晉邸及潛龍園祥符二年八月決為渠見後天禧二年八月鄭州畎索水入金水役兵千凡六旬畢楊侃賦越廣汴湍流之上轉皇城西北之隅貫都注御溝之口轉漕通廣濟之渠京索導源金水名河廣濟河即五丈河自都城歷曹濟及鄆其廣五丈周顯德四年四月乙酉詔疏汴水北入五丈河齊魯舟楫皆送大梁六年二月命韓令坤自京東疏汴水入蔡河袁彥浚五丈河以通漕建隆二年二月壬申發曹單丁夫數萬浚五丈河自都城北歷曹濟及鄆以通東方之漕給事中劉載督其役上曰煩民奉已朕不為也河渠之役蓋非獲已三月甲辰新水門成車駕臨觀先是河為泥塞命右監門將軍陳承昭於京城之西夾便河造斗門自滎陽鑿渠百餘里引京索二水通城壕入斗門架流于汴東滙于五丈河以便東北漕運三年正月承昭護修河車駕臨觀賜錢三十萬乾德三年引五丈河造西水磑成上臨觀開寶六年三月壬午改為廣濟河興國三年正月發近縣民濬之四年九月名水門曰咸通天聖初改善利景德二年六月上曰斗門本李繼源造始因京索河遇雨即泛入汴遂置之以便通泄因令置巨石熙寧十年名南水門曰永順元豐五年二月十一日罷廣濟河輦運司用李察等議上供物於淮陽界入汴名清河輦運七月御史王植言廣濟安流清河泝流逺近險易有殊六年命定陶令張士澄修廣濟河及渠成嵗漕六十萬給京師元祐元年三月十九日命棣州王諤興復廣濟河運四月十二日都水言廣濟以京索河為源轉漕京東歲計請於宣澤門外架流入咸豐門由舊道復河源以通漕從之天聖六年閻貽慶言廣濟河出濟州之合蔡鎮通梁山泊請治夾黃河引水注之因度工費立橋梁置埧堰踰年而畢慶厯中又濬徐沛之清河任城金鄉之大義河以通漕運輿地廣記汴河蓋古莨蕩渠也首受黃河水隋開浚以通江淮漕運兼引汴水亦曰通濟渠元豐中導洛通入謂之清汴蔡河蓋古琵琶溝也水經汳水出陰溝于浚儀縣北注陰溝即莨蕩渠也于大梁北又曰浚水陳留風俗傳曰浚水徑其北九域志廣濟河禹貢之菏澤京索河官渡即鴻溝也楊侃皇畿賦天設二渠曰蔡曰汴通江會海縈畿帶甸朱昻知泗水作隋河辭曰隋罹其困今受其賜昔濬理兮以豫以遊今通濟兮可沿可浮張方平曰京師古所謂陳留八達之地也國依兵而立兵以食為命食以漕運為本漕運以河渠為主國初浚河渠三道通京城漕運定立上供年額汴河六百萬石廣濟河六十二萬石惠民河六十萬石廣濟河所運止給太康咸平尉氏等縣軍糧而已惟汴河所運粳米兼小麥此乃太倉蓄積之實今仰食官廪者不惟三軍至于京師士庶以億萬計大半待飽于軍稍之餘有汴河則京師可立乃建國之本非可以區區溝洫水利同言也蘇氏書傳曰自唐以前汴泗會於彭城之東北然後東南入淮近嵗汴水直逹于淮不復入泗矣吳王夫差闕溝通水與晉會於黃池而江始有入淮之道禹時則無之故禹貢曰沿于江海逹于淮泗明非自海入淮則江無通淮之地今徐州直云浮于淮泗達于河不言自海則鴻溝官渡汴水之類自禹有之明矣開寶八年正月癸巳命京西漕李符督糧運又用符計發民及鄉兵數千人鑿橫江渠於歷陽符董其役渠成漕運無乏時征李煜九年四月幸西京發卒五千自洛城市橋鑿渠至漕口二十五里以便餽運楚州北山陽灣迅急多沈溺雍熙中漕臣劉蟠議開沙河避淮水之險喬維嶽繼之開河自楚州至淮隂凡六十里舟行便之咸平五年三月河北漕臣耿望開鎮州常山南河自汶河至趙州景德元年正月以河朔輦運勞引定州北唐河至定開渠至蒲陰東六十二里入沙河東經邊吳泊入界河以通漕舟兼溉田限戎馬五月詔滑修已與京東漕臣按行梁山濼開渠疏水于淮八月雄州何承矩請令滄州乾寧軍視斗門引潮入御河東塘堰以益塘水二年正月命定祁州開漕河天聖三年六月張綸請開真州長蘆口河開寶纂禹元經祥符導河形勝書開寶五年六月戊申詔澶濮數州洪河屢決前書但言導河至海未聞力制湍流戰國專利湮塞故道九河之制遂隳歷代之患弗弭搢紳草澤有習河渠之書知疏導之䇿者上書條奏時東魯逸人田告著纂禹元經十二篇召至闕詢以治水之道善其對六年八月王德方上修河利害祥符四年開滑州減水河五年正月戊戌祕閣校理李垂上導河形勝書三篇并圖書目一卷考古揆今欲復河之故道又有導河形勝計功畢功圖今缺詔密學任中正龍學陳彭年等詳定垂書略云從西大河故瀆東北合赤河逹于海於魏縣北御河西析一渠合衡漳水又冀州北深州西南決衡漳西北注滹沱潦則塞之使東漸勃海旱則決之使西灌屯田有以備塞限胡形勝之利出於中國矣漢武舍大伾之故道發頓丘之暴衝則濫兖泛齊夫平原而北地藝下泄水甚易故滄德之交舊障皆全蒲臺而東地藝髙入海稍艱故齊棣之間遊波互出中正等言埀所述自禹至漢河流疏導遷徙洎河北山川地名頗悉詔送史館天禧四年垂復上疏河利害詔至滑德衛貝天雄通利與長吏規度垂請自衛州東曹公所開運渠東五里引之正北稍東十三里破伯禹古隄注裴家潭徑牧馬陂正東稍北四十里鑿大伾西山釃為二渠垂欲釃為别派使緩而不決議寢初祥符八年二月命李及等議開滑州減水河及等請於迎陽村北開小河垂子仲昌塞河背家學歐陽修言五不可太平興國平河歌天禧修河碑天聖修河記開寶八年六月河決澶州頓丘發民數萬修之十一月畢興國二年七月決鄭州滎澤孟州溫縣塞之三年四月決獲嘉懷州靈河滑州塞之八年五月決滑州房村徑澶濮曹濟發卒數萬塞之久不成九月遣柴成務等四人按視南北岸古遙隄西自河陽東至于海周覽舊址凡十州二十四縣及還上言曰治遙隄不如分水藝孟鄆雖有隄防滑澶最為隘狹二州可立分水之制議寢秋命張齊賢祭河加玉幣十二月河塞羣臣賀九年春復決命蘇誨六人督諸郡修之三月河塞凡二十日而塞羣臣賀帝作平河歌示輔臣劉吉督其役景德三年又決祥符三年八月二十五日滑州言河順道北流天禧三年六月乙未滑州河溢天臺山旁復決城西南岸歷澶濮曹鄆注梁山泊濟徐又合清河古汴上流入淮命薛顔等規畫馮守信董修河四年正月白馬津將塞河命張士遜往祭二月丁酉奏河塞己亥學士朝迥致祭庚子羣臣賀于崇德殿上親製文刻碑丙戌作紀成功建于福寧院乾文殿凡薪竹揵災之數千六百萬役九萬人六月丙申復決天臺山下廣五百步深四十丈九月命王黃裳規度十二月請分水藝五年五月開減水河成河漸復北流天聖元年五月命參政魯宗道行河度工費募民輸薪芻調兵伐榆柳五年七月丁巳興役彭睿董之發民三萬八千兵二萬一千緍錢五十萬芻稿千六百二十萬不三月而功就十月丙申滑州言河塞上御承明殿諭輔臣王曾等再拜賀乃作靈順廟于新隄之側十一月丁酉朔名掃曰天臺掃因其山名也己亥百官賀河平遂燕崇德殿命告謝天地社稷陵廟翰學章得象祭河三司使范雍滑守冦瑊等遷秩自天禧三年至是積九嵗乃復塞六年三月瑊請撰記命翰苑宋綬為修河記熙寧十年七月乙丑決澶州曹村元豐元年春修塞以牲玉祭河閏正月丙戌首事四月二十五日名掃曰靈平立廟曰靈津孫洙撰碑是年五月甲戌朔新隄成隄百十四里河自定武還北流六日羣臣表賀告類郊廟勞饗官師又修月隄增卑培薄蘇軾作河復詩吾君仁聖如帝堯百神受職河神驕帝遣風師下約束北流夜起澶州橋太平興國襄漢漕渠三年正月戊戌開襄漢漕渠直抵京師以通湘潭之漕渠成而水不行白河在唐州南流入漢漕臣程能議開是河發八州民數萬命王文寶等董其役端拱元年治荆南漕河至漢江行旅頗便而古白河終不可開至和二年二月丙午襄州宜城令孫永治長渠三月癸未畢時蓄泄止侵爭熙寧六年守臣曾鞏著令上司農八年秋鞏為記曰秦昭王三十八年白起攻楚去􅋣百里立堨壅水為渠以灌􅋣今長渠是也酈道元謂溉田三千餘頃蓋水出西山諸谷者其源廣而流於東南者其勢下秦得􅋣為縣漢惠三年改宜城熙寧二年宜城令朱紘修復木渠溉六千餘頃四月詔增秩紹興三十二年十一月孝宗即位辛酉二十九日督視王徹言襄陽古有二渠長渠溉田七千頃木渠溉三千頃今湮廢臣今先築堰開渠渠成募民雜耕從之熙寧元年九月提舉兩浙河渠胡淮言杭州長安堰秀州杉青堰常州望亭堰宜委令佐循視以時啓閉二年十一月頒農田水利約束元祐六年七月蘇軾録進單鍔吳中水利書一卷太平興國浚汾河三年正月甲午令絳州浚汾河會要九月遣李守澤濬之熙寧九年七月四日太原守韓絳請濬汾河括地志汾水源出嵐州靜樂北百三十里管涔山北東南流入并州即西南流入至絳州蒲州入河至道修鄭白渠元年正月五日度支判官梁鼎陳堯叟言舊史鄭渠引涇水注洛三百餘里溉田四萬頃白渠引涇注渭長二百里溉田四千五百頃今所存不及二千頃鄭渠難興功請遣使視三白渠修舊迹詔大理丞皇甫選光祿丞何亮乘傳經度二年四月丁酉選等言鄭渠久廢用功大三白渠溉涇陽櫟陽髙陵雲陽三原富平六縣田三千八百五十餘頃宜增築隄埭周護之舊設斗門一百七十有六以節水宜悉繕治俾用水有準渠口舊有六石門謂之洪門今亦圯欲就近開渠口以通水道嵗令渠官行視疏浚嚴禁豪民無令決渠盜水以擅其利時著佐孫冕總三白渠詔冕行之未幾而罷王公謂鄭白渠皆上源髙處為堰沿渠立斗門多者至四十餘所以分水勢其下别開小渠方以溉田其作堰之法用石錮以鐵積之于中流擁為雙派南流者仍為涇水東注者釃為二渠故雖駭浪不能壞其防先是至道元年九月堯叟等言陳許鄧潁蔡宿亳壽有召信臣杜詩杜預任峻司馬宣王鄧艾遺迹欲因其溝塍增築隄堰導水利墾公田選亮以為費廣詔止募民耕墾熙寧五年涇陽令侯可議鑿小鄭渠引涇水髙與古鄭渠等十一月十七日都水丞周良孺言自石門北開二丈四尺堰涇水入新渠可溉田二萬餘頃開至臨涇就髙入白渠則水行二十五里利益廣開至三限口五十餘里接雲陽可溉三萬餘頃詔如其議自石門至三限合白渠興修紀景祐三年二月丁卯修陜西三白渠咸平運渠圖五年正月馬濟請自靜戎東至順安軍開浚運渠役萬人一月可就於西開至威虜軍以限戎騎於渠側興水陸營田上指圖曰此渠成亦頗為利宜先修運渠景德三年七月丁卯內出徐州至楚州新河圖其中水淺則施堰埭經吕梁灘磧上曰若此豈可漕運乃罷之先是趙守倫獻議遣使覆視天禧三年五月發運使賈宗顔言嵗漕自真揚入淮汴歷堰者五官煩民疲請浚漕渠廢三堰以均水藝嵗省費十萬癸未詔屯田郎中梁楚按視明年成水注新河與三堰平漕舟無阻公私便之天聖三年七月庚辰朔發運使方仲荀副張綸謂淮南漕河真楚諸州宜作水閘石窗分水溉民田詔為之以漸綸請增長堤二百里旁錮巨石為十闥以疏其橫流明道二年五月辛巳參政王隨供奉官鄧守恭江從瑩上淮南運河圖嘉祐三年春開漕河從張方平之言也四年八月興修河北御河運路元豐七年三月十六日以開龜山運河發運副使蔣之竒等遷秩六年正月始事二月乙卯奏功長六十里廣十五丈深丈有五尺里通略云自龜山蛇浦下屬洪澤鑿為復河亘五十七有竒紹興三年十一月丙辰詔浚運河以漕運不通故也上不欲疲民止發旁郡卒四年正月癸酉經始于臨安兩月而畢八年十一月再浚十九年二月又浚二十九年十月上諭大臣曰禹之溝洫為民故孔子稱無間紂之陂池則縱已私欲故聖人罪之隆興二年十二月臨安守吳芾請開運河乾道三年六月王炎請浚河渠祥符金水渠二年八月命供備庫使謝德權決金水河為渠自天波門並皇城至乾元門歷天街東轉繚太廟皆甃以礲甓植之芳木纍石為梁間作方井復東引由城下水竇入于濠京師便之九月丁卯十六日畢功詔宗正告廟室賜役卒緍錢祥符龍首渠七年六月知永興陳堯叟導龍首渠入城民便之詔嘉奬繞霤未足言其固鄭白未足語其豐天聖疏溝洫二年命閣門祗候張君平等行畿甸距南京宿亳州度形勢疏溝洫君平陳八事君平患京師數離水災言近畿諸州古溝洫與畿內相接嵗久不治諸委官疏鑿天聖元年發運使趙賀行蘇州治積水葺吳江太湖石塘路以捍風濤三年副使張綸開真州之長蘆口為河屬之江舟楫以為便七年發運使鍾離瑾置閘於揚州之召伯堰以通漕天聖復永豐渠四年閏五月辛亥詔陜西漕臣相視修復永豐渠解州後魏正始四年實録云二年都水校尉元清引平坑水為渠西入黃河以運鹽名永豐渠周齊問廢隋大業中都水監姚暹決堰浚渠自陜郊西入解縣民賴其利唐末湮沒鹽運大囏至是殿直劉逵請開浚通舟運鹽解州安邑至白家場漕臣王博文以為便命三司計功浚之公私利焉志云是嵗卒成之公私果利天聖相州渠田四年二月甲寅審刑詳議官王沿言魏史起為鄴令鑿十二渠引漳水溉田歷漢魏齊隋不絶唐至德後其渠遂廢今相魏磁洺之田並漳水者斥鹵不可耕又取為牧地民益困請募民復十二渠渠復則水分無奔決之患可以富數郡之民詔河北漕司規度而洺州倅王軫謂漳水岸髙難開導渾濁不可溉田八月辛巳沿又奏時為監察御史渠田起於戰國魏襄王時前載但言溉灌之饒不言疏導之法唯相州圖經載天井堰魏武帝所作凡二十里分十二墱相拒二百步互相灌注故魏都賦云墱流十二同原異口然則為渠之法必就髙阜鑿岸為渠截流為堰然後水行數里方至平田若渠開二丈四尺則作堰之功可損其半日役萬人五十日而罷若采坯山之石取磻陽之木給利成之鐵用鄭白渠之法扼中流以作堰下流大渠分置斗門餘水東入於御河或水盛溢則下板閉渠以防奔注復三百年之廢迹溉數萬頃之良田雖役百萬數載而畢未足為勞况此五旬之力哉奏雖不行上甚嘉之後沿為河北轉運使導相衛邢趙天平景祐諸渠溉田數萬頃元祐七年八月二十一日邇英讀寶訓上問沿軫所言孰長侍讀顧臨曰沿説可行天聖治河十䇿李渭傳會河決滑州天聖初上治河十䇿慶厯三河圖八年十二月庚辰北京留守賈昌朝言去嵗河敗德博間凡二十一今夏六月癸酉決商胡莫若東復故道盡塞諸口謹繢縲川橫隴商胡三河為圖以進詔學士郭勸等與河北京東漕臣議利病以為故道不可復遂已河自商胡西趨恩冀功大不復塞至和二年九月李仲昌議自商胡下鑿六塔渠引河東注橫隴故道一云開修六塔河丁卯令兩制臺諫議丙子歐陽修請就下流求入海之路而浚之甲申孫抃言六塔下流可導而東去以紓恩冀金隄之患卒從仲昌議十二月丁亥修六塔河十二月戊子以仲昌都大提舉河渠司嘉祐元年四月塞商胡一夕復決昌朝欲復故道仲昌請開六塔歐陽修皆謂不然慶厯河防通議書目一卷慶厯八年河決澶淵詔有司防塞屯田員外郎沈立督役因考揆前志詢擇時論著為八議沈立在商胡采托大河事迹古今利病曰河防通議皇祐溉漕新書熙寧水利圖經宣和編類河防書皇祐三年五月壬申置河渠司于三司五年七月癸丑州判官李虛一上溉漕新書四十卷其書記古今河渠事其間言塞六塔便詔送河渠司嘉祐三年十一月己丑二十二日置在京都水監以吕景初判監罷河渠司元祐元年四月四日李常請置外都水使者四年七月復置以河北漕臣謝卿才兼領熙寧九年八月二十四日判都水監程師孟言臣昔提刑河東兼河渠事本道有黃河礬山水絳州正平有馬壁谷水勸民開渠溉田五百餘頃凡九州二十六縣興修田四千二百餘頃并修復舊田五千八百餘頃計萬八千餘頃嘉祐五年功畢集成水利圖經二卷付州縣遵行逮今十七年尚慮河東荒塉之田可引河以溉奏遣都水丞耿琬視之元豐之制水部掌水政崇寧二年十月有司請推廣元豐水政宣和二年八月二十九日編類河防書成二百九十二卷嘉祐永通河二股河二年有司言至和大水京城罹害宜自祥符縣葛家岡穿河直城南好草陂北入惠民河分注魯溝則無水患三年正月戊戌發卒調民穿河於京城西紀云正月戊戌鑿永通河役工六十萬九月成癸巳名曰永濟河紀云永通十一月己丑置都水監五年春河北漕韓贄穿二股渠分河流入金赤河役夫三千一月而畢七月丙辰上二股河圖四界首八年贄判都水二月命贄及丞李立之與河北漕唐介按視修二股河治平元年五月命都水浚二股河紓恩冀水災熙寧元年十一月十三日命翰學司馬光度二股河利害二年八月五日己亥光言禹分九河漢釃二渠河順則為患小矣河併為一則勞費倍分為二則費減半張鞏等欲塞二股河北流恐費大而功不成十四日鞏言北流已塞辛亥詔閉斷北流四年七月河決大名五年三月塞之導河入二股七年浚魚肋河復二股河故道元祐七年吕大防曰黃河持議者有三説一曰回河二曰塞河三曰分水為四隄二河分減水藝實為大利河渠志嘉祐二年有司獻説云云明年正月乃發官卒調民丁鑿河九月而成役工六十三萬目曰永通河紀治平元年五月己亥濬二股五股河嘉祐復召信臣渠三陂五年七月三司使包拯言京西多間田而唐州四縣田之入草莽者十八九民多流散守臣趙尚寬興復召信臣渠及境內陂堰溉田數萬頃荒瘠變為沃壤流民自歸淮南河北之民至者萬餘户丙午詔褒之留再任唐土曠民稀尚寬按視圖記得召信臣故迹發卒復三大陂一大渠皆溉田萬餘頃又教民自為支渠數十轉相浸灌四方之民來者雲集以間田計口授之貸錢買牛比三年皆為膏腴增户萬餘王安石作新田詩美之離離新田其下流水孰知其初灌莽千里其南背江其北逾淮父抱子扶千百其來其來僕僕鏝我新屋趙侯劬之作者不飢嵗仍大熟飽及雞鶩僦船與車四鄰出穀今遊者處昔止者留維昔牧我不如今侯侯來適野不有觀者稅于水濵問我鰥寡侯其來矣三嵗于兹誰能止侯我往求之蘇軾過唐作新渠詩五章庚子正月始復三陂疏召渠招懷逺人散耕于唐詩曰新渠之水其來舒舒溢來其野至于通衢渠成如神民始不知問誰為之邦君趙侯新渠之田在渠左右渠來奕奕如赴如湊如雲斯積如屋斯溜嗟唐之人始識粳稌新渠之民自淮及潭挈其婦姑或走而顛王命趙侯宥我新民無與王事以訖七年侯謂新民爾既來止其歸爾邑告爾鄰里良田千萬爾擇爾取爾耕爾食遂其爾有築室于唐孔碩且堅生為唐民飽鬻與饘死葬于唐祭有雞豚天子有命我惟爾安治平元年正月甲寅增秩賜錢以卒其功增佃者二千餘户熙寧五年五月十九日常平使者陳世修請于唐州石橋南北岸纍石為虹橋架水入東西邵渠灌注九子等十五陂則二百里間水利均浹命唐守蘇涓覆視召渠乘髙寫水類鄭渠志嘉祐中趙尚寬髙賦相繼守唐州稍修復渠堰熙寧白溝河元豐清汴至道元年二月邢用之等請開白渠河自京抵吕梁口凡五六百里以通漕命興役王矩言不可而止咸平六年秋白渠溢用之往視自襄邑疏下流導京城積水命董役成之祥符二年八月金水河防決有言汴河南有三十六陂古蓄水之地必有下流通諸河詔度地畫圖及修隄防熙寧二年閏十一月十五日提舉常平侯叔獻言汴河嵗漕東南六百萬斛費率數石而致一夾河沃壤千里牧地廢田二萬餘頃宜於汴河南置斗門泄餘水分為支渠十二月二十三日命於夾河引汴水溉田六年八月十六日叔獻以都水丞上言承詔開白溝等河以白溝為清汴儲三十六陂及京索二水為源倣真楚開平河置閘四時行舟丁亥命劉瑜一作璯覆視河長八百里功大分三嵗興作與汴蔡皆通轉輸七年正月二十七日都水請停修白溝奏可政和二年十月開含暉門外白溝河輿地廣記云在封丘縣八年四月十七日程昉請修滹沱河九年六月成元豐元年五月張從惠言汴河嵗閉塞修隄防勞費往有建議導洛入汴患黃河齧廣武山功大不可為去年七月水退河稍北宜鑿渠導洛為萬世利六月十五日都水丞范子淵畫十利請於汜水鎮北門導洛為清汴通漕十二月六日又言河陰西十里至洛口地形西髙東下可行水丙午命安燾等相視二年正月燾奏功不可成三月庚寅詔內侍宋用臣提舉導洛通汴四月甲子興役六月戊申畢工凡四十五日甲寅清汴成用工九十萬七千有竒自任村沙谷至河陰汜水關北通黃河接運河長五十一里兩岸為隄長一百三里每二十里為揵以節湍流三年五月二十二日改提舉職為汴河隄岸司六月乙卯刻元豐導洛記于洛口廟記曰三年夏築隄于河洛之兩間以捍黃水鑿渠于廣武山之麓以導伊洛熙寧洪澤河四年八月四日命發運副使史公弼修泗州洪澤河初公弼言漕運涉淮有風濤之險請開是河六十里五年正月十七日畢功錫公弼銀幣九年五月二十六日王子京修運鹽河自泰州至如臯百七十餘里元豐二年八月十三日浚淮南運河自召伯堰至儀真十四節分二嵗用工從漕臣請也六年八月六日發運副使蔣之竒請開治長淮洪澤河命都水丞陳祐甫視之役民夫九萬二千分二嵗開浚元符元年三月五日修楚州河賜名通漣河先是天禧三年十二月命張宗象相視開楚州運河山乾道七年二月命漕臣開龜洪澤運河元豐四年四月河決小吳七年七月決冀洺及北京八年十一月志在七年十月王令圖議復大河故道命李常視之常言不可遂罷時元祐元年正月也九月命張問規度請開孫村口河分水藝二年三月安燾建議回河之役遂興四年正月罷其役五年二月四日命都水使者吳安持修減水河七年十月十二日大河東流賜安持三品服八年正月三十日中書侍郎范百祿言水官託以分水實欲回河夫壅防百川古人所忌周太子晉諫壅穀洛是也紹聖元年十月十四日謝卿材言河流稍行止無可回之理上河議一編二十九日都水使者王宗望言上稟成算斷北流除河患熙豐河溢者四十一決者一大決者二元豐天源河五年六月戊寅詔拆金水河透槽回水入汴自汴河北引洛水入禁中賜名天源河先是京索河水在汴南舊由汴隄上為槽北跨汴以過水然舟至即啓槽頗妨行舟時既導洛通汴乃自城西超宇坊引洛水由咸豐門立隄凡三千三十步水遂入禁中而槽廢政和四年十一月創開天源河成河北塘水志自何承矩以黃懋為判官始開置屯田築隄儲水為阻固其後益增廣之凡並邊諸河若滹沱胡蘆永濟等河皆滙于塘天聖以後領于沿邊屯田司或曰以無用之塘廢可耕之田不如勿廣以息民為根本或曰河朔幅員二千理地平夷無險阻自邊吳淀至泥姑海口綿七州軍屈曲九百里深不可以舟行淺不可以徒涉雖有徑兵不能度也東有所阻則甲兵之備專力于西孰謂無益明道二年劉平奏自邊吳淀望趙曠川長城口乃契丹出入要害之地東西不及百五十里今契丹多事我乘此以引水植稻為名開方田隨田塍四面穿溝渠縱廣一丈深二丈兩溝問屈曲為徑路才令通步兵引曹鮑徐河雞距泉分注溝中地髙則用水車汲引灌溉遂密敕平與楊懷敏漸建方田塘日益廣景祐二年知雄州葛懷敏請立木為水則以限盈縮慶厯二年申定誓約兩界塘淀如舊第罷增廣懷敏自以為塘水捍冦其功愈於兵入奏指圖曰臣於水邊為陛下置水虎翼軍一百萬矣議者或苦其侵民田嘉祐中知雄州趙滋言徐河築隄斷水入塘宜開水竇六十尺修石限以節之八年河北提刑張問言視八州軍塘出土為隄以蓄西山之水則涉夏河溢而民田無患亦施行焉曹瑋浚渭州北古池為渠溉田詔奬之祥符七年四月癸未張亢為應天府推官治白沙石梁二渠民無水患劉從廣知洺州漳水溢穿隋故渠以殺水勢葉清臣知永興軍浚三白渠溉田踰六千頃郭咨知欣州開渭渠導汾水興水利置屯田左傳哀九年秋吳城𨝍溝通江淮注於𨝍江築城穿溝東北通射陽湖西北至末口入淮通糧道也今廣陵韓江是博物志徐偃王欲舟行上國乃通溝陳蔡之間水經注説者咸云漢武微行柏谷遇辱竇門又感其妻深識之饋既返玉階厚賞賚焉賜以河津令其鬻渡今竇津是也管子水出山而流入海者命曰經水引他入於大水及海者命曰枝水出於地溝流於大水及於海者又命曰川水新論四瀆之源河最髙而長從髙注下水流激浚故其流急司馬相如傳朅度九江越五河注師古曰五色之河也仙經説有紫碧絳青黃之河柳子厚興州江運記昔之為國者惟水事為重故有障大澤勤其官而受封國者西門遺利史起興歎白圭壑鄰孟子不與曽南豐政要策史起溉鄴田鄭國鑿涇水李冰修二江之利漢文翁穿煎㳛鄭當時引渭莊熊引洛兒寬開六輔渠白公注涇渭召信臣廣鉗盧之浸後王景理芍陂馬臻築鑑湖晉杜預疏荆兖之水張闓理曲阿之塘宋人引渒魏人引河唐疏雷陂築句城除堰遏之害皆代天施長地力衣食元元而足公家之費李垂導河形勝書春秋二百四十二年災異畢書獨不書河決者夏禹故道存也今河勢益北因此可遂復故道歐陽修曰治水本無竒䇿相地勢謹隄防順水性之所趨雖大禹不過此河渠或以漕挽或以灌溉在利民而已後世邀功之臣興不急之役以耗國疲民無益實利水莫大於四瀆而河數徙失禹故道濟水又王莽時而絶况衆流之細其通塞豈得而常玉海卷二十二
