body:
  text: 玉海卷二十二宋王應麟撰地理河渠唐龍門渠廣濟渠利人渠涑水渠延化渠地理志同州韓城有龍門山武德七年治中雲得臣自龍門引河溉田六千餘頃會要武德七年四月九日同州治中雲得臣開渠自龍門引黃河溉田六千餘頃陜州陜縣有南北利人渠南渠貞觀十一年太宗東幸使武候將軍丘行恭開有廣濟渠武德元年陜東道行臺金部郎中長孫操開引水入城以代井汲傳陜州城中無井人勤於汲操釃河入城百姓利安宿州虹縣有廣濟新渠開元二十七年採訪使齊幹開自虹至淮陰北十八里入淮以便漕既成湍急不可行遂廢傳以淮至徐城險鑿渠十八里入青水人便其漕河中虞鄉北十五里有涑水渠正觀十七年刺史薛萬徹開自聞喜引洓水下臨晉趙州昭慶城下有澧水渠儀鳯三年令李玄開以溉田通漕夏州朔方貞觀七年開延化渠引烏水入庫狄澤溉田二百頃舊紀貞元七年八月庚戌夏州奏開延化渠云云劍州陰平西北二里有利人渠引馬閣水入縣溉田龍朔三年令劉鳯儀開寶應中廢後復開景福二年又廢唐黎陽新河懷州新河地理志衛州黎陽有新河元和八年觀察使田弘正及鄭滑節度薛平開長十四里濶六十步深丈有七尺決河注故道滑州遂無水患懷州修武西北二十里有新河自六真山下合黃母泉水南流入吳澤陂大中年令杜某開德州平昌有馬頰河久視元年開號新河會要元和八年十二月魏博觀察使田弘正奏準詔開衛州黎陽縣故黃河道從薛平之請也先是滑州多水災平詢諸將吏得古河道於衛州黎陽縣界遣從事裴弘泰以水患告於弘正請開古河用分水力弘正上聞詔許之乃於鄭滑召徒萬人鑿古河決舊河以注新河詔並褒美薛平傳始河溢瓠子東泛滑距城才二里所平按求故道出黎陽西南遣從事裴弘泰請弘正弘正許之乃籍民田所當者易以他地疏道二十里以釃水悍還壖田七百頃於河南自是滑人無患漢志黎陽注晉灼曰黎山在其南河水經其東其山上碑云縣取山之名唐直河地理志泗州盱眙有直河太極元年勑使魏景倩引淮水至黃土岡以通揚州唐張甲河地理志貝州經城西南四十里有張甲河神龍三年薑師度因故瀆開漢志在清河郡信成首受屯氏别河東北至蓨入漳水唐疏嘉陵江通漕汶江溉道地理志興州長舉元和中節度使嚴礪自縣而西疏嘉陵江二百里焚巨石沃醯以碎之通漕饋成州戍兵泉州晉江縣北一里有晉江開元二十九年别駕趙順政鑿􅗂通舟楫彭州九隴武后時長史劉易從決唐昌沱江鑿川派流合堋口埌岐水溉九隴唐昌田民為立祠柳宗元興州江運記自長舉而西導江而下二百里而至隨山之曲直以休人力順地之髙下以殺湍悍決去壅土疏導江濤萬夫呼抃莫不如志雷騰雲奔百里一瞬既會既逺淡為安流蒸徒謳歌枕卧而至戍人無虞專力待寇髙儉傳進益州長史秦時李冰導汶江水灌田瀕水者頃千金民相侵冒士廉附故渠厮引旁出以廣溉道人以富饒宋朝興國三年七月遣麴紹浚嘉州江置斗門節水唐長安漕渠運木渠地理志京兆府長安大厯元年尹黎幹自南山開漕渠抵景風延喜門入苑以漕薪炭會要永泰二年即大厯元年七月十日鑿運木渠自京兆府直東至薦福寺東街北至國子監東至子城東街正北逾景風門延喜門入于苑濶八尺深丈餘京兆尹黎幹奏黎幹傳遷京兆尹以治稱京師苦樵薪乏幹度開漕渠興南山谷口尾入于苑以便運載帝為御安福門觀之幹密具􅔓船作倡優水嬉冀以媚帝久之渠不就唐長安西市潭地理志京兆長安天寶二年尹韓朝宗引渭水入金光門置潭于西市以貯材木會要置潭於西市之街餘同志韓朝宗傳分渭水入金光門滙為潭以通西市材木唐陵陽渠食貨志建中初宰相楊炎請置屯田于豐州發關輔民鑿陵陽渠以增溉京兆尹嚴郢嘗從事朔方知其利害以為不便疏奏不報郢又奏五城舊屯其數至廣以開渠之糧貸諸城約以冬輸又以開渠工直市給田者據估轉榖如此則關輔免調發五城田闢比立浚渠利十倍也時楊炎方用事郢議不用而渠亦不成會要建中三年四月宰相楊炎請於豐州置屯田發關輔人開陵陽渠云云楊炎傳請開豐州陵陽渠發畿縣民役作渠卒不就嚴郢傳炎請鑿陵陽渠郢奏發二京關輔民浚豐渠營田擾而無利地理志豐州九原有陵陽渠建中三年浚之以溉田置屯尋棄之唐靈渠地理志桂州理定今興安西十里有靈渠引離水故秦史祿所鑿後廢寶厯初觀察使李渤設斗門十八以通漕俄又廢咸通九年刺史魚孟威以石為鏵隄亘四十里植大木為斗門至十八重乃通巨舟雍州鬱水自蠻境七源州流出民常苦之景雲中司馬吕仁引渠分流以殺水勢自是無沒溺之害李渤傳桂有灕水出海陽山世言秦命史録伐粵見嚴安傳鑿為漕通道嶠南馬援討徴側復治以通餽後江水潰毁渠遂廞淺每轉餉役數十户濟一艘渤釃浚舊道障泄有宜舟楫利焉國初漕臣邊詡嘉祐憲臣李師中乾道帥臣李浩皆修是渠紹熙甲寅十二月庚申帥臣朱晞顔等重修紹興二十九年十二月臣僚言廣西靈渠接全州大江其渠僅百餘里詔漕臣修復以通漕運漢傳嚴安書曰秦使尉屠睢攻越使監祿鑿渠運糧深入越地淮南王安書曰秦使尉屠睢擊越監祿鑿渠通道漢武戈船之師出零陵下灕水馬伏波餉南征之戍開鑿導順而渠之利益闢唐紫溪渠永樂渠地理志杭州於潛南三十里有紫溪渠溉田貞元十八年令杜泳開又鑿渠三十里以通舟楫壽州安豐東北十里有永樂渠溉髙原田廣德二年宰相元載置大厯十三年廢唐敷水渠地理志華州華隂西二十四里有敷水渠開元二年薑師度鑿以泄水害五年刺史樊忱復鑿之使通渭漕唐利俗渠羅文渠地理志華州鄭縣西南二十三里有利俗渠引喬谷水東南十五里有羅文渠引小敷谷水支分溉田皆開元四年詔陜州刺史薑師度疏故渠又立隄以捍水害虢州弘農南七里有渠貞觀元年令元伯武引水北流入城唐三輔渠鄭白渠詳見下會要開元九年正月李元紘擢京兆少尹詔令疏決三輔渠時王公權要之家治渠立磑以治水田元紘一切毁之百姓大獲其利廣德二年李栖筠奏拆京城北白渠上王公碾磑七千餘所大厯十三年正月辛酉黎幹奏以鄭白支渠碾磑請皆毁廢從之太和二年三月內出水車樣令京兆造水車散給沿鄭白渠百姓以溉田官志水部京畿有渠長斗門長李元紘傳開元初為萬年令賦役稱平擢京兆少尹詔決三輔渠時王公權家皆旁渠立磑瀦遏爭利元紘敕吏盡毁之分溉渠下田下賴其恩通典永徽六年雍州長史長孫祥奏言曰鄭白渠溉田乃萬餘頃今為富商大賈競造碾磑渠流梗澀於是遣祥分檢渠上碾磑皆毁之唐光祿渠靈鹽屯田李聽傳為靈州大都督府長史境內有光祿渠廢塞嵗久欲起屯田以代轉輸聽復開決舊渠溉田千餘頃後賴其利唐伊婁渠埭齊浣傳為潤州刺史北距瓜步沙尾紆滙六十里舟多敗溺浣徙漕路由京口埭治伊婁渠以達揚子嵗無覆舟減運錢數十萬又立伊婁埭官征其入招還流人五百户地理志潤州丹徒開元二十二年刺史齊浣以州北隔江舟行繞瓜步回還六十里多風濤乃于京口埭下直趨渡江二十里開伊婁河二十五里渡揚子立埭嵗利百億舟不漂溺會要開元二十六年十一月五日齊浣奏請開伊婁河又立伊婁埭渠通江湖見於遷書唐漕江淮撤閘置堰淳化廢之至于紹聖使臣孝藴易堰以閘唐漕渠廣運潭漢運渠唐三門運渠食貨志兼用韋堅傳唐都關中號稱沃野土地狹所出不足給京師常漕東南之粟髙祖太宗用物有節易贍漕運不過二十萬石髙宗後嵗益增多開元二十一年裴耀卿請置東西倉以避三門水險謂之水陸運浮渭以實關中開元二十九年李齊物鑿砥柱為門以通漕史記正義底柱山俗名三門山在硤石縣東北五十里在河之中然水益湍悍舟不能入天寶三載韋堅為陜郡太守兼水陸運使以代之始漢有運渠起闕志作關門西抵長安通山東租賦訖隋常治之堅為使乃占咸陽壅渭為堰絶灞滻並渭而東注永豐倉下復與渭合永豐倉下在渭水入黃河處漢之船司空也初滻水銜苑左有望春樓堅于下鑿為潭以通漕二年而成志又於長樂坡瀕苑墻鑿潭於望春樓下通舟楫積樓下連檣彌亘數里觀者山帝為升樓詔羣臣臨觀堅預取洛汴宋山東小斛舟三百首貯之潭使諸州各揭其郡名陳其土地所産寶貨諸竒物於栿上先是民間唱俚歌曰得體紇那邪其後得寶符於桃林於是陜尉崔成甫更得體歌為得寶弘農野堅命舟人為吳楚服大笠廣袖芒屩以歌之成甫又廣之以為歌辭十闋自衣缺後緑衣錦半臂紅抹額立第一船為號頭以唱集兩縣婦女百餘人鮮服艷粧鳴鼓吹笛以和之衆艘以次輳樓下天子望見大悅擢堅左散騎常侍官屬賞有差蠲役人一年賜其潭名廣運是嵗漕山東粟四百萬石自裴耀卿言漕事進用者常兼轉運之職而堅為最會要天寶元年三月開二年三月二十六日成敕潭以廣運為名通典作三年通鑑天寶二年三月丙寅上幸望春樓觀新潭四月名潭曰廣運舊紀云上幸廣運樓以觀之地理志華州華隂有漕渠自苑西引渭水因石渠會灞滻經廣運潭至縣入渭天寶三載韋堅開京兆府長安大厯元年尹黎幹自南山開漕渠入苑以漕炭薪萬年有南望春宫臨滻水西岸有北望春宫宫東有廣運潭未幾潭不可漕付司農掌之為捕魚之所通鑑天寶元年陜州刺史李齊物穿三門運渠正月辛未渠成唐千金渠萬金渠地理志趙州柏鄉西有千金渠萬金堰開元中令王佐所浚築以疏積潦相州堯城北四十五里有萬金渠引漳水入故齊都領渠以溉田咸亨三年開漢志張掖郡觻得有千金渠西至樂涫入澤中後魏地形志鄴縣天平中決漳水為萬金渠今世號天平渠唐華陰漕渠見上洛漕新潭泗州新漕渠見漕運唐寧晉渠普濟渠地理志趙州寧晉本癭陶縣天寶元年更名地旱鹵西南有新渠上元中肅宗令程處默引洨水入城以溉田經十餘里地用豐潤民食乃甘昭慶城下有澧水渠儀鳯三年令李元開以溉田通漕兖州萊蕪西北十五里有普濟渠開元六年令趙建盛開唐通濟渠詳見漕運汴渠闕隋文開皇四年開通濟渠隋志滎陽郡浚儀有通濟渠自渭達河通漕至唐代宗賜劉晏劉晏傳領轉運租庸使乃自按行浮淮泗逹于汴入于河右修底柱硤石觀三門遺迹至河隂鞏洛見宇文愷梁公堰厮河為通濟渠視李傑新隄盡得其利病移書宰相言漕之四利四病盡以漕事委凡致四十餘萬斛廣德二年柏良器傳李希烈決水灌寧陵良器救之擇弩手善遊者沿汴渠夜入唐鄭白支渠又見三輔渠地理志京兆府雲陽有古鄭白渠見下列傳李栖筠進工部侍郎廣德二年關中舊仰鄭白二渠溉田豪戚壅上遊取磑利且百所奪農用十七栖筠請皆徹毁嵗得租二百萬民賴其入黎幹大厯八年為京兆尹十三年涇水壅隔請開鄭白支渠復秦漢故道以溉民田廢碾磑八十餘所正月辛酉嗣薛王知柔為京兆尹始鄭白渠梗壅民不得嵗知柔調三輔治復舊道灌浸如約遂無旱虞渠成三輔民扶老携幼詣闕請立石紀功知柔謙退得止碑不果立突厥傳杜佑謂通典秦漢鄭渠溉田四萬頃白渠溉田四千五百餘頃永徽中兩渠灌寖不過萬頃大厯初減至六千畝畝朘一斛嵗少四五百萬斛復兩渠之饒誘農夫趣耕擇險繕壘屯田蓄力河隴可復豈惟自守而已通典云大歷初減至六千二百餘頃比於漢代減一萬八九千頃會要太和二年三月內出水車樣令京兆造水車給鄭白渠百姓溉田唐三白