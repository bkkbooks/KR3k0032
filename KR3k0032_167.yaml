  text: 玉海卷一百九十三卷一百六十七欽定四庫全書
  hash: sha256:7a220d31b6322babd6807c4efb06c056f98d14b2ec47786618115435447762d7
  markers:
  - {type: page-break, offset: 14, content: '', id: KR3k0032_WYG_167-1a, image: WYG0947/WYG0947-0335c.png}
body:
  text: 玉海卷一百六十七宋王應麟撰宫室院上院者取名於周垣也唐集賢殿書院麗正殿書院乾元院光順門書院御書院著作院乾元殿四部書集賢注記開元十八學士圖待制賜宴賦詩六典集賢殿書院開元十三年置藝文志玄宗命左散騎常侍昭文館學士馬懷素為修圖書使與右散騎常侍崇文館學士褚無量整比會幸東都係開元五年乃就乾元殿東序即武后時東都明堂後改名檢校又借民間異本傳録及還京師六年冬遷書東宫麗正殿置修書院於著作院一本五年幸東都六年還京七年於麗正殿安置為修書院其後大明宫光順門外十一年東都明福門外十二年皆創集賢書院學士通籍出入兩都各聚書四部以甲乙丙丁為次列經史子集四庫其本有正有副軸帶帙籤皆異色以别之開元九年冬幸東都時集賢院四庫書總八萬二千三百八十四卷六典云十二年駕幸東都於命婦院安置京師集賢院開元十一年分置此院大明宮光順門外院內東西八十步南北六十九步院中有仰觀臺即一行師占候之所東都集賢院明福門外大街之西對武成宮東西四十一步南北五十八步開元十年三月始移書院於此西向開門華清宫集賢院二十八年造在宫北橫街西羽林仗院院內東西四十八步南北五十步興慶宫集賢院二十四年駕在東都張九齡遣魏光祿先入京造此院在和豐門橫街之南鄰中書省院東西二十三步南北三十步已上見集賢記注并會要百官志集賢殿書院學士直學士侍讀學士修撰官掌刋緝經籍凡圖書遺逸賢才隱滯則承旨以求之謀慮可施於時著述可行於世者考其學術以聞凡承旨撰集文章校理經籍月終則進課於內嵗終則考最於外校書四人正字二人注開元五年乾元殿寫四部書置乾元院使有刋正官四人押院中使一人知書官八人分掌四庫書六年乾元院更號麗正修書院置使及檢校官會要五年十一月題為麗正殿修書院以馬懷素褚無量為使初置院皆無量處置八年正月以元行沖充使改修書官為麗正殿學士六年十二月八年加文學直又加修撰校理刋正校勘官馬懷素傳元行沖知麗正院奏陸紹伯等入校書由是祕書罷撰緝而學士皆在麗正矣十一年五月置麗正院修書學士光順門西京外亦置書院十二年會要十一年東都明福門外亦置麗正書院十三年改麗正修書院為集賢殿書院五品以上為學士六品以下為直學士宰相一人知院事常侍一人為副知院事又置判院一人押院中使一人玄宗嘗選耆儒日一人侍讀以質史籍疑義至是置集賢院侍講學士侍讀學士其後又增修撰官校理官待制官留院官知檢討官文學直之員至德二載置大學士貞元初置編録官四年五月十一日李泌奏罷大學士八年六月十二日陳京奏罷校理置校書四人正字二人元和二年七月復置校理復開元故事罷校書正字四年集賢御書院學士直學士皆用五品如開元故事以學士一人年髙者判院事非登朝官者為校理餘皆罷裴垍建言初大宗即位命京官五品以上更宿中書門下兩省以備訪問永徽中命弘文館學士一人日待制於武德殿西門文明元年詔京官五品以上清官日一人待制於章善明福門先天末又命朝集使六品以上二人隨仗待制永泰時元年三月壬辰朔勳臣罷節制無職事皆待制於集賢門凡十三人嗣吳王祗傳云大厯時勳臣無職事待詔於院給餐錢廬舍自左僕射裴冕等十三人為之崔祐甫為相建議文官一品以上更直待制其後著令正衙待制官日二人獨孤及上疏曰詔書召裴冕等集賢待制以備詢問此五帝盛德也恐有容下之名無聽諫之實月杜甫奏三賦待制集賢院為注記云開元二十年三史惟則入院待制張悱集賢判官詔綴修魏書説林擢知圖書括訪異書使張説傳説為中書令開元十三年四月五日丙辰説因倡封禪議受詔與諸儒草儀多所裁正帝召説與禮官學士置酒集仙殿曰朕今與賢士樂於此當遂為集賢殿舊紀四月丁巳改乃下詔改麗正書院為集賢殿書院授説學士知院事後説罷中書令以右丞相在集賢院専修國史十六年二月説兼學士朝廷大述作多出其手帝好文辭有所為必使視草多引天下知名士以佐佑王化粉澤典章成一王法天子尊尚經術開館置學士修太宗之政皆説倡之常典集賢圖書之任始帝欲授説大學士辭曰學士本無大稱中宗崇寵大臣乃有之臣不敢以為稱固辭乃止後宴集賢院馬植傳云開元中麗正殿賜酒大學士張説以下十八人不知先舉者説以學士德行相先遂同舉酒故事官重者先飲説曰吾聞儒以道相高不以官閥為先後於是引觴同飲時服其有體中書舍人陸堅以學士或非其人而供擬太厚無益國家議白罷之説聞曰古帝王功成則有奢滿之失今陛下崇儒向道躬自講論詳延豪俊則麗正乃天子禮樂之司集賢注記云麗正殿在東宫正殿崇教殿之北光天殿之南所費細而所益者大陸生之言蓋未達耶帝知遂薄堅會要開元十三年四月五日通鑑作四月丙辰文同因奏封禪儀注敇中書門下及禮官學士等賜宴於集仙殿上曰與卿等賢才同宴於此宜改集仙殿曰集賢殿改麗正書院為集賢院乃下詔曰仙者捕影之流朕所不取賢者濟理之具當務其實院內五品已上為學士六品已下為直學士中書令張説充學士知院事散騎常侍徐堅為副開元十年張説都知麗正殿修書事徐堅為副禮部侍郎賀知章中書舍人陸堅並為學士考功貟外郎趙冬曦監察御史咸􅛫業左補闕韋述李子釗陸去泰吕向拾遺母煚太學助教余欽四門博士趙元默校書郎孫季良並直學士太學博士侯行果四門博士敬會真右補闕馮朝隱並侍講學士集賢注記開元十三年三月因奏封禪儀注敕學士等賜宴集仙殿羣臣賦詩上製詩序時預坐者宰臣源乾曜侍中張説學士徐堅至馮朝隱等時櫻桃新熟遍賜坐上飲以酴醿清酤之酒簾內出彩箋令羣臣賦詩焉其後賀知章歸老令所司供帳百官賦詩上自為序自餘著名徐嶠王逈質徐楚璧後名安正俱為集賢學士又有尹愔陸堅鄭欽盧僎名稍著吳兢為史官撰唐書及春秋未成後上書請畢功詔就集賢院成書舊紀開元十三年夏四月丁巳改集仙殿為集賢殿麗正殿書院為集賢殿書院院內五品已上為學士六品已下為直學士十八學士張説知院徐堅為副賀知章陸堅趙冬曦咸􅛫業韋述李子釗陸去泰吕向母煚余欽趙元默孫季良康子元侯行果敬會真馮朝隱一有東方皓翰林盛事開元中拜張説等十八人為學士於東都上陽宫含象亭圖象寫御贊述之其第五有馮朝隱翰林志開元中張説等十七人寫真含象亭御製贊張説至孫季良十七人贊康子元傳帝嘗製贊賜説子元命工圖其象陸堅傳圖形禁中親製贊賀知章傳開元十三年兼集賢學士玄宗自為贊賜之他學士傳皆無聞集賢注記張燕公等獻所賦詩上各賜贊以褒美之敕曰得所進詩甚有佳妙風雅之道斯焉可觀並據才能略為贊述上自於五色箋八分書之尹鳯翔就院付學士張説德重和鼎功踰濟川詞林秀色翰苑光鮮徐堅校書天祿論經上庠英詞婉麗雄辨抑揚賀知章禮樂之司文章之苑學優藝博才髙思逺趙冬曦白簡端嚴青史良直清詞雅韻博文強識康子元才識清逺言談幽祕四科文學六書仁義侯行果洪鍾佇叩明鑑不疲理窮繫彖動中威儀韋述職參山甫業纂玄成六義述作四始飛英敬會真名乃會真迹惟契道摳衣講習臨庭振藻趙元默才比丘明學兼儒墨敘述媺婉講論道德東方皓校理地遊天祿門嗣滑稽三冬足用六藝斯齊李子釗干木流慶指樹貽方諷諫遺缺啓發篇章吕向校理族茂非熊才髙班馬考理篇籍抑揚風雅母煚軒墀之任諫諍之職聞詩聞禮有才有識陸去泰才光於晉價重於張州縣斯屈文翰尤長咸􅛫業郁郁髙文英才博識持我刑憲是稱諒直余欽文章兩贍才術兼美思在専經學通舊史孫季良蓬山之秀藝閣之英雄詞卓傑雅思縱橫十一年春於大明宫光順門外造麗正書院夏詔學士侯行果等侍講周易莊老頻賜酒饌學士等燕飲為樂前後賦詩奏上凡數百首上每嘉賞院中既有宰臣侍講屢承珍異之賜燕公詩曰東壁圖書府西垣翰墨林誦詩聞國政講易見天心前後令趙冬曦張九齡咸􅛫業韋述等為詩序學士等賦詩編成卷軸以進尋敕善寫真人貌學士等欲畫象書贊於含象亭屬車駕東行事竟不果上初令韋無忝殷季友殷􅛴分貌張説等燕公以畫不精奏進同州僧法明獨貌諸學士等圖成奏之上稱善令藏其本於書院自馬懷素至韋見素知院學士及修書使前後總十一人自盧僎至敬會真開元五年至十三年三月麗正學士及侍講修理官前後總四十人其年四月改院在院皆為學士承恩者十六人自賀知章至竇華開元十三年四月至天寶十四載集賢院學士直學士二十三人自韋縚至髙瞻開元十三年四月迄天寶十五載二月集賢院修撰校理待制及文學直等總五十九人集賢注記學其後崔鄲柳公權蔣係為士孔緯直學士會要貞元四年六月集賢院準六典有學士直學士準集賢注記有校理待制留院入院侍講刋校修撰修書及直院等今請五品已上為學士六品已下為直學士最髙者判院事餘並為校理從之元和二年七月集賢院奏伏準六典集賢院置學士及校理修撰官纍聖崇儒不失此制至貞元八年判院事官陳京始奏停校理分祕書郎四員正字兩員為集賢殿校理正字陳京行狀云在集賢奏祕書官六員隸殿內而刋校益理今請校書郎正字並却歸祕書省當司請依舊置校理官庶循名實且復開元故事從之修撰王仲丘施敬本趙冬曦賀知章孫季良咸􅛫業校理歸崇敬鄭欽説吕向東方皓蕭穎士盧邁徐浩馮定石洪張仲方鄭涵校勘王嗣琳校書郎范傳正丁公著韋處厚崔郾正字柳宗元已上見諸傳開成元年四月集賢殿御書院請鑄印以御書為文一云五月大中六年正月大學士馬植論奏始著令三館學士不避行臺會要西又大和二年九月集賢院奏造昭慶門內墻至集賢院門南廊舍三十九間藝文志職官類韋述集賢注記三卷述自登書府至天寶十五載凡四十年因紀置院經始及前後學士名氏時丙申嵗二月也總集類集賢院壁記詩二卷雜藝術類殷􅛴韋無忝開元十八學士圖列傳蔣乂父將明為集賢學士張鎰以乂為集賢編録後為學士德宗貞元十八年問神策軍本末乂條據甚詳宰相曰集賢有人矣翌日制判院事李泌加集賢殿崇文館大學士修國史泌建言學士加大始中宗時及張説為之固辭乃以學士知院事至崔圓復為大學士亦引泌為辭而止按崔圎在泌前傳誤大會要貞元四年五月十一日泌奏張説懇辭字衆稱達禮至德二年崔圎為相加集賢殿大學士因循成例望削去大字元和二年大學士武元衡韋綬為學士穆宗九日宴羣臣曲江綬請集賢學士得别會長慶三年九月陽城求為吏隸集賢院竊院書讀之卓行張果玄宗邀至東都舍集賢院有詔圖形集賢院方技薑撫開元末召至東都舍集賢院方技儒學傳序集賢院部分經籍乾元殿博彚羣書至六萬卷韓文祕書御府也天子猶以為外且逺不得朝夕視始更聚書集賢殿别置校讐官曰學士校理常以寵丞相為大學士其他學士皆達官校理用文學者不計秩次集賢之書盛積盡祕書所有不能處其半唐學士院翰林院北門學士官志學士之職以文字言語備顧問出入侍從因得參議謀納諫諍其禮尤寵北齊有文林館學士後周有麟趾殿學士皆掌書述而翰林院者待詔之所也唐制乘輿所在必有文辭經學之士下至卜醫伎術之流皆直於别院以備宴見而文書詔令則中書舍人掌之會要武德以後溫大雅魏徵李百藥岑文本等時召入草制自太宗時名儒學士時時召以草制然猶未有名號乾封以後始號北門學士會要北門學士以劉褘之蘇味道元萬頃胡楚賔周思茂范履氷等為之北貞觀末張昌齡為門修撰玄宗初置翰林待詔以張説陸堅張九齡等為之掌四方表疏批答應和文章既又以中書務劇文書多壅滯乃選文學之士號翰林供奉與集賢學士分掌制詔書敕吕向尹愔首充焉又李白東方皓開元二十六年又改翰林供奉為學士别置學士院専掌內命會要太常少卿張垍起居舍人劉光謙首居之而集賢所掌於是罷息凡拜免將相號令征伐皆用白麻其後選用益重而禮遇益親至號為內相又以為天子私人凡充其職者無定貟自諸曹尚書下至校書郎皆得預選入院一嵗則遷知制誥未知制誥者不作文書班次各以其官內宴則居宰相之下一品之上憲宗時又置學士承旨唐之學士弘文集賢分隸中書門下省而翰林學士獨無所屬明皇常置者六人穆宗並用者八俊憲宗初李吉甫裴垍同直垍草吉甫除平章事制吉甫草武元衡制禮絶之敬生於坐中明日院中使學士送至銀臺門而相府官吏候於門外會要翰林院者開元初置在銀臺門內麟德殿西廂重廊之後又云駕在興慶宫在金明門內駕在大內即在明福門內李肇曰翰林院在少陽院南韋執誼曰在銀臺門內麟德殿西蓋天下以藝能伎術見召之所處也學士院者開元二十六年置在翰林院之南别户東向自建院後韓雄李白之徒並在舊翰林院中假其名而無職至德以後軍國務繁其入直者並以文詞共掌詔敕自此北翰林院始無學士之名其後又置東翰林院於金鑾殿之西隨上所在而遷旯韋執誼故事舊史天子在大明宫則翰林院在右銀臺門內在興慶宫則院在金明門內若在西內則院在明福門內若東都華清宫皆有待詔之所取其穩便大抵召入者或一二人或三四人或五六人鴻生碩學頗列其中李肇翰林志院在左右銀臺門之北入門直西為學士院其北為翰林院漢制尚書郎主作文書起草更直建禮門內明光殿神仙殿與此同凡學士無定貟皆兼他官充下自校書上至諸曹尚書皆得為之既入院與班行絶迹亦不拘本司不繫常參守官三周為滿嵗則遷知制誥後德宗雅尚文學乘輿每幸學士院韋綬為學士德宗幸其院裴諗為學士承旨宣宗幸其院顧問賜賚無所不至御膳珍羞輟賜之召對浴堂門移於金鑾殿續翰林志德宗嘗移學士院於金鑾坡對御起草賦詩習射或旬日不出寶厯二年别置東頭學士以備曲宴賦詩元稹承旨院記憲宗以永貞元年即位始命鄭公絪為之位在諸學士上居其東第一閣乘輿奉郊廟得乘廄馬自浴殿由內朝以從揚雞竿布大澤則丹鳳之西南隅外賔客進見於麟德則止直禁中以俟凡大誥令大廢置丞相之密畫內外之密奏上所注意者莫不専對他人無得而參十七年間由鄭至杜十一人而九參大政積繼居九丞相二名卿之後長慶元年八月十日記元稹又云院密通銀臺每旦開門使勘契開鎖院中有急命即鈴索自搖旨錢徽為學士加承旨沈傳師為學士穆宗欲命為承辭日學士院長參天子密議次為宰相自知必不能大中間杜審權韋澳裴諗令狐綯為學士承旨乾道二年七月承旨陸扆入相送光院錢命後唐天成三年八月敕掌綸之任擢才以居或自初而升或自顯秩而授學士入院以先後為定唯承旨一員不計官資先後在學士之上編入翰林志韋處厚壁記曰貞元中由此居輔弼者十有二元和中由此膺大用者十有六韋執誼翰林院舊事學士自建置以來秩序未立庭覲之際各趨本列洎興元元年始有别敕令朝服班序與諸司官知制誥例同唐會要大中初敕學士官至郎中令知制誥韋表微學士院新樓記學士之登將相踐崇顯者十有八九續通典學士入院除中書舍人不試餘皆試麻制答蕃書批答詩賦號曰試五題韓偓金鑾密記日召入院試文五篇吳通元傳陸贄建言承平時工藝書畫之流皆待詔翰林而無學士至德以來命集賢學士入禁中草書詔待進止於翰林院因以名官舊傳至德後召集賢學士於禁中草書詔因在翰林院待進止遂以為名今四方無事制書宜歸中書舍人帝不許崔羣傳憲宗詔學士凡奏議待羣書乃得上羣恐遂為故事固辭錢徽傳憲宗戒有貢獻毋入右銀臺門以避學士白居易詔由右銀臺門入翰林院試文五篇柳公權傳穆宗拜侍書學士文宗復召侍書充翰林書詔學士遷承旨唐有侍書學士元和十五年三月辛酉柳公權為之王起許康佐為侍講學士文宗有疑義即召入便殿顧問討論謂之三侍學士顧少連傳少子師閔同止翰林院金坡遺事開元始建此官迄於唐季名氏可尋者二百一十人文苑英華天寶初李白翰林待詔因為和蕃書并上宣唐鴻猷一篇漢金馬有待詔之臣唐禁林有執藝之士元黎幹善星緯術待詔翰林韓穎善步星乾中待詔待董晉拜校書郎詔翰林李陽氷李白集序曰天寶中召就金馬降輦步迎如見綺皓以七寶牀賜食置於金鑾殿出入翰林中潛草制誥人無知者唐故事學士草制有所改者當罷職劉禹錫詩銀花垂院榜晉天福五年九月廢學士院歸中書舍人開運元年六月復置三年賜本院書詔金印中興書目翰林內志一卷集韋執誼翰林故事李肇志韋處厚丁居晦杜元穎壁記元稹記韋表微學士新樓記為一書集者不知名翰林舊規一卷光化中學士楊巨雜載學士召試格及書詔之體宿直假寧之例翰林盛事一卷唐張著撰記儒臣盛事凡三十有八條唐志楊巨翰林學士院舊規一卷李肇翰林志二卷元稹學士承旨院記丁居晦翰林後記本朝蘇易簡續志李宗諤翰苑雜記錢惟演金坡遺事唐虞二典商盤周誥之文垂𥙿萬世炳若日星誦其書考其事想見其人而聖君賢臣之迹雖相去千百嵗後若接於耳目之際者其書存也學士以翰墨之任號儒林極選入則持橐殿中出則扈蹕屬車間平時從容盡聞天子憂憫元元勞心求治之意退而載於制書鼓動天下道人主難喻之意而復誥命於三代之文惟學足以明古人之大體智足以達當世之要務篤實廉恥之操足以咨諏而不疑討論潤色之才足以付託而無負然後執筆視草發揮帝王之藴藹然為治世之華藻播旨四海九州之逺垂名百世之久而無窮唐太常四院禮院見下仙韶院百官志太常寺卿一人少卿二人掌禮樂郊廟社稷之事凡藏大享之器服者四院一曰天府院藏瑞應及伐國所得之寶禘祫則陳於廟庭二曰御衣院藏天子祭服三曰樂縣院藏六樂之器四曰神厨院藏御廩及諸器龍朔二年改太常曰奉常寺武后光宅元年改太常寺曰司禮寺四院外既有禮院又有仙韶院皆屬太常寺以八署分理之一曰郊社二大廟三諸陵四大樂五鼓吹六太醫七太卜八廩犧太樂令有别教院文宗開成三年改法曲所處院為仙韶院周禮天府掌祖廟之守藏與其禁令凡國之玉鎮大寶器藏焉若有大祭大喪則出而陳之既事藏之為之先者以傳其所寶為榮為其後者以守其所傳為善唐寢殿别院高宗紀兼會要貞觀二十年太宗於寢殿側為别院使太子居之褚遂良諫以為朋友深交者易怨父子滯愛者多愆宜許太子間還東宫近師傅以廣懿德帝從其言十五年魏王泰移居武德殿院魏徵諫閣貞觀中晉王以文德后最小子不令出唐獻納院會要垂拱二年用魚保宗言置匭四共為一室以銅鑄之四面各依方色東曰延恩南曰招諫西曰申寃北曰通玄出以辰前入以未後御史一人為理匭使其後同為一匭天寶九載改曰獻納院唐政事院會要開元元年十二月上召宰臣謂曰從工部侍郎有得中書侍郎者否對曰任賢用能非臣等所及上曰蘇頲可除中書侍郎仍令宰臣宣旨移入政事院便供政事食明日加知制誥唐百孫院十王宅崇仁禮院禮會院紀開元十三年三月甲午徙封慶忠棣榮王封光儀潁永夀延盛濟王十二王同封節十五年琮與十王並領度不出閣傳開元後皇子幼多居禁內既長詔附苑城為大宫分院而處號十王宅會要先天後皇子幼則居內東封後王宅年漸長乃於安國寺東附苑城為十所謂慶忠棣鄂榮光儀潁永延盛濟等十二王以十舉全數也中人押之就夾城參天子起居家令日進膳引詞學士入授書謂之侍讀夀信義陳豐恆涼七王就封亦居十宅鄂光王廢死忠王立為太子慶棣繼薨惟榮儀十四王居院而府幕列於外坊嵗時通名起居既又諸孫多則於宅外更置百孫院天子嵗幸華清宫又置十王宅百孫院於宫側宫人每宅四百餘百孫院亦三四十人禁中置維城庫以給諸王月奉諸孫納妃嫁女就十王宅太子不居東宫處乘輿所幸别院太子親王公主婚嫁並供帳於崇仁之禮院此承平制云通鑑綱目開元十五年夏五月作十王宅百孫院十王宅在安國寺東會要開元中置禮會院於崇仁禮院院在崇仁坊南街開元十九年四月四日於京城置禮會院七月二十四日詔屬司農寺什物令有司供建中元年十一月十六日敕禮儀使與博士及宗正卿李琬漢中王瑀光祿卿李涵約古今舊儀及開元禮詳定公主郡縣主出降覿見之儀十一月二日禮儀使顔真卿等奏郡縣主見舅姑請於禮會院過事明日早執笲盛以棗栗腶修奠於舅姑席前赴光順門謝恩駙馬加以璋郡主壻加以璧以代用馬唐禮院又見上舊史開元十九年四月壬午於京城置禮院元和五年二月戊子禮院奏東宫殿閣名及宫臣姓名與太子同名者改之蔣乂傳充太常禮院修撰髙銖傳博士李慤曰故事禮院不關白太常故卿蒞職博士不參集會要貞元九年四月置禮院修撰檢討官各一員唐禮賔院會要天寶十三年三月二十七日敕禮賔院令鴻臚寺檢討大厯二年三月己卯宴吐蕃使於禮賔院元和九年六月乙未置禮賔院於長興里之北大中五年五月論恐熱入朝遣左丞李景遜就禮賔院問所欲韓愈傳上表曰宣政一見禮賔一設後周紀顯德二年十月癸酉幸禮賔院舊紀憲宗元和四年四月甲申令皇太子居少陽院會要元和十五年十月發右神策千人於門下省東少陽院前築牆會昌元年三月敕造靈符應聖院唐禮部南院選院唐尚書省前一坊别有禮部南院即貢院也長安志曰四方貢舉所會省南有吏部選院亦曰南院選人看榜之所也會要開元二十年八月以考功貢院地置吏部南院或謂之選院蘇晉榜選院唐御史三院見官制書目御史臺三院因話録一卷咸通中御史盧駢論訂三院稱謂官曹儀式百官坐次之制大和中舒元輿為臺屬所撰御史臺新造中書南院記併載於此唐諫院舊紀大和九年十二月辛卯置諫院印諫院舊無印有章疏各於本司請印人多知之至是特敕置印兼詔諫臣論事有關機密别以狀列之古者諫無官自公卿大夫至於工商無不得諫漢始置官唐通玄院官志肅宗乾元元年詔司天臺置通玄院以藝學召至京師者居之韓潁等建議置唐舍人院常衮傳政事堂北門宰相過中書舍人院咨訪政事唐圖譜院見玉牒唐宣徽院貞元選樂工三十餘人號宣徽院長入供奉元和八年四月乙未罷宣徽院樂人所假官第寶厯中以毬工籍宣徽院宣宗時嚴季實為北院副使天祐二年樞密使及宣徽南院北院並停吏歸中書嚴遵美曰樞密使無聽事惟三楹舍藏書而已今堂狀帖黃決事此楊復恭奪宰相權之失唐待漏院宋朝附憲宗元和中方置待漏院於朝門外令百官朝以避風霜舊史元和二年六月丁巳朔置百官初入待漏院於建福門外候禁門啓入朝故事建福望仙等門昏閉五更啓建福門在大明宫丹鳳門東望仙門在丹鳳門西與諸坊門同時至德中有吐蕃囚自金吾仗亡命因敕晚開門宰相待漏於太僕寺車坊至是始令有司各據班品置院於建福門外會要大和七年正月户部侍郎庾敬休奏當司未有待漏院請於鹽鐵度支待漏院側創造皇朝設待漏院於丹鳳門之右示勤政也王元之作記紹興二年八月癸卯初置宰執已下待漏院於行宫南門之外會要長慶元年八月於中書南置僕射祗候院大和四年三月於門下直省院西京兆尹院東置三院御史祗候院唐參酌院刑法志穆宗慎用刑每有司斷大獄令中書舍人一人參酌而輕重之號參酌院大理少卿崔杞奏罷唐南北供軍院食貨志穆宗時幽鎮兩鎮用兵置南北供軍院行營軍十五萬饋運不能給長慶率三户奉一兵開成初王彥威上供軍圖用兵上黨以盧商為户侍兼供軍使吳武陵傳長慶初竇易直判度支表置和糴貯備使擇郎中為之武陵諫曰西北邊院官皆御史員外郎為之何必增吏不納會要元和十三年七月王遂為淄青行營供軍使唐清思院薛延老傳寶厯中造清思院用銅鑑三千薄金十萬餅舊紀敬宗寶厯元年閏七月一作七月乙亥詔度支進銅三十斤一作鏡銅金薄一作金銀薄十萬修清思院新殿及升陽殿一作陽德殿圖障唐起草院李德𥙿傳所居安邑里第有院曰起草亭曰精思計大事則處其中宋朝樞密院陳繹西府記唐初典兵禁中以機密名官貞觀十六年岑文本専典機密二十三年李績參掌機密開元中設堂後五房而機密自為一司其職祕獨宰相得知續事始云永泰中置內樞密使有屋三楹貯文書貞元後以中官分領神策而樞密之職歸北司然寄治省寺廡下延英會議則屛立殿西中尉樞密使皆得帖黃除吏唐末除北司并南北軍於樞密遂總天下之兵會要唐以中官二人為使梁改為崇政院置使判官後置副使直學士始用士人後唐復為樞密使宰臣郭崇韜兼使始有帶相印者凡東西院二員晉天福四年四月廢院以印付中書委宰相分判開運元年六月復置宰臣維翰兼使周顯德末魏仁浦吳廷祚為使宰相范質王溥參知院事國朝以樞密院與中書對持文武二柄號為二府建隆元年趙普為副使三年十月普檢校少保充使不帶正官自普始開寶九年二月曹彬為使領忠武節度帶節度自此始興國四年正月癸巳石熙載僉書院事始有僉書之名六年九月熙載為户部尚書充使始用文資正官淳化二年九月張遜知院溫仲舒同知院晉天福中桑維翰知院事始有知院之名祥符五年王欽若陳堯叟為使兼使相天禧四年曹瑋以僉書兼藩鎮康定元年三月癸未詔中書别置廳於樞密院之南與樞臣議邊事慶厯二年富弼建議宰相兼樞密使七月戊午以宰臣吕夷簡判院事章得象兼使議者以二府體均判總之名太重九月丙午夷簡改兼使五年十月庚辰以邊事寧罷宰臣兼使治平三年四月始以郭逵為同僉書院事建炎四年六月甲戌宰相范宗尹兼知院事紹興七年正月乙酉張浚以右僕射兼使九月趙鼎以左僕射兼使二十六年三月十三日一云五月壬寅詔以邊事已定依祖宗故事不兼領紹興五年閏二月乙卯命參政孟庾沈與求兼權樞密院事三十二年十二月五日丁卯孝宗復詔宰臣陳康伯兼使制云考藝祖仁宗之宏規遵建炎紹興之聖政肆令東府仍管西樞舊制置知院則副使改同知院置使則復改副使熙寧元年文彥博吕公弼為使韓絳邵亢為副陳升之三至樞府上欲稍異其禮以為知院事於是知院與使副並置元豐四年改官制議者欲廢歸兵部上曰祖宗不以兵柄歸有司故専命官統之於是不廢上以樞密職聯輔弼非出使之官十一月甲辰乃定置知院同知院二人専以邊機兵政為職遷官府於中書省之西凡分房十曰北面河西支差在京教閲廣西兵籍民兵吏房知雜凡官四知院同知院都副承旨各一人都承旨自興國七年四月甲子楊守一始文臣兼領始於熙寧五年七月二十五日曾孝寬人熙寧四年十月五日以編修經武要略官王存等四檢詳諸房文字官建炎四年置計議紹興十一年省紹興七年正月二十三日詔依故事置使副元祐初復置僉書院事靖康初李回拜延康殿學士僉書延康今為端明遂為故事建炎元年六月二十一日李綱於院置賞功司四年六月范宗尹置機速房紹興二十九年九月甲午罷機速房慶厯五年陳執中言有唐别命樞臣専主兵務五代始令相輔亦帶使名至於國初尚沿舊制乾德以後其職遂分是年詔宰臣免兼樞密使凡郡國機要依舊同商議漢張安世領尚書事職典樞機宋泰始中王景文為中書令兼管內樞此其始也唐以宦官一人為樞密使出納帝命後置二人梁開平元年五月改為崇政院後唐同光元年十月復為樞密院始用郭崇韜分中書兵房置院分秉朝政自此始崇韜以宰臣兼使又置院使一人然權侔宰相矣五代多以武臣領使宰臣知院事皇朝文武參用宋朝學士院兩朝志承旨不常置以院中久次者一人充學士六貟掌大詔命凡大除拜晚漏上天子御內東門小殿遣內侍召學士賜對親諭祕旨對訖鎖院門夜漏盡進制遲明白麻出直學士院自開寶二年十一月戊辰李昉盧多遜始權直學士院自開寶六年四月張淡始翰林權直自乾道九年十二月崔端詩始學士院權直自淳熙五年九月端詩始太平興國中吕文仲為翰林侍讀寓直御書院咸平二年七月丙午以楊徽之夏侯嶠為翰林侍讀學士邢昺侍講學士先是侍講名秩未崇真宗首置此職班次翰林學士設直廬於袐閣侍讀更直侍講長上景德四年昺以侍講學士外使天禧三年張知白以侍讀學士外使其後馮元為翰林侍講不帶學士之名又馬宗元為侍謙髙若訥為侍讀不加别名元豐去翰林字及學士名元祐七年復之以命蘇軾趙彥若中興後唯紹興六年范沖為之院在宣徽院北凡他官未除學士謂之直院暫行文書謂之權直開寶二年十一月戊辰詔中書舍人李昉知制誥盧多遜分直翰林院直興國元年十一月乙亥以湯悅徐鉉直學士院張洎舍人院七年六月甲戌以王著為翰林侍書隸御書院唐有侍書學士侍讀侍講春秋二時開延義邇英閣則執經史常日侍奉備顧問晉天福五年九月詔廢翰林學士按唐六典歸其職於中書舍人桑維翰復奏置學士後學士領外司自淳化二年閏二月賈黃中等始故事學士六貟至和元年九月王洙為第七貟學士二貟分直有大除拜過二制而上則併召二貟謂之雙宣一云麻詞自三而上雙鎖命並直官分草官制遵唐舊典不改者獨學士院而已元豐三年八月丙申詔於尚書省樞密院用咨報國初久為學士官至八坐已罷職或再來直院神宗改官制後中丞并權六曹尚書若兼內制亦止云直學士院中興初詹乂為龍圖學士猶曰權直院如正侍郎已下多帶兼權汪藻等是也厥後程克俊等初以給舍兼權稍久乃落權字以為恩數至正尚書則帶兼權學士胡交修等是也紹興五年修學士院淳熙七年趙彥中兼權直始用宗室乾道三年洪邁奏請自庶官遷侍從正兼直院淳熙五年十二月周必大自翰林遷禮書乃正兼學士六年十一月遷吏書升兼學士承旨隆興初用真宗故事輪講筵學士院官直宿禁林每夕兩貟以備宣召咨訪後止命一貟遞宿學士院舊號北門今在行宫和寧門內蓋沿北門之制地迫皇城極窄隘院官一員分東西兩閣中曰摛文堂蓋在京徽宗因廣直廬御書賜承旨強淵明今乃汪藻所篆髙宗嘗書玉堂二字賜學士周麟之刻石廳上舊學士院在樞密院之後玉堂本以待乘輿行幸非學士所得常居唯禮上之日略坐其東故事雙日鎖院隻日降麻天聖元年詔隻日出宿五年中書言恐宣召不即至詔依祥符五年故事常一貟在院至和元年詔當宿學士請告者令以次遞宿翰林學士院印景德二年少府監鑄蘇易簡翰林志今二京學士院並在樞密宣徽院之北蓋表其深嚴宥密焉沈括筆談學士院玉堂太宗嘗親幸唯學士上日許正坐故事堂中設視草臺每草制則具衣冠據臺而坐今不復然唐有視草亭錢惟演金坡遺事三卷序建隆庚申洎天聖丙寅四十七人合唐五代三百一十五人建隆元年承旨一人陶榖學士三人竇儼王著李昉天子之書其别有四曰册制詔敕起草進畫職在內史密命中出起唐北門宋朝宣徽院唐置南北院使國朝沿唐制以檢校官為之兼領節度及兩使留後闕則樞密副使一人兼領二使亦有兼樞副簽樞者有兵騎倉胄四案開寶四年七月戊午詔內侍養子宣徽院置籍九年二月以山南東道節度潘美充北院使節度領宣徽自此始八月以樞副楚昭輔權南院自後使闕多樞密使副兼之慶厯八年三月李昭亮自殿前副都指揮使遷北院使皇祐三年一云二年九月著令毋過二貟後富弼以使判并州已有二貟詔以邊任權增熙寧三年郭逵王拱辰在院用弼例以歐陽修為南院使修辭四年詔位參政樞副之下九年五月拱辰請編修條例六月命何洵直為編修官十年八月成條例并目二十五册元豐改制四年十一月二十一日癸卯罷院而使猶存六年三月拱辰除安武節度使自是使不復除元祐三年十月戊戌二十三日復置南北院使視簽樞紹聖三年四月辛酉罷淳化中王延德等三人為昭宣使五年王繼恩平蜀冦中書議以為宣徽使上曰執政之漸也朕不欲令宦官與政八月甲午以為宣政使序昭宣使之上命張洎等立此名祥符元年十二月甲辰置宣慶使以寵李神福王延德事二祖御筆題昭宣使授之宋朝四書院祖宗尊右儒術分之官書命之祿秩錫之扁榜以寵綏之宋有戚氏吳有胡氏魯有孫石二氏各有道德為人師漢初郡國往往有夫子廟而無校官且不置博士弟子貟其學士嘗課試供養與否闕不見傳記然諸儒以明經教於其鄉率從之者數百人輒以名其家齊魯燕趙之間詩書禮易春秋論語家名甚盛則今書院近之矣前代庠序之教不修士病無所於學相與擇勝地立精舍為羣居講習之所為政者就褒表之若嶽麓白鹿洞之類是也逮本朝慶厯熙寧之盛學校之官遂遍天下白鹿洞書院唐李渤與兄涉俱隱白鹿洞後為江州刺史即洞創臺榭南唐升元中因洞建學館置田以給諸生學者大集以李善道為洞主掌教授當時謂之白鹿國庠宋朝太平興國二年三月庚寅知江州周述言廬山白鹿洞學徒數千百人請賜九經書肄習詔從其請仍驛送之五年六月己亥以白鹿洞主明起為褒信主簿賜陳𥙿三傳出身起𥙿以講學為業故有是命咸平五年敇有司重修繕又塑宣聖十哲之象祥符初直史館孫冕請以為歸老之地皇祐五年其子琛即故址為學館十間牌曰白鹿洞之書堂俾子弟居而學焉郭祥正為記淳熙六年南康守朱熹重建為賦示學者曰明誠其兩進抑敬義其偕立允莘摯之所懷謹巷顔之攸執吕祖謙為記八年十一月二十九日賜國子監經書至道三年八月南康達昌縣洪文撫於所居雷湖北創書舍集學者太宗飛白一軸曰義居人以賜之江州陳氏義居至道初遣內侍裴愈就賜御書又以百軸賜文撫家嶽麓書院開寶九年潭州守朱洞始創宇於嶽麓山抱黃洞下以待四方學者作講堂五間齋序五十二間孫邁為記咸平二年潭守李允則益崇大其規模三年王元之為記曰西京首述文翁東觀先書衛颯其理蜀郡教桂陽率以庠序為先云云中開講堂揭以書樓塑先師十哲之象畫七十二賢瀟湘為洣泗荆蠻為鄒魯四年三月二十日辛卯允則奏嶽麓山書院修廣舍宇生徒六十餘人請下國子監賜諸經釋文義疏史記玉篇唐韻從之祥符五年山長周式請於太守劉師道廣其居談綺為記式以行誼著八年召見便殿拜國子主簿使歸教授給詔因舊名賜額仍增給中祕書於是書院之稱聞天下乾道元年帥臣劉珙重建為四齋定養士額二十人二年十一月張栻為之記淳熙十五年帥臣潘畤廣二齋益額十人陳傅良為記淳祐六年賜御書嶽麓書院四字揭之中門書院南風雩亭之下别建湘西精舍開禧中建南嶽書院於廟側寶慶中遷於集賢峰下以監廟兼山長衡州石鼓山有書院起唐元和中州人李寬所為國初嘗賜敕額淳熙十三年部使者潘畤因舊址列屋數間榜以故額宋若水益廣之朱熹為記應天府書院祥符二年二月二十四日庚戌詔應天府新建書院以曹誠為助教國初有戚同文者通五經業聚徒百餘人許闕宗度郭承範董循陳象輿王礪滕涉皆其門人於是誠即同文舊居建學舍百五十間聚書千五百餘卷願以學舍入官令同文孫舜賔主之故有是命并賜院額天聖三年應天府增解額三人六年九月晏殊言請以王洙充書院説書從之明道二年十月乙未置講授官一貟景祐二年十一月辛巳朔以書院為府學給田十頃范仲淹南京書院題名記皇宋功揭日月澤注河漢金革塵積絃誦風布睢陽先生同文賁於丘園教育為樂祥符中曹氏請以金三百萬建學於先生之廬以舜賔幹其𥙿王瀆掌其教張吉甫領其綱密學綸畫一而上真宗嘉歎面可其奏盛度文其記陳堯佐題其榜章甫如星逢掖如雲聚學為海淬詞為鋒二十年間儀羽臺閣蓋翩翩焉嵩陽書院至道二年七月甲辰賜院額及印本九經書疏祥符三年四月癸亥賜太室書院九經景祐二年九月十五日己丑西京河南府重修太室嵩陽書院詔以嵩陽書院為額又至道三年五月戊辰河南府言甘露降書院講堂國初斯民新脫五季鋒鏑之厄學者尚寡海內向平文風日起儒老往往依山林即間曠以講授大率多至數十百人嵩陽嶽麓睢陽及白鹿洞為尤著天下所謂四書院者也宋朝天文院見天文玉海卷一百六十七
