body:
  text: 玉海卷十二宋王應麟撰律厯時令炎帝分八節晉志炎帝分八節以始農功伏羲造八卦作三畫以象二十四氣家語黃帝治五氣髙辛厯日月之生朔而迎送之左傳少皡有分至啓閉之官史記髙陽載時以象天月令章句大撓探五行之情占斗剛所建始作甲乙以名曰謂之幹作子丑以名日謂之枝枝幹相配以成六旬宋志髙陽氏以十一月為正􅏪玉以赤繒髙辛氏以十三月為正􅏪玉以白繒又見後黃帝迎日推策史記注策數也未來而推之曰迎黃帝得蓍以推算厯數於是逆知節氣日辰之將來故曰推策迎日堯授人時舜協時月正日書堯典乃命羲和欽若昊天厯象日月星辰敬授人時舜典協時月正日注合四時之氣節月之大小日之甲乙使齊一也正義周禮太史正歲年頒告朔於邦國則節氣晦朔皆天子頒之世本云容成作厯大撓作甲子皆黃帝之臣蓋自黃帝以來始用甲子紀日每六十日甲子一周宋志髙堂隆曰尚書傳曰舜定鍾石更四時改堯正夏四時書小正禮運孔子曰欲觀夏道之杞而不足徴也吾得夏時焉注得夏四時之書也其書存者有小正本或作有夏小正正義夏四時之書殷坤乾之説並載前王損益隂陽盛衰故觀此二書知二代家語問禮篇同大戴禮第二卷夏小正第四十七正月啓蟄鴈北鄉雉震詬魚陟負氷農緯厥耒初歲祭耒囿有韭時有俊風寒日滌凍塗田鼠出農率均田獺祭魚鷹則為鳩農及雪澤初服于公田采藝鞠則見初昏參中斗柄懸在下栁梯文選注引梅杏杝桃則華緹縞雞桴粥二月往耰黍禪初俊羔助厥母粥綏多女士丁亥萬用入學祭鮪榮堇菜色菜蘩由胡昆小蟲抵蚳來降燕乃睇剝鱓有鳴倉庚榮藝時有見稊始收三月參則伏攝桑委楊䍷羊􅕪則鳴頒冰采識草也妾子始蠶執養宮事祈麥實越有小旱田鼠化為鴽拂桐芭鳴鳩四月昴則見初昏南門正鳴扎囿有見杏鳴蜮王萯莠詩七月箋引之取荼越有大旱執陟攻駒五月參則見蜉蝣有殷鴂則鳴時有養日乃瓜良蜩鳴􅂒之興五日翕望乃伏啓灌藍蓼鳩為鷹唐蜩鳴初昏大火中種黍菽糜煮梅蓄蘭頒馬六月初昏斗柄正在上煮桃鷹始摯七月秀萑葦狸子肇肆湟潦生蘋爽死蘋秀漢案户寒蟬鳴初昏織女正東鄉文選注引之時有霖雨灌荼斗柄懸在下則旦八月剝瓜玄校剝棗栗零丹鳥羞白鳥蚊蚋辰則伏鹿人從鴽為鼠參中則旦九月內火遰鴻鴈主夫出火陟玄鳥蟄熊羆貊貉鼬鼪則大榮鞠樹麥王始裘雀入于海為蛤十月豺祭獸初昏南門見黑烏浴時有養夜雉入于淮為蜄織女正北鄉十有一月王狩陳筋革嗇人不從萬物不通隕麋角十有二月鳴弋玄駒賁蟻也納卵蒜虞人入梁隕麈角史本紀太史公曰孔子正夏時學者多傳夏小正索隱云大戴記篇名隋志夏小正一卷戴德撰德取以為記云撰誤矣之唐志大戴禮十三卷無小正别唐志大衍厯日度議曰夏小正雖頗踈簡失傳乃羲和遺迹何承天循大戴之説復用夏時更以正月甲子夜半合朔雨水為上元進乖夏厯退非周正故近代推月令小正者皆不與古合開元厯推夏時立春日在營室之末昏東井二度中古厯以參右肩為距方當南正故小正曰正月初昏斗杓懸在下魁枕參首所以著參中也季春在昴十一度半去參距星十八度故曰三月參則伏立夏日在井四度昏角中南門右星入角距西五度左星入角距東六度故曰四月初昏南門正昴則見五月節日在輿鬼一度半參去日道最逺以渾儀度之參體始見肩股猶在濁中房星正中故曰五月參則見初昏大火中八月參中則旦失傳也辰伏則參見非中也十月初昏南門見亦失傳也定星方中則南門伏非昏見也月令注夏小正正月啓蟄漢始亦以驚蟄為正月中詩七月箋夏小正四月王萯秀葽其是與爾雅注引夏小正傳月令注夏小正正月啓蟄魚陟負冰孟春農率均田仲春丁亥萬用入學季春妾子始蠶執養宮事孟夏今月令曰王萯生夏小正曰王萯秀仲夏五月啓灌藍蓼季夏鷹始摯仲秋九月丹鳥羞白鳥説曰丹鳥謂丹良也孟冬十一月王狩凡九文選注白虎通郭璞注爾雅通典初學記宋厯志大衍厯議皆引夏小正始於啓蟄終於隕麈角傳曰何以謂之小正以小著名也周禮疏管子篇時令云春以令男女以仲春著在詩易夏小正之文二月綏多士女春秋正義引正月啓蟄其傳曰言始發蟄也北史魏孝武釋奠國學詔中書舍人盧景宣講大戴禮夏小正篇語顔淵問為邦子曰行夏之時左傳漢志同夏數得天得四時之正也谷永傳漢家行夏正夏正色黑豳七月之詩皆以夏正為斷三之日夏正月也孔􅓜子子思曰夏數得天堯舜之所同也殷周王征伐革命以應乎天因改正朔三統之義夏得其正是以夫子云春秋元命包樂稽耀嘉云夏以十三月為正息卦受泰注云物之始其色尚黑以寅為朔月令正義云呂不韋在於秦世秦以十月為歲首不用秦正而用夏時者以夏數得天正也周禮雖以建子為正其祭祀田獵亦用夏正史記正月上日正義云鄭玄云舜正建子此時未改故依堯周書周月云夏數得天百王所同商頌疏正朔三而改夏以建寅為正則舜當以子堯當以丑朱子發曰二十四氣七十二候見於周公之時訓呂不韋取以為月令焉其上則見於夏小正夏小正者夏后氏之書孔子得之於杞者也夏建寅故其書始於正月周建子而授民時巡狩蒸享皆用夏正故其書始於立春夏小正具十二月而無中氣有候應而無日數至于時訓乃五日為候三候為氣六十日為節二書詳略雖異其大要則同豈時訓因小正而加詳歟易通卦驗易家傳先師之言所記氣候比之時訓晚者二十有四早者三當以時訓為定故子雲太玄二十四氣關子明論七十二候皆以時訓鄭玄曰月在星紀周以為正月在玄枵殷以為正皆不得四時之正後五行志注傅嵩卿序曰鄭注月令引小正者八政和中閲關澮藏書始得而讀之星昏旦伏見中正當鄉若寒暑日風冰雪雨旱之節草木稊莠榮秀之候羽毛鱗裸蠕動之屬蟄興粥伏鄉遰陟降離隕鳴詬之應罔不具紀而王政民事繫焉蓋夏之月令也關本合傳為一卷而不著作傳人名氏後讀禮記正義其疏月令注曰大戴禮之篇名也且小正夏書德所撰傳爾而隋志云然可謂疏矣乃倣左氏春秋列正文其前而附以傳月為一篇凡十有二篇釐為四卷名曰夏小正戴氏傳宣和辛丑九月一日序朱文公曰夏小正疑出迂儒之筆非孔子所見夏時本文夏令時警周語單襄公曰辰角見而雨畢天根見而水涸本見而草木節解駟見而隕霜火見而清風戒寒先王之教曰雨畢而除道水涸而成梁草木節解而備藏隕霜而冬裘具清風至而修城郭宮室韋昭注教謂月令之屬夏令曰九月除道十月成梁其時警曰收而場功偫而畚挶營室之中土功其始火之初見期于司里此先王所以不用財賄而廣施德於天下也注夏后氏之令周所因也時警時所以警告其民政典有先時不及之戒唐大衍厯議亦引夏令云北史李業興案尚書中候運衡篇曰日月營始知尚書正月上日為夏正月周時訓周書月令汲冢周書序周公正三統之義作周月辨二十四氣之應以明天時作時訓周公制十二月賦政之法作月令周月解第五十一時訓五十二月令五十三闕周月解曰數起于一而成于十次一為首其義則然凡四時各有孟仲季以名十有二月中氣以著時應春三月中氣雨水春分穀雨夏三月中氣小滿夏至大暑秋三月中氣處暑秋分霜降冬三月中氣小雪冬至大寒閏無中氣斗指兩辰之間夏數得天百王所同商順天革命變服殊號一文一質示不相沿以建丑之月為正易民之視亦越我周王致伐于商改正異械以垂三統至於敬授民時巡狩祭享猶自夏焉是謂周月以紀政時訓解自立春之日東風解凍至大寒又五日鷙鳥厲又五日水澤腹堅與記月令同引月令正義初學記之郎顗傳大壯用事於此六日之中靁當發聲注周書時訓曰春分之日玄鳥至又五日靁乃發聲唐志大衍卦候議七十二候原於周公時訓月令雖頗有增益然先後之次則同自後魏始載于厯乃依易軌所傳不合經義今改從古日度議引時訓爰始收潦而月令亦云水涸論語鑽燧改火注周書月令有更火之文正義曰周書孔子所刪尚書百篇之餘晉太康中得之汲冢有月令篇其辭今亡書召誥正義周書月令云三日粵朏崇文總目周書月令一卷唐會要顔師古議明堂曰文王居明堂之篇正義王居明堂禮逸禮篇名帶以弓韣禮於禖下九門磔攘禦止疾疫置梁除道以利農夫令國為酒以合三族凡此等事皆合月令之文隋志梁有月令七十二候一卷月令正義曰二十四氣每三分之七十二氣氣間五日有餘故一年七十二候亦案通卦驗五日一候月令一書漢馬融賈逵晉孔朝皆以為作於周公鄭玄髙誘孔穎達謂呂不韋所作漢淮南王安取呂氏十二紀附益為時則訓而禮家復有增加孔穎達正義曰官名時事多不合周法有四證然周書先有月令鄭謂不韋作者以吕氏春秋十二紀與此同也李林甫注月令云周公作時訓定二十四氣辨七十二候夏后小正周公時訓皆月令之宗首管子有四時五行篇淮南子有時則訓唐會要天寶五載正月二十三日詔曰堯命四子所授惟時周分六官曾不繫月其禮記月令宜改為時令方周之時以馮相會天位保章辨地域太史正歲年以序事頒邦國以告朔萬民觀於月吉官屬觀於正歲月令季冬天子乃與公卿大夫共飭國典論時令以待來歲之宜注飭國典者和六典之法周禮以正月今用此月則所因於夏殷也尚書大傳曰夏以十三月為正平旦為朔殷以十二月為正雞鳴為朔周以十一月為正夜半為朔禮記曰正朔三而改文質再而復三微者三正之始王者取法焉章紀注漢隂陽五行時令志五行三十一家隂陽五行時令十九卷李尋對諸侍中尚書近臣宜通知月令之意設陛下出令有謬於時者當爭之以順時氣尋學天文月令隂陽漢明堂月令月令圖四民月令明堂隂陽録月令章句漢四時月令大戴禮明堂篇有曰明堂月令注於明堂之中施十二月之令淮南子五帝三王立明堂之朝行明堂之令祭法注引明堂月令月令注引王居明堂禮禮記正義曰此於别録中屬明堂隂陽記隋牛弘傳今明堂月令者鄭玄云呂不韋著春秋十二紀之首章正義云十二月紀正與此同不過三五字别蔡雍王肅云周公所作周書內有月令第五十三即此也東晢以為夏時之書弘明堂議又引明堂隂陽録曰明堂之制周圜行水左旋以象天魏相傳數表采易隂陽及明堂月令奏之荀恱紀元康二年上明堂月令奏上從之云隂陽未和咎在臣等隂陽之分以日為紀日冬夏至則八風之序立萬物之性成各有常職不得相干文中子曰魏相真漢相達時令逺乎哉注相作明堂月令議魏相上言春興兌治則飢秋興震治則華冬興離治則泄夏興坎治則雹髙帝詔議天子所服蕭何等請以中謁者趙堯舉春李舜舉夏兒湯舉秋貢禹舉冬四人各職一時願選明經通知隂陽者四人各主一時時至明言所職以和隂陽或有風雨災變相輒奏言之李尋對王者敬四時嚴月令今忽於時月之令諸侍中尚書近臣宜皆令通知月令之意藝文志禮家明堂隂陽二十三篇通典注云月令本出於管子呂不韋編為春秋戴聖集成禮記並周制太史公六家論隂陽四時八位十二度二十四節各有教令注謂月令成紀陽朔二年春詔曰公卿大夫不信隂陽所奏請多違時政而望隂陽調和豈不謬哉其務順四時月令漢有四時令五時令儒林傳景鸞作月令章句隋志蔡雍月令章句十二卷十二篇存中興書目今一卷唐志戴顒月令章句十二卷晉天文志十二次度數蔡雍月令章句所言頗有先後記月令正義引蔡雍云法象莫大乎天地變通莫大乎四時懸象著明莫大乎日月故先建春以奉天奉天然後立帝立帝然後言佐言佐然後列昆蟲之别物有形可見然後音聲可聞故陳音有音然後清濁可聽故言鐘律均聲可以章故陳酸羶之屬也羣品以著五行為用於人然後宗而祀之故陳五祀此以上者聖人記事之次也東風以下效初氣之序也二者既立然後人君承天時行庶政故言帝者居處之宜衣服之制布政之節明欽若昊天然後奉天時也後律厯志注引月令章句鍾律度數冬夏至為極有三意焉又載十二次十二分五行志注選注引之元南齊禮志引月令章句解辰云隋志劉焯論渾天云月令章句同張衡法春秋正義潁子嚴以龍見即是五月釋例曰月令之書其意欲為秦制非古典也周禮疏周禮凡言正歲者則夏之建寅正月直言正月者周之建子正月也詩生民疏引蔡雍月令章句云髙禖祀名後漢永平二年正月辛未詔百僚師尹勉修厥職順行時令敬若昊天元和二年七月庚子詔曰月令冬至之後有順陽助生之文無鞫獄斷刑之政十一月壬辰日南至初閉關梁章和元年七月壬戌詔曰秋令是月養衰老授几杖行糜粥飲食注月令仲秋之令永元六年六月己酉初令伏閉盡日十五年初令郡國以日北至案薄刑十六年七月戊午詔疑者勿決以奉秋令元初四年七月辛丑詔連雨未霽人怨所致月令仲秋養衰老云云六年二月乙卯詔月令仲春養幼存孤季春賜貧賑乏以順陽氣崇生長也永建四年正月丙寅詔敬順時令遵典去苛蔡雍傳熹平六年七月條七事曰明堂月令天子以四立及季夏之節迎五帝於郊所以導致神氣祈福豐年注天子居明堂各依其月布政故云明堂月令書奏帝乃迎氣北郊説文廣韻注明堂月令曰腐草為蠲後厯志揆時施教頒諸明堂以為民極者莫大乎月令唐志日度議梁大同厯夏后氏之初冬至日在牽牛初以為明堂月令乃夏時之記據中氣推之不合更以中節之間為正乃稍相符不知進在節初自然契合明堂位疏案異義明堂月令説禮記月令疏呂不韋集諸儒著十二月紀篇首皆有月令與此文同不合周法有四證然周書先有月令鄭必謂不韋作者以呂氏春秋十二月紀正與此同鄭目録云名曰月令以其記十二月政之所行也本呂氏春秋十二月紀之首章禮家好事抄合之後人因言周公所作然其官名時事多不合周法此於别録屬明堂隂陽記今申鄭旨釋之吕氏春秋篇首有月令與此文同一證也周無太尉惟秦官有之而月令云乃命太尉此官名不合周法二證也秦以十月建亥為歲首而月令云為來歲受朔日即是九月為歲終十月為受朔此時不合周法三證也周有六冕郊天迎氣用大裘乘玉輅建大常日月之章而月令服飾車旗並依時色此事不合周法四證也不周秦正而用夏時以夏數得天正周禮祭祀田獵亦用夏正崇文目周書月令一卷月令小疏二卷侯霸傳建武四年為尚書令每春日下寬大之詔奉四時之令皆霸所建注奉四時謂依月令元帝初元三年六月詔有司毋犯四時之令丞相御史舉天下明隂陽災異者各三人後志司隸有月令師主時節祠祀隋志唐志同崔實四民月令一卷選藉田賦注引之宋書厯志引之説文明堂月令曰舫人習水玄鳥至之日祠于髙禖隋志梁有月令圖一卷陳寵傳元和二年奏曰冬至之節陽氣始萌十一月有蘭射干藝荔之應時令曰注月令也諸生蕩安形體天以為正周以為春十二月陽氣上通雉鳴雞乳地以為正殷以為春十三月陽氣已至天地已交萬物皆出蟄蟲始振人以為正夏以為春三微成著以通三統注三禮義宗曰三微三正也周以天元殷以地元夏以人元殷周斷獄不以三微陛下稽春秋之文當月令之意祭祀志注蔡雍明堂論月令記曰明堂者所以明天氣統萬物文選注蔡雍明堂月令論曰周官有闈門之學韋彪傳建初七年盛夏多寒上疏以為刑罰刻急郡國不奉時令之所致魯恭傳永初元年上疏月令孟夏斷薄刑仲夏挺重囚今孟夏之制可從此令其決獄案考皆以立秋為斷以順時節王者質文不同四時之政行之若一樊鯈永平元年議刑辟宜須秋月以順時氣從之敬郎顓對宜宣告諸郡使授人時明堂位疏蔡雍明堂月令章句明堂者天子太廟所以祭祀詩疏袁凖正論云古有王居明堂之禮月令則其事也魏鄭公諌録月令起於上古書云敬授人時呂不韋止是修古月令未必始起秦代也漢永平班時令紀永平二年正月辛未祀明堂詔驃騎將軍三公曰其班時令勑群后注謂月令也四時各有令乖舛必致妖災升靈臺望元氣吹時律觀物變三年正月癸巳詔水旱不節有司勉順時氣勸督農桑四年二月辛亥詔再得時雨有司勉遵時政平刑罰漢候歲志雜占十八家三百一十三卷有泰一雜子候歲二十二卷子贛雜子候歲二十六卷天文志凡候歲美惡謹候歲始冬至旦臘明日正月旦立春四者候之日漢魏鮮集臘明正月旦決八風察太歲所在金穰水毁木飢火旱唐四時纂要志農家韓鄂五卷中興書目崇文目歲時類鄂采諸家農書紀風雲之候録種殖之法下及方書蓄産之事皆載天禧中頒其書於諸道鄂自序曰遍閲羣書爾雅則言其土産月令則序彼時宜採泛勝種藝之書二卷崔實試穀之法四民月令一卷韋氏月録傷於簡缺齊民要術弊在迂踈韋行規保生月録一卷賈思協要術十卷志又有歲華紀麗二卷書目四卷鄂采經史歲時雜事述以駢儷之語皇朝歲時雜詠二十卷皇朝宋綬掇詩人歲時雜詠分類編次歲時廣紀一百二十卷南唐徐鍇掇古今傳記前賢詩文凡時政風俗耕農養生之事悉載崇文目類書有歲時廣記一百二十卷時鏡新書五卷皇朝劉安靖以四時分十二月各繫其事書目崇文目有四序總要十二卷四時録四卷十二月纂要一卷齊人月令一卷時鑑新書五卷兵家有行軍月令一卷總論時令三禮義宗歲者依中氣一周以為一歲年者依日月十二會以為一年中朔大小不齊故有歲年之異宋志魏髙堂隆曰黃帝髙辛夏后氏漢皆以十三月為正少昊有唐有殷皆以十二月為正髙陽有虞有周皆以十一月為正五德更王有二家之説鄒衍以相勝立體劉向以相生為義張蒼以漢水勝周火廢秦不班五德賈誼以漢土勝秦水以秦為一代論秦漢雖殊而周為火一也相勝之義為長土生乎火水生乎金漢以土為赤帝子秦以水為白帝子也相勝者以土勝水相生者土自火子義豈相關後漢魯恭傳恭議曰月令周世所造而所據皆夏之時也注謂氣候及星辰昏旦皆夏時也其變者唯正朔服色犧牲徽號器械而已後魏正光厯有推七十二候術因冬至後五日一候李燾著七十二候圖三卷月令正義十二月之時候體例不一而正月七月記時候凡有五句自餘皆四句二至二分之月皆再記於時候以二至隂陽之始終二分隂陽之交會方氏曰積六候而成月故一歲則有七十二候三候為一氣積六氣而成時故一歲則有二十四氣春秋後傳夫子修春秋每孟月書時以見魯史每正月書王以存周正月令之書雖起秦世然先王之制存焉漢興頗用其略如春行寬大之令夏布封賞之恩以至秋冬理獄十月而後不復論囚皆本之月令自髙帝有分舉四時之制魏相為宣帝言之李尋告哀帝謂朝廷忽於時月之令諸侍中尚書近臣宜令通知月令之意陳寵魯恭亦皆言之三代雖不改時與月而春秋紀春無氷為異則固以周正紀事也左傳記祭足取麥穀鄧來朝三事經傳所記有例差兩月者是經用周正傳取國史有自用夏正者失於更改也詩多用夏正書金縢秋大熟亦是夏時此不改時月之驗但孟子謂七八月乃五六月謂十一十二月乃九十月此當闕之天人之道雖殊象類之理則一聖人將有為有行也仰觀日月星辰霜露之變俯察蟲魚草木鳥獸之化不先時而起不後時而縮以之授民事而無不順以之因物性而無不適此堯典若昊天以授時周官正歲年而序事後漢五行志注尚書大傳云云鄭玄曰自正月盡四月為歲之朝自五月盡八月為歲之中自九月盡十二月為歲之夕胡氏春秋傳曰周人以建子為歲首而以夏時冠周月何哉聖人語顔回以為邦則曰行夏之時作春秋以經世則曰春王正月此見諸行事之驗也以夏時冠月垂法後世以周正紀事示無其位不敢自專也月令正義案呂不韋集諸儒士著為十二月紀合十餘萬言名為呂氏春秋篇首皆有月令與此文同迎氣周迎氣四郊禮大宗伯祭五祀注玄謂五官之神在四郊四時迎五行之氣於四郊而祭五德之帝亦食此神焉疏月令四時四立之日迎氣在四郊并季夏迎土氣是五迎氣四時皆陳五德之帝并五人神於上為十二月聽朔及四時迎氣青圭赤璋之下注云迎氣時并祭五人帝五人神也掌次祀五帝疏謂四時迎氣月令四立之祭小司冦禋祀五帝疏謂四時迎氣詩我將疏雜問志云四時迎氣於四郊祭一帝還於明堂亦如之月令疏案賈馬蔡雍皆為迎春祭大皥及勾芒鄭獨以為蒼帝靈威仰郊特牲疏五時迎氣東方用青圭南用赤璋西用白琥北用玄璜中央亦用黃琮五時迎氣以五方人帝配之月令疏周法五時迎氣皆前期十日而齋秦法簡省故三日漢四時迎氣迎氣五郊五郊祭祀又見郊祀類記禮器因吉土饗帝于郊注祭於四郊今漢亦四時迎氣其禮則簡月令迎春東郊注祭靈威仰於東郊之兆王居明堂禮曰出十五里迎歲蓋殷禮也周迎郊五十里黃禮小宗伯兆五帝於四郊注帝亦於南郊明紀永平二年始迎氣於五郊注引續漢書云云祭祀志迎時氣五郊之兆自永平中以禮讖及月令有五郊迎氣服色注光武二年初制郊兆于城南中元二年初營北郊城北因采元始中故事兆五郊於雒陽四方中兆在未壇皆三尺階無等立春之日迎春於東郊祭青帝勾芒車旗服飾皆青歌青陽八佾舞雲翹之舞祭祀志又曰縣邑立春之日皆青幡幘迎春於東郭外令一童男冒青巾衣青衣先在野中迎者拜之而還弗祭三時不迎立夏之日迎夏於南郊祭赤帝祝融車旗服飾皆赤歌朱明八佾舞雲翹之舞先立秋十八日迎黃靈於中兆祭黃帝后土車旗服飾皆黃歌朱明八佾舞雲翹育命之舞禮儀志郊黃帝迎氣于黃郊樂奏黃鍾之宮歌帝臨冕而執干戚舞雲翹育命所以養時訓也立秋迎秋西郊祭白帝蓐收車旗服飾皆白歌西皓八佾舞育命之舞使謁者以一特牲先祭先虞於壇有事天子入囿射牲以祭宗廟名曰貙劉立冬迎冬北郊祭黑帝玄冥車服皆黑歌玄冥八佾舞育命之舞前志青陽朱明西皓玄冥皆鄒子樂肅宗紀建初五年冬始行月令迎氣樂東觀記馬防上言聖人作樂所以宣氣致和可因歲首發太簇之律奏雅頌之音以召和氣時以作樂器費多獨行十月迎氣樂馬防傳數言政事見采用十二月迎氣防所上也順帝復黃鍾隨月律祭祀志注月令章句東郊去邑八里因木數也南郊七里因火數也中兆去邑五里因土數也西郊九里因金數也北郊六里因水數也獻帝起居注建安八年公卿迎氣北郊始復用八佾皇覽曰迎春東堂堂髙八尺階三等青稅八乘旗旄尚青田車載矛號曰助天生唱之以角舞之以羽翟此迎春之樂也迎夏南堂堂髙七尺階二等赤稅七乘旗赤田車載戟號曰助天養唱徵舞鼓鞉迎夏樂也西堂九尺階九等白稅九乘旗白車載兵號曰助天收唱商舞干戚迎秋樂也北堂六尺階六等黑稅六乘旗黑車載甲鐵鍪號曰助天誅唱羽舞干戈迎冬樂也董鈞傳永平初為博士時草創五郊祭祀及宗廟禮樂威儀章服輒令參議蔡雍傳熹平六年七月上封事臣自在宰府及備朱衣迎氣五郊而車駕罕出四時至敬屢委有司皇天不恱顯此諸異書奏帝乃迎氣北郊及行辟雍之禮輿服志迎氣五郊各如其色從章服也皂衣群吏春服青幘立夏乃止順氣助微尊其方也禮儀志立春垂青幡施土牛耕人於門外下寬大書立夏衣赤至季夏衣黃先立秋十八日迎氣黃郊立秋迎氣白郊立冬迎氣黑郊冬至夏至長短之極微氣之所生也故使八能之士八人或吹黃鍾之律間竽或撞黃鍾之鐘或度晷景權水輕重水一升冬重十三兩或擊黃鍾磬或鼓黃鍾瑟或擊黃鍾鼓隋志續漢禮儀志云立春之日京都皆著青衣秋夏悉如其色逮于魏晉迎氣五郊行禮之人皆同此制魏相傳元康中上言髙帝詔四人各職一時願選明經知隂陽者四人各主一時時至明言所職以和隂陽服虔曰主一時衣服禮物朝祭百事也後魏禮志崔瓉議月令有青旗赤玉黑衣白輅隨四時而變不列辨冕司馬彪續漢書輿服祭祀志云迎氣五郊衣幘各如方色又禮儀志立春京都百官皆著青衣服青幘秋夏悉如其色自漢逮魏晉迎氣五郊用幘從服改色隨氣北史劉芳傳盧植云東郊八里郊也南郊七里中郊五里西郊九里北郊六里賈逵云中兆黃帝之位并南郊之季故云兆五帝於四郊鄭玄云中郊西南未地去都城五里王肅云八里因木數七里因火數九里因金數六里因水數宋氏含文嘉注云周禮王畿內千里二十分其一以為近郊近郊五十里倍之為逺郊迎氣蓋於近郊漢不設王畿則以其方數為郊處故東郊八里南郊七里西郊九里北郊六里中郊在西南未地五里祭祀志云建武二年正月初制郊兆於雒陽城南七里採元始中故事北郊在雒陽城北四里此漢世南北郊之明據也詩甫田以社以方注方迎四方氣於郊也曲禮祭四方注祭五官之神於四郊唐迎氣東郊迎氣壇迎氣五郊開元十一年正月一日制獻歲之吉迎氣方始敬順天時無違月令所由長吏可舉舊章開元二十六年正月丁丑迎氣于東郊會要開元二十五年十月一日辛丑制自今以後每年立春之日朕當率公卿親迎氣于東郊其後夏及秋常以孟月朔於正殿讀時令仍令禮官修撰儀注至二十六年正月八日親迎氣于東郊祀青帝壇以勾芒配歲星及三辰七宿從祀其壇本在春明門外以祠所隘移於滻水之東面值望春宮壇一成壇上及四面皆青色勾芒壇在其西歲星以上共為一小壇青帝壇北通鑑太常博士王璵請立青帝壇迎春從之按通鑑係開元二十五年水二十六年正月丁丑上迎氣于滻之東册府元龜開元十八年正月丁巳親迎氣於東郊會要武德九年命祖孝孫考正雅樂貞觀二年六月十日樂成孝孫以十二律順其月旋相為宫五郊迎氣各以月候而奏其音文粹祀五方上帝于五郊樂章乃魏徵褚亮作禮樂志迎氣以六尊惟山罍減上帝之半十二和一曰豫和五郊迎氣黃帝以黃鍾為宮赤帝以函鍾為徵白帝以太蔟為商黑帝以南宮為羽赤帝以姑洗為角皆文舞六成讀時令周頒朔告朔中朔禮太史正歲年以序事頒之于官府都鄙頒告朔于邦國注中數曰歲朔數曰年中朔大小不齊正之以閏若今時作厯日疏節氣一名朔氣朔氣在晦則後月閏中氣在朔則前月閏中氣匝則為歲朔氣匝則為年鄭云天子班朔於諸侯諸侯藏之祖廟者案玉藻諸侯皮辨聽朔於太廟即祖廟也至朔朝于廟告而受行之月用羊懸於中門匝日斂之藏於廟此經及論語稱告朔玉藻謂之聽朔春秋謂之視朔視者人君入廟視之告者使有司讀之聽者聽治一月政令司農云以十二月朔布告天下諸侯言朔者以十二月厯及政令若月令之書號之為朔春秋之義天子班厯於諸侯日食書日不班厯則不書日先近及逺故先官府次都鄙下乃言邦國記玉藻天子玄端而朝日東門之外聽朔於南門之外注端當為冕朝日春分之時也東門南門皆謂國門也天子廟及路寢皆如明堂制明堂在國之陽每月就其時之堂而聽朔焉卒事反宿路寢亦如之凡聽朔必以特牲告其帝及神配以文王武王疏月令孟春居青陽左個仲春青陽太廟季春右個以下所居各有其處論語曰告朔之餼羊注云天子特牛與以告朔禮略故用特羊閏月則闔門左扉立于其中注閏月非常月也聽其朔於明堂門中還處路寢門終月疏明堂有四門即路寢亦有四門閏月各居其時當方之門禮大史詔王居門終月注路寢門也於文王在門為閏皮辨以日視朝遂以食日少牢朔月大牢諸侯皮辨以聽朔於大廟朝服以日視朝於內朝疏凡每月以朔告神謂之告朔于時聽治此月朔之事謂之聽朔又謂之視朔文十六年公四不視朔是也告朔又謂之告月文六年閏月不告月是也行此禮天子於明堂諸侯於大祖廟謂之朝廟朝享月祭又謂之朝正劉氏曰天子聽朔於明堂而頒正朔于天下諸侯受而藏諸太廟每月之吉以餼羊告朔祭于太廟因而聽其月朔之政士冠禮皮辨服注此與君視朔之服也禮大宰注大宰以正月朔日布王治之事於天下至正歲又書而懸于象魏振木鐸以徇之使萬民觀焉小宰亦帥屬而往皆所以重治法新王事也左傳僖五年正月辛亥朔日南至公既視朔登觀臺注親告朔也疏天子班朔於諸侯諸侯受而藏於太祖廟每月之朔告廟受而行之步厯之始以朔旦冬至為首厯之上元釋例曰聖人簡其節敬其事因月朔朝遷坐正位命群吏而聽大政考其所行而決其煩疑歲首謂之朝正襄二十九年正月傳曰釋不朝正于廟是也告朔視朔聽朔朝廟朝享朝正二禮各有三名同日為之經稱告月傳言告朔明告月必以朔也每月之朔必朝於廟因聽政事事敬而禮成故告以特羊魯論語注鄭曰禮人君每月告朔於廟有祭謂之朝享自文公始不視朔子貢見其禮廢故欲去其羊謂禮司尊彛注朝享朝受政於廟公羊傳文六年閏月不告月不告朔也注禮諸侯受十二月朔政於天子藏於太祖廟每月朔朝廟使大夫南面奉天子命君北面而受之比時使有司先告朔謹之至也十六年夏五月四不視朔注禮月終于廟先受朔政乃朝明王教尊也朝廟私也故以不視朔為重穀梁傳天子告朔于諸侯諸侯受乎禰廟禮也注告廟以羊天子以十二月朔政告于諸侯諸侯每月必告朔聽政因朝于廟周書大聚云銘之金板藏府而朔之注月旦朔省家語諸侯皮辨以告朔然後服之以視朝唐會要閭丘湑等議經史正文無天子每月告朔之事玉藻云聽朔周禮大宰正月之吉布政干寶注云周正建子之月告朔日也此即玉藻之聽朔而鄭玄注云告其時帝及神配以文武此誤也漢魏至今莫之行用其每月告朔者諸侯之禮案禮論三禮義宗江都集禮貞觀顯慶禮及祠令並無天子每月告朔之事張齊賢議案穀梁傳曰閏月天子不告朔是知他月則天子告朔矣左氏以魯侯不告閏為棄時政則諸侯閏月亦告朔矣周禮大史頒告朔之下有閏月居門之事是天子亦以閏月告朔案禮論王珉范寧議有明堂每月告朔之禮崔靈恩義宗載天子視朔之服諸侯受朔於天子於祖廟告而受行之天子受朔於天宜於明堂告帝而配以祖考王方慶議天子以孟春正月上辛於南郊總校十二月之政還藏於祖廟月取一政班於明堂月令居青陽明堂總章玄堂是告朔之事後漢祀典仍存永平二年郊祀五帝明堂以光武配祭牲各一犢奏樂如南郊宋志魏楊偉表曰時以紀農月以紀事少昊則玄鳥司分顓嚳則重黎司天唐虞則羲官掌日三代因之世有日官日官司厯則頒之諸侯諸侯受之則頒於境內周室既衰戰國橫騖告朔之羊廢而不紹登臺之禮滅而不遵閏分乖次而不識孟陬失紀而莫悟大火猶西流而怪蟄蟲之不藏也是時天子不協時司厯不書日諸侯不受職日御不分朔仲尼於春秋司厯失閏則譏而書之登臺頒朔則謂之有禮穀梁疏三朝記云周衰天子不頒朔於天下漢讀五時令太史月厯後禮志禮威儀每月朔旦太史上其月厯有司侍郎尚書見讀其令奉行其政晉禮志陳本云通典亦云漢儀太史每歲上其年厯先立春立夏大暑立秋立冬常讀五時令皇帝所服各隨五時之色帝升御座尚書令以下就席位尚書三公郎以令置桉上奉以入就席伏讀訖賜酒一巵魏氏常行其禮晉亦有其制通典云非古制自東漢始魏景初元年通事奏曰前後但讀四時令至服黃時獨闕髙堂隆以為土王四季是以服黃無令官志太史令六百石注掌天時星厯凡歲將終奏新年厯周禮大史正歲年序事注若今時作厯日馮相氏會天位注若今厯日漢中朔宋志魏楊偉表曰秦漢以孟冬為歲首閏為後九月中節乖錯時月紕繆加時後天蝕不在朔至元封七年改正朔更厯數使大才通人造太初厯校中朔所差以正閏分課中星得度以考疏密以建寅之月為正朔以黃鍾之月為厯初其厯斗分太多後遂疏闊前志三統厯有中朔相求之術朔不得中是謂閏月閏所以正中朔也漢立春寬大書禮儀志立春之日下寬大之書曰制詔三公方春東作敬始謹微動作從之罪非殊死且勿按驗皆須麥秋退貪殘進柔良下當用者如故事注月令曰命相布德和令蔡雍曰即此詔之謂也獻帝起居注建安二十二年二月壬申詔絶立春寬緩詔書不復行肅宗詔曰律十二月立春不以報囚論陳寵奏蕭何造律季秋囚俱避立春之月侯霸傳建武四年拜尚書令時無典故朝廷又少舊臣霸明習故事收録遺文條奏前世善政法度有益於時者皆施行之每春下寬大之詔奉四時之令皆霸所建也論曰先奏寬大之令注月令春布德行慶施惠建武七年正月丙申詔中都官三輔郡國出繫囚非犯殊死勿案罪中元二年顯宗即位十二月甲寅詔方春戒節人以耕桑其勑有司務順時氣使無煩擾殊死以下聽得贖論永平二年正月辛未詔殊死以下皆赦除之百僚師尹勉修厥職順行時令敬若昊天以綏兆人三年正月癸巳詔春者歲始始得其正則三時有成有司勉順時氣勸督農桑詳刑謹罰明察單辭至於方春東作勉勸農桑罪非殊死須立秋案驗有司進柔良退貪猾順時令理寃獄則肅宗建初元年正月丙寅之詔也方春生養萬物莩甲宜助萌陽以育時物令有司罪非殊死且勿案驗及條書相告不得聽受以息事寧人敬奉天氣立秋如故則元和二年正月乙酉之詔也三朝之會朔旦立春嘉與海內洗心自新務崇寬和敬順時令遵典去苛則順帝永建四年正月丙寅之詔方春東作育微敬始其勑有司罪非殊死且勿案驗以崇在寬則質帝本初元年正月丙申之詔建武五年五月丙子以久旱詔出繫囚罪非犯殊死一切勿案務進柔良退貪酷永平四年二月辛亥詔有司勉遵時政務平刑罰十八年四月己未詔時雨不降理寃獄録輕繫永元十六年七月戊午以秋旱詔囚徒於法疑者勿決以奉秋令察煩苛之吏顯明其罰則不特立春而下永嘉元年五月甲午詔罪非殊死一切任出以須立秋舊制立秋乃行薄刑和帝永元十五年改用孟夏下令麥秋得案驗薄刑永初元年魯恭上疏伏見詔書敬若天時罪非殊死且勿案驗進柔良退貪殘奉時令所以助仁德順昊天致和氣章帝助三正之微順物性命以致時雍其立春在十二月中者勿以報囚如故事陽嘉二年正月郎顗對方春東作布德之元王者奉順時氣宜崇溫柔遵其行令今立春之後考事不息秋冬之政行乎春夏邪氣乘陽皆刻急所致立春前後溫氣應節者詔令寬也其後復寒者無寬之實也又上書云春秋書正月敬歲始也宜流寬大之澤王者崇寬大順春令則靁應節谷永傳願陛下立春遣使者循行風俗宣布聖德存恤孤寡問民所苦勞二千石敕勸農桑毋奪農時魏相奏文帝時以二月施恩惠於天下賜孝弟力田頗非時節朝錯為家令奏言其狀陛下恩澤甚厚而災氣未息恐詔令未合當時宣帝黃龍元年二月詔曰數申詔公卿大夫務行寬大成帝鴻嘉四年正月詔數敕有司務行寬大禁苛暴漢紀杜周嘗冬獄未竟會立春有寬大令魏四時讀令見上晉四時讀令晉志成帝咸和五年六月丁未三十日有司奏讀秋令侍中荀奕黃門侍郎曹宇駁曰尚書三公曹奏讀秋令儀注舊典未備臣等參議武皇帝時光祿大夫華恆議以秋夏盛暑常闕不讀令在春冬則不廢令服章多缺請如常議詔可六年三月有司奏十六日立夏宜讀夏令奏可咸和六年三月有司奏四時讀令是祗述天和之道晉世常臨太極殿尚書郎讀時令宋元嘉六年讀時令三公郎讀皇帝臨軒百僚備位惟世祖世劉協太宗世謝緯為三公郎善於其事人主公卿屬目稱歎北齊立春日服通天冠青介幘紗袍佩蒼玉青帶褲襪舄而受朝太極殿西廂東向三公郎中詣席跪讀時令立夏立秋施御坐於中軒南向立冬如春東向各以時色服儀並如春元魏太和十五年十二月始迎春東郊十六年春居青陽左個布政事自是每朔行之宋志漢儀立秋日獵服緗幘晉哀帝初博士曹弘之議立秋御讀令不應緗幘詔改用素傅咸曰立秋一日白路光於紫庭白旗陳於玉階則其日旗路皆白也魏臺雜記曰前後但見讀春夏秋冬四時令至於服黃之時獨闕不讀令不解其故景初元年十二月二十一日太史令髙堂隆上言曰黃於五行中央土也王四季各十八日土生於火故於火用事之末服黃其令則隨四時不以五行為分是以服黃無令唐明堂讀時令禮志皇帝御明堂讀時令通典云讀五時令孟春禮部尚書先讀令三日奏讀月令前三日尚舍設大次於東門外道北南向守宮設文武侍臣次於其後之左右設羣官次於璧水東之門外文官北武官南前一日設御座於青陽左個東向三品以上及諸司長宮座於御座東北南向武官座於御座之東北向設刑部郎中讀令座於御座東南北向有桉設文官解劍席於丑陛之左武官於卯階通典云卯陛下同之右皆內向大樂令展宮懸於青陽左個之庭設舉麾位堂上寅階通典云寅陛下同之南其一位於樂懸之東北其日陳小駕皇帝服青紗袍佩蒼玉乘金輅出宮至於大次刑部郎中以月令置於案覆以帊侍中奏外辦皇帝御輿入自青龍門升自寅階即座通典夏入自朱雀門秋白虎門冬玄武門夏升自己陛秋申陛冬亥陛符璽郎置寶於前公王以下就位再拜侍中奏讀月令制曰可刑部再拜解劍俯脫舄取令升自卯階席南北向跪置令於桉立於席後典儀唱就座公王以下並就座刑部郎中讀令每句一絶使言聲可了讀訖堂上典儀唱可起公王以下皆起羣官復位侍中奏禮畢自仲春以後每月各居其位皆冠通天服玉之色如其時四時之孟月及季夏土王讀五時令於明堂亦如之禮樂志太宗時房玄齡等因隋之禮增讀時令為貞觀禮文通典春令其具小戴禮唐太極宣政殿讀時令紀貞觀十四年正月庚子有司讀時令會要正月二日讀春令開元二十六年四月己亥朔有司讀時令詔百官之長升太極殿列坐聽焉通典云貞觀十一年修四時讀令會要作十四年傳韋縚為太常卿初明堂詔歲率公卿迎氣東郊至三時常以孟月讀時令於正寢二十六年詔縚每月奏月令一篇會要開元二十六年四月一日命縚進月令孟月朔日於宣政殿側設榻東向置桉令縚讀之諸司官長悉升殿坐聽歲餘罷之會要開元二十五年制自今後立春之日朕當率公卿親迎春東郊其夏及秋常以孟月朔於正殿讀時令肅宗元年赦文朕躬授人時謹月令每至孟月令所司明按典禮宣讀時令朕當舉而行之天寶五載改月令日時令通典杜佑云非古制也又武后長安四年司禮少卿崔融奏罷乾元元年十二月二十八日丙寅立春御宣政殿命太常卿于休烈讀時令會要通典云讀春令常參官五品已上升殿序坐而聽之貞元六年二月制四孟月迎氣之日令所司宣讀時令大和八年六月中書門下奏天寶後盛典久廢請來年正月依舊禮讀時令命太常撰儀注通典太極殿讀五時令開元五年十月甲申詔每月禮官條奏所行事開元定禮有明堂及太極殿五時讀令之儀冠服佩玉悉從方色南史齊永明六年十月庚申初臨太極殿讀時令景祐讀時令景祐四年丁丑歲三月詔五月朔行入閣之儀仍讀時令以朔日夏至戊戌改用七月朔尋罷之先是詔國朝時令委編修官約唐月令撰定以備宣讀於是賈昌朝等采國朝律厯典禮日度昏曉中星及祠祀配侑諸事當以歲時施行者改定一篇上之遂詔因入閣行其禮後亦不果初李淑上時政十議議時令曰願命有司講舊禮以氣至之日集文武官讀時令於天安殿政和明堂頒朔布政政和七年十月乙卯朔御明堂頒朔布政唐武后聖厯初詔議告朔于明堂讀時令布政事太常博士辟閭仁諝曰經無天子月告朔唯玉藻天子聽朔南門之外周太宰正月之吉布政干寶曰建子月告朔日也今元日讀時令合古聽朔事獨鄭玄以秦制月令有五帝五官因言聽朔必以特牲告時帝及神非是張齊賢質曰周太史頒朔邦國是總頒于諸侯天子月告者頒邦國都鄙內外異言之禮不可闕會要元年閏臘月十九日制依王方慶議四時孟月朔日及季夏於明堂行告朔禮用鄭玄義告五時帝於堂上玉海卷十二
