body:
  text: 玉海卷一百二十二宋王應麟撰官制六卿九卿卿章也章善明理也又卿嚮也言為人所歸嚮也黃帝五官九工史記黃帝考定星厯建立五行於是有天地神祇物類之官是謂五官正義黃帝置五官各以物類名職管子五行篇黃帝作五聲五鍾五聲既調然後立五行以正天時五官以正人位人與天調然後天地之美生美謂甘露醴泉之類甲子木行御命左右士師發粟順山林丙子火行御命行人掘溝澮戊子土行御命左右司徒養草木蕃五穀庚子金行御命祝宗薦祖廟五祀左右司馬組甲厲兵壬子水行御命左右使人閉藏草木根本美五官各七十二日而畢凡三百六十日而一嵗之事畢吕氏春秋黃帝建五官以正人位又見應劭以雲紀官注文選王元長䇿文九工開於黃序注黃帝也有雲瑞故以雲名官有五人有同德四人以五合四為九官楚語觀射父曰有天地神民類物之官謂之五官黃帝司徒司馬少皥司徒司馬司空司冦見宰相及官名類少皥五正四叔三正顓頊二官五官左傳昭二十九年蔡墨曰有五行之官是謂五官列受氏姓封為上公祀為貴神社稷五祀是尊是奉注五官之君長能修其業者死皆配食於五行之神木正春官曰勾芒重火正夏官曰祝融黎金正秋官曰蓐收該水正冬官曰玄冥修及熙土正中官曰后土勾龍氏服注云高辛因之少皥氏有四叔重為勾芒木正該為蓐收金正修及熙為玄冥二子相代為水正玄傳金天氏有裔子曰昧為冥師正義四叔出於少皥其使重為勾芒非少皥使之世族譜云少皥其官以鳥為名然則此五官皆在高陽之世楚語云云重黎居官在高陽之世高鄭語云云黎為祝融又在辛之世漢張衡傳應間曰四叔三正官無二業金木及水文選王元長文五正置於朱宣下民不忒注少皥之號五正即五雉之正唐崔融傳曰建五正而人事理斯乃帝辛氏所以為人政也漢律厯志顓頊命南正重司天火正黎司地楊子曰北正其後三苗亂德二官咸廢堯復育重黎之後使纂其業周禮疏云堯典注高辛氏之世命重黎重黎事顓頊又事高辛楚語顓頊命南正重司天以屬神南陽位周禮則宗伯命火正黎司地以屬民火當為北北陰位周禮則司徒而傳顓頊為民師命以民事鄭語黎為高辛氏火正命之曰祝融世本黎是顓頊曾孫黎或是國名官號顓頊命黎高辛命黎未必是一人左傳襄九年士弱曰古之火正或食於心或食於咮注配食於火星陶唐氏之火正閼伯居商丘禮記正義祝融古火官之長為堯司馬鄭玄云漢司馬遷傳唐虞之際紹重黎之後使復典之至於夏商故重黎氏世序天地又見楚語孟子舜使益掌火注主火之官猶古火正列仙傳仇生赤湯時為木正堯六卿舜六官九工堯九職見人物類通典舜為六官以主天地四時堯置天地四時之官為六卿見官名詩玄鳥箋契為堯司徒有功封商錫其姓焉宋志堯時舜為司徒説苑堯之時舜為司徒契為司馬禹為司空淮南子同同文選引文子孟子舜使契為司徒教以人倫堯時通典堯時棄為后稷兼掌司馬禮記正義鄭玄云祝融為堯司馬淮南子堯之佐九人舜之佐七人武王之佐五人考工記注六官之記可見者堯育重黎之後羲和及其仲叔四子掌天地四時夏書乃召六卿商周雖稍改職名六官之數則同舜九官書舜典咨汝二十有二人注禹垂益伯夷夔龍六人新命有職四嶽十二牧凡二十有二人集傳二十二人四嶽九官十二牧也百揆統庶官四嶽統十二牧舜命九官新命者六人伯禹伯夷咨四嶽而命者也垂益泛咨而命者也命夔龍因人之讓不咨而命者也若稷契臯陶之不咨者申命其舊職而已又按此以平水土若百工各為一官而周制同領於司空此以士官兼兵刑之事周禮分為夏秋兩官漢劉向傳舜命九官濟濟相讓注禹司空棄后稷契司徒咎繇士垂共工益虞伯夷秩宗夔典樂龍納言王元長云九工開於黃序庶績其凝李善注劉向上疏舜命九官夏六卿九卿書甘誓乃召六卿以官而言王曰嗟六事之人以軍而言注天子六軍其將皆命卿疏此周禮夏官序文也鄭玄云夏亦然則三王同也鄭注大傳夏六卿者后稷司徒秩宗司馬士共工也胤征注胤侯為大司馬政典若周官六卿之治典胤征政典乃六典之一周因於夏通典夏后之制亦置六卿其官名次猶承虞制記王制天子三公九卿二十七大夫八十一元士注此夏制也明堂位夏后氏官百舉成數也正義王制之文鄭皆以為殷法此云夏制者以明堂位殷官二百與此百二十數不相當昏義天子立六官三公九卿云云注三公以下百二十人似夏時也通典夏制九卿殷周亦如之少師少傅少保冡宰司徒宗伯司馬司寇司空記曰夏后氏官百天子有三公九卿也卨玄孫之子微為夏司徒冥為夏司空宋志云契之子周語夏之衰棄稷弗務不窋用失其官鄭注三王同有六卿月令疏按書傳有司馬司徒司空公領三卿此夏制也曲禮云司徒司馬司空司士司冦此殷制也殷六大六典五官六卿六府六職六工大宗大史司士曲禮天子建天官先六大曰大宰大宗大史大祝大士大卜典司六典注此蓋殷時制周則大宰為天官大宗曰宗伯為春官大史以下屬焉大士以神仕者故吕氏曰殷人尊神大宗以下皆事鬼神奉天時之官謂之天官大宰佐王代天工者也士即周司巫紀儀禮商祝注祝習商禮者逺夏祝事遊氏曰古之治於逺後世之治紀於近紀者其本於天紀近者紀乎人事而以法天參焉建天官先六大與堯命羲和舜齊七政洪範首五行之意無異五官曰司徒司馬司空司士司寇典司五衆注於周則司士屬司馬正義殷家六卿大宰司徒司馬司空司士司冦是也大宰一卿法於天時司徒以下五卿法於地事但大宰尊故先列之并顯大宗以下所隸屬之官以守六事之法又置五官以象地之五行五官亦各有所領不條出其人略也吕氏曰司士掌羣臣之版所統有衆所以並立為五官陸氏曰司士代宗伯者以司士所掌與禮相通也六府曰司土司木司水司草司器司貨典司六職注主藏六物之稅周皆屬司徒正義既法天地立官又為萬物立府司土周為土均司木周為山虞司水周為川衡司草周為稻人司器周為角人司貨周為草人金玉曰貨六工曰土工金工石工木工獸工草工典制六材注此亦殷制於周皆屬司空土工陶旊也金工築冶鳬栗段桃也石工玉人磬人也木工輪輿弓廬匠車梓也獸工函鮑韗韋裘也唯草工職亡蓋作萑葦器典制六材正義制六府之材物為陸氏曰草工蓋設色之工若以藍為青䓞為紫蒨紅是也葉氏曰聚於人曰六府造於人曰六工五官致貢曰享致其歲終之功於王五官之長曰伯是職方長謂為三公者周禮九命作伯伯分主東西正義三公八命者堯時薑氏為四伯堯之末分置八伯殷改置二伯與周同史記周紀古公作五官有司民皆歌樂之注引禮記殷制左傳晉唐叔始封受職官五正注五官之長疏於殷時為五行官長通典湯以咎單為司空書序咎單作明居正義馬融云咎單為湯司空殷九卿説苑君道篇湯問伊尹曰三公九卿二十七大夫八十一元士知之有道乎臣術篇伊尹曰三公所以參五事也九卿所以參三公也大夫所以參九卿也列士所以參大夫也漢王吉傳言舜湯不用三公九卿之世而舉臯陶伊尹通典殷九卿伊尹曰三公調陰陽九卿通寒暑商頌長發允也天子降于卿士實維阿衡實左右商王正義三公兼卿士也紀年殷王即位居亳命卿士伊尹史記商紀武丁思復興殷政事決定於冡宰以觀國風周紀武王曰維天建殷其登名民三百六十夫索隱登進名賢之人亦見周書隨巢子楚語殷武丁三年默以思道卿士曰王言以出令也周九卿九品禮朝士掌外朝之法左九棘孤卿大夫位焉匠人營國外有九室九卿朝焉九分其國以為九分九卿治之注六卿三孤為九卿周禮疏按昏義云三公九卿六卿并三孤而言九其三公又下兼六卿故書傳云司徒公司馬公司空公各兼二卿按顧命大保領冡宰畢公領司馬毛公領司空别有芮伯為司徒彤伯為宗伯衛侯為司冦則周時三公各兼一卿之職與古異矣漢表周官則備矣立三少是為孤卿與六卿為九焉周語外官不過九品注九卿魯語與三公九卿祖識地德周六卿六典六屬六職六聫卿士六官書周官冡宰掌邦治統百官均四海司徒掌教敷五典擾兆民宗伯掌禮治神人和上下司馬掌政統六師平邦國司冦掌禁詰姦慝刑暴亂司空掌土居四民時地利六卿分職率屬以倡九牧阜成兆民禮天官惟王建國辨方正位體國經野設官分職以為民極注周公作六典之職謂之周禮大宰建邦之六典佐王治邦國治教禮政刑事乃施典于邦國而建牧立監設參三卿傅伍五大夫陳殷置輔施則于都鄙而建長立兩設伍陳殷置輔施法于官府而建正立二設考陳殷置輔大宰所掌獨謂之建以此典大宰所定也小宰以官府之六屬舉邦治八法官屬一曰天官其屬六十掌邦治大事則從長小事則專逹至冬官同注六官之屬三百六十象天地四時日月星辰之度數天道偹焉前此者成王作周官其志有述天授位之義故周公設官分職以法之六周以三公兼六卿三公無職六卿則分職三公論道卿則行道同源委精粗於體可離非道也以官府六職辨邦治八法官職曰治教禮政刑事職以官府之六聨合邦治八法官聨祭祀賔客喪荒軍旅田役斂弛凡小事皆有聯詳見後以序官考之天官之屬六十有三地官之屬七十有九春官之屬七十有一夏官之屬七十秋官之屬六十有五此五官之屬已三百四十有八雖冬官散落無紀計其數總四百有餘聖人法天建官天度竒而不齊聖人亦不如是之拘也舉其成數曰其屬六十而已唐虞建官法天地四時以分職羲和天地之官也四嶽四時之官也夏因虞制甘誓召六卿是也殷大宰至司冦乃周之六官也書卿士惟月詩常武王命卿士大師皇父詩傳云方叔卿士命而為將左傳鄭武公莊公為平王卿士注王卿之執政者鄭伯為王左卿士虢公忌父始作卿士于周單靖公為卿士相王室卿士六卿之外更為都官總六官之事或曰蓋卿之士大宰之屬有上中下士公羊所謂宰士左氏所謂周公以蔡仲為己卿士是也楚伍舉曰天子以公侯為官正以伯子男為師旅詩維天之命駿惠我文王箋制法度大順我文王之意謂為周禮六官之職也周大宰八法八則八柄八統九兩六敘八成六計天官大宰卿一人千氏曰濟其清濁和其剛柔而納之中和曰宰疏周天有三百六十餘度天官亦總攝三百六十官故云象天建邦之六典以八法治官府曰官屬以舉邦治小宰之六屬官職以辨邦治小宰六職官聯以會官治小宰六聨官常以聽官治宰夫治數之官常官成以經邦治小宰八成官法以正邦治小宰七事之法官刑以糾邦治小宰所徇之常刑官計以弊邦治小宰六計官詳於典故曰法八者其六為邦治其二為治蓋聨事常數非若六者之關於邦治也法月令孟春命大史守典奉注六典八法也以八則治都鄙曰祭祀馭神法則馭官廢置馭吏祿位馭士賦貢馭用禮俗馭民刑賞馭威田役馭衆以法為式故曰則之秋官設都則之職大宗伯九儀命惟五命以上然後賜則夏官匡人掌逹法則匡邦國法則之二司書掌邦之六典八法八則司會掌典大史掌建邦之六典逆邦國之治掌法逆官府掌則逆都鄙之治大司冦凡諸侯獄訟以邦典定之卿大夫獄訟以邦法斷之庶民獄訟以邦成弊之注六典八法八成以八柄詔王馭羣臣曰爵以馭貴祿以馭富豫以馭幸置以馭行生以馭福奪以馭貧廢以馭罪誅以馭過八柄言詔王明天下威福之柄以網維斯世惟天子得専之惟大宰得詔之慶賞詳而列於先刑罰簡而列於後內史掌王八柄之法爵祿廢置殺生豫奪注大宰既詔王內史又二之以八統詔王馭萬民曰親親敬故進賢使能保庸尊貴達吏禮賔馭民本於王者躬行故以統言之統於上繫屬於下九職九賦九式九貢見後以九兩繫邦國之民曰牧以地州長長以貴諸侯師以賢諸侯師氏儒以道諸侯保氏宗以族主以利吏以治友以任藪以富得民兩猶耦也所以協耦萬民長牧即施典而建牧者長即施則而建者師即學校之傳道授業者儒即道德之化民成俗者宗如正室門子之類可以收三族之親疏者主如郊甸任地之類不屬乎吏自為之主者吏如鄉遂公邑之吏各分其職治民之事者友如鄉田同井之友藪如養蕃鳥獸之藪宗儒與師友理義之大列是三者以繫人心凡治以典待邦國以則待都鄙以法待官府以官成八成待萬民以禮待賔客之治邦之小治冡宰聽之三歲大計羣吏之治而誅賞之周公位冡宰為大宰宰書注召公冡宰制僖九年宰周公為天子三公兼冡者王制冡宰國用於歲杪內則后王命冡宰降德于衆兆民命大射儀宰戒百官注冡宰月令季秋冡宰舉五穀之要小宰中大夫二人治王宫之政令糾禁掌六典八法八以下原闕一頁為匠師夫宰者調和之名者治也掌治朝之法正王及三公六卿大夫羣吏之位注治朝在路門之外其位司士掌焉宰夫察其不如儀敘羣吏之治待諸臣之復反報於王萬民之逆上書維司農云詩人重之曰家伯宰以言反命於上謂之復自下有言於上謂之逆掌百官府之徵令辨其八職一曰正掌官法以治要六官之長二曰師掌官成以治凡六官之二三曰司掌官法以治目上士中士之職注治要若歲計治凡若月計治目若日計四曰旅掌官常以治數旅下士之職五曰府掌官契以治藏六曰史掌官書以贊治七曰胥掌官序以治敘八曰徒掌官令以徴令前四者皆王臣也後四者庶人在官者也掌治法以考百官府羣都縣鄙之治乘其財用出入歲終令羣吏正歲會月終正月要旬終正日成以考其治大射儀宰夫戒宰及司馬聘禮宰書幣命宰夫官具傳命宰人出禮書注大宰之屬宫正上士二人中士四下士八主宫中官之長掌王宫戒令糾禁以時比宫中之官府次舍為版以待夕擊柝而比之官府在宫中者若膳夫玉府內宰內史之屬王宫宿衛有官府之吏有國之士庶子有守王宫之民辨外內而時禁稽功緒糾德行幾出入均稍食去淫怠竒邪之民會什伍教道藝自宫正宫伯所掌所以為正心之端宫魯宋鄭有司宫伯中士二人下士四人伯長也掌王宫士庶子在版者行其秩敘授八次在內八舍在外之職事月終均秩歲終均敘王宫有四隅之地次舍列四角四中凡八宿衛王宫者必士庶子而宫伯必統之疏曰宫伯掌王宫中卿大夫之適子庶子士之適子也子弟皆有名籍以擬校比宫正等士官為前內宰等大夫官為後以緩急為次第膳夫上士二人中士四下士八食官之長夫詩曰仲允膳掌王之食飲膳羞以養王及后世子雖養其體亦所以養君德王之饋食用六穀膳用六牲飲用六清羞用百有二十品珍用八物醬用百有二十甕饋以食為先王日一舉鼎十有二物皆有爼以樂侑食膳夫授祭王燕飲酒則為獻主燕義曰使宰夫為獻主臣莫敢與君亢禮文王世子曰君與族燕異姓為賔膳宰為主人歲終則會唯王及后世子之膳不會世子天下之本而獨不會膳何也膳常禮也日用不可廢若裘與服則有華靡之戒膳禽飲酒則有盤遊沉湎之戒觀有司之會不會待世子者有道矣致大宰以道制之此膳夫所以不會饗周秩官曰膳宰饔虢文公曰膳夫陳籍禮宰夫陳膳宰監之膳夫贊王王歆大牢夫㕓人珍異之滯者入膳府注膳夫之府惠王收膳之秩文王世子命膳宰曰末有原宰雲漢詩膳夫左右注年榖不登則膳夫徹膳晉膳屠蒯非刀匙是共又敢與知防味以行氣氣以實志志以定言言以出令心司味飲鼎大烹養賢祈招形民之力無醉飽之菲食庖人中士四人下士八共六畜六獸六禽夏少康為虞庖正內饔中士四人下士八掌割烹煎和宰夫和之齊之以味濟其不及泄其過君子食之以平其心王之好賜肉修饔人共之外饔中士四人下士八掌外祭祀之割亨共脯修刑膴特牲饋食禮有雍正注官名有司徹篇雍府雍人亨人下士四人掌鼎鑊水火之齊易之鼎曰以木巽火亨飪也身自膳夫而下所以為修之端祭祀共大羮鉶羮賔客亦如之甸師下士二人郊外曰甸帥屬耕耨王藉時入以共齍盛祭祀共蕭茅共野果蓏之薦周以公邑之田任甸地禹貢五百里甸服胥三十人徒三百人甸師帥屬帥此而已甸文王世子曰甸人周秩官甸人積薪公食大夫禮人陳鼎大射儀甸人執大燭於庭掌穀梁傳甸粟而內之三宫注甸師田之官獸人中士四人下士八罟田獸辨名物時田則守罟及弊田令禽注于虞中漁人中士二人下士四以時漁為梁獺祭魚然後漁人入澤梁取之以時也春獻王鮪季春以薦寢廟獻之以時也凡漁征入玉府魯宣公夏濫泗淵里革斷罟曰古者大寒降土蟄發水虞於是講罛罶取名魚登川禽而嘗之寢廟行諸國人助宣氣也鳥獸孕水蟲成獸虞於是禁罝羅矠魚鱉以為夏稿助生阜也鳥獸成水蟲孕水虞於是禁罝䍡設穽鄂以實廟庖蓄功用也山不槎孽澤不伐夭魚禁鯤鮞獸長麑䴠鳥翼雛卵蟲舍蚳蝝蕃庶物也古之訓也公曰是良罟也為我得法使有司藏之冬臧僖伯諫觀魚有月令孟冬命漁師收池澤之賦季漁師始漁齊侍漁注監取之官時魚麗萬物盛多取之以道用之以佃漁取諸離鱉人臘人醫師上士二人下士四歲終稽醫事制其食食醫中士二人和王之六食六飲六膳百羞百醬八珍之齊醫命士二十有八人周之重醫如此疾醫瘍醫獸醫酒正中士四人下士八掌酒之政令以式法授酒材月令曰乃命大酋秫稻必齊麯糵必時湛饎必潔水泉必香陶器必良火齊必得辨五齊之名泛醴盎醍沈辨三酒之物事昔清辨四飲之物清醫漿酏司暴禁羣飲萍氏幾酒謹酒將文王誥教小子有正有事無彛酒越庶國飲惟祀德無醉酒正之式法曰祭祀也賔客也凡王之燕飲賜頒也饗士庶子耆老也共之有道用之有時之禹惡旨酒好善言易戒濡首詩刺初筵感夏禹防微悟儀氏之見疏嘉衛武之能悔著屢舞於初筵泉詩書淫亂之戒其原皆在於酒天垂酒旗地列酒酒人奄十人為五齊三酒凡事共酒入于酒府注酒正之府之月令注大酋酒官長於周為酒人漿人奄五人共王之六飲水漿醴涼醫酏入于酒府內則言飲者十名涼為濫酒正四飲無水涼凌人凌氷室也下士二人掌冰正歲十二月斬冰三其凌春始治鑑祭祀共冰鑑夏頒冰秋刷傳日在北陸而藏冰西陸朝覿而出之祭寒而藏獻羔而啓詩三之日納于凌陰政先王藏冰出冰之政所以順天時防民患冰著於豳詩大偹於成周籩人奄一人掌四籩之實醢人奄一人掌四豆之實醯人鹽人奄二人祭祀共苦鹽散鹽賔客共形鹽散鹽王之膳羞共飴鹽幂人宫人中士四人下士八掌六寢之修六寢者路寢一小寢五掌舍下士四人掌王會同之舍設梐枑再重行馬設車宫轅門為壇壝宫棘門為帷宫設旌門無宫則共人門幕人下士一人掌帷幕幄帟綬掌次下士四人掌王次之法以待張事王大旅上帝張氈案設皇邸朝日祀上帝合諸侯師田諸侯朝覲會同張大次小次設重帟重案祭祀張旅幕射張耦次次舍帷幄其事雖微君尊所臨其體實重帷聘禮管人布幕於寢門外注管猶館也掌次舍幕者大府下大夫二人上士四下士八為王治藏之長若今司農周制天下之財用皆制于大宰而總於大府大宰提其綱大府總其目而羣有司共命於其下大小有紀本末有序司農豈大府比哉漢司農猶外府也少府猶玉府內府計相猶司會之任玉府上士二人中士四所寶惟賢時庸展親不作無益不貴異物明君貴五榖而賤金玉以不貪為寶內府中士二人主良貨賄藏在內者與玉府職聫而用異太府注受藏之府若內府外府中士二人主泉藏在外者並魯有府人鄭有府人庫人見九府司會中大夫二人下大夫四上士八中士十六主天下之大計計官之長若今尚書掌六典八法八則之二以逆邦國都鄙官府之治以九貢之法致邦國之財用以九賦令田野以九功令民職以九式均節邦用以參互考日成謂司書之要二職內之入職歲之出月要考月成歲會考歲成司書財用必考于司會鉤職歲以式法贊逆會注助司會考羣吏之計會大司冦盟書司會受其二質小司冦司民獻民數司二之王制司會以歲成於天子司會非大府之屬乃諸府所以聽其會者也冡宰受歲會小宰司會以中大夫逆其治而司會兼舉天下之財計其權重矣會冡宰道揆之任司法守之任司書上士二人中士四主計會之簿書掌六典八法八則九職九正職貢九事九式邦中之版土地之圖以周知入出百物以敘財受幣使入於職幣凡上之用財用必考于司會三歲大計羣吏之治事成則入要二凡邦治考焉司書雖卑以其贊大宰故亦謂之大計書契蓋取諸夬職內上士二人中士四主入也若今泉所入謂之少內注鈎考太府之所入見九府太府受用之府若職內職歲上士四人中士八人主歲計掌邦之賦出以二官府都鄙之財出賜之數待會計而考之如職內書其二令而編存之凡官府都鄙羣吏之出財用受式法于職歲上之賜豫以敘與職幣授之以式法贊逆會二官一入一出皆書其二共相鉤考職幣上士二人中士四主餘幣給諸官之用見九府泉府注入餘於職幣司裘中士二人下士四為大裘共祀天中秋獻良裘季秋獻功裘王大射則共虎熊豹侯設鵠掌皮下士四人秋斂皮冬斂革春獻之內宰下大夫二人上士四中士八注宫中官之長嬪內宰一職與天子之宰並列於內外御貴近之列閽寺灑掃之役服飾織紝之工莫不屬焉而統之於大宰以大臣兼統內治正文王治內之家法也二南之化實本於此後明於內然齊於外掌書版圖之法治王內之政令分人民以居之均宿衛以陰禮教六宫九嬪以婦職之法教九御正其服禁竒袤后祼獻則贊佐后立市中春詔后帥外內命婦始蠶于北郊以為祭服上春詔王后帥六宫之人生穜稑之種獻于王月令仲冬命奄尹申宫令注內宰內小臣奄上士四人奄位極于上士掌王后之命正服位九嬪而下所以為齊家之端閽人掌守王宫之禁寺人內豎九嬪世婦女御女祝女史八人掌王后之禮職內治之二書內令古者后夫人必有女史彤管之法張茂先女史針典婦功典絲下士二人掌絲入祭祀共黼畫組就之物飾邦器受文織絲組典枲內司服奄一人掌王后六服縫人染人下士二人春暴練夏纁玄秋染夏冬獻功詩葛覃躬儉節用服浣濯之衣反家人之義歸於身追師下士二人追治玉石之多掌王后之首服為副編次追衡笄司農云追冠名士冠禮記曰毋追夏后氏之道也追師掌冠冕之官後鄭不從屨人夏采周司徒十二教地官大司徒卿一人注教所以親百姓訓五品有虞氏五而周十有二掌土地之圖人民之數佐王安擾邦國以土會之法辨五地之物生以土地計會所出貢稅之法因五物者民之常施十二教曰以祀禮教敬則民不茍祭祀之禮追養致孝示民以敬以陽禮教讓則民不爭鄉射飲酒之禮敬老齒讓導民以順以陰禮教親則民不怨婚姻之禮及時則無怨曠以樂禮教和則民不乖樂亦云禮者謂饗燕作樂之時周旋合禮節也樂和民心之飲射作樂禮以儀辨等則民不越以卑事尊之儀隆殺有等而民志定以俗教安則民不愈安於本俗人倫自厚土地所生習也以刑教中則民不暴如鄉之八刑弼教而歸於中以誓教恤則民不怠如軍旅之誓使之憂患相救以度教節則民知足宫室車服之制各有等殺以節其欲以世事教能則民不失職士農工商之事少而習焉不易其業以賢制爵則民慎德以庸制祿則民興功以賢制爵則未賢者莫不慎於德以庸制祿則未有功者莫不興於功二者聖人奔走天下之權人心激勸係焉故不言教而列於十二教之後疏周官司徒敷五典則周亦有五教以土宜之法辨十有二土壤之名物注分野十二邦上繫十二次各有所冝也也壤亦土變言耳以土均之法辨五物九等五地之內分為九等之地騂剛赤緹之屬以土圭之法正日景以荒政十有二聚萬民曰散利薄征緩刑弛力舍禁去幾眚禮殺哀蕃樂多昏索鬼神除盜賊以保息六養萬民曰慈幼養老振窮恤貧寬疾安富以本俗六安萬民曰媺宫室族墳墓聯兄弟聯師儒聯朋友同衣服以俗教安頒職事十有二于邦國都鄙使以登萬民見貢賦類頒疏稼穡至斂財即大宰九職中八者司徒職事不可使民轉移執事故闕之唯有八也生材已下四事是民之事業學問故别增之以鄉三物教萬民賔興之曰六德六行六藝以鄉八刑糾萬民以五禮六樂教中和古者以道生財以儒術富國故大司徒教職而貢賦屬焉王制司徒修六禮明七教齊八政穆王命君牙為大司徒敷五典和民則歲終令教官正治致事洪範八政五曰司徒書注芮伯司徒協虢公曰司徒咸戒公卿百吏庶民注仲山甫曰司徒旅書薄違農父傳陶叔授民司徒周秋官曰司徒具徒公畨維司徒周舜命契作司徒敬敷五教在寬鄭武父子並為司徒善於其職使司徒禁掠欒氏者地六鄉以教為教六遂以耕為教使斯民生厚而分定官所教豈若後世誦習傳授者為哉稼思王度於祈招知穡於無逸小司徒中大夫二人建邦之教法稽九比之數會卒伍均土地井牧田野民得其所而后教可行周教官之屬鄉師下大夫四人上士八中士十六旅下士三十有二師長也司徒掌六鄉鄉師分而治之二人者分三鄉之事相左右也各掌其所治鄉之教而聽其治以國比之法稽夫家衆寡小司徒比其九職故曰九比鄉師即九比而行以國法故曰國比受州里之役要歲終考六鄉之治以詔廢置正歲稽鄉器鄉老二鄉則公一人老尊稱也王置六卿則公有三人也三公內與王論道中參六官之事外與六鄉之教司農云百里內為六鄉外為六遂在朝稱公在鄉稱老儀禮運三公在朝三老在學老王制耆老皆朝于庠禮注古老年七十而致仕於鄉里大夫名曰父師士名曰少師鄉大夫每鄉卿一人疏卿六人各主一鄉之事總屬司徒非六官兼鄉大夫鄭注大司馬云軍吏選於六官六鄉之吏為之既六官六鄉並言故知别置各掌其鄉政教禁令正月之吉受教法于司徒頒于鄉吏考德行察道藝三年大比興賢能鄉老及鄉大夫帥其吏以禮禮賔之獻賢能之書登天府內史二之以鄉射之禮五物詢衆庶曰和曰容曰主皮和容興舞歲終令六鄉之吏會政正歲令羣吏考法于司徒疏孔子為鄉大夫射於矍相之圃儀禮鄉飲酒注主人謂諸侯之鄉大夫也五宋有四鄉正注鄉大夫五州為鄉萬二千百家州長每州中大夫一人二千五百家為州各掌其州之教治政令之法正月之吉屬民讀法考德行道藝春秋以禮會民射于州序正歲讀教法三年大比大考州里以贊鄉大夫廢興內則州史州伯注閭胥州長皆有屬吏凡自州長至比長六鄉之官也六鄉授田之民七萬五千家而為下士者一萬五千人為中士者三千人為上士者七百五十人至於大夫亦一百八十人凡萬八千九百三十人詳州長詳於教而略於政黨正於政而略於教黨正每黨下大夫一人五百家為黨各掌政令教治四時孟月吉日屬民讀邦法飲酒于序正齒位正歲讀法書德行道藝以歲時涖校比族師之校登夫家衆寡所謂校也閭胥既比則讀法所謂比也黨正於歲之四時皆涖之族師每族上士一人百家為族各掌戒令政事月吉讀法書孝弟睦姻有學者校登夫家衆寡五家為比十家為聯伍人為伍十人為聯四閭為族八閭為聯使相保相受族師詳於政之成周寓兵於農之制散見於地官之職大司徒六鄉數則始於五家之比小司徒六軍之數則始於五人之伍而二比二五相聯之法見於族師在鄉為族師以八閭之聯而帥二族之民在軍為卒長以八兩之聯而統二率之衆以是推之自四閭之族以至為黨州鄉之聯自四兩之卒以至為旅師軍之聯皆是法也閭胥每閭中士一人二十五家為閭胥有才智之稱各掌其徴令既比讀法書敬敏任恤者內則閭史閭府比長五家下士一人五家為比各掌其治五家相受相和親封人中士四人下士八掌設王社壝為畿封而樹之封國設社稷之壝封其四疆祭祀飾牛牲注畿上有封若今時界鄭楚城沂使封人慮事以授司徒潁考叔為潁谷封人祭仲足為祭封人見宋高哀為蕭封人氏論語儀封人荀子繒丘封人楚相孫叔敖吕春秋封人子高漢莊子堯有華封人民畢命申畫郊圻謹固封守江詩于疆于理域不以封疆之界疆以周索戎索職典封疆鼓人中士六人教六鼓四金之音聲以節聲樂和軍旅正田役軍旅夜鼓鼜韓詩章句曰應門擊柝鼓人上堂舞師下士二人教兵帗羽皇舞凡野舞皆教之樂師教國子舞師教六鄉六遂之民牧人下士六人養牲於野田者馬夷隸役牧人養牛掌牧六牲牛馬羊豕犬雞阜蕃其物共祭祀之牲牷陽祀用騂隂祀用黝望祀各以方色祭祀共犧牲授充人繫之殷有牧師夏少康為仍牧正乃仲山父曰牧協職注牧人也其詩無羊宣王考牧牧人夢爾牧來思何簔何笠或負餱三十維物爾牲則具以列子周宣王牧正見後奉牲告民力普存牛人中士二人下士四人養國之公牛祭祀共享牛求牛以授職人而芻之注職讀為樴樴謂之杙可以繫牛樴人者謂牧人充人與蕃肆師展犧牲頒于職人注謂充人孔子為司職吏蓄息充人下士二人掌繫祭祀牲牷展牲則告牷碩牲則贊載師上士二人中士四載事也事民而稅之官載師者閭師縣師遺人均人之長自載師而下則賦役政令之事使經常有制民不易業掌任土之法以物地事授地職有事斯有職任有九等所任王土方氏授任地者注載師之屬禹土作貢文以庶邦惟正之供時使簿斂閭師中士二人主征六鄉賦貢之稅者凡其賦貢入大府榖入倉人掌國中四郊人民六畜之數以任其力以時征其賦任農以耕事至任虞以澤事見貢賦類以太宰任之以其職閭師任之以其貢虞衡為後山澤之利與民共之縣師上士二人中士四司農云四百里曰縣以至邦國縣居中焉自六鄉王制言天子之縣釋者以為夏天子所居州界之名曰縣師存古也掌邦國都鄙稍甸郊里之地域辨夫家人民田萊之數三年大比考羣吏詔廢置軍旅會同田役之戒受法于司馬以作衆庶稍人曰若有會同師田行役之事以縣師之法作其同徒輂輦帥而以至治其政令聽于司馬凡造都邑量地辨物制域秋官方士以時修其縣法歲終省之注縣師之職也晉有絳縣師遺人中士二人下士四人掌邦之委積以待施惠鄉里以恤民之囏厄門關以養老孤郊里以待賔客野鄙以待羈旅縣都以待凶荒委積者廩人倉人計九穀之數足國用以其餘共之賔客會同師旅掌道路之委積國語周制有之曰立鄙食以守路國野之道廬有飲食路室有委候館有積公劉詩于時廬旅分人以財謂之惠均人中士二人下士四人掌均地政地守地職人民牛馬車輦之力政均力政以歲上下豐年用三日中年二日無年一日三年大比則大均師氏中大夫一人上士二人師教人以道之稱司諌司救官之長保氏詩楀維師氏牧雲漢詩趣馬師氏注年穀不登則師氏弛其兵書誓亞旅師氏顧命師氏虎臣文王世子大司成論説在東序父師司成注司徒之屬師氏也九兩師以賢得民注諸侯師氏掌以媺詔王以三德教國子曰至德以為道本敏德以為行本孝德以知逆惡教三行曰孝行以親父母友行以尊賢良順行以事師長居虎門之左司王朝路寢門也掌國中失之事以教國子弟國之貴遊子弟學焉王舉則從使其屬帥四夷之隸各以兵服守王之門外且蹕師氏守王之中門次舍在王宫參之牧誓顧命節南山諸文最為親近蓋與國子同處王宫因教之鄭謂周召所歷之官而禮記注乃謂即大司成兩注自不合氏秉義守正正君之邪師氏優遊容與養君之善保以引以翼有孝有德主善為師言養成君德於燕間之際得后妃之貴亦立師傅葛覃歸必告師氏宣王欲國子能訓導諸侯者樊穆仲曰魯侯孝命羣公子亦入成均自國子為諸侯保氐下大夫一人中士二人以道安人者也書敘周公為師召公為保相成王為左右聖賢兼此官也疏世為師保之官賜之以氏曰師氏保氏保九兩儒以道得民注諸侯氏掌諌王惡養國子以道教六藝五禮六樂五射五御六書九數六儀祭祀賔客朝廷喪紀軍旅車馬之容藝成而下有德成而上之理儀著於外有行積於中之理王舉則從使其屬守王闈旁出之門司其出入以觀王者治內之政蔡雍曰周官有門闈之學師氏居東門南門保氏居西門北門司諌中士二人以道正人行糾萬民之德而勸之朋友正其行而強之道藝以時書德行道藝考鄉里之治以詔廢置行赦宥先王不鄙夷其民而待以君子長者之道其齊東郭牙進諫必忠立為大諫之官繩愆糾謬格非心不諫亦入司救中士二人掌萬民之邪惡過失而誅讓之以禮防禁而救之調人下士二人司萬民之難而諧和之媒氏下士二人掌萬民之判摽梅男女及時夭桃昏姻以時司市下大夫二人上士四中士八下士十六市官之長掌市之治教政刑量度禁令以八者總市之政又以次敘陳肆至泉府九者治市之事上旌于思次若今市亭以令市市師涖焉聽大治胥師賈師涖于介次而聽小治市師司市也凡市偽飾之禁在民商賈工者俱十有二吕氏春秋祝融作市遷星經天市二十二星懋有無質人中士二人下士四主平定物賈掌成市之貨賄大市以質小市以劑稽市之書契同其度量一其淳制㕓人中士二人下士四㕓民居區域之稱掌斂市絘布總布質布罰布㕓布入于泉府孟子曰市㕓而不征法而不㕓則天下之商皆悅而願藏於其市矣皮角筋骨入玉府珍異滯者入膳府胥師領羣胥二十肆則一人皆二史掌其次之政令平貨賄憲刑禁察詐偽飾行儥慝賈師定物賈二十肆則一人掌其次之貨賄之治展成奠賈宋鄭衛有褚師注市官以魯臧會為郈賈正注若市吏王制命市納賈觀民好惡注典市者亡者使有利者使阜害者使亡靡者使微司暴十肆則一人憲市之禁令禁鬬嚻暴亂陵犯司稽五肆則一人稽察也察犯禁者注察留連不時去者胥二肆則一人掌所治之政肆長每肆一人斂總布掌戒禁注自胥師以及司稽皆司市所自辟除胥及肆長市中給繇役者神農日中為市致民聚貨交易而退取諸噬嗑文王治岐關市譏而不征泉府上士四人中士八下士十六見九府施易稱裒多益寡稱物平書云楙遷有無司門下大夫二人上士四中士八下士十六若今城門校尉主王城十二門掌授管鍵以啓閉國門幾出入不物者正其貨賄重門擊柝蓋取諸豫尹周秩官有門尹宋有門鄭北門之管司關上士二人中士四界上之門掌國貨之節以聯門市注自外來者案其節書其貨通之國門國門通之司市自內出者司市為之璽節通之國門國門通之關門司貨賄出入者掌治禁征㕓國凶札則無關門之征猶幾孟子曰關幾而不征則天下之旅皆悅而願出於其塗四方之賔客叩關則為之告注叩關猶謁關人也鄭司農説以國語曰周之秩官有之曰敵國賔至關尹以告行理以節逆之古之為關將以禦暴尹喜為關令聘禮及竟張􅎶誓乃謁關人注竟上為關以譏異服識異言掌節上士二人中士四守邦節而辨其用以輔王命見符節遂人中大夫二人注主六遂若司徒之於六鄉也六遂之地自逺郊以達于畿中有公邑家邑小都大都司農云遂謂王國百里外疏六鄉為正六遂為副六易氏曰王畿千里之間其百里為六鄉其二百里為遂鄉在內而主教君子之事也建官皆升遂之一等遂在外而主耕野人之事也建官皆降鄉之一等然鄉豈不耕遂豈不教亦互見而已以土地之圖經田野造縣鄙形體之法五家為鄰五鄰為里四里為酇五酇為鄙五鄙為縣五縣為遂皆有地域稽人民授田野簡兵器教稼穡鄭司農云遂之軍法追胥起徒役如六鄉凡治野以下劑致氓家取二人田里安氓樂昏擾氓土宜教氓稼穡興鋤利氓時器勸氓強豫任氓土均平政辨上中下地以頒田里登夫家衆寡以頒職作事令貢賦令師田起政役若起野役則帥民而至以遂之大旗致之魯宋有遂正遂魯人三郊三遂師下大夫四人上士八中士十六旅下士三十二各掌其遂政令戒禁以時登夫家衆寡經牧其田野辨其可食者周知其數而任之入野職野賦于玉府疏如鄉師主六鄉亦二人共主三遂軍旅田獵平野民正其行列部伍遂大夫每遂中大夫一人各掌其遂政令稽夫家田野以教稼穡稽功事正嵗簡稼器修稼政三歲大比帥其吏而興氓舉民賢能如六鄉之為也耘小雅攸介攸止蒸我髦士求髦士于或或耔之間非興氓乎耕謂之氓者以為主明其有功屬其地治者縣正每縣下大夫一人一遂有五縣各掌其縣之政令以頒田里分職事掌治訟趣稼事六遂有縣正實六鄉州長之職鄙師每鄙上士一人五鄙為縣五百家為鄙各掌其鄙政令祭祀以時數其衆庶察媺惡而誅賞酇長每酇中士一人鄉之族師也各掌政令以時校登夫家比其衆寡歲時簡器與有司數之趨耕耨稽女功里宰每里下士一人所掌同六鄉之閭胥掌比其邑之衆寡以歲時合耦于鋤里宰治處若今街彈之室事月令季冬命農師計耦耕以治稼穡趨耕耨周秩官曰司里授館皆夏時警曰期于司里魯陳宋有司里鄰長五家則一人掌相糾相受邑中之政相贊比長以下士鄰長以民其職則一旅師中士四人下士八主斂縣師所徴野之賦榖新氓以旅名掌聚野之鋤粟屋粟間粟而用之遂人興鋤載師罰不耕甸地間田所出之粟為補助之用以質劑致民平頒其興積施惠散利均其政令凡用粟春頒而秋斂之新氓之治皆聽之使無征役以地之媺惡為等稍人下士四人主為縣師令都鄙丘甸之政距王城三百里曰稍掌令丘乘之政令四丘為甸軍制之始也甸為井六十有四委人中士四人下士四掌斂野之賦薪芻疏材木材以稍聚待賔客甸聚待羈旅多曰積少曰委軍旅之賔客館焉魯委吏土均上士二人中士四下士八遂人以土均平政掌平土地之政以均地守地事地貢即以閭師任民之職而均之以和邦國都鄙之政令刑禁施舍禮俗喪紀祭祀皆以地媺惡為輕重之法草人下士四人掌土化之法以物地相宜為之種化之使美若汜勝之術稻人上士二人中士四下士八掌稼下地稻獨宜於荆揚蓋厥土塗泥乃沮洳下濕之地此稻人所以掌稼下地以豬蓄水防止水溝蕩水遂均水列舍水澮寫水以涉揚其芟作田澤草所生種之芒種稻麥也逸七月言農桑之候無知稼穡之難土訓中士二人下士四能訓説土地善惡之勢掌道地圖以詔地事道地慝以辨地物原其生以詔地求王巡守則夾王車風行地上觀以省方觀民設教誦訓中士二人下士四能訓説四方所誦習掌道方志以詔觀事道方慝以詔辟忌知地俗王巡守則夾王車二官為王巡守設也侯地圖掌於司徒方志掌於外史云一遊一豫為諸度衛武公倚几有誦訓之諫山虞每大山中士四人下士八人中山下士六人小山下士二人虞度也度知山之大小掌山林之政令為之守禁大田獵萊野弊田植虞旗於中致禽而珥焉大司馬大閲虞人萊野周虞人之針曰獸臣司原守周秩官曰虞人入材與齊虞人守官山林之木衡鹿之山林藪澤之利民共騶虞傳曰虞人翼五豝以待公之發林衡每大林麓下士十二人中如中山之虞小如小山之虞衡平也平林麓之大小掌林麓之禁令而平其守斬木材則受法於山虞掌其政令王制曰古者林麓川澤以時入而不禁川衡每大川下士十二人中川下士六人小川下士二人川流水也掌川澤之禁令而平其守祭祀賔客共川奠齊澤立三虞山立三衡澤虞每大澤大藪中士四人下士八人中如中川之衡小如小川之衡澤水所鍾也水希曰藪掌國澤之政令為之厲禁財物以時入於玉府頒其餘於萬民祭祀賔客共澤物之奠大田獵萊野弊田植虞旌以屬禽月令野虞水虞澤人四監四監主山林川澤之官臧僖伯諌觀魚里革諫夏濫泗淵里革曰水虞獸虞見上兑文王治岐澤梁無禁虞帝省其山柞棫斯拔松柏斯搜田以時仁如騶夏小正虞人入梁迹人中士四人下士八迹知禽獸處掌邦田之地政為厲禁而守之田之地若今苑也田獵者受令焉傳宋景公時迹人來告曰逢澤有介麋注迹禽獸者文王不敢盤于遊田草人中士二人下士四草之言礦也金玉未成器曰礦掌金玉錫石之地為厲禁守之以時取之則物其地圖而授之上以資邦用下以使民棄末厚本角人下士二人征齒角骨物於山澤之農以當邦賦之政令羽人下士二人征羽翮掌葛下士二人徴絺綌之材掌染草掌炭掌茶掌蜃囿人中士四人下士八掌囿遊之獸禁文王靈囿與民偕樂囿方七十里場人每場下士一人任圃以植事民之場圃也以場圃任園地國之場圃也築地為墠季秋除圃中為之掌國之場圃植果蓏珍異之物仲山父曰場協入場疏春夏為圃秋冬為廩人下大夫二人上士四中士八下士十六舍人倉人司祿官之長掌九穀之數以待國之分頒賙賜稍食分頒謂委人之職諸委積也以歲之上下數邦用以知足否詔穀用凡萬民之食人四釜上也三釜中也二釜下也食不能二釜則令邦移民就榖詔王殺邦用蓄積多備先具大祭祀共接盛周語廩協出注廩人周秩官曰廩人獻餼陳三年耕必有一年之食我民以食為天我取其食我農人我倉既盈庾維億舍人上士二人中士四主平宫中用榖掌平宫中之政分其財守以法掌其出入祭祀共簠簋賔客共車米筥米芻禾以歲時縣穜稑之種以共王后之春獻種掌米粟之出入辨其物九穀六米别為書稍宫正於月終則會稍食內宰於歲終則會食舍人歲終會計其政倉人中士四人下士八掌粟入之藏辨九穀之物以待邦用公劉乃積乃倉司祿中士四人下士八主班祿闕天府祭天之司民司祿鄭氏謂司祿為文昌第六星祿穀也掌天下之穀數文王治岐仕者世祿武王克商庶士倍祿忠司士以功詔祿信重祿以勸士司稼下士八人掌巡邦野之稼辨穜稑之種巡野觀稼以年之上下出斂法均萬民之食賙其急平其興此徹法也稼稷躬稼有天下先知穡之囏難舂人奄二人共米物齍盛牢禮之米􅐪人奄二人主炊官也凡祭祀共盛共王及后之六食共簠簋之實易之損曰二簋可用享稿人奄八人共外內朝冗食者之食周宗伯大唐虞三代宗官官宗少宗陽周宗官五官春官大宗伯卿一人鄭司農云宗伯主禮之官堯典曰咨伯作秩宗宗官又主鬼神故國語曰使名姓之後能知四時之生犧牲之物玉帛之類采服之宜彛器之量次主之度屏攝之位壇場之所上下之神祇氏姓之所出而率舊典者為之宗春秋禘大廟而傳曰夏父弗忌為宗人又曰使宗人釁夏獻其禮郊特牲曰宗人升自西階視壺濯及豆籩然則唐虞歷三代以宗官典國之禮與其祭祀漢之大常是也建邦天神人鬼地示之禮以佐王建保邦吉禮事鬼神示其别十有二凶禮哀邦國之憂其别五賔禮親邦國其别八軍禮同邦國其别五嘉禮親萬民其别六十曲禮五其别三有六以九儀之命正邦國之位典命於諸侯謂之五儀於諸臣謂之五等之命分而言之也典命所言自尊及卑大宗伯所言由小及大以玉作六瑞以等邦國舜典言五瑞大宗伯兼王而言以禽作六摰以等諸臣孤執皮帛卿執羔大夫執鴈士執雉庶人執鶩工商執雞定八年公會晉師于瓦范獻子執羔趙簡子中行文子執鴈以玉作六器以禮天地四方牲幣放其器之色以禮樂合天地之化百物之産禮樂之用舜分命二臣以明事之重周兼總于宗伯以見理之同詔相王之大禮書注彤伯宗伯虞書大宗上宗孔氏曰即大宗伯曰秩宗殷曰大宗春曲禮天官六大曰大宗注此殷制周曰宗伯宗伯為官大史以下屬焉周書嘗麥解命大宗序天時少宗祠風雨百享周語史帥陽官以命司事注春官也樂伶州鳩曰聲不和平非宗官之所司也注宗官宗伯官屬焉也文王世子宗人授事以爵以官注宗人掌禮及宗廟宗人者諸侯掌禮之官也天子則曰大宗伯小宗伯中大夫二人掌建國之神位五禮之禁令辨廟祧之昭穆掌三族之别以辨親疏其正室皆謂之門子毛六牲辨名物而頒之于五官使共奉之司徒主牛宗伯主雞司馬主馬及羊司寇主犬司空主豕辨六齍六穀黍稷稻粱麥苽六彛六尊之名物掌衣服車旗宫室之賞賜四時祭祀之序事與其禮詔相祭祀之小禮凡大禮佐大宗伯上天下澤履辨上下定民志周禮官之屬肆師下大夫四人上士八中士十六旅下士三十二佐宗伯陳列祭祀位及牲器粢盛掌立國祀之禮以佐大宗伯立大祀用玉帛牲牷立次祀用牲幣立小祀用牲以歲時序其祭禮及祈珥嘗之日涖卜來歲之芟獮之日卜戒社之日卜稼鬱人下士二人掌祼器謂彛及舟與瓚祭祀賔客之祼事和鬱鬯以實彛而陳之詔祼將之儀節祼者求神之始周語虢文公曰鬱人薦鬯稷王祼鬯饗醴不鬱鬯用於宗廟秬鬯用於天地社等觀盥而薦有孚顒若鬯人下士二人掌共秬鬯而飾之成王錫周公二卣宣王錫召虎平王錫晉文侯一卣雞人下士一人共雞牲大祭祀夜呼旦以嘂百官國事為期則告之時象雞知時正庭燎注王有雞人之官王不其官而問夜早晚盈巾車大祭祀鳴鈴以應雞人佩詩雞既鳴矣朝既矣昧旦丕顯後世猶怠玉晏鳴關雎嘆之司尊彛下士二人掌六尊六彛之位詔酌辨用實周語犧人薦醴注云司尊也司几筵下士二人掌五几五席之名物辨其用位天府上士一人中士二府物所藏言天者尊此所藏若天物然見九府登登賢能之書而教得其中登民穀之數而政得其中計獄弊訟而刑得其中治中之書天府受而藏之以詔王察吏治則吏道益謹民心益固然後可永保天命而玉鎮大寶器可守矣典瑞中士二人瑞節信也若今符璽郎掌玉瑞玉器之藏辨其名物用事設其服飾人執以見曰瑞禮神曰器典命中士二人命謂主遷秩羣臣之書見禮制見疏簡䇿之命錫爵命屬陽故於春之宣王能命諸侯司服中士二人掌王之衣服辨名物與用事月令仲秋命司服具飾衣裳文繡有恆天命有德五服五章哉服致美黻冕惟衣裳在笥康觀古人之象絳禹惡衣文王卑服即功田功晉人為君復陶注主衣服之官垂衣裳取諸乾坤書立政綴衣注掌衣服齊明盛服所以修身也典祀中士二人下士四掌外祀所祀於四郊者帥屬修除守其厲禁而蹕之守祧世婦內宗凡內女之有爵者掌宗廟之祭祀薦加豆籩外宗凡外女之有爵者掌宗廟祭祀佐王后薦玉豆視豆籩冡人墓大夫職喪大司樂中大夫二人樂官之長皆自大司樂至司干凡二十職列於禮官之次樂之為用以輔成禮也掌成均之法治建國之學政合國子弟有道德者使教焉成者成其行之虧均者均其習之偏舜命夔典樂教胄子以樂德樂之本中和祗庸孝友樂語樂之用興道諷誦言語樂舞雲門大卷咸㲈夏濩武教國子以六律六同五聲八音六舞大合樂以致鬼神示禁淫聲過聲慢聲文王世子樂正司業祭養老乞言合語之禮皆小樂正詔之於東序大樂正學舞干戚語説命乞言皆大樂正授數王制樂正崇四術立四教順先王詩書禮樂以造士入學以齒將出學小胥大胥小樂正簡不帥教者告于大樂正注大樂正于周宗伯之屬告大樂正論造士之秀者升司馬曰進士州燕禮大師于樂正曰正歌備景王鑄無射問伶鳩注司樂官鍾成伶人告和注樂人也仲晉趙宣子召軍吏戒樂正楚鍾建為樂尹月令春命樂正入學習樂出正聲感人順氣應之雷地奮豫以作樂崇德樂師下大夫四人上士八下士十六掌國學之政教國子小舞帗羽皇旄干人教樂儀行以肆夏趨以采齊帥學士而歌徹學士國子也凡樂官掌其政令聽其治訟周語瞽帥音官辨大胥比樂官樂記樂師乎聲詩故北面而弦諸月令季冬命樂師大合吹樂文王世子疏侯謂之小樂正天子謂之師大胥中士四人文王世子小樂正學干大胥贊之胥鼓南胥才知之稱掌學士之版籍也以待致諸子春入學舍采合舞秋頒學合聲以六樂之會正舞位比樂官展樂器小胥下士八人掌學士之徴令正樂縣之位王宫縣諸侯軒大夫判士特大師下大夫二人掌六律六同合隂陽之聲文以五聲播以八音教六詩以六德為本六律為音工以納言大射帥瞽歌射節大師執同律聽軍聲詔吉凶王制命大師陳詩以觀民風國語正考父校商名頌於周大師人孔子語魯大師樂之大師摯孔氏曰魯樂衛武公有師工誦小師上士四人教鼓鼗柷敔塤簫管弦歌掌六樂聲音之節與其和周語曰師針瞍賦矇誦注師小師也瞽矇上瞽四十人中百人下百六十人掌播鼗柷敔塤簫管弦歌諷誦詩世奠繫鼓琴瑟掌九德六詩之歌以役大師衛武公矇不失誦作懿戒以自警視瞭三百人掌樂事典同中士二人同陰律也掌六律六同之和辨天地四方陰陽之聲以為樂器以十有二律為數度十有二聲為齊量磬師中士四人下士八教擊磬編鍾鍾師中士四人下士八掌金奏以鍾鼓奏九夏笙師中士二人下士四教吹竽笙塤籥簫箎笛管春牘應雅以教裓樂鎛師中士二人下士四掌金奏之鼓韎師下士二人韎東夷之樂舞者十有六人教韎樂祭祀大饗帥屬而舞旄人下士四人教舞散樂夷樂籥師中士四人文王世子籥師學戈籥師丞贊之教國子舞羽吹籥籥章中士二人下士四吹籥以為詩章掌土鼓豳籥吹豳詩雅頌言王業之所始鞮鞻氏下士四人掌四夷之樂與聲歌鞮鞻四夷舞者所屝也典庸器下士四人庸器有功者鑄器銘功掌藏樂器庸器庸器伐國所獲之器祭祀陳庸器司干下士二人干舞者所持盾也掌舞器舞干羽有苗格世總干山立善詩序泠官鄭玄云樂官也泠氏掌樂官而焉黃帝泠倫魯周景王泠州鳩左泠人告和語泠簫詠歌傳楚泠人大卜下大夫二人卜筮官之長掌三兆三易三夢之法作龜之八命舜官占蔽志洪範稽疑所用殷六大曰大卜周周公卜洛祭義注易官名禮曰大卜筮襲於夢武王禮運王前巫後史卜筮瞽侑皆在左右王中心無為以守至正梁龜筮協從卜不習吉卜以官氏魯齮楚丘晉偃秦徒父招父卜又見後正卜師上士四人掌開龜之四兆視高致墨卜人中士八人下士十人龜人中士二人掌六龜之屬菙氏下士二人燋焌用荆菙之類共燋契占人下士八人掌占龜以八簭占八頌以八卦占簭之八故以視吉凶簭人中士二人問蓍曰筮其占易掌三易辨九簭之名國之大事先簭後卜洪範稽疑擇建立卜筮人三人占從二人之言卜以三龜筮以三易龜有八命筮有九筮于晉筮史之以道制命以德祈天聖人盡已之智而聽人盡人智而聽於神未有能廢其一也占夢中士二人占六夢之吉凶季冬聘王夢獻吉夢於王王拜受之舍萌四方贈惡夢人之精神與天地陰陽流通晝之所為夜之所夢善惡吉凶各以類至先王建官設屬使之觀天地之會辨陰陽之氣以日月星辰占六夢之吉凶其於天人相與之際察之詳敬之至矣宗夢得説文王夢臧文人武王夢帝與九齡高夢協朕卜文宣王乃寢乃興乃占我夢大人占之牧人乃夢公之夢子犯占之簡子之夢問諸史墨視祲中士二人祲陰陽氣相侵漸成祥者魯史梓慎云見赤黑之䘲掌十輝之法日光氣也以觀妖祥辨吉凶見天文類大祝下大夫二人上士四祝官之長掌六祝之辭六祈作六辭辨六號九祭九􅉔執明水火而號祝頒祭號于邦國都鄙六號冠祝雍作頌小祝中士八人下士十六掌小祭祀將事侯禳禱祠之祝號以祈福祥順豐年逆時雨寧風旱彌災兵逺罪疾喪祝甸祝下士二人掌四時之田表貉之祝號禱牲禱馬皆掌祝號詛祝下士二人掌盟詛類造攻説禬禜之祝號作盟詛之載辭周紀尹佚䇲祝德祝史不祈祀正辭薦信明恤祀望不祈其福司巫中士二人巫官之長掌羣巫之政令大旱帥巫舞雩男巫女巫大史下大夫二人上士四人史官之長掌建邦之六典以逆邦國之治法以逆官府則以逆都鄙之治注大史日官也傳曰天子有日官諸侯有日御日官居卿以底日日御不失日以授百官於朝言建六典以處六卿之職疏五帝之時使卿掌厯數至周使下大夫為之正歲年以序事頒于官府都鄙頒告朔于邦國大祭祀讀禮書而協事大史下大夫而所掌實卿之職所掌與大宰略同六大曰大史周辛甲為大史立政大史尹伯殷周公若曰大史筆酒誥大史友典楚子問赤雲於周大史曲禮史載王制大史禮執簡記奉諱惡簡記䇿書也周射人與大史數射中司大賔客戒大史及大夫介語大史順時𤫽土馬氏世典周史佚籕周大史公曰豫先周室之大史也之漢志有史六韜鄭注論語曰老𣆀周大史小史中士八人下士十六掌邦國之志奠繫世辨昭穆大祭祀讀禮法注史官主書故韓宣子聘魯觀書大史氏魯工史書世馮相氏中士二人下士四人馮乘相視也世登高臺以視天文之次序天文屬太史月令曰乃命大史守典奉法司天日月星辰之行宿離不貸疾月令正義周馮相氏主日月五星年氣節候推步遲審知所在之處若今之司厯主其算術也保章守天之文章謂度數失常次妖孽所在吉凶所在若今天文家惟主變異也保章志星辰日月之變馮相會天位之常天象難知此世守其法故名官曰氏馮相氏所掌參之堯典正羲和四子之職掌十二歲月辰十日二十八宿之位辨敘事以會天位冬夏致日春秋致月以辨四時之敘魯語大史司載糾虔天刑注司載謂馮相保章氏保章氏中士二人下士四保守也世守天文之變掌天星步占之法以星為主以志星辰日月之變動以觀天下之遷辨吉凶以星土辨九州之地所封封域皆有分星以觀妖祥以十二歲之相觀天下妖祥以五雲之物辨吉凶水旱降豐荒之祲象以十二風察天地之和命乖别之妖祥凡此五物以詔救政訪序事詔於上則人君知修省之道訪於下則人臣知警戒之意三主文史星厯卜筮之職領於春官皆以大夫士為之巫之屬凡以神仕者亦皆精爽不二齊肅中正之民故夢之於祲也豐荒之於雲也軍聲民氣之於風也若不相關而古人精體熟察視為至近至切之事輔先王克謹天戒臣人克有常憲百官修厥后惟明明治生於敬畏內史中大夫一人下大夫二人上士四中士八下士十六掌王之八枋之法以詔王治大宰詔王內史居中二之與內史以中大夫在燕朝而八枋大宰同不八枋威福雜用且以誅為殺大宰不言法故以殺為尚以論道為主此道揆法守之辨執國法及國令之二以考政事逆會計掌敘事之法受納訪以詔王聽治命諸侯孤卿大夫則䇿命之傳曰王命內史興父䇿命晉侯為侯伯四方之事書內史讀之若今尚書入省事王制祿則贊為之以方出之內史掌書王命遂二之卿大夫獻賢能書小司寇登民數皆內史二之而大司寇登盟書天府大史內史司會及六官受其二藏之傳周內史選福陽族嗣納諸霍人公周內史曰臧孫達有後於魯公國語內史過賜晉惠命大宰文公內史興賜晉文命大宰以王命命冕服內史贊之三命而後即冕服其酒誥內史友史成周有五史皆掌記載䇿書之事以命數考之內尊於大史外史尊於小史御史然五史之中唯大史一官所掌與大宰略同大史雖下大夫而所居實卿之職比其權在史官為甚重宫正注官府在宫中外史上士四人中士八下士十六掌書外令王令下畿外掌四方之志三皇五帝之書達書名於四方若以書使於四方則書其令齊南史晉大史魯楚左史注魯季孫召外史掌惡臣有周語史獻書外史也發號施令罔不臧御史中士八人下士十六其史百二十人以掌贊書人多掌邦國都鄙及萬民之治令以贊冡宰掌贊書注王有命則贊為辭若今尚書作詔文易氏曰內史書王命外史書外令御史贊二官所書隋志云周天子之史有五諸侯國有國史巾車下大夫二人上士四中士八下士十六巾猶衣也車官之長掌公車之政令辨其用與其旗物而等敘之治其出入王之五路王后之五路服車五乘見車類傳保傅篇此巾車之道巾車脂轄大射儀量人巾車張三侯正周秩官曰工人展車宋命工出車典路中士二人下士四人路王之所乘車掌王及后之五路辨名物用説車僕中士二人下士四掌戎路廣闕蘋輕車之萃凡師共革車各以其萃大射共三乏曲禮僕展軨效駕司常中士二人下士四掌九旗物名射共獲旌歲時共更旌都宗人上士二人中士四掌都祭祀之禮正都禮與服家宗人如都宗人之數掌家祭祀之禮掌家禮與其衣服宫室車旗之禁令凡典禮者謂之宗父天子有宗伯諸侯有宗人春秋夏弗忌為宗人都家謂之內諸侯亦有宗人文魯語宗室之謀不過宗人公劉居豳君之宗之王世子宗人授事以官尊賢也焉王會祝史嚚享注宗宗人叔孫氏祝宗虢公使祝應宗區史魯宗人釁夏夏父展都謂王子弟所封及公卿所食邑家謂大夫所食米地凡以神士者無數男巫之俊有學問才智者周司馬夏官大司馬卿一人建邦國之九法以九伐之法正邦國見兵法以九畿之籍施邦國之政職令賦以地與民制之給軍用教振旅茇舍治兵大閲師有功則左執律右秉鉞以先愷樂獻于社大役與慮事屬其植受其要大射合諸侯之六耦夏六卿之命殷五官之建司馬始充厥職至周而司馬實顓牧野之戰書注畢公司馬大書祈父詩祈父注以為司馬馬常武注程伯休父為司馬大明正義太誓云司在前王肅曰司馬太公也周書周官注夏司馬討惡助長物法王制辨論官材秩官陳芻聘禮執䇿注主軍者縣傳祈招正義曰穆王時有祈父名招即司馬官也軍師受法于司馬司兵從司馬之法周司馬主旅之戒命小司馬中大夫二人掌其事如大司馬之法威自道德師由仁義則常德立武事時動動則威觀玩玩則無震耀德不觀兵兵戢而恭儉偋五兵師衆以順為武可武不可弛亦不黷周政官之屬軍司馬下大夫四人晉魏絳曰使臣斯司馬輿司馬上士八人輿衆也輿晉籍偃為司馬行司馬中士十六人旅下士三十二人行謂軍行列晉作六軍有三行凡制軍萬二千五百人為軍王六軍大國三次國二小國一軍軍將皆命卿外傳穆叔云天子作師公帥之以征不德詩曰周公東征四國是皇此上公為軍將韎韐有奭以作六師此諸侯世子為軍將常武箋宣王命卿士為大將命將必本其祖因有世功古茇舍帥以門名注帥謂軍將及師帥旅帥至伍長也者軍將蓋為營治於國門魯有東門襄仲宋有柵門右師皆上卿為軍將者二千有五百人為師師帥皆中大夫五百人為旅旅帥皆下大夫百人為卒卒長皆上士二十五人為兩兩司馬皆中士五人為伍伍皆有長注伍一比兩一閭卒一族旅一黨師一州軍一鄉家所出一人凡軍帥不特置選於六官六鄉之吏自卿以下德任者使兼官注疏位有長是比長下士農治兵軍吏載旗諸軍帥也見寓兵於之制司勳上士二人下士四主功賞疏軍以賞為先故司勳列位在前掌六鄉賞地之法以等其功勳功庸勞力多有功銘大常祭大蒸司勳詔之大功藏其二賞輕重視功頒賞地參之一食參分計稅王食其一二全入於臣唯加田無國正加賜以田馬質中士二人平其大小之賈掌質馬馬量三物戎田駑量人下士二人以丈尺度地疏以軍事為重故列職於此掌建國之法以分國為九州營國城郭后宫量市朝道巷門渠造都邑注若匠人職營軍之壘舍量其市朝州塗軍社之所里邦國之地與天下塗數皆書而藏之凡宰祭與鬱人受斚歷而皆飲之鬱人大祭祀與量人受舉􅕌之卒爵而飲之大射儀司馬命量人量侯道與所設乏車命量人巾張三侯小子羊人下士二人掌羊牲祭祀飾羔賔客共法羊司爟下士二人掌行火之政令四時變國火以救時疾季春出季秋內施火令祭爟五行傳火得其性其福曰夀司爟之行火猶凌人之冰政周秩官火師掌固上士二人下士八國曰固野曰險易曰王公設險以守其固掌修城郭溝池樹渠之固頒其士庶子及其衆庶之守見先王公於守固設其飾器兵甲之屬分財用均稍食任萬民用材器塹築藩落晝三巡夜三鼜以號戒造都邑則治其固與其守法人自為守不以山川之險以以道德為籓不以襲險為屏固國保民為本司險中士二人下士四掌九州之圖周知山林川澤之阻達其道路設國之五溝五塗樹之林以為阻固皆有守禁興實在德險亦難恃洞庭孟門二國不祀掌疆界也中士八人闕大司徒制畿疆載師任疆地候人上士六人下士十二候迎賔客之來者詩曰彼候人兮荷戈與祋各掌其方之道治禁令以設候人注國語候不在竟譏不居其方也以設候人者選士卒以為之疏即徒百二十人傳欒盈過周王使候人出之國語周秩官曰候人為導環人下士六人環猶郤也以勇力郤敵掌致師九簭九曰巫環鄭氏謂筮可致師否得孟子曰環而攻之必有天時者察軍慝環四方之故巡邦國摶諜賊訟敵國揚軍旅降圍邑秋官亦有環人之古者將戰先使勇力士犯敵者月令立秋賞武人於朝注謂環人之屬有勇者慮古守封疆出師旅居則有行人覘國戰則有前茅無挈壺氏下士六人世主挈壺水以為漏掌挈壺以令軍井挈轡以令舍挈畚以令糧軍事縣壺以序聚柝以水火守之分以日夜詩東方未明刺無節也興居無節號令不時挈壺氏不能掌其職注掌漏刻者疏挈者垂繫之名置箭壺內以為節而浮於水上令水漏而刻下射人下大夫二人上士四下士八掌國之三公孤卿大夫之位將射始入見君之位三公北面孤東面卿大夫西面其摯三公執璧孤皮帛卿羔大夫鴈諸侯在朝則皆北面詔相其法以射法治射儀祭祀贊射牲注僕人與射人俱掌王之朝位也大燕禮射人告具射人為司正若射則射正為司射射疏大射正諸侯禮謂之司天子謂之射人服不氏下士一人服不服之獸養猛獸而教擾之貉隸役服不氏養獸射則贊張侯以旌居乏而待獲大射儀司馬命服不負侯射鳥氏羅氏下士一人羅烏鳥蠟則作羅襦仲春獻鳩以養國老行羽物掌畜司士下大夫二人中士六下士十二掌羣臣之版治政令歲登下損益之數周知邦國都家縣鄙之數卿大夫士庶子之數以詔王治以德詔爵以功詔祿以能詔事以久奠食正朝儀之位辨貴賤之等三歲稽士任而進退其爵祿殷五官曰司士有文王世子其朝於公內朝則東面北上臣貴者以齒其在外朝則以官司士為之馬大射儀司士戒士射與贊者疏與大司進賢興功同故列職於此諸子下大夫二人中士四主公卿大夫士之子或曰庶子掌國子之倅掌戒令教治辨等正位燕義曰古者周天子之官有庶子官與諸子職同文疏燕禮有庶子執燭之事文王世子庶子之正於公族者教以孝弟睦友子愛庶子之官治而邦國有倫衆鄉方矣康誥外庶子訓人國有大事帥國子致於太子有兵甲之事則授車甲合卒伍置有司以軍法治之司馬弗正國子屬大子國正弗及凡樂事正舞位授舞器國之政事國子存遊倅使修德學道春合諸學秋合諸射考藝進退之遊倅倅之未仕者倅謂國子為副代父者故書倅為卒司右上士二人下士四有勇力之士充王車右掌羣右之政令戎右齊右道右軍旅會同合車之卒伍而比其乘屬其右國勇力之士能用五兵者屬焉齊右兼玉路之右戎右兼田路之右軍晉荀賔為右司士屬焉使訓勇力之士時使司士右之官荀賔有力而不暴使為戎右虎賁氏下大夫二人中士十二虎士八百人掌先後王趨以卒伍舍則守王間梐枑王在國則守王宫立政文武虎賁綴衣庶常吉士臣王左右綴衣虎賁知恤鮮哉虎臣注虎虎賁氏牧誓虎賁三百人顧命師氏齊侯吕伋為天子虎賁氏虎賁之士脫劍魯語天子有虎賁習武訓也臣樂記如虎之奔漢古今人表龍師古注周虎賁氏也書作虎臣旅賁氏中士二人下士十六掌執戈盾夾王車而趨左八人右八人下士車止則持輪軍旅則介而趨衛武公在輿有旅賁之規門司戈盾授旅賁及虎士戈盾司士虎士在路之右魯語諸侯有旅賁以旅力衛王故名節服氏下士八人世為王節所衣服掌祭祀朝覲衮冕六人維王大常諸侯則四人郊祀裘冕二人執戈送逆尸方相氏大僕下大夫二人掌正王之服位出入王之大命掌諸侯之復逆王視朝則前正位而退入亦如之建路鼓於大寢之門外掌其政以待達窮者與遽令聞鼓聲則速逆御僕與御庶子祭祀賔客正王之服位詔法儀王出入則自左馭而前驅王燕飲則相其法射則贊弓矢王視燕朝則正位掌擯相穆王命伯冏為周大僕正昔在文武侍御僕從罔匪正人命汝作大正正于羣僕侍御之臣僕臣正厥后克正正訓長孔氏以為大御非太僕僕文武左右携僕庶常吉士端而好諌為贊韓厥為僕大夫僕人晉程鄭陪僕􅉏御之臣人主朝夕與居氣體移養常必由之潛消默奪於冥冥之中而明爭顯諌於昭昭之際抑末矣小臣上士四人佐大僕者掌王之小命詔相王之小法儀掌三公及孤卿之復逆正王之燕服位王之燕出入則前驅大僕掌其大小臣掌其小辨內小臣所掌同於大僕內外之也祭僕中士六人視祭祀警戒有司糾百官之戒具御僕下士十二人僕侍御於尊者之名大僕其長也掌羣吏之逆庶民之復掌王之燕令以序守路鼓隸僕下士二人掌五寢之掃除王行洗乘石掌蹕宫中之事冏命慎簡乃僚其惟吉士戎齊道田僕見下辨師下士二人工四人辨古冠之大稱掌王之五冕司甲下大夫二人中士八人闕司甲兵戈盾官之長煆費誓善穀乃甲胄敿乃干備乃弓矢乃戈矛礪乃鋒刃自治戎備之際先衛而後攻人司兵中士四人掌五兵五盾各辨物等以待軍事及授兵從司馬之法以頒之祭祀授舞者兵軍事建車之五兵職金受士之金罰貨罰入于司兵澤上於地萃以除戎器戒不虞司戈盾下士二人掌戈盾之物而頒之授旅賁虎士及舍設藩盾惟干戈省厥躬車攻備器械司弓矢下大夫二人中士八弓弩矢箙官之長掌六弓四弩八矢之法繕人上士二人下士四繕徑善也掌王之用弓弩矢箙矰弋抉拾詔王射贊弓矢之事乘車充籠箙載弓弩疏司弓矢選擇大善者入繕人以共王用稿人中士四人箭幹謂之稿受財於職金以齎其工弓六物為三等弩四物亦如之矢八物皆三等箙亦如之春獻素秋獻成入功于司弓矢及繕人凡齎財出入待會而考之繕人疏案大射禮大射正授弓小臣受矢天子禮繕人授之受之稿人是弓矢官之主戎右中大夫二人上士二右者參乘此充戎路之右田獵亦為右掌戎車之兵革使與君同車在車之右執戈盾備制非常詔贊王鼓傳王命于陳中注戎右兼田右齊右下大夫二人充玉路金路之右前齊車王乘則持馬行則陪乘有牲事則前馬道右上士二人充象路之右前道車持馬陪乘自車上諭命于從車詔王之車儀顧式之屬王式則下前馬王下則以蓋從大馭中大夫二人馭之最尊為玉路不言僕以祀為國之大事玉路王之大路所以易僕為馭掌馭五路以祀行以肆夏趨以采齊以鸞和為節行謂大寢至路門趨謂路門至應門御傳僖二十五襄三十年有御士以以德為車以樂為臨民若馭馬孔安國注書太僕正為大御中大夫疏言正則官高於太僕與君同車最為親近故云無昵憸人戎僕中大夫二人馭戎車革路掌王倅車之政正其服齊僕下大夫二人馭金路以賔道僕上士十二人王以與諸臣行先王之道馭象路以朝夕燕出入掌二車之政令田僕上士十二人馭田路以田以鄙掌佐車之政設驅逆之車令獲者植旌及獻比禽校人臧僕注馭五路之僕馭夫中士二十人下士四十人案校人良二千一百六十匹則六十馭夫駑千二百九十六匹則馭夫三人并前六十三人此序官脫三人馭二車象路之副從車戎田路之副使車驅逆之車分公馬而駕治之乘調六種之馬七月令季秋命僕及七騶注僕戎僕及馭夫也騶謂趣馬主為諸官駕説校人講馭夫等馭夫之祿趣馬辨四時之居治以聽馭夫校人中大夫二人上士四下士十六馬官之長掌王馬之政月令曰班馬政辨六馬之屬種戎齊道田駑魯校人乘馬御宋校正出馬人楚宫廄尹晉乘馬蠻隸役校養馬趣馬下士皂一人趣養馬者馬詩蹶惟趣贊正良馬而齊飲食簡六節注差擇王馬以為六等掌駕説之頒書趣馬小尹左右擕僕庶常吉士雲漢詩趣馬師氏注年穀不登則趣馬不秣巫馬下士二人醫四人養疾馬而乘治之牧師下士四人掌牧地有厲禁而頒之殷有牧師廋人下士間二人掌十二間之政教廋數也以阜馬佚特教駣攻駒正校人員選師圉也選擇可備員者平之圉師乘一人教圉人養馬圉人良馬匹一人駑馬麗一人掌芻牧以役圉師管子曰夷吾嘗為圉人矣傳馬棧最難職方氏中大夫四人下大夫八中士十六主四方之職貢主四方官之長掌天下之圖辨邦國都鄙四夷八蠻七閩九貉五戎六狄之人民財用九穀六畜之數要周知其利害辨九州之國使同貫利辨九服之邦國凡邦國小大相維王設其牧制其職貢以其所能所有書序孔子述職方以除九丘土方氏上士五人下士十主四方邦國之土地掌土圭之法以致日景以土地相宅而建邦國都鄙辨土宜土化之法而授任地者懷方氏中士八人掌來逺方之民致方貢致逺物而送逆之達之以節治委積館舍飲食懷逺以德中庸厚往薄來以懷諸侯周公戒周王責諸侯以禮不以幣合方氏中士八人主合同四方之事掌達天下之道路通財利同數器一度量訓方氏中士四人主教導四方之民掌道四方政事上下之志誦四方之傳道正歲布而訓四方而觀新物形方氏中士四人主制四方邦國之形體掌制邦國之地域正封疆無有華離之地山師中士二人下士四掌山林之名辨其物利害頒于邦國使致珍異之物川師中士二人下士四掌川澤之名虞衡掌畿內此掌畿外邦國邍師中士四人下士八掌四方地名辨丘陵墳衍邍隰之名物之可封邑者匡人撢人中士四人主撢序王意以語天下掌誦王志道國之政事巡天下邦國而語之使萬民和説而正王面上下交而其志同都司馬每都上士二人中士四下士八都王子弟所封及三公采地司馬主其軍賦掌都之士庶子及衆庶車馬兵甲之戒令以國法掌其政學以聽國司馬大司馬之屬家司馬各使其臣以正於公司馬家卿大夫采地公司馬國司馬也賦傳曰叔孫氏之司馬鬷戾叔家臣為司馬主其地之軍季氏以公鉏為馬正孫氏公南為馬正盂氏之御騶司中春振旅兩司馬執鐸公司馬執鐲杜子春云公馬伍之司馬也玄謂伍長雖卑同其號周司冦秋官大司冦卿一人掌建邦之三典以佐王刑邦國刑新國用輕平國用中亂國用重以五刑糾萬民野刑上功糾力六遂之刑軍刑上命糾守鄉刑上德糾孝官刑上能糾職國刑上願糾暴當為恭以兩造禁民訟入束矢於朝然後聽之以兩劑禁民獄入鈞金三日乃致於朝然後聽之以嘉石丈石也平罷民植之外朝民左肺石赤石達窮民書洪範八政六曰司寇茲立政勿誤于庶獄司寇蘇公式敬由獄以長我王國式有慎以列用中罰注忿生為武王司寇殷傳康叔為司寇注康誥敬明乃罰汝陳時臬司師茲罰有倫吕刑吕侯為天子司冦惟克天德自作元命惟良折獄咸中有慶受王嘉師監茲祥刑周秩官司寇詰姦稷戒百姓曰土不備墾辟在司寇於王制成獄辭史以獄辭告於正正聽之正以獄成告大司寇大司寇聽之棘木之下告于王正于周鄉師之屬止書注秋司寇刑姦順時殺制禮刑猶隄之防逸水小司寇中大夫二人掌外朝之政致萬民而詢焉以五刑聽獄訟以五聲求民情辭色氣耳目以八辟麗邦法附刑罰議親故賢能功貴勤賔以三刺斷獄訟之中訊羣臣羣吏萬民歲終令羣士計獄弊訟登中于天府憲刑禁士師之五禁周刑官之屬士師下大夫四人士察也主察訟獄之事者掌國之五禁之法宫官國野軍以五戒先後刑罰誓誥禁糾憲掌士之八成見律令類王燕出入則前驅而辟歲終令正要會定計簿惠論語桞下為士師為陽膚為士師曾子曰如得其情哀矜勿喜言家語季羔衛士師孟子齊蚳蛙請士師為其可以也諫刑罰之不中者子書凖人疏謂士師氏左傳有尉氏注討姦之官晉輿為理以官為士卿士獄訟成士師受中受成也鄉士上士八人中士十六旅下士三十二主六鄉之獄掌國中主國中獄各掌其鄉之民數而糾戒之四人分主三鄉遂士中士十二人主六遂之獄掌四郊主四郊獄掌民數二人分主一遂縣士中士三十二人主縣之獄掌野方士中士十六人主四方都家之獄掌都家以時修其縣法注縣師之職也訝士中士八人迎四方賔客掌四方之獄訟邦有賔客與行人送逆之聚衆庶則讀誓禁朝士中士六人掌建邦外朝之法禁慢朝錯立族談者司民中士六人掌登萬民之數自生齒以上皆書於板三年大比以數詔司寇孟冬祀司民之日獻于王王拜受登天府內史司會冡宰二之仲山父曰司民協孤終七天府祭天之司民考之天文志司民為角其十星之兩角有大民小民天有是星先王以是名官次司農云文昌宫三能屬角也恆與為體近文昌為司命司中次司祿司民軒轅角司官敬刑以敬民也以民惟邦本牧寵綏王司敬民民為天司刑中士二人掌五刑之法鄉士云司寇斷獄弊訟于朝羣士司刑皆在各麗其法以議獄訟司刺下士二人掌三刺三宥三赦之法以贊司寇司約下士二人言語之約束掌邦國及萬民之約劑治神之約為上命祀治民分民治地經界治功賞爵治器禮樂車服治摰玉帛禽鳥之約次之注此六約者諸侯以下至於民皆有之大約劑書宗彛小書丹圖大邦國小萬民司盟下士二人涖牲曰盟掌盟載之法民有約劑其二在司盟曲禮士載言疏謂司盟之士其詛祝作其辭玉府共其器戎右役其事大史藏約荀子曰春秋善胥命詩非屢盟官左傳盟府注司盟之府胥太公為太師兼主司盟之見後春秋謹參盟善命美蕭魚之會職金上士二人下士四見九府司厲犬人司圜掌囚掌戮司隸中士二人下士十二掌五隸之法辨其物掌政令注隸給勞辱之役者漢始置司隸亦使將徒治道溝渠之役後稍尊之使主官府及近郡帥四翟之隸服其邦之服執兵守王宫與野舍之厲禁司寇掌刑士師掌禁自鄉士至司隸言其用刑者也自布憲至銜枚氏言其用禁者也罪隸四翟之隸也蠻隸閩隸夷隸貉隸皆百有二十人布憲中士二人下士四主表刑禁憲邦之刑禁正月之吉執旌節宣布四方禁殺戮禁暴氏野廬氏下士六人廬賔客行道所舍掌達國道路至於四畿有賔客聚柝之有相翔者誅之道路之舟車轚互者敘而行之蠟氏雍氏萍氏下士二人萍無根而浮取其不沈溺掌國之水禁幾酒謹酒司寤氏下士二人主夜覺者掌夜時以星分夜以詔夜士夜禁夜士主行夜徼候者如今都候之屬司烜氏條狼氏下士六人掌執鞭以趨辟王出入則八人夾道修閭氏下士二人比國中宿互柝者冥氏庶氏穴氏翨氏柞氏剃氏硩蔟氏翦氏赤犮氏蟈氏壺涿氏庭氏銜枚氏伊耆氏下士一人伊耆古王者號始為蠟以息老物此主王者之齒杖後王識伊耆氏之舊德而以名官與或謂伊耆即神農氏掌國之大祭祀共杖咸軍旅授有爵者杖共王之齒杖大行人中大夫二人行人之類列於刑官之屬折民惟刑之意掌大賔客之禮儀大賔要服以內諸侯大客謂其孤卿以九儀辨諸侯之命等諸臣之爵小行人下大夫四人掌邦國賓客之禮籍協九儀賔客之禮達天下之六節成六瑞合六幣周秩官曰行理以節逆之注行人也侯韓非子衛君入朝於周周行人問其號賈誼書衛朝周周行人問其名人左傳欒盈辭於行人子員鄭行人子羽齊隰朋為大行逆晉行訝士與行人送賔客司儀上士八人中士十六掌九儀之賔客擯相之禮洪範八政七曰賔行夫下士三十二人掌邦國傳遽之小事其使必以旌節環人中士四人夏官有之掌送逆邦國之通賔客以路節旌節達諸四方舍則授館令聚柝有任器則令環之注令野廬氏也面此與夏官不同此送逆賔客四而環之者也象胥每翟上士一人中士二下士八胥有才智者康成讀為諝通夷狄之言東方曰寄南方曰象西方曰狄鞮北方曰譯今總名曰象者周之德先致南方也掌蠻夷閩貉戎狄之國使掌傳王之言而諭説以和親之以時入賔則協其禮與辭言傳之其出入送逆之禮節幣帛辭令而賔相之軍旅會同受國客幣而賔禮之大行人七歲屬象胥諭言語協辭命注譯官也夷周語使舌人體委與之注象胥之官人明王慎德四咸賔不寶逺物則逺人格難任而率服無怠荒而來王掌客上士二人下士四掌四方賔客牢禮餼獻飲食之等數掌訝中士八人掌迎賔客掌邦國之等籍以待賔客戒官修委積與士逆賔于疆為前驅而入及宿令聚柝及委則致積至于朝詔其位左傳注候送迎賔客之官也使候出諸轘轅掌交中士八人主交通結諸侯之好掌以節幣巡邦國諸侯及萬民所聚者道王之德意志慮使咸知王之好惡辟行之使和諸侯之好達萬民之説掌邦國之通事而結交好以諭九稅之利九禮之親九牧之維九禁之難九戎之威上下交而其志同掌察四方中士八人疏督察邦國之事掌貨賄下士十六人疏掌邦國所致貨賄二官闕朝大夫每國上士二人下士四庶子八此王之士也使主都家之國治而命之朝大夫云疏庶子蓋亦主采地之諸子在府史之下蓋官長所自辟除掌都家之國治曰朝以聽事故以告其君長凡都家之治於國者必因其朝大夫然後聽之都則中士一人下士二庶子四主都家之八則不及家則者九儀之命惟五命然後賜則王之大夫四命未與賜則之數闕都士中士二人下士四家士亦如之主治都家吏民之獄訟以告方士者闕周司空冬官司空篇亡空書立政司徒司馬司空亞旅季宏父注司也書注毛公司空傳𣆀為司空洪周秩官曰司空視塗春虢文公曰司空除壇于藉範八政四曰司空秋正義少皥司空司事各為一官舜司空共工各為一官右危東六星兩兩相比曰司空晉士蒍為大司空行辛為司空司空平易道路性魯定公以孔子為司空立五土之而物各得其所生之宜考工記國有六職百工與居一焉注鄭云此篇司空之官司空篇亡漢興購千金不得此前世識其事者記録以偹大數爾疏冬官一篇其亡已久有人遵集舊典録此三十工以為考工記雖不知其人要在秦前是以邅秦焚滅韋氏裘氏等闕周事官之屬匠師鄉師云云注事官之屬其於司空若鄉師之於司徒也疏司空之考魯匠師慶諌丹楹刻桷月令孟冬命工師效功注工官之長季春命工師令百工審五庫之量注司空之屬官儀禮大射儀工人士梓人度尺而午注工人士與梓人皆司空之屬工人士能正方圓者書正義覲禮云嗇夫承命告於天子鄭玄云嗇夫蓋司空之屬也書曰嗇夫馳孔注嗇夫主幣之官馳取幣禮天神記祭有畀輝胞翟閽者惠下之道也注輝周禮作韗疏韗人考工記注百工司空事官之屬於天地四時之職亦處其一也輪人為輪為蓋輿人為車輈人為輈築氏為削冶氏為殺矢桃氏為劒鳬氏為鍾栗氏為量假氏函人為甲鮑人韗人為臯陶韋氏裘氏畫繢之事鍾氏筐人㡆氏玉人楖人雕人磬氏為磬矢人為矢陶人為甗旊人為簋梓人為筍簴為飲器為侯廬人為廬器匠人建國營國為溝洫車人之事為耒庛為車弓人為弓注其曰某人者以其事名官曰某氏者官有世功馮相保章師保族有世業桃築之類疏言伯者長也言師者可師法也司者專任其事典者出入由己干寶曰言司者揔其領司會之屬言師者訓其徒甸師之屬言職者主其業職內之屬言衡者平其政林衡之屬言掌者主其事掌舍之屬言氏者世其官師氏之屬言人者終其身庖人之屬不氏不人權其材也宫正膳夫外內饔之屬府史胥徒在天官二千六百六十六春官二千二百四十一夏官三千二百六十五秋官二千六百五十七地官無常職數不可計通典總言內外官六萬三千六百七十五人玉海卷一百二十二
