body:
  text: 玉海卷五十七宋王應麟撰藝文圖繪名臣自古皇王褒崇勳德既勒名於鐘鼎又圖形於丹青周明堂周公圖家語觀周第十一孔子觀乎明堂覩四門墉有周公相成王抱之負斧扆南面以朝諸侯之圖孔子曰此周之所以盛也有周盛時褒賞功德或藏在盟府或紀于太常或銘于昆吾之鼎獨周公有大勳勞於天下乃繪象於明堂之墉期億萬年無忘師保之德使覩之者肅然動心願竭忠盡瘁追配前人褒崇奬勸之道於是為至漢未央宫畫文苑英華盧碩畫諌曰漢文帝三年兩漢故事於未央宫承明殿畫屈軼草進善旌誹謗木敢諫鼓獬豸漢麒麟閣名臣圖蘇武傳甘露三年單于始入朝上思股肱之美乃圖畫其人於麒麟閣法其形貌著其官爵姓名唯霍光不名曰大司馬博陸侯姓霍氏次曰衛將軍富平侯張安世次曰車騎將軍龍額侯韓增次曰後將軍營平侯趙充國次曰丞相高平侯魏相次曰丞相博陽侯丙吉次曰御史大夫建平侯杜延年次曰宗正陽城侯劉德次曰少府梁丘賀次曰太子太傅蕭望之次曰典屬國蘇武皆有功德知名當世是以表而揚之明著中興輔佐列於方叔召虎仲山甫焉凡十一人皆有傳自丞相黃霸廷尉于定國大司農朱邑京兆尹張敞右扶風尹翁歸及儒者夏侯勝等皆以善終著名宣帝之世然不得列於名臣之圖以此知其選矣注張晏曰武帝獲麒麟時作此閣圖畫其象於閣遂以為名師古曰漢宫閣疏名云蕭何造敘傳博陸堂堂受遺武皇權定社稷配忠阿衡霍光安世溫良塞淵其德子孫遵業全祚保國張安世宣和自守溫顔遜辭韓增傳見本營平皤皤立功立論以不濟可上諭其信趙充國高平師師惟辟作威圖黜凶害天子是毗魏相博陽不伐含弘光大天誘其衷慶流苗裔丙吉延年寬和列于名臣杜延年其在于京奕世宗正劬勞王室用侯陽成劉德小心周密上信重之梁丘賀本傳長倩懙懙覿霍不舉蕭望之蘇武信節不詘王命蘇武漢未央宫趙充國圖趙充國傳充國以功德與霍光等列畫未央宫成帝時西羌嘗有警上思將帥之臣追美充國乃召黃門郎揚雄即充國圖畫而頌之漢南宫雲臺功臣圖當參考褒功類人物類後漢論中興二十八將前世以為上應列宿未之詳也然咸能感會風雲奮其智勇稱為佐命亦各志能之士也永平中顯宗追感前世功臣乃圖畫二十八將於南宫雲臺其外有王常李通竇融卓茂合三十二人故依其本第係之篇末以志功臣之次云大傅髙密侯鄧禹授西討之略中山太守全椒侯馬成平江淮築亭障大司馬廣平侯吳漢勇鷙有謀建大策河南尹阜成侯王梁應符而被袞左將軍膠東侯賈復方直多計琅琊太守祝阿侯陳俊定太山建威大將軍好畤侯耿弇走延岑次祝阿驃騎大將軍參遽侯杜茂破盧芳平東方執金吾雍奴侯寇恂居河內積弩將軍昆陽侯傅俊定江東征南大將軍舞陽侯岑彭建南征之效左曹合肥侯堅鐔攻洛陽降朱鮪征西大將軍夏陽侯馮異守洛陽定關中上谷太守淮陵侯王霸權以濟事建義大將軍鬲侯朱祐降秦豐質直信都太守阿陵侯任光迎車駕征虜將軍潁陽侯祭遵平河北用儒雅豫章太守中水侯李忠疏財而受賜從平萌憲驃騎大將軍櫟陽侯景丹殘五校右將軍槐里侯萬修從平河北虎牙大將軍安平侯蓋延梯城破敵太常靈壽侯邳彤一言興邦屠邯鄲衛尉安成侯銚期勝青犢驃騎大將軍昌成侯劉植談説而受封東郡太守東光侯耿純克赤眉橫野大將軍山桑侯王常心如金石城門校尉朗陵侯臧宫滅公孫親質朴而見大司空固始侯李通忘身奉主捕虜將軍揚虛侯馬武力戰無前大司空安豐侯竇融奉圖歸忠驃騎將軍慎侯劉隆討李憲太傅褒德侯卓茂執節淳固贊曰帝績思乂庸功是存有來羣后捷我戎軒婉孌龍姿儷景同翻謂光武也馬援傳顯宗圖畫建武中名臣列將於雲臺以椒房故獨不及援東平王蒼觀圖言於帝曰何故不畫伏波將軍像帝笑而不言通鑑永平三年二月功臣之次鄧吳賈耿恂彭異祐遵丹延期純宫武隆成梁俊茂俊鐔霸光忠修彤植常通融茂通鑑所敘誤陶淵明集聖賢羣輔録云鄧禹吳漢賈復耿弇寇恂馮異岑彭祭遵邳彤耿純王霸臧宫景丹杜茂朱祐劉隆馬成王梁銚期蓋延馬武劉植任光李忠萬修陳俊傅俊堅鐔右河北二十八將光武所與定天下禹漢弇恂異復彭遵光武之起資為腹心祐丹延期純隆宫武光武之起資為禦侮成梁二俊茂霸鐔光忠修彤植爪牙為良茂常通融四七之餘續以繪之功臣之圖漢西閣畫楊惲傳惲上觀西閣上畫人指桀紂畫謂樂昌侯王武曰天子過此一二問其過可以得師矣畫人有堯舜禹湯不稱而舉桀紂漢列士圖論衡宣帝之時畫圖漢列士或不在於畫上者子孫恥之漢明帝殿閣畫見後漢圖畫胡廣黃瓊頌鴻都文學圖贊東觀畫象胡廣傳熹平六年靈帝思感舊德乃圖畫廣及太尉黃瓊省內詔議郎蔡雍為頌注謝承書頌云巖巖山嶽配天作輔降神有周生申及甫允兹漢室誕育二后曰胡曰黃方軌齊武惟道之淵惟德之藪股肱元首代作心膂天生蒸人有則有類我胡我黃鍾厥純懿巍巍特進仍踐其位赫赫三事七佩其紱奕奕四牡沃若六轡衮職龍章其文有蔚參曜乾台窮寵極貴功加八荒羣生以遂超哉邈乎莫與為二陽球傳靈帝􅎁中尚方為鴻都文學三十二人圖象立贊以勸學者臣聞圖象之設以昭勸戒欲令人君動覽得失高彪傳詔東觀畫彪象以勸學者薑肱傳桓帝下彭城使畫工圖肱形狀蔡雍傳靈帝光和元年置鴻都門學畫孔子及七十二弟子陳紀傳以至德稱豫州刺史嘉其至行表上尚書圖象百城以厲風俗冀州表朱穆之象太丘有陳實之畫蔡質漢官典職曰尚書奏事於明光殿省中皆以胡粉塗壁紫青界之畫古烈士重行書讃漢禮殿圖文翁學堂圖益州記成都學有周公禮殿舊記云漢獻帝時立高眹文翁石室在焉眹再作石室在文翁石室之東又東即周公禮殿益州太守高眹修周公禮殿記初平五年九月君始自文翁開建泮宫至于甲午文參增造吏寺益州刺史張收畫盤古三皇五帝三代君臣與仲尼七十弟子於壁間史記索隱仲尼弟子傳引文翁圖所記唐志雜傳記類益州文翁學堂圖一卷隋志蜀文翁學堂像題記二卷益部耆舊傳益州刺史董榮圖畫譙周像於州學命從事李通頌之李業傳益部紀載其高節圖畫形象宋祁文翁祠碑云公為禮殿以舍孔子及七十二子之象殿右廡作石室舍公像其中後人又作高眹象進偶公室嘉祐二年祁知益州肖公像於宇間繪相如等于東西壁本古學之復莫若眹今學之盛莫若蔣堂繪二公配祠焉十贊太守文翁司馬相如王褒嚴遵張寬李仲元何武揚雄太守高眹知益州蔣堂魯靈光殿賦曰圖畫天地品類羣生云云上紀開闢遂古之初鴻荒朴略厥狀雎盱煥炳可觀黃帝唐虞下及三后云云惡以誡世善以示後先賢行狀曰陳紀與實髙名並著而弟諶又配之每宰府辟召羔鴈成羣世號三君百城皆圖畫狀人紀見著書漢賢王圖唐志漢王元昌畫賢王圖韋無忝畫高祖及諸王圖曹元廣畫高祖太宗諸子圖魏溫室畫象贊魏都賦見贊類魏陳思王畫讃序曰畫者鳥書之流也吕氏春秋史皇作圖唐文學館十八學士圖贊褚亮傳亮與杜如晦等十八人為文學館學士武德四年上以秦王功大前代官不足以稱之特置天策上將軍位在王公上冬十月以秦王為天策上將軍領司徒陜東道大行臺尚書令增邑二萬户仍開天策府置官屬秦王以海內寖平乃向儒學開館於宫城西作文學館收聘賢才於是下教以王府屬杜如晦記室房玄齡虞世南文學褚亮姚思亷主簿李玄道參軍蔡允恭薛元敬顔相時咨議典籖蘇朂天策府從事中郎于志寧軍咨祭酒蘇世長記室薛收倉曹李守素國子助教陸德明孔頴達太學助教蓋文達宋州總管府户曹許敬宗並以本官兼文學館學士收卒召劉孝孫入館分為三番遞宿閣下供給珍膳恩禮優厚每遇朝謁公事之暇輒至館中引諸學士討論文籍榷略前代無常禮之間或夜分乃寢又使庫直閻立本圖像文學禇亮為之贊題名爵里號十八學士藏之書府以彰禮賢之重方是時天下向慕學士大夫得預其選者謂之登瀛洲實録云勒成一卷號曰十八學士寫真圖其會要云具題爵里藝文志閻立本畫秦府十八學士圖又曹元廣畫秦王府學士圖舊史列傳房玄齡貞觀十八年與司徒長孫無忌等圖形於凌煙閣讚曰才兼藻翰思入機神當官勵節奉上忘身一作危身杜如晦兼文學館學士畫像於丹青者十有八人而如晦為冠首令文學禇亮為贊曰建平文雅休有烈光懷忠履義一作抱義身立名揚虞世南圖形凌煙閣姚思亷為文學館學士寫其形像列於十八學士圖令文學褚亮為讚曰志古精勤紀言實録臨名殉義餘風勵俗孔頴達貞觀十八年圖形凌煙閣讚曰道光列第風傳闕里精義霞開掞辭颷起蘇世長為學士圖畫亮為讚曰軍咨諧噱超然辨悟正色于庭匪躬之故十八學士贊各四句舊史贊十八文星連輝炳耀房玄齡杜如晦姚思亷孔頴達蘇世長見舊史本傳虞世南篤行揚聲雕文絶世網羅百氏並包六藝李守素賢哉博識穆爾清風遊情文苑高步談叢劉孝孫劉君直道存交守信雅度難追清文逺振褚亮道高業峻神清氣逺學總書林文兼翰苑蓋文逹言超理窟辨折談風蒲輪逺聘稷下連蹤于志寧古稱益友允光斯職藴此文辭懷兹諒直許敬宗槐市騰聲蘭宫遊道抑揚辭令縱橫才藻顔相時六文科籕三冬經史家擅學林人遊書市陸德明儒術為貴玄風可師儔學非逺離經在兹李玄道李侯鑒逺雅量淹通清言析理妙藻推工薛元敬薛生履操昭哉德音辭奔健筆思逸清襟蔡允恭猗與達學蔚有斯文氷霜比映蘭桂同芬蘇朂業敏遊藝躬勤帶經書傳竹帛畫美丹青薛收傳後遍圖學士太宗歎曰恨不早圖其像後圖學士像歎其早死不得與王覿有記褚亮有贊蔣乂有傳王覿十八學士圖記曰十八學士皆煬帝之臣曷暗於隋而明於唐是有其材而無其時矣如晦玄齡於一尉或非好去任或挂網徙邊褚亮虞南不離下位或嫉才見謫或七品十年暨顯我國家則有才兼文武器重圭璋者慷慨大節臨機能斷者仁孝忠直預識存亡者潔行檢身而有英略者好學敏達詳明吏道者出入軍旅涉歷危難者不憚兵威植立忠誼者博聞正儉文翰兼絶者風韻間雅善於吟詠者精練詁訓長於講論者立身行道之事盡在斯矣輒采本傳列嘉績庶幾閲像者思其人披文者思其人後周杜良作唐文皇畫像記曰太宗未定天下而高祖已登九五矣太宗於閭閻疾瘼干戈勤勞且盡知之於仁義之治興太平極治之功容或有未究焉耳既作文學館延四方英俊講貫紬繹薰陶耳目者莫非帝王之事彼十八登瀛人必曰為如是事而治為如是事而亂以太宗之明刻記于心肻圖衰亂乎一意於求治而已仁爐義鞲道薪德火日往月來就聖神之模其為宗廟社稷生靈者炳焉與三代無以異矣故太宗之功烈自漢高以降莫之與敵十八人之力也名賢畫録閻立本圖秦府十八學士凌煙閣二十四功臣輝映今古惟職貢鹵簿等圖與立德同製之南齊竟陵王子良集學士於西邸並見圖畫唐貞觀圖功臣凌煙閣髙宗附太宗紀貞觀十七年二月戊申圖功臣于凌煙閣舊紀云無忌等勳臣二十四人王凌煙閣在凝隂殿西北面寫功髙宰輔南面寫功高侯太宗贊閻立本畫褚遂良題比天二十四氣秦瓊傳十七年詔司徒趙國公無忌河間王孝恭司空萊國公如晦司空太子太師鄭國公徵傳徵亡帝思不已登凌煙閣觀畫像作詩悼痛司空梁國公玄齡開府儀同三司鄂國公敬德特進衛國公靖會要無李靖特進宋國公瑀輔國大將軍褒國公志玄輔國大將軍夔國公弘基尚書左僕射蔣國公通陜東道行臺右僕射鄖國公開山荆州都督譙國公紹荆州都督邳國公順德傳帝閲功臣圖見其像憐之復爵邑洛州都督鄖國公亮吏部尚書陳國公君集左驍衛大將軍郯國公公謹左領軍大將軍盧國公知節禮部尚書永興郡公世南户部尚書渝國公政會户部尚書莒國公儉兵部尚書英國公績太宗時李績已畫像高宗永徽四年復畫其形自序之本傳無此事并叔寶并圖形凌煙閣高宗永徽六年遣使致祭名臣圖形凌煙閣者凡七人徵士亷瑀志玄弘基世南叔寶皆終始著名者也會要貞觀十七年二月二十八日詔曰甘露良佐麟閣著其美建武功臣雲臺紀其迹司徒長孫無忌河間王孝恭司空萊國公杜如晦太子太師鄭國公魏徵梁國公房玄齡鄂國公尉遲敬德宋國公蕭瑀褒國公假志玄夔國公劉弘基蔣國公屈突通右僕射鄖國公殷開山譙國公許紹邳國公長孫順德鄖國公張亮吏部尚書陳國公侯君集郯國公張公謹盧國公程知節永興郡公虞世南渝國公劉政會莒國公唐儉英國公李績胡國公秦叔寶等二十四人可並圖形凌煙閣譙公當是柴紹會要作許紹誤柴紹封霍國公徙譙國卒贈荆州都督諡曰襄案秦瓊傳止敘二十三人而遺高士亷唐吕溫作贊一作頌見文粹有高申公士亷按序云象二十四氣之佐天即二十四人明矣然只贊二十二人不贊張亮侯君集以其負國跋扈自陷大逆故沒其名用彰天刑異姓為後又以河間王孝恭為首會要敘二十二人遺衛國公李靖與髙申公士亷却言叔寶等二十四人藝文志太宗凌煙功臣贊一卷令狐德棻凌煙閣功臣故事四卷雜史類蔣乂凌煙功臣秦府十八學士史臣等傳四十卷藝術類凌煙閣功臣二十四人圖閻立本畫秦府十八學士及凌煙功臣圖並閻立本之迹也又有曹元廣畫凌煙圖舊史永徽五年髙宗圖長孫無忌形象親為畫贊以賜之通志有唐朝功臣配享圖李嗣真武后竒其風度召閻元靜圖之楊志誠為贊殷仲容書唐廣德凌煙閣圖功臣代宗紀廣德元年七月壬子給功臣鐵劵藏名於太廟圖形凌煙閣實録御宣政殿下詔雍王至曹楚王三十三人柏良器圖形凌煙閣侯希逸寶應初圖形凌煙閣德宗紀為天下兵馬元帥封雍王寶應元年十月諸將敗史朝義遂克東都十一月朝義死河北平以功兼尚書令與功臣郭子儀李光弼等賜鐵劵圖形凌煙閣李光弼傳浙東賊袁朝反台州建元寶勝以建丑為正月殘剽州縣光弼遣麾下破其衆於衢州廣德元年擒朝浙東平詔增實封户二千與一子三品階賜鐵劵名藏太廟圖形凌煙閣郭子儀傳回紇吐蕃入寇代宗跳幸陜程元振懼罪説帝都洛陽帝可其計子儀表諫帝得奏泣謂左右曰子儀社稷臣朕西決矣乘輿還子儀頓首請罪帝勞曰用卿晚至此乃賜鐡劵圖形凌煙閣鮑防傳代宗時兼太原尹人樂其治詔圖形别殿唐貞元凌煙閣圖象聖厯侍臣圖贊舊紀貞元五年九月壬戌詔以褚遂良已下至李晟等二十七人圖形於凌煙閣以繼國初功臣之像李晟傳貞元三年進拜太尉中書令明年詔為晟立五廟他日與馬燧見延英帝嘉其勳下詔曰昔我烈祖乘乾蕩滌掃隋季荒茀體元御極作人父母則有熊羆之士不二心之臣左右經綸參贊締創昭文德開武功威不庭康不乂用端命于上帝付畀四方王業既成太階既平乃圖厥容列于凌煙閣懋昭績效表式儀刑以弗忘朝夕永垂乎來裔君臣之義厚莫重焉嵗在己巳秋九月會要作貞元己巳嵗孟秋七月我行西宫瞻望崇構見老臣遺像顒然肅然和敬在色想雲龍之協期感政業之艱難覩往思今取類非逺且功與時並才與世生茍藴其才遇其時尊主庇人何代蔑有在中宗時有如桓彥範等著輔戴之績在玄宗時有如劉幽求等申弼翼之勳在肅宗時有如郭子儀掃除氛祲今顧晟等保寧朕躬咸宣力肆勤光復宗祏訂之前烈夫豈多謝闕而未録孰旌厥賢况念功紀德文祖所為也在豫其曷敢怠有司宜敘先後各圖其像于舊臣之次命皇太子書其文以賜晟晟刻石于門會要貞元五年九月李晟馬燧見延英上嘉其勳下詔云云於是史官考其功績第其前後以禇遂良蘇定方郝處俊等三十七人充之馬燧傳與李晟皆圖像凌煙閣張萬福傳江淮草木亦知威名德宗召為右金吾大將軍詔圖形凌煙閣李惟簡傳號元從功臣圖形凌煙閣賜鐵劵蔣乂傳德宗嘗登閣視右壁頽剝題文漫闕行才數字命録以問宰相無能知者遽召乂至答曰此聖厯中侍臣圖贊帝前口誦以補不失一字唐大中圖元和將相凌煙閣續圖凌煙功臣宣宗紀大中二年七月己巳續圖功臣于凌煙閣李絳傳大中初詔史官差第元和將相圖形凌煙閣綘在焉獨留中忠義傳大中初又詔求李峴王圭戴胄馬周褚遂良韓瑗郝處俊婁師德王及善朱敬則魏知古陸象先張九齡裴寂劉文靜張柬之袁恕己崔玄暉桓彥範劉幽求郭元振房琯袁履謙李嗣業張巡許逺盧奕南霽雲蕭華張鎬李勉張鎰蕭復柳渾賈耽馬燧李憕三十七人畫像續圖凌煙閣云會要只三十六人名而曰三十七人有岑文本而無褚遂良袁恕己會要大中二年七月十一日史館奏選堪上凌煙閣功臣除所有舊真形并有子孫在中外任官令寫進外三十七人敕旨令御史臺牒諸縣尋訪子孫圖寫真形以進崔損凌煙閣圖功臣賦見文苑英華文宗畫王起象於便殿當世仲尼唐開元十八學士圖贊圖含象亭贊藝文志商􅛴韋無忝畫開元十八學士圖開元人張説傳天子尊尚經術開館置學士修太宗之政皆説倡之常典集賢圖書之任間雖致仕一嵗亦修史於家始帝欲拜説大學士辭曰學士本無大稱中宗榮寵大臣乃有之臣不敢以為稱固辭乃免後宴集賢院故事官重者先爵説曰吾聞儒以道相高不以官閥為先後太宗時修史十九人長孫無忌元舅每宴不肯先舉爵長安中與修珠英當時學士亦不以品秩為限於是引觴同飲時服其有體馬植傳奏言開元中麗正殿賜酒大學士張説以十八人不知先舉者説以學士德行相先遂同舉酒中書舍人陸堅以學士或非其人而供擬太厚無益國家者議白罷之説聞曰古帝王功成則有奢滿之失或興池觀尚聲色今陛下崇儒向道躬自講論詳延豪雋則麗正乃天子禮樂之司所費細而所益大矣會要開元十三年改集仙殿為集賢殿麗正書院為集賢院詔院內五品以上為學士六品以上為直學士中書令張説充學士知院事散騎常侍徐堅為副禮部侍郎賀知章中書舍人院陸堅並為學士國子博士康子元為侍講學士考功員外郎趙崇曦監察御史咸廙業左補闕韋述李子釗陸去泰吕向拾遺毋煚大學助教余欽四門博士趙玄默校書郎孫季良並直學士太學博士侯行果四門博士敬會真右補闕馮朝隱並侍講學士初以張説為大學士辭之列傳賀知章開元十三年兼集賢院學士玄宗自為贊賜之康子元玄宗嘗製贊賜説子元命工圖其象詔冬曦述煚分為傳陸堅玄宗待之甚厚圖形禁中親製贊趙崇曦開元集賢學士又有尹愔鄭欽説盧僎名稍著集賢注記殷季友商􅛴韋無忝等分貌張説等燕公以手雜不精奏同州僧法明獨貌諸學士等法明於寫貌無工切於形似圖成奏之上稱善令藏其本於書院詳見集賢書院取圖以年久致失康子元得一本以進今唯有寫本存焉翰林盛事開元中拜張説等十八人為學士於東都上陽宫含象亭圖象寫御贊述之唐孔子廟圖七十子開元二十二賢圖贈孔子弟子爵禮樂志武德六年六月戊戌詔國子學立孔子廟貞觀二十一年二月十五日壬申詔左丘明卜子夏公羊高穀梁赤伏勝髙堂生戴聖毛萇孔安國劉向鄭衆賈逵杜子春馬融盧植鄭玄服虔何休王肅王弼杜預范寧二十二人皆配享開元八年三月十八日司業李元瓘奏先聖廟為十哲象以先師顔子配則配象當坐今乃立侍餘弟子列象廟堂不豫享而范寧等皆從祀請釋奠十哲享於上而圖七十子於壁曽參以孝受經於夫子請享之如二十二賢乃詔十哲為坐像悉豫祀曾參大孝德冠同列特為之像坐亞之圖七十子及二十二賢於廟壁二十七年八月十四日詔諡文宣王以其嗣為文宣公先時以周公南面而夫子坐西墉下貞觀中廢周公祭而夫子位末改至是始改南向以顔淵配贈諸弟子爵公侯子淵兖公子騫費侯伯牛鄆侯仲弓薛侯子有徐侯子路衛侯子我齊侯子貢黎侯子遊吳侯子夏魏侯又贈曾參以降六十七人會要開元二十七年八月二十四日詔贈參成伯顓孫師陳伯淡臺滅明江伯宓子賤單伯原憲原伯公冶長莒伯南宫適郯伯公晳哀郳伯曾點宿伯顔路杞伯商瞿蒙伯高柴共伯漆雕開滕伯公伯寮任伯司馬牛向伯樊遲樊伯有若卞伯公西赤邵伯巫馬期鄫伯梁鱣梁伯顔栁蕭伯冉孺郜伯曹恤豐伯伯虔鄒伯公孫龍黃伯冉季産東平伯秦子南少梁伯漆雕斂武城伯顔子驕琅邪伯漆雕徒父須句伯壤駟赤北徵伯商澤睢陽伯石作蜀郈邑伯任不齊任城伯公夏首亢父伯公良孺東牟伯后處營丘伯秦開彭衙伯奚容蒧下邳伯公肩定新田伯顔襄臨沂伯鄡單銅鞮伯句井強淇陽伯罕父黑乘丘伯秦商上洛伯申黨召陵伯公祖子之期思伯榮子期雩婁伯縣成巨野伯左人郢臨淄伯燕汲漁陽伯鄭子徒滎陽伯秦非汧陽伯施常乘氏伯顔噲朱虛伯步叔乘淳于伯顔之僕東武伯原亢籍萊蕪伯樂咳昌平伯亷潔莒父伯顔何開陽伯叔仲會瑕丘伯狄黑臨濟伯邽巽平陸伯孔忠汶陽伯公西輿如重丘伯公西蒧祝阿伯於是二京之祭牲太牢樂宫縣舞六佾矣會要開元八年三月十八日元瓘奏云云七十子者文翁之壁尚不缺如豈有國庠遂無圖繪請命有司圖形於壁兼為之贊上以顔子亞聖親為製贊書於石仍令朝士分為之贊題於壁漢藝文志論語家有孔子徒人圖法二卷蘇冕曰檢貞觀顯慶年敇並稱二十一賢又檢大極開元年敇即稱二十二賢將前敇與學令比類於服虔之下有賈逵未知何年月附入舊紀武德二年六月戊寅令國子學立周公孔子廟四時致祭仍博求其後乾封元年正月甲午次曲阜縣幸孔子廟開元二十七年八月甲申贈孔子文宣王顔回兗國公餘十哲皆侯夾坐詳見學校釋奠類韋弘機傳顯慶中為檀州刺史修學宫畫孔子七十二子漢晉名儒象自為贊勸生徒唐武成廟名將圖禮樂志開元十九年四月丙申始置太公尚父廟以留侯張良配中春中秋上戊祭之牲樂之制如文宣仍以古名將十人為十哲配享上元元年會要閏四月十九日尊太公為武成王以歷代良將為十哲白起韓信諸葛亮李靖李績列於左張良田穰苴孫武吳起樂毅列於右以良為配後罷中祀遂不祭建中三年閠正月二十五日禮儀使顔真卿奏武成廟請如月令春秋釋奠七月十一日詔考定可配享者列古今名將凡六十四人圖形焉范蠡孫臏亷頗王翦曹參周勃李廣霍去病鄧禹賈復寇恂馬援皇甫嵩張遼關侯周瑜陸遜羊祜王濬謝玄慕容恪檀道濟王僧辨慕容紹宗宇文憲韓擒虎史萬嵗尉遲敬德蘇定方張仁願王晙王孝傑以上三十二人列於左管仲田單趙奢李牧彭越周亞夫衛青趙充國吳漢馮異耿弇假熲鄧艾張飛吕蒙陸抗杜預陶侃王猛長孫嵩王鎮惡吳明徹斛律光于謹韋孝寬楊素賀若弼河間王孝恭裴行儉郭元振張齊丘郭子儀以上列於右貞元二年刑部尚書關播奏太公古稱大賢今乃置亞聖又有未安而仲尼十哲皆當時弟子今以異時名將列之弟子非類也請但用古今名將配享去亞聖十哲之名自是唯享武成王及留侯而諸將不復祭矣藝文志盧鋌武成王廟十哲讚一卷百官志武成王廟令一人六十四名將列國范蠡等八人兩漢曹參等十七人三國張遼等八人晉羊祜等五人南北朝檀道濟等十二人隋韓擒虎等四人唐尉遲敬德等十人唐崇賢學士圖贊顔魯公集顔勤禮與兄師古相時同時為崇賢弘文館學士太宗嘗圖畫崇賢諸文學士命師古為讚以兄弟不宜相褒述乃命中書舍人蕭鈞讚勤禮曰德彰素里行成蘭室鶴鑰馳譽龍樓委質當代榮之當考會要顯慶元年三月十六日太子弘請於崇賢館置學士尼父有徒人之法晉帝著樂賢之象唐龍朔功臣圖藝文志雜藝術類有韓幹畫龍朔功臣圖今祕閣畫有閻立本貞觀名臣圖二唐麟德殿漢名臣圖會要貞元十二年二月己卯以寒食節御麟德殿內宴於宰相位後施畫屏風圖漢名臣仍紀其嘉言美行題之班倢妤曰觀古圖畫賢聖之君皆有名臣在側唐古今朝臣圖舊史韋述傳聚書二萬卷皆自校定兼古今朝臣圖歷代知名人畫魏晉以來草隸真迹數百卷志曹元廣畫後周北齊梁陳隋武德貞觀永徽等朝臣圖武后左尚方令唐六賢圖讃志雜傳記李渤六賢圖讚一卷崇文目同見後唐九老圖白居易傳稱香山居士嘗與胡杲吉晈鄭據劉真盧真張渾狄兼謨盧貞燕集皆高年不仕人慕之繪為九老圖唐歷代名畫記書目十卷唐張彥逺撰首論畫源流興廢至敘畫人姓名自史皇至唐王默凡三百三十餘人唐志十卷唐帝王事迹圖宋朝宗室傳守節上所集唐帝王事迹為列聖圖别類君臣議論為小録端拱注撰武成王廟贊和峴傳端拱初以所著奉常集五卷祕閣二十卷注撰武成王廟贊五卷奏御上嘉之授判太常寺兼禮院事明道重修七十二賢圖贊傳明道元年八月戊午詔國子監重修七十二賢堂其左丘明而下二十一人並以本品衣冠圖之先是真宗於至道三年七月癸酉詔文宣王十哲七十二賢像咸加繪飾元豐七年五月壬戌詔釋奠以鄒國公孟軻配食文宣王設位于兗國公之次荀況揚雄韓愈以世次從祀於二十二賢之間並封伯況蘭陵雄成都愈昌黎又詔學士院撰贊明道元年六月癸卯國子監説書李敏上所著孔子七十二弟子贊傳六十卷國史志李略六十卷治平孝嚴殿圖文武大臣治平元年三月作仁宗神御殿于景靈宫西園八月成名曰孝嚴别殿曰寧真户部副使張燾請圖乾興以來文武大臣於殿壁繪象自此始十二月御篆孝嚴殿額二年四月丙午奉安仁宗御容元豐景靈宫繪勳臣元豐五年十一月乙酉修景靈宫成奉安聖容繪勳臣紹興景靈宫圖配饗功臣十三年正月乙酉建景靈宫十八年五月甲子一作乙丑命有司圖配饗功臣像于景靈宫廷之壁皇武殿太祖韓忠獻王趙普咸平二年二月丙申初以趙普配享太祖廟周武惠王曹彬大定殿太宗司空同平章事諡文惠薛居正樞密使諡元懿石熙載鄭武惠王潘美熙文殿真宗右僕射平章事諡文靖李沆魏文正公王旦山南東道節度使同平章事諡忠武李繼隆美成殿仁宗沂文正公王曽許文靖公吕夷簡簽書樞密院諡武穆曹瑋治隆殿英宗魏忠獻王韓琦魯宣靖公曾公亮大明殿神宗韓文忠公富弼重光殿哲宗溫文正公司馬光承元殿徽宗魏文定公韓忠彥凡十有六人先是禮部下諸路訪十六人繪像十九年八月甲戌詔以景靈宫繪像功臣之副藏于天章閣及祕閣復故事也先是九年四月二十五日李德光上五帝功臣繪像圖端慶殿欽宗皇德殿髙宗吕頥浩趙鼎韓世忠張俊系隆殿孝宗陳康伯史浩美明殿光宗葛邲垂光殿寧宗汝愚合二十四人商盤庚云兹豫大享于先王爾祖其從與享之古者天子録功臣配食於廟大享蒸嘗也周司勳有功者銘書王之太常祭於大蒸司勳詔之洛浩云記功宗以功作元祀漢祭功臣廟庭魏正始六年祫祭太祖廟佐命臣二十一人晉咸寧初荀顗等十二人銘功太常配享清廟唐武德至大中功臣列祀典三十八人漢舊儀宗廟祭功臣四十人食堂下惟御僕滕公祭於廟門外孰用一壺酒四脛骨熙寧元年命取狄青畫像入觀禁中遣使賫中牢祠于其家御製祭文紹熙八圖黃裳為嘉王府翊善作八圖以獻曰太極曰三才正性曰天文曰地理曰王伯學術曰九流學術曰帝王紹運終以百官文武各述其大旨因誕日作渾天儀輿地圖以獻皆以木為之因為歌詩勉進學如天之運行而不息及念祖宗郡國大半陷為賊區乃王心所宜感憤者寶慶昭勳崇德閣圖配享功臣皇帝誕膺駿命憲章鴻烈嗣位之元顧二三大臣曰惟前寧人昭則垂佑豫曷敢不迪既而太常禮官舉嘉定表章勳臣之意以聞於是奉俞咨閲故府凡以功宗作元祀自韓忠獻王普至郕文定公邲合文武二十有三人即頌臺建傑閣肖象登繪寶慶二年八月賜名昭勳崇德之閣宸翰書扁紹定元年十一月癸巳詔翰林學士清之為紀端平二年益以汝愚自昔繼體守文之君欲大有為於天下必賴輔弼共濟康功是以元首股肱相須一體志同道合乃克有成載之詩書不可誣已然自非藻繪形容昭揚勳德以著其感會之榮奉承之迹何以為君子之勸哉吳越春秋越王使良工鑄金象范蠡之形置之坐側朝夕與之論政記志古之史官必廣其所記非獨人君之舉後世因其事類相繼而作者甚衆名目轉廣又雜以虛誕怪妄之説推其本源蓋亦史官之末事也堯握河記文選王元長曲水詩序注帝王世紀曰堯與羣臣沈壁於河乃為握河記今尚書候是也禹受地記三禮義宗明天地嵗祭義禹受地記云昆崘東南五千里之地謂之神州周記韓非子周記曰無尊大臣以擬其主孔子三朝記漢志論語十二家孔子三朝七篇注師古曰今大戴禮有其一篇蓋孔子對魯哀公語也三朝見公故曰三朝史記黃帝紀漢髙帝紀臣瓉引孔子三朝記漢武紀元光元年注亦引之索隱曰劉向别録云孔子見魯哀公問政比三