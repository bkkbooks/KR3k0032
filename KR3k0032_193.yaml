body:
  text: 玉海卷一百九十三上宋王應麟撰兵捷兵捷露布五建隆親征澤潞淮南建隆元年四月戊子討澤潞五月巳未親征六月己巳朔至澤州辛巳克其城李筠死乙酉克潞州丁亥守節降十月庚寅親征淮南李重進十一月丁未次大儀石守信奏揚州即破請上臨視是夕拔之重進自焚四年收湖南北六年收蜀十三年收南粤十七年定江表内則吴越閩海歳奉貢職外則交州髙麗請吏嚮化而契丹修好之使數至闕庭石介頌曰既剪二盗聖武燀燿荆潭蜀吴如拔腐草如火烈烈如飈發發口授臂指虹銷霧豁湖南行營都總管慕容延釗平髙繼冲建隆三年武陵周行逢卒衡州刺史張文表率兵攻潭州行逢子保權初自立乞師于朝廷以為救援乾徳元年正月七日庚申詔以山南東道節度使慕容延釗為湖南行營都總管宣徽南院使李處耘為都監率兵討之發安復郢陳澶孟宋亳潁光等州兵㑹襄陽以郢州刺史趙重為先鋒都尉以淄州刺史尹崇珂為行營馬軍都指揮使師至荆門保權已擒文表殺之二月十一日巳未王師入荆南髙繼冲請舉族歸朝時王師略出荆渚繼冲即日迎延釗入城聽命以三州十七縣來歸自是江陵數郡皆平之三月二十六日壬戌克武陵初保權既殺張文表復謀拒命故王師鼓行而前大破其軍于澧州乘勝入其城保權遁盡有湖湘戊寅捷書至羣臣稱賀凡得州十四監一縣六十六石介頌曰聖機神謀天秘地藏旦秣我馬夕取其疆西川行營都總管王全斌平蜀崇元殿受俘乾徳二年嵗在甲子十一月甲戌詔曰朕掩定萬邦於兹五稔陳師鞠旅出必有名伐罪弔民動非得已睠惟卭蜀久限化風舞階詎識于懷柔干紀自貽于禍釁近禽獲西川偽樞宻院大程官孫遇等二人搜得孟昶遺河東劉均蠟書潜相表裏欲起寇戎致姦謀之自彰蓋天道之助順將定一方之亂難稽六月之師爰命將臣俾正戎律建靈旗而西指授成筭以徂征言念坤維久沉汙俗既為民而除害必徯后以來蘇式清全蜀之封止正渠魁之罪已戒師徒務遵法律凡彼黎烝勿懷憂慮以忠武軍節度使王全斌為西川行營前軍兵馬都總管武信軍節度使崔彦進副之樞宻副使王仁贍為都監史延徳為行營馬軍都指揮使張萬友為歩軍都指揮使張凝為先鋒都指揮使王繼濤為濠寨使康延澤為馬軍都監張照為歩軍都監田仁明濠寨都監自全斌而下率禁軍歩騎二萬諸道兵一萬由鳯州路進討又以寧江軍節度使劉光義為西川行營前軍兵馬副都總管樞宻承㫖曹彬為都監張延翰為行營馬軍都指揮使李進卿為歩軍都指揮使髙彦暉為先鋒指揮使白延誨為濠寨使米元緒為馬軍都監折彦斌為歩軍都監王令碞為先鋒都監郝守濬為濠寨都監楊光美為戰棹左右廂都指揮使自光義而下率禁軍歩騎一萬諸道州兵由歸州路進討乙亥宴崇徳殿太祖召全斌示川峽地圖授以方畧仍令所至之處以前詔告諭吏民丁丑兩路將帥發京師十二月全斌等收復乾渠渡萬仞燕子二寨下興州敗蜀軍七千人獲軍糧四十餘萬石乘勝連拔石圖魚闗白水等二十餘寨丁未師㑹于鳯州巳酉取青泥闗路入蜀界是月史延徳等進軍至三泉寨敗蜀軍數萬人生禽偽招討使韓保正副使李進等又獲軍糧三十餘萬石三年正月劉光義收復三㑹巫山等寨殺偽將南光海等五千餘人生擒戰櫂都指揮使袁徳宏等千二百人奪戰船二百餘艘又殺水軍三千人又拔䕫州初光義將行帝以地圖示之指䕫州鏁江處謂光義等曰至此我軍泝流而上勿以舟師争先當以歩騎陸行出其不意而擊之俟其稍却即以戰櫂夾攻取之必矣及捷奏至乙亥帝問其狀果如所料王全斌等拔利州得軍糧八十萬石崔彦進康延澤等逐蜀軍過三泉殺戮獲虜甚衆遂至嘉州進擊金山寨又破小漫天寨至深渡蜀人依江列陣以待我師彦進發遣張萬友等擊之奪其橋㑹天暮蜀人退保大漫天寨詰朝彦進萬友與康延澤分兵三道撃之蜀人悉以精鋭來拒又大破其衆乘勝奪其寨禽寨主王審超監軍趙崇渥又獲三泉監軍劉延祚蜀將王昭逺引兵來救遇我師三戰三敗追至利州北昭逺遁去渡桔栢江焚浮橋退守劒門王師遂入利州先是既至嘉州㑹蜀人斷閣道未得入王全斌議欲取羅川路入康延澤謂延祚曰羅川路險軍士難進不如督修閣道取大路與全斌㑹於深渡彦進然之不數日閣道成遂進兵王全斌等收復劒州丁丑殺蜀兵萬餘人生禽偽都統王昭逺歩軍都指揮使趙崇韜先是王師發利州至益光全斌㑹諸將令各陳進取之計侍衛軍頭向韜曰得降卒牟進言益光江東越大山數重有小路名來蘇蜀人於江西置寨對岸有渡路出劒闗南二十里至青强店與大路合可於此進兵則劒門之險不足恃也全斌等即欲領兵赴之康延澤曰來蘇細路無煩主帥自往且蜀人自與官軍相遇數戰數敗今聞併兵守劒門不如諸帥協力攻取命偏將趨來蘇若逹青强北擊劒闗與大兵夾攻破之必矣全斌等然之遂命史延徳等分兵趨來蘇起浮橋於江上蜀人見橋成即棄寨而遁昭逺聞延徳至青强即引兵陣於漢源坡上留偏將守劒門全斌等以鋭兵直擊遂破之昭逺崇韜皆遁走全斌遣追之悉生致焉劉光義等收復萬施開忠四郡至遂州知州陳愈出降既而全斌領兵至魏城十三日甲申蜀主孟昶遣使持表詣軍門降先是癸未昶遣伊審微齎表全斌令康延澤領騎兵百人入成都安撫乙酉馳捷書入奏全斌入成都後十餘日光義始自峽路至三年正月十三日王全斌兵至魏城孟昶請降昶傳云正月十一日壬午降自發京師至昶降才六十六日二十五日詔陶榖約前代儀制損益草定受降之禮五月十六日丙戌昶至前一日有司設御座於崇元殿陳仗衛於庭如元㑹之儀為昶及偽官設次於明徳門外設表案於門外横街之北是日大陳將軍昶及子弟偽官李昊等三十二人至闕下昶以待罪奏授閤門使使持表入昶等俟命表至侍臣讀表閤門使承㫖出昶等俯伏於地宣制釋罪入見於崇元殿百官起居訖昶入起居舞蹈再拜昶出百僚稱賀禮畢御明徳門觀諸軍還營宴近臣及昶於大明殿凡得州四十六縣二百四十初荆湖既平上召見穆昭嗣問蜀中山川曲折之狀昭嗣曰荆南即西川江南廣南都㑹之衝既克此則水陸皆可趨蜀又董樞上書請伐蜀㑹蜀使孫遇等二人間行持蠟書如太原約劉鈞同舉為疆吏所獲上曰朕出師有名矣詔遇等指畫江山道里及戍守之處畫地圖以示王全斌等燕崇徳殿上曰西川可取否全斌曰臣仗天威遵廟算刻日可定史延徳曰西川若在天上人不能到若在地上以今兵力到即平耳上壯其言曰汝等果敢如此計日望捷書上又曰所破郡縣當傾帑藏為朕賞戰士朕所取惟土疆耳故人皆效命瀛州防禦使何繼筠彰徳軍節度使韓重贇破契丹開寳二年三月戊戍車駕至太原城下四月丁未朔命置寨城四面李繼勲軍于南趙賛西曹彬北党進東以逼之先是契丹兩道來援一道攻石嶺闗一道由定州并人恃之何繼筠屯曲陽驛命以精騎數千拒敵于石嶺上曰翌日亭午俟捷至巳未上御北臺以俟見一騎自北來乃繼筠子承睿來獻戎捷禽契丹刺史王彦符等二人上命以所獲首級鎧甲示城下并人䘮氣彰徳節度韓重贇大破敵于常山北五月癸未㨗至上大悦潭州防禦使充賀州道行營兵馬都總管潘美擒劉鋹明徳門受俘開寳三年九月八日巳亥亥一云巳朔以潘美為賀州道行營兵馬都總管武陵團練使尹崇珂副之就命道州刺史王繼勲為行營都監發諸州兵趣賀州始用師於嶺也先是廣南劉鋹為政昏暴民皆苦之數舉兵來寇道州刺史王繼勲上言請討之帝初為含容詔江南李煜致書諭令歸欵鋹不聼美等討之十月庚辰美等克賀州十二月壬寅下桂昭連三州殺廣南軍萬餘人遂下韶州十二月辛亥拔連州四年正月癸丑收英雄二州二月庚午遂克廣州擒劉鋹上露布曰臣聞飛霜激電上帝所以宣威伐罪弔民明王以之耀武今我國家仰稽玄象大啓鴻基將復三代之土疆永泰萬方之生聚西平巴蜀雲雷敷潤物之恩南定衡湘江漢鼓朝宗之浪惟嶺南之獷俗獨恃逺以偷安人皆照臨罔遵聲教偽漢國主劉鋹性惟兇惡識本庸愚以虐害為化風以誅戮為政事置大床鐵刷之獄人不聊生設剉斫湯鑊之刑古未曾有恨刀鋒之未快用鋸解之恣情臠割封屠窮彼殘毒一境告天而無路生民蹐地以稱寃衆心向明如望皎日皇帝仁深惻隠義切救焚遂發干戈拯其塗炭臣等上憑仁武遥禀睿謀舉軍未及於半年乘勝連收於數郡累逢戰陣無不掃除劉鋹逺懼傾危尋差人使初則稱臣上表具陳歸化之心後則設詐藏姦翻作欵兵之計臣與將士仰憑睿㫖不敢逗留於正月二十七日甲子到柵口去廣只一程鋹乃頻遣寮佐往來商議漸無憑凖固欲渰延兼於諸路到處新出偽命文榜皆是㑹合逆黨拒敵王師至二月四日巳巳果遣其弟保興等部領舉國軍兵併力决戰將士等感大君之撫御咸願竭忠怒逆冦之執迷爭先效命八十里槍旗競進數萬人殺戮無遺又分布師徒徑收賊累其劉鋹知城隍之必䧟將府庫以自焚烈熖連天更甚崑岡之火投戈散地甘從涿野之誅在州百姓乍除苛虐咸遂生全無不感帝力以霑襟望皇都而稽首此蓋天威逺被宸算遐敷平七十年不道之邦救百萬戸倒懸之命殊方既乂長承日月之回光鴻祚無疆永荷乾坤之降祐知制誥扈䝉草露布至㫖召對從福殿賜金紫開寳四年歳在辛未二月庚午潘美克廣州擒劉鋹巳丑露布至命有司撰定獻俘之禮五月一日巳未朔帝御明徳門樓有司陳仗衛及諸軍文武官班於樓前如閤之儀設俘位于東西街之南獻俘將校位於俘位之前武士係鋹等及偽官露布前引先獻太廟及社百官常服將校戎服文官起居訖引鋹至樓前拜舞起居訖引露布案付中書門下如宣制之儀刑部尚書請以俘付所司釋鋹縛拜舞稱謝文武官稱賀放仗昇州西南路行營馬歩戰棹都總管曹彬平江南明徳門受獻開寳七年九月十九日丙寅命山南東道節度使潘美潁州團練使曹翰宣徽南院使義成軍節度使曹彬侍衛馬軍都虞候李漢瓊賀州刺史田欽祚歩軍都虞候劉遇等領軍同赴荆南十月二十三日丁酉又以吴越國王錢俶為昇州東南面行營招撫制置使三十日甲辰以曹彬為西南路行營馬軍戰棹都總管潘美為都監曹翰為先鋒都指揮使以討之閏十月巳酉曹彬收峽山寨殺江南軍八百人獲池州内指揮使王仁震等遂克池州又敗江南軍七千餘人於銅陵生擒八百人獲戰艦二百餘艘連拔蕪湖當塗二縣駐軍於采石磯先是李煜外示恭儉内懷觀望太祖慮其難制遣李穆諭㫖召赴闕果稱疾不朝而全葺城壘教習戰櫂為自固之計帝怒命彬等進討十一月敗江南軍二萬人於采石磯生禽偽兵馬使王乾總管龍驤將軍都虞候楊收等十一月甲申大江浮梁成先是樊若水嘗漁於采石磯以小舟載絲䋲維南岸疾櫂至北岸以度江之廣狹遂詣闕獻䇿請造舟為梁以濟師由是大軍長驅如履平地又敗數千人於新林寨十二月又敗江南軍五千餘人於白鷺洲八年正月甲戌朔又敗江南軍於新林港口斬首三千級吴越王錢俶拔常州利城寨敗江南軍田欽祚又敗江南軍萬餘人於溧水斬偽都統使李雄等曹彬等又敗其衆數千人於白鷺州拔昇州闗城三月又敗其衆於江中四月又敗其衆於秦淮北六月曹彬又敗其衆二萬餘人於昇州城下九月乙酉降潤州十月劉遇破江南軍三萬餘衆於皖口十一月又敗其軍五千人於城下先是彬等遣使以三寨攻城圖來上帝視之指潘美北寨謂其使曰此宜深溝自固吴人必夜寇其壘爾亟去令曹彬自督其役并力速成則不能為其所乘矣彬等承命晝夜濬之才畢吴人果來寇美等披新溝以拒之吴人大敗悉如帝所料焉二十七日乙未曹彬等拔昇州擒李煜及其臣寮百餘人江南平得州十九軍三縣一百八户六十五萬九年正月四日辛未曹彬奉露布露布云貔貅竟效其先登蟣蝨自悲于相弔以李煜及其子弟偽官四十五人來獻御明徳門受獻有司言李煜獻俘之禮請如劉鋹帝以煜常奉正朔非鋹之比不欲暴其罪寢露布而勿宣赦文李煜不量分力每縱奸險詐為事大之恭勤每欲欺天而觀望修葺城壘彌年為固守之方招誘豪强終日有包藏之志顯然彰露逹于聼聞朕欲推以異恩許其入覲堅心背順稱疾不朝太平興國親征太原平晉詩賦記頌開寳二年二月戊午詔親征太原三月戊戌傅城下乙巳壅汾水灌城丙午又壅晉水圍之累月閏五月壬戌班師興國二年太宗曰彼弱我强我計决矣四年巳夘歳正月庚寅命宣徽南院使潘美等進師二月二日詔親征甲子上親征二十九日次徳清軍三月庚辰朔次真定四月壬戌克岢嵐乙丑克隆州己巳克嵐州繼元外援不至饟道絶王師四合庚午上次太原駐蹕汾水東二十三日幸城四面按行營壘閲視攻具翌日夜漏未盡幸城西督諸軍發機石攻城二十七日命馬仁瑀慕容福超白重貴李繼昇等分道攻城帝自草詔賜繼元五月壬午幸城南上曰翌日重午當食於城中癸未諸將急攻城欲壞帝恐屠城麾衆少退是夜繼元納欵甲申幸城北張樂宴從臣於城䑓受降乙酉赦河東自劉旻厯四主凡二十九年御製平晉賦及七言詩命從臣和以行在所為平晉寺御製平晉記刻石直使館宋白從征因獻平晉頌丁亥上幸太原石介頌曰往弔其民王澤時雨往伐其罪王師虎旅撫我則懷并人肯來降旗出城并門夜開尹洙皇雅帝御我師百萬貔虎鋒鏑始交梯衝如舞我士奮揚願究吾武皇帝曰吁念彼黎庻匪鯨匪鯢復為王土維我藝祖亦勤于征匪貸晉罪俟其貫盈太平興國親征幽州四年既下并州上欲乘勝取范陽殿前都虞候崔翰曰乘破竹之勢時不可失六月甲寅發京東河北軍儲赴北面行營庚申上北征丁夘上躬率兵攻東易州其刺史劉宁以州降留兵千人守之戊辰涿州降以萬人戍守庚午駐蹕幽州城南敵不敢居城中有萬餘衆屯城北上率兵乘之斬千餘級餘黨遁壬申命諸將攻城旬有五日以士卒疲且食盡七月甲申班師河東有地名三交敵之所保多由此入冦八月癸亥命潘美屯三交口潜師襲之敵棄城美因積粟屯兵以守之十月契丹寇闗南左龍武將軍崔彦進與崔翰及鎮州都監李繼隆將兵八萬禦之三戰大破之庚午闗南言大破敵於遂城西斬獲數十萬十一月辛丑又言破其衆數萬太平興國親征契丹諭渤海車駕凱旋又見御詩類五年十一月契丹萬騎寇雄州壬子上北征癸丑闗南言破其萬餘衆戊午次大名府雄州言敵遁十二月上欲乘勝取幽薊學士李昉扈䝉請旋斾上即日庚辰下詔還京乙酉至京師六年正月辛亥易州言破敵兵數千七月丙午將大舉北伐遣使賜渤海王詔諭意曰今靈旗掃北宜率部族來應然竟無至者七年五月辛丑髙陽闗敗敵衆數萬於唐興口巳未府州破萬餘衆於朔州界給事中知代州破契丹雍熙三年正月庚寅北伐五月將至岐溝闗王師不利簽書宻院張齊賢請行七月丁亥命知代州十二月敵騎薄代州城下副總管盧漢贇保壁自固齊賢選廂軍二千出征之誓衆感慨一以當百敵遂却循胡盧南河而西齊賢夜發兵二百人持一幟負一束芻距州城西三十里列幟然芻敵見火光中有幟意謂并師至駭而北走齊賢先伏歩卒二千於上墱寨掩擊大敗之斬獲甚衆捷奏至歸功漢贇上嘉之河西都總管禽李繼捧克夏州趙保吉繼遷寇靈州淳化五年正月癸酉命李繼隆為都總管尹繼倫為都監率兵討之四月趙保忠繼捧奏已與保吉解讐乞罷兵上怒命繼隆移兵擊之王師壓境保吉反圖保忠夜襲其帳保忠脱身走趙光嗣開門納王師繼隆克夏州禽保忠送闕下保吉逺遁漠北五月丙寅保忠入見釋之劒南兩川招討使王繼恩平李順淳化五年正月成都府言狂賊李順等攻刼州郡䧟嘉眉甲戌命昭宣使河州團練使王繼恩為劒南兩川招討使率兵討之二月甲申朔命王杲率兵趨劒門尹元率兵由峽路討賊並受繼恩節度其月賊陷成都府又分攻劒州成都府都監宿翰與劒門都監上官正合兵迎擊大破賊衆斬馘殆盡四月繼恩由小劒門路入研石寨壬寅抜劒門破賊五千餘衆於栁池驛賊衆望風奔走殺戮溺死不可勝計又克閬綿巴三州五月至成都破賊十餘萬獲李順及僣偽服用甚衆戊辰奏至羣臣稱賀六月蜀平髙陽闗貝冀州路都總管破契丹咸平二年十二月甲寅車駕發京師甲子次大名府三年正月范廷召等引兵追契丹丁亥至莫州東二十里大破之斬萬餘級餘衆遁庚寅奏捷羣臣稱賀上作喜捷詩題行宫壁甲子車駕發大名廬州觀察使知益州兼川峽南路招安捉賊事雷有終平王均咸平喜聞捷奏詩見御詩類又見前咸平三年正月巳夘朔神衛軍都虞候王均叛䧟漢州遂趨綿州攻之不下至益州逐知州牛冕甲午詔以户部使雷有終為招安使李惠石普李守倫並為川峽招安廵檢使給歩騎八千討之二月十四日賊敗王師李惠沒焉均盡脅蜀中僧道士民以為兵四月大敗賊衆于升仙橋東官軍進至清逺江為浮橋而渡築壘于城北門造衝梯攻具賊將趙延順中流矢死八月收羊馬城遂設敵棚覆洞車進逼羅城招安使秦翰至於城北魚橋别築土山九月官軍由城道入焚賊望櫓礟架至夕賊衆與其黨二萬餘由南門而遁王均奔富順監遣楊懷忠追賊冬十月甲辰朔斬均於富順監傳首至成都梟於市乙丑有終遣楊崇勲乘傳告捷羣臣入賀崇政殿直秘閣黄夷簡直史舘曾致堯盛元劉鍇直集賢院任隨右賛善大夫宋貽序並上平蜀寇歌頌詔付史館景徳親征景徳元年閏九月二十四日乙亥北面言契丹與其母舉國入寇統軍順國王達蘭引兵掠威虜順安軍保州三路總管等帥兵禦之敗其前鋒斬偏將翌日攻北平總管官田敏擊走之東侵保州攻州城不利而北自是遼主與母并統軍之兵合勢以攻定州王超陣于唐河厲兵蓐食以待之其輕騎為我禆將所擊遂率衆東駐陽城淀二十八日巳夘岢嵐軍賈宗奏敵數萬來寇率兵撃敗之俘獲甚衆翌日再至又擊走之十月四日甲申府州折惟昌言奉詔率所部兵自火山軍入契丹朔州界前鋒破大狼水寨殺戮甚衆丙戌北面上言敵主與母率衆至唐河三路總管王超案兵以待既而不接戰縁胡盧河而東下遂南攻瀛州乙巳威敵岢嵐軍保州莫州北平寨並上言擊破契丹羣臣奉賀二十六日丙午契丹遣人以殿前都虞候王繼忠奏乞許通和詔以殿直曹利用為閤門祗候往荅其意十一月辛亥朔北面上言敵衆急攻瀛州晝夜鼓譟乘城其為城兵所殺者三萬餘人傷者倍之遂解圍既而遊兵逼冀州知州王嶼擊走之十八日戊辰以車駕北廵命李繼隆石保吉等為駕前東西排陣使二十日庚午上北廵契丹又令王繼忠為奏乞和辛未車駕次長垣契丹又遣使李興以王繼忠奏至二十四日甲戌散直張皓自貝州賫王繼忠奏狀至行在且言契丹不敢刼掠以待主人命帝曰敵人雖有善意然深入吾土又河氷已合宜過為之備可再督諸路將帥速㑹駕前仍令樞宻陳堯叟乘傳赴澶州北寨宻諭將帥整飭戎容以便宜從事二十五日乙亥李繼隆等言契丹過天雄犯徳清軍抵澶州北直犯大軍圍合三面輕騎由西北隅突進大軍既成列敵騎止而不進臣等分伏勁弩控其要害有敵帥異其旗幟出行軍伏弩齊發殞之見其數十百騎競前輿去敵師悉遯所害者即順國王達蘭達蘭勇所統皆鋭兵及是朔人䘮氣敵騎漸北但時命輕騎來窺大軍二十八日丁丑曹利用至自契丹與其使韓杞同至十二月庚辰朔對韓杞於行宫前殿是日復同往契丹求割闗南地帝不許而增其歳幣甲申曹利用與契丹使姚柬之至丙戌命奬州刺史李繼昌假左衛大將軍持荅書及誓約與柬之報聘柬之奏已議通和北朝方收衆歸國慮沿邊諸軍出兵邀擊望降詔約束詔如其請戊子上作詩賜輔臣是冬氷判又車駕離京日輕風南至占者以為善應故聖製及之幸北寨勞軍宴從臣于行宫甲午車駕發澶州契丹各團結北去不敢侵掠十八日丁酉李繼昌與契丹使丁振奉其國主及母誓書見于行在誓書每歳以絹二十萬疋銀十萬兩助軍資時國主暗弱其母蕭氏專其政蕭氏有機畧多殺罸其下皆禀服焉戊戌車駕至自澶州法駕前導鼓吹振作景徳元年九月丁酉帝謂輔臣曰國家重兵多在河北不乘此時决戰則邊防之憂未巳朕决親征卿等共議宰臣畢士安等曰陛下已命將出師委任責成必立功效如親征宜駐蹕澶淵就便處事然城郭非廣兵難乆聚况冬候猶逺順動之事更望深思冦凖曰大兵在外須勞車駕暫安澶淵進發之期不可稽緩知樞宻院王繼英曰契丹舉國入冦朝廷必期决勝所宜順動以壯兵威仍督諸路進軍臨事得以裁制然將來駐蹕不可更越澶州庶不虧損謹重所議進發尤宜緩圖若速至彼勢難久圖乃詔士安等各述所見具狀以聞而帝决意親征十一月二十日庚午車駕發京師次衛南北敵遣使致書乞和日抱珥黄氣充塞司天言不戰而却有解和之象帝謂宰相曰敵人雖有善意亦宜過為之備可督諸路師速㑹駕二十五日乙亥李繼隆奏契丹入平瀘州二十六日至澶州城北直犯大軍臣等分伏勁弩殺其先鋒綂軍順國王達蘭敵師悉遁車駕將前進㑹契丹請和十二年甲午班師慶厯五年九月癸巳詔近臣考先朝史為景徳禦冦圖廣東西安撫使平宜州賊景徳四年六月丙辰宜州澄海軍校陳進因衆怒害守臣劉永規擁判官盧成均為帥僣號南平王嬰城拒兵攻桞州七月乙丑朔至桞江不能渡守臣王昱遁去䧟桞城官軍退保象州甲戌以東上閤門使曹利用供備庫使張煦為廣東西安撫使張從古張繼能為副發荆湖蘄黄兵討之命内侍周文質使廣州監屯軍控要路八月賊攻懷安軍知軍任吉等撃走之攻天河寨又敗之上手詔諭利用等守萬全之計九月賊攻象州守臣何邴城守利用命于徳潤以千兵倍道襲賊于武仙縣敗之追于象州城下斬偽將陳進及其黨遂入城分兵捕餘冦盧成鈞挈其族降十月癸卯奏至黎雅州水陸都廵檢使平瀘州夷祥符二年瀘州夷人實錄云黎州蠻集衆為亂四月戊子遣閤門祗候侍其曉乘傳招撫未服八月甲申以文思副使孫正辭為都廵檢使同曉發陜西兵分三路入其境張繼勲等副之九月戊午又以丁謂招撫䕫州蠻令㰱血為盟刻石鐵柱境上三年二月庚子正辭言安撫夷人已平定六年瀘戎蠻酋斗望冦淯井監奪鹽井轉運使冦瑊合兩路兵至江安誘溪藍等十一州長吏及八姓烏蠻首領伐之七月乙未上遣王懷信往與瑊議招撫之宜瑊言不討除則為害乃發陜西兵益以白芀子弟六千人討之懷信為嘉眉戎瀘等州都廵檢使康訓符承訓副之十一月緣淯井溪與斗望鬬凡十一戰破之賊多墜崖死斗望猶不服瑊命懷信分兵拔其柵大破之賊遂降十二月壬午懷信言蠻冦悉平七年三月辛夘懷信言溪洞已寧更城淯井監濬三濠以環之自是不復為冦宜融廵檢平撫水州蠻祥符九年知宜州董元已不善撫衆撫水州蠻為亂冦宜融等州七月乙巳廣西轉運使俞獻可請便宜掩擊從之詔宜融廵檢普克明都監王文慶等領兵㑹合克明與内侍楊守珍出樟嶺西文慶與閤門祗候馬玉出天河寨東磴道危絶蠻多伏弩以待玉戰屢捷克明憚深入月餘始至乃大破蠻黨羣蠻竄山谷諭以改過酋帥䝉承貴等靣縛詣軍前諭以悉還所掠漢口資蓄承貴奉詔自誓不敢復叛請改州縣名天禧元年五月詔以撫水州為安化縣為歸仁賜安信軍印由是間歳朝貢寳元初安化蠻䝉光月等殺運糧官吏知桂州馮伸已星馳至宜州復詔趣兵討之伸已訓隊伍發丁壯轉糧餉由三路以進單騎出陣語其酋衆蠻投兵而降二年正月辛亥奏至知秦州破西蕃祥符九年三月西蕃宗哥李立遵與唃厮囉謀為内冦乃上書求號賛普以立遵為保順軍節度八月壬申朔知秦州曹瑋言伏羌寨蕃部厮雞波與宗哥連結臣已夷其族帳九月宗哥唃厮囉等率衆數萬入冦伏羌寨曹瑋率蕃漢兵迎戰三都谷大敗之追奔二十里斬千餘級獲馬牛器仗三萬天禧元年二月宗哥族烏波叱臘立柵野吴谷口瑋選募神武軍二百人斬柵破其衆庚寅奏至十一月鬼留族叛瑋率兵討平辛丑詔奬之廣西轉運使平宜州蠻慶厯五年杜杞討區希範領兵至環州希範走杞使區瞱誘之及其黨六百餘人出降盡醢以遺谿洞三月甲子宜州蠻平本朝設廣捷之兵習摽牌之器又益澄海之師以備蠻興國初翟守素平梅峒參知政事河北宣撫使平貝州慶厯七年十一月宣毅軍小校王則反於貝州僣號東平王十二月庚戌以樞宻直學士明鎬體量安撫河北逾月未下上以為憂八月正月丁丑命參政文彦博宣撫河北以鎬副之穴地逹城中閏月庚子朔選壯士二百中夜由地道入帳下賊大潰開東門遁總管王信率兵追之執則而還餘黨自焚則叛凡六十五日辛丑彦博言貝州平甲辰改貝州為恩州磔則于都市荆湖南路宣撫使都大提舉廣東經制盗賊事狄青平儂智髙儂氏廣源州蠻也地在邕管西南鬰江之南其崖險峭深善戰鬬輕死好亂初知儻猶州儂全福為交趾所虜其妻阿儂遂嫁啇人生智髙智髙年十三即殺其父阿儂更嫁儂夏卿智髙冒姓儂氏奔雷火洞後據儻猶為交趾所拔交趾釋之以知廣源州然内怨交趾頗刼掠其地僣稱南天國改年景瑞久之求内附既未得請遂冦廣南皇祐元年九月冦邕州三年四月智髙率衆五千緣鬰江東下復貢金函書請内屬不報四年五月乙巳朔破邕州殺知州陳珙智髙見所上金函怒謂珙曰我請内屬求一官以統攝諸黨汝不聞何也於是改年啟厯是月智髙䧟横貴龔潯藤梧六州又䧟封康二州又䧟端州丙寅遂圍廣州六月庚辰實録七月丙午命知潭州余靖為廣南東路安撫使知桂州經制盗賊八月辛夘以知秦州孫沔為荆湖南路江南西路安撫使九月庚申智髙入昭州庚午以宣徽南院使彰化軍節度使狄青為荆湖南路宣撫使都大提舉廣南經制盜賊事是月狄青言自儂智髙冦嶺南而諸路將専用歩軍以乘髙履險之賊故每戰必敗請下鄜延環慶涇原路擇蕃落廣鋭軍曾經戰鬬者各五十人押赴行營從之十月丁丑智髙䧟賔州甲申入邕州辛巳詔廣南將佐皆禀狄青節制若孫沔余靖分路討擊亦各聽節制十二月壬申朔廣南西路兵馬鈐轄陳曉擊智髙軍敗于金城驛五年正月狄青領兵至邕州戊午陳于歸仁鋪賊皆執大盾標槍右將孫節為前鋒死之青麾蕃落兵張左右翼出其右復急擊大破之獲黄師宓已下五十七人智髙遁入大理國詔狄青梟黄師宓等首于邕州城下以其餘築京觀于歸仁鋪四月壬申狄青還朝置酒垂拱殿見陣法類十二月廣南西路安撫司余靖言邕州司戸參軍石鑑等捕獲儂智髙母并其子弟四人于特磨道丁酉詔䕶送京師至和二年六月乙巳戮智髙母于都市智髙反偽稱皇太后天資慘毒智髙攻陷城邑皆其謀也及智髙敗走大理國而保特磨道依其夫儂夏卿收殘衆得三千餘人習騎戰復欲内冦石鑑等發峒兵掩襲禽至都下以招智髙久之傳智髙死遂并其二子戮于市余靖勒銘桂林歸功于青青之客馮炳撰皇祐平蠻記二卷滕甫征南錄一卷以孫沔恊謀特發明之知通逺軍集賢殿修撰復熙州熙寧五年冬十月王韶收復鎮洮軍王韶傳神宗初立上平戎䇿曰欲制西夏當復河湟上竒之五年知通逺軍上所降蕃部版圖得地二千餘里口二十餘萬舉兵城渭源堡破䝉羅角城乞神平破抹耳水巴族㑹木征度洮來冦趨武勝破之遂城武勝八月八日收復武勝八月壬辰賜名鎮洮軍甲辰復遣將破木征木征走弟結吴延征舉族二千餘人并首領李藺毡降十月戊戌升鎮洮軍為熙州以熙河洮岷州通逺軍為一路即熙州為帥府先是五年五月建古渭寨為通逺軍樞宻直學士知熙州兼經畧安撫使復河洮岷州熙寧六年二月丙申王韶克河州遂復洮岷疊宕等州三月丁未捷書聞木征復入河州韶遣將度洮略定南山地築回樂砦結河當州二堡破訶訥城又城香子盡逐南山諸羌木征留其党守河州韶分兵為兩道一攻河州一逆木征所在破之禽木征妻子韶遂城河州攻拔宕州通洮山路九月戊午岷州本令征以城降進軍岷州通熙州路洮疊州皆聽命巴毡角亦來附行軍五十四日渉千八百里復州五辟地東西千里斬首三千餘級獲牛羊馬萬計十月遣走馬承受李元凱詣闕奏捷辛巳羣臣表賀七年四月木征降安南道行營馬歩軍都總管郭逵破交趾交趾本南越之地唐交州總管也至徳中改為安南都䕶府梁貞明中土豪曲成美専有其地復州將吴昌岌據其地昌岌死其弟昌文承襲昌文死驩州刺史丁部領有其地開寳六年丁璉遣使貢方物自是使數至太平興國中大將黎桓篡其位大中祥符三年大校李公藴又篡黎氏公藴死李徳政立徳政死李日尊立日尊死子乾徳立世封交趾郡王熙寧八年十二月交趾入冦攻陷郡縣詔廣南西路經畧司預經制其事將討蕩其巢穴也九年二月戊子以知太原府郭逵為安南道行營馬歩軍都總管本道經畧招討使兼湖廣安撫使知延州趙卨副之十月命燕逹討廣源州拔之十二月十一日癸巳舉兵出界討伐是日破賊决里隘賊黨望風逃潰二十一日抵富良江未至交州三十里賊以精兵乘船逆戰我師奮擊大破之斬偽大將洪真太子其餘擁驅入江溺死不知其數乾徳上表乞修貢如初遂收復廣源蘇茂思琅等州開拓千餘里先後降賊將劉紀共百九十人飛捷以聞十年二月丙午羣臣稱賀以廣源州為順州交州在於天際長安逺於日邉熙河蘭㑹路經略使復洮州禽鬼章青宜結崇政殿獻俘元祐二年知岷州种誼結鬼章部下伺動息言其狀于游師雄及經略使劉舜卿請以熙河蕃漢通逺軍蕃兵合本州軍馬直趨洮州此兵法先人有奪人之心者也初王師拓土至枹罕唃氏餘種唯董氈存退保青唐國不絶如綫首領鬼章誘知河州耿思立偏將王寧㑹踏白城伏發二將俱沒函首以懾于闐等董氊遂復國熙寧八年神宗詔獲鬼章官正使十餘年不能得縻以漢爵歳有廩賜元祐初鬼章有窺覬故土之心與夏國隂相結約分其地二年三月城洮州以居五月攻南川寨遣人鬻馬漢界結屬羌内應种誼刺其情條上攻取之利六月命軍器監丞游師雄使熈河諭㫖諸將便宜出師時夏人聚兵天都山前鋒已屯通逺境上鬼章駐常家山大城洮州以待師期阿里骨發兵十萬圍河州師雄諜知之謂舜卿曰機不可失總管姚兕种誼請分兵兩路急裝輕齎並洮水而進兕部洮西擣講朱城遣人走間道焚河橋絶西援誼部洮東以岷州蕃將包順為前鋒由哥龍谷㑹通逺蕃兵宵濟八月十五日出師十六日兕破六逋宗斬千餘級十七日攻講朱城焚飛橋十八日暮誼至洮州壁青臧峽十九日戊戌黎明霧晦誼部分畢霧開羌望見官軍以為從天而下一鼓破之斬一千七百級遂禽鬼章青宜結縛送闕下鬼章及大首領九人復洮州二十八日戊申捷奏至宰臣公著率百官賀于延和殿十一月十一日庚申以鬼章入獻于崇政殿邈川東大首領兀征聲延震恐求内附九月遣使告裕陵曰自嘉祐末木征擾邊至熙寧中董氊方命於赫聖考恭行天誅非貪尺寸之疆蓋為民除蟊賊遂建長久之䇿不以賊遺子孫鬼章首犯南川北連拓拔云云頡利成禽初無渭水之耻郅支授首聊報谷吉之寃武勝軍節度使御前左軍都統制韓世忠平苖劉建炎三年七月辛巳韓世忠軍還執苖傅劉正彦苖翌以獻磔于建康市福建江西湖南宣撫使孟庾平范汝為紹興元年十一月戊戌以參政孟庾為宣撫使太尉韓世忠副之二年正月世忠攻建城辛丑破賊衆范汝為竄死回源洞江西制置使岳飛復襄陽紹興四年命岳飛收復襄陽淮西宣撫使劉光世發兵萬餘人援之六月飛自鄂渚趨襄陽於是劉豫求救于金金齊之兵俱來我師與遇連戰大破之遂復襄陽及郢隨諸州又復鄧州軍聲大振紹興親征紹興四年十月上將親征詔曰叛臣劉豫信逆雛之狂悖率羣偷而陸梁願挺身而效死不與賊以俱生今朕此行士氣百倍戊戌發臨安壬寅至平江十一月知樞宻院張浚視師江上十二月金冦雨雪絶糧烏珠夜引還追擊之劉麟僅以身免明年二月壬午上還臨安右僕射兼知樞宻院都督諸路軍馬平湖冦紹興二年十二月鍾相餘黨楊么出沒荆岳鼎澧間命李綱劉洪道討之三年五月又命折彦質皆未克五年二月丙戌張浚為都督五月浚以楊么㨿洞庭湖實占上流不先去之為腹心害奏請自行許之時巳命湖南制置使岳飛往討戊戌飛遣降人楊華入賊招安潜結么黨殺么以降六月甲辰賊將楊欽率三千人詣飛降么赴水死招降二十餘萬湖冦悉平主管殿前司公事楊沂中敗偽齊紹興四年秋劉豫聞朝廷求河南地乞師入冦金國以兵應之使烏珠為前鋒冬十月韓世忠敗烏珠前軍于大儀鎮十二月烏珠引還追擊之俘獲甚衆六年春張浚以都督行邊揭榜䟽豫僣逆之罪九月豫以子麟為行臺尚書令遣將僉鄉兵三十萬逼合肥又遣姪猊出渦口十月主管殿前司揚沂中與劉猊遇于藕塘降殺無遺猊挺身遁獲其糧舟四百艘四川宣撫副使兼陜西河東招撫司隨軍轉運誅吴曦曦宻獻蜀地於金國自立為王開禧三年三月二十五日安丙函首并金國封蜀王偽詔偽金印來獻四月三日禮官具獻馘之禮玉海卷一百九十三上欽定四庫全書玉海卷一百九十三下宋王應麟撰兵㨗兵㨗露布六僭叛盜賊幸百六之㑹窺九五之尊封狐萬里窫窳千羣敢懐猶鬭之心來犯必誅之令惡鳥將墜尚顧危巢妖狐就擒猶守舊穴蜚鴻集野青犢嘯風怒萌牙於霜雹昧木水之本原犬牙蠆尾雖梟獍之心蹔求假息而鷹鸇之逐曾不崇朝此更生之惠也何負汝而反邪百姓至此極也多方罔堪顧之縻以組噉以秩怒則獸好則人搏噬猰尨終吠豢牢之主豗隤下駟欲馳厯塊之塗罪逾羿浞虐播黎苖賊輕送死以羔犢而扞虎狼我誓捐生若鷹鸇之逐鳥雀恃長蛇之兩頭固狡兔之三窟楚人是何多也歌空切於帳中漢兵其如予何席尚隨於斗柄執迷不復謂暴無傷舉螳臂以求生張蝟毛而自固刑兹無赦師則有名曾無犬馬之勞但縱豺狼之性且擢髪以難窮宜然臍而弗赦巢幕偷安積薪待燎吳蛇荐食泮椹未懐跳梁井蛙之涯旅拒秋螳之轍緑林戾氣白梃餓夫斬木揭竿蒙盾負羽豕不豶牙蠆因揺尾隙駒為喻井蛙自居未悟傾巢之兆敢懐拒轍之心玉弩驚天金鋩照野赤眉起衆白梃奮兵丹浦緑林作梗青丘稱亂丹浦恃狡兔之穴憑孽狐之丘包藏旤心素懐梟獍之性彰露凶德忽發豺狼之聲既破竹以無前尚寢薪而不悟共抵臧宫之掌欲然董卓之臍衆輕鬬蟻勇劣怒蛙杪忽蜂腰虛見辱於齊斧突梯䑕首濫欲寄於旄頭防維稍緩螻蟻潰隄鞭䇿或寛駑駘覂駕虐甚三苖罔化姚虞之德罪踰有扈難逃夏啓之誅裒凶鞠頑怒飛饑嘯盗環之惡所不可言裂冕之情至於此極忍肆滔天之罪輕為填海之謀穿髙墉以䑕牙毒王師以蠆尾囊血射天毒更逾於梟獍吹脣沸地衆競集於蟲沙兔株是守蛙井與居在外曰姦舜典有理官之治負固不服周書行司馬之誅内稔姦謀外機毒矢狐鳴帝里鴟峙神州逐鹿並驅瞻烏靡定天垂伏鼈野戰羣龍逐鹿連雞禽獸飽而忘恩蠭蠆養而成毒敢孤亭育自絶生成既緩前禽之戮未即後服之誅八紘俟其然臍萬夫為之切齒日長月增雄唱雌和三北之師二東之賦鳩居鵲巢燕棲鳯穴若雞連棲作兔三窟星孛紫垣飇回赤縣委身凶德假翮姦徒雖幕燕之阽危尚鼎魚之假息虐用其民敢行稱亂日月其慆鬼神弗赦苻澤之姦潢池之盗河有防而螘為之決稼太盛而螟生其間乘危蝟起怙險鴟張螽結拒討狼顧背恩豺狼整居猰㺄擇肉正當天討之辰更積鬼誅之罪威弧不射天網可逃嘯侣命儔俟間候隙昧洛書之畀姒同桀犬之吠堯蚊雷聚響螗斧稱威豺狼之心飽之而逾發梟獍之性養之而益生叙兵勢六月出師九天選將運欃槍而掃除縱列缺而焚蕩建方面於函谷以西快雄心於狼望之北即墨龍文常山蛇陳嵗星臨於吳分定成淝水之勲鬬士倍於晉師可决韓原之勝飲氷受斧指日揚麾山川積雨盡消敵騎之塵草木長風咸有王師之氣雲羅四合地道九攻長㦸林高大旗雲繞橫玉弩以高臨縱金鉦而直進乗魚爛之危啓蛇形之陣揚麾誓衆杖節訓兵五部材雄三河俠少或生居燕地尤工即墨之圍或家本秦人蚤習昆明之戰如貔萬計躍馬千羣舉鵬力以揚威耀犀渠而賈勇狼狐張而窫窳逝虹斾建而旬始銷坐觀爇火之蓬方觧迎刃之竹禀鄼侯之指蹤成葛亮之心伐風揚旌斾雨洗甲兵我衆素飽坐折遐衝王師如飛欲賈餘勇商祕計於幄中授成筭於麾下蒙虎皮而直犯被鶴膝以争馳風驅如合於百神雷震若出於九地三軍既拊咸如挾纊之溫羣旅争先莫不投袂而起太白入月星垂滅敵之祥高鋒彗雲士倍禽王之氣電擊雷震星流彗掃為鵞為鸛整師律以無譁如熊如羆肅軍容而不犯朔兵雲合得以毒攻毒之機驍將風馳有先人奪人之勇兵交刃接鳥散魚驚箕宿禡牙狼星斂角戊日禱馬太白揚眉痛飲黃龍濟師蒼兕鞭長不及馬腹風末不舉鴻毛妖雲墜於塞陣暈月繞於邉營行軍枕席之上翫冦掌股之中勵八神於金匱麾三軍於玉堂函犀七屬浴鐵千羣勢甚疾雷鋒踰駭電翻東海以又作决長河而灌螢倒崑崙以壓蟻千萬人徃一二臣同不赦不疑是伐是肆鼓洪鑪以燎毛磨蕭斧以伐菌止紂七歩圍項三重載常服以飭戎車奉靈旗而指伐國一其鬬心萬彼死力中推赤心前蹈白刃臨衝閑閑征夫㨗㨗中權後勁乘鼓儳阻隘之機彼竭我盈有拉朽摧枯之勢堅壁不動振九攻九却之威鼓行而前奮七縱七擒之略元戎十乗先啓行武騎千羣無所用秣馬宵征翦敵朝食五營月合八陣雲連驚漢將之從天若蜀人之擊地滅此朝食無以家為空拳搏虎一劒刳鯨勢均破浪攻甚决河勢無駐於建瓴功有輕於折箠沃騰瀾於爝火蕩危葉於衝飇矛驅海若甲洗天河飛鴞懐我好音急鹿鋌而走險罙入其阻徃城于方又作罔敵我師賞垂香餌令布疾雷蓄鋭淵渟乗機電發於鑠王師恭行天罰一征自葛三户亡秦式遄六月之行如下九天之上左屬平亂之鞬右握滅逆之矢摧强易於折枯銷堅甚於陽雪舉炎火以焫飛蓬覆滄海以沃熛炭浮罌暗度束馬潜攻列長蛇之勢首尾相從發胡騎之雄紛紜縱擊變疾風雨謀先鬼神執彼曲之辭乘我盈之勢火炎立見燎毛雷疾寧容掩耳卷甲晨趨潜師夜起誓陟羊腸之險寧辭馬革之勞勢如雷霆功在漏刻人百其勇士一厥心整我六師屈此羣醜薄伐西戎盡䕶諸將咸指梟巢誓平蟻穴必將嘗膽誓使然臍叙克捷淮壖鶴唳楚幕烏聲縱精兵於數路若珠走盤擠窮冦於長江如杵投臼臯蘭之勝細栁之臨漆月氏之飲器焚老上之龍庭迅雷不及掩耳高屋之上建瓴生致渠魁邁李愬擒呉之迹盡平郛郭昭郅支負漢之辜簞食壺漿以迎莫非王土棄甲曳兵而走㒺敵我師既圖萬舉以萬全聊示七擒而七縱楚氛改色淮水安流蒙輪超乘靡不賈餘長轂鉤援期於盡殪遥知水赤坐想風腥旌旗導長養之風金鼓動發生之氣滔天之逆踰月而平取蝥弧登壘以駢隣翼軍不煩即墨之牛若駕昆陽之象節解懐破竹之憂宵遁有曳柴之懾王旅闞如虓虎靈旗指于天狼凡勇獻其力智獻其謀盖天助者順人助者信望八公山草木始驚師律之静嚴建十二郡鼓旗卒見兇徒之碎潰舊染之俗惟新不圖復見官府攸徂之民相慶咸曰大哉王言聊從一面之啓尚使隻輪之歸五單于相殘宣帝卒來其欵塞兩可汗並立太宗因得以犂庭兵不踰時士已過險過大峴不出知燕兵之無足憂得敖倉以居識漢業之從此定惟斷乃成咸劉厥敵漢斬郅支第乘其無備唐擒頡利盖得於巳降猶足以揚昆山之威遂至於澡渭水之恥若今丕績亘古絶倫出奇謀於堂上視大敵於目中螳莫拒於隆車魚尚游於沸鼎前窺天塹駭巨浸之春生側聽風聲曳疲兵而宵遁占彼鳥烏之樂知其雉兔之逃驗圗考傳已窮漢使之河源航海梯山盡集周書之王㑹兵行如鬼將通於神爪士膚公出奇設伏殆行席上之師制勝摧堅盡掃舟中之敵成擒目中過師席上戎容鷹奮絶紫塞而斷黃河腥旅蟬歸披青天而覩白日天德清明聖圖廣大視民如子天下之所共知應敵以兵聖人之不得已孟子言不嗜殺人梁焉能一高皇謂吾寧鬬智項豈終强受堂上之奇謀制目中之醜類帝赫斯怒貔貅方議於奮威人得而誅蟣蝨已聞於相弔天聲大震月㨗繼聞鏖兵老上之庭斬級雲中之塞殄嶓冡之星狼見漢家之武節閏運百年天聲萬里亂甚有苖不待七旬之格勇如徂莒真成一怒之安兵無常形以直為壯天有顯道惟逆者亡命繫投罦勢危破竹下寛大書沛如時雨經戰伐地踈為泠風冞入其阻克成厥功知㣲知彰不俟終日有嚴有翼以奏膚公鼎魚梟獲之既多穴螘痍傷而無幾取虢之旂裒荆之旅用師者觀釁而動擊虜以殄滅為期兵義者王師直為壯雷奔電擊谷静山空挂斾天山封泥函谷臨翰海以浴兵登天山而緤馬治兵丹浦獲醜青丘祁山歛霧翰海息波防塹師奔但聽有聲之馬隂陵路失漫嗟不逝之騅勢無繇而竄雉計方出於牽羊將執而歸于京師使大者陳諸原野脅從罔治不戮一人災害不生永清四海拔鹿角以入營齊熊耳而積甲胄落魚門兵填馬窟掬指舟中衿甲鼓下石可碎堅江能拒操麕驚鳥散風去雨還乘其再鼓而衰使之隻輪無反曰徯后后來蘓有不戰戰必勝壯士氣於前茅憺皇靈於破竹迎敵鼓行靡待前茅之伺禽囚歸報遂成獨栁之誅見無禮於君歸飲至於廟人臣無將已快鯨鯢之戮吏民如故亟圖鴻雁之安欲為帝耳陣方布於蘄西其如予何兵已臨於新室舂㗋蔽野京觀起于中州積甲成山組練收於外府截風浪以息滄溟澄氛埃而覩白日晷窮漏急命窄塗殫竟然臍於東市終挂膽於西州丹徒鏦濞白門縛布枯幹必摧秋蔕自隕積甲齊於熊耳獲庾方於海陵莽首晨垂董臍夜燎翦暴夀華之澤戮凶絶轡之區刺虎之勢拾蚌之機既舂長狄之喉還葬防風之骨市耀臍燈府傳飲器䑕無夜動鴞變好音靈旗西指期顯行劉闢之誅驛騎東馳忽報獲吕嘉之首克清大憝曾不崇朝殱厥渠魁屈此羣醜刁斗夜嚴穹廬曉破恩融瀚海之氷化解陰山之雪切新都之舌用報仇讐然郿塢之臍以威姦慝斷匈奴臂飲月氏頭信星效祉靈旗呈祥壁壘言言而洞開渠魁纍纍而自縛靡旗亂轍投戈委弓破種徙域空漠静邊指北海而封燕然中西域而立幕府卉服已聞於右祍笳歌頓革於左言共惟帝臣莫非王土立漢赤幟乗秦素車黿鼉就架於橋梁草木助成於兵衛一清蛇豕之妖大築䲔鯢之觀八荒霧卷四表雲褰烏聲之樂鶴唳之驚寛䑕竊狗偷之戮散蜂屯蟻聚之羣訪鴻鴈於棘矜之下追狌鼯於篁竹之間振如虎如貔之氣凝買牛買犢之風折箠一笞投戈四潰間使朝趨降幡夜出坐令强敵之寒心常若神兵之在頸征而不戰聊麾荆柄之幡梟以示懲永震藁街之邸建大將鼓旗士如垂櫜而入布天子詔令人争扶杖而趨布吉語於藁街憺英威於毳幕車馳卒奔曳柴之塵四合旗靡轍亂怒螳之衆一空偶渠魁逭獨栁之誅而醜類無隻輪之返遺種齒寒逺荒膽落西戎即叙我武惟揚屈此羣醜同我太平摧困獸之鬭心碎拒螳之怒臂草木為兵椒蘭比德烝徒被羽而鷹揚强敵望風而獸駭鸛鵝纔列梟獍大奔蒼兕既馳長蛇自翦萬里尅期五道並入偃月疏營浮雲冩陣提劒風驅援旗電掃導彼前茅乘兹破竹積甲齊山封尸築觀勢如解籜事等摧枯千里貔虎之營百里龍蛇之陳沸若雲海聚如雪山使恃固之壘遽復于隍將領之渠盡衿其甲䇿備火攻威同電掃殪角如羊破胷若蝨羣帥稟命中權戒嚴掎角相因初設險於三覆竒正合發俄獻功于七擒王師鼓行窮冦席卷傾枳棘之巢待擒祅鳥决潢汙之水以捕涸鱗天助神兵人生勇氣伏三紀之逋誅成九衢之壯觀纔聞儳鼓已見靡旗長蛇之首尾如截應接自難狡兔之窟穴已焚死亡無所困雖猶鬬亂不能軍軍營對日兵氣浮天闕鞏之甲犀兕七重艅艎之船舳艫千里塞丹浦之遥源拔緑林之奥本聚米而山川可料變幟而壁壘盡傾吳鉤楚練照耀隂山冀馬燕犀張皇窮漠運其長䇿悉心而效六竒接以短兵指掌而論七縱箠塞長河泥封函谷衛霍之襲葷允異道而征辛趙之撃䍐羌兩從其請甌脫不守髦頭匿光遺械如草流膏成川千里煙塵百道旗鼓漏網得逸擐甲復來恥於生降窮以死決猶逃宻網尚反隻輪且稽分體未即然臍舉天畢以掩暴傾雲漢而滌氛月壘連營雲旗蔽野未展鷹揚已皆魚爛受命中軍習流下瀨迅騎追風精甲耀日數其擢髪之愆成於屈指之計月羽紛登雲衝震發冞入其阻大殱厥家歸美天授宏略神輸祕圖動九天之上以發謀見萬里之外而制勝上帝臨而無貳無虞三事就而不留不處敷奏其勇遹駿有聲師出以律載纉武功兵義者王恭行天罰誕敷文德肅將天威明明廟謨矯矯王造布昭湯武遹駿文聲威極雷霆謀究造化潜運睿筭獨决神機窮天盡地皆為壽域之人赤子秀眉共老止戈之代蓄睿筭於霄漢之表畫聖謨於造化之先用仁義為干戈以恩信為疆場用瀛漠為四守統華夏為一家天所助者順也臣何力之有焉賴天之靈敵王所愾民所欲而天必從君之訓而臣何力舜敷文德七旬舞于兩階周駕戎車一月至于三㨗下神兵於九天决睿圖於萬里天保以上治内下武之聲繼文用充國金城之略過伏波銅柱之封有常而立武事不戰而屈人兵郤獻何力敢推羣帥之功叔向有言實在明君之德不待橫草之功共成破竹之勢王奮厥武彼烏敢當天誘其衷我得多筭奏鐃歌而祀清廟告于文人稱夀斚而御端闈明示得意臣何力焉君之訓也役無再舉慶不一書乏吉甫之文武缺郤縠之詩書此皆諸將叶心羣帥宣力北辰居而星共大風起而雲飛乾健天行夬揚號厲正今日鯨鯢之僇絶異時蛇豕之妖共集堂堂之陳用成善善之功天地合謀鬼神助伐法天立道與神為謀布昭聖武充㩜威神武庫韜戈戎亭徹候百蠻奔走南踰銅鼓之鄉萬里謳謡西出玉闗之路鏤靈山而梁孫原釁溫禺而染尸逐動罔不吉戰比有功室家慶商后之來蘇父老喜漢儀之復見華封祝堯兆皇基於千載夷歌頌漢美王澤於三章惟皇天全付所覆率寧人有指之疆一成祀夏力圖宗廟之安三户亡秦胥慰人神之望時龍御漢方開有道之符月馬飲江亟底自焚之禍歌狸首而息射詠杕杜以勞師甲兵不試豈月三㨗之足多土宇昄章笑日百里之猶陋皇威天覆辨職方九州之圖聖敬日躋朝明堂四門之位舞干羽而有苖格獻龜象而淮夷來是伐是肆于理于疆聖筭先定王誅不留成筭自天歡聲屬海睿筭中潛神威外憺成破竹之勢奏采薇之詩不疾而速又作得道多助惟斷乃成見漢武節布唐陽春鋪淮濆嘽王旅已觀因壘之降伐玁狁奏膚公佇見犂庭之舉告清廟以獻俘即正藁街之僇坐明堂而受計盡還葱嶺之圖蠻荆率服初無方叔之壯猶江漢既平行對宣王之令聞民勞汔可小康甫迓升平之運胡滅誠為大慶願臻混壹之期接千嵗之統上萬年之觴有常德立武事以成功告神明表西郊之道示無萬里之行舉外廷之觴更上億年之壽舞兩階之羽幸親睹於苖征上萬年之觴顧莫陪於虎拜罷七旬之干羽收六月之車徒再造可封之俗因櫜不戰之弓守在四夷對揚萬壽左執律右秉鉞願先周樂之容東漸海西被沙兼紀禹功之盛受俘而獻太廟于以慰在天之靈盛醢以賜諸侯庻幾示為臣之戒不以賊遺君父已殄凶殘凡克敵示子孫毋忘勲伐有德以立武事稽首以揚王休脩我戎而整六師矢文德而洽四國制軍而糾邦國飲至而昭文章道德成乎安强已覿靈臺之偃伯政刑脩於間暇豈復潢池之弄兵赤眉已破逺踰漢光再造之勲淮夷攸鋪願紀周后中興之雅布昭聖武對揚王休將從天落兵若山行揚兵九天之上决勝千里之中奉威懐之命以律而臧兼夷夏之師在和而克臣妾兆民庭衢六合破碎戎膽振騰天威百蠻成冠帶之鄉五兵為耒耜之器拯遺甿於溝瀆非聖不能掃餘沴以雪霜非天不可臨斬戎王將置稾街之下提封漢境願窮葱嶺之西雷聲龍見地闢天開履至尊而制六合征弗庭而綏兆民天生五材誰能去兵武有七德所以禁暴至諴感神苖民於焉格舜常德立武徐土所以歸周圖上金城之略生入玉門之闗所亡少少益辦多多天落妖彗風摧陣雲援枹不待於五申破竹遂成於三㨗時雨霈戎軒之㨗迅霆擢賊壘之堅聞爼豆未學軍旅之事聽鼓鼙則思將帥之臣聖謨洋洋㳫授折衝之略虎臣矯矯共懐敵愾之忠重整漢儀再隆周道舂長狄之喉繋郅支之頸有常以立武事一舉而空朔庭虎士説劒龍庭聽笳運竒堂上之兵制勝目中之衆萬里掃邉顧牧馬不敢南下一時來享將諸侯復㑹東都天保以上采薇以下治具畢張濮鈆于北祝栗于南王猶允塞天道先德而後刑王師有征而無戰武先七德守在四夷取若拾遺役無再舉襲冠帶而要衣裳戢干戈而櫜弓矢起句經武七徳尤先禁暴以安民為邦百年然後勝殘而去殺天無二日土無二王田有一成衆有一旅文武之道未墜於地陵律之罪上通於天玉海卷一百九十三下
