body:
  text: 玉海卷五十五宋王應麟撰藝文著書雜著别集古之君子立言以明道修辭以成文文以貫道斯不朽矣孔甲盤盂書漢志雜家孔甲盤盂二十六篇孔甲黄帝史或曰夏帝似皆非田蚡傳學盤盂諸書注應劭曰黄帝史孔甲所作銘也凡二十九篇書盤盂中所以為法戒孟康曰孔甲盤盂二十六篇雜家書兼儒墨名法文選注七畧曰盤盂書者其傳言孔甲為之孔甲者黄帝之史也書盤盂中為誡法朱穆傳注黄帝有巾机之法孔甲有盤盂之誡蔡邕銘論商伊尹書漢志道家伊尹五十一篇湯相小說家伊尹說二十七篇其語淺薄似依託也司馬相如上林賦盧橘夏熟應劭注伊尹書曰箕山之東青鳥之所有盧橘夏熟説苑臣術引湯問伊尹汲冢周書有伊尹朝獻商書周太公金版玉匱文選任昉王儉集序金版玉匱之書注七畧云太公金版玉匱雖近世之文然多善者文選注又引太公金匱抱朴子鄭君有玉匱記金版經漢志道家太公二百三十七篇吕望為周師尚父本有道者或有近世又以為太公術者所増加也謀八十一篇言七十一篇兵八十五篇論衡案古太公望近世董仲舒造傳作書篇百有餘衛武公懿戒楚語左史倚相曰昔衛武公年數九十五矣猶箴儆於國曰自卿以下至于師長士茍在朝者無謂我老耄而舍我必恭恪於朝夕以交戒我在輿有旅賁之規位宁有官師之典倚几有誦訓之諫居寢有􅉏御之箴臨事有瞽史之道宴居有師工之誦史不失書矇不失誦以訓御之於是作懿戒以自儆注韋昭曰懿讀為抑即此篇也大雅抑之篇漢陸賈新語陸賈傳高帝時賈為大中大夫時說詩書帝曰為我著秦所以失天下吾所以得之者及古成敗之國髙帝紀天下既定命陸賈造新語賈凡著十二篇每奏一篇未嘗不稱善稱其書曰新語漢志儒家陸賈二十三篇唐志陸賈新語二卷隋志崇文目同今存于世者道基術事輔政無為資賢至徳懷慮纔七篇史記余讀陸生新語書十二篇固當世之辯士班固賔戲陸子優繇新語以興及時君之門闈究先聖之壼奧隋志儒家顧子新語十二卷吳太常顧譚唐志雜史劉肅大唐新語十三卷元和中漢賈誼新書賈子賈誼集志儒家賈誼五十八篇又賦七篇隋志賈子十卷録一卷漢梁太傅賈誼撰集四卷唐志賈誼新書十卷崇文目九卷集二卷中興書目十卷賈誼撰雜論治道國體及經學胎教本七十二篇劉向刪定為五十八篇今皆存本傳所載治安䇿今釐為數篇各立題目雜見於新書班固賛誼云所著述五十八篇掇其切於世事者著於傳即新書也賈誼傳三表五餌注師古引賈誼書見第四卷匈奴篇文紀注師古引賈誼書曰衛侯朝於周周行人問其名新書目録一過秦上下見史記秦紀宗首數寧藩傷藩彊大都等齊服疑益壤事勢二權重五美制不定審微階級事勢三俗激時變瑰瑋孽産子銅布見食貨志壹通屬逺親疏危亂憂民解縣威不信事勢四匈奴勢卑淮難無蓄鑄錢事勢五傅職保傅見大戴禮昭紀連語輔佐連語問孝闕六禮容經見大戴禮春秋連語七先醒耳痺諭誠退遜君道連語八官人勸學道術六術道德說雜事九大政上下修政語上下雜事十禮容語上下上篇闕胎教見大戴禮立後義傳雜事之傳即本傳語五十八篇十卷漢晁氏新書漢志法家晁錯三十一篇唐志法家晁氏新書七卷晁錯隋志朝氏新書三卷漢御史大夫朝錯撰亡别集朝錯集三卷亡文選賓戲注引朝錯新書曰帝王之道包之如海養之如春漢淮南鴻烈志雜家淮南内二十一篇外三十三篇注師古曰内篇論道外篇雜說淮南王安傳安為人好書招延賓客方術之士數千人作為内書二十一篇外書甚衆又有中篇八卷言神仙黄白之術亦二千餘萬言入朝獻内篇新出上祕之鴻烈二十一篇其二十篇原道俶真天文地形時則㝠覽精神本經主術繆稱齊俗道應汜論詮言兵畧說山說林人間脩務泰族而終之以要畧隋志二十一卷許慎漢太尉祭酒髙誘濮陽令注唐志中興書目同蘇頌去其重複共得髙注十三篇許注十八篇序曰安與蘇飛李尚左吳田由雷被毛披伍被晉昌等八人及諸儒大山小山之徒講論道徳總統仁義而著此書其㫖近老子大較歸之於道號曰鴻烈鴻大也烈明也以為大明道之言也劉向校定又有十九篇謂之外篇西京雜記淮南王著鴻烈言大明禮教自云字中皆挾風霜揚子雲以為一出一入唐志淮南王安集二卷淮南鴻烈音二卷漢志淮南王賦八十隋志縱横家梁有湘東鴻烈十卷元帝撰亡漢董仲舒書志儒家董仲舒百二十三篇春秋有公羊董仲舒治獄十六篇董仲舒傳仲舒所著皆經術之意及上疏條教凡百二十三篇而說春秋事得失間舉玉杯蕃露清明竹林之屬復數十篇十餘萬言皆傳於後世宣紀注臣瓚引董仲舒書曰有其功無其意謂之戾無其功有其意謂之罪後紀明徳馬后尤善周官董仲舒書注玉杯蕃露清明竹林之屬隋志董仲舒集一卷唐志二卷制書目一卷士不遇賦答策請公孫弘記室崇文目春秋繁露八十二篇義引宏博非出近世然其間篇第亡舛無以是正又即用玉杯竹林題篇疑後人取而附著云崇文目别集九十九部始於仲舒集一卷漢五行志董仲舒治公羊春秋始推隂陽為儒者宗文王世子注董仲舒曰五帝名大學曰成均周禮大祝注引董仲舒救日食祝説文引董仲舒曰古之造文者三畫而連其中謂之王三者天地人也而參通之者王也西京雜記有雨雹對文選注董仲舒集七言琴歌二首後漢輿服志注引仲舒止雨書初學記淮南子曰董仲舒請雨秋用桐木魚漢茂陵書髙紀相國鄼侯定章程文紀薄姬食貨志武功爵告緡注臣瓉引茂陵書史記索隱云亡於西晉魏王肅曰武帝聞司馬遷述史記取孝景及已本紀覽之於是大怒削而投之於今此兩紀有錄無書漢虞初周說志小說家虞初周說九百四十三篇河南人武帝時方士侍郎號黄車使者應劭注其說以周書為本師古曰史記虞初洛陽人即張衡西京賦小說九百本自虞初者也漢新序說苑唐續說苑劉向傳向采傳記行事著新序說苑凡五十篇奏之新序陽朔元年二月癸夘上說苑鴻嘉四年三月己亥上志儒家劉向所序六十七篇注新序說苑世說列女傳頌圖唐志儒家類劉向新序三十卷隋志又錄一卷又說苑三十卷隋志同曰文中子讀說苑可以輔教矣中興書目雜家新序十卷漢陽朔元年劉向撰遠至舜禹次及周秦古人嘉言善行悉采摭序載總一百八十三章說苑二十卷漢鴻嘉四年劉向撰采傳記百家所載行事之迹凡二十篇總七百八十四章上之曾鞏序新序三十篇録一篇隋唐之世尚為全書今可見者十篇而已向之序此書於今最為近古雖不能無失然遠至舜禹而次及於周秦以來古人之嘉言善行亦往往而在也說苑二十篇崇文總目云今存者五篇餘皆亡臣從士大夫間得之者十有五篇與舊為二十篇正其脫謬疑者缺之而叙其篇目君道臣術建本立節貴德復恩政理尊賢正諫敬慎善說奉使權謀至公指武叢談雜言辨物修文反質缺反質一卷鞏分修文為上下後高麗進一卷遂足鞏校正為之序已上凡二十篇七百八十四章號曰說苑後魏書明元帝以劉向新序說苑於經典正義多有所闕乃撰新集三十篇采經史該洽古義云唐書右拾遺劉貺獻續說苑十篇廣向所遺刋其怪妄志儒家十卷又李吉甫古今說苑十一卷隋志孔氏説林二卷孔衍撰蕭賁辯林二卷漢法言揚雄傳雄見諸子各以其知舛馳大抵詆訾聖人即為怪迂析辯詭辭以撓世事雖小辯終破大道而或衆使溺於所聞而不自知其非也及太史公記六國歴楚漢訖麟止不與聖人同是非頗謬於經故人時有問雄者常用法應之譔以為十三卷象論語號曰法言文多不著獨著其目學行吾子脩身問道問神問明寡見五百先知重黎淵騫君子孝至志儒家揚雄所序三十八篇太元十九法言十三樂四箴二隋志揚子法言十五卷解一卷李軌注梁有六卷侯芭注亡十三卷宋衷注揚雄集五卷唐志同二書目六卷四十三篇又十四箴一卷唐志揚子法言六卷宋衷注十卷李軌注三卷柳宗元注十三卷宋朝司馬光集晉李軌唐柳宗元本朝宋咸吳秘四家十二卷漢儒家言志儒家言十八篇不知作者漢别集隋志漢武帝集二卷見御集淮南王安集一卷唐二卷博本傳辨善為文辭為離騷傳又獻頌徳及長安都國頌及方技賦頌賈誼集四卷唐志二卷傳弔屈原賦服賦政事疏又上疏益淮陽地為梁王立後諫王淮南諸子凡所著述五十八篇掇其切于世事者著于傳朝錯集三卷唐志無務傳遷博士上書言兵事復言當世急二事舉賢良策又言削諸侯事及法令可更定者書凡三十篇論其施行之語著于篇枚乘集二卷傳諫吳王書乘復游梁梁客皆善屬辭乘尤高司馬遷集一卷唐志二卷誦漢志賦八篇石傳年十嵗古文紬金鐀室之書報任安書遷既死其書稍出文選注引遷集悲不遇賦東方朔集二卷傳上書髙自稱譽諫起上林奏泰階六符言董偃之罪對化民有道上書陳農戰彊國之計著論答客難非有先生論有封泰山責和氏璧及皇太子生禖屏風殿上柏柱平樂觀賦獵八言七言上下從公孫弘借車凡劉向所錄具是矣司馬相如集一卷唐二卷巴傳著子虛上林賦諭巴蜀檄難蜀父老諌獵疏哀二世賦大人賦封禪書他所著若遺平陵侯書與五公子相難草木書篇董仲舒集一卷唐二卷傳對賢良文學策相江都膠西王上疏諫争教令國中朝廷有大議對皆有明法凡上疏條教凡百二十三篇孔臧集二卷李陵集二卷文選有李少卿詩魏相集二卷傳少學易對䇿髙弟奏封事損霍氏權全功臣之世白去副封上書諫擊匈奴右地明易有師法好觀漢故事便宜章奏條奏便宜行事及賢臣所言表采易隂陽及明堂月令奏之風雨災變輙奏言之韓延壽傳有相文學對策事張安世傳魏相上封有褒徳顯功之言張敞集一卷唐二卷言傳諫昌邑王書霍氏封事請自治盗賊書諫太后出游獵書詣公車上書王褒集五卷傳中和樂職宣布詩聖主得賢臣頌所幸宫館輙為歌頌侍太子誦讀竒文及所自造作太子喜褒甘泉洞簫頌劉向集六卷唐五卷十八篇書目五卷集者云晉八卷隋本五卷今所存傳通達能屬文辭獻賦頌數十篇使外親上變事書上封事著疾讒擿要救危及世頌凡八篇校中五經祕書著洪範五行傳十一篇諌起昌陵言陳湯功極諫王氏封事奏災異書博物洽聞通達古今其言有補於世陳湯集二卷唐志無善傳好書屬文上疏自劾奏矯制陳言疏兵狀誅郅支單于疏徙初陵韋玄成集二卷傳以明經修父業黜爵作詩自劾復作詩自著復玷缺之難罷郡國廟立親廟議玄成父賢其先韋孟家於鄒谷永集二卷唐五卷䇿傳博學經書數上疏言得失舉方正直言極諌對災異對謝王鳯書與王譚書王音書上疏訟陳湯薦薛宣說成帝絶滛祀善言災異前後所上四十餘事專攻上身與後宫而已杜鄴集二卷唐五卷商傳對方正直言策說王音與王親密說王商復郊祀李尋集二卷唐志無傳好洪範災異又學天文月令隂陽事說王根防水災待詔黄門對災異師丹集一卷梁三卷唐志五卷上傳議論深博成帝拜丁傅奪王氏權丹以得信於上書数十多切直哀帝追尊定陶王為共皇置吏二千石以下為立廟京師丹議不可息夫躬集一卷唐五卷疏傳通覽記書上詆公卿大臣著絶命辭揚雄集五卷傳好學不為章句訓詁通而已嘗好辭賦作反離騷又旁離騷作重一篇曰廣騷又旁惜誦以下至懷沙一卷名畔牢愁為甘泉賦河東賦校獵賦長楊賦或嘲雄以玄尚白雄解之號曰解嘲客有難玄大深雄解之號解難作九州箴諫宜許單于書劉歆集五卷傳少以通詩書能屬文博見彊志過絶於人欲建立左氏春秋及毛詩逸禮古文尚書移書責太常博士班婕妤集一卷唐志無班昭集三卷唐志二卷銘傳作女誡七篇所著賦頌誄問注哀辭書論上疏遺令凡十六篇崔篆集一卷傳以明經徵詣公車自以受莽偽寵辭不仕著周易林臨終作賦自悼曰慰志唐林集一卷唐志無史岑集二卷傳著頌誄復神說疾凡四篇東平王蒼集五卷唐二卷及傳議定南北郊冠冕車服制度光武廟登歌八佾數上書諫校獵河内上疏乞就蕃國上光武受命中興頌上疏諫起二陵自建武以來章奏書記賦頌七言别字歌詩桓譚集五卷唐二卷析傳能文章好古學數從劉歆揚雄辨世祖時上疏陳時政所宜著書言當世行事二十九篇曰新論著賦誄書奏二十六篇馮衍集五卷傳說亷丹據大郡撫吏士又以計說鮑永遺田邑書上書陳八事集有與隂就書班彪集三卷傳著王命論所著賦論書記奏事合九篇上書言東宫諸王宜置師傅陳元集一卷唐志無傳傳上疏立左氏又上疏言不宜使有司察公輔王隆集二卷唐志王文山集六傳著詩賦銘書二十篇朱勃集二卷唐志同梁鴻集二卷傳作五噫之歌思高恢詩著書十餘篇杜篤集一卷唐五卷言傳為誄吳漢辭奏論都賦所著賦誄弔書讃七女誡及雜文十八篇又著明世論十五篇傅毅集二卷梁五卷宗唐五卷著傳作廸志詩依清廟作顯頌十篇詩賦誄頌祝文七激連珠二千八篇班固集十七卷唐十卷載傳九嵗能屬文及長博貫籍奏記東平王蒼延英雄撰世祖本紀又作列傳載記上兩都賦所著典引賓戯應譏詩賦銘誄頌書文記論議六言在者凡四十一篇黄香集二卷傳遷尚書令為東郡太守上疏讓所著賦牋奏書令凡五篇崔駰集十卷傳善屬文擬揚雄解嘲作達㫖上四廵頌獻書誡竇憲所著詩賦銘頌書記表七依婚禮結言達㫖酒警合二十一篇賈逵集一卷梁二卷獻唐二卷國傳永平中上疏左氏傳語解詁作神雀頌條奏左氏傳大義著經傳義詁及論難百餘萬言又作詩頌誄書連珠酒令凡九篇劉騊駼集一卷梁二卷傳唐二卷賦傳著中興以下名臣列士乂自造頌書論凡四篇李尤集五卷唐志無哀傳著詩賦銘誄頌七歎典凡二十八篇竇章集二卷傳好學有文章與馬融崔瑗同好崔瑗集六卷梁五卷記唐五卷著傳髙於文辭善為書箴銘所賦碑銘箴頌七蘇南陽文學官志歎辭移社文悔祈草書蓺七言凡五十七篇劉珍集二卷傳著誄頌連珠凡七篇乂撰釋名張衡集十一卷梁十二卷又一本十四卷作唐十卷傳擬班固兩都二京賦著靈憲筭罔論設客問作應問以見志上疏言圖緯虛妄作思玄賦所著詩賦銘七言靈憲應問七辯廵告懸圖凡三十二篇蘇順集二卷傳所著賦論誄哀辭雜文十六篇胡廣集二卷傳上疏諫探籌建后駮左雄改察舉之制撰百官箴四十八篇其餘所著詩賦銘頌箴弔及諸解詁凡二十二篇葛龔集六卷梁五卷文唐五卷書傳以善文記知名著賦碑誄記凡二十篇李固集十二卷梁十卷所唐十卷梁傳舉對策論當世之敝為政宜奏記商令先正風化退辭髙滿上疏陳事徵用楊厚臨終與胡廣趙戒書所著章表奏議教令對策記銘凡十一篇馬融集九卷唐五卷書傳上廣成頌東廵頌詣公車對策所著賦頌碑誄記表奏七言琴歌對策遺令凡二十一篇為梁冀草奏李固又作大將軍西第頌髙彪集二卷梁一卷數傳覆刺遺馬融書奏賦頌竒文因事諷諫作箴餞第五永蔡邕等甚美其文以為莫尚王逸集二卷傳賦誄書論及雜文凡二十一篇又作漢詩百二十三篇著楚辭章句子延壽作魯靈光殿賦桓驎集二卷漢書有桓驎著書二十一篇崔琦集一卷唐二卷銘傳作外戚箴白鵠賦所著賦頌誄箴弔論九咨七言凡十五篇酈炎集二卷傳有文才解音律有志氣作詩二篇邊韶集一卷唐二卷傳著詩頌碑銘書策凡十五篇朱穆集二卷傳奏記梁冀以災異勸戒作崇厚論上疏言宦官所著論策奏教書詩記嘲凡二十篇延篤集一卷梁二卷孝唐二卷證傳或疑仁前後之篤論之李文徳欲引進篤為書止之所著詩論銘書應訊表教令凡二十篇皇甫規集五卷傳西羗大㓂上書言馬賢必敗又上疏乞自效舉賢良方正對策上疏自奮討零吾又上疏自訟拜度遼將軍薦張奐自代所著賦銘碑讃禱文弔章表教令書檄牋記凡二十七篇張奐集二卷傳舉賢良對策上疏言災應奏記謝叚熲著銘頌書教誡述志對策章表二十四篇子芝昶並善草書王延壽集三卷唐志無逸之子崔實集二卷唐志無銘傳著政論所著碑論箴答七言詞文表記書凡十五篇趙壹集二卷傳作解擯貽書謝友人恩為窮鳥賦又作刺世疾邪賦以舒怨憤著賦頌箴誄書論及雜文十六篇劉陶集三卷唐志無改傳游太學上䟽陳事議鑄大錢陳要急八事大較言天下大亂皆由宦官作七曜論匡老子反韓非復孟軻上書言當世便事條教賦奏書記辨疑百餘篇張升集二卷唐志無凡傳著賦誄頌箴書六十篇侯瑾集二卷傳為皇德傳三十篇餘所作新文數十篇盧植集二卷傳獻書規竇武上書立五經博士日食上封事所著碑誄表記凡六篇亷品集二卷亡唐志無荀爽集一卷梁三卷傳唐二卷對策陳便宜著禮易等傳尚書正經春秋條例漢語公羊問及辨䜟它所論叙題為新書凡百餘篇劉梁集三卷梁二卷同唐二卷楨傳著破羣論辯和之論孫以文名鄭玄集二巻傳玄所注周易尚書毛詩儀禮禮記論語孝經尚書大傳中候乾象厯义著天文七政論魯禮禘祫義六蓺論毛詩譜駁許慎五經異義答臨孝存周禮難凡百餘萬言弟子問五經作鄭志八篇蔡邕集十二卷梁二十卷行唐二十卷政傳作釋誨以戒厲上書陳政要宜所施七事入崇殿對災異程璜使人飛章言邕詔詰狀邕上書自陳所著詩賦碑誄銘讃連珠