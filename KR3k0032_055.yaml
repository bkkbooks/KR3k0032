所出共二百餘條元豐事物紀原書目十卷元豐中高承以劉存馮鑑事始删謬除複增益名類皆援摭經史以推原初始凡二百七十事唐吳王諮議劉存與長史房徳懋等集經史諸書以類分門為事始三卷唐志小説家事始三卷劉孝孫房徳懋又三卷劉睿續後蜀馮鑑采羣書續事始五卷宣和中朱繪以事始疎畧撰事原三十卷北史劉懋撰諸器物造作之始十五卷名曰物祖唐志雜家謝昊物始十卷元祐重校學海書目三十卷馬共以唐温庭筠學海未盡唐志類書庭筠學海三十卷因總括諸書損益去取分類為一千二百八十餘門崇文目學海三十卷史海十卷皇極經世邵雍撰十卷以元經㑹以㑹經運以運經世天日月星辰隂陽地水火土石剛柔變暑寒晝夜化雨風露雷感性情形體應走飛草木人目鼻耳口物聲色氣味事皇帝王伯體用業易書詩春秋心迹天開於子地闢於丑人生於寅孔子賛易自羲軒而下祖三皇也序書自堯舜而下宗五帝也删詩自文武而下子三王也脩春秋自桓文而下孫五伯也一元之運始於日甲月子星甲辰子自開闢以來推其年数雍得之於李挺之挺之得於穆伯長自天地運化陰陽消長皆以數推之以窮萬物之變程伯淳謂加一倍法其書以日月星辰水火土石盡天地之體用以暑寒晝夜雨風露雷盡天地之變化以性情形體走飛草木盡萬物之感應以元㑹運世嵗月日辰盡天地之終始以皇帝王伯易書詩春秋盡聖賢之事業易用九六經世用十十二一元統十二㑹十二㑹統三十運三十運統十二世一世統三十年一年統十二月一月統三十日是十二與三十迭為用也觀物篇解伯温叙述二卷蔡元定為指要二篇以伏羲卦圖列於前以皇極經世疏於後張行成撰索隠一卷觀物外篇衍義九卷張栻因經世之攷自堯甲辰至乾道改元之嵗凡三千五百二十二年列為六圖曰經世紀年周奭為節要觀物外篇門弟子記平生之言合二卷雖以次筆授不能無小失然發明成書為多張行成曰内篇理深而数畧外篇数詳而理顯學先天者當自外篇始晁氏志皇極經世十二卷起堯即位之二十二年甲辰終周顯徳六年己未編年紀興亡治亂之事以符其學觀物篇系於後其子伯温解康節先生受業於李之才先視之以陸淳春秋意欲以春秋表儀五經既可語五經大㫖則授易而終焉紹興皇朝事實類苑紹興中江少虞撰次二十六卷祖宗聖訓名臣事迹及藝術仙釋神怪夷狄風俗釐為二十六門紹興中興龜鑑七年三月二十一日詔林保所獻中興龜鑑可采賜紫其書進入十三年五月丁卯十一日何俌上十卷詔遷一官帝王手鑑崔偓佺撰十卷帝王經世圖籍唐仲友撰十卷一百二十二篇周必大題辭賜書詳見御書漢賜祕書叙傳班斿為右曹中郎將與劉向校秘書每奏事斿以選受詔進讀羣書上器其能賜以祕書之副時書不布自東平思王以叔父求太史公諸子書大將軍白不許霍山坐寫祕書泄蘇昌為大常坐藉霍山書秘書免彪與從兄嗣共遊學家有賜書好古之士自逺方至漢賜外屬圖世家列傳竇融傳融與五郡太守共砥厲兵馬上疏請師期帝深嘉美之乃賜融外屬圖及太史公五宗外戚世家魏其侯列傳漢賜祕書列仙圖見圖類漢賜山海經河渠書禹貢圖王景傳永平二年議脩汴渠引見景問以理水形景陳其利害應對敏給帝善之又以嘗修浚儀渠功業有成乃賜景山海經河渠書禹貢圖宋賜河西王蒙遜周易及子集諸書合四百七十五卷唐栁宗元家有賜書三千卷在善和里舊宅唐賜荀悅漢紀見賜物唐賜厯日集賢注記自置院之後每年十一月内即令書院寫新厯日一百二十本頒賜親王公主及宰相公卿等皆令朱墨分布具注厯星遞相傳寫謂集賢院本太平興國賜軍誡雍熈賜六韜見兵書淳化賜儒行篇淳化三年二月詔以新印儒行篇賜中書樞宻兩制三館等人各一軸先是御試進士以儒行篇為論題意欲激勸士流脩儒行故命雕印首賜孫何等次及宰輔近臣至銓司選人令置於聽事以代座右之誡三月已酉賜新第孫何等儒行篇各一軸何等表謝祥符二年十一月丙辰復以儒行篇賜親民釐務文臣其幕職州縣官使臣賜敇令崇文院摹印送閤門辭日給之初上謂輔臣曰先朝賞賜近臣儒行篇可并賜之紹興十八年六月三日御書儒行篇賜進士王佐等咸平賜三史賜九經元年七月甲申賜諸王輔臣新印三史各一本四年六月丁卯詔郡縣學校聚徒講誦之所各賜九經一部咸平賜三國志五年四月乙亥直秘閣黄夷簡等上新印三國志賜銀帛以其書分賜親王輔臣景徳賜經史景德元年七月癸未朔賜諸王宗室近臣新印周禮疏二年六月乙未賜殿前都指揮使高瓊九經書疏諸史各一部從所請也真宗尚儒術故勲臣宿將亦化焉十月甲申賜宰執近臣親王新印周禮儀禮公羊穀梁傳疏三年八月甲戌賜右諫議种放大宗聖製御書九經三史義疏四年七月賜交趾九經從其請也祥符六年十一月癸丑賜御史臺九經三史三國志晉書八年正月丁亥以監書賜昭應宫二月辛酉又賜聖製文集天禧元年二月賜宗正寺經史以備修玉牒至道三年九月戊寅殿中丞方演言曲阜文宣王廟有書樓而無典籍請賜九經及先帝御書重給祭器從之景徳元年七月丙午崇文院上新印晉書百三十卷賜校勘官祥符賜莊列子景徳二年二月甲辰直講孫奭言郭象所注莊子時㑹莊生之㫖請依道徳經例校定并釋文三卷雕印詔可命崇文院檢討杜鎬與奭同校定摹刻祥符元年六月甲辰賜輔臣南華真經版本人一部景徳四年經列子觀二月丙子詔加至徳之號命官校正其書祥符五年四月丙寅崇文院上新印列子冲虛至徳真經詔賜親王輔臣人一本祥符四年十一月丙子命李宗諤楊總等校莊子序摹板祥符賜孟子七年正月庚子國子監上新印孟子及音義賜輔臣各一部天聖賜進士中庸大學五年四月辛卯賜新第王堯臣已下中庸八年四月丙戌賜王拱辰巳下大學後登第者必賜儒行及中庸大學以為常天聖賜九經天聖九年二月癸亥賜青州州學九經明道元年七月甲戌賜壽州州學九經二年五月庚寅賜大名府學九經景祐二年四月戊辰賜楚州州學九經景祐賜册府元龜四年二月甲子賜御史臺册府元龜天下圖經各一部嘉祐賜新唐書五年六月詔鏤新唐書賜二府下逮修書官治平三年五月詔以七史賜二府下逮編校官治平賜頴邸書治平四年六月甲寅神宗已即位司馬光初讀資治通鑑上親製序靣賜光令候書成寫入又賜頴邸舊書二千四百二卷治平三年五月十九日王師約選尚公主又出經籍及紙筆硯墨賜之元豐賜班超傳元年西夏入㓂秦鳯以李師中知秦州賜手詔班超傳以勉之神宗聖訓云熙寧初元祐賜資治通鑑七年七月二十八日戊申詔諸路安撫鈐轄司并西京南京各賜通鑑一部建炎賜郭子儀傳四年八月丁丑韓世忠遷檢校少師翌日戊寅上諭大臣曰世忠不親文墨朕方寫郭子儀傳欲付卿等呼諸將讀示之紹興賜進士中庸篇五年策士首得汪應辰九月十九日言者請依雍熙故事賜新進士儒行篇以勵士檢有㫖添賜中庸送秘府校勘正字張嵲校中庸高閲校儒行篇二十二日閲奏儒行雖間與聖人之意合而其詞夸大類戰國縱横之學蓋漢儒雜記决非聖人格言望止賜中庸庶幾學者知聖學淵源奏可御書中庸以十月四日賜之㑹要九月賜御書石刻中庸篇紹興賜御書孝經十四年七月辛未詔諸州以御書孝經刋石賜見任官及係籍學生時已頒于郡庠殿中御史汪勃言定和議極至飬望摹刻使家至户曉以彰聖孝乾道賜武經龜鑑見兵書淳熙賜太子資治通鑑紀事三年十一月戊辰二十四日詔取袁樞資治通鑑紀事賜皇太子與陸贄奏議熟讀以求治道八年四月五日詔國子監印經史子書各一帙賜吳益王府從教授劉光祖請也玉海卷五十五
