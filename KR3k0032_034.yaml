body:
  text: 玉海卷三十四宋王應麟撰聖文御書三朝寶字胡宿代中書密院謝賜三朝寶字訓鑒圖表神毫英發繪事昭陳裁決繁機奮耀英斷書鳳紙之尾摛犀管之英墨寶相輝神鋒逈拔居然鸞鵲之翥蔚有龍虎之威留聖思於勒成命侍臣而類次形於方版之鏤參諸設色之明序以宸章置之禁坐乾興飛白書天聖賜飛白書乾興元年三月丙子賜輔臣御飛白書各一軸初上未嘗為飛白書一日見飛白筆遂取試書其體勢遒徑有如夙習因以分賜焉十二月甲辰親書唐賢詩分賜天聖元年九月戊寅召輔臣於崇政殿西廡觀馮元講論語仍賜御飛白書三年四月己未賜輔臣御飛白書人十軸仍刻石賜近臣四年五月庚辰以端午賜輔臣御飛白書羅扇各二中書樞密五年三月辛酉賜輔臣御飛白書九年閏十月戊辰二十四日知兖州孫奭辭曲宴大清樓召朝逈與會賜飛白書人一軸逈與吕夷簡張耆及奭别賜大字四軸晏殊謝表曰乾文綺粲睿筆鸞回文皇鳳字近愧於流芳炎帝穗書逺慙於逸品宜登册府永冠書林天禧中仁宗在東宫賜張士遜十二字曰寅亮天地弼豫一人又曰日新其德蘇軾為頌二篇又以忠孝字賜士遜天聖書古詩乾興書唐賢詩見講禮記見講論語天聖賜中書樞密飛白扇皇祐賜飛白筆法字見乾興飛白書皇祐三年十月丁丑飛白書筆法二字賜講讀官各一軸時趙師民歸青州命就賜之皇祐以後每嵗重午節必賜飛白書扇夏竦觀飛白有輕素飄吹長煙疊空及戲蝶騰虹之句帝宸翰遒逸筆勢有法飛白尤為妙筆天聖賜進士中庸天聖五年四月辛卯賜進士王堯臣等聞喜宴于瓊林苑中使賜御詩又人賜御書中庸篇各一軸自後遂以為常初上欲賜中庸先命中書録本既上乃令宰臣張知白進讀至修身治人之道必使反復陳之上傾聽終篇始罷是嵗進士三百七十七人景祐元年四月乙卯賜新第張唐卿詩及中庸詩云寒儒逢景運報德合如何慶厯二年四月己亥又賜楊置皇祐元年四月戊子賜馮京御詩及中庸五年四月壬辰賜鄭獬嘉祐二年四月乙亥賜章衡四年四月戊子賜劉輝天聖織成飛白字圖飛白崇真殿榜篆碑額五年九月癸卯召輔臣至崇政殿西廡觀孫奭等講書賜織成御飛白字圖己酉召輔臣觀御飛白書慈孝寺崇真殿榜於承明殿崇真殿者真宗神御殿也十一月戊戌上親篆慈孝寺碑額夏竦撰文宋綬書慶厯五年十二月庚申以寶相佛閣為慈尊閣御飛白書榜賜之天聖賜進士大學篇天聖八年四月丙戌賜進士王拱辰宴于瓊林苑遣中使賜御詩及大學篇各一軸自後登第者必賜儒行或中庸大學篇寶元元年四月甲午賜新第人聞喜宴于瓊林苑賜御詩及大學慶厯六年四月丁丑賜賈黯等嘉祐六年四月丁丑賜新進士王俊民等同上天聖龍圖閣天章閣觀三聖御書賜飛白八年八月丁亥召近臣宗室龍圖天章閣觀三聖御書又詔觀瑞榖於元真殿命從臣賦詩賜御飛白書字各一軸遂宴蘂珠殿壬辰幸瑞聖園觀刈榖燕從臣天聖太清樓賜近臣飛白又見上九年閏十月二十四日戊辰宴近臣于太清樓迎陽門內後苑有太清樓貯四庫書與玉宸殿相望餞翰林學士孫奭知兖州又召太子少保致仕朝逈初奭侍講邇英至前世成敗之際未嘗不反覆諷規每至見仁宗必優禮之三請致仕召對承明殿慰諭奭以年老固請泣下上亦惻然詔與馮元講老子三章各賜帛二百匹以不得請求近郡拜工部尚書知兖州七月癸酉詔頒宴而行又留之數月乃特宴太清樓近臣及太子少保朝逈預上作飛白書大字以賜二府而小字賜諸學士獨奭與逈兼賜大小字羣臣即席賦詩又别出禁中珍器寵賁之翌日奭入謝又命講老子賜襲衣金帶鞍馬及行十一月癸未賜宴瑞聖園上既賜詩又詔近臣皆賦詩送之至和中書待詔李唐卿撰飛白三百點以進自謂窮盡物象上乃特為清淨二字賜之其六點尤奇絶皇祐二年雲臺觀道士元亨進歌詩三篇帝屬以詩又飛白清淨宇賜之劉子儀建閣藏所賜書上為飛白書曰真宗聖文祕奉之閣景祐篆律準見律類御書慶基殿景祐二年二月戊寅御書奉先院宣祖神御殿榜為慶基殿仁皇下議樂之詔以考鐘石之和置寫書之官以綴經墳之學寶元紫微閣御篆寶元元年七月庚戌作舍人院閣上親篆其榜曰紫微閣以賜之夏竦詩曰右省層楹建西清寶字宣神明逺藻畫法象出奎躔元祐中劉攽請復建紫微閣于西慶元五年御書寶元賜輔臣飛白書二年十一月二日己丑遣內侍就輔臣第賜御飛白書各一軸次日輔臣張士遜等入謝奏曰陛下萬幾之煩翰墨不倦神筆奇奧曠古未有上曰朕聽政之暇無所用心以此自娛耳康定賜翰林飛白書康定二年六月二十八日以飛白文詞字賜翰林侍讀李淑淑出守許州為飛白寶章記摹石州廨至和元年九月王洙為學士仁宗嘗以塗金龍水箋為飛白詞林二字賜之慶厯寶奎殿御書摹太宗御書大相國寺額太宗御書也至道元年五月重修大相國寺廣殿庭門廊樓閣凡四百五十五區御題額慶厯元年八月甲申上謂輔臣曰近創一小殿禁中而有司過為侈麗不欲毁其成功今大相國寺方營殿藏太宗親書寺額可遷置之吕夷簡因言陛下孝以奉先儉以率下聖人之盛德也二年正月辛未詔以大相國寺新修太宗御書殿為寶奎殿摹太宗御書寺額于石上飛白題之命宰臣吕夷簡撰記章得象篆額樞密使晏殊撰御飛白書記翔翬結宇液金填畫騰虬龍於螭首潤雲霧於翠珉二月庚寅又以針灸圖石壁堂為仁濟殿前是咸平六月甲辰車駕幸五年名後閣曰資聖慶厯邇英閣御書答邇英聖問四年三月己卯上御邇英閣出御書十三軸凡三十五事一曰遵祖宗之訓二曰奉真考之業三曰念祖宗艱難四曰思祖宗愛民五曰守信義六曰不巧詐七曰親碩學八曰精六藝九曰謹言語十曰敬耆老十一曰崇靜退十二曰求忠正十三曰懼貴驕十四曰保勇將十五曰尚儒術十六曰議釋老十七曰重良臣十八曰廣視聽十九曰功無迹二十曰戒喜怒二十一曰明巧媚二十二曰杜希旨二十三曰從民欲二十四曰謹滿盈二十五曰傷暴露二十六曰愛鰥寡二十七曰訪屠釣二十八曰講逺圖二十九曰絶朋比三十曰斥諂佞三十一曰察小忠三十二曰監迎合三十三曰約己為民三十四曰損躬撫軍三十五曰求善使過又出危竿論一篇述居髙謹危之意顧侍臣丁度等曰朕取臣僚上書及進對事目有可施於政治者書以分賜卿等度暨侍講曽公亮楊安國王洙等既拜賜因請注釋其義上許之丙戌丁度等上答邇英聖問一卷即所注釋三十五事也志儒家聖丁度傳有邇英覽十卷其序曰伏奉宣示御書十三軸仰窺聖旨皆陛下上念祖宗下思政治述安危成敗忠邪善惡之事詢謀下臣使進裨補敢不竭愚竊思自古求治之主靡不欲興理道安邦國納忠直退姦邪廣聰明成功業然行此數者在明與威斷耳明則不惑威則善柄斷則能行總是三者守而勿失非聖人孰能為之臣等嘗讀唐書見憲宗英悟留心庶政宰臣陳説政事必反覆詰問既盡其理則曰凡事言之則易行之則難卿等既為朕言則當行之勿空陳而已李絳對曰非知之艱行之惟艱天下之人從陛下之所行不從陛下之所言惟願每言則必行之憲宗深所嘉納今臣等親承聖諭敷明治要亦願陛下日與輔臣舉此事目推而行之毋使唐之君臣専美前代也上覽之終篇指其中體大者六事付中書樞密令奉行之景祐二年正月癸丑置邇英延義二閣元祐六年三月一日庚申朔御邇英閣吕大防奏曰仁宗所書三十六事禁中有否上曰有大防請圖寫置坐隅以備親覽從之大防又言危竿論一事在三十五事之前仁宗進用大臣欲更天下之治數開延閣以訪先務又降神翰以督施為慶厯崇政殿賜飛白書仁宗御崇政殿䇿賢良方正太常博士錢彥逺等實録慶厯六年八月癸亥䇿試賢良并試武舉賜宰臣賈昌朝等洎從臣御飛白書人一幅一云彥逺上所對䇿命宰相讀之因有是賜知河中府錢晦入辭上以錢氏自鏐已來世效臣順問其家傳鐡劵晦并三朝御書以進皆親識其末還之因戒以陕西民困為朕愛撫飛白安民二字以賜皇姪宗望獻所為文賜全監書又以金泥文羅御書好學樂善字賜之第中建御書閣上為題其榜年月未詳書博學二字賜翰林學士楊億慶厯崇政殿觀御書延和殿觀御書六年八月丙寅御崇政殿召近臣觀御書八年九月己亥御延和殿召輔臣觀御書慶厯飛白開先殿榜六年八月乙亥太平興國寺重修太祖神御開先殿成上飛白書榜十月己酉奉安太祖御容庚戌酌獻慶厯飛白端敏二字文儒字慶厯中仁宗以飛白端敏二字飛白筆一賜太子太傅王舉正蘇軾記之又見後八年三月書文儒二字賜學士張方平慶厯中盛夏飛白書圓扇為和平字賜趙師民賜遼使劉六符飛白書八字曰南北兩朝永通和好飛白書博學二字賜侍讀學士張錫飛白直清二字賜任布飛白帝筆二字賜向傅範飛白千嵗字賜太傳張士遜士遜進歌一章二年八月飛白清忠二字賜王德用以塗金紋羅書曰李昭亮親賢勳舊以賜晏殊得龜龍二字紹興六年十一月二十五日王洙孫楚老上慶厯皇祐御札手詔飛白賜銀帛百皇祐飛白天性字皇祐元年三月十五日飛白天性字賜端明殿學士李淑時帝以御書賜近臣淑方侍飬遣使就第賜之三年三月丁丑飛白書賜講讀官各一軸皇祐以後重午必賜飛白書扇楚建中得飛白帝字皇祐篆明堂二年九月二十一日乙巳上將祀明堂太常禮院言大慶殿為明堂即明堂及門當為殿榜如黑繒金書為明堂字殿門榜加朱繒黑字為明堂之門四字於禮為便上謂輔臣曰二榜當親書是日上於禁中服靴袍篆明堂二字飛白明堂之門四字自晝逮夜半而畢詔宣示羣臣榜于門大享禮畢藏宗正寺又詔模刻二榜為副本頒于二府及近侍被錫者皆謂不世之遇中外榮之長編九月庚子揭御篆飛白歸田録明堂額御篆以金填字門牌亦御飛白神翰雄偉勢若飛動余詩云寶墨飛雲動金文耀日晶謂二牌也歐陽修所作元絳詩曰堯章粲雲漢羲畫露乾坤日字光芒動奎鈎氣象溫紹興元年九月十一日進士黃朝美上仁宗御書明堂牌碑本詔藏於祕府壬寅進呈上曰已别書六字皇祐篆碑額皇祐中王子融以唐明皇所題裴耀卿碑額上進仁宗遂賜其兄曽碑曰旌賢又親篆冦準碑曰旌忠自王曽至程琳賜碑額者二十二人英宗二人賈昌朝宋庠神宗五人韓琦至曾公亮哲宗二人富弼司馬光徽宗二人欽宗一人篆鳳延鸞珍圖袐刻皇祐賜飛白五年九月甲戌皇姪宗懿上飛白大字十軸初宗懿進飛白書上賜更切進學飛白四字至是再上之皇祐書銅鼎鸞刀五年九月戊寅鑄鼎十有二天地圓丘用五宗廟用七又作鸞刀郊廟各一先是賈昌朝侍經筵帝問鼎卦聖人亨以享上帝今郊何以無鼎遂命阮逸胡瑗鑄銅鼎制鸞刀帝親書鼎名曰牛鼎羊鼎豕鼎皆書而刻之鸞刀亦親書刀名而書之有司皆篆刻其下劉敞獻律鐘鼎鸞刀銘四章世準進鼎頌至和寶章閣兩朝御書嘉祐迎陽門觀御書至和初五臺山真容院修殿藏太宗真宗御書二年二月丙申賜名寶章閣嘉祐二年六月癸亥御迎陽門召近臣觀御書五臺真容院寶章閣榜三年七月二十四日壬辰御迎陽門召宰臣以下觀御書妙法正覺殿額次赴天章閣觀御書至和飛白書至和二年二月辛丑召近臣觀飛白鳳翔上清宫榜于迎陽門嘉祐四年正月上賜近臣墨字以稽古二字賜劉敞堊帚之揮千奇萬巧親作飛白侍臣縱觀心合造化生成筆端書幅踰百大均寵攽仁宗遣使賜賈昌朝三聖御書凡百八十七軸陳師道仁宗御書後序神文好飛白書時一為之以侈其好將相宗戚家有藏焉會法而忘世會理而忘法所謂有其道而進於技者王者之於藝蓋如此仁宗賜文彥博御書元豐六年十二月二十九日彥博言以卷軸甚大建閣奉安仁宗作飛白書答契丹宗真蔡襄知開封賜以御書賜允弼飛白二字宗室從古善書仁宗屢以御詩及飛白賜之叔魚好學飛白好學字賜之又賜宗懿御飛白十一軸嘉祐御書文宣王廟榜見觀御書門御篆文宣王廟門并殿牌張師中進奎文光魯頌六年三月乙酉召輔臣觀之命內侍劉溫良賫往兖州嘉祐寶文閣飛白書龍圖天章閣觀三聖御書嘉祐七年十二月丙申王圭序云戊申幸龍圖天章閣召輔臣侍從諫官御史管軍臣僚觀三聖御書又幸寶文閣親為飛白書羣臣搢笏以觀命學士王圭各題嵗月及所賜臣僚名又出御製觀書詩賜韓琦以下令屬和以進遂宴羣玉殿復詔圭撰詩序刻石寶文閣序云十二月戊申紀云丙申乘暇日延羣臣觀三聖宸翰于龍圖天章閣玩心文明藻思濬發遂賦觀書之詩又幸寶文閣親為飛白書使左右縱觀驚鸞翥鳳與夫煙雲布濩之象莫不回薄於筆下蓋天縱之能世莫得以曽窺也因分賜從臣臣琦等二十八人賡宸唱以進云云壬子紀云庚子再召觀方國頃所上瑞物其木石皆有文又陳先朝述作之文復燕羣玉殿出禁中肴醴芳花異香瑰竒未見之物一云庚子再會天章閣觀瑞物復燕羣臣賜禁中花金盤香藥八年十二月乙亥英宗詔以仁宗御書藏寶文閣命圭撰記立石治平三年九月丙辰幸天章寶文閣命兩府觀圭所書仁宗御詩石刻召圭面授端明學士仁宗治迹之懿與天地同功原其本以德為元氣然後揭政令而日月之霈利澤而雨露之萃人材而淵嶽之至其心術之妙形於筆墨則又星斗爛而雲漢倬也今奎畫垂耀後世金石之刻惟飛白為多此非獨天縱之能蓋胸中之所經緯筆下之所卷舒見於治道皆一理爾觀宸札之運也騁而安迅而紆婉而徑揚之者若翔抑之者若墜放之欲周乎八極之表斂之靡失於一毫之間則凡所以綱紀庶務幹旋至化實乎此焉見之嘉祐手札七年八月丙子上謂輔臣曰皇姪少養于宫中欲以為皇子續又親書手札付外是日降手令中書密院翌日進呈丁丑召學士王圭草詔頒天下戊寅圭對于崇政殿上諭曰決自朕懷己卯詔曰立愛之道自親者始其以為皇子皇祐中僧懷璉召對化成殿親書頌詩賜之凡十有七篇璉建閣曰宸奎軾銘曰咨示東南山君海王時節來朝以謹其藏嘉祐中英宗龍潛藩邸賜記室周秉手書蘇軾為頌曰雲漢之章融為甘露結為慶雲融而不晞結而不散以燾冒其子孫治平孝嚴殿御篆治平元年十二月九日己亥英宗召輔臣觀御篆孝嚴殿額于迎陽門殿在景靈宫西南遂御延和殿賜茶二年四月丙午奉安仁宗御容親酌獻御篆賈昌朝碑曰大儒元老之碑治平賜韓琦手札四年十一月丙戌十二日命韓琦判永興兼陕府西路經略安撫使賜手札趣令治裝并封示蔡挺李肅之所奏事故事節度使辭賜窄衣束帶甲馬上以琦再世宰輔位處三公特賜對衣笏頭帶鞍轡馬仍令常服引對熙寧元年十二月手詔賜琦曰大名為天下喉襟欲除卿乙丑琦判大名復降手詔聽便宜從事沈括帥鄜延承密詔至二百七十三道胡宿有召赴天章寶文閣賜御書飛白扇詩珍幽開二典聖藻煥重離白鳯隨毫舉蒼龍應墨竒御書四民安康字賜司馬光熙寧書英德殿元年十月二十三日召輔臣觀御書英德殿牌于迎陽門元豐五年九月二十七日御崇政殿召輔臣觀景靈宫御書十一殿榜元祐書唐人詩二年九月十五日講論語終篇賜宰臣執政經筵官宴于東宫上親書唐人詩分賜之五年九月二十一日壬午御邇英閣召講讀官講書讀寶訓賜御書詩一首上親書姓名於後蘇軾得唐人紫薇花詩一篇至有驪珠三十四一日傳萬口之語元祐神宗御筆六年十月四日三省進神宗御筆七十五策陳師道詩睿思殿裏春夜半自書細字答邉臣萬里風煙入長算政和書五禮序大成殿元年三月一日議禮局請以御書政和新修五禮序摹勒立石於大常寺從之五年十月二十九日御書摛文堂榜賜學士院以學士強淵明遷承旨上為增廣直廬書榜寵之七年國子監辟雍御書大成殿榜宣和四年三月五日幸祕書省宣示御書千文十體書洛神賦行草近詩建炎書通鑑書坐右屏詳見後書郭子儀傳詳見賜書建炎二年九月十七日戊戌上書資治通鑑第四册賜黃潛善己亥宰臣謝上曰近將語孟治道處手寫入於絹屏又曰語孟誦習之熟真有可喜聖政云孟子論治道處二十二日癸卯內出親書坐右素屏旅􅋙一篇大有大畜二卦與孟子之言七凡十扇遣中使宣示宰執四年八月戊寅上手寫郭子儀傳付范宗尹示諸將韓世忠等三年七月癸未書忠勇字表韓世忠旗幟紹興三年表嶽飛旗曰精忠紹興書趙充國傳寫孝經詩書篇章元年十月書趙充國傳賜吕頥浩以下宰臣乞以墨本賜中外二年八月十六日癸卯上出所寫孝經詩書篇章宣示宰執上曰朕瞻仰古聖王之治以為規戒六年六月丁巳論營田上曰昨在會稽嘗寫趙充國傳賜諸將紹興書光武紀二年十二月丁酉諫議大夫徐俯入對俯嘗勸帝熟讀漢光武紀上書以賜之曰朕思讀之十過未若書一遍之為愈先以一卷賜卿欲知朕不廢卿言耳紹興賜吳玠親筆四年四月庚辰朔制授玠定國節川陕宣副上賜以所御戰袍器甲且賜親筆曰朕恨阻逺不得拊卿之背也紹興書無逸圖見圖類紹興書尚書中庸篇五年九月二十日庚寅賜趙鼎御書尚書一部翌日鼎奏謝上曰尚書所載君臣相戒敕之言所以賜卿欲共由此道以成治功九月己丑賜新及第汪應辰以下御書石刻中庸篇廷試畢賜御書自此始一云十月四日賜之十年五月十六日御書中庸賜秦檜書羲之樂毅論賜韓肖胄紹興賜親筆詔書五年七月壬午賜觀文大學士李綱親筆詔書奬諭綱應詔陳三策又上六條故有是賜紹興書車攻詩羊祜傳真草孝經五年十月三日壬寅書車攻詩賜宰臣趙鼎等翌日癸卯宣諭曰朕觀鴻雁車攻乃宣王中興之詩當與卿等夙夜勉勵修政事攘夷狄鼎曰陛下遊戲翰墨之間亦不忘恢復臣等敢不自勉謝表曰宵雅肄三帝書第一漢武帝以出車之詠奬衛青七年九月戊寅二十三日賜御書秦檜羊祜傳沈與求車攻詩吕頥浩樂毅論向子諲孝經蘭亭記二十六日樞密使秦檜言乞以賜臣御書羊祜列傳付有司刋石以墨本頒宰執大將侍從從之九年六月辛丑書孝經賜秦檜十三日庚戌一云辛酉秦檜乞以上所賜御書真草孝經刻之金石以翼扶世教上曰十八章乃聖人精微之學從之十三年頒御書孝經周官中庸羊祜傳于天下州學十四年七月辛未詔諸州以御書孝經刋石紹興書周易否泰卦詳見易類書裴度傳五年十月庚戌右相張浚入見上親書周易否泰卦賜之六年二月浚視師御書裴度傳賜之紹興書裴度傳六年賜右相張浚是嵗又書薌林二字賜兩浙漕向子諲紹興書大成殿榜六年十一月壬辰上書大成殿榜賜成都府學用教授范仲殳請也學殿建于東漢之初平漢人以大隸記修築嵗月刻于東楹至今九百四十三年天下棟宇之古無過于此高宗皇帝雲章奎畫昭回于天爰自飛龍之初頗喜黃庭堅體格後又采米芾已而皆置不用顓意羲獻父子手追心慕曽不數年直與之齊驅並轡紹興五年八月癸亥䇿士御書䇿問紹興書蘭亭敘七年十二月十一日諭輔臣曰劉光世喜書前日來乞朕所臨蘭亭敘亦以一本賜之因論書法甚詳遂及法帖曰其間甚有可議如古帝王帖中有漢章帝千文千文是梁周興嗣所作何緣章帝書之舉此一事其它可知豈不誤後學者髙帝大書忠正德文賜趙鼎紹興中臨王羲之所書樂毅論賜樞臣韓肖胄周必大二大政入謝德夀殿御賜書千文紹興天章寺書九年二月十二日詔紹興府天章寺寺即蘭亭也祖宗御書令守臣取進先是建炎四年巡幸江浙御書凡五百五十卷軸悉留于越至是詔取焉紹興祕閣右文殿書見閣類紹興御書玉册十年御書太后玉册上曰學書必以鍾王為法然後出入變化自成一家十二月十二日行册禮紹興書左氏史記御書石經十三年二月內出御書左氏春秋及史記列傳於祕書省宣示館職觀畢皆作詩以進是年六月內出御書周易九月四日御書尚書終篇刋石頒諸州學十一月丁卯宣示從臣聖政十三年十一月丙辰宰臣奏昨日付出御書尚書字法髙古十四年正月出御書尚書十月出御書毛詩十六年五月又出御書春秋左傳皆祕省宣示館職觀畢進詩上又書論語孟子皆刋石立于太學首善閣及大成殿後三禮堂之廊廡紹興書宣聖殿榜玉册親札詔書唐文皇帖十三年七月賜御書宣聖殿及門榜並曰大成六年賜成都學御書大成殿額御書閣曰首善癸未奉安文宣王二十六年閏十月二十七日書玉牒殿并殿門及祖宗屬籍堂榜二十九年七月二十四日乙巳右僕射湯思退等言恭覩六月十四日丁酉戒諭崇清白止賂遺詔書親札雲章奎畫超古冠今上曰朕頗留意翰墨至今不倦在唐惟太宗好二王書士大夫翕然相尚如歐虞褚薛皆有可觀朕有舊藏文皇數帖其間有好謙自牧上畏天下畏羣臣等語不惟字畫可喜其用心可為後世矜式思退請以御書刋石政事堂以墨本頒中外臣僚使出入觀省詔可繫年録云乞以上親書戒驕惰禁賂遺二詔立石尚書省紹興書乾卦御書玉堂十四年六月十四日上書乾卦賜龍圖學士秦梓三十年五月辛巳上以玉堂二字親灑宸翰賜翰苑周麟之請依淳化故事就都堂宣示宰執刻石分賜館閣官詔可俟中祕暴書俾侍從館閣官咸得觀仰仍以石本分賜紹興宸翰扇元年四月九日上親書扇賜講讀官王綯胡直孺汪藻胡交修等皆寫杜詩十四年七月二十七日以宸翰扇賜祕書少監遊操孫覿為直孺作御書扇銘曰扇出尚方寶墨未乾天縱墨妙宛若龍鸞璧月煌煌光燭蔀室子孫視之稽古之力紹興書儒行大學臯陶謨學記經解等篇賜進士五年乙卯九月賜汪應辰以下御書石刻中庸篇廷試畢賜御書自此始又見前十二年壬戌賜陳誠之周官十八年戊辰六月三日御書儒行篇賜進士王佐等二十一年辛未五月賜趙達等大學二十四年甲戌賜張孝祥等臯陶謨十七年丁丑賜王十朋等學記三十年庚辰四月賜梁克家等經解篇皆就聞喜宴日賜之舉故事也紹興淳熙御書明堂見後紹興十二年十二月庚辰上曰朕一無所好惟閲書作字自然無倦尚書史記孟子俱寫畢尚書寫兩過左傳亦節一本髙宗斷鼇立極息馬論道緝熙光明之學追嫓三五倬彼雲漢敷賁石經龍畫螺書旁分遍刻大關造化細及庶務垂則于億萬世隆興御書詩隆興元年十月十四日詔金山寺御製御書詩刋石進碑本從浙漕朱夏卿請也九年四月二十八日書荔枝賦賜閣門舍人張延年隆興書聖主得賢臣頌元年十二月二十二日拜張浚左僕射都督如故禮貌甚隆書此以賜孝宗初政御書王褒聖主得賢臣頌李德𥙿英傑論賜史浩乾道書閣榜乾道元年二月三日書風雲慶會之閣賜楊存中淳熙十一年四月九日書明良慶會之閣賜史浩建閣奉兩朝所賜御書理宗御書輔德明謨之閣賜鄭清之懋德大勳之閣賜賈似道乾道跋太上御書元年十二月劉堯仁進父光世紹興間太上皇帝臨寫王羲之蘭亭修褉序紹興七年十二月賜光世御製跋三年三月十四日御跋太上皇帝御書聖主得賢臣頌賜宰臣虞允文淳熙八年八月八日御筆賜王希吕等宜盡忠極言乾道選德殿親札七年十二月辛酉詔僕射之名不正欲採周漢舊制改左右丞相明年八年二月乙巳降詔庚戌八日宣詞臣周必大入選德殿上袖出親札云比來一二大臣同心輔政夙夜匪懈漸革茍且之風以副綜核之意虞允文可特進左丞相梁克家可正奉大夫右丞相御前設小案用牙尺壓紙一幅傍有漆匣歙研置筆墨於玉格必大書除目進呈自復道秉燭鎖院七年二月七日壬子御選德殿以立皇太子御札宣示大臣允文等奏元良天下大本陛下獨出睿斷為天下得人各再拜賀癸丑宣詔出麻制丁酉受册淳熙十四年十一月己亥手詔皇太子可令參決庶務十五年陳康伯家以紹興傳位親札來上十二月壬申遣中使密持賜宰臣必大乾道書政論六年八月二十八日孝宗臨御之九年御書漢議郎崔實政論賜宰臣虞允文等允文書于下方曰實所謂師五帝式三王棄茍全之政蹈稽古之蹤此聖學之所緝熙特稷契之佐伊吕之輔未如卒章所云臣所甚懼也惟陛下選建其人極于三五之隆乾道御書詩草書七年正月八日癸未御書郭熙秋山平逺詩賜宰臣虞允文等十一日丙戌賜左相允文養生論右相梁克家長笛賦皆太上真書又賜克家御草書古柏行一軸二月御書孫綽天台賦賜夏執中虞允文曰見石墀上皆陛下草聖筆力天縱有風動之狀乾道跋太上真行草書淳熙宣示宸翰乾道七年辛卯春以太上皇帝真行草書十卷示宰臣宋玉髙唐賦傳毅舞賦陸機文賦嵇康琴賦曹植洛神賦王粲登樓賦史節故事段陳羽古意詩蘇軾養生論周興嗣千字文三月二日御跋曰竊惟書法自東漢訖晉唐代有名家然莫不祖述鍾張憲章羲獻而各得一偏未有超軼拔乎其萃者光堯皇帝髙蹈羲皇之上遊戲翰墨之間初若無意而筆力所到自得之妙集乎大成如春雲行空千狀萬態固知天縱之能心與神會非衆庶曲學之所可及也淳熙二年三月四日葉衡奏謝宣示太上宸翰十軸令臣閲畢可飲巵酒以慶榮遇仍宣示執政侍從臺諫以其書付祕省臣欲置酒都省與執政而下侈非常之賜參政臣茂良等奏此藏在御府羣臣無繇見者上曰太上於翰墨間蓋是天縱非學力所到鍾王輩不足道翌日拜謝乞勒石率與觀臣僚奉表稱謝從之上曰當以表轉于德壽宫十一年四月二十四日以光堯宸翰洛神賦雪賦驄馬行千文臨獻之帖五軸賜史浩紹興十二年十一月十五日貴妃吳氏題御書云機政之暇擇鍾王而下三十帖親御毫素並加臨寫龍蟠鳯翥變態萬象希世之偉迹也髙宗翰墨志曰自魏晉以來至六朝筆法無不臨摹乾道書益稷篇淳熙書旅獒賜進士八月壬辰四月己未二十六日賜進士黃定等御書益稷篇先是二十日宣示輔臣梁克家奏益稷首載治水播食事末載君臣更相訓敕之意學者因宸翰味經旨必知古人用心矣上曰如無若丹朱傲等語見古者君臣警戒之深又曰聖人待天下之人先之以教及不格則以刑威之淳熙五年戊戌四月二十四日御書旅獒篇賜進士姚頴等乾道欽宗御書三朝御書七年九月二十一日吳敏孫楠進一百軸十月二十二日劉愈進二軸八年七月十二日毛奎孫勸進十軸毛勒進一百軸九年二月二日陳過庭孫述進十四軸張伯成進詔旨一軸程邵進御筆八十八軸及東宫書詩賦各一軸並欽宗伯成又進三朝御書十三軸深曽孫大觀四年六月乙亥張商英為右僕射久旱是夕大雨彗亦不見上親書商霖一尺字賜之乾道書魏徵語七年辛卯八月六日戊申上召吏部侍郎王之奇詹事陳良翰禮部侍郎周必大同對選德殿賜坐從容訪以治道久之袖出御筆一通首以魏徵答唐太宗德仁功利之問而繼書其後曰朕即位十年功則未能有成至於安養黎元俾遂生業正今日急務卿各極陳其當否若夫仁德帝王之髙致朕亦不敢自居方以魏徵之言為龜鑑耳之奇等退詣政事堂以所被御筆示宰執丙辰後殿奏事上以問大臣右相虞允文奏四者當兼修並用然德仁之責在己功利之責在人不可不察於是良翰等皆奏疏庚申上復以三從官奏牘示輔臣允文復奏今日之務莫急於論相云云淳熙書七德舞又見殿類御書扇元年五月一日書唐元稹牡丹詩扇賜吳琚六月一日書劉禹錫詩賜張子仁五年五月十五日書楊傑二軒記賜子仁十一月二十五日書白居易七德舞賜翰林學士周必大六年五月十五日御書梅詩賜步帥嶽建壽御書扇賜殿帥郭棣淳熙太上皇帝御書三年九月十五日太上書白居易大巧若拙賦賜夏執中五年三月七日太上書陸機文賦及團扇等賜工部侍郎趙磻老四月一日又賜王元之待漏院記并御書扇淳熙書杜牧戰論賜皇太子詩三年十一月一日御書杜牧戰論賜皇太子又御書詩賜皇太子嗣濮王士輵永陽郡王居廣各一軸六年五月一日書蘇轍北狄論并御書扇賜工部侍郎吳淵御書二十八將傳論賜蕭燧淳熙製秋雨詩四年八月四日東宫講畢袖出御製新秋雨過書懷詩一篇六日又蒙送示和章詞翰雙絶周必大集淳熙書舊學五年四月書舊學二字賜史浩十四年再賜史浩以舊學字淳熙摹祕閣纍朝御書八年二月一云三月二十四日詔祕書省摹祕閣所藏纍朝御書刻石從少監趙汝愚之請也凡御書法帖十卷五十六段十一年七月少監沈揆等進呈并以飛白祕閣字及贊序刻石十二年三月以名賢墨迹摹刻十三年七月畢十三年四月二日朱震之孫繼先進所賜兩朝宸翰十月二日學士洪邁進欽宗宸翰石刻付史館十四年八月趙子嵩之孫進太上賜書十五年五月王似之子進太上奬諭宸翰石刻一册十月陳康伯之孫進髙宗所賜詔書十六年正月書歐陽修琅琊山詩三首賜吳琚淳熙書蘇軾蘇轍詩七年十二月十五日書蘇軾蟠龍寺詩賜步帥嶽建壽十七日書軾和雪詩賜殿帥郭棣八年閏月既望以御書蘇軾四詩賜范成大十五年十二月又賜損齋所書蘇轍詩二軸是月辛卯書石湖二字賜成大成大跋云天縱聖能遊藝超絶典則髙古如伏羲畫體勢奇逸如神禹碑又跋云跳龍卧虎之勢漏屋畫沙之迹皆神動天隨沕穆無間譬猶叶氣絪緼蒸為雲漢輝光所麗自成文章非復世間筆墨畦徑所能擬議又書野處二字賜洪邁十年三月二十六日書三都賦序賜工部尚書知臨安王佐淳熙書詩賦製春晝詩十二年九月癸巳洪邁直禁林賜宸翰唐白居易詩二首十三年三月乙未復召對賜之酒殽出御製春晝即事絶句并以所書蘇軾一詩為寵越九日甲辰邁進詩四月辛亥天筆俯和十四年四月乙亥邁召對清華於御榻之右取宸翰宋鮑照舞鶴賦一軸賜之邁又謂雲漢昭回之妙得之自然神摹心造自古帝王名能書者所不能窺測萬分一一字之出人間祕以為寶一章之傳天下誦以為訓賜孝宗筆法之妙明堂嚴宗祀之恭經閣崇奎章之奉書楙進士之訓詩篇侈臣工之榮鈎珥昭回超冠八法十四年會慶節書心經於禁中觀堂淳熙御筆掌記上勤勞萬機每臨朝以方寸紙作掌記微偃兩旁而中摺之置在御手若內殿則留香案上三省密院各奏事畢即視所記一一宣諭已乃收之率以為常淳熙十一年八月七日後殿坐親以此紙授樞臣周必大蓋陳有功顓大舉趙善誦三人姓名玉音云此是去年臣僚薦可奉使接送伴副使者卿選擇誰可慶元光宗御筆二年五月十一日詔詳定官許及之編次太上領尹日御筆為七十一册總目一册御筆六十五軸兵籍一册十一月十一日與寬恤詔令同進嘉定祕閣御製御札目録祕閣藏御製御札六百七軸三十五册五道續藏六百五十二軸十一册挂屏扇靣九十有九嘉定三年編次為目録藏之後張守孫拭上髙宗御札二幅十月附于目録後嘉泰元年御書書之説命易之泰詩之天保以賜輔臣慶元進太上皇帝領尹判押案牘又見上二年十一月十五日上詣壽康宫恭進聖安壽仁太上皇帝領尹御筆判押案牘共七十一卷禮存謙下晉嘗紀於批箋事美英明漢亦崇於辨牘龍筋絢藻鳳尾摛華倬雲漢之為章比春秋之決事景祐三年二月甲子命崇政殿説書賈昌朝王宗道同編次太宗尹京日押字時范仲淹權知開封府上太宗所判案牘故命編次四年十一月成書凡七百一十卷端平御書張九齡進金鏡事二年正月丙辰賜學士真德秀先是德秀論致壽之道五無逸親賢以孝奉先仁有德則壽淳祐御書大學三銘元年讀仁皇訓典終篇親御奎章以禮記大學張載西銘吕大臨克已銘程皓顔樂亭銘分賜輔臣西銘明理一而分殊推親親之厚以大無我之公因事親之誠以明事天之道推人以知天即近以明逺晏殊飛白書賦昔在軒后旁羅俊英乃有蒼頡思周神明下侔羽族之迹上法奎圜之精始造古文播於寰瀛爰及東漢紀年熹平其臣蔡雍譽聞帝庭矚鴻都之蕆役掃堊帚而字成寓物增華窮幽洞靈肇此一體用飛白而為名飾宫闕之題署助聖賢之藝能厥後纍朝之臣習此奇迹代有名系存乎簡籍然猶獻之白而不飛子雲飛而不白伊唐二葉逮及髙宗咸所留意亦云盡工分賜宰弼渙揚古風若乃宫硯沉碧山爐泛清恣沖襟之悅穆拂神翰以縱橫空濛蟬翼之狀宛轉虯驂之形爛皎月而霞薄揚珍林而霧輕曳彩綃兮泉客之府列纎縞兮夏王之庭仙風助其縹眇辰象供其粹凝信一人之妙用非末學之能稱而況取象八分資妍小篆玉潔氷潤龍驤虎變合心手以冥運體乾坤之壯觀又真宗御飛白記曰銀鈎婉潤蟬翼輕濃山如礪而不泯字生金而增實又御飛白書扇賦騖思三雲灑回春之藻翰成變楷之奇文婉繞無方輕濃有制該筆苑之遒潤集書林之妍媚標王字於日中湛金波於月際六藝之逸品在昔貞觀之隆文皇念功時則有無忌師道沐鸞虯之班詔咸亨以還髙宗禮賢時則有至德處俊荷戢翼之垂訓亦有攀車受貺登牀被恩一言蒙魯衮之厚八體著羲圖之則五明在手于以見虞帝達聰之勤四座生風于以彰武王救暍之德御飛白書記日新盛德天縱多藝師心獨運冠世研精萬象奔馳於筆端三辰奮湧於毫末翩然而鸞皇飛翥蜿然而虬龍蟠躍聖域之雄觀書林之具美一字可以逾華衮羣臣莫能望清光摛染所及洪纎畢該宇宙入其胸懷風雲出乎掌握造化協其隱顯隂陽順其卷舒發虛無之藴而森為衆形收雷霆之動而歸於精象非元聖之獨智孰能預於此乎歐陽修御飛白記雲章爛然輝映日月為之正冠肅容再拜而後敢仰視蓋仁宗之御飛白也仁宗之德澤涵濡於萬物者四十餘年雖田夫野老之無知猶能悲歌於隴畝之間而況儒臣學士得望清光蒙恩寵登金門而上玉堂者乎夫玉韞石而珠藏淵其光氣常見於外也故山輝如白虹水變而五色者至寶之所在也今賜書之藏於室吾知將有望氣者言榮光起而屬天者必賜書之所在也蘇軾飛白御書記抱烏號之弓不若藏此筆寶曲阜之履不若傳此書考追蠡以論音聲不若推點畫而究觀所用之意存昌歜以追嗜好不若因褒貶而想其所與之人或藏於名山或流於四方凡見此者皆當聳然而作如望旄頭之塵聽屬車之音相與勉為忠厚而恥為浮薄或由此也夫倬彼昊天日月星辰麗焉堯之文也域彼四海江河淮漢别焉禹之畫也敘聖文神翰而不以經天緯地言之何足以形容其大哉倬彼雲漢為章于天言天子為法於天下也追琢其章金玉其相言萬民觀而樂之也經乾緯坤者典學之全功出聖入神者遊藝之餘事神動天隨超絶衆妙日行于天委照萬物之上光氣所及或流為慶雲結為丹砂初豈有意哉天縱之能溢于筆墨月璧星珠瑶札飛文玉蟾膚寸墨花泮渙秋毫精徑霜素凝鮮奎躔婉其鈎曲珠斗煥乎闌干河洛開奧神墨靈式大玄經戴神墨履靈式揮毫舉鳳拂素騰龍寶題雲蔚翠軸虯蟠袖有驪珠東壁華星榮河緑字農禾八穗漢札十行玉府神毫珠躔瑞采天文景鑠璧合珠連聖札雲回鸞驚鳳集鳳藻鸞蹤帝澤溫潤雨露下國銀鈎錦帕太一下觀百靈潛衛龍騰鳳掣出入造化躪繇轢羲前無千古天葩睿藻三二曜六五緯粃粳倉史奴僕鍾王金壺霏潤瑶管舂容轇轕三光陶鎔帝皇非煙祥風緣飾萬物取諸造物之爐錘盡用文章之斧斤昭章雲漢輝麗日月并包書林聖風雲靡英華沉浮洋溢八區墨妙筆精鸞飄鳳泊元氣淋漓不擇地而施英雲明露膏耀菅茅堯醲舜薰戛切韶濩參乾兩離瓊章寶字嫓墳襲經日星昭回被物成飾銜帝鴻之墨海掞漢宫之寶跗穗書緑字入神出天金壺琳鈕娛遊翰墨琁跗犀植奎鈎奮芒河龍獻勢斟酌元化秋毫膚寸得心應手渾然天成八文六義隂藏陽覩龍踠龜負與奎璧日月激衝光明湯盤禹鼎之字方之陋矣天摹神畫不落雕斫鸞鳳騫翔而變態煙雲舒卷以呈姿秦峯之篆頡篇之楷倒薤之妙拂素之工研精書林垂思藝圃奮辭摛藻星漢昭回題毫拂素龍鸞點絢璧月珠星扁榜峩峩天縱聖能輔以學力既以系隆五三六經之傳清明在躬精義入神道腴德輝形於心畫混融天設八法自具妙用所潛勢逾萬鈞日光雲章垂耀縑素吉雲玉露下燭丘壑遊藝致精遂輳書聖原於道德故氣象深厚發於英華故筆勢超絶舞鳳翔鸞怒猊渴驥天球弘璧不足以喻其寶大吕黃鍾不足以喻其雅綜以造化之機軸劉以隂陽之斧斤濯以江漢之濤瀾聰明淵懿藝與道兼肆筆成書八法該備大明委照卿靄騰輝侈億萬年琬琰之傳日珥爛乎家楹星鈎灑於毫端龍文龜畫刋在翠琰光氣昭倬發蔀燭幽包羅五經之郛遊神六藝之圃一言之出四方式以為典一字之傳萬世寶以為訓雲漢動而日星垂也榮光溢河寶氣騰池五雲擁笥鳳翥龍騰前世所謂畫起平雲點蹲芒玉者不足以進於此金壺貯墨鮫人織冰宫工裁雪彌綸寶箑泛灑神毫紛如薄霧翳靈芝淡若輕雲拂初日飛白扇鈿軸寶函龜趺螭首藝協龍鸞光回星斗琬琰騰華奎璧奮芒蔭之華榱被之豐珉翔筆伸楮天垂日皎勒諸豐珉有星而景有雲而卿其光下垂遇物流形鸞鵠飛動星辰光華字裏金生行間玉潤勒諸琬琰貽諸載億與日月雲漢同垂無極心畫發舒帝中第一夫何足言羲圖頡迹如龍行天或遊或飛草書金鈎見象緑字成圖璧合珠連鸞驚鳳集奇蹤絶俗美態入神編之玉軸勒以銀繩錦帙金箋霞明日照口雖未言聲疾雷震令雖未出化馳如神心有所懷威動千里壺墨彩毫藝香却蠧芝髓為封珍寶之精下燭西崑之岫文章之氣上躔東壁之象可謂天下之妙迹域中之奇觀羲畫垂文奎鈎賁采聖藻裁篇首登歌於寶鼎宸毫結字復漬墨於金壺垂光日月動色雲煙模於琰刻奮以瑶稜上昭三光下飾萬物鳳翥龍盤經緯河洛星鈎日珥闡握乾坤天光焜煌慶雲葩郁如在上帝羣玉之府如遊太微三光之庭昭回之光照映天地婉結之妙經麗辰星玉海卷三十四
