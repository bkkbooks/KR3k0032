body:
  text: 玉海卷一百九十八宋王應麟撰祥瑞動物龍大皥龍紀景龍神龍負圖左傳大皥氏以龍紀注有龍瑞以龍命官宋志宓犧氏受龍圖畫八卦有景龍之瑞赤龍河圖者地之符也王者德至淵泉則河出龍圖漢百官表注庖羲將興神龍負圖而至因以名師與官張衡賦龍圖授羲龜書畀姒帝王世紀太昊有景龍之瑞故以龍紀官黄帝龍見史封禪書漢公孫臣云黄帝得土德黄龍見索隱曰出吕氏春秋淮南子黄帝治天下而力牧泰山稽輔之青龍進駕魏文帝雜占云黄帝録圖五龍舞河黄帝龍負圖舜黄龍負圖堯龍叙圖河圖黄龍負圖授黄帝黄帝夣兩龍授圖有魚汎白圖舜即位黄龍五采負圖以黄玉為柙玉檢金繩芝為泥顧野王符瑞圖黄帝世魚龍負圖從河中出付黄帝虞舜時黄龍從洛水出詣舜鱗甲成字舜即位與三公臨觀黄龍五采負圖出舜前文選石闕銘納龍叙之圖注堯遊河渚赤龍負圖以出尚書中候堯即位七十載修壇河洛仲月辛日禮備至於日稷榮光出河龍馬銜甲赤文緑色臨壇吐甲圖堯火德故赤龍應焉舜沈璧於河榮光休至黄龍負圖瑞應圖舜東狩黄龍負圖置舜前典引升黄輝采鱗於沼注黄龍唐有黄龍負圖旗宋志黄龍四龍之長德至淵泉則黄龍遊於池堯龍圖宋志堯觀於三河常有龍隨之龍負圖而至其文曰亦受天祐舜設壇於河至於下呉榮光休氣至黄龍負圖長三十二尺廣九尺出於壇畔赤文緑錯其文言當禪禹元命苞堯遊河渚赤龍負圖以出圖赤如綈禹二龍黄龍負舟括地圖禹平天下二龍降之禹御龍行域内既周而還宋志禹即位洛出龜書六十五字是為洪範南廵狩濟江中流有二黄龍負舟云云龍曳尾而逃吳越春秋禹㑹諸侯於塗山執玉帛者萬國濟河黄龍負舟舟中人懼禹仰天嘆曰吾受命於天竭力而勞萬民何憂於龍焉視龍猶蜿蜒顔色不變龍俛首低尾而逝博物志夏德之盛二龍降之禹使范成光御之以行域外山海經大樂之野夏后啓於此舞九代馬乗兩龍封禪書夏得木德青龍止於郊周青龍銜圖尚書中候擿雒戒周公旦即攝七年鸞鳯見蓂莢生青龍銜甲元龜背書宋志周公旦與成王觀於河洛沈璧禮畢王退俟至於日昧榮光並出幕河一作塞河青雲浮至一作浮洛青龍臨壇銜玄甲之圖吐之而去禮於洛亦如之玄龜青龍蒼光止於壇背中刻書赤文成字周公援筆寫之漢龍見八龍漢文帝十五年春黄龍見成紀上乃下詔議郊祀服色宣帝甘露元年四月黄龍見新豐二年春正月詔曰黄龍登興黄龍元年二月見廣漢因以冠元伏侯古今注髙祖五年見華陽池十餘日九年見長安五鳯四年出廣漢甘露元年見新豐二年見上郡騰耀五色升天丞相以下上壽成帝鴻嘉元年冬見真定永始二年見東萊光武建武十二年六月黄龍見東阿章帝建初三年見汝南五年八月零陵獻芝草有八黄龍見於泉陵古今注曰見零陵泉陵湘水中論衡前世龍見不雙芝生無二甘露一所今上嗣位以來八龍並出十一芝累生甘露流五縣德盛故端繁也今上謂章帝東觀記元和二年黄龍四見宋志元年以來至章和元年凡三年黄龍四十四見郡國元和中青龍白龍見郡國封禪書宛宛黄龍興德而升招翠黄乗龍於沼魏黄龍見龍陂青龍魏志黄初三年黄龍見鄴西漳水北海王袞上書贊頌詔曰昔唐叔歸禾東平獻頌青龍元年正月甲申青龍見郟之摩陂井中二月丁酉幸摩陂觀龍改陂為龍陂髙堂隆傳青龍中復崇華殿時郡國有九龍見改曰九龍殿繆襲青龍賦見初學記劉劭龍瑞賦太初七年春龍見摩陂晉龍見郡國泰始元年十二月武帝初受禪白龍二見於郡國二年青龍十黄龍九見弘農澠池五年青龍十見於滎陽二月辛巳白龍見於趙國六年夏四月白龍二見於東菀咸寜二年六月丙甲白龍二見於新興井中十一月白龍二見梁國太康元年八月白龍三見於永昌三年閠四月己丑白龍二見於濟南五年正月己亥一云癸卯青龍二見於武庫井中六年九月白龍一見京兆九年十二月戊申青龍黄龍各一見魯國宋元嘉二十五年黒龍見玄武湖北唐龍見貞觀三年五月癸亥龍見玉女泉二十年十一月汾州言青龍白龍見白龍吐物初在空中有光如火至地陷入地二尺掘之得玄金太宗生有二龍之符龍池見前桞宗元有賀滄州進白龍見圖唐黄龍再見景龍二年六月十五日黄龍再見於牛山潘炎賦曰非同上天之五蛇有異渡江之一馬秦夢立乎鄜畤漢時見於成紀彼皆一至此則重光錯甲鏤鱗分官紀號趨紫鳯於丹穴越青鸞於女牀二年九月五日見於工黨伏牛山之南岡賦曰龍之至兮歸有德符於黄兮土之色將衒甲以無比與負舟而不同祥符崇政殿觀龍元年五月二十八日丙午召輔臣於崇政殿北廊觀中使任文慶於茅山郭真人池所獲龍體長二寸許鱗細腹如玳瑁帝作觀龍歌復送茅山池麟瑞獸黄帝麒麟在囿漢白麟馬融廣成頌宿麒麟於西園注尚書中候曰黄帝時麒麟在囿漢武紀元符元年冬十月幸雍祀五畤獲白麟作白麟之歌朝隴首覽西垠雷電尞獲白麟爰五止顯黄德元封元年用事華山至於中嶽獲駮麃郊祀志郊雍獲一角獸若麃然有司曰陛下肅祗郊祀上帝報享錫一角獸葢麟云於是以薦五畤畤加一牛以燎賜諸侯白金以風符應合於天也注改元狩元年終軍傳獲白麟一角而五蹄宋志漢武太始二年三月獲白麟司馬相如封禪書犧雙觡共抵之獸濯濯之麟游彼靈畤孟冬十月君徂郊祀馳我君輿帝用享祉班彪傳注太始二年獲白麟司馬遷作史記絶筆黄帝白鹿南夷獻鬯澤獸宋志黄帝時南夷乗白鹿來獻鬯澤獸黄帝時廵狩至於東濵澤獸出能言達知萬物之精以戒於民為時除害賢君明德幽逺則來趹蹄者后土之獸自能言語王者仁孝則來禹治水而至說文神人以廌遺黄帝湯白狼銜鈎宋志湯云云有神牽白狼銜鈎而入商廟白狼宣王得之而犬戎服公羊疏宋氏云命以赤烏故周尚赤湯以白狼故尚白禹以玄珪故尚黒田俅子成湯都亳有神手牽白狼口銜金鈎而入湯庭論衡湯起白狼銜鈎郭璞白狼贊應符變質乃銜靈鈎惟德是適出殷見周瑞應圖王者仁智明哲即至動凖法度即見周宣時見而犬戎服崔融賀白狼表金精景鑠玉毳霜翹周麒麟遊苑宋志成王麒麟遊苑易正義周時獲麟乃為漢髙之應漢時黄星後為曹公之兆呉越春秋禹云云鳯皇棲於木麒麟歩於庭蔡邕麟頌曰皇哉大角降生靈獸視明禮修麒麟來孚在郊毓質游畤呈祥宋志九尾狐文王得之東夷歸焉漢章帝元和中九尾狐見郡國穆天子傳甲辰天子獵於滲澤得白狐玄狢以祭於河宗漢騶牙白鹿白虎史記建章宫後閣有物狀如麋東方朔曰騶牙也逺方當來歸義而騶牙見其後一嵗昆邪王降封禪書武帝苑有白鹿以其皮為皮幣以發瑞應造白金焉宣紀神爵元年詔曰元康四年南郡獲白虎後漢紀章帝建初七年十二月癸丑幸長安進幸槐里岐山得銅器又獲白鹿宋志十月得白鹿於臨平白東觀書元和二年白鹿見元和三年虎見彭城安帝延光三年七月馮翌潁川白鹿見六月扶風言白鹿見雍伏侯古今注孝和永元中豫章餘于得白鹿髙丈九尺鄭弘傳為臨淮太守白鹿方道挾轂而行宋志白鹿王者明惠及下則至不暴則白虎仁瑞應圖天鹿純善之獸王褒講德論昔文王應九尾狐而東夷歸周武王獲白魚而諸侯同辭周公受秬鬯而鬼方臣宣王得白狼而夷狄賔今南郡獲白虎亦偃武興文之應也獲之者張武武張而猛服也是以北狄賔洽漢騶虞司馬相如傳囿騶虞之珍羣般般之獸樂我君囿白質黑章其儀可喜旼旼穆穆君子之態師古曰謂騶虞也兹爾於舜虞氏以興文頴曰百獸舞則騶虞在其中矣東京賦圉林氏之騶虞注林氏山名騶虞義獸山海經曰林氏有珍獸大若虎五采畢具尾長於身其名騶吾乗之日行千里劉芳詩義疏曰騶虞或作吾三禮圖尚書大傳說散宜生等之於陵氏取怪獸尾倍其身名曰虞鄭云葢騶虞也周書曰英林酋耳若虎豹尾長三倍其身於陵英林聲相近孫氏符瑞圖云白虎西方義獸白色黑文晉中興書白虎尾參倍其身詩注騶虞義獸也白虎黑文不食生物有至信之德則應之疏鄭志張逸問傳白虎黒文荅曰周史王㑹云周禮疏異義韓魯說騶虞天子掌鳥獸官賈誼書云騶者天子之囿也虞者囿之司獸也典引擾緇文皓質於郊漢馴象武紀元狩二年夏南越獻馴象應劭曰教能拜起周章從人意也漢黄支犀平紀元始二年春黄支國獻犀牛注應劭曰黄支在日南之南去京師三萬里師古曰犀狀如牛四足類象黒色一角當額鼻又有小角章紀元和元年正月日南獻生犀白雉前西域傳烏弋有桃拔一名符拔似鹿師子犀牛後西南夷傳永元六年永昌郡徼外莫延慕義遣使譯獻犀牛大象漢九真竒獸宣紀神爵元年三月詔曰廼元康四年九真獻竒獸注晉灼曰漢注駒形麟色牛角仁而愛人西都賦九真之麟注同宣紀大宛之馬黄支之犀條支之鳥殊方異類至於三萬里爾雅注九真獵得一獸大如馬一角即驨也哀紀禁郡國無得獻名獸漢白兔光武紀建武十三年九月日南徼外蠻夷獻白雉白兔古今注成帝建平元年山陽得白兔章帝元和二年白兔見宋志白兔王者敬耆老則見章帝元和中見郡國魏黄初中郡國十九言白兔見瑞應圖王者恩加耆老則見抱朴子鹿兔壽千嵗滿五百嵗則色白晉泰始五年七月己亥見北海咸寜二年十月癸亥見河南元帝時王廙作白兔賦通鑑外紀周宣三十年有兔舞於鎬京漢北海一角獸麒麟見郡國古今注章帝建初二年北海得一角獸大如麕元和二年麒麟見陳章紀章和元年七月壬戌詔曰乃者鳯凰仍集麒麟並臻東觀記麒麟五十二安紀延光三年七月潁川麟見宋志元和二年至章和元年凡三年麒麟五十一見郡國一角獸天下平則至三角獸法度修則至典引肉角馴毛宗於外囿晉白麟騶虞晉紀武帝泰始元年十二月二年十二月麟見郡國宋志云元年十二月見南郡咸寜五年二月甲午白麟見平原九月甲午麟見河南太康元年四月白麟見頓丘成帝咸和八年五月己巳麒麟騶虞見遼東簡文咸安二年三月騶虞見豫章安帝隆安二年十月騶虞見新野宋志元帝大興元年正月戊子麟見豫章郭璞麟賛薛綜有頌晉白麞宋志白麞王者刑罰理則至晉咸寜二年七月壬辰見魏郡天鹿者純靈之獸也五色光耀洞明王者道備則至角端者日行萬八千里又曉四夷之語明聖在位明達方外幽逺之事則奉書而至咸康八年七月燕國言白狢見永和十二年九月甲申白兔見鄱陽太守王耆之以獻并上頌一篇殷仲堪上白鹿表白者正色鹿者景福宋元嘉二十年十二月白熊見新安唐麟趾髙祖武德三年七月鄯州言麟見髙宗龍朔三年十月十六日絳州介山麟見二十六日含元殿前麟趾見十二月庚子詔明年正月改元麟德銀臺閤内並覩麟趾憲宗元和元年麟見東川段文昌平淮碑云見巴賔之間見嘉禾草木疏麟麕身牛尾馬足黄色圓蹄一角角有肉音中鍾呂行中規矩王者至仁則出公羊曰仁獸有王者則至也毛公曰信而應禮以足至者貞觀二十年二月鄆州言一角獸見顯慶元年二月岐州獲一角獸開元七年閏七月揚州奏一角獸見李嶠賀麟跡表祥開紫掖瑞感玄枵春秋緯嵗星散為麟機星得則麟生隋義寧二年仁壽宫獲白麟更郡曰麟遊唐騶虞圖武德二年六月澤州言騶虞見五年正月豐州言騶虞見七年仁州見九年十月沂州言騶虞見太宗貞觀二年十月安州言騶虞見六年四月楚州見九年閏四月衡州十年三月襄州十五年四月慶州十九年二月徐州二十一年十月南代州見太和元年十一月河中薛平奏虞鄉騶虞見畫圖進上百官稱賀孫氏瑞應圖王者德至鳥獸澤洞幽冥則見白居易有騶虞畫贊唐麟見武德九年九月西麟州言麟見貞觀三年五月乙丑豳州言麟見九年十二月獲麟於德州十一年五月麟見京師之後苑開元元年十二月麟見於峽州唐白鹿武德二年正月壬子麟州獻白鹿九年六月益州獻白鹿貞觀八年四月沂州言白鹿見十年二月見於九成宫之冷泉谷十三年正月濟州獻白鹿十七年閏六月丹州獻白鹿十八年八月趙州獻白鹿二十年九月澤州見開元十三年五月甲午潞州白鹿見二十三年二月丁未緜州白鹿見天寳四載八月戊子有斑鹿産白鹿於苑中獻之上曰縞質霜毛變林虞之獸族殊姿馴性實雲駕之龍媒貞元十四年九月丁夘中書賀苑中獲白鹿元和十年五月壽昌殿南獲白鹿麑權德輿賀醴泉獲白鹿表漢得之於槐里齊獲之於敏丘虞世南賦素毳呈采霜毫應圖李䝉上林白鹿賦畫轓為飾緣繢稱珍炯如玉立皎若霜萃勁角昭勇縞色呈鮮質皜耀以霜潔角林離而玉秀令狐楚表周因征伐而獲漢自郊祀而録魏文帝初郡國奏白鹿十月見晉泰始八年十月見扶風太康元年三月見零陵泉陵五月甲辰見天水元帝建武元年五月見髙山縣大興三年正月白鹿二見豫章四月見晉陵延陵成帝咸和四年五月甲子見零陵洮陽七月長沙獻之九年八月見長沙咸康二年七月見豫章大元十六年三月癸酉豫章守范甯獻白鹿一十八年五月辛酉見江乗二十年九月丁丑見巴陵唐白兔開元十一年二月赤兔見后土壇宋志赤兔王者德盛則至十五年四月彭州言白兔見永泰二年乾陵得赤兔大厯六年獲白兔於太極殿内廊貞元十五年五月丁巳延州進玄兔十八年八月徐州獻嘉瓜白兔桞宗元賀表金風發祥白兔來擾告有秋之嘉應著成嵗於神功韓愈賀徐州白兔狀瑞兔毛質皦白天馴其心其始實得之符離安阜屯兔隂類也又窟居狡而伏逆象也今白其色絶其羣也馴其心化我德也人立而拱革而從人且服罪也符離實戎國名在軍田武德行也不戰而來之之道也貞元十二年太原李說進嵐州白兔狀白為正色兔實仁獸皓質玉立素毛霜垂清明不遜於殷狼皎潔可齊於周鹿標中瑞之科皓然養素恬爾守柔方弘三靣之仁果應千齡之瑞權德輿賀河陽白兔云惟此瑞獸是稱月精來應昌期皓然雪采純孝之感蔣防賦乗金氣而來因月輪而下飲玉池食瑶草氷光雪影賀表豈比魯傳趙郡獨歌如練之詞實同晉獲壽春又繼凝鉛之詠來從月窟疊霜毳以䝉茸獻自梁園粲氷毫而皎潔増輝瑞諜歸美皇猷恊太隂之瑞應千歲之祥靈㕙效珍晉張浚頌被白含文梁簡文白兔表四靈可邁既騐玉衡之精千嵗變采有符明月之狀豈殊丹岫之羽下止帝梧庶比素質之禽得游君囿庾信頌光鮮越雉色麗秦狐月徳符祥金精表瑞唐獬豸開元十九年九月神羊産京兆興平二十年三月有一角獸肉角當頂白毛上捧識者以為獬豸宋志獬豸知曲直獄訟平則至漢書注張揖曰獬豸似鹿而一角人君刑罰得中則生於朝廷主觸不直者獬豸賦歩玄墀以龍擾向彤庭而鶚視爾羊來思其儀孔嘉望表知裏揆瑜識瑕騰䨇眸而舉枉聳特角而觸邪神直簪筆風清衣繡分兩造之疑冠百祥之特守法者仰之以司南疾惡者投之於有北扶直指之角象繩愆之性唐舞象白象德宗大厯十四年閠五月丁亥放舞象三十有二於荆山之陽㑹要澤州奏慶雲詔曰時和為嘉祥邕州奏金坑詔曰以不貪為寶真臘傳大厯中婆彌來朝獻馴象十一時德宗即位珍禽竒獸悉縱之蠻夷所獻象蓄苑中元㑹充庭者凡三十二悉放荆山之陽常袞賀文丹國獻白象十一頭表隨萬國而來庭與百獸而率舞如知禮樂之節益盛羽儀之容獨孤授放馴象賦弭雄姿而屈猛志返諸林邑之野歸爾梁山之隅時在偃兵豈嬰乎燧尾上惟賤賄寜恤乎焚軀食豐草以垂鼻出平林而瞪目感以和樂亦參乎百獸率舞奚必充帝庭之實駕鼔吹之車周驅犀象漢郤駿馬爾雅南方之美者有梁山之犀象孟子周公驅犀象而逺之春秋運斗樞瑶光之星散之為象郭璞贊象實魁梧體巨貌詭呉賀齊為新都太守孫權出祖道作樂舞象權謂齊曰今定天下使殊俗貢珍狡獸率舞非君而誰晉咸康六年林邑獻象一知跪拜晉諸公讚曰南越獻象養之臯澤之中宋元嘉元年十二月丙辰見零陵六年三月丁亥見安成人君自養有節則至建隆白兔頌至道赤烏白兔黒兔建隆二年三月壬戌鄆州獻白兔王著作頌乾德六年作玉兔旗頌曰仁施動物各得其宜兔擾中林不浴而白無思不服覿德則純不角不牙秀出中山之族自形自色皎同空谷之駒至道元年四月二十九日乙巳知通利軍錢昭序表獻部内所産赤烏白兔各一表云烏稟陽精兔昭隂瑞報火德繁昌之兆示金方柔服之符念兹希世之珍罕有同時而見望宣付史館從之上謂侍臣曰烏色正如渥丹信火德之應也五月戊辰開封尹壽王上言太康縣招慶鄉華陽村民獲黒兔一以獻帝謂宰臣曰黑兔之來國家之慶也吕端對曰黒者北方之色兔即隂類將有逺方望風稽首於北闕之下乎雍熙四年七月辛巳銀州獻白兔咸平四年五月戊子亳州貢白兔詔還之祥符四年八月丁未又獻之元年十月乙未光宻州貢白兔六年八月甲子興元獻白兔九年九月遼州獻白兔天聖九年五月宿州熙寜四年九月廬州並獲白兔周顯德元年汜水獻紫芝三年潁州獻白兔四年五月癸夘學士陶榖進頌玉兔曲毓質雪園淪精月殿表記周宣舞鎬之年外攘復古按韓愈辨徐之說不戰來戎乾德馴象見後太平興國七年閏十二月庚寅占城國遣使乗象入貢方物詔留象南海豢養之八年九月丙子占城獻馴象能拜伏詔養於寜陵縣開寶祥符白鹿開寶七年瓊州獻白鹿加仙鹿旗祥符四年正月庚子緜上得之陳堯叟取以獻七年二月幸亳州以真源所進靈芝白鹿列天書前天禧三年十月十八日後苑觀滑州所獻鹿瞻彼中林震於珍物甡甡於野標一角以為竒濯濯其儀閱千齡而成白宛如雍畤之符來伏文王之囿皓質玉映周穆王伐犬戎得四白鹿以歸太平興國祥麟雍熈一角獸興國九年十月癸巳嵐州獻牝獸一角角端有肉詔羣臣參驗徐鉉等以為祥麟有司作祥麟曲仁獸效祥星枵耀芒在郊毓質㳺畤呈祥雍熈二年閠九月己亥坊州進一角獸御崇政殿召近臣等觀之昔嵐貢者麟今坊貢者麒命豢於苑中嘉祐三年六月丁夘交趾貢異獸二八月二十五日癸亥御崇政殿召輔臣等觀之司馬光作交趾獻竒獸賦其狀熊頸而鳥噣豨首而牛身與夫雕題卉服之士南金象齒之珍欵紫闥而坌入充彤庭而並陳翔舞太和涵濡茂澤殊俗嚮臻靈獸來格雖漢室之初黒鷼貢於絶徼周家之隆白雉通於重譯不足方也宗室叔裒進異獸歌太平興國白鹿見總瑞淳化元年四月殿中丞宋炎言皇帝御極以來瑞牒昭著羽族之祥三十有七蹄角之瑞二十有六草木之異雲露之應不可具載願以付史館從之淳化秘閣圖畫有李賛華千角鹿黄昌白兔皆一時之絶慶元瑞象慶元六年十月嘉泰二年九月開禧元年八月真里富國貢瑞象乾德五年八月有象自嶺南來至都城外獲之其後呉越廣南交州繼獻馴象四十五頭於南薫門外玉津園東北置養象所作馴象旗熈寜六年七月頒南郊教象儀制瑞馬伏犧龍馬出河書注伏犧氏王天下龍馬出河遂則其文以畫八卦謂之河圖宋志龍馬者仁馬也河水之精黄帝澤馬飛黄服皁淮南子黄帝治天下飛黄服皁髙誘曰飛黄如狐背上有角乗之壽三千歲又有澤馬曰吉良瑞應圖騰黄神馬一名吉光選赭白馬賦黄帝陟位飛黄服皁郊祀歌日出入章訾黄何不徠下應劭曰一名乗黄龍翼馬身黄帝乗而仙封禪書招翠黄乗龍於沼堯龍馬圖見壇類舜乗黄宋志舜時景星出房地出乗黄之馬禹飛莵呉志飛莵者神馬之名日行三萬里禹治水勤勞厯年救民之害天應其德而至騕褭神馬也亦各隨其方而至以明君德隨巢子夏后之興方澤出馬周吉皇乗說文馬赤鬛縞身目若黄金名曰𤭔吉皇之乗周文王時犬戎獻之公羊疏禮說云文王得白馬朱鬛大貝元龜禮緯白馬朱鬛瑞於文王山海經大封國有文馬縞身朱鬛名曰吉良乗之壽千嵗漢余吾馬渥洼馬見馬政漢滇池神馬見白烏漢澤馬魏澤馬晉滇池神馬梁寶馬頌東京賦擾澤馬與騰黄宋志騰黄者神馬也漢元和中神馬見郡國魏都賦矞雲翔龍澤馬千阜注澤馬見上黨顔延之賦魏德楙而澤馬效質注黄初中於上黨得澤馬晉孝武太元十四年六月甲申朔寜州刺史費統言晉寜之滇池縣河水周廻二百餘里有神馬二匹一白一黒出於河中去岸百歩縣民董聰見之梁太清元年四月神馬出皇太子獻寶馬頌鸞眄善鳴龍儀美稱王澤效祥朱鬛降祉千天駟百龍媒秣瑶粟委芳芻唐龍馬開元十二年五月太原獻異馬駒其耳如筒左右各一十六肋肉尾無毛二十九年三月甲申滑州刺史李邕獻馬一匹肉鬉麟臆嘶不類馬聲日行三百里邕任淄青日遇一老翁云聖主將得龍馬以應太平遂於青州馬㑹思家獲而獻之桞宗元龍馬圖賛云明皇時靈昌郡得異馬於河帝西幸西入渭水化為龍泳去貞觀二年九月甘州獻白馬朱鬛開元二年正月丙寅凉州進朱騣尾白馬張說監牧頌舉其神異則騊駼騕褭乗黄兹白朝刷閬風夕洗天泉祥符龍駒九年十二月癸巳羣牧司言大名監産赤馬肉尾無鬃是龍駒過汗漫所不遊躡章亥所未迹伯樂所選伏波所模目散電兮彪駁喙含丹而虎呀躡紅雲而噴玉霑赤汗以攅花星精降兮河嶽動天駟入兮駑駘空夏后九代穆王八駿叶圖之駒稱徳之驥禀月精法星象噴玉勒而沫素鳴金珂而響清溢鏡光於金勒流雪采於花騘耀成華夏奪魄獯戎名超兹白瑞掩飛黄走險鹿駭望雲龍驤握負圖之瑞總服皁之靈玉海巻一百九十八
