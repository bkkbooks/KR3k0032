body:
  text: 玉海卷一百三十九宋王應麟撰兵制兵制四宋朝侍衛親軍三衙五代於唐六軍諸衛之外别為私兵藝祖詔殿前侍衛之司各閲所掌兵簡其驍勇升為上軍復籍郡國驍勇之卒致之闕下又申嚴一階一級之法使截然知分守所存臨試有法勸懲有方民不知兵而安於耒耜兵衛乎民而習於干戈去其冗濫而不使有傷財之患嚴其法制而不使有犯上之憂故能以十五萬之衆方行天下五代史五代軍制無足稱惟侍衛親軍之號今猶因之而甚重然原其始起微矣當唐末方鎮之兵凡一軍有指揮使一人而合一州之諸軍又有馬步軍都指揮使一人蓋其卒伍之長也自梁以宣武軍建國因其舊制有在京馬步軍都指揮使本方鎮軍校之名後唐因之至明宗時始更為侍衛親軍馬步軍都指揮使康義誠為之當是時天子自有六軍諸衛之職六軍有統軍諸衛有將軍而又以大臣宗室一人判六軍諸衛事此朝廷大將天子國兵之舊制也而侍衛親軍者天子自將之私兵也推其名號可知矣後唐秦王從榮以河南尹為大元帥典六軍天子自為之將則都指揮使乃其卒伍之都長耳然自漢周以來其職益重漢有侍衛司獄凡朝廷大事皆決侍衛獄是時史弘肇為都指揮使與宰相樞密使並執國政然是時方鎮各自有兵天子親軍不過京師之兵而已今方鎮名存實亡諸六軍諸衛又益以廢朝廷無大將之職而舉天下內外之兵皆屬侍衛司矣親軍之號始於明宗其後又有殿前都指揮使亦親軍也皆不見其更置之始今天下之兵皆分屬此兩司矣殿前司始於周世宗太祖為殿前都虞候初詔募壯士送京師命太祖擇武藝精髙者為殿前諸班而置都點檢位都指揮使上太祖由此受禪後周顯德三年十月甲申以太祖皇帝兼殿前都指揮使十二月壬申以張永德為殿前都點檢建隆二年閏三月戊辰慕容延釗罷自是都點檢不除建隆二年七月庚午髙懷德罷殿前副都點檢自是亦不除殿前司與侍衛司馬軍步軍為三衙唐制有十二衛為南衙漢之南軍也六軍為北衙漢之北軍也末年以大臣總之其實兩司而侍衛司都指揮使外又分置馬步軍都指揮使殿前司亦參馬步軍總於都指揮使兩司三衙合十一員分天下兵而領之此祖宗制兵之大略也三衙用邊臣戚里及軍班出身各一人太宗時侍衛都虞候以上各置十員職位相亞易於遷改且使軍伍素相服習邊藩緩急亦得選用故事擇邊將有威望者為三衙軍政號令則在密院舊制不許接坐宰相坐待漏院管軍於簾外倒杖聲喏而過與漢周間異矣次朝廷待遇二帥禮繼二府而不入品序止於本官為政和四年六月詔有司定班序古者天子必有親兵實自將之以備不虞強主威漢北軍唐神䇿之類是也祥符八年六月四日詔宣取兵士見御寶文字乃得交付建隆元年正月辛亥酬翼戴之勳殿前副都點檢則髙懷德都指揮使則王審琦侍衛馬步軍副都指揮使則石守信都虞候則張令鐸馬軍都指揮使則張光翰步軍都指揮使則趙彥徽後唐明宗時藥彥稠遷侍衛步軍都虞候無雍熙以來田重進傅潛王超繼為都虞候自超罷職復任者殿前司都指揮使副都虞候副國初有都點檢後不復置國朝兵制禁軍殿前侍衛司分領之殿前司領騎兵之額三十七步兵之額二十六侍衛司領騎兵之額三十五步兵之額八十三御前忠佐軍頭司領步騎之額四皇城司領步兵之額二左右騏驥院領騎兵之額二兩朝志殿前司騎軍額三十步軍額十有六侍衛司騎軍額三十有三步軍額五十有六占建隆三年十一月甲子殿前侍衛兩司將校毋得冗直兵限其數著于令乾德四年閏八月乙亥詔諸軍不得選軍中驍勇自為牙隊司景德四年十月丁未樞密院上新置殿前侍衛將校具員侍衛馬軍都指揮使以節度使充副都指揮使以觀察使以上都虞候以防禦使以上充侍衛步軍國初有都指揮使副使都虞候自後多缺乾德四年六月杜審瓊權知步軍事神宗史志殿前侍衛司以節度使為都指揮使而副使都虞候無定員以刺史以上充備則通治缺則互攝兼統制四廂軍設吏殿前二十八馬司十八步司二十四各分案六殿前有神武宣武驍騎上下軍寧朔驍勝虎翼左右五軍各十指揮並有指揮使都虞候馬軍有雲騎武騎各十指揮步軍有虎翼左右五軍十指揮每軍有指揮使一員都虞候副之范祖禹曰樞密有發兵之權而無握兵之重二帥有握兵之重而無發兵之權彼此相維不得專制所以無兵變也熙寧中裁定神衛剩員萬有千人官制正名歸步軍司凡軍校遷至軍都指揮使又遷則遙領刺史又遷為廂都指揮使則遙領團練使員隘則從上落軍職為正團練刺史之本任或為他州總管鈐轄哲宗史志殿前司掌殿前諸衛殿陛出則扈從乘輿大禮則提點編排整肅禁衛鹵簿儀仗掌宿衛之事侍衛親軍馬軍步軍司掌馬軍步軍諸指揮之名籍藝祖平定天下養兵止二十二萬而京師十萬餘明強幹弱枝之勢也如周畿兵如漢中壘宋朝六軍龍武羽林神武六軍掌郊祀朝會儀仗判司官一人以判金吾街仗將軍兼領左右各三軍自左右衛以下官名存而事廢太祖太宗朝以處將帥後多以皇族為之天禧元年令內職兼攝環衛熙寧三年令邊將統攝咸平五年加楚王元佐左羽林上將軍舊制六軍置統軍無上將軍之名蓋有司之誤祥符八年二月丙寅元佐天䇿上將軍治平三年九月詔六軍更不除上將軍宋朝四廂軍職官志殿前司有捧日天武左右四廂馬軍司有龍衛左右廂端拱初以龍衛左廂都指揮使孔守正習練軍旅特置龍神衛四廂都指揮使以寵之端拱元年十月甲子置四廂都指揮使以范廷召孔守正為之步軍司有神衛左右廂各有都指揮使每軍有都指揮使都虞候每指揮有都副指揮使每都有軍使副兵馬使捧日舊曰日騎舊曰鐵騎興國二年改日騎雍熙四年改天武舊曰控鶴興國二年改龍衛舊曰龍捷興國二年改神衛舊曰虎捷興國二年改長編興國二年正月庚辰以美名易禁軍舊號揮國初張光翰虎捷左廂趙彥徽虎捷右廂都指使捧日四廂管舊城左廂及殿前司馬軍天武四廂管舊城右廂及殿前司馬軍龍衛四廂管新城左廂及馬軍司馬軍神衛四廂管新城右廂及步軍司馬軍謂之上四軍各有左右廂廂各三軍王城之兵以內政寄令立廂部之帥總車騎之軍拱嚴軒陛徼循都城之周之七萃漢八屯左右廂起於唐本用李靖兵法諸軍各分左右廂統之自府兵法壞京師變為彍騎謂之禁兵諸道變為長征謂之鎮兵昭宗之末禁旅盡矣朱梁以方鎮建國遂以鎮兵之制用之京師京師兵有四廂而諸軍兩廂其廂使掌城郭煙火之事而軍旅漸有廂軍之名自周世宗於方鎮寄招禁軍别立營部由是州郡始有禁軍太祖作階級法專治禁軍而天下鎮兵通謂之廂軍張洎謂甲卒戰馬數十萬萃京師熙寧三年五月置左右廂公事所以京朝官分治京城四廂從韓維之請也紹興十三年五月甲子兵部郎錢時敏言今將享廟及郊當用仗內馬步導從之人而龍神衛上四軍未及舊額三分之一詔殿前馬軍司招填宋朝捧日奉宸隊紹興宿衛親兵黃帝以師兵為營衛周有虎賁旅賁秦置宫門屯衛漢置期門羽林後漢五營魏中領軍三營晉中衛左右衛江左鎮衛四軍宋齊領軍掌禁兵梁有五將軍扈衛唐初十二衛後置北門四軍梁置六軍為親衛後唐置捧聖馬軍嚴衛步軍晉改為護聖奉國周初改龍虎捷顯德置殿前諸班為親兵取唐殿前射生官之義今有殿前指揮使內殿直散指揮散都頭散祇候金槍班東西班內員寮直鈞容直散直外殿直皆馬軍又有簇御馬太宗改為御龍直復有骨朵弓箭直皆步軍捧日隊殿前諸班也奉宸隊殿前諸直也捧日謂君如日左右承捧之奉宸即唐千牛衛營嘗更是名唐朝黃麾為近仗其後七軍儀仗又為禁兵今捧日奉宸二隊稱親兵扈鹵簿捧日隊每隊三十一人奉宸隊分左右充禁衛興國九年二月御崇政殿改轉諸軍將校自軍都指揮使以下員僚以上按名籍勞績升之數日而畢先循謹能御下者武勇次之咸平三年五月御便殿遷補千三十一人四年十月己亥朔謂宰臣蒙正曰向於軍校超擢八九人委以方任五年四月謂樞臣周瑩曰國朝之制軍員有缺但權領之三嵗一遷補乃御便殿按籍次補祥符四年八月二日詔內外禁軍軍員補轉未均今汾隂轉員宜立久逺規制指揮使以下不别遷補皆自下而升龍衛不入捧日神衛不入天武寧朔如驍勝例二十日諭王欽若朕閲殿前諸班直名籍每班唯及三百人以下宜增置押班二人七年又詔殿帥曹璨等詳定密院詳酌十月詔御龍諸直為一轉員僚直拱聖驍雲騎驍勝武騎寧朔神騎以上為一轉水軍神勇宣武殿司虎翼衛聖步軍虎翼奉節廣勇神射以上為一轉天禧元年十月諸班直諸軍分三番引驗於崇正殿建隆兵樣建隆二年五月甲戌令殿司及諸州升強壯退老弱初置剩員以處退兵三年五月帝以六師老壯不等乃搜強壯曰兵樣其後更為木梃差以尺寸髙下之制謂之等杖諸州設旗給賞募之祥符中重定等杖自五尺八寸至五尺五寸為五等諸州部送闕下及等者隸次軍嘉祐二年復定等杖自上四軍至武肅忠靖皆五尺以上差以分寸而視其奉錢之數建隆飛山營二年二月丙寅幸飛山營閲炮軍乾德驍雄雄武軍乾德三年八月戊戌朔詔郡國選兵之驍勇者部送闕下九月二日己巳諸道藩郡長吏先奉詔於本城兵士內選擇驍勇者相繼到闕太祖御講武殿親閲之中選者萬餘人以騎軍為驍雄步軍為雄武仍命武臣習其行陳之勢教以申嚴之令二軍並隸侍衛親軍曾鞏曰太祖修教習之法黜老懦之兵舉中國之兵才十六萬人平五強國不知兵之少也開寶歸聖歸化軍水軍開寶七年十一月泰寧軍節度使李從善部浙中及江南水軍凡千三十九人並令黥面籍為王師以歸聖歸化為軍額太平興國易禁軍號太平興國二年正月庚辰詔改簇御馬直曰簇御龍直鐵騎曰日騎龍捷曰龍衛控鶴曰天武虎捷曰神衛骨䤪子直曰御龍骨䤪子直散手雄威曰雄勇龍騎曰雄猛以美名易禁軍之舊號也雍熙四年五月庚辰改殿前司日騎曰捧日驍猛為拱辰雄勇為神勇又改上鐵林為殿前司虎翼腰弩為神射步軍鐵林為虎翼端拱二年正月改軍頭引見司為御前忠佐軍頭引見司有馬步兩直雍熙四年置步直端拱元年置馬直熙寧四年十二月壬申詔撥入殿前司建隆二年十一月改左右雄捷驍武軍為驍捷左右備征為雲騎左右平逺為廣捷懷德為懷順太平興國皇城司在右承天門內北廊本名武德司太平興國六年十一月甲辰改今名有皇城使會要云掌皇城管鑰木契親從親事官名籍冰井務隸焉分房四設吏十有九及命婦朝會須冰幹辦官本三人熙寧元年十一月一日以七員為額掌宮城出入禁令慶厯八年臣僚上言皇城司在內最為煩劇祖宗任為耳目之寄近年員數倍多並不選擢乞止差四員選經歷有心力沈厚之人嘉祐五年十二月詳定宫殿皇城門關防條貫政和六年十一月詔嘉王楷提舉皇城司中興會要提舉官一提點二幹辦五紹興元年二月詔行在禁衛所改為皇城司三年正月二十六日造入殿門圓號千以黃入宫門方號八千以緋入皇城門圓號三千以緋紹興十三年八月錢愐除太尉提舉皇城司引見司提點一員幹辦三員以閣門官充掌禁衛軍入見之事宿趫材於中壘嚴藻衛於上蘭法鉤陳壁壘之文森玉陛干將之衛宫隅七雉實護中宸飭晨門而共法駕比夕柝以扈宸闈唐親衛城門郎重中禁尊皇居張方平曰國初循周制置諸班直屬殿前司親從官屬皇城司其宿衛之法殿外則相間設廬更為防制殿內則專用親從為親兵親從親事官五指揮每嵗換給勑號政和七年正月十八日置五指揮并班直親事官增額二千五百餘人中興皇城司親從紹興間三千七百三十餘人至嘉泰開禧增至四千八百三十餘人續又增一千餘人嘉定二年十一月二十六日議臣言皇城一司總率親從嚴護周匝參錯禁旅權亞殿巖漢以儒生位執戟唐以勳臣子弟備宿衛今請專以知閣御帶兼領淳化金吾四營淳化五年八月判左右金吾街仗魏丕以新募千餘人引對崇政殿太宗親選得五百七十人其中取身品優者三人為等分四營營設五都都有員僚節級一如禁兵之制命田守信知右街事帝以京師浩穰街司循警用禁軍非舊制特命左右街各置千人優以廩給使傳呼備盜至是始分營部令魏丕更召募以充其數至道元年八月閻承翰等為金吾都監祥符七年六月金吾引駕仗詣文德殿䂍矟堂仍祭饗紹興二年三月二十八日詔街仗司以二百人為額漢中尉即執金吾執金革禦非常緹綺執金環尹之列執金為貴咸平保毅軍民兵咸平四年九月庚寅命使臣往陜西點檢籍軍係稅人戶家出丁一號曰保毅軍官給糧賜令分番守城壘遣御史吳舊與漕臣主其事五年正月己酉舊言凡得六萬八千七百九十五人其緣邊軍士先選中者升為將軍名保捷元年初置秦州極邊保毅五月壬寅籍河南民丁為兵咸平廣捷兵咸平五年正月甲寅置廣捷兵五指揮先是帝聞南方以標槍旁牌為兵器命有司製之帝即位令內侍蕭延皓取廣德軍教習至是試於便殿悉呈其技頗精練帝以為可用捕賊守邊特立為是軍仍選神威等軍充其數六月四日以河東州兵為神鋭二十四神虎指揮十先是命張延禧乘傳料簡萬三千餘人立此軍訓習六年六月二十五日壬午以威虎十指揮隸虎翼先是邊兵扞寇虎翼多勝蓋用徑弩也時新置威虎皆材勇之士故以增之咸平初置振武指揮咸平五年五月丙辰命使臣分往邠寧環慶涇原儀渭隴麟延等州於保安保毅軍內與逐處官吏選有勇力者共二十萬人各於本州置營升為禁軍號曰振武指揮既而帝曰邊防缺兵朝廷須為制置蓋不得已也候邊鄙乂寧即可消弭景德元年七月陜西轉運司西面緣邊諸州於保毅軍內簡習成振武軍四十指揮帝曰數年前西賊逺圍靈州諸路總管遣人乘傳飛奏請授兵者曾無虛日當時以河東兵不可減遂議立此兵尚慮簡閲未精冗食邊廩又纍遣使選擇所存皆少壯拳勇漸習武藝朕詢于知兵及詳練邊事者皆云自立此軍邊聲頗振戎人知懼矣二年五月知鎮戎軍曹瑋言邊民應募為弓箭手者請給以間田蠲其賦從之至天聖六年弓箭手凡五十四指揮七千九百餘人九月詔并為二指揮皇祐三年二月涇原經略夏安期選弓箭手萬三千人分隸東西路上陳圖法三年七月十日令河北治振武軍營舍十一月罷募振武軍有願投者令隸虎翼慶厯三年正月募關中民補振武祥符初置虎翼軍神衛水軍慶厯萬勝軍初太祖置神衛水軍以習舟師及江淮平不復用祥符六年七月詔在京諸軍內選江淮習水卒於金明池試戰棹立為虎翼軍置營於池側其江浙淮南諸軍並令準此選卒置營據會要時帝謂近臣曰太祖朝多幸船場製造兵棹蓋防水路用兵時神衛諸軍立水軍以備其用及江淮已定不復振舉可於江浙淮南選取習水兵士立成指揮就以此置營故有是詔七年五月詔諸州簡兵有善水者以補神衛水軍慶厯二年九月壬子置福建廣東西澄海軍各兩指揮十一月庚辰置登州澄海水軍慶厯元年七月壬戌置萬勝軍二十指揮立神勇之上康定初元昊反詔募神捷兵然所募雜市井之人不足備戰守既而易名萬勝為二十營至和三年併為十營治平二年併萬勝悉以為神衛祥符二年五月合龍騎十二營為六六年十月合龍猛十一營為八咸平五年二月壬辰以涇原環慶騎兵之半易河北步兵紹聖四年十二月癸卯詔置都大兵籍具京師諸道兵數奏御别申樞府康定鄉兵熙寧保甲古者寓兵於農後世寓農於兵又其後也籍農以為兵名同而實異建隆四年正月始調關西鄉兵赴慶州咸平四年九月點陜西義兵稅戶家一丁號保毅五年八月詔河北忠烈宣勇軍選自鄉民無人可代者放還農康定元年十二月乙酉諸路籍鄉兵所籍強壯河北二十九萬河東十四萬命端明判兵部李淑及賈昌朝王洙郭稹同詳定其制先是吳遵路議復民兵詔籍河東鄉丁下其法於諸路三月己卯命遵路計置河東糧草實録云詳定弓手強壯通制又命王洙同判兵部修鄉兵制度慶厯二年二月乙未簡河北強壯徑勇刺手背為義勇三月乙卯又簡河東弓手武勇者為義勇陜西弓手為保捷每嵗九月農隙訓閲十月庚戌陜西言刺保捷軍凡一百八十五指揮六年三月程琳請入冬訓閲一月而罷嘉祐四年十一月二十二日大名帥李昭亮請補河北義勇闕數自來年始河北總十八萬九千人河東總七萬七千人陜西至治平初總十五萬六千人治平元年十一月十四日乙亥宰臣韓琦言唐府兵最近古今義勇河北幾十五萬河東幾八萬稍加簡練與府兵何異陜西西事時三丁選一為弓手後刺為保捷事平簡放今存無幾請刺陜西義勇自永興河中鳯翔始三丁選一六丁取二刺手背詔屯田徐億錢公紀職方李師錫往陜西除商虢外凡刺十三萬八千四百六十五人樞副胡宿請且刺緣邊軍諫官司馬光論不可不從三路鄉兵唯義勇最盛後以運糧戍邊三年十月二十五日密院言秦隴等十二州民俗尚武可以備邊請如環慶保毅給糧廩熙寧元年五月二十五日樞使呂公弼請河北每指揮擇才勇百人為上等三年十一月命陜西立教閲賞罰格十二月分七路四年五月罷提舉官呂大忠言弓箭手近屯田義勇近府兵擇用一焉兵屯可省保甲之制始於熙寧二年十二月九日乙丑司農定制先行於畿縣遂推之五路以遍于天下十家為保五十家為大保十大保為一都己未立更戌法畿內置鼓旗則四年九月二十四日之詔義勇保甲及民兵合七百十八萬二千二十人則九年府界諸路之籍親閲於元豐三年五路義勇悉改為保甲元豐四年正月庚戌也御延和殿閲試四月六日也是嵗府界河北河東陜西嵗費三十一萬三千一百六十緡而團教賞一百萬緡有竒嵗遣使提舉按閲元豐後民兵日盛募兵日衰義勇保甲隸密院民兵隸兵部五年九月辛丑也保甲五日一閲遣使遍教二路留神按閲藝精者厚賞八年詔依義勇法嵗赴縣教閲一月十月罷提舉官以提刑兼領唯冬教三月十一日又罷監教官元祐元年三月五日定監司按土兵賞格行之藝祖建京師於平土謂非重兵不足以制四海故皇城之內有諸班之兵京城之內有禁衛之兵京城之外别營猶數十里中夜則造朝入則奔趨營居西者必給東倉之米以逺其途負糧兩石不得雇代以閲其力嘗謂雖京師有警皇城之內只有精兵數萬及王安石為相思復三代民兵創教保甲而潛消禁旅國朝籍郡國及旁塞之民與丁壯以備戰守曰義勇弓箭社保毅寨戶土丁弩手洞丁槍手弓箭手敢勇蕃兵各因其方名之通謂鄉兵元祐以降民兵亦衰紹興六年柴斌請金均房保甲名保勝軍太宗籍兩河之人為鄉兵因大軍方興之威猶恐其亂乃密誡州郡尅期一日而事畢司馬光謂康定慶厯間三路新置鄉兵共數十萬何嘗得一人之力元祐四年范純仁奏畿內保甲更不教閲右丞王存言京師之地四達而平非有重山峻嶺之嶮金城湯池之固所以維御四方威制夷狄為根本之固者以營衛嚴也慶厯治平間禁廂之籍至百餘萬新城裏外連營相望其後論者以兵冗費廣乃議併營中外禁兵以五十八萬為額而京師兵籍益削於是三路添籍民兵畿內亦置保甲四時教閲使人為勝兵平日不費錢糧緩急得為武備此先帝之意也陛下即位之初罷三時之閲止冬間一教若遂不教即其法遂廢寶元二年三月乙卯閲試衛士戊午賜陜西緣邊軍士緡錢四月丁亥募河東陜西民入粟實邊康定元年正月詔陜西募強壯備邊二月甲午括畿內京東西淮南陜西馬甲寅出內庫珠償民馬直四月丙戌省陜西緣邊堡寨乙巳增補河北強壯軍六月甲辰增置陜西河北河東京東西弓手慶厯元年二月辛丑京東西淮浙江南荆湖置宣毅軍五月癸酉閲試衛士八月甲申括河北馬十一月壬子置涇原弓箭手十二月甲午置陜西護塞軍二年二月乙未刺河北義勇軍十月庚戌刺陜西保捷軍六年五月丙申詔陜西市蕃部馬紀真宗時內外兵九十一萬二千寶元以後兵百二十五萬九千治平中兵數少損猶百十六萬二千慶厯兵録瞻邊録嘉祐兵數慶厯五年丁度為兵録五篇宋祁為之序曰凡軍有四一曰禁兵殿前馬步三司隸焉卒之鋭而票者充之處則衛鎮出則更戌二曰廂兵諸州隸焉卒之力而悍者募之專於服勞間亦戌更三曰役兵郡有司隸焉人之遊而惰者入之業一事專處而無更四曰民兵農之健而材者籍之闕者輒補嵗一閲焉國家制兵大抵如此然兵無常帥帥無常鎮權不外假力不他分所以維四方憺四夷鼓行無前也太祖內輯師旅而率以節制外卑藩服而納以繩墨丁度傳五年四月庚戌為樞副建請擇河北河東陜西禁軍補禁旅之缺因上兵録五卷贍邊録一卷慶厯元年十一月二十一日中書密院請諸路將帥各置親兵月特給錢二百選武勇者詔陜西河東諸路總管置親兵百五十人招討鈐轄百人招討都監等七十人嘉祐五年樞副歐陽修與曽公亮考天下兵數及三路屯戍多少地理逺近更為圖籍志兵無常帥帥無常師內外相維上下相制等級相軋天下百年無犬吠之警此制兵得其道也兵額有四曰禁兵廂兵鄉兵蕃兵分隸殿前侍衛總管司籍藏樞密院由天聖至寶元間增募諸軍陜西蕃落廣鋭河北雲翼京畿廣捷虎翼效忠陜西河東清邊弩手京西江淮荆湖歸逺總百餘營康定初西邊用師募神捷兵既而易名萬勝為二十營議者欲益募土兵於是增置陜西蕃落保捷定功至嵐府州建安登州平海皆為禁兵內外馬步凡增數百營又京東西河北河東江淮荆湖浙建各募宣毅大州二營小州一營凡二百八十八故慶厯中內外禁廂軍總一百二十五萬及西師罷樞使龎籍奏與中書議揀汰之法用其言省兵數萬人嘉祐七年通略五月宰相韓琦上言願詔密院同三司量嵗入金帛數約可贍兵馬幾何立為定額仍核見開寶至道天禧慶厯中外兵馬之數於是詔中書樞密院同議樞密院掇祖宗已來兵數以聞蓋開寶之籍總三十七萬八千而禁兵馬步十九萬三千至道之籍總六十六萬六千而禁兵馬步三十五萬八千天禧之籍總九十一萬二千而禁軍馬步四十三萬二千慶厯之籍總一百二十五萬九千而禁軍馬步八十二萬六千視前募兵寖多自是稍加裁制以為定額治平之兵一百十六萬二千而禁軍馬步六十六萬三千校慶厯之籍減幾十萬校開寶之籍增至七十萬二千又陜西州軍悉置壯城如河北備城壘之役蓋景祐中本城四十三萬八千逮治平三年乃五十萬廂兵總諸州本城教閲騎軍之額四步軍之額六不教閲騎軍之額三十有五步軍之額一百九十有五元豐禁軍六十一萬餘人慶厯五年禁軍之數比景祐以前增置八百六十餘指揮四十餘萬人八年三月甲寅學士張方平言昨在三司計會天下財用出入之籍及建隆以來兵數太祖蓄兵不及十五萬人太宗不過四十萬人章聖備禦西北兵籍頗增祥符以後至于寶元陜西河北京東西增置保捷一百八十五指揮武衛七十四指揮宣毅一百六十四指揮江淮湖浙福建諸路又添闕百二十四指揮凡內外增置禁軍約四十三闕通三朝舊兵且八九十萬人其鄉軍義勇州闕小分剩員等不與焉太祖收天下徑兵列營闕分營於外則曰就糧者本京師之兵而廩食闕聽以家往其邊防要郡須兵屯守即遣自京闕鎮之兵亦皆更戌會要建隆四年八月以河東樂平縣降人為效順指揮乾德二年二月名遼州降軍曰順效懷恩三年四月改西川感化耀武等軍為虎捷九月五日蜀諸州置兵名以充寧興國八年闕月濮州平海改崇武至道元年二月十一日殿前司選七百餘人帝閲其趫健者教以弓矢四闕天武等軍子弟七百人三年九月真宗與近闕防曰北有徑兵號曰驍勇無廂分主之已分闕擢主兵久次為廂虞候使兼郡符咸平三年闕詔定州等無敵忠鋭定塞指揮升禁軍馬軍雲翼大中祥符元年二月詔步軍司閲保寧軍分四等第一等徙營亳之永城餘歸農畝或隸諸州為剩員闕四年九月宣示威平中簡郡兵充馬軍置闕令在驍勝下雲騎上六年四月命沿邊補闕八年正月庚寅置禁軍左右清衛指揮十闕廂兵五百人奉宫觀九年九月詔二廣湖南闕合澄海四百人名忠敢秦州曹瑋選牀子弩闕人名定功天禧元年五月瑋又選五百七十闕建威指揮六月乙亥詔選天下廂軍隸禁軍闕千餘人天聖元年九月四日蜀募奉節兵五闕升慶州安塞為禁兵七年四月河隂置水軍闕年十一月升蕃兵為禁軍在橫塞下康定元闕五日永興軍置威捷慶厯元年十月升府州闕州飛騎為禁軍十二月密院言京東西宣毅闕人赴京師改隸禁軍從之二年二月又升涇闕兵秦州韓琦請罷護塞兵增置蕃兵三年五闕東義勇願隸諸州就糧神虎宣毅禁軍者聽闕轉運使明鎬閲同州廂軍得材武者三百餘闕強弩奏為清邊軍其後陜西河東悉置此軍闕年二月詔京東選廂軍加教閲二字征役同闕年五月并州韓琦請置壯城兵五百人閏七闕淮荆湖新立就糧禁兵教閲忠節軍大州五闕州三百人六年四月二十七日置北京作坊兵闕州之鎮兵也內屬侍衛司總諸州騎兵之額闕騎射威邊至忠鋭招收步兵之額百八十三武和武肅至本城定功在京諸司之軍額有五廣牧至雜役隸宣徽院嘉祐四年五月揚廬江寧洪潭福越置禁軍曰威果八月京西立教閲廂軍治平二年八月陜西置壯城兵熙寧元年十二月十一日密院奏京東置教閲廂軍曰忠果二年正月二十三日辛卯又改團結廂軍額加教閲二字淮南曰壯武江南曰武雄荆湖曰靜江兩浙曰崇節福建曰保節四年十二月十六日密院言諸路廂軍名額自騎射至牢城凡二百二十三或因工作水陸運榷酤或因通山險隄堰郵傳馬牧而立宜并為一額五年十一月杭州置教閲捍江兵六年瀘州置寧逺武寧十月鄧州置忠果七年九月成都置武寧八年閏四月京西置教閲忠果十年五月都水監請立河清兵階級條例十一月五日廢河北監牧兵五千增置府界廣固保忠元豐二年十二月唐汝州置土兵勇捷四百人五年七月蘭州置馬軍廣鋭步軍保捷各五百人十月七日定諸路教閲廂軍名額有馬二十二無馬二百二十九指揮廂軍舊隸密院官制行分隸戶兵工三部戶兵工部置籍揭貼進册以副上樞府元祐二年二月八日之詔也以太師文彥博言本兵之府不可無籍熙寧七年正月朔頒諸班直禁軍名額諸班自殿前指揮使至御龍弩直諸軍自捧日至廣南澄海清化先是元年九月密院言鄜延正兵弓箭手保毅義勇屬戶七萬九千八百三十九人近二十六指揮計八千八百四十四人二年十月命京東漕臣併省諸軍指揮至少者三年三月併龍猛八指揮為六額三百人十一月二十三日詔諸路併諸指揮自是部伍齊肅無名存實闕者本志併營在二年通略二年八月康定慶厯以來諸軍間有併廢至熙寧中大整軍額有就而合者如龍衛三十九併為二十有以全部附隸如併入威猛廣捷而廢宣威併入神騎而廢契丹直有併營而增額者如宣武二十併為十二增一百人有易名者如驍猛以第一指揮改驍雄而廂軍沿五代制兵額參雜復命并合五年六月以併廂軍畢奬江東漕臣韓鐸熙寧三年十二月己未立更戌法壬申樞密使文彥博對資政殿上在京府界并諸路禁軍數神宗患兵之冗親制選練之法立為定額蓋熙寧之籍天下禁軍凡五十六萬八千六百八十八人上自出治平兵數參照詔殿前司虎翼除水軍一指揮外存六十指揮各五百人為額總三萬四百人在京增廣勇五指揮共二千人府界定六萬三千人京東五萬一千兩浙四千江東五千江西六千湖南八千湖北萬二千福建四千五百二廣各千二百川陜三路共四千四百人河北人數尚多須後議之陜西河東京西淮南前已撥併四年十二月詔廂軍併為一額天下凡八百四十指揮為兵二十二萬七千六百而府界不與神宗史志兵部凡聨其什伍而教之戰為民兵材不中禁衛而力足以充役為廂軍就其鄉井募以禦盜為土軍廂禁土軍因老疾而裁功力之半為剩員羌戎附屬分隸邊將為蕃兵皆以名數置籍而頒行其禁令樞密院有兵籍房元豐五年改官制議者欲廢樞密歸兵部上曰祖宗不以兵柄歸有司專命官統之互相維制於是不廢司馬公曰諸軍分畨屯緣邊及諸路使之均勞逸知艱難識戰鬬習山川皇祐格馬軍滿四百步軍五百人為一營熙寧併營陜西馬步軍營三百二十七併為二百七十馬軍額以三百步軍以四百人總撥併者馬步軍五百四十五營併為三百五十京師之兵類皆撥併畿甸諸路及廂軍總會畸零定以常額康定二年六月己亥王堯臣言陜西兵二十萬可戰者止十萬涇原最當要害請益兵三萬元豐五年六月上謂輔臣曰藝祖養兵止二十三萬京師十萬餘諸道十萬餘使京師之兵足以制諸道則無外亂合諸道之兵足以當京師則無內變外內相制無偏重之患承平百餘年蓋因於此嘉祐中宋庠言祖宗收方鎮之權常欲畿甸蓄禁兵四十萬為陳師道曰開封無山川之阻為四戰之地太祖以兵衛畿內常用四十萬人太祖言可以為利百代者唯養兵也方凶年飢嵗有叛民而無叛兵不幸樂嵗而變生則有叛兵而無叛民熙豐時內外禁旅合五十九萬人元豐兵令悉以雄節之類升同禁軍由是禁軍始遍天下藝祖聚天下精兵以強京師取太原兵以為龍衛取幽州兵以為神武左右員竂本藩鎮廳頭也左射拱聖本諸州騎兵也忠節之軍升自川陜虎翼之軍選自江淮皆總于三衙訓練精間故坐制四方如臂運指國史論祖宗故事經武聖略所列將帥凡十四人李漢超至馮繼業自建隆二年以諸郡本城共百役或更戍他郡不徙以逸民力也熙寧將兵熙寧七年九月樞副蔡挺請置三十七將將有正副皆給虎符從之乃部分諸將總隸禁旅謂之將兵癸丑選使臣為將副河北十七府界七京東九京西四所領兵二十萬又分置陜西諸路將兵八年三月癸巳朔五路置四十二將各七八萬人熙河九鄜延九環慶八秦鳯五涇原十一元豐四年二月乙丑東南諸路兵分十三將淮東一淮西二浙西三浙東四江東五江西湖北湖南全邵福建廣東廣西雍州自六至十三總天下九十二將東南兵三千以下唯置單將元祐五年十月二十六日密院修將官敕書成紹興五年四月乙卯改鑄東南十將京畿第二將紹興銅虎符紹興十一年四月壬辰京東淮東宣撫使韓世忠淮西張俊並為樞密使京西湖北嶽飛為樞副乙未詔罷三宣撫使逐司統制官以下各帶御前字入銜鑄印給之依舊駐劄將來調發並三省樞密院取旨統制官等各以職次髙下輪入見五月庚子詔曰凡爾有衆朕親統臨肆其偏裨咸得專達辛丑正總領官之名各報發御前軍馬文字丁未遣俊飛往楚州總淮東全軍還駐鎮江崇寧三衛崇寧四年二月十日己酉置三衛郎中郎博士二十六日詔三衛郎為侍郎親衛勳衛翊衛皆有郎中郎天禧元年三月御史臺請增置常朝武官遂以慕容德琛等為諸衛大將軍率府率建隆元年以登州團練使李萬超為右武衛大將軍建炎御營五軍建炎元年五月丁酉命中書侍郎潛善兼御營使同知密院伯彥副之六月甲子右相李綱兼使因楊惟忠等所部為五軍本以行幸總齊軍中之政其後遂專兵柄密府幾無預四年六月甲戌宰相范宗尹兼知密院事罷御營使及官屬以其事歸密院為機速房焉自慶厯後宰相不兼樞密八十餘年自此始復兼紹興三十一年上將視師冬十月庚申以楊存中為御營宿衛使虜平復免明年孝宗即位隆興元年六月十三日又以御營使命之然但自名一司掌殿前忠勇等軍非建炎之比也御營使一員或二員以宰相兼副使一員以執政兼參贊軍事以從官兼提舉事務以大將兼其將佐有都統制統制已下官建炎十軍建炎元年六月二十八日詔陜西河北募兵各三萬京東西各二萬合為十萬創置軍號驍勝壯捷忠勇義成龍武虎威折衝果毅定難靖邊凡十軍每號四軍每軍二千五百人二年二月京畿至淮南募振華軍五百人紹興五年十二月二日詔神武右軍改中護軍隸江東宣撫左軍改前護軍隸淮東宣撫後軍改後護軍隸湖北襄陽招討劉光世所部為左護軍淮西吳玠所部為右護軍川陜王彥所部為前護副軍荆南十年十一月十八日淮北宣撫判官劉錡招收使臣三百人效用一千人軍八千一百以補雄威振華忠鋭十八年四月殿前司募備軍一百三十六人二十七年三月朔步帥趙密言神衛虎翼飛山雄武舊額三萬九千五百請募兵補其缺三十年七月詔諸路募三衙缺額禁兵隆興元年二月荆南募武勇效用千人十月江西募效用勝捷吐渾雄威五千人蘇轍曰雍熙間天下之兵僅三十萬寶元慶厯間沿邊至七八十萬自是天下以百萬為額關中兵至二十八萬強兵莫如沿邊之土人惰兵莫如內郡之禁旅呂大忠曰闕邊鄙邊鄙之患輕在禦敵而重在養兵建炎諸軍團結建炎元年六月乙亥同知密院汪伯彥請兩河京東西增置射士縣五百人置武尉掌之縣令領其事凡四縣置二將江浙淮南大縣增二百人小縣二百從之十一月辛亥增福建十二月乙酉增二廣二年五月庚戌增湖南北丙戌李綱上三議一曰募兵謂莫若取財於東南募兵於西北詔陜西河北各三萬京東西各二萬人丁亥詔諸軍團結以五人為伍伍有長五伍為甲甲有正四甲為隊五隊為部皆有二將五部為軍有正副統率一千二百五十人為軍九月戊子朔詔罷團結二年九月乙未詔諸路禁兵隸帥府土兵射士隸提刑司即調發皆毋過三之一紹興二年十月朱勝非言屯軍二十萬月費二百萬緍十一月己巳呂頤浩言陛下專意軍政㨂汰其冗修飭器甲今張俊軍三萬韓世忠四萬嶽飛軍二萬二闕十一萬三千劉光世四萬老弱頗衆選之可闕文神武中軍楊沂中後軍巨師古皆不下萬人而御前忠鋭如崔增姚端張守忠等軍亦二萬臣上考太祖取天下正兵不過十萬況今有兵十六七萬何憚不為三年十二月己酉上從容語武備曰今養兵已二十萬有畸紹興三年正月甲子詔御前忠鋭第七將徐文以所部屯定海縣聽沿海制置司節制建炎民兵建炎元年八月丁卯三省樞密院奏以諸路民兵為忠義巡社令憲臣提領張慤之為戶部尚書也建言河朔之民憤於賊虐自結巡社請依唐人澤潞步兵山河子弟遺意聨以什伍而寓兵於農使合力抗虜且從靖康詔旨以人數借補官資仍倣義勇增修條例下之諸路未及行會許翰與京東西路安撫大使權邦彥繼以為言乃以忠義巡社為名自本院參酌闕其法五人為甲五甲為隊五隊為部五部為社俱有長五社為一都社有正副二都社有都副總首闕二社共為一千二百五十人所結及五百人以上闕官有差嵗冬十月按試于縣仍聽守令節制嵗中巡社增耗者守二令尉黜陟皆有差其法精審齊整可以久行前此論民兵者皆莫及先是六月戊子張緯上給田募兵法後不克行時京東留守宗澤沿大河鱗次為壘結連兩河山水寨及陜西義士二年二月壬午詔募河南北淮南土人有名籍者為振華軍以六萬人為額五月戊戌河北制置使王彥以八字軍屯河南紹興五年四月戊午詔福建廣東帥臣措置團結瀕海居民為社六月己巳罷福建諸州係籍槍杖手自熙寧間始有之十二年五月甲辰陳兖知揚州總領節制本路諸州水寨民兵建炎神武軍建炎四年六月戊寅改御前五軍為神武軍御營五軍為神武副軍其將佐並屬樞密院八月令神武中軍選親兵通舊六百人不隸禁衛分三畨於禁中直宿紹興二年九月癸亥上謂輔臣曰朕命楊沂中治神武中軍皆宿衛兵也五年十二月庚子詔神武乃北齊軍號久欲釐正宜以行營護軍為名一闕中十闕殿罷神武軍號軍隸前司乾道二年七月二十三日四川㨂護衛兵隸殿前名神武軍神武中軍舊止三部自楊沂中職殿巖始增為五軍又置護聖踏白選鋒䇿選闕遊奕神勇馬步凡十二軍時江海之間盜賊間作分置諸軍控制之如泉之左翼贛之右翼循之摧鋒明之水軍皆隸本司總七萬餘人殿前兵籍為天下冠紹興二十九年又置破敵軍自興國幽薊之師而兵籍日增康定慶厯間廣置義勇保捷宣毅萬勝諸軍其數一百二十五萬仰視開寶之籍不啻四倍雖龎籍汰省八萬人豈能救冗兵之害善乎韓琦之言曰祖宗雖以兵定天下然有征伐則募置事已則省故兵精而用不廣又就糧之兵不多邊陲有事則以京師之兵益之乾道中訓練兩浙弓兵名御前神武軍而殿前已有神武軍額八年二月二十三日改為忠武建炎纂祖宗兵制建炎四年七月詔王銍權密院編修纂集祖宗兵制其後書成上覽之稱善賜名樞庭備檢陳傅良曰國初州郡無禁兵著在令甲自騎射至牢城名額二百二十三總為本城而已禁兵皆三司之卒分屯更戍今屯駐駐泊之名而鈐轄都監監押之官所部領也三邊之兵間因事宜升為禁軍者所謂四十四處禁軍是已是為就糧自元昊叛而西北有保毅王倫起而東南有宣毅於是列郡稍置禁軍至嘉祐中置威果凡二十五指揮既云多矣亦無過九大郡要害之處熙寧按天下廂軍之籍五十萬人而不知戰於是教閲之法起其後以廂軍團併為額今兩浙崇節福建保節之類是已教閲之兵因别為額而隸之將下今兩浙雄節福建廣節之類是己方戍法之行也三司禁旅轉徙於四方而州郡廂軍大抵以供百役蓋勞之則易使散之則易養此藝祖神謀也自州郡各有禁軍三司之卒不出常坐食於京師於是養兵始為大患紹興都統制兵御前軍唐天寶末置天下兵馬大元帥都統朔方盧龍節度都統之名始于此乾元元年李桓為都統淮南江東西節度使都統之官始于此唐制或總五道或總三道又有行營都統副都統一時兵興稱謂不一建炎元年五月以河北兵為御營五軍三年四月又更置御前五軍而劉光世所領西兵則謂之巡衛軍在五軍之外是嵗又改為神武軍紹興元年十二月又改為行營四護軍十一年四月三宣撫司罷乙未乃改其部曲稱某州駐劄御前諸軍十八年五月甲申罷四川宣撫司川陜軍亦如之楊政改充御前都統制其軍皆不隸三衙詳見官制韓世忠之軍還鎮江惟背嵬一軍赴行在渡江後諸將為統制軍馬必以資序帶六等兵馬淳熙十一年樞臣周必大以荆鄂二帥勢均力敵乃合為一司鄂為正荆為副嘉定戊辰改雄淮軍為武定乾道六年正月詔殿司水軍改為御前水軍都統駐劄之地沔州興元金川江陵鄂州池州江州鎮江建康平江許浦水軍又利州有副都統制廬州強勇軍光州武定軍高郵武鋒軍紹興三衙兵三衙諸軍殿前司本辛永宗中軍部曲而益以他軍也馬軍司本王彥部曲而益以解潛劉錡田晟之軍也步軍司本顔漸部曲而益以他軍也自紹興五年至七年規摹始定然馬步不能敵殿司之半故楊存中權勢獨盛乾道七年春移騎軍屯於建康以為出師之漸號馬軍行司紹興初內外大軍凡十九萬四千餘而川陜不與宿衛神武右軍中軍七萬二千八百右軍張俊中軍楊沂中江東劉光世淮東韓世忠湖北嶽飛湖南王􅊅四軍十二萬一千六百七年四月五日劉錡言行營前護副軍并為十二將曰侍衛馬軍司紹興五年十二月庚戌廢神武中軍隸殿司以楊沂中主管殿司又以都督府兵分隸三衙七年四月丙申復合馬司餘軍及八字軍為六軍十二將命劉錡主之而解潛典步軍如故自是三衙始復矣八年九月馬軍每十將為五軍九年三月改衙兵為遊奕軍始令殿前立神勇步兵一軍三十二年隸步軍六月二十七日成閔請復還殿司名護聖步軍以吳拱所領二千赴步軍司隆興二年三月二十八日詔忠勇軍屬步軍司七月十二日詔馬司龍衛驍勇武騎舊額一萬三千八百人今止八百八十九人宜以二千人為額乾道二年四月鎮江武鋒軍隸步司八年三月八日以西兵為御前遊奕軍孝宗又為護聖一軍寓隂相維持之意馬步之數通一萬四千七百有竒也紹興宿衛親兵建炎四年八月三日中軍選親兵通舊為六百人分三畨紹興二年八月己亥十二日給事胡安國言自古盛王雖用文德必有親兵成王即政周公指虎賁與常伯同戒于王欲其知恤虎賁猶今侍衛親軍也康王初立太保俾呂伋以虎賁百人迎於南門伋太公之子自諸侯入典親兵猶今殿前馬步軍都帥也本朝命三衙分掌親軍望修明軍政九月六日癸亥上曰朕命沂中治神武中軍皆宿衛兵宜增修器械五年十二月一日罷神武軍號中軍隸殿前司三年八月十七日宮門內殿門外建三衙管軍宿舍凡三楹六年正月趙鼎奏舊制三衙用邊臣戚里及軍班出身各一人以示激勸七年七月五日密院言諸班直禁旅舊額三千六百餘人今止五百餘人十二年十二月二十四日壬午詔宿衛親兵非祖宗法罷之其三路人改為皇城司親從親事先是楊沂中提舉宿衛親兵二年三月己酉除中軍統制紹興制勝軍三十二年十二月孝宗末改元鎮江都統劉寶言昨罷宣司背嵬一軍請置一軍補填以制勝軍為名詔令招效用兵一千人餘二千人選於步軍紹興荆鄂民兵紹興三十一年虜入寇詔淮漢等郡籍民為兵續觱守荆南請籍民為義勇其法取於主戶之雙丁十戶為甲五甲為團皆有長又擇邑豪為總首農隙教以武事官給其糧至乾道間舉七縣之籍得義勇八千四百十九人淳熙初張栻為帥益修其政義勇增多至萬五百人分為五軍軍分五部後四年趙雄又增三千三百人時十一年冬通為萬三千八百餘人又紹興末武昌令薛季宣亦求得故陜西河北弓箭手保甲法五家為保二保為甲六甲為隊據地形利便則為總不限以鄉總首副總首領焉諸總皆有射圃而旗幟亦别其色至今猶存紹熙四年冬凡萬五千二百一人荆鄂二郡率四五家有一人為兵隆興復環衛隆興二年五月八日壬辰進呈洪適周操討論環衛官故事湯思退奏環衛唐時有職事本朝無職事祖宗舊制自方鎮罷皆歸環衛先是上欲復祖宗環衛官四月二十六日命學士院討論至是下詔曰祖宗選用將帥以崇武節外建方鎮內則環尹品式備具近來久不除授非所以儲才而均任也其依舊制應以才略聞者令兼領如節度使則領左右金吾衛上將軍承宣使領左右衛上將軍之類既而閣門條具儀制詔以十員為額朝參侍殿依御帶例宗室不在此制仍不差戚里及非戰功人著為令二十五日詔臨安府建第舍以待環衛淳熙四年二月二十三日立環衛官格其法正任除上將軍承宣使至刺史為正任遙郡除大將軍以階官領刺史至承宣使為遙郡正使除將軍武翼大夫己上副使除中郎將武翼郎已上使臣已下左右郎將訓武郎已下是時李顯忠首除左金吾衛上將軍上曰在內則兼在外則否此正如文臣館閣庶可見人才太平興國二年五月癸亥安逺節度使向拱換左衛上將軍張永德等皆罷節制歸環衛元豐二年十六衛大將軍二百九十四員將軍一百六十二員並宗室乾道八年四月以戚世明軍政修除右千牛將軍令訓練土兵姚公贊右監門中郎將乾道民兵神徑軍乾道元年十二月十四日詔湖北保伍軍器仍存之八年十月十二日淮南漕臣馮忠嘉言教閲保甲民兵請如淮東三丁四丁取一五丁六丁取二真州無為二司分領教閲四年正月五日湖北王炎言荆南團結義勇民兵八千四百十九人給資糧假弓弩二十七日四川宣撫虞允文言興元路義士人材可用令朝公武訪陜西弓箭手舊法得之瀘州蓋祖宗朝所頒凡一百四十一條分十三門為一書令録上義士勑令格式名曰義士専法行之五年三月十二日允文言興元洋州大安軍義士二萬六千一百四十人結成隊伍興洋在紹興初義士在籍者七萬後僅存六千今公武籍興元之丁增至一萬六千四百三十四人風聲氣俗傳陜服之舊安於弓箭手之良法七年正月十七日宣撫王炎言關外成西和鳯州有忠勇軍舊保甲也請依十資格轉補淮南萬弩營經始於紹興季年乾道五年十一月一日復置名曰神徑軍命御前後軍統領教閲置寨于儀真募萬弩手以本軍忠勇使效為名淮東之籍千四百淮西之籍千六百六年二月真州置神徑營寨收萬弩手一千五百九十七人往者大將别置一軍曰背嵬乃親軍之稱九年十一月十五日馬帥趙撙以所領五軍騎步各一千人為親隨選鋒軍詔可紹興末孝宗命張浚置御前萬弩營於建康癸未戌泗州甲申與虜鬬皆有功乙酉講解散歸其家乾道中令徐子寅復置於真州冠帶羣胡韶勺世讎畏戰靡靡明主所憂阜陵之成規宿師於內郡而移戌於邊城淮西山水寨民兵乾道五年九月二十四日詔參議官許子中措置荆門民兵紹興三十一年荆門守臣姚嶽籍民兵置槍杖號強壯子弟號令齊一湖南飛虎軍淳熙七年八月置隸步軍司以一千五百人為額治平間於廣東潮梅循惠等州置槍手熙寧間於諸州缺兵處增置保丁若廣西雍州之洞丁本以防遏交趾而欽廉宜融平觀諸郡各有土丁欽廉之沿海宜融之防遏率以三等戶五丁取一至四等已下則戶以一丁充團結平觀則團結父子全丁並蠲其身丁稅錢紹興二年許中帥廣西始調羈縻州洞丁赴靜江防拓先是建炎元年十月庚辰命李棫提舉廣西左右兩江洞丁三年命廣西提舉洞丁李棫即雍州置司買馬七月乙巳命江西閩廣荆湖團㨂槍杖手洞丁以備調發廣西自嘉祐間憲臣李師中帥臣余靖奏團結訓練土丁以備邊熙寧紹聖大觀以來修為成法每嵗農隙分之州縣更畨教閲一月而罷庶幾寓兵於農之意乾道兵額忠鋭軍忠武忠勇軍乾道三衙江上四川大軍新額總四十二萬八千人殿司七萬三千人元年七月十三日旨馬司三萬人二年正月二十六日詔以二萬八千人為額六年正月十五增二千人步司二萬一千人二年正月二十六日旨建康統司五萬人池州一萬二千人二年二月二日旨鎮江四萬七千人二年十一月十一日旨江州一萬人四年十一月四日定楚州武鋒軍一萬一千人九年四月十五日郭均招填平江許浦水軍七千人二年十月十三日旨鄂州四萬九千人二年十月九日旨後又增至五萬二千人荆南二萬人二年十一月四日旨興州六萬人興元一萬七千人金州一萬一千人並三年正月二十四日旨乾道四年六月一日詔諸州弓弩手團集教閲名忠鋭軍五年正月十一日詔浙東弓弩手名御前忠鋭軍置正副準備將三年罷忠鋭第五將九年六月二日發忠鋭軍歸本郡六年七月二十三日復置御前弓馬子弟所隸密院八年春二月二十二日置忠武軍選二浙土兵弓手為之八月一日詔二浙㨂中廂軍名曰御前忠勇軍劉沂兼統制十一月十六日罷二浙所發忠勇軍九年四月十五日密院言忠武軍藝以精歸之州縣天之壁壘象在羽林王之爪牙職於圻父太微諸星有上將次將之位章溝徼道晝警夜誰而殿岩以肅旄頭驅先旗别隊分而鹵簿以整冠鶡衣虎鎩戟百重而仗儀以煥兕臣彪將供設職嚴章佩銀黃綬紆紫朱玉海卷一百三十九
