body:
  text: 玉海卷十宋王應麟撰律厯厯法下唐八厯四家厯經志厯法尚矣自堯命羲和其事略見于書而夏商周以三統改正朔為厯不同而其法不傳至漢造厯始以八十一分為統母其數起於黃鍾之籥蓋其法一本於律矣其後劉歆又以春秋易象推合其數蓋傅會之説也至唐一行始專用大衍之策則厯術又本於易矣蓋厯起於數數者自然之用也其用無窮而無所不通以之於律於易皆可以合也然其要在於候天地之氣以知四時寒暑而仰察天日月星之行運以相參合而已然四時寒暑無形而運於下天日月星有象而見於上二者常動而不息一有一無出入升降或遲或疾不相為謀其久而不能無差忒者勢使之然也故為厯者其始未嘗不精密而其後多踈而不合亦理宜然也不合則屢變其法以求之自堯舜三代以來厯未嘗同也唐始終二百九十餘年而厯八改曰戊寅元厯曰麟德甲子元厯曰開元大衍厯曰寶應五紀厯曰建中貞元厯曰元和觀象厯曰長慶宣明厯曰景福崇玄厯而止矣又有至德厯凡九改本朝皇祐四年十一月甲辰參定八厯見後八厯大衍最密舊志前史取傅仁均李淳風南宮説一行四家厯經為厯志四卷近代精數者皆以淳風一行之法千古無差景龍厯世以為非但取戊寅麟德大衍三厯法以備此志唐戊寅元厯諸儒議厯麟德甲子元厯木渾圖經緯厯光宅厯神龍厯藝文志戊寅厯一卷厯志髙祖受禪將治新厯東都道士傅仁均善推步之學武德元年五月太史令庾儉丞傅奕等參議合受命歲名為戊寅元厯乃列其大要所可考驗者七曰唐以戊寅歲甲子日登極厯元戊寅日起甲子如漢太初一也冬至五十餘年輒差一度日短星昴合於堯典二也周幽王六年十月辛卯朔日蝕合于詩三也魯僖公五年壬子冬至合春秋命厯序四也月有三大三小則日食常在朔月食常在望五也命辰起子半命度起虛六符隂陽之始六也立遲疾定朔則月行晦不東見朔不西朓七也元年九月癸亥奏厯成髙祖詔司厯起二年用之舊紀元年十月癸巳行仁均所造戊寅厯擢仁均為散騎侍郎三年正月望二月八月朔當食比不效六年詔吏部郎中祖孝孫考其得失孝孫使算厯博士王孝通以甲辰厯法詰之曰日短星昴以正仲冬七星畢見舉中宿言耳舉中宿則餘星可知仁均專守昴中執文害意不亦謬乎又月令仲冬昏東壁中若堯時差至昴則堯前七千餘載日應在東井井極北去人最近故暑斗極南去人最逺故寒寒暑易位必不然也又平朔定朔舊有二家三大三小為定朔望一大一小為平朔望日月行有遲速相及謂之合會時朔無定由時消息若定大小皆在朔合會雖定而蔀元紀首三端並失若上合履端之始下得歸餘於終合會有時則甲辰元厯為通術矣仁均對曰宋祖沖之立歲差隋張胄元等因而修之雖差數不同各明其意孝通未曉乃執南斗為冬至常星夫日躔宿度如郵傳之過宿度既差黃道隨而變矣書云季秋月朔辰勿集于房孔氏云集合也不合則日食可知又云先時者殺無赦不及時者殺無赦既有先後之差是知定朔矣詩云十月之交朔日辛卯又春秋傳曰不書朔官失之也自後厯差莫能詳正故秦漢以來多非朔蝕宋御史中丞何承天微欲見意不能詳究乃為皮延宗所抑孝通之語乃延宗舊説治厯之本必推上元日月如合璧五星如連珠夜半甲子朔旦冬至自此七曜散行不復餘分普盡總會如初惟朔分氣分有可盡之理因其可盡即有三端此乃紀其日數之元爾或以為即夜半甲子朔冬至者非也冬至自有常數朔名由於月起月行遲速匪常三端安得即合故必須日月相合與至同日者乃為合朔冬至耳孝孫然之但略去尤疏濶者九年丙戌歲舊志九年五月二日復詔大理卿崔善為與孝通等校定善為所改凡數十條三十餘條貞觀初元年直太史李淳風上疏論十有八事詔崔善為課二家得失其七條改從淳風十四年太宗將親祀南郊以十一月癸亥朔甲子冬至而淳風新術以甲子合朔冬至乃上言古厯分日起於子半十一月當甲子合朔冬至故太史令傅仁均以減餘稍多子初為朔遂差三刻用乖天正請考定司厯南宮子明太史令薛頤言淳風之法較春秋以來晷度薄蝕事皆符合國子祭酒孔頴達與尚書八座議請從淳風孔頴達傳以太子右庶子兼司業與諸儒議厯及明堂事多從其説朔十八年詔用仁均平訖麟德元年仁均厯法祖述張胄元以劉孝孫舊議參之其大最疏於淳風然更相出入其有所中淳風亦不能逾之志云今所記者善為所較也上元戊寅至武德九年丙戌積十六萬四千三百四十八算日度議曰戊寅厯循孝孫之論不知孝孫已變從皇極故為淳風所駁歲差術不行髙宗時麟德元年甲子戊寅厯推步既益疏淳風作甲子元厯以獻增損劉焯皇極厯詔太史起麟德二年旃蒙赤奮若之歲五月辛卯頒用會要載詔曰朕仰稽七曜旁總五家古所未通今即備載而改之初考此厯歲推甲子合於天正合朔之夜應以嘉祥五緯若連珠二曜如合璧如此授農升平可致昔洛下閎漢厯云後八百歲當有聖人受之自火德暨我年將八百事合當仁可名麟德厯古厯有章蔀有元紀有日分度分參差不齊淳風為總法千三百四十以一之損益中晷術以考日至為木渾圖以測黃道餘因劉焯皇極厯法增損所宜當時以為密與太史令瞿曇羅所上經緯厯參行會要經緯厯法九卷載初改元用周正神功二年改元聖厯命瞿曇羅作光宅厯三年罷復行夏時終開元十六年武后有光宅厯後又有神龍厯止因麟德厯法李嶠為序麟德厯麟德元年甲子距上元積二十六萬九千八百八十算大衍中氣論曰傳據周厯緯據殷厯戊寅厯日氣專合于緯麟德專合于傳偏取之故兩失及開元十二年朔差五日氣差八日中宗反正太史丞南宮説以麟德厯上元五星有入氣加減非合璧連珠之正以神龍元年歲次乙巳故治乙巳元厯推而上之積四十一萬四千三百六十算得十一月甲子朔夜半冬至七曜起牽牛之初其術有黃道而無赤道推五星先步定合加伏日以求定見他與淳風術同所異者惟平合加減差既成而睿宗即位罷之舊志中宗時南宫説造景龍厯藝文志南宮説光宅厯草十卷瞿曇謙大唐甲子元辰厯一卷舊紀麟德二年五月辛卯祕閣郎中李淳風造厯成名麟德厯頒之大衍厯日度議曰淳風曰若冬至昴中則夏至秋分星火星虛皆在未正之西若以夏至火中秋分虛中則冬至昴在巳正之東互有盈縮不足以為歲差證王孝通云如歲差自昴至壁則堯前七千餘載冬至日應在東井東井極北故暑斗極南故寒寒暑易位必不然矣所謂歲差者日與黃道俱差也淳風以冬至常在斗十三度則當以東壁二度為降婁之初安得守漢厯以駁仁均耶淳風曰今孟春中氣日在營室昏明中星與月令不殊按秦厯立春日在營室五度麟德厯以啓蟄之日乃至營室以為不差妄矣淳風厯冬至斗十三度經籍所載合於歲差者淳風皆不取而專取於吕氏春秋武德七年二月髙麗請頒厯貞觀十年吐谷渾請頒厯龍朔元年劉仁軌為帶方刺史請唐厯而行唐家千歲厯五行應運厯王勃髙宗時謂王者乘土王世五十數盡千年乘金王世四十九數九百年乘水王世二十數六百年乘木王世三十數八百年乘火王世二十數七百年此天地之常也自黃帝至漢五運適周土復歸唐應繼周漢不可乘周隋短祚乃斥魏晉而降非真王正統皆五行沴氣遂作唐家千歲厯志卷亡天寶中太平久上言者多以詭異進有崔昌采勃舊説上五行應運厯謂承周漢廢周隋為閏右相李林甫贊佑之集公卿議可否集賢學士衛包起居舍人閻伯嶼上表曰都堂集議之夕四星聚于尾天意昭然矣於是玄宗下詔以承漢黜隋以前帝王廢介酅公尊周漢為二王後以商周漢為三恪京城起周武王漢髙祖廟授昌太子贊善大夫天寶九載九月六日辛卯以商周漢為三恪十二載五月復舊唐志雜史有許氏千歲厯三卷唐開元大衍厯七術十二議厯議七政長厯靈臺候簿五星爻象厯藝文志僧一行一行本姓張名遂公謹從孫開元大衍厯一卷又厯議十卷又厯立成十二卷厯草二十四卷又七政長厯三卷心機算術括一卷黃棲巖注厯志開元九年重光作噩之歲麟德厯署日食比不效詔僧一行作新厯集賢注記一行初奉詔於光大殿改撰厯經後移在麗正殿與學士參校厯術推大衍數立術以應之較經史所書氣朔日名宿度可考者皆合十五年十月草成而一行卒詔特進張説與厯官陳元景趙升等次為厯術七篇略例一篇厯議十篇集賢注記又有厯書二十四卷玄宗顧訪者則稱制旨紀玄宗通音律厯象之學明年十六年八月十五日己巳説表上之起十七年頒于有司時善算瞿曇撰一作謙宗正丞者怨不得預改厯事二十一年與元景奏大衍寫九執厯其術未盡太子右司禦率南宮説亦非之詔侍御史李麟太史令桓執圭較靈臺候簿大衍十得七八麟德才三四九執一二焉乃罪説等而是否決自太初至麟德厯有二十三家與天雖近而未密至一行密矣其倚數立法固無以易也後世雖有改作者皆依倣而已略例所以明述作本旨也厯議所以考古今得失也中晷議見天文志皆足以為將來折衷略其大要著于篇者十有二志十二篇略例三議九厯議十篇缺其一一厯本議二中氣議三合朔議四滅沒略例五卦候議六卦議七日度議八日躔盈縮略例九九道議十晷漏中星略例十一日蝕議十二五星議至其七術一曰步中朔術二曰步發斂術三曰步日躔術四曰步月離術五曰步軌漏術六曰步交會術七曰步五星術切考其詳本於天地之二中始於冬至之中氣以合朔定月日之會以日度正周天之數以卦氣定七十二候以中星正二十四氣十二議所以考古今之得失七術所以步日月之躔度而其原皆出於易肅宗更名至德德宗貞元厯雜用大衍之旨穆宗宣明厯氣朔發斂日躔月離皆因大衍厯十二議一厯本議天數五地數五五位相得而各有合所以成變化而行鬼神也天數始於一地數始於二合二始以位剛柔天數終於九地數終於十合二終以紀閏餘天數中於五地數中於六合二中以通律厯夫數象微於三四章於七八卦有三微策有四象故二微之合在始中之際焉蓍以七備卦以八周故二章之合在中終之際焉一策之分十九而章法生一揲之分七十六而蔀法生以卦當歲以爻當月以策當日策以紀日象以紀月乾坤之策三百六十為日度之準乾坤之用四十九象為月弦之檢參伍相周究於六十聖人以此見天地之心也自五以降為五行生數自六以往為五材成數錯而乘之以生數十五衍成位四十一六而退極五十而增極一六為爻位之統五十為大衍之母成數乘生數其算六百為天中之積生數乘成數其算亦六百為地中之積合千有二百以五十約之則四象周六爻也二十四約之則太極包四十九用也綜成數約中積皆十五綜生數約中積皆四十兼而為天地之數以五位取之復得二中之合矣蓍數之變九六各一乾坤之象也七八各三六子之象也故爻數通乎六十策數行乎二百四十是以大衍為天地之樞如環之無端蓋律厯之大紀也其二中氣議厯氣始于冬至自春秋以來至開元十二年冬夏至凡三十一事戊寅厯得十六麟德得二十三開元得二十四其三合朔議日月合度謂之朔春秋日蝕有甲乙者三十四不書朔者八長厯日子不在其月則改易閏餘欲以求合故閏月相距近則十餘月逺或七十餘月預甚繆也考漢元光以來史官記注日蝕有加時者凡三十七事麟德得五開元得二十二其四沒滅略例中分所盈為沒朔分所虛為滅綜終歲沒分謂之策餘終歲滅分謂之用差皆歸于揲易再扐而後挂也其五卦候議原于周公時訓月令頗有增益先後之次則同自後魏始載于厯乃依易軌所傳不合經義今改從古六卦議十二月卦出於孟氏章句京氏又以卦爻配期之日坎離震兊用事自分至之首得八十分日之七十三頥晉井大畜皆五日十四分餘皆六日七分止占災眚與吉凶善敗之事自乾象厯以降皆因京氏惟天保厯依易通統軌圖自八十有二節五卦初爻相次用事及上爻與中氣偕終非京氏本旨及七略所傳按郎顗所傳卦皆六日七分不以初爻相次用事齊厯謬矣京氏減七十三分為四正之候其説不經欲附會緯文七日來復而已當據孟氏自冬至初中孚用事一月之策九六七八是為三十卦以地六候以天五五六相乘而歲復初坎離震兊二十四氣次主一爻七日度議日在虛一則仲月昏中合于堯典歲差者日與黃道俱差也古厯與近代密率相較二百年氣差一日三百年朔差一日以太史注記月蝕衝考日度麟德元年九月庚申月蝕在婁十度開元四年六月庚申月蝕在牛六度皇極歲差自黃道命之開元厯自赤道推之乃以今有術變從黃道八日躔盈縮略例劉焯立盈縮躔衰術與四象升降麟德因之更名躔差急極而寒若舒極而燠若及中而雨暘之氣交當以二十四氣晷景考日躔盈縮而密於加時九九道議洪範傳日有中道一曰光道月有九行朔交為交初望交為交中若交初在冬至初候而入隂厯則行青道交初入陽厯則白道也九道之變以四立為中每氣移一候月道所差增損九分之一七十二候而九道究十晷漏中星略例推黃道去極與晷景漏刻昏距中星四術反復相求消息同率旋相為中以合九服之變十一日蝕議黃初已來始課日蝕疏密及張子信益詳以戊寅麟德推春秋大最皆入蝕限於厯應蝕而春秋不書者尚多開元十二年七月戊午朔於厯當蝕自交址至朔方候之不蝕十二年十二月庚戌朔亦當蝕不蝕略例曰以圓儀度日月之徑乃以月徑之半減入交初限一度半餘為暗虛半徑以日去黃道每度差數令二徑相掩以驗蝕分較古今日蝕四十三事月蝕九十九事課皆第一十二五星議開元十二年正月庚午歲星在進賢東北直軫十二度麟德在十五度稽古今注記入氣均而行度齊上下相距反復相求較史官所記五星百二十二事歲星二十七事熒惑二十八事鎮星二十一事太白二十二事辰星二十四事開元厯課皆第一詳見星度開元大衍厯演紀上元閼逢困敦之歲甲子距開元十二年甲子積九千六百九十六萬一千七百四十算七術中朔有通法策實揲法滅法策餘用差挂限三元四象之策中盈分朔虛分象統發斂有天地中貞悔之策辰法刻法日躔則乾實周天度虛分歲差月離則轉法轉秒法日以赤道內為隂外為陽月以黃道內為隂外為陽軌漏則爻統象積辰昏明刻分而下水漏以定晝夜定中晷以較陽城之數交會則終數隂陽厯而測中晷以較陽城之數五星則終率變差象爻算辰秒微分法爻象厯而為前後中之差書目大衍厯議十卷一行撰崇文目大衍厯三卷會要開元十六年八月十五日特進張説進大衍厯命有司行用之通鑑十六年八月乙巳上舊紀己巳張説賀示厯書表云內出新撰厯書二十五卷張説序開元皇帝十有三祀詔沙門一行上考黃顓夏商周魯五王一侯之遺式下集太初至于麟德二十三家之衆議比其同異課其疏密振古未探之象必發揮於神算大鈞不測之氣盡覼縷於天聰乃更審晷度之長短度星間之廣狹繩九道之朓朒糾五精之進退參大衍天地之數綜八卦六爻之序一轍於文王也覆春秋交蝕之辰研九疇五紀之奧同符於孔子也杼軸萬象優柔四載臣説奉詔金門成書册府緯合編次勒成一部名曰開元大衍厯經七章十卷長厯五卷厯議十卷立成法天竺九執厯二卷古今厯書二十四卷略例奏草一卷凡五十二卷所以貫三才周萬物窮術數先鬼神稱制曰者即聖人顧訪之旨標謹按者是厯家進對之詞蓋中黃之寶符大紫之神器也謹以十六年八月端午赤光照室之夜皇雄成紀之辰當一元之出符獻萬歲之新厯唐明皇以八月五日生張説作開元正厯握乾符頌序云以數推氣以氣定朔以星正時以閏成歲考星間而革疏度置歲差而辨誤日立大衍之紀參大渾之晷合鍾律之聲極鬼神之情是謂聖人握符之大厯也自堯帝典命羲和理顓頊之厯上元甲子千五百餘歲得孔聖而春秋之厯序暨開元十二年甲子凡三千四十歲而大衍之厯興土德入生數之元天命當出符之會頌云步玉斗握金鏡發斂潛合晦明幽闡階蓂朝開宮槐夜卷正我長厯同符大衍又賀表云天旨裁其紀綱日官考其精要梁天監中陶弘景著玉匱記云盛德木子以肇來運一行推璿衡厯得皇家天命成數千年古今祥兆若合符契厯數既在於聖躬卜年又表於長厯張曲江集臣某伏見丙寅制書以開元厯握乾符垂示天下幸甚其沙門等所言益部耆舊傳洛下閎改顓厯推數最為精密而曰後八百歲其厯差一日當有聖人定之劉羲叟謂一行以天地之中數作大衍厯最為精密後世善治厯者皆用其法惟寫分擬數而已大衍厯以一百六十三億七千四百五十九萬五千二百為元三千四十為分唐古今厯書大衍通玄鑑新厯唐長厯會要開元大衍厯十五年一行刋定詔説成之因編次勒成一部經章十卷長厯五卷厯議十卷立成法天竺九執厯二卷古今厯書二十四卷略例奏草一卷凡五十二卷十六年八月十五日張説進志大衍通玄鑑新厯三卷自貞元至大中大唐長厯一卷崇文目同唐九執厯厯志九執厯者出於西域開元六年詔太史監瞿曇悉達譯之以開元二年二月朔為厯首有朔虛分百二十六周天三百六十度無餘分日去沒分九百分度之十三二月為時六時為歲三十度為相十二相而周天望前曰白博義望後曰黑博義其算皆以字書不用籌策其術繁碎或幸而中不可為法名數詭異初莫之辨也陳元景等持以惑當時謂一行寫其術未盡妄矣先是每年大衍與麟德九執同進以用術不同也唐肅宗至德厯寶應五紀厯序厯志肅宗時山人韓穎上言大衍厯或誤帝疑之以穎為太子宮門郎直司天臺又損益其術每節損二日更名至德厯在八厯之外起乾元元年六月十七日丁巳用之訖上元三年寶應元年六月望戊夜月食三之一官厯加時在日出後有交不署食代宗與至德厯不與天合詔司天臺官屬郭獻之等復用麟德元紀更立歲差增損遲疾交會及五星差數以寫大衍舊術上元七曜起赤道虛四度帝為製序題曰五紀厯通鑑代宗廣德二年夏五月癸丑初行五紀厯其與大衍小異者九事自定朔小餘至日度定率大衍以四象考五星或時弗叶獻之加減頗異而偶與天合於是頒用迄建中四年五紀厯演紀上元甲子距寶應元年壬寅積二十六萬九千九百七十八算志五紀厯四十卷崇文目五紀厯經二卷會要乾元元年六月十七日頒山人韓穎等所造新厯唐建中貞元厯厯志德宗時五紀厯氣朔加時稍後天推測星度與大衍差率頗異詔司天徐承嗣與夏官正楊景風等雜麟德大衍之旨治新厯上元七曜起赤道虛四度建中四年厯成名曰貞元其氣朔發斂日躔月離軌漏交會悉如五紀法惟發斂加時無辰法其五星寫麟德厯舊術麟德厯之啓蟄貞元厯之雨水麟德厯之雨水貞元厯之驚蟄也詔起五年甲子歲正月頒新厯會朱泚之亂改元興元自是頒用訖元和元年貞元厯演紀上元甲子距建中五年甲子積四十萬二千九百算建中四年正月戊寅朔含元殿受朝賀禮畢以建中貞元厯三十八卷示百僚初司天少監徐承嗣奏來年歲次甲子應上元首請修新厯至是成群臣稱賀藝文志建中貞元厯二十八卷曹士蒍七曜符天厯一卷建中時人崇文目一卷唐元和觀象厯長慶宣明厯厯志憲宗即位司天徐昂上新厯名曰觀象起元和二年二月用之舊紀二月庚午司天造新厯成題為觀象然無蔀章之數至於發斂啓閉之候循用舊法測驗不合至穆宗立以為纍世纘緒必更厯紀乃詔日官改撰厯法名曰宣明上元七曜起赤道虛九度其氣朔發斂日躔月離皆依大衍舊術晷漏交會則稍增損之更立新數以步五星起長慶二年壬寅用之自敬宗至僖宗皆遵用雖朝廷多故不暇討論然大衍厯後法制簡易合望密近無能出其右者訖景福元年觀象厯今有司無傳者長慶宣明厯演紀上元甲子至長慶二年壬寅積七百七萬一百三十八算藝文志長慶宣明厯三十四卷穆宗序云勒成三十四卷慶崇文目卷同宿天文類有長算五星所在度圖卷長慶宣明厯要略一卷宣明厯超捷例要略一卷書目有宣明大厯二卷穆宗長慶宣明厯序纍聖纘緒必更紀厯推體元居正之道彰敬授惟新之法感易象之隨時懷禮經之聽朔又覽魏弱翁之奏爰命太史洎乎疇人候望於清臺論思於别殿究微妙考休祥觀渾儀以見天心視圭景而知日至則八卦之氣不雜百工之職允釐唐景福崇玄厯厯志昭宗時宣明厯施行已久數亦漸差詔太子少詹事邊岡與司天少監胡秀林均州司馬王墀改治新厯然術一出於岡岡用算巧能馳騁反覆于乘除之間由是簡捷超徑等接之術興而經制逺大衰序之法廢矣雖籌策便易然皆冥於本原其上元七曜起赤道虛四度景福元年壬子厯成十二月上之賜名崇玄氣朔發斂盈縮朓朒定朔弦望九道月度交會入食限去交前後皆大衍之舊餘雖不同亦殊塗而至者起二年頒用至唐終五代初亦用之至晉始改景福崇玄厯演紀上元甲子距壬子積五千三百九十四萬七千三百入算藝文志景福崇玄厯四十卷岡稱處士一崇文目四十卷後晉馬重績調元厯以宣明之氣朔合崇玄之星緯參二厯為新法行之五年差不可用而復用崇玄厯史序治崇玄厯興國六年太宗親較試擢為主簿楚衍試宣明厯補司天監學生唐二百九十餘年間若瞿曇羅之作光宅南宮説之作乙巳至德創于韓頴九執譯于悉達而弗齒諸八厯之數唐三十六家厯算志丙部子録十一曰厯算三十六家七十五部二百三十七卷始於劉向九章重差終於大唐刻漏經失姓名五家王勃千歲厯至陳輔四門經不著録十九家一百二十六卷三十六家厯書始于劉歆三統次以四分乾象景初元嘉大同七曜永安甲子武定天保甲子元大象甲寅元周甲子元開皇大業皇極河西壬辰元甲寅元劉智正厯薑氏崔浩厯術唐戊寅麟德光宅甲子元辰厯之類而甄鸞之七曜本起厯厯算厯術及漢書律厯志術厯日義統吉凶注附焉算術始于劉向九章重差次以徐嶽甄鸞劉祐九章劉徽重差圖張丘建夏侯陽韓延算經甄鸞五曹劉徽海島董泉三等數宋泉之九經術疏隂景愈七經通義信都芳器準黃鍾算法祖沖之綴術王孝通輯古之類而徐嶽要用百法數術記遺及李淳風注周髀九章五經海島五曹孫子等與算經表序附焉若漏刻則有何承天朱史宋景唐刻漏經四家不著録者若王勃千歲一行大衍及七政長厯寶應五紀建中貞元曹士蒍七曜符天長慶宣明邊岡崇玄與大衍通元大唐長厯則以厯名者也若謝察微算經江本算法陳從運算經魯靖五曹黃栖巖注心機算術龍受算法李彌乾都利聿斯陳輔聿斯四門經則以算名者也而邢和璞潁陽書三卷又附著焉隋志厯數一百部二百六十三卷自四分厯至算經六典子類十二曰厯數卷同隋志崇文目厯數四十七部二百二十九卷算術三十一部七十九卷算經見小學史記正義甄鸞注算經云一歲之閏惟有十日九百四十分日之八百二十七又一月二十九日九百四十分日之四百九十九兩朝志厯算三十三部六十四卷厯以算成厯為算本治厯之善積算逺其驗難而差遲治厯之不善積算近其驗易而差亦速唐二十三家厯厯志自太初至麟德厯有二十三家與天近而未密至一行密矣張説大衍厯序下集太初至麟德二十三家之衆議漢之太初三統四分乾象魏之景初一本有黃初晉之正厯河西之元始宋梁陳有元嘉大明大同七曜元魏有永安甲子武定若天保大象甲寅甲子元則北齊周厯也若劉孝孫李德林之開皇與大業皇極則隋厯也并戊寅麟德凡二十三家兩開皇厯當合為一今按太初厯隋志已亡黃初厯隋唐志皆不著一云兩開皇厯乃張賓胄元一説二十三家大初三統四分乾象漢黃初景初魏晉乾度正厯三紀薑氏宋元嘉大明甲子元梁大同魏元始正光興光齊天保周天和景寅元陳七曜隋開皇皇極唐戊寅麟德考之藝文志三統四分皆一卷乾象厯術合六卷景初為卷三正厯為卷四元嘉為卷二大同為卷一七曜為卷五永安甲子武定各一卷天保甲子元大象甲寅元及周甲子元各一卷兩開皇大業皇極各一卷河西之壬辰甲寅元唐之戊寅麟德為卷皆一合為三十九卷若推漢書律厯志術一卷劉孝孫七曜雜術二卷張胄元元厯術一卷七曜厯疏三卷薑氏厯術三卷崔浩律厯術一卷不可勝紀當在二十三家之外隋志有薑氏三紀厯祖瑩神龜壬子元厯甄鸞周天和年厯為卷各一而唐志皆不著唐司厯六典太史局司厯二人從九品上掌厯法有戊寅傅仁均麟德李淳風神龍南宮説大衍厯一行測景之處分至表準漢官儀太史有治厯六人晉太史有典厯四人隋改司厯取左傳為名厯生三十六人隋置掌習厯晉調元厯周欽天厯唐符天厯晉天福四年八月司天監馬重績奏調元厯二十一卷崇文目二十卷三年重績言宣明氣朔正而星度不驗崇玄五星得而歲差一日二厯相參然後符合自前世諸厯皆起天正十一月為歲首用太古甲子為上元臣創為新法以唐天寶十四載乙未為上元雨水正月中氣為氣首詔趙仁錡等考核仁錡言明年庚子正月朔考之皆合詔行之和凝序行之五年輒差遂不用周廣順中國子博士王處訥私撰明元厯崇文目一卷民間又有萬分厯一卷蜀有永昌二卷正象厯一卷南唐有齊政厯十九卷世宗即位端明殿學士王朴通厯數乃詔朴撰定與司天少監王處訥撰傳在顯德二年顯德三年八月戊辰朴上奏曰天道之動當以數知之聖人受命必治厯數包萬象以為法齊七政以立元測圭箭以候氣審朓朒以定朔明九道以步月校遲速以推星考黃道之斜正辨天勢之升降赤道者天之紘帶也其勢圜而平記宿度之常數焉黃道者日軌也其半在赤道外去極二十四度當與赤道近則其勢斜當與赤道逺則其勢直當斜則日行宜遲當直則日行宜速故二分前後加其度二至前後減其度九道者月軌也其半在黃道內半在黃道外逺極六度出黃道謂之正交入黃道謂之中交若正交在秋分之宿中交在春分之宿則比黃道益斜若正交在春分之宿中交在秋分之宿則比黃道反直若正交中交在二至之宿則其勢差斜故校去二至二分逺近以考斜正乃得加減之數謹以步月步日星步發斂為四篇合為厯經一卷舊史亡其步發斂一篇在者三篇劉羲叟求得其本經然後大備厯一十卷草三卷崇文目十五卷顯德三年七政細行厯一卷以為欽天厯世宗親製序詔來歲行之按調元起唐天寶十四載乙未為上元用正月雨水為氣首蓋倣曹士蒍小厯之舊失之矣唐建中時曹士蒍始變古法以顯慶五年為上元雨水為歲首世謂之小厯唐志曹士蒍七曜符天厯一卷建中時人欽天於朔分之下立小分謂之秒説者謂前代諸厯朔餘未有秒者若可用秒何待求日法以齊朔分也劉羲叟謂朴能自為一家朔望正二曜協交會密晷漏實五緯齊然不能宏深簡易而徑急是取至其所長聖人不能廢也朴傳顯德二年詔朴校定大厯乃削去近世符天流俗不經之學設通經統三法以歲軌離交朔望周變率策之數步日月五星為欽天厯崇文目七曜符天厯一卷符天人元厯三卷符天九曜通元立成法二卷符天行宫一卷朝氏志合元萬分厯一卷唐曹氏撰厯元起顯慶五年庚申蓋民間所行小厯也本天竺厯為法總厯代厯名五代史厯志薛居正修會要同自古厯元及名自黃帝始用辛卯顓帝用乙卯虞用戊午夏用丙寅周用乙丁巳魯用庚子秦用乙卯漢用太初三統四分乾象魏用黃初景初晉用元泰始合元萬分宋用大明元嘉齊用天保同章正象後魏用興和正光正統梁用大同乾象永昌後周用天和丙寅明光隋用甲子開皇皇極大業唐用戊寅麟德大衍元和觀象長慶宣明寶應五紀建中貞元景福崇玄五代梁用宣明崇玄二法晉用調元周用欽天凡四十六家景初壬辰元嘉庚辰建隆應天厯即乾德元年建隆二年五月乙丑以欽天厯時刻差謬命有司研核凡二年而成用一萬二分為日法四年癸亥歲即乾德元年時未改元四月辛卯司天少監王處訥上新定應天厯經一卷算草一卷五更中星立成一卷晨昏立成一卷崇文目凡六卷御製序頒行之初唐髙祖武德元年歲在戊寅命太史令庾儉東都道士傅仁均造戊寅元厯至麟德元年祕閣郎中李淳風造麟德厯又改用神龍厯開元十六年特進張説上大衍厯乾元元年頒行山人韓穎新厯代宗用郭獻之五紀厯自後中原多事無所改作晉天福中司天少監趙仁錡等造調元厯周顯德中端明王朴造欽天厯處訥曰是厯久則差矣既而果然崇文目六卷自建隆至今凡十六變太祖應天太宗乾元真宗儀天仁宗崇天英宗明天神宗奉元哲宗觀天徽宗占天紀元髙宗統元孝宗乾道淳熙光宗會元寧宗統天開禧理宗會天景德二年龍圖閣書目厯書九十七卷崇文目四十七部二百二十九卷太平興國乾元厯太平興國七年壬午歲十月己卯一本七月又一本九月己卯實録七月會要作十一月司天冬官正吳昭素及留內直苖守信造成新厯以應天置閏差也凡律經二卷記晨昏分一卷日躔隂陽經一卷日出入刻一卷晝夜刻分一卷五更中星一卷共九卷總目云八卷以獻上命衛尉少卿元象宗集本監明律厯者同校定賜號乾元厯上自製序先是以應天厯氣朔少差昭素與徐瑩黃昭告各進新厯而昭素所造頗為精密因命施行賜昭素等金帛至道二年四月甲申呂奉天上言堯即位之年丙子迄太平興國元年丙子凡三千三百一年起商王小甲七年十二月甲申朔旦冬至自此後每七十六年得一朔旦冬至詔令撰為一書不就國史志太平興國七年新修厯經三卷至道王睿獻新厯至道元年乙未歲七月甲寅司天監丞王睿獻新厯睿言開元大衍厯議定大衍之數乃何承天氣朔母法參詳監司所奏於二萬以下修撰日法渾紀不過億數臣今於二萬以下參詳到日法有演二元不及億數其一日法一萬五百九十演得積年一千六百五十一萬五千九百餘歲其一日法一千七百演得積年三百九十八萬一千一百有餘歲今各依所立法數撰到氣朔用率積年等今具算到氣朔以進詔夏官正鄭昭晏重校正疏密以聞九月癸丑翰林天文鄭昭晏上言先受詔考校王睿所撰淳化四年新厯今比校得十八事內六事失實録云十八事合十二事失以聞上嘉之賜昭晏金紫令知厯算至道二年十一月丁卯朔司天冬官正楊文鎰請新厯六甲外增六十年事上曰支干相屬承雖止六十儻兩周甲子共成上夀之數使期頥之人得見所生之歲不亦善乎因詔新厯以百二十甲子為限曾鞏曰楊文鎰增用甲子之數咸平儀天厯咸平四年辛丑歲三月庚寅判司天監史序等上新厯賜名儀天命翰林學士朱昂作序以修厯官史序王熙元並為殿中丞王睿趙昭益石昌裔並為春官正各賜絹百五十匹是厯也凡十六卷乃王熙元處訥子所修秋官正趙昭逺一作昭逸請覆算之不從後二年果差注厯以百二十甲子為限崇文目十六卷祥符七年七月乙未上覽司天監表謂宰相曰厯象隂陽家流之大者以推步天道平秩天時為功近年惟趙昭逸能專其業天聖崇天厯天聖元年癸亥歲三月辛卯司天監上新厯賜名崇天仍命翰林學士晏殊作序厯經二卷立成十三卷五星盈縮差五卷算草十五卷目録一卷保章正張奎靈臺郎楚衍所造時司天監宋行古上修厯官遷秩賜帛有差九年閏十月壬戌司天監上重修崇天厯慶厯元年十二月丁丑司天監上所修崇天萬年厯行之五年十月辛未始頒厯於夏國志崇天萬年厯十七卷御製序楊惟德等編李淑書目有萬年厯十七卷康定初司天監楊惟德編次皇祐參定唐八厯皇朝四厯皇祐四年十一月三日甲辰詔司天監天文院以唐八厯及皇朝應天乾元儀天崇天四厯算太隂蝕分及時辰分野以聞仍命知制誥王洙修唐書官劉羲叟參定以司天監言此月十五日太隂當食也五年三月戊午洙言據司天李用晦稱推月蝕惟大衍景福稍近臣按一行厯議曰假令理厯者因開元二食曲變交限以就之則所協甚少所失甚多今亦不敢指定大衍景福為密蓋日月動物豈不少有盈縮亦變常不定厯家必無全密古來治厯名賢如太史公劉歆張衡杜預劉焯淳風一行等尚不能窮究况淺學乎羲叟言古聖人厯象之意止於敬授人時雖考交會不必吻合辰刻故有修德救蝕之禮設謂必可盡則先儒不容自為疏闊又大衍等七厯所差不多法數大同而小異亦是乘除積纍漸失毫釐且辰刻更籌惟據刻漏或微有遲疾未必獨是厯差按隋厯志日月蝕既有起訖早晚亦或變常又一行於開元中治厯以大衍及李淳風麟德劉焯皇極二厯校日食三十七事大衍課第一所中才二十二麟德得五皇極得十如一行尚未能盡如淳風輩益以踈逺况崇天厯頒用逾三十年不可偶緣天變輕議改移詰其本原亦出於大衍其景福行於唐季非治世法不可循用詔仍用崇天厯法李之才傳云劉羲叟從之才受厯法周琮曰世知厯者鮮獨孫思恭為妙而思恭又推劉羲叟為知厯李燾曰羲叟厯學本朝第一臣修臣光皆遵承之治平明天厯嘉祐八年十月望月食厯乃後天二刻遂命判司天監周琮更造新厯琮測景驗氣始知前厯氣常後天半日改而正之英宗治平二年乙巳歲二月三月己巳厯成賜名明天命學士承旨王圭為序凡經厯三卷儀晷義略二卷立成十五卷隨經備草五卷七曜細行一卷總三十六卷凡三年始成琮等七人同造厯成而中官正舒易簡等各獻所造厯詔范鎮孫思恭劉攽詳定惟琮最密乃用其厯琮於朔望餘分特晚數刻欲合嘉祐八年十月望月食及推熙寧元年正旦日食厯乃後天數刻復與崇天合遂再用崇天頒朔琮等奪所遷官紀治平二年三月己巳頒明天厯自漢太初至于今冬至差十日演紀上元甲子歲距治平元年甲辰歲積七十一萬一千七百六十算外國史志乾興初議改厯命司天役人張奎運算其術以八千為日法一千九百五十八為斗分四千二百四十九為朔餘距乾興元年壬戌歲三千九十萬六千六百五十八為積年詔奎補保章正又推擇學者楚衍與厯官宋行古集天章閣詔內侍全克隆監造厯至天聖元年八月成率以一萬五百九十為樞法得九五距萬數既上奏詔學士晏殊制序而施行焉命曰崇天厯厯法曰演紀上元甲子距天聖二年甲子歲積九千七百五十五萬六千三百四十上考往古歲減一算下驗將來歲加一算厯既成以來年甲子歲用之是年五月丁亥朔日食不效算食二分半候之不食詔候驗至七年命入內都知江德明集厯官用渾儀較測時周琮言古之造厯必使千百年間星度交食若應繩準今厯成而不驗則厯法為未密又有楊皥于淵與琮求較驗而皥術於金為得琮於月土為得詔增入崇天厯景祐元年七月日官張奎言自今月朔或遇蔀首勿避丁謹言請如舊制詔從奎議嘉祐末英宗命判司天監周琮及冬官正王炳丞王棟主簿周應祥周安世馬傑靈臺郎楊得言作新厯三年而成琮言舊厯氣節加時後天半日五星之行差半次日食之候差十刻既而中官正舒易簡與監生石道李遇更陳家學於是詔學士范鎮諸王侍講孫思恭國子直講劉攽考定是非上推尚書辰弗集於房與春秋之日食參今厯所候而易簡道遇等所學疏闊不可用新書為密賜名明天厯詔學士王圭序之琮亦為義略冠其首造厯之法必先立元元正然後定日法法定然後度周天以定分至熙寧奉元厯熙寧八年乙卯歲閏四月壬寅十二日右正言知制誥沈括上熙寧奉元厯書目奉元厯經一卷詔進括一官初仁宗朝用崇天厯至治平初司天監周琮改撰明天厯行之監生石道言未經測驗不可用不聽至熙寧元年七月望夜將旦月蝕東方與厯不協乃詔厯官雜候星晷更造新厯終五年冬日行餘分略具二年八月五日詔直舍人院呂大防詳定今年八月朔望琮言古今注厯望無在十七日者崇天厯官舒易簡言不為非朝廷從易簡説琮爭不已大防言頒厯無注十七望者詔與大防議會沈括提舉司天監言淮南人衛朴通厯法召朴至言崇天厯氣後天明天厯朔先天失在置元不當詔朴更造朴以已學為之視明天厯朔減二刻厯成行之賜朴錢百千朴欲造候簿厯官沮之朴謂當為五星候簿則古所謂綴術者以監生石道為靈臺郎九年正月二十七日括請令司天用渾儀浮漏圭表測驗令朴參校新厯改正從之先是括典領修厯載今月望月食不驗故也元豐元年十二月辛丑朔詔提舉司天監集厯官考算遼髙麗日本國與奉元厯同異紹興九年八月二十九日丙子詔陳得一裴伯夀補修奉元厯以史官修神宗正史厯志奉元厯缺故也元祐觀天厯崇寧占天厯紀元厯元祐二年九月以奉元厯疏命保章正黃居卿等六人考定初衛朴厯冬至後天一日元祐五年十一月癸未冬至驗景長之日乃在壬午遂改造新厯六年辛未歲十一月八日賜名觀天工侍王欽臣為序紹聖元年頒行書目有觀天厯經一卷紀元厯經一卷徽宗時有司以觀天推崇寧二年十一月朔為丙子頒厯之後始悟其朔當進而失進遂造占天厯改十一月朔為丁丑而再頒厯焉崇寧三年造姚舜輔上之既而厯官言占天成於私家不經考驗不可施用乃命姚舜輔等復造新厯視崇天減六十七刻半始與天道相合崇寧五年丙戌歲五月十六日厯成賜名紀元御製序其略曰聖人之於天道輔相其宜範圍其化以道法天以數作厯自大觀元年頒用會要曰洪造等所定十二月二十三日詔厯書差舛其所上厯經厯議可令改定自建隆至崇寧凡八改厯紹興統元厯紹興二年壬子歲六月甲午五日上曰厯官推步不精故七曜細行差一日近得紀元厯已全參考自明年當改正五年乙卯歲正旦日食九分半虧在辰正常州布衣陳得一獨建言定食八分半虧在已初是日果如得一所定二月丙子詔得一造厯袐書少監朱震領其事時御史張致逺言得一于朝就祕書省别造新厯六月乙巳名新厯曰統元十月戊午厯成為厯經七卷厯義二卷立成四卷考古春秋日食一卷七曜細行二卷丙辰氣朔八行草一卷總十七卷上之卷書目厯經七賜得一號通微處士震進秩命學士孫近序之先是紀元厯取徽宗受命年登極日元用庚辰日起己卯失古厯之法故立朔有訛定臘失序日食不驗今更造統元厯革紀元命日之私正交食定朔之失元用甲子日起甲子一本云命甲子為元起虛宿中度厯義載增損變法尤密者七自紹興六年丙辰頒用凡十五年而有司守之不專暗用紀元之法推步而用統元之名頒厯五年臣僚言治厯明時羲易存革故之象頒歲告朔周官述太史之職其來尚矣辰弗集房胤侯徂征於羲和火猶西流仲尼歸過於司厯其事重矣聖人上謹天戒下修人紀厯以正時不容差忒乾道厯淳熙厯厯法九議乾道二年丙戌歲夏日官以紀元推丁亥十一月朔為甲子有裴伯夀者言統元厯法推是朔當進作乙丑於是改而正之會進士劉孝榮言見行厯交食先天六刻火星差天二度乞造新厯孝榮自謂已有厯不半年可進伯夀獨謂凡造厯必先立表測景驗氣然後作厯庶可精密不在於速成而判太史局吳澤不達造厯立表之法妄言銅表難成木表易壞蓋欲黨附孝榮以覬一時之爵賞固執以難成而沮之也其年九月乙卯十五日遂命禮部侍郎周執羔典領改造新厯執羔謂立表驗氣之説經涉歲月由是不行孝榮乃倣萬分厯分作三萬分以為日法命之曰御覽七曜細行厯上之後伯夀所言皆驗三年正月二十六日執羔進對上曰日月有盈縮須隨時修改對曰舜協時月正日正為積久不能無差故協正之上曰今厯與古何如曰堯時冬至日在牽牛今日在斗一度詔以今月二十八日進呈新厯十一月二十八日壬辰詔司業程大昌御史張敦實董視考驗新舊厯先是單時言太史以統元稍差又用紀元浸以差甚邇者因劉孝榮建議改定四月日食不驗因不易臣嘗詢孝榮所定日食與太史局所定亦有異以新厯較舊厯則新厯為密乞令太史局與孝榮所定日月五星躔度以渾象測之察其何厯為近一一奏聞故有是命四年三月丙寅四日詔侍御史單時同大昌考驗時奏大昌等測驗去年十二月十日與十二日太白太隂皆新厯為近至今年二月十四日夜望月食以所見而定光滿則舊厯為差近今若便以舊厯為是則去年所測四事新厯為近而舊厯差多若以新厯近者多而造厯則今所定月食乃復稍差臣以是知天道之難測欲令李繼宗劉孝榮更定三月一日內日月五星躔度異同測驗以其驗之多而造厯焉四月二十七日癸丑詔太史局將新舊厯參用繼宗孝榮供到統元紀元新厯三厯異同狀五月二十五日庚辰詔太史新厯以乾道厯為名六月四日己丑禮部郎李燾言列聖臨御未有不更厯者獨靖康偶不及此今統元厯行之既久其與天不合固宜况厯家以為雖名統元其實紀元若紀元又多厯年所矣嘗聞厯不差不改不驗不用未差無以知其失未驗無以知其是失然後改之是然後用之此劉洪至論也舊厯多差不容不改而新厯亦未有明驗但比舊厯稍密厥初最密後猶漸差初已小差後將若何謹按仁宗用崇天厯自天聖至皇祐四年十一月月食厯家二厯不效詔以唐八厯及本朝四厯參定厯家皆以景福為密遂欲改厯劉羲叟獨謂所差無幾不可輕改又謂古聖人厯象止於敬授人時雖預考交會不必吻合辰刻仁宗從其言復用崇天厯羲叟厯學為本朝第一歐陽修司馬光皆遵承之崇天既復用又十三年治平二年始改用明天厯官周琮等皆遷官後二年明天厯課熙寧三年七月月食又不效乃詔復用崇天厯琮等皆奪所遷官崇天厯復用至熙寧八年始更用奉元厯奉元厯議沈括實主之其明年正月月食遽不效詔問修厯推恩之姓名括具奏辨厯得不廢先儒蓋謂括強辨不深許其知厯也今朝廷既用新厯則宜有以善其後乞察二劉所陳及明天崇天之興廢申勑厯官勿執今是益募能者更造密度燾嘗監視測驗適逢新厯太隂熒惑兩事之差故上言云云詔諸路搜訪精通厯書之人以名聞五年二月十二日程大昌單時等言蓋堯臣言乾道厯日月交會密近天道惟九道太隂未密續降旨訪能厯者止有荆大聲别演一法與劉孝榮定驗九道太隂行度皆未密四月三日己丑詔保章正劉孝榮靈臺郎荆大聲與裴伯夀各具今年五月以後太隂五星排日正對赤道躔度申御史臺單時程大昌汪大猷狀伏見裴伯夀上書統元厯自紹興六年頒用至十五年有司守之不專暗用紀元之法推步而用統元之名頒厯會劉孝榮言見行厯先天乞造新厯臣獨謂凡造厯必先立表測景驗氣庶可精密而不在於速成竊詳新厯七卷篇篇謬誤一步氣朔二步發斂三步日躔四步晷漏五步月離六步交食七步五星皆與天不合緣孝榮不探端知緒乃先造厯後方測驗遂致差失又詳新厯乃五代民間萬分厯自古明厯之士棄而不取孝榮乃因之荆大聲乞别立一法時等聞古厯法皆象日月星辰今大聲反以驗日食為非何所馮據六年九月二十一日戊戌成都厯學進士賈浚上厯法九議一册九年五月二十三日甲寅詔厯官吳澤等詳定疑朔局官李繼宗監視按乾道厯議云如有疑朔更考日月之行以定月之大小若依此推步則乾道十一年乙未正月一日亦是甲申朔今厯官不曾精究直以癸未注正朔竊恐差誤再行詳定合作甲申朔甲午歲十二月合作大盡從之淳熙三年丙申歲三月己巳二十四日判局李繼宗等又撰新厯七卷立成厯六卷推算備草二卷進呈上曰自古厯無不差者近世此法不傳士大夫無習之者草澤又難得其人新厯所謂彼善於此可以淳熙厯為名正月戊申令禮部祕省參詳測驗四年正月二十六日詔權行頒用五年推九月庚寅晦而北使來賀會慶節者乃己丑晦實小盡也蓋荆大聲妄改甲午年十二月為大盡故後天一日也十二年九月辛卯楊忠輔言淳熙厯自戊戌以來朔差者八年矣今歲九月望月食當在晝而淳熙厯在夜以此辨之是非可決乃命禮侍顔師魯視驗會雲蔽而止十三年三月丁酉諫議蔣繼周奏乞訪民間知厯者八月丁丑布衣皇甫繼明等言今歲九月望以淳熙厯推之當在十七日實厯弊也太史乃注望於十六日乞定驗踈密詔師魯等同視既而孝榮所定月食差一點繼明等差二點忠輔差三點乃罷之十四年四月癸酉國學生石萬又請考定星厯之差又上所著五星再聚厯詔看詳繼明等言竊取唐末崇玄舊厯不可用乞改造大厯六月辛未朔給事中王信奏乞令孝榮繼明萬各造來歲厯詳加測驗取其無差者十二月丙子繼明萬新厯成與淳熙厯差二朔上曰朔豈可差乃命禮侍尤袤祕丞宋之瑞監視十五年六月丁卯二日改命吏侍章森同往是夜月光明盛十月二十九日壬戌晦袤往視晨前月見東方十一月七日庚午進呈周必大言萬等以為月體尚存一分則不應小盡上曰十一月朔在申時所以二十九日早尚存月體耳十六年十一月壬午趙渙復言新厯冬至後天一辰詔禮侍李巘等視之紹熙會元厯銅表紹熙元年庚戌歲八月庚戌遂命同判局劉孝榮改造新厯孝榮乞與吳澤荆大聲同造二年辛亥歲正月甲寅厯成詔名會元四年癸丑歲十二月甲午朔布衣王孝禮言今年冬至日影表當在十九日壬午而會元厯乃在癸未請將修內司所掌銅表圭面付太史局測驗從之序曰以帙而分為厯書者三立成者二辛亥七曜細行者一慶元統天厯開禧新厯慶元四年戊午歲九月朔太史言月食於夜而草澤言食在晝驗視如草澤言遂命改作以禮侍胡紘提領正字馮履參定履從張行成為數學厯未成明年己未歲履罷三月庚戌詔諸道有曉天文厯算者以名來上四月書成五月壬辰朔頒用賜名統天取乾元統天之義凡厯經凡三卷沿厯他書十七種二十九卷又上臨安進士侯望重校寫萬年厯十七卷綱目二卷嘉泰二年壬戍歲日食五月朔太史以為午正草澤趙大猷言午初三刻食三分詔著佐張嗣古監視渾儀祕丞朱欽則等覆驗卒如大猷所言史官乃抵罪蓋自渡江後厯差多矣開禧三年丁卯歲七月評事鮑浣之言來歲閏差詔曾漸提領改造新厯嘉定三年八月鄒淮又請改造詔用開禧新厯推步氣朔權附統天厯頒行命戴溪提領浣之參定後天五刻改為開禧厯附統天厯行焉總趙渙造新厯以獻詹體仁作序體仁著象數義厯學啓蒙寶祐會天厯淳祐十二年壬子太史局用淳祐新厯推氣節附統天厯頒行八月戊寅二十六日詔厯名顯天自來歲頒行九月壬午朔詔明年改元寶祐癸卯二十二日改厯名會天寶祐元年正月命學士尤焴撰序九月甲辰詔修厯官遷秩餘錫銀幣序曰積年止用一千一百餘萬日法止用五百五十八太玄厯司馬光邵雍曰厯不能無差今之學厯者但知厯法不知厯理能布算者洛下閎也能推步者甘公石公也洛下閎但知厯法揚雄知厯法又知厯理太玄經元圖曰七十二策為一日凡三百六十四日有半踦滿焉以合歲之日而律厯行故自子至辰自辰至申自申至子冠之以甲而章會統元與月蝕俱沒元之道也注元以隂陽為本故兼該顓頊太初二厯踦滿二贊以合歲之日而行律厯也元告元日書斗書而月不書常滿以御虛也王涯説元曰元之首也始於中中之始也在乎一一之所配自天元甲子朔旦冬至推一晝一夜終而復始每二贊一日凡七百二十九贊而周為三百六十五日自黃帝迄三代之末凡二千四百十四年厯凡七變漢四百年厯凡四變一云五變自魏晉迄隋又十六變而後魏後周六厯不與焉唐三百年厯凡九變自五代之調元欽天而厯法始弊本朝自建隆迄慶元二百五十年間厯十四變上距黃帝之厯凡五十八變矣三代之厯多至八百年少至四百年而一變者非厯之差也正朔既改厯不容不變也漢厯率百年一變唐厯率百年三變本朝厯率百年而六變以其用之久近觀之則法之疏密可知矣魏景初厯至宋元嘉凡用二百八十年元嘉厯至梁凡六十五年梁大明厯汔陳凡八十年昔洛下閎太初厯成自言八百年當差一度其後未及八十年已差一度矣李淳風亦曰一氣差三度九日差一刻又曰自太初下至麟德差四日自太初上及僖公差三日一行亦曰劉洪厯四十五年差一度梁武帝厯一百八十六年差一度前人術精猶不免此况賤工之草創者乎作厯之法必先定方隅驗昏旦測時氣齊晷刻候中星又驗之以農事之蚤晚物類之變化然後中氣可得而定中氣既定然後閏餘可得而推堯之作厯仰觀象於天俯觀事於民逺觀宜於鳥獸堯典説黃帝迎日推策嚳厯日月而迎送之厯法其來久矣至堯始大備厯雖定數象為不定之法而必本於敬順析因夷隩仁民之政孳希毨氄愛物之政無非順天者中星正則天運可求分至定則日行可準秦顓頊厯置閏在歲後堯厯考中星定分至隨同置閏故四時不差遂為後世法自蔡雍杜預用新術治厯至何承天祖沖之考索愈精承天以月蝕之衝推日躔次沖之言古術之作在漢初周末所謂求詳於未差之前蓋劉歆班固所不能到也天地之數惟竒則無窮置閏所以補竒數也古厯簡易未立差法但隨時占候修改以與天合晉虞喜始以天為天以歲為歲乃立差以追其變約以五十年退一度何承天以為太過乃倍其年而又反不及隋劉焯取二家中數七十五年為近之亦未精密日行而多五日九百四十分日之二百三十五者為氣盈月行而少五日九百四十分日之五百九十二者為朔虛合氣盈朔虛而閏生焉十有九歲七閏則氣朔分齊是為一章朱氏書説迎日推策則有其數轉璣觀衡則有其象歸竒於扐以象閏數也斗指兩辰之間象也象數者天理也非人所能為也以定時成歲者唐典也以詔王居門終月者周制也帝王必先考正厯象蓋將以前民用授人時作易聖人治厯明時獨取諸革馮相氏辨敘事會天位注若今厯日景象皆動動則必差歲時迭更更則必異故厯不容於不改堯命官以明厯象舜齊七政以察璣衡漢厯五變而太初最密唐厯八改而大衍最密太初表於漢代景初冠於魏厯以年號為目日月轉運於天猶人之行步故推厯謂之步厯以象紀厯謂之厯象以數紀厯謂之厯數八卦列明時之象九疇開協紀之文使日蝕皆不可以常數求無以稽厯數之疏密若皆可以常數求無以知政教之休咎大衍日蝕議曲技雲浮疇官雨絶劉焯以氣命律以律起厯以厯正時以時授事凡以建兩儀而命萬物堯舜相授禹箕子相傳夫孰非是道歲周三百六十五日四分日之一而曰三百六旬有六日者舉成數也二十八宿從東而左行日從西而右行逆沿二十八宿月令正義積三十三月而一閏則春夏秋冬正矣史正義何承天立歲差法後亦不定邵堯夫立差法冠絶古今於日月交感之際隂陽虧盈求之大抵隂常虧陽常盈程氏云蓂莢知朔梧桐知閏日月相斛爾雅夏曰嵗商曰祀周曰年而唐虞曰載郭璞曰嵗取星行一次年取禾更一熟歲名支困敦子赤奮若丑攝提格寅單閼卯執徐辰大荒落已敦牂午協洽未涒灘申作噩酉閹茂戌大淵獻亥歲陽干閼逢甲旃蒙乙柔兆丙強圉丁著雍戊屠維已上章庚重光辛玄黓壬昭陽癸見爾雅史記天官厯書淮南子日月所會之次玄枵子虗危女星紀丑牛斗析木寅箕尾大火卯房心氐夀星辰亢角鶉尾已軫翼鶉火午星張栁鶉首未鬼井實沈申參觜大梁酉昴畢胃降婁戍婁奎陬訾亥璧室律吕黃鍾十一大呂十二太蔟正夾鍾二姑洗三中呂四㽔賓五林鍾六訓淮南時則作百鍾夷則七南呂八無射九應鍾十玉海卷十
