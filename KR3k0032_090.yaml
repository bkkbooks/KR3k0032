  text: 玉海卷一百九十三卷九十欽定四庫全書
  hash: sha256:6256b6ad591995fdb827d5d8c62276d7051f22c64aba18735f87377e72360079
  markers:
  - {type: page-break, offset: 11, content: '', id: KR3k0032_WYG_090-1a, image: WYG0945/WYG0945-0426a.png}
body:
  text: 玉海卷九十宋王應麟撰器用賜豫器用春秋傳曰夫有勳而不廢有績而載奉之以土田撫之以彝器旌之以車服明之以文章子孫不忘所謂福也舜賜車服舜典五載一巡守羣后四朝敷奏以言明試以功車服以庸注諸侯四朝各使陳進治禮之言明試其言以要其功功成則賜車服以表顯其能用又益稷注以功大小為差疏人以車服為榮故天子之賞諸侯皆以車服賜之覲禮云天子賜侯氏以車服是也覲禮注賜車者同姓金路異姓象路服則衮鷩毳周分物彝器錫命諸侯左傳定四年三月劉文公合諸侯于召陵蔡將先衛子魚祝他謂萇弘曰昔武王克商成王定之選建明德以藩屏周故周公相王室以尹天下於周為睦分魯公以大路金路大旗夏后氏之璜魯語古者分同姓以珍玉璜親注玉謂若夏后氏之封父之繁弱大弓名殷民六族條徐蕭索長勺尾勺氏分之土田陪敦祝宗卜史凡四官備物典䇿官司彝器常用器蓋樽罍俎豆之屬因商奄之民命以伯禽而封於少皥之虛分康叔以大路少帛綪茷旃旌大吕鍾名殷民七族陶施繁錡樊飢終葵氏封畛土略自武父以南及圃田之北竟聃季授土陶叔授民命以康誥而封於殷虗皆啓以商政疆以周索法也分唐叔以大路密須之鼓闕鞏甲名姑洗鍾名懷姓九宗職官五正命以唐誥而封於夏虗啓以夏政疆以戎索太原近戎三者皆叔也而有令德故昭之以分物不然文武成康之伯猶多而不獲是分也昭十二年楚子謂子革曰昔我先王熊繹與吕伋齊王孫牟衛燮父晉禽父魯並事康王四國皆有分分珍寶之器我獨無有云云十五年十二月晉荀躒如周以文伯宴樽以魯壺魯所獻壺樽王曰諸侯皆有以鎮撫王室晉獨無有籍談對曰諸侯之封皆受明器於王室故能薦彞器於王謂可常寶之器王曰叔父唐叔成王之母弟也其反無分乎密須之鼓與其大路文所以大搜也闕鞏之甲武所以克商也唐叔受之以處參虛正有戎狄其後襄之二路大路戎路鏚鉞秬鬯彤弓虎賁文公受之以有南陽之田撫征東夏非分而何夫有勳而不廢有績而載奉之以土田撫之以彝器旌之以車服明之以文章子孫不忘所謂福也書旅􅋙四夷獻方物王乃昭德之致于異姓之邦無替厥服分寶玉于伯叔之國時庸展親人不易物惟德其物書序武王既勝殷邦諸侯班宗彞班宗廟彞器酒樽賜諸侯作分器史記衛世家成王舉康叔為周司寇賜衛寶祭器家語肅慎氏貢矢以分太姬配胡公而封諸陳詩韓奕美宣王能錫命諸侯王錫韓侯淑旗綏章簟茀錯衡玄衮赤舄鉤膺鏤錫鞹鞃淺襪鞗革金厄江漢釐爾圭瓚秬鬯一卣告于文人錫山土田于周受命自召祖命閟宫乃命魯公俾侯于東錫之山川土田附庸公羊傳定八年寶者何璋判白半圭弓繡質言大者力千斤龜青純千嵗之龜青髯明于吉凶此皆魯始封之錫文十三年傳封魯公以為周公也周公拜乎前魯公拜乎後注始受封時拜于文王廟也魯祭周公何以為牲周公用白牡殷牲魯公用騂犅周牲羣公不毛不純色何以為盛周公盛魯公燾羣公廪周錫乘馬詩嵩髙王錫申伯四牡蹻蹻鉤膺濯濯王遣申伯路車乘馬采菽君子來朝何錫豫之路車乘馬玄衮及黼韓奕乘馬路車卷阿君子之馬既間且馳書平王錫晉侯馬四匹易康侯用錫馬蕃庶周齒杖禮伊耆氏掌國之大祭祀共其杖咸所以盛杖者大祭祀尚敬雖老亦弗杖故為之共杖咸軍旅授有爵者杖共王之齒杖王所以賜老者八十杖於朝曲禮大夫七十致事若不得謝必賜几杖武王有杖銘魯四代服器官明堂位鸞車有虞氏之路也鉤車夏后氏之路也大路殷路也乘路周路也四代之車有虞氏之旗夏后氏之綏殷之大白周之大赤四代旌旗夏后氏駱馬黑鬛殷人白馬黑首周人黃馬蕃鬛夏后氏牲尚黑殷白牡周騂剛三代之馬及牲色不同泰有虞氏之尊也山罍夏后氏之尊也著殷尊也犧象周尊也四代尊爵夏以盞詩行葦注夏曰盞殷以斚周以爵三代爵灌尊夏以雞夷殷以斚周以黃目其勺夏后氏以龍勺殷以疏勺周以蒲勺三代灌尊及勺土鼓蕢桴葦籥伊耆氏之樂也拊搏玉磬揩擊大琴大瑟中琴小瑟四代之樂器也古代及四代樂器魯公之廟文世室也武公之廟武世室也二廟米廩有虞氏之庠也序夏后氏之序也瞽宗殷學也頖宫周學也四代之學崇鼎貫鼎大璜封父龜天子之器也越棘大弓天子之戎器也夏后氏之鼓足殷楹鼓周縣鼓垂之和鐘叔之離磬女媧之笙簧夏后氏之龍簨虡殷之崇牙周之璧翣三代樂縣之飾有虞之兩敦夏之四璉殷之六瑚周之八簋俎有虞氏以梡夏后氏以嶡殷以椇周以房俎夏以楬豆殷玉豆周獻豆簋俎言四代豆言三代有虞氏服韍夏后氏山殷火周龍章四代韍制有虞氏祭首夏后氏祭心殷祭肝周祭肺夏后氏尚明水殷尚醴周尚酒祭言四代酒言三代有虞氏官五十夏后氏官百殷二百周三百四代官有虞氏之綏夏后氏之綢練殷之崇牙周之璧翣四代喪葬旌旗之飾凡四代之服器官魯兼用之正義曰或用三代或用四代隨其禮存者而用之耳又曰言伊耆女媧非唯四代而已魯之郊禘惠公請之也記禮者以為成王賜之以康周公漢賜金髙紀六年三月上心善太公家令言賜黃金五百斤文紀元年十月賜太尉勃金五千斤丞相平將軍嬰二千斤朱虗侯章襄平侯通典客揭千斤列傳叔孫通起朝儀賜金五百斤竇嬰為大將軍賜金千斤衛青賜千金東方朔武帝賜黃金三十斤廣陵王元鳳中入朝賜黃金二千斤杜延年為北地太守郡中清靜賜黃金二千斤東郡守王尊同黃霸循吏為潁川太守賜黃金百斤一又云孝宣時二千石有治理效以璽書勉厲增秩賜金潁川黃霸治第一賜黃金百斤龔遂賜黃金贈遣循吏韋賢為丞相地節三年賜黃金百斤罷歸加賜第一區丞相致仕自賢始尹翁歸元康四年卒家無餘財天子賢之賜子黃金百斤霍光賞賜前後黃金七千斤趙充國乞骸骨賜黃金六十斤張敞拜膠東相賜黃金三十斤夏侯勝撰尚書論語説賜黃金百斤疏廣為太子太傅上疏乞骸骨賜黃金二十斤皇太子贈以五十斤于定國罷賜黃金六十斤薛廣德同陳湯加賜黃金百斤太常安丘侯劉常同揚雄上書賜帛五十四黃金十斤漢安車駟馬杜延年趙充國薛廣德史髙安丘侯劉常廣陵王胥皆賜安車駟馬師古曰安車坐乘之車也晉賜王祥鄭沖陳騫安車駟馬漢靈夀杖唐靈夀杖孔光傳詔賜太師靈夀杖注服虔曰靈夀木名師古曰木似竹有枝節自合杖制不須削治李尤銘曰甘泉潤根清露流莖乃制為杖扶危定傾王粲有頌元狩元年張騫言使大夏時見邛竹杖唐書李靖傳遷右僕射貞觀四年八月甲寅乞骸骨帝遣岑文本諭旨曰自古富貴而知止者少公今引大體朕成公美為一代法八年十月丙寅乃授特進就第三日一至中書門下平章政事加賜靈夀杖舊史九年正月賜為表云八年十一月辛未罷特進詩釋文匱即今靈夀也節中腫以扶老漢賜筆墨赤管筆揚雄書賜筆墨錢六萬得觀書石渠段成式送墨云給蘭臺率以六石漢官漢制尚書郎作文書起草月賜赤管大筆一雙隃麋墨一枚文房四譜漢書云尚書令僕射丞郎官月給大筆一雙篆題曰北宫工作張安世持橐簮筆事孝武司馬相如荀悅並尚書給筆札魏明帝見殿中侍御史簮白筆側階而立唐李白撰詔誥宫嬪執牙筆漢賜乘馬傳光武解左驂賜破虜將軍賈復建武十一年引見并州牧郭伋賞賜車馬衣服二十二年為太中大夫賜宅一區及帷帳錢穀二十八年賜少傅桓榮輜車乘馬引見趙喜賜鞍馬待詔公車見杜林賜車馬衣被召任延為九真守賜馬雜繒建武初永平六年召韋彪拜謁者賜車馬衣服十二年賜太僕祭肜馬三匹十五年魯恭從狩南陽賜駙馬從駕王景拜河隄謁者賜車馬縑錢張酺以尚書教授賜車馬衣裳建初三年賜東平王蒼琅邪王京書遺宛馬一匹鄧騭征羌班師大會羣臣賜束帛乘馬前紀元帝初元五年四月賜宗室子有屬籍者馬一匹至二駟漢賜竒果唐賜果桓榮傳為博士入會庭中詔賜竒果受者皆懷之榮獨手捧帝曰真儒生也馬武傳逺方貢珍甘必先遍賜列侯而太官無餘東平王蒼傳賜太官分食物珍果唐書陳叔達賜食得蒲陶不舉歸奉母因賜之蕭嵩傳荆州進黃甘帝以紫帉包賜之裴諗傳為學士承旨宣宗幸其院取御奩果以賜文藝傳中宗置修文館學士凡天子饗會遊豫唯宰相及學士得從春幸梨園賜細柳圈夏宴蒲陶園賜朱櫻秋登慈恩浮圖獻菊花酒稱夀冬幸新豐賜浴湯池給香粉蘭澤從行給翔麟馬漢玉杖鳩杖唐鳩杖紀永平二年十月幸辟雍初行養老禮詔曰云云注養三老五更三老扶玉杖五更不杖又見禮儀志禮儀志仲秋之月縣道皆案户比民年始七十者授以玉杖餔之麋粥八十九十禮有加賜玉杖長尺端以鳩鳥為飾舊説鳩不噎欲老人食不噎故以為飾周禮羅氏仲春獻鳩以飬國老取春物始化以助生氣非獨取不噎之意五鳩鳩民傳光武初即位賜卓茂几杖車馬衣一襲絮五百斤永建二年召樊英設壇賜几杖待以師傅之禮靈帝以袁逢為三老賜以玉杖唐紀玄宗開元二年九月丁酉宴京師侍老于含元殿賜九十以上几杖八十以上鳩杖婦人亦如之賜于其家又見養老類幽求子曰五嵗有鳩車之樂博古圖有漢鳩杖首鐓漢賜珍寶衣服見冕服類漢賜帛見上漢賜玉玦東觀漢記明帝詔曰馮魴以忠孝出入八年數進忠言正諫賜以玉玦漢賜玉壺金錯鉤佩楊賜傳光和四年拜太常詔賜御府衣一襲自所服冠幘綬玉壺革帶金錯鉤佩隋志東觀記楊賜拜太常詔賜自所著革帶魏延年杖通鑑魏黃初二年十月己亥公卿朝朔旦引楊彪待以客禮賜延年杖馮几又見續漢書傳魏文帝以彪為太尉彪辭乃授光祿大夫賜几杖衣袍朝會引見令彪著布單衣鹿皮冠杖而入待以賔客之禮博古圖有漢蟠龍蟠螭杖頭後周武帝以于謹為三老賜延年杖後魏髙允傳太和二年告歸明年賜蜀牛一頭四望蜀車一乘素几杖各一蜀刀一口又賜珍味春秋常致之晉賜麟角筆管武帝以賜張華唐賜良馬列傳劉世讓髙祖賜良馬金帶韋挺太宗伐遼東親解貂裘及中廄馬以賜李靖賜尚乘馬二平江南賜馬百匹張行成太宗賜名馬一魏徵上疏列為屛障賜馬二匹薛仁貴為中郎將髙宗賜御馬趙弘智講孝經賜名馬一岑義修中宗實録睿宗賜良馬一郭子儀肅宗賜御馬孫思邈上元元年賜良馬李晟貞元三年三月賜良馬張建封貞元十三年賜名馬孔述睿德宗賜第宅給以廄馬張茂昭入朝宴麟德殿賜良馬𤭔轡藻韉唐賜金又見下蕭德言傳髙宗立拜銀青光祿大夫乘輿至肅章門引見禮遇隆重晉府及東宫舊臣子孫並增秩賜金殷侑傳開成元年召為刑部尚書問治安術言宜任耆德帝賜綵三百匹又賜黃金十斤以酬直言唐黃金瓶秦瓊傳事秦王府從破尉遲敬德功多帝賜以黃金瓶一作瓶列傳蕭瑀奏便宜數十條髙祖手敕賚黃金一函以報薛收為天策府記室上書諌王止田獵王答曰明珠兼乘未若一言賜黃金李絳元和中為相帝曰言骨鯁真宰相也遣使者賜酴醿酒李晟城鹽州復故池以新鹽賜宰相後魏崔浩論事賜御縹醪十觚水精戎鹽一兩曰朕味卿言如此鹽酒唐賜胡瓶金壺瓶李大亮傳貞觀中通監三年十一月癸卯為涼州都督常有臺使見名鷹諷大亮獻之大亮密表曰陛下絶田獵久矣而使者求鷹信陛下意耶乃乖昔旨如其擅求是使非其才太宗報書曰有臣如此朕復何憂古人以一言之重訂千金今賜胡瓶一雖無千鎰乃朕所自御又賜荀悅漢紀曰悅議論深博極為政之體公其繹味之政要云今賜卿金壺瓶金碗各一枚實録貞觀三年十一月癸卯謂侍臣曰大亮表云云賜金壺以彰忠讜唐賜佩刀政要貞觀三年魏徵上書賜金甕一口十三年上疏漸不克終十條太宗謂曰列為屏障朝夕瞻仰賜黃金十斤廄馬二匹通鑑貞觀十二年三月丙子以皇孫生宴于東宫賜房玄齡魏徵佩刀詳見兵器類唐金背鏡賜鍾乳傳髙馮字季輔貞觀初授太子右庶子會要云中書舍人數上書言得失貞觀九年上政要云十七年疏賜鍾乳一劑曰卿進藥石之言朕以藥石相報後為吏部侍郎善銓敘人物太宗賜金背鏡一况其清鑒通典十七年季輔知選十八年獨知選事賜金背鏡政要諫議谷那律賜帛加以金帶唐飛白扇見御書類貞觀中唐賜銀鍾傳杜淹為天䇿府兵曹文學館學士常侍宴賦詩尤工賜銀鍾太宗賜酆王元亨金盞宋賜蕭思話銀鍾酒唐賜金鏡珠囊舊紀開元十七年八月癸亥以誕日燕花蕚樓百寮表請以每年八月五日為千秋節王公已下獻鏡及承露囊十八年八月丁亥上御花萼樓以千秋節百官獻賀賜四品以上金鏡珠囊縑綵五品以下束帛上賦八韻詩唐賜鞭張建封傳拜徐泗濠節度使貞元十三年來朝見延英賦朝天行以獻眷遇異等賜名馬珍具上已賜宴曲江還鎮帝賦詩以餞又使左右以所持鞭賜之曰卿節義嵗寒弗渝故用此為況後周賜楊素以竹䇿曰欲大相驅䇿故賜此物楚辭天問伯昌號衰秉鞭作牧王逸云文王為雍州牧唐賜羣臣襲衣傳李元紘開元初户部侍郎條政得失帝才之謂可丞輔賜衣一稱絹二百匹明年十四年四月丁巳拜中書侍郎平章事五月五日丁丑年十五宴武成殿賜羣臣襲衣特以紫服金魚錫元紘及蕭嵩羣臣無與比李朝隱開元中為同州刺史玄宗東幸召見慰勞賜衣帛陸贄在翰林帝親倚至解衣衣之舊紀貞元七年三月壬申詔賜衣文綵不常非制也朕今思之宜有定制節度使宜以鶻銜綬帶觀察使宜以鴈銜威儀威儀瑞草也劉禹錫謝春衣表在身不稱恐招鵜翼之譏居任無功叨受鶴紋之賜謝冬衣表三軍挾纊九月授衣權德輿謝端午賜衣表佩長命之縷俾夀而臧捧在笥之衣既安且吉宋朝十月旦賜錦襖學士觀察使簇四金雕尚書執政八搭暈錦宰臣使相天下樂唐白羽扇張九齡集開元二十四年盛夏賜宰相白羽扇九齡作賦曰肅肅白羽穆如微風縱秋氣之移奪終感恩於篋中傳同孫逖為宰相表云賜竹扇及聖贊世本武王始作箑庾肩吾團扇銘曰武王造扇班固有白綺扇賦漢尚方竹扇名曰九華曹植作賦以賜常侍諸葛孔明持白羽扇指麾三軍晉顧榮以白羽扇麾之陳敏軍潰陸機有羽扇賦宋謝惠連有白羽扇贊對越休命奉揚玄風唐佩筆見上類武后賜陳子昻筆札中書省令條上德宗賜渾瑊御筆一管唐宫錦瑞錦封敖傳為翰林學士屬辭瞻敏不為竒澀文切理勝武宗使作詔書慰邊將傷夷者曰傷居爾體痛在朕躬帝善其如意出賜以宫錦其後復草賜李德𥙿制曰謀皆豫同言不他惑德裕以能明專任已以成功謂敖曰陸生恨文不逮意如君此等豈易得邪解所賜玉帶與之傳王方慶治廣州號第一詔賜瑞錦雜綵以著善政武后時李白衣宫錦袍張萬福為和州刺史代宗下詔褒美賜具衣官錦十雙韋綬德宗以蜀纈袍覆之馮定為太常少卿文宗誦其送客西江詩召升殿賜禁中瑞錦唐金蓮華炬令狐綯傳大中四年為翰林學士承旨夜對禁中燭盡帝以乘輿金蓮華炬金蓮花蜀柄也送還院吏望見謂天子來及綯至皆驚俄同平章事十月辛未東觀奏記上將命綯為相夜半含春亭召對賜金蓮花炬送歸學士院栁公權浴堂召對繼燭見跋宋朝元祐三年四月蘇軾草三制對小殿撤金蓮燭送歸院唐賜成象殿茶韓偓金鑾密記翰林當直學士春晚則日賜成象殿茶吳主禮賢方聞置茗晉臣愛客才有分茶建隆長春節賜衣賜百官時服建隆元年二月丙戌長春節賜羣臣衣各一襲宰相率百官上夀賜宴相國寺辛卯大宴廣德殿凡誕節後擇日大宴自此始三年冬十月乙酉朔始賜文武常參官冬服有司言故事所賜止將相學士及諸軍大校上曰不及百官甚亡謂也乃遍賜之端午十月一日皆賜興國二年十月戊午朔賜百官諸軍冬服九年五月賜臣僚時服自是嵗以為常開寶賜真珠盤龍衣開寶元年七月董遵誨為通逺軍使上以西戎近邉命守焉遵誨常遣外弟劉綜來貢馬及還上解所服真珠盤龍衣使齎賜之綜曰遵誨人臣豈敢當此賜上曰吾委遵誨方面不以此為嫌也太平興國賜新茶興國八年六月辛亥賜宰相文明翰林樞密直學士中書舍人節度觀察使建州所貢新茶雍熙賜玉硯雍熙三年正月錢俶進草書絹圖二翌日墨詔奬諭賜玉硯一金匣副之龍鳯墨百挺紅緑筆百管盈丈紙百軸梁李琪謝賜大硯云記室濡毫於楯鼻史臣染翰於螭頭自叨金玉之近班常愧玉蟾之舊物雍熙草書扇淳化紅綾扇天聖飛白扇見御書類晏殊御飛白書扇賦重午前一日以飛白縑扇賜近臣灑回春之藻翰成變楷之竒文命邇列以垂賜聳歡聲於薦紳婉結無方輕濃有制該筆苑之遒潤集書林之妍媚窮小篆以取法究八分而探異神仙縹眇之狀鸞鷟飛翔之藝標玉字于日中湛金波于月際隋珠揚照乘之采昆玉吐如虹之氣在昔貞觀之隆文皇念功時則有無忌師道沐鸞蚪之班詔咸亨以降髙宗禮賢時則有至德處俊荷楫翼之垂訓咸簡册以傳載為古今之芳潤豈如親逢盛時載荷榮錫一言蒙魯衮之厚八體著羲圖之則五明在手見虞帝達聰之勤四座生風彰武王救暍之德欣待濯而蠲暑誓悉心而陳力順涼燠以舒卷永銜恩而無極皎皎齊素冉冉紋篠合二美以為箑景德賜氷景德四年六月丙辰賜編修君臣事迹官氷十匣以暑甚特賜之乾道五年六月十日詔自初伏日賜學士氷一月周凌人夏頒氷古者日在北陸而藏氷西陸朝覿而出之祥符鏤文紅管筆祥符二年十一月丁巳內出太宗鏤文紅管筆分賜王旦等人一雙因謂旦等曰先帝聽政之暇常以筆法為意諸家字體無不學者學之必成旦等曰先帝筆法英異非人臣所及又見御書類司馬光通鑑表曰先帝賜御府筆墨光有黃囊貯紅管筆一枝實治平中賜物張栻銘筆囊曰厚陵之賜文正之澤傳之方來見者改色筆端吐辭穀粟萬世豈惟改色公心是繼在昔魏公世保其笏謹哉斯藏惟德其物英宗賜王廣淵筆蘇頌有謝賜筆墨紙表象管寶跗之副染松煙灑鵝素天聖賜繡韉天聖七年二月十一日詔資政學士晏殊中謝日賜繡韉以嘗預機密故也政和三年二月賜諸王金花鞍韉詩鞗革注轡首也左傳繁纓以朝治平賜盤龍金盆治平三年九月丙辰夜召學士王圭至蘂珠殿特詔中書除端明殿學士翌日又賜盤龍金盆一曰知卿忠純有守故有此賜建炎賜研銘建炎中賜綦崈禮研蓋上所常用者研刻御書曰操觚濡墨兮中有殺生造次必思兮令世可行恤刑手詔記建炎四年六月崈禮草范宗尹右相制上以所用筆研金水滴牙尺賜之研隂刻御製銘云云紹興六年十一月賜張浚古端石硯筆墨太公金匱硯之書曰邪心讒言無得汙白李尤王粲有硯銘繁欽有讃傅玄有賦墨海潛璞銅瓦端石庾肩吾有謝銅硯筆格啓云煙磨青石管插銅龍曽鞏謝紙筆表氷苔之質秋兔之毫漆管緑沉之妙文犀象齒之殊筆晉側理漢赫蹄紙鄴殿鳯銜漢朝魚網紙沈家令之謝箋思生松黛楊師道之佳句才掞煙華名殊九子狀異二螺墨紗帷晝暖墨花春紫石硯歌紹興賜春幡勝紹興十三年正月辛丑立春節學士院始進貼子詞百官賜春幡勝自建炎以來久廢至是始復紹興賜宸翰扇紹興十四年七月以宸翰扇賜祕書少監遊操車駕幸省故也詳見經筵類欹器天下之理至于中而止故列聖相傳以中為大法而制器亦象焉過與不及均為非中惟中則正矣斯器日陳于前亦几杖有銘之意五帝侑巵魯宥坐器欹器圖文子守弱篇三皇五帝有觀戒之器命曰侑巵注欹器也見荀子注荀子宥坐篇第二十八孔子觀于魯桓公之廟有欹器焉傾欹易覆之器孔子問于守廟者曰此為何器對曰此蓋宥坐之器言人君可置坐右以為戒宥右同或曰侑同勸也孔子曰吾聞宥坐之器虗則欹中則正滿則覆顧謂弟子曰注水焉挹水而注之中則正滿而覆虗而欹孔子喟然嘆曰烏有滿而不覆者哉子路曰敢問持滿有道乎孔子曰聰明睿智守之以愚功被天下守之以讓勇力振世守之以怯富有四海守之以謙此所謂挹而損之之道也家語同淮南子道訓篇孔子觀桓公之廟有欹器焉謂之宥巵顧謂弟子曰取水注之中則正滿則覆揚子重黎篇或問持滿曰扼欹注欹器也劉子誡盈篇仲尼觀欹器而革容監損益而歎息唐文粹李德裕作欹器賦云周公始作兹器告於神明難守者成難持者盈丞相潞國公見遺欹器賦云赫赫姬旦配德阿衡始作兹器告于神明挹彼注兹受之若沖非神鼎之自盈異衢樽之不竭許敬宗韋肇亦有賦隋志小説部魯史欹器圖一卷劉徽注唐藝文志儒家器凖圖三卷後魏信都芳撰聚渾天欹器等諸後魏志信都芳撰安豐王延明所集樂説并器物凖圖二十餘事而注之周廟欹器説苑敬慎篇孔子觀於周廟而有欹器焉孔子問守廟者曰此為何器對曰蓋為右坐之器孔子曰吾聞右坐之器滿則覆虛則欹中則正有之乎對曰然孔子使子路取水而試之滿則覆中則正虗則欹孔子喟然嘆曰嗚呼惡有滿而不覆者哉子路曰敢問持滿有道乎孔子曰持滿之道挹而損之晉杜預傳周廟欹器云云見下漢御坐欹器見下段文選注曹大家欹器頌曰侍帝王之密坐晉欹器南齊欹器杜預傳周廟欹器至漢東京猶在御坐漢末喪亂不復存形制遂絶預創意造成奏上武帝嘉歎焉南史杜預有巧思造欹器三改而成南齊永明中竟陵王子良好古祖沖之造欹器獻之與周廟不異後魏欹器傳安豐王延明使祖暅之作欹器漏刻銘後周清徽殿欹器頌周文帝大統四年宣光清徽殿初成薛憕為之頌帝又造二欹器一為二仙人共持一鉢同處一盤鉢蓋有山山有香氣一仙人持金瓶傾水灌山而注乎器謂之仙人欹器一為二荷同處一盤相去盈尺中有蓮下垂器上以水注荷則出於蓮而盈乎器為鳬雁蟾以飾之謂之水芝欹器二盤各處一牀鉢員而牀方中有人三才之象也皆置清徽殿前形似觥而方滿而平溢則傾憕各為頌隋欹器藝術傳耿詢有巧思進欹器煬帝善之臨孝恭著欹器圖三卷唐張元覽欹器賦曰殷湯鏤几以為虞孔甲鐫盤以自鏡韋肇賦曰金人貽誨于周書撲滿流規於漢史匪雕匪刻可大可久鄙巨壑之難盈惡滿巵而虗受唐欹器嗣曹王臯傳臯嘗自創意為欹器以髹木上出五觚下鋭圓為盂形所容二豆少則弱多則強中則水器力均雖動搖乃不覆云實録中宗景龍四年正月丁巳內出欹器示侍臣曰朕今造成置之坐右以誡盈滿淳化欹器太宗淳化中翰林學士蘇易簡內直嘗以水試欹器小黃門宣事密奏即召易簡問之曰卿所玩得非欹器邪易簡曰然此江南徐鉉所作取至便坐親較試之再三賞歎易簡曰日中則昃月滿則虧器盈則覆物盛則衰願陛下持盈守成慎終如始固萬世基業皇祐欹器御製欹器論後述皇祐四年三月戊辰上御邇英閣內出欹器一陳御坐前諭丁度等曰朕思古欹器之法試令工人制之以示卿等命左右以水注之虗則欹中則平滿則覆率如家語荀子淮南之説法度精巧上曰日中則昃月盈則虧聖人有持盈戒慎之遺旨朕每思臨天下舍中正之道何所法乎丁度對曰臣等亦願以中正事陛下因奏太宗時嘗作此器真宗制欹器論寶訓云真宗為贊演先儒之義以垂戒帝曰然四月庚辰上遂製欹器論後述一篇以申存亡進退虧成之鑒以示之度等奏曰聖文大旨率遵先帝聖訓父作子述此周道之所以無憂而永福萬邦之慶也願宣布中外使知聖心所存上曰欲使卿等見之何須宣布也度曰臣等各願傳本以彰榮遇上曰可便以此本賜卿度等拜而受之實録皇祐四年四月庚辰御邇英閣出欹器論後述示講讀官長編同燕肅嘗造欹器以獻崇文目小説有欹器圖一卷於滿見桀於中見禹用寶一謙以集衆甫有器在右如弦與韋假以溢我我其持之厥器之安孰能危之詔諫國語召公曰天子聼政使公卿至於列士獻詩瞽獻典史獻書師針瞍賦矇誦百工諫庶人傳語近臣盡規親戚補察瞽史教誨耆艾修之而後王斟酌焉范文子曰古之王者政德既成又聽於民使工誦諫於朝在列者獻詩使勿兜風聽臚言於市辨妖祥於謠考百事於朝問謗譽於路有邪而正之盡戒之術也説苑晉太史屠餘曰國之興也天遺之賢人與之極諫之士堯進善旌舜告善旌漢文紀二年五月詔曰古之治天下朝有進善之旌誹謗之木所以通治道而來諫也今法有誹謗妖言之罪是使衆人不敢盡情而上無由聞過失也將何以來逺方之賢良其除之注應邵曰旌幡也堯設之五達之道令民進善也服虔曰誹謗之木堯作之橋梁交午柱頭也應邵曰橋梁邊板所以書政治之愆失也至秦去之今乃復施師古曰應説是也韋昭曰慮政有闕失使書于此後代因以為飾今宫外橋梁頭四柱木是也鄭云即今之華表大戴禮保傅篇有進善之旍注堯置之令進善者立旍下有誹謗之木注堯設之使書政之愆失有敢諫之鼓注舜置之使諫者擊之管子桓公問篇舜有告善之旌而主不蔽文選揚旌求士注亦引此事唐范傳正有進善旌賦詩干旄美好善也衛文公臣子多好善旌堯舜木堯舜三王鼓堯舜禹武王堯敢諫鼓殷周舜誹謗木湯司過史司直禹鞀武王鞀淮南子主術篇楊震傳注引帝王紀下二句同堯置敢諫之鼓注欲諫者擊鼓舜造一作立誹謗之木注書善否於表木四舜闢四門明四目達聰湯有司過之史禹有戒慎之鼗注欲戒君令謹疑者搖鞀鼓微聖人於善無小而不舉於過無而不改又云湯有司直之人官名武王立戒謹之鞀鄧析子堯置敢諫之鼓帝王世紀淮南子劉子通厯並同又申屠剛傳注吕氏春秋堯有欲諫之鼓注欲諫者擊其鼓舜有誹謗之木注書其過失以表木湯有司過之士武王有戒慎之鞀注欲戒者搖其鞀鼓之猶恐不能自知劉子貴言篇昔堯置招諫之鼓舜植誹謗之木湯立司過之士武王立戒慎之鼗大戴禮保傅篇太子既冠成人云云有進善之令有誹謗之木有敢諫之鼓是殷周所以長有道也注見上同賈誼新書孫䇿書曰上天垂司過之星聖王建敢諫之鼓吳志注李密檄云唐堯建鼓思聞獻替之言傳唐貞觀十一年八月甲子魏證曰封事其謗木之遺乎裴諝曰諫鼓謗木之設所以達幽枉延直言陸贄奏議虞舜設誹謗之木而帝德廣堯納諫鼓舜求針木唐禇亮傳為黃門侍郎秦王文學時髙祖以冦亂漸平每冬畋狩亮上疏諫曰臣聞堯鼓納諫舜木求針茂克昌之風致升平之道堯舜諫鼓謗木後漢楊震傳河間男子趙騰詣闕上書指陳得失帝發怒收考詔獄震上疏救之曰臣聞堯舜之世諫鼓謗木立之于朝注引帝王世紀云云以達聰明開不諱漢賈誼傳古者太子既冠成人免於保傅之嚴則有記過之史徹膳之宰進善之旌誹謗之木敢諫之鼓注師古曰進善言者立於旌下譏惡者書之於木欲顯諫者則擊鼓敢保傅篇曰此殷周所以長有道也鄧析子云堯置諫之鼓舜立誹謗之木此聖人也文選注引之後張晧傳順帝即位晧上疏諫曰堯舜立敢諫之鼓三王樹誹謗之木堯謗木諫鼓唐獨孤及傳堯設誹謗之木於五達之衢吳兢傳堯設諌鼓禹拜昌言晉郭舒傳堯立謗木舜置諫鼓後漢申屠剛傳建進善之旌縣敢諌之鼓注旌幡也淮南子曰禹縣鐘鼓磬鐸云云帝王紀曰堯置敢諌之鼓崔豹古今注答程雅問堯謗木曰今之華表木形似桔橰大路髙衢悉施焉秦乃除之漢始復修今西京謂之交午木周禮大僕建路鼓注鄭司農云若今時上變事擊鼓唐王起諌鼓賦百官尚針七臣猶諍白居易諌鼓賦以為聖人思聞蹇諤故表器而名之禹鞀待賢虡鼓鍾鐸磬木鐸建鼓淮南子泛論訓禹之時以五音聽治縣鐘鼓磬鐸置鞀以待四方之士為號曰教寡人以道者擊鼓諭以義者擊鐘告以事者振鐸語以憂者擊磬有獄訟者搖鞀文選永明九年王元長融䇿秀才文或設虡待賢注鬻子曰禹政篇第七禹治天下以五聲聽治為銘於筍虡曰教寡人以道者擊鼓教以義者擊鐘教以事者振鐸語以憂者擊磬語以獄訟者搖鞀搖一作揮是以四海之士皆至夏書胤征先王克謹天戒每嵗孟春遒人以木鐸徇于路官師相規工執藝事以諌管子禹立建鼓于朝而備訊唉舊唐史李密傳夏禹懸鞀時聽針規之美禹敢諌旗後漢書郅夀傳夀下吏當誅何敞上疏理之曰聖王立敢諌之旗聽歌謡於路注帝王紀曰堯有敢諌之鼓舜有誹謗之木禹置敢諌之幡殷周司過史大戴禮記保傳篇又賈誼新書太子既冠成人新書作天子免於保傅之嚴則有司過之史新書作司直有徹膳之宰新書作虧字是殷周所以長有道也失度則史書之工誦之三公進而讀之宰夫減其膳是天子不得為非也吕氏春秋湯有司過之士注正其過闕孝經天子有爭臣七人鄭氏注謂三公左輔右弼前疑後承周嘉石肺石禮大司冦以嘉石平罷民文石也樹之外朝門左肺石達窮民赤石也朝士左嘉石右肺石疏嘉善也有文稱嘉欲使罷民思文理以改悔自修火色赤肺亦赤故知肺石是赤石使之赤心不妄告也漢皂囊蔡雍傳光和元年詔雍陳政要以皂囊封上注漢官儀曰凡章表皆啓封其言密事得皂囊也公孫瓉傳上疏曰袁紹每有所下輒皂囊施檢文稱詔書注同上禮儀志冬夏至八能士書板言事封以皂囊送西陛跪授尚書書囊帷見後赤白囊漢言事板禮儀志冬夏至八能士行事五音並作正德曰八能士各言事八能士各書板言事文曰冬至黃鍾之音調君道得孝道褒商臣角民徵事羽物各一板否則召太史令各板書封以皂囊送西陛跪授尚書孟嘗君書門板楚語云衛武公倚几有誦訓之諫注工師所誦之諌書之於几也崔琦曰昔管仲相齊樂聞譏諌之言蕭何佐漢乃設書過之吏陸贄曰植謗木陳諌鼓列爭臣之位置采詩之官以宣其言晉白獸樽禮志正旦元會設白獸樽於庭樽蓋上施白獸若有能獻直言者則發此樽飲酒案禮白獸樽乃杜舉之遺式也為白獸樽蓋後代所為示忌憚也詳見上晉諌鼓謗木元帝紀大興元年六月戊戌初置諌鼓謗木十一月二年五月十二月詔公卿百官上封事西魏大統五年十月於陽武門外懸鼓置紙筆以求得失梁謗木肺石函通監武帝天監元年夏四月癸酉詔公車府謗木肺石各置一函若肉食莫言欲有橫議投謗木函若有功勞才器寃沈莫達者投肺石函文選任昉天監三年䇿秀才文朕立諌鼓設謗木於兹三年矣注引鄧析子唐嘉石肺石會要顯慶五年八月東西京置嘉石垂拱元年二月制朝堂登聞鼓肺石不須防守有撾鼓立石者御史受狀為奏含元殿賦置兩石以恤刑長安故宫闕前有唐肺石尚在長八九尺形如垂肺肺主聲聲所以達其寃唐銅匭獻納使百官志武后垂拱二年六月魚保宗請置匭以受四方之書乃鑄銅匭四塗以方色列于朝堂青匭曰延恩在東告養人勸農之事者投之丹匭曰招諌在南論時政得失者投之白匭曰申寃在西陳抑屈者投之黑匭曰通玄在北告天文祕謀者投之以諌議大夫補闕拾遺一人充使知匭事御史中丞侍御史一人為理匭使其後同為一匭天寶九載三月十八日改理匭使為獻納使至德元年十月復舊寶應元年五月命中書門下擇正直清白官一人知匭以給事中中書舍人為理匭使會要云五月敕以給事中韓賞中書舍人楊綰同充理匭使其時二人奏大理評事盧翰充判官建中二年六月六日以中丞為理匭使諌議大夫一人為知匭使投匭者使先驗副本開成三年八月一日諌議知匭使李中敏以為非所以廣聰明慮幽枉乃奏罷驗副封會要五年四月敕仍留副本紀垂拱二年三月戊申作銅匭會要垂拱二年六月置匭四枚共為一室列于朝堂東方木主春配仁仁以亭育為本南方火主夏配信信者風化之本西方金主秋配義義以決斷為本北方水主冬配智智者謀慮之本楊州道士蔡裕製造舊紀代宗寶應元年七月庚寅詔不許匭使閲投匭人文狀會要開元十九年正月二十四日正字于休烈奉表投招諌匭杜甫進三賦表稽首投延恩匭列傳髙郢諌造寺書投招諌匭蘇安恆投匭上書李渤為諌議充理匭使建言事大者以聞次白宰相下以移有司有司不當許再納匭詔可孟簡元和中拜諌議大夫知匭事李庾西都賦堯鼓不懸晉木不列鎔金作匭四門是揭懿宗咸通四年正月詔曰內懸諌鼓外設匭函後唐明宗復置匭函以諌議大夫為使田錫章疏匣田錫事真宗為御史知雜遷諌議大夫真宗見之色必莊嚴仁宗謂翰林學士彭乘曰田錫好言事其章疏一漆匣先帝嘗自收之今尚在朕因觀之皆有益國家乘奏曰錫天資骨鯁不可捷進故不得大用然至今天下士人皆稱之錫立朝以來封疏五十二奏悉焚之言興國六年九月甲辰錫以左拾遺上疏軍國要機一朝廷大體四玉海卷九十
