body:
  text: 玉海卷一百十三宋王應麟撰學校視學天子一入學而所教者三釋奠以教其重道合樂以教其崇德養老以教其致孝周視學文王世子天子視學大昕鼓徴所以警衆也注周禮凡用樂大胥以鼓召學士衆至然後天子至乃命有司行事興秩節祭先師先聖焉注不親祭之者視學觀禮耳有司卒事反命始之養也養老之處適東序釋奠於先老注養老東序則是視學於上庠遂設三老五更羣老之席位焉適饌省醴養老之珍具遂發咏焉退修之以孝養也反登歌清廟既歌而語以成之也言父子君臣長幼之道合德音之致禮之大者也下管象舞大武大合衆以事達有神興有德也正君臣之位貴賤之等焉而上下之義行矣有司告以樂闋王乃命公侯伯子男及羣吏曰反養老幼于東序終之以仁也注孝經説所謂諸侯歸各帥於國大夫勤於朝州里􅚮於邑也疏天子視學謂仲春合舞季春合樂仲秋合聲於此時天子親往視學也天子視學在虞庠之中有司釋奠既畢入反于國明日乃之東序而養老若尋常視學則於東膠中惟行養老之禮凡大合樂必遂養老注大合樂謂春入學舍菜合舞秋頒學合聲於是時也天子則視學焉遂養老用其明日也疏云周禮大胥雖無視學之文月令季春大合樂天子親往則合舞合聲之時亦親視學也學記未卜禘不視學疏皇氏云禘大祭在於夏天子諸侯視學之時必在禘祭之後此視學謂考試學者經業或君親往或使有司為之非天子大禮視學也若大禮視學在仲春仲秋及季春文王世子注云云月令季春大合樂天子率三公九卿而視學焉與此别也天子春秋視學亦應在春秋時祭之後王制王親視學注習禮皆於大學月令仲春上丁命樂正習舞釋菜天子乃帥三公九卿諸侯大夫親往視之仲丁又命樂正入學習樂季春是月之末擇吉日大合樂天子乃率三公九卿諸侯大夫親往視之三禮義宗一年之內視學有四見養老類漢車駕幸太學光武紀建武五年十月初起太學車駕還宫幸太學賜博士弟子各有差朱浮傳親臨觀饗桓榮傳建武十九年拜為博士車駕幸太學會博士論難於前紀安帝延光三年三月壬戌幸太學靈帝光和五年十二月幸太學獻帝初平四年十月太學行禮車駕幸永福城門臨觀其儀賜博士以下有差漢臨辟雍見上學校類漢諸王會辟雍紀永平二年三月臨辟雍初行大射禮秋九月沛王輔楚王英濟南王康淮陽王延東海王政來朝冬十一月壬子幸辟雍初行飬老禮中山王焉傳永平二年冬諸王來會辟雍事畢歸蕃紀十月中山王焉始就國李尤辟雍賦三后八蕃師尹羣卿載甫垂畢其儀蹌蹌晉幸辟雍見上傅玄有帝幸辟雍鄉飲酒賦魏梁後周幸太學魏志甘露元年四月丙辰幸太學二年五月辛未幸辟雍命羣臣賦詩齊書永平四年三月國子學講孝經車駕幸學梁書天監二年三月己丑十二月癸未幸國子學親臨講肄策試胄子後魏書太和十六年四月甲寅幸皇宗學親問博士經義十七年九月壬申幸太學觀石經後周書保定三年四月戊午幸太學以太傅于謹為三老而問道焉隋書開皇十年十一月辛卯幸國學隋文遵問道之儀觀釋奠之禮宋元嘉幸國子學宋書元嘉二十三年九月己邜幸國子學策試諸生答問凡五十九人十月戊子賜帛唐幸國子學紀武德七年二月丁巳十七日貞觀十四年二月丁丑十日皆幸國子學親臨釋奠禮志皇帝視學設大次于學堂後皇太子次于大次東設御座堂上講榻北向皇太子座御座東南西向其日皇帝乘馬祭酒帥監官學生迎于道左皇帝入次執經侍講執如意者與文武學生皆就位堂下侍中奏外辦皇帝升北階即坐皇太子乃入就位在位皆再拜侍中敕皇太子王公升皆再拜乃坐執讀執經釋義執如意者授侍講秉詣論義坐問所疑退以如意授執者還坐皆降若賜會則侍中宣制皇帝返次羣官既會皇帝還監官學生辭於道左傳陸德明武德七年髙祖已釋奠召博士徐文逺等各講經德明隨方立義遍析其要帝大喜賜帛五十匹徐文逺髙祖幸國學觀釋奠文逺發春秋題論難風生詔諸王公子弟各就學孔穎達貞觀四年為祭酒詔講孝經穎逹作頌吕溫頌曰辟雍沈沈天子所臨或絃或歌講古述今其徒八十纓辨森森濊貊羌髳咸詠德音羽林孤兒亦垂青襟建隆幸國子監建隆二年十一月己巳九日幸大相國寺移幸國子監三年正月癸未二十五日幸二月丙辰二十三日幸四年四月丁亥六日幸國子監謁文宣王廟遂幸武成王廟七月丁卯又幸周顯德二年以天福普利禪院初建國子監國初又增置學舍太祖親撰先聖及亞聖贊十哲以下分命宰臣兩制撰太祖三幸國子監閲土木之功落成建隆元年二月太祖幸國子監詔加飾祠宇及塑繪先聖先賢先儒之像帝親製文宣王及兖公二贊藝祖即位之月首幸國學次月又幸祖宗故事云建隆元年正月初幸二月再幸范祖禹於帝學言之曰啓祐後嗣立太平之基范百祿上哲宗視學疏又言之曰祖宗隆儒師古躬化天下之意而續通鑑長編會要曰厯等書皆逸不載據實録本紀太祖以建隆二年十一月始幸國子監三年正月又幸趙師民勸講針在太祖神武披攘親駕辟雍真儒有光太平興國幸國子監端拱幸太學太平興國四年二月二十一日壬子幸國子監因幸玉津園習射端拱元年八月庚辰二十六日車駕幸國子監謁文宣王廟命博士李覺講周易泰卦賜綵段帛百匹移幸玉津園習射辛巳上謂丞相曰朕昨日聽説泰卦文理深奧足以為君臣鑒戒與卿等遵守之趙普等頓首謝政要上幸國子監謁文宣王畢召覺令對御講説覺曰陛下六飛在御何敢輒升髙坐帝為降輦令有司張㡩幕設列坐覺講泰卦從臣皆列坐因述天地感通君臣相應之旨帝説講泰卦者太宗李覺真宗馮元仁宗楊安國髙宗髙閌淳化幸國子監淳化五年十一月丙寅十七日上幸國子監賜直講孫奭五品服因幸武成王廟遍閲塑像至郭子儀曰名將無震主之威宜其祀享至李晟曰德宗播越非晟克復則唐運已去咨嗟久之復幸太學賜羣臣坐時侍講李至執經講堯典一篇未畢令奭講説命三篇帝曰尚書主言治世之道説命最備文王得太公髙宗得傅説皆賢相也至事不師古以克永世匪説攸聞上曰誠哉是言因歎曰何髙宗之時而有賢相如此飲從官酒三行賜奭帛三十匹咸平幸國子監景德幸國子監見觀書咸平二年七月甲辰幸國子監謁先聖因覽壁畫三禮圖移幸武成王廟復至國學命學官崔偓佺講大禹謨賜緋祭酒邢昺以下銀綵還幸崇文院閲羣書命從臣縱覽登祕閣觀太學聖製墨迹惻愴久之賜祕書監楊徽之等器帛職掌緍錢祕丞劉鍇獻幸太學頌九月壬午以為直史館天聖幸國子監閲三禮圖天聖二年八月己卯二十四日幸國子監謁文宣王召從臣升講堂令直講馬龜符説論語一篇賜三品服已而觀七十二賢讃述閲東序三禮圖因問侍講馮元三代制度元引經以對又幸武成王廟還幸繼照堂宴從臣賜龜符金紫慶厯幸國子監慶厯四年五月壬申十一日幸國子監謁文宣王有司言舊儀止肅揖而上再拜之賜直講孫復五品服又幸武成王廟又幸玉津園觀稻燕從臣射於園中上中的者九五年正月己巳詔擇地建學元祐幸大學榮觀集元祐六年十月十五日庚午朝獻景靈宫退幸國子監詣文宣王殿行釋奠禮一獻再拜幸大學御崇化堂召宰臣執政官親王賜坐監官侍立學生坐東西廡侍講吳安詩執經祭酒豐稷講無逸終篇國子監進書籍凡七十部軸上命留論語孟子各一部遂幸武成王廟肅揖酌獻賜稷三品服學官賜帛先是八月戊子朔學士范百祿請視學故有是舉書目有元祐幸大學儀一卷書目元祐六年十月庚午釋奠大學禮成學正汪浹記視學始末及以詩章賦頌奏記類為榮觀集五卷宣和中幸太學學諭莫若紀奉安宣聖訖于臨幸三十四條為崇聖恢儒集三卷崇寧幸太學辟雍崇寧三年十一月四日甲戌幸太學辟雍先是十月六日定儀注書手詔賜司業吳絪等學官遷秩賜章服兩學授官免舉賜帛宣和四年三月辛酉幸太學命祭酒韋壽隆講書無逸司業權邦彥講詩下武學官遷秩賜詔并御製宣聖贊幸精微造士二齋紹興幸太學紹興十四年二月戊子司業髙閌等上表請車駕幸大學七月詔宣王復古采芑著詠於新田世祖緯文建武肇興於大學云云將欵謁於先聖仍備舉於舊章三月十八日己巳車駕幸太學祇謁先聖御崇化堂命禮部侍郎秦熺執經髙閌講泰卦賜三品服遂幸飬正持志二齋上覽太祖真宗徽宗所製贊文命有司悉取從祀諸贊併録以進遂頒手詔賜諸生乙亥上製文宣王贊其後又製七十二子贊並刋石太學一本云出文宣三贊刻石賜學宫上曰唐明皇作贊斥先聖先師之名非尊儒重道之意閌曰尤見聖學髙出前代之上二十六年十二月二十一日臣僚請以御製贊石本賜諸郡學校從之淳熙幸太學詔講中庸九經淳熙四年二月五日乙亥幸太學幸崇化堂命禮部侍郎李燾執經祭酒林光朝講中庸九經一段光朝釋行之者一謂一乃中庸上曰深得聖人之旨先儒未及次幸武學詔曰詔詞周必大所草昔我藝祖開基之月首幸國學越二月又幸既宏先師之宇復審象而為贊本原治道厥有深旨太上中興開設學校乘輿臨幸儒術益光肆朕纘圖儲精稽古爰以仲春謁欵將聖躬釋菜之禮闡中庸之義洙泗遺風儼然在目朕甚嘉之夫孝於事親忠於事君學之本也業精于勤行成于思學之序也子大夫其念哉當為君子之儒毋慕人爵之得初降詔上諭執政曰朕得兩句云云執政奏大哉王言及幸學復諭曰多士濟濟可嘉四方聞之亦須興起亦幸武學文武並用弛張之術也復賜錢二萬緍修葺五月二十四日詔重塑文宣武成王并從祀十二位舊像權遷於首善閣下上謂塑像多俗王淮等奏以禁中善本宣布學官俾之重塑依政和新儀制度六月十三日以幸學詔書頒行諸路十九日光朝請刻訓辭于琬琰以風動四方從之嘉泰幸太學嘉泰三年正月二十八日幸太學祭酒李寅仲講尚書周官篇禮部侍郎林采執經詔有勉忠孝篤行義之訓淳祐視太學淳祐元年正月戊申十日臨視太學祭酒曹觱講大學吏部侍郎杜範執經御製聖賢十三贊宣示諸生釐正從祀隮五賢黜安石詔有明義理修文行涵養忠厚砥礪廉隅之訓咸淳三年正月二十日幸太學講中庸首章三句親屈車駕臨幸太學崇儒術也制定六經罷黜百家揭正道也奮辭摛藻昭回雲漢明聖作也祕殿之下錦几之上論經居前勸誦在後道問學也釋奠釋奠釋菜祭之略者也古之入學者釋菜禮其先師其學官四時之祭乃皆釋奠釋奠有樂無尸後世不遍舉於四時獨春秋行事而已記曰釋奠必有合樂國有故則否謂凡有國各自祭其先聖先師其國之無者必合鄰國而祭之自孔子沒後之學者莫不宗焉天下皆宗為先聖隋唐天下州縣皆立學而釋奠之禮遂以著令周入學舍采釋奠春官大胥春入學舍采合舞注始入學必釋菜禮先師也菜蘋繁之屬鄭氏謂入學釋菜蘋蘩之屬始立學釋菜芹藻之屬禮書曰釋菜之禮猶摰也婦人之摰棗栗腵修若廟見則釋菜弟子之摰束修若禮于先師則釋菜占夢乃舍萌于四方注舍萌猶釋菜也古書釋菜釋奠多作舍字萌菜始生也王制天子受命於祖受成於學出征執有罪反釋奠于學以訊馘告注釋菜奠幣禮先師也詩曰在頖獻馘疏大胥云舍菜文王世子亦云釋菜注云釋菜禮輕也唯釋蘋藻而已無牲牢幣帛文王世子又云始立學者既興器用幣注云用幣告先聖先師以器成則徒用幣而無菜亦無牲牢也又云凡始立學者必釋奠於先聖先師及行事必以幣是釋奠有牲牢幣帛無用菜之文今注云禮先師不云祭先師則未必有牲牢也周禮宗伯師還獻愷於祖司馬職云愷樂獻于社不云獻愷於學者文不具月令仲春上丁命樂正習舞釋菜注將舞必釋菜於先師以禮之夏小正曰丁亥萬用入學文王世子凡學春官釋奠于其先師秋冬亦如之注官謂禮樂詩書之官周禮曰凡有道德者使教焉死則以為樂祖祭於瞽宗此謂先師之類也若漢禮有髙堂生樂有制氏詩有毛公書有伏生億可以為之也不言夏夏從春可知也釋奠者設薦饌酌奠而已無迎尸以下事疏釋奠無尸者主于行禮非報功也凡始立學者必釋奠于先聖先師及行事必以幣注謂天子命之教始立學官者也先聖周公若孔子疏立學為重故及先聖常奠為輕故惟祭先師通典云周制凡釋奠者必有合也有國故則否注國無先聖先師則所釋奠者當與鄰國合也若唐虞有夔伯夷周有周公魯有孔子則各自奠之不合也曰劉敝曰合合樂也樂書合舞與聲始立學者既興器用幣然後釋菜不舞不授器注釋菜禮輕也釋奠則舞舞則授器司馬之屬司兵司戈司盾祭祀授舞者兵也釋菜于虞庠天子視學乃命有司行事興秩節祭先師先聖焉注使有司攝其事舉常禮不親祭之者視學觀禮耳適東序釋奠於先老注親奠之者已所有事也學記云皮辨祭菜鄭注禮先聖先師又云未卜禘不視學則祭菜與視學為一也凡釋奠有六始立學一也四時有四通前五也王制師還六也釋菜有三春入學釋菜合舞一也釁器釋菜二也學記皮辨祭菜三也秋頒學合聲無釋菜之文釋幣唯一即此釁器用幣是也三禮義宗四時入學不及先聖天子視學乃祭先聖祭義祀先賢於西學注周之小學疏祭先賢所通之經各於所習之學若瞽宗則在國虞庠為小學則在西郊學之釋奠有常時者春釋奠先師秋冬亦如之是也有非時者始立學天子視學出征執有罪反以訊馘告必釋奠焉是也釋奠或施於山川廟社大祝大會同造廟宜社過大山川則用事反則舍奠甸祝舍奠于祖廟禰亦如之是也或施於學大司樂祭樂祖於瞽宗文王世子釋奠先聖先師適東序釋奠於先老王制出征執有罪反釋奠以訊馘告是也或曰四代之學以舜禹湯文王為先聖當時左右四聖成其德業者為先師配饗釋奠之禮有牲幣有合樂有獻酬漢孔子廟見羣祀類郡國志魯國注鍾離意為魯相見仲尼廟頽毁會諸生廟中慨然曰蔽芾甘棠勿翦勿伐況聖人廟乎遂躬留治之意别傳曰出私錢萬三千付户曹孔欣修夫子車入廟拭几席劍履張伯除草堂下土中得玉璧七枚伯以六枚白意堂下有甕背有丹書意發之中有素書文曰修吾書董仲舒護吾車拭吾履發吾笥鍾離意璧有七張伯藏其一矍相之圃在城中西南近孔子廟而仲尼墓在魯城門北便之外泗水上去城一里葬地蓋一頃墓墳南北十步東西十三步髙一丈二尺墓前有瓴甓為祠壇方六丈與地平塋中異木以百數魯人莫能識也禮儀志永平二年三月郡縣學校祀聖師周公孔子北史劉芳傳周公廟别在洛陽緣創成洛邑漢初平五年九月益州太守高殷修周公禮殿記魏志崔林傳魯相上言漢舊立孔子廟褒成侯歲時奉祠辟雍行禮必祭先師王家出榖春秋祭祀魏文黃初二年正月以議郎孔羡為宗聖侯奉孔子祀令魯郡修起舊廟有碑晉武泰始三年十一月改封孔震奉聖亭侯又詔太學及魯國四時備三牲祀孔子梁天監四年六月庚戌初立孔子廟元魏太和十三年七月立孔子廟于京師十六年二月丁未改諡宣尼曰文聖尼父十九年四月庚申如魯城親祠孔子辛酉封崇聖侯奉孔子祀命兖州修孔子墓更建碑銘唐貞觀三年停以周公為先聖始立孔子廟堂於國學稽式舊典以仲尼為先聖顔子為先師俎豆干戚之容始備政要太極元年正月修宣父祠廟魯哀公十七年立孔子廟于故宅閲千餘載未嘗出闕里漢儒所謂立學釋奠未知先聖先師為誰自戴記之外無聞逮魏齊王晉武帝釋奠于學雖昉見簡册而未有原廟也唐武德二年廟周孔于胄監貞觀定孔子為先聖而黜周公牲牢器幣日增月益古者惟功臣與祭大蒸未聞弟子從祀于師也自建武祠七十二子于孔廟然亦不出闕里也貞觀末加以左卜諸儒從祀太學而武成王之祠亦倣而為之總章開元以來又加諸儒以三等之爵而州縣學官咸有從祀矣先師釋者曰若髙堂生制氏毛公伏生釋奠必有合釋者曰若魯之有周公孔子至如祀先賢於西學祭樂祖於瞽宗傳者亦謂各於所習之學祭先師夫周公孔子非周魯之所得專也經各立師周典豈有是哉所謂各祭其先師疑秦漢以來始有之漢祠七十二弟子孔子弟子籍章紀元和二年二月東巡狩三月進幸魯祠孔子及七十二弟子孔僖傳元和二年春帝還過魯幸闕里以太牢祠孔子及七十二人作六代樂大會孔氏男子二十以上者六十三人命儒者講論帝曰今日之會卿宗有光榮乎對曰陛下親屈萬乘辱臨敝里此乃崇禮先師增輝聖德至於光榮非所敢承史記列傳孔子曰受業身通者七十七人皆異能之士也顔回閔損冉耕冉雍冉求仲由宰豫端木賜言偃卜商顓孫師曽參淡臺滅明宓不齊原憲公冶長南宫括公晢哀曽蒧顔無繇商瞿髙柴漆雕開公伯竂司馬耕樊須有若公西赤巫馬施梁鱣顔幸字子栁栁唐志曰冉孺曹恤伯虔公孫龍字子石自子石已右三十五人頗有年名及受業聞見于書傳其四十有二人無年及不見書傳者紀于左冉季産公祖句兹字子之秦祖字子南漆雕哆顔髙字子驕漆雕徒父壤駟赤商澤石作蜀任不齊公良孺后處秦冉公夏首奚容蒧公肩一作堅定顔祖字襄鄡單句井疆罕父黑秦商申黨顔之僕榮旗縣成左人郢燕伋鄭國字子徒秦非字子之施之常顔噲步叔乘原亢籍樂咳亷潔顔何叔仲會狄黑邽巽孔忠公西輿公西蒧顔髙公良孺秦商叔仲會家語有事迹史記不載公伯竂秦冉鄡單三人家語不載别有琴牢陳亢縣豐大史公曰學者多稱七十子之徒譽過實毁失真鈞之未覩厥容貌則論言弟子籍出孔氏古文近是余以弟子名姓文字悉取論語弟子問并次為篇疑者缺焉唐禮樂志開元二十七年八月二十四日二京國子監天下州縣夫子始皆南向以顔淵配贈諸弟子爵公侯子淵兖公子騫費侯伯牛鄆仲弓薛子有徐子路衛子我齊子貢黎子遊吳子夏魏又贈曽參以降六十七人參成伯顓孫師陳淡臺滅明江宓子賤單原憲原公冶長莒南宫適郯公晢哀郳曽點宿顔路杞商瞿蒙髙柴共漆雕開滕公伯竂任司馬牛向樊遲樊伯有若卞公西赤邵巫馬期鄫梁鱣梁顔栁蕭冉孺郜曹恤曹一作豐伯虔鄒公孫龍黃冉季産東平秦子南少梁漆雕斂武城顔子驕琅邪漆雕徒父須句壤駟赤北徵商澤睢陽石作蜀郈邑任不齊任城公夏首亢父公良孺東牟后處營丘秦開彭衙奚容蒧下邳公肩定新田顔襄臨沂鄡一作郭單銅鞮句井疆淇陽罕父黑乘丘秦商上洛申黨召陵公祖子之期思榮子旗一作期雩婁縣成巨野左人郢臨淄燕伋漁陽鄭子徒滎陽秦非汧陽施常乘氏顔噲朱虛步叔乘淳于顔之僕東武原亢籍萊蕪樂咳昌平亷潔莒父顔何開陽叔仲會瑕丘狄黑臨濟邽巽平陸孔忠汶陽公西輿重丘公西蒧祝阿於是二京之祭牲太牢樂宫縣舞六佾矣髙宗所製七十二子贊去史記公良孺公夏首公肩定顔祖鄡單句井疆罕父黑申黨原亢顔何公西輿如十一人增申棖蘧伯玉陳亢林放琴牢申堂續六人遂為七十二人六人文翁學堂圖所記後人以所見增益孔開元八年畫七十子于廟壁顔回至公西蒧封子弟子詔天寶二載十二月吕岩説撰記漢志孔子徒人圖法二卷隋志孔子弟子目録一卷鄭玄撰唐志蜀文翁學堂圖一卷魏釋奠辟雍志齊王正始二年初通論語使太常以太牢祭孔子於辟雍以顔淵配五年五月癸巳講尚書通七年十二月通禮記並同奠宋志云以太牢釋辟雍弗躬親晉釋奠大學頌皇太子釋奠志禮始入學必先釋奠于先聖先師及行事必用幣漢世雖立學斯禮無聞武帝泰始七年皇太子講孝經通咸寧三年講詩通太康三年講禮記通惠帝元康三年皇太子講論語通元帝大興二年宋書志三年皇太子講論語通紀太興三年八月辛未皇太子釋奠于太學太子並親釋奠以太牢祠孔子以顔回配成帝咸康元年講詩通二月甲子親釋奠穆帝升平元年三月帝講孝經通壬申親釋奠於中堂孝武寧康三年十二月癸巳帝講孝經通並釋奠如故事穆帝升平元年孝武時並權以中堂為太學二學生百二十人事訖罷禮畢會百官六品以上裴頠傳皇太子既講釋奠祀孔子飲饗射侯甚有儀序潘尼傳為太子舍人上釋奠頌序曰元康元年十二月上以太子富於春秋而人道之始莫先於孝悌初命講孝經于崇政殿實應天縱生知之量微言奧旨發自聖問業終而體達至三年春閏月將有事于上庠釋奠于先師禮也越二十四日丙申侍祠者既齊典駕次于太學太傅在前少傅在後恂恂乎弘保訓之道宫臣畢從三率備衛濟濟乎盡翼贊之敬乃掃壇為殿張幕為宫夫子位于西序顔回侍于北墉宗伯掌禮司儀辨位二學儒官縉紳先生之徒垂纓佩玉陪於堂下設尊篚于兩楹之間陳罍洗於阼階之左几筵既布鍾縣既設我后乃躬拜俯之勤資在三之義謙光之美彌劭闕里之教克崇牲饋之事既終享獻之禮已畢釋玄衣御春服弛齊禁反故式天子乃命內外羣司百辟卿士蕃王三事咸來觀禮我后既延而與之燕金石簫管之聲八佾六代之舞可以移風易俗者罔不畢奏是日也人無智愚路無逺近不期而俱萃希道慕義洗心革志想洙泗之風不言之化洋溢乎九有之內固皇代之壯觀萬載之一會也頌曰篤生上嗣繼期挺秀聖敬日躋濬哲閎茂留精儒術尊悅古訓遵道遜齒降心下問鋪以金聲光以玉潤乃延台保乃命學官聖容穆穆侍講誾誾抽演微言啓發道真探幽窮賾溫故知新崇聖重師卜日告奠既戒乃式乃盥乃薦恂恂孔聖百王攸希亹亹顔生好學無違曰皇儲后體神合幾蟬冕耀庭紳佩振階德以謙光仁以恩懷我酒惟清我肴惟馨舞以六代歌以九成莘莘胄子祁祁學生洗心自白觀國之榮學猶蒔苗化若偃草博我以文弘我以道又詩曰尊師重道釋奠崇祀德成教倫孰云不祉傅咸頌以能而問處實若虛爰雕聖章王采是敷乃備嘉薦于國之雍敬享先師以疇聖功亹亹皇儲希心闕里濟濟儒生莘莘胄子清酒于觴匪宴斯喜欣道之弘自今以始摯虞頌曰講業既終禮師釋奠升觴折爼上下惟燕通典晉武太始七年惠元康三年二釋奠皆於太學太始六年元康五年二行鄉事鄉飲酒禮皆於辟雍太子講經竟並親釋奠於太學東晉明帝之為太子亦行釋奠禮成穆孝武三帝皆親釋奠唯成帝在辟雍孝武依穆帝升平元年於中堂權立行太學宋元嘉二十二年志云四月太子釋奠採晉故事裴松之議應舞六佾宜設軒縣之樂牲牢器用悉依上公祭畢親臨學宴會志云皇太子講孝經通釋奠國子學如晉故事晉溫嶠頌敷論義奧綜析毫芒管簫備舉和樂載揚宋顔延之詩宋略元嘉二十年三月皇太子釋奠國學虞庠飾館睿圖炳晬伊昔周儲聿光往記思皇世哲體元作嗣尚席函丈丞疑奉􅐆侍言稱辭敦史秉筆禮屬觀盥樂薦歌笙昭事是肅爼實非馨獻終襲吉即宫廣宴倫周伍漢超哉邈猗何承天頌經修講洽研幾識理貴道崇業降尊尚齒願言西雍延想沂洙王僧逹詩時泰道暢禮備樂修啓庠選俊博教深求異人鱗萃淑美雲浮師尊訓浹嘉敬載柔袁曜詩南庠貴齒東學尚親卑躬下問降禮師臣圓冠濟濟方領恂恂肄業既終舍奠爰始韶管遞奏笙鏞間起茨夏愔愔晬容亹亹輿服志元帝大興三年皇太子釋奠制曰未有髙車可乘安車齊皇太子釋奠梁陳南齊禮志永明三年正月詔立學創立堂宇置生二百人其年秋中悉集有司奏宋元嘉舊事學生到先釋奠先聖先師禮又有釋菜未詳今當行何禮用何樂及禮器尚書令王儉議周禮春入學舍菜合舞記云始教皮辨祭菜示敬道也又云始入學必祭先聖先師中朝以來釋菜禮廢今之所行釋奠而已金石爼豆皆無明文陸納車胤謂宣尼廟宜依亭侯之爵范寧欲依周公之廟用王者儀范宣謂當其為師則不臣之釋奠日備帝王禮樂車陸失於過輕二范傷於大重引同上公即事惟允元嘉立學裴松之議應儛六佾以郊樂未具權奏登歌今金石已備宜設軒縣之樂六佾之舞牲牢器用悉依上公其冬十月皇太子講孝經親臨釋奠車駕幸聼永明五年冬太子臨國學䇿試諸生竟陵王子良詩四璉合旨八簋舒芬王儉詩金鎔乃器水術伊瀾禮邁仁周樂超英漢神保爰格祝史斯贊降冕上庠升宴東序時彥莘莘國胄楚楚沈約詩復禮曲臺反樂宣榭事高東序義邁雲臺峩峩德傅灼灼英台回鑾獻爵摐金委奠洋洋聖範楚楚儒衣唐志齊釋奠會詩集二十卷通典梁天監八年九月皇太子釋奠周捨議請依東宫元會太子著絳紗襮樂用軒縣合升殿坐者皆服朱衣徐勉議釋奠及宴會太子升堂並宜由東階大同七年皇太子表其子寧國臨城公入學臣纘等以為參點回路並事宣父洙汶無譏制可大同七年皇太子釋奠國學時樂府無孔顔登歌詞令杜之禕製文任昉詩告奠明祀觀道聖門日月不息師表常尊武帝親釋奠梁元帝皇太子講學碑業冠孟侯道髙上嗣轉金輅而下辟雍晬玉容而經槐市將使東極長男之官不獨銘於銀榜南皮太子之序豈徒擅於金碑陳書太建三年八月辛丑皇太子釋奠徐伯陽頌穆穆皇儲峩峩副主道尊匕鬯德崇監撫春誦夏弦冬書秋羽漢召趨幄周朝問豎翔集禮闈逍遙義府儲駕戾止和鸞有聲弘風講肄崇儒肅成丹書貴道黃金賤籯洙泗興業闕里增榮江總皇太子太學講碑北史魏明帝行講學之禮於國子寺司徒崔光執經常褧等録義又行釋奠禮一本云正光三年釋奠國學命祭酒崔光講孝經詔百官作釋奠詩以褧作為美李諧詩帝曰師氏陳牲委奠神具醉止薄言嘉宴通典北齊太子每通一經及新立學必釋奠每歲春秋二仲常行其禮文苑英華大學觀春宫齒胄賦宗伯蕆事司成奉職儲駕戾止虞庠肅清傾章甫之列駐和鸞之聲遜其齒也長幼之節著明其親也父子之道成示其尊也君臣之義行三善皆得萬邦以正揖遜於詩書之府雍容於禮義之門敬其學而德至親其師而道尊隋釋奠通典北齊每月朔制祭酒領博士以下及國子諸學生以上大學四門博士升堂助教以下太學諸生階下拜孔揖顔日出行事隋制國子寺每嵗四仲月上丁釋奠一行鄉飲酒禮釋州縣學以春秋仲月奠唐初以儒官自為祭主許敬宗奏魏氏則太常行事晉宋以降時有親行請令祭酒為初獻祝稱皇帝謹遣司業亞博士終獻元善傳開皇初遷祭酒上親臨釋奠命講孝經唐孔子廟祠孔子釋奠國學七十子圖二十一賢圖禮志武德二年始詔國子學立周公孔子廟紀武德二年六月戊戌立周公孔子廟于國子監會要六月一日七年二月丁巳高祖釋奠以周公為先聖孔子配九年一云貞觀十年封孔子之後德倫為褒聖侯貞觀二年十二月因左僕射房玄齡博士朱子奢言周公尼父俱聖人然釋奠於學以夫子也大業以前孔丘為先聖顔回為先師乃罷周公升孔子為先聖顔回配四年詔州縣學皆作孔子廟十一年會要七月二十四日丙午詔尊孔子為宣父作廟於兖州給户二十以奉之十四年二月丁丑太宗觀釋奠于國子學詔祭酒孔頴逹講孝經二十一年二月十五日壬申詔左丘明卜子夏公羊髙榖梁赤伏勝髙堂生戴聖毛萇孔安國劉向鄭衆賈逵杜子春馬融盧植鄭康成服虔何休王肅王弼杜預范寧二十二人皆配享永徽中復以周公為先聖孔子為先師顯慶二年七月十一日太尉長孫無忌等言云云乃以周公配武王而孔子為先聖紀乾封元年正月辛卯幸曲阜祠孔子贈太師授會要乾封元年正月十三日追贈孔子為太師天元年十月二十九日封隆道公總章元年三月一日顔回贈太子少師曽參太子少保太極元年二月十六日加贈顔回太子太師曽參太子太保開元八年三月十八日司業李元瓘奏先聖廟為十哲像以先師顔子配則配象當坐今乃立餘弟子列像廟堂不與享而范寧等皆從祀請釋奠十哲享於上而圖七十子於壁曽參以孝受經於夫子請享之如二十二賢乃詔十哲為坐像悉預祀曽參特為之像坐亞之圖七十弟子及二十二賢於廟壁會要上以顔子亞聖親為製贊書于石令文士分為贊題其壁月開元二十六年詔鄉貢見訖謁先師二十八年二五日敕春秋釋奠以三公行禮二十七年八月二十四日甲申諡夫子為文宣王夫子始南面以顔淵配贈諸弟子爵公侯伯子淵兖公騫等九人皆侯又贈曽參以降六十七人爵皆伯天寶二年十月璲芝封文宣公於是二京之祭牲太牢樂宫縣舞八佾矣二十八年詔釋奠令攝三公行禮版代宗時歸崇敬議春秋釋奠孔子祝皇帝書北面揖以為大重宜準武王受丹書於師尚父行東西之禮事皆施行永泰二年二月丁亥朔釋奠于國學八月丁亥復用牲牢是大中五年十一月國子祭酒馮審奏孔子廟堂碑太宗建立睿宗書額備稱唐德具贊鴻猷文翰顯然金石斯在武后時於篆額中間謬刻大周兩字恐貽誤將來請琢去兩字敕所請刋石訛文頗協事體宜依儒學傳貞觀二十一年詔左丘明卜子夏公羊髙榖梁赤伏勝髙堂生戴聖毛萇孔安國劉向鄭衆杜子春馬融盧植鄭玄服虔何休王肅王弼杜預范寧二十一人用其書行其道宜有以褒大之自今並配享孔子廟廷於是唐三百年之盛稱貞觀寧不其然通鑑先是祀先聖先師周公南向孔子東向坐開元二十七年八月甲申制自今孔子南向坐詳見圖類倪若水傳開元初為汴州刺史增修孔子廟興州縣學廬勸生徒漢永平二年三月始詔郡縣道行鄉飲于學校祀孔子則先聖之祠有出闕里者然未作廟至唐武德二年胄監始立孔廟貞觀四年州縣始皆立孔廟唐釋奠齒胄貞觀皇太子釋奠釋奠頌紀髙祖武德二年六月戊戌始詔國子學立周公孔子廟七年二月丁巳釋奠于國學太宗貞觀十四年二月丁丑觀釋奠于國子學賜學官髙第生帛二十一年二月丁丑命皇太子釋奠于太學志皇太子釋奠自為初獻祭酒張後胤亞獻攝司業趙弘智終獻畢賜諸學官胄子帛右庶子許敬宗上四言詩美之髙宗總章元年二月丁巳皇太子弘釋奠于國學弘請賜顔回太子少師曽參太子少保制可開曜元年二月丙午皇太子釋奠于國學會要永隆二年二月皇太子親行釋奠禮睿宗景雲二年八月丁巳皇太子釋奠于國學先天元年二月丁巳皇太子釋奠于國學會要太極元年二月二十八日太子親釋奠開講筵褚無量執經玄宗開元七年十一月乙亥皇太子入學齒胄賜陪位官及學生帛開元七年皇太子齒胄于學謁先聖詔宋璟亞獻蘇頲終獻及臨享天子思齒胄之義乃詔二獻皆用胄子祀先聖如釋奠右散騎常侍褚無量講孝經文王世子篇羣臣學官諸生以差賜帛太子瑛傳云七年詔太子諸王入國學行齒胄禮傳徐文逺為國子博士髙祖幸國學觀釋奠文逺發春秋題論難鋒生隨方占對莫能屈帝異之孔穎達太宗幸太學觀釋奠命穎達講孝經畢上釋奠頌有詔褒美楊炯永隆二年皇太子已釋奠表豪俊充崇文館學士薛元超薦炯及鄭祖元鄧元挺崔融褚無量玄宗為太子無量侍讀太子釋奠國學太極元年太子親釋奠令講經問孝經禮記題建端立義博敏而辨進銀青光祿大夫賜豫蕃渥賜物百段并紫袍金帶開元七年太子齒胄于學詔無量升座講勸百官觀禮厚賞賜儒學傳貞觀六年詔罷周公祠更以孔子為先聖顔子為先師盡召天下敦師老德以為學官數臨幸觀釋菜命祭酒博士講論經義賜以束帛生能通一經者得為吏先是髙祖始受命鉏纇夷荒天下略定即詔有司立周公孔子廟于國學四時祠求其後議加爵土至是罷周公祠新羅傳貞觀二十二年一本云十三年新羅王真德遣子文王及弟伊贊子春秋來朝因請改章服從中國制又詣國學觀釋奠講論會要貞元二年二月丁卯釋奠一本云有司釋奠文宣王廟宰臣以下畢集學官講五經大義及先聖之道唐武成王廟古今名將圖禮志貞觀以太公兵家者流詔磻溪立太公廟開元十九年四月丙申十八日一本壬辰通鑑三月丙申兩京及天下始置太公尚父廟一所以留侯張良配中春中秋上戊祭之牲樂之制如文宣出師命將發日引辭于廟以諸州賓貢武舉人準進士行鄉飲酒禮仍以古名將十人為十哲以配享天寶六載正月詔諸州武舉人上省先謁太公廟乾元元年九月二十二日太常少卿于休烈奏秋享漢祖廟旁無侍臣而太公乃以張良配子房生漢初佐高祖定天下時不與太公接古配食廟廷皆其佐命太公人臣也誼無配享請以張良配高祖廟上元元年閏四月十九日己卯尊太公為武成王祭典與文宣王比以歷代良將為十哲像坐侍白起韓信諸葛亮李靖李績列於左張良田穰苴孫武吳起樂毅列於右以良配後罷中祀遂不祭建中三年閏正月二十五日禮儀使顔真卿治武成王廟請如月令春秋釋奠其追封王宜用諸侯之數樂用軒縣一本云三年閏正月戊戍令百僚謁武成王廟以志又云中春中秋釋奠于文宣王武成王皆上丁戊國學以祭酒司業博士三獻樂軒縣詔吏館考定可配享者七月十一日奏奉五月十五日敕列古今名將凡六十四人圖形焉范蠡孫臏亷頗王剪曹參周勃李廣霍去病鄧禹賈復冦恂馬援皇甫嵩張遼關侯周瑜陸遜羊祜王濬謝玄慕容恪檀道濟王僧辨慕容紹宗宇文憲韓擒虎史萬嵗尉遲敬德蘇定方張仁亶王晙王孝傑列於左管仲田單趙奢李牧彭越周亞夫衛青趙充國吳漢馮異耿弇假熲鄧艾張飛呂蒙陸抗杜預陶侃王猛長孫嵩王鎮惡吳明徹斛律光于謹韋孝寬楊素賀若弼河間王孝恭裴行儉郭元振張齊丘郭子儀列於右貞元二年二月刑部尚書關播奏太公古稱大賢下乃置亞聖義有未安而仲尼十哲皆當時弟子今以異時名將列之弟子非類也請但用古今名將配享去亞聖十哲之名自是惟享武成王及留侯而諸將不復祭矣四年八月十三日兵部侍郎李紓言開元中太公廟以張良配以太常卿三獻祝文曰皇帝遣某敢昭告至上元元年閏四月贈太公以王爵祭典同文宣有司遂以太尉獻祝版親署夫至尊禮於臣佐神何敢歆且文宣王百世所宗太公述作止六韜勳業著一代請祝辭不進署改昭告為敬祭留侯為致祭獻官太常卿以下百官議之大理卿于頎等四十六人多請如紓言右司郎中嚴涗等議曰貞觀中以大公兵家者流始令磻溪立廟開元漸著上戊釋奠禮其進寵不薄矣上元之際執事者茍意於兵遂封王爵號擬文宣彼於聖人非倫也謂宜去武成王號復為太公廟奠享之制如紓請刑部員外郎陸淳等六人議曰武成殷臣也紂暴不諌而佐周傾之與文宣偶非不刋之典也宜罷上元建封立廟復磻溪祠有司以時享斯得矣左領軍大將軍令狐建等二十四人議曰兵革未靖宜右武以起忠烈今特貶損非勸也且追王爵以時祠為武教主文武並宗典禮已久改之非也乃詔以將軍為獻官餘用紓奏九月十六日自是以上將軍太將軍將軍為三獻會要同藝文志盧鋌武成廟十哲讚一卷關播傳初上元中詔擇古名將十人配享武成廟如十哲侑孔子播奏太公古賢臣今其下稱亞聖孔子十哲皆當時弟子今所配年世不同請罷之詔可朱梁改為武明王廢從祀後唐復之宋朝大祖議武成廟配享所升人二十三人退出二十二人其間如陶侃李光弼且不得預建隆孔子廟修廟謁廟奠享奠孔林追諡襲封植圭文宣王廟建隆三年六月詔修飾祠宇及塑繪先聖先賢先儒之像立戟十六親撰文宣王兖公二贊從祀賢哲命當時文人為之乾德四年七月以文宣王後進士宜為兖州曲阜縣主簿太平興國三年十月詔孔宜襲封文宣公復其家漢魏曰褒成晉宋奉聖後魏崇聖北齊恭聖隋曰紹聖唐曰褒聖八年詔修曲阜廟至道三年九月戊寅真宗以其後延世為曲阜令襲封令賫所賜祭器九經書太宗御書賜銀幣遣之廟有書樓而無典籍於是賜經書大中祥符元年十月二十七日甲寅詔曰朕以紀號岱宗觀風廣魯載懷先聖實主斯文將申欵謁之儀用表欽崇之志宜取十一月朔幸曲阜縣備禮躬謁仍付所司詳定所言車駕謁文宣廟內外設黃麾仗襲文宣公伯叔兄弟並許陪位從之十一月一日戊午幸曲阜縣謁文宣王廟廟內外設黃麾仗帝服鞾袍行酌獻之禮又幸叔梁紇堂命刑部尚書溫仲舒分奠七十二弟子先儒暨叔梁紇顔氏初有司定儀肅揖而已帝特展拜以表嚴師尊儒之意公封叔梁紇齊國又親製贊示從臣刻石廟中留親奠祭器于廟從官立石刻名禮畢於殿西序召見孔氏子孫撫諭問宣尼墳隴所在令子孫前至孔林以林木擁道降輿乘馬至墓設奠再拜問東及南二冡子孫對曰東伯魚南子思退坐北序與從臣閲碑板詔追諡曰元聖文宣王春秋演孔圖孔子母夢感黑帝而生故曰元聖祝文進書名令擇日册命修飾祠廟祭器以簿正祭器若廟制未合典禮者改正之給十户奉塋廟丁卯賜王廟九經書疏釋文三史及太宗御製御書百五十卷又以經史賜兖州是嵗十一月戊午朔封周公文憲王建廟曲阜親製贊長吏春秋祭之二年二月壬辰詔就廟立學舍三月二十五日庚辰詔文宣廟木圭易以玉賜植圭一五年十二月八日壬申改諡至聖景祐元年以宗願襲文宣公知縣事至和二年三月丙子封衍聖公嘉祐六年三月乙酉上書兖州文宣王廟榜元豐元年十月八日詔以係省錢修兖州祠元祐四年四月二十六日文宣廟置教授一員宣和四年正月二十九日御製文宣王贊崇寧元年二月二十五日封孔鯉泗水侯汲沂水侯三年九月十七日詔辟雍文宣王殿名大成四年八月三日增文宣王冕十有二旒是年詔文宣王廟立戟二十四改用鎮圭政和元年四月四日詔十哲贊有犯先聖名改撰宣和四年三月幸太學孔端朝以先聖後賜上舍出身紹興十三年三月乙未詔廟門立戟二十四真宗東封躬謁孔子祠問宰相孔氏孰為知名者或言孔勉有治行即召對獻詩百韻頌上德以為知曲阜縣孔道輔知仙源縣主祠事言廟制庳陋請加修崇詔可梁元帝為荆州起州學宣尼廟自圖宣尼像為贊而書之後周廣順二年六月己酉幸曲阜謁孔子祠幸孔林以孔仁玉為曲阜令孔子墓側有石壇是唐朝封禪回謁孔子之壇建隆武成王廟建隆三年九月十六日壬申詔於東京舊城南建武成王廟與國學相對命左諌議大夫崔頌一作判國子監崔頌中使盧德嶽董其役仍命頌檢閲唐末以來謀臣名將勳績尤著者具名以聞考試舉人權就武成王廟四年四月六日丁亥帝幸廟閲土木之功也歷觀兩廊下圖畫名將指白起曰此人殺已降不武之甚何受享於此以杖畫去之六月癸巳十三日知制誥髙錫言配享七十二賢王僧辨不克令終慮非全德望加裁定詔吏部尚書張昭工部尚書竇儀與錫詳定以聞昭等奏新入歷代功臣二十三人如灌嬰耿純王霸祭遵班超西晉王渾東晉周訪宋沈慶之後魏李崇傅永北齊段韶後周李弼唐秦叔寶張公謹唐休璟渾瑊裴度李光顔李訴鄭畋梁葛從周後唐周德威苻存審舊配享功臣退二十二人魏吳起齊孫臏趙亷頗漢韓彭周亞夫段紀明魏鄧艾蜀關侯張飛晉杜元凱陶侃北齊慕容紹宗梁王僧辨陳吳明徹隋楊素賀若弼史萬嵗唐李光弼王孝傑張齊丘郭元振詔曰其武成王廟從祀神像齊相管仲宜塑像升于堂魏西河太守吳起宜畫像降于廡餘依昭等議外並從舊制開寶二年九月一日乙巳朔幸武成王廟淳化五年十一月十七日幸武成王廟指郭子儀謂左右曰纍朝握兵立大功無震主威宜其配享矣又指李晟曰德宗播越蓋為姦邪所誤不能斥去之非李晟克復唐運已去矣咨嗟久之景德四年二月八日詔西京擇地建廟如東京之制祥符元年十一月戊午朔加諡太公曰昭烈武成王令青州立廟春秋致祭天聖二年八月二十四日慶厯四年五月十一日並幸武成王廟熙寧元年一云三年六月十九日詔整葺摧毁遣內臣董之六年十月二十五日修廟詔禮官議先朝功臣勳業可配祀者以聞後不果行元祐七年十月十五日幸廟政和三年十月二十日禮部請以南仲召虎方叔吉甫尉繚配食宣和五年正月封管仲至周瑜為侯伯紹興二十九年二月二十四日臣僚證都民望言李績不可升堂上李晟不宜置廊廡詔禮部議四月十七日辛丑詔李晟居堂上郭子儀之次李績在河間孝恭之下尉遲敬德之上乾道六年八月二十六日太學正薛元鼎請以周之南仲侑食武成王上喜以為南仲之孫皇父猶為中興之將便宜舉行淳熙四年傅伯壽言唐開元間銓次太雜錢良臣又請以建隆建炎名將參陪廟祀詔禮官給舍監官討論後省集議七月十二日升李績於堂上降李晟於績位次仍以曹彬從祀建隆謁先師禮建隆二年十二月二十日禮闈移牒奉常請令貢士謁拜禮院按禮閣新儀無之開元二十六年詔諸州貢舉人見訖就胄監謁先師官為開講質問疑義昭文崇文兩館生亦如之後諸郡貢舉人十一月一日正衙見訖擇日謁先師為常禮熙寧五年十二月六日國子監言舊制貢舉歲於十二月下旬集諸州所貢第一人謁奠先聖如春秋釋奠儀時多未至者請罷從之大觀元年十一月六日強淵明請貢士始入辟雍並以元日釋菜政和六年閏正月二日詔髙麗受學者元日隨貢士釋菜祥符封孔子弟子二十一賢贊明道七十二賢圖政和孟子廟配享從祀祥符二年五月乙卯朔詔追封孔子弟子七十二人顔回兖國公至卜商河東公曽參瑕丘侯至琴張頓丘侯詔曰四科巨賢並超五等七十逹者俱贈列侯令中書門下及兩制館閣分撰贊命王旦撰顔子贊初帝覽崇文院檢定七十二弟子案史記唐會要凡七十七人今曲阜廟唯七十二人帝曰何故不同王旦言國學七十二弟子經太祖定議曲阜準國學畫象七月戊寅詔封左丘明至范寧二十一人皆為伯贈王肅司空杜預司徒命羣臣為贊天禧五年六月十五日國子監請以聖製文宣王贊及詔命洎近臣所撰十哲七十二賢贊鏤版流布從之明道元年八月戊午詔國子監重修七十二賢堂左丘明而下二十一人並以本品衣冠圖之元豐七年五月壬戌二十二日封孟子鄒國公與顔子並配而荀楊韓子並封伯爵列于從祀八年二月九日命學士院撰鄒公及荀楊韓子贊崇寧元年二月詔追封孔鯉孔伋為侯大觀二年二月二十七日詔繪子思像從祀四年九月十二日封公夏首至亷潔十人為侯先是四月二十八日議禮局言公夏首等史記有其名唐開元禮亦載祀典請皆贈侯爵與祭享從之元豐以孟子為鄒國公配食先聖而鄒公廟在兖州鄒縣政和五年春乃詔樂正子克配享公孫丑至子叔十七人從祀加封爵焉靖康初降王安石于從祀紹興七年春胡安國上疏請追爵二程張邵列于從祀不報淳熙三年冬趙粹中請削去安石從祀四年七月癸酉但除王雱畫象而已淳祐元年正月十五日始去安石而列周張二程朱子于從祀端平二年正月二十日禮部尚書李􅌫請以子思升祀堂上列在十哲之間紹興十年七月甲子復釋奠文宣王為大祀用王普請也祀前受誓戒加籩豆十二其禮如社稷十三年三月八日司業高閌言文宣王兖鄒公十哲像徽宗討論五等章服請如大觀改賜之數二十三年九月十一日王綸請重繪自國學始以其式鏤版頒諸郡二十六年十二月二十一日戊午有司言陛下御製贊灑宸翰刻琬琰望以賜諸郡學校從之乾道五年八月重飾宣聖十哲及兩廡神像六年正月武成廟亦裝繪祥符釋奠祭器圖詳見圖類祥符二年正月八日甲子詔禮院定釋奠禮器頒州縣三年二十四日甲戌判院孫奭言釋奠舊禮以祭酒司業博士三獻新禮以三公近嵗止命獻官二員兼攝請備差大尉大常光祿卿三獻詔可六月九日丙辰頒諸州釋奠儀祭器圖景祐元年十一月辛亥詔文宣武成廟並用登歌之樂學士院撰樂章元祐行釋奠禮見視學類乾道皇太子釋奠儀祥符九年十一月職方外郎李邈表請壽春郡王行釋奠之禮上曰年幼未可遽行乾道八年正月丙戌十七日宰輔請討論上丁釋奠皇太子入學之儀上曰文王世子篇載此甚詳梁克家奏入學以齒則知父子君臣長幼之道虞允文奏事備於禮經上曰可令有司討論以聞乾道釋奠通祀圖一卷乾道中張維取元符政和新舊儀各為之圖嘉定六年全州教授黃學行進厯代尊師本末二卷載尊崇孔氏祭祀儀注配享從祀沿革升降之因淳熙釋奠制度圖紹興十年七月詔釋奠文宣王在京為大祀州縣為中祀淳熙六年四月十八日知常德府李燾乞頒下釋奠儀注及繪畫尊爵簠簋制度圖本頒下從之七年二月十七日禮官言參照祥符間頒下州縣祭器止有散尊與新儀不同乞除去兼政和之後配位從祀神位升降及封爵不同慮州縣塑繪不一乞依國子監大成殿并兩廡從祀位數爵號姓名并尊器制度頒降從之紹熙元年十月知漳州朱熹條上釋奠禮儀數事太常條奏後不果行先是守南康日嘗乞取政和新儀川縣釋奠風雨雷師祭等鏤板頒下而其書自多抵牾復以告則莫之省者至是復列上且移書禮官書目有元豐頒行諸州釋奠儀注一卷玉海卷一百十三
