body:
  text: 玉海卷一百六十三宋王應麟撰宫室閣黃帝阿閣鳳巢阿閣見中候通厯韓詩外傳黃帝時鳳皇止阿閣隋律志毛爽云黃帝聽鳳阿閣之下始造十二律黃帝扈閣春秋正義説公羊者云云春秋緯云黃帝坐於扈閣鳳皇銜書致帝前其中得五始之文河圖録運法云黃帝坐元扈樓上與大司馬容光臨觀鳳皇之至堯阿閣荀子注見鳳皇類漢石渠閣詳見經解類宣紀甘露三年三月詔諸儒講五經同異太子太傅蕭望之等平奏其議上親稱制臨決焉乃立梁丘易大小夏侯尚書夏侯勝從兄子建穀梁春秋博士韋元成傳甘露中拜淮陽中尉受詔與太子太傅蕭望之及五經諸儒雜論同異於石渠閣條奏其對上親制臨決注師古曰石渠閣在未央大殿北藏祕書漢承明在石渠閣外為著作庭石渠在未央殿北為祕府居近君之地所以親儒生員嚴助傳張晏注承明廬在石渠門外漢舊儀御史四十五人其十五人為侍御史宿廬在石渠門外劉向傳會立穀梁春秋召更生受穀梁講論五經於石渠儒林傳施讎受田王孫易為博士甘露中與五經諸儒雜論同異於石渠閣梁丘賀子臨傳賀學入説為黃門郎甘露中奏使問諸儒於石渠臨學精熟歐陽地餘治書為博士論石渠林尊授尚書歐陽氏學為博士論石渠周堪與孔霸俱事夏侯勝論於石渠經為最高張山拊事小夏侯為博士論石渠假倉以小夏侯學為謁者論石渠張生一本張長安薛廣德以魯詩為博士論石渠戴聖號小戴以博士論石渠隋志戴聖石渠禮論四卷聞人通漢以太子舍人論石渠並守禮樂易施讎梁丘臨書歐陽地餘林尊周堪孔霸張山拊假倉詩張生薛廣德韋元成禮韋元成戴聖聞人通漢春秋劉更生尹更始黃圖石渠閣蕭何造其下礲石為渠以導水若今御溝因為閣名所藏入關所得秦之圖籍又成帝於此藏祕書焉藝文志書議奏四十二篇禮議奏三十八篇春秋議奏三十九篇論語議奏十八篇五經雜議十八篇石渠論共百五十五篇古文苑揚雄書雄為郎之歲自奏心好沈博絶麗之文有詔令尚書賜筆墨錢六萬得觀書於石渠後蔡雍傳孝宣會諸儒於石渠章帝集學士於白虎通經釋義其事優大翟酺傳宣帝論經石渠學士滋盛弟子萬數唐藝文志漢興學校復創石渠雄向校讎於前馬鄭論次於後西都賦天祿石渠典籍之府命夫敦誨故老名儒師傅講論乎六藝稽合乎同異序曰武宣崇禮官考文章內設金馬石渠西京賦天祿石渠校文之處反遂初賦葛龔考天文於蘭閣覽羣言於石渠郊祀志光武紀注引漢宫閣疏漢天祿閣漢書天祿石渠注師古曰三輔故事曰天祿石渠並在未央大殿北以藏祕書漢宫閣疏天祿麒麟蕭何造以藏祕書處賢才選注同西都賦天祿石渠典籍之府西京賦天祿石渠校文之處東京賦內有天祿宣明殿名拾遺記劉向成帝末校書天祿閣專精覃思夜有老人著黃衣植青藜杖扣閣進見向暗中獨坐誦書老父乃吹杖端煙因授向五行洪範之文恐詞説繁廣忘之乃裂裳及袖以記其言至曉而去請問姓名云我是太一之精天帝聞卯金之子有博學者下而觀焉乃出懷中竹牒有天文地理之書曰余略授子焉黃圖藏典籍之所揚雄傳校書天祿閣上靈帝紀中平三年二月修玉堂殿鑄黃鍾四及天祿蝦蟆注天祿獸也天祿蝦蟆吐水於平門外今鄧州南陽縣北有宗資碑旁有兩石獸鐫其膊州輔墓石獸膊字亦同一曰天祿一曰辟邪據此則並獸名也漢有天祿閣亦因獸立名隋經籍志哀帝命向子歆嗣父之業乃徙溫室中書于天祿閣上歆遂總羣篇撮指要著七略大凡三萬三千九十卷漢麒麟閣蘇武傳宣帝甘露三年二月單于始入朝上思股肱之美圖畫其人於麒麟閣蕭何造造漢宫殿疏天祿麒麟閣蕭何以藏祕書畫賢臣法其形貌書其官爵姓名唯霍光不名曰大司馬大將軍博陸侯姓霍氏次曰衛將軍富平侯張安世次曰車騎將軍龍雒侯韓增次曰後將軍營平侯趙充國次曰丞相高平侯魏相次曰丞相博陽侯丙吉次曰御史大夫建平侯杜延年次曰宗正陽城侯劉德次曰少府梁丘賀次曰太子太傅蕭望之次曰典屬國蘇武皆有功德知名當世是以表而揚之明著中興輔佐列於方叔召虎仲山甫焉凡十一人皆自有傳自丞相黃霸廷尉于定國大司農朱邑京兆尹張敞右扶風尹翁歸及儒者夏侯勝等皆以善終著名宣帝之世然不得列於名臣之圖以此知其選矣注張晏曰武帝時獲麒麟時作閣圖畫其像於閣以為名師古曰漢宫閣疏名蕭何造見天祿閣麟黃圖廟記亦云蕭何造武按翼奉傳文帝時未有麒閣非蕭何造張晏曰帝獲麟作此閣師古引漢疏曰蕭何造然麒麟必先有殿而後以閣附之翼奉曰孝文時未有麒麟武臺等殿安得謂為蕭何所造也嘗趙充國以功德與霍光等列畫未央宫成帝時西羌有警上思將帥之臣追美充國乃召黃門侍郎揚雄即充國畫頌之六典注麒麟閣亦藏書漢白虎閣堯閣三輔黃圖未央宫有白虎閣屬車閣三秦記曰未央宫有堯閣漢延閣藝文志孝武建藏書之䇿置寫書之官注如淳曰劉歆七略曰外則有太常太史博士之職內則有延閣延長也廣內祕室之府隋志同漢飛閣西都賦輦路經營修塗飛閣自未央而連桂宫北彌明光而亘長樂東京賦飛閣神行上林賦高廊四注重坐曲閣閣之屈曲相連者漢西閣楊惲傳觀西閣上畫人指桀紂畫謂樂昌侯王武曰天子過此一二問其過可以得師矣畫人有堯舜禹湯不稱而舉桀紂漢雲閣甘泉賦乘雲閣而上下注高連雲也西京賦長廊廣廡途閣雲蔓注閣道如雲氣連蔓東京賦秦結雲閣冠南山注三輔故事秦二世起雲閣欲與山齊漢宫閣疏凌雲閣秦二世造黃圖雲閣高如雲故言雲梁有重雲閣馬援傳馬嚴顯宗時拜將軍長史將北軍五校士羽林禁兵三千人屯西河美稷縣名衛護南單于聽置司馬從事牧守謁敬同之將軍敕嚴過武庫祭蚩尤帝親御阿閣觀其士衆時人榮之文選注周書曰明堂咸有四阿然則閣有四阿謂之阿閣周禮注四阿若今四注屋古詩阿閣三重階漢仁夀閣在南宫馬嚴傳永平十五年居洛陽顯宗召見進對間雅有詔留仁夀闥一作閣與校書郎杜撫班固雜定建武注記隋志明章重儒術四方巨儒鴻生負帙自逺而至者不可勝算石室蘭臺彌以充積於東觀及仁夀閣集新書校書班固傅毅等典掌焉並依七略為書部固又編為漢藝文志漢東觀藏書閣班昭傳班固著漢書其八表及天文志未竟和帝詔昭就東觀書閣踵而成之晉三閣魏三閣晉祕書閣隋經籍志魏氏采掇遺亡藏在祕書中外三閣隋寫正副二本藏于宫中其餘以實祕書外閣魏略薛夏云祕書為內閣鄭默傳拜祕書郎中掌中外三閣刪省繁文除其浮穢始制中經文選陸機表云身登三閣注謂祕書郎掌內外三閣經書也晉令曰祕書郎掌三閣經書荀嵩傳武帝崇儒西閣東序河圖祕書夏侯湛傳充三臺之寺盈中書之閣南齊百官志晉祕書閣有令史掌衆書見晉令魏王基傳君為祕書郎王朗曰留祕閣之吏唐六典祕書省中外三閣掌典圖書古今文字皆在禁中兩漢或徙金馬門外歷代不常其處注晉惠帝永平元年詔别置祕書寺掌中外三朝圖書穆天子傳以二尺黃紙寫上請付祕書藏之中經副在三閣晉祕閣南史徐廣傳晉孝武帝以廣博學除為祕書郎校書祕閣李克傳為大著作郎分四部甚有條貫祕閣以為永制陸機補著作遊乎祕閣淵臧榮緒為晉書百一十卷齊建元中褚述其美置祕閣文選陸士衡詩升降祕閣注即尚書省也陸士衡詩又曰潔身躋祕閣注祕書省亦為祕閣續晉陽秋孝武帝好覽文藝敕著作郎徐廣料祕閣四部見書凡三萬六千卷宋謝靈運為祕書監整祕閣遺闕梁祕書丞殷鈞校定祕閣四部書更為目録元魏高謐除祕書郎専典祕閣繕寫圖籍梁江子一求觀書祕閣劉孝標典校祕閣隋志後魏綴述國史諸國記注盡集祕閣梁石渠閣文選注劉峻自序曰梁天監中詔峻東掌石渠閣東魏麟趾閣北史封隆之參議麟趾閣新制見律令都在鄴興和三年詔羣臣於麟趾閣議定法制謂之麟趾格冬十月甲寅頒行唐凌煙閣功臣故事圖功臣聖厯侍臣圖贊在西內太極宫三清殿側閣有中隔內外畫為翔鳳相對通鑑貞觀四年正月李靖驍騎三千進屯惡陽嶺夜襲定襄破突厥頡利可汗不意靖猝至大驚又為破於陰山先是上遣鴻臚卿唐儉等慰撫之李靖與李世績謀選精騎一萬齎二十日糧往襲以其謀告張公謹公謹曰詔書已許其降使者在彼奈何靖曰韓信所以破齊也唐儉輩何足惜遂勒兵夜發虜衆遂潰唐儉脫身得歸靖斬首萬餘級俘男女十餘萬斥地自陰山北至大漠露布以聞頡利至長安夏四月戊戌上御順天樓引見上皇聞擒頡利曰漢高祖困白登而不能報今我子能滅突厥付託得人何憂上皇召上與貴臣十餘人及諸王妃主置酒凌煙閣酒酣上自彈琵琶起舞公卿迭起為夀逮夜而罷太宗紀貞觀十七年二月戊申會要二十八日圖功臣于凌煙閣韋述兩京記太極宫中有凌煙閣在凝陰殿內功臣閣在凌煙閣南頡利既平置酒于此秦瓊傳十七年詔司徒趙國公長孫無忌司空河間王孝恭司空萊國公杜如晦司徒太子太傅鄭國公魏徵本傳徵亡帝思不已登閣觀畫像賦詩痛悼司空梁國公房玄齡開府儀同三司鄂國公尉遲敬德特進衛國公李靖會要不載李靖特進宋國公蕭瑀輔國大將軍褒國公段志玄輔國大將軍燕傳作夔恐傳誤字國公劉弘基尚書左僕射蔣國公屈突通陜東道行臺右僕射鄖國公殷開山荆州都督譙國公許紹會要曰襄公紹此乃柴紹會要誤也荆州都督邳國公長孫順德洛州都督鄖國公張亮吏部尚書陳國公侯君集左驍騎將軍郯國公張公謹左領軍大將軍盧國公程知節禮部尚書永興郡公虞世南户部侍郎尚書渝國公劉政會户部尚書莒國公唐儉兵部尚書英國公李績本傳大宗時績已畫像凌煙閣永徽元年高宗復命圖其形自序之并徐州都督胡國公秦瓊二十三人傳無高士亷圖形凌煙閣吕溫頌之高宗永徽六年遣使致祭名臣圖形凌煙閣者凡七人徵士亷瑀志玄弘基世南叔寶皆終始著名者也傳無高士亷只有二十三人吕溫贊并高申公士亷二十四人會要於傳內無李靖只有二十一人名與史同而云等二十四人象二十四氣之佐天會要十七年二月二十八日詔曰自古皇王褒崇勳德既勒名于鍾鼎又圖形于丹青是以甘露良佐麟閣著其美建武功臣雲臺紀其迹無忌等二十四人宜酌故實並圖畫凌煙閣庶念功之懷無謝於前載旌賢之義永貽於後昆代宗紀廣德元年七月壬子給功臣鐵劵藏名於太廟圖形於凌煙閣代宗平河北時德宗為兵馬元帥與功臣郭子儀李光弼等皆賜鐵劵圖形於凌煙閣廣德初又圖大寧郡王僕固懷恩李晟傳貞元三年拜太尉明年與馬燧見延英帝嘉其勳下詔曰昔我烈祖乘乾坤滌蕩掃隋季荒茀體元御極作人父母則有熊羆之士不二心之臣左右經綸參翊締構昭文德恢武功威不若康不乂用端命于上帝付畀四方王業既成太階既平乃圖厥容于凌煙閣懋昭績效表式儀形以弗忘朝夕永垂乎來裔君臣之義厚莫重焉歲在己巳秋九月我行西宫瞻望崇構見老臣遺像顒然肅然和敬在色想雲龍之協期感致業之艱難覩往思今取類非逺且功與時並才與世生茍藴其才遇其時尊主庇人何代蔑有在中宗時則有如桓彥範等著輔戴之績在玄宗時則有如劉幽求等申弼翼之勳在肅宗時有如郭子儀掃除氛祲今顧晟等保寧朕躬咸宣力肆勤光復宗祏訂之前烈夫豈多謝闕而不録孰旌厥賢况念功紀德文祖所為也在豫其曷敢忘有司宜敘先後圖其像於舊臣之次命皇太子書其文一云書于壁以賜晟晟刻石于門左會要德宗貞元五年九月李晟馬燧見延英上嘉其勳詔史官考其功績第其前後以褚遂良蘇定方郝處俊等二十七人充之忠義傳宣宗大中二年七月己巳詔求李峴王圭戴胄馬周褚遂良韓瑗郝處俊婁師德王及善朱敬則魏知古陸象先張九齡裴寂劉文靜張柬之袁恕己崔元暉桓彥範劉幽求郭元振房琯袁履謙李嗣業張巡許逺盧奕南霽雲蕭華張鎬李勉張鎰蕭復柳渾賈耽馬燧李憕三十七人畫像續圖凌煙閣云會要只有三十六人而曰三十七人有岑文本而無禇遂良袁恕己李絳傳大中初詔史官差第元和將相續圖凌煙閣絳在焉獨留中蔣乂傳德宗嘗登閣視左壁頺剝題文漫缺行才數字録以問宰相無能知者遽召蔣乂至答曰此聖厯中侍臣圖贊帝前口以誦補不失一字藝文志大宗凌煙閣功臣讃一卷令狐德棻凌煙閣功臣故事四卷曹元廣畫凌煙圖吕溫有贊二十二首五代會要閣在西內三清殿側畫像皆北向閣有隔隔內北面寫功高宰輔南面寫功高諸侯王隔外次第圖畫功臣題贊後唐應順元年閏正月甲寅集賢院奏修凌煙閣南部新書畫功臣皆北面設三隔內一層畫功高宰輔外一層寫功高侯王又外一層次第功臣閣在凝陰殿西大宗贊閻立本畫褚遂良題比天二十四氣金石録載河間元王段志玄碑並云圖形戢武閣意凌煙先名戢武後改之爾實録有戢武殿無忌玄齡如晦徵瑀輔其政靖績瓊亮君集孝恭通敬德制其兵公謹士亷世南儉陪其議弘基政會開山志玄參佐命之勳紹知節順德擅冠軍之勇吕溫贊削君集亮以孝恭為首李庾西都賦房魏作弼英鄂執律戎衣既稅瑞氣洋溢立閣圖形榮號凌煙指河帶以山礪書天子之搢紳杜甫丹青引贈曹霸云開元之中常引見承恩數上南薰殿凌煙功臣少顔色將軍下筆開生面良相頭上進賢冠猛將腰間大羽箭褒公鄂公毛髮動英姿颯爽來酣戰唐祕書閣百官志龍朔二年改太史局曰祕書閣局令曰祕書閣郎中乾元曰司天臺置通元院唐翔鸞閣棲鳳閣會要上元元年九月甲寅御翔鸞閣觀酺會要又云御含元殿東翔鸞閣大酺時赤縣與太常音樂分東西朋帝詔雍王賢主東周王顯主西因以角勝郝處俊諫乃止至德三年正月庚寅御翔鸞閣習武監察御史職知朝堂正門無籍非因奏事不得入至殿庭在栖鳳閣南望殿中侍御史已上從觀象門出若從天降唐六典大明宫中丹鳳門內正殿曰含元殿夾殿兩閣左曰翔鸞右曰棲鳳閣下即朝堂肺石登聞鼓李華含元殿賦左翔鸞而右棲鳳翹兩闕而為翼唐景雲閣實録乾封元年封泰山四月甲辰至京師御景雲閣一作閣宴羣臣設九樂賜贈綵上元元年九月辛亥御麟德殿之景雲閣以宴羣臣唐鳳閣百官志光宅元年改中書為鳳閣令為內史藝文志别集類樂朋龜綸閣集十卷薛延圭鳳閣書詞十卷唐昭慈閣許景先傳神龍初東都造昭慈閣景先獻賦李逈秀見其文畏歎曰是宜付太史擢右拾遺唐清輝閣文苑英華李嶠人日清輝閣宴羣臣應制詩云云會要神龍二年置聖善報慈之閣述聖賦踐太微之崇閣闢閶闔之天扄唐凝暉閣見渾儀在太極宫唐朝元閣降聖閣席豫傳天寶初玄宗嘗登朝元閣賦詩近臣屬和帝以豫詩最工詔曰詩人冠冕也在華清宫有事老子處舊史玄宗幸溫泉宫登朝元閣賦詩會要天寶七載十二月二日舊紀戊戌玄元皇帝降于朝元閣改為降聖閣實録天寶十載十月乙丑御朝元閣有慶雲見上賦詩羣臣畢和聞見記封演玄宗幸驪山登朝元閣命羣臣賦詩正字劉飛詩最清拔特蒙激賞錢起朝元閣賦吞貝闕壓崑閬襟懷動植指掌寰瀛孫翊仁賦神之本以朝為大乾之德以元為高郭遵初日見朝元閣賦云云權德輿朝元閣詩云繚垣復道上層霄十月離宫萬國朝貞觀二年八月乙未舊紀癸巳公卿奏宫中卑濕請營一閣帝曰漢文帝將起露臺而惜十家之産朕德不逮而所費過之豈為民父母之道固請至三不許唐祕閣李雍傳見李嶠願一見祕書嶠曰祕閣萬卷豈時日能習乃假直祕書未幾試問奧篇隱帙了辨如響劉子玄議祕閣有梁武帝南郊圖春秋正義太史之官職掌書籍必有藏書之處若今之祕閣也會要貞觀十七年上實録編之祕閣舊史李善注文選詔藏于祕閣顔師古正俗八卷詔付祕書閣唐瑞閣地理志上黨有啓聖宫玄宗故第開元十一年置本飛龍後更名有瑞閣代宗大厯八年四月壬申潞州上言玄宗啓聖瑞閣有白鶴來翔唐蓬萊殿書閣李泌傳代宗立召泌至舍蓬萊殿書閣時泌隱衡山張文瓘傳高宗時造蓬萊上陽合璧等宫代宗朝段秀實對蓬萊殿問所以安邊者文宗觀書蓬萊殿問許康佐李訓春秋之義唐禮閣又見禮閣新儀舊唐書傳王彥威元和中補太常檢討官於禮閣掇拾自隋已來朝廷沿革吉凶五禮以類區分成三十卷獻之號曰元和新禮授太常博士裴瑾撰二陵集禮藏之南閣序云藏于太常書閣端拱祕閣藏書閣淳化閲祕閣圖籍淳化祕閣贊飛白祕閣端拱元年五月辛酉朔詔置祕閣於崇文院取四庫書四萬卷藏之長編以三館書實其中以吏部侍郎李至兼祕書監宋泌兼直祕閣杜鎬兼校理會要端拱元年詔就崇文院中堂建祕閣擇三館真本書籍萬餘卷及內出古畫墨迹藏其中命李至兼祕書監總之天文占候讖緯上方技書五千十二卷古畫墨迹百十四軸悉藏閣六月以夏侯嘉正兼直祕閣八月以裴愈監祕閣圖書按六典祕書省中外三閣掌書籍古今文字皆在禁中兩漢或徙金馬門外歷代不常厥處唐季亂離百王之書蕩然散失蘭臺延閣空存名號上崇尚儒術屢下詔求羣書四方文籍往往而出未數年間充牣書府至是乃於史館建祕閣仍選三館書萬卷以實其中故以至主之淳化元年七月丁酉以御製詩文四十一卷藏於祕閣八月癸卯朔祕書監李至僕射李昉吏書宋琪左散騎常侍徐鉉及翰學諸曹侍郎給事諫議舍人等詣祕閣觀書帝知之即詔寵腸御筵出書籍令縱觀二日甲辰又召御史中丞王化基及三館學士縱觀並賜宴祕閣先是遣腸諸道求募古書竒畫及先賢墨迹小則償以金帛大則授以官數年之間獻圖書於闕下不可勝計諸道又募得者數倍復詔史館盡取天文占候讖緯方術等書五千一十二卷并內出古畫墨迹一百十四軸悉藏祕閣圖籍之盛近代所無也是月癸亥至等上言曰伏以王者藏書之府自漢置未央宫則有麒麟天祿命劉向揚雄典校謂之中書即內庫書也後漢藏之東觀亦在禁中漢末置祕書監掌禁中圖書祕記謂之祕書及魏文帝分祕書為中書而祕書監者掌藝文圖籍之事晉宋因之宋謝靈運補祕閣之遺逸齊末祕閣經籍遺散梁江子一請祕閣觀書至隋煬帝時寫祕閣之書分為三品於觀文殿東西廊貯之則祕閣之設其來久矣及唐開元間五年亦於乾元殿東廊繕寫四庫書以充內庫命褚無量馬懷素總之至十三年置集賢書院雖沿革不常而祕閣之書皆置於內也自唐室陵夷斯道幾廢陛下復興祕閣以藏竒書總羣經之博要資乙夜之觀覽况睿藻宸翰盈溢編帙則其奧祕非復與羣司為比伏乞特降明詔令與三館並列至於高下之次先後之稱亦乞著為定式詔祕閣宜次三館其祕書省依舊屬百司初但有直史館至是新置有直昭文館直集賢院備三館之職淳化二年五月甲寅詔增修祕閣先是度崇文院之中堂為祕閣址而層宇未立書籍止扄偏廳廡內至是始命修之八月壬戌朔閣成上作新祕閣贊以賜近臣宰相李昉等請立石閣下李至上表引蘇易簡乞上飛白書玉堂之署為比願腸新額以光祕府戊辰詔近臣觀新祕書賜上尊酒大官供膳遣中使賫飛白書祕閣二字以賜李至三館咸預焉又腸御詩以美其事沈存中云館內壯麗中都下人謂之木天丁丑李至上表乞以御製祕閣贊刻石詔其贊并序朕兼為親書并篆額以旌祕省九月己未上幸祕閣閲羣書久之飲從臣酒三行三館學士咸預還官召傅潛戴興恣觀羣書欲其知文儒之盛也十月以御草書千字文付祕閣癸酉以御書祕閣贊并李至表及答詔石本賜近臣四年畫天下圖藏于閣五年六月以御草書五軸藏之至道元年正月直祕閣朱昂等言已立祕閣贊碑請附名李至下興國二年以先賢墨迹淳化以新集法帖至道以飛白四十軸藏祕閣咸平二年六月詔童子邵煥於祕閣讀書五年七月幸祕閣閲羣書咸平中就閣修太祖國史五年奉安太宗文集景德四年五月己亥幸館閣周覽圖籍以祕閣地狹分內藏西庫以廣之祥符九年九月以祕書監楊億判祕閣國初書止萬二千卷祕閣之建圖籍大備至仁宗時三萬六千二百卷熙寧四年十月二十九日判祕閣宋敏求言三館祕閣四部書多訛舛請校讎自前漢始事寢元祐元年四月十四日詔蘭臺延閣位序多闕命大臣各舉三人二年六月以昭文館黃本書分藏祕閣三年九月復試賢良于閣下四年四月二十四日太師彥博與宰輔至祕閣觀書宴儒士徽宗即位二年重修祕閣崇寧元年成崇寧二年五月祕閣書裝褫共二千八十二部淳化望仙閣元年十一月庚辰朗州言準詔修桃源觀五百仙人閣成賜名望仙閣內中有恭天崇道閣奉三清諸聖咸平龍圖閣六閣太宗祥符初建龍圖閣以藏太宗御書太宗以武定并汾以文致太平聖謨寶訓與河圖洛書相表裏集太祖英宗無不為閣景德二年四月戊戌上幸龍圖閣近臣畢從庚子御製龍圖閣贊賜近臣閣在含光殿西偏北連禁中閣初建無歲月咸平四年十一月丁亥始御是閣見于國史東曰資政殿西曰述古殿閣上藏太宗御製御書并文集總五千一百一十五卷軸册又有御書素扇數十其下列六閣曰經典閣總三千三百四十一卷史傳閣總七千三一作二百五十八卷子書閣總八千四百八十九卷文集閣總七千一百八卷天文閣總二千五百六十一卷圖畫閣總七百一軸卷册圖畫閣一本作瑞物閣竒瑞二十三瑞木十六衆瑞一百一十三雜寶一百九十五又古賢墨迹二百六十六卷按會要大中祥符所造以奉太宗御書然自咸平四年十一月丁亥已嘗御是閣編年咸平五年七月幸祕閣閲四庫書召近臣觀御書及古今圖書自後嘗召近臣觀書更當考究按編年實録景德元年十月己酉龍圖閣成以戚綸杜鎬兼待制咸平四年十一月二十日丁亥五年十月十七日己卯祥符三年正月戊寅八月甲寅九年十一月二十三日天禧四年十一月十一日皆召近臣宗室觀書上嘗謂輔臣曰朕退朝之暇無所用心聚此羣書以自娛耳咸平五年十月十七日觀書曲宴閣之四壁設五經圖藏太宗書帖三千七百五十卷十二月上以龍圖閣及後苑所藏書籍尚多舛誤欲加讎校於是擇劉筠子儀等七人給本官俸太官供膳就崇文院校之踰年而畢景德四年八月丁巳以杜鎬為直學士祥符三年七月己亥以鎬為學士陳彭年直學士九年十月壬辰置直閣十一月壬辰召向敏中等對命坐令陳從易劉子儀等賦瑞雪歌祀汾陰詩真宗嘗語近臣曰三館祕閣所藏外又於後苑及龍圖閣並留正本各及三萬餘卷慶厯八年三月甲寅幸龍圖閣天章閣召輔臣侍臣宗室觀太宗遊藝集三朝瑞物真宗幸澶州詩碑因出手詔訪得失羣臣歸而上之嘉祐七年十一月又幸觀三聖御書咸平祕閣直廬初興國八年命吕文仲為翰林侍讀寓直御書院以備顧問名秩猶未崇咸平二年七月丙午以兵侍楊徽之户部夏侯嶠為侍讀學士祭酒邢昺為侍講學士班秩祿賜次翰林學士設直廬於祕閣侍讀更直侍講長上召見訪問或至中夕八月壬子賜宴祕閣帝作七言詩景德翔鸞儀鳳閣在後苑景德四年三月七日曲宴後苑臨水閣垂釣登太清樓觀太宗御書及四部羣書東至玉宸殿厯翔鸞儀鳳二閣命坐置酒帝作五言詩從官皆賦遂宴太清樓下祥符九年二月癸卯翔鸞閣觀御書聖製歌詩針銘贊論或刻石或題板或以朱黃書于石壁天禧三年三月十三日曲宴後苑登翔鸞閣觀太宗御集聖製又御儀鳳閣作賞花釣魚詩景祐中有瑞竹生閣首熙寧七年玉華殿後作山亭一祥鸞閣一基春殿一祥符寶符閣感真閣積慶殿保寧閣四年正月上以靈文疊降盡志欽奉欲垂訓子孫俾奉事無怠乃為誓文乙未命刻石玉清昭應宫寶符閣下七年六月己未名天書閣曰寶符十月戊午賜真遊殿真君殿曰積慶庚辰詔真遊殿前新閣名感真十一月癸未朔上親書玉清昭應宫太初積慶二殿寶符閣額填以金有司設黃麾仗奉以赴宫十二月丁卯對輔臣于感真閣觀刻玉天書八年正月壬午朔奉刻玉天書于寶符閣九年四月丁丑御書景靈宫天興殿保寧閣景祐二年改降真閣曰崇真仁宗召宗室侍臣觀燈慈聖閣宋祁有詩熙寧九年十月十五日幸開寶寺福聖院慶壽崇因閣以閣新成也祥符國子監御書閣五年九月辛巳十六日國子監請於文宣王殿北建閣以藏太宗御書及御製真宗祥瑞勤政論俗吏辨刻石明年六月己巳命近臣臨觀上梁設宴賜七言詩又賜二帝御集御書摹本太宗墨迹銷金扇四祕之閣上命王曾撰記天禧天章閣真宗在會慶殿西龍圖閣之北新開景暉門在右銀臺門北東曰羣玉殿西曰蘃珠殿北曰夀昌閣東曰嘉德殿西曰延康殿天禧四年十一月壬戌詔作天章閣奉安御集十二月乙巳興修五年正月十八日己亥召近臣觀天章閣興工宴承明殿三月丙子朔戊戌閣成其月庚子令有司具兩街僧道威儀教坊作樂奉御集御書一云奉安御製七百二十二卷成七百二十卷自玉清昭應宫安于閣賜宴閣下四月壬戌召三司京府官詣閣觀書遂宴于羣玉殿一本四月十六日召近臣館閣詣天章閣下觀御書遂宴羣玉殿時輔臣集聖製為三百卷初輔臣以御書御製共二千卷進呈詔藏御集閣以天章為名以天書祥符故曰天章又命錢惟演王曾編次然未建官也逮天聖八年十月壬寅仁宗始置待制以范諷鞠詠為之景祐四年三月甲戌朔又增侍講乃以崇政殿説書賈昌朝崇文院檢討王宗道國子監直講趙希言兼侍講慶厯七年八月戊午又置學士直學士學士罕以命人迄仁宗世王摯一人而已政和六年九月增置直閣天聖八年八月丁亥觀三聖御書慶厯三年九月三日丁卯召輔臣及御史於是閣謁太祖太宗御容觀瑞物問禦邊大略八年三月甲寅幸閣觀瑞物問中丞以上利病得失詳見後嘉祐七年十二月二十三日丙申觀三聖御書二十七日庚子再幸觀瑞物晏殊天章閣頌曰層觀上躋雕甍四出屹陰虯而對負聳翔鶠之來巢回鸞翥鳳神毫飛奮之妙相金振玉睿作溫純之式寶題雲蔚翠軸蚪蟠采嘉號於密都揭華題於瑞曰紹興二十四年九月乙亥二十五日詔建天章等六閣于和寧門內奉安諸閣御書御集圖籍等十一月三日畢工門曰詒謨寶元紫微閣元年七月庚戌作舍人院閣上親篆其榜曰紫微閣以賜之元祐初舍人劉攽請復舊制建紫微閣於西省慶元五年御書紫微閣寶元延春閣元年十月己丑改萬春閣為延春閣閣在禁中北臨後苑遊幸之所經也延春閣兩壁畫農家蠶織見于紹興五年三月甲午之聖訓延春閣舊曰萬春寶元元年改景祐邇英延義閣志景祐三年名崇政殿西閣曰延義西南閣曰邇英帝學作閣字皇祐三年名邇英閣小殿曰隆儒會要二閣在崇政殿東西侍臣講讀之所景祐二年正月二十八日癸丑置寫無逸篇于屏三年正月乙巳賈昌朝請輯經筵事為一書詔以邇英延義二閣記注為名九月辛卯詔輔臣至邇英閣觀講書慶厯四年邇英閣出御書十三軸凡三十五事丁度等上答邇英聖問一卷趙師民勸講針肇開二閣以延儒服西臨邇英北啓延義瞻仰皇明彌綸聖智慶厯寶文閣仁宗在天章閣西序羣玉蘂珠殿之北即寶文閣舊曰夀昌閣慶厯元年改今名嘉祐七年十二月丙申幸寶文閣帝親為飛白書賜從臣御製觀書詩近臣皆和學士王圭撰詩序刋石寶文閣八年十二月乙亥詔以仁宗御書藏寶文閣命翰林學士王圭撰記立石英宗御書附于閣治平三年九月丙辰幸觀御詩石刻四年二十八日乙巳神宗詔置學士直學士待制詔曰祖宗咸有述作煥乎簡編河漢昭回奎璧相照乃規層宇邃在西清憲上帝藏書之府章纍朝稽古之隆並揭嘉名以登俊望先皇纂御首命近列論次仁宗遺文鈿軸寶函翻録方畢大訓九歌之重垂世共長廣內祕室之藏貽謀無極祗循故事遹成先志寶文閣宜置學士直學士待制元祐四年十一月以神宗御集九十卷藏寶文閣政和六年九月十七日增置直閣慶厯開天章閣十事三年三月戊子夷簡免以得象殊為相昌朝參政弼副樞辭之四月甲辰琦仲淹副樞乙巳衍為樞密使又親擢修靖素襄為諫官石介作聖德詩七月辛未詔輔臣陳政事及非時留對並不限時刻丁丑仲淹為參政固辭八月戊戌詔諫官日赴內朝丁未仲淹復為參政弼復為副樞命仲淹主西弼主北癸丑琦為陜西宣撫使九月丁卯召輔臣天章閣上問禦邊大略久之乃罷仲淹等每進見必以太平責之再賜手詔趣使條天下事詔曰比以中外人望不次用卿今琦暫往陜西仲淹弼宜與宰臣得象盡心國事毋有顧避當世急務可建明者悉為朕陳之紀長編通略在九月丁卯召輔臣對天章閣又開天章閣賜坐給札使疏于前仲淹弼皇恐避席退而列奏條上十事仲淹答手詔條陳十事弼别為二䇿以上一曰明黜陟十月壬戌行之二曰抑僥幸十一月癸未立試館職法丁亥減任子磨勘任子之法僥幸之人皆不便三曰精貢舉明年三月乙亥頒條制四曰擇官長十月丙午行之五曰均公田十一月壬辰行之六曰厚農桑七曰修武備八曰減徭役明年五月己丑省縣邑首自河南九曰覃恩信十曰重命令上悉用其説次第頒下唯府兵輔臣以為不可乃止歐陽集云三年秋天子開天章閣召政事之臣八人問治天下其要有幾施於今者宜何先使坐而書以對於是詔書屢下勸農桑責吏課舉賢才明年三月詔天下皆立學中八人蓋并樞副任師也四年五月壬戌朔琦仲淹對崇政殿上四䇿八月辛卯命參政昌朝領天下農田仲淹領刑法事有利害悉條上之仲淹援唐故事請以輔臣分總其務後弗果行九月庚午殊免甲申衍為相五年正月乙酉仲淹弼罷八年三月甲寅幸龍圖天章閣出手詔賜輔臣條畫給筆札令即坐以對宰臣執中固辭乃聽歸上之熙寧二年四月己亥令中書樞密院開便門通天章閣欲與兩府坐而論道也元豐四年十一月丁酉開天章閣對輔臣呈官制除目至和寶章閣二年六月丙申以五臺山真容院新修太宗真宗御書閣為寶章閣嘉祐二年二月癸亥御迎陽門召近臣觀御書閣榜熙寧敇閣會要熙寧元年二月十六日大理寺言敇閣以詳斷法官兼監欲專差檢法官二員監之元符顯謨閣神宗圖功臣元年四月十八日丙申詔建閣藏神宗御集名顯謨建中靖國元年二月九日庚子一云正月庚午詔以顯謨閣為熙明閣置學士直學士待制尋復舊名崇寧三年六月壬寅朔詔曰神考肆筆成書表裏六經再詔纂集總九千八百餘篇皆文辭政事邊機之要云云其熙豐功臣圖形於顯謨閣政和六年置直閣大觀徽猷閣哲宗二年建哲宗御書閣二月十三日甲午詔以徽猷為名置學士直學士待制政和六年增置直閣紹興敷文閣徽宗十年建閣藏徽宗聖製五月十一日甲申詔以敷文為名置學士直學士待制直閣二十四年九月己巳御集成凡一百卷紹興首善閣十三年二月庚申司業高閲言辟雍御書閣名求賢徽宗御書今御書閣請賜名七月成賜名首善大觀二年九月十九日詔諸路州學藏書閣賜名稽古紹興六閣見上紹興御書祕閣右文殿道山堂石渠十三年十二月十一日詔重建祕書省十四年五月賜御書祕閣右文殿榜又詔將作監米友仁書道山堂榜右文殿五間門三間殿後祕閣五間高四丈中設御坐御案腳踏羅帕褥御屏畫出水龍閣上木雕朱漆殿奉安聖政會要日厯御製御札等閣前有拜閣臺接右文殿閣後道山堂五楹二十八日祕書省復置補寫所初熙寧七年置補寫所以祕閣成寫校勘黃本書籍也七月二十七日丙子幸祕閣觀御書御製淳熙五年九月壬申幸石渠在祕閣後長五丈廣一丈五尺乾道九年少監陳騤立紹定五年七月重建祕閣景定四年御書道山堂琅函寶軸存九朝簮筆之書金戺玉階具二聖經行之迹祕殿前臨道山後翼淳熙煥章閣高宗十五年十一月九日建閣藏高宗聖製詔曰載稽帝世之隆無若堯章之煥揭名層宇列職清箱置學士直學士待制直閣淳熙凌虛閣二年二月庚辰宴羣臣凌虛閣下苑中又有芙蓉閣淳熙石經閣四年二月十九日詔建石經閣于國子監上親題額慶元華文閣孝宗二年建閣藏孝宗聖製五月十五日詔曰華協堯章之煥文光舜哲之明恭以華文為閣名置學士直學士待制直閣太微三光之庭上帝羣玉之府嘉泰寶謨閣光宗元年建寶謨閣藏光宗聖製十一月十二日詔曰寶列羲圖之祕謨新禹命之承冠以美名揭於層宇置學士直學士待制直閣寶慶寶章閣寧宗二年建閣藏寧宗聖製十月二日甲申詔曰昭奉嚴儲與仁祖思陵圖書徽稱聯美置學士直學士待制直閣元年十一月八日詔建定閣名寶慶昭勳崇德閣元年八月十五日命奉常建閣自趙普至葛邲二十有三人登繪而表異之親灑宸翰名曰昭勳崇德之閣端平經武閣樞密院北奉安經武要略御書經武之閣四大字端平屬籍閣大宗正司故與開元宫為鄰紹定四年災寓睦親宅五年六月甲子詔以天慶坊魏王府舊址為之六年六月戒事明年端平改元八月甲子成上書屬籍之閣四大字以寵靈之咸淳顯文閣理宗闕歷代閣名前漢含章麒麟朱鳥龍興天祿石渠後魏虹霓麟趾後周重陽隋巢鸞遊麟同心登春飛綺唐朝元降聖清暉六朝昭德武德重雲望仙結綺臨春麗椒飛香招賢丹臺新録所載金閣閣漢東閣公孫弘傳開東閣以延賢人注師古曰閣小門也東向開之避當庭門引賔客以别於掾史官屬朱雲傳薛宣謂雲曰留我東閣可以觀四方竒士永平初東平王蒼為驃騎將軍開東閣延英雄漢黃閣續志大尉公有黃閣主簿録省衆事宋志三公黃閣前史無其義禮記士韠與天子同公侯大夫則異鄭玄注云士賤與君同不嫌也夫朱門洞開當陽之正色也三公之與天子禮秩相亞故黃其閣以示謙漢舊制也張起與陳公箋拜黃閣將有日月是也通典陳三公之制開黃閣聽事置鴟吻一作尾北齊三公府三門當中門黃閣設內屏黃閣主簿掌閣下威儀漢省閣後傳東平王蒼詔讃勿名諸王入宫輒以輦迎至省閣乃下楊腸拜太尉中平元年被召會議詣省閣切諫馮豹拜尚書郎奏事未報常俯伏省閣晉金光閣晉官閣名洛陽宫有金光閣文成青陽朱明承休安樂白藏顯仁崇明章德飛雲安世長安閣長安有東明西華紫闥閣後魏崔光乘步挽至東西上閣北齊有西上閣東上閣見通典隋姚察授祕書丞敕於朱華閣長參唐紫宸內閣官志起居郎掌録天子起居法度天子御正殿郎居左舍人居右有命俯聽退書之季終授史官貞觀初以給事中諫議大夫知起居注仗下議政事起居郎一人執筆記録于前後置舍人分侍左右秉筆隨宰相入殿若仗在紫宸內閣則夾香案分立殿下直第二螭首和筆濡墨皆即坳處時號螭頭高宗臨朝不決事許敬宗李義府為相奏請多畏人知命郎舍人對仗承旨仗下與百官皆出不復聞機政長壽中二年正月戊申宰相姚璹建議仗下後宰相一人録軍國政要為時政紀月送史官然率推美讓善事失其實開元中五年九月戊申詔修史官非供奉者皆隨仗入位郎舍人之次李林甫專權又廢太和九年詔入閣日郎舍人具紙筆立螭頭下復貞觀故事六典宣政之左曰東上閣右曰西上閣唐宣光閣李適傳擢修文館學士睿宗時待詔宣光閣列傳裴寂視朝引與同坐入閣則延卧內宇文士及太宗延入閣語或至夜分姚崇玄宗詔五日一參入閣供奉蘇頲為中書舍人玄宗平內難書詔填委獨頲在太極後閣口所占授功狀百緒思若湧泉諫議大夫陽城等伏閣極論裴延齡淳熙清華閣五年學士周必大對清華閣苑中十四年洪邁召對清華閣玉海卷一百六十三
