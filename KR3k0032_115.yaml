body:
  text: 玉海卷一百十五宋王應麟撰選舉科舉二魏五經課試法又見經解類魏志文帝黃初五年夏四月立太學制五經課試之法置春秋榖梁博士明帝太和二年六月詔髙選博士才任侍中常侍者申敕郡國貢士以經學為先四年二月壬午詔博士課試擢其髙第者亟用浮華者退之魏略黃初元年之後備博士之貟依漢甲乙以考課太學始開有弟子數百人大和青龍中諸生千數魏九品中正晉九品中正通典參通鑑魏初延康元年即黃初元年尚書陳羣以為天朝選用不盡人才乃立九品官人之法州郡皆置中正以定其選擇州郡之賢有識鑒者為之區别人物第其髙下初陳羣以吏部不能審核天下士故令郡國各置中正州置大中正皆取本土之任朝廷官德充才盛者為之使銓等級以為九品有言行修著則升之道義虧缺則降之吏部憑之以補授行之浸久中正或非其人姦弊日滋至晉武帝時太康五年劉毅上疏曰夫中正定九品髙下任意榮辱在手操人主之威福奪天朝之權勢公無考校之貟私無告訐之忌用心百態營求萬端亷遜之風減爭訟之路開臣為聖朝耻之蓋中正之設損政之道有八髙下逐強弱是非隨興衰一人之身旬日異狀上品無寒門下品無世族一也置州都者本取州里清議咸所歸服將以鎮異同一言議也今重其任而輕其人使是非之論橫於州里嫌讎之隙結於大臣二也本立格之體為九品者謂才德有優劣倫輩有首尾今使優劣異域首尾倒錯三也陛下賞善罰惡無不裁之以法獨置中正委一國之重無賞罰之防又禁人不得訴訟縱橫任意無所顧憚諸受枉者抱怨積恨不獲上聞四也一國之士多者千數或流徙異邦或取給殊方面猶不識況盡其才而中正知與不知皆當品狀採譽於臺府納毁於流言任已則有不識之弊聽受則有彼此之偏五也凡求人才者欲以治民也今當官著效者或附卑品而在官無績者更獲髙敘是為抑功實而隆虛名長浮華而廢考績六也官不同人事不同聽今不狀其才之所宜而但第其九品以品取人或非才能之所長以狀取人則為本品之所限徒結白論品狀相妨七也九品所下不彰其罪所上不列其善各任愛憎以植其私天下之人焉得不懈德行而鋭人事八也由此論之職名中正實為姦府事名九品而有八損古今之失莫大於此臣愚以為宜罷中正降九品棄魏氏之敝法更立一代之美制太尉汝南王亮司空衛瓘亦請蕩除末法咸用土斷舉善進才各由鄉論始平王文學李重以九品既除宜先開移徙聽相并就則土斷之實行帝不能改陳羣傳制九品官人之法傅子曰司空陳羣始立九品之制郡置中正州置州都孫楚謂班固序往代賢智以九條而陳羣依之以品生人夏侯玄傳議曰銓衡專於臺閣上之分也孝行存乎閭巷優劣任之鄉人下之敘也自州郡中正品度官才未聞整齊豈非分敘參錯各失其要之所由哉使官長各以其屬能否獻之臺閣臺閣據能否之第參以鄉閭德行之次擬其倫比中正唯考行迹别其髙下審定輩類勿使升降庶可靜風俗而審官才矣晉傳張軌泰始初中書監張華與軌論經義及故事損益謂安定中正蔽善抑才美為之談以為二品之精劉毅以光祿大夫歸第司徒舉毅為晉州大中正尚書以毅致仕不宜勞以碎務孫尹表曰司徒魏舒兼執九品銓十六州不以為劇毅遂為州都銓正人流清濁區别劉頌嫁女陳矯本劉氏子改姓陳中正劉友譏之李重江夏人為本國中正太熙初遷吏部郎燕國中正劉沉舉霍原為寒素太康元年春正月壬申詔內外羣官舉清能拔寒素司徒府不從重奏曰案如癸酉詔書廉讓宜崇浮競宜黜蓋以二品繫資或失廉退之士故開寒素以明尚德之舉始舉原先咨州大中正後將軍嬰鄉黨之議既舉又刺史班詔表薦如詔書所求之旨應為二品從之劉沉為本邑大中正崇儒愛賢進霍原二品庾珉潁川人為本國中正杜良顔含為州大中正陳壽領郡中正南陽樂謨為郡中正徐邈張闓華談本郡大中正江逌王坦之諸葛恢陸曄陸玩州大中正盛彥廣陵人本邑大中正劉頌舉彥為小中正卞壼劾淮南小中正王式虧損世教不可居人倫詮正之任解結曰河北少人士每以三品為中正何充以州有先逹宿德固辭不拜袁粲為中正欲下何岐之品孔偷為司徒長史以溫嶠不終孝道不過其品鄭默十二郡中正僉共舉默文選注晉諸公讃曰傅宣定九品未訖劉疇代之悉改宣法宋書魏武始基軍中倉卒權立九品蓋以論人才優劣非謂世族髙卑自魏至晉莫之能改州都郡正以才品人都正俗士品目少多隨事俯仰嵗月遷訛凡厥衣冠莫非二品自此以還遂成卑庶周漢之道以智役愚魏晉以來以貴役賤梁天監二年二月庚午置州望郡宗鄉豪各一人掌搜薦後復置中正後魏州郡有中正掌選舉以季月與吏部銓擇可否孝文臨軒令諸中正各舉所知大和中詔諸郡中正列土族次第為選舉格名曰方司格史通曰方思殿格氏族書也正始元年冬罷中正大中正若王肅揚州劉芳徐州郭祚井州隋罷中正通典注云九品及中正至隋開皇中方罷唐武德七年正月依周齊制每州置大中正一人掌人物品第以門髙者領之無品秩史記陳勝以朱房為中正吳有大公平習溫潘祕為之今之州都宋明帝時會稽郡重望計及望孝大守蔡興宗欲舉孔仲智之子為望計郭原平之子為望孝一以高門一以至行會别敕用人二選並寢梁天監四年正月詔九流常選年未三十不通一經不得解褐若才同甘顔勿限年次魏舉賢良魏志明帝太和四年十二月丙寅詔公卿舉賢良青龍元年三月甲子詔公卿舉賢良篤行之士各一人晉傅玄傳上疏先王之臨天下也道化隆於上清議行於下魏武好法術而天下貴刑名魏文慕通逹而天下賤守節其後虛無放誕之論盈於朝野今開正直之路惟未舉清逺有禮之臣以厚風節詔報曰舉清逺有禮之臣尤今之要也乃使玄草詔進之魏四科文選文帝典論論文曰文本同而末異蓋奏議宜雅書論宜理銘誄尚實詩賦欲麗此四科不同故能之者偏也唯通才能備其體吳四科吳志注赤烏二年正月詔曰郎吏者宿衛之臣古之命士也間者所用頗非其人自今選三署皆依四科不得以虛詞相飾晉舉賢良紀武帝泰始四年十一月己未詔王公卿尹郡國守相舉賢良方正直言之士成帝咸和六年三月日食癸未詔舉賢良直言之士七年十一月壬子朔詔舉賢良傳郤詵泰始中舉賢良直言阮种為公府掾何曽舉种賢良時种與郤詵及東平士康俱居其上第夏侯湛泰始中舉賢良摰虞與湛等十七人䇿為下第武帝因詔賢良方正直言會東堂䇿問晉䇿試秀孝舉異行魏察孝亷列傳劉毅魏末郡察孝亷劉頌察孝亷舉秀才不就劉實郡察孝亷州舉秀才以計吏入洛李胤初仕上計掾舉孝亷許芝郡舉上計吏庾峻舉計掾武紀泰始四年六月甲申朔詔郡國守相士庶有好學篤道孝悌忠信清白異行者舉進之庾衮察孝亷舉秀才清白異行皆不降志世號為異行孔衍舉異行直言不就嵇虞溥曹毗杜軫察孝亷中舉杜夷三察孝亷潘京含舉秀才陳頵元康孝亷紀瞻郡察孝亷不行後舉秀才尚書郎陸機策之永康初州又舉寒素大司馬辟東閣祭酒王接永寧初舉秀才是嵗天下秀孝一皆不試除中郎阮种察孝亷為公府掾列傳華談太康中刺史嵇紹舉談秀才武帝親策之凡五問時九州秀孝策無逮談者除郎中本國中正鄧攸祖父殷有賜官敕攸受之太守勸攸去王官欲舉為孝亷攸曰先人所賜不可改也陳劭虞喜察舉不就通典元帝初詔揚州嵗舉秀孝二人諸州各一人不復策試既而申舊制皆令試經不中科者免刺史太守後莫敢應命太興三年尚書孔坦議請普延五嵗許其講習詔孝亷申至七年秀才如故太興初陳頵言晉江外初平故貢舉不試宜漸循舊試以經策又宜開舉武略任將率者舉十得一猶勝不舉才湘州刺史甘卓備禮舉桂陽谷儉為秀才諸州秀聞當考試皆憚不行唯儉一人到臺遂不復策試儉恥其州少士乃表求試以髙第除郎中華談守廬江舉寒族周訪孝亷宋制州秀才郡孝亷皆䇿試天子或親臨之隋志宋元嘉䇿孝秀文十卷梁有孝秀對䇿十二卷公卿所舉屬吏部銓用齊策秀才格文選有永明九年十一年天監三年策秀才文五問並得為上四三為中二為下一不合與第從駱宰之議也然不核才德梁天監初丹楊尹王志欲嵗首舉吉翂純孝揚州中正薦之敕太常旌舉元魏太和十七年正月臨思義殿策問秀孝太和初孫惠蔚郡舉孝亷對策中書省隋開皇中劉焯舉秀才射策甲科隋世重秀才天下不十人杜正倫一門三秀才皆髙第大業十一年五月詔舉郡孝悌亷潔各十人正大業末張行成察孝亷王績舉孝悌亷潔校祕書字岑文本郡舉秀才不應晉六條武紀魏咸熙二年十一月乙未令諸郡中正以六條舉淹滯一曰忠恪匪躬二曰孝敬盡禮三曰友于兄弟四曰潔身勞謙五曰信義可復六曰學以為已宋明帝泰始六年置總明觀祭酒一人有玄儒文史四科科置學士各十人隋舉賢良十科四科二科紀文帝開皇二年正月甲戌詔舉賢良十二月丙戌賜國子生經明者束帛十八年七月丙子詔以志行修謹清平幹濟二科舉人煬帝大業元年七月丙子詔國子等學具為課試法三年四月甲午詔十科舉人孝悌有聞德行敦厚節義可稱操履清潔強毅正直執憲不撓學業優敏文才美秀才堪將略膂力驍壯文武職事五品以上舉有一於此不必求備五年六月辛亥詔四科舉人學業才藝膂力絶倫堪理政事立性正直隋進士科紀文帝開皇七年正月乙未詔諸州嵗貢三人下制禁文筆之為浮詞者煬帝置進士科孝亷秀才猶有鄉舉里選諸侯貢士之遺法至煬帝始變之煬帝置進士科猶試䇿而已唐劉思立奏加雜文隋文帝罷州郡之辟廢鄉里之舉內外一命悉歸吏曹班列皆由執政隋試秀才選舉志杜正玄開皇十五年舉秀才試䇿髙第左僕射楊素志在試退正玄乃手題使擬司馬相如上林賦王褒聖主得賢臣頌班固燕然山銘張載劔閣銘白鸚鵡賦曰可至未時令就正玄及時並了素曰誠好秀才弟正藏十六年舉秀才時蘇威監選試擬賈誼過秦論及尚書湯誓匠人針連理木賦几賦弓銘應時並就南齊孔休源州舉秀才徐孝嗣省其䇿深善之唐取士令取士科選士法貢舉條目選舉志唐取士之科多因隋舊大要有三由學館曰生徒由州縣曰鄉貢其科之目有秀才明經俊士進士明法明字明算一史三史開元禮道舉童子明經之别有五經三經二經學究一經三禮三傳史科此嵗舉之常選也天子自詔曰制舉以待非常之才凡學六又有州縣學凡館二見上至於制舉內自京師外至州縣有司常選之士以時而舉天子又自詔四方德行才能文學之士又有武舉凡貢舉非其人者廢舉者校試不以實者皆有罰其教人取士著於令者大略如此有司選士之法因時增損不同大抵衆科之目進士為貴通典載貢舉非人之律又按令文科第云云見後百官志禮部掌貢舉之政六典令二十七篇十選舉十一考課漢功令顔師古注云若今選舉令通鑑廣德元年六月癸酉禮部侍郎楊綰請令縣令察孝亷上命諸司通議敕禮部具條目以聞綰又請置五經秀才科七月戊辰綰上貢舉條目秀才問經義二十條對䇿五道國子監舉人令博士薦於祭酒祭酒試通者升於省如鄉貢法明法委刑部考試或以為明經進士行已久不可改遂不行文粹舒元輿上書每嵗禮部格下天下未有不言察訪行實茍不如格抵罪舉主又於格中程之人數每嵗多者不出三十少或不滿二十欲詔有司按三代故事明修格文使入貢者皆茂行實不拘人數唐六科二科九科四科六典禮部尚書侍郎凡舉試之制每嵗仲冬率典計偕其科有六一曰秀才試方略䇿五條此科取人稍峻貞觀後遂絶二曰明經三曰進士四曰明法五曰書六曰算凡明經先帖經然後口試并答䇿進士先帖經然後試雜文及䇿島明法試律令丘明書試説文字林明算試九章海孫子五曹張建夏侯陽周髀五經綴術緝古凡此六科求人之本必取精究理實而升為第其弘文崇文館太學生雖同明經進士以資蔭髙試取粗通文義太廟郊社齊郎試兩經文義粗通補授考滿簡試國子監大成十員取明經及第人試日記千言并口試仍䇿所習業十條通七然後補各授散官令於學內習業以通四經為限通典初秀才科等最髙試方略策五條有上上上中上下中上凡四等貞觀中有舉而不第者坐其州長由是廢絶士族趨嚮唯明經進士二科而已開元二十四年以後復有秀才舉時以進士漸難而秀才本科無帖經雜文反易於進士主司以其科廢久不欲收奬應者多黜之三十年來無及第者至天寶初禮部侍郎韋陟始請令官長特薦其常年舉送並停顯慶二年劉祥道陳六事其五曰國家四十年未有秀才之舉請搜訪優奬不然斯舉遂絶按登科記永徽元年猶有秀才劉崟一人二年始停秀才舉復徐堅舉秀才及第與六典通典不同唐史韓思棣州刺史崔樞欲舉任敬臣秀才自以其學未廣遁去冀州欲舉張昌齡秀才以科廢久固辭更舉進士舊紀髙宗顯慶五年六月辛卯詔文武五品已上一本云詔內外官四科舉人孝悌德行經史儒術藻思詞鋒亷平強直肅宗乾元二年五月丁亥御宣政殿試文經邦國等四科舉人代宗大厯二年十月癸卯上御紫宸殿策試茂才異行安貧樂道孝悌力田髙道不仕等四科舉人六年四月丁巳御宣政殿試制舉人至夕策未成者令太官給燭俾盡其才宣宗大中十年三月中書門下奏據禮部貢院見置科目開元禮三禮三傳三史學究道舉明算童子等九科近年取人頗濫無實藝可採臣已于延英面論望起大中十年權三年滿後令有司據所舉人先進名令中書舍人重覆問其童子多年齒已過望令州府薦送須實年十一二已下精熟一經從之陸贄傳説黜陟使以三科登俊乂茂異賢良幹蠱白居易集自貞元已來用三科取士詳明政術可以理人其一也儒學傳序自楊綰鄭餘慶鄭覃等以大儒輔政議優學科先經義黜進士後文辭亦未能克也舉遺逸崔圓開元中詔舉遺逸建中初黜陟使趙贊薦袁滋起處士授校書郎韋夏卿薦處士竇羣德宗擢拾遺慶元和初徵李渤源德宗聘孔述睿長二年七月徵李舉宗室異能李麟舉宗室異能轉殿中侍御史舉將帥王仁皎景龍中以將帥舉授甘泉府果毅詔馬燧父季龍舉孫吳周黨善兵法科薦天寶初舉智謀果決才堪統衆者拾遺張鎬來瑱唐明經舉明經著令志明經之别有五經三經二經學究一經三禮三傳禮記春秋左氏傳為大經詩周禮儀禮為中經易尚書春秋公榖傳為小經先帖文然後口試經問大義十條答時務策三道亦為四等孔穎逹傳隋大業初舉明經髙第髙祖詔諸州明經秀才俊士進士明於理體為鄉里稱者縣考試州長重覆嵗隨方物入貢通鑑武德七年二月己酉詔諸州有明一經已上未仕者咸以名聞士通典明經進士二科其初止試策貞觀八年詔加進試讀經史一部會要貞觀九年五月二日敕明經兼習周禮儀禮者減一選上元二年會要正月十四日明經加試老子策二條進士三條會要儀鳯三年五月詔道德孝經為上經須兼通餘經及論語依恆式永隆二年考功員外郎劉思立建言明經多抄義條進士唯誦舊策皆亡實才而有司以人數充第乃詔自今明經試帖粗十得六以上進士試雜文二篇通文律者然後試策通典調露二年考功員外郎劉思立始奏二科並加帖經其後又加老子孝經使兼通之至永淳二年三月詔並試策三道開元五年會要九月八日始令鄉貢明經進士見訖國子監謁先師學官開講問義有司具食五品以上官及朝集使皆往閲禮會要開元八年七月九日司業李元瓘言禮記文少人皆競讀周禮儀禮公榖四經殆絶請習四經者帖十通五許其入策十六年十二月二十四日祭酒楊瑒奏有司帖試明經不質大義乃取年頭月尾孤經絶句且今習春秋三家儀禮者才十二恐諸家廢無日請帖平文以存學家其能通者稍加優宦奬孤學因詔習四經出身者不任散官遂著令生徒為瑒立頌太學門兼本傳十七年三月丙辰有司考功奏限明經進士及第每年不過百人瑒上言流外出身嵗二千餘人而明經進士不能居什一是服勤道業之士不如胥吏之得仕也二十一年注老子成正月一日詔天下家藏其書貢舉人減尚書論語䇿而加試老子二十五年二月二十二日詔今之明經進士則古之孝亷秀才近進士以聲韻為學多昧古今明經以帖誦為功罕窮旨趣每經宜帖十取通五以上免舊試一帖問大義十條取六以上免試經䇿十條答時務䇿十道進士停小經準明經帖大經十帖取通四以上試雜文及䇿明經有通五經進士精通一史試䇿十條得六以上奏聼進止因侍郎姚奕奏然六典注云帖經通五以上後口試天寶元年四月三日加爾雅代道德經十二載六月八日禮部奏帖經既前後出一行十一載十二月十三日敕加至通六貞元元年四月十一日習道德經以代爾雅十二年三月十七日司業裴肅奏依前加爾雅志詔明經習律以代爾雅元和二年十二月明經停口義復試墨義十條五經取通五明經通六七年十二月侍郎韋貫之奏停墨義依舊格問口義開成四年十月詔每嵗明經第增十人儒學傳玄宗詔羣臣及府郡舉通經士通典按令文科第秀才與明經同為四等進士與明法同為二等然秀才之科久廢而明經雖有甲乙丙丁四科進士有甲乙二科自武德以來明經雖有丁第進士唯乙科而已其進士大抵千人得第者百一二明經倍之得第者十一二其制詔舉人不有常科皆標其名而搜揚之試之日或在殿庭天子親臨觀之試已糊其名於中考之文䇿髙者授美官其次與出身開元後應詔舉者多則二千人少猶不減千人所收百才有一會要貞元十八年五月敕明經不得過百人進士不過二十人無其人不必充數楊瑒上言唐興二監舉者千百數當選者十之二考功覆校以第謂經明行修故無多少之限李絳曰進士明經大抵百人吏部得官至千人私謂為同年韓愈曰天下以明經舉於禮部者嵗至三千人始自縣考試升於州府州府又考試之定其可舉者貢於天子謂之鄉貢有司總州府所升考試之第其可進者以名上於天子屬之吏部嵗不及二百人謂之出身權德輿知貢舉三嵗所得士繼為公卿取明經不限員李珏舉明經李絳以明經碌碌非所宜更舉進士張知譽兄弟五人俱髙第王彥威崔良佐明經中甲科明經為名相者裴行儉裴炎狄仁傑敬暉崔玄暐杜景佺賈耽盧邁杜暹董晉徐有功盧仁願裴漼諝胄陳子昻王義方玄感賈至李傑許孟容裴子餘尹思貞褚無量王彥威丁公著韋綬叔夏歸崇敬穆寧崔衍良佐皆為明臣五經張嘉貞馮伉韋丹鄭欽説殷侑兩經韋溫唐進士舉科目記科第覽志進士試詩賦時務䇿五道帖一大經經䇿全通為甲第䇿通四帖過以上為乙第大抵衆科之目進士為尤貴而得人亦最盛方其取以辭章類若浮文而少實及其臨事設施奮其事業隱然為國名臣者不可勝數遂使時君篤意以謂莫此之尚及後世俗益偷薄上下交疑因以謂按其聲病可以為有司之責捨是則汗漫而無所守遂不復能易嗚呼乃知三代鄉里德行之舉非至治之隆莫之能行也寶應二年禮部侍郎楊綰上疏言通監廣德元年六月癸酉綰上疏七月方改元進士科起隋大業中時猶試䇿髙宗朝劉思立奏加進士雜文明經填帖故進士皆從當代之文不通經史明經但記帖括又投牒自舉請依古察孝亷其明經進士及道舉並停詔李栖筠李廙賈至嚴武議栖筠等議自晉室之亂南北分裂人多僑處欲復古鄉舉里選頗恐未盡請兼廣學校十道大郡置大學館遣博士出外以教生徒保桑梓者鄉里舉焉在流寓者庠序推焉乃詔明經進士與孝亷兼行先是進士試詩賦及時務䇿五道貞觀八年三月三日進士加讀經史一部明經䇿三道建中二年十二月中書舍人趙贊知貢舉乃以針論表贊代詩賦而皆試䇿三道太和八年禮部復罷進士議論而試詩賦文宗從內出題以試進士謂侍臣曰吾患文格浮薄昨自出題所試差勝按髙錯本傳云開成元年二月癸未宰臣奏事紫宸殿帝曰云云乃詔禮部嵗舉登第者三十人茍無其人不必充其數是時文宗好學嗜古鄭覃以經術位宰相深嫉進士浮薄屢請罷之文宗曰敦厚浮薄色色有之進士科取人二百年矣不可遽廢因得不罷通鑑太和七年李德裕請依楊綰議進士試論議不試詩賦八月庚寅停試詩賦禮部奏先試帖經略問大義次試議論一首大義以通二通四為格明年後並依此例八年十月乙巳貢院奏進士復試詩賦從之武宗即位宰相李德裕尤惡進士罷期集參謁曲江會題名嘗曰臣無名第不當非進士臣祖天寶永以仕進無他岐勉強隨計一舉登第自後家不置文選蓋惡其不根藝實然朝廷官須公卿子弟為之何者少習其業目熟朝廷事臺閣之儀不教而自成寒士縱有出人之才固不能間習也則子弟未易可輕德裕之論偏異如此然進士科當唐之晚節尤為浮薄世所共患也會要貞觀八年三月三日詔進士試讀一部經史二十二年九月考功員外郎師旦言張昌齡王公瑾體性輕薄文章浮豔擢之恐後生相效後並如其言調露二年四月考功員外郎劉思立請帖經及試雜文先時但試䇿永淳二年三月詔舉人並試䇿三道開元二十四年十月侍郎姚奕請進士帖左氏傳禮記通五及第官志天寶九載置廣文館有知進士助教栁文每嵗偕計吏而造有司者僅半孔徒之數春官擢甲乙而升司徒者於孔氏髙第亦再倍焉宋朝李淑曰唐調露二年劉思立以進士止試䇿不盡其學請帖經以觀其學試雜文以觀其才自此沿以為常永隆二年試雜文二篇通文律者始試䇿天寶十一年試一大經能通者試文賦又通而後試䇿五條皆通為中第建中二年趙贊請試以時務䇿五篇針論表贊各一篇以代詩賦大和三年試帖經略問大義取精通者次試論議各一篇八年禮部試以帖經口義次試䇿五篇問經義者三時務者二厥後變易遂以詩賦為第一場論二䇿三帖經第四場會要大中十年四月侍郎知舉鄭皓進諸家科目記十三卷東觀奏記曰武德至大中敕付翰林自今放榜後寫及第姓名及所試詩賦題進入每嵗編次藝文志崔氏失名顯慶登科記五卷姚康科第録十六卷長慶二年五月十二日敘曰自武德已來登科名氏編紀凡十餘家皆不備具康録武德至長慶二年列為十三卷漢元帝詔云嵗以此科第郎從官遂題為科第録五自三年畢天祐丙寅續為卷合十六卷李奕唐登科記二卷三家二十三卷文場盛事一卷中興書目崔氏登科記一卷載進士諸科姓名貞元十七年三月丁亥校書郎趙傪序曰武德五年詔有司特以進士為選士之目仍古道也周顓載進士續之者自元和方列制科起武德五年迄顯德六年崇文總目有樂史修定四十卷今亡選雍熙三年正月樂史上登科記三十二卷唐登科文五十卷貢舉事題解各二十卷以為著作郎直史館紹興三十年十月洪適重編唐登科記為十五卷一以姚氏為正天寶後則以三本合為一書目諱行録一卷以四聲編進士族系名字行第宦秩及父祖之諱主司名氏起興元元年盡大中七年宋敏求撰諱行後録五卷文場盛事一卷所載皆唐人世取科第及父子兄弟門生座主同時者五代登科記一卷起梁開平二年至周顯德六年姓名及試題薛登曰方今舉士詔下陳篇希恩奏記誓報俗號舉人皆稱覔舉禮部采名譽觀素學故預投公卷桞宗元上權德輿溫卷後周竇儀請進士省卷納五軸以上栁宗元貞元得進士第上問有司曰得無以朝士子冒進者乎有司以聞上曰是抗姦臣者吾知其不為子求舉矣韓愈送齊皥序兄為相出藩朝之碩臣皆舊交有司連枉齊生王參元家積貨士之好廉名者不道其善白居易性習相近遠賦獨孤授放馴象賦皆當時試禮部對偶之外意義可觀唐俊士志唐取士之科有俊士開元七年敕通一經有文辭史學者入四門學為俊士六典注梁武帝欲招來後進五館生皆引寒門俊才即今之俊士也隋志同會要開元二十一年五月敕州縣學生年二十五以下八品子若庶人二十一以下通一經及未通經而聰悟有文辭史學者入四門學為俊士即諸州貢舉省試不第願入學者亦聼百官志見四門學唐制舉制舉科目圖茂才志天子自詔者曰制舉所以待非常之才其所由來逺矣自漢以來天子常稱制詔道其所欲問而親䇿之唐興天子自詔四方德行才能文學之士或髙蹈幽隱與其不能自逹者下至軍謀將略翹關拔山絶藝竒技莫不兼取其為名目隨其人主臨時所欲而列為定科者如賢良方正直言極諌博通墳典逹於教化軍謀宏逺堪任將帥詳明政術可以理人之類其名最著而天子巡狩行幸封禪太山梁父往往會見行在所以待之之禮甚優而宏材偉論非常之人亦時出於其間不為無得也會要兼實録永隆元年一云調露元年十二月五日御武成殿問嶽牧舉人員半千對載初元年䇿問貢人于洛城殿開元八年三月一云九年四月甲戌上親䇿試於含元殿謂曰古有三道今減從一道令有司設食舊紀云古有三䇿今減二䇿近無甲科朕將存其上第十四年七月御洛城門試應嶽牧舉二十五人孫逖傳開元十年舉賢良方正玄宗御洛城門引見命蘇晉等第其文異等天寶十三載十月一日御勤政樓試四科舉人問䇿外更試詩賦制舉試詩賦自此始乾元二年御宣政殿試四科舉人五月丁亥制舉科以賢良方正及第者在神龍三年則有蘇晉等五人以直言極諌及第者在開元二年則有梁升卿等二人以賢良方正能直言極諌及第者建中元年薑公輔等四人貞元元年韋執誼等十四人四年崔元翰等十五人十年裴垍等十四人元和三年牛僧孺等十一人長慶元年龐嚴等十一人寶厯元年唐伸等十六人大和二年李郃等十九人以博通墳典逹於政化登第者貞元元年熊執易等二人十年朱穎一人元和三年馮苞等二人長慶元年李思元一人以軍謀宏逺材任將帥及第者元和三年樊宗師一人樊宗師三世以軍謀堪將帥䇿上第長慶二年吳思等二人寶厯元年裴儔等二人太和二年鄭冠等二人以詳明政術可以理人及第者貞元十年張平叔等二人長慶元年崔郢志烈秋霜韓思彥幽素科蘇瓌辭殫文律崔融文藝優長韓琬絶倫科蘇頲盧從願材堪經邦張九齡文經邦國韓休韓休傳舉賢良元宗在東宫令條對國政與趙冬曦俱乙科道侔伊吕張九齡哲人竒士隱淪屠釣孫逖智謀將帥崔圓三人文辭秀逸顔真卿二人辭藻宏麗楊綰綰舉詞藻宏麗科玄宗已試又加詩賦各一篇綰為冠制舉加詩賦由綰始文辭雅麗苗晉卿四人諷諌主文鄭珣瑜二人文辭清麗吳通玄奚陟梁肅六人王緒舉草澤文辭清麗科嶽牧員半千永隆元年辭標文苑房晉三人垂拱四年文藻儒素彭景直李文願二人徇節寧邦薛稷二人長才廣度張漪拔萃科崔翹二人疾惡科馮萬石龔黃科馬克麾才膺管樂科盧絢九人才髙位下馮萬石三人抱器懷能夏侯銛藏名負俗李俊之藻思清萃趙冬曦手筆俊拔杜昱七人良才異等崔翹二人文史兼優康子元三人博學通議蕭誠二人博學宏辭開元十九年鄭昉陶翰才識兼茂明於體用元和元年元稹獨孤郁白居易等十六人孝悌力田建中元年郭黃中三人貞元四年張皓自志烈秋霜而下凡五十九科自顯慶三年至大和二年及第者二百七十人有一人中數科者員半千陸元方崔融陽嶠舉八科皆中張鷟應下筆成章等七科皆中裴守真六科連中李懷逺擢四科孫逖中四科開元十年逖舉賢良方正玄宗第其文異等席豫中三科學兼流略詞擅文場手筆俊拔崔圓韓思彥琬中二科圓開元中詔舉遺逸以鈐謀對䇿甲科栁公綽舉賢良方正直言極諌間一嵗再登其科張柬之永昌元年賢良第一時對䇿者千餘歸崇敬天寶中舉博通墳典科對䇿第一詔舉才可宰百里者復䇿髙第房琯舉任縣令科韋處厚擢才識兼茂科賢良方正異等裴度以宏辭補校書郎舉賢良方正鄭亞舉進士賢良拔萃三中其科楊仲昌元稹對䇿第一白居易制䇿乙等韋吕元膺賢良髙第韓臯異等夏卿大厯中髙等牛僧孺以賢良對䇿與李宗閔皇甫湜俱一等楊於陵程其文劉蕡對䇿過古朝董第䇿官馮宿等畏中官不敢取鮑防傳貞元元年䇿賢良得穆質裴復栁公綽歸登崔邠韋純等世美防知人劉夢得云皇唐文物與漢同風張説九齡薑公輔裴垍元稹韋處厚牛僧孺咸用對䇿甲天下繼為有聲宰相古今相望磊落如騎星辰天寶中王翃治兵家擢才兼文武科解琬中幽素科髙適舉有道科舊紀貞觀十一年四月丙寅詔舉孝悌敦篤儒術該通文辭秀美明識政體志行修立者給傳詣洛陽宫十五年六月戊申詔舉學綜古今孝悌敦篤文章秀異者以來年二月集泰山中興書目唐制舉科目圖一卷鄭元翰撰武德初崔仁師擢制舉張行成代計吏集京師擢制舉一科貞觀初謝偃應詔對策髙第永昌中武后䇿賢良方正詔吏書李景諶糊名較覆張説所對第一后置乙等授太子校書郎大和四年正月詔賢良方正詳間吏理等科令常參官牧守各舉所知草澤聽自舉徐楚璧初應制舉三登甲科大厯六年四月親試諷諌主文等科孔昌宇貞觀中對䇿髙第開元二年六月甲子制茂才異等咸令自舉是年設直言極諫科韓琬舉茂才名動里中刺史行鄉飲餞之主人揚觶曰孝于家忠于國今始充賦請行無算爵儒林榮之擢第又舉文藝優長賢良方正連中許景先舉手筆俊拔茂才異等李乂茂才異等高郢舉茂才異行高第殷踐猷文儒異等科唐鄉貢禮部選士志舉選不繇館學者謂之鄉貢皆懷牒自列於州縣試已長吏以鄉飲酒禮會屬僚設賔主陳爼豆備管絃牲用少牢歌鹿鳴之詩既至省皆疏名結欵通保由户部集閲而關于考功員外郎試之太宗時冀州進士張昌齡王公謹有名當時考功員外郎王師旦不奏以第帝問其故曰二人文采浮華擢之將誘後生弊風俗會要正觀二十二年九月師旦知舉玄宗開元五年九月八日始令鄉貢明經進士見訖國子監謁先師學官開講問義有司具食清資五品以上官及朝集使往閲禮二十四年考功郎李昻登科記作李昴為舉人詆訶帝以員外郎望輕三月十二日舊紀三月乙未移貢舉於禮部以侍郎主之禮部選士自此始二十五年丁丑始命侍郎姚奕興舉舉人舊重兩監後世祿者以京兆同華為榮而不入學天寶十二載七月十三日敕天下罷鄉貢舉人不由國子及郡縣學者勿舉送十四載復鄉貢會要至德元年以後依前鄉貢天授二年右補闕薛登謙光上疏曰古之取士考素行之原詢鄉邑之譽以計貢賢愚為州之榮辱是以李陵降而隴西慙段干隱而西河美魏取放達晉先門閥梁陳尚詞賦隋置進士等科後生緝綴小文名曰䇿學願降明制收實用文試效官武閲守禦長壽二年十月劉承慶請貢人元日列方物之前以備充庭之禮制可寶應二年楊綰以進士不鄉舉但試詞賦浮文非實請置五經秀才科詔羣臣議賈至議以為鄉舉取人未盡請廣學校元和中舒元輿舉進士見有司鈎校苛切上書言宰相公卿繇此出而有司以隸人待之非下賢意羅棘遮截疑其姦非所以求忠直詩賦微藝斷離經傳非所以觀人文化成也又言取士不宜限數今多者三十少止二十假令嵗有百元凱而吾格取二十謂求賢可乎嵗有才德才數人而曰必取二十謬進乃過半謂合格可乎考功異時多請託進者濫冒嵗數百人開元初員外郎王丘務核實材登科才滿百議者謂自武后至是數十年采録精明無丘比其後席豫嚴挺之亦有稱然出丘下調露初考功郎騫味道見張鷟對稱天下無雙故事取人以一日試定髙下開元中侍郎韋陟許自通所工先就其能試之已乃程考由是無遺才乾元初侍郎李揆患取士不考實徒露搜索禁所挾乃大陳書廷中人人稱美髙郢司貢部三嵗絶請謁抑浮華韋貫之抑浮華先行實常奏禮部侍郎重於宰相貞元中權德輿奉詔定賢良升名士十七人及為禮部侍郎擢第者七十有三鸞鳯杞梓舉集其門登輔相之位者前後十人栁宗元上權德輿溫卷開成元年髙鍇權知貢舉文宗自以題卑有司鍇以籍上帝曰比年文章卑弱今所上差勝於前即以為禮部侍郎閲三嵗頗得才實始嵗取四十人才益少詔減十人猶不能滿會要太和四年格不得過二十五人九年十二月加至四十人開成元年二年三年並鍇知舉恩賜題目及第者四十人二年令狐綯奬譽李商隱擢第李宗閔以舍人典貢舉所取多名士世謂玉筍杜牧曰自房梁公已降有大功立大節率多科第人武宗患選士不得才命王起以左僕射典舉凡四舉士皆知名者貢舉以禮部侍郎專焉或以它官領者多用中書舍人及諸司四品官惟會昌中命太常卿王起乃檢校僕射志初舉人既及第綴行通名詣主司第謝其制序立西階下北上東向主人席東階下西向諸生拜主司答拜乃敘齒謝恩遂升階與公卿觀者皆坐酒數行約赴期集又有曲江會題名席李德裕奏國家設科取士而附黨背公自為門生自今一見有司而止其期集參謁曲江題名皆罷唐考功别試兩都試兩都舉選志禮部侍郎親故移試考功謂之别頭一本云開元二十九年十一月九日侍郎韋陟奏掌舉官親族皆本司郎官考試事在嫌疑請移送考功試侍郎覆定從之貞元十六年中書舍人髙郢奏罷議者是之貞元十六年舍人髙郢掌貢舉奏停别試議者是之傳會要十二月敕罷别頭試齊抗謂抗為相時奏罷元和十三年權知禮部侍郎庾承宣奏復考功别頭試十月庾承宣請復考功别頭試太和三年考功員外郎髙鍇取士有不當監察御史姚中立又奏停考别頭試六年侍郎賈餗又奏復之志廣德二年侍郎賈至言嵗方囏歉舉人赴省者兩都試之兩都試人自此始會要永泰元年七月始置兩都貢舉侍郎以知兩都為名兩地别放及第大厯十一年停東都貢舉是後不置十年五月十九日敕今年舉人悉赴上都準舊例十月二十五日隨考使到户部太和元年七月權於東都置舉其上都國子監舉人試如故吳武陵傳太和初侍郎崔郾試進士東都公卿祖道武陵曰君方為天子求竒才敢犬所益因出杜牧所賦阿房宫武陵請曰牧方試有司請以第一人處之郾謝已得人至第五牧果異等會要會昌三年三月中書門下奏舉人不許於兩府取解並試于兩都國子監大中元年六月於京兆河南集試如舊條令孤楚貢進士京兆尹將薦為第一遜許正倫而下之舊紀廣德二年九月己未左丞楊綰知東京選禮部侍郎賈至知東都舉兩都分舉選自至始也大厯十五年五月癸卯罷兩都貢舉都集上都唐覆試志兼列傳會要髙祖詔諸州明經秀才俊士進士縣考試州長重覆嵗隨方物入貢崔沔舉賢良方正髙第不中者誦訾之武后敕有司覆試對益工遂為第一開元中二十五年二月二十二日侍郎姚奕奏詔禮部考試畢通典云進士唱第訖所試雜文及策送中書門下詳覆其後中廢建中三年四月詔及第者送名中書門下重加考核長慶元年侍郎錢徽所舉送覆試多不中選由是貶官而舉人雜文復送中書門下志云元和十三年徽典舉李宗閔傳云長慶初當從傳會要元年三月丁未詔鄭朗等重試孤竹管賦不知其事今後雜文及䇿先送中書門下詳覆四月丁丑黜朗等十人溫業等二人粗通與及第而段文昌奏徽取士以私詔白居易王起覆試黜者過半三年正月侍郎王起言故事已放榜而始詳覆今請先詳覆而後放榜議者謂起避嫌失職大和七年八月敕弘文崇文兩館生齋郎依令式試經畢差都省郎官兩人覆試太和八年正月王涯謂禮部取士先以榜示中書非至公之道自今一委有司會昌四年二月王起選士三十人而世胄五人獨收楊嚴五年二月知舉陳商放及第二十七人三月學士白敏中重覆黜七人大中元年正月侍郎魏扶取二十三人奏封彥卿崔瑑鄭延休三人貴胄不敢取以詩賦封進學士韋琮考之中程二十三日並放及第詔有司不得别奏鄭畋舉進士年甚少有司上第籍武宗疑索所試自省乃可唐舉孝廉舊紀貞觀十七年五月乙丑手詔舉孝亷茂才異能之士會要貞觀十八年三月六日引汴鄭諸州所舉孝亷賜坐於御前問以皇王政術及皇太子問以曽參説孝經並不能答寶應二年即廣德元年六月二十日癸酉禮部侍郎楊綰奏請依古察孝亷乃詔明經進士與孝亷兼行志同議綰傳建復古孝亷力田等科天下髙其賈至傳綰建請依古制縣令舉孝亷于刺史升天子禮部詔有司參議多是綰言至議以為鄉舉取士未盡請廣學校建中元年六月九日敕停孝亷科列傳任敬臣舉孝亷授著作局正字韋虛心舉孝亷歸登大厯中舉孝亷髙第韋純舉孝亷韋綬舉孝亷又貢進士禮部侍郎潘炎將以為舉首遜于楊凝唐明法書學算學見學校志凡明法試律七條令三條六典云每部十帖䇿十條律七條令三條全通為甲第通八為乙第李朝隱中第擢至大理丞會要貞元二年六月敕明法能兼習小經帖義通者比明經會昌二年十月委中書門下精擇法官御史三人以上取法官一人文明元年四月敕內外官以當司格式書于廳壁會昌四年七月大理卿劉濛於寺廳粉壁重寫令式及格後敕漢鄭崇父賔以明律令為御史薛宣以明習文法補御史中丞漢官曰大司農市長一人明法補員吏三十六人唐道舉志開元二十九年會要二十五年正月十五日置崇玄學習老莊文列亦曰道舉通典二十九年始於京師置崇玄館諸州置道學生徒有差謂之道舉舉送課試與明經同天寶十二載道舉停老子加周易寶應二年六月二十六日停道舉列傳康子元開元初詔張説舉治易老莊者侯行果薦子元於説説以聞得侍讀元載天寶初舉明莊老列文四子學者載䇿入髙第開元二十九年御興慶門親試明四子人姚子彥元載等獨孤及天寶末道舉髙第楊綰清停道舉唐武舉志武后長安二年正月十七日乙酉始置武舉每年準明經進士例送其制有長垜馬射步射平射筒射又有馬槍翹關負重身材之選翹關長丈七尺徑三寸半凡十舉後手持關距出處無過一尺負重者負米五斛行二十步皆為中第亦以鄉飲酒禮送兵部選用之法不足道故不復書六典兵部員外郎掌貢舉有二科一曰平射二曰武舉其試用有七曰射長垜騎射馬槍步射材貌言語舉動其髙第奏聞會要兼通典武舉每嵗孟冬亦與計偕有二科云云開元十九年詔武貢人與明經進士同行鄉飲酒禮二十六年十一月十四日敕武貢以求才實比委郎官未稱其事今後令侍郎知武舉天寶元年十月三日敕長垜限以十箭六載正月制鄉貢武舉人上省先謁太公廟每拜大將及行師克捷告廟武舉每嵗不過十人貞元十四年九月癸酉停鄉貢武舉諫議田厚奏挾持弓矢出入皇城間非所宜故停之元和三年五月壬辰兵部奏取士之方文武並用請復置武舉從之傳薛登上疏願收實用試守禦吳子曰一劍之任非將事也諸葛亮臨戎不親戎服此豈弓矢之用也王仁皎景隆中以將帥舉授甘泉府果毅郭子儀以武舉異等補左衛長史後平兩京再造王室漢邉弗靖勇略始求士不素養孰同其憂唐以翹關用舉武士雖號得人教養弗至唐開元禮舉三禮舉志取士科目有開元禮凡開元禮通大義百條䇿三道者超資與官義通七十䇿通二者及第散試官能通者依正員明經有三禮辛袐登開元禮科授博士會要貞元二年六月十一日敕舉人有習開元禮者同一經例選人不限選數許集問通大義百條䇿三道者超資與官義通七十䇿通二者不在放限九年五月二日敕通文義百條䇿三道者為上等大義通八十䇿通二者為次等元和八年四月吏部奏習開元禮者先授太常寺官以備講討從之貞元五年五月二日敕試三禮者問大義三十條試䇿三道全通為上大義通二十五䇿通二為次貞觀五年五月二日敕明經兼習周禮儀禮者減一選蘇晉傳舉大禮科上第登科記貞元五年始有開元禮一人殷侑及五經第學長於禮補王彥威明經甲科淹識古今典禮檢討官多歸崇敬治禮家學識容典擢明經韓愈送陳密序將易其業而三禮後周廣順三年八月開元禮三史各對義三百道唐三傳科史科志科目有一史三史明經之别有三傳史科凡三傳科左氏傳問大義五十條公羊榖梁傳三十條䇿皆三道義通七以上䇿通二以上為第凡史科每史問大義百條䇿三道義通七䇿通二以上為第能通一史者白身視五經三傳有出身及前資官視學究一經三史皆通者奬擢之長慶三年會要二年二月舊紀三年二月諌議大夫殷侑言司馬遷班固范曄三史為書勸善懲惡亞於六經比來史學廢至有身處班列而朝廷舊章莫能知者於是立史科舊紀云三史科及三傳科會要侑請置三傳科又請置史科每史問大義百條從之景雲元年十二月十一日制習五經綜一史通三教善六書傳雅曲學孫吳善敷奏者吏部明試二年王楚玉等八人以一史中第三史科至相者一人朱朴以史舉宋朝李維清開寶中以三史解褐後唐劉熙古長興中舉三傳唐童子科志童子科十嵗以下能通一經及孝經論語誦文十通者豫官通七者與出身會要廣德二年五月庚申停童子嵗貢禮部侍郎楊綰奏罷之大厯三年三月敕童子舉取十嵗已下者十年五月癸卯停開成三年詔不得更有聞薦而以童子為薦者比比有之大中十三年三月中書門下奏科目內開元禮三禮三傳三史學究道舉明算童子等九科近年取人頗濫望權停三年後赴試者先進名中書舍人重覆其童子須實年十一二以下精熟一經從之列傳員半千晉州舉對詔髙第裴耀卿數嵗能屬文擢童子舉王丘十一擢童子科他童皆專經而獨屬文員淑九嵗詞辨注射李泌竒童楊炯舉神童吳通玄舉神童徐齊𣆀八嵗能屬文太宗召試吕方毅七嵗能誦經太宗召見賜束帛劉晏玄宗封泰山八嵗獻頌漢左雄奏汝南謝亷河南趙建年十二能通經拜童子郎臧洪年十五拜童子郎黃琬以公孫拜童子郎司馬伯逹年十二試經為童子郎梁岑之敬年十六䇿春秋左氏制旨孝經義擢髙第召入簡試除童子奉車郎天監七年九月壬辰置童子奉車郎庾質八嵗誦十賦拜奉車郎唐殿試詳見九科志載初元年二月辛酉䇿問貢士于洛城殿殿試人自此始髙宗永隆元年試武成殿宋朝富弼言後漢文吏課箋奏副之端門亦未聞天子親試也唐武后載初年始有殿試此何足法唐宗室監舉志中宗詔宗室業成堪貢者宗正寺試送監舉如常法漢宗正有郡國嵗計上籍之文劉向以高材進對唐宗正寺嵗送進士二十人與國子監京兆府相比李程李肱皆為舉首唐國子大成志上元二年國子監置大成二十人取已及第而聰明者為之六典大成初置二十人開元二十年減十人通四經業成上吏部試登第者加一階放選不第習業如初三年一試九年無成免從常調注見六科尹思貞傳左右史張説尹元凱薦為國子大成唐國子舉韋知人傳以國子舉授校書郎會要開元二十六年正月八日詔弘文崇文生貴胄子孫不專經業自今依令式考試廣德元年七月二十六日敕經業務須精熟字體皆得正樣通七者與出身不通者罷志開元七年令弘文崇文國子生季一朝參貞元中弘文崇文生未補者務取員闕以補速於登第而用蔭乖實至有假市門資變易昭穆及假人試藝者六年詔宜據式考試假代者論如法弘文生徐齊𣆀裴行儉房琯韓洄崔植楊仲昌通經為修文生許孟容傳公主求補崇文生會要云兩館生孟容為禮部員外郎謂不可帝問狀以著令對德宗嘉其守通典垂拱元年七月魏玄同上疏言選舉曰弘文崇賢之生課試既淺藝能亦薄胄子必裁諸學少則受業長而出仕少仕則廢學輕試則無才又勳官三衛流外之徒不待州縣之舉直取於書判非先德後言之誼志中宗詔宗室三等以下五等以上未出身願宿衛及任國子生聽之其家居業成而堪貢者宗正寺試送監舉如常法唐孝悌力田科見制科會要開元二十六年正月敕孝悌力田風化之本比同舉人考試辭䇿其狀迹殊尤者令長官特薦不隨考使例送寶應元年五月詔刺史薦孝悌力田二年七月又詔本州以名薦廣德二年五月二十四日庚申敕孝悌力田嵗貢宜停禮部侍郎楊綰奏罷大厯元年十二月詔孝悌力田未經薦用者長官以名聞貞元四年又詔楊綰傳建復古孝亷力田等科與會要不同蘇瓌傳左庶子張大安表舉孝悌閻朝隱傳中孝悌亷讓科神龍元年九月舉孝友傳序以孝悌名通朝廷者多閭巷之民皆得書于史官唐龍虎榜歐陽詹傳晉江人與韓愈李觀崔羣王涯馮宿庾承宣聨第皆天下選時稱龍虎榜時貞元八年侍郎陸贄典舉進士二十三人明水賦崔羣傳未冠舉進士陸贄主貢舉梁肅薦有公輔才擢甲科韓愈曰陸公司貢士所與及第皆赫然有聲由梁肅王礎佐之梁舉八人無失者餘則王與謀焉唐舉自代通鑑肅宗上元二年九月制除五品以上官令舉一人自代會要建中元年正月五日敕常參官及刺史授上後三日內舉一人以自代見韓文玉海卷一百十五
