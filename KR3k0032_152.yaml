body:
  text: 玉海卷一百五十二宋王應麟撰朝貢外夷來朝內附先王襲冠帶以辨諸華限要荒以殊遐裔區分中外其來尚矣夷狄戎蠻繁種落異君長遇有道則時遵聲教際衰世則爭肆虔劉但當修文德以來之擇信臣以撫之謹邊備以防之庶得其道也商遠夷來獻殷武箋成湯之時氐羌遠夷之國來獻來見曰商王是吾常君殷逺方重譯家語五儀解殷王大戊側身思行明養民之道三年之後逺方慕義重譯至者十有六國書正義皇甫謐云大戊問於伊陟云云修先王之政三年而逺方重譯而至七十六國周象胥舌人秋官象胥每翟上士一中士二下士八徒二十人注通夷狄之言者曰象胥其有才知者也此類之本名東方曰寄南方曰象西方曰狄鞮北方曰譯今總名曰象者周之德先致南方也掌蠻夷閩貉戎狄之國使掌傳王之言而諭説焉以和親之以時入賔則協其禮與其辭言傳之大行人七歲屬象胥諭言語協辭命注司農云象胥譯官也玄謂胥讀為諝諝謂象之有才知者王制東方曰寄南方曰象西方曰狄鞮北方曰譯此官為象者周始有越重譯而來獻是因通言語之官為象胥云杜業曰周封八百重譯來賀重尚書大傳成王時越裳氏九譯而獻白雉職方氏辨四夷八蠻七閩九貉五戎六狄之人民注周之所服國數也爾雅九夷八蠻六戎五狄謂之四海蠻詩序注九夷八狄七戎六蠻樂旅獒通道于九夷八王制正義夷有九曰玄莵浪高驪蒲飾鳬臾索家東屠倭人天鄙蠻有八曰天竺咳首僬僥跂踵穿胸儋耳狗軹旁春戎有六曰僥夷戎夷老白耆羌鼻息天剛狄有五曰月支穢貉胸奴單于白屋周語使舌人體委與之注舌人能達異方之志象胥之官也漢志象來致福注象譯也周王會湯四方獻令汲冡周書王會解第五十九晉孔朝注序周室既寧八方會同各以其職來獻欲垂法厥世作王會成周之會一作成王唐顔師古曰武王時注王城既成大會諸侯及四夷也墠上張赤帟隂羽隂鶴也以羽飾帳也除地白墠帟帳也天子南面立絻無繁露朝服八十物搢珽繁露絻之所垂也所尊敬則有馬八十物大小所服搢插也珽似笏唐叔荀叔周公在左太公望在右皆絻亦無繁露朝服七十物搢笏旁天子而立於堂上唐荀國名皆成王弟故曰叔旁謂差在後也近天子故冕亦無旒堂下之左唐公虞公南面立焉堯舜後也堂下之右殷公夏公立焉杞宋皆南面絻有繁露朝服五十物皆搢笏為諸侯之有疾病者阼階之南祝淮氏榮氏次之圭瓉次之皆西面彌宗旁之淮榮二祝之氏彌宗官名次圭瓉南差在後相者太史魚大行人皆朝服有繁露魚太史名及大行人皆讃相賔客禮儀堂下之東面郭叔掌為天子菉幣焉絻有繁露郭叔虢叔文王弟菉録諸侯之幣也內臺西面者正北方應侯曹叔伯舅中舅內臺中臺也應侯成王弟曹叔武王弟皆國名為諸侯二舅成王之舅薑兄弟也比服次之要服次之荒服次之西方東面正北方伯父中子次之此要服於比服轉逺故殊其名非夷狄之四荒也伯父姬姓之國中子於王子中行者也方千里之內為比服方二千里之內為要服方三千里之內為荒服是皆朝于內者此服名因於殷非周制也堂後東北為赤帟焉浴盆在其中其西天子車立馬乘六青隂羽鳧旌鶴鳧羽為旌旄也中臺之外其右泰士士一作巫臺右彌士外謂臺之東西也外臺右泰士右彌士言尊王泰彌相儀之士也受贄者八人東面者四人受賔幣士也四人東面則西面四人也陳幣當外臺天玄毼宗馬十二陳束幣被馬于外臺天玄黑宗尊也玉玄繚璧綦十二此下三璧皆玉玄繚以黑組紐之綦玉名有十二參方玄繚璧豹虎皮十二參方陳幣三所也璧皮兼陳也四方玄繚璧琰十二琰圭也有鋒鋭陳之四方列之也外臺之四隅每隅張赤帟為諸侯欲息者皆息焉命之曰爻閭每角帳息者隨所近也諸侯稱爻也周公旦主東方所之青馬黑毼謂之母兒其守營墻者衣青操弓執矛西面者正北方稷愼大麈稷愼即肅愼也貢麈似鹿正北內臺北也穢人前兒若獼猴立行聲如小兒穢韓穢東夷别種良夷在子良夷樂浪之夷也貢奇獸揚州貢禺禺魚名解隃冠亦奇魚也説文作鰅鰅魚名皮有文出樂浪東暆神爵四年初捕收輸考工發人鹿人發亦東夷鹿人若鹿迅走俞人雖馬俞東北夷雖馬嶲如馬一角不角曰騏青丘狐九尾青丘海東地名周頭輝𤭔一作抵輝輝𤭔者羊也周頭亦海東夷黑齒白鹿白馬黑齒西逺之夷也貢白鹿白馬白民乘黃似騏一作狐皆有兩角白民亦東南夷東越海􅧳東越則海際􅧳文􅧳歐人蟬蛇順食之美歐一本作甌東越甌人也於越納姑妹珍且甌文蜃且甌在越文蜃大蛤也共人玄貝吳越之蠻海陽大蟹海水之陽一蟹盈車自深柱自深亦南蠻也會稽以􅥜其皮可以為鼓皆面西嚮自壁以下至此向西面也正北方義渠以兹白兹白者若白馬鋸牙食虎豹亦在臺北與大塵對義渠西戎國兹白一名駮史林以酋耳酋耳者身若虎豹戎之在西南者北唐戎以閭閭似隃冠戎之在西北者射禮以閭象為射器儀禮鄉射禮於郊則閭中以旌獲注引周書閭獸名如驢一角或曰如驢岐蹄渠叟以鼩犬鼩犬露犬也能飛食虎豹渠叟西戎之别名樓煩以星施一作星旄星施者羽旄樓煩北煩地羽選甘泉賦注引周書曰樓煩星旄者旄也鄭玄曰可以為旌旗也卜盧以紈牛卜盧盧人面西北戎也合盧水是文選注云紈牛小牛也區陽以鱉封鱉封者若彘前後有首區陽亦戎名規規一作規矩以麟麟者仁獸也規規亦戎也麟似鹿牛尾一角馬蹄也西申以鳳鳥氐羌以鸞鳥巴人以比翼鳥方煬以皇鳥方煬亦戎别名也皇鳥配於鳯者也蜀人以文翰文翰者臯雉一作雞爾雅注逸周書曰文鶾若彩雞鳥有文彩者臯雉似鳬冀州謂之澤特也説文亦引逸周書文翰若翬雉一名鵘風方人以孔鳥方人亦戎别名孔與鸞相配者卜人以丹砂卜人西南蠻丹砂之所出夷用􅂒木夷東北夷也木生水中黑色而光其堅如鐵康人以桴苡其實如李食之宜子康亦西戎别名王詩芣苡釋文山海經及周書會皆云芣苡木也實似李食之宜子出於西戎州靡以費費其形人身州靡北狄也費費野羊都郭生生人面能言都郭北狄生生獸名奇幹善芳善芳頭若雄雞佩之令人不昧奇幹亦北狄皆東嚮此東向列次也北方臺正東高夷嗛羊高夷東北夷高句曬獨鹿卭卭距虛善走也獨鹿西方之戎也卭卭獸似鼠距虛負蟨而走孤竹距虛孤竹東北夷不令支玄獏不令支皆東北夷獏白狐玄獏則黑狐不屠何青熊不屠何東北夷東胡黃羆東胡東北西卑山戎戎菽山戎亦東北夷戎菽巨豆也其西般吾白虎次西也般吾北狄近西也屠州黑豹屠州狄之别名禺氏騊駼禺氏西北戎夷騊駼馬之屬也大夏兹白牛大夏西北戎兹白牛野獸也似白牛之形犬戎文馬而赤鬛縞身目若黃金名古皇之乘説文作吉星者犬戎西戎之逺數楚每牛數楚亦北戎也牛之小者也凶戎一作胸奴狡犬胸奴北戎也權扶玉目權扶南蠻也玉之有光明形甚小也白州比閭比閭者其華若羽伐其木以為車白州者東南蠻也與白民接也禽人菅亦東南蠻菅草堅忍路人大竹路人東南蠻貢大竹長沙鱉其西魚復鼓鐘鐘牛次西列也魚復南蠻國也貢鼓及鐘而似牛形者美逺致也蠻揚之翟揚州之蠻貢翟鳥蒼梧一作倉吾翡翠所以取羽蒼梧亦蠻也其餘皆可知自古之政南人致衆者皆北嚮舊編成周之會墠上張赤帟隂羽除地曰墠帟帳也隂鶴也天子南面立唐叔周公在左太公望在右旁天子而立於堂上堂下之右唐公虞公立焉堂下之左商公夏公立焉皆南面內臺北服荒服外臺四隅張帟周公旦主東方太公望主西方自肅慎以下其贄物二十一自塵以下皆西向自義渠以下其贄物二十自兹白以下皆東向自高夷以下其贄物十四自嗛羊以下皆南向自權扶以下其贄物九自玉目以下皆北向秋官大行人九州之外謂之蕃國世一見各以其所貴寶為摰注所貴寶見傳者若犬戎獻白狼白鹿是也其餘則周書王會備焉疏曰書篇名詩騶虞釋文引周書王會曰詩疏鄭志張逸問傳曰白虎黑文答周史王會云序文選白馬賦注引周書王會鄭玄曰云云又王元長奇幹善芳之賦紈牛露犬之玩乘黃兹白之駟李善注引周書又引東越侮食旅獒疏按王會篇諸方致貢無所不有此言惟服食器用者遠方所貢雖不充器用實亦受之召公深戒武王故言此晉輿服志成王之會壇垂隂羽五方之盛有八十物宗馬鳥旌奚往不格伊尹朝獻商書本周書中以事類來附王會俱朝貢事故今附合湯問伊尹曰諸侯來獻或無牛馬之所生而獻逺方之物事實相反不利今吾欲因其地勢所有獻之易得而必貴其為四方獻令制其品服之令伊尹受命於是為四方令曰請正東符婁仇州伊慮漚深九夷十蠻越漚鬋髮文身十蠻者東夷蠻越之别稱鬋髮文身因其事以名也請令以魚支之鞞鰂之醬鮫瞂利劒為獻鞞刀削鰂魚名瞂盾也以鮫皮作之鮫文魚也正南甌鄧桂國損子産里百濮九菌六者南蠻之别名請令以珠璣玳瑁象齒文犀翠羽菌鶴矩狗為獻璣似珠而小鶴可用為旌翳矩狗狗之善者也正西昆侖狗國鬼親枳己闒耳貫胸雕題離丘漆齒九者西戎之别名請令以丹青白旄紕罽江歷龍角神龜為獻江歷珠名龍解角故得也正北空同大夏莎車姑他旦略豹胡戎翟丐奴樓煩月氏殱犂其龍東胡十二者北狄之别名也戎狄在西北界戎翟之間因名也請令以槖駝白玉野馬騊駼駃騠良弓為獻湯曰善後漢西南夷傳注伊尹為四方獻令楊炯少室山碑曰稽其殷令有文犀利劒之效珍考其周書有赭白乘黃之騁力漢譯官令譯使九譯令表典客屬官有行人譯官令丞周堪為譯官令典屬國有九譯令一人河平元年省并大鴻臚禮樂志象來致福注李奇曰象譯也地理志自夫甘都盧國船行可二月餘有黃支國民俗略與珠崖相類多異物自武帝以來皆獻見有譯長屬黃門與應募者俱入海市明珠璧流離奇石異物齎黃金雜繒而往所至國皆廪食為耦黃支之南有己程不國漢之譯使自此還矣見西域傳凡國五十自譯長皆佩漢印綬後東夷傳自女王國東度海千餘里至枸奴國雖皆倭種而不屬女王國南四千餘里至朱儒國人長三四尺自朱儒東南行船一年至裸國黑齒國使譯所傳極於此矣太史公曰海外殊俗重譯欵塞請來獻見司馬相如曰康居西域重譯請朝稽首來享董賢傳單于來朝宴見以問譯上令譯報張騫傳廣地萬里重九譯致殊俗班固達初中上疏烏桓就闕稽首譯官漢北貉致梟騎帝紀高祖五年北燕人來致梟騎助漢注貉在東北方三韓之屬漢夜郎入朝罽賔奉獻西南夷傳元鼎六年平南夷為牂柯郡夜郎侯始倚南粵南粵已滅還誅且蘭夜郎遂入朝上以為夜郎王冉駹震恐請臣置吏元封二年以兵臨滇滇降請置吏入朝以為益州郡賜滇王印復長其民西南夷君長以百數獨夜郎滇受王印光武時牂牱大姓從番禺江入貢西域傳罽賓武帝始通罽賓其後遣使奉獻漢使關都尉文忠送其使成帝時復遣使獻杜欽言起皮山南更不屬漢之國四五使者業已受節可至皮山而還其使數年一至車師地節二年鄭吉傳送車師王妻子至長安賞賜甚厚每朝會四夷常尊顯以示之烏孫元壽二年烏孫大昆彌伊秩靡與單于並入朝漢以為榮康居成帝時遣子侍漢貢獻都護郭舜言宜歸其侍漢終羈縻而未絶揚子漢德可謂允懷矣黃支之南大夏之西東鞮北女來貢其珍伍被曰南越賓服羌貢獻東甌入朝廣長榆開朔方胸奴折傷漢西域三十六國內屬遣子入侍五十餘國內屬西域傳西域以孝武時始通本三十六國其後稍分至五十餘師古曰司馬彪續漢書云哀平間有五十五國皆在胸奴之西烏孫之南南北有大山中央有河東西六千餘里南北千餘里東則接漢厄以玉門陽關西則限以嶺故皆役屬胸奴胸奴西邊日逐王置僮僕都尉使領西域自周衰戎狄錯居涇渭之北及始皇攘郤戎狄築長城以界中國然西不過臨洮漢興孝武事征四夷廣威德而張騫始開西域之迹張騫傳大宛諸國發使隨漢使來觀漢廣大後驃騎將軍破胸奴右地降渾邪休屠王遂空其地始築令居以西初置酒泉郡後稍發徙民充實之分置武威張掖敦煌列四郡據兩關焉自二師將軍伐大宛之後西域震懼多遣使來貢獻漢使西域者益得職於是自敦煌郡西至鹽澤往往起亭而輪臺渠犁皆有田卒數百人置使者校尉領護以給使外國者至宣帝時遣衛司馬使護鄯善以西數國及破姑師未盡殄分以為車師前後王及山北六國時漢獨護南道未能盡并北道也然胸奴不自安矣後日逐王畔單于將衆來降護鄯善以西使者鄭吉迎之既至漢封日逐王為歸德侯吉為安逺侯是歲神爵三年也及因使吉并護北道故號曰都護都護之置自吉始矣僮僕都尉由此罷胸奴益弱不得近西域於是徙屯田於北胥鞬披莎車之地屯田校尉始屬都護都護治烏壘城去陽關二千七百三十八里與渠犁田官相近於西域為中故都護治焉至元帝時復置戊己校尉屯田車師前王庭是時胸奴東蒲類王兹力支降都護分車師後王之西為烏貪訾離地以處之自宣元後單于稱藩臣西域服從其土地山川王侯戶數道里遠近翔實矣翔與詳同婼羌鄯善且末小宛精絶戎盧扞彌渠勒于闐皮山烏秅西夜蒲犁依耐無雷難兜罽賓烏弋山離安息大月氏康居大宛桃槐休循捐毒莎車疏勒尉頭烏孫姑墨溫宿龜兹烏壘渠犁尉犁危須焉耆烏貪訾離卑陸卑陸後國郁立師單桓蒲類蒲類後國西且彌東且彌劫國狐胡山國車師前王車師後王車師都尉車師後城長國口三百七十四萬九千九百六十四戶四十四萬五千四百七十九最凡國五十自譯長城長君監吏大祿百長千長都尉且渠當戶將相侯王皆佩漢印綬凡三百七十六人而康居大月氏安息罽賓烏弋之屬皆以絶遠不在數中其來貢獻則相與報不督録總領也楊雄上書往者圖西域制車師置城郭都護三十六國費歲以大萬計數百萬乃以制胸奴也樂劉歆議曰孝武置五屬國起朔方東伐朝鮮起玄莬浪以斷胸奴之左臂西伐大宛并三十六國結烏孫起燉煌酒泉張掖以鬲婼羌裂胸奴之右肩單于孤特遠遁于幕北四垂無事贊曰孝武圖制胸奴表河曲列四郡開玉門通西域以斷胸奴右臂隔絶南羌月氏單于失援由是遠遁而幕南無王庭敘傳西戎即序夏后是表周穆觀兵荒服不旅漢武勞神圖遠甚勤王師驒驒致誅大宛使命乃通條支之瀕昭宣承業都護是立總督城郭三十有六修奉朝貢各以其職後西域傳武帝時西域內屬有三十六國漢為置校尉領護之宣帝改曰都護元帝又置戊己二校尉屯田於車師前王庭哀平之間自相分割為五十五國建武中皆遣使求內屬願請都護紀二十一年冬鄯善車師皆遣子入侍貢獻光武以天下初定未遑外事不許莎前傳云自建武以來西域思漢威德咸樂內屬大國車于闐之屬數遣使置質于漢願請屬都護聖上羈縻不絶辭而未許永平中北虜脅諸國共寇河西十六年明帝乃命將帥北征胸奴取伊吾盧地置宜禾都尉以屯田遂通西域于闐諸國皆遣子入侍西域自絶六十五載乃復通焉明年始置都護戊己校尉十七年十一月置西域都護建初元年春章帝不欲疲敝中國乃迎還戊己校尉不復遣都護二年復罷屯田伊吾時班超留于闐和帝永平元年竇憲大破胸奴二年遣副校尉閻槃擊伊吾破之三年班超遂定西域因以超為都護居龜兹復置戊己校尉六年超復擊破焉耆於是五十餘國悉納質內屬其條支安息諸國至於海濱四萬里外皆重譯貢獻九年超遣掾甘英窮臨西海而還於是遠國蒙奇兜勒皆來歸服遣使貢獻安帝永初元年罷都護棄西域元初六年車師前王及鄯善王來降其後北虜與車師入寇河西議者因欲閉玉門陽關以絶其患延光二年敦煌太守張璫陳三䇿以酒泉屬國吏士二千餘人集昆侖塞先擊呼衍王絶其根本上計也置軍司馬據柳中中計也收鄯善等入塞下計也朝廷下其議尚書陳忠上疏曰孝武開河西四郡以隔絶南羌收三十六國斷胸奴右臂單于鼠竄至宣元之世遂備藩臣關徼不閉羽檄不行宜增四郡屯兵以西撫諸國折衝萬里震怖胸奴帝乃以班勇為西城長史將弛刑士五百人西屯柳中勇遂破平車師自建武至于延光西域三絶三通順帝永建二年勇復擊降焉耆於是龜兹疏勒于闐莎車等十七國皆來服從而烏孫蔥嶺已西遂絶六年復屯田伊吾置伊吾司馬一人班固紀諸國風土人俗已備今撰建武後事為西域傳皆安帝末班勇所記云西域內屬諸國東極玉門陽關西至蔥嶺東北與胸奴烏孫相接有兩道傍南山北陂河西行至莎車為南道自車師前王庭隨北山陂河西行至疏勒為北道莎車思慕漢家建武五年河西大將軍竇融承制立康為漢莎車建功懷德王西域大都尉五十五國皆屬焉二十一年冬車師前王鄯善焉耆等十八國俱遣子入侍貢獻珍寶願得都護天子皆還其侍子厚賞賜之論曰張騫懷致遠之略班超奮封侯之志立功西遐羈服外域故設戊己之官分任其事建都護之帥總領其權立屯田於膏腴之野列郵置於要害之路荀恱漢紀西域本三十六國後分為五十四國皆在胸奴之西婼羌沮沫精絶戎盧渠勒皮山烏秅蒲犁西夜依耐無雷捐毒桃槐休循疏勒尉頭烏貪卑陵一作卑陸渠類谷隋立師一作郁立師單桓蒲類西沮彌劫國狐胡山國車師凡二十七國小國也小者七百戶大者千戶杅彌于闐難完一作難兜莎車溫宿龜兹尉犂危須焉耆凡此九國次大國小者千餘戶大者六七千户按三十六國曰婼羌鄯善且末小宛精絶戎盧杅彌渠勒于闐皮山烏秅西夜蒲犁依耐無雷大宛桃槐休循捐毒莎車疏勒尉頭烏孫前西域傳武帝通三十六國皆在胸奴之西烏孫之南既言在烏孫之南則烏孫不與矣姑墨溫宿龜兹尉犁危須焉耆卑陸前後國郁立師單威蒲類前後且彌東西劫國車師前後都尉後城長四國狐胡亦治車師栁谷通五國嘗合為一康居大月氐安息罽賔烏弋之屬皆以絶遠不在數中賔難兜屬罽賔不在三十六國之數不屬都護則罽難兜烏弋山離安息大月氏康居桓不言去都護治則婼羌桃槐訾離卑陸後郁立師單蒲類後山國車師都尉後域長國班超傳建初三年上疏曰今西域諸國自日之所入莫不向化唯焉耆龜兹未服從若姑墨溫宿二國來降則龜兹自破臣超目見西域平定陛下舉萬年之觴薦勳祖廟布大喜於天下云云斬焉耆王廣尉犁王泛更立元孟為焉耆王超留半歲慰撫之於是西域五十餘國悉納質內屬明年詔曰超安集于闐以西遂踰蔥嶺迄縣度出入二十二年莫不賓從臧洪傳父旻為胸奴中郎將太尉袁逢問西域諸國土地風俗人物種數旻言西域本三十六國後分為五十五國稍散至百餘國楊終傳建初元年正月上疏間者北征胸奴西開三十六國轉輸煩費孝元棄珠崖之郡光武絶西域之國不以介鱗易我衣裳隋裴矩西域圖記序禹定九州導河不踰積石秦兼六國設防止於臨洮漢氏興基開拓河右始稱名號者有三十六國其後分立乃五十五王仍置校尉都護雖大宛以來略知戶數而諸國山川未有名目隋煬帝遣韋節使西域諸國令矩於武威張掖致之其有君長者四十四國矩因其使者入朝使相風諭大業中來朝三十餘國因置西域校尉今所存録者二十國漢渠黎六國來獻武帝紀天漢二年秋渠黎六國來獻注西域胡國名漢單于遣名王奉獻來朝入侍奉珍朝賀宣紀本始二年秋胸奴有桀心欲掠烏孫遣御史大夫田廣明等五將軍兵十五萬騎獵其南校尉常惠持節護烏孫兵咸擊胸奴五萬騎震其西三年夏五月常惠將烏孫兵入胸奴右地大克獲胸奴民衆死傷而去及畜産遠移死亡不可勝數於是胸奴遂衰耗兹欲向和親而邊境少事神爵二年九月胸奴單于遣名王奉獻賀正月始和親四年五月胸奴單于遣弟呼留若王勝之來朝五鳳二年冬十一月胸奴呼遫纍單于帥衆來降封為列侯三年三月詔曰往者胸奴數為邊寇朕承至尊未能綏定胸奴虛閭權渠單于請和親右賢王屠耆堂代立骨肉大臣立虛閭權渠單于子為呼韓邪單于擊殺屠耆堂諸王並自立分為五單于更相攻擊因大乖亂單于閼氏子孫昆弟及呼遫纍單于名王右伊秩訾且渠當戶以下將衆五萬餘人來降歸義單于稱臣使弟奉珍朝賀正月北邊晏然靡有兵革之事置西河北地屬國以處胸奴降者甘露元年正月呼韓邪單于遣子右賢王銖婁渠堂入侍冬胸奴遣弟左賢王來朝賀四年正月單于稱臣遣弟谷蠡王入侍功臣表歸德侯先賢撣神爵三年四月戊戌以日逐王率衆降侯信成侯王定以烏桓屠驀單于子左大將軍率衆降五鳳二年九月癸巳封義陽侯厲溫敦三年二月甲子以呼與呼同遫纍單于率衆降侯千五百戶揚雄云元康神爵之間大化神明鴻恩博洽而胸奴內亂五單于爭立日逐呼韓邪扶伏稱臣又云徒奮揚威武明漢兵若雷風耳漢單于朝甘泉宫置酒建章宫宣紀甘露元年正月呼韓邪單于遣子右賢王入侍二年十二月欵五原塞願奉國珍以朝三年正月詔有司議咸曰單于非正朔所加王者所容也禮儀宜如諸侯王稱臣昧死再拜位次諸侯王下詔曰其以客禮待之位在諸侯王上三年正月行幸甘泉郊泰畤呼韓邪單于稽侯㹪來朝贊謁稱藩臣而不名單于就邸置酒建章宫饗賜單于觀以珍寶二月單于罷歸命長樂衛尉董忠車騎都尉昌晉灼曰韓昌騎都尉虎將萬六千人送單于居幕南保光祿城詔北邊賑榖食郅支遠遁胸奴遂定黃龍元年正月復朝禮賜如初二月歸國胸奴傳神爵四年稽侯㹪立呼韓邪單于恐年月並有差其冬都隆奇立日逐王薄胥堂為屠耆單于明年呼揭王自立為呼揭單于右奧鞬王自立為車犁單于烏藉都尉亦自立為烏藉單于凡五單于其後呼韓單于兄左賢王呼屠吾斯亦自立為郅支骨都侯單于進攻呼韓邪呼韓衆裁數萬呼韓邪破其兵走郅支都單于庭呼韓邪之敗也左伊秩訾王勸令稱臣入朝從漢求助諸大臣相難久之呼韓邪從其計遣子右賢王銖婁渠堂入侍郅支單于亦遣子右大將軍駒于利受入侍是歲甘露元年也明年呼韓邪單于欵五原塞願朝三年正月漢遣車騎都尉韓昌迎發過所七郡郡二千騎為陳道上單于正月朝天子于甘泉宫寵以殊禮位在諸侯王上贊謁稱臣而不名賜以冠帶衣裳黃金璽盩綬玉具劒孟康曰標首鐔衛盡用玉為之佩刀弓一張矢四發發十二矢也棨戟十安車一乘鞍勒一具馬十五匹黃金二十斤錢二十萬衣被七十七襲錦繡綺縠雜帛八千匹絮六千斤禮畢使有司道單于先行宿長平就邸長安上自甘泉宿池陽宫上登長平阪詔單于毋謁其左右當戶之羣臣皆得列觀及諸蠻夷君長王侯數萬人咸迎於渭橋下夾道陳上登渭橋咸稱萬歲單于就邸留月餘遣歸國單于自請願留居光祿塞下有急保漢受降城遣長樂衛尉高昌侯董忠騎都尉韓昌將騎萬六千及邊郡士馬以千數送單于出朔方雞鹿塞又轉邊穀米糒前後三萬四千斛給贍其食明年兩單于俱遣使朝獻漢待呼韓邪使有加明年呼韓邪來朝禮賜如初加衣百十襲錦帛九千匹絮八千斤贊曰孝宣覆以威德單于稽首臣服三世稱藩賓于漢庭是時邊城晏間牛馬布野元紀竟寧元年正月呼韓邪來朝詔曰云云其改元為竟寧禮賜如初加衣服錦帛絮倍於黃龍時成紀河平四年正月丐奴單于來朝復株絫若鞮單于也引見白虎殿丞相王商坐未央廷中單于前拜謁哀紀元壽二年正月胸奴單于烏孫大昆彌來朝二月歸國烏珠留單于也舍之上林苑蒲陶宫加賜衣三百七十襲錦帛三萬匹絮三萬斤後胸奴傳論龍駕帝服鳴鐘傳鼓於清渭之上南面而朝單于朔易無復匹馬之蹤六十餘年漢南單于詣闕稱藩後傳南胸奴醯落尸逐鞮單于比者呼韓邪單于之孫為右奧鞬日逐王光武初未遑外事六年始令歸德侯劉颯使丐奴胸奴亦遣使來獻復令中郎將韓統報命賂遺金幣以通舊好而單于驕踞自比冒頓對使者辭語悖慢帝待之如初建武六年十四年胸奴遣使來獻使中郎將報命十三年遂寇河東於是胸奴左部轉居塞內朝廷患之增緣邊兵大築亭候修烽火二十年入寇至上黨扶風天水二十一年冬復寇上谷中山殺掠鈔奪甚衆北邊無復寧歲二十二年單于輿死左賢王蒲奴立為單于比不得立既懷憤恨而胸奴中連年旱蝗赤地數千里單于畏漢乘其敝乃遣使詣漁陽求和親於是遣中郎將李茂報命而比密遣漢人郭衡奉胸奴地圖二十三年紀二十二年北烏桓擊胸奴胸奴徙幕南地空詣西河大守求內附二十四年春紀正月八部大人共議立比為呼韓邪單于欵五原塞願為藩蔽扞禦北虜其冬十月比自立為呼韓邪單于紀云自立為南單于於是南北胸奴始分東觀記曰十二月癸丑胸奴始分為南北單于帝用中郎將耿國議乃許之一本二十四年比自立為呼韓邪單于欵塞稱藩願扞北虜議者以為不可許耿國以為宜如孝宣故事令東扞鮮卑北拒胸奴帝遂立為南單于由是鮮卑保塞北虜遠遁中國少事二十五年春遣弟左賢王莫將兵萬餘人擊北單于弟薁鞬左賢王生獲之又破北單于帳下並得其衆合萬餘人北單于震怖却地千里北部薁鞬骨都侯與右骨都侯率衆三萬餘人來歸南單于南單于復遣使詣闕奉藩稱臣獻國珍寶紀春正月遣使詣闕貢獻求使者監護遣侍子修舊約紀三月南單于遣子入侍二十六年遣中郎將段郴授南單于璽綬詔聽入居雲中遣使獻駱駝二頭文馬十匹始置使胸奴中郎將將兵衛護之夏南單于所獲北虜薁鞬左賢王將其衆畔歸北庭共立薁鞬為單于更相攻擊左賢王自殺秋南單于遣子入侍奉奏詣闕詔賜單于冠帶衣裳黃金璽盩緺綬安車羽蓋華藻駕駟寶劒弓箭黑節三駙馬二黃金錦繡繒帛萬匹絮萬斤樂器鼓車棨戟甲兵飲食什器又轉河東米糒二萬五千斛及牛羊給之令中郎將置安集掾史將弛刑五千人持兵弩隨單于歲盡輒遣奉奏送侍子入朝中郎將從事一人將領詣闕遣謁者送前侍子還單于庭元正朝賀拜祠陵廟畢乃遣單于使令謁者將送賜綵繒千匹錦四端金十斤太官御食醬及橙橘龍眼荔枝賜單于母閼氏及左右賢王等繒綵合萬匹歲以為常冬與北單于戰不利復詔單于徙居西河美稷使段郴及副校尉王郁留西河擁護之歲將騎二千弛刑五百人衛護冬屯夏罷後以為常悉復緣邊八郡南單于既居西河亦列置諸部王助為扞戍紀二十八年北丐奴遣使貢獻乞和親論曰製衣裳備文物加璽綬正單于之名始分南北二庭永元十六年北單于遣使詣闕貢獻願和親修呼韓邪故事和帝厚加賞賜不答其使元興元年重遣使詣敦煌貢獻亦不答其使漢烏桓來朝四夷朝賀大會勞饗中興四夷來賓烏桓傳建武二十五年遼西烏桓大人郝旦等九百二十二人率衆向化詣闕朝貢獻奴婢牛馬及弓虎豹貂皮紀建武二十五年春正月烏桓大人來朝是時四夷朝賀絡繹而至天子乃命大會勞饗賜以珍寶烏桓或願留宿衛於是封其渠率為侯王君長者八十一人皆居塞內布於緣邊諸郡令招來種人給其衣食遂為漢偵候助擊胸奴鮮卑時司徒掾班彪上言始復置校尉於上谷寧城開營府并領鮮卑賞賜質子歲時互市焉及明章和三世保塞無事東夷傳建武之初貊人復來朝賀時遼東守祭肜聲行海表於是濊貊倭韓萬里朝獻故章和已後使聘流通自中興之後四夷來賔雖時有乖畔而使驛不絶國俗風土可得略記漢鮮卑朝賀賜赤車質館鮮卑傳東胡之支也建武二十五年鮮卑始通驛使三十年春正月於仇賁率種人詣闕朝賀慕義內屬封為王紀云鮮卑大人內屬朝賀永平元年遼東太守祭肜誘賂使斬叛烏桓歆志賁等首皆來歸附並詣遼東受賞賜青徐二州給錢歲二億七千萬明章二世保塞無事安帝永初中燕荔陽詣闕朝貢賜以王印綬赤車參駕止烏桓校尉所居寧城下通胡市築南北兩部質館邑落百二十部各遣入質祭肜傳建武二十五年鮮卑大都護偏何遣使奉獻願歸化異種滿離高句驪之屬欵塞上貂裘好馬諸豪並歸義自效擊胸奴左伊秩訾部斬首二千餘級受賞賜邊無寇警鮮卑烏桓並入朝貢魏黃初五年鮮卑步度根詣闕貢獻太和二年軻北能數欵塞奉貢獻五年四月附義王比能率種人及丁零詣幽州貢名馬漢徼外蠻夷內屬紀光武建武十二年九真徼外蠻夷張遊傳云蠻里張遊注里蜜之别號率種人內屬封為歸漢里君十三年七月廣漢徼外白馬羌豪率種人內屬注西羌有百五十四種在廣漢西北者為白馬羌西羌傳十三年白馬羌豪樓登等率種人五千餘戶內屬封為歸義君十四年夏四月越巂人任貴自稱太守遣使奉計岑彭傳十一年卭榖王任貴聞彭威信數千里遣使來降上卭都夷傳光武封長貴為卭榖王十四年長貴遣使三年計即授越巂太守印綬二十七年益州郡徼外蠻夷率種人內屬明帝永平十二年正月益州徼外夷哀牢王相率內屬見後和帝永元六年蜀郡徼外羌率種人遣使內附傳云永元六年蜀郡徼外大牂夷種羌豪造頭等率種人五十餘萬口內屬拜造頭為邑君賜印綬九年正月永昌徼外蠻夷及撣國王雍由調重譯奉貢傳云奉國珍寶賜金印紫綬十二年二月旄牛徼外白狼貗薄夷率種人內屬傳永元十二年旄牛徼外白狼貗薄蠻夷王唐僧等率種人十七萬口歸義內屬詔賜金印紫綬小豪錢帛安帝永初元年正月蜀郡徼外羌內屬注東觀記曰徼外羌龍橋等六種慕義降附舉傳云蜀郡徼外羌薄申等八種三萬六千九百口復土內屬冬廣漢塞外參狼種羌二千四百口復來內屬三月己卯永昌徼外僬僥種夷貢獻內屬傳云永初元年徼外僬僥種夷陸類等三千餘口舉種內屬夏五月九真徼外夜郎蠻夷舉土內屬傳云開境千八百四十里二年閏月蜀郡徼外羌舉土內屬傳云永初二年青衣道夷邑長令田與徼外三種夷三十一萬口齎黃金旄牛眊舉土內屬帝增令田爵號為奉通邑君元初三年越巂徼外夷舉種內屬傳云郡徼外夷大羊等八種戶三萬一千口十六萬七千六百二十慕義內屬延光元年九真徼外蠻夷貢獻內屬傳同順帝永建六年十二月日南徼外葉調國貢獻傳云日南徼外葉調王便遣使貢獻賜金印紫綬東觀記云遣使師會詣闕靈帝建寧三年鬱林烏滸民相率內屬鬱林守谷永以恩信招烏滸人十餘萬內屬皆受冠帶開置七縣熹平二年十二月日南徼外國重譯貢獻光和六年復來貢東京賦惠風廣被澤洎幽荒北燮丁零南諧越裳西包大秦東過樂浪重舌之人九譯僉稽首而來王張騫傳注應劭曰鄧太后時西夷檀國來朝賀尚書陳忠按漢舊書乃知世宗時犛靬獻幻人與俱巡狩漢莎車鄯善奉獻十六國遣子入侍拘彌疏勒莎車于闐貢獻紀光武建武十四年莎車國王賢鄯善國王安遣使奉獻於是西域始通二十一年冬鄯善車師焉耆等十六國通鑑及西域傳云十八國當考皆遣子入侍奉獻願請都護帝以中國初定未遑外事乃還其侍子厚加賞賜二十二年冬鄯善王上書願復遣子入侍更請都護詔不許和帝永元二年車師前後王並遣子入侍三年冬詔曰西域諸國納質內附順帝永建四年拘彌國遣使入獻五年正月疏勒王遣侍子及大宛莎車王皆遣使貢獻六年九月丁酉十二月壬申于闐王遣侍子貢獻漢安二年二月丙辰鄯善王遣使貢獻桓帝延熹二年十二月四年十月天竺國來獻傳云和帝時數遣使貢獻西域傳建武五年河西竇融承制立康為漢莎車建功懷德王西域大都尉五十五國皆屬焉九年賢代立云云十七年賢復遣使奉獻請都護帝賜賢西域都護印綬及車旗黃金錦繡二十一年冬車師前王鄯善焉耆等十八國俱遣子入侍獻其珍寶永元六年七月班超擊破焉耆於是五十餘國悉納質內屬其條支安息諸國至于海瀕四萬里外皆重譯貢獻順帝永建四年班勇復擊焉耆延光中班勇破焉耆元孟乃遣子詣闕貢獻於是龜兹疏勒于闐莎車等十七國皆來服從疏勒臣磐遣使奉獻五年遣侍子與大宛莎車使俱詣闕貢獻杜篤論都賦文身鼻飲緩耳之主椎結左衽𤭔鍝之君東南殊俗不羈之國西北絶域難制之鄰靡不重譯納貢請為藩臣上猶謙遜而不伐勤以為獲無用之虜不如安有益之民馬融廣成頌東鄰浮巨海而入享西旅越蔥嶺而來王南徼因九譯而致貢朔狄屬象胥而來同漢高麗奉貢內屬紀光武建武八年十二月高句麗王遣使奉貢二十年秋東夷韓國人率衆詣樂浪內附注辰辨馬謂之三韓二十三年冬十月丙申高句驪王率種人詣樂浪內屬安帝永初三年正月高句驪遣使貢獻東夷傳高句驪在遼東之東千里建武八年遣使朝貢光武復其王號二十三年冬句驪蠶支落大加戴升等萬餘口詣樂浪內屬安帝永初五年句驪王宫遣使貢獻求屬玄菟順帝陽嘉元年紀云十二月庚戌置玄莵郡屯田六部漢交址奉貢紀光武建武五年十二月交址牧鄧讓率七郡太守遣使奉貢注交址今交州縣南濵大海輿地志云其夷足指開折兩足並立指則相交七郡謂南海蒼梧鬱林合浦交址九真日南並屬交州漢夫餘奉獻倭奴奉獻紀光武建武二十五年冬十月夫餘王遣使奉獻在海東去玄莵千餘里是歲烏桓大人率衆內屬詣闕朝貢中元二年春正月東夷倭奴國王遣使奉獻倭在帶方東南大海中依山島為國東夷傳倭在韓東南大海中依山島為居凡百餘國自武帝滅朝鮮使譯通於漢者三十餘國樂浪郡徼去其國萬二千里前志樂浪海中有倭人分為百餘國以歲時來獻見建武初貊人朝貢時遼東太守祭肜威讋北方聲行海表於是濊貊倭韓萬里朝獻二十年韓人廉斯人蘇馬諟等詣樂浪貢獻封為邑君建武中東夷諸國皆來獻見二十五年夫餘王遣使奉貢光武厚答報之於是使命歲通中元二年倭奴國奉貢朝獻使人自稱大夫光武賜以印綬安帝永初元年倭國王帥升等遣使奉獻紀云冬十月永寧元年夫餘遣子闕仇台詣闕貢獻賜印綬金綵順帝永和元年其王來朝京師帝作黃門鼓吹角觗戲以遣之桓帝延熹四年十二月遣使朝賀貢獻靈帝熹平三年復奉章貢獻夫餘本屬玄莵獻帝時求屬遼東魏志景初二年六月倭女王遣大夫詣郡求朝獻十二月制以為親魏倭王假以金印紫綬賜絳地交龍錦宋元嘉二年獻方物漢哀牢內屬西南夷貢獻明紀永平十二年春正月益州徼外夷哀牢王柳貌相率內屬於是置永昌郡罷益州西部都尉傳云始通博南山度蘭倉水行者歌曰漢德廣開不賔度博南越蘭津十七年春是歲甘露降木枝內附神爵翔集西南夷哀牢儋耳僬僥槃木白狼勤黏諸種前後慕義貢獻西域諸國遣子入侍夏五月戊子公卿百官以帝威德懷逺祥物顯應乃並集朝堂奉觴上壽哀牢傳古未通中國建武二十三年其王賢栗擊附塞夷鹿茤震雷疾雨水逆流沈數千人賢栗曰今被天誅中國其有聖帝乎天祐助之何其明也二十七年率種人詣越巂太守鄭鴻降求內屬封為君長歲朝貢永平十二年王栁貌遣子率種人內屬稱邑王者七十七人戶五萬一千八百九十口五十五萬三千七百一十一西南去洛陽七千里以其地置哀牢博南二縣割益州郡西部都尉所領六縣合為永昌郡先是西部都尉鄭純化行夷貊君長感慕皆獻土珍頌德美天子嘉之以為永昌太守章紀明帝澤臻四表僬僥儋耳欵塞自至克伐鬼方開道西域威靈廣被無思不服東都賦綏哀牢開永昌漢白狼槃木詩後西南夷傳莋都夷者武帝所開以為莋都縣元鼎六年以為沉黎郡至天漢四年并蜀為西部置兩都尉一居旄牛主徼外夷一居青衣主漢人永平中益州刺史梁國朱輔東觀記作酺好立功名慷慨有大略在州數歲宣示漢德威懷遠夷自汶山以西前世所不至正朔所未加白狼槃木唐菆等百餘國戶百三十餘萬口六百萬以上舉種奉貢稱為臣僕輔上疏曰臣聞詩云彼徂矣岐有夷之行傳曰岐道雖僻而人不遠詩人誦詠以為符驗今白狼王唐菆等慕化歸義作詩三章路經卭來大山零高坂峭危峻險百倍岐道襁負老幼若歸慈母遠夷之語辭意難正草木異種鳥獸殊類有犍為郡掾田恭與之習狎頗曉其言臣輒令訊其風俗譯其辭語今遣從事史李陵與恭護送詣闕并上其樂詩昔在聖帝舞四夷之樂令之所上庶備其一帝嘉之事下史官録其歌焉注東觀記載其歌并夷人本語並重譯訓詁為華言今范史所載者是也今録東觀夷言以為注遠夷樂德歌詩曰大漢是治提官隗構與天合意魏昌瑜糟吏譯平端罔驛劉牌不從我來旁莫支留聞風向化徼衣隨旅所見奇異知唐桑艾多賜繒布邪毗堪補甘美酒食推擇供遠昌樂肉飛拓拒蘇便屈申悉備局後仍離蠻夷貧薄僂讓龍洞無所報嗣莫支度由願主長壽陽雒僧鱗子孫昌熾莫稚角存逺夷慕德歌詩曰蠻夷所處僂讓反尼日入之部旦交陵悟慕義向化繩動隨旅歸日出主路且㨂雒聖德深恩聖德渡諾與人富厚魏菌度洗冬多霜雪淙邪流藩夏多和雨莋邪尋螺寒溫時適藐潯瀘灕部人多有菌補邪推陟危歷險辟危歸險不遠萬里莫受萬抑去俗歸德術疊附德心歸慈母仍路孳模遠夷懷德歌詩曰荒服之外荒服之儀土地墝埆犁藉憐憐食肉衣皮阻蘇邪犁不見鹽穀莫楊粗沐吏譯傳風誾驛傳微太漢安樂是漢夜拒攜負歸仁蹤優路仁觸冒險陜雷折險龍高山岐峻倫狼藏幢緣崖磻石抉路側録木薄發家息落服淫百宿到洛理歷􅧋雒父子同賜捕􅉅菌毗懷抱匹帛懷藁匹漏傳告種人傳室呼敕長願臣僕陵陽臣僕是時郡尉府舍皆有雕飾畫山神海靈奇禽異獸以眩耀之夷人畏憚通鑑永平十七年三月蜀都賦陪以白狼夷歌成章种皓傳為益州刺史白狼槃木諸國復舉種向化永元十二年白狼內屬見上魏西域內附魏志黃初三年二月鄯善龜兹于闐王遣使奉獻詔曰西戎即敘氐羌來王詩書美之頃西域外夷欵塞內附其遣使撫之是時西域遂通置戊己校尉魏興西域雖不能盡至其大國龜兹于闐康居烏孫疏勒月氏鄯善車師之屬無歲不奉朝貢略如漢氏故事晉東夷八國歸化十七國內附武紀泰始二年十一月己卯倭人來獻方物咸寧二年二月東夷八國歸化七月東夷十七國內附四年三月東夷六國來獻是歲東夷九國內附太康元年六月甲申東夷十國歸化七月東夷二十國朝獻二年三月東夷五國朝獻六月東夷五國內附三年九月東夷二十九國歸化獻其方物七年八月東夷十一國內附是歲馬韓十一國遣使來獻八年八月東夷二國內附九年九月東夷七國詣校尉內附十年五月東夷十一國內附是歲東夷絶遠三十餘國來獻太熙元年二月辛丑東夷七國朝貢惠紀永平元年東夷十七國南夷二十四部並詣校尉內附張華傳為持節都督幽州戎夏懷之東夷馬韓新彌諸國依山帶海去州四千餘里厯世未附者三十餘國並遣使朝獻四夷傳序武帝撫舊懷新凡四夷入貢者有三十三國倭人泰始初遣使重譯入貢肅愼氏魏景元末來貢楛矢石弩弓甲貂皮之屬至武帝元康初復來貢元帝中興又詣江左貢其石弩晉扶南林邑來獻參離內附紀武帝泰始四年十二月扶南林邑遣使來獻太康五年十二月庚午林邑大秦國各遣使來獻六年四月扶南等十國來獻參離四千餘落內附七年扶南等二十一國遣使來獻八年十二月壬戌南夷扶南西域康居遣使來獻十年西南夷二十餘國來獻十二月壬戌奚軻男女十萬口來降穆帝升平元年正月扶南王竺旃檀獻象詔還本土孝武太元二年六月乙巳林邑貢方物七年三月獻方物十四年二月扶南獻方物南蠻傳林邑本漢象林縣馬援鑄柱之處去南海三千里古越裳界馬援撫二銅柱表漢界大康中始來貢獻扶南西去林邑三千餘里在林邑西南泰始初遣使貢獻穆帝升平初復有竺旃檀稱王遣使貢象詔還之胡達立上疏貢金盤碗及金鉦等物咸寧中南單于來朝處之王公特進之下齊永明二年八月壬子扶南遣使朝貢并獻頌章晉車師遣子入侍武紀太康元年八月車師前部遣子入侍四年八月鄯善遣子入侍假歸義侯六年十月龜兹焉耆國遣子入侍八年十二月康居遣使來獻西戎傳太康六年拜藍廋為大宛王其子摩之立遣使貢汗血馬泰始中康居獻善馬梁職貢圖又見圖類唐志地理類梁元帝職貢圖一卷南史云貢賦圖貢梁書云畫番客入圖書目金樓子其自序云乃纂百國一卷今存二十有七為湘東王時諸番使者入貢圖其形貌服飾次以本國風俗序曰尼丘有徒人之法晉帝有樂象之賢甘泉寫閼氏之形後宫玩單于之圖夷歌成章胡人遙集自塞以西萬八千里路之狹者尺有六寸高山尋雲深谷絶景占雲望日度青丘而跨丹穴梁天監