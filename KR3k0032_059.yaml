body:
  text: 玉海卷五十九宋王應麟撰藝文詩歌詩大序曰詩者志之所之也在心為志發言為詩心之精微者發而為言言之成文者約而為詩朱子曰以虞書考之詩之作本言志而已方其詩也未有歌也及其歌也未有樂也以聲依永以律和聲則樂乃為詩而作非詩為樂而作也葛天氏八闋呂氏春秋仲夏紀昔葛天氏之樂三人捲一作摻一作持牛尾投足以歌八闋一曰載民二曰玄鳥三曰遂草木四曰奮五穀五曰敬天常六曰建帝功七曰依地德八曰得方外之極注一本總萬物禽獸之極上林賦聽葛天氏之歌注張揖曰其樂三人歌八曲堯古詩列子仲尼篇堯治天下五十年遊於康衢聞兒童謠曰立我蒸民莫匪爾極不識不知順帝之則堯問誰教為此言童兒曰我聞之大夫問大夫大夫曰古詩也舜南風詩見琴類禹康歌隋食貨志禹制九等而康歌興周人十一而頌聲作周九德歌禮大司樂於宗廟之中奏之左傳文七年晉郤缺曰九功之德皆可歌也謂之九歌六府三事謂之九功漢志國子學歌九德周文公詩周語富辰曰周文公之詩曰兄弟鬩于牆外禦其侮呂氏春秋周公旦乃作詩曰文王在上於昭于天周祈招詩左傳昭十二年楚右尹子革曰昔穆王欲肆其心祭公謀父作祈招之詩招樂名曰祈招之愔愔云云形民之力而無醉飽之心家語作刑民注祈父周司馬招其名仲尼五章史記樂書仲尼正樂以誘世作五章以刺時索隱曰孔子詩曰優哉遊哉聊以卒嵗是五章之刺見家語伯夷傳賭軼詩可異焉即采薇之詩漢二十八家歌詩初詩見樂章宗廟歌詩志高祖歌詩二篇泰一雜甘泉壽宫十四篇宗廟歌詩五篇漢興以來兵所誅滅十四篇出行巡狩及遊十篇臨江王及節士四篇李夫人及幸貴人三篇詔賜中山未央材人四篇吳楚汝南十五篇燕代謳鴈門雲中隴西歌詩九篇邯鄲河間四篇齊鄭淮南各四篇左馮翊京兆尹秦歌詩八篇河東蒲反一篇黃門倡車忠等十五篇各有主名及雜歌詩十九篇雒陽四篇河南周歌詩謠及聲曲折一百六十四篇諸神三篇送迎靈頌三篇周歌詩二篇南郡五篇右歌詩二十八家三百一十四篇自孝武立樂府采歌謠於是有代趙之謳秦楚之風皆感於哀樂緣事而發亦可觀風俗知薄厚樂志采詩夜誦孔光奏夜誦貟五人不可罷秦倡楚巴銚齊四會蔡齊謳皆鄭聲可罷漢雅歌詩志樂六家雅歌詩四篇漢郊廟詩歌禮樂志今漢郊廟詩歌未有祖宗之事八音調均義不協於鐘律而內有掖庭材人外有上林樂府皆以鄭聲施於朝廷漢九歌志郊祀歌天地八九歌畢奏斐然殊漢韋孟諌詩傳韋孟為楚王傅作詩風諌後去位徙家于鄒又作一篇其諌詩曰睮睮諂夫咢咢黃髮如何我王曾不是察致氷匪霜致隊匪嫚瞻惟我王昔靡不練在鄒詩曰其夢如何夢爭王室其爭如何夢王我弼濟鄒魯禮義唯恭誦習弦歌于異他邦文選注有劉向劉歆七言東方朔六言五言見於周行露之章是也漢柏梁臺詩見臺類漢神爵齊祠詩歌郊祀志神爵元年正月上始幸甘泉郊見泰畤數有美祥修武帝故事盛車服敬齋祠之禮頗作歌詩其三月幸河東祠后土有神爵集改元王褒傳神爵五鳳之間天下殷富數有嘉應上頗作歌詩欲興協律之事丞相魏相奏知音善鼓雅琴者召見待詔漢中和樂職宣布詩王褒傳益州刺史王襄欲宣風化於衆庶聞褒有俊才使作中和樂職宣布詩選好事者令依鹿鳴之聲習而歌之時泛鄉侯何武為僮子選在歌中久之武等學長安歌太學下轉而上聞宣帝召見武等觀之皆賜帛曰此盛德之事吾何足以當之褒既為刺史作頌又為其傳注師古曰解釋頌歌之義及作者之意中和言政治和平樂職言百官各得職宣布風化普洽何武傳宣帝時天下和平四夷賓服神爵五鳳之間屢蒙瑞應王襄使辨士王褒頌漢德作中和樂職宣布詩三篇武年十四五與成都楊覆衆等習歌之帝召見武等於宣室文選褒作傳名曰四子講德四子謂微斯文學虛儀夫子浮遊先生陳丘子也微斯文學問於虛儀夫子曰云云攜手俱遊歷于西州有二人焉乘輅而歌倚輗而聽之敢問所歌何詩浮遊先生陳丘子曰所謂中和樂職宣布之詩益州刺史之所作也刺史見太上聖明股肱竭力德澤洪茂黎庶和睦天人並應纍降瑞福故作三篇之詩以歌詠之也自刺史之來也宣布詔書勞來不怠令百姓遍曉聖德於是皇澤豐沛主恩滿溢百姓歡欣中和咸發是以作而歌之也甘泉頌曰詠中和之歌讀太平之頌漢德象女師篇外戚傳班偼妤誦詩及窈窕德象女師之篇注皆古針戒之書也詩外别有此篇陳女圖以鏡監顧女史而問詩漢歌詩四章述鴻業十五章古今注漢明帝為太子樂人作歌詩四章以贊其德一曰日重光二曰月重輪三曰星重暉四曰海重潤楊終傳章帝東巡鳳皇黃龍並集終贊頌嘉瑞並述祖宗鴻業十五章漢白狼槃木詩見朝貢類漢詩文苑傳王逸作漢詩百二十三篇唐志逸集二卷漢百官詩頌見樂章類魏百一詩隋志應璩百一詩八卷應貞注唐志八卷總集類李夔百一詩集二卷隋志晉李彪撰二卷干寶百志詩九卷文心雕龍應璩百一辭譎義正亦魏之遺直也晉陽秋璩作五言詩百三十篇言時事頗有補益文選載下流一首翰林論應休璉五言詩百數十篇以風規治道蓋有詩人之旨焉璩百一詩序云時謂曹爽曰公今聞周公巍巍之稱安知百慮有一失乎百一之名蓋興於此晉周詩補亡詩續詩夏侯湛傳作昆弟誥云云初湛作周詩成以示潘嶽嶽曰此文非徒溫雅乃别見孝悌之性嶽因此遂作家風詩束晳傳著補亡詩南陔白華華黍由庚崇丘由儀詩序曰晳與司業疇人肄修鄉飲之禮然所詠之詩或有義無辭音樂取節闕而不備於是存思在昔補著其文以綴舊制隋文中子續詩三百六十篇十卷晉郊廟歌詩見樂章類晉詩索靖傳著五行三統正驗論又撰索子晉詩各二十卷晉元正宴會詩見元會類唐志總集晉元正宴會詩集四卷伏滔袁豹謝靈運集傅咸七經詩春秋正義傅咸為七經詩王羲之寫詩見初學記卷隋志咸集十七梁三十卷梁古今詩苑英華隋志十九卷梁昭明太子撰唐志二十卷僧惠淨續集二十卷劉孝孫古今類聚詩苑三十卷舊史四十卷郭瑜古今詩類聚七十九卷許凌詩林英選十一卷總集類宋朝太宗詔類文苑英華以楊徽之精於風雅命編詩為百八十卷隋志文林館詩府八卷後齊百國詩集三十九卷崔光撰六代詩集抄唐志許凌徐陵各四卷唐開元八詩孫逖傳開元中以起居舍人入為集賢修撰時海內少事帝賜羣臣十日一燕宰臣蕭嵩會百官賦天成元澤維南有山楊之華三月英英有蘭和風嘉木等八篇繼雅頌體使逖序所以然唐賜刺史詩許景先傳開元十三年帝自擇刺史許景先等十一人治行詔宰相諸王御史以上祖道洛濱盛具奏大常樂帛舫水嬉命高力士賜詩帝親書且給筆紙令自賦賚絹三千遣之許景先由吏部侍郎為刺史治虢大理卿源光𥙿鄭州兵部侍郎冦泚宋州禮部侍郎鄭溫琦邠州大理少卿袁仁敬杭州鴻臚少卿崔志廉襄州衛尉少卿李升期邢州太僕少卿鄭放定州國子司業蔣挺湖州左衛將軍裴觀滄州衛率崔誠遂州凡十一人唐賜三傑詩宋璟傳開元十七年為尚書右丞相張説為左丞相源乾曜為太子太傅同日拜有詔太官供食太常奏樂會百官尚書省東堂帝賦三傑詩自寫以賜蘇晉序咨日于朔擇時于秋對命王庭受職公府唐開元朝英集志總集類朝英集三卷開元中張孝嵩出塞張九齡韓休崔沔胡皓賀知章所撰送行歌詩唐正聲詩集舊史孫季良開元中為集賢院直學士撰正聲詩集三卷元思敬撰詩人秀句兩卷唐杜甫詩書目二十卷王洙序云甫集初六十卷定取千四百五篇凡古詩三百九十九近體千有六分十八卷别録賦及雜著二十九篇為二卷合二十卷又外集一卷三十五首吳鑄為序志杜甫集六十卷小集六卷樊晃集狄遵度嗜甫詩讃其集後本傳贊唐興詩人承陳隋風流浮靡相矜至宋之問沈佺期等研揣聲音浮切不差而號律詩競相襲沿逮開元間稍裁以雅正然恃華者質反好麗者壯違而人得一槩皆自名所長至甫渾涵汪茫千彚萬狀兼古今而有之元稹謂詩人以來未有如子美者甫又善陳時事律切精深至千言不少衰世號詩史韓愈於文章慎許可至歌詩獨推李杜文章在光焰萬丈長誠可信云程子曰詩之盛莫如唐唐人善論文莫如韓愈愈之所稱獨高李杜大歷十才子盧綸吉中孚韓翃錢起司空曙苗發崔洞耿湋夏侯審李端能詩齊名憲宗詔中書舍人張仲素訪集遺文文宗尤愛綸詩悉索家笥得五百篇唐曲江亭應制詩劉太真傳德宗貞元四年九月癸丑重陽節賜百僚宴于曲江亭帝自賦詩以清字為韻仍勑宰相擇文人應制賡和李泌等請羣臣皆和詩成帝自加考校以李紓太真等四人為上于邵鮑防等四人為中張濛二十三人為下與擇者四十一人會要作三十三人惟泌晟燧三宰相無所差次按曲江亭為宴樂之地所謂江頭宫殿鎖千門是也唐元和聖德詩韓愈作凡千有二十四字唐平淮夷雅栁宗元作皇武方城二篇唐河嶽英靈集志總集類殷璠二卷書目集常建至閻防二十四人詩總二百三十四首各序其詩格於首風序曰貞觀標格漸高開元骨始備唐中興間氣集志高仲武二卷書目集至德大厯名人錢起張衆甫等二十六人詩一百三十二首序云五言詩一百四十七言附之略品敘其詩格且摘警句列於首以至德興復風雅復振故名唐詩唐詩類選志李戡唐詩三卷李戡傳常惡元和有元白詩多纎艷不逞而世競重之乃集詩人之類夫古者斷為唐詩以譏正其失志顧陶唐詩類選二十卷大中校書郎書目凡一千二百三十二首分二十卷詩評詩品志文史類顔竣詩例録二卷鍾嶸詩評三卷書目詩評一卷自漢以來能詩者一百二十二人分三品為評舊唐史李嗣真撰詩品一卷王昌齡詩格詩評序陳思為建安之傑公幹仲宣為輔陸機為太康之英安仁景陽為輔謝客為元嘉之雄顏延年為輔此皆五言之冠冕文辭之命世近彭城劉士章俊賞之士疾其淆亂欲為當世詩品口陳標榜其文未遂嶸感而作焉唐百家詩選書目二十卷以明皇德宗所製為首唐絶句詩宋朝淳熙中洪邁編唐人絶句詩為六帙後入翰林孝宗召對偶及宫中書扇事邁因以所編進上命置復古殿書院邁自序謂初編得五千四百篇後採樂府小説諸詩撮其可讀者合為八十二卷唐雅宋朝仁宗時李及之進唐雅十篇范師道進詠唐史詩五軸仁宗時侍御史太平興國升平詩四年田錫獻升平詩三十章遷左拾遺直史館賜緋魚萬適雍熙詩二百首梁鼎著學古詩五十篇真宗祀汾陰錢易獻宋雅一篇淳化賞花詩三年三月丙午宴後苑上臨池釣魚詔羣臣賦詩特召楊億賦詩御座之側因習射丁未以羣臣所賦賞花詩五十二首付史館宋綬祥符中從幸後苑賞花羣臣皆賦詩命綬晏殊為序祥符諸王唱酬詩五年三月庚寅製諸王唱酬詩序示輔臣鄆王安王及德潤德明詩集序共四首以集付祕閣六月甲寅內出續求訪安王詩筆示輔臣上作序冠篇仍付祕閣徐王元偓獻與允中唱和詩一卷製序賜之後取其歌詩文記纂為六卷墨迹三卷上親作二序命藏祕府又見御詩類祥符玉宸殿賦詩見觀書類天禧賀建儲闈禮成詩見册禮類天聖清輝殿賦詩蘂珠殿賦詩四年四月乙卯出後苑雙頭牡丹圖示輔臣令館閣獻詩賦兩制自章得象以下十三人三館自康孝基以下二十七人歌詩一百四十篇表云永平神爵之頌孝明稱美者五人貞元重九之篇德宗考第於三等八年三月十九日壬申觀唐明皇山水字石于清輝殿命從臣作歌詩中書第優劣祕閣校理韓羲辭獨不成八月六日丁亥天章閣觀書元真殿觀榖宴蘂珠殿宰臣以下賦詩九年三月十七日賞花釣魚命從臣賦詩以新字為韻閏十月戊辰宴太清樓從臣賦詩各一篇皇雅尹洙撰十篇天監西師耆武憲古大鹵帝籍庶土帝制皇治太平皇朝玉堂詩書目三十二卷集皇朝詩歌以神宗御製元豐宫詞等十五篇為首宋百家詩選曾慥紹興中采名人詩起冦準終葉夢得並記其行事凡五十卷如歐蘇王黃之詩為世所傳者皆不載又續選二十卷紹興中興復古詩十八年七月癸未敷文閣待制張嵲獻之八月二十七日詔嘉奬紹興聖統詩中興聖德詩十八年黃友端進紹興聖統詩一篇二月十七日詔免解二十一年十一月二日程端厚獻聖德詩除直徽猷閣二十二年九月二十四日劉一止進中興聖德詩除敷文待制十一月十一日錢周材進紹興聖德詩除集英修撰嘉定熙朝盛典詩二卷趙師􅋷撰嘉定九年取郊祀明堂大朝會孟饗典禮為一百四十二詩紀儀文之盛次韻作詩於古無有高嚴韋郭來往杜少陵間不過和意自元白諸人茲體稍出五言詩之源生於國風廣於離騷著於李蘇盛於曹劉鄭都則七子均賦梁苑則三英接曲唱酬之制由是生焉詩為樂心聲為樂體樂體在聲瞽師務調其器樂心在詩君子宜正其文樂辭曰詩詩聲曰歌文心雕龍王澤殄竭風人輟采春秋觀志諷誦舊章逮楚國諷怨則離騷為刺秦皇滅典亦造仙詩史記始皇使博士為仙真人詩及行所遊天下傳令樂人歌弦之漢成帝品録三百餘篇朝章國采亦云周備而辭人遺翰莫見五言所以李陵贈蘇武詩班倢妤怨歌行見疑於後代也案召南行露始肇半章孺子滄浪亦有全曲則五言久矣又古詩佳麗或稱枚叔文選注古詩蓋不知作者或云枚乘其孤竹一篇則傅毅之詞古詩有冉冉生孤竹至於張衡怨篇清典可味見文選注太平御覽仙詩緩歌雅有新聲暨建安初五言騰踴晉世羣才稍入輕綺江左篇製溺乎玄風朱文公曰古今之詩凡有三變蓋自書傳所記虞夏以來下及漢魏自為一等自晉宋間顔謝以後下及唐初自為一等自沈宋以後定著律詩下及今日又為一等然自唐初以前其為詩者固有髙下而法猶未變至律詩出而後詩之與法始皆大變以至今日益巧益密而無復古人之風矣歐陽文忠公曰古者登歌清廟太師掌之諸侯之國亦各有詩以道其風土性情至於投壺饗射必使工歌以達其意以為賓樂蓋詩者樂之苗裔與漢之蘇李魏之曹劉得其正始宋齊而下得其浮淫流佚唐之時子昂李杜沈宋王維之徒或得其淳古淡泊之聲或得其舒和高暢之節而孟郊賈島之徒又得其悲愁鬱堙之氣敖陶孫器之評詩曰魏武帝如幽燕老將氣韻沈雄曹子建如三河少年風流自賞鮑明遠如飢鷹獨出奇矯無前謝康樂如東海揚帆風日流麗陶彭澤如絳雲在霄舒卷自如王右丞如秋水芙蓉倚風自笑韋蘇州如園客獨繭暗合音徽孟浩然如洞庭始波木葉微脫杜牧之如銅丸走坂駿馬注坡白樂天如山東父老課農桑事事言言皆著實元微之如李龜年説天寶遺事貌悴而神不傷劉夢得如鏤冰雕瓊流光自照李太白如劉安雞犬遺響白雲核其歸存恍無定處韓退之如囊沙背水惟韓信獨能李長吉如武帝食露槃無補多欲孟東野如埋泉斷劒臥壑寒松張籍如優工行鄉飲酬獻秩如時有詼氣栁子厚如高秋獨眺霽晚孤吹李義山如百寶流蘇千絲鐵網綺密瓌妍要非適用本朝蘇東坡如屈注天潢倒連滄海變眩百怪終歸雄渾歐公如四瑚八璉止可施之宗廟荆公如鄧艾縋兵入蜀要以險絶為功山谷如弘景祗詔入官析理談玄而松風之夢故在梅聖俞如關河放溜瞬息無聲秦少遊如時女步春終傷婉弱后山如九皋獨淚深林孤芳沖寂自妍不求識賞韓子蒼如梨園按樂排比得倫吕居仁如散聖安禪自能竒逸其他作者未易殫陳獨唐杜工部如周公制作後世莫能擬議鞏仲至曰潄六藝之芳潤以求真淡黃魯直曰以俗為雅以故為新百戰百勝如孫吳之兵棘端可以破鏃如甘蠅飛衛之射此詩人之竒也賦文章流别論曰賦者敷陳之稱釋名曰敷布其義謂之賦漢詩賦五種詩賦百六家藝文志自屈原二十五篇至王褒十六篇凡賦二十家三百六十二篇自陸賈三篇至朱宇三篇賦二十一家二百七十四篇入揚雄八篇自孫卿十篇至路恭八篇賦二十五家百三十六篇自客主賦十八篇至隱書十八篇凡雜賦十二家二百三十三篇自高祖歌詩二篇至南郡歌詩五篇凡歌詩二十八家三百一十四篇凡詩賦百六家千三百一十八篇入揚雄八篇登高能賦可以為大夫春秋之後大儒孫卿及楚臣屈原離讒憂國皆作賦以風咸有惻隱古詩之義其後宋玉唐勒漢興枚乘司馬相如下及揚子雲競為侈麗閎衍之詞沒其風諭之義是以揚子悔之自孝武立樂府而采歌謠於是有代趙之謳秦楚之風皆感於哀樂亦可以觀風俗知薄厚云序詩賦為五種六義附庸蔚成大國兩都賦序武宣之世崇禮官考文章云云孝成之世論而録之奏御者千有餘篇漢皇太子生賦八言七言詩魏贊述太子賦枚皋傳武帝春秋二十九乃得皇子羣臣喜故皋與東方朔作皇太子生賦元朔元年春及立皇子禖祝受詔所為皆不從故事重皇子故也衛后立皋奏賦以戒終從行至甘泉雍河東東巡狩封泰山塞決河宣房遊觀三輔離宮館臨山澤弋獵射馭狗馬蹴鞠刻鏤上有所感輒使賦之凡可讀者百二十篇東方朔傳朔之文辭有封泰山責和氏璧及皇太子生禖屏風殿上柏柱平樂觀賦獵八言七言上下晉灼曰八言七言詩各有上下篇王褒傳虞侍太子作甘泉洞簫頌太子令後宫左右誦讀之志枚皋賦百二十篇王褒賦十六篇隋唐志王褒集五卷文選有洞簫賦藝文類聚有甘泉宫頌魏卞蘭有贊述太子賦曹植有皇子生頌漢司馬遷賦相如賦志司馬遷賦八篇司馬相如賦二十九篇漢揚雄賦志十二篇揚雄傳蜀有司馬相如作賦弘麗溫雅雄心壯之擬以為式作反離騷廣騷又旁惜誦以下至懷沙一卷名曰畔牢愁成帝時正月從上甘泉還奏甘泉賦以風三月將祭后土還上河東賦以勸十二月羽獵因校獵賦以風明年從至射熊館還上長楊賦藉翰林為主人子墨為客卿以風文選注引揚雄蜀都賦太玄賦核靈賦又引釋愁北史司馬膺之好讀太玄經又注雄蜀都賦漢四賦揚雄傳辭莫麗於相如作四賦甘泉河東校獵長楊漢頌德賦志雜賦有雜行出及頌德賦二十四篇雜四夷及兵賦二十篇漢論都賦杜篤傳光武時以關中表裏山河先帝舊京不宜改營雒邑上論都賦唐志杜篤集五卷隋志一卷王景傳杜陵杜篤奏上論都欲令車駕遷還長安景以宫廟已立恐人情疑惑會有神雀諸瑞乃作金人論頌洛邑之美天人之符漢兩都賦班固傳時京師修起宫室濬治城隍而關中耆老猶望朝廷西顧固乃上兩都賦西都東都盛稱洛邑制度之美以折西賓淫侈之論隋志班固集十七卷東都賦有五篇之詩明堂辟雍靈臺寶鼎白雉漢二京賦張衡傳天下太平日久王侯踰侈乃擬兩都作二京賦因以諷諫十年乃成隋志張衡集十一卷隋志薛綜注張衡二京賦二卷吳薛綜述二京解一云薛綜音衡又作南都賦傅毅有洛都賦唐李庾作西都東都賦漢神爵賦隋志二卷傅毅撰唐志毅集五卷隋志二卷魏趙都許都洛都賦劉劭傳作趙都賦明帝美之詔劭作許都洛都賦時外興軍旅內營宫室劭作二賦皆諷諫焉隋志劉劭集二卷文選注引何楨許都賦吳質魏都賦水經注引徐幹齊都賦晉三都賦左思傳思辭藻壯麗造齊都賦一年乃成隋志二卷並音復欲賦三都詣張載訪岷卭之事構思十年門庭藩溷皆著筆紙遇得一句即便疏之自以所見不博求為祕書郎賦成皇甫謐為其序張載為注魏都劉逵注吳蜀而序之衛瓘又作略解張華見而嘆曰班張之流也使讀之者盡而有餘久而益新於是豪貴之家競相傳寫洛陽為之紙貴隋志左思集二卷梁有五卷隋志五都賦六卷張衡左思孫綽絶重張衡左思之賦每云三都二京五經之鼓吹也文選注引劉楨魯都賦曰蓋如飛鶴馬似遊魚晉揚都賦庾闡傳為給事中吳國內史虞潭為太伯立碑闡制其文又作揚都賦為世所重曹毗亦著揚都賦亞於闡隋志闡集九卷毗集十卷世説庾闡揚都賦成庾亮云可三二京四三都於是人人競寫都下為之紙貴晉天地賦成公綏傳為天地賦張華重其文以為絶倫隋志成公綏集九卷梁十卷晉中興賦王廙傳丞相導從弟為荆州刺史元帝即位奏中興賦曰雖未足宣揚盛美亦詩人嗟嘆詠歌之義也隋志廙集十卷晉南郊賦郭璞傳詞賦為中興之冠作南郊賦帝嘉之以為著作佐郎水經注引南郊賦璞著江賦辭甚偉隋志璞集十七卷晉朝會賦南齊樂志角抵像形雜伎漢世張衡西京賦是其始也魏世則事見陳思王樂府宴樂篇晉世則見傅玄元正篇朝會賦禮志傅玄朝會賦云華燈若乎火樹熾百枝之煌煌隋志玄集十五卷梁五十卷唐述聖賦惟皇誡德賦大寶針玉諜真記謝偃傳太宗朝為弘文館直學士帝召見欲偃作賦先為序一篇言天下乂安功德茂盛意授偃使賦偃緣帝旨名篇曰述聖帝悅賜帛數十初帝即位張藴古上大寶針諫帝以民畏而未懷其辭挺切擢大理丞偃又獻惟皇誡德賦其序大略言治忘亂安忘危逸忘勞得忘失四者人主莫不然是以聖人處宮室則思前王所以亡朝萬國則思已之所以尊循府庫則思今之所以得視功臣則思輔佐之始見名將則思用力之初如此則人無易心天下何患不化哉旦行之堯舜暮失之桀紂豈異人哉蓋規帝成功而自處至難云又撰玉諜真紀以勸封禪李百藥工詩而偃善賦時稱李詩謝賦志謝偃集十卷舊史惟皇誡德賦慮失者常得懷安者必危是以戰戰栗栗日謹一日守約守儉去奢去逸惟賢是授惟民所恤則四皇不足五六帝不足七若夫忠良是棄諂佞斯奬則夏桀可二殷辛易兩太宗御製述聖賦序見文苑英華宋朝天聖四年閏五月宋綬録進惟皇誡德賦唐贊道賦李百藥傳貞觀四年政要云五年授太子右庶子太子戲媟無度乃作贊道賦以諷他日帝曰朕見卿賦述古儲二事勸勵甚詳賜綵三百段馬一匹賦略曰惟忠與敬曰孝與仁則可以下光四海上燭三辰禮賢於秋實歸道於春卿異洞簫之虞侍殊飛蓋之緣情見貞觀政要唐清暑賦崔仁師傳太宗幸翠微宫上清暑賦以諷帝稱善賜帛五十段唐太一樞會賦志五行類李淳風太一樞會賦一卷玄宗注唐南郊賦徐彥伯傳會郊祭上南郊賦辭致典縟見文苑英華唐三大禮賦玄宗天寶十三載杜甫進朝獻大清宫朝享大廟有事于南郊三大禮賦投延恩匭舊史天寶末獻三大禮賦玄宗奇之召試文章唐含元殿賦李華傳著含元殿賦萬餘言蕭穎士曰景福之上靈光之下唐大明賦見針類唐海潮賦志盧肇一卷魯史分門屬類賦見春秋類楊鈞三卷以左氏事類分十門各為律賦一篇乾德四年奏御詔褒之乾德五鳳樓賦乾德中梁周翰獻擬制二十篇擢為右拾遺會修大內上五鳳樓賦端拱事類賦端拱中祕閣校理吳淑撰百篇以獻詔令注釋淳化四年成三十卷九月庚寅朔以為水部郎咸平中淑以浚郊上都纍聖丕業作論都賦以獻淳化東西京賦淳化三年三月賜楊億及第億年十二讀書祕閣因擬文選兩京賦作東西京賦以進太宗嘉之詔學士院試舒州進甘露頌帝益賞其才咸平四年二月五日錢惟演獻東京賦吳淑作論都賦淳化三年春和㠓獻觀燈賦付史館咸平宋都賦咸平四年八月乙未直史館劉蒙叟上章獻宋都賦述皇宋由兹地建號宜升宋州為都立祖宗廟上嘉之命史館檢故事以聞王仲敷作南都賦咸平春秋字源賦楊文舉注尹玉羽春秋字源賦咸平四年正月乙酉知河南府李至上之以賦送祕閣徐鍇賦苑二百卷祥符皇子冠禮賦祥符八年十二月戊子著作佐郎晏殊上皇子冠禮賦詔奬之元豐汴都賦元豐七年三月壬戌以太學生周邦彥為太學正邦彥獻汴都賦故擢之紹興三都賦紹興十三年三月二十八日王鈇上親饗太廟賦除直徽猷閣十五年十一月癸亥高衮獻二都賦與教官十七年十二月十三日施諤進中興頌一篇紹興雅十篇行都賦一首免解淳熙明堂賦頌堯賦見後河圖天地二運賦崇文目卜筮類一卷論天地二運蓋三命書也不著撰人歷代紀元賦書目一卷皇朝楊備撰次漢至五代正統年號為賦一首又别為宋頌四章梁武帝歷代賦見御製後周扈載次歷代有國廢興治亂之迹為運源賦甚詳趙鄰幾作禹别九州賦萬餘言范諷獻東封賦鞠常著四時成嵗賦萬餘言錢熙作四夷來王賦以獻凡萬餘言太宗嘉歎以為直史館文心雕龍曰賦者受命於詩人而拓宇於楚辭也於是荀況禮智漢志荀卿賦十篇今其存者成相佹詩并賦篇而七賦篇曰禮曰知曰蠶曰針曰雲宋玉風釣見文選古文苑爰錫名號秦世頗有雜賦漢志秦時雜賦九篇漢初辭人陸賈扣其端志二篇賈誼振其緒七篇枚馬同其風枚乘九篇相如二十九篇王揚騁其勢王褒十六篇揚雄十二篇觀夫荀結隱語宋發巧談枚乘莬園見古文藝文類聚相如上林賈誼鵩鳥子淵洞簫孟堅兩都張衡二京子雲甘泉延壽靈光此十家並辭賦之英傑也仲宣王粲靡密偉長徐幹博通太沖左思安仁潘嶽䇿勳於鴻規士衡陸機子安成公綏底績於流制景純郭璞綺巧彥伯袁宏梗槩亦魏晉之賦首也原夫登髙之旨蓋覩物興情情以物興故義必明雅物以情觀故詞必巧麗文雖新而有質色雖糅而有儀此立賦之大體也流别論曰古詩之賦以情義為主以事類為佐今之賦以事形為本以義正為助情義為才則言省而文有例事形為本則言富而辭無常文之煩省辭之險易蓋由於此盛覽問司馬相如以作賦相如曰合綦組以成文列錦繡而為質一經一緯一宫一商此賦之迹也賦家之心包括宇宙㧾覽人物斯乃得之於內不可得而傳針胡廣曰針諫之興所由尚矣聖君求之於下忠臣納之於上劉協曰針者所以攻疾防患喻針石也夏針文傅篇見御製類胡廣百官針序曰墨子著書稱夏針之辭後魏李彪云傳著夏氏之針詩録商家之頌王元長䇿秀才文注引周書夏針商針吕氏春秋有始覽第一名類篇商針云天降災布祥並有其職以言禍福人或召之也文心雕龍夏商二針餘句頗存盤庚無伏小人之攸針周庭燎針詩庭燎美宣王也因以針之郊特牲注庭燎之差天子百公蓋五十侯伯子男皆三十周師針周針周語召公曰天子聽政使公卿至於列士獻詩瞽獻典史獻書師針􅕓賦矇誦百工諫庶人傳語近臣盡規親戚補察瞽史教誨耆艾修之而後王斟酌焉注師小師也針刺王闕以正得失左氏傳晉師曠曰史為書瞽為詩工誦針諫大夫規誨士傳言庶人謗商旅于市百工獻藝楚語衛武公針警於國作懿戒以自警殷武丁得傅説升以為公使朝夕規誨針諫曰必交修余無余棄也齊桓晉文近臣諌遠臣謗輿人誦以自誥也呂氏春秋有始覽謹聽篇不知則問不能則學周針曰夫自念斯學德未暮學賢問三代之所以昌也後周蕭圓肅太子針曰惟王建國辨方正位必立太子為皇之二是以易稱明兩禮云上嗣東庠養德震方主器左史書言右史書事束髮就學宵雅夙肄朝夕百篇乙夜乃寐愛日惜力寸陰無棄視膳再飯寢門三至小心翼翼大孝蒸蒸詢謀計慮問對疑丞安樂必敬無忘戰兢天道福謙人道惡盈漢嗣不絶乎馳道魏儲回環乎鄴城前史攸載後世揚名三善既備萬國以貞姬周長久實係元良嬴秦短祚亦由少陽雖卜年七百有德彌昌數世一萬無德亟亡敬之敬之天維顯思光副皇極永固洪基宫臣再拜敢告職司周虞人針楚針左傳襄七年魏絳曰昔周辛甲之為太史也武王大史命百官官針王缺針莫善於虞針各以其官所掌而為針辭於虞人之針曰芒芒禹迹畫為九州經啓九道民有寢廟獸有茂草各有攸處德用不擾在帝夷羿冒于原獸忘其國恤而思其麀牡武不可重用不恢于夏家獸人司原敢告僕夫疏云虞人掌獵故以獵為針楚語曰民生在勤勤則不匱楚有針尹之官文心雕龍曰魏絳諷君於后羿楚子訓民於在勤衛武公在輿有旅賁之規居寢有贄御之針周大正針見刑制漢百官針胡廣傳又春秋正義初揚雄依虞針作十二州針二十五官針其九針亡缺其後涿郡崔駰及子瑗子玉又臨邑侯劉騊駼增補十六篇正義云瑗子實世補其闕太傅胡廣復繼作四篇文甚典美乃悉撰次首目為之解釋名百官針凡四十八篇春秋正義云皆放虞針為之揚雄傳雄以為針莫善於虞針作州針注九州之針也載選注引益州針古文苑所止四十一篇十二州針冀兗梁青雍徐幽揚并荆交豫官針揚雄十二光祿勳衛尉太僕吾廷尉作大鴻臚城宗正尉大司農苑少府執金將大匠門校上林令崔駰七太常司太尉大河南尹書司空徒理尚崔實一諫大夫崔子玉九尚書太博士北東觀候關都尉郡守軍中侍中河隄謁者司隸校尉書目二十四針一卷揚雄撰州針十二衛尉等針十二文心雕龍揚雄稽古始範虞針卿尹州牧二十五篇及崔胡補綴㧾稱百官指事配位鞶鑑可徵所謂追清風於前古攀辛甲於後代藝文志揚雄所序三十八篇針二唐志雄集五卷文選注引揚雄衛尉針又引城門校尉針國三老針又侍中針曰光光常伯又引劉騊駼郡太守針太平御覽引揚雄太官令針太史令針胡廣邊都尉針又引胡廣百官針序班固傳注引揚雄司空針曰普彼坤靈侔天作合光武紀注引崔瑗中壘校尉針梁天監六年袁峻擬揚雄官針奏之漢酒針陳遵傳黃門侍郎揚雄作酒針以諷諫成帝其文為酒客難法度士譬之於物曰子猶瓶矣觀瓶之居居井之眉自用如此不如鴟夷後崔駰傳著酒針御覽引駰酒針後魏高允上酒訓高祖悅之常置左右漢尚書針初學記後漢繁欽尚書針云云藝文類聚揚雄尚書針晉傅玄吏部尚書針云易貴好爵書謹官人衡人司書胡廣侍中針云云崔德正大理針晉張華大司農針漢中壘校尉針司空針光武紀注崔瑗中壘校尉針曰堂堂黃帝設為壘壁班固傳注引揚雄司空針見上漢外戚針崔琦傳初舉孝廉為郎梁冀聞其才請與交冀行多不軌琦數引古今成敗以戒之冀不能受乃作外戚針隋志琦集一卷其略曰履道者固杖勢者危漢督軍御史針高彪傳第五永為督軍御史使督幽州百官大會祖餞於長樂觀議郎蔡雍等皆賦詩彪獨作針略曰古之君子即戎忘身無曰已能務在求賢淮陰之勇廣武是尊唐志彪集二卷晉女史針唐彤史張華傳懼后族之盛作女史針以諷曰婦德尚柔含章貞吉樊姬感莊不食鮮禽衛女矯桓耳忘和音志厲義高二主易心玄熊攀檻馮媛趍進夫豈無畏知死不吝班女有辭割歡同輦夫豈無懷防微慮遠歡不可以瀆寵不可以專專實生慢愛極則遷隋志華集十卷裴頠亦有女史針皇甫規女師針傅幹皇后針隋志有女史針圖一卷詩貽我􅊮管毛氏曰古者后夫人必有女史􅊮管之法石氏星經有女史一星周禮女史八人掌王后之禮職以詔后理內政統內官書內令唐志尚儀局彤史二人正六品有女史二人晉保傅針太師針職官分紀王廙之保傅針曰保傅之賢明宗國用寧嵇康傳作太師針亦足以明帝王之道晉丞相針尚書令針藝文類聚晉陸機丞相針曰導民在簡為政以仁文選注摯虞尚書令針曰補我衮闕闡我王猷晉乘輿針潘尼傳為著作郎為乘輿針以為王者膺受命之期揔萬機而撫四海簡羣才而審所授孜孜於得人汲汲於聞過不敢斥至尊故以乘輿名篇晉侍臣針溫嶠傳遷太子中庶子深見寵遇太子與為布衣之交數陳規諷又獻侍臣針其略云不以賢自盛不以貴為榮思有虞之蒸蒸尊周文之翼翼屏彼佞諛納此亮直傅玄有太子少傅針後周蕭圓肅作少傅針齊王攸為太傅獻針曰固親以道修身以敬晉國子針王濟傳云云文心雕龍曰潘朂符節要而失淺溫嶠侍臣博而患繁王濟國子文多事寡潘尼乘輿義正體蕪初學記晉成公綏市長針晉選曹針學針李重傳為選曹尚書著選曹針置左右以明審才之宜隋志李重集二卷針傅玄有吏部尚書通鑑咸康四年六月王導以李充為丞相掾充好刑名之學深抑虛浮之士著學針曰名之攸彰道之攸廢李充集二十二卷晉逸士針江逌傳著阮藉序贊逸士針見藝文類聚又庾凱幽人針御史針初學記崔篆御史針曰簡上霜凝筆端風起傅咸御史中丞針執憲之綱秉國之憲梁武帝凡百針見藝文類聚隋匠人針刺史針杜正藏舉秀才蘇威監試擬匠人針弓銘何妥為龍州刺史為刺史針勒于州門外唐大寶針謝偃傳太宗即位直中書省張藴古上大寶針諷帝以民畏而未懷其辭挺切擢大理丞舊史有傳通鑑武德九年十二月前幽州記室直中書省張藴古上貞觀政要張藴古以貞觀二年幽州揔管記室兼直中書省奏上宋真宗時景德初陳彭年於誕節亦獻大寶針曰任賢勿二堯所以昌改過不吝湯所以王唐承華針李義府傳晉王為太子義府除舍人獻針云佞諛有類邪巧多方其萌不絶其害必彰義府方諂事太子而文致若讜直者太子表之優詔賜帛周王褒有皇太子針見東宫類唐清白針許圉師傳高宗時圉師為相州刺史以寬治人州刻石頌美部有受賕者不忍案但賜清白針其人自愧更為廉士唐諭善針韋承慶傳儀鳳中太子監國承慶為司議郎進諭善針唐獄官針裴諝傳德宗即位諝惡法吏舞文獻獄官針文粹張説有獄針唐君臣針杜希全傳德宗時為朔方節度奉天之狩引兵赴難賊平遷靈鹽夏豐節度使將即屯獻體要八章帝嘉納之賜君臣針一篇會要貞元九年十二月賜君臣針大略曰在昔稷契實正舜禹逮兹魏徵佑我文祖肆豫寡昧獲纘丕緒臣哉鄰哉爾翼爾輔高秋始肅我武維揚輟屯禁衛殿於大邦戀闕方甚嘉言乃昌總彼千慮備于八章宣父有言起豫者商汝其夙夜明保朕躬毋曰爾身在外爾誠不通善言之應千里攸同導彼遐俗達于四聰華夷仰德時乃之風又曰商有盤銘周有欹器或戒以辭或警以事唐尚書二十四司針栁仲郢傳著尚書二十四司針韓愈見之大加咨賞選注引摯虞尚書令針曰補我衮闕闡我王猷初學記云張華唐龍樓針龍樓門名見東宮類歸登獻龍樓針以諷皇太子元和四年十月癸巳登以工侍充太子諸王侍讀唐太醫針栁公綽傳唐憲宗喜武功數出遊畋元和五年舊紀十一月丙寅栁公綽奏太醫針以諷帝高其才遣使謂曰卿言氣行無間隙不在大愛朕深者當置之坐隅踰月十二月壬午自吏部郎中拜御史中丞會要元和五年十一月吏部郎中栁公綽獻太醫針崔實太醫令針動不肆勤靜不宴逸唐丹扆六針李德裕傳敬宗荒淫數遊幸狎比羣小聽朝簡忽德裕為浙西觀察上丹扆六針表曰臣在先朝屬多隂沴嘗獻大明賦以諷今日盡節明主亦猶是也其一曰宵衣諷視朝希晚也二曰正服諷服御非法也三曰罷獻諷斂求怪珍也四曰納誨諷棄忠言也五曰辨邪諷任羣小也六曰防微諷偽遊輕出也詞皆明直婉切帝雖不能用猶敕學士韋處厚諄諄作詔謝其意通鑒寶厯元年壬午德裕獻之唐續虞人針白居易傳穆宗好畋遊獻續虞人針以諷曰唐受天命十有二聖兢兢業業咸勤厥政鳥生深林獸在豐草春搜冬狩取之以道鳥獸蟲魚各遂其生民野君朝亦克用寧在昔玄祖厥訓孔彰馳騁田獵俾心發狂何以效之曰羿與康曾不是戒終然覆亡高祖方獵蘇長進言不滿十旬未足為歡上心既悟為之輟畋降及宋璟亦諫玄宗溫顔聽納獻替從容璟趨以出鷂死握中噫逐獸于野走馬于路豈不快哉銜橛可懼審其安危惟聖之慮集云元和十五年唐縣令針文苑英華李磎授李昌緯縣令制云宣帝命明法吏刪刑書為統類十篇盡出繁詞而獨著元結縣令針是於養人之官殷勤深切矣古之奇有縣令針並見文粹唐霸國針志别集李靖一卷文粹梁肅有兵針雍熙守成針宋大初傳雍熙三年通判成都府會詔求直言作守成針以獻端拱針端拱元年右拾遺直史館王禹稱初拜即日獻端拱針一篇極陳規諷表曰夏后有盤盂之銘周王有几杖之誡敢證斯義用導愚衷又上禦戎十事咸平鳳扆針國史張知白傳咸平中奏疏曰內和人心而後可以寧夷狄此崇陽抑陰之義也真宗覽而異之召試舍人院擢右正言獻鳳扆針景德續丹扆針景祐斧扆針紹興黼扆針景德元年二月進士栁察續李德𥙿丹扆針五篇以獻庚申召試賜出身察又擬白居易作䇿問七十五篇目為贊聖䇿材景祐元年太子少傅朝逈獻斧扆慎刑針大順審刑頌紹興八年十二月丁卯王揚英為太常博士揚英獻所著黼扆針會要作誡十二篇上召對而有是命書目揚英黼扆誡一卷會要十一月二十三日詔録本進入當置坐右朝夕觀省又與召對景德大寶針陳彭年傳景德初修起居注獻大寶針景祐金華五針聖治針景祐三年七月乙酉翰林侍讀學士馮元上金華五針有詔褒答三司判官謝絳言事進聖治五針曰紹聞馭臣內戒慎命敬變云或云絳獻大寶針康定居安謹治針康定元年四月丁亥梁適為右正言初適進居安謹治針擢開封推官不半嵗踐諫職康定四針太宗御書曲禮祕閣書有太宗御書曲禮字為行書首篇四句曰敖不可長欲不可縱志不可滿樂不可極康定二年七月張方平在諫垣廣其義為四針以獻序曰王者奉若天命以臨萬方謹乃迪德無時怠豫以義制事以禮制心以輯寧邦家用咸和萬民于後佚王罔自抑畏罔顧諟天之明命以若先民攸訓不迪率典德用弗類故人君保邦制治之道慎厥身修思永兹惟艱哉太宗形於翰墨先帝緘諸祕府將以嘉言善訓貽為孫謨豈唯筆精墨妙云爾四針敖欲志樂慶厯勸講針慶厯四年二月丙辰御迎陽門命曾公亮講詩王洙講祖宗聖政録丁度讀前漢書初元昊叛罷講筵趙師民獻勸講針見文鑑至是復命講淳熙三年侍講李燾以經筵少開録是針以諷端平三年正月侍讀洪咨夔獻緝熙針皇祐宗室寶針六針見宗戚類治平皇極針治平元年十二月庚子知制誥祖無擇獻皇極針英宗善其言詔褒答之真宗初詔羣臣言事右司諌梁皓作聽政針以獻淳熙元年李燾上快針引太祖退朝悔乘快決事以諌上曰朕當揭之坐隅紹興文思針紹興二十六年祕書郎唐文若為文思針以獻其略曰於赫我皇兵既休矣休兵如何莫如治兵居安思危邦乃攸寧爰整其旅文王以興載舞干羽舜仁用成向戍弭兵春秋所懲蕭俯去兵既亂乃萌又曰兵非以殘以兵休兵凡千五百餘言當時韙之選德殿六針孝宗習射及引對羣臣裁決庶政之便座也崔端詩上針六首政令聽察用射淳熙十針十六年春光宗登極右諫議大夫謝諤獻十針一曰業難成而易敗宜兢兢保之二曰道甚簡易在尊所聞三曰畏天之威四曰存心公正五曰賞罰不可妄六曰奬廉戒貪七曰訪民疾苦八曰理財以義九曰姦諛生亂甚於夷狄十曰自治乃可理外紹熙末寧宗受禪司農少卿劉光祖入對獻謹始五針曰陛下新服厥命人皆望謹始於庶政臣獨願謹始於五事讀至思針上曰要當從原頭用功對曰微臣千百言不如陛下原頭一語致力于此則貌言視聽俱治矣孫覺為昌王記室王問終身之戒為陳諸侯之孝作富貴二針玉海卷五十九
