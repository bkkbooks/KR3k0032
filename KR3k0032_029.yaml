body:
  text: 玉海卷二十九宋王應麟撰聖文御製詩歌伏羲網罟詠見樂類神農豐年詠見頌類堯大唐歌文心彫龍堯有大唐之歌舜造南風之詩二文辭達而已大禹成功九叙惟歌唐歌在昔則廣於黃氏虞歌卿雲文於唐時野老吐何力之談郊童含不識之歌尚書大傳䜎然作大唐之歌又見音樂詩正義六藝論云唐虞始造其初至周分為六詩堯歌古今樂録堯郊天地祭神座上有響誨堯曰水方至為害命子救之堯乃作歌謝希逸琴論曰神人暢堯帝所作堯彈琴感神人現故制此弄也清廟穆兮承予宗百僚肅兮于寢堂醊禱進福求年豐有饗在坐敕予為害在元中欽哉皓天德不隆承命任禹寫中宫舜勑天命歌書帝庸作歌曰勑天之命惟時惟幾乃歌曰股肱喜哉元首起哉百工熙哉勑正也時至幾動可以觀天命矣此二句乃導其意於詩歌之先舜南風詩禮記䟽南風詩名孝子之詩舜以教天下之孝見琴類古今樂録舜彈五弦之琴歌南風之詩謝希逸琴論舜作思親操孝之至也史記樂書昔者舜作五弦之琴以歌南風注王肅曰南風育養之詩也索隠曰此詩之辭出尸子及家語家語其詩曰南風之薰兮可以觧吾民之愠兮南風之時兮可以阜吾民之財兮舜卿雲歌尚書大傳舜時俊乂百工相和而歌卿雲帝倡之曰卿雲爛兮糺縵縵兮日月光華旦復旦兮崔駰傳注引大傳八伯稽首曰明明上天爛然星陳日月光華弘于一人帝乃載歌曰日月有常星辰有行四時從經萬姓允誠於予論樂配天之靈宋符瑞志同選注大傳曰虞舜歌樂曰和伯之樂舞玄鶴吕氏春秋舜自為詩曰普天之下莫非王土率土之濵莫非王臣禹九歌書大禹謨九功惟敘九敘惟歌勸之以九歌離騷啟九辯與九歌注禹樂也九州之物可辯數九功之德可歌尚書大傳歌大化大訓六府九原而夏道興注四章皆歌禹之功湯晨露歌見樂類徐陵云紫庭黃竹之詞晨露卿雲之藻徐景安樂書曰南風卿雲謂舜之歌也唐歌謂帝嚳之歌也晨露湯之歌也文王鳯皇歌古今樂録有鳯皇銜書於文王之郊乃作鳯皇之歌曰銜書來遊以命昌兮云云又琴論見琴類周飫歌國語衛彪傒曰周詩有之曰天之所支不可壊也其所壊亦不可支也昔武王克殷而作此詩也以為飫歌名之曰支以遺後人使永監焉禮之立成者為飫周成王儀鳯歌琴操周成王時鳯皇來舞於庭成王乃援琴而歌曰鳯皇來儀百獸晨又曰鳯皇翔兮於一作舞紫庭余何德兮以感靈賴先人兮恩澤臻于胥樂兮民以寧初學記引之宋符瑞志鳯皇翔庭成王援琴而歌曰鳯皇翔兮於紫庭余何德兮以感靈賴先王兮恩澤湊于胥樂兮民以寧穆王黃竹詩穆天子傳天子南游于黃臺之丘以觀夏啓之所居獵苹澤一云獵于鉼山日中大寒北風雨雪有凍人天子作詩三章以哀民曰我徂黃竹員閟寒帝收九行嗟我公侯百辟冡卿皇我萬民旦夕勿忘天子觴西王母于瑶池之上西王母為天子謡天子荅之曰予歸東土咊治諸夏漢大風歌風起詩高祖歌詩三侯章高帝紀十二年冬十月上破布軍于㑹缶上還過沛留置酒沛宫悉召故人父老子弟佐酒發沛中兒得百二十人教之歌酒酣上擊筑自歌曰大風起兮雲飛揚威加海内兮歸故鄉安得猛士兮守四方令兒皆和習之上乃起舞忼慨傷懐禮樂志高祖既定天下過沛與故人父老相樂醉酒歡哀作風起之詩令沛中兒僮百二十人習而歌之至孝惠時以沛宫為原廟令歌兒習吹以相和常以百二十人為員沛吹鼔員十二人藝文志高祖歌詩二篇張良傳高祖歌曰鴻鵠高飛一舉千里羽翼以就横絶四海史記樂書高祖過沛詩三侯之章令小兒歌之正義三兮也索隠云侯語辭詩侯其禕而是也沛詩有三兮故曰三侯文中子大風安不忘危其霸心之存乎文心彫龍大風鴻鵠之歌亦天縱之英作也漢瓠子歌盛唐樅陽歌紀武帝元封二年四月作瓠子歌溝洫志上用事萬里沙還自臨決河湛白馬玉璧令從官以下皆負薪窴決河上悼功之不成廼作歌曰瓠子決兮將柰何浩浩洋洋兮慮殫為河殫為河兮地不得寧功無已時兮吾山平吾山平兮鉅野溢魚弗鬱兮柏冬日正道弛兮離常流蛟龍騁兮放遠遊歸舊川兮神戲沛不封禪兮安知外皇謂河公兮何不仁泛濫不止兮愁吾人齧桑浮兮淮泗滿乆不返兮水維緩一曰河湯湯兮激潺湲北渡囘兮迅流難搴長茭兮湛美玉河公許兮薪不屬薪不屬兮衛人罪燒蕭條兮噫乎何以御水隤林竹兮揵石菑宣防塞兮萬福來於是塞瓠子築宫其上名曰宣防紀元封五年冬南廵狩至于盛唐望祀虞舜于九疑自尋陽浮江親射蛟江中獲之舳艫千里薄樅陽而出作盛唐樅陽之歌文心雕龍栢梁展朝燕之詩金隄製恤民之詠武帝集曰悼奉車子侯自為歌詩漢秋風辭漢武故事帝行幸河東祠后土顧視帝京忻然中流與羣臣燕作秋風辭曰秋風起兮白雲飛草木黃落兮鴈南歸蘭有秀兮菊有芳擕佳人兮不能忘汎樓船兮濟汾河橫中流兮揚素波簫鼓鳴兮發櫂歌懽樂極兮哀情多少壯幾時兮奈老何見文選文中子秋風樂極哀來其悔志之萌乎漢芝房寶鼎天馬白麟朱鴈歌交門歌武紀元封二年六月作芝房歌元鼎四年六月作寶鼎天馬歌元狩元年十月作白麟歌太始三年二月作朱鴈歌四年四月作交門歌漢栢梁詩唐栢梁體詩古文苑武帝作栢梁臺紀元鼎二年春乃臺建於元鼎二年登臺賦詩元封三年也詔羣臣二千石能七言者乃得上坐帝曰日月星辰和四時自梁王以下作詩者二十五人而梁王曰驂駕駟馬從梁來至東方朔止兩京記貞觀五年太宗破突厥宴突利可汗於兩儀殿賦七言詩栢梁體御製絶域降附天下平神通曰八表無事悦聖情無忌曰雲披霧歛天地明玄齡曰登封日觀禪云亭蕭瑀曰太常具禮方告成舊唐紀儀鳯三年七月丁巳宴近臣諸親於九成宫之咸亨殿上謂霍王元軌等曰甘雨頻降夏麥豐熟秋稼滋榮思與叔等同為此歡因賦七言効栢梁體曰屏欲除奢政返淳皇太子霍王相王侍臣並和天寶十四載三月丙寅宴羣臣於勤政樓奏九部樂上賦詩斆栢梁體羣臣和漢詔賜詩蓺文志詔賜中山靖王子噲及孺子妾氷未央材人歌詩四篇漢黃鵠歌見祥瑞類昭帝始元元年作又有淋池歌漢靈臺十二門詩歌詩四首章帝元和二年四月作靈帝熹平四年正月作十二門新詩詳見樂類章帝親著歌詩四章列在食舉一曰思齊姚皇二曰六麒麟三曰竭肅雍四曰渉叶相故事有鹿鳴承元氣二曲合帝作四篇為六魏文帝詩黃初六年十月行幸廣陵故城臨江觀兵注魏書載帝於馬上為詩詩之入選者芙蓉池居首有秋風燕歌行文心雕龍魏之三祖氣爽才麗北上衆引秋風列篇或迷酣宴或傷羈戍唐翠華殿賦詩高祖武德七年四月丙午宴王公親屬於文明殿見安平王太妃以尊屬從家人禮降階再拜酒小闌徙坐翠華殿帝賦詩王公遞上壽賜帛各有差八年五月乙巳宴五品以上及外戚於内殿賦詩賜綵武德中秦王至涇州召司户李百藥因賜詩唐帝京篇李百藥傳帝嘗與偕賦帝京篇歎其工曰卿何身老而才壯齒宿而意新帝京篇五言太宗製褚遂良行書貞觀十八年八月序云以堯舜之風蕩秦漢之弊用咸英之曲變爛漫之音帝京篇十首見文苑英華書目太宗詩一卷六十九首紀成功於慶善之章洽臣歡於積翠之什賦成威鳯篇著帝京銘玉華之宫賛王陸之傳假鸞鳯以旌忠力賦勁草以寵誠臣唐慶善宫賦詩㑹要貞觀六年九月二十九日己酉幸慶善宫宴從臣於渭濱賦詩十韻曰粤余承累聖懸弧亦在兹指麾八荒定懐柔萬國夷梯山盛入欵駕海亦來思單于陪武帳日逐衛文㮰共樂還譙宴歡比大風詩吕才播之樂府名功成慶善樂册府元龜六年閏八月己巳至慶善宫宴三品以上於渭濱賦五言詩唐中華殿賦詩如兩儀殿貞觀二年十二月乙未宴突利可汗及三品以上於中華殿帝賦七言詩極歡賜雜綵四年二月己酉又宴三品以上于是殿幸洛陽及成翠㣲宫賜褚亮詩有隔闊相思之句太宗經破薛舉戰地詩營碎落星沉陣卷横雲裂又有執契靜三邊詩唐宫體詩虞世南傳太宗嘗作宫體詩使賡和世南曰聖作誠工然體非雅正恐此詩一傳天下風靡帝曰朕試卿耳又云帝為詩一篇述古興亡貞觀十二年宫體之號自梁徐摛春坊盡學之㑹要貞觀七年九月二十三日上謂侍臣曰朕嘗戲作豔詩世南進表諫曰云云羣臣皆若世南天下何憂不理唐賜蕭瑀詩蕭瑀傳貞觀九年十一月戊午又參預政事帝嘗曰武德末太上皇有廢立議瑀不可以利怵死懼社稷臣也因賜詩曰疾風知勁草板蕩識誠臣初學記載此詩云勇夫安識義智者必懐仁又有賜房玄齡詩又賦秋日懸清光賜玄齡云還當葵藿志傾葉自相依唐詠雨詩初學記太宗詠雨詩和風吹綠野梅雨灑芳田新流添舊澗宿霧足朝烟對此忻登嵗披衿弄五絃又有首春初夏秋日詩秋日翠㣲宫山閣晚秋守嵗詩冬日臨昆明池臨洛水春日望海望終南山詩入潼闗詩浮橋詩初晴詩過舊宅詩云新豐停翠輦譙邑駐鳴笳一朝辭此地四海遂為家重幸武功詩曰積善欣餘慶暢武悦成功垂衣天下治端拱車書同白水循前跡丹陵幸舊宫列筵歡故老高宴聚新豐於焉歡擊筑聊以詠南風又置酒坐飛閣詩類要太宗儀鸞殿早秋詩羣臣奉和唐積翠池賦詩魏徴傳帝宴羣臣積翠池賦詩實録賦尚書詩曰日昃翫百篇臨燈披五典初學記云輟膳玩三墳留燈披五典縱情昏主多克己明君鮮舊書太宗在洛陽宫幸積翠池宴羣臣酒酣各賦一事太宗賦尚書曰同實録成名由積善魏徴賦西漢曰終藉叔孫禮方知皇帝尊太宗曰徴毎言必約我以禮也通鑑貞觀十一年三月庚子上宴洛陽宫西苑御龍舟泛積翠池册府元龜貞觀十一年十月辛丒一作辛酉幸積翠池宴五品以上帝曰公等酒酣各宜賦一事帝賦尚書特進魏徴賦西漢其卒章曰終藉叔孫禮方知皇帝尊帝曰徴毎言約我以禮此語宜記録唐幸靈州序事詩舊紀貞觀二十年八月己巳幸靈州庚午次涇陽鐵勒囘紇等十一姓朝貢九月甲辰諸部落俟斤頡利發等相繼至靈州者數千人於是北荒悉平為五言詩勒石序其事通鑑二十年九月上至靈州諸部數千人咸云願得天至尊為可汗甲辰上為詩序其事曰雪恥酬百王除凶報千古公卿請勒石於靈州從之文苑英華太宗宴中山詩對敵六奇舉臨戎八陣張斬鯨澄碧海卷霧掃扶桑册府元龜二十年八月幸靈州又幸漢故甘泉宫詔曰匃奴僣稱驕子分天御於紫宸仰應髦頭抗大禮於皇極射鵬馳騎亟飲灞川如矢騰氛頻驚渭汭朕曩命偏師遂擒頡利今弘廟略已滅延陁雖則麾駕出征未踰郊甸前驅所轥纔掩塞垣長策風行已振金微之表揚威電發遠讋沙塲之外遂使鴈山之北無復單于龍城之南大開封域契苾等委身内屬朕當暫幸靈州親撫歸附弘兹肆赦加以施生頒惠天隅曜威靈朔收其澣海盡入提封解其辮髮並垂冠帶上變星昴歸於東井之躔下掩蹛林袪入南山之囿混元以降殊未前聞即宜備禮告于清廟仍以大慶頒示普天唐凌烟閣賦詩魏徴傳帝思徴不己登凌烟閣觀畫象賦詩初學記太宗詠司馬彪續漢志詩云談叢引泉祕唐宴羣臣詩太宗春日玄武門宴羣臣詩有駐輦華林高宴栢梁之句九夷簉瑶席五狄列瓊筵娛賔歌湛露廣樂奏鈞天又正月臨朝詩魏徴顔師古岑文本李百藥楊師道皆和初學記顔師古聖德頌黃竹麗章栢梁清引沈鬱澹雅疏通敏迅唐御雪詩顯慶三年十月八日吕才以御製雪詩為白雪歌詳見琴類帝亦製歌詞十六皆著樂府麟德二年封禪十一月丁酉至平陰頓是日降雪帝賦詩唐校獵賦詩顯慶五年三月幸并州童子寺賦詩而還十二月辛未校獵於長社之安樂川丙子召侍臣蕃客夜宴帝賦詩以紀講習之事唐冬狩詩㑹要龍朔元年十月五日狩于陸渾一云南山上製冬狩詩示羣臣初學記太宗有出獵詩冬狩詩唐咸亨樂章見樂舞唐喜雪詩太宗望雪詩素雪凝曉華玄宗御製喜雪詩為知勤恤意先此示年豐又温湯對雪詩校獵義成喜逢天雪題九韻示羣官又喜雪詩云朝如玉已㑹庭似月猶明同劉晃喜雨詩繁雲先合寸膏雨自依旬又製瑞雲篇張説和云含花雪告豐遥知百神喜灑露待行宫欲驗豐年象飄颻仙藻來宮似瑶林庭如月華張九齡和云草木縁早榮京坻宛先積瑞雪篇雜言又和喜雨四言云人和年豐皇心則怡又觀御製喜雪篇曰食者萬姓之命雪為五榖之精兆且見於祈年律既和於言志豈比周歌黃竹漢詠白雲開元八年親製春雪詩春臺望一章二十八句起居舎人蔡孚奏所製氣雄詞美德音相屬請示百寮編國史十四年十月幸汝州至温湯之行宫親賦雨雪詩示羣臣唐玄宗和偃松篇贈賀知章詩開元初蔡孚賦東都龍興觀偃松篇玄宗賜和御書刻石紀之公卿以下咸和舊紀天寶二年十二月太子賓客賀知章還鄉三載正月庚子遣左右相以下祖别於長樂坡上賦詩贈之集賢記云上親製詩序百司餞送賦詩序别唐開元賜刺史詩許景先傳開元十三年二月帝自擇刺史景先由吏部侍郎為刺史治虢大理卿源光裕鄭州兵部侍郎㓂泚宋州禮部侍郎鄭温琦邠州大理少卿袁仁敬杭州鴻臚少卿崔志廉襄州衛尉少卿李昇期邢州太僕少卿鄭放定州國子司業蔣挺湖州左衛將軍裴觀滄州衛率崔誠遂州凡十一人詔宰相諸王御史以上祖道洛濵盛具奏太常樂帛舫水嬉命高力士賜詩十韻帝親書且給筆紙令自賦賚絹三千遣之見張説集云賜刺史以題坐右説有應制詩賜詩云視人當如子愛人亦如傷講學試誦論阡陌勸耕桑虚譽不可飾清知不可忘求名迹易見安眞德自彰獄訟必以情教民貴有常恤惸且存老撫弱復綏強勉哉各祗命知予眷萬方詳見戒吏類裴寛授太原尹玄宗賜詩褒餞張暐還鄉帝賜詩及錦袍繒綵蕭嵩領朔方節度賦詩勞行張嘉貞為定州刺史及行帝賦詩詔百官祖道上東門御製賜崔日知往潞州詩揚風非贈扇易俗是張琴餞王晙廵邊金壇申將禮玉節授軍符風揚旌斾逺雨洗甲兵初送宇文融安輯户口送張説廵邊命將綏邊服雄圖出廟堂三台入武帳八座起文昌賈曽序云天章賦别御札題牋副衣勉挾纊之誠兼壺喻投醪之旨宋璟和云聖酒山河潤天詞象緯明德風邊地偃勝氣朔雲平見張説集又漕橋東送新除岳牧賦詩送李邕之滑臺十道采訪使朝集使詩開元十年司馬承禎還天台山上賦詩以遣之張東之還襄州中宗賦詩祖道昔周遣使臣則有皇華之詩歌馳驅咨諏之事使有光乎原隰遣諸侯於廟則有臣工之詩歴道保介新畬之意使無緩乎民事賜刺史詩引證唐宴諸王賦詩武成殿賦詩開元十四年十一月己丒幸寧王憲宅與諸王宴探韻賦詩詩曰魯衛情先重而終勉以為善之樂即日還宫十五年五月丁丒端午宴羣臣于武成殿有忠正貽後昆之句各賜衣一副自賦詩六月朔方節度兵書蕭嵩赴朔方軍命有司於定鼎門外供帳置酒送之帝賦詩以寵之十二月幸温泉宫登驪山石甕寺賦詩俾羣臣和唐東堂賜三傑詩宋璟傳開元十七年舊書八月乙酉為右丞相與左丞相張説太子少傅源乾曜同日拜有詔太官設饌太常奏樂㑹百官尚書省東堂帝賦三傑詩自寫以賜張説傳上日敕所司供帳設樂内出醪饌帝為賦詩詩曰赤帝收三傑黄軒舉二臣云云樂聚南宫宴觴連北斗醇説和詩曰菊花吹御酒蘭葉捧天詞璟和詩曰聖酒山河潤仙文象緯舒乾曜和曰鼓鐘崇享禮鵷鷺集朝倫蘇晉序曰咨日于朔擇時于秋對命天庭受職公府工備侑饔獻蒸六卿拜下以成儀三事自天而來賀秩秩賔序暉暉旅醻玉緯垂文金漿降醴方將一心天工勠力帝載爰命在宴乃賡載歌蕭嵩裴先廷宇文融亦有和詩融詩曰飛文瑶札降賜酒玉盃傳嵩詩曰入朝師百辟論道協三光又御製同二相已下羣官宴樂逰園詩萬方朝玉帛千品㑹簮裾説璟皆有詩御春明樓臨右相園亭賦樂賢詩王維集唐花蕚樓賦詩舊紀開元十八年八月丁亥上御花蕚樓以千秋節百官獻賀賜四品以上金鏡珠嚢上賦八韻詩又制秋景詩詩云獻遺成新俗朝儀入舊章月銜花綬鏡露綴綵絲嚢又有賜羣臣鏡詩突厥傳天寶四載毗伽可汗妻骨咄禄婆匐可敦率衆自歸天子御花蕚樓宴羣臣賦詩美其事舊紀元年九月辛卯御樓出宫女宴可汗妻及男女等通鑑九月辛亥唐賜集賢學士詩宴麗正學士詩御製送張説集賢上學士詩廣學開書殿崇儒引席珎集賢招袞職論道命台臣張九齡為賜燕序曰食以樂侑人思德飽説至韋述十五人賦詩李元紘詩云饌玉還丹禁牋花降紫墀開元十三年乙丒二月二十七日宴兩相禮官麗正學士御製詩唐興慶宫賦詩諸王傳天子於宫西南置花蕚勤政樓帝時時登之或幸第賦詩御製遊興慶宫作詩登勤政花蕚樓觀風俗而勸人崇友于而厚睦從來崇棣蕚今此茂荆枝務本方崇訓相輝保羽儀所希覃率土孝悌一同規又過寧王宅詩戚里申高宴平臺奏雅歌又過山池詩春中興慶宫酺宴詩夏首花蕚樓賞樂賦詩端午三殿宴羣臣詩見張説集帝幸薛王業第置酒賦詩開元八年幸業第置酒燕樂帝賦詩有常棣鴒原之句龍池篇張九齡和唐飲至賦詩張守珪傳斬契丹酋屈刺及突于傳首東都二十三年春二月入見天子詣東都獻㨗㑹籍田畢即酺宴為守珪飲至帝賦詩寵之玄宗有平胡二章登封禮畢洛城酺宴詩張九齡和唐開元鼎實酒醴詩集賢注記開元二十五年宰相上禮獻壽上御花蕚樓設宴製鼎實酒醴二章之詩以相勸誡各賜宰相五百匹兼銀器等中興書目明皇詩一卷凡五十七首唐賜太子仁孝詩肅宗為太子天寶八載九月甲午太子生日肅宗九月三日生帝製仁孝詩六章札於歩障以賜太子令高力士以示朝臣宰相奏曰宸章煥發睿札凝暉懸日月而齊光自雲霄而下濟爰於誕育之日勉以仁孝之經上揚祖宗之美傍考天人之際發揮前古垂範將來凡在衣冠之流咸知父子之道豈比周稱嗣續造齒胄於上庠漢寵元良但招賢于望苑望寫六章頒示中外編諸簡策詔從之自家刑國以訓人倫唐朝元閣賦詩席豫傳玄宗嘗登朝元閣賦詩羣臣屬和豫詩最工或云天寶四年幸温泉宫云云天寶十載十月乙丒御朝元閣有慶雲見上賦詩羣臣畢和唐勤政樓賦天寶十四載三月丙寅燕羣臣勤政樓上賦詩斆栢梁體羣臣畢和唐謁老子廟詩宋朝景德四年二月甲戌謁上清宫宫在洛城北即唐開元中老子祠也明皇謁廟詩石存焉玄宗登太行山中言志途次舊居過晉陽宫渡蒲關經華嶽潼關過王濬墓經河上公廟次陜州成臯經鄒魯祭孔子遊温泉皆有詩見張説集唐餞李光弼詩乾元二年八月光弼出統河南諸軍於内殿宴送御製詩寵之李光弼傳拜河南副元帥鎭泗州帝為賦詩以餞羣臣畢和張仁愿傳景龍二年秋督軍備邊帝為賦詩祖道舊紀三年八月乙未送於通化門外帝製序賦詩唐玉靈芝詩㑹要上元二年七月甲辰延英殿御座生玉靈芝一莖三花親製玉靈芝詩三章章八句曰玉殿肅肅靈芝煌煌重英發秀連葉分房宗廟之福垂其景光元氣産之明神合德紫微間采白蕣呈色載啓瑞圖庶符皇極天心有眷王道惟直幸生芳本當我扆旒放此靈質賁其王猷神惟不愛道亦無求端拱思惟永荷天休唐中和節詩鄴侯家傳夜夢見賜御製中和節詩於金花牋上第二對首忘一字云兹中和節式慶天地春及中和日百寮㑹曲江亭賜御製詩曰肇兹中和節云云其金花牋上花雲皆夢所見者奉詔同用春字唐麟德殿賜詩貞元四年三月甲寅宴百寮於麟德殿設九部樂及内出舞馬帝製序及詩以賜羣臣於是給御筆仍命屬和十年九月十日戊子以重陽賜百僚追賞帝賦詩以賜十一年九月癸卯舊紀己卯賜中書門下及兩省供奉官宴於曲江帝作詩六韻賜百僚百僚畢和辛亥退朝召百僚詣延英令中使喻曰屬和雅麗十三年九月辛卯重陽賜宴曲江賜詩十七年二月癸巳朔賜宴曲江賜詩六韻九月戊辰重陽亦如之十八年九月癸亥重陽御製豐年多慶九日示懐詩賜羣臣舊紀賜羣臣宴馬璘山池賜詩六韻唐貞元宴曲江詩中和節詩劉太眞傳徳宗以天下平貞元四年九月癸丒宴羣臣曲江自為詩製詩序勑宰相擇文人賡和李泌等請羣臣皆和帝自第之以太眞李紓等四人為上鮑防于邵一作于頎等四人次之張濛等二十三人一云二十二人為下與擇者四十一人惟泌李晟馬燧三宰相無所差次會要時重陽節帝賦詩云時此萬機暇適與佳節并朝野慶年豐高㑹多歡聲勑應制同用清字詩凡六韻三舊紀同詔簡文士五十人應制同用清字明日於延英門進又有重陽言志及豐年多慶詩權德輿和云天文麗慶霄墨妙驚飛鸞六年二月戊辰朔百寮會宴於曲江亭上賦中和節羣臣賜宴詩七韻是日百寮進兆人本業三卷司農獻黍粟各一斗三月庚子百寮宴於曲江亭上賦上己詩一篇賜之十七年二月癸巳朔賜宴曲江亭上賦中和節賜宴詩六韻類要德宗以中和節宴百寮詩賜戴容州叔倫傳云德宗嘗賦中和節詩遣使者寵賜舊紀貞元十一年九月己卯賜宴曲江賦詩六韻賜之十三年九月辛卯又賜詩十七年九月戊辰賜詩六韻唐黃菊歌韋綬傳九月九日帝為黃菊歌顧左右曰安可不示韋綬即遣使持往綬遽奉和玄宗端午日自賦詩唐章敬寺賦詩貞元七年七月癸酉中元日幸章敬寺賦詩九韻有松院靜苔色竹房深磬聲之句皇太子進和兼題于壁百寮畢和後京尹薛珏請以上詩序皇太子書刻于石而塡以金從之舊紀皇太子與羣臣畢和題之寺壁唐賜張建封詩㑹要貞元十三年徐州節度使張建封來朝舊紀十月丁丒來朝及命歸鎭上御製詩以賜之云牧守寄所重才賢生為時宣風自淮甸授鉞膺藩維入覲展遐戀臨軒慰來思忠誠在方寸感激陳情辭報國爾所尚恤人余是資勿以千里遥而云無已知張建封傳其還鎭帝賦詩以餞于時馬燧渾瑊劉玄佐李抱眞等勲寵卓越未有以詩餞者建封又賦詩以自警勵十三年來朝召見延英殿建封賦朝天行以獻帝眷異賜名馬珎具一本云賦朝天獻壽詩唐中春麟德殿觀新樂詩貞元十四年二月戊午上製中春麟德殿會百寮觀新樂詩一章十六句舊紀云宴羣臣詩八韻令太子書示百官序曰朕以中春之首紀為令節聽政之暇韻於歌詩象中和之容作中和之舞聊復成篇詩曰芳歲肇佳節物華當仲春前庭列鐘鼓廣殿延羣臣八封随舞意五音轉曲新顧非咸池奏庶叶南風薰中書門下謝賜詩請頒示天下編入樂府金石録徳宗撰麟德殿宴羣臣詩皇太子誦行書貞元四年六月唐紫宸殿觀仗詩見元㑹類憲宗舊紀貞元九年正月庚辰朔唐喜雨詩㑹要開成元年三月庚申幸龍首池甘澤屢降賦暮春喜雨詩曰郊坰既沾足黍稷有豐期百官屬和唐賜王起詩詩笏賜裴度詩王起傳加皇太子侍讀文宗題詩太子笏以賜詔畫象便殿裴度傳開成三年上已宴羣臣曲江度不赴帝賜詩曰注想待元老文宗賜裴度詩御札曰朕詩集中要有卿唱和詩開成四年三月乙酉上已賜百寮宴曲江命内官以詩宣賜度唐夏日聯句開成三年文宗夏日與學士聯句帝曰人皆苦炎熱我愛夏日長柳公權曰薫風自南來殿閣生㣲涼時五學士屬和帝獨謂公權詞清意足唐太液亭賜詩宣宗好儒術或宰臣出鎭即賦詩贈之詞皆清麗大中九年秋七月甲午舊紀八月崔鉉由左僕射為淮南節度帝餞太液亭賜詩中有七載秉鈞調四序之句儒者榮之舊書玉海卷二十九
