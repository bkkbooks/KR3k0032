body:
  text: 玉海卷二十三宋王應麟撰地理陂塘堰湖隄埭自古賢智之士為其民捍患興利其遺迹往往而在使其繼者皆如始作之心則民到于今受其賜天下豈有遺利乎舜五湖後漢班固傳捐金於山沈珠於淵注陸賈新語舜棄黃金於嶄巖之山捐珠於五湖之泉一作川以塞一作杜邪淫之路一作欲淮南子舜乃使禹疏三江五湖禹五湖墨子禹治天下南為江漢淮汝東流注之五湖淮南子禹之時天下大水禹身執虆臿以為民先剔河而導九岐鑿江而通九路辟五湖而定東海管子夏人之王鑿五湖説苑云河間獻王曰禹鑿江通於九派釃五湖而定東海賈誼書云澄五湖吕氏春秋禹通三江五湖決伊闕溝回陸注之東海因水之力也史記太史公曰上姑蘇望五湖正義五湖者連太湖在蘇州西四十里又曰遊莫貢菱胥為五湖並太湖東岸五灣索隱曰五湖者具區洮滆彭蠡青草洞庭案張勃吳録五湖者太湖之别名以其周行五百餘里故曰五湖或説以太湖射貴湖上湖洮湖滆湖為五湖案國語吳越戰于五湖直在笠澤一湖中耳或説非也貨殖傳吳有三江五湖之利漢地理志周官揚州浸曰五湖注師古曰五湖在吳越語興師伐吳至於五湖禹貢震澤注吳太湖名疏五湖即震澤越絶書太湖周三萬六千頃晉楊泉有五湖賦周五湖周禮職方氏揚州其浸五湖注在吳南水經注南江東注于具區謂之五湖口五湖謂長塘湖太湖射貴湖上湖滆湖也郭景純江賦曰注五湖以漫漭言江水經緯五湖苞注太湖也國語曰越伐吳戰於五湖范蠡返至五湖而辭越虞翻曰是湖有五道韋昭曰今太湖也尚書謂之震澤爾雅以為具區方員五百里山海經曰浮玉之山北望具區苕水出于其隂北流注于具區湖中有大雷小雷三山亦謂三山湖又謂洞庭湖楊修五湖賦曰頭首無錫足蹄松江負烏程於背上懷大吳以當胸岞􅀢崔嵬穹隆紆曲大雷小雷湍波相逐言湖之苞極也庾仲初揚都賦注曰今太湖東注為松江下七十里有水口分流東北入海為婁江東南入海為東江與松江而三史河渠書於吳則通渠三江五湖注韋昭曰實一湖今太湖是也在吳西南秦百丈堰理道要訣秦以李冰為蜀郡太守造百丈堰灌田數千頃蜀以富饒漢白馬津史記酈生傳願急復進兵收取滎陽據敖倉之粟塞成臯之險杜太行之道距蜚狐之口守白馬之津以示諸侯形制之藝漢書同戰國䇿張儀曰決白馬之口以流魏氏髙誘注白馬津名水經注河過黎陽縣南為白馬津石勒號為靈昌津唐滑州黎陽津即此也今屬滑州白馬縣本衛之曹邑也漢芍陂楚期思陂地理志六安國六縣有如溪水東北至壽春入芍陂芍音酌又音鵲廬江郡灊縣有沘山沘水所出北至壽春入芍陂淮南子孫叔敖決期思之水灌雩婁之野汝南有期思縣雩婁今廬江意林孫叔敖作期思陂而荆土用贍水經注東北徑白芍亭東積而為湖謂之芍陂陂周一百二十許里在壽春縣南八十里言楚相孫叔敖所造魏王淩與吳將張休文戰於芍陂即此處也陂有五門吐納川流西北為香門陂水北徑叔敖祠下謂之芍陂瀆又北分為二水一水東注黎漿東注肥水王景傳建初八年遷廬江太守先是百姓不知牛耕致地力有餘而食常不足郡界有楚相孫叔敖所起芍陂稻田景乃驅率吏民修起蕪廢教用犂耕由是墾闢倍多境內豐給遂銘石刻誓令民知常禁又訓令蠶織為作法制皆著于鄉亭廬江傳其文辭注陂在今壽州安豐縣東孫叔敖所作期思陂是也徑百里灌田萬頃魏志建安十四年七月置揚州郡縣長吏開芍陂屯田魏劉馥晉劉頌皆修治芍陂見下通典宋元嘉七年荆河刺史劉義欣鎮壽陽經理芍陂良田萬頃有舊溝引渒水入陂齊垣崇祖修芍陂田通典又云崔實月令曰叔敖作期思陂即此齊梁立屯田隋趙軌傳芍陂舊有五門堰軌更開三十六門灌田五千餘頃輿地廣記壽州安豐有芍陂徑百里灌田萬頃漢金隄溝洫志漢興三十有九年孝文時河決酸棗東潰金隄注師古曰河隄名在東郡白馬津東郡大興卒塞之成帝初河決東郡金隄建始四年秋大水鴻嘉四年河水湓溢孫禁圖方略以為可決平原金隄間開通大河至海哀帝初賈讓言今行上策徙兾州民決黎陽遮害亭放河使北入海河西薄太山東薄金隄藝不能逺云云臣竊按視遮害亭西十八里至淇水口乃有金隄髙一丈自是東地稍下隄稍髙至遮害亭髙四五丈往五六嵗河水大盛增丈七尺云云王尊傳為東郡太守河水盛溢泛浸瓠子金隄尊躬率吏民投沈白馬祀水神河伯尊親執圭璧使巫䇿祝請以身填金隄因止宿廬居隄上水波稍却回還吏民嘉壯尊之勇節崔瑗河隄謁者針伊昔鴻泉浩浩滔天有夏作空爰奠山川爰及周衰夏績陵遲導非其導堙非其堙湓溢滂汩屢決金隄瓠子潺湲宣房作歌使臣司水敢告執河括地志金隄一名千里隄在白馬縣東五里九域志大名府有金隄漢志曰黎陽南故大金隄與東山相屬北盡魏界又有鯀隄博州有古金隄輿地廣記酸棗縣有金隄漢文時河決金隄即此元和志金隄在酸棗縣南二十三里在今滑州界漢河隄方略馮逡傳為都尉時言河隄方略溝洫志自塞宣防後河復北決於館陶分為屯氏河地理志靈縣河水别出為鳴犢河東北至蓨入屯氏河信成縣張甲河首受屯氏别河東北至蓨入漳水館陶河水别出為屯氏河因其自然不隄塞元帝永元五年河決清河靈鳴犢口而屯氏河絶成帝初清河都尉馮逡奏言郡承河下流無大害者以屯氏河通兩川分流也今屯氏河塞靈鳴犢口又益不利獨一川兼受數河之任雖髙增隄防終不能泄禹非不愛民力以地形有藝故穿九河今既滅難明屯氏河不流行七十餘年新絶未久其處易浚又其口所居髙於以分流殺水力道里便宜又地節時郭昌穿直渠後三嵗河水更從故第二曲間北可六里復南合今其曲藝復邪直貝丘百姓寒心宜復穿渠東行事下丞相御史白遣博士許商行視以為屯氏河盈溢所為用度不足可且勿浚後三嵗建始四年秋河果決於館陶及東郡金隄御史大夫尹忠對方略疏濶上切責之十一月日河隄使者王延世使塞以竹落長四丈大九圍盛以小石兩船夾載而下之三十六日河隄成以五年為河平元年三月以延世為光祿大夫秩中二千石賜爵關內侯黃金百斤後二嵗河復決平原復遣延世治之杜欽以為丞相史楊焉言延世受焉術且水藝各異不博議利害而任一人如使不及今冬成來春桃花水盛必羡溢宜遣焉及將作大匠許商諫大夫乘馬延年雜作如欽言遣焉等作治六月乃成復賜延世黃金百斤後九嵗鴻嘉四年楊焉言從河上下患底柱隘可鐫廣之上使焉鐫之水益湍怒害甚於故是嵗秋勃海清河信都河水湓溢河隄都尉許商與丞相史孫禁共行視圖方略禁以為可決平原金隄間開通大河令入故篤馬河許商以為不可公卿皆從商言先是谷永以為河中國之經瀆聖王興則出圖書王道廢則竭絶修政而應之災變自除時李尋解光亦言衆庶見王延世蒙重賞競言便巧不可用議者常欲求索九河故迹而穿之今因其自決可且勿塞以觀水藝遂止不塞哀帝初平當使領河隄奏言九河今皆填滅按經義有決河深川無隄防雍塞宜博求能浚川疏河者舉吏民莫有應書待詔賈讓言治河有上中下䇿治土而防其川猶止兒啼而塞其口隄防之作近起戰國雍防百川各以自利上䇿徙兾州民當水衝者不與水爭地中䇿多穿漕渠於兾州地使民得溉田分殺水怒通渠有三利民田適治河隄亦成下䇿繕全故隄增卑倍薄勞費無已王莽時召能治河者以百數其大略異者關並言秦漢以來河決曹衛之域不過百八十里可空此地勿為官亭民室張戎言民皆引河渭山川水溉田春夏乾燥故使河流遲貯淤而稍淺雨多水暴至則溢決可各順從其性毋復灌溉韓牧以為可略於禹貢九河處穿之王橫言宜卻徙平處更開空使緣西山足乘髙地而東北入海桓談為司空掾典其議無施行者李尋傳王根為大司馬時多災異根輔政數問尋尋以為且有洪水為災乃説根曰蓄水連泉務通利之修舊隄防省池澤稅以助損邪陰之盛馮野王傳以故二千石使行河隄漢浙江山海經浙江出三天子都在其東在閩西北入海餘暨南注按地理志浙江出新安黟縣南蠻中東入海今錢唐浙江是也地理志丹陽郡黟縣漸江水出南蠻夷中東入海秦紀三十七年十一月渡海渚過丹陽至錢唐臨浙江水波惡乃西百二十里從狹中渡上會稽祭大禹望于南海注晉灼曰江水至會稽山陰為浙江唐六典浙江水有三源一出歙州一出衢州一出婺州歷睦杭越三州界入海漢射陽湖梁湖博支湖地理志廣陵國江都有江水祠渠水首受江北至射陽入湖郡國志廣陵郡射陽注有梁湖地道記曰有博支湖漢六門陂射陂少府陂澤見草田水經注湍水又徑穰縣為六門陂漢南陽太守召信臣以建昭五年斷湍水立穰西石堨至元始五年更開三門為六石門故號六門堨溉穰新野昆陽三縣五千餘頃晉太康三年鎮南將軍杜預復更開廣利加于民有六門碑部曲主安陽亭侯鄧逹等以太康五年立廣陵王胥傳射陂草田漢鉗盧陂通典鄧州穰縣有六門堰鉗盧陂並漢邵信臣所作溉田三萬頃元帝建昭中邵信臣為南陽太守於穰縣南六十里造鉗盧陂纍石為隄傍開六石門以節水勢澤中有鉗盧玉池因以為名用廣溉灌嵗增多至三萬頃後杜詩為守復修其業時歌之曰前有邵父後有杜母張衡南都賦其陂澤則有鉗盧玉池赭陽東陂注杜預表曰所領部曲皆居南卿界所近鉗盧大陂下有良田玉池在宛貯水渟汙亘望無涯其水則開竇灑流浸彼稻田溝澮脈連隄塍相輑朝雲不興而潢潦獨臻決泄則暵為溉為陸冬稌夏穱隨時代熟國史地理志鄧州穰縣有鉗盧陂漢鴻郤陂許楊傳汝南舊有鴻郤陂在今豫州汝陽縣東成帝時丞相翟方進奏毁敗之建武中太守鄧晨欲修復其功聞楊曉水脈召與議之楊曰昔成帝用方進之言尋而自夢上天天帝怒曰何故敗我濯龍淵是後民失其利多致飢困時有歌謡曰敗我陂者翟子威飴我大豆亨我芋魁反乎覆陂當復昔大禹決江疏河以利天下明府今興立廢業富國安民童謡之言將有驗於此願以死效力晨大悅因以楊為都水掾使典其事楊因髙下形藝起塘四百餘里數年乃立百姓得其便鄧晨傳為汝南太守建武十八年興鴻郤陂數千頃田汝土以殷魚稻之饒流衍他郡前翟方進傳汝南舊有鴻隙大陂郡以為饒師古曰鴻隙陂名藉其溉灌及魚鱉葦蒲之利以多財用成帝時關東數水陂溢為害方進為相與御史大夫孔光共遣掾行視以為決去陂水其地肥美省隄防費而無水憂遂奏罷之及翟氏滅鄉里歸惡言方進請陂下良田不得而奏罷陂云王莽時常枯旱郡中追怨方進童謡曰壞陂誰翟子威飯我豆食羮芋魁反乎覆陂當復誰云者兩黃鵠安帝紀永初三年三月癸巳詔以鴻池晉志作鴻陂假與貧民國史地理志蔡州汝陽有鴻郤陂晉張載有洪池陂銘見池沼類文選注漢宫殿疏曰長安有鴈鶩陂承昆明下流類聚云蓋地六頃漢樊陂樊宏傳父重世善農稼開廣田土三百餘頃其所起廬舍有陂渠灌注注酈元水經注曰湖水支分東北為樊氏陂至今猶名為樊陂在今鄧州新野縣之西南贊謂樊重分地以用天道通典新野縣有樊陂在西南漢武陵五溪馬援傳建武二十四年武威將軍劉尚擊武陵五溪蠻夷注酈元注水經云武陵有五溪雄樠酉潕辰溪蠻夷所居故謂五溪蠻土俗雄作熊樠作明潕作武在今辰州界漢蒲陽陂後張禹傳元和三年遷下邳相徐縣北界有蒲陽坡東觀記曰坡水廣二十里徑百里在道西其東有田可萬頃坡與陂同傍多良田而堙廢莫修禹為開水門通引灌溉遂成孰田數百頃勸率吏民假與種糧親自勉勞遂大收穀實鄰郡貧者歸之千餘户室廬相屬其下成市後嵗至墾千餘頃民用饒給漢蒲姑陂長洲澤玉池澤陂郡國志下邳國取慮有蒲姑陂注左傳昭十六年齊師至蒲隧杜預曰縣東有蒲姑陂廣陵郡東陽有長洲澤吳王濞太倉在此南陽郡宛縣注南都賦注曰有玉池澤陂漢董池陂郡國志河東郡聞喜邑有董池陂古董澤漢三丈陂見鮦陽渠馬稜傳章和元年遷廣陵太守興復陂湖溉田二萬餘頃吏民刻石頌之注東觀記曰稜在廣陵興復陂湖增嵗租十萬餘斛漢八激堤水經河水又東徑八激堤北注漢安帝永初七年令謁者太山于岑於石門東積石八所皆如小山以捍衝波謂之八激堤漢鑑湖曹鞏序鑑湖一曰南湖又曰鏡湖南並山北屬州城漕渠東西距江順帝永和五年會稽太守馬臻之所為也築塘周回三百里一云三百五十八里通典云三百十里溉田九千餘頃其北隄石闥二陰溝十九南隄陰溝十四蓋因三江之上兩山之間疏為二門以時視田之水小溢則縱其一大溢盡縱之昔謝靈運求會稽回踵湖岯崲湖為田則請湖為田越之俗舊矣然南湖繇漢接唐未嘗廢宋興民始有盜湖為田者至治平間湖廢幾盡熙寧二年冬作唐賀知章傳以宅為千秋觀求周宫湖數頃為放生池有詔賜鏡湖剡川一曲宋朝會要熙寧間命江衍經度凡為田者兩存之立石柱內為田外為湖政和中王仲薿遂廢湖為田隆興二年二月詔賀知章放生池舊界十八頃外餘縱民耕之宋孔靈符傳山隂縣土狹民多田少靈符表徙無資之家於餘姚鄞鄮三縣界墾起湖田漢當湖郡國志吳郡海鹽注案今計偕簿縣之故治順帝時為湖今謂之當湖漢青陂水經注青陂廟前有陂漢建寧三年新蔡長李言上請復青陂在縣坤地源起桐柏淮川别流入于潺湲徑新息牆陂衍入褒信界灌溉五百餘頃漢廣成澤輿地廣記汝州梁縣西有廣成澤後漢作苑為遊獵之地馬融作頌今曰廣潤河蓋避朱梁諱也唐事見講武水經注汝水東與廣成澤水合安帝永初元年以廣成遊獵地假與貧民郡國志河南新城有廣成聚有廣成苑通典廣成苑在縣西魏芍陂又見上茹陂魏志太祖表劉馥為揚州刺史鎮合肥數年恩化盛行百姓樂其政流民越江山而歸者以萬數於是廣屯田興治芍陂茹陂七門吳塘諸堨以溉稻田官民以是有蓄吳志赤烏四年四月遣全琮略淮南決芍陂後漢志注皇覽曰楚大夫子思造芍陂魏鄭陂晉志兼魏志本傳魏文帝黃初中鄭渾為沛郡大守郡界下濕患水潦百姓飢之渾於蕭相二縣界興陂遏一作堨開稻田郡人皆不以為便渾曰地勢汙下宜灌溉終有魚稻經久之利此豐民之本也乃躬率吏民興功一冬皆成比年大收頃畝嵗增租入倍常民賴其利刻石頌之號曰鄭陂魏精湖蔣濟傳文帝幸廣陵濟表水道難通上三州論以諷不從於是戰船數千皆滯不得行議者欲就留兵屯田濟以為東近湖北臨淮若水盛時賊易為寇不可安屯從之車駕即發還到精湖水稍盡留船付濟鑿池作四五道蹴船令聚豫作土豚遏斷湖水皆引後船一時開遏入淮中魏臨晉陂見成國渠魏龍陂見瑞物類文帝於元武陂作詩魏百尺堨水經注沙水東南流注于潁謂之交口水次有大堰即古百尺堰也魏書司馬宣王討王凌大軍至百尺堨今俗呼為山陽堰非也蓋新水首受潁於百尺溝元和志百尺堰在汝陰縣西北一百里魏河內水利水經注沁水南徑石門石門是晉安平獻王司馬孚之為魏野王典農中郎將之所造也案其表云臣孚言臣被明詔興河內水利臣既到檢行沁水源出銅堤山屈曲周回水道九百方石為門詔書聽許於是夾岸纍石結以為門用代木門枋故石門舊有枋曰之稱溉田頃畝之數間關嵗月之功事見門側石銘漢建安九年魏武王於淇水口下大枋木以成堰遏淇水東入白溝以通漕運時人號其處為枋頭是以盧諶賦曰洪枋巨堰深渠髙隄吳江陵堰東興隄陸抗傳初江陵平衍道路通利抗敕江陵督張咸作大堰遏水漸積平中以絶寇叛羊祜欲因所遏水為船運糧揚聲將破堰以通步軍抗聞使咸亟破之祜至當陽聞堰敗乃改船以車運大費損功力諸葛恪傳初黃龍元年遷都建業二年築束興隄遏湖水後征淮南敗以內船由是廢不復修恪以建興元年十月會衆於東興更作大隄左右結山俠築兩城各留千人守之魏作浮橋度軍於隄上分兵攻兩城軍散橋壞魏王基傳江陵有沮漳二水溉灌膏腴之田以千數安陸左右陂池沃衍晉志吳作浦里塘晉芍陂又見上劉頌傳武帝時為淮南相甚有政績舊修芍陂年用數萬人豪強兼并孤貧失業頌使大小戮力計功受分百姓歌其平惠伏滔正淮論壽春龍泉之陂良疇萬頃晉巴丘湖杜預傳都督荆州江漢懷德號曰杜父舊水道惟沔漢逹江陵千數百里無通路又巴丘湖沅湘之會表裏山川實為險固荆蠻之所恃也預乃開楊口起夏水達巴陵千餘里內㵼長江之險外通零桂之漕南土歌之曰後世無叛由杜翁孰識智名與勇功後漢志注巴丘湖江南之雲夢也爾雅十藪楚有雲夢郭璞曰巴丘湖是也通典復州沔陽有夏水沔水嶽州巴陵有巴丘湖晉沈萊堰魏濟河論又見河渠傅祗傳武帝時為滎陽太守自魏黃初大水之後河濟泛溢鄧艾嘗著濟河論開石門而通之至是復壞祗乃造沉萊堰至今兖豫無水患百姓為立碑頌焉魏志劉靖都督河北修廣戾渠陵大堨水溉灌薊南北晉二十九陂水經注昔在晉世杜預繼信臣之業復六門之陂遏六門之水下結二十九陂諸陂散流咸入朝水事見六門碑通鑑桓溫至金鄉水道絶使毛虎生鑿巨野三百里引汶水會於清水晉洛陽千金堨李矩傳為汝陰太守永嘉初元年