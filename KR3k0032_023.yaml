會昌中元年秋漢水害襄陽拜鈞山南東道節度築隄六千步以障漢暴明年春隄成張柬之為襄州刺史漢水齧城柬之因壘為隄以遏湍怒蕭倣咸通中拜義成節度滑州瀕河纍嵗水壞西北防倣徙其流速去立隄自固人得以安文粹盧肇作漢隄詩陰沴姦陽來暴于襄洎入大郛波端若鋩襄人怡怡聽命襄滸分之卒伍令以麾鼓披峴斷楚飛石挽土聽築殷雷駭汗霏雨斯隄既成蜿蜿而平確爾山固屹如雲橫漢流雖狂堅不可蝕代年千億與天無極捍此巨災屹若磐石唐江陵古隄二橋地理志江陵貞元八年節度使嗣曹王臯塞古隄廣良田五千頃畝收一鍾又規江南廢洲為廬舍架為二橋荆俗飲陂澤乃教人鑿井人以為便嗣曹王臯傳初江陵東北傍漢有古鄣不治嵗輒溢臯修塞得其下良田五千頃規江南廢洲為廬舍架二橋跨江南流人自占者二千餘家繇荆抵樂鄉二百里其間墟聚凡數十不井飲臯始命鑿井以便人會要貞元八年三月嗣曹王皋為荆南節度觀察使先是江陵東北七十里有廢田旁漢古隄壞決凡二處每夏則為浸溢臯始命塞之廣良田五千頃云云唐侍郎堰地理志彭州導江有侍郎堰其東百丈堰引江水以溉彭益田龍朔中築又有小堰長安初築漢州雒縣貞元末刺史盧士珵立隄堰溉田四百餘頃賈敦頤傳貞觀時為瀛州刺史州瀕滹沱滱二水嵗湓溢寖洳數百敦頤為立堰庸水不能暴百姓利之唐扞江隄扞水隄邵父隄韋丹傳元和時二年二月江西觀察使築隄扞江長十二里竇以疏漲凡為陂塘五百九十八所灌田萬二千頃丹遺愛碑云派湖入江節以斗門以走瀑漲鑿六百陂塘灌田一萬頃錮以長隄繚四千步明年水平人始歌舞地理志洪州建昌南一里有捍水隄會昌六年攝令何易于築饒州鄱陽縣東有邵父隄東北三里有李公隄建中元年刺史李復築以捍江水成都有江瀆祠北十八里有萬嵗池天寶中長史章仇兼瓊築隄積水溉田南百步有官源渠隄百餘里天寶二載令獨孤戒盈築唐海隄漳隄地理志福州閩縣東五里有海隄太和三年令李茸築先是每六月潮水鹹鹵禾苖多死隄成瀦溪水殖稻其地三百户皆良田長樂東十里有海隄太和七年令李茸築立十斗門以禦潮旱則瀦水雨則泄水遂成良田海州朐山東二十里有永安隄北接山環城長七里以捍海潮開元十四年刺史杜令昭築兾州南宫西五十九里有濁漳隄顯慶元年築堂陽有漳水隄開元六年築武邑有衡漳石隄顯慶元年築宿州符離東北九十里有隋故牌湖隄灌田五百餘頃顯慶中復修韋景駿傳為肥鄉令神龍中縣北瀕漳舊防迫漕渠輒壞景駿相地勢益南千步因髙築障水至隄趾輒去髙瑀傳為忠武節度使州比水旱無年瑀相地宜築隄庸百八十里時其鍾泄民賴不飢加檢校尚書右僕射百官志水部諸州堤堰刺史縣令以時檢行而涖其決築有埭則以下户分牽禁爭利者漢南北湖地理志壽春合肥受南北湖皮革鮑木之輸亦一都會也後周河隄顯德六年二月丙子朔命王朴如河陰按行河隄立斗門於汴口甲申命韓令坤自大梁城東導汴水入于蔡水以通陳潁之漕命袁彥浚五丈渠東過曹濟梁山泊以通青鄆之漕建隆翟橋堰翟橋堰在開封縣建隆元年置天聖四年十月辛卯淮南轉運言楚州北神堰真州江口堰修水閘成漕運便之嵗省堰卒十餘萬乾德河隄周顯德元年十一月遣李穀按視河隄三旬而畢乾德元年正月丁巳發近甸民數萬修畿內河隄陳承昭護役二年正月治鄆州遙隄四年八月命韓重贇修滑州靈河隄十月壬午成河復故道五年正月命開封大名及鄆澶等十五州長吏兼河隄使事戊戌調民數萬治河隄六年築開封府陽武縣之越隄開寶三年正月癸丑十二月癸巳治河隄五年正月丙子命開封天雄等十一處各置河隄判官六月戊申命曹翰發徒一萬五千人修陽武河隄塞陽武濮陽決河十二月成六年正月癸酉調民夫修魏縣河隄興國二年七月塞滎澤決河命李崇矩自陜至滄按行河隄繕治之三年正月遣使十七人分治河隄五年正月命六人發民夫治衛澶濮濟鄭貝河隄八年九月遣使行視滑州河兩岸古遙隄雍熙二年正月命十三人治河隄淳化二年三月以霖雨詔諸州河隄使豫圖繕治祥符五年八月命使者秦義等乘傳至鄆視河隄城池圖上利害先是五月決河棣州七年河決澶州發徒數千築新隄二百四十步水乃順復慶厯元年命王克恭內臣議塞滑州橫隴決河克恭請先治金隄天雄守李迪亦請修金隄禦下流三月詔止勿塞皇祐元年九月修黃汴御河隄元豐三年四月鄆州築遙隄成長二十里廣六十尺髙一丈役夫六千一月而成詔奬守臣李肅之置真宗時河決滑州陳堯佐鑿木如編齒於湍流隨水而下謂之木龍隄乃成又護以長隄郡人謂之陳公隄景祐三年五月丙午詔護大名府金隄慶厯元年三月庚戌修金隄慶厯七年五月乙酉知保州王中庸增秩以提舉築河北五州軍隄道成特遷之程子曰河北只見鯀隄無禹隄鯀堙洪水故無功禹則導之而已祥符利民隄鳯州梁泉之利民隄磑子堰祥符二年置祥符錢塘江隄杭州江隄舊以竹籠石而潮齧之率數嵗輒復壞祥符七年潮直抵郡城守臣戚綸漕臣陳堯佐議實薪土以捍之實録云纍木為岸或言非便命發運使李溥按視十月壬戌溥請如錢氏舊制立本積石以捍潮波從之其後踰年隄不成卒用薪土天聖四年二月辛酉侍御史方謹言請修江岸二斗門實録云北閘慶厯六年志云二年漕臣杜杞築錢塘隄起官浦至沙陘以捍風濤仁宗時俞獻卿知杭州鑿西山石作堤長十里慶厯中漕臣田瑜疊石數萬為龍山隄浙江石塘創於錢氏景祐中工部郎中張夏為轉運使置捍江兵採石修塘志云為石隄人為立祠嘉祐六年十月辛巳贈夏太常少卿夏蘇軾曰自古本用木岸張始易以石紹興二十年修石隄二十二年十一月二十五日吏部尚書林大鼐言潮為吳患其來已久捍禦之䇿見於浙江亭碑自江流失道潮與洲鬬怒號激烈千霆萬鼓民以不寧宜顓置一司究利病而後興工乾道七年十一月十八日帥臣沈復修石隄成增石塘九十四丈吳越春秋吳王取子胥尸投之江中因隨流揚波依潮往來蕩激崩岸又曰前潮伍子胥也重水大夫種也史記秦始皇三十六年東遊至錢塘臨浙江水波惡乃西百二十里從狹中渡以此知錢塘江之險唐白居易傳為杭州刺史築隄捍錢塘湖文選注山謙之南徐州記曰京江禹貢北江有大濤至江乘北激赤岸尤迅猛水無涯而合岸山孤映而若浮金祇理轡素月告望宏濤鬱起重流電驤濤賦呼吸萬里吐納靈潮漂飛雲運艅艎江賦浮天無岸吐星出日天與水際浮天沃日包乾之奧括坤之區海賦錢塘洶然以獨起殊百川之進退仲秋忽爾而自興異三時之滂霈浙者折也潮出海屈折而倒流也其地形右蟠吳而大江覃其腹左挾越而巨澤灌其喉獨兹水夾羣山而逺入射一帶而中投潮以平來百川皆就浙入既深激而為鬬羣陰既歸水與天違當宵分八月之際避至烈之輝因圓光之既對引大海以羣飛盧肇海潮賦淋淋若白鷺下翔飄飄如輕車勒兵枚乘注天波於析木斂東極乎扶桑庾闡江賦萬古波濤中分二浙一時形勝密拱九重濤聲動地浪勢粘天川后回瀾波臣受職修鯤吐浪驚浪雷奔天聖泰州捍海堰海陵郡有古堰亘百有五十里久廢不治秋濤冒民田監西溪鹽稅范仲淹言於發運副使張綸請修復之議者謂將有蓄潦之憂綸曰濤之患嵗十而九潦之災嵗十而一護九而亡一不亦可乎天聖四年八月丁亥詔修捍海堰綸奏仲淹知興化縣總其役詔遣中使按視命轉運使胡令儀度其可否令儀請必行前議綸請身自董役兼領海陵郡五年六月辛卯從之閘築堰自小海寨東南至景莊一百八十里於運河置納潮水以通漕起於天聖三載之秋成於六載之春復逋户二千六百民為綸立祠仲淹作頌七月甲午令儀綸遷秩仲淹去職二人實成之卯實録云築堰凡一百八十一里五年十二月乙綸請以問因二十頃墾耕收租增築隄防辛卯賜役卒緡錢淳熙四年十月泰州修桑子河堰乾道捍海堰乾道七年九月十一日知秀州丘崈言華亭東南大海古有堰十八所欲興修從之八年正月二十二日築捍海塘堰成二月十五日御史蕭之敏按視言捍海堰并東西兩岸塘通計八十四里可以永久詔增崈秩乾道六堰興元府山河堰溉民田四萬餘頃世傳蕭何所為嘉祐中史照奏上堰法獲降敕書刻石堰上乾道七年吳拱修六堰浚大小渠六十五復見古迹溉南鄭褒城田二十三萬餘頃五月詔褒之紹興七年五月吳玠等修興元府洋州渠堰詔奬之乾道江陵二隄七年十月十七日湖北漕臣李燾請修江陵潛江縣里社虎渡二隄詔明年修築八年六月十六日荆南守臣葉衡請築襄陽沿江大隄運路二十一堰國史職官志堰楚州之黃蒲寶應北神西河髙郵之新河樊良揚州之邵伯瓜洲潤州之京口吕城常州之望亭奔牛秀州之杉青杭州之長安越州之曹娥梁湖錢青孟州之濟源汝州之梁縣泰州之白莆捍海總二十一監官各一人餘堰不居運路者皆領於州縣渡六十五天文羅堰三星在牽牛柬主隄塘灌溉孫叔敖起芍陂楚受其惠文翁穿㳛水蜀以富饒白公引涇水谷口歌禾黍史起鑿漳河鄴旁詠稻粱張闓築新豐李襲引雷陂灌晉陵惟揚之田各八百餘頃召父杜母之惠靡不由之灑沉炎導流惡數旬而馬牛辨經時而桑田復因地則氣不壅達變則民不倦復地力阜財求民餱不愆神糈可懷禦災鍵患莫匪嘉績昔鄴中渠成邑思西門鴻隙陂壞郡怨方進斯民之生理無極而陵陸川浸之藝屢遷決漳灌鄴旁之田鑿涇沃關內之土隄繇平繇行水唐樊珣絳巖湖記云昔叔敖芍陂能張楚國史起漳水竟富魏邦秦稱鄭白漢歌召杜玉海卷二十三
