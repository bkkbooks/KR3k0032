body:
  text: 玉海卷一百五十七宋王應麟撰宫室宫三唐太極宫西內承天門紀髙祖武德元年五月甲子即皇帝位于太極殿本隋之大興殿今以帝即位改焉太宗貞觀三年四月甲午始御太極殿舊紀甲子始於太極殿聽政地理志上都皇城長千九百一十五步廣千二百步宫城在皇城之北長千四百四十步廣九百六十步周四千八百六十步其崇三丈有半龍朔髙宗後皇帝常居大明宫乃謂之西內神龍中宗元年曰太極宫禮志大祭祀致齋太極殿蕃國主來朝皇帝親征皇帝皇太子加元服皇帝納后皇太子納妃皇帝元正冬至受羣臣朝賀臨軒册皇太子皆設御幄于太極殿皇帝藉田還明日班勞酒于太極殿六典宫城在皇城之北南面三門中曰承天東曰長樂西曰永安承天門隋開皇二年作初曰廣陽門仁夀元年改曰昭陽武德元年改順天神龍元年改承天若元正冬至大陳設宴會赦過宥罪除舊布新受萬國之朝貢四夷之賔客則御承天門以聽政蓋古之外朝也其北曰太極門其內曰太極殿朔望則坐而視朝焉蓋古之中朝也隋曰太興門太典殿煬帝改虔福門貞觀八年改太極門武德元年改太極殿有東西上二閣門東西廊左右延明二門次北曰朱明門左曰虔化門右曰肅章門肅章之西曰暉政門虔化之東曰武德西門其內有武德殿延恩殿又北曰兩儀門其內曰兩儀殿常日聽朝而視事焉蓋古之內朝也隋曰中華殿貞觀五年改為兩儀殿承天門之東曰長樂門北入恭禮門又北入虔化門則宫內也承天門之西曰廣運門永安門北入安仁門又北入肅章門則宫內也兩儀殿之東曰萬春殿西曰千秋殿兩儀之左曰獻春門右曰宜秋門宜秋之右曰百福門其內曰百福殿百福之西曰承慶門內曰承慶殿獻春之左曰立政門其內曰立政殿立政之東曰大吉門其內曰大吉殿兩儀之北曰甘露門其內曰甘露殿左曰神龍門其內曰神龍殿右曰安仁門其內曰安仁殿又有興仁宣猷崇道惠訓昭德安禮正禮宣光通福光昭嘉猷華光暉儀時安綏福等門薰風就日翔鳯咸池臨照望仙鶴羽乘龍等殿凌煙翔鳯等閣舊史正門曰承天正殿曰太極太極之後殿曰兩儀內則殿亭館三十六所凝暉凌煙閣在焉會要武德元年五月二十一日改隋大興殿為太極殿昭陽門為順天門神龍元年二月改為承天門景雲元年十月二十一日以京大內為太極宫長安志當正殿曰承天門內即朝堂東有肺石西有登聞鼓門下省在左延明門東南中書省在右延明門西南省內有舍人院洪文館在門下省東史館在門下省雍録由承天門南至朱雀門北是為宫城之內唐大明宫東內蓬萊宫含元宫永安宫地理志上都大明宫在禁苑東北南接京城之北面西接宫城之東北隅長千八百步廣千八十步曰東內本永安宫貞觀八年十月置又鳯翔麟遊西三十里有永安宫貞觀八年置會要長安二年六月於雍州永安縣置宫名曰永安九年正月改曰大明宫以備太上皇清暑百官獻資以助役高宗厭西內湫濕龍朔二年始大興葺六月改曰蓬萊宫紀龍朔二年四月辛巳作蓬萊宫三年二月丙戌減百官一月俸賦雍同等十五州民錢以作蓬萊宫會要三年四月移仗就蓬萊宫新作含元殿始御紫宸殿聽政百官奉賀咸亨元年改曰含元宫三月四日丁丑改月舊紀咸亨元年三丁丑改蓬萊宫為含元殿長安元年十一月戊寅改為大明宫又玄宗開元二年六月甲子以太上皇避暑徙御大明宫肅宗至德二載十二月丁未上皇自開逺門入大明宫御含元殿慰撫百姓德宗貞元三年初作元英門觀於大明宫北垣六典大明宫在禁苑之東南西接宫城之東北隅南面五門正南曰丹鳯門東曰望仙門次曰延政門西曰建福門次曰興安門南當皇城之啓夏門舊京城入苑之北門開皇三年開餘四門與宫同置李華含元殿賦云望仙闢於巽維建福敞於坤隅丹鳯門內正殿曰含元殿殿即龍首山之東趾也階上高於平地四十餘尺南去丹鳯門四百餘步東西廣五百步元正冬至於此聽朝也夾殿兩閣左曰翔鸞閣右曰栖鳯閣與殿飛廊相接夾殿東有通乾門西有觀象門閣下即朝堂肺石登聞鼓如承天之制含元殿賦云告善之旌登聞之鼓其北曰宣政門門外東廊曰齊德門西廊曰興禮門內曰宣政殿宣政左右有中書門下二省弘文史二館含元殿賦云左黃門而右紫微命伊臯而為長殿前東廊曰日華門門東門下省省東南北街南直含耀門出昭訓門宣政殿前西廊曰月華門門西中書省省西南北街南直昭慶門出光範門宣政之左曰東上閣右曰西上閣次西曰延英門其內之左曰延英殿右曰含象殿宣政北曰紫宸門其內曰紫宸殿即內朝正殿也殿之南靣紫宸門左曰崇明門右曰光順門殿之東曰左銀臺門西曰右銀臺門次北曰九仙門殿之北面曰元武門左曰銀漢門右曰青霄門其內又有麟德凝霜承歡長安仙居拾翠碧羽金鸞蓬萊含涼珠境三清含冰水香紫蘭等殿玄武明義大角等觀鬱儀結鄰承雲修文等閣也禮樂志唐初鐘磬凡三十六簴蓬萊宫成增用七十二簴賈曾為萬年主簿護役蓬萊宫杜甫獻三賦蓬萊宫五行志含元路寢大朝會之所御也餘見殿門鄭后傳宣宗即位奉養大明宫契苾何力傳龍朔初司稼少卿梁修仁新作大明宫初植白楊更植以桐長安志大明宫高宗命司農少卿梁孝仁制造北據髙原南望爽塏孫樵有大明宫賦李華含元殿賦建北宫之尊嚴上取法於天帝圖正殿之道居規崇山而定制因以鴻稱含元建名易乾坤之説曰含弘廣大又曰元亨利貞括萬象以為尊特巍巍乎上京玄象著明帝坐維三皇唐設位俯察仰參翼室正中遊宫次南北起含元其容耽耽總而言之如山之夀則曰蓬萊如日之升則曰大明頌曰帝作含元含元言言崒若日觀呀為天門唐洛陽宫地理志東都隋置太業元年移都武德四年廢貞觀六年號洛陽宫太宗之幸者六高宗之幸者十四顯慶二年十二月丁卯曰東都光宅元年九月甲寅曰神都宫名太初神龍元年復曰東都天寶元年曰東京上元二年罷京肅宗元年一本云寶應復為東都皇城長千八百一十七步廣千三百七十八步周四千九百三十步其崇三丈七尺曲折以象南宫垣名曰太微城宫城在皇城北長千六百二十步廣八百有五步周四千九百二十有一步其崇四丈八尺以象北辰藩衛名曰紫微城武后號太初宫都城前直伊闕後據邙山左瀍右澗洛水貫其中以象河漢東西五千六百一十步南北五千四百七十步西連苑北自東城而東二千五百四十步周一萬五千五十步其崇丈有八尺武后號曰金城紀太宗貞觀四年六月乙卯發卒治洛陽宫十一年二月甲子三月癸丑一本又云丙午宴從官十一月丙午皆如洛陽宫十五年正月辛巳十月壬辰十八年十月甲寅皆如洛陽宫十九年二月庚戌如洛陽宫以伐高麗初太宗為秦王建德世充平置酒大會洛陽宫論郭孝恪之功又召張儉見洛陽宫論遼西山川險易見各傳高宗顯慶二年閏正月壬寅七月丁亥十二月乙卯並如洛陽宫丁卯以洛陽宫為東都四年閏十月戊寅五年四月癸巳十二月己卯麟德二年二月壬午咸亨二年正月乙巳十二月丙戌儀鳯元年三月甲辰調露元年正月戊子永隆元年二月乙丑八月丁未永淳元年四月丙寅弘道元年四月己未十一月丁未並如東都傳張元素貞觀四年發卒治洛陽宫乾元殿且東幸元素上書諫曰陛下初平東都之始層樓廣殿皆令撤毁豈有初則惡其侈靡今乃襲其雕麗帝顧房玄齡曰洛陽朝貢天下中朕營之意欲便四方百姓今元素言如此後雖露坐庸何苦耶詔罷役皇甫德參亦諫竇璡為將作大匠修洛陽宫鑿池起山務極浮侈費不勝算太宗怒詔毁之免其官薑確為少匠護作九成洛陽宫以幹力稱謝偃太宗幸東都榖洛壞洛陽宫詔求直言偃上書陳得失十一年七月會要武德四年十二月七日使行臺僕射屈突通焚乾元殿應天門紫微觀以其太奢薛收傳秦王入洛觀隋宫室收進曰峻宇雕墻殷以亡土階茅茨堯以昌阿房興秦禍速露臺罷漢祚永王重其言貞觀三年太宗將修洛陽宫戴胄諫云云上嘉之四年六月二十四日又修洛陽宫張元素諫云云即停之舊紀貞觀十一年三月丙申改洛州為洛陽宫六典貞觀六年改洛陽宫十二年車駕始幸洛陽六典皇宫在皇城之北東西四里南北二里周回十三里南靣三門中曰應天左曰興教右曰光政應天門端門若西京承天門其內曰乾元門若太極門東西廊有左右延福門興教之內曰會昌章善光政之內曰廣運明福乾元之左曰萬春右曰千秋其內曰乾元殿即明堂也證聖元年所造上圓下方八窗四闥高三百尺殿之左曰春暉門右曰秋景門北曰燭龍門明福之東曰武成門其內曰武成殿明福之西曰集賢門其內曰集賢殿武成之北曰長夀殿集賢之北曰仙居殿東曰億歲殿又東曰周明殿西北出曰洛城西門其內曰德昌殿北曰儀鸞殿南出曰延慶門又南曰韶暉門西南曰洛城南門其內曰洛城殿又北曰飲羽殿洛城南門之西有麗景夾城自此潛通於上陽焉會要顯慶元年敇田仁汪因舊餘趾修乾元殿麟德二年三月十二日殿成天寶二年正月二十八日築神都羅城號曰金城永泰元年十二月修東都宫殿舊紀云修洛陽宫韋弘機傳高宗嘗言兩都我東西宅然因隋宫室日仆不葺乃詔弘機兼將作少府二官督營繕李林甫謂二都帝東西宫褚無量傳內府舊書無量建請繕録補第以廣祕籍開元七年五月六典開元五年天子詔於東都乾元殿東箱部彚整比無量為之使無量整比四部書成上令百姓官人入乾元殿東廊觀書無不驚嘆官志開元十二年東都明福門外亦置麗正書院洛陽宫記胡交修禹因山川分畫九州大河之南厥土為豫考極相方實處天下之中風雨所會隂陽所和而沖氣鍾焉其川河洛圖書之淵珍符是興其鎮嵩髙孕秀生賢神靈是宅其浸瀍澗伊水之利環流灌溉壤沃物豐其地廣衍平夷洞達萬方輻湊朝覲貢賦道理均焉奠位宅中兹實帝王之居也高祖太宗肇造區夏據秦百二之勢襲漢纍世之基定都長安以隆上京惟是洛宅雖不獲奉萬乘之駕建諸夏之本而文皇帝顧瞻歷覽眷此舊邦肇新東都作對咸秦乃以貞觀六年名洛陽宫凡體國之制仰模太紫擬象河漢者雖因隋之舊逮夫一新號名昭揭於兩觀之上則觚稜金爵璧門鳯闕焜耀改觀益隆唐家興王之氣矣太宗以神武英偉之姿一加眄睞榮名所被在物咸飾使巍巍兹宫復取重於當世豈不韙哉開元之隆鑾輿時巡詔命儒臣宋璟馬惟白等博彚羣書於乾元殿又即明福門外置集賢書院置學士員校讎其間而藏書之富殆與長安大明宫集賢書院等不其盛歟臣幸預翰墨紀事迹本末載於文字臣之職也竊惟周家興於岐邠武王宅都於鎬至成王乃命周召相基定卜於兹新邑宣王中興大會諸侯纂承文武師徒狩獵詩人咏歌則洛陽於周為四方朝貢之地也尚矣太宗乃克大倣古以不廢周王迓衡之迹用宏兹賁光于土中克紹上帝匹休成周嗚呼盛哉若夫城隅廣狹之度宫庭考室之制皆不足書書是宫有合先王之制者以詔後世云唐長春宫紀高祖起義兵九月甲子次長春宫在同州朝邑縣本周武帝作時保定五年宇文護築隋開皇中修之十六年十月己丑幸長春宫太宗貞觀十二年二月甲戌如長春宫先是武德二年正月癸卯太宗鎮長春宫十月討武周乙卯高祖至長春送之又舊紀武德元年鎮長春宫高祖幸長春宫親送太宗討武周免朝邑今歲租賦降囚罪玄宗開元八年十月辛巳如長春宫德宗貞元元年四月壬午渾瑊及李懷光戰于長春宫敗之列傳竇軌大業中高祖起兵軌募衆千餘人迎謁長春宫帝大恱使略地渭南于志寧大業末高祖入關率羣從迎謁長春宫長孫無忌高祖兵度河進謁長春宫顔師古高祖入關謁長春宫吕元膺辟長春宫判官魏謨為長春宫巡官會要開元八年六月同州刺史薑師度兼營田長春宫使二十年三月皇甫惟明充後皆以他官充使至大厯九年宋晦以同州刺史充開元九年十二月十七日敕同蒲絳河東西沙苑田並收入長春宫二十九年十一月十七日敕新豐朝邑屯田令長春宫使檢校朝邑屯田薑師度於開元八年十月十七日開置寶厯二年九月敕同州長春宫莊宅置內莊宅使掌之文苑梁洽長春宫賦視河外之離宫信寰中之特美飛重樓之沓秀繚長垣而層趾長者仁夀之符春者發生之所大業十三年高祖起義自河東引兵而西濟河至朝邑舍於長春宫休甲養士仍資永豐倉粟迄後此宫不廢揆之商周其殆西亳偃師之類歟唐長樂宫舊紀義寧元年髙祖入關十月辛巳至長樂宫有衆二十萬十一月丙辰克長安還舍長樂宫約法十二條甲子入長安武德五年三月丁未秦王破劉黑闥四月庚戌還京師高祖迎勞於長樂宫韋雲起傳高祖入關上謁長樂宫授司農卿隋志京兆大興縣有長樂宫唐萬年縣唐弘義宫大安宫獻獲大安宫紀高祖武德五年七月甲申作弘義宫太宗貞觀三年四月乙亥太上皇徙居大安宫舒王傳髙祖在大安宫太宗晨夕使尚宫問起居甲午始御太極殿四年十月甲辰獵于魚龍川獻獲于大安宫五年正月癸酉獵于昆明池丙子獻獲于大安宫一本又云貞觀六年十月乙卯帝偕中宫于兹侍燕服膳互陳上親捧輿至于殿門十月侍上皇宴於大安宫帝與皇后更獻飲膳及服御之物地理志京兆長安縣有大安宫本弘義宫會要武德五年七月五日紀作甲申營弘義宫初秦王居宫中承乾殿高祖以秦王有克定天下之功建弘義宫以居之至九年七月髙祖以弘義宫有山林勝景雅好之貞觀三年四月乙亥乃徙居之舊紀四月辛巳徙居改為大安宮一云九年七月改名二十三日太宗正位於太極殿紀云甲午始御太極殿六年監察御史馬周上疏曰伏見大安宫居在城之西其墻宇門闕之制方之紫微尚為卑小東宫皇太子居之而在內大安至尊居之反在外願雉堞門觀務從高顯以稱萬方之望則大孝昭矣又本傳唐興德宫地理志同州馮翊南三十二里有興德宫髙祖將趨長安所次元和志在馮翊縣南三十二里義旗將趨京師軍次於忠武園因置亭子名興德宫屬家令寺唐通義宫髙祖紀武德六年四月己未以故第為通義宫祭元皇帝元正皇后于舊寢舊紀武德元年三月戊辰立四廟於長安通義里第會要興慶寺通義坊本髙祖舊宅武德元年為宫貞觀元年為尼寺會要武德六年四月十四日幸龍潛舊宅改為通義宫置酒髙會舊紀日賜從官帛有差詔曰爰擇良辰言遵邑里髙祖舊居奉義監禮同過沛事等歸譙故老咸臻族姻斯會肅恭薦享感慶兼集唐龍躍宫慶善宫武功宫紀髙祖武德六年十二月庚戌會要九月舊紀乙巳以奉義監為龍躍宫即髙祖舊居七年十月丁卯如慶善宫十二月丁卯八年十月壬午如龍躍宫太宗貞觀六年九月己酉幸慶善宫上歡甚賦詩十六年十一月丙辰獵于武功甲子幸慶善宫地理志京兆府髙陵縣西四十里有龍躍宫本髙祖舊宅髙祖置為宫後德宗以宫為修真觀貞元中吳通微作修真宫銘武功縣南十八里臨渭水有慶善宫武德元年髙祖以舊第置宫後廢為慈德寺會要武德元年十月十八日以武功舊宅為武功宫四年閏十月己未次武功舊第六年十二月九日一本云庚戌改為慶善宫貞觀六年九月二十九日太宗幸慶善宫宴從臣於渭濵上賦詩云指麾八荒定懷柔萬國夷單于陪武帳日逐衛文㮰端扆朝四嶽無為任百司共樂還譙宴歡此大風詩賞賜閭里有同漢之宛沛焉起居郎吕才播於樂府被之管絃名曰功成慶善樂初太宗嘗過舊宅賦詩曰新豐停翠輦譙邑駐鳴笳一朝辭此去四海遂為家後重幸武功詩云積善欣餘慶暢武恱成功白水巡前迹丹陵幸舊宫列筵歡故老高宴聚新豐瑞氣縈丹闕祥煙散碧空其年諫議大夫蘇世長侍宴於披香殿酒酣奏曰臣昔在武功幸常陪侍見陛下宅宇才蔽風雨當此之時亦以為足今初有天下而於隋宫之內又加雕飾欲撥亂其可得乎舊史太宗生於武功之别館時有二龍戲於館門之外貞觀十六年十一月丁卯宴武功士女於慶善宫南門酒酣上與父老等泣涕論舊事老人等遞起為舞爭上萬嵗夀通鑑十六年十一月壬戌校獵岐陽田幸宫宴賜故老竇后傳初太宗生而有二龍之符后於諸子中愛視尤篤及即位過慶善宫覽觀哽欷享后於正寢太宗以隋開皇十八年十二月戊午生尉遲敬德傳侍宴慶善宫慶善宫記莫沖唐髙祖神堯皇帝膺上天之正命仗旗建號是承隋作民主天下既定作都長安屬邑武功之南故第存焉乃即位之元年詔以為武功宫六年十二月庚戌錫名慶善明年十月親臨幸焉惟武功宅關中之奧直太華而臨涇水廣川名阜左右回環天府神臯瓌偉絶特蓋神設鬼造以遺我神堯也踐祚之後九重邃宇仰模帝居其髙明顯敞瑰麗靚深雖千百神功之舊而帝心拳拳未嘗一日不在武功也宅基業之宏大念開創之本初思有以顯飾而章異之以貽子孫萬世之傳矧惟密邇畿甸去邑不百里而近詎可以朝夕弗臨為戒爰詔有司閎其地而斥大焉云云推原帝意夫豈為宫室之奉遊觀之娛而已哉昭上帝之貺施聳率土之觀瞻不忘其初期於久逺使子孫知創業之艱難持守盈成之弗易也處心積慮其深逺哉太宗嗣服斯宫實篤生之地靈貺肇甄厥惟二龍仰憲光烈以昭揭休命聖心尤垂意焉玉車再戾合樂張燕賦詩十篇有懷柔萬國指揮八方之語吕才等謂帝以武定天下而守之以文制禮興樂袚飾隆平尤為帝王之極功至于聲詩紀述加惠開迹之所庀允協雅頌之正因取而被之管絃名其樂曰功成慶善樂成而斯宫之美益彰太宗之雅志其休矣乎關中漢舊都也上囿禁苑之內離宫别館三十六所室宇之制盛矣然長楊五柞止為投宿更衣之所厪身於不急之務至於慨念疇昔眷懷枌榆肇作新豐置立社邑外有勞民動衆之過而故址湮沒不彰後世無考焉今慶善之作槩以西京宫室之制雖未足競麗而爭雄若乃營繕之本旨為昭休命而示子孫者則西京之主蓋未知出此也唐仁智宫髙祖紀武德七年五月丙戌會要十七日作仁智宫舊紀會要造於宜州宜君縣六月辛丑如仁智宫地理志坊州宜君縣有仁智宫武德七年置韋挺傳武德七年帝避暑仁智宫唐太和宫翠微宫頌翠微殿地理志京兆府長安縣南五十里太和谷有太和宫元和志太和宫在縣南五十五里終南山太和谷武德八年置四月二十一日甲申造於終南山貞觀十年廢二十一年復置曰翠微宫四月乙丑改籠山為苑元和中以為翠微寺有子午關天寶二年尹韓朝宗引渭水入金光門置潭于西市以貯林木大厯元年尹黎幹自南山開漕渠抵景風延喜門入苑以漕炭薪幹紀髙祖武德八年四月甲申如鄠獵于甘谷作太和宫太和谷在終南山後六月甲子如太和宫太宗貞觀二十一年四月乙丑作翠微宫五月戊子幸翠微宫二十三年四月乙亥幸翠微宫會要武德八年四月二十一日造太和宫於終南山貞觀十年廢二十一年四月九日公卿上言請修廢太和宫厥地清涼可以清暑詔從之乙丑遣將作太匠閻立德於壞順陽王第取材瓦以建之包山為苑自栽木至設幄九日畢工因改為翠微宫正門北開曰雲霞門視朝殿名翠微殿寢殿名含風殿并為皇太子建别宫去臺連延里餘正門西開名金華門內殿名喜安殿列傳崔仁師以帝幸翠微宫上清暑賦以諷上稱善賜帛張昌齡貞觀末翠微宫成獻頌闕下召見試息兵詔少選成文帝大悅徐賢妃會要云徐充容貞觀末會要云二十二年言翠微玉華宫雖因山藉水無築構之苦而工力和僦不謂無煩有道之君以逸逸人無道之君以樂樂身馬周帝幸翠微宫求勝地為起第舊紀貞觀二十一年四月乙丑營太和宫於終南之上改為翠微宫宫在麗山絶頂太宗避暑于此後為寺通鑑二十一年五月戊子幸翠微宫庚辰上御翠微殿問侍臣曰朕才不逮古人而成功過之止由五事耳太宗有秋日翠微宫詩唐九成宫萬年宫地理志鳯翔府麟遊縣西五里有九成宫宫成增築二十七本隋仁夀宫開皇十三年二月丙子營十五年成三月丁亥幸義寧元年廢貞觀五年復置更名永徽二年曰萬年宫九月癸巳改通鑑戊戌乾封二年二月辛丑復曰九成宫周垣千八百步并置禁苑及府一作武庫宫寺等紀太宗貞觀六年三月戊辰五月癸未八年三月庚辰十三年四月戊寅十八年四月辛亥皆如九成宫貞觀六年四月己亥太宗避暑於宫以杖刺地有泉湧出飲之可以愈疾祕書監檢校侍中魏徵作醴泉銘碑在鳯翔髙宗永徽五年三月戊午麟德元年二月癸卯如萬年宫總章元年二月戊寅二年四月己酉咸亨元年四月庚午如九成宫會要永徽二年九月八日通鑑戊戌改九成宫為萬年宫乾封二年二月十日辛丑復為九成宫三年四月將作大匠閻立德造新殿成移仗御之謂侍臣曰朕性不宜熱所司頻奏請造此殿既作之後深懼人勞今暑熱朕在屋下尚有流汗匠人暴露事亦可憫所以不令精妙意者祗避炎暑耳長孫無忌曰聖心每以恤民為念天德如此臣等不勝幸甚五年三月幸萬年宫上謂太尉無忌曰此宫非直涼冷且去京不逺朕離此十年屋宇無多損壞昨者不易一椽一瓦便己可安乃親製萬年宫銘并序七百餘字羣臣請刻石于永光門詔從之集古録萬年宫碑以永徽五年立列傳竇后太宗幸九成宫夢后若平生明日詔有司發倉賑貧以為后報魏徴帝幸九成宫吏改館宫御以舍李靖王圭徴曰靖圭皆腹心大臣馬周上疏曰明詔以二月幸九成宫太上皇春秋髙宜朝夕視膳今所幸宫去京三百里而逺非能旦發暮至也上皇留熱處而陛下走涼處溫清之道臣所未安姚思廉太宗幸九成宫思廉以為離宫遊幸是秦皇漢武事非堯舜禹湯所為帝諭曰朕豈為遊賞者乎薑確貞觀中為少匠護作九成宫薛仁貴永徽五年高宗幸萬年宫水暴至仁貴大呼以警宫內百官志武德初改隋仁夀宫監曰九成宫監一本云總監禮樂志高宗幸九成宫復奏破陳樂嘆曰不見此樂垂三十年舊紀咸亨四年七月庚午九成宫太子新宫成上召五品以上宴太子宫極歡而罷德宗紀即位三年正月戊午罷九成宫貢立獸炭王勃九成宫頌扄牖六合奔走八神梯霄架極考遺基於汶上稽故典於淹中陽靈開避暑之宫景福制追涼之殿銅龍對霤鐡鳯連甍浮丹麗紫棲霞冠月禮讃三宫詩歌百堵唐西宫會要貞觀二年八月上日視膳西宫公卿奏以宫中卑溼請立一閣上恐所費過露臺不許紀開元四年正月戊寅朔朝太上皇于西宫受朝正殿畢親朝上皇肅宗元年建子月戊戌冬至朝聖皇於西宫唐東宫見儲宫唐未央宫實録太宗貞觀七年十二月丙辰校獵少陵原戊午還宫從上皇置酒故漢未央宫三品以上咸侍上皇命突厥頡利可汗起舞又命南蠻酋長馮智戴詠詩既而笑曰胡越一家古未有也太宗奉觴上夀曰今四夷入臣皆陛下教誨非臣智力所及昔漢高祖亦從太上皇置酒此宫妄自矜大臣所不取也太宗嘗幸未央宫草中見一人帶刀遽引還顧謂太子縱遣之中宗景龍二年十二月甲寅幸漢故未央宫舊基引從臣賜宴會要寶厯二年五月神䇿軍於苑內古長安城中修漢未央宫獲白玉牀長六尺栁公權傳從幸未央宫帝駐輦曰朕有一喜邊戍賜衣久不時今中春而衣已給當賀我以詩按兩京記隋文帝增修未央池會要寶厯二年修未央宫長安志武宗會昌元年因遊畋至未央宫見其遺址詔葺之總三百四十九間作正殿曰通光黃圖未央有通光殿蓋采舊名東曰韶芳亭西曰凝思亭立端門其內門揭未央宫名命學士裴素撰記素重修漢未央宫記曰細草迎輦神颷引衣趙彥昭李乂有和幸長安故城未央宫詩吕大防圖以未央宫為通光殿唐飛山宫明德宫紀太宗貞觀十一年正月庚子作飛山宫六月丁巳幸明德宫在洛陽七月壬寅廢明德宫之玄圃院賜遭水家髙宗顯慶二年五月丙申幸明德宫避暑會要貞觀十一年正月十四日新作飛山宫七月二十日廢明德宫及飛山宫之玄圃院以分給遭水之家魏徵傳帝作飛山宫徵上疏諫於是廢明德玄圃院賜遭水者唐昭仁宫魏徴傳太宗幸洛政要云貞觀十二年次昭仁宫政要諫録云顯仁宫多所譴責徴諫曰隋惟責不獻食或供奉不精而至於亡今正當兢懼戒約何令人悔為不奢唐襄城宫清暑宫太宗紀貞觀十四年八月庚午作襄城宫十五年三月戊辰會要七日如襄城宫會要貞觀十七年八月五日營襄城宫閻立德傳又會要太宗幸洛陽詔立德按爽塏建離宫清暑乃度地汝州西山控汝水睨廣成澤號襄城宫役凡百九十萬雜費稱是宫成煩燠不可居十五年三月九日舊紀庚午帝廢之以賜百姓地理志臨汝有清暑宫在鳴臯山南貞觀中置唐玉華宫玉華殿太宗紀貞觀二十一年七月丙申舊紀七月庚子通鑑同會要十二日作玉華宫閻立德造二十二年二月乙亥幸玉華宫又二十一年八月壬戌詔玉華宫制度務從菲薄更令卑陋二十二年三月丁亥詔曰即潤疏隍憑巖建宇土無文繢木不雕鏤矯鋪首以荆扉變綺窗於甕牖地理志玉華宫在坊州宜君縣北四里鳯凰谷貞觀二十年置永徽二年廢為玉華寺舊紀九月癸巳廢為寺會要九月三日元和志云寺內有肅成殿會要正門曰南風門殿曰玉華皇太子所居南風門東正門曰嘉禮門殿名暉和殿正殿瓦覆餘皆葺之以茅意在清潔務從儉約二十二年四月二十四日太宗以頻造離宫終費人力謂侍從曰唐堯茅茨不剪以為盛德不知堯時無瓦瓦蓋桀紂為之今朕構采椽於椒風之日立茅茨於有瓦之時將為節儉自當不謝古者昔宫室之廣大役人工以此再思不能無愧其月徐充容上疏諫二十三年一作二十二年四月御製玉華宫銘詔令皇太子以下皆和貞觀二十一年正月玉華宫李木連理隔澗合枝房玄齡傳帝幸玉華宫詔玄齡居守閻立德傳為將作大監營翠微玉華二宫擢工部尚書藝文志藝術有閻立德畫玉華宫圖杜甫玉華宫詩有遺構絶壁之語唐蘭昌宫連昌宫地理志河南福昌縣西十七里有蘭昌宫有隋故福昌宫顯慶三年復置夀安縣西二十九里有連昌宫顯慶三年置元稹有詞唐八關宫合璧宫髙宗紀顯慶五年五月辛丑作八關宫會要顯慶五年四月八日舊紀戊寅於東都苑內造八關涼宫舊紀云八關宫五月二十日改為合璧宫舊紀壬戌幸改實録龍朔元年四月丁卯乾封元年三月甲申咸亨三年四月庚午幸合璧宫舊紀龍朔元年三月壬戌麟德元年二月丁酉咸亨三年四月戊寅上元二年四月己亥並幸合璧宫張文瓘傳乾封中造蓬萊上陽合璧等宫帑廥浸虛文瓘諫唐繡嶺宫桃源宫﨑岫宫蘭峰宫地理志陜州峽石縣有繡嶺宫顯慶三年置靈寶縣有桃源宫武德元年置河南永寧縣西五里有﨑岫宫西二十三里有蘭峰宫皆顯慶三年置明皇雜録上幸東都至繡嶺宫唐三內地理志龍朔後皇帝常居大明宫謂之西內正宫神龍元年曰太極宫隋大興宫也大明宫亦正宫在禁苑東北西接宫城之東北隅曰東內本永安宫貞觀八年置九年曰大明宫以備太上清暑高宗以風痺厭西內湫隘大興葺曰蓬萊宫咸亨元年曰含元宫長安元年復曰大明宫興慶宫離宫在皇城東南距京城之東開元初置十四年增廣之謂之南內雍録諸帝多居大明或遇大禮大事復在太極如高宗玄宗五日一御太極亦有初即位不於大明而於太極者知太極尊於大明也興慶雖夾城可潛達大明當為離宫而已唐太清宫太微宫洞霄宫紫極宫升仙宫紀髙宗乾封元年二月乙未如亳州祠老子追號太上玄元皇帝睿宗景雲二年四月甲辰作玄元皇帝廟玄宗開元二十九年正月丁酉立玄元皇帝廟天寶元年神仙道家之説興正月甲寅陳王府參軍田同秀言玄元皇帝降于丹鳯門大明宫正門通衢乃建廟二月辛卯享玄元皇帝于新廟甲午享于太廟二年正月乙卯作升仙宫丙辰加號玄元皇帝為太聖祖三月壬子享于玄元宫追號大聖祖父周上御大夫敬曰先天太皇臯陶曰德明皇帝涼武昭王曰興聖皇帝改西京玄元宫曰太清宫東京曰太微宫仍於天下諸郡為紫極宫秋改譙郡紫極宫為紫微宫九月辛酉譙郡紫微宫改為太清宫天寶八年閏六月丙寅謁太清宫加上玄元皇帝號曰聖祖大道玄元皇帝九載十月太白山人王元翼言玄元皇帝降于寶仙洞十載正月壬辰朝獻太清宫癸巳朝享太廟甲午有事於南郊十三載二月壬申朝獻于太清宫加上玄元皇帝號曰太聖祖髙上大道金闕混元天皇大帝肅宗至德二載通化郡言混元皇帝降武宗會昌五年九月改修太微宫十一月畢六年十月遣使薦獻禮樂志天寶元年因田同秀言建玄元廟二月辛卯親享玄元皇帝廟甲午親享太廟丙申有事于南郊其後遂以為故事終唐之世莫之能改也初太清宫成太常卿韋縚製景雲九真紫極小長夀承天順天樂六曲地理志亳州真源縣有老子祠天寶二年曰太清宫又有洞霄宫先天太后祠也舊紀天寶二年改天下諸郡玄元廟為紫極宫九月辛酉譙郡紫微宫改曰太清宫長安志田同秀上言玄元皇帝降見丹鳯門之通衢以天下太平聖夀無疆之言傳於玄宗仍告賜靈符尹喜之故宅上遣使就桃林縣函谷關令尹臺西得之於是置廟於太寧坊東都於積善坊取太白山白石為真像衮冕之服當扆南向玄宗肅宗真容侍立於左右皆朱衣朝服宫垣之內連接松竹以像仙居殿十二間四柱前後各兩階東西各側階一其宫正門曰瓊華東門曰九靈西門曰三清御齋院在宫之東公卿齋院在宫之西宰相表興元元年十二月己卯同平章事李勉加太清宫使盧翰加太微宫使李庾西都賦薦祖建宫玄元之庭霞帔雲冠飄飄太清天子將有事也歲豆時籩夏簋殷鉶傳金爐之御煙開甲帳之琳琅此王者之示孝也杜甫朝獻太清宫賦天寶十三載上歷良辰而戒吉乘輿備乎冕裘甲子王以昧爽春寒薄而清浮虛閶闔逗蚩尤張猛馬出騰虬梢熒惑墮旄頭風伯扶道雷公挾輈通天台之雙闕警溟漲之十洲浩劫礧砢萬仙颼飀歘臻于長樂之舍巍入乎崑崙之丘太一奉引庖犧在右堯步舜趨禹馳湯驟斷紫雲而疏牆撫流沙而承霤仡神光而􅛦閜羅詭異以戢普地軸傾而融曳洞宫儼以嶷岌九天之雲下垂四海之水皆立馮宿撰太清宫鐘銘朝獻太清宫肅宗元年建子月己酉代宗廣德二年二月癸酉德宗建中元年正月己巳貞元六年十一月戊辰九年十一月癸未憲宗元和二年正月己丑穆宗長慶元年正月己亥敬宗寶厯元年正月己酉文宗太和三年十一月壬辰武宗會昌元年正月己卯五年正月己酉宣宗大中元年正月壬子唐神臺宫瓊嶽宫金城宫地理志華州鄭縣東北三里有神臺宫本隋普德宫咸亨三年更名華隂西十八里有瓊嶽宫故隋華隂宫顯慶三年更名華隂東十三里有隋金城宫武德三年廢顯慶三年復置鳯翔府盩厔有隋宜夀宫元和志隋宜夀宫在盩厔縣東南三十二里唐上陽宫宿羽高山宫地理志上陽宫在東都禁苑之東東接皇城之西南隅東京記在皇城西南東苑上元中置會要上元二年髙宗之季常居以聽政虢州湖城有故隋上陽宫貞觀初置咸亨元年廢隋志河南桃林有上陽宫韋弘機傳髙宗常言兩京我東西宅然因隋宫室日仆不全將更作奈財用何弘機言臣任司農十年省常費三十萬緡以治宫室可不勞而成帝大悅詔兼將作少府二官督營繕初造宿羽高山等宫徙洛中橋於長夏門廢利涉橋人便之天子乃登洛北絶岸延眺良久歎其美詔即其地營宫所謂上陽者武后於上陽宫令術家撰方域等篇有東京記韋弘機造上陽宫掘地得銅器似盆而淺中隱起雙鯉之狀魚間有四篆字曰長宜子孫時人以為李氏再興之符六典上陽宫在皇城之西南南臨洛水西拒榖水東靣即皇城右掖門之南上元中營造東靣二門南曰提象門北曰星躔門提象門內曰觀風門南曰浴日樓北曰七寶閣其內曰觀風殿其西則有西上陽宫兩京記云上陽宫西有西上陽宫北曰化成院西南曰甘露殿殿東雙曜亭又西曰麟趾殿東曰神和亭西曰洞元堂觀風之西曰本枝院又西曰麗春殿殿東曰含蓮亭西曰芙蓉亭又西曰宜男亭北曰芬芳亭其內曰芬芳殿宫之南靣曰仙洛門又西曰通仙門其內曰甘湯院次北東上曰玉京門門內北曰金闕門南曰太初門玉京之西曰客省院蔭殿翰林院又西曰上陽宫宫西曰含露門玉京西北出曰仙桃門又西曰夀昌門門北出曰玄武門門內之東曰飛龍廏會要儀鳯四年車駕入洛乃移御之上陽宫神龍元年二月朝則天皇帝於上陽宫敕十日一朝侍御史盧懷慎諫通鑑長安三年十一月丙申宴突厥使於宿羽臺太子預焉舊紀開元二十年四月乙亥宴百官於上陽東洲李庾東都賦上陽别宫丹粉多狀鴛瓦麟翠虹梁疊壯出地標圖臨池寫障霄倚霞連屹屹言言翼太和而聳觀側賔曜而疏軒若蓬萊之真侣瀛洲之列仙鸞駕鶴車往來中天賈登上陽宫賦沓雲宇而承天擎露蓋而洗日謝觀上陽宫望幸賦宫闕崇崇縈帶洛河之上唐紫桂宫芳桂宫髙宗紀調露元年五月戊戌作紫桂宫於澠池之西永隆元年四月乙丑如紫桂宫地理志河南府澠池縣西五里有紫桂宫儀鳯二年置會要作四年五月十九日調露二年曰避暑宫永淳元年四月十五日改曰芳桂宫弘道元年廢陜州陜縣有陜城宫舊紀永淳元年四月戊寅次紫桂宫二年五月庚寅幸芳桂宫至合璧宫韋弘機傳永淳中帝幸東都至芳桂宫召弘機檢校園苑唐奉天宫舊紀永淳元年七月己亥紀同造奉天宫於嵩山之陽志在河南登封縣二年即弘道元年正月甲午朔幸奉天宫紀同正一本云月庚子至奉天宫十一月癸亥幸奉天宫會要永淳元年七月造奉天宫於嵩山之陽弘道元年十二月廢文明元年二月改為嵩陽觀舊紀調露二年二月己未幸嵩陽觀又幸逍遙谷道士潘師正所居禮樂志永淳元年作奉天宫於嵩山南遂幸焉將以明年封禪不克至武后遂登封焉列傳韓爰諫廢王后貶死內外以言為諱將二十年帝造奉天宫御史李善感始上疏極言時人喜之謂為鳯鳴朝陽潘師正居逍遙谷髙宗營奉天宫敕直逍遙谷作門曰仙遊北曰尋真時太常獻新樂帝更名祈仙望仙翹仙曲王方翼髙宗召議西域事見奉天宫賜食具對熱海苦戰狀唐萬全泉宫髙宗紀永淳元年七月通鑑二月作萬泉宫舊紀永淳元年七月己亥於藍田造萬全宫會要儀鳯三年正月七日於藍田作涼宫名萬全通鑑作泉宫弘道元年十二月七日廢地理志京兆藍田永淳元年作萬全宫弘道元年廢唐晉陽宫地理志北都天授元年置神龍元年罷開元十一年復置天寶元年曰北京上元二年罷肅宗元年復為北都晉陽宫在都之西北宫城周二千五百二十步崇四丈八尺都城左汾右晉潛丘在中長四千三百三十一步廣三千一百二十二步周萬五千一百五十三步其崇四丈汾東曰東城貞觀十一年長史李績築兩城之間有中城武后時築以合東城宫南有大明城故宫城也宫城東有起義堂倉城中有受瑞壇髙祖使子元吉留守獲瑞石有文曰李淵萬吉築壇祠以少牢明皇御製晉陽宫詩有念成功懷經綸之句見張説集漢明遲回於南陽魏文殷勤於譙國宋有丹徒宫齊有青溪宫唐汾陽宫狄仁傑傳髙宗幸汾陽宫隋紀大業三年八月壬寅詔營晉陽宫十一年三月己酉幸太原避暑汾陽宫唐三陽宫興泰宫武后紀久視元年一月戊寅復于神都作三陽宫四月戊申如三陽宫長安四年正月丁未作興泰宫四月丙子如興泰宫會要聖厯三年十一月二十八日造三陽宫於嵩陽縣久視元年張説以車駕在三陽宫不時還都上疏諫長安四年正月二十二日丁未毁三陽宫取其材木造興泰宫於夀安縣之萬安山左拾遺盧藏用諫不從地理志河南府登封有三陽宫聖厯三年置夀安西南四十里萬安山有興泰宫長安四年置韋安石傳武后幸興泰宫議趨疾道安石曰此道版築所成非自然之固后為回輦武三思傳建營三陽宫於嵩山興泰宫於萬夀山請太后歲臨幸玄宗紀開元十年十月甲寅如興泰宫獵于上宜川唐通天宫萬象神宫見明堂類舊紀神龍元年正月丙午中宗即位於通天宫唐銀潢宫文苑英華魏元忠有侍宴銀潢宫詩玉海卷一百五十七
