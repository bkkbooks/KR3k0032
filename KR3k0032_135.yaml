body:
  text: 玉海卷一百三十五宋王應麟撰官制褒功詔封古者人臣功有五品以德立宗廟定社稷曰勳以言曰勞用力曰功明其等曰伐積日曰閲周司勳功書夏官司勳上士三人下士四人掌六鄉賞地之法以等其功王功曰勳若周公國功曰功若伊尹民功曰庸若后稷事功曰勞若禹治功曰力若咎繇戰功曰多若韓信陳平凡有功者銘書於王之大常祭於大蒸司勳詔之大功司勳藏其二注功書藏於天府又副於此者以其主賞伐太史公曰功有五品勳勞功閲秋官司約下士二人掌治功之約注王功國功之屬凡大約劑書於宗彞小約劑書於丹圗左傳宫之竒曰勳在王室藏於盟府正義王室之勳藏在盟府者凡諸侯初受封爵必有盟誓之言反行飲至舍爵䇿勳注既飲置爵則書勳勞於䇿言速記有功也書洛誥記功宗以功作元祀丕視功載注視羣臣有功者記載之有大功則列為大祀疏或時立其祀配享廟廷亦是也周武王封功臣周頌賚大封於廟也箋武王封諸臣有功者正義謂文王之廟也祭統曰賜爵祿於太廟示不敢専皇甫謐曰武王伐紂之年夏四月乙卯祀於周廟將率之士皆封諸大國四百人兄弟之國十五人同姓之國四十人樂記將率之士使為諸侯是大封也左傳昭二十八年武王克商光有天下兄弟國十五人姬姓國四十人書武成克殷反祀於周廟列爵惟五分土惟三皆大封之事樂記武王克殷未及下車而封薊祝陳下車而封𣏌宋未及下車雖有命封之必至廟受䇿乃成封亦在此大封之中史記武王作武成封諸侯班賜宗彞追思先聖王乃褒封神農之後於焦黃帝之後於祝帝堯之後於薊薊祝焦無聞焉舜之後於陳大禹之後於𣏌於是封功臣謀士而師尚父為首封封尚父於營丘曰齊封弟周公旦於曲阜曰魯封召公奭於燕封弟叔鮮於管叔度於蔡餘各以次受封漢功臣表杜業曰成王察牧野之克願羣臣之勤知其恩結民心功光王府故述先父之志録遺老之榮髙其位大其宇愛敬飭盡命賜備厚是以燕齊之化與周並傳子繼弟及歷載不墮秦淳于越曰殷周之王封子弟功臣千有餘嵗漢通侯籍髙紀五年九月利幾者項羽將為陳令降上侯之潁川上至雒陽舉通侯籍召之而利幾恐反應劭曰舊曰徹侯避武帝諱張晏曰後改為列侯安諸侯王表五年九月前有楚韓王信長沙王吳芮淮王英布燕王盧綰梁王彭越韓王信趙王張敖傳沛公為漢王曹參封建成侯破三秦賜食邑寧秦定魏地賜食邑平陽樊噲臨武侯夏侯嬰昭平侯張良成信侯周勃威武侯定三秦賜食邑懷德酈商信成君賜食邑武成六千戶益食四千户灌嬰昌文侯食杜平鄉傅寬共德君賜食邑雕陰賜爵通德侯靳歙建武侯周緤賜食邑池陽韓信曰以天下城邑封功臣何所不服漢剖符封功臣髙紀六年十二月甲申上還至雒陽始剖符封功臣曹參等為通侯注合符而分授之上已封大功臣三十餘人其餘爭功未得行封雍齒以前已封二十六人張良傳云二十餘人上居雒陽南宫從復道上見諸將偶語以問張良云云三月上置酒封雍齒表正月戊午因趣丞相急定功行封與功臣剖符作誓丹書鐵契金匱石室藏之宗廟史記六年十二月論功與諸列侯剖符行封今考世家及傳其言剖符世世勿絶者曹參平陽陳平戶牖周勃食絳樊噲食舞陽酈商食涿郡夏侯嬰汝陰灌嬰潁陰傅寬陽陵靳歙武信諸侯王剖符而封英布韓王信欒布傳封王剖符受封欲傳之萬世夷狄剖符而封十一年五月尉陀陸賈説陀曰遣臣授君印剖符通侯敘傳爰有朝鮮燕之外區漢興柔逺與爾剖符雖髙祖元功輔臣股肱剖符而爵澤流苗裔則見於太史公年表之自敘與功臣剖符作誓丹書鐵契則見於班氏髙紀之贊剖符世爵受山河之誓則見於杜業之納説受命之初贊功剖符則見於功臣表之述還至雒陽與功臣剖符定封見於陳平傳王吸召歐薛歐陳濞陳嬰雖同甲申之封而傳無剖符之事張良為謀臣然封於正月丙午亦無剖符之言功臣表六年十二月甲申封平陽曹參信武靳歙汝陰夏侯嬰清河王吸陽陵傅寬廣嚴召歐廣平薛歐博陽陳濞堂邑陳嬰曲逆陳平凡十人正月丙午封留張良射陽劉纒鄼蕭何絳周勃舞陽樊噲曲周酈商潁陰灌嬰汾陰周昌梁鄒武虎成董泄蓼孔聚費陳賀陽夏陳豨凡十三人正月丁未隆慮周竈戊申陽都丁復壬子陽信侯吕青戊午東武郭蒙什方雍齒三月丙申棘蒲陳武庚子都昌朱軫武強嚴不識貰合傳胡害海陽搖毋餘南安宣虎肥如蔡寅曲成蟲達河陽陳涓合三十七人四月癸未封敬市六月丁亥封栁丘魏其祁平七月庚寅封河陵昌武戊戌封髙宛宣曲終陵八月丙辰有束茅斥丘之封甲子有臺定安國樂成辟陽剻成安平之封丁丑有北平之封若淮陰范魯城父任棘丘髙胡厭次之封皆在六年而逸其月日六年所封自平陽至厭次侯爰類凡六十四人自平臯劉它至平棘林摯十一人封於七年深澤趙將夕至龍陽陳署十八人封於八年以至九年封平侯張瞻師以下六人十一年封東陽張相如以下十九人十二年封中牟單右車以下十九人髙祖順斗極運天關橫巨海票崑崙提劔而叱之麾城摲邑下將降旗一日之戰不可殫記鞮鍪生蟣虱介胄被沾汗以為萬姓請命雽皇天規億載恢帝業七年之間天下密如也樊酈曹灌攜劔摧鋒從髙皇帝墾災除害耘鋤海內敘傳雲起龍驤化為侯王漢十八侯位次元功十八人位次論功定封列侯位次簿漢功臣表自古帝王之興曷嘗不建輔弼之臣所以共成大功者乎漢興自秦二世元年之秋楚陳之嵗初以沛公總帥雄俊三年而後西滅秦立漢王之後五年東克項羽即皇帝位八載而天下乃平始論功而定封訖十二年侯者百四十有三人表增十人時大城名都民人散亡戶口可得而數裁十二三是以大侯不過萬家小者五六百戶封爵之誓曰使黃河如帶泰山如厲國以永存爰及苗裔於是申之以丹書之信重之以白馬之盟又作十八侯之位次孟康注曰唯作元功蕭何等十人位次耳髙后乃詔作位次下竟師古曰謂蕭何曹參張敖周勃樊噲酈商奚涓夏侯嬰灌嬰傅寬靳歙王陵陳武王吸薛歐周昌丁復蟲達從第一至十八也奚史記正義載姚察説同王史記正義云楚漢春秋無涓薛歐有韓欽陳潰而吸為王崇丁復為丁侵鄼文終侯蕭何位次第一平陽懿侯曹參二宣平武侯張敖三絳武侯周勃四舞陽侯樊噲五曲周侯酈商六魯侯奚涓七汝陰文侯夏侯嬰八潁陰懿侯灌嬰九陽陵景侯傅寬十信武肅侯靳歙十一安國武侯王陵十二棘蒲剛侯陳武十三清河定侯王吸十四廣平敬侯薛歐十五汾陰悼侯周昌十六陽都敬侯丁復十七曲成圉侯蟲達十八表位次自平陽懿侯曹參至鹵嚴侯張平第四十八髙祖一百四十七人孟康注曰曹參位第二而表在首蕭何位第一而表在十三以封前後故也晉庾峻曰以張良之勳而班在叔孫之後師古曰張耳及敖並無大勳蓋以魯元之故吕后曲升之顔遊秦云髙祖自云得天下由張良稱其才也敘位乃以曹參次蕭何校其勤也至如戶數多寡或以才德或以功勞亦無定也故稱蕭何位第一戶唯八千張良食萬户而位過六十他皆類此大事記髙帝六年三月書定功行封又作元功十八人位次以史記本紀監年表修張敖以髙帝九年四月廢王為侯蓋今年有詔作元功十八人位次及位次之定乃在九年以後也自十九以下皆陳平所定平之第在四十七留侯之定在六十二蓋不欲與功臣爭先髙帝時先後略有定次髙后世特因其舊而銓品之耳漢表載位次陸史記表載侯第第一鄼文終蕭何終於第百三十七量侯須無詔以為列侯自置吏受令長沙王漢表孝惠髙后者六人有位次史記削之史記世家列侯畢已受封及奏位次皆曰曹參第一鄂千秋進曰云云蕭何第一曹參次之本傳論功行封郡臣爭功嵗餘不決上以何功最盛先封為鄼侯史記索隱曰姚氏云十八侯史記與漢書表同而楚漢春秋則不同者陸賈記事在髙祖惠帝時漢書是後定功臣等列及陳平受吕后命而定或已改邑號故人名亦别且髙祖初定唯十八侯吕后令陳平終竟已下列侯第録凡一百四十三人也史記正義曰顧胤云髙祖止定十八侯吕后令陳平終竟第録按髙祖定十八侯陳平定一百一十九侯凡一百三十七人八人孝惠髙后封功臣凡一百四十三人一百二十九預侯第十四人不預有罪及改封王西漢列侯及建武而存者平陽建平富平爰戚髙昌歸德義成長羅漢魏文章班固泗水亭碑十八侯銘有良平紀通而無奚涓薛歐丁復陳張畫䇿蕭勃翼終出爵褒賢列土封功敘將十八贊述股肱休勳顯祚永永無疆鄼侯何將軍舞陽侯樊噲將軍留侯張良表位次六十二大尉絳侯周勃相國平陽侯曹參丞相戶牗侯陳平表位次四十七南宫侯張敖表作宣平衛尉曲陽侯酈商將軍潁陰侯灌嬰將軍陽陵侯傅寬將軍武信侯靳歙丞相安國侯王陵將軍襄平侯紀通表位次六十六將軍棘津侯陳武御史大夫汾陽侯周昌曲成侯蟲達將軍青陽侯王吸表作清河文選陸士衡漢髙祖功臣頌蕭何曹參張良陳平韓信彭越黥布張耳韓王信盧綰吳芮劉賈王陵周勃樊噲酈商夏侯嬰灌嬰傅寬靳歙劉敬酈食其陸賈叔孫通魏無知隨何三老董公轅生紀信周苛侯公三十一人表究其本末并敘位次陽陵侯傅寬位次曰武忠侯曲成圉侯蟲達位次曰夜侯平悼侯工師喜位次曰聊城侯猗氏敬侯陳遫位次曰長陵侯土軍式侯宣義位次曰信成侯注師古曰漢列侯位簿有諡號姓名與史記不同者表則具載史記十二諸侯年表以下以地為主故年經而國緯所以觀天下之大勢髙祖功臣侯年表以下以時為主故國經而年緯所以觀一時之得失班氏分異姓同姓王為兩表漢初親疏相錯之意不復見同姓諸侯王表廢年經國緯之制王子侯以下諸表廢國經年緯之制徒列子孫曽玄世數是特聚諸家之譜牒耳恩澤侯表髙帝行賞授位爵以功為先後官用能為次序髙紀五年東克項羽六年十二月甲申始剖符封功臣曹參等為通侯三月置酒封雍齒趣丞相急定功行封十二年史臣稱初髙祖又與功臣剖符作誓丹書鐵契金匱石室藏之宗廟雖日不暇給其規模宏逺矣注以金為匱以石為室緘封之保固之義也漢興功臣受封元功侯籍漢廟舊籍見後著録勳臣帝籍史記功臣表漢興功臣受封者百有餘人索隱曰髙祖功臣百三十七人兼外戚王子一百四十三人受封漢功臣表究其本末并序位次盡于孝文以昭元功之侯籍師古曰籍謂名録髙紀所云通侯籍也漢興訖十二年侯者百四十有三人表敘號諡姓名侯狀戶數始封位次子孫曽玄平陽懿侯曹參位次二至鹵嚴侯張平位次四十八右髙祖百四十有七人二人在外戚四人在王子外戚周吕建成王子羮頡郃陽沛德凡百五十三人表止百三十七人當考便頃侯吳淺至平都孝侯劉到右孝惠三人南宫侯張買至醴陵侯越右髙后十二人陽信侯劉揭至故安節侯申屠嘉右孝文十人樊酈傳贊方其鼓刀僕御販繒之時豈自知附驥之尾勒功帝籍慶流子孫哉後祭遵傳博士范升上疏曰髙祖班爵割地與下分功著録勳臣頌其德美生則寵其殊禮奏事不名入門不趨死則疇其爵邑世無絶嗣丹書鐵劵傳於無窮斯大漢厚下安民長久之德周有大常之書司勳之二盟府之藏髙祖功臣一百四十三至文帝世存者一百二十五武帝世存者七十一惠景間侯者建元後存者二國太初後皆國除史記表云至太初百年之間見侯五杜業曰百餘年間襲封者盡雖難盡繼宜從尤功蕭何位第一戶唯八千張良萬戶位過六十漢髙祖至太初諸侯譜史記漢興以來諸侯年表第五臣遷謹紀髙祖以來至太初諸侯譜其下益損之時令後世得覽形勢雖強要之以仁義為本或以天子支庶子弟初立或以王支庶子分置或廢國而郡或郡復為國或剖析而衆建或相承而不易此益損之辨也賈誼曰衆建諸侯而少其力自序漢興以來至於太初百年諸侯廢立分削譜記不明作漢興以來諸侯年表十國同姓九異姓一楚六年正月丙午王交景三年分置魯國相承至太初齊髙六年正月甲子王肥城陽濟北則文二年二月乙卯分濟南災川膠東則十六年四月丙寅分景中元年復置膠東元狩六年四月乙巳立閎荆六年正月丙午初王劉賈十二年十月辛丑更為吳王濞景四年初置江都元狩六年更廣陵淮南十一年十二月庚午王長文十六年四月丙寅分廬江衡山元狩二年衡山别為六安燕十二年二月甲午王建文元年十月庚戌王澤元狩六年四月乙巳王旦趙九年四月王如意惠元年王友髙后七年王恢文二年二月乙卯分置河間景二年三月甲寅置廣川三年六月乙巳置中山中三年三月丁酉置清河髙后元年四月初置常山景中五年三月丁巳王舜元鼎三年分真定泗水梁十一年三月丙午王恢文二年二月乙卯王勝十二年王武景中六年五月丙戌分濟川濟東山陽濟陰淮陽十一年三月丙寅王友徙趙文四年王武徙梁景二年王餘徙魯代六年正月壬子王喜十一年正月丙子王文帝文二年二月乙卯王武四年大原王參更為代王表云代初王文帝在韓王信之後誤也長沙五年二月乙未王吳芮景二年三月甲寅王發漢受命譜異姓王表據漢受命譜十八王月而列之天下一統乃以年數訖于孝文異姓盡矣漢元年二月羽自立為西楚霸王王梁楚地立沛公為漢王王巴蜀漢中三分關中立章邯為雍王司馬欣為塞王董翳為翟王申陽為河南王共敖為臨江王英布為九江王吳芮為衡山王田安為濟北王田市為膠東王田都為齊王魏豹為西魏王司馬卬為殷王趙王歇為代王張耳為常山王韓成為韓王韓廣為遼東王臧荼為燕王表元年一月乃春二月也注應劭曰諸侯王始受封之月也十八王同時稱一月分楚為四分秦為四分齊為三分趙為二分燕魏韓為二吳芮傳髙祖制詔御史長沙王忠其定著令五年二月芮徙長沙贊曰髙祖定天下異姓王者八國張耳吳芮彭越黥布臧荼盧綰兩韓信唯吳芮傳號五世著于甲令而稱忠史記惠景侯者表太史公讀列封至便侯吳淺所封曰有以也夫長沙王者著令甲稱其忠焉漢表髙九年三月丙戌封陸量侯須無詔以為列諸侯自置吏令長受令長沙王髙帝五年天下之勢異姓強而同姓未有封者六年異姓同姓強弱略相當十二年而同姓強而異姓絶無而僅有孝文後七年長沙國除漢興至太初諸侯譜紀史記自序漢興以來至於太初百年諸侯廢立分削譜紀不明有司靡踵強弱之原云以世作漢興已來諸侯年表第五漢更封益封列傳陳平封戶牖侯髙帝南過曲逆顧問御史戶口幾何對曰始秦時三萬餘戶今見五千戶詔更封平為曲逆侯盡食之除前所食户牖平六出竒計輒益邑封樊噲賜爵臨武侯取信定楚更賜爵列侯為舞陽侯酈商賜爵列侯食邑涿郡以破黥布軍更封為曲周侯夏侯嬰號昭平侯取楚王信更食汝陰從擊豨布益千戶定食汝陰六千九百戶益食細陽千戶靳歙賜爵建武侯定為信武侯擊黥布有功益封定食邑五千三百戶周緤為信武侯十六年更封𤭔成侯蕭何益封二千戶為相國益封五千戶灌嬰破黥布益邑二千五百髙帝歸定食潁陰五千戶漢功臣世爵高惠高后文功臣表杜業納説曰迹漢功臣亦皆割符世爵受山河之誓漢祠功臣廟庭褒賞元功魏志明帝青龍元年五月壬申詔祀大將軍夏侯惇大司馬曹仁車騎將軍程昱於太祖廟庭注魏書載詔曰先王之禮於功臣存則顯其爵祿沒則祭於大蒸故漢氏功臣祠於廟庭又見周禮司勳注大魏元功之臣功勳優著終始休明者其依禮祀之於是以惇等配饗漢書陳崇奏髙皇帝褒賞元功相蕭何邑戶既倍又蒙殊禮奏事不名入殿不趨封其親屬十有餘人史記蕭何世家五年克項羽論功行封羣臣爭功嵗餘不決上以何功最盛先封為鄼侯六年正月丙午封八千戶列侯畢受封上令何第一賜帶劍履上殿入朝不趨髙后二年封何夫人同為侯封何少子延築陽侯孝文元年更為鄼漢差次列侯功列侯功次朝位髙后紀二年春正月詔曰髙皇帝匡飭天下諸有功者皆受分地為列侯萬民大安莫不受休德朕思念至於久逺而功名不著亡以尊大誼施後世今欲差次列侯功以定朝位藏於髙廟世世勿絶嗣子各襲其功位其與列侯議定奏之丞相臣平言謹與絳侯臣勃曲周侯臣商潁陰侯臣嬰安國侯臣陵等議列侯幸得賜餐錢奉邑陛下加惠以功次定朝位功大者位在上功臣表有第一第二之次臣請藏髙廟奏可表髙后二年復詔丞相陳平盡差列侯之功録第下竟藏諸宗廟副在有司髙祖功臣博陵侯陳濞位十九至陸量侯須無位百三十七皆陳平所定髙后元年七月丙申封沅陵侯吳陽位百三十六王子侯表德哀侯廣上邳侯郢客朱虛侯章獨有位次注張晏曰髙后二年詔丞相陳平令差第列侯位次髙下故王子侯三人有第三年之後皆不第史記髙后紀七年秋丞相平等言武信侯吕祿上侯位次第一蓋髙帝定十八侯位次蕭何第一曹參第二張敖第三周勃第四今盡諸侯朝位蕭曹皆死必遞遷張敖為第一敖死遂以祿補其處耳師古曰張敖無大功蓋以魯元之故吕后曲升之晉庾峻曰漢祖任蕭曹以天下重四皓於南山以張良之勳而班在叔孫之後蓋公之賤而曹相咨之以政帝王貴德於上俗亦反本於下漢列侯益邑文紀元年六月詔曰列侯從髙帝入蜀漢者六十八人益邑各三百戶史記云益封吏二千石以上從髙帝潁川守尊等十人食邑六百戶淮陽守申屠嘉等十人五百戶表文二年衛尉足等十人四百戶封淮南王舅趙兼為周陽侯齊王舅駟鈞靖郭侯表云塢侯並四月辛未封故常山丞相蔡兼為樊侯兼從髙祖六月丙寅封史記在秋漢修代來功文紀元年冬十月辛亥見髙廟詔益封太尉勃邑萬戶賜金五千斤丞相平將軍嬰邑各三千戶金二千斤朱虛侯章襄平侯通各二千戶金千斤封典客劉揭信陽侯賜金千斤十一月辛丑朔六月施惠天下乃修代來功尊中尉宋昌為衛將軍封壯武侯表四月辛亥封諸從朕六人官皆至九卿張武等元薄昭以中大夫迎帝於代年正月封軹侯三年五月幸太原見故羣臣皆賜之舉功行賞諸民里賜牛酒復晉陽中都民三嵗租留遊大原十餘日文帝二年十月詔令列侯之國為吏及詔所止者遣太子景帝後二年十月省徹侯之國列侯悉就國自賈生發之漢建元功臣受封史記建元以來侯者年表太史公曰胸奴攻當路塞閩越擅伐東甌請降二夷交侵當盛漢之隆以此知功臣受封侔於祖考矣太史本表自翕侯趙信至涅陽侯子最計七十三人褚先生補當塗侯總七十七人索隱曰七十二國太史公舊餘四十五國褚先生補元光侯者四元朔侯者二十唯公孫弘以丞相封元狩侯者十三皆以胸奴封元鼎侯者十六唯姬嘉以周後欒大以方術石慶以丞相封餘皆以胸奴南粵封元封侯者十七以東越甌駱南粵朝鮮西域封則時之用兵孰多孰少皆可知矣漢元朔封諸校衛青傳元朔五年春將三萬騎出髙闕蘇建李沮公孫賀李蔡皆領屬車騎將軍出朔方李息張次公出右北平追得右賢禆王十餘人引兵還塞天子使使者持大將軍印即軍中拜青大將軍上曰青躬率戎士獲胸奴王十有餘人益封八千七百戶封三子為侯四月丁未又圗諸校功詔御史曰公孫敖以護軍傳校獲王封合騎侯韓説以戲下搏戰封龍額侯四月丁未封賀南􅐎侯李蔡樂安侯四月乙巳封李朔軹侯趙不虞隨成侯公孫戎奴從平侯乙卯封李沮李息及竇如意中郎將綰賜爵關內侯沮息如意食邑三百戶表元朔二年三月丙辰青封長平侯傳曰以三千八百戶封西定河南地益封三千八百戶再封凡萬六千三百户封三子為侯侯千三百戶并之二萬二百戶明年元朔六年夏四月青復將六將軍絶幕唯霍去病有功封冠軍侯壬申胸表以校尉擊奴侯郝賢從大將軍捕虜封終利侯五月壬辰騎士孟已賜關內侯邑二百戶青不益封賜千金校尉張騫因前使絶域功封博望侯六年三月甲辰最大將軍青凡七出擊胸奴一與單于戰再益封禆將校尉侯者九人為特將者十五人李廣至蘇建七人有傳李息至荀彘八人附傳末李廣張騫公孫賀李蔡曹襄韓説蘇建李息公孫敖李沮張次公趙信趙食其郭昌荀彘凡十五人元狩四年夏去病絶大幕獲單于章渠益封五千八百戶路博德捕虜封邳離衛山封義陽復陸支杜侯伊即靬衆利侯六月丁卯封從票侯破奴武昌侯安稽益封各三百戶漁陽守解校尉敢關內侯校尉自為左庶長青不得益封唯常惠遂成受賞惠關內侯最票騎將軍去病凡六出擊胸奴其四出以將軍四益封凡萬七千七百戶其校吏有功侯者六人為將軍者二人路博德趙破奴漢侯邑列位見宗戚類史記王子侯表斷自建元漢書起於髙祖始於羮頡侯信髙七年終於杏山侯遵元始元年閏月丁酉表記號諡名屬始封位次子孫曽玄漢開封賞科續元功次景武昭宣元成功臣表書稱蠻夷帥服詩云徐方既來春秋列潞子之爵許其慕諸夏也漢興至孝文時乃有弓髙襄城之封注穨當桀龍或以襄城為韓嬰奴表弓髙侯韓穨當襄城侯韓嬰以胸相國降文十六年六月丙子封亦敘曰景夷吳楚武興師旅後昆承平有紹士雖自外來本功臣後至孝景始欲侯降者丞相周亞夫守約而爭景帝欲封胸奴降者徐盧等帝黜其議初開封賞之科中二年十二月丁丑封徐盧等五人又有吳楚之事六年四月丁卯封欒布等五人事中二年四月乙巳封趙相內史等死十四人武興胡越之伐將帥受爵應本約矣後世承平頗有勞臣輯而敘之續元功次云表敘號諡姓名功狀戶數始封子孫曽玄孫孝景十八人俞侯欒布至塞侯直不疑中三年十一月庚子安陵侯于軍以胸奴王降侯十二月丁丑封陸強等五人皆胸奴降者中五年四月丁丑封盧它之以東胡王降侯孝景十八內胸奴降者八人孝武七十五人自翕侯趙信至丞父侯孫王武胸奴降者二十一人又有自南越朝鮮小月氐降者孝昭八人自𤭔侯金日磾至義陽侯傅介子孝宣十一人自長羅侯常惠至義成侯厲溫敦宣胸奴降者二人孝元一人義成侯甘延夀孝成五人自駟望侯冷廣至樓虛侯訾順李廣利傳諸將多中首虜率為侯者注師古曰率音律謂軍功封賞之科著在法令者也李蔡有功中率封樂安侯平當傳上既罷昌陵以淳于長建䇿下公卿議封長當以為不應封爵之科陳湯傳劉向上疏常惠鄭吉皆裂土受爵於是詔公卿議封議者以為宜如軍法捕斬單于令元帝取安逺侯故事封千戶匡衡石顯復爭乃封延夀義成侯湯爵關內侯食邑各三百戶加賜黃金百斤史記商君傳有軍功者各以率受上爵漢封髙祖功臣後景紀二年六月封相國蕭何孫係為列侯武紀元光三年夏五月封髙祖功臣後五人為列侯元狩三年夏五月封蕭何曽孫慶為列侯功臣表杜業納説曰雖難盡繼宜從尤功成帝復紹蕭何哀平之世增修曹參周勃之屬得其宜矣髙祖功臣文帝紹封四人樊噲子市人元年革朱子式四年蕭何孫則五年周勃子亞夫後三年景帝十三年蕭何後嘉二年周緤中元年周苛中元年周昌中二年酈商中三年薛歐陳濞趙將夕杜恬並中元年陳賀郭亭並中六年周勃子堅王翥子頴二人後元年武帝三人灌嬰孫賢元光二年張敖後廣國元光三年蕭何曽孫慶元狩二年五月宣帝一人蕭何玄孫建世地節四年成帝一人蕭何後喜永始元年哀帝一人曹參孫本世元夀二年平帝三人周勃玄孫共樊噲後章張敖後慶忌元始二年光武一人曹參孫宏建武二年續陳平曽孫掌顯封終不得韓王信傳成帝時繼功臣後封贈兄子岑為龍額侯宣紀地節二年三月詔曰大司馬大將軍博陸侯功德茂盛朕甚嘉之復其後世疇其爵邑世世毋有所與功如蕭相國丙吉傳成帝修廢功鴻嘉元年封吉孫昌博陽侯杜欽傳繼功臣絶世當世善政多出於欽後韋彪傳建初七年十月癸丑車駕西巡狩以彪行太常數召問以三輔舊事禮儀風俗彪因建言今西巡舊都宜追録髙祖中宗功臣褒顯先勳紀其子孫帝納之行至長安乃制詔京兆尹右扶風求蕭何霍光後丙辰祠以中牢甲明年永平二年幸長安十一月申遣使者以中牢祠蕭何霍光時光無苗裔唯封何末孫熊為鄼侯建初二年已封曹參後湛為平陽侯故不復及焉永元紹封見後漢復功臣家子孫宣紀元康元年夏五月復髙皇帝功臣絳侯周勃等百三十六人家子孫令奉祭祀世世不絶其毋嗣者復其次四年八月賜功臣適後黃金人二千斤功臣表云云逮文景四五世間流民歸戶口息列侯大者至三四萬戶小國自倍子孫驕逸訖于孝武後元之年靡有孑遺孝宣愍而録之乃開廟臧覽舊籍詔令有司求其子孫咸出庸保之中並受復除或加以金帛用章中興之德公士三十二人上造十二人簪裊十二人不更九人大夫三十一人官大夫二人公大夫三人公乘二十八人五大夫一人官首一人秉鐸一人士伍二人漢本始論定䇿功益封宣紀本始元年正月論定䇿功益封大將軍光萬七千戶車騎將軍安世萬戶詔曰故丞相安平侯敞等與光安世建議定䇿以安宗廟其益封敞子忠及丞相陽平侯蔡義平陵侯范明友龍額侯韓增建平侯杜延年蒲侯蘇昌宜春侯王談當塗侯平杜侯屠耆堂關內侯夏侯勝邑戶各有差封田廣明昌水侯趙充國營平侯田延年陽城侯史樂成爰氏侯王遷平丘侯周德蘇武李光劉德韋賢宋畸丙吉趙廣漢爵皆關內侯德武食邑杜延年傳宣帝褒賞大臣延年以定䇿安宗廟益封戶二千三百詔有司論定䇿功大將軍光功德過絳侯周勃車騎將軍安世丞相楊敞功比丞相陳平前將軍韓增御史大夫蔡義功比潁陰侯灌嬰太僕杜延年功比朱虛侯劉章後將軍趙充國大司農田延年少府史樂成功比典客劉揭皆封侯益土紀地節二年三月詔曰大司馬大將軍博陸侯功德茂盛復其後世疇其爵邑世世毋有所與功如蕭相國漢元始修封功臣平紀元始二年夏四月封霍光從父昆弟曽孫陽張敖玄孫慶忌周勃玄孫共樊噲玄孫之子章皆為列侯復爵賜高祖時功臣酈商等後玄孫酈明友等百一十三人爵關內侯食邑各有差又見酈商傳云百餘人公孫弘傳元始中修功臣後賜弘後子孫之次見為適者爵關內侯漢紹周後封孔子後武紀贊禮百神紹周後紀武帝元鼎四年十一月行幸滎陽還至洛陽丁卯詔曰觀于周室邈而無祀詢問耆老得孽子嘉其封嘉為周子南君表云侯三千戶泰史記天子將封山東巡狩至河南求周苗裔封其後嘉三十里地號曰周子南君注初元五年為周承休侯元始四年為鄭公建武十三年封於觀為衛公宣帝元康元年三月丙戌君延年紹封以奉周祀元帝初元五年正月癸巳以周子南君為周承休侯位次諸侯王名延年成帝綏和元年二月甲子詔曰王者存二王之後所以通三統也其封孔吉為殷紹嘉侯三月進爵為公及周承休侯皆為公地各百里平帝元始元年六月丙午封周公後公孫相如表云公子寬為褒魯侯後更為姬氏六月封寬十一月相如嗣更姓公孫氏後更姬氏孔子後孔均為褒成侯侯二千戶奉其祀追諡孔子曰褒成宣尼公四年改殷紹嘉公為宋公周承休公曰鄭公恩澤侯表髙帝修祀六國過魏寵無忌之墓適趙封樂毅之後十年八月封其孫叔樂鄉號華成君孝武寵公孫弘以列侯之爵又疇咨前代詢問耆老初得周後復加爵邑其後宰相畢侯矣元成間晚得殷世以備賓位梅福傳元帝時求商後分散為十餘姓郡國往往得其大家推求子孫絶不能紀匡衡議宜以孔子世為湯後上以其語不經遂寢成帝時梅福復言宜封孔子後以奉湯祀綏和元年立二王後推迹古文以左氏穀梁世本禮記相明遂封孔子世為殷紹嘉公光武紀建武二年五月庚辰一云戊辰封周後姬常為周承休公五年二月壬申封殷後孔安為殷紹嘉公十三年二月庚午以殷紹嘉公孔安為宋公周承休公姬常為衛公以為漢賔在三公上十四年四月辛巳封孔子後志為褒成侯祭遵傳遵建為孔子立後奏置五經大夫魏文帝黃初二年正月以議郎孔羡為宗聖侯晉武帝泰始三年十一月改宗聖侯孔震為奉聖亭侯太元十一年八月庚午封孔靖之晉志宋因之後魏封孔乘為崇聖大夫孝文太和十九年封珍為崇聖侯北齊改封恭聖侯後周武帝改鄒國公隋煬帝改紹聖侯唐貞觀十一年封孔子裔德倫為褒聖侯開元二十七年以其嗣為文宣公任州長史代代勿絶唐世系表周氏出姬姓平王少子烈食采汝墳漢興續周之嗣復封仁為汝墳侯賜號正公漢建武録舊德臣列傳孫寶建武中録舊德臣以寶之孫伉為諸長曹宏建武中先降河北封平陽侯至今兩龔鮑宣子孫皆見褒表至大官何並孫為郎王閎子補吏恩澤侯表平昌侯王獲建武五年詔書復漢建武封功臣䇿封爵制名籍光武紀建武二年春正月庚辰封功臣皆為列侯大國四縣餘各有差下詔曰人情得足苦於放縱快須臾之欲忘慎罰之義惟諸將業逺功大誠欲傳於無窮宜如臨深淵如履薄氷戰戰栗栗日慎一日其顯效未酬名籍未立者大鴻臚趣上朕將差而録之博士丁恭議曰古帝王封諸侯不過百里故利以建侯取法於雷強幹弱枝所以為治也今封侯四縣不合法制帝曰古之亡國皆以無道未嘗聞功臣地多而滅亡者乃遣謁者即授印綬䇿曰在上不驕髙而不危制節謹度滿而不溢敬之戒之傳爾子孫長為漢藩列傳泗水王歙建武二年立為泗水王從父弟康建武二年封宜春侯以下並建武二年李通封固始侯拜大司農鄧禹遣使者更封禹為梁侯食四縣冦恂定封雍奴侯食萬戶馮異定封夏陽侯二年春賈復光武即位拜為執金吾封冠軍侯建武二年益封穰朝陽二縣吳漢光武即位更封舞陽侯建武二年春帝使使者璽書定封漢為廣平侯食四縣陳俊更封俊為新處侯蓋延更封安平侯臧宫封成安侯耿弇更封好畤侯食好畤美陽二縣王霸更封富波侯祭遵拜征虜將軍定封潁陽侯春任光更封阿陵侯食邑萬戶李忠更封中水侯食邑三千戶萬修更封槐里侯劉植更封為昌城侯朱祐更封堵陽侯景丹更封櫟陽侯帝謂丹曰今關東故王國雖數縣不過櫟陽萬戶邑夫富貴不歸故鄉如衣錦夜行故以封卿耳林茂更封苦陘侯劉隆封元父侯傅俊封昆陽侯宋弘代王梁為大司空封栒邑侯朱浮封武陽侯食三縣以上並建武二年封陰識建武元年為騎都尉更封陰鄉侯二年以征伐軍功增封識叩頭讓曰天下初定將帥有功者衆臣托屬掖庭仍加爵邑不可以示天下帝甚美之以為關都尉鎮函谷馮勤為郎中給事尚書使典諸侯封事勤差量功次輕重國次逺近地勢豐薄不相踰越自是封爵之制非勤不定范升謂褒序輔佐封賞功臣同符祖宗見祭遵傳丁鴻父綝建武元年拜河南太守及封功臣帝令各言所樂諸將皆占豐邑美縣惟綝願封本鄉人謂綝曰人皆求縣子獨求鄉何也綝曰昔孫叔敖敕其子受封必求墝埆之地今綝能薄功微得鄉亭厚矣封定陵新安鄉侯食邑五千戶漢功臣增邑更封班勞䇿勳光武紀建武十三年夏四月大司馬吳漢自蜀還京師於是大饗將士班勞䇿勳功臣爭邑更封凡二百六十五人其外戚恩澤封者四十五人列傳安成孝侯賜建武十三年更增戶邑定封為安成侯奉朝請鄧農更封南􅒋侯入奉朝請來歙帝嘉忠節復封歙弟由為宜西侯鄧禹天下平定諸功臣皆增戶邑定封禹為髙密侯食髙密昌安夷安淳于四縣馮異長子彰嗣更封彰東緡侯食三縣岑彭子遵嗣帝思彭功復封遵弟淮為穀陽侯賈復定封膠東侯食郁秩壯武下密即墨挺胡觀陽凡六縣注六縣皆屬膠東國蓋延增封定食萬戶陳俊增邑定封祝阿侯臧宫增邑更封鄼侯耿弇增邑戶上大將軍印綬罷以列侯奉朝請王霸增邑戶更封向侯朱祐增邑定封鬲侯食邑七千三百戶王梁增邑定封封阜城侯杜茂增邑更封修侯劉隆增邑更封竟陵侯馬武增邑更封歙侯樊宏封弟丹為射陽侯以上並建武十三年封漢永元紹封髙祖功臣景風紹封和紀永元三年十月癸未上行幸長安十一月癸卯詔曰髙祖功臣蕭曹為首有傳世不絶之義曹相國後容城侯無嗣朕望長陵東門見二臣之壠可遣使者以中牢祠大鴻臚求近親宜為嗣者須景風紹封以章厥功注春秋考異郵曰夏至四十五日景風至則封有功三王世家因盛夏吉時定皇子位月令立夏之日封諸侯史記索隱灌嬰傳案漢紀桓帝延熹二年追録髙祖功臣李必後李遂為關內侯下邳惠王衍傳注和帝賜彭城靖王恭詔曰其差次下邳諸子可為太子者上名將及景風拜授印綬張宗傳論景風之賞未甄將盧植殂竇武曰準之前事有景風之祚漢永初紹封建武元功景風紹封建武元功圗籍馮異傳永初六年安帝下詔曰夫仁不遺親義不忘勞善善及子孫古之典也光武受命中興恢弘聖緒光耀萬世祉祚流行豫末小子夙夜永思追惟勳烈披圗按籍建武元功二十八將佐命虎臣讖記有徴蓋蕭曹紹封傳繼於今况此未逺而或乏祀朕甚愍之其條二十八將無嗣絶世若犯罪奪國應當統後者分别署狀上將及景風章敘舊德顯兹遺功焉於是紹封普子晨異曽孫為平鄉侯明年二十八將絶國者皆紹封焉鄧禹永初六年紹封禹孫康為夷安侯時諸紹封者皆食故國半租康以太后戚屬猶三分食二以侍祠侯蓋延曽孫恢永初七年紹封盧亭侯李忠孫純復封琴亭侯朱祐曽孫沖紹封鬲侯景丹孫遽紹封監亭侯杜茂孫奉紹封安樂亭侯傅俊孫鐵復封髙置亭侯馬武孫震七年漻亭侯馬援傳紹封光子朗為合鄉侯萬修曽孫豐紹封曲平亭侯蓋恢盧亭李純琴亭朱沖鬲侯景遽監亭杜奉安樂亭傳鐵髙置亭馬震漻亭馬朗合鄉萬豐曲平亭並永初七年封馬廖元初三年紹封孫度為潁陽侯臧宫永寧元年紹封曽孫由朗陵侯陰識永寧元年以璜弟琡紹封邳彤元初元年封彤孫音為平亭侯耿純建初三年肅宗追思純功紹封阜子盱純孫為髙亭侯萬修玄孫恭紹封門德亭侯馬成玄孫昌紹封益陽則延熹二年也岑彭建光元年封曽孫𣏌為細陽侯先是永平十四年竇融孫嘉封安豐建初元年賈復子邯封膠東宗封即墨二年耿純孫盱封髙亭八年吳漢孫盱封平春魏祀佐命臣魏志青龍元年五月壬申祀夏侯惇曹仁程昱於太祖廟庭正始四年七月祀曹真至典韋五年十一月癸卯祀荀攸六年十一月祫祭大祖廟始祀佐命臣二十一人景元三年祀郭嘉嘉平三年十一月有司奏功臣享食更以官為次二虢不辭兩國之任其德厚也旦奭不遜燕魯之封其功大也陳思王疏漢德之盛異姓而王者八人魏祚之隆同功而邑者千户唐神龍元年十一月五王詔武王勝殷之日報功不先於崇德位能不先於建賢晉泰始增封武紀泰始元年十二月丁卯以石苞封樂陵公陳騫髙平公賈充魯公裴秀巨鹿公荀朂濟北公鄭沖夀光公王祥睢陵公何曽朗陵公王沈博陵公荀顗臨淮公衛瓘災陽公其餘增封進爵各有差地理志武帝泰始元年罷五等之制公侯邑萬戶以上為大國五千戶以上為次國不滿千五百戶為小國晉大元紹功臣孝武紀大元二年春正月繼絶世紹功臣謝安傳孝武時天象失度亢旱彌年安奏求晉初佐命功臣後而封之羊祜玄孫之子法興為巨平侯陳騫玄孫髙平公王沈從孫道素博陵公荀顗後常臨淮公並大元中封荀伯子謂羊祜勳參佐命功成平吳巨平封宜同鄼國楚思子文之治晉録成宣之忠晉咸寧論次功臣銘功太常列傳荀顗咸寧初詔論次功臣將配饗宗廟所司奏顗等十二人銘功太常配享清廟鄭沖咸寧初有司奏沖與安平王孚何曽賈充陳騫荀朂羊祜齊王攸等十二人皆銘大常配食于廟石苞咸寧初列於銘享裴秀咸寧初與石苞等並為王公配享廟庭荀朂咸寧初為佐命功臣列於銘亭羊祜以晉泰始中建䇿伐吳至咸寧末方加褒寵封其兄子卞望之以咸和初殞身國難至興寧末方崇禮秩官其子孫晉陽秋曰泰始二年詔曰夏侯惇魏之元功勳書竹帛朕受禪於魏可忘其功臣哉冝擇近屬紹封之荀公達漢之功臣晉武爵其玄孫成帝紀咸康二年十月詔曰先代褒崇明祀賓禮三恪故𣏌宋啓土光于周典宗姬侯衛垂美漢册周漢之後絶而莫繼其詳求衛公山陽公近屬可繼承其祀者依舊典晉旌録名賢元帝紀大興元年十二月癸巳詔曰漢髙經大梁美無忌之賢齊師入魯修栁下惠之墓其吳之髙德名賢或未旌録者具條列以聞晉論淮肥功孝武紀太元八年十月乙亥諸將及苻堅戰於肥水大破之十一月庚申詔衛將軍謝安勞旋師於金城十年十月丁亥論淮肥之功追封謝安廬陵郡公封謝石南康公謝玄康樂公謝琰望蔡公桓伊永修公自餘封拜各有差唐論太原首功裴寂傳髙祖論太原首功詔秦王裴寂劉文靜恕二死長孫順德至許世緒等十四人恕一死會要武德元年八月六日詔二年四月甲寅賜太原元從人庫物百五十萬段京師平劉弘基功第一太宗手詔劉政會要義舉有殊功世充平屈突通論功第一東都平册勳於廟者九人竇抗與從弟軌與唐定功臣封戶第功班賞通鑑武德九年十月庚辰初定功臣實封有差舊紀癸酉裴寂傳武德九年十月太宗定功臣封戶自寂以下差功大小第之總四十三人寂戶千五百長孫無忌王君廓尉遲敬德房玄齡杜如晦戶千三百長孫順德柴紹羅藝趙郡王孝恭等四人戶千二百侯君集張公謹劉師立等三人戶千李績劉弘基等二人戶九百髙士亷宇文士及秦叔寶程知節等四人戶七百安興貴安修仁唐儉竇軌屈突通蕭瑀封德彞劉義節等八人戶六百錢九隴樊興公孫武達李孟嘗段志玄龎卿惲張亮李藥師杜淹元仲文十人戶四百張長遜張平髙李安逺李子和秦行師馬三寶六人戶三百寂等三十人見於傳趙文恪等十八人功不甚顯然參附義始事班班見當世今次第其名總出左方房玄齡傳太宗即位第功班賞與如晦無忌敬德君集功第一食邑一千三百戶餘皆次序封爵上顧羣臣曰朕論公等定封邑恐不能盡無有諱各為朕言之淮安王神通曰義師起臣兵最先至今玄齡以刀筆吏居第一臣未喻帝曰玄齡等有決勝帷幄定社稷功此蕭何所以先諸將也叔父以親冝無愛者顧不可緣私與功臣競先後耳初將軍兵師利等皆怙跋攘袂或指畫自陳説見神通愧屈乃曰陛下至不私其親吾屬可妄訴耶蘇安常傳唐家指河為誓非李氏不王非功臣不封舊紀武德九年九月己酉無忌封齊玄齡封邢敬德吳如晦萊君集潞皆國公十月癸酉十八日自裴寂食實封一千五百戶至馬三寶三百戶李靖平頡利增戶至五百會要武德九年九月二十四日己酉詔曰褒賢昭德昔王令典旌善念功有國彞訓無忌等或夙參謀謨綢繆帷幄或早從任使契濶戎麾無忌齊玄齡邢敬德吳如晦萊君集潞邑各三千戶遣侍中陳叔達於殿階下以名唱之神龍元年二月制段志玄至李孟嘗二十六人所食實封給之如舊唐功臣世封刺史太宗紀貞觀十一年六月戊辰會要十五日以功臣為世封刺史十三年二月庚子舊紀丙子停世封刺史長孫無忌傳帝欲功臣並世襲刺史乃詔有司朕憑賢佐之力克翦多難時屯共資其力世安専享其利朕所不敢刺史古諸侯雖名不同而監統一也無忌等嘉庸懿績簡在朕心其改錫土宇用世及之制詔曰周武定業胙茅土於弟子漢髙受命誓帶礪於功臣及以無忌為趙州刺史以趙為公房玄齡宋州刺史國於梁杜如晦贈密州刺史國於萊李靖濮州國於衛髙士亷申州國於申侯君集陳州國於陳道宗鄂州王江夏孝恭觀州王河間尉遲敬德宣州國於鄂李績蘄州國於英段志玄金州國於褒程知節普州國於盧劉弘基梁州國於夔張亮澧州國於鄖凡十有四人無忌等辭帝曰公等薄山河之誓朕安可強公土宇耶遂止馬周上疏謂宜賦以茅土疇以戶邑必有才行隨器而授雖幹翮非強亦可以免纍于志寧奏古今異時慕虛名遺實患非久安計帝皆從之唐總章功臣二等髙宗紀顯慶五年正月甲子如并州二月丙戌加佐命功臣食别封者子孫二階大將軍府僚佐存者一階總章元年四月庚申一云三月以太原元從西府功臣為二等第一功後官無五品者授其子若孫一人有至五品四品者加二階三品以上加爵三等第二功後官無五品者授其子若孫從六品一人有至五品者加一階六品者二階三品以上爵一等會要永徽五年二月四日贈功臣屈突通至張平髙官實録永徽五年二月庚申總章元年二月六日詔太原元從西府舊臣令親詳覽其為等級時皇后欲褒其父在功臣之上自武士彠以下至劉師立三十六人並為第一功臣唐開元紹封武德以來勳臣舊紀開元元年即先天元年十二月詔國初以來宰相及食實封功臣子孫量才擢用禇無量傳開元五年上言自古受命之君必興滅繼絶崇德報功願到東都收敘唐初逮今功臣世絶者雖在支庶咸得承襲帝納其言求武德以來勳臣苗裔紹續其封玄宗紀開元五年五月丙辰詔公侯子孫襲封十七年十一月戊申大赦唐隆兩營立功三品以上豫一子官二十年十一月庚申如汾陰祠后土賜武德以來功臣後及唐隆功臣三品以上一子官實録開元十三年十一月封禪制武德以來功臣宰輔令所司訪遺嗣天寶十三載二月詔武德功臣貞觀初宰輔與子孫一人京官通鑑開元二十年上思右驍衛將軍安金藏忠烈三月賜爵代國公於東西嶽立碑以銘其功睿宗景龍四年六月辛丑賞平韋氏功唐開元録軍閥郭虔瓘傳開元初録軍閥二年四月庚申纍遷左驍衛將軍兼北庭都護賜衣一襲薛訥傳破吐蕃於武階開元二年十月甲子帝命紫微舍人倪若水即軍陟功狀拜訥左一作右羽林大將軍一云十月癸未唐推恩令實録貞觀五年九月癸亥詔曰親賢作屏著在周經支庶畢侯義存漢典無忌玄齡如晦敬德各封一子郡公君集子及叔寶知節各封一子縣公褒賢之道已紀旗常推恩之令未洽胄緒俾拜前拜後比蹤曩烈如帶如礪垂𥙿後昆元和九年八月庚寅録功臣後康日知至李洧等十家元和十五年二月穆宗制武德已來配享及一等功臣并張巡許逺南霽雲顔真卿杲卿尚父子儀太師晟太尉秀實與子孫官有差六月舉勳賢之後任臺省官者長慶元年正月辛亥詔武德以來功臣子孫重加奬用韓愈元和聖德詩續功臣嗣唐定將相功臣三等史館勳臣舊紀建中元年十二月丁酉令定國初已來將相功臣房玄齡等一百六十人德宗紀大厯十四年五月癸亥即位六月己亥武德至德將相有功者子孫與官忠義傳武德功臣十六人貞觀功臣五十三人至德功臣二百六十五人德宗即位録武德以來宰相及實封功臣子孫賜一子正員官史館考勳名特髙者九十二人以三等條奏第一等以其嵗授官第二等以次年第三等子孫數訟於朝有詔差為二等增至百八十七人每等武德以來宰相為首功臣次之至德以來將相又次之房玄齡至南霽雲八十四人右第一竇威至姚誾一百五人右第二會要大厯十四年六月一日制條武德以來宰相及實封功臣子孫沈翳者量與一人正員官七月二十六日吏部奏請委史館精加檢勘審定名迹至建中元年九月五日史館奏武德以來功臣名迹崇髙者司空裴寂至徐國公劉幽求十一人為第一等河間王孝恭至中山郡公王晙等二十四人為第二等淮南王神通至鄧國公張暐三十四人為第三等至德以來將相功效明著已殁者冀國公裴冕至將軍南霽雲八人第一等太尉臨淮王李光弼至睢陽大守許逺八人為第二等太子太師豳國公韋見素趙國公崔圓至太原尹鄧景山七人為第三等敕付尚書省百僚史官對定建中元年十二月敕國初以來將相功臣名迹崇髙功效明著者差次分為二等其月定武德以來宰臣以房玄齡杜如晦至韓休張九齡三十七人為上等竇威陳叔達等四十七人一云四十人為次等功臣以裴寂劉文靜至王晙三十四人為上等淮安王神通等五十人為次等至德以來將相已沒者以裴冕至南霽雲十一人為上等李光弼等十五人為次等册府元龜云二等總一百八十七人張巡傳德宗差次至德以來將相功效尤著者以杲卿履謙及巡逺霽雲為上李光弼傳戰功推為中興第一至德二年十二月十五日戊午赦靈武元從劍南扈從册勳共三十二人自太子太師韋見素加三百户至户部侍郎蘇震加銀青光祿唐襲封配饗功臣德宗紀貞元元年八月襲封配饗功臣子孫會要貞元元年八月詔九廟配饗功臣封襲廢絶者宜令紹封云云配饗功臣髙祖廟六人淮南王神通河間王孝恭鄖公殷開山渝公劉政會武士彠魏公裴寂魯公劉文靖太宗廟七人梁公房玄齡申公髙士亷蔣公屈突通鄭公魏徴趙公長孫無忌衛公李靖萊公杜如晦髙宗廟六人李績張行成馬周褚遂良髙季輔劉仁軌中宗廟八人桓彥範敬暉張柬之崔玄暐袁恕已狄仁傑魏元忠王同皎睿宗廟二人蘇瓌劉幽求玄宗廟三人張説郭元振王琚肅宗廟二人苗晉卿裴冕代宗廟一人郭子儀大中四年五月李從易奏武德以來功臣列在祀典三十八人詳見羣祀類貞元九年十一月郊祀畢詔九廟配享功臣封爵廢絶者令紹封順宗即位制武德以來配享功臣與子孫一人正員官元和二年正月辛卯有事南郊録配享功臣之後七月蘇瓌崔玄暐張説狄仁傑敬暉袁恕己之孫相次録用焉詔曰旌太傅之德將擬南城之封紹鄼侯之裔不俟東門之感髙皇封樂毅之後武帝求蕭何之嗣三年四月戊寅定張柬之等五王諡太和五年七月癸卯録功臣李靖等七家命以官天復元年四月丙子武德貞觀配享功臣主祭子孫敘進之唐勳級十二轉官志司勳掌官吏勳級十有二轉上柱國柱國上護軍護軍上輕車都尉輕車都尉上騎都尉騎都尉驍騎尉飛騎尉雲騎尉武騎尉元稹制曰十有二勳以馭親賢詔勞舊稽秩序行慶賜宋朝淳化元年詔京官幕職州縣官始武騎尉朝官始騎都尉元豐六年十二月詔升朝依宗室法始武騎尉政和三年二月庚寅罷之淳熙末議欲復之不果行今唯安南等三國加上柱國南丹州加武騎尉唐異姓王舊紀永泰元年閏十月丙午封朔方大將軍孫守亮等九人為異姓王李國臣等十三人為同姓王將帥封王自天寶九載始宋朝配饗功臣見圗繪名臣類慶厯定勳臣名次政和定勳臣慶厯三年十一月二十八日命天章閣待制王洙集賢校理歐陽修就國史院同詳定國朝勳臣名次上之詔本家既無人食祿者録其子孫一人自樞密使曹彬而下至邵曄凡二百四人先是元年十一月丙寅詔録用功臣後政和三年二月二十四日鄭久中奉旨考定勳德臣僚共一百一十六人三朝二十八人兩朝六十六人神宗朝二十二人以列傳先後為次録為一册以政和詳定國朝臣僚勳德為名先是崇寧三年十月十六日命中書舍人林攄編類六朝勳臣天聖八年十二月辛丑詔翰林學士宋綬天章待制范諷以七年五月庚午詔書考次國朝以來文武官子孫合推恩者以聞景祐二年十二月癸酉詔翰林承旨章得象中丞杜衍知制誥李淑編次赦書所訪本朝臣僚子孫以名聞先是十一月乙未制三年五月庚辰録李昉至彭起之後寶元二年四月乙丑詔御史臺編排勳臣少卿監及正刺以上子孫至和封孔子後太平興國三年十月以孔宜襲封文宣公至和二年太常博士祖無擇言文宣王四十七代孫宗願襲封文宣公謹按前史在漢魏曰褒成宗聖晉宋曰奉聖後漢延興三年四月曰崇聖北齊天保元年六月曰恭聖後周隋並封以鄒國隋大業四年十月丙午立孔子後為紹聖侯唐初貞觀十一年曰褒聖武后封孔子為降道公神龍元年五月以鄒魯之邑百戶為采邑授褒聖侯崇基朝散大夫開元二十七年始追諡文宣王以其後為文宣公不可以祖諡而加後嗣也請詔有司别定美號於是二月丙子詔封為衍聖公令世襲元祐元年十月乙酉朔改為奉聖公除寄祿官主祠事不領他職增賜田百頃賜書置教授一員從鴻臚卿孔宗翰之言也紹興録用六朝勳臣紹興三年七月丁卯詔録用六朝勳臣自曹彬至藍元振三百二十人子孫先是徽猷閣待制宋伯友入對言功臣子孫凋喪殆盡乞訪其後量才録用故有是詔其後得趙普趙安仁范質錢若水諸孫皆官之慶厯三年初定曹彬至邵曄二百四人政和三年重增范質至藍元振一百十六人紹興三十二年孝宗即位九月乙巳凌景夏言元祐黨禁如彥博光公著等及靖康建炎以來忠臣義士皆略而未編願精加討論修纂成書子孫咸與甄録詔委編類聖政所修纂乾道定十三戰功會要乾道二年八月二十四日甲午詔諸軍將士與金人接戰守禦立功之人其間功效顯著者無以甄别今將戰功顯著處一十三項定立格目張俊明州城下韓世忠大儀鎮吳玠殺金平和尚原劉錡順昌府五處依紹興十年九月二十二日指揮李寶密州膠西唐島劉錡揚州皂角林王琪張振等建康采石渡邵宏淵真州胥浦橋吳珙李道光化軍茨湖張子蓋解圍泗州趙撙蔡州王宣確山八處依紹興三十二年十二月十七日指揮李壁中興十三處戰功録序云漢吳芮之功載于令甲而稱忠中興十三處戰功亦列於銓法張俊明州建炎三年十二月己卯上次明州丙申張俊自越州至金人追襲乘輿將犯明州隱士劉相如勸俊迎戰遂留抗金癸卯兵至城下俊令統制劉寶與之戰兵少却楊沂中田師中趙密與之戰又不勝知州劉洪道率州兵射其傍大破之殺數千人俊戒將士清野髙橋閉關自守四年正月乙巳金犯明州由髙橋攻西門俊守備甚設與洪道坐城樓上遣楊沂中等出精兵擊之金奔北俊急令收兵金拔寨去己酉俊奏捷吳玠和尚原建炎四年九月王師潰于富平十月吳玠收合散卒視大散關之東有險曰和尚原據險列柵以守而兵已至原下玠敗之紹興元年五月摩哩與烏嚕扎哈分兩道入冦玠駐和尚原與弟璘召諸將勵以忠義為備益力已而扎哈先至陳于原北玠與諸將列陳待之扎哈大敗摩哩攻箭筈關玠選將擊退之十月烏珠欲窺蜀造浮橋渡渭來犯我玠斷其糧道乙亥與戰三十餘陳烏珠遁吳玠饒風嶺紹興三年金州失守玠自河池率麾下馳至饒風以黃甘犒大酋薩拉噶大驚因不敢進玠得以暇治兵二月金至關下金敗衄金之戰饒風也徑卒幾十萬而我以三萬人當之吳玠殺金平紹興四年二月金復大入開道仙人關髙嶺立柵下瞰玠營關旁有險號殺金平玠堅壘以拒金直攻玠營玠以萬人當其前吳璘倍道入援力戰却之金奔潰斂兵宵遁閲十餘日前後百戰韓世忠大儀紹興四年烏珠南侵韓世忠以宣撫使駐鎮江遂自鎮江濟師世忠駐大儀以當淮泗之冦會魏良臣使金至維揚置酒送别庚牌沓至良臣問故世忠曰有詔移屯守江乃撤炊爨班師良臣去世忠令曰視吾鞭所向北行至大儀勒兵為五陳設伏二十餘處下令聞嚴鼓則起擊良臣至金金問動息以所見對烏珠喜直趨江口至大儀五里伏者四發金軍亂世忠麾徑騎蹂之金奔潰禽其驍將軍勢大震世忠窮追于淮金復奔潰十月劉錡順昌紹興十年春以騎帥劉錡副守東都奉旨分屯順昌中夏抵順昌烏珠已入東京矣金圍城錡設伏以待夜半劫金營拔寨退走六月張子蓋解圍海州紹興三十一年金亮犯淮詔除張子蓋鎮江都統三十二年金圍海州急子蓋渡江至楚州先趨連水擇便道以進五月至石秋堰金再陳於海州子蓋馳馬先之諸將踊躍而進大敗復率精鋭追擊獲鎧仗萬計還定海州李寶海道紹興三十一年金亮治舟師髙密欲泛海道襲浙江上曰李寶循海道來歸必能辦事令督護平江海船寶請徙守江陰從之八月甲寅進發十月庚子抵東海金已圍海州寶麾兵奮擊金引去招納降附聲振山東乙丑至密之膠西敵舟已泊唐島翌日過山薄金金驚迫失措寶命熾火箭環射之箭之所中煙焰隨發延燒數百艘俘漢軍三千餘人邵宏淵胥浦橋紹興三十一年以宏淵為步軍都統制十一月完顔亮南侵宏淵願獨當一面亮以軍趨六合欲斷劉錡軍後宏淵急引兵至六合亮愕不敢進諸將乞退保胥浦橋宏淵從之自將鋭士鏖擊所向無前既而劉錡班師金騎追及知宏淵殿遂不敢逼亮臨江無一舟可渡宏淵之力也虞允文采石紹興三十一年辛巳金主敗盟十月下詔親征遣樞臣葉義問督視中書舍人虞允文參贊十一月亮統軍駐和州之雞籠山必欲由采石而渡命允文趣李顯忠代王權允文徑趨采石金瞰江築髙臺亮麾衆渡江時諸將未有統屬惟提舉張振王琪奮然任責允文益勉琪等列軍為陳分戈船為五金與官軍步戰時俊出陳蕩擊戈船併進敵舟皆沈沒水為之丹會淮西潰軍有從光州至者即授以旗鼓金以為援兵至引餘舟遁亮愈忿乃回揚州於是諸酋共謀弒亮矣李道光化次湖一作茨湖在漢江之南紹興三十一年金亮侵淮十月金帥劉萼領兵入光化時李道為荆南都統發張進董江領統卒萬人獨當次湖與之對壘無日不戰十二月劉萼毁光化屋作船筏以渡江道激厲將士下水鏖擊盡奪船筏金遁遂復光化復遣兵邀擊之纍戰皆捷河洛震動劉錡皂角林紹興三十一年劉錡為鎮江都統除浙西等路制置使錡誓以死報國九月亮入侵除京畿等招討使十月金將高景山以兵搗瓜州錡遣禆將員琦設伏於皂角林與金戰破之斬景山王宣汲靖確山紹興三十一年十二月王師克蔡州三十二年二月金人圍之統制王宣以左右軍應援至確山宣據山而陳將佐皆未戰宣屬目汲靖靖虓勇善用大刀至是挺出曰敵騎雖盛擊之當破宣與騎二百率衆馳入敵陳敵皆披靡不敢迎靖持鐵鞭擊敵諸軍鼓勇爭進乙丑敵大敗遁走宣整衆而還確山之功惟靖第一按乾道降旨無饒風嶺而有趙撙蔡州當考紹興三十一年十二月己亥朔司馬中軍統制趙撙復蔡州金人所命刺史蕭懋德聞撙至披城為寨相距兩日不出戰至是夜漏未盡撙命將士潛師入城城無樓櫓不可守懋德遁去紹興六年十月楊沂中敗偽齊于藕塘不與十三戰功之列以所捷非金人故也功臣號功臣舊制自推忠佐理至保運經邦二十二字以賜中書密院臣僚自推忠保德至效順順化三十八字以賜皇子皇親文武官外臣自拱衛翊衛至果毅肅衛二十字以賜諸班直將士神宗即位不受徽號元豐元年十一月己亥二十九日宰臣吳充等言功臣非古始唐德宗多難之際乃賜奉天定難之號不應盛世猶襲陳迹於是罷功臣號紹興六年四月復賜中興後加賜者三人而已韓世忠張俊劉光世此外唯安南國王加功臣號祿秩爵祿之制至周而備諸侯去其籍其詳不可得聞三代而下祿秩至漢而詳然表所載與諸家所敘亦有異同周司祿地官司祿中士四人下士八人主班祿闕大司徒十二教以庸制祿稟人待稍食稿人乘其事以下上其食天官大宰八柄祿以馭富內宰均其稍食宫正均其稍食宫伯行其秩敘月終則均秩酒正月有秩酒者以書契授之醫師嵗終稽醫事制其食春官天府祭天之司祿注文昌第六星或曰下能也內史王制祿則贊為之以方出之鄭司農引上農夫食九人至君十卿祿玄謂王制曰王之三公視公侯卿視伯大夫視子男元士視附庸夏官司士以德詔爵以功詔祿以能詔事以久奠食唯賜無常賜多少由王不如祿食有常品三嵗稽士任而進退其爵祿周官之制有事而後有食有爵而後有祿校人等馭夫之祿宫中之稍食一命以上謂之祿庶人在官者稍食而已孟子文王治岐仕者世祿樂記武王克殷庶士倍祿晉語秦后子楚公子千來求仕叔向為太傅實賦祿韓宣子問二公子之祿對曰大國之卿一旅之田上大夫一卒之田二公子上大夫皆一卒可也爵以建事祿以食爵德以賦之功庸以稱之若之何以富賦祿也文公屬百官賦職任功公食貢大夫食邑士食田庶人食功工商食官皂隸食職官宰食家衛免餘曰唯卿備百邑管子桓公為賦祿之制賦祿以粟案田而稅荀子管仲書社三百戰國䇿葉公子髙食田六百畛王制正義大夫以下位卑祿小故大小國不殊卿與君祿重位尊故祿隨國之大小為節春秋以來卿大夫祿地多踰古制晉惠公許里克以汾陽之田百萬丕鄭以負蔡之地七十萬伯氏駢邑三百魯施氏之宰有百室之邑鄭子産以上卿受八邑宋與左師邑六十齊與晏子邑六十古者制祿不計錢故陸贄曰三代以食人衆寡為差兩漢以石數多少為秩史記燕噲自三百石吏以上而效之以石計祿始見於此秦范雎曰自斗食以上有非相國之人者乎王翦歸斗食以下秩吕不韋舍人六百戶以上奪爵以此考之漢人祿秩大率皆秦制其間小有增損耳孟子論周室制祿自上農夫食九人積之原思為宰與粟九百孟子為齊卿其祿十萬鍾自古至秦漢無不以穀粟制祿也漢秩祿令見律令類百官受奉例後百官志百官受奉例大將軍三公奉月三百五十斛中二千石月百八十斛二千石月百二十斛比二千石月百斛千石月八十斛六百石月七十斛比六百石月五十斛四百石月四十五斛比四百石月四十斛三百石月四十斛比三百石月三十七斛二百石月三十斛比二百石月二十七斛百石月十六斛斗食月十一斛佐史月八斛凡諸受奉半錢半穀古今注建武二十六年四月戊戌增吏奉注荀綽晉百官表注曰漢殤帝延平中中二千石奉錢九千米七十二斛真二千石月錢六千五百米三十六斛云云百石月錢八百米四斛八斗漢百官奉米多錢少於此可見外戚傳傛華秩視真二千石在中二千石之下二千石之上注師古曰真二千石月得百五十斛一嵗凡得千八百石汲黯傳以諸侯相秩居淮陽注如淳曰律真二千石月百五十斛嵗得千八百石二千石月得百二十斛臣瓉注詹事引茂陵書秩真二千石而百官表乃無此東京有之薛宣傳為大司農斗食屬注師古曰斗食者祿少一嵗不滿百石通典漢志自中二千石至百石凡十二等其時亦有奉錢之差貢禹為諌大夫秩八百石奉錢月九千二百為光祿大夫秩二千石奉錢月萬二千列傳東方朔待制錢二百四十霍去病傳定令令驃騎將軍秩祿與大將軍等趙廣漢奏長安遊徼獄史秩百石注特增其秩以厲其行蓋寬饒為司隸校尉奉錢月數千張敞本以鄉有秩周仁以二千石祿張歐以上大夫祿歸老制秩之權有三或升秩以答勳勞或加秩以示恩義或貶秩以責功效蘇武為典屬國乘馬延為將作大匠皆升中二千石蓋升秩之例霍光增符璽郎秩二等元帝加司隸諸葛豐秩光祿大夫蓋加秩之例黃霸還潁川太守官以八百石居京兆尹趙廣漢會赦貶秩一等蓋貶秩之例仲長統昌言曰薄吏祿以豐軍用緣於秦征諸侯續以四夷漢承其業遂不改更漢益吏奉紀宣帝神爵三年八月詔曰吏不亷平則治道衰今小吏皆勤事而奉祿薄欲無侵漁百姓難矣其益吏百石已下俸十五應劭漢書缺九字而知榮辱今小倉廩實而知禮節衣食足吏奉率不足可以什缺八字九字吏奉十二王褒詣缺乃益天下亷元帝建昭二年三月益三河郡太守秩三年夏令三輔都尉大郡都尉秩皆二千石成帝陽朔二年夏五月除吏六百石五百石秩綏和元年四月益大司馬大司空奉如丞相如淳曰律丞相大司馬大將軍奉錢月六萬御史大夫奉月四萬二年六月哀帝即位益吏三百石以下奉平帝元始元年正月詔吏在位二百石以上一切滿秩如真如淳曰諸官初除皆試守一年乃為真食全奉帝即位故賜真漢增秩循吏傳宣帝時二千石有治理效輒以璽書勉厲遷秩賜金王成為膠東相治有聲賜秩中二千石黃霸守潁川秩以八百石居之如前賜秩中二千石如淳曰太守雖號二千石有千石八百石居者有功德茂異乃得滿秩召信臣守南陽為百姓興利又為河南守治行第一數增秩賜金汲黯以諸侯相秩居淮陽王尊為東郡太守秩中二千石焦延夀為小黃令舉最當遷三老官屬上書有詔許增秩留蕭咸為弘農河東守所居有迹數增秩賜金蕭由守江夏平江賊有功增秩缺七字秩中二千石陳立為巴郡守缺八字伯遷水衡都尉秩中二千石缺八字秩二等後傳祭彤為襄賁令政清璽書勉勵增秩一等建武詔增百官奉光武紀建武二十六年正月詔有司增百官奉其千石已上減於西京舊制六百石以下增於舊秩注續漢志曰大將軍三公奉月二百五十斛秩中二千石奉月百八十斛二千石月百二十斛比二千石月百斛千石月九十斛比千石月八十斛六百石月七十斛比六百石月五十五斛四百石月五十斛比四百石月四十五斛三百石月四十斛比三百石月三十七斛二百石月三十斛比二百石月二十七斛百石月十六斛斗食月十一斛佐史月八斛凡諸受奉錢穀各半按此詔缺八字百官表參合其數自比二千石缺九字見其減唯前千石九十斛此作八十前比六百石六十斛此作五十五其餘無增損又據後百官志載百官受奉例古今注曰建武二十六年四月戊戌增吏奉然以此詔參之志比六百石月五十斛此增其五斛四百石四十五斛比四百石四十斛此各增其五斛所謂增者止此他皆舊數志比六百石五十斛四百石四十五斛比四百石四十斛又比紀注遞減五斛紀云正月古今注云四月戊戌未知孰是或以為正月下詔四月定制或曰師古注乃東京制自千石以上以嵗計之常不滿其數必東京所減自千石以下以嵗計之常有竒而過數必東京所增明帝永平四年二月辛亥詔再得時雨賜公卿半奉安帝永初四年又減百官及州郡奉各有差桓帝延熹五年十月假公卿以下奉助軍馮緄傳每出征伐常減公卿奉祿漢月奉禮太宰注祿若今月奉也疏古者祿皆月别給之漢之月奉亦月給之故云若今月奉髙后紀列侯幸得賜餐錢奉邑注師古曰餐錢賜厨膳錢也奉邑本所食邑也左雄上疏曰守相長吏有顯效者可就增秩勿移徙鄉部親民之吏清白任從政者增其秩祿晉增吏奉武帝紀泰始三年九月甲申詔曰古者以德詔爵以庸制祿雖下士猶食上農今在位者祿不代耕非崇化之本也其議增吏奉賜王公以下帛有差元魏太和八年六月丁卯始班俸祿唐武德貞觀給祿百官俸秩食貨志武德元年文武官給祿頗減隋制一品七百石至從九品三十石皆以嵗給之外官則否貞觀初中書舍人髙季輔言會要季輔表在八年外官品卑貧匱宜給祿養親自後以地租春秋給京官嵗凡五十萬一千五百餘斛外官降京官一等一品以五十石為一等至八品九品以二十五斗為一等無粟則以鹽為祿太宗紀貞觀二年二月戊戌外官上考者給祿三年正月癸丑官得上下考者給祿一年官志比部會內外俸祿大府卿凡百俸秩謹其出納唐永徽京官俸料食貨志武德中百官及州縣皆有公廨田供公私之費其後以用度不足京官有奉賜而已諸司置公廨本錢以貿易取息貞觀十二年罷之以上戶七千人為胥士視防閣制而收其課計官多少而給之十五年復置公廨本錢以令史主之褚遂良諌乃罷復詔給百官俸會要貞觀十二年三月遂良上疏二十三日敕停捉錢令史二十一年三月七日復置公廨永徽元年四月二日以租腳直為百官俸料其後又簿一嵗稅以髙戶主之月收息給俸尋顓以稅錢給之嵗總十五萬二千七百三十緡一品月俸八千至九品月俸一千五十又有防閣庶僕防閣自一品九十六人至九品二十四人庶僕自六品十五人至九品二人外官以州府縣上中下為差儀鳳三年王公以下率口出錢以充百官俸食防閣庶僕邑士仗身封戶八月二日令王公以下百姓以上率口出錢以充俸料唐開元制祿通鑑綱目開元六年八月始加賦以給官俸祕書少監崔沔請計州縣官奉常賦之外微有所加以給之志開元十年罷天下公廨本錢復稅戶以給百官會要十年正月二十一日癸亥十八年九月四日復籍稅錢為本收贏以給外官復置公廨本錢收贏十之六二十四年六月二十三日令百官防閣庶僕俸食以月給之總稱月俸一品錢三萬二千至九品千九百一十七祿米則嵗再給之一品七百斛至從九品五十二斛外官降一等兵興權臣增領諸使日給厚奉比開元制祿數倍通鑑開元二十四年六月初分月給百官俸錢會要天寶十四年八月四日詔文武九品以上官月俸十分加二同正官加一分至德二年後內外官不給料錢乾元元年外官給半二年九月五日量給京官俸料唐大厯制祿貞元增百官俸百官俸錢數志大厯中權臣月俸有至九十萬者刺史亦至十萬楊綰常衮為相奏增正員官及觀察團練以下料錢初檢校官同平章事者月給錢十二萬至是判度支韓滉請同正官從髙給之加京官奉嵗約十五萬六千餘緡文官千八百五十四員武官九百四十二員月俸二十六萬緡而增給者居三之一會要大厯十二年四月二十八日己酉度支奏自三帥月料錢一百二十貫至參軍録事十貫是日加給文武九品以上正員月奉六月七日滉奏檢校官同正員建中三年閏正月四日復減百官料錢三分省一以助軍李泌為相奏又增百官及畿內官月俸復置手刀資課嵗給錢六十一萬六千餘緡文官千八百九十二員武官八百九十六員左右衛上將軍以下又有六雜給米鹽私馬手刀隨身春冬服比大厯制祿又厚矣貞元三年六月官李泌傳時州刺史月俸至千緡京祿薄泌以外太重內太輕請隨官間劇普增其奉自李泌增百官奉當時以為不可朘削矣然有名存而職廢額去而奉在者李吉甫建議減之遂為常法會要貞元三年十一月二十六日敕京官及京兆府縣官加給料錢四年正月十六日敕京文武及京兆府縣官三千七十七員元給及新加每月當錢五萬一千四百四貫六百十七一年當六十一萬六千八百五十五貫四百四唐世百官奉錢會昌後不復增減今著其數凡四十四等三師錢二百萬三公百六十萬以十萬減之至太子太傅百四十萬少傅百萬節度使三十萬監軍半之觀察使十萬左右丞侍郎至上州刺史八萬少卿七萬以五千減之至員外郎及上縣令四萬又降殺為五等至上縣丞三萬又降殺為三等至簿尉二萬又降殺為六等至上州參軍博士萬五千又降殺為七等至歸德執戟長上一萬又降殺為八等至十六衛左右中郎將二千八百五十楊綰傳定州府官月廩使優狹相均兵興從權宜官品同而祿例差及四方粗定元王當國偷以為利因不改故江淮大州月千緡而山劍上州刺史止數十緡及此始復太平舊制會要元和十三年六月定德棣四州吏奉十四年四月重定淮西州縣奉李吉甫傳國家之制官一品奉三千職田祿米大抵千石大厯時權臣月奉至九千緡州刺史無大小皆千緡宰相常衮始為裁限至李泌量間劇增之使相通然有名在職廢俸存額去仍詔給事中段平仲中書舍人韋貫之兵部侍郎許孟容戶部侍郎李絳參閲蠲錢凡省冗官八百員史千四百員會要元和九年九月官見省類祥符定百官俸糧料三院乾德四年七月丁亥詔州縣復置俸戶漢乾祐三年於中等置俸戶開寶三年七月壬子減州縣官而益俸四年十一月詔幕職官置奉戶太祖定俸戶之制修益奉之令猶以為煩民也於是出庫財以賦吏祿太平興國元年十一月戊辰詔罷兩京及諸道俸戶月俸並以官物給之二年二月辛酉詔以度支官錢給其三分之一四月壬寅增劍南幕官俸月增五千七年八月乙亥刑寺官俸增給見錢雍熙四年十一月庚辰詔內外文武官舊給八分自今並以實價給之端拱元年六月甲申詔幕職州縣官半給緡錢淳化元年五月甲午詔致仕給半俸四年十一月甲子增幕職州縣官奉緡錢景德三年五月丙辰增州縣俸四年九月壬申詔給緡錢六分祥符五年十一月甲辰詔定加文武職官月俸自三師三公百二十貫至殿直侍禁增二三貫各有差八年十二月庚寅詔料錢復給見緡景祐二年六月十九日詔致仕官給俸寶元二年命近臣去浮費六月壬戌一云丙戌詔百官奉毋得裁減慶厯四年三月壬申給巡尉俸緡錢熙寧四年九月癸卯增令祿曹官簿尉俸自唐貞元四年定百官俸至天祐中止給其半梁開平三年始全給唐同光復虛折周顯德三年復給實錢皇朝大凡約後唐所定數真宗承二聖恭儉之餘始議增給至道三年八月壬寅真宗令有司重定百官俸開寶六年二月辛丑以陸光範等為兩京糧料使舊制用三司大將今改用京官太平興國五年正月分糧料諸司馬步軍為三院命劉錫燕咸一趙冕分掌之八年合馬步軍為一院雍熙四年四月後復分馬步軍為兩院熙寧三年始制天下吏祿而設重法以絶請托之弊是歲京師諸司歲支吏祿錢三千八百三十四貫二百五十四至八百歲支三十七萬一千五百三十三貫一百七十八元豐中自尚書侍郎至胥徒府史與庶人在官者咸制祿增俸嘉祐祿令見律令類二年十月丙午頒嘉祐祿令四年正月壬寅頒嘉祐驛令紹興重修祿秩新書紹興六年九月二十一日丁亥右相張浚上重修祿秩新書敕二卷令三卷格二十五卷申明十五卷目録十三卷修書旨揮一卷共五十八卷看詳百四十七卷吏部侍郎晏端復戶部侍郎王俁等上乞鏤板施行八年十月三日丙辰右相繪等續上重修祿秩一卷祿令二卷祿格十五卷在京祿秩一卷祿令一卷祿格十二卷詔自九年正月朔行之以紹興重修祿秩敕令格為名及申明看詳八百十卷先有詔將嘉祐熙寧大觀祿令并政和祿令格及續降旨揮編修至是續修上之玉海卷一百三十五
