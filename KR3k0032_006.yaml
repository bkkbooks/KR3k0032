  - {type: page-break, offset: 10, content: '', id: KR3k0032_WYG_006-1a, image: WYG0943/WYG0943-0159a.png}
body:
  text: 玉海卷六宋王應麟撰律厯律呂宓羲律法後漢律志京房曰十二律之變至於六十猶八卦之變至於六十四也宓羲作易紀陽氣之初以為律法建日冬至之聲以黃鍾為宮大蔟為商姑洗為角林鍾為徵南呂為羽應鍾為變宮㽔賓為變徵此聲氣之元五音之正也故各終一日其餘以次運行當日者各自為宫而商徵以類從焉禮運篇曰五聲六律十二管還相為宮此之謂也晉志通典同史記律書鍾律調自上古建律運厯前漢志十一月乾之初九黃鍾律長九寸九為萬物元也易曰立天之道曰隂陽六月坤之初六林鐘律長六寸立地之道曰柔剛正月乾之九三太蔟律長八寸象八卦宓羲氏之所以順天地通神明類萬物之情也立人之道曰仁義后以財成天地之道輔相天地之宜以左右民此三律之謂矣是為三統太極元氣函三為一始動於子晉志十二律之生必起焉本呂氏春秋言黃鍾之宮律之也史記生黃鍾術曰音始於宮數始於一神生於無形成於有形然後數形而成聲劉歆三統厯曰黃鍾初九律之首陽之變林鍾初六呂之首隂之變參天兩地之法也太初厯法生於律律法生於易宓羲畫卦由數起此律之始也前志漢太初以律起厯曰夫律隂陽九六爻象所從出也故黃鍾紀元氣之謂律律法也莫不取法焉前志又云推厯生律又曰黃帝制十二筒為律本與此異黃帝律本十二筒竹律律管玉管十二律舜昭華琯玉琯昭華玉前漢律志五聲之本生於黃鍾之律九寸之宮或損或益以定商角徵羽九六相生隂陽之應也律十有二陽六為律黃鍾大蔟姑洗㽔賔夷則亡射以統氣類物隂六為呂林鍾南呂應鍾大呂夾鍾中呂以旅陽宣氣有三統之義焉三統者天施地化人事之紀也黃鍾為天統林鍾為地統太蔟為人統其傳曰黃帝之所作也説苑修文篇同黃帝使泠綸泠音零自大夏之西西戎之國也昆侖之隂取竹之解谷生其竅厚均者斷兩節間而吹之以為黃鍾之宮律之最長也制十二筒以聽鳳之鳴筒音大東反其雄鳴為六雌鳴亦六比黃鍾之宮而皆可以生之謂上下相生也是為律本呂氏春秋仲夏紀古樂篇泠綸作伶倫昆侖作阮隃解谷作嶰溪之谷晉志傳云黃帝使伶倫自大夏之西大夏西方之山乃昆侖之隂阮隃山名山北曰隂西漢曰昆侖之隂取竹之嶰谷生其竅厚鈞者斷兩節間竹生溪谷取其厚均斷兩節間以為律管長三寸九分而吹之以為黃鍾之宫斷竹長三寸九分吹之音中黃鍾之宮曰含少次制十二竹筒六律六呂各有管故曰筒含一作舍寫鳳之鳴雄鳴為六雌鳴亦六一云以之阮隃之下聽鳳凰之鳴以别十二律以比黃鍾之宮皆可以生之以定律呂則律之始造以竹為管取其自然圓虛也呂不韋春秋言見呂氏春秋音律篇黃鍾之宮律之本也下生林鍾亦曰函鍾林鍾上生太蔟太蔟下生南呂南呂上生姑洗姑洗下生應鍾應鍾上生㽔賓㽔賓下生大呂大呂上生夷則夷則下生夾鍾亦曰圜鍾夾鍾上生無射無射下生中呂亦曰小呂三分益一以上生三分去一以下生法鳳之雌雄故律有隂陽上下相生故曰黃鍾之宮皆可以生之律始於黃鍾終於中呂律言其用呂言其體通謂之十二律又云黃帝作律以玉為管長尺六孔為十二月音至舜時西王母獻昭華之琯以玉為之及漢章帝時零陵文學奚景於泠道舜祠下得白玉琯度以為大尺相傳謂之漢官尺説文云得笙玉管武帝太康元年魏襄王冡得玉律古以玉為管取其體含廉潤也大戴禮孔子曰舜以天德嗣堯西王母來獻白琯選注云白玉琯注王元長曲水詩序昭華之珍西王母所獻淮南子堯得舜推而尊之贈以昭華之玉而傳天下注玉名書大傳同漢律志孟康注曰禮樂器記管漆竹長一尺六孔尚書大傳西玉毋來獻白玉琯漢章帝時零陵文學奚景於泠道舜祠下得白玉琯古以玉作不但竹也文選注引風俗通同後人易之以竹西京雜記髙祖初入咸陽周行府庫金玉珍寶不可稱言有玉琯長二尺三寸二十六孔吹之則見車馬山林隱轔相次吹息亦不復見銘曰昭華之琯拾遺記黃帝吹玉律正璇衡太玄云泠竹為管漢志至治之世天地之氣合以生風天地之風氣正十二律定亦見呂氏春秋後魏志黃帝桴阮隃之管定十二之律以成咸池之美帝王世紀黃帝吹律定姓五代會要王朴曰樂作於人心而聲成於物物聲既成復能感人之心昔黃帝吹九寸之管得黃鍾之聲為樂之端半之為清聲倍之為緩聲三分損益之以生十二律十二律旋相為宮以生七調為一均凡十二均八十四調而大備又見樂器類以十二律之變以五變者成六十律七變者成八十四調呂氏春秋古樂篇黃帝又命伶倫與榮將鑄十二鐘以和五音以施英韶隋律志昔者淳古葦籥創覩人籟之源女媧笙簧仍昭鳳律之首後聖廣業稽古彌崇伶倫含少乃擅比竹之工虞舜昭華方傳刻玉之美書稱同律度量衡又曰豫欲聞六律五聲八音七始訓以出納五言此皆候金常而列管憑璿機以運鈞統三極之元紀七衡之響可以作樂崇德殷薦上帝七衡六間見援神契傳稱黃帝命伶倫斷竹長三寸九分而吹以為黃鍾之宮曰含少次制十二管以聽鳳鳴以别十二律比雄雌之聲以分律呂上下相生因黃鍾為始毛爽律譜云案黃帝遣伶倫氏取竹于嶰谷聽鳳阿閣之下始造十二律乃致天地氣應是則數之始也陽管為律隂管為吕其氣以候四時其數以紀萬物隸首作數蓋律之本也故有虞用律和聲鄒衍改之以定五始後魏志昔黃帝採竹崑崙之隂聽鳳岐陽之下斷自然之物寫自然之音音既協矣黃鍾以立數既生矣氣亦徵之於是備數和聲審度嘉量權衡之用皆出於兹書舜典正義漢志云黃帝制十二籥以聽鳳皇之鳴淮南子律之初生寫鳳之音故音以八生通厯黃帝始作律管鬻子注黃帝作孤矢造律管興封禪注逢行圭撰鄧平造厯名之曰初揚雄草玄以之為首王起白玉琯賦質非竽籟韻含宮徵圓其表而合規虛其中而通理舜六律書舜典同律度量衡注律法制王云律六律馬云律法也鄭云隂呂陽律正義律候氣之管而度量衡三者法制皆出於律故云律法制也律和聲注律謂六律六呂十二月之音氣説文云以玉作音故神人以和鳳皇來儀益稷豫欲聞六律五聲八音在治忽以出納五言正義聖人制為六律與五聲相均作樂者以律均聲聲從器出惟言六律者舉陽隂從可知漢志書曰豫欲聞六律五聲八音七始詠以出納五言女聽豫者帝舜也言以律呂和五聲施之八音合之成樂七者天地四時人之始也選長笛賦注呂氏春秋曰舜以夔為樂正於是正六律和均五聲以通八風周玉律晉志武帝太康元年汲郡發魏襄王冡得古周時玉律及鐘磬與新律聲韻暗同于時郡國或得漢時故鍾吹律命之皆應隋志梁武帝鍾律緯稱主衣從上相承有周時銅尺一枚古玉律八枚毛爽云梁武時猶有汲冢玉律宋蒼梧時鑽為橫吹然其長短厚薄大體具存周語景王將鑄無射問律於伶州鳩鍾律也對曰律所以立均出度也紀之以三平之以六成於十二天之道也夫六中之色也故名之曰黃鍾由是第之二曰太蔟三曰姑洗四曰㽔賓五曰夷則六曰無射為之六間以揚沈伏而黜散越也元間大呂二間夾鍾三間中呂四間林鍾五間南呂六間應鍾注六間六呂在陽律之間六十一月曰黃鍾乾初九也律之首故以六律正色為黃鍾之名正月曰太蔟乾九二也三月曰姑洗乾九三也五月曰𬎼賓乾九四也七月曰夷則乾九五也九月曰無射乾上九也十二月曰大呂坤六四也二月曰夾鍾坤六五也四月曰中呂坤上六也六月曰林鍾坤初六也八月曰南呂坤六二也十月曰應鍾坤六三也太玄經六始為律六間為呂注陽為始隂為間於子為律於丑為呂宋志下生者倍以三除之上生者四以三除之書正義聖人之作律既以出音又以候氣布十二律於十二月之位氣至則律應月令正義黃鍾為諸律之首諸律雖長短有差其圍皆以九分為限孟康云林鍾長六寸圍六分則圍之大小逐管長短然則方寸之數不可定也故鄭皆為圍九分也六律六呂皆候氣管名正月之時律之候氣應於太蔟之管又計太蔟管數倍而更半鑄之為鍾名曰太蔟之鍾是律在於前鍾生於後故律厯志云黃帝取竹制十二筒是律生在前蔡氏以為太蔟鍾名先有其鍾後有其律言律中此太蔟之鍾其義非也續漢志注月令章句蔡雍曰律率也聲之管也聖人本隂陽别風聲審清濁而不可以文載口傳也於是始鑄金作鐘以主十二月之聲鍾難分别乃截竹為管謂之律律者清濁之率法也聲之清濁以長短為制五代會要張昭等議月律有旋宮之法備於太師之職漢初制氏所調唯存鼓舞旋宮十二均更用之法世莫得聞漢元帝時京房善易别音探求古義以周官均法每月更用五音乃立準調旋相為宮成六十調又以日法析為三百六十傳於樂府而編懸復舊律呂無差錢樂空記其名沈重但條其説周書王子敷席注瑟師曠歌無射王子歌蟜曲名也鍾律緯云從上相承有周時銅尺一枚古玉律八枚今餘七枚檢考參差惟夾鍾玉琯有昔題刻未必是舜時白琯觀其玉色要非近物乃制為尺以相參驗劉貺大樂令壁記律家之説伶倫始為律管以象鳳鳴舜時得白玉之琯漢零陵舜祠下實得玉管晉汲冡亦獲玉律則古用玉律明矣周六律六同十二律銅管周禮大司樂中大夫二人以六律六同五聲八音六舞大合樂注六律合陽聲六同合隂聲此十二者以銅為管轉而相生黃鍾為首其長九寸各因而三分之上生者益一分下生者去一國語曰律所以立均出度也古之神瞽考中聲而量之以制度律均鍾言以中聲定律以律立鍾之均大合樂謂遍作六代之樂黃鍾陽聲之首大呂為之合疏十二辰之斗建與日辰相配合皆以陽律為之主隂呂來合之大司馬師有功則左執律太師下大夫二人掌六律六同以合隂陽之聲陽聲黃鍾十一月太蔟正月姑洗二月𬎼賓三月夷則七月無射九月隂聲大呂十二月應鍾十月南呂八月函鍾即林鍾六月小呂即中呂四月夾鍾二月皆文之以五聲宮商角徵羽皆播之以八音金石土革絲木匏竹注聲之隂陽各有合辰與建交錯貿易如表裏然其相生則以隂陽六體為之同位者象夫妻異位者象子母所謂律取妻而呂生子也黃鍾長九寸其實一籥下生者三分去一上生者三分益一五下六上乃一終矣疏十二律是候氣之管黃鍾律之首與大呂合故先言之相生則六律六同皆左旋子午已東為上生子午已西為下生東為陽陽主其益西為隂隂主其減以三為法取法於天之生數三也五聲為文即八十一絲為宫七十二絲為商之等大師教六詩以六律為之音大師執同律以聽軍聲典同中士二人掌六律六同之和同隂律也以辨天地四方隂陽之聲以為樂器凡為樂器以十有二律為之數度以十有二聲為之劑量和樂亦如之注陽聲屬天隂聲屬地天地之聲布於四方鄭司農云陽律以竹為管隂律以銅為管竹陽也銅隂也各順其性凡十二律元謂律述氣者也同助陽宣氣與之同皆以銅為疏十二辰在陽辰為律屬天在隂辰為同屬地此即大師所云六律左旋六同右轉隂陽相合者也先鄭并大師執同亦為銅字解之後鄭不從之律厯志云其法用銅古之神瞽度律均鍾以律計倍半十二聲則十二辰零鍾左傳晏子曰一氣二體文武舞三類風雅頌四物五聲六律七音八風九歌以相成也清濁小大短長疾徐哀樂剛柔遲速髙下出入周疏以相濟也管子凡將起五音凡首先主一而三之四開以合九九以是生黃鍾小素之首以成宮三分而益之以一為百有八為徵有三分而去其乘適足以是生商有三分而復於其所以是成羽有三分而去其乘適足以是成角通典以子聲比正聲則正聲為倍以正聲比子聲則子聲為半六韜太公曰律管十二其要有五宮商角徵角此其正聲也周七律七音國語周景王將鑄無射景王二十三年魯昭之二十一年問律於伶州鳩王曰七律者何注周有七音王問七音之律意謂七律為音器用黃鍾為宮大蔟為商姑洗為角林鍾為徵南呂為羽應鍾為變宮𬎼賓為變徵左傳正義引賈逵注謂七器音也對曰昔武王伐殷嵗在鶉火嵗星在張十三度月在天駟月宿房五度日在析木之津津天漢也日宿箕七度辰在斗柄日月合辰斗前一度星在天黿辰星也天黿次名一曰玄枵辰星在須女伏天黿之首星與日辰之位皆在北維北方水位顓頊之所建也帝嚳受之我姬氏出自天黿玄枵齊之分野太薑齊女也及析木者有建星及牽牛焉皆水宿則我太薑之姪伯陵之後逢公之所馮神也嵗之所在則我有周之分野也鶉火周之分野月之所在辰馬祥也辰馬房心星也房星晨正而農事起我太祖后稷之所經緯也稷播五榖王欲合是五位三所而用之五位嵗月日星辰三所逢公所馮周分野后稷詩大明疏星日辰在北嵗在南月在東居三處故言三所謂五物在三處韋昭之言非也向鄭注尚書為文王受命武王伐紂時日皆用殷厯劉五紀論載殷厯之法唯有氣朔而已其推星在天也黿則無術焉箋云協和伐殷之事謂合位三五自鶉及駟七列也鶉火之分張十三度天駟房五度嵗月之所在從張至房七列合七宿謂張翼軫角亢氐房之位南北之揆七同也七同合七律也揆度也嵗在鶉火午辰星在天黿子鶉火周分野天黿及辰水星周所出自午至子其度七同也此左傳正義自戊午至甲子七日劉歆三統之術算五位所在自文王受命至此十三年嵗在鶉火師初發以殷十一月戊子日在析木箕七度是夕月在房五度後三日得周正月辛卯朔合辰在斗前一度明日壬辰晨星初見癸巳武王始發丙午還師戊午度于孟津孟津去周九百里師行三十里故三十一日而度明日己未冬至晨星與婺女伏厯建星及牽牛至婺女天黿之首凡神人以數合之以聲昭之數合聲和然後可同也左傳正義五聲之外加以變宮變徵此二變者舊樂無之之謂注凡合神人之樂也以數合之謂取其七也以聲昭用律調音也故以七同其數而以律和其聲於是乎有七律七同其數謂七列七同七律也律如其聲律有隂陽正變之聲也王以二月癸亥夜陳未畢而雨以夷則之上宮畢之當辰辰在戌上故長夷則之上宮名之曰羽所以藩屏民則也王以黃鍾之下宮布戎於牧之野故謂之厲所以厲六師也以太蔟之下宮布令于商昭顯文德底紂之多罪故謂之宣所以宣三王之德也反及嬴內地名以無射之上宮布憲施舍於百姓故謂之嬴亂所以優柔容民也栁宗元以為大武之律變也左傳昭二十年晏子曰五聲六律七音昭二十五年子太叔曰為九歌八風七音六律以奉五聲注周武王伐殷自午及子凡七日王因此以數合之以聲昭之故以七同其數以律和其聲謂之七音正義曰聲之清濁數不過五而有七音者終五以外更變為之也樂記孔子語賓牟賈六成淮南子詮言訓注周有七律增琴為七絃後周裴政上書以為昔者大舜欲聞七始下洎周武爰制七音武帝讀史書見武王克殷而作七始除黃鍾之正宮用林鍾為調首長孫紹逺以為天子用八先聖弘範周武七音非萬代不易之典隋鄭譯亦謂周有七音之律漢志天地人及四時謂之七始史律書武王伐商吹律聽聲推孟春以至季冬殺氣相并而音尚宮左傳武有七德引隋志長孫紹逺引周語七律又尚書大傳七始服虔左傳注一懸十九鍾鍾七律十二懸二百二十八鍾為八十四律此一嵗之閏數六韜武王問太公曰律音之聲可以知三軍消息勝負之決乎太公曰深哉王之問也律管十二其要有五音可以知敵云云隋盧賁曰殷人以上通用五音周武克殷得鶉火天駟之應其音用七漢興加應鍾故十六枚而在一簴陳氏曰應鍾陽之終㽔賓隂之始應鍾變隂而將之陽㽔賓變陽而至於隂此應鍾㽔賓所以為變也通典殷以前但有五聲周加文武二聲禮大師執同律以聽軍聲而詔吉凶注兵書曰大師吹律合音疏曰武王出兵之書唐志有推七音一卷隋志推七音二卷并尺法周七律記七律周武王之樂也皇天集大命於我有周俾拯斯民於塗炭王乃仗旄秉鉞誕將天威神兵鼓行如雷如霆弧星枉矢所指必克固已得直歲星之王氣赫上帝之明靈宸心兢兢稽揆天道協月正日順動六師矧惟系緒靈長皓穹眷顧培基于帝嚳后稷之時鍾慶于太薑逢公之逺錫羡發祥非一朝夕播諸聲樂于以象成數合聲和其律凡七五音翕繹其變有二循環無間迭為綱紀其所以顯一代象成之美該律呂相生之變至矣盡矣古樂湮散遺音靡存謹推原聖人制作之本意而為之記曰沖氣坱圠運乎太虛物聲動蕩津溢宇宙物聲動蕩津溢宇宙一作物盈天地形動聲隨人為最靈感發尤甚詠歌嗟歎必寓於物嶰谷之竹昭華之玉裁為律管以鬯中聲大師合之不外二六不外一作止於典同辨之惟曰十二統氣類物旅陽宣氣亦不越乎此而已五聲六律十二管還相為宮弗可加已今而正聲之外復有二變豈固為是多端哉凡物之理凡物一作天下拘則泥變則通單出曰聲其本固一雜比為音比音為樂倡和清濁迭相為經變化代興有何窮己詩著四始而加以變風變雅作焉樂備六變及于八變九變極焉歌有間歌樂有縵樂故曰聲相應故生變變成方謂之音信其然乎粵若伏羲作易首紀律法起于黃鍾陽所繇萌變于㽔賓隂所繇基舜命其臣歌詠七始出納五言二漢律志所載班班可睹然則尚矣况於救暴除亂天下之俊功功成作樂王者之盛舉其於聲律得無象之然乎方其毒痡既極簞壺傒后烏流魚躍並襲休祥檀車煌煌虔奉天討招搖在上順應魁杓順斗極運天關厯吉日協靈辰天策成軍用端命于上帝嵗臨鶉火直我分野月在天駟叶于農祥日居析木之津辰次斗柄星緯天黿凡是三者俱位北維顓頊所建帝嚳受之以木伐水實基蒼籙况玄枵之次姬氏自出建星牽牛逢公所憑周分辰馬后稷經緯五位三所合而用之自鶉及駟始于張翼周于氐房其列七焉自南及北昉于正午終于正子其揆七焉自午至子始于極南終于正北嵗臨于北始于辰火終于水星南北之揆以七而同其數以律而和其聲曰黃鍾曰太蔟曰姑洗曰林鍾曰南呂五正聲也而宮商角徵羽繇是以諧曰應鍾曰㽔賓二和聲也而變宮變徵繇是而出想夫太師聽宮聲而教詔太史抱天時而同車鎛師鼓樂而奏凱司馬執律而獻社夾振駟伐盛威中國播之總干山立之舞詠之武宿夜之歌經緯錯綜文以五聲發楊蹈厲播以八音聲音動靜之變盡於此矣或謂六韜兵證特載五聲大武立綴止於六成分律而七其義何居抑不思先王制樂有正有變州鳩之論始之以六律六間者所以紀其正終之以七列七同者所以盡其變杜佑氏通典謂自商而上但有五音至周加文武二聲遂為七音揆觀琴制舊惟五絃少宫少商加二為七琴書所載起于文武實自周始即小觀大可證非誣故曰如琴瑟之專一誰能聽之嗚呼噫嘻窮本知變樂之情也比物飾節者見乎變審一定和者存乎本匪變弗通匪本弗立即夷則畢陳以蕃民則黃鍾布戎以屬六師太蔟布令昭顯文德無射布惠以優柔容民或取諸上宮或取諸下宮蓋律有旋宮之法宮為四聲之綱是惟調合衆樂之宏規統攝羣音之大紀夫豈紛紛云爾哉稽諸太誓燮伐之嵗惟十有三年訂以漢唐史志劉歆一行所推厯法是嵗在鶉火張十三度師初發以十一月戊子日在析木箕七度是夕也月在房五度其度孟津以商厯一月戊午越翌日冬至星在天黿之首二月癸亥陳乎牧壄甲子昧爽會朝清明七律四宫胥起於此景王之鑄無射毋乃未究作律之本乎伶鳩之對縷析條陳旨則深矣按其鑄鐘昉乎周景二十三年以經傳校之則魯昭之二十一年春也越明年鐘成至於至於一作若夫七音之律以奉五聲若若一作則晏子之對景公則前乎此六年一作在昭十五年子太叔之答趙簡子則後乎此四載一作在昭二十五年時之先後相去不逺蓋王澤未泯遺聲餘韻人能言之外傳又載楚觀射父之論六律七事釋以天地民四時之務顔師古注漢史七始之説實權輿於此云孔子律論衡孔子吹律自知殷之苗裔春秋孔演圖孔子曰丘援律吹命隂得羽之宮孝經援神契聖王吹律有姓鄒衍律文選注劉向别録曰鄒衍在燕有谷寒不生五穀鄒衍吹律而溫之至生黍列子師曠之清角鄒衍之吹律漢郊祀歌青陽至玄冥云鄒子樂漢張蒼律史記蒼傳好書尤善律厯為計相時緒正律厯吹律調樂人之音聲及以比定律令若百工天下作程品如淳曰比比次謂五音清濁各有所比不相錯入以定十二律之法令於樂官使長行之至於為丞相卒就之漢家言律厯者本張蒼著書十八篇言隂陽律厯事志漢興北平侯張蒼首律厯事郊祀志秦水德音尚大呂隂律之始也隋志張蒼定律推五勝之法以為水德宋志蒼始定律厯漢協律太初音律太初元年夏五月定官名協音律志武帝時樂官考正史記樂書作十九章令侍郎李延年次序其聲拜為協律都尉敘傳世宗云云協律改正禮樂志武帝立樂府以李延年為協律都尉司馬相如等造為詩賦略論律呂以合八音之調作十九章之歌王褒傳神爵五鳳之間數有嘉應上頗作歌詩欲興協律之事後漢律志孝武正樂置協律之官郊祀歌云五音飭吟青黃展詩應律鋗玉鳴函宮吐角激徵清發梁揚羽申以商造兹新音永久長聲氣逺條鳳鳥翔五音六律依韋饗昭雜變並會雅聲逺姚兒寬傳六律五聲幽贊聖意神樂四合各有方象晉志孝武置協律之官雖律呂清濁之體粗正金石髙下之音有凖然數猶用五隋樂志武帝裁音律之響定郊丘之祭頗雜謳謡非全雅什律志延年頗解新聲變曲未達音律之源元帝自度曲被歌聲分刌節度窮極窈眇漢律凖京房六十律律術又見後後漢志元帝時郎中京房君明知五聲之音六律之數京房傳好鍾律知音聲推律自定為京氏上使太子太傅韋玄成諫大夫章雜試問房於樂府房對受學故小黃令焦延壽六十律相生之法以上生下皆三生二以下生上皆三生四陽下生隂隂上生陽終於中呂而十二律畢矣中呂上生執始執始下生去滅上下相生終於南事而六十律畢矣十二律之變至於六十猶八卦之變至於六十四也宓羲作易紀陽氣之初以為律法建日冬至之聲以黃鍾為宮太蔟商姑洗角林鍾徵南呂羽應鍾變宫㽔賓變徵此聲氣之元五音之正也故各統一日其餘以次運行當日者各自為宮而商徵之類從焉禮運篇曰五聲六律十二管還相為宮此之謂也以六十律分期之日黃鍾自冬至始及冬至而復隂陽寒燠風雨之占生焉於以檢攝羣音考其髙下書曰律和聲此之謂也志贊曰律均前起凖調後發房又曰竹聲不可以度調故作凖以定數凖之狀如瑟長丈而十三絃隱間九尺以應黃鍾之律九寸中央一弦下有畫分寸以為六十律清濁之節房言律詳於劉歆所奏其術施行於史官候部用之大豫樂官有律均見鍾類文多不悉載律術曰陽以圓為形其性動隂以方為節其性靜動者數三靜者數二以陽生隂倍之以隂生陽四之皆三而一陽生隂曰下生隂生陽曰上生上生不得過黃鍾之清濁下生不得及黃鍾之數實皆參天兩地圓蓋方覆六耦承竒之道也黃鍾律呂之首而生十一律者也其相生也皆三分而損益之是故十二律之得十七萬七千一百四十七是為黃鍾之實又以二乘而三約之是為下生林鍾之實又以四乘而三約之是為上生太蔟之實推此上下以定六十律之實以九三之數萬九千六百八十三為法律為寸凖為尺不盈者十之所得為分又不盈十之所得為小分以其餘正其強弱黃鍾十七萬七千一百四十七下生林鍾黃鍾為宮太蔟商林鍾徵一日律九寸凖九尺直一日者凡七律黃鍾至應鍾也直五日凡五律形始至白呂也七日者九依行至分烏八日者十有七大呂至未育直六日至多色育至遲時二十有一直十日至寡惟六十律之終曰南事截管為律吹以考聲列以物氣道之本也術家以其聲微而體難知其分數不明故作凖以代之凖之聲明暢易達分寸又粗然弦以緩急清濁非管無以正也均其中弦令與黃鍾相得按畫以求諸律無不如數而應者矣章帝元和元年待詔候鍾律殷彤上言官無曉六十律以凖調音者故待詔巖崇宋志嚴嵩具以凖法教子男宣願召宣補學官主調樂器詔太史丞弘審試十二律其二中其四不中其六不知何律宣遂罷自是律家莫能為凖靈帝熹平六年東觀典律者張光等問凖意光等不知歸閲舊藏乃得其器形制如房書猶不能定其弦緩急音不可以書曉人知之者欲教而無從心達者體知而無師故史官能辨清濁者遂絶其可以相傳者唯常數及候氣而已宋志同隋志禹以聲為律周禮樂器以十二律為之度數司馬遷律書云黃鍾長八寸七分之一太蔟長七寸七分二林鍾長五寸七分三應鍾長四寸三分三此樂之三始十二律之本末也班固司馬彪律志黃鍾長九寸聲最濁太蔟長八寸林鍾長六寸應鍾長四寸七分四釐強聲最清鄭玄月令注蔡雍月令章句及杜夔荀勗等所論雖尺有增損而十二律之寸數並同漢志京房又以隔八相生一始自黃鍾終於中呂十三律畢矣中呂上生黃鍾不滿九寸謂之執始下生去滅上下相生終於南事更增四十八律以為六十其依行在辰上生包育隔九編於冬至之後分焉遲內其數遂減應鍾之清宋元嘉中錢樂之更為三百律何承天立法制議云上下相生三分損益其一蓋古人簡易之法猶如周天三百六十五度四分之一京房不悟謬為六十承天更設新率一作律則從中呂還得黃鍾十二旋宮黃鍾長九寸太蔟八寸二釐林鍾六寸一釐應鍾四寸七分九釐強其中呂上生所益之分還得十七萬七千一百四十七復十二辰參之數後齊信都芳有巧思能以管候氣陳毛爽受京房律法布管飛灰順月皆驗草隋開皇九年遣爽及大樂令蔡子元等候節氣令爽定其法名曰律譜其略曰班氏漢志盡歆所出也司馬彪志並房所出也爽兄喜陳武帝時以十二管衍為六十律私候氣序並有證應不牛弘論六十律可行晉志淮南京房鄭玄諸儒言律呂皆上下相生㽔賓又重上生大呂夷則上生夾鍾無射上生中呂此三呂於遷固所生之寸數及分皆倍焉餘則並同晉志呂不韋春秋言黃鍾之宮律之本也淮南王安延致儒博亦為律呂云黃鍾之律九寸而宮音調因而九之九九八十一黃鍾之數立續漢志具載京房六十律凖度分數其相生之次與呂覽淮南同司馬遷言律呂相生之次著於前史則以太極元氣函三為一始動於子十二律之生所起無射三分損一下生中呂京房三分益一上生中呂宋志續漢志具載其律凖度數論曰漢志云三分損一下生林鍾三分益一上生太蔟無射既上生中呂則中呂又當上生黃鍾然後五聲六律十二管還相為宮今上生不及黃鍾實二千三百八十四九約實一千九百六十八為一分此則不周九寸之律一分有竒豈得還相為宫乎凡上生下生大略猶周天斗分四分之一耳京房不思此意比十二律微有所增方引而伸之中呂上生執始執始下生去滅至於南事為六十律竟復不合彌益其疏一律而生五音十二律而為六十音因而六之故三百六十音以當一嵗之日通鑑宋元嘉二十二年初漢京房以十二律中呂上生黃鍾不滿九寸更演為六十律錢樂之復演為三百六十律日當一管云云餘見上後魏律志太和十八年髙閭表曰律者樂之本也臣前與孫惠蔚公孫崇等考周官國語及後漢志案京房法作凖以定律吹律以調絲案律寸以孔竹崇依臣共論樂事自作鍾磬志議二卷器數為備樂志後魏陳仲儒請依京房立凖以調八音神龜二年夏仲儒言江左之日頗授琴文覽續漢書見京房律術頗有所得度量衡厯出自黃鍾凖者本以代律取其分數調校樂器則宮商易辨尺寸小長則微濁分數加短則小清若間凖意則辨五聲清濁之韻善琴術則知五調調音之體參此二途以均樂器自然應和不相奪倫作凖調絃緩急清濁可以意推舊志唯云凖形如瑟十三絃隱間九尺以應黃鍾九寸調中一絃令與黃鍾相得案畫以求其聲不辨凖當施柱又案房凖九尺之內為一十七萬七千一百四十七分一尺之內為萬九千六百八十三分又復十之是為於凖一寸之內亦為萬九千六百八十三分於凖一分之內乘為二十分又為小分以辨強弱仲儒考驗但前却柱中以約凖分則相生之韻應合其中絃須施軫以調聲令與黃鍾合中絃下依數畫六十律清濁之節餘十二絃須施柱如筝即於中絃案畫一周之聲度著十二絃上然後依相生之法以次運行取十二律之商徵商徵既定又以琴五調調聲之法以均樂器瑟調以宮為主清調以商為主平調以宮為主五調各以一聲為主然後錯採衆聲以文飾之事寢五代會要張昭議月律有旋宫之法備於太師之職京房以周官均法每月更用五音乃立凖調旋相為宮成六十調又以日法析為三百六十傳於樂府編懸復舊律呂無差錢樂空記其名沈重但條其説六十律法寂寥不嗣國史志京房作凖分六十聲然聲細而難分世不能用禮記禮運注律呂始於黃鍾管長九寸下生者三分去一上生者三分益一終於南呂更相為宮凡六十也疏曰諸本多作終於南事則是京房律法月令黃鍾之宮注十二律轉相生五聲具終於六十正義曰黃鍾之調均則黃鍾為宮黃鍾生林鍾為徵林鍾生太蔟為商太蔟生南呂為羽南呂生姑洗為角此是黃鍾一調之五聲凡十二律律各有五聲則總有六十聲起朱子曰十二律各就其宮以四聲而後六十律之聲備郎宗學京氏易善六日七分崔子玉明京房易傳六日七分郎顗傳注易稽覽圖甲子卦起中孚六日八十分日之七鄭玄注一卦六日七分漢太常銅律前律志劉歆等條奏言之最詳師古曰班氏作志取劉歆之義凡律度量衡用銅者所以同天下齊風俗也銅為物之至精不為燥濕寒暑變其節不為風雨暴露改其形介然有常有似於士君子之行是以用銅也大戴禮太師吹銅五聲之本生於黃鍾之律九寸為宫或損或益以定商角徵羽九六相生隂陽之應也律有十二陽六為律隂六為呂律以統氣類物呂以旅陽宣氣黃鍾黃者色之中鍾者種也天之中數五五為聲地之中數六六為律宮以九唱六始於子大呂呂旅也言隂大旅助黃鍾宣氣而牙物也位於丑太蔟蔟奏也言陽氣大奏地而達物也位於寅夾鍾言隂夾助太蔟宣四方之氣而出種物也位於卯姑洗洗潔也言陽氣洗物辜潔之也位於辰中呂言微隂始起未成著於中旅助姑洗宣氣齊物也位於已㽔賓繼也導也言陽始導隂氣使繼養物也位於午林鍾林君也言隂氣受任助㽔賓君主種物使長大楙盛也位於未夷則則法也言陽氣正法度而使隂氣夷當傷之物也位於申南呂南任也言隂氣旅助夷則任成萬物也位於酉亡射射厭也言陽氣究物而使隂氣畢剝落之終而復始亡厭已也位於戌應鍾言隂氣應無射該藏萬物而雜陽閡種也位於亥其法皆用銅職在大樂大常掌之續志漢興北平候張蒼首治律厯孝武正樂置協律之官元始中召通知鍾律者考其意義羲和劉歆典領條奏班固取以為志一備數二和聲三審度四嘉量五權衡前志同志晉志云校其相生所得與司馬遷同宋云班氏所志未能通律呂本源又推九六欲符劉歆三統之數假託飾説晉志揚子雲曰聲生於日謂甲已為角乙庚為商丙辛為徵丁壬為羽戊癸為宮也律生於辰謂子為黃鍾丑為大呂之屬也聲以情質律以和聲聲律相協而八音生聲和音諧是謂五樂宋志同金石録有律管銘云始建國元年正月癸酉朔日制晉志漢平帝時王莽以銅為之漢鍾律平紀元始五年正月詔天下通知鍾律者志云百餘人樂志八音調均又不協於鍾律京房好鍾律藝文志五行有鍾律災應二十六卷鍾律叢辰日苑二十二卷鍾律消息二十九卷黃鍾七卷後厯志蔡雍能著文清濁鍾律官志注靈臺待詔七人候鍾律後志日冬夏至候鍾律晉志司馬遷言律呂相生之次詳矣劉歆條奏有五班固因而志之蔡雍又記建武已後言律呂者至司馬紹統采而續之史記律書載律數生鍾分生黃鍾術唐志有黃鍾算法四十卷推漢書律厯志術一卷崔浩律厯術一卷漢劉歆鍾律書隋牛弘傳引劉歆鍾律書云春宮秋律百卉必凋秋宮春律萬物必榮夏宮冬律雨雹必降冬宮夏律雷必發聲晉志曰劉歆序論雖博而言十二律損益次第自黃鍾長九寸三分損一下生林鍾長六寸三分益一上生太蔟而左旋八八為位一上一下終於無射下生中呂校其所生所得與司馬遷正同太平御覽風俗通曰案劉歆鍾律書云云風俗通義聲音第六按劉歆鍾律書隋志牛弘等議按禮五聲十二律還相為宫盧植云十二月三管流轉用事當用事者為宫宫君也鄭玄曰陽管為律隂管為吕布十二辰更相為宫始自黃鍾終於南吕凡六十也皇侃疏十一月以黃鍾為宫十二月以大吕正月以太蔟為宫餘月放此凡十二管各備五聲合六十聲五聲成一調故十二調樂稽耀嘉曰東方春其聲角樂當宮於夾鍾餘方各以其中律為宮又云五音非宮不調又動聲儀宮唱而商和周禮奏黃鍾歌大呂以祀天神鄭玄以黃鍾之鍾大呂之聲為均均調也故崔靈恩云六樂十二調荀勗論三調為均首者得正聲之名馬融曰圜鍾應鍾也賈逵鄭玄曰圜鍾夾鍾也陸績注太玄其説謂陽生於子隂生於午從子至已陽生隂退故律生呂言下生呂生律言上生從午至亥隂升陽退故律生呂言上生呂生律言下生至午而變故㽔賓重上生而績論律呂分寸與司馬遷律書特異漢靈臺時律明紀永平二年春正月辛未宗祀明堂禮畢登靈臺詔曰升靈臺望元氣吹時律注時律即月令孟春律中太蔟之類禮儀志注蔡雍志曰章帝著歌詩四章列在食舉又制靈臺十二門詩各以其月祀而奏之熹平四年正月中出靈臺十二門新詩下大豫樂官習誦被聲續律志注薛瑩書曰上章帝以太常樂丞鮑鄴等上樂事下車騎將軍馬防防奏言建初二年七月鄴上言王者有食舉之樂今樂官但有太蔟皆不應月律可作十二月均各應其月氣乃能感天地和氣宜應明帝始令靈臺六律候而未設其門樂經曰十二月行之所以宣氣豐物也月開斗建之門而奏歌其律誠宜施行願與待詔嚴崇及能作樂器者共作治考工給所當上奏寢今明詔下臣防輒問鄴及待詔知音律者以為可順上天之明特因嵗首令正發太蔟之律奏雅頌之音以立太平以迎和氣其條貫甚備詔書以防言下三公禮運篇注鄭玄曰宮數八十一黃鍾長九寸三分宮去一生徵徵數五十四林鍾長六寸三分徵益一生商商數七十二太蔟長八寸三分商去一生羽羽數四十八南呂長五寸三分寸之一三分羽益一生角角數六十四姑洗長七寸九分寸之一三分角去一生變宮三分變宮益一生變徵自此已後則隨月而變所謂還相為宮月令正義數多者濁數少者清正月之時候氣之管中於太蔟中猶應也謂候氣飛灰應於太蔟太蔟之鍾生於太蔟之律律在於前鍾生於後總而言之隂陽皆稱律通典旋宮之樂建初三年鮑鄴始請用之陽嘉二年復廢纍代皆黃鍾一均變極七音漢隨月律十二月均定典律順帝紀陽嘉二年冬十月庚午行禮辟雍奏應鍾始復黃鍾作樂器隨月律注子為黃鍾律長九寸聲有輕重長短度量皆出黃鍾隨月律謂月令正月律中太蔟二月夾鍾三月姑洗四月仲呂五月㽔賓六月林鍾七月夷則八月南呂九月無射十月應鍾十一月黃鍾十二月大呂東觀記曰元和以來音戾不調修復如舊典隋樂志牛弘議按東觀書馬防傳大豫丞鮑鄴等上作樂事下防防奏言建初二年七月鄴上言天子食飲必順於四時五味而有食舉之樂今官雅樂獨有黃鍾而食舉樂但有太蔟皆不應月律可作十二月均各應其月氣公卿朝會得聞月律乃能感天和氣宜應詔下太常太常上言作樂器直錢百四十六萬奏寢今明詔復下臣防可因嵗首之嘉月發太蔟之律奏雅頌之音以迎和氣其條貫甚具遂獨施行起於十月為迎氣之樂又順帝紀云陽嘉二年冬十月庚午以春秋為辟雍隸太學隨月律十月作應鍾三月作姑洗元和以來音戾不調修復黃鍾作樂器如舊典據此而言漢樂宮懸有黃鍾均食舉太蔟均止有二均不旋相為宫元和至陽嘉二年才五十嵗用而復止黃帝聽鳳以制律呂書曰豫欲聞六律五聲周禮有分樂而祭此聖人制作合天地隂陽之和乃云音戾不調誣之甚也今梁陳雅曲並用宮聲唐楊收傳西京諸儒惑圜鍾函鍾之説故郊祀宗廟樂唯用黃鍾一均章帝時太常丞鮑業始旋十二宮夫旋宮以七聲為均後宋登傳為尚書僕射順帝以登明識禮樂使持節臨太學奏定典律又見樂類漢候氣玉律竹律樂均續志五音生於隂陽分為十二律轉生六十所以紀斗氣效物類也天效以景地效以響即律也隂陽和則景至律氣應則灰除是故天子常以日冬夏至御前殿合八能之士陳八音聽樂均度晷景候鍾律權土灰一作炭放隂陽冬至陽氣應則樂均清景長極黃鍾通土灰輕而衡仰夏至隂氣應則樂均濁景短極㽔賓通土灰重而衡低淮南子曰水勝故夏至濕火勝故冬至燥燥故灰輕濕故灰重前天文志冬至短極懸土灰晉灼注引蔡雍律厯記太元瑩曰泠竹為管室灰為候以揆百度進退於先後五日之中八能各以候狀聞太史封上效則和否則占易緯曰冬至人主不出宮寢兵從樂五日擊黃鍾之磬公卿大夫列士之意得則隂陽之晷如度數夏至之日如冬至之日冬至之日立八尺之表日中視其晷晷如度者則嵗美人民和順晷不如度者其嵗惡人民多訛言政令為之不平晷進則水晷退則旱進一尺則日食退一尺則月食月食則正臣下之行日食則正人主之道候氣之法為室三重閉户塗釁必周密布緹縵室中以木為案每律各一內庳外髙從其方位加律其上以葭莩灰抑其內端葭莩出河內案厯而候之一氣至者灰去其為氣所動者其灰散為人及風所動者其灰聚凡殿中候用玉律十二惟二至乃候靈臺用竹律六十候日如其厯月令章句曰古之為鍾律者以耳齊其聲後不能則假數以正其度度數正則音亦正矣鍾以斤兩尺寸中所容受升斗之數為法律以寸分長短為度故曰黃鍾之管長九寸徑三分圍九分其餘皆補短雖大小圍數無增減以度量者可以文載口傳與衆共知然不如耳決之明也晉志楊泉記云取弘農宜陽縣金門山竹為管續郡國志注弘農宜陽有金門山山竹為律管河內葭莩為灰或云以律著室中隨十二辰埋之上與地平以竹莩灰實律中以羅縠覆律呂氣至吹灰動縠小動為和大動君弱臣強不動君嚴暴之應前志聽工以律知日冬夏至一人隋志後漢尺度稍長魏杜夔制律呂以之候氣灰悉不飛梁太常丞毛栖誠取玉管及宋太史尺聞奏詔大匠依樣制管律又飛灰晉志律之始造以竹為管取自然敻虛也月令律中太蔟注應謂吹灰也正義引蔡雍云以法為室三重中央土律中黃鍾之宮正義曰黃鍾候氣之管本位在子黃鍾宮聲與中央土聲相應土無候氣之法非候氣也賀瑒云虛設律於其月崔靈恩云凡隂陽之管合十有二律律各為一調迭相為宮而生五聲合而成樂黃鍾宮最長為聲調之始十二宮之主宮音是五音之長故與黃鍾之調宮聲相應四時之之律皆取氣應土王之律獨以聲應從四時之管而不别候也漢候氣法殿中候用玉律十二惟二至乃候者十二月之律以候月也靈臺用竹律六十候日如其厯者六十日之律以候日也月律當一下一上依次而生日律當用㽔賓重上生司馬遷劉歆之法月律也呂不韋淮南京房之法日律也晉志謂推算之術無重上生之法蓋取司馬而非淮南梁武帝作鍾律緯則是京房而非班固二者之説皆徇一偏之見非通論也玉海卷六
