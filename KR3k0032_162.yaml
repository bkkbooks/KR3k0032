陵雲臺九華臺三國志文帝黄初二年築陵雲臺洛陽記曰高二十三丈登之見孟津洛陽簿凌雲臺閣十一間髙述征記曰陵雲臺在明光殿西八丈七年三月築九華臺樓觀精巧先稱平衆木輕重然後造無錙銖相結臺雖高峻常隨風揺動而終無傾倒之理明帝登臺懼其勢危别以大木扶持之樓即傾壊論者謂輕重力偏也又黄初四年正月築南廵臺于宛六年九月築東廵臺晉華廙傳武帝登陵雲臺汝南王亮傳武帝登陵雲臺望見曰伏妃可謂富貴也魏永始臺丹書臺文選何晏景福殿賦鎮以崇臺實曰永始注永始臺名鎮在宫南闈門此臺下有倉廪韋仲將景福殿賦曰時襄羊以劉覧步華輦於永始知稼穡之艱難壯農夫之克敏地理志許州有丹書臺魏文帝受禪有黄鳥銜丹書集此臺述異記郭景純注爾雅臺今在夷陵郡晉靈臺官志太史又别置靈臺丞潘岳閒居賦靈臺傑其高峙窺天文之祕奥注陸機洛陽記靈臺在洛陽南去城三里辟雍在靈臺東相去一里元魏紀太和十六年春登靈臺觀雲物晉豫章學臺范寗傳為豫章太守大設庠序遣人往交州採磬石以供學用改革舊制不拘常憲逺近至者千餘人資給衆費一出私禄并取郡四姓子弟皆充學生課誦五經又起學臺功用彌廣後魏閱武臺後魏紀孝文大和十八年八月丁未幸隂山閲武臺臨觀講武明元永興二年七月丁巳立馬射臺魏志胡質都督青徐置東征臺且佃且守後魏講武臺水經注太和十八年從高祖北廵届於隂山之講武臺臺之東有高祖講武碑文中書郎高聰之辭吳孫權於武昌臨釣臺唐紀功漢武臺詳見紀功類太宗紀貞觀十九年自洛陽宫伐高麗六月敗之於安市城東南山九月班師十月次漢武臺刻石紀功太宗實録貞觀十九年十月班師次漢武臺餘基三成傍有祠室塋域帝顧問侍臣對曰此是燕齊之士為漢武求仙之處其地俯臨大海長瀾接天岸多峻石竒怪之狀帝製文刻於石唐仰觀臺集賢注記唐大明宫集賢院内西院正屋三門四架一行所居院中有仰觀臺即一行占候之所兩京記東都闕北及南皆有觀象臺太史仰觀之所唐舞鶴臺萬嵗臺景雲臺見封禪類高宗封泰山唐講武臺見講武類地理志許州臨潁有講武臺本尚書臺馬融講書之地顯慶二年十月高宗大閱于此更名太原府晉陽西北十五里有講武臺飛閣顯慶五年築左傳成周宣榭注講武屋唐銀臺高宗龍朔三年十二月庚子詔以舍元殿前銀臺閣内並覩麟迹改來年為麟徳元年李肇記學士出銀臺乗馬宋朝通進銀臺司舊隷樞密院凡内外奏覆文字必闗二司然後進御外則内臣及樞密院吏掌之内則尚書内省籍其數以下有司或行或否得緣為奸樞密學士向敏中請别置局淳化四年八月癸酉以宣徽北院聴事為通進銀臺司命敏中及張詠同知二司事内外章奏案牘謹視出入而勾稽焉月一奏課發勅司舊隷中書尋令銀臺司兼領之九月乙巳以給事中封駁隷通進銀臺司唐測景臺靈臺見渾天及司天臺地理志河南府陽城縣有測景臺㑹要儀鳯四年五月太史令姚元辯奏於陽城測景臺依古法立八尺表夏至日中測景一尺五寸正與古法同調露元年十一月於陽城周公測景所得土圭長一丈二尺七寸開元十一年詔太史監南宫説刻石表焉開元十二年四月二十三日命太史監南宫說及太史官大相元太等馳傳往安南蔡蔚等州測候日景及還京與一行師一時校之並差不同一行以南北日景校量用勾股法算之云大約南北極相去纔八萬餘里餘見覆矩圖范榮有測景臺賦靈臺候簿見大衍厯韋承慶有靈臺賦隋劉祐著觀臺飛候六卷周禮大司徒以土圭之法測土深正日景日至之景尺有五寸謂之地中注日景千里而差一寸尺有五寸者南戴日下萬五千里地與星辰四游升降於二萬里之中是以半之得地之中今潁川陽城縣是也唐肅政臺文昌臺官志御史臺文明元年九月甲寅即光宅元年改肅政臺光宅元年分左右臺尚書省光宅元年改曰文昌臺長安三年閠四月己卯曰中臺隋大業三年四月壬辰増謁者司隷與御史為三臺唐靈臺司天臺並見官制臺省舊紀乾元元年三月辛卯改太史監為司天臺厯志韓頴直司天臺唐麟臺鸞臺蘭臺官志垂拱元年改秘書省曰麟臺門下省曰鸞臺龍朔二年改秘書省曰蘭臺文粹韋表微麟臺碑銘序曰元和五年十一月使鄆經獲麟之舊壌後之人築臺於此以旌厥路唐浚儀岳臺天文志開元十二年得浚儀岳臺晷尺五寸三分東京記祥符縣西九里有岳臺圖經云昔魏王遥事霍山神築此臺禱於其上因以為名宣徳門前天街西第一岳臺坊浚儀祥符二年改祥符國史地理志祥符有岳臺唐集靈臺舊紀天寶元年十月辛丑造長生殿名為集靈臺以祀天神張良器有賦天寳二年進士試唐神爵臺地理志陜州硤石縣東有神雀臺天寶二年以赤雀見置唐御注孝經臺文苑英華張昔御注孝經臺賦云索隠鈎深詞約意逺勒睿㫖於他山之石植崇臺為儒林之苑王猷玉潤帝典金清嚮之者修睦就之者起敬三千子之皷篋邈矣且瞻十八章之箴規掲之備舉高而不危者尚乎臺磨而不磷者莫如石金字累累以條貫銀鈎歴歴而交映唐連弩臺李元諒傳貞元中節度隴右築連弩臺逺烽候為守備西戎憚之初學記費北有積弩堂晉成帝作唐宿羽臺見上陽宫唐望仙臺武宗紀㑹昌五年正月作仙臺于南郊武宗作臺于城之南孫樵作露臺遺基賦以諷之月先是㑹昌三年夏作望仙軍觀于禁中六年六甲申又作望仙樓于神策舊紀㑹昌五年正月己酉朔敇起望仙臺於南郊壇時道士趙歸真特承恩禮柳仲郢傳武宗延方士築望仙臺累諫諄切㑹要武宗㑹昌中於大明宫築臺號曰望仙宣宗大中八年復命葺之右補闕陳嘏抗疏立罷修營八月改為文思院唐麗春臺兩京記東都城有流杯殿在麗春臺北有東西廊南至麗春臺北連弘徽殿南頭皆亭子間以山池殿上作漆渠九曲太平興國講武臺二年築講武臺于城西之楊村九月辛亥幸大閲三年十二月乙丑幸觀飛山卒六年十二月己卯幸賜從臣飲後梁開平元年十月幸繁臺講武本梁孝王吹臺二年七月改為講武臺雍熙觀耕臺四年九月内降手札來年正月有事東郊行藉田禮十月詳定所言舊禮於先農壇東别立觀耕臺帝禮畢登臺以觀公卿請高五尺餘如先農壇至道渾儀臺元年十二月庚辰渾儀成司天監築臺置之慶元四年七月祕書省築渾儀臺高二丈一尺慶厯欽天臺實録慶厯三年五月丁亥上閔雨露立殿庭御衣霑潤戊子雨輔臣稱賀辛卯築欽天臺于禁中長編通畧云欽天壇仁宗以天久不雨降服徹膳躬自暴露夜輒升壇禱祠達旦不寐元魏有天文殿元豐候臺見儀象類元祐御史臺元祐三年新作御史臺成詔曽肇為之記曰御史見於周掌賛書受法令而已戰國以對執灋亦紀事之職也秦漢始置大夫位亞丞相副曰中丞督部刺史受公卿奏事其屬有侍御史出討姦猾治大獄於是専繩糾之任厥後政事歸尚書而御史與尚書謁者並為三臺大夫更為三公而中丞為臺率與尚書令司隷校尉朝㑹皆専席為三獨坐隋唐復置大夫天下有寃而無告者得與中書門下省詰之謂之三司自是御史益為雄峻其屬有殿中監察并侍御史為三院侍御史一人知雜事横榻而坐謂之南牀皆専彈劾不言事本朝因之真宗増置言事御史其後皆得言事然以大夫為兼官不治臺事以郎中員外郎兼侍御史知雜事以貳中丞以太常博士以上為三院未至者為御史裏行監察至神宗正官名始歸大夫職以侍御史治雜事罷御史裏行而復六察官分守既定廼相官府元豐六年六月乙巳朔詔六察各置一御史盖御史臺建於宣化坊自開寳五年纔有東西獄七年雷徳驤分判三院事請而大之屋不及百楹天禧二年復詔増廣至三百六十楹訖于元豐垂七十年神宗伻圖程工以授有司舊闕大夫聴事踵鄴都制度闕門北鄉取隂殺之義至是置大夫聴事闢門東鄉上即政之初實遵先訓猶以大夫虚員始省營築闢門北鄉仍故不改以元祐二年六月乙亥始事三年八月庚辰卒功為屋三百五十一楹詳見官制慶厯五年九月十八日庚子置南京留司御史臺七年六月二十一日壬戌置北京御史臺命馬綘掌之西京舊有之用分司官一人或特命官開寶六年十月丁酉雷徳驤為秘書丞分判御史臺三院事景徳四年五月詔臺有當糾而不糾者尚書省彈奏寶元二年十二月詔御史缺官具兩省班簿來上朕自點一人慶厯四年八月詔臺官毋用輔臣所薦嘉祐四年五月詔除之天聖七年九月知雜鞠詠言申謁之熙寧九年十一月中丞鄧潤甫請除皇祐三年十月乙巳上諭宰臣曰諫官御史必用忠厚淳直通世務明治體之人以革澆薄之敝自是詔舉御史必載帝語降勅先是天聖元年四月丁巳詔近臣舉諫官御史治平二年范純仁為殿中吕大防為監察内出姓名而命之元豐六年九月置檢法主簿元祐三年十二月十四日詔刋神宗舉御史詔于御史臺紹興元年九月侍御史沈與求請舉行元豐六察舊法二十五年十二月一日手詔風憲之地朕親除公正之士以革前弊宜盡心乃職惟結主知翌日右正言張修請刋聖詔于臺及諫院三十年四月二十七日丙子詔以神宗命臺臣舉忠純體國之人補御史詔重刋于臺文苑英華烏臺賦旌良表正癉惡繩回官則秦置臺從漢起歴代臺名五帝時九成有娀氏戰國時崇霞燕姑蘇呉前漢通天承光神明日影通靈八風王莽後漢魚梁前魏凌雲銅爵金虎南廵九華金鳯氷井鬭鷄永始中天後魏凌雲靈芝九華鹿苑閲武含章隋建章麗春麗日月輪雲光集靈三十六國凌霄觀雀凉馬仰觀閱馬六朝望耕日觀北齊金鳳崇光應聖丹臺新録所載閬金高晨鬰墉雲古者天子立靈臺以揆乾度諸侯設觀臺以望雲物文王造周民樂經始而播之詩魯公視朔史謹備豫而載之傳清臺之名視周魯雖異原其用一也玉海卷一百六十二
