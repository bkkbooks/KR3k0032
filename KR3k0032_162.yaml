body:
  text: 玉海卷一百六十二宋王應麟撰宫室庭堂下至門謂之庭黄帝明庭漢郊祀志黄帝接萬靈明庭明庭者甘泉也黄帝升仙之處湯總街庭管子湯有總街之庭見嘖室周大庭少庭汲冢周書大正解周王宅程三年王乃召冢卿三老三吏大夫百執事之人朝于大庭公堂之庭酆保解二十三祀庚子朔九州之侯咸格于周王在酆昧爽立于少庭漢承明庭著作庭班固傳西都賦承明金馬著作之庭漢商庭郊祀志太初元年十二月甲子朔上親禪高里祠后土臨渤海將㠯望祀蓬萊之屬幾至殊庭焉作建章宫其西則商中數十里注師古曰殊庭蓬萊中仙人庭也如淳曰商中商庭也師古曰商金也於序在秋故謂西方之庭為商庭庭名丹臺新録所載太霞瓠瓜臺靈臺附四方而高曰臺晉天文志曰明堂西二百里曰靈臺觀臺也主觀雲物察符瑞候灾變禮含文嘉曰天子靈臺以考觀天人之際法隂陽之㑹伏羲氏傳教臺古三墳燧人氏有傳教之臺有結繩之政天皇伏羲氏皇䇿辭皇曰命子英居我潛龍之位主我隂陽甲厯昊英氏進厯於君曰厯起甲寅皇曰甲日寅辰木王於卯乃鳩衆於傳教臺告民示始甲寅易二月天皇升傳教臺庖氏八卦臺乾鑿度庖氏著乾鑿度上下文注庖氏建治於宛墟今宋國陳留縣有八卦臺運蓍圖日月神朝記綈韋冠服天一太一册在神農樂臺教農臺乾鑿度媧皇氏地靈母經炎帝黄帝有易靈緯注神農帝建治於魯改女皇之太樂今樂臺在魯教農臺在頓黄帝明臺管子桓公問篇公問曰吾念有而勿失得而勿忘為之有道乎對曰勿創勿作時至而随毋以私好惡害公正察民所惡以自為戒黄帝立明臺之議者上觀於賢也魏文紀令曰黄帝有明臺之議放勲有衢室之問所以廣詢于下文選王融策秀才文思政明臺注引管子堯靈臺堯臺漢地理志濟隂郡成陽有堯靈臺昔堯作遊成陽注師古曰言為宫室遊止之處也如淳曰成陽在定陶今有堯靈臺章紀元和二年二月丙辰東廵狩使使者祠唐堯於成陽靈臺安紀延光三年二月庚寅遣使者祠唐堯於成陽金石録有漢成陽靈臺碑兩漢史以為堯冢惟此碑與郭緣生述征記水經以為堯母冢詩正義鄭於六藝論極言瑞命之事云湯登堯臺見黑鳥至文王篇述異記㑹稽山中都郭門古宫存焉宫前有堯臺舜館銘記皆古山海經帝嚳堯舜各二臺臺四方在崐崘東北夏清臺商神臺禮統夏為清臺商為神臺周為靈臺唐志賀述禮統十二卷夏鈞臺璿臺容臺左傳昭四年六月丙午楚椒舉曰夏啟有鈞臺之享注河南陽翟縣南有鈞臺陂啟享諸侯於此帝王世紀在縣西漢地理志潁川郡陽翟注孟康曰今鈞臺在南師古曰陽翟本禹所受封後志陽翟禹所都有鈞臺注汲冢書禹都陽城外紀夏啟元年丁未筮享神于大陵之上是為鈞臺之享又筮享神於晉之墟作為璿臺臺名於水之陽水經注潁水東逕三封山東東南歴大陵西連山亦曰啟筮亭啟享神於大陵之上即鈞臺也陂方十里俗謂之臺陂指鈞臺取名九域志潁昌府有鈞臺驛文選王元長云夏后兩龍載驅璿臺之上注良曰璿臺之上饗諸侯百官李善引山海經曰大樂之野夏后啟於此舞九代馬乘兩龍易歸藏曰昔夏后啟筮享神於晉之墟作為璿臺於水之陽淮南子夏桀之時容臺振而掩覆注行禮容之臺穆天子傳為重璧臺周靈臺武王靈臺詩靈臺五章章四句靈臺民始附也文王受命而民樂其有靈徳以及鳥獸昆䖝焉記大傳正義周本記云文王受命六年立靈臺布王號經始靈臺經之營之庶民攻之不日成之經始勿亟庶民子來注毛氏曰神之精明稱靈四方而高曰臺鄭曰天子有靈臺所以觀祲象察氣之妖祥也文王受命而作邑于豐立靈臺文王之化行似神之精明故名焉正義靈臺所處在國之西郊又云作臺以觀天在豐邑之都含神務曰作邑於豐起靈臺二黄圖曰在長安西北四十里高十丈周四百二十步諸儒説多異異義公羊説天子三諸侯二天子有靈臺以觀天文有時臺以觀四時施化有囿臺觀鳥獸魚鼈諸侯當有時臺囿臺諸侯卑不得觀天文無靈臺皆在國之東南二十五里左氏説天子靈臺在太廟之中壅之靈沼謂之辟廱諸侯有觀臺亦在廟中皆以望嘉祥也康成云大雅靈臺一篇之詩有靈臺囿沼有辟廱則辟廱及三靈皆同處在郊矣囿沼同言靈於臺下為囿為沼可知靈臺與辟廱同處辟廱即天子太學也王制言太學在郊乃殷制其周制則太學在國太學雖在國而辟廱仍在郊何則囿沼魚鳥所萃不可在國中也鄭以靈臺辟廱在西郊則與明堂宗廟皆異處矣盧植禮記注云明堂即太廟也天子太廟上可以望氣故謂之靈臺中可以序昭穆故謂之太廟圓之以水似璧故謂之辟廱蔡邕月令論云云穎子容春秋釋例云太廟有八名其體一也肅然清静謂之清廟行禘祫序昭穆謂之太廟告朔行政謂之明堂行饗射養國老謂之辟廱占雲物望氛祥謂之靈臺其四門之學謂之太學其中室謂之太室總謂之宫賈逵服䖍注左傳云靈臺在太廟明堂之中諸儒皆以廟學靈臺為一袁凖正論云靈臺望氣之觀清廟訓儉之室各有所為非一體也穎氏云公既視朔遂登觀臺以言遂謂之同處視祲之官當在靈臺之上視之馮相保章所觀亦在靈臺孟子文王以民力為臺沼而民歡樂之謂曰靈臺靈沼古人與民偕樂故能樂也劉向新序周文王作為靈臺及於池沼澤及朽骨鄭駁異義云於臺下為囿沼易乾鑿度入戊午蔀二十九年伐崇作靈臺是類謀云文王伐崇作靈臺受赤雀丹書六韜文王既出羑里周公旦築為靈臺淮南子文王為玉門築靈臺以待紂之失管子桓公問篇武王有靈臺之復而賢者進也左傳僖十五年秦舎晉侯靈臺注在京兆鄠縣周之故臺漢地理志文王作酆注師古曰今長安西北界靈臺鄉豐水上是水經注自酆水北經靈臺西文王又引水為辟廱靈沼括地志今悉無復處所惟靈臺孤立今按臺高二丈周四百二十步周禮肆師注尚書傳曰王升舟入水鼓鍾亞觀臺亞疏觀臺可以望氛祥亞鼓鍾後馮相氏注世登高臺以視天文之次序三輔故事漢作靈臺於城東周作靈臺在豐水東常以四孟之月登臺而觀司馬法偃伯靈臺説文周景王作洛陽誃臺尺氏切楚語伍舉曰榭講軍實臺望氛祥榭度於大卒之居臺度於臨觀之高其所不奪隙地其為不匱財用其事不煩官業其日不廢時務瘠磽之地為之城守之木用之官僚之暇臨之四時之隙成之詩曰經始靈臺經之營之吕氏曰文王作臺主於望氛祲觀民俗以察天人之意因以疏㵸精神宣節勞逸一弛一張無非事也周公臺水經注魯縣周公臺高五丈周五十步臺南四里許則孔廟即夫子之故宅也述異記曲阜縣南十里孔子春秋臺周重璧臺穆天子傳天子遊于河濟盛君獻女為造重璧臺郡國志濮州璧玉臺穆天子為盛姬所造魯觀臺周禮保章氏以五雲之物辨吉凶水旱降豐荒之祲象注視日旁雲氣之色司農云以二至二分觀雲色青為蟲白為䘮赤為兵荒黒為水黄為豐左傳僖五年春王正月辛亥朔日南至注周正月今十一月公既視朔遂登觀臺以望而書禮也注臺上構屋可以逺觀凡分至啟閉必書雲物為備故也注素察妖祥逆為之備在服氏曰天子曰靈臺諸侯曰觀臺明堂之中昭二十年二月己丑日南至梓慎望氛注時魯侯不行登臺之禮哀二十五年衛侯為靈臺於藉圃其時僣名之也公羊傳莊三十一年築臺于郎注禮天子有靈臺以候天地諸侯有時臺以候四時登高望逺人情所樂動而無益於民者雖樂不為也史記魏伐宋取儀臺正義靈臺也莊子義臺路寢晉施惠臺史樂書晉平公置酒於施惠之臺楚匏居臺章華臺楚語靈王為章華之臺伍舉曰先君莊王為匏居之臺高不過望國氛大不過容宴豆木不妨守備用不煩官府民不廢時務官不易朝常問誰宴焉則宋公鄭伯問誰相禮則華元駟騑問誰賛事則陳侯蔡侯許男頓子其大夫侍之左傳昭七年楚子成章華之臺括地志在荆州安興縣東八十里十郡國志華容縣東六里文選注陸賈新語楚王作乾谿之臺闚天文邊譲傳作章華賦曰楚靈王既遊雲夢之澤息於荆臺之上前方淮之水左洞庭之波右顧彭蠡之隩南眺巫山之阿延目廣望騁觀終日顧謂左史倚相曰盛哉斯樂可以遺老而忘死也遂作章華之臺築乾谿之室窮木土之技單珍府之實舉國營之數年乃成賈子翟使之楚楚王饗客於章華之臺三休乃至於上東京賦楚築章華於前趙建叢臺於後風賦楚襄王遊蘭臺之宫子虚賦楚王乃登陽雲之臺史記作雲陽正義言其高出雲之陽注孟康曰雲夢中高唐之臺宋玉所賦者大言賦楚襄王與唐勒景差宋玉遊於陽雲之臺七發登景夷之臺列女傳楚有漸臺齊宣王漸臺五重戰國䇿楚王盟强臺而弗登梁王觴諸侯于范臺前夾林而後蘭臺梁有暉臺左傳齊晏子侍於遄臺又有檀臺趙叢臺漢鄒陽傳全趙之時武力鼎士袨服叢臺之下史記武靈王起注六國時趙王故臺在邯鄲城中髙后紀元年夏五月丙申趙王宫叢臺災注師古曰連叢非一故曰叢臺馬武傳光武㧞邯鄲請謝躬馬武等置酒高㑹獨與武登叢臺郡國志趙國有叢臺有洪波臺有檀臺史記趙成侯魏獻榮椽因以為擅臺劉劭趙都賦結雲閣於南宇立叢臺於少陽唐開元二十七年嚴浚作叢臺賦拾遺記周靈王二十三年起昆昭之臺燕寧臺黄金臺樂毅傳報遺燕書曰齊器設於寧臺大吕陳於元英注寧臺燕之臺也燕世家昭王為郭隗改築宫而師事之樂毅自魏往劇辛自趙往鄒衍自齊往文選鮑昭樂府曰將起黄金臺注上谷郡圖經曰黄金臺易水東南十八里燕昭王置千金於臺上以延天下之士王隠晉書曰叚匹磾進屯故安縣故燕太子丹金臺二説不同孔融書曰燕昭築臺以招郭隗述異記燕昭王故城中土人呼為賢士臺亦謂招賢臺拾遺記燕昭王登崇霞之臺韓望氣臺水經注漢官儀曰舊河隄謁者居之城西有韓王望氣臺孫子荆名楚故臺賦叙曰酸棗寺門外夾道左右有兩故臺訪之國老云韓王聴訟觀臺髙一十五仞賦曰蔑丘陵之邐迤亞五嶽之嵯峨言其壯觀也又曰薄邯鄲之業臺陋楚國之章華越靈臺觀臺呉越春秋越王立増樓觀其山巔以為靈臺又曰勾踐置酒文臺水經注越起靈臺於山上史記正義吳越春秋云句踐二十五年徙都琅邪立觀臺以望東海秦琅邪臺史記始皇二十八年作琅邪臺立石刻頌秦徳正義括地志云密州諸城縣東南百七十里有琅邪臺越王勾踐觀臺也漢地理志琅邪郡琅邪越王勾踐嘗治此起館臺有四時祠師古注曰山海經云琅邪臺在琅邪之東郊祀志四時主祠琅邪琅邪在齊東北注山海經云琅邪臺在渤海間謂臨海有山形如臺也後郡國志琅邪國琅邪注越絶曰勾踐徙琅邪起觀臺臺周七里以望東海東海郡朐注博物記縣東北海邊植石秦所立之東門贛榆本屬琅邪注地道記曰海中去岸百九十步有秦始皇碑長一丈八尺廣五尺厚八尺三寸一行十二字水經注琅邪臺在城東南十里韓信臺水經注沔水上安陽縣故隷漢中壻水逕樊噲臺南臺高五六丈又東南逕大城固北水北有韓信臺高十餘丈上容百許人相傳高祖齋七日置壇設九賓禮以禮拜信漢歌風臺國史地理志徐州沛縣有仲虺城漢歌風臺枌榆社豐縣有始皇厭氣臺彭城有項羽戯馬臺宋武帝至彭城大㑹戯馬臺賦詩青州臨淄有遄臺單州單父有宓子賤琴臺開封府祥符有岳臺崇臺澶州濮陽有昆吾臺滄州南皮有魏文射雉臺無棣有蒲縈臺秦始皇縈蒲繫馬之地漢鴻臺三輔黄圖長樂宫有鴻臺秦始皇二十七年築高四十丈上起觀宇帝常射飛鴻于臺上故號鴻臺惠四年三月長樂宫鴻臺災凉風臺在長安故城西建章宫北闗輔記曰建章宫北有凉風臺積水為樓長樂宫有魚池臺酒池臺始皇造又有蓍室臺鬭雞走狗臺壇臺漢韓信射臺又未央宫有果臺東西山二臺未央宫有鉤弋臺通靈臺望鵠臺眺蟾臺桂臺商臺避風臺見池類上林賦累臺増成甘泉賦洪臺獨出思玄賦聘王母於銀臺注仙人所居也闗中記云宫北有井幹臺高五十丈積水為樓言築累方木轉於交架如幹司馬彪云井欄也史記正義云甘泉有瑤臺漢露臺文帝紀賛嘗欲作露臺召匠計之直百金上曰百金中人十家之産也吾奉先帝宫室常恐羞之何以臺為注師古曰今新豐縣南驪山之頂有露臺鄉極為高顯猶有文帝所欲作臺之處翼奉傳上疏曰孝文欲作一臺度用百金重民之財廢而不為其積土基至今猶存注師古曰今在新豐縣南驪山頂上也括地志新豐縣南驪山上猶有露臺之舊址其處名露臺唐孫樵露臺遺基賦曰有土如積其高逾尺隠于修岡屹若環堂漢曲臺射宫列傳翼奉上疏孝文時未央宫有曲臺殿見黄圖鄒陽書諫呉王曰秦倚曲臺之宫垂衡天下注應劭曰始皇所治處若漢未央宫枚乗說呉王游曲臺臨上路不如朝夕之池注張晏曰長安臺臨道上王尊奏成帝正月行幸曲臺臨饗罷衛士注諸侯士更盡得代去故天子自臨而饗之孟喜舉孝亷為郎曲臺署長注師古曰曲臺殿名署主其事也儒林孟卿東海人喜父也事瑕丘蕭奮學禮因授后倉魯閭丘卿倉說禮數萬言號曰后氏曲臺記授沛聞人通漢子方梁戴徳延君戴聖次君沛慶普注服䖍曰在曲臺校書著記因以曲臺記為名師古曰曲臺殿在未央宫儒林蓺文志曲臺后倉九篇注如淳曰行射禮於曲臺后倉為記故名曲臺記漢官儀曰大射于曲臺晉灼曰天子射宫也西京無太學於此行禮文選注七畧曰宣帝時行射禮博士后倉為之辭至今記之曰曲臺記長門賦司馬長卿覧曲臺之央央注三輔黄圖未央東有曲臺殿長安志於曲臺凡三出梁平臺睢陽城梁孝王傳孝景時築東苑方二百餘里廣睢陽城七十里北征記曰城周三十七里凡二十四門而太康地記曰城方十三里梁孝王築之皷倡節杵後下和之者稱睢陽曲大治宫室為複道自宫連屬於平臺三十餘里招延四方豪桀注如淳曰平臺在大梁東北師古曰今城東二十里有故臺基文選沈約宋書謝靈運傳論綴平臺之逸響注梁孝王作平臺招延四方才子逸響謂枚臯司馬相如之文漢栢梁臺栢梁詩銅柱武紀元鼎二年春起栢梁臺漢武舊事曰以香栢為梁香聞數十里大初元年十一月乙酉栢梁臺災夏侯始昌先言其日郊祀志武帝鑄栢梁銅柱食貨志粤欲與漢用船戰廼大修昆明池列館環之治樓船高十餘丈旗幟加其上甚壯天子感之乃作栢梁臺高數十丈宫室由此日麗三輔黄圖在長安城中北帝嘗置酒其上詔羣臣和詩三輔故事臺高二十丈武帝故事起栢梁臺以處神君長安志廟記曰在北闕内道西三秦記曰上有銅鳯名鳯闕括地志在雍州長安故城中元和志在長安故城中未央宫北古文苑漢武帝元封三年作栢梁臺詔羣臣二千石有能為七言詩者乃得上座帝曰日月星辰和四時自梁王以下作詩者二十五人所紀之年不同盖臺建於元鼎而賦詩乃元封也文選注引漢武栢梁臺衛尉詩韓子齊景公登栢寢之臺漢登單于臺武紀元封元年冬十月詔曰南越東甌咸服其辜西蠻北夷頗未輯睦朕將循邊陲擇兵振旅躬秉武節置十二部將軍親帥師焉行自雲陽北歴上郡西河五原出長城北登單于臺至朔方臨北河勒兵十八萬騎旌旗徑千餘里威震匈奴遣使者告單于曰南越王頭已縣於漢北闕矣單于能戰天子自將待邊不能亟來臣服何但亡匿幕北苦寒之地為匈奴讋焉漢通天臺承露仙人掌别見長樂宫武紀元封二年春幸緱氏遂至東萊夏四月還祠泰山至瓠子臨决河還作甘泉通天臺史記云通天莖臺注師古曰言此臺高上通于天漢舊儀曰高三十丈去長安三百里望見長安城郊祀志初公孫卿言仙人可見上往常遽以故不見今為館如緱氏城置脯棗神人宜可致且仙人好樓居於是上令長安作飛亷桂館甘泉則作益夀延夀館使卿持節設具而候神人乃作通天臺置祠具其下將招來神仙之屬注師古曰為塞河及造臺而有神光之應通鑑元封二年作漢武故事築通天臺去地百餘丈望雲雨悉在其下去長安三百里望見長安城黄帝以來祭天圜丘處武帝祭太一上通天臺舞八嵗童女三百人置祠祀招仙人祭太乙令人升通天臺以候天神天神既下祭所若大流星乃舉烽火而就竹宫望拜上有承露仙人掌擎玉盃承雲表之露漢武故事又有通天宫王温舒傳上欲作通天臺覆中尉脱卒得數萬人作上説拜為少府西域傳賛營千門萬户之宫立神明通天之臺三輔黄圖亦曰候神臺又曰望仙臺武帝時作栢梁柱承露仙人掌之屬注建章宫承露盤高二十丈大七圍以銅為之上有仙人掌承露和玉屑飲之括地志雲陽宫在雍州雲陽縣西北八十一里有通天臺即黄帝以來祭天圜丘之處元和志在甘泉宫中高三十五丈望雷雨悉在下武帝于甘泉宫中為臺畫天地泰臺諸鬼神而祭之上林賦置酒乎顥天之臺注張揖曰臺高上干顥天也甘泉賦乃望通天之繹繹直嶤嶤以造天西京賦通天訬以竦峙徑百常而莖擢上辬華以交紛下刻陗其若削伏櫺檻而頫聴聞雷霆之相激采少君之端信庶欒大之貞固立修莖之仙掌承雲表之清露屑瓊蘂以朝飡必性命之可度文苑英華唐黎􅑮通天臺賦危檻岧嶤廻途鬰律植承露之盤開肅神之室將以接上元期太一丹檻栖於列宿飛梁歴於倒景任公叔賦嶝道邈以特立通天赫其無儔託神靈於秦甸結元氣於雍丘白日旁轉青雲上浮八垓可接於咫步萬象無逃於寸眸爟火周起神光􅒯來召安期於滄海降王母於黄屋楊系賦若瑤臺之霞駮冠鼇山於溟海若瓊樓之雲蔚照龍燭於崑丘高揖八極俯窺萬井拂軒楯之宛虹步檐檻之倒景玉女下視金烏上廻南史沈烱字初明行經漢武通天臺為表奏之後周圜丘歌辭云王城七里通天臺紫微斜照影徘徊連珠合璧重光采天策蹔轉鈎陳開列子周穆王築中天之臺其高千仭漢漸臺詳見建章宫鄧通傳文帝覺而之漸臺求得通注未央殿西南有蒼池池中有漸臺元和志在未央宫西水經注沈水逕漸臺東郊祀志太初元年二月起建章宫其北治大池漸臺高二十餘丈名曰泰液注漸一音子亷反浸也水所浸三輔黄圖作瀐亦浸義黄圖漸臺在建章宫太液池中高二十餘丈漸浸也言為池水所漸又一説漸臺星名法星以為臺名未央宫有滄池池中有漸臺王莽死于此西京賦顧臨太液滄池漭沆漸臺立于中央赫昈昈以弘敞晉天文志織女東足一星曰漸臺臨水之臺也主晷漏律吕之事漢武臺李陵傳召見武臺叩頭請罪臣願以少擊衆步兵五千人涉單于庭上許之注師古曰未央宫有武臺殿文臣見於宣室武臣見於武臺九域志滄州有漢武臺輿地志云漢武帝至此築唐紀功次漢武臺見下漢玉臺珍臺騰光臺招仙臺西京賦西有玉臺聫以昆徳注臺殿名珍臺蹇産以極壯隥道邐倚以正東珍臺臺名天馬歌遊閶闔觀玉臺注上帝所居甘泉賦珍臺閒館洞㝠記建元二年起騰光臺以望四逺常有飛光如星集於臺上亦曰經星臺集方士説仙事又起招仙之臺於明庭宫即甘泉别名於臺上撞碧玉鐘太初二年起甘泉望風臺漢神明臺郊祀志太初元年作建章宫紀二月起建章宫其南立神明臺井幹樓高五十丈輦道相屬焉注師古曰漢宫閣疏神明臺高五十丈上有九室常置九天道士百人然則神明井幹俱高五十丈也井幹樓積木而高為樓若井幹之形也水經注黄圖曰在建章宫中今人謂之九子臺非也東方朔傳左鳯闕右神明黄圖神明臺祀仙人處上有銅仙舒掌捧銅盤承雲表之露括地志在長安縣西北二十里長安故城在西漢建章宫有神明臺西都賦神明鬰其特起軼雲雨於大半虹霓廻帶於棼楣三輔宫殿簿長樂宫有臨華臺神仙臺漢登仙臺文選注戴延之西征記曰嵩中嶽也東謂大室西謂少室相去十七里嵩高總名也漢武帝作登仙臺在少室峯下淮南王安立思仙臺漢龍臺司馬相如傳上林賦登龍臺注張揖曰觀名在豐水西北近渭史記正義三輔故事云龍臺高六丈去豐水五里漢時龍見陂中故作此臺括地志云龍臺一名龍臺觀在雍州鄠縣東北三十五里漢望海臺水經注浮瀆又東北逕漢武帝望海臺又東注于海魏氏土地記曰章武縣東百里有武帝臺南北有二臺相去六十里基高六十丈俗云漢武帝東廵海上所築文苑英華有觀風臺賦漢豫章臺見昆明池漢符節臺三臺嚴延年傳上欲徴延年符已發注應劭曰符竹使符也臧在符節臺欲有所拜召治書御史符節令發符下大尉也霍光傳皇帝信璽行璽注漢初三璽天子之璽自佩行璽信璽在符節臺後百官志符節令一人六百石為符節臺率主符節事凡遣使掌授節屬少府秦中車府令髙行符璽令事後五行志中平二年二月南宫雲臺灾延及尚書符節蘭臺官志注蔡質漢儀曰客曹郎主治羌胡事劇遷二千石或刺史其公遷為縣令詔書賜錢三萬與三臺祖餞餘官則否蔡邕傳以侍御史轉治書御史遷尚書三日之間周歴三臺文選坐領三臺注應劭漢官儀曰尚書為中臺御史為憲臺謁者為外臺漢官典職謝靈運晉書曰云云是為三臺晉志魏别為一臺位次御史中丞掌授節銅虎竹使符及泰始九年武帝省并蘭臺置符節御史魏都賦符節謁者典璽儲吏注宣明門外東入最南有謁者臺閣次中央符節臺閣最北御史臺閣三臺並列西向符節臺東有丞相諸曹晉劉長升為尚書左丞正色在朝三臺清肅漢上林清臺靈臺銅表事見太初厯靈臺候臺見渾儀唐清臺見瑞星前律厯志元鳯三年太史令張夀王言太初厯過詔主厯使者鮮于妄人詰問妄人請與治厯麻光等二十餘人雜候日月晦朔弦望八節二十四氣詔與丞相御史大夫大將軍史各一人雜候上林清臺課厯疏密凡十一家一作十家黄圖靈臺在長安西北八里始曰清臺本為侯者觀隂陽天文之變更名曰靈臺後漢作靈臺掌候日月氣而屬太史太史有二丞其一在靈臺漢官曰靈臺員吏十三人靈臺待詔四十二人郭緣生述征記曰長安宫南有靈臺高十五仞上有渾儀延熹七年造張衡所製又有相風銅烏千里風至此烏乃動又有銅表高八尺長一丈三尺廣一尺二寸題云太初四年造水經注曰城南漕渠有漢靈臺然則漢城西之上林城南之漕渠皆有候景之臺也晉樂志漢明皇帝即位表圭影而陳清廟亢倉子齊太子坐清臺之上宋書孝武大明六年八月己丑置清臺令漢昆明臺水經注沈水北與昆明故池㑹又北逕長安城西與昆明池水合水上承池於昆明臺故王仲都所居也新論仲都卧於池臺上漢蘭臺令史漢蘭臺圖籍魏蘭臺百官表御史中丞在殿中蘭臺掌圖籍秘書後百官志御史中丞蘭臺令史六百石掌奏及印工文書班固班超傅毅李尤孔僖楊終皆為之車千秋傳令丞相親掘蘭臺蠱王莽傳夏賀良䜟書臧蘭臺注師古曰蘭臺掌圖籍之所後傳楊終顯宗召詣蘭臺拜校書郎賈逵永平中勅蘭臺給筆札作神爵頌王允為司徒及遷都闗中允收斂蘭臺石室圖書秘緯要者以從至長安皆分别條上經籍具存允有力焉儒林傳黨人既誅其高名善士多坐流廢有私行金貨定蘭臺桼書經字以合私文及遷都之際自辟雍東觀蘭臺石室宣明鴻都藏典册文章競共剖散及王允所收而西者裁七十餘乗道路艱逺復弃其半矣西京賦内有蘭