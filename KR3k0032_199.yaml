body:
  text: 玉海卷一百九十九宋王應麟撰祥瑞動物鳯祥禽黄帝鳯凰翔庭銜圖巢阿閣淮南子黄帝治天下鳯凰翔於庭律之初生寫鳯之音二皇鳯至於庭伏羲神農三代鳯止於門堯舜禹周室鳯至於澤德彌澆所至彌逺德彌精所至彌近韓詩外傳黄帝問天老鳯象對曰鴻前麟後龍文龜身燕頷鷄喙帝齋於殿中鳯凰蔽日而至帝再拜稽首皇天降祉不敢不承命鳯乃集東囿棲梧桐食竹實天老曰國安其主好文則鳯凰居之今鳯皇翔於東郊而樂之其鳴音中夷則與天相副說苑同引白虎通日止於東園選注禮瑞命記鳯止帝園春秋緯合誠圖黄帝游雒水上與大司馬容光等臨觀鳯凰銜圖置帝前帝再拜受圖帝坐元扈注石室名尚書中候握河紀曰堯即位七十年鳯凰止庭伯禹拜曰昔帝軒提象鳯凰巢阿閣見春秋正義鳥中候又云黄帝鸞來儀詩正義元命苞云鳯凰銜圖置帝前黄帝再拜受帝王世紀黄帝坐於元扈有大鳥體被五色三文蓋鳯也宋志黄帝黄服齋於中宫坐於元扈洛水之上有鳯凰集不食生蟲不履生草或止帝之東園或巢於阿閣或鳴於庭其雄自歌其雌自舞麒麟在囿神鳥來儀五十年秋七月庚申天霧三日三夜晝昏黄帝以問天老力牧容成曰何如天老曰國安其主好文則鳯凰居之今鳯凰翔於東郊而樂之其鳴音中夷則與天相副天有嚴教以賜帝帝勿犯也霧除遊於洛水之上見大魚魚流於海得圖書焉龍圖出河龜書出洛赤文篆字少昊登帝位有鳯凰之瑞髙辛氏使皷人拊鞞皷擊鐘磬鳯凰皷翼而舞鳯凰仁鳥也其鳴雄曰節節雌曰足足晨鳴曰發明晝鳴曰上朔夕鳴曰歸昌昏鳴曰固常夜鳴曰保長少皥氏鳯紀左傳少皥氏鳯鳥適至故紀於鳥鳯鳥氏厯正也注鳯知天時正義運斗樞云天樞德見則鳯凰翔少昊氏赤燕田俅子赤燕一羽飛集少昊氏之户遺其丹書拾遺記黄帝時祗攴國獻重明鳥瑞應圖黄帝習樂崑崙有元鶴集其右堯時青鶴音中律吕堯鳯巢阿閣荀子解蔽篇詩曰鳯凰秋秋其翼若干其聲若簫有鳯有凰樂帝之心此不蔽之福也注逸詩也帝葢謂堯也堯時鳯凰巢於阿閣堯鳯凰負圖止庭春秋合誠圖堯坐中舟與太尉舜臨觀鳯凰負圖授堯赤玉為柙黄玉檢白玉䋲其章曰天赤帝符璽五字楊子鳯凰蹌蹌匪堯之庭宋志堯在帝位七十年鳯凰在庭舜鳯凰巢庭鳯凰來儀書益稷簫韶九成鳯凰來儀宋志舜即位鳯凰巢於庭書帝命驗赤鳯來儀服䖍云貌恭性仁則鳯凰來儀晉傅咸賦感聖化而來儀兮讃簫韶於九成中候帝舜曰朕惟不乂百獸鳯晨注百獸率舞鳯凰司晨鳴魏志注舜禹有天下鳯凰翔書大傳舜好生惡殺鳯凰巢其木劉向傳舜命九官衆賢和於朝則萬物和於野故簫韶九成而鳯凰來儀山海經丹穴之山有鳥名曰鳯凰自歌自舞見則天下大安寜郭璞賛鸞翔女牀鳯出丹穴拊翼相和以應聖哲舜三足烏古今注抱朴子虞舜至孝三足烏集其庭漢章帝元年烏生三足色赤烏三足陽數竒也典引三足軒翥於茂木湯白鳩宋志白鳩成湯時來至魏黄初初郡國十九言白鳩見晉太始八年五月甲辰白鳩二集太廟南門太康二年七月見太僕寺四年十二月見安定湯黒玉商頌疏中候雒予命云天乙在亳東觀於洛黄魚䨇躍出濟於壇黑鳥以雒隨魚亦止化為黒玉赤勒曰元精天乙受神福周鳯凰銜書鳯凰歌宋志文王孟春六旬五緯聚房後有鳯凰銜書游文王之都書又曰五星聚房昭理四海周公旦攝政七年制禮作樂神鳥鳯凰見蓂莢生麒麟游苑鳯凰翔庭成王援琴而歌曰鳯凰翔兮於紫庭余何德兮以感靈頼先王兮恩澤湊一作臻于胥樂兮民以寜琴操成王著儀鳯之歌古今樂録成王時鳯凰翔舞作神鳯操曰鳯凰翔兮於紫庭云云尚書中候周公太平制禮鸞鳥見周書王會西申以鳯鳥鳯者戴仁抱義掖信歸有德氐羌以鸞鳥巴人以比翼鳥方揚以皇鳥蜀人以文翰方人以孔鳥拾遺記成王四年旃塗國獻鳯雛載以瑶華之車駕赤象至京師育於靈禽之苑及成王封泰山禪社首文彩炳燿昭王二十四年塗循國獻青鳯丹鶴騫霄國有黒鳯説文成王時氐羌獻鸞鳥周鸑鷟鳴岐山元命苞武王受鳯書之紀國語内史過曰周之興也宋志文王鸑鷟鳴於岐山注鸞鳯别名詩云鳯凰鳴矣于彼髙岡其在岐山之脊乎選嵇康琴賦舞鸑鷟於庭階李善引國語周文王時鸑鷟鳴岐山景福殿賦翔岐陽之鳴鳯注引鸑鷟貞觀政要魏徴上疏昔周文王遊於鳯凰之墟襪系解顧左右莫可使者乃自結之周文之朝盡為俊乂書正義卷阿歌成王之德其九章曰鳯凰鳴矣于彼髙岡鄭云因時鳯凰至故以喻焉周文鶾爾雅注逸周書曰文鶾若彩鷄成王時蜀人獻之漢志管仲曰古之封禪西海致比翼之鳥爾雅謂之鶼書目師曠禽經一卷晉張華注按康成釋深衣疏謂其語出禽經今此書無有東京賦鳴女牀之鸞鳥舞丹穴之鳯凰注女牀山名在華隂西六百里山海經曰女牀之山有鳥狀如鶴五色文名曰鸞鳥見則天下安寜丹穴之山有鳥如鵠五采名曰鳯凰飲食自歌自舞見則天下安寜穆天子傳仲秋丁巳天子射鹿於林中乃飲於孟氏爰舞白鶴二八周赤烏白雉中候周紀武王渡孟津有火自上復於下至於王屋流為烏其色赤其聲魄董仲舒曰受命之符墨子赤烏銜珪降周之岐社曰命周文王代殷詩臣工於皇來牟箋赤烏以牟麥俱來思文正義書說曰烏有孝名武王卒父業故烏瑞臻赤周之正榖記后稷之德禮說曰武王赤烏榖芒應史記封禪書周有火德有赤烏之符呂氏春秋文王之時赤烏銜丹書集於周社故其色尚赤魏志楊阜上疏曰文王有赤烏之符許芝曰湯之王白烏為符文王為西伯赤烏銜丹書呉志張紘書曰殷湯有白鳩之祥周武有赤烏之瑞宋志武王有火自天止於王屋流為赤烏烏銜榖焉述異記周成王元年貝多國人獻舞雀周公反命之韓詩外傳成王之時越裳氏重九譯而至獻白雉於周公宋志作越常周赤雀詩文王正義中候我應及雒師謀說文王之事言赤雀丹書易通卦驗言文王得赤烏而演易是類謀曰受赤雀丹書春秋元命苞曰鳯凰銜丹書於文王之都六藝論言瑞命之事云湯登堯臺見黑鳥至武王渡河白魚躍文王赤雀止於户秦穆公白雀集於車宋志周文王時赤雀銜丹書來至春秋考異郵黄帝將興有黄雀赤頭立於日旁帝曰黄者土之精赤者火之榮雀者爵也余當王立大功乎漢赤鴈武紀太始三年二月宋志三月五日行幸東海獲赤鴈作朱鴈之歌禮樂志郊祀歌象載瑜十八赤鴈集六紛員殊翁雜翁鴈頭五采文神所見施祉福登蓬萊結無極漢甘泉羣鶴武紀後元元年二月詔曰朕郊見上帝春正月廵于北邊見羣鶴留止以不羅罔靡所獲獻薦於泰畤光景並見其赦天下漢青雀𥘉學記洞㝠記漢武帝生時有雀羣翔於㶚城門改為青雀門乃飾以錦文石為列錢之形漢武内傳有䝉山白鳯漢鳯凰詳見總瑞漢紀昭帝始元三年冬十月鳯凰集東海遣使者祠其處元鳯元年八月改元注應劭曰三年中鳯凰比下東海海西樂鄉於是以冠元宣帝本始元年五月鳯凰集膠東千乗四年五月集北海安丘淳于二縣屬北海地節二年夏四月集魯郡羣鳥從之元康元年三月詔曰鳯凰集泰山陳留表是嵗少府宋疇坐議鳯凰下彭城未至京師不足美貶泗水太傅二年三月以鳯凰集賜爵神爵二年二月詔曰迺者正月乙丑鳯凰甘露降集京師羣從以萬數其赦天下志幸河東之明年正月鳯凰集祋祤於所集處得玉寶神爵二年也四年二月詔鳯凰集京師鸞鳯萬舉蜚覽翶翔止於后土祠旁十月鳯凰十一集杜陵十二月集上林郊祀志乃作鳯凰殿以荅嘉瑞在是年五鳯三年三月辛丑鸞鳯又集長樂宫東闕中樹上飛下止地文章五色留十餘刻吏民並觀先是鳯凰五至因以改元甘露二年正月詔廼者鳯凰甘露降集三年二月詔曰迺者鳯凰集新蔡羣鳥四面行列皆向鳯凰立以萬數講德論鳯凰來儀翼翼邕邕羣鳥並從舞德垂容神雀仍集麒麟自至甘露滋液嘉禾櫛比漢黄鵠下太液池黄鵠經祠壇昭紀始元元年春二月黄鵠下建章宫太液池中公卿上壽賜諸侯王列侯宗室金錢各有差臣瓉曰漢用土德服色尚黄鵠色皆白而今更黄以為土德之瑞故紀之師古曰黄鵠乃大鳥一舉千里非白鵠也西京雜記帝作黄鵠歌曰黄鵠飛兮下建章羽肅肅兮行鎗鎗古今注惠帝五年七月黄鵠集蕭池後章紀元和二年二月辛未幸泰山黄鵠三十經祠壇上東北過於宫屋翺翔升降東觀記云白鶴漢神爵集泰山宣紀元康三年春神爵數集泰山賜諸侯王丞相將軍列侯二千石等帛有差賜吏爵二級民一級女子百户牛酒鰥寡孤獨髙年帛漢神爵集雍元康三年六月詔曰前年夏神爵集雍晉灼曰漢注神爵大如鷃爵黄喉白頭黒背腹班文今春五色鳥以萬數飛過屬縣翶翔而舞欲集未下其令三輔毋得以春夏擿巢探卵彈射飛鳥具為令郊祀歌長麗前掞光耀明注臣瓉曰長離靈鳥舊說云鸞也宋志五鳯三年正月神雀集京師神鳥者赤神之精風俗從則至漢神爵集長樂未央北宫萬嵗宫威鳯潁川鳯凰紀元康四年三月詔曰迺者神爵五采以萬數集長樂未央北宫髙寢甘泉泰畤殿中及上林苑朕之不逮寡於德厚屢獲嘉祥非朕之任其賜天下吏爵二級民一級女子百户牛酒三老孝悌力田鰥寡孤獨帛明年改神爵元年神爵元年三月詔曰迺元康四年神爵仍集南郡獲白虎威鳯為寶晉灼曰鳯之有威儀者與尚書鳯凰來儀同意幸萬歲宫神爵翔集汾隂有萬嵗宫是嵗幸河東改應劭曰前年神雀集於長樂宫故元年黄霸傳是時鳯凰神爵數集郡國潁川尤多下詔稱揚京兆尹張敞舍鶡雀飛集丞相府霸以為神爵議欲以聞嚴延年傳時黄霸在潁川以寛恕為治屢䝉豐年鳯凰下上賢焉下詔稱揚其行加金爵之賞郊祀志上自幸河東之明年正月鳯凰集祋祤於所集處得玉寶起歩壽宫下詔赦天下後間嵗鳯凰神爵甘露降集京師赦天下其冬鳯凰集上林迺作鳯凰殿以答嘉瑞明年正月復幸甘泉郊泰畤改元曰五鳯鳯凰下郡國凡五十餘所宣帝揚雄校獵賦發黄龍之穴窺鳯凰之巢臨麒麟之囿幸神雀之林論衡宣帝時鳯凰集上林後又於長樂宫東門樹上髙五尺文章五色漢白鶴集後庭五色鴈集殿郊祀志宣帝由武帝正統興故立三年尊孝武廟為世宗行所廵守郡國皆立廟告祠世宗廟日有白集後庭以立世宗廟告祠孝昭寢有鴈五色集殿前西河築世宗廟神光興於殿旁有鳥如白鶴前赤後青神光興於房中如燭狀瑞應圖黄帝集崑崙以舞衆神玄鶴二八翔其左淮南之經鮑照之賦翼松喬於碧落侣鸞皇於紫烟唐舞鶴臺哲宗朝翔鶴曲彼鳴在隂聲聞於天漢神鳥集長樂宫宋志漢宣帝五鳯三年二月辛丑神鳥集長樂宫東闕樹上又飛下地五采炳發留十餘刻章帝元和中神鳥見郡國神鳥赤色而備五采鳴中五音肅肅雍雍喜則嗚舞漢白雉素鳥元始元年正月越裳氏重譯獻白雉一黑雉二詔使三公以薦宗廟建武十三年九月日南徼外蠻夷獻白雉元和元年正月復獻班固白雉詩啓靈篇兮披瑞圖獲白雉兮效素烏嘉祥阜兮集皇都發皓羽兮奮翹英容絜朗兮於淳精章皇德兮侔周成永延長兮膺天慶光武時日南獻白雉明帝時獲素烏明紀永平十一年時麒麟白雉醴泉嘉禾所在出焉章帝元和中白雉見郡國郊祀志丙辰禪泰山下阯東北肅然山縱逺方竒獸飛禽及白雉諸物下詔改元為元封武帝漢潁川五鳯凰神雀紀光武建武十七年冬十月有鳯凰五見於潁川之郟縣東觀記曰鳯凰髙八尺五采羣烏並從行列葢地數頃停一十七日光武生於濟陽鳯凰