太牢有元龜銜符從水中出至壇中而去視之乃所夢得符也河圖堯沈璧於洛元龜負圖帝王世紀黄帝游洛水見大魚魚流於海中負圖書今河圖帝視萌之篇是也述異記陶唐之世越裳國獻千嵗神龜方三尺餘背上有文皆科斗書記開闢以來録以為龜厯梁劉孝儀上毛龜表元蔡赤文表軒皇之政神龜青純彰姬公之德堯則赤文而朱字周有青純而蒼光爾雅注河圖曰靈龜負書丹甲赤文史記龜䇿傳龜千嵗乃逰蓮葉之上神龜出於江水中廬江郡常嵗時生龜長尺二寸者二十枚輸太卜官龜千嵗乃滿尺二寸萬畢石朱方傳曰有神龜在江南嘉林中巢於芳蓮之上左脅書文曰甲子重光卜以造三周龜祝曰假之玉靈夫子索隱曰尊神龜而為之作號書中候堯沈璧於洛元龜負書赤文朱字沈璧於河黒龜出赤文周公攝政七年成王觀於洛沈璧禮畢有元龜青純蒼光背甲刻書上躋於壇赤文成字周公寫之樂記青黒緑者天子之寶龜書禹貢九江納錫大龜顔師古曰尺有二寸大誥寜王遺我大寶龜宋志禹卑宫室靈龜見天與禹洛出書神龜負文列背而出孫惠龜賦有緇衣之大夫衣玄繡之衣裳魏曹植神龜賦懼沈泥之逄殆赴芳蓮以巢居湯黑龜宋志湯至於洛沈璧黄魚雙踴黑鳥隨魚止壇化為黑玉又有黒龜並赤文成字王者德至淵泉則洛出龜書湯黄魚出壇詩正義中候湯沈璧洛水黄魚雙躍出濟於壇化為黑玉周魚入王舟詩思文疏中候合符后云魚長三尺赤文有字題之目下授右董仲舒傳天瑞應誠而至書曰白魚入於王舟有火復於王屋流為烏注今文泰誓此葢受命之符也周公曰復哉復哉武王九年祭於畢觀兵於孟津祭中流白魚躍入王舟王俯取以司馬相如傳周躍魚隕杭休之以燎終軍傳昔武王中流未濟白魚入於王舟俯取以燎羣公咸曰休哉白魚登舟順也象征而必獲周青純龜公羊傳龜青純注千嵗之龜青髯瑞應圖尚書中候周公時神龜青純赤字漢周餘龜司馬相如傳獲周餘放龜於岐洞冥記元封二年數過國獻能言龜史記樂書青黑緣者天下之葆龜也漢神魚舞河宣紀神爵元年三月行幸河東詔曰東濟大河天氣清静神魚舞河漢海效鉅魚宣帝詔武帝躬仁義厲威武上天報況海效鉅魚郊祀歌河龍供鯉醇犧牲漢神魚宋志章帝元和三年正月車駕北巡以太牢具祠北岳見黄白氣有神魚躍出十數管仲曰古之封禪東海致比目之魚爾雅謂之鰈魏神龜魏畧文帝初神龜出靈芝池魏丹魚五采魚見上魚生廟鼎魏都賦丹魚生沼注延康元年赤魚見於太原郡王肅賀瑞表祖廟文昭廟魚生於鼎易中孚彖曰信及豚魚德及魚則無所不及唐靈龜貞觀十九年二月岳州獻毛龜二玄宗先天二年八月江州獻靈龜六眸腹下有元文象卦文開元二十四年八月戊申常州有神龜見緑毛黄甲大厯八年七月乙未蓬萊池獲毛龜出示百僚壬寅金天門外水渠中獲緑毛龜天寶元年正月戊申安西都䕶田仁琬於于闐東玉河獲瑞玉龜一畫以獻蕭穎士千秋節進毛龜云出洛登壇青文丹甲之瑞翠毛金介爍日霏烟憲宗元和元年八月庚戌荆南獻毛龜二詔祥瑞不得上間宋志神龜王者德澤湛清則出五色鮮明三百嵗㳺於蕖葉之上三千嵗常游卷耳之上明於吉凶宋文帝三獲白龜大明四年六月壬寅幸藉田白龜見於千畆泰始二年八月丙辰朔四眼龜見㑹稽六年九月己巳呉興獻八眼龜齊永明五年六月建城獲四目龜八月延陵獲六目龜又永明中有獻青毛神龜一梁天監五年四月丙申始豐獲八目龜後魏裴莊等上神龜頌獨孤申叔資州獻白龜賦皇帝在位十五載西人獻異龜於王庭孟津之鱗越裳之雉周存瑞龜游宫沼賦序云十一年秋七月旬有一日龜游内池甲耀金毛文滋六彩文薦九疇兆成三吉六眸在首五色成文玄甲繡裳唐赤鯉景龍三年春正月玄宗至於襄垣漳水有赤鯉騰躍聖皇之瑞也潘炎賦曰魚在在藻躍於中流吾君戾止樂我王游惟赤鯉之呈祥殊白鱗之入舟非竹箭之危湍無聞㸃額同昆明之望幸匪為吞鈎豈其為祥必河之鯉用表皇族克繁帝祉頳鱗耀彩碧水無波周文之時躍於沼漢宣之代舞於河豈徒鏤甲葺鱗下沿上泝唐魚銘神魚見十九瑞開元二十一年二月衢州獲魚有銘侍中裴光庭等奏賀曰魚龍為圖河洛所出比之盛時彼何足云張九齡賀瑞魚銘曰魚為龍象既彰受命之元銘作人文更表錫年之永崇文目異魚圖五卷唐白龜韓愈賀表鄂岳進白龜獲龜者獲蔡也白者西方之色必擒其帥而得地聖德所施靈物來效太平之運其在於今乾德神龜雍熈白龜祥符瑞龜乾德四年和州進緑毛龜作神龜曲雍熈中蘇州貢白龜作白龜曲至道三年真宗即位五月癸酉蘇州貢白龜一緑毛龜一甲戌壽州貢緑毛龜一帝曰龜有毛者文治之兆祥符二年四月甲戌宜聖殿池獲緑毛龜示輔臣上作七言詩近臣和四年七月甲申賜晏穎出身穎獻文藁十巻上嘉其宫沼瑞龜賦召試三題而命之祥符九年荆門獻之詳見御詩五年三月庚辰兖州獻金色龜一四月辛酉後苑池中獲緑毛龜上作七言詩閏十月己丑新州獻盧江六眼龜七年正月丙辰明州獻青毛金文龜一丘遲賀毛龜啓玄甲應於姬渚青髯符於夏室藏采千載獻狀一朝寶瑞開圖珍祥異諜懷星抱月負字銜書吳淑賦負河圖之八卦標禮經之四靈齊永明中有獻青毛神龜一禮統神龜之象上員法天下方法地皆有盤法丘山元文交錯成列宿運轉應四時禮斗威儀君乗水而王江海著其象龜龍被文而見運斗樞瑶光星散為龜星經天龜五星南漢中雍熈緑龜見御詩六眸龜見後至道元年七月丁巳永州言零陵得六眸龜一以獻詔示近臣祥符九年九月戊子遼州獻白兔荆門軍獻緑毛龜詔申諭諸路自今祥異勿復來貢嘉祐八年十月鼎州芝草叢生下得異龜名符在沼瑞應巢蓮戴記以在宫沼為王者難致之瑞墨子夏后鑄鼎於昆吾灼白若之龜蠶漢野蠶成繭古今注元帝永元四年東萊郡東牟山有野蠶為繭光武紀建武二年野蠶成繭被於山阜人收其利吴都賦國稅再熟之稻鄉貢八蠶之緜交州記曰一嵗八蠶出日南唐野蠶成繭緑蠶蠶四熟武德五年四月梁州野蠶成繭貞觀十二年滁州言野蠶成繭徧於山阜九月楚州言野蠶成繭紀貞觀二十年是嵗滁豪二州野蠶成繭十三年是嵗滁州野蠶成繭十四年六月滁州野蠶成繭十三年野蠶又食槲葉成繭其色綠凡收六千五百七十石十四年六月又收八千三百石文宗開成二年十月陳許奏野蠶自生桑上三遍成繭連綿九十里百姓以為絲綿紬絹代宗大厯五年九月太原奏文水縣冬蠶成繭尹思正治青州有績蠶至嵗四熟路敬潜以為善政致祥天寶元年九月益州獻三熟蠶繭宋野蠶成繭乾德四年八月京兆府野蠶成繭節度使呉廷祚緘絲以獻纎潤可愛開寶七年齊州奏野蠶成繭二萬枚五月開封封丘民家蠶簇有繭成被廣五尺長倍之七月陽武縣野蠶成繭九月長葛縣桑蠶成繭咸平二年七月庚戌開封獻野蠶絲祥符元年五月丙戌内出酸棗民程矩家蠶自成被付朝堂示百官輕黄宻綴非人力可及五年五月藤州鐔津縣野蠶成繭是州不産蠶此食山柘而成州緘絲以奏六年六月藤州山柘蠶成繭七月京兆野蠶成繭八月亳州桑蠶成繭奉祀使丁謂繰絲并絮以奏景祐四年五月庚申滑州言靈河縣民家蠶自成被長二丈五尺廣四尺上以為祥賜其家茶綵嘉祐五年十月深州言野蠶成繭被於原野石州嘉禾合穗紹興二十二年五月容州奏野蠶成繭宋元嘉十六年宣城宛陵野蠶成繭彌漫林谷大明三年五月癸巳宛陵生野蠶三百餘里呉黄龍三年夏野蠶成繭漢志雜占有相蠶十三卷崇文目農家淮南王蠶經三卷孫氏蠶書二卷至道元年五月十九日同州馮翊民李元真獻蠶經一卷留春禁中禹貢兖州桑土既蠶青州篚檿絲山桑酓史記云絲禹敷兖土叙文篚於既蠶周述豳風首懿筐於載績桑壇蠶館園客之絲列仙傳繭大如盆氷蠶之繭拾遺録東海圓嶠山有氷蠶五色絲織為文錦展北郊之禮趨南陌之功仙蠶曳繭美稼抽芒崔融表扶桑貢絲梁四公記扶桑國貢黄絲三百斤成匪婦功不假柔桑之育化由天造奚煩燠室之居或類八綿不資三灑周禮馬質注蠶書蠶為龍精月直大火則浴其種漢書繭不蠶自成荀子揚泉有賦占之五泰唐張良器海人獻氷蠶賦自堯年而效美願充垂拱之裳被阜以生漢庭熙洽食槲而化唐室隆平異呉都之八蠶侔園客之五色玉海卷一百九十九
