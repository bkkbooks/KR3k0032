body:
  text: 玉海卷九十四宋王應麟撰郊祀北郊后土祭祀禮必以象類故祀天於南祭地於北周祀北郊祭地方澤禮大宗伯以黄琮禮地牲幣放器之色注禮地以夏至謂神在崑崙者也祭大示帥執事而卜日疏曰祀大示謂夏至祭地於方澤凡以神仕者以夏至日致地示典瑞兩圭有邸以祀地旅四望注謂所祀於北郊神州之神疏神州既與郊相對宜用三隂之月當七月祭之大宰祀大示則掌百官之誓戒與其具修大祝凡祭示則執明水火而號祝大司樂乃奏大蔟歌應鍾舞咸池以祭地示注地祇所祭於北郊謂神州之神及社稷云云於澤中之方丘奏之樂八變則地示皆出注地祇則主崑崙先奏是樂以致其神禮之以玉而祼焉乃合樂而祭之疏因下以事地故於澤中牧人隂祀用黝牲毛之注隂祀祭地北郊及社稷也祭法瘞埋於泰折用騂犢疏祭神州地祇於北郊曲禮疏地神有二歲有二祭夏至之日祭崐崘之神於方澤一也夏正之月祭神州地祇於北郊二也或云建申之月祭之與郊天相對大宗伯疏古尚書説地宗三岱山河海通典王者父天母地故庖犧氏俯而觀法焉顓頊乃命火正黎司地以屬人夏以五月祭地祇殷以六月祭周制夏日至禮地祇於澤中之方丘其丘在國之北禮神之玉以黄琮牲用黄犢幣用黄繒王及尸同服大裘配以后稷凡樂函鍾為宫太蔟為角姑洗為徵南吕為羽靈鼓靈鼗孫竹之管空桑之琴瑟咸池之舞夏日至於方丘奏之若樂八變則地祇皆出可得而禮矣其神州地祇謂王者所卜居吉土五千里之内地名也玉用兩圭有邸牲用黝犢幣用黒繒其壇於北郊築土為壇名曰太折配亦以后稷其樂奏太蔟歌應鍾舞咸池以祭地祇備五齊七獻席槀秸蒲越及雞人呼晨司樂宿懸掌次設次大宗伯攝亞獻並如圎丘王每獻酒皆作樂一終漢汾隂后土祠餘見寶鼎類紀元鼎四年十月幸汾隂十一月甲子立后土祠于汾隂脽上如淳曰汾隂治河之上后土祠合在縣西汾在脽之北西流與河詔曰祭地冀州云云志天子郊雍元狩元年曰今上帝朕親祠而后土無祀則禮不答也有司與太史令談祠官寛舒議天地牲角繭栗今陛下親祠后土宜於澤中圓丘為五壇通典曰方五丈髙六尺亦郊天有五畤故后土為五壇壇一黄犢太牢具已祠盡瘞而從祠衣上黄於是天子東幸汾隂汾隂男子公孫滂洋等見汾旁有光如絳上遂立后土祠於汾隂脽上上親望拜如上帝禮紀元封四年三月祠后土詔曰朕躬祭后土光集靈壇一夜三燭幸中都宫殿上見光其赦汾隂六年三月行幸河東祠后土神光三燭太初元年十二月祠二年三月幸河東祠夏四月詔曰朕用事介山祭后土皆有光應天漢元年三月行幸河東祠后土宣帝神爵元年三月行幸河東祠后土神爵翔集宣帝修武帝故事間歲正月一日至河東祠后土詔曰迺元康四年嘉榖玄稷降于郡國東濟大河天氣清靜神魚舞河幸萬歲宫神爵翔集注晉灼曰黄圗汾隂有萬歲宫五鳳三年三月祠后土詔曰單于稱臣北邊晏然朕郊上帝祠后土神光並見甘露降神爵集甘露二年三月祠后土神光耀燭齋宫元帝初元四年三月幸河東祠后土永光五年三月幸河東祠后土建昭二年三月幸河東祠后土成帝建始元年作長安南北郊罷祠永始三年冬十月庚辰皇太后詔復后土祠四年三月幸河東祠后土揚雄上河東賦曰伊年暮春將瘞后土禮靈祇謁汾隂于東郊因以勒崇垂鴻發祥隤祉元延二年三月幸河東祠后土綏和二年三月幸河東祠后土光武建武十八年二月甲寅西巡狩幸長安三月壬午祠髙廟遂有事十一陵歴馮翊界進幸蒲坂祠后土注漢官儀曰祭地於河東汾隂后土宫宫曲入河古之祭地澤中方丘也以夏至日祭其禮儀如祭天后土祠在今蒲州汾隂縣西北禮樂志武帝定郊祀之禮祭后土於汾隂澤中方丘也郊祀歌帝臨中壇四方承宇清和六合制數以五注此后土之歌后土富媪昭明三光穆穆優㳺嘉服上黄后皇嘉壇立玄黄服物發冀州兆蒙祉福沛施祐汾之阿揚金光橫泰河徧臚驩騰天歌漢武故事帝行幸河東祠后土顧視帝京忻然中流與羣臣飲燕作秋風辭曰汎樓船兮濟汾河横中流兮揚素波括地志后土祠在蒲州汾隂縣北十二里漢舊儀名曰汾葵一曰葵丘隋志王元規議曰案前漢黄圗后土壇方五丈髙六尺漢雒陽北郊魏方丘晉北郊世祖紀中元二年正月辛未初立北郊祀后土志北郊在雒陽城北四里為方壇四陛漢官儀北郊壇在城西北角去城一里通典後漢光武中元二年營北郊祀地祇云云明帝永平二年正月上丁祀南郊畢次北郊魏明帝景初元年祀方丘北郊晉泰始二年并圓丘方丘於二郊成帝咸和八年立地郊康帝建元元年正月辛巳祀北郊齊建元二年正月次辛祀北郊梁制為北郊壇於國之北常與南郊間歲正月上辛祀后土于壇上元魏太和二十年五月丙戌營方澤於河隂丁亥有事方澤後周保定元年正月壬子建德六年五月己丑祀方丘隋開皇三年五月辛酉親祀方澤漢魏北郊齊志蔡仲熊議魏髙堂隆表九日南郊十日北郊十一日明堂十二日宗廟則周禮二漢及魏皆不共日矣王儉議春秋感精符云王者父天母地則北郊之祀應在明堂之先漢魏北郊亦皆親奉晉泰寧有詔未及遵建咸和八年甫得營繕太常顧和秉議親奉康皇遵用今宜親祠北郊明年正月上辛祠昊天次辛瘞后土後辛祀明堂車服之儀率遵漢制南郊大駕北郊明堂法駕詔可永明二年宋志漢文帝初祭地祇於渭陽以髙帝配武帝立后土祠於汾陽亦以髙帝配漢氏以太祖兼配天地未以后配也王莽作相引周禮享先妣為配北郊夏至祭后土以髙后配光武建武中不立北郊故后地之祇常配食天地山川羣望皆在營内凡一千五百一十四神中元年建北郊使司空馮魴告髙廟以薄后配地江左初未立北壇地祇衆神共在天郊晉成帝立二郊天郊則六十二神地郊則四十四神二郊所秩官有其注咸和中議别立北郊同用正月永初三年九月奏髙祖配天郊武敬皇后配北郊明年孟春有事於二郊通典唐賈曾上表郊之於廟俱有禘名禘廟則祖宗之主俱合於太祖之廟禘郊則地祇羣望俱合於圓丘以始祖配享三輔故事漢祭圓丘儀上帝位正南面后土位亦南面而少東東觀漢記云光武於洛陽城南為圓壇天地位其上皆南面西上按兩漢時自有后土及北郊祀而此已於圓丘設地位明是禘祭之儀左傳疏鄭玄注書多用䜟緯言天神有六地祇有二天有天皇大帝又有五方之帝地有崐崘之山神又有神州之神晉泰始初定南北郊祭一地一天用王肅之義唐志梁祭地祇隂陽儀注二卷方丘制度後漢為四陛髙六尺陳宣帝増壇髙二丈二尺隋唐皆為八陛周禮注琮八方象地唐方丘祭神州武德詔書通典唐制夏日至祭皇地祇于宫城北郊十四里為方丘壇因隋制以景帝配神州岳鎮海瀆山林川澤丘陵墳衍原隰從祀地祇用黄犢神州用黝犢孟冬祭神州於北郊景帝配貞觀中髙祖配北郊舊志褚亮作祭神州樂章八首迎送神用順和永徽中廢神州之祀許敬宗奏地分為二請合為一祀乾封初又詔復之㑹要二年五月二十三日詔皇地祇壇依舊置於渭水北二年以髙祖崇配方丘等祀許子儒傳乾封初二年帝已封禪復詔祀感帝神州以正月祭北郊司禮少常伯處俊等奏神州本祭十月以方隂用事也玄説三王之郊一用夏正靈恩謂祭神州北郊以正月願㑹奉常司成博士議子儒等言北郊月不經見漢光武正月建北郊晉成帝咸和中議北郊以正月武德以來用十月請循武德詔書通典奉常博士陸遵楷議云云武德禮令用十月隂用事故於此時祭之太極元年即先天元年正月將有事南郊有司議唯祭昊天賈曽議復設地祇位辛巳祀南郊五月戊寅祭北郊開元二十一年夏日至祀地祇于方丘以髙祖配立冬祭神州于北郊以太宗配周禮典瑞兩圭有邸以祀地注謂所祀於北郊神州之神正義案河圗括地象崑崙東南萬五千里神州是也但三王之郊一用夏正未知神州用何月祭之或解郊用三陽之月神州宜用三隂之月當七月祭之㑹要天寶元年二月二日敕皇地祇宜如南郊合祭二十日合祭天地于南郊大厯十二年八月増修北郊壇齋宫二十五間唐汾隂祠后土張説傳兼紀開元十一年帝自東都將還京正月己巳因幸并州兵部尚書説見帝曰太原王業所基陛下耀威武以伸逺思繇河東入京師有漢武脽上祠願紹墜典為三農祈榖帝納其言二月壬子如汾隂祠后土㑹要通典同開元十二年二月二十二日張説述聖頌亦云十一年此恐誤祠后土汾隂脽上太史奏榮光出河休氣四塞祥風繞壇日揚其光初有司奏修壇掘地獲銅鼎二又獲古甎有篆書千秋萬歲長樂未央字又赤兎見壇側地理志河中寶鼎縣本汾隂開元十年獲寶鼎更名有后土祠舊志十一年祭汾隂樂章十一首韓思復等作曰張嘉貞為壇塲使張説為禮儀使説為握乾符頌汾脽寶鼎見岱宗卿雲蔚紀開元二十年十一月辛丑如北都庚申如汾隂祠后土大赦賜文武官階勲爵諸州侍老帛玄宗製后土祠碑曰脽上祠者本魏地鄈丘之舊漢家后土之宫汾水合河梁山對麓歲在癸亥十一年始有事于兹焉二十年冬勒兵逾萬騎旌旗亘千里校獵上黨至于太原赫威戎於朔陲霈展義於南夏肆覲東后懐柔百神己未師頓于齋宫庚申親祀于后祇聖考在天侑而作主徃者漢氏之祠也牲以飬牛五歲繭栗無所貴其誠藉以采席六重藁秸不得尚其質朕因其地而不因其儀咨故實於方澤不遂過於元鼎於戯享于克誠介以繁祉黄雲蓋於神鼎絳光燭於靈壇自昔已然乃今復見銘曰至哉坤元萬物資生王者母事德合天明彼汾之曲髙脽傑異景象遺光壇塲舊位意多漢武跡在橫汾風流可接簫皷如聞夀宫創制神鼎勒勲㑹要二十年欲幸太原中書令蕭嵩上言十一年祀后土祈榖累歲豐登有祈必報請行報禮十一月二十一日祀后土脽上禮畢刋石祠所上自為文慿休和惠黎獻官志汾祠令一人開元二十一年置景德神州壇三年三月二十七日己巳翰學判太常寺李宗諤言神州地祇壇壝迫隘不合禮文請於黒帝齋宫北别選壇位遂度地徙壇於方丘之西皇祐二年八月三日詔以親饗明堂罷立冬祭神州地祇三年九月十七日詔太常寺皇地祇壇舊制狹小宜如唐郊祀録増廣之國朝因唐制皇地祇祭以夏至作方丘宫城北十四里神州祭以孟冬别為壇於北郊熙寧祀儀祭皇地祇壇八角祭神州地祇壇四十八步髙五尺元豐三年七月二十五日詳定禮文言今變方丘為圜壇神州雖築方壇而復無坎皆不應禮請並為方壇壇之外為坎從之祥符祀汾隂記朝覲壇受朝賀開寶九年詔徙汾隂后土祠於舊廟稍南太平興國四年詔重修后土廟大中祥符三年六月癸丑河中府進士薛南等請車駕躬祠后土七月辛丑文武百僚繼請八月丁未朔詔以來年春有事于汾隂上曰但冀民獲豐穰於朕躬固無所憚戊申以陳堯叟為祠汾隂經度制置使李宗諤副之一本云王旦為大禮使庚戌命晁逈楊億杜鎬陳彭年王曽與禮院詳定祀汾隂儀注乙卯詳定所言請如封禪之禮又言后土壇制度按開元禮及義纂方丘之制八角三成每等髙四尺上闊十六步設八陛為三重壝量地之儀四面開門又為瘞坎於壇之壬地外壝之内依此修築又請造玉冊玉匱金繩金泥酌獻地祇用博安之曲辛未内出脽上后土廟圗令陳堯叟量加修飾九月甲午命宰臣王旦撰祀汾隂壇頌四年十二月乙未王旦上之知樞宻院王欽若撰朝覲壇頌十月甲子翰學晁逈上祀汾隂親謁后土廟樂章十首先是十月己酉令學士院制撰登歌靖安博安二曲己巳命陳堯叟撰親謁后土廟頌堯叟傳詔撰親謁太寧廟頌十二月二十六日詔大官進蔬食宰臣百官繼請御常膳己巳帝因作奉天芘民述以示王旦等四年正月十一日乙酉上親習儀於崇德殿初有司詳定止習壇上儀上并廟庭及封石匱儀等習丁酉備鑾駕儀仗發京師二月癸丑次河中府甲寅以馮起為考制度使趙湘副之丁巳至寶鼎縣奉祇宫有黄雲隨天書輦戊午齋穆清殿先是三年十月庚戌賜寶鼎縣行宫名曰奉祇前殿曰穆清庚申二皷上乘金輅法駕繼進自縣至脽壇夾道設燎周以黄麾仗辛酉上服衮冕登壇祀后土地祇奉天書於左次以太祖太宗配侑親封玉冊玉匱少頃服通天絳紗乘輦至后土廟設登歌奠獻司天監言黄氣繞壇月重輪大角光明羣臣拜舞稱賀詔改奉祇宫曰太寧壬戌御朝覲壇受朝賀肆赦賜酺宴羣臣穆清殿上作汾隂二聖配饗銘建寶鼎縣為慶成軍隷河中府給復二年乙丑丁謂而下以禮成獻歌頌者四十有三人付史館丙寅作汾隂禮成詩賜百官四月甲辰朔至自汾隂丁未作西祀還京歌張師德獻汾隂大禮頌于行在是歲舉進士第一許洞進三盛禮賦召試中書己未詔脽上后土廟上額為太寧大殿周設欄楯壬戌増葺宫廟六年八月丁丑參政丁謂上新修祀汾隂記五十卷詔褒之書目五十卷自降御札訖脽上立御製二聖配饗銘碑目録二卷七年十一月壬辰陳堯叟上汾隂補記三卷史記正義括地志云汾隂故城俗名殷湯城在蒲州汾隂縣北九里漢汾隂縣也后土祠在今縣北十二里國史志汾隂后土故事三卷自漢至唐不知撰人元豐北郊壇詳見郊祀元豐六年五月九日甲申禮部言太常定郊祀之歲夏至親祭北郊及上公攝事儀是年郊天始罷祭地祇七月九日庚申太常定北郊壇制方丘三成每等髙四尺設八陛三壝每壝各二十五步舊壇八角三成今改八角為方壇則其陛為四從之壇髙一丈二尺設四陛七年六月甲戌禮部言方丘樂舞並凖親祠從之元豐三年八月二十七日詔夏至祭地太尉用中書門下攝元祐七年十一月十四日癸巳設地祇位于圓丘合祭紹聖北郊三年正月戊午詔夏至躬祭地祇于北郊實未嘗行六月乙酉詔立北郊齋宫於瑞聖園四年五月禮官定親祀北郊儀注元符元年正月甲戌幸瑞聖園觀北郊齋宫元符中太常少卿宇文昌齡議曰天地之勢以髙卑則異位以禮制則異宜以樂則異數至於衣服之章器用之具日至之時皆有辨而不亂夫祀者自有以感於無自實以通於虚必以類應類以氣合氣然後可以得而親可以兾其格今祭地圓丘以氣非所合以類非所應而求髙厚來享不亦難乎政和祭方澤四年五月十二日丙戌親祭地于方澤六月朔御製夏祭禮成神應記七年五月十四日宣和二年五月十八日丁巳五年五月二十一日親祭陳暘北郊祀典三十卷玉海卷九十四
