body:
  text: 玉海卷六十一宋王應麟撰藝文奏疏䇿唐虞之臣敷奏以言秦漢之輔上書稱奏奏者進也敷下情進于上也周奏事周禮宰夫掌敘羣吏之治以待諸臣之復萬民之逆注復謂於朝廷奏事逆謂上書太僕掌諸侯之復逆注鄭司農云復謂奏事也逆謂受下奏御僕掌羣吏之逆及庶民之復秦奏事漢志春秋類奏事二十篇秦時大臣奏事及刻石名山文七國未變古式言事於王皆稱上書秦初改書曰奏漢高帝時奏事高紀五年高起王陵對注臣瓚曰魏相邴吉奏高帝時奏事有將軍臣陵臣起列傳周昌嘗燕入奏事田蚡為丞相入奏事語移日石建奏事上前屏人言切至公孫弘朝覲奏事因言國家便宜見嚴助傳汲黯武帝坐武帳黯前奏事張湯每朝奏事語國家用日旰天子忘食使兒寬為奏蕭望之疏令公卿大臣朝見奏事明陳其職漢賈山至言賈山傳文帝時言治亂之道借秦為諭名曰至言大槩謂聖主以和顔受諌而興秦以不聞過失而亡時孝文二年冬十一月癸卯日食詔舉直言極諫通鑑綱目賈山上書附是月志儒家賈山八篇漢董仲舒上疏董仲舒傳仲舒所著皆明經術之意及上疏條教凡百二十三篇漢地節羣臣封事漢上封事唐上封事宣紀地節二年五月上始親政事而令羣臣得奏封事以知下情五日一聽事自丞相以下各奉職奏事以傳奏其言魏相傳因許伯奏封事言春秋譏世卿今光死子復為大將軍昆弟諸壻據權勢在兵官宜損奪其權又故事諸上書皆為二封書其一曰副領尚書者先發其副封所言不善屏去不奏相復因許伯白去副封以防壅蔽詔皆從其議又上封事薦張安世宜尊其位為大將軍子延壽領宿衛蕭望之傳地節三年京師雨雹望之因上疏拜為謁者時上初即位思進賢良多上書言便宜輒下望之問狀高者請丞相御史次者中二千石試事滿嵗以狀聞下者報聞或罷歸田里所白處奏皆可霍光傳霍山領尚書上令吏民得奏封事不關尚書羣臣進見獨往來霍氏惡之山雲既歸第張敞上封事列傳趙充國頌營平守節屢奏封章蓋寬饒奏封事劉更生上封事推春秋災異以救今事不宜宣泄臣謹重封上通鑑元帝永光元年谷永三上封事然後得召京房以建昭二年二月朔上封事王嘉封還詔書奏封事諫王章奏封事言日食翼奉上封事又因舉直言極諫奏封事後紀建武以後多因災異令百寮各上封事建武十年三月詔百竂上封事其上書不得言聖光武二建武六年十月丁丑以九月丙寅晦日食七年三月以三月癸亥晦日食明帝一永平八年十月壬寅晦日食既詔羣臣極言無諱於是在位者皆上封事言得失帝覽章深自引咎以所上班示百官章帝一永平十八年十一月甲辰晦日食和帝一永元七年四月辛亥朔日食引見公卿問得失令將軍大夫御史謁者博士議郎郎官會廷中各言封事安帝一建光元年十一月己丑地震順帝一永和元年正月乙卯日變地搖沖帝一建康元年九月地震水涌桓帝二建和元年四月地震延熹五年正月乙亥地震靈帝三建寧元年五月丁未朔日食二年四月雨雹四年二月詔公卿至六百石各上封事傅郭躬章和元年上封事劉儒桓帝時災異求直言儒上封事十條極言得失蔡雍熹平六年詔羣臣各陳政要雍上封事晉武帝太康七年正月甲寅朔日食乙卯詔公卿大臣各上封事元帝大興元年十一月雷雨詔羣公卿士各上封事二年五月大飢十二月大赦並詔百官上封事唐貞觀三年六月以旱蝗詔百辟上封事十一年七月以水災詔百寮上封事八月甲子魏徵奏曰今之封事謗木之流也又見後詔百官言事永徽五年正月以旱詔京文武九品已上及朝集使進封事咸亨元年十月命五品已上上封事開元十四年六月以旱命百官及州縣長官上封事乾元元年四月詔京官九品已上上封事二年三月詔昔公卿面諫令僕陛奏所以下竭其忠上聞其過兩省官十日一上封事直論得失上元二年九月令諫官每月二上封事廣德元年七月同二年三月詔曰為政者宣之使言作事者稽之於衆上封事者宜令尚書省詳議可否大厯八年八月貞元四年正月六年閏四月以旱順宗即位正月元和十五年二月穆宗即位太和元年正月六月開成元年正月一日並詔上封事漢便宜章奏列傳魏相為丞相地節三年六月上書諫擊胸奴元康二年相明易經有師法好觀漢故事及便宜章奏以為古今異制方今務在奉行故事而已數條漢興已來國家便宜行事及賢臣賈誼朝錯董仲舒等所言奏請施行之奏故事詔書凡二十三事又數表采易陰陽及明堂月令奏之引高皇帝所述書相國臣何等議孝文帝時以二月施恩惠頗非時節朝錯為太子家令奏言其狀或有逆賊風雨災變郡不上相輒奏言之相數陳便宜上納用焉蕭望之宣帝思進賢良多上書言便宜張敞為京兆朝廷每有大議引古今處便宜公卿皆服天子數從之杜延年昭帝時吏民上書言便宜有異輒下延年平處復奏匡衡數陳便宜及朝廷有政議傅經以對漢公卿奏議將相論議成帝紀贊公卿稱職奏議可述前胸奴傳河平元年伊邪莫演言欲降下公卿議議者或言宜如故事受降光祿大夫谷永議郎杜欽以為不如勿受對奏天子從之刑法志孝文將相皆舊功臣少文多質論議務在寬厚後祭祀志注東觀書曰永平三年八月丁卯公卿奏議世祖廟登歌八佾舞名東平王蒼議云云章帝賜蒼曰云云公卿議駁今皆并送輿服志注東觀書曰永平二年正月公卿議奏南北郊東平王議曰高祖制長冠入宗廟光武建明堂立辟雍陛下以禮服龍衮祭五帝今祭明堂宗廟圓以法天方以則地服以華文象其物宜天地之禮冕冠裳衣宜如明堂之制蒼傳與公卿共議定南北郊冠冕車服制度後傳陳寵為司空奏議溫粹號為任職相第五倫奏議歸於寬厚宋志侍御史二漢受公卿奏事漢刺史奏事後百官志每州刺史一人諸州常以八月行所部郡國録囚徒考殿最初嵗盡詣京師都奏事中興但因計吏注胡廣曰嵗盡齎所狀納京師名奏事差其遠近各有常會東觀書曰和帝初張酺上言臣聞王者法天熒惑奏事太微故州牧刺史入奏事所以通下問知外事也數十年以來重其道歸煩撓故時止勿奏事今因以為故事臣以為刺史視事滿嵗可令奏事如舊典問州中風俗云云列傳薛宣上疏曰方刺史奏事時宜明申敕翟方進遷朔方刺史再三奏事注師古曰刺史嵗盡輒奏事京師何武為揚州刺史每奏事至京師武奏事在邸宋志嵗終則乘傳詣京師奏事陳遵居長安嘗有部刺史奏事過遵馮野王為上郡太守朔方刺史蕭育奏封事薦言野王漢羣臣書四品胡廣傳文吏試箋奏注漢雜事曰凡羣臣之書通於天子者四品一曰章二曰奏三曰表四曰駁議章者需頭稱稽首上以聞謝恩陳事詣闕通者也奏者亦需頭其京師官但言稽首言下稽首以聞其中有所請若罪法劾案公府送御史臺卿校送謁者臺也表者不需頭上言臣某言下言誠惶誠恐頓首頓首死罪死罪左方下附曰某官臣甲乙上蔡雍獨斷敘漢制有疑事公卿百官會議若臺閣有正處而獨執異意曰駁議其合於上意者文報曰某官某甲議可文選注謝恩曰章陳事曰表劾驗政事曰奏推覆平論有異事進之曰駁兼謂之上書劉協曰漢世善駁則應劭為首晉代能議則傅咸為宗漢名臣奏唐志刑法類漢名臣奏二十九卷隋志三十卷云名臣奏事又有丞相匡衡大司馬王鳯奏五卷陳壽漢名臣奏事三十卷中興書目漢名臣奏二卷一卷孔光元壽二年八月奏篇凡三一卷唐林在新莽時奏篇凡十史記河間獻王傳注引漢名臣奏杜鄴奏文選注引杜鄴奏事霍光傳注臣瓚案杜延年奏藝文志注引漢名臣奏唐林云云蔡雍傳注引漢名臣奏張文上疏文選注引應劭等議漢名臣奏曰張禹奏曰案令丞相奏事司直持案長史將簿中二千石奏事皆與其丞合漢諸王奏事唐志故事類十卷漢南臺奏事唐志刑法類二十二卷隋志無漢字順帝永建元年九月辛亥初令三公尚書入奏事漢白虎殿對䇿成紀兼杜欽等傳建始三年十二月戊申朔日食其夜地震未央宮殿中詔舉賢良方正能直言極諫之士杜欽谷永上對皆以為後宮女寵大盛之咎四年夏上盡召直言之士詣白虎殿殿在未央宮對䇿䇿曰天地之道王者之法六經之義人之行取人之術當世之治各以經對欽永對上皆以其書示後宮唐志永集五卷漢建武以來章奏東平王蒼傳肅宗建初八年正月壬辰詔東平中傅封上蒼自建武以來章奏並集覽焉蒼永平二年議南北郊三年議登歌舞名四年帝欲校獵河內上書諫朝廷有大議驛使問答章帝賜書曰先帝每有著述典義之事未嘗不延問王以定厥中蒼上言廟樂建初元年地震蒼上便宜其事留中帝報書曰丙寅所上便宜三事朕親自覽讀隋志梁有蒼集五卷漢公車章奏王符傳公車以反支日不受章奏明帝蠲其制劉向云章交公車明帝紀永平六年四月詔間者章奏頗有浮辭尚書宜抑而不省列傳竇融自河西召還京師光武問所上章奏誰與參之曰皆從事班彪所為第五倫為會稽守坐法詣廷尉吏民上書者千餘人顯宗方案梁松事詔公車諸為梁氏及會稽太守上書者勿復受楊仁上便宜十二事顯宗嘉之左雄掌納言每有章表奏議臺閣以為故事陽嘉元年上言郡國舉孝廉請先詣公府文吏課箋奏郎顗順帝時公車召詣闕拜章胡廣察孝廉試以章奏安帝以廣為天下第一蔡雍上封事録所宜施行七事詔問曰宜披露得失具對經術以皂囊封上章奏皇甫嵩上表陳諫有補益者五百餘事史記東方朔至公車上書凡用三千奏牘公車令兩人共持舉其書僅能勝之漢置章御坐周舉傳舉上書言當世得失辭甚切正尚書郭虔應賀等上疏稱舉忠直欲帝置章御坐以為規誡漢魏對議文中子述史篇漢魏禮樂其末不足稱也然書不可廢尚有近古對議存焉注對若淳于俊馬昭日三皇以德化民三王以禮為治議若夏侯玄曰銓衡臺閣上之分孝悌閭里下之分制志典册則幾乎典誥矣諸葛亮十六䇿朝氏志兵家類武侯十六䇿一卷序稱謹進便宜十六事治國君臣視聽納言察疑治民舉措考黜治軍賞罰喜怒治亂教令斬斷思慮陰察陳壽録孔明書不載此䇿疑依託者崇文目同書目文武奇編二卷亮撰魏名臣奏議魏名臣奏魏臺訪議魏志注魏書曰陳羣前後數陳得失上封事輒削其草正始中詔撰羣臣上書以為名臣奏議朝士乃見羣諫事皆歎息焉袁子曰羣談論終日未嘗言人主之非書數十上外人不知君子謂羣於是乎長者通鑑明帝青龍四年十二月癸巳潁陰侯陳羣卒隋志刑法類魏名臣奏四十卷陳壽撰目一卷魏臺雜訪議三卷高堂隆撰南臺奏事二十二卷魏王奏事十卷唐志故事類魏名臣奏事三十卷魏臺訪議三卷文選注引魏臺訪議南臺奏事九卷文心雕龍魏代名臣文理迭興若高堂天文黃觀教學王朗節省甄毅考課亦盡節而知治矣前後漢書注引魏武奏事高紀十年顔注引之三國志注太平御覽引魏名臣奏晉諸公奏便宜五事隋志總集晉諸公奏十一卷傅玄傳泰始中為散騎常侍上便宜五事言農事得失水官興廢又安邊御胡政事寬猛之宜隋太平十二䇿文中子世家仁壽三年文中子王通字仲淹西遊長安見隋文帝帝坐太極殿召見因奏太平十有二䇿尊王道推霸略稽今驗古恢恢乎運天下於指掌矣十二䇿編成四卷房玄齡請習之子曰時異事變不足習也中説述史篇十二䇿行于時則六經不續矣關朗篇十二䇿何先必先正始者也唐詔百官言事紀貞觀三年六月壬午詔文武官言事以旱四年二月丁巳以旱詔公卿言事十一年七月癸未大雨水乙未詔百官言事十三年五月甲寅以旱詔五品以上言事十七年六月甲午以旱詔京官五品以上言事貞觀初導人使諌中書門下及三品官入奏事必使諫官史官隨之諸司皆以正衙奏事及詐李用事奏事官多俟仗下於御座前屛左右密奏御史及待制官逺立俟其退及宋璟為相欲復貞觀之政令對仗奏聞元和中元稹請復正衙奏事永徽元年六月庚辰地震詔五品以上言事四年四月壬寅以旱詔文武官言事龍朔三年八月彗星出戊申詔百寮言事總章元年四月丙辰彗星出詔內外官言事咸亨元年十月庚辰詔文武官言事以旱上元二年四月丙戌以旱詔百官言事儀鳳元年八月庚子詔文武官言事有彗星開元一年正月壬午以關內旱求直諫五年十月甲申命史官月奏所行事十四年六月壬戌詔州縣長官言事三年五月以旱詔諸司長官言得失至德元載十月癸未詔御史諫官論事勿先白大夫及宰相廣德二年十二月乙酉令諫官每日奏事大厯八年九月戊子詔京官五品以上兩省供奉官郎官御史言事十二年四月癸巳詔諫官獻封事勿限時側門論事者隨狀面奏六品以上官言事投匭者無勒副章十四年六月丙午德宗詔六品以上清望官日二人待制元和九年十二月詔刑部大理官朔望入對大和元年五月戊辰罷宰臣奏事監搜大中三年三月詔待制官與刑法官諫官次對唐魏徵諫事諫録時務䇿志雜家魏徵諫事五卷舊志同别集徵集二十卷又時務䇿五卷書目時務䇿一卷凡答問百篇中興書目唐魏鄭公諫録五卷吏部郎中王綝撰集徵諫太宗一百三十事序曰採一作雜聽人謠參詳國典以成此録自諫詔免租賦至太宗臨朝詔羣臣魏徵傳凡二百餘奏無不剴切當帝心諫纍數十餘萬言至君子小人反復言之上疏言十漸帝曰以所上疏列為屛障兼録付史官使萬世知君臣之義􅏽人言徵嘗録前後諫諍語示史官褚遂良帝不悅淳熙十三年讀陸贄奏議終篇六月十三日程大昌奏宣取諫録覽觀詔繕寫以進唐十漸疏魏徵傳貞觀十三年政要同上疏極言曰陛下許臣以仁義之道守而勿失儉約朴素終始弗渝頃年以來寖不克終貞觀初清靜寡欲今索駿馬訪怪珍此不克終一漸也貞觀初護民如子頃奢肆思用人力二漸也貞觀初役己利物比縱欲勞人三漸也貞觀初親君子比狎近小人四漸也貞觀初不貴異物不作無益今難得之貨並進玩好之作無息五漸也貞觀初求士如渴比以一人毁而棄讒佞得行六漸也貞觀初無田獵畢弋之好數年後馳騁為樂七漸也貞觀初羣情上達今忠欵不申八漸也貞觀初孜孜治道比恃功業之大負聖智之明無事興兵九漸也貞觀初矜育撫寧比關中勞弊十漸也疏奏帝曰朕今聞過矣願改之以終善道方以所上疏列為屏障庶朝夕見之兼録付史官使萬世知君臣之義通鑑貞觀十三年旱甲寅詔五品以上封事徵上疏以為比貞觀初漸不克終者凡十條唐諫苑諫林隋諫苑唐志雜家齊何望之諫林十卷隋志五卷宋虞通之善諫二卷儒家于志寧諫苑二十卷舊志雜家三十卷庶貞觀中志寧為太子右子撰諫苑以諷太子太宗大悅王方慶諫林二十卷宋書元徽元年七月丁丒散騎常侍顧長康長水校尉何翌之表上所撰諫林上自虞舜下及晉武凡十二卷隋樂運字承業常願處一諫官從容諷議乃發憤録夏殷以來諫爭事集而部之凡六百三十九條合四十一卷名曰諫苑奏上之文帝覽而嘉焉唐九諫書安邦䇿志别集郭元振九諫書一卷安邦䇿一卷又集二十卷兵書類定遠安邊䇿三卷唐姚崇十事開元升平源先天二年十月癸卯即開元元年講武新豐召同州刺史姚崇至咨天下事帝曰卿宜遂相朕崇知帝鋭于治先設事以堅帝意因跪奏願以十事聞度不可行臣敢辭政先仁恕不幸邊功法行自近宦官不預政租賦外絶貢獻戚屬不任臺省接大臣以禮羣臣得犯忌諱絶道佛營造推此監戒為萬世法帝曰朕能行之翌日甲辰拜兵部尚書同三品吳兢撰開元升平源新史采入本傳通鑑不取集志崇十卷志小説類陳鴻開元升平源一卷書目吳兢撰開元升平源一卷以開元之治基於用崇也唐平戎十八䇿王忠嗣傳唐時議元結上三篇宋朝种放十三篇唐陸贄奏議翰林奏草中書奏議志陸贄議論表疏集十二卷又翰苑集十卷韋處厚纂權德輿序曰公字敬輿吳人公之秉筆內廷也論思納獻巨細必陳則有奏草七卷其在相位也推賢與能舉直錯枉則有中書奏議七卷今五卷又詩文賦集表狀為别集十五卷陸贄奏議十二卷始於論兩河淮西利害終於論兼并之家重於公稅元祐八年五月癸未講讀官臣軾希哲安詩稷彥若祖禹大臨上言伏見唐宰相陸贄論深切於事情言不離於道德智如子房而文則過辨如賈誼而術不疏德宗以苛刻為能而贄諫之以忠厚德宗以猜疑為術而贄勸之以推誠德宗好用兵而贄以銷兵為先德宗好聚財而贄以散財為急至於用人聽言之法治邊馭將之方罪己以收人心改過以應天道去小人以除民患惜名器以待有功可謂進苦口之藥石針害身之膏肓欲取奏議校正進呈淳熙八年六月壬寅有旨進讀陸贄奏議七月丙子令日讀五板十三年三月癸卯令每讀以半帙為率侍讀蕭燧等言德宗親聞贄言而棄之如土梗陛下追誦贄語而寶之如元龜是年讀陸贄奏議終篇崔端詩上所集唐陸贄奏議總要二卷刪取可行之要始於君道終於兵事其推明致理之原可以法其指陳當世之失可以監呂祖謙文鑑奏疏八册命崔端詩刪定唐名臣奏議集唐名臣奏諫諍録志吳兢唐名臣奏十卷崇文目七卷馬揔奏議集三十卷揔集類會要元和十二年馬揔集武德至貞元奏議二十卷中興書目名臣奏議集二十卷崇文目同唐州刺史馬揔集唐羣臣奏疏論議分二十六門各載其爵里及論事之意本末於篇首崇文目唐諫諍集十卷唐直臣諫奏七卷張易纂諫書八十卷兩朝志唐奏議駁論一卷孟蜀趙元拱纂唐諫諍録通鑑考異引元拱唐諫諍集唐李絳論事集李絳傳所論事萬餘言其甥夏侯以授蔣偕次為七篇志别集李絳論事集三卷蔣偕集又集二十卷劉禹錫為序書目李司空論事七卷元和中論諫共數百事大中中史官蔣偕編次志云三卷數不同者志之誤也元豐中郭逢原為後序書凡七卷偕之序及列傳俱以為七篇篇即卷也偕序謂生平論諫凡數十百事今存于世者曰李司空論事集七卷凡七十事云卷一之三揔二十七事卷四之七揔四十有三事安國寺碑之諫得賢興化之對進厯代君臣之事迹論中尉出征之踰制請旱損百姓之放租皆致治之良規也留栁公綽論白居易釋鄭絪之非漏言辨裴均之進銀器論裴武之使鎮州皆賢哲之明辨也鎮州澤潞之事宜茂昭易定之區畫延州魏博之事振武營田之益此又御下服遠之長䇿也曰李錡財産請代租稅曰請驛遞赦書以至論祭器論任賢金鑾之事然也舊例進奉之有無官給斛斗之或闕版曹之事然也自論元義方論太平以至惜官之對不同於他相採擇之非警悟於君上既見於任輔弼之時論開納諫諍論塞上河曲及北邊之事宜復形於解機政之後論下邽五坊敕使與夫進鷂子之事不能自已於為刺史之日通鑑考異引之唐元和制䇿志揔集類三卷元稹獨孤郁白居易崇文目同元和元年四月丙午䇿試制舉之士稹郁居易及蕭俯沈傳師出焉稹拜左拾遺即日獻教本書數月間上封事六七志别集劉蕡䇿一卷大和二年唐策林志揔集周仁瞻古今類聚策苑十四卷五子䇿林十卷集許南容而下五人策問隋志䇿集一卷殷仲堪撰宋元嘉策孝秀文十卷梁有孝秀對策十二卷唐王起寫宣志詔令類王起寫宣十卷王起傳帝嘗以疑事令使者質起具榜子附使者上凡成十卷號曰寫宣他撰集亦多唐故事中書舍人掌詔誥皆寫兩本一為底一為宣崇文目有宣底八卷五代史云讀梁宣底見敬李為崇政院使建隆轉對淳化次對建隆三年二月甲午二十三日內出御札曰內殿起居文班朝臣及翰林學士以次轉對指陳時政闕失明舉朝廷急務事有要切許非時上章一云詔常參官每五日以次轉對八月癸酉以次對章奏下尚書省集官參詳可行者以聞淳化二年十一月丙申朔詔復百官次對唐制百官入閣有待制次對官各舉論本司事興元中詔延英坐日常令朝官三兩人面奏時政得失後唐天成中詔百官每五日內殿起居拜舞訖退遂廢待制次對之官每遇起居日令百官轉對言事長興初停轉對有論奏許非時上言晉天福中詔五日起居以兩人轉對各具實封以聞漢乾祐初陶穀奏停許詣閣門拜章至是始復舊制每起居日常參官兩人次對閣門受其章咸平三年十一月壬午二十一日詔舉行轉對其未預次對羣官詔上章奏事十二月壬子九日詔轉對章疏别録一本留中四年六月壬寅命梁皓薛映共詳中外章疏景德三年四月乙未復詔轉對天聖七年三月二十四日癸未詔曰設制䇿之科復登聞之匭云云令百官依舊儀轉對六月辛卯四日命晏殊孔道輔等看詳轉對章疏及檢院所上封事類次可行者以聞八年九月丙辰六日轉對己遍詔權罷皇祐五年五月二十六日詔兩制兩省臺諫三館帶職省府推判官等次對言事直言無隱治平四年四月辛酉詔學士承旨張方平詳定百官所上封事十一月戊寅四日神宗詔舉舊章轉對十二月一日御史臺言閣門儀制止是百官起居日轉對不載內朝臣詔依儀制十八日詔轉對官增二員起居日令四人轉對熙寧元年上欲采用其言十一月四日以翰林學士司馬光知制誥吳充同詳定轉對封章三年五月九日命三館孫洙等同看詳十三日辛丒命司馬光詳定令中書取旨元祐七年五月十八日吏書王存言文德殿視朝免侍從官轉對專責以朝夕論思之效從之自此止卿監郎官而已紹興二年五月戊子手詔用建隆故事行在百官日輪一人轉對令極言得失八月癸丒詔職事官輪對已周復令轉對五年二月庚子命孫近胡交修編類章疏進入十二月十一日詔侍從免輪對有已見許請對三十二年六月十五日孝宗詔面對班改用三八日先是用一五日二十七日詔百官日輪面對既周復舊楊大雅嘗因轉對上原治十七篇慶厯二年五月甲寅詔三館臣寮上封事及聽請對開寶十䇿太祖幸西都張齊賢以布衣獻䇿于馬前召至行宮問以所言齊賢條陳十䇿一下並汾二冨民三封建四崇孝五舉賢六太學七藉田八選良吏九懲姦十慎刑太祖賜束帛而遣之歸謂太宗曰朕不欲爵之以官異時可使為相咸平初王濟著備邊䇿十五條以獻雍熙諫藪嘉言四年九月五日右拾遺趙昻編諫藪嘉言上之詔直史館趙湘上補政忠言十篇雜家真宗召判宗正寺賜白金二百兩淳化澄清略二年九月庚子王化基為中丞化基慕范滂之志獻澄清略言五事一復尚書省二慎公舉三懲貪吏四省冗員五擇逺官上嘉納實録云十事景德䇿林景德中設賢良方正科錢易擬白居易䇿林十篇上之召赴中書試六論又見針類崇文目五子䇿林十卷見前祥符諫史二年十月己亥賜太常博士石待問緋魚待問集歷朝諫疏曰諫史以進上嘉其勤故有是奬志一百卷三朝奏議書目五卷諫議大夫田錫撰天聖輔弼名對儒術通要經濟樞言元年七月龍圖直學士馮元等上徐州文學劉顔所撰輔弼名對四十卷序曰自西漢迄于周凡十九代君臣問答皆朝廷至務社稷令猷凡四十門并目録共四十一卷亦有位非公卿者兼録之且吳兢撰貞觀政要止述太宗趙瑩著君臣正論惟載唐室多采章疏不純取問答故自歷朝專采名對自漢涉唐至五代攟托數千年間名臣所對有補於治上謂輔臣曰顔書可采其録本備覽觀仍除官奬之庚午命為濟州任城簿六年五月壬子又命為青州觀察推官顔又著儒術通要經濟樞言石介見之恨不得在弟子列康定獻納大典元年九月四日丙辰學士朝宗慤等上大理評事蘇舜賓所集獻納大典百卷集歷代諫爭奏議詔送史館至和章奏簿至和二年八月乙未知諫院范鎮言先朝以御寶印紙給言事官使以時奏上以知得失而殿最之請據今御史諫官見員置章奏簿於禁中時觀省之仍以中書舊所置簿具其言行否每季録付史官建炎元年十二月戊寅詔臺諫論奏自來年正月為首置簿令大臣擇其已施行者編寫進入嘉祐五規嘉祐六年八月十七日知諫院司馬光上保業惜時遠謀重微務實元豐八年六月癸未侍讀呂公著奏十事畏天愛民修身講學任賢納諫薄斂省刑去奢無逸寧宗龍潛時親書公著十事元豐諫林二年五月十四日辛巳太子少師致仕趙槩上所集諌林一百二十卷集古今諫爭事詔奬諭以勸為學老而無斁者置諸坐隅間用究觀御集諫書兩朝志有御集諫書八十卷建炎十議元年六月庚申右僕射李綱入見上十議國是巡幸赦令僭逆偽命戰守本政久任修德紹興宣示陳襄章藁熙寧經筵薦司馬光至鄭俠三十三人紹興元年十一月十九日手詔宣示百辟卿士令各舉所知襄所薦德行言語政事文學皆備紹興進至和嘉祐章疏二十八年冬利路提刑范如圭奏漢胎養令遂纂至和嘉祐名臣乞選建宗室章疏三十六篇囊封以進明年九月甲午右相陳康伯奏曰如圭可謂愛君之至紹興集諫闕年起居郎王居正次前世聽納事為集諫十五卷廣上意乾道章奏籍真宗詔中書置籍記諫官御史之言事行與不行嵗終具奏仁宗時范鎮請禁中及中書密院各置章奏簿上以備觀覽之遺忘下以責大臣之銷注詔中書臺諫官言事簿以時銷注仍録與密院又見上建炎中聖訓曰朕除言官即置一簿考所言多寡此祖宗舊制也司諫趙鼎言四十事己行三十六事即除侍御史紹興五年二月庚子命翰林學士孫近等編類奏疏進呈乾道二年九月祕書少監汪大猷言陛下樂聞忠言內之臺諫外之監司郡守又有輔臣之轉對公車之召見隆寬廣問殆無虛日欲望凡臺諫侍從章奏各置一簿隨所上録之一留禁中時備觀覽或可采付外施行一授大臣使詳閲庶幾言皆底績二十四日甲子詔臺諫章奏置籍以便觀覽五年五月癸亥詔臣寮論事並置籍看詳可行者以聞九年十一月癸巳起居舍人趙師訓請撮其樞要立為篇目繕寫進呈以備乙覽從之孝宗於羣臣章奏取其所當行者疏之小册以示大臣或御便坐則置于香几羣臣皆得就觀又有記事版書其要旨以備遺忘淳熙國朝名臣奏議乾道二年陳確進名臣奏議三十門二十卷五月十八日詔遷秩洪邁為之序淳熙十三年正月一日詔趙汝愚進所纂集國朝名臣奏議君道至邊防終之以總議凡一百五十卷目録五卷始建隆訖靖康因事為目以類分次其序曰觀建隆以來諸臣章奏考尋嵗月蓋最盛於慶厯元祐之際而莫弊於熙寧與紹聖之時陛下嘗命儒臣編類文鑑奏疏百五十六篇猶病其大略俾臣盡獻其書萬幾餘間幸賜紬繹觀慶厯元祐諸臣詞直計從而見效如此熙寧紹聖諸臣言切放逐而致禍如彼可以監矣汝愚言欲擇其精要切治道者每十卷一次投進於間燕賜考詳一本云汝愚以名臣議論次成三百卷擇其中尤切治道者為百五十卷上之孝宗諭宰臣周必大等曰治道盡在此矣洎登樞管敘謝重華宮孝宗曰朕嘗看此書可與資治通鑑並行嘗欲易名其書為治道集蓋用奬諭之語紹熙五年八月寧宗命侍讀京鏜讀名臣奏議又呂祖謙編十卷二百篇國朝中興諸臣奏議李壁編序曰丞相忠定趙公汝愚肇自藝祖以至欽宗凡諸臣所論類而輯之建炎中興無異創業人物之盛不減嘉祐治平一時所言國賴以濟尋訪歷年十僅得其五六裒綴雖未為盡而名公巨人建明之偉者大較具此矣略倣趙公凡例揔為十八門别而彚之又二百門通為四百五十卷凡修德典學之序正家善俗之方事天罪已之誠用賢納諫之公愛惜名器辨别忠邪屏浮侈尚勤約戒苛刻本忠厚上而郊廟禮文詔誥賞罰次而官制職守學校薦舉與夫議獄斷刑阜通財貨消弭盜賊勤恤民隱切於政者靡不具焉而其時最大而莫先者則嘗膽之志未伸興復之義未明如擇將訓兵申警軍實料敵制勝經理邊防曰海道曰江淮荆襄曰川陜地形塞戍守疏密開卷瞭然有同圖繪斟酌損益有裨於今者惟高廟朝謀議莫詳焉故今纂次終於紹興其有繫國家大計生民休戚事已見於前而至孝宗初始定者則仍取後來所論附之逐事之末其是非同異之實不可得而掩也經筵奏下本州録進嘉紹本議淳祐闕年上未有繼嗣吳泳合嘉祐紹興諸臣奏疏共六十三篇分為三卷參考事實疏于下自為説發明之兩漢䇿要六卷陶叔獻纂奏之為筆固以明允篤誠為本辨析疏通為首強志足以成務博見足以窮理酌古御今治繁揔要此其體也若乃按劾之奏所以明憲清國是以立範運衡宜明體要必使理有典刑辭有風軌揔法家之式秉儒家之文不畏強禦氣流墨中無縱詭隨聲動簡外乃稱絶席之雄直方之舉也對䇿者應詔而陳政也射䇿者探事而獻説也漢書注射之言授也對策者顯問以政事古者造士選事考言漢文中年十五年始舉賢良朝錯對策蔚為舉首孝武旁求俊乂對策者以第一登庸公孫弘射策者以甲科入仕兒寬以射策為掌故觀朝氏之對驗古明今仲舒之對祖述春秋武帝即位舉賢良文學之士策凡三道公孫之對簡而未博杜欽之對略而指事又谷永杜鄴直言策玉海卷六十一
