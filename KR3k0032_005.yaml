body:
  text: 玉海卷五宋王應麟撰天文圭景周土圭八尺表識景規周禮大司徒以土圭之法測土深正日景以求地中日南景短多暑北景長多寒東景夕多風西景朝多隂日至之景尺有五寸謂之地中凡建邦國以土圭土其地制其域注鄭司農云夏至日立八尺之表其景適與土圭等謂之地中今潁川陽城為然正義周公度日景置五表今陽城是周公度景之處古跡猶存通卦驗云冬日至立八尺之表日中視其晷是以知用八尺表以晝漏半度景也日至之景尺有五寸鄭氏注云南戴日下萬五千里地與星辰四遊升降於三萬里之中是以半之得地之中正義三光考靈曜云云又曰周公攝政四年欲求土中營王城故以土圭度景馮相氏冬夏致日注冬至景丈三尺夏至景尺五寸典瑞土圭以致四時日月封國則以土地注以致四時日月者度其景至不至以知其行得失也冬夏以致日春秋以致月土地猶度地也封諸侯以土圭度日景觀分寸長短以制其域所封也鄭司農説以求地中故謂之土圭疏通卦驗冬至立八尺之表晝漏半度之表北得丈三尺景若春秋致月之法亦於春秋分於十五日而望夜漏半而度之日景一寸其地千里則一分百里封諸侯無過五百里已下止可言分不合有寸也土方氏掌土圭之灋以致日景以土地相宅而建邦國都鄙玉人土圭尺有五寸以致日注度景至不疏言土圭者謂度土地逺近之圭云致日者於地中立八尺之表於中漏半夏至日表北尺五寸景與土圭等冬至日丈三尺為景至若不依此皆為不至故云度景至不也但景至與不至皆由君政得失而來度之者若不至使君改徳教也云夏日至之景尺有五寸冬日至之景丈三尺者皆通卦驗文大司徒亦云夏日至之景尺有五寸謂之地中度地封諸侯日景一分地差百里五等諸侯取五分景以下匠人建國水地以懸置槷以懸眡以景為規識日出之景與日入之景晝參日中之景夜考極星以正朝夕注於所平之地置八尺之臬以懸正之眡景以正四方日出入之景其端則東西正也又為規識之為其難審也自日出而畫其景端又至日入既則為規測景兩端之中規之規之交乃審也度兩交之間中屈之以指臬則南北正疏以繩懸之於柱之四角四中以八繩懸之其繩皆附柱則其柱正矣然後眡柱之景天文志云夏日至立八尺之表通卦驗亦云立八神植八尺之表臬即表也必八尺者案考靈曜曰從上向下八萬里故以八尺為法也於四角四中故須八神神即懸也𣙗古文臬𣙗柱也注引爾雅在地者謂之臬極星謂北辰易氏解曰夏至日在南陸躔東井去極六十六度有竒而景尺有五寸冬至日在北陸躔牽牛去極一百十六度有竒而景丈有三尺春分日在西陸躔於婁秋分日在東陸躔於角去極九十一度有竒而其景均焉日出於東景在西則識出景之端日入於西景在東則識入景之端兩端既定中屈其所量之繩而兩者相合則地中可驗又慮所規不正復以出入之景與日中之景三者相參故曰參慮所參或偏復以日中之景與極星之度兩者相考故曰考詩定之方中注揆日出入以知東西南視定北凖極以正南北疏公劉傳曰考其日影是也公劉既景迺岡相其隂陽其術則匠人云云屈横度之繩即可以知南北經傳未有以定星正南北者故箋以定為記時隋志周公測晷景於陽城以參考厯紀唐調露元年十一月十一日於陽城得土圭長丈二尺七寸先儒皆云夏至立八尺表於陽城其景與土圭等尚書考靈曜曰日永景尺五寸日短景丈三尺易緯通卦驗曰冬至之日植八尺之表日中視晷景長短以占和否夏至景一尺四寸八分冬至一丈三尺周髀云成周土中夏至景一尺六寸冬至一丈三尺五寸世説注引周髀云夏至北方六千里冬至南方十三萬五千里日中立表則無影矣劉向洪範傳曰夏至景一尺五寸八分冬至一丈三尺一寸四分春秋二分景七尺三寸六分其法治地使平規而圓之立表其中至尺寸之差蓋由南北殊方髙下異勢衆説不得而一也漢魏及宋所都皆别四家厯法候景則齊緯候所陳恐難依據劉向二分之景直以率推非四表候定其長短漢四分魏景初宋元嘉大明厯皆與考靈曜同考靈曜周髀靈憲及鄭玄注周官並云日景於地千里而差一寸案宋元嘉十九年壬午使使往交州測景夏至出表南三寸三分何承天遥取陽城云夏至一尺五寸計陽城去交州萬里而景實差一尺八寸二分是六百里而差一寸也後魏信都芳注周髀四術謂金陵去洛南北畧當千里景差四寸則二百五十里而差一寸也唐開元中太史測景五百二十六里二百七十步而差二寸五釐則康成之言未可據也司馬光日景圖曰日行黄道每嵗有差地中當隨而轉移故周在洛邑漢在潁川陽城唐在汴州浚儀而唐志猶取陽城日晷以為法與漢志不同易氏謂大司徒所謂特四時測景之法堯之授時以中星驗日景獨於仲夏言敬致即致日也致日於尺有五寸之景即求中之法也使天度可以尺寸求則南北可分長短而東西何以取信土圭土其地者倣王國之法定東西南北之埶而已盧肇云周公之為政也土圭致晷周髀作則即句股筭法吳王蕃因鄭衆鄭玄之言用句股之術以求天之里數月令正義鄭注考靈耀云地蓋厚三萬里春分之時地在當中自此地漸漸而下至夏至之時地下遊萬五千里地之上畔與天中平至夏至之後地漸漸而上至秋分地正當天之中央自此地漸漸而上至冬至上遊萬五千里地之下畔與天中平自冬至後地漸漸而下此是地之升降於三萬里之中天旁行四表之中冬南夏北春西秋東皆薄四表而止地亦升降於天之中冬至而下夏至而上夏日道上與四表平下去東井十二度為三萬里鄭四遊之極元出周髀之文考靈曜云正月假上八萬里假下十萬四千里鄭注云夏至日與表平冬至之時日下至於地八萬里上至於天十一萬三千五百里周髀筭經曰陳子曰夏至南萬六千里冬至南十三萬五千里日中立竿測影周髀長八尺夏至之日晷一尺六寸髀者股也正晷者句也從髀至日下六萬里而髀無影從此以上至日則八萬里日光外照徑八十一萬里周二百四十三萬里冬至日晷丈三尺五寸夏至日晷尺六寸冬至長夏至短日晷損益寸差千里大司徒疏武王遷鼎於洛欲以為都周公又度景求地中案書傳云四年建侯衞五年營成周封諸侯但正四方不求土中晏子春秋古之立國南望南斗北戴樞星聘禮注宮必有碑所以識日景引隂陽也續漢厯志厯數之生也乃立儀表以校日景景長而日逺天度之端也日發其端周而為嵗然其景不復四周千四百六十一日而景復初黄帝羲和占日堯敬致正仲夏續漢志記稱大撓作甲子隷首作數二者既立以比日表周十煇禮春官眡祲掌十煇音運之法以觀妖祥辨吉凶一曰祲象鑴監闇瞢彌敘隮想故書彌作迷隮作資注鄭司農云煇謂日光炁也祲隂陽氣相侵象者如赤鳥鑴日旁氣四面反鄉如煇狀監雲氣臨日闇日月食瞢日月瞢瞢無光彌白虹彌天敘雲有次序如山在日上隮升氣想煇光玄謂鑴讀如佩觿之觿謂日旁氣刺日監冠珥彌氣貫日隮虹也詩云朝隮于西想雜氣有似可形想疏一曰祲據以為官首中士二人史二人徒四人十等多是日旁之氣言煇亦是日旁煇光故總以煇言之魯史梓慎云吾見赤黒之祲晉天文志有十煇漢有日旁氣占周文為項燕軍視日服虔曰視日旁氣也漢功臣表引成帝時光禄大夫滑湛日旁占驗崇文目雲氣圖一卷氣象圖一巻占風雲氣候日月星辰上下圖一卷雲氣則候賦占候雲雨賦各一卷博古圖有周雙螭表座漢表座漢太初晷儀靈臺銅表日晷書圭景漢造太初厯立晷儀黄圖長安靈臺有銅表髙八尺長一丈三尺廣一尺二寸題云太初四年造志厯譜有日晷書三十四卷隋志天文有黄道晷景占一卷唐志同梁有晷景記二卷晉樂志炎漢中興明帝表圭景而陳清廟前天文志日陽也陽用事則日進而北晝進而長隂用事則日退而南晝退而短日之南北失節晷過而長為常寒退而短為常燠凡君行急則日行疾君行緩則日行遲冬至短極垂土炭土炭動麈鹿解角蘭根出泉水踊畧以知日至要决晷景晉灼曰蔡邕律厯記候鍾律權土炭冬至陽氣應黄鍾通土炭輕而衡仰夏至隂氣應㽔賔通土炭重而衡低進退先後五日之中後禮儀志日冬夏至隂陽晷景長短之極微風所生也使八能之士或度晷景權水輕重水一升冬重十三兩日有中道月有九行中道者黄道一曰光道光道北至東井去北極近南至牽牛去北極逺東至角西至婁去極中夏至至東井北近極故晷短立八尺之表而景長尺五寸八分冬至至牽牛逺極故晷長景丈三尺一寸四分春秋分日至婁角去極中而晷中景長七尺三寸六分此日去極逺近之差晷景長短之制後百官志注漢官曰靈臺待詔三人候晷景二人候日續厯志章帝晷漏與天相應冬至黄道去極百十五度晷景丈三尺春分去極八十九度少強景五尺二寸三分夏至去極六十七度強景尺五寸秋分去極九十度半強景五尺五寸劉昭注易緯所稱晷景長短不相應冬至丈三尺夏至一尺四寸八分春秋分七尺二寸四分續厯志又曰黄道去極日景之生據儀表也宋志景初日中晷景即用漢四分法是以漸就乖差唐志祖冲之曰四分厯立冬景長一丈立春九尺六寸冬至南極日晷最長二氣去至日數既同中景應等而相差四寸此冬至後天之驗東漢晷漏定於永元十四年則四分法施行後十五嵗也李尋曰日者衆陽之長輝光所燭萬里同晷人君之表也月衆隂之長百里為品千里立表萬里連紀論衡日出扶桑暮入細栁宋土圭梁銅表宋書元嘉二十年何承天以土圭測景知冬至已差三日詔使付外考驗起元嘉十三年畢二十年八年之中冬至之日常與景長之日差校三日月令正義孟春日在營室按三統厯立春日在危十六度正月中日在室十四度元嘉厯立春日在危三度正月中日在室一度宋志承天曰史官受詔以土圭測景考校二至差三日有餘錢樂之奏由來用景初法冬至之日日在斗二十一度以月衝考之在斗十七度半間隋律志梁武鍾律緯云宋武平中原義熙十三年九月送渾天儀土圭云張衡所作張衡曰土圭測影不縮不盈驗渾儀銘題光初四年鑄土圭光初八年作並劉曜所制非張衡也梁表尺即祖暅所算造銅圭景表也隋天文志梁天監中祖暅之造八尺銅表周興嗣為銅表銘其下與圭相連圭上為溝置水以取平大同十年虞􅒠又用九尺表江左景夏至一尺三寸二分冬至一丈三尺七分立夏立秋二尺四寸五分春秋二分五尺三寸九分土圭正景經文闕畧先儒説不明審祖暅錯綜經注以推地中其法曰驗昏旦定刻漏分辰次乃立儀表於凖平之地曰南表立表於南表影末曰中表夜依中表望北極樞而立北表取三表直為地中之正又以春秋二分之日旦始出東方之半體立表於中表之東曰東表日夕日入西方半體立表於中表之西曰西表乃觀三表直者即地南北之中也南戴日下為丹穴北戴斗極為空桐餘見上隋經籍志元嘉二十六年度日景數一巻唐測景臺土圭地理志河南府陽城縣南有測景臺開元十一年詔太史監南宮説刻石表焉㑹要儀鳳四年五月太史令姚元辨奏於陽城測景臺立八尺表夏至日中測景尺有五寸調露元年十一月十一日於陽城周公測景所得土圭長丈二尺七寸髙宗大衍厯議考麟徳已前實録書時厯不書候景渾天二分為東西之中而晷景不等二至為南北之極而進退不齊開元厯所推日度及氣皆直子半之始與祖冲之所筭二百年間輒差一日之數皆合有中氣日度之議日躔之畧例步日躔軌漏之術冬至去極百十七度二十分陽城日晷丈二尺七寸一分夏至去極六十七度四十分晷尺四寸七分春秋分去極九十一度三十分晷五尺四寸三分每氣初日中晷常數不齊測其地二至日晷較長短同者為戴日北度數依陽城術求之訶陵夏至立六尺表景在表南二尺四寸六典天下測景之處分至表凖各有典常司厯掌驗晷景二開元十二年四月十三日壬子於京麗正院定表様審尺寸太史馳驛分往測候集賢注記以二分至之日正午量景長短數年候之乃定還京一行校之陳元景曰以丈尺之術窺天地之大豈可定乎天文志大衍議曰數十里之髙與十里之廣猶斜射之影與仰望不殊今欲憑晷差以推逺近髙下尚不可知况稽周天星步於不測之中又可必乎通典陽城有測景臺開元以陽城測景未中乃於浚儀之岳臺文苑英華范榮測景臺賦據河洛之要創造化之功下壓坤徳上羅乾緯囊括衆巧網羅羣蓺平四氣而正兩儀唐中晷法覆矩圖天文志中晷之法初李淳風造厯定二十四氣中晷與祖冲之短長頗異然未知其孰是及一行作大衍厯詔太史測天下之晷求其土中以為定數其議曰周禮大司徒以土圭之法測土深日至之景尺有五寸謂之地中鄭氏以為日景於地千里而差一寸尺有五寸者南戴日下萬五千里地與星辰四游升降於三萬里内是以半之得地中今潁川陽城是也宋元嘉中南征林邑五月立表望之日在表北交州影在表南三寸開元十二年四月壬子測交州夏至在表南三寸三分與元嘉所測畧同使者大相元太言交州望極纔髙二十餘度㑹要云纔出地三十餘度八月海中望老人星下列星粲然明大者甚衆古所未識迺渾天家以為常没地中者又鐵勒北有骨利幹晝長夜短既夜天如曛不暝夕胹羊胛纔熟而曉蓋近日出没之所㑹要開元十二年四月二十三日壬子命太史監南宮説太史官大相元大等馳往安南武陵蔡蔚等州測候數年還京與一行校之太史監南宮説擇河南平地設水凖繩墨植表以引度之自滑臺始白馬夏至之晷尺五寸七分又南得浚儀岳臺晷尺五寸三分又南得扶溝晷尺四寸四分又南至上蔡武津晷尺三寸六分半大率五百二十六里二百七十步晷差二寸餘而舊説王畿千里晷差一寸妄矣今以勾股校陽城中晷夏至尺四寸七分八釐冬至丈二尺七寸一分半定春秋分五尺四寸五分以覆矩斜視極出地三十四度十分度之四自滑臺浚儀扶溝上蔡武津表視之其北極去地雖秒分微有盈縮難以目校大率三百五十一里八十步而極差一度極之逺近異則黄道軌景固從而變矣比嵗武陵晷以圖測之定氣四尺四寸七分按圖斜視極髙二十九度半差陽城五度三分蔚州横野以圖測之定氣六尺六寸二分半按圖斜視極髙四十度差陽城五度三分凡南北之差十度半其徑三千六百八十八里九十步自陽城至横野武陵大率夏至與南方差少冬至與北方差多又以圖校安南日在天頂北二度四分極髙二十度四分冬至晷七尺九寸四分定春秋分二尺九寸三分夏至在表南三寸三分差陽城十四度三分其徑五千二十三里至林邑日在天頂北六度六分彊極髙十七度四分周圍二十五度常見不隱冬至晷六尺九寸若令距陽城而北至鐵勒之地亦差十七度四分與林邑正等吳中常侍王蕃考先儒所傳以戴日下萬五千里為勾股斜射陽城考周徑之率以揆天度當千四百六里二十四步有餘今測日晷距陽城五千里已在戴日之南則一度之廣皆三分减二南北極相去八萬里其徑五萬里宇宙之廣豈若是蕃之術以蠡測海也通典云用勾股法筭之大約南北極相去纔八萬餘里十三年至岱宗時山下夜漏未盡自日觀東望日已漸髙據厯法晨初迨日出差二刻半今差三刻餘原古人所以步圭景之意將以節宣和氣輔相物宜不在於辰次之周徑其所以重厯數之意將以敬授人時欽若乾象不在於渾蓋之是非若乃述無稽之法於視聽之所不及則君子當缺疑而不議也而或者各守所傳之器以述天體謂渾元可任數而測天象可運筭而闚終以六家之説迭為矛盾誠以為蓋天耶則南方之度漸狹果以為渾天耶則北方之極寖髙此二者渾蓋之家盡智畢議未見能通其説也則王仲任葛稚川之徒區區於異同之辨何益人倫之化哉凡晷差冬夏不同南北亦異先儒一以里數齊之遂失其實今更為覆矩圖南自丹穴北暨幽都每極移一度輒累其差可以别日食之多少定晝夜之長短而天下之晷皆協其數矣昭宗時太子詹事邊岡修厯術服其精粹以為不刋之數也舊書天文志曰一行覆矩圖自丹穴以暨幽都之地凡為圖二十四以考合蝕之分數知定漏之長短今載諸州測景尺寸如左太平御覽交州去洛九千餘里孫悚云立表效景景在表南豈古郡以日南為名者其斯義乎又有比景縣北比二字相似晉太康記河南陽城縣是為土中夏至景尺有五寸南越志日南五月立表望之日在表北景居南山海經長留之山其神白帝少昊居之主司反景淮南天文訓日行九州七舍有五億萬七千三百九里視日出入前表中一寸是寸得一里也隋志梁祖暅曰考靈曜先儒求得天地相去十七萬八千五百里以晷影驗之失於過多王蕃所考校之前説不啻減半蓋近宻乎劉焯云以二至之影定去極晷漏周官夏至日影尺有五寸張衡鄭玄王蕃陸績先儒等皆以為影千里差一寸言南戴日下萬五千里表影正同天髙乃異考之筭法必為不可寸差千里亦無典説今交愛之州表北無影計無萬里南過戴日是千里一寸非其實差請一水工并解筭術士取河南北平地量數百里南北使正審時以漏平地以繩隨氣至分同日度影得其差率里即可知厯志中氣議曰厯氣始於冬至稽其實蓋取諸晷景步軌漏術曰南方戴日之下正中無晷自戴日之北一度乃初數千三百七十九自此起差易通卦驗曰冬至之日立八神植八尺之表日中規其晷之如度者則嵗美民和晷進則水退則旱進尺二寸則月食退尺則日食晷進為嬴晷退為縮呂氏春秋曰審堂下之隂而知日月之行白民之南建木之下日中無影呼而無響蓋天地之中也乾徳司天臺景表見律厯皇祐岳臺晷景新書圭表見天文岳臺今京師岳臺坊地曰浚儀近古候景之所洛誥稱自土是也表長八尺見於周髀厯志載皇祐元年己丑二年庚寅三年辛夘自小雪至立冬氣之盈縮新表測影王朴筭影新法筭影測影長加時早晚岳臺晷影周嵗筭數皇祐初為圭法置於司天監熙寧景表議七年六月二十一日進表影御迎陽門觀沈括上景表議曰步景之法定南北為難臣在本局候景入濁出濁之節日日不同參考舊聞别立新術候景之表三其崇八尺博三寸三寸殺一以為厚圭首剡其南使偏鋭其趺方厚各二尺環趺刻渠受水以為凖以銅為之表之四方墨以為中刻之綴四繩垂以銅丸先約定四方以十二表南北相重相去二尺各使端直三表相去左右上下以度量之令相重如一自日初出則量西景三表相去之度又量三表之端景之所至各别記之至日欲入候東景亦如之長短同相去之疎宻又同則以東西景端隨表景規之半折以求最短之景五者皆合則半折最短之景為比表南墨之下為南東西景端為東西五候一有不合未足以為正既得四方則惟設一表方首表下為石席以水平之植表於席之南端席廣三尺長如九服冬至之景自表趺刻以為分分積為寸寸積為尺為宻室以棲表當極為霤以下午景使當表端凡景表景薄不可辨即以小表副之元豐五年正月二十三日詳定渾儀官歐陽發言至道皇祐之器及影表皆有差謬㑹要紹熙銅表見厯法水臬國史天文志韓顯符造銅候儀之制有九九曰水臬十字為之其水平滿北辰正以置四隅各長七尺五寸髙三寸半深一寸四隅水平則天地凖唐貞觀初李淳風於浚儀縣古岳臺測北極出地高三十四度八分差陽城九分今測定北極高三十五度以為常凖月令正義鄭注考靈曜夏至之日上極萬五千里星辰下極萬五千里故夏至之日下至東井三萬里葉氏曰日仲春在奎十四度仲秋在角五度景居二至長短之中去極俱九十一度隂陽五行書黄帝隂陽神農五行黄帝泰素前志五行家泰一隂陽二十三卷黄帝隂陽二十五卷黄帝諸子論隂陽二十五卷神農大幽五行二十七卷隂陽家黄帝泰素二十篇六國時韓諸公子所作言劉向别録云韓諸公孫隂陽五行以為黄帝之道崇文目黄帝朔書一卷託師曠東方朔太公撰法言或問黄帝終始曰託也黄帝四序堪輿元魏太安四年殷紹上一卷表云先師所注黄帝四序經文三十六卷合三百二十四章言天地隂陽之本撮要為一卷隋志二卷作堪餘唐志五行類一卷又地節堪輿二卷崇文目五行類一卷周禮占夢疏鄭玄荅張逸問案堪輿黄帝問天老事云四月有癸亥十月丁巳為隂陽交㑹云今八會其遺象者案堪輿大㑹有八小㑹亦有八堪輿天老曰正月陽建於寅前漢志堪輿金匱十四卷隋志八㑹堪餘一卷堪餘厯二卷唐志堪輿厯注二卷國史志商紹太史堪輿厯一卷揚雄傳注張晏曰堪輿天地總名孟康曰神名造圖宅書者保章氏注堪輿有郡國所入度非古數也日者傳褚先生載孝武時聚㑹占家有五行堪輿建除叢辰厯天人太一家後漢許慎云堪天道輿地道唐呂才云堪輿經黄帝對天老有五姓之言呂氏春秋羲和作占日尚儀作占月后益作占嵗黄帝式經隋志五行類黄帝式經三十六用一巻曹氏撰唐志同又黄帝岀軍遯甲式法一巻史記正義引六甲孤虚法劉歆七畧云有風角孤虛二十卷唐志黄帝式用常陽經一卷漢志五行有羡門式法二十卷羡門式二十卷史日者傳分策定卦旋式正棊月令正義耕用亥日故云元辰知用亥者以隂陽式法正月亥為天倉又云按隂陽式法丑魚鼈蟹黄帝隂符經唐志神仙家集注隂符經一卷太公范蠡鬼谷子張良諸葛亮李淳風李筌李洽李鑒李鋭楊晟李筌驪山母傳隂符玄義一卷筌號少室山達觀子於嵩山虎口巖石壁得黄帝隂符本題云魏道士冦謙之傳諸名山筌至驪山老母傳其説李靖隂符機一卷韋弘隂符經正卷一卷張果太無傳一卷又辨命論一卷中興書目一卷分上中下篇驪山老母注少室山布衣李筌撰序云得此經於嵩山石壁中不曉其義後至驪山逢一老姥有火生於木禍發必尅之語見上篇因問之姥乃授以隂符玄義隂符經者黄帝之書或云受之廣成子或云受之玄女或云黄帝與風后玉女論隂陽六甲退而自著其事隂者暗也符者合也天機暗合於事機故曰隂符隂符經疏一卷表淑真疏并序有讃沈該注一卷又元譚一卷不知作者上篇觀天之道執天之行宇宙在乎手萬化在乎身天人合發萬化定基中篇動其機萬化安下篇三返晝夜用師萬倍心生於物死於物機在目蔡元定注咸平三年蔡望進新注隂符經八月十八日宋白看詳付史館蔡氏序曰隂符經三百言李筌得於石室中云冦謙之所藏出於黄帝河南邵氏以為戰國時書程子以為非商末則周末世數乆逺不得而詳知以文字氣象言之必非古書然非深於道者不能作也大要以至無為宗以天地文理為數謂天下之故皆自無而生有人能自有以返無則宇宙在手矣筌之言曰百言演道百言演法百言演術道者神仙抱一法者富國安民術者强兵戰勝而不知其不相離也一句一義三者未嘗不備道者得其道法者得其法術者得其術三之則悖矣或曰此書即筌之所為也得於石室者偽也其詞支而晦故人各得以其所見為説耳唐李筌傳驪山老母之言曰此符三百餘言百言演道百言演法百言演術上有神仙抱一之道中有富國安民之法下有強兵戰勝之術分為三章又有六注謂太公范蠡鬼谷張良諸葛亮及筌也繫以正義不言誰作後序中謂出於驪山老母亦間有無主名者畧計太公之言八張良之言九鬼谷六諸葛五范蠡才一見而筌及正義尤詳後有斷章三贊又道士希嚴作贊三十九首可謂備矣程子曰老子言甚雜如隂符經却不雜然皆窺測天道之未盡者也黄庭堅曰隂符出於筌熟讀其文知非黄帝書殷隂陽書禮運坤乾注得殷隂陽之書其書存者有歸藏疏熊氏云殷易以坤為首先坤後乾夏四時之書殷坤乾之説載前王損益隂陽盛衰周龜八命春官太卜以邦事作龜之八命一曰征二曰象三曰與四曰謀五曰果六曰至七曰雨八曰瘳以八命者贊三兆玉瓦原三易連山歸藏周易三夢致觭咸陟之占以觀國家之吉凶以詔救政又見藝術類卜師掌開龜之四兆方功義弓周九簭春官簭人掌三易以辨九簭之名巫更巫咸巫式巫目巫易巫比巫祠巫參巫環注此九巫讀皆當為筮詳見藝術類鄒衍五徳宋志案鄒衍五徳周為火行漢郊祀志騶衍以隂陽主運顯於諸侯注晉灼曰燕昭王築宮師衍故作主運之篇史記始皇推終始五徳之傳張蒼傳公孫臣上書陳終始五徳傳言漢土徳文帝召為博士草立土徳時厯制度注傳謂傳次也家語孔子曰五行用事先起於木王者則之首以木徳其次以所生之行轉相承也郎顗傳孔子曰漢三百載斗厯改憲注春秋保乾圖三百四嵗為一徳五徳千五百二十嵗五行更用注易乾鑿度孔子曰立徳之數先立木金水火土徳各三百四嵗五徳備凡一千五百二十嵗漢隂陽二十一家志隂陽家者流出羲和之官拘者為之牽禁忌泥小數始於宋司星子韋三編次以公檮生終始十四篇傳鄒奭之書公孫發二十二篇鄒子四十九篇衍鄒子終始五十六篇史記騶衍深觀隂陽消息而作怪迂之變終始大聖之篇十餘萬言其語閑大不經推而逺之至天地未生窈㝠不可考而原也乘丘子杜文公各五篇黄帝泰素二十篇韓諸公子作南公三十一篇六國時容成子十四篇張蒼十六篇鄒奭子十二篇閭丘子馮促各十三篇將鉅子五曹官制各五篇周伯十一篇齊人衞侯官十二篇不知作者于長天下忠臣九篇近世平隂人别録云傳天下忠臣公孫渾邪十五篇而以雜隂陽三十八篇終焉不知作者凡二十一家三百六十九篇兵隂陽始於泰壹天一終於辟兵威勝方十六家二百四十九篇圖十卷推刑徳順斗擊因五勝司馬談論六家曰隂陽之術太詳而衆忌諱使人拘而多畏然敘四時之大順不可失也李竒注隂陽之術月令星官是其枝葉也又曰隂陽四時八位十二度二十四節各有教令翼奉曰奉好律厯隂陽之占天地設位垂日月布星辰分隂陽定四時列五行以視聖人名之曰道聖人畫州土建君臣立律厯陳成敗以視賢者名之曰經易有隂陽詩有五際春秋有災異董仲舒推隂陽為儒者宗魏相采易隂陽及明堂月令奏之魏相曰隂陽王事之本羣生之命孟喜得易家候隂陽災變書張衡為隂陽之宗郎顗咎徵最宻隂陽詳宻襄楷善天文隂陽之術春秋繁露有隂陽五篇五行八篇天地隂陽一篇禮記明堂隂陽録見明堂類元帝紀初元三年六月詔安民之道本繇隂陽丞相御史舉天下明隂陽災異者各三人成帝紀陽朔二年春詔曰今公卿大夫或不信隂陽薄而小之所奏請多違時政安帝紀永初二年七月戊辰詔有道術明習災異隂陽之度璇璣之數者各使指變以聞漢五行三十一家四時五行經黄帝五都志五行始泰一隂陽終五音定名三十一家六百五十二卷五常之形氣出於律厯之數而分為一其法亦起五徳終始而小數家因以為吉凶若泰壹二十三卷黄帝諸子論各二十五卷太玄二十六卷三典談論二十七巻諸王子論二十三巻則隂陽之書也若神農大幽二十七卷四時五行經二十六巻隂陽五行時令十九卷文解二十八宿二十八卷則四時五行星宿之書也若務成子十四卷十二典災異應十二巻鍾律災應二十六卷鍾律叢辰日苑二十二巻鍾律消息二十九巻黄鍾七巻則災異鍾律之書也若堪輿金匱十四巻天一六卷泰一二十九卷刑徳七卷風鼓六甲二十四巻風后孤虚二十卷六合隨典二十五卷轉位十二神二十五卷羡門式法及式各二十巻文解六甲十八巻皆五行之數若五音竒胲用兵二十三卷刑徳二十一巻定名十五巻皆五行之音若猛子閭昭二十五卷蓋為五行之學者也通鑑外紀黄帝其師大撓探五行之情占斗剛所建始作甲子甲乙謂幹子丑謂枝枝幹相配以名日漢厯志黄帝起五部注孟康曰五行也黄帝紀治五氣注五行之氣選七命注引劉向尚書五行説漢律厯隂陽占翼奉傳奉治齊詩好律厯隂陽之占上封事曰知下之術在於六情十二律而已王者忌子卯吉午酉詩之為學情性而已五性不相害六情更興廢觀性以厯張晏曰性謂五行厯謂日也觀情以律張晏曰情謂廉正寛大公正姦邪隂賊貪狼也律十二律也又曰易有隂陽詩有五際春秋有災異皆列終始推得失孟康曰詩内傳曰五際卯酉午戌亥也隂陽終始際㑹之嵗有變改之政竊學齊詩聞五際之要十月之交篇知日食地震之效詩正義六蓺論引春秋演孔圖云詩含五際六情汎厯樞云午亥之際為革命卯酉之際為改正辰在天門出入候聽卯天保酉祈父午采芑亥大明詩正義又引詩緯曰陽生酉仲隂生戍仲郎顗云四始之缺五際之戹班固曰漢興推隂陽災異者孝武時有董仲舒夏侯始昌昭宣時則眭孟夏侯勝元成則京房翼奉劉向谷永哀平則李尋田終術假經設誼依託象類億則屢中漢京房易傳詳見易類晁説之曰漢藝文志易京氏凡三種八十九篇隋經籍志有京章句十卷又有占候十種六十三卷唐蓺文志有京章句十巻而占候存者五種二十三巻今其章句亡矣乃畧見於僧一行及李鼎祚之書而其傳者曰易傳三巻積筭雜占條例法一卷或共題易傳四卷而名皆與古不同今所謂京氏易傳者或題曰京氏積筭易傳疑隋唐志之錯卦是也錯卦在隋七卷唐八巻所謂積筭雜占條例法者疑隋逆刺占災異十二卷是也至唐逆刺三巻而亡其九卷元祐八年髙麗進書有京氏周易占十卷疑隋志周易占十二卷是也自古易家有書而無師者多矣京氏之書幸而與存者才十之一尚何誰之師哉辨三易運五行正四時謹二十四氣悉七十二候而位五星降二十八宿其進退以幾而為一卦之主者謂之世竒偶相與據一以超二而為主之相者謂之應世之所位而隂陽之肆者謂之飛隂陽肇乎所配乾與坤震與巽坎與離艮與兑而終不脱乎本以隱賾佐神明者以飛某卦之位乃伏某宮之位謂之伏起乎世而周乎内外參乎本數以紀月者謂之建終終始始極乎數而不可窮以紀日者謂之積含於中而以四為用一卦備四卦者謂之互乾建甲子於初坤建甲午於上八卦之上乃生一世之初一世之五位乃分而為五世之位其五世之上乃為遊魂之世五世之初乃為歸魂之世而歸魂之初乃生後卦之初其建剛日則節氣柔日則中氣其數虚則二十有八盈則三十有六蓋其可言者如此若夫象遺乎意意象乎言則錯綜其用唯變所適或兩相配而論内外二象若世與内若世與外或不論内外二象而論其内外之位或三相參而論内外與飛若伏或相參而論内外世應建伏不論内外而論世建與飛伏或兼論世應飛伏或專論世應或論世之所忌或論世之所生於其所起見其所滅於其所刑見其所生非彰往察來微顯闡幽者曷足以與此前是焦小黄變四千九十有六卦後有管輅定乾之軌七百六十有八坤之軌六百七十有二其知之者將可以語邵康節之易矣説之為京氏易式國史志京房周易律厯一卷題虞翻注乾象新書引京房易傳妖異占漢洪範五行傳論記劉向傳成帝時向校五經秘書見洪範箕子為武王陳五行隂陽休咎之證乃集合上古以来春秋六國災異行事著其占騐凡十一篇曰洪範五行傳論奏之五行傳出尚書大傳後漢志引鄭玄注志劉向五行傳記十一巻唐志同傳隋志洪範五行論十一卷漢光禄大夫劉向注天文類天文洪範日月變一卷洪範占二卷梁有洪範天行星厯四卷五行志景武之世董仲舒治公羊始推隂陽宣元之後劉向治榖梁數其旤福傳以洪範與仲舒錯向子歆治左氏言五行傳頗不同孝武時夏侯始昌通五經善推五行傳傳族子勝下及許商其傳與劉向同唯歆傳獨異是以㩜仲舒别向歆傳載眭孟夏侯勝京房谷永李尋之徒所陳行事舉十二世以傳春秋著於篇本傳賛劉氏鴻範論發明大傳著天人之應夏侯勝傳勝從始昌受洪範五行傳説災異諌昌邑王曰天久隂不雨臣下有謀上者霍光召問勝對在鴻範傳光益重經術士五行志云勝上洪範五行傳光讀之大驚儒林傳許商善為筭著五行論志許商五行傳記一篇李尋傳尋治尚書獨好洪範災異學天文月令隂陽續志應劭董巴譙周並撰建武以來災異尹敏建武二年上疏陳洪範消災之術周磐傳磐學古文尚書洪範五行郎顗傳尚書洪範記曰月行中道移節應期徳厚受福重華留之禮保章氏疏案尚書五行傳隋志濟南伏生之傳唯劉向父子所著五行傳是其本法晉志文帝時宓生創紀大傳其言五行庶徵備矣唐志向為五行傳取五事皇極庶徵附於五行以為八事皆屬五行則八政五紀三徳稽疑福極之類又不能附俾洪範之書失其倫理然自漢以來未有非之者其祥眚禍痾之説自其數術之學孔子於春秋記災異而不著事應蓋謹之也志有蕭吉五行記五卷隋人漢明帝製五行章句於辟雍自講漢五行傳説占應續志五行傳説及其占應漢書五行志録之詳矣應劭董巴譙周並撰建武以來災異今合而論之以續前志注引鄭玄注尚書大傳志又引劉歆傳尚書大傳維王后元祀帝令大禹步于上帝王謂禹也帝舜也步推也令禹推演天道維時洪祀六沴用咎于下是用知不畏而神之怒若六沴作見若是共禦帝用不差神則不怒五福乃降用章于下若六沴作見若不共禦六伐既侵六極其下禹乃共辟厥徳受命休令爰用五事建用王極或作皇極王鄭玄曰五事象五行則極象天也長事一曰貎之不恭是為不肅厥咎狂厥罰恒雨厥極惡時則有服妖龜孽雞禍下體生於上之痾青眚青祥維金沴木次二事曰言言之不從是謂不又厥咎僣厥罰恒陽厥極憂時則有詩妖介蟲之孽犬禍口舌之痾白眚白祥維木沴金次三事曰視視之不明是謂不悊厥咎荼緩也厥罰恒燠厥極疾時則有草妖倮蟲之孽羊禍目痾赤眚赤祥維水沴火次四事曰聽聽之不聰是謂不謀厥咎急厥罰恒寒厥極貧時則有鼓妖豕禍耳痾黑眚黒祥維火沴水次五事曰思心貌木言金視火聽水思土思心之不䜭當為睿是謂不聖厥咎雺厥罰恒風厥極凶短折時則有脂夜之妖夜讀曰液華孽牛禍心腹之痾黄眚黄祥金木水火沴土王之不極是謂不建厥咎瞀厥罰恒隂厥極弱時則有射妖虵龍之孽馬禍下人伐上之痾鄭玄曰夏侯勝説伐宜為代日月亂行星辰逆行維五位復建辟厥沴曰二月三月維貎是司四五月視六七月言八九月聽十十一月思心十二月與正月王極凡六沴之作嵗月日之朝則后王受之嵗月日之中則正卿受之嵗月日之夕則庶民受之其二辰以次相將其次受之星辰莫同是離逢非沴維鮮之功禦貎於喬忿言於訖衆視於忽似聽於怵攸思心於有尤王極於宗始以其月從其禮祭之參乃從其祀禮曰格祀篇名也今亡曰某也方祀曰播讀曰藩國率相行祀其祀也曰若爾神靈洪祀六沴是合無差無傾無有不正若民有不敬事則㑹批之六沴六事之機以垂示我我民人無敢不敬事上下王祀後漢方術傳序箕子之術注箕子説洪範五行隂陽之術孔光對其傳曰六沴之作嵗之朝曰三朝其應至重李尋曰五行以水為本其星元武婺女天地所紀終始所生谷永曰明王正五事建大中則庶徵序於下馬融對策大中之道在天為北辰在地為人君郭璞曰尚書有五事共禦之術京房易傳有消復之救宋五行志九疇陳其義於前春秋列其效於後逮至伏生創紀大傳五行之體始詳劉向廣演洪範休咎之文益備班固斟酌經傳詳紀條流司馬彪纂集光武以來以究漢事王沈魏書志篇闕凡災異但編帝紀又髙堂隆郭景純等據經立辭終皆顯應今皆撰次論序晉志文帝時伏生創紀大傳班固據大傳采仲舒向歆著五行志博通祥變以傳春秋綜而為言凡有三術其一曰君治以道臣輔克忠萬物咸遂其性則和氣應休徵效國以安二曰君違其道小人在位衆庶失常則乖氣應咎徵效三曰人君大臣見災異退而自省責躬修徳共禦補過則消禍而福至隋志易以八卦定吉凶書以九疇論休咎春秋以災祥驗行事漢時有伏生董仲舒京房劉向之倫能言災異顧眄六經有足觀者御覽引五行傳心之大星天王也前星太子也周禮疏案書傳致六極之由皆由身之五事注引五行傳曰六癘作見方五行傳風屬中央雨屬東詩疏引五行傳貌屬木言屬金視屬火聽屬水思屬土盧植封事引五行傳日晦而月見謂之朓蔡邕引範傳晉隱逸傳郭琦博學善五行作天文志五行傳注穀梁京氏易百卷後魏髙允傳敕允集天文災異使事類相從約而可觀允依洪範傳天文志撮其事要畧其文辭凡為八篇漢明堂隂陽志禮十三家明堂隂陽三十三篇古明堂之遺事明堂隂陽説五篇漢大衍玄基王景傳以為六經所載皆有卜筮作事質於蓍龜而衆書錯糅吉凶相反乃參紀衆家數術之書堪輿日相之屬適於事用者集為大衍玄基唐廣古今五行記洪範外傳志五行類竇維鋈廣古今五行記三十卷濮陽夏樵子五行志五巻崇文目同書類穆元休洪範外傳十卷唐五行志考次武徳以來畧依洪範五行傳著災異而削事應慶厯八年十二月壬申命劉羲叟同修唐書天文五行志書目竇維鋈集歴代五行咎變敘其證應類例詳備今本止二十六卷缺水行一門李淳風五行元統一卷雜論五星六曜唐聿斯經志厯筭類都利聿斯經二卷本梵書五巻唐貞元初有都利術士李彌乾將至京師推卜一星行厯知人命貴賤新修聿斯四門經一卷唐待詔陳輔重修徐氏續聿斯歌一卷文殊所説宿曜經一卷不空譯通志雜星厯本朝楚衍明聿斯經劉熙古續聿斯歌一卷六壬釋例序列一卷唐六十家五行志五行類六十家一百六十部六百四十七巻始於史蘇沈思經終於呂才地理經若焦氏易林京氏四時飛候及錯卦逆刺雜占參同契筮占集林新林洞林連山之屬易占之書也若鄭玄注行棊經及太一太游厯元鑑樞㑹賦之屬九宮太一之書也翼奉風角要候王琛六情訣及遁甲開山圖囊中經九星厯八門三竒三元九甲之屬風角遁甲之書也式經有六壬雷公太一之殊堪輿有厯注四序地節之異以厯名則黄帝斗厯大史公萬嵗張衡飛鳥呂才百忌以占書名則師曠東方朔各一卷龜經則栁彦詢世隆至孫思邈六家隂陽書則王璨呂才二家他如七政厯白澤圖黄帝集靈武王須臾淮南萬畢周宣占夢咸著於篇失姓名六十五家袁天綱相書陳恭釗天寶厯至栁璨夢雋二十五家一百三十二巻不著録有金鏡連珠之式金匱絳囊玉帳之經隋志五行二百七十二部合一千二十二卷自黄帝飛鳥厯至相馬經傳曰天生五材廢一不可周官分在保章馮相卜師筮人占夢眂祲而太史之職實總之中興書目八十七家二百八十九卷管子有五行篇後魏崔浩著五行論晉索靖作五行三統正驗論辨理隂陽氣運隋志梁有墨子枕中五行要記一卷唐太一金鏡式經志五行王希明太一金鏡式經十卷開元中詔撰書目開元中希明撰凡十篇集古太一書自太公張良周元宋琨樂産李淳風之説别起太一新厯其術頗精密又引前世事驗著於衆篇唐太一元鑑志五行李淳風太一元鑑五卷太一樞㑹賦一卷元宗注一行天一太一經一卷馬先天寶太一靈應式記五巻李鼎祚連珠明鏡式經十巻開耀中上之葉氏曰太一九宫其説雖出乾鑿度然而以五居中列其一三七九為四旁二四六八為四隅則天地二五之數皆在特虚其十而不見以土無定位寄王於四方與月令中央土獨不舉成數者同義十雖不見而九宮從横錯綜數之皆得十五則土之成數蓋未嘗不具也是在易則謂之五位洪範則謂之九疇唐萬嵗經國厯志五行類司馬驤遁甲符寶萬嵗經國厯一卷驤與弟裕同撰陳恭釗天寶厯二卷天寶中詔定賈耽唐七聖厯一卷黎幹蓬瀛書三巻曹士蒍金匱經三卷並不著録唐遁甲圖志五行類蕭君靖遁甲圖開元奉詔撰卷亡伍子胥遁甲文一卷信都芳遁甲經二卷葛洪三元遁甲圖三卷榮氏遁甲開山圖二卷隋志遯甲正經三卷經十巻遯甲開山圖一卷梁二卷後漢髙獲善天文曉遁甲文選注引遁甲開山圖榮氏解水經注引開山圖六典太卜令凡厯注之用六大㑹小㑹雜㑹嵗㑹除建人神朱震曰遁甲九天九地之數乾納甲壬坤納乙癸自甲至壬其數九故曰九天自乙至癸其數九故曰九地後漢注推六甲之隂而隱遁也今書七志有遁甲經唐隂陽書志五行類呂才隂陽書五十三卷廣濟隂陽百忌厯一卷王璨新撰隂陽書三十卷呂才傳擢太常博士帝病隂陽家所傳書多謬偽淺惡世益拘畏命才與宿學老師刪落煩訛掇可用者為五十三篇合舊書四十七凡百篇詔頒天下才於持議儒而不俚以經誼推處其驗術剟其三篇卜宅葬禄命帝又詔造方域圖及教飛騎戰陣圖㑹要太宗以隂陽書近代訛偽穿鑿拘忌亦多命太常博士呂才及隂陽學者十餘人共加刋正削其淺俗存其可用者貞觀十五年四月十六日己酉撰隂陽書凡五十三卷及舊書四十七卷詔頒行之才為敘質以經史其穿鑿拘忌者才有駁議曰敘宅經敘禄命叙葬書識者以為確論通鑑才與諸術士刋定可行者凡四十七巻貞觀十五年四月己酉書成上之隋志魏髙堂隆雜忌厯二卷百忌大厯要鈔一卷太史百忌厯圖一卷百忌厯術通厯法各一卷史記正義引厯忌釋説文引太史卜書隋文帝令臨孝恭考定隂陽書仁壽二年閏十月甲申詔楊素與術者刋定隂陽舛誤李百藥奉詔定隂陽書元豐校定隂陽書元年十二月二十三日提舉司天監被㫖校定館閣及私家所藏隂陽書置庫藏之編成七百十九卷上之五行生成月令疏鄭注易繫辭云天一生水於北地二生火於南天三生木於東地四生金於西天五生土於中陽無耦隂無配未得相成地六成水於北與天一并天七成火於南與地二并地八成木於東與天三并天九成金於西與地四并地十成土於中與天五并也大衍之數五十有五五行各氣并氣并而减五惟有五十以五十之數不可以為七八九六卜筮之占以用之故更减其一故四十有九也月令注五行自水始火木金次之土為後易隂陽消長天乾四月一變成姤六變成坤地坤十月一變成復六變成乾天風姤五月地雷復十一月天山遯六月地澤臨十二月天地否七月地天泰正月風地觀八月雷天大壯二月山地剥九月澤天夬三月地坤十月天乾四月六卦為隂長陽消六卦為陽長隂消坤初六方一隂積四變而後履霜五變而後堅氷五月一隂始萌而履霜堅氷之理已兆於此不能折姦銷萌待其履霜而後救雖欲堅氷之不至不可得也臨二陽已著八月有凶之戒知臨之必有遯也遯二隂已著君子逺小人之象知遯之必至於剥也後漢方術傳序隂陽推步之學見於墳記然神經怪牒玉䇿金繩關扄於明靈之府封縢於瑶壇之上者靡得而闚也至乃河洛之文龜書之圖箕子之術洪範五行師曠之書今書七志有師曠六篇占災異傳隋志師曠書三卷唐志師曠占書一卷蘇竟云師曠雜事注雜占之書師前書隂陽十六家有曠八篇緯候之部七經緯中候鈐決之符兵法有玉鈐篇六韜要決皆所以探抽㝠賾參驗人區其流又有風角遁甲今書七志有遁甲經推六甲之隂而隱遁也趙彦陳孤虛之法推遁甲七政元氣六日七分逢占日者挺專須臾七志有武王須臾一卷隋唐志二卷孤虛之術蓺文志有風后孤虚二十卷虚吳越春秋計䂱曰孤虚謂天門地户也明於孤乃可量敵越王乃仰觀天文集察緯宿厯象四時在抱朴外篇大公時候説曰從孤擊虚萬人無餘太一玉帳之中不可攻也及望雲省氣推處祥妖時亦有以效於事唐志五行見象於天為五星分位於地為五方行於四時為五徳稟於人為五常用於人為五材播於音律為五聲發於文章為五色而總其精氣為五行鹽鐵論大夫曰五行東方木而丹章有金銅之山南方火而交趾有大海之川西方金而蜀隴有名材之林北方水而幽都有積沙之地此天地所以均有無而通萬物也月令正義四時是氣五行是物氣輕虛麗天物體質凝屬地五行萬物之本也其寓於人者為藏為官為神為竅為事為常而後一身得以生其寓於天地者為時為氣為日為星為方為辰而後百化得以興其寓於物者為形為材為聲為色為臭為味而後萬類得以成五行之説大矣人君所以承天心正九疇熙庶績也少皡以是命五官大禹以是叙彛倫箕子以是陳洪範其用水火木金土其體貌言視聽思其符肅乂哲謀聖其咎狂僣豫急蒙其變妖孽祥眚禍疴質形於地氣行於天氣所行木為先質所生水為首五行分配四時土每時寄王十八日朱氏曰陰陽造化之本不能相無然陽主生陰主殺其類有淑慝之分聖人作易於不能相無者以健順仁義之屬明之而無所偏主至消長之際淑慝之分則致扶陽抑隂之意所以贊化育而参天地其㫖深矣又曰一生水而成六二生火而成七三生木而成八四生金而成九五生土而成十生於陽者成於陰三天兩地也生於隂者成於陽兩地而三天也天以三兼二地以二兼三五位而得合而為五十玉海卷五
