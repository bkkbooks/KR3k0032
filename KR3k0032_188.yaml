body:
  text: 玉海卷一百八十八宋王應麟撰兵捷檄書下唐移檄張士貴張士貴傳隋大業末起為盜攻剽城邑髙祖移檄招之即降唐山南招慰大使徇巴蜀檄通鑑義寧元年十二月癸未唐王淵使左光祿大夫李孝恭招慰山南紀云趙郡公孝恭徇山南自金川出巴蜀檄書所至降附者三十餘州甲辰遣使者詹俊李衮等徇巴蜀下之河間王孝恭傳髙祖巳定京師詔拜山南招慰大使徇巴蜀下三十餘州進擊朱粲破之繇是騰檄所至輒下韋仁壽傳髙祖入關遣使者徇定蜀唐使者徇荆襄髙祖紀義寧元年二月己卯太常卿鄭元璹定樊鄧使者馬元規徇荆襄吕子藏傳云慰輯山南唐大將軍河南道招慰使招諭關東州縣檄夏侯端傳李密之降關東地未有所屬端請假節詔諭乃拜大將軍為河南道招慰使傳檄州縣東薄海南接淮二十餘州遣使順附通鑑武德二年四月甲辰祕書監夏侯端安撫淮左十月端至黎陽李世績發兵送之自澶淵濟河傳檄州縣密以元年十月己卯降撫山東平鄭善果持節為招大使唐參旗將軍諭突厥鄭元璹傳武德二年劉武周將宋金剛與突厥處羅可汗犄角冦汾晉詔元璹諭罷可汗兵不聽唐金州總管府司馬撫樊鄧李大亮傳王弘烈據襄陽詔大亮安撫樊鄧因圖之進擊下十餘城蘇世長與弘烈及豆盧行褒戍襄陽髙祖數遣使者諭降唐晉州道行軍總管檄郡縣裴寂傳武德二年留撫河東飛檄郡縣促入營壘相保唐陜東行臺討王世充檄薛收傳為記室判陜東行臺金部郎中時方討世充收為書檄露布或馬上占辭唐荆州刺史招慰南方嶺南撫慰大使檄馮盎李靖傳蕭銑降江漢列城爭下以功檢校荆州刺史乃度嶺至桂州分道招慰酋領馮盎等皆以子弟來謁南方悉定得郡凡九十六戶六十餘萬通鑑武德四年十一月靖遣使分道招撫諸州所至皆下一本云四年十一月遣安撫大使李靖徇嶺南諸州皆下之明年以靖為嶺南撫慰大使桂州總管七月丁酉隋漢陽太守馮盎承李靖檄帥所部來降嶺南悉平李襲志傳武德初以書諭之偽桂州總管約嶺南酋李光度歸國及銑平嶺南六十餘州皆送欵襲志誘而致云河間王孝恭傳破銑遷荆州大總管又遷襄州道行臺左僕射嶺表未平分遣使綏輯安慰其欵附者四十九州朝廷號令暢南海矣岑文本説孝恭曰若縱兵剽掠恐江領以南狼顧麕驚不如厚撫荆州勸未附陳天子厚惠誰非王人孝恭下令止侵略林士弘傳趙郡王孝恭招慰降循潮二州漢陽郡王瓌傳代孝恭為荆州都督嶺外酋豪數相攻遣使諭威德皆如約不敢亂唐散騎侍郎諭髙麗傳武德初建武再遣使入朝髙祖下書修好後三年七年二月拜上柱國遼東郡王明年新羅百濟上書言建武閉道使不得朝且數侵入有詔散騎侍郎朱子奢持節諭和建武謝罪乃請與二國平朱子奢傳貞觀初髙麗百濟同伐新羅連年兵不解新羅告急帝遣子奢持節諭旨平三國之憾唐襄州道行臺擊輔公祏檄岑文本傳孝恭平荆州以為别駕從擊輔公祏典檄符唐散騎常侍諭馮盎傳馮盎武德五年降授上柱國髙州總管越國公貞觀初或告盎叛盎舉兵拒境太宗發江淮甲卒將討之魏徵曰當懷之以德乃遣散騎常侍韋叔諧喻盎盎遣子智戴入侍五年盎入朝通鑑貞觀元年十月乙酉遣員外散騎侍郎李公掩持節慰諭盎盎遣子入朝唐南會州都督諭黨項黨項傳漢西羌别種貞觀三年南會州都督鄭元璹鐫諭其酋細封步賴舉部降唐中郎將諭吐谷渾吐谷渾傳貞觀八年伏允遣使入朝未還即冦鄯州太宗遣使者責且召伏允以疾為解為子求昏帝召子親迎亦稱疾有詔止昏遣中郎將康處真臨諭唐左衛郎將諭龜兹阿史那社爾傳禽龜兹王遣左衛郎將權祗甫徇諸酋長示禍福降者七十餘城宣諭威信西域傳遣使者諭降小城七百餘唐諫議大夫諭河北魏徵傳為諫議大夫河北州縣素事隱巢者不自安思亂徵曰不示至公禍不可解太宗曰爾行安諭河北道遇李志安李思行傳送京師即貸而後聞唐瀚海都護諭闕泥熟别部傳貞觀中突厥鐡勒部內附即其地為瀚海都護府詔李素立領之於是闕泥熟别部數梗邉素立以為不足用兵遣使諭降夷人感其惠唐岷州都督諭黨項傳膠東郡王道彥貞觀中拜岷州都督間遣入黨項諭國威靈聖厯初靈勝二州黨項誘北胡冦邉詔監察御史陸餘慶招慰喻以恩信唐岐州都督諭吐谷渾傳太宗以劉師立檢校岐州都督上書請討吐谷渾未報即遣使開諭部落多降附列其地為開橋二州黨項酋拓拔赤辭先附吐谷渾亦遣説下之詔赤辭為西戎州都督黨項傳云岷州都督劉師立諭之降唐右衛率府長史召吐蕃鄰國兵檄王元䇿見兵捷破天竺段貞觀二十二年五月唐使者諭思結部張儉傳為朔州刺史李靖既平突厥有思結部窮歸于儉儉受而安輯之儉徙勝州後將奏思結叛朝廷議進討以儉為使者撫納之儉單騎入其部召酋帥慰諭咸歸命因舉徙代州唐遼東道行臺大總管檄髙麗紀乾封元年十二月己酉李績為大總管率六總管兵以伐髙麗元萬頃傳從李績征髙麗管書記使萬頃草檄責髙麗唐監察御史喻雍巖二州李嶠傳髙宗擊雍巖二州叛獠詔監其軍嶠入洞喻降之唐安撫大使喻鐡勒九姓契苾何力傳龍朔初鐡勒九姓叛詔何力為安撫大使以輕騎五百馳入其部喻曰朝家知而詿誤使我貰爾過得自新罪在凶渠取之則已九姓大喜共擒偽葉護及特勒等二百人以歸何力數其罪誅之餘衆遂安唐監察御史諭吐蕃婁師德傳上元初吐蕃盜邉劉審禮戰沒三年九月師德奉使洮河因使吐蕃其首領論贊婆等自赤嶺操牛酒迎勞師德喻國威信開陳利害虜畏悅唐廣州都督檄安南馮元常傳安南酋領李嗣仙殺都護劉延祐劫州縣詔元常討之率士卒航海馳檄先示禍福賊黨多降垂拱三年八月廣桂州都督招慰討擊使諭始安賊裴懷古傳始安賊歐陽倩衆數萬剽沒州縣以懷古為招慰討擊使未踰嶺逆以書諭禍福賊迎降自陳為吏侵而反懷古自至壁撫諭嶺外平武后時唐嶺南採訪使諭崖振五州宋慶禮傳崖振五州首領相掠民苦於兵慶禮身到其境諭首領大誼皆釋仇相親唐監察御史張孝嵩傳檄諸國勒石紀功通鑑開元三年監察御史張孝嵩陳磧西利害請察其形勢枝汗那者古烏孫也內附歲久吐蕃大食共立阿了達為王發兵攻之枝汗那兵敗奔安西求救孝嵩遂帥戎落兵萬餘人出龜兹西數千里下數百城長驅而進十一月攻阿了達于連城屠其三城俘斬千餘級阿了達逃入山谷孝嵩傳檄諸國威振西域大食康居大宛罽賓等八國皆遣使請降勒石紀功而還唐益州大都督長史移巂州蠻蘇頲傳開元八年按察節度劔南諸州巂州蠻苴院與吐蕃連謀入冦獲諜者吏請討之頲不聽移書還其諜苴院羞悔不敢侵邉唐安西副都護兼北廷都護安西北廷節度使諭葛邏祿程千里見獻功類唐常山太守傳檄河北討安祿山一本云衛尉卿兼御史中丞今從通鑑顔杲卿傳祿山表為營田判官假常山太守祿山反與真定令賈深內丘令張通幽定謀圖賊使子泉明計議隂結太原尹王承業為應使平盧節度副使賈循取幽州謀泄祿山殺循時真卿在平原約起兵討賊乃斬李欽湊械賊將髙邈何千年送京師即傳檄河北言王師二十萬入土門遣郭仲雍領百騎為先鋒馳而南望者謂大軍至日中傳數百里賊張獻誠方圍饒陽棄甲走於是趙巨鹿廣平河間並斬偽刺史傳首常山而樂安博陵上谷文安信都魏鄴諸郡皆自固通鑑天寶十四載十二月顔杲卿將起兵馮虔賈深崔安石翟萬德張通幽皆預謀丙午斬李欽湊又禽髙邈何千年千年謂杲卿宜深溝髙壘俟朔方軍至并力齊進傳檄趙魏斷燕薊要膂彼則成禽矣今宜聲云李光弼引步騎一萬出井陘因使人説張獻誠必解圍遁此一竒也杲卿用其䇿獻誠果遁其團練兵皆潰杲卿乃使人入饒陽城勞將士命藁城尉崔安石等徇諸郡云大軍已下井陘朝夕當至先平河北諸郡先下者賞後至者誅於是河北諸郡響應凡十七郡皆歸朝廷兵合二十餘萬又使人入漁陽招賈循唐户部侍郎平原太守河北招討採訪使移清河等郡討安祿山檄顔真卿傳為平原太守天寶十四載安祿山反河朔盡陷獨平原城守具修使司兵參軍李平馳奏時平原有靜塞兵三千益募兵得萬人大饗士城西門衆感動時饒陽守盧全誠濟南守李隨清河王懷忠景城司馬李暐鄴城守王燾各以衆歸有詔北海守賀蘭進明為助從父兄杲卿為常山守斬賊將十七郡同日自歸推真卿為盟主兵二十萬絶燕趙詔拜戶部侍郎佐李光弼討賊十五載三月壬午加河北招討採訪使清河太守使李蕚乞師乃檄清河等郡遣大將李擇交平原令范冬馥等與清河博平士五千屯堂邑穆寧傳調鹽山尉祿山反以劉道元為景城守寧募兵斬之檄州縣並力捍賊真卿以為採訪支使唐揚州大都督府長史淮南節度使移將校檄髙適傳永王叛召計事肅宗竒之除淮南節度詔與江東韋陟淮西來瑱率師會安陸方濟師而王敗未渡淮移檄將校絶永王俾各自白君子以為義而知變通鑑至德元載永王璘領四道節度都使鎮江陵璘募勇士數萬人子襄城王瑒有勇好兵薛鏐等為之謀主以為宜據金陵保有江表如東晉故事十月反丹徒郡上召髙適謀之適具言璘必敗之狀十二月置淮南節度使領廣陵等十二郡以適為之淮西領汝南等五郡以來瑱為之使與江東節度韋陟共圖璘甲辰璘擅引舟師東巡沿江而下軍容甚盛分兵襲李希言於吳郡襲李成式於廣陵進至當塗希言成式遣將元景曜李承慶拒之皆降於璘江淮大震適與瑱陟會於安陸結盟誓衆以討之二載二月戊戌璘伏誅唐中書侍郎同中書門下平章事兼河南節度使都統淮南諸軍事告浙東浙西淮南青州濠州救睢陽檄張鎬傳詔兼河南節度都統淮南賊圍宋州張巡告急鎬倍道進檄濠州刺史閭丘曉趣救張巡傳肅宗詔張鎬代賀蘭進明節度河南率浙東李希言浙西司空襲禮淮南髙適青州鄧景山四節度犄角救睢陽通鑑至德二載八月甲申張鎬兼河南節度采訪等使睢陽士卒才六百人巡逺分城而守時許叔冀在譙郡尚衡在彭城賀蘭進明在臨淮皆擁兵不救城中日蹙巡令南霽雲告急臨淮進明無出師意十月尹子竒久圍睢陽城中食盡巡逺以為睢陽江淮之保障棄之賊必長驅不如堅守鎬聞睢陽圍急倍道亟進檄浙東浙西淮南北海諸節度及譙郡太守閭丘曉起共救之比鎬至城已陷三日十月癸丑陷唐御史大夫江東節度使招諭江淮詳見上韋陟傳永王兵起肅宗委陟招諭乃授云云與髙適淮南節度來瑱淮西節度會安州陟曰今中原未平江淮騷離若不齊盟質信以示四方知吾等協心戮力則無以成功乃推瑱為地主為載書登壇曰糾合三垂剪除凶慝好惡同之毋有異志永王敗初李廣琛從亂非本謀陟表為厯陽太守至是恐有後變乃馳往諭詔恩釋其疑唐天下兵馬副元帥檄河南李光弼傳乾元二年七月辛巳為天下兵馬副元帥以河東騎五百馳東都夜入其軍會滑汴節度許叔冀戰不利思明乘勝西嚮光弼趨東京謂留守韋陟曰不如移軍河陽北阻澤潞勝則出敗則守遂檄河南督軍取戰守備思明至偃師光弼悉軍趨河陽通鑑乾元二年九月思明攻鄭州光弼整衆徐行至洛陽移牒留守韋陟使帥東京官屬西入關牒河南尹李若幽使帥吏民出城避賊光弼率軍士詣河陽為守備唐都統河南節度行營諭回紇詳見兵捷郭子儀傳永泰元年懷恩誘回紇吐蕃入冦召子儀屯涇陽子儀使諭虜曰昔回紇涉萬里助復二京今棄舊好助叛臣一何愚彼背主棄舊於回紇何有唐容管經略使移義藤二州刺史王翃傳大厯中擢容管經略使初安祿山亂詔嶺南兵隸魯炅炅敗衆潰夷獠相挻為亂夷酋梁崇牽號平南都統與别帥覃問合又與西原賊張侯夏永更誘嘯遂據容州經略使僑治藤梧翃出私財募士不數月斬賊帥歐陽圭因至廣州請節度使李勉出兵並力勉不許翃曰願下書州縣陽言以兵為助冀藉此聲成萬一功勉許諾翃乃移書義藤二州刺史約皆進討引兵三千與賊鏖戰卒破賊禽崇牽復容州捷書聞詔更置順州以定餘亂翃凡百餘戰禽首領七十覃問遁去通鑑大厯六年二月王翃復容州分命諸將襲西原蠻復鬱林等州三月五嶺皆平元結傳授容管經略使身諭蠻豪綏定八州唐太常少卿諭吐蕃韋倫傳德宗嗣位充和吐蕃使諭天子威德贊普悅乃入獻唐安州刺史諭隋州伊慎傳攻隋州戰厲鄉斬五千級喻降李惠登希烈使守隋唐神策兵馬使曲環檄李納劉昌裔傳建中中曲環方攻濮州表昌裔為判官為環檄李納剴曉大義環上其藁德宗異之通鑑建中二年七月平盧節度李正己卒子納自領軍務與李惟嶽遣兵救田悅十月徐州刺史李洧以州降十一月納遣將會魏博兵攻徐州洧告急詔朔方大將唐朝臣將兵五千與宣武劉洽神䇿兵馬使曲環滑州李澄救之青魏軍解圍走三年正月納軍于濮陽為河南軍所逼奔還濮州復陷海密三月洽攻納於濮州克其外城納求自新李勉又遣人説之遣判官房説入見上囚説等納歸鄆復與田悅合唐建州刺史發所部兵檄崔造傳朱泚亂造馳檄北州發所部兵二千以待命德宗嘉之錢徽傳辟宣歙崔衍府王師討蔡檄遣采兵會戰唐河東保寧奉誠軍行營副元帥移晉隰慈州檄馬燧傳帝還京興元元年七月壬午德宗至長安李懷光反河中詔燧為行營副元帥與渾瑊駱元光合兵討之時賊黨要廷珍守晉毛朝敡守隰鄭抗守慈燧移檄鐫諭皆以州降通鑑興元元年八月癸卯加渾瑊河中絳州節度使充河中同華陜虢行營副元帥馬燧奉誠軍晉慈隰節度使充行營副元帥與鎮國駱元光鄜坊唐朝臣合兵討懷光先是燧説下三州故使兼領唐西川節度使詔諭雲南通鑑貞元二年吐蕃每入冦常以雲南為前鋒賦斂重又奪其險要地立城堡雲南苦之西川節度使韋臯至鎮招撫羣蠻雲南王異牟尋潛遣人求內附臯奏吐蕃暴亂鹽夏宜因雲南及八國生羌有歸化之心招納之以離吐蕃之黨上乃命臯先作邊將書諭之六月壬辰臯自以書招諭令趣遣使入見四年雲南與吐蕃猜阻歸唐之志益堅五年三月丁亥臯遺異牟尋書稱回鶻屢請佐天子共滅吐蕃王不早定計一旦為回鶻所先則王纍代功名虛棄矣且雲南久為吐蕃屈辱今不乘時雪恥後悔無及十二月壬辰復以書招諭之八年十一月辛酉臯復遺雲南王書欲與共襲吐蕃驅之雲南之外悉平吐蕃城堡築大城於境上置戍相保永同一家九年上賜異牟尋詔書十月甲子臯遣節度巡官崔佐時齎詔詣雲南並自為帛書答之臯傳云間使招徠之臯鑿青溪道以樹羣蠻唐劔南西川節度使檄董嘉慶南蠻傳巂州新安城傍有六姓蠻戎州管內有馴騁浪三州大鬼主董嘉慶纍世內附封歸義郡王貞元中狼蠻請內附補首領浪沙為刺史然卒不出韋臯檄嘉慶兼押狼蠻唐吏部員外郎宣慰使喻徐州李鄘傳張建封卒貞元十六年五月壬子兵亂迫子愔主軍務鄘持節直入其軍大會士喻以禍福唐桂管觀察使御史中丞諭鄰管伐黃賊栁文裴行立奉詔與諸管誅討雍管草賊黃少卿轉牒雍管孔大夫容府楊中丞安南李中丞曰徵側勇冠一方竟就伏波之戮吕嘉威行五嶺終摧下瀨之師敵國盡在於舟中還師已期於席上衆輕鬬蟻勇劣怒蛙恃狡兔之穴馮孽狐之丘賞縣香餌令布疾雷南則浮海濟師共集堂堂之陳東則橫江誓衆用成善善之功唐卭州刺史諭劉闢崔從傳闢反欲並東川從以書諭止唐常州刺史傳檄四州討李錡李錡傳憲宗即位錡不自安請覲稱疾遷延殺留後王淡築石頭城謀據江左通鑑元和二年十月常州刺史顔防用其客李雲謀矯詔稱招討副使殺鎮將李深傳檄蘇杭湖睦四州同討錡湖州辛祕亦殺鎮將紀元和二年十月鎮海節度李錡反乙丑淮南節度使王鍔為諸道行營兵馬招討使以討之癸酉鎮海軍兵馬使張子良執錡乙亥羣臣賀於紫宸殿十一月甲申朔錡至長安上御興安門靣詰之唐司封員外郎知制誥宣諭魏博裴度傳兼紀元和七年十月乙未田興獻魏博六州于朝十一月辛酉帝遣度宣諭遍至屬州布揚天子德澤唐荆南節度使檄羣蠻嚴綬傳為荆南節度溆州蠻張伯靖殺吏據辰錦州連九洞自固紀元和六年閏月辛邜寇費播詔綬進討八年五月癸亥綬勒兵出次遣將齎檄開曉羣蠻遂降八月丁未降唐虞部員外郎諭王承宗殷侑傳承宗叛遣侑招諭承宗聽命裴度傳蔡平承宗懼遣柏耆以左拾遺往脅説乃獻德棣二州納質子又諭滄景程權入覲崔從傳遷尚書右丞往使承宗集軍士宣詔陳逆順禍福之效承宗即上二州符印元和十三年四月甲寅獻德棣唐起居舍人諭成德軍穆宗紀兼柏耆傳元和十五年十月辛巳王承元以鎮趙深冀四州歸有司十一月遣諫議大夫鄭覃往慰成德軍賚緡錢百萬未至軍譁議穆宗遣起居舍人柏耆諭意唐劍南西川節度使諭巂州蠻檄李夷簡傳徙帥劔南西川巂州刺史王顒積姦贓屬蠻怒畔去夷簡逐顒占檄諭禍福蠻落復平元和時唐太原幽鎮宣慰使諭范陽傳云宣諭使溫造傳長慶初劉總上書請覲問行期乃不報造喻意實録元年正月己巳造為宣慰使至范陽開示禍福總懼籍所部九州入朝元年二月己卯也唐鎮州西面行營都招討使諭盧龍檄朱克融傳長慶元年議者請先誅趙赦燕拜克融幽州盧龍節度使明年陷弓髙攻下博與王廷湊共圍深州裴度以檄譙諭克融乃還紀長慶元年八月己丑度為幽鎮招撫使十月丙寅度為鎮州都招討使通鑑長慶二年正月王庭湊圍牛元翼於深州二月丙戌遣中使入深州督牛元翼赴山南鎮裴度亦與幽鎮書責以大義克融即解圍去裴度傳度之行移克融廷湊書開説以大誼帝方憂深州圍欲必出牛元翼使度騰書布旨唐魏博橫海昭義河東義武等軍諭鎮州檄實録長慶元年五月以鎮州殺節度使弘正下詔曰梟音未革狼顧猶存忍害忠良恣為殘賊毁舟楫於鯨鯢啖股肱於蛇豕人神共憤卿士叶謀咸願誅夷用申寃痛尚念一軍之中豈無義勇倉卒變動必非衆謀茍得其魁餘復何罪宜令魏博等軍各出全軍以臨界首仍各飛書檄具諭朝旨開迷復之門廣自新之路唐諫議大夫德州行營諸軍計會使諭兩河諸鎮柏耆傳太和初李同捷反詔兩河諸鎮出兵久無功耆與判官沈亞之諭旨二年十二月丁丑崔弘禮傳時徐泗節度使王智興檄兖海鄆曹淄青當徐道者出車五千乘轉粟饋軍唐劔南東川節度使兼西川節度譙蠻檄郭釗傳太和三年十一月南蠻冦蜀取成都外郛杜元頴不能禦詔釗兼領西川未行蠻衆已略梓州州兵寡釗貽書譙蠻首􅓕巔以侵叛意曰元頴數侵吾圉我以是報乃修好約無相犯元頴傳天子遣使臨撫南詔唐左僕射荆南節度使檄南詔段文昌傳太和四年檢校左僕射徙帥荆南南詔襲嶲州帝以文昌得蠻夷心文昌先為西川節度治寬靜羣蠻震服詔使下檄諭責即日解而去復節度西川通鑑太和五年十月南詔冦巂州六年十一月乙卯文昌節度西川唐劔南東川節度使諭蓬瀘嘉榮諸州蠻檄盧弘宣傳拜東川節度時歲飢盜結酋豪自王聨蓬瀘嘉榮諸州訹蠻落搖動弘宣下檄脅諭賊黨稍降開成中唐刑部侍郎兼御史中丞諭河朔列鎮李回傳會昌中伐劉稹武宗慮河朔列鎮隂相締以撓兵事李德𥙿薦回三年七月持節往諭何弘敬魏博王元逵成德以澤潞邇京洛非若河北三鎮許世以壤地傳子孫者且稹父子無功悖誼理上以邢洺磁三州與河北比境用軍莫便魏鎮且王師不欲輕出山東請公等取三州報天子二將聽命又張仲武盧龍以幽州兵攻回鶻而與劉沔不協回至諭以大義仲武釋然即合太原軍攻潞通鑑會昌二年昭義劉從諫薨稹請為留後李德𥙿曰澤潞近處腹心一軍素稱忠義嘗破朱滔禽從史李抱真成立此軍德宗猶不許承襲頃時多用儒臣為帥劉悟死敬宗方怠於政遂以符節付從諫稹恃河朔三鎮但鎮魏不與之同則無能為也若遣重臣諭元逵弘敬以河朔傳襲已成故事與澤潞不同三州隸昭義者委兩鎮攻之遍諭將士以賊平厚賞則稹必禽矣上命德祫草詔賜元逵弘敬曰勿為子孫之謀欲存輔車之勢但能顯立功效自然福及後昆又賜張仲武詔以回鶻餘燼未滅藉卿禦侮七月遣李回宣慰三鎮令幽州乘秋早平回鶻鎮魏早平澤潞三鎮無不奉詔唐河陽三城節度王茂元檄劉稹李商隱集檄云不思先縠之忠將覆欒書之族願思苦口之言以定束身之計祕喪則於孝未聞拒詔則於忠已失大未侔齊蔡久未及李吳將以其人動於不義恐夙沙之國縛主之卒重生彭寵之家不義之侯更出抱真討逆則義著從史肆邪則衆離儻尚淹歸欵未整來轅戎臣鼓勇以爭先天子赫斯而降怒金玦一受牙璋四馳魏衛壓其東南晉趙出其西北下飛狐之口入天井之關巨浪難防長飇易扇驚地底之鼓角駭樓上之梯橦喪貝躋陵飛走之期既絶投戈散地灰釘之望斯窮自然麾下平生盡忘舊愛帳中親信即起他謀幸思反道敗德之難念順令畏威之易册府元龜云武宗遣諸鎮以書告喻以利病禍福之宜茂元與稹書云云唐朔方節度使移黨項羌史憲忠傳會昌中黨項羌內冦徙朔方有詔馳驛赴屯憲忠辭曰羌不得其心故不自安今亟往知吾為備鬬益健請徐行許之乃移書與羌人示要約羌人皆喜唐刑部侍郎邠寧節度河西供軍安撫使諭黨項畢諴傳入翰林為學士黨項擾河西宣宗召訪邊事諴援質古今條破羌狀甚悉帝悅曰頗牧在吾禁廷卿為朕行乎大中六年六月除諴到軍遣吏懷諭羌人順向十月諴奏招諭黨項皆降唐太原節度諭回鶻諸部韋宙傳宣宗時盧鈞節度太原宙為副時回鶻已破諸部入塞下剽殺吏民宙往自定襄雁門五原絶武州塞略雲中踰句注遍見酋豪鐫諭之約吏不得擅以兵侵諸戎犯者死三部六蕃諸種皆信悅唐劍南西川節度使移南詔驃信檄髙駢傳僖宗以駢節度西川時南詔冦巂州掠成都攻雅州壁盧山聞駢至悉解去駢移檄驃信勒兵從之驃信懼遂質子入朝乾符元年十二月唐鳯翔隴右節度使檢校尚書左僕射同中書門下平章事充京西諸道行營都統傳天下藩鎮檄鄭畋傳廣明元年鎮鳯翔黃巢陷東都僖宗出梁洋遷檢校左僕射西面行營都統中和元年通鑑三月辛酉為京城四面諸軍都統奏以涇原程宗楚為副與程宗楚涇原仇公遇秦州李孝昌鄜延拓拔思恭夏州約盟三月甲子畋傳檄天下藩鎮合兵討賊具官移檄告諸藩鎮郡縣侯伯牧守將吏曰夫屯亨有數否泰相沿如日月之蔽虧似陰陽之愆伏是以漢朝方盛則莽卓肆其姦凶夏道未衰而羿澆騁其殘酷不無僭越尋亦誅夷妖孽之生古今難免代有中正之士力為匡復之謀我國家應五運以乘乾躡三王之垂統綿區飲化區宇歸仁十八帝之鴻猷銘於神鼎三百年之睿澤播在人謠加以政尚寬弘刑無枉濫翼翼勤行於王道孜孜務恤於生靈足可傳寶祚於無窮御瑤圖於不朽近歲螟蝗作害旱暵延災因令無賴之徒遽起亂常之暴雖加討逐猶肆猖狂草賊黃巢奴僕下才豺狼醜類寒耕熱耨不厲力於田疇偷食靡衣務偷生於剽奪結連凶黨驅迫平人始擾害於里閭遂侵陵於郡邑屬以藩臣不武戎士貪財徒加討逐之名竟作遷延之役致令滋蔓纍有邀求聖上愛育情深含弘道廣指萬方而罪已用百姓以為心假以節旄委之藩鎮冀其悛革免困疲羸而殊無犬馬之誠但恣蟲蛇之毒虔劉我征鎮覆沒我京都凌辱我衣冠屠殘我士庶視人命有同於草芥謂大寶易取如奕棋而乃竊據宫闈偽稱名號爛羊頭而拜爵續狗尾以命官燕巢幕以誇安魚在鼎而猶戲殊不知五侯拗怒期分項羽之尸四冢既成待葬蚩尤之骨猶復廣侵田宅濫蓄貨財比溪壑以難盈類烏鳶而縱攫茫茫赤縣僅同夷貉之鄉惴惴黔黎若在狴牢之內人神共怒行路傷心畋謬領藩垣榮兼將相每枕戈而待旦常泣血以忘飱誓與義士忠臣共翦狐鳴狗盜近承詔命會合諸軍皇帝親御六師即離三蜀霜戈萬隊鐵馬千羣雕虎嘯以風生應龍驤而雲起淮南髙相公會關東諸道百萬雄師計以夏初會於關內畋與涇原節度使程宗楚秦州節度使仇公遇等已驅組練大集關畿爭麾隴上之蛇矛待掃關中之蟻聚而吐蕃黨項以久濡皇化深憤國讐願以沙漠之軍共獻蕩平之捷此際華戎合勢藩鎮連衡旌旗煥爛於雲霞劍戟晶熒於霜雪莫不持繩待試賈勇爭先思垂竹帛之功誓雪朝廷之恥矧茲殘孽不足殄除况諸道世受國恩身縻好爵皆貯興邦之略咸傾致主之誠自函洛造氛鑾輿避狄莫不指銅駝而眥裂望玉壘以魂消聞此勤王固宜投袂更希憤激速殄冦讐永圖社稷之勳以報君親之德迎鑾反正豈不休哉時天子在蜀詔令不通檄至逺近咸聳爭發兵應之又見通鑑畋鄭從讜傳鄭以宰相鎮鳯翔移檄討賊兵巢傳云畋傳檄召天下唐東都留守移近鎮檄劉元章傳為東都留守黃巢至寄治河清受偽官悔愧移檄近鎮起兵扞賊唐成德軍節度使同中書門下平章事檢校太尉兼中書令常山王馳檄諸道王景崇傳黃巢反帝西狩偽使齎詔至景崇斬以徇因發兵馳檄諸道合定州處存連師西入關問行在貢輸相踵唐門下侍郎同平章事兼中書令義成節度使諸道行營都統移檄天下通鑑又本傳中和二年守司徒兼門下侍郎同平章事王鐸以髙駢逗撓無心討賊感慨請行正月辛亥為行營都統表崔安潛自副周岌王重榮等六節度為將佐率衛兵洎梁蜀師三萬壁盩厔移檄天下四月鐸將兩川興元軍屯靈感寺涇原屯京西易定河中屯渭北邠寧鳯翔屯興平保大定難屯渭橋忠武屯武功官軍四集先是諸將雖環賊莫肯先及鐸檄至號令殷然士氣皆起黃巢戰數蹙後數月復京師䇿勳居關東諸鎮第一唐諫議大夫諭河中劉崇望傳僖宗幸山南光啓二年王重榮不率職選使者即河中鎸諭使自新崇望以諫議大夫持節往陳君臣大義六月重榮順服請誅朱玫自效通鑑襄王煴遣使至晉陽賜李克用詔克用燔詔囚使者遣使上表移檄進討表至上出示從官并諭山南諸鎮唐河東節度使移檄三鎮通鑑乾寧二年五月王行瑜李茂貞韓建舉兵犯闕六月李克用請討之移檄數其罪唐中書侍郎同中書門下平章事移檄四方朱朴傳帝益治兵朴移檄四方令近者出甲士資饋餉逺者以羡餘上晉王諭邢洺魏博衛滑諸郡縣檄五代史天祐八年正月周德威等破賊徇地邢洺先馳檄諭邢洺魏博衛滑諸郡縣曰王室遇屯七廟被陵夷之酷昊天不弔萬民罹塗炭之災必有英主奮庸忠臣仗順斬長鯨而清四海靖妖祲以泰三靈豫位忝維城任當分閫念茲顛覆詎可宴安故仗桓文輔合之規問羿浞凶狂之罪逆溫碭山庸隸巢孽餘凶當僖宗奔播之初我太祖掃平之際束身泥首請命牙門包藏姦詐之心惟示婦人之態我太祖俯憐窮鳥曲為開懷特發表章請帥梁汴才出葦蒲之澤便居茅社之尊殊不感恩遽行猜忍我國家祚隆周漢迹嫓夏商二十聖之鎡基三百年之文物外則五侯九伯內則百辟千官或代襲簮纓或門傳忠孝皆遭陷害永抱沉寃且鎮定兩藩國家巨鎮冀安民而保族咸屈節以稱藩逆溫唯仗陰謀專行不義欲全吞噬先據屬州趙州特發使車來求援助豫情惟蕩冦義切親仁躬率賦輿赴茲盟約賊將王景仁將兵十萬屯據柏鄉遂驅三鎮之師授以七禽之略鸛鵝才列梟獍大奔易如走坂之丸勢若燎原之火僵尸仆地流血成川組甲雕戈皆投草莽謀夫猛將盡作俘囚羣凶既快於天誅大憝須垂於鬼録今則選搜兵甲簡練車徒乘勝長驅翦除元惡凡爾魏博邢洺之衆感恩懷義之人乃祖乃孫為聖唐赤子豈徇虎狼之黨遂忘覆載之恩蓋以封豕長蛇慿陵荐食無方逃難遂被脅從空嘗膽以銜寃竟無門而雪憤既聞告捷想所慰懷今義旅徂征止于招撫昔耿純焚廬而向順蕭何舉族以從軍皆審料興亡能圖富貴殊勳茂業翼子貽孫轉禍見機決在今日若能詣轅門而效順開城堡以迎降長官則改補官資百姓則優加賞賜所經詿誤更不推窮三鎮諸軍已申嚴令不得焚燒廬舍剽掠馬牛但仰所在生靈各安耕織豫恭行天伐罪止元凶已外歸明一切不問凡爾士衆咸諒豫懷廣南西路轉運使諭交州檄興國五年丁璿幼大校黎桓専制七月侯仁寶討之六年二月賊詐降仁寶為所害轉運使許仲宣草檄喻交州明國威信期必再舉桓懼遣使入貢嶺南轉運使諭交州渠帥檄實録許仲宣為轉運使會征交州師不習水土以便宜罷其軍分屯諸郡太宗嘉之仲宣遂草檄以諭交州渠帥即送欵內附遣使修貢知制誥撫諭西羌西羌地瘠以池鹽易榖於邊及李繼遷為冦陜西漕臣鄭文寶請禁青白鹽戎人乏食冦石昌鎮屠小康堡內屬萬餘帳亦叛淳化三年三月錢若水馳傳除其禁且撫諭諸族乃定樞密直學士知益州諭益州民淳化五年正月甲戌討李順又以張詠知成都府冦掠之際民多脅從詠移文諭以朝廷恩信使各歸田里詠曰順脅民為賊吾化賊為民荆湖北路轉運使移檄屬郡慶厯中歐希範誘溪洞環州蠻人叛上以田瑜習南方事除轉運許便宜行事瑜移檄屬郡募土人翹悍敢戰者甚衆又轉粟以守要害湖北轉運使檄屬部擊歐希範慶厯四年正月南環州蠻歐希範與其族為亂推蠻酋蒙趕為帝丙子陷本州殺官吏二月破鎮寧州癸卯詔發兵戊申上以廣西提刑田瑜習知南方事除湖北轉運使及瑜至檄屬部募民擊賊又督轉粟以守要害天章閣待制環慶路經略安撫使知慶州移夏人檄慶厯七年夏命杜杞知慶州自元昊稱臣聼誓數犯約鈔邊邊吏避生事縱不敢爭杞始至其酋孟香率千餘人內附夏人以兵入界求香香走自匿夏兵驅殺邊戶掠奪羊馬朝議責杞亟索而還之杞言夏人違誓舉兵香不可與因移檄夏人不償所掠則孟香不可得廣西體量安撫使移檄交趾嘉祐五年六月交趾與申洞蠻冦雍州殺五巡檢戊寅詔發兵討之召吏部侍郎余靖安撫廣西悉發荆湖兵以從十二月辛酉詔靖至則移檄交趾召其臣費嘉祐責之嘉祐皇恐對曰種落犯邊罪當死願留取首惡以獻即械五人送欽州斬于界上祥符七年十二月廣西轉運使高惠連言交趾冦欽州詔移牒荆湖南路察訪喻告梅山檄客省使翟守素平梅山蠻熙寧五年七月遣章惇察訪湖南經制蠻事十月發檄喻告開梅山道初太平興國二年梅山洞蠻苞漢陽冦暴不止遣客省使翟守素發潭州兵擊之八月詔曰汝等保於溪洞守在封陲况霜露之所均固聲明之攸暨遽忘覆育敢恣睢盱毒我齊民撓茲戎索亦嘗誅誘尚或逗留既豺虎之難馴當鯨鯢之盡戮更爾招攜庶幾悛改當諭好生之旨勉思轉禍之言無蹈駭機自貽後悔漢陽猶保險拒命守素進兵討平之太原鈐轄蘇安靜檄夏國自郭恩敗沒藏訛厖益肆經略使遣李思道等議疆事訛厖不聽嘉祐六年六月安靜檄夏國得吕寧栧浪撩黎來合議乃更築堠新邊禁邀以違約則罷和市自此始定庚辰靜上屈野河界圖梓夔察訪使諭瀘夷檄熙寧六年瀘州羅晏夷叛犯淯井監五月癸丑詔中書檢正官熊本察訪梓夔以便宜從事七年本措置瀘夷事誘十二村酋領誅之用黔南弩手及募土丁入夷界一日屢捷諸夷皆望風而靡本以夷酋甫望箇怒者桀黠乃遣人開諭許以爵賞遂納貢願世為漢官正月甲子瀘夷平上勞之曰檄奏詳明近世鮮有熙河經略使諭邈川元符二年二月邈川溫黨征密欲歸漢詔經略孫路多方誘之兵馬大元帥康王傳檄諸郡靖康元年閏十一月己酉康王為兵馬大元帥十二月壬戌朔王開大元帥府于相州乙丑大元帥府乃傳檄諸郡檄曰女真猖獗再犯京城臣子之心義當效死矧凡在職世受國恩當此艱危豈應坐視宜勉忠義戮力勤王二年四月二日辛酉大元帥府傳檄郡國下宣撫使范訥等亟會兵城下以候進發陜西制置使檄鄜延討賊陜西制置使錢蓋聞虜陷長安檄集英殿修撰鄜延經略使王庶兼節制環慶涇原兵討賊兵馬副元帥慰撫京城士庶檄靖康二年四月壬午徽猷閣待制兵馬副元帥宗澤至大名府欲渡河迎取二聖而勤王之兵無一至者又聞張邦昌僭立欲先行誅討密遣健步間道持檄慰撫京城士庶河北招撫司都統制王彥傳檄諸郡建炎元年九月戊申彥率禆將張翼白安民嶽飛等十一將以所部七千人渡河與金人戰破之遂復新鄉縣彥既得新鄉傳檄諸郡禮部侍郎御營參贊軍事召諸將檄建炎三年春苖傅劉正彥擁衆殺樞臣張浚檄召諸將除君側之惡同簽書樞密院事江淮兩浙制置使傳檄中外建炎三年三月壬寅資政殿學士吕頥浩與張浚進兵誅二凶以勤王為名傳檄中外曰苖傅躬犬豕不食之資取鯨鯢必戮之罪乃因艱難之際敢為廢立之謀劉正彥孺子狂生同惡相濟云云今吕頥浩因金陵之師劉光世引部曲之衆張浚治兵於平江韓世忠張俊馬彥溥各率精鋭辛道宗永宗陳思恭總舟師湯東野周杞扼險要趙哲集民兵劉誨李逮餽芻糧楊可輔等參議軍事同時進兵以討元惡知樞密院事御營副使宣撫處置使諭川陜移檄河東建炎三年五月戊寅朔張浚為宣撫處置使以川陜京西湖南北路為所部七月庚子賜川陜官吏軍民詔曰今遣浚往諭密旨其念祖宗積纍之勤勉人臣忠義之節以身徇國無貽名教之羞同德一心共建隆興之業當有茂賞以答殊勳四年八月浚以虜衆猶在淮甸欲分撓其兵勢於是決䇿用兵移檄河東問罪癸未復永興軍浚合五路兵四十萬約日會于耀州以與虜戰鼎澧鎮撫使傳檄二州建炎四年六月庚辰直龍圖閣程昌宇會要作昌禹為鼎澧鎮撫使兼知鼎州時羣盜方盛楊華楊太等出沒未已孔彥舟在鼎州八月昌宇傳檄二州京西招撫使傳檄諸軍收復東京紹興三年李橫三月甲子以其文來上略曰偽齊僭號自速翦夷國運中興王師已進西壓淮泗東接海沂馹騎交馳羽書疊至我則兼收南陽智謀之士提大河忠孝之人仗義以行乘時而動又曰金商之兵出其先荆湖之師繼其後若能納欵則悉仍舊貫執迷不悟則後悔難追少保奉國軍節度使四川宣撫使檄告契丹西夏髙麗渤海逹靼諸國及我河北河東陜西京東河南等路官吏軍民等紹興三十一年冬十月庚子朔吳璘檄樞密院所降本也淮南浙西江東西制置使告契丹諸國及中原檄紹興三十一年十一月一日劉錡檄告契丹西夏髙麗渤海逹靼諸國及河北河東陜西京東河南等道兵義者王逆者亡要當觀理師直為壯曲為老烏可恃強制軍詰禁王者所以申九法之嚴取亂侮亡聖人所以馭萬邦之衆聖主應天而順人必盡撫邇遐之衆智士轉禍而為福當深明去就之幾惟天無親作不善者神弗赦得道多助仗大義者衆必歸王者以無外為仁常篤近而舉逺聖人以不殺為武能保大而定功天道福善禍淫信渠凶之必殄君子赦過宥罪宜舊染之惟新天無二日土無二王田有一成衆有一旅退而增修於是有舞干之義諭以遷善於是有文告之辭若猶未悛乃用致討皇天既付中國民撫千齡之興運庶邦迪知上帝命合衆志以歸仁因變制宜大夫出疆之義伐叛討二諸侯敵愾之功風俗浸移已作李陵之胡服謳謠未改豈忘莊舄之越吟賊齒益寒虜臂皆斷鼠牙敢穿於崇墉螳臂何知於隆隧靡懷掎鹿之謀夙聽牽羊之計亦唯恃我朝廷爵秩之隆用能保爾子孫黎民之衆率酋豪而捍疆埸乃爾世功叛君父而從仇讐豈其本意庶能改過未忍加兵期寵祿於有終知大恩之難再奉我王明以其寶摯聞中國有至仁歸時事於宰旅開封賞之科著歸忠之傳大舜修德有苖歸心周穆徂征荒服不至困獸雖思於猶鬬涸魚寧久於偷生因爾倒戈之心乘我破竹之勢兵利卒頑因撫而有右翦左屠聿禽其良待以赤心縻之好爵言念脅從之衆豈皆好亂之氓弄潢池之兵諒非爾志烈崑岡之火亦豈豫心與其假息以偷生孰若轉禍而為福雖暫結於蜂屯卒莫逃於鯨戮自有宇宙至於今日未聞盜賊得以全軀推不殺之仁畀更生之路儻復舊業即為良民棄兵弩持鉤鉏茍知舍逆而效順問田疇卜居宅當俾去危而即安祖宗之盛德在天下莫大於好生南北之赤子皆吾民何心於從亂蚊雷聚響螳斧稱威言念蒼生無非赤子鋒蝟斧螳帶牛佩犢一夫作孽百姓何辜春秋大一統夫孰非邦域之中帝王自有真盍早定君臣之分蜀郡附於公孫幾闔城之屠戮河西歸於光武致列郡以安榮明效在前於今可覩王者有征而無戰孰禦其鋒天下後服者先亡終定于一儻昧先知之智難逃後至之誅昔吳芮效忠世列長沙之壤田橫亡命身貽海島之羞顧逆順之灼分惟智愚之審擇設爵以延田橫指河而誓朱鮪中原鹿走沸鼎魚遊欒盈干紀寧忘武子之勳蕭延紹封無廢鄼侯之嗣識暗挈瓶智慙衛足涇渭合流蘭鮑同肆瞻烏未定附鳯何從九黎亂德黃帝加誅項羽罪十漢祖不捨積甲與山齊永息煙塵之警取印如斗大益堅帶礪之盟秦人之鹿掎角相資常山之蛇首尾俱應未展鷹揚已皆魚爛斧鉞既下必嬰喪元之悲玉石一焚徒軫噬臍之歎驚飈更迅於雷霆烈焰寧分於玉石請分金而間楚願奉璧以伐虞弱卒瑣甲欲抗堂堂之師縈帶汙城冀保區區之命鳯鳴髙岡以逺罻羅賢聖之德也鸋鴂巢於葦苕苕折子破下愚之惑也竇融以河西歸漢榮被于後裔彭寵盜逆漁陽身死于奴僕虢滅虞亡韓并魏徙亷公思趙將吳子泣西河夙沙主雖愚蔽民盡知歸有苖始為跋扈終而大服漢南見一面以從殷河西率五郡而歸漢舞階以服有苖因壘而降崇國伏波遊説永作漢藩延壽脫歸終為魏守器改秦虞才通晉楚行藏用捨亦豈有常微子去殷而入周項伯叛楚而歸漢朝陽委照爝火收光春雷發音蟄户知令舞干之義載於虞書前禽之訓昭乎羲易封豕荐食困獸猶鬬燕巢幕以誇安魚在鼎而猶戲唐虞之世蠻夷猾夏周宣之盛亦讐大邦為劉氏左袒飽聞思漢之忠徯湯后東征必慰戴商之望我軍過之若駭鯨之決細網奔兕之觸魯縞未足以喻其易士百其勇人一其心虎牙鷹揚之臣蛇矛犀渠之羣橫行而東我伐用張月羽雲旗以先啓行將斫梟獍以釁鼓封鯨鯢于京觀變伊川之髮削呼韓之袵九夷百越雷隨風渙恬波沸海之中靜䘲稽天之際四七並列百萬為羣以轉石之形為破竹之勢為風為火殪彼蒙衝如霆如雷擊其舟艦掎拔而傾山嶽騰嘯而御風雲臣有召公日惟百里之闢將皆南仲月無三捷之虛鋒鏑一交玉石同碎舉烈火以燎毛飛嚴霜而脫葉無禮於君奮鷹鸇而驅鳥雀有功必賞誓帶礪而保山河冀馬追風吳戈照月審配死於袁氏不如張郃歸曹范增困於項王未若陳平從漢燕巢衛幕魚遊宋池脣既亡而齒必寒皮不存而毛安傅積德者天之所啓反道者鬼得而誅潞子離狄而春秋書徐夷朝周而大雅詠寬其萬死之誅弘以再生之路招攜以禮而懷之以德撫我則后而虐之則讐不爭而勝者天之道不戰可屈者人之兵雖以至仁伐不仁贊弔民之盛舉然殺無道就有道豈為政之本心殷微去商侯服周代項伯背楚賜姓漢朝蟻猶有君鳥則擇木逺者來近者悅同我太平撫則后虐則讐惟爾審擇玉海卷一百八十八
