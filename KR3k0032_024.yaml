body:
  text: 玉海卷二十四宋王應麟撰地理泉井玉井四星在參左東南四星曰軍井易以巽木入乎坎水之下而上出其水故為井曰木上有水井君子以勞民勸相以君養民使民相養皆取井養之義神農九井社漢郡國志南陽郡隨縣注盛弘之荆州記曰隨縣北有厲鄉村重山有一穴相傳云神農所生又有周回一頃二十畆地外有兩重塹中有九井神農既育九井自穿每汲一井則衆井水動即以此地為神農社嵗祀之水經注同史記索隱淮陽有神農井帝王世紀神農起列山為列山氏今隨厲山是也國史志潞州長子縣有神農井黄帝井益井易井卦釋文周書云黄帝穿井世本云化益作井宋衷云伯益也堯臣淮南子本經訓伯益作井而龍登元雲神棲崑崙能愈多徳愈薄矣注伯益佐舜初作井郭璞井賦曰益作井龍登天黄帝泉史記正義阪泉今名黄帝泉在媯州懐戎縣東五十六里出五里至涿鹿東北與涿水合晉太康地理志云涿鹿城東一里有阪泉上有黄帝祠堯井論衡傳言伯益作井龍登元雲神棲崑崙神農敎民耕耨耕土以為田鑿地以為井堯時五十之民擊壤於塗觀者曰大哉堯之徳也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力堯時已有井矣郡國志注堯井在汜水東十五里舜井郡國志濮州姚墟有二井是舜井也水經濼水注山上有舜祠山下有大穴謂之舜井抑亦茅山禹井之比矣舜甘泉水經注中山記曰郭東有舜氏之甘泉有舜及二妃祠禹井漢地理志山隂縣㑹稽山在南上有禹井後志注郭璞云有禹井周軍井周禮挈壺氏以令軍井注鄭司農云為軍穿井井成挈壺懸其上以表井管仲井左傳莊三十二年春城小穀為管仲也注小穀齊邑濟北穀城縣城中有管仲井漢浮沮井武紀元鼎六年秋遣浮沮將軍公孫賀出九原注臣瓉曰浮沮井名在匈奴中去九原二千里見漢輿地圖匈奴傳漢已滅兩越遣故太僕公孫賀將萬五千騎出九原二千餘里至浮苴井不見匈奴一人而還漢温泉唐温湯温泉銘浪井漢武故事驪山湯初始皇砌石起宇武帝加修飾焉張衡溫泉賦余適驪山觀温泉浴神井温泉汩焉以流穢兮蠲除苛慝服中正兮張衡東京賦温液湯泉薛綜注在河南梁縣界左思魏都賦温泉毖涌而自浪華清蕩邪而難老注温水在廣平都易縣潘岳西征賦南有湯井温谷注雍州圖曰温湯在新豐温泉在藍田縣界王廙洛都賦雞頭温水魯陽神泉周庾信温湯碑序其色變者流為五雲之漿其味美者結為三危之露豈獨醴泉清疾聞於漢武之朝神水蠲疴在乎咸康之世周王褒溫湯銘挺此温谷驪丘之隂白礬上徹丹沙下沉華清駐老飛流瑩心唐貞觀四年二月己亥幸温湯二十二年正月戊戌幸癸卯御製温湯碑示羣臣開元十六年三月京兆三原浪井出十九年六月辛未有浪井出於邛州龍興觀之平地五色彪炳二十一年五月丁卯蘭州有浪井出及醴泉湧金石録溫泉銘唐太宗御製并行書張説有温泉箴文選雪賦注盛弘之荆州記曰南陽郡城北有紫山東有一水冬夏常温因名湯谷水經注曰曲阿季子廟前井及潭常沸名曰沸井沸潭宋志浪井不鑿自成王者清靜則應漢鹽井火井貨殖傳蜀多鹽井羅裒以鹽井富左思蜀都賦火井沈熒於幽泉髙爓飛煽於天垂蜀郡有火井在臨邛縣西南鹽井也家有鹽泉之井臨邛漢安皆有鹽井充國縣有鹽井數十揚雄蜀都賦西有鹽泉鐡冶郊祀志宣帝祠火井於鴻門注地理志西河鴻門縣有火井祠火從地出初學記載異説臨邛有火井漢室之盛則赫熾桓靈際浸微諸葛孔明一窺而更盛漢金泉地理志酒泉郡注師古曰舊俗傳云城下有金泉味如酒應劭漢官儀曰酒泉城下有金泉味如酒漢鞠水龍泉地理志弘農郡析縣黄水出黄谷鞠水出析谷俱東至酈入湍水師古曰即今所謂菊潭也南海郡龍川縣注師古曰裴氏廣州記云有龍穿地而出即穴流泉因以為號國史鄧州南陽有菊水賈誼井水經注湘州賈誼宅地中有一井是誼所鑿極小而深漢疏勒城井貳師泉耿恭傳永平十七年冬騎都尉劉張出擊車師請恭為司馬與奉車都尉竇固及從弟駙馬都尉秉破降之始置西域都䕶戊己校尉乃以恭為戊校尉屯後王部金蒲城謁者關寵為己校尉屯前王柳中城屯各置數百人明年三月單于遣左鹿蠡王二萬騎擊車師遂破殺後王安得而攻金蒲城後解去恭以疏勒旁有澗水五月乃引兵據之七月匈奴復來攻恭恭募先登數千人直馳胡騎散走匈奴遂於城下擁絶澗水恭於城中穿井十五丈不得水吏士渇乏至笮馬糞汁而飲之恭仰嘆曰昔貳師將軍㧞佩刀刺山飛泉湧出今漢徳神明豈有窮哉乃整衣服向井再拜為吏士禱有頃水泉湧出衆皆稱萬嵗乃令吏士揚水以示虜虜出不意以為神明遂引去唐李嗣業傳為疏勒鎮使漢耿恭故井乆涸禱已泉復出識者以為至誠所感魏墨井左思魏都賦墨井鹽池玄滋素液注鄴西髙陵西伯陽城西有石墨井井深八丈唐氷井百官志司農屬官上林令掌苑囿園池季冬藏氷千段先立春三日納之氷井以黑牡秬黍祭司寒啟氷亦如之㑹要貞元元年十二月九日敕立春日内外兩井納氷二千五百段每段長三尺厚一尺五寸令府縣澄潔供進西晉庾儵有氷井賦唐亳州九井五行志開元二十九年亳州老子祠九井涸復湧劉義慶幽明録曰襄邑縣南瀬鄉老子廟中有九井開元二十九年正月亳州刺史鄭愿奏混元廟中之井涌氣成雲五色相映三月己丑亳州奏老君廟九井先涸自奉詔増修觀宇九泉皆涌枯木復榮括地志苦縣在亳州谷陽縣界有老子宅及廟廟中有九井尚存在今真源縣漢郡國志陳國苦有賴鄉注伏滔北征記曰有老子廟廟中有九井水相通古史考曰有曲仁里老子里也唐安寧鹽井南詔傳安寧城有五鹽井玄宗詔特進何履光以兵定南詔取安寧城及井復立馬援銅柱乃還唐醴泉地理志涼州天寳縣本畨禾天寳三載以山出醴泉更名三月丙子武威郡上言見祥瑞類貞觀六年醴泉出丹霄殿西七年二月出緜州香溪十一年九月醴泉出唐甘井毛公井韓公井地理志滄州清池有甘井開元二十年令毛某母老苦水鹹無以養縣舍穿地泉湧而甘民謂之毛公井韓朝宗傳開元二十二年初置十道採訪使朝宗以襄州刺史兼山南東道襄州南楚故城有昭王井傳言汲者死人雖暍困不敢視朝宗移書諭神自是飲者亡恙人號韓公井宋祁作韓公井賦裴識傳帥靈武地斥鹵無井識誓神而鑿之果得泉唐甘泉鸊鵜泉地理志澤州髙平有泫水一曰丹水貞元元年令明濟引入城號甘泉有省寃谷本殺谷玄宗幸潞州過之更名豐州西受降城北三百里有鸊鵜泉唐應聖泉楊朝晟傳貞元九年為邠寧節度十三年春請城方渠合道木波以遏吐蕃路詔問須兵幾何報部兵可辦帝問前日城五原興師七萬今何易耶對曰鹽州之役虜先知之今薄戎而城虜料王師不十萬勢難輕入若發部兵三日至塞下未三旬畢城積芻聚粮留卒守之冦至不能㧞萊野剪夷虜旦夕走屯方萬全䇿也帝納其䇿師次方渠水乏有青蛇降險下走視其跡水從而流朝晟築防環之遂為停淵士飲仰足圖其事以聞詔置祠命泉曰應聖已城三月成吐蕃悉衆至度不能害乃引去開地三百里唐六井白居易傳長慶二年為杭州刺史始築隄捍錢塘湖鍾洩井水溉田千頃復浚李泌六井民頼其汲六井李泌作相國井西井金牛池方井白龜池小方井白樂天治湖浚井刻石湖上本朝嘉祐中沈文通於六井之南為南井熙寧六年春陳襄修六井元祐五年四月蘇軾復治六井與沈公井改作瓦筒又創為二井唐上善泉地理志坊州中部州郭無水東北七里有上善泉開成二年刺史張怡架水入城以紓逺汲四年刺史崔駢復増修之民獲其利後思之為立祠唐宜春泉地理志袁州宜春有宜春泉醖酒入貢祥符廣孝泉舜井賛記祥符四年二月祠后土甲子車駕次河中府幸舜廟通典媯汭水今有舜廟在焉觀舜井其二井南北相連可秉炬入蓋史所謂匿空旁出者公府中泉脉皆鹹此水獨甘釀酒尤佳俗傳有疾者飲之或愈詔賜名廣孝泉令本府修飾墻垣帝作賛紀之又令王欽若撰記於側改舜泉坊為廣孝坊五月庚子詔於舜井側建廟又唐廣明中王重榮敗趙璋李誓衆於市樓以克復為名上曰此一時之事不若因舜都舊名為號丁卯遂改榜曰薰風樓命陳堯叟為記雍熙潤徳泉圖雍熙二年五月癸酉鳯翔府言岐山縣周公廟有泉忽涌出耆舊相傳時平則流世亂則竭唐安史之亂泉竭至大中年復流號潤徳泉自後又涸今忽湧清澄甘潔甚異於常因圖之以進廟在岐山西北七八里後百步晏殊為賛曰隱顯以時靈符孔彰東坡集云廟在岐山西北七八里廟後百許步有泉依山湧洌異常國史所謂潤徳泉詩云翠鳯舊依山硉兀清泉長與世窮通周書大聚云闢關修道五里有郊十里有井二十里有舍詩正義應劭風俗通云古者二十畝為一井因為市交易故稱市井易注井以清潔不變更為義鄭云井法也井居其所而遷穿重象之十仭剙玉甃之百節營之不日既汲既渫潜流炤炤寒泉洌洌江逌井賦鑿井之義濟人為徳名著乎東宿之躔象見乎河圖之畫道涂匠人營國經涂九軌環涂七軌野涂五軌環涂以為諸侯經涂野涂以為都經涂堯康衢列子堯微服遊於康衢康荘之衢聞兒童謡曰立我蒸民莫匪爾極不識不知順帝之則禹九道史記紀禹開九州通九道陂九澤度九山正義通逹九州之道路左傳禹經啟九道周五涂夏官司險設國之五溝五涂而植之林以為阻固皆有守禁以逹其道路注五涂徑畛涂道路也又見遂人量人書天下之涂數而藏之注謂支湊之逺近候人掌其方之道治合方氏掌逹天下之道路秋官野廬氏掌逹國道路至於四畿左傳曰晉為盟主司空以時平易道路漢棧道髙紀元年夏四月張良至襃中因説漢王燒絶棧道以備諸侯盗兵亦視項羽無東意注棧即閣也今謂之閣道張良傳云漢王之國良送至褒中遣良歸韓良因説漢王燒絶棧道示天下無還心以固項王意迺使良還行燒絶棧道淮南王曰人言絶成臯之道天下不通趙充國奏繕鄉亭浚溝渠治湟陿以西道橋七十所令可至鮮水左右唐歐陽詹有棧道銘漢甬道髙紀二年五月漢王屯滎陽築甬道屬河以取敖倉粟應劭曰恐敵鈔輜重故築垣墻如街巷也三年十二月項羽數侵奪漢甬道漢軍乏食五年五月上曰給餉餽不絶糧道吾不如蕭何漢回中道武紀元封四年冬十月行幸雍祠五畤通回中道遂北出蕭關注應劭曰回中在安定髙平有險阻三輔黄圖回中宫在汧元封六年冬太初四年冬天漢二年春幸回中後郡國志右扶風汧有囘城名囘中來歙開道處漢靈山道司馬相如傳畧定西南夷通靈山道橋孫水注張揖曰鑿開靈山道置靈道縣漢馳道成紀上嘗急召太子出龍樓門不敢絶馳道應劭曰馳道天子所行道也若今之中道乃著令令太子得絶馳道平紀元始元年六月罷三輔馳道列傳周勃從髙祖擊燕所將卒當馳道為多注師古曰當髙祖所行之前江充逢館陶長公主行馳道中呵問之後從上甘泉逢太子家使乘車馬行馳道中充以屬吏注如淳曰令乙騎乘車馬行馳道中已論者沒入車馬被具賈山曰秦馳道之麗道廣五十步三丈而樹厚築其外隱以金椎樹以青松秦皇二十八年治馳道王訢守右扶風武帝過扶風宫館馳道修治供張辦鮑宣為司隷丞相孔光四時行園陵官屬以令行馳道中宣没入其車馬注如淳曰令諸使有制得行馳道中者行旁道無得行中央三丈翟方進從上甘泉行馳道中司隷校尉陳慶効奏沒入車馬黄覇守京兆尹坐發民治馳道不先以聞循吏史平凖書既得寳鼎立后土太一祠公卿議封禪事而天下郡國皆豫治道橋繕故宫及當馳道縣縣治官儲設供具而望以待幸毛詩傳年不順成馳道不修文選注君必乘車馬故以馳名陸機洛陽記宫門及城中大道皆分作三中央御道兩邊築土牆髙四尺餘外分之唯公卿尚書章服道從中道凡人皆行左右左入右出夾道種榆槐劉盆子傳鄧禹夜戰槀街中注三輔舊事曰長安城中有槀街漢飛狐道王霸傳建武十三年盧芳與匈奴烏桓連兵冦盜詔覇將弛刑徒六千餘人與杜茂治飛狐道堆布土石築起亭障自代至平城三百餘里又陳委輸可從温水漕以省陸轉輸之勞事皆施行注飛狐道在今蔚州飛狐縣北通媯州懐戎縣即古飛狐口也前酈食其傳距飛狐之口注臣瓉曰在代郡西南唐地理志雲州雲中有隂山道青陂道皆出兵路漢橋道鄭弘傳建初八年為大司農舊交趾七郡貢獻轉運皆從東冶汎海而至風波艱阻沉溺相系弘奏開零陵桂陽嶠道至今為常路建武十七年馬援南擊交趾縁海而進隨山刋道千餘里十八年春軍至浪泊上漢子午道又見下王莽傳元始五年秋通子午道從杜陵直絶南山徑漢中注師古曰子北方午南方言通南北道相當今京城直南山有谷通梁漢道者名子午谷又宜州西界慶州東界有山名子午嶺此則北山者是子南山者是午共為子午道元和志子午關在長安縣南百里漢褒斜道詳見漕運順紀延光四年即位十一月乙亥詔益州刺史罷子午道通褒斜路注子午道平帝時通三秦記子午長安正南山名褒斜漢中谷名南曰褒北曰斜三國志魏延曰直從褒中出循秦嶺而東當子午而北不過十日可到長安諸葛孔明揚聲由斜谷道取郿括地志褒谷在梁州褒城北五十里斜水源出褒城西北九十八里水經注褒水東南歴小石門穿山通道六丈有餘刻石言漢永平中司隷校尉楊厥所開建和二年王升瑑石頌徳蓋因石牛道而廣之唐斜谷道封敖傳歴平盧興元節度使初鄭涯開新路水壊其棧敖更治斜谷道行者告便唐參天至尊道通鑑貞觀二十一年春正月丙申㑹要九日以鐡勒回紇等十三部内附置六部督府瀚海金微燕然幽陵龜林盧山七州臯蘭髙闕鷄鹿鷄田榆溪蹛林窴顔各以酋長為都督刺史各賜金帛錦袍㑹要云給元金魚黄金為字以為符信及還上御天成殿宴設十部樂遣之諸酋長奏稱臣等既為唐民徃來天至尊所如詣父母請於回紇以南突厥以北開一道謂之參天可汗道置六十八驛各有馬及酒肉以供過使嵗貢貂皮充租賦㑹要置郵驛總六十八所以通北荒號為參天可汗道四月丙寅置燕然都䕶府統六都督七州以李素立為之回紇傳吐迷度入朝云云渠領共言請於回紇突厥部治大涂號參天至尊道世為唐臣乃詔磧南鸊鵜泉之陽置過郵六十八所具羣馬湩肉待使客嵗納貂皮為賦拜吐迷度瀚海都督問對及舊紀並云置驛六十六所唐山西運道開砥柱漕路見漕運類通鑑陜州水陸運使李泌奏自集津至三門鑿山開車道十八里以避砥柱之險貞元二年二月道成唐西極道見門闕類唐大庾嶺新路地理志韶州始興有大庾嶺新路開元十七年詔張九齡開唐駱谷路地理志洋州興道有駱谷路南口曰儻谷北口曰駱谷真符本華陽天寳八載開清水谷路復置因鑿山得玉冊更名關塞兩河天闕其星為天關周禮司關掌國貨之節以聨門市五伯時諸大侯國皆有之楚有昭關魯有六關趙有井陘髙陽關魏有漳關秦有榆中臨晉嶢武二關關之大小不同其藩塞岨隘捍禦邦域則一也然長世字甿者以道徳為藩不以襲險為屏周司關關尹節傳周禮司關上士二人中士四人每關下士二人關界上之門掌國貨之節以聯門市司貨賄之出入者掌其治禁與其征㕓關下亦有邸客舍凡所達貨賄者則以節傳出之傳如今移所過文書凡四方之賔客敂關則為之告有外内之送令則以節傳出内之鄭司農説周之秩官有之曰敵國賔至關尹以告行理以節逆之掌節門關用符節門關司門司關也史記尹喜為關令孟子古之為關將以禦暴周十二關司關疏司關總檢校十二關所司在國内下云每關下士二人者自在關門開閉王畿千里王城在中面有五百里界首面置三關則亦十二關故云關界上門也遺人疏門關之委積門謂十二國門關謂十二關門出入皆有税野廬氏注轚互者車有轘轅坻閣舟有砥柱之屬記玉藻注殷則關譏而不征疏王制是殷禮魯六關左傳臧文仲廢六關三不仁注塞關陽關之屬凡六鹿門之關齊偪介之關暴征其私使有司毁關去禁郭關鹽鐡論諸侯之有關梁自戰國始楚扜關武關昭關楚世家肅王四年周安王二十五年蜀伐楚取兹方楚為扜關以距之李熊説公孫述曰東守巴郡距扜關之口郡國志巴郡魚復縣有扜關華陽國志曰巴楚相攻伐故置江關陽關括地志陽關今涪州扜關今峽州巴山縣界江關今䕫州魚復縣南二十里江南岸白帝城懐王二十年齊遺楚王書曰王取武關蜀漢之地則楚之强百萬也武關在商州東一百八十里商洛縣界頃襄王元年秦發兵出武關攻楚張儀傳説楚曰云云舫船載卒下水而浮一日行三百餘里不至十日而距扜關伍子胥傳奔吳到昭關關在西江乃吳楚之竟戰國策蘇秦説趙曰史記作蘇厲沙丘至距鹿三百里距於扜關趙陸道之關楚水道之關鹽鐡論楚自巫山起方城屬巫黔中設扜關以距秦水經江水自關東逕弱關捍關注捍關廪君浮夷水所置也弱關在建平秭歸界昔巴楚數相攻伐藉險置關以相防捍輿地廣記古捍關楚肅王所作以拒巴蜀公孫述傳使將軍侯丹開白水關在漢陽西縣北守南鄭任滿下江州東據扜關遣田戎任滿出江關下臨沮夷陵間岑彭傳彭自率臧宮劉歆長驅入江關魏蒲坂關水經注竹書紀年魏襄王七年秦王來見于蒲坂關秦函谷關武關詳見下史記蘇秦約從山東六國共攻秦楚懐王為從長至函谷關秦出兵擊六國六國兵皆引而歸張儀曰秦兵不敢出函谷關十五年蘇秦曰東有殽函之固范雎曰北有甘泉谷口南帶涇渭右隴蜀左關坂楚懐王入武關秦伏兵絶其後秦韓之地形相錯如繡周文收兵至關水經注丹水自商縣東南流注歴少習出武關秦之南關也通南陽郡左傳少習京相璠曰楚通上洛阨道也荀子秦有松栢之塞秦四塞蘇秦傳秦四塞之國也正義東有黄河有函谷蒲津龍門合河等關南山及武關嶢關西有大隴山及隴山關大震烏蘭等關北有黄河南塞是四塞之國被山帶渭婁敬傳秦地被山帶河四塞以為固漢武關嶢關臨晉關邊關靈關天井關美陽關常山關江關居庸關五原關髙紀秦三年八月沛公攻武關注應劭曰武關秦南關道南陽文曰在析西百七十里洛史記正義括地志曰故武關在商州商縣東九十里春秋時少習九月子嬰遣將將兵拒嶢關注應劭曰嶢山之關李竒曰在上洛北藍田南武關之西括地志藍田關在雍州藍田縣東南九十里即秦嶢關也杜篤論都賦關函守嶢山東道窮沛公引兵繞嶢關擊秦軍元年九月漢王遣將軍薛歐王吸出武關三年五月轅生説漢王曰願君王出武關武紀大初四年冬徙弘農都尉治武關税出入者以給關吏卒食成紀陽朔二年秋關東大水流民欲入函谷天井壺口五原關者勿苛留注應劭曰天井在上黨髙都壺口在壺關五原在代郡功臣表周勃守嶢關列傳張良南攻下宛西入武關沛公欲以二萬人擊秦嶢關下軍良曰不如因其解擊之周勃從沛公破武關嶢關太康地理志武關當冠軍縣西嶢關在武關之西東守嶢關擊項籍樊噲攻武關至霸上灌嬰定南陽郡西入武關從東出臨晉關擊降殷王史記正義臨晉關即蒲津關也在臨晉縣今在同州曹參從西攻武關嶢關取之以中尉從出臨晉關至河内韓信為大將謂漢王曰大王之入武關秋毫亡所害進兵擊魏魏盛兵蒲坂塞臨晉信益為疑兵陳船欲度臨晉酈商别將攻旬關注師古曰漢中旬水上之關也今在洵陽縣西定漢中酈食其曰願急復進兵收取滎陽據敖庾之粟塞成臯之險杜太行之道距飛狐之口注代郡西南守白馬之津以示諸侯形制之勢晁錯對䇿通關去塞不孽諸侯通關梁一逺近吳王濞臣田祿伯曰願得五萬人入武關周亞夫為太尉東擊吳楚至霸上趙涉説亞夫曰將軍何不從此右去走藍田出武關抵雒陽伍被為淮南中郎云云王曰今我先要成臯之口下潁川兵塞轘轅伊闕之道史記正義轘轅故關在河南緱氏南四十里伊闕故關在河南縣南十九里發南陽兵守武關河南太守獨有雒陽耳然此北尚有臨晉關河東上黨與河内趙國界者通谷數行汲黯曰愚民市買長安中而文吏繩以為闌出財物如邊關注應劭曰律胡市吏民不得持兵噐及錢出關臣瓉曰無符傳出入為闌司馬相如使畧定西南夷邛筰冉駹斯榆之君皆請為臣妾除邊關邊關益斥西至沫若水二水名南至牂柯為徼徼謂以木石水為界通靈山道橋孫水出臺登縣以通邛筰還報天子大説難蜀父老曰乃關沫若徼牂柯鏤靈山史記正義鑿靈山通以關也兵唐志雅州靈山有靈關又有靈關鎮蜀都賦靈關為門玉壘為宇賈捐之曰武帝北郤匈奴萬里更起營塞匈奴孝文即位與通關市十四年匈奴入朝那蕭關史記十四年冬攻朝那塞括地志塞即蕭關今名隴山關在原州百泉縣西景帝復通關市孝武元封元年天子勒兵見武節是時西置酒泉隔絶胡與羌通之路西通月氏大夏以翁主妻烏孫分匈奴西方之援又北益廣田至眩雷為塞匈奴不敢以為言注服䖍曰眩雷地在烏孫北西南夷莊蹻王滇漢興皆棄此國而關蜀故徼注師古曰西南之徼猶北方塞也南粤王趙佗移檄告横浦陽山湟谿關秦時髙后時有司請禁粤關市鐡噐武帝時上書請比内諸侯三嵗壹朝除邊關天子許之西域武帝詔曰今邊塞未正闌出不禁地理志弘農郡陸渾有關上黨郡有上黨關壺口關石研關天井關漢中郡長利有鄖關越巂郡靈關道水經注靈道縣一名靈關道漢制夷狄曰道牂柯郡有柱蒲關進桑有關敦煌郡龍勒有陽關玉門關西河郡増山有道西出眩雷塞眩音州縣之縣朔方郡窳渾有道西北出雞鹿塞代郡有五原關常山關上谷郡居庸有關欎林郡雍雞有關蒼梧郡有離水關謝沐縣有關荔浦有荔平關合浦郡合浦有關九真郡有界關宛西通武關光武紀建武十五年二月徙鴈門代郡上谷民置常山關代郡居庸關上谷以東徙吏人六萬餘口是時率馬成馬武北擊匈奴章紀元和二年三月乙未幸河東北登太行山至天井關注在今澤州晉城縣南後傳鄧禹建武元年正月自箕關將入河東箕關在今王屋東馮異北攻天井關㧞上黨兩城注天井關在太行山下異遣鄧曄于康擊延岑岑自武關走南陽樊崇逄安自武關徐宣等從陸渾關兩道俱入注武關在今商州上洛縣東河圖括地象曰武關山為地門上為天齊星陸渾縣有關在今洛州伊開縣西南吳漢率岑彭等伐公孫述岑彭破荆門長驅入江關舊在赤甲城後移在江南岸對白帝城故基在今魚復縣南王梁為野王令北守天井關為中郎將北守箕關張禹祖父况光武以為常山關長注關縣屬常山郡今定州行唐縣西北有故關邑城梁慬永初二年春羌冦三輔擊之轉戰武功美陽關注美陽故城在武功縣北七里於其所置關袁尚敗髙幹復舉兵守壺口關注潞州上黨縣有壺山口因其險面置關焉烏桓為冦建武二十一年遣伏波將軍馬援將三千騎出五原關掩擊之注關在代郡鮮卑元初五年冬入上谷攻居庸關郡國志泰山郡鉅平有陽關亭南陽郡析縣有武關在縣西注南都賦曰武關在其西巴郡魚復扜水有扜關史記曰楚肅王為扜關以拒蜀史記貨殖傳南陽西通武關鄖關賈誼新書所為建武關函谷臨晉關者大抵為備山東諸侯也今大諸侯多其力因建關而備之豈若定地勢使無可備之患匃奴傳侯應曰自中國尚建關梁以制諸侯所以絶臣下之凱欲也列女傳海關有關候士史蜀志先主次于陽平關與淵郃等相距法正曰魚復與關頭實為益州福禍之門魏延欲請精兵萬人與諸葛亮異道㑹于潼關亮制而不許通典漢中褒城漢襃中縣有漢陽平關在縣西北蜀先主破魏軍於此古今注秦築長城土色皆紫漢塞亦然故稱紫塞關都尉箴漢潰武關項破函谷尉臣司關敢告並轂崔瑗潘岳關中記曰秦西以隴關為限東以函谷為界二關之間是為關中此説未盡顔師古曰自函谷關以西總名關中髙紀注徐廣注項羽關塞之語曰東函谷南武關西散關北蕭關其説是也他如大震在隴州瓦亭在原州駱谷在盩厔子午在長安同之蒲津洋之華陽雖建置在秦後其設險守國一也漢函谷關關都尉關傳紀髙祖元年冬十月沛公至霸上十一月或説沛公急守函谷關從之注文穎曰是時關在弘農郡弘農縣衡嶺今移東在河南穀城縣師古曰今桃林縣有洪溜澗水卽古函谷也其水北流入河夾河之岸尚有舊關餘迹穀城即新安或云山形如函故稱函谷谷中容一車秦地西有隴關東有函谷臨晉南有嶢武關北有蕭居庸天井關以臨胡庭故為關中漢興都之史左氏傳桃林之塞注桃林在弘農華隂縣東潼關記楚懐王攻函谷關正義古函谷關在陜州桃林縣西南十二里今屬靈寳縣文帝十二年三月除關無用傳傳符也景帝四年春復置諸關用傳出入文帝去關禁當時矯偽者乘傳行郡國景帝懲七國之變復用傳武帝元鼎三年丁卯嵗冬徙函谷關於新安徐廣云新安東界以故關為弘農縣注時樓船將軍楊僕有大功耻為關外民上書乞徙東關以家財給其用度帝意亦好廣濶於是徙關於新安去弘農三百里至今謂之新關代王傳元鼎中漢廣關以常山為阻徙代王義於清河注依山以為關僮史平準書益廣關置左右輔水經注楊僕請以家七百人築塞鼎後李恂傳徙居新安關下注元三年徙函谷關於新安天漢二年冬十一月詔關都尉曰今豪傑多逺交羣盗其謹察出入者崔子玉有關都尉箴李尤賦曰命尉臣以執鑰統羣類之所從京隗囂傳囂將王元曰請以一丸泥東封函谷關西賦關門反拒漢得長久宣帝本始四年春正月詔載糓入關者得毋用傳終軍傳詣博士步入關吏子繻曰傳還當以合符後郭丹傳買符入函谷關注符即繻成帝陽朔二年秋關東大水流民欲入函谷天井上黨壺口壺關五原關代郡者勿苛留三輔舊事曰西以散關為限東以函谷為界二關之中謂之關中關髙紀師古注自函谷以西總名關中地理志秦地其界自弘農故闗以西弘農故秦函谷闗古函谷闗老子西遊闗令尹喜先見其氣知真人當過秦闗法雞鳴出客孟嘗君夜半至關其客效雞鳴得出九國仰關攻秦秦人開關延敵五行志函谷關距山東之險元延元年門牡飛云云百官表關都尉秦官察偽遊用傳出入張敞杜業寗成尹齊辛遵隂識為之後紀光武建武十九年復置函谷關都尉注九年省今復置循杜篤論都賦建武十八年二月甲辰四岳入函谷三月丁酉行至長安四月反于洛都明年有詔復函谷關云云山東翕然狐疑意聖明之西都懼關門之反拒也章帝元和二年冬十一月壬辰日南至初閉關梁桓帝永興二年冬十一月甲辰校獵上林苑遂至函谷關郡國志弘農故秦函谷關華隂縣注有潼關河南糓城有函谷關注西征記曰函谷左右絶岸十丈中容車而已王覇傳覇為討虜將軍建武八年屯函谷關擊滎陽中牟賊平之通典魏正始元年弘農太守孟康上言移函谷關更號大崤關又為金關論都賦阸塞四臨西被隴蜀南通漢中北據谷口東阻嶔巖關函守嶢山東道窮置列汧隴廱偃西戎拒守褒斜嶺南不通杜口絶津朔方無從城池百尺阸塞要害關梁之險多所衿帶一卒舉礧千夫沈滯函谷關賦李尤上羅三關下列九門南有蒼梧荔蒲離水謝沐洭浦零中以窮海陸北有蕭居天井壺口石陘貫越代朔以臨胡庭緣邊邪指陽㑹玉門西有隨隴武夷白水江靈沔漢阻曲路由山泉衆關莫盛於函谷銘云函谷險要襟帶喉咽尹從李老留作二篇孟嘗讐秦譎以雞鳴文選注引李尤函谷關銘西京賦左有崤函重險桃林之塞綴以二華東京賦函谷擊柝於東西東都賦識函谷之可關不知王者之無外晉江統賦帶以河洛重以崤阻撫四夷而守境豈恃阻於髙岑獨孤及古函谷關銘序曰天作崤函俾屏京室崇山廻合長河屈盤崖奔嶺蹙谷抱谿鬬崫起重險為秦東門截函夏於閫閾鏁天府於户牖江返秦璧天佑漢祚設險守國作藩于京壺口捶阸函谷批難閻伯璵函谷關賦南據二虢北荒三晉洞開一軌壁立千仭實隄防之樞轄為造化之緘縢建瓴百二之國扼喉三七之路幅員既長城小而固漢玉門關陽關兩關西域傳西域以孝武時始通東接漢阸以玉門陽關西則限以葱嶺元狩間張騫始開西域之道其後降渾邪休屠王置酒泉武威張掖敦煌列四郡據兩關注孟康曰關皆在敦煌西界賛曰孝武表河曲列四郡開玉門通西域以斷匈奴右臂光武閉玉門關謝西域之質李廣利傳天子使使遮玉門關曰軍有敢入斬之貳師恐西域傳漢軍正任文將兵屯玉門關為貳師後距張騫傳酒泉列亭鄣至玉門地理志酒泉太初元年開有玉門縣注師古曰闕駰云漢罷玉門關屯徙其人於此武威故休屠地太初四年開張掖昆邪地太初四年開敦煌後元年分酒泉置正西關外有白龍堆沙蒲昌海龍勒縣縣有陽關玉門關韋昭曰玉門關在龍勒界皆都尉治揚雄傳東南一尉西北一候注孟康曰敦煌玉門關候也後西羌傳武帝通道玉門隔絶羌胡使南北不得交關於是障塞亭燧出長城外數千里後西域傳自敦煌西出玉門陽關渉鄯善北通伊吾千餘里延光二年北匈奴與車師入冦河西議者因欲閉玉門陽關張璫上書陳三䇿注玉門陽關二關名也在敦煌西界陽嘉四年春北匈奴侵後部乃令玉門關候伊吾司馬救之甘英拒玉門陽關四萬餘里靡不周盡前傳元始中車師後王國有新道出五船北通玉門關往來差近戊巳校尉徐普欲開以省道里半避白龍堆之阸班超傳永元十二年上䟽願生入玉門關元初六年後數月北單于與車師後部共攻没索班公卿多以為宜閉玉門關輿地廣記沙州壽昌縣本龍勒陽關在縣西六里玉門關在西北一百十八里二關之西三百餘里有蒲昌海一名鹽澤廣袤三四百里則葱嶺于闐兩河所注也漢遮虜障地理志張掖郡居延居延澤在東北古文以為流沙都尉治師古注曰闞駰云武帝使伏波將軍路博徳築遮虜障於居延城武紀元狩二年夏將軍去病公孫敖出北地二千餘里過居延太初三年夏四月强弩都尉路博徳築居延天漢二年夏五月騎都尉李陵將歩兵五千人出居延北注師古曰居延匈奴中地名韋昭以為張掖縣失之張掖所置居延縣以安處所獲居延人而置此縣李陵傳天漢二年詔陵以九月發出遮虜鄣注師古曰鄣者塞上險要之處往往修築别置候望之人所以自鄣蔽而伺敵也河西之未入漢也霍去病欲攻小月氏則先望居延而濟乃至天山李陵欲渉單于庭必先自居延北出乃至浚稽則知居延之出匈奴乃其要路也漢既全得月氏之地立為四郡則居延又為酒泉要路故築鄣其上以扼其來名以遮虜可見其實也通典既於張掖甘州著居延塞又於酒泉肅州著遮虜障者甘州之西即肅州之東虜之來路亘乎兩州之境故障塞之設亦亘兩境李陵之軍自遮虜障北出亦望遮虜障南入可見虜路出入無不由此也居延塞即遮虜障也漢散關白水關後漢書延岑引北入散關注在陳倉縣南十里有散谷水李固傳出為廣漢雒令至白水關一作闕解印綬還漢中注梁州記曰關城西南百八十里有白水關李固解印綬處也故關城今在梁州金牛縣西隗囂傳白水險阻棧閣絶敗三國志建興六年冬諸葛亮引兵出散關圍陳倉蜀志注典畧曰起館舍築亭障從成都至白水關四百餘區昭烈抱朴子老子西遊遇關令尹喜於散關括地志在岐州陳倉東南五十二里通典金牛縣南有故白水關漢洛陽四關文選鮑昭樂府升高臨四關注陸士衡洛陽記漢洛陽四關東成臯關南伊闕關西函谷關北孟津關初學記同一云南有轘轅伊關東京賦盟津達其後大谷通其前廻行道乎伊闕邪徑㨗乎轘轅郡國志河南郡糓城有函谷關緱氏有轘轅關光武紀賛四關重擾注謂長安四塞之國通典後漢置成臯關漢三關馮衍傳衍遺田邑書曰上黨有四塞之固東帶三關西為國蔽注三關謂上黨壺口石陘也漢八關靈帝紀中平元年三月戊申置八關都尉官注謂函谷廣成伊闕大谷轘轅旋門小平津孟津也通典河南壽安縣有後漢八關城在縣東北函谷關都尉所理蜀漢三關文選晉紀論三關電埽注吳志賀邵曰劉氏據三關之險守重山之固張瑩漢南記曰蜀有陽平關江關白水關此為三關吳三關吳志朱然傳曹公出濡須然備大塢及三關屯魏義陽三關北史元魏郢州司馬彭珍等叛魏潜引梁兵趨義陽三關唐申州今信陽軍魏中山王英出汝南救之英至義陽將取三關先䇿之曰三關相須如左右手若克一關兩關不待攻而破宜先攻東關又向西關以分其兵勢隋榆關文帝紀開皇三年三月癸亥城榆關四年四月丁巳以賀婁子幹為榆關總管秦有榆中關漢有榆溪舊塞廣長榆塞名史記正義曰今榆木塞也在勝州北王恢所謂植榆為塞也顔師古曰在朔方或謂之榆中地理志榆林郡開皇二十年置勝州仁夀二年置金河縣帶闗史記蒙恬為秦將北逐戎人開榆中地數千里即今之榆林古上郡界始皇三十六年徙民三萬家於北河榆中漢傳枚乘説吳王曰秦北備榆中之關師古曰即今所謂榆關南距羌筰之塞唐志勝州榆林縣東有榆林關貞觀十三年置水經注榆中在金城東五十許里唐二十六關七關天下關百官志司門郎中掌門關出入之籍天下關二十六有上中下之差京城四面關有驛道者為上餘關有驛道及四面關無者為中餘為下有上中下關令掌禁未遊察姦慝即周司關漢關都尉之職六典司門郎中凡關二十有六通典關二十七為上中下之差上關六京兆藍田華州潼同州蒲津岐州散隴州大震原州隴山中關一十三京兆子午駱谷庫谷同州龍門㑹州㑹寧原州木硤石州孟門嵐州合河雅州卭崍彭州蠶崖安西鐡門興州興城渭津下關七凉州甘泉百牢河州鳯林利州石門延州永和綿州松嶺龍州涪水以限中外隔華夷設險作固閑邪止暴紀長安二年十二月丙戌天下置關三十今攷地理志凡十道有關一百四十三關内三十一京兆之藍田故嶢關銘皮日休有庫谷大横華之潼㑹要武徳九年八月十七日詔停潼關已東緣河諸關天授二年七月九日省潼關置洛州南北面關建中二年正月二十五日潼關依舊置防禦使等郭子儀傳攻賊崔乾祐於潼關乾祐敗退保蒲津趙復披闔内軍進收永豐倉關陜始通太宗有入潼關詩崤函稱地險襟帶壯兩京玄宗有度蒲關經潼關次成臯詩渭津同之龍門商之武關鳯翔之大散駱谷元和志駱谷關在盩厔縣西南北二十里武徳七年開駱谷道以通梁州隴之安戎本大震大中六年防禦使薛逵徙築更名安戎㑹要大中六年正月二十六日詔隴州薛逵移築故關三月奏移要㑹之中臨水挾山當川限谷危墻深塹克揚營壘之勢乞改為定戎關又南由路舊有水關正月二十七日起功三月十七日畢盡圖進上勑云新置關成得其要害安夷原之水峽石門驛藏制勝石峽木𤭔并渭州六盤西南隴山為七關乾元後失七關三紀宣宗大中三年二月吐蕃以秦原安樂州石門驛藏木峽制勝六盤石峽蕭七關歸于有司州裴識傳尚恐熱上三州七關吐蕃傳康季榮復原取石門等六關張欽緒復蕭關詔三州七關地腴衍者聽民墾蓺又有瓦亭故關八太宗紀貞觀二十年月丙戌踰隴山關次瓦亭觀馬牧蕭關大中五年以蕭關置武州節㑹要大中三年六月二十七日涇州度使康季榮收原州城及諸關七月十三日邠寧軍收蕭關匈括地志隴山關在原州即古蕭關漢文帝十四年奴入朝那蕭關關在安定朝那縣武帝元封四年十月幸雍祠五畤通回中道遂北出蕭關歴獨鹿鳴澤回中在安定髙平蕭關在其北寧之定安故關丹之烏仁延之合嶺蘆子㑹之㑹寧烏蘭綏之魏平勝之榆林貞觀十三年置河濵貞觀七年置豐之中受降城元和九年五月置單于府之雲伽後廢太和四年後置七月畢功時李泳為振武節度進圖以兵千人守之開成五年詔振武節度劉沔屯雲迦關備回鶻河南十五張知泰傳武后時奏置東都諸關十七所幾歛出入崔融傳時有司議關市盡征之融謂周官九賦其七曰關市雖歛士商不及往來天下之關必險道或致騷動河南之河陽轘轅陸渾伊關皆故關髙門松陽鵜鶘大谷松陽已下故關汝之魯山漢故關陜之大陽故關即茅津古函谷天寳元年獲寳符于關更桃林縣名靈寳浢津義寧元年置關貞觀元年廢關置津虢之潼大谷武徳二年廢鳯陵貞觀元年廢朱陽武徳八年廢鄆之碻磝津故關齊之鹿角故關濮之靈津沂之穆陵元和十二年二月李道古引兵出穆陵關河東三十三河中之風陵聖歴元年置蒲津一名蒲坂龍門晉之府城絳之武平故關太平貞觀七年置隰之馬鬬永和太原之白馬故關井陘盤石葦澤皆故關赤塘天門汾之陰地長寧沁之柴店嵐之樓煩合河蔚汾憲之鴈門劉沔傳㑹昌二年拜河東節度兼招撫回鶻使進屯鴈門關石之孟門忻之石嶺代之東陘西陘石門雲之牛皮蔚之孔嶺潞之井谷壺口故關昻車澤之天井一名太行十通鑑㑹昌三年討澤潞二月丁巳王宰克天井關甲戌河東奏克石㑹關長平河兆二十四孟之河陽虎牢成臯旋門故關故軹懐之大斛故關博之四口故關衛之故延津故臨清黎陽一名白馬津澶之盧津一名髙陵津鎮之白馬故井陘一名土門與郭子儀傳出兵井陘李光弼合德之張公故關定之安陽故關八度倒馬委粟故關幽之納欵在昌平縣西北三十五里即居庸故關亦謂之軍都關通典北齊改為納欵平之明垤臨渝一名臨閭十太宗紀貞觀十九年班師月丙辰皇太子迎謁于臨渝關大海媯之居庸塞東連盧龍碣石西屬太行常山實天下之險通典注漢居庸關在今懐戎縣鐡門志自馬者西五十里過鐡門關山南五鄧之魯陽興元之甘寧通典作甘亭隋置百牢通典隋置關今名百牢關利之石門興之興城隴右六秦之大震河之河藍鳯林吐蕃傳尚延心獻欵髙駢收鳯林關蘭之金城闞駰十三州記金城郡有金城關沙之陽關玉門夀昌縣治漢龍勒城西有陽關西北有玉門關城郭元振傳旌節下玉門關去凉州猶八百里中爭具壺漿歡迎淮南十二廬之故東光之木陵定城二故關安之故黄峴武陽百鴈平靖四關黄之大活白沙木陵陰山申之故平靖江南一䖍之横浦劔南十二彭之靜塞蠶崖漢之鹿頭嘉之平羌巂之青溪太和中節度李徳裕徙於中城西南有昆明軍西有寧逺軍有九城自青溪關南經大定城百一十里至臺登韋貞元十四年内侍劉希昻使南詔由此李徳裕傳臯鑿青溪道和羣蠻雲韋臯傳繇黎州出邛部直南置青溪關號曰南道瀘津雅之靈關雞棟邛崍邛崍山有金湯軍静冦軍乾符二年置李徳裕奏復邛崍關茂之古桃綿之松嶺龍之涪水嶺南四廣之洭浦故關賀之荔平連之故秦湟溪容之鬼門兩石相對中􅦎三十歩羈縻莊州之桂嶺本隋牂柯郡地南百里有桂嶺關吕氏春秋山有九塞大汾㝠阨荆阮方城殽井陘令疵句注居庸志安西西出柘厥關唐虎牢關紀㑹昌五年十月作昭武廟于虎牢關孟州汜水太宗破世充建徳之地志汜水東南有成臯故關西南有旋門故關乾元元年李光弼謂賊方闚洛當扼虎牢通典河南府汜水有故虎牢城東魏武定中陸子章増築後漢置成臯關賈至虎牢關銘序曰漢祖守之以臨山東坐清三齊强楚躑躅而不進太宗據之以拒河朔克平醜夏偽鄭袒縛而請命維兹虎牢天設巨防功在坤下拒在離旁昏恃以滅聖憑而王吕温成臯銘洪河在下太室傍倚岡盤嶺蹙虎伏龍起鎻天中區控地四鄙出必由户入皆同軌拒昏納明閉亂開理劉項分險扼喉而爭漢飛鎬京羽斬東城維唐初興時未大同王于東征烈火順風乘髙建瓴擒建系充周道如砥成臯不關順至則平逆來惟難柳宗元鐃歌戰武牢云云左傳制嚴邑也古東虢國王與鄭武公之畧自虎牢以東襄二年諸侯城虎牢十年戌虎牢漢志河南郡成臯故虎牢或曰制注師古曰穆天子傳云七萃之士主捕獸天子蓄之東虢號曰虎牢韓取鄭從成臯始唐大和關王思禮傳賊分兵畧大和關去鳯翔五十里命郭子儀以朔方兵擊之太宗紀武德九年八月甲子即位廢潼關以東瀕河諸關路巖傳置定邊軍於邛州扼大度治故關故函關城後周保定中改名通洛防在新安縣東唐四面關百官志御史臺凡出不踰四面關則不辭見咸平平安關太平興國髙陽關熙寧通㑹關紹聖金城關㑹要京西有關二房州平安關咸平五年置在房陵縣行慶關見後河北有關一瀛州髙陽關舊號關南興國七年二月甲申改陜西有關十環慶龍平關元符二年置涇原渭州制勝關熙寧中慶熙州南北關熙寧五年置河州通㑹關熙寧十年置子通畧紹聖五年三月築丙賜名通㑹蘭州鞏哥關元豐四年置六年改東關堡金城關紹聖四年四月十一日置㑹州㑹寧關元符元年五月以巔耳關置京玉關元符三年置安鄉關三年置綏逺關崇寧三年以洒金坪改三關並隷熙河成都路有關一茂州雞宗關熙寧九年置周世宗復三關顯徳六年三月甲戌北征四月壬辰取乾寧軍辛丑取益津關為霸州癸夘取瓦橋關為雄州及淤口關上置塞今信安軍是也五月乙巳朔取瀛州景徳劔門關九域志利州路劔門關景徳三年以劔州劔門縣隷關以兵馬監押主之熙寧五年縣復隷劔州祥符行慶關河陽汜水縣舊關東題曰虎牢西題曰玉關祥符四年三月戊戌真宗西廵至虎牢關改行慶關詔曰眷玉關之樞㑹控鼎邑之要衡慶厯四年五月己丑省汜水縣為行慶關隷河南府康定潼關元年二月丁亥詔潼關設備宋庠請修治函谷關以備西羌慶厯元年八月乙未毁潼關新置樓櫓王堯臣陳不可乃詔徹之慶厯秦州東西關又見城類二年正月二十七日秦州築東西關成初守臣韓琦以州之東西民居軍營皆附城因請築外城凡一十里自元年十月起至是成計工三百萬叚規曰一里之厚而動千里之權者地利也王者邦畿守在四夷禮義干櫓道徳藩籬逺人不服文徳來之化既無外何以關為其間如𤭔其絶如斗千乘馳輪匹夫可守玉海卷二十四
