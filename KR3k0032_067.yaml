body:
  text: 玉海卷六十七宋王應麟撰詔令赦宥古者眚災肆赦周有三宥三赦之法春秋莊二十年書肆大眚范寧曰有時而用非經國之常制秦孝文莊襄元年皆有赦初即位肆赦始此秦并諸侯曰大赦天下由漢以來或即位建儲改元立后皆有赦遂為常制大赦者不以罪大小皆原其或某處有災或車駕行幸則曰赦某郡已下謂之曲赦復有遞減其罪謂之德音者比曲赦則恩及天下比大赦則罪不盡除舜肆赦書舜典眚災肆赦注眚過災害肆緩也過而有害當緩赦之流宥五刑宥寬也以流放之法寬五刑大禹謨宥過無大刑故無小罪疑惟輕功疑惟重法過誤所犯雖大必宥不忌故犯雖小必刑周赦宥禮秋官司刺掌三刺三宥三赦之法一宥曰不識再宥曰過失三宥曰遺忘注不識謂愚民無識過失若今律過失殺人不坐死者遺忘若間帷薄忘有在焉而以兵矢投射之一赦曰幼弱再赦曰老耄三赦曰憃愚書吕刑五刑之疑有赦其審克之墨辟其罰百鍰六兩曰鍰鍰黃鐵也劓辟其罰惟倍二百鍰剕辟其罰倍差五百鍰宫辟其罰六百鍰大辟其罰十鍰五刑疑各入罰不降相因古之制也禮記疑獄泛與衆共之衆疑赦之管子赦者先易而後難小利而大害者也無赦者小害而大利者也春秋莊公二十二年春王正月肆大眚杜預注赦有罪也易稱赦過宥罪書稱眚災肆赦傳稱肆青皆蕩滌衆故以新其心漢大赦天下髙帝紀五年二月甲午即皇帝位于汜水之陽五月西都長安六月壬辰大赦天下漢立太子赦天下髙帝紀二年六月壬午宣帝地節三年四月戊申安帝元初六年四月丙寅順帝建康元年四月並立太子赦天下晉明帝太寧三年三月戊辰立太子大赦增文武位二等大酺三日賜帛漢郊赦文紀十五年丙子夏四月上幸雍始郊見五帝赦天下唐承天門大赦實録貞觀十七年四月丙戌立晉王為皇太子帝御承天門樓大陳仗衛當道植金雞大赦天下景雲元年七月己巳平王為皇太子大赦聲應吹銅望惟當璧司空讀册侍中授璽申洊雷之澤紀景雲之瑞改元開元二十六年七月己巳册皇太子大赦乾元元年十月甲辰御宣政殿册成王為皇太子大赦元和四年十月庚寅册皇太子癸巳制曰爰以吉日册于明庭鼓鍾載和文物大備宜布澤申恩唐丹鳳樓大赦實録至德二年十二月戊午御丹鳳樓大赦天下乾元元年二月丁未御明鳳門大赦四月甲寅享廟乙卯御丹鳳門大赦建中元年正月辛未有事南郊還御丹鳳樓大赦貞元四年正月庚戌朔御丹鳳樓大赦元和二年正月辛卯有事于南郊御丹鳳樓大赦建雞竿伐鼉鼓帝命出皇恩溥揚巽風作解雨蘇頲頌六甲迎黃氣三元降紫泥沈佺期周矢漢薪咸從蕩滌鄭書晉鼎彌切哀矜齊臣羞委轡之言楚國愧封錢之陋李商隱通典大唐令曰赦日武庫令設金雞及鼓於宫城門外之右勒集囚徒於闕前撾鼓千聲訖宣制放其赦書頒諸州用絹寫行下乾德明德門大赦太平興國丹鳳樓大赦端拱乾元門肆赦祥符封禪壇肆赦儀注國朝每郊祀前一日有司設百官蕃國朝貢使緇黃耆老位於宣德門外太常設宫縣置鉦鼓其日刑部録囚以俟車駕還改御常服登樓升御坐仗衛如儀侍臣宣敕立金雞太常擊鼓集囚少府監立雞竿於樓東南隅竿木伎人緣繩爭上取雞口所銜絳幡獲者即與之樓上以朱絲繩貫木鶴仙人乘之捧制書循繩而下至地以畫臺承鶴取制書宣之還授中書門下轉付刑部侍郎承制釋囚羣臣稱賀若德音赦書自內出者並如文德殿宣制之儀建隆四年十一月甲子郊祀畢御明德門樓大赦改乾德元年太平興國三年十一月丙申合祭南郊御丹鳳樓大赦即明德門也七月庚戌改端拱二年七月二十三日以彗見令肆赦八月八日御乾元門肆赦祥符元年十月二十六日東封泰山畢御朝覲壇肆赦少府監請製金雞從之三年九月甲辰詳定所上寶鼎縣朝覲肆赦儀注乾興元年正月朔改元二月朔御正陽門宣制覃慶如郊祀例有司具儀注禮院言舊制御樓儀仗千九百人今請用四千人又請細仗導衛晏殊頌曰頒鳳諾之詔植雞星之竿貫索靜而天牢空豐隆驚而蟄户震丹鳳銜詔蒼蠅漏音旋雕軫御端闈國史志仁宗世大赦二十二曲赦五德音十五録繫囚五十八先王之時雖不三歲一赦而書曰青災肆赦宥過無大在周則三赦三宥則赦宥所從來逺矣後世之於民富而教之既不如先王之備則責之遷善逺罪亦未可如先王之詳紹興肆赦儀注紹興四年七月臣僚請御端門肆赦既而給事中唐輝言行宫南門外地狹不可布儀衛望詔有司止於常御殿宣赦從之十三年十月十三日禮部奉常修立行宮門肆赦儀注其儀大略如前禮部侍郎奏中嚴外辦簾卷乾安之樂作扇合皇帝臨軒即御坐鳴鞭扇開樂止立金雞禮畢扇合乾安之樂作放仗令舍人於門下宣勞將士訖退十一月八日南郊禮畢御麗正門肆赦如儀殷作解之恩宣在宥之典疏漢網祝湯羅滌濯剗磢吏投丹筆人脫赭衣合動籥之前言鄙封錢之小慮星飛彩詔雲涌歡聲翔雞植竿墜鵠宣制法雞星而肆赦漏蠅筆之先知雲油然而澤布蕭蓼彼而露垂賞出千庾恩流百川令未脫口雷運風傳大明升而六合曉一氣薰而萬物春風行電舉未寸景而浹九埏刑制漢書先王制禮以崇敬作刑以明威刑罰威獄以類天之震曜殺戮也聖人因天討而作五刑舜象刑書舜典象以典刑注象法也疏天垂象聖人則之益稷臯陶方祗厥敘方施象刑惟明朱氏曰象如天之垂象示人也王氏曰若周官垂刑象漢書文帝詔有虞畫衣冠異章服以為戮而民弗犯武帝詔唐虞畫象而民不犯禮司圜注弗使冠飾者著墨幪若古之象刑與疏孝經緯云三皇無文五帝畫象三王肉刑畫象者上罪墨象赭衣雜屨中罪赭衣雜屨下罪雜屨而已公羊注孔子曰三皇設言民不違五帝畫象世順機三王肉刑揆漸加應世黠巧姦偽多尚書大傳唐虞象刑上刑赭衣不純中刑雜屨下刑墨幪選注荀子注晉志傳曰三皇設教而民不違五帝畫象而民知禁則書所謂象以典刑云云者也然則犯黥者皂其巾犯劓者丹其服犯臏者墨其體犯宫者雜其屨大辟之罪殊刑之極布其衣裾而無緣領投之於市與衆棄之白虎通畫象者其衣服象五刑也犯墨者蒙巾劓者赭衣臏者墨蒙宫者屝大辟者布衣無領揚子法言唐虞象刑惟明荀子正論治古無肉刑而有象刑墨黥或曰當為墨幪慅嬰慎子作草纓共艾畢共未詳菲對屨對慎子作𤭔殺赭衣而不純慎子曰有虞氏之誅以畫跪當黥以草纓當劓以復𤭔當刖以艾畢當肉周書王子曰穆穆虞舜立義治律注律法也漢刑法志書云伯夷降典哲民惟刑言制禮以止刑善乎孫卿之論曰世俗為説者以為治古無肉刑有象刑墨劓之屬菲屨赭衣而不純是不然象刑非生於治古所謂象刑惟明者言象天道而作刑安有菲屨赭衣者哉唐沈顔曰染其衣裳異其服色是罪終身不釋恥畢世不滅豈特己以為恥人見之者皆以為恥為戒朱文公曰象以典刑者畫象而示民以五等肉刑之常法也流宥五刑放之於逺寬夫犯肉刑而情輕之人也鞭作官刑朴作教刑官府學校之刑馭夫罪之小而未麗五刑者也金作贖刑使入金而免其罪所以贖夫犯鞭朴之刑而情之又輕者也此五者刑之法眚災肆赦言不幸而觸罪者則肆而赦之怙終賊刑言有恃而不改者則賊而刑之此二者法外之意猶今律令之名例欽哉欽哉惟刑之恤哉此聖人畏刑之心舜之贖不上及於五刑穆王之法亦必疑而後贖據此經文五刑有流宥而無金贖周禮秋官亦無其文至吕刑乃有五等之罰疑穆王始制之非法之正也以舜命臯陶之辭考之士官所掌惟象流二法而已商官刑伊訓制官刑警于有位疏治官之刑以警戒百官言三風十愆令受下之諫周三典秋官大司寇之職掌建邦之三典以佐王刑邦國詰四方一曰刑新國用輕典二曰刑平國用中典三曰刑亂國用重典吕刑曰刑罰世輕世重漢刑法志昔周之法建三典以刑邦國五刑墨罪五百劓罪五百宫罪五百刖罪五百殺罪五百司刑掌五刑其屬二千五百所謂刑平邦用中典者也凡殺人者踣諸市墨者使守門劓者使守關宫者使守內刖者使守囿完者使守積其奴男子入于罪隸女子入于舂稿凡有爵者與七十者與未齓者皆不為奴周道既衰穆王耋荒命甫侯度時作刑以誥四方墨罰之屬千劓罰之屬千臏罰之屬五百宫罰之屬三百大辟之罰其屬二百五刑之屬三千蓋多於平邦中典五百章所謂刑亂邦用重典者也魏陳矯曰周有三典之制漢約三章之法晉志劉頌上疏上古議事以制夏殷及周書法象魏崔實政論云周穆有闕甫侯正刑周五刑五禁八刑八辟九刑五聽刑書豐刑禮秋官大司寇以五刑糾萬民一曰野刑上功糾力二曰軍刑上命糾守三曰鄉刑上德糾孝四曰官刑上能糾職五曰國刑上願糾暴注暴當為恭小司寇以五刑聽萬民之獄訟以五聲聽獄訟求民情一曰辭聽二曰色聽三曰氣聽四曰耳聽五曰目聽憲刑禁注士師之五禁士師掌國之五禁之法以左右刑罰一曰宫禁二曰官禁三曰國禁四曰野禁五曰軍禁皆以木鐸徇之于朝書而縣于門閭注古之禁書亡矣今宫中有符籍官府有無故擅入城門有離載下帷野有田律軍有囂歡夜行之禁其粗可言者司刑掌五刑之法以麗萬民之罪墨罪五百劓罰五百宫罪五百刖罪五百殺罪五百野廬氏掌凡道禁注謂若今絶蒙大巾持兵杖之屬疏古時禁書亡故舉漢法而言大司徒以鄉八刑糾萬民不孝不睦不姻不弟不任不恤造言亂民小司冦以八辟麗邦法附刑罰曰議親故賢能功貴勤賓即大宰八統是也刑春秋正義張平子説八索周禮八議之九丘周禮之九刑太宰之職八法治官府六曰官法以正邦治七曰官刑以糾邦治即小宰所徇之常刑左傳文十八年季文子曰先君周公制周禮曰則以觀德德以處事事以度功功以食民作誓命曰毁則為賊掩賊為藏竊賄為盜盜器為姦主藏之名賴姦之用為大凶德有常無赦在九刑不忘注九刑書今亡又見上自誓命以下皆九刑書賈服云正刑一加之以八議昭六年三月鄭人鑄刑書鑄於鼎以為國之常法叔向貽書于子産曰夏有亂政而作禹刑商有亂政而作湯刑周有亂政而作九刑注周之衰亦為刑書謂之九刑韋昭曰謂正刑及流贖鞭朴也正義子産鑄刑書而叔向責之趙鞅鑄刑鼎而仲尼譏之汲冢周書嘗麥解第五十六維四年孟夏王初祝禱于宗廟乃嘗麥于太祖是月王命大正正刑書爽明僕告既駕少祝導王亞祝迎神降階即假于大宗少宗王若曰云云嗚呼敬之哉各執以屏助豫一人集天之顯亦爾子孫其能常恤乃事勿畏多寵無愛乃嚚無或刑于鰥寡衆臣咸興受大正書乃降太史策刑書九篇以升授大正乃左還自兩柱之間口針大正曰欽之哉爾臨獄無頗保寧爾國克戒爾服世世是其不殆大正坐舉書乃降再拜稽首王則退是月士師乃命大宗序于天時祠大暑乃命少宗祠風雨百享云云太史乃針之于明府一本作藏于盟府以為嵗典序成王既即政因嘗麥語羣臣以求助作嘗麥吕刑明啓刑書咸庶中正吕刑墨劓增於舊宫辟減其半惟作天牧哲人惟刑無疆之辭咸中有慶受王嘉師監于兹祥刑周公稱蘇公列用中罰成王訓君陳惟厥中前漢律厯志畢命豐刑曰惟十有二年六月庚午朏王命作䇿豐刑注孟康曰逸書篇名隋志書述唐虞之世五刑有服夏后氏正刑有五科條三千周官司寇掌三典以刑邦國司刑掌五刑之法麗萬民之罪太史又以典法逆于邦國內史執國法以考政事春秋傳曰在九刑不忘則刑書之作久矣蓋藏于官府懼人之知爭端而輕於犯周讀法地官州長正月之吉各屬其州之民而讀法以考其德行道藝而勸之若嵗時祭祀州社則屬其民而讀法亦如之嵗終會其州之政令正嵗則讀教法如初黨正四時之孟月吉日屬民讀邦法以糾戒之注彌親民者於教亦彌數春秋祭禜亦如之正嵗屬民讀法書其德行道藝族師月吉屬民讀邦法書其孝弟睦姻有學者春秋祭酺亦如之閭胥凡聚衆庶既比則讀法書其敬敏任恤者法者大司徒所頒之三物也州長讀法四黨正七四閭為族則嵗之讀法者十有四近民者教彌數閭胥則無時矣夏官大司馬讀書契秋官訝士讀誓禁周程典周書大匡篇維周王宅程三年注程地名在岐州後乃徙豐程典解第十二惟三月既生魄文王合六州之侯奉勤于商文王作程典云云慎德必躬恕恕以明德選官以明訓慎守其教小大有度協其三族固其四援明其伍候習其武誡士大夫不雜於工商愛其農時修其等列務其土實差其施賦逺格而邇安於安思危於終思始於邇思備於逺思近無違嚴戒詩皇矣疏引周書稱文王在程作程寤程典皇甫謐云文王徙宅於程周本典周書序周公為太師告成王以五則作本典本典解第五十七維四月既生魄王在東宫召公告周公曰今朕不知明德所則政教所行字民之道禮樂所生非不念而知故問伯父周公再拜稽首曰臣聞之文考能求士者智也與民利者仁也能收民獄者義也能督民過者德也為民犯難者武也王拜曰允哉敬守以為本典周九典周書文政解三十八惟十有三祀順九典一祗道以明之二稱賢以賞之三典師以教之四四戚以勞之五伍長以遵之六羣老以老之七羣醜以移之八什長以行之九戒卒以將之仲長統昌言曰嗣周氏之祕典續吕侯之祥刑穆天子傳丙寅天子屬官效器乃命正公𤭔父受敕憲己酉天子飲于溽水之上乃發憲令周書諡法惟三月既生魄周公旦太公望相嗣王發既賦憲受臚于牧野將葬乃制作諡諡者行之迹也號者功之表也車服者位之章也劉熙注曰憲法也賦治國之法於諸侯而受其貢養也孟子注孔子之門徒頌述宓戲以來至文武周公之法制耳漢除肉刑文紀十三年五月除肉刑刑法志文帝即位十三年齊太倉令淳于公有罪當刑詔獄逮繫長安其少女緹縈自傷悲泣乃隨其父至長安上書願沒為官婢以贖父罪列女傳曰歌雞鳴晨風之詩天子悲憐其意遂下令曰其除肉刑有以易之及令罪人各以輕重不亡逃有年而免具為令丞相張蒼御史大夫馮敬奏言肉刑所以禁姦所由來久矣臣謹議請定律曰諸當完者完為城旦舂當黥者髠鉗為城旦舂當劓者笞三百當斬左止者笞五百當斬右止及殺人先自告及吏坐受賕枉法守縣官財物而即盜之已論命復有笞罪者皆棄市郎顗傳注漢法肉刑三謂黥劓左右止也罪人獄已決完為城旦舂滿三嵗為鬼薪白粲一嵗為隸臣妾隸臣妾一嵗免為庶人其亡逃及有罪耐以上不用此令文選曰歌雞鳴於闕下稱仁漢牘注引班固歌詩因俗説而論之曰禹承堯舜之後自以德衰而制肉刑湯武順而行之者以俗薄於唐虞故也且除肉刑本欲全民也今去髠鉗一等轉而入大辟以死罔民失本惠矣故死者嵗以萬數刑重所致也刑者嵗十萬數民不畏不恥刑輕所生也必世而未仁百年而不勝殘誠以禮樂缺而刑不正也陳忠傳安帝時忠上除蠶室刑解臧吏三世禁錮狂易殺人得減重論母子兄弟相代死聽赦所代者事皆施行崔實傳為政論曰文帝乃重刑非輕之也以嚴致平非以寬致平也崔實鄭玄陳紀之徒咸以為宜復肉刑荀彧訪百官孔融議云云卒不改陳羣又陳其便而王修不同其議遂寢魏文帝明帝又議亦寢周禮正義云文帝唯赦墨劓刖三者其宫刑至隋乃赦也開皇初始除宫刑漢斷獄四百刑法志孝文即位禁網疏闊選張釋之為廷尉罪疑者豫民是以刑罰大省至於斷獄四百有刑錯之風史記成康之際刑錯四十年不用漢都司空百官表宗正屬官有都司空令丞注如淳曰律司空主水火及罪人賈誼曰輸之司空編之徒官灌夫傳上使御史簿責嬰所言灌夫頗不讎劾繫都司空宣紀中都官獄注師古曰中都官京師諸官府也漢儀注長安中諸官獄三十六所漢廷尉平宣紀地節三年十二月初置廷尉平四人秩六百石地節四年九月令郡國嵗上繫囚丞相御史課殿最以聞百官表廷尉掌刑辟有正左右監景帝中六年更名大理武帝建元四年復為廷尉宣帝地節三年初置左右平秩皆六百石注應劭曰聽獄必質諸朝廷與衆共之刑法志宣帝詔曰今遣廷史與郡鞠獄任輕祿薄其為置廷平秩六百石員四人其務平之於是選于定國為廷尉求明察寬恕黃霸等以為廷平時涿郡太守鄭昌上疏言今明主躬垂明聽雖不置廷平獄將自正若開後嗣不若刪定律令今不正其本而置廷平以理其末也政衰聽怠則廷平將招權而為亂首矣詳見官制按商子秦孝公三年置法官定分篇曰天子置三法官殿中御史丞相諸侯郡縣皆置一法官漢若盧品令百官表少府屬官有若盧令丞注如淳曰若盧官名也藏兵器品令曰若盧郎中二十人主弩射漢儀注有若盧獄主令治庫兵將相大臣列傳王吉郡國舉孝亷為郎補若盧右丞王商左將軍師丹奏曰臣請詔謁者召商詣若盧詔獄注孟康曰若盧獄名屬少府黃門北寺是也後紀和帝永元九年十二月己丑復置若盧獄官安帝永初二年五月丙寅太后幸洛陽寺及若盧獄録囚徒即日雨降傳龎參輸作若盧月令正義夏曰均臺殷曰羑里周曰圜土秦曰囹圄漢曰若盧魏曰司空博物志夏曰念室晉志念室後刑漢以廷尉主刑獄而宗正屬官有左右都司空鴻臚有别火令丞郡邸獄少府有若盧獄令考工共工獄執金吾有寺互都船獄薛宣為都船獄吏又有上林詔獄水司空掖廷祕獄暴室請室居室保官徒官之名張湯傳蘇林曰漢儀注獄二十六所魏王朗奏西京蔽罪斷刑者二十有五獄東漢志云孝武所置世祖皆省之漢地理志陳留郡尉氏應劭曰古獄官曰尉氏鄭之别獄也左襄二十一年欒盈過周曰將歸死於尉氏漢議省刑法光武紀建武二年三月乙未大赦天下詔曰頃獄多寃人用刑深刻朕甚愍之其與中二千石諸大夫博士議郎議省刑法五年五月詔中都官等出繫囚十八年蠲邊郡殺盜之法漢聽訟觀晉志漢明帝即位常臨聽訟觀録洛陽諸獄帝性既明察能得下姧故尚書奏決罰近於苛碎魏明帝大和三年冬十月改平望觀為聽訟觀魏金䇿著令魏志文帝延康元年二月壬戌其宦人為官者不得過諸署令為金䇿著令藏之石室明帝大和三年七月詔曰由諸侯入奉大統當明為人後之義其書之金䇿藏之宗廟著于令典景初元年夏有司議定七廟冬又奏文昭廟宜世世享祀奏樂與祖廟同於是與七廟議並勒金䇿藏之金匱晉聽訟觀紀武帝泰始四年十二月庚寅帝臨聽訟觀録廷尉洛陽獄囚親平決焉五年正月丙申帝臨聽訟觀録囚徒多所原遣十年六月癸巳臨聽訟觀録囚徒多所原遣太康五年六月初置黃沙獄元帝太興元年十一月新作聽訟觀志元帝令曰大理所上宜朝堂會議蠲除詔書不可用者四年四月辛亥帝親覽庶獄晉庚戌制哀紀興寧二年三月庚戌朔大閲户人令所在土斷嚴其法禁稱為庚戌制晉志劉頌為三公尚書上疏曰君臣之分各有所司主者守文若釋之執犯蹕之平也大臣釋滯若公孫弘斷郭解之獄也人主權斷若漢祖戮丁公之為也又律法斷罪皆當以法律令正文若無正文依附名例斷之其正文名例所不及皆勿論法吏以上所執不同得為異議唐朝堂受訟省寃獄於朝堂太宗紀貞觀元年五月癸丑敕中書令侍中朝堂受辭訟有陳事者悉上封二年八月甲戌省寃獄于朝堂六年十二月辛未縱囚七年九月來歸皆赦之十七年三月甲子以旱遣使覆囚決獄髙宗紀永徽四年四月以旱慮囚遣使決天下獄五年六月河北大水遣使慮囚唐大理獄訟鵲巢幾致刑措斷獄二十九人刑法志太宗以英武定天下然其天姿仁恕初即位有勸以威刑肅天下魏徵以為不可因為上言王政本於仁恩所以愛民厚俗之意太宗欣然從之遂以寬仁治天下而於刑法尤謹貞觀四年天下斷死罪二十九人玄宗自初即位勵精政事帝自選太守縣令告戒以言而良吏布州縣民獲安樂二十年間號稱治平衣食富足人罕犯法是嵗刑部所斷天下死罪五十八人往時大理獄相傳鳥雀不棲是嵗有鵲巢其庭木羣臣稱賀以為幾致刑措開元二十五年七月己卯少卿徐岵奏魏徵傳於是帝即位四年嵗斷死刑二十九人幾致刑措舊紀貞觀四年斷死刑二十九人幾致刑措東致于海南致于嶺皆外户不閉行旅不賫糧焉紀貞觀三年十二月辛酉十年十二月十五年四月十一月庚子十七年二月己亥二十二年閏十二月癸巳親録囚徒顯慶四年十月壬辰親慮囚龍朔三年二月庚戌敕京城囚日親慮二十人不盡者皇太子於百福殿慮之咸亨二年六月癸巳景龍二年六月壬寅親慮囚天寶十四載六月壬辰同唐參酌院志穆宗頗知慎刑法每有司斷大獄令中書舍人參酌而輕重之號參酌院唐李崇法鑑志刑法類八卷唐議獄堂國史張仁瑑後唐長興中為大理正上言曰唐咸通十年大理少卿劉慶初奏請置議獄堂每丞詳斷刑獄畢集大卿二少卿二正六丞四司直八評事同參詳令依典式其法官能辨雪寃滯狀迹尤異者二人以上請與書上下考三人四人以上超資與官敕依所奏望依故事於法寺置議獄堂淳化審刑院見院類二年八月己卯置太祖始用士人治州郡之獄太宗尤重用典刑哀矜之詔嵗輒有之刑部設詳覆之員諸路命糾察之使淳化又置審刑院於禁中防大理刑部之失凡具獄先上二司然後關報審刑事從中覆然後下丞相府丞相府又以聞始命論其重謹之備如此祥符二年七月丁巳置糾察在京刑獄司周起趙湘領之淳化刑部詳覆唐末刑部案覆之職廢建隆三年三月十二日詔天下斷大辟録案牘及判官法直官等名聞奏下刑部覆視乾德二年正月三十日詔曰漢制獄之疑者讞于有司所不能決者移於廷尉各修其職無相奪倫逮于近年頗隳舊制滯獄不斷避事上言自今諸路刑獄一準建隆三年二月詔書從事開寶六年四月雍熙四年正月復申此詔淳化元年五月辛卯詔刑部置詳覆官六員閲案牘咸平二年八月癸丑判大理寺王欽若言近者逾月無公案昔漢文決死刑四百唐太宗縱囚三百九十人猶號刑措今四海之廣刑奏止息逾月請宣付史官天禧三年十月二十六日己酉知審刑院盛度言在京及諸路止有斷案三道請付史館詔奬之宰臣進以刑清稱賀開寶六年七月壬子朔始以士人為司寇參軍改諸州馬步院為司寇院天下巨鎮得置左右兩院者十有六興國五年改為大理參軍選清白能折獄者為之淳化二年五月庚子命董循等十人分往諸路提點刑獄四年十月壬戌省景德四年六月復置以使臣副之七月命李珙等出御前印紙書績效天聖六年正月省八年九月復嘉祐五年九月省武臣熙寧元年二月復二年十一月省武臣提刑元豐大理寺元年十二月十八日戊午中書請復置大理獄置卿少丞初上謂國初廢大理獄非是以問孫洙洙對合旨至是命崔台符等作大理寺工萬七千十七日而成作於元年十二月之戊辰訖于二年正月之甲申以楹計凡三百六十有二度地於馳道之西宋用臣經其制秦士禹司其役史臣李清臣為記元祐三年五月丙午朔罷右治獄依三司舊例於户部置推勘檢法官本朝開封御史有獄又置糾察司以裁其失刑部大理斷刑又置審刑院以決其平鞠與讞各司其局元豐始以大理兼獄事紹興士師龜總三年九月六日丁巳大理卿李與權以聖賢之訓與謹獄之事分章取義類聚條分凡三百事列十門總為一書上之繕寫成五册名曰士師龜總詔録副本申尚書省紹興刑名斷例紹興三年正月乙丑手詔曰廷尉天下之平也曹劌謂小大之獄雖不能察必以情為忠之屬也可以一戰可布告中外為吾士師者各務仁平濟以哀矜天髙聽卑福善禍淫莫遂爾情罰及爾身置此座右永以為訓臺屬憲臣常加檢察月具所平反刑獄以聞三省嵗終鉤考當議殿最四年七月癸酉初命大理丞評刋定見行斷例刑部言國朝以來斷例皆散失今所用多是建炎以來近例乞將見行斷例并臣僚繳進元符斷例裒集為一若特旨斷例則别為一書九年十月戊寅朔命評事何彥猷等編集刑名斷例刑部郎張柄等看詳二十六年九月二十九日戊辰臣僚請以吏刑部例修入見行之法閏十月一日刑寺具崇寧紹興刑名疑難斷例三百二十條二十七年吏部尚書詳定敇令王師心編修以紹興刑名疑難斷例為名又以吏部改官例六十二條修可行者三十條為紹興吏部改官申明十一月二日從之書目熙寧法寺斷例十二卷元符二年刑名斷例三卷曽改等撰凡四百九條慶厯三年三月戊辰朔詔刑部大理寺集斷獄編為例漢之公府則有辭訟比以類相從尚書則有決事比以省請讞之弊比之為言猶今之例云爾定而不易者謂之法法不能盡者存乎人紹興折獄龜鑑紹興中鄭克撰三卷和凝著疑獄集三卷崇文目有之述事猥并克乃分二十門以義類詮次一本云鄭克決獄龜鑑二十卷和凝有疑獄集近時趙全有疑獄事類皆未詳盡克因增廣之依劉向晏子春秋舉其綱要為之目録分二十門計三百九十五事和凝集古今明於聽斷者二十九條為上一卷子㠓續三十八條為下二卷表上之一本云凝取古今史傳聽訟斷獄辨雪寃枉等事著為疑獄集子㠓因增益事類分為三卷表上之國史志王臯續疑獄集四卷崇文目有律鑑一卷無撰人趙綽金科易覽一卷宋朝敕局天聖編敕始有詳定編敕所别命官領之熙寧後詔修一司敇令則又以編修諸司敇式所為名元祐改熙豐之法則又以重修敕令所為名建炎四年六月丁丑詔敇令所將嘉祐政和條制對修成書大理卿王衣請以詳定重修敇令所為名後三日庚辰命宰臣范宗尹提舉參政張守同提舉紹興元年八月戊辰上重修敕令格式及申明看詳等自是迄于三十年秋敇局所修書又一千八百六十三卷通海行法為二千六百二十卷有竒政和元年十二月十七日始頒海行敕令三十一年遂罷之三十二年六月甲午修上皇聖政復置敕令所乾道四年十一月刪修建炎後續旨乃以重修敕令所為名六年十一月乙未又以詳定一司敕令所為名置提舉官二同提舉一詳定一刪定五自乾道後新修之書又三千一百二十五卷淳熙十五年四月林栗請省無用之費六月戊辰罷敕令所紹熙二年五月癸丑復置詳定敕令局慶元二年二月丙辰復置編修敕令所國初刪修刑統但屬大理劉摰曰神宗元豐中命有司編修敕令凡舊載於敕者多移之於令蓋違敕之法重違令之罪輕見神宗仁厚之德哀矜萬方欲寬斯人之所犯恩施甚大也建隆初編敕四卷百有六條興國中增至十五卷淳化倍之咸平增至萬八千五百五條芟其煩亂可為敕者二百八十有六條總十一卷當時便其簡易祥符七年又增至三十卷千三百七十四條天聖中有司言敕復增至六千餘條命官刪定詔中外使言敕之得失民之所欲因而循之民之所病革而化之消息盈虛與時偕行析言破律之姦竒請他比之衆庶幾盡革天聖中吕夷簡以二政之臣同定編敕厥後二府遂為故實蓋進而參道揆於一堂之上退而明法守於三尺之中皆大臣事也晉有定科郎裴楷為之宋元嘉十八年三月戊申置尚書刪定郎官張永為之齊尚書刪定郎王植梁刪定郎蔡法度陳永定元年十月置刪定郎治律令後周栁敏小司馬監修律令易之大象言刑獄者凡五噬嗑賁旅豐是也然皆因離體以發其義中孚外實內虛其象似離解互體有離故亦曰議獄緩死赦過宥罪豐之象曰雷電皆至豐君子以折獄致刑折獄必照其情實惟明克允致刑以威於姦惡惟斷乃成蕭何次律令房喬定格式鄭昌以刪定律令為正本班固以刪定律令為清源古之人懸憲象魏屬民讀法明白洞達日星垂而江河流也伯夷以禮典折民仲舒以春秋決獄晉鑄刑鼎仲尼譏之鄭鑄刑鼎叔向責之典曰五典教曰五教得罪於教則用刑聖人之治以德為化民之本而刑特以輔其所不及聖人法有盡而心則無窮刑賞有疑常屈法以申恩不使執法之意勝其好生之德聽參臯吕稱侔于張法令者治之具而非制治清濁之原也治教政刑謂之典天下之大常也太宰所掌獨謂之建以此典太宰之所定也几閣之盈難於遍睹錐刀之末虞乎盡爭法正則民慤廣宣主恩建立明制為一代之法古之知法者能省刑刑者民之司命也天討有罪非人也文王罔敢知非君也世重世輕其惟審克豫宥豫辟無或詭隨哀矜勿喜小大以情元者善之長開闢之元有善而無惡有德而無刑有善而有惡懲惡而有刑用刑之端初不始於聖人也古者因情而求法故有不可入之刑後世移情而合法故無不可加之罪刑乃天之威非君之私權也刑者律也比者例也三千之律猶不能盡天下之罪不免上下以求其比天下之情無窮而法不可獨任也吕刑上下比罪無僣亂辭采緹縈之言納溫舒之奏道揆明於上法守明於下易稱敕法書著祥刑靁電皆至天威震耀五刑之作是則是效威實輔德刑亦助教聖王仰視法星旁觀習坎先春風以播恩後秋霜而動憲古人之論刑不曰惟克天德自作元命則曰凡制五刑必即天論蓋用刑之權出於天人主與有司特奉行之耳任非其人命曰褻天玉海卷六十七
