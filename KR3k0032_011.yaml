body:
  text: 玉海卷十一宋王應麟撰律厯漏刻黄帝漏刻初學記梁漏刻經云漏刻之作肇於黄帝之日宣乎夏商之代冬至晝漏四十五刻冬至之後日長九日加一刻夏至晝漏六十五刻夏至之後日短九日減一刻隋志黄帝創觀漏水見隋刻漏晉志旗端四星南北列曰天桴鼓桴也星不明漏刻失時前近河鼓漸臺四星主晷漏律呂之事天文要集女史一星在柱下史北女史轉漏堯刻漏堯典正義堯分命羲仲令居治東方於日晝夜中分刻漏正等天星朱鳥南方七宿合昏畢見以此天之時候調正仲春之氣節馬融云古制刻漏晝夜百刻晝長六十刻夜短四十刻晝短四十刻夜長六十刻晝中五十刻夜亦五十刻融據日出見為説天之晝夜以日出入為分人之晝夜以昏明為限日未出前二刻半為明日入後二刻半為昏損夜五刻以裨晝則晝多於夜復校五刻鄭注云云王肅難云融為傳已減之因融所減而又減之故日長為五十五刻因以冬至反之取夏至夜刻以為冬至晝短此所以誤周禮疏馬氏云漏凡百刻春秋分晝夜各五十刻冬至晝則四十刻夜則六十刻夏至晝六十刻夜四十刻鄭注堯典云日中者日見之漏與不見者齊日長者日見之漏五十五刻於四時最長也夜中者日不見之漏與見者齊日短者日見之漏四十五刻於四時最短此與馬義異馬云春秋分晝夜五十刻據日見之漏若兼日未見日没後五刻晝五十五刻夜四十五刻若夏至晝六十刻通日未見日沒後五刻則晝六十五刻夜三十五刻一年通閏有三百六十五日四分日之一四時之間九日有餘校一刻為率周挈壺氏漏箭夏官挈壺氏下士六人史二人徒十有二人注挈壺水以為漏掌挈壺以令軍井挈轡以令舍挈畚以令糧軍中人多車騎雜㑹驩囂號令不能相聞故各以物為表省煩趨疾于事便也凡軍事縣壺以序聚柝以水火守之分以日夜先鄭云懸壺以為漏以序聚柝以次更聚擊柝備守也玄謂以水守壺者為沃漏也以火守壺者夜則視刻數也分以日夜者異晝夜漏也漏之箭晝夜共百刻冬夏之間有長短焉太史立成法有四十八箭疏釋曰懸壺於上以水沃之水漏下入器中以沒刻為准法太史立成法有四十八箭者此據漢法而言以器盛四十八箭箭各百刻以壺盛水懸於箭上節而下之水水淹一刻則為一刻四十八箭者蓋取倍二十四氣也及冬則以火爨鼎水而沸之而沃之謂沃漏也秋官司寤氏掌夜時甲乙至戊以星分夜若今時觀參辰知夜早晚詔夜士夜禁行夜徼候疏三光考靈曜云日入三刻為昏不盡三刻為明春官雞人夜嘑旦以􅑧百官夜夜漏疏漏未盡三刻已前仍為夜則呼旦也􅑧古弔反凡國事為期則告之時正義天子備官挈壺掌漏刻之節雞人告期齊詩是諸侯兼官故挈壺氏兼吿期也詩東方未明刺無節也朝廷興居無節號令不時挈壺氏不能掌其職注古者有挈壺氏以水火分日夜以告時於朝箋云失漏刻之節東方未明而以為明庭燎注王有雞人之官凡國事為期則告之以時王不正其官而問夜早晚夜未渠央司馬穰苴傳立表下漏唐厯志大衍日度議周厯立夏日在觜觿二度於軌漏昬角一度中蒼龍畢見陸佐公曰自天觀象昏旦之刻未分治厯明時盈縮之度無準挈壺命氏逺哉義用揆景測辰徼宮戒井守以水火分兹日夜月令正義蔡邕以星見為夜日入後三刻日出前三刻皆屬晝周禮鼓人注司馬法曰昬鼓四通為大鼕夜半三通為晨戒旦明五通為發昫儀禮注日入三商為昬疏曰是漏刻之名馬氏云日未出日沒後皆云二刻半前後共五刻今云三商據整數而言漢太初漏刻前厯志公孫卿等議造漢厯立晷儀下漏刻以追二十八宿相距於四方隋天文志孝武考定星厯下漏刻以追天度劉向洪範傳記武帝時所用法云冬夏二至間百八十餘日晝夜差二十刻大率二至之後九日而增損一刻百官表太子率更令師古曰掌知刻漏梁漏刻經云九日加減一刻或秦之遺法漢代施用宋志漢武正儀審漏事在前史後禮儀志夜漏未盡七刻鍾鳴受賀西域傳杜欽曰斥候士百餘人五分夜擊刁斗自守注夜有五更分而持之夏賀良言增益漏刻哀帝詔漏刻以百二十為度董賢為郎傳漏在殿下奏時刻有漢舊儀傳呼唐厯志日度議曰日之所在難知驗以中星則漏刻不定漢世課昏明中星為法已淺今候夜半中星以求日衝近於得宻而水有清濁壺有增減或積塵所擁故漏有遲疾易乾鑿度注八卦生物謂歲之八節每一卦生三氣各得十五日今言晝六爻則中分之太史司漏刻者每氣兩箭由是生焉隋志漏刻經梁有後漢待詔霍融何承天楊偉等撰三卷亡漢書青煒登平考景以晷赤煒頌平考聲以律白煒象平考量以銓玄煒和平考星以漏漏刻漢漏品漏刻四十八箭夏厯漏東漢晷漏漏法令甲後漢律厯志永元十四年和帝待詔太史霍融上言官漏刻率九日增減一刻不與天相應或時至差二刻半不如夏厯密詔書下太常令史官與融以儀校天課度逺近太史令舒承梵等對案官所施漏法令甲第六常符漏品孝宣皇帝三年十二月乙酉下建武十年二月壬午詔書施行漏刻以日長短為數率日南北二度四分而增減一刻一氣俱十五日日去極各有多少今官漏率九日移一刻不隨日進退詩正義云一年有二十四氣又分為二通率七日强半而易一箭夏厯漏隨日南北為長短密近於宫漏分明可施行其年十一月甲寅詔曰告司徒司空漏所以節時分定昬明昬明長短起於日去極逺近日道周圜不可以計率分當據儀度下參晷景今官漏以計率分昏明九日增減一刻違失其實至為䟽數以耦法霍融上言不與天相應太常史官運儀下水官漏失天者至三刻以晷景為刻少所違失密近有驗今下晷景漏刻四十八箭立成周禮注云太史立成法官府當用者計吏到班予四十八箭取二十四氣日所在并黄道去極晷景漏刻昏明中星刻于下虞恭曰章帝厯度審正晷漏與天相應選注衛宏漢舊儀曰晝夜漏起省中用火中黄門持五夜甲乙丙丁戊夜也唐厯議東漢晷漏定於永元十四年四分法施行後十五歲也書正義漢初率九日增減一刻霍融始請改之鄭注考靈曜仍云九日增減一刻尚未覺誤也周禮疏漢法以器盛四十八箭箭各百刻蓋取倍二十四氣也後漢厯志孔壺為漏浮箭為刻下漏數刻以考中星昏明生焉漏刻之生以去極逺近差乗節氣之差桓譚新論曰余為郎典刻漏邯鄲五經析疑曰漢制又以先冬至三日晝冬至後三日晝漏四十五刻夜五十五刻先夏至三日晝夏至後三日晝漏六十五刻夜三十五刻東觀漢記樊梵駐車待漏初學記為器三重圓皆徑尺差立於方輿踟蹰之上為金龍口吐水轉注入踟蹰經緯之中流於衡渠之下蓋上鑄金為司辰具衣冠以兩手執箭此殷䕫之漏刻法也以銅為渴烏狀如鈎曲以引器中水於銀龍口中吐入權器漏水一升稱重一斤時經一刻此李蘭之漏刻法也選陸佐公曰衛宏載傳呼之節較而未詳霍融敘分至之差詳而不密注漢舊儀曰夜漏起宮中宮城門傳五伯官直符行衛士周廬擊木柝讙呼備火史記正義按馬融以昏明為限鄭玄以日出入為限故有五刻之差漢張衡漏水轉渾天儀制選注初學記張衡漏水轉渾天儀制曰以銅為器實以清水下各開孔以玉虬吐漏水入兩壺右為夜左為晝蓋上又鑄金銅仙人居左壺為金胥徒居右壺皆以左手抱箭一云左手把銀箭右手指刻以别天時蚤晚即厯志運儀下水晉漏刻賦銘晉起居注有永安宮銅漏刻太元十二年儲宮初建置漏刻史蕭子雲東宫雜記曰梁天監六年造新漏以臺舊漏給官漏銘云咸和七年山隂令魏丕造即㑹稽内史王舒所獻漏也水經注洛陽城門置一鐘以和漏鼓藉田賦挈壺掌升降之節宋志元嘉二十年何承天奏上尚書今旣改用元嘉厯漏刻與先不同宜應改革案景初厯春分日長秋分日短相承所用漏刻冬至後晝漏率長於冬至前且長短增減進退無漸非唯先法不精亦各傳寫謬誤今二至二分各據其正則至之前後無復差異更增損舊刻參以晷影刪定為經改用二十五箭請臺勒漏郎將考驗施用從之陸機賦挈金壺以南羅藏幽水而北戢擬洪殺於編鐘順卑髙而為級激垂泉以逺射跨飛途而遥集伏隂蟲以承波吞常流其如挹籠八極於千分度晝夜於一箭口納胷吐水無滯咽形微獨繭之緒逝若垂天之電積水不過一鍾導流不過一筳而用天者因其敏分地者頼其平悟蟾蜍之棲月識金水之相縁李充字弘度漏刻銘昬明旣序景曜不忒挈壺失節刺流在詩尺璧非寳重此寸隂昧旦丕顯敬聽漏音藝文類聚有後漢李尤銘又有李充銘孫綽銘靈虯吐流一作吐注隂蟲蝦蟆也承寫累筒三階積水成淵器滿則盈乗虚赴下王冀洛都賦挈壺司刻漏樽瀉流仙叟秉尺隨水沈浮元魏安豐王延明使祖暅作欹器漏刻銘後周王褒銘箭水無絶靈虬長注鮑照觀漏賦訪金壺之盈闕觀騰波之吞寫視驚箭之登沒墐户牖而知天掩雲霧而測暉梁漏刻銘漏經通典天監六年以舊漏乖舛敇員外郎祖暅治之漏刻成太子中舍人陸倕為文官漏出自㑹稽魏丕造積水違方導流乖則六日無辨五夜不分爰命日官草創新器俯察旁羅登臺升庫則于地四參以天一言壺用金而漏用水建武遺蠧咸和餘舛金筒方員之制飛流吐納之規變律改經一皆懲革天監六年丁亥十月十六日壬寅漏成可以校運算之暌合辨分天之邪正察四氣之盈虚課六厯之踈密金字銀書為銘曰一暑一寒有明有晦神通無跡天工罕代乃置挈壺是惟熙載氣均衡石晷正權概擊刁舛次聚木乖方爰究爰度時惟我皇方壺外次圓流内襲洪殺殊等髙卑異級靈虬承注隂蟲吐噏倏徃忽来鬼出神入微若抽繭逝如激電耳不輟音眼無留眄銅史司刻金徒抱箭合昏槿也暮卷蓂莢晨生尚辨天意猶測地情况我神造通幽洞靈配皇等極為世作程梁元帝銘曰碧海有乾綘川猶竭飛流五色涓涓靡絶箭不停晷聲無暫輟用天之正分地之平如絃斯直如渭斯清玉衡稱物金壺博施隋志梁有天監五年脩漏刻事一卷祖暅漏刻經一卷漏刻經一卷梁代撰皇甫洪澤雜刻漏法十一卷唐志刻漏經宋何承天一卷梁中書舍人朱史一卷陳太史令宋景一卷梁武帝大同十年改用一百八刻令祖暅為漏經初學記引梁漏刻經隋漏刻漏經欹器漏水宋元嘉漏刻又見上隋天文志黄帝創觀漏水制器取則以分晝夜其後因以命官周禮挈壺氏則其職也其法摠以百刻分于晝夜冬夏二至春秋二分減益昬旦隨氣增損冬夏二至之間晝夜長短凡差二十刻每差一刻為一箭冬至互起其首凡有四十一箭晝有朝有禺有中有晡有夕夜有甲乙丙丁戊昏旦有星中每箭各有其數皆所以分時代守更其作役漢興張蒼因循古制猶多疎闊及孝武考定星厯下漏水以追天度亦未能盡其理劉向為洪範傳記武帝時所用法云冬夏二至之間一百八十餘日晝夜差二十刻大率二至之後九日而增損一刻哀帝又改用一百二十刻尋亦寢廢光武亦以百刻九日加減法編於甲令為常符漏品至和帝永元十四年霍融上言官厯率九日增減一刻不與天相應或時差至二刻半不如夏厯漏刻隨日南北為長短乃詔用夏厯漏刻依日行黄道去極每差二度一分為増減一刻凡用四十八箭終於魏晉相傳不改宋何承天以月蝕所在當日之衝攷驗日宿知移舊六度冬至之日其影極長測量晷度知冬至移舊四日前代諸漏春分晝長秋分晝短長過半刻皆由氣日不正遂議造漏法南史承天定元嘉厯改漏刻用二十五箭唐志承天刻漏經一卷春秋二分昏旦晝夜漏各五十五刻齊及梁初因循不改至天監六年歲在丁亥武帝以晝夜百刻分配十二辰辰得八刻仍有餘分乃以晝夜為九十六刻一辰有全刻八焉至大同十年又改為一百八刻依尚書考靈曜晝夜三十六頃之數因而三之冬至晝漏四十八刻夜漏六十刻夏至晝漏七十刻夜漏三十八刻春秋二分晝漏六十刻夜漏四十八刻昏旦之數各三刻先令祖暅為漏經隋志一卷皆依渾天黄道日行去極逺近為用箭日率陳文帝元嘉中亦命舍人朱史造漏依古百刻為法周齊因循魏漏晉宋梁大同並以百刻分于晝夜隋初用周朝尹公正馬顯所造漏經至開皇十四年鄜州司馬袁充上晷影漏刻以短景平儀均布十二辰立表隨日影所指辰刻以驗漏水之節十二辰刻互有多少時正前後刻亦不同其二至二分用箭辰刻之法今列之袁充素不曉渾天黄道去極之數其於施用未為精密十七年張胄元用後魏渾天鐵儀測知春秋二分日出卯酉之北不正當中與何承天所測頗同仁夀四年劉焯上皇極厯胄元及焯漏刻並不施行然其法制著在厯術最為詳密大業初耿詢作古欹器以漏水注之獻于煬帝善之因令與宇文愷依後魏李蘭一作道士李蘭所造修道家上法稱漏制造稱水漏器以充行從又作候影分箭上水方器置於東都乾陽殿前鼔下司辰又造馬上漏刻以從行辨時刻揆日晷下漏刻此二者測天地正儀象之本也晷漏沿革今古大殊故列其差以補前缺何妥曰比年改作者多如范威漏刻十載不成趙翊尺秤七年方决唐太極殿漏刻鐘鼓樓車服志太極殿前漏刻所亦以左契給之右以授承天門監門晝夜勘合然後鳴鼓儀衛志百官班于殿庭左右循使二人分涖于鐘鼓樓下漢長樂宮有鐘室南朝有端門鼓漏景陽樓鐘隋唐殿庭有樓置鐘鼓唐漏刻武徳漏刻大唐漏刻經志厯筭大唐刻漏經一卷又見上傅奕傳武徳時所改漏刻皆詔奕云厯志開元大衍厯議五曰步軌漏術有漏刻陟降率冬至降七十八大雪陟七十八陟降不等皆以三日為限百官志祠部掌天文漏刻司天臺五官挈壺正二人司辰八人漏刻博士六人掌知漏刻凡孔壺為漏浮箭為刻以考中星昏明更以擊鼔為節點以擊鐘為節長安二年置挈壺正乾元元年與靈臺郎保章正司厯司辰加五官之名乾元三年置春夏秋冬中五官正掌司四時有漏刻生四十八典鐘鼓三百五十人初有視品典事後省六典周禮夏官挈壺秋官司寤春官雞人凡三職漢已後太史掌之隋置漏刻生三百六十人箭有四十八太子率更令掌漏刻令博士教之掌漏典之漏童司刻分時唱之元和中置百官待漏院景龍二年十二月太史令傅孝忠奏凖漏經南北陸並日校一分詩東方未明疏案乾象厯及諸厯法與今太史所候唐開元漏刻晉志大衍厯五曰步軌漏術陟降率漏刻冬至降七十八二十七刻二百三十分至大雪陟七十八二十七刻百三十五分陟降不等皆以三日為限各置初日陟降率依限次損益之二至各於其地下水漏以定當處晝夜刻數乃相減為冬夏至差刻半之以加減二至晝夜刻數為定春秋分初日晝夜刻數乃置每氣消息先數㑹要金吾衛貞元三年閏四月八日敇四月一日已後五更二㸃放鼓契九月一日已後五更三㸃放鼓契日出後二刻傳㸃三刻進坐牌劉鄴待漏院詩有勘契之語含元殿賦節晷漏於鍾律架危樓之筍簴儀衛志有行漏轝刻漏生四人分左右景德漏院雞唱詞景徳四年九月辛巳司天監言殿前漏刻報時雞唱唐朝有詞自朱梁以来廢棄止唱和音請别制新詞習唱自今每大禮御殿登樓入閤内宴晝改時夜改更則用之常時改㸃則不用詔兩制詳定晁迴等以為合於周官雞人嘑旦之義因詳正舊詞付之習唱其詞自朝光發至日入酉凡二十七句自日欲暮至戊夜癸凡十八句大抵言晝夜之節如太階平夢良臣求衣始之語則主乎規諫也周禮雞人下士一人嘑旦巾車鳴鈴以應之書傳太師奏雞鳴於階下夫人鳴珮玉於房中告去應門擊柝告辟也衛宏漢舊儀載傳呼之節應劭曰楚歌今雞鳴歌蔡質漢儀衛士候朱爵門外傳雞鳴於宮中晉武泰始二年正月庚寅罷雞鳴歌唐王維詩綘幘雞人送曉籌尚衣方進翠雲裘本朝禁中有更㸃在長春殿門之外更以鼓㸃以鉦因警戒於夙宵遂弗迷於風雨始惟呼旦取象司晨雞旣鳴矣朝旣盈矣釋庭燎之詩者謂不正雞人之官天聖蓮花漏景祐水秤天聖八年八月龍圖閣待制燕肅上蓮花漏法其制琢石為四分之壺剡木為四分之箭以測十二辰二十四氣四隅十干洎百刻分布晝夜箭四面面二十五刻刻六十分四面百刻總六千分以效日面千五百分晝夜總六千分凡四十八箭一氣一易二十四氣各有晝夜故四十八箭歲統二百十六萬分悉刻箭上鑄金蓮承箭銅烏引水而下注金蓮浮箭而上登不假人力其箭自然上下司晨者謹視而易之其行漏之始又依周官水地置臬之法考二交之景得午時四刻十分為午正南北景中以起漏焉其法置水於櫃引以渴烏導以銅荷水自荷茄下注於壺壺中為金蓮花覆之荷心有竅容箭下挿方水之未注也箭首適與花平逮水旣至箭則隨起視箭所底而時刻可以坐致矣肅作于梓潼来獻門下九月詔司天監王立等與挈壺正考定其法於鐘鼓樓下立等言黄道日躔進退盈縮度數不應今崇天厯不可施用罷之景祐元年九月十一日肅奉詔於資善堂與司天少監楊惟徳測騐並合天道而知制誥丁度等詳定以為難久行二年四月己未詔學士章得象馮元與肅同議九月乙未詔司天監製百刻水秤以測候晝夜三年二月丙辰復命得象等重定水秤刻漏四月辛亥得象言水行有遲疾請增用平水壺一渴烏二晝夜箭二十一於鐘鼓樓測量漏水蓋凡定奪三年而卒用蓮花漏焉壺以貯水烏以引注秤以平漏漏以識刻肅所至皆刻石以記其法所臨州郡必為之雖巧者莫能損益又為海潮論二篇造指南記里鼓車夏竦潁州蓮華漏銘序舜史日永星火晝漏多也日短星昴晝漏少也周官有以火爨鼎之制齊詩有折栁樊圃之譏漢令甲第六著常符漏品施於李蘭始變古法權器程水以準時刻唐之諸道率循此制至今器存莫能施用唯司天官漏迄今用之參以中星因時升降而置箭之制世不復傳景祐中更為潁漏其漏志一篇刋諸左方再考晷度以梓潼在南比古法晝增一刻夜損一刻青社稍北晝增三刻夜損三刻潁處梓青之間晝増二刻夜損亦如之作室秘漏得天愈密銘曰極星建中黄道營外度有邇遐時有明晦聖人觀象女史詒則孔壺為漏浮箭為刻資始巧歴稽合小餘重黎是司羲和是圖秦氏遺法漢京垂制歴世彌文舊規加麗玉虬吐水分灌兩壺金龍轉注下激衡渠天道可觀神化無跡日運波澄氣分箭易猗嗟燕君文學餘力博貫舊章肇新景式象魏旣登潼川旣營建于青闉作于潁廷五夜持宵三商定夕儀禮注日入三商為昏尚書緯謂刻為商杪忽無差升降靡息意侔造化數窮天地茫茫有生孰參其智於鑠聖宋世祚無疆刋此樂石永憲萬方徐州用衛朴所造有壺無箭通守傅楊得肅之法改作蓮花漏蘇軾為銘天地之寒暑日月之晦明昆侖旁薄於三十八萬七千里之外而不能逃於三尺之箭五斗之缾如缾受水不過其量如水浮箭不失其平天有晝夜人為刻辰昔在黄帝制器以分周設六官挈壺令軍惟漢暨晉變律改經臣肅思妙創為度程壺以石琢箭以木成渴烏上引荷茄仰承水注壺口箭湧蓮心自子徂亥兹焉取平二十四氣或虧或盈箭實倍之隨氣以更辰有長短刻因損增惟箭無私與水皆升風雨不廢如雞之鳴銖兩莫差如衡之稱銘中興書目蓮花漏法一卷李肇國史補云越僧靈澈取銅葉製器為蓮花漏置盆水之上底孔漏水半之則沈每晝夜十二沈為行道之節皇祐漏刻文徳殿漏刻國史志自黄帝觀漏水制器取則三代因以命官則挈壺氏其職也後之作者或下漏或浮漏或浮刻或輪漏或權衡制作不一國朝司天之屬有挈壺正掌司辰刻置文德殿門内之東偏設鼓樓鐘樓於殿廷左右刻漏之法有水秤以木為衡衡上刻䟽之曰天河志云以水為權衡其廣長容水箭箭有四木為之長三尺有五寸著時刻更㸃納於天河中晝夜更用之衡右端有銅鍰連鈎為銅覆荷形荷下銅索三條以繫銅壺又為髹漆大奩曰水櫃中安銅盆曰水海銅盆隅有銅渴烏一引水下注壺中衡左端有大銅鍰貫衡鍰下大銅索連銅權為立象形又有鐵竿髙五丈於鐵蓮跗中屈上端為方鍰形曰雞竿每移改時刻司辰者以衡尾納方鍰中以組繩挽權上大銅鍰進退之秤之所繫以大木雙植有跗如鐘簴之制畫五采金龍為飾上有鐵胡門大鐵鈎鍰以繫之其制度精巧不知作者為誰蓋唐五代用之久矣漏刻每遇添減必移報門司及皇城門與鏁門使臣常以卯正後一刻為禁門開籥之節每時八刻二十分每刻一擊鼓八鼔後進時牌牌有七以象牙刻金字餘二十分為雞唱唱絶擊一十五鼓為時正一本至景祐三年再加考定而水有遲疾用有司之議增平水壺一渴壺二箭二十一然時刻相侵殆半至皇祐初詔舒易簡于淵周琮更造用平水壺重均調水勢分百刻於晝夜後晉馬重績言漏刻之法以中星考晝夜為一百刻八刻六十分刻之二十為一時時以四刻十分為正此自古所用也請依古改正從之熙寧迎陽門觀浮漏熙寧晷漏書元豐浮漏又見前神宗即位之初星辰不正上令别造儀漏改正厯書久而未成熙寧五年九月提舉司天監沈括言楚州人衛朴精於術學乞令赴監參校得失六年六月辛巳上令朴創造浮漏七年六月乙酉括乞以新製浮漏於迎陽門進呈上從之丁亥上御門召輔臣觀之令於翰林天文院安置初括上浮漏議言凡播水之壺三受水之壺一曰求壺曰度壺曰複壺曰建壺又言制器之法及下漏之法㑹要其年六月二十一日丁亥崇政殿召輔臣觀沈括云厯家言晷漏者自顓厯至今見于世者二十五家謂之大厯其歩漏之術皆未合天度今考數下漏成書四卷謂之熙寧晷漏元豐五年正月學士王安禮言詳定渾儀官歐陽發言至道皇祐之器皆差今造渾儀浮漏木様進呈臣等看詳司天監浮漏疎謬乞依新様改造從之沈括筆談云更造渾儀創為玉壺浮漏銅表皆置天文院元祐漏刻元祐元年蘇頌造渾天儀象又製刻漏四曰浮箭漏曰秤漏曰沈箭漏曰不息漏置别室與儀象互參考浮箭秤漏與今太史朝堂所用畧同沈箭不息漏采他法式紹興刻漏刻漏圖紹興二年六月十四日詔西安進士陳元助製刻漏一座送尚書省補其子為局生乾道三年造厯劉孝榮上二十四氣晝夜進退日出沒刻立成之法祥符三年春官正韓顯符上二十四氣晝夜刻立成法㑹要取其氣節之初裁之書目紹興初太常博士王普撰官厯刻漏圖一卷并序言百刻分十二辰晝夜長短以岳臺為定九服之地冬夏至晝夜刻數或與岳臺不同則二十四氣前後易箭之日亦皆少差又有後記及蓮華漏圖行漏法一卷不知作者以周官軍事垂壺司馬穰苴立表下漏此古行漏見于書者也今此表漏測景之法簡而易知殆古之遺法洪邁新刻漏銘有智者創為一筩方不能以尺挹水中居竅其顛以受箭氣敘長短刻于箭間以昔之升為今之降水盡箭沈一日終矣又挹水如式以伺夜漏維天蒼蒼維地直方日星昭光宰其隂陽燠夷寒涼隠顯迭相孰為測量肆有智囊緘機翕張制乃短長四周其皇如轅服箱水聲宫商洩若綫芒箭之揚揚匪棘匪詳由髙而藏有退不卬大明煌煌夜漏未央注之天漿視我作綱挈壺保章周制則亡蓮華洸洸於用或妨勒銘以颺與燕雁行堯典正義古今厯術與太史所候皆云夏至晝六十五刻夜三十五刻冬至晝四十五刻夜五十五刻春秋分晝五十五刻夜四十五刻此不易之法也然今太史細候之法則校常法半刻從春分至夏至晝漸長增九刻半夏至至秋分所減亦如之秋分至冬至晝漸短減十刻半冬至至春分増亦如之又於每氣之間增減刻數有多有少不可通而為率南史陳沈洙議漏刻今古不同漢書律厯何承天祖冲之父子漏經並自闗鼓至下鼓晡鼓至闗鼓皆十三刻冬夏四時不異其日有長短分在中時前後今用梁末改漏下鼓之後分其短長夏至之日各十七刻冬至之日各十二刻易氏周禮說云挈壺之制以唐制推之水海浮箭四匱注水始自夜天池以入于日天池自日天池以入于平壺以次相注入于水海浮箭而上以浮箭為刻分晝夜計十二時每時八刻二十分每刻六十分箭四十八二箭當一氣歲統二百一十九萬一千五百分悉刻於箭上銅烏引水而下注浮箭而上登至於晝夜之别分至之候冬夏長短昏曉隠見與周官晷景無差太玄經植表施景揄漏率刻注揄寫也寫水下漏審刻知時挈壺掌分數之令太史陳立成之法軍將以之垂闕壺郎以之趨奏弘度遺篇承天垂㫖可使大禹日惜寸隂可使宣王夜知向晨自古在昔挈壺有職匪器則弊人亡政息其政謂何弗棘弗遲君子小人興息維時勿謂小器雖廢何傷齊侯見刺顛倒衣裳挈壺弛職風人所譏作器能銘大夫之責靈虯傳箭凡黄道升降差二度四十分則隨厯増減改箭每時初行一刻至四刻六分之一為時正終八刻六分之一則交入次時天道之妙千歲可致而基於一刻之弗差治道之盛庶績咸熙而原於寸隂之無曠昕夕監觀宜有成則器若小而用實重者惟漏為然玉海卷十一
