body:
  text: 玉海卷一百九十七宋王應麟撰祥瑞植物瑞榖神農嘉榖朱禾九穗黃帝嘉禾堯嘉禾夏殷嘉禾禮含文嘉神農就田作耨天應以嘉榖拾遺記炎帝教民耒耜百榖滋阜神芝發其色靈苖擢嘉穎朱章蔓於階卿雲藹於岩周書云神農時天雨粟瑞應圖神農時雀銜九穗朱禾墜地夏時嘉禾二本同秀殷時嘉禾同本異秀其大盈車徐整正厯曰黃帝時嘉禾為種帝王世紀堯時嘉禾孽於𤱔詩含神霧曰堯時嘉禾莖三十五穗晉中興休祥説曰嘉禾者仁草也夏時異本同穎殷時同本異秀周時三穎同秀山海經帝之下都崑崙之墟有木禾郭璞曰榖類也後魏地形志羊頭山下神農泉北有榖關即神農得嘉榖處宋志王者德盛則二苖同秀于周德三苖共穗於商德同本異穟於夏德異本同秀管仲曰古之封禪鄗上黍北里禾以為盛伊尹曰元山之禾南海之秬不周之粟孫氏瑞應圖嘉禾五榖之長王者德茂則生堯嘉種詩生民誕后稷之穡有相之道誕降嘉種維秬維秠維穈維芑傳秬黑黍秠一稃二米穈赤苖芑白苖箋云天應堯之顯后稷故為之下嘉種選張協七命曰大梁之黍瓊山之禾唐稷播其根農帝嘗其華周嘉禾嘉榖書序唐叔得禾異𤱔同穎獻諸天子王命唐叔歸周公于東作歸禾周公既得命禾旅天子之命作嘉禾漢書引書逸嘉禾篇曰周公奉鬯立于阼階韓詩外傳三苖同一秀史記唐叔得嘉榖獻之成王白虎通成王時有二苖異𤱔而生同為一穟大幾盈車長幾充箱民有得而上之者成王訪周公而問之公曰三苖為一穟天下當和為一乎果有越裳氏重譯而來獻白雉古文尚書一隴合為一穗尚書大傳三苖貫葉一作貫桑而生子為一穗周公曰和氣所生以獻于文王之廟瑞應圖三本同穗孔叢子魏王問子順曰上天神異后稷為之下嘉榖周遂以興詩屢豐年周黃􅓿釐牟選班固典引姬有素雉朱烏元秬黃􅓿之事君臣動色左右相趣亦有寵靈文武貽燕後昆注韓詩外傳貽我嘉􅓿詩臣工於皇來牟將受厥明箋云赤烏以牟麥俱來思文貽我來牟帝命率育箋火流為烏五至以榖俱來出泰誓生民麻麥幪幪劉向傳諸侯和於下天應報於上故周頌曰降福穰穰又曰飴我釐牟釐牟麥也始自天降此皆以和致和獲天助也廣韻䅘牟之牟一麥二稃周受此瑞麥出埤蒼周華黍詩序華黍時和歲豐宜黍稷也甫田曾孫之稼如茨如梁曾孫之庾如坻如京乃求千斯倉乃求萬斯箱黍稷稻梁農夫之慶大田多稼豐年多黍多稌良耜黍稷茂止穫之挃挃積之栗栗其崇如墉其比如櫛漢嘉榖六穗嘉榖元稷嘉禾秬秠史記相如封禪書䆃一莖六穗於庖䆃瑞禾也頌曰嘉榖六穗我穡曷蓄匪惟雨之又潤澤之漢紀宣帝神爵元年三月詔曰乃者元康四年嘉榖玄稷黑粟也降于郡國古今注武帝建元四年天雨粟宣帝地節三年長安雨黑粟元康四年雨黑黍王褒講德論甘露滋液嘉禾櫛比後漢紀光武生於建平元年十二月是歲濟陽縣界有嘉禾生一莖九穗因名曰秀明帝永平十一年時麒麟白雉醴泉嘉禾所在出焉魯恭為中牟令建初七年嘉禾生恭便坐廷中尹以檄勞曰物産之化流行天降休瑞古今注和帝元年嘉禾生濟隂城陽一莖九穗安帝延光二年六月九真言嘉禾生百十六本七百六十八穗秦彭為潁川大守有嘉禾之瑞爾雅秠一稃二米郭璞注漢和帝時任城生黑黍或三四實實二米得黍三斛八斗宋志漢元和中秬秠生郡國秬鬯王者宗廟修則出漢野榖旅生紀建武二年初王莽末天下旱蝗黃金一斤易粟一斛至於野榖旅生麻菽尤甚旅寄也不因播種而生故曰旅今字書作穭音吕古字通建武五年野榖漸少田畝亦廣焉論衡建武三十一年陳留雨榖榖形若苡而黑宋慶厯六年十二月渠州言野榖穭生民飢之侯也漢嘉麥嘉榖建武中張堪為漁陽太守開稻田百姓歌曰桑無附枝麥穗兩岐張君為政樂不可支南史齊東郡太守孟業得麥一莖五穗宋志章帝元和中嘉麥嘉禾生郡國章紀章和元年詔曰嘉榖滋生改元云云元和四年見總瑞類典引嘉榖靈草應圖合諜漢大有年又見食貨紀永平九年大有年十年二月詔昔歲五榖登衍今兹蠶麥善收其大赦十二年歲比登稔百姓殷富粟斛三十牛羊被野東京賦度秋豫以收成觀豐年之多稌嘉田畯之匪懈行致賚于九扈所貴惟賢所寶惟榖唐麟德二年大有年春秋桓三年冬有年宣十六年冬大有年榖梁傳五榖皆熟為大有年公羊傳大有年何以書以喜書也有年僅有年也大有年大豐年也魏嘉禾黃初元年郡國三言嘉禾生曹植魏德論謳曰猗猗嘉禾惟榖之精其洪盈箱協穗殊莖昔生周朝今植魏庭獻之廟堂以昭祖靈魏都賦雍丘之梁清流之稻吳黃龍三年夏由拳野稻自生改禾興縣冬十月會稽南始平言嘉禾生十二月改元嘉禾晉嘉禾嘉麥宋嘉禾宋志晉武太康四年十二月嘉禾生扶風雍五年七月生豫章南昌太康八年閏三月生東夷校尉國九月生東萊液十年六月嘉麥生扶風一莖四穗又晉起居注武帝元帝世嘉禾三生其莖七穗月義熙十三年嘉禾九穗泰始八年十瀘水胡玉獻嘉禾晉志正旦大會歌醴泉湧流中唐嘉禾生穗盈箱應貞傳宴射賦詩曰嘉禾重穎蓂莢載芬宋元嘉二十二年六月嘉禾生藉田一莖九穗二十四年七月乙卯嘉禾旅生華林園及景陽山太尉江夏王義恭上嘉禾甘露頌昔在放勳厯莢數朝降及重華倚扇清庖沈演之上嘉禾頌梁中大通三年蕭映作嘉榖頌元嘉二十三年醴湖屯生嘉粟一莖九穗二十五年六月壬寅嘉禾旅生華林園十株七百穗壬子嘉黍生藉田大明元年嘉禾生清暑殿鴟尾中一株六莖有贊唐嘉麥武德元年五月隴州獻嘉麥六月虞州獻嘉麥一莖六穗八月永州獻嘉禾異畝同穎二年七月益州獻嘉禾一莖六穗四年二月肅州獻嘉禾一莖五穎貞觀二年六月長安獻嘉禾三年十二月潞州獻嘉禾景雲二年六月洛州言兩岐麥玄宗先天二年八月懷州言嘉禾四穗開元八年五月平原麥一莖兩岐分秀九年五月絳州奏瑞麥七莖兩穗一莖四穗十二年六月乙巳河南告成縣瑞麥生穗分岐一莖三秀十三年五月甲申瑞麥生河南之夀安舊紀貞觀五年五月戊辰宋州麥一莖九岐者百餘本三年閏五月戊午陜虢李泌獻瑞麥一莖五穗任爰瑞麥賦隴麥登芳芃芃于野漸漸其秀將嗣榖以登年豈凌霜而不茂髙揚庭賦芒纎纎而擢隴葉青青而聳翠凌玉霜而表徑挺金莖而孤直實穎實栗是崇是奉含實珠淨耀芒鋒起詩稱沫北歌述漁陽崔融賀嘉麥表纎芒濯露香稼搖風降之自天何必來牟之詠嘗之于廟先符孟夏之時一穗兩岐徒説張君之詠十畝千石方輕汜氏之書郭子儀奏瑞禾云天啓興王瑞先百榖故漢稱雨粟周頌來牟至德二年七月朔方許敬宗麥秋賦應制對銀縚而偶穟並金縷而分芒唐穭稻再熟稻紀開元十九年是歲揚州穭稻生九月乙未任丘嘉禾生庚申永康一莖五穗會要開元十九年四月一日己卯揚州奏穭生稻二百一十五頃再熟稻一千八百頃其粒並與常稻無異代宗永泰元年夏盩厔穗麥生滄州魯城乾符元年生野稻水榖二千餘頃林邑國稻歲再熟唐潞州嘉禾合穗見十九瑞唐豫州嘉禾嘉禾圖乾元元年五月十九日代宗立為皇太子生之歲開元十四年十月十三日生豫州獻嘉禾於是以為祥更名豫十月五日更名會要元和七年十一月梓州言東川潘孟陽奏龍州界武安縣嘉禾生有麟食之每來一鹿引之羣鹿隨之使畫工就圖之并嘉禾一函以獻栁宗元賀幽州華州嘉禾圖表六穗稱於漢臣異畝書於周典貞元二十一年七月又賀劔南成都進嘉禾圖陜州紫芝草表獻於王庭唐叔慙同穎之異薦諸郊廟班史謝連葉之竒既呈薿薿之祥更覩煌煌之秀潘炎嘉禾合穗賦雙米一桴孤莖六穗韓愈奏汴州嘉禾云兩根並植一穗連房獨孤及賀潞州芝草嘉禾表庶政方乂二瑞薦臻唐叔之獻齊房之歌古今同契唐瑞粟會要太和二年福建進瑞粟一十莖中書門下奏伏以陛下勤求理本澄清化源不以靈芝白烏為瑞應方將時安人和為嘉祥宸翰照宣睿情斯屬請自今祥瑞但申有司更不令進獻依奏大中二年七月十六日福建觀察使殷儼進瑞粟十二莖莖有五六穗乾德禾九穗圖乾德二年十二月乙卯睂州進禾生九穗圖乾德嘉禾乾德四年京兆果州進嘉禾十月十九日和峴請作嘉禾等曲見樂章乾德兩岐麥乾德四年五月五日己巳耀州貢兩岐麥乙亥開封府貢庚辰單州貢壬午澶州貢麥兩岐至六歧者凡一百七十五本製瑞麥旗雍熙二年五月壬戌亳州獻兩歧秀麥太平興國嘉禾瑞麥雍熙嘉禾詩淳化嘉禾合穗圖興國三年八月壬戌眉州言嘉禾生滑州言黃河清十月甲子荆南言江陵縣稻再熟五年正月癸未歙州言稻再熟八年九月庚辰梓州奏禾一莖五十七穗畫圖以獻雍熙三年十月辛丑益州貢禾一莖九穗興國九年諸州瑞麥兩穗三穗者連歲來上有司請為瑞麥曲薦于廟七年九月己亥滑州奏嘉禾一莖四穗雍熙三年九月簡州奏禾一根二莖其穗或八或九四年九月辛酉朔濰州進嘉禾御製嘉禾合穗五七言詩二首賜宰相李昉等淳化三年九月乙卯潞州言嘉禾異隴合穗圖以獻詔示近臣至道元年七月癸酉眉州言嘉禾一莖二十四穗淳化瑞麥圖五年五月壬子亳州獻瑞麥圖有分四歧三歧兩歧者九月庚戌朔礠州言嘉禾合穗畫圖來獻以示近臣淳化元年十月丙寅閬州言麥秀兩歧至道二年七月己亥朔綿州言麥秀兩歧十二月丙午處州言稻再熟至道瑞麥圖至道三年真宗即位五月甲戌夀州貢緑龜又上瑞麥一本百枝五穗圖丙戌合州獻麥兩穗圖丁亥黃州獻麥兩歧圖咸平四年五月己亥亳州言麥一莖兩穗六月戊午益州言麥秀兩歧祥符二年七月乙丑梓州言甘露降麥五歧三年六月戊申朔同州言麥五歧七月癸未原州言木連理麥四歧四年七月己亥光州言麥八歧九年五月辛未施州言麥兩歧天禧三年四月壬寅製玉宸殿觀瑞麥七言詩賜近臣五月辛巳開封言麥一莖兩穗咸平嘉禾景德嘉禾圖祥符嘉禾圖嘉榖詩咸平元年七月戊寅遣中使持後苑嘉禾一莖二十四穗示輔臣丙戌雅州言禾一莖十七穗二年九月壬寅徐州言禾一莖五穗戊申梓州禾一莖九穗十月辛亥洺州嘉禾合穗景德元年正月乙未趙州獻嘉禾合穗圖四年十月己亥廣成軍上嘉禾芝草圖九月乙酉衛州戊子德州獻嘉禾圖祥符元年十月壬辰嘉州言禾九穗木連理三年十月己酉嵐州言嘉禾合穗四年十一月辛未隰州言異畝同穎六年七月己未召輔臣觀粟于後苑有一本七穗至二十四穗者復閲御書及嘉禾圖上作嘉榖詩賜近臣是日皇太子從遊八月甲子出後園嘉榖圖示近臣翌日朝堂示百官夏竦和嘉榖詩瓊粒蕃滋龍枝屈曲搖風秀色交卿靄垂穎餘光近帝星東極龍枝環丘玉粒進瑞稻圖狀初擢一莖異劉欽之界內乍分三穗疑蔡茂之夢中維揚昔日追愧穭生南海遐方遙慚九熟禾遜竒於同穎麥貽誚於兩岐掩周祖之維穈陋漢宣之靈稷天孫助祭願陪北里之禾清廟薦新敢繼神倉之榖景祐三年九月榮州言禾一莖九穗慶厯二年八月己亥河南府言夀安縣嘉禾合穗皇祐五年三月資州言嘉禾一莖九穗及甘露降熙寧八年七月禮部言定州榖五隴合一穗成德軍嘉禾合穗九年七月又言渠州粟一苖九穗忠武軍麥秀兩歧鳳翔二縣一枝六穗火山軍深欣濵州嘉禾合穗元豐二年十一月袁州粟一莖八穗至十一穗三年齊州禾一莖五穗睂州九穗越州二本合穗大觀四年九月右相張商英言袁州産瑞禾髙踰九尺分布七穗上瑞禾圖宋大雅