木九日居下枝一日居上枝十日所浴搴弱水之九衢玩密山之五色迷榖四照之異文玉五色之竒穆天子傳天子觀姑繇之木注大木也漢華平文選東京賦植華平於春圃薛綜注華平瑞木也天下平其華則平有不平處其華則向其方傾李善曰孝經援神契曰德至於地則華平盛瑞應圖曰木名藝文類聚東觀漢記曰章帝元和二年芝英華平日月不絶載於史官不可勝紀册府元龜自元和二年至章和元年華平見郡國宋志其枝正平王者有德則生德剛則仰德弱則低漢元和中生郡國瑞應圖其枝平王者政令均則生類要天子孝德屬於四海故有華平瑞應圖以雙蓮為蘋梁簡文南郊頌紫脫神草華平瑞芝唐貞觀十七年五月雍州獻三足烏己未湖州言甘露降潤州言慶雲見華平出於玄武門之池顔師古聖德頌華平挺幹朱草曜芒揚雄傳甘泉賦注如淳曰并閭其葉隨時政政平則平政不平則傾師古曰如氏所説自是平慮耳吳淑事類草賦云蓂莢屈軼之祥濶逹華平之瑞漢孝竹頌見頌類今慈竹也魏連理木文帝紀注連理之木同心之瓜五采之魚珍祥瑞物雜沓其間魏都賦德連木理仁挺芝草延康元年木連理芝草生於樂平郡黃初初郡國二言木連理晉木連理宋志晉武泰始元年十二月至太康十年十一月木連理二十八干寶記咸寧三年至太康元年木連理心生泰始二年六月壬申嘉奈一蒂十實生酒泉成帝咸和六年庾亮獻嘉橘一蒂十二實宋孝武大明中芳香琴堂雙橘連理改連理堂湛方生木連理頌同根連柯本支俱昌晉元帝太興三年十一月木連理生零陵孝武太元十九年正月丁亥華林園延賢堂西北李連理隋志木連理頌二卷晉太元十九年羣臣上宋珊瑚連理大明七年正月己酉珊瑚連理生鬱林珊瑚鈎王者恭信則見唐玉華宮木連理武德二年二月涪州言李連理貞觀十八年十月八日山南獻木連理交錯玲瓏有同羅木目一丈之幹並并枝者二十餘所二十一年正月玉華宫李木連理隔澗合枝一云二十二年常衮賀太清宫連理奈云必有削衽之類亦表強幹之休潘炎李連理賦族茂宗榮盤枝合理陳諷連理木賦靈根得地聳質齊芳分條表異合幹呈祥膚含玉潤文蔚龍章雲交翼壯影附枝強晉得華林漢生廣殿韓愈河中府連理木頌唐太原甘棠連理開元十一年正月幸北都紀功太原府之南街有連理李及連理甘棠生於太原縣權德輿賀連理棠云珍木敷榮異根合幹潞州李連理見十九瑞許州棠連理上官説進圖栁宗元有賀表唐瑞木大厯十二年五月甲子成都人郭逺獲瑞木一莖有文曰天下太平四字獻之宰臣奏賀曰至德之化先賁草木太平之時遂形文字望藏祕閣付史館葉鏤五衢榮分四照交屈軼友賔連潤矞露瀏祥風枝以萬年為名木以五衢稱瑞平慮羅植於階戺朱草叢生於庭霤崔融表開陽門之肇建飛柱潛移太極殿之初營浮梁逺至唐瑞橘李德裕瑞橘賦序曰漢武致石榴於異國靈根遐布此西域柔服之應魏武植朱橘於雀園華實不就乃吳人未格之兆天寶十載九月宫柑結實與江劔無殊李嶠賀靈桃四實共蒂又賀瑞桃云漢宫留核衛國報瓊梁元帝詠連理木云江浦同心橘上苑合歡枝唐瑞栁建中末中書省有枯栁德宗自梁還復榮茂人以為瑞栁禮侍吕渭令貢士賦之貞元十三年丁丑試西掖瑞桞賦漢書仆栁起於上林而宣帝即位乾德瑞木成文乾德六年和峴言國朝合州進瑞木成文者合播在管絃薦於郊廟詔峴作瑞木等樂章開寶木連理圖祥符崇政殿龍圖閣瑞木慶厯紹興瑞木開寶五年三月眉州木連理畫圖來獻六月癸丑和州木連理畫圖來獻興國二年十月壬申鄆州言平隂縣柞木連理五年十月丙申資州言梅青棡二木合成連理九年七月癸酉鳳翔奏青楊木連理景德元年四月己巳萊州獻木連理圖四年三月丙辰德州言棠榆二木連理祥符元年撰瑞木曲六月乙卯出並蒂瓜桃示輔臣二年五月丙寅召近臣崇政殿觀瑞物百餘種凡瑞木十有三三年八月甲寅召近臣觀瑞木於龍圖閣有文字者有佛手蛇形北斗七星形者各一十月戊申開封言尉氏木連理楊侃賦爰有仁木應乎嘉瑞二棠合生雙榆連理良宰畫圖大尹奏異五年十一月戊申襄州言瑞木有文如龍魚鳳鶴之狀天聖元年二月河陽栁二本連理慶厯三年十二月灃州獻瑞木有文曰太平之道隸書四字詔送史館劉敞作頌曰上天之載兮無臭無聲眷我聖德兮告以太平非筆非墨兮自然而成木仁也所以明天子之仁河圖洛書與今之瑞木皆文字顯明者也諫官歐陽修請詔天下毋獻祥瑞從之元豐三年唐州甘棠木連理紹興十四年四月六日虔州言木柱內有天下太平年五字詔送史館十五年作瑞木成文曲厚坤效珍嘉木紀瑞端拱合歡木圖祥符連理槐柏詩槐杏連理圖端拱元年八月辛巳廣州言清逺縣有合歡木髙百餘尺今年三月十日有鳳髙六尺栖集其上衆禽從之木下生芝草三莖畫圖來獻二年十二月辛亥舒州得瑞木文成大吉二字以獻順五事則木得其宜惟一德則動罔不吉祥符六年三月丙申宴後苑詔從臣觀苑中連理槐屏風連理柏丁酉上作五七言詩二首賜近臣和二月丁卯清心殿宜聖東殿園木連理上作七言詩二首賜近臣夏竦和御製太清樓屏風柏連理詩云非煙結翠滴露凝華雍熙初溫州進瑞木成文魏宸作詩賦以獻咸平二年十月癸酉商州貢連理木圖祥符二年正月丁巳朔出昭應宫瑞木斷之有文如點漆體若𣑽書四年三月甲申幸西京應天院觀院之連理木五年四月甲辰瑞聖園槐杏連理繪圖以示輔臣爰有嘉木含章自天宛成洛畫粲若奎躔珍符顯著靈意昭宣永告洪業時萬斯年天聖七年瑞木曲匪刻匪雕具文見意三登太平允協聖治紹興十五年瑞木曲直幹旁合繁枝內附四夷賔將耀我王度祥符元年晏殊連理木贊化洽八方之占仁及庶類之應祥符木連理九年七月丁未信州言甘棠連理八月己卯鄧州言木連理天禧元年正月丙寅韶州獻瑞木文曰天下太平三年十月丙戌宗正寺言太廟杏連理景德瑞竹圖景祐皇祐瑞竹頌賦景德四年十一月庚申蓬州上麥秀兩歧瑞竹二圖祥符元年十二月庚寅溫州獻瑞竹靈芝圖祥符九年正月癸亥蜀州獻合歡竹圖景祐二年六月十九日辛未幸後苑觀稻賞瑞竹宴太清樓十一月榮州言竹一本上分兩歧天聖九年七月永康軍青城生雙竹一本十一月榮州言瑞竹生皇祐三年三月二十二日甲戌召輔臣兩制館閣官觀後苑瑞竹其竹一本兩莖退多為賦頌以獻宗室克循獻瑞竹頌是年後苑産雙竹召從臣與觀皆賦詩頌美宋祁獻賦曰彼神苑之嘉竹挺雙箇而呈美交繁枝之蕭森等密葉焉蔥翠遂並節以自髙乃聨莖而告瑞梢紺纛以儷修幹緑玉而均直既內附以無外蓋不孤而有德詔飛緌以榮觀列佩荷以賦詩若曰所以蒼筤將兆慶乎震維雙者最多且繁衍乎本支一以為羣情協恭一以為四表共規願裁管乎伶倫期汗簡於良史胡宿後苑觀雙竹詩瑞植昭天産祥枝感帝臨均承元化力同抱歲寒心蒙潤非煙近含滋御水深又代謝瑞竹圖表翠本交枝駢生禁囿鈿軸爭鮮青玕對聳慶昭綿瓞瑞等并柯劉敞瑞竹詩應將古人比孤竹君夷齊毛滂雙竹贊惟此君子雲儀玉骨徑秀有節空洞無物姿傲氷霜韻含風月沖和所被疏簡亦合蒼龍並躍丹鳳和鳴雲日下臨風雪莫悴天光玉色俯照寒翠乾道元年七月三日池州守魯察以圖上瑞竹罷唐王勃慈竹賦疊幹龍回攢根鳳跱宗生族茂天長地久萬柢爭盤千株競糾如母子之鈎帶似閨門之悌友恐孤秀而成危每羣居而自守何美名之天屬而和氣之冥受不背仁以貪地不藏節以遁時李嶠賀瑞筍表緑籜含霜紫苞承雪陵九冬而擢穎冒重隂而發翠陳子昻賀慈竹再生表晉江逌竹賦含虛中以象道體圓質以儀天戴凱之竹譜曰竹之别類有六十一選注引竹譜治平木成文四年六月知汀州周約進桐板二片其木成文有天下太平四字詔奬諭付史館光堯御製盤松贊天錫瑞木得自嶔岑枝蟠數萬幹不倍尋怒騰龍勢靜奏琴音凌寒鬱茂當暑隂森封以腴壤邇以碧潯越千萬年以慰我心遊湖園獲竒松植禁苑瑞草芝炎帝朱草丹蕖拾遺記炎帝教民耒耜百榖滋阜朱草蔓於階見瑞榖聖德所感陸地丹蕖駢生如蓋香露滴瀝下流成池因為豢龍之圃黃帝有石蕖一莖百葉千年一花周穆王時西王母進昆崙素蓮一房百子凌冬而茂白虎通德至草木朱草生朱草赤草也可以染絳别尊卑也文苑英華朱草合朔賦月始而生月虧而落或産水涯或生岩側布赤葉之蒨練挺朱柯之翕赩既周復而莫窮與乾坤而不極瑞不慙於蓂莢珍豈遜夫靈芝選注尚書大傳曰德先地序則朱草生古瑞命記王者慈仁則芝生神農論芝云山川雲雨四時五行隂陽晝夜之精以生五色神芝為聖王休祥黃帝屈軼草又見後宋志黃帝羣瑞畢臻有屈軼之草生於庭佞人入朝則草指之是以佞人不敢進又博物志唐書惟袁與薛人中屈軼黃帝神芝圖水經注大騩即具茨山也黃帝登具茨之山受神芝圖於黃蓋童子即是山也黃帝內傳王母遣仙人歌萬年長生之曲授帝以石函玉笈之書會閬風瑶池之上授神芝圖十二卷堯朱草帝王世紀堯時景星曜甘露降朱草生於郊鳳凰止於庭嘉禾孶於畝醴泉湧於山大戴禮明堂篇朱草日生一葉至十五日生十五葉十六日一葉落終而復始漢書制曰上古至治嘉禾興朱草生堯萐莆説文萐莆瑞草也堯時生於庖厨扇暑而涼宋志萐莆狀如蓬大枝葉小根根如絲轉而成風殺蠅堯時生於厨又曰厨中自生肉其薄如萐搖動則風生食物寒而不臭名萐脯白虎通萐莆木名王者孝道至則出庖厨其葉大於門扇不搖自扇春秋潛潭巴曰君和則孶于庖厨瑞應圖一名倚萐倚扇賔閭舜時生於厨論衡儒者言萐脯生於庖厨厨中自生肉脯薄如萐形搖鼓生風寒涼食物堯蓂莢厯草舜蓂莢帝王世紀堯時有草夾階而生月朔旦生一莢月半生畢十六日後落一莢月晦而盡若月小餘一莢焦而不落王者占厯一名厯莢一名靈苑選王融曲水詩序佞枝植厯草孶注田俅子曰黃帝時有草生於庭階若佞人入朝則草指之名曰屈軼是以佞人不敢進又曰堯為天子蓂莢生於庭為帝成厯尚書帝命驗曰舜受命蓂莢孶東京賦海內同悅曰吁漢帝之德侯其禕而蓋蓂莢為難蒔也故曠世而不覿惟我后能植之以至和平方當數諸朝階注蓂莢瑞應之草王者賢聖太平和氣之所生生於階下始一日生一莢至月半生十五莢十六落一莢至晦而盡小月則一莢厭不落王者以知月之大小張衡轉瑞輪蓂莢於階下宋志蓂莢一名厯莢堯時生階舜即位蓂莢生於階瑞應圖一名蓂莢堯時生又曰舜時夾階而生葉圓而五色徐整三五厯曰黃帝時蓂莢為厯抱朴子堯觀蓂莢以知月孝經緯上古蓂莢生於階取以調味德及於地嘉禾生蓂莢起秬鬯出集韻􅟏蓂莢實堯指佞草梁肅指佞草賦體嘉生於浩氣秉直道於彤庭昔在堯帝至化惟馨伊屈軼之芳正協王猷與國經風力論道禹咎陳謨瑞草在前疇敢以諛沈封賦惡佞允叶於聖心鄭轅賦翠影如植靈草無心以聖人為心得詩人之無邪行孔門之逺佞如執法之不回奉直道而自必論衡儒者言太平之時屈軼生於庭之末若草之狀主指佞人周蓂莢周頌正義中候擲雒戒云曰若稽古周公旦欽惟皇天順踐祚即攝七年鸞鳳見蓂莢生青龍銜甲元龜背書宋志周公即攝七年鳳凰見蓂莢生白虎通厯日得其分度則蓂莢生於階間木名也吕諲賦承榮金殿旁沾三露之滋每奉玉階上蔭五雲之施論語摘輔象照景飲醴蓂莢為厯漢甘泉九莖芝武紀元封二年夏四月作甘泉通天臺六月詔曰甘泉宫中産芝九莖連葉上帝博臨不異下房賜朕洪休如淳曰瑞應圖云王者敬事耆老不失故舊則芝草生其赦天下賜雲陽都百户牛酒作芝房之歌禮樂志郊祀歌齊房十三元封二年芝生甘泉齊房作齊房産草九莖連葉宫童效異披圖按諜元氣之精回復此都蔓蔓日茂芝成靈華漢舊儀芝有九莖金色緑葉朱實夜有光乃作芝房之歌西京賦濯靈芝於朱柯漢函德殿金芝宣紀神爵元年三月詔曰乃元康四年嘉榖玄稷降于郡國金芝九莖産於函德殿銅池中詳見神魚舞河注金芝色象金也銅池承霤也以銅為之中黃藏府之傳函德銅池之美甘泉歌美函德書竒漢芝英漢志神仙家有黃帝雜子芝菌十八卷注服餌芝菌之法隋志芝英圖一卷唐志芝草圖一卷孫綽賦五芝含秀而晨敷注本草經赤芝一名丹芝黃芝一名金白芝一名玉黑芝一名玄紫芝一名木芝宋志芝草王者慈仁則生芝英王親敬耆老飬有道則生漢章帝元和中芝英生郡國春秋繁露搖光得則出玄芝太玄黃菌不誕俟于慶雲注黃菌靈芝也神農本草經生於五嶽者漢武宣世始見之先秦之世未有稱述芝草漢分枝荷拾遺記黃圖昭帝始元元年穿琳池中植分枝荷一莖四葉狀如駢蓋日照則葉低隂根莖若葵之衛足名曰低光荷實如玄珠可以飾佩昭帝遊栁池有芙蓉紫色大如斗蓮實如珠靈帝渠中植蓮大如蓋長一丈南國所獻其葉夜舒晝卷一莖有四蓮叢生名曰夜舒荷亦曰望舒荷唐崔融賀千葉瑞蓮表緑裏紅葩緗莖素蕚漢朱草光武紀中元元年夏京師醴泉涌出飲之者痼疾皆愈又有赤草生於水涯赤草朱草也宋志五月郡國頻上甘露羣臣奏言地祇靈應而朱草萌生孝經援神契曰德至草木則朱草生孝宣皇帝每有嘉瑞輒以改元神爵五鳳甘露黃龍列為年紀蓋以感致神祇表彰德信是以化致升平稱為中興今天下清寧靈物仍降陛下誠存損挹推而不居豈可使祥符顯慶汲而無聞宜令太史撰集以傳來世帝不納常自謙無德郡國所上輒抑而不當故史官罕得紀焉東京賦豐朱草於中唐注抱朴子朱草長三尺枝葉皆赤莖似珊瑚中唐中庭也宋志章帝元和中朱草生郡國朱草草之精也世有聖人之德則生魏文帝黃初元年十一月朱草生文昌殿曹植文帝誄曰靈芝冒沼朱華隂渚王融序朱英秀朱草亦曰朱英宋元嘉十一年朱草生蜀郡禮樂志安世房中歌都荔遂芳窅窊桂華注都良薜荔屋流赤羽野秀朱萌泥金可驗于幽經染絳用華於皇帝萍實相輝珊枝對聳朱草漢芝草紫芝後紀明帝永平十七年春芝草生殿前五月羣臣上夀章帝建初三年零陵獻芝草論衡零陵泉陵縣生芝五本莖葉紫蓋紫芝也太守沈豐獻之五零陵泉陵女子傳寧宅土中生芝草五本長者尺四寸短者七八寸莖葉紫色蓋紫芝也太守沈豐遣門下掾衍盛奉獻詔示天下五年泉陵男子周服宅上六本狀如三年芝并前凡十一本五年零陵獻芝草又芝生潁川桓帝建和元年四月芝草生中黃藏府靈帝光和四年二月郡國上芝英古今注章帝元和二年芝生沛論衡十二芝纍生漢嘉瓜宋志漢章帝元和中嘉瓜生郡國安帝元初三年三月東平陵有瓜異處共生八瓜同蒂五行志有瓜異本共生一瓜同蒂時以為嘉瓜晉太康三年六月嘉瓜異體同蒂生洛陽八年嘉瓜二莖一實咸寧中嘉瓜同蒂生成都太康元年十二月戊子嘉瓠生寧州漢瑞輪蓂莢見渾天儀東京賦見上漢靈芝歌魏靈芝班固頌漢論功歌詩靈芝歌曰因露寢兮産靈芝象三德兮瑞應圖延夀命兮光此都宋樂志曹植靈芝篇靈芝生玉地朱草被洛濵陛下三萬歲慈母亦復然庾肩吾芝草詩黃金九華發紫蓋六英通馮衍傳食五芝之茂英注茅君內傳曰句曲山有神芝五種龍伯參成燕胎夜光玉芝爾雅注芝一嵗三華瑞草魏神芝繆襲神芝贊青龍元年五月庚辰神芝生長平之習陽其色紫丹散為三十六莖似珊瑚之形贊曰煌煌神芝吐葩揚榮曩披其圖今握其形魏都賦仁挺芝草注芝草生樂平郡晉嘉蓮泰始七年六月己亥東宫元圃池芙蓉二花一蒂謂之嘉蓮皇太子以獻宋芙蓉連理唐嘉蓮同心蓮元嘉七年七月乙酉建康額簷湖二蓮一蒂十年七月己丑華林天淵池芙蓉異花同蒂十六年七月壬申華林池雙蓮同幹十七年十月尋陽弘農祐幾湖芙蓉連理十九年八月壬子揚州後池二蓮合華二十年五月廬陵郡池芙蓉二花一蒂又永嘉同七月吳興二十二年六月壬寅華林天淵池大明五年藉田六月壬寅華林天淵池芙蓉二華一蒂二十一年六月丙午天淵池二蓮同幹二十二年四月樂遊苑池二蓮同幹孝建二年六月庚寅玄武湖泰始二年嘉蓮一雙駢花並實合柎同莖生豫章醴湖梁天監十年五月乙酉嘉蓮一莖三花生樂遊苑陳袁朗為芝草嘉蓮二頌顔延之碧芙蓉頌擢麗蒼池飛映雲屋張奐芙蓉賦緑房翠蒂紫飾紅敷傅亮賦暉映丹墀納芳綺疏唐開元二十一年六月癸丑絳州言龍興觀池同心蓮一莖貞元十八年權德輿賀神龍寺殿前渠中瑞蓮花圖表絪緼降祉菡萏敷榮瑞茲灼灼之花逈出田田之葉雙房挺茂一雨均霑栁宗元賀表祥圖煥開異彩交映道協重華慶傳種德陶隂陽之粹美孕造化之精英雙華擢秀連蒂垂芳又賀西內定禮池青蓮花并神龍寺合歡蓮子云疊瑞重祥纍集宫禁池蓮表異靈化非常雨華千葉金塘玉井金房珠實張仲素表云傳芳丹禁倒影清流特聳孤莖對敷雙蕚姚合嘉蓮詩雙花出碧泉福草宋志福草者宗廟肅則生宗廟之中禮斗威儀君乘木而王其政升平則生廟中注朱草别名唐紫芝武德元年十二月麟州獻芝草一紫莖黃蓋四年六月益州獻芝草如人狀九年正月西韓州獻芝草異莖同蓋貞觀十五年五月乙酉定禮門御榻産芝五莖十七年九月紫芝一云素芝生於太廟寢室二十四莖為龍鳳形栁宗元有賀陜州進紫芝表唐太廟靈芝開元十五年閏九月億歲殿生芝草一莖十七年五月庚寅有靈芝産於太廟第九室殿柱二十一年八月癸亥沂州産靈芝三莖是夜南方丙上老人星見色黃白乾元元年四月丁卯太廟殿院北門內柱生芝草兩莖紫蓋代宗永泰二年太廟二室生芝唐芝草圖開元二十一年新羅王興光奏國內芝草生畫圖以獻唐大同殿玉芝天寶七載三月大同殿柱産玉芝有神光照殿八載六月殿又産玉芝一莖又銅池上有慶雲王維詩曰玉殿生三秀銅池出五雲勤政樓北曰大同門其內大同殿唐延英殿玉芝肅宗上元二年七月甲辰延英殿御坐梁上生玉芝一莖三花親製玉靈芝詩三章章八句曰玉殿肅肅靈芝煌煌重英發秀連葉分房詳見御詩楊炎受命頌曰白鹿擾於王庭靈芝産於延英貞元十二年七月東都苑內生芝唐夀昌殿玉芝長慶元年七月夀昌殿柱生一芝一莖六尺韓思復為滁州刺史有黃芝五生州舍民為刻頌崔融賀乾元殿芝草云瑶光發辰象之精金色吐隂陽之秀煌煌三秀分藻井而攢柯曄曄九光間梅梁而吐葉晉都宫閣何必靈芝之臺洛邑山川居然密芝之地魏皇之雙幹莫儔漢帝之九莖為劣可以薦郊廟可以觴公卿孫逖賀興慶宫芝表靈芝所致和氣之精著美仙經標名瑞典五色有類於卿雲六莖且符於帝樂獨孤及賀金暉院芝云曄曄九葩之蓋煌煌三秀之質靈根碩茂萬葉無疆神應炳然天意如答常衮賀宋汴獻芝草紫蓋黃莖云竒秀之狀靈篇未書垂以金蓋發其瓊葩上帝博臨宫童效異金英並秀絢藻井以煌煌紫蒂駢分映蓂階而蔓蔓甘泉連葉僅出下房函德九莖亦惟便殿表唐連理瓜嘉瓜圖祥符雙瓜共蒂大厯三年閬州生連理瓜貞元四年夏神策軍獻瑞瓜三蔓合為一蒂韓愈奏汴州嘉瓜云延蔓敷榮異實共蒂同蒂聨實栁宗元賀徐州張愔進嘉瓜圖越州嘉瓜二實同蒂圖表云神瓜合形表綿綿之慶豳風七月之食東陵五色之珍又鹽州進合歡黃瓜圖宋朝祥符三年九月戊寅鳳翔岐山有雙瓜共蒂之瑞天禧二年六月丁未元符觀生甘瓜色如金以示輔臣天聖六年十月欣州二瓜同蒂建隆芝草頌建隆二年七月己卯亳州獻芝草翰林學士王著獻頌傳云紫芝乾德紫芝乾德四年黃州進紫芝作紫芝曲興國三年八月庚申杭州言淮海國王舊府功臣堂柱芝草生畫圖來獻淳化五年正月丙子密州獻芝草四本太平興國瑞蓮祥符嘉瑞殿雙蓮皇祐瑞蓮紹興雙蓮興國九年五月內出玉津園瑞蓮一盆示輔臣花與葉悉合歡而生祥符元年東封還後苑産雙蓮因建嘉瑞殿是年天柞軍奏長慶河瑞蓮一本二花二本各二房興元奏城固縣池瑞蓮一花二房溫州奏永嘉縣池一本二房通州奏一本二花連州髙州奏一本二花三年七月辛巳吉果栁三州並言嘉蓮一莖二花天禧元年八月己丑渝州言蓮一莖三花皇祐五年七月二十二日己未召近臣觀後苑瑞蓮至和三年二月二十三日召輔臣觀政和三年六月二十三日嘉瑞殿池內生雙蓮四年六月十四日製雙蓮旗紹興二十五年十月以南安雙蓮華繪於旗夏竦集梓州奏廣化寺池蓮五莖各開二花詩云裊裊修莖孤引緑盈盈雙蘂對分紅絳跗相倚紫的交華宋祁瑞荷同幹詩協氣凝清籞嘉祥耀鈿荷共茄含瑞液分蓋矗文波魚戲浮香併龜遊得地多房芝助蓮葉宫木遜併柯晏殊贊曰紅渠出水菡萏其華膺圖瑞聖共柢重葩穎立苕發芳敷靜嘉葛勝仲賀嘉蓮表金塘擢秀異彩交輝雙影浮波瑞生靈沼示乾坤交泰之符瑞應圖以雙蓮為蘋即華蘋也華山記曰華山頂有池生千葉蓮花祥符孔林靈芝元年五月乙亥王欽若言祭文宣王廟尼山上有紫氣得芝五本六月乙卯孔林再得靈芝四本祥符瑞竹靈芝圖元年十二月庚寅溫州獻瑞竹靈芝圖祥符泰山花卉圖二年三月辛酉王欽若上泰山花卉圖二凡二十種請送昭應宫繪壁從之四年三月辛巳後苑牡丹雙花并蒂天聖四年季春丙午景靈宫牡丹雙跗共幹詔詞臣為賦夏竦賦序棣蕚承華召公流詠芝莖連葉漢帝登歌祥符龍圖閣觀芝草圖金芝二年五月丙寅召近臣至龍圖閣觀芝草圖三年正月壬戌內出泰山芝草賜輔臣人十本四年以泰山芝草裝寶山二百每山十一本六年六月丁卯兖州獻夀丘所獲紫莖金芝一十一月甲寅丁謂獻芝草三萬七千一百八本詔近臣觀于龍圖閣八年六月賜近臣靈芝山各二皆丁謂進四月明州進芝草圖天禧元年三月庚戌鄭州言聖祖殿芝草生祥符八年七月乙亥鳳翔府言麥二歧又獻芝草合歡瓜祥符三脊茅見封禪劉敞記三脊茅曰古之祭祀用茅至封禪則必三脊茅以為神籍三脊茅出於江淮之間其意以謂能服楚越使以其職來貢則封禪乃宜矣先帝將封太山責三脊茅於荆荆人莫識有一老父識之然後得貢於天子以老父為有神助賜九品之服敞令畫工圖之以示學者齊桓公欲封太山管仲以三脊茅止之天禧真逰崇徽二殿芝草圖二年正月庚子內出真逰崇徽二殿梁上芝草圖示輔臣上作歌一首五七言詩二首紀其事崇徽皇后所居殿也天聖天安殿芝景祐化成殿芝熙寧化成殿芝元豐天元殿芝天聖元年八月甲寅芝生天安殿柱召輔臣觀退表賀乙卯命百官觀之鞠詠言河決未塞霖雨害稼宜思應災變願以進忠良退邪佞為國寶以訓兵農豐倉廩為天瑞草木之怪何足尚哉景祐四年五月壬戌芝生于太宗神御殿楹丙寅二十五日芝生於化成殿楹召輔臣宗室兩制觀之帝作五言詩賜王隨等翌日各獻賦頌皇祐三年六月丁亥無為軍獻芝草三百五十本帝曰朕以豐年為瑞賢臣為寶戒州郡自今母得以聞嘉祐三年延和殿召從臣觀河南府所進芝草十二月十六日雪帝曰雪滋宿麥勝芝草之瑞乃賜宴于中書治平四年作靈芝曲曰紫蓋輪菌金跗煒煌陽寥三秀甘泉九房熙寧五年五月召輔臣觀化成殿芝草元豐七年四月壬辰朝獻景靈宫至天元殿觀芝草宰臣王圭等稱賀天聖牡丹圖詩又見詩類天聖四年四月乙卯內出雙頭牡丹芍藥花圖示輔臣令三館進詩賦六年十一月癸卯益州獻異花似桃四出上異之目為太平瑞聖花崇文目有瑞花詩賦一卷協風靈雨散為膏壤之滋共蒂并柯布在密青之囿晏殊表建炎赤芝二年密州獻赤芝九月癸卯輔臣進呈上曰朕以豐年為瑞其還之紹興瑞芝瑞瓜十九年十二月於潛生瑞芝二十五年五月芝草生於太廟仁宗室柱九莖連葉宰臣率百僚觀之表賀沈中立獻頌十月有司請繪于郊祀華旗又以贛州瑞木鎮江瑞瓜嚴信二州芝草遂寧嘉禾南安雙蓮黎州甘露並繪于旗二十七年二月仁英廟室柱上生芝四葉校書即張孝祥作原芝賀壬子表隆興康壽殿金芝詩隆興二年三月二十四日德夀宫康夀殿生金芝十有二莖宰臣皆賀御製七言詩有永將四海奉雙親之句漢甘泉宫九莖效異唐延英殿二花吐秀紹熙慈福宮芝草圖元年四月乙酉選德殿輔臣進呈畢上宣示慈福宫芝草圖夀皇芝草贊并御製芝草詩上曰芝草之生實慈福夀祉之祥夀皇誠孝之應詔髙宗芝草贊隆興御製芝草詩夀星芝草贊紹熙御製芝詩共四本宣付史館紹興瑞芝圖詩贊見御製慶元太廟瑞芝慶元五年八月壬申玉芝産於太廟大室之西楹越十日辛巳有司以聞詔百竂觀之超榮大厯踵美紹興玉海卷一百九十七
