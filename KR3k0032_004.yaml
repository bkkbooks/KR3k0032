body:
  text: 玉海卷四宋王應麟撰天文儀象黃帝蓋天顓頊渾儀隋天文志論蓋圖晉侍中劉智云顓頊造渾儀黃帝為蓋天然此二器皆古之所制但傳説者失其用昔者聖王正厯明時作圓蓋以圖列宿極在其中回之以觀天象分三百六十五度四分度之一以定日數日行於星紀轉回右行以為日行道欲明其四時所在春以青為道夏以赤為道秋以白為道冬以黑為道四季之末各十八日以黃為道蓋圖已定仰觀雖明而未正昏明分晝夜故作渾儀以象天體堯渾儀舜璿璣玉衡玉儀書舜典在璿璣玉衡以齊七政孔安國云璿美玉王氏曰璿美珠也玉説文云璿赤也王者正天文之器可運轉者舜察天文以審已疏云璣為運轉衡為橫簫運璣使動於下以衡望之漢世以來渾天儀是也顔師古曰璣轉而衡平謂渾天儀馬融曰渾天儀可旋轉故曰璣衡其橫簫以觀星宿以璿玉貴天象也日月星皆以璣衡度知盈縮進退蔡雍云玉衡長八尺孔徑一寸下端望之以視星辰蓋懸璣以象天而衡望之轉璣窺衡以知星宿漢武時洛下閎鮮于妄人嘗為渾天宣帝時耿壽昌始鑄銅為之象史官施用焉後漢張衡作靈憲以説其狀蔡雍鄭康成陸績吳時王蕃晉薑岌葛洪皆論渾天之義並以渾説為長宋元嘉年皮延宗又作是渾天論大史丞錢樂之鑄銅作渾天儀傳於齊梁周平江陵遷其器於長安今在太史書矣衡長八尺璣徑八尺圓周二丈五尺強轉而望之有其法也疏春秋文曜鉤曰堯在璿璣玉衡置四候之官注星辰日月之官各於其方使典時職隋天文志書在璿璣玉衡則考靈曜所謂觀玉儀之遊昏明主時乃命中星也璿璣中而星未中為急急則日過其度月不及其宿璿璣未中而星中為舒舒則日不及其度月過其宿璿璣中而星中為調調則風雨時庶草繁廡而五穀登萬事康也所言璿璣者謂渾天儀也春秋文曜鉤云唐堯即位羲和立渾儀先儒或因星官書北斗第二星名璿第三星名璣第五星名衡仍七政之言即以為北斗七星載筆之官莫或之辨史遷班固猶且致疑馬季長創謂璇璣為渾儀鄭康成云其運轉者為璣其持正者為衡皆以玉為之吳王蕃云渾天儀者羲和之舊器謂之璣衡其為用也以察三光以分宿度又有渾天象者以著天體以布星辰唐志詩所紀候天星春秋書日食星變周禮測景求中分星辨國獨無所謂璿璣玉衡者豈不用於三代抑法制遂亡不可復得邪不然二物莫知為何器也李淳風言周末此器乃亡史記北斗七星所謂璿璣玉衡以齊七政晉志魁四星為璇璣杓三星為玉衡也後天文志注璇璣謂北極星也玉衡謂斗九星璇璣玉衡占色春青黃夏赤黃秋白黃冬黑黃星經隋志劉焯曰璿璣玉衡正天之器帝王欽若世傳其象晉志春秋考靈曜云分寸之晷代天氣以正方圓方圓以成參以規矩昏明主時乃命中星觀玉儀之遊鄭玄謂以玉為渾儀也書正義引書緯璿璣鈐云漢靈臺銅儀儀度後漢明帝紀永平三年春正月癸巳詔曰朕奉郊祀登靈臺見史官正儀度儀謂渾儀以銅為之王者正天文之器置於靈臺度謂日月星辰之行度史即太史掌天文官夫春者嵗之始也始得其正則三時有成有司其勉順時氣勸督耕桑詳刑謹罰明察單辭夙夜匪懈以稱朕意張衡傳注漢名臣奏蔡雍曰言天體有三家唯渾天近得其情今史官所用候臺銅儀則其法也黃圖清臺後更曰靈臺述征記曰上有渾儀張衡所製衡生安順之間其殆鄧平之圓儀乎厯志永元十四年十一月甲寅詔曰漏所以節時分定昏明昏明長短起於日去極逺近當據儀度下參晷景漢賈逵黃道銅儀甘露圖儀渾天圖儀後漢和帝永元十五年七月甲辰詔造大史黃道銅儀以正星辰之度律厯志章帝元和二年太初失天益逺遂下詔施行四分厯和帝永元四年復令史官以九道法候弦望左中郎將賈逵論曰臣前上傅安等用黃道度日月弦望多近史官一以赤道度之不與日月同於今厯弦望差一日以上輒奏以為變至以為日却縮退行於黃道自得行度不為變願請太史官日月宿簿及星度課與待詔星象考校奏可臣謹案前對言冬至日去極一百一十五度夏至日去極七十五度春秋分日去極九十一度洪範日月之行則有冬有夏五紀論日月循黃道南至牽牛北至東井率日日行一度月行十三度十九分度七也以今太史官候注考元和二年九月以來皆如安言問典星待詔姚崇井畢等十二人皆曰星圖有規法日月實從黃道官無其器不知施行案甘露二年大司農中丞耿壽昌以圖儀度日月行考驗天運狀日月行至牽牛東井日過度月至十五度至婁角日行一度月行十三度赤道使然此前世所共知也如言黃道有驗合天日無前却弦望不差一日比用赤道密近宜施用逵論又曰石氏星經黃道規牽牛初直斗二十度去極二十五度於赤道斗二十一度也案逵論永元四年也至十五年七月甲辰詔書造太史黃道銅儀合二十八宿凡三百六十五度四分度之一冬至日在牛十九度四分度之一史官以校日月行參弦望雖密近而不為注日儀黃道與度轉運難以候是以少循其事隋志同唐會要一行上疏謂在五年合考後厯志虞恭宗欣等議孝章皇帝厯度審正圖儀晷漏與天相應不可復尚蔡雍議馮光陳晃厯以考靈曜二十八宿度數與甘石舊文錯異以今渾天圖儀檢天文亦不合漢渾天耿壽昌員儀晷儀漢候臺銅儀漢蓋圖見言天三家隋天文志論渾天儀王蕃又云又有渾天象者以著天體以布星辰古舊渾象以二分為一度周七尺三寸半莫知何代所造今案虞喜云洛下閎待詔太史為漢武於地中轉渾天定時節作太初厯或其所制也又見益部耆舊傳漢和帝永元十五年賈逵始造太史黃道銅儀至桓帝延熹七年張衡更以銅製以四分為一度周天一丈四尺六寸一分蕃以古制局小以布星辰相去稠穊不得了察張衡所作又復大難可轉移蕃今所作以三分為一度周天九尺五分四分之三而陸績所作渾象形如鳥卵以施二道不得如法頗為乖僻然則渾天儀者其制有璣有衡既動靜兼狀以效二儀之情又周旋衡管以考三光之分所以揆正宿度凖步盈虛采古之遺法也則先儒所言圓規徑八尺漢候臺銅儀蔡雍所欲寢伏其下者是也又見上賈逵論晉天文志古言天者有三家一曰蓋天二曰宣夜三曰渾天漢靈帝時蔡雍於朔方上書言宣夜之學絶無師法周髀術數具存考驗天狀多所違失惟渾天近得其情今史官候臺所用銅儀則其法也立八尺員體而具天地之形以正黃道以察發斂以行日月以步五緯精微深妙百代不易又張衡傳注詳見言天三家集後漢永安宮銘曰候臺道俾司星辰春秋文曜鈎云唐堯即位羲和立渾儀暨漢太初洛下閎鮮于妄人耿壽昌等造員儀以考厯度後至和帝時賈逵繼作又加黃道至順帝時張衡又制渾象其後陸績亦造渾象吳時王蕃制渾儀書正義漢武時閎妄人嘗為渾天宣帝時壽昌始鑄銅為之象史官施用焉張衡作靈憲説其狀蔡雍鄭玄陸績晉薑岌張衡葛洪皆論渾天之義以渾説為長宋皮延宗作是渾天論揚子重黎或問渾天曰洛下閎營之鮮于妄人度之耿中丞象之幾幾乎莫之能違也揚雄傳雄作太玄大潭思渾天參摹而四分之四分天之宿度甲乙極於八十一旁則三摹九據極之七百二十九贊其用自天元推一晝一夜隂陽度數律厯之紀九九大運與天終始故元三方九州二十七部八十一家二百四十三表七百二十九贊分為三卷曰一二三與泰初厯相應亦有顓頊之厯焉漢律志武帝造太初厯立晷儀見太初厯漢張衡渾天儀靈憲算罔論瑞輪蓂莢靈憲圖璿璣張衡傳安帝雅聞張衡善學徵拜為郎再遷為太史令遂乃研核隂陽妙盡璇璣之正作渾天儀立八尺員體以具天地之象以正黃道以察發斂以行日月以步五緯著靈憲算罔論言甚詳明衡集無算罔論蓋網絡天地而算之因名焉衡謂靈臺之璇璣者兼渾儀候儀之法置密室中者渾象也靈憲序曰昔在先王將步天路先凖之於渾體是謂正儀立度而黃極有逌建也樞運有逌稽也乃建乃稽故靈憲作興詳見天文隋志桓帝延熹七年太史令張衡更以銅製渾天儀以四分為一度周天一丈四尺六寸一分亦於密室中以漏水轉之令伺之者閉户而唱之以告靈臺之觀天者璿璣所加某星始見某星已中某星今沒皆如合符崔子玉為之碑銘曰云云見後鄭晉志同靈劉焯曰蔡雍月令章句玄注考曜同衡法張衡為太史令鑄渾天儀總序經星謂之靈憲其大略曰星者體生於地精發於天紫宫為帝皇之居太微為五帝之座在野象物在朝象官居其中央謂之北斗動係於占實司天命四布於方為二十八宿日月運行歷示休咎五緯經次用彰禍福則上天之心於是見矣中外之官常明者百有二十可名者三百二十為星二千五百微星之數萬一千五百二十庶物蠢動咸得係命衡所鑄圖遇亂湮滅星官名數亦不復存晉志順帝時張衡置渾象具內外規南北極黃赤道列二十四氣二十八宿中外星官及日月五緯以漏水轉之於殿上堂內星中出沒與天相應因其闕戾又轉瑞輪蓂莢於階下隨月盈虛依厯開落其後陸績亦造渾象至吳時廬江王蕃善數術傳劉洪乾象厯依其法而制渾儀范曄稱之曰範圍兩儀天地無所藴其靈渾天運情機物有生不能參其智候地動儀崔子玉稱之曰數術窮天地制作侔造化義熙起居注十四年相國表曰平長安獲張衡所作渾儀土圭歸之天府續天文志注衡著靈憲渾儀略具辰曜之本續厯志注張衡渾儀曰赤道橫帶渾天之腹去極九十一度十分之五黃道斜帶其腹出赤道表裏各二十四度故夏至去極六十七度而強冬至去極百十五度亦強黃道斜截赤道者則春秋分之去極也本當以銅儀日月度之則可知也以儀一嵗乃竟中間又有隂雨難卒成是以作小渾盡赤道黃道隋宇文愷曰張衡渾象以四分為一度王蕃減其法見後唐志張衡靈憲圖一卷又渾天儀一卷選注張衡漏水轉渾天儀制曰蓋上又鑄金銅仙人居左壺為胥徒居右壺初學記亦引之詳見漏刻厯志章帝詔曰祖堯岱宗同律度量考在機衡以正厯象庶乎有益史官用太初鄧平術璇璣不正文象不稽永元十四年詔太常史官運儀下水官漏失天至三刻安帝永初二年七月戊辰詔以變異並見百僚及郡國吏民有明習隂陽之度璇璣之數者各使指變以聞熹平四年蔡雍議馮光陳晃厯以考靈曜二十八宿度數及冬至日所在與今史官甘石舊文錯異不可考校以今渾天圖儀檢天文亦不合於考靈曜光晃能自依其術更造望儀以追天度逺有驗於圖書近有效於三光可以易奪甘石窮服諸術者實宜用之難問但言圖讖光和三年韓説等議日月之術日循黃道月從九道以赤道儀日冬至去極俱一百一十五度其入宿也赤道在斗二十一而黃道在斗十九兩儀相參日月之行曲直有差以生進退張恂久在候部能揆儀度定立術數漢陽嘉候風地動儀張衡順帝時為太史令陽嘉元年秋七月復造候風地動儀以精銅鑄成員徑八尺合蓋隆起形似酒樽飾以篆文山龜鳥獸之形中有都柱傍行八道施關發機外有八龍首銜銅丸下有蟾蜍張口承之其牙機巧制皆隱在樽中覆蓋周密無際如有地動尊振則龍發機吐丸而蟾蜍銜之振聲激揚伺者因此覺之雖一龍發機而七首不動尋其方面乃知震之所在驗之以事合契若神自書典所記未之有也嘗一龍發機而地不覺動京師學者咸怪其無證後數日驛至果地震隴西於是咸服其妙自此以後乃令史官記地動所從方起崔子玉為其碑銘曰數術窮天地制作侔造化髙才偉藝與神合契蓋由平子渾儀及地動儀有驗故也推其範圍兩儀天地無所藴其靈運精機物有生不能參其智紀陽嘉元年七月史官始作候風地動銅儀前志維星散句星信則地動有星守三淵地動極後四星曰句星斗杓後三星曰維星隋志河中九星如鈎狀曰鈎星伸則地動房宿北一小星曰鈎鈐鈎鈐之間有星及疏拆則地動晏子曰吾見句星在房心之間地其動乎隋臨孝恭著地動銅儀經一卷石氏渾天圖隋志一卷吳陸績渾象渾天圖晉志陸績造渾象其形如鳥卵以施二道則黃道應長於赤道矣績云天東西南北徑三十五萬七千里然則績以天形正員故也而渾象如鳥卵則自相違背王蕃論云績傳作渾天圖注易釋玄皆傳於世吳王蕃渾儀晉志宋志同略孔穎達書疏載王蕃渾天説同見下當參考書疏吳中常侍廬江王蕃善數術傳劉洪乾象厯依其法而制渾儀立論考度曰前儒舊説天地之體狀如鳥卵天包地外如殼之裹黃周旋無端圓如彈丸其形渾渾然故曰渾天周天三百六十五度五百八十九分度之百四十五半露地上半在地下其二端謂之南極北極北極出地上三十六度南極入地下三十六度兩極相去一百八十二度半強繞北極徑七十二度常見不隱謂之上規繞南極七十二度常隱不見謂之下規赤道帶天之中去兩極各九十一度少強黃道日之所行也半在赤道外半在赤道內與赤道東交於角五少弱西交於奎十四少強以兩儀推之二道俱三百六十五度有竒是以知天體如彈丸也古渾象以二分為一度凡周七尺三寸半分張衡更制以四分為一度凡周一丈四尺六寸蕃以古制局小星辰稠穊衡器傷大難可轉移更制渾象以三分為一度凡周天一丈九寸五分四分分之三增古法三尺六寸五分四分分之一減衡法亦如之何承天曰徑天之數蕃説近之書疏王蕃渾天説曰天之形狀似鳥卵天包地外猶卵之裹黃圓如彈丸故曰渾天言其形體渾渾然也其術以為天半覆地上半在地下其天居地上見有一百八十二度半強地下亦然北極出地上三十六度南極入地下亦三十六度而嵩髙正當天之中極南五十五度當嵩髙之上又其南十二度為夏至之日道又其南二十四度為春秋分之日道又其南二十四度為冬至之日道南下去地三十一度而已是夏至日北去極六十七度春秋分去極九十一度冬至去極一百一十五度此其大率也其南北極持其兩端天與日月星宿斜而回轉此必古有其法遭秦而滅隋志渾天象注一卷吳散騎常侍王蕃撰晉陽秋吳有葛衡本作葛衝字思真明達天官能為機巧作渾天使地居於中以機動之天轉而地止以上應晷度吳渾天渾天象注吳志注晉陽秋曰吳有葛衡字思真改作渾天使地居於中以機動之天轉而地止以上應晷度義熙起居注曰十四年相國表曰間者平長安獲張衡所作渾儀土圭歷代寶器謹遣奉送歸之天府隋志劉焯云閎制莫存衡造有器績有小異蕃乃事同宋有錢樂之魏初朝崇等小大有殊經模不異觀蔡雍月令章句鄭玄注考靈曜勢同衡法迄今不改蓋及宣夜三説並驅平昕安穹四天騰沸至當不一理唯一揆豈容天體七種殊説昔蔡雍自朔方上書曰以八尺之儀度知天地之象古有其器而無其書常欲寢伏儀下案度成數而為立説書奏不許焯今立術改正舊渾後魏盧辨傳孝武西遷金石律呂晷刻渾儀皆令辨因時制宜皆合軌度隋經籍志渾天象注一卷吳散騎常侍王蕃撰晉渾儀義熙十三年八月劉裕克長安九月先收其彞器渾儀土圭記里鼓指南車及秦始皇玉璽宋何承天論渾天象體宋志御史中丞何承天論渾象體曰天形正員而水周其下言四方者東陽谷日之所出西至濛汜日之所入莊子云北南溟亦古之遺記四方皆水證也大中大夫徐爰曰渾儀之制未詳厥始王蕃言虞書在璇璣玉衡以齊七政則今渾天儀日月五星是也鄭玄説動運為機持正為衡皆以玉為之渾儀羲和氏之舊器歷代相傳謂之機衡而斯器設在候臺史官禁密學者寡得聞見穿鑿之徒見七政之言因以為北斗七星遷固猶惑之鄭玄超然獨見改正其説聖人復出不易斯言蕃之所云如此夫候審七曜當以運行為體設器擬象焉得定其盈縮設使唐虞之世已有渾儀後世孰敢非革而三天之議紛然莫辨至揚雄方難蓋通渾張衡為太史令乃鑄銅制範故知自衡以前未有斯儀史臣案渾天廢絶故有宣蓋之論其術並疏後人莫述或問渾天於揚雄雄舉洛下鮮于耿中丞三人以對則知此三人創造渾儀以圖晷緯西漢長安已有其器將由喪亂亡失故衡復鑄之乎王蕃又記古渾儀尺度并張衡改制之文則知斯器非衡始造明矣衡所造傳至魏晉沈沒戎虜績蕃舊器亦不復存晉義熙十四年髙祖平長安得衡舊器儀狀雖舉不綴經星七曜蓋天之術云出周公旦訪之殷商蓋假託之説也其書號曰周髀髀者表也周天之數也其術云天如覆蓋地如覆盆地中髙而四隤日月隨天轉運隱地之髙以為晝夜天地相去凡八萬里天地之中髙於外衡六萬里地上之髙髙於天之外衡二萬里或問蓋天於揚雄雄曰蓋哉蓋哉難其八事鄭玄又難其二事為蓋天之學者不能通也後魏候部鐵儀隋天文志論渾儀後魏道武天興初令太史令朝崇修渾儀以觀星象十有餘載至明元永興四年壬子詔造太史候部鐵儀以為渾天法考璿璣之正其銘曰於皇大代配天比祚赫赫明明聲烈遐布爰造兹器考正宿度貽法後葉永垂典故其制皆以銅鐵唯志星度以銀錯之南北柱曲抱雙規東西柱直立下有十字水平以植四柱十字之上以龜負雙規其餘皆與劉曜儀大同今太史候臺所用也開皇已後靈臺以後魏鐵渾天儀測七曜盈縮以蓋圖列星坐分黃赤二道距二十八宿分度而莫有更為渾象者仁壽四年劉焯論渾天曰今立術改正舊渾不用唐天文志李淳風奏靈臺鐵儀後魏斛斯蘭所作今太史候臺所用也後魏器凖圖四術周髀宗北史信都芳明算術安豐王延明欲抄集五經算事為五經宗及古今樂事為樂書又聚渾天欹器地動銅烏漏刻候風諸巧事并圖畫為器凖並令芳算之芳自撰注隋志小説家芳器凖圖三卷又著四術周髀宗其序曰漢成帝時學者問蓋天揚雄曰未幾也問渾天曰幾乎言蓋差而渾密也蓋器測影而造用之日久不同於祖故云未幾渾器量天而作乾坤大象隱見難變故云幾乎時太史令尹咸窮研晷蓋易古周法雄乃見之以為難也自昔周公定景王城至漢朝蓋器一改渾天覆觀以靈憲為文蓋天仰觀以周髀為法覆仰雖殊大歸是一芳以渾算精微故約本省要凡述二篇合六法名四術周髀宗又難李業興新厯五闕又私撰厯書名曰靈憲厯算月頻大頻小食必以朔證據甄明每云何承天亦為此法而不能精書未成崔靈恩立義以渾蓋為一朝崇為太史令道武詔造渾儀梁渾天象宋元嘉渾儀小渾天銅儀隋志天文論渾天象者其制有璣而無衡梁末祕府有以木為之其員如九其大數圍南北兩頭有軸遍體布二十八宿三家星黃赤二道及天漢等别為橫規環以匡其外髙下半之以象地南軸頭入地注於南植以象南極北軸頭出於地上注於北植以象北極正東西運轉昏明中星既應其度分至氣節亦驗在不差而已不如渾儀别有衡管測揆日月分步星度者也吳太史令陳苗云先賢制木為儀名曰渾天即此之謂邪由斯而言儀象二器逺不相涉則張衡所造蓋亦止在渾象七曜而何承天莫辨儀象之異亦為乖失宋文帝元嘉十三年以髙祖初克長安所得古銅渾儀狀雖略舉不著經星七曜詔太史令錢樂之採效儀象鑄銅為之五分為一度徑六尺八分少周一丈八尺二寸六分少地在天內不動立黃赤二道之規南北二極之規布列二十八宿北斗極星置日月五星於黃道上為之杠軸以象天運以水轉之昏明中星與天相符宋志云置立漏刻以水轉儀隋天文志宋元嘉中太史令錢樂之所鑄渾天銅儀以朱黑白三色用殊三家而合陳卓之數梁置於文德殿前至如斯制以為渾儀則內缺衡管以為渾象則地不在外是參兩法别為一體吳時又有葛衡明達天官能為機巧改作渾天使地居於天中以機動之天動而地止以上應晷度則樂之所放述也元嘉十七年又作小渾天二分為一度徑二尺二寸周六尺六寸安二十八宿中外官星備足以白青黃等三色珠為三家星其日月五星悉居黃道亦象天運而地在其中宋元嘉所造儀象開皇九年平陳後並入長安大業初移於東都觀象殿隋天文志渾天儀法云天如雞子地如雞子中黃孤居於天內天大而地小表裏有水天地各乘水而立載水而行周天三百六十五度四分度之一中分之則半覆地上半繞地下故二十八宿半見半隱天轉如車轂之運也書舜典正義宋元嘉年皮延宗作是渾天論太史丞錢樂之鑄銅作渾天儀傳於齊梁周遷其器於長安梁重雲殿銅儀天儀説要渾天象隋天文志論渾儀梁華林重雲殿所置銅儀其制有雙環規又有單橫規又有單規其裏又有雙環規南頭入地下以象南極北頭出地上以象北極其運動得東西轉以象天行雙軸之間則置衡長八尺撿其鐫題是劉曜光初六年史官丞南陽孔挺所造則古渾儀法也而何承天徐爰著宋史以為即張衡所造其儀略舉天狀而不綴經星七曜義熙十四年定咸陽得之沈約亦云然皆失之逺矣陶弘景傳造渾天象髙三尺地居中天轉而不動以機動之悉與天會隋志弘景撰天儀説要一卷隋觀臺渾儀隋志史臣於觀臺訪渾儀見元魏太史令朝崇所造以鐵為之其規有六其外四規常定一象地形二象赤道其餘象二極其內二規可運轉用合八尺之管以窺星度周平齊所得隋開皇二年新都初成以置觀臺之上唐凝暉閣渾儀天文志貞觀初太史李淳風上言在璿璣玉衡以齊七政則渾天儀也周禮土圭正日景以求地中有以見日行黃道之驗暨於周末此器乃亡漢洛下閎作渾儀其後賈逵張衡等亦各有之而推驗七曜並循赤道按冬至極南夏至極北而赤道常定於中無南北之異蓋渾儀無黃道久矣太宗異其説乃詔為之至七年儀成表裏三重下據凖基狀如十字末植鼇足以張四表一曰六合儀有天經雙規金渾緯規金常規相結於四極之內列二十八宿十日十二辰經緯三百六十五度二曰三辰儀員徑八尺有璿璣規會要有黃道規月遊規列宿距度七曜所行轉於六合之內三曰四遊儀玄樞為軸以連結玉衡遊筒而貫約矩規又玄樞北樹北辰南矩地軸旁轉於內玉衡在玄樞之間而南北遊仰以觀天之辰宿下以識器之晷度皆用銅帝稱善置於凝暉閣用之候測閣在禁中其後遂亡舊史閣在太極殿內會要貞觀初李淳風言靈臺候儀是故魏遺範法制疏略難為占步上令淳風改造渾儀鑄銅為之七年三月十六日舊史癸巳直太史將仕郎李淳風鑄渾天黃道儀成奏之云云與史同淳風又撰法象志以論前代渾儀得失之差傳淳風以將仕郎直太史局制渾天儀詆托前人得失著法象志七篇上之配志李淳風法象志因漢書十二次度數以唐之州縣焉天詳見文盧肇海潮賦張衡考動以鑄儀淳風述時而建式謂作乙己占以儀立式以定星辰唐開元黃道遊儀銘厯經渾天圖銅儀唐天文志開元九年一行受詔改治新厯欲知黃道進退而太史無黃道儀左內率府兵曹參軍梁令瓉以木為遊儀一行是之乃奏黃道遊儀古有其術而無其器昔人潛思皆未能得今令瓉所為日道月交皆自然契合於推步尤要請更鑄以銅鐵十一年儀成張説表遊儀六月造畢一行又曰靈臺鐵儀後魏斛蘭所作規制朴略度刻不均赤道不動乃如膠柱以考月行遲速多差多或至十七度少不減十度不足以稽天象授人時淳風黃道儀以玉衡璇規别帶日道傍列三百四十九交以擕日遊法頗難術遂寢廢臣更造遊儀使黃道運行以追列舍之變因二分之中以立黃道交於奎軫之間二至陟降各二十四度黃道內施白道月環用究隂陽朓朒動合天運簡而易從可以制器垂象永傅不朽於是玄宗嘉之自為之銘又見御製年集賢注記曰學士陸去泰題製造月工匠姓名於盤下填以銀字御書填以金字置之靈臺黃道遊儀以古尺四分為度旋樞雙環古所謂旋儀也南北科兩極上下循規各三十四度表裏畫周天度使東西運轉如渾天遊旋中旋樞軸長與旋環徑齊玉衡望筒置於子午左右用八柱八柱相固亦表裏畫周天度雙間使樞軸及玉衡望筒旋環於中也隂緯單環皆凖陽經相銜各半內外俱齊謂之隂渾也內外為周天百刻天頂單環直中國人頂之上東西當卯酉之中令與陽經隂緯相固如鳥殼之裹黃赤道單環赤道者當天之中二十八宿之位也雙規運動度穿一穴隨穴退交秋分冬至日不差繆傍在卯酉之南上去天頂三十六度而橫置之黃道單環日之所行故名黃道太陽陟降積嵗有差月及五星亦隨日度出入古無其器規制不知凖的斟酌為率疏濶尤甚今設此環置於赤道環內仍開合使運轉出入四十八度而極畫兩方東西列度數南北列百刻可使見日知時上列三百六十策與用卦相凖度穿一穴與赤道相交白道月環月行有迂曲遲速與日行緩急相反古亦無其器今設於黃道環內使就黃道為交合出入六度以測每夜月離上畫周天度數度穿一穴擬移交會皆用銅鐵遊儀四柱為龍龍能興雲雨故以飾柱柱在四維龍下有山雲俱在水平槽上皆用銅其赤道帶天之中以分列宿之度黃道斜運以明日月之行乃立八節九限校二道差數著之厯經舊史大衍厯經一卷黃道圖見天文圖類舊紀開元十三年冬十月癸丑新造銅儀成置於景運門內以示百官會要開元八年六月十五日左金吾長史南宫説奏渾天圖有其書無其器臣修九曜占書須量校星象請造兩枚一進內一留司占測九年改厯沙門一行奏梁令瓉待制麗正書院因造遊儀木樣甚精密請更以銅鐵為之十三年十月三日造成志云十一年集賢注記云十二年五月又上疏曰云云置之靈臺以考星度二十八宿中外官與古經不同者數十條又詔一行令瓉更造渾天儀見後集賢注記開元十二年五月沙門一行於書院造黃道遊儀以進一行初奉詔改修厯經以舊無黃道遊儀測候稍難梁令瓉刻木作小樣進呈上令一行參考以為精密始就院更以銅鐵為之凡二年功乃成至是上之上稱善令令瓉與一行考李淳風法象志更造渾儀圖御制遊儀銘并八分書題於輪上銘曰盈縮不愆列舍不忒制器垂象永鑒無惑學士陸去泰奉敕題制造年月及工匠姓名於盤下靈臺用以測候至今存焉十三年十月院中造渾儀成奉敕向敷政門外以示百寮一行改進遊儀之後上令鑄銅為渾規之器左衛長史梁令瓚右驍衛長史桓執圭分擘規制鑄為天像徑一文具列宿赤道及周天度數注水激輪令其自轉議者以為張衡靈憲不能踰今留東京集賢院內院中有仰觀臺即一行占候之所六典靈臺郎凡測候晷度以遊儀為凖唐武成殿水運渾天俯視圖新造銅儀唐天文志開元十一年遊儀成明皇又詔一行與令瓉等鑄渾天銅儀員天之象具列宿赤道及周天度數又注水激輪令其自轉一晝一夜而天運周外絡二輪綴以日月令得運行每天西旋一周日東行一度月行十三度十九分度之七二十九轉有餘而日月會三百六十五轉而日周天以水匱為地平令儀半在地上半在地下晦朔弦望遲速有凖立木人二於地平上其一前置鼓以候刻至一刻則自擊之其一前置鐘以候辰至一辰亦自撞之皆於匱中各施輪軸鈎鍵關鎖交錯相持置於武成殿前以示百官無幾而銅漸澀不能自轉遂藏於集賢院會要與史同當時稱其妙命之曰水運渾天會要曰水運渾天俯視圖初張衡有漏水轉渾天之制見學記通鑑開元十三年十月癸丑作水運渾天成會要舊紀同開元十三年乙丑十月三日癸丑新造銅儀成置於景運門內以示百官書院造遊儀去年六月畢又奉旨更立渾儀張説表曰準敕命右衛兵曹長史梁令瓉檢校製造於是博考傳記舊有張衡陸績王蕃錢樂之並造斯器雖渾體有象而不能運行臣今鑄銅為儀圓以象天使得俯察又曰究天地之斡運極乾坤之變化隂陽不能逃其數度分不能隱其時紹唐堯欽若之典遵虞舜璿玉之舊十八年進士試新渾儀賦隋耿詢創意造渾天儀不假人力以水轉之施於暗室使髙智寶外候天時動合符契唐盧肇渾天法渾天賦論盧肇作海潮賦及圖取渾天為法吳嚴畯著潮水論燕肅海潮圖論自古説天有六一曰渾天張衡所述二曰蓋天周髀以為法三曰宣夜無師法四曰安天虞喜作五曰昕天姚信作六曰穹天虞聳作自蓋天已下蓋好竒徇異之説其增立渾天之術自張平子始言天包於地周旋無端其形渾渾故曰渾天言不及渾天而乖誕者五家莊子逍遙篇玄中記王仲任論衡言日不入地山經釋氏言四天肇始學渾天術於太原王軒軒以王蕃之術授焉後因演而成圖又曰舜璿璣玉衡則渾儀之本法晉侍中劉智云顓頊造渾儀黃帝為蓋天則此二器皆古聖王之制作也但學者失其法耳説者乃云始自張衡今考其事張衡乃巧述其法而揆之非始造者也虞喜又云洛下閎為漢武帝於地中轉渾天定時修太初厯又知此術在平子前也賈逵以永元十五年造黃道儀張衡以延熹七年更造銅儀其後吳王蕃陸績後魏朝崇隋劉焯皆修渾儀之法李淳風因為遊儀蓋與靈憲同楊炯上元三年補校書郎朝夕靈臺之下備見銅渾之象作渾天賦賦云有為宣夜之學者曰天常安而不動地極深而不測有稱周髀之術者曰陽動而隂靜天回而地遊天如倚蓋地若浮舟太史公盱衡而告曰言宣夜者星辰不可以闊狹有常言蓋天者漏刻不可以春秋各半周三徑一逺近乖於辰極東井南箕曲直殊於河漢明入於地葛稚川所以有辭候應於天桓君山由其發難嘗聞渾天之事歟地則方如棊局天則圓如彈丸天之運也一北而物生一南而物死地之平也景長而多暑景短而多寒部之以三門張之以八紀其周天也三百六十五度其去地也九萬一千餘里日居月諸天行地止載之以氣乘之以水驗之以衡軸考之以樞機三十五官有羣生之繫命一十二次當下土之封畿中衡外衡不召自至黃道赤道殊途同歸昔者顓頊之命重黎司天而司地陶唐之命仲叔宅西而宅東其後宋有子韋鄭有裨竈魏有石氏齊有甘公唐都之推星王朔之候氣周文之視日吳範之占風有以見天地之情狀識隂陽之變通文粹崔良佐治詩易書春秋撰演範忘象渾天等論數十篇唐書栁宗元天對云規燬魄淵太虛是屬棊施萬熒咸焉是託晉成公綏天地賦望舒彌節於九道羲和正轡於中黃衆星回而環極招搖運而指方宋志王蕃論曰三光之行不必有常術家以算求之各有同異故諸家厯法參差不齊洛書甄曜度春秋考異郵皆云周天一百七萬一千里一度為二千九百三十二里七十一步二尺七寸四分四百八十七分分之三百六十二陸績云天東西南北徑三十五萬七千里此言周三徑一也考之徑一不啻周三率周百四十二而徑四十五則天徑三十二萬九千四百一里一百二十二步二尺二寸一分七十一分分之十周禮日至之景尺有五寸謂之地中鄭衆鄭玄云云以此推之日當去其下地八萬里矣日邪射陽城則天徑之半也天體圓如彈丸地處天之半而陽城為中以句股法言之旁萬五千里句也立八萬里股也從日邪射陽城弦也晉志後秦薑岌造三紀甲子元厯又著渾天論以步日於黃道駮先儒之失虞喜安天論曰太史令陳季胄以先賢制木為儀名曰渾天賀道養渾天記曰昔記天體者有三渾儀莫知其始書以齊七政蓋渾體也二曰宣夜夏殷之制也三曰周髀非周家術也近世復有三術一曰方天興於王充二曰昕天起於姚信三曰安天由於虞喜皆浮説不觀唯渾天證驗不疑桓子新論曰揚子雲好天文問於黃門作渾天老工曰我少能作其事但隨尺寸法度殊不曉達其意開寶渾天圖見上太平興國文明殿渾儀太平興國中一作初司天監學生張思訓巴中人自言能為渾儀因獻其式上召尚方工官於禁中如式造之四年己卯嵗正月癸卯儀成踰年而成機用精至詔置文明殿今之文德殿也東南隅漏室中長編置文明殿之鐘鼓樓志云置殿廷東鼓樓下以思訓為渾儀丞思訓敘其制度云渾儀者法天象地數有三層有地軸地輪地足亦有橫輪側輪斜輪定關中關小關天柱七直神左撼鈴右扣鐘中擊鼓以定刻數其七直一晝夜方退是日月木土火金水中有黃道天足十二神報十二時刻數定晝夜長短上有天頂天牙天關天指天托天束天條布三百六十五度為日月五星紫微宫及周天列宿并斗建黃赤二道太陽行度定寒暑進退古之制作運動以水頗為疏略寒暑無凖乃以水銀代之運動不差舊制太陽晝行度皆以手運今所制取於自然自東漢張衡始造至開元中詔僧一行與梁令瓉造渾天儀後銅鐵漸澀不能自轉今思訓所作起為樓閣之狀數層髙丈餘以木偶人為七直神搖鈴撞鐘擊鼓又作十二神各直一時至其時即自執辰牌循環而出并著日月星辰皆須仰視其機轉之用俱隱樓中其制頗巧得開元遺像一作法後梁於汴州造銅渾儀唐長興三年七月繕理至道司天臺銅渾儀渾天臺法要至道元年乙未嵗十二月庚辰新鑄銅渾儀成韓顯符加司天秋官正專渾天之學淳化初表請造銅儀詔給用度工匠俾顯符規度擇巧匠鑄之至道元年十二月儀成沈括謂顯符所造依倣孔挺朝崇斛蘭之法失於簡略太宗顧侍臣曰渾儀制度廢之已久如顯符於隂陽律厯頗有性格遂令考天象倣古人遺意創造此器踰年而就觀其日月晦明節候盈縮星辰晷度以管一窺疏密髙下無絲毫之誤信靈臺之祕寶也詔於司天監築臺置之仍以其事付史館賜顯符雜綵五十匹顯符自言鑄儀制度凡九事一曰定天經雙規規上均賦三百六十五度南北並立四回七十二度屬紫微宫四時常見謂之上規中一百一十二度四回二百二十度屬黃赤道近日而隱逺日而見謂之中規繞南極四回七十二度除老人星外四時常隱謂之下規二曰遊規均賦三百六十五度以釭貫於雙規顛軸之上令得左右運轉夾其規管規星逺近隨天周遍無所不至三曰直矩矩於兩極之間用夾規管中置關軸令其遊規運轉四曰窺管使人即規管望於下衡即運動於上用齊日月五星進退盈縮所至宿度量衆星互相逺近之數五曰平凖輪一在水臬之上上分八卦十干十二辰二十四氣七十二候中定四維日辰時正晝夜百刻六曰赤道環一乃春秋分日行赤道度隂陽之所交晝夜平暄涼等七曜之行中道也七曰黃道環一乃日行盈縮月行九道之限五星順留伏匿理厯之常數也八曰龍柱四立於平凖輪下為龍能變化以御天體九曰水臬十字為之其水平滿北辰正以置四隅隅水平則天地準顯符本李淳風一行之遺法凡測驗皆據乾元厯云云本一本云二年又上候儀志獨著候儀法顯符上法要十卷崇文目云渾儀法要十卷序云伏羲立渾儀測北極髙下量日景短長定南北東西觀星間廣狹自伏羲甲寅年至皇朝大中祥符三年庚戌嵗積三千八百九十七年五帝之後汔今明厯象之元知渾天之奧者僅十餘朝考而論之臻至妙者裁四五漢洛下閎修渾儀測太初厯云後五百年必當重製至唐李淳風果合前契貞觀初淳風又言前代得失因令銅鑄至七年成起凝暉閣於禁中俾侍臣瞻驗既在宮掖人莫得見後失其處所玄宗命一行修大衍厯以渾儀為證梁令瓉造木式一行謂其精密思出古人遂以銅鑄今文德殿鼓樓下有古木銅渾儀一制極疏略不可放用本傳渾儀之成則司天嵗上細行歷益可致祥密渾儀之下又為龍柱者以龍能變化以御天體其制有九志顯符自著經十卷上于書府銅儀之制有九祥符龍圖閣銅渾天儀祥符三年庚戌嵗閏二月甲寅四日司天監言冬官正韓顯符造銅渾一作候儀成詔移入龍圖閣令顯符選學生中可教者傳授其業十一月戊寅三日召輔臣至龍圖閣觀銅渾儀閣在會慶殿西挾以資政述古殿其制為天輪二一平一側各分三百六十五度又為黃赤道立管於側輪中以測日月星辰行度皆無差沈括以為景德中造當從國史按長編三年閏二月甲寅冬官正韓顯符造銅渾儀成并上所著經十卷其制則本唐李淳風及一行之遺法云十一月戊辰徙司天臺韓顯符所造銅渾儀於龍圖閣召輔臣同觀因詔顯符擇監官或子孫可教者授其業顯符自言新鑄渾儀九事云云見前至道銅儀段皇祐新渾儀崇政殿渾儀圖渾儀總要長編皇祐三年辛卯嵗十二月庚辰翰林天文院新作渾儀成御撰渾儀總要十卷論前代得失已而留中不出初慶厯八年十二月庚寅命翰林學士錢明逸檢閲渾儀制度以聞遂命日官舒易簡于淵周琮等參用梁令瓉李淳風舊制改鑄皇祐元年三月庚子上御延和殿召輔臣觀新造渾儀木樣八月六日丙寅又詔輔臣於崇政殿觀渾儀圖三年十二月八日司天夏官正李用誨言重定渾儀鑄造已成欲乞依唐李淳風一行舊制紀年月以永將來從之沈括謂皇祐中冬官正舒易簡所造用唐梁令瓉僧一行之法頗詳備而失於難用厯志堯敇羲和制橫簫以考察星度其機衡用玉後世鑄銅為員儀以法天體祥符初韓顯符作渾儀但遊儀雙環夾望筒旋轉而黃赤道相固不動皇祐初又命日官舒易簡于淵周琮等參用淳風令瓉之制改鑄黃道渾儀又為漏刻圭表詔翰林學士錢明逸詳其法既成置渾儀於翰林天文院之候臺漏刻於文德殿之鐘鼓樓圭表於司天監第一重名六合儀二名三辰三名四遊熙寧渾儀浮漏表影三議熙寧六年癸丑嵗六月辛巳十一日提舉司天監陳繹云據同提舉沈括言乞修造渾儀浮漏蒙下本所詳定權判司天監丁洵等定以為當造造到渾儀浮漏小樣臣等看詳除司天監浮漏疏謬不可用須當改造詔令依樣造於司天監安置測驗比較疏密七年六月二十一日建本云丁亥同提舉司天監沈括以新定渾儀浮漏表影進呈括創為玉壺浮漏銀表皆置天文院上御迎陽門召輔臣觀之會要云御崇政殿觀之數問括括具對所以更改之理其儀改用古尺均賦辰度規環輕利黃赤道天常環並側置以北際當天度省去月道令不蔽橫簫增天樞為二度半以納極星規環二極各設環樞以便浮運渾儀之為器三在外曰體以立四方上下之位其次曰象以法天之運行常與天隨其內曰璣衡璣以察緯衡以察經璣可以左右以察四方之祥衡可以低昻以察上下之祥一本通略熙寧七年七月癸卯修起居注沈括等上渾儀浮漏遷為右正言賜銀絹有差舊銅儀藏於法物庫七年七月十日沈括上渾儀浮漏景表三議斂古今之説以求數象有不合者十有三事朝廷令改造法物厯書長編七年六月辛卯詔以司天監新製渾儀浮漏於翰林天文院安置提舉司天監沈括秋官正皇甫愈等賜銀絹元豐中以司天監為太史局築候臺先是治平四年十一月二十四日以天章待制孫思恭有厯學命看詳翰林天文院渾儀熙寧渾儀議熙寧七年七月十日沈括上渾儀議曰五星之行有疾舒日月之交有見匿求其次舍經劘之會其法一寓於日凡三百六十有五日四分日之幾一而謂之嵗周天之體日别之謂之度度之離其數有二日行則舒月行則疾會而均别之曰赤道之度日行自南而北升降四十有八度而迤别之曰黃道之度度不可見其可見者星也日月五星之所由有星焉當度之畫凡二十有八而謂之舍舍所以挈度度所以生數也度在天者也為之璣衡則度在器度在器則日月五星可以轉乎器中而天無所豫也天無所豫則在天者不為難知也自漢以前為厯者必有璣衡其後雖有璣衡而不為厯作作厯者亦不復以器自考至唐一行步大衍厯始用渾儀參實故其厯所得比諸家差多臣嘗歷考古今儀象之法書所謂璿璣玉衡惟鄭康成粗記其法至洛下閎製圓儀賈逵又加黃道其詳皆不存於書其後張衡為銅儀於密室以水轉之蓋所謂渾象非古之璣衡也括又曰舊法規環一面刻周天度一面加銀丁蓋以夜候之天晦不可目察則以手切之古人以璿飾璣疑亦為此吳王蕃陸績皆嘗為儀及象其説謂舊以二分為一度而患星辰稠概衡改用四分而患椎重難運故蕃以三分為度周丈有九寸五分寸之三而具黃赤道焉至劉曜時南陽孔挺製銅儀有雙規正矩子午以象天有橫規判儀之中以象地有特規斜絡天腹以候赤道南北植幹以法二極其中乃為遊儀窺管曜太史令朝崇斛蘭皆為鐵儀其規有六四常定一象赤道其二象二極乃定所謂雙規者也惟南北柱曲抱雙規下有縱橫水平以銀錯星度小變舊法而皆不言有黃道疑失傳也唐李淳風别為圓儀三重其外曰六合次曰三辰又次曰四遊而一行以為難用其後梁令瓉更以木為遊儀因淳風法而附新意詔與一行雜校得失改鑄銅儀古今稱其詳確至道中初鑄渾儀於司天監多因斛蘭朝崇之法皇祐中改鑄渾儀於天文院始用令瓉一行之論而去取交有得失臣今斂古今之説以求數象有不合者凡十有三事一曰舊説以中國於地為東南當令西北望極星不當中北臣以中國觀之天常北倚可也古之候天者自安南都護府至浚儀太嶽臺才六千里而北極之差凡十五度稍北不已詎知極星之不直人上也臣讀黃帝素問書乃常以天中為北也常以天中為北則以極星常居天中也二曰紘平設以象地體今渾儀置於崇臺之上下瞰日月所出則紘不與地際相當蓋渾儀考天地之體有實數有凖數衡之低昻乃所當謹臺之髙下非所恤也衡凖數臺實數三曰當省去月環月之出入專以厯法步之四曰衡之兩端以鈎股法求之下徑三分上徑一度有半則兩竅相覆大小略等五曰臣考驗極星而後知天中不動處逺極星乃三度有餘而祖暅窺考猶為未審今當為天極徑七度六曰新儀當側規如車輪之牙而不當衡規如鼓陶其旁迫狹難賦辰刻七曰新法定宿而變黃道此定黃道而變宿但可賦三百六十五度而不能具餘分八曰當省去月道徙璣於赤道之上而黃道居下則星度易審九曰司天監三辰儀設齒於環背不與橫簫會當移列兩旁十曰舊重璣椎重難運今小損其制十一曰今當變赤道與黃道同法十二曰當側置黃赤道使天度出北際之外十三曰當徙地紘稍下候三辰伏見專以紘際為法自當默與天合七月癸卯新渾儀成元豐渾儀法要至道渾儀法要見上自至道用韓顯符渾儀其後司天官周琮于淵加黃道熙寧中舊器壞沈括更造以意增損器成數年未能定與浮漏景表不應陳襄奏舊渾儀壞不可用而後所造新儀考之又不合願付歐陽發詳定從之發較三家考古法先為定儀奏之元豐五年正月二十三日學士王安禮言詳定渾儀官歐陽發言至道皇祐之器皆差今造渾儀浮漏木樣進呈上召問曰浮漏以玉筒下水者當堅久也對曰玉不如銅沈括嘗用玉今下水比初加達矣上以為然遂命鑄新儀漏表集其説號法要元祐中蘇頌承詔詳定渾天儀器象制度為新儀象法要一卷月令正義考靈耀云一度二千九百三十二里千四百六十一分里之三百四十八周天百七萬一千里是天圓周之里數也以圍三徑一言之直徑三十五萬七千里此二十八宿周回直徑之數也然二十八宿之外上下東西各有萬五千里是為四遊之極謂之四表據四表之內并星宿內揔有三十八萬七千里然則天之中央上下正半之處十九萬三千五百里地在於中是地去天之數也渾天之體雖繞於地地則中央正平天則北高南下北極高於地三十六度南極下於地三十六度黃裳作渾天儀以木為之元祐渾天儀象法略集英殿儀象吏部尚書臣蘇頌先準元祐元年冬十一月詔旨定奪新舊渾儀對得新儀係至道皇祐年製造並堪行用舊渾儀係熙寧中所造環器法薄水跌低墊難以行使臣切以儀象之法度數備存而日官所以互有論訴者蓋以器未合古名亦不正至於測候須人運動人手有髙下故躔度亦從而移轉是致兩競各指得失終無定論蓋古人測候天數其法有二一曰渾天儀規地機隱於內上布經躔以考日星行度寒暑進退如張衡渾天開元水運銅渾是也二曰銅候儀今新舊渾儀翰林天文院與太史局所有是也又案吳中常侍王蕃云渾天儀者羲和之舊器積代相傳謂之璣衡其為用也以察三光以分度宿者也又有渾天象者以著天體以布星辰二者以考於天蓋密矣詳此則渾天儀銅候儀之外又有渾天象凡三器也渾天象歷代罕傳其制惟書志稱梁武祕府有之云是宋元嘉中所造者由是而言古人候天具此三器乃能盡妙今唯一法誠恐未得親密然則張衡之制史失其傳開元舊器唐世已亡國朝太平興國初巴蜀人張思訓首創其式以獻太宗皇帝召工造於禁中踰年而成詔置文明殿今文德殿是也東鼓樓下題曰太平渾儀自思訓死機繩斷壞無復知其法制者臣昨訪得吏部守當官韓公廉通九章算術嘗以鉤股法推考天度臣切思古人言天有周髀之術其説曰髀股也股表也日行周徑里數各依算術用勾股二里差推晷影極遊以為逺近之數皆得表股周人受之故曰周髀若通此術則天數從可知也因説與張衡一行梁令瓉張思訓法式大綱問其可以尋究依倣製造否其人稱若據算術案器象亦可成就既而撰到九章鈎股測驗渾天書一卷并造到木樣機輪一座臣觀其器範雖不盡如古人之説然水運輪亦有巧思若令造作必有可取遂具奏陳乞先創木樣進呈差官試樣如候果有凖即别造銅器奉二年八月十六日詔如臣所請置局差官及專作材料等遂奏差壽州州學教授王沇之充專監造作太史局夏官正周日嚴秋官正于太古冬官正張仲宣等與韓公亷同充製度官局生袁惟幾苗景張端節劉仲景學生侯允和于湯臣測驗晷景刻漏等至三年先造成小樣有旨赴都堂呈驗造大木樣至十二月工畢閏十二月二日甲辰得旨置於集英殿臣謹案歷代天文之器制範頗多法亦小異至於激水運機其用則一蓋天者運行不息水者注之不竭以不竭之流逐不息之運茍注挹均調則參校旋轉之勢無有差舛也故張衡渾天則云室中以漏水轉之令司之者閉户唱之以告靈臺之觀天者璇璣所加某星始見某星始中某星今沒皆如符合唐開元中詔浮圖一行與率府兵曹梁令瓉及諸術士更造鑄銅渾為之員天之象上具列宿及周天度數注水激輪令其自轉一日一夜天轉一周又别置二輪絡在天外綴以日月令得運行每天西轉一匝日正東行一度月行十三度有畸凡二十九轉而日月會三百六十五轉而月行匝仍置木匱以為地平令儀半在地下又立二木偶人於地平之前置鐘鼓使木人自然撞擊以候辰刻命之曰水運渾天俯視圖既成置武成殿前以示百官梁朝渾象以木為之其員如丸遍體布二十八宿三家星黃赤道及天河等别為橫規環以繞其外上下半之以象地張思訓渾儀為樓數層髙丈餘中有輪軸關柱激水以輪又有神直搖鈴扣鐘擊鼓每一夜周而復始又有十二神各直一時以定晝夜之長短至冬至水凝則以水銀代之故無差舛按舊法日月行度皆人所運新制成於自然尤為精妙然則據上所造張衡所謂靈臺之璇璣者兼渾儀候儀之法也置密室中者渾象也故葛洪云張平子陸公紀之徒咸以為推步七曜之運以度厯象昏明之證候校以三八之氣考以刻漏之分占晷景之往來求形驗於事情莫密於渾象也開元水運俯視圖亦渾象也思訓凖開元之法而上以蓋為紫宫旁周天度而正東西轉出其新意也今則兼採諸家之説備儀象之器共置一臺有二隔渾儀置於上渾象置於下樞機輪軸隱中鐘鼓時刻司辰運於輪上木閣五層蔽於前司辰擊鼓搖鈴執牌出沒於閣內以水激輪輪轉而儀象咸動此兼用諸家之法渾儀則上候三辰之行度增黃道為單環環中日見半體使望筒常指日月體常在筒竅中天西行一周日東移一度此出新意也渾象則列紫宮於此頂布中外官星二十八舍周天度赤黃道天河遍於天體此用王蕃及隋志所説也二器皆出一機以水激之不由人校之前古法之疏密未易知而器度算數亦倣佛其遺象也虞書稱舜在璿璣玉衡以齊七政蓋觀四七之中星以知節候之早晚考靈曜曰觀玉儀之遊昏明主時乃命中星者璿璣中而星未中為急急則日過其度月不及其宿璿璣未中而星中為舒舒則日不及其度月過其宿璿璣中而星中為均均則風雨時庶草繁廡而五穀登萬事康由是言之觀璿璣中不獨視天時而布政令抑欲察災祥省得失也易曰先天而天不違後天而奉天時此之謂也今依月令創為四時中星圖以晚昏之度附於卷後將以上備聖主南面之省觀此儀象之大用也又上論渾天儀銅候儀渾天象三器不同古人之説亦有所未盡陳苗謂張衡所造蓋亦止在渾象七曜而何承天莫辨儀象之異若但以一名命之則不能盡其妙用也今新制備二器而通三用當總謂之渾天恭候聖鑒以正其名臣切詳周官馮相氏掌十有二辰十有二月二十有八星之位辨其敘事以會天位保章氏掌天星以志星辰日月之運動辨其吉凶以詔救政蓋嵗月辰日星皆有方位知其位之所在則知其時數之常然可考而著之於厯此馮相氏之所掌也若有變動非常有繫於吉凶之應者以時觀其象而詔其占則保章氏掌之蓋馮相氏考其常所以正時而頒庶事保章氏司其變則決之於象而詔救政先王分其職以為之之意也今太史局治厯辨候合為一司緣厯術有疏密天文有常變治厯或疏則不足以知其常瞻候或惰則不足以得其變瞻候之家茍欲合其厯奏報候簿遂容不實近者局生訟奏報之妄草澤斥厯算之疏究其所因弊或在是近令禮部祕書省官定新舊儀親密者一座行使臣已行定驗今相度且欲存留舊儀令厯生算步治厯得以參驗其新造兩臺儀象制度精巧兼得張衡李淳風張思訓之制以之瞻候尤為凖的今欲别為渾天儀象所以隸太史仍差官專一提舉因命頌提舉每日别行奏報以此關互無容茍簡則朝廷可以坐知象緯之實因之參酌中失而圖其舊政庶幾不失先王馮相保章分職之意本所乞更重作渾天儀從之哲宗元祐時太史局創水運渾儀二與舊儀為三欲廢其一局生交訟不決中書舍人林希言新儀精密乃司天之法器然舊儀用久宜兩存之詔宰相臨視皆以為然由是新舊兩存不廢木樣成又命翰林學士許將詳定元祐四年己巳嵗三月八日己卯將言與周日嚴苗景晝夜交驗與天道合詔以銅造始製以木觀於集英驗之不差乃以銅造以元祐渾天儀象為名將乞正名渾天儀從之時太史局直長趙齊良奏宋以火德王名水運非吉兆乞更名詔以元祐渾天儀象為名竪置於國之西南七年壬申嵗四月二日詔左丞蘇頌撰渾天儀象銘頌又圖其形製著為成書上之詔藏祕閣六月十四日儀象成召輔臣閲之今其法不傳元符元年六月二十七日知亳州林希上渾天儀象碑文希先為吏部尚書被命撰文會要元祐四年三月八日己卯詔以銅造仍以元祐渾天儀象為名翰學許將等請即象為儀并為一器從之紹聖元年十月十六日詔禮部祕省以新舊渾儀同測驗擇可用者三年六月十三日元祐渾儀所乞修寫儀象製度法略各一部納尚書省祕閣從之通略初吏書蘇頌請别製渾儀因命頌提舉頌邃於律厯又以吏部令史韓公廉善算術有巧思乃奏用之且授以古法為臺三層上設渾一作候儀中設一作置渾象下設一作布司辰貫以一機激水轉輪不假人力時至刻臨則司辰出告星度所次占候測驗不差晷刻晝夜晦明皆可推見元祐四年三月木樣成前此未有也詔翰林學士許將等詳定己卯將等言晝夜校驗與天道已參合乃詔以銅造仍以元祐渾天儀象為名其後將等又言前所謂渾天儀者其外形圓即可遍布星度其內有璣衡即可仰窺天象若儀象則兼二器有之同為一器今所見渾象别為二器而渾儀占測天度之真數又以渾象置之密室自為天運與儀參合若并為一器即象為儀以同正天度則兩得之請更作渾天儀從之頌因其家所藏小樣而悟於心令公廉布算數年而器成大如人體人居其中有如籠象因星鑿竅如星以備激輪旋轉之勢中星昏晚應時皆見於竅中星官厯翁聚觀駭歎蓋古未嘗有也紹聖中欲毁之林希為言得不廢紹聖三年六月十三日寫儀象制度法略各一部納尚書省祕閣規天矩地機輪隱中以察三光驗寒暑是之謂儀其圓如丸其大數圍以布列宿著天體是之謂象二器司天之要法也縱以天經橫以地渾金虯夾繞鼇雲上承三辰四遊運轉不息激水卬流驗之密室橫簫所望曰星其中司辰告刻應以鐘鼓曰象卬觀曰儀俯視人位乎間天外地內宣和六年七月甲辰二十九日詔置璣衡所以宰臣領之得方士璣衡之書造小樣驗之與天運合如唐一行之制請置局製造唐一行作厯梁令瓉作黃道遊儀測知畢觜參鬼四宿赤道宿度與舊不同皇祐初詔造黃道渾儀鑄銅為之自後測驗赤道宿度又十四宿與一行所測不同兩朝志自建隆迄治平五正厯象作為銅儀經法具於所司紹興渾天儀蓋天二年壬子嵗九月甲子詔太史局令丁師仁等造渾天儀後不果成三年正月辛未六日工部郎袁正功獻渾儀木式是月壬戌進呈十六日太史令丁師仁等請折半製造許之用銅一萬斤之先是二年十一月一日正功言渾儀安立非子午正則有差詔李繼宗等測驗定正初東京渾儀凡四至道儀在刻漏所皇祐儀在翰林天文院熙寧儀在太史局元祐儀在合臺每座約重二萬斤城破皆為虜所索揚州之陷也呂頤浩得渾儀法物二事獻諸朝至是折半但用鑄八千四百八斤有竒卒不就五月丙辰命工部侍郎李擢提舉製造渾儀十一月甲戌工部郎謝伋言宜先詢考制度敷求通曉天文厯數之學如漢賈逵張衡本朝之蘇頌者參訪是非然後可作望下溫州訪求蘇頌遺書考質制度初師仁等言若往他州則臨時定北極髙下量行移易有呂璨者言師仁等所募工不知鑄法况渾天無量行更易之制若用於臨安與天參合移往他州必有差忒詔别聽指揮十四年四月丙戌五日命太師秦檜提舉制造渾儀祕書省修製詔有司求蘇頌遺法來上上曰宫中製成小範可窺測日以晷度夜以樞星為則樞星中星也非久降出用以為式但廣其尺寸耳遂命內侍邵諤主其事久之乃成三十二年授太史局乾道三年正月詔太史局置臺設渾儀測驗七政行度演造新厯慶元四年七月祕省築渾儀臺髙二丈一尺資中士人張大楫以木為蓋天言可備軍幕中候驗紹興七年夏制使席益獻諸朝總敘渾天下閎妄人壽昌之後永平中賈逵上遊儀順帝時張衡妙盡璿璣之正在魏則朝崇斛蘭吳則葛衡陸績王蕃隋則耿詢宋則錢樂之唐則淳風一行黃帝題期蓋圖是興顓頊御厯渾儀肇制舜德文明璿璣齊政有周郅隆厥有土圭玉儀之遊銅渾之轉義取璣衡智起渾蓋神橅巧械視古無比治厯不難於算平朔而難於定氣差制儀不難於規赤道而難於步黃道堯厯日月玉儀是稽舜在璣衡七政攸齊課密周髀用越土圭自舜以璣衡齊七政漢洛下閎始復創制迄於隋唐代有制作其最精密者張衡之靈憲淳風之黃道令瓉之木遊一行之銅渾占候雖有器齊平必以德以璿為璣故運而不已者有以觀其變以玉為衡故躔次有度者有以定其位蓋軒謂天轉如磨盤日月星辰俱北回求合左旋之義宣夜稱天無形質莫如渾天為可據天周於氣氣周於水水周於地地內而天外天大而地小天包地地依天天體周圍皆三百六十五度四分度之一徑一百二十一度四分度之三天左旋東出地上西入地下一晝一夜行三百六十六度四分度之一地體徑二十四度其厚半之邵雍謂水火土石合而為地所謂徑二十四度乃土石之體土石之外水接於天皆為地體地之徑亦一百二十一度四分度之三周髀序云渾天有靈憲之文蓋天有周髀之法事類賦注渾天儀曰天地各乘氣而立載水而浮日月星辰繞地下故二十八宿半隱天轉如車轂之運楊泉物理論曰儒家立渾天以追天形從車輪焉周髀立蓋天言天氣循邊而行從磨石焉王蕃渾天説曰舊説天地之體狀如鳥卵天包地外猶殼之裹黃周回如彈丸故曰渾天言其形渾渾如也天文録曰天如欹車蓋北髙南下關令內傳曰天地南午北子相去九千萬里東卯西酉亦九千萬里四隅空相去九千萬里天去地四十千萬里天有五億五萬五千五百五十里地亦如之各以四海為脈邵子曰天圓而地方天北髙而南下是以望之如倚蓋然地東南下西北髙是以東南多水西北多山也天覆地地載天天地相函故天下有地地上有天又曰天以理可盡而不可以形盡渾天之術以形盡天可乎張行成曰古之言天有三家曰宣夜曰蓋天曰渾天宣夜之學人謂絶無師法蓋天之學惟唐一行知其與渾天不異蓋天之法如繪像止得其半渾天之法如塑像能得其全堯之厯象蓋天法也舜之璣衡渾天法也渾法密於蓋天創意者尚略述作者愈詳也宣夜人雖非之竊謂作者不無所見但論述者失其本旨爾郗萌記曰日月衆星自然浮生虛空之中其行其止皆須氣焉此則東西運轉氣即天虛即氣也虞喜曰天確乎在上有常安之形者北極不動之義天之頂也邵子曰望之如倚蓋此兼取蓋天之説也朱氏書説天體至圓周圍三百六十五度四分度之一繞地左旋常一日一周而過一度日麗天而少遲一日繞地一周無餘而常不及天一度月麗天而尤遲一日常不及天十三度十九分度之七三禮義宗聖人因躔次之常定時度之變以天道既逺不可以尺度窮乃因兩耀運行以一晝一夜為一度積三百六十五度四分度之一而日周天蓋因星以推之取星周為度之遍故周髀云以牛星初來正在南方昏中之時用為求度之始東西為隂陽之中故度數少南北為隂陽之極故度數多故東少於南西少於北玉海卷四
