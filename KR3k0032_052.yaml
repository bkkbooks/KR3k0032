body:
  text: 玉海卷五十二宋王應麟撰藝文書目藏書劉歆著七略荀朂分四部合兵書術數方技於諸子自春秋類擲出史記别為一六藝諸子詩賦皆仍歆舊其後歷代所編如王儉阮孝緒之徒咸從歆例謝靈運任昉之徒咸從朂例唐之四庫亦祖述朂而加詳焉歐陽公謂其始於開元誤矣周䇿府穆天子傳天子東還至羣玉之山容氏之所守先王所謂䇿府古帝王藏書䇿之府所謂藏之名山也讀書於菞丘口蠧書於羽陵注謂暴書中蠧蟲序云登崑崙見西王毋竹簡素絲皆是古書禮外史掌四方之志志記也若魯春秋晉乘楚檮杌掌三皇五帝之書所謂三墳五典小史掌邦國之志周志鄭書之屬書大訓在西序河圖在東序記禮在瞽宗書在上庠左傳昭二年春韓宣子來聘觀書太史氏見易象魯春秋曰周禮盡在魯莊子孔子西藏書於周室周古今篇籍漢儒林傳序周道既衰孔子興云云究觀古今篇籍乃稱曰大哉堯之為君又曰吾從周于是敘書則斷堯典稱樂則法韶舞論詩則首周南綴周之禮因魯春秋舉十二公行事繩之以文武之道成一王法晚而好易讀之韋編三絶而為之傳仲尼之後春秋分為五詩分為四易有數家之傳漢七略六略别録藝文志漢興大收篇籍廣開獻書之路惠帝四年三月甲子除挾書律應劭注挾藏也孝武世書缺簡脫於是建藏書之䇿置寫書之官注如淳曰劉歆七略曰外則有太常太史博士之藏內則延閣廣內祕室之府文選注劉歆七略曰尚書有青絲編目録如孝武敕丞相公孫弘廣開獻書之路百年之間書積山歆移書曰孝文使朝錯受尚書初出屋壁詩始萌芽天下衆書頗出皆諸子傳説猶廣立於學官為置博士至孝武然後鄒魯梁趙頗有詩禮春秋先師皆起建元之間故詔書曰書缺簡脫朕甚閔焉庾信有漢武帝藏書贊下及諸子傳説皆充祕府成帝以書頗散亡使陳農求遺書成紀河平三年八月乙卯光祿大夫劉向校中祕書謁者陳農使求遺書於天下詔光祿大夫劉向校經傳諸子詩賦步兵校尉任宏校兵書太史令尹咸校數術侍醫李柱國校方技每一書已向輒條其篇目録而奏之會向卒哀帝復使子歆卒父業于是揔羣書而奏其七略故有輯略六藝略諸子略詩賦略兵書略術數略方技略六藝略自易經十二篇易傳周氏服氏楊氏蔡公韓氏王氏各二篇丁氏八篇至章句施孟梁丘凡易十三家二百四十九篇秦燔書而易為筮卜之事傳者不絶漢興田何傳之訖於宣元有施孟梁丘京氏列於學官而民間多有費髙二家之説劉向以中古文易經校施孟梁丘中者天子之書也或脫去無咎悔亡自尚書古文經次歐陽次夏侯章句議奏凡書九家四百一十二篇入劉向稽疑一篇書者古之號令自詩經齊魯韓三家次魯故魯説至毛詩故訓傳凡詩六家四百一十六卷古者有采詩之官王者所以觀風俗知得失自考正也自禮古經至議奏凡禮十三家五百五十五篇入司馬法一家百五十五篇帝王質文世有損益至周曲為之防事為之制故曰禮經三百威儀三千周衰諸侯去其籍自樂記次王禹記至雅琴師氏龍氏凡樂六家百六十五篇出淮南劉向等琴頌七篇易曰先王作樂崇德殷薦之上帝以享祖考故自黃帝下至三代樂各有名自春秋古經次公羊榖梁左氏微至漢大年紀凡春秋二十三家九百四十八篇省太史公四篇古之王者世有史官君舉必書所以謹言行昭法式也左史記事事為春秋言為尚書自論語古二十一篇次齊魯至孔子徒人圖法凡論語十二家二百二十九篇論語孔子應答弟子時人及弟子相與言而接聞於夫子之語自孝經古孔氏長孫江氏何氏至説三篇凡孝經十一家五十九篇孝經孔子為曽子陳孝道也自史籒八體六技次蒼頡凡將急就至杜林蒼頡故凡小學十家三十五篇入揚雄杜林二家二篇凡六藝九種一百三家一百二十三篇入三家一百五十九篇出篇重十一篇六藝之文樂以和神仁之表也詩以正言義之用也禮以明體明者著見故無訓也書以廣聽知之術也春秋以斷事信之符也序六藝為九種諸子略自晏子子思至揚雄所序儒五十三家八百三十六篇入揚雄一家三十八篇十注三十一家戰國人二一家漢人內髙祖傳十三篇注云髙祖與大臣述古語與詔䇿孝文傳十一篇文帝所稱及詔䇿儒家者流出於司徒之官助人君順隂陽明教化者也於道最為髙然惑者既失精微而辟者又隨時抑揚違離道本茍以譁衆取寵自伊尹太公辛甲鬻子至椘子及道家言道家三十七家九百九十三篇道家蓋出於史官歷記成敗存亡古今禍福之道然後知秉要執本清虛以自守卑弱以自持及放者為之則欲絶去禮學兼棄仁義曰獨任清虛可以為治自宋司星子韋至雜隂陽隂陽二十一家三百六十九篇隂陽者流蓋出于羲和之官拘者為之則牽禁忌泥小數舍人事而任鬼神自李悝商君至法家言法十家二百一十七篇法家者流蓋出於理官信賞必罰以輔禮制及刻者為之専任刑法欲以致治自鄧析尹文子至毛公名七家三十六篇名家者流蓋出於禮官古者名位不同禮亦異數孔子曰必也正名乎及譥者為之則茍鉤鈲析亂而已自尹佚田俅子至墨子墨六家八十六篇墨家者流蓋出於清廟之守貴儉兼愛上賢右鬼非命上同及蔽者為之因以非禮推兼愛之意而不知别親踈自蘇子張子至莊安待詔金馬聊蒼凡縱橫家十二家百七篇縱橫家者流蓋出於行人之官當權事制宜受命而不受辭及邪人為之則上詐諼而棄其信自孔甲盤盂次大古禹字言禹所作至雜家言雜二十家四百三篇入兵法雜家蓋出於議官兼儒墨合名法知國體之有在見王治之無不貫及蕩者為之則漫羡而無所歸心自神農野老至祭癸農九家百一十四篇農家者流出于農稷之官八政曰食貨孔子曰所重民食及鄙者為之欲使君臣並耕悖上下之序自伊尹説至虞初周説百家小説十五家千三百八十篇小説者流蓋出於稗官街談巷語道聽塗説者之所造也閭里小知者之所及亦使綴而不忘或一言可采亦芻蕘狂夫之議凡諸子十種百八十九家四千三百二十四篇出蹴鞠一家二十五篇諸子十家其可觀者九家而已異家各推所長窮知究慮以明其指雖有蔽短合其要歸亦六經之支與流裔若能修六藝之術而觀此九家之言舍短取長則可以通萬方之略矣詩賦略始屈原至王褒賦二十家三百六十二篇始陸賈至朱宇賦二十一家二百七十四篇始孫卿至路恭二十五家百三十六篇賦三種合六十六家七百七十二篇自客主賦至隱書雜賦十二家二百三十三篇自髙祖歌詩至南郡詩二十八家三百一十四篇凡詩賦五種入揚雄八萹百六家千三百一十八篇內泰一雜甘泉夀宫歌詩十二篇宗廟歌詩五篇傳曰不歌而誦謂之賦登髙能賦可以為大夫古者諸侯卿大夫交接鄰國必稱詩以諭其志蓋以别賢不肖而觀盛衰故孔子曰不學詩無以言也春秋之後聘問歌詠不行於列國學詩之士逸在布衣而賢人失志之賦作矣兵書略自吳孫子兵法至韓信凡權謀十三家二百五十九篇省伊尹太公管子孫卿子鶡冠蘇子蒯通陸賈淮南王二百九十九種出司馬法入禮自楚兵法至項王凡形勢十一家九十二篇圖十八卷自大一兵法至辟兵威勝方隂陽十六家二百四十九篇圖十卷自鮑子兵法至蹴鞠兵技巧十三家百九十九篇省墨子重入蹴鞠餘見兵書凡兵書五十三家七百九十篇圖四十三卷省十家一百七十一篇重入一家十五篇出百五十五篇兵家者蓋出古司馬之職王官之武偹也術數略自泰一雜子星至圖書祕記天文二十一家四百四十五卷自黃帝五家厯至杜忠算術厯譜十八家六百六卷自太一隂陽至五音定名五行三十一家六百五十二卷自龜書至易卦八具蓍龜十五家四百一卷自黃帝長栁占夢至種木藏果相蠶雜占十八家三百一十三卷自山海經至相六畜刑法六家百二十二卷術數六種百九十家二千五百二十八卷術數者皆明堂羲和史卜之職方技略自黃帝內經至旁篇醫經七家二百一十六篇自五藏六府方至食禁經方十二家二百七十四卷自容成隂道至內房方房中八家百八十六卷自宓戲至泰一黃冶神仙十家二百五卷凡方技三十六家八百六十八卷方技者皆生生之具王官之一守也大凡書六略三十八種五百九十六家萬三千二百六十九卷入三家五十篇省兵十家劉向傳成帝即位向遷光祿大夫時帝元舅王鳳為大將軍秉政倚太后専國權兄弟七人皆封為列侯時數有大異向以為外戚貴盛之咎上方精於詩書觀古文詔向領校中五經祕書向見尚書洪範箕子為武王陳五行隂陽休咎之應向乃集上古以來歷春秋六國至秦漢符瑞災異之説推迹行事連傳禍福著其占驗比類相從各有條目凡十一篇號洪範五行傳河平中劉歆受詔與父向領校祕書講六藝傳記諸子術數方技無所不究志注别録云長社尉杜參同向校中祕書向死哀帝即位復領五經卒父前業歆乃集六藝羣書種别為七略丞相史尹咸以能治左氏與歆共校經傳本傳贊七略剖判藝文揔百家之緒有意推本之也敘傳班斿為右曹中郎將與劉向校祕書每奏事斿以選受詔進讀群書上器其能賜以祕書之副隋志孝成命謁者陳農求遺書於天下劉向校中祕書哀帝使子歆嗣父之業乃徙溫室中書於天祿閣上歆遂總括羣書著為七略大凡三萬三千九十卷又曰向别録歆七略剖析條流各有其部唐志劉向七略别録二十卷劉歆七略七卷隋志同簿録篇曰史官典籍有目録以為綱紀孔子刪書别為之序韓毛二詩亦皆相類舊唐志劉更生石渠典校之書卷軸無幾據歆之七略在漢藝文志者裁三萬三千九百卷後漢蘭臺石室東觀南宫諸儒撰集部類漸增西都賦注引劉向七略裴松之注蜀志亦引劉向七略文選注引劉歆七略南史宋袐書丞王儉依七略撰七志四十卷表獻之又撰定元徽四部書目漢七略要籍九流目録志劉歆奏七略今刪其要以備篇籍注師古曰刪去浮冗取其指要書家入劉向稽疑禮入司馬法樂出淮南劉向等琴頌春秋省太史公小學家入揚雄杜林凡六藝略入三家一百五十九篇出篇重十一篇此六藝之刪其要也兵權謀則省伊尹太公管子孫子鶡冠子蘇子蒯通陸賈淮南王而出司馬法入禮兵技巧則省墨子而入蹴鞠凡兵書略省十家二百七十一篇重入蹴鞠二十五篇此兵書之刪其要也至於儒家之入揚雄雜家之入兵法諸子家之出蹴鞠詩賦家之入揚雄八篇此諸子詩賦略之刪其要也師古曰凡言入者謂七略之外班氏新入之云出者與此同按隋志七略凡三萬三千九十卷藝文志之末曰大凡書六略三十八種五百九十六家萬三千二百六十九卷入三家五十篇省兵十家敘傳秦人是滅漢修其缺劉向司籍九流以别爰著目録略序洪烈張衡傳上疏劉向父子領校祕書閲定九流亦無讖録司馬談論六家要指隂陽儒墨名法道德漢蘭臺圖籍經牒祕書表御史中丞在殿中蘭臺掌圖籍祕書禮小宰注若今御史中丞疏應劭云秩千石朝會獨坐副二御史大夫內掌蘭臺圖籍外督刺史紏察百寮故舉漢法以况之通典漢氏圖籍所在有石渠石室延閣廣內貯之於外府又御史中丞居殿中掌蘭臺祕書及麒麟天祿二閣藏之於內禁後漢圖書在東觀延熹二年始置祕書監一人典圖書屬太常魏蘭臺亦藏書籍而御史掌之薛夏云蘭臺為外臺祕書為內閣圖後五行志雲臺周家所造書術籍所藏後儒林傳光武遷洛其經牒祕書載之二千餘兩自此之後參倍於前及董卓移都自辟雍東觀蘭臺石室宣眀鴻都諸藏典䇿文章競共剖𣪚王允所收裁七十餘乘道艱復棄其半長安焚蕩莫不泯盡史記秦撥去古文眀堂石室金匱玉版圖籍散亂髙紀元年冬十月還軍霸上蕭何盡收秦丞相府圖籍文書張安世傳上行幸河東嘗亡書三篋詔問莫能知唯安世識之後法真傳博通內外圖典田弱薦真曰體兼四業詩書禮樂也學窮典奧三輔故事天祿石渠閣在未央宫大殿北以藏祕書劉歆曰古文舊書藏於祕府漢西京圖籍宋百官志漢西京圖籍所藏有天祿石渠蘭臺石室延閣廣內之府是也東京圖書在東觀又云東京圖籍在東觀故使名儒碩學著作東觀撰述國史班固西都賦天祿石渠典籍之府漢東觀仁夀閣新書詳見宫室觀類隋志光武中興篤好文雅明章繼軌尤重經術四方鴻生巨儒負帙自逺而至者不可勝算石室蘭臺彌以充積又以東觀及仁夀閣集新書校書郎班固傅􅐧等典掌焉並依七略而為書部固又編之以為漢書藝文志董卓之亂獻帝西遷圖書縑帛軍人皆取為帷囊所收而西猶七十餘載後漢傳班昭就東觀藏書閣踵成漢書黃香詣東觀讀所未嘗見書竇章入東觀劉瑜上書曰陛下開東序金縢史官之書魏中經晉中經簿四部祕閣四部書隋志魏氏代漢采掇遺亡藏在祕書中外三閣魏祕書郎鄭默始制中經默刪省舊文著魏中經時中書令虞松曰而今而後朱紫别矣祕書監荀朂又因中經更著新簿分為四部總括羣書一曰甲部紀六藝及小學等書二曰乙部有古諸子家近世子家兵書術數三曰丙部有史記舊事皇覽簿雜事四曰丁部有詩賦圖讃汲冢書朂傳云得汲冢中古文竹書詔朂撰次以為中經列在祕書之穆天子傳序謹以二尺黃紙寫上請付祕書繕寫藏中經副在二閣春秋正義太康元年得竹書七十五卷有周易上下經二卷紀年十二卷瑣語十一卷周王逰行五卷今謂穆天子傳此四部差為整頓詔荀朂和嶠以隸字寫之大凡四部合二萬九千九百四十五卷但録題及言盛以縹囊書用緗素至於作者之意無所論辨朂與中書令張華依劉向别録整理記籍東晉之初漸更鳩聚著作郎李充以朂舊簿校之其見存者但有三千一十四卷充遂總沒衆篇之名但以甲乙為次充傳云字弘度為大著作郎時典籍混亂充刪除煩重以類相從分作四部五經為甲史記為乙諸子為丙詩賦為丁甚有條貫祕閣以為永制晉中經十四卷荀朂撰唐志云晉中經簿十四卷晉義熙以來新集目録三卷唐志丘深之有歸藏案晉中經之續晉陽秋孝武寧康十六年詔著作郎徐廣校祕閣四部見書凡三萬六千卷魏志注周生烈所著述見晉武帝中經簿晉撰定官書張華傳嘗徙居載書三十乘祕書監摯虞撰定官書皆資華本以取正荀嵩傳西閣東序河圖祕書禁籍志成帝建始四年置尚書五人一人為僕射四人分為四曹通掌圖書祕記章奏之事文選注晉令曰祕書郎掌中外三閣經書南史何憲該通羣籍天閣寶祕無遺焉任昉劉渢共執祕閣四部書問其所知自甲至丁莫見所遺任昉詩劉略班藝虞志荀録宋四部目録七志隋志其後中朝遺書稍流江左宋元嘉八年祕書監謝靈運造四部目録大凡六萬四千五百八十二卷元徽元年祕書丞王儉又造目録大凡萬五千七百四卷儉又别撰七志一曰經典志紀六藝小學史記雜傳二曰諸子志紀今古諸子三曰文翰志紀詩賦四曰軍書志紀兵書五曰隂陽志紀隂陽圖緯六曰術藝志紀方技七曰圖譜志紀地域及圖書其道佛附見合九條然亦不述作者之意但於書名之下每立一傳而又作九篇條例編乎首卷之中文義淺近未為典則七志七録大體雖凖向歆而逺不逮十宋書元徽元年八月辛亥祕書丞王儉表上七志三卷南史本傳云四十卷齊書儉撰定元徽四部書目略儉集序云采公曾之中經刋弘度之四部依劉歆七更撰七志隋志宋元徽元年四部書目録四卷王儉撰今書七志七十卷王儉撰唐志賀縱補注文選後漢書注引今書七志中原文教之盛苻姚而已宋武入關收其圖籍才四千卷赤軸青紙文字古拙魏孝文徙都洛邑借書於齊魏闕書目録一卷逺覽馬史班書近觀王阮志録挹其風流體制削其浮雜鄙俚唐韋述傳開元初為櫟陽尉祕書監馬懷素奏述與諸儒即祕書續七志五年而成舊唐志晉總括羣書裁二萬七千九百四十五卷江表所存官書凡三千一十四卷至宋謝靈運造四部書目録凡四千五百八十二卷其後王儉復造書目凡五千七十四卷卷數與前不同宋祕書閣四部書目宋書殷淳為祕書丞在祕書閣撰四部書目凡四十卷行於世謝靈運為祕書監整理祕閣書史通宋孝王關東風俗傳亦有墳籍志其所録皆鄴下文儒之士讐校之司所列書名惟取當時撰者齊四部要略四部書目總明觀四部書齊書竟陵王子良集學士抄五經百家依皇覽例為四部要略千卷永明三年省總明觀於王儉宅開學士館以總明四部書充之隋志齊永明中祕書丞王亮監謝朏又造四部書目大凡一萬八千一十卷梁纘為祕書郎帝執四部書目曰讀此畢可言優仕矣梁四部七録五部目録隋志齊末兵火延燒祕閣經籍遺散梁初祕書監田昉躬加部集又於文德殿內列藏衆書華林園中總集釋典大凡二萬三千一百六卷而釋氏不預焉梁有祕書監任昉殷鈞四部目録任昉傳自齊永元以來四部篇卷紛雜昉手自讐校由是第目定焉殷鈞傳校定祕閣四部書更為目録又有文德殿目録術數之書更為一部使奉朝請祖暅撰其名故梁有五部目録武帝敕到洽抄甲部書為十二卷普通中有處士阮孝緒沈靜寡欲篤好墳史博采宋齊以來王公之家凡有書記參校官簿更為七録一曰經典録紀六藝二曰記傳録紀史傳三曰子兵録紀子書兵書四曰文集録紀詩賦五曰技術録紀數術六曰佛録七曰道録其分部題目頗有次序剖析詞義淺薄不經史通曰阮孝緒七録書有文德殿者丹筆寫其字元帝收文德之書及公私經籍歸江陵大凡七萬餘卷陳天嘉中又更鳩集考其篇目遺闕尚多七録十二卷阮孝緒撰唐志同梁天監以來四部書目四卷殷鈞撰唐志丘賔卿梁東宫四部目録四卷劉遵撰梁文德殿四部目録四卷劉孝標撰古今四部書目五卷梁劉杳撰陳祕閣圖書法書目録一卷陳天嘉六年夀安殿四部目録德教殿四部目録各四卷承香殿五經史記目録二卷唐志有陳天嘉四部書目四卷史記正義引七録魏甲乙新録北史孫惠蔚遷祕書丞見典籍新故雜揉首尾不全請依前丞盧昶所撰甲乙新録欲禆殘補缺損併有無校練句讀以為定本其無本者廣加搜求隋嘉則殿藏書開皇書目祕閣書三品四部七林北史隋西京嘉則殿有書三十七萬卷煬帝命祕書監栁顧言等詮次除其重復猥雜得正御本三萬七千餘卷納於東都修文殿又寫五十副本簡為三品分置西京東都宫省官府其正御書皆裝翦華綺寶軸錦標於觀文殿前為書室十四間窗户褥幔咸極珍麗大業十一年增祕書省百二十員並以學士補之隋志開皇三年祕書監牛弘表請搜訪異本每卷賞絹一匹於是異書間出平陳已後經籍漸􅊀於是總集編次為正副二本藏於宫中其餘以實祕書內外之閣凡三萬餘卷煬帝即位祕閣書寫五十副本分為三品上品紅琉璃軸中品紺琉璃軸下品漆軸于東都觀文殿東西廂貯之東屋藏甲乙西屋藏丙丁又聚古迹名畫於殿後起二臺東曰妙楷臺藏古迹西曰寶臺藏古畫又集道佛經别撰目録帝好著述成新書三十一部萬七千餘卷唐武德五年平偽鄭收圖書古迹命宋遵貴載之行經底柱多被漂沒存者十不一二其目録亦為所漸濡時有殘缺今考見存分為四部合條為一萬四千四百六十六部有八萬九千六百六十六卷六藝經緯六百二十七部五千三百七十一卷班固列六藝為九種合緯書為十種史之所記八百一十七部一萬三千二百六十四卷凡十三種諸子合八百五十三部六千四百三十七卷敘為十四種集部凡五百五十四部六千六百二十二卷合為三種凡四部經傳三千一百二十七部三萬六千七百八卷通計亡書合四千一百九十一部四萬九千四百六十七卷道經三百七十七部一千二百一十六卷佛經一千九百五十部六千一百九十八卷大凡經傳存亡及道佛六千五百二十部五萬六千八百八十一卷約文緒義凡五十五篇各列本條之下以偹經籍志唐志牛弘隋開皇四年書目四卷隋志云四部目録王劭隋開皇二十年書目四卷隋志又有開皇八年四部書目録四卷大業正御書目録九卷許善心傳時圖籍淆亂效阮孝緒七録更制七林各為總敘冠於篇首牛弘傳開皇初上表請開獻書之路曰周官外史掌三皇五帝之書及四方之志武王問黃帝顓頊之道太公曰在丹書有國家者曷嘗不以詩書而為教孔子制禮刋詩修春秋弘易道及秦皇馭宇下焚書之令此書之一厄也漢建藏書之䇿置校書之官及王莽末並從焚燼此書之二厄也光武下車求文雅肅宗親臨講肄和帝數幸書林及孝獻移都圖書縑帛皆取為帷囊此書之三厄也魏文更集經典皆藏在祕書內外三閣遣祕書郎鄭默刪定舊文論者美其朱紫有别晉荀朂定魏內經更著新簿劉石憑陵從而失墜此書之四厄也劉𥙿平姚收圖籍四千卷僣偽之盛莫過二秦齊梁之間經史彌盛王儉撰七志阮孝緒為七録總其書數三萬餘卷蕭繹有江陵收文德殿書及公私典籍七萬餘卷悉送荆州周師入郢悉焚之所收十才有二三此書之五厄也今御書單本合一萬五千餘卷部秩殘缺比梁舊目止有其半年踰千載數遭五厄興集之期屬膺聖世上納之于是下詔獻書一卷賚縑一匹一二年間篇籍稍偹唐十九家目録志目録類十九家二十二部四百六卷始於七略别録終于羣書四録書目有劉向歆别録七略荀朂中經簿丘深之義熙集目王儉元徽書目今書七志阮孝緒七録丘賔卿天監書目劉遵梁東宫書目牛弘開皇書目王劭開皇書目殷淳四部書目序録楊松珍史目虞和法書目録元行沖四録文章敘録則有荀朂新撰文章家集敘摯虞宋明帝沈約傅亮文章志失姓名者陳天嘉書目及名手畫録二家不著録者十二家一百十四卷始於毋煚之録韋述吳兢蔣彧之目宗諌十三代史目李肇經史釋題常寶鼎文選著作人目尹植文樞祕要目唐書敘目及孫玉汝唐寶録目河南東齋史目終杜信東齋籍六典史類十三曰略録紀史策條目七略等三十部二百十四卷隋志簿録篇同百舊志書目十八部凡二十七卷唐祕書省四部圖籍百官志祕書省監一人少監二人丞一人監掌經籍圖書之事郎三人掌四部圖籍以甲乙丙丁為次皆有三本曰正曰副曰貯校書郎正字掌讎校典籍六典祕書郎掌四部圖籍分庫藏之經類十史類十有三子類十有四集類三崇文總目唐祕書閣書目四卷唐貞觀內庫書內府四部羣書志初隋嘉則殿書三十七萬卷至武德初有書八萬卷重復相揉王世充平得隋舊書八千餘卷太府卿宋遵貴監運東都浮舟泝河西致京師經砥柱舟覆盡亡其書貞觀中魏徴虞世南顔師古繼為祕書監請求天下書選五品以上子孫工書者為書手繕寫藏于內庫以宮人掌之百官志內官有司籍典籍掌籍各二人掌供御經籍分四部部别為目以時暴涼焉會要武德五年祕書監令狐德棻奏經藉亡逸請求遺書重加錢帛增置楷書繕寫數年間羣書畢備貞觀二年監魏徵以典章紛雜奏引學者校定四部書祕府粲然畢備魏徵傳引諸儒校集祕書國家圖籍粲然全整乾封元年十月十四日上以四部羣書傳寫訛謬兼亦缺少詔趙仁本等集儒學之士刋正繕寫顔師古傳拜少監專刋正事景雲三年六月十七日以經籍多缺令京官有學行者分行天下搜檢圖籍崔行功傳太宗命袐書監魏徵寫四部羣書將藏內府置讐正二十員書工百員徵徙職又詔虞世南顔師古踵領功不就顯慶中罷讎正員聽書工寫于家使散官校正詔東臺侍郎趙仁本舍人張文瓘及司文郎中行功蘭臺侍郎李懷儼充使檢校置詳正學士代散官岐王範傳初隋亡禁內圖書湮放唐興募訪稍稍復出藏袐府長安初張易之奏潢治乃密使摹肖竊其真藏于家唐乾元殿四部書麗正殿四庫書集賢院典籍志玄宗命左散騎常侍昭文館學士馬懷素為修圖書使與右常侍崇文館學士褚無量整比會幸東都紀開元五年正月辛亥如東都乃就乾元殿東序檢校通鑑五年十二月詔訪逸書於乾元殿編校充集賢注記云五年於東京乾元殿寫四部書無量使檢校六年三月五日學士以下始入乾元院無量建議御書以宰相宋璟蘇頲同署如貞觀故事又借民間異本傳録及還京師六年十一月辛卯遷書東宫麗正殿置修書院於著作院其後大明宫光順門外東都明福門外皆創集賢書院學士通籍出入既而太府月給蜀郡麻紙五千畨季給上谷墨三百三十六丸嵗給河間景城清河慱平四郡兔千五百皮為筆材兩都各聚書四部以甲乙丙丁為次列經史子集四庫其夲有正有副軸帶帙籖皆異色以别之六典云有紅緑碧白牙籖為分别百官志注開元五年乾元殿寫四部書六典注同置乾元院使有刋正官四人以一人判事知書官八人分掌四庫書六年會要五年十一月注記六年十二月乾元書院更號麗正修書院置使及檢校官改修書官為麗正殿學士十一年春置麗正修書學士光順門外亦置書院十二年冬東都明福門外置書院十三年改麗正書院為集賢殿書院四月丁巳改集仙殿為集賢會要開元三年禇無量馬懷素侍宴言內庫及祕書省墳籍上曰內庫皆太宗髙宗前代舊書令宫人掌之篇卷錯亂卿為朕排比七年五月敕於祕書省昭文館禮部國子監太常寺及諸司官等借寫及整比四部書成簡工書之士一百一十人令百官入乾元殿東廊觀書無不歎駭集賢注記六年八月十四日云云其冬車駕入京會要附七年非也禇無量傳見後七年九月敕令麗正殿寫四庫書各於本庫每部别為目録有與四庫書名不類者依劉歆七略排為七志集賢注記八年春行沖知麗正院取祕書學士入麗正校勘通前二十人十年春移書院明福門外中書省之北十九年冬十月丙申車駕發京時集賢院四庫書揔八萬九千卷注記同經庫一萬三千七百五十二卷注記五十三史庫二萬八千八百二十卷子庫二萬一千五百四十八卷集庫一萬七千九百六十卷注記六十九其中雜有梁陳齊周隋代古書貞觀永徽乾封總章咸亨舊夲注記隋舊書用廣陵麻紙寫作蕭子雲書體赤軸綺帶最麗好新寫書分部别類裝飾華麗經白軸黃帶紅籖史碧軸縹帶緑籖子紫軸紫帶碧籖集緑軸朱帶白籖圖書紫軸緑帶二十四年十月車駕從東都還西京集賢書籍三分留一貯在東都儒學傳序玄宗置集賢院部分典籍乾元殿博彚羣書至六萬卷經籍大備稱開元焉六典集賢書院知書官八人注開元五年置唐圖籍在祕書今祕書弘文史館司經崇文皆有之集賢所寫皆御本書四部分四庫每庫二人知寫書出納名目次序以備檢討四庫書兩京各一本共二萬五千九百六十卷寫以益州麻紙元行沖傳馬懷素撰書志褚無量校麗正四部書業未卒詔行沖代之唐續七志羣書四録古今書録集賢書目四庫更造書目貞觀御書傳馬懷素玄宗詔與褚無量同為侍讀有詔校祕書是時文籍盈漫皆炱朽蟫斷籖幐紛舛懷素建白願下紫微黃門召宿學大儒就校謬缺通鑑五年十二月又言自齊以前舊籍王儉七志已詳請採近書篇目及前志遺者續儉志以藏祕府詔可即拜懷素祕書監召尹知章韋述等二十一人注記前後總二十六人通鑑二十人分部撰次殷承業徐楚璧是正文字懷素奏祕書少監盧俌崔沔為修圖書副使祕書郎田可封康子元為判官然懷素不善著述未能緒别會卒詔祕書官並號修書學士草定四部六年十二月人人意自出無所統一踰年不成又詔右常侍褚無量大理卿元行沖考絀不應選者注記七年七月行沖代懷素於祕書省綜理無量等奏修撰有條宜得大儒綜治詔委行沖通鑑開元八年正月辛酉命右常侍元行沖整比羣書乃令母煚韋述余欽總緝部分殷踐猷王愜會要作王恢治經述欽治史母煚劉彥直治子王灣劉仲丘治集藝文志云王仲丘會要云劉仲八年四録成上之通鑑九年十一月丙辰上奏集賢注記八年春撰二百卷上之學士無賞擢者行沖知麗正院又奏陸紹伯等二十人入校麗正書由是祕書省罷撰緝而學士皆在麗正矣褚無量初內府舊書自髙宗時藏宫中甲乙叢倒無量請繕録補第以廣祕籍天子詔於東都乾元殿東廂部彚整比無量為之使表盧僎陸去泰王擇從徐楚璧分部讎定衛尉設次光祿給食又詔祕書省司經局昭文崇文二館更相檢讎采天下遺書以益闕文不數年四庫全治帝詔羣臣觀書賜無量等帛有差無量又言貞觀御書皆宰相書尾臣位卑不足以辱請與宰相聨名跋尾不從帝西還徙書麗正殿以修書學士為麗正殿直學士預朝會復詔無量就麗正纂續前功未畢而卒韋述開元初五年冬馬懷素奏述與諸儒即祕書續七志五年而成志羣書四録二百卷殷踐猷王愜韋述余欽毋煚劉彥直王灣王仲丘撰元行沖上母煚古今書録四十卷韋述集賢書目一卷崇文目有之會要開元九年十一月十三日丙辰左常侍元行沖上羣書四録二百卷舊紀云目録藏內府凡二千六百五十五部四萬八千一百六十九卷分為經史子集四部序例韋述撰母煚又略為四十卷為古今書録奏上賜銀絹二百舊史志載書録