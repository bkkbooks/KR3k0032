東廡為昭文書庫南廡為集賢書庫西廡有四庫分四部為史館書庫辛巳幸觀書凡六庫書籍正副夲八萬卷雍熙中建祕閣於此分內庫書籍藏之或云祕閣藏圖書國學藏經典三館藏史傳興國九年正月壬戌詔中外上三館闕書及三百卷當甄録自是四方書籍往往間出上謂侍臣曰教化之本治亂之原無書籍何以取法今三館貯書數雖不少若觀開元書目即遺逸尚多宜廣行求訪乃詔以開元四部書目比校闕者搜訪具録所少書示中外政和八年四月二十九日滕康奏祕閣四部書祕書郎掌之四庫書校書郎正字掌之宣和四年四月丙午十八日詔建局以補緝校正文籍為名繕寫置宣和殿太清樓祕閣又詔搜訪闕書太宗清心殿圖籍寶元編資善堂書籍太宗於後苑建清心殿藏圖籍以資逰觀嘗於此讀御覽致飛鵲之異或云淳化元年正月作而御覽成於興國八年當考熙寧三年冬命李清臣劉摯等校觀文殿御覽書籍寶元二年三月癸丑命賈昌朝王宗道編排資善堂書籍四月癸未罷之淳化祕閣羣書見閣類兩朝藝文志祖宗藏書之所曰三館祕閣在左升龍門北是為崇文院自建隆至祥符著録揔三萬六千二百八十卷八年館閣火移寓右掖門外謂之崇文外院借太清樓本補寫既多損蠧更命繕還天聖三年成萬七千六百卷歸于太清九年冬新作崇文院館閣復而外院廢時增募寫書史專事全緝景祐初命翰林學士張觀知制誥李淑宋祁編四庫書判館閣官覆視録校二年上經史八千四百二十五卷明年上子集萬二千三百六十六卷差賜官吏器幣詔求逸書復以書有謬濫不全始命定其存廢因倣開元四部録為崇文總目慶厯初成書凡二萬六百六十九卷然或相重亦有可取而誤棄不録者嘉祐四年右正言祕閣校理吳及言內臣監館閣久不更書多亡失補寫不精請選館職分吏編寫求訪所遺令陳襄蔡抗蘇頌陳繹編定四館書不兼他局二年一代遂用黃紙寫印正本以防蠧敗又選京朝州縣官四人編校二年遷館職闕即隨補嵗餘詔曰國初承五代之後簡編散落三館聚書僅才萬卷其後平定列國先收圖籍亦嘗分遣使人屢下詔令訪募異本校定篇目聽政之暇無廢覽觀然比開元遺逸尚衆宜加賞以廣獻書中外士庶並許上館閣闕書卷支絹一匹五百卷與文資官明年冬奏黃本書六千四百九十六卷補白本二千九百五十四卷賜宴如景祐自是編寫不絶收獻書二百一十七部千三百六十八卷合崇文總目除前志所載刪去重復訛謬定著一千四百七十四部八千四百九十四卷篇列次于此謝泌傳端拱初直史館言圖書多失次序唐景龍中嘗分經史子集為四庫命薛稷沈佺期武平一馬懷素分掌遂令分典四部以泌知集庫咸平館閣圖籍目録圖一作書咸平元年十一月以三館祕閣書籍歲久不治詔朱昻杜鎬與劉承圭整比著為目録二年閏三月甲午詔三館寫四部書來上當置禁中以便觀覽三年二月丙午昻以司封郎中加吏部鎬以校理為直祕閣賜金紫昻等受詔編館閣圖籍目録至是奏御故奬之中興書目有皇朝祕閣書目一卷十九門六千七百九卷不知作者搜景德四年五月己亥廣祕閣先是上謂輔臣曰國家訪圖書其數漸廣臣庶家有聚書者皆令借目録參校內府館閣所有缺者借本補寫所得甚多祥符中獻書者十九人賜出身得萬七百五十四卷五年七月庚戌幸三館祕閣閲四部書景德三年四月丙子幸崇文院觀四庫圖籍祥符八年十二月甲辰命樞使王欽若提點寫校閣館書籍翰林學士陳彭年副焉景德太清樓四部書目嘉祐補寫太清樓書景德四年三月乙巳召輔臣對于苑中登太清樓觀太宗聖製御書及新寫四部羣書上親執目録令黃門舉其書示之總太宗聖製詩及故事墨迹三百七十五卷文章九十二卷經庫二千九百一十五卷史庫七千三百四十五卷子庫八千五百七十一卷集庫五千三百六十一卷四部書共二萬五千一百九十二卷長編云樓藏太宗御製及墨迹九百三十四卷軸四部羣書二萬二千七百二十五卷又出御製太清樓新寫御覽書籍記又東至玉宸殿云云初興國四年建太清樓于迎陽門後苑真宗藏太宗御製墨迹石本咸平二年閏三月甲午詔三館寫四部書一置龍圖閣一藏後苑太清樓四年十月直集賢院李建中言太清樓書宜選官重校上因閲書目見缺書尚多甲子詔求逸書五年十二月甲申以尚有舛誤而未讎對者猶二萬卷令流內銓擇官詳校試十五人詩論于銀臺得劉均聶震等七人於崇文院校勘大官供膳景德元年三月丁酉直祕閣黃夷簡等上校勘新寫御書凡二萬四千一百六十二卷作九十二則與前目同但前目云五千校勘六人授祕閣校理賜緍帛祥符五年八月庚申奉安太宗御集于樓七年三月癸巳天禧二年十一月辛未召羣臣觀書于樓天禧元年八月壬申校勘所言學究侯惟哲劉漙獻太清樓無本書各五百卷請甄録從之初祥符中補寫三館書借太清本多損蠧遂留為三館正本副寫還之天聖三年四月丁丑寫成萬七千六百卷歸于太清樓六月丙辰陳從易等以校太清樓所藏十代興亡論妄加塗竄降職寶元嘉祐屢觀書于此嘉祐七年六月丁亥祕閣上補寫御覽書籍先是歐陽修言太清樓書因宣取入內頗不全詔內臣檢所缺書録上中書省繕寫至是上之元祐七年五月十九日祕省言髙麗獻書多異本館閣所無詔校正二本别寫藏太清樓天章閣景德玉宸殿藏書詳見觀御書景德四年三月乙巳召輔臣至玉宸殿蓋退朝燕息之所帷帳無文采歷翔鸞儀鳳二閣作五言詩從臣皆賦殿在太清樓之東聚書八千餘卷上曰此唯正經正史屢經校讐他小説不與其後羣書又增及一萬一千二百九十三卷太宗御集御書又七百五十二卷祥符龍圖閣四部書書目景德六閣圖書建隆初三館書僅萬二千餘卷及平諸國收圖籍蜀江南最多開寶中參以舊書為八萬卷凡得蜀書一萬三千卷江南書二萬餘卷至祥符凡三萬六千三百八十卷崇文院龍圖閣皆有四部真宗謂輔臣曰臣庶家有聚書者朕皆借其目録參校借本抄填之志咸平二年閏三月甲午詔三館寫四部書籍二本一置龍圖閣一置太清樓御製御書皆在上親贊序刻石紀其數四年十一月丁亥觀書祥符二年九月丁丑召寧王元渥等於龍圖閣觀書目祥符三年正月二十八日戊寅召近臣觀龍圖閣太宗御書及四部書籍又至閣西觀畫命馬知節評之東京記云祥符初建龍閣據此則咸平初已建矣實録景德二年四月戊戌幸龍閣閲太宗御書觀諸閣書畫閣藏太宗御製御書并文集揔五千一百十五卷軸册下列六閣經典揔三千三百四十一卷目録三十卷正經經解訓詁小學儀注樂書史傳揔七千二百五十八卷目録四百四十二卷正史編年雜史史抄故事職官傳記嵗時刑法譜牒地理偽史子書揔八千四百八十九卷儒家道書釋書子書類書小説算術醫書文集揔七千一百八卷别集揔集天文揔二千五百六十一卷兵書厯書天文占書六壬遁甲太一氣神相書卜筮地理二宅三命選日雜録圖畫揔七百一軸卷册古畫上中品新畫上品六又古賢墨迹揔二百六十卷上曰退朝之暇聚圖書以自娛揔二萬九千七百十四卷又曰龍閣書屢經讎校最為精詳已傳寫一本置太清樓朕求書備至故竒書祕籍無隱焉祥符六年正月庚戌賜王旦已下龍圖閣書籍圖畫目六閣圖書贊祥符寶文統録九年二月己酉王欽若上詳定道藏經凡三洞四輔四千三百五十九卷初唐明皇撰瓊綱裁三千餘卷唐明皇命方士為瓊綱四卷綱志道士張仙庭三洞瓊三卷皇朝得七千餘卷命徐鉉等校勘得三千七百三十七卷分置上清太一宫祥符三年選官詳校欽若揔之刪一百二十卷又求得七百二十七卷揔為目録詔賜名聖製序唐志神仙三十五家五十部三百四十一卷不著録六十二家二百六十五卷道藏音義目録一百一十三卷崔湜薛稷沈佺期道士史崇玄等撰隋志道經三百七十七部一千二百一十六卷有經戒餌服房中符録宋鄧自和撰道藏書目一卷景祐編三館祕閣書籍崇政殿觀書景德元年閏六月辛酉命翰林學士張觀知制誥李淑宋祁編排三館祕閣書籍判館閣盛度章得象石中立李仲容覆視之二年十月己未館閣上所校兩庫經史八千四百二十五卷賜器幣三年五月庚辰求逸書十月甲寅命知制誥王舉正看詳乙丑御崇政殿觀二館祕閣新校兩庫子集書凡萬二千餘卷賜校勘官器幣又賜宴崇文院慶厯崇文總目慶厯元年十二月己丑翰林學士王堯臣等上新修崇文總目六十卷堯臣與聶冠卿郭稹吕公綽王沫歐陽修等撰以四館書并合著録中興書目云六十六卷當考長國史志崇文總目六十六卷序録一卷多所繆誤編云總目亦有可取而誤棄不録者其書總數凡三萬六千六十九卷自太祖平定四方天下之書悉歸藏室太宗真宗訪求遺逸小則償以金帛大則授之以官又經書未有板者悉令刋刻由是大備起祕閣貯之禁中景祐元年閏六月以三館祕閣所藏有繆濫不全之書辛酉命翰林學士張觀知制誥李淑宋祁將館閣正副本書看詳定其存廢偽謬重復並從刪去內有差漏者令補寫校對倣開元四部録約國史藝文志著為目録仍令翰林學士盛度等看詳至是上之庚寅以提舉張觀宋庠王堯臣及冠卿稹並加階封編修吕公綽等進職崇文目有目録十九部一百七十九卷始於符瑞圖目一卷終於學士院雜撰目一卷嘉祐編定書籍昭文館書嘉祐四年二月丁丑置館閣編定書籍官以祕閣校理蔡抗陳襄集賢校理蘇頌館閣校勘陳繹分史館昭文館集賢院祕閣而編定之初右正言吳及言祖宗更五代之弊設文館以待四方之士而公相率由此進故號令風采不減漢唐近年用內臣監館閣書庫借出書籍亡失已多又簡編脫落書史補寫不精非國家崇鄉儒學之意請選館職三兩人分館閣吏人編寫書籍其私借出與借之者並法坐之仍請求訪所遺之書因命抗等令不兼他局二年一代之六月己巳又益編校官每館二員給本官食公使十千及二年者選人京官除館閣校勘朝官除校理實録各一員王陶趙彥若傅卞孫洙六年十二月辛丑三館祕閣上寫黃本書六千四百九十六卷補白本書二千一云一千九百五十四卷二十二日壬寅遣中使詔中書樞密院宰臣韓琦以下合三館祕閣官屬四十一人賜宴以嘉其勤宴崇文院刻石記于院之西壁先是崇文白本書嵗久多蠧又多散失置官校正補寫别本亦以黃紙以絶蠧敗至是上之其編校官昭文館職方員外孟詢一作恂大理評事趙彥若史館集賢校理竇卞大平司法參軍曽鞏集賢院國子監直講錢藻祕閣館閣校勘孫洙國子監直講孫思恭校小學太常慱士張次立七年三月辛酉詔參知政事歐陽修提舉三館祕閣寫校書籍仍詔兩制看詳天下所獻遺書六月丁亥祕閣上補寫御覽書籍先是判閣歐陽修言祕閣初為太宗藏書之府並以黃綾裝潢謂之太清本後多宣取入內請降舊本補寫之遂詔龍圖天章寶文閣太清樓管掌內臣檢所缺書録上於門下省謄寫至是上之賜判閣范鎮及管掌補寫銀絹有差十二月詔以所寫黃本一萬六百五十九卷黃本印書四千七百三十四卷總一萬五千三百九十三悉送昭文館七史板本四百六十四卷送國子監以校勘功畢明年遂罷局先是五年八月壬申詔國家承五代後三館聚書才萬卷後平列國先收圖籍屢下詔令訪募異本至景祐中校定篇目然比開元舊録遺逸尚衆中外士庶許上館閣闕書每卷賜帛一匹五百卷官之六年六月開獻書之路詔諸道搜訪求中興書目有嘉祐搜訪闕書目一卷首載六年六月遺書詔書或云四館之職歷差陳洙至王安國十六人熙寧中罷局七年置補寫所國朝三館書直館官校對及收諸國圖籍實館閣或召京朝官校之皆題名卷末寶元二年正月丙午學士院言奉詔詳定隂陽禁書請除孫吳子歷代史天文律厯五行志并通典所引諸家兵外餘悉為禁書從之學士院司天監定係禁書籍十四門為目録一卷中興書目熙寧七年國子監書總一百二十五部今存書目一卷國史志乾德六年史館新定書目四卷李淑圖書十志中興書目淑皇祐中撰邯鄲書目十卷子德芻再集其目三十卷淑藏書二萬八百十一卷著為目録凡五十七類至是比舊少一千一卷序曰儒籍肇劉略荀簿王志阮録訖元毋乃備藏家者唯吳齋著目宋戢戈講道延閣廣內官書三萬六千二百八卷計開元見目十不五六崇文目剟去五千朝氏志淑載其家所藏圖書五十七類經史子集通計一千八百三十六部二萬三千一百八十六卷其外又有藝術志道書志畫志通為八目元祐祕閣書目政和祕書總目中興書目祕書省書目二卷凡一萬四千九百餘卷史館新定書目四卷分四部總一萬四千四百九卷不知作者會要熙寧七年置補寫所元祐二年六月八日祕書省言祕寫祕閣黃本以崇文總目比校别造書目八月罷補寫書籍局四年五月祕省言江南西川荆浙等書先朝收取入館今散失將盡欲貯於下庫內有唐朝舊書别藏館閣紹聖元年閏四月罷校對黃本崇寧二年五月祕閣書寫成二千八十二部未寫者一千二百一十三部及闕卷二百八十九立程限繕録大觀四年五月十日祕監何志同奏慶厯總目號為全備者不過二萬餘卷闕逸浸多請頒其數求訪政和七年十一月十四日戊戌校書郎孫覿奏四庫書尚循崇文舊目頃訪求遺書總目之外凡數百家幾萬餘卷請撰次增入總目合為一卷詔覿及著作郎倪濤校書汪藻劉彥適撰次名曰祕書總目紹興求書闕記羣玉會記又見求書類十七年鄭樵按祕省所頒闕書目録集為求書闕記七卷外記十卷又總天下古今書籍分類為羣玉會記三十六卷徐士龍編求書補闕一卷紹興御府書籍見校定經史類朝公武讀書志朝公武讀書志四卷初南陽井氏度傳録蜀中書甚富舉以與公武公武分為四部經類十史類十三子類十六集類三每讀一書撮其大旨論之紹興二十一年自序讀書志有田鎬書目六卷羣書備檢十卷鄭樵校讐略曰欲明書者在明類例總古今有無之書為之區别凡十二類百家四百二十二種淳熙中興館閣書目嘉定續書目紹興初再改定崇文總目祕省續編四庫闕書淳熙四年十月少監陳騤等言乞編撰書目五年六月九日上中興館閣書目七十卷序列一卷序列凡五十五條凡五十二門計見在書四萬四千四百八十六卷較崇文所載多一萬三千八百十七卷復參三朝史志多八千二百九十卷兩朝史志多三萬五千九百九十二卷閏六月十日令浙漕司摹板淳熙四年陳騤編館閣録載祕閣諸庫書目御札六百七軸三十五册五道太上聖政六十一册日厯一千二册並藏閣上經史子集四類一萬三千五百六卷三千九百五十八册分兩庫御前書經史子集四類二千五百二卷六百十四册四庫書經史子集二萬三千五百八十三卷六千五百十二册續搜訪庫經史子集二萬三千一百四十五卷七千四百五十六册諸州印版書六千九十八卷一千七百二十一册五年九月十四日詔祕省印館閣書目以二十部進入餘賜幸省赴坐官各一部先是三月騤等言慶厯元年崇文總目成參政王舉正上今書目成書宜於參政過局日觀閲投進從之六年六月二十七日吏部侍郎閻蒼舒請祕省録見有書目送四川制置司參對官書目録繕寫上之十三年九月二十五日祕書郎莫叔光請詔諸路監司守臣各上書目以館閣書目參對有未收之書移文取索從之嘉定三年編次御製御扎目録中興館閣續書目祕書丞張攀等乞編新目以續前書得書七百五十二家八百四十五部凡一萬四千九百四十三卷嘉定十三年四月上朝説之曰劉歆告揚雄云三代之書藴藏于家直不計耳顧弗多耶今有一周易而無連山歸藏有一春秋而無千二百國寶書及不修春秋有卿禮二士禮七大夫禮二諸侯禮四諸公禮一而天子之禮無一傳者以隋唐經籍志吳氏西齋録求於今其存有幾藏書上矣周有藏史典簡䇿魯有御書在象魏曲臺之禮九師之易樂分龍趙詩析齊韓陳農所未究河間所未輯有一於此罔不兼綜韓起觀典於魯國知周道之所以興蕭何收籍於關中見秦業之所以替人拾青紫家懷鉛素求古文於孔壁收竹書於汲冢搢紳先生聚蠧簡於內輶軒使者採遺篆於外刋正分其朱紫繕寫埓於丘山外史所未録既盈太常之藏中經所未載盛積祕室之府比夫軒皇宛委穆滿羽陵炎漢廣內有晉祕閣何異牛宫之水蟻垤之林張華海內之祕班斿禁中之副擲發異聞皆黃香之不見沉研精義多郭璞之未詳紫臺祕典緑帙竒文羽陵蠧迹嵩山落簡虞初稗官之説凡將急就之文如遊羣玉之府琮璜圭璧瓊瑶寶璐光眀焜晃莫敢注視如行衡霍嵩岱之境山輝川媚雲蒸霞蔚龍拏鳳跂蒼翠詭異使人應接不暇漢家天祿萃九流七略之篇唐室集賢廣四庫萬籖之目考遺編於魯壁緝蠧簡於羽陵蓬山藝觀之書羣玉垂金之記魯宫藏篆汲冢遺編羽陵青簡媯泉緑字蟲篆鳥迹汗簡編蒲探逸典於酉陽訪遺編於汲郡漢臣三篋梁相五車羽陵蠧書酉陽逸典外史所掌廣內所司莊周十七之寓言虞初九百之小説丹函翠藴綈帙縹囊人文掞天薰郁歆豔灝灝噩噩排商轢周與奎壁日月激衝光明玉海卷五十二
