body:
  text: 玉海卷一百七十一宋王應麟撰宫室苑囿園隋天文志天苑十六星在昴畢南天子之苑囿詩正義有蕃曰園有牆曰囿漢書注養鳥獸曰苑苑有垣曰囿種植謂之園黃帝東囿黃帝囿説苑辨物黃帝即位宇內和平鳳集東囿食竹實棲桐樹文選七命鳴鳳在林夥於黃帝之園注禮瑞命記曰黃帝齋于宫鳳止帝園莊子仲尼曰狶韋氏之囿黃帝之圃有虞氏之宫湯武之室拾遺記黃帝為養龍之囿湯囿淮南子泰族訓湯初作囿以奉宗廟簡士卒習射御戒不虞周靈囿詩王在靈囿麀鹿攸伏麀鹿濯濯白鳥翯翯注囿所以域養禽獸也天子百里諸侯四十里靈囿言靈道行於囿也箋云文王親至靈囿言愛物也疏鄭駁異義云於臺下為囿沼孟子與民偕樂故能樂也文王之囿方七十里於傳有之與民同之民以為小黃圖周靈囿文王囿也引毛詩注靈者言文王有靈德也在長安縣西四十里一本云四十二里班固東都賦因原野以作苑制同乎梁鄒義合乎靈囿注魯詩傳曰古有梁鄒者天子之田也賈誼新書騶者文王之囿虞者囿之司獸唐徐元弼有靈囿賦春秋成十八年築鹿囿昭九年築郎囿公羊傳注天子囿方百里公侯十里伯七里子男五里皆取一也周囿人地官囿人中士四人下士八人掌囿遊之獸禁牧百獸注囿今之苑囿遊囿之離宫小苑觀處也疏古謂之囿漢家謂之苑天官閽人囿遊亦如之注囿御苑也遊離宫也揚雄曰禹任益虞而上下和草木茂成湯好田而天下用足文王囿百里民以為尚小齊宣王囿四十里民以為大裕民之與奪民也魯矍相圃後漢郡國志魯國有闕里孔子所居注禮記矍相之圃亦在城中西南近孔子廟秦五苑韓非子秦大飢應侯請曰五苑之草著蔬築橡果棗栗足以活民請發之昭襄王曰云云左傳鄭有原圃猶秦之有具囿注滎陽中牟縣西有圃田澤漢靈囿馬融廣成頌大漢之初基也宅兹天邑揆厥靈囿營于南郊揚雄校獵賦帝將田于靈之囿注靈德之苑囿也張衡西京賦在彼靈囿之中東京賦悉率百禽鳩諸靈囿漢思賢苑黃圖西京雜記同文帝為太子立思賢苑以招賓客苑中有堂皇六所客館皆廣廡髙軒屏風褘褥甚麗此苑他書不載不知屬何地廣陵王嘗於别囿學格熊漢梁王兔園史記梁孝王築東苑方三百里是曰兔園枚乘有梁王菟園賦修竹檀欒夾池水旋菟園並馳道文選雪賦梁王不悅遊於兔園注西京雜記曰梁孝王好宫室苑囿之樂築兔園史年表秦二世元年十一月為兔園漢上林苑上林八川長安志上林苑本秦舊苑也漢書曰武帝建元三年置又曰武帝廣開上林周袤數百里見揚雄傳武帝微行始出建元三年北至池陽西至黃山南獵長楊東遊宜春詔隴西北地良家子能騎射者從遂有期門之號以為道逺勞苦又為百姓所患乃使太中大夫吾丘壽王與待詔能用算者二人舉籍阿城以南本秦阿房宫也盩厔以東宜春以西提封頃畝及其賈直欲除以為上林苑屬之南山東方朔諫曰酆鎬之間號為土膏其賈畝一金今規以為苑絶陂池水澤之利而取民膏腴之地因奏泰階六符之事上拜朔為太中大夫然遂起上林苑如壽王所奏云見東方朔傳宣帝神爵四年十二月鳳凰集上林乃作鳳皇殿以答嘉瑞見郊祀志及宣紀有昆明觀繭觀平樂觀柘觀有令有尉黃圖上林苑建元三年開周袤三百里三輔故事曰上林延亘四百餘里漢舊儀曰上林苑方三百里漢宫殿疏曰方三百四十里苑中有儲元宫馮昭儀居又有繭觀逺望觀象便門白鹿三爵鼎郊樛木走馬上蘭等觀漢舊儀上林苑中廣長三百里置令丞右左尉苑中養百獸天子春秋獵射苑中取禽無數其中離宫七十所容千乘萬騎武帝時上林苑官奴婢及天下民貧資不滿五十萬徙置苑中卜式牧羊上林中八萬五千餘帝得七十億萬以給軍擊西域西京雜記初修上林苑羣臣逺方各獻名果異卉三十餘種植其中亦有制為美名以標竒麗也關中記上林苑門十二中有苑三十六宫十二觀二十五上林賦天子之上林左蒼梧而右西極丹水更其南紫淵徑其北始終灞滻出入涇渭酆鄗潦潏紆餘委蛇經營其內蕩蕩乎八川分流相背異態崇山矗矗巃嵸崔嵬深林巨木嶄巖參差九嵕截嶭南山峩峩離宫别館彌山跨谷髙廊四注重坐曲閣華榱璧璫輦道纚屬步櫩周流長途中宿夷嵕築堂纍臺增成背秋涉冬天子校獵乘鏤象六玉虬拖霓旌靡雲旗前皮軒後道遊孫叔奉轡衛公參乘扈從橫行出乎四校之中鼓嚴簿縱獵者江河為阹泰山為櫓車騎靁起殷天動地亡是公言上林廣大山谷水泉萬物西都賦西郊則有上囿禁苑林麓藪澤陂池連乎蜀漢繚以周牆四百餘里離宫别館三十六所神池靈沼往往而在其中乃有九真之麟大宛之馬黃支之犀條枝之鳥踰崑崙越巨海殊方異類至于三萬里盛娛遊之壯觀奮大武於上囿因兹以威戎夸狄耀威靈而講武事西京賦上林禁苑跨谷彌阜東至鼎湖邪界細柳掩長楊而聨五柞繞黃山而欵牛首繚垣綿聨四百餘里植物斯生動物斯止衆鳥翩翻羣獸駓騃伯益不能名隸首不能紀校獵賦武帝廣開上林東南至宜春鼎湖晉灼曰鼎湖宫名也御宿昆吾旁南山而西至長楊五柞北繞黃山瀕渭而東周袤數百里遊觀侈靡窮極麗妙頗割三垂以贍齊民開禁苑散公儲胸奴傳贊胸奴背約束是以文帝中年赫然發憤遂躬戎服親御鞍馬從六郡良家子材力之士馳射上林講習戰陳聚天下精兵軍於廣武衛琯傳景帝幸上林詔中郎將參乘郅都傳為中郎將常從入上林平紀建始元年春正月罷上林詔獄秋罷上林宫館希御幸者二十五所百官表水衡都尉掌上林苑元鼎二年置屬官有上林令丞尉又有甘泉上林長丞又步兵校尉掌上林苑門屯兵少府屬官有上林中十池監文帝問上林尉禽獸簿拜嗇夫為上林令上龔遂傳水衡典上林禁苑共張宫館揚雄林苑令針日田或三驅不可過差谷永為護苑使者後百官志上林苑令一人六百石主苑中禽獸在長安縣西南一十里周二十四里元和志云在縣西北十四里周匝二百四十里後循吏傳光武損上林池籞之官馮異傳建武三年異屯軍上林苑中懷來百姓三嵗上林成都馬援傳以三輔地曠土沃求屯田上林苑中許之明紀永平十五年冬車騎校獵上林苑注周禮校人掌王田獵之馬故曰校獵以木相貫穿為欄校以遮禽獸章紀建初元年七月辛亥詔曰上林池籞田賦與貧民注籞禁苑也楊賜傳先帝之制左開鴻池右作上林注鴻池在洛陽東上林在西李尤有上林苑銘見文選注東京賦大閲西園注上林苑説文鎬武王所都在長安西上林苑中漢甘泉苑又見宫類黃圖甘泉苑武帝置緣山谷行至雲陽三百八十一里入扶風凡周四百五十里苑中起宫殿臺閣百餘所苑中有仙人石關封巒鳷鵲觀洞冥記昭祥苑在甘泉宫西周十里萬國獻異物皆集此中漢書注晉灼曰黃圖波浪二水名也在甘泉苑中漢長門園東方朔傳竇太主獻長門園更名長門宫注如淳曰園在長門長門在長安城東南可為宿館故獻之漢淇園溝洫志元封二年上使汲仁郭昌發卒數萬人塞瓠子決河下淇園之竹以為犍注晉灼曰淇園衛之苑也瓠子歌隤林竹兮犍石災章紀建初七年幸偃師至河內遂幸淇園冦恂傳光武拜為河內太守恂講兵肄射伐淇園之竹為矢百餘萬漢博望苑戾太子傳太子冠為立博望苑使通賓客從其所好成紀建始二年秋罷太子博望苑以賜宗室朝請者黃圖長安城南杜門外五里有遺址元和志博望苑在長安縣北五里或曰苑在長安城外漕渠之地水經注昆明故渠之北漢樂遊苑宣紀神爵三年春起樂遊苑注師古曰三輔黃圖在杜陵西北又關中記云宣帝立廟於曲池之北號樂遊在秦為宜春苑周黃圖曲池漢武所造回五里案其處則今之所呼樂遊廟者是也其餘基尚可識焉蓋本為苑後因立廟西京雜記樂遊苑內生玫瑰木木下多苜蓿名懷光時人或謂之光風風在其間常肅肅然日照其花有光采故曰苜蓿為懷風茂陵人謂之連枝草兩京新記宣帝樂遊廟亦名樂遊苑亦名樂遊原基地最高四望寬敞文選顔延之宴曲水詩注水經注曰舊樂遊苑宋元嘉十一年以其地為曲水范曄樂遊應詔詩注丹陽圖經曰樂遊苑官城北三里晉時藥園梁亦有樂遊苑天監元年八月癸卯鸞鳥見樂遊苑大同四年九月閲武于樂遊苑丘遲侍宴樂遊苑唐玄宗樂遊園宴詩云地入南山近城分北斗餘漢宜春下苑水衡禁囿嚴籞元紀初元二年三月詔罷水衡禁囿表水衡有禁囿令丞兩尉宜春下苑必别有上苑少府佽飛外池嚴籞池田假與貧民揚雄曰頗割其三垂以贍貧民即指此也注師古曰宜春下苑即今京城東南隅曲江地是晉灼曰嚴籞射苑也宣紀池籞注蘇林曰折竹以繩綿連禁禦使人不得往來律名為籞應劭曰禁苑也臣瓚曰籞以養鳥許慎曰嚴弋射者所蔽也貢禹傳元帝即位奏言獨舍長安城南苑池以為田獵之囿自城西南至山西至鄠皆復其田以與貧民天子納其言乃下詔令省宜春下苑以與貧民黃圖宜春下苑在京城南隅宜春之名漢史凡三出實為兩地曰宜春苑者地屬下杜宜春宫即苑中宫也皆秦創曰宜春觀者則在鄠縣漢武所造東方朔傳武帝東遊宜春上林賦曰息宜春師古曰宫名在杜縣東即唐曲江也賈山傳至言曰陛下文帝即位去諸苑以賦農夫鹽鐵論大夫曰田收之利池籞之假以贍諸用文學曰縣官多張苑囿公田池澤非先帝所開苑囿池籞可賦歸之於民漢御羞苑百官表水衡都尉屬官有上林御羞兩丞九官令丞又有禁圃令丞兩尉注如淳曰御羞宜春皆苑名也師古曰御宿今長安城南御宿川也羞宿聲相近如淳曰御羞地名在藍田其地肥沃出御物揚雄謂之御宿揚雄傳注師古曰御宿在樊川西元后傳夏遊御宿鄠杜之間注師古曰御羞苑在長安城南今之御宿川是也三輔黃圖御宿苑在長安城南御宿川中漢武為離宫别館禁禦不得人往來遊觀止宿其中故曰御宿漢池苑詩正義澤蘭廣而長節節中赤髙四五尺漢諸池苑及許昌宫中皆種之陸璣疏云禮迹人注田之地若今苑也髙紀二年十一月故秦苑囿園池令民得田之注見前霍光傳雲多從賓客張圍獵黃山苑中曹參傳相舍後園近吏舍漢芳林苑文選東京賦濯龍芳林九谷八溪薛綜注洛陽圖經曰濯龍池名芳林苑名漢濯龍園又見宫類西園南園馬后紀顯宗每幸濯龍並召諸才人請呼皇后帝笑曰自家不好樂雖來無歡以遊娛之事希從焉后蠶于濯龍中桓帝好神仙延熹九年親祠老子于濯龍百官志濯龍監一人本注曰濯龍亦園名近北宫南園丞一人本注曰南園在雒水南東京賦濯龍芳林九谷八溪薛綜曰洛陽圖經曰濯龍池名故歌曰濯龍望如海河漢渡似雷嵗惟仲冬大閲西園西園上林苑續漢書濯龍園在洛陽西北角漢廣成苑上林廣成囿後紀和帝永元五年二月戊戌詔自京師離宫果園上林廣成圃悉假貧民恣得采捕不收稅安帝永初元年二月丙午以廣成遊獵地及郡國公田假與貧民三年四月己巳詔上林廣成苑可墾闢者賦與貧民順帝永和四年十一月丙寅幸廣成苑桓帝延熹元年十月校獵廣成遂幸上林苑六年十月丙辰校獵廣成遂幸函谷關上林苑靈帝光和五年十月校獵上林苑歷函谷關遂狩於廣成苑十二月還幸太學續志河南新城有廣成聚有廣成苑列傳鍾離意顯宗時為尚書僕射車駕數幸廣成苑意當車諫以為從禽廢政天子即時還宫張禹延平元年上言廣成上林空地宜假貧民從之馬融鄧太后臨朝寢搜狩之禮元初二年上廣成頌以諷諫注廣成苑在今汝州梁縣西元年以來戒懼災異躬自菲薄荒棄禁苑方涉冬節農事間隙宜幸廣成覽原隰觀宿麥勸收藏因講武校獵詩詠圃草樂奏騶虞大漢之初基也宅兹天邑總風雨之會交隂陽之和揆厥靈囿營于南郊周阹環瀆右矕三塗左概嵩嶽面據衡隂背箕王屋浸以波溠夤以滎洛至于陽月林衡戒田校隊案部前後有屯甲乙相伍戊巳為堅虞人植旍獵者效具車弊田罷旋入禁囿棲遲乎昭明之觀休息乎髙光之榭以臨乎宏池收功道德之林致獲仁義之淵忽搜狩之禮闕槃虞之佃于今十二年方將采清原嘉岐陽北轅反斾至自新城背伊闕反洛京陳蕃延熹六年車駕幸廣成校獵上疏諫曰人君有事苑囿唯仲秋西郊順時講武殺禽助祭水經注汝水東與廣成澤水合漢西苑顯陽苑鴻德苑順紀陽嘉元年起西苑修飾宫殿桓紀延熹二年七月初造顯陽苑置丞郎顗傳繕理西苑東觀記延熹元年三月己酉置鴻德苑令秩六百石晉宫閣名洛陽有洪德苑靈崑苑平樂苑漢罼圭靈昆琨苑靈紀光和三年作罼圭靈昆苑注罼圭苑有二東罼圭苑周一千五百步中有魚梁臺西罼圭苑周三千三百步並在洛陽宣平門外楊賜傳為司徒帝欲造罼圭靈琨苑上疏諫曰今城外之苑已有五六宜推夏禹卑宫太宗露臺之意昭紀元鳳三年春正月罷中牟苑賦貧民在滎陽漢直里園後百官志直里監一人四百石注直里園名在雒陽城西南角三秦記有漢武帝果園魏玄武苑魏都賦苑以玄武陪以幽林繚垣開囿觀宇相臨表清籞勒虞針樵蘇往而無忌即鹿縱而匪禁注玄武苑在鄴城西苑中有魚梁釣臺竹園蒲陶諸果魏芳林園魏書文帝黃初四年冬甘露降芳林園臣松之按芳林園即華林園齊王芳即位改為華林魏略明帝青龍三年於芳林園中起陂池楫棹越歌又曰明帝起土山於芳林園西北陬使公卿羣僚皆負土成山立松竹雜木善草於其上捕山禽雜獸置其中高堂隆傳景初元年起景陽山於芳林之園隆上疏諫漢劉寬傳靈帝初拜太中大夫侍講華光殿注洛陽宫殿簿曰華光殿華林園內魏銅爵園魏都賦注文昌殿西有銅爵園園中有魚池銅爵園西有三臺中央銅爵臺南金鳳臺北氷井臺初學記魏有桐園吳桂林苑吳都賦數軍實乎桂林之苑注吳有桂林苑南朝宫苑記桂林苑在落星山之陽南苑在臺城南鳳臺山陶季直京都記建康縣北吳朝為桂林苑晉瓊圃園晉宫閣名洛陽宫有瓊圃園靈芝園鄴有鳴鶴蒲陶園晉華林園羅憲傳侍宴華林園左貴嬪傳每遊華林輒回輦過之應貞傳武帝於華林園宴射貞賦詩官志大鴻臚統華林園鉤盾等令又有鄴玄武苑丞文選應吉甫華林園集詩注洛陽圖經曰華林園在城內東北隅魏明帝起名芳林園齊王芳改為華林干寶晉紀曰武帝泰始四年二月幸芳林園與羣臣宴賦詩應吉甫詩最美選注又云晉宫闕名曰華林園有萬年木十四株內後漢劉寬傳注洛陽宫殿簿曰華光殿在華林園詩七月正義晉宫閣名云華林園中有車下李潘尼有後園頌云講論華林肄射後園宋書祖沖之直華林學省齊書永明九年幸芳林園褉宴敕王融為曲水詩序南朝宫苑記芳林苑一名桃花園本齊高帝舊宅在秦淮大路北王融曲水詩序乃眷芳林即此也初學記晉有平樂鹿子桑梓諸苑並在洛陽見晉宫名境河南十二簿曰洛陽城西有桑梓苑通典北齊太子監國在西林園冬會羣臣晉春王園文選陸士衡詩逍遙春王圃躑躅千畝田注晉宫閣名曰洛陽宫有春王園又東京賦注宫閣記有春王圃梁建興苑初學記有紀少瑜遊建興苑詩唐司竹園馬三寶傳髙祖幸司竹園顧謂曰汝興兵處邪平陽公主舉兵於司竹園漢書注師古曰芒竹在盩厔南界芒水之曲多竹林即今司竹園是其地元和志司竹園在盩厔縣東十五里史記渭川千畝竹隋圖經司竹園在盩厔縣東十二里穆天子西征至元池乃植竹即此是也史記曰渭川千畝竹漢謂鄠杜竹林故有司竹都尉西都賦所謂鄠杜濱其足竹林果園芳草甘木也唐禁苑長安志禁苑在宫城之北隋曰大興苑開皇二年置內唐大內有三苑西內苑東苑禁苑三苑地廣故唐世多於苑中閲兵東西二十七里南北二十里東接霸水西接長安故城南連京城北枕渭水西即太倉倉北距中渭橋與長安故城接故城東西十三里南北十三里亦隸苑中有四面監穆裕太宗時為苑西監南面為長樂監北面與銅漢故城謂舊故宅監東西面各以本方為名分掌宫中種植及修葺園苑等又置苑總監都統之鍾紹京景龍中為苑總監皆隸司農寺苑中宫庭凡二十四所南面三門中曰景曜門東曰芳林門西曰光化門東面二門南曰光泰門北曰昭逺門西面二門南曰延秋門北曰元武門北面三門中曰啓運門東曰飲馬門西曰永泰門苑內門九十四所見於會昌六年正月宫苑使之奏六典有上林署令丞主苑囿園池京都苑總監有丞京都苑四面監副監掌所管苑面宫館園池薛元超傳髙宗詔太子射獵得入禁籞元超諫曰內苑之地繚叢薄冒翳薈銜橛之變可虞程大昌曰昆明鑿而鎬都為池隋城立而漢京為苑唐芙蓉園太宗紀貞觀七年十二月一云十月甲寅幸芙蓉園芙蓉園本隋離宫居地三十頃周回十七里芙劉餗曰園本古曲江隋文帝改名蓉房玄齡傳帝幸芙蓉園觀風俗因幸其第十七年十月壬戌幸舊紀開元二十年六月廣花蕚樓築夾城至芙蓉園亦見地理志會要貞元十四年夏京兆尹吳湊論奏掌內園芙蓉園等使資課太多宜減省從之太和九年七月庚戌造紫雲樓於芙蓉園北垣曲江池南即芙蓉景龍三年正月乙亥宴侍臣及近親於梨園亭唐上林苑六典上林令丞主苑囿太宗紀貞觀十八年十月癸卯宴雍州父老于上林苑賜粟帛蘇良嗣傳為荆州長史髙宗遣宦者采怪竹江南將蒔上苑至荆良嗣囚之上書言狀唐鹿苑實録貞觀四年十二月甲辰帝狩于鹿苑遣侍中王圭賑賜貧人紀云獵于鹿苑乙巳至自鹿苑唐洛陽苑又見積翠池唐儉傳從太宗獵洛陽苑羣豕突出帝射四發輒殪四豕一豕躍及鐙儉投馬搏之帝拔劍刺豕顧笑曰天策長史不見上將擊賊邪何懼之甚對曰漢祖以馬上得之不以馬上治之陛下神武定四方豈復快心於一獸帝為罷獵會要貞觀十一年十月永淳中幸東都使韋弘機檢校園苑垂拱初尚方監裴匪躬案諸苑唐東都苑監舊紀永淳元年五月壬寅十日置東都苑總監未置以前隸司農會要武德九年七月十九日置洛陽宫監百官志京師諸園苑苑四面監監各一人掌葺宫館園池顯慶二年十二月十日改青城宫監曰東都苑北面監明德宫監曰東都苑南面監洛陽宫監曰東都苑東面監食貨監曰東都苑西面監寶厯二年十二月廢總監官一百二十四人歸諸軍七百三人放歸開成五年四月敕總監别置使其總監及丞簿四員並停六典禁苑在皇都之西北拒北邙西至孝水南帶洛水支渠榖洛二水會于其間周回一百二十六里中有合璧冷泉髙山龍鱗翠微宿羽明德望春青城黃女凌波十有一宫芳林金谷二亭凝碧之池開元二十四年敕河南尹李適之修積翠上陽月陂顧少連傳為東都留守表禁苑募耕以便民兩京記東都苑隋曰會通苑又改為芳華神都苑周回一百二十六里東面七十里南面三十九里西南五十里北面二十四里唐梨園見樂類髙宗紀儀鳳元年八月甲子停南北中尚梨園作坊減少府雜匠德宗紀大厯十四年閏月癸未罷梨園樂工三百人李適傳中宗時春幸梨園夏宴蒲陶一作萄園有所感即賦詩學士皆屬和梨園在光化門北舊紀景龍四年二月庚戌令五品以上并學士自芳林門入集梨園三月丙辰宴桃花園四月丁亥遊櫻桃園引學士等入芳林園通鑑開元二年正月置梨園弟子天寶中即東宫置宜春北苑漢有梨園黃圖引雲陽宫記曰雲陽車箱坂下有梨園一頃唐杏園會要大中元年正月敕進士放榜後杏園依舊宴集先是武宗禁曲江亭宴聚曲江池西即杏園樂史撰杏園集十卷郭子儀引兵自杏園濟河乃杏園渡非此也建隆玉津園建隆四年四月幸玉津園閲近衛諸軍騎射十八日宴從臣一本云建隆元年夏四月十六日乙酉幸玉津園乾德四年二月幸玉津園閲衛士騎射九月又幸玉津園觀衛士騎射開寶六年五月幸玉津園觀刈麥元祐五年三月即玉津園宴餞太師文彥博園在南薰門外夾道為兩園中引閔河水别流貫之周顯德中置本朝因之三班及內侍監領兵校隸及主典二百六十六人嵗時節物進供入內仲夏駕幸觀穫麥玉津半以種麥賜從臣飲宴及賞賚園官嗇夫有差又進麥穗五百秉麥十斛麵百囊命分賜中外凡契丹朝貢使至皆就園賜宴射凡皇城司諸園池入官者屬焉楊侃皇畿賦景象仙島園名玉津珍果獻夏竒花進春百亭千榭林間水濱則有麒麟含仁騶虞知義神羊一角之祥靈犀三蹄之瑞狻猊來於天竺馴象貢於交趾孔雀翡翠白鷴素雉忽斷苑墻又連池籞屈曲溝畎髙低稻畦越卒執耒吳牛行泥霜早刈速春寒種遲何江南之野景來輦下以如移雪擁冬苖雨滋夏穗當新麥以時薦故清蹕而親至輦從千官郊陳萬騎既親穫以云罷亦宴犒而後已太祖自建隆元年四月十六日至開寶九年五月十四日凡十三臨幸太宗自興國元年十二月二十七日己未四年十一月十三日再幸真宗自咸平五年四月七日觀麥至天禧四年五月七日凡十幸仁宗自天聖三年五月十二年至慶厯四年五月十一日凡三幸建隆金鳳園建隆四年九月十九日五年十一月五日幸金鳳園乾德元年九月戊辰幸開寶二年十一月丙寅畋近郊還幸乾德瓊林苑在順天門外道南乾德二年置興國中鑿會明池於苑北以三班及內侍監領池苑兵校軍隸及主典三百三十三人嵗時節物進入每嵗駕幸金明池則并至苑中上已重陽唯中書密院或宗室及殿前諸司選勝賜宴遇放榜進士聞喜宴于此凡皇城司園池入官者皆隸焉興國七年十月十日幸淳化三年三月二十二日宴作詩景德三年八月宗室宴射元豐七年三月二日宴文彥博賜詩楊侃賦桂折天庭花開鳳城錫聞喜之新宴掩杏園之舊名連鑣上苑列席廣庭其北則瑞聖新名含芳舊苑四方異花於是乎見其東則有汴水之陽宜春之苑向日而亭臺最麗迎郊而氣候先暖瓊林金明最盛以二月間命士民縱觀上已車駕臨幸開寶西京會節園永芳園開寶九年六月九日車駕在西京幸會節園召從臣張樂宴飲景德四年二月二十一日戊子駐蹕西京宴宗室於永芳園近臣於會節園又命帥臣內職飲射先是二月七日甲戌幸永芳園十五日幸廣愛寺會節園又幸魏仁浦園後唐長興四年六月詔宫西新園名永芳新殿名和慶太平興國宜春苑在朝陽門外道南本秦王園建隆元年九月十二日二年二月十七日三年二月十八日凡三臨幸太平興國七年以迎春苑自通津門外汴水瀕乃遷置改名以其故地為富國倉或云以皇城宜春舊苑為富國倉遂遷于此差三班及內臣監領軍校兵隸及主典凡二百九十人每嵗內苑賞花則諸苑進牡丹及纒枝雜花七夕中元進奉巧樓花殿雜果實蓮菊花木及四時進時花入內園苑並準此上已重陽則宗室駙馬或館閣三司開封府刑部法官及典軍臣僚與玉津瑞聖園分互選勝賜宴凡皇城東諸園榭入官者盡隸焉玉津瓊林瑞聖宜春是為四園苑景德四年九月十三日邢昺知曹州賜宴宜春苑興國五年閏三月丁卯賜新及第舉人宴於迎春苑太平興國含芳園祥符瑞聖園會要瑞聖園在景陽門外道東初為北園太平興國二年詔名含芳以三班及內侍監領軍校兵隸及主典凡二百一十二人大中祥符三年監官王承勛言初泰山天書至都奉安於此乞加崇飾詔改今名九月丙子朔嵗時節物進供入內孟秋駕幸省斂穀實錫從臣宴飲賞賚園官嗇夫有差凡皇城諸園池入官者皆屬焉咸平六年正月三日宴宗室含芳園四年八月壬子觀稼祥符六年八月至天禧元年八月三幸瑞聖園觀稼天聖三年八月至皇祐元年八月凡七幸天聖八年八月十一日幸瑞聖園觀稼置酒苑門作鈞容樂宴於苑殿九年閏十月賜孫奭宴又賜詩淳化潛龍園奉真園淳化三年九月二十四日甲寅幸潛龍園駐輦池東岸臨水謂近臣曰朕不至此已十年昔尹京曰每嘗痛飲倒載者無數今池邊之木已成喬林矣嗟嘆久之登水心亭習射上中的者四太祖乾德四年閏八月二十九日幸皇弟開封尹北園開寶八年八月十六年十月十七年又幸祥符元年三月甲子上已宴近臣於潛龍園宗室於瓊林苑帥臣於宜春苑三司副使判官館閣官於玉津園諸司使副於含芳園六年二月八年正月宴宗室于潛龍園建炎金果園建炎元年六月己未朔右相李綱至行在上聞綱且至命侍讀董耘往勞又命執政燕綱于金果園綱力辭上趣召入見于內殿紹興玉津園紹興十七年建玉津園在龍山之北明年正月己巳初幸是園虜使賀天申節始燕射于是園二十六年九月二十七日宴交趾使乾道七年三月四日宴餞魏王乾道淳熙間頻復燕射飲餞親王皆以為講禮之所後又有德壽宫東園集芳園太上皇后下西笠御園乾道二年二月四日射于玉津園四年正月二十一日八年正月二十八日九年閏正月二十八日淳熙元年三月二十一日二年四月十八日六年七年之二月八年十年之三月十二年四月十三年三月十四年三月皆幸玉津園元年九月十八日四年三月十日再幸宴射十年十一月十三日閲武畢又幸淳熙聚景園淳熙元年四月十二日詣德壽宫請太上同幸聚景園在清波門外二年二月二十日又幸三年三月十八日幸聚景園四年三月二十六日幸六年三月九日恭請太上皇太上皇后同幸乾道八年正月二十八日幸天竺寺次幸冷泉亭慶元六年三月十六日詣壽慈宫請壽成皇太后同幸開禧二年三月十八日同歷代園名後漢芳林濯龍華林前魏西園後魏華林逍遙芳林後周芳林武遊隋平樂唐芙蓉流杯明水陶光五代金鳳玉津六朝桃花華林冶城三十六國逍遙納賢白雀北齊芳林華林遊豫丹臺新録所載閬瑶玉圃歷代苑名前漢上林思賢廣成宜春博望樂遊呼池濯龍甘泉池陽黃山長楊後漢上林廣成長利髙望始昌萬嵗漢平鴻德顯陽罼圭靈昆濯龍魏玄武後魏鹿野代後周道會親會隋芳華會通河西唐芳華神都萬嵗五代迎春三十六國文武龍勝赤龍騄驥華林桑梓六朝樂遊桂林建興青林上林婁湖博望靈丘江潭芳林方山長洲同泰白水北齊雙堂元洲仙都池沼圓曰池曲曰沼堯沔池初學記潘嶽關中記曰昆明漢武習水戰中有靈沼神池云堯時理水停船此池蓋堯時已有沔池漢代因而深廣耳周靈沼辟池詩靈臺王在靈沼於牣魚躍注沼池也言靈道行於沼也疏鄭駁異義云於臺下為囿沼三靈辟雍在郊孟子文王以民力為沼而民歡樂之謂其沼曰靈沼與民偕樂故能樂也黃圖周文王靈沼在長安三十里校獵賦昆明靈沼之東注三秦記曰昆明池中有靈沼神池史封禪書豐鎬有天子辟池索隱曰即周天子辟雍之地穆天子傳天子休于元池之上乃奏廣樂三日是曰樂池觴西王母于瑶池之上齊昭華池韓詩外傳齊景公出弋昭華之池漢上林十池百官表少府有上林中十池監注師古曰三輔黃圖云上林中池上籞五所而此云十池監未詳其數霍光傳安池監賞黃圖十池上林苑有初池麋池牛首池在上林苑中西頭蒯池生蒯草以織席積草池中有珊瑚樹髙一丈二尺一本三柯上有四百六十二條南越王他所獻東陂池西陂池當路池大臺池郎池西陂郎池皆在古城南上林苑中陂郎二水名因為池上林賦西馳宣曲濯鷁牛首注張揖曰牛首池在上林苑西頭括地志牛首池在雍州長安縣西北三十八里光西京賦注黃圖曰甘泉宫中有牛首山霍傳輦道牛首臣瓚注池名在上林苑中初學記漢上林有池十五所承露昆靈天泉龍魚蒯菌鶴西陂當路東陂太一牛首積草麋含利百子後紀章帝建初元年七月辛亥以上林池籞田賦與貧人漢鎬池黃圖鎬池在昆明池之北即周之故都也廟記曰長安城西周匝二十一里溉地三十三頃史記秦始皇三十六年有人持璧遮使者曰為吾遺鎬池君初學記秦有蘭池鎬池三秦記始皇作長池漢昆明池靈波殿豫章臺靈沼神池武紀元狩三年秋發謫吏穿昆明池注如淳曰食貨志以舊吏弄法故謫使穿池更發有資者為吏也臣瓚曰西南夷傳有越巂昆明國有滇池方三百里漢使求身毒國而為昆明所閉今欲伐之故作昆明池象之以習水戰元狩四年作在長安西周回四十里括地志云在雍州長安縣西十八里元和志同食貨志武帝時法益嚴吏多廢免兵革數動民多買復及五大夫千夫徵發之士益鮮於是除千夫五大夫為吏不欲者出焉故吏皆謫令伐棘上林作昆明池是時粵欲與漢用船戰遂乃大修昆明池列館環之治樓船髙十餘丈旗幟加其上甚壯天子感之乃作柏梁臺髙數十丈宫室之修由此日麗五行志元狩三年發天下故吏伐棘上林穿昆明池西域贊廣開上林穿昆明池西京雜記武帝作昆明池欲伐昆明夷教習水戰因於其上遊戲養魚給諸陵廟祭祀又曰昆明池刻石為鯨魚每至雷雨魚常鳴吼鬐尾皆動漢世祭之以祈雨黃圖昆明池武帝元狩四年穿在長安西南三輔舊事曰池地三百三十二頃一作蓋地三百二十頃有百艘樓船上建樓櫓戈船各數十上建戈矛四角悉垂幡葆麾蓋照燭涯涘池中有豫章臺及石鯨曹毗志經曰樓船上建樓櫓戈船上建戈矛又作二石人東西相對象牽牛織女以象天河漢宫殿疏曰有二石人牛女象圖曰上林苑有昆明池周匝四十里廟記曰池中後作豫章大船可載萬人上起宫室一説甘泉宫南有昆明池池中有靈波殿皆以桂為柱風來自香池中有龍首船常令宫女泛舟池中張鳳蓋建華旗作棹歌雜以鼓吹帝御豫章觀臨觀焉張衡西京賦曰昆明靈沼黑水玄址武帝初穿池得黑土帝問東方朔云云三秦記曰昆明池中有靈沼名神池云堯時治水嘗停船於此池通白鹿原原人釣魚綸絶而去夢於武帝求去其鈎三日見大魚銜索乃取鈎放之間三日復遊池濱得明珠一雙帝曰豈昔魚之報耶西都賦神池靈沼往往而在注三秦記曰昆明池中有神池通白鹿原集豫章之宇臨昆明之池左牽牛而右織女似雲漢之無涯後宫登龍舟張鳳蓋建華旗西京賦乃有昆明靈沼黑水玄址周以金隄植以柳杞豫章珍館揭焉中峙牽牛立左織女處右日月於是出入象扶桑與濛汜旋憩乎昆明之池命舟牧為水嬉浮鷁首翳華芝垂翟葆建羽旗齊栧女縱棹歌發引和校鳴葭奏淮南度陽阿感河馮懷湘娥校獵賦序曰武帝穿昆明池象滇河遊觀侈靡窮妙極麗賦曰昆明靈沼之東集靖冥之館以臨珍池灌以岐梁溢以江河西征賦乃有昆明之池日月麗天出入乎東西朝似暘谷夕類虞淵豫章名宇披流特起儀景星於天漢列牛女以雙峙又關中記曰堯時已有沔池漢武因而深廣之水經注交水西至石堨武帝開昆明池所造有石闥堰在縣西南三十二里交水上承樊川御宿諸水後鄧禹傳伐赤眉南至長安軍昆明池大饗士卒唐許敬宗傳髙宗顯慶三年十月問昆明池是漢何年開對曰因鎬之舊澤穿池元狩三年事也周蘇綽傳文帝與公卿往昆明池觀漁又隋開皇十三年七月丁巳幸昆明池括地志豐鎬二水皆已堰入昆明池無復流派長安志昆明池在長安縣西二十里今為民田漢太液池清淵詳見建章宫昭紀始元元年春二月黃鵠下建章宫太液池中公卿上壽賜諸侯王列侯宗室金錢各有差注如淳曰謂之液者言天地和液之氣所為也臣瓚曰太液池承隂陽津液以作池也師古曰如瓚之説皆非也黃鵠大鳥一舉千里太液池者言其津潤所及廣西京雜記大液池邊皆雕胡紫籜節叢滿生蒲之類菰菰有米長安人謂為雕葫葭蘆之米解者謂之紫蘀胡之有首者謂緑節其間鳬雛鴈子布滿充積又多紫龜緑鱉池邊多平沙沙上鵜鶘鸊鵜交鶄鴻鶂動輒成羣大液池中有鳴鶴容與清曠採菱越女等舟始元元年春黃鵠下太液池帝為歌曰黃鵠飛兮下建章羽肅肅兮行蹌蹌金為衣兮菊為裳唼喋荷荇出入蒹葭自愧菲薄愧爾嘉祥三輔黃圖太液池在長安故城西建章宫北未央宫西南太液者言其津潤所及廣也關輔記曰長安志作關中記建章宫北有池以象北海刻石為鯨魚長三丈漢書曰郊祀志建章宫武帝作北治大池漸臺髙二十餘丈名曰太液池中起三山以象蓬萊方丈瀛州刻石象魚龍竒獸異禽之屬廟記云建章宫北池名太液周回十頃有採蓮女鳴鶴之舟三輔舊事曰日出暘谷浴於咸池至虞淵即暮此池象之成帝常以秋日與趙飛燕戲于太液池以沙棠木為舟沙棠木造舟不沉以雲母飾於鷁首一名雲舟又刻大桐木為虬龍雕飾如真夾雲舟而行紫桂為柁枻今太液池尚有避風臺即結裾之處長安志三輔舊事曰建章宫北作清淵又曰清淵北有鯨魚刻石為之西都賦前唐中而後太液校獵賦序漸臺泰液象海水周流方丈瀛洲蓬萊西京賦前開唐中彌望廣潒顧臨太液滄池漭沆漸臺立於中央赫昈昈以弘敞清淵洋洋注三輔舊事曰建章宫北作清淵海神山峩峩列瀛洲與方丈夾蓬萊而駢羅長風激於别島起洪濤而揚波浸石菌於重涯濯靈芝於朱柯海若遊於元渚鯨魚失流而蹉跎三輔故事池北岸有石魚長三丈廣五尺西岸有石龜二枚並長六尺東都賦太液昆明鳥獸之囿漢百子池黃圖在宫內髙祖七月七日臨百子池作于闐樂正月上辰出池邊盥濯食蓬餌以袚妖邪三月上已張樂池上漢唐中池黃圖唐中池周回十二里在建章宫太液池南西都賦前唐中而後太液覽滄海之湯湯揚波濤於碣石海畔山也激神嶽之將將濫瀛洲與方壺蓬萊起乎中央建章宫其西唐中數十里唐庭也漢西陂池上林賦日出東沼入乎西陂李善注漢宫殿簿曰長安有西陂池東陂池漢滄池黃圖滄池在長安城中舊圖云未央宫有滄池言池水蒼色影蛾池武帝鑿以玩月其旁起望鵠臺以眺月影入池中亦曰眺蟾臺鶴池在長安城西盤池在西北並廢氷池在長安西舊圖云西有彪池亦名聖女泉初學記長安記曰建章宫有太液滄池中築漸臺漢琳池桂臺黃圖昭帝始元元年穿琳池廣千步池南起桂臺以望逺東引太液之水池中植分枝荷一莖四葉狀如駢蓋日照則葉低蔭根莖名曰低光荷以文材為船木蘭為柂刻飛鸞翔鷁飾船首起商臺於池上古文苑昭帝淋池歌曰秋素景兮泛洪波見拾遺記揚雄羽獵賦集於靖冥之館以臨珍池漢少府佽飛外池池籞黃圖少府佽飛外池漢儀注佽飛具矰繳以射鳬鴈給祭祀故有池元紀初元二年三月詔罷少府佽飛外池嚴籞池田假與貧民如淳注與黃圖同也晉灼曰嚴籞射苑宣紀地節三年十月詔池籞未御幸者假與貧民注應劭曰池陂池也籞禁苑也漢安邑鹽池見鹽類漢酒池張騫傳行賞賜酒池肉林令外國客遍觀西域傳贊設酒池肉林以饗四夷之客黃圖秦酒池在長安城中廟記曰長樂宫中有魚池酒池武帝作以夸羌胡飲以鐵杯重不能舉皆抵牛飲西征賦云酒池監於商辛追覆車而不悟史記正義括地志云漢太上皇廟在雍州長安縣西北長安故城中酒池之北元和志酒池在長樂宫中武帝所作漢蒲池郊祀志文帝親拜霸渭之會二水之合也五帝廟臨渭其北穿蒲池溝水注師古曰為池而種蒲字或作滿漢濯龍池見宫及園類李雲傳帝在濯龍池初學記東漢有九龍御龍靈芝白石濯龍天泉池漢鴻池續志鴻池丞二百石注鴻池池名在雒陽東二十里安紀永初三年三月癸巳詔以鴻池假貸貧民注續漢書曰在洛陽東二十里假借也令得漁採其中桓紀永興元年三月丁亥幸鴻池趙典傳桓帝時侍中帝欲廣開鴻池典諫曰鴻池泛溉已且百頃猶復增而深之非所以崇唐虞之約已遵孝文之愛人也帝納其言而止楊賜傳先帝之制左開鴻池右作上林不奢不約以合禮中注鴻池在洛陽東上林在西東京賦洪池清籞渌水淡淡注同安帝紀水經注穀水又東注鴻池陂百官志曰鴻池池名也在洛陽東二十里丞一人二百石池東西千步南北千一百步四周有塘池中又有東西橫塘水溜徑通故李尤鴻池陂銘曰鴻澤之陂聖王所規開源東注出自城池其水又東注合七里澗文選注李尤洪池銘曰漸臺中起列館參差藝文類聚晉張載洪池陂銘曰開源東注出自城池漸臺中起列館參差惟水泱泱厥大難訾漢璧水見明堂類魏靈芝池靈沼紀黃初三年十一月是嵗穿靈芝池四年五月有鵜鶘集池上詔曰詩人所謂汙澤也曹詩刺共公逺君子而近小人豈有賢智之士處于下位乎否則斯鳥何為而至其博舉俊德茂才獨行君子以答曹人之刺晉宫閣記靈芝池有鳴鶴舟指南舟文選景福殿賦建淩雲之層盤浚虞淵之靈沼注沼名魏明引榖水過九龍前為玉井綺欄蟾蜍含受神龍吐流使博士馬均作司南車水轉百戲魚龍曼延魏天淵池紀黃初五年穿天淵池一本云七年三月伐楊暨從行天淵池帝論蜀事水經注天淵池在洛陽池中有魏文帝九華叢殿基宋志魏明帝天淵池南設流杯石溝燕羣臣晉宫閣記天淵池有升進曜陽飛龍射獵舟後魏興安二年二月乙丑穿天泉池江總芳林園天淵池銘曉川漾璧夜浪浮金梁武帝有首夏泛天淵池詩魏芙蓉池文選魏文帝芙蓉池作詩乘輦夜行遊逍遙步西園魏疏圃池玄武池見水戰類初學記魏在鄴有渌水瓊華疏圃玄武靈芝池在洛有天泉池中築九華臺流杯幽泉隂流鳴鶴池西晉有含利都亭靈芝濛泛張載作賦潛靈渌池東晉有清遊流杯池宋有天泉華林池池有雙蓮同幹芙蓉異花並蒂後魏有鴻鴈流化池梁有間豫池池有龍影五采遂鑄銅龍其上晉濛汜池張載賦激通渠於千金承瀍洛之長川天子乘玉輦時遨遊排金門出千秋造緑池鏡清流載傳云為濛汜賦魏明帝鑿濛汜池種芙蓉於中晉西池列傳溫嶠太子起西池樓觀嶠上疏明帝為太子時立謝安出鎮廣陵帝出祖于西池獻觴賦詩劉毅帝大宴於西池有詔賦詩江逌諫鑿北池及立閣道宋天淵池宋書元嘉十年七月己丑華林天淵池芙蓉異花同蒂選注引潘尼上已日會天淵池詩梁昆明池武帝紀有五色雲浮於華林園昆明池後魏流化池孝文宴羣臣於流化池唐昆明池紀髙祖武德九年三月庚寅幸昆明池習水戰壬辰至自昆明池舊紀武德六年三月乙未幸昆明池宴百官元年三月辛卯幸昆明池一本云三年六月癸丑幸昆明池宴從官賜錢五年正月壬子幸太宗貞觀五年正月癸酉獵于昆明池會要正月十三日大搜上謂髙昌王言樂事有三太宗有冬日臨毗明池詩云石鯨分玉溜云云子代宗大厯二年二月壬幸昆明池安樂公主傳嘗請昆明池為私沼帝不許自鑿定昆池延袤數里定昆池在長安縣西南十五里長安志昆明池漢時有深六尋其袤十里德宗貞元十三年七月月舊紀云八丁巳命京尹韓臯充使浚之乃追尋漢制引交河及豐合流入于池作堰而通焉修石炭賀蘭兩堰并造土堰臯刻銘用錢七千四百二十貫太和三年又命京兆府浚之張仲素有賦白居易賦詔開八水注恩波千介萬鱗同日活動植飛沈皆遂性皇澤如春無不被李庾西都賦御水分溝昆明下流在野灌溉入宫環洲唐月池賜宴儒學傳張後裔字嗣宗髙祖鎮太原引為客以經授太宗即位進燕王咨議從王入朝召見乃賜宴月池令羣臣以春秋酬難帝曰朕昔受大義於君今尚記之嗣宗頓首謝曰陛下乃生知臣叨天功為己力罪也帝大悅唐春苑池閻立本傳太宗與侍臣泛舟春苑池見異鳥容與波上悅之詔坐者賦詩而召立本侔狀唐積翠池魏徵傳太宗宴羣臣積翠池在洛陽宫西苑酣樂賦詩徴賦西漢其卒章曰終藉叔孫禮方知皇帝尊帝曰徵言未嘗不約我以禮實録貞觀十一年十一月辛酉册府元龜作辛丑宴積翠池帝賦尚書曰日昃玩百篇臨燈披五典夏康既逸豫商辛亦沈湎恣情昏主多克已明君鮮滅身資纍惡成名由積善特進魏徵得西漢曰受降臨軹道爭長趣鴻門驅傳渭橋上觀兵細柳屯夜宴經柏谷朝遊出杜原終藉叔孫禮方知皇帝尊通鑑貞觀十一年三月庚子上宴洛陽宫西苑泛積翠池謂侍臣以隋為戒本草圖云漢積翠池中有珊瑚隋閲散樂於東京芳華苑積翠池側隋樊子蓋陪宴積翠池唐曲江池又見紫雲樓及漢宜春宫漢元紀宜春下苑師古注曰即今京城東南隅曲江池是歐陽詹有記乾元元年五月己亥於曲江池投龍祈雨太和九年濬昆明曲江二池孔戢傳為京兆尹嵗旱文宗憂甚戢躬祠曲江池一夕大雨漢司馬相如賦臨曲江之隑州秦隑州漢樂遊原隋鑿為池唐龍首池實録玄宗先天二年三月甲戌帝以旱親往龍首池祈禱有赤蛇自池而出雲露四布應時雨文宗開成元年三月庚申幸龍首池觀內人賽雨甘澤屢降中外感悅帝賦莫春喜雨詩百官屬和會要元和十三年二月浚龍首池起承暉殿雕飾綺煥太和九年十月舊紀云七月戊申詔左軍二千人填龍首池以為鞠場岐陽公主傳開第昌化里疏龍首池為沼唐隆慶池龍池詳見龍池樂章及龍池頌興慶池舊紀中宗景龍四年四月乙未幸隆慶池張樂結綵為樓宴侍臣泛舟戲樂命賦詩玄宗賜宅於隆慶坊所居宅外有水池浸溢頃餘望氣者以為龍氣會要開元二年閏二月祠龍池六月蔡孚獻龍池篇公卿已下一百三十篇太常考其合律者為樂章十首十六年正月庚申制曰飛佳氣於在田之際湧瑞日於或躍之池十八年十二月二十九日有龍見于興慶池因祀而見也一本又云十九年五月壬申京師旱帝親禱興慶池是夜大雨乙亥裴光庭奏宣付史館七月甲戌久旱又親禱翌日大雨貞元十三年舊紀四月壬戌幸興慶宫龍堂祈雨有白鸕鷀浮沈水際後果大雨舊紀乙丑大雨六典所居之東有舊井忽涌為小池至景龍中為龍池焉張九齡頌曰濯濯靈泉洞冥皇祇滋液流衍化為神池曰止曰行惟聖之作匪鱣匪鮪惟龍之躍五聖在天丕命曾孫髙視河洛同符玄元亦有黃龍出於靈沼明明穆穆天子之表初學記蘇瓌馬懷素興慶池侍宴應制詩唐廣仁池陂福源池地理志鄭州管城縣有僕射陂後魏孝文賜僕射李沖因以為名天寶六載更名廣仁池會要云廣仁陂汴州開封縣有福源池本蓬池天寶六載更名福源並禁漁採會要天寶六載正月二十九日詔今陽和布氣蠢物懷生在於含養必期遂性其滎陽僕射陂陳留蓬池宜斷採捕仍改名云初學記大梁有蓬池氏續述征記大梁西南七十里尉縣有蓬池唐九成宫東臺山池王勃賦序云松峯桂壑紅泉碧磴金石千聲雲霞萬色唐放生池會要乾元二年三月己丑肅宗命史元琮張延玉宣詔天下州縣臨江帶郭處各置放生池始洋州興道訖于升州凡八十一所刺史顔真卿述碑銘一章乞御書題額立石吳興漢碑云成湯存一面之網武致銜珠之答賀知章傳求周宫湖數頃為放生池賜鏡湖剡川一曲劉餗傳記梁武帝崇奉釋氏置放生池謂之長命洲唐太平公主於京西撅地贖水族之生者置其中謂之放生池藝文類聚梁元帝有荆州放生亭碑放生池碑孝經傳所記率以好生為盛德於民既然物亦以之故魚鱉咸若志於書靈臺牣躍歌於詩信及豚魚系於易母麛母卵戒於月令推放麑之仁孟孫從而託子斷泗淵之罟魯君以為得法童兒不捕將鄒之雉廉掾知其有仁心乃若奪命鼎息轉之清波舍枯肆之歸而遂函生之樂則金仙氏之説實倡之列子邯鄲之民以正旦獻鳩於簡子曰正旦放生示有恩也唐寶應靈慶池地理志河中府安邑有鹽池與解為兩池大厯十二年生乳鹽賜名寶應靈慶池韓滉傳滉判度支大厯十二年秋潦敗河中鹽滉奏池産瑞鹽帝遣諫議大夫蔣鎮亷狀鎮還乃賀帝請置祠詔號寶應靈慶池舊紀大厯十二年十月丁亥韓滉言之賀通鑑十一月丙辰蔣鎮還奏瑞鹽上表請置祠賜號唐魚藻池德宗舊紀貞元十三年七月壬辰浚湖渠魚藻池深五尺一本云幸魚藻池池先深一丈浚加四尺順宗紀侍宴魚藻宮張氷嬉綵艦宫人為棹歌見宫類穆宗舊紀元和十五年八月壬辰發神策六軍二千人浚魚藻池會要元和十五年九月幸魚藻池大張樂觀競渡唐蓬萊池李絳傳憲宗嘗畋苑中至蓬萊池謂左右曰絳嘗以諫我今可返也其見禮憚如此畏直臣之諫而不敢盤于遊畋唐鑑元和五年帝欲近獵苑中至蓬萊池西曰李絳必諫不如且止會要元和十二年五月一本云閏五月己酉新作蓬萊池周廊四百間韋處厚集序穆宗初為中書舍人侍遊蓬萊池延問大義退而進六經法言二十編李德裕詩注學士初上賜食皆蓬萊池魚鱠雍録蓬萊池在東內之北其欲往獵則禁苑也唐凝碧池臨碧池會要寶厯二年六月幸凝碧池觀魚舊紀云六月辛酉幸凝碧池令兵士千餘人於池中取大魚長大者送入新池敬宗紀寶厯三年六月辛酉觀魚于臨碧池在苑中詩亦見王維六典東都禁苑有凝碧之池太宗御製述聖賦序因兹餘隟乃修苑囿其勝地則有積翠凝碧其川阜則有濯龍平樂唐珠池懿宗紀咸通四年七月辛卯朔弛亷州珠池禁唐九洲池東京記東都城有九洲池在仁智殿之南歸義門之西其池曲象東海之洲居地十頃水深丈餘魚鳥翔泳花卉羅植國史志內園有九江池唐璧水禮志皇帝御明堂讀時令設羣官於璧水東之門外通典云璧水東門之外文官在北武官在南俱西上明堂位正義案異義今戴禮説盛德記曰明堂其外有水名曰辟雍水經注建隆講武池見水戰類太平興國金明池見水戰類祥符二年四月丁亥賜金明池善泅軍士緡錢先是每嵗為競船之戲車駕必臨視之嘉祐二年三月二十三日命契丹使觀金明池水嬉賜宴瓊林苑熙寧三年四月三日元豐二年四月辛丑幸觀水嬉樂史獻金明池賦召為三館編修李昌齡獻詩百韻太宗嘉之擢直史館祥符泰山玉女池記祥符元年議東封先營頓置泰山頂有玉女池實録云泉素壅而濁至是泉忽湍清泚甘美工徒賴以汲用經度制度使王欽若請濬治之池側有石像頗摧折九月詔皇城使劉承圭易以玉石辛酉像成召宰臣觀於崇政殿西序遣使礱石為龕奉置舊所欽若致祭十月己丑上作記示輔臣庚戌上步自御幄觀玉女泉命王旦等觀聖製石記水經注具茨山潩水出其阿而流為陂俗謂之玉女池隋開皇十七年五月宴百寮於玉女泉祥符凝祥池八年五月癸巳詔會靈觀池名凝祥即舊池導惠民河注之園名奉靈十一月丁巳幸元豐五年正月十四日幸六年十一月九日幸元祐四年正月十四日幸祥符象瀛山池後苑有象瀛山池祥符九年二月二十七日後苑觀太宗御書移幸流杯殿泛觴登象瀛山翠芳亭遂宴玉宸殿汴都賦寶閣靈沼巍峩泛灔繚以重垣防以回隄雲屋連簃瓊闌壓墀恍湡浯與方壺帝令鬼鑿而神移紹興放生池紹興十三年五月乙亥中書舍人楊願請倣唐乾元及國朝故事詔天下置放生池工部郎中林乂請以臨安府西湖為放生池從之景德四年三月乙巳召輔臣對苑中過山亭臨放生池天禧元年十一月壬寅詔淮南江南荆湖治放生池淳熙放生池淳熙三年十二月十七日詔西湖係放生池不得採捕厯代池名前漢昆明太液積草百子唐中魏虞淵沼蘭渚玄武靈芝天淵後魏碧海玄武天淵流觴鴻鴈代同下天泉神泉旋鴻隋積翠凝碧芳夏九曲九洲唐蓬萊龍首魚藻太液定昆興慶三十六國清源一作涼靈芝渌漣六朝天泉清遊北齊金華丹臺新録所載蘂淵瓊池津名玉醴琅園空同始暉滄浪曜靈山名金庭龜竹葉金華鬱絶三秀嶺玉海卷一百七十一
