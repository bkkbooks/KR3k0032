body:
  text: 玉海卷一百九十六宋王應麟撰祥瑞地瑞山川金石宓犧河圖龍圖洛書繫辭河出圖洛出書聖人則之疏春秋緯云河以通乾出天苞洛以流坤吐地符河龍圖發洛龜書感河圖有九篇洛書有六篇孔安國以為八卦九疇又禮緯含文嘉曰伏羲德合上下天應以鳥獸文章地應以河圖洛書則而象之乃作八卦宋志宓犧受龍圖畫八卦所謂河出圖隋志河圖二十卷梁河圖洛書一十四卷亡河圖龍文一卷文選注引之古三墳伏羲氏皇策辭曰惟天至仁於草生月天雨降河龍馬負圖神開我心蘇嘉慶河圖九宫法五數為中戴九履一左三右七二四為上六八為下詩大明疏唐堯之受河圖昌名已在其録魯頌疏中候握河紀説帝堯受河圖之禮云稷辨護古史考伏羲時靈龜負河圖八卦是也黃帝録圖龍圖龜書堯河圖舜河圖禹河圖洛書緑字周成王河圖又見龜龍漢郊祀志三代居三河河洛出圖書龍魚河圖曰堯到翠媯之川大龜負圖詩疏六藝論云河圖洛書皆天神言語以教告王者晉天文志黃帝受河圖始明休咎宋志黃帝逰洛水之上見大魚魚流於海得圖書焉龍圖出河龜書出洛赤文篆字堯觀於三河常有龍隨之一日龍負圖而至文曰亦受天祐修壇場於河雒率舜等升首山遵河渚有五老逰焉蓋五星之精也相謂曰河圖將來告帝以期二月辛丒昧明禮備至于日昃有龍馬銜甲赤文緑色臨壇而止吐甲圖而去甲似龜背廣九尺其圖以白玉為檢赤玉為泥以黃金約以青繩檢文曰闓色授帝舜帝乃寫其言藏于東序後二年二月仲辛率羣臣沈璧于洛至下􅉴赤光起元龜負書而出背甲赤文成字止于壇舜設壇于河黃龍負圖長三十二尺廣九尺出于壇畔赤文緑錯禹觀於河有長人出曰吾河精也授禹河圖言治水之事洛出龜書六十五字是為洪範此謂洛出書湯東至洛觀堯壇黃魚黑鳥止於壇化為黑玉又有黑龜並赤文成字赤爵銜書及豐鳳凰銜書逰文王之都成王觀河洛沈璧青龍臨壇銜玄甲之圖禮於洛亦如之玄龜青龍蒼光止於壇背甲刻書赤文成字周公援筆寫之白虎通王者德至淵泉則河出龍圖洛出龜書漢五行志敘河圖命庖雒書賜禹八卦成列九疇逌敘世代實寶光演文武晉地理志大禹觀濁河而受緑字選注論語讖堯觀河渚一老曰河圖將來告帝期帝命驗曰順堯考德題期立象宋均注曰堯省河洛得龜龍之圖書舜禪後習堯禮得之演以為考河命題期立象三篇在中候河圖挺佐輔曰黃帝云余夢見兩龍挺白圖授余於河之都天老曰天其授帝圖乎黃帝齊七日至翠媯之川大魚泝溜而至泛白圖蘭葉朱文以授黃帝名曰緑圖魏志注黃帝受命風后受河圖文心雕龍緑圖曰灘灘噅噅棼棼雉雉萬物盡化言至德所被也丹書曰義勝欲則從戒謹之至也胡氏曰河出圖洛出書而八卦畫簫韶作春秋成而鳯麟至事應雖殊其理一也易曰大人者先天云云舜孔子先天者也先天而天弗違志一之動氣也伏羲氏後天者也後天而奉天時氣一之動志也中候成王觀于河沈璧禮畢至于日昧榮光塞河青雲浮洛青龍臨壇銜玄甲之圖吐之而去淮南子至德之世洛出丹書河出緑圖隋潘徽云龍策授河龜威出洛緑綈白檢述勛華之運金繩玉字表殷夏之符詳見六經舜金車殷山車周泰山器車並見車類殷山溢銀漢昆田黃金泰山黃金麟趾裊蹄史封禪書殷得金德銀自山溢流出也漢武紀元封六年三月詔朕禮首山昆田出珍物化或為黃金太始二年三月詔有司議曰往者朕郊見上帝西登隴首獲白麟以饋宗廟渥窪水出天馬泰山見黃金宜改故名今更黃金為麟趾裊蹄以協瑞焉因以班賜諸侯王注師古曰金有常形制欲表祥瑞改鑄為麟足馬蹄之形以易舊法今人於地中得馬蹄金金甚精好形製巧妙秦櫟陽雨金作畦畤文王河圖洛書易乾鑿度今人天元二百七十五萬九千二百八十歲昌以伯受命注受洛書命為天子也入戊午蔀二十九年伐崇侯作靈臺改正朔布王號天下受録應河圖注受命後五年乃為此詩文王疏讖緯注説皆言文王受洛書又尚書運期授引河圖曰倉帝之治八百二十歲立戊午蔀注云周文王以戊午蔀二十九年受命漢山稱萬歲唐太行聖崖響紀元封元年春正月行幸緱氏詔曰親登嵩髙御史乘屬在廟旁吏卒咸聞呼萬歲者三登禮罔不答其加增太室祠太始三年二月禮日成山登之罘浮太海山稱萬歲志二月東幸緱氏禮登中嶽太室從官在山上聞若有言萬歲云唐武德二年三月安昌縣言太行山聖人崖響云唐國興治萬年又見五行志漢漅湖黃金紀永平十一年漅湖出黃金廬江太守以獻時麒麟白雉醴泉嘉禾所在出焉隨車表舜還雨來秦不愛其寶厥貢惟金櫟陽之雨林邑之流昆田之祥漢河圖西都賦大漢受命而都之也俯協河圖之靈注雒書曰河圖命紀五經緯皆河圖也典引圖書亮章天哲也晉氐池元石魏寶石負圖武紀泰始三年夏四月戊午張掖太守焦勝上言氐池縣大栁谷有元石一所白畫成文實大晉之休祥詔以制幣告于太廟藏之天府漢晉春秋云蒼石晉初馬象煥徹如玉樂志靈之祥石瑞章旌金德出西方唐志雜家孟衆張掖元石圖一卷選注引程猗説石圖髙堂隆元石圖一卷魏氏春秋曰青龍三年張掖刪丹縣金山元川溢涌寶石負圖狀象靈龜立於川西有石馬七有玉匣上有玉字玉玦二璜一麟鳳白虎犧牛又有若八卦列宿之象張臶傳青龍四年辛亥詔書張掖川溢寶石負圖蒼質素章麟鳳龜馬煥炳成形髙堂隆以為東序之世寶事班天下臶曰此當今之變異而將來之符瑞也魏都賦山圖其石川形其寶搜神記魏之初興張掖栁谷有開石焉始見於建安形成於黃初文備於太和周圍七尋中髙一仭蒼質素章龍馬麟鹿鳳凰仙人之象粲然咸著魏晉代興之符也晉泰始三年焦勝圖上唐五行志石金類晉室之瑞慶厯四年五月乙亥撫州金溪得生金山重三百二十四兩晉臨平湖開咸寧二年七月臨平湖自開父老相傳湖開天下平晉金勝金鐸穆帝永和元年二月春榖民得金勝一長五寸狀如織勝明年平蜀建興二年十二月晉陵武進民得銅鐸五枚王廙傳晉陵有金鐸之瑞郭璞云必致中興宋志金勝國平盜賊四夷賔服則出元嘉十九年九月戊申廣陵出石鐘九口唐德宗大厯十四年七月庚午詔王者所寶維賢雍州奏金坑任人開採宋河清頌元嘉中二十四年二月戊戌河濟俱清鮑照為河清頌云澄波昆嶽鏡流蔥山泰階既平洪河既清大人在上區宇文明張暢亦有頌京房易傳曰河水清天下平易乾鑿度曰聖人受命瑞應先見於河河水先清易坤靈圖曰聖人受命瑞見于河李康運命論黃河清而聖人生唐受瑞壇瑞石地理志北都倉城中有受瑞壇唐初髙祖使子元吉留守獲瑞石有文曰李淵萬吉築壇祀以少牢武德三年五月郇州獻瑞石有文曰天子萬年唐水清會要武德元年七月新豐鸚鵡谷水清世傳此水清天下太平開皇初暫清復濁至是復清七年九月丹州言河水清志大中八年正月陜州河清寶應元年九月甲午太州至陜州二百餘里河清澄徹見底唐蒲州河清五行志火沴水武德九年二月蒲州河清襄楷以為河諸侯象清陽明之效也貞觀十六年正月懷州十七年十二月鄭滑州二十三年四月靈州河清唐河清貞觀十四年陜州刺史房仁裕稱正月元日黃河載清二月司空無忌等上表曰丹并輝竒青丘表異嘉苖合穎天駟躡雲西鶼南雉之貢日至月書連珠涌醴之祥雲飛霧集納渭含涇混流同潔凌門泑澤别派俱清馬頰馳波詳觀若鏡龍門激箭回眺飛空千尋明徹俯映玄珠一曲澄鮮遙觀紫貝十六年許敬宗表德水清漪濁流澄鏡唐景雲河清歌貞觀十四年二月四日陜州言黃河清而有景雲見協律郎張文收采古天馬作歌之義作景雲河清歌名曰燕樂首元會第一奏是也志十四年二月陜州秦州河清權德輿賀滑州黃河清表澄徹如練淪漪成文五行志永徽元年正月濟州二年十二月衛州五年六月濟州調露二年夏豐州開元二十五年五月戊寅淄棣州建中四年五月乙巳滑濮州長慶元年靈州河清詳見上唐涼州瑞石紀貞觀十七年十一月壬午以涼州獲瑞石赦涼州五行志貞觀十七年八月涼州昌松縣鴻池谷有石五都督李襲譽表奏青質白文成字八十八字合百一十字太宗遣使祭之曰天有成命表瑞正石文字昭然厯數惟永既旌髙廟之業又錫眇身之祚逮于皇太子治亦降禎符具紀姓氏甫惟寡薄彌增寅懼十月甲寅詔曰厚地降祉正名表祥營翠色而流光發素質而成字十一月己卯有事南郊讀謝天瑞文上官儀有賀表二十年十一月陜州言有石成文曰李君王三字開元十九年四月壬辰河南登封縣石文舊有帝字新生上字唐瑞鹽會要武德七年閏七月十三日長安古城鹽渠水中生鹽色紅白而味甘狀如方印大厯八年七月解縣安邑兩池生乳鹽户部侍郎韓滉請薦于清廟編之史册從之十二年十一月賜號寶應靈慶池又地理志詳見池類天寶十載火尋獻黑鹽宋朝祥符三年九月辛巳賜近臣及館閣解池瑞鹽陳堯叟所獻凡四千七百斤夏竦進瑞鹽賦太平興國瑞石祥符神告帝統石詩贊太平興國四年九月癸巳嘉州得黑石二皆丹文緘其石來獻晏殊為贊曰輝煌丹文見于介石七年三月辛酉舒州民柯蕚一作孫蕚於萬歲山得玄石有白文其文乃志公所記以石來獻祥符五年馮仁傑表言太祖後唐天成二年二月十六日降誕太宗丙子嵗即位並符合閏十月丁丑車駕謁啓聖院太宗神御殿于龍圖閣取舒州石召從臣宣示云云政和二年晉州確山得石文曰堯天正又左邊見一瑞字製天正堯瑞旗五年建明堂采石滎陽石有明字製文石旗祥符河清三年十一月庚子陜州言寶鼎縣河清遣官往祭羣臣稱賀十二月二日三日再清庚戌上作七言詩晏殊上河清頌夏竦賦曰失洶涌之黃流湛清冷之素液銀潢之影橫秋帝臺之漿映日將祀汾南為民祈榖大河載清于陜之服豈比夫蘭葉朱文涌黃靈之籙芝泥玉柙泛帝媯之圖雍熙五年正月戊辰澶州言黃河清二百里淳化三年河清曲沔彼經瀆澄明鑑如清應寶運光涵帝居洞分沈璧徹見遊魚景德三年河清曲曰德水湯湯發源靈長皎鑒澄徹千年效祥襄楷曰春秋以來及古帝王未有河清唯京房易傳曰河水清天下平國朝宰相上事判案三道一司天監夀星見二開封府嘉禾合穗三澶州黃河清並判準紹興十四年六月甲辰準東漕臣言楚州鹽城於五月二十五日乙亥海水澄清宣付史館十五年撰滄海澄清曲醴泉炎帝醴泉宋志炎帝神農氏有聖德嘉禾生醴泉出史記禹本紀言河出崑崙其上有醴泉瑶池堯醴泉世紀堯時醴泉涌於山禮緯神農作耒耜地應以醴泉堯德匪懈醴泉出中候帝堯即位七十載醴泉出山俊乂在官則醴泉出援神契德至深泉則醴泉湧宋志水之精也甘美王者修理則出漢醴泉宣紀甘露二年春詔曰醴泉滂流枯稿榮茂後紀光武中元元年夏宋志五月醴泉湧出京師飲者痼疾皆愈明帝永平十一年醴泉嘉禾所在出焉列傳上林賦醴泉涌於清室師古曰瑞水味甘如醴校獵賦上獵三靈之流下決醴泉之滋郊祀歌象載瑜云云飲榮泉言泉有光華魏醴泉文帝初郡國二言醴泉出文選魏都賦德連木理仁挺芝草皓獸育藪丹魚生沼矞雲翔龍澤馬于阜山圖其石川形其寶莫黑匪烏三趾而來儀莫赤匪狐九尾而自擾嘉穎離合以䔿䔿醴泉涌流而浩浩河洛開奧符命用出景德殿賦醴泉涌於池圃注魏志曰延康元年唐醴泉銘會要天寶三載三月六日丙子武威郡涼州奏畨禾縣嘉瑞鄉天寶山有醴泉涌出石化為瑞麵取以食改縣為天寶志同張九齡龍池頌靈泉云泌之洋洋其甘如醴清德之鑑柔道之體貞觀六年四月避暑九成宫己亥西城髙閣下有泉涌出承以石檻引為一渠清若鏡甘如醴祕書監魏徴撰醴泉銘曰雜遝景福葳𬎼繁祉雲氏龍官龜圖鳳紀日含五色烏呈三趾頌不輟工筆無停史流謙潤下潺湲皎潔蓱旨醴甘氷凝鏡徹用之日新挹之無竭道隨時泰慶與泉流我后夕惕雖休勿休人玩其華我取其實還淳反本代文以質居髙思墜持滿戒溢九成即仁夀也欲太宗以隋為戒霄册府元龜貞觀六年四月癸卯醴泉出丹殿之西命公卿以上示之因置酒於側賜帛有差七年二月醴泉湧于綿州香溪痼疾者飲之多愈十一年九月醴泉出景雲二年十月江州言神泉湧開元二十二年十月丞相奏醴泉涌三十三年五月丁卯蘭州有浪井出及醴泉滂湧大厯二年京兆尹李勉奏櫟陽縣醴泉涌出獨狐及賀表云厚德載物與坤同符以善利人如水潤下后土獻瑞靈源酌而不竭常衮賀表無源獨湧平地滂流昔唐堯至聖光武中興霈然發祥千載一覩貞觀十八年五月眉州言醴泉出雍熙潤德泉見地理祥符醴泉元年六月庚戌賜百官泰山醴泉十二月丁酉內出泰山玉女白龍王母池新醴泉賜輔臣天禧醴泉二年九月乙酉錢曖獻醴泉賦賜及第三年閏四月丁未醴泉出京師拱聖營上謂輔臣曰營卒初睹龜建真武祠今泉出其側有疾者飲之多愈甲寅命王欽若建觀名祥源十月辛卯成仁宗重建改為醴泉觀爰有神泉湧兹福地甘如飲醴美可蠲痾寶玉虞白環文選景福殿賦翔岐陽之鳴鳳納虞氏之白環注世本曰舜時西王母獻白環及佩禹赤圭東海玉圭開山圖曰禹開宛委山得赤圭如日碧圭如月長一尺二寸又曰禹逰東海得玉圭碧色長一尺二寸圓如明月以自照選注公羊疏禮説宋氏云命以赤鳥故周尚赤湯以白狼故尚白禹以玄圭故尚黑穆天子傳己未天子大朝于黃之山乃披圖視典用觀天子之珤器曰天子之寶玉果璿珠燭銀黃金之膏周瑞鼎公羊注周家以世孝天瑞之鼎以助享祭馬遰堯壇鳳銜虞册元后降祥於典午赤伏錫命於炎精蟲蠧成文魚麟吐匣丹書集於昌户緑錯薦於堯壇漢祋祤玊寶明珠郊祀志上自幸河東之明年正月鳳凰集祋祤於所集處得玉寶詳見器用類伏無忌古今注章帝元和元年明珠出館陶大如李有光耀三年明珠出豫章圍四寸八分和帝永元五年鬱林得大珠圍五寸七分禮斗威儀君乘金而王則黃銀紫玉見漢神鼎栁宗元貞符漢用大度克懷于有氓茲其為符也妄臣上引天光增以騶虞神鼎俾東之泰山石閭作大號謂之封禪晉玉册神璽元紀時有玉册見于臨安白玉麒麟神璽出于江寧其文曰長夀萬年日有重暈皆以為中興之象太興四年二月鮮卑末波奉送皇帝信璽庚戌告于太廟乃受之建武元年三月己酉丹陽江寧民虞由墾土得白麒麟璽一紐文曰長夀萬年獻晉王建興二年十月大將軍劉琨掘地得玉璽使參軍郎碩奉之歸京師義熙十二年六月左衛兵陳陽於東府前淮水中得玉璽一枚元魏延和三年三月獲玉璽一文曰皇帝璽太平真君七年四月戊子鄴城得玉璽二其一刻曰漢傳國璽晉玉鼎成帝咸康八年九月廬江春榖縣得玉鼎一枚外圍四寸見器用類宋志玉甕不汲而滿王者清廉則出唐玄圭貞觀十五年七月洪州獻玄圭後唐明宗時臨河縣得玉杯有文曰傳國寶萬歲杯唐定國寶玉寶應元年建巳月壬子楚州獻定國寶玉十有三詳見器用祥符寶珠七年三月漳州龍溪得珠圍濶三寸七分中有小珠七顆如七曜次如七曜者不可勝數守臣王冕表進曰皇猷允塞天乃效祥聖德升聞地不藏寶有感必通無脛而至熒煌外散於月華皎潔內含於星彩遐稽信史逈殊照乘之光洞究祥經弗類媚川之色珠至寶也王者德至淵泉則出文鑑宋志明月珠王者不盡介鱗之物則出漢章帝元和中郡國獻明珠禮斗威儀其政平德至淵泉則江海出明珠天禧玉印元年七月辛丑澶州卒王貴獲玉印一治平玉檢元符嘉定玉璽治平元年閏五月二日耀州獲受命寶玉檢藏龍圖閣元符元年五月戊申朔受玉璽嘉定十四年表海舊封請更印綬先朝寶璽來上闕庭明年正月御大慶殿受寶得玉印於咸陽哲廟成太平之治獻元璽於興化髙皇開再造之符玉海卷一百九十六
