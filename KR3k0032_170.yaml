body:
  text: 玉海卷一百七十宋王應麟撰宫室門闕下唐䖍化門髙祖紀十一月丙辰克京城甲子入京師封唐王以武徳殿為丞相府視事于䖍化門大極殿左唐玄武門㑹要武徳二年正月一云五年正月辛丑賜羣臣大射於玄武門在紫宸殿之北貞觀十六年九月九日又賜五品以上射於玄武門十八年二月十七日辛酉召三品以上賜宴於玄武門賜飛白書顯慶元年正月御玄武門餞葱山揔管權知節神龍三年八月二十一日改玄武門為神武制勝樓貞元五年正月十九日班宏修玄武樓八年新作玄武門實録髙祖武德元年十一月甲子宴旋師及骨咄禄於玄武門四年四月壬寅宴北討將士八年三月丁酉宴羣臣太宗貞觀十一年正月戊申宴長安父老十四年正月己酉宴羣臣及吐谷渾王十八年正月丙戌宴蕃使二月辛酉宴三品以上髙宗永徽五年四月癸巳宴羣臣並於玄武門通鑑貞觀七年正月癸巳宴三品以上及州牧蠻夷於玄武門奏七德九功舞太宗作詩見御製蠻夷十餘種自請率舞蘓世長傳髙祖授玉山屯監引見玄武門兵志貞觀十二年始置左右屯營於玄武門領以諸衛將軍中宗紀景龍三年二月己丑幸玄武門唐旌門蘓世長傳從獵涇陽大獲帝入旌門詫左右曰今日畋樂乎儀衛志太和初有司奏命將征討有大功獻俘馘樂作至御樓前陳兵仗于旌門外二十歩樂工歩行兵部尚書介胄執鉞于旌門中路前導協律郎執麾門外分導奏樂畢太常卿退樂工立於旌門外引俘馘入獻及稱賀俘囚出乃退唐京城皇城門見城類百官志門下省城門郎四人掌京城皇城宫殿諸門開闔之節武徳五年置門僕八百人番上送管鑰六典城門郎掌京城皇城宫殿諸門開闔之節奉其管鑰而出納之明徳等門為京城門朱雀等門為皇城門承天等門為宫城門嘉德等門為宫門太極等門為殿門通内等門並同上閤門開則先外而後内闔則先内而後外所以重中禁尊皇居也候其晨昏撃鼓之節而啟閉之凡皇城宫城闔門之鑰先酉而出後戍而入開門之鑰後丑而出夜盡而入京城闔門之鑰後申而出先子而入開門之鑰後子而出先卯而入若非其時而命啟閉則詣閤覆奏奉㫖合符而開闔之㑹要至德三年正月二十七日改安上門曰先天門及坊門有安字者悉改俄復舊唐立德門㑹要貞觀三年三月三日賜羣臣大射於立徳門唐弘教門崇明門又見元㑹及儲官類金液門㑹要貞觀十七年十一月二十八日皇孫生宴官寮於弘敎門東宫敬六典云在紫宸殿左孝為太子改為崇敎門長慶二年十二月册皇太子御紫宸殿故事御宣政是日備宫縣於殿廷列内仗於兩閤門内羣臣辨色序立於宣政門外俄就外廊食訖始入自月華門列位於正衙辰後一刻方入閤太子歩自崇明門以官寮翼從進至龍墀東面再拜受册乃歸崇明門幕殿羣臣退詣崇明門謁太子大和八年十月十七日皇太子與太師相見前一日開崇明門舊史大和八年十月皇太子見太師路隋於崇明門開成三年四月敕師保賓客詹事每朔望詣崇明門莊恪太子傳開成三年詔宫臣詣崇明門謁朔望太宗紀貞觀二十三年三月丁卯命皇太子聽政于金液門禮志皇太子加元服設賓次於重明門外武徳九年六月改東宫弘禮嘉徳門為重光宣明門唐司門式門籍見符節類百官志司門郎中掌門闗出入之籍顔真卿傳太宗勤勞庶政其司門式曰無門籍者有急奏令監司與仗家引對不得闗礙防壅蔽也置立仗馬二須乘者聽此其平治天下也會要景雲二年六月敕南衙北門及諸門進狀及降墨敕皆晝題時刻夜題更籌唐章武門段志玄傳與宇文士及勒兵衛章武門太宗夜遣使至二將軍所士及披戸納使志玄拒曰軍門夜不開使者示手詔曰夜不能辨比明太宗歎曰真將軍周亞夫何以加吕温賛風謐霜凝嚴扃達晨天子之使駐車軍門唐北門兵志貞觀初擇善射者百人為二番於北門長上官志乾封以後始號北門學士元萬頃傳武后諷帝召諸儒論譔禁中朝廷疑議表疏皆宻使參處以分宰相權故時謂北門學士張昌齡傳奏豫北門修撰桓彦範傳時中宗每北門起居因得謁陳秘計唐北闕實録貞觀二十年十月司空玄齡及將作大匠立徳大營北闕制顯道門觀並成唐承天門實録太宗貞觀十七年四月丙戌立太子御承天門大赦睿宗景雲元年七月己巳御承天門皇太子詣朝堂受册二年十一月戊子御承天門宴突厥玄宗開元元年九月庚辰一云己夘宴王公百僚于承天門二年六月丙寅吐蕃獻盟書御承天門樓引見六年十一月丙申謁太廟廻御承天門賜文武官有差武宗㑹昌五年正月辛亥郊御承天門大赦睿宗紀安國相王即位於承天門景雲元年六月甲辰六典承天門蓋古之外朝元正冬至燕㑹受朝則御以聽政見宫類儀衛志承天門内則左右衛挾門隊列東西廊下門外則左右驍衛挾門隊列東西廊下天子升路黄門侍郎前奏請發鑾駕動警蹕鼔傳音駕出承天門李朝隠傳遷長安令宦官干請曵去之睿宗後御承天門對百官及朝集使褒諭其能王琚傳從帝至承天樓下誅蕭岑唐安福門實録髙宗永徽三年二月甲寅上御安福門樓觀百戲乙卯謂侍臣曰昨登樓欲觀人情及風俗奢儉非為聲樂已焚鞠杜胡人窺望之情睿宗太極元年正月辛未朔御安福門宴突厥延和元年即太極元年七月庚申御安福門宴羣公卿士設太常九部樂玄宗先天元年即延和元年九月乙亥上皇御安福門賜羣公卿士射睿宗紀先天元年正月辛卯幸安福門觀酺七月己卯幸安福門觀樂二年正月望夜燃燈帝御延喜安福門縱觀㑹要先天元年九月九日御安福門賜公卿射二年三月三日太上皇御安福門觀百寮射至八日乃止列傳郭子儀自涇陽入朝御安福門待之樓上朝見及薨御安福門哭之見舊史武元衡為西川節度使憲宗御安福門慰遣之杜元頴為西川節度使長慶三年正月帝御安福門臨餞安福門在皇城西門之北唐京師九門觀又見城類髙宗紀永徽五年十月癸卯築京師羅郭起觀于九門㑹要永徽五年十一月十一日用雍州夫四萬一千人修京師羅城郭三十日畢九門各施觀明徳觀五門工部尚書閻立德為使開元十八年四月一日築京城九十日畢六典工部郎中京城左河華右隴坻前終南後九嵕南面三門中曰明德左曰啓夏右曰安化至徳三年正月改安化為達禮東面三門中曰春明北曰通化南曰延興西南三門中曰金光北曰開逺南曰延平北面無門唐肅章門蕭德言傳以經授太子髙宗立乘輿至肅章門太極殿右引見禮遇隆重由是晉府及東宫舊臣子孫並增秩賜金通典冊内命婦三品以上設冊按使次於肅章門外唐光順門實録兼本紀髙宗龍朔三年十月辛巳詔皇太子五日一至光順門在紫宸殿右監諸司奏事小事决之紀肅宗乾元三年正月丙寅外命婦朝皇后於光順門内殿代宗永㤗元年九月庚寅觀浮屠象於光順門紀穆宗元和十五年七月乙巳詔今月六日是朕載誕之辰奉迎皇太后於宫中上壽其日百寮命婦宜於光順門進名參賀朕於光順門内殿與百寮相見永為常式舊紀敬宗長慶四年二月乙巳上率羣臣詣光順門册皇太后舊紀文宗太和元年十一月甲申日南至宰臣率百僚詣光順門朝賀皇太后二年正月戊申朔百僚赴光順門起居七年正月己丑朔􅍭元朝畢百僚赴光順門賀皇太后代宗女傳嘉豐公主與普寧公主同降有司具册禮光順門韋綬傳穆宗時綬建白帝誕日先詣光順門賀皇太后然後上皇帝壽藝文志大明宫光順門外東都明福門外皆創集賢書院百官志開元十一年光順門外置麗正書院十二年東都明福門外亦置韓愈論舉選詣光順門奏狀唐章善明福門明徳門㑹要文明元年九月五日令五品以上清官日於章善明福門待制證聖元年以員半千王劇為弘文館學士與著作路敬淳分日於明德門待制傳作顯福門唐定鼎門㑹要長壽元年九月神都改造文昌臺及定鼎上東等城門修築外郭並鳯閣侍郎李昭德所制列傳李昭德武后營神都規創文昌臺及定鼎上東諸門標置華壯張柬之還襄州中宗賦詩祖道詔羣臣餞定鼎門外武攸緒神龍元年歸嵩山令京官五品以上餞於定鼎門外隠逸蕭嵩開元十四年以兵部尚書領朔方節度使既赴軍有詔供帳餞定鼎門外玄宗賦詩勞行後漢志雒陽東城門名鼎門九鼎所從入文選謝玄暉詩驅車鼎門外注帝王世紀曰成王定鼎郟鄏其南門名定鼎門蓋九鼎所從入也唐顯福門洛陽員半千傳為弘文館學士與路敬淳分日待制顯福門下唐上東門洛陽傳魏元忠神龍二年為右僕射謁告上冢詔宰相諸司長官祖道上東門賜錦袍給騎四人侍賜銀千兩張嘉正為定州刺史帝賦詩詔百官祖道上東門唐芳林門徐齊𣆀傳髙宗時為崇文館學士侍皇太子講修書于芳林門禁苑門也北唐末芳林十哲自門入舊紀中宗令學士自芳林門入集梨園實録元和三年四月甲寅御芳林門張樂㑹要元和十二年四月詔右神策軍一千築夾城自雲韶門過芳林門西至修德里以達於興福寺又置新市于芳林門南唐通化門舊紀景龍三年八月乙未傳云二年秋親送朔方揔管張仁旦於通化門外門在京城東面之北上製詩傳云賦詩祖道列傳李義琰致仕公卿以下悉祖餞通化門外時人比漢疏廣哥舒曜討李希烈帝祖通化門裴度元和十二年宣慰淮西帝御通化門臨遣李光顔長慶初將伐鎮州復還鎮忠武宰相百官班餞帝御通化門臨送李吉甫為淮南節度帝為御通化門祖道唐延喜門玄宗先天二年正月望上皇御延喜門觀樂門在皇城東門之北㑹要貞元三年一云四年十月二十五日戸部侍郎班宏奉敇修延喜樓築夾城龍紀元年二月上御延喜門受俘乾寧二年十一月上御延喜門受俘馘舊紀貞元四年二月築延喜門北複道屬於永春門復修延喜門觀通鑑宣宗大中初吐蕃大亂三年二月秦原安樂三州及石門等七闗來降以太僕卿陸躭為宣諭使詔涇原靈武鳯翔邠寧振武皆出兵應接六月涇原節度使康季榮取原州及石門驛藏木峽制勝六磐石峽六闗秋七月丁巳靈武節度使朱叔明取長樂州甲子邠寧節度使張君緒取蕭闗鳯翔節度使李玭取秦州八月乙酉改長樂州為威州河隴老㓜一本作髙年又作耆老千餘人詣闕下巳丑上御延喜門樓見之歡呼舞躍解胡服襲冠帶觀者皆呼萬歳十月西川節度使杜悰奏取維州紀云吐蕃以維州歸於有司十二月山南西道節度使鄭涯奏取扶州紀云吐蕃以扶州歸于有司五年春二月壬戌沙州刺史一本云首領張義潮來降以為沙州防禦使十月定瓜伊西甘肅蘭鄯河岷郭十州遣其兄義澤奉十一州圖籍入見於是河湟盡入于唐紀云十月義潮以瓜沙伊肅鄯甘河西蘭岷廓十一州歸於有司十一月置歸義軍以義潮為節度使十一州觀察使咸通七年二月義潮奏克西州北庭輪臺清鎮等城十月生擒論恐熱吐蕃傳僕固俊斬恐熱吐蕃自是衰絶公主傳岐陽公主下嫁帝御延喜門止主車儀衛志皇太子鹵簿太傅乘車訓導少傅乘車訓從出延喜門唐朱雀門六典隋文立制士庻不得雜居朱雀門皇城正南之内故宗廟官寺兵衛悉在焉直街自南亘北南為朱雀街唐東都城門六典東都城南面三門中曰定鼎左曰長夏右曰厚載東面三門中曰建春南曰永通北曰上東北面二門東曰安喜西曰徽安皇城在西北隅南面三門中曰端門左曰左掖門右曰右掖門東面一門曰賓耀西面二門南曰麗景北曰宣耀東城在皇城之東東宣仁南承福望宫南三門曰應天興教光政其内曰乾元門上陽宫東面