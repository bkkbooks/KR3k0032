蔡齊知制誥程琳重刪定編勅合農田勅為一書五年五月詔以祥符七年止天聖五年續降宣勅増及六千七百八十三條辛酉命宰臣吕夷簡等詳定依律分門十二卷定千二百餘條七年六月上之賜器幣進勲階九月詔下諸路閲視聴言未便者書目天聖令文三十卷時令文尚依唐制夷簡等据唐舊文斟酌衆條益以新制天聖十年行之附令勅十八卷夷簡等撰官品令之外又案勅文録制度及罪名輕簡者五百餘條依令分門附逐卷之末又有續附令勅一卷慶厯中編天聖律文音義七年四月判國子監孫奭言准詔校定律文及疏律疏與刑統不同本疏依律生文刑統參用後勅雖盡引疏義頗有增損今校為定本須依元疏為正其刑統衍文者省闕文者益以遵用舊書與刑統兼行又舊本多用俗字改從正體作律文音義一卷文義不同即加訓解詔崇文院雕印與律文並行先是四年十一月奭言諸科唯明法一科律文及疏未有印本舉人難得真本習讀詔國子監直講楊安國趙希言王珪公孫覺宋祁楊中和校勘判監孫奭馮元詳校至七年十二月畢鏤板頒行書目律令釋文一卷天聖中孫奭等撰字義不同悉有解訓李康侯著廣律判辭十一卷以廣律意胡宿繳進錢熙著措刑論律心四卷未詳撰人纂刑統綱要晁氏志唐趙綽金科易覽一卷崇文目蕭緒三卷田氏書目三緒刪析之為傅霖刑統賦二卷或人為注景祐編勅二年六月乙亥二十四日翰林學士承㫖章得象上一司一務編勅在京編勅幷目録四十四卷紀云頒一司一務及在京勅先是詔以祥符八年止明道二年宣勅命司徒昌運等與得象刪定至是上之十一月詔審刑大理别減定配隷刑名五年十月四日上刑名勅五卷慶厯編勅自景祐二年至慶厯三年又増四千七百六十五餘條八月丁酉復命官刪定戊戌宰臣殊參政昌朝提舉十月丁巳命王質曽公亮詳定七年正月己亥編勅成凡十二卷定千七百五十七條别為總例一卷目録三卷視天聖勅増五百條詳定官張方平等賜器幣慶厯之書有參詳新立之例八年四月二十八日宰臣賈昌朝樞副吳育上刪定編勅赦書徳音附令勅目録二十卷詔崇文院鏤板頒行初命陳大素等刪定張方平等詳定昌朝育提舉七年九月丁酉詔刪定一州一縣勅皇祐中并一司一路勅修定上之先是四年五月癸酉司勲郎吕紹寜請以見行編勅續降宣勅令大理檢法官依律門分十二編頒天下以便檢閲無誤出入刑名從之志續附令勅一卷續降赦書徳音三卷嘉祐禄令二年十月甲辰朔三司使張方平上新修禄令十卷名曰嘉祐禄令先是元年九月樞宻使韓琦言内外文武官俸入添支幷将校請受雖有品式上自皇太子下至羣校本俸添支則例而每遇遷徙須由有司按勘申覆至有待報嵗時不下者請命近臣就三司編定甲辰乃命知制誥吳奎等六人即三司類次為禄令至是方平上之詔頒行志嘉祐初韓琦言内外吏兵俸禄雖有等差而無著令乃命官即三司類次為禄令又以驛料名數著為驛令稽古録二年十月甲辰朔初頒禄令紹興六年九月張浚等上禄秩新書八年十月又上禄秩勅令格嘉祐驛令三年三月丙申詔三司編天下驛劵則例從樞宻韓琦之請也四年正月十二日壬寅一云正月七日三司使張方平上所編驛劵則例賜名嘉祐驛令初内外文武下至吏卒所給驛劵皆朱有定例又或多少不同遂降宻院舊例下三司掌券司㑹粹名數而纂次之并取宣勅令文專為驛券立文者附益刪改為七十四條總上中下三卷二月頒行天下八年四月十六日編定禄令所奏以諸道至在京程數分為三卷頒天下從之二書與勅令兼行漢廄律魏郵驛令唐有郵驛條式見於貞元八年門下省之奏嘉祐編勅三年八月丁未樞宻使韓琦言天下見行編修勅自慶厯四年以後距今十五年續降四千三百有餘條前後多牴牾請刪定為嘉祐勅從之壬子以宰臣富弼參政曾公亮提舉錢象先等三人詳定齊恢等六人刪定官七年四月壬午九日提舉宰臣韓琦曽公亮上刪定編勅赦書徳音附令勅總例目録三十卷琦又請詔中外言勅之得失如天聖故事取勅在刑統而行於今者附益總一千八百三十四條視慶厯初有所増減詔編勅所鏤板頒行七年四月宰臣琦等上言所修嘉祐編勅起慶厯四年冬盡嘉祐三年凡十二卷志十八卷卷大分上中下總例一卷目録五卷其元降勅但行約束不在刑名者又析為續降附令勅三卷目録一卷續赦書徳音二卷稽古録七年四月壬子行嘉祐編勅熙寜二年三月壬寅命蔡延慶孫永修嘉祐編勅嘉祐審官院編勅詳見銓選王珪以審官院皇祐一司勅至嘉祐七年以前續降勑劄一千二十三道編成條貫并總例共四百七十六條為十五卷以嘉祐審官院編勅為目熙寜三年五月以審官院為東院七年十二月編勅二卷成上之凡一百十四條治平諸司條式二年六月十四日壬寅學士提舉諸司庫務王珪等上提舉司幷三司額一作類例一百五冊及都冊二十五冊共一百三十冊志一百三十卷詔以在京諸司庫務條式為名珪等言四海貢賦漕輓以輸京師又建官寺府庫委積苑囿闗市工冶之局以謹出納雖調用繫之三司然綱領一總於提舉司與三司所部凡一百二處其額例自嘉祐七年秋許遵重修迄今三年始成書官吏之數金布之籍監臨賞罰之格工器良窳之程舟車受納之限筦榷虧贏之比轉補之資叙招收之等式皆迹舊便今芟繁之要熙寧三年十二月庚辰命宰臣安石提舉編修三司令式學士元絳三司使李肅之詳定㑹要京城諸司庫務場院坊作其七十四所隷提舉司景徳二年十月命龍圖待制戚綸宫苑使劉承珪都大提舉諸司庫務百三十餘所熙寜編勅六年八月七日提舉編勅宰臣王安石上刪定編勅赦書徳音附令勅申明勅目録共二十六卷詔編勅所鏤板自七年正月一日頒行先是詔以嘉祐四年正月以後續降宣勅刪定命劉賡等充檢詳刪定官曾布充詳定官安石提舉至是上之八年九月辛酉併令式及諸司勅式入一司勅所遂號一司勅令所熙寜諸司勅式七年三月八日宰臣安石言提舉編修三司勅式成四百卷九年九月二十五日編修令式所上諸司勅式四十卷頒行先是命官修式令至於先成閤門擡賜式一本支賜式二賞賜贈式十五問疾澆奠支賜式一御厨式三炭式二上之十年二月上諸司勅令格式十二卷是年十一月辛亥上三十卷熙寜詳定尚書刑部勅十年十二月六日壬午詳定勅令所言准送下刑部勅二卷今将所修條幷後来勅劄一處看詳其間事係别司者悉歸本司若當司以上通行者候将来修入在京通用勅已有條式者更不重載又義未安者就損益其後来聖㫖劄子批状中書頒降者悉名曰勅樞宻頒降者悉名曰宣共修成一卷分九門總六十三條乞降勅㫖以熙寜詳定刑部勅為名從之九年十二月癸未朔吳充等上詳定軍馬司勅五卷政和二年十月丙戌勅令格式成詔来年頒之在後熙寜中書禮房條例八年二月己丑編修中書條例李承之等上禮房條例十三卷并目録十九冊詔行之周官經治之成漢家决事之比中書總例元豐諸司勑式編勅二年六月辛酉二十四日一云戊午左諫議安燾等上諸司勅式上諭曰設於此而逆彼之至曰格設於此而使彼效之曰式禁其未然之謂令治其已然之謂勅修書者要當知此有典有則貽厥子孫今之格式令勅即典則也若其書全具政府總之有司守之斯無事矣六年三月十七日詔門下中書後省詳定六曹條貫給事韓忠彦同詳定名中書門下外省上謂忠彦等曰法出於道人能體道則立法足以盡事又曰著法者欲簡於立文詳於該事七年三月乙巳六日詳定重修編勅書成孫覺謂煩碎難用有一條分為四五書目元豐勅令式七十一卷七年刑部侍郎崔台符等撰元祐中劉摰等刋修元豐以約束為令刑名為勅酬賞為格熙寜勅據嘉祐舊文元豐勅用熙寜前例元豐司農勅令式二年九月甲午司農寺上十五卷詔行之元豐講筵式二年六月辛酉諫議安燾等上諸司式上閲講筵式開講罷講申中書上曰此非政事何豫中書可刋去之元豐著令元祐二年五月乙丑禮部言西南蕃泰平軍遣石蕃龍以定等来貢元豐著令西南五姓蕃毎五年許一貢詔特許之元祐編勅令格式元年三月己夘二十四日詔中丞劉摰等以元豐勅令格式幷續降條貫六千八百七十六道刋修先是摰言先王制法其意使人易避難犯至簡至直而盡天下之理二年十二月二十四日蘇頌等上勅十二卷二千四百四十條計一十七卷名件多者分為上下令二十五卷一千二十條式闕卷一百七十七條申明例各一卷赦書徳音一卷幷目録總五十六卷詔頒行一本云三年閏十二月癸夘朔詔頒元祐勅令格式頌等奉詔詳定成書表上之曰以元豐勅令格式取嘉祐熙寜編勅附令勅等講求本末合二紀所行約三書大要隨門標目用舊制也以義名篇倣唐律也簡而易從久而無敝考東都之議應劭有臣所創造之言案慶厯之書羣官有參詳新立之例今依慶厯故事注云臣等參詳新立魏律則尚書州郡著令自殊唐格則留司散頒立名亦異便於典掌不使混殽建炎明法科二年正月癸巳復置明法科嘗得解或被貢人許就試用大理少卿吳瓌請也初本朝取士之制自進士外有諸科而明法在其中熙寜中既罷諸科而獨存明法然以舊科但取記誦之學故更號新科崇寜初併其額歸進士紹興重修敕令格式元年八月四日戊辰參政張守等上紹興新勅一十二卷令五十卷格三十卷式三十卷目録十六卷申明刑統及隨勅申明三卷政和二年以後赦書徳音一十五卷及看詳六百四卷詔自二年正月一日頒行以紹興重修勅令格式為名總六百六十卷先是建炎三年四月八日詔並遵用嘉祐條法於是下勅令所将嘉祐與政和條法對修紹興元年五月二十八日先修勅十二卷至是續修上之三年九月二十七日朱勝非等上重修吏部勅令格式繫年録云紹興三年十月癸未朱勝非等上吏部七司勅令格式一百八十八卷先是吏部尚書洪擬兵部侍郎章誼同修以省記舊法及續降㫖詳定至是成書紹興在京令式十年十月戊寅七日宰臣等上重修在京通用勅十二卷令二十六卷格八卷式二卷目録七卷共四十八卷申明十二卷看詳三百六十卷詔自十一年正月朔行之名曰紹興重修在京勅命格式十二年十二月壬申十四日上六曹寺監通用勅令格式四十七卷申明六卷看詳四百十卷六曹并目録十二卷寺監并目録十卷庫務并目録七卷六曹寺監庫務通用申明并目録共二十四卷詔自十三年四月朔行之紹興太學勅令貢舉令式十三年十月六日己丑宰臣等上國子監勅令格幷目録十四卷太學勅令格式并目録十四卷武學勅令格式并目録十卷律學勅令格式并目録十卷小學令格并目録二卷申明七卷指揮一卷總為二十五卷詔自来年二月朔行之二十六年十二月癸丑上重修貢舉勅令格式共四十五卷一本云二十六年十二月癸丑右僕射万俟卨上重修貢舉勅令格式五十卷看詳法意四百八十七卷紹興常平勅格式十七年十一月刑部尚書周三畏等詳定重修常平免役勅令格式五十四卷書成丙寅宰臣上之熙寜常平勅二卷七十條分七門五年修紹興申明刑統淳熙十一年臣僚言刑統繇開寶元符間申明訂正凡九十有二條目曰申明刑統同紹興格式勅令為一書自乾道書成進表雖有遵守之文而此書印本廢而不載淳熙新書不載遵守之文而印本又廢而不存讞議之際無所据依乞仍鏤板附淳熙隨勅申明之後四年六月令國子監重鏤板頒行乾道勅令格式四年十一月二十八日詔刪修紹興建炎法令以重修勅令所為名六年八月癸丑復置勅令所乙亥進海行法六年八月二十八日虞允文言将紹興勅與嘉祐勅及建炎四年至乾道四年續㫖參酌刪修今成勅十二卷令五十卷格三十卷式三十卷目録百二十二卷存留照用㫖揮二卷會粹法令至二萬二千有竒煩複者刋踳駁者正詔以乾道重修為名自八年正月朔行之一本云六年三月癸酉詔以建炎元年至乾道四年續降刪修成書淳熙三年以乾道新書編削未盡多有牴牾詔刋修明年書成一百四十八卷淳熙條法事類條法樞要三年十月己夘通判潭州潘燾進祖宗以来因革法令并修法樞要詔遷秩四年八月三日戊子進重修勅令格式御筆圏去戸令一條捕亡令一條及無額上供賞並令刪去六年正月庚午趙雄奏士大夫罕通法律吏得舞文今若分門編次聚於一處則遇事悉見吏不能欺乃詔勅局取勅令格式申明體倣吏部七司條法總類隨事分門纂為一書七年五月二十八日成書四百二十卷為總門二十三别門四百二十以明年三月一日頒行賜名條法事類六年七月六日進一州一路酬賞法自乾道後新修之書共三千一百二十五卷淳熙吏部條法總類二年十二月二日上重修吏部格式勅令申明一千一百五冊參政茂良等撰三年三月二十九日上吏部條法總類四十卷為類六十八為門三十書目左選令格式申明三百卷修纂紹興三十年以後續㫖乾道中從吏侍周操胡沂之言也嘉泰二年詔重修七司法開禧元年書成三百二十三卷上之以淳熙二年正月一日至嘉泰四年十月續㫖增修慶元重修敕令格式條法事類二年二月丙辰復置編修勅令所遂抄録乾道五年正月至慶元二年十二月終續降㫖揮得數萬事參酌淳熙舊法五千八百條刪修為書縂七百二冊勅令格式及目録各百二十二卷申明十二卷看詳四百三十五冊㑹要云二百六十六卷書目云二百五十六卷四年九月丙申十一日上之嘉泰二年八月二十三日上慶元條法事類四百三十七卷書目云八十卷元年詔編是書嘉定吏部條法縂類六年三月四日上一百一十四冊成五十卷凡改正四百六十餘條并百司吏職補授法二百六十三冊一百三十三卷七年五月頒行近酌唐銓别薦紳之流品逺參漢律旌刀筆之勞能淳祐重修勅令格式二年二月上表云奎文大掲於華榱十一年上條法事類玉海卷六十六
