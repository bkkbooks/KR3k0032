body:
  text: 玉海卷六十六宋王應麟撰詔令律令下唐約法十二條武徳律新格律令格式律議刑法四書高祖紀隋大業十三年十一月丙辰克京城命主符郎宋公弼收圗籍約法十二條惟殺人刼盗背軍叛逆者死刑法志唐之刑書有四曰律令格式百官志刑部凡刑法之書有四曰律曰令曰格曰式令者尊卑貴賤之等數國家之制度也格者百官有司所常行之事也式者其所常守之法也凡邦國之政必從事於此三者其有所違及人之為惡而入於罪戾者一斷以律律之為書因隋之舊為十有二篇一曰名例二曰衛禁三曰職制四曰戸婚五曰廄庫六曰擅興七曰賊盗八曰鬬訟九曰詐偽十曰雜律十一曰捕亡十二曰斷獄其用刑者有五一曰笞笞之為言恥也凡過之小者捶撻以恥之漢用竹後世更以楚書曰扑作教刑是也二曰杖杖者持也可持以擊也書曰鞭作官刑是也三曰徒徒者奴也葢奴辱之周禮曰其奴男子入於罪隷任之以事置之圜土而教之量其罪之輕重有年數而捨四曰流書云流宥五刑謂不忍刑殺宥之於逺也五曰死乃古大辟之刑也隋始定笞刑五自十至五十杖刑五自六十至於百徒刑五自一年至於三年流刑三自一千里至于二千里死刑二絞斬又有請議減贖當免之法唐皆因之唐興高祖入京師約法十二條及受禪命納言劉文静等損益律令武徳二年頒新格五十三條惟吏受賕犯盗詐冒府庫物赦不原凡斷屠日及正月五月九月不行刑四年高祖躬録囚徒以人因亂冒法者衆盗非刼傷其主及征人逃亡官吏枉法皆原之已而又詔僕射裴寂等十五人更撰律令凡律五百麗以五十三條流罪三皆加千里居作三嵗至二嵗半者悉為一嵗餘無改焉藝文志武徳律十二卷又式十四卷令三十一卷尚書左僕射裴寂右僕射蕭瑀大理卿崔善為給事中王敬業舍人劉林甫顔師古王孝逹别駕靖延太常丞丁孝烏隋大理丞房軸參軍李桐客博士徐上機等十二人奉詔撰定以五十三條附新律餘無増改武徳七年上會要武徳元年六月一日通監五月壬申詔劉文靖等因隋開皇律令而損益之遂制為五十三條務從寛簡取便於時其年十一月四日頒下仍令裴寂殷開山郎楚之沈叔安崔善為等更撰定律令十二月十二日又加蕭瑀李綱丁孝烏等同撰之至七年三月二十九日成詔頒於天下四月庚子朔大略以開皇為准正五十三條凡律五百條格入於新律無所改紀武徳七年四月庚子大赦班新律令韓瑗傳父仲良武徳初與定律令建言周律其屬三千秦漢約為五百依古則繁請從寛簡以示維新於是採開皇律宜於時者定之劉林甫傳武徳初撰定律令著律議萬餘言郎餘令傳祖頴字楚之武徳時以大理卿與李綱陳叔達定律令舊史武徳元年五月壬申命相國長史裴寂等條律令六月甲戌廢隋大業律令頒新格十一月詔頒五十三條格以約法緩刑六典武徳中令裴寂殷開山等定律令其篇目一凖隋開皇之律刑名之制亦略同唯三流皆加一千里居作三年二年半二年皆為一年以此為異又除苛細五十三條通鑑武徳元年五月壬申命裴寂劉文静等修定律令六月廢隋大業律令頒新格又武徳七年夏四月庚子朔赦天下是日頒餘同志㑹典唐貞觀律留司格刑法志太宗即位詔長孫無忌房玄齡等復定舊令議絞刑之屬五千皆免死而斷右趾其後貞觀元年三月蜀王法曹參軍裴弘獻駁律令四十餘事乃詔房玄齡與弘獻等重加刪定於是除斷趾法為加役流三千里居作二年太宗嘗覽明堂針灸圗見人之五藏皆近背詔罪人無鞭背四年十一月十七日又詔死刑皆三覆奏又詔决囚雖三覆奏頃刻之間何暇思慮宜二日五奏會要五年八月二十一日紀在十二月丁亥詔京師五覆奏諸州三覆奏有肅宗上元元年復死刑三覆奏徐堅云書有五聴令三覆同州人房强以弟謀反當從坐太宗因録問為之動容曰反逆有二興師動衆一也惡言犯法二也輕重固異而鈞謂之反連坐皆死豈定法耶房玄齡等議曰禮孫為祖父尸故有蔭孫令是祖孫重而兄弟輕於是令反逆者祖孫與兄弟縁坐皆配役惡言犯法者兄弟配流而已玄齡等遂與法司増損隋律降大辟為流者九十二流為徒者七十一以為律定令一千五百四十六條以為令又刪武徳以来敕三千餘條為七百條以為格又取尚書省列曹及諸寺監十六衛計帳以為式自房玄齡等更定律令格式訖太宗世用之無所變改藝文志貞觀律十二卷又令二十七卷格十八卷留司格一卷式三十三卷中書令房玄齡右僕射長孫無忌法曹裴弘獻等奉詔選定凡律五百條令一千五百四十六條格七百條以尚書諸曹為目其常務留本司者著為留司格唐令三十篇曽鞏為目録序崇文目同通鑑貞觀十一年正月初房玄齡等先受詔定律令以為舊法兄弟異居蔭不相及而謀反連坐皆死祖孫有蔭而止應配流據禮論情深為未愜今定律祖孫與兄弟縁坐者俱配役從之自是比古死刑除其大半玄齡等定律五百條立刑名二十等比隋律減大辟凡二十條減流入徒者七十一條凡削繁去蠧變重為輕者不可勝紀又定令一千五百九十餘條又刪武徳以来敕詔格定留七百餘條至是頒行之又定枷杻鉗鎖杖笞皆有長短廣狹之制自張藴古之死法官以去罪為戒時有失入者又不加罪五月上嘗問大理卿劉徳威近日刑網稍宻何也對曰此在主上不在羣臣人主好寛則寛好急則急律文失入減三等失出減五等今失入無辜失出更獲大罪是以吏各自免競就深文陛下倘一斷以律則此風變矣上悦從之由是斷獄平允會要貞觀十一年正月十四日頒新格於天下凡律五百條分為十二卷今為三十卷二十七篇一千五百九十條格七百條以為通式崔融云貞觀律唯有十卷捕亡斷獄乃永徽二年長孫無忌等奏加舊紀貞觀十一年正月庚子頒新律令於天下舊刑法志貞觀十一年又刪武徳已来敕格三千餘件定留七百條以為格十八卷留在司施行斟酌古今除煩去弊以尚書省諸曹為之目初為七卷其曹之常務但留本司者别為留司格一卷葢編録當時敇令永為法則以為故事唐永徽律律疏留司格散頒格刑法志高宗即位詔律學之士撰律疏又詔長孫無忌等増損敕格其曹司常務曰留司格頒之天下曰散頒格龍朔儀鳯中司刑太常伯李敬玄左僕射劉仁軌相繼又加刋正長孫無忌律疏序云逺則皇王妙㫖近則蕭賈遺文縁波討源自枝窮葉邁彼三章同符畫一藝文志永徽律十二卷又式十四卷式本四卷令三十卷散頒天下格七卷留本司行格十八卷太尉無忌司空李勣左僕射于志寜張行成侍中高季輔黄門侍郎宇文節栁奭右丞段寶玄太常少卿令狐徳棻吏部侍郎高敬言刑部侍郎劉燕客給事中趙文恪中書舍人李友益少府丞張行實大府丞王文端大理丞元紹刑部郎中賈敏行奉詔撰定分格為二部以曹司常務為行格天下所共為散頒格永徽三年上至龍朔二年詔司刑太常伯源直心少常伯李敬玄司刑大夫李文禮復刪定唯改官曹局名而已題行格曰留本司格中本散頒格曰天下散行格中本律疏三十卷無忌李勣于志寜唐臨段寶玄劉燕客賈敏行等奉詔撰永徽四年上永徽留本司格後十一卷左僕射劉仁軌戴至徳張文瓘李敬玄郝處俊来恒高智周李義琰裴行儉馬載蕭徳昭裴炎李義琛張楚金盧律師等奉詔撰儀鳯二年上通監高宗永徽三年閏九月長孫無忌上所刪定律式甲戌詔頒之四方會要永徽二年閏九月十四日上新刪定律令格式内式四十卷式本曹司常務為留司格餘並同藝文志三年五月詔律學未有定疏宜廣召解律人修義疏使中書門下監定參撰律疏成三十卷無忌勣志寜唐紹段志玄劉燕客賈敏行等同撰四年十一月九日上之詔頒行天下崇文目律十二卷律疏三十卷律音義一卷閣館書目有律疏三十卷長孫無忌等撰所存止二十八卷闕斷獄二卷律十二卷無忌等修定龍朔二年二月勅源直心等重定至麟徳二年奏上之儀鳯二年三月九日又刪緝格式畢上之同修官同志按唐藝文内無李義琛舊紀永徽二年閏月辛未頒新定律令格式於天下四年十一月頒新律疏於天下六典刑部郎中凡律一十有二章自名例至斷獄大凡五百餘條焉凡令二十有七篇分為三十卷一官品二臺省三監寺職員四衛府職員五東宫王府職員六州縣職員七命婦職員八祠九戸十選舉十一考課十二宫衛十三軍防十四衣服十五儀制十六鹵簿十七公式十八田十九賦役二十倉庫二十一廄牧二十二闗市二十三醫疾二十四獄官二十五營繕二十六喪塟二十七雜令大凡一千五百四十有六條漢時决事集為令甲以下三百餘篇魏陳羣等撰州郡尚書官軍中令合百八十餘篇晉賈充撰令四十篇梁蔡法度梁令三十篇隋高熲等撰三十卷武徳中裴寂等與律同撰貞觀中房玄齡等刋定麟徳中源直心儀鳯中劉仁軌垂拱中裴居道神龍初蘇瓌太極初岑羲開元初姚元崇四年宋璟並刋定凡格二十四篇以尚書省諸曹為之目共為七卷其曹之常務留本司者别為留司格一卷漢建武律令故事三篇晉賈充故事三十卷梁科三十卷後魏麟趾殿刪定為麟趾格自貞觀格至開元後格皆以尚書二十四司為篇名葢録當時制勅永為法則凡式三十三篇亦以尚書省刑曹及祕書太常司農光禄太僕太府及監門諸衛計帳為篇目凡為二十卷周文帝大統中令有司斟酌古今通變可以益時者為二十四條後又下二十二條之制十年命尚書蘇綽總三十六條更損益為五卷謂之大統式唐永徽式十四卷垂拱神龍開元式並三十卷凡律以正刑定罪令以設範立制格以禁違正邪式以軌物程事舊制式三十三篇以尚書御史臺九寺三監諸軍為目立刑名之制五唐垂拱格式刑法志武后時内史裴居道鳯閣侍郎韋方質等又刪武徳以后至於垂拱詔勅為新格藏於有司曰垂拱留司格神龍元年中書令韋安石又續其後至於神龍為散頒格藝文志垂拱式二十卷又格十卷新格二卷散頒格二卷留司格六卷秋官尚書裴居道同三品岑長倩同平章事韋方質刪定官袁智弘咸陽尉王守慎奉詔撰加計帳勾帳二式垂拱元年上新格式武后製序刪垂拱式二十卷又散頒格七卷韋安石禮部尚書祝欽明左丞蘇瓌郎中狄光嗣等刪定神龍元年上紀垂拱元年三月辛未頒垂拱格會要垂拱元年三月二十六日刪改格式加帳及勾帳式通舊式成三十卷又以武徳以来詔勅便於時者編為新格二卷裴居道等十餘人同修則天自製序其二卷之外别編六卷堪為當司行用為垂拱留司格時韋方質詳練法理又委其事於王守慎有法理之才故垂拱格式稱為詳宻其律惟改二十四條文有不便者大抵仍舊至神龍元年六月二十七日又刪定垂拱格及格後勅左僕射唐休璟璟安石散騎李懷逺祝欽明蘇瓌郎中姜師度狄光嗣等同刪定至神龍二年正月二十五日刪制勅為散班格七卷又刪補舊式為二十卷表上之制今頒於天下文明元年四月十四日勅内外官以當司格令書聽事之壁唐太極格刑法志睿宗即位户部尚書岑羲等又著太極格藝文志太極格十卷戸部尚書同中書門下三品岑羲中書侍郎同中書門下三品陸象先右散騎常侍徐堅右司郎中唐紹刑部員外郎邵知新大理寺丞陳義海評事張名播右衛長史張處斌左衛參軍羅思貞主事閻義顓等刪定太極元年上會要景雲元年勅又令刪定格令太極元年正月二十五日奏上之名為太極格刪修人同藝文志末作閻顗唐開元前格開元後格新格格後長行勅格式律令事類格令科要刑法志開元三年黄門監盧懐慎等又著開元格至二十五年中書令李林甫又著新格凡所増益數千條明年吏部尚書宋璟又著後格以開元名書天寶四載又詔刑部尚書蕭炅稍復増損之藝文志開元前格十卷紫㣲令姚崇黄門監盧懐慎紫㣲侍郎李乂蘇頲舍人吕延祚給事中魏奉古評事高智静縣丞侯郢璡參軍閻義顓等奉詔刪定開元三年上開元後格十卷又令三十卷式二十卷中興書目有唐式二十卷侍中宋璟蘇頲左丞盧愿侍郎裴瓘慕容珣楊滔舍人劉令植司直高智静及侯郢璡等刪定開元七年上崇文目開元格十卷開成詳定格十卷格後長行勅六卷侍郎裴光庭中書令蕭嵩等刪次開元十九年上國史志裴光庭開元格令科要一卷開元新格十卷格式律令事類四十卷崇文目有之李林甫侍中牛仙客中丞王敬從及崔晃陳承信俞元杞等刪定開元二十五年上志又有裴光庭唐開元格令科要一卷崇文目同會要開元三年正月又敕刪定格式令上之名為開元格六卷刪修人内作李延祚閻顓餘同藝文志七年三月十九日修令式仍舊名曰開元後格宋璟等同修内作裴瓘餘同藝文志十九年裴光庭蕭嵩又以敕後制敇行用之後與格文相違奏令有司刪撰為格後長行敕六卷二十五年九月一日後刪緝舊格式律令中書令李林甫等六人共加刪緝總七千九十八條一千三百二十四條於事非要並刪除之三千一百八十條隨事損益三千五百九十四條仍舊不改總成律十二卷律疏三十卷式二十卷開元新格十卷又撰格式律令事類四十卷舊紀二十五年頒新定令式格事類百三十卷於天下以類相從便於省覽奉勅於尚書都省冩五十本頒于天下源光𥙿傳為中書舍人與楊滔劉令植同刪著開元新格書目十卷中興書目唐式二十卷開元七年上二十六年李林甫等刋定皇朝淳化三年校勘通典開元二十五年令則謂是年定令也在食貨門則載口分世業田之制課戸租調之制戸令則有非成丁不析之制而義倉則又是年定式也在職官則是年刋定職次著為格令唐開元格後敕元和刪定制敕元和格敕刑法志憲宗時刑部侍郎許孟容等刪天寶以後為開元格後敇藝文志元和格敕三十卷權徳輿劉伯芻等集元和刪定制敕三十卷許孟容韋貫之蔣乂栁登等集會要元和二年七月舊紀七月丙戌朔詔刑部侍郎許孟容少卿栁登郎中房式熊執易崔光員外郎韋貫之等刪定開元格後敕其月刑部奏改律卷第八為鬬競舊紀八月壬戌刑部奏改至十年十月辛丑刑部尚書權徳輿奏其元和三年准制刪定至元和五年刪定畢所奏三十卷嵗月最近望且送臣本司其五年已後敕有敕文合長行者望令諸司録送刑部臣請與本司侍郎郎官參詳錯綜隨司編入本卷續具聞奏舊紀十月庚子奏請行用新刪定敕格三十卷從之至十三年八月鳯翔節度使鄭餘慶等詳定格後敕三十卷郎中崔郾陳諷及庾敬休王長文元從質林寶同修上進其年刑部侍郎許孟容蒋乂等奉詔刪定格後敕勒成三十卷刑部侍郎劉伯芻等考定修為三十卷蒋乂傳乂與許孟容韋貫之刪正制敕三十篇為開元格後敕權徳輿傳先是詔許孟容蒋乂刋彚格敕上之留禁中徳輿請出其書侍郎劉伯芻參復研考定三十篇奏上栁登傳元和初為大理少卿與許孟容等刋正敕格唐太和格後敕刑法志文宗命尚書省郎官各刪本司敕而丞與侍郎覆視中書門下參其可否而奏之為太和格後敕藝文志太和格後敕志一作勑四十卷崇文目太和格後敕四十卷格後敕五十卷注初前大理丞謝登纂凡六十卷詔刑部詳定去其繁復太和七年上馮宿傳為刑部侍郎修格後敕三十篇行於時會要太和四年七月大理卿裴誼奏格後敕六十卷得丞謝登状斷獄取最後敕為定唐開成詳定格刑法志開成三年刑部侍郎狄兼謩採開元二十六年以後至於開成制敇刪其繁者為開成詳定格藝文志狄兼謩開成詳定格十卷後唐天成元年十月用開成格唐大中刑法總要格要敕藝文志崇文目同大中刑法總要格後敕六十卷刑部侍郎劉瑑等纂傳曰刑理統類志傳不同當考會要舊紀同大中五年四月癸夘刑部侍郎劉瑑等奉敕修大中刑法總要格後敕六十卷貞觀二年六月二十八日至大中五年四月十三日凡二百四十四年雜敕都計六百四十門二千一百六十五條議輕重名曰大中刑法統類國史志大中已後雜敕三卷唐大中刑律統類刑法志宣宗時左衛率府倉曹參軍張戣以刑律分類為門而附以格敕為大中刑律統類詔刑部頒行之藝文志張戣大中刑律統類十二卷崇文目同又有唐律令事類四十卷會要大中七年五月舊紀同張戣集律令格數條件相類者一千二百五十條分為一百二十門號曰刑法統類上之劉瑑傳大中五年遷刑部侍郎乃裒彚敕令可用者由武徳訖大中凡二千八百六十五事類而析之參訂重輕號大中刑律統類以聞法家推其詳唐詔令曰刑書統類十篇獨著元結縣令箴後唐長興四年六月詳定大中統類唐祠令會要聖厯元年奉禮郎張齊賢議曰貞觀顯慶禮及祠令無告朔之文貞元九年十二月博士韋彤議自貞觀至開元修定禮令唐吏部甲令貞觀官令開元格令見官名傳沈既濟徳宗時言選舉之敝云云夫古今選用之法九流常叙有三科而已曰徳也才也勞也吏部甲令雖曰度徳居任量能授職計勞升叙然考校之法皆在書判簿厯言辭俯仰之間安行徐言非徳也空文善書非才也累資積考非勞也陸贄諫試官按甲令有職事官有散官有勲官有爵號其賦事受奉者唯職事一官以叙才能位賢徳所謂施實利而寓虚名也勲散爵號止於服色資蔭以馭崇貴甄功勞所謂假虚名而佐實利也虚實交相養故人不瀆賞輕重互相制故國不廢權今之員外試官頗同勲散爵號奏議云命秩之載于甲令者志凡選有文武每嵗五月頒格於州縣選人應格則本屬或故任取選解唐六條太宗紀貞觀二十年正月丁丑遣使二十二人以六條黜陟於天下會要遣大理卿孫伏伽等二十一人以六條廵察唐官品志司隷臺大夫掌廵察所掌六條一察品官以上理政能二察官人貪殘害政三察豪强姦猾侵害下人及田宅踰制四察水旱蟲灾不以實言枉征賦役及無灾妄蠲免者五察部内盗賊不能窮逐隠而不申者六察徳行孝弟茂材異行而不貢者每年二月乗軺郡縣十月入奏又百官志四十八條通典隋置司隷臺唐無司隷校尉而有京畿訪採使亦其職也武后紀永昌元年正月戊午頒九條以訓百官李嶠上疏曰垂拱時諸道廵察使科條四十有四至别敇令又三十而使以三月出盡十一月奏事今所察按凖漢六條而推廣之則無不包矣烏在多張事目也唐刑法要録志盧紆十卷大理丞裴向上之會要寶厯二年十月裴向進趙仁本崔知悌法例各二卷張伾判格三卷唐學令選舉令倉庫令會要太和五年十二月祭酒裴通奏按學令史記索隠即今之學令漢書注顔師古曰功令若今選舉令金布令若今倉庫令志唐取士之科有三凡學六教人取士著於令者大略如此唐品秩令式㑹要㑹昌二年九月中丞李囘奏文武常參官據品秩令式合置引馬吕温道州律令要録序曰尚書省御史臺諸曹多書令式格律於屋壁日夕省覽目存心悟吏無以欺臨事不惑唐式苑律令手鑑志元泳式苑四卷崇文目同王行先律令手鑑二卷李崇法鍳八卷崇文目同唐水令見河渠類唐車輿衣服令見車服類唐司門式見門類唐光禄式見邊豆類唐兵部格通典按兵部格破敵戰功各有差等其授官千纔一二天寶以後邊帥怙寵便請署官易州遂成府坊州安臺府别将果毅之類每一制則同授千餘人其餘可知雖在行間僅無白身者後唐天成中下學士院作詩賦為貢舉格唐刑法二十八家藝文志史録十曰刑法二十八家六十一部一千四卷始於漢建武律令故事終於開元格後長行敕失姓名九家建武律令故事名臣奏廷尉决事駮事雜詔書南臺奏事議駮名臣奏事則漢氏之書也駁事彈事刑法律本晉令以至張斐劉邵之解論則晉氏之書也齊梁陳有宗躬蔡法度范泉等之律令而條鈔晉宋齊梁律附焉北齊周隋有趙王叡趙肅蘇綽高熲牛弘等之律令式而麟趾格附焉有唐之興始定於武徳之裴寂者五十七卷更定於貞觀之玄齡者九十一卷無忌撰於永徽源直心刪于龍朔劉仁軌著於儀鳯為卷一百二十有六裴居道撰于垂拱韋安石刪於神龍及趙崔之法例為卷七十有二岑羲刪于太極元年姚崇刪於開元三禩宋璟裴光庭刪於七年十九年為卷八十有六大凡律之外有疏例式之外有式本格有留司散頒行格格後新格敕有格長行不著録者開元新格而下有事類科要及度支長行㫖元和格敕制敕而下有太和格後敕開成詳定格大中刑法總要格後敕及刑律統類法家所著有律令手鑑式苑刑法要録判格終於李崇法鑑凡十三家三百二十三卷隋志三十五部七百十二卷自杜預律本至陳新制崇文目刑法五十一部七百十六卷景徳二年龍圗閣書目刑法三百七十卷淳熙書目自御製八行八刑條至刑統賦解六十一家定著一千五百三十七卷續目二十三家一千九百三十九卷建隆新定刑統編勅周顯徳四年五月二十四日中書門下奏朝廷所行用者律十二卷律疏三十卷式二十卷令三十卷開成格十卷大中統類十二卷後唐以来至漢末編勅三十二卷廣順元年六月侍御史盧億等以勅條二十六件編為二卷名為續編勅及制勅等律令文辭古質覽者難明格勅條目繁多閲者疑誤於是命侍御史張湜等十人訓釋刪定為大周刑統五年七月丙戌初行凡二十卷别有目録凡二十一卷與律疏令式通行國初用唐律令格式外有後唐同光刑律統類清泰編勅天福編勅周廣順類勅顯徳刑統皆參用焉建隆四年二月五日工部尚書判大理寺竇儀言周刑統科條繁浩或有未明請别加詳定乃命儀與權大理少卿蘇曉等同撰集凡削出令式宣勅一百九條増入制勅十五條又録律内餘條准此者凡四十四條附於名例之次并目録成三十卷取舊削去格令宣勅及後来續降要用者凡一百六十條為編勅四卷其釐革一司一務一州一縣之類不在焉至八月二日上之詔並模印頒行一本建隆四年七月己夘即乾徳元年十一月方改元工部尚書判大理寺竇儀進建隆重定刑統三十卷編勅四卷詔付大理寺刻板摹印頒行天下儀表云臣與大理少卿蘇曉正奚璵丞張希遜等同考詳舊二十一卷今併目録増為三十一卷舊疏議節略今悉備文字難識者音於本字之下義似難曉并例具别條者悉注引於其處有今昔􅎊異輕重難同禁約之科刑名未備臣等起請總三十二條其格令宣勅削出及後来至今續降要用者凡一百六條今别編分為四卷名曰新編勅刑統凡三十一卷二百十三門律十二篇五百二條并疏令式格勅條一百七十七起請條三十二先是建隆三年十二月鄉貢明法張自牧嘗上封事駮刑統之不便者凡五條詔下有司參議而釐正之詔儀等撰集建隆三年十二月庚午有司上捕盗條頒行之開寳元年三月庚寅増修令尉捕盗功過令頒行之端拱二年十月詔賜宰臣執政刑統各一部詔中外臣僚常讀律書天聖七年學士孫奭奉詔校定刑統作律文音義一卷天聖四年十一月辛亥詔國子監摹印律文并疏頒行稽古録建隆二年十月癸巳初定編勅二十條乾徳元年八月辛巳長編七月己夘行新定刑統是年三月癸酉始定折杖法崇文目顯徳刑統二十卷開寶刑統三十卷藝祖立奏案之法以革藩侯専戮之敝頒折杖之法以除獄官過