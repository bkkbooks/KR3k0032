body:
  text: 玉海卷一百宋王應麟撰郊祀祠宫觀附道家者流清靜沖虛歸真復朴後世説其風者觸類而長於是乎有演經鍊修之教延年祝釐之科報本通幽之訣上自后辟迄于臣民莫不鄉慕以祈效驗此宫觀之祠所以興也周齊宫周語虢文公曰王即齊宫百官御事各即其齊三日周閟宫見宫類漢夀宫郊祀志武帝元朔三年遊水發根言上郡有巫上召置祠之甘泉紀元朔四年冬行幸甘泉神君言曰強與我會甘泉於是上幸甘泉大赦置夀宫神君注臣瓉曰夀宫奉神之宫也楚辭九歌雲中君曰蹇將憺兮夀宫神君最貴者曰大一其佐曰大禁司命之屬皆從之非可得見聞其言與人音等時去時來來則風肅然居室帷中時晝言然常以夜天子祓然後入又置夀宫北宫張羽旗設共具以禮神君神君所言上使受書其名曰畫法所言無絶殊者天子心獨喜其事祕世莫知也史記太史公曰豫從入夀宫侍祠神語藝文志泰一雜甘泉夀宫歌詩十四篇括地志夀宫北宫皆在雍州長安縣西北三十里長安故城中封禪書鬼神接靈圉賔於間館上林賦靈圉燕於間館班固賦建章甘泉館御列仙漢竹宫見甘泉宫漢陽靈宫甘泉賦乃搜逑索耦臯伊之徒冦倫魁能函甘棠之惠挾東征之意相與齊呼陽靈之宫注祭天之處故曰陽靈之宫也李周翰曰陽靈宫名漢集靈宫望仙觀地理志京兆華隂縣大華山在南有祠豫州山集靈宫武帝起黃圗集靈宫集仙殿望仙臺望仙觀俱在華隂縣皆武帝宫觀名張昶華山碑世宗經集靈之宫於其下想喬松之疇是遊是憩郡國方士自逺而至充巖塞崖必雲霄之路可升蕃昌之福可致也華山廟碑武帝修封禪省五嶽立宫其下宫曰集靈殿曰存仙門曰望仙中宗之世使者持節歲一禱而三祠建武之元禮從其省但使二千石歲時往祠又見桓談仙賦序西嶽記武帝巡省五嶽禋祀豐備故立宫其下號曰集靈宫藝文類聚後漢桓君山有集靈宫賦水經注敷水北徑集靈宫漢郊宫終軍傳專神明之敬奉燔瘞於郊宫獻享之精交神積和之氣塞明注師古曰郊宫謂泰畤及后土隋天經宫志大業元年於東都固本里北起天經宫以遊髙祖衣冠四時致祭唐紫府觀詳見瑞星薛頤傳貞觀時為道士帝為築觀九嵏山號曰紫府拜太中大夫往居之唐太一觀潘師正傳髙宗詔即其廬作崇唐觀及營奉天宫受勑直逍遙谷作門曰仙遊北曰尋真時太常獻新樂帝更名祈仙望仙翹仙曲劉道合亦居嵩山帝即所隱立太一觀使居之永隆元年三月己未幸師正所居觀舊史云云别起精思院以處之太一本朝為崇福宫吳筠傳玄宗時還嵩山詔為筠立道館髙宗振其風於前明皇張其教於後關令尹傳曰尹喜結草為樓精思至道周康王聞之拜為大夫以其樓觀望故號此宅為關令草樓觀即觀之始也一云周穆王尚神仙因尹真人草樓在終南山之隂召幽逸之人尹軌杜沖謂之道士居于草樓之所號草樓觀道經有叢霄之觀明霞之館唐紫雲萬歲觀實録乾封元年正月戊辰朔有事泰山戊寅詔兖州置觀寺各三所祀日有靈鶴及山呼之瑞故也觀以紫雲仙鶴萬歲為稱寺以封巒非煙重輪為名唐開元觀通鑑開元一十九年閏四月迎玄元皇帝像置興慶宫五月命畫玄元真容分置諸州開元觀唐太清宫見宫類杜甫集朝獻太清宫賦鬱閟宫之嵂崒坼元氣以經構斷紫雲而竦墻撫流沙而承霤紛隳珠而陷碧霩波錦而浪繡今王巨唐帝之苗裔坤之紀綱土配君服宫尊臣商起數得統特立中央大樂在懸黃鍾冠八音之首太昊斯啓青陸獻千春之祥萬神開八駿回旗掩月車奮雷鶱七曜燭九垓能事穎脫清光大來金石録會昌元年三月賈島撰新修紫極宫記唐升仙宫紀天寶二年正月乙卯作升仙宫丙辰加號玄元皇帝曰大聖祖三月壬子享于混元宫唐軒遊宫國史柴通玄傳所居承天觀即唐軒遊宫有明皇詩石及書道德經二碑真宗作二韻詩賜之唐啓聖宫唐書肅宗至德二年十二月詔天柱山老君廟改為啓聖宫文粹寶厯二年新建聖祖院于大茅峰下崇玄觀之前上直華陽洞之南門賈餗為碑銘唐望仙觀紀會昌三年夏作望仙觀于禁中六典凡天下觀總一千六百八十七所王逺知傳貞觀九年詔潤州三茆山為觀俾居之璽詔曰立祠觀以伸曩懷葉法善傳先天中舍景龍觀張果傳至常山蒲吾縣或言尸解帝為立棲霞觀其所兩京記西京景龍觀景雲二年天台道士司馬承禎被召止於此觀工部侍郎李適賦詩贈焉散騎常侍徐彥伯撮其美者二十一首為之序名為白雲記傳於時開元十五年召至詔於王屋山置壇室以王屋所居為陽臺觀御書額見本傳景雲中作台州桐柏觀天寶元年三月御書碑額文粹崔尚桐柏觀頌建隆觀建隆元年十一月親征揚州二年正月以行宫為建隆觀三年三月九日丁卯四月十一日戊戌十月二日丙戌幸太清觀乾德五年六月二十四日開寶三年二月十九日再幸建隆觀又閶闔門外周世宗建太清觀建隆初重修改名建隆觀齋修率就是觀天禧四年正月十四幸建隆觀太平興國太一宫興國六年司天楚芝蘭言按太一式有五福太一天一地一直符君棊臣棊民棊四神大遊小遊凡十太一皆天之尊神也五福所在之處無兵疫人民安樂凡行五宫四十五年一移自甲申歲雍熙元年移入黃室巽宫在吳分蘇州請就其地預築宫祀之迎福貺從之九歌有東皇太一中宫天極星其一明者太一之常居年祠興于漢元光二年郊見于元鼎五六年十月甲午蘇州言太一宫成楚芝蘭又言都城東南地名蘇村可徙築宫于此以應蘇臺之名則福集帝都太宗曰太一天之貴神也所臨之方民必受福今四海一家若立廟吳中嵗時嚴奉頗成疏逺楚芝蘭傳上言京師百神所集今京城東南一舍而近有地名蘇村於此為五福太一建宫則萬乘可以親謁有司便於祗事從其議令同定本宫四時祭祀儀及醮法八年五月丁酉實録通略作丁卯遂詔有司就城南蘇村營建命東上閣門使趙鎔董其役十一月己未新宫成總千一百區凡十殿四廊圗畫三皇五帝九曜七元二十八宿五嶽等神像五百二十四命樞密直學士張齊賢與楚芝蘭共祠五福太一用祭天之禮而殺其半昏祠至明如漢祀之禮每歲四立日行祭祀命近臣攝事用幣册祝無牲祭命道士行醮禮又命廷臣內侍各一人掌之三歲一易以兵衛守九年甲申即雍熙元年三月丙子立夏致享祠官咸集甘露降祠庭八月丙申先遣學士賈黃中致祭丁酉帝親祠一本云初就幄殿若有微風動幄出朱雀門嘉氣塞路入宫慶雲環日如飛鳳龜龍之狀祭告太一詞曰夫明靈之降難可度思精意茍存必垂昭格顧惟寡昧嗣守丕基而德教未孚化源猶鬱日慎一日于兹九年茍非上帝垂休明靈降鑒則安得民庶和樂豐穰荐臻荷此殊休實由玄貺惟神功施造化道貫幽明握上帝之靈符作羣生之司命頃者觀臺效職保章獻言以為躔次所經將蒞斗牛之分永惟靈馭下屬句吳且欲伸蠲潔之誠豈復以封域為限載營間館卜此近郊庶苾芬之儀親承祀事飈歘之駕時覿神光納九有於胥庭躋蒼生於富夀但以正辭而陳信敢言祕貺以求恩淳化四年三月己丑朔司天言按太一式來嵗太一君棊臣棊皆臨宋分至乙未歲民棊亦至三棊皆天之大福神主邦國乂寧五穀豐稔逺夷內附之應祥符二年三月甲子三年十一月己亥親謁庚子王欽若上親祠太一宫七言十韻詩上和而賜之至天僖元年十一月二十一日乙卯凡六臨幸或祈或謝天聖二年九月辛卯祠太平興國靈仙觀七年六月初舒州懷寧僧過民柯蕚家詣萬歲山以杖於古松下得黝石上刻志公記云趙號云云蕚以石刻來獻於是詔舒州修司命真君祠內臣綦政敏董役總成六百三十區號靈仙觀祥符三年閏二月戊午遣官葺之五年閏十月丁丑名石曰神告帝統石作詩紀其符應又作贊興國鳳翔上清太平宫國初有神降于盩厔民張守真家守真為道士即所居創北帝宫太宗嗣位真君降言有忠孝加福愛民治國之語詔於終南山下築宫凡二年宫成宫中有通明殿題曰上清太平宫如真君預言祀神之夕上望拜興國六年十一月壬戌封神為翊聖將軍祥符七年加號翊聖保德真君凡真君所降語帝命王欽若編為三卷九年十月己卯上之上作序名曰真君傳五季之亂實開國祚有神降于岐用蕩彼妖孽佑我社稷實無疆惟休故於其地為上清宫咸平三年八月置殿奉太宗聖容天聖二年六月建殿奉真宗聖容皇帝文德殿酌獻蘇軾上清宫辭有妖兮虛下土精為星兮氣如虹銜帝命以下討建千仭之修鋒澤充塞於四海獨淡然其無功默清淨以無為時節狩於牛魁詣通明而黜陟光下燭於九陔五嶽為豆四溟為杯淳化亳州太清宫祥符奉元宫明道宫聖製碑亳州瀨鄉老子宅唐天寶為太清宫淳化四年修至道六年八月功畢祥符六年七月丁巳宰臣王旦等請詔蹕近畿鳴鑾景亳天老練曰太僕戒徒展禮奉祠為民祈福八月庚申朔詔來年春詣太清宫行朝謁之禮先於東京置壇回日恭謝天地詔曰顧譙都之舊壤峙曲里之珍祠炎漢庇民薦芳馨而祗肅有唐繼孝奉寶綬而尊崇而於辛酉命趙安仁等定儀注庚午制奉上真元皇帝號曰太上老君混元上德皇帝戊寅詔奠獻用蒼璧辛巳詔備三獻九月癸丑丁謂等言寶册用玉匱金繩十一月甲午賜真源縣行宫名曰奉元殿曰迎禧後亭曰觀妙七年正月壬寅上乘輦發京師丙午至奉元宫慶雲五色七鶴翔殿上是夕上齋于迎禧殿作奉元宫致齋五七言詩近臣畢和戊申服通天絳袍於迎禧殿庭奉老君加號册寶册文曰聖母發祥於夢日宣尼興歎於猶龍己酉奉天書升殿服衮冕行朝謁之禮復詣先天觀元始殿廣靈宫玉皇殿洞霄宫先天太后殿焚香再拜復至太清宫覽靈井瑞檜轉仗奉元宫下制赦亳州升為集慶軍改奉元宫曰明道宫奉安玉皇像庚戌次亳州州城之西設朝真回蹕樓迎車駕上駐輦觀樂上作恭謁禮畢仰觀祥瑞歌辛亥作朝謁禮畢瑞應歌賜近臣壬子童子李淑奏頌以述盛禮召對便殿試詩賜出身改亳州城西門曰朝真北門曰均禧門樓曰奉元均慶二月辛酉上至自亳州甲子作奉祀禮畢還京歌賜近臣三月丁酉丁謂等請以奉祀緣路聖製刻石分立于太清明道二宫洎亳州南京從之八月丁丑對輔臣於景福殿內出聖製朝謁太清宫南京頌明道宫碑聖祖殿銘先天太后古老君真武髙辛伊尹微子留侯雙廟贊示之九年三月庚午明道宫成總四百八十區八年四月甲子命王旦撰明道宫記向敏中撰太清宫頌李迪為觀妙亭記之純貺大朝景亳兼武陽之上儀迎年執期格帝鴻七年十月甲子亳州言甘露降太清洞霄宫檜柏九年五月癸丑王旦上明道宫記詔褒答唐李嗣真傳調露中章懷太子作寶慶曲閲於太清觀舊唐書天寶二年九月辛酉譙郡紫微宫改為太清宫至道上清宫元祐上清儲祥宫上清宫在朝陽門內端拱元年二月太宗取晉邸太祖所賜金帛建宫為民祈福命楊繼宏主其役至道元年正月丙辰宫成總千二百四十二區御書額金填字賜之車駕臨幸咸平五年二月二十三日至天禧三年四月七日凡十二臨幸慶厯三年十一月丙寅火元豐二年二月始命道士王太初居宫之故地稍修復祠宇日者言宫之所在為國家子孫之祥乃賜名上清儲祥刻玉印賜太初元祐四年春宣仁后重建六年秋成為大殿三小殿九鍾經樓二石壇一建齋殿於東築道館於西凡七百餘間六月詔蘇軾撰碑銘曰作宫千柱人初不知八月名門曰景霄殿曰紫極蕃釐九月十九日幸明道二年三月丁亥祈雨上清宫政和初作上清寶籙宫西京亦有