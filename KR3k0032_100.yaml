若谷始治平四年九月富弼為集禧觀使後王安石蘇頌祥符景靈宫頌元豐原廟御書十一殿祥符五年閏十月戊寅詔兖州曲阜縣為仙源縣夀丘建道宫奉聖祖以景靈為名建道觀奉聖祖母以太極為名先是十月戊午對輔臣于滋福殿上曰二十四日聖祖臨降于延恩殿十二日戊辰實録同月稽古録作十二戊子詔曰仙源啓祚鴻應非常爰經始於密都俾詢求於吉壤聿申嚴奉式煥宏規惟文考在潛之居乃沖人載誕之地據神明之奧處京邑之中諒氣象之殊尤宜真靈之降祐永惟欽翼庶保龎祺宜以錫慶院建景靈宫先是以聖祖降臨命丁謂等度地建宫及令禮官考制度以聞是月丁謂言司天少監王熙元等狀按晉天文志張南有天廟十四星乃帝王祖宗之廟也今大內法太微天廟星在太微南宜於大內東南巳丙位建新宫以合天廟之制仍請以錫慶院開封府建置故有是命丁謂為修宫使六年闕詳到景靈宫畫圗請自今後每嵗孟享闕天地社稷同奏告即於北宫行禮從之闕宫地隘狹欲展入恭孝太子魏王二院增建殿宇齋宫從之七年八月甲寅朔宰臣向敏中為景靈宫使甲子命參政丁謂為修宫使擢三司林特為副使藍繼宗為都監約唐太清宫制度十一月辛卯朝宗操上慶成歌八年十二月真宗詣景靈觀上梁一云八年正月丁酉興工是歲七月丙辰詔王欽若討閲道藏得趙氏神仙四十人事迹分畫廊廡九年四月丙戌向敏中請御製景靈宫贊頌御書刻石五月丙辰宫成羣臣詣崇德殿賀一云祥符九年集賢校理晏殊獻景靈宫會靈觀二賦上嘉之五月戊午特命遷秩凡七百二十六區南開三門二重正殿曰天興五年作琢玉石為聖祖像閣曰保寧閣以奉元天后殿前東西門曰左右正元車路門曰昌福承禧殿曰明福宫東門曰普通丙寅謁景靈宫天禧元年正月丙辰謁景靈宫二月以宫成賜酺壬申御正陽門觀酺大合樂上作景靈宫成賜酺七言詩賜從臣天聖元年三月詔修景靈宫萬夀殿奉安真宗神御以奉真為名二年三月成十一月乙未朝饗玉清昭應景靈宫丙申饗太廟丁酉祀天地于圜丘五年七月庚申命學士承旨劉子儀撰景靈宫頌七年七月乙酉罷宫觀使明道二年景靈宫又建廣孝殿治平元年九月詔名齋殿曰迎釐宫西門曰廣祐元豐三年九月己卯薦享乙酉詔景靈宫作十一殿以時祭之禮祀祖宗五年九月二十七日乙巳御崇政殿召宰輔侍從以上觀十一殿御書榜十一月辛巳四日百官班于集英殿門帝詣蘂珠凝華等殿行告遷之禮壬午奉安神御于十一殿癸未朝獻六年正月九日詔四孟月詣宫朝獻四月四日行朝獻禮十一月南郊甲辰行朝獻之禮如太廟儀宫成羣臣獻歌頌者十數獨馬希孟之文可觀六年三月辛巳除太學博士七年四月十七日丙戌景靈宫言芝草六生於天元殿景靈門中壬辰朝獻至天元殿觀芝草元祐元年九月己未朝饗景靈宫辛酉大饗明堂以神宗配始大中祥符以奉祠聖祖逮天聖初乃易其旁之萬壽殿曰奉真以為真宗館御之所治平建仁宗之殿曰孝嚴熙寧建英宗之殿曰英德而宣祖藝祖太宗之殿曰慶基曰開先曰永隆母后之殿曰隆福重徽章德廣孝皆寓於佛老之祠布在都邑與夫郊野之外凡七十年神御在宫者四其它寓諸寺觀者十一所神宗元豐五年乃詔有司度宫之東而建六殿為原廟奉祖宗像設以昭穆之次列之左右又為别殿五於其北以奉母后凡十一殿宣祖曰天元藝祖曰皇武大宗曰大定真宗曰熙文仁宗曰美成英宗曰治隆昭憲后曰太始孝明后曰儷極懿德明德元德后曰輝德章穆章獻章懿后曰衍慶慈聖后曰繼仁元祐九年作徽音殿奉宣仁后紹聖二年作顯承殿奉神宗元符三年作西宫以顯承為館御之首易名大明又作坤元殿奉欽聖欽成欽慈后重光殿以奉哲宗政和四年作柔儀殿以奉昭懷后中興後昭慈殿名同於是兩宫合為前殿九後殿八山殿十六閣一鍾樓一碑樓四經閣一齋殿三神厨二道院一凡二千三百二十區纍朝執政節度使以上並圖形於兩廡宋祁景靈宫頌漢纂堯後立唐山之祀而文獻不足李出柱下尊瀨鄉之宇而獨恭不優王子韶六聖原廟賦云覽洛邑清廟之詩參魯頌閟宫之事原廟之作古矣而議者祖叔孫通非也周邦彥汴都賦會聖之宫是為原廟其制則般輸所作其材則匠石所掄赫赫大宇有若山踊而嶙峋蘂珠廣寒黃帝之宫榮光休氣籠曨往來蔥鬱而氤氲軒廡所繪功臣碩輔書太常而銘鼎彛者環列而趨造龍章鳳姿瑰形偉貌文有伊周武有方召其殿則有天元太始皇武儷極大定輝德熙文衍慶美成繼仁治隆之名十一殿名重瞳隆準天日炳明皇帝步送百僚拜迎九卿三公挾輈扶衡神既安止於是山罍房俎犧尊竹篚踐列於兩楹瞽叟陳辭宰祝行牲登降祼獻百禮具成祥符兖州景靈宫太極觀五年閏十月戊寅兖州夀丘建道宫奉聖祖名曰景靈道觀奉聖祖母名曰太極九年四月己亥御書額賜王旦等七言詩五月丙辰十三日宫成總千三百二十區羣臣稱賀丁巳行告成之禮向敏中為慶成使制曰式瞻感電之區仍啓明霞之館天禧二年五月戊寅宫之昭慶殿生金芝祥符延祥觀六年八月戊子詔泗州新造觀名延祥發願文閣名敷文七年十一月辛卯修觀畢功咸平元年賜忠州仙都宫太宗御書一百二十卷景德元年賜名景德觀慶厯六年四月己未以延寧觀為延寧宫祥符南京鴻慶宫三聖殿七年正月乙卯車駕次應天府丙辰升為南京詔曰睢陽奧壤藝祖舊邦膺命厯以天飛創基圖而日盛朕將躬朝渦水茂集蕃釐旋幸平臺緬懷積德想清都之錫類慶洪緒之無疆奉真像以顒昂建靈宫於曲密洪惟三聖敷佑萬方故當陪仙御於福廷儼宸儀於恭館南京新修聖祖殿宜號曰鴻慶宫仍奉安太祖太宗像八月丁丑遣都知閻承翰等奉像至歸德殿後正位權安天聖元年二月修神御殿成丁巳詔迎太祖太宗聖像奉安四年十月丙申又奉安真宗御容康定元年六月火慶厯六年十二月詔重修三聖御容殿七年六月辛亥命翰林學士張方平為禮儀使南京七月癸未奉安三聖御容于鴻慶宫以南京太祖始基故也仁宗時令內侍王崇修殿劉攽作鴻慶宫三聖殿賦曰伯益始掌火而底績而宋以火帝興于火墟天之報施昭昭可推天禧祥源觀至和醴泉觀天禧二年戊午閏四月丁未有泉湧于拱聖營真武廟甲寅即其地建祥源觀八月一日幸十月辛卯成凡三殿北崇真東聖藻西靈淵總六百十三區至和元年四月辛丑火重修二年十二月壬子成名曰醴泉殿更名為感通寧聖涵清靈遊鴻祐崇貺改元祐元年三月十四日慈夀殿為夀輝殿天聖二年八月庚午明道二年十二月八日幸祥源觀慶厯五年二月辛亥祈雨祥源觀治平元年四月甲午祈雨醴泉觀熙寧四年九月丁未幸醴泉觀祥源觀使乾興元年七月錢惟演為之天聖七年七月宰臣夷簡等請罷宫觀使詔可皇祐元年四月乙酉賈昌朝為祥源觀使元祐八年六月資政梁燾為同醴泉觀使使非宰相不除故置此名天禧崇福宫在嵩山下古太一觀也天禧三年重建五月己巳賜名太一殿曰祈真三尊殿曰會元又有保祥殿奉真宗像大觀元年詔洛師侈宫楹而大之三年三月成御製記天聖西太一宫天聖六年戊辰三月司天言雍熙甲申及今四十五年太一行次入蜀郡之坤宫曰黃庭宫戊辰歲五福自黃室趨蜀分宜於國城西南别建宫壬戌詔於順天門外八角鎮後建西太一宫奉安十神九月辛丑成中三門曰顯真大殿曰黃庭後殿曰寧禧東西殿曰延貺資佑齋殿曰清修癸卯十二日臨幸祠十一月甲寅宰臣張士遜為奉安使丁巳以黃麾杖自禁中迎神像奉安命學士宋綬為之記十二月癸亥九年九月癸亥臨幸慶厯三年三月親謁禱雨四月往謝恐即是七年之事紀亦不載還幸别院賜名洞華觀七年三月辛丑幸禱雨却蓋不御及還而雨四月丁未往謝壬子御正殿復常膳嘉祐七年三月乙丑祈雨庚午謝雨宋祁作太一新宫頌天聖西京會聖宫八年庚申歲正月辛巳詔內臣張懷恩於永安縣訾王山上建三聖宫漢原廟之制九年二月宫成甲辰以為會聖宫三月甲寅奉安三聖御容改訾王山為鳳臺山會要䦌十一月十五日宫成遣三司使晏殊迎三聖畫像奉安留守推官歐陽修采西人望幸之意作頌序曰陛下即位十年因陵園起宫室以望神遊土木之功嚴而不華地爽而潔宇敞而邃神靈杳冥如來如宅非天子臨幸不能來三后之靈頌曰殿兮耽耽黼帷襜襜天威可瞻庭兮殖殖鉤盾虎戟容衛以飭太祖維祖太宗維弟真宗維子聖兮在天風馬雲車其來仙仙聖會于此靈威神馭其風肅然熙寧二年五月二十二日丁亥奉安仁英御容景祐廣聖宫天聖二年建長寧宫以奉三清玉皇像後安真宗御容於宫之降真閣景祐二年正月己酉改今名宫在禁中古宫城之西北隅景祐延寧觀三年七月己卯新作延寧觀本王中正舊第在保康門內保慶太后於其地而建之嘉祐崇先觀先是上清宫火夀星殿獨存遂建為夀星觀命起永崇殿嘉祐六年十一月成七年八月丁亥奉安真宗御容帝親酌獻九月戊辰詔改觀名會要六年十月癸亥以夀星觀真宗神御殿為永崇殿祀司馬光等諫以為豐于昵熙寧中太一宫政和北太一宫詳見宫類熙寧四年十月司天冬官正周琮言據太一經推算得熙寧七年甲寅歲太一陽九百六之數至是年復元之初故經言太歲有陽九之災太一有百六之厄皆在入元之終或元之初主有災厄然而陽九百六當癸丑甲寅之歲為災厄之會緣却得五福太一移入中都行臨真室可以消異為祥竊詳五福太一自國朝雍熙元年甲申歲入東南巽宫故修東太一宫于蘇村天聖七年己巳歲五福太一入西南坤位故修西太一宫于八角鎮伏望詳稽故事崇建宫宇迎五福太一于京師上省其奏十一月丁亥乃詔將作匠於集禧觀東相視建宫六年癸丑春宫成會要四月十七日成凡七殿上親製名以十月二十五日迎奉太一神像熙寧四年司天監言五福太一之神以七年閼逢攝提格之歲行臨中宫其名為真室其分為京師之野其祥為民康物阜太平之應請立祠詔將作監即國之南而建宫焉經始於四年十一月丁亥之冬而成於六年之春凡為三門七殿分祠太一與天一之神而五福居中上為製名皆以承神之休為義而真室之殿又於廊廡四壁圖百神之朝天至於五帝日月星辰地至於五嶽四瀆莫不咸在其位號尊卑服物同異與夫壇場之制禱祠之儀皆以太一之學為本而參用道家之説焉天子命有司具儀仗將以今年冬至奉安神像於其宫太一星在紫宫太一之南以為天帝神主使十六相知其休咎所在之國北辰第二星最赤明者乃其座也漢志謂中宫天極其一明者太一之常居晉志謂北極第二星明赤者是太一之座而三台為天階太一躡之以上下而五福之神凡四十五年一徙宫歷中宫四維大約二百二十五年而一周在太平興國時臨黃室宫其分野為吳越而太宗立祠於東南蘇村東太一宫是也在天聖時臨黃庭宫其分野為梁蜀而仁宗始立廟於西南郊宜秋門外八角鎮西太一宫是也自天聖五年至熙寧五年壬子四十五年五福太一行棊自黃庭宫移入真室之中下移京都後神宗立中太一宫於五嶽觀之舊址殿名膺慶承釐與歲德民棊相直政和八年即重和元年時未改元著雍閹茂之歲太一臨乾維建北太一宫於龍德宫後龍潛舊邸也直都城之西北隅照臨之方也前殿曰黃祕次曰統元神貺殿門曰黃祕之門東設祕殿奉神霄仲冬上辛蕆事詳見宫類元絳詩揭題霏睿筆移御練剛辰卜用張衡舊方從薄忌新九歌鐃吹合萬騎羽旄陳美光騰沛裔卿靄動輪囷甘泉宫殿函黃瑞中極星辰動紫微中太一宫使元祐六年正月馮京以觀文侍讀為中太一宫使非前宰相除使自京始熙寧表忠觀蘇軾作碑元符景靈西宫元符三年徽宗即位八月建景靈西宫度馳道之西東直大定奉神宗於顯承殿為館御之首建哲宗神御殿於西以東偏為齋殿從韓忠彥之言也靖國元年九月改顯承殿為大明北有殿曰欽儀以奉母后西則為重光殿以奉哲廟後又改欽儀為坤元崇寧元年四月十二日御製御書景靈西宫讃二十一日宰臣進頌凡為屋六百四十區經始於元符三年十月甲子不踰歲而成涓日遷奉親祠永為不祧之廟宣和顯烈宫大觀元年九月七日詔藝祖創業自陳橋其地今為傳舍可即建觀賜名顯烈宣和六年三月二十一日成凡二百三十二間命李邴撰記紹興景靈宫紹興十年六月髙世則為景靈宫使判溫州奉神御十三年二月乙酉建宫新莊橋之西以劉光世賜第為之築三殿聖祖居前宣祖至徽宗居中昭憲而下二十一后居後五月七日進圗七月癸酉一云己未太常定四孟酌獻儀九月乙未奉安列聖神御庚子行欵謁禮十一月戊午朝獻己未親享太廟庚申祀圜丘十二月甲午恭謝乙未再詣十八年五月十六日建景靈宫道院於太一宫齋殿後地二十一年九月丁未增築用韓世忠賜第為之前殿五楹中殿七楹後殿十七楹齋殿進食殿皆備期年而畢崇禋館道院在宫之南百掌宫內侍七人道士十人吏卒二七十六人承元殿徽順承顯恭顯肅顯仁端慶欽纘德仁懷皇德髙章順憲節憲聖系隆孝嗣徽成穆恭肅美明光光順慈懿垂光寧體德恭淑恭聖章熙理宗紹興太一宫瓊音樓十七年十月十三日癸卯禮官討論太一典故詔修建太一宫先是權宜奉祀於錢湖門外惠照僧舍二十八日進呈地圗上曰建宫以昭事神之意不可崇飾華侈宫在新莊橋之南十一月十四日有司請就宫建本命殿祝聖夀一云壬辰建宫一云十二月癸卯十八年二月宫成總一百七十四區一云一百七十楹凡六殿二室兩廊殿門曰崇真大殿曰靈休挾殿曰瓊章寶室本命殿曰介福崇禧隆興元年二月十四日建本命殿名崇禧並御書三清殿曰金闕寥陽火德殿曰明離齋殿曰齋明皆御書兩廡畫三皇五帝十一曜至里域真官像一百九十五祀以四立日十九日奉安三十一日行親謁之禮一云三月庚辰初詣太一宫十神曰五福君棊大遊小遊天一地一四神臣棊民棊直符三月辛巳許士民焚薌十九年十二月十六日甲子恭謝乾道八年三月九日以舊齋殿建北斗殿淳熙十年十月七日御書藏額曰瓊章寶藏十三年五月九日御書瓊音之樓賜道館崇真館道院在宫之南嘉定初日官奏太一臨吳分有司請舉舊典上止命近臣以冬至祭告而不改作宫宇肇建太一尊有卜神亳忌啓奉祠之方天官著常居之記藜杖流光鏠旗斂影本命殿介福髙崇禧孝崇福光順慶寧垂慶恭聖仁烈后延禧理改嘉熙元年膺慶紹興延祥觀乾道天申萬夀宫在西湖孤山舊名四聖堂紹興十四年六月慈寧殿用工興建以奉四聖真君十五年十二月奉安神像二十年四月一日賜名延祥乾道三年五月二十三日詔台州天台赤城山玉京觀改為天申萬夀宫其後詔别擇勝地以常州宜興洞靈觀改焉紹興萬夀觀七年趙鼎除萬夀觀使兼侍讀十七年建萬夀觀於新莊橋之西以奉皇帝本命星官二十六年六月丁亥始建本命殿依在京名曰純福三十二年八月創晨華館道院於東祈年立秦望仙表漢紹興顯應觀髙宗北使至磁而還孝皇母夢崔府君擁一羊遂生紹興十八年建顯應觀於臨安城南包家山一云龍山以奉磁州崔府君二十二年十一月詔徙於靈芝寺之右一云二十四年神羊告符絳輝貫室紹興寧夀觀臨安七寶山三茅堂有徽宗御畫茅君像紹興二十年一云十六年六月二十七日賜名寧夀觀紹興旌忠觀元年十月宣撫使張浚奏吳玠出兵陜西祈三聖顯應乞於鳳翔府和尚原立旌忠廟三年張浚等於臨安立廟十九年改賜觀額三十二年八月二十二日徙于覺苑寺故基江州廬山有太平興國宫建殿奉髙皇本命紹興二十八年十二月丁亥朔賜名申福殿台州崇道觀白雲庵乾道四年五月二十六日賜名白雲昌壽觀其後建本命殿賜名洪慶殿淳熙璇璣觀淳熙二年太一宫創璇璣觀以奉北斗十二月二十六日鑄印維北有斗象垂太微運平四時斟酌元氣斗有環域天之三辰淳熙佑聖觀三年以舊邸建佑聖觀十二月成壁間有上所題杜詩十四字六年二月己丑臨幸御講堂乃潛邸講讀之地皇太子從寶祐西太一宫寶祐元年十一月十七日壬辰奉安殿曰黃庭門曰景福二年九月詔以十月三日詣宫黃庭殿行欵謁禮為國祈祥禮文務從簡約二十六日詔别擇日逆釐三神增宫嵾差大厦雲富重階波馳延喬松於東序詔韓岐於西廂仙都殊庭清穆敞間列仙之儒偓佺之倫迎神頌祇於其側璇題金鋪乘飈駕歘出日入月控鶴轡龍瑤英翠氣曼衍豐融閟宇崇崇神應豐融金榜瑶壇羽節凌風珠珮珊珊碧樓三襲上接虹霓絳闕九成下交星雨跨億齡而超萬祀金碧琅琳之居祈年立秦望仙表漢賓友松喬玉霄琳房鑣宫授籙豐户收祥運璿極而正乾坤坐開陽而調風雨披道接靈之府含華藴粹之仙山棲白鶴關度青牛經之殖殖成之翼翼綴日月以為光籠雲霞以為色閟靈篇於綺閣儼晬像於琳房法紫宙之宏規作宫千柱人初不知於皇祖宗在帝左右風馬雲車從帝來狩棟宇膠葛薨桷飛鶱棲金浮翠蔚跂嵽嵲逺而望之祥煙佳氣若與慶霄連接上下庶工雲集不日而成棟宇輪奐金碧神麗雕珉盤礎鏤檀竦楶碧瓦鱗差瑶階肪截閣凝瑞霧樓橫祥霓百神守護諸真班列鳳歌諧律鶴舞會節宫成之日民大和會鼓舞謳歌聲聞于天大地喜答神祇來格祝史無求福祿自至時萬時億永作神主繡黼周張神光睟穆星伯振鷺仙翁立鵠昌明侍几眉連捧纛靈飊聖日瑶宫碧簡絢采垂文金繩玉簡龍駕霓裳睟容端章黼坐儼赫金史玉童拱立擎侍如乘飊風羽輪覿紫皇于瓊宫金篆玉扄銀宫瑶殿王喬飛舄神女窺窗星柱雲楣崑山之玉樓蒼海之銀宫澤被翔泳慶溢煙霄宅彌萬里厮征伯僑而役羡門祝融警而蹕御貫列缺之倒景象泰一之威神㨖北極之嶟嶟列宿施於上榮炕浮柱之飛榱礝磩承陛琅玕綷檻坤靈贔屭以負砌天祇儼雅而翔戶崆洞之請瑶池之燕以清靜源治化以仁夀域生靈像設崇嚴殿宇沈邃梅梁桂棟曲檻叢楹煙霞舒卷風露凄清仙官就位羽客來庭流霞之庭明霞之宅玉笈雲囊之術龍緘鳯藴之圖幸集靈之宫遊祈年之館福庭霞煥仙徒霧聚傳赤字於東華受青符於南極法大壯之上棟憲斯干之南戶祕殿則崔嵬博敞鬱律鴻紛翠虯齊首以負棟海鴟疐尾而銜瓦玉舄重荷文琉四注陽宗倒光以納景隂祗蒙霧而扶傾犀塵不遊螟風無隧乃有皇邸五色黼帷九張為之真寢乃有雲梢三素緑輿八景儲乎仙衛其左右則飛宇回帶修廊班屬雲楶百層芝栭萬狀藻扄連觀抗為重門植松隱桂表其馳道揭示篆銀之榜列坐鑄鐐之狄九層之臺五城之樓榮暴偓佺袂把浮丘水土和氣之實玉帛二精之虔沚毛紛旅泂潦淳溉仙漿揖斗香雲薄霄像以鸞輅龍駒器以扣金華蓋瑞祝發中而臨遣使者持節以侍祠靈璈絳幡導乎謁欵則盥而不薦稽大易之象坐工合樂陪乎夜誦則昏祠至明采甘泉之制髙真並享卒福如儀飛龍秋遊以格思肹蠁興作而歸福敞集靈之庭扢壇奠斚蘂笈真籍按循醮式草樓上士奉承薰濯沃酒茅以示潔默牲鑾而撒腥鎮神華以作固舉禆海而蒙祉鼓舞至妙神合無垠以億上帝庇生民可以震珍見怪者罔不祈可以蒙嘉獲豐者罔不序蒼水前戒紫宙博臨瑜然象載之美飄如風馬之下嘉夜四馥順拜睟清之容流霞載㪺躬聞聲臭之載宛延鴻紛上軼倒景靚深神麗仰法太微采詩供神夜之誦持節候神人之來惟清靜之庭以觀其妙不攜二之爽以為之宗蠲蒸上神申固百祿倚雲築而流睿唱泚壺墨而霏仙翰扢神壝謹馨粢度九筵之堂枚枚有侐瞻八景之馭飄飄下臻聨壓神臯之奧區震顯舊邦之新命絶瑞日昭繁祺山擁道蔭孔彰飈遊下翔仰觀星定大度瑰宫炳丹激射飛仙圖寫遽軒拖虹回阿舞馬壇罽周張瓊糜迪嘗雲旄芬植羆案凝鏘媧天鏤石奎畫摹星歘若經閬風而歷琳房飄如排吉雲而挹丹露白霓擁蓋青虬夾轂玉版彭觥西龜定籙東華校名珠巾琳几明霞之館羽景之堂玉海卷一百
