body:
  text: 玉海卷八十二宋王應麟撰車服冕服漢永平旒冕衣裳玉佩絇屨漢冕冠平冕龍衮紀永平二年正月辛未宗祀光武於明堂帝及公卿列侯始服冠冕衣裳玉佩絇屨以行事詳見車服制度注漢官儀曰天子公卿特進諸侯祀天地明堂皆冠平冕三禮圗冕以三十升布漆而為之廣八寸長尺六寸前下後髙有俯伏之形董巴輿服志顯宗初服冕衣裳以祀天地衣裳以玄上纁下徐廣輿服注漢明帝案古禮備其服章天子郊廟衣皂上絳下前三幅後四幅衣畫而裳繡禮記曰古者君子必佩玉天子佩白玉公侯佩山玄玉大夫佩水蒼玉世子佩瑜玉周禮屨人掌王赤舄青絇鄭玄注云赤舄為上冕服之舄也絇屨鼻頭以青綵飾之絇音劬三禮圗曰屨復下曰舄其色各隨裳色東京賦整法服正冕帶珩紞綖玉笄綦會火龍黻藻繂鞶厲制徐廣車服儀制曰戰國以韍非兵飾去之漢明帝復韍天子赤皮蔽膝志聖人作冠冕纓㽔以為首飾凡十二章天子備章公自山以下侯伯自華蟲以下子男自藻火以下卿大夫自粉米以下至周而變之以三辰為旗旗王祭上帝則大裘而冕公侯卿大夫用九章以下秦滅去禮學郊祀之服皆以袀玄漢承秦故世祖都于土中始修三雍正兆七郊顯宗永平二年初服旒冕衣裳文章赤舄絇屨以祠天地養三老五更於三雍于時致治平矣天子三公九卿特進侍祠侯祀天地明堂皆冠旒冕衣裳玄上纁下乘輿備文日月星辰十二章三公諸侯山龍九章九卿以下華蟲七章皆備五采大佩赤舄絇屨以承大祭百官執事者冠長冠皆祇服五嶽四瀆山川宗廟社稷皆袀玄長冠五郊各如方色云百官不執事袀玄以從冕冠垂旒前後邃延玉藻孝明皇帝永平二年初詔有司采周官禮記尚書臯陶篇乘輿服從歐陽氏説公卿以下從大小夏侯氏説冕皆廣七寸長尺二寸前圎後方朱緑裏玄上前垂四寸後垂三寸係白玉珠為十二旒以其綬采色為組纓三公諸侯七旒青玉為珠卿大夫五旒黑玉為珠注獨斷曰三公諸侯九旒卿七旒與此不同旁垂黈纊郊天祀地明堂則冠之衣裳玉佩備章采乘輿刺史公侯九卿以下皆織成注東觀書永平二年正月公卿議春南北郊東平王蒼議髙帝制長冠入宗廟陛下以禮服龍衮祭五帝久無祭天地冕服之制天地之禮冕冠裳衣宜如明堂制志自冕冠至鶡冠其名十九冕冠長冠委貌皮辨爵升建華通天方山逺遊巧士髙山却非進賢却敵法冠樊噲武冠術氏皆有纓㽔執事及武吏皆縮纓垂五寸鶡冠無㽔東平王蒼傳中興三十餘年蒼以天下化平宜修禮樂遂與公卿共議定南北郊冠冕車服制度及光武廟八佾舞數東都賦修衮龍之法服晉志漢承秦弊西京未有所制及明帝始采周官禮記尚書及諸儒記説還備衮冕之服天子之冕前後旒用真白玉珠魏明帝改以珊瑚珠晉初仍舊過江服章多闕而冕飾以翡翠珊瑚雜珠侍中顧和奏改用白琁珠宋志漢承秦制冠有十三種魏晉以來不盡施用隋志陸澄議秦除六冕之制後漢始備古章魏晉以來非祀宗廟不欲令臣下服衮冕位為公者必加侍官故太子入朝因而不著但承天作副禮絶羣后皇太子朝請服冕自宋以下始定此儀宋秦始四年唐志顯慶元年長孫無忌曰漢明帝始采周官禮記制祀天地之服天子備十二章禮記王制疏虞夏之制天子祭服自日月而下十有二章六者畫於衣法天之陽氣之六律六者繡於裳法地之隂氣之六吕凡冕之制皆玄上纁下故注辨師云玄覆朱裏師説以木版為中以三十升玄布衣之於上謂之延也朱為裏以繒為之案漢禮器制度廣八寸長尺六寸又董巴輿服志云廣七寸長尺二寸皇氏謂此為諸侯之冕應劭漢官儀廣七寸長八寸皇氏以為卿大夫之冕服也蓋冕隨代變異大小不同今依漢禮器制度為定春秋正義阮諶三禮圗漢禮器制度云冕制皆長尺六寸廣八寸天子以下皆同沈引董巴輿服志云廣七寸長尺二寸應劭漢官儀云廣七寸長八寸沈又云廣八寸長尺六寸者天子之冕廣七寸長尺二寸者諸侯之冕廣七寸長八寸者大夫之冕古禮殘缺未知孰是玉藻疏漢明帝時用曹褒之説皆用白旒珠深衣疏鄭以後漢之時裳有曲裾故以續衽鈎邉似漢時曲裾今時朱衣朝服從後漢明帝所為是今朝服之曲裾也漢六冕隋志周禮大裘之冕無旒三禮衣服圗大裘而冕王祀昊天上帝及五帝之服秦除六冕唯留玄冕漢明帝永平中始創制董巴志云漢六冕同制皆濶七寸長尺二寸前圎後方晉志漢承秦改六冕之制但玄冠絳衣見下漢衮衣南齊輿服志衮衣漢世出陳留襄邑所織宋末用繡及織成齊建武中采畫為之加飾金銀薄世亦謂為天衣漢五時服羣臣法服禮儀志注織室作祭服天地宗廟羣臣五時之服又云獻帝起居注中平六年令三府長史兩梁冠五時衣袍事位從千石六百石禮儀志立春京師百官衣青衣郡國縣道官下至斗食令史皆服青幘立夏衣赤求雨衣皂先立秋十八日衣黃立秋衣白施皂領緣中衣迎氣禮畢皆衣絳立冬衣皂迎氣禮畢皆衣絳冬至衣絳至立春諸五時變服執事者先後其時皆一日漢雜事曰髙祖時大謁者臣章受詔長樂宫令羣臣議天子所服謁者趙堯舉春李舜舉夏兒湯舉秋貢禹舉冬五時服始於此張敞傳備皂衣二十餘年注如淳曰雖有五時服至朝皆著皂衣谷永傳擢之皂衣之吏郊祀歌帝臨章嘉服上黃蔡雍傳臣在宰府及備朱衣謂祭官也丙顯從祠髙廟至夕牲日使出取齋衣河東賦命羣臣齊法服晉志漢制一歲五郊天子與執事者所服各如其方色百官不執事者服常服絳衣以從魏祕書監秦靜曰漢氏承秦改六冕之制但玄冠絳衣而已魏已來名為五時朝服又有四時朝服又有朝服自皇太子已下隨官受給隋志晉令皇太子給五時朝服逺遊冠裴正奏曰後周制冕加為十二色應五行又非典故案三代之冠六等之冕無迎氣變色之文唯月令起秦代乃有青旗赤玉白駱黑衣而不言辨冕案續漢書禮儀志云立春之日京都皆著青衣秋夏悉如其色魏晉迎氣五郊行禮之人皆同此制考尋故事唯幘從衣色今請冠及冕色並用玄唯應著幘者任依漢晉制曰可續漢志注獨斷曰公卿侍中尚書衣皂而朝者曰朝臣諸營校尉將大夫以下不為朝臣賀循曰漢儀親耕青衣幘漢舊儀曰凡齋紺幘耕青幘秋貙劉服緗幘五時袍見前晉志魏明帝以公卿衮衣黼黻之飾疑於至尊多所減損始制天子服刺繡文公卿服織成文晉遵而無改西京賦緹衣韎韐注武士之服也周禮注今時伍伯緹衣漢后服步繇圭衣志太皇太后皇太后入廟服紺上皂下蠶青上縹下皆深衣制蔮簪珥簪以玳瑁為擲長一尺端為華勝上為鳯皇爵以翡翠為毛羽下有白珠垂黃金鑷左右一橫簪之以安蔮皇后謁廟服紺上皂下蠶青上縹下假結步搖簪珥步搖黃金為山題貫白珠為桂枝相繆一爵九華熊虎赤羆天鹿辟邪南山豐大特六獸詩所謂副笄六珈者禮追師注副之言覆王后首服為副其遺象若今步繇疏漢之步繇謂在首之時行步繇動鄧后賜馮貴人王赤綬以未有步搖環佩加賜各一具詩箋副既笄而加飾如今步搖上飾內司服注今世有圭衣蓋三翟之遺俗疏漢時有圭衣刻為圭形綴於衣由周禮有三翟别刻繒綴於衣漢俗尚有漢弋綈文帝紀贊身衣弋綈服御無增益注如淳曰弋皂也傳賈誼曰帝之身自衣皂綈東方朔曰孝文身衣弋綈足履革舄衣緼無文貢禹曰孝文衣綈履革揚雄曰聖文綈衣不敝杜篤云太宗衣無異采後文苑傳文中子衣弋綈傷乎禮中焉可也張安世傳安世尊為公侯身衣弋綈注弋黑色綈厚繒光武身衣大練色無重綵陸閎善著越布單衣光武好之敕會稽獻越布唐元和聖德詩斥遣浮華好此綈紵漢御浣衣紀永平十八年肅宗即位十二月癸巳有司奏孝明皇帝劬勞日􅉴身御浣衣食無兼珍不以天下為樂馬廖傳上疏長樂宫曰元帝罷服官成帝御浣衣哀帝罷樂府而侈費不息至於衰亂者百姓從行不從言也改政移風必有其本陛下躬服厚繒斥去華飾許后傳上疏舊故中宫乃私奪左右之賤繒及發乘輿服繒為待詔補注託言此繒擬待詔别有所補浣東都賦昭節儉示太素去後宫之麗飾損乘輿之服御文王卑服即功禹惡衣服漢繡夾見錫豫外夷類漢貂裘東平王蒼傳建初六年冬蒼上疏求朝明年正月帝許之帝以蒼冒涉寒露遣謁者賜貂裘及太官食物珍果七年八月蒼歸國復賜乘輿服御珍寶輿馬天漢三年西國獻吉光裘唐太宗親解貂裘賜韋挺漢賜車馬衣服珍寶衣服三公服御衣綬賜帛賜錦後傳李忠與任光同奉世祖為右大將軍世祖自解所佩綬以帶李忠會諸將問所得財物唯忠無所掠則以所乘大驪馬及繡被衣服賜之恭王祉建武二年封為城陽王賜乘輿御物車馬衣服馮異建武六年春朝京師使中黃門賜珍寶衣服郭伋建武十一年為并州牧賜車馬衣服樊􅎡與光武少遊舊賜御食及乘輿服物郭賀為荆州刺史有殊政顯宗召見賜以三公之服黼黻冕旒敕行部去襜帷使百姓見其容服以章有德丁鴻永平十年召見賜御衣及綬祭肜永平十二年為太僕顯宗美肜清約賜錢馬衣被弓劒廣陵侯元夀永平十五年召見東平宫班賜御服器物又取皇太子輿馬悉與之藥嵩為郎獨立臺上帝之詔大官賜尚書以下朝夕餐給帷帳皂袍侍史二人鄭均建初六年告歸賜以衣冠魯丕和帝因朝會召見諸儒丕與賈逵黃香等相難帝善丕説特賜冠幘履襪衣一襲楊賜光和四年拜太常賜御府衣一襲冠幘綬周禮宫伯以時攽衣裘注若今賦冬夏衣説文漢律曰賜衣者縵表白裏後漢志立秋遣使者齎束帛賜武官注漢官名秩曰賜太尉將軍各六十匹執金吾諸校尉各三十匹武官倍於文官立春遣使齎束帛賜文官注漢官名秩曰賜司徒司空帛四十匹九卿十五匹古今注曰建武八年立春賜公十五匹卿十匹前紀武帝元狩六年十月賜丞相至吏二千石百金千石至乘從者帛蠻夷錦各有差昭帝元鳳二年四月賜郎從官帛元康三年春賜郎從官帛王褒傳褒等為歌頌以差賜帛明紀永平六年獲鼎賜三公帛五十匹九卿二千石半之後傳任延為九真太守光武召見賜馬雜繒劉般建武十九年賜繒二百匹祭肜為襄賁令政清璽書勉勵增秩一等賜縑百匹淳于恭建初元年詔美素行告郡賜帛二十匹遣詣公車魏文帝解御袍賜薛夏以御衣賜張遼晉咸寧三年賜陳騫衮冕之服晉盧志賜衣一襲鶴紋袍一領晉平冕晉志平冕王公卿助祭於郊廟服之王公八旒卿七旒以組為纓色如其綬王公衣山龍以下九章卿衣華蟲以下七章宋志魏明帝以公卿衮衣黼黻之文擬於至尊復損略之隋志平冕俗所謂平天冠也其制玄表朱緑裏廣七寸長尺二寸加於通天冠上前垂四寸後垂三寸前圓而後方垂白玉珠十有二旒其長齊肩以組為纓各如其綬色傍垂黈纊珫珠以玉瑱梁天監七年周捨議詔旨以王者衮服宜畫鳯皇按禮有虞氏皇而祭畫鳯皇羽也皇是衣名非冕明矣後周常冠十二冕後周武帝時初服常冠以皂紗全幅向後襆髮仍裁為四腳俗謂之幞頭武帝宣政元年三月甲戌初服常冠以皂紗為之加簪而不施纓導若今之折角巾唐會要折上巾軍旅所服今幞頭是也通典曰武帝建德中制折上巾隋志云巾趙魏間謂之承露通典後周設司服之官掌皇帝十二冕祀昊天蒼五帝隨方色朝日青夕月素地祇黃神州社稷玄享先王加元服象食三老耕藉衮視朔大射山視朝宴鷩皆十有二旒唐冠冕制度會要貞觀四年八月十四日丙午詔曰冠冕制度已備令文尋常服飾未為差等於是三品以上服紫云云六典尚衣奉御供天子衣服詳其制度凡天子冕服十有三大裘冕至翼善冠尚服掌供內服皇后之服三禕鞫禪衣內直郎掌皇太子之服織染令掌供天子皇太子羣臣之冠冕辨其制度天子之冠二通天翼善冕六大裘衮鷩毳絺玄辨二武辨皮辨幘二黑介平巾帽一白紗太子之冠三三梁逺遊進德冕二衮玄辨一皮辨幘一平巾臣下之冠五髙山逺遊進賢獬豸却非冕五衮鷩毳絺玄辨二爵武幘三介平巾平巾緑幘武庫令袍之制五青緋黃白皂皆繡畫武豹鷹鸇之類紀玄宗開元二年七月乙未焚錦繡珠玉於前殿戊戌禁珠玉錦繡停織錦坊德宗大厯十四年六月己亥減乘輿服御會要貞元七年十一月上問冠冕於宰臣董晉曰冠冕動有佩玉之響以節步也故禹致美於紱冕唐天子冕服大裘冕皇后服衮冕六服志天子之服十四大裘冕祀天地之服也黑表纁裏無旒金飾玉簪導衮冕踐祚饗廟征還遣將飲至加元服納后元日受朝臨軒册拜之服也衣畫裳繡以象天地之色鷩冕有事逺主之服也毳冕祭海嶽絺冕祭社稷饗先農玄冕蠟祭朝日夕月通天冠冬至受朝祭還燕羣臣養老之服緇布冠始冠之服武辨講武出征搜狩禡類宜社賞祖罰社纂嚴之服禮志射皇帝服武辨辨服朔日受朝白紗帽視朝聽訟平巾幘乘馬之服又有黑介幘拜陵之服白帢臨喪之服皇后之服三褘衣鞠衣鈿叉袒衣會要舊制云云同志顯慶元年九月長孫無忌等言武德初撰衣服令天子祀天地服大裘冕無旒案周郊被衮以象天戴冕璪十二旒與大裘異請服衮冕罷大裘開元十一年張説請用大裘玄宗以大裘朴略廢而不用無忌又言親祭日月服五品之服是貴賤無分也請諸祭皆用衮冕自是鷩冕以下天子不復用儀鳯二年蘇知機上言請製大明冕十二章乘輿服之加日月星辰龍虎山火麟鳯玄龜雲水等象鷩冕八章三公服之毳冕六章三品服之黼冕四章五品服之詔下有司議楊炯奏議遂寢知機之請六典大裘冕無旒冕廣八寸長一尺六寸閻立德傳武德初遷尚衣奉御制衮冕六服腰輿􅏛扇咸有典法李德裕正服針聖人作服法象可觀汲黯莊色能正不冠楊阜慨然亦譏縹紈四時所御各有其官唐太子冕服志皇太子之服六衮冕逺遊冠公服烏紗帽辨服平巾幘進德冠內直郎掌之皇太子妃之服三褕翟鞠衣鈿叉禪衣通典開元禮皇太子正至受羣臣賀著從省服以出若服袴褶羣臣及宫臣皆袴褶朝集使公服受宫臣朝皇太子服逺遊冠絳紗袍以出禮志太子納妃服衮冕出升金輅羣臣冕服唐一品衮冕志羣臣之服二十有一衮冕一品之服鷩冕二品之服毳冕三品之服絺冕四品之服玄冕五品之服平冕郊廟武舞郎之服爵辨六品以下九品以上從祀之服武辨武官朝參服辨服文官九品公事之服進賢冠文武朝參三老五更之服逺遊冠親王之服法冠御史之服一名解豸冠髙山冠內侍謁者之服委貌冠郊廟文舞郎之服却非冠亭長門僕之服平巾幘武官衛官公事之服黑介幘國官視品府佐謁府國子太學四門生俊士參見之服介幘登歌工人之服平巾緑幘供膳奉觶之服具服五品以上陪祭朝饗拜表之服亦曰朝服從省服五品以上公事朔望朝謁見東宫之服亦曰公服唐翼善冠進德冠幞頭志太宗常以幞頭起於後周便武事者也馬周議裹頭者左右各三摺象三才重繫前腳法二儀方天下偃兵採古制以為翼善冠自服之又制進德冠以賜貴臣貞觀八年五月七日初服此冠玉􅋒制如辨服以金飾梁花趺三品以上加金絡五品以上附山雲自是元日冬至朔望視朝服翼善冠衣白練裙襦常服則有褲褶與平巾幘通用翼善冠進德冠制如幞頭皇太子乘馬則服進德冠九􅋒加金飾犀簪導亦有褲褶燕服用紫其後朔望視朝仍用辨服會要貞觀八年五月七日太宗初服翼善冠賜貴臣進德冠因謂侍臣曰幞頭起於周武帝蓋取便軍容耳今四海無虞當偃武事此冠頗采古法兼類幞頭乃宜常服至開元十七年廢不用宋朝淳化二年十月五日詔檢討翼善冠制度及所用衣服會要唐制親王服逺遊三梁冠五品以上兩梁冠九品以上一梁冠武官凡中書門下九品以上服武辨平巾幘御史服法冠唐賜貂裘韋挺傳太宗討遼東專主餉詔河北州皆取挺節度許以便宜帝親解貂裘及中廄馬賜之唐赭黃袍志初隋文帝聽朝之服以赭黃文綾袍烏紗帽折上巾六合鞾與貴臣通服唯天子之帶有十三鐶又有平頭小樣巾百官常服同於庶人至唐髙祖以赭黃袍巾帶為常服唐綾袍金玉帶舊紀貞元七年十一月乙丑令常參官趨朝入閣不得奔走朝會須服本色綾袍金玉帶董晉傳德宗時金吾將軍沈房常服入閣帝疑以問晉又問晉冠冕之制對曰古者服冠冕以珮玉節步堂上接武堂下布武君前趨進而已今或奔走致顛仆在式朝臣皆綾袍五品而上金玉帶所以盡飾奉上故漢尚書郎含香老萊采服君父一也帝然其言令羣臣衣本品綾袍金玉帶自晉而復會要貞元七年十一月九日詔常參官入閣不得奔走復衣綾袍金玉帶八年十二月三日賜文武常參官綾袍會要貞觀二十二年十月八日癸卯令百寮朔望日服袴褶以朝南齊志袴褶親戎纂嚴所服開元二十五年御史大夫李適之奏冬至大禮朝參并六品清官服朱衣已下通服袴褶天寶十二載十一月十三日制五品已上著珂傘貞元十五年四月歸崇敬以百官朔望朝服袴褶非古禮隋代始有服者請罷之奏可唐章服魚袋龜袋賜羣臣襲衣見後會要兼實録六典貞觀四年八月十九日丙午詔三品以上服紫四品五品以上服緋六品七品以緑八品九品以青馬周傳云品官舊制止黃紫於是云云皆周建白龍朔二年九月二十三日戊寅孫茂道奏八品九品衣碧從之上元元年八月戊戌敕文武官三品以上服紫金玉帶四品五品服緋金帶六品七品緑銀帶八品九品青鍮石帶庶人黃銅鐵帶永徽二年四月二十九日舊紀五月壬辰以下兼舊紀給五品以上隨身魚銀袋以防召命之詐出內必合之三品以上金飾袋咸亨三年五月乙未五品以上改賜新魚袋並飾以銀三品以上各賜金裝刀子礪石一具武后垂拱二年正月二十日都督刺史並準京官帶魚袋天授元年志云二年九月二十六日改佩魚皆為龜久視元年十月三日三品以上龜袋飾以金四品以銀五品以銅神龍元年二月罷龜袋復給以魚九月十七日郡王嗣王亦佩金魚袋景龍三年八月令特進佩魚散官佩魚自此始然貟外試檢校官猶不佩魚景雲二年四月二十四日詔衣紫者魚袋飾以金衣緋飾以銀開元三年八月駙馬都尉從五品者假紫金魚袋八年二月十二日都尉刺史品卑者假緋魚袋五品以上檢校試判官皆佩魚九月十四日張嘉貞奏致仕者佩魚終身自是百官賞緋紫必兼魚袋謂之章服當時服朱紫佩魚者衆矣百官志中尚令製魚袋給百官蕃客賜寶鈿帶魚袋則授鴻臚通典天授二年八月左羽林大將軍建昌王攸寧借紫衫金帶九月二十六日除納言依舊著紫帶金龜借紫自此始實録神龍二年九月戊辰停京官六品以下著緋袴褶各依本品開元二年二月癸卯詔軍人多借緋魚無功者敕收取俟立功借二十五年五月丙子詔緋紫之服除有戰功不得輒賞列傳鄭餘慶每朝會朱紫滿廷而少衣緑者品服太濫詔餘慶條奏懲革髙釴轉起居郎陳得失穆宗嘉之面賜緋魚鄭浣文宗時侍講學士賜金紫服牛叢為睦州宣宗賜金紫謝曰臣今衣刺史所假緋即賜紫為越等乃賜銀緋宣宗重惜服章有司具緋紫衣數襲從行以備賜或年歲不用其一故當時以緋紫為榮元魏太和十年四月辛酉朔始制五等公服唐錦袍列傳張長遜引兵討薛舉賜錦袍金甲竇璡從秦王平薛仁杲賜錦袍契苾明髙宗時以戰賜錦袍寶帶宋之問武后遊洛南龍門詔從臣賦詩左史東方虬詩先成后賜錦袍之問俄頃獻后嗟賞奪袍以賜魏元忠神龍二年為右僕射謁告賜錦袍銀千兩畢構按察劒南睿宗賜璽書袍帶張文瓘諫造宫室賜繒錦百段張暐還鄉上冢帝賜詩及錦袍繒綵王難得玄宗召見賜錦袍金帶李白衣宫錦袍韋綬為學士德宗幸其院以蜀纈袍覆而去李石文宗曰吾聞禁中有金鳥錦袍二昔玄宗幸溫泉與楊妃衣之今富人時時有之回紇傳貞觀二十一年賜絳黃瑞錦文袍于闐貞觀二十三年賜錦袍東女垂拱一年賜瑞錦服天竺傳開元中賜錦袍又賜新羅紫繡紋袍西突厥蘇祿開元五年來朝賜錦袍鈿帶魚袋七事開元六年六月敕益州歲織十五領以賜諸蕃南詔開元末賜錦袍拔悉蜜天寶初賜紫文袍韋端符衛公故物記素錦袍一其襟袂促小裁製絶巧密光爛爛如波旁出李德裕詩鸞飛曳錦袍漢文帝遺丐奴單于錦袍唐諸衛繡文袍志玄宗時有詔殿中侍御史糾察諸衛大將軍中郎將以下給袍者皆易其繡文千牛衛以瑞牛左右衛以瑞馬驍衛以虎武衛以鷹威衛以豹領軍衛以白澤金吾衛以辟邪會要開元十一年六月敕六典武庫令袍之制有五青緋黃白皂注説文曰袍襺也絮曰襺緼曰袍令繡畫武豹鷹鸇之類以助兵威百官志少府監藏武庫袍襦冬至元日以給衛士李程傳德宗季秋出畋有寒色顧左右曰九月猶衫二月而袍為不順時朕欲改月程曰玄宗著月令十月始裘不可改唐朱明服肅宗紀性仁孝好學開元十三年三月甲午封忠王二十六年六月庚子立為皇太子有司行册禮十月己巳册其儀有中嚴外辦其服絳紗太子曰此天子禮也乃下公卿議太師蕭嵩左丞相耀卿請改外辦為外備絳紗衣為朱明服從之通典云上手敕改為朱明服唐賜時服韋湊傳遷太原尹邉備修舉玄宗詔賜時服勞勉之會要天授二年正月二十二日內出繡袍賜新除都督刺史其袍繡山形繞山勒回文銘曰德政惟明職令思平清慎忠勤榮進躬親延載元年五月二十二日內出繡袍賜文武三品以上銘襟背各為八字回文志以為無法度貞元七年三月舊紀壬申初賜節度觀察使新製時服上以文采不常俾有足稱節度使以雕舊紀作鶻銜綬帶取其武毅以靖封內觀察使以鴈銜儀委舊紀作威儀取其行列有序牧人有威儀也儀委瑞草也瑞應圖王者愛人則是草生太和六年詔袍襖之制三品以上服綾以鶻銜瑞草鴈銜綬帶及雙孔雀狄仁傑傳轉幽州都督賜紫袍龜帶后製金字十二於袍以旌其忠柳公權傳從文宗幸未央宫帝駐輦曰朕有一喜邉戍賜衣久不時今中春衣已給當賀我以詩通典後周宇文護始袍加下襴唐八貂百官志侍中二人左散騎常侍二人中書令二人右散騎常侍二人皆金蟬珥貂左散騎與侍中為左貂右散騎與中書令為右貂謂之八貂宋志侍中左貂侍常右貂宋志徐廣車服注曰北土寒涼本以貂皮暖額附施於冠何敬容傳回豐貂以步文昌聳高蟬而趨武帳貂內徑外溫蟬清高江總有華貂賦曰拜文㮰而影度陪武帳而香浮唐豸冠法冠會要乾元二年四月六日敕御史彈事仍服豸冠舊制大事則豸冠衣朱衣纁裳白紗中單以彈之小事則常服而已建中元年三月監察御史張著冠豸冠彈京兆尹兼御史大夫嚴郢於紫宸殿上即位初侍御史朱放請復舊制置朱衣豸冠於內廊有犯者御史服以彈又令御史得專彈舉不復白於中丞大夫至是著首行之賜魚袋自是日垂衣冠於宣政之左廊志殿中侍御史元日冬至朝會戴黑豸升殿侍御史奏大事法冠云云王義方傳顯慶元年擢侍御史具法冠對仗叱義府下跪讀所言會要八月溫造傳授侍御史知彈奏請復朱衣豸冠示外廡不聽唐青襟介幘唐書咸通中禮部侍郎劉允章請諸生及進士第並謁先師衣青襟介幘以還古制禮志皇帝養老于太學學生俱青襟服唐浣衣栁公權傳文宗時嘗與六學士對便殿帝稱漢文帝恭儉因舉袂曰此三浣矣學士皆賀獨公權無言帝問之對曰人主當進賢退不肖納諫諍明賞罰服浣濯之衣此小節耳非有益治道者杜牧傳孝武浣衣一肉不畋不樂憲宗建隆衮龍服制度乾德新造冠冕唐至顯慶初諸祭惟用衮冕自大裘冕而下至翼善冠皆廢建隆元年二月九日禮院言崇元殿行四廟册禮衮龍服五月朔受朝通天冠絳紗袍請中尚少府修製十九日禮院具制度令式衮冕前後十二旒二纊謂之平天冠玉簪導組帶衮服玄衣纁裳十二章白紗中單黼領青褾襈裾黼膝革帶玉鉤䚢大帶玉具劒玉佩元組綬朱襪赤舄加金飾通天冠加金博山附蟬翠緌犀簪導二十四梁絳紗袍白紗中單朱領褾裾絳蔽膝白假帶方心曲領白襪黑舄從之二年聶崇義上三禮圗倣虞周漢唐之舊詹事尹拙言衮冕而下合畫充耳尚書竇儀議從之四年冬服之合祭圜丘乾德元年閏十二月乙亥二十七日少府監楊格少監王處訥等上新造皇帝冠冕先是郊祀冠冕多飾珠玉太祖以華而且重故命改製太宗亦命去珠玉之飾少府製於禁中祥符初元將東封四月乙卯有司言當服大裘詔依南卯服衮冕六年五月朝拜聖像以盛暑製單衣三朝志衮冕祭天地宗廟朝饗太清昭應景靈宫受册尊號元日受朝册太子則服之通天絳紗大祭祀致齋出乘玉輅入乘金輅正至大會五月朔受朝則服之赭黃淡袍衫大宴服之黃䙆袍衫紅袍常朝服之窄袍便坐視事服之皆皂紗折上巾通犀金玉環帶窄袍或御烏紗帽咸平五年理丞李坦言助祭官六冕衣裳畫繡不依古制詔禮院詳定制度改正乾德元年閏十二月乙亥詔乘輿所服冠冕去珠玉之飾建隆賜貂裘乾德賜紫貂裘帽建隆二年慕容延釗為山南東道節度是冬大寒遣中使賜以貂裘百子氈帳乾德二年十一月命王全斌等伐蜀冬暮大雪上設氈帷於講武殿衣紫貂裘帽以視事謂左右曰我被服如此體尚覺寒西征將帥衝犯霜霰何以堪處即解裘帽遣中黃門馳驛賜全斌且諭旨諸將以不能遍及也全斌感泣晏子春秋景公時雨雪三日不霽公被狐白之裘坐堂側陛晏子入見公曰天不寒晏子曰古之賢君飽而知人飢溫而知人寒逸而知人勞也君不知也公乃令出裘發粟以與飢寒裾生惠氣袖起陽春吹綸愧暖挾纊慙溫齊被狐白莫知人寒楚矜豹舄靡克己愆翠雲之光青鳯之煥建隆賜錦袍景德賜錦袍建隆二年十一月己卯上始獵於近郊賜宰相樞密使節度觀察使團使統軍侍衛諸軍都校錦袍康定元年九月辛酉賜陕西軍士羊裘言者以塞上苦寒請以羊裘賜戰士一裘用五羊皮聽軍士自製翰林學士十月朔賜對衣紅錦袍淳化二年以細花盤雕錦袍下丞相一等景德元年九月河北轉運使劉綜言每歲朝廷遣使賜邊城冬服諸軍將校皆給錦袍唯轉運使副止攽皂花丁亥并賜河東陜西三路使副方勝練鵲錦袍祥符製宣聖冕服祥符二年正月賜曲阜文宣王廟桓圭冕九旒服九章熙寧八年七月國子監言唐開元中尊孔子為文宣王內出衮冕之服以衣之宜用天子之製禮院言宜依官品衣服令文宣王冕用九旒顔子已下各依郡國縣公侯伯正一品至四品冠服制度從之崇寧二年八月改用冕十二旒服九章又圗繪頒天下其執圭立戟並從王者制度紹興十四年正月二十六日內出鎮圭以奉文宣王初有司欲用珉上曰崇奉先聖豈可用假玉詔以真玉圭降出康定百官朝服志康定二年十月少府監奏每大禮遣旌節主吏詣朝服法物庫定百官品位給朝服而有官卑品髙官髙品卑者難以裁定願敕禮院詳其制禮院約舊制奏衣服令五梁冠犀簪導珥筆朱衣朱裳白羅中單玉劒佩錦綬玉環一品二品侍祠大朝會服之中書門下加籠巾貂蟬三梁冠白紗單銀劒佩環諸司三品御史臺四品兩省五品侍祠大朝會服之中丞則冠獬豸兩梁冠銅劒佩環四品五品侍祀大朝會服之六品去劒佩綬御史則冠獬豸衣有中單以上準前法給朝服從之皇祐三年詔問冠韋辨何服所執何玉禮院奏韋辨為戎服於經無執玉之文三禮圖繪為執玉誤也皇祐四年三月禮院以中單制不明考求以奏宜用繒素而朱領緣領刺以黑白黼文五等祭服悉依此制詔如太常議慶厯三年三月丙申詔太常禮院諸小祠獻官皆常服行事不合禮文自今並服四品以下祭服景祐衮冕制度圖至和附治平參定冕服元豐附志本朝冠服多沿唐舊循用之久有司寢為繁文漸以失法度景祐二年八月丙子二十七日始詔內侍省與太常禮院詳典故造冠冕會要云裁定衮冕制度蠲減珍華務從簡約俾繪圗以進由是改製衮冕服冕版裁令廣八寸長一尺六寸所謂翠旒碧鳯二十四犀瓶二十四琥珀瓶四神帶二分旒玉鉤悉罷之而冕頂以青羅表繪龍麟以代錦用紅羅裏繪紫雲白鶴錦上以金絲為網而舊以金絲蹙八龍止存其四又以青羅繪龍麟飾筒及柱以易錦補空地以雲龍細窠以易玉金輪等七寶其所施花素墜天河帶組欵幔帶六綵綬冕之金扣玉鐶皆裁損輕於舊而以青羅繪龍麟錦為納言以代玉加黈纊玉簪上衣用青羅以紅羅繡八章間以雲去細窠珠璣飾下裳用紅羅繡藻粉米黼黻蔽膝繡升龍二除帶首黃金葉以銷金代之慶厯二年三月太常博士余靖言大中祠用上公九旒九章冕服為初獻餘公卿皆七旒冕制無差降小祠則公卿行事乖戾舊典宜詳周禮因所祭鬼神等獻官冕服之制禮官議曰謹按衣服令五旒冕衣裳無章皂綾綬銅裝劒珮四品以下為獻官則服之請公卿祭服依舊從品外小祠如令以祭服行事詔行焉至和三年九月一日學士王洙奏天子法服冕旒形制重而華飾繁願集禮官參定詔禮院詳典禮繪圗以進因敕御藥院更造其後稍增侈如故治平二年同知太常禮院李育奏郊廟之制本尚純質衮冕之質皆存法象冕以周官為本十二旒間以采玉加以紘綖笄瑱之飾衮以虞書為法十二章首以辰象别以衣裳繪繡之采東漢至唐皆無珠翠龍錦犀寶七星雲鶴之飾自大裘之廢顓用衮冕古朴稍去法度尚存若魏明用珊瑚江左用翡翠豈象天則數之義哉章聖封泰山禮官請服衮冕帝曰前王服羔裘尚質也今有衮冕可從近制豈有意於繁飾哉有司率意妄增仁宗詔禮官章得象等議所減過半然不經之飾輕者尚存不能盡如詔書王洙復議去繁飾漸還古禮而有司所造復如景祐之前又按開寶通禮及衣服令冕服有定法無寶錦之飾願復先王之制祖宗之法其衮冕之服及鞸綬佩舄之類與通禮衣服令三禮圗制度不同者悉改正八月乙卯詔禮院少府參定遂奏冕服以羅為之冕廣一尺二寸長二尺二寸前圎後方黝上朱下金飾版側白玉珠為旒貫以五采絲繩前後各十二旒旒各十二朱絲組為纓青衣纁裳八章繪衣四章繡裳其中單革帶玉具劒玉佩朱襪之制已中禮令無復改為詔如景祐三年制悉去繪畫龍麟紫雲白鶴蹙金絲龍下裳除繡衮服並繪而不繡元豐元年十一月癸酉詳定禮文所言後漢用曹褒之説係白玉珠為十二旒國朝沿漢舊景祐中以叔孫通漢禮器制度為法青表紅裏非辨師所謂玄冕朱裏也請改用朱組為紘玉笄玉瑱以玄紞垂瑱以五采玉貫五色藻為旒記曰天子佩白玉玄組綬韋彤五禮精義漢乘輿黃赤綬四采皆不合禮又有大小之别今衮冕有六采織綬請改製從之二年四月詳定正旦儀注所言元日受朝宜服通天絳紗癸亥從之三年八月長編九月癸亥又言衮冕八章在衣四章在裳裳少二章與虞書相戾請改正繪日月星辰山龍華蟲六章在衣繡宗彞藻火粉米黼黻六章在裳詔送禮院而已政和三年四月議禮局上皇帝冕服之制七年四月禮制局請明堂服衮冕明道皇太后車服明道元年十二月辛丑詔有司製后妃禮衣祭服及重翟等六車丙午太常禮院言禮衣請準衮服減二章衣去宗彝裳去藻垂珠翠二十旒以衮衣為名詔冠名儀天時太后將恭謝宗廟二年二月乙巳服褘衣乘玉輅赴太廟改服衮衣儀天冠饗七室淳熙三年九月二十五日執政言蒙宣示中宫褘衣上因言近風俗奢靡革弊當自宫禁始唐制皇后服三等皇朝存其名元豐五冕服章元豐元年十一月詳定禮文所言古者祭服玄衣纁裳以象天地之色裳之飾有藻粉米黼黻今祭服上衣以青其繡於裳者藻粉米五采圓花藉之黼用藍黻用碧黃虎蜼粉米異章而畫不應古制請下有司制五冕之服章衮冕之章九衣繪龍山華蟲火虎蜼裳繡藻粉米黼黻鷩冕之章七衣繪華蟲火虎蜼裳繡藻粉米黼黻毳冕之章五衣繪虎蜼藻粉米裳繡黼黻希冕之章三衣繪粉米裳繡黼黻玄冕衣無章裳刺黻其爵辨則緇衣纁裳從之中單乘輿服飾以繡黼諸侯以黼服衮鷩毳冕者用絳服希元冕爵辨者用青帶有采飾合單之異韠以上為前下為後於是進新圗佩玉為小帶以屬於革帶天子用玉餘皆珉石略依其色辨諸臣之等去銀鉤獸面二年四月又去祀儀解劒脫舄履之節三年八月又請羣臣冕服助祭執笏當事則搢笏六冕並用赤舄大觀四年四月議禮局官宇文粹中議改衣服制度政和二年八月以大觀中所上羣臣祭服制度付有司依畫圖製造三年四月又上羣臣祭服之制蘇紳陳便宜八事四曰異服章有執技之人與丞郎清望同佩金魚內侍班行與學士同服金帶宜加裁定使采章有别舊制文臣借緋紫服皆不佩魚政和元年十一月丙子始詔許佩魚三禮圖三公八命而下服毳冕諸家禮圖皆不載三公之冕元豐大裘議元豐五年詳定官言周禮司服云王祀昊天上帝服大裘而冕享先王則衮冕唐開元禮開寶通禮詣行宮大次服衮冕出次則改服大裘臨燔柴則脫衮服裘請從唐制詔下參議禮官咸謂大裘冕無旒玄表朱裏以繒為之以黑羔皮為裘黑繒為領袖詳定官陸佃謂大裘之冕無旒非是古者裘必有衣服裘而以衮襲之此冬祀之服也請冬至禋祀服裘被衮其餘祀天地並服衮去裘四年十月乙亥詳定所言其後禮部言經有大裘而無其制隋唐猶可考隋制以黑羔皮為裘黑繒為領袖及裏緣袂可運肘長可蔽膝中單當在大裘之下請改製六年五月己卯上言六年十一月丙午郊祀帝始服通天冠絳紗袍乘輅以出至景靈宫止大次加大裘而被衮冕元祐元年五月禮部言大裘作短袍樣仍與衮服同冕未合典禮下禮部太常議上官均吳安詩常安民劉唐老龔原姚勔請依元豐新禮丁騭請循祖宗故事王悆請倣唐制朱光庭周秩請以玄衣襲裘獨禮部郎何洵直在元豐預詳定以陸佃所議有可疑者八請從唐制兼改製大裘以黑繒為之佃復破其説請從先帝所定其後詔去黑羔皮而以黑繒製造焉書目大裘議一卷何洵直陸佃等撰元豐中洵直等已定大裘制度元祐元年再上議佃更加看詳太常少卿朱光庭丞周秩博士丁騭等十一人皆入議狀紹興十三年九月八日禮部侍郎王賞等言郊祀服大裘被衮請依何洵直議以黑繒如舊制志大觀中命宇文粹中編祭服制度大要述元豐議至政和有司請如圖製造而冕服益盛宋齊郊天服衮冕梁天監七年許懋請造大裘從之紹興冕服議紹興元年宗祀僅有朝服十三副祭服六十二副四年四月增造祭服六十三副四年五月國子丞王普言冕服始於黃帝堯舜而大備於周故孔子云服周之冕王之三公八命服鷩冕八旒衣裳七章其章各八孤卿六命毳冕六旒衣裳五章其章各六大夫四命希冕四旒衣裳三章其章各四上士三命玄冕三旒中士再命玄冕一旒下士一命玄冕無旒衣皆無章裳黼視命數自三公而下其繅玉并衡紘紞瑱纊帶佩芾舄中衣皆有等差近世冕服制度沿襲失真多不如古夫後方而前圎後仰而前俯玄表而朱裏此冕之制也今方圎俯仰幾於無辨且以青為裏而飾以金銀矣其衣皆玄其裳皆纁裳前三幅而後二幅此衣裳之制也今則衣色以青裳色以緋且為六幅而不殊矣山以章也今以嶞火以圎也今以鋭宗彝虎蜼之彝也乃畫虎蜼之狀而不為彞粉米米而粉之者也乃分為二章而以五色圎花為藉佩有衡璜琚瑀衝牙而已乃加以雙滴而重設二衡綬以貫佩玉而已乃别為錦綬而貫以雙環以至帶無紐約芾無肩頭舄無鉤繶中衣無連裳訛謬未暇悉舉祖宗以來屢嘗講究以舊服數多未免因循今舊服無有存者欲請因兹改作二十五日禮部看詳請送奉常修改從之普又撰深衣制度一卷有序一篇釋音一卷十六年四月四日癸卯命禮官考古製祭服乾道皇太子冠服制度乾道元年八月十七日癸巳詔製造皇太子冠服依禮部太常所定制度禮官言至道二年定制服逺遊冠朱明衣執植圭政和五禮新儀逺遊冠十八梁博山附蟬犀簪導紅絲纓朱明服紅裳白紗中單絳紗蔽膝白襪黑舄衮冕垂珠九旒紅絲纓青纊充耳犀簪導青衣朱裳九章五章在衣四章在裳蔽膝隨裳色為火山二章瑜玉雙佩四采大綬施玉環三白襪朱舄從之冠禮周冠頌漢冠辭冠頌家語冠頌篇又大戴禮公冠篇孔子曰成王年十有三而嗣立明年夏六月冠而朝于祖以見諸侯周公命祝雍作頌曰祝王達而勿多祝雍辭曰使王近於民逺於年嗇於時惠於財親賢而任能一作祿賢使能其頌曰令月吉日王始加元服去王幼志一作心服衮職欽若昊天六合是式率爾祖考永永無極此周公之制也通典成王年十五而冠文王年十二冠太平御覽周書曰成王將加元服周公使人來零陵取竹為冠郊特牲諸侯有冠禮夏之末造也儀禮士冠禮始加祝曰令月吉日始加元服棄爾幼志順爾成德夀考維祺介爾景福再加曰吉月令辰乃申爾服敬爾威儀淑慎爾德麋夀萬年永受胡福三加曰咸加爾服醴辭曰甘醴惟厚嘉薦令芳拜受祭之以定爾祥承天之休夀考不忘醮辭字辭曰令月吉日昭告爾字爰字孔嘉髦士攸宜適子冠於阼以著代也醮於客位加有成也三加彌尊諭其志也冠而字之敬其名也無大夫冠禮而有其昏禮古者五十而后爵何大夫冠禮之有公侯之有冠禮也夏之末造也天子之元子猶士也天下無生而貴者也左傳季武子曰君冠以祼享之禮行之以金石之樂節之以先君之祧處之通典周禮有服冕之數而無天子冠文大戴禮公冠四加天子亦四加家語冠頌云王太子之冠擬諸侯之冠周制士冠禮頗備王者采行焉漢改皇帝冠為加元服惠帝加元服用正月甲子若丙子吉紀惠四年三月甲子皇帝冠昭帝元鳯四年正月丁亥帝加元服冠者首所著故曰元服汲黯傳敘上正元服冠辭曰陛下摛著先帝之光輝以承皇天之嘉祐欽奉仲春之吉辰普遵大道之郊域秉率萬福之丕靈始加昭明之元服推逺沖孺之幼志藴積文武之就德肅勤髙祖之清廟六合之內靡不蒙福承天無極見大戴禮物後漢禮儀志引博記云云後漢乘輿初加緇布進賢次爵辨次武辨次通天冠訖皆於髙廟謁見和帝冠以永元三年正月甲子袁安為賓賜束帛乘馬賜諸侯王至列侯宗室黃金將大夫郎吏從官帛賜民爵及栗帛大酺五日虯以曹褒新禮二篇冠乘金根車駕六玄至廟成禮黃香頌曰以三載之孟春建寅月之上旬皇帝時加玄冕簡甲子之元辰皇輿幸夫金根六玄虯之連蜷建螭龍以為旗鳴節路之和鑾既臻廟以成禮乃回軫而反宫正朝服以饗宴撞太簇之庭鐘祚蕃屏與鼎輔暨夷蠻之君王咸進爵於金罍獻萬夀之玉觴順帝以初月丙子加元服於髙廟獻帝興平元年正月甲子加元服司徒淳于嘉為賓東晉祝文曰令月吉辰始加元服皇帝穆穆思弘衮職欽若昊天六合是式率遵祖考永永無極眉夀惟祺介爾景福唐志皇帝加元服有司卜日告天地宗廟前一日尚舍設席太極殿中楹蒲筵紛純加藻席緇純次席黼純有司設次展縣設案陳車輦如元日其日侍中版奏中嚴有司設罍洗於阼階殿中監陳衮服緇纚玉簪及櫛同箱尚食實醴尊於東序外帷內坫在尊北實角觶柶各一饌陳尊西籩豆十二俎三衮冕玉導置於箱侍中奏外辦皇帝服空頂黑介幘絳紗袍出自西房即御坐太尉跪脫幘太師降盥受冕祝曰令月吉日始加元服夀考維祺以介景福乃跪冠設簪結纓皇帝興適東房衮服出即席南向坐太尉洗觶酌醴太師受醴祝曰云云殿中監奉饌在位者再拜禮記疏玉藻云玄冠朱組纓天子之冠也鄭注始冠之冠也是天子别有冠禮皇氏云天子元子惟冠同於士後魏志司馬彪云漢帝有四冠一緇布二進賢三武辨四通天冠裴頠作冠儀不知有四家語冠頌篇四加冠公也本支百世有秩斯祜申錫無疆承天右序帝眷明德錫兹祚嗣諏日惟吉爰舉嘉事邦家之慶金相玉質君親臨之威儀孔秩膺此嘉禮維新厥德鼓鐘喤喤威儀抑抑陳其清酒維尊及甒成以和奏崇牙植羽一人是臨威儀肅肅克成厥德申以百祿備禮三加其服奕奕正纚于朝允有成德磬管將將德成禮具永言保之申錫多祜體正色齊禮義以興既多受祉永觀厥成百禮既洽福祿成之樂章漢皇太子冠唐皇太子冠景紀後三年正月皇太子冠賜民為父後者爵一級元紀竟寧元年正月皇太子冠賜爵通典漢宣帝冠太子以正月五鳯元年賜丞相將軍列侯中二千石大夫夫人帛又賜列侯嗣子爵五大夫為父後者爵一級冠諸王遣使行事元延四年定陶王入朝成帝美其材為加元服而遣之元和元年千乘王冠章帝會中山邸詔黃香殿下顧謂諸王曰此天下無雙江夏黃童有下邳王衍建初初冠詔賜師傅已下官屬金帛各差魏氏冠太子再加晉太子冠臨軒使司徒加冠光祿大夫贊冠泰始七年正月丙午太子冠賜王公已下帛齊武帝從王儉議使太常持節一加冠大鴻臚為贊梁天監十四年正月乙巳朔臨軒冠太子於太極殿舊制太子逺遊冠金蟬翠緌纓詔加金博山唐貞觀五年正月有司言太子將行冠禮宜用二月上令改用十月八年二月三日乙巳太子加元服永徽六年二月五日太子加元服賜酺三日為父後者爵一級顯慶四年十月丙午十二日太子弘加元服赦天下開元八年正月十一日甲子太子加元服翼日乙丑謁太廟十三日丙寅宴百官太極殿制曰正于萬國祝以三加志皇太子加元服司徒為賓卿為贊冠有司設御幄於太極殿展縣設桉陳車輿皇帝服通天冠絳紗袍乘輿出自西房即御坐侍中曰將加冠於某之首公其將事至卿前曰公其贊冠賓再拜受制書皇帝入自東房賔贊出門以制書置于桉引以幡節威儀鐃吹及九品以上皆詣東宫朝堂冠日宫臣皆朝服集重明門外朝堂宗正卿乘車承傳在位者再拜左庶子稱禮畢匡衡上疏適子冠于祚禮之用醴衆子不得與所以貴正體明嫌疑也非虛加其禮文而已筮辰協吉撰禮備容宋孝武建平玉宏表史稱周頌之年傳記魯襄之禮粵若敬始謂之成人開成七年制稟瑞辰象儲靈日域玉英殊薏之玄貺日角山庭之峻格漢幄增輝堯門有赫佩觿之際聿彰明類之姿對日之初早振溫文之德進退可度周旋中規豁若淵沖之量端然玉粹之姿五勝之言蓋由異稟大成之度信出生知亨期俯協冠禮斯陳􅎡華纓而粲粲峩爵辨以斌斌啓嘉會於中闈動歡聲於紫宸正容體兮道昭備服順辭令兮誼協成人羲易考祥契黃離之元吉漢詩載美歌皓月之重輪觀吏牘以知逺朝寢門而竭忱晏殊皇太子冠禮賦祥符皇子冠禮祥符八年十二月戊寅承天節羣臣上夀是日皇子慶國公加冠禮輔臣面賀宗室賀於內東門司天言日輝珥直抱氣戊子集賢校理晏殊上皇子冠禮賦詔奬之辛卯進封夀春郡王制曰辨惠之性言必有章趨進之容動皆合禮維城之制載協周邦半楚之封尚遵漢牘會要近制加冠者止加烏紗折上巾不用開寶禮大觀二年八月十七日詔詳定皇太子冠禮十一月十七日親製冠禮沿革十一卷政和四年二月二日禮制局定皇長子冠禮十七日癸酉行禮於文德殿掌冠以禮部尚書贊冠以鴻臚卿列黃麾細仗於殿庭皇太子初行欽安之樂作祝曰咨爾元子肇冠於阼筮日擇賓德成禮具於萬斯年承天之祜乃冠折上巾順安之樂作祝曰爰即令辰申加元服崇學以齒三善皆得副豫一人受天百福乃冠逺遊冠懿安之樂作祝曰三加彌尊國本以正無疆惟休有室大競懋昭厥德保兹永命乃冠衮冕成安之樂作敕戒曰事親以孝接下以勤逺佞近義祿賢使能古訓是式大猷是經政和御製冠禮有後漢何休冠儀約制晉王堪冠禮儀寶祐二年九月癸亥詔皇子以日南至行冠禮十月癸酉進封忠王丁亥詔臣清叟為賓師彌主禮十一月壬寅行冠禮家語邾隱公將冠問禮於孔子子曰其禮如世子之冠雖天子之元子猶士也其禮無變天下無生而貴者也行冠事必於祖廟郊特牲疏大戴禮有公冠篇加玄冕為四加荀子天子諸侯子十九而冠冠而聼治禮記冠義冠者禮之始也古者聖王重冠冠禮筮日筮賓所以敬冠事敬冠事所以重禮重禮所以為國本故冠於阼以著代也醮於客位三加彌尊加有成也已冠而字之成人之道也見於母母拜之見於兄弟兄弟拜之成人而與為禮也玄冠玄端奠摯於君遂以摯見於鄉大夫鄉先生以成人見也成人之者將責成人禮焉故曰冠者禮之始嘉事之重者也古者行之於廟所以尊重事玉海卷八十二
