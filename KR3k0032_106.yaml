body:
  text: 玉海卷一百六宋王應麟撰音樂樂章御製樂章附樂章者聲依永律和聲也樂辭曰詩詩聲曰歌葛天氏歌八闋八曲上林賦聽葛天氏之歌注張揖曰葛天氏三皇時君號其樂三人持牛尾頭足以歌八曲一曰載氏二曰玄鳥三曰育草木四奮五榖五敬天常六徹帝功七依地徳八總禽獸之極師古曰見吕氏春秋李善曰本注以民為氏遂為育建為徹皆誤隋樂志葛天八闋吕氏春秋仲夏紀云昔葛天氏之樂三人捲一作摻一作持牛尾頭一投作以歌八闋一曰載民二曰玄鳥三曰遂草木四曰奮五榖五曰敬天常六曰建帝功七曰依地徳八曰得方外之極注一本總萬物之極文心雕龍鈞天九奏既具上帝葛天八闋爰及皇時昔葛天樂辭玄鳥在曲黄帝雲門理不空絃堯有大唐之歌舜有南風之詩觀其二文辭逹而已大禹成功九叙惟歌黄歌斷竹質之至也唐歌在昔則廣于黄丗虞歌卿雲文于唐時夏歌彫墻縟于虞代商周篇什麗于夏年徐景安樂書曰山海經云帝俊八子是始為歌故歌有八闋九序敬天常達帝功也書曰歌永言九叙惟歌韓詩云有章曲曰歌無章曲曰謡楚辭大招云伏戯駕辯楚勞商只古曲名韓非子師曠曰黄帝合鬼神於泰山之上作為清角禹康歌見貢賦類周九徳歌春官大司樂宗廟奏九徳之歌注春秋傳九功之徳皆可歌也疏此本大禹謨之言賈服先鄭並不見古文故引春秋宗廟用九徳之歌者以九徳為政之具瞽矇掌九徳六詩之歌以後大師漢志周官自卿大夫師瞽以下皆選有道徳之人朝夕習業以教國子學歌九徳注九功之徳誦六詩詩注曰古者教以詩樂誦之歌之弦之舞之左傳子産曰為九歌八風七音六律以奉五聲詩注明王使公卿獻詩以陳其志遂為工師之歌焉卷阿篇作是工師之誦崧髙篇書九功惟叙九叙惟歌勸之以九歌周九夏三夏祴夏見上春官大司樂王出入奏王夏尸出入奏肆夏牲出入奏昭夏注三夏皆樂章名疏三夏即下文九夏大射王出入奏王夏及射奏騶虞樂章名鐘師掌金奏金奏擊鐘以為奏樂之節金謂鐘及鎛凡樂事以鐘鼓奏九夏王夏肆夏昭夏納夏章夏齊夏族夏祴夏驁夏注以鐘鼔者先擊鐘次擊鼓以奏九夏夏大也樂之大歌有九故書納作内杜子春云内當作納祴讀為陔鼔之陔王出入奏王夏尸出入奏肆夏牲出入奏昭夏四方賔来奏納夏臣有功奏章夏夫人祭奏齊夏族人侍奏族夏客醉而出奏陔夏公出入奏驁夏肆夏詩也春秋襄公四年夏傳曰穆叔如晉晉侯享之金奏肆夏之三樂曲名不拜工歌文王之三又不拜歌鹿鳴之三三拜曰三夏天子所以享元侯也使臣不敢與聞劉炫曰杜解頗允杜預注云九夏其二曰肆夏一名樊三曰韶夏一名遏四曰納夏一名渠擊鐘而奏此三夏曲肆夏文王鹿鳴俱稱三謂其三章也國語曰金奏肆夏繁遏渠天子所以享元侯所謂三夏吕叔玉云肆夏繁遏渠皆周頌也肆夏時邁也繁遏執競傹也渠思文也肆遂也夏大也言遂於大位也故時邁曰肆于時夏允王保之繁多也遏止也言福祿止於周之多故執傹曰降福穰穣降福簡簡福祿来反渠大也言以后稷配天王道之大也故思文曰思文后稷克配彼天故國語謂之曰皆昭令徳以合好也玄謂以文王鹿鳴言之則九夏皆詩篇名頌之族類也此歌之大者載在樂章樂壊亦従而亡是以頌不能具疏大司樂王出入奏王夏尸出入奏肆夏牲出入奏昭夏注三夏皆樂章名奏納夏章夏齊夏族夏四夏皆無明文或子春别有所見故後鄭従之鄉飲鄉射燕禮大射賔醉将出皆奏陔恐其失禮故陔切之公出入奏驁夏者按大射云公入奏驁夏唐文粹有補九夏皮日休作九篇并序樂師教樂儀行以肆夏趨以采齊注司農云樂名或曰皆逸詩笙師注祴樂祴夏之樂夏官大馭凡馭路行以肆夏郊特牲賔入門而奏肆夏示易以敬也賔朝聘者出禮器其出也奏肆夏而送注謂諸侯之賔也大夫之奏肆夏也由趙文子始也正義案大射禮公升即席奏肆夏燕禮云若以樂納賔則賔及庭奏肆夏是諸侯之禮今文子亦奏之故云僭諸侯此謂納賔樂也若登歌下管正樂則天子用三夏以享元侯元侯相與亦得用之周禮九夏王夏者天子所用其餘八夏諸侯皆得用之其陔夏卿大夫亦得用之鄉飲酒客醉而出奏陔夏但非堂上正樂所用也詩時邁肆于時夏箋云樂歌之大者稱夏思文陳常于時夏箋云陳其常功於是夏而歌之夏之屬有九正義曰此與時邁皆周公所作俱云時夏則以此二者為大功故於樂為大歌也夏之屬有九即鐘師九夏也儀禮鄉射賔興樂正命奏陔燕禮賔及庭奏肆夏賔降奏陔大射儀賔降奏陔公入驁注其篇今亡大射儀公升即席奏肆夏注樂章名今亡吕叔玉曰肆夏時邁也太平祭山川之樂歌奏此以延賔其著宣王徳勸賢與周禮曰賔出入奏肆夏漢禮樂志皇帝入廟門奏永至猶古肆夏昭容樂猶古昭夏通典禹作大夏言禹能大堯舜之徳也禹命登扶氏為承夏之樂鐘以記其徳椎鼔以謀有道擊磬以待有憂揺鞉以察有訟理天下以五聲為銘於簨簴自禹立樂名多以夏名如九夏者當時歌詩之義在樂章者也周禮注三夏皆樂章名劉子辨樂篇通九歌之分注樂有九奏盖九夏也周禮疏王夏惟天子得奏其肆夏則諸侯亦得用故燕禮奏肆夏大夫已下不得用故郊特牲云大夫之奏肆夏由趙文子始其昭夏以下諸侯亦用之若天子享元侯升歌肆夏頌合大雅享五等諸侯升歌大雅合小雅享臣子歌小雅合鄉樂九夏本頌以其大而配樂歌之則為樂章亡在秦始皇之丗春秋正義三夏各有别名周禮謂之肆昭納魯語謂之繁遏渠王褒講徳論周公詠文王之徳而作清廟建為頌首後魏志有王夏肆夏之屬二十三曲猶得擊奏唐奏舒和代肆夏肅和代昭夏通典漢永至猶古肆夏昭容猶古昭夏劉敞曰春秋傳夏云金奏文王云工歌則夏非頌篇明矣九夏乃有聲而無辭者也周登歌徹歌六歌十二調春官樂師及徹帥學士而歌徹注徹者歌雍在周頌臣工之什疏帥學士使舞瞽人歌雍詩太師大祭祀帥瞽登歌令奏撃拊注歌者在堂貴人聲也拊形如鼔以韋為之小師大祭祀登歌擊拊下管擊應鼔徹歌大饗亦如之注拊者擊石於有司徹而歌雍疏鄉飲酒之屬升歌皆有瑟祭統聲莫重於升歌此周道也鄉飲酒義升歌三終笙入間歌合樂漢郊祀志周官天墬之祀凡六樂奏六歌而天墬神祇之物皆至隋志周制立二王三恪通已為六代之樂至四時祭祀則分而用之以六樂配十二調一代之樂則用二調詩清廟正義書傳說清廟之義云於穆周廟周公升歌文王之功烈徳澤茍在廟中嘗見文王者愀然如復見文王周禮六師教六詩六曰頌樂師帥學士歌徹謂歌雍也制禮之時得取頌詩為樂是制禮之前有頌也外傳引思文時邁皆言周文公之頌禮記每云升歌清廟祭宗廟之盛歌文王之徳莫重於清廟故為周頌之首其祭皆升堂歌之以為常曲周郊社歌周頌正義按今周頌云云頌之作也主為顯神明多由祭祀而為惟敬之小毖不言廟祀而承謀廟之下亦當於廟進戒求助但太平歌頌君徳亦有非祭祀者臣工有客烈文振鷺閔予小子小毖等皆不論神明之事今頌昊天有成命我将思文噫嘻載芟良耜及桓是郊社之歌也清廟維天之命維清天作執競雝武酌賚為祖廟之祭也烈文臣工振鷺豐年潜有瞽載見有客閔予小子訪落絲衣等雖有祖廟之事頌徳又與上異也時邁與般有望祭河嶽之事是山川之祭也周愷歌見樂類漢十九章歌鄒子樂樂府歌謡詩樂初詩郊廟詩歌禮樂志初髙帝既定天下過沛與故人父老相樂醉酒歡哀作風起之詩令沛中僮兒百二十人習而歌之沛吹鼓員十二人至孝惠時以沛宫為原廟皆令歌兒習吹以相和常以百二十人為員文景之間禮官肄業而已至孝武定郊祀之禮祠太一於甘泉就乾位也祭后土於汾陰澤中方丘也乃立樂府始置之也樂府之名盖起於此表樂府令丞屬少府志惠帝時有樂府令夏侯寛更安丗樂似非始於武帝采詩夜誦采詩者依遒人徇路采取謳謡以知政教得失也夜誦者具言不可宣露故于夜中歌誦之有趙代秦楚之謳以李延年為協律都尉多舉司馬相如等數十人造為詩賦略論律吕以合八音之調作十九章之歌以正月上辛用事甘泉圜丘使童男女七十人俱歌昏祠至明夜常有神光如流星止集於祠壇天子自竹宫而望拜竹宫去壇三里百官侍祠者數百人皆肅然動心焉十九章練時日帝臨青陽朱明西顥玄㝠並鄒子樂惟泰元建始元年匡衡定天地匡衡定日出入天馬元狩三年馬生渥洼太初四年宛馬至天門景星元鼎五年得鼎齊房元封二年芝生甘泉后皇華煜煜五神朝隴首元狩元年白麟象載瑜太始三年赤雁赤蛟已上摠十九章天馬二篇其餘廵狩福應之事不序郊廟故弗論今漢郊廟詩歌未有祖宗之事八音調均又不協於鍾律志泰一雜甘泉夀宫歌詩十四篇宗廟歌詩五篇史記樂書今上即位作十九章令侍中李延年次序其聲拜為協律都尉通一經之士不能獨知其辭皆集會五經家相與共講習讀之乃能通知其意藝文志自孝武立樂府而采歌謡於是有趙代之謳秦楚之風皆感於哀樂縁事而發亦可以觀風俗知厚薄云呉楚汝南歌十五篇淮南歌詩四篇左馮翊秦歌詩四篇南郡歌詩五篇京兆秦歌詩五篇此秦楚之風也燕代謳雁門雲中隴西歌詩九篇邯鄲河間四篇河東蒲反一篇此趙代之謳也而雒陽歌詩四篇河南周歌詩七篇周謡七十五篇附焉凡歌詩二十八家二百十四篇武紀賛恊音律作詩樂李延年傳善歌為新變聲上方興天地祠欲造樂令司馬相如等作詩頌延年弦歌所造詩為之新聲曲為協律都尉史記李延年傳弦次初詩紀宣帝詔曰孝武躬仁誼珍貢陳於宗廟恊音律造樂歌薦上帝本始四年正月減樂府人使歸就農業元帝元初元年減樂府員京房知六律雜試于樂府哀帝罷樂府孔光奏罷四百四十一人正樂定員惟置三百八十八人晉志賀循云和以鍾律文之以五聲詠於歌辭陳於舞列宫縣在庭琴瑟在堂八音迭奏雅樂並作登歌下管各有常詠周人之舊也漢氏已来依倣此禮自造新詩而已張華表云漢氏所用文句長短不齊隋志叔孫通定篇章祠宗廟武帝裁音律之響定郊丘之祭頗雜謳謡非全雅什晉志凡樂章古辭今之存者並漢丗街陌謡謳江南歌採蓮之屬是也漢登歌九歌雅歌百官詩頌又見上禮樂志髙祖時叔孫通制宗廟樂乾豆上奏登歌明紀永平二年十月壬子養老詔升歌鹿鳴下管新宫章紀永平十八年十二月癸巳有司奏孝明作登歌正予樂祭祀志注登歌八佾舞名隋樂志漢明帝時樂有四品又採百官詩頌以為登歌十月吉辰始用蒸祭郊祀歌天地章九歌畢奏東都賦歌九功七略曰漢興魯人虞公善雅歌發聲盡動梁上塵祭遵傳投壺雅歌齊志南郊樂舞歌辭二漢同用五郊並奏之漢食舉樂十三曲蔡邕禮樂志章帝親著歌詩四章列在食舉一曰思齊姚皇二曰六騏驎三曰竭肅雍四曰涉叶相故事有鹿鳴承元氣二曲合帝作四篇為六以為宗廟食舉重来上陵二曲合八曲為上陵食舉減承元氣一曲加惟天之命天之厯數二曲為殿中食舉通典漢享宴食舉樂十三曲一曰鹿鳴二曰重来三曰初筵造四曰侠安五曰歸来六曰逺期七曰有所思八曰明星九曰清涼十曰涉大海十一曰大置酒十二曰承元氣十三曰海淡淡雅樂郎郭瓊云明帝魏青龍二年以長笛食舉第十二古大置酒曲代四會又易古詩名曰羽觴行鹿鳴以下十二曲名食舉樂漢故事鄧呉及瓊等食舉之曲與時増損又見上夀類漢鼓吹鐃歌宋志漢鼓吹鐃歌十八曲朱鷺思悲翁艾如張上之囬擁離戰城南巫山髙上陵将進酒君馬黄芳樹有所思雉子聖人出上邪臨髙臺逺如期石留按古今樂錄皆聲辭相雜不可復分漢志有漢興以來兵所誅滅歌詩十四篇魏鼔吹曲宋志魏鼔吹曲十二篇繆襲造初之平戰滎陽獲吕布克官渡舊邦定武功屠栁城平南荆平關中應帝期邕熈太和呉鼔吹曲十二篇韋昭造炎精缺漢之季攄武師烏林秋風克皖城關背徳通荆門章洪徳従厯數承天命玄化今鼓吹鐃歌曲四解上邪九解晚芝漢曲有逺期疑是三解艾張何承天義熈中私造鼔吹鐃歌十五篇朱路至石流今鼓吹鐃歌雖有章曲樂人傳習所務者聲不先訓以義今樂府鐃歌校漢魏舊曲曲名時同文字永異尋文求義無一可了不知鐃章何代曲也魏韋誕景福殿賦教坊講肄才士布列新詩變聲曲調殊别吟清商之激哇發角徴與白雪晉短簫鐃歌志漢時有短簫鐃歌之樂其曲有朱鷺等二十二篇魏改其十二楚之平至太和使繆襲為詞述以功徳代漢呉亦使韋昭製十二曲名以述功徳受命炎精缺至玄化孫休丗及武帝受禪乃令傅玄製為二十二篇述以功徳代魏改朱鷺為靈之祥思悲翁為宣受命艾如張為征遼東上之回為宣輔政雍離為時運多難戰城南為景龍飛巫山髙為平玉衡上陵為文皇統百揆将進酒為因時運有所思為惟庸蜀芳樹為天序上邪為大晉承運期君馬黄為金靈運雉子班為於穆我皇聖人出為仲春振旅臨髙臺為夏苗田逺如期為仲秋獮田石留為順天道務成為唐堯黄爵行為伯益玄雲釣竿依舊名皆頌宣景文及晉徳其辭列於志晉郊祀明堂樂章郊廟朝享禮樂宗廟歌詩志武帝泰始二年詔郊禮明堂禮樂權用魏儀遵周室肇稱殷禮之義但改樂章使傅玄為之詞有祠天地五郊夕牲迎送神饗天地五郊天地郊明堂夕牲降神饗神祠廟夕牲迎送神歌祠征西将軍豫章潁川京兆府君宣景文帝登歌祠廟饗神歌二篇凡十九篇太元中四廂金石始備使曹毗王珣等增造宗廟歌詩曹毗歌宣帝至四時祠祀十一首王珣歌簡文孝武二首裴頠傳頠令荀藩終父朂之意鑄鐘鑿磬以備郊廟朝享禮樂宋志泰始初傅玄作晉郊廟歌詩三十二篇江左宗廟歌十三篇晉郊祀歌五篇傅玄造宋南郊雅樂登歌三篇顔延之造明堂歌謝荘造元嘉二十二年南郊始設登歌通典齊建元二年有司奏郊廟雅樂歌辭太廟登歌褚淵之辭餘悉用謝超宗辭超宗刪顔延之謝荘辭為新曲太廟二室及郊配辭王儉作晉食舉樂歌詩樂府歌詩燕樂歌辭志晉初食舉亦用鹿鳴至泰和五年尚書奏使太僕傅玄中書監荀朂黄門侍郎張華各造正旦行禮及王公上夀酒食舉樂歌詩荀朂云魏氏食舉再取鹿鳴以為樂章鹿鳴以宴嘉賔無取於朝朂乃除鹿鳴舊歌更上行禮詩四篇先陳三朝朝宗之義又為正旦大會王公上夀歌詩并食舉樂歌詩合十三篇又以魏氏歌詩或二言三言四言五言與古詩不類以問司律中郎将陳頎曰被之金石未必皆當陳頎曰叔孫通所制漢儀無别行禮事羣后奉璧趨走拜起莫非行禮豈容别設一樂謂之行禮邪故朂造晉歌皆為四言惟王公上夀酒一篇為三言五言焉張華以為魏上夀食舉詩及漢代所施用其文句長短不齊盖以依詠絃節本有因循三代二京襲而不變是以一皆因就不敢改易時又詔中書侍郎成公綏亦作焉四廂樂歌有成公綏正旦大會行禮歌宋志十六篇荀朂正旦大會王公上夀酒歌食舉樂東西廂歌宋志十七篇張華冬至初嵗小會歌宴會歌命将出征歌勞還師歌中宫所歌宗親會歌隋志晉歌章十卷晉歌詩十八卷晉讌樂歌辭十卷荀朂撰唐志荀朂太樂雜歌辭三卷又大樂歌辭二卷樂府歌詩十卷晉四廂樂歌宋四廂樂歌宋志晉四廂樂歌三首傅玄造天鑒大會行禮舉於赫上夀天命食東西箱晉四箱樂歌十七篇荀朂造正旦大會行禮歌四篇於皇當於赫明明當巍巍元邦國當洋洋食祖宗當鹿鳴歌王公上夀歌一篇踐辰當觴行舉樂東西箱十二篇煌煌當鹿鳴烈賔之初筵當於穆當三后當昭昭當赫矣當華華文當朝宴猗歟盛徳隆化綏萬邦宴振鷺當朝朝時翼翼當順天當陟天庭雍當参両儀既㑹嘉正徳大豫二舞歌二篇荀朂造又二篇傅玄造又二篇張華造晉四箱樂歌十六篇張華造王公上夀詩十章正食舉東西箱樂詩十一章雜樂旦大㑹行禮詩四章晉四箱歌十六篇成公綏造上夀一章行禮十五章宋四箱樂歌五篇王韶之造肆夏四章大㑹行禮歌二章上夀一章殿前登歌三章王公食舉歌十章宋前舞後舞歌二篇王韶之造宋武永初元年七月建廟祀太常鄭鮮之等八十八人各撰立新歌黄門侍郎王韶之撰歌辭七首十二月又奏正旦設樂改太樂諸歌舞詩韶之立三十二章宋泰始歌舞曲辭皇業頌歌自堯至楚元王髙祖明帝造聖祖頌明君大雅虞龢造通國風明帝造天符頌明徳頌明帝造帝圖頌龍躍大雅淮祥風宋丗大雅虞龢造治兵大雅明帝造白紵篇大雅明帝造後魏樂府曲名通典太樂令崔九龍言于太常卿祖瑩曰聲有七聲調有七調以今七調合之七律起於黄鍾終於中吕今古雜曲隨調舉之将五百曲恐諸曲名後致亡失今輙條記存之樂府瑩依而正之所錄或雅或鄭至於謡俗四夷雜歌但記其聲折不能知其本意至於古雅多亡失隋雅樂歌辭志先是李元操盧思道等製清廟歌辭十二曲以代周歌仁夀元年詔牛弘栁顧言等製雅樂歌辭有昭夏皇夏誠夏需夏肆夏五禮精義云隋制八夏五引并房中之樂合十五曲唐貞觀樂章顯慶會要祭神州地祇樂章三貞觀十七年蕭璟作也社稷樂章四十七年于志寜作也祀五帝樂章十五顯慶元年于志寜作也祭先農樂章三先蠶二顯慶三年郭瑜作也釋奠文宣廟樂章八顯慶三年范頵等作也羣官行奏舒和上公上夀奏休和五年李義府作也餘見前祭風師樂章四雨師雷師五貞元六年包佶作也武成廟樂章五貞元六年于邵作也蜡祭百神樂章四許敬宗作也朝日樂章三顯慶元年許敬宗作也乾元元年徐浩又撰舊志冬至祀天樂章八首豫和至送神貞觀六年褚亮虞丗南魏徴等作正月上辛祈榖八首季秋享明堂十八首孟夏雩祀上帝八首祀五方帝四十首祀朝日八首夕月八首蜡百神八首夏至祭地祇八首祭社八首享太廟十三首並貞觀中褚亮等作又有享先農樂章唐清樂六十三曲正聲樂調漢清樂志所謂俗樂者二十有八調俗部諸曲悉源於雅樂周隋管絃雜曲數百皆西涼樂也鼓舞曲皆龜兹樂也惟琴工猶傳楚漢舊聲又清調蔡邕五弄楚調四弄謂之九弄隋亡清樂缺存者纔六十三曲其後傳者平調清調白雪公莫舞巴渝明君明之君鐸舞白鳩白紵至後庭花堂堂泛龍舟又有呉聲四時歌雅歌上林鳯雛平折命嘯等曲其聲辭訛失十不傳其一二百官志唐并清商鼔吹為一局増令一人尉遲敬徳傳奏清商樂韓非子曰師涓鼓新聲曰清商通典清樂者其始即清商三調是也並漢氏以来舊典樂器形制并歌章古調與魏三祖所作者皆備于史籍隋平陳獲之更造樂器因置清商署總謂之清樂唐武后時猶六十三曲今其調存者有白雪公莫舞巴渝至泛龍舟等三十二曲明之君雅歌各二首四時歌四首合三十七曲又七曲有聲無詞上林鳯雛平調清調瑟調平折命嘯通前為四十四曲存焉従容雅緩猶有古士君子之遺風自長安以後朝廷不重古曲工伎轉缺能合管絃者惟明君等八曲舊樂章多或數百言明君尚四十言今所傳二十六言訛失與呉音轉逺清樂雅歌一曲詞典而音雅會要同藝文志竇璡正聲樂調一卷璡武徳中定雅樂聲舊史云璡撰正調一卷唐鼔吹七十五曲鐃歌鼔吹曲儀衛志凡鼔吹五部一鼔吹二羽葆三鐃吹四大横吹五小横吹總七十五曲鼔吹部掆鼔十曲驚雷振至波蕩壑大鼓十五曲嚴用三曲元驎合邏至元驎䟦至慮警用十二曲元咳大至逰至賀栗胡真小鼓九曲漁陽至單搖長鳴一曲三聲中鳴一曲三聲羽葆部十八曲太和至破陣樂鐃吹部七曲破陣樂至太平大横吹部有節鼓二十四曲悲風至沈湘小横吹部有角笛簫笳觱篥六種曲名失傳六典鼓吹令凡大駕行幸鹵簿分前後二部以統之法駕三分減一小駕減半皇太子鼓吹亦有前後二部親王以下各有差凡大駕行幸有夜警晨嚴之制夜警十二曲中警七曲晨嚴三通五代㑹要崔梲云周禮鼓人掌六鼓四金漢有黄門鼓吹崔豹古今注云因張騫使西域得摩訶兠勒一曲李延年増之分為二十八曲梁置鼓吹清商令唐有鼓吹十二按太享㑹設於懸外隋志鼓吹宋齊並用漢曲又充庭用十六曲梁去四曲留其十二更制新歌述功徳北齊二十曲皆改古名藝文志漢魏呉晉鼓吹曲四卷鼓吹樂章一卷樂志北狄樂皆馬上之聲自漢後以為鼓吹亦軍中樂馬上奏之故隸鼓吹署禮志四夷来朝鼔吹令設十二按講武日三嚴射前一日鼔吹令設十二按於射殿之庭通典臨軒冊命太子鼔吹令設十二按於建鼔之外桞宗元鐃歌鼓吹曲十二篇晉陽武獸之窮戰武牢涇水黄奔鯨沛苞枿河右平鐵山碎靖本邦吐谷渾髙昌東蠻序云漢魏以來代有鐃歌鼓吹詞惟唐獨無有太常鼔吹有戎樂詞獨不列今考漢曲十二篇魏曲十四篇晉曲十六篇漢歌詞不明紀功徳魏晉歌功徳具臣竊取魏晉義用漢篇數為唐鐃歌鼓吹曲紀髙祖太宗功能之神竒因以知取天下之勤勞每有戎事治兵振旅幸歌臣詞以為容通典後周宣帝改前代鼓吹朱鷺等曲製為十五曲述受魏禅及戰功之事應劭漢鹵簿圖唯有騎執箛箛即笳不云鼓吹而漢代有黄門鼓吹漢享燕食舉樂十三曲與魏代鼔吹長簫短簫伎錄並云絲竹合作執節者歌又建初錄云務成黄爵玄雲逺期皆騎吹曲此則列於殿庭者為鼓吹今之従行鼔吹為騎吹二曲異也魏晉以鼓吹甚輕牙門督将五校悉有鼔吹齊梁至陳則甚重各製曲詞以頌功徳宋志同禮鼔人注司馬法曰昏鼓四通為大鼜夜半三通為晨戒旦明五通為發明李徳裕有鼓吹賦序云軒皇因出師而作前代将帥有功即假之陸機有鼔吹賦唐英雄樂曲宗調四曲志太宗時云云其後因内宴詔長孫無忌製傾盃曲魏徴製樂社樂曲虞丗南製英雄樂曲又命樂工製黄驄疊曲四曲皆宫調也唐郊廟燕會樂曲咸亨樂章韋萬石傳萬石善音律上元中遷太常少卿當時郊廟燕會樂曲皆萬石與太史令姚元辨増損之會要咸亨四年十一月十五日丙寅上自製樂章十四首有上元二儀三才四時五行六律七政八風九宫十洲得一慶雲之曲乾元元年三月二十八日上造樂章三十一章送太常郊廟歌之李紓傳奉詔為郊廟樂章會要饗徳明興聖皇帝廟樂章九饗讓皇帝廟樂章六吏部侍郎李紓撰唐開元樂章舊志貞觀六年詔褚亮虞丗南魏徴分制樂章武后多改易開元十三年詔張說改定樂章上自定聲度說為之辭令樂工習於集賢院會要云數月而畢因定禪廟詞曲及舞然雜用貞觀舊辭二十五年太常卿韋縚令博士韋逌直大樂季尚冲樂正沈元福等叙次前後樂章為五卷付大樂鼔吹令工人習之太常舊相傳有燕樂五調歌詞各一卷或云貞觀中侍中楊恭仁成趙方等所集詞多鄭衛至是縚又令太常令孫玄整比為七卷人多不能通相傳謂之法典會要夏至祭地祇樂章三開元十二年賀知章作也祭龍池樂章十開元元年姚崇等作也元日冬至朝會樂章七開元十三年源乾曜作也詳見雅樂玄元皇帝樂章十一會要所載太常樂章自玄元皇帝至鄉飲大射郊祀樂章譜二卷張説王涇唐朝會樂章會要太常樂章殿廷元日冬至朝會樂章七元日迎送皇帝奏太和開元十三年侍中源乾曜作也羣官行奏舒和上公上夀奏休和顯慶五年侍郎李義府作也皇帝受酒登歌奏昭和太子受酒登歌同中宫朝會樂章四正和再奏東宫朝會樂章五迎送奏永和李義府作也唐霓裳羽衣曲按樂圖金風樂君臣相遇樂志玄宗為平王有㪚樂一部及即位命寜王主於蓬莱宫側居新聲散樂倡優之技其後河西節度使楊敬忠獻霓裳羽衣曲十二遍凡曲終必遽惟霓裳羽衣曲将畢引聲益緩帝方寖喜神仙之事詔道士司馬承楨製玄真道曲茅山道士李會元製大羅天曲工部侍郎賀知章製紫清上聖道曲太清宫成太常卿韋縚製景雲九真紫極小長夀承天順天樂六曲又製商調君臣相遇樂曲王維傳有以按樂圖示者無題識維曰此霓裳第三疊最初拍也會要林鍾宫時號道調道曲髙宗製道調散樂歴代有之謂之百戯貞觀二十三年十二月詔太常留二百人餘並放還玄宗以其非正聲置教坊於禁中以䖏之若饗會先一日具坐立部樂名太常上奏御注其下會日先奏坐部伎次奏立部伎次奏蹀馬又奏散樂天寳十三載七月十日改諸樂名太蔟宫商羽角林鍾商羽角黄鍾商羽中吕商南吕商金風調金華洞真至流芳菲以新曲名立石刋於太常寺頒示中外通鑑開元二年正月舊制雅俗之樂皆隸太常上精曉音律以太常禮樂之司不應典雜伎更置左右教坊以教俗樂命范及為之使一云置教坊於蓬䒹宫合左右而隸焉書目玄宗金風樂弄一卷志無弄字載琴音第一第二第三拍宫調指法又明皇操黄鍾羽調一首附卷後唐法曲宜春北院雲韶府仙韶院曲志初隋有法曲其音清而近雅其器有鐃鈸鐘磬幢簫琵琶其聲金石絲竹以次作隋煬帝厭其聲淡曲終復加解音玄宗既知音律又酷愛法曲選坐部子弟三百教於梨園聲有誤者帝必覺而正之號皇帝梨園弟子宫女數百亦為梨園弟子居宜春北院梨園法部更置小部音聲三十餘人通鑑開元二年選樂工數百人自教法曲於梨園又教宫女使習之又置宜春院張廷珪袁楚客上疏以恱鄭聲為戒天寳中帝幸驪山楊貴妃生日命小部張樂長生殿因奏新曲未有名會南方進荔枝因名曰荔枝香開元二十四年升胡部於堂上而天寳樂曲皆以邉地名若凉州伊州甘州之類後又詔道調法曲與胡部新聲合作會要太常梨園别教院法歌樂章曲等王昭君思歸傾盃破陣聖明五更轉後庭花泛龍舟萬嵗長生飲酒鬭百草百官志太樂令二人丞一人樂正八人武徳後置内教坊於禁中武后如意元年改曰雲韶府以中官為使開元二年又置内教坊於蓬莱宫側有音聲博士京都置左右教坊掌俳優雜伎自是不隸太常以中官為教坊使散樂三百八十二人仗内散樂一千人音聲人一萬二十七人有别教院開成三年改法曲所䖏院曰仙韶院舊史開成三年四月己酉改法曲為仙韶曲以所䖏為仙韶院實錄開元十二年正月戊寅勅曰自立雲韶内府百餘年今欲陳於萬姓與羣公同樂開成三年十月甲午以仙韶院樂賜羣臣宴曲江亭列傳李賀為恊律郎樂府數十篇雲韶諸工皆合之絃管王起為太子太師詔月益仙韶院錢三十萬紀徳宗大厯十四年閏五月癸未罷梨園樂工三百人憲宗永貞元年九月己巳罷教坊樂工正員官文宗即位十二月庚申省教坊樂工冗員宣宗大中元年二月癸未以旱罷太常教坊習樂唐雲韶樂圖仙韶曲開元雅樂志文宗好雅樂詔太常卿馮定采開元雅樂製雲韶法曲及霓裳羽衣舞曲雲韶樂有玉磬四簴琴瑟筑簫篪籥䟦膝笙竽皆一登歌四人分立堂上下童子五人繡衣執金蓮花以導舞者三百人階下設錦筵遇内宴乃奏謂大臣曰笙磬同音沈吟忘味不圖為樂至於斯也自是臣下功高者輒賜之樂成改法曲為仙韶曲會要雲韶樂章二十章上雲自然真仙明聖難思平珠無為有道調元立政獻夀髙明聞天儀鳯同和閑雅多稼金鏡曲太和八年十月令太常閲習雲韶樂樂成獻諸梨園亭帝按之會昌殿開成元年十月教成太常卿李程進上慶成節宴延英殿令奏雲韶樂三年武徳司奉宣索雲韶樂懸圖二軸進上長安志文宗幸梨園令太常卿王涯取開元雅樂選樂童按之名雲韶樂馮定傳遷太常少卿文宗嘗詔開元霓裳羽衣舞参以雲韶肄於廷定部諸工立於懸間端凝若樹帝異之召升殿賜禁中瑞錦李固言傳太和中節度西川詔以雲韶雅樂即臨臯館送之邵軫雲韶樂賦羣臣獻華封之夀天子御薰絃之琴唐玉宸宫調志凉州曲本西涼所獻也其聲本宫調有大遍小遍貞元初樂工康崑崙寓其聲於琵琶奏於玉宸殿因號玉宸宫調合諸樂則用黄鍾宫髙宗自以李氏老子之後也命樂工製道調通典西涼伎晉初舊聲魏太武平涼所得也唐定難樂曲舊紀貞元三年四月庚午御麟徳殿試定難樂曲馬燧所獻唐萬斯年曲志武宗會昌初宰相李徳裕命樂工製萬斯年曲以獻唐播皇猷葱嶺西曲大中新曲志大中初太常樂工五千餘人俗樂一千五百餘人宣宗每宴羣臣備百戯帝製新曲教女伶數十百人衣珠翠緹繡連袂而歌其樂有播皇猷之曲舞者髙冠方履褒衣博帯趨走俯仰中於規矩又有葱嶺西曲士女蹹歌為隊其詞言葱嶺之民樂河湟故地歸唐也唐樂府古今題解藝文志呉兢樂府古今題要解一卷書目二卷郗昻樂府古今題解三卷一作王昌齡十書目一卷凡釋二八題段安節樂府雜錄一卷書目一卷雜記雅樂雜樂朝樂之制元稹樂府古題序詩之流為二十四名由詩而下十七名盡編為樂府等題書目有沈建樂府廣題二卷上卷述闕言至十一言詩句下卷釋樂章命題之意建隆十二樂章見前樂類建隆長春樂曲乾徳萬嵗升平樂國初教坊凡四部其後平荆蜀江南太原四方執藝者皆在籍中建隆中教坊李徳昇作長春樂曲乾徳元年又作萬嵗升平樂曲明年郭延羙又作紫雲長夀曲乾徳鼓吹曲建隆四年九月五日詔選樂工八百三十人隸太常習鼓吹張昭傳乾徳元年郊祀為鹵簿使奏復宫廟門郊壇夜警晨嚴之制乾徳六年十月二十七日和峴言郊祀有夜警晨嚴六州十二時及鼔吹迴仗時駕前導引三曲望撰樂章肄習従之親饗太廟奉上尊號冊寳鼔吹二百三十六人祔廟用一百三十人鼔吹警場諸工凡一千一百五十九人隆興二年三分減一國朝大駕鹵簿六引官開封令無鼔吹開封牧二十三人太常卿同司徒六十四人御史大夫兵部尚書同開封牧大駕鹵簿及六引用鼔吹八百八十四人法駕三分減一鼔吹五百八十八人紹興中太常奏大駕前部千六百四人鼔吹令二棡鼔金鉦各十二長鳴百二十鐃鼓十二歌拱宸管或以巢篥充簫笳各二十四大横吹百二十節鼓二笛簫篳篥笳桃皮篳篥各二十四棡鼓金鉦各十二小鼓長鳴各百二十羽葆鼓十二簫笳各二十四後部四百八十人羽葆鼓十二簫二十四笳二十四鐃鼓十二簫笳各二十四小横吹百二十笛篳篥笳各二十四若親祠則宣徳門太廟南郊警場千一百十六人嚴更警場舊制嚴鼔一百二十四金鉦二十四鳴角一百二十紹興十三年止用鼔角各六十金鉦二十凡大駕鼓吹通五引用工千五百三十法駕三分損一用二引小駕八百十六工凡大樂充庭則鼓吹局設熊羆十二案於宫懸之外凡大角三曲警嚴用之鼓吹五曲御製奉禋歌舊曲六州十二時導引降仙臺其餘大小鼓横吹曲悉不傳唐末舊聲皆盡惟大角傳三曲其鼓吹四曲用教坊新聲車駕出入奏導引及降仙臺警嚴奏六州十二時皆隨月用宫仁宗定雅樂并及鼔吹且謂警嚴一奏不應再用其曲減導引二曲親製奉禋歌以備三疊又詔聶冠卿李照造詞配聲下太常肄之是年郊祀用焉天聖八年五月己未詔以鼔角匠置武嚴指揮肄太常景祐二年八月辛酉御製警嚴曲名曰振容歌十月乙卯改奉禋皇祐二年享明堂御製合宫歌用黄鍾宫八月乙卯朔罷前一夕警場本古之鼔鼜所謂夜戒守鼔王者師行吉行皆用之政和七年三月一日議禮局言鼓吹惟備警衛未有鐃歌之曲請詔儒臣撰述凡王師大獻具奏以聳羣聽詔可十二月改六州為崇明祀十二時為稱吉禮導引為熈事備成崇寜四年置大晟府總之乾徳五瑞樂四瑞樂淳化五瑞曲祥符五瑞曲祥瑞樂章曲天聖三瑞乾徳四年十月己卯㑹要一本云十九日當審和峴言唐貞觀十四年景雲見河水清張文收采古朱鴈天馬之義制景雲河清歌名曰讌樂元會第二奏者是也伏見今年荆南進甘露京兆果州進嘉禾黄州進紫芝和州進綠毛龜黄州進白兎欲依月律撰神龜甘露紫芝嘉禾玉兎五瑞各一曲毎朝會登歌首奏之六年十月二十九日會要一本云二十七日峴又言漢獲天馬赤雁神鼎白麟之瑞並為郊歌國朝合州進瑞木成文馴象由南方自至秦州獲白烏黄州獲白雀並合播在管絃薦於郊廟詔峴作瑞文馴象玉烏皓雀四瑞樂章以備登歌太平興國九年十月十四日嵐州獻祥麟雍熈中蘇州貢白龜端拱初澶州河清廣州鳯凰集諸州麥三穗兩穗者連嵗来上有司請以此五瑞為祥麟丹鳯河清白龜瑞麥之曲薦於朝會樂志同淳化三年正月丙申朔御朝元殿羣臣上夀登歌五瑞曲直集賢院和㠓又請以祥瑞之殊尤者作為四瑞樂章備郊廟奠獻以代舊曲有司奉詔而竟不行今闕其曲會要正至朝㑹乾徳四年撰二十四曲白龜曲曰聖徳昭宜神龜出焉名符在沼瑞應巢蓮甘露曲曰其甘如醴其凝如珠雲表潛結顥英允敷紫芝曲曰蒲茸奪色銅池著名晨敷表異三秀分榮嘉禾曲曰嘉彼合穎致貢昇平異標南畝瑞應西成玉兔曲曰明視標奇昌辰乃見毓質雪園淪精月殿淳化元年撰二十三曲祥麟曲曰在郊毓質㳺畤呈祥丹鳯曲曰九苞薦瑞戴徳膺仁河清曲曰清應寳運光涵帝居洞分沈璧徹見㳺魚白龜曲曰浮石可躡巢蓮益光金方正色介族殊祥瑞麥曲曰芃芃嘉麥擢秀分岐祥符元年諸臣撰進五曲醴泉曲曰地不愛寳其甘如醴祥芝曲曰彼茁者芝茂英煌煌慶雲曲曰紛紛郁郁五色成章靈鶴曲曰翻翰来儀徘徊嘹唳瑞木曲曰連理效祥成文表徳景徳三年撰祥麟丹鳯河清之曲天聖四年十二月戊戌撰元日御殿樂章三曲學士院上之甘露曲曰神靈播液氷玉凝姿瑞木成文曲曰宛成洛畫粲若奎躔嘉禾曲曰秀標同穎祥掩幷柯五年正月壬寅朔上皇太后夀於會慶殿明道二年二月太后朝饗有玉芝夀星奇木連理之曲治平四年撰三曲靈芝曲曰紫盖輪囷金跗煒煌陽寥三秀甘泉九房嘉禾曲曰大田如雲既穫既刈慶雲曲曰融為和氣發為祥光熈寜三年冬至撰三曲慶雲曲曰爰施慶雲承日五色輪囷下垂萬物皆飾嘉禾曲曰彼羙嘉禾一莖九穗靈芝曲曰慶祥回復秀發神芝哲宗朝大朝會撰三曲靈芝夀星甘露受傳國寳制三樂章元符元年四月十八日詔學士院撰二十三日上之一受命永昌二神光三翔鶴大朝會上夀亦用之紹興十五年正旦朝會十二曲有瑞木成文滄海澄清瑞粟呈祥之曲二十五年八月十七日癸亥許興古言靈芝生廟楹瑞麥秀留都宜製樂章登歌郊廟詔可開寳簫韶部雲韶部開寳中平嶺表擇廣州内臣之聰警者得八十人令於教坊習樂藝賜名簫韶部雍熈初改曰雲韶部奏大曲十三後不復補太宗親製樂曲又見御集太宗天縦多能洞曉音律前後親製大小曲及因舊曲創新聲者總三百九十凡製大曲十八曲破二十九小曲二百七十因舊曲造新聲者五十八若宇宙賀皇恩降聖萬年春之類皆藩邸所作以述太祖羙徳而平晉普天樂者平河東回所造萬國朝天樂者又明年所造毎宴饗常用之志云凡新奏十七調總四十八曲又法曲龜兹鼔笛三部凡二十四曲祥符六年四月己卯召輔臣至龍圖閣宣示太宗御製曲名三百九十六付修史院淳化鈞容樂太平興國三年詔籍軍中善樂者命曰引龍直毎㳺幸親征則騎導而奏樂若御樓觀燈賜酺賞花習射觀稼亦同應奉端拱二年又増其數淳化三年改曰鈞容樂取鈞天之義舊奏十六調凡三十六大曲鼓笛二十一曲并他曲甚衆祥符五年增龜兹部又有東西班樂亦太平興國中選習樂者嘉祐二年罷鈞容舊十六調取教坊十七調肄習淳化鄉飲樂章淳化三年正月七日詔有司講求鄉飲酒故事将議舉行命學士承㫖蘇易簡等依古樂章作鹿鳴南陔嘉魚崇丘關雎鵲巢之詩後不果行所撰樂章凡三十四章鹿鳴六南陔二嘉魚八崇丘二關雎十鵲巢六政和二年九月二十五日頒鹿鳴宴樂章五曲樂育人材賢賢好徳烝我髦士利用賔王唐鄉飲樂章十七大射樂章四祥符封禪樂章祥瑞樂章祥符元年正月丙寅判太常李宗諤上奉迎天書酌獻瑞文樂章六月己亥上朝拜天書瑞文曲丙午學士院上登歌瑞文樂章二首壬子以酌獻上帝地祇禧安之樂為封安禪安皇帝飲福為祺安之樂禮畢仍舊十二月己酉二十三日詔别製天書樂章又取天書降及議封禪以来祥瑞尤異者别撰樂曲樂章以備朝㑹燕饗太常請郊祀酌獻天書用瑞安曲天書升降用靈安曲朝饗用醴泉神芝慶雲靈鶴瑞木五曲詔近臣撰詞見上作志云五曲施于朝㑹宴享以紀瑞物之應祥符瑞雲樂章祥符七年二月乙丒學士院上應天府瑞雲樂章一首先是正月丁酉上奉老君寳冊真安大安樂章乙卯次應天府天書升輦五色雲黄雲翔輅而行扶侍使趙安仁請播為樂章以備酌獻志景徳四年八月詔太祠並用樂皆同感帝六變八變如通禮祥符元年判禮院孫奭言郊祀錄載登歌徹豆一章奏無射羽詔李宗諤等議言國初撰樂章有徹豆豐安曲因循不作望如奭奏從之十月習封禪儀於崇徳殿覩亞終獻皆不作樂令檢討故事有司言凖親祠例無用樂之文特詔亞終獻用登歌五年聖祖降有司言按唐太清宫樂章皆明皇親製其崇奉玉皇聖祖及祖宗配位樂章並望聖制詔可之又制薦獻聖祖文舞曰發祥流慶武舞曰降真觀徳自是玉清昭應景靈宫親薦皆備樂用三十六簴景靈以庭狭直用二十簴紀祥符五年閏十月戊子親製薦饗玉皇聖祖配享太祖太宗樂章總十六曲并二舞名祥符聖製恭謝薦享樂章祥符五年閏十月壬午詔於朝元殿恭謝上帝以天尊降故也二十四日戊子内出聖製薦享玉皇大帝聖祖天尊及太祖太宗配享樂章十六曲文舞曰發祥流慶武舞曰降真觀徳示輔臣先是十月戊午上親夢天尊臨降諭以本人皇九人之一乃趙之始祖己未示中外大赦案長編五年閏十月己巳有司言唐大清宫樂章皆明皇所作今崇奉玉皇聖祖及祖宗配位樂章請上自為之戊子内出樂章云云十一月丙申於朝元殿恭謝玉皇與前不同會要祥符五年御製朝謁玉清昭應宫景靈宫十一曲景祐二年仁宗製二曲閏十月五日己巳李宗諤上太廟奠獻登歌瑞安樂章帝親製樂章十六篇祥符奏雲韶樂七年三月乙未觀太宗聖文神筆於玉宸殿宴翔鸞閣浮觴曲水奏雲韶樂上作詩羣臣皆賦宋朝鐃歌鼔吹曲崔端詩十二篇太祖師次陳橋天命人情不謀自至為聖皇武㧞澤潞為真人翔伐揚州為茫茫青齊收湖南為湖之陽荆南奉表歸為荆州平蜀降為蜀之巇俘嶺南為猛虎攫江南平為震雷薄矣漳泉納土為葛藟親征河東為掎太行呉越舉地歸不以師為大明行天衢親征次澶淵射殺達蘭為澶淵迴軍樂有歌自黄帝始蔡邕禮志曰黄帝使岐伯作軍樂凱歌是也後丗漢魏晉皆有之唐有其樂而亡其辭栁宗元始為辭以備其闕用栁篇數為歌辭十二篇天聖蘂珠殿觀稼樂天聖八年八月六日丁亥召輔臣兩制以上宗室駙馬都尉天章閣觀御書元真殿觀瑞穀賜宴於蘂珠殿宰臣以下賦詩教坊作觀稼樂酒九行罷蘂珠與羣玉對峙于天章閣之左右太宗五瑞樂章有瑞麥之曲天聖皇太后樂章天聖九年四月丁酉詔太常寺皇太后御殿樂章升坐曰聖安之曲公卿入門及酒行曰禮安上夀曰福安之曲初舉酒曰玉芝之曲作厚徳無疆之舞兩舉酒曰夀星之曲作四海㑹同之舞三舉酒曰竒木連理之曲初命翰林學士孫奭撰曲名資政殿學士晏殊撰樂章至是用之一本云天聖九年四月二十一日晏殊上奉詔撰皇太后御殿樂章十四首詔付有司其徳合無疆之舞宜改曰厚徳無疆之舞先是四年十二月戊戌學士院上甘露瑞木嘉禾之曲見後㑹要明道元年晏殊撰十四曲仁宗洞曉音律毎禁中度曲出以賜教坊或命教坊撰進凡五十四曲朝廷多用之天聖朝會曲見後志天聖中仁宗始大朝會羣臣上夀作甘露瑞木嘉禾之曲明道初皇太后御前殿見羣臣作玉芝夀星竒木連理之曲厚徳無疆四海會同之舞明年耕藉田享先農率有樂歌景祐御製十三曲郊廟曲御製樂章景祐元年十月乙亥會要十九日御製景安四曲以祀天地夹鍾為宫黄鍾為角太蔟為徴姑洗為羽興安四曲祀宗廟黄鍾為宫大呂為角太蔟為徴應鍾為羽祐安五曲祀上帝姑洗為角林鍾為徴黄鍾為宫太蔟為角南吕為羽凡十三曲下太常寺案肄志云寜安之曲祭地祇社稷林鍾宫太蔟角姑洗徴南吕羽十一月己酉一本二十五日内出御製樂章下太常寺案肄仍詔親祀郊廟乃用其有司攝事樂章宜令宰臣吕夷簡李迪分撰之癸丑出御製景靈宫朝享聖祖大安曲樂章紀元年十月乙亥作郊廟景安興安祐安之曲十一月癸丑作大安之曲以享聖祖二年二月四日己未御製天地宗廟樂章凡五十一曲四月二十五日戊寅御製雅樂曲及樂章凡六十八七均十二律曲凡八十四並賜大樂肄習刻石太常寺聽六月辛未内出御製親祠天地三聖並侑奠幣廣安酌獻彰安奉慈廟莊獻奠瓉達安酌獻厚安莊懿報安衍安皇帝入出乾安常祀冬至圜丘太祖配奠幣定安酌獻英安並黄鍾為宫孟春祀感生帝宣祖配皇安肅安祈穀上帝太祖配仁安紹安並太蔟為宫孟夏雩祀上帝太祖配獻安感安並仲吕為宫夏至祀地祇太祖配恭安英安並𬎼賔為宫季秋明堂祀上帝真宗配誠安徳安並無射為宫孟冬祀神州太宗配化安韶安之曲並應鍾為宫下太常肄習十一月乙未郊祀以聖製及諸臣樂章用之志親祀南郊享太廟奉慈廟大享明堂祫享皆親製曲撰降神送神奠幣瓉酌獻樂章餘詔諸臣為之至於常祀郊廟社稷諸祠亦多親製景祐初燕肅言金石不調明年二月上考定樂器帝御延福宫臨閲奏郊廟五十一曲云云更以髙安祀五帝日月云云又造冲安之曲以七均演之為八十四皆作聲譜以授有司冲安之曲獨未施行親製郊廟樂章二十一曲裁成頌體告於神明詔宰臣吕夷簡等分造樂章参施羣祀皇祐御製明堂樂曲樂章樂舞合宫歌大樂曲譜明堂樂曲三譜嘉祐御製樂章皇祐三年三月戊子朔詔有事明堂五月丁酉禮儀使言明堂所用樂當隨月用律九月以無射為均而五帝各用本音之樂従之己酉二十三日内出御製明堂樂曲及二舞名迎送神曰誠安皇帝升降曰儀安天地奠玉幣曰鎮安酌獻曰慶安太祖太宗真宗奠幣曰信安酌獻曰孝安司徒奉俎曰饎安五帝奠玉幣亦曰鎮安酌獻曰精安皇帝飲福曰胙安退文舞迎武舞亞獻三獻皆曰穆安徹豆曰歆安歸大次曰憇安御撰樂章鎮慶信孝四曲餘命輔臣分撰文舞曰右文化俗武舞曰威功睿徳庚戌詔御所撰樂曲名與常祀同者更之遂更常所用圓丘寓祭明堂誠安之曲曰宗安感生帝慶安曲曰光安奉慈廟信安曲曰慈安六月己未内出御撰明堂樂八曲以君臣民事物配屬五音凡二十聲為一曲用宫變徴變者天地人四時為七音凡三十聲為一曲以子母相生凡二十八聲為一曲皆黄鍾為均又以明堂月律五十七聲為二曲皆無射為均又以二十聲二十八聲三十聲為三曲亦無射為均皆自黄鍾宫轉入無射或當用四十八或五十七聲則如前譜次第成曲其徹聲自同本律又製鼓吹警嚴曲合宫歌一闋丁卯十二日御撰黄鍾五音五曲凡五十七聲下太常肄習之初羣臣分撰樂章誠安等三曲二十九日翰林承㫖王堯臣等言奉詔與太常寺将御製樂曲譜注入合用清聲凖六月戊辰詔大樂夷則以下四均正律為宫並用正清今以御製大樂曲譜法十九曲合用清聲悉於下詳注詔付太常肄習七月戊子三日出御撰明堂樂曲譜三成無射宫三曲皆五十七聲實錄云無射宫樂曲三譜止五音七均相生不隨次第用均律以順曲為譜五音一曲明堂奉俎用之二變七律一曲明堂飲福用之七律相生一曲明堂退文舞迎武舞亞獻三獻徹豆通用之并景靈宫大廟明堂等宫懸登歌奏樂之序詔太常按習施行丁未上封者言酌獻五帝精安之曲並用黄鍾一均聲乃五時迎氣所用當用五行本始月律各従其音為曲詔兩制太常議八月己未堯臣等言大享日迫詔俟過大禮詳定八月乙卯朔詔罷祀前一夕警場恐失靜恭之意也十三日樂工習御製明堂新曲及景靈宫太廟樂曲已熟詔五使太常按樂九月丁亥三日帝服靴袍御崇政殿召近臣閲雅樂詳見前自宫懸登歌舞佾之奏凡九十一曲徧作之嘉祐七年八月乙亥朔内出御製明堂樂章迎送神曲肄於太常諸臣撰十一曲九月辛亥大饗中興書目明堂新曲譜一卷皇祐二年御製先是詔大樂並用清聲御製新譜法凖三首明堂行禮曲數二十二首下太常按習御集有樂章二卷治平元年六月太常奏仁宗配享明堂奠幣歌誠安酌獻徳安政和七年八月十二日御製宗祀明堂及親祠五室奠幣酌獻樂曲九章其飲福等三章令學士院撰皇祐崇政殿閲雅樂大樂新錄見明堂類又見樂類皇祐鈞容樂二年七月六日太常言明堂行禮前一日令鈞容樂宿古長慶門内俟禮畢即導迎乗輿還文徳殿升樓肆赦鈞容樂鼓吹振作又見上至和禘饗樂章元年十月八日内出太廟禘饗樂章并接神曲下太常肄習十一月五日甲子内出太廟禘祫時饗樂章肄於太常仁宗御製祫饗二曲迎送神用懐安嘉祐元年八月十五日甲子内出御製恭謝樂章肄於太常是月詔恭謝用舊樂九月辛卯恭謝大慶殿仁宗又御製奉慈廟奠獻四曲元豐朝會樂二年四月二十二日詳定正旦儀注宋敏求等言皇帝即御坐中書門下親王使相班分東西入正安之樂作至位樂止七月十二日戊寅又言鄉飲酒及君饗燕樂有四節一升歌二笙三間歌四合樂今朝會儀注合樂在前登歌在後有違古義請第一爵登歌奏和安堂上之樂隨歌而發第二爵笙入奏慶雲止吹笙餘樂不作第三爵間歌堂下歌嘉禾堂下笙瑞木成文之曲歌吹相間第四爵合樂奏靈芝堂上下樂交作又定文武舞為四表丹墀東西各設三巢一和将作樂先擊鞞次擊應然後擊建鼓樂懸去㪚鼓設晉鼓以鼓金奏設鼗以為樂節從之乾興元年十二月己未仁宗詔太常太樂局令丞至樂工定三百四十一人鼓吹局令丞至樂工二百二十七人為額紹興郊廟樂章紹興二十八年七月二十四日庚辰内出御製郊祀天地宗廟樂章並御札付宰執於都堂宣示禁従及館閣之臣前一日上謂輔臣曰臣僚請朕製天地郊廟樂章十三首今付出卿等可改定付有司宰臣該等曰聖作髙妙前代帝王所不及先是七月二十日詔羣臣修潤郊祀樂章七十九首下太常肄習會要朝獻景靈宫御製及宰執兩省官撰二十五曲聖祖奉幣靈安酌獻祖安並御製朝享太廟四十一曲太祖酌獻用大定太宗同徽宗用承元並御製圜丘三十六曲昊天奠幣用嘉安皇地祇曲名同太祖奠幣用廣安太宗用化安昊天酌獻用禧安太祖酌獻用彰安太宗用韶安並御製十羣臣撰七十九首御製三首紹興系聲樂府樂府集書目系聲樂府二十四卷紹興中鄭樵撰集前代樂府系之聲樂以三百五十一曲系之風雅聲八十四曲系之頌聲百二十曲系之别聲四百十九曲系之遺聲鄭樵曰崔豹之徒以義說名呉兢之徒以事解目劉次莊樂府集十卷以類為十九門郭茂倩樂府集一百卷編次自漢迄唐君臣所著樂府共十二門晁氏志樂府詩集一百卷郭茂倩編次取古今樂府分十二門郊廟歌辭十二燕射歌辭三鼔吹曲辭五横吹曲辭五相和歌辭十八清商曲辭八舞曲歌辭五琴曲歌辭四雜曲歌辭十八近代歌辭四雜謡歌辭七新樂府辭十一通為百卷包括傳記辭曲畧無遺軼淳熙明堂樂章紹興四年五月國子丞王普言周禮奏黄鍾歌大吕以祀天神黄鍾堂下之樂也大吕堂上之樂也郊祀行禮皇帝版位在阼階下故還位之樂當奏黄鍾明堂行禮皇帝版位在阼階上故還位之樂當歌大吕今明堂奏黄鍾誤用郊祀之樂宜改正二十五日甲戌従之四月乙未禮官言登歌之樂通作宫懸之曲許之九月辛酉宗祀用登歌樂四十樂舞工共二百八十七普言樂曲先製譜後撰詞非是請倚詞製譜淳熈六年四月禮官奏下學士院修製明堂樂章七月周必大言紹興樂章多因學士汪藻所撰畧加增損臣竊見皇祐二年宰臣文彦博等明堂大饗天地祖宗樂章乞従御製仁宗親作四曲用之嘉祐七年又製明堂迎神送神樂章政和七年八月十二日徽宗製明堂樂曲九章紹興二十八年七月二十四日製南郊并前二日朝獻景靈宫前一日朝饗太廟共十三章惟明堂樂章未經御製欲望特紆宸藻親製天地祖宗四位酌獻樂章二十七日従之風雅十二詩譜趙彦肅所傳云即開元遺聲也文心雕龍曰塗山歌於候人始為南音有娀謡於飛燕始為北聲夏甲歎於東陽東音以發殷整思於西河西音以興見吕氏春秋此四方之歌也及詩官採言樂胥被律是以師曠覘風於盛衰季札監㣲於興廢竇儼曰其音五其聲十二其調六十雅部之樂也其音四其聲八其調二十有四胡部之樂也玉海卷一百六
