body:
  text: 玉海卷九十九宋王應麟撰郊祀社稷孝經説曰社者土地之主稷者五糓之長土地廣博不可徧敬故封土以為社五糓衆多不可徧祭故立稷而祭之詳具白虎通鄭康成曰社為五土總神稷為原隰之神古者以句龍有平水之功配社祀之稷有播種之功配稷祀之三禮義宗王者諸侯所以為社為萬民求福拜功之道也無土不立無糓不生故立社稷則祭之春則求之秋則拜之故月令云仲春之月擇元日命民社孝經援神契云仲秋穰禾拜祭社稷祭日用甲牲用大牢夏用黝秋冬用犉神農社後漢郡國志注見井類虞社管子輕重戊有虞之王封土為社置木為閭始民知禮也淮南子齊俗訓有虞氏之祀其社用土祀中霤夏后氏其社用松祀戸商人社用石祀門周人社用栗祀竈湯稷祠漢郊祀志湯欲遷夏社不可作夏社見書序應劭曰大旱不止故遷社迺遷烈山子柱以周棄代為稷祠祭法聖王之制祭祀也法施於民則祀之以死勤事則祀之以勞定國則祀之能禦大菑捍大患則祀之厲山氏炎帝也之有天下也其子曰農能殖百糓夏之衰也周棄繼之故祀以為稷正義夏末湯遭大旱七年欲變置社稷故廢農祀棄共工氏之伯九州也其子曰后土能平九州故祀以為社王為羣姓立社曰大社王自為立社曰王社諸侯為百姓立社曰國社諸侯自為立社曰侯社大夫以下成羣立社曰置社書伊尹曰先王承上下神祇社稷宗廟罔不祗肅論語宰我曰社夏以松殷以栢周以栗周社壝三社大社軍社五社禮大司徒設其社稷之壝后土及田正之神植之田主詩曰田祖各以野所宜木遂以名其社與野宰我對社以松栢栗莊周之櫟社潁川之長社小司徒凡建國立社稷封人設王之社壝為畿封而樹之凡封國設其社稷之壝封其四疆疏王之三社三稷之壇及壇外四邉之壝小宗伯建國之神位右社稷左宗廟大宗伯以血祭祭社稷注社稷土榖之神有徳者配食焉祭司服祭社稷則希冕小子珥于社稷州長歲時祀州社屬民讀法鼓人以靈鼓鼓社祭以祭地示注謂社稷大司樂奏大蔟歌應鍾舞咸池牧人隂祀用黝牲注北郊及社稷左匠人營國祖右社詩綿乃立冢土注大社也起大事動大衆先有事乎社謂之宜泰誓曰宜于冢土周書作雒諸侯受命于周乃建大社于國中其壝東青土南赤西白北驪中霤以黄將建諸侯取方一面之土苴以白茅以土封之召誥戊午社于新邑牛一羊一豕一注告立社稷之位用大牢社稷共牢詩載芟春藉田而祈社稷也良耜秋報社稷也白虎通天子社稷方五丈諸侯半之通典顓頊祀共工氏子句龍為社祭法曰后土為社烈山氏子柱為稷祭法曰厲山氏炎帝也其子曰農湯為旱遷柱以周弃代之欲遷句龍無可繼者而止周制天子立三社大社於庫門内之西立之王社於藉田立之亳社廟門之門立之五經通義大社在中門之外稷在西并壇王社在藉田之中在國者明天下拜功在藉田者明千畆拜功諸侯立三社國社侯社亳社祭法無亳社大夫以下立一社曰置社名異神同社者五土之神稷者五土之中特指原隰之祇天子社壇廣五丈以五色土諸侯以其方之色立木以表之大夫以下以地所宜木禮神玉以兩圭有邸天子太牢角尺諸侯少牢皆黝色良耜詩犉牡幣用黑日用甲郊特牲云用日之始也按周初未制禮之時日猶用戊故召詔云戊午乃社于新邑王服絺冕樂奏太蔟歌應鍾舞咸池用三獻左傳昭二十九年蔡墨晉太史對魏獻子社稷云云同上句龍柱自夏以上祀之周弃亦為稷自商以來祀之國語同祭法王為羣姓立社曰大社王自為立社曰王社云云郊特牲社祭土而主隂氣也天子大社必受霜露風雨以達天地之氣云云疏社祭一嵗有三仲春命民社月令一也詩以社以方謂秋祭甫田二也孟冬大割祠于公社月令三也禮運祀社于國所以列地利命降于社之謂殽地魯語土發而社助時也援神契仲秋穰禾拜祭社稷夏官量人營軍之壘舍量其軍社之所里注社主在軍者春官大祝大師宜於社設軍社左傳君以軍行袚社釁鼓祝奉以從馬融周禮注王者五社大社在中門之外惟松東社八里惟栢西社九里惟栗南社七里惟梓北社六里惟槐後漢志注尚書逸篇曰大社惟松東社惟栢南社惟梓西社惟栗北社惟槐周方社詩甫田以我齊明與我犧羊以社以方注社后土也方迎四方氣於郊也箋云秋祭社與四方為五糓成熟報其功雲漢祈年孔夙方社不莫方祭四方社祭土神周郊社家語孔子至周歴郊社之所公羊傳天子祭天諸侯祭土注郊所以祭天天子所祭莫重於郊土謂社也諸侯所祭莫重於社禮運祭帝於郊所以定天位也祀社於國所以列地利也故禮行於郊而百神受職焉禮行於社而百貨可極焉中庸明乎郊社之禮治國其如示諸掌乎祭法疏大社在庫門内之右小宗伯云右社稷王社所在書傳無文或云與大社同處王社在大社之西崔氏云王社在藉田王自所祭以供粢盛詩頌云春藉田而祈社稷是也諸侯國社亦在公宫之右侯社在藉田鄭駮異義云有國及治民之大夫乃有社稷郊特牲疏鄭康成之說以社為五土總神稷為原隰之神句龍稷配之案郊特牲云社祭土而主隂氣社所以神地之道禮運云命降于社之謂殽地故知社即地神稷是社之細别名曰稷聖證論王肅難鄭云禮運云祀帝於郊所以定天位祀社於國所以列地利言列地利知社非地也為鄭學者馬昭通之云地體有形不須云定位肅又難鄭云召誥用牲于郊牛二明后稷配天故二牲社于新邑牛一羊一豕一明唯祭句龍更無配祭之人祭法及昭二十九年傳云句龍能平水土故祀以為社不云祀以配社明知社即句龍也為鄭者通之云后稷非能與天同功惟尊祖配之故不得稱天不敢與天同牲句龍與社同功故得云祀以為社而配同牲也肅又難鄭云月令命民社鄭注云社后土也孝經注云社后土也句龍為后土既云后土則句龍也是鄭自相違為鄭者通之云句龍為后土之官其地神亦名后土白虎通云天子之社壇方五丈諸侯半之社之主盖用石鄭注宗伯云案條牒論稷壇在社壇西俱北嚮營並壇共門或曰在社壇北其用玉無文今禮用兩圭有邸胡氏曰古者祭地於社猶祀天於郊也泰誓曰郊社不修周公祀于新邑亦先用二牛于郊後用大牢于社記曰天子將出類于上帝宜于社又曰郊所以明天道社所以明地道周禮以禋祀祀昊天上帝以血祭祭社稷而别無地示之位四圭舞雲門以祀天神兩圭舞咸池以祀地而别無祭社之說則以郊對社可知矣後世既立社又立北郊失之矣魯兩社左傳閔二年間于兩社為公室輔注周社右亳社左兩社之間朝廷執政所在疏魯是周之諸侯故國社謂之周社哀四年亳社災是魯國有亳社魯外朝在庫門之内東有亳社西有國社疏又云雉門之外左有亳社右有周社定六年盟于周社亳社公羊傳云蒲社禮記外傳社者五土之神稷者百糓之神一云稷是原隰之神明堂位曰春社天子之祭也郊特牲曰地載萬物天垂象取財於地取法於天是以尊天而親地也故教民美報焉家主中霤而國主社示本也後漢志大司農鄭玄說古者官有大功則配食其神故句龍配社棄配稷漢社稷公社枌榆社官社官稷髙紀二年二月癸未令民除秦社稷立漢社稷蕭何傳漢二年何守闗中立宗廟社稷宫室郊祀志髙祖初起禱豐枌榆社徇沛為沛公遂以十月至覇上立為漢王二年令縣為公社李竒曰猶官社後四歲天下已定詔御史令豐治枌榆社常以時春以羊彘祠之鄭氏曰枌榆鄉名也社在枌榆晉灼曰枌白榆也社在豐東北十五里師古曰以此木為社神因立名有史記正義曰髙祖里社也續志豐枌榆亭十年春有司請令縣常以春二月及臘祠稷以羊彘民里社各自裁以祠元始五年莽又言社者土也稷者百糓之主王者尊重親祭禮如宗廟詩曰乃立冢土以御田祖以祈甘雨聖漢禮儀稍定已有官社未立官稷臣瓉曰髙帝立漢社稷禮所謂大社也時又立官社配以夏禹所謂王社也見漢祀令而未立官稷至此始立之世祖中興不立官稷相承至今遂於官社後立官稷以夏禹配食官社后稷配食官稷稷種榖木楮木也徐州牧歲貢五色土各一斗紀元始三年夏立官稷及學官注師古曰初立官稷於官社之後是為一處今更創置建於别所不相從也後紀章帝章和元年八月己丑遣使祠沛髙原廟豐枌榆社續志注白虎通曰人非土不立非糓不食土地廣博不可徧敬五糓衆多不可一一而祭故封土立社示有土也稷五糓之長故立稷而祭之也嵗再祭之春求秋報也祭以三牲重功也天子太牢諸侯少牢孔鼂云周祀一社一稷漢及魏初亦一社一稷至景初中立帝社二社到于今荀彧問仲長統以社祭何神統答土神也侍中鄧義難之答曰郊社之次天地之序也禮記正義鄭康成以社為五土總神稷為原隰之神句龍稷配之天子諸侯各有二社祭法王立大社王社諸侯立國社侯社又有喪國之社春秋亳社魯宋有之祭法大夫以下成羣立社曰置社注云大夫不得特立社與民族居百家以上共立一社今里社是也秦漢以來民二十五家以上得立社鄭志云月令命民社謂秦社也自秦以下民始得立社皇侃曰天子諸侯祭社用藉田之糓大夫以下丘乗之民共粢盛孝經援神契社者土地之主稷者五糓之長詩載芟疏祭法云王為羣姓立社曰大社王自為立社曰王社此為百姓祈祭當主於泰社其稷與社共祭甫田注社后土也方迎四方氣於郊也疏中庸云郊社相對郊是天則社是地后土者地之大名句龍職主土地故謂官為后土死以配祭禮儀志注漢舊儀曰成帝五年六月始命諸官止雨朱繩縈社是後水旱常不和漢雒陽社稷紀建武二年正月壬子起髙廟建社稷於雒陽志建武二年立太社稷于雒陽在宗廟之右方壇無屋有墻門而已二月八月及臘一歲三祠皆太牢具使有司祠漢舊儀使者監祠南向立不拜郡縣置社稷太守令長侍祠牲用羊豕唯州所治有社無稷以其使官也古者師行有載社不載稷也古今注曰建武二十一年二月乙酉徙立社稷上東門内元和三年初為郡國立稷及祠社靈星禮器也社稷之樂見四品樂晉志漢至魏但太社有稷而官社無稷故常二社一稷通典魏明帝景初中立帝社曹植有社頌漢茅土續志注獨斷曰天子太社封諸侯者取其土苞以白茅授之以立社其國謂之受茅土漢興唯皇子封為王者得茅土其他功臣以户數租入為節不受茅土不立社武帝五子傳元狩六年封三王齊受青社燕受玄社廣陵受赤社祭法諸侯為百姓立社曰國社自立社曰侯社禹貢徐州貢土五色注王者封五色之土為社建諸侯則各割其方色土與之使立社燾以黄土苴以白茅茅取其潔黄取王者覆四方漢欒公社欒布傳景帝時復為燕相燕齊之間皆為立社號曰欒公社陳平傳里中社平為宰分肉甚均石慶傳慶社于齊不言動民慶為齊相齊國大治為立石相祠晉二社武紀太康九年三月壬辰初并二社為一十年六月庚子復置二社禮志太康九年改建宗廟而社稷祠壇俱徙乃詔曰社實一神其并二社之祀於是傅咸表曰祭法王社太社各有其義天子尊事宗廟故冕而親耕自為立社者為藉田而報者也國以人為本人以糓為命故又為百姓立社而祈報焉此社所以有二也謂宜仍舊立二社而加立帝社之稷時成粲議稱景侯論太社不立京都欲破鄭氏學劉寔與咸同詔曰社稷一神而二位衆議不同何必改作其使仍舊一如魏制其後摯虞奏以為祭法王為羣姓立社曰王社周禮大司徒設其社稷之壝又曰以血祭社稷則太社也封人掌設王之社壝又有軍旅宜于社則王社也宜定新禮從二社詔從之至元帝建武元年又依洛京立二社一稷其太社之祝曰地理普施惠存無疆乃建太社保佑萬邦帝社之祝曰坤徳厚載邦畿是保乃建帝社以神地道洛京社稷在廟之右而江左又然宋何承天有社頌梁社稷五壇隋親祀太社隋志梁社稷在太廟西其初盖晉元帝建武元年所創有太社帝社太稷凡三壇門牆各隨其方色大同初加官社官稷並前為五壇後齊立三壇於國右隋開皇初社稷並列於含光門内之右又於國城東南七里延興門外為靈星壇韋叔夏曰魏以官社為帝社晉初或廢或置皆不言所置之處或云兩社同處崔氏皇甫氏云王社在藉田隋紀開皇三年八月戊子親祀太社唐親祠太社東都太社紀武徳九年正月丙子初令州縣祀社稷戊寅親祠太社舊紀云九年二月戊寅親祠社稷㑹要武徳九年正月親祠太社丙子詔曰吉日惟戊親祠太社率從百僚以祈五糓神龍元年五月乙酉詔於東都建置太社祝欽明問禮官博士曰周禮田主各用所宜木今太社主用石何也韋叔夏等四人議曰春秋傳軍行拔社書曰不用命戮于社社之主盖用石為之崔靈恩三禮義宗曰社神用石以土地所生最實故也又吕氏春秋云殷人之禮其社用石後魏書云天平四年太社石主遷於社宫是社主用石古有明說周禮用所宜木謂民間之社非太社也云云張齊賢傳同開元十九年正月三十日詔州縣社惟用酒脯二十二年三月二十五日詔用牲牢天寳元年十月戊寅九日詔社為九土之尊稷乃五糓之長祭官宜加精潔其社壇側禁樵牧三載二月戊寅十四日詔社稷升為大祀以四時致祭初開元禮列為中祀後又依開元禮為中祠長慶二年正月王彦威奏牲用太牢太尉攝行事祭之日不坐並大祠之義請昇為大祠唐帝社帝稷壇先農壇禮樂志藉田祭先農唐初為帝社亦曰藉田壇貞觀三年將親耕給事中孔頴達議曰禮天子藉田南郊今帝社乃東壇未合於古太宗曰吾方位少陽乃耕於東郊垂拱中藉田壇曰先農壇神龍元年五月祝欽明議緣田為社曰王社今曰先農失王社之義宜正名曰帝社韋叔夏張齊賢等議宜於藉田立帝社帝稷配以禹棄則先農帝社並祠叶周載芟之義欽明又議先農王社一也更加二祀不可叔夏齊賢乃奏先農與社一神今先農壇請改曰帝社壇於是立帝社壇又立帝稷壇於西如太社太稷而壇不設方色以異於太社志又云廣五丈以五土為之者社稷壇也開元十九年停帝稷而祀神農氏於壇上以后稷配憲宗元和五年詔以來嵗藉田太常修撰韋公肅采開元乾元故事為先農壇於藉田髙五尺廣五丈四出陛其色青草具其儀以水旱用兵而止通典社稷在含光門内之右仲春秋戊日祭之太社以大罍實醍齊著尊實盎齊皆二山罍大稷如之及配坐籩豆皆十簋簠二鉶三孟春祭帝社及配坐亦如之社稷牲以黑㑹要神龍元年五月問禮官舊社主長尺六寸方尺七寸韋叔夏等議曰社主之制在禮無文郊特牲云社祭土主隂氣韓詩外傳云天子太社方五丈諸侯半之五土數社主宜長五尺以凖隂數五方二尺以凖隂偶剡其上以象物生方其下以象地體埋半土中本末均也請度以古尺又問舊社稷壇四方設以方色中央數尺以黄土叔夏等曰韓詩外傳云天子太社廣五丈分置四方色上冒以黄土說云象王者覆被四方請凖古改造於是以方色飾壇四面及四陛上以黄土覆之張齊賢傳同祥符祭社稷禮器壇制度儀注元豐兩圭有邸祥符二年正月八日甲子詔禮院定州縣祭社稷及釋奠文宣王禮器數請正配坐每坐樽二籩豆八簠簋各二俎三從祀籩豆二簠簋俎一圖其制摹印頒之七月十四日丁夘又詳定祭器祭服州縣止用公服行事十月十日禮院定諸州祭社稷儀約開寳通禮定儀注摹印頒之從知白州曽世南之請四年十月十三日壬子詔州縣社稷壇多不如禮命禮院定髙下丈尺制度頒天下依禮修築天聖十年七月三日修太社稷壇從王隨之言也禮官言按唐郊祀録太社壇廣五丈髙五尺五色土為之稷壇在西如社之制社以石為主形如鍾長五尺方二尺剡上方下培其半宫垣飾五色屋三門每門十二㦸四隅飾罘罳如廟之制中植槐其壇三分宫之一在南無屋從之元豐七年八月二十二日己丑造兩圭有邸二以為社稷禮神玉舊止有瘞玉八年二月十六日庚辰詔州縣社壇用石為主尺寸廣長半太社之制元祐七年三月十八日禮官請設宫懸登歌樂政和元年六月請諸州壇飾隨方色紹興十二年三月十八日乙巳詔臨安府建大社稷壇淳熙六年四月常徳守李燾請頒下春秋祭社稷繪畫尊爵簠簋制度於是太常以五禮新儀及祭社稷儀注并圖畫尊爵簠簋之制頒下十年七月詔水旱令州縣先祈社稷嘉祐郊社令嘉祐元年十一月置郊社令命石祖元熙寧元年始主四郊壇壝命張伯世紹興十九年二月始除韓彦直太社令祀先農儀省牲之日太社令帥屬除壇周封人典祀漢太祝令祠祀梁明堂太社令後周司社隋唐郊社令社土也稷榖也非土不生非榖不育國始建則壝以祀示民有命也社者五土之神稷者五榖之神土榖之有功於民此祀典之所當尊是以人臣有平土之功則取以配社有播榖之功則取以配稷示不忘本之義也書正義漢儒説社稷有二左傳説社祭句龍稷祭柱棄唯祭人神而已孝經説社為土神稷為榖神句龍柱棄是配食者也隋志凡人非土不生非榖不食土榖不可徧祭故立社稷以主祀古先聖王法施於人則祀之故以勾龍主社周棄主稷而配焉嵗凡再祭葢春求而秋報列於中門之外外門之内尊而親之與先祖同也然而古今既殊禮亦異制故左社稷而右宗廟者得質之道也右社稷而左宗廟者文之道也祀日月王朝日者示有所尊訓人事君也王者父天而母地兄日而姊月故常以春分朝日秋分夕月況人不得事耶君子履端於始舉正於中故本二分也炎帝祀朝日拾遺記炎帝築圎丘以祀朝日飾瑶階以揖夜光家語髙辛厯日月之生朔而迎送之堯典寅賓出日注春分朝日漢賈誼傳三代之禮春朝朝日秋暮夕月周朝日夕月周拜日壇禮大宗伯以實柴祀日月星辰注實牛柴上也疏郊特牲曰郊之祭大報天而主日祭義曰配以月則郊祭并祭日月掌次朝日則張大次小次設重帟重案注春分拜日於東門之外祭義曰周人祭日以朝及闇肆師立次祀用牲幣注天神日月星辰小宗伯兆四類注兆日於東郊兆月與風師於西郊云云典瑞王晉大圭執鎮圭繅藉五采五就以朝日注繅有五采文所以薦玉木為中幹用韋衣而畫之王朝日者示有所尊訓民事君也天子常春分朝日秋分夕月覲禮曰拜日於東門之外疏挿大圭長三尺玉笏於帯間手執鎮圭尺二寸王者父天母地兄日姊月既春拜日於東明秋夕月於西圭璧以祀日月疏若春秋分并大報天主日配以月玉人云圭璧五寸司儀將合諸侯則令為壇三成宫旁一門注天子春帥諸侯拜日於東郊則為壇於國東夏禮日於南郊則為壇於國南秋禮山川丘陵於西郊則為壇於國西冬禮月四瀆於北郊則為壇於國北既拜禮而還加方明於壇上而祀焉所以教尊尊也覲禮天子乗龍載大斾象日月升龍降龍出拜日於東門之外反祀方明注此謂㑹同以春禮日於南門外禮月於北門外此謂㑹同以夏冬之禮月於北郊月六隂精祭義郊之祭大報天而主日配以月夏祭其闇殷祭其陽周祭日以朝及闇祭日於壇祭月於坎以别幽明祭日於東祭月於西以别外内疏天無形體懸象著明不過日月故以日為百神之主配之以月天帝獨為壇其日月及天神等共為一壇故日得為衆神之主也祭日於壇謂春分也祭月於坎謂秋分也月為幽日為明日為陽在外月為隂在内祭日於東用朝旦之時是為外祭月於西鄉夕之時是為内崔氏云日月有合祭之時謂郊祭天而主日配以月其禮大用牛各祭之時謂春分朝日秋分夕月其禮小故祭法用少牢今謂小司徒小祭祀奉牛牲鄭注謂玄冕所祭何得用少牢祭法禱祈之祭也崔説非郊特牲疏凡祭日月之禮崔氏云一嵗有四迎氣之時祭日於東祭月於西故小宗伯云兆五帝於四郊四望四類亦如之一也春分朝日秋分夕月二也此二祭日月各祭于一處皆為壇所謂王宫夜明也夏正郊天之時而主日配以月祭義云大報天而主日配以月三也孟冬大蜡之時又祭日月月令祈來年于天宗四也此二祭并祭日月共在一處其牲皆用犢若祈禱則用少牢祭法王宫祭日夜明祭月也注王宫日壇王君也夜明月壇疏日神尊故其壇曰君宫月明於夜故其壇為夜明玉藻天子玄端而朝日於東門之外注端當為冕玄衣之冕冕服之下朝日春分之時也疏案宗伯實柴祀日月星辰則日月為中祀而用玄冕者以天神尚質按魯語大采朝日少采夕月孔晁云大采謂衮冕少采謂黼衣而用玄冕者孔氏之說非也書傳略説云祀上帝於南郊即春迎日於東郊彼謂孟春與此春分朝日别朝事儀云冕而執鎮圭帥諸侯朝日於東郊魯語天子大采朝日與三公九卿祖識地徳少采夕月與太史司載糾䖍天刑注王搢大圭執鎮圭藻五采五就以朝日大采謂此也朝日以五采則夕月其三采也周語先王朝日夕月以教民事君通典周制以實柴祀日月日壇曰王宫月壇曰夜明牲幣俱色青樂同祭五帝樂禮玉以圭璧左傳日月之神則雪霜風雨之不時於是禜之糓梁傳雖為天子必有尊也貴為諸侯必有長也故天子朝日諸侯朝朔尚書大傳以正月朝迎日於東郊所以為萬物先而尊事天也宋志尚書大傳迎日之辭曰維某年月上日明光于上下勤施于四方旁作穆穆維予一人某敬拜迎日于郊吳時陳融奏東郊頌亦行此禮漢郊祀志四望盖謂日月星海也三光髙而不可得親海廣大而無限界故其樂同祀天則天文從祭地則地理從漢修天文壇竹宫揖日月見郊祀類泰畤郊祀志天子始郊見泰一朝日夕月則揖而見泰一武帝立二十八年元鼎五年元始祭禮祀天則天文從晉禮志春分祀日秋分祀月漢武帝郊泰畤朝日夕月不在東西郊旦夕常拜故魏文帝詔曰漢氏不拜日於東郊而旦夕常於殿下東西拜日月煩䙝似家人之事非事天之道也黄初二年正月乙亥祀朝日於東門之外將祭必先夕牲其儀如郊又違禮二分之義明帝太和元年二月丁亥朝日於東郊八月己丑夕月於西郊始得古禮晉因之武帝太康二年親朝日齊何佟之議馬鄭用二分盧植用立春漢禮日成山又見人神武紀太始三年二月幸琅邪禮日成山郊祀志作盛山其音同祭之罘浮大海山稱萬歲注師古曰成山在東萊不夜斗入海郊祀志宣帝修武帝故事盛車服敬齊祀之禮頗作歌詩迺祠成山於不夜萊山於黄成山祠日萊山祠月京師郡縣鄠則有日月祠成帝初成山萊山之屬皆罷地理志東萊郡不夜有成山日祠注師古曰齊地記云古有日夜出見於東萊故萊子立城以不夜為名顧野王云初築此城有日夜出故名不夜括地志不夜城在萊州文登縣東北八十里漢不夜縣有成山祠成山在萊州文登縣北八十里萊山在萊州黄縣東南二十里魏朝日夕月見上段元魏朝日東郊紀太和十五年八月甲寅詔朝日以朔夕月以朏十六年二月甲午始朝日東郊唐朝日夕月壇志壇埳之制廣四尺髙八尺者朝日之壇也為坎深三尺縱廣四丈壇於其中髙一尺方廣四丈者夕月之壇也舊志有樂章十六首貞觀中作朝日夕月無配日以圭璧幣以青月以圭璧幣以白大明青犢夜明白犢通典二分朝日夕月於國城東西各用方色犢陸贄東郊朝日賦載青旂儼翠華栁宗元朝日說曰古者旦見曰朝暮見曰夕楚辭九歌有東君日神也漢志亦有東君隋志後周以春分朝日於國東門外為壇如其郊用特牲青幣青圭有邸秋分夕月於國西門外為壇於坎中方四丈深四尺燔燎禮如朝日隋開皇初於國東春明門外為壇以春分朝日於國西開逺門外為坎深三尺廣四丈為壇於坎中髙一尺廣四尺以秋分夕月元豐朝日夕月壇見祠壇類景徳三年撰朝日三曲降神送神髙安奠玉幣酌獻嘉安夕月三曲紹興十曲升殿正安捧俎豐安亞終獻文安送神禮安羲御寅賓載嚴大采示民有尊揚光下燭煜爚東門肸蠁是屇禮神以兄羲和駕兮其容杲杲大采黝冕乃昭其文珪奠春舒鍾歌曉溢玄端肅事紫幄興祥扶光若英合璧重輪載嚴姊事用答隂靈光凝冕服氣肅環珮坎祀貽則郊禋展敬璧薦登光金歌動映有齊斯㫖有牲斯碩纎阿案晷星祠爾雅祭星曰布祭法幽宗祭星宗當為禜注幽禜謂星壇也星以昏始見疏星至夜而出故曰幽為營域而祭之故曰幽禜舜五星祠拾遺記虞舜在位十年有五老遊於國都舜以師道尊之言則及造化之始舜禪於禹五老去不知所從舜乃置五星之祠以祭之其夜有五長星出薰風四起連珠合璧祥應備焉周祭靈星通典周制仲秋之月祭靈星於國之東南就歲星之位絲衣繹賔尸髙子曰靈星之尸正義張晏曰農祥周語辰馬農祥也后稷所經緯晉語辰以成善后稷是相周書作雒農星皆與食周夀星祠通典周制秋分日享夀星于南郊注南極老人星祠以祈福夀又曰周立夀星祠於下杜亳時奉焉漢志秦於杜亳有五杜史記作三社主之祠夀星祠各以歲時奉祠史記正義角亢在辰為夀星三月之時萬物始生春氣布養各盡其性故夀爾雅夀星角亢也與老人别星周祀司中司命詳見後四類大宗伯以實柴祀日月星辰以槱燎祀司中司命風師雨師注鄭司農云司中三能三階司命文星宫星玄謂司中司命文星第五第四星或曰中能上能風師箕雨師畢正義實柴無玉有牲幣槱燎止有牲武陵太守星傳三台一名天柱上台司命中台司中下台司禄楚辭九歌有大少司命有上台文昌第四星故兩司命春秋緯月離于箕風揚沙箕風師也詩云月離于畢俾滂沱矣畢雨師也周祭司民司禄見後四類漢靈星祠郊祀志髙祖二年冬撃項籍還後四歲天下已定詔安置祀官其後二歲即髙祖八年也或言曰周興而邑一有邰字立后稷之祠至今血食天下於是髙祖制詔御史其令天下立靈星祠注張晏曰龍星左角曰天田則農祥也晨見而祭之服䖍云祠角星以后稷配食常以歲時祠以牛孝武元封三年夏旱迺下詔令天下尊祠靈星史記赤星寛舒之祠官歲時行禮正義赤星即靈星祠龍左角色赤漢舊儀云五年脩復周家舊祠祀后稷於東南為民祈農報厥功後祭祀志漢興八年有言周興而邑立后稷之祀於是髙帝令天下立靈星祠注三輔故事長安城東十里有靈星祠廟記同言祀后稷而謂之靈星者以后稷又配食星也舊說星謂天田星也一曰龍左角為天田官主糓注張晏曰農祥農見而祭也祀用壬辰位祠之壬為水辰為龍就其類也牲用大牢縣邑令長侍祠注漢舊儀曰古時嵗再祠靈星春秋用大牢禮也以史記正義辰之神為靈星故壬辰日祠於東南舞者用童男十六人注服䖍應劭曰即古之二羽也舞者象教田初為芟除次耕種芸耨驅爵及穫刈舂簸之形象其功也注古今注曰元和三年初為郡國立稷及祀社靈星禮器祭通典周仲秋辰日祭靈星於國之東南王者所以復靈星者為人祈時以種五穀故别報其功唐六典立秋後辰日祀靈星於國城東南晉志江左以來靈星配饗南郊不復特置長安志靈星壇在萬年縣南一十五里啟夏門外嵩髙山記孝武遊登五岳尊祠靈星移祠置岳南築作殿壇立圎石闕論衡今靈星秋之雩也漢雍諸星祠志雍有日月參辰南北斗熒惑太白歲星填星辰星二十八宿風伯雨師四海九臣十四臣之屬百有餘廟史記正義漢舊儀祭參辰星於池陽谷口夾道左右為壇文王都豐武王都鎬二都有昭明祠河圗云熒惑星散為昭明春秋傳昭明起有徳如太白成帝時衡譚條奏長安祠凡六百八十三所其二百八十所應禮奉祠如故餘四百七十五所不應禮皆罷奏可雍舊祠三百三所惟山川諸星十五所為應禮云地理志扶風舊有五畤太昊黄帝以下祠三百三所漢歲星祠志宣帝神爵元年立歲星辰星太白熒惑南斗祠于長安城旁漢南郊祀老人星又見祀髙禖後禮儀志仲秋之月縣道皆按戸比民年始七十者授玉杖餔之麋粥八十九十禮有加賜玉杖長尺端以鳩鳥為飾鳩不噎之鳥也祀老人星於國都南郊老人星廟通典周立夀星祠于下杜亳漢志亳有夀星祠各以歲時奉祀郊祀志元豐二年郊雍還祠太一賛饗曰夀星仍出淵燿光明索隠曰老人星也晉天文志老人一星在弧南一曰南極見於丙沒於丁見則治安以秋分候之南郊漢城南壇祠心星後禮儀志季秋祠心星於城南壇心星廟晉志引漢儀云心三星天王正位也晉祠靈星北史劉芳傳靈星本非禮事兆自漢初專為祈田常隷郡縣晉祠令云郡縣國祠社稷先農縣又祠靈星隋司中司命司禄壇志陳制令太史以二月八日於庭中以太牢祠老人星兼祠天皇大帝天一太一日月五星鉤陳北極北斗三台二十八宿丈人星子孫星四十六坐隋制於國城西北十里亥地為司中司命司禄三壇同壝祀以立冬後亥國城東北七里通化門外為風師壇祀以立春後丑國城西南八里金光門外為雨師壇祀以立夏後申壇皆三尺牲以一少牢開舊禮兆風師於西方司中司命於南郊雨師於北郊皇三年四月皇帝親祀雨師唐從祀星辰圗六典見郊祀春祀青帝歲星東方三辰七宿並從祀夏祀赤帝熒惑南方三辰七宿從祀季夏祀黄帝鎮星從祀秋祀白帝太白西方三辰七宿從祀冬祀黑帝辰星北方三辰七宿從祀許子儒傳初太尉無忌等議祠令及禮用鄭玄說以昊天帝當北辰耀魄寳郊明堂當太㣲五帝唐家祀圎丘太史所上圗昊天上帝外自有北辰李淳風曰昊天上帝位于壇北辰斗列第二垓與緯書駁異司馬天官書太微宫五精之神五星所奉有人主象故名曰帝猶房心有天王象安得盡為天乎羣星從坐錯落侈哆唐靈星祠通典立秋後辰日祀靈星祝曰九糓方成三時不害馮兹多祐介其農穡開元祀於國城東南天寳四載升中祠上元元年四月停貞元六年二月十七日甲申太常卿崔縱奏勅靈星司中司命等壇准開元禮配饗玄宗天寳三載二月戊寅升日月五星為大祀諸星為中祀隋開皇初於國城東南七里延興門外為靈星壇立秋後辰祠以一少牢唐祀夀星詳見壇壝門㑹要開元二十四年七月己巳置夀星壇以千秋節日修祠祭老人星及角亢七宿著之常式明皇生於八月以仲秋日月㑹于夀星置壇用千秋節日祭注文苑英華有南郊享夀星賦爾雅夀星角亢也列宿之長故曰夀星通典隋令太史以二月八日以太牢祠老人星兼祀天皇大帝等四十六坐唐五星壇玄宗天寳十四載三月時雨未降二十五日令給事中王維等分祭五星壇景徳享夀星紹興享夀星見祠壇類志秋分享夀星王欽若傳請置先蠶并夀星祠升天皇北極帝座於郊壇第一龕増執法孫星位所著書有列宿萬靈朝真圗祥符二年九月翰林天文邢中和言景徳中周伯星出亢宿之下天文志角亢為太山之根符上封之應望於親郊日特置周伯星於亢宿間禮官司天監議周伯星出氐三度亢氐相去不逺並鄭分兖州壽星之次望設於氐宿之間從之皇祐司中夀星靈星壇志司中壇方丈三尺夀星壇方丈八尺靈星壇東西丈三尺南北丈二尺馬祭壇在城西北髙三尺五寸東西丈五尺南北丈四尺皇祐定如唐司中周二十五步夀星靈星周八步四尺馬祭周九步皆髙三尺皇祐汴河祭星四年春二月丁亥詔每歲汴口祭河兼祠十七星初司天監靈臺郎王太明言汴河之祭不及星詔司天詳定汴河口祭星自此始箕斗奎東井天江咸池積水天淵天潢水位水府四瀆九坎天船王良羅堰凡十七星䄍祭古之王者以歲事成熟捜索羣神而報祭之而謂之大蜡仁之至義之盡也又為臘祭先祖五祀因屬民飲酒而勞賜農夫以休息之伊耆氏蜡八蜡郊特牲天子大蜡八所祭有八神伊耆氏始為蜡古天子號疏皇氏云神農釋文或云帝堯蜡者索也歲十二月合聚萬物而索饗之也建亥之月蜡之祭主先嗇神農而祭司嗇也后稷祭百種以報嗇也饗農田畯及郵表畷田畯督約百姓於井間之處詩曰下國畯郵禽獸猛獸仁之至義之盡也迎貓虎而祭之迎其神也祭坊與水庸溝也事也曰土反其宅水歸其壑昆蟲毋作草木歸其澤此蜡祝辭也黄衣黄冠而祭息田夫也謂既蜡臘先祖五祀大羅氏天子之掌鳥獸者也諸侯貢屬焉草笠而至尊野服也羅氏致鹿與女以戒諸侯八蜡以記四方先嗇一司嗇二農三郵表畷四貓虎五坊六水庸七昆蟲八疏鄭數八神約上文也王肅分貓虎為二無昆蟲順成之方其蜡乃通既蜡而收民息已君子不興功息民與蜡異周禮伊耆氏共杖咸盖蜡以息老故共杖咸者以名官明堂位土鼓葦籥伊耆氏之樂夏清祀嘉平殷嘉平周蜡秦臘禮運仲尼與於蜡賓釋文夏曰清祀殷曰嘉平周曰蜡秦曰臘字林作䄍疏清祀以清潔祭祀嘉平嘉善也平成也以歲終方物善成就而報功蜡臘義見下明堂位秋省而遂大蜡天子之祭也周禮籥章國祭蜡龡豳頌撃土鼓以息老物通典用六奏之樂注萬物助天成歲事至是為其老而勞乃祀而老息之於是國亦養老焉月令孟冬勞農以休息之是也隋志周法以嵗十二月建亥之月也大司樂凡六樂者六變而致羽臝鱗毛介象物及川澤山林丘陵墳衍土示天神注此謂大蜡索鬼神而致百物六奏樂而禮畢東方之祭用太蔟姑洗南用𬎼賓西用夷則無射北用黄鍾為均焉每奏有所感羅氏蜡則作羅襦注致鹿與女以戒諸侯大宗伯以疈辜祭四方百物注謂蜡祭黨正國索鬼神而祭祀則屬民飲酒于序注謂歲十二月大蜡之時建亥之月也左傳虞不臘矣疏月令孟冬臘門閭及先祖五祀臘之見於傳記者唯月令與此二文而已秦本紀惠王十二年初臘始皇三十一年更改臘曰嘉平蔡邕獨斷云臘者歲終大祭縱吏民宴飲非迎氣故但送不迎應劭風俗通云案禮傳夏曰嘉平殷曰清祀周曰大蜡漢改曰臘臘者獵也曰獵取獸祭先祖也此言虞不臘明當時有臘祭周時臘與大蜡各為一祭漢改曰臘不蜡而為臘耳說文冬至後三戌臘祭百神火髙堂隆議曰王者各以其行之終而臘水以辰以戌木以未金以丑土以辰周顯王四十三年秦初臘按春秋時已稱虞不臘非始於秦也始皇更名臘曰嘉平亦復用殷之舊名也周蜡於十有二月秦臘於孟冬皆建亥之月也蜡以息老物臘以息民栁宗元有䄍說郊特牲云云既蜡而收民息已故既蜡君子不興功注息民與蜡異則黄衣黄冠而祭為臘必矣疏先蜡後息民是息民為臘與蜡異也上文黄衣黄冠在蜡祭之下故知是臘也月令臘在祈天宗之下但不知臘與蜡祭相去幾日准隋禮及今禮皆蜡之後日月令孟冬祈來年於天宗大割祠於公社及門閭臘先祖五祀注此周禮所謂蜡也疏此等之祭總謂之蜡若細别言之天宗公社門閭謂之蜡其祭則皮弁素服葛帶榛杖其臘先祖五祀謂之息民之祭其服則黄衣黄冠鄭注郊特牲云息民與蜡異也黨正飲酒在蜡祭之後此大飲在蜡祭之前屬民飲酒在後勞農也若天子諸侯羣臣大飲在蜡祭之前凡蜡皆在建亥之月而皇氏以為夏殷蜡各在已之歲終蔡邕云夏曰清祀殷曰嘉平周曰蜡秦曰臘案左傳云云是周亦有臘名也詩甫田農夫之慶箋謂大蜡勞農以休息之正義郊特牲曰天子大蜡八嵗十有二月合聚萬物而索饗之是說大蜡之祭也月令孟冬臘門閭及先祖五祀勞農以休息之是說休息之事也郊特牲蜡祭之下又曰黄衣黄冠而祭息田夫注云既蜡臘先祖五祀於是勞農以休息之是臘即次蜡之後與蜡異也月令之臘祭與特牲息田夫為一雜記云子貢觀於蜡曰一國之人皆若狂是恣民大飲也以嵗豐場功畢入而特聴之故謂之慶賜勞息漢家每有國慶而賜民大酺亦此義也鄉飲酒義疏大蜡祭黨中於學飲酒子貢觀蜡是也周祈年田祖禮籥章國祈年於田祖龡豳雅撃土鼔以樂田畯注田祖始耕田者謂神農詩甫田琴瑟撃鼓以御田祖箋設樂以迎祭先嗇謂郊後始耕也周禮祈年田祖大田來方禋祀以其騂黑箋成王之來則又禋祀四方之神祈報焉黄冠野服駿奔皇皇自古有年神其降康漢臘賜何敞傳元和中奏記宋由曰臘賜自郎官以上公卿王侯以下至於空竭帑藏損耗國資注漢官儀臘賜大將軍三公錢各二十萬牛肉二百斤粳米二百斛特進侯十五萬卿十萬校尉五萬尚書三萬侍中將大夫各二萬千石六百石各七千虎賁羽林郎二人共三千以為祀門戸直禮儀志季冬之月星迴歲終隂陽以交勞農大享臘葦㦸桃杖以賜公卿將軍特侯諸侯注漢官名秩曰大將軍三公臘賜錢各三十萬牛肉二百斤粳米二百斛特侯十五萬卿十萬校尉五萬尚書丞郎各萬五千千石六百石各七千侍御史謁者議郎尚書令各五千郎官蘭臺令史三千中黄門羽林虎賁士二人共三千以為當祠門戸直各隨多少受也東觀記每臘詔賜博士人一羊甄宇取痩者風俗通以臘祭夕飾桃人懸葦索畫虎於門以禦凶東京賦注引之月令孟冬大飲烝注十月農功畢天子諸侯與其羣臣飲酒於太學以正齒位今天子以燕禮郡國以鄉飲酒禮代之詩云躋彼公堂稱彼兕觥是頌大飲之詩天子乃祈來年于天宗大割祠于公社及門閭臘先祖五祀注周禮蜡祭也臘以田獵所得禽祭也勞農以休息之注黨正屬民飲酒是也東方朔傳伏日詔賜從官肉唐蜡祭百神志蜡祭百神大明夜明在壇上神農伊耆各在其壇上后稷在東五官田畯各在其方五星十二次二十八宿五方之岳鎮海瀆等各在方之壇龍麟至於莵猫各在其方壇之後志又云髙尺廣丈蜡壇也通典貞觀十一年房玄齡等議曰按月令蜡法惟祭天宗近代蜡五天帝人帝五地極皆非古典今並除之季冬寅日蜡祭百神于南郊凡百八十七座明日又祭社稷于社宫開元中制儀季冬臘日蜡百神于南郊之壇後周用夏后之時行姬氏之䄍孟冬丁亥隋開皇四年十一月詔以十二月為臘建隆䄍祭元豐䄍壇建隆四年即乾徳元年癸亥六月二十三日和峴言䄍者臘之别名漢火行戌日為臘唐土德貞觀之際以寅䄍百神卯祭社宫辰臘宗廟開元定禮三祭皆以臘辰應土徳也聖朝火徳臘宜以戌而前七日辛卯行䄍禮恐未合宜於是如開元禮臘日䄍百神祀社稷享宗廟皆用戌日天聖三年十一月二十二日庚子知禮院陳詁言䄍祭一百九十二位祀文惟載一百八十二位而闕五方田畯郵表畷十位下禮官議曰后稷祝文已云爰及田畯其五方神祝文請增郵表畷郊祀正辭録司天監神位圗虎為於莵盖避唐諱請改於莵為虎從之元豐六年正月癸未詳定禮文所言歴代䄍祭在南郊為一壇唯周隋四郊之兆合禮請四郊各為一壇以祀其方之神先期司農言不順成之方不修報祀又月令以䄍與息民為二祭請息民祭在䄍後奏可紹興十九年五月乙酉詔定䄍祭從戸部郎周莊仲之言也乾道四年十一月二十七日禮官王㵸等言東西䄍備登歌三獻而南北方正配從祀一奠而已請如中祀儀式從之皇祐䄍壇志臘日䄍百神壇髙四尺東西七步二尺南北六步四尺皇祐定壇髙八尺廣四丈紹興臘饗二十六年十二月戊戌臘饗太廟罷朔祭以禮官援淳化故事有請也明年六月戊午定冬饗祭功臣臘饗祭七祀祫饗兼之用太常博士張庭實請也隋志蜡者索也古之君子使人必報之故周法以嵗十二月合聚萬物而索饗之仁之至義之盡也其祭法四方各自祭之若不成之方則闕而不祭禖祀王者以髙辛氏有嘉祥故立髙禖祀之以祈子鄭康成謂由髙辛氏有吞鳥之異故稱髙禖祀之以配帝蔡邕謂髙禖祀名髙猶尊也禖猶媒也吉事先見之象詳見下髙辛氏郊禖詩生民克禋克祀以弗無子注云無子求有子古者必立郊禖焉玄鳥至之日以太牢祠于郊禖天子親往后妃率九嬪御乃禮天子所御帶以弓韣授以弓矢于郊禖之前疏祭天用太牢者以兼祭先禖之神異於常郊盖祭天而以先禖配之箋禋祀上帝於郊禖疏云后稷未生之前已有郊禖之祀玄鳥天命玄鳥降而生商注春分玄鳥降湯之先祖有娀氏女簡狄配高辛氏帝率與之祈于郊禖而生契故本其為天所命以玄鳥至而生焉疏大戴禮帝係篇說帝嚳卜其四妃之子皆有天下月令䟽鄭義稷契當堯時案命厯序云帝嚳傳十世則稷契不為帝嚳之子是後世子孫之子鄭注生民云姜嫄髙辛氏之世妃則簡狄亦後世之妃此立為禖神者是簡狄之夫不得為帝嚳祭髙禖是祭天故生民傳云從於帝而見于天髙禖為配祭之人祭天特牲此用太牢者此謂配祭之人也生民疏姜嫄得祈郊禖者是二王之後得祭天也毛以帝為髙辛氏帝親行禋祀姜嫄從於帝而往見於天鄭以帝為上帝即蒼帝靈威仰也長發箋云帝黒帝以下有玄王故言黒帝周祠髙禖月令仲春玄鳥至至之日以太牢祠于髙禖天子親往后妃帥九嬪御乃禮天子所御帶以弓䪅授以弓矢于髙禖之前注玄鳥燕也燕以施生時來巢人堂宇而孕乳嫁娶之象也媒氏之官以為候髙辛氏之世玄鳥遺卵娀簡吞之生契後王以為媒官嘉祥而立其祠變媒言禖神之也御謂從往侍祠天子所御謂令有娠者於祠大祝酌酒飲於髙媒之庭以神惠顯之也帶以弓韣授以弓矢求男之祥也王居明堂禮曰帶以弓韣禮之禖下其子必得天材疏逸禮篇名禖在壇上御者在下故云禖下髙辛氏之世有吞鳥之異是為媒官嘉祥中候契握云玄鳥翔水遺卵娀簡狄吞之生契理詩疏云毛氏不信䜟緯以天無命鳥生人之後王立髙辛為禖神蔡邕以為禖神髙辛巳前舊有髙者尊也生民玄鳥毛傳曰姜嫄從帝祠郊禖簡狄從帝祈郊禖則前此矣鄭志焦喬荅王權云先契之時必自有媒氏祓除之祀位在南郊則契已前祭天南郊以先媒配謂之郊禖後王即以髙辛立為禖神以配天其古昔先禖則廢矣尊貴先禖當是伏羲續漢志注月令玄鳥至之日以太牢祠月令章句曰髙猶尊也禖猶媒也吉事先見之象盖為人求子孫之祀玄鳥感陽而至其來主為孕乳蕃滋故重其至日因以用事契母簡狄盖以有事髙禖而生契焉故詩曰天命玄鳥降而生商鄭玄謂後王以禖官嘉祥而立其祠盧植謂玄鳥至時隂陽中萬物生於是以三牲請子於髙禖之神居明顯之處故謂之髙因其求子故謂之禖以古者有媒氏之官因以為神通典周制月令仲春玄鳥至之日以太牢祠髙禖詩閟宫有侐實實枚枚注孟仲子曰是禖宫也疏盖以姜嫄祈郊禖而生后稷故名姜嫄之廟為禖宫漢禖祝枚臯傳武帝春秋二十九乃得皇子羣臣喜臯與東方朔作皇太子生賦及立皇子禖祝受詔所為皆不從故事重皇子也元朔元年春太子據生注師古曰髙禖求子之神也武帝晚得太子喜而立此禖祠而令臯作祭祝之文戾太子傳上年二十九乃得太子甚喜為立禖使東方朔枚臯作禖祝注禖之祝辭東方朔傳朔之文辭有皇太子生禖賦晉元康中髙禖壇上石破詔問出何經典束晢答曰漢武晚得太子始為立髙禖之祠髙禖者人之先也故立石為主祠以太牢許慎曰山陽人以石為主漢城南髙禖廟後禮儀志仲春之月立髙禖祠于城南祀以特牲晉禮志漢儀云同上通典謂武帝立後漢因之禋祀祓無子始見於詩太牢以祠禖復著於月令漢臯朔亦為皇子禖祝然則尚矣晉禖壇禮志元康時洛陽猶有髙禖壇百姓祠其旁或謂之落星隋志晉惠帝元康六年禖壇石中破為二詔問石毁今應復不博士議禮無髙禖置石之文束晢議以石在壇上盖主道也宜埋而更造後得髙堂隆故事魏青龍中造立此石詔更鐫石令如舊置壇上埋破石入地一丈案梁太廟北門内道西有石如竹葉小屋覆之宋元嘉中修廟所得陸澄以為孝武時郊禖之石然則江左亦有此禮後齊為壇於南郊傍廣輪二十六尺髙九尺四陛三壝春分親帥六宫祀青帝於壇以太昊配而祀髙禖之神以祈子禮用青珪束帛牲共以一太牢隋制祀於南郊壇牲用太牢一隋經籍志宋太始祭髙禖歌辭十一卷唐祀髙禖通典大唐月令以仲春玄鳥至之日以太牢祀髙禖天子親往月令經文及注不言有壇廟詩生民疏祀天而以先禖配之義如后土祀以為社由髙辛有嘉祥故稱髙禖景祐髙禖壇頌報祠髙禖景祐四年二月二日舊編云三年二月殿中侍御史張奎言陛下春秋鼎盛未有皇嗣謹按月令仲春燕至之日以太牢祀于髙禖天子親往后妃率九嬪御乃禮天子所御帶以弓韣授以弓矢于髙禖之前此先王求嗣之祭願勑有司凖舊儀詔有司詳定庚戌禮官以為詩月令雖可執據然周官所載獨闕其文則成康之際似廢而不講月令本秦吕不韋所集疑此乃夏商所行班固郊祀志言漢家祠祭最悉不及禖祀獨枚臯傳言皇子禖祝則武帝乃一時權祭非經也後漢至江左槩見其事而儀典委曲不可周知且推驗歴代祭享樂章無髙禖歌辭則當時所祀似禮之細者惟髙齊禖祠最顯然出於草創儀章駁雜妃嬪参享黷而不蠲恐不足以為後世法唐明皇因舊月令特存其事又開元定禮已復不著陛下垂采下議圖復舊章然髙禖之祠湮晦已乆必欲復之亦應参准前言允惬今事謂當築壇於南郊春分之日以祀青帝本詩克禋以祓之義也配以伏羲帝嚳羲本始嚳著祥也以禖神從祀報古為禖之先也以青石為主依漢晉隋之舊也牲用太牢樂以升歌儀視先蠶使有司攝事祝版所載具言天子求嗣之意乃以弓矢弓韣置于禖神之前祀訖奉弓矢等并胙若酒進内後宫以禮所御使齊戒受之以應求男之祥仍每嵗孟春令有司申請祭之與否聽詔㫖命曰特祀不為常典詔可庚戌七月太常禮院言凖詔以今年春分遣官致祭其壇制髙九尺周廣二丈六尺四出陛陛廣五尺設三壝壝别二十五步主用青石其長三尺八寸用木生成之數形凖廟社主植壇上稍北露其首三寸玉用青玉幣色從之牲用牛一羊一豕一如盧植舊說樂章祀儀並凖祀青帝樽器神坐如句芒唯有司攝行事受福不飲為異内侍祀前一日奏請皇后宿齋於别寢兩宫嬪從焉從之是歲春分遣官致祭如儀壇在南薰門外東直郊壇四百步郊壇西南三月己卯司封外郎賈昌朝太常博士梁適王平史館檢討王洙各獻祀髙禖賦頌賜勑書奬諭二月乙丑宫中置赤帝像以祈嗣寳元二年八月甲戌皇子生先是見赤蛇出於殿墀神光照庭辛巳二十一日命參政王􅎦以太牢報祠髙禖凖春分祀儀唯不設弓韣弓矢康定二年正月二十二日壬申詔著為常祀遣兩制官攝事二月十三日禮官言既為報祀請不設弓韣慶厯三年五月太常博士余靖言聖嗣未廣請仍用弓韣弓矢以祈嘉祥皇祐三年九月四日詔徙爽塏之地四年六月十四日徙郊壇東南奉先寺同知禮院張師中言其卑陋保章正皇甫定等請徙於圓丘之東鎮安軍文學鄭孝先謂宜在東方長男之位禮官司天監詳定嘉祐二年五月甲申九日徙壇於南郊壇東擇髙爽地改築紀慶厯元年正月壬申詔歲以春分祠髙禖即康定二年李絢傳仁宗未有繼嗣絢因奉祠髙禖還奏賦大指言王者逺嬖寵近柔良則神降之福子孫繁衍帝嘉納元豐髙禖壇熙寧二年十一月七年六月九年十二月皇子生以太牢報祀髙禖如春分儀不設弓韣弓矢五年閏七月己酉判太常章衡請遵故事祀禖飲福受胙以應求男之祥上曰帝王子孫自有天命元豐四年十月九日一云二年八月己酉天章待制羅拯言禖壇廣二丈六尺上設神位三庳陿不足以行禮下太常議禮官言禖祠以青帝為主請如青帝壇廣四丈髙八尺祀儀禖壇四丈又請下詳定禮文所講求制度乃言詩克禋克祀乃郊禖祀天以髙禖配於郊謂之郊今禖壇祀青帝於南郊以伏羲髙辛並配又於壇下設髙禖之位殊為爽誤請凖古郊禖改祀上帝以髙禖配祀以太牢其位在國南以石為主畧放南郊為壇而圓以青帝壇制增築之詔典禮依舊壇制如太常奏元祐八年正月十四日太常奏祀禖政和二年四月二十九日詔以伏羲髙辛配簡狄姜嫄從祀詔興髙禖壇親祠元年十一月八日太常少卿趙子晝請來春祀髙禖奏可二年二月二十三日禮官上春分行禮飲福受胙儀注三年正月二十四日博士趙霈請宸翰製祝辭以代親祠十二年十二月二十日博士劉嶸請講求禖壇方位制度禮官請建於行宫東南巽地城外十六年六月二十七日乙丑建髙禖壇在嘉㑹門外南四里龍華寺從御史王鎡言也鎡請一新壇宇取姜嫄從帝見於天之義月令天子親往之文法駕臨祠以獲詵詵之福既而禮官請改築于郊壇之東以符一索得男之象飲祠受胙如景祐之儀奏可九月十五日有司請舉行景祐故事祗祓休饗祈天錫羨禮官言徽宗修親祠之制具載新儀十七年二月三日上親祠儀注上服通天絳紗乗輦詣壇大次降輦入次服衮冕執大圭奏儀安嘉安景安之樂帝臨降康之舞甲辰以太師檜為親祠使乙巳十三日上親祠青帝于東郊以伏羲髙辛配普安郡王亞獻思平郡王終獻祀簡狄姜嫄于壇下牲用太牢玉用青幣放其玉之色樂舞如南郊之制禮畢御端誠殿受賀十七日有司奏築壇之所有瑞氣之應修壇之日有六鶴之祥二十二年三月己未二十四日校書郎董德元請髙禖與青帝分為二壇禮官請如舊制樂曲十四降神用髙安升壇用正安奠玉幣用嘉安捧爼用豐安青帝酌獻用祐安亞終獻用文安送神用理安東方作祝漢美可尋南郊建壇齊制甚陋展青幣以奠燎眡先蠶而登歌稽周官考吕令惟昔髙辛敏歆肇祀娀嫄肇國孕商毓周在漢六世置壇于南前星標瑞侍臣獻祝東都廸儀仲春講祠特牲謹物城南辨方載在青編蕩人耳目生民之什朔臯之詞朔賦邕儀惟禖之神主用青石祀崇青帝羲嚳類從樂用升歌儀視先蠶玄鳥司分命官攝祠夢羆協兆吹銅侑龢休光靈颷燀燿清穆以告震夙之喜紺髦髧如豐角淵如盖五緯儲英九潢毓粹以啟暉潤之美神其醉止介我蕃釐乃占吉夢維熊維羆玉海卷九十九
