body:
  text: 玉海卷八十一宋王應麟撰車服冕服上古衣毛而冒皮後世聖人易以絲麻染帛以作五采成以為服作冠冕纓㽔以為首飾昔帝冕旒冕服黼黻大帶大戴禮五帝徳黄帝黼黻黼取其斷黻取其辨衣大帶黼裳乘龍扆雲以順天地之紀禮記正義世本云黄帝造旃冕世本又云黄帝作冕宋仲子云冕冠之有旒者黄帝以来以羽皮為冠黄帝之後乃用布帛通典黄帝造冕旒始用布帛黄帝作冕垂旒目不邪觀也充纊耳不聽讒言也宋均曰通帛為旃冕冠之有旒應劭曰周始垂旒外紀黄帝作冕垂旒充纊為衣玄裳黄旁觀翬翟草木之華乃染五色為文章以表貴賤漢厯志黄帝始垂衣裳有軒冕之服注軒車冕服家語黄帝始垂衣裳作為黼黻韓詩外傳黄帝服黄衣戴黄冕致齋於宫鳳乃蔽日而至三禮圗黄帝戴黄冕見太平御覽淮南子伯余初作衣注黄帝臣世本曰伯余作衣裳易繫辭黄帝堯舜垂衣裳而天下治蓋取諸乾坤以辨貴賤乾尊坤卑之義為周禮疏冕服皆玄衣纁裳取乾坤者乾為天色玄坤地色黄但土無正位託於南方火赤色赤與黄為纁色故以纁也王制疏玄衣法天黄裳法地易坤六五黄裳元吉是衣裳從黄帝以来而有也虞氏以来其裳用纁後漢輿服志聖人觀翬翟之文榮華之色乃染帛以效之始作五采成以為服見鳥獸有冠角􅏋胡之制遂作冠冕纓㽔以為首飾凡十二章黄帝堯舜垂衣裳而天下治蓋取諸乾巛乾巛有文故上衣玄下裳黄春秋正義冕俛也後髙前下有俛俯之形蓋以在位者失於驕矜欲令位彌髙而志彌下故制此服令貴者下賤黄帝衮龍頌見頌類堯黄收純衣黼衣舜袗衣絺衣太古冠冕圖大戴禮五帝徳曰髙辛黄黼黻衣執中而獲天下帝堯黄黼黻衣丹車白馬史記帝堯者放勲其仁如天其知如神就之如日望之如雲富而不驕貴而不舒黄收純衣彤車乗白馬注裴駰按太古冠冕圗云夏名冕曰收禮記曰野夫黄冠鄭玄曰純衣士之祭服六韜昔帝堯王天下黼衣絓履不弊盡不更為也太平御覽孟子舜為天子被袗衣鼓琴注袗畫也畫衣黼黻絺繡也子華子舜游於巖廊之上被袗衣而鼓五絃之琴史記堯乃賜舜絺衣與琴後漢書戴黄屋服絺衣注引韓子曰堯冬日鹿裘夏日葛衣絺葛也唐虞齊冠郊特牲冠義同始冠之三加先加緇布之冠也太古冠布齊則緇之注唐虞以上曰大古三代改制齊冠不復用也疏太古無飾緇布冠無緌其緌孔子曰未之聞唐虞既用之為齊冠三代改唐虞之制齊冠不復用之詩都人士緇撮注云緇布冠士冠禮注緇布冠今小吏冠其遺象也三服謂緇布冠皮弁爵弁也玉藻始冠緇布冠本太古自諸侯下達冠而敝之可也玄冠朱組纓委貌也天子之冠也緇布冠繢緌諸侯之冠也皆始冠之冠玄冠丹組纓諸侯之齊冠也齊時所服玄冠綦組纓士之齊冠也文選任彦升䇿秀才文採三王之禮冠履粗分舜冕服十二章虞夏天子服周禮司服注古天子冕服十二章舜欲觀焉書益稷帝曰予欲觀古人之象日月星辰山龍華蟲作㑹疏云六者畫於上衣宗彝藻火粉米黼黻絺繡鄭氏曰絺讀為繭謂刺以為繡疏六者繡於下裳疏自日月至黼黻凡十二章天子以飾祭服繡與繪各有六衣用繪裳用繡王者制作皆以十二象天數也以五采彰施于五色作服汝明注欲觀示法象之服制天子服日月而下諸侯自龍衮而下至黼黻士服藻火大夫加粉米上得兼下下不得僭上作尊卑之服汝明制之疏衮冕以龍為首龍首卷然故以衮為名臯陶謨天命有徳五服五章哉注天子諸侯卿大夫士之服尊卑采章各異所以命有徳周禮疏書五服五章哉鄭注云十二也九也七也五也三也予欲觀古人之象注云此十二章天子備有公自山而下舜典車服以庸注諸侯功成則賜車服以表顯其能用子華子舜畫日月於太常備十有二章黼黻玄黄爛如也王制制三公一命卷若有加則賜不過九命次國之君不過七命小國不過五命注三公八命復加一命則服龍衮與王者之後同多於此則賜非命服也虞夏之制天子服有日月星辰周禮曰諸公之服自衮冕而下如王之服正義論三公以下次國小國之君爵命之數此禮緯九賜之衣服與宗伯再命受服不同三公一命卷謂周制也周以前則山在衮上詩正義曰衮是龍之状管子堯舜之王所以化海内者北用禺氏之玉南貴江海之珠令諸侯之子將委質者皆以雙虎之皮為裘卿大夫豹飾列大夫豹幨服所以象徳服是服者必全是徳一徳不備不足以臨民故觀其象必惕然三省焉被其象思其義行其徳夫豈致飾以華其躬寓數以示等威而已虞服韍魯四代服明堂位有虞氏服韍夏后氏山商火周龍章凡四代之服魯兼用之注韍冕服之韠也舜始作之以尊祭服禹湯至周増以畫文後王彌飾也山取仁可仰火取其明龍取變化天子備焉諸侯火而下卿大夫山士韎韋而已正義易困九二朱韍方来利用享祀是為祭服也徐廣曰漢明帝復制韍天子赤皮蔽膝魏晉用絳紗為之詩箋芾太古蔽膝之象以韋為之正義曰太古伏羲時也後王為芾象之易乾鑿度注古者田漁而食因衣其皮先知蔽前後知蔽後後王易之以布帛而猶存其蔽前重古道不忘本韍韠俱是蔽膝之象其制則同但尊祭服異其名耳舜冠禹冠通典成王問周公曰舜之冠何如焉曰古之人有帽而句領荀子哀公篇魯哀公問舜冠於孔子孔子不對三問不對哀公曰寡人問舜冠於子何以不言也曰古之王者有務而拘領者也其政好生而惡殺焉是以鳳在列樹麟在郊野烏鵲之巢可俯而窺也君不此問而問舜冠所以不對也注務讀為冒拘與句同曲領也言雖冠衣拙朴而行仁政尚書大傳古人衣上有冒而句領者康成注言在徳不在服也古人三皇時也冒覆頂也句領繞頸也禮正服方領淮南子禹之趨時冠挂而不顧履遺而不取見崔駰傳注虞皇周冕朝服繁露王制虞皇而祭通典云其制無文蓋爵弁之類也深衣養老夏收而祭燕衣而養老殷人冔而祭縞衣而養老周人冕而祭玄衣而養老又内則同注皇冕屬也畫羽飾焉疏周禮有設皇邸有皇舞皆為鳯皇之字鳯羽五采凡冕屬其服皆玄上纁下有虞氏十二章周九章夏殷未聞凡養老之服皆其時與羣臣燕之服虞氏質深衣而已夏改尚黒而黒衣裳殷尚白而縞衣裳周兼用之玄衣素裳其冠則弁追章甫委貌也諸侯以天子之燕服為朝服玉藻天子玄端而朝日聽朔注端當作冕諸侯玄端以祭朝服以日視朝於内朝注朝服玄端素裳也周書王㑹成王之㑹天子南面立絻無繁露繁露絻之所垂也朝服八十物搢珽唐叔荀叔周公在左太公望在右皆絻亦無繁露朝服七十物搢笏堂下之左唐公虞公立焉堂下之右殷公夏公立焉皆南面絻有繁露朝服五十物皆搢笏相者太史魚行人皆朝服有繁露堂下之東西郭叔掌菉幣絻有繁露注此服名因於殷非周制也禹黻冕論語禹致美乎黻冕鄭注黻祭服之衣冕其冠也六冕皆是集注黻蔽膝也以韋為之禹貢荆州厥篚玄纁璣組兖州篚織文徐州篚玄纎縞豫州篚纎纊夏毋追收殷章甫冔周委貌弁商黻衣郊特牲委貌周道也章甫殷道也毋追音牟堆夏后氏之道也注常所服以行道之冠或謂委貌為玄冠周弁殷冔夏收齊所服而祭三王共皮弁素積所不易於先代質不變正義三代俱用緇布而其形殊士冠禮同注委安也以安正容貌章明也毋發聲也追猶堆也弁名出於槃所以自光大冔名出於幠所以自覆飾收所以收歛髮其制未聞天官追師注司農云追冠名士冠禮記曰牟追夏后氏之道也追師掌冠冕之官王制見後儒行孔子長居宋冠章甫之冠正義用殷禮詩文王常服黼冔注冔殷冠也夏后氏曰收周曰冕正義冬官繢人云白與黑謂之黼周冕無繢繡之飾則殷冔亦不以黼為飾黼自衣服之所有舉一章而表之耳郊特牲及士冠禮皆云周弁殷冔夏收故知冔殷冠也既以冔為殷冠更取二代以明之彼云周弁此云冕者以周自大夫以上祭服皆用冕書太甲中伊尹以冕服奉嗣王歸于亳正義冕是在首之服冠内之别名冠是首服之大名故傳以冠為冕王制云殷人冔而祭大雅云常服黼冔冔是殷之祭冠今云冕者蓋冕為通名說命中惟衣裳在笥金縢王與大夫盡弁注皮弁質服以應天左傳劉定公曰弁冕端委晏平仲端委立虎門大伯端委治周禮國語晉侯端委入武宫董安于曰端委以随宰臣論語公西華曰端章甫注端玄端服章甫禮冠通典夏以牟追以收殷章甫或以冔形制並無文後漢志委貌冠皮弁冠同制長七寸髙四寸制如覆杯前廣後銳所謂夏之毋追殷之章甫者也爵弁廣八寸長尺二寸如爵形前小後大所謂夏收殷冔者也注詩云常服黼冔書曰王與大夫盡弁石渠論玄冠朝服戴聖曰玄冠委貌也士冠禮注同朝服布上素下緇帛帶素韋韠白虎通曰素積者積素以為裳也獨斷曰上古皆以布中古以絲見後三禮圗曰舊圗云委貌進賢冠其遺象也漢志委貌與皮弁冠同制案張鎰圗諸侯朝服之玄冠士玄端之玄冠諸侯之冠弁此三冠與周天子委貌形制相同則與進賢之遺象皮弁之同制者逺相異也梁正因阮氏之本而圗委貌與前三法形制又殊按王制疏與舊圗云周弁殷冔夏收三冠之制相似而微異俱以三十升布漆為之皆廣八寸長尺六寸前圎後方無旒周赤而微黑如爵頭然前小後大殷冔黒而微白前小後大收純黑亦前小後大三冠下皆有收如笠下收案士冠禮注其制之異未聞謂夏殷禮亡其制與周異同未聞故下不圗夏殷二冠之象章甫是殷之行道之冠冔是殷之祭冕梁正等云章甫亦名冔誤也五經通義曰禮器曰冕冠長六寸廣八寸員前冕緇布在上五采組十二旒夏殷之冕如周制其旒色異夏冕黒白赤組旒殷冕黑黄青組旒韋孟詩曰豕韋黼衣朱黻以翼大商注黼衣衣上畫斧形白黒為采朱黻上廣一尺下廣二尺長三尺以皮為之古者上公服之夏殷龍衮禮器見周衮冕疏徳多則文備故天子龍衮諸侯以下又稍少也然周禮上公亦衮侯伯鷩子男毳孤卿絺大夫玄士爵弁玄衣纁裳今言諸侯黼大夫黻雜明夏殷禮也但夏殷衣有日月星辰山龍今云龍衮舉多文為首耳日月之文不及龍也朱綠藻十有二旒亦夏殷也周藻五采也十二謂旒數諸侯九以下亦夏殷也周家旒數随命數又士但爵弁無旒武王端冕學記疏武王踐阼以下皆大戴禮武王踐阼篇也云端冕者謂衮冕也其衣正幅與玄端同皇氏云武王端冕謂衮冕也樂記魏文侯端冕謂玄冕也師尚父亦端冕案大戴禮無此文周大裘冕良裘功裘春官司服中士二人掌王之衣服辨其名物與其用事王之吉服祀昊天上帝則服大裘而冕祀五帝亦如之注司農云大裘羔裘也無章以黒羊皮為之冕即玄冠無旒之冕六冕之用大裘最尊天官司裘中士二人下士四人掌為大裘以供王祀天之服司農云大裘黒羔裘服以祀天示質中秋獻良裘司農云王所服也玄謂良裘玉藻所謂黼裘與季秋獻功裘人功微麤謂狐青麛裘之屬司農云卿大夫所服夏官節服氏郊祀裘冕二人執戈弁師注大裘之冕無旒三禮圗黒羔裘其冕無旒亦玄表纁裏鄭志大裘之上又有玄衣與裘同色但無文采裘下有裳纁色冬官裘氏闕攻皮之工玉藻唯君有黼裘以誓省當為獮大裘非古也大裘羔裘也黼裘以羔與狐白雜為黼文君衣狐白裘錦衣以裼之諸侯之服也天子狐白之上衣皮弁服與狐晏子春秋景公時天雨雪公被白之裘月令孟冬天子始裘家語天子大裘以黼之被裘象天注為黼文荀子郊之麻絻注大裘而冕詩羔羊注大夫羔裘以居鄭風羔裘豹飾䟽君用純物臣袖飾以異皮唐風羔裘豹袪三禮義宗鄭詩羙緇衣之宜唐詩刺羔裘之失周五冕六冕衮冕冕服九章春官司服中士二人享先王則衮冕注六服同冕者首飾尊也鄭司農云衮卷龍衣也玄謂書曰予欲觀古人之象日月星辰山龍華蟲作㑹宗彞藻火粉米黼黻絺繡古天子冕服十二章舜欲觀焉華蟲五色之蟲書注雉也畫繢之事曰鳥獸蛇雜四時五色以章之謂是也王者相變至周以日月星辰畫於旌旗所謂三辰旗旂昭其明也而冕服九章登龍於山登火於宗彞尊其神明也九章初一曰龍次二曰山三華蟲四火五宗彞皆畫以為繢六藻七粉米八黼九黻皆絺以為繡則衮之衣五章裳四章凡九也凡冕服皆玄衣纁裳衮冕十二旒易氏謂鄭說不然天子之制無非備物十二冕旒與衣裳一也疏鄭注禮記曰卷俗讀其通則曰衮故先鄭衮卷并言之九章初一曰龍至凡九也此無正文並鄭以意解之衣是陽從竒數裳是隂從耦數注云王受諸侯朝覲於廟則衮冕疏案覲禮云天子衮冕負黼扆節服氏云祭祀朝覲衮冕六人維王之太常注服衮冕者從王服公之服自衮冕而下如王之服注自公之衮冕至卿大夫之玄冕皆其朝覲天子及助祭之服諸侯非二王後皆玄冕而祭於已疏上得兼下下不得僭上也魯雖得與天子同惟在周公文王廟中得用衮冕夏官弁師下士二人掌王之五冕皆玄冕朱裏綖紐五采繅十有二就皆五采玉十有二玉笄朱紘注冕服有六而言五冕者大裘之冕蓋無旒不聯數也延冕之覆在上是以名焉紐小鼻在武上笄所貫也今時冠卷當簪者廣袤以冠縰其舊象與繅雜文之名也五采絲為之繩垂於延之前後各十二所謂邃延也就成也繩之每一帀而貫五采玉十二斿則十二玉也每就間蓋二寸朱紘以朱組為紘也紘一條屬兩端於武玉笄所以貫朱紘所以結衮衣之冕十二斿則用玉二百八十八鷩衣之冕繅九斿用玉二百十六毳衣之冕七斿用玉百六十八希衣之冕五斿用玉百二十玄衣之冕三斿用玉七十二疏凡冕體周禮無文叔孫通作漢禮器制度取法於周今還取彼以釋之案彼文凡冕以版廣八寸長尺六寸以上玄下朱覆之乃以五采繅繩貫五采玉垂於延前後謂之邃延故玉藻云天子玉藻前後邃延龍卷以祭弁師所掌冕以旒為主祭天用大裘取質其冕亦當無旒故此不數之唯有五冕爵弁前後平則得弁稱冕則前低一寸餘得冕名冕俛也以低為號以玉笄貫之又以組為紘仰屬結之五冕旒皆十二玉十二旒據衮冕而言旒各十二玉前後二十四旒故用二百八十八易氏曰春官司服玉之服冕有六夏官弁師獨言五冕者蓋大裘之冕所以祀天天道尚質故大裘無文其冕無旒即節服氏所謂裘冕弁師所掌惟衮冕以下而已諸侯之繅斿九就瑉玉三采其餘如王之事繅斿皆就玉瑱玉笄注侯當作公三采朱白蒼其餘謂延紐皆玄覆朱裏與王同也出此則異繅斿皆就皆三采也每繅九成則九斿也公之冕用玉百六十二玉瑱塞耳者疏經云九就上公以九為節王不言玉瑱互見為義節服氏祭祀朝覲衮冕六人維王之太常左傳桓二年臧哀伯曰衮冕黻珽帶裳幅舄衡紞紘綖昭其度也注衮畫衣也冕冠也黻韋韠所以蔽膝衡維持冠者紞冠之垂者紘纓從下而上者綖冠上覆疏畫衣謂畫龍於衣祭服玄衣纁裳詩稱玄衮是玄衣而畫以衮龍衮之言卷也謂龍首卷然禮注詩箋云衣繢而裳繡覲禮注云上公衮無升龍天子有升龍有降龍是衮有度也冕則公自衮以下侯伯自鷩以下是冕有度也黼則諸侯火以下卿大夫山是黻有度也衮鷩裳四章毳希裳三章是裳有度也君五色臣三色是紞有度天子朱諸侯青是紘有度杜數九文不取宗彞與鄭異昭二十五年子太叔曰為九文六采五章以奉五色注九文山龍華蟲藻火粉米黼黻也傳曰火龍黼黻昭其文也疏周世衮冕九章傳唯言四章者略以明義禮器禮有以文為貴者天子龍袞諸侯黼大夫黻士玄衣纁裳天子之冕朱綠藻十有二旒諸侯九上大夫七下大夫五士三此以文為貴也注此祭冕服也朱綠似夏殷禮也周禮天子以五采繅玉藻天子玉藻十有二旒前後邃延龍卷而祭注畫龍於衣正義藻謂雜采之絲繩以貫於玉以玉飾藻故云玉藻天子前之與後各有十二旒垂而深邃以延覆冕上故云前後邃延龍卷以祭者卷謂卷曲畫此龍形卷曲於衣以祭宗廟注云天子齊肩者天子之旒十有二就每一就貫以玉就間相去一寸旒長尺二寸故垂而齊肩諸侯以下各有差降九玉者九寸七玉者七寸以下皆依旒數旒垂五采玉依飾射侯之次從上而下初以朱次白次蒼次黄次玄既貫徧周而復始其三采者先朱次白次蒼二色者先朱後緑皇氏沈氏並為此説至漢明帝時用曹褒之說皆用白旒珠與古異卷字司服及覲禮皆作衮郊特牲祭之日王被衮以象天注謂有日月星辰之章此魯禮也周禮服大裘魯侯之服自衮冕而下也戴冕璪十有二旒則天數也注天數不過十二覲禮天子衮冕負斧依周書世俘解云玉服衮衣詩采菽又何予之玄衮及黼注玄衮卷龍也白與黒謂之黼箋云玄衣而畫以衮龍黼黼黻謂絺衣也韓奕玄衮赤舄九罭衮衣繡裳注衮衣卷龍也箋云上公之服釋文六冕之第二者三禮圖云周天子吉服有九冕服六弁服三孔疏引弁師止言玄朱不言所用之物論語云麻冕禮也葢以布衣版上玄下纁取天下之色論語服周之冕注冕禮冠周之禮文而備集注曰周冕有五祭服之冠也冠上有覆前後有旒黄帝以來已有之制度儀等至周始備然其為物小而加於衆體之上故雖華而不為靡雖費而不及奢夫子取之以為文而得其中也周鷩冕毳冕希冕玄冕春官司服享先公饗射則鷩冕祀四望山川則毳冕祭社稷五祀則希冕祭羣小祀則玄冕公之服自衮冕而下如王之服侯伯之服自鷩冕而下如公之服子男之服自毳冕而下如侯伯之服孤自希冕而下如子男卿大夫自玄冕而下如孤注鄭司農云鷩裨衣毳罽衣也玄謂鷩畫以雉謂華蟲也其衣三章裳四章凡七也冕九旒毳畫虎蜼謂宗彞也衣二章裳二章凡五也冕七旒希刺粉米無畫也衣一章裳二章凡三冕五旒玄者衣無文裳刺黻而已是之謂玄焉冕三旒凡冕服皆玄衣纁裳詩大車毳衣如菼注大夫之服毳冕弁師諸侯及孤卿大夫之冕各以其等為之注繅旒如其命數侯伯繅七就用玉九十八子男五就用玉五十繅玉皆三采孤四就用玉三十二三命之卿三就用玉十八再命之大夫再就用玉八繅玉皆朱綠一命之大夫冕而無旒士變冕為爵弁其皮弁韋弁之㑹無結飾疏無旒之冕與爵弁不殊但前低一寸餘故亦得冕名左傳成一年公㑹晉師賜三帥先路一命之服司馬司空受二命之服襄十九年公享六卿賜之三命之服軍尉司馬司空受一命之服二十六年鄭伯賜子展先路三命之服子産次路再命之服注蓋請之於王左傳成十六年晉侯請于王以黻冕命士㑹希冕也荀子天子山冕諸侯玄冠大夫禆冕士韋弁禮也山冕謂畫山於衣而服冕祭義諸侯冕而青紘周韋弁服皮弁冠弁服春官司服凡兵事韋弁服注以韎韋為弁又以為衣裳春秋傳韎韋之跗注今時伍伯緹衣古兵服之遺色疏以韋為冕又以為服韎是蒨染赤色也鄭雜問志以跗為幅注為屬以韎韋幅如布帛之幅而連屬以為衣而表裳聘禮云卿韋弁歸饔餼注云韎韋之弁蓋韎布為衣而素裳與此不同彼非兵事入廟不可純如兵服言素裳以屨從裳色天子諸侯白舄大夫士白屨皆施於皮弁故也易氏曰即爵弁也韋為韠而戴弁也荀子士韋弁注謂以爵詩六月四牡騤騤載是常服箋云戎車之常服韋弁服也衣采芑服其命服朱芾斯皇箋云天子之服韋弁服朱裳也曕彼洛矣韎韐有奭以作六師箋祭服之韠眂朝則皮弁服注眂内外朝之事皮弁之服十五升白布衣積素以為裳王受諸侯朝覲於廟則衮冕疏天子三朝外朝二内朝一注又云諸侯自相朝聘皆皮弁服此天子日視朝之服疏聘禮主君及賓皆皮弁伊士冠禮云皮弁素積詩有頍者弁注皮弁也其弁騏注皮弁箋云騏當作􅋒以玉為之凡甸冠弁服注甸田獵也冠弁委貌其服緇布衣亦積素以為裳諸侯以為視朝之服詩緇衣之宜兮緇衣注卿士聽朝之正服疏云即士冠禮朝服緇帶素韠謂王服此以田卒食而居則玄端易氏曰冠弁即玄端也疏士冠禮郊特牲云委貌周道以色言曰玄冠士冠禮云玄冠朝服緇帶素韠注云天子與其臣玄冕以視朔皮弁以日視朝諸侯與其臣皮弁以視朔朝服以日視朝引詩證諸侯服緇衣為朝服之義朝服與玄端大同小異玄冠緇布衣皆有正幅為端則同但易其裳耳玉藻韠君朱大夫素士爵韋注天子諸侯玄端朱裳大夫素韠則素裳士言爵是不純之名冠弁習兵之時若四時則當戎服月令季秋天子厲飾執弓挾矢以獵注謂戎服尚威武左傳衛獻公不釋皮冠則皮弁韋弁同但色異耳是正田用韋弁也詩六月疏皮韋同類孝經注曰田獵戰伐冠皮弁援神契云皮弁素積軍旅也軍士之服通皆韋皮坊記注云在軍同服左傳均服振振夏官弁師王之皮弁㑹五采玉璂象邸玉笄注㑹縫中也綦結也皮弁之縫中每貫結五采玉十二以為飾謂之綦詩云㑹弁如星其弁伊綦邸下柢也以象骨為之疏詩注云弁之縫中飾之以玉皪皪而處其狀似星也易氏曰王之吉服其弁三兵田之弁有時而用皮弁日眡朝其用數矣弁師所以特言皮弁之制二弁相似微有損益諸侯及孤卿大夫之冕韋弁皮弁各以其等為之注繅旒玉璂如其命數也韋弁皮弁則侯伯璂飾七子男璂飾五玉亦三采孤則璂飾四三命之卿璂飾三再命之大夫璂飾二玉亦二采不言冠弁兼於韋皮郊特牲祭之日王皮弁以聽祭報示民嚴上也玉藻皮弁以日眂朝遂以食日中而餕奏而食日少牢朔月大牢五飲上水漿酒醴酏卒食玄端而居諸侯皮弁聽朔於太廟注皮弁服皆素韠明堂位皮弁素積裼而舞大夏疏皮弁三王服學記視學服皮弁皮弁祭菜士冠禮初加緇布冠次加皮弁次爵弁覲禮王使人皮弁用璧勞侯氏春秋正義大輅之服謂鷩冕之服戎輅之服謂韋弁服周裨冕樂記武王克商裨冕搢笏而虎賁之士說劍也注衣裨衣而冠冕衮之屬也疏天子六服大裘為上其餘為裨裨從㐮冕以下皆是也覲禮注同玉藻諸侯玄端以祭裨冕以朝注朝天子也裨冕公衮侯伯鷩子男毳也覲禮侯氏裨冕荀子大夫裨冕注禆卑也曽子問云諸侯裨冕注禆卑也漢官儀周冕與古冕畧等周加垂旒天子前後垂真白珠各十二禮司服疏裨衣自衮以下先鄭獨以鷩為裨衣其言不足矣周王后六服天官内司服奄二人掌王后之六服褘衣司農云畫翬祭統云夫人副褘玄謂伊維而南素質五色成章曰翬王后之服刻繒為之形而采畫之綴於衣以為文章褘衣畫翬者揄狄闕狄司農云畫羽飾玄謂狄當作翟翟雉名江淮而南青質五色成章曰揺揄翟畫揺者闕翟刻而不畫此三者皆祭服從王祭先王則服褘衣祭先公則服揄翟祭羣小祀則服闕翟今世有圭衣者蓋三翟之遺俗鞠衣司農云黄衣也玄謂色如鞠塵象桑葉始生月令三月薦鞠衣于先帝告桑事疏曰鞠草名華色黄告桑之服展衣司農云白衣也玄謂以禮見王及賓客之服字當為禮詩瑳兮瑳兮其之展也記云世婦襢衣緣衣玄謂雜記夫人服稅衣揄狄喪大記曰士妻以褖衣褖衣御于王之服亦以燕居褖衣黑六服備於此矣其色則闕狄赤揄狄青褘衣玄婦人尚專一衣裳不異其色疏王之祭服有六首服皆冕后之祭服有三首服皆副素沙玄謂今之白縳也音絹六服皆袍制以白縳為裏使之張顯今世有沙縠者名出於此辨内外命婦之服鞠衣九嬪孤其夫展衣世婦大其夫卿夫緣衣女御士其夫素沙注三夫人及公之妻其闕狄以下乎侯伯之夫人揄狄子男之夫人亦闕狄唯二王後褘衣追師下士二人掌王后之首服為副編次追衡笄内宰正其服禁竒衺閽人竒服不入宫玉藻王后褘衣夫人揄狄君命屈狄周禮作闕再命鞠衣一命襢衣士褖衣詩何彼穠矣序王姬之車服下王后一等箋謂車乗厭翟勒面繢總服則揄翟三禮義宗陽爻九故王服有九隂爻六故后服惟六天子九服祭服有六王后六服祭服有三陽色尚文故有章數等級之别隂色尚質故無殊章之品周爵弁周頌絲衣其紑載弁俅俅注絲衣祭服箋爵弁弁而祭於王士服也疏爵弁之服玄衣纁裳士冠禮爵弁服純衣注爵弁其色赤而微黑如爵頭然純衣絲衣也玉藻一命緼韍幽衡再命赤韍幽衡三命赤韍葱衡注此玄冕爵弁服之韠尊祭服異其名耳春官司服疏爵弁之形以木為體廣八寸長尺六寸以三十升布染為爵頭色赤多黑少前後平弁師注士變冕為爵弁疏爵弁制如冕但無旒為異無旒之冕與爵弁不殊詩韎韐有奭箋云祭服之韠合韋為之其服爵弁服䊷衣纁裳書二人雀弁執惠注雀韋弁四人綦弁執戈注鹿子皮弁疏曰禮大夫服冕士服弁雀弁制如冕黑色但無藻耳阮諶三禮圗云以三十升布為之三禮圗爵弁士助君祭之服無旒此執兵以韋為之異於祭服釋名曰弁如兩手相合拚時也以爵韋為之謂之爵弁以鹿皮謂皮弁以韎韋謂韋弁公羊注皮弁武冠爵弁文冠夏曰收殷曰冔周曰弁加旒曰冕禮天子朝皮弁夕玄端朝服以聽朝玄端以燕皮弁以征不義取禽獸行射諸侯朝朝服夕深衣玄端以燕裨冕以朝天子以祭其祖禰卿大夫冕服而助君祭朝服祭其祖禰士爵弁黻衣裳以助公祭玄端以祭其祖禰周九服三禮義宗辨章數法象之理曰十二章法天之大數虞之服也九章者法陽數之極周之服也周禮王吉服有九后吉服有六九服者何一曰大裘而冕二曰衮冕三曰鷩冕四毳五希六玄六者祭祀之服也皮弁素積玄衣素裳緇衣玄端此又三服所謂吉服有九六冕之服玄上纁下皆同章數則異故分為六服兼皮弁法古上質故衣裳皆白玄衣緇裳者夏殷之制玄衣朱裳燕樂之服非廟祭之服故不入九服之數韋弁戎服亦不入吉服之例明天子朝燕之服曰天子皮弁素衣素裳為蜡祭之服黄衣黄冠臘祭先祖息田夫之服玄衣朱裳燕居之服韋弁即戎之服此四服非時朝燕無常故不入九服明周禮六服斿章義曰大裘其服無章其冕無斿天道至尊難可比擬舎去雕飾服以其質衮冕之服以龍為目龍體九星故以九為終聘禮疏周禮春官司服王之吉服有九祭服之下先立兵事韋弁服後云視朝皮弁服則韋弁尊於皮弁王制疏臯陶謨云五服五章哉鄭注云五服十二也九也謂公侯之服自山而下七也伯之服自華蟲而下五也子男之服自藻而下三也卿大夫之服自粉米而下鄭注覲禮云上公衮無升龍其旒則九宋志周監二代典制詳宻弁師掌六冕司服掌六服設擬等差各有其序故夫子曰服周之冕周之祭冕繅米備飾後魏志周禮及禮記三冠六冕承用區分玉藻玄冠紫緌自魯桓公始也朝服以縞自季康子始也覲禮秋時賜侯氏車服及篋服周赤舄天官屨人下士二人掌王及后服屨為赤舄黒舄赤繶黄繶青句絇注複下為舄襌下曰屨王吉服有九舄有二等赤舄為上冕服之舄詩云王錫韓侯玄衮赤舄則諸侯與王同下有白舄黒舄白舄皮弁之舄黒舄玄端之舄士皆著屨王后吉服六唯祭服有舄玄舄為上褘衣之舄下有青舄赤舄鞠衣以下皆屨詩狼跋赤舄几几車攻赤芾金舄㑹同有繹金舄即禮之赤舄也箋云黄朱色加金為飾故謂之金舄魯逢掖衣儒行孔子少居魯衣逢掖之衣注大袂襌衣也此君子有道藝者所衣正義夫子襌衣與庶人同其袂大與庶人異故謂衣為逢掖此則大袂深衣也荀子士君子之容其冠進其衣逢其容良深衣古者深衣盖有制度以應規矩繩權衡云云莊子儒者冠圜冠者知天時履句屨者知地形緩佩玦者事至而斷漢劉氏冠長冠齊冠紀髙祖為亭長乃以竹皮為冠令求盜之薛治注應邵曰以竹所生皮為冠今鵲尾冠是也師古曰謂笋上所解之蘀今人為笋皮巾時時冠之及貴常冠所謂劉氏冠也八年春三月令爵非公乗以上毋得冠劉氏冠淮南子髙帝造劉氏之貌冠續漢志長冠一曰齋冠髙七寸廣三寸促漆纚為之制如版以竹為裏初髙祖微時以竹皮為之謂之劉氏冠楚冠制也民謂之鵲尾冠非也獨斷云鄙人不識謂之鵲尾冠祀宗廟諸祀則冠之皆服袀玄絳縁領袖為中衣絳絝􅙋示有赤心奉神也五郊衣幘絝􅙋各如其色此冠髙祖所造故以為祭服尊敬之至也漢官儀曰漢家赤行齋者絳絝韈顯宗初服旒冕云云以承大祭百官執事者冠長冠注東觀畫曰永平二年正月公卿議春南北郊東平王蒼議曰孔子曰服周之冕為漢制法髙皇帝始受命創業制長冠以入宗廟禮儀志日變執事者冠長冠衣皁以行禮官志王國謁者比四百石掌冠長冠通典晉依漢制去竹用漆纚漢通天冠五時袍後志通天冠髙九寸正竪頂少邪却乃直下為鐵卷梁前有山展筩為述駁犀簪導乘輿所常服獨斷曰漢受之秦禮無文東京賦夏正三朝冠通天佩玉璽紆黄組要干將服衣深衣制有袍随五時色袍者或曰周公抱成王宴居故施袍孔子衣逢掖之衣逢掖其袖合而縫大之近今袍也今下至賤吏小史皆通制袍單衣皁緣領袖中衣為朝服云晉志通天冠本秦制又曰漢明帝更服㐮章天子冠通天而佩玉璽前後有展筩冠前加金博山述述即鷸也知大雨故冠象馬郊祀天地明堂宗廟元㑹臨軒介幘通天冠平冕冕皁表朱綠裏廣七寸長二尺二寸加於通天冠上前圎後方垂白玉珠十二旒以朱組為纓無緌通典宋加黑介幘齊加玉簪導梁加冕於上為平天冕唐改纓以翠緌隋志按董巴志冠髙九寸云云前有髙山故禮圗或謂之髙山冠晉起居注成帝咸和五年制詔殿内曰平天通天冠可更修理之雖在禮無文知天子所冠其来尚矣徐爰曰博山附蟬謂之金顔唐志通天冠冬至受朝賀祭還燕羣臣養老之服也二十四梁附蟬十二施珠翠金博山介幘組纓翠緌玉犀簪導絳紗袍朱裏紅羅裳白紗中單朱領褾裾白裙襦絳紗蔽膝白羅方心曲領白韈黑舄白假帶齊志後代沿革見漢志晉服制令其冠十三品見蔡邕獨斷宋朝天聖二年八月丙寅改承天冠後復舊漢委貌冠緇衣冠皮弁冠皮弁後漢志委貌冠皮弁冠同制長七寸髙四寸制如覆杯前髙廣後卑銳所謂夏之毋追商之章甫者也委貌以皁繒為之通典委貌形如委縠之貌皮弁以鹿皮為之行大射禮於辟雍公卿諸侯大夫行禮冠委貌衣玄端素裳執事者冠皮弁衣緇麻衣皁領袖下素裳所謂皮弁素積也淮南子髙皇帝履天子之圗籍造劉氏之貌冠注於新豐作竹皮冠也一曰委貌冠也晉志蔡邕云緇布冠即委貌冠也其制有四形一似武冠又一似進賢其一上方其下如幘顔其一刺上而方下緇布冠見上外戚傳平帝納后太師光太常歆及太卜太史令以下四十九人賜皮弁素績注師古曰以鹿皮為冠形如人手之弁合績素裳也朱衣而素裳績或作積謂襞積之若今之襈也郊祀志四月至奉髙梁父乙夘令侍中儒者皮弁縉紳射牛行事封泰山下東方改元封元年後禮志永平二年三月注天子皮弁素積親射大侯郊特牲冠義同始冠之緇布之冠大古冠布齊則緇之其緌也孔子曰吾未之聞也冠而敝之可也適子冠於阼以著代也醮於客位加有成也三加彌尊諭其志也冠而字之敬其名也委貌周道也章甫殷道也毋追夏后氏之道也周弁殷冔夏收三王共皮弁素積士冠禮爵弁服纁裳純衣緇帶韎韐注此與君祭之服雜記曰士弁而祭於公爵弁者冕之次其色赤而微黒如爵頭然或謂之緅其布三十升纁裳淺絳裳純衣絲衣也餘衣皆用布唯冕與爵弁服用絲韎韐緼韍也士緼韍而幽衡合韋為之士染以茅蒐皮弁服素積緇帶素韠注此與君視朝之服也皮弁以白鹿皮為冠象上古也積猶辟也以素為裳辟蹙其要中皮弁之衣用布亦十五升其色象焉疏三皇時以白鹿皮冒覆頭鉤頷遶項玄端玄裳黄裳雜裳可也緇帶爵韠注此莫夕於朝之服玄端即朝服之衣易其裳耳上士玄中士黄下士雜雜前玄後黄士皆爵韋為韠玉藻曰韠君朱大夫素士爵韋疏曰但正幅故得端名緇布冠缺項缺讀如頍青組纓屬于缺緇纚廣終幅長六尺皮弁笄爵弁笄緇組紘纁邉同篋注緇布冠無笄者著頍圍髮際結項中隅為四綴以固冠也今未冠笄者著巻幘頍象之所生也滕薛名蔮古内反為頍屬猶著纚今之幘梁也笄今之簪有笄者屈組為紘垂為飾無笄者纓而結其絛疏漢時卷幘之狀必以布帛繞髮際為之幘梁亦舉漢法以況韓延夀傳守潁川令文學校官諸生皮弁執俎豆隋志五經通義弁髙五寸前後玉飾董巴曰以鹿皮為之漢逺遊冠志逺遊冠制如通天有展筩横之於前無山述諸王所服天子五梁太子三梁諸侯王通服之獨斷曰禮無文淮南子楚莊王冠通梁組纓注通梁逺遊也魏志建安十九年三月授魏公金璽赤紱逺遊冠晉志傅玄云秦冠也似通天而前無山述有展筩横於冠前皇太子及王者後帝之兄弟帝之子封郡王者服之太子則以翠羽為緌綴以白珠其餘但青絲而已張鏡宋東宫儀記皇太子逺遊冠翠緌南齊志逺遊冠太子諸王所冠太子朱纓翠羽緌珠節諸王玄纓公侯皆同北齊制五梁乗輿所服隋志宋泰始六年皇太子服冕梁太子還冠逺遊後周太子朝賀袞冕九章隋開皇初非助祭皆冠逺遊冠隋志逺遊之制案漢雜事曰太子諸王服之晉令皇太子諸王給之唐志皇太子謁廟還宫元日朔日釋奠之服也三梁加金博山附蟬九首施珠翠簪導臨軒冊太子太子逺遊冠絳紗袍皇子冠衮冕逺遊冠緇布冠緇纚犀簪櫛實於箱宋朝至道元年天禧二年故事皇太子受冊命服逺遊冠朱明衣執桓圭朝㑹謁廟亦如之復製衮冕九章從祀及謁廟加元服納妃則服之謁廟乗金輅朝則乗馬漢髙山冠側注冠志髙山冠一曰側注制如通天不邪却直堅無山述展筩獨斷齊冠也髙九寸鐵為卷梁不展筩無山中外官謁者僕射所服胡廣曰髙山冠蓋齊王冠也秦滅齊以賜近臣謁者服之傳曰桓公好髙冠大帶注史記酈生初見髙祖儒衣而冠側注漢舊儀乗輿冠髙山冠飛月之纓月一作翮幘耳赤丹素裏此亦通于天子安帝立太子謁廟洗馬冠髙山晉志秦行人使官亦服之詩云髙山仰止取其矜莊賓逺者也通典其體側立而曲注隋於冠加三峯唐因之五行志昌邑王賀昭帝時遣中大夫之長安多治仄注冠注師古曰言形側立而下注非法冠及髙山也傅子曰魏明帝以髙山冠似通天逺遊除去卷筩令如介幘幘之上加物以象山行人使者服之晉志云改令卑下漢進賢冠志進賢冠古緇布冠也文儒者之服也獨斷曰漢制禮無文前髙七寸後髙三寸長八寸公侯三梁中二千石以下至博士兩梁自博士以下至小史私學弟子皆一梁宗室劉氏亦兩梁冠亦加服也王公以下初加進賢冠而已注建光中太官令兩梁冠以典掌王饔也博士兩梁崇儒也中平六年令三府長史兩梁晉志進賢冠古緇布之遺象也文儒之服前髙七寸後髙三寸長八寸有五梁三梁二梁一梁人主元服始加緇布則冠五梁進賢冠三公及封郡公郡侯縣鄉亭侯三梁卿大夫八座尚書闗内侯二千石及一千石以上則冠兩梁六百石以下則冠一梁注晉公卿禮秩曰太傅司空司徒著進賢三梁冠黑介幘唐志文武朝參三老五更之服也黑介幘青緌紛長六尺四寸廣四寸色如其綬通典云親王加金附蟬三品三梁五品兩梁九品以上及國官一梁六品以下私祭服皆用之侍中中書令左右散騎常侍有黄金璫附蟬貂尾侍左者左躡侍右者右躡復制緇布冠為始冠之冠禮儀志三老冠進賢扶玉杖加元服乗輿初緇布進賢隋志案漢官云元始五年令公卿列侯冠三梁二千石兩梁千石以下一梁梁别貴賤自漢始也雋不疑傳冠進賢冠帶櫑具劒文苑進賢冠賦寸之七比夫七徳梁之三取夫三端誡于人有傳古之義形于國有尊儒之風漢法冠獬豸冠柱後惠文冠志法冠一名柱後髙五寸以纚為展筩鐵柱卷執法者服之侍御史廷尉正監平也或謂之獬豸冠獬豸神羊能别曲直楚王常獲之故以為冠胡廣曰左氏傳有南冠而縶者則楚冠也國語陳侯棄衮冕而南冠以出秦㓕楚以其君服賜執法近臣服之荒淮南子楚文王好服獬冠楚國效之者異物志東北有獬豸一角性忠見人鬬則觸不直聞人言則咋不正者楚執法者所服也獨斷灋冠楚冠也一曰柱後惠文冠前傳蕭望之少史冠法冠淮南王安作漢使節法冠張敞弟武拜梁相曰梁國大都吏民凋敝當以柱後惠文彈治之耳注晉灼曰漢柱後法冠一號柱後惠文秦制執法服今御史服之獬豸一角今兩角以獬豸為名隋志如淳注漢官曰惠蟬也細如蟬翼今御史服之通典隋大業中改制一角唐因之御史所服漢武冠武弁鵕䴊冠繁冠建冠志武冠一曰武弁大冠獨斷曰或曰繁冠諸武官冠之侍中中常侍加黄金璫附蟬為文豹尾為飾謂之趙惠文冠又名鵕䴊冠胡廣說曰趙武靈王效胡服以金璫飾首前揷貂尾為貴職秦滅趙以其君冠賜近臣佞幸傳孝恵時侍中皆鵕䴊冠貝帶顔師古曰鵕䴊鷩鳥似山雞而小淮南子趙武靈王貝帶鵕翿而朝趙國化之建武時匈奴内屬世祖賜南單于衣服以中常侍惠文冠中黄門童子佩刀通典漢侍中揷左常侍揷右貂用赤黑色莽更漢家黒貂著黄貂天子元服亦為先加晉名繁冠一名建冠隋依北齊曰武弁唐制乘輿加金附蟬平巾幘侍中中書令加貂蟬漢官儀曰金取堅剛百錬不耗蟬居髙飲潔貂内勁悍外温潤此因物生義也谷永曰戴金貂之飾執常伯之職齊志按項氏說云漢侍中蟬刻為蟬像常侍但為璫而不蟬未詳何代所改隋志徐爰宋志謂籠冠後宦者傳漢中常侍參用士人銀璫左貂明帝以後中常侍十人小黄門二十人改以金璫右貂後魏志司馬彪云漢帝有四冠一緇布二進賢三武弁四通天冠魏都賦藹藹列侍金蜩齊光瑣語范獻子獵遺其豹冠漢建華冠方山冠志建華冠以鐵為柱卷貫大銅珠九枚制似縷鹿薛綜曰上輪小下輪大記曰知天者冠述知地者履絇鄭子臧好鷸冠前圎以為此則是也天地五郊明堂育命舞樂人服之方山冠似進賢以五采縠為之祠宗廟大予八佾四時五行樂人服之冠衣各如行方之色而舞通典曰晉因之東京賦冠華秉翟漢巧士冠却非冠志巧士冠髙七寸要後相通似髙山冠唯郊天黄門從官四人冠之在鹵簿中以備宦者四星獨斷曰髙五寸禮無文却非冠似長冠下縮垂五寸有纓㽔宫殿門吏僕射冠之負赤幡青翅燕尾獨斷曰禮無文之唐制亭長門僕服漢却敵冠志却敵冠前髙四寸通長四寸後髙三寸制似進賢衛士服之獨斷曰禮無文通典云晉制之漢樊噲冠志樊噲冠漢將樊噲造次所冠以入項羽軍廣九寸髙七寸前後出各四寸制似冕司馬殿門大儺衛士服之或曰噲常持鐵楯裂裳裹楯冠之入軍門立漢王旁視項羽後人壯其意制冠象焉通典似平冕十八侯銘操楯千鈞拔主項堂漢術氏冠周術氏冠志術氏冠前圎吳制差池邐迤四重趙武靈王好服之今不施用官有其圗注蔡邕曰其說未聞晉因之晉志或曰淮南子楚莊王復讎冠是也通典或曰楚莊王解冠是也前五行志注師古曰天將雨鷸知之逸周書知天文者冠鷸冠以鷸知天時故也春秋疏鷸一名翠羽可為飾刋誤正俗云逸禮記云云禮圗謂之術氏冠獨斷建華冠鷸冠記曰知天文者服之術士冠云云同志三禮圗云新圗誤題為術氏冠漢鶡冠志武冠俗謂之大冠環纓無㽔以青絲為緄加雙鶡尾𥪡左右為鶡冠上林賦蒙鶡蘇絝白虎被斑文子東京賦虎夫戴鶡劉向别録鶡冠居深山以鶡為冠莊子縵胡之纓武士之服是也之莊子趙劒士皆蓬頭突鬢垂冠曼胡之纓短後衣五官左右虎賁羽林五中郎將羽林左右監皆冠鶡冠紗縠單衣虎賁將虎文絝白虎文劒佩刀虎賁武騎皆鶡冠虎文單衣鶡者勇雉也其鬬對一死乃止故趙武靈王以表武士秦施之荀綽曰冠揷兩鶡徐廣曰似黒雉出上黨顔師古曰俗為鶡雞黄帝以鶡為旗幟漢爵弁志爵弁一名冕廣八寸長尺二寸如爵形前小後大繪其上似爵頭色有收持笄所謂夏收殷冔者也祠天地五郊明堂雲翹舞樂人服之禮曰朱干玉戚冕而舞大夏獨斷曰冕冠周曰爵弁殷曰冔夏曰收殷黑而微白前大而後小夏純黑而赤前小而後大皆以三十六升漆布為之詩曰常服黼冔上古以布中古以絲禮儀志加元服儀次爵弁次武弁通典周制爵弁士冠禮三加成人服之晉依漢制更名廣冕隋以角為簪導唐因之以紳代布用玄纓簪導漢幘赤幘納言幘帽翠帽志通典同古者有冠無幘其戴也加首有頍所以安物故詩曰有頍者弁秦加武將首為絳袙以表貴賤後稍作顔題漢孝文髙其顔題續之為耳崇其巾為屋上下羣臣貴賤皆服之文者長耳武者短耳稱其冠也尚書幘收方三寸名曰納言示以忠正明近職也迎氣五郊各如其色從章服也皁衣羣吏春服青幘立夏乃止尊其方也武吏常赤幘成其威也未冠童子幘無屋示未成人也東觀記曰段熲滅羌詔賜熲赤幘大冠一具額董仲舒止雨書曰執事皆赤幘獨斷曰元帝有壯髪始進幘服之羣臣随焉制紺幘以齋青幘以耕緗幘以獵緑幘董偃召見服之通典上古衣毛帽皮玄中記云旬始作帽周成王問周公舜冠何如曰古之人上有帽而勾領古者冠下有纚以繒為之後世施幘於冠因裁纚為帽自乗輿燕居下至庶人無爵者皆得服之魏管寜在家嘗著皁帽吳書云陸遜破曹休於石亭還上脫翠㡌賜遜朝謁服之宋制黑帽綴紫標標以繒為之後制髙屋白紗帽陳名白紗者為髙頂帽後魏咸著突騎帽垂裙覆帶蓋索髪遺象隋文開皇初嘗著鳥紗帽大業通服折上巾唐制白紗㡌又制烏紗帽西京賦天子戴翠帽注翠羽為車蓋倚金較瓊弁玉纓遺光儵爚後漢末王公名士以幅巾為雅是以袁紹崔豹之徒雖為將帥皆著縑巾按巾六國時趙魏之間通謂之承露袁紹戰敗幅巾渡河按此則庶人及軍旅皆服之全幅皁而向後幞髪謂之頭巾俗人謂之幞頭東晉制以葛為巾形如帢而横著之尊卑共服太元中國子生見祭酒博士冠角巾至齊立學王儉議更存焉唐始用巾子尚平頭小様者漢天子衣服制魏相傳奏髙皇帝所述書天子所服第八注如淳曰天子衣服之制也於施行詔書第八漢齊三服官元紀初元五年四月詔罷齊三服官注李斐曰齊國舊有三服之官春獻冠幘縰為首服絹素為冬服輕絹為夏服凡三地理志齊郡臨淄有服官又曰齊俗織為冰素綺繡純麗之物號為冠帶衣履天下襄邑亦有服官襄邑係陳留郡師古曰自出文繡非齊三服李說是縰即今之方目􅀢也輕綃今之輕􅀢也胡公曰服官主作文繡以給衮龍之服哀紀綏和二年六月哀帝詔曰齊三服官諸官織綺繡難成害女紅之物皆止無作輸貢禹傳元帝初上言故時齊三服官輸物不過十笥今作工各數千人一歲費數鉅萬天子納其忠乃詔罷之谷永傳元延元年永言願止京師郡國工服官造作以助大農章紀建初二年四月癸巳詔齊相省冰素素色鮮潔如冰方空紗薄如空也或曰空孔也即今方目紗縠吹綸絮縠紗也綸似絮而細吹者言吹噓可成亦紗也前書齊有三服官故詔齊相罷之馬廖傳上疏曰元帝罷服官成帝御浣衣哀帝去樂府而侈費不息者百姓從行不從言也周太宰節膳服之式凡皮枲絲屨皆掌于天官司服隷于宗伯蓋禮官辨其等天官制其用漢天子所服中謁者四人各舉一時而天子衣服御府又主之宗廟衣服郊祀文繡之服東織令又奉之皆統于少府悉出禁錢不以度大司農況丞相可均節之乎晉絳人為君復陶注主衣服之官西都賦虎賁贅衣注贅衣主衣之官書曰綴衣輿服志襄邑歲獻織成虎文衣裳玉佩備章采乘輿刺史公侯九卿以下皆織成陳留襄邑獻之禹貢正義漢陳留襄邑縣置服官使制作衣服是兖州綾錦羙也徐州篚玄纎縞文選注陳留記曰睢奐之間出文章奉宗廟御服魏都賦錦繡襄邑羅綺朝歌緜纊房子縑緫清河王符傳文組采牒錦繡綺素葛子升越筩中女布鹽鐵論齊陶之縑蜀漢之布景帝詔曰錦繡纂組害女紅者也光武敕㑹稽獻越布髙紀賈人毋得衣錦繡綺縠絺紵罽八年春三月郊祀歌曵阿錫注阿絹繒錫細布貨殖傳荅布孟康曰白疊也閩侯遺江都王以荃葛師古曰南方筒布之屬魯縞師古曰曲阜俗善作之叔孫通服短衣楚製江充衣紗縠單衣相如游獵賦被阿錫揄紵縞雜纎羅垂霧縠衯衯裶裶揚衪戍削吳縞帶鄭紵衣漢絳衣大冠絳衣紀見光武絳衣大冠驚曰謹厚者亦復為之時三輔吏士東迎更始見諸將過皆冠幘而服婦人衣諸于繡镼莫不笑之古今注建武十三年初令令長皆小冠東觀記光武起義衣絳單衣赤幘周禮司常注屬謂徽號今城門僕射所被及亭長著絳衣是其遺象昭紀丞相證事注張晏曰漢儀注比六百石絳衣奉朝賀正月元后傳獨衣絳緣諸于注師古曰諸于大掖衣即袿衣之類絳衣舎人見班彪便宜事前傳雋不疑褒衣博帶朱博守琅邪官屬多褒衣大祒博敕令掾史衣皆去地三寸江充衣紗縠禪衣漢官儀武賁中郎將衣之曲裾後垂交輸冠禪纚步揺冠飛翮之纓盖寛饒為衛司馬未出殿門斷其禪衣令短離地冠大冠帶長劒西京賦武士緹衣韎韐周禮注伍伯緹衣古兵服遺色文選䇿秀才文紫衣賤服猶化齊風長纓鄙好且變鄒俗墨子齊桓公髙冠博帶以治其國楚莊王鮮冠組纓絳衣博袍以治其國後魏元㑹帽上著籠冠袴上著衣褚緭譏之後周天元詔天臺侍衛之官皆著五色及紅紫緑衣以雜色為縁名曰品色衣與公服間服之隋大業六年百官從駕皆服袴褶於軍旅間不便是歲始詔從駕逺涉者文武官皆戎衣五品以上通著紫袍六品以下兼用緋緑南齊永明八年何胤為祭酒服朱衣唐龍朔二年九月戊寅初令八品九品衣碧玉海卷八十一
