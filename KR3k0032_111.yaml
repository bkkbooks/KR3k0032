body:
  text: 玉海卷一百十一宋王應麟撰學校學校上辟雍古者聖王設學校以教民由家及國大小有序民無不入其中而受學焉所以教之之具則因其天賦之秉彝為之品節以開導而勸勉之學之既成又興其賢能置之列位此先王學校之官所以為政事之本道德之歸不可一日廢也後世學校之設雖不異乎先王之時然其教與學皆忘本逐末懷利去義無復先王之意名雖在而實不舉遂以學校為虛文而無與於道德政理之實五帝成均見後文王世子注董仲舒曰五帝名大學曰成均則虞庠近是也疏春秋繁露云成均為五帝之學大司樂疏堯已上當代學亦各有名無文可知但五帝總名成均當代則各有别稱謂若三代天子學總名曰辟雍當代各有異名也三禮義宗自虞以上其名及制典籍所不詳虞上庠下庠周虞庠魯米廩王制有虞氏養國老於上庠養庶老於下庠周人養國老於東膠養庶老於虞庠虞庠在國之西郊注學名異者四代相變或上西或上東或貴在國或貴在郊上庠右學大學也在西郊以虞殷併言下庠左學小學也在國中王宫之東庠之言養也周之小學為有虞氏之庠制是以名庠云其立鄉學亦如之疏以學教孝悌之處於中養老虞殷尚質貴取物成故大學在西小學在東周小學為庠制者庠則後有室前有堂若夏后氏之序及周之學所在序者皆與庠制同其州黨之序則歇前而已序則豫也鄉學亦為庠制耆老皆朝於庠是也養老虞以燕禮皇而祭深衣而養老文王世子書在上庠祭義注四學謂周四郊之虞庠明堂位米廩有虞氏之庠也庠者言詳也於是以考禮詳事也魯謂之米廩虞帝尚孝魯以藏粢盛之委焉虞書夔命汝典樂教胄子北史邢劭曰二黌兩學盛自虞殷養黃髮而詢哲言育青襟而敷典教三禮義宗虞氏之學名庠庠養也所以養國之子弟使成雋德虞殷貴在近郊故大學在西教學之道貴在成德西方成就之鄉周制但西郊置虞庠小學而已禮司几筵疏大射在虞庠二典未有學字而先有教字夏東序西序夏校王制夏后氏養國老於東序養庶老於西序注東序亦大學在國中王宫之東西序亦小學也在西郊疏夏周貴文取積漸長養故大學在東小學在西西序在西郊周立小學於西郊是也養老夏以饗禮收而祭燕衣而養老月令仲春注將舞必釋菜於先師以禮之夏小正曰丁亥萬用入學文王世子學干戈羽籥於東序疏周立三代之學謂立虞夏殷學也虞之學制在國兼在西郊郊則周之小學也夏殷之學亦在國鄭注儀禮云周立四代之學於國合周家為言耳夏后氏之學在上庠即周之大學為夏之制也明堂位序夏后氏之序也注次序王事也孟子夏曰校校者教也漢儒林傳夏曰校鄉飲酒疏虞之庠周以為鄉學夏之序周以為州黨之學夏序有室周州黨序無室三禮義宗夏學名序者次序先王之道而學之夏周貴在於國故大學在東教國子弟使之長益東方陽位有生長之道故貴在宫之左周又以夏序為六遂之學夏殷謂之秀士周禮謂之賢能殷右學左學瞽宗小學大學殷序殷庠辟雍王制殷人養國老於右學養庶老於左學注右學大學在西郊左學小學也在國中王宫之東疏殷尚質貴取物成故大學在西周大學在國之西郊鄭駮異義云三靈一雍在郊者熊氏云文王之時猶從殷禮故辟雍大學在郊劉氏以為周之小學為辟雍在郊養老殷以食禮冔而祭縞衣而養老六十養於國七十養於學注國國中小學在王宫之左學大學也在郊小學在國中大學在郊此殷制明矣疏貴右而賤左小學在國中左也大學在郊右也與殷同天子命之教然後為學小學在公宫南之左大學在郊注此殷之制天子曰辟雍明和天下諸侯曰頖宫班政教尊卑異名注此小學大學殷之制疏左學小右學大故知殷制樂正崇四術注尚書傳曰年十五始入小學十八入大學文王世子禮在瞽宗明堂位瞽宗殷學也注樂師瞽矇之所宗也古者有道德者使教焉樂祖於此祭之孟子殷曰序序者射也漢儒林傳太常臧等議曰三代之道鄉里有教夏曰校殷曰庠周曰序建首善自京師始三禮義宗殷學為瞽宗者宗尊也瞽無見之稱譬童蒙無有所識又樂官也武王之時猶從殷法立學故小學在東左射貍首小學右射騶虞大學自殷以前王者之學無辟雍頖宫之名詩疏王制以殷之辟雍與大學為一周四學小學五學中學三代學四代學周庠鄉學東膠虞庠大學周序東絿文王世子文王之為世子也凡學世子及學士必時春夏學干戈干戈之舞象武也用動作之時學之秋冬學羽籥羽籥之舞象文也用安靜之時學之皆於東序正義皆年二十入大學者小樂正學干小樂正樂官也大胥贊之籥師學戈籥師丞贊之四人皆樂官之屬胥鼓南或云二南也南夷之樂也胥掌夷樂春誦夏弦誦謂歌樂也弦謂以絲播詩居樂語有六誦居一樂音有八弦一焉大師詔之瞽宗秋學禮執禮者詔之冬讀書典書者詔之禮在瞽宗書在上庠注陽用事則學聲隂用事則學事周立三代之學學書於有虞氏之學典謨之教所由興也學舞於夏后氏之學文武中也學禮樂於殷之學功成治定與已同也疏云周立虞夏殷學學書於虞氏之學虞書有典有謨故就其學中而教之則周之小學也夏后氏上受舜禪是文下有湯武是武以此二者之間故云文武中以兼有文武舞也學禮於殷學以革命相似案下養老於東序是周之大學夏東序也王制養老於虞庠是周之小學虞庠也凡祭與養老乞言合語之禮皆小樂正詔之於東序合語謂鄉射飲酒大射燕射之屬大樂正學舞干戚語説命乞言皆大樂正授數篇數疏小樂正教威儀事淺大樂正教義理事深大司成論説在東序大司成司徒之屬師氏也疏書傳大夫為父師周禮師氏中大夫凡侍坐於大司成者逺近間三席可以問終則負牆列事未盡不問注席之制廣三尺三寸三分所謂函丈凡大合樂必遂養老凡語于郊者必取賢斂才焉或以德進或以事舉或以言揚注大樂正論造士之秀者升諸司馬曰進士謂此矣曲藝皆誓之以待又語三而一有焉乃進其等以其序謂之郊人逺之於成均大司樂掌成均之法以及取爵於上尊也注董仲舒曰五帝名大學曰成均則虞庠近是也天子飲酒於虞庠則郊人亦得酌於上尊以相旅始立學者既興立釁器用幣然後釋菜不舞不授器乃退儐于東序一獻無介語可也言乃退謂得立三代之學者釋菜於虞庠則儐賔于東序魯之學有米廩東序疏語于郊西郊也周以虞庠為小學在西郊今天子親視學於西郊考課論説成均則虞庠也上尊堂上之酒尊天子於成均之內飲酒以恩澤被及於此郊人郊人雖賤亦得取爵於堂上之尊以相旅也所以榮之董仲舒為春秋繁露云成均為五帝之學虞庠是舜學以無正文故云近是釁器以下皆據諸侯之禮諸侯得有夏之東序謂諸侯有功德者得立三代學若魯之比東序與虞庠相對東序在東虞庠在西既退儐于東序明釋菜在於虞庠皇氏云尋常視學則養老於東膠若始立學則養老於東序以為周立三代之學又立周之大學於東謂之東膠立小學於西郊謂之虞庠行一物而三善皆得者惟世子而已其齒於學之謂也故世子齒於學國人觀之曰將君我而與我齒讓何也曰有父在則禮然然而衆知父子之道矣其二曰將君我而與我齒讓何也曰有君在則禮然然而衆著於君臣之義也其三曰將君我而與我齒讓何也曰長長也然而衆知長幼之節矣故父在斯為子君在斯謂之臣居子與臣之節所以尊君親親也故學之為父子焉學之為君臣焉學之為長幼焉父子君臣長幼之道得而國治語曰樂正司業父師司成一有元良萬國以貞世子之謂也祭義食三老五更於太學所以教諸侯之弟也祀先賢於西學所以教諸侯之德也西學周小學也先賢有道德王所使教國子者疏周之小學在西郊王制云虞庠是也食三老五更於太學天子袒而割牲執醬而饋執爵而酳冕而總干所以教諸侯之弟也天子設四學注四學謂周四郊之虞庠疏皇氏云四郊皆有虞庠當入學而太子齒疏謂設四代之學周學殷學夏學虞學也虞庠為小學設置於四郊據周言之當入學之時而太子齒於國人王制樂正崇四術立四教順先王詩書禮樂以造士春秋教以禮樂冬夏教以詩書注樂正樂官之長掌國子之教尚書傳曰年十五始入小學十八入大學詩樂者聲陽也書禮者事隂也其術相成疏書傳略説文王太子王子羣后之太子卿大夫元士之適子國之俊選皆造焉凡入學以齒注皆以長幼受學不用尊卑疏長幼受學雖王太子亦然文王世子云齒讓注習禮皆於大學疏禮在瞽宗殷之大學也若周則大學曰東膠餘子十八入大學嫡子二十入大學皆殷法也若周法立大學在公宫之左即東膠又立小學於西郊即虞庠其習書於虞學習禮樂於殷學習舞於夏學故文王世子云云詩則無文鄭注云弦謂以絲播詩則習詩亦在瞽宗至二十入大學之時仍於大學之中兼習四術是周之大學亦習禮也疏又云按尚書周傳云王子公卿大夫元士之適子十三入小學二十入大學又書傳略説餘子十五入小學十八入大學周人養國老於東膠養庶老於虞庠虞庠在國之西郊注東膠大學在國中王宫之東虞庠亦小學也周立小學於西郊膠之言糾也庠之言養也周之小學為有虞氏之庠制是以名庠云其立鄉學亦如之膠或作絿疏夏周貴文皆上東庠則後有室前有堂周人冕而祭玄衣而養老學記國有學疏國謂天子所都及諸侯國中周禮天子立四代學教世子及羣后之子及鄉中俊選所升之士而尊魯亦立四代學餘諸侯於國但立時王之學大學始教皮辨祭菜示敬道也宵雅肄三官其始也入學鼓篋孫其業也未卜禘不視學遊其志也時觀而弗語存其心也幼者聽而弗問學不躐等也此七者教之大倫也熊氏云始教謂始立學教樂記武王郊射為射宮於郊左射貍首東學在王宫之左右射騶虞西學也食三老五更於大學注周名大學曰東膠禮夏官諸子春合諸學秋合諸射注學大學射射宫也疏大學在國中即夏東序在王宫之左也射宫即國之小學在西郊則虞庠是也孟子周曰庠鄉學也庠者養也學國學也則三代共之所以明人倫漢儒林傳周曰序三禮義宗自虞至周凡四代之學虞夏及殷各立其學周則兼而立之有虞大學為上庠小學為下庠夏后氏大學為東序小學為西序殷大學為右學小學為左學周大學為東膠小學為虞庠此四代之學名也周四郊之虞庠西郊是四郊之一故亦謂之四郊惟立一小學於西郊但王者相變是以立學之名互有不同至於為學之制凡有二義一學之制與明堂同體五室四堂共一基之上東堂謂之東學南堂謂之南學西堂謂之西學北堂謂之北學中央謂之大學二義云凡立學之法有四郊及國中在東郊謂之東學南郊謂之南學在西郊謂之西學在北郊謂之北學在國中謂之大學故鄭注祭義云周有四郊之虞庠也禮保傅篇曰帝入東學尚親而貴仁入西學尚賢而貴位入南學尚齒而貴德入北學尚貴而貴爵入大學承師而問道故魏文侯孝經傳云大學者中學也帝入學者皆謂養老之時故王制養國老於上庠養庶老於下庠夏養國老於東序養庶老於西序殷養國老於右學養庶老於左學周養國老於東膠養庶老於虞庠此四代養老之法故言尚親貴賢尚齒尊爵之義也庠之言養也序者次序也明次序先王之道而學之瞽宗學官也膠之言糾也所以糾録學士使成其德然天子之學者所以行禮樂宣德化於天下使之成德又養三老五更與諸侯行禮之處謂之辟雍辟雍者蓋圜若璧壅之以水取流而無極使學者進德而不已亦謂辟者明也雍者和也明此學中非但教學亦所以明政教故王制曰天子之學曰辟雍諸侯之學曰泮宫然置學之處四代不同或尚於西或尚於東或貴在國或貴在郊此隨代取法故所尚不等是以鄭注王制曰上庠右學大學也在西郊下庠左學小學也在國中東序東膠亦大學也在國中王宫之東西序虞庠亦小學也在西郊虞商貴在於郊故大學在西夏周貴在於國故大學在東周人立小學於西謂之虞庠者以其制似有虞之學故因以名武王之時猶從殷法小學在東及周公制禮移小學在西然則周之制法凡有五學但立三代之大學而不立三代之小學所以知其然者文王世子云學舞於東序學禮於瞽宗學書於上庠此大學也皆是三代之大學而無下庠西序小學之文王制云周人養國老於東膠養庶老於虞庠此其二學故云有五學周之虞庠在西郊者祭義云祀先賢於西學所以教諸侯之德也鄭注云西學周小學也似有虞之庠制故云虞庠在西郊然則周制凡五學儀禮注鄉射禮周立四代之學於國而又以有虞氏之庠為鄉學鄉飲酒義曰主人迎賔于庠門外是也庠之制有堂有室劉敞曰周立四代之學者一處並建四學周人辟雍居中其北為虞學其東為夏學其西為殷學學羽干者就東序學禮者就瞽宗學書者就虞庠辟雍唯天子養老及出師成謀受俘大射等就焉又以虞庠建於鄉故鄉有庠以夏序建於州故州有序以殷校建於黨故黨有校自黨以下皆為小學而非四代之制以教童子而已大學在郊以其包四代之制故記禮者或指虞庠或指東序名之禮象曰辟雍居中其南為成均北為上庠東為東序西為瞽宗漢祭祀志注蔡雍明堂論曰東序東之堂也學者詔焉故稱大學禮記大學志曰云云大戴禮注白虎通曰八嵗入小學十五入大學此太子之禮尚書大傳曰公卿之太子大夫元士適子十三入小學二十入大學此王子入學之期內則曰十年就外傅謂公卿以下教子於家也詩靈臺疏大戴禮盛德篇云明堂外水名曰辟雍政穆篇稱大學明堂之東序周辟雍西雍辟池詩靈臺於論鼓鍾於樂辟雍文王之學注水旋丘如璧曰辟雍以節觀者蔡雍云水廣二十四丈四周於外正義辟雍即天子太學也靈臺辟雍皆在郊周立三代之學虞庠在國之西郊則周以虞庠為辟雍矣文王有聲鎬京辟雍武王之學注武王於鎬京行辟雍之禮思齊雍雍在宫肅肅在廟不顯亦臨無射亦保箋宫謂辟雍宫也羣臣助文王養老則尚和助祭於廟則尚敬文王之在辟雍雖有賢才之質而不明者亦得觀禮無射才者亦得居位振鷺于飛于彼西雍先儒謂辟雍在西郊故曰西雍王制天子曰辟雍諸侯曰頖宫明堂位頖宫周學也禮統辟雍圓如璧壅以水內如覆外如偃盤大戴禮盛德篇明堂外水曰辟雍莊子文王有辟雍之樂白虎通辟者象璧圜以法天雍者壅之以水象教化流行禮記明堂隂陽録水左旋以象天史記封禪書豐滈有天子辟池索隱曰即周天子辟雍之地正義曰周文武豐鄗皆置辟雍故秦立祠漢郊祀志周公相成王王道大洽制禮作樂天子曰明堂辟雍諸侯曰頖宫此在成王時三輔黃圗文王辟雍在長安西北四十里亦曰璧雍戰國䇿序周自文武設辟雍泮宫庠序之教蔡雍月令論清廟太廟明堂大學辟雍異名而同事五經通義辟雍養老斆學之所也詩正義鄭氏駁異義云韓詩説辟雍天子之學圜如璧壅之以水所以教天下春射秋饗尊事老更在南方七里之內立明堂於中左氏説天子靈臺在大廟之中壅之以靈沼謂之辟雍玄按辟雍及三靈臺囿沼皆同處在郊正義又曰周制大學在國大學雖在國而辟雍仍在鄉袁準正論云辟雍大射之處後漢書注韓詩薛君章句曰西雍文王之雍也言文王之時辟雍學士皆潔白之人也禮器疏天子以小學為辟雍朱氏曰振鷺之詩説者以雍為澤蓋即旋丘之水而其學即所謂澤宫孟子謂序者射也學蓋有以射為主者蘇氏引莊周云云以辟雍亦為樂名古人以樂教胄子則又以為習樂之所張子曰古無此名制始於此及周有天下遂以名天子之樂而諸侯不得立焉周成均五帝成均見上文王世子郊人逺之於成均以及取爵於上尊也注董仲舒曰五帝名大學曰成均則虞庠近是也禮大司樂中大夫二人掌成均之法以治建國之學政而合國之子弟焉凡有道有德者使教焉死則以為樂祖祭於瞽宗以樂德樂語樂舞教國子注鄭司農云均調也樂師主調其音大司樂主受此成事已調之樂玄謂董仲舒云成均五帝之學仲舒之語蓋出繁露成均之法者其遺禮可法者國之子弟公卿大夫之子弟當學者謂之國子文王世子曰於成均以及取爵於上尊然則周人立此學之宫疏釋云周人以成均學之舊法式以立國之學內政教也樂師下大夫四人掌國學之政以教國子小舞大胥中士四人掌學士之版以待致諸子春入學舍菜合舞秋頒學合聲小胥下士八人掌學士之徵令而比之觥其不敬者籥師掌教國子舞羽吹籥易氏曰成者成其行之虧均者均其習之偏五帝即此以名學成周因之以為教成均者教人之名充之為道德者教人之實出於性分為樂德形於聲歌為樂語見於發揚蹈厲為樂舞教國子弟必命大司樂者樂之入人易感人深使人鼓舞其中遷善而不自知有虞命夔典樂教胄子王制樂正崇四術周門闈學五學學禮四學地官師氏教國子三德至敏孝三行孝友順居虎門之左司王朝路寢門也使其屬守王之門外中門之外學北史劉芳傳引蔡氏勸篇云周之師氏居虎門左今之祭酒則周師氏保氏教國子六藝六儀使其屬守王闈注宫中之巷門冬官匠人闈門容小扄參個注廟中之門曰闈大戴禮保傅篇學禮曰賈誼傳及新書同帝入東學上親而貴仁則親疏有序而恩相及矣帝入南學上齒而貴信則長幼有差而民不誣矣帝入西學上賢而貴德則聖智在位而功不遺矣帝入北學上貴而尊爵則貴賤有差而下不踰矣帝入太學承師問道退習而考一作端於太傅太傅罰其不則而達其不及則德智長而治道得矣三禮義宗引禮保傅篇云帝入東學云云此五學者既成於上而百姓黎民化輯於下矣學成治就此殷周之所以長有道也成王年十三即位十五亦入學觀禮布政故引天子之禮言之八嵗出就外舍注小學謂庠門一作虎闈師保之學也文選王元長曲水詩序入虎闈而齒胄注翰曰虎闈教國子之學所也公卿之子為胄子太子入學以年大小為次故曰齒胄李善曰蔡雍明堂月令論曰周官有門闈之學周禮師氏以三德教國子居虎門之左漢祭祀志注蔡雍明堂論曰明堂者天子太廟朝諸侯選造士於其中以制度生者乘其能而至死者論其功而祭故為大教之宫而四學具焉取其宗祀之清則曰清廟取其正室之貌則曰太廟取其尊崇則曰太室取其堂則曰明堂取其四門之學則曰太學取其四面周水圜如璧則曰辟雍異名而同事其實一也易傳太初篇曰云云禮記保傅篇曰云云與易傳同魏文侯孝經傳曰太學者中學明堂之位也禮記古大明堂之禮曰膳夫是相禮日中出南闈見五候門子日側出西闈視五國之事日暗出北闈視帝節猶爾雅曰宫中之門謂之闈王居明堂之禮又别隂陽門南門稱門西門稱闈故周官有門闈之學師氏教以三德守王門保氏教以六藝守王闈然則師氏居東門南門保氏居西門北門知掌教國子與易傳保傅王居明堂之禮參相發明為四學焉文王世子篇曰東序云云禮記太學志曰禮士大夫學於聖人善人祭于明堂其無位者祭于太學禮記昭穆篇曰祀西賢于西學所以教諸侯之德也即所以顯行國禮之處也太學明堂之東序也皆在明堂辟雍之內樂記曰武王伐殷為俘馘于京太室太室辟雍之中明堂太室也與諸侯泮宫俱獻馘此皆明堂太室辟雍太學事通合之義也其制度數各有所法三禮義宗內則云人君之子十年出就外傅傅者教學之官文王世子云立大傅少傅以養之然則未入學時已有傅矣是以內則云出就外傳謂就外室而受教也外室在虎門之左師氏之旁而築宫焉即謂異宫也至年十三則入小學小學者周則西郊之虞庠十五則入大學謂入於東膠之等入小學之時則大傅在前少傅在後當入學之時國之子弟亦從學焉至於休息還返别宫居宿出入則受師保之訓故云入則有保出則有師謂燕居出入時也教諭德成由有二傅師保之訓也師保但明德藝之術出入前後教道而已非執經者也在小學習經典皆受之於執經者入大學亦從受詩書禮樂之業至於崇尚其術皆大樂正所為鄭注父師司成則大司成也周禮則師氏之官也詩靈臺疏袁準正論曰周置師保之官居虎門之側然則學宫非一處也柳文周人置虞庠於四郊以養國老教胄子祭統曰天子設四學蓋其制也易傳太初篇曰天子旦入東學晝入南學夕入西學暮入北學在中央曰太學天子之所自學也蔡雍引之以定明堂之位焉大戴禮保傅篇曰帝入東學以貴仁入南學以貴德入西學以貴義入北學以尊爵賈生述之以明太子之教焉故曰為大教之宫而四學具焉參明堂之政原大教之極其建置之道弘也四門助教壁記禮大宗伯注王之故舊朋友為世子時共在學者也疏案文王世子成王伯禽在學與學子同居又王制有王太子是為世子時共在學者也王制主於教造士而王太子王子亦預焉文王世子主於斆世子而國之學士亦及焉周四學前雖已備此更排比東膠亦曰大學王制周人養國老於東膠注東膠大學在國中王宫之東膠或作絿樂記食老更於大學注周名大學曰東膠祭義養三老五更於大學即東膠也或曰在東序而東序在大學中天子袒而割牲執醬而饋執爵而酳冕而總干所以教諸侯之悌也文王世子凡學春官釋奠于其先師秋冬亦如之凡始立學者必釋奠于先聖先師行事必以幣凡釋奠必有合大合樂必遂養老王制天子出征受成於學反釋奠于學以訊馘告王制疏周立三代太學在公宫左立小學于西郊即虞庠習書之所習禮樂于商學習舞于夏后氏之學虞庠王制周人養庶老于虞庠虞庠在國之西郊注立小學于西郊曰虞庠三禮義宗亦曰制似有虞氏之學文王世子凡學冬讀書典書者詔之書在上庠祭義祀先賢于西學所以教諸侯之德也周小學大司樂掌成均之法以治建國之學政而合國之子弟焉即虞庠學也文王世子凡語于郊者論説于郊學必取賢斂才焉或以德進或以事舉或以言揚曲藝皆誓之以待又語三而一有焉乃進其等謂之郊人逺之於成均以及取爵於上尊也注天子飲酒於虞庠則郊人亦得酌於上尊以相旅仲舒云五帝學曰成均虞庠近是也東序文王世子凡養老乞言合語之禮小學正詔之於東序大司成論説在東序天子視學大昕鼓以警衆祭先師先聖乃適東序釋奠于先老遂設三老五更羣老之位焉有司告樂闋王乃命公侯伯子男及羣吏曰反養老于東序凡學世子及學士春夏學干戈秋冬學羽籥皆在東序小樂正學干大胥贊之籥師學戈籥師丞贊之胥鼓南注學舞於夏之學文武中也始立學既釁器用幣然後釋菜不舞不授器乃退儐於東序一獻無介語可也瞽宗瞽之人所宗文王世子春誦夏弦大師詔之瞽宗秋學禮執禮者詔之禮在瞽宗大司樂教國子弟凡有道有德者使教焉死則以為樂祖祭於瞽宗明堂位瞽宗殷學也保傅篇注四學者東序瞽宗虞庠及四郊之學也王肅云天子四郊有學去都五十里北史劉芳傳自周已上學惟以二或尚東尚西或在國在郊爰暨周室學蓋有六師氏居內大學在國四小在郊禮記云虞庠在國之四郊又云天子設四學保傅篇云五學按鄭注學記周則六學所以然者注云內則設師保以教使國子學焉外則有大學庠序之官此其證也學誦弦於瞽宗詔論説於東序觀道德於成均考中正於王闈無一時而非學也周鄉遂學鄉學又見上閭孰夏殷黨庠學記家有孰黨有庠術遂有序國有學注古者仕焉而已者歸教於閭里朝夕坐於門門側之堂謂之孰周禮五百家為黨萬二千五百家為遂疏周禮百里之內二十五家為閭同共一巷巷首有門門邊有孰民在家之時朝夕出入常受教於孰白虎通云古之教民百里皆有師里中之老有道德者為里右師其次為左師教里中之子弟以道義孝悌仁義也黨中立學教閭中所升者遂中立學教黨學所升者書傳略説云大夫七十致仕退老歸其鄉里大夫為父師士為少師新穀已入餘子皆入學距冬至四十五日始出學上老平明坐於右孰庶老坐於左孰餘子畢出然後皆歸夕亦如之周禮六鄉之內比閭族黨州鄉六遂之內鄰里鄼鄙縣遂舉黨遂則餘閭里以上皆有學可知鄭注州長職云序州黨之學鄉飲酒義主人拜迎賔庠門之外注云庠鄉學也則黨學曰序鄉學曰庠凡六鄉之內州學已下皆為庠六遂之內縣學已下皆為序庾氏云黨有庠謂夏殷禮非周法疏又云內則設師保外則設庠序以教之故云教學為先王制命鄉簡不帥教者以告耆老皆朝于庠注鄉學也元日習射上功習鄉上齒鄉謂飲酒也不變命國之右鄉移之左左鄉移之右如初禮習禮於鄉學不變移之郊鄉界之外習禮於郊學移之遂如初禮逺郊之外曰遂習禮於遂之學命鄉論秀士升之司徒曰選士疏云耆老則書傳略説云大夫為父師士為少師是也習射上功在州學習鄉上齒在黨學遂大夫亦帥國之俊選於遂學而行禮六鄉州學主射黨學主正齒位遂則縣與州同鄙與黨同縣鄙皆屬於遂總曰遂學大司徒命鄉大夫考校鄉學秀異之士移名於司徒地官州長春秋以禮會民而射于州序二千五百家為州注序州黨之學也會民而射所以正其志黨正國索鬼神祭祀則以禮屬民飲酒于序以正齒位鄉大夫鄉射之禮疏按儀禮鄉射云豫則鉤楹內堂則由楹外序則物當棟堂則物當楣堂謂鄉學據鄉大夫所行射禮也豫謂州長二時習射於序鄉射鄭注豫者謂州學也讀如榭周禮作序三禮義宗周人又以虞氏之庠為六鄉之學夏氏之序為六遂之學亦以序為黨學榭為州學鄉學在郭外之郊遂學在逺郊之上儀禮州學名豫鄭注云豫宜從榭州立榭者下鄉也今文豫為序序乃夏學非也周禮州學為序者字之誤也序庠制有室豫制無室記鄉飲酒義疏天子六鄉諸侯三鄉卿二鄉大夫一鄉各有鄉大夫而鄉有鄉學取致仕在鄉之中大夫為父師致仕之士為少師在學中名為鄉先生使之教鄉中之人每年入學三年業成必升於君文王世子疏鄉學為庠鄉飲酒義迎賔庠門之外學記黨有庠是鄉之所居黨也州及遂以下皆謂之序州長春秋射于序學記術有序漢志里有序鄉有庠春將出民里胥平旦坐右孰鄰長坐左孰餘子在序室八嵗入小學十五入大學秀異者移鄉學于庠序庠序之異者移國學于少學公羊注云小學諸侯嵗貢少學之異者學于大學命曰造士公羊注同不父老教于校室有春秋傳子産毁鄉校則鄉又校禮黨正疏鄉大夫去民逺不讀法州長去民漸親故四讀法黨正去民彌親故七讀法族師十四讀法彌多於此故云彌親民者於教亦彌數鄉射禮注退還射宫疏曰射宫者鄉庠州序是也射於序鄉飲酒在庠以其序無室庠有室序無室則無户牖設席亦當户牖之處耳王制注周小學為有虞之庠制其立鄉學亦如之公羊注十月事訖父老教於校室八嵗學小學十五學大學其有秀者移於鄉學鄉學之秀者移於庠庠之秀者移於國學學於小學諸侯嵗貢小學之秀者於天子學於大學其有秀者命曰造士行同而能偶别之以射然後爵之周教國子地官師氏以三德教國子教三行掌國中失之事以教國子弟凡國之貴遊子弟學焉注國子公卿大夫之子弟師氏教之而世子亦齒焉學君臣父子長幼之道保氏養國子以道教之六藝六儀注養國子以道者以師氏之德行審諭之而後教之以藝儀春官大司樂以樂德樂語樂舞教國子大胥掌學士之版以待致諸子學士謂鄉大夫諸子學舞者春入學舍菜合舞秋頒學合聲小胥掌學士之令而比之籥師掌教國子舞羽吹籥樂師教國子小舞帥學士而歌徹夏官諸子掌國子之倅掌戒令教治凡國之政事國子存遊倅使之修德學道春合諸學秋合諸射以考其藝而進退之注遊倅倅之未仕者學大學也射射宫也王制曰春秋教以禮樂冬夏教以詩書王制注樂正掌國子之教虞書曰夔命汝典樂教胄子周語宣王欲得國子之能導訓諸侯者樊穆仲曰魯侯孝三禮義宗諸侯之子亦以十年出就外傅學書計於外在公宫之左路門之外正朝之東别立宫焉傅亦有二詩凡周之士不顯亦世肆成人有德小子有造古之人無斁譽髦斯士箋以身化其臣下成其俊乂之美周之制自王宫國都閭巷黨術莫不有學司徒總其事樂正崇其教下至庠孰皆以民之有道德者為左右師自天子之元子衆子公卿大夫士之適子至庶民之子弟八嵗入小學教之灑掃應對進退之節禮樂射御書數之文十有五進乎大學教之致知格物正心誠意之道去民近者施教密州長屬民讀法嵗不過四黨正七族師十有四閭胥則無時矣古者國子舍于王宫教于師氏時會于大司樂以習誦弦學樂舞萬民居于比閭教于孰師時屬于州序以受教法正齒位皆非常廩之士也自漢景時文翁為蜀郡守立學官置左右生而郡國之養士始此武帝立博士弟子員而大學之養士始此古者以有道德者教國子父師少師教于閭孰禮所謂鄉先生者自鄉治廢教法壞至新莽始於校學立經師繇是有郡文學州博士之等逮我慶厯設教授之官古者養之於成均以觀其德行雖天子之元子亦齒於士也列之於王闈以考其中失雖大夫元士之子亦列於王子也合以井牧聨以比閭教以庠序導以師長維以諌救考以德藝無一民不相聨屬正嵗孟月之吉黨里社禜之會無一時不相警䇿故教行俗成而君師之分盡諸子考其德行道藝進退之有已入太學而復退之者宿衛者號故士新升試士末得正爵者號新士有已升司馬而未遽爵者貴遊子弟杜子春謂雖貴猶學有已貴而猶在學者先王之時其人則四民也其居則六鄉三采五比四閭也其田則一井二牧三屋九夫也其官則三吏六聨五侯九伯也其教則五事五典也其學則六德六行五禮六樂五射五馭六書九數也少而習之長而安焉周官所述惟大司樂成均之法師氏王宫之教鄉遂屬民讀法之節而它未有考三代之王域九州以居民天子諸侯有君師之職公卿有師保之義里居有父師少師之教故民聚而教行魯四代學泮宫詩魯頌泮水僖公修泮宫箋辟雍者築土雍水之外圓如璧四方來觀者均也泮半也半水者蓋東西門以南通水北無也明堂位注頖班也於以班政教正義曰王制天子辟雍諸侯泮宫諸侯止有泮宫一學魯所立非獨泮宫明堂位曰米廩虞庠序夏序瞽宗殷學頖宫周學是魯禮得立四代之學此詩頌其修泮宫其行禮之飲酒養老兵事之受成告克當於周世之學在泮宫也僖公伐淮夷將行則在泮定謀既克則在泮獻馘禮器魯人將有事於上帝必先有事於頖宫注頖宫郊之學也詩所謂頖宫也字或作郊宫疏魯侯大學在公宫東魯以小學為頖宫在郊天子亦以小學為辟雍故鄭駁異義云三靈二雍在郊蓋射以擇士説文泮諸侯鄉射之宫西南為水東北為牆三禮義宗魯立三代之學其餘諸侯但立時王之學而已周之諸侯所立之學皆曰頖宫故曰頖宫周學也文王世子注魯學有米廩東序瞽宗疏天子立虞夏殷周四代之學若諸侯止立時王一代之學有大學小學耳其鄉學為庠若州黨與鄉同處共在鄉學州及遂以下皆謂之序漢太學增弟子員學校官武紀漢承百王之弊髙祖撥亂反正文景務在養民至於稽古禮文之事缺焉孝武初立卓然罷黜百家表章六經遂疇咨海內舉其俊茂與之立功興大學修郊祀改正朔定厯數協音律作詩樂建封禪禮百神紹周後號令文章煥焉可述後嗣得遵鴻業而有三代之風贊宣紀本始二年詔曰孝武興太學修郊祀儒林傳公孫弘為學官乃請白丞相御史言制曰其令禮官勸學講議洽聞謹與太常博士議請因舊官而興焉為博士官置弟子五十人昭帝增滿百人宣帝末增倍黃龍二年稍增員十二人元帝好儒通一經者皆復設員千人初元五年四月詔博士弟子毋置貟以限學者永光三年冬復博士弟子貟郡國置五經百石卒史成帝末或言孔子布衣養徒三千人今天子太學弟子少於是增弟子貟三千人嵗餘復如故云云自武帝立五經博士建元五年春開弟子貟元朔五年夏六月置博士弟子貟設科射䇿訖于元始百有餘年傳業者寢盛枝葉蕃滋一經説至百餘萬言大師衆至千餘人蓋祿利之路然也初書帷有歐陽禮后易楊春秋公羊而已孝宣世復立大小夏侯尚書大小戴禮施孟梁丘易穀梁春秋至元帝世復立京氏易平帝時又立左氏春秋毛詩逸禮古文尚書所以網羅遺失兼而存之具在其中矣賈山傳文帝二年上書願以夏嵗二月定明堂造大學修先王之道董仲舒傳對䇿曰養士之大莫大於太學太學者賢士之所關也教化之本原也臣願陛下興太學置明師以養天下之士數考問以盡其材則英俊宜可得矣又立學校之官皆自仲舒發之何武傳學長安歌太學下鮑宣傳哀帝時為司隸坐拒使者下廷尉博士弟子濟南王咸等舉幡太學欲救鮑宣司隸者會此諸生會者千餘人藝文志曲臺后蒼九篇注如淳曰行射禮於曲臺后蒼為記故名曲臺記晉灼曰天子射宫也西京無太學於此行禮也三輔黃圖漢大學在長安西北七里去城七里東為常滿倉倉之北為槐市門三輔舊事云漢大學中有市有獄在長安門東書杜立五經博士貟弟子萬餘人太平御覽黃圗曰禮小學在公宫之南大學在城南就陽位也去城七里王莽為宰衡起國學於郭門之西南為博士之宫中央為射宫西京無大學武帝所興之學則罷出百家表章六經而已興學猶言興起古學也其隸習之地則太常也傳授之師則五經博士也公孫弘曰古者政教未洽不備其禮請因舊官而興焉蓋可見矣學官所在黃圗謂在長安西北七里而近三輔舊事謂有市獄長安志亦引關中記謂在安門之東杜門之西晉灼乃云西京無太學行禮射於曲臺然宣帝時何武學長安歌太學下轉而上聞哀帝時王咸舉幡太學下任延為諸生學於長安明詩易春秋顯名太學所謂因舊官而興者豈以博士舊授徒之黌舍置弟子貟而因舊典修之耶或曰晉灼指漢初言或曰太學三雍宫孝武始立黃圗記孝武時事也以功令考之博士官置弟子五十人太常擇儀狀此太常所補也郡國謹察可者與計偕詣太常受業如弟子此郡國所察也是皆始於文翁蜀郡之起學宫發於仲舒對䇿之論養士漢雒陽太學銘講堂車駕幸太學十四博士石經紀光武建武五年十月幸魯初起太學陸機洛陽記曰太學在洛陽城故開陽門外去宫八里講堂長一丈廣三丈車駕還宫幸太學賜博士弟子各有差章帝元和二年五月戊申賜博士弟子貟在大學者布人三匹令郡國上明經者口十萬以上五人不滿十萬三人和帝永元十二年三月壬子賜博士貟弟子在大學者布人三匹安帝延光三年三月戊戌祀孔子及七十二子於闕里壬戌車駕還京師幸太學順帝永建六年九月辛巳繕起大學陽嘉元年秋七月丙辰以大學新成試明經下第者補弟子增甲乙科貟各十人後漢世嵗課甲科四十人為郎中乙科二十人為太子舍人丙科四十人補文學掌故云次成帝時博士選三科髙為尚書為刺史次為諸侯太傅質帝本初元年四月庚辰郡國舉明經大將至六百石皆遣子受業嵗滿課以髙第五人補郎中次五人太子舍人獻帝初平四年十月太學行禮車駕幸永福城門臨觀其儀賜博士以下有差百官志五官中郎將其府對太學傳李通建武二年封固始侯拜大司農帝征討四方令通居守京師修宫室起學宫朱浮建武七年以國學既興宜廣博士之選上書曰先建太學造立橫舍車駕親臨觀饗舊事䇿試博士必廣求詳選惟賢是登桓榮建武十九年拜為博士車駕幸太學會諸博士論難於前榮被服儒衣辨明經義有藴籍特加賞賜又召諸生雅歌擊磬盡日乃罷樊準上疏曰光武受命中興投戈講藝息馬論道孝明垂情古典遊意經藝每享射禮畢正坐自講諸儒並聽四方欣欣多召名儒以充禮官其餘以經術見優者布在廊廟朝多皤皤之良華首之老每燕會則論難衎衎共求政化詳覽羣言響如振玉期門羽林介胄之士悉通孝經博士議郎一人開門徒衆百數化自聖躬流及蠻荒胸奴遣伊秩訾王大車且渠來入就學翟酺順帝即位為將作大匠上言孝文始置五經博士建元五年始置五經博士文帝未遑庠序不知何所據然孟子序曰文帝廣遊學之路論語孝經孟子爾雅皆置博士後罷傳記博士獨立五經而已武帝大合天下之書孝宣論六經於石渠學者滋盛光武中興起太學博士舍內外講堂諸生橫卷為海內所集明帝時辟雍始成欲毁太學太尉趙熹以為大學辟雍皆宜兼存故並傳至今而頃頽廢至為園採芻牧之處宜更修繕誘進後學帝從之乃以永建六年九月繕起太學更拓房室學者為酺立碑銘於學云郎顗修復太學左雄上言宜崇經術繕修太學帝從之儒林傳昔王莽更始之際天下喪亂禮樂分崩典文殘落及光武中興愛好經術未及下車而先訪儒雅採求缺文補綴漏逸先是四方學士多懷挾圗書遁逃林藪自是莫不抱負墳䇿雲會京師髙獲傳少遊學京師與光武有舊師嚴光與光武同遊學崔琦張皓遊學京孔竒何顒遊學洛陽范升陳元鄭興杜林衛宏劉昆桓榮之徒繼踵而集於是立五經博士各以家法教授易有施孟梁丘京氏尚書歐陽大小夏侯詩齊魯韓氏禮大小戴春秋嚴彭祖顔安樂凡十四博士太常差次總領焉建武五年乃修起太學稽式古典籩豆干戚之容備之於列服方領習矩步者委蛇乎其中中元元年初建三雍明帝即位親行其禮天子始冠通天衣日月備法物之駕盛清道之儀坐明堂而朝羣后登靈臺以望雲物袒割辟雍之上尊養三老五更享射禮畢帝正坐自講諸儒執經問難於前冠帶縉紳之人圜橋門而觀聽者蓋億萬計其後復為功臣子孫四姓末屬别立校舍搜選髙能以授其業自期門羽林之士悉令通孝經章句胸奴亦選子入學濟濟乎洋洋乎盛於永平矣章帝建初四年大會諸儒於白虎觀考詳同異連月乃罷肅宗親臨稱制如石渠故事顧命史臣著為通義又詔髙才生受古文尚書毛詩穀梁左氏春秋雖不立學官然皆擢髙第為講郎給事近署以網羅遺逸博存衆家和帝亦數幸東觀覽閲書林及鄧后稱制學者頗懈時樊準徐防並陳勸學之宜又言儒職多非其人於是詔公卿妙簡其選三舍郎能通經術者皆得察舉自安帝覽政薄於藝文博士倚席不講朋徒相視怠散學舍頽弊鞠為園蔬牧兒蕘豎至於薪刈其下順帝感翟酺之言乃更修黌宇凡所造二百四十房千八百五十室試明經下第補弟子增甲乙之科員各千人除郡國耆儒九十人皆補郎舍人本初元年質帝梁太后詔曰紀四月庚辰大將軍下至六百石悉遣子就學每嵗輒於鄉射月一享會之以此為常自是遊學增盛至三萬餘生然章句漸疏而多以浮華相尚儒者之風衰矣黨人既誅其髙名美士多坐流廢後遂忿爭更相告言亦有私行金貨定蘭臺漆書經字以合其私文熹平四年靈帝乃召諸儒正定五經刋於石碑為古文隸篆三體書法以相參檢立之學門古文謂孔氏壁中秦始皇使程邈所作也隸書亦程邈所獻謝承書曰碑立大學門外瓦屋覆之四面欄障開門於南郡設吏卒視之楊龍驤洛陽記朱超石與兄書云石經文都似碑髙一丈許廣四尺駢羅相錯使天下咸取則焉初光武遷洛陽其經牒祕書載之二千餘兩自此以後參倍於前董卓移都之際吏民擾亂自辟雍東觀蘭臺石室宣明鴻都所藏典䇿文章競共剖散其縑帛圗書大則連為帷蓋小乃制為縢囊及王允所收而西者裁七十餘乘道路艱逺復棄其半矣後長安之亂一時焚蕩莫不泯盡焉後百官志太常有博士祭酒一人六百石本僕射中興轉為祭酒博士十四人比六百石本注曰易四施孟梁丘京氏尚書三歐陽大小夏侯詩三魯齊韓氏禮二大小戴氏春秋二公羊嚴顔氏掌教弟子魯恭建武初與丕俱居太學太學生強華奉赤伏符王允受業太學師班彪賈逵自兒童在太學張衡入京師觀太學張武之太學受業陳實受業太學李育博覽書傳知名太學崔駰少遊太學與班固傅毅齊名章紀儒館獻歌謂駰也李固入太學謝承書曰固每到太學密入公府定省父母服虔入太學受業郭林宗賈偉節為太學諸生三萬餘人之冠魏朗詣太學受經岑晊苑康詣太學受業仇覽入太學時諸生符融有髙名覽曰天子修設太學豈使人遊談其中髙揖而去劉陶遊太學申屠蟠居太學任安少遊太學宋登持節臨太學奏定典律張訓少遊太學孔僖遊太學習春秋鄭玄遊太學井丹少受業太學范式梁鴻受業太學杜根入太學號奇童李尤太學銘曰漢遵禮典崇興六藝修周之理掃秦之弊開延學者勸以爵位太學講堂又見養老太禮儀志老更齋于學講堂漢辟雍三雍宫詳見明堂唐辟雍制度璧水見時令禮志成帝時犍為郡於水濵得古磬十六枚劉向説上宜興辟雍設庠序以風化天下成帝下公卿議會向卒丞相大司空奏請立辟雍按行長安城南營表未作及王莽為宰衡遂興辟雍元始四年二月奏立平紀元始五年詔曰劉歆等四人使治明堂辟雍令漢與文王靈臺周公作洛同符歆書曰若立辟雍之儀莫知其原黃圖漢辟雍在長安西北七里河間獻王對三雍宫即此藝文志儒家河間獻王對上下三雍宫三篇傳云獻王來朝獻雅樂對三雍宫及詔䇿所問三十餘事兒寬傳祖立明堂辟雍武帝何武傳成帝欲修辟雍通三公宫蕭由傳元始中作明堂辟雍大朝諸侯水經注渭水東徑明堂南舊引水為辟雍處在鼎路門東南七里上圓下方九宫十二室四嚮五色堂北三百步有靈臺平帝元始四年立唐書歸崇敬曰漢武立明堂辟雍靈臺號三雍宫唐會要永徽二年七月二日詔議立明堂令詳定辟雍制度三年六月二十八日有司奏辟雍案大戴禮無水廣內徑之數蔡雍云水廣二十四丈四周於外三輔黃圗云水廣四周與雍不異仍云水外周隄東京賦造舟為梁禮記明堂隂陽録水左旋以象天今請減為二十四步造舟為梁其外周以圓隄并取隂陽水行左旋之制後以制度未定而止後漢辟雍河間古辟雍記禮殿見養老光武中元元年初起辟雍注漢官儀辟雍去明堂三百步車駕臨辟雍從北門入三月九月皆於中行鄉射禮禮儀志注雅頌樂辟雍饗射所用儒林傳序中元元年初建三雍明帝親行其禮袒割辟雍之上尊養三老五更永平二年冬十月壬子幸辟雍初行養老禮詔曰光武建三朝之禮饗射禮畢帝正坐自講諸儒執經問難於前冠帶搢紳之人圜橋門而觀聽者蓋億萬計永平十四年冬上於辟雍自講五行章句列傳張純時南單于降邉境無事嵗仍有年家給人足純以聖王之建辟雍所以崇禮義既富而教者也乃按七經讖明堂圗河間古辟雍記孝武泰山明堂制度及平帝時議欲具奏之未及上會博士桓榮言宜立辟雍章下三公太常而純議同榮帝乃許之桓榮永平二年三雍初成拜榮為五更每大射養老禮畢帝輒引榮及弟子升堂執經禮儀志養老儀乘輿先到辟雍禮殿御坐東廂中山王焉永平二年冬諸王來會辟雍事畢歸蕃任延為潁川守永平二年召會辟雍承宫永平中臨辟雍召拜博士伏恭永平四年帝臨辟雍於行禮中拜為司空儒者以為榮建初二年冬肅宗行饗禮以恭為三老前禮志世祖即位三十年乃營立明堂辟雍顯宗躬行其禮養三老五更於辟雍威儀既美矣然德化未流洽者庠序尚未設也順紀陽嘉二年冬十月庚午行禮辟雍奏應鍾始復黃鍾靈紀熹平六年冬十月臨辟雍蔡雍封事言養老辟雍廢缺不行帝乃行禮楊賜傳靈帝行辟雍禮引賜為三老東都賦覲明堂臨辟雍辟雍詩乃流辟雍辟雍湯湯聖皇蒞止造舟為梁東京賦春日載陽合射辟雍左制辟雍薛綜注德陽殿東有辟雍李尤辟雍賦興雲動雷飛屑風雨萬騎躨跜以攫拿又銘曰方中圓外清流四匝文選注引李尤辟雍賦臨辟雍明帝永平二年三月大射十月壬子養老八年十月丙子養老十四年冬自講五行章句和帝永元十四年三月戊辰饗射順帝陽嘉元年三月庚寅饗射二年十月庚午靈帝熹平六年十月並臨辟雍漢郡國學校郡文學官文翁學堂經師文翁傳循吏通春秋景帝末為蜀郡守選郡縣小吏開敏有材者張叔等十餘人遣詣京師受業博士或學律令數嵗蜀生皆成就又修起學官於成都市中學之官舍招下縣子弟為學官弟子為除更繇髙苐以補郡縣吏次為孝弟力田常選學官僮子在便坐受事每出行縣從諸生明經飭行者與俱吏民榮之爭欲為學官弟子蜀地學於京師者比齊魯至武帝時乃令天下郡國皆立學校官自文翁為之始至今巴蜀好文雅文翁之化也注師古曰文翁學堂于今猶在益州城內益州記學堂在城南後太守髙朕修復繕立圗聖賢古人像及禮器瑞物東唐志益州文翁學堂圗一卷秦宓曰文翁遣相如受七經還教吏民地理志景武間文翁教民讀書法令及司馬相如以文辭顯鄉黨慕其迹後有王褒嚴遵揚雄之徒文章冠天下繇文翁倡其教相如為之師列傳董仲舒對策云云後興學校之官自仲舒發之韓延夀守潁川教以禮讓令文學校官諸生皮辨執爼豆徙為東郡延夀為吏上禮義好古教化所至必聘賢士表孝弟有行修治學官春秋鄉射陳鍾鼓管絃盛升降揖讓注師古曰學官謂庠序之舍也何武為揚州刺史行部必先即學官見諸生試其誦論問以得失注學官學舍也王尊師事郡文學官注師古曰郡有文學官而尊事之以為師也雋不疑勃海人張禹梅福蓋寬饒為郡文學諸葛豐明經為郡文學匡衡調補平原文學鄭崇為郡文學史平紀元始三年夏立學官郡國曰學縣道邑侯國曰校校學置經師一人鄉曰庠聚曰序序庠置孝經師一人後傳冦恂建武三年為汝南太守恂素好學乃修鄉校教生徒聘能為左氏春秋者親受學焉李忠建武六年為丹陽守起學校習禮容春秋鄉飲選用明經郡中向慕衛颯為桂陽守修庠序之教循吏任延為武威守造立校官循吏秦彭建初元年遷山陽守修庠序春秋饗射修升降揖遜之儀伏恭遷常山太守修學校北州多為伏氏學儒林劉寬遷平陽守每行縣輒引學官祭酒及處士諸生執經對講鮑昱傳子德為南陽太守時郡學久廢德乃修起橫舍備爼豆黻冕行禮奏樂又尊饗國老燕會諸儒宋均為辰陽長立學校楊仁肅宗時為什邡令掾史弟子悉令就學通經者顯之右職或貢之朝劉梁除北新城長大作講舍延聚生徒數百人身執經卷試䇿殿最文苑孔融為北海相立學校表顯儒術崔瑗著南陽文學官志楊倫為郡文學掾楊厚郡文學椽史春秋饗射常祠之黃昌會稽餘姚人居近學宫見諸生修庠序之禮因好之酷吏祭祀志注建武二年立髙廟古今注曰于雒陽校宫立之禮儀志永平二年三月郡縣行鄉飲于學校祀聖師周孔東都賦學校如林庠序盈門文翁學生題名碑有文學祭酒典學從事司儀主事左生右生述征記曰大學在國子學東二百步學堂有大學讃碑記曰建武二十七年立太學堂永建六年制下府繕治并立諸生房舍千餘間陽嘉元年畢刋于碑有太尉龎參司徒劉﨑太常孔扶將作大監胡廣答制記禮記疏漢時受學有摳衣前請之法元朔五年始詔天下郡國建立學官而永平之際皆尊奉孔子蜀丞相亮領益州牧命譙周為勸學從事蔣琬領刺史從典學從事魏樂詳為河東文學祭酒教後進管輅為清河文學堟漢四姓小侯學五經師名牒明紀永平九年為四姓小侯開立學校置五經師注袁宏漢紀曰永平中崇尚儒學自皇太子諸王侯及功臣子弟莫不授經又為外戚樊氏郭氏隂氏馬氏諸子弟立學號四姓小侯以非列侯故曰小侯禮記曰庶方小侯亦其義也張酺傳永平九年顯宗為四姓小侯開學於南宫置五經師酺以尚書教授數講於御前以論難當意除為郎賜車馬衣裳儒林傳顯宗復為功臣子孫四姓末屬别立學舍搜選髙能以授其業自期門羽林之士悉令通孝經章句胸奴亦遣子入學鄧后紀元初六年安帝和熹鄧太后詔和帝弟濟北河間王子男女五嵗以上四十餘人又鄧氏近親子孫三十餘人並開邸第教經書詔曰永平中四姓小侯皆令入學所以矯俗勵薄反之忠厚質帝紀本初元年四月庚辰詔四姓小侯先能通經者各令隨家法儒生為詩者謂之詩家為禮者謂之禮家其髙第者上名牒當以次賞進傳劉昆建武二十二年入授太子及諸王小侯五十餘人儒林秦彭永平七年以貴人兄隨四姓小侯擢為開陽城門侯循吏東海王強薨詔京師親戚四姓小侯皆會又東平王蒼傳同鄧禹少子鴻好籌䇿永平中以為小侯引入議邊事鄧衍永平初以外戚小侯每豫朝會而容姿趨步有出於衆顯宗目之賜輿馬衣服馬防子巨為常從小侯拜為黃門侍郎肅宗親御章臺下殿陳鼎爼自臨冠之吕強上疏曰外戚四姓貴幸之家造起館舍丹青雕飾宦者桓帝紀建和二年加元服賜四姓小侯帛禮儀志有四姓會陵之儀竇長君少君傳絳灌等曰兩人不可不為擇師傅乃選長者有節行者與居由此為退遜君子不敢以富貴驕人文帝鮑宣言外親幼童未通經術者宜令休就師傅漢鴻都門學靈紀光和元年二月己未始置鴻都門學畫孔子及七十二弟子像注鴻都門名也其諸生皆敕州郡三公舉召能為尺牘詞賦及工鳥篆者相課試至千人焉蔡雍傳光和四年云云陽球傳奏罷鴻都門文學不省奏內有云筆不點牘辭不辨心假手請字妖偽百品漢國子堂大學講堂石經魏典論碑漢大學贊頌大學弟子贊香辟雍行禮碑水經注榖水又東徑國子太學石經北漢魏以來置太學於國子堂東漢靈帝光和六年刻石鏤碑載五經立於太學講堂前悉在東側蔡雍以熹平四年與五官中郎將堂溪典光祿大夫磾議郎張訓韓説太史令單揚等奏求正定六經文字許之雍乃自書丹於碑使工鐫刻立於大學門外後儒晚學咸取正焉今碑上悉銘刻雍等名魏正始中又立古篆隸三字石經魏初傳古文出邯鄲淳石經古文轉失淳法植之於堂西石長八尺廣四尺刻石於其下碑石四十八枚廣三十丈魏文帝又刋典論六碑附于其次陸機言太學贊别一碑在講堂西下列石龜碑載蔡雍韓説髙堂溪等名太學弟子贊復一碑在外門中今二碑並無石經東有一碑是漢順帝陽嘉八年立碑文云建武二十七年造大學年積毁壞永建六年詔書修大學刻石紀年用作工徒十二萬二千人陽嘉元年八月作畢碑南面刻頌漢石經北有晉辟雍行禮碑是太始二年立魏太學辟雍泮宫魏志文帝黃初五年四月立太學於洛陽二年正月壬午詔以議郎孔羡為宗聖侯邑百户令魯郡修起舊廟於其外廣為室屋以居學者制五經課試之法置春秋榖梁博士正始二年二月初通論語使太常以太牢祭孔子於辟雍以顔淵配五年五月癸巳講尚書經通七年十二月禮記通亦如之甘露元年四月丙辰幸太學問諸儒易書禮記二年五月辛未幸辟雍會命羣臣賦詩傳髙柔上疏文帝興立辟雍州立課試曹植有學宫頌劉馥正始中上疏曰黃初以來崇立太學二十餘年成者蓋寡由博士選輕諸生避役髙門子弟恥非其倫學者有名而無實設教而無功王昶嘉平初陳治略五事其一欲崇道篤學抑絶浮華使國子入太學而修庠序宋志建安二十二年魏國作泮宫于鄴城南武帝建安八年七月令曰令郡國各修文學縣滿五百户置校官選鄉之俊造而教學之太和二年六月詔曰尊儒貴學王教之本也其髙選博士才任侍中常侍者申敕郡國貢士以經學為先玉海卷一百十一
