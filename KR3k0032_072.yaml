  - {type: page-break, offset: 12, content: '', id: KR3k0032_WYG_072-1a, image: WYG0945/WYG0945-0079a.png}
body:
  text: 玉海卷七十二宋王應麟撰禮儀冊禮說文冊符命也象其札一長一短中有二編之形周䇿命見前周語襄王使大宰文公及内史興賜晉文公上卿逆于境晉侯郊勞館諸宗廟饋九牢設庭燎及期命于武宫晉侯端委以入大宰以王命命冕服内史賛之三命而後即冕服既畢賔饗贈餞如公命侯伯之禮加以宴好洛誥王命周公後作冊逸誥畢命序康王命作冊畢漢拜皇太子儀章徳殿䇿皇后儀續志拜皇太子儀百官㑹位定謁者引皇太子當御坐殿下北面司空當太子西北東面立讀䇿書畢中常侍持太子璽綬太子再拜三稽首謁者賛曰皇太子臣某謁者稱制曰可三公升階上殿賀夀萬嵗因大赦天下禮畢注蔡質所記立宋皇后儀太傅太尉司徒司空太常條列禮儀皇后初即位章徳殿太尉使持莭奉璽綬天子臨軒百官陪位皇后北面太尉立階下東向宗正大長秋西向宗正讀䇿太尉授璽綬中常侍長樂太僕受璽奏於殿前女史授婕妤婕妤授昭儀昭儀以帶皇后皇后拜訖黄門鼓吹三通鳴鼓畢羣臣以次出后即位大赦天下皇后秩比國王即位威儀赤紱玉璽前傳杜欽云宜因始初之隆建九女之制太后以為故事無有通典魏制天子冊后以皮馬庭實加榖珪晉成帝咸康二年臨軒拜皇后帝御太極殿羣臣畢賀漢皇太子納妃唐冊妃通典漢制皇太子納妃奉常迎時叔孫通定禮以天子無親迎之義皇太子以奉常迎晉太康中有司奏太子納徴用玄纁束帛加璧羊馬二駟東晉用玉璧一獸皮二宋元嘉十五年四月納妃百官上禮壬戌於太極殿西堂叙宴太始五年納徴加珪璋各一豹熊羆皮各二北齊妃朝皇帝於昭陽殿朝皇后於宣光殿隋禮命有司以特牲告廟冊妃鷄鳴夙興以朝奠笲於帝后唐禮志皇太子納妃其冊妃前一日主人設使者次云云使副朝服乗輅持莭鼓吹備而不作至妃氏大門外次掌嚴奉褕翟衣及首飾内廐尉進厭翟於大門之外諸衛帥其屬布儀仗云云奉冊寳桉者進授使副冊寶内侍西面受之東面授典内典内持入跪置於閤外之桉傅姆賛妃出立於庭中北面掌書跪取玉寶南向司則前賛妃再拜北面授冊寶於掌書南向授妃妃以授司閨司則又賛再拜臨軒醮戒前一日有司設御坐於太極殿阼階上西向皇太子進當御坐前東面立皇帝命之晉起居注元帝太興元年上臨軒使冊命皇太子妃初學記唐太宗冊太子妃文云作合春宫寔協三善晉冊拜太子晉帝紀元帝太興元年三月庚午立王太子紹為皇太子冊文曰於戯朕承天序忝繼祖宗之洪基君臨于萬邦戰戰兢兢若渉淵水未有攸濟自古聖王敷宅四海莫不建立元子本枝百世今稽古授爾于儲宫以陪貳于朕躬欽哉爾其克念乃祖日新厥徳何逺非佞何親非賢欽翼師傅以丕崇大化可不慎歟爾其敬之孝武太元十二年庾弘之議按武帝咸寧中諸王新拜有司奏聽近臣諸王公主上禮今皇太子國之儲副既已崇建普天同慶謂應上禮奉賀徐廣東宫頌禮樂承軒典冊授庭命服惟九龍旂鸞旌優䇿南史禇淵傳為錄尚書事有司疑立優䇿尚書令王儉議中朝以來三公王侯則優䇿並設官品第二䇿而不優優者褒美䇿者兼明委寄尚書職居天官政化之本故尚書令品雖第三拜必有䇿錄尚書事與本官同拜故不别有䇿即事緣情不宜均之凡庶宜有䇿書用申隆寄既異王侯不假優文從之晉石鑒傳三公冊拜皆設小㑹所以崇宰輔之制唐臨軒冊皇后志皇帝納皇后命太尉為使宗正卿為副前一日有司展懸設桉陳車輿於太極殿廷如元日皇帝衮冕出自西房即御坐侍中宣制曰納某氏女為皇后命公等持節行納采等禮云云武徳九年八月二十一日立長孫后冊后前一日守宫設使者次於后氏大門外之西尚舍設尚宫以下次於后氏閤外其日臨軒命使如納采奉禮設使者位於大門外之西東向使副及内侍位於使者之南舉冊桉及寶綬者在南持節者在使者之北使副乗輅持節備儀仗鼓吹備而不作内僕進重翟以下於大門之外諸衛令其屬布后儀仗使者曰某奉制授皇后備物典冊主人出迎於大門外使者入門而左持節者前導奉冊寶桉者進授使副内使受之内謁者監持入跪置於桉尚宫曰有制后再拜宣冊又再拜尚宫授后以冊受以授司言尚服又授以寶綬受以授司寶禮畢宋朝李清臣作皇后冊文曰賜爾皇后之寶方寸有半文盝螭紐授之玉冊厥簡五十命爾翟衣笄纚博鬢黼領大帶以朝暨嵗時將祀于東西宫金輿朱葢武賁呵衛步障行導是惟顯哉唐臨軒冊三公㑹要貞觀八年敕拜三師三公尚書令雍州牧開府儀同三司驃騎大將軍左右僕射並臨軒冊授太子三少侍中中書令六尚書諸衛大將軍特進鎮國大將軍光祿大夫太子詹事九卿都督及上州刺史在京者朝堂受冊光宅二年並停大厯十四年五月臨軒冊尚父子儀於宣政殿自神龍以來冊禮久廢唯天寶末冊楊國忠為司空至是復行貞元三年四月李晟拜太尉中書令帝坐宣政殿引見備冊禮受冊訖備羽儀乗輅謁太廟視事尚書省賜良馬錦綵千計故事臨軒冊拜三公中書令讀冊侍中奏禮畢宰相攝之時宰相張延賞欲輕其禮令兵部尚書攝中書令左散騎常侍攝侍中臨軒冊命宰臣不親行事自此始舊紀長慶二年三月景辰守司徒裴度正衙受冊太和四年裴度進司徒表辭冊禮晉成帝臨軒遣使拜太傅太尉司空㑹將作樂宿懸於殿庭門下奏非祭祀燕饗則無設樂之制事下太常蔡謨議臨軒遣使宜有金石之樂遂從之臨軒作樂自此始宋朝親王大臣例辭冊禮唐冊皇太子實錄貞觀十七年四月冊文云永言少陽匕鬯是寄疇咨朝列卿士叶從永徽七年正月辛未冊文云盡謙恭於齒胄審方俗於迎郊春禮冬詩趍庭靡懈三善六徳勉志無愆唐隆元年七月己巳冊文云爾有文武仁孝之徳以知君臣父子之道開元三年正月丁亥冊文云正位少陽欽惟大典二十六年七月己巳冊文云仰稽天道俯察人心立長則順天所助也議才則賢人之望也乾元元年十月甲辰冊文云禮經著元良之徳易象載重明之義貞元二十一年四月乙巳冊文云付爾以承祧之重勵爾以主鬯之勤以正萬國之心以揚三善之徳元和七年十月壬寅冊文云教深藴瑟氣叶吹銅溫文得於天縱孝友因於自然通典開元禮有臨軒冊命内冊皇太子儀唐冊命諸王通典臨軒冊命諸王大臣設御幄於太極殿北壁羣官次於朝堂太樂令展宫懸於殿庭諸衛列仗受冊者服朝服從第備鹵簿集朝堂次皇帝即御座受冊者東北西面中書侍郎引冊桉中書令稱有制受冊者再拜中書令讀訖受冊者進受持桉者以桉退冊三師三公親王皇帝服衮冕之服鼓吹令設十二桉乗黄令陳車輅尚輦陳輿輦諸衛設黄麾半仗受冊者初入門舒和之樂作開元禮後漢制拜諸王侯三公之儀百官㑹位定謁者引光祿勲前謁者引當拜者前當座伏殿下光祿勲前一拜舉手曰制詔其以某為某讀䇿書畢再拜晉咸寧三年議國卿君之貳也命使之日御親臨軒百寮陪位北齊䇿諸王臨軒尚書讀䇿授王冊軸一枚長二尺以白練衣之用竹簡十二枚六枚與軸等六枚長尺二寸文出集書書皆篆字隋冊開國郊社令奉茅土立於仗南西面每授冊訖授茅土焉初學記載太宗冊漢王荆王文祭統曰古者明君爵有徳而祿有功必賜爵祿於太廟示不敢專也故祭之日一獻君降立阼階之南南鄉所命北面史由君右執䇿命之再拜稽首受書以歸而舍奠于其廟疏若天子命羣臣則不因常祭之日特假於廟大宗伯云王命諸侯則儐注云王將出命假祖廟立依前南鄉春秋疏天子賜諸侯之命書傳無正禮唯文元年天王使毛伯來錫公命僖十一年傳王賜晉恵公命周語王賜晉文公命皆是即位而賜之又賜之以圭擬朝而合瑞諸侯即位禮必朝王即賜之命春秋之時賜命禮廢唯文公即位而賜成公八年乃賜桓公追賜唐含元殿奉冊見殿類唐宣政殿冊太子太極殿臨軒冊皇太子開元受冊儀注㑹要長慶二年十二月丙午御紫宸殿冊皇太子癸巳立景王湛為皇太子故事冊太子御宣政殿是日備宫懸於殿庭列内仗於兩閤門内羣臣辨色序立於宣政門外就外廊食訖具衣冠劒履入自月華門列位正衙辰後一刻入閤上臨軒太子歩自崇明門以宫寮翼從駙馬二人扶衣冠禮儀使導以進及樂作扇開羣臣拜訖太子進至龍墀東南再拜受冊攝中書令杜元頴讀冊以授太子太子再拜蹈舞歸崇明門幕殿羣臣賀皇帝訖退詣崇明門謁太子太子命舉簾執笏荅拜宫寮拜則受之通鑑開元二十六年七月己巳上御宣政殿冊皇太子㑹百官故事乗輅至殿門至是歩入是日大赦天下賜酺三日元和四年冬十月御宣政殿冊太子先是三年李絳上言七紀四年閏三月丁卯立鄧王寧七年月乙丑立遂王宥為太子十月壬寅宣政殿冊太子實錄順宗貞元二十一年四月乙巳一云乙丑御宣政殿冊太子有慶雲見紀三月癸巳立廣陵郡王為皇太子四月戊申以冊皇太子心文武官子為父後者勲兩轉肅宗乾元元年十月甲辰帝御宣政殿冊成王為皇太子大赦天下五月庚寅立太子七月壬午太子於宣政殿謝冊命文宗太和七年八月庚寅御宣政殿冊太子志嘉禮臨軒冊皇太子有司卜日告天地宗廟前一日尚舍設御幄于太極殿有司設太子次于東朝堂之北西向又設版位於大横街之南展懸設桉陳車輿及文武羣官朝集蕃客之次位其日前二刻宫官服其器服諸衞率各勒所部陳于庭左庶子奏請中嚴侍衞之官奉迎僕進金路内率一人執刀賛善奏發引令侍臣上馬庶子承令其餘畧如皇帝出宫之禮皇太子逺游冠絳紗袍三師導三少從鳴鐃而行降路入次亦如鸞駕其日列黄麾大仗侍中奏請中嚴有司與羣官皆入就位三師三少導從皇太子立於殿門外之東西向黄門侍郎以冊寶綬桉立於殿内道北西面中書侍郎立桉後侍中乃奏外辦皇帝服衮冕出自西房即御坐皇太子入就位典儀曰再拜皇太子再拜又曰再拜在位者皆再拜中書令降立於皇太子東北西向中書侍郎一人引冊一人引寶綬桉立於東西面以冊授之中書令曰有制皇太子再拜中書令跪讀冊皇太子再拜受冊左庶子受之侍郎以璽綬授中書令皇太子進受以授左庶子皇太子再拜在位皆再拜侍中奏禮畢皇帝入自東房通典開元二十六年六月庚子肅宗為太子將受冊紀云立忠王璵為皇太子太常所撰儀注有服絳紗袍之文上手敕改為朱明服紀有司行冊禮其儀有中嚴外辦其服絳紗太子曰此天子禮也下公卿議太師蕭嵩左相裴耀卿請改外辦為外備絳紗衣為朱明服從之唐光順門冊禮㑹要代宗女嘉豐普寧公主同降有司具冊禮光順門貞元元年嘉誠出降徳宗幸望春亭臨餞厭翟敝不可乗以金根代之乗金根車自主始四年二月七日太常卿董晉奏八日正衙冊新都長公主開元禮皇帝御正衙命使行冊禮陳樂懸貞元元年五月冊嘉誠二年三月冊長林帝不御正殿不設樂遂為故事新都以十日下降宜前一日於光順門行五禮敕其日於光順門即行冊禮傳新都貞元十二年下嫁具禮光順門五禮由是廢十五年七月二日有司奏冊公主儀注開元之儀侍中宣制中書令受冊以冊授冊使冊案自東上閤門出詣横街北宣付中書門下制可二十一年四月七日禮儀使奏舊制正衙命使使出含元殿西廊側門外登輅車從光範門入詣光順門進冊今請冊使出宣政門自興禮門出赴延英光順門進冊通典開元禮冊公主設御幄於太極殿展宫懸鈒㦸近仗入陳於殿庭冊使等初入門舒和之樂作設使者及冊案便次於光範門及長樂門外公主花釵翟衣司言引就受冊位尚儀執冊跪讀公主受冊以授司言後漢魏譚永平中為主家令公主家令平陽㕘佐命襄城循矩法臨川屬文上孝徳頌漢陽戒侈廣徳治家有禮法岐陽事舅姑以禮聞岐陽下嫁杜悰帝為御正殿臨遣繇西朝堂出復御延喜門止主車大賜賓從金錢開第昌化里疏龍首池為沼后家上尚父大通里亭為主别館㑹要元和九年八月云云神䇿兵三百於光範門翼道京兆尹裴武為禮㑹使乾徳崇元殿受冊見殿類乾徳元年癸亥十一月甲子合祭天地于南郊還御明徳門大赦改元羣臣奉冊上尊號於崇元殿丙寅唐主遣使助祭及賀冊號開寳元年戊辰十一月癸卯郊祀御乾元殿受尊號冊國朝之制百官三表或五表請上尊號命大臣撰冊文及書冊寶其冊中書省造用珉玉簡其寳門下省造用玉受冊多用祀禮畢日御正殿行禮唐開元年十一月戊子羣臣上尊號曰開元神武皇帝二十七年二月己巳上尊號曰開元聖文神武至道朝元殿皇太子冊禮至道元年乙未八月壬辰十八日以開封尹夀王為皇太子自唐天祐以來斯禮久廢上始舉行中外胥悅丁酉以學士承㫖宋白為冊皇太子禮儀使有司既定冊禮又請如唐開元制宫臣止稱臣不行舞蹈之禮又言百官見太子自兩省五品尚書省御史臺四品諸司三品以上皆荅拜餘悉受拜宫臣自左右庶子以下悉用參見之儀其皇太子宴㑹位在王公上奏可有司又草具皇太子受冊畢見皇后儀詔止用宫中常禮九月丁卯二十四日上御朝元殿即崇元殿也後改曰天安又改大慶冊皇太子陳列如元㑹之儀設黄麾大仗及宫縣樂于庭皇太子常服乗馬赴朝元門外幄次改服逺游冠朱明衣三師三少導從入殿受冊寶太尉率百官奉賀太子易服乗馬還宫百官常服詣宫參賀自樞宻使内職諸王宗室師保賔客宫臣等畢集太子常服就坐諸王宗室等以次參賀皆荅拜訖受文武官宫臣三品以下參賀庚午具鹵簿謁太廟五室常服乗馬出東華門升輅十月乙亥太子遜宫寮稱臣許之㑹要八月二十三日門下省言按開元禮冊皇太子寶以黄金為之方一寸又隋志皇太子寶龜紐文曰皇太子寶朱組大綬請如舊制製造從之九月二十二日乙丑有司言太子受冊奏正安之曲詔宋白撰樂章二曲天禧天安殿冊皇太子天禧二年戊午嵗八月丁酉至辛丑羣臣三表請立太子甲辰詔立昇王為皇太子乙巳以學士晁逈為禮儀使丁巳禮官請臨軒冊命日奏明安之曲從之九月丁卯上御天安殿冊太子禮畢百官稱賀畢上有五色雲紫雲如華盖癸酉皇太子朝謁太廟日左右有赤黄珥黄雲捧日其儀帝服衮冕御天安殿禮儀使引太子就版位再拜中書令升殿承㫖降階北面讀冊中書令奉冊授皇太子太子以授右庶子又奉寶綬太子受訖以授左庶子太子出入皆作明安之樂晁逈撰明安三曲百官詣宫參賀再拜太子答拜丙申賔客李迪上賀建儲闈禮成詩詔褒之冊北寶南用三師為前導三少為後從政和五年二月十四日大慶殿行冊禮治平三年十二月壬寅元豐八年三月甲午朔紹興三十二年五月甲子建儲皆不及受冊辨夀街之牘本自生知守馳道之規匪由師授再至問安重明麗正竒智夙彰英聲外發勤至寢門樂游講肆資弦誦以崇術儀星海而昭象金昭玉𥙿協華復旦日宣重光天聖崇政殿受冊儀注紹興慈寧殿受冊建隆元年二月乙亥上太后杜氏尊號不果行冊禮天聖二年七月十八日甲辰宰臣欽若請上皇太后尊號許之八月八日學士承㫖李維等上皇太后於崇政殿受冊儀注帝曰内殿受冊豈推奉母儀之意詔甲午於文徳殿上尊號天安殿發冊十一月十三日丁酉郊祀禮成帝御天安殿受冊畢再序班發太后冊寶乗輿赴文徳殿太后服儀天冠衮衣以出奏隆安之樂奉冊寶置御坐前冊曰周有思齊之什播于聲歌漢有長樂之注垂於竹帛皇帝行稱賀之禮百寮畢賀己亥詔曰發寶冊於大庭奉鴻名於慈極明道二年二月乙巳以饗七室禮成復行冊禮治平二年十一月壬申文徳殿發冊寶熙寧二年四月元祐二年九月丙辰崇寧二年五月皆行冊太后之禮紹興十年十一月十二日禮官定奉冊儀注十二月壬午於常御殿發冊授攝太傅於慈寧殿奉上進賀如宫中儀羣臣遙賀上親書冊文奏聖安等八曲冊藏慈寧宫紹定四年元日奉冊寶上太后尊號曰夀明慈睿景祐皇后冊禮舊制后妃皆冩告進入景祐元年九月甲辰立皇后曹氏二十九日命禮院詳定冊皇后儀制乙巳命宰臣李迪為冊禮使參政王隨副之禮院言皇后玉冊如太子制度用珉簡五十寶用金方一寸五分髙一寸文曰皇后之寶盤螭紐服以褘衣六帶玉佩雙綬十一月三日己丑是日冬至行冊禮于文徳殿治平二年十一月壬申祀圓丘大赦還御文徳殿發寳冊上皇太后及冊皇后元祐七年五月十五日日納成納吉告期三使受制書十六日文徳殿發冊政和元年正月詔皇后受冊陳黄麾仗重翟車小駕鹵簿紹興十三年閠四月己丑立貴妃為皇后詔左相押麻十三日太常定受冊儀注列黄麾仗于文徳殿皇帝服通天絳紗臨軒發冊奏乾安之樂皇后禕衣受冊於穆清殿奏坤安之樂乾安正安坤安等十三曲甲辰十七日行冊禮于文徳殿設黄麾半仗千四百九十九用宫架樂百官稱賀次詣内東門賀淳熙三年九月己巳上儀注同隆興元年十一月立皇后不設大輦用黄麾半仗陳逍遙平輦紫方繖十團扇十二朝謁徳夀宫乗龍飾肩輿貴妃冊命始於慶厯八年十二月丁卯冊用竹簡印用金紹定三年十二月十日上御文徳殿冊命皇后熙寧文徳殿奉玉冊熙寧二年四月二十六日文徳殿奉太皇太后玉冊元祐三年三月五日太皇太后手詔受冊止就崇政殿九月乙卯發冊寶于大慶殿太皇太后御崇政殿受冊丙辰冊皇太后太妃嘉祐二年七月丁酉文徳殿冊命兖國公主紹興徳夀宫冊禮慶元上三宫冊寶紹興三十二年孝宗即位六月甲午上尊號八月甲戌有司上光堯夀聖太上皇帝夀聖太上皇后尊號儀注皇帝服通天絳紗禮部侍郎奏中嚴外辦禮儀使請行發冊寶之禮皇帝執大圭舉冊寶授太傅禮部郎中奏解嚴皇帝自祥曦殿朝服履袍乗輦而出至徳夀宫大次鼓吹儀衛分列於宫門舉冊寶官跪舉冊寶興皇帝服通天絳紗出大次執大圭禮儀使請恭行奉上尊號冊寶之禮皇帝執大圭北向再拜進冊寶於御坐稽首稱賀禮畢皇帝入宫奉上太上皇后冊寶戊寅行奉上冊寶禮先是六月丁亥集議尊號於都堂乾道六年十一月二十一日上帥百官請加尊號七年正月丙子朔大慶殿發冊寶禮畢詣徳夀宫上冊寶次上太上皇后冊寶淳熙二年十一月戊申十二年十二月庚戌朔加上尊號慶元二年十月三日皇帝率百僚詣慈福夀慈夀康宮上冊寶稱賀唐永貞二年正月丙寅一作戌朔太上皇於興慶宫受朝賀皇帝率百僚奉上尊號冊文曰云云請因夀歴以播鴻名謹上尊號曰應乾聖夀億載萬年為衆父父乗翠鳯之車鏤白玉之牒明皇至道順宗應乾設黄麾於大庭鏤白玉之新牒臨彤庭發玉版翠華之旗靈鼉之鼓陳於廣宇相我盛舉蚴蟉青龍婉僤象輿其載伊何煌煌金書維昔曠典我龍舉之大哉堯乎南嚮垂裳君哉舜也拜而受觴乾道大慶殿冊皇太子乾道元年八月十日丙戌立鄧王為皇太子禮官言皇帝御大慶殿冊太子服通天冠絳紗袍百官朝服立班太子受冊服逺游冠朱明衣執植圭謁太廟服衮冕乗金輅百官詣太子宫賀並荅拜依㑹要冊用珉玉簡六十枚前後四枚刻龍填金貫以金絲藉以錦褥盛以漆匣装以金華飾以螭首今請用珉簡七十五枚即天禧之制金寶按禮義羅寶以黄金為之係龜紐方一寸係以朱組大綬連玉環金簡三朝志寶方二寸厚五寸壬寅兵部官黄麾半仗用一千四百九十九人甲辰太子奏辭金輅十月十六日御大慶殿冊太子列黄麾半仗撞黄鍾作乾安明安之樂禮成稱賀撞㽔賔之鍾十八日御紫宸殿太子稱謝遂朝謁景靈宫太廟又詣徳夀宫謝七年二月八日癸丑恭王升儲三月二十三日行冊禮于大慶嘉定二年八月十三日御大慶殿冊皇太子寳慶慈明殿上冊寳寶慶三年正月一日上夀明皇太后冊寶紹定元年正月一日上夀明慈睿四年正月一日上夀明仁福慈睿皇太后冊寶太后塗山之徳渭涘之祥圖徽寳冊玉色金相龍衮翼翼玉書煌煌維冊伊何鏤玉垂鴻維寳伊何範金鈕龍翊以􅉏御間以笙鏞金支秀華垂紳佩玦或導或陪率履不越煌煌鳯字玉氣宛延天門崫岉飛驂後先龍簨四合奏鼔鼘鼘母儀天下何千萬年鸞回寳勢虹貫瑤光寳章煌煌導以笙磬后重翟出房禕衣被躬委委佗佗河潤山容祥發俔天符彰夢日明章婦順表正人倫超任邈姒比徳皇英椒塗蘭馭月華儷日坤美承乾天作之合家邦其興朱芾斯皇子孫繩繩景命有僕保右自天永錫祚嗣何千萬年有璽笵金有冊鏤瓊懿範柔容如月斯輝翬衣加追玉之笄螭紐賁範金之寳篆金籀玉之文植羽崇牙之設金螭玉檢班政蘭閨宣禮椒屋人覆玉衣燕銜石字慶洽瑤衣易基乾坤詩首闗雎書美釐降赫赫惟皇如日之光肅肅惟后如月之常禮行一時明照無疆臣工在廷劒珮瑲瑲來汝疑丞明命是將刻簡以珉鑄寳以金持節伊誰時維四鄰自我文徳達之穆清禮備樂成合扇鳴鞭備物典䇿樂之鼓鍾拜而受之極其肅雍司言司寶各以職從行地有慶與天無窮羽衛外列揚顔中映六宫承式二南流詠内治允修陰教肅兮宜君宜王綏百福兮嗣徽媯汭思媚周姜母儀萬㝢訓藹紫房稟祥月輝膺華丹燿登瑞紫穹蘭殿椒塗儷徳坤柔俔華天極俔天炳月嬪光紫霄神祚玉衣天開金屋皇太子琱琘瑳瑳篆金煌煌對揚于庭是承是將山重其暉日重其光觀瞻以懌國有元良淵冲象徳玉𥙿凝姿進退周旋有肅其儀翠華之旗靈鼉之鼔陳於廣宇相我盛舉珉玉玢豳􅒁蹏精良既刻厥文亦鑄之章鸞旌列叙雞㦸分行前星有爛瑞日重光軼誦韜荘道契黄離位隆蒼震日光月輪山輝海潤相見乎離盖取諸震前星涵采洊雷揚聲麗日重光非煙五色龍旗列仗鱗簨充庭班輪飭駕碧鏤題宫幼海澄瀾前星騰耀馳道美漢寝門稱周瑜玉發響畫輪停輈若發居豐猶莊在漢樂正歌風司成頌徳重明疊聖重離炤景濟濟卿士將將鼓鐘儲副豫定器之公兮冊授孔時禮之隆兮體乾作貳命服斯九前星比曜波澄少海景麗前星副極儀天金鏘玉度稟粹重離摛英若木入監出撫日就月將爰以吉日冊于明庭鼔鐘載和文物大備業光啓誦道亞霄極天官揆日稷嗣陳儀負扆當陽薦紳就位鳴球拊石具物有容撰吉展儀兩離相續副君昭象道應黄離銅樓備徳玉𥙿成規啟誦慙徳莊丕掩粹洊雷揚祉重離闡耀公主螭綬龜章玉佩金軒周美王姬之華下正后之一等漢推帝女之寵主同姓之諸公堯有娥英舜有宵燭䄖狄之衣辟邪之玉西京故事主以上公唐室近儀錫之美號君袂備物公圭主儀曳紅綬錫青圭帝妹中行易象賛其元吉王姬下嫁召南美其肅雍魯郊築館沁水疏園京房載湯嫁妹之辭曰旡以天子之尊而乗諸侯旡以天子之富而驕諸侯隂之從陽女之順夫本天地之義也往事爾夫必以禮義荀悅言尚主之制非古釐降二女陶唐之典歸妹元吉帝乙之訓王姬歸齊宗周之禮荀爽曰帝堯之女下嫁於虞猶屈體降下勤修婦道帝乙歸妹言湯以娶禮歸其妹於諸侯也春秋之義王姬嫁齊使魯主之不以天子之尊加於諸侯也今漢承秦法設尚主之儀違乾坤之道失陽唱之義宜改尚主之制以稱乾坤之性唐貞元元年冊云春秋書築館之儀易象著歸妹之吉下嫁諸侯諒惟古制肅雍之徳見美詩人易著于歸詩稱下嫁黼藻四徳笙簧六行漢頌魯國魏錫常山玉海卷七十二
