body:
  text: 玉海卷六十四宋王應麟撰詔令詔策聘禮百名以上書於策不及百名書於方疏曰簡據一片策是衆簡相連鄭作論語序云易詩書禮春秋策尺二寸孝經謙半之論語八寸策者三分居一又謙焉是策之長短鄭注尚書三十字一簡之文服虔注左氏云古文篆書一簡八字是簡之字數説文册符命也諸侯進受於王也象其札一長一短中有二編之形古文曰笧獨斷制者王者之言必為法制也詔猶告也三代無其文秦漢有也秦稱皇帝命為制令為詔殷册書書多士惟殷先人有册有典注殷先世有册書典籍説殷改夏王命之意周六辭春官大祝下大夫二人上士四人作六辭以通上下親疏逺近一曰祠二曰命三曰誥四曰會五曰禱六曰誄注鄭司農云祠當為辭辭令也命為禆諶草創之命誥謂康誥盤庚之誥之屬會謂王官之伯命事於會胥命於蒲主為其命禱如衛太子禱誄如哀公誄孔子此皆有文雅辭令難為者也玄謂祠者交接之辭會謂會同盟誓之辭禱如張老頌禱秋官士師以五戒先後刑罰一曰誓二曰誥三曰禁四曰糾五曰憲見律令大行人協辭命注六辭之命也書之可見者有三曰誥誓命大禹謨禹會羣后誓于師甘誓啓與有扈戰于甘之野作甘誓湯誓王曰格爾衆庶悉聽朕言記殷人作誓禮中冬教大閲群吏聽誓于陳前注甘誓湯誓之屬榖梁傳誥命不及五帝注尚書六誓七誥是其遺文六誓甘泰湯費牧秦七誥湯召大洛康王酒康司馬法有虞氏戒於國中欲民體其命也夏后氏誓於軍中欲民先成其慮也殷誓於軍門之外欲民先意以待事也周將交創而誓之以致民志也毛詩傳曰建邦能命龜田能施命作器能銘使能造命升高能賦師旅能誓山川能説喪紀能誄祭祀能語君子能此九者可謂有德音可以為大夫文中子曰五帝之典三王之誥兩漢之制粲然可見矣曲禮士載言注言謂會同盟要之辭周書剋殷尹逸策曰云云周策命贊書外令册書春官內史凡命諸侯及孤卿大夫則策命之注鄭司農説以春秋傳曰王命內史叔興父策命晉侯為侯伯策謂以簡策書王命其文曰王謂叔父敬服王命以綏四國紏逖王慝晉侯三辭從命受策以出有微子蔡仲之命乃封國䇿命之詞吕大臨考古圖􅌏敦者稱王格于宣榭呼內史策命􅌏及四方之事書內史讀之若今尚書省奏事王制祿則贊為之以方出之贊為之為辭也以方出之以版書而出之賞賜亦如之內史掌書王命遂二之副寫藏之外史掌書外令王令下畿外掌達書名于四方若以書使于四方則書其令書王令以授使者御僕掌王之燕令御史掌贊書王有命當以書致之則贊為辭若今尚書作詔文其史百有二十人以掌贊書人多也天官職內受財者受二令而書之注若今御史所寫下本奏王所可者書之女史書內令后之令書顧命命作册度太史秉書由賔階隮御王册命畢命康王命作册畢洛誥戊辰王在新邑蒸祭嵗王命作册逸祝册惟告周公其後王入太室祼王命周公後作册逸誥在十有二月惟七年注王為册書使史逸誥伯禽封命之書皆同在蒸祭日周公拜前魯公拜後左傳分魯公備物典策命以伯禽亦書名分康叔命以康誥分唐叔命以唐誥其命書云王曰胡僖二十八年王命尹氏及王子虎內史叔興父策命晉侯為侯伯注以策書命晉侯為伯也周禮九命作伯榖梁傳禮有受命無來錫命注周禮大宗伯職曰王命諸侯則儐之詩彤弓受言藏之箋言者謂王策命也王賜朱弓必䇿其功以命之常武王謂尹氏命程伯休父箋王使大夫尹氏策命休父覲禮諸公奉篋服加命書于上禮大宗伯注王將出命假祖廟立依前南鄉儐者進當命者延之命使登內史由王右以策命之降再拜稽首登受策以出此其略也晉語趙簡子欲賞董安于安于曰方臣之少也進秉筆贊為名命稱於前世義於諸侯楚語觀射父能作訓辭以行諸侯申叔時曰教之令使訪物官注先王官法時令周語單子曰先王之令有之曰天道賞善罰淫注文武之教漢詔令總敘漢有制策詔策親策敇有詔敕璽敕密敕書有策書璽書手書權書見胸奴傳赫蹄書詔有制詔親詔密詔特詔優詔中詔清詔手筆下詔遺詔令有下令著令挈令及令甲令乙令丙諭有口諭風諭譙諭宥罪有赦訓諸王有誥召天下兵有羽檄要詰有誓約延拜有贊以至有報有賜有問有誥又有手迹手記詔記其曰恩澤詔書寬大詔書一切詔書及哀痛之詔隨事名之策命簡長二尺短者半之以篆書罷免用尺一木兩行以隸書遺單于書牘以尺一寸選舉召拜亦書之尺一板詔書有真草三王世家又有案案者寫詔之文鄭崇傳持詔書案起制詔皆璽封尚書重封唯赦贖令司徒印露布州郡詔記緑綈方底用御史中丞印通官文書不著姓詔書皂囊施檢報書緑囊密詔或衣帶間丹書藏之石室策書藏之金匱此其制也詔御史大夫下相國相國下諸侯王御史中執法下郡守制下御史御史大夫下丞相丞相下中二千石二千石下郡太守諸侯丞相從事下當用者如律令郡國長史上計丞相御史記室大音讀敕畢遣以詔書部刺史奉詔條察州所察毋過六條夜下詔書決之亟也甲寅書報應之疾也毋下所賜書幾事密也封還詔書渙號不容於輕出也更報單于書辭令不嫌於修飾也六月甲子詔書非赦令也皆蠲除之雖反汗猶愈於遂非也有司毋得言赦前事所以示民信也策書泰深痛切君子作文為賢者諱所貴乎體之識也昧死奏詔書二十三事所重乎祖宗之法也璽書封小詔書獨下抑不可不慮其召疑而賈激也案尚書大行無遺詔詔書獨臧嬰家及安得詔書封三子事尤有國者所當謹察也然有不敢奉詔者有期期不奉詔者有以死爭不奉詔者有詔數強豫然後奉詔者亷問不如吾詔者以重論敢有議詔不如詔者皆要斬誤宣詔者應罰金謂詔書不可用者丞相御史劾之無承用詔書意者御史奏之而奉詔不謹者皆坐以不敬丞相被策書則步出司農發詔書則鳴鼓其嚴如此有詐作詔書詐作詔板偽作璽書假為策自書詔以授中興書目西漢詔令十二卷林虙采括程俱纂成之凡四百一章王曉集兩漢詔議四十卷文中子曰漢之制志詔册幾乎典誥近於三典九誥賈瓊曰兩漢有制志何也子曰制盡美於恤人志慙於備物續書有志有詔志以成道言以宣志詔其見王者之志乎其言也典其志也博其惟策乎漢髙祖孝文傳詔策志儒家高祖傳十三篇高祖與大臣述古語及詔策孝文傳十一篇文帝所稱及詔策高帝詔二年祠山川五年立吳芮長沙王紀高祖詔始於五年二月立畨君芮為長沙王立閩粵王亡諸詔賜民爵善遇高爵立燕王六年赦天下封劉賈等尊太公七年讞獄疑九年隨趙王者族十一年立代王定口賦尊顯賢士大夫立梁燕淮陽王立尉他立淮南王十二年立吳王濞置前代守冢赦燕立燕王南海王詔共誅不義紀又制詔御史長沙王忠定著令吳芮傳立靈星祠郊祀志二年令立漢社稷令諸侯子集櫟陽為衛令祠官祀天地四方上帝四川四年令吏為衣衾轉送軍士五年令更立韓信為楚王八年令吏卒從軍守城者復終身封芮於長沙封亡諸於閩粵綰之於燕他之於南粵織之於南海皆封異姓之詔也齊荆以建王國代吳以封子弟恢王梁友建王淮陽燕皆封同姓之詔也復田賜爵則有詔善遇高爵則有詔歸尊上皇則有詔以至賦獻立程求賢勸駕未習法而犯令則赦之秦楚趙魏亡後則念之燕吏民來歸者爵之賢士諸臣有功者諭告之二年置祝宰有重祠敬祭之詔後四嵗詔御史令豐治枌榆社其後制詔御史令天下立靈星祠相國臣何等議天子所服則受詔長樂長沙王忠其定著令則制詔御史賜太子則有書封功臣則有誓文帝詔即位赦天下賜爵元年封誅吕功臣議犯法相坐元年十二月下議犯法相坐之詔載於刑法志蓋即位後第一詔也立太子振貸養老封宋昌列侯增户邑二年令列侯歸國日食籍田立諸王除誹謗妖言賜半租三年免丞相勃就國赦濟北吏民十二年勸農舉孝弟力田三老亷吏十三年具親耕親桑禮儀除祕祝語在郊祀志除田租除肉刑十四年祠官致敬增祀無祈十五年舉賢良直諫後元年議所以佐百姓後二年單于和親紀一賜民爵二益封功臣三建儲四振貸養老令五修代來功益封高帝功臣六列侯就國七舉賢良罷兵衛八開藉田九立辟疆章等為王十除誹謗十一賜民半租十二丞相勃就國十三赦濟北吏民十四賜半租又孝悌力田十五親桑十六除祕祝十七除肉刑十八除田租十九增諸祀圭幣二十議郊祀二十一舉賢良二十二議民食二十三和親二十四遺詔賈山言於孝文曰山東吏布詔令老癃扶杖聽之思見德化之成太史公書高景二紀詔皆不書獨文紀凡詔皆稱上曰以其出於帝之實意也不然山東扶杖聽詔願見德化之成其可以空言動邪魏律序云丁酉詔書漢文所下元帝紀贊號令溫雅有古之風烈漢初作誥真草詔書武紀元狩六年夏六月乙巳廟立皇子閎為齊王旦為燕王胥為廣陵王初作誥注服虔曰詔敕王如尚書諸誥也李斐曰今敕封拜諸侯王策文亦是也贊曰號令文章煥焉可述後嗣得遵鴻業而有三代之風齊懷王傳閎與燕王旦廣陵王胥同日立皆賜策各以國土風俗申戒焉曰惟元狩六年四月乙巳皇帝使御史大夫湯廟戒閎為齊王曰嗚呼小子閎受兹青社朕承天緒惟稽古建爾國家封于東土世為漢藩輔燕王旦賜策曰受兹玄社封于北土廣陵王胥曰受兹赤社封于南土史記三王世家禇先生曰武帝同日俱拜三子為王各因子才力智能及土地之剛柔人民之輕重為作誥以申戒之至其次序文字之上下簡之參差長短皆有意人莫能知謹論次其真草詔書編于左方索隱曰按武帝策此三王皆自手製太史公曰文辭爛然甚可觀也淮南王安傳武帝好藝文以安善為文辭甚尊重之每為報書及賜常召司馬相如等視草乃遣注為文之藁草儒林傳詔書下者文章爾雅訓辭深厚董仲舒傳制曰興于朕躬漢策書詔策册書策詔賜策高祖詔策孝文詔策三王賜策申戒並見上列傳鼂錯上親策詔之曰十有五年壬子皇帝曰云云錯對云云詔策曰云云河間獻王對詔策所問三十餘事董仲舒以賢良對策制曰云云仲舒對曰發德音下明詔復册之曰云云天子復册之制曰云云對曰復下明册以切其意公孫弘至太常上䇿詔諸儒制曰云云弘對曰云云武紀元光元年五月賢良受策察問於是董仲舒公孫弘等出焉拜為博士復上疏天子册書答曰弘自視孰與周公賢昭帝元鳯元年三月涿郡韓福以德行召至京師賜策書束帛遣歸蕭望之上策望之曰使光祿勳惲策詔左遷君太子太傅授印蕭育哀帝時為南郡太守以耆舊名臣乃以三公使車載育入殿中受策孔光為左將軍成帝召光當拜已刻侯印書贊書贊者書贊辭于策也光薨使九卿策贈馬宫以太皇太后詔賜宫策史丹永始中上賜策曰朕愍以官職之事久留將軍朱博為丞相趙玄為御史大夫並拜於前殿延登受策師丹罷歸尚書令唐林上疏曰竊見免大司空丹策書泰深痛切君子作文為賢者諱龔勝為光祿大夫稱疾與邴漢乞骸於是王莽依故事白遣勝漢策曰惟元始二年六月庚寅光祿大夫大中大夫耆艾二人以老病罷太皇太后遣謁者僕射策詔之曰云云董賢册文言允執其中此乃堯禪禹之文非三公故事元后賜車騎將軍音策書後紀建武二年正月封功臣為列侯策曰在上不驕高而不危制節謹度滿而不溢敬之戒之傳爾子孫長為漢藩鄧禹為大司徒策曰制詔前將軍禹深執忠孝與朕謀謨帷幄決勝千里云云汝作司徒敬敷五教五教在寬冦恂帝數策書勞問譙玄建武十一年卒光武美之䇿詔本郡祠以中牢獨行東平王蒼策曰惟建初八年三月己卯皇帝曰咨王丕顯勤勞王室親受策命昭于前世鍾離意永平三年夏旱上疏帝策詔報曰云云馮勤奉策至司徒府韋彪章和二年夏使謁者策詔曰其上大鴻臚印綬鄧彪為太尉乞骸元和元年賜策罷隂興賜策追諡竇憲固辭封賜策許焉楊震下詔策具祠張顯延平元年為漁陽守鄧太后策書褒美樊英建光元年詔公車賜策書召英等六人永建二年順帝復以策書玄纁召英傳注謝承書郎宗安帝初詔公車徵策文曰郎宗李昺孔喬等云云各致嘉禮遣詣公車將以補察國政輔朕之不逮郎顗曰三公被策文得賜錢即復起矣宋漢策曰全素絲羔羊之潔周舉陽嘉三年大旱特下策問曰變復之徵厥效何由楊厚陳五事制書褒述又策書弔祭李固上疏陛下初登大位聘樊英黃瓊楊厚賀純策書嗟歎待以大夫之位楊賜追位特進策曰云云馮緄延熹五年拜為車騎將軍討蠻夷詔策云云陸康遣孝亷計吏奉貢詔書策勞戴封詔書策美獨行崔烈為司徒拜日天子臨軒百僚畢會宦者傳注詔書封苗光東阿侯未受符策獨斷漢天子其言曰制詔其命令一曰策書二曰制書三曰詔書四曰戒書高后紀注師古曰天子之言一曰制書二曰詔書制書者謂為制度之命也又曰策者簡也其制長二尺短者半之其次一長一短兩編下附禮儀志太子即帝位太尉讀䇿安帝紀有策命皇后則宗正讀策拜皇太子則司空讀策書拜諸侯王公之儀光祿勳前一拜舉手曰制詔其以某為某讀策書畢謁者稱臣某再拜又有諡策愍策景中一年二月命列侯初封及之國大鴻臚奏策諸侯太傅初除之官大行奏策衛宏漢舊儀載神爵三年十月甲子丞相延登詔五鳯三年正月乙巳大夫初拜策又漢舊儀云丞相御史大夫初拜皇帝延登親詔丁孚漢儀有夏勤策文元初六年三月甲子制詔以大鴻臚勤為司徒蔡質漢儀載建寧四年七月乙未策宋太后文鄧太后賜周馮貴人策曰云云蔡雍封事引孝元皇帝策書曰禮之至敬莫重於祭謝承後漢書曰承父嬰為尚書侍郎每讀高祖及光武之後將相名臣策文通訓條在南宫祕於省閣唯臺郎升復道因得開覽永元六年三月丙寅舉賢良親臨策問永初二年詔曰朱邑尹翁歸政迹茂異宣帝以黃金百斤策賜其子晉嵩高山下得竹簡一枚上有兩行科斗書束晢曰此明帝顯節陵中策也漢璽書高紀注兼霍光傳注等書應劭曰璽信也古者尊卑共之左傳魯襄公在楚季武子使公冶問璽書追而與之秦漢尊者以為信羣下乃避之獨斷曰秦以來天子獨以印稱璽又獨以玉羣臣莫敢用孟康曰漢初有三璽蔡雍獨斷天子六璽皆白玉螭虎紐輿地志漢封詔璽用武都紫泥故制詔皆璽封尚書令印重封列傳鼂錯上言邊事文帝嘉之乃賜錯璽書寵答焉曰皇帝問太子家令上書言兵體三章聞之劉屈氂為左丞相賜璽書嚴助為會稽太守數年不聞問賜書曰制詔會稽太守吾丘壽王拜東郡都尉時多盜賊詔賜璽書曰云云連十餘城之守任四千石之重職事並廢盜賊縱橫其不稱在前時何也霍光與金日磾等誅莽何羅功未録武帝病封璽書曰發書以從事遺詔封為侯燕王旦昭帝賜諸侯王璽書旦曰璽書封小丞相賜璽書部中二千石逐捕天子使使者賜燕王璽書昌邑王國除為山陽郡元康二年遣使者賜山陽太守張敞璽書曰制詔山陽太守其謹備盜賊察往來過客毋下所賜書趙充國神爵元年上拜許延壽為強弩將軍即拜酒泉太守辛武賢為破羌將軍賜璽書嘉納其册以書敕責充國充國乃上書陳兵利害六月戊申奏七月甲寅璽書報從充國計又璽書報令靡忘以贖論靡忘罕羌豪帥名也其秋上賜書曰制詔後將軍云云充國作奏未上會得進兵璽書杜延年為北地太守治郡不進上以璽書責延年延年乃選良吏擊豪強郡中清靜居嵗餘上使謁者賜延年璽書黃金二十斤循吏傳孝宣厲精為治二千石有治理效輒以璽書勉厲增秩賜金或爵至關內侯陳遵祖父遂宣帝微時與有故宣帝即位稍遷至太原太守賜璽書曰制詔太原太守官尊祿厚可以償博進矣遊俠王尊為東平相視事奉璽書至庭中王未及出受詔尊持璽書歸舍食已乃還致詔馮奉世永光二年秋遣奉世將騎擊羌因陳轉輸之費上於是以璽書勞奉世曰皇帝問將兵右將軍云云淮陽王欽元帝遣諫大夫王駿賜欽璽書駿諭旨曰云云欽謝願悉心自新奉承詔䇿東平王宇元帝時與太后不相得上於是遣太中大夫張子蟜奉璽書敕諭之曰皇帝問東平王云云又特以璽書賜王太后詔書又敕傅相張放出為天水屬國都尉璽書勞問不絶放延壽子也事見延壽傳匡衡上疏曰諸見罷珠崖詔書者莫不欣欣人自以將見太平趙后傳中黃門持詔記盛緑綈方底封御史中丞印復持詔記封如前篋中有赫蹄書後傳馮異破赤眉璽書勞異曰云云隗囂降異上書不敢自伐諸將或欲分其功帝患之乃示璽書曰征西功若丘山隗囂光武知囂不為用欲討之遣耿弇等伐蜀先使來歙奉璽書喻旨吳漢建武二年帝使使者璽書定封為廣平侯竇融建武五年遣劉鈞奉書獻馬帝賜融璽書因授涼州牧璽書既至河西咸驚以為天子明見萬里外王常建武十年璽書拜橫野將軍冦恂奉璽書降高峻峻據高平不下恂降之馬援建武十一年夏璽書拜隴西太守又以璽書勞之十七年璽書拜伏波將軍祭肜為襄賁令璽書勉勵增秩一等臧宫上璽書勞宫賜吏士絳縑注馮勤光武疑侯霸有姦賜霸璽書使勤奉策至司徒府勤還陳霸本意申釋事理申屠剛説隗囂曰今璽書數到委國歸信杜詩上疏曰間者發兵但用璽書徵兵郡國宜有重慎可立虎符北胸奴建武十三年遣使璽書報答賜以綵繒梁慬永初二年擊羌破之數璽書勞勉委以西方事馬賢建光元年璽書封第五訪守張掖開倉賑給順帝璽書嘉之皇甫規璽書誚責楊震曰朝廷欲令三府辟召宜有尚書敕楊賜上疏曰割用板之恩注板謂詔書輿服志注漢舊儀曰奉璽書使者乘馳傳其驛騎也三騎晝夜行千里為程漢故事詔書見典故類魏相傳奏先帝聖德仁恩之厚謂孝昭也昭記始元二年八月詔振貸種食勿收責毋令出今年田租四年七月詔減給中都官馬元鳯二年六月詔毋斂今年馬口錢三輔太常郡得以菽粟當賦三年春正月詔止四年毋漕所振貸勿收責六年夏詔以菽粟當賦元平元年二月詔減口賦錢什三又始元元年遣王平等五人持節行郡國舉賢良問疾苦二年二月振貸種食五年夏罷亭毋馬馬弩關六年二月議罷鹽鐵榷酤秋七月罷榷酤官令民以律占租元鳯四年正月詔毋收口賦三年以前逋更賦未入者勿收相之所條奏者其殆此乎贊曰孝昭委任霍光光知時務之要輕繇薄賦與民休息漢恩澤詔書黃霸傳擢為揚州刺史本始四年三嵗制詔以為潁川太守時上垂意於治數下恩澤詔書吏不奉宣霸為選擇良吏分部宣布詔令令民咸知上意治為天下第一召守京兆尹元康二年詔歸潁川太守官前後八年郡中愈治天子下詔稱揚曰霸宣布詔令百姓鄉化其賜爵關內侯黃金百斤秩中二千石而潁川孝弟有行義民三老力田皆以差賜爵及帛神爵四年四月也紀地節元年始親政事三年三月詔賜王成爵又詔假公田貸種食加賜鰥寡高年帛十月詔池籞假貧民郡國宫館勿修假流民田貸食勿算事十一月舉孝弟行義四年二月詔凶災勿繇事五月詔子孫首匿勿坐九月遣使問疾苦減鹽賈又令郡國嵗上繫囚課殿最元康元年三月以鳯集露降赦天下賜勤事吏女子百户牛酒加賜鰥寡三老孝弟力田帛所振貸勿收復功臣子孫八月詔博舉吏民通文學者二年正月詔與士大夫更始三月以鳯露賜吏民爵牛酒帛五月詔吏務平法郡國災甚者毋出租賦三年春以神爵賜金帛吏民爵牛酒六月詔毋得以春夏擲巢漢詔書行事詔條王尊傳涿郡人給事太守府問詔書行事尊無不對注師古曰以施行詔條問之鮑宣傳為豫州牧司直郭欽奏宣所察過詔條出六條之外于定國傳元帝始即位關東連年被災害上於是數以朝日引見丞相御史入受詔條責以職事永光元年春霜夏寒日青亡光上復以詔條責曰云云百官表刺史掌奏詔條察州夏侯勝傳群臣大議廷中皆曰宜如詔書勝曰詔書不可用也紀建平二年八月詔曰六月甲子制書非赦令也皆蠲除之漢寬大詔見時令類漢建武詔書中元詔書章帝紀建初五年夏五月辛亥詔曰建武詔書曰堯試臣以職不直以言語筆札詳見辟士四科意孝武之後詔命浮文多實少光武復還漢初簡質之舊建初四年十一月壬戌詔曰中元元年詔書五經章句煩多議欲減省光武詔書初即位封卓茂建武元年封更始二年封功臣議省刑法封拜宗室三年受璽祠高廟詔非名捕不得係四年詔報耿弇與王常共屯涿郡勉思方略侯霸奏下寬大之詔五年進柔良賜竇融璽書六年給困乏救隴西詿誤三輔殊死省吏員日食舉賢良三十稅一七年禁奢僭罷車騎材官樓船日食禁上書言聖舉賢良方正十一年詔殺奴婢不減罪十三年令太官勿受異味封絶國十八年蠲除妄殺之法十九年立太子二十二年地震勿輸田租報鄯善王曰如諸國力不從心東西南北自在也二十五年敕衛颯以桂陽太守歸家須後詔書二十七年令二府去大詔報臧宫馬武二十八年報北胸奴班彪立藁草并上三十二年璽書報答三十年封禪詔書曰不如林放中元元年告祠高廟文心雕龍曰光武留意斯文而造次喜怒時或偏濫詔賜鄧禹稱司徒為堯敕責侯霸稱黃鉞一下若斯之類實乖憲章漢賜方國手迹循吏傳序光武天下已定務用安靜以手迹賜方國者一札十行札牒也細書成文勤約之風行于上下詔諭公孫述曰詔書手記不可數得來歙使隗囂以手書暢意報隗囂以手書曰自今以後手書相聞建武三年書示隗囂因使效信賜竇融璽書河西皆驚璽書勞馮異曰始雖垂翅回溪終能奮翼澠池又詔報異曰義為君臣恩猶父子何嫌何疑而有懼意又詔厚意久不報第五倫讀詔書歎曰此聖主也一見決矣鄧禹久不進兵下敇曰直以時進討敕馮異平定安集敕岑彭書曰人苦不知足每一發兵頭鬚為白敕蓋延曰可直往搗郯帝數以書誡之讓吳漢曰比敕公千條萬端何意臨事勃亂勞郭伋有京師蒙福之言遣冦恂平潁川有當以時定之言報陳俊詔有勉鎮撫之言詔報朱浮有軍資未充故須後麥之言光武與隗囂公孫述竇融等書有以見心事之磊落焉敕鄧禹馮異岑彭等書有以見機神之英略焉頭鬚為白之言平定安集之訓與夫責劉尚以斬將弔人之義有以見不得已之心焉驚河西感市掾不待識者而占其中興矣以司徒比堯必非代言者所敢道天水多文學掾光武有所辭答特加意焉漢四書策書制書詔書誡敕露布光武紀建武元年九月辛未詔注漢制度曰帝之下書有四一曰策書二曰制書三曰詔書四曰誡敕策書編簡也其制長二尺短者半之篆書起年月日稱皇帝以命諸侯王三公三公以罪免亦賜策而以隸書用尺一木兩行唯此為異也制書者帝者制度之命其文曰制詔三公皆璽封尚書令印重封露布州郡也詔書者詔告也其文曰告某官云如故事誡敕者謂敕刺史太守其文曰有詔敕某官它倣此獨斷曰策書策者簡也其制長二尺短者半之其次一長一短兩編下附篆書春秋正義蔡雍言二尺者漢世天子策書所用制書有印使符下逺近皆璽封尚書令印重封唯赦令徵三公詣朝堂受制書司徒印封露布下州郡詔書有三品其文曰告某官官如故事是為詔書羣臣有所奏請尚書令奏之下有制曰天子答之曰可若下某官亦曰詔書羣臣有所奏請無尚書令奏制之字則答曰已奏如書本官下所當至亦曰詔戒書戒敕刺史太守及三邊營官被敕文曰有詔敕某官是為戒敕世皆名此為策書失之逺矣鮑昱傳中元元年拜司隸校尉詔昱詣尚書使封胡降檄注檄軍書也若今之露布也光武使小黃門問昱有所怪否對曰臣聞故事通官文書不著姓又當司徒露布怪司隸下書而著姓也注引漢官儀帝報曰吾欲令天下知忠臣之子孫復為司隸也李雲傳雲素剛憂國將危心不能忍乃露布上移副三府注露布謂不封之也祭祀志注東觀書有司奏孝順號曰敬宗露布奏可春魏改元景初詔曰司徒露布咸使聞知蜀建興五年詔曰丞相其露布天下魏略載明帝露布天下并班告益州漢特詔列傳宣秉建武元年拜御史中丞光武特詔御史中丞與司隸尚書令會同並專席而坐東海恭王強永平元年特詔中常侍杜岑及東海傅相曰王恭謙好禮以德自終遣送之物務從約省馮石特詔以它縣租稅足石郎顗特詔拜郎中張楷漢安元年特下詔告河南尹以禮發遣楊秉延熹七年南巡特詔秉從劉瑜延熹八年特詔召問災咎之徵王暢桓帝特詔三公令高選庸能蔡雍光和元年七月特詔問曰比災變互生未知厥咎具對經術以皂囊封上賈琮傳特敕三府精選能吏陳蕃傳有優詔優策南史漢手詔東平王蒼傳明帝永平四年上疏曰制書褒美班之四海乞上印十一年蒼還國帝臨送歸宫悽然懷思遣使手詔國中傅曰云云建初元年章帝報書云云三年特賜蒼及琅邪王京書有司奏遣東平王蒼歸國章帝賜手詔曰欲署大鴻臚奏不忍下筆建初八年八月蓋勳傳雖在外每軍國密事帝常手詔問之手筆下詔見御書類隋志梁有漢高祖手詔一卷漢尚書詔文周禮注宰夫贊治若今起文書草也御史贊書若今尚書作詔文秦少府吏在殿中主發書謂之尚書漢因之武昭以後稍重張安世以善書給事尚書簪筆事武帝數十年後漢始置尚書郎三十六人主作文書起草十月賜赤管大筆隃麋墨永寧中陳忠謂尚書出納帝命為王喉舌諸郎鮮有雅才每為詔文轉相求訪且辭多鄙固遂薦周興為尚書郎文心雕龍虞重納言周貴喉舌故兩漢詔令職在尚書其出如綍不反若汗是以淮南有英才武帝使相如視草隴右多文士光武加意於書辭前傳鄭崇為尚書僕射哀帝欲封傅商崇因持詔書案起注師古曰案者即寫詔之文高后使大謁者張澤報單于書光武答北胸奴藁草司徒掾班彪所上王嘉為丞相封還詔書鍾離意為尚書僕射敢諫爭數封還詔書漢建初詔書張敏傳建初中定議為輕侮法敏駮議曰輕侮之比寖以繁滋至有四五百科云云高帝去煩苛之法為三章之約建初詔書有改於古者可下三公廷尉蠲除其敝議寢不省復上疏和帝從之漢五曹詔書應劭傳見律令注成帝初置尚書員五人漢舊儀有常侍二千石户主客三公曹東京無三公曹世祖分二千石曹又分客曹為南北凡六曹晉志侍御史漢有五曹一令二印三供四尉馬五乘曹前志賈誼有五曹官制順帝永建元年九月辛亥初令三公尚書入奏事漢尺一簡尺一者漢遺單于書以尺一牘辭曰皇帝敬問胸奴大單于無恙見胸奴傳選舉召拜書之尺一板蕭子良古今篆隸文體曰鶴頭書與偃波書俱詔板所用在漢則謂之尺一簡見文選注後傳楊政儒林范升嘗坐繫獄政乃肉袒以箭貫耳候車駕而持章叩頭大言云云哀泣辭請有感帝心詔曰乞楊生師乞讀曰氣即尺一出升李雲上書曰尺一拜用不經御省注尺一之板詔策也見漢官儀陳蕃上疏曰尺一選舉委尚書三公注板長一尺以寫詔書楊賜對曰唯陛下斥佞巧之臣召鶴鳴之士斷絶尺一陽球酷吏出謁陵節敕不得稽留尺一晉詔書晉五條詔書見戒吏類唐志晉雜詔書一百卷又二十八卷又六十六卷又詔書黃素制五卷定品雜制一卷太元副詔二十一卷崇安即隆安也元興大亨副詔八卷晉義熙詔二十二卷隋志十卷隋志晉咸康詔四卷晉朝雜詔九卷録晉詔十四卷詔集區分四十一卷後周宗幹撰梁有三國詔誥十卷晉元帝詔十二卷班五條詔十卷又有詔集百卷起漢訖宋張華傳當時詔誥皆所草定文心雕龍魏晉誥策職在中書劉放張華互管斯任晉為詔以青紙紫泥山簡表司徒濤奉手筆青紙詔宋泰始二年軍功除官者衆板不能供始用黃紙陳制銓選補用以黃紙録名八座通書奏可以名帖鶴頭板徐陵曰黃札易營魏蘇綽大誥北史自有晉之季文章浮華成俗周文欲革其弊因魏帝祭廟群臣畢至命綽為大誥奏行之其詞曰惟中興十有一年仲夏云云六月丁巳云云大誥爾在位文筆皆依此體常景受敕撰門下詔書凡四十卷唐王言之制百官志中書省凡王言之制有七一曰册書立皇后皇太子封諸王臨軒册命則用之二曰制書大賞罰赦宥慮囚大除授則用之三曰慰勞制書褒勉贊勞則用之四曰發敕廢置州縣增減官吏發兵除免官爵授六品以下官則用之五曰敕旨百官奏請施行則用之六曰論事敕書戒約臣下則用之七曰敕牒隨事承制不易於舊則用之皆宣署申覆然後行焉天授元年改詔為制門下省下之通上其制有六一曰奏鈔以度支國用授六品以下官斷流以下罪及除免官用之二曰奏彈三曰露布四曰議五曰表六曰狀自露布以上乃審其餘覆奏畫制可以授尚書省太宗謂王圭曰中書詔敕或有差失則門下當行駁正神龍元年九月一日敕門下及都省日别録敕目三日一進尚書省凡上之逮下其制有六一曰制二曰敕三曰册天子用之四曰令皇太子用之五曰教親王公主用之六曰符省下於州州下於縣縣下於鄉下之達上其制有六一曰表二曰狀三曰箋四曰啓五曰辭六曰牒諸司相質其制有三一曰關二曰刺三曰移凡授內外百司之事皆印其發日為程一曰受二曰報諸司計奏達京師以事大小多少為之節凡符移關牒必遣於省部乃下天下大事不決者皆上尚書省凡制敕計奏之數省符告宣之節嵗終為斷六典注册書用簡制書發日敕用黃麻紙敕旨論事敕敕録用黃藤紙書用絹貞觀中十一年始用黃紙寫敕制上元三年詔尚書省頒下諸司州縣並用黃紙閏三月二十日詔會要中書以黃白二麻為綸命重輕之辨開元三年十月始用黃麻紙寫詔上元三年二月制敕並用黃麻紙李肇翰林志凡赦書德音立后建儲行大誅討拜免三公宰相命將制書並白麻一云藤紙雙日起草隻日宣鄭絪奏故事惟封王命相用白麻唐初將相官告用銷金箋及金鳯紙書之餘皆魚箋花箋凡賜豫徵召宣索處分曰詔用白麻紙慰撫軍旅曰書用黃麻紙薦告詞文用青藤紙朱書謂之青詞宰相及使相告用色背綾金花紙節度使用白背綾金花紙命婦金花羅紙吐蕃及贊普書别録用金花五色綾紙吐蕃宰相已下書用五色麻紙南詔及清平官書用黃麻紙元和八年八月壬寅吏部定官告紙軸之色物開元十六年置學士院專掌內命凡拜免將相號令征伐皆用白麻中書所出獨得用黃麻其白麻皆在翰林院學士初選者中書門下召令右銀臺門候旨其日入院試制書批答共三道詩一首試畢封進可者翌日受宣後增試賦一首王彥威云官品令三師三公正一品尚書正二品並册拜舊紀貞元十一年四月甲子賜南詔敕書始列中書三官宣奉行復舊制也唐武德以來詔誥岑文本傳擢中書舍人時顔師古為侍郎自武德以來詔誥或大事皆所草定及得文本號稱職而敏速過之師古傳制誥皆成其手册奏之工時無及者唐賜李靖詔書見御書類韋澳授河陽節度宣宗遣使以薄紙手作詔賜澳唐太宗手詔貞觀政要二年魏徵言有道之主以百姓心為心太宗手詔答之深自剋責六年太常卿韋挺上疏陳得失太宗賜書曰數進嘉言用決朕懷十一年特進魏徵上疏曰揔此十思弘兹九德簡能而任擇善而從太宗手詔答曰公之所陳朕聞過矣當置之几案事等韋弦遲復嘉謀犯而無隱十六年散騎常侍劉洎上書諫曰忘憎愛謹取捨手詔答曰今聞讜言虛懷必改洎傳手詔答曰非言無以述慮貞觀初李大亮密表使者求鷹太宗下書曰有臣若此朕復何憂兼本傳列傳杜如晦薨手詔虞世南勒文于碑鄭元璹太宗賜書曰知公口伐可汗劉政會太宗手詔昔預義舉有成功張公謹璽詔尉勞虞世南傳帝手詔魏王泰曰云云陸贄曰太宗以虛受為理本云云有上封獻議者手敕褒揚唐賜渤海詔息兵詔張九齡傳始説知集賢院嘗薦九齡可備顧問説卒天子思其言召為祕書少監集賢院學士知院事會賜渤海詔而書命無足為者乃召九齡為之被詔輒成九齡集二十卷張昌齡傳貞觀末召見試息兵詔唐開元詔誥孫逖傳開元間蘇頲齊浣蘇晉賈曽韓休許景先及逖典詔誥為代言最逖尤精密張九齡視其草欲易一字卒不能也蘇頲傳帝愛其文曰卿所為詔令别録副本書臣某撰朕當留中後遂為故事李德裕著論曰近世詔誥惟頲敘事外自為文章陸贄制誥集十卷權德輿序曰從幸奉天詔書旁午灑翰即成不復起草曲盡事情中於機會嘗奏曰宜痛自改過以感人心上從之故行在詔書始下雖武人悍卒無不揮涕激發及還京師李抱真來朝奏曰陛下在山南時山東士卒聞書詔之辭無不感泣思奮臣節臣知賊不足平也唐古今詔集德音録制詔録元和制集王言會最志詔令類溫彥博古今詔集三十卷又李義府一百卷薛克構聖朝詔集三十卷唐德音録三十卷起武德元年五月迄天寶十三載正月太平內制五卷睿宗玄宗時書目三卷明皇制詔録一卷元和制集十卷唐舊制編録六卷費氏集馬文敏王言會最五卷凡詔令一家十一部三百五卷始於晉詔書終於宋幹詔集區别失姓名十家溫彥博以下不著録十七家二百二十二卷文藝傳制册則常衮楊炎陸贄權德輿王仲舒李德𥙿鄭亞作李德𥙿制集序曰貞觀中則顔師古岑文本天后時則李嶠崔融燕許角立於玄宗之朝常楊繼美於代宗之世列傳高郢制誥無留藁曰王言不藏於家王涯再為學士文有雅思永貞元和間訓誥溫麗多為藁定權德輿知制誥凡撰命詞九年以類集為五十卷元稹知制誥變詔書體純厚明切李德裕為學士號令大典册皆更其手白氏制朴一卷居易裒類制詞事語以備撰述之用元稹詩白朴流傳用轉新注云樂天於翰林中書取書詔批答詞等撰為程式禁中號曰白朴每有新入學士求訪寶重過於六典崇文目白氏制朴三卷唐除書德音肅宗時楊炎常衮同時知制誥衮長於除書而炎善德音自開元後言制詔者稱常楊志常衮詔集六十卷楊炎制集十卷蘇辨編唐寶書見印璽類唐明皇制詔後集書目田錫纂一百卷起唐隆元年平內難溫王下詔止天寶十五載制誥唐大詔令宋綬輯唐大詔令未次甲乙敏求用十三類離為一百三十卷目録三卷唐會要大順二年十月令詔書别録小字本留內永為定式兩朝志滕宗諒大唐統制三十卷集唐制誥禹誥文粹陳黯禹誥禹賢益以天下授益采其謳謡之所歸卒讓於啓故啓不由父授而書無典訓黯追其旨作禹誥建隆景德麻制兩朝藝文志總集有五代國初內制雜編十卷建隆景德雜麻制十五卷淳化璽書三年四月丁丑賜太師趙普璽書慶厯手詔三年十五丙午命轉運按察使時上以天下事責成大臣而用琦仲淹弼在二府因內出手詔賜琦等曰當世急務悉陳之於是仲淹弼條上十事故張昷之首被兹選癸亥御迎陽門召知制誥諫官御史等詔曰欲聞朝政得失兵農要務云云八年三月甲寅出手詔賜輔臣以公私匱之仕進多門牧宰將帥罕聞稱職西北多故虜態難常悉為朕條畫之又賜翰學三司開封中丞等詔皆給筆札令即坐以對宰臣執中固辭乃聽兩府歸上之御集有手詔一卷嘉祐學士院草録中興以來玉堂制草嘉祐三年六月歐陽修乞將國朝以來學士院所撰制誥文書各以門類依其年次號為學士院草録仍乞差學士兩員掌之甲寅詔學士院編録天聖七年十二月庚子詔中書自今朝官以上告詞别録本上禁中隆興元年翰林承旨洪遵撰中興以來玉堂制草序云是書自承平有之南渡以後泮散不屬始命綴緝凡將相之除拜后妃之封册詔旨之攽樂語之奏上梁之文布政之榜無不備具惟答詔青詞之煩不復記也為六十四卷周必大續玉堂制草三十卷裒隆興以來舊藁繼遵所編以尊號表文為首增以召試館職策問乾道八年壬辰上元日序嘉祐編録端拱以來宣敕三年十二月甲辰樞密院上端拱以來宣敕劄子六十卷目録二卷一本留中一本藏龍圖閣初韓琦為副樞言嘗任河北見祖宗所下詔令皆契丹未講和以前經武禦戎之事請下本院編録上之志刑法類元豐五年七月辛卯編中書御筆手詔千三百四十六事自治平四年至熙寧十年為三十一册付中書省本朝大詔令二百四十卷建隆至宣和此集紹興中出於宋綬之家建炎親筆詔書建炎三年張浚充川陜宣撫處置使便宜黜陟賜御筆詔書曰以身徇國同德一心紹興二年十一月庚午詔自今御筆並作聖旨行下時右諫議徐俯言祖宗朝批降御筆並作聖旨行下自宣和以來所以分御筆聖旨者以違慢住滯科罪輕重不同也今明詔許繳駁論列當依祖宗法方其批付三省稱御筆三省奉而行之稱聖旨然後名正言順人但見宣和御筆謂不當然不知祖宗御筆不少王廣淵在仁宗朝嘗編類成書以為後法乞依故事施行從之建炎紹興詔旨紹興四年七月辛酉知湖州汪藻上所編建炎中興詔旨三十七册詔送史館十六年三月二十二日耿世南以編類徽宗朝詔誥來上七月四日董陵上編集徽宗御集手詔二册賜帛三十二年六月二十三日孝宗即位未改元詔朕惟太上臨御三紀法令典章粲然備具嗣位之初深懼墜失其議設官裒集建炎紹興以來所下詔旨條例以聞朕當與卿等恪意奉行以對揚慈訓既而差吏部侍郎徐度刑部侍郎路彬裒集紹興恤刑手詔三年正月十一日詔恤刑手詔委尚書左右司刻石攽降天下其親札候刻石畢置大理廳事既而以碑刻賜從臣及寺官詔稱高柔遊肇事誨以仁平諭以禍福綦崈禮為詔曰三年正月乙丑內出手詔戒刑獄之吏付臣頤浩等施行丁卯命尚書左右司刻詔于石以墨本頒天下親札賜大理庚午宣示六曹兩省侍從官紹興編元符以來詔旨八年十一月丁未龍圖閣直學士汪藻與鮑延祖孟處義準詔編修元符庚辰至宣和乙巳以來詔旨書成上之降付史館先是紹興二年十一月壬午藻守湖州請以太上道君皇帝逮上登極所降御筆手詔賞功罰罪文字自元符庚辰至建炎己酉凡三十年事分年編類至六年編成庚辰以後凡十三年詔旨詔藻轉一官至是藻悉以所編詔旨六百六十五卷上之一云書凡八百册賜茶藥進官二等繫年録紹興四年三月癸酉藻上元符以來詔旨二百卷紹興七朝制誥録四年五月丙子二十七日詔館閣以纍朝實録中制誥等各以門類編為七朝制誥録用劉大中請也其後不克成紹興淳熙紹熙慶元寬恤詔令紹興二十五年九月十三日丁巳宰臣上寬恤詔令一百六十八卷目録三十一卷修書旨揮一卷共二百卷五十門詔名曰紹興編類寬恤詔令攽行之孝宗踐阼之始未及三月內出寬恤事十八條攽行郡國淳熙十年九月六日詳定賈選言參修隆興以來紹興三十二年至淳熙十年俟成門目審覆訖乃進上曰官名刪定須有去取十一年六月一日上淳熙寬恤詔令三百卷六十門一云二百四十卷戊午攽行光宗改元二年議臣請編類紹熙寬恤詔條鏤板班降慶元二年三月四日敕局自淳熙十六年二月至紹熙五年七月五日編為三百餘卷十一月十一日進紹熙寬恤詔令三百四十六卷慶元續修淳熙寬恤詔令一百七十五卷自十一年正月至十二年二月一日五年三月二十四日又請纂輯慶元寬恤詔令六年四月十五日進慶元四百二十六卷頒布郡國五月二十八日置寬恤局選侍從郎官各二人臺諫二人領之嘉定六年五月二十八日兵部尚書李大性請纂輯慶元六年以後十四年五月二十二日乙巳上續修慶元詔令七百五十八卷乾道御書戒飭詔六年五月二十四日御書戒飭詔賜宰臣允文等淳熙五年八月二日賜史浩六年三月二十四日賜趙雄九年五月一日賜王淮元祐三年八月中書舍人曽肇録上仁宗朝緣內降戒飭詔書事迹凡八條别為一通乞置之坐右淳熙聖朝教令德音八年六月七日知劒州王章上詔送祕閣自建隆開基止崇寧五年文心雕龍曰授官則義炳重離之輝封策則氣含雲雨之潤敕戒則筆吐星漢之華治戎則聲有洊雷之威肆赦則文有春露之滋明罰則辭有秋霜之烈此詔策之大略也得於心應於手朝出九重莫行萬里風動草偃山鳴谷應布宣德音渙為大號四海震動沛然若雷霆之發一字之褒如華衮一言之感如挾纊文章之功侔於造化矣玉海卷六十四
