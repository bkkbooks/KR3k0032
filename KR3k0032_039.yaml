body:
  text: 玉海卷三十九宋王應麟撰藝文三禮又見禮制九經禮居其三曰儀禮漢儒得古文禮五十六篇高堂傳士禮十七篇漢志所謂古經七十篇者也劉原父云當作十七曰周禮漢河間獻王得之李氏失冬官一篇補以考工記劉歆校理始得著錄漢志所謂周官經六篇者也曰禮記有大戴禮記小戴禮記漢后蒼授梁人戴徳及兄子聖徳刪古禮為八十五篇謂之大戴禮聖刪大戴禮為四十六篇為小戴禮馬融又足月令明堂位樂記為四十九篇漢志不著錄而曰徳聖慶普三家立於學官後漢諸儒多為小戴訓即今之禮記也大戴禮既已缺逸其間又多雜誤後漢儒林傳與隋經籍志諸書言三禮皆不及大戴云周禮書禮灋禮經經禮經制禮志周制春官宗伯帥其屬掌邦禮注禮謂曲禮五吉凶賓軍嘉其别三十有六大史掌邦六典禮居一焉大祭祀與羣執事讀禮書而協事祭之日執書以次位常大會同朝覲以書協禮事將幣之日執書以詔王小史大祭祀讀禮灋史以書叙昭穆之爼簋凡國事之用禮灋者掌其小事天官大宰掌邦之六典注典常也經也法也王謂之禮經常所秉以治天下也邦國官府謂之禮法常所守以為法式也常者其上下通名小宰以灋掌祭祀朝覲會同賓客之戒具注謂其禮灋也宰夫牢禮之灋秋官小行人掌邦國賓客之禮籍禮俗政事敎治為一書左氏傳隠公七年告終稱嗣以繼好自心民謂之禮經注此言凡例乃周公所制禮經也王子朝曰敢布先王之經閔元年仲孫湫曰魯猶秉周禮僖二十五年卜偃曰周禮未改成風曰崇明祀保小寡周禮也文十八年史克曰周公制周禮曰則以觀徳昭二十三年叔孫婼曰列國之卿當小國之君固周制也哀三年司鐸火子服景伯命宰人出禮書宰人冢宰之屬七年子服景伯曰周之王也制禮上物不過十二天之大數也杜預序韓宣子適魯昭二年春見易象魯春秋曰周禮盡在魯矣注春秋遵周公之典以序事韓子所見蓋周之舊典禮經也國語晉子餘曰禮志有之曰將有請於人必先有入焉周單子曰周制有之曰列木以表道立鄙食以守路畺有寓望國有郊牧藪有圃草囿有林池以禦災也其餘無非穀土民無懸耜野無奧草不奪民時不蔑民功有優無匱有逸無罷國有班事縣有序民韓詩外傳周制曰先時者死無赦不及時者死無赦漢藝文志儒家河間周制十八篇似獻王所述禮樂志周監二代禮文尤具事為制曲為防故稱禮經三百威儀三千注藝文志注韋昭曰周禮三百六十官也瓚曰禮經謂冠昏吉凶周禮三百是官名也師古曰威儀三千蓋儀禮是也記禮器注經禮謂周禮也六篇官三百六十曲猶事也事禮謂今禮也其中事儀三千詩假樂箋成王循用舊典之文章謂周公之禮法正義六典之法文中子聖人在上未有若周公其道則一而經制大備又曰不暫捨周禮禮如有用我執此以往周敵王命葉氏曰禮器云經禮三百曲禮三千經禮制之凡也曲禮文之目也故中庸云禮儀三百威儀三千先王之世二者蓋皆有書藏於有司祭祀朝覲會同則太史執之以涖事小史讀之以喻衆而卿大夫受之以敎萬民保氏掌之以敎國子亦此書也周衰二者皆亡惟孔子知之故謂之執禮周儀禮漢髙唐生士禮曲禮三禮義宗儀禮者周公所制吉禮惟得臣禮三篇凶禮得四篇上自天子下至庶人其禮同等餘三篇皆臣禮賓禮惟存三篇軍禮亡失嘉禮得七篇儀禮經五萬六千一百十五字儀禮疏序周公太平之書周禮為末儀禮為本本難明末易曉韓愈讀儀禮以為周公文王法制在是恨不得揖遜其問掇其竒辭奥㫖禮序曰禮體也履也統之於心為體周禮是也踐而行之曰履儀禮是也儀禮注後鄭而已疏有二家齊黄慶隋李孟悊互有長短今擇善而從兼增己義仍取李元植詳論可否唐志賈公彦疏五十卷漢興求錄遺文有古書今文髙堂生傳十七篇是今文也孔子宅得古儀禮五十六篇其字皆篆書是為古文十七篇與髙堂生同而字多不同餘三十九篇絶無師說秘在於館鄭注禮以今古二字並之十七篇士冠禮至有司徹倫劉向别錄皆尊卑吉凶次第敘故鄭用之大小戴皆異鄭玄禮序曰秦并天下收儀禮而歸咸陽但采其尊君抑臣以為時用史記正義七錄云古經出魯淹中其書周宗伯所掌五禮威儀之事有六十六篇無敢傳者後博士侍其生得十七篇鄭玄注今之儀禮是也餘篇皆亡儀禮疏云古文十七篇與髙堂生所傳相以禮記正義鄭君六藝論云按藝文志儒林傳傳禮者十三家唯髙堂生及五傳弟子戴徳聖名在也又云五傳弟子者髙堂生蕭奮孟卿后蒼及戴徳戴聖為五此所傳皆儀禮也今禮行於世者二戴之學也藝文志漢興魯髙堂生傳士禮十七篇而魯徐生善為頌不能通經陸徳明賈公彦以為今儀禮按今儀禮中士禮有冠昏相見喪夕虞特牲饋食七篇他皆天子諸侯卿大夫禮必非髙堂生所傳者不知賈陸何據而云王式傳歌驪駒江翁曰經何以言之曰在曲禮陸釋文曰曲禮是儀禮之舊名委曲說禮之事宗伯注曲禮五其别三十有六疏儀禮是曲禮周禮是經禮書目儀禮乃儀度委曲之書若後世儀注其初蓋三千餘條漢十三家禮禮古經中庸説藝文志禮十三家五百五十五篇禮古經五十六卷經十七篇后氏戴氏記百三十一篇七十子後學者所記也明堂陰陽三十三篇古明堂之遺事王史氏二十一篇七十子後學者别錄云六國時人曲臺后蒼九篇中庸說二篇明堂陰陽說五篇周官經六篇王莽時劉歆置博士周官傳四篇軍禮司馬法百五十五篇古封禪羣祀二十二篇封禪議對十九篇武帝時漢封禪羣祀三十六篇議奏三十八篇石渠漢興髙堂生傳士禮訖孝宣世后蒼最明戴徳戴聖慶普皆其弟子三家立于學官禮古經者出於魯淹中里名及孔氏與十七篇文相似多三十九篇及明堂陰陽王史氏記所見多天子諸侯卿大夫之制雖不能備猶愈蒼等推士禮而致於天子之說後儒林傳孔安國所獻禮古經五十六篇及周官經六篇前世傳其書未有名家前儒林傳孟卿善為禮春秋授后蒼疏廣世所傳后氏禮疏氏春秋皆出孟卿漢周官經傳見上周官解故訓詁晉周禮評藝文志見上河間獻王傳得古文先秦舊書周官尚書禮記孟子老子之屬禮記正義孝文時求得此書不見冬官一篇乃使博士作考工記補之隋志謂李氏得周官上河間獻王購冬官以千金不得取考工記以補正義謂孝文時非也武帝開獻書之路有李氏得周官上於河間獻王獨缺冬官取考工記以補之合成六篇奏之正義云既出於山巖屋壁復入於秘府五家之儒莫得見焉孝成時劉歆校秘書見之始著于錄略衆儒共排以為非惟歆獨識而五官亦有殘缺歆末年始信其為周公致太平之迹王莽時奏置博士弟子惟河南緱氏杜子春在頗識其說正義子春永平初年九十能通其讀識其義鄭衆賈逵往受業焉賈徽及子逵鄭興及子衆又以經書轉相證為解鄭玄注多引杜子春鄭大夫興司農衆之義周禮起於劉歆成於鄭玄正義林孝存以為武帝知周官末世瀆亂不驗之書作十論七難以排之何休以為六國陰謀之書惟鄭玄知為周公致太平之迹故能答林碩之論難林一作臨括囊大典網羅衆家仲長統以周禮為經禮記為禮之傳賈公彦曰按書傳周公一年救亂二年伐商三年踐奄四年建侯衞五年營成周六年制禮作樂七年致政成王所制之禮即今周禮也以設位言之謂之周官以制作言之謂之周禮兵刑之官分為二禮樂之官合為一略天地詳人事後之言治者必稽焉後儒林傳中興鄭衆傳周官經後馬融作周官傳授鄭玄玄作周官注列傳賈逵作周官解故遷衞士令故事之指意張衡著周官訓詁崔瑗謂不能異諸儒鄭玄答臨孝存周禮難趙岐讀周官二義不通一往造馬融本傳注晉儒林傳陳邵泰始中為燕王師撰周禮評甚有條貫范宣著禮易論難烈女傳韋逞母宋氏傳周官音義隋志馬融鄭玄王肅伊說干寶注周官禮各十二卷崔靈恩集注二十卷晉司空長史陳邵撰周官禮異同評十二卷孫略撰周官禮駁難四卷梁有周官駁難三巻孫崎問干寶駁晉散騎常侍虞喜撰劉儁禮記評十一卷詩正義馬融為周禮注云欲省學者兩讀故具載本文然則後漢以來始就經為注齊書文惠太子鎮雍州有盜發楚王冢獲竹簡書青絲編一作綸簡廣數分長二尺有得十餘簡以示王僧䖍僧䖍曰是科斗書考工記周官所闕文也梁陸倕謂周官為羣經源本惟沈峻精此書漢后氏曲臺記禮記章句禮略月令章句儒林傳孟卿事蕭奮以授后蒼蒼說禮數萬言號曰后氏曲臺記授梁戴徳戴聖慶普七略曰宣帝時行射禮博士后蒼為之辭至今記之曰曲臺記古服䖍曰在曲臺校書著記因以為名師曰曲臺殿在未央宫由是禮有大小戴慶氏之學髙堂生之後傳禮者五至二戴其學始盛蕭奮孟卿后蒼二戴慶普藝文志曲臺后蒼九篇注如淳曰行禮射於曲臺后蒼為記故曰曲臺記漢官曰大射于曲臺晉灼曰天子射宫也西京無太學於此行禮隋志河間獻王得仲尼弟子及後學者所記一百三十一篇至劉向考校經籍纔獲百三十篇第而叙之又得明堂陰陽記三十三篇孔子三朝記七篇王氏史記二十一篇樂記二十三篇凡五種合二百十四篇戴徳刪繁重合為八十五篇大戴記戴聖又刪為四十六篇一云四十七篇為小戴記馬融又益月令明堂位樂記合四十九篇曲禮至四制尼中庸子思緇衣公孫子月令吕不韋士王制漢文時博所錄後橋玄傳七世祖仁從戴徳學著禮記章句四十九篇號曰橋君學成帝時為大鴻臚曹褒傳慶氏學褒撰漢禮又傳禮記四十九篇儒林傳景鸞撰禮内外記號曰禮略又作月令章句所著述五十餘萬言中興有大小戴博士漢大戴禮隋志唐志同大戴禮記十三卷隋志夏小正别為卷唐志無小正之别書目今所存止四十篇其篇第始三十九編次不倫崇文目十卷三十五篇篇又一本三十三史記索隠大戴禮合八十五篇其四十七篇亡存三十八篇序曰今大戴篇始三十九終八十一當為四十三篇缺者四篇重出一篇其上不見者猶三十八篇不能合八十五篇之數豈但為八十一邪哀公問投壺二篇與小戴書無異禮祭篇與經解不同曾子大孝篇與祭義相似則戴聖已取之篇也勸學禮三本見於荀卿子取舍之說及保傅見於賈誼疏間與經子同者尚多有之其探索陰陽窮析物理推本性命雜言禮樂器數必有自來以是知聖門之學無不備也始於主言命終於易本詩正義大戴禮遺逸之書文多假託不立學官世無傳者漢禮博士儒林傳贊武帝立五經博士禮后后蒼通詩禮為博士孝宣立大小戴禮平帝時立逸禮劉歆哀帝時建立聖號小戴以博士論石渠禮有大小戴慶氏之學大戴授徐良斿卿為博士小戴授橋仁楊榮由是大戴有徐氏小戴有橋楊之學後傳凡十四博士禮大小戴二前書大小戴慶氏禮三家為博士藝文志三家立於學官中興後亦有大小戴博士雖相傳不絶未有顯於儒林者董鈞習慶氏禮永平初為博士曹褒傳父充持慶氏禮建武中為博士作章句辯難於是遂有慶氏學褒拜博士作通義十二篇演經雜論百二十篇又傳禮記四十九篇慶氏學遂行於世晉賀循慶普之後尤精禮傳周官王莽時劉歆置博士漢逸禮劉歆傳歆欲立逸禮列於學官移書太常博士曰魯恭王得古文於壞壁逸禮有三十九天漢之後孔安國獻之孝成得此三事以考學官所傳儒林傳平帝時又立逸禮元始五年正月召天下通逸經古記者禮記正義漢志云漢興始於魯淹中得古禮五十七篇其十七篇與今儀禮正同其餘四十篇藏在秘府謂之逸禮其投壺禮亦此類也又六藝論曰漢興髙堂生得禮十七篇後孔壁得古文禮五十七篇其十七篇與前同而字多異朱氏曰儀禮存者十七篇其逸見他書者猶有投壺遷廟釁廟中霤等篇其不可見者又有古經增多三十九篇而明堂陰陽王史氏記數十篇又河間王所輯至五百餘篇儻或有逸在其間者曲禮少儀内則玉藻弟子職篇所記皆禮之微文末節周禮疏半璧曰璜者逸禮記文大宗伯烝嘗之禮有射豕者據逸烝嘗禮而知射人記月令注王居明堂禮正義云逸禮篇名凡祭五祀於廟用特牲有主有尸皆先設席于奧正義云皆中霤禮行在廟門外之西正義云皆中霤禮文泉水正義有中霤之禮禮記注亦引逸禮義記奔喪正引逸禮王制疏逸禮云皆升合於太祖文選注逸禮曰三皇禪云云五帝禪亭亭論衡宣帝時河内女子壞老屋得佚禮後漢輿服志注引逸禮王度記蔡邕明堂論引禮記保傅篇古大明堂之禮王居明堂之禮大學志昭穆篇月令記通典引逸禮本命篇天官内宰注引天子巡狩禮聘禮注引朝貢禮覲禮注引朝事儀詩正義引雜問志云天子巡狩禮無六軍之文漢書引禮明堂記曰周公朝諸侯於明堂賈誼傳引學禮論衡案禮記瑞命篇禮記正義案大戴禮釁廟篇荀子引聘禮志漢禮器制度漢制度附周禮凌人注漢禮器制度云云疏叔孫通前漢時作髙祖詔叔孫通制作儀品十六篇多得古之周制故鄭君依而用之縫人注亦引之典瑞注漢禮瓚槃疏此漢禮器制度文叔孫通所作弁師疏凡冕體周禮無文叔孫通作漢禮器制度取法於周今取彼以釋之籩人疏鄭知籩器者亦依漢禮器制度匠人疏牛鼎之扄長三尺膷鼎之扄長二尺亦漢禮器制度梓人疏禮器制度云觚大二升觶大三升儀禮士冠禮疏案禮器制度弁冕聘禮疏以韋衣木板飾以三色再就者依漢禮器制度而知昏禮疏案漢禮器制度洗之所用士用鐵大夫用銅諸侯用白銀天子用黄金也案禮器制度尊卑皆用金罍記王制疏凡冕之制皆玄上纁下案漢禮器制度廣八寸長尺六寸明堂位疏周之璧翣垂五采羽於下樹於簨之角上者案漢禮器制度而知禮器疏壺大一石瓦甒五斗者漢禮器制度文書益稷疏柷敔之狀經典無文漢禮器制度其說皆然詩行葦疏漢禮器制度注勺五升徑六寸長三尺有瞽疏亦引之春秋疏漢禮器制度云冕長尺六寸兩漢諸儒去古未遠己不能盡識三代遺制凡冕服車旗類以漢禮制度為據其所臆度者無以名之則曰猶今某物然孔賈疏義又謂去漢久遠雖漢法亦不可考後漢書光武紀注漢制度曰帝之下書有四建武元年又曰漢禮制度曰人君之居前有朝後有寢輿服志注漢制度曰戎立車以征伐百官志注胡廣漢制度曰特進在三公下禮儀志注謝沈書曰太傳胡廣博綜舊儀立漢制度蔡邕依以為志譙周後改定以為禮儀志儒林傳序注胡廣漢制度曰天子岀有大駕法駕小駕漢中庸說志中庸說二篇注師古曰今禮記有中庸一篇亦非本禮經蓋此之流漢石渠禮論隋志石渠禮論四卷戴聖撰梁有羣儒疑義十二卷戴聖撰前漢傳聖以博士聞人通漢以太子舍人論石渠志議奏三十八篇石渠後志注石渠論曰鄉射合樂而大射不何也韋玄成曰鄉人本無樂故合樂以同其義禮儀志玄冠朝服戴聖曰玄冠委貌也朝服布上素下緇帛帶素韋韠輿服志王制正義石渠論白虎通云周以后稷文武特七廟張融以石渠論證七廟詩既醉正義石渠論云周公祭天用大公為尸通典漢石渠議曰鄉請射告主人樂不告何也戴聖曰請射告主人者賔主俱當射也樂所以樂賓也故不告宣帝甘露三年三月黄門侍郎臨奏經曰鄉射合樂大射不何也戴聖曰鄉射合樂者質也大射人君之禮儀多故不合樂也聞人通漢曰鄉射合樂所以和百姓也大射不合樂者諸侯之禮也韋玄成曰鄉人本無樂故合樂所以和百姓而同其意諸侯當有樂故不云合樂時公卿以玄成議是又繼宗子議引石渠禮議曰經云宗子孤為殤言孤何也聞人通漢戴聖云云漢三禮目錄解詁後儒林傳鄭衆傳周官經後馬融作周官傳唐志十二卷授鄭玄玄作周官注玄本習小戴後以古經校之取其義長者為鄭氏學又注小戴所傳禮記四十九篇通為三禮焉玄注儀禮禮記又著魯禮禘祫義答臨孝存周禮難盧植傳熹平四年拜九江太守作尚書章句三禮解詁時始立太學石經以正五經文字植上書曰少從通儒馬融受古學頗知今之禮記特多回穴臣前以周禮諸經發起粃繆敢率愚淺為之解詁願得將能書生二人詣東觀專心研精合尚書章句攷禮記失得庶裁定聖典刋正碑文古文科斗近於為實而厭抑流俗降在小學中興通儒班固賈逵鄭興父子並悅之今毛詩左氏周禮各有傳記與春秋相表裏宜置博士為立學官以廣聖意歲餘拜議郎校五經元行冲曰小戴禮行於漢末馬融為傳盧植合二十九篇為之解世所不傳隋志北中郎將盧植注禮記十巻注詩疏引盧植禮記馬融傳注三禮隋志今周官六篇古經十七篇小戴記四十九篇凡三種唯鄭注立國學鄭玄撰三禮目錄一卷梁有陶弘景注一卷亡正義每篇案鄭目錄唐志鄭玄注小戴禮記二十卷盧植注卷同又禮議二十卷注周官十三卷注儀禮十七卷漢周禮解詁又見上禮疏馬融傳云杜子春永平之初年且九十能通其讀頗識其說鄭衆賈逵往受業焉衆逵洪雅博聞又以經書記轉相證明為解逵解行於世衆解不行然衆時所解說近得其實獨以書序言作周官則此周官也失之矣逵以為六鄉大夫則冢宰以下及六遂為十五萬亘千里之地甚謬焉云云謂之周官傳鄭玄序云世祖以來通人達士大中大夫鄭少彰名興及子大司農仲師名衆議郎衞次仲侍中賈君景伯南郡太守馬季長皆作周禮解詁又云玄竊觀二三君子之文章顧省竹帛之浮辭其所變易灼然如晦之見明其所彌縫奄然如合符復析斯可謂雅達廣攬者也二鄭者同宗之大儒今讚而辨之庶成此家世所訓也周禮古今文天官注嬪故書作賔疏言故書者鄭注周禮時有數本劉向未校之前或在山巖石室有古文考校後為今文古今不同鄭據今文注故云故書作賔天官注緌今禮家定作蕤今禮家定齎作資桓譚新論古秩禮記有五十六卷崇文目禮記字例異同一卷周禮三家天官疏周禮之内鄭康成所存注者有三家司農之外鄭衆字仲師又有杜子春鄭大夫大夫者鄭少贛二鄭皆康成之先故言官不言名字杜子春非已宗故指其名也後輿服志注引鄭衆周禮傳魏三禮解王肅傳肅善賈馬之學而不好鄭氏采會同異為尚書詩論語三禮左氏解肅父朗字景興著易春秋孝經周易傳肅撰定皆列學官隋志王肅注周官禮十二卷儀禮十七卷禮記三十卷劉昌宗禮音一卷三禮大義宗略隋志三禮大義十三卷又四卷雜大義三卷北史後魏劉獻之撰三禮大義四巻沈重著周禮義三十一卷儀禮義三十五卷禮記義三十卷李公緒禮質疑五卷南史梁戚衮撰三禮義記禮記義四十卷簡文禮大義二十卷唐志十卷唐志元延明三禮宗略二十卷隋志元延明五經宗略二十三卷後魏盧辯以大戴禮未有解詁乃注之晉禮通論儒林傳董景道字文博三禮之義專遵鄭氏著禮通論非駁諸儒演廣鄭㫖范隆著三禮吉凶宗紀晉禮博士荀崧傳元帝踐祚太興初周官禮記鄭氏置博士崧上疏曰儀禮一經所謂曲禮鄭玄於禮特明皆有證據宜置鄭儀禮博士一人宋新撰禮論宋書傳隆傳元嘉十四年為太常太祖以新撰禮論付隆隆上所見五十二事表曰髙堂生頗識舊義師資相傳共枝别幹聞人二戴俱事后蒼俄已分異盧植鄭玄偕學馬融人各名家隋志梁有宋傅隆議二卷祭法五卷宋徐廣禮論答問八卷百餘條史記禮書取荀卿禮論宋何承天禮論傳先是禮論有八百卷承天刪減并合以類相從為三百卷何佟之讀禮論三百篇畧皆上口周續之通毛詩六義及禮論王儉抄寫八帙又别抄條目為十三卷朝儀舊典晉宋來施行故事撰次無遺宋志引禮論輿駕議隋志宋御史中丞何承天撰禮論三百卷唐志云三百七卷庾蔚之禮論鈔二十卷王儉撰禮論要鈔十卷賀瑒要鈔一百巻任預禮論條牒十卷大司樂疏按條牒論云郊特牲疏案條牒論稷壇在社壇西禮論帖三卷邱季彬論五十八卷亡南史梁孔子祛續承天禮論一百五十卷文中子禮論二十五篇十卷樂論二十篇十卷董常曰夫子以禮論樂論為敎化唐會要聖厯元年張齊賢議案禮論王珉范甯等議有明堂每月告朔之禮王方慶云晉末禮樂掃地無復舊章軍國所資臨事議定宋何承天纂集其文為禮論隋大業中命學士撰江都集禮抄撮禮論更無異文會昌六年五月禮儀使奏按禮論晉太常賀循云廟以容主為限無拘常數隋志梁有齊荀萬秋抄略二卷禮答問有徐廣二卷梁十一卷庾蔚之六卷王儉三卷何佟之十卷禮雜問有范甯十卷何佟之禮雜問答抄一卷梁有晉吳商禮難十二卷雜議十二卷又禮議雜記故事十三卷宋傳隆議二卷緱氏禮記要鈔一卷隋辛彦之撰禮要宋禮記義疏隋志禮記新義疏二十卷賀瑒撰梁有義疏三巻宋雷肅之撰義疏九十九卷講疏四十八卷皇侃撰義疏四十卷沈重撰義十卷何氏撰義證十卷劉芳撰北史又周官儀禮義證各五巻經典序錄梁皇侃撰禮記義疏五十卷禮記釋文引隠義云梁禮統中庸講疏唐志賀述禮統十二卷又有禮統郊祀六巻班固傳注引禮統隋志梁武帝禮記大義十卷中庸講疏一卷大同十年張綰朱异賀琛述制㫖禮記中庸義祛武帝撰講疏及孔子正言使孔子檢閲羣書以為義證梁有儀曹郎邱季彬論五十八卷議一百三十卷疏六卷亡宋戴顒中庸傳二卷梁三禮義宗唐志崔靈恩周官集注二十卷南史傳四十卷又三禮義宗三十卷傳云四十七卷與今不同南史三十卷梁傳靈恩徧習五經尤精三禮三傳陸詡習靈恩三禮義唐會要王方慶云梁崔靈恩撰三禮義宗但捃摭前儒因循故事書目梁天監中國子博士崔靈恩撰三十卷其書合周禮儀禮禮記諸儒之說敷繹其義凡一百五十六篇義宗始於明天地以下歲祭終於明周禮儀禮禮記廢興義之慶厯中髙陽許聞誨為序唐儒學傳孔穎達闇誦三禮義宗隋江都集禮惰潘徽江都集禮序十二帙一百二十卷明堂曲臺之記南宫東觀之說鄭王徐賀之答崔譙何庾之論簡牒雖盈菁華蓋鮮東探石簣之符西蠧羽陵之簡佃漁六學網羅百氏沛王通論寧朔新書不獨擅於前修崇文緫目一百四卷續書目五十巻魏杜恕傳注杜氏新書曰杜寛刪集禮記及左氏傳解今存于世唐六十九家禮藝文志經錄四曰禮類六十九家九十六部一千八百二十七卷失姓名七家始於大戴禮記終於王玄度注禮記若馬融傳玄陳邵干寶伊說崔靈恩則周官之學也若盧植鄭小同李軌尹毅徐邈爰戴顒射慈孫炎業遵劉儁庾蔚之何佟之皇侃熊安生劉芳孔穎達魏徵則小戴記之學也若袁凖孔倫陳銓蔡超宗田僧紹之注杜預賀循王逡之崔游蔡謨趙成沈文阿諸家之禮服則儀禮之學也學兼三禮則有鄭玄王肅之音注目錄崔靈恩元延明之義宗宗略夏侯伏明之圖賈公彦之義疏學兼二禮則有司馬伷之新書沈重王玄度之義疏决注論議問答則有徐廣范甯董勛吳商何承天顔延之任預王儉荀萬秋傅隆梁武帝周捨戚夀賀瑒述之流不著錄者十六家元行冲類禮義疏至張頻禮粹一百九十五卷有刋定月令外傳繩愆正義問答精義字例異同名義及李敬玄之論張鎰之圖陸質之類禮丁公著之禮志杜肅之禮略隋志一百三十六部一千六百二十二卷崇文目三十三部一千九十七卷周禮至諡法中興目四十三家七百九十八卷續書目十二家十六部四百六十三卷通典禮經章句名數尤繁諸家解釋注疏統雜唐禮記正義周禮疏儀禮疏志禮記正義七十卷祭酒孔穎達司業朱子奢國子助敎李善信太學博士賈公彦柳士宣范義頵魏王㕘軍事張權等奉詔撰周玄達趙君贊王士雄趙弘智等覆審宋朝祭酒邢昺等奉詔是正正義序大小二戴共氏而分門王鄭兩家同經而異注晉宋逮周隋傳禮業者江左尤盛注禮記者六家鄭玄盧植王肅孫炎業遵庾蔚之又鄭小同義記四卷何佟之義十卷又有李軌尹毅徐邈徐爰射慈音為義疏者南人有賀循賀瑒庾蔚崔靈恩沈重皇侃等唐志皇侃禮記講疏一百巻又義疏五十巻沈重周禮義疏四十卷又禮記義疏四十巻庾蔚之禮記略解十卷閣南史皇侃撰禮記講疏五十巻奏之詔付祕梁武召入夀光殿說禮記義北人有徐遵明李業興李寶鼎侯聰熊安生等志熊安生義疏四十巻北史安生撰周禮義疏二十卷禮記義疏三十巻劉炫受禮於熊氏褚輝撰禮疏一百卷其見於世者唯皇熊二家熊則多引外義皇氏雖章句詳正時乖鄭義今據皇氏以為本其有不備以熊氏補焉隋儒林傳曰南人約簡得其英華北學深蕪窮其枝葉光馬光傳山東三禮學者自熊安生後唯宗一人志賈公彦禮記正義八十卷周禮疏五十卷儀禮疏五十卷舊史四十卷注公彦事張士衡撰次章句甚多為太學博士儀禮鄭後有黄慶李孟悊二家疏義慶舉大略小悊舉小略大經注稍周時之所尚李則為先公彦據以為本增損以己意同李元植裁定為疏王方慶禮經正義十巻不著錄唐三禮義證儒學傳王恭貞觀初為太學博士講三禮為義證甚精博蓋文懿文達每講徧舉先儒義而必暢恭所說唐類禮又見後舊史魏徵以戴聖禮記編次不倫遂為類禮二十卷以類相從削其重復採先儒訓注擇善從之研精覃思數年而畢太宗覽而善之賜物千段錄數本賜太子諸王仍藏祕府唐五禮精義志韋彤五禮精義十巻書目十卷太常博士韋彤撰凡二百九十二條每條設問對先援古禮參以唐制辨據為詳儒學傳大厯時仲子陵袁彞韋彤韋茝以禮皆自名其學彤徳宗時為太常博士貞元十三年與裴堪議朔望食之禮唐禮記外傳志成伯璵禮記外傳四卷書目四卷中山成伯璵撰吳郡張㓜倫注四門博士劉素明序凡一百一十條分義例名數二體又各分上下卷雖舉禮記為目實兼三禮言之義例二卷五十篇名數二卷六十九篇太平御覽引外傳唐禮記異同志禮記字例異同一卷元和十三年詔定又邱敬伯五禮異同十卷崇文目五禮名義十卷唐禮略志杜肅禮略十卷隋志禮略二巻失姓名書目十卷丁公著序採古經義下逮當世禮文沿革莫不附見詞約理備故題禮略唐禮志禮粹禮論禮繩愆志丁公著禮志十卷張頻禮粹二十卷李敬玄禮論六十巻敬玄該覽羣籍尤善於禮撰次禮論及他書數十篇王元感禮繩愆三十巻長安中上之宋朝何洵直禮論一卷十篇聘問至虞祔唐三禮圖志張鎰九卷夏侯伏明十二卷藝術有禮圖雜畫五十六卷隋志三禮圖九巻鄭玄及後漢侍中阮諶等撰又有周官禮圖十四巻法周禮疏引之堂後漢何敞傳注案禮圖注云法冠執者服之明位疏案禮圖云引春秋疏阮諶舊史張鎰為豪州刺史撰三禮圖九卷五經微㫖十四卷孟子音義三卷建隆三禮圖詳見圖類書目三禮圖二十巻聶崇義周顯徳中參定郊廟器玉因博采先儒三禮舊圖凡得六本考正是否繢素而申釋之每篇自叙其凡參以近世㳂革之說建隆二年五月丙寅表上之竇儼為序詔太子詹事尹拙集儒學三五人更同參議拙多所駁正崇義復引經以釋之其駁議及答義各四卷率列於註釋詔頒行之又畫於國子監講堂之壁竇儼裁定共分十五巻余希文撰井田王制圖一卷凡三十有二圖陸佃禮象十五卷救舊圖之失三禮圖駁議二十卷不知作者疏駁崇義舊圖然互有得失崇文目三禮圖九卷梁正撰二十卷崇義撰會要尹拙聶崇義復上祭玉鼎釜異同之說詔尚書省集議吏部尚書張昭等曰四部書目有三禮圖十三卷題曰梁氏鄭氏今書府有三禮圖亦題梁鄭後有梁氏者集前代圖記更加評議題三禮圖曰阮諶受禮學於綦母君取其說為圖三卷多不案禮文而引漢事與鄭君之文違錯禮圖之内亦無改祭玉之說宜依白虎通義宗為定詔從昭議雍熙禮選贊四年八月己酉諸王府侍讀實錄云侍講邢昺進分門禮選二十一巻長編云二十卷賜銀器二帛三十太宗探得其帙得文王世子篇甚悅問衞欽緒曰昺為諸王講書曾及此乎曰諸王嘗訪昺經誼每發明君臣父子之道太宗益喜後真宗因内閣曝書覽而稱善召昺同觀作禮選贊賜之以示近臣實錄祥符三年五月乙巳上作禮選贊賜翰林侍讀學士邢昺昺言家無遺藁願得副本繕錄未竟而昺卒六月詔寫二本賜昺家咸平禮記疏二年六月己巳祭酒邢昺上新印禮記疏七十卷賜諸王輔臣人一本六年八月勑雕印周禮正義頒行景徳元年七月癸未朔賜諸王宗室近臣新印周禮疏景徳崇和殿尚書禮記圖中庸九經圖見圖類中庸曰凡為天下國家有九經所以行之一也九經修身尊賢親親敬大臣體羣臣子庶民來百工柔遠人懐諸侯天下國家之本在身故修身為九經之本然必親師友然後修身之道進故尊賢次之道之所進莫先其家故親親次之由家以及朝廷由朝廷以及其國由其國以及天下此九經之序也敬大臣體羣臣則自尊賢之等推之子來柔懐則自親親之殺推之修身之至然後當理而無悖九經其實不出三者一者誠也一有不誠則九者為虚文熙寧新經周禮義晁氏志王安石撰二十二卷熙寧中設經義局安石自為周官義十餘萬言不解考工記安石以其書理財者居半愛之如行青苗之類皆稽焉所以自釋其義者蓋以其所創新法盡傅著之務塞異議者之口其黨紹述期盡行之久之禍難並起劉彝撰中義八卷王昭禹撰詳解四十卷宗王氏楊時撰辨疑一卷攻安石之書樂思忠攷疑七卷戴溪為序易袚總義三十卷周禮致太平論李泰伯撰五十一篇并序内治七國用十六軍衞四刑禁六官人八敎道九為十卷叙曰昔劉子駿鄭康成皆以周禮為周公致太平之迹又有平土書禮論元祐禮書儀禮注解禮圖書目禮書一百五十卷陳祥道撰繪其物而辯論之凡歴代諸儒之說及近代聶氏之圖或正其失或補其闕於禮學為詳元祐四年翰林學士許將言祥道增廣禮圖及著禮書一百卷二月二日詔祥道為太常博士五年十一月范祖禹言請付太常與聶崇義圖參用詔付兩制看詳八年正月二十二日侍讀學士范祖禹言太常博士陳祥道注解儀禮三十二卷精詳博洽乞下兩制看詳并所進禮圖付太常以備禮官討論從之祥道又有禮記講義二十四卷禮例詳解十卷弟暘樂書二百卷政和禮記解義三年方慤進二十卷自為之序以王氏父子獨無解義乃取三經義及字說申而明之著為此解馬希孟禮記解七十卷朱子曰方馬二解儘有好處不可以其新學而黜之陸佃撰禮記新義張載說三卷吕大臨芸閣禮記解十卷陳祥道講義二十四卷胡銓傳十八卷李格非精義十六卷衞湜集說一百六十卷寶慶二年十月上淳熙大學章句中庸章句朱文公熹撰淳熙十六年二月甲子序大學章句三月戊申序中庸章句二書各有或問中庸又有輯略紹熙五年閏月戊午朔講盤銘古禮經傳通解朱文公熹以儀禮為經取禮記及諸經史書所載附本經之下具列注疏諸儒之說為經傳通解二十二卷家禮五一鄉禮三禮學禮十邦國四集傳集注十四卷王朝禮十四喪祭二禮屬之門人黄榦類次黄榦集喪祭禮為儀禮通解續二十九卷文公曰周官一書固為禮之綱領至儀法度數儀禮乃其本經而禮記郊特牲冠義等篇乃其義疏紹熙周禮説三年吏部郎陳傅良進以格君心正朝綱均國勢為目目各四篇周禮微言續書目徐筠學周官於陳傅良記所口授成書十卷自謂聞於傅良曰周禮綱領有三養君徳正紀綱均國勢鄭氏注誤有三王制漢儒之書今以釋周禮司馬法兵制也今以證田制漢官制皆襲秦今引漢官以比周官其誤三也陳傅良徐元徳撰周官制度精華二十卷周官講義十四卷史浩為建王府直講時撰止於地官司闗林之竒講義三十九卷端平大學衍義元年十月二日侍讀真徳秀進上謂有補治道十四日讀大學章句畢令進讀序曰大學一書君天下者之律令格例也朱熹為章句或問析其義寧皇初以此書進講臣思所以羽翼是書剟取經文二百五字載于是編先以帝王為治之序為學之本格物致知之要明道術辨人材民審治體察情誠意正心之要崇敬畏戒逸欲修身之要謹言行正威儀齊家之要重妃匹定國本嚴内治敎戚屬四者之道得則治國平天下在其中矣每條首以聖賢明訓參以前古事蹟前列二者之綱後分四者之目以推衍大學之義而目之中又有細目焉凡四十三卷表曰惟大學設八條之敎為人君立萬世之程首以格物致知示窮理乃正心之本推於齊家治國見修己為及物之原實東魯教人之微言迺南面臨民之要道淳祐中御製中庸大學贊禮者其本在於養人之性其用在於視聽言動之間將以宅天衷奠民極豈形器云乎哉河間二戴保殘守缺以開來學玉海卷三十九
