  text: 玉海卷一百九十三卷四十七欽定四庫全書
  hash: sha256:b02a5ac6b7416dc0cda341a73f1705a58c3ddb861f13ef0a43a57707cdf4644b
  markers:
  - {type: page-break, offset: 12, content: '', id: KR3k0032_WYG_047-1a, image: WYG0944/WYG0944-0272a.png}
body:
  text: 玉海卷四十七宋王應麟撰藝文雜文古者史官其書有法大事書之䇿小事簡牘至於風俗之舊耆老所傳遺言逸迹史不及書則傳記之説或有取焉然自六經之文諸家異學説或不同况乎幽人處士聞見各異或詳一時之所得或發史官之所諱參求考質可以備多聞焉漢志前厯志見三統漢洞厯吳洞紀論衡會稽周長生文士之雄也作洞厯十卷上自黃帝下至漢朝鋒芒毛髮之事莫不紀載與太史公表紀相似類也上通下達故曰洞厯長生非徒文人所謂鴻儒也超竒篇吳志韋昭傳世間有古厯注其所紀載既多虛無在書籍者亦復錯謬因尋按傳記考合異同采托耳目所及以作洞紀起自庖犧至於秦漢凡為三卷當起黃武以來别作一卷事尚未成唐志韋昭洞紀四卷周植洞厯記九卷莊子音義引洞紀雜史吳厯六卷隋志韋昭洞紀記包羲以來至漢建安二十七年臧榮緒續一卷南史庾詵撰帝厯二十卷漢劉向戰國䇿漢志春秋家戰國䇿三十三篇記春秋後隋志雜史三十四卷劉向録二十一卷髙誘注漢初得之蓋戰國遊士記其策謀唐志三十二卷髙誘注延篤論一卷司馬遷傳采戰國策史記所采之事九十三索隱髙誘云六國時縱橫之説也一曰短長書亦曰國事劉向撰為三十三篇名曰戰國策非遷時已名劉向校書録敘所校中戰國策書莒又有國别者八篇臣向因國别者略以時次之分别不以序者以相補除復重得三十三篇中書本號或曰國策或曰國事或曰短長或曰事語或曰長書或曰修書蜀志李權從秦宓借戰國策宓曰戰國反覆儀秦之術殺人自生亡人自存經之所疾史通其篇有東西二周秦齊燕楚三晉宋衛中山合十二國東西周各一秦五齊六楚趙魏各四韓燕各三宋衛中山二宋朝曽鞏重校序録曰劉向定二十三篇崇文總目稱十一篇者闕臣訪之士大夫家始得其書正其誤謬而疑其不可考者然後三十三篇復完敘曰法者所以適變也不必盡同道者所以立本也不可不一此理之不可易者故孔孟守此戰國之遊士不知道之可信而樂於説之易合故論詐之便而諱其敗言戰之善而蔽其患其相率而為之者莫不有利焉而不勝其害也有得焉而不勝其失也漢應奉漢事漢書後序荀爽漢語應奉傳著漢書後序多所述載注袁山松書曰奉又刪史記漢書及漢記三百六十餘年自漢興至其時凡十七卷名曰漢事子邵著中漢輯序隋志儒家梁有後序十二卷後漢司隸校尉應奉撰雜家梁有洞序九卷録一卷應奉撰荀爽傳集漢事成敗可為鑒戒者謂之漢語史記文紀注晉灼引漢語索隱曰書名荀爽所作舊唐志後漢雜事十卷雜史帝王要略隋志雜史十二卷環濟撰紀帝王及天官地理帝王世録一卷甄鸞撰帝王諸侯世略十一卷帝王本紀十卷來奧撰十五代略十卷吉文甫撰起庖犧至晉後漢以來學者多鈔撮舊史自為一書或起自人皇或斷之近代亦各其志而體制不經唐志賈匪之漢魏晉帝要紀三卷魏晉世語隋志雜史十卷晉郭頒撰魏志注引之唐志作代説三國總略宋元嘉十四年河西獻周生子十三卷時務論十二卷三國總略二十卷俗問十一卷十三州志十卷四科傳四卷漢皇德傳二十五卷魏駮九卷古今字二卷至孔子讃一卷合一百五十四卷劉延眀以三史文繁著略記百三十篇八十四卷梁通史唐志梁武帝通史六百二卷隋志四百八十卷起三皇訖梁史通梁武敕其羣臣上自太初下終齊室為通史六百二十卷其書自秦以上皆以史記為本而别採他説以廣異聞至兩漢以還則合録當時紀傳而上下通達臭味相依又吳蜀二主皆入世家五胡及拓跋氏列於夷狄傳大抵其體皆如史記其異者惟無表而已吳均傳武帝召均使撰通史起三皇訖齊代均草本紀世家已畢唯列傳未就顧野王撰通史要略百卷左史隋志雜史左史六卷李槩撰晉書鴻烈隋志雜史六卷張氏撰唐十三類史録藝文志乙部史録其類十三一曰正史類二曰編年類三曰偽史類四曰雜史類五曰起居注類六曰故事類七曰職官類八曰雜傳記類九曰儀注類十曰刑法類十一曰目録類十二曰譜牒類十三曰地利類凡著録五百七十一家八百五十七部一萬六千八百七十四卷不著録三百五十八家一萬二千三百二十七卷正史類史記至隋書七十家九十部四千八十五卷有集史五家總七十三家六十九部編年類紀年至隋後略四十一家四十八部九百四十七卷偽史類華陽國志至三十國春秋一十七家二十七部五百四十二卷雜史類古文瑣語至三國典略八十八家一百七部一千八百二十八卷起居注類穆天子傳至唐創業起居注六家三十八部一千二百七十二卷有實録二十八部詔令十一部總七家七十七部故事類秦漢舊事至南宮故事十七家四十三部四百九十六卷職官類漢官解詁至官卿舊事十九家二十六部二百六十二卷雜傳記類三輔決録至詞林文人傳一百二十五家一百四十六部一千六百五十六卷有女訓十七家總一百四十七家一百五十一部儀注類漢舊儀至大唐書儀六十一家一百部一千四百六十七卷刑法類漢建武律令至開元格後敕二十八家六十一部一千四卷目録類劉向七略别録至羣書四録十九家二十二部四百六卷譜牒類世本至著姓略記十七家三十九部一千六百一十七卷地理類三輔黃圖至劎南地圖六十三家一百六部一千二百九十二卷六典祕書郎乙部為史其類一十有三一曰正史以紀紀傳表志史記等六十七部三千八十三卷二曰古史以紀編年繫事紀年等四十四部六百六十六卷三曰雜史以紀異體雜記周書等七十部九百十七卷四曰霸史以紀偽朝國史趙書等二十七部三百三十五卷五曰起居注以紀人君動止穆天子傳等四十一部一千一百八十九卷六曰舊事以紀朝廷政令漢武故事等二十部四百四卷七曰職官以紀班序品秩漢官解詁等二十部三百三十六卷八曰儀注以紀吉凶行事漢舊儀等五十九部二千二十九卷九曰刑法以紀律令格式律令等三十五部七百一十二卷十曰雜傳以紀先賢人物三輔決録等二百一十七部一千二百八十六卷十一曰地理以紀山川郡國山海經等一百三十九部一千四百三十三卷十二曰譜系以紀氏族繼序世本等四十一部三百六十卷十三曰略録以紀史䇿條目七略等三十部二百一十四卷舊志史録十三家八百四十四部一萬七千九百四十六卷唐南北史見正史朝氏志雜史唐集史五家志凡集史五家六部一千二百二十二卷髙峻以下不著録三家四百四十卷梁武帝通史六百二卷李延壽南史八十卷又北史一百卷二家五部七百八十二卷著録之書也髙峻小史一百二十卷劉氏洞史二十卷權姚康復統史三百卷唐八十八家雜史志史録其類十三四曰雜史八十八家一百七部一千八百二十八卷古文瑣語至三國典略夫姓名八家不著録六十八家八百六十一卷元行沖魏典至大和野史舊志雜史一百二部凡二千五百五十九卷史氏流别史通史氏流别其流十焉一曰偏記二曰小録三曰逸事四曰瑣言五曰郡書六曰家史七曰别傳八曰雜記九曰地理十曰都邑簿若陸賈楚漢春秋樂資山陽公載記王韶晉安紀姚梁後略此之謂偏記戴逵竹林名士王粲漢末英雄蕭世誠懷舊志盧子洪知己傳此之謂小録和嶠汲冡紀年葛洪西京雜記顧協瑣語一卷謝綽拾遺此之謂逸事劉義慶世説十卷裴榮期語林十卷孔思尚語録楊松玠談藪此所謂瑣言圈稱陳留耆舊周斐汝南先賢陳壽益部耆舊虞預會稽典録此之謂郡書揚雄家諜殷敬世傳孫氏譜記陸宗系譜此之謂家史劉向列女梁鵠逸民趙采忠臣徐廣孝子此之謂列傳祖台志怪干寶搜神劉義慶幽眀劉敬叔異苑此之謂雜記盛弘之荆州記常璩華陽國志辛氏三秦羅含湘中此之謂地理潘嶽關中陸機洛陽三輔黃圖建康宫殿此之謂都邑簿唐太宗勳史志雜史吳兢太宗勳史一卷崇文目同書目劉餗國史異纂三卷載齊梁以來雜事唐六代略志雜史李吉甫三十卷會要吉甫嘗綴録東漢魏晉元魏周隋故事記其成敗損益大端目為六代略凡三十卷舊史元和八年二月辛卯宰相吉甫進唐髙氏小史志一百二十卷髙峻初六十卷其子逈釐益之峻元和中人峻以歷代諸史鈔其要子逈分其卷第書目其書自天地未分至唐文宗凡十三代分十例司馬遷史至陳隋書附以唐實録纂其要唐統史志姚康復三百卷會要大中五年十一月大子詹事姚康復舊紀止云姚康撰統史三百卷上之獻帝王政纂十卷統史自開闢至隋末編年纂帝王美政善事詔令可列於時者必載至於時政鹽鐵榷鹽和糴賑貸錢陌兵數虛實儲糧用兵利害邊事戎狄無不備載下至釋道皆敘之唐統載册府元龜貞元十三年韓潭進統載三十卷其書採虞夏以來至周隋録其事迹善於始終者六百六十八人為立傳唐太和野史志雜史公沙仲穆太和野史十卷起大和盡龍紀會要龍紀中有處士沙仲穆纂野史十卷唐國史補志李肇國史補三卷述開元至長慶事以補史氏之缺林恩補國史十卷崇文目六卷三書日補國史六卷載德宗以後二十事其條目次第差互崇文目髙若拙後史補三卷書目同唐逸史志小説家髙彥休闕史三卷盧子史録卷亡又逸史三卷大中時人李隱大唐竒事記十卷雜史類杜信史略三十卷崇文目雜史唐補紀三卷唐三國典略中興書目二十卷唐汾州司戶參軍丘恱撰自元魏分而為東西西魏都關中後周因之東魏都鄴北齊因之梁陳則皆都江左悅之書首標西魏元而敘宇文泰按崇文總目云以關中鄴都江左為三國起西魏終後周而東包東魏北齊南總梁陳凡三十篇今本二十一以下缺舊史丘悅撰三國典略三十卷隋志魏魚豢撰典略八十九卷唐志魚豢魏略五十卷魏吳志注魏略吳略唐餘録唐載寶元二年十一月戊子朔尚書刑部郎直集賢院王皡上六十卷詔奬諭五代閏也故名唐餘録通鑑間亦采之書目六十卷王皡芟五代舊史旁採諸家小説倣裴松之國志附見於注梅堯臣奏所撰唐載二十六卷多補正舊史缺謬唐乘五代史略天聖五年十二月二十一日辛卯祕書監致仕胡旦上唐乘七十卷五代史略四十三卷演聖通論七十二卷將帥要略五十三卷詔以旦子彤為監簿景祐元年七月壬辰又上續演聖論王禹稱進五代史闕文一卷凡十七篇祥符中陶嶽撰五代史補五卷百餘條一本云嶽五代補録五卷得一百七事唐志五代紀國史志雜史王沿唐志二十一卷孫沖五代紀七十七卷史抄類賈昌朝通紀八十卷五代開皇紀天禧五年五月己丒太常慱士鄭向字公明表進五代開皇紀書目作記三十卷起梁訖周約八十萬言表言唐明宗祈天願早生聖人是五代閏紫實開皇朝也目曰開皇崇文目編年類五代亂亡史册多漏失向托拾遺事頗有補焉宋朝十史類要十卷皇朝李安上自戰國迄五代托其雜事以門類分次景祐兩漢類記四年二月辛亥都官郎中任辨上所著兩漢類記治平唐宋遺史書目唐宋遺史四卷治平四年詹玠撰唐機要三十卷劉直方撰唐書冗者刪闕者補重編史雋三十卷蓋君平撰初唐鄭暐著史雋十卷君平惜其漏略廣為三十卷治平十國志真宗時知制誥路振采五代僣偽吳楊行密唐李升前蜀王建後蜀孟知祥南漢劉隱北漢劉崇閩王潮楚馬殷吳越錢鏐九國君臣行事撰九國志以擬崔鴻十六國春秋為世家列傳四十九卷振字子發永州人其孫綸又增髙氏季興為十國志治平元年六月辛酉一十七日綸上之詔付史館九國志五十卷增荆南髙氏實十國也朝氏志云九國志五十一卷張唐英補為北楚書二卷合五十一卷唐英蜀檮杌十卷云外史檮杌以路振書未備今成此書補其遺路振祥符初使契丹撰乘軺録一卷以獻開寶中詔湯恱徐鉉撰江南録十卷陳彭年别録四卷太平興國五年八月甲戌以孟瑜為固始主簿瑜長沙人嘗著野史三十卷石熙載言於上而有是命錢儼吳越備史十五卷備史遺事五卷紹興通志二十略紹興二十八年二月乙巳鄭樵召對授迪功郎其所著通志令有司給扎寫進通志二百卷樵以歷代史册及采他書上自三皇下迄隋代通為一書倣遷固體為本紀列傳而改表為譜改志為略鄭樵通志總序總天下之大學術條其綱目名之曰略凡二十略生民之本在於姓氏男子稱氏以别貴賤女子稱姓以别婚姻臣今所推有三十二類故作氏族略書契之本見於文字獨體為文合體為字文有子母主類為母從類為子故作六書略字書眼學韻書耳學母主形子主聲故作七音略天文志有義無象今取丹元子步天歌句中有圖言下成象故作天文略凖禹貢之書而理川源本開元十道圖以續今古故作地理略梁汴四朝舊都為痛定之戒南陽中原新宅為無疆之基故作都邑略削去曲説作諡略制器尚象作器服略樂府正聲以眀風雅祀享正聲以眀頌以琴操眀絲竹以遺聲凖逸詩作樂略書籍散亡由編次無紀作藝文略校讎之司未聞其法作校讎略圖成經書成緯一經一緯錯綜成文古之學者左圖右書即圖以求易即書而求難乃立為二記曰記有記無作圖譜略方册者古人之言語款識者古人之面貌作金石略削去五行作災祥略參載籍眀品彚作昆蟲草木略凡十五略出臣胸臆禮略以敘五禮職官略以秩百官選舉略言掄材之方刑法略言用刑之術食貨略言財貨之源流五略雖本前人之典亦非諸史之文古者記事之史謂之志太史公更志為記今謂之志本其舊也桓君山曰太史三代世表旁行邪上並效周譜今復表為譜自春秋之前稱世謂之世譜春秋之後稱年謂之年譜二十略不用舊史之文紀傳即舊文損益唐書五代史皆本朝大臣所修非微臣所敢議故紀傳訖隋若禮樂刑政務存因革故引而至唐云紹興鮑氏國䇿十卷紹興中鮑彪編自劉向校定戰國䇿為三十三卷彪升其第二卷為首又自更定訓釋見前戰國䇿慶元續後漢書慶元間吉州布衣蕭常起昭烈章武元年辛丒盡少帝炎興元年癸未為四十二卷帝紀年表各二卷列傳十八卷吳載記十一卷魏載記九卷吳魏君臣並為載記列于後外有音義四卷周必大為序開禧中李杞改修三國志六十七卷尊昭烈後主為漢紀魏吳次之復有義例年譜各一卷編年榖梁傳曰春秋編年四時具而後為年上尊天時紀正人事司馬遷為紀傳表志之體其後史官悉用其法晉荀恱為漢紀復編年之體後世作者皆正史並行太古以來年紀漢志春秋家二篇禹本紀史記大宛傳禹本紀言河出崑崙崑崙其髙二千五百餘里日月所相避隱為光眀也其上有醴泉瑶池今自張騫使大夏之後窮河源惡睹本紀所謂崑崙者乎天子案古圖書名河所出山曰崑崙故言九州山川尚書近之矣至禹本紀山海經所有怪物余不敢言之也班固作張騫傳贊同水經崑崙墟在西北去嵩髙五萬里地之中也注禹本紀與此同楚漢春秋漢志春秋家九篇陸賈所記索隱曰記項氏與漢髙祖起及惠文間事隋志雜記九卷唐志同太史公述楚漢春秋接其後事禮樂志注師古引楚漢春秋髙祖之臣别有絳灌文選注引楚漢春秋漢世經律厯志世經首取郯子之論官名稽之於易包羲神農黃帝相繼之世可知因祭典而得共工氏之事因考德而得少昊之事因春秋外傳而得顓頊帝嚳之事因帝系而得堯舜禹湯之事以至因著紀而得漢之事因漢志而推太嵗之名論春秋戰國秦漢多及殷厯太昊首德始於木共工水德周人其行序炎帝火德黃帝土德少昊金德顓頊水德髙辛木德堯火德舜土德禹金湯水武王木漢繼周木生火為火德與夫嵗辰之所在統章之所至繼世之多寡載祀修短莫不見焉漢大年紀志春秋家五篇髙祖文帝武帝紀臣瓉注引漢帝年紀蓋即此書漢紀荀恱傳建安三年帝好典籍以班固書文繁難省令袐書監恱依左氏傳體為漢紀三十篇詔尚書給筆札辭約事詳論辨多美序曰夫立典有五志焉一逹道義二章法式三通古今四著功勳五表賢能漢四百有六載撥亂反正統武興文聖上惟文之恤命立國典於是綴序舊書以述漢紀中興以前眀主賢臣得失之軌足以觀矣又著崇德正論及諸論數十篇唐志編年類荀恱漢紀三十卷書目同應劭等注卷同崔浩音義三卷漢紀本凡七萬二千四百三十二字王莽一萬字乎書奏之嵗嵗在庚辰文中子曰荀恱史唐太宗賜李大亮曰恱此書敘致簡要議論深博極為政之體盡君臣之義書目凡漢紀其稱年本紀表志傳者史家本語也其稱論者恱所論粗表其大事以參得失也晉袁宏傳宏字彥伯撰漢紀三十卷隋唐志同書目晉東陽太守袁宏以後漢書煩穢又謝承華嶠諸家錯謬同異無所取正惟張璠紀言漢末事差詳故採而益之比諸家號為精密袁宏後漢紀序曰掇謝承司馬彪華嶠謝沈書漢山陽公記樂資十卷漢靈獻起居注獻帝五卷漢名臣奏旁及諸郡耆舊先賢傳凡數百卷班固源流周贍然因藉史遷無所甄眀荀恱才智經綸足為嘉史然名教之本帝王髙義韞而未敘今因前代遺事略舉義教所歸恱在班固之後宏在范曄之前唐志侯瑾漢皇德紀二十卷張璠後漢紀三十卷張緬後漢略二十七卷劉艾漢靈獻二帝紀六卷袁曄漢獻帝春秋十卷並編年張瑩漢南紀五十八卷正史藝文類聚引薛瑩漢紀漢皇德紀見傳類帝王要略見雜史漢表唐志雜史袁希之漢表十卷韓祐續古今人表十卷開元十七年上授太常大祝史記漢興以來將相名臣年表以大事為主所以觀君臣之職分也如髙帝元年大事記沛公為漢王之南鄭還定雍而相位書蕭何守漢中御史大夫位書周苛守滎陽班氏所書止於公卿拜罷月日削去大事不記司馬子長年表劉杳謂得法於周譜崔鴻亦倣其義例為十六國春秋晉竹書紀年古文官書束晳傳初太康二年汲郡人不凖盜發魏襄王墓或言安釐王冢得竹書數十車其紀年十三篇記夏以來至周幽王仍述魏事至安釐王之二十年蓋魏國之史書大略與春秋多相應其中經傳大異則云夏年多殷益干啓位太甲殺伊尹自周受命至穆王百年共伯和攝行天子事其易經二篇與周易上下經同易繇隂陽卦二篇與周易略同繇辭則異卦下易經一篇似説卦而異公孫假二篇假與邵陟論易國語三篇言楚晉事名三篇似禮記又似爾雅論語師春一篇書左傳諸卜筮師春似是造書者姓名瑣語十一篇諸國卜夢妖怪相書也梁丘藏一篇先敘魏之世數次言丘藏金玉事繳書二篇論弋射法生封一篇帝王所封大厯二篇鄒子談天類也穆天子傳五篇言周穆王遊行四海見帝臺西王母圖詩一篇畫贊之屬也又雜書十九篇周食田法周書論楚事周穆王美人盛姬事大凡七十五篇七篇簡書折壞不識名題冢中又得銅劍一枚長二尺五寸漆書皆科斗字文既殘缺不復詮次武帝以其書付必書校綴次第尋考指歸以今文寫之晳在著作得觀竹書隨疑分釋皆有義證晉紀咸寧五年冬十月汲郡人不凖得竹簡小篆古事十餘萬言藏祕府衛恆傳太康元年汲縣人得䇿書十餘萬言案敬侯所書猶有髣佛古書亦有數種其一卷論楚事者最為工妙王接傳時袐書丞衛恆考正汲冢書未訖佐著作郎束晳述而成之事多證異義時東萊太守王庭堅難之亦有義據晳又釋難接遂詳其得失續咸著汲冢古文釋十卷荀朂傳汲郡冢中得古文竹書詔朂次之以為中經列在祕書荀朂穆天子傳敘云太康二年太公碑同穆天子傳目録云傅瓉為校書郎中與朂同校定隋志紀年十一卷汲冢書并竹書同異一卷古史三十四部六百六十六卷始于紀年又雜史有古文璅語四卷汲冢書晉太康元年汲郡人發魏襄王冢一云安釐王得古竹簡書字皆科斗帝命中書監荀朂令和嶠撰次為十五部八十七卷唐志紀年十四卷崇文目不著録六中興書目止有第四第及雜事三卷下皆標云荀氏敘録一紀年二紀令應三雜事皆殘缺杜預左傳後序太康元年三月云云汲郡得古書科斗書久廢不能盡通所記大凡七十五卷多雜碎怪妄不可訓知周易及紀年最為分了周易上下篇與今同紀年起自夏殷周皆三代王事無諸國别唯特記晉國起自殤叔次文侯昭侯至曲沃莊伯莊伯十一年十一月魯隱元年正月也皆用夏正建寅之月為嵗首編年相次晉國滅獨記魏事下至魏哀王之二十年謂之今王蓋魏國之史記也文意大似春秋經足見古者國史䇿書之常也所記多與左傳符同又稱殷仲壬即位居亳亦當時雜記王隱晉書束晳傳太康元年汲郡得竹書漆字科斗之文周時古文也大凡七十五卷晉書有其目録其六十八卷皆有名題其七卷折簡碎雜不可名題有周易上下經二卷紀年十二卷瑣語十一卷周王遊行五卷説穆王遊行天下之事今謂之穆天子傳此四部差為整頓詔荀朂和嶠以隸字寫之史通凡此數事語異正經此書近出世人多不信也竹書説伊尹之事與書序大乖唐劉貺以竹書紀年序諸侯列會皆舉諡後人追修非當時正史如齊人殱千遂鄭棄其師皆孔子新意師春一篇録卜筮事與左氏合知按春秋經傳而為也因著外傳云中興書目汲冢師春一卷案杜預云純集疏左氏傳卜筮事今雜敘諸國世系及律呂諡法末載變卦雜事嘉祐中蘇洵編定六家諡法其表謂采汲冢師春者即此書所載諡法云顔之推云汲冢瑣語乃載秦望碑非夲文也書正義汲冢古文云盤庚自奄遷於殷紀年云殷仲壬即位居亳左傳攜王正義引汲冢書紀年云云東晢云案左傳云云水經注多引竹書紀年前漢地里注臣瓉引汲郡古文梁惠王發逢忌之藪以賜民陽太康居斟尋禹居城後東夷傳注竹書紀年曰后芬三年九夷來御吳都賦注引汲郡地中古文册書史記正義引竹書紀年韓愈黃陵廟碑引竹書紀年齊文惠太子鎮雍州有盜發楚王獲竹簡書青絲綸簡廣數分長二尺王僧虔曰是科斗書考工記晉帝王世紀皇甫謐傳謐以著述為務自號玄晏先生撰帝王世紀年厯髙士逸士烈女等傳玄晏春秋並重於世書目晉正始初安定皇甫謐撰以漢紀殘缺始博案經傳旁觀百家著帝王世紀并年厯合十二篇起太昊帝迄漢獻帝隋志皇甫謐十卷起三皇盡漢魏何茂林續帝王世紀十卷虞綽音四卷陽曄華夷帝王世紀三十卷甄鸞帝王世録一卷姚恭年厯帝紀三十卷唐志雜史皇甫謐帝王世紀十卷中興書目九卷闕周中一卷又年厯六卷何茂林帝王代紀十六卷厯紀十卷姚恭年厯帝紀二十六卷代譜四十八卷周武帝勑撰諸葛耽帝録十卷盧元福帝王編年録五十一卷共和以來甲乙紀年二卷並雜史春秋緯開闢至獲麟凡三百二十七萬六千嵗分為十紀大率一紀二十七萬六千年一云凡世七萬六百年小司馬氏補三皇本紀引帝王世紀及徐整三五厯唐志三五厯紀二卷鄭康成六藝論遂皇之後厯六紀九十一代至伏犧始作十二言之教漢晉春秋晉習鑿齒傳桓溫覬覦非望鑿齒著漢晉春秋以裁正之起漢光武終於晉愍帝於三國之時蜀以宗室為正魏武雖受漢禪晉尚為篡逆至文帝平蜀乃為漢亡而晉始興焉凡五十四卷唐志卷同又上疏謂晉宜越魏繼漢不應以魏後為三恪謹著論曰若以魏有代王之德則其道不足有靖亂之功則孫劉鼎立道不足則不可謂制當年當年不制於魏則魏未曽為天下之主王道不足於曺則曺未始為一日之王自漢末鼎沸五六十年吳魏犯順而強蜀人杖正而弱三家不能相一萬姓曠而無主夫有定天下之大功為天下之所推孰如見推於暗人受尊於微弱配天而為帝方駕於三代故舊之恩可封魏後三恪之數不宜見列以晉承漢功實顯然又何為虛尊不正之魏而虧我於大通哉隋志習鑿齒漢晉陽秋四十七卷孔舒元衍漢魏春秋九卷漢書注計書先上太史公副上丞相記事如古春秋敘傳序春秋考紀表志傳凡百篇王命論垂䇿書於春秋師古曰史書記事之總稱光武紀注范曄序例云帝紀略依春秋唐四十一家編年志史録編年類四十一家四十八部九百四十七卷失姓名四家始於汲冢書紀年終於張大素隋後略漢有荀恱侯瑾張璠袁宏張緬劉艾袁曄樂資習鑿齒之書而應劭崔浩漢紀音注附焉魏吳晉有孫盛魏淡梁祚環濟陸機干寶劉謙之曹嘉之徐廣鄧粲檀道鸞蕭景暢郭季産杜廷業之書而劉協注晉紀附焉宋齊梁北齊隋有王智深裴子野鮑衡卿王琰沈約吳均謝昊劉璠何之元蕭韶姚朂王劭趙毅張大素之書而臧嚴栖鳯春秋附焉失姓名者汲冢紀年魏武本紀皇帝紀梁末代記四家不著録者栁芳唐厯以下及韋澳吳兢韋述陸長源陳嶽焦璐李仁實馬總王起黃台符賈欽文曹圭張敦素劉軻封演韋美栁璨之書終於李匡文漢至唐年紀凡十九家三百五十五卷隋志謂之古史自紀年至齊志三十四部六百六十六卷景德二年龍圖閣書目編年一千一十三卷崇文總目三十八部五百七十九卷中興目六十二家一千三百二十卷續目十一家四百十七卷皇甫湜編年紀傳論合聖人之經者以心不以迹得良史之體者在適不在同唐編紀周書李至逺傳素立之孫少秀悟能治尚書左氏春秋未見杜預釋例而作編紀一作記大趣略同復撰周書起后稷至赧王為傳紀令狐德棻許其良史髙宗時唐編年傳蕭頴士傳嘗謂仲尼作春秋為百王不易法而司馬遷作本紀書表世家列傳敘事依違失褒貶體不足以訓乃起漢元年訖隋義寧編年依春秋義類為傳百篇在魏書髙貴鄉薨曰司馬昭弒帝于南闕在梁書陳受禪曰陳霸先反又自以梁支孫而宣帝逆取順守故武帝得血食三紀昔曲沃篡晉而文公為伯仲尼弗貶也乃黜陳閏隋以唐土德承梁火德皆自斷諸儒不與論也有太原王緒者僧辨裔孫撰永寧公輔梁書十卷黜陳不帝頴士佐之亦著梁蕭史譜二十卷及作梁不禪陳論以發義例使光眀云李華三賢論曰頴士尤罪子長不編年而為列傳後世因之非典訓也自春秋三家後非訓齊生人不録唐續春秋詳見續春秋裴光庭傳開元中光庭拜侍中兼弘文館學士又引壽安丞李融拾遺張琪著佐司馬利賓直弘文館撰續春秋經傳約周公舊規依仲尼新例自戰國訖隋上自周敬下至有隋請天子修經光庭作傳書久不就册府元龜開元二十年三月丁卯奏唐厯續唐厯栁芳傳肅宗詔芳與韋述綴吳兢所次國史上元中坐事徙黔中時髙力士亦貶巫州因從力士質開元天寶及禁中事具識本末時國史已送官不可追刋乃推衍義類倣編年法為唐厯四十篇頗有異聞然不立褒貶義例為諸儒譏訕李德𥙿奏芳子冕以力士之説為先臣言之退上一十七事為次栁氏舊聞一卷蔣偕傳初栁芳作唐厯大厯以後闕而不録宣宗詔崔龜從韋澳李荀張彥逺及偕等分年撰次盡元和以續云志栁芳唐厯四十卷續唐厯二十二卷韋澳蔣偕李荀張彥逺崔瑄撰崔龜從監修會要大中五年七月宰臣監修崔龜從等撰續唐厯二十卷舊紀二十二卷中興書目栁芳撰唐厯起隋義寧元年盡大厯十三年八月崇文目唐厯四十卷目録一卷朝氏志云敘制度為詳初芳次國史興髙祖訖乾元凡百三十篇敘天寶後事棄取不倫後同本傳後崔鉉續修之未就宣宗大中間命崔龜從起大厯十三年春盡元和十五年凡二十二卷唐日厯會要永貞元年九月壬申憲宗初立監修韋執誼奏皇王大典實存簡册自頃史官修撰皆於私家紀録望令修撰官各撰日凡至月終即於館中都會詳定是非除已成實録撰進宣下者其餘見修日厯並不得私家置本從之蔣乂傳父將眀肅宗擢集賢殿學士又貞元中修撰子係大中二年史館修撰伸偕亦修撰傳曰蔣氏三世踵修國史稱良筆咸云蔣氏日厯天下多藏焉此日厯所從起也中興書目有天祐日厯一卷歐陽修曰書雖不全然唐之遺文也朱子曰厯數者帝王相繼之次第猶日厯眀氣節之先後後漢公卿有所撰述始集公府乃上蘭臺唐制専命大臣纂録時政季送史館蓋獻替之語非禁近莫得而聞傳信之辭非史官莫得而預事大體重實相關焉唐通厯志馬總十卷編年類本傳著集年厯通厯書目唐馬總撰朝議郎守泉州别駕起天皇氏總以史籍繁蕪故上索三墳中稽五典迄于隋季為十卷今存又云貫寶厯於聖唐是曰通厯前進士齊推序自十一卷起唐髙祖者即孫光憲所續也光憲皇朝人作續通厯十卷起唐髙祖止閩王審知令附於通厯後者唯五卷爾通厯一書大抵簡略首紀三皇尤詭誕不經與司馬貞補史記所言無異隨事間有論著謂文帝庶幾於王道而景帝之擬成康則有慙德謂宣帝刑名圖霸之王也而世以比光武非其倫也斯言當矣總又有唐年小録六卷載德宗以前故事朝氏志馬總通厯十卷纂太古十七氏中古五帝三王及刪取秦漢三國晉十六國宋齊梁陳元魏北齊後周隋世紀興滅粗述其君賢否取虞世南略論分系於末以見義焉孫光憲續十卷輯唐洎五代事以續馬總厯參以黃巢李茂貞劉守光阿保機吳唐閩吳越兩蜀事迹太祖朝詔毁其書以其所紀多非實也志李仁實通厯七卷編年徐整通厯二卷三五厯紀二卷通厯二卷雜厯五卷孔衍國志厯五卷長厯十四卷雜史賈欽文古今年代厯一卷大中時人編年劉軻帝王厯數歌一卷元和末司馬光通厯八十卷唐天祚長厯栁璞傳仲郢子終著作郎著春秋三氏異同義又述天祚長厯斷自漢武帝紀元為編年以大政大祥異侵叛戰伐隨著之閏位者附見其左嘗謂杜征南春秋後序述紀甲厯為得實自餘史家皆差蔣係以為然志栁璞正閏位厯三卷又黃台符古今通要四卷宣懿時人唐統紀志陳嶽唐統紀一百卷崇文目同中興書目檢校尚書屯田員外郎陳嶽撰以荀悅袁宏有漢紀遂為大唐統紀起武德盡長慶末凡十三朝成一百卷用春秋例間著論云唐大統紀文粹陳鴻修大統紀三十卷正統年代隨甲子紀年以世本尚書春秋緯書及諸史為據絶筆於元和六年辛卯上推至炎帝元年癸未凡三千六百九年唐三國春秋志雜史崔良佐卷亡員半千二十卷建隆龍飛日厯一卷趙普記顯德七年正月藝祖受禪事是年改元建隆三月普撰此書普時為樞密學士開寶日厯又見時政記開寶七年閏十月庚申判史館扈蒙言唐文宗開延英大臣論事命舍人執筆螭頭以記時政唐眀宗命端眀樞密二學士修日厯顯德元年十月修眀宗之制近此事皆廢宜命宰輔每日紀録詔參政多遜典其事雍熙四年九月直史館胡旦言建隆至今日厯不備詔於史館西廡修之淳化四年翰林學士修國史宋湜修日厯尋罷乾興元年五月丁丑詔先朝日厯起居注未上者亟修纂乙酉史館請權於宣徽院修日厯十一月修撰李維宋綬言先朝日厯自祥符元年已後未纂輯甲戌遂命館閣儒臣王舉正李淑為史館編修慶厯中張方平兼修撰自乾興至慶厯日厯以屬之粲然復全歐陽修言録本進呈事有諱避史官雖欲書而不敢書請更不進本書目有周顯德日厯一卷六年夏扈蒙秋董淳冬賈黃中舊制以宰相監修國史修撰直館檢討無常員輯時政記起居注撰日厯繫以日月置編修院于門下省元豐四年總于史館官制正名屬祕省國史案六年三月己卯詔長二毋得與著作修纂日厯事七年十一月己亥詔記注及諸司文書皆送著作八年命曽肇林希兼著作元祐五年十一月置局名曰國史院隸門下省紹聖二年詔日厯還袐省紹興元年四月置修日厯所七月命祕書長二通修纂日厯初元豐六年之制長二不與今從少監程俱請三年六月左相吕頤浩兼提舉修國史時修日厯張綱言祕省權輕難以取會又孫近言景德二年王旦為相領史職請宰輔提舉故有是命八月又詔郎佐以郎官兼領十年二月併歸國史案以著作郎佐修纂遇修正史實録即置國史實録院見修日厯宰相提舉以監修國史繫銜乾道二年十二月修成欽宗日厯七十五卷詔免進呈開寶厯代紀要崇文目雜家開寶五年四月癸卯參知政事劉熙古進五十卷詔褒之本傳嘗集古今事迹為歷代紀要五十卷賈昌朝通紀八十卷當考景德甲子編年厯中興書目二卷實録三卷直史館劉蒙叟撰採其父熙古所著皇王紀要及古今帝王年代厯别為五運甲子編年厯三卷自唐堯起庚子至太祖建隆元年庚申凡三千三百十二年首尾無誤以自唐堯以上至黃帝逐代皆有子孫其所書元年甲子及在位年數不可考故也景德中上之蒙叟字道民宋州人天聖漢春秋嘉祐唐史記唐紀天聖元年十月十六日中書門下言胡旦先撰漢春秋一百卷久未進入詔令本州遞進淳化五年旦言臣參兩漢君臣事迹得魯史之例著為春秋凡百篇帝曰旦褒貶出胸臆豈得容易流傳二年二月癸亥州以旦書上進上稱歎之以祕書監致仕命一子為京官初旦上所撰漢春秋一百卷上因問旦著書本末宰臣王欽若曰旦太宗朝進士第一人詞學精博嘗謂三代之後唯漢得正統因四百年行事立褒貶著此書以擬春秋上稱歎故有是命一云三年九月實録祥符三年十二月丙寅襄州言通判司封外郎胡旦撰漢春秋百篇詔給札録進初旦斫大硯方五六尺既而埋之旦刻曰胡旦修漢春秋硯云天章閣侍講孫甫據實録與書兼採諸家著録參驗不差足傳信者修為唐史記舊史文繁者刪之失者改之意不足而有他證者補之事之不要者去之要而遺者增之是非不眀者正之用編年之體以序君臣之事其體略與實録相類自康定元年修是書至皇祐四年草具遂作序述其意逮嘉祐元年成七十五卷論九十二首文彥博從甫借之不與但録姚崇宋璟論以與之陳彭年以班固謝承為漢書而荀悅袁宏為紀虞預王隱為晉書而干寶為紀唐文物憲章可述獨缺編年之史乃次新書定為唐紀四十篇三十萬言書目四十卷起髙祖訖哀帝劉直方修大唐機要三十卷刪冗補遺景祐五朝春秋五代紀三年七月丁亥工部郎中王軫直祕閣軫上五朝春秋二十五卷記始於吳越特擢之庚寅集賢院學士孫沖上五代紀七十七卷詔奬諭慶厯紀年通譜見改元七年六月九日丁亥參政宋庠上所撰紀年通譜庠取十七代正史并百家雜説凡正偽年號成一書詔送史館中興書目十二卷紀年通譜自漢文帝後元戊寅止周恭帝顯德庚申為九篇以本朝建隆之元至慶厯辛巳為一篇皆曰統元以甲子貫之有五號曰正閏偽賊蠻夷以王莽十九年繫孺子更始以接建武東魏十七年附西魏豫王六年天后十五年繫中宗緒神龍朱梁十六年通濟隂天祐續同光據晉恭帝禪宋之嵗對魏眀元泰常五年尊北降南始主正朔乃通譜之新意也别二篇舉字為類各部分為類元畢仲荀續一卷起慶厯壬午迄徽宗易緯稽覽圖甲寅伏羲氏至無懷氏五萬七千八百八十二年神農五百四十年黃帝一千五百二十年少昊四百年顓頊五百年帝嚳三百五十年堯一百舜五十年禹四百三十一年殷四百九十六年周八百六十七年秦五十年已上六萬三千六百一十三年庚戌年四百九十一年算上右總六萬四千一百三年相基加二年皇極經世三四二卷列世數與歲甲子下紀帝堯至于五代厯年表以見天下離合治亂之迹以天時而驗人事五六二卷列世數與歲甲子下紀自帝堯至五代書傳所載興廢治亂得失邪正之迹以人事而驗天時三皇春也五帝夏也三王秋也五伯冬也七國冬之餘冽也漢王而不足晉伯而有餘三國伯之雄者也十六國伯之叢者也南五代伯之借乘也北五代伯之傳舍也隋晉之子也唐漢之弟也隋季諸郡之伯江漢之餘波也唐季諸鎮之伯日月之餘光也後五代之伯日未出之星也甲辰堯肇位於平陽向堯舜其猶夏之將至日之中乎治平資治通鑑編年通志要目録紀考異末外紀舉厯事本綱目見後治平三年四月辛丒命龍圖直學士侍讀司馬光編集歷代君臣事迹初光患歷代史繁重學者不能綜况於人主欲上自戰國下迄五季正史之外旁采他書關國家興衰係民生休戚善可為法惡可為戒者依左氏傳體為編年一書名曰通志因春秋編年之體倣荀悅簡要之文遂約戰國至秦二世為八卷以進英宗悅之命續其書置局祕閣以劉恕趙君錫同修後以劉攽代君錫院又范祖禹同修表云於崇文置局許借龍圖天章閣三館祕閣書籍賜以御府筆墨繒帛四年十月己酉初御邇英甲寅九日初進讀賜名資治通鑑神宗親製序而賜光令候書成寫入又賜穎邸舊書二千四百二卷序曰光之志以為威烈王命韓趙魏為諸侯周雖未滅王制盡矣此亦古人述作造端立意之所繇也其所載眀君良臣切摩治道議論之精語德刑之善制天人相與之際休咎庶證之原威福盛衰之本規模利害之效良將之方略循吏之條教斷以邪正要於治忽辭令淵厚之體針諫深切之義良謂備焉凡十六代博而得其要簡而周於事是亦典刑之總會册讀之淵林矣表云寵以冠序錫之嘉名每開經筵常令進讀元豐元年十月光奏子康為檢閲文字從之乃熙寧元年二月十一日又進讀移刻罷一本云二年詔光進讀於邇英元豐七年十二月戊辰或云十一月進呈書成二百九十四卷上起戰國下終五代凡一千三百六十二年又略舉事目年經國緯為目録三十卷參考羣書評其同異俾歸一塗為考異三十卷合三百五十四卷自治平開局迄今始成凡十九年表云西京留司御史臺及提舉崇福宫前後六任聽以書局自隨詔書奬諭賜銀帛衣帶鞍馬每編始末識以睿思寶章上諭輔臣曰前代未嘗有此書過荀悅漢紀逺矣以光為資政殿學士輔臣請觀之遂命付三省光編集通鑑既成撮精要之語為目録三十卷晚病目録太簡更著舉要厯八十卷而未成紹興初資政學士臣克家上之書目八十卷光又著厯年圖七卷通厯八十卷稽古録二卷劉恕作外紀十卷恕謂光為厯代書而不及周威烈王之前以包羲至未命三晉為諸侯可為前紀本朝一祖四宗一百八年可為後紀及恕病廢絶意於後紀乃更前紀為外紀猶春秋外傳之義又有目録三卷起包羲訖周威烈王二十二年起三皇止周共和載其世次而已起共和庚申至威烈王二十二年丁丑四百三十八年為一編通鑑問疑一卷劉恕子羲仲記恕議論及問答之語通鑑釋文三十卷史照紹興三十一年上前例一卷乾道間光曽孫伋分類三十六例為前例又為四圖紀事本末四十二卷袁樞編淳熙三年十一月二十四日參政龔茂良言袁樞編通鑑紀事有補治道或取以賜東宫增益見聞詔嚴州摹印十部仍先以卿本上之淳熙元年三月戊子楊萬里為序南始於三家分晉終於世宗征淮陳傅良續通鑑節要十卷張栻通鑑篤論司馬康曰資治通鑑之成書蓋得人焉史記前後漢則劉貢父攽自三國厯七朝而隋則劉道原恕唐訖五代則范純甫祖禹此三公者天下之豪英也我公以純誠粹識不懈晝夜久乃成就之其在正史外而有以博約之楚漢事則司馬彪荀悅袁宏南北朝則崔鴻十六國春秋蕭方等三十國春秋李延壽書雖無表志而可觀太清記亦時有足採者建康實録猶檜而下無譏焉唐以來稗官野史暨夫百家譜録正集别集墓志碑碣行狀别傳幸多存而不敢少忽也要是栁芳唐厯為最可喜厯年圖司馬光讀史患其文繁事廣不能得其綱要又諸國分列嵗時先後參差不齊乃采共和以來訖五代略記國家興衰大迹集為五圖每圖為五重每重為六十行每行記一年之事其年取一國為主而以朱書他國元年綴於其下凡一千八百年曰厯年圖劉攽編年紀事十一卷治平補日厯四年六月癸酉監修韓琦乞差實録檢討陳繹同補未修日厯從之熙寧百官公卿表紹興續百官公卿表見官制紹興二十九年七月十七日戊戌史院言知成都雙流縣李燾有續皇朝百官公卿表一百十二卷內九十卷係私自編纂乞給札抄録從之蔡幼學亦為續公卿百官表年厯大事記備志辨疑編年政要列傳舉要等百餘篇表凡二十卷質疑十卷自治平訖紹興五年熙寧編年通載書目十卷熙寧間起居舍人兼判史館章衡撰其序云修史者十一人事訛舛因編厯代帝系名年始自唐虞至於治平四年總三千四百年大率編年之例首國號廟諡以表元繫日月以記事以便觀採七年八月十一日延和殿進呈賜三品服朝氏志編歷代年號貫以甲子凡繫於存亡綱紀之大者無不詳録且刋正謬誤如史記載舜年虞書不同漢紀載魏受禪與魏志受禪壇碑各異之類皇朝十國紀年疑年譜書目祕書丞劉恕撰記五代僣偽吳唐前後蜀吳越閩漢楚荆南北漢十國君臣事迹本四十二卷今存止四十卷恕又有疑年譜一卷恕謂先儒敘包羲女媧下逮三代享國之嵗惟大庭至無懷氏無年而有總數及後世計堯舜之年衆説不同三統厯次夏商西周與汲冢紀年及商厯差異故載周厲王以前三千五百一十九年為譜朝氏志十國紀年四十二卷長於考異同而拙於屬文髙宗日厯建炎中興日厯紹興修日厯紹興元年四月甲戌八日詔修日厯用程俱請也以日厯所為名七月九日詔長二通修纂二年二月丙戌初置著作官二員編次日厯自渡江無史官至是沈與求以為請三年九日戊寅正字陳祖言請修建炎以來日厯從之六月庚戌左相頤浩提舉修國史時未有日厯始命大臣典領二年十月甲辰詔汪伯彥董耘梁揚祖耿延禧髙世則編類元帥府事迹以付史館用著作虞𤭔請也其後悉以書聞六年四月戊戌朔史館修纂皇帝大元帥府事迹十卷上之九年六月汪伯彥上建炎中興日厯五卷最備三十二年二月丙戌著佐張震言自建炎元年至紹興十二年日厯已成者五百九十卷多所舛誤而十二年以後迄今所修未成書者至八百三十餘草卷未得立傳者七百七人望令長二同修纂內因故相所作時政記者並審訂修改從之乾道七年汪大猷言太上日厯重修未備者十七年陛下龍飛七載而日厯所修未及一年望稍增史貟編修淳熙三年袐書監李壽編次成一千卷三月三日戊申進呈辛亥恭進並如進聖政之制淳祐八年袐省校讎繕寫上之紹興二年十一月壬午知湖州汪藻言太上淵聖及建炎改元至今三十餘年並無日厯本朝宰相皆兼史館故書榻前議論之辭則有時政記柱下見聞之實則有起居注類而次之謂之日厯修而成之謂之實録望許臣編集元符庚辰至建炎己酉三十年間詔旨以備修日厯官采擇許之凡六年乃成一本云汪藻言太上皇元符以來至上建炎之元並無日厯上曰無以易藻尋知湖州領日厯如故復命辟官屬二員書成凡八百册上之賜茶藥進官二等微録成用藻所著為多紹興歷代帝王年運銓要書目十卷紹興初朱繪纂以歐陽修作正統圖黃帝五十六氏一切采録乃起自伏羲政和間吳逵撰帝王系譜一卷自兩漢迄顯德一千一百六十五載胡宏作皇王大紀八十卷紹興孔子編年書目胡仔撰紹興初起魯襄公二十二年訖哀公十六年自孔子始生至卒凡七十三年五卷孝宗日厯紹興三十二年七月詔日厯所自三十一年六月十一日起修日厯既而淳熙五年閏六月有詔修纂至淳熙四年六年三月十八日上之成書一千一百五十五卷十六年二月己丑詔編類壽皇日厯成書朕當遵行之仰稱付託之意自淳熙五年正月續修止淳熙十六年二月一日紹熙元年八月戊戌十六日進日厯二千卷己亥恭進淳祐十一年袐省校讎補寫上之裒鸞臺時政之編合螭陛史臣之法作春秋而因史記為唐厯而效編年萃四七載之懿鑠為二十卷之成書乾道資治通鑑綱目紹興八年胡安國因司馬光遺藁修成舉要補遺文約而事備乾道壬辰朱熹因兩公之書别為義例為綱目五十九卷序例一卷綱效春秋而參取羣史之長目效左氏而稽合諸儒之粹綱者春秋著事之法目者左氏備言之體序例曰表嵗以首年逐年之上行書其甲子遇甲字子字則朱書以别之雖無事依舉要以備歲年而因年以著統凡正統之年嵗下大書非正統者兩行分注大書以提要凡大書有正例變例正例如始終興廢災祥沿革及號令征伐生殺除拜之大者變例如不在此例而善可為法惡可為戒者皆特書之而分注以備言凡分注有追原其始者有遂言其終者有詳陳其事者有備載其言者有因始終而見者有因拜罷而見者有因事類而見者有因家世而見者有溫公所立之言所取之論有胡氏所敢之説所著之評而兩公所遺與夫近世大儒先生折衷之語今亦頗采以附於其間嵗周於上而天道眀統正於下而人道定大綱槩舉而鑒戒昭衆目畢張而幾微著乾道續資治通鑑長編舉要乾道四年四月丙辰禮部郎李燾言臣於去年八月會要二十九日奉旨從汪應辰奏取臣所著續資治通鑑自建隆迄元符令有司繕寫校勘藏之袐閣臣尋於十四日賜對面奉旨令早投進又令給札臣先次寫到建隆元年至治平四年閏三月五朝事迹共一百八年計一百八卷內建隆元年至太平興國元年太祖一朝事迹雖曽於隆興元年具表投進後來稍有增益謹重録進治平以後文字更加整齊節次修寫臣此書非可便謂續資治通鑑姑謂續資治通鑑長編庶幾可也其篇帙或相倍蓰則長編之體當然寧失於繁猶光志云爾今寫成一百七十五册并目録一册上進五月壬戌朔詔燾纂述有勞特轉兩官六年三月二日詔降下長編付祕省今依通鑑字樣大小繕寫仍將李燾銜位於卷首依司馬光銜位修寫淳熙十年三月六日燾為遂寧守始上其全書會要云六百八十七册十年修撰上之自建隆至靖康凡九百八十卷書目一百六十八卷建隆訖靖康舉要六十八卷上甚重之以其書藏祕府先是淳熙二年二月二十二日進神哲三百四十册四年七月五日進徽欽三百二十册燾以司馬光作資治通鑑唐三百年長編范祖禹掌之祖禹所修六百餘卷光細刪之止八十卷故燾纂集用光義例廣記備言以待後之作者燾又撰江左方鎮年表十六卷自晉永嘉訖陳貞眀以孫氏不能保淮李氏不能踰浙又亡荆及巴蜀故削而不著楊仲良為長編紀事本末一百五十卷熊克中興紀事本末一名中興小厯乾道丁未録淳熙國紀乾道七年同修國史趙雄言右修職郎李丙嘗纂丁未録起治平之末迄靖康之初其間議論更革往往編年該載乞給札繕寫八年六月戊戌一云二日詔李丙所録一百册二百卷淹貫該博用功甚多特轉右承事郎丙又撰丙申録吏部侍郎徐度著國紀百卷淳熙三年五月九日李燾請給札下湖州抄録赴國史院參照從之淳熙大事記通釋解題淳熙七年吕祖謙作大事記起周敬王三十九年汔漢武征和三年采左傳稽古録通鑑目録舉要厯皇極經世厯代史輯而廣之參稽百氏書法視太史公所録不盡用䇿書凡例吕中皇朝大事記淳熙九朝通略十一年十二月四日知台州熊克上九朝通略一百六十八卷一百册詔遷一官倣通鑑之體作繫年之書一載釐為一卷簡要不如徐度之紀詳備不如李燾之編嘉泰光宗日厯嘉定日厯紹熙五年閏十月十六日著作郎王容等修太上皇帝及今上日厯慶元六年二月二十二日上太上日厯三百卷嘉泰二年十一月十四日祕書監曽㬇等請再修潤以光宗日厯為名十六日上今上日厯五百十卷嘉定三年三月十三日右正言黃中請刋定初元日厯所載龍飛事迹十四年五月九日上改正今上日厯五百十卷淳祐二年上寧宗日厯修日厯式少監程俱定紹興三十二年少監陳之淵著佐張震復上建炎以後日厯格乾道中著佐鄭伯熊以新舊格參立進則奉延英之對退而裁東觀之書事則親聞理期傳信嘉定建炎以來繫年要録李心傳撰一百卷嘉定五年五月付國史院國朝編年政要蔡幼學四十卷起建隆止靖康紀政事大略其體皆編年法惟每嵗先列宰執拜罷為異又國朝實録列傳舉要十二卷起國初止神宗陳均皇朝編年備要三十卷依朱文公綱目義例據事實録不敢盡同其書法徐自明宰輔編年録玉海卷四十七
