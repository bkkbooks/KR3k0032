body:
  text: 玉海卷九十五宋王應麟撰郊祀明堂三雍附辟雍見學校靈臺見宫室孔子言宗祀祀事以之明孟子言行王政政事以之明記言朝諸侯朝事以之明也先王之祀酒曰明水食曰明粢服曰明衣皆神之也在國之陽天子居其中行政教神而明之故曰明堂晉志房四星為明堂天子布政之宫亦四輔也東方蒼龍心為明堂神農明堂大戴禮明堂第六十七明堂者古有之也注淮南子言神農之世祀以明堂神農明堂曰天府淮南子主術訓篇昔者神農之治天下也神不馳於胸中智不出於四域懷其仁誠之心甘雨時降五榖蕃殖春生夏長秋收冬藏月省時考歲獻功以時嘗榖祀于明堂注嘗新榖薦于明堂明堂之制有蓋而無四方風雨不能襲寒暑不能傷遷延而入之養民以公其民朴重端慤不忿爭而財足不勞形而功成因天地之資而與之和同是故威厲而不殺刑措而不用法省而不煩故其化如神其地南至交址北至幽都東至暘谷西至三危莫不聽從當此之時法寬刑緩囹圄空虛而天下一俗莫懷姦心隋宇文愷議引淮南子云云臣以上古朴略創立典刑新論神農氏祀明堂有蓋而無四方黃帝合宫堯謂之五府府聚也言五帝之神聚於此商人謂路寢為重屋商於虞夏稍文加以重簷四阿故取名黃帝合宫明臺舜總章虞總期湯總街五帝明堂管子桓公問篇黃帝立明臺之議制度見公玉帶圗上觀於賢堯有衢室之問下聽於人舜有告善之旌而主不蔽禹立建鼓於朝而備訊唉湯有總街之庭以觀人誹武王有靈臺之復而賢者進公曰吾欲效之其名云何曰名曰嘖室之議又魏文紀注尸子黃帝合宫有虞總章殷人陽館周人明堂黃圗亦云文中子問易篇議其盡天下之心乎黃帝有合宫之聽堯有衢室之問舜有總章之訪皆議之謂也并天下之謀兼天下之智注合宫總章皆明堂異名太山黃帝有合宫在其下可以立明堂之制東京賦黃帝合宫有虞總期注薛綜曰黃帝舜明堂以草蓋之李善注尸子曰欲觀黃帝之行於合宫觀堯舜之行於總章章期一也漢平紀注應劭曰黃帝合宫有虞總章商曰陽館周曰明堂通典黃帝拜祀上帝于明堂或謂之合宫唐陳子昂傳黃帝合宫有虞總期堯衢室夏世室所以調元氣治隂陽也牛弘議見下淮南子五帝三王之蒞政乃立明堂之朝行明堂之令以調隂陽之氣和四時之節漢鼂錯傳對策曰五帝神聖自親事法官之中明堂之上素問序黃帝坐明堂之上臨觀八極考建五常祭法有虞氏祖顓頊而宗堯疏謂祭五天五人帝及五人神於明堂以顓及堯配之合宫尸子文中張衡牛弘應劭子昻總章尸子文中應劭牛弘子昻總期張衡唐虞五府堯五府天府史記舜受終於文祖書舜典傳文祖堯文德之祖廟下云藝祖義同正義鄭玄云文祖五府之大名猶周之明堂也尚書帝命驗云帝者承天立府以尊天重象也五府者赤曰文祖黃曰神斗白曰顯紀黑曰玄矩蒼曰靈府注云唐虞謂之天府夏謂之正室殷謂之重室周謂之明堂皆祀五帝之所也文祖者赤帝熛怒之府火精光明文章之祖周曰明堂神斗者黃帝含樞紐之府斗主也土精澄靜四行之主周曰太室顯紀者白帝招拒之府紀法也金精斷割萬物周曰總章玄矩者黑帝叶光紀之府矩法也水精玄昧能權輕重周曰玄堂靈府者蒼帝靈威仰之府周曰青陽文選蒼靈奉塗注引帝者承天立五府鄭玄曰云云通典同隋書宇文愷議曰尚書帝命驗曰帝者承天立五府以尊天重象注云唐虞之天府夏之世室殷之重屋周之明堂皆同矣牛弘議亦引帝命驗云黃帝曰合宫堯曰五府舜曰總章布政興治由來尚矣並本傳御覽帝命驗注天有五帝集居太微降精以生聖人故帝者承天立五帝之府是為天府禮記外傳唐志成伯璵四卷明堂古者天子布政之宫在國南十里之內七里之外黃帝享百神於明廷是也南方陽明之地唐虞為五府府者聚也合五帝之神祭之夏謂太廟為世室不毁之義殷謂路寢為重屋周謂五府為明堂禮記明堂隂陽録牛弘傳引之明堂之制周旋以水水行左旋以象天內有太室象紫垣南出明堂象太微西出總章象五潢北出玄堂象營室東出青陽象天市上帝四時各治其宫王者承天統物亦於其方以聽國事禮含文嘉明堂所以通神靈感天地正四時詩我將疏堯典歸格于藝祖用特鄭以藝祖為文祖猶周之明堂通典唐虞祀五帝於五府黃神記白明紀餘同上夏世室又見室類商重屋陽館總章八政總街考工記匠人夏后氏世室注宗廟也魯廟有世室牲有白牡此用先王之禮堂修二七廣四修一修南北之深也夏度以步令堂修十四步其廣益以四分修之一則堂廣十七步半五室三四步四三尺堂上為五室象五行也三四步室方也四三尺以益廣也木室於東北火東南金西南水西北其方皆三步其廣益之以三尺土室於中央方四步其廣益之以四尺此五室居堂南北六丈東西七丈九階南面三三面各二四旁兩夾窗每室四戶八窗白盛蜃灰也以蜃灰堊牆門堂三之二門堂門側之堂取數於正堂令堂如上制則門堂南北九步二尺東西十一步四尺爾雅謂之孰室三之一兩室與門各居一分殷人重屋堂修七尋堂崇四尺四阿重屋重屋者王宫正堂若大寢也其修七尋五丈六尺放夏周則其廣九尋七丈二尺也五室各二尋崇高也四阿若今四柱屋重屋復笮也周人明堂度九尺之筵東西九筵南北七筵堂崇一筵五室凡室二筵明堂者明政教之堂則堂髙九尺殷三尺則夏一尺矣禹卑宫室謂此一尺之堂與此三者或舉宗廟或舉王寢或舉明堂修易氏匠人説云於夏言堂修廣而不言崇於殷言堂崇而不言廣夏周不言四阿殷周不言階窗白盛互明其制而已然屋則不止乎室堂則不止乎屋其地彌大故也大戴禮少間篇商履循禮法發厥明德順民天心配天制典慈民咸合諸侯作八政命於總章服禹功以修舜緒為副于天粒食之民昭然明視注八政洪範所云食貨祀司空司徒司寇賔師是也總章重屋之西堂於此命事取萬物成功也二十有四世武丁開先祖之府取其明法以為君臣上下之節孔子之言禮記外傳夏謂太廟為世室商謂路寢為重屋周謂五府為明堂又曰夏后一堂之上為五室南面三階五室象地載五行五行生於四時故每室四達一室八窗象八節周人有圓屋九月大享五帝於明堂即祖廟心為天子明堂孝經援神契曰明堂之制東西九筵南北七筵筵長九尺東西八十一尺南北六十三尺故謂之太室周之明堂在國之陽三里之外七里之內在辰巳五經異義已地就陽位也尸子黃帝合宫有虞總章殷人陽館周人明堂皆所以名休其善唐會要顔師古引尸子曰黃帝合宫有虞總章殷曰陽館周曰明堂斯皆路寢之證後漢志注孝經援神契曰明堂上圓下方八窗四達布政之宫在國之陽蔡雍明堂論曰明堂者天子太廟所以崇禮其祖以配上帝夏曰世室殷曰重屋周曰明堂東曰青陽南曰明堂西曰總章北曰玄堂中曰太室聖人南面嚮明而治故雖有五名而主以明堂也其正中焉皆曰太廟為大教之宫而四學具焉取其宗祀之清貌則曰清廟取其正室之貌則曰太廟取其尊崇則曰太室取其堂則曰明堂取其四門之學則曰太學取其四面周水圓如璧則曰辟雍異名而同事其實一也魯禘祀周公於太廟明堂猶周宗祀文王於清廟明堂也晉袁凖著論非之唐志明堂三代有其名而無其制度要於布政交神為王者尊嚴之居而已周明堂宗祀明堂泰山明堂蒿宫武王祀明堂考工記見上大戴禮明堂以茅蓋屋上圓下方所以明諸侯尊卑外水曰辟雍又政穆篇太學明堂之東序也詩疏謂後人所增堂髙三尺東西九筵南北七筵上圓下方九室十二堂室四戶戶二牖其宫方三百步在近郊三十里或以為明堂者文王之廟也周時德澤洽和蒿茂大以為宫柱名為蒿宫也玉藻玄端而朝日於東門之外聽朔於南門之外閏月則闔門左扉立于其中注天子廟及路寢皆如明堂制正義異義明堂制今禮戴説禮盛德記曰明堂自古有之凡有九室室有四戶八牖三十六戶七十二牖以草蓋屋上圓下方所以朝諸侯其外名曰辟雍明堂月令書説云明堂髙三丈東西九仞南北七筵上圓下方四堂十二室室四戶八牖宫方三百步在近郊近郊三十里講學大夫淳于登説明堂在國之陽丙巳之地三里之外七里之內而祀之就陽位上圓下方八窗四闥布政之宫周公祀文王於明堂以配上帝上帝五精之帝太微之庭中有五帝座星古周禮孝經説明堂文王之廟云云蓋之以茅玄聞禮戴所云雖出盛德記九室三十六戶七十二牖似秦相吕不韋作春秋時説者所益非古制也四堂十二室字誤本書曰九室十二堂登之言取義於援神契説宗祀文王曰上圓下方八窗四闥布政之宫在國之陽僖五年服氏云人君入太廟視朔告朔天子曰靈臺諸侯曰觀臺在明堂之中文二年服氏云明堂祖廟並與鄭説不同閏月聽朔於明堂門反居路寢門皇氏曰明堂有四門即路寢亦有四門熊氏云周之天子于洛邑立明堂唯大享帝就洛邑耳其每月聽朔當在文王廟以文王廟為明堂制故也詩斯干云西南其戶箋云路寢制如明堂明堂位朝諸侯於明堂之位天子負斧依南鄉而立見朝儀明堂明諸侯之尊卑也成王幼弱周公踐天子之位六年朝諸侯於明堂制禮作樂頒度量而天下大服詩斯干疏明堂周公所制武王時未有也樂記武王祀明堂注云文王之廟為明堂制樂記武王克殷祀于明堂而民知孝注文王之廟為明堂制祭法周人祖文王而宗武王法祭五帝五神於明堂曰祖宗明堂月令春曰其帝太昊伏羲郊祭一帝而明堂祭五帝夏祖顓頊而宗禹殷祖契而宗湯周書明堂解第五十五周公將致政成王朝諸侯於明堂六年而天下大治乃會方國諸侯於宗周大朝諸侯於明堂之位天子負斧扆南立羣公卿士侍于左右三公之位中階之前北面東上諸侯之位阼階之東西面北上諸伯之位西階之西東面北上諸子之位門內之東北面東上諸男之位門內之西北面東上九夷之國東門之外西面北上八蠻之國南門之外北面東上六戎之國西門之外東面北上五狄之國北門之外南面東上四塞九采之國世告至者應門之外北面東上此宗周明堂之位也七年致政於成王玉藻正義云周書亦云宗廟路寢明堂其制同又明堂位太廟天子明堂魯之太廟如明堂天子太廟亦如明堂也覲禮朝諸侯在文王廟又曰明堂方百十二尺髙四尺階廣六尺三寸室居中方百尺室中方六十尺東應門南庫門西臯門北雉門東方曰青陽南方曰明堂西揔章北玄堂中央太廟以左為左個右為右個大匡解勇知害上則不登明堂明堂所以明道明道惟法又曰文王召發于明堂洛誥明禋疏鄭玄以文祖為明堂曰明禋者六典成祭於明堂告五帝太皥之屬也既告明堂則復禋於文武之廟告成洛邑周頌我將祀文王於明堂也我將我享維羊維牛維天其右之儀式刑文王之典日靖四方伊嘏文王既右饗之我其夙夜畏天之威于時保之先言祀天次言祀文王正義謂祭五帝於明堂以文王配而祀之即孝經所謂宗祀文王於明堂以配上帝曲禮大饗注大饗五帝於明堂月令季秋大饗帝注云遍祭五帝但月令秦世之書周法不必然故雜問志云不審周以何月於月令則季秋玉藻注云凡聽朔必以特牲告其帝及神配以文王武王此言牛羊非告朔之祭也雜問志云四時迎氣於四郊祭一帝還於明堂亦如之不過與告朔同祭法云祖文王而宗武王注云祭五帝之神於明堂曰祖宗則明堂之祀武王亦配之矣孝經周公郊祀后稷以配天宗祀文王於明堂以配上帝注祀五方上帝尊文王以配之鄭氏注明堂者天子布政之堂上帝者天之别名明堂之制八忩四達上圓下方在國之南孟子齊宣王問曰人皆謂我毁明堂對曰明堂者王者之堂也注謂泰山下明堂本周天子東巡守朝諸侯之處漢時遺址尚在袁凖云王者而後有明堂左傳文二年周志有之勇則害上不登於明堂注祖廟也所以策功序德家語觀周篇孔子至周觀乎明堂覩四門墉有堯舜之容桀紂之象又有周公相成王抱之負斧扆南面以朝諸侯之圗焉歷郊社之所考明堂之則察廟朝之度吕氏春秋周明堂外户不閉示天下不藏也周明堂金在其後有以見先德後武也作樂金鏄在後茆茨蒿柱土階三等以見節儉淮南子文王周觀得失遍覽是非皆著於明堂著猶圖也晏子春秋明堂之制土事不文木事不鏤示民知節也白虎通禮三老於明堂以教諸侯孝也禮五更於太學以教諸侯弟也漢志周公相成王王道大洽制禮作樂天子曰明堂辟雍諸侯曰泮宫宋志周書云清廟明堂路寢同制齊志案禮及孝經援神契並云有五室周官匠人云云鄭玄云帝一室也初不聞有文王之寢鄭志趙商問云説者謂天子廟制如明堂是為明堂即文廟耶鄭答曰明堂主祭上帝以文王配耳又曰鄭志正月上辛祀后稷於南郊還於明堂以文王配故宋氏創立明堂郊還即祭是用鄭志之説蓋為志者失非玄意也玄之言曰未審周明堂以何月於月令則以季秋又曰何佟之議孝經是周公居攝時禮祭法是成王反位後所行故孝經以文王為宗祭法以文王為祖若孝經所説是成王所行則為嚴祖何得云嚴父且明堂之祀有單有合故鄭云四時迎氣於郊祭一帝還於明堂因祭一帝則以文王配明一賔不容兩主也享五帝於明堂則泛配文武其禮既盛故祖宗並配唐禮志顔師古曰周書敘明堂有應門雉門之制以此知為王者之常居爾其青陽總章玄堂太廟左右個皆路寢之名也文王居明堂之篇帶弓韣禮高禖九門磔禳國有酒以合三族推其事皆與月令合則皆在路寢也大戴禮曰在近郊又曰文王之廟奚足以取信哉會要師古議周書敘明堂四面有應庫雉門蓋王者常居周公朝諸侯于明堂位又東西九筵即路寢之制也近郊之説非矣黃圗明堂所以正四時出教化天子布政之宫明天道之堂三禮圗布政之宫周制五室秦為九室十二階各有所居隋書引禮圗同潁容春秋釋例周公朝諸侯於明堂太廟與明堂一體也禮論或以為明堂者文王廟晉紀瞻傳答秀才䇿周制明堂所以宗其祖以配上帝其正中皆太廟詩靈臺疏案大戴禮盛德篇云明堂者所以明諸侯尊卑也外水名曰辟雍正義又曰韓詩説辟雍在南方七里之內立明堂其中政穆篇云大學明堂之東序也如此文則辟雍明堂同處諸儒多用之盧植蔡雍穎子容賈逵服虔皆以廟學明堂靈臺為一袁準正論申明鄭意鄭以靈臺辟雍在西郊與明堂宗廟皆異處袁準正論云明堂之制四面東西八丈南北六丈古有王居明堂之禮月令則其事也明堂法天之宫故可以祭天而以祖配之尸子曰周公踐東宫祀明堂假為天子明堂在左故謂之東宫大戴禮云明堂在國之陽近郊漢平帝時議之孔牢等以明堂辟雍一實三名金褒等又以經傳無文不能分别蔡雍云明堂太廟一物二名淳于登又云在三里之外七里之內丙巳之地韓詩説在南方七里之郊通典周制季秋大享於明堂宗祀文王以配上帝東西長八十一尺南北六十三尺於一堂之上為五室每堂廣一丈八尺門兩旁各築土為堂南北四十二尺東西五十八尺其堂上各為一室南北丈四尺東西丈八尺宫室牆壁以蛤灰飾之隋牛弘傳上議曰漢司徒馬宫議云夏后氏世室室顯於堂故命以室殷人重屋屋顯於堂故命以屋周人明堂堂大於夏室故命以堂夏后氏益其堂之廣百四十四尺周人明堂以為兩序間大夏后氏七十二尺據鄭玄之説則夏室大於周堂依馬宫之言則周堂大於夏室後王轉文周大為是殷人重屋之下本無五室之文鄭注云五室者據夏而知之周不云重屋因殷則有明堂位曰太廟天子明堂言魯用天子禮樂太廟與周明堂同五行志曰前堂曰太廟中央曰太室周書作洛篇曰乃立太廟宗宫路寢明堂咸有四阿反坫重亢重廊孔朝注曰纍楝纍屋也黃圗所載漢之宗廟皆為重屋去古猶近遺法尚在禮記盛德篇云明堂者明諸侯尊卑外水曰辟雍明堂隂陽録曰周圜行水左旋以象天此明堂有水之明文也孝經援神契禮記盛德篇五經異義稱講學大夫淳于登云上圓下方鄭玄同之馬宫王肅以為明堂辟雍太學同處蔡雍盧植亦以為明堂靈臺辟雍太學同實異名其言别者五經通義曰靈臺以望氣明堂以布政辟雍以飬老教學三者不同袁準鄭玄亦以為别宇文愷傳議曰周書明堂曰堂方百一十二尺髙四尺階博六尺三寸室居內方百尺室內方六十尺户髙八尺博四尺禮圗曰秦明堂九室十二階各有所居吕氏春秋有十二堂與月令同後魏封軌傳室以祭天堂以布政依行而祭故室不過五依時布政故堂不踰四秦變更舊憲故吕氏月令見九室之義大戴禮著十二堂之文漢承秦法二京俱為九室是以黃圗白虎通蔡雍應劭等咸稱九室象九州十二堂象十二辰後魏李謐覽考工記大戴禮盛德篇明堂之制不同著明堂制度論曰凡論明堂之制二途而已言五室者據周禮考工記言九室者案大戴盛德之篇小戴記月令玉藻明堂三篇頗有明堂之義採掇二家參之月令以為明堂五室古今通則中太室東青陽南明堂西總章北玄堂四面之室各有夾房謂之左右個三十六戶七十二牖五室義明於考工戶牖數協於盛德考工記得於五室而謬於堂之修廣盛德篇得於户牖失於九室蔡伯喈識其修廣之不當未思其九室之為謬鄭康成釋五室之位謂土居中木火金水各居四維然四維之室既乖其正施令聽朔各失厥衷左右之個棄而不顧唐會要長孫無忌議鄭注以祖宗合為一祭文武共在明堂配食謬矣王肅駁曰祖有功宗有德自是不毁之名非謂配食於明堂也如鄭義則孝經當言祖祀文王於明堂不得言宗祀也又解宗武王云配勾芒之類五神位在堂下失君敘矣王方慶議先儒舊説天子行事一年十八度入明堂大饗不問卜一入也每月告朔十二入也四時迎氣四入也巡守之年一入也沈伯儀傳鄭玄曰祀五帝五神明堂曰祖宗祭法注文王上配五帝武王下配五神别父子也周文王明堂淮南子文王周觀得失遍覽是非堯舜所以昌桀紂所以亡者皆著於明堂成康繼文武之業守明堂之制觀存亡之迹見成敗之變唐禮志顔師古議引文王居明堂之篇見禮制玉藻正義鄭玄云文王遷豐鎬作靈臺辟雍而已其餘猶諸侯制度焉周公攝政制禮作樂乃立明堂於王城樂記正義明堂文王廟也武王之時未有明堂文王廟如明堂制天子於中祀其父也覲禮朝諸侯在文王之廟曲禮大饗不問卜注大饗五帝於明堂月令季秋大饗帝注言大饗者遍祭五帝也周明堂圗見宗廟禮樂漢城南明堂紀建元元年秋七月議立明堂遣使者安車蒲輪束帛加璧迎魯申公志武帝初即位招賢良趙綰王臧等為公卿欲議立明堂城南以朝諸侯草巡狩封禪改厯服色事未就三輔黃圗明堂在長安西南七里括地志云在雍州長安縣西北七里長安故城南門外關中記云在長安城南門外之西漢泰山明堂奉髙明堂黃帝明堂圗明堂朝諸侯昆侖道泰元神策宋祀五帝武紀元封元年夏四月癸卯登封泰山降坐明堂注泰山東北趾古時明堂明年秋乃作耳元封二年秋作明堂于泰山下郊祀志初天子封泰山泰山東北趾古時有明堂處處險不敞上欲治明堂奉髙傍未曉其制度濟南人公玉帶上黃帝時明堂圗中有一殿四面無壁以茅蓋通水水圜宫垣為復道上有樓從西南入名曰昆侖天子從之入以拜祀上帝焉於是上令奉髙作明堂汶上如帶圖元封五年春三月修封則祠泰一五帝於明堂上坐合髙皇帝祠坐對之服虔曰漢是時未以髙祖配天故言對光武以來乃配之按王莽奏事文帝祠泰一已用髙祖配矣何謂未乎祠后土於下房以二十太牢天子從昆侖道入始拜明堂如郊禮畢尞堂下而上又上泰山因朝諸侯王列侯受郡國計明年幸泰山以十一月甲子朔旦冬至祀上帝於明堂後每修封其贊饗曰天增授皇帝泰元神策周而復始紀元封五年冬南巡狩至于盛唐望祀虞舜於九嶷自尋陽浮江薄樅陽而出遂北至琅邪並海上所過禮祠其名山大川春三月還至泰山增封甲子祠髙祖于明堂以配上帝因朝諸侯王列侯受郡國計夏四月赦天下賜鰥寡孤獨帛貧窮者粟太初元年十月行幸泰山十一月甲子朔旦冬至祀上帝于明堂天漢三年春三月行幸泰山修封祀明堂因受計太始四年春三月行幸泰山壬午祀髙祖于明堂癸未祀孝景于明堂征和四年三月幸泰山修封庚寅祀于明堂地理志泰山奉髙有明堂在西南四里武帝造太康地記曰奉髙故明堂在縣南四里武帝立太壇於東山示增髙琅邪不其縣有太一仙人祠九折及明堂武帝所造後紀章帝元和二年二月辛未東巡狩幸泰山柴告岱宗有黃鵠三十登祠壇升降進幸奉髙壬申宗祀五帝于汶上明堂光武配癸酉告祠二祖四宗大會內外羣臣丙子詔曰朕巡狩岱宗柴望山川告祠明堂以章先勳二王之後先聖之嗣東后蕃衛伯父伯兄仲叔季弟幼子童孫百僚從臣宗室衆子要荒四裔沙漠之北蔥嶺之西冒耐之倫跋涉懸度陵踐阻絶駿奔郊畤咸來助祭祖宗功德延及朕躬其赦天下安帝延光三年二月辛卯幸泰山柴告岱宗壬辰宗祀五帝于汶上明堂史記正義括地志云明堂故城在兗州博城縣東北三十里汶水上漢書云古時明堂處明年秋乃作明堂隋宇文愷傳禮圗曰於內室之上起通天之觀觀八十一尺得宫之數其聲濁君之象也黃圗曰通典引明堂月今説同堂方百四十四尺坤之䇿也方象地屋圓楣徑二百一十六尺法乾之策也圓象天室九宫法九州太室方六丈法隂之變數十二堂法十二月三十六戶法極隂之變數七十二牖法五行所行日數八達象八風法八卦通天臺徑九尺法乾以九覆六髙八十一尺法黃鍾九九之數二十八柱象二十八宿堂髙三尺土階三等法三統堂四向五色法四時五行殿門去殿七十二步法五行所行門堂長四丈取太室三之二垣髙無蔽目之照牖六尺其外倍之殿垣方在水內法地隂也水四周於外象四海圓法陽也水闊二十四丈象二十四氣水內徑三丈應覲禮經後漢志注蔡雍論略同武帝元封二年立明堂汶上無室其外略依此制泰山通議今亡不可得而辨也齊志何佟之議漢文以髙祖配泰畤至武帝立明堂復以髙祖配食一人兩配有乖聖典自漢明以來未能反昔故明堂無兼配之祀後祭祀志注新論曰天稱明故曰明堂上圓法天下方法地八忩法八風四達法四時九室法九州十二坐法十二月三十六戶法三十六雨七十二牖法七十二風選注黃圗曰明堂順四時行令水經注明堂中元元年立尋其基上圓下方九室重隅十二堂隋志後周採漢三輔黃圗為九室通典宋大明五年依漢汶上圗儀設五帝位堂制但作大殿十二間文飾雕畫而已虞通之頌曰肅肅明堂惟國之光儀天矩地崇姬潤黃我皇蒸哉追孝創軌縟憲垂統光圗麗史宗祀既崇饗配惟馨六樂薦和四圭流明慶輝旁燭休光下盈通鑑宋作大殿於丙巳之地制如太廟唯十有二間為異漢明堂上夀郊祀志天子從禪還坐明堂羣臣更上夀下詔改元封元年兒寬傳寬為御史大夫從東封泰山還登明堂上夀曰陛下合指天地祖立明堂辟雍宗祀泰一六律五聲幽贊聖意神樂四合各有方象以承嘉祀為萬世則將建大元本瑞登告岱宗發祉闓門以候景至癸亥宗祀日宣重光上元甲子肅雍永享光輝充塞天文粲然見象日昭報降符應臣寬奉觴再拜上千萬歲夀制曰敬舉君之觴注蘇林曰上元甲子太初元年甲子朔旦冬至也武紀太初元年丁丑歲冬十月行幸泰山十一月甲子朔旦冬至祀上帝于明堂寬上夀在此時史記天厯始改建于明堂諸神受記漢三雍宫三宫立明堂辟雍古辟雍記郊雍禮儀河間獻王傳武帝時元光五年冬十月來朝獻雅樂對三雍宫及詔策所問三十餘事文約指明注應劭曰辟雍靈臺明堂終軍傳上對建三宫之文質章厥職之所宜注服虔曰明堂辟雍靈臺兒寬傳祖立明堂辟雍先是文帝時賈山上至言願以夏歲二月定明堂造太學成帝時劉向説興辟雍案行城南營表未作志儒家獻王對上下三雍宫三篇又有周制十八篇黃圗漢明堂在長安西南七里靈臺在西北八里本清臺後更名辟雍在西北七里河間獻王對三雍宫即此後張純傳河間古辟雍記注河間對三雍宫有其書記祭祀志建武三十年二月注東觀書載太尉趙喜上言宜登封岱宗正三雍之禮禮儀志明帝永平二年二月上始帥羣臣飬老更於辟雍行大射禮郡縣道行鄉飲酒禮于學校皆祀聖師周公孔子牲以犬於是七郊禮樂三雍之義備矣百官志明堂及靈臺丞一人二百石注掌守明堂靈臺靈臺待詔四十二人明堂員吏四十二人曹褒傳父充建武中受詔議立辟雍三雍大射飬老禮儀東都賦永平盛三雍之上儀有詩東京賦乃營三宫布教頒常復廟重屋八達九房規天矩地授時順鄉宗上帝于明堂推光武以作配辨方位而正則五精帥而來摧五方星也尊赤氏之朱光四靈懋而允懷造舟清池維水泱泱左制辟雍右立靈臺薛綜注慈陽殿東有辟雍西有靈臺因進距衰表賢簡能馮相觀祲祈禠禳災李尤辟雍賦太學既崇三宫既章靈臺司天羣耀彌光太室宗祀布政國陽辟雍嵓嵓規圓矩方階序牖闥雙觀四張流水湯湯造舟為梁神聖班德春尉秋饗明堂辟雍以四年八月載生魄庚子臨賦營築越若翊辛丑諸生庶民大和會十萬衆並集平作二旬大功畢成推顯嚴父配天之義修立郊禘宗祀之禮四海雍雍萬國慕義蠻夷殊俗不召自至漸化端冕奉珍助祭祖考嘉享天符仍臻漢祫祭明堂朝諸侯班時令平紀元始四年二月立明堂辟雍羲和劉歆等四人治之令漢與文王靈臺周公作雒同符注應劭曰明堂在國之陽八忩法八風四達法四時九室法九州十二坐法十二月三十六户法三十六旬雨七十二牖法七十二候風黃帝曰合宫有虞總章殷曰陽館周曰明堂辟雍象璧圜雍以水象教化流行五年正月祫祭明堂諸侯王列侯宗室子召助祭禮畢益戶賜爵蕭由傳元始中作明堂辟雍大朝諸侯隋宇文愷議元始四年八月起明堂辟雍長安城南門一殿垣四面門八觀水外周堤壤髙四尺五年正月六日辛未始郊太祖髙皇帝以配天二十二日丁亥宗祀文帝于明堂以配上帝親扶三老五更因班時令宣恩澤漢明堂隂陽説志禮家明堂隂陽三十三篇古明堂遺事明堂隂陽説五篇唐會要引禮記明堂隂陽録隋牛弘傳案劉向别録及馬宫蔡雍等所見當時有古文明堂禮王居明堂禮明堂圗明堂大圗明堂隂陽太山通義魏文侯孝經傳等並説古明堂之事其書皆亡袁準正論曰古有王居明堂之禮月令則其事也漢明堂月令見時令漢中興明堂雒陽明堂宗祀明堂禮圗明堂銘祠汶上明堂靈臺望元氣辟雍大射飬老禮漢三朝禮前禮樂志世祖受命中興撥亂反正改定京師于土中即位三十年四夷賔服百姓家給政教清明乃營立明堂辟雍顯宗即位躬行其禮宗祀光武于明堂飬三老五更于辟雍光武紀中元元年歲在執徐十一月是歲初起明堂靈臺辟雍及北郊兆域宣布圗讖於天下注大戴禮云明堂第六十七明堂者凡九室一室有四户八牖三十六戶七十二牖以茅蓋屋上員下方赤綴戶也白綴牖也禮圗又曰建武三十一年作明堂上員下方十二堂位法日辰九室法九州室八窗八九七十二法四時之候室有十二户法隂陽之數胡伯始注漢官云古清廟蓋以茅今蓋以瓦下藉茅存古制也漢官儀曰明堂四面起土作塹上作橋中無水明堂去平城門二里所天子出從平城門先歷明堂乃至郊祀又曰辟雍去明堂三百步車駕幸辟雍從北門入三月九月皆於中行鄉射禮辟雍以水周其外以節觀者諸侯曰泮宫西南有水北無下天子也漢宫闕疏曰靈臺髙三丈十二門天子曰靈臺諸侯曰觀臺云祭祀志注引考工記援神契晏子吕氏春秋前志新論東京賦漢官儀左東京賦曰乃營三宫布政頒常復廟重屋八達九房制辟雍右立靈臺薛綜注曰八達謂室有八忩堂後有九室所以異於周制乃王隆漢官篇曰清廟茅屋胡廣曰今之明堂茅蓋之加瓦其上不忘古也明紀永平二年正月辛未宗祀光武皇帝於明堂及公卿列侯始服冠冕衣裳玉佩絇屨以行事禮畢登靈臺使尚書令持節詔驃騎將軍三公曰今令月吉日宗祀光武皇帝於明堂以配上帝禮備法物樂和八音詠祉福舞功德其頒時令勑羣后事畢升靈臺望元氣吹時律觀物變羣僚藩輔宗室子孫衆郡奉計百蠻貢職烏桓濊貊咸來助祭單于侍子骨都侯亦皆陪位三月臨辟雍初行大射禮十月壬子幸辟雍初行飬老禮詔曰光武建三朝之禮注謂中元元年初起明堂辟雍靈臺未及臨饗眇眇小子屬當聖業暮春吉辰初行大射令月元日復踐辟雍尊事三老兄事五更云云是歲始迎氣五郊三年正月癸巳詔曰登靈臺見史官正儀度八年十月丙子臨辟雍飬老更永平三年夏旱詔北祈明堂南設雩場注明堂在洛陽城南蓋在雩場之北班固詩曰於昭明堂明堂孔陽聖皇宗祀穆穆煌煌上帝宴饗五位時序誰其配之世祖光武普天率土各以其職猗歟緝熙允懷多福章紀初即位有司言明帝備三雍之教躬飬老之禮作登歌正雅樂博貫六藝建初三年四月己酉宗祀明堂禮畢登靈臺望雲物安紀延光三年二月辛卯上太山柴祭壬辰宗祀五帝于汶上明堂癸巳告祀二祖六宗如元和二年故事順紀永和元年正月己巳宗祀明堂登靈臺改元漢安元年正月癸巳宗祀明堂祭祀志永平二年正月辛未初祀五帝于明堂光武帝配五帝坐位堂上各取其方黃帝在未如南郊之位光武位在青帝之南少退西面牲各一犢奏樂如南郊卒事遂升靈臺以望雲物元和二年二月幸奉髙壬申宗祀五帝於孝武所作汶上明堂光武配如雒陽明堂祀癸酉更告祠髙祖太宗世宗中宗世祖顯宗二祖四宗於明堂各一太牢卒事遂覲東后四月乙卯還京又為靈臺十二門作詩各以其月祀而奏之儒林傳中元元年初建三雍明帝即位親行其禮天子始冠通天衣日月備法物之駕盛清道之儀坐明堂而朝羣后登靈臺以望雲物列傳趙喜建武三十年為太尉上言宜正三雍之禮桓談詔會議靈臺所處帝曰吾將以讖決之注洛陽記平昌門直南大道東是明堂大道西是靈臺也張純為大司空純以聖王之建辟雍所以尊崇禮義既富而教者也乃按七經讖明堂圗河間古辟雍記注河間對三雍宫有其書記孝武泰山明堂制度及平帝時議欲具奏之未及上會請立辟雍博士桓榮上言宜立辟雍明堂章下三公太常而純議同榮帝乃許之桓榮上言宜立明堂辟雍三雍初成拜為五更梁松傳諸儒修明堂辟雍郊祀封禪禮儀常與論議唐會要顔師古曰孝成表行城南厥功靡立元始四年大議孔牢等以為明堂辟雍太學一實三名金褒等稱經傳無文不能分别同異中興後蔡雍作論復云明堂太廟一物二名鄭玄曰在國之陽三里之外淳于登云三里之外七里之內丙巳之地潁容釋例曰明堂太廟凡有八名其體一也茍立同異曾無審見隋牛弘傳漢明堂亦有璧水李尤明堂銘云流水洋洋是也以此須有辟雍李尤明堂銘布政之室上員下方體則天地在國正陽選潘嶽賦引李尤明堂銘曰夏進賢良鄭玄駁異義云淳于登之言取義於孝經援神契今漢立明堂於丙巳由此為之漢建武明堂圗隋明堂圗議隋宇文愷傳奏明堂議曰案淮南子神農明堂有蓋而無四方禮圗曰建武三十年作明堂上圓下方上圓法天下方法地十二堂法日辰九室法九州室八窗八九七十二法一時之王室有二戶二九十八戶法土王十八日內堂正壇髙三尺土階三等自古明堂圖惟有二本一是宗周劉熙阮諶劉昌宗等作三圗略同一是後漢建武三十年作禮圗有本不詳撰人臣逺尋經傳旁求子史研究衆説總撰今圗其樣以木為之下為方堂堂有五室上為圓觀觀有四門昔張衡渾象以三分為一度裴秀輿地以二寸為千里臣之此圗用一分為一尺推而演之輪奐有序表曰在天成象房心為布政之宫在地成形丙午居正陽之位採嵩山之祕簡披汶水之靈圗總集衆論勒成一家圗議二卷釋疑一卷漢明堂丞宋志太常有明堂令一人丞一人丞漢東京初置令宋世祖大明中置魏志注有靈臺丞馬訓魏宗祀明堂晉太元十三年正月後宗祀明堂率遵漢制出以法駕服以袞冕通典魏文帝用漢明堂而未有配紀文帝黃初二年正月郊祀天地明堂明帝太和元年正月丁未始宗祀文帝于明堂以配上帝晉明堂郊社議唐志儀注孔朝等明堂郊社議三卷隋志祭法五卷又明堂議三卷王肅撰范寧傳時更營新廟博求辟雍明堂之制寧據經傳奏上皆有典證隋宇文愷傳自晉以前圓牆璧水一依本圗晉起居注裴頠議為一殿以崇嚴祀餘雜碎皆除之愷謂辟雍之星既有圖狀晉不合天文乖五室九階之義宋起居注大明五年立明堂牆宇規範擬則太廟唯十二間以應期數依漢汶上圗儀設五帝位梁武移宋太極殿為明堂無室十二間後魏樂志曰孝昌二年立明堂詔從五室後改為九室圓牆在璧水外門在水內堂上九室三三相重不依古制元魏將經始明堂集儒學議制度封偉伯上明堂圖説六卷沖牛弘云代都所造出自李隋志開皇十三年禮部尚書牛弘國子祭酒辛彥之等定議後將作大匠宇文愷依月令文造明堂木樣重簷復廟五房四達髙祖命有司於安業里為規兆諸儒爭論莫決罷之大業中愷又造議及樣奏之牛弘傳開皇三年請立明堂議曰形制依周法度數取月令五室九階上圓下方四阿重屋四旁兩門依考工記孝經説八闥二十八柱堂髙三尺依周書月令論殿垣方在內水周如外水徑三百步依太山盛德記覲禮經後詔弘條上故事議其得失唐會要魏徵議曰稽諸詁訓參以舊圗其上圓下方復道重屋異軫齊歸裴頠以諸儒持論異端鋒起遂以人廢言止為一殿宋齊即仍其舊梁陳遵而不改據蔡雍之説則失於文繁依裴頠所為則傷於質略陳貞節議曰魏晉汔梁雖規制或殊而所居之地常取丙巳百王不易之道也長孫無忌議曰上考殷周下洎貞觀並無一代兩帝同配於明堂惟南齊蕭氏以武明昆季並於明堂配食事乃不經未足援據宋志明堂歌謝莊造大明五年四月庚子詔經始明堂有司奏宜擬則太廟唯十有二間以應期數云云六年正月南郊還親祠明堂祭五時帝以文帝配用鄭玄議也用二牛郊用三牛江左不立明堂自晉以來間年一郊明堂同日魏明帝太和元年正月丁未宗祀明堂晉武帝太始二年二月丁丑宗祀又議除五帝之坐同稱昊天上帝各設一坐而已十年十月詔復明堂五帝位晉宗祀文帝潘嶽賦云靈臺東有明堂宗文考以配天初學記引徐乾郊廟明堂議後魏明堂議袁翻傳時修明堂辟雍翻議曰周官考工記具論夏殷名制明堂五室三代同焉配帝象行義則明矣淮南吕氏與月令同文雖布政班時有堂個之别然無九室之證九室著自戴禮罔知所出漢氏因之自欲為一代之法鄭玄云周人明堂五室是帝一室也合於五行之數周禮依數為室本制著存是周五室也於今不同是漢異周也漢為九室但東京賦云八達九房薛綜注房室也謂堂後有九室裴頠又云漢氏作四維之個不能令各據其辰就使其像可圗莫能通其居用之禮此為設虛器也伯喈損益漢制章句繁雜晉朝有一屋之論非經典正義明堂五室請同周制賈思伯傳議建明堂多有同異思伯上議曰戴德撰記世所不行九室十二堂規制恐難得厥衷蔡雍云明堂天子太廟周禮營國左祖右社明堂在國之陽非太廟明矣月令四堂及太室皆謂之廟以天子暫配享五帝故耳雍論明堂之制云堂方百四十尺象坤之策屋圎徑二百一十六尺象乾之䇿方六丈徑九丈象隂陽九六之數九室以象九州屋髙八十一尺象黃鍾九九之數二十八柱以象宿外廣二十四丈以象氣此皆以天地隂陽氣數為法而室獨象九州何也若立五室以象五行豈不快也九室之言或未可從考工記雖補闕之書方之後作不亦優乎孝經援神契五經要義舊禮圖皆作五室及徐劉之論謂同考工者多矣月令室猶是五而布政十二戴氏九室之言蔡子廟學之議子幹靈臺之説裴逸一屋之論及諸家紛紜並無取焉學者善其議通典後魏文帝太和十五年四月經始明堂十六年春宗祀顯祖配上帝北齊采周官考工記為五室後周采漢三輔黃圗為九室皆不克立齊明堂梁明堂通典齊建元元年祭五帝之神於明堂制五室從王儉議梁制明堂十二間為小殿五間為五佐室陳因之玉海卷九十五
