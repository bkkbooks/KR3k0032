body:
  text: 玉海卷一百八宋王應麟撰音樂四夷樂先王於夷樂雖或用之然俗不可以亂正哇不可以雜雅蓋亦後之而弗先外之而弗內也觀夾谷之會侏儒之樂奏於前而孔子譏之東漢元日撣國之樂作於庭而陳禪非之則魯納夷蠻之樂於太廟蓋陳之於門而已唐時皆奏於四門之外豈古之遺制歟夏九夷獻樂舞後漢東夷傳夷有九種曰畎夷干夷方夷黃夷白夷赤夷玄夷風夷陽夷夏少康已後世服王化遂賓於王門獻其樂舞注竹書紀年曰后相即位二年征黃夷七年干夷來賓後少康即位方夷來賓后芬即位三年九夷來御芬一作槐后泄二十一年命畎夷白夷赤夷玄夷風夷陽夷后發即位元年外紀元年丙午諸夷賔于王門諸夷入舞論語疏一日玄莵樂浪髙麗滿節鳬臾索家東屠倭人天鄙周四夷樂春官韎師下士二人舞者十有六人掌教韎樂祭祀則帥其屬而舞之大饗亦如之注舞東夷之樂旄人下士四人掌教舞夷樂凡四方之以舞仕者屬焉疏能為四夷之舞者為之鞮鞻音屨氏下士四人掌四夷之樂與其聲歌祭祀則吹而歌之燕亦如之注鞮鞻四夷舞者所屝也今時倡踏鼓沓行者自有屝四夷之樂東方曰韎南方曰任西方曰株離北方曰禁詩云以雅以南是也王者必作四夷之樂一天下也疏四夷樂名出於孝經鉤命決云東夷之樂曰韎明堂位詩正義作昧持矛助時生南夷之樂曰任明堂位正義作南持弓助時養西夷曰株離持越助時殺北夷曰禁持楯助時藏皆於四門之外右辟按虞傳云陽伯之樂舞株離則東夷之樂亦名株離詩正義引虞傳云云中國之舞四嶽所獻非四夷之舞大公羊注東株離西禁北昧南詩鼓鐘注舞四夷之樂德廣所及也南夷之樂曰餘同明堂位疏任即南昧文王世子胥鼓南注南夷之樂文詩正義舞立昧師四夷之始故先立之疏見後王之世惟東南先服王化祭祀大饗帥屬舞昧樂所以昭先王之德也後漢陳禪傳陳忠曰古者合歡之樂舞於堂四夷之樂陳於門故詩云以雅以南韎任朱離注毛詩無韎任朱離之文蓋見齊魯詩也明堂位昧東夷樂任南蠻樂納蠻夷之樂於太廟言廣魯於天下也疏魯有勳勞故賜奏夷蠻之樂於庭唯言夷蠻則戎狄可知或云正樂既不得六代故蠻夷唯與二方也通典東侏離南任西禁北昧與前注不同當考白虎通云樂元語曰受命而六樂樂先王之樂明有法與其所自作明有制興四夷之樂明德廣及之也故南夷之樂曰兜西夷之樂曰禁北夷之樂曰昧東夷之樂曰離明堂位疏引此云朝離東夷之樂特矛舞助時生也南持羽舞助時養也西持戟舞助時殺也北持干舞助時藏也誰制夷狄之樂以為先聖王也先王推行道德夷狄安樂來朝中國於是作樂樂之一説東方持矛南方歌西方戚北方擊金作之門外者何夷在外故就之也方氏曰中天下而立革四海之民而役之得其歡心使鼓舞以祭祀君子之所樂也故周官有韎師及旄人鞮鞻氏之職者以此東為四夷之長對蠻之小為大焉周官專以韎師掌之者以此周之化自北而南南於豐鎬為尤逺詩以雅以南記言胥鼓南者以此陳氏曰以服色名之則韎是也以聲音名之則侏離是也周扶婁樂拾遺記成王七年南垂之南有扶婁國於掌中備百戲之樂婉轉屈曲於指間神怪翕忽樂府傳此技末代猶學焉鞮鞻騁能扶婁效智漢巴俞樂舞禮樂志巴俞鼓員三十六人注師古曰髙祖初為漢王得巴俞人趫捷善鬭與之定三秦滅楚因存其武樂巴俞之樂自此始上林賦巴俞宋蔡注巴俞舞也淮南干遮文成顛歌文穎曰益州顛縣其民能作西南夷歌西域贊作都盧巴俞注師古曰巴人巴州人俞水名今渝州巴俞之人所謂賨人也髙祖喜觀其舞故有巴俞之樂後蠻夷傳髙祖為漢王發夷人定三秦既定乃遣還巴中而閬中有渝水今渝州板楯蠻夷多居水左右天性徑勇初為漢前鋒數陷陳俗喜歌舞髙祖觀之曰此武王伐紂之歌也乃命樂人習之所謂巴渝舞也晉志漢髙祖將定三秦閬中范因率賨人以從帝為前鋒及定秦中封因為閬中侯復賨人七姓其俗喜舞髙祖樂其猛鋭數觀其舞後使樂人習之舞曲有矛渝弩渝安臺行辭本歌曲總四篇其辭既古莫能曉其句度魏初使軍謀祭酒王粲改創其辭粲問巴渝帥李管种王歌曲意試使歌聽之以考校歌曲而為之改為新福歌曲以述魏德黃初三年又改巴渝舞曰昭武舞晉改昭武舞曰宣武舞通典同上晉及江左皆制其辭隋志魏晉故事有矛俞弩俞等蓋漢髙祖自漢中歸巴俞之兵執伎而舞也開皇九年以非正典罷不用唐志巴俞漢髙帝命工人作也清商伎舞者四人并習巴俞舞蜀都賦奮之則賨旅玩之則渝舞鋭氣剽於中華蹻容世於樂府漢碭極樂西域傳贊設酒池肉林以饗四夷之客作都盧巴俞海中碭極漫衍魚龍角抵之戲以觀視之注李奇曰都盧體輕善緣者碭極樂名也漢狄鞮樂上林賦俳優侏儒狄鞮之倡注郭璞曰狄鞮西戎樂名東都賦四夷間奏德廣所及僸佅兜離罔不具集漢摩訶兜勒曲于闐樂晉志胡角者本以應胡笳之聲後漸用之橫吹有雙角即胡樂也張博望騫入西域傳其法於西京惟得摩訶兜勤一曲李延年更造新聲二十八解乘輿以為武樂班超傳鼓吹注引古今樂録同黃圖漢髙祖七月七日臨百子池作于闐樂見西京雜記漢西南夷獻樂撣國樂安紀永寧元年十二月永昌徼外撣音檀國遣使貢獻西南夷傳永元九年徼外蠻及撣國王雍由調遣重譯奉國珍寶和帝賜金印紫綬小君長皆加印綬錢帛永寧元年雍由調遣使朝賀獻樂及幻人能變化吐火自支解易牛馬頭又善跳丸數乃至千自言我海西人海西大秦也明年元會安帝作樂於庭封雍由調為漢大都尉賜印綬金銀綵繒陳禪傳永寧元年西南夷撣國王雍由調遣使者獻樂及幻人能變化吐火自支解易牛馬頭明年元會作樂於庭安帝與羣臣共觀大奇之禪言帝王之庭不宜設夷狄之技尚書陳忠曰古者合歡之樂舞於堂四夷之樂陳於門故詩云以雅以南韎任朱離今撣國越流沙踰縣度萬里貢獻非鄭衛之音佞人之比漢白狼槃木樂詩逺夷樂德慕德懷德歌詩詳見內附類後西南夷傳莋都夷者武帝所開永平中益州刺史朱輔宣示漢德威懷逺夷白狼槃木唐菆等百餘國舉種奉貢輔上疏曰白狼王唐菆等慕化歸義作詩三章有犍為郡掾田恭與之習狎頗曉其言臣輒訊其風俗譯其辭語今遣從事史李陵與恭護送詣闕并上其樂詩昔在聖帝舞四夷之樂今之所上庶備其一帝嘉之事下史官録其歌焉通鑑在十七年春三月論曰夷歌巴舞殊音異節之技列倡於外門蜀都賦陪以白狼夷歌成章隋髙昌獻樂通典隋文帝開皇六年髙昌獻聖明樂曲唐平髙昌盡收其樂會要同唐十四國樂見前十部樂樂志北狄樂皆馬上之聲自漢後以為鼓吹後魏樂府初有北歌亦曰真人歌周隋始與西涼樂雜奏至唐存者五十三章而名可解者六章蓋燕魏之間鮮卑歌也會要同周隋管絃雜曲數百西涼樂也鼓舞曲皆龜兹樂也會要髙麗百濟樂宋朝初得之貞觀中滅二國盡得其樂至天后時髙麗樂猶二十五曲貞元末惟能習一曲衣服亦漸失其本風矣其百濟至中宗時樂工亡散開元末岐王範為太常復奏置之扶南天竺樂隋代用天竺列於樂部不用扶南煬帝平林邑獲扶南工人及其匏琴朴陋不可用但以天竺樂轉寫其聲吳赤烏六年十二月扶南王范旃遣使獻樂及方物藝文志樂類有外國伎曲三卷又一卷景龍文館記三年宴吐蕃使於承慶殿太常引樂人奏五方師子太平破陳樂六夷等舞殿中奏蹀馬之戲讓皇帝傳涼州獻新曲帝御便坐召諸王觀之通典後魏道武有掖庭中歌真人代歌上敘祖宗開業所由下及君臣廢興之迹凡百五十章北齊祖珽曰太武平河西得沮渠之伎此聲所興蓋符堅之末吕光平西域得其地之樂因又改變雜以秦聲所謂秦漢樂也唐新羅獻女樂新羅傳貞觀五年獻女樂二太宗曰比林邑獻鸚鵡言思鄉乞還况於人乎付使者歸之唐龜兹樂志破陳樂以下皆用大鼓雜以龜兹樂其聲震厲自長夀樂以下用龜兹舞通典龜兹樂起自吕光破龜兹因得其聲後魏平中原獲之周武帝有龜兹之樂至隋有西齊土三部樂用箜篌至貝凡十四南詔傳賜北部龜兹音聲二列唐南詔奉聖樂志貞元十六年正月南詔異牟尋遣使詣劍南西川節度使韋臯言欲獻夷中歌曲且令驃國進樂臯乃作南詔奉聖樂用黃鐘之均舞六成工六十四人贊引二人序曲二十八疊執羽而舞南詔奉聖樂字曲將終雷鼓作於四隅舞者皆拜金聲作而起執羽稽首以象朝覲每拜跪節以鉦鼓又為五均一曰黃鐘宫之宫二曰太蔟商之宫三曰姑洗角之宫四曰林鐘徴之宫五曰南吕羽之宫其文義繁雜不足復紀德宗閲於麟德殿以授太常工人自是殿庭宴則立奏宫中則坐奏會要年月同舊紀正月乙巳驃國傳貞元申王雍羌聞南詔歸唐有內附心異牟尋遣使詣韋臯請獻夷中歌曲且令驃國進樂人貞元十一年遣袁滋册異牟尋為南詔王滋還異牟尋遣人謝天子獻鐸鞘欎刃於是臯作南詔奉聖樂用正律黃鐘之均宫徵一變象西南順也角終變象戎夷革心也舞六成工六十四人贊引二人序曲二十八疊舞南詔奉聖樂字舞人十六執羽翟以四為列舞南字歌聖主無為化舞詔字歌南詔朝天樂舞奉字歌海宇修文化舞聖字歌雨露覃無外舞樂字歌闢土丁零塞皆一章三疊而成將終雷鼓作於四隅舞者皆拜金聲作而起執羽稽首以象朝覲每拜跪節以鉦鼓唯聖字詞末皆恭揖以明奉聖每一字曲三疊各為五成以急奏一疊四十八人分行磬折象將臣禦邊也字舞畢舞者十六人為四列又舞闢四門之舞舞終又一人舞億萬夀之舞凡樂三十工百九十六人分四部一龜兹二大鼓部三北部四軍樂部執羽翟舞俯伏以象朝拜裙襦畫鳥獸草木文以八采雜華以象庶物咸遂羽葆四垂以象天無不覆正方布位以象地無不載分人八列以象四氣舞為五字以象五行乘羽翟以象文德節鼓以象號令逺布振鐸以明采詩之義用龜兹等樂以象逺夷悅服臯以五宫異用獨唱殊音復述五均譜述金石之節奏一曰黃鐘宫軍士歌奉聖樂者用之二曰太蔟商之宫女子歌奉聖樂者用之三曰姑洗角之宫四曰林鐘徵之宫丈夫一人獨舞五曰南吕羽之宫應古律黃鐘為君之宫絲竹緩作一人獨唱歌工復通唱軍士奉聖樂詞李夷簡帥西川廢去以為禮樂非諸侯可擅制唐驃國樂圖驃國獻樂頌志貞元十七年會要作十八年正月驃國王雍羌遣弟悉利移城主舒難陀獻其國樂至成都韋臯復譜次其聲又圖其舞容樂器以進凡工器二十有二其音八金二貝二絲七竹二匏二革二牙一角二大抵皆外國之器其聲曲不隸於有司故不知採云舊志以樂工三十五人來朝驃國傳古朱波也去京師萬四千里凡屬國十八部落二百九十八獻其國樂曲名凡十有二佛印至滌煩樂工皆崑崙衣絳㲲朝霞為蔽膝初奏樂有贊者一人先導樂意其舞容隨曲用人或二或四或六或八至十皆珠冒拜手稽首以終節其樂五譯而至德宗授舒難陀大僕鄉遣還開州刺史唐次述驃國獻樂頌以獻會要驃國在雲南西與天竺國相近故樂曲多演釋氏詞云每為曲皆齊聲唱有類中國柘枝舞其西别有彌臣國樂舞與驃國同多習此伎袁滋郗士美至南詔並見此樂舊紀貞元十八年正月乙五驃國王遣使悉利移來朝貢并獻其國樂十二曲與樂工三十五人會要二十二曲三二十一年四月封彌臣國王咸通年二月貢方物白居易諷諭詩玉螺一吹雅髻聳銅鼓千擊文身踊珠纓炫轉星宿搖花鬘斗藪龍蛇動國史志驃國樂頌一卷唐髙麗獻樂髙麗傳元和末遣使者獻樂工會要元和十年四月其國進樂物兩部骨咄傳開元二十一年王頡利發獻女樂唐日本獻樂實録宣宗大中七年四月日本國遣王子來朝獻寶器音樂帝曰近者黃河清今又日本來朝朕德薄何以堪之因賜百僚宴陳百戲以禮之唐别部新聲見法曲通典有新聲自河西至者號新音聲與龜兹樂散樂俱為時重建隆外國獻歌舞建隆二年正月乙酉上御明德門觀燈宴從臣江南吳粵使皆與樓前設燈山火木露臺張樂陳百戲外國客各獻本國歌舞遂賜以酒食乾德髙麗部樂乾德四年七月鎮州進伶官二十八人習髙麗部樂賜衣物銀帶遣還至道西南夷歌舞至道元年九月三日西南蕃王龍漢􅚜遣使進奉西南牂柯諸蠻來貢方物帝召其使詢以地理風俗因令作本國歌舞一人吹瓢笙數十輩連袂宛轉以足頓地為節問其曲譯者曰水曲詔加漢􅚜等官賜使者遣還先是三月二十六日定州送新羅二人于闕下召見便殿皆手持大螺吹之其曲曰單于云在契丹學此元豐崇政殿奏蕃樂元豐六年五月二十六日召見米脂寨所降蕃樂人四十二人奏樂于崇政殿汴都賦賓旅巴渝之舞僸侏狄鞮之倡逺人面內而進技踰山海而梯航故納之廟者周公所以廣魯觀之庭者安帝喜其來王玉海卷一百八
