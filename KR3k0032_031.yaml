body:
  text: 玉海卷三十一宋王應麟撰聖文御製賦漢武帝所造賦志上所自造賦二篇注武帝魏文帝戒盈賦見藝文類聚文帝善辭賦魏喜霽賦文帝有喜霽賦云激清風以漂潦發皎日之陽暉見藝文類聚梁歷代賦天監十七年周捨奉敕注武帝所製歷代賦啓周興嗣助焉隋志歷代賦十卷梁武帝撰唐威鳯賦懷昔賦太宗與長孫無忌共艱難作威鳯賦以賜且況其功貞觀政要作威鳯賦以自喻因賜房玄齡楊琮與秦王同里居武德初為王府參軍隱太子事平詔親王宰相一人入宴而琮獨預太宗賜懷昔賦申以恩意文苑英華云感舊賦初學記賦曰有一威鳯憩翮朝陽晨遊紫霧夕飲玄霜資長風以舉翰戾天衢而高翔徘徊感德顧慕懷賢唐藉田賦見藉田類高宗儀鳯二年梁武帝有藉田詩唐玉華宫賦高宗為太子貞觀二十二年二月引庶子少詹事司議舍人賦詩言志援筆制序翌日太宗以示王公司徒無忌對曰太子稟承天訓羣藝日新是歲太子制玉華宫山銘又獻玉華宫賦唐玄宗喜雨賦見張説集潔齋壇墠五精是祠暴立炎赫三日為期上帝臨我衷誠不欺重泉蒸潤觸石吐滋納清陰之浮涼混和氣而飄灑感作霖於殷命諷其滂於周雅體雲行而雨施吾何事乎天下張説等和者五人韓休賦昭宸文於合璧式王度其如金徐安貞賦大舜之慶雲已發武帝之秋風莫比賈登賦十有六年唐紫宸殿受朝賀賦會要元和九年正月朔御製恐是賦詩當考太平興國平晉賦鑾輿凱旋賦四年五月己丑御製平晉賦賜從官皆令繼作又製平晉五七言詩各一首賜從官俾之屬和丁酉詔曰并門底定鑾輅凱旋宜崇衆善之因以紀一戎之業其行在所創為佛廟賜號平晉寺御製平晉記刻石建於寺內辛丑次榆次縣御製鑾輿凱旋賦賜從官令繼作癸卯製回鑾至側石書懷詩一首淳化大言賦四年八月一日行書賜蘇易簡曰宋玉遇楚王未足以為美易簡逢真主堪師法於後人今賜卿大言賦名四句曰少年盛世兮為詞臣古往今來兮有幾人云云乾道御製春賦三年三月癸卯賜宰執御製春賦上曰人主不可不知民事七月之詩陳王業艱難近嘗作春賦放蘇軾赤壁賦為之大意言農事方興要使無失其時宰臣魏杞請窺聖作故賜之四年二月庚子賜宰臣蔣芾等辛丑芾奏聖學髙妙虞舜之歌不能遠過賦略曰吾將觀登臺之熙熙包八荒而為家穆然若東風之振稿灑然若膏雨之萌芽心遊造化之表寄妙用於無言洪邁跋曰乾道四年正月庚寅詔賜臣邁春賦一首凡四百七十有二言雲漢為章奎璧絢耀昭回之光下飾萬物臣拜而言曰古今能文者多矣惟廣大高明開闔造化然後足以為帝王之文章帝王之文多矣惟經緯天地鼓舞動植然後足以盡聖人之能事元首之歌薰風之辭湯盤之銘方策所載昭然若揭日月漢祖沛中之歌高簡雄伉讀之竦然使人毛髮欲立武帝悼河功之不成作瓠子之歌紆徐屈折可以一唱而三嘆然鴻鵠高飛之謳連娟修嫮之賦惑於嬪嬙心折氣沮彼二君者豈真帝王之所以為文者哉陛下以天縱之聖高視萬古肆筆成書震撼一世巍乎其如天暖乎其如春嵩衡岱華不足以為高黃鍾大吕不足以為清乾坤施生之妙隂陽動化之賾探端索至發其機緘大哉言乎直與詩書丘索相表裏天之斯文於是無復餘地淳熙十三年三月乙未出御製春晝絶句賜邁四月辛亥和邁所進幸玉津詩邁謂深得無逸之餘旨唐太宗有首春詩御製碑銘黃帝銘巾機法孔甲盤盂見著書類漢志道家黃帝銘六篇雜家孔甲盤盂二十六篇田蚡傳學盤盂諸書應劭曰黃帝史孔甲所作銘也凡二十六篇書盤盂中所以為法七略曰孔甲黃帝之史皇覽記黃帝金人器銘曰武王問尚父曰五帝之戒可得聞乎尚父曰黃帝之戒曰吾居民上搖搖恐夕不及朝故為金人三封其口曰古之愼言人文心雕龍黃帝刻輿几以弼違大禹勒筍簴而招諫朱穆傳注黃帝作巾機之法孔甲有盤盂之誡劉存事始蔡雍銘論曰黃帝有金几之銘又文選注引蔡雍銘論云云德非此族不在銘典禹筍簴銘禹碑筍簴銘見招諫碑見御書湯盤銘大學湯之盤銘曰茍日新日日新又日新正義湯沐浴之盤而刻銘為戒朱子曰湯以人之洗濯其心以去惡如沐浴其身以去垢故銘其盤成湯所以反之而至聖者正惟有得於此故稱其德有曰不邇聲色不殖貨利以義制事以禮制心從諌弗咈改過不吝與人不求備檢身若不及皆足以見日新之實至於所謂聖敬日躋則言愈約意愈切矣伊尹自謂湯咸有一德而於復政太甲之初復以終始惟一時乃日新為戒周之武王於几席觴豆刀劒户牖莫不銘焉蓋聞湯之風而興起者於常用之器各因事刻銘以致戒欲其常接乎目每警乎心而不至忽忘也墨子堯舜禹湯書其事於竹帛瑑之盤盂曰君子福大而愈懼爵隆而益恭漢志小家説天乙三篇注謂湯其言皆依託也選注太公金匱師尚父謂武王曰舜之居人上矜矜如履薄氷湯之居人上翼翼懼不敢息蔡雍銘論殷湯有甘誓之勒賈誼新書湯曰學聖人之道者譬其如日周武王丹書誡書銘起居誡武王几杖書學記大學之禮雖詔於天子無北面所以尊師也注尊師重道焉不使處臣位也武王踐阼召師尚父而問焉曰昔黃帝顓頊之道存乎意亦忽不可得見與師尚父曰在丹書王欲聞之則齊矣王齊三日端冕師尚父亦端冕奉書而入負屏而立王下堂南面而立師尚父曰先王之道不北面王行西折而南東面而立師尚父西面道書之言疏曰皆大戴禮武王踐阼篇大戴禮唯云帝顓頊之道無黃字或古本不與今同丹書者師説云赤雀所銜丹書也云師尚父亦端冕案大戴禮無此文鄭所加也其書之言曰敬勝怠者強怠勝敬者亡瑞書云敬勝怠者吉怠勝敬者滅義勝欲者從欲勝義者凶與瑞書同矣後漢紀注引太公金匱亦有敬義二句對此四句亦見荀子議兵篇及六韜太公文王至道之問凡事不強則枉不敬則不正枉者滅廢敬者萬世以仁得之以仁守之其量百世以仁得之以不仁守之其量十世以不仁得之以不仁守之必傾其世王聞書之言惕然若懼退而為戒書於席之四端為銘及几鑑孟盤楹杖帶履劒矛為銘銘皆各有語在大戴禮丹書凡三十九字安樂必敬為十六銘之首傳心之要也大戴禮武王踐阼第五十九武王踐阼三日召師尚父而問焉云云道書之言曰敬勝怠者吉云云敬者萬世藏之約行之行可以為子孫常者此言之謂也且臣聞之以仁得之云云王聞之惕若恐懼退而為戒書於席之四端為銘曰安樂必敬無行可悔一反一側亦不可不志所監不遠視爾所代機之銘曰皇皇惟敬鑑之銘曰見爾前慮爾後盥盤之銘曰與其溺於人寧溺於淵溺於淵猶可遊也溺於人不可救也楹之銘曰毋曰胡殘其禍將然毋曰胡害其禍將大毋曰胡傷其禍將長杖之銘曰惡乎危於忿疐惡乎失道於耆欲惡乎相忘於富貴帶之銘曰共則壽履屨之銘曰勞則富觴豆之銘曰戒之憍憍則逃户之銘曰名難得而易失牖之銘曰隨天之時以地之財敬祀皇天敬以先時劒之銘曰帶之以為服動必有德弓之銘曰屈申之義廢興之行無忘自過矛之銘曰造矛造矛少間弗忍終身之羞余一人所聞以戒後世子孫注貽厥孫謀以燕翼子武王之詩也太公金匱武王曰吾隨師尚父之言因為書銘隨身自戒其冠銘曰寵以著身不正為咎書履曰行必慮正無懷僥幸書劒曰常以服兵而行道德鏡曰以鏡自照則知吉凶書車曰自致者急載人者緩取欲無度自致而反書鋒曰忍之須臾乃全汝軀書刀曰刀利皚皚無為汝開書井曰原泉滑滑連旱則絶取事有常賦斂有節硯之書曰邪心讒言無得汙白牖之書曰窺望審且念所得可思所忘詩正義中候我膺云季秋之月甲子赤雀銜丹書入豐止於昌戶是類謀曰受赤雀銜書注入戊午蔀二十九年云云春秋元命包曰鳯皇銜丹書於文王之都丹書命云雒授金鈐師名吕赤周禮疏案中候我膺云季秋七月甲子雀銜丹書入酆至昌户再拜稽首受杖詩正義又云大戴禮説武王盤盂几皆有銘史記正義尚書帝命驗云季秋之月甲子赤雀銜丹書入于酆止于昌戶其書曰敬勝怠者吉義勝欲者從以仁得之以仁守之其量百世與踐阼篇同吕氏春秋文王見火鳥銜丹書集於周社故色尚赤淮南子至德之世洛出丹書晏子春秋公遊於紀得金壺發而視之中有丹書曰食魚無反勿乘駑馬晏子曰食魚無反毋盡民力乎勿乘駑馬無置不肖者於側乎分曰紀有書何以亡也對曰君子有道懸之閭紀有此言注之壺不亡何待乎鄧析子湯有司直之人武有戒謹之銘後漢朱穆傳上疏曰古之明君有輔德之臣規諫之官下至器物銘書成敗以防遺失注黃帝作巾機之法孔甲有盤盂之誡太公陰謀曰武王衣之銘曰桑蠶苦女工難得新捐故後必寒鏡銘曰以鏡自照見形容以人自照見吉凶觴銘曰樂極則悲沉湎致非社稷為危唐羅袞曰太公陳觴鏡之銘崔駰傳銘諸几杖刻諸盤杅注太公金匱選注引陰謀同武王曰吾欲造起居之誡隨之以身几之書曰安無忘危存無忘亡熟惟二者必後無凶杖之書曰輔人無茍扶人無咎几杖之銘見于太公金匱之書而注於後漢崔駰之傳觴鏡之銘見於陰謀之書而注於朱穆之傳又有衣銘焉太平御覽太公陰謀武王曰吾欲造起居之誡隨之以身箠書曰馬不可極民不可劇馬極則躓民劇則敗金匱門之書曰敬遇賔客貴賤無二戶之書曰出畏之入懼之鑰之書曰昏謹守深察訛蔡雍銘論武王踐阼咨于太師作席几楹杖器械之銘十有八章周廟金人緘口書背銘之以謹言所以勉令德也文選注蔡雍銘論曰武王踐阼咨于太師而作席几楹杖雜銘武王金版銘見銘類唐歸崇敬傳言春秋釋奠孔子皇帝北面揖以為太重宜準武王受丹書於尚父行東面之禮宋朝寧宗初紹熙五年閏十月戊午侍講朱熹講大學至盤銘日新因論武王有丹書皆人主憂勤警戒之意上曰近有人進此書蓋黃庭堅所書也武王始克商訪洪範於箕子始踐阼又訪丹書於太公可謂急於問道矣孔子贊易於坤之六二曰敬以直內義以方外自黃帝而武王自武王而孔子其一道與怠欲既泯敬義斯存直方以大協德于坤周鍾山銘穆天子傳觀臨鍾山一作舂山乃為銘迹於平圃之上以詔後世謂刋石紀功紀名迹于弇山之石曰西王母之山登贊皇山以望臨城山海經穆王至崑崙之丘眺鍾山之嶺勒石西王母之山絶迹玄圃之上文心雕龍周穆紀迹于弇山之石集古録贊皇壇山有穆王刻石曰吉日癸巳文粹夏后開宛委之圖周穆紀舂山之石水經注碣石山漢武帝登之以望巨海而勒其石漢四皓碑見後唐晉祠碑唐叔虞祠也高祖初起兵禱是祠太宗為立碑貞觀二十年正月幸晉祠立碑製文親書於石金石録太宗製并行書二十年七月唐玉華宫銘萬年宫銘會要貞觀二十二年四月太宗御製玉華宫銘令皇太子已下並和永徽二年九月改九成宫為萬年宫五年三月一云五月親製萬年宫銘并序七百餘字羣臣請刋石建于永光門從之金石録在鳯翔麟遊縣行書永徽六年五月唐底柱銘太宗見後金石録有御製溫泉銘司馬公曰唐太宗刻銘底柱之陰魏鄭公撰字幾沒然殘缺僅可讀唐慈恩寺碑顯慶元年四月戊申御安福門樓觀僧元奬等迎御製書慈恩寺碑文唐遊儀銘集賢注記開元十二年沙門一行造黃道遊儀成以進上御製銘學士陸去泰奉敕題製造年月及工匠姓名于盤下御書填以金字餘題記填以銀字唐華嶽祠碑銘吕向傳玄宗勒石西嶽詔向為鐫勒使會要開元十二年十一月四日庚午上幸東都十日至華州命刺史徐知仁與信安王禕勒石華嶽祠南道上御製碑文仍書之明年七月七日碑成張應天門以示百僚銘序曰十二載孟冬之月銘曰高標赫日半壁飛雨通典十三年於華州嶽祠南立碑實録開元十三年五月戊戌以親製西嶽碑示百僚有五色雲見于前文粹又有御製后土神祠碑銘皆張説之辭也唐紀泰山銘開元十三年十一月有事于泰山上製紀泰山銘親扎勒石於石壁金石録八分書十四年九月又有龍角山紀聖銘開元十七年九月太宗作魏徴碑貞觀十七年正月高宗作李績碑儀鳯二年十月明皇作張説碑開元十八年德宗作段秀實碑興元元年崔圓為蜀留後玄宗親製遺愛碑以寵之司馬子微諡正一先生親文其碑又親製一行碑文并書於石東都聖善寺中宗為太后追福自製碑唐紀功碑李晟復兩京帝紀其功自文于碑敕皇太子書立于東渭橋晟謝表云上援彥範次述子儀韋臯擒論莽熱獻諸朝帝製紀功碑褒賜之唐鐘銘西域傳摩揭它本中天竺屬國貞觀二十一年始遣使自通高宗遣王元策至其國摩訶菩提祠立碑後德宗自製鐘銘賜那爛陀祠金石録天寶三載六月明皇撰真源觀鐘銘八分書唐宸扆台衡銘馬燧傳燧平河中貞元元年還太原德宗賜宸扆台衡二銘并序以言君臣相成之美勒石起義堂西偏帝榜其顔以寵之會要云止為題額宸扆銘曰求賢惟廣辨理惟精逆心怫志必嘉乃誠順旨茍容亦察其情斥去姦諛全度中貞凡將有為靡不三思喜怒以節動靜以時台衡銘曰天列日星象垂于人聖人則天亦建輔臣以翼以弼為衡為鈞如耳目應心如股肱運形自求賢辨理至宣猷同德權德輿為燧行狀云貞元元年上賜杜希全君臣針公奉表賀因賜是銘各一首令男暢謝恩請揭而書於起義堂詔優答曰比夫盤盂自銘亦兾輔佐同德會要九年十月册府元龜云元年恐會要誤上以燧平汴宋魏博河中功益高賜二銘并序文苑英華燧請到御製針銘曰援申甫以作誡紹唐虞而追蹤目以勳賢稱其威武內以為子孫藏外以垂金石刻太平興國戒子銘太宗九子興國八年並封上作戒子銘及詩賜之太宗戒石銘紹興二年六月癸巳詔有司摹黃庭堅所書太宗戒石銘勒諸堅珉遍賜守令命刻之庭石置諸坐右七月癸酉吕頥浩等跋洪邁曰耿煥野人間話首篇頒令針載蜀王孟昶為文頒諸邑云凡二十四句唯經表出者詞簡理盡遂成王言太宗書此以賜郡國立於聽事之南謂之戒石銘銘曰爾俸爾祿民膏民脂下民易虐上天難欺至道製趙普碑至道三年六月製韓王趙普神道碑銘親八分書以賜之并篆額人謂三絶皇祐二年六月製太師中令隴西郡王李用和神道碑仍篆曰親賢之碑仁宗御集有銘六卷祥符泰山銘贊會真宫碑泰山述二聖銘汾陰配饗銘祀汾陰聖製上清宫銘明道宫碑祥符二年五月戊午對輔臣于後苑出御製御書登泰山謝天書述二聖功德銘司命天尊仁聖天齊王同文憲王玄聖文宣王讃玉女像記示之十月丙午遣內侍以御製泰山銘贊九軸賜丁謂等尋分賜近臣十二月辛卯出聖製會真宫碑示王旦等三年正月戊寅召近臣觀龍圗閣書又至資政殿出聖製會真宫碑九天司命天尊殿銘泰山重修聖像記上又製五言詩一首賜王旦等和晏殊作東封聖製頌見前四年二月辛酉祀汾陰壬戌上作汾陰二聖配饗銘河瀆顯聖靈源公西海廣潤王贊示輔臣又作七言詩賜留守向敏中三月壬午幸上清宫作上清宫銘及七言詩示近臣八月壬戌詔輔臣于後苑觀御製御書祀汾陰二聖配饗銘記十八本九月辛卯內出聖製祀汾陰碑銘贊記凡十八本于朝堂示百官從御史趙湘之請也丁謂朝逈李宗諤楊億等十三人咸上歌頌以贊盛美詔褒之五月五日辛卯對輔臣于崇政殿觀御製汾陰銘贊七年七月御製朝謁太清宫頌南京頌明道宫碑聖祖殿等銘贊示近臣八月丁丒於景福殿示輔臣十月己未詔奉祀陪位五使導駕扈從官勒名碑陰書目真宗御集銘六卷碑銘六卷贊八卷頌六卷祥符宗室坐右銘祥符三年九月時帝親製五針以自警判宗正寺趙湘日對請御製文以戒宗室使知孝悌恭儉之節湘言宗室風化所本宜有以訓厲願特製銘以賜南北邸丁亥上作宗室坐右銘并注分賜寧王元偓以下因謂近臣曰凡為童稚時訓導之為益且久茍聰悟者讀書便能成誦終身不忘朕舊在藩邸先帝令朕遵行然宗子既衆當須輔導得人自今十歲以上並令入學委時大雅教之判宗正寺趙湘請朕著針以戒之又以示宗室因製此銘以申誨導可付學士院降詔賜之寧王等亦降詔諭意分賜并及湘諭之曰卿宗姓也故有此賜會要與實録同祥符龍門銘祥符四年祀汾陰回三月癸未幸西京龍門山諸寺作遊龍門詩有寶塔一新輝勝概玉毫遍飾罄殊功之句又作龍門銘祥符內藏庫銘祥符四年九月辛未朔壬申上作內藏庫銘述先帝節用愛人之意初命陳彭年撰記彭年表請聖文故從之五年八月辛丒幸內藏庫觀所立聖製內藏庫銘亭述儲𤭔之通規昭祖宗之懿範元豐有景福殿庫詩天禧會靈觀銘天禧元年二月戊寅作會靈觀銘元符觀頌思政論四年十一月癸丑賜輔臣會靈觀銘石本晏殊謝表漢章鸞藻述真宇之有嚴龍篆龜趺播天聲于不朽天禧乾文殿聖製碑修河碑四年二月癸未朔詔滑州新建儈院賜名福寧院御製碑文以寵之作乾文殿以奉安聖製碑石丁酉滑州言決河塞丙戌上作滑州修河碑示近臣己亥以河平致祭庚子羣臣詣崇德殿稱賀熙寧製韓琦碑熙寧八年十一月御製尚書令韓琦碑以寵勳舊崇寧帝鼐銘三年十月戊午淳祐訓亷謹刑銘章聖七條六熙陵戒石十字四年正月一日御製謂祖宗以仁立國以禮義廉恥待士大夫而有位者或淫于刑或冒于賄爰作二銘以警以訓謹刑銘民吾同胞疾痛猶已報虐以威刑非得已仰惟祖宗若保赤子明謹庶獄惻怛溫旨金科玉條豪析銖纍夫何大吏蔑棄法理逮于郡邑濫用笞箠典聽朕言式克欽止訓亷銘周典六計吏治條陳以廉為本乃良而循彼肆貪虐與豺虎均肥于而家多瘠吾民縱逭於法愧其冠紳貨悖而入災及後人我朝忠厚黜貪為仁咨爾羣辟是訓是遵銘者名也因其器名書以為戒帝堯作龜書靈后氏象形篆以銘鍾鼎事始御製針贊頌堯戒淮南子人間訓堯戒曰戰戰栗栗日謹一日人莫躓於山而躓於垤孟子放勳曰勞之來之匡之直之輔之翼之使自得之又從而振德之賈誼新書修政語帝堯曰吾存心于先古加志于窮民帝舜曰取之以敬得之以敬隋志讖緯堯戒舜禹一卷皇王大紀黃帝作輿几之針以警宴安作金几之銘以戒逸欲史記趙良曰虞舜有言曰自卑也尚矣夏針周書文傳解第二十五文王受命九年時維暮春在鄗召太子發曰吾語女所保所守厚德廣惠忠信愛人君子之行夏針曰中不容利民乃外次孔朝注夏禹之針戒書也利福業次舍于田開望曰土廣無守可襲伐土狹無食可圍竭開望古書名也夏針曰小人無兼年之食遇天飢妻子非其有也大夫無兼年之食遇天飢臣妾輿馬非其有也國君無兼年之食遇天飢百姓非其有也注古者國家三年耕必有一年之儲非其有言流亡也戒之哉弗思弗行至無日矣有十年之積者王有五年之積者霸無一年之積者亡文選王元長策秀才文注周書夏針曰小人無兼年之食妻子非其妻子也太平御覽引之文心雕龍夏商二針餘句頗存吕氏春秋有商針周針五子之歌述大禹之戒其一曰皇祖有訓魏絳述夏訓晏子述夏諺漢志雜家大三十七篇傳言禹所作其文似後世語師古曰古禹字墨子夏書曰禹七年水周書曰國無三年之食者國非其國也家無三年之食子非其子也賈誼新書大禹曰民無食也則我勿能使也功成而不利于民我弗能勸也胡廣百官針序曰墨子著書稱夏針之辭後魏李彪曰傳著夏氏之針唐陸機王羲之贊太宗製晉史撰二帝及陸機王羲之贊唐太宗凌煙閣功臣讃志一卷唐睿宗漢高祖讃初學記赫赫漢祖應若興雲唐顔子贊見釋奠類金石録孔子弟子贊明皇與宋璟等撰元和十年十一月孟簡立又睿宗撰老子孔子顔子贊唐開元十八學士贊開元十一年麗正學士進詩上嘉賞之自燕公以下十八人各賜贊以褒美之敕曰得所進詩甚為佳妙並據才能略為贊述上自於五色箋八分書之尹鳯翔賫就院散付學士尋敕畫像書贊于含象亭車駕東行不果又見圗類並十八學士名及贊見後唐起義堂頌啓聖宫頌見宫室開元十一年正月辛卯幸并州上親製起義堂頌及書刻石紀功于太原府之南街詳見堂類姬詠同原劉歌沛邑於昭義堂誓衆資始天命所起于胥頌美唐鶺鴒頌寧王憲傳玄宗時有鶺鴒千數集麟德殿廷木魏光乘作頌以為天子友悌之祥帝喜亦為作頌頌云我所息宴桂宫蘭殿九月辛酉雍渠伊見飛鳴行搖在原之趣急難有情逼之不懼顧惟涼德天下所效友于親賢實以為教魯衛分政遊處其睽召之至庭雍雍怡怡蓐收御節寒露微結觀此翔禽我心以悅昆季縱目詠詩棠棣良史爰褒有慚虛昧張説和詩云神藻飛為鶺鴒賦金石録鶺鴒頌明皇撰并行書唐陜州聽事贊盧奐傳為陜州刺史開元二十四年帝西還次陜嘉其美政題贊于聽事曰專城之重分陜之雄亦既利物內存匪躬斯為國寶不墜家風尋召為兵部侍郎又賜宰相竹扇及贊金石録明皇撰并行書開元二十四年十月唐開元令長新戒通鑑二十四年二月甲寅宴新除縣令于朝堂上作令長新戒一篇賜天下縣令集古録玄宗自擇縣令一百六十三人賜以丁寧之戒天下為縣者皆刻石今所得凡六河內至舞陽六金石録又有開元二十六年月誡牧宰敕令長新戒曰我求令長保乂下人人之所為必有所因侵漁浸廣賦役不均使夫離散莫保其身徵諸善理寄爾良臣與之革故政在惟新調風變俗背偽歸真教先為富惠恤于貧無大無小以躬以親責躬勸農其惟在勤墨綬行令孰不攸遵曷云被之我澤如春漢表云萬户以上為令減萬户為長唐汜水紀功頌見紀功唐君臣針奉天之狩朔方節度使杜希全分兵赴難賊平貞元九年十二月遷檢校尚書右僕射靈鹽等州節度使獻體要八章砭切政病帝嘉納之賜君臣針一篇會要舊史同載針云從諫則聖共理惟賢將負扆以虛心期盡忠而納誨在昔稷契實正舜禹逮兹魏徵佐我皇祖戀闕方甚嘉言乃昌詞高理要入德知方縱彼千慮被于八章汝其夙夜明保朕躬華戎仰德時乃之風唐政刑針崔位賀聖製政刑針表云致理和平躋人壽域猶懷兢業重設針規酌裁成立政之中求司牧措刑之本信成康之能事蓋堯禹之用心可以萬邦作孚千載垂範金石不朽日月俱垂勤萬機于一日二日立盛德于先天後天金石録德宗撰政刑針八分書貞元十四年十二月舊史貞元十二年十二月乙未上著政刑針一首以聽政之餘深思理本德宗諡册云政刑有針宸扆有銘煥乎文明之化成也建隆御製先聖二贊國初增修國子監學舍修飾先聖十哲畫像七十二賢及先儒二十一人像于東西廊之板壁建隆二年十一月己巳上幸學御製先聖文宣王及亞聖兖國公贊十哲以下命兩制分贊之唐開元七年圖七十二子于壁上作顔子贊而已書目國子監兩廟贊二卷太祖真宗御製及羣臣分撰文宣武成王二廟贊文宣贊曰尼父挺生河海標異祖述堯舜有德無位梁元帝自圖宣尼像為贊而書之太平興國戒子篇太平興國初太宗至東宫出戒子篇命皇子侍讀郭贄注解且令委曲講説以諭諸王本傳端拱修身針淳化賜進士針端拱三年三月壬寅御崇政殿親試進士陳堯叟等賜第上作修身針賜之勉以修身謹行稽古效官之意初內殿策士賜詩至堯叟始易以針淳化三年三月癸卯賜進士孫何等御製針一首丙辰賜宴瓊林苑又賜御詩三首己酉又賜儒行篇為座右之戒詩針並賜時論榮之唐故事禮部放榜敕下之日為聞喜宴于曲江近世多于名園佛廟淳化祕閣贊序淳化三年五月甲寅詔增修祕閣八月壬戌朔宴宰臣李昉以下于祕閣三館與焉上作詩以美其事已而祕書監李至上表乞御製贊以光祕府上許之仍以六體親書贊文并序及篆額刻石一本云閣成帝作贊賜之李至上表請以御製贊刻石祕閣帝以宰臣前已陳請又重違至意詔曰近以延閣載新萬機多暇聊書贊詠以美成功遽覽封章願刋穹石垂于不朽良積厚顔其贊并序當親書篆額以旌祕府景德龍圖閣贊祥符瑞物閣贊見總瑞景德二年四月戊戌上閲太宗御書于龍圖閣作詩令近臣應制及命李宗諤作序庚子又作龍圖閣贊示輔臣祥符文宣王贊祥符元年十月二十六日詔以紀號介丘觀風廣魯以十一月朔旦幸曲阜縣謁文宣王十一月戊午上服靴袍詣文宣王廟內外設黃麾仗孔氏家屬陪列有司定儀止肅揖上特再拜又幸叔梁紇堂命刑部尚書溫仲舒等分奠七十二子先儒暨叔梁紇顔氏上制贊刻石廟中復幸孔林以樹木擁道降輿驂至文宣王墓奠拜詔加諡曰至聖文宣王祝文進署仍修葺祠宇給近便十户奉塋廟又詔留親奠拜祭若翌日又遣吏書張齊賢等以太牢致祭賜其家錢三十萬帛三百匹以四十六世孫同學究出身聖祐為奉禮郎近屬授官及賜出身者六人又追封叔梁紇為魯國公顔氏為魯國大夫人伯魚母开官氏為鄆國大夫人先是詔有司檢討漢唐褒崇宣聖故事欲追諡為帝或言宣父周之陪臣周止稱王不當加帝號故第增美名春秋演孔圖曰孔子母感黑帝而生故曰玄聖莊子曰恬淡玄聖素王之道遂取以為稱二年五月戊午以御製御書玄聖文宣王讃示輔臣六月丙午詔刻于石壁天禧五年六月己未國子監請以聖製贊及詔命洎近臣所撰十哲七十二賢贊鏤版流傳從之又為周文憲王贊昭烈武成王贊會要祥符二年五月戊午製文宣王贊示近臣十一月中書門下言欲依張齊賢向敏中王嗣宗等乞觀御製文宣王武成王等贊及令丁謂等于廟堂宣示百官帝曰此但紀一時事何足于廟堂宣示宰臣王旦等言君父聖作臣子願觀未許旦等再三陳上許之翌日齊賢等奉表稱謝崇文目總集始于兩廟贊文一卷式墓而荆棘自辟升堂而絲竹如聞晏殊頌祥符禮選贊太宗時邢昺嘗纂禮選以獻其後真宗閲書禁中得其本作贊以示近臣實録祥符三年五月乙巳上作禮選贊賜侍講學士邢昺祥符自戒針守官針祥符三年三月丁酉上謂王旦等曰朕自北鄙和好邊陲無事然居安慮危未嘗敢自逸每為文以自警置座右朝夕觀之因出貴廩食吟軫田夫吟念農歌自戒針守官針以示旦等御製五針在後即此針祥符天書周伯星贊三年十二月丁巳作二贊祥符廣孝泉贊祥符四年二月甲子駕駐河中府觀舜井賜名廣孝泉修飾欄檻禁民慢褻二井南北相連可秉炬而入史記所謂穿空旁出者也公府中井脈皆鹹獨此水甘美俗傳飲者愈疾帝作贊記之又命王欽若作記改舜泉坊曰廣孝坊五月於其側建廟祥符西嶽真君贊景靈宫頌南京頌四年二月二十日作景靈宫頌見祠宫南京頌見銘類大中祥符頌祥符四年八月乙丒學士李宗諤請聖製左承天祥符門碑從之先是天書降即詔增葺宗諤以錫符之地當有聖作上謙遜久之於是作大中祥符頌以宗諤所撰文刻于碑陰元年四月丙戌御製景靈宫贊頌刻石祥符真遊頌朝謁太清宫頌元符觀頌五年十二月乙酉作真遊頌示近臣七年七月或作八月丁丑製朝謁太清宫頌明道宫碑聖祖殿銘九年四月庚戌作元符觀頌刻石天禧二年正月辛亥出元符觀頌示輔臣七年七月壬子修真遊殿本名延恩以聖祖臨降因以題榜丁謂請御書殿額祥符賜內侍針祥符六年三月甲戌上作內侍針并注釋賜都知閻承翰等大指以內懷祇謹乃可事君其或輕率必當陷刑辟而失身茍能靖專無或放佚朕之望也監治軍戎唯在甘苦一同臨蒞之務兼濟奉使于外本自無威茍假朝廷之威人之奉爾蓋為朝廷或不矜伐掌守禮度不自專輒常稟法制則外人見仍加欽重復命入對勿希旨勿附辨但存公平之道常持正直節儉忠直不為奢侈之事切思矯偽勿思遲遲爾有勤勞國家必以官報爾不求自至也承翰請刻石本省從之慶厯中孫沔奏太宗著令式之文真宗述針規之訓祥符五針坐右文趙湘判宗正寺時帝撰五針自警一本云祥符二年撰湘因言宗室風化所本宜有以訓厲帝悅為撰宗室坐右銘見上三年三月丁酉上謂王旦曰為文自警置諸坐右祥符太宗聖文神筆頌六閣圖書贊六年正月庚戌詔曰太宗聖文冠古仙翰入神曩於臨御之年爰徇衆多之請眷中州之至廣在勝境之相望幸降德音屢頒副本朕丕承若厲恭閲惟勤輒陳頌歎之辭冀申孺慕之感云云應諸路州軍宫觀寺院名山靈迹經賜太宗御書者件析以聞當降御製太宗聖文神筆頌刋石又賜王旦以下御製御書太宗聖文神筆頌龍圖閣瑞物閣贊龍圖閣六閣圖書贊太宗御製御書目録龍圖閣瑞物閣瑞寶目龍圖閣書籍圖畫目響石銘太湖石銘共八軸並石本從所請也九年二月并玉宸殿記刋石置諸翔鸞閣下癸卯召近臣觀之天禧元良針元良述六藝針天禧二年八月甲辰立升王為皇太子癸丑上作元良針七言十韻詩賜之又作七言詩二首分賜賔客李迪庶子張士遜以下三年九月二十三日丙子召宗室近臣對清景殿內出御製賜皇太子元良述六藝針各一卷又賜承華要略十卷授時要録十三卷又以御覽國史兩朝實録太宗御集等書賜皇太子又作七言十韻詩賜宰臣寇凖等遂宴于殿內十二月辛卯又以賜輔臣宫僚請降副本于資善堂以備觀覽太子謝表曰為鶴禁之寵光聳瑶山之軌範漢幄堯門爰增于禮秩湯盤武几遂著于格言潤金璧以為辭並羲舒而宣曜崇寧景靈宫贊宣和文宣王贊崇寧元年四月十二日建景靈宫成作贊宣和四年正月製文宣王贊紹興宣聖贊七十二賢贊紹興十四年三月十八日己巳幸太學覽唐明皇及太祖真宗祖考所製贊文命有司取從祀諸贊悉録以進二十四日乙亥御製御書宣聖贊命揭于大成殿刻石朌諸路州學上謂輔臣曰唐明皇作贊斥先聖名非是閌曰尤見聖學高出帝王之上二十五年又製七十二賢贊親札刋石朌降焉二十六年十二月戊午廷紳請朌諸州郡學校從之宣聖贊曰志則春秋道由忠恕賢於堯舜日月其譽隆興御製贊元年七月御製御書大士贊賜天竺寺八月二十二日御製贊誦賜宗杲光堯御製盤松贊康壽殿生芝草光堯製贊云履正懷沖乾道御製蘇軾文集贊乾道元年閏正月御製蘇軾集贊其序曰成一代之文章必能立天下之大節贊曰手抉雲漢斡造化機氣髙天下乃克為之猗嗟若人冠冕百代忠言讜論不顧身害云云敬想高風恨不同時掩卷三嘆播以聲詩選德殿書賜蘇嶠先是有詔贈軾太師紹熙瑞芝贊詩元年四月乙酉宣示宰臣以慈福宫瑞芝圖及壽皇御製贊上御製詩及高宗御製瑞芝贊壽皇御製詩付史館淳祐聖賢十三贊萬幾餘間博求載籍推迹道統之傳自伏羲迄于孟子凡達而在上其道行窮而在下其教明各為之贊元年孟春祗謁先聖賜國子監宣示諸生伏羲禹堯湯舜文曽武思周孟孔子子顔寶祐字民訓四年三月二十五日丙辰御製字民訓爾等服勞州縣始獲脫選通籍信難矣學製為尤難其律已必廉否則墨其養民必惠否則暴其聽訟必公否則私其涖事必勤否則怠往即乃封祇若豫訓邑有善狀朝徹夕聞表用有先朝故典在昔子路以治蒲為難夫子誨之以恭寬溫恕之理三年而政成朕之言夫子之遺意聽之毋忽四月六日丁卯令吏部書于改官印紙閣門引見日宣示玉海卷三十一
