body:
  text: 玉海卷一百七十二宋王應麟撰宫室橋梁天官書東井兩河天闕間為關梁堯橋梁漢文紀二年五月詔誹謗之木注服䖍曰堯作之橋梁交午柱頭周造舟詩大明親迎于渭造舟為梁爾雅天子造舟鄭氏曰天子造舟周制也殷時未有等制孔子曰文王始作而用之方言浮梁也浮初學記今蒲津橋是其處秦鍼造舟于河漢章帝建初七年十月東至髙陵造舟於涇而還周鉅橋管子武王有鉅橋之粟貴糴之數立重泉之戍令曰自今有百榖之粟者不行注鉅橋倉在今廣平郡曲周縣許慎云鉅鹿之大橋書發鉅橋之粟也爾雅梁莫大於湨梁注橋也張良傳下邳圯上注圯橋也漢横橋黄圖横橋横音光三輔舊事云秦造漢承秦制廣六丈三百八十步置都水令以掌之號為石柱橋黄圖又云長安城下有池周廣三丈深二丈石橋各六丈與街等文選注潘岳關中記曰秦作渭水横橋雍州圖曰在長安北二里横門外漢霸橋黄圖霸橋在長安東跨水作橋漢人送客此橋折柳贈别初學記云以石為梁水經注霸水古曰滋水秦穆公更名以顯霸功水上有橋謂之霸橋王莽傳更名霸橋為長存橋漢渭橋便門橋文紀代王乃進至渭橋羣臣拜謁稱臣宋昌至渭橋丞相已下皆迎注蘇林曰在長安北三里宣紀甘露三年春正月呼韓邪單于来朝上自甘泉宿池陽宫上登長平阪注水之南原詔單于毋謁其左右當户之羣皆列觀蠻夷君長王侯迎者數萬人夾道陳上登渭橋咸稱萬嵗匈奴傳上登長平詔單于毋謁其左右當户之羣臣皆得列觀及諸蠻夷君長王侯數萬咸迎於渭橋下夾道陳上登渭橋咸稱萬嵗張釋之傳上行出中渭橋乗輿馬驚文帝時史記景帝五年三月作陽陵渭橋黄圖渭橋秦始皇造跨渭水為橋初學記云以木為梁又云秦造渭橋及横橋後紀建武十九年修理東都城門橋涇渭武紀建元三年春初作便門橋注長安北面西頭門即平門也作橋跨度渭水以趨茂陵今所謂便橋也以徑便為義薛廣徳傳元帝酎祭宗廟出便門注長安城南面西第一門欲御樓船廣徳曰宜從橋元和志便門在長安西門與橋對詳見唐中渭橋段唐書太宗與頡利盟于渭水便橋上水經注渭水上有梁謂之渭橋秦制也亦曰便門橋秦皇作離宫於渭水南北三輔黄圖曰渭水貫都以象天漢横橋南度以法牽牛橋廣六丈南北二百八十步六十八間七百五十柱一百二十二梁橋之南北有隄激立石柱柱南京兆立之柱北馮翊立之有令丞各領徒一千五百人橋之北首壘石水中魏武帝更修之史記索隱今渭橋有三所一所在城西北咸陽路曰西渭橋一所在東北髙陵路曰東渭橋其中渭橋在故城之北原闕秦漢唐架渭者三橋中渭橋在長樂宫北秦造便橋長安西武帝造東渭橋在萬年縣東不知始於何世渭之源出自鳥䑕同穴東受秦水至武功受斜水又東受豐水東北則漢便門橋横亘其上又東為鄗水又東逕磁石門阿房西門也漢飲馬橋黄圖飲馬橋在宣平城門外文選注長安圖曰漢時七里渠有飲馬橋漢成都浮橋吳漢傳建武十二年春漢進軍攻廣都拔之遣輕騎燒成都市橋即七星之一橋也吳華陽國志李氷造七橋上應七星光武謂漢曰安軍宜在七星橋間漢進逼成都去城十餘里阻江北為營作浮橋岑彭傳公孫述横江水起浮橋彭令軍中募攻浮橋先登者上賞飛炬焚之東觀記田戎下江闗至南郡據浮橋於江水吳漢鋸絶横橋大破之水經注建武十一年公孫述遣任滿等據嶮為浮橋横江以絶水路光武遣吳漢岑彭將六萬人擊荆門漢等率舟師攻之直衝浮橋因風縱火遂斬滿等魏夏侯尚圍南郡作浮橋渡百里洲上吳潘璋伐葦作茷欲順流燒橋伺水長當下尚引退梁王瓚據楊村夾河築壘造浮梁晉李存進亦造浮梁於德勝或曰浮梁須竹笮鐵牛石囷我皆無之何以能成存進以葦笮維巨艦繫於土山巨木踰月而成人服其智漢河橋西羌傳永元五年護羌校尉貫友攻迷唐於大小榆谷夾逢留大河築城塢作大航造河橋欲以度兵迷唐逺徙依賜支河曲永元元年春鄧訓發湟中六千人縫革舡置箄上度河掩擊迷唐大破之司馬相如傳橋孫水梁孫原以通卭莋趙充國傳奏治湟陿中道橋令可至鮮水以制西域漢石橋水經注穀水又東屈而逕建春門石橋下即上東門也橋首建兩石柱橋之右柱銘云陽嘉四年乙酉壬申詔書以城下漕渠東通河濟南引江淮方貢委輸所由而至使中謁者魏郡清淵馬憲監作石橋梁柱勅工匠盡要妙之巧三月起作八月畢成其水依柱文自樂里道屈而東出陽渠朱超石與兄書云橋去洛陽宫六七里悉用大石下員以通水可受大舫過題其上云太康三年十一月初就功日用七萬五千人至四月末止齊地記秦始皇作石橋欲度海觀日出東海有石橋始皇造唐文粹趙郡洨河石橋隋匠李春之跡也製造竒特張嘉正柳渙張彧為築蜀漢武功竹橋水經注諸葛亮表云臣遣虎步監孟琰據武功水東司馬懿因水長攻琰營臣作竹橋越水射之橋成馳去魏洛水浮橋蔣濟傳注濟隨司馬宣王屯洛水浮橋文選注河南郡縣境界簿曰城南五里洛水浮橋魏畧洛陽城東西橋洛水浮橋初學記洛陽魏晉以前跨洛有浮橋潘岳賦浮梁黝以徑度成公綏洛褉賦飛橋浮濟造舟為梁魏志曹公西征馬超多設疑兵潛以舟載兵入渭為浮橋夜分兵結營於渭南晉富平河橋武紀泰始十年九月立河橋于富平津十一月立城東七里澗石橋杜預傳預以孟津渡險有覆没之患請建河橋於富平津議者謂殷周所都歴聖賢而不作者必不可立故也預曰造舟為梁則河橋之謂也及橋成武帝從百寮臨㑹舉觴屬預曰非君此橋不立也對曰非陛下之明臣亦不得施其㣲巧初學記洛北富平津跨河有浮橋即杜預所建又云洛陽魏晉以前跨洛有浮橋通典河南府河陽縣古孟津後亦曰富平津浮橋即晉杜元凱所造元和志河陽浮橋架黄河為之以船為脚竹􅦜亘之晉陽秋云杜元凱造河橋於富平津即此是也孟津亦謂富平津春秋後傳赧王五十八年秦始作浮橋于河史記秦昭襄王五十年十二月初作河橋晉朱雀橋紀明帝大寧二年六月丁卯以應詹為護軍將軍假節督朱雀橋南諸軍事吳時南津橋也又名朱雀桁成帝咸康二年十月新作朱雀浮桁孝武寜康元年三月癸丑詔除丹楊竹格等四桁税初學記吳有朱雀橋東晉有朱雀大航四航丹陽竹格朱雀驃騎朱雀本吳時大航咸康二年新立朱雀航對朱雀門南渡淮水亦名朱雀橋後魏渭橋崔亮傳亮除雍州刺史城北渭水淺不通船亮曰杜預造河梁況此有異長河且魏晉亦有橋昔秦居咸陽横橋度渭以像閣道此即以柱為橋㑹大雨水至浮出長木橋成至今名崔公橋唐舟梁陕津浮梁六典水部凡天下造舟之梁四河三洛一河則蒲津大陽盟津一名河陽洛則孝義也石柱之梁四洛三灞一洛則天津永濟中橋灞則灞橋也大柱之梁三皆渭川也便橋中渭橋東渭橋此舉京都之衝要也巨梁十有一皆國工修之其餘則所管州縣隨時營葺百官志諸津令掌舟梁灞橋永濟橋以勲散官一人涖之天津橋中橋以衞士拚掃便橋渭橋萬年三橋有丞貞觀中廢河渠令供祠祀則自便橋至東渭橋禁民漁地理志陕州陕縣有大陽關一曰陕津即茅津貞觀十一年造浮梁通典大陽橋貞觀中丘行恭造舊紀開元二十年四月癸巳改造天津橋㑹要云四月二十一日改造天津橋毁皇津橋合為一橋天寶元年二月廣東都天津橋中橋石脚兩眼以便水勢初學記秦公子鍼奔晉造舟于河在蒲坂夏陽津今蒲津浮橋張説有蒲津橋賛太宗有浮橋詩皮日休河橋賦其形若劒倚天外龍横水心其髙若大虹貫天其壯若巨鼇壓海不檝而濟役鵲踴鯨與波上下唐永濟橋元和志河南府永濟橋在壽安縣西十七里大業三年置架洛水隋亂毁廢貞觀八年修造舟為梁長四十丈三尺廣二丈六尺唐中渭橋便橋元和志中渭橋在咸陽縣東南二十二里本名横橋架渭水上秦皇都咸陽渭水貫都以象天漢横橋南渡以法牽牛渭水南有長樂宫北有咸陽宫欲通二宫之間故造此橋漢末董卓燒之魏文帝更造劉裕入關又毁之後魏重造貞觀十年移於今所便橋在縣西南十里架渭水上武帝建元三年初作便門橋在長安北茂陵東去長安二十里長安城西門曰便門此橋與門相對因號便橋太宗與頡利甞盟于此唐東渭橋見上以鼓吹迓劉晏見漕運建中四年十月命韓游瓌拒泚於便橋劉德信汝鄭應援使以東渭橋有積粟十萬斛癸亥進屯東渭橋十一月丙子李晟自蒲津濟軍于東渭橋馬彚亦屯焉興元元年五月乙未晟自東渭橋移軍光泰門晟復京師帝紀其功自文于碑立于東渭橋碑在橋側跨虹連岸浮黿續航星文瀉漢虹勢凌虚唐大陽橋又見上元和志大陽橋長七十六丈廣二丈架黄河為之在陜縣東北三里貞觀十一年太宗東巡遣武侯將軍丘行恭營造唐天津橋又見上元和志在河南縣北四里隋大業元年初造用大舡維舟以鐵鏁鉤連南北夾路對起四樓其樓為日月表勝之象貞觀十四年更令石工累方石為脚爾雅斗牛之間為天漢之津故取名㑹要先天二年八月敇天津橋除命婦車已外餘車不得令過舊史郭子儀傳奉廣平王入東都陳兵於天津橋南士庶歡呼於路唐洛中橋㑹要顯慶五年五月一日修洛水月堰舊都城洛水天津之東有中橋利涉橋以通行李上元二年司農卿韋機移中橋自立德坊西南置於安衆坊之左南當長夏門上令於中橋南刻一方石列其年辰紀十六字盖黄絹之辭也因廢利涉橋所省萬計韋弘機傳營繕東都作宿羽髙山等宫徙洛中橋於長夏門廢利涉橋人便之通典河南縣天津橋中橋石脚並長壽中中書侍郎李昭德造元和志中橋咸亨三年造唐孝義橋見上㑹要天寶七載四月河南尹韋濟奏於偃師縣東山下開驛路通孝義橋唐河陽浮橋見上晉富平河橋唐肥鄉橋韋景駿傳神龍中景駿為肥鄉令縣北瀕漳水連年泛濫舊防迫漕渠雖峭岸隨即壞決景駿相其地勢益南千步因髙築障水至堤趾輒去其北燥為腴田維艚以梁其上而廢長橋功少費約人立石著功數年後刺趙州道出肥鄉民曰學廬館舍橋鄣皆公所治唐金橋地理志金橋在上黨南二里常有童謡云聖人執節渡金橋景龍三年十月二十五日帝經此橋之京師潘炎賦曰成金橋之巨麗得鐵鏁之宏規倚晴空之螮蝀超渡海之黿鼉非填鵲之可比法牽牛而為狀異東明擊水而投步匪秦帝驅山而着鞭韋皋傳貞元五年東蠻斷瀘水橋攻吐蕃唐鐵牛蒲津橋祥符鐵牛詩地理志河中府河西縣有蒲津關開元十二年鑄八牛于蒲津牛有一人策之牛下有山皆鐵也夾岸以維浮梁通典河東縣後魏大統四年造浮橋九年築城為防唐開元十二年河兩岸開東西門各造鐵牛四鐵人四其牛下並鐵柱連腹入地丈餘并前後鐵柱十六通鑑開元九年新作蒲津橋鎔鐵為牛㑹要開元九年十二月九日增修蒲津橋絙以竹葦引以鐵牛命兵部尚書張説刻石為頌張説蒲津橋贊河有三橋蒲津居其一舊制横絙百丈連艦千艘辮修笮以維之繫圍木以距之開元十二載俾鐵代竹取堅易脆賦晉國之一鼓法周官之六齊飛亷煽炭祝融理罏結為連鎖鎔為伏牛偶立於兩岸襟束於中潬鏁以持航牛以縶纜亦將厭水物奠浮梁賈至陜州鐵牛頌杳冥精兮混茫氣凝為伏牛載厚地巨靈西掌屹屭屓長河東流泙沸渭堅立不動神之至本朝祥符四年二月甲子次河中府度河橋觀鐵牛三月乙亥幸順正廟作鐵牛詩治平三年四月己丑初河中浮梁用鐵牛八維之一牛數萬斤後水漲絶梁牛没于河真定僧懷丙以三大舟實土夹牛維之用木鉤牛徐去土舟浮牛出詔賜懷丙紫衣秦以金牛啖蜀五丁棧褒斜迎之李氷刻石作三犀牛蜀郡蒲江有七橋西南石牛門石犀所潜泉也孔明木牛唐汴橋權懷恩傳嘗過汴州刺史楊德幹以嚴稱汴橋新成立木中涂止過車者謂德幹曰民不可止耶焉用此唐洛陽四橋宋㑹要政和四年宋昇奏西京端門前考唐洛陽圖舊有四橋曰穀水曰黄道在天津橋之北曰重津在南並為疏導洛水又橋之上十里有石堰曰分洛自唐以来引水入小河東南入伊建隆天津橋二年四月西京留守向拱修天津橋成甃石為脚髙數丈鋭其前以疏水埶石縫以鐵鼓絡之詔褒美政和四年八月十日宋昇上修天津橋圖又請修重津黄道橋置分洛堰從之景德奉先橋四年二月西京新造訾店渡橋癸酉賜名奉先祥符大慶橋四年二月丁卯改蒲津橋曰大慶祥符延安橋安國橋五年九月七日車駕臨視新作延安橋先是七月戊辰二日徙汴河廣濟橋於相國寺前牓曰延安又作橋跨惠民河牓曰安國祥符迎真橋六年六月辛未詔昇平橋名曰迎真以欽迎真像由飛梁登寶坐故也四年二月戊辰詔洛水橋名迎蹕渭水橋名省方祥符延福橋皇祐安濟橋六年十二月丁亥賜南薫門内惠民河新橋名曰延福皇祐三年十月辛巳以惠民河新作橋為安濟橋祥符崇真橋六年十一月丁巳賜太清宫東渦水橋名曰崇真八年四月甲子命王欽若撰記亳州北門外渦水橋曰靈津陳堯叟撰記應天府穀熟汴水橋曰按蹕丁謂撰記開封陳留汴水橋曰凝祥王嗣宗撰記景徳二年四月改修京新城諸門外橋並増高之熙寧永通橋寧和橋六年四月十七日庚寅熙州洮河浮梁成賜名永通橋十月延州浮梁成賜名寧和橋趙卨營之以通糧道在黄河渡政和五年六月詔居山至大伾山浮橋名天成大伾至子山浮橋名聖功開寶七年十一月曹彬言大江浮梁成嘉祐二年修澶州浮橋元豊四年十一月十六日滑州浮橋成六年八月十一日命河中府修浮橋隄岸紹興二年六月三日申嚴黄河浮橋之禁揭于兩岸古者辰角見而雨畢則除道天根見而水涸則成梁梁者造舟為之未有橋之名也昔人之覘陳議鄭葢不越是周官道路之修職於司險廬館之備具於遺人其有不由道而横行宵征不由梁而川游徑踰秋官為之厲禁通濟利涉三才一致故辰象昭囘天江臨乎析木鬼神幽助海石到乎扶桑浮黿役鵲超涯截壑斡地泉開盤根玉甃虹舒電拖力將岸争勢與空鬬鄭以乘輿濟人溱洧孟子譏其不知為政陳廢先王之教而川不梁單朝知其必亡彭城橋梁郵亭不修薛宣知其不能陳道茀不可行單襄公知其必亡邸驛郡國朝宿之舍在京者謂之邸郵騎傳遞之館在四方者謂之驛周路室候館周禮遺人凡國野之道十里有廬廬有飲食三十里有宿宿有路室路室有委五十里有市市有候館候館有積注廬若今野候徒有庌也宿可止宿若今亭有室候館樓可以觀望者也委人凡軍旅賓客館焉大僕以待達窮者與遽令注遽令郵驛上下程品環人舍則授館司儀致館如初之儀小行人郊勞眡館懷方氏治其委積館舍飲食行夫掌邦國傳遽之小事聘禮管人注掌客館者國語周之秩官候人為導司里授館周之設官行人掌其籍懷方治其舍象胥相其禮委積飲食送迎出入各有司存周三百六十官職掌之關乎賓客者七十有六天官所總實居十八盖自司關敂關以告司徒令野修道委積掌訝逆賓于疆於是共禮酒共陳酒共稍禮共齊葅以至牢米灋羊澤物幣齊各庀其事司儀致館環人授館小行人眡館盖無一而不周當是時也不獨朝賓國客為然有委積焉甸聚焉以待覊旅雖行道之人亦有廬有宿以舍之食之隷館以責晉輿梁以議鄭里候以覘陳不曰道涂館舍為不急之務也晉文公崇大諸侯之館諸侯賓至甸設庭燎僕人廵宫車馬有所賓從有代巾車脂轄隷人牧圉各瞻其事百官之屬各展其物後以隷垣羸諸侯鄭僑知其必衰漢郡國邸百官表典客有郡邸長丞各一人初置郡國邸屬少府中屬中尉後屬大鴻臚注師古曰主諸郡之邸在京師者也朝宿之舍朱買臣傳常從會稽守邸者寄食服䖍曰有守邸丞步歸郡邸直上計時宣紀猶坐收繫郡邸獄註師古曰漢舊儀郡邸獄治天下郡國上計者屬大鴻臚哀紀召定陶王立為皇太子謝曰願且得留國邸旦夕奉問起居母將隆傳宜召定陶王使在國邸以填萬方季布為河東守至留邸一月是郡有邸也齊王肥入朝吕后置酒齊邸盧綰子降舍燕邸申公舍魯邸是國有邸也何武為揚州刺史奏事至邸是刺史有邸也郅支首縣蠻夷邸門是蠻夷亦有邸也揚雄書云雄作縣邸銘續志中興但令郎治郡邸注永元十年大匠應順言百郡計吏觀國之光而舍逆旅崎嶇私館朝㑹邈逺事不肅給昔伯國盟主耳舍諸侯於隷人子産以為譏況四海之大乎和帝嘉納即創焉黄香傳元和中千乗王冠帝㑹中山邸詔香殿下謂諸王曰此天下無雙江夏黄童也何進傳引兵入屯百郡邸陸機洛陽記百郡邸在洛城中東城下步廣里所以通奏報待朝宿漢亭候郵亭傳置百官表十里一亭亭有長十亭一鄉鄉有三老有秩嗇夫游徼皆秦制也帝紀髙祖為泗上亭長注師古曰秦法十里一亭亭長主亭之吏也亭謂停留行旅宿食之館應劭曰亭有兩卒一為亭父掌開閉掃除一為求盗掌逐捕盜賊續志亭有亭長以禁盜賊漢官儀十里一亭亭長亭候五里一郵郵間相去二里半文帝二年十一月詔曰云云以給傳置注師古曰置者置傳驛之所因名置平帝元始五年正月詔置宗師考察不從教令者宗師得因郵亭書言宗伯注師古曰郵行書舍也列傳酈食其沛公至髙陽傳舍傳置之舍使人召食其夏侯嬰為沛廏司御毎送使客還過泗上亭與髙祖語韓信四年漢王從張耳軍修武至宿傳舍晨馳入壁奪其印符賈誼疏斥候望烽燧不得卧張騫開外國道云云天子虜樓蘭王酒泉列亭障至玉門汲黯曰匈奴畔其主而歸漢徐以縣次傳之趙充國奏繕治郵亭見屯田類黄霸守頴川使郵亭鄉官皆蓄雞豚吏出不敢舍郵亭薛惠為彭城令橋梁郵亭不修注師古曰郵如今之驛及行道館舍也霍光昭帝曰將軍之廣明都郎注廣明亭名貢禹言官奴婢宜令代關東戍卒乗北邊亭塞候望龔勝邴漢歸詔行道舍傳舍縣次食從者及焉匈奴傳太初三年光禄徐自為出五原塞數百里逺者千里築城障列亭至盧朐使韓説衛伉屯其旁其秋匈奴壞光禄所築亭障昭帝時漢邊郡㷭火候望精明匈奴為邊寇者少利希復犯塞元帝時侯應曰孝武建塞徼起亭隧築外城設屯戍以守隂山前以罷外城省亭隧令裁足以候望通㷭火而已地節二年罷外城食貨志元封四年冬天子北出蕭關從數萬騎行獵新秦中勒邊兵而歸新秦中或千里無亭徼誅北郡太守以下史大事記元光六年南夷始置郵亭光武紀建武十三年十二月遣驃騎大將軍杜茂屯北邊築亭候修烽燧杜茂傳建武十二年遣謁者段忠將弛刑鎮守北邊因發邊卒築亭候王霸傳建武十二年與杜茂治飛狐道築起亭障自代至平城三百餘里馬成傳建武十四年代杜茂繕治障塞自西河至渭橋河上至安邑太原至井陘中山至鄴皆築保壁起熢燧十里一候南匈奴傳光武初平諸夏建武六年始通好數與盧芳共侵北邊十三年冦河東轉居塞内朝廷患之増縁邊兵部數千人大築亭候修烽火二十六年冬北單于追擊南部乃詔南單于徙居西河遣將衛之南單于列置諸部北單于惶恐頗還所掠漢人鈔兵毎到南部下還過亭候輒謝曰自擊亡虜薁鞬日逐耳非敢犯漢人也又建武二十二年烏桓破匈奴匈奴北徙幕南地空詔罷諸邊郡亭候吏卒衛颯傳遷桂陽太守三縣去郡遠且千里毎一吏出徭及數家颯乃鑿山通道五百餘里列亭傳置郵驛於是役省勞息章帝紀贊戎亭虚候和帝紀舊南海獻龍眼荔支十里一置五里一候帝罷之順帝紀永和五年九月令扶風漢陽築隴道塢三百所置屯兵西羌傳元初三年秋築馮翊北界候塢五百所禮掌節注如今郵行有程東京賦西登少華亭候修勅漢代邸文紀太尉勃上天子璽代王謝曰至邸而議之閏月己酉入代邸羣臣從至遂即位奉天子法駕迎代邸注師古曰郡國朝宿之舍在京師者率名邸邸至也言所歸至也漢甘泉諸侯邸郊祀志太初元年受計甘泉其後天子又朝諸侯于甘泉作諸侯邸劉澤傳田生説張卿曰諸侯邸第百餘皆髙帝一切功臣漢單于邸蠻夷邸質館見館類匈奴傳元封中漢使王烏等如匈奴匈奴紿曰吾欲入漢見天子面相結為兄弟王烏歸報漢漢為單于築邸于長安單于殊無意入漢遣太子来質宣紀甘露三年春正月行幸甘泉匈奴呼韓邪單于来朝贊謁稱藩臣而不名使有司道單于先行就邸長安宿長平上登長平阪詔單于毋謁其左右當户之羣皆列觀蠻夷君長王侯迎者數萬人夾道陳上登渭橋咸稱萬嵗單于就邸置酒建章宫饗賜單于二月歸元紀建昭三年冬斬郅支單于首傳詣京師縣蠻夷邸門注師古曰蠻夷邸若今鴻臚客館陳湯傳延壽湯上疏曰斬郅支首及名王以下宜縣頭槀街蠻夷邸間注晉灼曰黄圖在長安城門内師古曰槀街街名蠻夷邸在此街也邸若今鴻臚客館段㑹宗傳宛王郅支頭縣槀街烏孫所知也後西域傳永元六年都護班超斬焉耆尉黎王首縣蠻夷邸注若今鴻臚寺唐薛登曰斥居塞外有時朝謁已事則歸三王之法也漢魏以来革襲衣冠築室京師不令歸國較其利害三王是而漢魏非拒邊長而質子短漢六王邸見大駕宫漢都亭魏都亭張綱傳漢安元年選遣八使徇行風俗綱獨埋其車輪於洛陽都亭曰豺狼當路安問狐狸何進傳中平元年為大將軍率左右羽林五營士屯都亭司馬相如傳徃舍都亭注臨卭所治都之亭嚴延年傳母到雒陽止都亭不肯入府魏都賦營客館以周坊飭賓侣之所集偉豐樓之閈閎起建安而首立葺牆羃室房廡雜襲廣成之傳無以儔史記秦舍藺相如廣成傳槀街之邸不能及注鄴城都亭北有大邸起樓門臨道建安中所立漢籌筆驛在蜀路諸葛孔明亮籌畫於此山水最秀殷潛之杜牧石延年有詩廏置田横傳善置曹參傳騎置李陵傳卭郵淮南王傳行書之舍鄭當時傳為太子舍人每五日洗沐當置驛馬長安諸郊王温舒傳為河内太守令郡具私馬五十匹為驛自河内至長安丙吉傳馭吏見驛騎持赤白囊邊郡發奔命書馳来至馭吏因隨驛騎至公車刺取陳湯傳段㑹宗為烏孫兵所圍驛騎上書續志驛馬三十里一置卒皆赤幘注臣昭案東晉猶有郵驛東平王蒼傳驛馬千里傳問起居禮太僕注遽傳也若今時驛馬軍書當急聞者髙紀注師古曰傳者若今之驛古者以車謂之傳車其後又單置馬謂之驛騎宋南北客館梁典客館唐六典周禮掌客上士二人漢鴻臚有行人武帝改行令魏改曰客館令晉曰典客宋永初中分置南北客館令丞齊有客館令梁有典客館令丞後魏置主客令隋鴻臚卿統典客令後改曰典蕃又於建國門外置四方館待四方使客各掌方國及互市事唐以四方館隷中書注云代宗永泰後事多留滯四夷使者及四方奏計連嵗不遣於右銀臺門置客省以處之大厯十四年七月德宗罷之晉庾翼綏來荒逺務盡招納之宜立客館置典賓齊王融兼主客接魏使陳潘徽為客館令元魏於洛水橋南御道東作四館金陵燕然扶桑崦嵫道西立四里隋四方館六典注隋開皇三年置謁者臺改舍人為通事謁者置四方館於建國門外隷鴻臚寺待四方使者唐廢謁者臺四方館屬中書省太和二年六月賜印以中書省四方館為名五年四月鑄内外客省使印唐諸州邸鴻臚客館四方館見館類進奏院太宗紀貞觀十七年十月丁未建諸州邸于京城通典至永淳中諸州邸舍漸毁㑹要貞觀十五年正月上謂侍臣曰古者諸侯入朝有湯沐邑芻禾百車待以客禮漢為諸侯刺史郡守立邸舍於京城頃聞都督刺史充考使至京師與商人雜居禮不足人多怨至十七年十月一日下詔令就京城為諸州朝集使造邸第三百餘所上親觀幸焉神龍元年司農卿趙履温奏請出賣開元十九年十二月十三日勅鴻臚官吏施門籍出入其譯語掌客出入客館者於長官下狀牒館門建中元年十月二十九日勅毎州邸第令本州營置二年五月十四日户部奏以官宅數十所分居舊紀大厯十二年五月甲寅諸道邸務在上都吏曰留後改為進奏院兩京記承天門西第七街北從東第一曰鴻臚寺次西鴻臚客館如漢之臺街邸四夷慕化及朝獻者之所居六典鴻臚有典客令凡酋渠朝見館而以禮供之周有掌客上士二人栁宗元邠寧進奏院記凡諸侯述職之禮必有棟宇建于京師朝覲為修容之地㑹計為交政之所其在周典則皆邑以具湯沐其在漢制則皆邸以奉朝請唐興因之則皆院以備進奏唐都亭驛詳見後㑹要貞觀十九年征遼發定州太子請飛驛遞表起居飛表奏亊自兹始開元十五年四月勅兩京都亭驛出使人毋淹留二十八年六月一云二十九年六月丙辰停水驛貞元二年十二月勅自上都至汴州為大路驛至荆南為次路驛元和初以官人為館驛使李吉甫奏罷之十二年十二月復以中人領使左補闕裴潾諫曰畿内有京兆尹道有觀察使刺史監臨臺又御史為使云云不從六典以監察第一御史主郵驛寶厯二年二月鳳翔置驛三曰渭陽通蜀安途山南新置斜谷路剙驛三曰垂闕武興右界李渤傳元和十三年使潞州言道茀不治詔出飛龍馬數百給畿驛郭子儀傳乾元元年破賊河上遂朝京師詔百官迎於長樂驛帝御望春樓待之回紇傳置過郵六十八所見上孫樵書襃城驛元稹陽城驛詩南有陽城驛名同陽道州我願避公諱名為避賢郵韓愈記宜城驛唐兩京館驛傳驛又見上㑹要開元十六年七月敇傳驛因御史出使察之二十五年五月御史鄭審檢校兩京館驛猶未稱使今驛門前十二辰堆即審剙焉乾元元年三月以度支郎第五琦充使大厯五年九月以京兆尹充使十四年九月各以御史知驛遂稱使桞宗元館驛使壁記曰館驛之制於千里之内尤重自萬年至于渭南其驛六其蔽曰華州其關曰潼關自華而北界于櫟陽其驛六其蔽曰同州其關曰蒲津自灞而南至于藍田其驛六其蔽曰商州其關曰武關自長安至于盩厔其驛十有一其蔽曰洋州其關曰華陽自武功西至于好畤其驛三其蔽曰鳳翔其關曰隴關自渭而北至于華原其驛九其蔽曰坊州自咸陽而西至于奉天其驛六其蔽曰邠州由四海之内總而合之以至于關由關之内束而㑹之以至于王都華人夷人徃復而授館者旁午而至傳吏奉符而閱其數縣吏執牘而書其物告至告去之役不絶於道寓望迎勞之禮無曠於日而春秋朝陵之邑皆有傳館其餼饋繕修於是有出納之數考㑹之政大厯十四年始令御史為之使俾考其成以質于尚書李月之晦必合其簿書以視等列校其信宿貞元十九年韓泰告于上始鑄使印而正其名百官志駕部掌傳驛凡三十里有驛驛有長舉天下四方之所達為驛千六百三十九水驛有舟六典駕部郎中掌天下傳驛凡三十里一驛驛有長天下凡一千六百三十九所三百六十所水驛一千二百九十七所陸驛八十六所水陸相兼理道要訣云驛千三百八十八李吉甫傳元和八年㑹要九年四月傳言回鶻入冦因請起夏州至天德復驛候十一區以通緩急舊紀元和八年十一月丙寅自夏州至豐州初置八驛唐郵驛條式㑹要貞元八年舊紀閏月癸酉門下省奏郵驛條式應給紙劵六典之制以監察第二御史主郵驛宋朝都亭驛班荆館晉天福五年九月戊子改東京上源驛為都亭驛在光化坊舊制待河西蕃部開寶六年七月辛酉幸都亭驛八年三月二十六日契丹使来聘館都亭驛景徳四年二月十八日宴宗室百官於都亭驛其後專館契丹使崇寧元年重修九月五日畢又景陽門外有班荆館為迎餞之所隷北驛紹興十四年五月甲子初建于臨安十二月成以館北使一云十二年三月十六日畢功宋朝禮賔院在歸德坊掌蕃夷朝貢互市興國二年九月勃泥朝貢館於是院舊有蕃譯院景德三年併入熙寧九年四月省禮賔院監官唐元和九年六月乙未置禮賓院於長興里之北宋朝客省四方館志客省使二人在閤門西掌四方諸蕃國朝貢之儀物還則授以賜予詔書四方館使二人在朝堂門外掌通元日冬至朔旦之表章郊祀則定蕃國使陪祠之服位大朝㑹亦如之紹興四年四月七日詔隷中書省不隷臺察五年六月九日詔知閤門事兼客省四方館事初建炎元年十二月二十一日以西上閤門引進司四方館併歸閤門客省先是慶厯四年十一月詔引進使四方館使並兼領閤門公事元豐七年四月二十二日詔客省四方館使副官最髙者一員兼領閤門事景德懷逺驛初周世宗顯德五年五月江南稱藩城東置懷信驛以待其使四年四月改赤倉驛為通吴驛辛丑幸皇朝興國二年八月四日改為都亭驛以館契丹使其諸蕃客使止於公府景德三年十二月辛巳作懷逺驛於汴河北以待南蕃交州西蕃大食龜兹于闐甘州等貢奉客使䂓度侍衛都虞候舊廨為之在興道坊交初館契丹後館趾祥符六年五月甲寅以驛增修為皇姪惟正等南宅紹興二十五年安南入貢六月九日詔行驛以懷逺為名十一月十六日賜占城使宴享于懷逺驛先是十四年新祕書省成以舊省為懷逺驛二十六年十二月二十七日賜三佛齊使宴于懷逺驛乾道二年八月十一日廢為臺諫廨舍九年十一月一日詔權以貢院為懷逺驛事已依舊祥符都亭西驛舊曰上源西驛在惠寧西坊掌河西蕃部貢奉祥符元年改今名祥符九年四月七日以京城西舊染院為夏州蕃驛熙寧五年四月乙亥命修都亭驛以待夏使祥符迎鑾驛元年五月九日庚午改鄆州臨酅驛曰迎鑾砂溝驛曰翔鑾六月十四日癸卯改兖州葛石驛曰回鑾知溝驛曰太平熙寧来遠驛在崇化坊熙寧三年五月戊午十九日置以待蕃客以馬軍都虞候舊廨増葺西八年閏四月十八日詔都亭驛監官兼領紹興六年十月二十四日戊午以廣州奉真觀為来逺驛從舶司之請以備招来諸國貢使熙寧同文館在延秋坊熙寧中置以待髙麗使舍宇一百七十八間七年正月以内臣掌之紹興三年二月四日以髙麗遣使入貢詔葺法慧寺為之旣而不至都亭以待大遼都亭西驛以待西蕃阿黎于闐新羅渤海懷遠以待交趾同文以待青唐髙麗元豐樂賓館通津驛元豐二年明州及定海縣作髙麗貢使館五月二十五日賜名樂賓亭曰航濟四年十月二十一日名滑州新作遼使驛曰通津初題曰武成詔改是名元祐元年八月二日詔河陽剙修北使驛亭温縣宿頓以至德河陽縣中頓以清沇汜水縣中頓以行慶館為名本朝諸路郵傳毎二十五里置一遞役卒十有二人軍興以来凡通蜀道者皆増斥堠遞九里一置其後黄敏行措置江浙荆襄之間舊無斥堠者一切創增漢唐之興建邸槀街築館鴻臚以隷垣覘晉司里覘陳玉海卷一百七十二
