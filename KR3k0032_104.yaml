body:
  text: 玉海卷一百四宋王應麟撰音樂樂二漢制氏雅樂宗廟樂休成樂志漢興樂家有制氏藝文志同以雅樂聲律世世在太樂官但能紀鏗鏘鼓舞不能言其義髙祖時叔孫通因秦樂人制宗廟樂大祝迎神於廟門奏嘉至猶古降神之樂也皇帝入廟門奏永至以為行步之節猶古采齊肆夏也乾豆上奏登歌獨上歌不以管絃亂人聲欲在位者遍聞之猶古清廟之歌也登歌再終下奏休成之樂注服虔曰叔孫通所奏作也美神明既享也皇帝就酒東箱坐定奏永安之樂美禮已成也又見舞類後志注制禮記祭先師注樂有氏漢昭容禮容樂志髙祖六年作昭容樂禮容樂昭容猶古昭夏也主出武德舞禮容主出文始五行舞舞入無樂將至至尊之前不敢以樂也出用樂者言舞不失節能以樂終也大抵皆因秦舊事焉注言昭容樂生於武德舞魏改昭容曰昭業樂隋志牛弘曰昭容生於武德猶古之韶禮容生於文始矯秦之五行漢安丗房中樂志又有房中祠樂髙祖唐山夫人所作也周有房中樂至秦名曰夀人凡樂樂其所生禮不忘本髙祖樂楚聲故房中樂楚聲也孝惠二年使樂府令夏侯寬備其簫管更名曰安世樂安世房中歌十七章其詩曰大孝備矣七始華始我定厯數王侯秉德海內有姦大海蕩蕩安其所豐草葽雷震震桂華美芳磑磑即即嘉薦芳矣皇皇鴻明浚則師德孔容之常承帝明德古詩皆有篇名獨桂英美芳兩章名存劉原父疑本十二章首章曰大孝備矣休德昭清髙張四縣樂充宫廷芬樹羽林師古曰羽葆其盛若林雲景杳冥金支秀華庶旄翠旌張晏曰金支百二十支旄鐘之旄也文頴曰析羽為旌翠羽為之臣瓉曰樂上衆飾有流遡羽葆以黃金為支其首敷散若草木之秀華也師古曰瓉説是也庶旄翠旌謂析五采羽注翠旄之首而為旌七始華始肅倡和聲神來宴娭庶幾見聽末章云承帝明德師象山則雲施稱民永受厥福承容之常承帝之明下民安樂受福無疆孔光何武奏安丗樂鼓員二十人十九人可罷凡鼓八朝賀置酒陳前殿房中不應經法晉志元會别置女樂三十人於黃帳外奏房中之歌宋志魏使王粲改作安丗詩大和初侍中繆襲奏安世歌本漢時歌名按周禮注云安丗樂猶周房中之樂也往昔議者以房中歌后妃之德以風天下正夫婦宜改安世之名曰正始之樂魏初侍中王粲所作登歌安世詩專以思詠神靈及鑒享之意襲又省讀漢安世歌詠亦説髙張四縣神來燕享嘉薦令儀永受厥福無有二南后妃風化天下之言謂房中為后妃之歌恐失其意宜改安世曰享神歌奏可文帝已改安世為正始襲至是又改安世為享神未詳其義王粲所造安世詩今亡隋志內宫所奏天髙地厚二曲於房中奏之栁顧言增房內樂益其鐘磬歌鐘歌磬各設二虡土革絲竹副之并升歌下管奏議曰為王后弦歌諷誦而事君子故以房室為名燕禮鄉飲酒禮亦取而用磬師職云燕樂之鐘磬鄭玄曰房內樂也所謂陰聲金石備矣內宰詔其禮樂之儀鄭玄云薦撤之禮當與樂相應通典周有房中之樂以歌后妃之德按通典漢志秦時古樂惟舜大韶周大武房中樂存飛文選注漢書曰房中樂有龍章飛龍秋遊上天書大傳古者后夫人入御於君雞初鳴大師奏雞鳴於陛下夫人鳴佩玉於房中告去也應門擊柝告辟也漢志都荔遂芳窅窊桂華注臣瓉曰茂陵中書歌都孋桂英美芳鼓行漢修六代樂劉子文武篇漢祖海內大定以文止戈召鄒魯儒生而制禮儀修六代之樂朝諸侯於咸陽淮南子齊俗訓有虞樂咸池承雲九韶注舜兼用黃帝樂夏后氏夏籥九成六伯六列六英注禹兼用顓頊六英殷大濩晨露周大武三象棘下汜論訓堯大章舜九韶禹大夏湯大濩周武象此樂之不同也闕里作六代樂見後宋志周存六代之樂至秦惟餘韶武而已始皇改周舞曰五行漢髙祖改韶舞曰文始以示不相襲也司馬相如上林賦韶濩武象之樂漢廟樂景帝紀元年十月詔曰髙廟奏武德文始五行之舞孝惠廟文始五行之舞文帝廟樂不稱其為文帝廟為昭德之舞宣紀本始二年十月詔議廟樂夏侯勝傳宣帝初即位欲褒先帝詔丞相御史曰武帝功德茂盛而廟樂未稱其與列侯二千石博士議於是羣臣大議廷中皆曰宜如詔書長信少府勝獨曰亡德澤於民不宜為立廟樂公卿共難云云有司遂請尊孝武廟為世宗廟奏盛德文始五行之舞漢樂記河間雜樂郊廟詩歌周樂典禮樂志叔孫通沒後河間獻王采禮樂古事稍稍增緝至五百餘篇今學者不能昭見但推士禮以及天子説義又頗繆異河間獻王有雅材以為治道非禮樂不成因獻所集雅樂天子下大樂官常存肄之嵗時以備數然不常御今漢郊廟詩歌未有祖宗之事八音調均又不協鐘律內有掖庭材人外有上林樂府皆以鄭聲施於朝廷至成帝時謁者常山王禹世受河間樂能説其義弟子宋曅等上書言之下大夫博士平當等考試以為漢承秦後賴先帝聖德博受兼聽修廢官立太學獻王聘求幽隱修興雅樂以助化大儒公孫弘董仲舒等皆以為音中正雅立之大樂春秋鄉射作於學宫希濶不講故自公卿大夫觀聽者但聞其鏗鏘不曉其意而欲與風諭衆庶其道無由今曅等守習孤學大指歸於興助教化宜領屬雅樂以繼絶表微風示海內事下公卿以為久逺難明當議復寢志孔光奏兼給事雅樂用四人給事雅樂六十一人可罷藝文志六國之君魏文侯最好古孝文時得其樂人竇公獻其書乃周官大宗伯之大司樂章也武帝時河間獻王與毛生等共采周官及諸子言樂事者以作樂記獻八佾舞與制氏不相逺其內史丞王定傳之以授常山王禹禹成帝時數言其義獻二十四卷記劉向校書得樂記二十三篇與禹不同其道寖微記正義曰向所校著於别録樂記二十三篇王禹記二十四篇史記樂書取樂記周禮樂師注貍首在樂記禮記正義二十四卷記無所録其二十三篇之目今總存焉鄭目録云樂記者以其記樂之義蓋十一篇合為一篇樂本樂論樂施樂言樂禮樂情樂化樂象一云象法賔牟賈師乙魏文侯已上今樂記所取今樂記有魏文侯乃次賔牟賈師乙為末則今十一篇之次與别録不同其樂本已下亦雜亂故鄭目録略有分别鄭目録第三樂施今記者以樂禮為第三餘有十二篇其名猶在奏樂第十二樂器樂作意始樂穆説律季札樂道樂義昭本昭頌竇公已上十二篇名存書亡三總為二十篇按别録禮記四十九篇樂記第十九則樂記十一篇入禮記在劉向前通鑑元光五年冬十月河間王來朝獻雅樂對三雍宫及詔䇿所問三十餘事其對推道術而言得事之中文約指明獻王修學好古實事求是修禮樂被服儒術造次必於儒者隋志沈約云樂記取公孫尼子史記正義樂記公孫尼子次撰蔡雍明堂論引樂記曰武王伐殷為俘馘于亰太室周語召公曰瞽獻典注瞽樂師典樂典也荀子有樂論王莽立樂經益博士員漢樂元語記明堂位疏白虎通云樂元語曰東夷之樂曰朝離萬物微離地而生南夷樂曰南南任也任養萬物西南樂曰味味昧也取晦昧之義北夷樂曰禁言萬物禁藏鈎命決亦云東夷樂曰昧南夷樂曰南漢食貨志樂語有五均注鄧展曰樂元語河間獻王所傳道五均事瓉曰其文云天子取諸侯之士以立五均則市無二賈四民常均白虎通禮樂篇樂元語曰受命而六樂樂先王之樂明有法也東夷之樂持矛舞南持羽西持戟北持干舞周書大聚云市有五均早暮如一注均平也言早暮一價漢神樂兒寬傳為御史大夫從東封泰山還登明堂上夀曰陛下祖立明堂辟雍宗祀泰一六律五聲幽贊聖意神樂四合各有方象以承嘉祀為萬世則注如淳曰四方色及五神祭祀聲樂各有等癸亥宗祀郊祀歌十九章雜見樂舞之制五音之飭虞承靈億鳴琴竽瑟咸會軒朱璆磬金鼓鐘石羽籥空桑琴瑟鐘鼓竽笙五音六律依韋饗昭雜變並會雅聲逺姚此樂之器也衆嫭竒麗以吟青黃展詩應律九歌畢奏函宫吐角揚羽申商嘉虞二觴臚歡騰歌此樂之歌也至於雲舞翔翔千童八溢王梢招搖四興遞代而舞備矣合好效勸神夕奄虞所謂神樂四合者此也樂書正月上辛祠太一甘泉使七十人俱歌春歌青陽夏歌朱明秋歌西皥冬歌玄冥封禪書禱祠太一后土始用樂舞益召歌兒作二十五絃及空侯琴瑟宋志蔡雍論敘漢樂一曰郊廟神靈霍光傳泰一宗廟樂人漢四時樂志郊祀歌練時日一靈安留吟青黃注師古曰吟謂歌誦青黃謂四時之樂也青陽朱明西皓玄冥鄒子樂漢正樂定員志孔光何武奏樂人員大凡八百二十九人其三百八十八人不可罷可領屬大樂其四百四十一人不應經法皆可罷南齊書崔祖思曰漢太樂伶官云云正樂定員惟置三百八十八人漢古兵法武樂黃門武樂黃門鼓吹鼓吹曲又見前前志哀帝罷樂府詔郊祭樂及古兵法武樂在經非鄭衛之樂者條奏别屬他官丞相孔光大司空何武奏大樂鼓至兹邡鼓凡鼓十二員百二十八人朝賀置酒陳殿下應古兵法祭遵傳建武八年秋從車駕上隴及囂破帝東歸過汧幸遵營勞享士卒作黃門武樂良夜乃罷注前書曰時名倡皆習黃門武樂執干戚而舞也文選注引桓談新論曰漢之三主內置黃門工倡周禮旄人注散樂乃為樂之善者若今黃門倡安紀永初元年九月壬午詔太僕少府減黃門鼓吹以補羽林士注漢官儀曰黃門鼓吹百四十五人西京雜記黃門前部鼓吹左右各一部十三人唐六典注漢少府屬官有承華令典黃門鼓吹百三十五人百戲師二十七人東夷傳順帝永和元年夫餘王來朝帝作黃門鼓吹角抵以遣之班超傳建初八年拜將兵長史假鼓吹幢麾注元始二年使謁者大司馬掾持節行邉兵遣執金吾候陳茂假以鉦鼓古今樂録曰橫吹胡樂也張騫入西域傳其法於長安惟得摩訶兜勒一曲李延年因之更造新聲二十八解乘輿以為武樂後漢以給邉將萬人將軍得之晉志橫吹有雙角即胡樂也云云和帝時萬人將軍得之晉魏以來有黃鵠隴頭出關入關出塞入塞折楊栁黃覃子赤之楊望行人十曲宋志漢樂四品其三曰黃門鼓吹建初録云務成黃爵玄雲逺期皆騎吹曲列殿庭為鼓吹從行為騎吹二曲異也魏髙句麗傳漢時賜鼓吹伎人通典張騫使西域得摩訶兜勒曲漢武採之以為鼓吹晉簡文紀太和元年給羽葆鼓吹班劒六十人通典漢鼓吹曲有鐃歌唐志樂類漢魏吳晉鼓吹曲四卷鼓吹樂章一卷詩正義楚威王時有朱鷺合沓飛翔而來舞舊鼓吹朱鷺曲是也晉志漢時有短簫鐃歌之樂其曲有朱鷺思悲翁艾如張上之回雍離戰城南巫山髙上陵將進酒君馬黃芳樹有所思雉子班聖人出上邪一作雅臨髙臺逺如期石留務成玄雲黃爵行釣竿多序戰陳之事列於鼓吹韓延夀在東郡植羽葆鼓車吹車班一以財雄邉出入弋獵旌旗鼓吹段熲為并州刺史召還乘輕車介士鼓吹曲蓋吳諸葛恪拜將軍授棨戟武騎三百備威儀作鼓吹周瑜賜鼓吹吳質為北中郎將詔將軍列鹵簿作鼓吹晉泰始三年羅憲進位冠軍假節給大車增鼓吹棨戟曹植有謝鼓吹表云簫管之樂陸機鼓吹賦曰原鼓吹之攸始蓋稟命於黃軒鼓砰砰以輕投簫嘈嘈而微吟詠悲翁之流思怨髙臺之難臨詳見樂章漢樂六家藝文志凡樂六家百六十五篇樂記二十三篇王禹記二十四篇雅歌詩四篇雅琴趙氏七篇名定雅琴師氏八篇名中雅琴龍氏九十九篇名德隋志梁沈約曰秦代滅學樂經殘亡武帝時河間獻王與毛生等共採周官及諸子言樂事者以作樂記劉向别録有樂歌詩四篇云云龍氏雅琴百六篇惟此而已晉中經簿無復樂書别録所載已復亡逸隋經籍志樂緯三卷宋均注張純傳云樂動聲儀注樂緯文選注二禮正義皆引之詩正義引樂緯稽耀嘉宋均注隋志引樂稽耀嘉動聲儀選注引稽耀嘉後律志注引叶圖徴漢樂元起唐志桓談樂元起二卷又琴操二卷新論有琴道篇鼓本傳好音律善琴蔡雍傳著敘樂班超傳注引古今樂録五行志注引阮籍樂論隋志樂元二卷魏僧撰歷代樂名一卷漢樂經見後迎氣樂隋志梁沈約曰秦代滅學樂經殘亡王莽傳元始四年立樂經三禮圖曰舊圖引樂經云黃鐘磬云云馮相氏注樂説説嵗星與日常應太嵗月建以見續律厯志注鮑鄴引樂經周禮磬氏疏按樂云磬前長三律二尺七寸後長二律尺八寸是磬有大小之制也與三禮圖所引樂經同論衡曰陽成子長作樂經尚書大傳樂曰舟張辟雍鶬鶬相從八風回回鳯凰喈喈吕氏春秋仲夏紀有大樂侈樂適音古樂篇季夏紀有音律音初制樂篇隋經籍志有樂經四卷唐志李玄楚樂經三十卷漢南郊樂郊祭樂祭祀志世祖二月辛卯祭天泰山下南方羣神皆從用樂如南郊永平二年祀五帝明堂奏樂如南郊通典光武平隴蜀增廣郊祀建武十二年益州傳送公孫述瞽師郊廟樂器始備髙祖配食樂奏青陽朱明西皓玄冥雲翹育命之舞明堂北郊並奏樂如南郊迎時氣五郊春夏舞雲翹秋冬舞育命季夏歌朱明兼二舞前志哀帝詔郊祭樂條奏别屬他官丞相孔光奏郊祭樂人員六十二人給祠南北郊外郊祭員十三人諸族樂人兼雲招給祠南郊用六十七人不可罷漢郊廟樂器光武紀建武十三年益州傳送公孫述瞽師郊廟樂器葆車輿輦法物始備續志司空凡郊祀之事掌掃除樂器隋志周官大司樂一千三百三十九人漢郊廟及武樂三百八十人漢雅樂郎杜夔能曉樂事八音七始靡不兼該劉貺大樂壁記云漢祖飾干戚之容光武尊郊祀之樂漢四品樂十二門詩五方樂後禮儀志注蔡雍禮樂志曰漢樂四品一曰大豫樂典郊廟上陵殿諸食舉之樂郊樂易所謂先王以作樂崇德殷薦上帝周官若樂六變則天神皆降可得而理也宗廟樂虞書所謂琴瑟以詠祖考來格詩肅雍和鳴先祖是聽食舉樂王制天子食舉以樂周官王大食則令奏鐘鼓二曰周頌雅樂典辟雍饗射六宗社稷之樂辟雍饗射孝經所謂移風易俗莫善於樂禮記曰揖讓而治天下者禮樂之謂也社稷所謂琴瑟擊鼓以御田祖者也禮記曰夫樂施於金石越乎聲音用乎宗廟社稷祀乎山川鬼神三曰黃門鼓吹天子所以燕樂羣臣詩所謂坎坎鼓我蹲蹲舞我者也其短簫鐃歌軍樂也其傳曰黃帝岐伯所作以建威揚德風勸士也蓋周官所謂王大捷令凱樂軍大獻令凱歌者也孝章皇帝親著歌詩四章列在食舉又制靈臺十二門詩各以其月祀而奏之祭祀志章帝元和二年四月作詩靈帝熹平四年正月中出靈臺十二門詩下大豫樂官習誦被聲與舊詩並行者皆當撰録以成樂志四品樂者大豫樂雅頌樂黃門鼓吹黃帝凱樂軍樂也律厯志注薛瑩書曰上以太常樂丞鮑鄴等上樂事下車騎將軍馬防防奏言建初二年七月鄴上言王者有食舉之樂所以順天地養神明求福應也今官樂但有大蔟皆不應月律可作十二月均各應其月氣乃能感天地和氣宜應明帝始令靈臺六律候而未設其門樂經曰十二月行之所以宣氣豐物也月開斗建之門而奏歌其律誠宜施行詔下太常太常言作樂器直錢百四十六萬上奏寢今明詔下臣防臣愚以為可順上天之明特因嵗首令正發太蔟之律奏雅頌之音其條貫甚備詔以防言下三公晉樂志永平三年官之司樂改名大豫道鄰雅頌事邇中和其有五方之樂即大樂九變天神可禮者也宗廟之樂社稷之樂辟雍之樂黃門之樂短簫之樂魏杜夔傳雅樂四曲鹿鳴騶虞伐檀文王皆古聲辭漢食舉樂又見四品樂禮儀志嵗首大朝賀其儀云云舉觴御座前司空奉羮大司農奉飯奏食舉之樂百官受賜宴饗大作樂注蔡質漢儀曰德陽殿朝賀此正出處上陵之儀太官上食太常樂奏食舉文始五行之舞宋志章帝元和二年宗廟樂故事食舉有鹿鳴承元氣二曲三年自作詩四篇一曰思齊皇姚二曰六麒麟三曰竭肅雍四曰陟叱根一本云涉叶相合前六曲以為宗廟食舉加宗廟重來上陵二曲合八曲為上陵食舉減宗廟承元氣一曲加惟天之命天之厯數二曲合七曲為殿中御飯食舉又漢太樂食舉十三曲一曰鹿鳴二曰重來三曰初造四曰俠安五曰歸來六曰逺期七曰有所思八曰明星九曰清涼十曰涉大海十一曰大置酒十二曰承元氣十三曰海淡淡魏氏及晉荀朂傅玄並為歌詞魏時省逺期承元氣海淡淡三曲蔡雍論敘漢樂一曰郊廟神靈二曰天子享宴三曰大射辟雍四曰短簫鐃歌東都賦食舉雍徹太師奏樂注蔡雍禮樂志曰漢樂有四品一天子樂郊祀陵廟殿中諸會食舉也謂永平時章帝親著歌詩四章列在食舉又見月令迎氣樂通典漢享宴食舉樂十三曲又見樂章類馬融長笛賦陳於東階八音俱起食舉雍徹勸侑君子注食舉謂進食於天子而設樂食竟奏詩之樂以徹食蔡雍禮樂志曰天子中樂殿中食舉樂也周禮曰及徹而歌徹又曰王以樂侑食王制謂天子食舉以樂周官大食令奏鐘鼓漢大豫樂又見四品樂紀永平三年秋八月戊辰改樂為大豫樂十八年十二月癸巳有司奏明帝作登歌正豫樂官志大豫樂令一人秩六百石丞一人盧植曰令丞如大胥小胥禮儀志冬夏氣至五刻大豫具樂器列前殿曹褒傳父充為博士顯宗即位上言漢再受命仍有封禪之事而禮樂疏濶不可為後嗣法五帝不相沿樂三王不相襲禮大漢宜制禮以示百世帝問制禮樂云何對曰河圖括地象曰有漢世禮樂文雅出尚書璇璣鈴曰有帝漢出德洽作樂名豫帝善之下詔曰今欲改大樂官曰大豫樂永平三年八月戊辰改歌詩曲操以俟君子晉志漢短簫鐃歌之樂有朱鷺上之回戰城南等二十二曲魏受命改其十二曲使繆襲為詞述以功德代漢東都賦揚世廟正豫樂禮大胥注漢大樂律云云禮小師注管如􅐟而小今大豫樂官有焉鼓人疏錞于之名出於漢之大豫樂官國語均注律同詩疏柷敔形狀蓋依漢之大豫樂漢月令迎氣樂樂經黃鍾樂器詳見迎氣總章樂紀明帝永平二年始迎氣於五郊注續漢書云東郊歌青陽八佾舞雲翹之舞南郊歌朱明舞雲翹中央歌朱明舞雲翹育命西郊歌白藏舞育命北郊歌玄冥舞育命皇覽有迎氣四時之樂唱以角徴商羽春唱角舞羽翟夏唱徴舞鼓鞉秋唱商舞干戚冬唱羽舞干戈章帝建初五年冬始行月令樂注東觀記太常丞鮑鄴言云云事下車騎將軍馬防防言聖人作樂所以宣氣致和順陰陽也臣愚以為可因嵗首發太蔟之律奏雅頌之音以迎和氣時以作樂器費多遂獨行十月迎氣樂馬防傳五年冬始施行十二月迎氣樂防所上也律厯志注薛瑩書建初二年七月太常丞鮑鄴上言王者飲食有食舉之樂所以順天地養神明求福應也今官樂但有太蔟皆不應月律可依十二月均各應其月氣乃能感天地和氣宜應明帝始令靈臺六律候而未設其門樂經曰十二月行之所以宣氣豐物也月開斗建之門而奏歌其律誠宜施行唐楊收傳西京郊祀宗廟樂惟用黃鍾一均章帝時太常丞鮑鄴始旋十二宫夫旋宫以七聲為均均言韻也古無韻字猶言一韻聲也始以某律為宫商角徴羽某律少宫某律少徴一均成則五聲為之節族此旋宫也紀順帝陽嘉二年十月庚午行禮辟雍奏應鍾始復黃鍾作樂器隨月律注東觀漢紀曰元和以來音戾不調修復如舊典宋登持節臨太學奏定典律見律類獻帝建安八年冬十月己巳公卿初迎冬北郊總章始備八佾舞總章樂官名古之安代樂漢雅樂塤篪鹿鳴紀永平二年正月宗祀明堂樂和八音十月養老辟雍升歌鹿鳴下管新宮十年閏四月甲午南巡狩幸南陽日北至又祀舊宅禮畢召校官弟子作雅樂奏鹿鳴帝自御塤篪和之以娛嘉賔注鄭玄注周禮塤燒土為之大如雁子鄭衆曰有六孔世本曰暴辛公作篪以竹為之長尺四寸有八孔前傳王襄使王褒作中和樂職宣布詩選好事者依鹿鳴之聲習而和之選注閔洪琴賦曰汝南鹿鳴蔡雍琴操曰鹿鳴周大臣所作也王道衰大臣知賢者幽隱彈弦諷諫雅樂郎杜夔傳四曲一曰鹿鳴大戴禮云凡雅二十六篇其八篇可歌歌鹿鳴貍首鵲巢采蘩采蘋伐檀白駒騶虞八篇廢不可歌七篇商齊可歌也三篇間歌云云漢闕里作六代樂孔僖傳元和二年春肅宗東巡狩還過魯幸闕里以太牢祀孔子及七十二弟子作六代之樂大會孔氏男子二十以上者六十三人命儒者講論紀二年二月東巡三月己丑幸魯庚寅祠孔子注黃帝曰雲門堯咸池舜大韶禹大夏湯大濩周大武詳見羣祀類漢九賔樂又見上禮儀志上陵晝漏上大鴻臚設九賔隨立殿前薛琮曰謂王侯公卿二千石六百石及郎吏胸奴侍子凡九等注蔡質漢儀曰正月旦天子幸德陽殿臨軒作九賔徹樂含利從西方來戲於庭乃畢入殿前激水化為比目魚跳躍嗽水作霧鄣日畢化成黃龍長八丈出水遨戲於庭炫耀日光以兩大絲繩係兩柱中頭間相去數丈兩倡女對舞行於繩上對面道逢切肩不傾又踏局出身藏形於斗中鐘磬並作樂畢作魚龍曼延小黃門吹三通安帝紀延平元年即位十二月乙酉罷魚龍曼延百戲注漢官典職曰作九賔樂含利之獸從西方來戲於庭激水化成比目魚嗽水作霧化成黃龍長八丈出水遨戲於庭炫耀日光曼延者獸名也張衡西京賦所云巨獸百尋是為曼延武紀元封三年春作角抵戲注文穎曰兩兩相當角力角技藝射御蓋雜技樂也巴俞戲魚龍曼延之屬也漢後更名平樂觀此注解巴俞戲而上文無三百里內皆觀又見後碭極樂西京賦大駕幸乎平樂云云注平樂館大作樂處也漢八能樂八能陳音後律厯志天子以日冬夏至御前殿合八能之士陳八音聽樂均禮儀志注樂叶圖徴曰八能之士常以日冬至作陰樂以成天文日夏至作陽樂以成地理詳見黃鍾瑟易通卦驗日冬至人主致八能之士或調黃鍾或調六律或調五聲或調五行或調律厯或調陰陽政德所行八能以備人主乃縱八能之士擊黃鍾之鐘人敬稱善言以相之所謂金奏也乃權水輕重稱黃鍾之重擊黃鍾之磬八卿大夫列士乃使八能之士擊黃鍾之鼓鼓用革焉員徑八尺一寸鼓黃鍾之琴瑟用槐木瑟長八尺吹黃鍾之律間音以竽長四尺二寸黃鍾之音得㽔賔之律應夏日至如冬日至之禮舞八樂雲門五英六莖大卷韶夏濩武也黃鍾之音調則㽔賔之律應聲磬和則林鍾之律應此謂冬日至成天文夏日至成地理鼓用黃牛皮員徑五尺七寸瑟用桑木長五尺七寸間音以簫長尺四寸注此律必以九與十者天地數終焉月令仲夏止聲色注易及樂春秋説夏至人主與羣臣從八能之士作樂五日今止之非其道也仲冬去聲色注易及樂春秋説云冬至云云此言去又相反漢五樂太常樂見上續律厯志注樂叶圖徴曰五樂皆得則應鍾應見後黃鍾瑟禮儀志上陵太常樂奏食舉文始五行之舞漢清樂通典清樂者其始則清商三調是也並漢以來舊典樂器形制并歌章古調與魏三祖所作者皆備於史籍晉朝播遷其音分散魏樂論劉劭傳明帝時劉劭以為宜制禮作樂以移風俗著樂論二十四篇事成未上太平御覽選注引之晉書賀循云魏氏增損漢樂為一代之禮阮籍亦有樂論文章序録曰裴秀著易及樂論唐志梁武帝樂論三卷樂社大義十卷隋志梁有樂義十一卷武帝集朝臣撰又鍾律緯六卷魏復古樂雅樂四曲漢雅樂郎上夀曲魏太鈞樂見舞類晉志東京大亂絶無金石之樂樂章亡缺及魏武平荆州獲漢雅樂郎河南杜夔能識舊法云云考會古樂始設軒縣鐘磬而黃初中柴玉左延年之徒復以新聲被寵改其聲韻王粲等各造新詩抽其藻思杜夔傳舊雅樂四曲一曰鹿鳴二曰騶虞三曰伐檀四曰文王皆古聲辭及太和中左延年改夔騶虞伐檀文王三曲更自作聲節名雖有而聲實異惟因夔鹿鳴不改易每正旦大會太尉奉璧君后行禮東廂雅樂常作者是也後又改三篇一曰於赫篇詠武帝與古鹿鳴同二曰巍巍篇詠文帝用延年所改騶虞聲三洋洋篇詠明帝用延年所改文王聲第四復用鹿鳴而除古伐檀杜夔傳以知音為雅樂郎太祖以為軍謀祭酒參大樂事因令創制雅樂時散騎郎鄧靜尹齊晉志作尹商善詠雅樂歌師尹胡能歌宗廟郊祀之曲舞師馮肅服養曉知前代諸舞夔總統備作樂器紹復先代古樂自夔始隋志云刋定雅律唐杜佑三朝上夀議漢故事上夀四會曲有鐘鼓無歌詩魏初作四會有琴築無詩雅樂郎郭瓊云青龍二年以長笛食舉第十二古大置酒曲代四會又易古詩名曰羽觴行用為上夀曲鹿鳴已下十二曲名食舉樂而四會之曲遂廢通典文帝改漢巴渝舞曰昭武舞安世樂曰正世樂嘉至樂曰迎靈樂武德樂曰武頌樂昭容樂曰昭業樂雲翹舞曰鳯翔育命舞曰靈應武德舞曰舜頌舞文始舞曰大韶舞五行舞曰大武舞其歌詩多前代之舊使王粲改作登歌安世及巴渝詩而已明帝太和初詔樂官自如故為太樂後漢依讖改大豫至是復舊文帝改安世樂為正始至是侍中繆襲又改為享神歌改鐃歌十二曲使襲為詞述功德言代漢之意是時吳亦使韋昭制吹鐃部十二曲以述堅權功德晉雅樂登歌樂正德樂志武帝受命泰始二年詔郊祀明堂禮樂權用魏儀遵周室肇稱殷禮之義但改樂章使傅玄為之詞凡十九篇九年光録大夫荀朂以杜夔所制律吕校太樂總章鼓吹八音與律吕乖錯乃制古尺作新律吕荀朂傳既掌樂事又修律吕律成班下太常使太樂總章鼓吹清商施用朂又作新律笛十二枚以調律吕正雅樂正會殿庭作之江左初立宗廟以無雅樂器及伶人省太樂并鼓吹令是後頗得登歌食舉之樂隋志賀循為太常卿始有登歌之樂猶有未備太寧末明帝又詔阮孚等增益之咸和中成帝復置太樂官以戴綏為令鳩集遺逸而尚未有金石也庾亮為荆州與謝尚修復雅樂及慕容雋平冉閔鄴下樂人頗來者永和十一年謝尚鎮夀陽採拾樂人以備太樂并制石磬雅樂頗具尚以鎮西將軍鎮夀陽江左有金石之樂自尚始太元中破苻堅獲其樂工楊蜀等間習舊樂於是四廂金石始備使曹毗王珣等增造宗廟歌詩然郊祀遂不設樂隋志樂人南奔穆皇羅鐘磬苻堅北敗孝武獲登歌石梁武帝曰著晉宋史者皆言太元元嘉四年四廂金大備今檢樂府止有黃鍾姑洗㽔賔太蔟四格而已六律不具何謂四廂通典宋文帝元嘉九年太樂令鍾宗之調金石二十年南郊始設登歌詔顔延年造歌詩初江左二郊無樂宗廟有歌無舞孝武孝建元年使謝莊造宗廟舞樂明堂諸樂歌辭後魏志秦曰夀人漢為大豫魏名大鈞晉曰正德後魏為大成梁對樂七十八家郊禋宗廟三朝樂十二雅歌詩登歌隋志梁武思弘古樂天監元年下詔訪百寮沈約奏樂書淪亡宜選諸生尋經史百家凡樂事無大小悉别纂録撰為樂書以起干載絶文是時對樂者七十八家皆言樂之宜改不言改樂之法帝遂自制定禮樂立四器名之為通又制十二笛除去衡鐘設十二鎛鐘各依辰位而應其律每一鎛鐘則設編鐘磬各一虡合三十六架植建鼓於四隅元正大會備用之乃定郊禋宗廟及三朝之樂以武舞為大壯文舞為大觀舞國樂以雅為稱止乎十二則天數也乃去階步之樂增徹食之雅衆官出入奏俊雅皇帝出入奏皇雅皇太子出入奏胤雅王公出入奏寅雅上夀酒奏介雅食舉奏需雅徹饌奏雍雅牲出入奏滌雅薦毛血奏牷雅降神及迎送奏諴雅皇帝飲福酒奏獻雅燎埋奏禋雅其辭並沈約所製今列其歌詩二十曲南郊舞奏黃鍾北郊舞奏林鍾明堂宗廟同奏㽔賔又有登歌一十八曲三朝第一奏相和五引至四十九皇帝興奏皇雅通典陳大建元年定三朝之樂採梁故事五年定南北郊及明堂儀注改元嘉中所用齊樂盡以韶為名梁養德樂隋志天監四年掌賔禮賀瑒議皇太子元會出入所奏帝命制養德之樂瑒謂宜名元雅取元良之義帝改為元正奏二舞梁樂社大義唐志梁武帝樂社大義十卷又樂論三卷隋志同梁有有樂義十一卷武帝集朝臣撰云後魏樂書唐志信都芳刪注樂書九卷隋志七卷信都芳傳著樂書以河內葭灰吹律管魏志正光中詔安豐王延明與芳博採古今樂事芳後乃撰延明所集樂説并諸器物凖圖二十餘事而注之通典北齊祖珽採延明及芳等所著樂説而定正聲始具宫縣之器仍雜西涼之曲樂名廣成所謂洛陽舊樂也隋議正樂通典開皇二年鄭譯請修正詔牛弘辛彥之何妥議正樂九年陳平獲宋齊舊樂於太常置清商得陳太樂令蔡子元于普明等復居其職隋代雅樂唯奏黃鍾一宫郊廟朝饗用一調迎氣用五調其餘聲律皆不復通文帝遣李元操盧思道等製清廟歌詞十二曲令於太樂教習以代周歌隋樂府志樂論樂典經籍志蕭吉樂譜集二十卷傳云樂譜集唐志云樂譜解又樂論一卷鄭譯樂府聲調六卷唐志鄭譯樂府歌詞八卷蘇夔樂府志十卷北史隋文帝詔斛斯徴修撰樂書徴所撰樂典十卷通典開皇初有盧賁蕭吉撰著樂書文中子樂論二十篇為十卷隋樂譜又見前樂論清樂七部九部樂志開皇初二年沛國公鄭譯等定樂作書二十餘篇立七均合成十二律有七音音立一調合八十四調蘇夔駁之又萬寶常請以水尺為律造樂器其聲下譯調二律并撰樂譜六十四卷具論八音旋相為宫之法改弦移柱之變為八十四調一百四十四律終於一千八百聲其聲雅淡不為時所好何妥因陳用黃鍾一宫不假餘律鄭譯等議寢開皇九年獲宋齊舊樂於太常置清商牛弘又請依古旋宫雅樂每官一調唯迎氣奏五調謂之五音縵樂用七調十二月甲子詔太常卿牛弘等議定樂帝不許弘又修房內之樂十四年三月樂定四月乙丑行新樂牛弘等并撰歌辭五十首通典清商三調漢氏以來舊典隋平陳後獲之文帝聽之善其節奏曰此華夏正聲考而補之更造樂器因置清商總謂之清樂本秦漢以耒舊聲晉末分散苻堅於涼州得之宋武平關中因入於江南髙志大業中定清樂西涼龜兹天竺康國疏勒安國麗禮畢為九部萬寶常傳開皇之丗有鄭譯何妥盧賁蘇夔蕭吉並討論墳籍撰著樂書至於天然識樂不及寶常逺矣唐會要隋開皇中定令置七部樂大業中為九部唐志周陳以上雅鄭肴雜隋文帝始分雅俗二部俗樂二十八調七宫七商七角七羽玉海卷一百四
