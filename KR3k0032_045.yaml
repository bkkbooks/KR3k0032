body:
  text: 玉海卷四十五宋王應麟撰藝文小學晉四體書勢晉衛恒傳恒贈長水都尉善草隷為四體書勢隋唐志一卷曰黄帝作書契字有六義云云黄帝至三代其文不改及秦用篆書燒焚古典而古文絶矣漢武帝時魯恭王壊孔子宅得尚書春秋論語孝經時人已不復知有古文謂之科斗書漢世袐藏希得見之魏初傳古文者出於邯鄲淳恒祖敬侯覬寫淳尚書後以示淳而淳不别至正始中立三字石經轉失淳法因科斗之名遂效其形太康元年汲縣人盗發魏襄王冢得䇿書十餘萬言案敬侯所書猶有髣髴古書亦有數種其一卷論楚事者最為工妙恒竊恱之故竭愚思以贊其美愧不足厠前賢之作兾以存古人之象焉古無别名謂之字勢云信黄唐之遺跡為六藝之範先籀篆盖其子孫隷草乃其曽玄昔周宣王時史籀始著大篆十五篇或與古同或與古異世謂之籀書者也秦始皇帝初兼天下丞相李斯乃奏益之罷不合秦文者斯作蒼頡篇中車府令趙髙作爰歴篇太史令胡母敬作博學篇皆取史籀大篆或頗省改所謂小篆者或曰下土人程邈為衙獄吏得罪始皇幽繋雲陽十年從獄中作大篆少者増益多者損減方者使員員者使方奏之始皇善之出以為御史使定書或曰邈所定乃隷字也自秦壊古文有八體一曰大篆二曰小篆三曰刻符四曰蟲書五曰摹印六曰署書七曰殳書八曰隷書王莽時使司空甄豐校文字部改定古文復有六書一曰古文孔氏壁中書也二曰竒字即古文而異者也三曰篆書秦篆書也四曰佐書即隷書也五曰繆篆所以摹印也六曰鳥書所以書幡信也及許慎撰說文用篆書為正以為體例最可得而論也秦時李斯號為工篆諸山及銅人銘皆斯書也漢建初中扶風曹喜少異於斯而亦稱善邯鄲淳師焉畧究其妙韋誕師淳而不及也太和中誕為武都太守以能書留補侍中魏氏寳器銘題誕書也江式曰當時臺觀牓題寳器之銘悉是誕書頭世說魏明帝起殿使誕登梯題牓既下鬚皓然因敕子孫勿復學書漢末又有蔡邕采斯喜之法為古今雜形然精密閑雅不如淳也法書要録曰李丞相見周穆王書七日興嘆患其無骨蔡尚書入鴻都觀中十旬不返嗟其出羣邕作篆勢曰云云揚波振撆鷹跱鳥震籕誦拱手而韜翰云云秦既用篆奏事煩多篆字難成即令隷人佐書曰隷字漢因行之獨符印璽幡信題署用篆隷書者篆之捷也上谷王次仲始作楷法至靈帝好書時多能者而師宜官為最大則一字徑丈小則方寸千言甚矜其能毎書輙削而焚其柎梁鵠乃益為版而飲之酒候其醉而竊其柎鵠卒以書至選部尚書宜官後為袁術將今鉅鹿宋子有耿球碑是術所立其書甚工云是宜官也梁鵠在袐書以勤書自効是以今者多有鵠手跡魏武帝以為勝宜官今宫殿題署多是鵠象鵠宜為大字邯鄲淳宜為小字鵠謂淳得次仲法然鵠之用筆盡其勢鵠弟子毛弘教於袐書今八分皆弘法也漢末有左子邕小與淳鵠不同然亦有名魏初有鍾胡二家為行書法俱學之於劉徳升而鍾氏小異然亦各有巧今大行於世晉荀朂領袐書監立書博士置弟子教習以鍾繇胡昭為法作隷勢曰蠲彼繁文崇此簡易云云齊周顒得衛恒散隷書法學之甚工何胤以倒薤書求換之漢興而有草書不知作者姓名至章帝時齊相杜度號善作篇後有崔瑗崔實亦皆稱工杜氏殺字甚安而書體㣲瘦崔氏甚得筆勢而結字小踈弘農張伯英者因而轉精甚巧凡家之衣帛必書而後練之臨池學書池水盡黒下筆必為楷則號忩忩不暇草書韋仲將謂之草聖伯英弟文舒次伯英羅叔景趙元嗣者與伯英並時見稱於西州故英自稱上比崔杜不足下方羅趙有餘河間張超亦有名然雖與崔氏同州不如伯英之得其法也崔瑗作草書勢曰抑左揚右望之若﨑竦企鳥跱志在飛移應時諭指用於卒迫唐志崔瑗飛龍篇篆草勢合三卷初學記崔瑗草書體云書體之興始自頡皇寫彼鳥跡以定文章爰暨末葉典籍彌繁惟作佐隷舊字是删草書之法盖尤簡畧兼功并用愛日省力純儉之變豈必古式成公綏隷書體云蟲篆既繁草藁近偽適之中庸莫尚於隷規矩有則用之簡易八分璽法殊好異制鍾氏隷書勢云煥若星陳鬱若雲布鮑照飛白書勢云云蕭子良古今篆隷文體有藁楷蓬懸針垂露飛白填奠鳥虎爪偃波鶴頭書象形尚方大篆鳯鳥科斗蟲龍虎仙人芝英十二時倒薤龜麒麟金錯蚊腳書凡數十種皆出於六文八體之書而因事生變王愔文字志懸針小篆體也倒薤小篆體也八體書亦圖此法或云出曹喜金錯書八體書法不圖其形或云以銘金石垂露書如懸針羊欣筆陣圖云蕭何善篆為前殿成又蒼龍白虎闕以題其額使秃筆書本朝任玠序范度五體書文五體曰篆曰八分曰真曰行曰草其體雖五其流唯三篆則統乎科斗玉筯垂露薤葉大小之屬也隷則統乎羲獻鍾庾歐虞顔栁真草之輩也八分則酌乎篆隷之間通是三者可冠羣書孔安國書序科斗書廢已久時人無能知者定其可知者為隷古定疏就古文體而從隷以定之雖隷而猶古隋志自蒼頡訖漢初書經五變曰古文蒼頡大篆史小篆李斯隷書程邈草書漢初秦廢古文始用八體漢以六體教學童并藁書楷書懸針垂露飛白偃波鶴頭芝英倒薤等二十餘種之勢皆出於上六書因事生變也魏世有八分書程逈曰八分始於漢初王次仲唐六典書學注字體有五一曰古文廢而不用二曰大篆惟石經載之三曰小篆印璽旙碣所用四曰八分石經碑碣所用五曰隷書典籍表奏公私文疏所用唐志古今八體六文書法一卷古來篆隷詁訓名録一卷庾肩吾曰隷書今之正書也張懐瓘六體書論亦云隷書者程邈造字皆真正亦曰真書自唐以前皆謂楷字為隷至歐陽集古録誤以八分為隷書自是凢漢石刻皆目為漢隷東魏大覺寺碑題曰隷書盖今楷字也晉索靖傳與衛瓘恒之父俱善草書作草書狀曰婉若銀鈎漂若驚鸞楊泉草書賦惟六書之為體美草法之最竒杜垂名於古昔皇著法於今斯說文注按書傳云張竝作草又云齊相杜操作漢書安息國旁行為書記顔氏曰今西方胡國南方林邑書皆横行不直下也隋志後漢得西域胡書以十四字貫一切音文省義廣謂之婆羅門書志一卷晉王羲之書本傳羲之字逸少善隷書筆勢飄若浮雲矯若驚龍宴集蘭亭自為之序寫道徳經毎自稱我書比鍾繇當抗行比張芝草猶當雁行也羲之書初不勝庾翼郗惜暮年方妙以章草答庾亮而翼深歎伏云吾昔有伯英章草十紙過江亡失常歎妙迹永絶忽見足下書煥若神明頓還舊觀子獻之工草隷嘗書壁為方丈大字議者以為羲之草隷江左中朝莫有及者獻之骨力逺不及父而頗有媚趣制曰書契之興肇乎中古繩文鳥跡不足可觀末代去朴歸華舒牋㸃翰争相誇尚競其工拙伯英臨池之妙無復餘蹤師宜懸帳之竒罕有遺跡鍾王以降畧可言焉鍾雖擅美一時亦為逈絶論其盡善或有所疑至於布纎濃分疎密霞舒雲卷無所間然但其體則古而不今字則長而逾制獻之雖有父風殊非新巧字勢疎瘦筆踪拘束子雲近出擅名江表然僅得成書無丈夫之氣行行若縈春蚓字字如綰秋蛇此數子者皆譽過其實詳察古今研精篆素盡善盡美其惟王逸少乎觀其㸃曳之工裁成之妙烟霏露結狀若斷而還連鳳翥龍蟠勢如斜而轉直心慕手追此人而已梁蕭子雲云著晉史至二王列傳欲作論草隷法言不盡意遂不能成畧指論飛白一事而已見勅㫖論書一卷商畧筆狀洞徹字體始變子敬全範元常逮爾以來自覺功進梁武帝評羲之字勢雄逺如龍跳虎卧衛夫人筆陣圖曰若初學書先須大書不得從小善鑒者不寫善寫者不鑒多骨微肉者筋書多肉㣲骨者墨豬多力豐筋者聖無力無筋者病一二從其消息而用之國史志筆陣圖一卷聲韻圖一卷不知撰人晉鳳尾諾陸龜蒙說鳳尾諾曰自晉訖梁陳以來藩邸之書也凡封子弟為王則開府辟僚屬取當時士有學行才藻者中是選其所下書東宫則曰令上書則曰牋諸王下書則曰教上書則曰啓應和文章則應令應教下其制一等故也其事行則曰諾猶漢天子肯臣下之奏曰可也晉元帝為瑯琊王時帝美其才令通習外事常使批鳳尾諾南齊江夏王鋒年五嵗使學鳳尾諾下筆便工帝大恱以玉麒麟賜之餘未見其出鳯尾所諾牋之文若今批答唐志皇太子令書左庶子畫諾至道元年詔改諾為準九月二十三日崇文院言按唐㑹要貞觀十九年髙士廉劉洎等請定皇太子與百官書疏體式詔凡處分論事之書太子並畫諾令左右庶子已下著姓名宣奉行書案畫日其餘與諸親及師傅等不在此限齊王僧䖍書賦王僧䖍傳齊髙帝示僧䖍古迹十一卷就求能書人名僧䖍得人間所有卷中所無者呉大帝景帝歸命侯桓玄書及王導洽珉張芝索靖衛伯儒張習共十一卷奏之僧䖍著書賦儉為注序宋孝武欲擅書名僧䖍不敢顯跡僧䖍答髙帝曰臣書臣中第一又曰臣正書第一草書第二又上羊欣所撰能書人名一卷賦見藝文類聚云手以心麾毫以手從梁五十二體書百體五十六體書品唐志蕭子雲五十二體書一卷庾肩吾書品一卷郭忠恕云五十二家書必非子雲所作為梁殷鈞受詔料檢西省法書古迹列品目法書要録張彦逺一卷齊王融圗古今雜體六十四書湘東王令韋仲定為九十一種謝善勛増九法合成百體御覽庾元威論書曰書十牒屏風作百體懸針垂露秦望波冡金鵲玊文鵠頭虎爪倒薤偃波幡信制列日月風雲科斗署胡蓬相天竺轉宿書一筆篆一筆隷飛白章草古文隷横楷小科芝英花草幡信鍾鼓隷龍虎鳳魚麒麟仙人科斗雲蟲魚鳥龍龜虎鸞篆龍虎鳳魚麒麟仙人科斗雲蟲魚鳥龍龜虎鸞隷龍文龜文䑕牛龍書虎草書兔書龍蛇草馬羊猴鷄犬豕書復有大小篆銘鼎摹印刻符石經象形篇章震書到書反左書等及九體書所謂縑素簡奏牋表行狎檝蒿半草全草書此九法極真草之次第刪捨之外所存猶一百二十體書斷開元張懐瓘三卷篆籕八分隷章草飛白行書謂之八體而右軍皆在神品百葉書抄晉徐安子五十八體書勢一卷墨藪五十六種書太昊作龍書神農作穗書黄帝以倉頡鳥跡為篆書因卿雲見作雲書少昊作金天鸞鳳書髙陽制科斗書髙辛作仙人形書堯作龜書夏后作鐘鼎書倒薤書務光虎書史佚鳥書周文赤雀銜書武王丹鳥入室作填書周媒氏作大篆復篆史籕殳書文記笏武記殳小篆周仙人篆李斯改麒麟篆仲尼弟子作轉宿書子韋蟲書秋胡妻傳信書六國小篆刻符書李斯隷書程邈署書蕭何作題蒼龍白虎二闕藁書仲舒氣候書司馬相如芝英書漢金錯書尚方大篆程邈鶴頭偃波書詔板所用蚊腳書上詔用垂露懸針篆漢曹喜章草杜伯度飛白蔡邕一筆書張芝八分書王次仲虵書魯唐終行書正之小也鍾繇謂之行狎書後漢劉徳升造散隷衛恒龍爪書行隷王羲之八體書二王虎爪書王僧䖍鬼書宋元嘉花書河東山胤外國胡書天竺書雜俎百體云召奏用虎爪書告下用偃波書謝章詔板用蜹腳書初學記摰虞決疑要注曰尚書臺召人用虎爪書告下用偃波書皆不可卒學以防矯詐書目王僧䖍評書一卷梁武帝評書一卷自鍾繇至蔡邕凡二十五家各評其書書品一巻唐志庾肩吾撰集草隷者一百二十八人以張芝居首品為九例又述書後品一卷唐開元中王知明撰取今古二百五十人分七等唐虞世南筆髓法一卷一辨意二指意三釋真四釋行五釋草六契妙七勸學李嗣真書後品一卷崇文目云因庾肩吾之品更分十等各為評讃唐書嗣真撰書品一卷今本無評讃梁千字文唐志周興嗣次韻一卷興嗣傳次韻王羲之書千字文髙祖以羲之書千字使興嗣次韻為文蕭子範千字文一卷南平王使子範製千字文蔡逺注釋隋志蕭子雲注千字文胡肅注並篆草書各一卷演千字文五卷梁武帝制千文詩沈衆為注解隋潘徽為萬字文及韻纂三十卷智永草千文宋朝太宗謂近臣曰千文盖梁得鍾繇破碑千餘字周興嗣次韻而成詞理亡可取梁玊篇祥符新定玊篇隋志陳左將軍顧野王玊篇三十一卷今本三十卷梁大同九年三月二十八日黄門侍郎顧野王撰序曰五典三墳競開異義六書八體今古殊形或字各訓同或文均釋異總㑹衆篇校讎羣籍成一家之製始於一終於亥凡五百四十二部梁簡文以玉篇詳畧未當使蕭愷與學士刪改唐上元元年甲戌四月十三日孫强増加字舊一十五萬八千六百四十一言新五萬一千一百二十九言總二十萬九千七百七十言注四十萬七千五百三十字卷末分毫字様凡二百四十八字附以沙門神珙五音聲論四聲五音九弄反紐圗唐志僧慧力像文玉篇三十卷陽寗公釋處忠撰元和韻譜祥符三年二月己酉太常博士丘雍上篇韻筌蹄三卷六年九月學士陳彭年校理吳銳直集賢院丘雍上準詔新校定玉篇三十卷崇文目曰重修請鏤板詔兩制詳定改更之字天禧四年七月癸亥板成賜雍金紫後魏字統北史陽尼造字釋數十篇未就其從孫承慶撰為字統二十卷行於世隋韻纂桂苑珠叢切韻隋潘徽傳秦王俊召為學士令為萬字文撰集字書名曰韻纂三十卷序曰羲皇觀象緯而法天史頡察蹄迒而取地小學之家尤多舛雜文訛篆隷音謬楚夏三蒼急就之流㣲存章句說文字林之屬唯别體形未有李登聲類吕靜韻集始判清濁纔分宫羽唐曹憲傳仕隋為祕書學士於小學家尤邃自漢杜林衛宏後古文至憲復興與諸儒譔桂苑珠叢一百卷規正文字又注廣雅學者推其該唐太宗有竒難字輒問憲具為音注帝咨詢之又撰博雅十卷隋志曹憲古今字圗雜錄一卷唐志桂苑珠叢一百卷諸葛頴又畧要二十卷吕靜韻集夏侯該韻畧陽休之韻畧周思言音韻李季節音譜杜臺卿韻畧等各有乖互隋仁夀元年辛酉陸法言為切韻五卷唐天寳十載辛夘孫愐唐韻總加四萬二千三百八十三言仍篆隷石經勒存正體唐六十九家小學藝文志經錄十一曰小學類六十九家一百三部七百二十一卷失姓名二十三家爾雅小爾雅方言釋名三蒼廣雅埤蒼廣蒼急就凡將太甲在昔聖皇勸學飛龍說文玉篇纂文纂要詁切桂苑珠叢㓜學始學小學少學啟疑博雅續爾雅黄初呉章篇則訓詁偏傍之學也聲類韻集韻畧辨嫌音四聲韻畧四聲部韻篇切韻證俗音音隠叙同音爾雅音義則音韻之學也字體則有雜字字訓字林字統字苑字屬辨字釋訓解字雜音要說集畧辨嫌文字志字㫖竒字古文官書雜字書通俗難字千字文覽字知源文字指歸字海書體則有篆草勢法書目錄四體書勢五十二體書書品筆墨法八體六文書法篆隷詁訓名錄書後品石經則有論語易尚書毛詩儀禮左傳公羊始於爾雅李巡樊光注終於李嗣真書後品不著錄二十三家二千四十五卷徐浩書譜至加字切韻訓詁偏傍有文字音義五經文字九經字様干祿字書分毫正字說文字源音韻有韻音唐韻韻銓韻英韻海鏡源切韻加字書體有書譜古跡記書㫁評書指則法書草字體筆法記寳章集八體書範及二王二張等書王氏工書狀隋志小學一百八部四百四十七卷崇文目五十七部五百十九卷叙曰爾雅出漢世而有訓詁之學三蒼志字法許慎作說文而有偏傍之學五聲清濁相生孫炎始作字音於是有音韻之學篆隷古文異體學者務極其能於是有字書之學景徳二年龍圗閣書小學四百四十二卷中興目一百十八家八百二十二卷續目二十家二百二十四卷文字之學有三其一體制謂㸃畫有衡縱曲直之殊說文之類其二訓詁謂稱謂有古今雅俗之異爾雅方言之類其三音韻謂呼吸有清濁髙下之不同沈約四聲譜及西域反切之學唐禁中書法百官志貞觀元年詔京官職事五品以上子嗜書者二十四人隷弘文館習書出禁中書法以授之㑹要初置弘文館選貴臣子弟有性識者為學生内出書法命之令學又人間有善書者追召入館纔數年間海内風從六典注云敕虞世南歐陽詢教示楷法唐志虞龢法書目錄六卷張彦遠法書要録十卷褚遂良工隷楷帝令侍書見後虞世南始學書於智永究其法為世祕愛歐陽詢初倣王羲之書後險勁過之因自名其體魏叔瑜善草隷以筆意傳其子華及甥薛稷世稱善書者前有虞褚後有薛魏顔真卿善正草書筆力遒婉世寳傳之賀知章善草隷好事者具筆研從之世傳以為寳桞公權書法結體勁媚自目一家裴休書楷遒勁有體法韋陟有楷法自謂書陟字若五朶雲號郇公五雲體盧藏用工草隷大篆八分蘇氏曰永禪師書骨氣深穏體兼衆妙精能之至反造疎淡如觀陶靖節詩歐陽率更書妍緊拔羣尤工於小楷其書勁險刻厲正稱其貌褚河南書清逺蕭散㣲雜隷體張長史草書頺然天放畧有㸃畫處而意態自足號稱神逸今世稱草書者或不能真行此大妄也真生行行生草真如立行如行草如走未有未能行立而能走者也顔魯公書雄秀獨出一變古法桞少師本出於顔而能自出新意其言心正則筆正非獨諷諫理固然也唐御府鍾王等真跡二王張芝張昶書弘文館法書貞觀開元印㑹要貞觀六年正月八日命整理御府古今工書鍾王等真跡得一千五百一十卷開元六年正月二日命整理御府古今工書鍾王等真跡得一千五百一十卷十六年正月内出二王真跡及張芝張昶等古跡總一百六十卷付集賢院依文榻兩本進内分賜諸王初貞觀中搜訪王羲之等真跡人間古本畢集令魏徵虞世南褚遂良等定其真跡及小王張芝等亦隨多少勒為卷帙以貞觀字為印縫及卷之首尾其草跡又令褚遂良真書小字帖紙影其古本亦有是梁隋官本者梁則蒲騫徐僧權沈熾文朱异等隋則江揔姚詧等書記太宗又令虞褚等卷下更書名記其後蘭亭一本相傳云將入昭陵又一本長安神龍之際太平安樂公主奏借出外榻寫此遂失所在開元五年敕陸元悌魏哲劉懐信等檢校標分一卷為兩卷總見在八十卷餘並墜失元悌又割去前代名賢押書之跡唯以己之名氏代焉上自書開元二字為號以印記之王右軍凡一百三十卷小王二十卷集賢記注二十八卷張芝張昶書各一卷右軍真行書唯有黄庭告誓等四卷存焉宋太平興國八年十月越州以王羲之畫像並石硯來獻藝文志小學類二王張芝張昶等書一千五百一十卷太宗出御府金帛求天下古本命魏徵虞世南褚遂良定真偽凡得羲之真行二百九十紙為八十卷又得獻之張芝等書以貞觀字為印草跡命遂良楷書小字以影之其古本多梁隋官書梁則蒲騫徐僧權沈熾文朱异隋江總姚詧書記帝命魏褚卷尾各書名開元五年敕陸元悌魏哲劉懐信檢校分益卷帙玄宗自書開元字為印六典弘文館榻書三人貞觀二十三年置龍朔三年館内法書九百四十九卷並裝進㑹要長慶三年四月舊紀五月袐書少監李隨奏鑄袐書閣圗書印開成元年四月集賢殿御書院鑄印以御書為文元和十四年九月戊寅考功郎中蕭祐進古今書畫二十卷舊紀云古畫古書唐寳章集八體書範藝文志王方慶寳章集十卷王氏八體書範四卷王氏工書狀十五卷王方慶傳武后嘗就求羲之書方慶奏十世從祖羲之書四十餘畨太宗求之先臣悉上送今所存唯一軸并上十一世祖導十世祖洽九世祖珣八世祖曇首七世祖僧綽六世祖仲寳五世祖騫髙祖規曽祖褒并九世從祖獻之等二十八人書共十篇后御武成殿徧示羣臣詔中書舍人崔融序其閥閱號寳章集復以賜方慶士人歆其寵㑹要神功元年五月上謂鳳閣侍郎王方慶曰卿家多書合有右軍遺跡方慶曰羲之書先有四十餘卷貞觀十二年進訖一卷今在亦進訖并十一世祖導已下二十八人書十卷上之褚遂良傳博涉文史工隷楷太宗嘗歎曰虞世南死無與論書者魏徵白見遂良帝令侍書帝方博募王羲之故帖天下爭獻然莫能質其真偽遂良獨論所出無舛冒也貞觀中凡得羲之真行二百九十紙為八十卷鍾紹京傳紹京耆書畫如王羲之獻之褚遂良真跡藏家者至數十百卷蕭祐傳前代鍾王遺法蕭張筆勢徧叙真偽為二十卷元和末進御唐詔寫文選裴行儉傳行儉工草隷名家帝嘗以絹詔寫文選覽之祕愛其法賚物良厚行儉每曰褚遂良非精筆佳墨未嘗輙書不擇筆而妍捷者余與虞世南耳所撰選譜草字雜體數萬言志卷亡唐開元文字音義志玄宗開元文字音義三十卷㑹要云開元二十三年三月二十七日頒示公卿韻英五卷㑹要天寳十四載四月付集賢院張九齡賀御製文字音義狀義微㫖逺文省理該表隷以訓今存篆以證古衆釋大備取證於前脩片言旁通去嫌於翻字信文思之精一學術之明準書目開元文字音義二十五卷玄宗撰其序云古文字惟說文字林最有品式因傋所遺缺首定隷書次存篆字凡三百二十部合為三十卷今止存二十五卷集賢註記有敕依文字音義改撰春秋毛詩莊子音張九齡奏校理官吕證撰春秋音義鄭欽說撰毛詩音義甘暉衛包撰莊子音義郭忠恕曰玄宗老子上卷改載為哉洪範一篇更頗作陂志武后字海一百卷元萬頃等撰雜家有江邃釋文十卷顔之推曰世之學者讀五經是徐邈而非許慎賦頌信褚詮而忽吕忱史記專皮鄒而廢篆籀漢書恱應蘇而畧蒼雅不知書音其支葉小學其宗系葛洪曰書三寫魚成魯帝成􅍑唐三體寫老子經舊史司馬承貞子㣲善篆隷書玄宗令以三體寫老子經因刋正文句定著五千三百八十言為真本以奏上之唐玉筯篆李陽氷上李大夫論古篆書緬想立制造書之意復仰觀俯察六合之際於天地山川得方圓流峙之形於日月星辰得經緯昭囘之度於雲霞草木得霏布滋蔓之容於衣冠文物得揖遜周旋之體於蟲魚鳥獸得屈伸飛動之理隨手萬變任心所成可謂通三才之氣象備萬物之情狀孔壁遺文汲冡舊簡年代浸逺謬誤滋多蔡中郎以豐同豐李丞相將耒為來天將未喪斯文也故小子得篆籀之宗㫖舒元輿玉筯篆志曰秦丞相斯變蒼頡籀文為玉筯篆李陽氷獨能隔一千年而與秦斯相見斯去千年氷生唐時徐鉉曰陽氷篆迹殊絶獨冠古今自云斯翁之後直至小生於是刋定說文修正筆法竇臮謂陽氷篆為筆虎又作小篆賛曰丞相斯法神慮精深釵頭屈玉鼎足垂金唐真草書屏見御書八體書屏書譜徐浩傳父嶠之善書以法授浩益工嘗書四十二幅屏八體皆備草隷尤工所題多文選五言詩世狀其法曰怒猊抉石渴驥飲泉志徐浩書譜一卷古跡記一卷司空圖書屏記歴代入書品者八十一人儒家之寳莫踰此屛見書品及徐公評論云云栁公權書法勁媚外夷入貢别輸貨貝購栁書京兆西明寺金剛經有鍾王歐虞褚陸諸家法文宗召與聨句以為詞情皆足命題於殿壁一字率徑五寸帝歎鍾王無以尚也其遷少師宣宗召寘御座前書紙三畨作真行草三體竒祕賜以器幣且詔自書謝章軍容使西門季玄捧硯樞宻使崔巨源過筆一紙真書十字曰衛夫人傳筆法於王右軍一紙行書十一字曰永禪師真草千字文得家法一紙草書八字曰謂語助者焉哉乎也上尤惜竒之宋王僧䖍為飛白書題尚書省壁劉劭飛白書埶曰素幹氷解蘭墨電𢮓直准箭馳屈擬蠖蟄烟雲拂蔚索草鍾真唐韻英志玄宗韻英五卷天寳十四年撰詔集賢院寫付諸道採訪使傳布天下㑹要天寳十四年四月内出御撰韻英五卷付集賢院