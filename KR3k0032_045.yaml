増改刪削及多差舛詔校正刋行隷韻十巻淳熙二年劉球撰集石刻隷字為之纂注韻畧五卷不知作者又互注五卷續目吳棫韻補五巻自詩書至唐宋人文章凡恊聲押古韻者共引五十家僧玅華互注集韻二十五卷崇文目韻銓十五卷切韻十卷辨體補修加字切韻五卷聲韻圗一卷程迥古韻通式一曰四聲互用二曰切響通用畧於文選詩中類出五十餘條復以經證一目終焉劉熙古作切韻拾玉二篇刋版以獻詔國子監頒行祥符真草書千字文三年十二月丁夘皇從姪孫守節上其父南陽郡王惟吉真草書千字文石本詔奨之以其書付史館太宗時孫景璠篆千字文為五十餘體以獻授國子書學博士仁宗時克循獻所書千字文皇祐二年正月十七日宗子宗望上集虞世南筆法千字文遷資州刺史米芾奉詔以黄庭小楷作千字文以獻侍其瑋續千文唐志有篆書千字文一卷胡寅作叙古千文黄灝為傳胡宏作叙古蒙求凡三十一章李建中手寫郭忠恕汗簡集以獻皆科斗文字詔嘉奨忠恕召授國子主簿館於太學令刋定歴代字書舒知雄獻字母圗陳淳字義三卷景祐書苑書學實録三年十月乙巳朔國子博士周越上纂集古今人書并隷體法傳云并所更體法名書苑凡二十卷命知國子監書學志云二十九卷傳云十卷中興書目周越古今法書苑十卷其序云自蒼史逮皇朝善書者得三百九十八人以古文大篆小篆隷書飛白八分行書草書通為八體附以雜書以正書正行行草草書分為四等晁氏志云十五卷天聖八年四月成此書奏御郭忠恕云小篆散而八分生八分破而隷書出隷書悖而行書作行書狂而草書聖自隷以下吾不欲觀崇寜三年六月十一日都省上書學敕令格式五年四月罷徽宗評十八家書體髙宗製翰墨志紹興十六年十一月十七日癸未復置御書院於資善堂後明年四月十七日畢功翰林院選試書學生以五體書王虞鍾真小字批答書學祗候以六體書勾勒書藝學試七體書玉筯篆待詔以七體書二十年正月十七日罷書目米芾書評一卷元祐六年撰朱長文續書斷二卷集唐初至熙寧間能書者品第優劣大觀四年正月九日朱克明言許氏説文字畫形聲多與字説相戾撮四百餘字名字括詔除書學諭熙寧三年十二月十六日明州布衣王珦上篆書證宗要覽三卷并印様一軸命為御書院祗候景祐集韻十卷崇文目有之景祐四年翰林學士丁度等承詔撰寳元二年九月書成上之十一日進呈朌行慶厯三年八月十七日雕印成韻例云唐虞君臣賡載作歌商周之代頌雅參列聲韻經見此焉為始後世屬文之士比音擇字類别部居乃其四聲若周研李登吕静沈約之流皆有編著近世小學寖廢六書亡缺隋陸法言唐李舟孫愐各加裒撰真宗時令陳彭年丘雍因法言韻就為刋益景祐四年一云元年三月太常博士直史館宋祁鄭戩建言彭年雍所定多用舊文繁畧失當因詔祁戩與直講賈昌朝王洙同修定知制誥丁度李淑典領令所撰集務從該廣凡字訓悉本許慎說文慎所不載則引他書為解凡古文見經史諸書可辨識者取之不然則否列十二凡著于篇端字五萬三千五百二十五新増二萬七千三百三十一字分十卷詔名曰集韻自許慎而降凡數家總為類篇集韻昌朝又請修禮部韻畧其窄韻凡十有三聽學者通用之或云治平四年司馬光繼纂其職元祐五年博士孫諤陳請添收紹興十一年進士黄啓宗隨韻補輯尚多闕遺三十二年毛晃上増修互注韻畧張貴謨上聲韻補遺慶厯古文韻慶厯四年二月二十四日知亳州夏竦上新集古文四聲韻五卷古文所出書傳自汗簡至鳳棲記皇祐四年二月甲申宗子右屯衛大將軍克繼廣夏竦古文韻六卷詔奬其向學藏中祕郭忠恕佩觽集三卷序曰造字之㫖始於象形中則止戈反正而省聲正焉四聲之作始於譬況中則近煙左傳注為殪鄭注而翻語生焉孫炎所作傳寫之差則五月三豕帝虎魯魚觸類而長實繁有徒忠恕編汗簡究古文根本晁氏志薛尚功集鍾鼎篆韻七卷紹興中元祐中吕大臨所載僅數百字政和中王楚所傳不過數千字是書所録凡一萬一百二十有五又王楚集博古圖二十卷吕大臨考古圖十卷薛尚功鍾鼎欵識二十卷書目崇文目同佩觽三卷郭忠恕上卷列三科一曰造字二曰四聲三曰傳寫中下以四聲分十條古文四聲韻五卷夏竦集前後所獲古文字凖唐切韻分為四聲治平類篇指掌圗書目類篇四十五卷治平四年司馬光上先是寳元二年翰林學士丁度言今修集韻増字既多與玊篇不相參恊請將新韻増入别為類篇詔王洙修纂胡宿范鎮繼之至是書成凡十四篇目錄一篇每篇分為上中下總四十五卷文三萬一千三百一十九重音二萬一千八百四十六以說文為本光有切韻指掌圗以三十六字母總三百八十四聲别為二十圗辨開闔以分輕重審清濁以訂虚實極五音六律之變分四聲八轉之異遞用則名音和傍求則名類隔同歸一母則為雙聲同出一韻則為疊韻同韻而分兩切者謂之慿切同音而分兩韻者謂之慿韻無字則㸃窠以足之謂之寄聲韻闕則引鄰以寓之謂之寄韻劉熙古作切韻拾玉二篇宋朝象類書書目鄭樵字始連環二卷論字畫音韻象類書十一卷論文字象類謂獨體為文合體為字文有八象字有六類八象不至則有假借之文六類不及則有假借之字又論𣑽書三卷龍龕手鑑四卷遼國統和十五年僧智光以平上去入為次兼釋中國西竺之書晁氏志三卷契丹僧行均撰凡二萬六千四百三十字注十六萬三千一百餘字僧智光為之後題云統和十五年丁酉時至道三年也鄭樵六書畧曰臣六書證篇實本說文而作凡許氏是者從之非者違之說文形也以母統子廣韻聲也以子該母臣舊作象類書總三百三十母為形之主八百七十子為聲之主合千二百文而成無窮之字說文定五百四十類為字之母然母能生而子不能生誤以子為母者二百十類七音畧曰漢人課籀隷始為字書以通文字之學江左競風騷始為韻書以通聲音之學然不識子母失制字之㫖不識七音失立韻之源七音之韻起自西域流入諸夏華僧定之以三十六為之母重輕清濁不失其倫天地萬物之音備於此矣淳熙隷釋目録五十卷洪适撰凡碑板二百八十五𤭔器二十七墨藪十卷許歸與編李氏書目止五卷評書筆勢論皆别出秦篆譜祥符中封泰山守臣摹本以獻凡四十餘字宋庠刻于石大觀中劉跂至絶頂摹之全本復傳考史記本紀大凡百四十六字而差失者九字為後序謂之泰山秦篆譜隋志小學秦刻石文一卷鄭端方篆髓六卷字義一篇乾道班馬字類中興書目乾道九年陳天麟撰前漢通用古文韻編五卷以四聲集之續目婁機取史漢古字為班馬字類二卷文心雕龍曰詭異者字體瓌恠也聨邉者半字同文也重出者同字相犯也單複者字形肥瘠也凡此四條雖文不必有而體例不無若值而不悟則非精解至於經典隱曖方册紛綸簡蠧帛裂三寫易字子思弟子於穆不似音訛之異也晉之史記三豕渡河文變之謬也說文繫傳云蔡邕漢末碩學而云色絲為絶殊不知絶字系旁為刀刀下為卩又况不及蔡邕者乎呉人云無口為天有口為呉曽不知呉從兵隨文帝惡隨字為走乃去之成隋字隋裂肉也其不祥大焉殊不知隋從辵辵安步也而妄去之豈非不學之故漢之諸儒比肩立而揚子雲以識字稱韓文公言語妙天下而猶自謂畧須識字字亦豈易識哉桃萊難悟栁卯本同凡將急就之文旁行敷落之教宋沈約慨然思與天下共識龜圖鳥迹之遺趨髙領妙自謂入神旁通曲暢律度精宻時有誦郊居賦而擊節稱善獨在雌霓一語文從字順各識其職不必有曹憲可以備顧問不必有揚子雲可以備好奇之訪師宜八分之巧元常三體之妙史籀李斯之篆梁鵠孟喜之書鸞驚之勢聞於索靖鷹跱之巧顯於蔡邕㳺霧重雲傳敬禮之法馬頡魚頏表揚泉之賦一陰一陽交春夏秋冬備而萬情生焉一柔一剛交東西南北備而萬形成焉一闢一翕交平上去入備而萬聲生焉一唱一和交開發收閉備而萬音成焉呉楚傷於輕淺燕趙傷於重濁秦隴則去聲為入梁益則平聲似去若管之以天地律吕則輕重淺深清濁之變三十有六而窮矣故字有母止於三十六也輩出為聲一之唱也故為律而屬天雜比為音二之和也故為吕而屬地鄭樵七音畧曰天籟之本自成經緯縱有四聲以成經横有七音以成緯皇頡制字深達此機江左四聲反没其㫖凡為韻書者皆有經無緯字書眼學韻書耳學眼學以母為主耳學以子為主母主形子主聲顔氏家訓曰自春秋標齊言之傳離騷目楚辭之經後有揚雄著方言其書大備然皆考名物之同異不顯聲讀之是非逮鄭玄注六經髙誘解吕覽淮南許慎造說文劉熈製釋名始有譬况假借以證音字而古語與今殊别其間輕重清濁猶未可曉加以内言外言急言徐言讀若之類益使人疑孫叔言創爾雅音義是漢末人獨知反語魏髙貴鄉公不解反語以為怪異自兹厥後音韻鋒出各有土風遞相非笑文心雕龍古之教歌先揆以法使疾呼中宫徐呼中徵商徵響髙宫羽聲下抗喉矯舌之差攅唇激齒之異廉肉相准皎然可分凡聲有飛沈響有雙疊雙聲隔字而每舛疊韻雜句而必暌沈則響發而㫁飛則聲颺不還異音相從謂之和同聲相應謂之韻韻氣一定故餘聲易遣和體抑揚故遺響難契切韻之動勢若轉圎訛音之作甚於枘方玉海卷四十五
