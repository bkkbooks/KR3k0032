body:
  text: 玉海卷五十八宋王應麟撰藝文傳尚書注云傳即注也以傳述為義史記索隱云列傳者敘列人臣事迹令可傳於後世釋名曰傳者傳也以傳示後人也黃帝星傳內傳見天文類書目黃帝內傳一卷題籛鏗得於石室劉向校書得之蓋依託云禹大傳文選離騷經王逸注禹大傳曰洧槃之水出崦嵫之山周王傳穆天子傳唐志穆天子傳六卷晉書云五篇隋志六卷汲冢書郭璞注起居注類晉時得汲冢書有穆天子傳體製與今起居正同蓋周時內史所記王命之副也春秋正義周王遊行五卷文選陶潛讀山海經詩泛覽周王傳中興書目六卷晉太康二年汲郡民發古冢得之其書言穆王遊行之事侍中荀朂等校正郭璞為之注序曰謹以一尺書紙寫上請付祕書繕寫藏之中經副在三閣詔荀朂和嶠等以隸字寫之六卷八千五百一十四字書正義漢書注水經注引之拾遺記穆王三十二年巡行天下有書史十人記其所行之地孔子六藝傳史記封禪書孔子論述六藝傳略言封泰山禪梁父者七十餘王矣其俎豆之禮不章蓋難言之大史公論六家曰儒家以六藝為法六藝經傳以千萬數夏小正傳春秋正義大戴禮夏小正傳曰繁遊胡春秋瑞應傳白虎通三正篇春秋瑞應傳曰敬受瑞應而王改正朔易服色漢髙祖孝文傳見御製漢保傅傳青史氏記學禮昭紀始元五年六月詔曰通保傅傳注文頴曰賈誼作在禮大戴記大戴禮第三卷保傅第四十八殷周有道之長秦無道之暴其故可知也太子生舉以禮自為赤子時教固以行矣周成王幼在襁褓之中召公為太保周公為太傅太公為太師此三公之職也為置三少皆上大夫也曰少保少傅少師故孩提三公三少固明孝仁禮義以導習之逐去邪人不使見惡行於是比選天下端士孝悌間博有道術者以輔翼之使之與太子居處出入及太子少長則入于小學見賈誼傳學禮曰云云太子既冠成人免於保傅之嚴則有司過之史有虧膳之宰有進善之旍有誹謗之木有敢諫之鼓瞽史誦詩工誦正諫大夫進諫士傳民語習與智長化與心成是殷周所以長有道也三代之禮云云食以禮徹以樂失度則史書之工誦之三公進而讀之宰夫減其膳是天子不得為非也明堂之位曰道者導天子以道常立於前是周公也充者充天子之志常立於左是太公也弼者拂天子之過常立於右是召公也承者承天子之遺忘常立於後是史佚也注道或謂之疑充或謂之輔故成王中立而聽朝則四聖維之是以慮無失計舉無過事及秦不然云云夫存亡之反治亂之機其要在是矣天下之命係於天子天子之善在於早諭教與選左右云云此時務也新書保傅篇天子不論先聖王之德云云太師之任也云云至太史之任也新書傅職篇春秋之元詩之關雎禮之冠昏易之乾坤皆慎始敬終云爾素成繁成謹為娶妻嫁女必擇孝悌世世有行義如是則子孫慈孝黨無不善三族輔之故曰素成胎教之道書之玉版藏之金匱置之宗廟以為後世戒青史氏之記曰注青史子古者胎教王后腹之七月而就宴室太史持銅而御户左太宰持升一作斗而御戶右新書云太卜持龜蓍而御堂下諸官皆以其職御於門內比及三月王后所求聲音非禮樂則太師緼瑟而稱不習所求滋味者非正味則太宰倚升新書云荷斗而言曰不敢以待王太子太子生而泣太師吹銅曰聲中某律太宰曰滋味上某新書云太卜曰命云某然後卜名上無取於天下無取於墬中無取於名山通谷無拂於鄉俗是故君子名難知而易避也成王生仁者養之孝者繦之四聖傍之有知而選太公為師周公為傅王左右不可不諫也故曰繁成注賈子胎教與此同古者年八歲而出就外舍學小藝焉履小節焉小學謂庠門一作虎闈保之學也束髮而就大學學大藝焉履大節焉大學王宫之東此太子之禮居則習禮文行則鳴珮玉升車則聞和鸞之聲是以非僻之心無自入也在衡為鸞在軾為和馬動而鸞鳴鸞鳴而和應聲曰和和則敬此御之節也上車以和鸞為節下車以佩玉為度上有雙衡下有雙璜衡牙蚍珠以納其間琚瑀以雜之行以采茨趨以肆夏步還中矩進則揖之退則揚之然後玉鏘鳴也古之為路車也蓋員以象天二十八橑以象列星軫方以象地三十輻以象月故仰則觀天文俯則察地理前視則睹鸞和之聲側聽則觀四時之運此巾車教之道也自青史氏以下太子之事也新書容經篇國不務大務得民心佐不務多務得賢臣引鮑叔史鰌事得賢者安存失賢者危亡明鏡所以察形往古所以知今凡二章三千五百五十四字保傅言其常傅職戒其變胎教原其本而所以飬於外者猶不敢忽此佩以明有度車以明有則而容經又次之白虎通諫諍篇引禮保傅大夫進諫士傳民語王失度則史書之工誦之後漢祭祀志注蔡雍引保傅五學之文詩正義引大戴保傅篇鸞和之説栁宗元四門壁記保傅篇曰帝入東學以貴仁南學以貴德西學以貴義北學以尊爵賈生述之以明太子之教禮記文王世子篇世子之記曰云云注世子之禮亡此存其記漢離騷傳淮南王安傳入朝獻所作內篇新出上愛祕之使為離騷傳旦受詔日食時上師古曰傳謂解説之若毛詩傳又獻頌德及長安都國頌隋志淮南王章句其書今亡朱買臣傳召見説春秋言楚辭帝甚説之王褒傳宣帝修武帝故事講論六藝羣書召能為楚辭九江被公召見誦讀志淮南王賦八十二篇羣臣賦四十四篇班固曰孝武詔淮南王安敘離騷傳以為國風好色而不淫云云斯論似過其實王逸云武帝使淮南王安作章句其書今亡朝氏楚辭自宋玉九辨以下皆謂之傳詳見楚辭類漢六經異傳史記自序厥協六經異傳索隱云如子夏易傳毛公詩傳韓嬰詩外傳伏生尚書大傳之流也正義云如左丘明春秋外傳國語樊倏傳永平元年以讖記正五經異説漢天下忠臣傳志陰陽家于長天下忠臣九篇平陰人近世注劉向别録云傳天下忠臣唐志武誼自古忠臣傳二十卷咸通中作南史梁元帝撰忠臣傳三十卷舊唐志雜傳孝友十家忠節三家漢列女傳志劉向所序列女傳頌圖劉向傳向睹俗奢淫而趙衛之屬起微賤踰禮制向以為王教由內及外自近者始采詩書所載賢妃貞婦興國顯家可法則及孽嬖亂亡者次為列女傳凡八篇以戒天子隋志列女傳十五卷唐志同劉句撰曹大家注又七卷趙母注唐志云趙母傳七卷又八卷高氏撰頌一卷劉歆又一卷曹植讚一卷繆襲以頌為劉歆作與向列傳不合志有頌圖非歆也曽鞏目録序隋書崇文總目皆稱十五篇曹大家注以頌義考之蓋大家所注離為十四與頌義凡十五篇益陳嬰母及東漢以來梁鴻妻十六事非向書本然也嘉祐中集賢校理蘇頌以頌義篇次復定其書為八篇家人之義歸於反身二南之業本於文王向博極羣書而此傳稱詩芣苡柏舟大車之類與今序詩者異式微一篇又謂二人之作馬融傳注列女傳班昭傅女誡七篇唐志一卷引女憲晉王接傳撰列女後傳七十二人長子愆期緣父本意又集後傳南史庾仲容列女傳三卷隋志項原列女後傳十卷唐志項宗皇甫謐傳六卷綦母邃傳七卷杜預要録三卷女記十卷唐志云列女記唐志女訓十七家二十四部三百八十三卷始於劉向終於鳯樓新誡二十卷失姓名一家有劉熙傳八卷孫夫人序讃一卷虞通之后妃記四卷長孫皇后女則要録十卷魏徵列女傳略七卷武后列女傳一百卷唐舊志雜傳列女十六家王方慶女記至楊氏女誡不著録五家八十三卷尚官宋氏女論語十篇韋氏續曹大家女訓十二章荀爽女誡程曉女典見藝文類聚曹植列女頌文選注引之漢列仙列士傳隋志漢時阮倉作列仙圖劉向典校經籍始作列仙列士列女之傳雜傳類列女傳十五卷列士傳二卷唐志同列仙傳讃二卷舊唐志二卷又二卷孫綽郭元祖讃葛洪神仙傳十卷唐志王方慶後傳十卷沈汾續神仙傳三卷史記正義七略云列仙傳二卷劉向撰唐志神仙類卷同人崇文目同凡七十二書目列仙傳三卷劉向撰凡六十三人杜光庭仙傳拾遺四十卷凡四百二十九事沈汾續仙傳三卷凡飛升十六人隱化二十人樂史總仙袐録一百三十卷自天皇氏以來類聚登仙名氏各紀事實為五十四門上之史嘗為上清文苑王松年仙苑編珠一卷自唐以來一百二十八人見素子洞仙傳十卷凡二百九十二人南史梁顔協撰晉仙傳五篇江祿撰列仙傳十卷後漢注水經注文選注引列士傳又引列仙傳讃漢武帝傳唐志神仙三十五家漢武帝傳二卷郭憲漢武帝别國洞冥記四卷字子橫隋志漢武內傳三卷莊子釋文引之書目漢武帝內傳二卷載西王母事後有淮南王公孫卿稷丘君八事乃唐終南玄都道士遊岩所附洞冥記四卷後漢光祿大夫郭憲載武帝神怪事漢中興名臣列士傳建武以來名臣傳皇德傳列傳班固作世祖本紀又撰功臣平林新市公孫述等列傳載紀二十八篇臨邑侯復好學永平中與班固賈逵共述漢史復子騊駼及從兄平望侯毅並有才學永寧中鄧太后召毅及騊駼入東觀與謁者僕射劉珍著中興以下名臣列士傳東觀記一百二十六卷起光武注記至靈帝題云長水校尉劉珍撰珍唐志騊駼集二卷集二卷劉珍字秋孫南陽人少好學永寧元年詔珍與騊駼作建武以來名臣傳侯瑾按漢記撰中興以後行事為皇德傳三十篇文苑二唐志瑾集卷唐志正史類皇德紀三十卷隋志同起光武至沖帝傳後漢五行志注引皇德宋太祖時沮渠茂虔獻漢皇德傳二十五卷寇鄧髙勳耿賈鴻烈經術如桓榮丁鴻范升賈逵純吏如任延杜詩文章如班彪父子刑法如郭躬將帥如班超諫諍如鍾離意申屠剛寬厚如侯霸漢陳留耆舊傳見地理唐許南容䇿京兆耆舊光武創其篇陳留神仙阮蒼述其事梁鴻作逸人之記劉向修孝子之圖孔子弟子先儒傳隋志十卷唐志孔子弟子傳五卷姚淡四科傳讃四卷宋元嘉十四年河西獻四科傳四卷書目皇朝李畋為孔子弟子贊傳六十卷十萬餘言國史志李略魏海內先賢隋志魏海內先賢傳四卷魏明帝時撰唐志魏明帝五卷李氏海內先賢行狀三卷舊唐志雜傳先賢耆舊三十九家晉高士傳皇甫謐傳字士安以著述為務自號玄晏先生撰髙士逸士列女等傳並重於世高士傳序曰梁鴻頌逸民蘇順敘髙士或録屈節雜而不紀又近秦漢不及逺古謐采古今八代之士自堯至魏凡九十餘人雖執節若夷齊去就若兩龔皆不録也隋志皇甫謐高士傳六卷逸士傳一卷選注引之張顯逸民傳七卷嵇康聖賢高士傳贊三卷唐志傳八卷周續之傳贊三卷孫綽至人髙士傳贊二卷周弘讓續高士傳七卷唐志鍾離儒逸人傳七卷書目皇甫謐髙士傳十卷起堯世至魏咸熙中魏志注嵇康撰録上古以來聖賢隱逸遁心遺名者集為傳贊自混沌至于管寧凡百一十有九人嵇康所贊缺一自擬宋周續之傳以嵇康髙士傳得出處之美因為之注南齊書宗測續皇甫謐髙士傳三卷後漢注引劉昭幼童傳唐志十卷晉正始名士傳竹林名士傳袁宏傳宏字彥伯著竹林名士傳三卷唐志袁宏名士傳三卷世説袁宏以夏侯太初等三人為正始名士阮嗣宗等七人為竹林名士裴叔則等八人為中朝名士隋志正始名士傳三卷袁敬仲撰江左名士傳一卷劉義慶撰竹林七賢論三卷戴逵撰中興書目崇文目同正始名士傳三卷其中卷竹林名士三逸上卷增荀粲下卷增阮修文選五君詠引竹林名士傳顔延年作五君詠以述竹林七賢黜山王晉江表傳虞溥傳字允源注春秋經傳撰江表傳子勃過江上江表傳於元帝詔藏祕書吳志注引之唐志虞溥江表傳三卷雜史類晉益部耆舊傳陳壽傳字承祚撰古國志五十篇