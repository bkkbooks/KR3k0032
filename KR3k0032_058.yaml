禦戎新録見兵書李渤傳元和初召為左拾遺家東都朝廷政有得失附章疏陳論又撰禦戎新録二十卷表獻之舊史唐西南備邊録志兵書類李德裕十三卷中興書目劒南西川節度使德裕撰大略謂成都藩翰西南備禦不可少弛於是纂兵將糧械之數城鎮種落之名嵗計經用之目並以大和六年為斷及諸郡故實外夷情狀煩碎畢書又新作城鎮緣邊賊路皆以朱書别之總成小圖標之首卷今所存僅一卷餘皆缺第四卷敘維州本末尤詳會昌中上之詳見籌邊樓唐華陽風俗録志地理類張周封一卷字子望西川節度使李德裕從事崇文目同唐元和録書目三卷馬永易撰起元和三年迄大中十三年政迹總號元和録蓋因所紀初年云唐皇室維城録志譜牒類一卷崇文目同唐經史要録見經解舊史鄭浣為侍講學士文宗命撰經史要録二十卷書成上喜其精博因以十九書語類上親自發問浣應對無滯錫以金紫志是光乂十九部書語類十卷開元二十二年十一月上見類書唐科第録見科舉唐諭善録志雜家庾敬休七卷唐四夷朝貢録見朝貢類崇文目地理類十卷唐皇王寶運録志雜史類楊岑卷亡憲宗時人功臣録三十卷韋昭度楊涉續皇王寶運録十卷蜀韋莊箋自武帝至少帝崇文目同唐開成承詔録志雜史李石二卷記大和中君臣問答之語唐年小録志故事馬總八卷唐栁氏家學要録志小説類二卷柳珵書目柳氏家學一卷凡三十四章朝氏志一卷采其祖彥昭祖芳父冕家集所記纍朝典章因革時政得失著此録又常侍言旨一卷記世父登所著六章唐神州等第録托言神州解送自開元天寶之際率以在上十人謂之等第必求名實相副以滋教化之源小宗伯倚而選之或至渾化不然十得其七八天府之盛神州之雄選才以百數為名等列以十人為首起自開元天寶之世大厯建中之年得之者搏躍雲衢階梯蘭省今所傳者始于元和丙戌嵗次敘名氏目曰神州等第録王定保撰八十三門記唐朝進士應舉登科雜事唐餘録寶元二年十一月戊子朔刑部直集賢院王皥上六十卷詔奬之建隆垂統録關耆孫進太平興國録八年九月癸丑朔祕書監錢昱獻太平興國録一卷求換臺省官令學士院召試制詔三篇改袐書監判尚書都省雍熙唐孝悌録三年正月著作佐郎樂史獻唐孝悌録十五卷史本傳云二十卷續五卷續卓異記三卷兩朝志樂史孝悌贊五卷咸平六年九月甲午直史館樂史獻所習廣孝新書孝悌録上清文苑總仙記凡八百卷唐志有王方慶友悌録十五卷雍熙大政要録雍熙三年九月戊辰户部郎中知陜州張去華獻大政要録三十篇上覽而嘉之璽書褒美賜帛五十假因留不遣去華獻元元論大指以養民務穡為急真宗嘉賞寫為十八軸天聖七年七月己卯泰州泰興簿胡訥上所著孝行録二卷賢惠録二卷民表録三卷國史志淳化皇猷録淳化元年十月庚午金州觀察使判和州錢儼獻皇猷録一卷優詔答之咸平初又獻光聖録淳化正辭録紹興正辭録又見羣祀景祐崇祀録淳化二年七月戊申袐書監李至以新撰正辭録三卷上崇文目同先是祠祀祝詞命著作局官屬臨事撰進多不合典禮向來所用之文辭義淺近罔依古式至是乃撰成數百首上進永為定式焉一本云凡百九十三首內八十四首新製餘皆依舊詞取左氏祝史正辭之義也真宗景德元年十二月癸卯命知制誥李宗諤及楊億陳彭年詳定祥符二年四月庚寅命兩制禮官取祕書省學士院祝版據正辭録重定紹興二十七年九月二十五日丁亥詔禮官及祕書省依景德故事取祭祀之式考訂潤色為紹興正辭録依校書郎葉謙亨請也景祐三年七月己卯詔以太子少傅孫奭所撰大宋崇祀録二十卷送史館初奭領太常以國朝典禮倣唐王涇郊祀録為此書未奏而卒子殿中丞瑜表上之崇文目二十卷儀注類咸平聖政録六年八月戊寅太僕少卿直袐閣錢惟演上二卷詔付史館實録咸平三年五月丙申以錢惟演為太僕少卿惟演獻咸平聖政録二十事召試有是命景德戴斗懷柔録景德初元年盟好之議翰林學士趙安仁多所參預撰答書又記太祖朝書問規式及接伴乃裁定覲見儀制安仁又録和好以來事宜及采古事可附于今為豫備者作戴斗懷柔録以獻本傳同志王晦叔戴斗奉使録二卷祥符法寶録祥符二年正月庚辰學士楊億等上景德傳燈録三十卷本僧道原所獻詔億等刋定六年八月丁亥御製法寶録序兵部侍郎趙安仁等纂集新經并所降制詔賜名大中祥符法寶録凡二十三卷八年十月甲辰上之會要二十一卷景祐元年四月十五日參政王隨刪傳燈録為十五卷二年十月辛未知樞密院王隨上傳燈玉英集摹印攽行三年十月辛酉李遵朂上所纂天聖廣燈録三十卷下傳法院四年四月乙巳譯經使吕夷簡上所定景祐法寶新録二十一卷先是三年十二月夷簡及潤文宋綬請御製序賜名是録自祥符四年後至景祐三年元豐元年十月二日參政元絳參定傳法院新編法寶録梁書簡文撰法寶聯璧三百卷唐志釋氏類貞觀內典録十卷書目唐內典録十卷麟德初西明寺僧智升撰載歷代佛書傳譯篇目本末傳燈録三十卷僧道原纂景德中詔翰林學士楊億等刋定自天竺七佛至達磨西來傳至法眼凡五十二世一千七百人語録續燈録三十卷惟白撰分五門法苑珠林一百卷唐僧道世撰朝逈法藏碎金録十卷祥符殊祥録天源録錢易傳東封泰山獻殊祥録盛度上天源録五卷王質監舒州靈仙觀採古今練形攝生之術撰寶元總録百卷天禧雲南録中興書目二卷天禧元年監虔州商稅辛怡顯撰淳化五年以西蜀順賊與南蠻結連詔募命官士庶通邊事者往黎嶲界招撫時怡顯自薦請行至道元年訖事而歸是書備載始末云路振祥符初使契丹撰乘軺録以獻本朝名臣録書目本朝名臣録八卷不知作者編類建隆至乾興三朝諸臣列傳叛臣蠻夷附焉以實録國史校之間有不同本朝勳德傳一卷不知作者編類太祖至仁宗諸臣有勳德者起范質終孫沔凡五十六人名賢遺範録十四卷王旦遺事録四卷子素撰王曽言行録三卷葉清臣撰韓琦别録三卷王巖叟撰張詠語録四卷李畋撰後人類為一集又王曾言行録一卷凡六十七事王皥撰皇朝政録十卷晏殊序曰皇帝仁宗閲三朝之方册思為要略以便討論於是仰稽信諜博采宏綱掇英存實罔不森羅彼無逸圖屏典論刋石方兹巨美慶厯四年講祖宗聖政録恐即此書當考非可同年宋朝會計録國史志地理類林特三十卷丁謂景德六卷田況皇祐六卷蔡襄治平六卷丁謂傳權三司使上會計録以景德四年民賦户口之籍較咸平六年之數具上史館請自今以咸平籍為額嵗較其數以聞詔奬之林特傳奉詔撰會計録田況傳況鈎考財賦盡知其出入乃約景德會計録以今財賦所入多於景德而嵗之所出又多於所入因著皇祐會計録上之冀以悟上更立經制使百姓實而縣官有餘用也朝氏志丁謂景德中纂三司户口稅賦之入及兵食吏祿之費會計天下每嵗出納贏虧之數李吉甫元和國計圖之類也慶厯兵録五年樞密副使丁度搜次首末鈎考纎微掇其攻守戰者為禁兵民兵兵録五篇宋祁為序曰宋興經武制衆凡軍有四一曰禁兵殿前馬步三司隸焉卒之鋭而剽者充之或挽強或踏張或戈船突騎或投石擊刺故處則衛鎮出則更戍二曰廂兵諸州隸焉卒之力而悍者募之天下已定不甚持兵惟邊蠻夷者時時與禁兵參屯故事於服勞間亦戍更三曰役兵羣有司隸焉人之遊而惰者入之若牧置若漕挽若營軍若工技業一事專故處而無更四曰民兵農之健而材者籍之視鄉縣大小而為之數有部曲無營壁闕者輒補嵗以閲焉此國家制軍之略也今參預丁公進使樞省五年四月庚戌度為樞副為兵録合羣曹所分擲諸條所隱彚而聨之部分班如也離而件之區處戢如也雖五符猥并邊瑣曲折嵗列廢置月比耗登披文指要坐帷而判蓋簡稽之決要搜乘之總凡録成乃上於官軍篇之首公各述其所由近衛别録示有尊也餘軍弗載略所緩也文約事明成一王法兵録凡五卷編傳云又慶厯贍邊録一卷年總録八卷書目慶厯軍録一卷不知作者取三朝史兵志及國史自天聖成書之後建立壁壘次序編為此書皇祐登瀛祕録皇祐中宋并據杜佑通典條目摘其要務編類首之以選舉次禮樂制度兵農大略遺逸者補之為八卷樂黃目撰學海搜竒録四十卷皇祐朱邸恩華録見宗戚類至和太平盤維録又見宗戚類右武大將軍睦州團練使宗諤進太平盤維録纂歷代宗屬事迹勒成上下二帙總六卷分十二門熙寧蕃夷朝貢圖詳見內附類七年九月丁未史館修撰宋敏求等上總二十一卷即四年十月六日李評所請也熙寧聖朝徽名録書目十卷熙寧中李德芻類載太祖迄神宗六朝羣臣表上尊號儀制詔册始末宋庠尊號録一卷自漢至仁宗有序評贊元豐華戎魯衛信録六年九月二十四日丙寅吏部侍郎蘇頌上二百二十九卷事目五卷總二百册元豐四年八月奉詔編類北界國信文字詮次類例皆稟聖謨初頌進對上曰朕欲集國朝以來至昨代州定地界文案比類編次為書非卿不可成頌奉詔置局樞庭仍辟王汝翼李士京檢閲文字至是上之上嘉歎親筆賜名詔别録一本送密院序云六年六月五日宸筆賜名以敘事冠篇首終於蕃夷雜録總序二百卷卷有冗併則釐為上中下敘事書詔誓書嵗幣國信國書奉使驛程地圖名銜年表儀式賜豫交馳詔録書儀例物市易條例泛使文移河東地界邊防契丹世系國俗官屬關口道路蕃軍馬州縣終於蕃夷雜録而經制方略論議奏疏附焉紹聖五年續編兩朝魯衛信録置局密院元豐土貢録中興書目二卷元豐中翰林學士李清臣等撰先是清臣詳定朝會儀注所承詔稽案圖志推原物産凡輕重多寡條列上之二卷元祐稽古録司馬光撰二十卷自三晉開國迄顯德末為歷年圖治平元年三月十四月上七卷宋興至治平四年為百官表大事記威烈丁丑而上伏羲書契以來總為稽古録始伏羲迄治平四年周共和庚申始為編年元祐元年三月十四日光上言人主不可不觀史善者可為法不善者可以為戒載籍浩博宜提其綱目撮其精英欲以稽古録送正字范祖禹校對繕寫俟讀寶訓畢取此書進讀令侍讀隨文解釋以資稽古之萬一從之光又為通厯八十卷慶元初龔頤正上續稽古録一卷起熙寧元年至紹熙五年未幾有毁板之旨宣和重修博古圖録又見圖類三十卷鼎尊罍彜舟卣瓶壺爵斝觚斗巵觶角杯敦簠簋豆鋪甗錠鬲鍑盉盦鐎斗瓿罌氷鑑氷斗匜匜盤洗盆鋗杅鐘磬錞鐸鉦鐃戚弩機鐓奩錢硯滴托轅承轅漢輿輅飾周雙螭表座漢表座旗鈴刀筆杖頭唐蹲龍漢鳩車六朝鳩車漢龍提梁鑑鐵鑑始於鼎終於鑑建炎三君行事紀要録元年六月癸亥李綱奏自古創業中興之主如漢高光唐太宗皆有英明之資寬誠之德仁厚而有容果斷而不惑故能戡定禍難身致太平因請以所編三君行事紀要録以進上可之紹興七朝詔誥録四年五月二十七日丙子詔館閣官以纍朝制誥類編為七朝詔誥録從祕書少監劉大中之請也書不克成紹興修宰輔録又見宰相類治平四年九月己丑詔實録院檢討陳繹具上祖宗朝兩府拜罷之因後撰拜罷録以進紹興九年三月六日丙戌詔宰輔拜罷録詳略失中本末差舛令史館重修史館言凡抵牾者宜悉改正從之書未成二十一年九月庚子袐書少監林機建言又命國史日厯所重修然亦不克成陶集聖賢羣輔録自燧人四佐至八儒二墨凡二卷唐志有蔣乂宰輔録七十卷紹興編忠義録十三年六月十四日詔史館編修靖康建炎忠義録先是閏四月己酉吏部郎王揚英言乞托事實暴人耳目靡間存沒編為一書故也書不克成乾道同符貞觀録三年三月起居舍人洪邁給事中王曮等上序云臣等三月七日蒙宣召至選德殿講論古今帝王之道且曰唐三百年惟太宗為可尚齋心敬慕每事取法宜為朕采貞觀時事以今曰觀之托其所近似求所未至臣等曰太宗之治固為可慕然要者無出諫行言聽神宗序通鑑謂太宗所謂禹吾無間然者謹采貞觀事迹列為二十門事為之説件别以上實録三年三月癸亥曮邁同進呈同符貞觀録讀至聖孝篇馬周諫往九成宫事上曰是失思慮讀畢上曰朕有疏謬卿等當詳説容熟觀淳熙四繫録三年權禮侍郎李燾進四繫録記女真契丹起滅自紹聖迄宣和靖康凡二十卷上曰朕可一日忘此虜哉皇朝名臣言行録五朝起趙普至蘇洵凡五十五人三朝起韓琦至陳師道凡四十人朱熹撰嘉定聖宋遵堯録八卷羅從彥撰采祖宗故實可垂法後世者纂録辨釋嘉定七年南劒守臣劉允濟上之南北攻守録五十八卷李壁撰玉海卷五十八
