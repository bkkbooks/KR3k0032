body:
  text: 玉海卷一百九宋王應麟撰音樂樂器鐘金類附八音之列數者金為長金聲之動物者鐘為大黃帝景鐘五鐘鎛鐘十二鐘又見樂類管子五行篇昔黃帝以其緩急作五聲調政理之緩急作五聲也以正五鐘令其五鍾吕氏春秋亦云帝作五聲以正五鐘一曰清鐘大音大音東方鐘名二曰赤鐘重心三曰黃鐘灑光四曰景鐘昧其明名不以色特謂之景景者大也應西方之聲以象成功五曰黑鐘隱其常五聲既調而后作五行以正天時五官以正人位人與天調然後天地之美生注謂甘露醴泉之類也自大音重心以下皆鐘名其義則未聞宋志鐘者世本云黃帝工人垂所造隋志鎛鐘每鐘懸一簨虡各應律吕之音即黃帝所命伶倫鑄十二鐘和五音者也通典世本云黃帝工人垂造鐘山海經云炎帝之孫鼓延始為鐘又禮記云垂之和鐘鄭玄曰垂堯時鐘工未知孰是高辛氏鐘册府元龜高辛氏使鼓人拊鞞擊鐘鳳凰鼓翼而舞通厯高辛氏制鼙鼓鐘磬塤箎拾遺記顓頊居位文德者則錫以鐘磬山海經鼓延始為鐘為樂風堯和鐘舜鏞禹鐘文王鐘明堂位垂之和鐘叔之離磬注垂堯之共工和離謂次序其聲縣也世本曰垂作鐘無句作磬正義舜典垂作共工鄭不見古文以為堯垂所作調和之鍾宋均曰舜臣鑄大鐘書笙鏞以間注鏞大鐘孫炎曰鏞深長之聲孟子高子曰禹之聲尚文王之聲以追蠡注禹時鐘在者追蠡也追鐘鈕欲絶文王之鐘不然鬻子禹以五音聽政喻以義者擊鐘商頌庸鼓有斁注大鐘曰庸周雅賁鼓維鏞於論鼓鐘注鏞大鐘鄭氏云西方之樂謂之鏞鏞功也宋志高堂隆曰尚書傳曰舜定鐘石論人聲夏龍簨虡殷崇牙周璧翣明堂位夏后之龍簨虡殷之崇牙周之璧翣注簨虡以縣鐘磬橫曰簨飾之以鱗屬植曰虡飾之以裸屬羽屬簨以大版為之謂之業殷又於龍上刻畫之為重牙以挂縣紘也周又畫繒為翣戴以璧垂五采羽於下植於簨之角上飾彌多也周頌曰設業設虡崇牙樹羽正義龍簨虡以龍飾之云云夏時簨虡皆飾之以鱗至周乃别故云龍簨虡魯有三代樂縣之飾禹為銘於筍虡見招諫類詩有瞽注崇牙上飾卷然可以懸也商金奏商頌那奏鼓簡簡箋云奏鼓奏堂下之樂也以金奏堂下諸縣其聲和大又奏升堂之樂弦歌之庸鼓有斁注大鐘曰庸箋云鐘鼓斁斁然有次序周編鐘筍虡春官磬師掌教擊磬擊編鐘教縵樂燕樂之鐘磬注教視瞭也磬亦編於鐘言之者鐘有不編不編者鐘師擊之疏鐘不編十二辰零鐘也若書傳左五鐘右五鐘縵謂雜聲之和樂也燕樂房中之樂也視瞭掌凡樂事播鼗擊頌磬笙磬磬在東方曰笙笙生也在西曰頌頌亦作庸庸功也掌大師之縣賔射皆奏其鐘鼓鎛師中士二人注鎛如鐘而大疏獨在一虡典庸器及祭祀帥其屬而設筍虡冬官鳬氏為鐘已厚則石已薄則播侈則柞弇則鬱長甬則震磬氏為磬已上則摩其旁大上聲清故摩鑢其旁爐音慮已下則摩其專大下聲濁也專音端梓人為筍虡樂器所縣橫曰筍植曰虡謂鐘磬鎛天下之大獸五宗廟之事脂者膏者以為牲致美味也裸者羽者鱗者以為筍虡貴野聲也厚脣弇口出目短耳大胸耀後大體短脰若是者謂之裸屬恆有力而不能走則於任重宜大聲而宏則於鐘宜若是者以為鐘虡是故擊其所縣而由其虡鳴鋭喙決吻數目顅脰小體騫腹若是者謂之羽屬恆無力而輕其聲清揚而遠聞無力而輕則於任輕宜其聲清揚而遠聞於磬宜若是以為磬虡故擊其所縣而由其虡鳴小首而長搏身而鴻若是者鱗屬以為筍三禮圖鐘磬十六枚同在一簨虡十六枚之數起於八音倍而設之故十六隋志編鐘小鐘也春官大司樂凡樂事大祭祀宿縣遂以聲展之小胥正樂縣之位王宫縣樂縣謂鐘磬之屬縣於筍虡者宫縣四靣象宫室四靣有墻諸侯軒縣三靣其形曲如車輿春秋傳成二年曰請曲縣繁纓以朝諸侯之禮也去南靣避王也卿大夫判縣又去其一靣左右之合又空北靣士特縣又去其一靣縣於東方或於階間辨其聲凡縣鐘磬半為堵全為肆鐘磬編縣之二八十六枚而在一虡謂之堵鐘一堵磬一堵謂之肆半之者謂諸侯之卿大夫士也諸侯卿大夫半天子之卿大夫西縣鐘東縣磬士亦半天子之士縣磬而已春秋傳曰歌鐘二肆疏左氏衆仲云舞節八音行八風故以八為數樂縣之法取數於此又倍之為十六詩虡業維樅注植曰虡橫曰栒業大版樅崇牙也皇氏曰崇牙者崇重也謂刻畫大版重疊為牙三禮圖制度曰為龍頭反顧銜璧璧下有旄牛尾飾簨虡鳥獸皆開動頰􅝋周鳬氏鐘考工記鳬氏為鐘鳬羽物也輕莫尚焉為鐘以鳬氏取其聲之輕兩欒謂之銑鐘口兩角銑間謂之于于上謂之鼓鼓上謂之鉦鉦上謂之舞四名鐘體也于鐘唇上祛鼓所擊處舞上謂之甬甬上謂之衡二名鐘柄鐘縣謂之旋旋蟲謂之幹旋所以縣之以蟲為飾今時旋有蹲熊盤龍辟邪疏曰漢法鍾旋之上以銅篆作之鐘帶謂之篆篆間謂之枚枚謂之景枚鐘乳也今時鐘乳俠鼓與舞每處有九靣三十六疏漢法一帶有九于上之攠謂之隧十分其銑去二以為鉦以其鉦為之銑間去二分為鼓間以鼓間為舞修去二分為舞廣鐘之大數以律為度廣長圜徑假設之耳其鑄之形則各隨鐘之制為長短大小也疏即所圖者是也以鉦之長為甬長以甬長為圍參分其圍去一為衡圍參分甬長二在上一在下以設其旋鐘已厚則石已薄則播侈則柞弇則鬱長甬則震大鐘十分其鼓間以其一為之厚小鐘十分其鉦間以其一為之厚疏據上所圖鼓外有銑間乃銑外有二間鉦外唯一間就外中十分之一為厚如古之樂器應律之鐘狀今之鈴不圜故有兩角鐘大而短則聲疾而短聞小而長則聲舒而遠聞三禮圖此特縣鐘謂黃鐘律倍半而為之周無射鐘大林國語景王二十三年將鑄無射鐘名而為之大林無射之覆單穆公曰不可王不聽問律於伶州鳩對曰律所以立均出度也古之神瞽古樂正考中聲量之以制度律均鐘百官軌儀紀之以三平之以六成之於十二天之道也細鈞有鐘無鎛昭其大也大鈞有鎛無鐘鳴其細也王卒鑄大鐘二十四年鐘成左傳昭二十一年春天王將鑄無射泠州鳩曰夫樂天子之職也音樂之輿也鐘音之器也天子省風以作樂器以鐘之輿以行之小者不窕大者不槬則和於物物和則嘉成今鐘槬矣槬橫大不入王心弗堪其能久乎疏其聲應無射之宫故以律名鐘無射鐘在王城鑄之敬王移洛陽秦滅周徙於長安歷漢魏晉常在長安劉裕滅劉泓移於江東及開皇九年平陳又遷於西京置太常寺十五年敕毁之高堂隆傳周景王既鑄大錢又作大鐘慎子魯莊公鑄大鐘曹劌入見曰國褊小而鐘大成王分康叔以大吕唐叔以姑洗史記樂毅報燕惠王書大吕陳於元英索隱曰大吕齊鐘名吕氏春秋齊之衰也作為大吕周六鐘漢郊祀志周官天墬之祀樂有别有合其合樂曰以六律六鐘五聲八音六舞大合樂注六鐘以六律六鐘之均也三禮義宗堂下之樂以鐘為重故舉鐘而言堂上之樂以人聲為貴故以歌為稱言歌者知是堂上之音稱奏者知是堂下之樂大司樂注以黃鐘之鐘大吕之聲疏曰奏者奏擊以出聲故據鐘而言歌者發聲出音故據聲而説又曰凡樂皆先奏鐘以均諸樂鄭云黃鐘陽聲之首大吕為之合此據十二辰之斗建與日辰相配合皆以陽律為之主陰吕來合之周三鐘春官大司樂凡樂圜鐘為宫黃鐘為角大蔟為徵姑洗為羽冬日至於圜丘奏之凡函鐘為宫大蔟為角姑洗為徵南吕為羽夏日至於方丘奏之黃鐘為宫大吕為角大蔟為徵應鐘為羽於宗廟奏之若樂六變八變九變則天神地祇人鬼可得而禮矣注此三者皆禘大祭也天神則主北辰地祗則主崑崙人鬼則主后稷先奏樂以致其神圜鐘夾鐘也生於房心之氣為大辰天帝之明堂函鐘林鐘也生於未之氣坤位或曰天社黃鐘生於虛危之氣為宗廟以此三者為宫用聲類求之天宫夾鐘地宫林鐘人宫黃鐘凡五聲宫之所生濁者為角清者為徵羽此樂無商者祭尚柔商堅剛也疏曰若十二律相生終於六十即以黃鐘為首終於南事今此三者為宫各於本宫上相生為角徵羽三禮義宗凡樂之變數皆用宫之本數為終黃鐘在子數九故九變而終夾鐘在卯數六故六變而畢林鐘在未數八故八變而止凡樂以辰數為終均者取其中聲之調各得依其辰始之音凡用十二調而作者各用本數為樂終非獨此三也後魏志春秋昭二十年晏子曰七音服子慎注云黃鐘之均黃鐘為宫大蔟為商姑洗為角林鐘為徵南吕為羽應鐘為變宫㽔賔為變徵一縣十九鐘十二縣二百二十八鐘八十四律周書世俘云奏鏞大享一終注奏鏞擊鐘徐景安樂書曰鎛鐘律鐘也吕氏春秋黃帝命伶倫鑄十二鐘世本倕氏作鐘自黃鐘至應鍾各當辰位編鐘十六枚同一簨虡通黃鐘大吕二均之聲其大架二十四枚通十二律正倍合二十四聲歌鐘亦編十六枚郊祀設於壇上宗廟設於堂上皆居歌磬之東以節升歌之句周左右五鐘周禮樂師注尚書傳曰天子將出撞黃鐘之鐘右五鐘皆應入則撞㽔賔之鐘左五鐘皆應大師於是奏樂疏黃鐘陽聲之首陽主動出則撞之右五鐘謂林鐘至應鐘右陰主靜是動以告靜者㽔賔在午陰生之月陰主靜入亦是靜左五鐘謂大吕至中吕左陽主動入靜以告動也大師於時奏采齊肆夏亦見韓詩外傳漢揚雄傳注東都賦注周十二鐘春官典同凡為樂器以十有二律為數度以十有二聲為齊量注數度廣長也齊量侈弇之所容疏樂器謂鐘也古之神瞽度律均鍾以律計倍半十二聲則十二辰零鍾鍾則聲也十二鍾皆有所容多少之齊量此職掌十二律之鍾是十二辰之零鍾非編者磬師疏鍾不編者十二辰零鍾也若書傳云左五鐘右五鐘也周清廟鐘銘宋三鐘梁周代古鐘晉六鐘隋律厯志山謙之記云殿前三鐘悉是周景王所鑄無射也端門外鐘案其銘題定皆夷則其西廂一鐘驗其鐫刻乃是大蔟宋武平中原使將軍陳傾致三鐘小大中各一則今之太極殿前二鐘端門外一鐘是也按西鐘銘則云清廟撞鐘秦無清廟此周制明矣又一銘曰大蔟鐘徵則林鍾宫所施也武帝鐘律緯云云音樂志梁武帝善鐘律立為四器名之曰通又制十二笛用笛以寫通聲校古鐘玉律并周代古鐘並皆不差晉義熙十二年五月廬江霍山獲六鐘獻之十四年漢中崖際有銅鐘十二出焉宋泰始四年二月丙申豫章獲古鐘姚察有建康三鐘記郭緣生述征記洛陽太極殿大鐘六周金奏金錞鐲鐃鐸漢錞于晉錞于地官鼓人教六鼓四金之音聲以晉鼓鼓金奏注金奏謂樂作擊編鐘以鎛師祭祀鼓金奏之樂掌金奏之鼓金鐘師掌金奏鐘鼓奏九夏注擊金以為奏樂之節謂鐘及鎛擊鼓疏凡作樂先擊鐘次傳金奏肆夏之三以金錞和鼓注錞錞于也圜如碓頭大上小下樂作鳴之與鼓相和曰疏曰錞于之名出于漢之大豫樂官晉語趙宣子伐備鐘鼓聲其罪也戰以錞于丁寧警其民也小吳語鳴鐘鼓丁寧錞于丁寧鉦也師注和錞于以金鐲節鼓注鉦也形如小鐘軍行鳴之以為鼓節司馬職曰軍行鳴鐲公司馬執鐲鼓進鳴鐲疏詩有鉦人伐鼓形如小鐘者據漢法而言以金鐃止鼓注鐃如鈴無舌有秉執而鳴之以止擊鼓司馬職曰鳴鐃且卻亦卒長執鐃知疏約漢法而以金鐸通鼓注大鈴也振之以通鼓司馬職曰司馬振鐸兩司馬執之大閲三鼓摝鐸金司馬法曰鐸聲不過琅大疏大鈴亦約漢法知之鈴金舌曰金鐸三金皆司馬在軍所用金錞不見在軍所用作樂之時和鼓齊始興王鑑為益州刺史什邡民段祖以錞于獻鑑古禮器也高三尺六寸六分圍二尺四寸圓如筒上有銅馬以繩縣馬令去地尺餘灌之以水又以器盛水於下以芒莖當心跪注錞于以手振芒則其聲如雷後周自蜀得之皆莫之識斛斯徴曰此錞于也依干寶周禮注以芒筒將之其聲極振乃取以合樂宣和博古圖説云其製中虛椎首而殺其下今樂府金錞就擊於地灌水之制不復考矣今太常作伏虎於其上武舞入則撞之梁簡文金錞賦協宫和徵節往通來映似月之遙羽飛如鳬之去旌軍魚麗而齊上陳龍膝而俱行望鳥雲之入敵聞條風之入營聽響而先登聞鳴而為節制六師之進旅驚三軍之武志如陳器柏寢出鼎汾陰劉貺太樂令壁記淳于圜如碓頭大上小下垂以龍芒莛搏以和鼓沈約宋書云今人間時有之則宋非庭廟所用後周平蜀獲之斛斯徴觀曰錞于也依干寶周禮注試之如其言博古圖有虎龍山紋圓花縶馬龜魚魚雙魚鳯虎蜼錞凡十九周木鐸夏木鐸左傳襄十四年師曠曰夏書曰遒人以木鐸徇于路注遒人行人之官木舌金鈴求歌謡之言書胤征每歲孟春遒人以木鐸徇于路注遒人宣令之官木鐸所以振文教禮小宰正歲帥治官之屬觀治象之法徇以木鐸曰不用法者國有常刑注古者將有新令必奮木鐸以警衆使明聽也木鐸木舌文事奮木鐸武事奮金鐸疏檀弓云自寢門至于庫門振木鐸明堂位振木鐸於朝天子之政也鐸皆以金為之以木為舌則曰木鐸以金為舌則曰金鐸武事奮金鐸者鼓人云金鐸通鼓大司馬云兩司馬振鐸是也宫正春秋修火禁小司徒徇教法鄉師四時之征令有常者徇於市朝小司冦令刑象士師徇五禁于朝司燬氏中春修火禁于國中皆以木鐸月令仲春先雷三日奮木鐸以令兆民漢食貨志行人振木鐸徇于路以采詩師古曰行人遒人也鬻子禹曰教以事者振鐸揚子使諸儒金口而木舌博古圖有栖鳳鐸雷柄鐸魯林鐘晉景鐘銘左傳襄十九年季武子以所得於齊之兵作林鐘而銘魯功焉注鎛鐘聲應林鐘因以為名臧武仲曰夫銘天子令德諸侯言時計功大夫稱伐禮典庸器注司農云庸器有功者鑄器銘其功春秋傳曰云云晉語魏顆却秦師于輔氏其勳銘于景鐘景公之鐘之崔駰傳勒景襄鐘齊鎛鐘大鐘管子霸形篇桓公起行筍虡之間管子從至大鐘之西大鐘鳴管子曰古者言樂於鐘磬之間者不如此言脫於口而令行乎天下遊鐘磬之間而無四靣兵革之虞公於是伐鐘磬之縣淮南子齊景公鑄大鐘博古圖齊侯鎛鐘銘曰師于淄陲命汝政于朕三軍綴成朕師旟之政乃敢用拜稽首弗敢不對揚朕辟皇君之錫休命擇吉金鐵鎬鐼用作鑄其寶鎛用祈眉壽令命難老不顯皇祖其作福元孫其萬福純魯和協而九事俾若鐘鼓汝考壽萬年永保其身俾百斯男又齊侯鐘四鐵鎬玄鏐鐼鋁乃用作鑄其寶鐘周蛟篆鐘銘曰擇乃吉金萬葉無疆用之協相昔張懷瓘在翰林時見古鐘紀夏禹之績皆紫金鈿以蛟篆遲父鐘銘曰遲父作姬齊薑和林夾鐘用昭乃穆穆不顯龍光乃用蘄丐多福矦父洎齊萬年眉壽子子孫孫無疆寶聘鐘銘曰宫令宰僕錫聘鐘十有二聘敢拜稽首漢辟邪鐘二環鈕鐘二對螭鈕鐘晉歌鐘寶鎛左傳襄十一年十二月鄭賂晉以歌鐘二肆注三十二枚疏歌必先金奏故鐘以歌名之孔朝注鐘以節歌也及其鎛磬國語云寶鎛注小鐘也女樂二八晉侯以樂之半賜魏絳絳始有金石之樂國語悼公十二年成十年鄭賂晉以襄鐘注鄭襄公之廟鐘博古圖有齊侯鎛鐘銘四百九十二字宋公䪫鐘銘曰宋公成之䪫鐘六鐘銘文無異䪫字與莖通用楚九龍之鐘淮南子泰族訓闔閭伐楚燒高府之粟破九龍之鐘注楚為九龍之􅙇以縣鐘也初學記十龍之鐘見賈誼新書鄭以楚金鑄三鐘秦昭和鐘祕閣有秦昭和鐘形制瑰譎其始得之豳雍間其銘首曰不顯朕皇且十有三公直集賢院劉敞為賦曰閲故府之藏器歷先秦之遺蹤云云上搬拏而夭矯若騰蛟兮升龍下紛結而扶倚狀菱華與芙蓉洵款識之尚傳兮邈沮頡之遺迹響沉潛以寂默兮文幽晦而蔽匿秦收兵器銷以為鐘鐻伯牙遞鐘漢王褒傳聖主得賢臣頌曰伯牙操遞鐘注晉灼曰二十四鐘各有節奏擊之不常故曰遞臣瓚曰楚辭云奏伯牙之號鐘師古曰琴名是也選注傅玄琴賦序齊桓公有鳴琴曰號鐘馬融笛賦曰號鐘高調豐山九鐘山海經曰豐山有九鐘焉是知霜鳴郭璞曰霜降則鐘鳴後郡國志注漢大鐘奏咸池淮南汜論訓高帝總鄒魯之儒墨通先聖之遺教戴天子之旗乘大輅建九斿撞大鐘擊鳴鼓奏咸池揚干戚劉子文武篇見樂類前志孔光奏鐘工磬工員各一人不可罷魏高堂隆傳青龍中西取長安大鐘隆上疏周禮疏後鄭舉漢法鐘旋之上以銅篆作蹲熊及盤龍辟邪漢高廟鐘溫室鐘見室類三輔黃圖高祖廟在長安西北故城中關輔記曰秦廟中鐘四枚皆在漢高祖廟中三輔舊事云高廟鐘重十二萬斤漢舊儀云高祖廟鐘十枚各受十石撞之聲聞百里古今樂録明帝徙二鐘在南宫漢鐘虡樂崇牙後紀建武二十八年正月己巳賜東海王疆虎賁旄頭鐘虡之樂郊祀志建章未央長樂宫鐘虡銅人生毛時以為美祥上林賦撞千石之鐘立萬石之虡甘泉賦金人仡仡其承鐘虡嵌巖巖其龍鱗西都賦列鐘虡於中庭東京賦崇牙張鏞鼓設賈誼虡賦妙雕文以刻鏤象巨獸之屈竒負大鐘而欲飛李尤鐘虡銘曰鴻鐘怒虡物得其宜初學記引三輔黃圖曰始皇造虡高三丈鐘小者千石隋盧賁曰周武克殷得鶉火天駟之應其音用七漢興加應鐘故十六枚而在一虡鄭玄注周禮二八十六虡東方朔傳武帝時未央宫殿前鐘無故自鳴漢樂均禮大司樂六律六同注國語曰律所以立均出度也古之神瞽考中聲而量之以制度律均鐘言以中聲定律以律立鐘之均疏中聲謂上生下生定律之長短均即是應律長短者注又云以黃鐘之鐘大吕之聲為均疏欲作樂先擊此二者以均諸樂鐘師以鐘鼓奏九夏鄭云先擊鐘次擊鼓論語始作翕如也謂金奏國語周景王將鑄無射單穆公曰先王制鐘大不出鈞重不過石注鈞所以鈞音之法也以木長七尺者弦繫之以為鈞伶州鳩曰律所以立均出度也注均者均鍾木長七尺有弦繫之以均鍾者度鐘大小清濁也漢大豫樂官有之後漢律志天子以冬夏至御前殿合八能之士陳八音聽樂均度晷景候鍾律權土灰冬至陽氣應則樂均清夏至陰氣應則樂均濁前志聽工以律知日冬夏至一人張衡賦考理亂於律鈞注樂叶圖徵曰聖人承天以立均宋均注均長八尺施絃以調六律五聲傅毅舞賦奏均曲注樂叶圖徵曰聖人立五均均者亦律調五聲之均也月令疏易緯通卦驗云夏至人主從八能之士或調黃鐘或調六律或調五音注金為鐘革為鼓石為磬竹為管絲為絃或調五聲或調五行注謂五英或調律厯謂六莖或調陰陽謂雲門咸池或調正德所行謂韶夏濩武漢黃鐘紀中平三年二月鑄黃鐘四注其音中黃鐘也子為黃鐘鐘縣於玉堂及雲臺殿前漢黃鐘樂器見迎氣樂漢華鐘魏華鐘東都賦東京賦同發鯨魚鏗華鐘注薛綜曰海中有大魚曰鯨海邊有獸名蒲牢素畏鯨鯨魚擊蒲牢輒大鳴凡鐘欲令聲大者作蒲牢於上所以撞之者為鯨魚鐘有篆刻之文故曰華景福殿賦開南端之豁達張筍虡之輪豳華鐘杌其高縣悍獸仡以儷陳體洪剛之猛毅聲訇磤其若震漢金鏞洪鐘東京賦設業設虡宫縣金鏞撞洪鐘伐靈鼓西京賦洪鐘萬鈞猛虡趪趪校獵賦撞鴻鐘建九旒河東賦鳴洪鐘建五旗禮儀志歲首鐘鳴受賀漢鐃禮鼓人疏鐃如鈴無舌者亦約漢法而知也博古圖有漢舞鐃二舞戚一魏㽔賔無射鐘唐㽔賔鐘魏都賦長庭砥平鐘虡夾陳劉逵注曰文昌殿前有鐘虡其銘曰惟魏四年歲在丙申龍次大火五月丙寅作㽔賔鐘無射鐘建安二十一年七月始設鐘虡於文昌殿前歲月及銘各鑄于鐘之甬王粲銘㽔賔曰皇命孔昭造兹衡鐘紀之以三平之以六度量允嘉氣齊允淑表聲韶和民聽以睦時作㽔賔永享遐福銘無射曰造兹衡鐘有命自皇三以紀之六以平之厥量孔嘉厥齊孔時音聲和協人德同熙聽之無射用以啓期唐儀衛志乘輿入門太樂令命擊㽔賔之鐘左五鐘皆應鼓柷奏采茨之樂至太極門戛敔樂止既入鼓柷奏太和之樂至門戛敔樂止魏銅鐘杜夔傳黃初中為太樂令協律都尉漢鑄鐘工柴玉巧有意思夔令玉鑄銅鐘其聲鈞清濁多不如法數毁改作晉銅鐸棧鐘郭璞傳元帝初鎮建業王導令郭璞筮之遇咸之井璞曰東北郡縣有武名者當出鐸以著受命之符其後建興二年十二月晉陵武進縣人於田中得銅鐸五枚及帝為晉王又使璞筮之遇豫之暌璞曰會稽當出鐘以告成功上有勒銘在人家井泥中得之繇辭所謂先王以作樂崇德殷薦之上帝者也及帝即位大興初元年會稽剡縣人果於井中得一鐘長七寸二分口徑四寸半爾雅釋文云長三寸口徑四寸上有銘上有古文竒書十八字云會稽嶽命餘字時人莫識之璞曰蓋王者之作必有靈符塞天人之心與神物合契然後可以言受命矣觀五鐸啓號於晉陵棧鐘爾雅云鐘小者棧告成於會稽鐸發其響鐘告其象瑞不失類出皆以方豈不偉哉王廙傳晉陵有金鐸之瑞郭璞云必致中興宋志晉建興二年十二月晉陵武進民陳龍在田中得銅鐸五枚水經注沔水注晉元熙二年竟陵郡巾水戌上得銅鐘七口泰始中得漢時故鐘見度類咸康五年豫章南昌民掘地得銅鐘四枚太守褚裒以獻升平五年二月乙未南掖門得銅鐘一宋元嘉二十二年豫章出銅鐘齊永明五年三月豫章縣長岡山獲神鐘一晉洛陽鐘虡王述傳桓溫平洛陽議欲移洛陽鐘虡述曰方蕩平區宇旋軫舊京不應先事鐘虡徐景安樂書曰樂纂云昔晉人有銅藻盤無故自鳴問之於張茂先茂先扣之謂人曰此器與洛陽宫鐘聲相諧宫中撞鐘故鳴也若以鑢之音殊其鳴可止後果如其言晉鐸荀朂傳逢趙賈人牛鐸識其聲及掌樂乃曰得趙之牛鐸則諧矣遂下郡國悉送牛鐸果得諧者後周長孫紹逺造樂器唯黃鐘不調聞浮圖三層上鐸鳴其音雅合宫調因取而配奏方克諧宋長安六鐘鍾律緯云宋武所取長安六鐘其三在洛到彥之入河先定伊闕宋文帝詔使取此鐘七年之季旋覆京師三鐘翳沒竟不果致梁鎛鐘隋志晉及宋齊縣鐘磬皆十六虡宫縣有四鎛鐘黃鐘大蔟㽔賔姑洗雜以編鐘磬衡衡大於鎛不知何代所作梁武帝曰六律不具何謂四廂備樂於是除去衡鐘設十二鎛鐘各依辰位而應其律每一鎛鐘則設編鐘磬各一虡合三十六虡植建鼓於四隅元正大會用之唐十二鐘二十四鐘太極殿鐘樂志隋用黃鐘一宫唯擊七鐘五鐘設而不擊謂之啞鐘高祖命祖孝孫張文收吹調五鐘叩之而應由是十二鐘皆用詳見律類會要古制雅樂宫縣之下編鐘四架十六口近代用二十四正聲十二陪聲十二各有律吕凡二十四聲登歌一架亦二十四鐘初學記岑文本太極殿前鐘銘貞觀之十四載歲在上章乃詔鳬氏鑠銅為鐘陳諸路寢之庭以紀壺人之節爾乃邛都作貢虞倕騁神六齊不忒四時合度大小允窕槬之中清濁得舒疾之和股肱之績必紀爪牙之功是勒永貽懿範被之無疆北史元孚曰黃鐘之磬十四器名黃鐘聲實夷則又有儀鐘十四虡初不叩擊今據鳬氏修廣之制磬氏倨句之法依十二月為十二宫各準辰次鐘磬各以十二架為定奏可唐樂縣二十虡朝會十二虡樂志樂縣之制宫縣四靣天子用之若祭祀則前祀二日大樂令設縣于壇南內壝之外北向東方西方磬虡起北鐘虡次之南方北方磬虡起西鐘虡次之鎛鐘十有二在十二辰之位植雷鼓於北縣之內道之左右植建鼓於四隅置柷敔於縣內柷在左敔在右設歌鐘歌磬於壇上南方北向磬虡在西鐘虡在東琴瑟箏築皆一當磬虡之次匏竹在下凡天神之類皆以雷鼓地祗之類皆以靈鼓人鬼之類皆以路鼓朝會則加鐘磬十二虡設鼓吹十二案於建鼓之外又設羽葆鼓一大鼓一金錞一歌簫笳皆二登歌鐘磬各一虡節鼓一歌者四人琴瑟箏築皆一在堂上笙和簫箎塤皆一在堂下若皇后饗先蠶則設十二大磬以當辰位而無路鼓軒縣三靣皇太子用之若釋奠于文宣王武成王亦用之其制去宫縣之南靣判縣二靣唐之舊禮祭風伯雨師五嶽四瀆用之其制去軒縣之北靣皆植建鼓於東北西北二隅特縣去判縣之西靣或陳於階間有其制而無所用凡植者為簨橫者為虡虡以縣鐘磬皆十有六周人謂之一堵唐人謂之一虡自隋以前宫縣二十虡及隋平陳得梁故事用三十六虡唐初因隋舊高宗蓬萊宫成增用七十二虡武后時省之開元定禮始依古著為二十虡昭宗時張濬修樂縣言舊制太清宫南北郊社稷及諸殿廷用二十虡而太廟含元殿用三十六虡非古乃復用二十虡徐景安樂書引開元禮與志同而鐘虡四以當甲丙庚壬磬虡四以當乙丁辛癸與開元禮異通典開元中大樂典制凡天子宫縣太子軒縣之樂鎛鐘十二編鐘十二編磬十二凡三十六虡宗廟與殿廷郊丘社稷則二十虡靣列去編鐘各二虡六典凡簨虡飾以崇牙旒蘇植羽宫縣則金五博山軒縣則金三博山含元殿賦曰神虡如生熊熊愕眙唐鎛鐘編鐘歌鐘唐八音樂器志凡樂八音自漢以來惟金以鐘定律吕制度最詳餘七者史官不記唐獨宫縣與登歌鼓吹十二案樂器有數餘略不著而其物名具在八音一曰金為鎛鐘為編鐘為歌鐘為錞為鐃為鐲為鐸二曰石為大磬為編磬為歌磬三曰土為塤為􅑧􅑧大塤也四曰革為雷鼓為靈鼓為路鼓皆有鼗為建鼓為鼗鼓為縣鼓為節鼓為拊為相五曰絲為琴為瑟為頌瑟頌瑟箏也為阮咸為築六曰木為柷為敔為雅為應七曰匏為笙為竽為巢大笙也為和小笙也八曰竹為簫為管為箎為笛為舂牘此其樂器也樂記注相即拊也以韋為表裝之以粳疏曰擊拊而輔相於樂唐崇業里黃鐘李嗣真傳高宗時擢太常丞太常缺黃鐘不能成嗣真居崇業里疑土人有之弗得其所道上逢一車有鐲聲甚厲嗣真曰宫聲也市以歸振於空地若有應者掘之得鐘衆樂遂和唐三鐘通典唐開元禮皇太子元正冬至受羣臣賀展軒懸於殿庭以姑洗之均又設三鎛鐘姑洗夷則大吕各依辰位設登歌以南吕之均奏承和之樂唐大同殿鐘册府元龜天寶十載六月乙亥中書奏昨日辰時大同殿前鐘樓上鐘自鳴請宣示中外唐鐘銘摩揭它傳德宗自製鐘銘賜那爛陀祠金石録天寶三載六月明皇撰真源觀鐘銘并八分書唐涔陽古鐘姑洗鐘楊收傳宣宗時涔陽耕者得古鐘高尺餘收叩之曰此姑洗角也既劘拭有刻在兩欒果然收博學強記常言琴通黃鐘姑洗無射三均側出諸調唐鎛鐘圖志昭宗將謁郊廟有司不知樂虡制度太常博士殷盈孫按周法以算數除鎛鐘輕重高卬黃鐘九寸五分倍應鐘三寸三分半凡四十八等圖上口項之量及徑衡之圍乃命鑄鎛鐘十二編鐘二百四十宰相張濬為修奉樂縣使求知聲者得處士蕭承訓等校石磬合而擊拊之音遂諧五代會要王朴以為雖有樂器之狀殊無相應之和逮梁至漢十二鎛鐘不問聲律宫商但循環擊之編鐘磬徒縣而已乾德三十六虡見樂類祥符宫架樂開寶三年十一月十一日幸封禪寺觀新鐘端拱潭州古鐘端拱二年六月二十三日潭州上言湘陰縣長樂九乳灘下得鐘制作精妙上有古篆八十三字人不之識畫圖以進實録己未朔咸平五年九月乙未辰州貢古銅鐸一詔送上清宫大晟樂書應天得六鐘篆其帶曰莖鐘作樂之初得英莖之器於受命之邦景德十二鎛鐘景祐郊廟鎛鐘景德二年八月丁丑朔命學士李宗諤諫議張秉判太常仍命內臣監修樂器宗諤領大常總考十二鎛鐘而樂工相承殿庭習用三調六曲三調者黃鐘太蔟㽔賔也六曲者調有隆安正安二曲郊廟之縣則環而擊之宗諤言金聲之中鎛鐘為難一聲不及則宫商失序使十二鎛工皆精習則遲速有倫隨月用律諸曲無不通矣帝因詔黃鐘太簇二宫更增文武舞飲福三曲然鎛鐘有為節之文無擊奏之法殿庭隨均合曲而未及郊廟景祐二年七月甲辰修樂書馮元等言後周以相生之法擊之請郊廟用十二鎛鐘依辰列位隨均為節以稱備樂從之九月癸未馮元等言詳定鎛鐘本施吉禮及柔祀諸别廟先帝梁甫汾隂皆嘗具奏蓋吉禮則宫廷之縣祀禮則地祗神州先蠶别廟如今奉慈並應用之其設三十六虡四隅建鼓宜依鎛鐘與編磬依均還相而考擊之從之明道古鐘五行志明道元年五月壬午漢州江岸獲古鐘一皇祐四年乾寧得小鐘二於河濵二月己亥又進古鐘一至和二年四月甲午潭州瀏陽得古鐘一景祐編鐘圖八音新器樂斗二年二月戊午御延福宫閲樂器因問李照樂何如照對樂音高王朴律準不合古法又編鐘鎛鐘非中度之器相傳以為唐舊鐘亦有朴製者願依神瞽律法試對編鐘一虡可使度量權衡協和詔就錫慶院鑄四月戊辰命宰臣夷簡吕曾王參政綬宋齊蔡度盛同典領鑄大樂編鐘始照既鑄編鐘成以奏御遂請改制大樂五月庚寅照上九乳編鐘圖鐘舊飾以旋蟲改為龍并自創八音新器又請鑱石為編磬辛卯命工往淮陽治磬石照又言既改制金石則絲竹匏土革木亦當更制以備獻享乃鑄銅為籥合升斗四物以鐘鎛聲量之率六百三十黍為黃鐘之容合三倍於籥升十三倍於合斗十倍於升既改造諸器以定其法又增六籥為合十合為升十升為斗銘曰樂斗先是太常鐘磬每十六枚為一虡而四清聲相承不擊六月乙丑李照言十二律聲已備四清乃鄭衛之樂請於編縣中去四清鐘馮元等駁之帝令權用十二為一格且詔曰俟有知音者能考四鐘協調清濁有司别議以聞辛未崇政殿召輔臣觀新樂七月五日照言鑄鎛鐘大小法度以國語鈞石之説為法九月丁酉照等以樂成進秩賚賜有差三年二月丙辰詔馮元與阮逸胡瑗校定新舊鐘律三月丙申元等上秬黍新尺詔别為鐘磬各一架七月己亥命丁度等詳定鐘律景祐寶和鐘景祐中重作樂器以古銅器作編鐘得此鐘凡四鐘款識同有銘在其腹曰􅀢作朕皇祖文考寶和鐘􅀢其萬年子子孫孫永寶用享遂不毁藏於太常寺扣之與王朴鐘夷則清聲合而其形側垂博古圖寶和鐘三其形如鈴而不圜馮元等按款識以為漢魏時器令胡瑗倣其狀作新鐘一懸十六枚然不獲奏御皇祐編鐘四清聲譜御撰黃鐘五曲鎛鐘特磬圖古鐘二年六月丙寅學士承旨王堯臣言奉詔與太常參議阮逸所上編鐘四清聲譜法以清濁相應先後互擊取音靡曼近鄭聲不可用詔可丁卯以御撰黃鐘五音五曲凡五十七聲下太常肄習之七月戊子出御撰明堂無射宫樂曲譜見樂類九月五日詔鎛鐘特磬未協音律一作大小未合古制命阮逸等重鑄改作十一月乙酉二日召胡瑗同定鐘磬制度閠十一月丁卯置局祕閣詳定大樂庚午趙師民同詳定三年二月己丑詔采磬石訪古尺律四年十二月壬辰觀新樂于紫宸殿凡鎛鐘十二黃鐘高二尺二寸半干廣一尺二寸鼓六鉦四舞六甬衡并旋蟲共高八寸四分隧徑一寸二分深一寸釐篆帶每靣縱四橫四枚景俠鼓與舞每處有九每靣共三十六兩欒間一尺四寸容九斗九升五合重一百六斤大吕以下十一鐘並同制而兩架欒間遞減半分並中本律特磬十二黃鐘大吕股長二尺博一尺鼓三尺博六寸九分寸之六弦三尺七寸五分大簇以下股長尺八寸博九寸鼓二尺七寸博六寸弦三尺三寸七分半各中本律黃鐘厚二寸一分大吕以下遞加其厚至應鐘厚三寸五分詔以圖送中書按周禮大鐘宜厚小鐘宜薄今大鐘重一百六斤小鐘乃重一百四十八斤則小鐘厚非也磬氏云云今磬無博厚長短亦非也議者以鐘磬形制未中律度斥而不用復詔近侍詳定五年四月庚午朔崇文院聚議乙未知制誥王洙奏鐘磬依律數為大小之制者經典無正文惟鄭康成立意言之孔疏因而述之今欲依律算長短大小容受數以皇祐中黍尺為法鑄大吕應鐘鐘磬各一從之五月辛酉諫臣李兌等請以新鐘磬與舊樂參校取近雅者用之壬戌翰林學士王拱辰請稽古義參定之八月乙卯詔南郊且用舊樂先是二年二月越之蕭山得編鐘通判錢公輔圖其狀獻于朝狀如鈴而不圓其聲清以實得之海濵四年正月庚申乾寧軍獻古鐘二詔送大樂所以今所定鐘參詳漁人得小鐘二於河濵劉敞得鐘十枚於驪山北原無款識制度似周器按爾雅此棧鐘也至和二年四月甲午潭州上瀏陽縣所得古鐘一送太常寺劉敞鐘銘周氏作樂備而不和神用不享民用無嘉神祖機之乃合于天革物之難至于百年啓佑孝孫將聖多能稽古表微禮樂以興程器若工作此和鐘律鈞既同量齊既從磬管以宗革木以通干羽維容簴業維樅孝孫時御實睿實聰上天下地有民有物萬事之元其右于律神祖作之孝孫述之其作其述百工一之以享以祀于廟于郊以覲以燕于廷于朝上帝是祇先祖是熙四方是綏萬民是怡允也天子萬夀無期元豐三年八月十八日劉几言見音樂類元豐四清聲鐘元豐三年六月二十八日劉几言古編鐘磬其數皆十六蓋十二律之外有黃鐘大吕大蔟夾鐘四清聲也自李照議樂不復考擊全失古法乞依古法具四清聲八月十五日楊傑言漢得古磬十六鄭氏注禮及大周正樂三禮圖編鐘磬簫並以十六為數十二者律之本聲也四者律之應聲也故曰清聲或曰子聲李照始不用之是有本而無應有倡而無和今巢笙和笙其管皆十有九以十二管發律吕之本聲以七管為律吕之應聲請參考古制依巢和笙例用編鐘磬簫以諧八音從之十八日吳雍劉几等言以三等鐘磬參校王朴阮逸之黃鐘正與李照樂之大蔟相當朴逸之樂編鐘磬各十六雖有四清聲而實差黃鐘大吕非正聲也李照之樂雖有黃鐘大吕而缺四清聲非古制也請擇李照編鐘編磬十二參於律者增以王朴無射應鐘及黃鐘大吕清聲以為四清聲從之傑欲銷王朴舊鐘二十六日詔借王朴樂鐘為清聲毋得銷毁磨鑢元豐十二虡元豐四年十一月二十一日詳定禮文所言按儀禮大射儀諸侯之制鐘磬鎛九則天子鐘磬鎛十二虡為宫架明矣所有郊廟有司攝事樂請改用宫架十二虡從之五年七月葉防言簨虡之制不合禮經請詳考改正二十六日從之以防為樂正七年六月甲戌詔親郊歲方丘用三十六虡元祐編鐘鎛鐘見樂類崇寧景鐘崇寧三年十月九日翰林承旨張康國撰景鐘銘銘見長編其序曰皇帝踐位之五年崇寧甲申考協鐘律保合太和有魏漢津者謂宜以身為度其法始於鼎鼎變而為景鐘度高九尺植以龍虡其聲為黃鐘之正而律吕由是生焉鐘成於秋七月癸丑翟汝文景鐘銘曰政和乙未五月甲子鐘成大觀六年正月造金鐘専用於明堂宣和豐城古鐘宣和四年十月二十二日洪州豐城縣得古鐘九俱有篆文其聲中無射詔令投進崇寧中端州上樂鐘驗款識乃宋成公時物政和三年鄂州獲楚鐘紹興景鐘射殿觀禮器朝會樂紹興十六年五月十八日丙戌以景鐘制度下禮器局段拂等言欲依樂書制度以皇祐二年大樂黍尺為準取高九尺從之按大晟樂書黃帝五鐘一曰景鐘蓋黃鐘者樂之所自出而景鐘者又黃鐘之本也七月二十六日一云六月己未詔撰宰臣秦檜撰景鐘銘上之書紀舜鏞禮具周鎛十月二日戊戌上御射殿召宰執從臣至禮官館閣及武臣刺史以上觀新造景鐘禮器用皇祐故事也是日作朝會樂三曲排立時撞景鐘俟皇帝即御坐作宫架之樂俟降坐再撞景鐘官屬並推恩有差先是四月禮器局鑄造鎛鐘甲寅上曰須聲和而應律乃可用更令禮官審之八月十三日禮器局言造景鐘俟禮器俱畢進呈沈約宋志黃鐘之數六分而為雌雄十二鐘鐘以三成故置一而三之凡積分十七萬七千一百四十七為黃鐘之實日冬至音比林鐘浸以濁日夏至音比黃鐘浸以清以十二月律應二十四時範隂陽九六之數以合造化均厚薄侈弇之齊以諧清濁侈弇均厚薄中不播不石不鬱不柞銘祖考之休烈交人神之肅雍審則而儀量推律而考鈞夙夜聽之和平其心是謂天合匪石匪金八音之中金石為衆音之綱紀先擊鎛鐘以宣其聲後擊特磬以收其韻奏之以金以極其變節之以玉以成其章磬白虎通曰磬者夷則之氣象萬物之盛通禮義纂曰黃帝使伶倫造磬高辛鐘磬見樂類堯玉磬舜玉磬石磬離磬書舜典夔曰於豫擊石拊石百獸率舞注石磬也磬音之清者大司樂疏虞書鄭注曰夔語舜云磬有大小豫擊大石磬拊小石磬則感百獸相率而舞益稷戞擊鳴球注玉磬也疏樂器惟磬用玉吕氏春秋堯命夔擊石拊石以象上帝玉磬之音以致舞獸世本無句作磬皇氏曰叔之别名古史考堯時人明堂位叔之離磬注叔未聞疏叔所作編離之磬縣磬之時希疏相離禹泗濵磬書禹貢徐州泗濵浮磬注水中見石可以為磬通典近代出華原豫州錫貢磬錯梁州厥貢璆鐵銀鏤砮磬集傳璆玉磬磬石磬也林氏曰徐州貢浮磬此州既貢玉磬又貢石磬豫州貢磬錯則知當時磬最為重豈非以其聲角而在清濁大小之間最難得其和者哉之今下邳有石磬山或以為古取磬地鬻子語憂擊磬商玉磬魯磬商頌那祀成湯也鞉鼓淵淵嘒嘒管聲既和且平依我磬聲注依倚也磬聲之清者以象萬物之成殷尚聲箋云磬玉磬也堂下諸縣與管聲皆和平不相奪倫又與玉磬之聲相依玉磬尊故異言之疏鼓管和平來依磬聲此異於常磬非石磬也明堂位搏拊玉磬四代之樂器注虞夏殷周也魯語臧文仲以鬯圭玉磬如齊告糴注鳴璆也莊二十八年冬左傳成二年齊賂晉以玉磬郊特牲諸侯之宫縣擊玉磬諸侯之僭禮也疏諸侯擊石磬今擊玉磬益稷疏商頌依我磬聲磬亦玉磬也鄭玄云磬懸也以合堂上之樂玉磬和尊之也鄭以球玉之磬懸于堂下尊之故進之使在上耳周頌磬笙磬笙鐘春官眂瞭三百人掌凡樂事播鼗擊頌磬笙磬注磬在東方曰笙笙生也東方陽中萬物以生在西方曰頌西為陰中萬物所成頌或作庸庸功也頌者美盛德之形容以成功告神明大射禮曰樂人宿縣于阼階東笙磬西靣其南笙鐘其南鎛皆南陳西階之西頌磬東靣其南鐘其南鎛皆南陳疏東方生長之方西方成功之方引大射者證東方之磬為笙西方之磬為頌儀禮注言成功曰頌古文頌作庸磬又曰鼗倚于頌磬西紘注紘編磬繩也東方鐘謂之笙皆編而縣之故鼓鐘詩笙磬同音注東方之樂也疏東方物生之位謂其磬為笙磬以東為始舉笙磬則四方可知磬師中士四人掌教擊磬教視瞭也冬官磬氏為磬倨句一矩有半其博為一注博謂股博也股為二鼓為三參分其股博去一以為鼓博參分其鼓博以其一為之厚注謂股外靣鼓內靣也已上則摩其旁注謂大上聲清也薄而廣則濁已下則摩其專注謂大下聲濁也短而厚則清與眂瞭不言玉與石周頌有瞽鞉磬柷圉執競磬管將將晉鎛磬見前磬疏鎛大鐘磬大皆特縣三禮圖舊圖引樂經云黃鐘磬前長三律二尺七寸後長二律一尺八寸此謂特縣大磬配鏄鐘者也孔子在衛所擊謂編磬大戴云清廟之歌縣一磬而尚拊搏樂記云石聲磬磬以立辨君子聽磬聲則思死封疆之臣孔子磬論語子擊磬於衛有荷蕢而過孔氏之門者曰有心哉擊磬乎漢璆磬雅吹擊磬郊祀歌天地八璆磬金鼓靈其有喜展詩應律鋗玉鳴注師古曰璆美玉名以為磬長楊賦鳴鞀磬之和酌允鑠肴樂胥歌投頌吹合雅又曰拮隔鳴球注韋昭曰玉磬也桓榮傳建武十九年拜為博士車駕幸大學會諸博士論難又詔諸生雅吹擊磬盡日乃罷洞冥記漢武帝起招仙閣於甘泉宫西縣浮金輕玉之磬志鐘工磬工簫工員各一人漢犍為古磬志成帝時通鑑綏和元年犍為郡於水濵得古磬十六枚議者以為善祥劉向因説上宜興辟雍設庠序陳禮樂後魏志犍為得古磬漢以為瑞復依禮圖編縣十六周禮注鐘磬編之十六枚在一簴荀悅漢紀凡祥瑞寶磬神光見漢黃鐘磬見後琴瑟類漢登歌鐘磬書正義大射禮鐘磬在庭今鳴球於廟堂之上者郊特牲云歌者在上貴人聲也左傳襄十一年歌鐘二肆則堂上有鐘明磬亦在堂上故漢魏已來登歌皆有鐘磬燕禮大射堂上無鐘磬者諸侯樂有不備也宋朝元豐二年七月十二日議者謂儀禮堂上樂無鐘磬歌鐘者謂堂上歌之堂下以鐘鼓應之歌磬之名本無所出晉賀循奏置登歌簨虡造玉磬蓋取舜廟鳴球之制後周登歌備鐘磬隋唐迄今因之晉玉磬石磬鐘石樂鳴石律志晉汲冡得周玉律及鐘磬見律類晉太常賀循奏置登歌簨虡采玉造小磬裴頠傳令荀藩鑄鐘鑿磬以備郊廟朝享禮樂謝尚傳為鎮西將軍鎮壽陽采拾樂人制石磬以備大樂江表鐘石之樂自尚始也樂志永和十一年范寧傳守豫章大設庠序遣人往交州採石磬以供學用山海經共水多鳴石郭璞注晉永康元年襄陽郡上鳴石似玉色青撞之聲聞七八里後魏正始中徐州薛城送玉磬十六枚梁有銅磬蓋今方響之類後魏鐘磬志隋志二卷公孫崇撰後魏律志高閭上表曰崇共論樂事作鐘磬志議二卷器數為備唐大磬編磬歌磬見鐘類唐玉磬通典總章中潤州得玉磬十二以獻張文收扣其一曰是晉某歲閏月造者得月數當十三今缺其一於黃鐘東九尺掘必得焉下州求之如言而得志文宗製雲韶樂有玉磬四虡大樂令壁記宴樂張文收所造也樂用玉磬一架登歌磬以玉為之文苑英華張仲素玉磬賦挺七德以為美諧八音而作程天地之神用石宗廟及殿庭用玉唐華原磬石磬唐石磬天寶中始廢泗濵磬用華原石代之詢諸磬人則曰故老云泗濵磬下調之不能和得華原石考之乃和由是不改白居易作華原磬詩刺樂工非其人通典泗濵石可為磬近代出自華原劉貺亦云出華原百官志甄官署令供石磬地理志愛州九真有石磬樂志昭宗即位蕭承訓等校石磬合而擊拊之通禮義纂云唐禮皇后享先蠶設十二磬於辰位皇祐特磬見鐘類三年二月己丑詔徐宿泗耀江鄭淮陽七州軍采磬石元豐玉磬乾德石磬國初乾德四年六月和峴言議令徐州采泗濵石為編磬景祐中又采泗濵浮石千餘以為縣磬纍世用之元豐七年正月十九日始造玉磬出奉宸庫良玉命太常博士楊傑審定音律造編磬十六從協律郎榮咨道請也十二以應律吕四以主清聲明年郊祀即圜丘奏之元祐元年八月咨道奏請今後親祠明堂用編鐘玉磬登歌二十二日從之景祐二年李照鍊白石以為磬範中金以作鐘六月九日左司諫姚仲孫言其詭異馮元等議以十二律各配一鐘又設黃鐘至夾鐘四清聲以附正聲之次元祐編磬特磬見樂類范鎮樂書按周禮磬氏所造編磬以此為法特磬則四倍其法而為之國朝唯后廟乃用特磬非也乞於宫架內鎛鐘後各加特磬政和玉磬金鐘六年閠正月十二日大晟府言神宗命儒臣肇造玉磬藏之樂府久不施用宜略加磨礱俾與律合并造金鐘專用於明堂以薦在天之神從之博古圖有雷磬琥磬雲雷磬紹興玉磬十六年十月戊午上曰近得玉二塊方成玉磬朕親臨視之已協音律更欲按試之徐景安樂書曰甲丙庚壬設編鐘以應陽乙丁辛癸布編磬以應隂陳十二鎛鐘自子至亥各當辰位之上以應律節聲也植建鼓於四隅配乾艮巽坤之位合二十四架象二十四氣也柷在左位於寅敔在右位於戌也大磬特縣也祀先蠶降神宫縣之樂不用鎛鐘以十二大磬代之與房中之樂同設此大磬編磬周禮云編縣二八十六枚同一簨虡通黃鐘大吕二均之聲其大架者編縣二十四枚同一簨虡通十二律正倍合二十四聲歌磬亦編十六枚郊祀設於壇上宗廟設於堂上皆次歌鐘之曲以節登歌之句謂之歌磬即周禮頌磬也商頌曰依我磬聲石有一定之聲而衆聲依焉故八音之中石為難調舜之命夔八音無所不備而擊石拊石夔特兩言之鐘磬者衆樂所宗依我磬聲以磬為依也以鐘鼓奏大夏以金為首也金聲舂容石聲溫潤三代之樂皆準於磬鳴球天成而不可易者琴瑟笙竽皆人為之髙下難齊故協之以磬戞擊鳴球搏拊琴瑟以詠笙磬同音所謂始終條理金聲而玉振之逺考大韶式崇舜德戛擊鳴球祖考來格近觀商頌湯孫之將依我磬聲克祀先王八音以石為君故詩言依我磬聲韶樂以球為首故書言戛擊鳴球補夔襄蕭寥之典羽虡崇牙二八嚴列魯遺齊以請糴玉磬二以鬯圭齊賂晉以求成紀甗兼之玉磬玉海卷一百九
