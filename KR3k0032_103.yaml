body:
  text: 玉海卷一百三宋王應麟撰音樂樂樂書燕樂樂記曰凡音之起由人心生也人心之動物使之然也感於物而動故形於聲聲相應故生變變成方謂之音比音而樂之及干戚羽旄謂之樂伏羲神農少昊樂伊耆氏樂女媧充樂通典伏羲樂名扶來亦曰立本神農樂名扶持亦曰下謀見帝系譜及孝經緯隋志伊耆有葦籥之音伏羲有網罟之詠葛天八闋神農五絃事與功偕其來尚矣明堂位土鼓蕢桴葦籥伊耆氏之樂也説者以為神農御覽帝系譜女媧命娥陵氏制都良管以一天下之音命聖氏為班管合日月星辰名曰充樂既成天下無不得理孝經緯鉤命决伏羲樂曰立基神農樂曰下謀祝融樂曰屬績少昊樂曰九淵見禮記周禮疏者大司樂疏三皇之樂不存以質故也詩正義古史考云伏犧作瑟明堂位云女媧之笙簧則伏犧女媧已有樂矣坤鑿度注神農改女皇之太樂元結補樂歌十篇二十章網罟伏犧豐年神農雲門黄帝九淵少昊五莖顓頊六英髙辛咸池陶唐大韶有虞大夏夏大濩殷十代樂歌有其名亡其辭考之傳記其義或存黄帝咸池雲門承雲英韶十二鍾周禮大司樂以樂舞教國子舞雲門大卷大咸大㲈大夏大濩大武舞雲門以祀天神舞咸池以祭地示注此周所存六代之樂黄帝曰雲門大卷黄帝能成名百物以明民共財言其如雲之所出民得以有族類大咸咸池堯樂也堯能禪均刑法以儀民言其德無所不施疏卷者卷聚之義大章雖堯樂其體是黄帝樂故此大卷一為黄帝樂也周公以堯時存黄帝咸池為堯樂名則更與黄帝樂立名曰雲門則雲門大卷為一名禮記正義按蓺文志自黄帝以下至三代各有當代樂名樂記大章章之也咸池備矣注黄帝所作樂名也堯増修而用之咸皆也池施也言德無所不施也周禮曰大咸正義若依舊名則曰大章若増脩而用之則曰咸池周禮雲門在六代樂之首故知黄帝立雲門之名大卷之上加雲門者以黄帝之樂堯増脩者既謂之咸池不増脩者别名大卷周為黄帝於不増脩之樂别更立名是雲門大卷一也大司樂有雲門大卷大咸而樂記有大章咸池已差異矣漢禮樂志黄帝作咸池顓頊作六莖帝嚳作五英堯作大章舜作招禹作夏湯作濩武王作武周公作勺勺言能勺先祖之道武言以功定天下也濩言救民也夏大承二帝也招繼堯也大章章之也五英英華茂也六莖及根莖也咸池備矣注師古曰咸皆也池言包容浸潤也故云備矣莊子黄帝有咸池堯有大章莊子釋文經首咸池樂章也天運篇北門成問於黄帝曰帝張咸池之樂於洞庭之野吾始聞之懼復聞之怠卒聞之而惑帝曰吾奏之以人徵之以天行之以禮義建之以大清四時迭起萬物循生一盛一衰文武倫經一清一濁隂陽調和其卒無尾其始無首所常無窮而一不可待汝故懼也吾又奏之以隂陽之和燭之以日月之明變化齊一不主故常汝委蛇故怠吾又奏之以無怠之聲調之以自然之命動於無方居於窈㝠云云世疑之稽於聖人天機不張而五官皆備此謂之天樂無言而心説故有焱氏為之頌曰聽之不聞其聲視之不見其形充滿天地苞褁六極故惑也注此乃無樂之樂樂之至也列子奏承雲注黄帝樂呂氏春秋仲夏紀古樂篇黄帝命伶倫與榮將一作榮猨鑄十二鍾以和五音以施英韶仲春之月乙卯之日日在奎始奏之命曰咸池十二筩五鍾見後淮南子齊俗訓有虞氏之祀其樂咸池承雲九韶夏后氏其樂夏籥九成六佾六列六英殷樂大濩晨露周樂大武三象棘下楚辭張咸池奏承雲選註樂動聲儀曰黄帝樂曰咸池顓頊樂曰五莖帝嚳樂曰六英五經通義黄帝樂為咸池者道皆施於民咸皆池施也崔靈恩曰舞樂之始興於黄帝詩正義大庭有皷籥之器黄帝有雲門之樂至周尚用雲門明其聲音和集既能和集必不空絃絃之所歌即是詩也韓非子師曠曰黄帝合鬼神於泰山之上作為清角黄帝軍樂愷樂後漢志短簫鐃歌軍樂也黄帝使岐伯勸戰士即周愷樂愷歌也晉志漢短簫鐃歌樂有朱鷺等二十二曲魏晉而下各易其名以紀功烈晉志蚩尤氏帥魑魅與黄帝戰於涿鹿帝乃命始吹角為龍鳴以禦之魏武北征烏丸軍士思歸減為中鳴宋志黄帝岐伯所作以揚德建武勸士諷敵也周官曰愷樂舊唐志景龍二年十二月侍御史唐紹上疏鼓吹本軍容黄帝戰涿鹿以為警衞故掆鼓曲有靈䕫吼鵰鶚爭石墜崖壯士怒之類顓頊六莖承雲六瑩帝嚳五英九招六列六英漢志顓頊作六莖帝嚳作五英五英英華茂也六莖及根莖也澤及下也呂氏春秋顓頊生自弱水實處空桑乃登為帝惟天之合正風乃行其音熈熈凄凄鏘鏘顓頊好其音乃令飛龍作效八風之音八風八卦之風命之曰承雲以祭上帝乃令鱓先為樂倡鱓乃偃浸以其尾鼓其腹其音英英和盛貌帝嚳命咸墨作為舞聲歌九招六列六英有倕作為鼙鼓鐘磬吹苓管壎篪鞀椎鍾因令鳯鳥天翟舞之帝嚳大喜乃以康帝德舜脩九招六列六英湯脩九招六列列子奏承雲六瑩九韶晨露注六瑩帝嚳樂周禮正義隋志同樂緯曰顓頊之樂曰五莖帝嚳之樂曰六英注六英者六合之英五行者能為五行之道立根莖選注引樂動聲儀云云宋衷曰六英能為天地四時六合也五莖能為五行之道立根本也宋均曰能為天地四時六合之英華也帝王世紀髙陽氏命飛龍効八風之音作樂五英以祭上帝髙辛氏化被天下作樂六莖通典顓頊作六莖莖根也謂澤及下也帝嚳作五英英謂華茂也白虎通禮記曰顓頊樂曰六莖帝嚳樂曰五英六莖言和律厯以調隂陽五英言調和五聲以養萬物淮南子耳聽九韶六瑩注六瑩顓頊樂也漢厯志少昊髙陽髙辛周􅞳其樂故易不載拾遺記髙陽氏有浮金之鐘沈明之磬及朝萬國之時乃奏含英之樂其音清宻後魏志顓頊作承雲之舞文心雕龍帝嚳之世咸墨為頌以歌九韶楊烱少室銘曰髙陽有飛龍之樂始㑹八風帝舜有儀鳯之音初調九奏元結補樂歌作五莖六英言得五徳之根莖總六合之英華通志氏族略虞舜有五英樂有掌中英者因以為氏通鑑外紀云漢禮樂志帝王世紀放六樂撰其名故多異堯大章大咸十五弦瑟周禮舞大咸注大咸咸池堯樂也堯能禪均刑法以儀民言其德無所不施孝經緯大咸黄帝樂堯備之以待用樂記大章章之也注堯樂名言堯德之章明也周禮缺文或作大卷莊子堯有大章又前漢志樂樂動聲儀白虎通堯曰大章呂氏春秋帝堯立乃命質為樂質當為䕫質乃効山林谿谷之音以歌乃以麋􅛘置缶而鼓之乃拊石擊石以象上帝玉磬之音以致舞獸皷乃拌五弦之瑟拌分作以為十五絃之瑟命之曰大章以祭上帝漢章帝曰堯作大章一夔足矣白虎通堯曰大章大明天地人之道也公羊注堯時民樂其道章明也舜大㲈韶箾招樂九招六列六英二十三弦瑟九㲈簫韶舜廟堂樂籥舞周禮大司樂舞大㲈以祀四望注舜樂也言其德能紹堯之道䟽元命包曰舜之民樂其紹堯之業九㲈之舞注當為大韶書益稷䕫曰戛擊鳴球戛擊柷敔以作止樂球玉磬搏拊琴瑟以詠祖考來格搏拊韋為之以節樂此舜廟堂之樂虞賔在位羣后德讓下管鼗鼓合止柷敔堂下樂也上下合止樂各有柷敔明球弦鍾籥各自互見笙鏞以間鳥獸蹌蹌鏞大鍾間迭也蕭韶九成鳯皇來儀注韶舜樂名言簫見細器之備備樂九奏䟽經言九成傳言九奏周禮九變其實一也簫是樂器之小者言簫見細器之備謂作樂之時大小皆備也古文云箾磬九成朋皇來儀舜典命䕫典樂教胄子大禹謨九功惟叙九叙惟歌勸之以九歌其樂象之而韶樂遂以九為節升歌於上者九德之歌合樂而舞於庭者九韶之舞左傳季札觀樂見舞韶箾者䟽云即簫韶也曰德至矣大矣如天之無不幬如地之無不載雖甚盛德其蔑以加於此矣注舜樂樂記韶繼也注舜樂名也韶之言紹也言舜能紹堯之德周禮曰大韶䟽堯作大章舜曰簫韶䕫始制樂以賞諸侯論語樂則韶舞子謂韶盡美矣又盡善也子在齊聞韶三月不知肉味曰不圖為樂之至於斯也史記孔子與齊太師語樂聞韶音學之三月不知肉味班固曰虞韶美而儀鳯孔忘味於千載呂氏春秋舜立鼓一作仰延乃柈一作柝鼓之所為瑟益之八弦以為二十三弦之瑟帝舜乃令質脩九招六列六英以明帝德正六律和五音以通八風列子九韶注舜樂莊子舜有大韶淮南子見上尚書大傳維五紀奏鍾石論人聲始欲變堯樂招樂興於大麓之野報事還歸二年􅨳然乃作大唐之歌美堯之禪也招為賓客雍為主人始奏肆夏納以孝成皆樂章名白虎通舜樂曰簫韶漢志堯作大章舜作招招繼堯也公羊注舜時民樂其脩紀堯道也帝舜命䕫典樂又以外賞諸侯至春秋時陳公子奔齊陳舜之後招樂存焉故孔子適齊聞招文始舞本舜招舞也髙祖六年更名曰文始以示不相襲也魏文帝改曰大韶舞樂隋何妥曰秦得齊韶漢髙祖改名文始説文舜樂名箾韶史記見舞招箾注服䖍曰有虞氏之樂大韶也李斯書昭虞象武注樂動聲儀曰舜樂曰簫韶一云大韶大戴禮五帝徳舜使䕫作樂以歌籥舞和以鍾鼔卿雲歌曰於予論樂配天之靈鼚乎鼓之軒乎舞之舜七始樂漢律歴志書曰予欲聞六律五聲八音七始詠以出内五言女聽注虞書益稷篇所載舜與禹言予者帝舜也言以律吕和五聲施之八音合之成樂七者天地四時人之始也順以歌詠五常之言聽之則順乎天地序乎四時應人倫本隂陽原情性風之以德感之以樂莫不同乎一唯聖人為能同天下之意故帝舜欲聞之也樂志安世房中歌十七章之首七始華始肅倡和聲注孟康曰七始天地四時人之始華始萬物英華之始也以為樂名如六英也郊祀歌靈安留吟青黄注青黄謂四時之樂也文始本舜招舞隋志鄭譯曰周有七音之律黄鍾林鍾太蔟為天地人之始姑洗𬎼賔南吕應鍾為春夏秋冬之始是以為七舜五樂黄帝五鍾成周六樂漢郊祀志虞書曰舜在璿璣玉衡以齊七政云云合時月正日同律度量衡脩五禮五樂注師古曰五禮吉㐫賔軍嘉也五樂謂春則琴瑟夏則笙竽季夏鼓秋則鍾冬則磬也五樂尚書作五玉今志亦有作五玉者五玉即五瑞樂緯坎主冬至樂用管艮主立春樂用塤震主春分樂用鼓巽主立夏樂用笙離主夏至樂用絃坤主立秋樂用㲈兑主秋分樂用鍾乾主立冬樂用柷敔舜南風樂見琴類樂記舜作五絃之琴以歌南風䕫始制樂以賞諸侯注䕫欲舜與天下之君共此樂也正義䕫欲天下同行舜道故歌此南風以賞諸侯使海内同孝也舜樂歌尚書大傳舜樂歌曰和伯之樂舞玄鶴見上林賦注樂緯動聲儀曰孔子曰簫韶舜之遺音也温潤以和似南風之至韓詩外傳曰韶用干戚非正樂也五帝詩樂詩正義五帝以還詩樂相將故有詩則有樂山海經祝融生子長琴是處揺山始作樂舜樂名九奏樂尚書大傳虞傳曰維元祀廵守四嶽八伯壇四奥沉四海封十有二山兆十有二州樂正定樂名元祀代泰山貢兩伯之樂焉東嶽陽伯之樂舞株離其歌聲比余謡名曰晳陽儀伯樂舞鼚哉其歌聲比大謡名曰南陽中祀大交霍山貢兩伯之樂焉夏伯之樂舞謾彧其歌聲比中謡名曰初慮羲伯之樂舞將陽其歌聲比大謡名曰朱于秋祀栁榖華山貢兩伯之樂焉秋伯之樂舞蔡俶其歌聲比小謡名曰苓落和伯之樂舞玄鶴其歌聲比中謡名曰歸來幽都弘山祀貢兩伯之樂焉冬伯之舞齊落歌曰縵縵并論八音四會此上下有脱辭歸假于禰祖用特五載一廵守羣后德讓貢正聲而九族當為奏具成天子九奏之樂生注云株離舞曲名言象物株離也宋志魏公卿奏曰簫韶九奏親於虞帝之庭說苑孔子至齊郭門之外遇一嬰兒挈一壺相與俱行其視精其心端孔子謂御曰趣驅之韶樂方作記郊特牲疏虞氏大祭亦先作樂鄭注大司樂引虞書云戛擊鳴球云云此宗廟九奏之效此虞氏大祭與周同樂九奏禹大夏夏籥九成禹承夏樂周禮大司樂教國子舞大夏注大夏禹樂也禹治水敷土言其德能大中國也樂動聲儀禹曰大夏禮記樂記夏大也注禹樂名也言禹能光大堯舜之德祭統八佾以舞大夏注禹樂文舞也明堂位皮弁素積裼而舞大夏疏六冕周制故用冕而舞周樂皮弁三王服故用皮弁舞夏樂内則舞大夏疏禪代之後在干戈之前文武俱備故二十習之左傳季札見舞大夏者曰美哉勤而不德非禹其孰能脩之公羊傳子家駒曰朱干玉戚以舞大夏注夏樂也莊子禹有大夏漢志夏大承二帝也呂氏春秋禹立勤勞天下日夜不懈通大水決壅塞鑿龍門降通漻水降大漻水以導河疏三江五湖注之東海以利黔首於是命皋陶作為夏籥九成注九變以昭其功白虎通大夏言禹能順二聖之道而行之公羊注夏時民樂大其三聖相承也竹書曰夏后啟舞九韶帝王世紀啟升后十年舞九韶楚辭啟九辯與九歌注禹樂也奏九歌而舞韶注九德之歌禹樂也九韶舜樂也大荒經夏啟得九辯九歌注天帝樂名以下始歌九招於大穆之野通典禹命登扶氏為承夏之樂有鍾鼓磬鐸鞉鍾所以記有德椎鼓所以謀有道擊磬所以待有憂揺鞉所以察有訟理天下以五聲為銘於簨簴詩正義曰有商頌而無夏頌葢周室之初記録不得禹九招樂音韶禹度數聲樂史記舜紀唯禹之功為大披九山通九澤決九河定九州各以其職來貢不失厥宜方五千里至於荒服南撫交阯北發西戎析枝渠廋氐羌北山戎發息慎東長鳥夷四海之内咸戴帝舜之功於是禹乃興九招之樂索隠曰即舜樂簫韶九成致異物鳯皇來翔天下明德皆自虞帝始夏本紀舜德大明於是䕫行樂祖考至羣后相讓云云帝用此作歌云云於是天下皆宗禹之明度數聲樂為山川神主聲為律身為度稱以出山海經注竹書曰夏后開儛九招吕氏春秋湯修九招益稷予欲聞六律五聲八音在治忽以出納五言汝聽湯大濩九招韶濩䕶樂晨露樂殷桑林樂二樂周禮大司樂舞大濩注大濩湯樂也湯以寛治民而除其邪言其德能使天下得其所也左傳季札見舞韶濩者曰聖人之弘也而猶有慙德聖人之難也注殷湯樂䟽曰韶亦紹也言能紹繼大禹也荀子注殷兼用舜樂武王廢之漢志湯作濩濩言救民也春秋元命包曰湯樂名大濩濩者救也通典作大䕶言䕶救於人也莊子湯有大濩呂氏春秋仲夏紀古樂篇夏為無道暴虐萬民侵削諸侯不用軌度天下患之湯於是率六州以討桀之罪功名大成黔首安寧湯乃命伊尹作為大濩歌晨露修九招六列以見其善注皆樂名劉敞曰九招者九名也予識其三焉祈祉角之謂也墨子三辯篇程繁問樂墨子曰湯立為王事成功立因先王之樂又自作樂命曰䕶又循九招一云命曰九招商頌置我鞉鼓箋云美湯作䕶樂疏曰大䕶之樂殷之樂也改夏之制始植我殷家之樂鞉與鼓也吕氏春秋仲夏紀云云是成湯作䕶樂之事也晨露九招六列之樂葢大䕶之樂别曲名也詩譜曰周太師何由得商頌周用六代之樂故有之樂記商者五帝之遺聲商人識之故謂之商注商宋詩也聲郊特牲云殷尚韓詩外傳湯作䕶聞其宫聲使人温良而寛大商聲使人方廉而好義角聲使人惻隠而愛仁徴聲使人樂養而好施羽聲使人恭敬而好禮白虎通湯樂曰大䕶言能䕶民之急也公羊注殷時民樂大其䕶已也左傳襄十年宋公享晋侯於楚丘請以桑林荀偃士匄曰諸侯宋魯於是觀禮魯有禘樂賓祭用之宋以桑林享君不亦可乎舞師題以旌夏注桑林殷天子之樂名疏殷為大䕶此復云桑林者葢殷家本有二樂如周之大武象舞也大䕶言覆䕶下民使得其所其曰桑林唯書傳言湯大旱七年禱於桑林之社而雨大至或禱桑林以得雨遂以桑林名其樂也皇甫謐云殷樂一名桑林以為大䕶别名無文可馮莊子庖丁奏刀合於桑林之舞湯樂名吕氏春秋武王立成湯之後於宋以奉桑林湯所禱也周與微子盟曰相奉桑林注使奉桑林之樂列子周穆王奏承雲六瑩九韶晨露注九韶舜樂晨露湯樂淮南子延露選注防露古曲也樂動聲儀曰調露之樂宋均曰調和至甘露使物茂長之樂漢志有商樂鼓員十四人文王辟雍樂漢辟雍樂文王武象樂詩靈臺虡業大版維樅崇牙賁鼓大鼓維鏞大鐘於論鼓鐘於樂辟雍鼉鼓逢逢矇瞍奏公蔡邕志周頌雅樂辟雍饗射用之莊子天下篇文王有辟雍之樂帝王世紀文王作武象之樂増琴二絃曰少宫少商見象箾後漢書永平二年三月辟雍射十月養老升歌鹿鳴下管新宫八佾萬舞十年閏月甲午作雅樂塤篪東京賦春日合射設業設虡宫縣金鏞鼖鼓路鼗禮展樂具王夏闋騶虞奏左傳穆叔曰文王兩君相見之樂也注文王之三皆稱文王之德周大武象武武宿夜騶虞周武武奏大武也箋周公作樂所為舞於皇武王無競維烈允文文王克開厥後嗣武受之勝殷遏劉耆定爾功疏周公象武王伐紂之事作大武之樂既成而於廟奏之維清奏象武注武王制焉疏明堂位注象謂周頌武也謂武詩為象明大武之樂亦為象矣記文於管之下别云舞大武謂武詩則簫管以吹之武樂則干戚以舞之劉敞曰文王之舞謂之象武王之舞謂之武將舞象則先歌維清將舞武則先歌武十五學舞象象則象箾也大司樂以樂教國子舞大武注武王樂言德能成武功乃奏無射歌夾鍾舞大武以享先祖疏按元命包曰文王時民樂其興師征伐故曰武如是則文王樂名武王卒其伐功故周公作樂以為武王樂也禮記文王世子下管象舞大武大合衆以事達有神興有德也注象武王伐紂之樂以管播其聲又為之舞皆在堂下美文王武王有德師樂為用前歌後舞郊特牲擊玉磬朱干設錫冕而舞大武明堂位朱干玉戚冕而舞大武疏王者衮冕執赤盾玉斧而舞武王伐紂之樂也樂記先鼓以警戒三步以見方再始以著徃武王至盟津紂未可伐還歸三年乃遂伐之武舞再更始以明伐時再徃復亂以飭歸鳴鐃而退賓牟賈侍坐於孔子孔子與之言及樂曰夫武之備戒之已久何也對曰病不得其衆也注武謂周舞也咏嘆淫液之何也對曰恐不逮事也發揚蹈厲之已蚤何也對曰及時事也武坐致右憲左何也對曰非武坐也聲淫及商何也對曰非武音也有司失其傳也有司典樂者若非有司失其傳則武王之志荒矣子曰丘之聞諸萇弘亦若吾子之言是也賓牟賈請曰敢問遲之遲而又久何也謂久立於綴子曰夫樂者象成者也總干而山立武王之事也象武王持盾正立待諸侯發揚蹈厲太公之志也象威武武亂皆坐失行列也周召之治也象以文止武夫武始而北出再成而滅商三成而南四成而南國是疆五成而分周公左召公右六成復綴以崇毎奏武曲一終為一成始奏象觀兵盟津時再奏象克殷時三奏象克殷有餘力而反四奏象南方荆蠻之國侵畔者服五奏象周召分職而治六奏象兵還振旅天子夾振之王與大將夾舞者振鐸以為節而駟伐武舞戰象也每奏四伐一擊一刺為一伐盛威於中國也分夾而進事蚤濟也舞者各有部曲之列久立於綴以待諸侯之至也冕而總干所以教諸侯之弟也注親在舞位也祭統舞莫重於武宿夜此周道也注武曲名正義皇氏云武王至商郊停止宿夜士卒皆歡樂歌舞以待旦故名焉熊氏曰即大武之樂下而管象朱干玉戚以舞大武康周公故以賜魯也注吹管而舞象仲尼燕居下管象武疏象武武王之樂内則成童舞象疏舞武也左傳宣十二年楚子曰武王克商作頌曰國語云周文公之頌載戢干戈又作武其卒章曰耆定爾功其三曰賚之篇鋪時繹思其六曰桓之篇綏萬邦注此三六之數與今詩頌篇次不同葢是樂歌之次第疏今周頌篇次桓第八賚第九夫武有七德禁暴戢兵保大定功安民和衆豐財四篇之内有此七者之義使子孫無忘其章林氏曰樂所以象治功之成武王之功成於六故其樂謂之六成舜九功惟叙九叙惟歌故韶樂九變謂之九成襄二十九年季札見舞大武曰美哉周之盛也其若此乎公羊傳子家駒曰八佾以舞大武此天子之禮也公羊注周時民樂其伐紂也論語子謂武盡美矣未盡善也漢志武王作武言以功定天下也呂氏春秋武王即位以六師伐商克商於牧野歸乃薦俘馘於京太室乃命周公為作大武墨子三辯篇武王因先王之樂又自作樂命曰象武成王因先王之樂命曰騶虞莊子武王周公作武荀子武王合天下立聲樂於是武象起而韶䕶廢矣注武象克殷之後樂名韶䕶殷樂名禮論步中武象趨中韶䕶韶夏䕶武汋桓箾簡象注箾賈逵曰舞曲名武汋桓周頌篇名簡未詳象周武王伐紂之樂樂論紳端章甫舞韶歌武使人之心莊淮南子周人其樂大武三象棘下其服尚赤春秋繁露武王作象樂繼文以奉天樂苑文王樂名巨業武王樂名象武通典秦始皇平天下六代廟樂唯韶武存焉二十六年改周大武曰五行房中曰壽人衣服同五行樂之色漢志五行舞本周舞也秦始皇二十六年更名曰五行魏文帝改五行舞曰大武舞李斯書云韶虞武象注樂動聲儀曰周樂伐時曰武象宋均曰象伐時用干戈宋志周存六代之樂至秦唯餘韶武而已後魏志漢世唯有虞韶周武通鑑外紀武王元年己卯誓于孟津前歌後舞周六代樂六樂三樂禮大司樂中大夫二人掌成均之法以治建國之學政而合國之子弟焉注董仲舒云成均五帝之學成均之法其遺禮可法者鄭司農云均調也樂師主調其音大司樂受此成事已調之樂大月令仲春仲丁命樂正入學習樂季春之末擇吉日合樂天子率公卿諸侯大夫親往視之所以助陽達物風化天下凡有道者有德者使教焉死則以為樂祖祭於瞽宗以樂德教國子中和祇庸孝友以樂語教國子興道諷誦言語以樂舞教國子舞雲門大卷大咸大㲈大夏大濩大武注此周所存六代之樂黄帝曰雲門大卷黄帝能成名萬物以明民共財言其德如雲之所出民得以有族類也大咸咸池堯樂也堯能禪均刑法以儀民其德無所不施舜曰大㲈言德紹堯之道禹曰大夏言德能大中國湯曰大濩言德能使天下得其所周曰大武言德能成武功以六律六同五聲八音六舞大合樂以致鬼神示注大合樂者徧作六代之樂六樂即上六舞以和邦國以諧萬民以安賓客以說逺人以作動物乃分樂而序之以祭以享以祀注分謂各用一代之樂疏尊者用前代卑者用後代使尊卑有序故云序乃奏黄鍾歌大吕舞雲門以祀天神乃奏大蔟歌應鍾舞咸池以祭地示咸池大咸也乃奏姑洗歌南吕舞大㲈以祀四望乃奏㽔賓歌函鍾一名林鍾舞大夏以祭山川乃奏夷則歌小吕一名中吕舞大濩以享先妣姜嫄乃奏無射歌夾鍾一名圜鐘舞大武以享先祖先王先公凡六樂者文之以五聲播之以八音注言其均皆待五聲八音乃成凡六樂者一變而致羽物及川澤之示再變致臝物及山林之示三變致鱗物及丘陵之示四變致毛物及墳衍之示五變致介物及土示六變致象物及天神注變成則更奏也此謂大蜡索鬼神致百物六奏樂而禮畢凡樂圜鍾為宫黄鍾為角大蔟為徵姑洗為羽此律之相次靁鼓靁鼗孤竹之管雲和之琴瑟雲門之舞冬日至於地上之圜丘奏之若樂六變則天神皆降可得而禮矣凡樂函鍾為宫大蔟為角姑洗為徵南吕為羽此律之相生靈鼓靈鼗絲竹之管空桑之琴瑟咸池之舞夏日至於澤中之方丘奏之若樂八變則地示皆出可得而禮矣凡樂黄鍾為宫大吕為角大蔟為徵應鍾為羽此律之相合路鼓路鼗隂竹之管龍門之琴瑟九德之歌九㲈之舞注當為大韶於宗廟之中奏之若樂九變則人鬼可得而禮矣注此三者禘大祭也圜鍾夾鍾也函鍾林鍾也此樂無商者祭尚柔商堅剛也唐楊収傳古祀天地宗廟皆不用商及二少盖商聲剛二少聲下所以取其正裁其繁也漢祭天用商而宗廟不用謂鬼神畏商之剛䟽言六變八變九變者謂在天地及廟庭而立四表舞人從南表向第二表為一成一成則一變燕禮云終尚書云成此云變雲門已下是黄帝堯舜夏殷周者並依樂緯及元命包大合樂者薦腥之後合樂之時用之也合樂用六代分樂序之皆用一代三禘下神亦用一代天用雲門地用咸池宗廟用大韶依上分樂之次序尊者用前代卑者用後代為差也大胥以六樂之會正舞位注大同六樂之節奏小師掌六樂聲音之節與其和和錞于保氏教六藝二曰六樂注雲門大咸韶夏䕶武也疏保氏教六樂教以書大司樂教以舞大司徒三物教萬民三曰六藝樂注六樂之歌舞以六樂防萬民之情而教之和左傳莊二十年樂及徧舞注六代樂春秋疏魯禘祭用四代樂則天子禘用六代樂也鄭康成義以為祫大禘小天子祫用六代之樂禘用四代之樂公羊注周所以舞夏樂者以示初起未制作之時取先王之樂與已同者假以風化天下天下大同乃自作樂取夏樂者與周俱文也王者舞六樂於宗廟之中舞先王之樂明有法也舞已之樂明有制也舞四夷之樂大德廣及之也商頌箋周用六代之樂故周大師有商頌維清疏象舞不列於六樂葢大合諸樂乃為此舞或祈告所用周禮無之三禮義宗周公制禮用六代之樂四時祭祀分而用之祭之尊卑凡有六等故用六代之樂以六代之樂配十二調而作之一代之樂則用二調逺取黄帝者以舞樂之始興於黄帝奏者謂堂下四縣鍾聲之調歌者謂堂上琴瑟之音但一祭之中皆自為二調庭奏者常以陽聲為調升歌者常以隂吕為聲周人用六代之樂祭天雲門地以咸池宗廟以大㲈不用時王之樂以三樂其道最美故三祭用之宗廟如九德之歌彰明先祖之德也大蜡盡天地四方之神而祭之其樂亦盡用四時之調凡四方十二辰則有十二律隂陽相配二調共作一代之樂故為六樂大蜡之祭則盡用之合天地四方之神合六代之樂故終不過六漢郊祀志凡六樂奏六歌而天墬神祇之物皆至通典秦始皇平天下六代樂惟韶武存易氏曰大合樂謂求神之後合六代之樂以致之分樂而序之謂薦神之際各有其序而六代之樂各以類舉六代之樂惟舜可攷六律以左旋為序六同以右轉為序六舞以歴代先後為序凡樂者有樂之本有樂之用有樂之變大司樂之職有求神之樂有薦神之樂有用一代之樂有用六代之樂劉氏曰六變者雲門之樂一終咸池之樂葢八變而終九㲈者㲈九變而一終書云簫韶九成劉貺曰天子設司樂之官諸侯有樂正之職月令正義按易緯通卦驗云云云注調五行謂五英顓頊樂名調律厯謂六莖帝嚳樂名調隂陽謂雲門咸池調正德所行謂大韶夏濩武周房中樂儀禮燕禮有房中之樂注弦歌周南召南之詩而不用鐘㲈之節后夫人諷誦以事其君子詩譜云女史歌之以節義序詩君子陽陽左執簧右招我由房注國君有房中之樂正義執笙招友欲令在房則其人作樂在房内譜云路寢之常樂風之正經天子以周南諸侯以召南是天子諸侯皆有房中之樂鄭志張逸問云云荅曰路寢房中可用男子此路寢之樂謂路寢之下小寢之内作之天子小寢如諸侯之路寢故得有左右房箋云欲使從之於燕舞之位以燕言之明不在路寢也詩正義王肅云自闗雎至芣苢后妃房中之樂然則夫人房中之樂當用鵲巢采蘩記合樂三終正義周南召南國風篇也主后國君夫人房中之樂歌禮磬師注燕樂房中之樂隂聲也疏此即闗雎二南也謂婦人后妃以風喻君子之詩内宰正后之服位詔其禮樂之儀注薦徹之禮當與樂相應位謂房中户内及阼所立處世婦注内羞房中之羞也詩常棣箋云王與族人燕則宗婦内宗之屬亦從后於房中禮疏按尚書多士傳云大師奏雞鳴於簷下然後后夫人鳴佩玉於房中通典周公作勺又有房中之樂秦改曰壽人白雪周曲平調清調瑟調周房中之遺聲也漢代謂之三調又見後宋志按周禮注云安世樂猶周房中之樂也唐志平調清調周房中樂遺聲也周勺三象樂象樂詩酌告成大武也言能酌先祖之道以養天下於鑠王師遵養時晦時純熈矣是用大介箋周公攝六年制禮作樂歸政成王祭於廟而奏之燕禮若舞則勺注頌篇告成大舞之樂歌也内則十三舞勺注先學勺後學象文武之次也疏熊氏曰勺籥也學舞籥之文舞漢志周公作勺言能勺先祖之道也武帝䇿賢良曰虞氏之樂莫盛於韶於周莫盛於勺春秋繁露周公輔成王作汋樂以奉天子華子周公歌雍詠勺六服承德左傳象箾南籥注皆文王之樂疏鄭玄注象云此樂名象呂氏春秋仲夏紀古樂篇成王立商民反王命周公踐伐之商人服象為虐於東夷周公遂以師逐之至於海一作江南乃作三象以嘉其德三象周公所作樂淮南子齊俗訓周樂大武三象棘下注三象棘下武象樂也文選上林賦韶濩武象之樂注漢書注同張揖曰象周公樂也南人服象為虐於夷成王命周公以兵追之至於海南乃為三象樂墨子三辯篇武王因先王之樂又自作樂命曰象成王因先王之樂命曰騶虞白虎通周樂曰大武象周公之樂曰酌晏子春秋晉范昭觀齊國政顧太師曰為我奏成周之樂大師曰不習也周愷樂黄帝作之禮大司樂王師大獻令奏愷樂注獻㨗於祖愷樂獻功之樂鄭司農説以春秋晉文公振旅愷以入於晉樂師凡軍大獻教愷歌遂倡之疏愷謂愷詩師還未至之時預教瞽矇入祖廟遂使樂師倡道為之眡瞭賓射奏鐘鼓鼜愷獻亦如之注愷獻獻功愷樂也鎛師軍大獻則鼓其愷樂疏獻㨗於祖作愷歌亦以晉鼓鼓之大司馬師有功則左執律右秉鉞以先愷樂獻於社注兵樂曰愷司馬法曰得意則愷樂愷歌示喜也司農云城濮之戰振旅愷疏鄭志荅趙商問曰司馬主軍事之功故獻於社大司樂宗伯之屬宗伯主宗廟之禮故獻於祖選注引樂稽耀嘉曰武王興師誅商萬國咸喜前歌後舞詩大明疏引大誓曰師乃鼓譟前歌後舞後禮儀志漢有短簫鐃歌周官所謂凱樂凱歌也晉志永平改大予其有五方之樂者云云短簫樂所謂王師大㨗令軍中凱歌周燕樂縵樂禮磬師教縵樂燕樂之鐘磬祭祀奏縵樂注縵謂雜聲之和樂者也學記曰不學操縵不能安弦燕樂房中之樂所謂隂聲也疏縵謂雜弄調和燕樂即闗雎二南也鐘師祭祀饗食奏燕樂以鐘鼓奏之掌鼙鼓縵樂作縵樂擊鼙以和之鐘疏磬師作則師和之笙師祭祀饗射共其鐘笙之樂燕樂亦如之旄人祭祀賓客舞其燕樂漢志哀帝罷樂府有縵樂鼓員十三人注雜樂也周祴樂笙師掌教龡竽笙塤籥簫篪篴管舂牘應雅以此三器築地為之行節以教祴樂注祴夏之樂賓醉而出奏祴夏疏此則鄉飲酒及鄉射賓出奏陔是也周金奏樂禮鎛師凡祭祀鼓其金奏之樂饗食賓射亦如之疏金奏之樂即八音是也亦以晉鼓鼓之鐘師注金鐘鎛也燕禮注云以鐘鑮播之鼓磬應之所謂金奏也傳金奏肆夏周樂儀禮樂師教樂儀行以肆夏趨以采齊車亦如之環拜以鐘鼓為節行趨者接賓之儀環拜者賓拜之儀注教樂儀教王以樂出入於大寢朝廷之儀鄭司農云肆夏采薺皆樂名或曰逸詩若今時行禮於大學罷出以鼓陔為節玄謂王出既服至堂而肆夏作出路門而采薺作其反入至應門路門亦如之尚書傳曰天子將出撞黄鍾之鐘右五鐘皆應入則撞㽔賓之鐘左五鐘皆應大師於是奏樂内宰正后之服位詔其禮樂之儀注薦徹之禮當與樂相應樂師凡樂成則告備注成謂所奏一竟書曰簫韶九成燕禮曰大師告於樂正曰正歌備周鄉樂儀禮燕禮乃間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀間代也謂一歌一吹也鄉飲酒禮同遂歌鄉樂周南闗雎葛覃卷耳召南鵲巢采蘩采蘋大師告於樂正曰正歌備升歌鹿鳴下管新宫遂合鄉樂若舞則勺注周南召南王后君夫人房中之樂歌也昔太王王季居於岐山之陽躬行召南之教以興王業及文王而行周南之教以受命云云夫婦之道生民之本王政之端此六篇其教之原也故國君與其臣下及四方之賔燕用之合樂也鄉學者風也小雅為諸侯之樂大雅頌為天子之樂鄉飲酒升歌大雅禮盛可以進取燕合鄉樂者禮輕可以逮下也春秋傳曰肆夏繁遏渠天子以享元侯文王大明綿兩君相見之樂然則諸侯相與燕升歌大雅合小雅也正歌者升歌及笙各三終間歌合樂三終為一備郊特牲疏云間者謂堂上堂下一歌一吹更遞而作合者上下之樂並作又云鄭作詩譜云天子諸侯燕羣臣及聘問之賓皆歌鹿鳴合鄉樂采射義天子以騶虞諸侯以貍首卿大夫以采蘋士以􅀢為節之投壺命弦者曰請奏貍首間若一人呂氏春秋塗山女候禹于塗山之陽乃作歌曰候倚兮實始為南音周公召公取風焉注高誘曰取南音以為歌樂也周四時祭樂養老樂郊特牲饗禘有樂而食嘗無樂隂陽之義也春禘而秋嘗春饗孤子秋食耆老注禘當為禴王制曰春禴夏禘疏此謂夏殷禮也若周則四時祭皆有樂祭統云内祭則大嘗禘升歌清廟下管象是秋嘗有樂也按王制夏養老以饗禮用春時有樂無秋食之禮殷養老以食禮秋時不作樂無春饗之禮周人脩而兼用之則周人養老春夏用饗禮秋冬用食禮四時皆用樂文王世子云凡大合樂必遂養老注云春合舞秋合聲下云遂發咏焉登歌清廟是秋時養老亦用樂也又祭義疏見後周樂歌樂章周頌釋文周頌三十一篇皆是周室太平徳洽著成功之樂歌南陔白華華黍釋文此三篇葢周公制禮用為樂章吹笙以播其曲詩正義變風之作齊衞為先陳最在後變雅始厲王詩譜序曰文武時詩有周南召南雅有鹿鳴文王之屬及成王周公制禮作樂而頌聲興焉謂之詩之正經先儒說二南二十五篇為正風鹿鳴至菁莪二十二篇為正小雅文王至卷阿十八篇為正大雅皆文武成王時詩周公所定樂歌之詞尚書大傳於穆清廟周公升歌文王之功烈德澤茍在廟中嘗見文王者愀然如復見文王水經注竹書穆天子傳曰甲寅天子浮於滎水乃奏廣樂又引樂緯曰昔歸典叶聲律大荒西經曰夏后開上賓於天得九辯與九歌焉曲禮疏熊氏曰按春秋説題辭樂無大夫士制鄭玄箴膏盲從題辭之義無樂者謂無祭祀之樂故特牲少牢無樂魯四代樂禘樂四代樂器見樂器左傳襄十年荀偃曰魯有禘樂賓祭用之注禘三年大祭則作四代之樂疏唯周公之廟得用天子之禮别祭羣公則用諸侯之樂諸侯之樂謂時王所制之樂大武是也明堂位禘祭唯用大武大夏而不言韶濩以二十九年魯為季札舞四代之樂知四代之樂魯皆有之祭義禘有樂而嘗無樂三禮義宗禘樂用夾鍾為歌奏以無射之調潁容釋例曰周用六代禮樂魯受四代禮樂故不舞雲門咸池示有降殺也吴季札觀周樂左傳哀二十九年夏六月周景王九年吴公子札來聘請觀周樂魯以周公故有天子禮樂八樂記疏獻王樂記季札第十使工為之歌周南召南曰美哉始基之矣勤而不怨歌弼鄘衞曰美哉淵乎憂而不困為之歌王曰美哉思而不懼歌鄭曰美哉其細已甚齊曰美哉泱泱乎大風也哉國未可量豳曰樂而不淫秦曰能夏則大魏曰大而婉險而易行唐曰思深哉其有陶唐氏之遺民乎陳曰國無主其能久乎自鄶以下無譏焉後仲尼刪定次第故不同小雅曰其周德之衰乎猶有先王之遺民焉服䖍以為歎變小雅也大雅曰曲而有直體其文王之德乎頌曰至矣哉五聲和八風平節有度守有序盛德之所同也見舞象箾南籥者文王樂曰美哉猶有憾見舞大武者武王樂曰美哉周之盛也正義魯為季札先歌諸詩而後舞諸樂韶濩湯樂曰聖人之弘也而猶有慙德聖人之難也見舞大夏者禹樂曰美哉勤而不德韶箾舜樂曰德至矣哉雖甚盛德其蔑以加於此矣觀止矣若有他樂吾不敢請已注魯用四代樂故及韶箾而知其終也季札賢明才博在吴時已涉見此樂歌之文然未聞中國雅聲故請作周樂欲聽其聲然後依聲以參時政知其興衰也舞畢知其樂終是素知其篇數正義魯唯用四代之樂不得用大卷大咸樂有歌有舞歌則詠其辭而以聲播之舞則動其容而以曲隨之歌在堂而舞在庭以貴人聲也故先歌後舞晉賜魏絳金石樂齊君臣相説樂左傳襄十一年鄭人賂晉悼公以師悝師觸師蠲兵車百乗歌鐘二肆及其鎛磬女樂二八晉侯以樂之半賜絳曰子教寡人和諸戎狄以正諸華八年之中九合諸侯如樂之和無所不諧請與子樂之魏絳於是乎始有金石之樂疏大夫得有鐘磬之樂有功乃賜之晉語悼公十二年孟子齊景公召大師曰為我作君臣相恱之樂盖徴招角招是也其詩曰畜君何尤樂記師乙曰齊者三代之遺聲也齊人識之玉海卷一百三
