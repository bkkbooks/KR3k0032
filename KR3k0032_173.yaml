body:
  text: 玉海卷一百七十三宋王應麟撰宮室城上邊城附公羊傳城雉者何五板而堵五堵而雉百雉而城説文城以盛民也顓頊城九域志廣信軍新城髙陽記曰本顓頊所造又名伏龍城開德府澶州顓頊城顓頊之所都帝丘本顓頊之墟左傳凡土功龍見而畢務戒事也火見而致用水昏正而栽日至而畢堯城舜城湯城後漢郡國志河東郡平陽堯都此注晉地道記曰有堯城説文陶丘有堯城漢高紀注師古曰許慎説文解字云陶丘再成也在濟隂夏書曰東至陶丘陶丘有堯城堯嘗居之後居於唐改堯號陶唐氏括地志堯城在濮州鄄城縣東北十五里汾隂故城俗名殷湯城在蒲汾隂縣北九里唐會要元和八年河東節度使張弘靖奏修古舜城從之唐孫樵有舜城碑博物志禹作三城強者攻弱者守敵者戰城郭自禹始也淮南子鯀作九仞之城周城後漢志右扶風美陽有岐山有周城注杜預曰城在縣西北帝王世紀曰周大王所徙南有周原周王城周城成周九六城通鑑外紀武王既克商瞻河洛而歎曰此天室也遂遷九鼎于郟鄏周公攝政七年二月己未成王在豐將宅洛邑使太保先周公相宅史記曰成王在豐使召公復營洛邑如武王之意周公復卜申視卒營築居九鼎焉曰此天下之中四方入貢道里均作召誥洛誥焉乃卜澗水東瀍水西三月七日庚戌至王城漢志曰周公致太平營以為都是為王城十一日甲寅而成謂之宗周左傳桓二年臧哀伯曰武王克商遷九鼎于洛邑宣三年王孫滿曰成王定鼎于郯鄏注今河南也武王遷之成王定之後有西戎之難至平王即位元年嵗在辛末東遷于王城至考王封其弟於河南王城是為桓公以續周公之官職桓公卒子威公立威公卒子惠公立惠公封少子班於鞏以奉王號東周惠公而河南惠公自為西周自敬王十年几一百六十三年至赧王即位之元年嵗在丁未東西周始分治赧王復徙都西周凡六十年歲在丙午秦昭襄之元年秦滅東周作雒解周公作大邑成周于土中立城方千六百二十丈郛方七十二里南繫于洛水北因平郟一作陜山以為天下之大湊博物記曰上城方七百二十丈郛方七十里南望洛水北至陜山洛左傳襄二十四年齊人城郟杜預注曰郟王城也榖鬬毁王宮齊為王城之周語靈王二十二年郟帝王世紀河南城西有鄏陌王城面有三門凡十二門以通十二子禮地官司門注王城十二門南城門曰圉門見莊二十一年東城門曰鼎門北城門曰乾祭見昭二十四年每門有塗男子由右婦人由左車從中央南北之道為緯途闊十二步王宮當塗之經左祖右社面朝後市王宮有五門宮有六寢其內有王后六寢九嬪以下分居之近郊三十里之地為明堂以祀天天子祀上帝左巷昭二十三年子朝入王城次左巷注近東城莊宮二十六年十二月王入莊宮注在王城帝王世紀太王邑於岐山之陽美陽縣西北岐城舊址是也南有周原始改號曰周續漢志右扶風美陽有岐山有周城注杜預曰城在縣西北帝王世紀曰云云王季徙程文王受命徙都於酆在今京兆之西詩築城伊淢作豐伊匹注淢成溝也箋云文王築豐邑之城大小適與成偶大於諸侯小於天子之制武王徙都鎬亦京兆界及伐紂營洛邑而定鼎焉今洛陽西南洛水北有鼎中觀是也又曰東南門九鼎所從入門郡國志河南東城門名鼎周公相成王以酆鎬偏處西方貢不均乃使召公卜洛云云洛誥卜澗水東瀍水西注今河南城又卜瀍水東注今洛陽召誥云云注規度城郭郊廟朝市之位處於戊申三月庚戌以衆殷之民治都邑之位於洛水北今河南城池疏匠人王城方九里典命又以公城方九里天子城十二里駮匠人營國方九里疏鄭異義云周亦九里城史記成王卜居九鼎而周復都豐鎬至平王乃東徙正義括地志云洛陽故城在洛陽縣東北二十六里周公所築即成周城也詳見京輔類漢志河南郡雒陽縣周公遷殷頑民是為成周河南縣故郟鄏地周武王遷九鼎周公致太平營以為都是為王城至平王居之初雒邑與宗周通封畿注師古曰宗周鎬京也方八百里八八六十四為方百里者六十四雒邑成周也方六百里六六三十六為方百里者三十六二都得百里者百方千里東西長而南北短短長相覆為千里至襄王以河內賜晉文公又為諸侯所侵故其分地小至是七城而已後漢志雒陽摯虞曰古之周南今之洛陽周時號成周公羊傳曰成周者何東周也何休曰周道始成王之所都也帝王世紀曰成周城東西六里十一步南北九里一百步晉太康地道記曰城內南北九里七十步東西六里十步為地三百頃一十二畝有三十六步有狄泉在城中左傳僖二十九年盟于狄泉杜預曰城內太倉西南池水或曰本在城外定九年城成周乃繞之晉時此水在東宮西北有上程聚世紀文王居程徙都豐故此加為上程河南周公時所城雒邑也春秋時謂之王城鄭玄詩譜曰周公攝政五年成王宅雒邑使召公先相宅既成謂之王城千禮大司馬注畿猶限也自王城以外五里為界卷有長城經陽武到密史記蘇秦曰西有長城之界春秋昭二十六年冬十月天王入于成周傳十一月癸酉王入于成周注今洛陽三十二年冬仲孫何忌會晉韓不信齊髙張宋仲幾衛世叔申鄭國參曹莒薛𣏌小邾人城成周傳秋八月王使富辛與石張如晉請城成周注子朝之亂其餘黨多在王城敬王畏之徙都成周成周狹小故請城之天子曰昔成王合諸侯城成周以為東都崇文德焉今我欲徼福假靈于成王修成周之城俾戍人無勤諸侯用寧蝥賊逺屏晉之力也冬十一月晉魏舒韓不信如京師合諸侯之大夫于狄泉尋盟且令城成周己丑士彌牟營成周計丈數揣髙卑度厚薄仞溝洫物土方議逺邇量事期計徒庸慮財用書餱糧以令役於諸侯屬役賦丈書以授帥而效諸劉子韓簡子臨之以為成命定元年正月城成周庚寅栽設板築城三旬而畢乃歸諸侯之戍七年王入于王城公羊傳仲幾不蓑城注若今以草衣城禮諸侯為天子治城各有分丈尺漢志以為不蓑城以差次受功賦也晉太康地道記曰王城去洛城四十里城內南北九里七十步東西六里十步為地三百頃一十二畝三十六步陸機洛陽記曰洛陽城周公所制東西十里南北十三里城上百步有一樓櫓外有溝渠華延雋洛陽記曰陸機所謂洛陽城即成周也後漢魏隋並都于此城東西六里南北九里俗傳亦云九六城帝王世紀云初晉合諸侯之大夫于狄泉以成周小不受三都故壞翟泉而廣焉漢張良傳山東人勸上都雒陽東有成臯西有殽黽背河鄉洛其固亦足恃良曰其中不過數百里四面受敵非用武之國洛陽記曰左成臯右函谷前有伊闕後背孟津杜預曰作成周遷殷民以為京師之東都所以崇文王之德蓋周公以商之大夫士從武庚叛者未從周化召公既相宅又卜瀍水東周公往營之是謂下都書謂之東郊遷殷頑民於周周公親監之周公沒成王以君陳代之君陳卒康王以畢公代之自平王避西戎之難東遷洛邑居于王城王城即郟鄏更十三王凡三百六十年至敬王十年嵗在辛卯王子朝之亂其黨多居王城敬王畏之徙都成周呂氏曰王城在澗瀍之間下都在瀍水之外成周其總名杜預孔頴達皆以下都為成周謂敬王自王城徙都之其説不然左氏未嘗有敬王自王城遷成周之明文第言子朝既逐王入于成周而已東京賦先王之經邑掩觀九隩靡地不營土圭測景不縮不盈總風雨之所交以建王城召伯相宅卜惟洛食周公初基其繩則直萇弘魏舒是廣是極詳見洛宮呂溫古東周城銘文王受命肇興西土周公作洛始會風雨居中正本拓統開祚盛則駿奔衰則夾輔二伯之後時無義聲大夫萇弘言抗其傾坐召諸侯廣崇王城雖微逺猷實被令名立臣之本委質定分為仁不卜臨義不問興亡理亂在德非運罪之違天不可以訓夏官掌固掌修城郭溝池之固頒其士庶子及衆庶之守設其飾器兵甲之屬今城門之器亦然任其萬民用其材器所謂塹築及為藩落凡守者受法以通守政若造都邑則治其固與其守法都邑亦為城郭若有山川則因之若殽黽河漢考工記匠人營國國中九經九緯經塗九軌左祖右社云云王宮門阿之制五雉以為都城之制宮隅之制七雉以為諸侯之城制城隅之制九雉云云注國中城內也軌謂轍廣乘車六尺六寸旁加七寸凡八尺是為轍廣雉長三丈髙一丈都四百里外距五百里王子弟所封其城隅髙五丈諸侯畿以外也其城隅制髙七丈疏按異義古周禮説云天子城髙七雉隅髙九雉公之城髙五雉隅髙七雉侯伯之城髙三雉隅髙五雉都城之髙皆如子男之城髙左傳鄭祭仲曰都城過百雉國之害也注侯伯之城方五里徑三百雉故其大都不得過百雉武王鉤陳壘水經注河南有鉤陳壘世傳武王伐紂八百諸侯所會處尚書所謂不期同時也紫微有鉤陳之宿主兵陳故遁甲攻取之法以所攻神與句陳并氣下制所臨之辰是以壘資其名周城朔方城東方詩出車王命南仲往城于方出車彭彭旗兆央央天子命我城彼朔方赫赫南仲玁狁于襄注方朔方近玁狁之國也朔方北方也朱氏曰今靈夏等州之地禦程氏曰城朔方而玁狁之難除戎狄之道守備為本不以攻戰為先也蒸民四牡彭彭八鸞鏘鏘王命仲山甫城彼東方注東方齊地古者諸侯之居逼隘則王者遷其邑而定其居蓋去薄姑而遷於臨災也朱氏曰仲山甫奉使築城于齊王孔氏曰史記齊世家獻公元年徙薄姑治臨災當夷之時與毛傳不合毛氏在馬遷之前其言當有據始朱氏曰豈徙於夷王之時至是而備其城郭之守與綿救之陾陾度之薨薨築之登登削屢馮馮百堵皆興鼛鼓弗勝韓奕溥彼韓城燕師所完實墉實壑言髙其城深其壑實畝實籍書費誓甲戌我惟征徐戎峙乃糗糧甲戌我惟築周公城史記正義括地志云周公故城在岐山縣北九里召公故城在岐山縣西南十里此周召之采邑也楚城沂左傳宣十一年楚令尹蒍艾獵城沂使封人慮事以授司徒量功命日分財用平板幹稱畚築程土物議逺邇略基址具餱糧度有司事三旬而成不愆于素楚方城水經注郡國志曰葉縣有方城郭仲産曰因山以表名尸子曰楚狂接輿耕於方城盛弘之云葉東界有故城始犨縣東至瀙水逹泚陽界南北聯聨數百里號為方城一謂之長城云酈縣有故城一面未詳里數號為長城即此城之西隅其間相去六百里南北雖無基築皆連山相接而漢水流其南故屈完答齊桓公云楚國方城以為城漢水以為池未詳孰是水經注又云竹書紀年梁惠成王十二年龍賈率師築長城于西邊齊長城史記蘇秦傳長城巨防正義長城西頭在濟州平隂縣界竹書紀云梁惠王二十年齊閔王築防以為長城太山記云太山西有長城緣河經太山餘一千里至琅邪臺入海蘇代説燕曰齊有長城巨防秦趙燕長城漢胸奴傳秦昭王滅義渠於是秦有隴西北地上郡築長城以距胡趙武靈王北破林胡樓煩自代並隂山下至髙闕為塞而置雲中鴈門代郡燕破東胡亦築長城自造陽至襄平置上谷漁陽右北平遼西遼東郡以距胡當是時冠帶戰國七而三國邊於胸奴後秦滅六國始皇詔蒙恬擊胡悉收河南地因河為塞築四十四縣城臨河徙適戍以充之通直道自九原至雲陽因邊山險塹溪谷起臨洮至遼東萬餘里年表三十三年築長城河上三十四年築長城及南方越地三十五年為直道道九原通甘泉又度河據陽山北假中頭曼不勝秦北徙諸侯畔秦胸奴得寬復稍度河南與中國界於故塞漢揚雄上書曰以秦始皇之強蒙恬之威帶甲四十餘萬然不敢窺西河乃築長城以界之單于曰孝宣元帝為作約束自長城以南天子有之長城以北單于有之有犯塞輒以狀聞史蒙恬傳將三十萬衆北逐戎狄收河南築長城因地形制險塞賈誼過秦論曰北築長城而守藩籬郤胸奴七百餘里胡人不敢南下而牧馬主父偃曰郤地千里以河為境王恢曰蒙恬為秦侵胡辟數千里以河為境纍石為城植榆為塞胸奴不敢飲馬於河置烽􅥂然後敢牧馬朝錯書秦北攻胡貉築塞河上南攻揚粵置戍卒焉唐劉貺以為趙簡子起長城備胡詳見議邊括地志秦長城首起岷州西十二里延袤萬餘里東大遼水通典魏刁雍上表曰周命南仲城彼朔方趙靈秦始長城是築漢之孝武又踵其事漢長安城斗城十二門九市漢髙祖二年十一月漢王定三秦還歸都櫟陽蕭何侍太子治櫟陽為約束立宗廟社稷宮室縣邑五年二月甲午即位汜水之陽帝乃西都洛陽夏五月兵皆罷歸家戍卒婁敬見説上曰周之先積德十餘世成王即位周公營成周都雒以為此天下中諸侯四方納貢職道里鈞矣有德則易以興無德則易以亡陛下取天下與周易而都雒陽不便夫秦地被山帶河四塞以為固卒然有警百萬之衆可具膏腴之地此謂天府陛下入關而都之扼天下之亢而撫其背也不如入關據秦之固或曰雒陽東有成臯西有殽黽背河鄉洛其固亦足恃上以問張良良因勸上曰雒陽中小不過數百里四面受敵非用武之國夫關中左殽函右隴蜀沃野千里南有巴蜀之饒北有胡苑之利阻三面而固守以一面東制諸侯諸侯安定河渭漕挽天下西給京師諸侯有變順流而下足以委輸所謂金城千里天府之國婁敬説是也上即日車駕西都關中漢紀云長安限關中記秦西以隴關為東以函谷為界二關之中謂之關中地方千里京西京賦左據函谷二殽之阻右界褒斜隴首之險西賦左有殽函重險桃林之塞右有隴坻之隘隔閡華戎拜婁敬為奉春君後九月治長樂宮六年十二月田肯賀上曰甚善陛下得韓信又治秦中秦形勝之國也帶河阻山縣隔千里持戟百萬秦得百二焉地勢便利其以下兵於諸侯譬猶居髙屋之上建瓴水也夫齊東有琅邪即墨之饒南有泰山之固西有濁河之限北有勃海之利地方二千里持戟百萬縣隔千里之外齊得十二焉此東西秦也非親子弟莫可使王齊者上還至雒陽三月歸櫟陽七年二月自櫟陽徙都長安武帝時淮南王安獻長安都國頌惠紀元年春正月城長安師古曰長安本秦鄉名髙祖作都三年春發長安六百里內男女十四萬六千人城長安三十日罷鄭氏曰城一面故速罷六月發諸侯王列侯徒隸二萬人城長安五年春正月復發長安六百里內男女十四萬五千人城長安三十日罷九月長安城成賜民爵户一級呂氏曰凡三調發而城始成所以休民力六年夏六月起長安西市史年表立太倉西市地理志京兆縣十二長安髙帝五年置惠帝元年初城六年成史記惠三年方築長安城四年就半五年六年城就巳上月日不同合依惠紀功臣表陽城延為少府作長樂未央宮築長安城先就封梧侯史大事記髙帝六年更命咸陽曰長安索隱曰盧綰以封長安侯蓋别有此號立大市七年自櫟陽徙長安孝惠元年始作長安城西北方前紀言五年九月城成地理志言元年初城六年成史記以為三年方築四年就半五年六年城就索隱按宮闕疏四年築東面五年築北面三年初作長安城五年成六年立太倉西市三輔黃圖長安故城漢之舊都髙帝七年方修長安宮城自櫟陽徙居此城本秦離宮也初置長安城本狹小至惠帝更築之皇覽曰秦有小城惠帝始大之髙三丈五尺上濶九尺下濶一丈五尺雉髙三板周回六十五里城南為南斗形北為北斗形周地圖記同三輔舊事城形象北斗至今人呼漢舊京為斗城漢舊儀曰城中經緯各長三十二里十八步志注云十五里地九百七十三頃八街九陌三宮九府三廟十二門九市十六橋閭里一百六十三輔決録長安城面三門四面十二門皆通逹九逵以相經緯衢路平正可並列車軌十二三途洞闢隱以金椎周以林木左右出入為往來之徑行者升降有上下之别西都賦建金城之萬雉呀周池而成淵披三條之廣路立十二之通門街衢洞逹閭閻且千九市開場漢宮闕疏曰長安立九市其六市在道西三市在道東貨别隧分人不得顧車不得還紅塵四合煙雲相連西京賦城郭之制則旁通三門參塗夷庭方軌十二街衢相經後郡國志長安髙帝所都注漢舊儀曰長安城方六十三里經緯各長十五里一云十六里十二城門中屬長安令三秦記曰鑿龍首山為城城門校尉見門類光武修東都城門見大駕宮元和志長安故城在長安縣西北十三里一夲云城在唐大興宮西北十三里寰宇記長安在渭水南隔渭水北對秦咸陽宮漢於其地置未央宮曰長安城因名縣漢王二年北徙都櫟陽故秦獻公所居屬馮翊後屬萬年今京兆縣也長安秦咸陽之地長安鄉也言可長安子孫京兆所治縣也唐顯慶三年十月十七日遊覽古長安城門侍臣本朝慶厯中御邇英閣讀漢書紀問長安城衆莫能知趙師民陳自古都雍年世舊址所在若畫諸掌帝恱漢南鄭城水經注髙祖為漢王都南鄭大城周四十二里城內有小城南憑北結環雉金墉皆漢所修築晉咸康中梁州刺史司馬勳斷小城東面三分之一以為梁州漢廣武城高紀四年十月漢王引兵渡河復取成臯軍廣武注孟康曰於滎陽築兩城而相對名為廣武城在敖倉西三室山上後志河南滎陽有鴻溝水有廣武城注西征記曰有三皇山或曰三室山上有二城東廣武西廣武相去二百餘步水經注廣武城在三室山上漢所城也括地志廣武城在滎陽縣西二十里通典河南府汜水縣有廣武城漢縣邑城高紀六年十月令天下縣邑城注師古曰縣與邑皆令築城前傳淮南王曰守下雉之城注江夏縣名後志南陽章陵故舂陵世祖更名注古今注曰建武十八年使中郎將耿遵築城漢廣陵城後志廣陵注吳王濞所都城周十四里半魏志黃初六年親征幸廣陵故城史年表楚懷王十年城廣陵通典吳孫亮建興三年衛尉馮朝城廣陵通鑑晉太和四年十二月大司馬溫發徐兖州民築廣陵城徙鎮之元魏孝文欲築城置戍於淮南以撫新附之民髙閭以為昔世祖南臨瓜步諸郡盡降而盱眙小城攻之不克壽陽盱眙淮隂淮南之本原也三鎮不克其一而留守孤城其不能自全明矣昔彭城之役既克大鎮城戍已定而思叛者猶踰數萬角城蕞爾處在淮北去淮陽十八里五固之役攻圍厯時卒不能克梁韋睿至安陸增築城二丈餘更開大塹起髙樓漢城朔方繕秦故塞髙闕塞符離塞榆溪舊塞雞鹿塞武紀元朔二年甲寅春正月胸奴入上谷漁陽遣將軍衛青李息出雲中至髙闕師古曰髙闕山名曰塞名在朔方北西至符離塞名收河南地置朔方五原郡夏募民徙朔方十萬口三年秋罷西南夷城朔方城五年春大將軍青將六將軍兵出朔方髙闕衛青傳元朔二年青至隴西捕首虜數千走白羊樓煩王遂取河南地為朔方郡師古曰當北地郡之北黃河之南封青為長平侯使青校尉平陵侯蘇建築朔方城上曰胸奴逆天理造謀籍兵故遣將以征厥罪詩不云乎薄伐玁狁至于太原出車彭彭城彼朔方詩出車箋王使南仲為將率往築城于朔方為軍壘以禦北狄之難今車騎將軍青渡西河至髙闕獲首三千三百級車輜甚衆已封為列侯遂西定河南地案榆溪舊塞絶梓領梁北河討蒲泥王號破符離執訊獲醜全甲兵而還其益封三千八百户注如淳曰榆溪舊塞名也師古曰上郡之北有諸次山諸次水出焉東經榆林塞為榆溪言軍尋此塞而行符離塞名也史記云按榆谷舊河塞正義經榆林縣東四十里地理志朔方郡縣十三封沃壄並元狩二年城臨戎元朔五年城食貨志衛青嵗以數萬騎出擊胸奴遂取河南地築朔方云云興十餘萬人築衛朔方注師古曰築城又守衛之主父偃傳偃言朔方地肥饒外阻河蒙恬城以逐胸奴內省轉輸戍漕廣中國滅胡之本也上覽其説遂置朔方公孫弘諫以罷弊中國奉無用之地上使朱買臣等難弘發十䇿弘不得一謝曰願罷西南夷蒼海専事朔方上許之婁敬傳敬往胸奴結和親因言胸奴河南白羊樓煩王去長安近七百里輕騎一日一夕可至願徙豪傑名家實關中十餘萬口韓安國傳王恢曰蒙恬侵胡辟數千里以河為竟纍石為城植榆為塞伍被傳廣長榆開朔方胸奴折翅傷翼失援不振注師古曰長榆在朔方胸奴傳諸侯畔秦胸奴復聚哨渡河南冒頓南并樓煩白羊河南王復收蒙恬所奪地與漢關故河南塞至朝那膚施遂侵燕代元朔元年漢使將軍衛青將三萬騎出鴈門李息出代郡擊胡得首虜數千其明年衛青復出雲中以西至隴西擊胡之樓煩白羊王於河南得首虜數千羊百餘萬於是漢遂取河南地築朔方復繕故秦時蒙恬所為塞因河而為固漢亦棄上谷之斗辟縣造陽地以豫胡是嵗元朔二年也其明年右賢王侵擾朔方明年春漢遣衛青將六將軍十餘萬人出朔方髙闕明年春再出定襄明年秋昆邪王降隴西北地河西益少胡冦云云驃騎封狼居胥山是後胸奴逺遁而幕南無王庭漢度河自朔方以西至令居往往通渠置田官吏卒五六萬人元鼎六年天子巡邊親至朔方勒兵十八萬騎以見武節紀元封元年冬十月登單于臺至朔方臨北河胸奴數使竒兵侵犯漢邊漢乃拜郭昌為拔胡將軍及浞野侯屯朔方以備東胡元封四年甘露三年遣長樂衛尉董忠將騎發邊郡士馬送單于出朔方雞鹿塞注師古曰在朔方窳渾縣西北銘地理志窳渾有道西北出雞鹿塞燕然陵髙闕下雞鹿度後紀水元六年六月車騎將軍竇憲出雞鹿塞遼將軍鄧鴻出稒陽塞注稒陽縣屬九原贊曰孝武雖開河南之野建朔方之郡亦棄造陽之北九百餘里後南胸奴傳元初五年春逢侯詣朔方塞降高紀二年十一月繕治河上塞六月興關中卒乘邊塞朝錯傳秦北攻胡築河上塞漢塞外受降城武紀太初元年夏六月遣因杅將軍公孫敖築塞外受降城因杅胸奴地名胸奴傳是嵗漢遣二師將軍西伐大宛而令因杅將軍築受降城其冬胸奴大雨雪畜多飢寒死時烏維單于死子詹師廬立年少好殺伐國中不安左大都尉欲殺單于使人告漢曰欲殺單于降漢漢即舉兵迎我我乃發漢聞此言乃築受降城猶以為逺其明年春漢遣浞野侯趙破奴將二萬騎出朔方北二千餘里期至浚稽山在武威北而還浞野侯既至左大都尉欲發而覺單于誅之浞野侯未至受降城四百里胸奴圍之軍遂沒于胸奴昭帝始元間胸奴遣九千騎屯受降城以備漢宣帝甘露三年呼韓邪單于入朝願留居光祿塞下有急保漢受降城李陵傳天漢二年詔陵至東浚稽山南龍勒水上觀虜即亡所見從浞野侯故道抵受降城休士注受降城本公孫敖所築唐溫彥博曰漢武帝置降胸奴城於五原塞下全其部落得為扞蔽又不離其本俗因而撫之一則實空虛之地二則示無猜忌漢五原塞外列城五原塞光祿城塞石門障居延城繕治障塞武紀元封元年冬十月帝歷五原出長城登單于臺太初三年夏四月遣光祿勳徐自為築五原塞外列城西北至盧朐山名遊擊將軍韓説將兵屯之強弩都尉路博德築居延秋胸奴入定襄雲中行壞光祿諸亭障注晉灼曰地理志從五原稒陽縣北石門障即得所築城師古曰漢制每塞要處别築為城置人鎮守謂之候城此即障也胸奴傳兒單于立三嵗而死子少胸奴乃立其季父烏維單于弟右賢王句黎湖為單于句音鉤是嵗太初三年也句黎湖單于立漢使光祿徐自為出五原塞數百里逺者千里築城障列亭至盧朐山名而使遊擊將軍韓説長平侯衛伉屯其旁使強弩都尉路博德築居延澤上韓説傳太初中屯五原外列城通典注榆林縣西有漢五原城征和三年漢軍乘勝追北至范夫人城應劭曰本漢將所築昭帝時胸奴入五原攻塞外亭障時漢邊郡候望精明宣帝甘露二年呼韓邪欵五原塞史記正義五原塞即五原郡榆林塞也在勝州榆林縣四十里晉太康地志自北地郡北行九百里得五原塞三年正月入朝二月遣歸單于自請願留居光祿塞下紀云居幕南保光祿城注孟康曰光祿徐自為所築孝宣孝元約束自長城以南天子有之長城以北單于有之有犯塞輒以狀聞降者不得受地理志五原郡秦九原郡元朔二年更名稒陽縣北出石門鄣得光䘵城又西北得支就城又西北得頭曼城又西北得呼河城又西得宿虜城張掖郡居延縣澤在東北古文以為流沙師古曰闞駰云武帝使伏波將軍路博德築遮虜障於居延城兵李陵傳天漢二年詔陵以九月發出遮虜障陵將步五千出居延北千餘里地通典肅州酒泉漢福祿縣古長城漢遮虜障也武威郡都尉治熊水障北部都尉治休屠城馬成傳建武十四年屯常山中山以備北邊又代驃騎大將軍杜茂繕治障塞自西河至渭橋河上至安邑太原至井陘中山至鄴皆築保壁起烽燧十里一候西羌傳建初二年臨洮索西迷吾等降馬防乃築索西城注故城在今洮州徙隴西南部都尉戍之悉復諸亭候元和三年迷吾退居河北歸義城南胸奴傳建武二十四年春欵五原塞願永為蕃蔽扞禦北虜永平八年置度遼營屯五原曼柏章和二年單于上言將餘兵萬人屯五原朔方塞以為拒守建武築北邊亭候保壁耿夔出居延塞圍北單于太初三年漢創築三城光祿居延令居光祿塞太初三年築其秋入冦輒遂壞棄為其要害故也度元鼎六年數萬人河築令居漢候城邊城武紀太初三年秋光祿諸亭障注師古曰漢制每塞要處别築為城置人鎮守謂之候城此即障也董仲舒曰使邊城守境之民父兄緩帶稚子咽哺孝宣時邊城晏閉牛馬布野漢遼東城烏壘城玉門亭障見西域都護昭紀元鳳六年正月募郡國徒築遼東元菟城黃龍戌元菟城五行志元鳳五年四月燭星見奎婁間占曰有土功邊城和六年正月築城漢延壽城昆侖塞地理志河南郡緱氏有延夀城仙人祠遼西郡令支有孤竹城應劭曰故伯夷國後西域傳延光二年敦煌太守張璫陳三䇿今以酒泉屬國吏士二千餘人集昆侖塞注前書敦煌郡廣至縣有昆侖障宜禾都尉居也漢北邊塞外城胸奴傳地節二年虛閭權渠單于立是時胸奴不能為邊冦於是漢罷外城以休百姓師古曰外城塞外諸城也單于聞之喜召貴人謀欲與漢和親元帝竟寧元年單于復入朝帝以後宮良家子王嬙字昭君賜單于單于歡喜上書願保塞上谷以西至敦煌傳之無窮請罷諸備邊吏卒以休天子人民天子下有司議郎中侯應習邊事以為不可許上問狀應曰臣聞北邊塞至遼東外有隂山東西千餘里草木茂盛多禽獸本冒頓依阻其中治作弓矢來出為冦是其苑囿也至孝武世出師征伐斥奪此地攘之於幕北建塞徼起亭隧築外城設屯戍以守之然後邊境得用少安幕北地平少草木多大沙胸奴來冦少所蔽隱從塞以南徑深山谷往來差難邊長老言胸奴失隂山之後過之未嘗不哭也前已罷外城省亭隧今裁足以候望通烽火而已起塞以來百有餘年非皆以土垣也或因山巗石木柴僵落溪谷水門稍稍平之卒徒築治功費久逺不可勝計臣恐議者不深慮其終始十年之外障塞破壞亭隧滅絶當更發屯繕治纍世之功不可卒復對奏有詔勿議罷邊塞事趙充國傳竊見北邊自敦煌至遼東萬一千五百餘里乘塞列隧有吏卒數千人虜數大衆攻之而不能害韓安國傳單于穿塞將十萬騎入武州塞注師古曰在鴈門汲黯傳胸奴攻當路塞絶和親西南夷傳漢興關蜀故徼注西南之徼猶北方塞後西羌傳武帝渡河湟築令居塞注令居縣屬金城郡章帝章和元年羌入金城塞後西域傳延光二年張璫上書今以酒泉屬國吏士二千餘人集昆侖塞前志宜禾都尉治昆侖障南胸奴傳永建元年先是朔方以西障塞多不修復單于上言求復障塞從之漢雒陽城見門類藝文類聚李尤京師城銘曰天險匪登地險丘陵帝王設險乾坤是承貨殖傳雒陽街居在齊秦楚趙之中元和志故洛陽城在縣東二千里按華延雋洛陽記云洛陽城東西七里南北九里洛陽城內宮殿臺觀府藏寺舍凡有一萬一千二百十九間顔師古曰魚豢云漢火忌水故洛去水而加佳魏於行次為土土水之牡也故變雒為洛如魚氏説則光武以後改為雒字漢伊吾盧城屬國城明紀永平十六年二月竇固破呼衍王於天山留兵屯伊吾盧城注本胸奴中地名破呼衍取其地置宜禾都尉屯田今伊州納職縣伊吾故城是也安紀永初四年正月度遼將軍梁慬遼東太守耿夔破南單于于屬國故城馬援傳建武十一年夏拜隴西太守時朝臣以金城破羌之西破羌縣名屬金城故城在今鄯州湟水縣西塗逺多寇議欲棄之援言破羌以西城多堅牢不可棄詔武威守梁統悉還金城客民歸者三千餘口使各反舊邑援奏為置長吏繕城郭起塢堠開導水田勸以耕牧十九年平嶠南援所過輒為郡縣治城穿渠光武紀建武十五年二月徙鴈門代上谷民於常山居庸關二十六年南單于遣子入侍於是雲中五原朔方北地定襄鴈門上谷代八郡民歸本土遣謁者分將弛刑徒補理城郭趙喜傳建武二十七年拜太尉南單于稱臣令喜典邊事喜上復緣邊諸郡幽并二州由是定注建武六年徙雲中五原民于常山居庸關二十六年復令還虞詡傳為武都太守占相地勢築營壘百八十所鮮卑傳元初二年秋遼東鮮卑圍無慮縣州郡合兵固保清野鮮卑無所得清野謂收斂積聚不令冦得之熹平六年秋蔡雍議曰天設山河秦築長城漢起塞垣所以别內外異殊俗也守邊之衛李牧善其略保塞之論嚴尤申其要漢典農城章陵城水經河水又徑典農城東注世謂之胡城又北徑上河城東世謂之漢城薛瓚曰上河在西河富平縣即此也馮參為上河典農都尉所治也河水又北徑典農城東注俗名之為呂城皆參所屯以事農郡國志南陽郡章陵故舂陵世祖更名注古今注曰建武十八年使中郎將耿遵築城漢河南城書召誥太保乃以庶殷攻位于洛汭注以衆殷之民治都邑之位於洛水北今河南城也疏漢地理志河南郡治在洛陽縣河南城别為河南縣治都邑之位於洛北今於漢河南城是也漢襄平城諸葛亮城牧師城唐志賈耽考方域道里之數一曰營州入安東道經汝羅守捉渡遼水至安東都護府五百里府故漢襄平城也六曰安南通天竺道自羊苴咩城西至永昌故郡三百里又西渡恕江至諸葛亮城二百里後漢南胸奴傳永元六年南單于及中郎將杜崇屯牧師城通典河南府澠池有古東西俱利二城即秦昭王與趙惠文王會處蓋云秦趙俱利也蜀漢漢樂城蜀志建興四年春都護李嚴自永安還住江州築大城今已郡故城是七年冬築漢樂二城揚雄作城都城四堣銘魏三城新城魏志明帝青龍二年五月孫權居巢湖口向合肥新城六月滿寵欲拔新城帝不聽曰先帝東置合肥南守襄陽西固祁山賊來輒破三城之下者地有所必爭也縱權攻新城必不能拔敕諸將堅守七月壬寅帝東征吳志黃龍二年正月魏作合肥新城注晉紀曰魏文帝在廣陵吳人大駭乃臨江為疑城自石頭至于江乘通典明帝時滿寵上表合肥縣西北三十里立城名新城魏陳倉城元和郡縣志陳倉上下二城相連上城秦文公築下城魏太和築中將軍郝昭築城訖諸葛亮來攻雲梯衝車晝夜攻拒二十餘日亮無利引去城在鳳翔寶雞縣本秦陳倉魏石鱉城通典楚州安宜魏鄧艾築石鱉城在縣西八十里以營田晉穆帝時荀羡云淮隂沃野有開殖之利方舟運漕無地屯兵乃營立城池有平陽石鱉田稻豐饒魏鴈門城牽招傳為鴈門太守通河西鮮卑附頭等十餘萬家繕治陘北故上館城置屯戍以鎮內外吳濡須塢吳志建安十六年從治秣陵明年城石頭改秣陵為建業聞曹公將來侵作濡須塢十八年正月曹公攻濡須相拒餘月乃退注作油船夜渡洲上以水軍圍取得三千餘人赤烏四年八月陸遜城邾吕蒙傳拒曹公於濡須數進竒計又勸夾水口立塢諸將皆曰上岸擊賊洗足入船何用塢為蒙曰兵有利鈍戰無百勝如有邂逅敵步騎蹙人不暇及水其得入船乎遂作之通典和州歷陽西南百八十里有濡須水孫權築塢吳建業城吳志孫權黃龍元年九月自武昌遷都建業晉改為建康左思吳都賦郛郭周匝重城結隅通水道陸衢孫權城名石頭改秣陵為建業輿地志曰都城二十里十九步權雖城石頭以鎮江險其都邑則在建業故城歷代所謂都城者六朝因之諸葛孔明云鍾山龍蟠石城虎踞則南朝都城襟抱左右槩可見矣晉宋以來面淮有朱雀航宋文帝作玄武湖蓋傅會龍蟠虎踞而為此名也曰臺城則宮省所屬也曰東府西州城則諸王若宰相居之曰倉城則儲蓄所在也以宮室記考之皆都城之內然舊城在北去秦淮五里元和郡縣志石頭城在升州上元縣西四里即楚之金陵城也吳改為石頭城建安十六年吳大帝修築以置財寶軍器有戍吳都賦云戎車盈於石城是也晉臺城在縣東北五里咸和六年使王彬營造七年遷新宮即此城也建康故城在縣南三里東府城在縣東七里輿地廣記孫權初鎮丹徒謂之京城後徙都秣陵改為建業晉元帝復都焉改丹陽太守為尹通鑑自晉以來建康宮之外城唯設竹籬而有六門齊建元二年五月命改立都牆世説敘録丹陽治城去宮三里王隱晉書江乘南岸有琅琊城立琅邪內史以治之廣書韓滉築石頭五城自京口至土山修塢壁起建業抵京峴樓雉相望却月城吳夏口城水經注沔左有却月城亦曰偃月壘戴監軍築船官浦東即黃鵠山東北對夏口城魏黃初二年孫權所築依山傍江開勢明逺憑墉籍阻髙觀枕流吳志黃武二年正月城江夏山晉荆州五城羊祜傳都督荆州吳石城守去襄陽七百餘里祜以詭計令吳罷守祜以孟獻營武牢而鄭人懼晏弱城東陽而萊子服乃進據險要開建五城收膏腴之地石城以西盡為晉有水經注沔水南徑石城西城因山為固晉羊祜鎮荆州立漢諸葛孔明曰荆州北據漢沔利盡南海東連吳會西通巴蜀此用武之國吳赤烏十一年春正月朱然城江陵晉臥龍城水經注晉書涼州城有龍形故名臥龍城南北七里東西三里本胸奴所築也晉上明城石城元和郡縣志江陵府松滋上明故城在縣西一里苻堅南侵桓沖為荆州刺史渡江南上明築城以禦之上明在縣東三十步明猶渠也相承云昔晉末朱齡石開上明引江水以灌稻田桓沖傳欲移阻江南上疏曰自中興以來荆州所鎮隨宜回轉臣兄溫經略中原因江陵路便即而鎮之今宜全重江南輕戍江北南平孱陵縣界地名上明在吳時樂鄉城以上四十餘里北枕大江西接三峽於是移鎮上明使劉波守江陵楊亮守江夏蔡謨傳征西將軍庾亮欲移鎮石城謨議曰沔水之險不及大江自沔已西水急岸髙魚貫泝流首尾百里若賊及我未陳而擊之將如之何亮不果移鎮陳光請伐胡詔令攻壽陽謨上疏曰今壽陽城小而固自壽陽至琅邪城壁相望其間逺者裁百餘里一城見攻衆城必救謨所統七千餘人所戍東至土山西至江乘鎮守八所城壘凡十一處烽火樓望三十餘處隨宜防備甚有籌略庾亮傳襄陽北接宛許南阻漢水其險足固其土足食臣宜移鎮襄陽之石城下并遣諸軍羅布江沔謝安傳出鎮廣陵之步兵築壘曰新城晉石頭城丹陽記石頭城吳時悉土塢義熙始加磚纍石頭因山以為城因江以為池形險固有竒勢故諸葛亮曰鍾山龍盤石城虎踞江寧縣北三十里有白馬城吳時為烽火之所江寧圖曰石頭城吳之金陵城建康圖元帝渡江歷六代都之輿地志金陵有東府城晉安帝時築其城西本簡文為會稽第其東則丞相會稽王府時人號為東府西州圖經曰金陵有古冶城本吳鑄冶之地吳紀陟曰自西陵以至江都五千七百里疆界雖逺而險要必爭之地不過數四猶人雖有八尺之軀靡不受患其護風寒亦數處耳後魏長城隋長城通鑑魏髙祖太和八年九月中書監髙閭上表以為西北之人别有長短所長者野戰所短者攻城若以彼之所短奪其所長則雖衆不能成患雖來不能深入其人散居野澤隨逐水草戰則與家業並至奔則携蓄牧俱逃不齎資糧而飲食自足是以歷代能為邊患六鎮勢分倍衆不鬬互相圍逼難以制之請依秦漢故事於六鎮之北築長城擇要害之地往往開門造小城於其側置兵捍守狄既不攻城野掠無獲草盡則走終必懲艾計六鎮東西不過千里一夫一月之功可城三步之地強弱相兼不過用十萬人一月可就雖有暫勞可以永逸凡長城有五利罷遊防之苦一也北部放牧無鈔掠之患二也登城觀敵以逸待勞三也息無時之備四也嵗常遊運永得不匱五也帝優詔答之一本云長安自城西至五原延袤二千餘里表通典云皇典中刁雍上帝從之世宗正始元年九月柔然侵魏之沃野及懷朔鎮詔車騎大將軍源懷出行北邊指授規略隨須徴發皆以便宜從事懷至雲中柔然遁去懷以為用夏制夷莫如城郭還至恆代案觀諸鎮左右要害之地可以築城置戍之處欲東西為九城及儲糧積仗之宜犬牙相救之勢作五十八條表上之曰今定鼎成周去北遙逺代表諸國頗或外叛仍遭旱飢戎馬甲兵十分闕八謂宜凖舊鎮東西相望令形勢相接築城置戍分兵要害勸農積粟警急之日隨便翦討彼遊騎之冦終不敢攻城亦不敢越城南出如此北方無憂矣魏主從之東魏孝靜帝武定元年八月丞相歡築長城於肆州北山西自馬陵戍東至土隥四十日罷齊顯祖自西河總秦戍築長城東至於海前後所築東西凡三千餘里率十里一戍隋文帝開皇元年召沂州刺史韋沖為兼散騎常侍時發稽胡築長城汾州胡千餘人在路亡叛帝召沖問計對曰夷狄之性易為反覆皆由牧宰不稱之所致臣請以理綏靖可不勞兵而定沖綏懷叛者月餘皆至并起長城之役隋文帝紀開皇元年四月發稽胡修築長城二旬而罷六年二月丁亥發丁男十五萬修築長城二旬而罷五年使司農少卿崔仲方發丁三萬於朔方靈武築長城東距河西止綏州綿歷六百里以遏胡冦六年二月復令仲方發丁十五萬於朔方以東緣邊險阻築數十城七年二月發丁十萬修築長城二句而罷十九年十月甲午以突厥利可汗為啓人可汗築大利城處其部落後周玉璧城輿地廣記綘州稷山縣後周置勳州有玉璧城後周王思政所築為重鎮齊神武再攻圍不克韋孝寬代思政鎮玉璧髙歡攻之智力皆困隋大興城新都文帝紀開皇二年六月丙申詔左僕射髙熲等創造新都於龍首山以宇文愷有巧思領營新都副監十二月丙子名新都曰大興城髙祖龍濳封號大興三年三月丙辰入新都四年四月丁未晏突厥髙麗吐谷渾使者於大興殿三年改萬年縣曰大興京北統縣二十二十八年十一月詔自京師至仁壽宮置行宮十有二所煬帝紀大業九年三月丁丑發丁男十萬城大興西京記大興城南直子午谷漢都城在長安鄉鄉在渭水南杜縣地隋唐都城在龍首原蓋漢城東南十三里也隋雍州城地理志開皇三年置雍州城東西十八里一百十五步南北十五里一百七十五步東面通化春明延興三門南面啓夏明德安化三門西面延平金光開逺三門北面光化一門里一百六市二玉海卷一百七十三
