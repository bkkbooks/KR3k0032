body:
  text: 玉海卷四十三宋王應麟撰藝文讎正五經石經荀悅申鑒仲尼作經本一而已古今文不同而皆自謂真本經古今先師義一而已異家别説不同皆自謂真古今秦之滅學也書藏於屋壁義絶於朝野漢興收托散滯固已無全學矣文有磨滅言有楚夏出有先後或學者先意有所借定後進相放彌以滋蔓故一原十流漢校中五經祕書成紀河平二年光祿大夫劉向校中祕書師古曰言中以别外劉向傳領校中五經祕書志注臣向與長社尉參校中祕書向校書天祿閣感青藜之異志向以中古文易校施孟梁丘經或脫去無咎悔亡唯費氏與古文同書以中古文校三家經文酒誥脫簡一召誥脫簡二文字異七百餘脫字數十向校書得樂記二十三篇與王禹不同向云古孝經庶人章分為二曽子敢問章為三又多一章儒林傳劉向校書考易説以為諸家皆祖田何楊丁大誼略同唯京氏為異張霸以能為百兩徵以中書校之非是乃黜其書論語序向言魯二十篇齊二十二篇古二十一篇篇次不與齊魯論同劉歆河平中受詔與父向領校祕書向死哀帝初復領五經卒父前業乃集六藝羣書種别為七略隋志向卒子歆乃徙溫室中書於天祿閣上遂總括羣篇撮其指要著為七略尹咸與歆共校經傳歆曰古文逸禮書春秋左氏皆古文舊書多者二十餘通臧祕府成帝陳發祕藏校理舊文得此三事考學官所傳經或脫簡傳或間編又移書揚雄曰三代之書藴藏於家直不計耳敘傳班斿與劉向校祕書受詔進讀羣書賜以祕書之副後漢蘇竟與劉龔歆兄子書昔以摩研編削之才與國師公歆校定祕書張衡曰劉向父子領校祕書閲定九流亦無讖録北史向受詔校書每一書竟表上輒言臣向書長水校尉臣參書太常博士書中外書合若干本以相比校然後殺青隋志漢初河間獻王又得仲尼弟子及後學者所記一百三十一篇獻之時亦無傳之者至劉向考校經籍檢得一百三十篇因第而敘之左氏云云劉歆典校經籍考而正之欲立於學孝經至劉向典校經籍以顏本比古文除其繁惑以十八章為定戰國策書録云中書餘卷錯亂相糅云云本字多誤脫為半字以趙為肖以齊為立皆定以殺青書可繕寫荀卿書所校讎中書凡三百三十二篇定著三十二篇以殺青書列子所校中書五篇謹與長社尉臣參校讎太常書三篇太史書四篇臣向書六篇臣參書二篇內外書凡二十篇定著八篇或字誤以盡為進以賢為形及在新書有棧校讎從中書已定以殺青書永始二年八月壬寅上管子新書目録云臣參書四十一篇儀禮疏劉向别録大射以上七篇與小戴同其下乃以聘食覲禮至有司為次皆尊卑吉凶次第倫敘後吳祐傳父恢欲殺青簡寫經書注亦謂汗簡義見劉向别録風俗通劉向典校書籍皆先書竹為易刋定可繕寫者以上素也今東觀書竹素見文選注唐司馬貞曰按劉向七略有子夏易傳説文祕書説日月為易揚雄傳校書天祿閣孔叢子孔子元以郎校書校祕書郎楊閎漢曲臺校書儒林傳后倉説禮數萬言號曰后氏曲臺記注服虔曰在曲臺校書著記因以為名師古曰曲臺殿在未央宫漢校定中書五經正五經文字列傳伏無忌順帝時為侍中屯騎校尉永和元年詔無忌與議郎黃景校定中書五經諸子百家藝術元嘉中成中書內中之書盧植熹平間時始立太學石經以正五經文字植上書云云見禮類拜議郎與諫議大夫馬日磾議郎蔡雍楊彪韓説等並在東觀校中書五經記傳補續漢記言中書以别於外也帝以非急務轉為侍中劉珍文苑永初中安帝紀永初四年二月乙亥為謁者僕射鄧太后詔使與校書劉騊駼馬融及五經博士校定東觀五經諸子傳記百家藝術整齊脫誤是正文字蔡倫宦者元初四年帝以經傳之文多不正定乃選通儒謁者劉珍及博士良史詣東觀各讎校漢家法令倫監典其事崔實與諸儒博士雜定五經樊鯈永平元年為長水校尉以讖記正五經異説班固永平中為郎典校祕書馬融詣東觀典校祕書張馴儒林拜議郎與蔡雍共奏定六經文字擢侍中典領祕書傅毅文苑建初中拜郎中與班固賈逵共典校書漢石經蔡雍傳建寧中校書東觀遷議郎雍以經籍去聖久逺文字多謬俗儒穿鑿疑誤後學熹平四年與五官中郎將堂溪典光祿大夫楊賜諫議大夫馬日磾議郎張子俊馴韓説太史令單揚等奏求正定六經文字許之雍乃自書丹於碑使工鐫刻石立於太學門外後儒晚學咸取正焉碑始立觀視摹寫者車乘日千餘兩填塞街陌注洛陽記曰太學在洛陽南開陽門外講堂長十丈廣三丈堂前石經四部本碑凡四十六枚西行尚書周易公羊傳十六碑存十二碑毁南行禮記十五碑悉壞東行論語三碑二碑毁禮記碑上有諫議大夫馬日磾議郎蔡雍名儒林傳敘熹平四年詔諸儒正定五經刋於石碑為古文篆隸三體書法以相參檢植之學門使天下取則注謝承書碑立太學門外瓦屋覆之四面欄障開門於南河南郡設吏卒視之洛陽記云碑髙一丈許廣四尺駢羅相接靈紀熹平四年春三月詔諸儒正五經文字刻石立于太學門外盧植傳上書願合尚書章句考禮記失得刋正碑文宦者傳李巡以為諸博士試甲乙科爭第髙下更相告言至有行賂定蘭臺漆書經字以合私文者乃白帝與諸儒共刻五經文於石詔蔡雍正其文字五經一定爭者用息隋志鐫刻七經著於石碑皆蔡雍所書三字石經尚書九卷梁有十三卷又五卷春秋三卷梁有十二卷唐志小學類三字石經尚書古篆三卷左傳古篆書十二卷又蔡雍今字石經論語二卷金石録石經遺字為三卷云蔡雍所書乃八分而三體石經乃魏時所建也遺字有尚書公羊傳論語又有詩儀禮則所立不止六經矣論語公羊後有堂溪典馬日磾等姓名世所傳經書校此不同者數百言篇第亦時有小異水經注漢光和六年刻石鏤碑載五經立於太學講堂前悉在東側北史江式曰蔡雍採李斯曹喜之法為古今雜形詔於太學立石碑刋載五經題書楷法多是雍書後開鴻都諸方獻篆無出雍者魏陳留邯鄲淳特善倉雅許氏字指八體六書精究間理以書教諸皇子又建三字石經於漢碑西其文蔚煥三體復宣校之説文篆隸大同而古字少異左傳正義石經古文虞作魯作􅨞魏石經晉石經隋志魏正始中立一字石經相承以為七經正字後東魏末武定四年八月自洛陽徙于鄴都至河陽沒于水得至鄴者不盈大半髙澄遷洛陽漢魏石經五十二碑于鄴齊皇建元年八月列學館後周大象元年徙洛陽隋開皇六年又自鄴京載入長安置于祕書內省議欲補緝立于國學隋亂事寢營造之司用為柱礎貞觀初袐書監魏徴始收聚之十不存一其相承傳拓之本猶在祕府合五十一卷有一字三字之分并秦帝會稽刻石一卷以備小學一字石經周易一卷梁有三卷尚書六卷梁有今字石經鄭氏尚書八卷魯詩六卷梁有毛詩三卷儀禮九卷春秋一卷公羊傳九卷論語一卷梁有二卷典論一卷魏志注明帝詔先帝典論刋石于廟堂之外及太學與石經並以永示來世讐魏都賦菲言厚行陶化染學校篆籕篇章畢覿晉傳衛恆曰正始中立三字石經江式云魏建三字石經于漢碑西邯鄲淳所書裴頠轉祭酒奏修國學刻石寫經唐六典注傅暢晉諸公讚裴頠為國子祭酒奏立國子太學起講堂築門闕刻石寫五經荀嵩上疏曰太學有石經古文後魏書孝文太和十七年九月壬申幸太學觀石經神龜元年五月祭酒崔光請命博士李郁等補漢所立三字石經之殘缺劉芳傳漢世造三字石經於太學學者文字不正多往質焉芳音義明辨時號劉石經隋劉焯傳運洛陽石經至京師文字磨滅莫能知者敕與劉炫等㘼定唐志小學類今字石經易篆三卷書五卷鄭玄書八卷毛詩三卷儀禮四卷左傳經十卷公羊傳九卷蔡雍今字論語三卷三字石經尚書古篆三卷左傳古篆十二卷合五十九卷開元著録隋祕書省考定羣言傳劉焯與諸儒於祕書省考定羣言蕭該開皇初奉詔與何妥正定經史韋孝寬後周明帝初參麟趾殿學士考校圖籍北齊郎茂於祕書省刋定載籍唐祕書省考定五經儒學傳序太宗讐正五經謬缺頒天下示學者顏師古傳太宗拜中書侍郎帝嘗歎五經去聖逺傳習寖訛詔師古於袐書省考定多所釐正政要貞觀四年既成悉詔諸儒議政要云詔左僕射房玄齡集諸儒詳議人執所習共非詰師古輒引晉宋舊文隨方曉答誼據該明出其悟表人人歎服帝因朌所定書於天下舊紀貞觀七年十一月丁丑頒新定五經學者賴之拜祕書少監專刋正事古篇竒字世所惑者討析申熟必暢本源會要貞元二年七月祕書監劉太真請擇儒者詳校九經於祕書省從之尋寢不行紀景龍二年六月庚子詔括天下圖籍唐刋正四部羣書會要乾封元年十月十四日上以四部羣書傳寫訛謬乃詔東臺侍郎趙仁本蘭臺侍郎李懷儼東臺舍人張文瓘等集儒學之士刋正然後繕寫開元七年五月整比四部書開成元年七月分察使奏祕書省四庫見在新舊書籍共五萬六千四百七十六卷隨日校勘九月敇欠書四萬五千二百六十一卷令諸道繕寫大中三年正月校寫四百十九卷四年寫三百六十五卷五年正月校勘四百五十二卷唐集賢殿校理經籍見院類唐壁經會要元和十四年十二月祭酒鄭餘慶奏修壁經文粹劉禹錫國學新修五經壁記云初大厯中名儒張參為司業始詳定五經書于論堂東西廂之壁辨齊魯之音考古今之文積六十載汙剝不鮮今天子尚文章尊典籍成均以治學上言遽賜千萬祭酒皥齊博士公肅韋再新壁書懲前土塗不克以壽乃析堅木負墉而比之製如版牘平如粉澤申命國子能通書法者繕寫筆削既成讎校既精白黑彬班瞭然飛動以蒙來求煥若星辰以敬來趨肅如神明以疑來質決若蓍蔡文苑英華太學壁經賦置六經於屋壁作羣儒之龜鏡垂露懸針鶴頭蚊足酌前修之規楷為後來之軌躅唐石經後唐九經刻板鄭覃傳文宗以覃名儒以宰相領祭酒請太學五經置博士開成元年始覃又以經籍刓繆博士陋淺不能正建言願與巨學鴻生共力讐刋凖漢舊事鏤石太學示萬世法詔可覃乃表周墀崔球張次宗孔溫業等是正其文刻于石髙重傳為祭酒與鄭覃刋定九經于石儒學傳序文宗定五經鑱之石張參等是正訛文參乃大厯中司業序誤會要太和七年二月五日敇唐玄度覆定石經字體十二月敕於國子監講論堂兩廊創立石九經并孝經論語爾雅共一百五十九卷字樣四十卷又見後九經字樣通監開成二年冬十月國子監石經成舊紀開成二年十月癸卯宰臣判祭酒鄭覃進石壁九經一百六十卷唐玄度覆校字體乖師法名儒皆不窺之文粹李陽氷論古篆願刻石作篆備書六經立於明堂為不刋之典號曰大唐石經使百代之後無所損益後唐長興三年二月令國子監校正九經以西京石經本抄寫刻板頒天下四月命馬鎬陳觀田敏詳勘周廣順三年六月丁巳十一經及爾雅五經文字九經字樣板成判監田敏上之各二部一百三十册四門博士李鶚書惟公羊前三禮郭溪書顯德二年二月校勘經典釋文三十卷雕印命張昭田敏詳校偽蜀相母昭裔取唐大和本琢石於成都學官與後唐板本不無小異乾道中朝公武參校二本取經文不同者三百二科著石經考異亦刻於石張􅡃又校注文同異為石經注文考異四十卷唐九經字樣五經文字見上十又見石經體書會要開成二年丁巳嵗八月國子監奏覆定五經字體官翰林待詔唐玄度狀凖大和七年二月五日敇覆定九經字體今所詳覆多因司業張參五經字為凖其舊字樣嵗月將久點畫參差傳寫相承漸致訛誤今依字