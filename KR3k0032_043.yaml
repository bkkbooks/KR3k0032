年乃上漢書刋誤三十卷至是改舊摹板嘉祐六年八月校梁陳等書鏤板七年冬始集八年七月陳書始校定熙寧二年八月六日庚子進新校漢書崇文目三史刋誤四十五卷咸平元年七月甲申賜諸王及輔臣新印三史嘉祐六年八月庚申詔三館祕閣校理宋齊梁陳後魏周北齊七史書有不全者訪求之咸平校定七經疏義咸平三年三月癸巳命國子祭酒邢昺等校定周禮儀禮公羊穀梁傳正義又重定孝經論語爾雅正義四年九月丁亥一作丁丑翰林侍講學士邢昺等及直講崔偓佺表上重校定周禮儀禮公穀傳孝經論語爾雅七經疏義凡一百六十五卷賜宴國子監昺加一階餘遷秩一本云一百六十三卷十月九日命摹印頒行於是九經疏義具矣詳見論語類咸平校三館書籍五年十二月甲申令流內銓於常選擇知書者以名聞初詔寫三館書籍一本置龍圖閣一本藏後苑皆以館閣官分校上閲之見其尚有舛誤而未讎對者猶二萬卷故擇官詳校命吏部侍郎陳恕知制誥楊億試十五人得館陶尉劉均等七人於崇文院校勘詳見書目先是咸平二年閏三月甲午令三館寫四部書一本來上景德羣書漆板刋正四經咸平元年正月丁丑劉可名上言諸經板本多誤上令擇官詳校景德二年五月一日戊申朔幸國子監歷覽書庫觀羣書漆板問祭酒邢昺曰板數幾何昺曰國初印板止及四千今僅至十萬經史義疏悉備帝曰非四方無事何以臻此因益書庫十步以廣所藏又詔褒之九月辛亥命侍講學士邢昺與兩制詳定尚書論語孝經爾雅文字先是國子監言羣經摹印嵗深字體誤缺請重刻板因命崇文檢詳杜鎬諸王侍講孫奭詳校至是畢又詔昺與兩制詳定而刋正之祥符七年九月又并易詩重刻板本仍命陳彭年馮元校定自後九經及釋文有訛缺者皆重校刻板天禧元年九月癸亥詔國子監羣書更不增價五年五月辛丑令國子監重刻經書印板以嵗久刓損也天聖八年九月十二日重刋詩書釋文嘉祐七年十二月詔以七史板本四百六十四卷送國子監鏤板頒行唯開寶所修五代史未布以俟筆削紹興九年九月七日詔下諸郡索國子監元頒善本校對鏤板十五年閏十一月博士王之望請羣經義疏未有板者令臨安府雕造二十一年五月詔令國子監訪尋五經三館舊監本刻板上曰其他闕書亦令次第鏤板雖重有所費亦不惜也繇是經籍復全五代始用木板摹六經蜀母昭裔亦請刻板印九經蜀主從之太宗朝又摹印司馬班范諸史與六經皆傳於是世之寫本悉不用然墨板訛駁初不是正而學者無他本刋驗司馬范諸史尤多脫亂其後不復有古本可證國史志唐末益州始有墨板多術數字學小書後唐詔儒臣田敏校九經鏤本于國子監國初廣諸義疏音釋令孔維邢昺讎定頒布後又作三體石經訂正文字於是經書大備景德校諸子咸平六年四月命杜鎬等校道德經六月畢景德二年二月甲辰校定莊子并以釋文三卷鏤板後又命李宗諤等讎校莊子序祥符四年三月校列子五年四月上新印列子十月校孟子孫奭等言孟子有張鎰丁公著二家撰録今采衆家之長為音義二卷是年四月以進七年正月上新印孟子及音義唐志張鎰孟子音義三卷景德校新寫御書見書目祥符校館閣羣書八年十二月甲辰命樞密使王欽若提點抄寫三館祕閣書籍翰林學士陳彭年副之初館閣以其夏四月壬申火多闕書故命抄寫十月丙午命吏部取選人先試判擇可者送學士院試詩賦論命入館校勘三年改官京官校勘三年授校理後校勘四年授校理自朝宗慤始彭年請以直館校理等為校勘官又命學士朝逈等選宋綬等覆校凡校勘官校畢送覆校覆校畢送主判館閣官詳校復命兩制充覆點檢皆有程課以考勤怠景祐見書目實録八年十月丙午以丁珙為館閣校勘令流內銓選有文學者赴館閣校勘羣書康定羣經音辨書目七卷國史志同或云十卷天章閣侍講賈昌朝撰進凡五門一辨字同音異二辨字音清濁三辨彼此異音四辨字音疑混五辨字訓得失康定二年詔刋行朝氏志賈昌朝羣經音辨七卷先是大臣稽古不過秦漢引經議政蓋自昌朝始此書以古今多通借音詁乃辨正之凡五門寶元二年十一月三日令崇文苑雕印頒行唐顔師古撰匡繆正俗八卷至和石經元年八月十六日己酉命皇姪右屯衛大將軍克繼書國子監石經以上所寫石經論語求書石國子監帝欲旌勸宗室特從其請二年九月十五日功畢上之賜銀幣嘉祐石經仁宗命國子監取易詩書周禮禮記春秋孝經為篆隸二體刻石兩楹至和二年三月五日判國子監王洙言國子監刋立石經至今一十五年止孝經刋畢尚書論語見書鐫未就乞促近限畢工餘經權罷從之嘉祐三年五月十五日王洙薦大理丞楊南仲石經有勞賜出身六年二月一日乙卯朔國子監言草澤章友直篆石經畢詔補試將作監主簿友直不願仕賜以銀絹六月庚申五月以同篆石經殿中丞張次立與堂除熙寧是正文字二年八月庚子參政趙抃進新校漢書及陳繹所著是正文字七卷賜繹銀帛元豐五年王安石表上字説二十四卷紹聖二年十一月八日龔原請雕印政和七年二月十一日唐耜上字説集解三十部一百二十卷大觀中張有校正俗書與古字戾者集三千餘字名之曰復古編二卷楊時為後序形聲近似而用或不同辨析皆有稽據汪藻古今雅俗字四十四篇紹興御書石經淳熙石經閣十三年二月內出御書左氏春秋及史記列傳宣示館職少監秦熺以下作詩以進六月內出御書周易九月四日上諭輔臣曰學寫字不如便寫經書不惟可以學字又得經書不忘既而尚書委知臨安府張澄刋石頒諸州學十四年正月出御書尚書十月出御書毛詩十六年五月又出御書春秋左傳皆就本省宣示館職作詩以進上又書論語孟子皆刋石立于太學首善閣及大成殿後三禮堂之廊廡繫年録十三年十一月丁卯秦檜奏前日蒙付出御書尚書來日欲宣示從臣時上寫六經論孟皆畢因請刋石國學仍朌墨本賜諸路州學詔可淳熙四年二月十九日詔知臨安府趙磻老於太學建閣奉安石經置碑石于閣下墨本于閣上以光堯石經之閣為名朕當親寫參政茂良等言自昔帝王未有親書經傳至數千萬言者不惟宸章奎畫照耀萬世崇儒重道至矣上曰太上字畫天縱冠絶古今五月二十四日磻老奏閣將就緒其石經易詩書春秋左氏傳論語孟子外尚有御書禮記中庸大學學記儒行經解五篇不在太學石經之數今摉訪舊本重行摹勒以補禮經之闕從之六月十三日御書光堯御書石經之閣牌賜國子監百官表請觀視從之若稽古高宗皇帝實天生德既以聰明聖武戡濟多難垂中興億年之基洎保大定功投戈息馬於世紛萬殊泊乎無一嗜玩唯翰墨梱域天縱神與不舍食息書凡幾帙帙凡幾字一一肆筆而成翥鳳翔鸞震蕩輝赫端正嚴重肅如神明洪邁御書閣記紹興校御府書籍二年四月乙亥初命館職校御府書籍先是祕書少監王昴言本省御府書籍四百九十二種今又有曾旻家藏書二千六百七十八卷欲分定四庫分官日校二十一板從之會要四月十四日百兩之篇七分之術夏五闕文玉藻脫簡玉海卷四十三
