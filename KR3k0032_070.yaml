body:
  text: 玉海卷七十宋王應麟撰禮儀朝儀太微中居列宿環拱聖王正表著之位辨廉陛之等法乎天也堯外朝列子仲尼篇堯治天下五十年不知天下治歟不治歟問外朝外朝不知舜朝會方嶽舜典輯五瑞既月乃日覲四嶽羣牧班瑞于羣后歲二月東巡狩肆覲東后五載一巡狩羣后四朝注各會朝于方嶽之下疏凡四處别朝王制注虞夏之制諸侯歲朝疏案尚書鄭注云巡守之年諸侯朝於方嶽之下其間四年四方諸侯分來朝於京師歲遍鄭志夏殷六年一巡守諸侯嵗朝唯指唐虞異義云公羊説諸侯比年一小聘三年一大聘五年一朝天子左氏説十二年之間八聘四朝再會一盟許慎案公羊説虞夏制左氏説周制鄭駁之云三年聘五年朝文襄之霸制文十五年左傳云諸侯五年再相朝以修王命古之制也此為夏殷之禮通典唐虞夏氏之時四方諸侯嵗一朝殷制五年一朝左傳哀七年子服景伯曰禹合諸侯於塗山執玉帛者萬國注在壽春東北周穆有塗山之會注會諸侯唐志塗山在濠州鍾離栁宗元有銘更越傳曰禹到越望苗山會諸侯爵有德封有功名會稽山周三朝四朝朝儀朝位治朝外朝燕朝內朝羣臣班射朝天官大宰王視治朝則贊聽治注治朝在路門外羣臣治事之朝王視則助王平斷疏王有三朝外朝是斷疑獄之朝路寢庭朝圖宗人嘉事二者事簡非正朝故知治朝是路門外司士所掌者也內宰疏王立朝者即三朝宰夫掌治朝之法以正王及三公六卿大夫羣吏之位掌其禁令注治朝在路門之外其位司士掌焉宰夫察其不如儀疏治朝在路門外者燕朝在路寢庭外朝在庫門外其事希簡治朝是常治事之朝地官師氏居虎門之左司王朝注路寢門也王日視朝於路寢門外疏其路寢庭朝及庫門外之朝非常朝之處司士所掌路門外是常朝日所朝之所稿人掌共外內朝冗食者之食注外朝司冦斷獄弊訟之朝也今司徒府中有百官朝會之殿云天子與丞相舊決大事焉是外朝之存者與內朝路門外之朝也疏天子三朝路寢庭朝是圖宗人嘉事之朝太僕掌之又有路門外朝是常朝之處司士掌之又有外朝在臯門內庫門外三槐九棘之朝是斷獄弊訟之朝朝士掌之今言外內朝明據三槐與路門外二者以其路寢庭非常朝之處也今司徒府已下引漢法説之春官司服視朝則皮辨服注視內外朝之事王受諸侯朝覲於廟則衮冕巾車象路注以日視朝疏謂於路門外常朝之處乘之至於三朝皆乘之夏官司士掌羣臣之版故書版為班以治其政令正朝儀之位辨其貴賤之等王南鄉三公北面東上孤東面北上卿大夫西面北上王族故士虎士在路門之右南靣東上大僕大右大僕從者在路門之左南靣西上注此王日視朝事於路門外之位疏對彼大僕職路寢庭有燕朝朝士職庫門外有外朝而言也但彼外朝斷獄弊訟并三詢之朝有諸侯在焉諸侯既在西方右九棘之下孤避之在東方羣臣之位西靣也其餘王公卿大夫等仍與此位同魏志王肅曰周官則備矣五日一朝公卿大夫並進而司士辨其位漢初依擬前代公卿皆親以事升朝司士擯孤卿特揖大夫以其等旅揖士旁三揖王還揖門左揖門右大僕前注前正王視朝之位王入內朝皆退注王入入路門也王入路門內朝朝者皆退反其官府治處也王之外朝則朝士掌焉玉藻曰朝服以日視朝於內朝云云謂諸侯疏欲見天子諸侯皆有三朝之意玉藻諸侯禮云朝于內朝者謂路門外朝為內朝對臯門內應門外朝為外朝通路寢庭朝為三朝大僕王視朝則前正位而退入亦如之注王既立退居路門左待朝畢建路鼓于大寢之門外注大寢路寢也其門外則內朝之中如今宫殿端門下矣疏文王世子以路門外為外朝者對路寢庭朝為外朝其實彼外朝亦內朝耳既以三槐九棘朝為外朝此二者皆內朝也王視燕朝則正位掌擯相注燕朝朝於路寢之庭王圗宗人之嘉事則燕朝疏以其路寢安燕之處謂之燕朝與賔客饗食在廟燕在寢也但與賔客及臣下燕時亦有朝因燕而朝賔臣燕禮已有成文圗宗人嘉事者朝不見故鄭特見之宗人冠昏嘉禮之等皆曰嘉事秋官大司冦注嘉石文石也植之外朝門左小司冦掌外朝之政以致萬民而詢焉一曰詢國危二詢國遷三詢立君注外朝朝在雉門之外者也其位王南鄉三公及州長百姓北面羣臣西面羣吏東面小司冦擯以敘進而問焉以衆輔志而弊謀疏小司冦與朝士同掌之外朝在雉門之外則亦在庫門之外也朝士掌建邦外朝之法左九棘孤卿大夫位焉羣士在其後右九棘公侯伯子男位焉羣吏在其後面三槐三公位焉州長衆庶在其後左嘉石平罷民焉右肺石達窮民焉注鄭司農云王有五門外朝在路門外內朝在路門內玄謂外朝在庫門之外皋門之內與今司徒府有天子以下大會殿亦古之外朝哉周天子諸侯皆有三朝外朝一內朝二內朝之在路門內者或謂之燕朝疏天子外朝一者即朝士所掌者是也內朝二者司士所掌正朝太僕所掌路寢朝是也諸侯內朝二者玉藻云朝于內朝朝羣臣辨色始入君日出而視朝退適路寢使人視大夫大夫退然後適小寢彼亦路門外內二者為內朝閔二年云間于兩社兩社在大門內中門外為外朝燕朝者大僕云掌燕朝之服位是也大行人上公之禮其朝位賓主之間九十步立當車軹擯者五人諸侯之禮朝位賓主之間七十步立當前疾擯者四人諸伯如諸侯之禮諸子朝位賓主之間五十步立當車衡擯者三人諸男如諸子之禮注朝位謂大門外賔下車及王車出迎所立處也王始立大門內交擯三辭乃乘車而迎之齊僕為之節上公立當軹侯伯立當疾子男立當衡王立當軫與凡大國之孤朝位當車前不交擯凡諸侯之卿其禮各下其君二等注朝位則上公七十步侯伯五十步子男三十步與疏聘禮在大門外去門有立位陳介之所朝在路門外掌訝至于朝詔其位疏外朝在大門外詩綿乃立臯門應門正義諸侯三朝臯門之內雖有外朝議大疑詢衆庶乃往不常在焉其君日出所視與羣臣決事之朝在應門之內曲禮天子當依而立諸侯北面而見天子曰覲疏是秋於廟受覲禮也天子當寧而立諸公東靣諸侯西靣曰朝疏此為春夏受朝時也爾雅門屏之間謂之寧謂天子受朝於路門外之朝於門外而寧立以待諸侯之至爾雅正門謂之應門諸侯內屏在路門之內天子外屏在路門之外而近應門注云朝者位於內朝而序進即路門外朝也對臯門內槐棘之外朝故稱內若對路寢庭朝又為外故文王世子云朝於外朝則以官是也凡天子三朝其一在路門內謂之燕朝大僕掌之云王㫝燕朝文王世子云公族朝於內朝親之也此王與宗人圖其嘉事及王退俟大夫之朝也其二路門外之朝謂之治朝司士掌之云正朝儀之位此是每日視朝之位其王與諸侯賔射亦與治朝同故射人云三公北靣云云其三臯門之內庫門之外謂之外朝朝士掌之此是詢衆庶之朝也燕禮云卿西面大夫北面士門西東面大射亦然周禮天子有射朝燕禮諸侯有燕朝則天子諸侯皆三朝也文王世子庶子之正於公族者云云其朝于公內朝則東靣北上臣有貴者以齒注內朝路寢庭其在外朝則以官司士為之外朝路寢門之外庭司士亦司馬之屬也掌羣臣之班正朝儀之位其在宗廟之中則如外朝之位宗人授事以爵以官公族朝于內朝內親也外朝以官體異姓也疏其朝位天子之朝三公北面東上孤東面北上卿大夫西面北上其士門西東面北上若諸侯之朝案大射卿西面北上大夫北面東上士門西東面北上與天子不同玉藻諸侯朝服以日視朝於內朝朝辨色始入君日出而視之退適路寢聽政使人視大夫大夫退然後適小寢釋服燕寢也注此內朝路寢門外之正朝也天子諸侯皆三朝入羣臣入應門朱氏曰王日視朝於路朝而退聽政於燕朝疏天子三朝太僕燕朝一也司士路門外二也朝士外朝三也諸侯三朝文王世子內朝路寢朝一也世子又云外朝路寢門外二也諸侯三門是中門外大門內又有外朝是三朝也月令疏天子有三朝一燕朝在路寢二治朝路寢門外應門之內三外朝在庫門之外臯門之內迎春而反賞公卿大夫於路寢門外正朝耕藉而反勞羣臣在於路寢爵賞公事與衆共之故在正朝燕勞私禮主於歡心故在路寢三禮義宗曰每朝列位所向不同其三公之位常北面不變者以三公內臣位尊故屈之其餘諸侯孤卿大夫皆以地道尊右故尊者東靣卑者西面於外朝諸侯東面於內朝孤卿東靣時無諸侯故也惟詢事之朝非常朝之限故不與三朝同一云容有諸侯之位故孤卿在東若時會殷同方嶽之下為宫壇見諸侯之法其位皆如明堂之位天子宫方一千二百步三分二為路寢之前一為路寢之後自臯門至路門凡五門相去之數未聞路寢之前至臯門凡五門之間合八百步為三朝皆方百步諸侯三門臯門至路寢相去六百步自路寢以前為三朝各一百步又曰周禮天子諸侯皆有三朝一曰外朝二曰中朝三曰內朝其中朝之名或內或外若據外朝而言謂之內朝故鄭注文王世子諸侯外朝一內朝二是也三朝之最外為外朝者是決罪聽訟之朝也中朝者人君旦夕視政見卿大夫之朝也所謂辨色而入者在此朝也內朝者路寢也人君視政退而居於此待諸侯之復逆也視卿大夫退然後適燕寢所謂大夫夙退無使君勞在此朝也諸侯三朝路寢為內朝中朝在路門之外外朝在應門之外天子臯門內有外朝面有三槐左右各有九棘近庫門則有三府九寺庫門之內則有宗廟雉門之內有兩觀觀外亦有詢事之朝在宗廟社稷之間雉門外有百官宿衛省也應門之內有中朝中朝東有九卿室是九卿治事之處故考工記外有九室九卿治之朝畢則入而治事夕則歸於庫門外外朝之法朝有疑獄王集而聽之通典周制天子有四朝常言三朝者以詢事之朝非常朝一曰外朝在臯門內決罪聽訟之朝也秋官朝士掌之二曰中朝在路門外夏官司士正其位三曰內朝亦謂路寢之朝亦謂之燕朝大僕掌之四曰詢事之朝在雉門外小司寇掌其政左傳曹劌曰會以訓上下之則制財用之節朝以正班爵之義帥長幼之序魯國語天子及諸侯合民事於外朝合神事於內朝在路門內自卿以下合官職於外朝君之公朝合家事於內朝家朝卿大夫亦二朝禮夏官射人掌國之三公孤卿大夫之位三公北面孤東靣卿大夫西靣其摰三公執璧孤執皮帛卿執羔大夫鴈注位將射始入見君之位燕禮曰公升即位于席西鄉小臣納卿大夫卿大夫皆入門右北面東上士立於西方東面北上大射亦云則凡朝燕及射臣見君之禮同諸侯在朝則皆北面詔相其法注諸侯來朝而未歸王與之射於朝者皆北面從三公位疏引燕禮者欲見天子諸侯朝燕射三者位同之義儀禮內諸侯有燕朝及射朝不見正朝周禮內天子有射朝與正朝不見燕朝諸侯射朝與燕朝位同則天子燕朝亦與射朝位同諸侯正朝亦與射朝位同是天子諸侯三朝各自同大射在學故有著冕在扆之事此賓射在路門之外朝與彼異儀禮聘禮君與卿圖事注謀事者必因朝其位君南面卿西南夫夫北面士東面疏謀事必因朝者欲取詢衆之意諸侯三朝燕朝燕禮是也又射朝大射是也路朝外正朝不見疑當與二朝面位同故以燕禮大射儀約之知正朝面位然也若天子三朝射人見射朝司士見正朝不見燕朝以諸侯正朝與燕朝同明天子燕朝亦與正朝同也管人布幕于寢門外注寢門外朝也疏謂路門外即王正朝之處諸侯三門臯應路路門外有常朝位周注引朝貢禮曰純四只制丈八尺疏引禮趙商問夕幣于寢門外宰入告具于君君朝服出門左南鄉注寢門外朝也入告入路門而告疏此路門外正朝之處也又賔拜饔餼于朝注拜於大門外疏大門外諸侯之外朝也諸朱氏曰門外之制見於經者天子有屏侯有朝諸侯路寢門外則有正朝大門外則有外朝其燕朝在寢燕禮是也覲禮侯氏入門右告聽事出自屏南適門西注天子外屏釋宫曰屏謂之植注小墻當門中書康王之誥太保率西方諸侯入應門左畢公率東方諸侯入應門右皆布乘黃朱賔稱奉圭兼幣周之朝儀略見於此此朝會分班儀也太保暨芮伯咸進相揖皆再拜稽首此朝會合班儀也左傳叔向曰朝有著定會有表會朝之言必聞于表著之位注著定朝內列位常處謂之表著野會設表以為位曰周語大夫士日恪位著以敬其官注云中庭之左右位門屏之間曰著司常注事名號者徽識所以題别衆臣植之於位朝各就焉明堂位正義案覲禮諸侯受次于廟門外是覲在廟三公中階之前此以下明朝位之法諸侯在諸國之上特舉位言之易氏曰燕朝在路門之內治朝在路門之外又外而應門又外而雉門則有中門之禁焉以至尊所居儀衛嚴肅幾其出入不可踰越惟庫門在雉門之外而外朝又在庫門之外不特諸侯羣臣之咸在雖州長衆庶與窮民罷民之類皆得至於左右前後之列故小司寇掌其政朝士掌建其法言外朝特詳位定然後為之禁慢朝錯立族談者司士所正者羣臣之位朝畢則退大僕掌正王位則無往不從故云入亦如之小司寇主於詢天下之政其位止於公卿大夫庶民而已朝士專掌外朝之法則諸侯以至羣士羣吏咸在焉欲肅其儀必建其法按先鄭之釋朝士外朝在路門外而康成援郊特牲小宗伯之文證之誠足以破後學之惑至小司寇之外朝則曰在雉門外何歟賈公彥為之説曰在雉門外則亦在庫門外要當以是説為正云周覲禮殷朝法周明堂朝位儀禮覲禮第十覲禮至於郊王使人皮辨用璧勞侯氏亦皮辨迎于雉門之外遂升受玉侯氏用束帛乘馬擯使者天子賜舍曰伯父女順命于王所賜伯父舍天子使大夫戒曰某日伯父帥乃初事侯氏再拜稽首諸侯前朝皆受舍于朝同姓西面北上異姓東靣北上侯氏禆冕釋幣于禰乘墨車載龍旗弧韣乃朝以瑞玉有繅天子設斧依於戶牖之間左右几天子衮冕負斧依嗇夫承命告于天子司空之屬天子曰伯父實來豫一人嘉之伯父其入豫一人將受之侯氏入門右奠圭取圭升致命王受之升成拜乃出四享皆束帛加璧庭實惟國所有事畢天子辭於侯氏曰伯父歸寧乃邦侯氏再拜稽首升成拜降出天子賜以車服迎于外門外再拜路先設西上路下四亞之乘馬也重賜無數在車南諸公奉篋服加命書于上太史是右侯氏升西靣立太史述命加書于服上侯氏受饗禮乃歸諸侯覲于天子為宫方三百步四門壇十有二尋深四尺加方明于其上方明者上下四方神明之象儀司儀將合則令為壇三成宫旁一門詔王南鄉見諸侯注引覲禮方明者木也方四尺設六色青赤白黑玄黃設六玉上圭下璧南方璋西方琥北方璜東方圭天子乘龍載大旗象日月升龍出拜日於東門之外反祀方明禮日於南門外禮月與四瀆於北門外禮山川丘陵於西門外記几俟于東箱偏駕不入玉門奠圭于繅上郊特牲覲禮天子不下堂而見諸侯詩正義王唯覲禮不下堂而見諸侯其朝宗當迎之故秋官説車迎之法賔主步數明堂位周公朝諸侯于明堂之位六年天子負斧依南鄉而立為斧文屏風於户牖間在明堂中央太室三公中階之前北靣東上諸侯之位阼階之東西面北上諸伯之國西階之西東面北上諸子之國門東北面東上諸男之國門西北面東上注朝位之上上近主位尊也正義三公則東上侯尊於伯故在東子尊於男亦在東九夷之國東門之外西靣北上八蠻之國南門之外北面東上六戎之國西門之外東面南上五狄之國北門之外南面東上九采之國應門之外北面東上注九采九州之牧典貢職者正門謂之應門二伯帥諸侯而入九牧居外而紏察之正義王制云千里之外曰采皇氏云在應門外之西外伯既領之入應門牧居應門糾察諸侯後入不如儀者四塞世告至夷鎮蕃三服在四方為蔽塞蕃國世一見此周公明堂之位也明堂者明諸侯之尊卑也大司馬云設儀辨位以等邦國朝於此所以正儀辨明等陸氏曰九采之國所謂要服荒服是歟周書堂篇第五十五與禮記同王制諸侯之於天子比年一小聘三年一大聘五年一朝注比年每嵗也小聘使大夫大聘使卿朝則君自行然此大聘與朝晉文霸時所制也虞夏之制諸侯嵗朝周之制侯甸男采衛要服六者各以其服數來朝曲禮注諸侯春見曰朝受摰於朝受享於廟生氣文也秋見曰覲一受之於廟殺氣質也朝者位於內朝而序進覲者位於廟門外而序入王南靣立於依寧而受焉夏宗依春冬遇依秋覲禮今存朝宗遇禮今亡左傳晉侯出入三覲康有酆之朝注朝諸侯叔向曰明王之制使諸侯歲聘以志業間朝以講禮再朝而會以示威再會而盟以顯昭明注凡八聘四朝再會王一巡守盟于方嶽之下又曰會朝禮之經也禮政之輿也薳啓強曰朝聘有圭享眺有璋小有述職大有巡功設几而不倚爵盈而不飲宴有好貨飱有陪鼎入有郊勞出有贈賄禮之至也公羊傳諸侯時朝乎天子天子之郊諸侯皆有朝宿之邑焉注時朝者順四時而朝也五年一朝詩韓奕韓侯入覲以其介圭入覲于王王錫韓侯淑旗綏章簟茀錯衡玄衮赤舄鉤膺鏤錫鞗革金厄采菽君子來朝何錫豫之路車乘馬玄衮及黼言觀其旗其旗淠淠鸞聲噦噦車攻四牡奕奕赤芾金舄會同有繹序云宣王復會諸侯于東都清廟序周公成洛邑朝諸侯率以祀文王周官六年五服一朝又六年王乃時巡考制度于四嶽諸侯各朝于方嶽大明黜陟秋官大行人掌大賔之禮大客之儀以親諸侯大賔要服以內諸侯大客謂其孤卿春朝諸侯而圖天下之事秋覲以比邦國之功夏宗以陳天下之謨冬遇以協諸侯之慮時會以發四方之禁殷同以施天下之政注此六事以王見諸侯為文時聘以結諸侯之好殷俯以除邦國之慝此二事亦以王見諸侯之臣使來者為文間問以論諸侯之志歸脤以交諸侯之福賀慶以贊諸侯之喜致襘以補諸侯之災此四者王使臣於諸侯之禮以九儀辨諸侯之命等諸臣之爵上公諸侯伯子男之禮大國之孤諸侯之卿及其大夫士侯服歲一見甸服二嵗一見男服三嵗一見采服四嵗一見衛服五嵗一見要服六嵗一見九州之外謂之蕃國世一見各以其所貴寶為摰天官掌舍掌王會同之舍設梐枑再重大朝覲會同大宰贊玉幣玉獻玉几玉爵注大會同或於春朝或於秋覲其王朝諸侯立依前南面禮之於阼階上小宰以法掌戒具宰夫掌牢禮飱牽陳數注凡此禮陳數存可見者有行人掌客及聘禮公食大夫掌次張大次小次幕人共帷幕幄帟綬大宗伯為上相出接賓曰擯入詔禮曰相小宗伯肄儀為位肆師佐擯共設匪甕之禮司几筵王位設黼依之前南鄉設蒲筵紛純加繅席畫純加次席黼純左右玉几典瑞公侯伯圭繅三采三就子男二采再就以朝覲宗遇會同于王大史以書協禮事小史佐之司常置旌門射人諸侯在朝則皆比面詔相其法作大夫介注引覲禮司士凡會同作士從節服氏掌朝覲衮冕六人維太常齊僕馭金路以賓校人毛馬而頒之車僕共革車大司冦前王小行人協九儀賓客之禮司儀掌九儀擯相之禮為壇三成宫旁一門詔王儀南鄉見諸侯象胥受國客幣掌客具饗禮桞宗元曰古者旦見曰朝暮見曰夕詩莫肻朝夕傳朝而不夕禮記日入而夕朝不廢朝暮不廢夕晉叔向夕楚右尹子革夕齊子我夕趙文子礱其椽張老夕知襄子為室士茁夕皆暮見也漢儀夕則兩郎向瑣闈拜謂之夕郎亦出是名也明堂之朝位詳於諸侯而僅載四夷者聖人每詳內而略外也王會篇之朝位詳於四夷而略於諸侯者逺人自面內而嚮化也車輅前陳旗物森列金石在虡琛贄充庭璪旒衮舄天臨乎其上簮緌舄履星拱乎其下王會見後朝事儀記玉藻疏朝事儀云冕而執鎮圭帥諸侯朝日於東郊王制疏覲禮云天子乘龍載大旗拜日於東門之外反祀方明鄭注引朝事儀曰天子冕而執鎮圭尺有二寸云帥諸侯而朝日於東郊所以教尊尊也退而朝諸侯周禮注朝士儀曰奉國地所出物而獻之明臣職也孔子聘辭左傳襄二十七年六月丁未朔宋人享趙文子叔向為介司馬置折俎禮也仲尼使舉是禮也以為多文辭杜氏注因享宴之會展賓主之辭服虔云以其多文辭故特舉而用之後世謂之孔氏聘辭以孔氏有其辭故傳不復載也正義所言孔氏聘辭不知事何所出實享禮而謂之聘舉舊辭而目曰孔氏事亦不必然也昭四年左師獻公合諸侯之禮六子産獻伯子男會公之禮六昭九年孟僖子如齊殷聘禮也禮大行人凡諸侯之邦交嵗相問殷相聘世相朝聘禮有上介衆介至所聘之國誓于其境則史讀書司馬執䇿賈人拭玉有司展幣經書公如京師者一朝于王所者二卿大夫如京師者五書天王來聘者七錫命者三君臣上下之分易矣聘義曰天子制諸侯比年小聘三年大聘王制曰諸侯之於天子比年一小聘三年一大聘五年一朝注小聘使大夫大聘使卿朝則君自行然此大聘與朝晉文霸時所制也虞夏之制諸侯嵗朝周制各以服數來朝漢長樂宮朝儀叔孫通傳見禮制類漢未央宫大朝史記高帝九年未央宮成大朝諸侯羣臣置酒前殿奉玉巵為太上皇夀漢明堂朝諸侯明堂上夀明堂上計武紀元封元年夏四月癸卯上還登封泰山降坐朝堂此古明堂二年秋作明堂於泰山下即奉高縣五年春三月還至泰山增封甲子祀高祖于明堂以配上帝因朝諸侯王列侯受郡國計天漢三年三月行幸泰山封祀明堂因受計大始四年三月壬午祀高帝于明堂因受計三受計漢元封始天太郊祀志天子從禪還坐明堂羣臣更上壽下詔改元封元年兒寬傳從東封泰山還登明堂寬上壽曰陛下合指天地祖立明堂辟雍宗祀泰一臣寬奉觴再拜上千萬嵗壽制曰敬舉君之觴蕭由傳由治郡有聲元始中作明堂辟雍大朝諸侯召由為大鴻臚會病不及賓贊此長安明堂後儒林傳序明帝坐明堂朝羣后漢甘泉朝諸侯武紀太初元年受計于甘泉師古曰郡國所上計簿若今諸州計帳天漢四年春正月朝諸侯于甘泉宫後元二年正月朝諸侯于甘泉宫賜宗室志方士多言帝王有都甘泉者其後天子又朝諸侯甘泉甘泉作諸侯邸胸奴傳甘露三年正月單于朝天子于甘泉宫寵以殊禮位在諸侯王上贊謁稱臣而不名待以客禮之龍駕帝服鳴鐘傳鼓於清渭上南面朝單于漢中朝外朝內朝傳劉輔上書繫獄中朝左將軍辛慶忌右將軍廉褒光祿勳師丹大中大夫谷永俱上書云云注孟康曰中朝內朝也大司馬左右前後將軍侍中常侍散騎諸吏為中朝丞相以下至六百石為外朝王嘉事下將軍中朝者龔勝為光祿大夫尚書劾奏王嘉下將軍中朝者議勝獨書議楊惲中書謁者令宣持單于使者語視諸將軍中朝二千石韋玄成詔中朝臣具復毁廟之文涓勳奏丞相宣願下中朝特進列侯將軍以下正國法度朱博有詔左將軍彭宣與中朝者雜問制將軍中二千石諸大夫博士議郎議師丹人上書告丹上以問將軍中朝臣蕭望之五鳯中詔遣中朝大司馬車騎將軍諸吏光祿勳大僕問望之計策翟方進奏陳咸不當蒙方正舉備內朝臣咸為光祿大夫給事中成紀建始元年未央宫殿中朝者坐注晉灼曰內朝臣之朝坐也服虔曰公卿以下朝會坐也後鄧后紀元初五年劉毅上書曰正位內朝流化四海周禮注司徒府中有百官朝會殿天子與丞相決大事是外朝之存者傳嚴助為中大夫公孫弘朝覲奏事因言國家便宜上令助等與大臣辨論中外相應以義理之文大臣數詘蕭望之故事御史大夫朝奏事會庭中差居丞相後望之與鈞禮元帝詔望之給事中朝朔望王商河平四年單于來朝引見白虎殿丞相坐未央庭中單于前拜謁西都賦左右庭中朝堂百僚之位漢九賓又見禮制叔孫通傳長樂宫朝設九賓臚傳劉敞謂擯者九人蔡質漢儀德陽殿朝賀作九賓徹樂百官表大鴻臚注應劭曰郊廟行禮讚九賓鴻聲臚傳之也續官志鴻臚屬官治禮郎四十七人注東觀書曰主齋祠儐贊九賓禮儀志大鴻臚設九賔注薛綜曰九賓謂王侯公卿二千石六百石及郎吏胸奴侍子凡九等東京賦九賔重臚人列注引韋昭曰周禮九儀謂公侯伯子男孤卿大夫士也史記秦設九賓於庭漢諸王朝京師後紀顯宗永平二年九月沛王輔楚王英濟南王康淮陽王延東海王政來朝六年正月沛王輔等九人來朝十一年正月沛王輔等八人來朝肅宗建初七年春正月沛王輔濟南王康東平王蒼中山王焉東海王政琅邪王宇來朝傳東平王蒼永平十一年蒼與諸王朝京師建初六年冬上疏求朝明年正月帝許之賜裝錢千五百萬諸王各千萬帝賜蒼貂裘及太官食物珍果使大鴻臚竇固持節郊迎親循行邸第錢帛器物充備下詔曰禮云伯父歸寧乃國詩云叔父建爾元子敬之至也昔蕭相國加以不名優忠賢也況兼親尊者乎其沛濟南東平中山四王讃皆勿名蒼既至升殿乃拜天子親答之其後諸王入宫輒以輦迎至省閣乃下蒼辭曰既賜奉朝請咫尺天儀而親屈至尊降禮下臣每賜燕見輒興席改容中宫親拜事過典故三月大鴻臚奏遣諸王歸國帝特留蒼賜以祕書列仙圗道術祕方至八月飲酎畢有司復奏遣乃許之廣陵侯元夀建初七年肅宗詔元壽兄弟與諸王俱朝京師廣陵王荆之子中山王焉永平二年冬諸王來會辟雍事畢歸蕃焉與俱就國從以虎賁官騎北海敬王睦永平中嵗終遣中大夫奉璧朝賀第五倫傳建武二十七年補淮陽醫工長二十九年從王朝京師隨官屬得會見帝問政事大恱明日復召入史記褚先生曰諸侯王朝見天子漢法凡當四見始到入小見正月朔旦奉皮薦璧玉賀正月法見後三日為王置酒賜金錢財物後二日復入小見辭去凡留長安不過二十日小見者燕見於禁門內飲於省中非士人所得入也漢之儀法朝見賀正月者常一王與四侯俱朝見十餘嵗一至高紀十一年二月令諸侯王通侯常以十月朝獻哀紀嗣為定陶王元延四年入朝盡從傅相中尉時中山孝王亦來朝獨從傅上怪之以問定陶王對曰令諸侯王朝得從其國二千石故盡從之他日問中山王獨從傅在何法令不能對成帝由此賢定陶王宋志班固禮樂郊祀馬彪祭祀禮儀蔡雍朝會董巴輿服並各立志漢朝會見諸儒魯丕傳永平十一年遷中散大夫和帝因朝會召見諸儒丕與侍中賈逵尚書令黃香等相難數事帝善丕説罷朝特賜冠幘履襪衣一襲京房嘗宴見注以間宴時入見天子馬援引見數十每接燕語漢會見儀適竇融傳建武八年夏車駕西征隗囂融率五郡太守與大軍會高平第一高平有第一城融先遣從事問會見儀適注猶言儀注也是時軍旅諸將與三公交錯道中或背使者交相語帝聞融先問禮儀甚善之以宣告百僚乃置酒髙會引見融等待以殊禮隴蜀平詔與五郡守奏事京師引見就諸侯位建武四年馬援引見宣德殿漢奉朝請宣紀時會朝請舍長安尚冠里注嵗時隨宗室朝會宣帝為皇曾孫奉朝請傳吳王使人為秋請注孟康曰律春曰朝秋曰請如古諸侯朝聘也石奮歸老于家以歲時為朝臣注豫朝請張禹以特進奉朝請傳喜位特進奉朝請馮參以列侯奉朝請杜緩前免太常以列侯奉朝請蕭望之給事中朝朔望坐次將軍蘇武以著節老臣令朝朔望光為大師有詔朝朔望後官志列侯奉朝請在長安位次三公前漢漢官解詁三輔職如郡守獨奉朝請列侯奉朝請後漢冦鄧耿賈加特進朝請而已建武十三年耿弇馬武劉賜十四年陳俊十五年臧宫朱祐十九年鄧晨劉隆梁統鄧禹李通以特進奉朝請鄧隲永初中奉朝請位在三公下特進侯上有大議詣朝堂與公卿參謀顯宗拜鄧禹太傅進見東向永平中幸宛詔諸李隨安衆宗室會見李通傳建武七年王常拜橫野將軍位次與諸將絶席八年隗囂衆潰置酒高會勞賜中郎將來歙班坐絶席在諸將之右九年郭伋拜潁川守召見辭謁十九年拜桓榮議郎每朝會令榮於公卿前敷奏經書二十八年大會百官問誰可傅太子宣秉拜御史中丞帝特詔中丞司隸校尉尚書令會同並專席而坐京師號三獨坐鄧太后以張禹為太傅朝見特贊與三公絶席魏百官班次晉官志魏置謁者僕射掌大拜授及百官班次統謁者十人唐朝集上計會要貞觀元年十二月許梁州都督竇軌入朝問風俗十五年正月上曰古諸侯有湯沐邑漢故事立邸舍十七年十月朔詔為諸州朝集使造邸第三百餘所二十年有司言漢儀注朝賀正月常一王四侯十餘歲一至請每歲二王入朝禮畢還藩開元八年十月敕都督刺史上佐每歲分畨朝集十月二十五日至京十一月朔見二十二年詔十日一參大厯十四年敕諸州刺史入計如式元和十四年八月魏博田弘正來朝賜宴麟德殿五年十二月義武張茂昭朝京師故事雙日不坐是日特開延英唐宣政殿受朝朔望宣政殿受朝會要開元中蕭嵩奏每月朔望受朝於宣政殿先列仗衛及文武四品以下於庭侍中奏外辦上乃步自西序門出升御坐朝罷起步入東序門然後放仗臣以宸儀肅穆升降俯仰衆人不冝得見乃請備羽扇於殿兩廂上將出索扇扇合上坐定去扇將退又索扇如初天寶十二載十一月中丞奏京官朔望朝參著朱衣袴褶五品以上珂傘詳見冕服建中元年十一月朔辛酉御宣政殿見朝集使及貢士州府計吏至者一百七十有三兵興州郡不上計內外不會同者草五年至是始復舊典貞元七年四月二十八日戊午詔每歲五月一日御宣政殿見臣僚京官九品以上外官因朝奏在京者並就列令有司重定儀注頒示永編禮式本以五月一日隂生臣子道長君父道衰非善月也八年五月乙丑朔十四年五月朔宣政受朝見元和三年四月丁丑以術數之説禮經不載遂罷之先是創有是禮亦不多行十年三月朔壬申御延英殿對宰臣故事朔望御宣政殿見羣臣謂之大朝玄宗始以陵寢薦食不聽政後遂以為常舊紀貞元六年五月丙寅朔上御紫宸受朝以是月一隂生臣子道長父子必以是朔面焉故取朔日受朝七年四月戊午詔仲夏之時萬物敷暢陽德方茂隂事始承昔者觀其法象因天地交會之序為父子相見之儀豈隔於君臣之際起今年五月朔御正殿召見文武百官外官因朝奏咸聽就列仍編禮式以為常典五月庚申朔上御宣政殿見百官從新制也元和三年四月丁丑敕五月一日御殿受朝賀禮宜停會要貞觀十三年房元齡請三日一臨朝二十三年詔每日常坐顯慶二年隔日視事六典注永徽二年詔太極殿五日一視事紀唐制以隻日視朝文宗用雙日貞元十八年七月乙亥罷正衙奏事六典正至御承天門以聽政古之外朝朔望坐建極視朝古之中朝皆常日兩儀殿聽朝視事古之內朝國史慶厯七年詔讀時令禮院約定儀注以通禮參用唐宣政殿朔望朝參儀草定唐紫宸殿入閣儀官志起居舍人若仗在紫宸內閣夾香案分立殿下監察御史開元七年詔隨仗入閣左右翊中郎將入閣日一人升殿受狀會要貞觀五年正月詔諫官隨中書門下及三品官入閣貞元七年十一月詔常參官入閣不得奔走故事朔望日御宣政殿見羣臣謂之大朝立仗正衙或御紫宸殿則喚仗自宣政兩閣入所謂東西上閣門也自玄宗前未有此制開元後以朔望上盤食玄宗欲避正殿遂移紫宸殿喚仗自閣門入始有入閣之名敬宗寶歷初始以月朔御紫宸殿入閣開成元年正月己酉詔入閣日次對官班退立於東階松下須宰臣奏事畢齊至香案前各言本司事左右起居又待次對官奏事畢方出敬宗長慶四年正月即位二月辛丒御紫宸殿羣臣初展入閣之儀五代會要唐制常參官每日朝退賜食謂之廊餐自乾符後月旦入閣日賜食禮畢閣門宣放仗羣臣俱拜謂之謝食五代史李琪傳唐末喪亂朝廷禮壞天子未嘗視朝而入閣之制亦廢常參官日至正衙者聞傳不坐即退獨大臣奏事日一見便殿而侍從內諸司日再朝而已明宗即位後唐乃詔羣臣五日一隨宰相入見內殿謂之起居李琪謂非唐故事請罷五日起居而復朔望入閣明宗曰五日起居吾思數見羣臣不可罷而朔望入閣可復會要天成元年十一月乙酉詔朔望賜百官廊下餐然唐故事天子日御殿見羣臣曰常參朔望薦食諸陵寢有思慕之心不能臨前殿則御便殿曰入閣玄宗以陵寢薦食不聽政遂以為常宣政前殿也謂之衙衙有仗紫宸便殿也謂之閣其不御前殿而御紫宸殿也乃自正衙喚仗由閣門而入百官俟朝者因隨以入見故謂之入閣然衙朝也其禮尊閣宴見也其禮殺自乾符後因亂禮缺天子不能日見羣臣而見朔望故正衙常日廢仗而朔望入閣有儀其後習見遂以入閣為重至出御前殿猶謂之入閣至是而復然有司不能講正凡羣臣五日一見入中興殿便殿也此入閣遺制而謂之起居朔望一出御文明殿前殿也文明殿兩掖曰東西上閣門反謂之入閣琪不能正也琪又建言入閣門有待制次對官論事而內殿起居一見而退五代會要後唐天成元年七月御史臺奏故事每日百官入朝百官排儀仗金吾勘契入後有待制次對官各舉論本司事左右起居分記言動付史館編録欲有言者無由自陳明宗乃詔起居日天成元年八月己亥御文明殿百官入閣如月朔之儀有言事者許出行自陳又詔百官以次轉對文明殿即唐貞觀殿梁開平二年改在洛陽會要貞元十二年十月御史臺奏御史內供奉者入閣日依宣政殿前班位次員外郎之後天祐三年六月敕文武百僚每月一入閣於貞觀殿貞觀殿朝廷正衙正至受朝賀比來視朔未正規儀宜於崇勳殿入閣二殿皆在洛陽崇勳殿後唐曰中興五代會要有入閣儀開延英儀通鑑元和十五年十月壬午羣臣入閣退諫議大夫鄭覃等五人進言時久無閣中論事者穆宗訝之李渤傳敬宗晏朝紫宸入閣帝久不出今按貞觀中已自入閣之語不待開元間退御紫宸乃云入閣也玄宗亦曰魚袋者五品以上入閣則合符宋庠曰坐朝日即為入閣未知何據唐百官班序朝參名簿百官志御史大夫朝會則率其屬正百官之班序遲明列於兩觀文武職事九品以上及二王後朝朔望文官五品以上及兩省供奉官監察御史員外郎太常博士日參號常參官武官三品以上三日一朝號九參官五品以上及折衝當畨者五日一朝號六參官弘文崇文館國子監學生四時參凡諸王入朝及以恩追至者日參九品以上自十月至二月袴褶以朝五品以上有珂文武三品非職事官朝參名簿皆稱曰諸公監察御史舉不如法者鴻臚卿凡四夷君長以蕃望高下為簿朝見辨其等位會要永徽元年十月五日京官文武五品依舊五日一參神龍元年四月初令五品以上朔望參日升殿食天寶十四載三月一日令分日入朝貞觀六年八月御史大夫責殿中侍御史唐臨以朝列不整景龍三年左臺御史崔涖彈朝班不肅舒元輿御史臺中書院記御史每朝會至含元殿西廡使朱衣從官傳呼促百官就班遲曉列於兩觀之下監察二人立於東西朝堂甎道以監之雞人報點押百官由通乾觀象入宣政門及班于殿庭則左右循使二人分押於鍾鼓樓下若兩班就食廊下又分殿中一人為使蒞之謁者承旨喚仗入東西閣門分監察二人立紫宸屏下以監其出入爐煙起天子負斧扆聽政自螭首龍墀南屬於文武班則侍御史一人盡得彈舉不如法者儀衛志同唐貞元班序敕通典貞元二年九月五日敕文武百官朝謁班序中書門下各以本官序供奉官在橫班序若入閣則各隨左右省主御史大夫中丞侍御史在左殿中侍御史在右通事舍人分左右立文武官行立班序通乾觀象門外序班武次文含元殿前龍尾道下敘班舊無此儀唯合於通乾觀象門南序班至宣政門文由東門入武由西門入至閣門亦如之退朝從宣政西門出周禮先敘六官六典尚書省官本每班請以尚書省為首會要貞元二十年十月御史中丞奏準貞元二年班序敕三院御史常參官兼者入本官班如內供奉裏行入御史班二十一年五月又奏凖貞元班序敕云云橫行位次依本班先後唐朝位百官志御史臺凡朝位以官職事同者先爵爵同以齒致仕官居上職事官與散官勳官合班則文散官居職事之下武散官次之勳官又次之官同者異姓為後親王嗣王任文武官者從其班官卑者從王品郡王任三品以下職事者居同階品之上非任文武官者嗣王居太子太保之下郡王次之國公居三品之下郡公居從三品之下縣公居四品之下侯居從四品之下伯居五品之下子居從五品之上男居從五品之下以前官召見者居本品見任之上以理解者居同品之下本司參集者以職事為上下文武三品非職事官者朝參名簿皆稱曰諸公建隆崇元殿入閣建隆元年八月戊辰朔御崇元殿即天安殿宋太祖五行其禮然御前殿非唐舊矣設仗衛百官入閣置待制候對官仗退賜廊下食廊下食起唐貞觀三年八月丙戌朔御崇元殿入閣竇儀待制邉元範候對十一月乙卯朔御崇元殿入閣趙矩待制張淡候對四年四月壬午朔帝服通天冠絳紗袍御崇元殿視朝設金吾仗入閣艾頴待制馬士元候對八月庚辰朔亦如之乾德四年四月丙申朔御文明殿入閣即文德殿一云大明殿明國史云文當考太平興國二年閏七月丁巳有司言八月一日入閣舊儀軍校等不入殿庭起居文武官至位踧踖疾趍入沙墀再拜鞠躬不呼萬嵗望如冬正朝賀例軍校陪位拜舞禮畢先退門外序立文武官舞蹈如中書門下班從之制下會雨而止建隆合班儀乾德定內外官儀制祥符定羣臣儀制建隆三年三月壬午二十三日有司上重定合班儀制先是乙亥詔學士班侍郎之上升六曹侍郎在給舍上郎中在補闕上員外郎在拾遺上節度使在六曹侍郎上中書侍郎下餘如故乾德二年二月戊申朔重定內外官儀制有司請上將軍在中書侍郎下大將軍在少卿監下諸衛率副率在東宮五品下淳化三年八月有司重定合班儀升尚書令於三師之上時將畫正仗圖欲備官故也五年六月甲辰詔翰林學士班丞郎之上祥符元年正月庚寅二十八日有司上都亭驛酺宴班位圗天禧三年十一月辛酉九日閣門上大禮稱慶合班圗皇太子位在宰相上太子懇辭再請乃許祥符五年命學士李宗諤陳彭年詳定羣臣儀制九月丁丑奏百官避宰輔及斂馬分路之制景祐五年八月閣門詳定合班雜坐儀七年五月癸卯知雜御史王隨請以御史臺新降條目編為儀制從之立班圗見圗類類又見禮制建隆五月朔受朝三年五月癸亥朔御崇元殿受朝服通天絳紗陳儀衛天聖三年四月上問五月一日御殿故事王欽若對唐以隂氣始盛設君臣相見之儀然近歲未嘗行癸亥詔權停視朔御殿非古也唐德宗以術數之説肇行斯禮元和中以不經罷之後唐同光中復舉行至是猶循舊制熙寧二年罷之太平興國乾元殿受朝五月朔如冬正儀三年三月己酉吳越王俶入朝見於崇德殿寵賚甚厚賜宴長春殿四月己卯平海節度陳洪進獻漳泉二州得縣十四五月乙酉朔御乾元殿受朝仗衛如冬正儀赦漳泉是曰俶上表獻所管十三州一軍凡得縣八十六淳化文德殿入閣儀注入閣圖祥符入閣圖淳化二年十一月詔以來月朔御文德殿入閣令史館修撰楊徽之張洎與有司取舊圗定儀注以聞洎上奏曰按今之乾元殿即唐含元殿也在周為外朝唐為大朝冬至元日設仗衛朝萬國在此殿今之文德殿即唐宣政殿也在周為中朝在漢為前殿在唐為正衙凡朔望起居凡册后妃太子王公大臣對四夷君長試制䇿舉人在此殿也今之崇德殿即唐紫宸殿也在周為內朝在漢為宣室在唐為上閣即隻日常朝之殿也東晉太極殿有東西閣唐制紫宸上閣法此制也所謂入閣者蓋隻日御紫宸上閣之時先於宣政殿前立黃麾金吾仗俟勘契畢喚仗自東西閣門入故謂之入閣今朝廷以文德正衙權為上閣非憲度也切見長春殿正與文德殿南北對請改創此殿以為上閣作隻日立仗視朝之所其崇德崇政殿即唐之延英殿也為隻日常時聽斷之所疏入不報上以入閣舊圗承五代草創禮容不備命徽之等討論故事别為新圗十二月丙寅朔上御文德殿羣臣入閣禮畢賜百官廊下食唐制朔望天子御宣政殿受百官起居及諸司奏事仗衛如式敬宗始於紫宸殿展入閣之儀三年五月甲午朔御文德殿羣臣入閣先是舊制入閣惟殿中省細仗隨兩省供奉官先入陳於廷上以為儀衛太簡命有司增設黃麾仗二百五十人其殿中省細仗仍舊唐以月朔行之後唐天成初又以月望咸平二年八月辛亥朔御文德殿羣臣入閣孫何待制祥符三年閏二月辛亥朔李迪待制杜夢證候對七年四月二日東上閣門使魏昭亮言閣門入閣圖殿上侍立臣僚皆唐時職官與聖朝名品不同望依新定儀制别畫副本有司永為定制詔禮儀院詳定國史李淑傳議入閣曰唐寶厯後常以月朔御紫宸行入閣儀聖朝太祖五行其禮多御崇元殿備殿中金吾諸仗設待制候對官崇元即今天安殿也乾德之後改御大明殿即今集英太宗三行其禮别定新儀就文德廷增設黃麾仗真宗亦三行之繪圖講習藏之禁閣藝文志景祐三年詔賈昌朝與丁度李淑采國朝律厯典禮日度昏曉中星祠祀配侑歲時施行者約唐月令定為時令一卷以備宣讀而淑定入閣儀異於通禮明年詔因入閣讀時令尋停張洎傳淳化中上令史館修撰楊徽之等四人修正入閣舊圖洎同奉詔因詔討論入閣故事獨草奏以聞又請凖舊儀侍從官先入起居畢分行侍立於丹墀之下謂之蛾眉班然後宰相相率正班入起居唐初五日一朝景雲初始修貞觀故事肅宗而下咸隻日臨朝雙日不坐雙日宰相當奏事特開延英召對或蠻夷入貢勳臣歸朝亦特開紫宸引見望依舊規隻日視朝雙日不坐其雙日於崇德崇政兩殿召對宰臣常參官以下及非時蠻夷入貢勳臣歸朝亦特開上閣引見奏入不報景祐定入閣儀注景祐三年正月丙午詔知制誥李淑等重修閣門儀制其入閣儀注頗省去煩文四年二月二十二日庚子詔五月朔行入閣之禮仍讀時令先是詔國朝時令委編修官約唐月令撰定以備宣讀於是賈昌朝等采國朝律令典禮日度昏曉中星及祠祀配侑諸事當以歲時行者改定為一篇上之遂詔因入閣行其禮寶元二年十二月十二日戊辰參政宋庠言近奉德音詢及入閣故事臣雖略陳梗槩理有未詳退而講求故事夫入閣乃有唐隻日於紫宸殿受常朝之儀也謹按唐有大內有大明宫宫在大內之東北世謂之東內謂大內為西內自高宗以後天子多在大明宫宫之正門曰丹鳯門門內第一殿曰含元正至大朝會則御之對北第二殿曰宣政謂之正衙朔望大册拜則御之對北第三殿曰紫宸謂之上閣亦曰內衙隻日常朝則御之據唐制凡天子坐朝必須立仗於正衙或乘輿止御紫宸即喚正衙仗自宣政殿兩門入是謂東西上閣門也以國朝之制相比則令之宣德門唐丹鳯門也大慶殿唐含元殿也文德殿唐宣政殿也紫宸殿唐紫宸殿也今欲求入閣本意施於儀典即須先立仗於文德之廷如天子止御紫宸則喚仗自東西閣門入如此則差與舊儀相合但今之諸殿比於唐制南北不相對以此為異耳又按唐自中葉以還雙日及非時大臣奏事别開延英殿賜對若今假日御崇政延和是也乃知唐世每遇坐朝之日即為入閣而叔世離亂五朝草創大昕之制更從易簡正衙立仗因而遂廢其後或有行者常人所罕見乃復謂之盛禮甚不然也今相傳入閣圗者是官司記常朝之制如閣門有儀制敕合班雜坐圗之類何足為希闊之事哉况唐開元舊禮本無此制至開寶中諸儒增附新禮始載月朔入閣門之儀又以文德殿為上閣差舛尤甚蓋當時編撰之士討求未至太宗朝儒臣張洎論奏頗為精洽欲下兩制改正舊儀詔兩制詳定學士丁度等奏今殿閣與唐制不同宜且仍舊從之慶厯七年三月戊子詔權停所上立夏讀時令儀熙寧三年五月知制誥宋敏求言奉詔詳定閣門儀制如文德殿入閣當御紫宸殿方合舊制詔學士議承旨王圭言入閣者乃唐朝隻日紫宸受常朝之儀非盛禮壬子詔罷之二十三日學士院奏六月九日閣門奏文德殿無受朝儀下兩制詳定景祐百官表位景祐四年九月庚戌詔閣門於紫宸垂拱殿刋石為百官表位嘉祐四年六月二十四日御史臺請於紫宸垂拱兩殿庭石位鐫定班次以官位序班員多者重行員少者合班序立太平興國五年九月丁未詔曰表著之設蓋有等威闕庭之儀所務恭肅故離立族談者罰之所及蹴芻齒路者誅之必加所以辨名器之差正班爵之序賈生設堂陛之喻蓋明天子之尊叔孫造綿蕝之文式彰王者之貴李宗諤言朝會圖門下省典儀設版位御史中丞班在丹墀上兩省官後立熙寧文德殿視朝儀正衙視朝之儀志三年會要二年六月九日修閣門儀制宋敏求言本朝唯入閣御文德殿司馬光言文德殿為天子正衙今不用入閣儀遂闕視朝之禮請下兩制及禮院約唐御宣政殿制裁定為文德殿朔望視朝之制詔學士院詳定四年正月甲寅學士韓維等上其儀以入閣舊圖增損裁定其儀前一日供帳於殿庭金吾執儀刀天武執繖扇黃麾告止傳教信幡龍頭竿戟列于東西門外立仗青龍五嶽五龍旗列于東白虎五星五鳯旗列于西御馬東西皆五匹設御幄于殿後閣其日金吾押本衛仗殿中省押細仗東西對列四年五月乙酉朔初視朝于文德殿元豐四年五月十九日視朝天禧五年十月十日中書密院請凖故事五日一御便殿皇祐編敕正衙常朝及橫行並宰臣立班常朝日輪宰臣一員押班祥符初敕宰臣依故事赴文德殿押班治平四年五月癸未詔春分秋分後辰正牌上垂拱殿視事未退宰臣更不過文德殿押班初沿唐故事百官曰赴文德殿宰臣押班謂之常朝休假三日以上內殿起居官畢集謂之橫行宰臣以下應見謝辭者皆先赴文德殿謂之過正衙正衙謂之外朝對先詣正衙方許入元豐四年御史滿中行言今垂拱內殿宰臣以下既已日參而常朝不廢至於橫行正衙必俟天子御殿日乃可行之虛名謬例欲望罷去十一月己酉詔從之元豐大慶殿朝會圗四朝志元豐元年詳定正旦儀奏用黃麾仗二年詳定冬會等儀又言御殿儀仗有黃麾幡一而無黃麾請製大麾帝曰姑闕之二年詳定所又言昨定朝會圗於大慶殿橫街北止陳大輦逍遙平輦而輿未陳也當增腰輿一小輿一改製偏扇團方扇為三等繡帷凡朝會平輦逍遙並陳東西龍墀上政和三年四月議禮局上大慶殿大朝會儀衛黃麾大仗五千二十五人文德殿視朝黃麾半仗二千二百六十五人文德殿發册黃麾細仗一千四百二人紹興文德殿視朝紹興十二年十一月三日禮部侍郎王賞言朝會之制正至及大慶賀御大慶殿與文德紫宸垂拱殿禮制不同月朔御文德殿謂之前殿正衙設黃麾半仗紫宸垂拱係别殿不設儀仗今欲先舉行文德殿視朝之制十三年文德殿視朝用黃麾半仗二千四百十五人六月紫宸殿望參設黃麾角仗先是十二年十月二十七日有司請講求常朝視朝正衙便殿之儀於是討論朔日文德殿視朝紫宸殿日參望參垂拱殿日參四參及垂拱紫宸殿上夀之制請先御正殿視朝時行宫止一殿乃以射殿為崇政殿朔望設帳門以為文德紫宸殿宣制以為文德殿拜表聽批答以文德殿東上閣門又以內諸司地為垂拱殿四參於殿門外設位版乾道二年九月七日閣門定垂拱殿四參之儀紹興十三年二月壬戌上初御前殿特引四參官起居自建炎以來始有此禮四月三日閣門言垂拱殿已砌石位其字與石色一同百官難以辨認請四參石位裝字以黃蠟日參石位以紅蠟從之四月丙戌詔宰執四參官赴垂拱殿習看石位宋敏求曰文德殿曰外朝凡不釐務朝臣月赴是謂常朝垂拱殿曰內殿宰臣以下及武班日赴是謂常起居每五日文武朝臣赴內朝謂之百官大起居凡三等蓋天子坐朝莫先於正衙於禮羣臣無一日不朝者正衙雖不坐常參官猶立班俟放朝乃退漢宣帝地節二年五月始親政事五日一聽事自丞相以下各奉職奏事魏黃初五年五月有司以公卿朔望日因奏疑事聽斷大政王肅曰周官五日視朝漢宣帝使公卿五日一朝成帝始置尚書五人自是朝禮遂闕可復五日視朝之儀使公卿尚書各以事進廢禮復興光宣聖緒元魏孝文謂穆亮三代之禮日出視朝漢魏已降禮儀漸殺晉令有朔望集公卿於朝堂而論政事亦無天子親臨之文唐每月凡九開延英延英對宰臣日未御內殿前令閣門使傳宣放班高宗五日一御太極殿視事代宗於紫宸聽朝常限三人奏事天禧五年十月十日輔臣請準故事五日一御便殿及朔望坐朝玉海卷七十
