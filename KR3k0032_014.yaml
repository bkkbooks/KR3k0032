body:
  text: 玉海卷十四宋王應麟撰地理地理圖神農地形圖春秋元命包神農世白阜圖地形脈道注白阜為神農圖畫地形通水道之脈類聚引神農書曰湛濁為地黃帝九州圖太平御覽太一式占周公城名録曰通志周公城名録一卷隋志太一式雜占十卷黃帝受命風后受圖割地布九州置十二圖又見職録河圖括地象八極之廣東西二億三萬三千里南北二億三萬一千五百里夏禹所治四海內地東西二萬八千里南北二萬六千里天有九道地有九州王逸九思懿風后兮受瑞圖賈誼新書黃帝濟東海入江內取緑圖史記黃帝東至於海登凡山及岱宗西至於空桐登雞頭南至於江登熊湘北逐葷粥合符釜山而邑於涿鹿之阿吳越春秋禹案黃帝中經舜益地圖帝王世紀西王母慕舜德來獻白環及玦并貢益地圖初學記書帝驗期西王母於大荒之國得益地圖慕舜德逺來獻之集仙録黃帝在位王母遣使乘白鹿集帝庭授以地圖舜在位遣使獻白玉環及益地圖遂廣黃帝九州為十二州又獻玉琯吹之以和八風馬融云禹平水土置九州舜以冀州之北廣大分置并州燕齊遼逺分燕置幽州分齊為營州書正義舜攝位元年九州始畢當是二年之後以境界太逺始别置之禹還置九州漢賈捐之曰堯舜禹三聖之德地方不過數千里禹山川圖見後左傳注禹九州圖述異記魯班石為禹九州圖今在格城石室山東北岩中帝王世紀禹觀於河始受圖括地象也圖言治水之意尚書刑德放曰禹長於地理得括地象圖堯以為司空孝經援神契九州凡九百十萬八千二十四頃磽確不墾者千五百萬二千頃周山川圖詩周頌般於皇時周陟其髙山嶞山喬嶽允猶翕河箋云猶圖也皆信案山川之圖而次序祭之河自大陸之北敷為九祭合為一正義山川共為一圖望秩山川則案圖其餘衆川皆案圖祭之又見五服周職方圖禮職方氏中大夫四人下大夫八中士十六主四方職貢掌天下之圖辨邦國都鄙四夷八蠻七閩九貉五戎六狄之人民與財用九榖六畜之數要周知利害辨九州之國使同貫利東南曰揚州山會稽澤具區川三江浸五湖其利金錫竹箭穀宜稻正南曰荆州山衡澤雲夢川江漢浸潁湛其利丹銀齒革穀宜稻河南之豫則華山圃田滎雒波溠正東之青則沂山望諸淮泗沂沭河東之兖則岱山大野河泲盧維正西之雍則嶽山弦蒲涇汭渭洛東北之幽則醫無閭貕養河泲災時河內之冀則霍山楊紆漳汾潞正北之并則常山昭餘祁呼池嘔夷淶昜其利林漆絲枲蒲魚玉石魚鹽松柏布帛其榖五種稻麥四種三種黍稷辨九服之邦國王畿侯服甸男采衛蠻夷鎮藩以上用經文節要併寫正義九州總為三道先從南方起尊陽方周改禹貢以徐梁合於雍青分冀州為幽并東南曰揚州次正南曰荆州周之西南不置州統屬雍州即次河南曰豫州為一道也次正東曰青州次河東曰兖次正西曰雍為二道又次東北曰幽州次河內曰冀次正北曰并州為三道若禹貢治水則為二道又先從下起與此異也然既以徐梁合雍青其二道則以冀兖青徐為一道揚荆豫梁雍為二道云九州皆有鎮所以安地德一州之內山川澤藪至多取最大者而言鄭志趙商問職方氏掌四夷八蠻七閩九貉五戎六狄之數注云周之所服國數明堂位曰周公六年制作禮樂朝諸侯於明堂有朝位服事之國數夷九蠻八戎六狄五禮之事異未達其數鄭答職方四夷四方夷狄也九貉即九夷在東方八蠻在南方閩其别也戎狄之數或六或五兩文異爾雅雖有其數皆無别國之名周之兖於禹貢侵青徐之地周之青於禹貢侵豫之地周之雍豫於禹貢兼梁之地周之冀州小於禹貢以其北有幽并也周無徐梁禹貢無幽并書序孔子述職方汲冡周書職方解第六十二興周官同孔朝注云穆王使有司抄出之欲時省焉漢華嶽碑以為識方氏隋志周則夏官司險建九州之圖地官誦訓掌方志春官保章以星土辨九州之地職方掌天下之圖司徒掌土地之圖及土會之法其事分在衆職而冡宰掌建六典實總其事大史以典逆冡宰之治其書蓋亦總為史官之職唐志職方記十六卷周地圖方志九州圖天下圖地官大司徒掌建邦之土地之圖注若今司空郡國輿地圖疏案漢蕭何收秦圖籍以知天下厄塞廣逺至後漢乃有司空郡國輿地圖職方注直云如今司空輿地圖不云郡國以司馬主九畿并夷狄而言故不云郡國此主人民之數惟據九州之中以天下土地之圖周知九州之地域廣輪之數辨其山林川澤丘陵墳衍原隰之名物邦國都鄙之數注九州揚荆豫青兖雍幽冀并疏有幽并無徐梁此土地圖據十等土地而説馬融云東西為廣南北為輪案王制南北兩近一遙東西兩遙一近是南北長東西短謂知此數也山林以下十等名異辨邦國者謂分别畿外諸侯邦國多少之數若王制云畿外八州州二百一十國也辨都鄙者謂分别畿內三等采地之數若王制畿內九十三國也小司徒地訟以圖正之注謂邦國本圖疏凡量地以制邑初封量之時即有地圖在於官府小宰聽閭里以版圖注版戶籍圖地圖也聽人訟地者以版圖決之遂人以土地之圖經田野造縣鄙形體之法制分界也土訓道地圖以詔地事注説地圖九州形勢山川所宜疏九州地圖乃諸國所獻以入職方今土訓乃於職方取九州地圖依而説誦訓道方志以諂觀事道方慝以知地俗注四方所識久逺之事以告王若魯大庭之庫殽二陵草人掌金玉錫石之地以時取之物其地圖而授之司書掌邦中之版土地之圖知山林川澤之數量人掌建國之法分國為九州邦國之地與天下之塗數皆書而藏之注書地謂方圜山川之廣狹書塗謂支湊之逺近司險掌九州之圖周知山林川澤之阻職方掌天下之圖保章以星土辨九州之地穆天子傳庚辰天子大朝於宗周之廟乃里西土之數注紀年曰穆王西征還里天下天子大朝於黃之山披圖視典蘇秦説趙曰以天下地圖案之諸侯之地五倍於秦周版圖禮小宰以官府之八成經邦治三曰聽閭里以版圖注版戶籍圖地圖也司書掌邦中之版土地之圖以周知入出百物內宰掌書版圖之法以治王內之政令注版謂宫中閽寺之屬及其子弟録籍也圖王及后世子之宫中吏官府之形象也宫正掌王宫比宫中之官府次舍為之版以待司農注為官府次舍之版圖元謂版名籍宫伯掌王宫士庶子凡在版者注版名籍也以版為之今鄉戶籍謂之戶版司會掌凡在書契版圖者之二以聽會計注圖土地形象田地廣狹大胥掌學士之版司士掌羣臣之版論語式負版者注邦國圖籍版圖之二司會掌之土地之圖司書記之則天官之屬也形體之法遂人造之地事之圖土訓詔之則地官之職也春卿有小史外史掌其志夏卿有司險職方掌其圖至於邦國土地之圖地域廣輪之數載在司徒維見可睹周帝王圖籍漢地志周爵五等而土三等不滿為附庸蓋千八百國而大昊黃帝之後唐虞侯伯猶存帝王圖籍相踵而可知王吉疏帝王圖籍日陳於前翟酺上疏帝王圖籍陳列左右周卜洛圖洛誥乙卯朝至於洛師我卜河朔黎水乃卜澗水東瀍水西惟洛食又卜瀍水東亦惟洛食伻來以圖及獻卜注所卜地圖周書有作雒篇司約丹圖禮形方氏中士四人掌制邦國之地域而正其封疆無有華離之地周河圖水經注穆天子傳曰天子西征至陽紆之山河伯馮夷之所居地也是惟河宗氏天子乃沈圭璧禮焉河伯乃與天子披圖視典以觀天子之寶器玉果璿珠燭銀金稿等物皆河圖所載河伯以禮穆王視圖方乃導以西邁矣粵在伏羲受龍馬圖於河八卦是也故命歷序曰河圖帝王之階圖載江河小川州界之分野後堯壇於河受龍圖作握河記逮虞舜夏商咸亦受焉李尤盟津銘洋洋河水朝宗於海徑自中州龍圖所在淮南子曰昔禹治洪水具禱陽紆蓋於此也河圖玉版曰倉頡為帝南巡登陽虛之山臨於元扈洛汭之水靈龜負書丹甲青文以授之隋巢子姬氏之興也河出緑圖河圖括地象周禮疏河圖括地象西北為天門東南為地戶曲禮疏案地統書括地象云地中央曰昆崙其東南方五千里曰神州後漢曹充對河圖括地象曰有漢世禮樂文雅出蜀志注引岷山之地上為東井絡文選注引河圖括地象曰崑岡之山橫為地軸岷山之地上為井絡管子地圖通典管子曰凡兵主者必先審知地圖轘轅之險濫車之水名山通谷經川陵陸丘阜之所在苴草林木蒲葦之所茂道里之逺近城郭之大小名邑廢邑困殖之地必盡知之地形之出入相錯者盡藏然後可以行軍襲邑舉錯知先後不失地利此地圖之常也管子地圖第二十七又地員篇九州之土為九十物每土有常而物有次凡土物九十其種三十六秦地圖見後荀子今秦南乃有沙羡與俱是乃江南也北與胡貉為鄰西有邑戎東在楚者乃界於齊在韓者踰常山乃有臨慮在魏者乃據圍津即去大梁百有二十里耳其在趙者剡然有苓而據松柏之塞負西海而固常山是地遍天下也其國塞險形藝便山林川谷美天材之利多是形勝也漢三輔黃圖隋志一卷記三輔宫觀陵廟明堂辟雍郊畤等事唐志一卷地理六十三家此為之首序云孔子作春秋築一臺新一門必書於經今裒秦漢以來宫殿門闕樓觀池苑在關輔者著於篇東都不與焉不著作者姓名始於三輔治所終於雜録一帙凡二十九條書目云其間多用應劭集解如淳顔師古注援引亦有同者疑非當時本書崇文目不載程大昌曰晉灼所引謂為黃圖者多今書所無今書亦明引舊圖如漸臺彪池髙廟元始祭社稷儀皆言祖本舊圖又有引顔師古語為據者又命槐里為興平興平乃唐至德中改蓋唐人增續成之思子宫在湖萬歲宫在汾隂皆以其宫隸甘泉與正史不合續志注南北郊隋宇文愷議明堂今本無之唐志三輔舊事三卷隋志又有三輔故事二卷晉世撰隋禮志王元規議案前漢黃圖上帝后土壇蓻文類聚文選注漢書注水經注多引之文選注引三輔舊事曰髙祖立為新豐食貨志臣瓉注引西京黃圖敘曰民摩錢取屑南史江子一續黃圖漢長安圖史記文紀注裴駰案如淳曰長安圖細栁倉在渭北近石徼索隱曰三輔故事細栁在直城門外胸奴傳在長安西如淳云在渭北非也後郡國志注案關中圖縣南有新豐原選西征賦注引雍州圖辛氏三秦記潘嶽關中記又引長安圖漢時七里渠有飲馬橋漢山川圖建元六年淮南王安諫擊閩越曰以地圖察其山川要塞相去不過寸數而間獨數百千里李陵出居延北至浚稽山舉圖所過山川地形張千秋隨范明友擊烏丸還謁大將軍光問戰鬬方略山川形藝千秋口對兵事畫地成圖後李恂拜侍御史持節使幽州尉撫北狄所過皆圖寫山川屯田聚落百餘卷悉封奏上肅宗嘉之拜兖州刺史燕然山銘考傳驗圖窮覽其山川建武八年閏四月征隗囂馬援於帝前聚米為山谷指畫形勢帝曰虜在吾目中矣陳湯傳建昭二年出西域每過城邑山川常登望選注引遁甲開山圖漢四海圖籍古圖書班固東都賦受四海之圖籍張騫傳漢使窮河源天子案古圖書名河所出山曰崑崙云紀髙元年冬十月沛公入咸陽蕭何收秦丞相府圖籍文書傳云先入收秦丞相御史律令圖書沛公具知天下厄塞戶口多少強弱之處以何得秦圖書也黃圖石渠內藏入秦府所得圖書所謂天祿石渠典籍之府志代郡班氏注秦地圖書班氏琅邪郡奚養澤注秦地圖亦曰劇清地禹貢正義史記稱髙祖入咸陽蕭何先收圖籍則秦焚詩書圖籍具在孔君去漢初七八十年身為武帝博士必當具見圖籍其山川所在必驗實而知班固地理志據前漢郡縣言山川所在張蒼傳自秦時為柱下御史明習天下圖書計籍以列侯為主計張宴曰典校郡國簿書西域傳丞相御史奏遣屯田卒詣輪臺以東舉圖地形溝洫志武帝時方事胸奴齊人延年上書言河出崑崙經中國注渤海地勢西北髙而東南下可案圖書觀地形令水工準髙下開大河上領出之胡中東注之海書奏上壯之匡衡傳建始元年臨淮郡定國界上計簿更定圖言丞相府陸賜曰案故圖樂安鄉南以平陵伯為界不足故而以閩伯為界司隸劾奏衡位三公領計簿知郡實正國界計簿已定而專地盜土以自益建昭四年正月以誅郅支單于以其圖書示後宫貴人王鳳對太史公書有地形厄塞不宜在諸侯王趙充國願馳至金城圖上方略選張衡思玄賦注引四海圖曰交廣南有邛州後漢東夷傳引外國圖南蠻傳注引荆州圖副左東海右渠搜前畨禺後陶塗東南一尉西北一候六合之內同原共流稟卬太和枝附葉著得李恂之圖書乃知聚落觀千秋之畫地盡見山川漢司空輿地圖史記三王世家元狩六年四月丙申太僕臣賀行御史大夫事奏輿地圖請所立國名乙巳二十八日立皇子閎齊王旦燕胥廣陵王淮南王安與其臣左吳案輿地圖部兵所從入蘇林曰輿猶盡載之意周禮大司徒職方氏注若今司空輿地圖見上江都王建具天下輿地及軍陳圖志林云輿地圖漢家所獲隗囂據隴右馬援説其將楊廣曰前披輿地圖見天下郡國百有六所奈何以區區二邦當諸夏百有四乎更始元年十月光武安集河北鄧禹見於鄴曰今之計莫如延攬英雄務悅民心立髙祖之業救萬民之命以公而慮天下不足定也及王郎起兵二年二月光武至廣阿舍城樓上披輿地圖指示禹曰天下郡國如是今始乃得其一子前言天下不足定何也禹曰今海內殽亂人思明君猶赤子慕慈母古之興者在德厚薄不在小大光武悅紀建武十五年初巴蜀既平大司馬吳漢上書請封皇子三月詔羣臣議大司空融固始侯通膠東侯復髙密侯禹太常登奏議曰古者封建諸侯蕃屏京師周封同姓諸姬並為建國髙祖封立兄弟諸子不違舊章陛下興復宗統功臣宗室咸蒙封爵今皇子賴天能勝衣趨拜陛下抑而未議宜因盛夏吉時定號位以廣藩輔臣請大司空上輿地圖用元狩故事也成帝時更御史大夫名大司空故輿載也載在地者皆圖之司空掌土地令上之太常擇吉日具禮儀制曰可夏四月戊申以太牢告祠宗廟丁巳使大司空融告廟封皇子輔右翊公英楚陽東海康濟南蒼東平延淮陽荆山陽衡臨淮焉左翊京琅琊公十七年皆進爵為王列傳注東觀記明紀曰皇子之封皆減舊制嘗案輿地圖皇后在傍言巨鹿樂成廣平各數縣租榖百萬帝令滿二千萬止諸小王皆當略與楚淮陽相比什減三四我子不當與先帝子等也永平十五年四月庚子封皇子恭巨鹿黨樂成衍下邳暢汝南昞常山長濟隂王馬后紀十五年帝案地圖將封皇子悉半諸國后見而言曰諸子食數縣不已儉乎帝曰我子豈宜與先帝子等歲給二千萬足矣諸子之封裁令半楚淮陽諸國廣平王羡傳永平三年封建初三年有司奏遣羡與巨鹿樂成王俱就國肅宗性篤愛皆留京師明年案輿地圖令諸國戶口皆等租入歲各八千萬唐會要貞觀十六年褚遂良上疏曰漢明帝披輿地圖等諸國戶口令諸子租歲不過二千萬明德后為言亦不偏得武紀元鼎六年秋浮沮將軍公孫賀出九原臣瓉曰浮沮井名在胸奴中去九原二千里見漢輿地圖晉裴秀云惟有漢氏輿地及括地雜圖史記正義天地有覆載之德天為蓋地為輿故云輿地圖周禮大司徒疏車輿其前开曲地形不可正方故云武帝案以剖三子之封光武披而思天下之定明章二朝以等諸侯之租漢禹貢圖永平十二年賜王景山海經河渠書禹貢圖見河渠師古曰禹貢載禹治水次第山川髙下平當以經明禹貢使行河魏平原圖魏志孫禮傳遷冀州牧太傅司馬宣王謂禮曰今清河平原爭界八年更二刺史靡能決之禮曰當以烈祖初封平原時圖決之今圖藏在天府便可於坐上斷也禮到案圖宜屬平原平原在兩河向東上其間有爵隄在髙唐西南所爭地在髙唐西北相去二十餘里晉禹貢地域圖禹貢山川地名漢括地雜圖吳蜀地圖裴秀傳武帝時為司空儒學洽聞以職在地官禹貢山川地名從來久逺多有變易説者或強牽引漸以暗昧於是甄擲舊文疑者則闕古有名而今無者皆隨事注列作禹貢地域圖十八篇奏之藏於祕府其序曰圖書之設由來尚矣三代置其官國史掌厥職漢蕭何收秦圖籍今祕書既無古之地圖又無蕭何所得惟有漢氏輿地及括地諸雜圖各不設分率不考正準望亦不備載名山大川雖有粗形皆不精審或荒外迂誕之言不合事實於義無取晉混一六合始於庸蜀冞入其阻文皇帝乃命有司撰訪吳蜀地圖蜀土既定六軍所經地域近逺山川險易徑路迂直校驗圖記罔或有差今考禹貢山海川流原隰陂澤古之九州及今之十六州郡國縣邑疆界鄉陬及古國盟會舊名水陸徑路為地圖十八篇制圖之體有六一曰分率以辨廣輪之度二曰準望以正彼此之體三曰道理以定所由之數四曰髙下五曰方邪六曰迂直此三者各因地制宜以校夷險之異以六者參而考之文章序録曰盟會圖及興治官制皆未成隋宇文愷曰裴秀輿地以二寸為千里篇本朝程大昌上禹貢論五十二後論八篇文選王元長曲水序注括地圖曰貫胸之民左太沖摹二京而賦三都其山川城邑則稽之地圖鳥獸草木則驗之方志水經注括地圖曰馮夷乘雲車杜預為春秋左氏集解又作盟會圖初學記括地圖曰夏德盛二龍降之禹使范氏御之以行選東都賦注括地圖曰夏德盛二龍降之禹使范氏御之以行程南方選注引輿地圖曰梁武改南琅邪為琅邪郡宋方丈圖宋謝莊分左氏經傳隨國立篇製木方丈圖山川土地各有分理離之則州郡殊别合之則寓內為一唐志地域方丈圖一卷方尺圖一卷梁昭明謝賚地圖啓曰漢氏輿地晉氏方丈周地圖記隋志一百九卷唐志周地圖一百三十卷漢劉焉傳注引周地圖記曰褒谷西北有古陽平關其地今在梁州褒城縣西北選注亦引之史記正義周地圖記云長安城南為斗形北為北斗形隋州郡圖經志隋諸州圖經集一百卷郎蔚之撰郎茂撰一百卷奏之賜帛以書付祕府唐志郎蔚之隋圖經集記一百卷仁夀初命職方進地圖改封雄為安德王一志有并州總管內諸州圖卷州郡縣簿七卷選注引雍州圖經洛陽圖經唐十道圖職方地圖州縣圖經山川圖志地理類長安四年十道圖十三卷開元三年十道圖十卷李吉甫元和十道圖十卷會要貞觀元年三月十日始分天下為十道關內河南河東河北山南隴右淮南江南劒南嶺南志兵部尚書侍郎掌地圖職方郎掌地圖城隍鎮戍烽候道路逺近及四夷歸化之事凡圖經非州縣增廢五年乃修歲與版籍偕上凡蕃客至鴻臚訊其國山川風土為圖奏之副上職方殊俗入朝圖其容狀衣服以聞貞觀有王會圖會要諸州圖每三年一送職方建中元年十一月二十九日改至五年一造送如州縣有創造及山河改移即不在五年之限後復故六典職方凡地圖委州府三年一造與版籍偕上省韋執誼與同舍郎詣職方觀圖至嶺南圖皆命去之平淮西碑考圖數貢田興傳欲守天子之法舉六州版籍請吏於朝遂圖魏博相衛貝澶之地籍其人以獻元和五年九月義武張茂昭奉兩州符節管鑰圖籍歸之朝五代會要後唐長興三年四月中書奏案十道圖以關內道為上遂以鳳翔為首河中成都江陵興元為次晉開運二年張昭言流內銓行用十道圖請改定從之志劒南地圖二卷唐方域圖方志圖華夷圖九州設險圖吕才為太常博士帝詔造方域圖及飛騎戰陳圖屢稱旨擢太常丞五行類有地理經十卷貞觀中上方技傳武后時渾儀令尚獻甫於上陽宫集術家撰方域等篇舊史云集學者撰方域圖志李播方志圖卷亡賈耽撰海內華夷圖及論次地理之書凡五十有五編言方志者以為名家志耽有地圖十卷詳見後舊紀貞元十七年十月辛未宰相賈耽上海內華夷圖及古今郡國縣道四夷述四十卷馬敬實諸道行程圖一卷會要天寶五載正月七日詔天下山水名稱或同義且不經多因里諺宜各據圖籍改定舊史左史江融撰九州設險圖備載古今用兵成敗之事魏元忠就傳其術髙宗朝儀鳳中元忠上封事言命將用兵之工拙唐九州圖元和郡國圖貞元十四年十月賈耽進九州圖并别録六卷通録四卷共十卷表曰楚左史倚相能讀九丘晉司空裴秀創制六體采掇輿議畫關中隴右及山南九等圖一軸十七年上海內華夷圖表曰昔母丘出師東銘不耐甘英奉使西抵條支縮四極於纎縞分百郡於作繪宇宙雖廣舒之不盈庭舟車所通覽之咸在目舊紀元和八年二月辛卯宰相李吉甫進所撰元和郡國圖三十卷又進六代略三十卷又為十道州郡圖五十四卷太平御覽引元和郡縣圖洛陽地圖舊天文志李淳風刋定隨方志圖頗為詳悉所注郡邑多依用其後州縣改隸管屬不同但據山河以分耳貞觀中淳風撰法象志始以唐之州縣配焉崇文目開元分野圖一卷唐東都圖元和八年五月河南尹許孟容進東都圖隋志晉懷州刺史楊佺期洛城圖一卷唐志同陸機洛陽記一卷洛陽宫殿簿一卷洛陽記四卷後漢志注文選法又引楊佺期洛陽記河南郡縣境界簿及陸機洛陽記西征賦注引河南郡圖經東征賦注引洛陽故事選東京賦薛綜注洛陽圖經曰濯龍池名舊志洛陽圖一卷楊佺期撰唐天下圖河湟十一州地圖吐蕃傳初太宗平薛仁杲得隴上地虜李軌得涼州破吐谷渾髙昌開四鎮玄宗繼收黃河磧石宛秀等軍中國無斥候警者幾四十年輪臺伊吾屯田禾菽彌望開逺門揭候書曰西極道九千九百里示戍人無萬里行也乾元後隴右劒南西山三州七關軍鎮監牧三百所皆失之憲宗嘗覽天下圖見河湟舊封赫然思經略之未暇也宣宗大中三年二月復三州七關明年張義潮奉瓜沙伊肅甘等十一州地圖以獻會要五年七月州紀五年十月沙人張義潮以瓜沙伊肅鄯甘河西蘭岷廓十一州歸于有司十一月置歸義軍義潮為節度使其後河渭州虜將尚延心獻欵牧二州咸通二年義潮奉涼州來歸七年僕固俊取西州收諸部十月斬恐慹長慶二年劉元鼎使吐蕃踰湟水至龍泉谷西北望殺胡川哥舒翰故壁多在湟水出蒙谷抵龍泉與河合其西三百里曰紫山直大羊同國古所謂崑崙者東距長安五千里河源其間流澄緩下稍合衆流色赤行益逺他水并注則濁故世舉謂西戎地曰河湟書目域中郡國山川圖經一卷韋瑾撰始關內終劒南為圖李絳曰今法令所不及者五十餘州西戎內訌近以涇隴為鄙去京師逺不千里熢燧相接元載嘗在西州具知河西隴右要領請徙京西軍戍原州乘間築作徙子儀大軍在涇以為根本分兵守石門木峽隴山之關稍置鳴沙縣豐安軍為羽翼北帶靈武五城為形勢因圖上地形帝疑不決本傳栁宗元貞符濮鉛于北祝栗于南幅員東西祗一乃心唐風俗圖志藝術范長夀畫風俗圖唐國要圖國照圖崇文目唐國要圖五卷大唐國照圖一卷又見圖類國史志賈耽國要圖一卷唐河北險要圖元和七年十月乙未田興以魏博六州歸有司李吉甫傳田季安疾甚吉甫請任薛平節度義成軍以重兵控邢洺因圖上河北險要所在帝張於浴堂門壁每議河北事必指吉甫曰朕日按圖信如卿料矣吉甫圖淮西地未及上帝敕其子獻之通鑑七年八月辛亥上議魏博事吉甫請興兵李絳謂不必用兵當自歸吉甫為相期年易三十六鎮又省冗官八百員奏復宥州乃治經略軍以隸綏銀道取鄜城神䇿屯兵九千實之以江淮甲三十萬給太原澤潞軍增太原馬千匹由是戎備全輯徙烏重胤屯汝州唐山川險要圖李德裕見籌邊樓賈曾傳髙宗方事遼東奏上山川道里并陳髙麗可破狀唐休璟知兵自碣石踰四鎮綿地幾萬里山川夷阻障塞之要皆能言之唐定戎關圖又見後會要大中六年三月隴州防禦使薛逵奏奉正月二十六日詔旨移築故關伏以汧源西境切在故關昔有隄防殊無制置僻在重岡之上茍務髙深今移要會之中實堪控扼舊絶泉井逺汲河流今臨水挾山當川限谷危墻深塹克揚營壘之勢乞改為定戎關關吏鈐轄往來當界又有南由路亦是要衝舊有水關請凖前把捉正月二十七日起功今月十七日畢謹畫圖進上敕旨新置關城得其要害形於圖畫頗見公忠宜依所奏舊紀大中六年三月隴州刺史薛逵奏修築定戎關功畢志隴州汧源西有安戎關在隴山本大震關大中六年薛逵徙築更名唐舊州圖舊紀貞元十三年五月丙戍朔韋臯收復舊州畫圖來上會要大中五年七月沙州刺史張義潮遣兄義潭將本道圖經户籍來獻舉州歸順唐地志圖文粹廣陵李該裂素為方儀據書而畫隨方面以區别擬形容而訓解命曰地志圖呂溫為序云黜諸子之傳記述仲尼之職方會源流考同異觀其粉散百川黛擬羣山元氣剖判成乎筆端任土之毛有生之類大鈞變化不出其意列以城郭羅于陬落五侯九伯要荒蠻貊禹迹所窮漢驛所通五色相宣萬邦錯峙毫釐之差而下正封略方寸之界而上當分野乾象坤勢炳焉可觀與聚米畫地不可同年而語也户納四海忩籠八極名山大川隨顧奔走殊方絶域舉意而到髙視華裔坐橫古今觀帝王之疆理見宇宙之寥廣出遐入幽曾不崇朝才識以潤之丹青以炳之核人物之虛實總山川之要會表皇威之有截明王道之無外見蒼梧塗山則思舜禹恤民之艱覩窮荒大漠則悟秦漢勞師之弊覽齊墟晉壤則想桓文勤王之霸觀洞庭荆門則知苖蜀恃險之敗王者於是明得失諸侯於是鑒興替斯懲勸之逺也所以廣學流贊鴻業示後世乾德山川形勢圖二年十一月先是蜀遣孫遇趙彥韜及楊蠲等以蠟彈帛書間行遺北漢遇等至都下彥韜潛取書以獻有穆昭嗣為醫官上數召見問蜀中地理曰荆南都會己克則水陸皆可趨蜀上大悅後數日上得彥韜所獻書曰西討有名矣乃并赦遇蠲使指陳山川形勢戍守處所道里逺近畫以為圖甲戍命王全斌等進討乙亥上出畫圖授全斌等謂曰西川可取否對曰仗天威遵廟算剋日可定史延德前奏曰西川若在天上固不可到在地上到即平矣上嘉其果敢初蜀於夔州鎖江為浮梁上設敵棚三重夾江列炮上出地圖指其處謂劉光義曰泝江至此切勿以舟師爭勝當先遣步騎潛擊之俟稍却以戰棹夾攻可必取也三年正月全斌命偏將史延德分兵趨來蘇狹徑跨江為浮梁以濟遂取劒州兵出兩道一自鳯州以入一自歸州以取忠萬以西自發京師至昶降才六十六日凡得州四十六縣二百四十户五十三萬四千二十九太祖以幽燕地圖示趙普普曰此必曹翰為之上曰然普曰翰可取孰可守云云安德裕知廣濟軍時軍城新建作軍記及圖經三卷許仲宣知北海軍度山川形勢地理廣袤可為州郡因畫圖來上遂升為濰州熙寧中陳冠撰熙河六州圖記書目開寶修圖經四年正月戊午命知制誥盧多遜扈蒙等重修天下圖經其書汔不克成六年四月辛丑多遜使江南求江表諸州圖經以備修書於是十九州形勢盡得之宋準傳開寶八年受詔修定諸道圖經太平興國閏年圖淳化天下圖咸平職方圖興國二年閏七月丁巳二十八日有司上諸州所貢閏年圖故事三年令天下貢地圖與版籍皆上尚書省國初以閏為限所以周知地理山川之險易户口之衆寡三年五月吳越納土四年五月北漢平至雍熙中吳晉悉平奉圖來獻者州郡幾四百淳化四年詔畫工集諸州圖用絹一百匹合而畫之為天下圖藏于祕閣又令諸州所上閏年圖自今再閏一造至道二年二月王炳言二十四司載籍惟職方有諸司閏年圖云咸平四年八月甲子職方員外郎祕閣校理吳淑言諸路所納閏年圖當在職方近者並納儀鸞司伏以山川險要皆王室祕奧國家急務周禮職方氏掌天下圖籍又詔土訓以夾王車漢祖入關中蕭何收秦圖籍由是周知天下險要請今閏所納圖並上職方又州郡地里犬牙相入向者獨畫一州地形何以傅合他郡請令諸路轉運使從今閏各畫本路諸州圖一面上之每十年各納本路圖一亦上職方所冀天下險要不窺牖而可知九州廣輪如指掌而斯在從之兩朝志職方受諸州閏年圖及圖經至道滋福殿觀地圖山川郡縣形勝圖咸平陜西河北地圖祥符西域圖河西隴右圖至道三年七月四日真宗語宰臣曰朕欲觀邊防郡縣山川形勢可擇使以往乃選左藏副使揚允恭崇儀副使竇神寶閣門祗候李允則乘傳視山川形勝九月允恭以山川郡縣形勝一作地形繪圖以獻丙寅四日御滋福殿召輔臣觀西鄙地圖指山川堡壁曰朕已令屯兵於地內州郡簡冗省費以息關輔之民咸平四年十月庚戍上以陜西二十三州地圖示輔臣歷指山川險易蕃部居處又指秦州曰此州在隴山之外號為富庶且與羌戎接畛已命張雍出守冀其撫綏有方次指殿北壁靈州圖曰此馮業所畫頗為周悉山川形勝如此安得智勇之士為朕守之乎又指南壁甘沙伊涼等州圖曰此圖載黃河所出之山乃在積石外與禹貢所述異又指北壁幽州北契丹國界圖載契丹所據地南北千五百里東西九百里上曰封域非廣惜燕薊之淪異俗也時鄭文寶亦獻河西隴右圖且言靈州可棄先是八月戊申上出環慶清逺軍至靈州地圖指示輔臣又指靈州西榆木天澗路且議戰守方略曰邊臣奏糧儲芻藁大有備呂蒙正曰國家貿易商資以實邊農人不擾而西鄙足用蓋上䇿也五年六月甲申對輔臣于便殿出河北東路地圖指示山川要害祥符七年六月十一日河北安撫司上沿邊浚陂塘築隄道條式畫圖請付屯田司從之天禧二年十一月己未朔以知制誥盛度為學士先是度奉使陜西因覽疆域參質漢唐故地繪為西域圖以獻祥符六年遷知制誥明年奏事便殿上問山川形壤之制內出繒命工别繪度因言已圖漢所置五郡酒泉至金城復究尋五郡之東南自秦築長城唐置節度繪其山川道路區聚壁壘為河西隴右圖以獻上稱其博學咸平河西隴右圖鄭文寶傳咸平中命相府召詢䇿略文寶因獻河西隴右圖且言靈州可棄序曰淳化初掌漕陜右周覽河隴遍尋方志廣問象胥探月支日逐之穹廬討金城玉關之甌脫列于藻繪煥然在目咸平山海經圖見後論衡禹治洪水益主記異物作山海經崇文目山海經圖十卷舒雅修文選木玄虛海賦注引陸綏海賦圖選陶潛讀山海經詩流觀山海圖朱氏曰山海諸篇記異物飛走之類多云東向或云東首皆為一定不易之形疑本依圖畫而為之非實紀載此處有此物也景德重修十道圖淳化四年分天下為十道景德四年八月己酉十六日命知制誥孫僅龍圖待制戚綸重修十道圖書不成祥符六年十月戊子判吏部真從吉言格式司用十道圖考郡縣上下緊望以定俸給法官亦以定刑而户口歲有登耗請校定新本詔校理真鏞邵煥晏殊校定王曾總領之天禧元年書成凡三卷詔付有司景德山川形勢圖四年七月戊子詔翰林遣畫工分詣諸路圖上山川形勢地里逺近納樞密院每發兵屯戍移徙租賦以備檢閲元年十月甲午令張齊賢丁謂具青淄齊鄆濮等州山河道路形勢畫圖以聞祥符九域圖熙寧十八路圖祥符初命李宗諤修圖經有司請約唐十道圖以定賦役上命學士王曾修九域圖六年成崇文目二卷先王建國詔地事則有圖詔觀事則有志比生齒則有籍近世撮其大要會為一書趣時施宜文約事備則唐十道圖本朝九域圖是也熙寧四年二月甲戍十八日召集賢校理趙彥若歸館管當畫天下州軍府監縣鎮地圖先是中書命畫院待詔繪畫上欲有記問者精考圖籍故命彥若六年十月戊戍上十八路圖一及圖副二十卷八年六月辛丑劉師旦言九域圖訛舛請刪定既成王存言不繪地形難以稱圖更名九域志見後康定二年十月甲午分陜西為四路秦鳯韓琦涇原王沿環慶范仲淹鄜延龐籍仁宗初晏殊以十八路州軍三百六十餘所為圖上之表曰周公辨九州之土壤以奠民居蕭何收天下之圖籍以定帝業太宗分天下為十五路後天聖八年分江南為東西又增三路為十八路一京東二京西三河北四河東五陜西六淮南七江南東八江南西九湖南十湖北十一兩浙十二福建十三益嘉祐四年改成都十四梓十五利十六夔十七廣東十八廣西咸平四年三月辛巳分川峽為四路慶厯八年分河北為四路定州髙陽真定大名皇祐五年十二月二十七日壬戌以京東曹州京西陳許鄭滑州為輔郡置京畿轉運使至和二年十月己丑罷熙寧五年八月二十四日分京西為南北九月二十二日分淮南為東西十二月十三日分陜西為永興秦鳯兩路六年七月乙丑分河北為東西又分永興鄜延環慶秦鳯涇原熙河為六路祥符州縣圖經隋有諸州圖經集一百卷景德四年二月乙亥命學士邢昺呂祐之杜鎬戚綸陳彭年編集車駕所經古迹庚辰十二日一云十四日敕真宗因覽西京圖經有所未備詔諸路州府軍監以圖經校勘編入古迹選文學之官纂修校正補其闕略來上及諸路以圖經獻詔知制誥孫僅待制戚綸真集賢院王隨評事宋綬邵煥校定僅等以其體製不一遂加例重修命翰學李宗諤知制誥王曾領其事又增張知白晏殊又擇選人李垂韓羲等六人參其事祥符元年四月戊子龍圖待制戚綸請令修圖經官先修東封所過州縣圖經進內仍賜中書密院崇文院各一本以備檢閲從之三年十二月丁巳書成凡一千五百六十六卷目録二卷宗諤等上之詔嘉奬賜器幣命宗諤為序又詔重修定大小圖經令職方牒諸州謹其藏每閏依本録進景祐四年二月甲子賜御史臺至中興書目今存九十八卷兖州利州或附以近事云序曰夏載弼成於五服職方周知於數要其後地志起於史官郡記出於風土昔漢蕭何先收圖籍趙充國圖上方略光武按司空輿地圖封諸子李恂使幽州圖山川並燮定封域章施丹采今閏年諸州土地圖亦其比也圖則作繪之名經則載言之别景德丁未歲展孝山園循功鼎邑覽山河之形勝酌方志之前聞敕土訓而夾車校地官之著籍亟詔方州精加綜輯曾未半載悉上送官毛舉百代派引九流舉春秋筆削之規遵史臣廣備之法立言之本勸戒為宗守令循良罔不採尋畯良攸産往諜備傳自餘經界之疆畔道里之邇遐版賦耗登軌迹昭晦土毛良苦氣俗剛柔具有差品無相奪倫凡京府二次府八州三百五十二軍四十五監十四縣千二百五十三祥符四年八月十八日中書門下牒别寫録頒下諸道圖經新本共三百四十二本祥符四年正月戊子命錢易陳越劉子儀宋綬修所過圖經將祀汾隂六年十月甲戍命直集賢院石中立錢易修車駕所過圖經以備顧問十二月庚辰命晏殊同修時將朝謁太清宮康定元年十月癸卯詔陜西河東河北轉運司各上本路地圖三本一進二送中書密院續書目有圖經七十七卷台州至筠州其間亦有經後人增益者神宗史志職方掌天下圖籍周知方域廣袤及郡邑鎮寨道理之逺近與古今興廢之因州為之籍遇閏歲則一造圖以進建隆四年四月林抱義上辰敘二州圖樂史傳撰掌上華夷圖一卷蘇軾為指掌圖始帝嚳汔聖朝為圖凡四十有四其序曰昔蘇秦按此以説諸侯而知六國有十倍之勢蕭何藏此以相髙祖而知天下厄塞之所在聚米為象馬援以度隗囂建樓以畫德𥙿以服南詔藩鎮強梁於河北而險要詳於吉甫先零跋扈於隴西而地形上於充國規制華夷靡不慿此書目二卷不知作者始自帝嚳迄于皇朝圖其疆域著其因革刋其同異熙河六州圖記一卷熙寧間陳冠撰載王韶收復六州之地圖闕地理圖一卷不知作者志太祖受周禪凡州府軍監一百三十九縣六百六十一户九十六萬七千三百五十三建隆四年荆南來朝得州府三縣十七是年平湖南得州十五監一縣六十六乾德三年平蜀得州府四十六縣二百四十開寶四年平廣南得州六十縣二百十四八年平江南得州十九軍三縣一百八太平興國二年八月盡罷天下節鎮所領支郡三年陳洪進獻地得州二縣十四是年錢俶獻所管得州十三軍一縣八十六四年平太原得州十軍一縣四十一是年李繼捧來朝得州四縣八天下凡十八路州府軍監三百二十二縣一千二百六十二東西六千四百八十五里南北一萬一千六百二十里兩朝志州府軍監自至道中析為十五路其後稍增三路至仁宗初有路十八云云地東南皆至于海西盡巴僰北際中山東西云云治平四年府州軍監增者五縣損者五十三建隆迄治平一百四年地理無太增損熙寧始務開拓未及改元种諤先取綏州韓絳繼取銀州王韶取熙河章惇取懿洽謝景溫取徽誠熊本取南平郭逵取廣源最後李憲取蘭州沈括取葭蘆等四寨紹聖三年秋迄元符二年冬陜西河東建州一軍二關三城九寨二十八堡十又取青唐邈川寧塞龍支等城崇寧取湟鄯等三州二十餘壘迄于重和建州軍不可勝紀最後建燕山雲中兩路祥符山川城寨圖三年四月先是曹瑋張宗貴上涇原環慶兩路州軍山川城寨圖己未上出以示王欽若等曰處置得宜儲備詳悉華夷山川城郭險固出入戰守之要盡在是矣宜令别繪二圖用樞密印一付本路一留密院令諸將按圖以計事嘉祐四年十二月乙亥知麟州王慶民上麟府二州圖天禧南京圖應天府藝祖肇基之地祥符七年建南京詔即衙城為大內正殿以歸德為名雖降圖營建而實未嘗行天禧中王曾為守請減省舊制别為圖以進亦但報聞其後僅修祥輝崇禮二門而已元豐間蘇頌自南京還朝請以曾奏先修歸德一殿約為屋百間神宗亦未暇也惟正門以真宗觀酺賜名重熙頒慶樓猶是雙門未嘗改作葉夢得燕語康定聚米圖經康定二年二月十日殿直趙珣上聚米圖經五卷珣隨其父振在西邊訪五路徼外山川邑居道里凡地之利害究其實作為此書韓琦薦之詔取其書并召之珣又上五陳圖兵事十餘篇帝給步騎使按陳既成臨觀之宰輔奏用兵以來䇿士之言以萬數無如珣者慶厯元年五月戊午以為陜西巡檢使授兵萬人賜御鎧仗書日卷同地圖進西邊形皇祐方域圖志三年七月己巳二十一日知制誥王洙直集賢院掌禹錫上新修地理圖五十卷國史志三卷圖繪要覽一卷詔賜名皇祐方域圖志會要云九域志云圖記至和元年十二月庚子洙禹錫上皇祐方域續圖嘉祐益部方物略記圖贊宋祁序曰嘉祐建元之明年來領州得東陽沈立所録劒南風物三十八種按名索實尚未之盡逮詢西人又益數十物列而圖之物為之贊更名益部方物略記兾禆風土聚丘之一禽品五獸品三鱗品六蟲品一木品六竹品九果品八上卷茶品一花品十七菜品五草品六藥品九下卷范成大桂海虞衡志三卷馮拯畨禺紀異五卷三十門三百事元祐職方圖天下州縣圖三年四月己卯詔諸路及州各具圖開析建立沿革城壁吏員户口貢賦山川地里上職方熙寧九年八月六日三司使沈括言天下州府軍監縣鎮圖其間未全具先曾别編次一本稍加精詳欲再於職方借圖經地圖等圖草躬親編修從之元祐三年八月丙子沈括賜絹百匹以括上編修天下州縣圖故也書目交廣圖一卷熙寧中上以二廣邊機利害二十五條及雍州溪洞交洞圖三本并交趾迹狀上之圖今缺不知作者至道元年府州折御卿大破契丹圖山川地形以按視焉三月內臣楊守斌以地圖來上帝閲視久之嘉祐二年正月壬午詔以河東地界圖示契丹使蕭扈嘉祐五年歐陽修為樞副與曾公亮考天下兵數及三路屯戍多少地理逺近更為圖籍凡邊防久闕屯戍者必加搜補六年修在政府凡兵民官吏財利之要中書所當知者集為總目元豐六年七月壬申知延州劉昌祚以鄜延邊面東自義合西至德靜綿亘七百里堡寨踈密不齊烽燧不相應乃立為定式凡耕墾訓練戰守屯戍度強弱分地望圖山川形勢上之上嘉納舊有西界對境圖自興師西討諸處所奏異同元豐五年六月己未詔畫五路都對境圖乾德道德殿華夷圖見殿類黃裳作輿地圖以木為之玉海卷十四
