body:
  text: 玉海卷三十二宋王應麟撰聖文御製論魏文帝典論隋志儒家典論五卷魏文帝撰唐志同典隋志有一字石經論一卷文帝初在東宫著典論詩賦百餘篇集諸儒於肅成門講論大義以素書餉孫權又以紙寫一通與張昭明帝太和四年二月戊子刻石于廟門之外及太學與石經並以示來世以孫權不服班太宗論于天下明示不願征伐也著太宗論夲紀注載典論自叙魏志注引典論文選載論文唐高宗股肱論顯慶二年六月上製元首前星維城股肱誡次著股肱論令許敬宗註釋名曰天訓唐玄宗周易大衍論志玄宗作周易大衍論三卷祥符勤政論俗吏辨祥瑞論祥符五年八月丙午眞宗作勤政論俗吏辨示近臣曰近聞中外議論以朝廷當總覽大事斥去小務以玄黙為上德以簡易為聖治故能恢至靜之化逃苛酷之議且王者心稍自逸人即受弊若宴居中禁為樂終日忽在予之責之難外有機務雖可属于攸司内有心志其何檢于放逸且邦家之事刑政而已政令一出為安危之基刑辟一施有死生之法人以為小吾以為大小務不親必倦于大政大政一倦孰思于永圖又當謹之於始制之于後向所謂玄黙者謂無嗜好簡易者謂無滋苛卓異乎不事其事獨樂其樂者也又古人受命于帝庭制治于官次夙夜匪懈不得啓處及乎晉室始尚清談放逸有高士之名勤勞得俗吏之目居官蒞職當晝而忘飡宵而忘寝功名有所立富貴不為泰則小人以為俗吏國家以為藎臣也宰相等咸請聖製出示朝堂從之長編五年八月丙午上作祥瑞論勤政論俗吏辨賜輔臣人一本因曰始聞中外有議及朝廷崇奉祥瑞躬親細務者故著此以曉之輔臣請于朝堂宣示百官詔聽近臣就中書繕寫丁謂請于國學刻石從之十月庚戌國子監孫奭等言國學先許以聖製祥瑞勤政論俗吏辨三篇刻石望特賜宸翰從之七年四月己巳百官觀于國子監祥瑞論大指謂明王有丕祥而祇畏中人覩嘉應而侈泰是以春秋不書其事然神祇亦以揚祖宗之烈當欽承而宣布之若恃休祺而自肆固宜戒也祥符崇儒術論為君難為臣不易論祥符五年十月辛酉眞宗以崇儒術為君難為臣不易二論示王旦等先是龍圗閣學士陳彭年等因奏對上謂之曰儒術汚隆其應甚大國家隆替何莫由斯故秦衰則經術道息漢盛則學校興行其後命歴迭改而風教一揆有唐文物最盛朱梁而下王風浸微太宗丕變弊俗崇尚斯文朕獲紹先業謹遵聖訓禮樂交舉儒術化成實二后垂𥙿之所致也又曰為君之難由乎聽受臣之不易在乎忠直其或君以寛大接下臣以誠明奉上君臣之心皆由于正直而行至公相遇此天下之達理先王之成憲猶指諸掌孰謂難哉彭年曰陛下聖言精詣足使天下知訓伏願躬演睿思著之篇翰頃之以二論示彭年復請示輔臣旦等因請赴國子監刻石從之祥符解疑論祥符六年孫奭上言國家祠祀廵幸多用開元故事且明皇政治多缺非全德之君不可遵法十月丁丑上作解疑論示之因語左右曰國家勤稽古制止如今日之百官率多秦置豈可以秦暴而廢耶但詢之古道擇善而行何謂不可因言開元天寶政事優劣曰姚崇宋璟眞名相也明皇委之無疑誠為至當而過聽林甫國忠斯可惜也王旦曰奸邪之人誣害良善其言似忠人主難辨外人罕敢極言取禍故國忠林甫得以專横人君若能察好陷人而自進者十可見其七八唐室危而人歸唐德者頼祖宗仁愛浸厚也趙安仁述論疏為獻祥符皇王帝伯四論五臣論樂府文論實録祥符八年四月四日癸丑召輔臣觀書玉宸殿王欽若陳堯叟馮拯趙安仁預焉始觀太宗御書移御别殿觀皇王帝伯四論良臣正臣忠臣奸臣權臣五論幸水軒垂釣侍臣賦詩辛酉賜輔臣御製五臣論各一本從所請也九年二月癸卯召近臣登翔鸞閣觀太宗御書因示聖製太宗聖文神筆頌玉宸殿記五臣論樂府辭上作歌詩二篇命從臣賦詩宴玉宸殿聖製或刻石題板或朱黄書于石壁從臣祗誦聖藻莫測淵藴學士李維謂人曰讀五臣論大意賞良臣而樂善人也會要觀聖製樂府文論上曰朕著述唯以寓意豈敢工王旦曰披誦聖製神伏心解天禧思政論會靈觀銘元符觀頌天禧元年二月戊寅作㑹靈觀銘元符觀頌思政論召輔臣至龍圖閣示之仍出正説春秋要言清景殿書事詩庚辰中書樞密院上書蒙宣示思政論言已輟于述作專親政務望特頒睿制以廣風教九月丁巳以御製思政論正説賜輔臣近臣從待制李虚己之請也詩題十事歌戒三惑守官有箴思政有論御集有論九卷述一卷天禧三惑論天禧元年二月辛巳上作三惑論并歌續畫刻板摹本以賜輔臣仁宗乾興元年八月辛亥以三惑論賜輔臣天禧寛財利論天禧二年七月甲戌以樞密直學士李士衡為三司使罷陜西市米募民送京師如入粟法以售鹽及羊綱任民私市以足數關輔民大便説之上作寛財利論以賜之又出内藏錢二百萬以助經費其年十二月庚戌士衡請刻石本㕔從之天禧欹器論戒酒論天禧二年九月辛巳紀九月庚辰上作欹器論戒酒論稼穡倍登詩以示輔臣乾興元年八月辛亥以欹器論賜輔臣慶厯危竿論一作諭慶厯四年三月己卯帝御邇英閣出危竿論一篇述居高謹危之意顧侍讀學士丁度等曰朕觀書之暇取臣僚上言及進封事有可施于政治者書以分賜卿等度暨侍講曽公亮楊安國王洙等既拜賜因注釋其義從之元祐六年劉摯奏仁宗所録三十六事内危竿諭聖意以為人君處至危之地譬如危竿須用正直之木古人謂邪蒿人君不可食以其名不正況邪佞之人乎乾道用人論乾道五年十一月五日丁巳御書御製用人論賜宰臣陳俊卿等略云邪佞亂眞比比皆是知人則哲帝王所難哲王用人廣獨智以照臨稽衆論而遴選擇不厭精任不厭久俊卿對選德殿詔撰用人説今在集中與宸翰文異而指同孝宗之用人也郎陟郡勞臺登縣績武優轉級職待有勲課儒生以金穀角進士以弧矢嚴更迭之法以練才實躬臨遣之勤以達壅蔽朝士闕官乃除無需次之淹要郡留闕選才無輕投之冗黜贓吏之世賞進軍功於流内淳熙御製論六年十一月乙卯御製論數百言欲革取士用人之弊及信賞必罰之法俾輔臣宣示侍從上曰此唯欲戒飭臣下趨事赴功而已㑹要六年十一月一日宰臣趙雄等奏欲就堂中請侍從宣示御製上曰此論欲戒飭臣下趍事赴功而已雄等奏陛下訓教如此何啻迅雷臣等及中外大小之臣無不震懼七年五月一日御製艮石銘跋賜雄等淳熙原道辯八年御製原道辯曰以佛修心以道養生以儒治世愈之論從其跡而已文成以示侍讀史浩浩奏曰愈作是篇所主在帝王傳道之宗乃萬世不易之論聖學高明融㑹釋老使歸于儒末章乃自生分别大學之道自物格知至至于天下平可以修心養生治世無所處而不當何假釋老之說耶望陛下竄定末章則善矣侍講程大昌亦言之於是易名三教論孝宗輯敬天之圖頒恤民之詔反安南之象則旅􅋙之不蓄觀御苑之麥則無逸之先知乾文參乎典謨宸畫麗乎河漢嘉陸贄之忠藎采崔寔之達權製賛以美孝德之感作賦以闡造化之工歌詩以發規恢之雄述論以飭用人之道㫖義渾噩表裏六經臨策貢士命舉賢良東觀閲書西雍講禮足以宣其文甄拔将校砥練師屯細柳按軍射殿閲士足以鬯其武淳祐忠邪辯仁厚論闕御製記序唐太宗帝範序見文苑英華唐太宗御製述聖賦序見文苑英華又見賦類唐麟德殿宴百僚詩序王緯謝表手詔賜以皇太子所寫聖製麟德殿宴百僚詩序御製中和節詩序日月揚光風雲動色邁殷湯之晨露掩虞舜之薫風鸞鳯之勢鍾王莫儔掩鍾張之筆札竝虬鸞以飛動日月爛其光彩風雲蔚其氣色開元二十五年邢璹冊新羅上製詩序太子已下及百僚賦詩送之舊史唐聖教序雍熙聖教序志釋氏類元範注二帝三藏聖教序一卷太宗高宗兩京記玄奘與惠明靈潤等飜定六百五十七部太宗製三藏聖教序太宗序云三藏要文凡六百五十七部見文苑英華高宗為太子乂為述聖記並勒碑銘置慈恩寺浮圖永徽四年十月褚遂良書開元二十三年九月親注金剛經及修義訣雍熙三年十月戊午出御製新譯聖教序賜宰臣李昉等咸平二年七月壬寅製繼作聖教序仁宗述三寶賛以冠藏録唐高宗東殿新書序見承詔撰述唐玄宗道德經序玄宗道德經序撮其指歸雖蜀嚴而猶病摘其章句自河公而或略隨意所得遂為箋註唐玄宗孝經序見藝文孝經類唐玄宗六典序見典故類唐穆宗長慶宣明厯序見厯法類建隆應天厯序太平興國乾元厯序乾德元年四月作建隆應天厯序興國七年十月作乾元厯序開寶本草序開寶六年四月製重定神農本草序太平興國平晉記四年五月壬午劉繼元降己丑上作平晉賦及詩令從臣和丁酉以行宫為平晉寺上作平晉記刻石寺中皇祐五年三月甲子詔奉安太宗聖容于并州資聖院統平殿七月戊申謂輔臣曰并州四月二十二日奉安聖容仍以平晉記來上與車駕至太原城下之日同何其異也景德乾坤寶典序景德二年五月司天少監史序上四百一十七卷上作序景徳御製三記景德四年正月己未車駕進發丁卯至安昌熙三陵朝拜二月己巳次西京癸酉詔藝祖挺生之地建神御殿如啓聖院制度庚寅召輔臣於内東門觀太祖彈元壁初開寶九年太祖幸西都因行郊禮嘗戯彈於門之北壁其迹三存焉上覩之興感命有司設龕䕶之至是啓而觀焉辛卯發西京三月己亥至自西京三月乙巳召輔臣登太清樓觀書出御製太清樓新寫御覽書籍西京内東門太祖皇帝彈元壁二記王旦等請以副墨為賜許之甲子内出聖製太清樓新寫御覽書籍西京内東門彈元壁二月作朝拜諸陵因幸西京記賜輔臣人一本四月戊辰以御製御書三記賜待制尚書侍郎等從所請也八月丁巳遣使以御製三記賜兩制館閣羣臣從其請也十月乙巳御史中丞王嗣宗等表求三記副本王旦曰陛下性與天道發為聖文中丞掌蘭臺石室書願可其奏從之堯沈璧于河為握河記今尚書中候是也帝王世紀祥符封禪記序祥符元年十二月製封禪記序祥符泰山銘記泰山銘賛二年五月戊午出泰山謝天書述二聖功德銘玉女像記示輔臣十月丙午以御製泰山銘賛賜丁謂等九軸因請以御製泰山銘及九天司命天齊王周文憲王文宣武成王賛於朝堂宣示百官召近臣就三司觀之帝曰此但記一時事何足宣示宰臣王旦等固請從之尋分賜近臣翌日稱謝十一月壬子朔泰山太平頂磨崖刋聖製畢三年正月戊寅二十八日作觀新製泰山銘記周備書懐五言詩賜旦等属和祥符宸章集序冊府元龜序御製游藝集後序見前寶文統録序法寶録序祥符三年四月丁巳待制陳彭年上凖詔纂歴代帝王集正位十五卷閏位十卷帝作序賜名宸章集六年八月壬申作新修冊府元龜序丁亥又出御製法寳録序八年十月乙巳製先天紀序九年三月己酉作寶文統録序王欽若定道藏經總為目録賜名寳文統録易象既備文王作乎繇辭典誥既刪宣聖制其書序祥符諸王唱酬詩集序五年三月庚寅作共四首祥符聖祖降臨記五年十月戊午聖祖降臨于延恩殿己未札示中外庚申羣臣詣崇政殿賀晁迥等請改殿名及御製銘頌以章降格之慶詔曰可乃改延恩殿曰眞游十一月庚子御製聖祖降臨記及眞游頌以示輔臣焉明年二月丙寅召宗室觀眞游聖祖降臨之迹九年十月乙酉出聖祖篇翰等及降臨内記眞紀于龍圖閣示輔臣天禧三年六月戊申召宗室近臣等詣眞游殿觀像設仍賜御製聖祖降臨記人一匣云實録天禧三年三月戊午内出聖祖降臨内記四十卷示輔臣祥符資善堂記祥符八年十二月辛卯制授皇子慶國公忠正軍節度使壽春郡王九年二月十八日甲午詔元符觀太子就學新堂宜以資善為名因製記是年四月戊戌張士遜請以聖製資善堂記刻石堂壁從之皇子壽春郡王仁宗也天禧三年正月乙未朔上詣元符觀宴宗室于資善堂辛亥宴從臣召壽春郡王府官屬預焉出聖製資善堂記祥符玉宸殿記祥符九年二月癸卯召近臣于翔鸞閣示聖製聖文神筆頌玉宸殿記五臣論樂府辭遂宴于玉宸殿刋石翔鸞閣又作詩命從臣和玉宸殿葢上宴息之所中施御榻帷帳皆黄繒為之無文飾殿東西聚書八千餘卷上曰此惟正經史校定者小説他書不預見景德四年三月乙巳御集有序八卷記六卷慶厯觀文監古圖記慶厯元年七月戊申朔上命圖畫前代帝王美惡之事可為監戒者號觀文監古圖上自為記召輔臣至迎陽門觀之元祐五年五月范祖禹乞覽此圖皇祐三朝訓鑒圖序皇祐元年二月内翰李淑知制誥楊億編纂成十卷御製序皇祐大饗明堂記序皇祐三年二月九日製明堂記序御集有欽崇禋祀記三卷治平資治通鑑序四年十月甲寅翰林學士司馬光初讀資治通鑑神宗親製序面賜光令候書成日寫入又賜潁邸舊書二千四百二卷賜舊書不在此時今從帝學并書之詳見編年類崇寜辟雍記三年十一月御製紹興損齋記二十八年八日晦復古殿書御製損齋記蕩心侈目惑心害性者罔不掃除清心寡欲省縁薄費者奉以周旋揮毫弄墨眞草自如濃淡斜行茂宻如意未能忘情似賢乎已朝夕清燕視以自儆以漢武明皇為戒凡二百五十八字吏書賀允中請布之中外十月庚寅上謂宰執曰朕宫中嘗闢一室名為損齋屏去聲色玩好置古書經史其中朝夕燕坐亦嘗作記以自儆沈該等請降御札以啟廸在位於是内出碑刻一云親札石刻百本賜百官皆表謝又賜諸路監司帥臣及諸州學各一本上曰允中嘗于經筵問朕好道之意朕謂之曰朕之所好非世俗之所謂道也治道貴清靜故恬淡寡欲清心省事所謂為道日損期與一世之民同躋仁壽如斯而已當降出碑本賜卿等又惟比年侈靡成風如昏祭之類至有用金玉器者不可不戒於是降詔諭中外如上㫖羣臣言太宗評經史章聖思政論仁宗三十五條皆著國史請宣付史館一本云十月庚寅出是記示宰執因請頒于中外又以親札付史館㑹要作十一月非也高宗發為宸章雲漢昭囘裁詩樂以侑禋祀則十二篇涵風雅之妙記損齋以明鑒戒則數百言皆道德之辭高宗御製翰墨志闕乾道御製聖政序乾道二年九月御書御製光堯聖政序一云二年十月三日製序仍書賜㕘政蒋芾芾等請勒之秘府與河圖大訓並傳紹熙三年十二月四日進孝宗聖政先二日親製序仍書賜宰臣留正慶元六年二月二十二日進光宗聖政翌日製序書賜叅政臣深甫並刻石秘府紹定緝熙殿記見殿類寳祐資善堂記寳祐二年製資善堂記祖宗以仁厚為心法以問學為家法踐阼以來欽若往則謹刑有銘仁厚有論曷嘗一念不本乎仁敬天有圖緝熙有記曷嘗一息不敏乎學矧予元子穎悟夙成甫佩䚢觽良心純一善端之萌如泉始達迎之而充此其機也繼自今毋侗好逸毋邇宵人思閭閻之隱而毋為富貴所移念稼穡之難而毋為紛華所惑孝弟以為仁之本惻隱以充仁之端弦焉誦焉學之以聲禮焉書焉學之以事則德修而罔覺習貫而自然資善之益豈淺淺哉御製諭述唐金鑑述貞觀二年正月庚午帝著金鑑述以示侍臣其略曰至治未嘗任不肖至亂未嘗任賢任賢則享天下之福任不肖則罹天下之禍宣宗大中初令狐綯為翰林學士他夜召與論人間疾苦帝出金鑑書曰太宗所著也卿為我舉其目綯摘句舉此帝曰善朕讀此凡三復乃已綯再拜曰陛下欲興王業捨此孰先詩曰惟其有之是以似之本傳張藴古大寳箴云爰述金鏡窮神盡聖使人以心應言以行包括治體抑揚詞令政要太宗曰朕當保此三鏡以防己過又曰金鏡書御覽載此篇云金鏡述祥符奉天庇民述祥符三年上将祀汾陰王旦曰漢唐因巡幸行禮未有特祭陛下為民祈福不憚櫛沐上曰但兾民獲休祥於朕無憚謂近臣曰自十二月朔當食蔬食宰相再三請上曰太祖太宗每奉郊禋皆屏葷茹朕三祀圓丘悉奉行之顧外庭不知耳東封亦自戒塗蔬食十二月己巳遂作奉天庇民述以諭之脽壇行宫舊路在后土廟前上曰朕未謁廟廷而輿輦儀仗先過其前非夤恭之意遂令有司鑿路由廟後而出㑹要三年十二月己巳作示羣臣王旦等實録祥符三年十二月己巳上作奉天庇民述曰王者上承天下佑民在罄誠明而勿貳守典訓而靡忘況邦之大事在乎接神茍或接神而不恭何以為民而祈福祥符奉神述祥符四年五月乙未詔加上五岳帝號遣官奉册六月乙巳上作奉神述曰況惟此舉本用庇民在乎眇躬且絶私禱尚虞率土未照此誠乃牽課成文庶幾言志云耳七月丁亥資政殿大學士向敏中等請以聖製奉神述刻石遂親書刻石于奉神觀九年三月庚申丁謂請刻石于㑹靈觀從之書目一卷祀汾陰還述以諭中外皇祐五年正月觀火更名集禧六月觀成舊止西偏建一殿祠五岳名奉神殿命知制誥蔡襄重模故本仁宗拱立命襄追讀立石東廡名神藻殿仁宗實録天禧欽承寳訓述天禧元年正月辛丑朔改元謁玉清昭應宫薦獻玉皇上册寶壬寅上聖祖帝號己酉上太廟謚冊庚戌饗宗室辛亥恭謝天地于南郊御天安殿上冊尊號乙夘命宰相宣讀天書于天安殿遂謁玉清昭應宫二月甲戌上作宣讀天書欽承寳訓述示羣臣天禧元良述天禧三年九月二十三日丙子召宗室近臣對于清景殿内出御製賜皇太子元良述六藝箴各一卷承華要略十卷授時要略十二卷又以御覽國史兩朝實録太宗御集等賜皇太子命從臣徧閲之十二月辛卯賜輔臣元良述六藝箴各一卷承華要略各十卷帝範訓戒冠屨相絶又有元良箴禹典貽子孫文謨佑後人元者善之長慶厯觀文鑒古圖述見圖類書目仁宗御集有觀文鑒古圖述十卷仁宗康定二年即慶厯之元采摭前代君臣故實可為鑒戒者分列為圖隨事親述并序上始黃序夢帝賚弼下迄李唐褒忠賞直紹興五年閏二月丙寅上曰朕昨日見毛剛中所進鑒古圖乃仁宗即位之初采古人行事之迹繪而成圖便于省閲因以為鑒慶厯危竿諭見前皇祐欹器論後述見欹器類四年四月庚辰御邇英閣示講讀官先是眞宗作論上為後述以申進退存亡虧成之監丁度等請宣布于外上不許虞舜勅天之歌大禹臨民之訓成湯官刑之制炳燿千古若大風之安不忘危金鏡之任賢去不肖抑其次也仰觀俯察而日月之代明星辰之羅布山川之流峙草木之生息凡物之相錯而粲然不可紊者皆文也堯之蕩蕩不可得而名而僅可名者文章也夫子之言性與天道不可得而聞而所可聞者文章也然則堯之文章乃蕩蕩之所發見而夫子之文章亦性與天道之流行謂文云者必如此而後為至自伏羲所畫黄帝所名箕子所陳仲尼所繙微辭奥義意㑹心徹仰聖人而知衆説之小天臨日鏡鼓元氣而雷域中騰百川而雨天下仁覆徳載繼明嗣睿運陶釣於寳思英華渢渢馳仁聖之極摯蹈帝王之登閎徳高假樂聲繼猗那以武功定海内刮疵剔瑕乾清坤寧以文徳化天下驚潜燭幽雷動日潤戛切韶濩堯醲舜薰寳跗運思步障申戒細札之頒皇覽之作煥乎之文大哉之言天清地明日燭月霽赫赫我宋崇雅右文藩飾萬物如歳之春乾健離文雷動淵黙日暉川鏡乃武乃文樂華曾舉禮葉旁垂重雍襲熙玩心神明襟道佩徳軌堯矩舜䋲武衣言漢倬星煇天文昭囘八表皆燭睿藻稽古六經不刋慶霄分暉温洛開奥玉海卷三十二
