body:
  text: 玉海卷二百二宋王應麟撰辭學指南制門下云云具官某云云於戲云云可授某官主者施行唐虞至周皆曰命秦改命為制漢因之下書有四而制書次焉其文曰制詔三公顔師古謂為制度之命唐王言有七其二曰制書大除授用之學士初入院試制書批荅有三篇又詩賦各一道號曰五題後唐停詩賦白居易入翰林以所試制加叚祐兵部尚書領涇州韓偓試武臣授東川節度制此試制之始也舍人不試多自學士遷制用四六以便宣讀皇朝知制誥元豐改中書舍人召試中書而後除不試號為異禮所以試者觀其敏也試制詔三篇宰相俟納卷始上馬翌日進呈除目方下制限二百字以上成制限一百五十字以上成此即誥也詔限二百字以上成學士不試率自知制誥遷此科所試文體畧同政和辛卯始以制命題制誥詔書依例宰執進呈周益公所謂試言雖附於春官擬制實闗於睿覽凡命宰相三公三少節度使則用制麻樞宻使亦如之后妃東宫親王公主不以命題東萊先生曰制破題四句或兼説新舊官或只説新官如自資政殿學士提舉宫觀建節上兩句説提舉宫親下兩句説建節此兼説新舊官也若四句只大概説藩屏方面之意此只説新官也其四句下散語須叙自舊官遷新官之意如眷時舊徳肅侍燕朝之類制頭四句能包盡題意為佳如題目有檢校少保又有儀同三司又換節又帶軍職又作帥四句中能包括盡此數件是也若鋪排不盡則當擇題中體面重者説其餘輕者於散語中説亦無害輕者如軍職三司是也制起須用四六聮不可用七字制頭四句説除授之職其下散語一段畧説除授之意文臣自内出則説均勞佚之意武臣宿衛則説忠孝拱扈之意換鎮則説易地之意其餘可以類推然只是大槩説意不須説得太深謂如資政侍讀除河東經略建節制散語云眷軍民之重寄須文武之全才輟從鳴玉之近班昭示擁旄之異數式敷渙號誕告明廷是也又如熈河帥除檢校少保易節制云乃眷戎昭之大有嘉邊最之優宜増重其事權用疏榮於國典賁我明命敷于治朝是也若説狀太深則與後面相亂成重疊矣制頭四句四六一聮散語四句或六句不須用聮具官某一段頌徳先須看題文臣専用文臣語武臣宗室専用武臣宗室語不可互用非堯舜不陳安社稷為悅惟文臣可用甘陳兼六郡之良闗張號萬人之敵惟武臣可用天潢璿源大雅不羣之類惟宗室可用而先大槩説兩句然後子細形容如沈毅而膚敏端方裕和敏識造㣲懿文貫道風力肅明器資魁傑是也不可便使事引古人譬喻之類一段説舊官所謂叙舊官者非止叙前任也先畧説履歴不可指定官名但隨文武官泛説數句然後説前任如自資政侍讀建節資政侍讀是前任一段説新官於戲用一聮或引故事或説大意如太尉制説禮樂而敦詩書既備元戎之選戢干戈而櫜弓矢無忘懿徳之求此大意也引故事如將帥題説方叔召虎藩鎮題説召伯韓侯申伯之類後面或四句散語或止用兩句散語結不須更作聮恐冗制辭須用典重之語仍須多用詩書中語言及擇漢以前文字中典雅者用若晉宋間語及詩中語不典者不可用詩語雖不可用亦有可用者如杜詩特進羣公表制用羣公表亦無害魏晉以來文史中語間有似經語者亦可於制中用但其間名臣非人共知者不必稱引以為故事如吕蒙陸遜固有盛名終不必引除帥制具官後説新除處須畧説地望只須四句如眷乃荆南應于鶉尾之類建節不須説本鎮地望謂如越帥須説越州地望若鎮東軍節度使則不須説官名須於職官分紀尋替換字如尚書為中臺吏部為選部禮部為儀曹似此類須每件尋兩三般葢臨時有聲律虚實之不同也郎曹以下不必記非從官而記者止卿監司業節鎮須記地名每鎮須地名兩三件若止記一件恐聲律虚實不同難作對也亦止是記在境内者每常多記州名如越為鎮東湖為昭慶是也然州名亦不須記但云鎮東乃㑹稽昭慶乃霅水可也葢制中惟用地名州名無用處耳節鎮名若恐難記則以一字相從如武字安字昭字逺字各作一處甚易記節鎮賦東自梓定劍南東川潼川府西從益求西川成都府東載名於峴首山南東道襄陽府西次立於梁州山南西道興元府河陽盟津河陽三城孟州東得太原之壮河東太原府淮南揚土淮南揚州荆無郢渚之憂荆南江陵府節建閬中軍名安徳閬州興居齊土成處鎮土濟南府真定府彰曰鄴國昭為潞國相州隆徳府華原沮水宜多所感之人耀州武陵桃源是謂有常之域常徳府寧海鎮海杭都益都臨安府青州陸本在於臨汝汝州清實莅於畨禺廣州曰横瀛兮乃景城河間之地滄州河間府曰平靜兮為清源瓊管之區泉州瓊州載惟䕫國之名也實自寧江而肇于䕫州鎮靜無譁豈京口桂林之異鎮江府靜江府定平不擾無尋陽吴會之殊江州平江府定彼馮翊護彼河中同州河中府寧于宣城安于鉅鹿寧國府信徳府奉鄞水兮國次五位慶元府慶襄邑兮保先五福拱州東陽咸謂於寧土婺州鄜畤允為於大麓鄜州乃順洮陽洮州乃成府谷府州房陵康矣房州平由陜郡之臻陜州符離靜焉宿州信自合肥之篤廬州武以昌始地惟鄂强鄂州南陽黔中武信武泰鄧州紹慶府滑臺洋川武成武康滑州洋州入中山而衆則皆定中山府服均陽而彼烏敢當均州或秦雄而遂信秦州遂寧府或邕建以延彰邕州延安府威著長樂福州忠聞許昌潁昌府寧有後先徐州武寧利州寧武在徐土葭萌之地安分上下冀州安武潭州武安据信都嶽麓之疆鎮七其名越自東先紹興府洪次于南麟由西併隆興府麟州安居陳國之位淮寧府寧秉澶淵之柄開徳府洮熈河而熈以名著熈州潼華隂而華焉域正華州瀘濬别州瀘平川泳瀘州瀘川濬州平川昭安彰之三化淯水宻涇金州宻州涇州興泰奉之三寧彭原兖鄭寧州襲慶府鄭州遂普二安嚴劍從命嚴州隆慶府淮建二康蔡昇嚮風蔡州建康府彰曹南崇漢東而昭具信贛興仁府彰信隨州崇信贛州昭信安鄖國寧容管而清兼逺融徳安府安逺容州寜逺副州清逺宜作慶始宜為逺終宜州慶逺陽安化之郡内慶州慶陽源欒城之域中趙州慶源犍為湖亳以及康嘉昭集永嘉定府安吉州亳州徳聚府巴郡端舒而暨蜀重肇安崇恭州重慶端州肇慶舒州安慶蜀州崇慶岳岳陽而順昌汝隂岳州岳陽順昌府順昌光光山而鳯翔好畤光州光山鳯翔府鳯翔寧建富沙雄建晉國建寧府建寧平陽府建雄天平鄆城凉平隴坻東平府天平渭州平涼然則永興長安嘉興檇李而忠正下蔡焉京兆府嘉興府夀春府靜難終居於邠水邠州承宣使建節則云繇丨丨承流之秩新丨丨啟鎮之儀易節則云出丨丨之新組上丨丨之舊麾國名大國趙不封晉大宗不封秦齊魏韓真宗欽宗不封燕楚魯梁不封宋不封陳吳越夏商周漢唐昇仁宗不封冀豫兖荆雍揚徐鎮益理宗不封鄧邠潭凉鄆蜀髙宗不封次國衛鄭蔡曹不封許代瀛慶仁宗不封岐隨宻邢夀真宗不封潞不封蘇定欽宗不封相廣延不封婺涇福宿華小國江滕向黄紀譙原弦祈鄶耿舒不封介道酆蔣蕭郕譚霍萊郇鄅鄎戴桐遂管沈虞應息英寧宗不封任崇榮扈濮巢觀不封安申虢邾杞賈鄫䢵巴夷榖頓麋黎葛蓼項那䢴茅胙庸畢滑不封鄀牟權甘祭尹温毛樊成單劉鞏邵邶鄘韋鬲甯杜吕皖留郃鄠郿焦宛鄼穰葉郢鄢緡劇費繒郚隴范程鄱鄃潜涪遼嬴絳汲梧軹營翕秺藺易鄗洮澤昌翟陸淄卞綸廬翼鄒房褎康髙宗不封沛邳彭竇鄂鄴薊潁神宗不封汧沔沂肅岷郳鄯葉順渝郫蒲𤭔豐棣光神宗儀懐永盛濟信義寧徽宗襄真宗不封均哲宗睦丹思簡忻韶嘉寧宗不封端徽宗不封循恭光宗不封愿雅通䖍資昭欽珍溆集和衡㑹撫岳袁桂蘄澧深洋建孝宗不封鄜瓊茂衢澶徳吉景彬博賀惠潤莒郯䕫芮薛鄖鄣羅郜郡名列聖潜藩王之郡八夀春仁淮陽神延安哲遂寧徽京兆欽廣平髙普安孝平陽寧公之郡一鉅鹿英四京河南西京睢陽南京魏郡北京節鎮北海青宗髙髙宻宻濟南濟南欽宗英宗魯郡襲慶太宗彭城徐宗寧濟隂興平徽宗東平東平哲宗襄陽襄陽欽宗真宗漢東隨安康金房陵房滎陽鄭宗髙靈河滑祖太汝南蔡淮寧淮寧神宗汝隂順景神宗澶淵開徳徽宗景城滄信都冀宗髙常山真定鄴郡相州博陵中山欽宗河東河中陜郡陜馮翊同祖太華隂華華原耀新平邠洛郊鄜扶風鳯翔天水秦安定涇臨洮熈宗光太原太原上黨隆徳徽宗平陽平陽寧宗太宗新秦麟廣陵揚宗真譙郡亳宗髙符離宿廬江廬餘杭臨安會稽紹興吴郡平江徽宗丹陽鎮江徽宗吴興安吉東陽婺奉化慶元寧宗建康建康仁宗宣城寧國孝宗豫章隆興孝宗南康贛長沙潭江陵江陵真宗江夏鄂宗欽安陸徳安神宗蜀郡成都梓潼潼川雲安䕫黔中黔紹慶理宗益州利洋川洋建安建寧度宗孝宗清源泉南海廣始安靜安髙宗普寧容漢中興元閬中閬永寧邕武當均宗寧河間河間同安安慶寧宗武陵常徳孝宗弋陽光宗神新定嚴祖太宗髙宗太潯陽江巴陵岳宗英唐安崇慶髙宗瀘川瀘普安隆慶孝宗髙要肇慶徽宗融水融龍水宜宗度南平重慶光宗犍為嘉定寧宗防禦琅邪沂東牟登東萊萊濟陽濟富水郢臨汝汝博平博文安莫平原徳河内懐汲郡衛饒陽深訊陽隴絳郡絳雁門代蘄春蘄厯陽和宗孝通義眉象郡象團練濮陽濮碣郡單滏陽磁蒲隂祁同谷同慶成理宗河池鳯和政西和大寧隰定襄忻山陽楚東海海鍾離濠南充順慶果理宗景陵復軍事淄川淄清和恩安化慶陽軍仁宗慶虢郡虢上洛商彭原興寧軍徽宗寧中部坊咸寧丹隴西渭平凉原武都階安鄉河金城蘭西河汾髙平澤臨海台縉雲處齊安黄毗陵常永嘉温宗度信安衢新安徽池陽池鄱陽饒上饒信廬陵吉宜春袁臨川撫衡陽衡江華道零陵永祖太桂陽彬邵陽寳慶理宗澧陽澧夷陵峽巴東歸盧溪辰潭陽沅濛陽彭巴西綿徳陽漢永陽滁臨卭卭漢源黎盧山雅通化茂陽安簡維川威資陽資安岳普昌元昌南溪叙巴川合和義紹熈光宗榮隣山渠清化巴隂平文順政興咸安蓬江油龍通川逹清江施南賔忠宗度南浦萬盛山開臨汀汀始興韶涪陵涪漳浦漳劍浦南劍海豐循潮陽潮連山連臨賀賀臨封封新興新恩平南恩平樂昭蒼梧梧感義藤潯江潯懐澤貴宗孝龍城栁安城賔寧浦横陵水化高凉高海康雷寧越欽鬱林鬱林合浦廉海陵泰宗英臨淮泗郡名亦須記恐萬一制中帶郡王郡公之類記境内所尹牧隨領節鎮宰相制固當理㑹然近例亦未嘗出亦在面前易理㑹姑後之作制只讀今時程文則或委靡専學前輩文字則或不合今之體制要當用今體製間取古人屬對親切衆所易見者依倣之可也其他皆然當作一冊編四六制頭可用者作一處襃辭可用者作一處於戲可用者作一處又當細分門類如文武宗室各從其類鎮洮軍節度使除大尉制孫覿門下价藩經武久資戎翰之良帥閫疇庸增重本兵之寄此制包盡前後任又下語穏眷余哲艾惟國老成艾老似重疊敷告路朝誕揚褒律具官某才堪大受學富多聞沈謀有先物之幾居簡得鎮時之望頌徳處更當一聮出際明良之會具宣夙夜之勤勱相我家定訏謨而入告修和有夏迪彛教以來宣維陜服之奧區宅洮河之巨屏宅字未安齋壇推轂俾専閫外之權幕府運籌旋迪師中之吉令聞令望屢達余聽望字不當用側聲懋官懋賞實允僉言申加徽數之隆褒進武階之長神旗豹尾對三接以疏榮虎韔鏤膺總十連而敵愾盡䕶諸將作屏大邦此制除上數件皆可發明為今格如沈謀二句及勱相齊壇二聮皆可為法於戲説禮樂而敦詩書既備元戎之選戢干戈而櫜弓矢無忘懿徳之求凡下語臨了一字須要來厯不可杜撰如懿徳之求葢詩有我求懿徳也益壯逺猷服我休命可皇叔慶逺軍承宣使授昭化軍節度使封安定郡王同知大宗正事制洪遵門下立愛而始家邦式舉庸勲之典修徳以固宗子有嚴紏族之權乃睠懿親宜參重任下參字謂同知大宗正也爰錫將旄之峻仍頒王爵之隆諏日涖朝揚廷孚號具官某温良而恭儉肅括而洪深周旋中其威儀其字未安造次必於儒雅閱天下之義理卓爾不羣誦古人之詩書介然有守蚤由迪簡多所踐揚備宣衛杜之忠寖服承流之寄維持王室顯顯為世豪英標的天枝挺挺有祖風烈屬宗盟之闕長疇肺附以求才載惟老成無踰叔父庸極褒崇之禮併昭篤叙之恩植纛建牙宅淯陽之巨屏苴茅胙土畫涇水之奧躔蔽自余衷諧於僉論此制不説前任承宣使鎮名葢當時不以此去取今須説鎮名不然則為忘記出處於戲以薛侯為後將臻磐石之安非劉氏不王實賴維城之助勉思董正奚俟訓辭可觀文殿學士江南西路安撫大使授永興軍節度使開府儀同三司都督川陜荆襄路軍馬制王壁門下總十連而建屏克彰敵愾之功䕶諸將以統戎宜董幹方之任肆疇庸於祕殿爰錫命於齊壇均華揆路之崇増重和門之寄誕敭顯冊孚告治朝具官某識度恢宏性資英特素藴經綸之業雅存康濟之心有貫穿百家之學而守之以中有酬酢萬變之才而持之以正自擢居於嚴近益茂著於猷為從容禁闥之間允矣論思之効宻勿巖廊之上偉然弼亮之謨此制可以作格但有不合格者如云云此是隔對却似四句散語須似四六聮可也頃均逸於政機葢以前任觀文殿學士意料必是執政必如此説破亦得遂出臨於江表阜民而袴襦興詠經武而組練有容曽未淹時亟聞報政牧人御衆已觀綏逺之能推轂授師更賴折衝之畧凡制説前任處必帶説除授之意觀此制可見不然則有斷續之患是用度崤函而啟將鉞連秦楚而總兵麾大纛髙牙式表元戎之盛伍符尺籍兼持數路之權復視儀於三槐復字未安俾宣威於四國宜固連衡之勢以式遏於㓂攘庶成恢復之勲迄綏靖於土宇今不須如此須如前制盡護諸將作屏大邦或如後制益重和門之寄用昭將鉞之光之類是也於戲興衰撥亂朕方勵志於丕圖保大定功汝其克勤於逺馭伊我舊徳奚俟訓辭可安逺軍節度使龍神衛四廂都指揮使御前諸軍統制特授太尉殿前副都指揮使制莫冲門下鎮帥閫以宣威夙領連營之重冠武階而命秩式隆環尹之權眷言禦侮之英宜舉疇庸之典誕敡號厲允穆師虞號厲須對師虞對師言則不工具官某果毅而不羣沈深而有守氣節禀金行之勁夷視險艱韜鈐傳玉帳之奇灼知權變蚤登勇爵屢奏膚功宣力四方殿价藩而維翰盡護諸將肅師律以無譁宣力對盡䕶未工方當息民繼好之時顯著厭難折衝之望恩加卒伍得平世撫衆之宜義洞神明挺忠臣盡心之節惟嘉績之既懋豈褒律之敢稽是用擢從廂部之聮參領殿巖之峻以其副都指揮使故用㕘字彫戈金印列五府以在庭徼道章溝總千廬而飭衛益重和門之寄用昭將鉞之光於戲漢置南北軍示不忘於武備唐分左右衛迺肇列於府兵武備對府兵未甚工皆倚重於將臣用増隆於國勢徃體設官之意益堅衛上之誠可陸韶之制不蹈襲甚得體但起頭以今格論之則不能盡見題王日嚴一篇極有工夫但江山之秀間值偉人是當時諂語制中散語不可四句相似如兩句用之字則下兩句用以而字可也不然則上兩句之字在第五字下兩句之字在第四字亦可西山先生曰辭科之文謂之古則不可要之與時文亦夐不同葢十二體各有規式曰制曰誥是王言也貴乎典雅温潤用字不可深僻造語不可尖新制詞三處最要用工一曰破題要包盡題目而不麄露首四句體貼二曰叙新除處欲其精當而忌語太繁推原所為之官除授之意用古事為一聮尤好如莫侍郎步軍制法黄帝之兵允賴為營之重資漢人之技莫如用步之强最妙三日戒辭於戲而下是也用事欲其精切須要古事或古語為聮切於夲題有丁寧告戒之意如傅景仁少保侍讀用説命周官周子及揚師制用撃楫中流陳自明宗室觀使制用秘書仙圖此等事既親切而造語妥帖是為可法三處乃一篇眼目燈忩平日用工先理會此等三處場屋亦然三處占工既多則他處不逮無害如三處弱則他有妙語無益三處稱停適當則一篇工夫十占其六七矣考官去取亦多以此較優劣不可不知至於具官某以下謂之褒辭文武宗戚皆可豫備則差易耳若夫褒辭則亦須切當文武宗室各用得體平時先要準備頌徳與中間入題處併戒辭皆宜豫備臨時未必安排得整齊也前輩制詞惟王初寮汪龍溪周益公最為可法葢其體格與場屋之文相近故也其他如王荆公岐公元章簡翟忠惠綦北海之文亦須編玉堂集自建炎至淳熈制詞具備亦用詳看葢凡用事造語皆當祖述故也官制本未不可不精考謂可以出題者文武臣自宰臣樞宻使以下須帶三少太尉開府檢校三少節度使方可出制且以三衙論之要見置於何時與夫制度之沿革名號之更改悉用究知此草制之大綱也地理不過九域志通典官制不過職官分紀併它書可用者亦須隨事編入此乃工夫之最急者此外只記編題足矣不必汎觀步軍制畧舉此一篇為準其餘皆當然破題總徒兵於千列中間資漢人之技莫如用步之强戒詞用荀吴崇卒之智經史中步兵事殊少如李陵步卒之類又不可用只有徒兵左氏傳歩技晁錯傳崇卒左傳等事顯煥人所共知徒兵字尤雅故用於破題此三處安頓皆適宜可以為法向時試馬軍帥制用萬騎於破題用羽林元武於中間用羣騶事於戒詞正倣此也葢馬軍體字有騎兵騎旅驍騎勁騎駔駿等皆不如萬騎雅馴又天子千乗萬騎便見得侍衛之帥羽林是漢之騎兵事見後漢百官志元武屯營是唐之騎兵事見唐兵志皆是天子宿衛之兵惟羣騶是諸侯事故用之末聮上既有整六師以修戎則下一邉雖諸侯事無害同時試者葢有便用六騶羣騶於破題此大不可也文臣領藩府如建康成都紹興凡係帥藩之地皆當考究其地理如建康龍蟠虎踞益州天險會稽北枕淛河洪都星分翼軫之類通典及歴代地理志九域志皆可考又有散見傳記間者如龍蟠虎踞見於諸葛亮傳此等須撿尋編入武臣領都統制駐劄之地如沔州興元金州江陵鄂州池州江州鎮江等處亦當如前法若平時不曽考究則臨期未免差誤且如上流二字惟蜀漢荆鄂可用至於江池則已難用甚至有用之建康隆興者尤可笑也見行程文為格外更將前輩制詞如張樂全王荆公岐公元厚之東坡潁濵曽曲阜王初寮汪龍溪綦北海周益公所作裒集熟讀則下筆自中程度矣然場屋擬制與敡庭之文又不同須全依定格後村聞之西山曰某掌制每覺文思遲滯即看東坡汗漫則看曲阜野處洪公䞇所業書曰昔丁文簡公未遇之日手其所為制誥一編䞇諸王公大人之門人見者皆非之丁獨毅然不顧曰異日當有知我者其後直掖垣登玉堂以至政地而昔日所為文始盡得施用有志者事之竟成如此中書舍人召試制今存一篇以見體式保和殿大學士除武安軍節度使中太一宮使兼侍讀制韓駒門下秘殿宸居論思周衛之内雄藩大鎮折衝樽俎之間奉琳館之宴閒備金華之勸講敷求畯徳允穆師言咨爾造庭聽余作誥具官某體莊而資裕器介而用通以直方大之才從果藝逹之政有貫九流之學而守之以彌約有參三徳之行而輔之以克勤頃疇休譽之隆進履大僚之服秩冠内朝之峻禮陞公府之崇而能慷慨陳謀沉深善斷子公料敵揚鉤深致逺之威充國上書守保勝安邊之䇿朕欲付方面以試其撫綏之畧留中禁以資其獻納之言宣方叔之壯猷遂蕭生之雅意又况威逺夷而授節豈輕分閫之權闡大道以明民尤重殊庭之選雖委旌旄之重尚聮帷幄之華併舉徽章式昭異數於戲求多聞所以建事祀太一所以祈年秉鉞専征已極元戎之貴執經侍問更髙儒者之榮尚克邁於前修以對揚於休命可謝景思曰林適召試除節度使制云無怠無荒以來王朕敢忘於謹徳有嚴有翼而共武爾無替於懋功寳祐四年詔藩鎮潜藩為正任遙領者令釐改太祖遂安後定國成忠武義成改武太宗建雄遂安㤗寧真宗山南東道南忠正荆南淮仁宗建康慶陽忠正英宗興徳安國岳陽神宗安逺順昌忠武光山哲宗彰武武當天平徽宗彰信武信肇慶興寧鎮寧昭徳平江鎮江欽宗定武永興武昌東興徳山南髙宗定武集慶鎮海建雄遂安安國慶源安武靜江永慶奉寧崇慶孝宗常徳鎮南建寧寧國普安保慶光宗鎮洮重慶寧宗嘉慶武寧奉國安慶理宗武㤗度宗慶逺鎮南崇慶遂安紹興八年趙鼎忠武淳熈十六年郭師禹興徳皆以潜藩改命紹興壬戌紹熈庚戌制題皆有可疑安定郡王南渡後率取燕王宫一族老為廉車膺茅土豈有未襲王爵而先為承制稱皇叔者政和改官制以太尉為武選一品之銜序執政之次又以掌武之嫌罕復以授宗英炎興以還葢絶無焉每自檢校官即拜視儀寧以三少序進為少迂以代此一階則太尉為宗室制題尤非也武昌為欽宗潜藩近制醴泉多授前宰臣而宗盟率領萬夀倪正父曰文章以體制為先精工次之失其體制雖浮聲切響抽黄對白極其精工不可謂之文矣凡文皆然而王言尤不可以不知體制龍溪益公號為得體制然其間猶有非君所以告臣人或得以指其瑕者如伊如周雖是人臣以其所行非人臣常事便不敢援引則上之喻下貴於簡易嚴重非其才强其事自為之短拙呈露假手他人則山林之作施之廊廟駭矣考王次春應制科所撰制詞謂皇叔祖為前朝之叔父官傳以為笑陳晁以道謂今之學者扇對外無文章自修試詞科擬制一語聱牙被黜周益公初對玉音云向在王邸見卿詞科擬制雅宜代言不旋踵遂兼三字其後兩入翰苑首尾十年朱文公曰范厚夫作冀王制云周尊公旦地居四輔之先漢重王蒼位列三公之上及我仁祖加禮荆王顧惟冲人敢後叔父自然平正典重彼工於四六者却不能及後村劉公曰四六家以書為料料少而徒恃才思未免輕疎料多而不善融化流為重濁二者胥失之李公父欲應詞科西山指竹夫人戲曰試為進封制可乎公父末聮云保抱攜持朕不安丙夜之枕輾轉反側爾尚形四方之風西山稱賞王器之京東淮東宣撫制戒詞云沿于江而逹泗朕方恢禹之九州率彼浦以省徐爾尚勉周之三事端平乙未制題襄陽帥除鄧州葢承平時帥臣治鄧迂齋樓公曰經句對經句如在武丁時作召公考惟汝一徳于今三年天惟顯思民亦勞止有能奮庸爰立作相經營四方飲御諸友之類固是天造地設若萬人留田對三事就緒雖以史句對經句緣有氣勢所以不覺攻媿樓公曰駢儷之體屢變作者爭名恐無以大相過則又習為長句全引古語以為竒倔反累正氣一聮或至數十言識者不以為善惟龍溪北海追還古作謹四六之體北海督府訓辭尤為宏偉有曰盡長江表裏之封悉歸經畧舉宿將王侯之貴咸聼指揮水心曰荆公取經史語組綴有如自然謂之典雅自是後進相率效之白樂天裒類制詞事語為制州一卷以備撰述之用李漢老曰張樂全髙簡純粹王禹玉温潤典裁元厚之精麗穏宻蘇東坡雄深秀偉皆制詞之傑然者題雄武軍節度使開府儀同三司除侍中政和辛夘保大軍節度使授檢校司徒充保平軍節度使壬辰資政殿學士除奉寧軍節度使癸巳鎮洮軍節度使除太尉甲午鎮海軍節度使檢校少保開府儀同三司授檢校少傅加食邑乙未