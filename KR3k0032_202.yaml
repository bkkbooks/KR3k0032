詔唐封敖作慰邊將詔曰傷居爾體痛在朕躬賜李徳裕制曰謀皆余同言不他惑李徳裕草詔賜王元逵何弘敬曰勿為子孫之謀欲存輔車之勢皆切中事情本朝錢若水草賜趙保忠詔曰不斬繼遷存狡兎之三穴潜疑光嗣持首鼠之兩端汪彦章草賜髙麗詔曰壞晉館以納車庶無後悔閉漢闗而謝質非用前規東萊先生曰詔書或用散文或用四六皆得唯四六者下語須渾全不可如表求新竒之對而失大體但觀前人之詔自可見散文當以西漢詔為根本次則王岐公荆公曽子開詔熟觀然後約以今時格式不然則似今時文䇿題矣西漢詔中語如吏獨安取此皆秉徳以陪朕之類當勾抹出規訪之李漢老曰兩漢詔令温厚雅馴或人主自親其文周益公曰荅皇子詔用卿字非是前輩知體則不然其他或汝或王或公皆當有别吴兹與詹叔羲詔皆得體西山先生曰王言之體當以書之誥誓命為祖而參以兩漢詔冊朱文公曰三代訓誥誓命皆根源學問敷陳義理兩漢詔令詞氣藹然深厚爾雅可為代言之法南豐曰漢詔令典正謹嚴尚為近古唐常衮楊炎元稹之屬號能為訓辭其文未有逺過人者朱文公曰國初文章皆嚴重老成嘉祐以前文雖拙而辭謹重所以風俗渾厚謝景思曰開寳幸西京詔曰籩豆陳有楚之儀黍稷奉惟馨之薦不以籩豆有楚對黍稷非馨時人許其裁剪起句云定鼎洛邑我之西都燔柴泰壇國之大事周益公擬加上尊號詔其頌太上皇帝云以徳行仁本性誠之固有修文偃武合經緯之自然太上皇后云月齊日以得天而能久照坤順乾而配地是以廣生上再三稽奬謂數句用經語該括明備非卿不能為真大手筆也英宗謂輔臣曰學士惟王珪能為詔百倪正父為上夀皇聖帝夀成皇后尊號詔云率官若帝之初丕講非常之禮於萬年受天之祜聿迎滋至之休詔用散文戒中外臣僚各専職守詔曽子開政事堂試朕惟公卿大夫以至百司庶尹外則岳牧守長迨于丞掾各有分守不相侵踰則小大之務罔有不舉逺邇之民罔有不治乃者先帝大正官名始自三省以及寺監使循其名者必效其實至於監司州縣亦各處之有法越職犯分必罰無赦而近日以來上下内外名分不謹相師成風豈朕所以追述先志董正治官之意哉夫尸祝代庖古人所戒思不出位易著為法故以虞舜之盛九官之賢而職教者不使典刑治禮者不使主樂豈其人材之不能兼哉以謂任之専然後可以責之備也凡爾在位其聼朕言各盡乃心以祗厥叙毋習浮競以干利取寵使百工允諧庶績咸熈以承先帝作則垂憲之心副余一人責成仰治之意豈不休哉詩不云乎靖共爾位好是正直神之聼之介爾景福順此有賞逆此有誅朕方操賞罰之權以御天下布告中外母忽朕指戒飭江淮京湖四川制置使詔髙瞻叔朕嗣承丕緒思濟多艱三垂以遽令聞夕惕若厲亦惟良邊垂之臣是信是使圖即敉功乃兹裔夷荐食上國我師征役不休終莫能一大治之今復厭犯王畧整居于我土地卿等分制閫外利害决于一瞬此正日戒之秋而可緩圖乎盍思所以申儆軍實深加意防報聞必惟其實賞罰必惟其公察其聲東擊西之謀防其却走復來之詐集艦騎以備水陸逺斥候以防窺闖合力以應援必相為撃蛇首尾之勢睦鄰以同仇必相為捕鹿掎角之謀毋虚誕以邀功毋故縱以嫁禍委地棄民而嬰城自守非夫也崇讎封㓂而曲行避敵非勇也典聽朕言以圖敵愾此厥不聽惟予汝辜詔用四六戒諭中外百僚詔洪野處朕焦勞圖乂旰昃忘疲念一日萬幾懼難専於聽斷惟百司庶府正有藉於謨明冀勤王職之共式免天工之曠如聞在位曽是弗思恬茍且以成風樂因循而翫嵗奔競之習益熾而不反誕謾之態相高而自賢熈熈皆為利而來蹇蹇失匪躬之故既食焉而怠事豈公爾以忘私嗟今之人視古有愧昔舜咨百揆和庶政而萬國惟寧周建六官倡九牧而兆民允阜葢聖王制世而御俗在臣下宿道而鄉方逺圖者忠更化則治克用三宅三俊朕既灼知乃惟一徳一心爾宜勵翼各協恭而底績當懋賞以勸功欽乃攸司或戾成王之誥儆于有位必申湯后之刑咨爾周行體予猷訓原貸盗賊許以自新各令復業詔真西山朕以眇身君臨方夏明有未燭徳有未孚頃緣誤國之臣妄動開邊之釁科役煩重人不聊生旱蝗頻仍吏不加䘏使吾赤子多轉徙以無依而彼姦民因誘怵而為暴靖言致㓂敢昧責躬近而盱楚兩郡之間逺在江湖數邑之地生齒或遭其蹂躪屋廬或至於燬焚惕若興懐為之旰食今禁旅揚威而並進鄉豪戮力以爭先震疊無前蕩平有日言念脅從之衆豈皆好亂之氓弄璜池之兵諒非爾志烈崑岡之火亦豈余心與其假息以偷生孰若轉禍而為福在昔乾道淳熈之際有若李金陳峒之徒雖暫結於蜂屯卒莫逃於鯨戮自有宇宙至于今日未聞盗賊得以全軀想惟爾衆之習知豈待朕言而後諭今則宏開禁網誕布寛書推予不殺之仁畀爾更生之路儻復舊業即為良民棄兵弩持鉤鉏茍知舍逆而效順問田疇卜居宅當俾去危而即安尚惟郡縣字人之官共宣朝廷惠下之澤亟除民瘼庸副朕心舉賢良詔周茂振昔漢設賢科欲聞大道之要唐開制舉以待非常之才沿及本朝參用前憲故所得多天下豪傑之士而所言皆國家治亂之端其在當時豈云小補朕自紹履休運旁招雋能圖治功者逾三十年猶懼有闕下郡國者已八九詔未見其人屬當大比之期敢廢祥延之舉凡兹邇列各為明揚俾褎然而造庭將諏爾以當務必有崇論宏議可行於今庶幾博聞遐觀無愧於古題誡諭三省樞宻院修舉先朝政事紹聖乙亥誡諭士大夫名節丙子誡諭學者辭尚體要丁丑誡諭轉對臣僚言事要切丁丑别試誡諭守令勸課農桑建中靖國辛巳誡諭百官修舉職事崇寧壬午誡諭諸監司奉行詔令丙戌誡諭提舉學事司推行教法詢究行能大觀己丑誡諭百官遵守熈豐法度宣和壬寅誡諭將士協心戰守建炎戊申慰諭川陜紹興戊午詔此題始曰令侍從給舎臺諫舉㢘景定辛酉辭學玉海卷二百二
