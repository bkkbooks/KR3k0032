body:
  text: 玉海卷一百五十三宋王應麟撰朝貢外夷來朝內附唐龜兹入朝康國請臣傳龜兹高祖受禪王蘇伐勃駃遣使入朝貞觀四年獻馬賜璽書撫慰二十一年兩遣使朝貢天授三年王延田跌來朝開元十八年王孝節遣弟孝義來朝泥婆羅貞觀二十一年遣使入獻渾提蔥永徽二年又來入貢喝盤陀後魏太延中始通貞觀九年遣使來朝開元中破平其國置蔥嶺守捉安西極邊戍也康國本康居之裔武德七年始遣使來獻貞觀五年遂請臣太宗曰朕惡取虛名害百姓卻不受會要云武德七年其王屋木支獻名馬貞觀九年七月獻師子顯慶二年列為康居都督府以其王拂呼縵為都督開元初獻鎖子甲水精珠天寶十一載十三載朝貢東曹者漢二師城地武德七年七月與康居國遣使入朝其使曰聞秦王神武欲隸麾下西曹者隋時曹也武德中入朝天寶元年王僕羅獻方物封懷德王四載願受調發佐征討中曹武德中貞觀間八年十二月數獻方物顯慶三年以為大宛都督府開元初封為石國王二十八年又册順義王天寶初朝貢寶應二年大厯七年遣使朝貢彌末顯慶三年為南謐州授其君刺史開元時獻璧舞筵師子十八年首領末野門來朝何國即康居附墨城地貞觀十五年遣使入朝永徽時請輸糧佐西討以地為貴霜州寧遠本拔汗那顯慶初朝貢三年以渴塞城為休循州都督開元二十七年其王助平吐火仙册拜奉化王天寶三載改其國號曰寧遠十三載王忠節遣子薛裕朝請留宿衛習華禮授左武衛將軍事唐最謹吐火羅在蔥嶺之西貞觀九年五月入獻永徽元年獻駝馬顯慶中會要龍朔元年授其王月氐都督後二年遣子來朝神龍元年遣弟來朝留宿衛開元八年獻名馬十二年獻胡樂唐西突厥內屬傳曷薩那遁歸長安武德元年十二月封歸義王以大珠獻帝不受拔關可汗武德元年內屬賜號二年七月乙酉統葉護可汗遣使入貢莫賀設武德時來朝太宗與盟約為兄弟貞觀四年泥孰立遣使詣闕帝詔鴻臚持節册號咄陸可汗賜鼓纛弟同俄設立歲三遣使奉方物阿史那彌射貞觀中舉所部處月處蜜等入朝拜大將軍步真亦與族人來朝及平賀魯皆為可汗得補所部刺史以下通鑑貞觀十五年西突厥沙鉢羅葉護可汗遣使入貢七月甲戌命張大師持節立為可汗賜以鼓纛唐契丹入朝傳契丹本東胡種其君大賀氏武德中其酋孫敖曹與靺鞨長突地稽俱遣人來朝後二年二月丙戌君長遣使者上名馬豐貂貞觀二年四月丙申摩會來降明年摩會復入朝賜鼓纛由是有常貢二十二年十一月庚子內屬見都督類開元二年李盡忠從弟失活來歸賜丹書鐵劵後二年五年十一月丙申與奚長李大酺皆來會昌二年回鶻破契丹酋屈戌始復內附拜雲麾將軍易回鶻所與舊印曰奉國契丹之印通監開元七年十一月壬申契丹王李婆固與公主入朝至德寶應再朝獻大歷十二貞元三元和七大和開成間四唐昆明內屬南蠻傳爨蠻西有昆明蠻一曰昆彌以西洱水為境即葉榆河武德中巂州治中吉偉使南寧因至其國諭使朝貢求內屬自是歲與牂柯使偕來通監武德四年十二月昆彌遣使內附即漢之昆明也咸享三年正月庚戌昆明蠻十四姓三萬三千戶內附志云率户二萬內屬置殷縣五敦縣六總三州其後又置盤麻等四十一州龍朔三年矩州刺史謝法成招慰比樓等七千户內附總章三年置祿州湯望州神功元年以昆明內附置寶州地理志萬歲通天二年地理志諸蠻州五十一隸黔州都督府劍南道諸蠻州九十二皆無城邑椎髻皮服惟來集于都督府則衣冠如華人貞觀二十三年諸蠻內附置傍望求丘覽五州南蠻傳貞觀二十二年西洱河首領揚同東洱河楊斂松外蒙羽皆入朝通鑑梁建方擊破松外蠻羣蠻來歸附前後至者七十部因遣使詣西珥河其帥楊盛請降顯慶元年西洱河首領入朝貢方物巂州新安城旁有六姓蠻貞元中狼蠻請內附補首領浪沙為刺史又有奉國苴伽十一部每節度至諸部獻馬酋長衣馬皮春秋受賞于巂州桃州蠻天授中遣御史裴懷古招懷長壽時首領董期率部落一萬內屬三濮在雲南徼外千五百里龍朔中遣使與千支弗磨臘同朝貢貞觀初遣散騎韋叔諧諭高州總管馮盎盎遣智戴入侍五年盎來朝唐高麗請頒厯傳高麗武德初其王高建武再遣使入朝貞觀初朱子奢至高麗百濟為發春秋題已禽頡利建武遣使者賀并上封域圖通鑑兼本傳武德四年七月乙丑高麗王建武遣使入貢七年二月丁未七日建武遣使請班厯會要云遣使內附受正朔請頒厯册為遼東郡王貞觀十五年遣子入朝獻方物永徽二年百濟入貢三年正月己未朔吐谷渾新羅高麗百濟遣使入貢乾封元年五月泉男生率衆與契丹靺鞨兵內附遣子獻城詣闕六月賜乘輿馬瑞錦寶刀二年秋賜袍帶金扣七事明年召入朝志裴矩高麗風俗一卷高麗百濟遣子弟入學見學校龍朔元年劉仁軌為帶方刺史請唐厯而行宋元嘉六年七月百濟朝貢唐東謝蠻入朝王會圖職貢圖南蠻傳西爨之南有東謝蠻居黔州西三百里南距守宫獠西連夷子巢居椎髻有謝氏世為酋長貞觀三年其酋元深入朝冠烏熊皮若注旄以金銀絡額被毛帔韋行縢著履中書侍郎顔師古上言昔周武王時逺國入朝太史次為王會篇汲冢周書第五十九篇今蠻夷入朝如元深冠服不同可寫為王會圖詔可會要師古奏昔周武王時遠國歸欵周史乃集其事為正會篇今請撰為正會圖從之帝以其地為應州拜元深刺史隸黔州都督府又有南謝首領謝強亦來朝以其地為莊州授強刺史東謝南有西謝蠻貞觀三年遣使入朝二十一年以其地置明州通鑑貞觀三年閏十二月丁未東謝酋長謝元深南謝酋長謝強來朝謝皆南蠻别種在黔州之西詔以東謝為應州南謝為莊州隸黔州都督是時逺方諸國來朝貢者甚衆服章詭異顔師古請圖以示後作王會圖從之其後又因四夷來朝令閻立本寫其衣服形貌為職貢圖見李德裕集一崇文總目職貢圖卷又三卷藝文志職官類顔師古王會圖卷亡百官志職方郎中凡蕃客至鴻臚訊其國山川風土為圖奏之上於職方殊俗入朝者圖其容狀衣服以聞柳宗元鐃歌既克東蠻羣臣請圖王會百辟拜稽首咸願圖形容睢盱萬狀乖咿嗢九譯重唐突利入朝突厥傳突厥頡利可汗立以始畢子為突利立契丹靺鞨部南直幽州東方之衆皆屬焉武德七年八月頡利與突利兵悉起自原州連營而南秦王拒之馳百騎掠陳大言又馳騎語突利頡利與突利相忌乃請和突利自託於王為昆弟突利斂取無法下不附故薛延陀奚霫等皆內屬及頡利衰驟追兵於突利不肯從因起兵相攻突利請入朝帝謂左右曰古者為國勞己以憂人則系祚長役人以奉己則亡今突厥亂由可汗不君突利雖至親不自保而來觀彼亡我不可以無懼突利至禮見良厚輟膳以賜之拜右衛大將軍北平郡王食戶七百及為順州都督太宗敕曰我欲中國安爾宗族不亡故授爾都督毋相侵掠長為我北藩突利頓首聽命通鑑四年五月辛未以突利為順州都督令率其下就部通鑑貞觀二年初突厥突利可汗建牙直幽州之北主東偏奚霫等數十部多叛突厥來降頡利可汗以其失衆責之及薛延陀回紇等敗欲谷設頡利遣突利討之兵敗在元年頡利怒拘之突利由是怨頡利數召兵不與表請入朝上謂侍臣曰向者突厥之強控弦百萬慿陵中夏用是驕恣以失民今自請入朝非困窮肻如是乎朕聞之且喜且懼突厥衰則邊境安故喜然朕或失道亦將如突厥能無懼乎卿宜苦諫以輔不逮頡利發兵攻突利夏四月丁亥突利遣使來求救上謀於大臣曰朕與突利為兄弟不可不救然與頡利有盟奈何兵部尚書杜如晦曰取亂侮亡古之道也丙申契丹酋長帥其部落來降三年八月丙子薛延陀毗伽可汗遣其弟統特勒入貢頡利大懼始遣使稱臣請尚主十二月戊辰突利可汗入朝上謂侍臣曰往者太上皇稱臣於突厥朕常痛心今單于稽顙可雪前恥壬午靺鞨入貢上曰突厥已服之故也朕治安中國而四夷自服豈非上策乎庚寅突厥郁射設帥所部來降是歲戶部奏中國人自塞外歸及四夷前後降附者男女一百二十餘萬口四年二月甲辰李靖破頡利于隂山詳見戎捷三月戊辰以突厥阿史那思摩為右武衛大將軍四夷君長請上為天可汗庚午突厥思結侯斤帥衆四萬來降丙子以突利為右衛大將軍北平郡王庚辰俘頡利送京師蘇尼失降漠南遂空故事戎夷朝貢將至都中官驛勞于郊及館恩禮尤渥唐牂柯入貢處月入貢傳昆明東九百里即牂柯國武德二年謝龍羽遣使者朝拜牂州刺史夜郎郡公其北百五十里有别部充州蠻亦來朝賀開元二十五年其酋趙君道來朝貞元中至十八年五遣使朝元和二年五月詔黔南以將為押領牂柯昆明等使八年上表請盡歸牂柯故地開成元年鬼主珂珮內屬會昌中封其别帥為羅殿王世襲爵後又封别帥為滇王皆牂柯蠻也通鑑貞觀三年閏十二月乙丑牂柯酋長謝能明及充州蠻入貢詔以牂柯為牂州地理志牂州武德三年以牂柯首領謝龍羽地置充州武德三年以牂柯蠻别部置通鑑與志傳年月不同當考九年十月乙亥處月初遣使入貢西突厥别部也二十三年二月置瑶池都督處月朱邪闕侯斤阿厥亦請內屬唐回紇來朝獻方物回紇傳其先胸奴也元魏時號高車部或曰鐵勒鐵勒其部落凡一十有五種貞觀三年始來朝獻方物詳見賜物類唐伊吾入朝唐太宗貞觀四年九月戊辰伊吾城主入朝隋末伊吾內屬置郡隋亂臣於突厥至是舉七城來降置伊西州伊西當為西伊盧漢宜禾都尉治磧伊吾本胸奴地曰伊吾在燉煌之北大之外唐高昌入朝高昌傳高昌王麴文泰武德初立後五年七年獻拂菻狗高六寸長尺能曳馬銜燭貞觀四年十二月甲寅文泰入朝西域諸國咸欲因文泰遣使入貢通鑑云云五年正月甲戌宴高昌王及羣臣十二月康國內附不受唐西北君長上號太宗紀貞觀四年四月戊戌西北君長請上號為天可汗通鑑貞觀四年三月戊辰以突厥夾畢特勒阿史那思摩為右武侯大將軍四夷君長詣闕請上為天可汗上曰我為唐天子又行可汗事乎羣臣及四夷皆稱萬歲是後璽書賜西北君長皆稱天可汗一本云二十年九月甲辰鐵勒諸部又請上號為可汗北狄傳贊唐之德大矣際天所覆悉臣而屬之薄海內外無不州縣遂尊天子曰天可汗荒區君長待唐璽纛乃能國一為不賔隨輒夷縛故蠻琛夷寶踵相逮于廷唐焉耆入貢通鑑貞觀六年七月丙辰焉耆王突騎支遣使入貢傳云來朝初焉耆入中國由磧路隋末開塞道由高昌突騎支請復開磧路以便往來許之後遣使貢名馬五年十二月大羊同國朝貢使至東接吐蕃十五年朝貢唐諸羌內屬黨項羌內屬太宗紀貞觀六年是歲諸羌內屬者三十萬人舊紀黨項羌前後內屬三十萬口志劒南道諸羌州百六十八徹州貞觀六年以西羌董洞貴部置縣三西冉州六年以徼外斂才羌地置縣四先是五年以生羌置西封炎西博穹向州又置西雅蛾州七年以白狗羌戶置西恭州苲西域傳黨項三苖之後漢西羌别種其地古析支貞觀三年南會州都督鄭元璹鐫諭其酋細封步賴舉部降璽詔慰撫因入朝以其地為軌州授刺史步賴請率兵討吐谷渾後諸酋長悉內屬以其地為崌奉巖遠四州五年拓拔赤辭與思頭俱內屬以地為懿嵯麟可三十二州以松州為都督府擢赤辭西戎州都督賜氏李職貢不絶會要五年詔遣使開其河曲地為六十州內附者三十萬口白蘭羌武德六年十二月使者入朝明年以為維恭二州白蘭周保定元年獻犀甲鐵鎧貞觀六年與契苾數十萬內屬契苾何力傳貞觀六年尚祖率其部來降詔處之甘涼問特浪生羌永徽五年通鑑正月丙戊率衆來屬以地為劒州東女羌别種居康延川有弱水武德時王湯滂氏始遣使入貢貞觀中使復至璽制慰撫顯慶中遣使高霸黎文與王子三盧來朝會要永徽七年正月垂拱二年其王斂臂使大臣來請官號册拜左玉鈴衛將軍賜瑞錦服天授三年開元二十九年十二月王及子再來朝天寶元年五月詔與宰相宴曲江一云正月甲寅宴女國王及佛逝國于曲江宰臣以下同宴封歸昌王左金吾大將軍貞元九年內附多彌亦西羌族貞觀六年遣使朝貢賜遣之唐日本遣使入朝請授經日本傳兼會要古倭奴也去京師萬四千里後惡倭名更號日本自言國近日所出以為名或曰日本為倭所并冒其號貞觀五年會要十五年十一月遣使者入朝帝矜其遠詔有司毋拘歲貢永徽初五年十二月其王孝德獻虎魄大如斗碼瑙若五升器高宗賜璽書令出兵援新羅明年使者與蝦蛦人偕朝顯慶四年十月蝦夷隨倭使至咸亨元年二月遣使賀平高麗長安三年一云元年其王文武遣朝臣真人粟田貢方物冠進德冠好學能文武后宴之麟德殿授司膳卿開元初復朝請從諸儒授經詔四門助教趙玄默即鴻臚寺為師獻大幅布為贄天寶十二年朝衡入朝上元中繇明越朝貢建中元年使者興能獻方物貞元末永貞元年十二月遣使朝其學子願留肄業開成四年正月復入貢龍朔元年八月儋羅王遣使入朝國居新羅武州南島上麟德中酋長來朝從帝至太山會要作耽羅唐吐蕃遣使來朝吐蕃傳本西羌屬直京師西八千里貞觀八年弄讃始遣使者來朝帝遣行人馮德遐下書臨撫二十二年王玄策使西域為中天竺所鈔弄讚發精兵從玄策討破之來獻俘武后時與蠻夷同朝貢通鑑長壽元年二月己亥吐蕃黨項部萬餘人內附傳云二十萬人分置十州五月曷蘇請內附六月它酋咱插師羌蠻八千內附即其部置萊川州詳見大度山紀功聖厯二年四月論贊婆帥千餘人來降以為特進歸德王欽陵子弓仁以所統吐谷七千帳降十月丁亥贊婆至都賞賜甚厚皆賜鐵劵長安二年九月己卯遣論彌薩來朝請和明年四月獻馬黃金景龍元年三月庚子遣使納貢開元十八年九月命皇甫惟明使吐蕃贊普悉出貞觀以來書詔示之十月遣名悉臘隨入朝獻怪寶帝御前殿引羽林仗內之既宴賜紫服金魚受服辭魚曰國無是不敢當十九年正月辛未遣崔琳報聘吐蕃請交馬於赤嶺互市於甘松嶺又請五經敇袐書寫賜九月辛未遣其相入貢帝遣李嵩往聘德宗初遣韋倫持節歸其俘建中元年四月吐蕃發使者隨倫入朝獻方物會要神龍元年九月二十一日敇吐蕃王及可汗子孫欲習經業附于國學唐吐谷渾來朝請頒厯傳吐谷渾居甘松山之陽洮水之西太宗時伏允遣使者入朝伏允死國人立子順為君稱臣內附詔封西平郡王貞觀九年順為下所殺立其子燕王諾曷鉢諾曷鉢幼大臣爭權帝詔侯君集就經紀之十年二月始請頒厯行年號及遣子弟入侍十年三月丁酉詔封河源郡王號烏地也拔勒豆可汗遣淮陽郡王道明持節册命賜鼓纛曷鉢身入謝獻馬牛羊萬比年入朝十二年來朝十三年十二月己丑來朝以宗室女為弘化公主妻之十四年宴于玄武門二十一年二十二年遣使朝貢二十三年八月獻駿馬高宗立又獻名馬永徽三年閏九月六年八月十一月來朝乾封初元年五月更封青海國王兼會要唐朱俱波甘棠入貢通鑑貞觀十年十二月戊寅朱俱波甘棠遣使入貢朱俱波在蔥嶺之北漢子合國也去瓜州三千八百里亦名朱俱槃甘棠在大海南上曰中國既安四夷自服然朕不能不懼惟諸公匡其不逮十四年二月辛丑流鬼入貢去京師萬五千里濱於北海未嘗通中國重三譯而來上以其使者余忈為騎都尉唐南蠻四國朝貢真臘來朝南蠻傳貞觀十二年僧高武令迦乍鳩密四國使者朝貢其後鳩密王與富那王等遣使來貢環王南有殊奈貞觀四年上方物會要二年十月甘棠居海南九年會要十年使者入朝盤盤在林邑南貞觀中九年使至再遣來朝扶南在日南之南王姓古龍武德貞觀間再入朝真臘一名吉蔑本扶南屬國東距車渠西屬驃南瀕海武德六年十月貞觀二年十一月永徽二年聖厯元年四來朝神龍後分為二陸真臘或曰文單婆鏤開元五年天寶九載率其屬二十六來朝拜果毅都尉大厯中副王婆彌來朝獻象十一擢試殿中監賜名賓漢水真臘元和初八年亦來貢文單屬國曰參半武德八年使者來投和在真臘南銀作錢類榆莢貞觀中遣使以黃金函內表并獻方物藝文志地理類西南蠻入朝首領記一卷交州以來外國傳一卷唐鐵勒十一部內屬薛延陀傳貞觀二十年八月己巳帝幸靈州節度諸將鐵勒十一部歸命請吏內屬會要云十一姓貢獻見兵捷及賜豫類回紇傳貞觀二十年遣使獻欵於是鐵勒十一部願歸命天子請置唐官詳見後契苾何力傳鐵勒可汗之孫貞觀六年與母率衆千餘詣沙州內屬太宗處其部於甘涼二州房玄齡云突厥弛辮握刀分典禁衛延陀鐵勒披置州縣高昌吐渾偏師掃除拔野古貞觀三年九月朝貢霫三年朝貢唐逺夷十九國朝貢置驛六十六所舊紀貞觀二十一年是嵗墮婆登乙利鼻林送都播洋同石波斯康國吐火羅阿悉吉等遠夷十九國並遣使朝貢又於突厥之北至於回紇部落置驛六十六所以通北荒焉李靖問對陛下自突厥至回紇部落凡置驛六十六所以通斥候斯己得策矣唐骨利幹入貢通鑑貞觀二十一年八月辛未遣使入貢會要正月內附內附以為玄闕州拜其俟斤為刺史處浣海北去京師最遠又北度海則晝長夜短延載初亦來朝都播分三部鐵勒别種也二十一年因骨利幹入朝十二月亦以使通中國東室韋貞觀五年始來貢豐貂武德八年遣使朝貢景龍初朝獻開元天寶凡十朝獻大厯十一大和三大中一貞觀四年營州都督薛萬淑遣契丹酋長諭東北諸夷奚霫室韋等內附凡十餘部太宗時北狄能自通者貞觀六年至有烏羅渾鞠駮馬大漢皆古所未賔者貞觀逮永徽奉貂馬入朝或一再至永徽二年十一月駁馬國朝貢國在突厥北唐訶陵入貢南蠻傳訶陵一曰闍婆在南海中宋元嘉九年夏十二年七月闍婆朝貢木為城有文字知星厯夏至亦八尺表景在表南二尺四寸貞觀中二十二年與墮和羅墮婆登皆遣使入貢璽詔優答大厯中訶陵使者三至元和八年獻五色鸚鵡頻伽鳥會要十年八月汔太和再朝貢咸通中獻女樂墮和羅貞觀時遣使再入朝獻白鸚鵡因丐良馬銅鐘帝與之墮婆登在環王南稻月一熟有文字以貝多葉寫之貞觀二十一年朝獻使至會要訶陵國天寶十三載十一月獻僧耆女二人玳瑁𤭔生犀王居闈婆城遷於婆露伽斯城拘蔞密在林邑西顯慶元年閏正月朝貢永徽六年八月獻五色鸚鵡唐黠戛斯入朝朝貢圖傳王會圖四夷朝貢録黠戛斯傳古堅昆國也或曰結骨在伊吾之西焉耆之北白山之旁人赤髮緑瞳未始通中國貞觀二十一年會要二十一年二月入朝聞鐵勒入臣即遣使獻方物二月酋長俟利發失鉢屈阿棧入朝太宗勞饗之謂羣臣曰往渭橋斬三突厥自謂功多今俟利發在席更覺過之酒酣奏願持笏以其地為堅昆府隸燕然都護通鑑結骨自古未通中國聞鐵勒皆服入朝上宴之天成殿以結骨為堅昆都督府高宗世再來朝景龍中獻方物景龍二年十二月丙申宴堅昆使于兩儀殿玄宗世四朝獻乾元中為回紇所破其後回紇衰會昌中其酋長阿熱破殺回紇可汗焚其牙及金帳遂徙牙牢山之南使使者衛送太和公主還朝為烏介可汗邀取阿熱無以通于朝後遣注吾合素上書言狀行三歲至京師而武宗大恱通鑑會昌二年二月辛未遣使獻名馬二甲戌引對班勃海使者上以其處窮遠能修職貢命大僕卿趙蕃持節臨慰其國詔宰相即鴻臚寺見使者使譯官考山川國風宰相德裕上言集云二十一日延英靣奏貞觀時遠國皆來顔師古請如周官集四夷朝事為王會篇今黠戛斯大通中國宜為王會圖以示後世詔以鴻臚寺得繢著之又詔阿熱著宗正屬籍藝文志地理類會昌祕書少監商州刺史吕述黠戛斯朝貢圖傳一卷崇文目同李德裕序曰越裳貢雉薦於宗廟西旅獻獒陳以典訓感其至而戒其初也皇帝御厯之四年天晬而清日晏而明中宇既安四夷來庭龍荒君長黠戛斯遣使注吾合素等上表獻良馬二匹絶大漠而貢赤誠涉流沙而霑赭汗命其使見於內殿賜珍膳錫文錦會要在三年趙蕃持節乃四年事也謹按賈耽古今四夷述黠戛斯本堅昆國貞觀二十一年酋長入朝授將軍印拜都督逮天寶季年朝貢不絶中國多難回紇隔礙黠戛斯乘彼荐飢破龍庭焚罽幕始得出重泉而見白日披氛霧而覩青天乃詔太子詹事韋宗卿祕書少監吕述往蒞賔館展私覿稽合同異覼縷闕遺傳胡貊之音載山川之狀臣輒因宗卿述所紀異聞飾以繢事訪國邑風俗編為一傳寫注吾合素等形狀列傳前會要黠戛斯會昌三年其國遣注吾合索上聲呼之等七人來朝兼獻馬二匹以其久不修貢且莫詳更改之名中旨訪求惟賈耽四夷述具載黠戛斯之號先是回鶻背恩德入靈州正月破回紇於殺胡山就帳中奉大和公主歸於我軍黠戛斯乘其破亡遂有其國二月辛未遣使注吾合索等來朝且憑大唐威德求册命四年上命太僕卿趙蕃持節宣慰通鑑趙蕃為安撫黠戛斯使在三年三月五年五月敕黠戛斯生窮隂之鄉稟元朔之氣少卿之後胄裔且異於蕃夷大漠之中英傑自雄於種落向者居于絶徼隔以強鄰空馳嚮化之心莫通事大之禮旋能奮其武勇清彼朔陲萬里歸誠重譯而至是用加其美號錫以丹書可册為可汗六年此命中止九月集議大中元年六月詔鴻臚卿李業持節册命咸通間三來朝志地理類高少逸四夷朝貢録十卷會昌中奉詔撰給事中紇書目起武德迄會昌能以名通皆書國氏蕃會昌中於斯朝貢莫知其本原李德裕因請序諸譜系命少逸同修撰本二十卷合為十卷唐四夷君長朝宿衛通鑑貞觀二十二年是時四夷君長爭遣使獻見元正朝賀數百千人上引見諸胡使者謂侍臣曰窮髮之地盡為編戶魏徵傳於是帝即位四年歲斷死刑二十九幾至刑措米斗三錢帝嘗歎曰今大亂之後其難治乎徴曰與封德彛辨論云云帝納之不疑至是天下大治蠻夷君長襲衣冠帶刀宿衛東薄海南踰嶺戶開不閉行旅不賫糧取給於道帝謂羣臣曰此徴勸戒我行仁義既效矣惜不令封德彛見之唐遠國遣使朝獻傳貞觀後遠小國君遣使者來朝獻有司未嘗參考本文今附左右曰大辭彌貞觀十八年會要十九年三月與摩羅遊使者偕朝二十一年有健達獻佛土菜龍朔元年八月多福遣使來朝揔章元年有未陀提開元五年有習阿薩般並遣使朝貢七年訶毗施因吐火羅酋獻師子五色鸚鵡天寶時來朝者曰俱爛那舍摩威遠蘇吉利發屋蘭蘇利悉單建城新城俱位或曰商彌凡八國西方之戎唐興以次修貢蓋百餘天寶六載都盤等六國皆遣使入朝封都盤順化王勃達守義王阿沒恭信沙蘭順禮羅利支義寧怛滿奉順王挹怛國漢大月氐之種天寶中遣使朝貢曇陵居大洲中貞觀十六年遣使朝貢唐羈縻州都督府見地理類地理志唐自太宗平突厥西北諸蕃及蠻夷稍稍內屬即其部落置州縣凡府州八百五十六號羈縻唐新羅織錦頌觀釋奠賜晉書傳傳世三十至真平以隋開皇十四年貢方物唐高宗永徽元年新羅女王真德攻百濟破之在百濟東南本辰韓種也梁普通二年隨百濟奉獻方物遣春秋子法敏入朝織錦為頌以獻曰巨唐開洪業巍巍皇猷昌止戈成大定興文繼百王統天崇雨施治物體含章深仁偕日月撫運邁時康幡旗既赫赫鉦鼓何煌煌外夷違命者翦覆被夭殃淳風凝幽顯遐邇競呈祥四時和玉燭七耀巡萬方維嶽降宰輔維帝任忠良三五成一德昭我唐家唐帝美其意擢法敏大府卿會要云永徽元年新羅王金真德大破百濟遣使來朝仍織錦作五言太平詩以獻帝嘉之顯慶元年三月春秋又破百濟兵遣使來告捷初武德四年王真平遣使入朝高祖詔庾文素持節答勞後三年拜柱國封新羅王貞觀三五年獻女樂二太宗付使者歸之是歲真平死無子立善德為王十七年帝伐高麗詔率兵破虜善德使兵五萬拔水口城以聞二十一年善德死妹真德襲王明年十二月癸未遣子文王及弟伊贊子春秋來朝拜文王左武衛將軍春秋特進因請改章服從中國制內出珍服賜之又請國學觀釋奠講論帝賜所製晉書辭歸敇三品以上郊餞後龍朔三年四月以其國為雞林大都督府授法敏大都督開耀元年子政明襲王垂拱二年三月十四日遣使朝丐唐禮及它文辭武后賜吉凶禮及文辭五十篇一本云寫吉凶要禮并文館詞林采其辭涉規誡者勒成五十卷賜之開元中數入朝二十五年承慶襲王詔邢璹持節往曰新羅號君子國知詩書卿宜演經誼使知大國之盛會要云請禮記并雜文章長慶二年十二月寶歷元年再遣使來朝留宿衛開成初元年遣子義琮請留衛五年四月鴻臚寺籍質子及學生歲滿者一百五人皆遣之藝文志顧愔新羅國記一卷大厯中歸崇敬使新羅愔為從事唐葛邏祿內屬實録開元二年九月壬子詣涼州內屬在北庭西北金山之西永徽元年六月高侃伐車鼻可汗三族皆內屬後自號三姓葉護開元初再朝天寶五年拔悉密貞觀二十三年始來朝拂涅開元天寶間八來獻鯨睛貂鼠白兔皮鐵利開元中六來越喜七來貞元中一來虞婁貞觀間再來貞元一來後渤海盛靺鞨皆役屬之不復與王會唐顯慶四國入朝西爨貢方物傳瞻博或曰瞻婆顯慶中與婆岸千支在西南海中弗舍跋若磨臘四國並遣使者入朝又哥羅舍分在南海南二會要龍朔年五月至修羅分在海北甘畢在南海上三國貢方物又多摩萇貢方物室利佛逝有城十四夏至立八尺表影在表南二尺五寸咸亨至開元數遣使者朝又獻歌舞以其王為左威衛大將軍賜紫袍金鈿帶後遣子入獻天寶元年正月詔宴于曲江宰相會册封賓義王名蔑一作多蔑以十二月為歲首龍朔元年八月來貢單單乾封總章時獻方物西爨南寧之渠帥隋開皇初朝貢置恭協昆州高祖以弘達為昆州刺史益州刺史段綸遣俞大施至南寧誘諸部皆納欵武德三年七月二十四日貢方物西有徒莫祗儉望蠻貞觀二十三年內屬以其地為五州唐渤海遣子入侍傳渤海本粟末靺鞨及祚榮號震國王中宗遣侍御史張行岌招慰祚榮遣子入侍先天中遣使拜渤海郡王以所統為忽汗州都督始去靺鞨號玄宗世朝獻者二十九開元二年三月令生徒六人入學新羅七人二十六年渤海遣使來寫唐書及三國志晉國三十六國春秋大厯二十五貞元四元和十六朝獻長慶四寶厯再文宗世來朝十二會昌四咸通三初其王數遣諸子詣京師大學習議古今制度遂為海東盛國實録貞元十一年二月乙巳册嵩鄰為渤海王志張建章渤海國記三卷唐勃律來朝傳大勃律萬歲通天逮開元時三遣使朝册其君為王再貢方物小勃律開元初王沒謹忙來朝玄宗子蓄之以其地為綏遠軍天寶六載高仙芝平其國於是拂菻大食諸胡七十二國皆震恐歸附改其國號歸仁置歸仁軍募千人鎮之謝䫻景雲初朝貢開元册為王天寶中數朝獻帆延貞觀初遣使入朝顯慶三年授其王寫鳳州都督石汗那天寶中朝獻識匿會要云瑟匿貞觀二十年三月與似沒役槃二國使者偕來朝俱蜜貞觀十六年遣使入朝天寶時獻馬唐靺鞨入朝通鑑開元十四年黑水靺鞨居肅愼地入又見上突利朝遣使入見以其國為黑水州置長史鎮之會要貞觀十四年傳武德五年渠長始來貞觀二年臣附以其地為燕州開元十年其酋來朝拜勃利州刺史十三年安東都護薛泰請置黑水府以部長為都督刺史置長史監之隸幽州都督訖玄宗世朝獻者十五大厯世七貞元一元和中再地理志黑水州都督府開元十四年置唐于闐來朝通鑑上元元年十二月戊子于闐王伏闍雄率子弟酋領七十人來朝二年正月丙寅以其國為毗沙都督府分為十州以伏闍雄為都督傳于闐距京師九千七百里并有漢戎盧杆彌渠勒皮山五國地貞觀六年其王尉遲屈密遣使入獻後三年遣子入侍龜兹平其王伏闍信大懼使子獻橐它三百長史薛萬備願假輕騎羈獻京師至則陳唐威靈勸入見乃隨使者來會二十三年七月己酉入朝高宗立授右驍衛大將軍賜袍帶請以子弟宿衛開元初獻馬駝豽至德初其王勝以兵赴難請留宿衛勝天寶中入朝獻名玉良馬玄宗授右威衛將軍毗沙府都督章求拔國貞觀二十年閏三月因悉立國遣使入朝罽賔國貞觀十一年使至上曰九夷重譯魏徵之力也獻俱物頭花永徽二年獻耨特鼠顯慶三年列為修鮮都督府龍朔初授其王都督開元七年遣使獻天文經及祕要藥方八年册其王乾元元年遣使朝貢唐西山八國入朝韋臯傳初雲南蠻羈附吐蕃其盜塞必以蠻為鄉道臯間使招徠之雲南欵邊求內屬約東蠻鬼主驃傍苴夢衝等絶吐蕃盟云云見兵捷貞元九年城鹽州於是西山羌女訶陵南水白狗逋租弱水清逺咄霸八國酋長皆因臯請入朝遣崔佐時由石門趣雲南而南詔復通石門者隋史萬歲南征道也天寶中鮮于仲通下兵南溪道遂閉至是蠻徑北谷近吐蕃故臯治復之繇黎州出卭部直雲南置青溪關號曰南道西域傳東女貞元九年其王湯立悉與白狗君及哥鄰君董臥庭逋租君鄧吉知南水君薛尚悉曩弱水君董避和悉董君湯息贊清遠君蘇唐磨咄霸君董藐蓬皆詣劒南韋臯求內附其種散居西山弱水雖自謂王蓋小小部落耳至是猶上天寶所賜詔書共三十九通臯處其衆於維霸等州立悉等入朝召見麟德殿差賜官祿於是松州羌二萬口相踵入附會要云二萬餘戶立悉等官刺史皆得世襲明年元會訖賜金帛遣還八月加韋臯統押近界諸蠻及西山八國雲南安撫使路岩傳為劒南西川節度使置定邊軍於卭州拒大度治故關由是西山八國來朝唐六蠻內附舊紀貞元九年七月劒南西川羌女國王陽立志哥鄰王西域傳曰君董臥庭白狗王羅陀忩弱水王董辟和逋租王弟鄧告知南水王姪尚悉曩等六國君王自來朝貢六國初附吐蕃韋臯出西山討吐蕃故六蠻內附各授官秩傳又有悉董君清逺君咄霸君唐驃國內附傳驃國古朱波也凡屬國十八部落二百九十八貞元中王雍羌聞南詔歸唐有內附心異牟尋令進樂人其樂五譯而至會要貞元十八年正月遣其弟悉利移來朝咸通三年二月貢方物唐含元殿受南詔朝賀賜黃金印賜錦袍金鈿帶傳南詔或曰鶴柘曰龍尾曰苴咩曰陽劒本哀牢後烏蠻别種其先渠帥有六自號六詔蒙舍詔在諸部南故稱南詔居永昌姚州之間鐵橋之南王蒙氏高宗時獨邏遣使入朝賜錦袍武后時盛炎入朝開元末詔賜皮邏閣名歸義時五詔微歸義獨強求合六詔為一制可遂破吐蕃入朝天子加禮以破洱蠻功馳遣中人册為雲南王賜錦袍金鈿帶七事徙治大和城二十六年九月戊午天寶初遣鳳伽異入宿衛大厯十四年異牟尋立唐人鄭回為清平官説之歸唐稍謀內附會節度使韋臯撫蠻有威惠時貞元四年也後四年遣使三人遺臯帛書願歸欵贈臯黃金丹砂臯護送使者京師使者奏請歸天子為唐藩輔獻金示順革丹赤心也德宗嘉之賜以詔書見獻捷類遣弟湊羅棟等二十七人入獻地圖方物請復號南詔賜賚有加明年貞元十年六月癸丑册為南詔王考異云蠻詔詔即王也新傳誤韋臯奏稱雲南王以祠部郎中袁滋持節賜黃金印文曰貞元册南詔印七月庚辰賜金印銀窠年月從實録舊史滋至大和城異牟尋以良馬六十迎之詰旦授册率官屬北面立宣慰使東向册使南向又授賜服備物享使者出銀平脫馬頭盤曰此天寶時先君以鴻臚少卿宿衛皇帝所賜也又賜胡部龜兹音聲二列滋授觴曰當深思祖考成業永為西南藩屏袁滋還遣尹輔酋等七人謝獻鐸鞘浪劒欎刃生金瑟瑟牛黃琥珀㲲紡絲象犀越睒統倫馬會要貞元十年七月庚辰賜南詔印韋臯請以黃金從之九月辛卯使濛湊羅棟等獻鐸槊樂浪人劒及吐蕃印八紐朝見於麟德殿錫賚甚厚十一年九月獻馬六十匹十四年十二月南詔遣王丘各等賀正獻方物十九年春正月癸卯朔上御含元殿受南詔朝賀使揚鏌龍武試太僕少卿劉志遼試太常卿十五年遣大臣子弟就學於成都元和二年十二月復遣使朝貢三年十一月辛未册立閣勸牟尋之子改賜元和印章鑄元和册南詔印七年十二月遣使朝貢十年十一月使楊遷奇等二十九人來朝十一年勸利立長慶三年賜印開成四年正月御麟德殿受南詔入朝賀正三十七人賜官告錦綵銀器金銀帶衣服五年十二月對歸國十六人于三殿會昌二年正月酋長元佐等二十五人對三殿大中八年進犀牛還之唐彭濮蠻修貢獻假文昌傳鎮劒南長慶二年黔中蠻叛開曉即引還彭濮蠻大酋蹉祿來請立石刋誓修貢獻唐異域歸忠傳李德裕序曰書載率服美大舜之功詩列既平顯周宣之德暨漢宣帝單于慕義歷祀數千稱者三代皇帝英才天縱武節霆馳嗢沒斯歸欵朔邊注心魏闕穹居之長盡識漢儀左衽之人咸被王澤歸大國明也戴聖君忠也去亂邦智也執醜虜義也具此四美是謂誠臣爰采武功正烈之事以為歸忠傳集秦漢以來至聖朝由絶域歸中國以名節自著功業保終者三十人勒成上下兩卷其不自獻欵無迹可稱者並不載武宗會昌二年四月甲申回鶻可汗子嗢沒斯率三部及特勒大酋宰相等二千二百餘人傳云二千騎詣振武降五月戊申詔拜嗢沒斯為右武衛大將軍爵懷化郡王六月甲申以天德為歸義軍印拜軍使其次酋長阿歷支等四人皆郡公官賞有差加賜牙旗豹尾刀器諸物給其屬冠帶詔宰相李德𥙿采秦漢以來興殊俗化忠效卓異者凡三十人為異域歸忠傳寵賜之七月進二卷嗢沒斯請留族太原為天子捍邊列舍雲朔間處其家八月丁丑賜姓名李思忠嗢沒斯制取士殊鄰秦能致霸得賢異壤晉實用材歷支特勒制徐盧欵塞即受漢封比能入朝仍疏漢爵解其被毳榮以彯纓回鶻內宰相賜姓名制戎狄請盟良由孟樂呼韓率服始自秩訾漢賜𤭔侯尚采祭天之義魏親程昱用疇捧日之心春秋爵潞子漢興封弓高由余深識日磾先見由余效忠日磾盡節四夷質子多在京師薛登諫曰戎夏不雜古所戒也突厥吐蕃契丹往因入侍並被奬遇官戎秩步黌門服改氊罽語習楚夏窺圖史成敗熟山川險易國家雖有冠帶之名而狼子孤恩患必在後武后不納蕃將傳贊夷狄性淳固其知義者鷙挺不可遷史大奈等事君皆一其志渾瑊􅎤跌光顔烈垂無窮六典主客郎中掌諸蕃朝聘之事凡四蕃之國經朝貢巳後自相誅絶及有罪見滅者蓋三百餘國今所在者有七十餘蕃注謂三姓葛邏祿至焉耆突騎施等七十國各有土境分為四蕃乾德西南夷內附貢銅鼓西南夷漢牂柯也乾德三年珍州田景平內附四年七月王全斌言西南夷董高等上章內附八月南州一云西南夷貢銅鼓求內附五年六月龍彥瑫遣使入貢授南寧州刺史九月貢馬及方物開寶七年七月南丹州莫洪燕奉表內附貢馬九年刻印賜之太平興國三年夷州蠻貢方物五年七月南州貢方物八月龍瓊琚貢馬丹砂七年三月命黎州造舟大度河以濟西南蠻朝貢者雍熙二年八月入貢九月南寧州龍漢璿貢名馬丹砂蒟醬端拱元年三月又請開道效貢許之淳化元年五月南丹州貢方物七月貢銀碗銅鼓銅印五年九月入貢賜副使莫洪玩袍笏塗金銀帶器幣至道元年十月二十八日龍漢􅚜遣使率西南牂柯諸蠻貢方物牂柯諸蠻在宜州之西纍世不通至道元年九月丙午始貢方物召見詢問地理風俗令作本國歌舞一人吹瓢笙名曰水曲其使衣虎皮氊裘賜冠帶銀帛俾與崇德殿上壽宴咸平元年九月牂柯謝再殊等來貢賜巵酒勞之二年九月首領張文黔等貢名馬六十五匹祥符二年正月鞏州內附丙寅賜印八月二十三日龍漢􅚜遣使奉貢賀東封賜錦袍銀帶六年八月貢方物名馬天聖四年九月貢馬丹砂慶厯二年十一月以瀘州烏蠻所居為姚州賜印元豐二年九月甲申西南龍蕃貢方物甲午羅蕃十月丙申朔石蕃來貢三年三月南丹州貢馬六年貢木弓治平三年四月貢銀獅子紹興二十六年正月二十九日辛未知黎州唐拒奏太祖即位之初指輿地圖棄越巂不毛之地畫大渡河為界邊民不識兵革垂二百年開寶交趾內附開寶六年五月己巳交趾丁璉始遣使內附授以官爵開寶安定國貢方物安定本馬韓種為契丹所破保於西鄙開寶六年國王烈萬華因女真遣使入朝附表貢方物端拱二年獻馬雕羽淳化二年又上表後不復至女真渤海别種建隆二年八月貢名馬至興國凡九入貢天禧三年二月丁酉宗哥唃厮囉遣使來貢景德河西內屬夏州入貢景德元年正月癸卯石隰州青河西四十五族內屬二月趙德明請降五月命向敏中安撫兩邊受德明降議立條約二年九月癸丑德明始遣使入貢三年十月庚午朔授德明官爵録誓表諭諸蕃十一月丙午德明貢馬以謝庚申來貢祥符二年正月戊辰賜德明加恩告及器幣金帶鞍馬景德國信司實録景德三年十二月戊子雄州請改機宜司為國信司從之初用兵之際雄州有機宜司四年八月庚子契丹修好始置往來國信司鑄印內臣閻承翰等領之掌使介交聘之事舊止有排辨禮信所至是置局祥符注輦來貢四夷述職圖注輦自古不通中國東距海南至羅蘭祥符八年九月二日己酉國主羅乍遣使奉表來貢初國主聞商船之言且曰十年來海無風濤中國有聖人故遣娑里三丈等入貢詣承明殿以盤捧珠碧玻璃布於御坐前降殿再拜庚申判鴻臚寺張復請纂集今年以後朝貢諸國繢冠服録風俗為大宋四夷述職圖上以表聖主之懷柔下以備史官之廣記奏可及撰成止注輦一國帝曰二聖以來四夷朝貢無虛歲豈止此耶九年四月二日乙亥命禮儀院增修重加編録而卒不成注輦天禧四年二月三日復來貢明道二年十月二十一日貢珠象齒奉銀盤散珠於御榻下而退景祐元年二月貢方物熙寧十年六月四日壬午遣使二十七人朝見貢方物以金蓮花盛置真珠龍腦升陛散之謂之撒殿賜銀器衣服有差天聖九年正月庚申十二日資政學士晏殊言占城龜兹沙州卭部川蠻至有挈家入貢者請如先朝故事令館伴訪道路風俗及繪衣冠人物以上史官從之景祐四年三月二十五日戊戌判鴻臚宋郊請自今外夷朝貢並詢問國邑風俗道途逺近圖畫衣冠人物兩本一進內一送史館從之康定元年七月十五日知制誥吳育請選官屬使知外夷之務并采集古今事迹風俗如有質問悉以條陳詔史臣王洙等檢討典故以聞熙寧四年十月六日樞密都承旨李評請諸國朝貢别置一司領之取索文字預為法式詔領于客省七年九月丁未史臣宋敏求等上蕃夷朝貢録二十一卷即李評所請也元豐著令西南五姓蕃五年一貢政和六年三月壬戌詔有司編集如周王會之篇七年五月詔敕令所編修朝貢令式今祕閣圖畫有占城三佛齊羅斛交址職貢圖各一真臘職貢圖二外國入貢圖入貢圖一崇文目地理類有華夷列國入貢圖二十卷伯仲成周王會之篇輿臺唐室職貢之圖元豐佛泥來朝佛泥不與中國通者九百餘年元豐四年八月二十八日遣使來朝蕃夷奉朝貢者四十三國高麗至唃厮囉當考太祖朝高麗定安女直龜兹于闐高昌天竺占城三佛齊交趾大食卭部川蠻黎州保塞蠻靈武五蕃瓜沙甘豐夏溪珍奬南州南丹州回鶻太宗朝渤泥波斯日本闍婆吐蕃牂柯山後兩林蠻雅州蠻西山野州路蠻南寧西涼銀州渤海髙敞真宗朝丹流眉蒲端注輦西天金城勿巡唃厮囉六谷風琶蠻河西西南蠻古敘宜辰安逺等州撫水州五溪高州五姓夔州蠻仁宗朝塗渤西蕃磨氊瞎氊施黔廣涼州蠻鶼州西平州波州北遐鎮蠻北亭可汗石龍蕃夏國安化州蠻即撫水州大留皇祐元年來貢十二月戊子神宗朝層檀佛泥拂菻大理真臘陀婆羅董氈西南靜蠻捍蠻軍羅耆方蕃龍賜州哲宗朝阿里骨程張蕃麻羅拔邈黎保靜等州徽宗朝蒲甘青唐高宗朝羅殿羅斛其纍朝貢獻常通者不重述中興以來大理蒲甘交趾占城真臘真里富大食高麗日本闍婆三佛齊南丹州西南張蕃宜州等蠻皆朝貢紹興六年九月癸巳翰林學士朱震言大理國本唐南詔藝祖鑒唐之禍棄越巂諸郡以大渡河為界欲寇不能欲臣不得最得禦戎上策今南市戰馬通道遠夷其王和譽遣清平官入獻方物陛下詔還其直却馴象賜敇書即桂林遣之亦藝祖之意也錢熙作四夷來王賦以獻凡萬餘言太宗覽之嘉歎以直史館真宗革車再駕而北狄乞盟羽檄未馳而西羌面內五兵偃息重譯會同玉海卷一百五十三
