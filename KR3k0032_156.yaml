body:
  text: 玉海卷一百五十六宋王應麟撰宫室宫二漢宜春宫棠梨宫宣曲宫司馬相如傳上林賦蹷石關歴封巒過䧴鵲望露寒注張楫曰此四觀建元中作在雲陽甘泉宫外下棠梨息宜春張楫曰棠梨宫名在雲陽南三十里一云東南三十里師古曰宜春宫名在杜縣東即今曲江池是其處也西馳宣曲濯鷁牛首張楫曰宣曲宫名在昆明池西牛首池名在上林苑西頭登龍臺掩細柳觀名相如嘗從上至長楊獵還過宜春宫奏賦以哀二世行失曰登陂陁之長阪兮坌入曾宫之嵯峨臨曲江之隑洲兮望南山之參差張楫曰隑長也苑中有曲江之象中有長洲師古曰臨曲岸之洲今謂曲江史記正義曲池武帝造周廻五里在宜春苑中觀衆樹之蓊薆兮覽竹林之榛榛東方朔傳建元三年微行北至池陽西至黃山南獵長楊東游宜春置更衣從宣曲以南十二所中休更衣投宿諸宫長楊五柞倍陽宣曲尤幸師古曰皆宫名揚雄傳棠梨師得師古曰棠棃官在甘泉苑垣外師得宫在櫟陽界百官表長水校尉掌宣曲胡騎師古曰宣曲觀宫黄圖宣曲宫在昆明池西孝宣帝曉音律嘗於此度曲因以名宫宜春宫本秦之離宫在長安城東南杜縣東近下杜在鄠者宜春觀郭璞曰在渭南棠梨宫在甘泉苑垣外雲陽南三十里括地志秦宜春宫在雍州萬年縣西南三十里宜春苑在宫之東杜之南漢龍淵宫龍淵劒武紀元光三年夏五月河決濮陽汜郡十六發卒十萬救決河起龍淵宫注孟康曰在西平界其水可用淬刀劒特堅利古龍淵之劒取於此水服䖍注宫在長安西作銅飛龍故以冠名也如淳曰黃圖云有龍淵宫今長安城西有其處溝洫志救河決亦起龍淵宮於其旁師古曰黃圖云龍淵廟在茂陵東不言宫也此言救決河而起龍淵宫即不在長安西矣又章帝賜尚書韓稜龍淵劒孟說是劉攽曰非因救河起宫黃圖所說是徳陽廟亦云宫韓稜傳楚龍淵注晉太康地記云汝南西平縣有龍淵水可淬刀劒汝南即楚分野史記公孫龍為堅白同異之辨注同國史志澶州濮陽縣有龍淵宫景紀中四年春三月起徳陽宫注臣瓉曰景帝廟也西京故事云景帝廟為徳陽漢宣防宫見河渠括地志故龍泉宫俗名瓠子宫在濮州濮陽縣北十里州西北九十里元光中河決瓠子塞決河之傍龍泉之側因以為名漢三雍宫三宫見明堂河間獻王傳獻王修學好古其學舉六蓺修禮樂被服儒術山東諸儒多從之游武帝時獻王來朝元光五年十月獻雅樂對三雍宫及詔策所問三十餘事其對推道術而言得事之中文約指明注三雍宫靈臺辟雍明堂也雍和也言天地君臣人民皆和也蓺文志儒家河間獻王對上下三雍宫五篇後桓榮傳永平二年三雍初成拜榮為五更李躬為三老每大射養老禮畢帝輒引榮及弟子升堂執經自為下說又中元元初建三雍漢扶荔宫黄圖在上林苑元鼎六年破南越起扶荔宫以植所得竒草異木菖蒲山薑桂龍眼荔支檳榔橄欖甘橘之類西京雜記初修上林苑羣臣遠方各獻名果異木亦有製為美名以標竒麗就上林令虞淵得朝臣所上草木名二千餘種宋朝嘉祐中劉敞守長安得林華宫行鐙銘蓮勺宫銅博山爐下槃銘皆漢五鳯中造金石録廩丘宫鐙銘甘露三年造宫不見于史漢首山宫高靈館武紀元封四年冬十月行幸雍通回中道孟康曰回中在北地武帝故宮黃圖云回中宫在汧六年冬行幸回中春作首山宫二月幸河東祠后土詔曰朕禮首山昆田出珍物化或為黃金祭后土神光三燭注應劭曰首山在上郡於其下立宫廟也文頴曰在河東蒲阪界師古曰文說是黃圖武帝元封元年封禪後夢高祖坐明堂朝羣臣於是祀高祖於明堂以配天作首山宫以為高靈館漢建章宫前殿鳯闕玉堂璧門天梁宫四殿漢宫室制度圖武紀太初元年二月起建章宫注師古曰在未央官西今長安故城西俗所稱正女樓即此宫之闕也太始四年五月還幸建章宫大置酒赦天下天漢四年夏征和元年春正月皆行幸史罕書臨幸皆從飛閣越城以出也郊祀志柏梁災太初元年十一月乙酉粤人勇之曰粤俗有火災復起屋必大用厭勝之於是作建章宫度為千門萬戸前殿度高未央其東則鳯闕高二十餘丈其西則商中商庭也西方之庭數十里虎圏其北治大池漸臺高二十餘丈名曰太液池中有蓬萊方丈瀛洲壺梁象海中神仙龜魚之屬其南有玉堂璧門大鳥之屬立神明臺井幹樓高五十丈輦道相屬焉東方朔傳陛下以城中為小圖起建章左鳯闕右神明號稱千門萬戸土木衣錦繡撞萬石之鍾擊雷霆之鼓使民不奢侈難矣能燔甲乙之帳却走馬示不復用堯舜可比矣史記東方朔傳建章後閣有騶牙見百官表太初元年置建章營騎李陵衛青為建章監青給事建章召為建章監侍中紀昭帝始元元年二月黃鵠下建章宫太液池中公卿上壽元鳯二年四月上有建章宫徙未央大置酒宣帝元康元年冬置建章衛尉甘露三年正月匈奴呼韓邪單于來朝置酒建章宫饗賜單于觀以珍寳元帝初元三年六月罷甘泉建章宫衛黃圖建章宫在長安城外於未央宫西跨城池作飛閣通建章宫構輦道以上下宮之正門曰閶闔高二十五丈亦曰璧門左鳯闕高二十五丈三輔舊事鳯凰闕武帝造高二十五丈五尺一名别風闕又曰嶕嶢闕門内二百步右神明臺門内北起别風闕高五十丈對峙井幹樓高五十丈連閣皆有罘罳前殿下視未央其西則廣中殿受萬人有玉堂函德等二十六殿太液池唐中池三輔舊事建章宮周回三十里又於宫門北造圓闕高二十五丈上有銅鳯皇古歌云長安城西有雙闕上有雙銅爵即銅鳯皇也闗中記上林苑中有宫十二建章其一也圓闕臨北道括地志建章宫在雍州長安縣西二十里長安故城西元和志同西都賦輦路經營修涂飛閣自未央而連桂宫北彌明光而亘長樂陵墱道而超西墉混建章而外屬東都賦建章甘泉館御列仙設璧門之鳯闕上觚稜而棲金爵内則别風之嶕嶢眇麗巧之竦擢張千門而立萬戸順陰陽而開闔爾乃正殿崔嵬層建厥高臨乎未央經駘盪而出馺娑洞枍詣以與天梁官名上反宇以葢戴激日景而納光注三輔故事曰建章宫有折風闕闗中記一名别風又闗中記曰建章宫有馺娑駘盪枍詣承光四殿黄圖駘盪宫春時景物滿官中也馺娑宫馬行迅疾一日遍宫中言宫之大也枍詣宫木名宫中美木茂盛也天梁官梁木至於天言官之高也四宫皆在建章宫又有竒華殿鼔簧宫神明鬰其特起遂偃蹇而上躋軼雲雨於大半虹霓迴帶於棼楣攀井幹而未半目眴轉而意迷步甬道以縈紆又杳窱而不見陽排飛闥而上出若遊目於天表似無依而洋洋前唐中而後太液覽滄海之湯湯注未央官在西長樂在東桂宫明光宫在北建章宫在城西西京賦柏梁既災越巫陳方建章是經用厭火祥營宇之制事兼未央圓闕竦以造天若雙碣之相望鳯騫翥於甍標咸遡風而欲翔閶闔之内别風嶕嶢干雲霧而上達狀亭亭以岧岧神明崛其特起井幹疊而百層上飛闥而仰眺正睹瑤光與玉繩馺娑駘盪枍詣承光反宇業業飛檐䡾䡾流景内照引曜日月天梁之宫實開高闈長廊廣廡連閣雲蔓閈庭詭異門千戸萬珍臺蹇産以極壯嶝道邐倚以正東似閬風之遐坂橫西洫而絕金墉城尉不弛柝而内外潜通前開唐中顧臨太液清淵洋洋神山峩峩列瀛洲與方丈夾蓬萊而駢羅立脩莖之仙掌承雲表之清露屑瓊蘂以朝餐必性命之可度薛琮注圓闕上作鐵鳯凰令張兩翼舉頭敷尾以函屋上下有轉樞向風如將飛晉張華傳武帝嘗問漢宫室制度及建章千門萬戸華畫地成圖左右屬目帝甚異之漢迎年宫延年宫望仙宫郊祀志太初三年上東巡海上考神仙之屬未有驗者方士有言黃帝時為五城十二樓崑崙玄圃五城十二樓仙人所居以候神人於執期地名名曰迎年若言析年上許作之如其方名曰祈年上親禮祀上犢黃焉太始三年東幸琅邪禮日成山登之罘地理志東萊腄縣有之罘山祠也浮大海用事八神延年即迎年也太按元封元年四月癸卯封山詔用事八神漢宫閣名長安有祈年宫延壽宫漢武故事長安有通天宫郭子橫洞㝠記元封三年起望仙宫漢明光宫明光殿省武紀太初四年秋起明光宫注師古曰黃圖云在城中元后傳成都侯商病欲避暑從上借明光宫注在城内近桂宫平紀元始元年六月罷明光宫及三輔馳道黃圖明光宫在長樂宫後南與長樂宫相屬武帝求仙起明光宫發燕趙美女二千人充之三秦記曰桂宫中有明光殿皆金玉珠璣為簾箔處處明月珠晝夜光明明光殿以金為戺玉為階一本云此宫在甘泉宫中西都賦彌明光而亘長樂注三輔舊事曰桂宫内有明光殿西京賦屬長樂與明光徑北通于桂宫注明光殿直北通桂宫漢官儀尚書奏事於明光殿省中以丹朱采地曰丹墀尚書伏其下奏事程氏以此殿為東都之殿後漢門名有建禮門黃門侍郎揖疏受事程大昌曰漢有明光宫三一在北宮與長樂相連一在甘泉宫中一為尚書奏事之地漢桂宫四寳宫北宫三輔黃圖桂宫漢武帝太初四年秋起周回十餘里一本云周匝四十里在未央宫北元和志在長安縣北十三里長安故城中漢書桂宫有紫房複道通未央宫關輔記桂宫通未央宫北中有明光殿土山複道從宫中西上城西至建章宫神明臺蓬萊山三秦記未央宫漸臺西有桂宫中有明光殿皆金玉珠璣為簾箔綴明月珠金戺玉階晝夜光明西京雜記武帝為七寳牀雜寳案寳屏風列寳帳設於桂宫時人謂之四寳宫長安記曰桂宮在未夾宮北亦曰北官北宫在長安城中近桂宫俱在未央宫北周回十里高帝時制度草創孝武增修之中有前殿廣五十步珠簾玉戸如桂宫漢書曰孝惠孝成皇后廢處北宫哀帝皇后居桂宫西都賦輦路經營修塗飛閣自未央而連桂宫西京賦鈎陳之外閣道穹窿屬長樂與明光徑北通乎桂宫郊祀志置壽宫北宫括地志在長安西北十三里張羽旗設共具以禮神君神君所言上使受書名曰畫法策畫之法東方朔傳武帝嘗從董偃游戲北宫馳逐平樂於是上為竇太主置酒宣室朔時陛㦸殿下辟㦸而前有詔更置酒北宮引董君從東司馬門入更名東交門霍光傳昌邑王駕法駕皮軒鸞旗驅馳北宫桂宫注師古曰在未央宫北宣紀元康四年三月詔曰神爵集北宫成紀為太子居桂宫上嘗急召太子出龍樓門不敢絕馳道師古曰黃圖桂宫在城中近北宫非太子宫建始二年三月北宫井水溢出平紀孝哀皇后傅氏退居桂宫注師古曰桂宫在城中非未央宫中孔光傳光議定陶太后宜改築宫何武曰可居北宫上從武言北宫有紫房複道通未央宫傅太后果從複道朝夕至帝所漢長信宫永信宫中安宫長秋宫儲元宫永樂宫東宫東朝哀紀綏和二年上即位五月丙戌尊定陶太后丁姬各置左右詹事食邑如長信宫中宫注成帝母王太后居長信宫中宫皇后之宫建平二年夏四月詔尊共皇太后曰帝太太后稱永信宫共皇后曰帝太后稱中安宫百官志詹事屬官有長信詹事掌皇太后宫景帝中六年更名長信少府平帝元始四年更名長樂少府注居長信宫則曰長信居長樂宫則曰長樂東方朔傳武帝夜出夕還齎五日糧㑹朝長信宫注五日一朝長信宫故齎五日糧長信太后之宫也霍光傳出入長信宫殿中通籍長信宫王嘉傳哀帝為董賢治器自貢獻宗廟三宫猶不至此劉原父曰太皇太后稱長信宫傅太后永信宫丁姬中安宫故稱三宫班媫妤傳求共養太后長信宫上許之退處東宫作賦曰奉共養於東宫託長信之末流杜欽傳唯陛下數御安車由輦道親二宫之饔膳注韋昭曰卭成太后與成帝母續志帝祖母稱長信宫故有長信少府後漢都洛陽亦有長信宫長樂宫又有長秋宫長漢官儀帝祖母稱長信宫帝母稱樂宮後曰永樂黄圖云長樂殿西有長信宫長秋殿又云后宫在西秋之象也秋主信故以長秋長信為名水經亦曰殿西有長信長秋等殿則皆在長樂宫中也長安志别出長信等七宫不以統諸長樂殆傳疑也百官表將行秦官景帝中六年更名大長秋詹事屬官有中長秋注師古曰秋者秋成之時長者常久之義故以為皇后宫名馮昭儀傳為信都太后與王俱居儲元宫注師古曰黃圖在上林苑中後后紀馬后永平三年春有司奏立長秋宫注皇后所居宫也長者久也秋者萬物成熟之初也故以名焉匽后和平元年尊為孝崇皇后宫曰永樂置太僕少府以下皆如長樂宫董后尊號曰孝仁皇后居南宫嘉德殿宫稱永樂叔孫通傳惠帝為東朝長樂宫及間往數蹕煩民作複道方築武庫南爰盎傳上朝東宫趙談驂乗張湯傳呉楚七國反景帝往來東宫間田蚡傳武帝二年御史大夫趙綰請毋奏事東宫竇太后灌夫傳東朝廷辯之注如淳曰東朝太后朝也夏侯勝傳羣臣奏事東宫太后省政勝用尚書授太后許后傳成帝報曰其孝東宫毋闕朔望注東宫太后所居也劉向言王氏依東宮之尊叙傳上朝東宫太后曰班侍中伯大將軍所舉宜寵異之伯每朝東宫常從漢後宫八區後宫十四位椒房掖庭十四級班倢伃傳為倢伃居增成舍注應劭曰後宫有八區増成第三黃圖武帝時後宫八區有昭陽飛翔增成合歡蘭林披香鳯皇鴛鴦等殿西都賦後宫則有掖庭椒房后妃之室合歡增成安處常寧茞若椒風披香發越蘭林蕙草鴛鸞飛翔之列注黃圖長樂宫有椒房殿漢宫闕名有合歡披香鴛鸞飛翔殿餘亦殿名新論曰董昭儀居舍號曰椒房昭陽特盛隆於孝成注昭陽殿名孝成趙皇后弟絕幸為昭儀居昭陽舍屋不呈材牆不露形裛以藻繡絡以編連隨珠明月錯落其間金釭銜璧是為列錢翡翠火齊流耀含英懸黎垂棘夜光在焉於是玄墀釦砌玉階彤庭碝磩采緻琳珉青熒珊瑚碧樹周阿而生紅羅颯纒綺組繽紛精曜華燭俯仰如神後宫之號十有四位窈窕繁華更盛迭貴西京賦後官則昭陽飛翔增成合驩蘭林披香鳯皇鴛鸞館室次舍采飾纎縟裛以藻繡文以朱緑金戺玉階彤庭輝輝珊瑚琳碧瓀珉璘彬珍物羅生煥若崐崘雖厥裁之不廣侈靡踰乎至尊列爵十四競媚取榮盛踰無常惟愛所丁外戚傳漢帝母稱皇太后祖母稱太皇太后適稱皇后妾皆稱夫人又有美人良人八子七子長使少使之號武帝制偼伃娙娥傛華充依各有爵位而元帝加昭儀之號凡十四等云注自昭儀以下至秩百石十四等昭儀位視丞相偼伃視上卿娙娥視中二千石傛華視真二千石美人視二千石八子視千石充依視千石七子視八百石良人視八百石長使視六百石少使視四百石五官視三百石順常視二百石無涓共和娛靈保林良使夜者皆視百石上中家人子視有秩斗食後皇后紀秦并天下官備七國爵列八品漢興因循其號武元之後掖庭三千増級十四光武中興六宫稱號惟皇后貴人金印紫綬又置美人宫人采女三等並無爵秩霍光傳上官桀有椒房中宫之重注師古曰椒房殿名皇后所居以椒和泥塗壁取其温芳也在未央宫谷永傳願抑損椒房玉堂之盛寵許后傳省減椒房掖庭用度後第五倫傳椒房之親注后妃以椒塗壁取其繁衍多子故曰椒房禮内宰六宫注若今稱皇后為中宫疏漢舊儀有此事漢犬臺宫江充傳召見犬臺宫黃圖在長安西二十八里上有犬臺宫外有走犬觀漢鉤弋宫堯母門趙偼伃傳居鉤弋宫太始三年生昭帝號鉤弋子十四月乃生命所生門曰堯母門注黃圖宫在城外漢武故事在直門南括地志在長安城中黄圖林光宫中有長定宫三輔決錄曰后從帝行幸甘泉宫居長定宫長門宫在長安城孝武陳后居之東方朔傳竇太主獻長門園更名長門宫注如淳曰長門在長安城東南昭臺宫在上林苑中西京雜記趙王如意年幼未就外傅使趙媪傅之號其室曰養徳宫後改為魚藻宫漢交門宫鼎湖宫武紀太始四年夏四月幸不其祠神人于交門宫若有鄉坐拜者作交門之歌注晉灼曰琅邪縣有交門宫武帝所造黃圖鼎湖宫在湖城縣界晉灼曰在藍田引黃圖昔黃帝採首山銅以鑄鼎鼎成有龍下迎帝仙去小臣攀龍髯而上者七十二人漢武帝於此建宫詳見郊祀志漢萬歲宫亭黃圖萬歲宫武帝造汾陰有萬歲宫宣帝元康四年幸萬嵗宫神爵翔集以元康五年為神爵紀元宣紀神爵元年正月行幸甘泉郊祀泰畤三月幸河東祠后土詔曰迺元康四年嘉穀元稷降于郡國神爵仍集金芝九莖産於函德殿銅池中九真獻竒獸南郡獲白虎威鳯為寳朕之不明震于珍物飭躬齋精祈為百姓東濟大河天氣清靜神魚舞河幸萬歲宫神爵翔集注服䖍曰萬歲宫在東郡平陽縣今有津晉灼曰黃圖汾陰有萬歲宫是時幸河東師古曰晉說是後黃瓊傳順帝永建中公車召瓊李固遺書曰聞渡伊洛在萬歲亭注亭在洛州嵩陽縣西北武帝元封元年登太室聞山呼萬歲者三因以名亭又桓帝紀注洛陽夏門外有萬歲亭三齊記曲城齊城東有萬歲水水北有萬歲亭漢武所造西征記戴延之漢武帝於太室山作登仙臺及萬歲亭漢日華宫黄圖河間獻王德築日華宫置客館二十餘區以待學士又見西京雜記梁孝王作曜華宫築兎園有鴈池鶴洲鳬渚廣川王太后居長壽宮漢步夀宫郊祀志神爵二年正月鳯皇集祋祤於所集得玉寳起步壽宫迺下詔赦天下厥後五鳳紀年鳳皇名殿黃圖秦亦有步壽宫今按其地與秦異則秦漢各有步壽宫秦在新豐縣步髙宫西漢宫閣名長安有延壽宫祈年宫元和志漢步壽宫在華原縣東北三里本漢祋祤隋志京兆渭南有步壽宫初學記黄圖曰京兆有步髙宫元和志秦步髙宫在渭南縣西南二十里有熊迎年孝武益壽漢太子宮疏廣傳宣帝幸太子宫受為家令迎謁應對及置酒宴奉觴上夀王褒傳詔使褒等皆之太子宫虞侍太子朝夕誦讀竒文及所自造作太子喜褒所為甘泉及洞簫頌成紀元帝在太子宫生甲觀畫堂帝為太子初居桂宫師古曰三輔黃圖桂宮在城中近北宮非太子官元后傳送政君太子宫見丙殿甘露三年生成帝於甲館畫堂為世適皇孫哀紀定陶王立為皇太子謝曰材質不足以假充太子之宫戾太子傳及冠就宫上為立博望苑後班彪傳中宗令劉向王褒蕭望之周堪之徒保訓東官申屠剛傳言皇太子宜時就東宫簡任賢保以成其德陰識傳守執金吾輔導東宫漢陽靈宫揚雄甘泉賦葢天子穆然珍臺閒館璇題玉英蜵蜎蠖濩之中惟夫所以澄心清魂儲精垂思感動天地逆釐三神者迺搜逑索耦臯伊之徒冠倫魁能函甘棠之思挾東征之意相與齊乎陽靈之宫注齊同也祭天之所故曰陽靈之宫也集乎禮神之囿登乎頌祇之堂漢萯陽宫屬玉觀紀宣帝甘露二年十二月行幸萯陽宫屬玉觀注應劭曰宫在鄠秦文王所起成帝元延二年冬行幸長楊宫大獵宿萯陽宫賜從官黄圖萯陽宫東方朔傳作倍陽在今鄠縣西南二十三里元和志同西都賦天子登屬玉之館歴長楊之榭以玉飾因名焉漢池陽宫宣紀甘露三年春正月呼韓邪單于來朝使有司道單于先行就邸長安宿長平上自甘泉宿池陽官上登長平阪詔單于母謁黄圖池陽宫在池陽南上原之阪去長安五十里或謂即秦蘭池之陽八元和志在涇陽縣西北里地理志左馮翊池陽縣惠帝四年置應劭曰在池水之陽東方朔傳武帝微行北至池陽百官表有胡騎校尉掌池陽胡騎屯於池陽者後章紀建初七年十月幸長安進幸長平御池陽宫東至南陵造舟於涇而還漢蒲陶宫匈奴傳元壽二年單于來朝以太歲厭勝所在舍之上林苑蒲陶宫告之以加敬單于黄圖蒲陶宫在上林苑漢神光宫文選揚子雲羽獵賦入西園切神光注張晏曰神光宫名初學記黄圖長安有望逺宫漢蘭池宫地理志扶風渭城縣有蘭池宫楊僕傳受詔不至蘭池宫文選西都賦注黄圖曰蘭池觀在城外長安圖曰周氏陂南一里漢有蘭池宫黄圖秦始皇三十一年微行咸陽逢盗蘭池注渭城縣有蘭池宫史記景紀馳道木填蘭池正義秦蘭池在雍州咸陽縣界三秦記云始皇都長安引渭水為長池築為蓬萊山刻石為鯨長二百丈元和志秦蘭池宫在咸陽縣東二十五里蘭池陂即秦之蘭池也在縣東二十五里初始皇引渭水為池東西二百里南北二十里築為蓬萊山刻石為鯨魚長二百丈唐書太宗出征突厥高祖餞之蘭池宫漢濟陽宫鳯皇廬光武碑光武紀南頓君初為濟陽令以建平元年乙卯歲十二月甲子夜生光武於縣舍有赤光照室中是歲縣界有嘉禾生一莖九穗因名曰秀注蔡邕光武碑文云光武將生皇考以令舍不顯開宮後殿居之而生建武五年十二月詔復濟陽二年徭役注帝生於濟陽宫明紀永平五年十月詔豐沛濟陽受命所由加恩報德適其宜也安紀延光三年二月丙子東狩丁丑告陳留太守祠南頓君光武于濟陽郡國志陳留郡濟陽注有行宫光武生呉都賦注光武紀云濟陽有武帝行過宮論衡光武以建平元年十二月甲子生於濟陽宫後殿第二内中室内自明是歲嘉禾生三本一莖九穗長於禾一二尺元帝之初有鳯皇下濟陽故今濟陽宫有鳯皇廬始與李父等俱起遇賊兵走濟陽舊廬見光若火正赤在舊廬道南光燿上屬天水經注云光明照室蔡邕光武濟陽宫碑帝乃龍見白水淵躍昆滍云云先民有言樂樂其所自生禮不忘其本是以虞稱媯汭姬美周原作頌曰應期潜見扶陽而飛漢懷宫光武紀建武元年八月癸丑祠高祖太宗於懷宫列傳伏隆建武二年詣懷宮光武親接之范升建武三年召詣懷宫拜議郎耿純世祖即位從攻王郎還詣懷宫注懷河内縣名有離宫枚叔七發乃下置酒於虞懷之宫漢洛陽南宫又見上却非殿九龍殿前殿光武紀建武元年七月圍朱鮪於洛陽九月朱鮪舉城降十月癸丑車駕入洛陽幸南宫却非殿遂定都焉十四年正月起南宫前殿注蔡質漢典職儀云南宫至北宫中央作大屋複道三行天子從中道從官夾左右十步一衛兩宫相去七里又洛陽宫閣名有却非殿順帝紀帝即位尚書以下從輦到南宫登雲臺又質帝桓帝迎入南宫即位馬后紀諸貴人徙居南宫五行志南宫宣室殿承善闥黄龍千秋萬歲殿長秋和歡殿鉤盾掖傳論顯宗圖二十八將於南宫雲臺列傳張酺永平九年顯宗為四姓小侯開學於南宫酺數講於御前馮魴永平十五年東巡郡國留魴宿衛南宫賈逵建初元年詔入講北宫白虎觀南宫雲臺東平王蒼建初三年帝饗衛士於南宫因從皇太后周行掖廷池閣因閱陰太后舊時衣服賜蒼及琅邪王京書鄭弘章帝以前後所陳補益王政皆著之南宫以為故事謝承漢書明帝條沛相李壽前後所上便宜為南宮故事楊賜靈帝徙南宫閱録故事得所上張角奏及前侍講注籍乃感悟下詔封賜臨晉侯宦者傳靈帝修南宫玉堂東都賦皇城之内宫室光明闕庭神麗奢不可踰儉不能侈李通傳建武二年拜大司農帝每征討四方常令通居守京師鎮撫百姓修宮室起學宮東京賦於南則前殿雲臺和歡安福謻門曲榭邪阻城洫竒樹珍果鉤盾所職西登少華亭候修飭九龍之内實曰嘉德西南其戸匪彫匪刻我后好約乃宴斯息九龍本周時殿名也門上有三銅柱三龍相糾繞故曰九龍嘉德殿名在九龍門内也我后謂明帝也桓帝延熹二年南宮嘉德殿黄龍見又有朱雀蒼龍白虎玄武闕司馬門掖門承明門金馬門鴻都門青瑣門崇德殿宫之正門也章德殿宫之前殿也有玉堂前後殿明光殿建始殿東有太倉武庫又有鳯皇黄龍千秋萬歲殿雲臺一作靈臺阿閣蘭臺東觀仁壽闥咸在焉洛陽宮又有却非門曰漢表云分為二是周有逃責之臺注劉德雒陽南宫謻臺也漢太駕宫修西京宫室六王邸光武紀建武十九年修西京宫室杜篤傳篤以關中表裏山河先帝舊京不宜改營洛邑乃上論都賦曰皇帝以建武十八年二月甲辰升輿洛邑巡于西岳推天時順斗極排閶闔入函谷觀阸於殽黽圖險於隴蜀其三月丁酉行至長安經營宫室傷愍舊京遂天旋雲遊造舟于渭北􅣆涇流衍陳於岐梁東横乎大河瘞后土禮邠郊四月反于洛都明年有詔復函谷關作大駕宫胡廣漢制度曰天子出有大駕法駕小駕大駕言即天子行幸也六王邸高車廏於長安修理東都城門長安外城門橋涇渭往往繕離觀東臨灞滻西望昆明北登長平規龍首橅末央覛平樂儀建章漢洛宫三宫東京賦昔先王之經邑也審曲面勢泝洛背河左伊右瀍西阻九阿東門于旋盟津達其後太谷通其前太室作鎮揭以熊耳底柱輟流鐔以大岯龍圖授羲龜書畀姒召伯相宅卜惟洛食周公初基其繩則直經涂九軌城隅九雉度堂以筵度室以几京邑翼翼四方所視世祖龍飛白水鳯翔參墟叡喆玄覽都兹洛宫曰止曰時昭明有融既光厥武仁洽道豐登岱勒封與黄比崇逮至顯宗六合殷昌乃新崇德殿名在東遂作德陽西啓南端之特闈立應門之將將昭仁惠於崇賢東門抗義聲於金商西門飛雲龍東門於春路屯神虎西門於秋方建象魏於兩觀旌六典之舊章其内則含德章臺天祿宣明温飭迎春壽安永寧八殿在應門之内飛閣神行莫我能形於南則前殿路寢雲臺龢驩安福謻門外室門也曲榭邪阻城洫九龍周時殿名之内實曰嘉德西南其戸匪彫匪刻我后好約乃宴斯息於東則鴻池清籞緑水澹澹其西則平樂都場示逺之觀李尤賦曰設平樂之顯觀處金商之維陬龍雀飛亷也蟠蜿天馬銅馬也半漢經始勿亟成之不日猶謂為之者勞居之者逸慕唐虞之茅茨思夏后之卑室乃營三宫布教頒常複廟重屋八達九房謂明堂規天矩地授時順鄉造舟清池維水泱泱左制辟雍右立靈臺因進拒衰表賢簡能馮相觀祲祈裭禳災薛綜注徳陽殿東有辟雍西有靈臺謂於其上班教令者曰明堂大合樂射鄉者曰辟雍司厯紀侯節氣者曰靈臺東都賦至于永平重熙累洽增周舊修洛邑扇巍巍顯翼翼光漢京于諸夏總八方而為極皇城之内宫室光明闕庭神麗奢不可踰儉不能侈賦序云京師修宫室浚城隍起苑囿以備制度漢北宫又見上紀明帝永平三年起北宫及諸官府夏旱鍾離意諌曰成湯六事自責今宫室大作人失農時所謂宮室榮也八年十月北宫成和帝永元四年四月庚申幸北宫順帝召虎賁羽林士屯南北宫諸門文選注蔡質漢官典職曰南宫北宮相去七里中間作大屋複道三行竇后章見於北宫章德殿鄧后和自御北宫增喜觀閱問宫人即日遣五六百人列傳鍾離意永平三年夏旱而大起北宫意詣闕上疏帝敇太匠止作諸宫減省不急遂應時注雨後德陽殿成百官大㑹帝思意言謂公卿曰鍾離尚書在此殿不立注漢宫殿名曰北宫中有德陽殿井丹建武末沛王輔等五王居北宮皆好賓客請丹不能致逸民賈逵入講北宫白虎觀張禹永元十五年以太尉兼衛尉留守注東觀記曰留守北宮馬融陽嘉二年對策北宫端門五行志有北宫盛饌門閣東掖庭漢濯龍宫池桓紀延熹五年十月換王侯租以助軍糧出濯龍中藏錢還之九年七月庚午祠黄老於濯龍宫論曰飾芳林以考濯龍之宫設華葢以祠浮屠老子注續漢志祠老子於濯龍宫用郊天樂馬后紀明帝幸濯龍中諸才人下邳王以下在側請呼皇后帝笑曰是家志不好樂雖來無歡建初二年太后詔曰前過濯龍門見外家問起居者車如流水馬如游龍置織室蠶於濯龍中數往觀視以為笑樂注續漢志曰濯龍園名也近北宫少府屬官有濯龍監一人四百石李雲傳桓帝在濯龍池管霸奏雲等事李尤賦德陽之北斯曰濯龍文㮰曜水甘果成叢洛都賦傳毅顧濯龍之臺觀淳清沼以汎舟東京賦濯龍芳林九谷八溪芙蓉覆水秋蘭被涯注洛陽圖經曰濯龍池名漢胡桃宫匈奴傳順帝漢安二年六月丙寅立南單于兠樓儲詔太常祖㑹饗賜作樂角抵百戲帝幸胡桃宮臨觀之漢承光宫种暠傳順帝擢暠監太子於承光宫百官志永安丞一人永安北宫東北别小宫名有園觀洛陽宫殿名曰永安宫周迴六百九十八丈故基在洛陽故城中苑中丞主苑中離宫李尤永安宫銘合歡黄堂中和是遵候臺集道俾司星辰晉紀太元二十一年四月新作永安宫漢宫閣簿宫闕疏鼓簧宫唐志漢宫閣簿三卷洛陽宮殿簿二卷文選注引漢宫閣名長安有鴛鸞殿又引漢宫殿疏曰長安有鴈鶩陂又引晉宫闕名西都賦注引漢宫闕疏景福殿賦注引洛陽宫殿簿上林賦注引漢宫殿簿漢書顔師古注引漢宫閣疏黄圖鼓簧宫漢宫閣疏云周匝一百三十步在建章宫西北光武紀注洛陽宫殿名有却非殿漢宫閣疏曰靈臺高三丈十二門蜀漢新宫蜀都賦金城石郭兼帀中區既麗且崇實號成都闢二九之通門畫方軌之廣塗營新宫於爽塏擬承明而起廬注新宫宫名漢有承明廬此擬而起之魏洛陽宫太極殿建始殿承明廬紀文帝黄初元年十二月初營洛陽宫戊午幸洛陽注臣松之曰時帝居北宮以建始殿朝羣臣門曰承明陳思王植詩曰謁帝承明廬至明帝始於漢南宫崇德殿處起太極昭陽諸殿魏畧魏有鄴宫蓉洛陽宮殿簿有魏太極九龍芙九華承光諸殿明帝青龍三年三月大治洛陽宫起昭陽太極殿築總章觀高十餘丈建翔鳳于上晉初學記厯代殿名或㳂或革惟魏之太極自以降正殿皆名之張遼傳黄初二年遼朝洛陽宫文帝引㑹建始殿親問破呉意狀魏都賦經始之制牢籠百王畫雍豫之居寫八都之宇高門有閌築室百堵思重爻摹大壯造文昌之廣殿極棟宇之宏規長庭砥平鍾虡夾陳巖巖北闕南端攸遵西闢延秋東啓長春左則中朝有赩聽政作寢前則宣明顯陽順德崇禮重闈洞出鏘鏘濟濟禁臺省中連闥對廊藹藹列侍金蜩齊光後則椒鶴文石永巷閫術楸梓木蘭次舎甲乙西南其戸成之匪日丹青炳煥特有温室魏許昌宫紀文帝黄初三年正月庚午行幸許昌宫四年九月甲辰行幸許昌宫五年七月幸許昌宫明帝太和六年四月壬寅行幸許昌宫九月治許昌宮起景福承光殿十二月行還許昌宮青龍三年十一月丁酉行幸許昌宫卞蘭許昌宮賦入南端以北眺望景福之嵯峨望舒涼室羲和温房楊脩許昌宫賦置天臺於辰角列執法於西南元和志許昌宫在許昌故城中漢建安元年都許呉太初宮呉志孫權赤烏十年三月改作太初宫注權以建業宫南宫腐朽徙武昌宫材瓦繕治孫皓寳鼎二年六月起顯明宫注吳有太初宫方三百丈權所起也昭明宫方五百丈皓所作也避晉諱故曰顯明在太初之東志又有蒼龍門白虎門黄龍元年九月權遷都建業因故府不改館召陸遜輔太子登掌武昌留事建康建都自呉及陳三百二十一年晉咸和新宫成帝紀兼王導傳咸和四年二月蘓峻平宫闕灰燼以建平園為宫温嶠議遷都豫章三呉之豪請都㑹稽二論紛紜未有所適王導曰金陵舊為帝里又孫仲謀劉玄德俱言王者之宅古之帝王未必以豐儉移都茍弘衛文大帛之冠則無往不可且北冦䰟游伺我之隙一旦示弱竄於蠻越求之望實俱非良計以咸和五年九月造新宫王彬為大匠繕苑城修六門七年十二月庚戌帝遷於新宫八年正月辛亥朔詔曰既獲臨御大饗羣后九賓充庭百官象物晉崇化宫弘訓宫崇德宫崇訓宫紀武帝泰始元年十二月丁卯尊王太后宫曰崇化二年正月辛丑尊羊皇后宫曰弘訓穆帝升平元年正月褚太后居崇德宫褚皇后傳穆帝㓜冲后臨朝帝既冠反崇德宮孝武太元十九年八月己巳尊李太后宫曰崇訓晉太元新宫太極殿孝武紀太元三年春二月乙巳作新宫七月辛巳帝入新宫新宫内外殿宇大小三千五百間十七年八月新作東宫二十一年正月造清暑殿宋孝武帝有華林清暑殿賦謝安傳孝武時宫室毁壞安欲繕之尚書令王彪之等以外冦為諫安竟獨決之宫室用成皆仰模玄象合體辰極而役無勞怨王獻之傳太元中新起太極殿時建太極殿有梅木流至以為梁因畫花於梁以表瑞謝安欲使獻之題榜以為萬代寳而難言之以魏韋仲將書凌雲殿榜諷之獻之曰仲將魏之大臣寧有此事徐爰晉紀孝武寧康二年尚書令王彪之等改作新宫太元三年二月内外軍六千人始營築至七月而成太極殿高八丈長二十七丈尚書謝萬監視賜爵關内侯大匠毛安之關内侯梁書天監十二年改造太極殿王規獻新殿賦陳徐陵有銘玉海卷一百五十六
