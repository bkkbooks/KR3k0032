body:
  text: 玉海卷七十八宋王應麟撰車服車服制度周車服制度周宫室車服制周書序車服制度民不茍踰作器服周道於焉大備器服解第七十文多殘闕食器甒參笙一竽皆素桃枝素獨蒲簟席皆素斧巾玄繢緌縞冠素紕玄冠組武卷組纓象琪繢瑱絺紳帶象玦云云布獨巾玄象玄純周禮大司徒十二教其九曰以度教節則民知足注度謂宫室車服之制疏謂若典命云上公九命國家宫室車旗衣服禮儀及侯伯子男以下各依命數是其制度也小宗伯掌衣服車旗宫室之賞賜其制見大行人典命掌諸侯五儀諸臣五等之命上公九命為伯國家宫室車旗衣服禮儀皆以九為節侯伯七命其國家宫室車旗衣服禮儀皆以七為節子男五命其國家宫室車旗衣服禮儀皆以五為節王之三公八命其卿六命大夫四命國家宫室車旗衣服禮儀亦如之公之孤四命其卿三命大夫再命士一命侯伯卿大夫士如之子男之卿再命大夫一命其士不命各視其命之數注國家謂城公城方九里宫方九百步侯伯城七里宫七百步子男城五里宫五百步巾車服車五乘孤乘夏篆卿乘夏縵大夫墨車士棧車庶人役車司服公之服自衮冕而下如王之服侯伯服自鷩冕下如公子男自毳冕下如侯伯孤自希冕下如子男卿大夫自玄冕下如孤士之服自皮辨下如大夫大行人上公冕服九章建常九斿樊纓九就二車九乘侯伯冕服七章建常七斿樊纓七就二車七乘子男冕服五章建常五斿樊纓五就二車五乘司約治器之約注謂禮樂車服所得用書舜典車服以庸又益稷注以功大小為差覲禮天子賜侯氏以車服注賜車者同姓金路異姓象路服則衮鷩毳周官五服車旗宫室之禁則小宗伯辨之衣服宫室車旗禁令則家宗人掌之宫室衣服禮儀則典命掌之周車服周五等車服月令注凡此車馬衣服皆所取於殷時而有變焉非周制也周禮朝祀戎獵車服各以其事不以四時為異疏虞夏之制有日月星辰十二章之服周之制朝祀戎獵車服各有殊今此下與周禮不同上與虞夏又異故云取殷時殷乘木路此乘鸞路不純用殷故云而有變焉謂變殷而乘虞路也周禮朝則皮辨服祀則六冕服戎則韋辨服田獵冠辨服朝乘象路祀乘玉戎乘革獵乘木路不以四時為異也郊特牲正義周武王尚文物車服之屬而得民心周人尚輿是也宋志周制五等車服相涉公降王者一等而已選注尚書大傳曰未命為士車不得有飛鈴又曰不得朱軒鄭玄曰如今忩車漢書先王車服之制各有差品小不得僭大賤不得踰貴故上下序民志定詩都人士正義書傳云古者必有命民得乘飾車駢馬衣文錦周禮疏案唐傳云古之帝王必有命民於其君得命然後得乘飾車駢馬衣文錦仲尼車服禮器魯孔氏車孔子世家太史公曰適魯觀仲尼廟堂車服禮器余低回不能去世家曰所居堂後世因廟藏孔子衣冠琴車書東平王傳章帝建初三年賜蒼及琅邪王京書今魯國孔氏尚有仲尼車輿冠履明德盛者光靈遠也注孔子廟在魯曲阜城中伍緝之從西征記曰魯人藏孔子所乘車廟中是顔路所請者郡國志注漢晉春秋鍾離意相魯治孔子廟同觀輿服在焉意别傳曰意省堂有孔子小車乘皆朽敗意治之及護几杖劍屨後得甕中素書曰護吾屨鍾離意又見意傳注前儒林傳魯諸儒持孔氏之禮器往歸陳王漢長吏車服令景紀中六年五月詔曰吏者民之師也車駕衣服宜稱吏六百石以上皆長吏也或不吏服出入閭里與民無異令長吏二千石車朱兩轓千石至六百石車朱左轓取騎從者不稱其官衣服下吏出入閭巷無吏體者二千石上其官屬三輔舉不如法令者皆上丞相御史請之先是吏多軍力車服尚輕故為設禁時未有三輔紀誤鮑宣傳哀帝初遷豫州牧司直郭欽奏宣行部乘傳去法駕駕一馬舍宿鄉亭為象所非宣坐免陳遵傳遵為河南太守司直陳崇劾遵乘藩車入門巷差汙印韍西漢之俗樂易有餘節亷不足觀陳遵之事至季世俗尚未改也後方術傳謝夷吾行春乘柴車從兩吏兾州刺史上其儀序失中有損國典班固敘傳注國家不設車旗衣服之禁後漢志注謝承書曰州别駕從事車前舊有屏星如刺史車曲翳儀式刺史欲去别駕車屏星孔恂諌曰毁國舊儀即投傳去漢天漢輿服制通典武帝天漢四年始定輿服之制郊祀所乘謂之大駕車千乘騎萬匹其儀甚盛續輿服志秦并天下攬其輿服上選以供御次以錫百官景帝中元五年始詔六百石施車轓得銅五末軛有吉陽筒中二千石以上右騑三百石以上皂布蓋千石以上皂繒覆蓋二百石以上白布蓋皆有四維杠衣賈人不得乘馬車除吏赤畫杠餘皆青云注古今注曰武帝天漢四年令諸侯王大國朱輪特虎居前左兕右麋小國朱輪畫特熊居前寢麋居左右又見甘泉鹵簿晉輿服志云云齊輿服志漢武天漢四年朝諸侯甘泉宫定輿服制班於天下成紀永始四年六月甲午詔曰聖王明禮制以序尊卑異車服以章有德今公卿列侯親屬近臣車服過制其申敕有司以漸禁之青緑民所常服且勿止列侯近臣各自省改平紀元始三年夏奏車服制度西域傳龜兹王樂漢衣服制度歸其國治宫室作徼道周衛出入傳呼撞鍾鼓如漢家儀漢永平車服制度車服科品帝紀明帝永平二年春正月辛未宗祀光武皇帝於明堂帝及公卿列侯始服冠冕衣裳玉佩絇屨以行事十二年五月丙辰詔曰車服制度恣極耳目田荒不耕遊食者衆有司其申明科禁宜於今者宣下郡國高紀八年春三月令爵非公乘以上毋得冠劉氏冠賈人毋得衣錦繡綺縠絺紵罽操兵乘騎馬注乘駕車也章帝建初二年三月辛丑詔曰貴戚近親奢縱無度今自三公並宜明糾非法其科條制度所宜施行在事者備為之禁先京師而後諸夏安帝永初元年九月庚午詔三公申明舊令禁奢侈無作浮巧之物元初五年七月丙子詔曰舊令制度各有科品欲令百姓務崇節約而小人嫁娶送禮紛華靡麗至有走卒奴婢被綺縠著珠璣且復重申以觀後效永元初何敞諫濟南王康曰輿馬臺隸應為科品桓帝永興二年二月癸卯詔曰其輿服制度有踰侈長飾者宜皆損省郡縣務存儉約申明舊令如永平故事東平王傳中興三十餘年四方無虞蒼以天下化平宜修禮樂乃與公卿共議定南北郊冠冕車服制度東觀書永平二年正月公卿議春南北郊蒼議云云明德后紀外親美車服不軌法度者絶屬籍廣平巨鹿樂成王車騎朴素賜錢各五百萬中外從化被服如一續志諸車之文乘輿倚龍伏虎􅏹文畫輈皇太子諸王倚虎伏鹿轓吉陽筒朱班輪鹿文飛鈴九斿降龍公列侯倚鹿伏熊黑轓朱班輪鹿文飛鈴九斿降龍卿朱兩轓五斿降龍二千石以下各從科品公列侯以下皆單緑􅙦制文繡為祭服皇后以下皆不得服諸古麗圭襂閨緑加上之服建武永平禁絶之建初永元又復申重於是世莫有能制其裁者乃遂絶矣志所載乘輿至小使車其目十有八冕冠至鶡冠其目十有九幘佩至后夫人服其目十有三餘見冕服類續志注蔡雍表志曰永平初詔書下車服制度中宫皇太子親服重繒厚練浣已復御率下以儉諸侯王以下至於士庶嫁娶被服各有科品當傳萬世揚光聖德臣以為宜集舊事儀注本奏以成志也袁宏漢紀漢初文學既缺輿服旗幟一承秦制永平二年正月天子依周官禮記制度冠冕衣裳珮玉乘輿擬古式矣徐廣車服注曰漢明帝案古禮備其服章天子郊廟衣皂上絳下前三幅後四幅衣畫而裳繡漢車服儀宋禮志漢初崇簡不存改作車服之儀多因秦舊至明帝修復先典司馬彪輿服志詳之矣魏代唯作指南車晉立服制令辨定衆儀徐廣車服注略明事目並行於今晉志漢明帝云云天子車乘冠服從歐陽氏説公卿以下從大小夏侯氏説漢輿服志晉車服儀注劉昭曰司馬續書八卷車服即依董蔡唐志儀注類董巴大漢輿服志一卷隋志云魏博士徐廣車服雜注一卷南史晉義熙初宋武帝使廣撰車服儀注周遷古今輿服雜事十卷隋志梁周遷二十卷蕭子雲古今輿服雜事二十卷此數家皆旁記别録後魏禮志太學博士王延業議案周禮王后有五輅又漢輿服志云太皇太后皇太后皆御金根車阮諶禮圖并載奏漢以來輿服亦云金根輅皇后法駕乘之以禮婚見廟乘輅后法駕乘之以親桑安車后小駕乘之以助祭山軿車后行則乘之紺罽軿車后小行則乘之入閣輿后出入閣宫中小遊則乘之晉先蠶儀注皇后乘雲母安車駕六騩案周秦漢晉車輿儀式互見圖書名號小異略相依擬南齊志蔡雍創立此志馬彪勒成漢典蔡雍首著車服志司馬彪緒成之史官頗續此作宋禮志引徐廣車服注選東京賦注引漢雜事徐廣車服志春秋正義引徐廣車服儀制曰漢明帝復制韍又引董巴志司馬彪志隋禮儀志蔡雍獨斷論漢制度又引董巴志謂為瑞山車董巴所述全明漢制又引徐氏輿服注曰通天冠高九寸黑介幘金博山案徐氏雜注曰古者貴賤皆執笏有事則書之故常簪筆前五行志行步有佩玉之度登車有和鸞之節田狩有三驅之制飲食有享獻之禮唐車輿衣服令車服法度志武德四年始著車輿衣服令上得兼下下不得擬上凡天子之車五路屬車十乘皇后之車六皇太子之車三親王及武職一品有象路二品三品有革路四品有木路五品有軺車凡天子之服十四皇后之服三皇太子之服六妃服三羣臣之服二十有一命婦之服六文宗以四方車服僭奢下詔準儀令品秩勳勞為等級職事官服緑青碧云云至常參官施瓦獸栿梁會要武德四年七月十六日定制凡衣服之令天子之服十有二等大裘衮鷩毳襔玄冕通天冠武辨黑介幘白紗帽平巾幘白帢也又曰武德初著令天子鑾輅五等屬車十乘顯慶元年九月十九日修禮官無忌等言準武德初撰衣服令乘輿祀天地服大裘冕無旒雖慿周禮今請停大裘服衮冕仍改禮令案令文補冕玄冕四品五品之服請並服衮冕白帢雖著令文不可行請改素服從之貞觀十四年八月十四日詔曰冠冕制度已備令文開元二十六年左相耀卿等奏謹案衣服令皇太子具服有遠逰冠絳紗衮上手敕改為朱明服太和元年五月敕衣服器用車乘第室侈儉之制近日頗差宜準儀制令六年六月戊寅制度敕條自親王二王後服色至仗衛雜飾節鎮軍裝衣服右僕射王涯奏七年八月九日敕起今年十月其衣服輿馬宜準太和六年十月七日敕如有故違重加黜責册太子詔比年所頒制度皆約國家令式去其甚者稍謂得中而士大夫安於習俗因循未革王涯傳文宗惡俗侈靡詔涯懲革涯條上其制凡衣服室宇使略如古貴戚皆不便議遂格德宗紀大厯十四年即位六月己亥大赦減乘輿服御士庶田宅車服踰制者有司為立法度肅宗上元元年閏四月己卯詔定王公已下車服詳古制聞奏太平興國車服制度衣服令興國七年正月九日壬寅翰林承旨李昉準詔詳定車服制度以士庶之家車服踰僭故令詳定昉等言商賈車馬漆素鞍者勿禁工商庶人聽乘車兜子不得過二人荔支帶非恩賜者官至三品乃得服品官緑袍舉子白襴下皆服紫請禁之其私苐便服通許服皂從之端拱二年十一月九日詔曰國家先定車服制度聞士庶尚有奢僭於是鞍轡服帶幞頭巾子並為條制復禁泥金真珠服飾景祐三年直昭文館扈稱上言京師士庶務為華靡第舍服玩僭擬無法宜革僭奢之弊二月壬戌下兩制與禮院詳定制度八月己酉詔臣庶之家自居室服器車輿鞍勒之制悉裁為令以頒天下先是詔云輦轂士民服御纎華室居宏麗因命攸司參為定式式紀云頒冠服居室器用車馬之嘉祐四年四月辛卯復詔御史監司察舉治平二年八月詔減定衮冕制度初同知禮院李育奏開寶通禮及衣服令冕服皆有定法悉無會要所載寶錦之飾元祐八年四月戊午李之純請嚴立制度杜奢僭之原詔禮部以條式肹示清廟茅屋大路越席太羹不致粢食不鑿昭其儉也衮冕黻珽帶裳幅舄衡紞紘綖昭其度也藻率鞸鞛鞶厲斿纓昭其數也火龍黼黻昭其文也五色比象昭其物也錫鸞和鈴昭其聲也三辰旗旗昭其明也左傳桓二年臧哀伯云參旗分景帝車含曜所以榮衛南宫增華北極聖人見鳥獸容貌草木英華始創衣冠而玄黃殊采見秋蓬孤轉杓㩦旁建乃作輿輪而方圓異則晉志殷輅周冕規模不一秦冠漢佩用舍無常方軫圓蓋以觀法象鏤錫辰旗以昭聲明寢兕持虎以養其威升龍左纛以副其德鳴珮紆組鏘鏘奕奕車服以庸有虞盛典威儀以等周禮舊章車輿陳祥道曰古者服牛乘馬引重致逺以利天下則車之作尚矣或曰黃帝作軒冕不可考也通典人皇氏乘雲駕六羽或云秪車古史考云黃帝作車至少昊始駕牛車之制象天以為蓋象地以為輿象斗以為杠轂象二十八星以為蓋象日月以為輪輻前軾而後户前軓而後軫旁輢而首以較下軸而銜以轐對人者謂之對車如舟者謂之輈揉而相迎者謂之牙輈之曲中謂之前疾軛之上平謂之衡衡之材與輿之下木皆曰任以其力任於此也轂之端與輢之下木皆曰軹以其旁止於此也軫可以名輿可以名車達常可以名部軫前橫木可以名輅此又因一材而通名也其為車者有長轂有短轂有杼輪有侔輪有反揉有仄揉有兩輪有四輪有有輻有無輻有曲轅有直轅輦曲轅有一轅有兩轅有直輿有曲輿鉤車曲輿有廣箱有方箱有重較有單較者或駕馬或駕牛或挽以人或飾以物或漆或素皆因宜為制稱事為文然論其任重則同稱為車論其等威則禮有屈伸名有抑揚也三皇祗車蜀志秦宓曰三皇乘祗車出谷口今之斜谷是也注蜀記曰云云未詳宓所由知為斜谷也黃帝指南車周司南車黃帝內傳玄女為帝制司南車當其前記里鼓車居其右崔豹古今注輿服第一大駕指南車起黃帝與蚩尤戰涿鹿之野蚩尤作大霧兵士皆迷於是作指南車以示四方遂禽蚩尤後代常建焉志林外紀同又見通典一云帝令風后法斗機作車舊説周公所作也周公治致太平越裳氏重譯來貢白雉一黑雉二使者迷其歸路周公錫以文錦二匹軿車五乘皆為司南之制使越裳氏載之以南期年至其國使大夫送至而還亦乘司南而背其所指亦期年還始制車轄轊皆以鐡還亦銷盡以屬巾車氏藏之常為先導示服遠人而正四方車法具在尚方故事宋書沈約司南車周公所作以送荒外遠使地域平漫迷於東西造此車使常知南北鬼谷子鄭人取玉載司南之車為其不惑也文選注韓非子先王立司南以端朝夕注即指南車釋名黃帝造車漢地理志黃帝作舟車以濟不通黃帝象車人皇氏祗車韓子師曠對晉平公曰黃帝合鬼神於泰山之上駕象車六交龍畢方並轄蚩尤並轂風伯進掃雨師灑道作為清角出後漢劉昆傳注流上林賦注郭璞引韓子云云又張楫曰德則山出象車山之瑞也通典昔人皇氏乘雲駕六羽出谷口或云祗車也及五龍氏乘龍上下以理古史考云黃帝作車引重致遠至少昊始駕牛及陶唐氏制彤車乘白馬有虞氏因彤車而制鸞車夏后氏因鸞車而制鈎車言不揉自曲時有奚仲為夏車正建其斿旐駕馬尊卑上下各有等級商因鈎車而制大路注昔成湯用而郊祀有山車之瑞山車亦謂之桑根車詳見後商大路周因殷路約木而加飾為玉家語山出器車注出銀甕丹甑之器及象車後漢志注崔駰頌曰登天靈之威輅駕太一之象車堯彤車史記本紀堯富而不驕貴而不舒黃收純衣彤車堯火德故車尚赤乘白馬能用訓德以親九族晉輿服志史臣曰放勳彤車白馬叶三微之序又見黃帝象車大戴禮五帝德堯黃黼黻衣丹車白馬堯大路淮南子主術篇堯之有天下也茅􅗔不翦采椽不斫大路不畫大路上路四馬車也天子駕六馬不畫不文飾也越席不緣大羹不和粢食不毇豈其奉養不足樂哉舉天下而以為社稷非有利焉虞鸞車鸞路明堂位鸞車有虞氏之路也有鸞和也鈎車夏后氏之路也有曲輿大路殷路也大路木路也漢祭天乘殷之路今謂之桑根車也春秋傳曰大路素疏祭天尚質乘路周路也玉路疏明魯有四代之車月令孟春天子居青陽乘鸞路駕倉龍鄭注鸞路有虞氏車有鸞和之節而飾之以青取其名耳古史考有虞氏因彤車制鸞車詳見黃帝象車後漢志注賀循曰車必有鸞而春鸞路者鸞鳯類色青故以名春路傳毅車銘曰虞氏作車取象璣衡吕氏春秋注鸞鳥在衡和在軾鳴相應和後世不能復致鑄銅為之飾以黃金因謂之鸞輅方氏曰鸞車車之有鈴者必曰鸞取其聲之美也鈎車取其形之曲舜金車瑞應圖舜時金車見帝庭宋符瑞志金車王者至孝則出象車山之精也德澤流洽則出根車者德及山陵則出山車山藏之精也不藏金玉山澤通給天下則山成其車舜山車孝經援神契虞舜德盛故山車出有垂綏山車者自然之物也與象車相似宋志山車山藏之精也禹四載書豫乘四載孔注謂水乘舟陸乘車泥乘輴山乘樏尸子山行乘樏泥行乘蕝淮南子注澤行乘蕝説文山行乘樏澤行乘輈淮南修務訓禹沐雨櫛風決江疏河乘四載隨山刊木平治水土史記陸行載車水行載舟泥行蹈橇音蕝山行即橋徐廣曰橋一作輂漢溝洫志陸行載車水行乘舟泥行乘橇山行則梮正義輴與毳為一樏與梮輂為一古篆變形敘夏乘四載百川是導夏鈎車明堂位鈎車夏后氏之路也注鈎有曲輿者也通典鈎之言不揉自曲正義輿則車床曲輿謂曲前闌也虞質未有鈎矣古史考夏后氏因鸞車而制鈎車詳見黃帝象車詩六月注夏后氏曰鈎車先正也見司馬法兵或以鈎車為車夏余車周輦周禮小司徒登其鄉之衆寡六畜車輦鄉師大軍旅會同正治其徒役與其輦輂注輂駕馬輦人挽行所以載任器止以為蕃營司馬法曰夏后氏謂輦曰余車殷曰胡奴車周曰輜輦輦一斧一斤一鑿一梩一鋤周輦加二版二築又曰夏后氏二十人而輦殷十八人周十五人而輦説者以為夏出師不踰時殷踰時周歷時故前世輦少後世輦多巾車王后五路輦車見後縣師辨人民之數車輦之稽稍人作其輂輦均人均車輦之力政遂人以歲時登夫家衆寡及其車輦通典夏氏末代制輦秦為人君之乘漢以雕玉為之傅子夏曰余車云云不知何代去其輪又後漢志注引傅子曰周曰輜車即輦也宋志引傅玄子云云宋志輦夏后氏末代所造詩黍苖我任我輦疏輦車人挽以行左傳公叔文子老矣輦而如公晉語攀輦即利而舍後漢井丹傳陰就左右進輦丹笑曰吾聞桀駕人車豈此邪後魏志入閣輿與輦其用又同案圖今之黑漆畫扇輦與周之輦車其形相似荀子天子召諸侯諸侯輦輿就馬注輦謂人挽車夏車正左傳定元年正月薛宰曰薛之皇祖奚仲居薛以為夏車正注為禹掌車服大夫淮南子胡曹為衣奚仲為車注易曰黃帝垂衣裳胡曹黃帝臣也荀子解蔽篇奚仲作車杜作乘馬注黃帝已有車服奚仲亦改制耳世本曰相土作乘馬契孫也四馬駕車起於相土故曰作以其作乘馬之法世本奚仲始作車劉昭以為誤史考所説是也吕氏春秋胡曹作衣乘雅作駕寒哀作御奚仲作車奚仲車管子奚仲之車也方圜曲直皆中規矩鈎繩山海經番禺生奚仲仲生吉光始以木為車注郭璞曰世本奚仲造車此言吉光明其父子共創意崔駰車左銘曰虞夏作車取象機衡宋志庖羲畫八卦而為大輿奚仲乃夏之車正安得始造乎殷大路路車瑞山車明堂位見鸞車注大路殷之祭天車也疏祭天尚質以尊敬周公故用殷禮車乘殷路月令中央土天子居太廟乘大路駕黃駵注大路殷路也如殷路之制而飾以黃禮器大路素而越席疏殷猶質以木為車無别雕飾乘以祭天謂之大路郊特牲大路繁纓一就疏殷祭天之車禮器注同先路三就次路五就禮器言七就字誤也祭之日乘素車貴其質也注素車殷路也魯公郊用殷禮丹漆雕幾之美素車之乘尊其朴也論語顔淵問為邦子曰乘殷之輅注馬曰殷車曰大輅左傳曰大路越席昭其儉也集注古者以木為車而已至商而有輅之名蓋始異其制也質而得其中韓非子殷人作為大路而建九旒史記孔子曰殷路車為善而色尚白後漢志殷瑞山車金根之色禮緯曰山車垂鉤亦商因鈎車而制大路成湯用而郊祀有山車之瑞謂之桑根車亦謂之大路漢祭天乘之齊志殷有瑞車山車垂鉤是也殷三路郊特牲疏大路殷祭天車也用以祭天故曰大路五采一成曰就天質慤故止一就明堂位云大路殷路是也先路三就者先路亦殷路也殷則三路其世猶質故以少飾為先對次故稱先也每加以兩大路一先輅三次路五就禮器無先路之文云次路七就為誤也禮器疏次路殷之第三路也共卑用故就多左傳襄十二年鄭賜子展先路子産次路宋志秦閲三代之車獨取殷制古曰桑根車秦曰金根殷有山車之瑞謂桑根車殷人制為大路隋志昔成湯用而郊祀因有山車之瑞亦謂桑根車湯奇肱車括地圖奇肱民能為車從風遠行湯時西風久奇肱車至於豫州去玉門四萬里選注春秋命厯序人皇九頭提羽蓋乘雲車出暘谷分九河周五路齊車道車斿車戎路革車田路乘車公車政令良車服車車儀路車春官巾車下大夫二人掌公車之政令辨其用與其旗物而等敘之治其出入注公猶官也用謂祀賔之屬旗物太常以下等敘之封同異姓之次敘易氏曰五路至服車皆典於公故謂公車王之五路注王在焉曰路疏若路門路寢路車路馬皆稱路路大也王之所在以大為名一曰玉路錫樊纓十有再就建大常十有二斿以祀注玉路以玉飾諸末錫馬面當盧刻金為之所謂鏤錫樊馬大帶也纓馬鞅玉路之樊及纓皆以五采罽飾之疏言諸末者凡車上之材於末頭皆飾之一采一匝為一就金路鉤樊纓九就建大斿以賔同姓以封注以金飾諸末鉤婁頷之鉤也金路無錫有鉤亦以金為之疏詩云鉤膺鏤錫鉤在膺前玉路兼有鉤象路朱樊纓七就建大赤以朝異姓以封注以象飾諸末象路無鉤以朱飾勒而已以朝以日視朝革路龍勒條纓五就建太白以即戎以封四衛注鞔之以革而漆之無他飾龍駹也以白黑飾韋雜色為勒條讀為絛木路前讀為翦樊鵠纓建大麾以田以封蕃國注不鞔以革漆之而已翦淺黑也木路無龍勒以淺黑飾韋為樊鵠色飾韋為纓不言就數飾與革路同杜子春云鵠或為結疏凡五等諸侯所得路在國祭祀及朝天子皆乘之但朝天子之時乘至館則舍之于館覲禮記云偏駕不入王門乘墨車龍旗以朝同姓金路無錫韓侯受賜得有鏤錫者有功特賜王后之五路見後服車五乘服事者之車孤乘夏篆五采畫轂約卿乘夏縵五采畫無篆大夫乘墨車不畫士乘棧車不革鞔而漆之庶人乘役車方箱可載任器以共役疏冬官棧車欲奄云士昏禮乘墨車攝盛也士車有漆飾案唐傳古之帝王必有命民於其君得命然後得乘飾車駢馬文衣駢錦注云飾漆之駢併也詩有棧之車注云役車凡良車散車不在等者其用無常注給遊燕及恩惠之賜不在等者謂若今輜車後户之屬作之有功有沽疏作之有精粗故有良散之名凡車出入歲終則會之典路中士二人掌王及后之五路辨其名物與其用説若有大祭祀則出路贊駕説大賔客亦如之凡會同軍旅以路從注王乘一路典路以其餘路從行亦因以華國疏衣裳之會及弔乘金路兵車之會及軍旅乘革路王出雖乘一路餘路皆從惟玉路祭祀之車尊不出車僕掌戎路之萃注萃猶副也戎路王在軍所乘也疏曰革路凡師共革車各以其萃會同亦如之注巡守及兵車之會則王乘戎路乘車之會王雖乘金路猶共以從不失備也司常道車載旞注象路也王以朝夕燕出入斿車載旌木路也王以田以鄙大閲王乘戎路建大常焉玉路金路不出凡祭祀各建其旗注王祭祀之車則玉路疏朝所以行道故謂象路為道車是木路以田遊樂之所夏官司戈盾軍旅會同授二車戈盾建乘車之戈盾注乘車王所乘車也軍旅則革路會同則金路戎右掌戎車之兵革使會同充革車注右者參乘此充戎車之右田獵亦為之右會同王雖乘金路猶以革路從行也充謂居左曲禮曰乘君之乘車不敢曠左齊右掌祭祀會同賓客前齊車王乘則持馬行則陪乘注充玉路金路之右齊車金路王自整齊之車也齊右與齊僕同車而有祭祀之事則兼玉路之右然則戎右兼田右與疏王路有五右唯有三易氏曰齊敬也玉路以祀則敬乎神金路以賔則敬乎賔先王承賔猶承神也道右充象路之右掌前路車王出入則持馬陪乘如齊車之儀注道車象路也王行道德之車自車上諭命於從車疏從車即二車詔王之車儀王式則下前馬王下則以蓋從注車儀顧式之屬疏禮云式視馬尾顧不過轂皆是車上威儀易氏曰謂之道車者王者動容周旋無適不與道俱記所言不廣咳不安指升車必正立執綏不疾言不內顧無非車之儀司右掌羣右之政令注戎齊道右太僕王出入則自左馭而前驅大馭中大夫二人馭之最尊掌馭玉路以祀易氏曰玉路不言僕者祀為國之大事玉為王之大路所以易僕為馭及犯軷行山曰軷王自左馭馭下祝登受轡犯軷遂驅之凡馭路行以肆夏趨以采齊注凡馭路謂五路也行謂大寢至路門趨謂路門至應門疏四路亦準玉路為法凡馭路儀以鸞和為節注舒疾之法也鸞在衡和在軾皆以金為鈴戎僕掌馭戎車革路也掌王倅車之政正其服倅副也疏副車十二乘及廣闕蘋輕之倅犯軷如玉路之儀掌凡戎車之儀衆之兵車也齊僕注古者王將朝覲會同必齊所以敬宗廟及神明掌馭金路以賔朝覲宗遇饗食皆乘金路其法儀各以其等為車送逆之節道僕掌馭象路以朝夕燕出入其法儀如齊車掌二車之政令注王朝朝莫夕主御王以與諸臣行先王之道二亦副田僕掌馭田路以田以鄙掌佐車之政注田路木路也佐亦副疏天子尊故戎車田車之二有别名諸侯卑戎車田車之二同曰佐少儀注云朝祀之副曰二戎獵之副曰佐設驅逆之車疏王制云佐車止則百姓田獵彼佐車則此驅逆之車也馭夫掌馭二車象路之副從車戎路田路之副使車驅逆之車疏曰不掌玉金路之副二者事暇校人辨六馬之屬注玉路駕種馬戎路駕戎馬金路駕齊馬象路駕道馬田路駕田馬良馬善馬五路之馬旅賁氏夾玉車而趨車止則持輪考工記周人上輿兵車之輪六尺有六寸革路也田車之輪六尺有三寸木路也乘車之輪六尺有六寸玉金象路也此以馬大小為節兵車乘車駕國馬田車駕田馬六尺有六寸之輪軹崇三尺有三寸也加軫與轐焉四尺也人長八尺登下以為節此車之高者書大輅玉綴輅金先輅象次輅革木贅周禮注云路月令孟秋乘戎路注兵車也制如周革路而飾以白詩采薇彼路斯何君子之車箋謂將率疏鄭子蟜叔孫豹王賜之大路是卿車得稱路也采芑路車有奭簟茀魚服鈎膺鞗革疏方叔不乘革路者以革路臨陳所乘韓奕其贈維何乘馬路車箋人君所乘之車曰路車王錫韓侯淑旗綏章簟茀錯衡鉤膺鏤錫鞗革金厄嵩高王遣申伯路車乘馬大戴禮保傅篇古之為路車也蓋圓以象天二十八橑以象列星軫方以象地三十輻以象月左傳桓二年大路越席疏巾車五路玉路為大故杜以玉路為大路結蒲為之席置於玉路之中以茵藉示其儉也服虔曰大路木路也玉路十二斿金路九斿是斿有數也玉路纓十有二就金路纓九就是纓有數也國語周秩官曰工人展車曲禮武車綏旌疏云革路也取其建戈刃云兵車取其威猛云武車德車結旌謂玉金象木四路不用兵故曰德車禮運天子以德為車以樂為御宋志周五路之飾備於考工記輿方法地蓋圓象天輻以象日月二十八弓以象列宿後漢志注釋名曰天子所乘曰路言行路也服虔曰大路尊卑俱乘采飾有差傅玄乘輿馬賦注玉路重較也周車六等考工記周人上輿注武王疾上下失其服飾而尊輿一器而工聚者車為多注周所上也車有六等之數法易三材六畫車軫四尺謂之一等戈祕六尺有六寸既建而迆崇於軫四尺謂之二等人長八尺崇於戈四尺謂之三等殳長尋有四尺崇於人四尺謂之四等車戟常崇於殳四尺謂之五等酋矛常有四尺崇於戟四尺謂之六等注此所謂兵車也疏此六等軫一人一之外兵有四等此謂前驅車所建察車自輪始攻木之工七輪輿車居其三又於三者之中輿人居其一輪人析而二車人析而三其外又有輈人為輈是車之三工又别而為七輪人為輪三材具轂輻牙巧者和之可規可萭可水縣量權也謂之國工為蓋蓋崇十尺蓋主為雨設乘車無蓋禮所謂潦車謂蓋車與輿人為車輪崇車廣衡長參如一謂之參稱隧式較軫軹轛棧車欲奄無革挽士乘飾車欲侈大夫以上革挽輿疏革路墨車等案殷傳云未命為士者不得乘飾車輈人為輈車轅也詩五楘梁輈輈有三度軸有三理國馬輈深四尺有七寸田馬輈深四尺駑馬輈深三尺有三寸軸一以為媺二以為久三以為利良輈環灂自伏兔不至軓七寸軓中有灂謂之國輈軫方以象地蓋圓以象天輪輻三十象日月蓋弓二十八象星大車之轅摯注大車牛車也疏輪人輿人造四馬車上所陳是也車人造大車柏車羊車是駕牛者廬人為廬器六建既備車不及覆謂之國工注六建五兵與人也車人之事為耒為車行澤短轂則利行山長轂則安柏車轂長一柯圍二柯輻一柯柏車山車輪高六尺牙圍尺二寸大車崇三柯綆寸大車平地載任之車轂長半柯羊車二柯有參分柯之一羊善也善車若今定張車較長七尺疏定張車據漢法言漢去今遠未知定張車將何所用但知在宫內所用故差小為之謂之羊車耳此羊車較長七尺則大矣而論語謂大車為柏車小車為羊車者以柏車較雖短轂輻牙則長羊車較雖長轂輻牙則小故得小車之名駟包氏論語注大車牛車小車馬車續漢志上古聖人見轉蓬始知為輪輪行可載復為輿後聖觀於天視斗周旋魁方杓曲以攜龍角為帝車於是乃曲其輈故易震乘乾謂之大壯言器莫有上之者也易氏曰詩伯也執殳為王前驅鄭氏引此文箋之則車之六等為前驅所建可知其兵有四戈柲既建而迆止戈為武之義殳車戟酋矛皆置之車傍備而不用之義觀兵車之制先王不急於用兵可推矣又曰考工言六等而後言察車廬人言六建而後言試廬其實一也周王后五路自翟至輦安車禮巾車王后之五路重翟錫面朱總重翟雉羽也后從王祭祀所乘疏約王之五路則重翟當玉路馬氏等云重翟為蓋今之羽蓋是也鄭云蔽也王后始來乘重翟厭翟勒面繢總注次其羽使相迫也后從王賓饗諸侯所乘疏相次以厭其本詩箋王姬車乘厭翟安車雕面鷖總皆有容蓋注坐乘車凡婦人車皆坐乘詩碩人曰翟茀以朝蓋厭翟也安車無蔽后朝見於王所乘謂去飾也容謂幨車山東謂之裳幃或曰潼容蓋如今小車蓋疏曲禮婦人不立乘王后五路皆坐乘安車無異稱故獨得名曲禮大夫致事若不得謝必賜之几杖乘安車則男子坐乘亦謂安車劉熙釋名曰容車婦人所載小車也列女傳妃后踰閾必乘安車輜軿翟車貝面組總有握注不重不厭以翟飾車之側如今軿車后所乘以出桑有幄則無蓋疏漢法軿車無蓋幄本作握音屋疏作幄字輦車組挽有翣羽蓋注不言飾后居宫中從容所乘但漆之而已為輕輪人挽之以行有翣以禦風塵以羽作小蓋為翳日也曲路掌王及后之五路辨名物用説周二車禮大行人上公之禮二車九乘諸侯七乘諸伯如諸侯之禮諸子五乘諸男如諸子之禮注二副也疏二車所飾無文左傳晉七輿大夫注侯伯七命副車七乘每車有一大夫主之詩正義鄭針膏盲云卿以上所乘車皆曰大路輿人疏天子與其臣乘重較之車諸侯之車不重較周輜車見上周乘路明堂位乘路周路也注玉路疏周王禮故用玉周五時路晉輿服志周禮巾車氏云云有嚴有翼用光其武鈎膺鞗革乃暢其文六服之冕五時之路王之常制各有等差月令春乘鸞路駕蒼龍載青旗夏乘朱路駕赤駵載赤旗中央乘大路駕黃駵載黃旗秋乘戍路駕白駱載白旗冬乘玄路駕鐡驪載玄旗蔡伯喈王肅云月令周公所作周大路二路漢武問賢良䇿周室設兩觀乘大路朱干玉戚八佾陳於庭而頌聲興公羊傳子家駒曰乘大路天子之禮也注禮天子大路諸侯路車大夫大車士飾車荀子禮論天子大路越席以養體側載睪芷以養鼻前有錯衡以養目和鸞之聲步中象武趨中韶護以養耳龍旗九斿以養信寢兕持虎蛟韅絲末彌龍以養威正論天子尊無上衣被則服五采雜間色重文繡飾珠玉食飲則重大牢而備珍怪曼而饋代睪而食雍而徹五祀執薦者百人侍西房居則設張容負依而坐諸侯趨走乎堂下乘大路越席以養安注大路祭天車三公奉軛持納與軜同諸侯持輪挾輿先馬大侯編後大夫次之小侯元士次之庶士介而坐道庶人莫敢望視居如大神動如天帝左傳桓二年大路越席疏路大也君之所在以大為號門曰路門寢曰路寢車曰路車故人君之車通以路為名杜以玉路為大路經傳言大路者多矣尚書大輅孔安國以為玉服虔云大路木路僖二十八年王命晉侯為侯伯賜之大路之服注大路金路襄十九年鄭公孫蠆卒子蟜王追賜之大路二十四年穆叔叔孫豹如周聘王賜之大路注大路天子所賜車之總名以周禮孤乘夏篆卿乘夏縵釋例以所賜穆叔子蟜當是革木二路諸侯之卿特賜則有大路昭四年杜泄曰夫子叔孫豹受命聘於王王賜之大路復命致之君君復賜之使三官書之十五年十二月晉荀躒如周王曰叔父唐叔成王之母弟也密須之鼓與其大路文所以大搜也闕鞏之甲武所以克商也唐叔受之處參虛以有戎狄其後襄之二路大路戎路鏚鉞秬鬯彤弓虎賁文公受之以有南陽撫征東夏非分而何定四年祝他曰成王分魯公康叔唐叔以大路注金路錫同姓諸侯車齊語天子致胙於桓公賞服大路龍斿九旒渠門赤旗注賈侍中云大路諸侯朝服之車謂金路隋志白虎通云玉輅大輅也晉摯虞獨疑大輅謂非玉輅周謂之乘輅大戴禮著其形式上蓋如規象天二十八橑象列星下方輿象地三十輻象一月前視則覩鸞和之聲側觀則覩四時之運宋志禮所謂金玉路者正以金玉飾諸末耳左右前後同以漆畫秦改周輅制為金根通以金薄周匝四面漢魏二晉因循莫改逮乎大明始備五輅金玉三制並類金根覲禮注朝事儀曰天子冕而執鎮圭尺有二寸繅藉尺有二寸搢大圭乘大路建大常十有二旒樊纓十有二就二車十有二乘帥諸侯而朝日於東郊所以教尊尊也退而朝諸侯周乘石禮夏官隸僕下士二人王行洗乘石鄭司農曰王登上車之石也詩有扁斯石履之卑兮疏乘車之得履石唯王為然登五路之石王行則洗之致其潔也淮南子周公履乘石唐王起洗乘石賦承玉趾以增麗拂兖衣而更妍有翼有嚴既敬既戒洗列周經履合周雅選注尸子曰周公旦踐東宫履乘石參乘夏官戎右注古者參乘此充戎路之右田獵亦為之右焉疏若在軍為元帥則將居鼓下將在中御者在左若凡平兵車則射者在左御者居中若在國則尊者在左御者在中央其右是勇力之士執干戈常在左右戎右兼田右齊右兼祀右僕有五不兼者僕難於右是以六藝之中有五御而不言右曲禮乘君之乘車疏謂君之次路也王者五路王自乘一所餘四路皆從行周常車周書克殷解第三十六及期百夫荷素質之旗於王前叔振奏拜假又乘常車周公把大鉞召公把小鉞以夾王泰顛閎夭皆執輕吕以奏王王入即位於社大卒之左羣臣畢從孔朝注常車威儀車也三公夾衛王也史周紀叔振鐸奉陳常車周指南車鬼谷子肅慎氏獻白雉於文王還恐迷路問周公作指南車以送之又見黃帝指南車周器車子華子吾之宗君為周日正周公作成周定鼎於郟鄏吾之宗君薦所以為祥者其族有三曰井里之璞也曰太山之器車也曰唐叔異畝之禾也禮運山出器車注器謂若銀甕丹甑也出援神契正義按禮緯斗威儀其政太平山車垂鉤注云山車自然之車垂鉤不揉治而自圓曲家語注象車也孝經援神契德至山則山出木根車應載萬物金車者王者至孝則出魯大路魯四代車明堂位魯君孟春乘大路載弧韣旗十有二旒日月之章祀帝於郊配以后稷天子之禮也正義此一經明魯有四代之車見上左傳成二年公會晉師於上鄍魯賜三帥先路之服疏按釋例先路者革路若木路或云先或云後蓋以就數為差其受之於王則稱大革木是卿大夫車之尊者金路是諸侯車之尊者玉路天子車之尊者皆稱大仲尼車輿魯孔氏車詳見車服見車服制度玉海卷七十八
