body:
  text: 玉海卷八十九宋王應麟撰器用尊彛爵爾雅注尊彛酒器總名周禮疏彛尊同是酒器但彛盛鬱鬯與酒不同故異其名書疏彛亦尊也盛鬯者為彛盛酒者為尊皆祭宗廟之酒器也禮記正義彛法也與餘尊為法説文禮器也象爵之形中有鬯酒又持之也所以飲器象爵者取其鳴節節足足也堯衢樽晉刑法志念室後刑衢樽先惠將以屏除災害引導休和擬陽秋之成化若堯舜之為心也淮南子聖人之道若中衢而設尊過者斟酌各得其宜四達謂之衢唐張説詩侍酌衢尊滿詢芻諫鼓懸李德裕欹器賦異衢尊之不竭姚崇洛城宴詩堯樽臨上席程行諶詩堯樽承帝澤衢室之問康衢之謡宋朝天禧四年九月二十四日賜酺詔曰思延兒齒廣置衢樽賀知章詩有舜壺之句堯鐘孔叢子堯飲千鐘選注引之虞泰尊夏山罍殷著尊周犧尊夏盞殷斝周爵夏雞夷龍勺殷疏勺周黃目蒲勺夏樽並見賜豫器物類魯四代服器官明堂位注泰用瓦著著地無足斚畫禾稼也詩曰洗爵奠斚夷讀為彛周禮春祠夏禴祼用雞彛鳥彛秋嘗冬蒸祼用斚彛黃彛龍龍頭也疏通刻其頭蒲合蒲如鳬頭也正義虞尊用瓦名泰山罍猶雲雷畫為山雲之形著尊無足而底著地其餘泰罍犧並有足犧象畫沙羽及象骨飾尊夏盞以玉飾之又詩行葦注殷斚亦爵形而畫為禾稼周爵按周禮贊玉爵則爵或以玉為之或飾之以玉雞彛或刻木為雞形而畫雞於彛黃目以黃金為目周所造也龍勺勺為龍頭疏勺刻鏤通刻勺頭蒲勺皇氏云刻勺為鳬頭其口微開如蒲草本合而末微開燕禮瓦大兩有豐注瓦大有虞氏之尊也疏有虞氏尚陶隋禮儀志梁天監五年明山賔議樽彛之制祭圖唯有三樽一曰象樽周樽也二曰山罍夏樽也三曰著尊殷樽也徒有彛名竟無其器後周歌辭曰雕禾飾斚翠羽承罍王制疏宗彛者謂宗廟彛樽之飾有虎蜼二獸周禮有六彞此必為虎蜼者明堂位云夏雞彛殷斚周黃目周禮陳六尊六彛皆逺代者在後故六尊之次犧象著壺大山大是虞山是夏六彛之次亦虎蜼在後故知虎蜼虞夏已飾於尊舜宗彛玉斚虞鬱尊益稷作會宗彛注會五采也宗廟彛樽亦以山龍華蟲為飾疏周禮彛器無山龍華蟲為飾者帝王所尚不同周禮有山罍龍勺雞彛鳥彝杜甫朝享太廟賦芳霏霏於玉斚注舜祠宗廟以玉斚也周禮春官疏虎彞蜼彝當是有虞氏之尊故鄭注尚書云宗彞宗廟之中鬱尊虞氏所用故曰虞夏以上虎蜼而已殷爵周兕觥詩行葦洗爵奠斚注夏曰盞殷曰斚周曰爵箋云用殷爵者尊兄弟也禮器正義韓詩説一升曰爵二升曰觚三升曰觶四升曰角五升曰散古周禮説爵一升觚二升毛詩説觥大七升獻以爵酬以觚異義觥亦五升禮梓人為飲器勺一升爵一升觚三升注觚當為觶正義禮器制度云觚大二升觶大三升卷耳酌彼兕觥注角爵也疏兕一角青色以兕角為觥韓詩説觥五升毛詩大七升桑扈兕觥其觩左傳昭元年穆叔子皮舉兕爵山海圖贊郭璞皮充武備角助文德古人取於兕者如此博古圖有父乙祖乙祖丙父戊祖己巳舉爵商觚十六商觶三周八尊酒正中士四人凡祭祀以法共五齊三酒以實八尊疏五齊五尊三酒三尊大祭三二中祭再二小祭一二唯齊酒不二幂人祭祀以疏布巾幂八尊以畫布幂六彝周六尊六彝小宗伯辨六彞之名物以待果將辨六尊之名物以待祭祀賔客注六彞雞鳥斚黃虎蜼六尊獻象壺著大山司尊彛下士二人掌六尊六彝之位詔其酌辨其用與其實詳見下凡六彝六尊之酌鬱齊祼獻酌醴齊朝縮酌盎齊饋涗酌凡酒諸臣自酌修酌修讀為滌齊唯有事太廟備五三酒説文彝宗廟常器也周雞彝鳥彞黃彞黃目斚彞虎彝蜼彝司尊彛春祠夏禴祼用雞彞鳥彞皆有舟注祼謂以圭瓚酌鬱鬯始獻尸也后以璋瓚酌亞祼雞彞鳥彞謂刻而畫之為雞鳳凰之形鄭司農云舟尊下臺若今時承槃疏鄭志云雞彞盛明水鳥彝盛鬱鬯是以各二尊彞與齊尊各用二者鬱鬯與齊皆配以明水二酒配以玄酒郊特牲云祭齊加明水三酒加玄酒禮象曰彞有舟以盛鬯猶尊有罍以盛酒一時之祭并用兩彝舟宜若後世酒船稍加大爾古者惟爵有承槃所謂坫與豐是已尊彞無之秋嘗冬蒸祼用斚彝黃彞皆有舟注鄭司農云斚讀為稼稼彝畫禾稼也黃彝黃目尊也明堂位曰夏以雞彞本作夷注讀為彞殷以斚本注斚畫禾稼詩曰洗爵奠斚周以黃目又曰鬱尊用黃目注黃彞承鬱鬯謂以黃金為目也爾雅曰彞卣罍器也玄謂黃目以黃金為目郊特牲曰黃目鬱氣之上尊也黃者中也目者氣之清明者也言酌於中而清明於外郊特牲疏黃目以黃金鏤其外以為目因取名疏引明堂位皆證雞彞是夏法斚彝是殷法黃彞是周法引爾雅見有彞為上卣即犧象之屬為中罍為下沈括云逰關中得古銅黃彝其刻畫甚繁大體似繆篆中間有二目如大彈丸突起煌煌然所謂黃目也凡四時之間祀追享朝享祼用虎彞蜼彞皆有舟注鄭司農云追享朝享謂禘祫也在四時之間故曰間祀玄謂追享謂追祭遷廟之主以事有所請禱朝享謂朝受政於廟蜼禺屬卬鼻而長尾音誄疏爾雅在釋獸中注云似獼猴而大黃黑色尾長數尺似獺尾末有岐鼻露向上虎蜼當是有虞氏之尊鄭注尚書云虞夏以上虎蜼而已注祼用鬱齊朝用醴齊饋用盎齊諸臣自酢用凡酒凡酒謂三酒三禮圖雞彞受三斗斚彞畫嘉禾虎彝畫虎於尊盛明水鳥彞黃彝蜼彝畫蜼為飾盛鬱鬯周獻尊象尊犧尊司尊彛春祠夏禴其朝踐用兩獻尊其再獻用兩象尊皆有罍諸臣之所昨也注朝踐薦血腥酌醴始行祭事后於是獻朝事之豆籩昨讀為酢諸臣獻者酌壘以自酢不敢與王之神靈共尊鄭司農云獻讀為犧音婆犧尊飾以翡翠象尊以象鳯凰或曰以象骨飾尊春秋傳犧象不出門尊以祼神罍臣之所飲也王肅注禮器曰犧象二象蓋全刻牛象之形而鑿背為尊犧尊一盛玄酒一盛醴齊象尊一盛玄酒一盛盎齊疏禮運云玄酒在室醴盞在户齊醍在堂彼禘祭陳四齊此時祭陳二齊設尊亦依此酒正云大祭祀備五齊大祫通鬱鬯與三酒并配尊則尊有十八禘祭四齊則尊有十六此時祭二齊則尊十有二明堂位犧象周尊也飾尊有非周制者明堂位泰有虞氏之尊也山罍夏后氏之尊也著殷尊也犧象周尊也疏禮器君西酌犧象亦周禮獻尊黑出白牛象制同周語奉其犧象出其尊彛注三禮圖云阮氏圖犧尊飾以牛象尊畫象飾尊魯頌犧尊將將詳見後莊子犧尊青黃而文之博古圖有周乙舉樽觶謂之舉象尊全作象形而開背為尊鄭阮之謬可考鳬尊瓠尊夔龍尊犧首罍素犧罍象首罍周斚一十五許慎説罍云龜目酒尊禮象曰龜目黃黃目宜畫龜目且龜亦因以為戒周著尊壺尊魯壺司尊彞秋嘗冬蒸其朝獻用兩著尊其饋獻用兩壺尊皆有罍諸臣之所昨也注朝獻謂尸卒食王酳之饋獻謂薦孰時后於是薦饋食之豆邊著尊著略尊也或曰著尊著地無足明堂位曰著殷尊也壺者以壺為尊春秋傳曰尊以魯壺著尊受五斗一盛醴齊一盛盎齊一盛玄酒著尊制中白明堂位疏殷尊無足其餘泰罍犧並有足左傳昭十五年十二月晉荀躒如周以文伯宴樽以魯壺云云薦彞器於王注魯壺魯所獻壺尊正義鄭玄曰以壺為尊燕禮司宫尊於東楹之西兩方壺左玄酒昭元年四月鄭享趙孟穆叔子皮及曹大夫舉兕爵注所以罰不敬博古圖有著尊壺尊周大尊山尊魯四代尊見上司尊彞凡四時之間祀追享朝享其朝踐用兩大尊其再獻用兩山尊皆有罍諸臣之所昨也注鄭司農云大尊大古之瓦尊山尊山罍也明堂位曰泰有虞氏之尊山罍夏后氏之尊玄謂山罍亦刻而畫之為山雲之形疏罍之字於義無所取故以雲雷解之雷有聲無形雷起於雲雲出於山故刻山雲之形崔氏曰祫祭用十八尊禘祭用十六尊明堂位云云疏此明魯用四代尊也周大罍瓢齎修概散春官鬯人下士二人凡祭祀社壝用大罍注壝委土為墠壇以祭大罍瓦罍正義旊人為瓦簋取質略之意禜門用瓢齎注營鄼所祭國門也齎讀為齊取甘瓠割去柢以齊為尊廟用修注修讀曰卣詩書爾雅皆為卣卣中尊謂獻象之屬尊者彛為上罍為下凡祼事用概疈事用散注玄謂修概散皆漆尊也概尊以朱帶者無飾曰散正義概者橫概之義黑漆為尊以朱帶落腹禮器宗廟之祭貴者獻以爵賤者獻以散一升爵五升散公劉詩酌之用匏江漢箋王錫召虎以鬯酒一尊周宗彛秋官司約下士二人大約劑書於宗彛注宗廟之六彛書武王邦諸侯班宗彛作分器注賦宗廟彛器酒尊賜諸侯疏鄭云彛亦尊也盛鬯者為彞盛酒者為尊皆祭宗廟之酒器也左傳昭十五年諸侯之封受明器於王室分魯公官司彝器注常用器臧武仲曰大伐小取其所得以作彞器銘功烈示子孫昭明德而懲無禮也注謂鐘鼎為宗廟常器博古圖有龍鳯方樽蓋商器也商樽凡十四周玉爵瑶爵魯玉盞璧角璧散大宰享先王贊玉几玉爵朝覲會同贊玉爵疏天地爵不用玉宗廟則用之內宰大祭祀后祼獻則贊瑶爵亦如之凡賔之祼獻瑶爵皆贊注尸卒食后亞獻其爵以瑶為飾瑶爵所以亞王酬賔也疏瑶玉為璧形飾角口曰璧角角受四升爵為總號祭統君洗玉爵獻卿以瑶爵獻大夫以散爵獻士及羣有司明堂位魯公禘禮爵用玉盞仍雕加用璧角璧散注加加爵也散角皆以璧飾其口疏璧角內宰所謂瑶爵也四升曰角五升曰散爵夏后氏以盞殷以斚周以爵疏爵以玉飾故曰盞周爵或以玉為之或飾之以玉禮器貴者獻以爵賤者獻以散尊者舉觶卑者舉角天子曰斚諸侯曰角左傳昭七年二月戊午燕賂齊以瑤甕玉櫝斚耳注斚耳玉爵周祼器祼玉春官鬱人掌祼器凡祼玉濯之陳之以贊祼事注祼器謂彝及舟與瓉祼玉謂圭瓉璋瓉周賜爵夏官司士凡祭祀掌士之戒令及賜爵呼昭穆而進之注賜爵神惠及下也此所賜王之子姓兄弟祭統曰凡賜爵昭為一穆為一昭與昭齒穆與穆齒凡羣有司皆以齒此之謂長幼有序易氏曰祭末旅酬之禮也疏謂祭末旅酬無算爵之時皆有酒爵賜及之以昭穆為序量人凡宰祭與鬱人受斚厯而皆飲之注鄭司農云斚器名玄謂讀如嘏尸之嘏春官鬱人大祭祀與量人受舉斚之卒爵而飲之注斚受福之嘏聲之誤也少牢饋食禮主人受嘏詩懷之卒爵周金罍司尊彛疏異義第六罍制韓詩説金罍大器天子以玉諸侯大夫以金士以梓古注説罍酒器諸臣之所酢人君以黃金飾尊大一石按天子以玉經無明文惟詩云酌彼金罍毛氏詩注人君黃金罍疏金飾龜目蓋刻為雲雷之象名罍取於雲雷故也周羽觴晉束晢傳又東陽無凝齊諧記周公成洛邑因流水以泛酒故逸詩云羽觴隨波文選注逸詩曰羽觴隨流波羽羽觴飲酒之器為生爵形似有翼武王銘觴豆禮記疏總名曰爵其實曰觴魯犧尊魯頌閟宫犧尊將將正義阮諶禮圖云犧尊飾以牛象尊飾以象於尊腹之上畫為牛象之形王肅云太和中魯郡於地中得齊大夫子尾送女器有犧尊以犧牛為尊然則象尊尊為象形也肅此言以二尊形如牛象而背上負尊讀犧為羲與毛鄭義異南史劉杳曰魏時魯郡得齊大夫子尾犧尊作犧牛形晉時齊景公冡得二尊亦為牛象博古圖亦同左傳定十年孔子曰犧象不出門禮器廟堂之上罍尊在阼犧尊在西君西酌犧象夫人東酌罍尊郊特牲疏諸侯但有黃彛莊子釋文司馬云畫犧牛象以飾樽王肅云刻為牛頭魯三代灌尊明堂位灌尊夏后氏以雞夷殷以斚周以黃目疏明魯有三代灌尊及所用之勺儀禮注禁承尊之器也名之為禁者因為酒戒也魯三代爵明堂位爵夏以盞殷以斚周以爵正義此明魯有三代爵並以爵為形故并標名於其上齊倅樽韓詩外傳晉平公使范昭觀齊國之政范昭曰願君之倅樽以為夀景公顧左右曰酌寡人樽獻之客晏子對曰徹去樽孔子聞之曰晏子不出俎豆之間折衝千里晏子春秋曰晉平公使范昭觀齊國政景公觴之范昭起曰願得君之樽為夀公命左右酌樽以獻晏子命撤去之漢桂尊泰尊大尊尊山罍志郊祀歌練時日一尊桂酒賔八鄉注晉灼曰尊大尊也元帝時太宰丞李元記云以水漬桂為大尊酒景星十二百末旨酒布蘭生泰尊柘漿析朝酲泰尊有虞氏之尊泰用瓦傳梁孝王有尊注鄭氏曰上蓋刻為山雲雷之象漢書作此字蓋以此飾罍後傳馬融廣成頌山罍常滿沈括曰銅罍之飾皆古雲雷字相間禮象云先儒説罍刻木作雲雷形象施不窮也舊圖無雷止畫雲氣博古圖周犧首罍腹著叨餮下作垂花蟲鏤引起間錯雲雷漢玉巵玉杯玉觴髙紀九年冬十月置酒未央宫前殿上奉玉巵為太上皇夀注應劭曰飲酒禮器也古以角作受四升古巵字作觗師古曰巵飲酒圓器也文紀十六年秋九月得玉杯刻曰人主延夀令天下大酺明年改元注應劭曰新垣平詐令人獻之史記文十五年新垣平説上立渭陽五帝廟欲出周鼎當有玉英見十七年得玉杯瑞應圖玉英五常並修則見班固東都賦列金罍班玉觴崔駰漢明帝頌運斗杓以酬酢酌酒旗之玉巵黃香天子冠頌咸進酌于金罍獻萬年之玉觴馮衍李尤有杯銘前貢禹傳臣從之東宫太后宫見賜杯案盡文畫金銀飾非所以賜食臣下也後禮儀志百官賀正月二千石以上上殿稱萬嵗舉觴御坐前靡足而爵靡舟而彛珍掩金罍制卑兕觥漢上尊平當傳賜上尊酒十石注如淳曰律稻米一斗得酒一斗為上尊稷米一斗得酒一斗為中尊粟米一斗得酒一斗為下尊師古曰作酒自有澆醇之異非必繫之米漢夀觴萬年觴列傳叔孫通起朝儀云云以尊卑次起上夀觴九行兒寬奉觴再拜上千萬嵗夀東方朔奉觴上萬嵗夀車千秋上夀上報曰敬不舉君之觴後紀明帝永平十七年公卿集朝堂奉觴上夀夀老人之所欲故卑下奉觴進酒皆言上夀班超傳舉萬年之觴漢羽觴嘉觴西京賦羽觴行而無算外戚傳班偼妤賦酌羽觴兮銷憂注孟康曰爵也作生爵形有頭尾羽翼禮樂志郊祀歌淡容與獻嘉觴至重觴神裴回神嘉虞申二觴晉志荀朂正旦大會王公上夀酒歌獻羽觴祈令終張華宴會歌羽爵無算漢彛器文選張衡東京賦用息肩於大漢云云髙既受命建家造我區夏文又躬自菲薄治致升平武大啓土宇紀禪肅然宣撫和戎狄呼韓來享銘勳彛器厯世彌光注宗廟之器稱彛漢常滿尊禮天官酒正大祭三二中祭再二小祭一二皆有酌數唯齊酒不二皆有器量注酌器所用注尊中者杜子春云五齊以祭不益也其三酒人所飲者益也弟子職曰周旋而二唯嗛之視玄謂三二再二一二者就三酒之尊而益之也禮運曰玄酒在室醴盞在户粢醍在堂澄酒在下澄酒是三酒也益之者以飲諸臣若今常滿尊也疏司尊彝云皆有罍諸臣所酢是飲諸臣也云若今常滿尊者益之故常滿以漢法況之馬融廣成頌山罍常滿房俎無空宋何偃常滿尊銘曰斟酌賦受不踰其量唐李文暕調民黃金造常滿尊以獻十洲記周穆王時西域獻夜光常滿杯杯容三升漢岐山銅器酒尊寶樽章紀建初七年冬十月癸丑幸槐里岐山得銅器形似酒尊獻之又獲白鹿帝曰上無明天子下無賢方伯斯器曷為來哉宋志云詔在道晨夕以為百宫熱酒禮司尊彛注鄭司農云舟車下臺若今時承槃疏漢時酒尊下槃象周時尊下有舟故舉以為况御覽蔡雍論銘曰漢獲齊侯寶樽於槐里東觀記章帝時美陽得銅酒樽采色青黃有古文古今注章帝章和年銅酒爵出河內泌水崔駰樽銘曰惟嵗之元朝賀奉樽金罍犧象嘉禮具存獻酬交錯萬國咸歡蔡雍樽銘曰酒以成禮弗愆以淫德將無醉過則荒淫盈而不沖古人所針尚鑒兹器茂勉厥心晉孫綽亦有銘馮衍爵銘曰富如江海夀配列真選注引之又引李尤盂銘漢金罍玉壺見佩類士冠禮水在洗東注水器尊卑皆有金罍及大小異疏金罍亦漢制少牢云設罍水於洗東有枓注設水用罍沃盥用枓古文苑黃香天子冠頌咸進酌于金罍東都賦列金罍神異經西北荒有酒泉上有玉樽取一樽復一樽與天地同休飲此酒不死博古圖有漢建光巵銘曰建光中室有四又漢犧首杯匏斗螭首巵雲電巵觶紋巵無銘魏陶樽晉禮志魏氏光宅景初元年營洛陽南委粟山以為圓丘祀之日以始祖帝舜配房俎生魚陶樽玄酒魏玉樽宋志陳思王大魏篇豐年大置酒玉樽列廣庭魏犧樽見上魯犧尊南史晉犧樽樂志祠廟饗神歌犧尊既奠清酤既載西征記戴延之太極殿中有銅龍長三尺銅樽容三十斛正旦大會龍從土中受酒口吐之於樽中鄴中記石虎正會殿前有白龍樽作金龍於東箱西向龍口金樽受五十斛孫綽有陽燧樽銘晉白獸樽杜舉遺式白虎樽詳見元會類禮志江左元會設白獸樽於殿庭樽蓋上施白獸有能獻直言者則發此樽飲酒按禮白獸樽乃杜舉之遺式白獸蓋後代所為示忌憚也宋志云白虎樽欲令言者猛如虎無所忌憚也晉起居注穆帝升平二年彭城計佐虞興發白虎樽傅玄朝會賦時鳳虎之二樽清酤皆以淵停齊建元二年有發白虎樽者永明元年元日有發白虎樽梁元會亦設此樽唐李君房白獸樽賦攫地空象夫髬髵揚睛欲聞乎哮吼信履尾而不嘻雖編鬚而何有樽則雲飛而山峙獸乃白質而黑章物盛其容若耽耽其視君能納諫遂諤諤而昌彼美觩然太階之前與諫鼓而齊致言必有章酌而飲焉周有虎彛兕觥博古圖有漢虎斚晉玉觴樂志天郊饗神歌享牷牲享玉觴鐃歌金靈運奠樽俎實玉觴汝南王亮宴公卿以琉璃鍾行酒宋紫玉爵符瑞志王者不藏金玉則黃銀紫玉見泰始元年八月得紫玉攻為二爵獻武文二廟梁古樽南史傳梁劉之遴獻古器四種於東宫其一鏤銅鴟夷榼二銘曰建平二年造二金銀錯鏤古樽二篆銘曰秦容成侯適楚之嵗造三澡灌一銘曰元封二年龜茲國獻四澡盤一銘曰初平二年造齊劉悛於司州得古禮器銅罍瓶豳山銅罍樽銅豆鍾各二獻之唐尊彝六彞匏爵六典太常寺武德中改隋奉禮郎為治禮郎永徽後為奉禮郎凡尊彝之制十有四祭祀則陳之一曰太尊二著尊三犧尊四象尊五壺尊六山罍七概尊八散尊九山尊十蜃尊十一雞彝十二鳥彞十三斚彝十四黃彞禮樂志祭祀之節有六三曰陳設祀之日設酒尊之位上帝太尊著尊犧尊山罍各二在壇上東南隅象尊壺尊山罍各二在壇下南陛之東配帝著尊羲尊象尊山罍各二在壇上五帝日月各太尊二在第一等內官每陛間各象尊二在第二等中官每陛間各壺尊二在第三等外官每道間各概尊二於下壇下衆星每道間各散尊二於內壝之外凡尊皆加勺羃五帝日月以上皆有坫以置爵也宗廟每座斚彛一黃彛一犧尊象尊著尊山罍各二在堂上壺尊二太尊二山罍四皆在堂下階間北向西上六曰進熟太尉洗匏爵酌醴齊進上帝前尊爵之數以太尊實泛齊著尊實醴齊犧尊實盎齊山罍實酒皆二象尊實醍齊壺尊實沈齊皆二山罍實酒四以祀上帝皇地祇神州地祇著尊實泛齊犧尊實醴齊象尊實盎齊山罍實酒皆二以祀配帝著尊二實醴齊以祀內官犧尊二實盎齊祀中官象尊二實醍齊祀外官壺尊二實昔酒以祀衆星日月以上皆有坫迎氣五方五人帝以六尊惟山罍減上帝之半五方帝大享于明堂太尊著尊犧尊山罍各二五方帝從祀于圓丘以太尊實泛齊二五人帝從享於明堂以著尊實醴齊皆二日月以太尊實醍齊著尊實盎齊皆二以山罍實酒一從祀於圓丘以太尊二實泛齊神州地祇從祀于方丘以太尊二實泛齊五官五星三辰后稷以象尊實醴齊七宿以壺尊實沈齊皆二蠟祭神農伊耆氏以著尊皆二實盎齊田畯龍麟朱鳥騶虞玄武以壺尊實沈齊鱗羽螺毛介丘陵墳衍原隰井泉水墉坊郵表畷虎貓昆蟲以散尊實清酒皆二嶽鎮海瀆以山尊實醍齊山川林澤以蜃尊實沈齊皆二伊耆氏以上皆有坫太社以太罍實醍齊著尊實盎齊皆二山罍一太稷后稷氏亦如之其餘中祀皆以犧尊實醍齊象尊實盎齊山罍實酒皆二小祀皆以象尊二實醍齊宗廟祫享室以斚彝實明水黃彞實鬯皆一犧尊實泛齊象尊實醴齊著尊實盎齊山罍實酒皆二設堂上壺尊實醍齊太尊實沈齊山罍實酒皆二設堂下禘享雞彝鳥彝一時享春夏室以雞彝鳥彝一秋冬以斚彞黃彞一皆有玷七祀及功臣配享以壺尊二實醍齊别廟之享春夏以雞彞實明水鳥彞實鬯皆一犧尊實醴齊象尊實盎齊山罍實酒皆二秋冬以斚彛黃彛皆一著尊壺尊山罍皆二凡祀五齊之上尊必皆實明水山罍之上尊必皆實明酒小祀之上尊亦實明水此尊爵之數也凡尊設于神座之左而右向五帝日月以上皆有坫以置爵設御洗于午陛東南亞終獻同洗卯陛之南皆北向罍水在洗東篚在洗西南肆玉幣之篚于壇上下尊坫之所百官志良醖令掌五齊三酒享太廟則供鬱鬯以實六彛門下侍郎大祭祀奏匏爵贊獻裴度黃目尊賦動明酌而曼睩騰光澄舊汙而圓規納照唐夀尊醴尊禮志元正冬至朝賀設夀尊於殿上東序之端西向設坫於尊南加爵一上公詣酒尊所北面尚食酌酒一爵授上公上公受爵授殿中監殿中監受爵置御座前上公北面再拜上千萬嵗夀侍中承制稱敬舉公等之觴又皇帝加玄服尚食實醴尊於東序升帷內坫在尊北通典千秋節受朝賀於樓上御座之東置壽尊又於樓前之東南置壽尊皆有盞斚尚食酌酒以授殿中監上千萬嵗壽南齊太宫元日上壽銀酒鎗唐象尊禮志皇后享先蠶升自壇南陛詣酒尊尚儀贊酌醴齊尚儀以爵酌上尊福酒西向進皇后再拜受爵貴妃自東陛升壇酌盎齊于象尊禮象云舊傳象尊畫象或為象載尊或以其齒飾之亦或空其腹為尊頃見古銅象尊三足象其鼻形望而視之真象也唐嘉爵禮志皇子冠賔詣尊所取爵酌酒進皇子筵前北向立祝曰旨酒既湑嘉薦伊脯乃申其服禮儀有序祭此嘉爵承天之祜唐黃金瓶胡瓶見賜豫器物類唐朱提瓶回紇傳貞觀二十一年入朝正月丙申帝坐便殿天成殿陳十部樂殿前設髙坫置朱提瓶其上潛泉浮酒自左門通坫注之瓶轉受百斛鐐盎回紇數千人飲畢尚不能半朱提縣山出銀見漢書朱提銀重以八兩為一流諸葛亮書云漢嘉金朱提銀唐志曲州故朱提郡北門學士胡楚賔屬文敏甚髙宗命作文常以金銀杯㪺酒飲之文成輒賜焉禁中銀瓶大者髙五尺餘江西李兼獻髙六尺者貞元十二年誕日及端午齊映獻髙八尺餘者唐鶴尊朝野僉載唐韓王元嘉有銅鶴樽背上注酒則一足倚滿則正不滿則傾側唐古銅樽闕三字開元九年三月汝州奏魯山縣之堯山有白鵲見於許昌縣之唐祠掘地得古銅樽上又隱起雙鯉篆書文曰宜子孫請付史官從之長慶二年九月鄜坊得古銅器一有篆文表獻之唐彛尊銘崔渙傳為亳州司功參軍還調於是入判者千餘吏部侍郎嚴挺之施特榻試彛尊銘曰子清廟器故以此題相命唐彛尊龍勺牛僧孺傳開成三年為左僕射以足疾不任出為山南東道節度使文宗賜彞樽龍勺詔曰精金古器以比君子卿宜少留僧孺固請乃行碑云賜清廟器六事皆範金飾玉如古制周竒章志曰黃彞樽龍勺凡二品名出禮明堂曰夏后氏以龍勺注龍頭也用挹六彝之鬱以注圭瓉淳化神龜壽樽淳化元年十月髙麗王治獻神龜壽樽祥符飲福上樽祥符元年九月壬戌禮儀使言皇帝飲福酒以上樽太尉而下以罍今告廟及封禪望令尚食奉御於上樽酌酒以進以交神明之福從之十月辛亥享圜臺上飲福酒十二月丁酉內出泰山封祀上樽酒及玉女白龍王母池水新醴泉賜輔臣唐志太祝以爵酌上尊福酒合置一爵持爵授侍中以進皇帝受爵慶厯玉斚飲福金斚郊廟祭器皇祐宗廟祭器慶厯七年八月二十四日丙寅御崇政殿召近臣觀御書真宗加諡位版又觀新作郊廟祭器以景表尺較其制度未合者悉令改造太常禮院請皇帝獻天帝配帝坐以匏爵亞獻以木爵親祠太廟酌以玉斚亞獻以金斚郊廟飲福皇帝皆以玉斚詔飲福惟用金斚亞終獻酌銀斚八年五月甲辰知制誥吕公綽典領制造郊廟祭器十一月戊戌御延和殿一云崇政殿召輔臣兩制觀新造祭器皇祐五年六月乙亥御紫宸殿奏樂觀宗廟祭器宋朝郊廟陳樽罍之數皆準古而不實以五齊三酒及明水明酒其郊廟天地配位止一樽酌獻一樽飲福餘皆虛器慶厯元年十月壬辰同判太常吕公綽請實樽罍配以明水明酒從之會要凡酒齊皇帝初獻用玉斚亞獻用金斚終獻用瓢斚餘皆用爵維帝之德如玉之溫繼帝之孝如湑之醇皇祐玉爵金斚匏爵元豐玉爵皇祐二年九月二日禮儀使言太廟一人奉玉爵及飲福金斚三人奉亞獻三獻飲福銀斚明堂一人進匏爵并飲酒金斚二人奉亞獻三獻木爵及飲福銀斚三人奉分獻木爵元豐三年八月二十一日詳定禮文言隋志曰明堂之禮方郊為文則不容陶匏請以玉爵代匏爵其豆登簋俎尊罍並用宗廟之器從之紹興四年五月王普言政和新儀宗祀上帝吏部侍郎跪取玉爵於篚則不用陶匏久矣二十五日禮官言陶匏用於郊丘玉爵用於明堂今明堂兼郊禮而舉之器用陶匏蓋未可易元豐宗廟尊彞元豐元年九月十七日詳定禮文所言周禮宗廟尊彞之數隨時而設欲春嗣夏禴用雞彝一鳥彞一犧尊二象尊二罍六秋嘗冬蒸用斚彛一黃彞一著尊二壺尊二罍六大祫從鄭衆説用虎彛一蜼彞一大尊四山尊六罍六為十八尊禘享如祫但減山尊二為十六尊以本周禮南郊禘祫舊無大尊至是皆正之元豐百寶酒船元豐二年四月癸卯太皇太后皇太后幸金明池上扶太皇太后登輦又豫為百寶酒船於是持以上夀文王尊彞周斚紹聖間宗室仲忽獲此器以獻有旨下祕閣考驗仲忽以器銘上一字與小篆鹵字相類遂讀為魯曰此魯公享周文王廟器也館中以為偽仲忽坐罰金其器猶藏祕閣嘉定十六年十月以蜃樽一藏祕府易名周斚禮鬯人山川四方用之紹興金爵玉爵紹興十年九月辛亥祀明堂始用飲福金爵政和大禮舊用萬夀玉尊今以金爵代之十三年親祠內出古制爵坫以易雀背負盞之陋二月二十七日臣僚請攽宣和博古圖改造祭器十二年十二月禮官言親饗太廟飲福用玉爵今欲權用金爵三十二年七月孝皇饗廟禮官請用玉爵紹興五年正月以韓世忠劉光世張俊為淮東西江東宣撫使壬申朝辭命內侍出金盤尊斚賜酒一行并以所飲器賜之博古圖髙克尊銘曰惟十有六年十月既生魄乙未伯太師錫伯克僕山夫伯克敢對揚天祐王伯友用作朕穆考後仲尊高克用丏睂壽無疆克克其子子孫孫永寶用享師艅尊銘曰王汝上侯師艅從王夜功錫師艅金艅則對揚乃德用作乃文考寶彝孫孫子子寶召公尊銘七十二字卣銘曰穆從師淮父戍於古阜蔑歷錫貝山鋝穆拜稽首對揚師淮父休用作文考日乙寶尊彛其子子孫孫永福樂大司徒子象之子洪作旅卣其眉夀子子孫孫永寶用丙寅王錫賔朋用作母乙彞上尊曰彝中尊曰卣下尊曰壺已舉彞李公麟得古爵于夀陽紫金山腹有二字曰已舉王玠獲古爵于洛下有二字曰丁舉籩豆爾雅木豆謂之豆竹豆謂之籩注禮器也夏四璉殷六瑚周八簋明堂位有虞氏之兩敦夏后氏之四璉説文作橽殷之六瑚周之八簋注皆黍稷器疏鄭注周禮舍人云方曰簠圓曰簋鄭注論語云夏曰瑚殷曰璉者誤也陳氏曰瑚以玉簋以竹為之咸春秋正義記明堂位夏器名璉殷器名瑚而包鄭玄等注論語賈服杜注左傳皆云夏曰瑚詩伐木陳饋八簋權輿每食四簋易損卦彖云二簋可用享以木為之地官𤭔人凡賔客共簠簋之實考工記旊人為簋實一觳崇尺厚半寸脣寸豆實三而成觳崇尺疏祭宗廟皆用木簋今此用瓦簋祭天地及外神尚質器用陶匏之類也祭統祭者八簋之實美物備矣祭有餕以四簋黍禮器管仲鏤簋注天子飾以玉堯舜土簋夏楬豆殷玉豆周獻豆明堂位夏以楬豆殷玉豆周獻豆注楬無異物之飾也獻素何反疏刻之方氏曰楬豆以木為柄若蠟氏之楬而已玉豆於楬之上又飾之以玉獻豆若周官再獻之獻禹雕俎唐書禇遂良傳禹雕其俎諌者十餘不止周四籩四豆天官籩人奄一人掌四籩之實朝事之籩其實麷蕡白黑形鹽膴鮑魚鱐饋食之籩其實棗栗桃乾橑榛實加籩之實蓤芡栗脯疏重言之則八籩羞籩之實糗餌粉餈注籩竹器如豆者其容實皆四升朝事謂祭宗廟薦腥之事疏云朝踐饋食薦孰也加籩謂尸既食后亞獻尸所加之籩羞籩謂若少牢主人獻尸宰夫薦房中之羞于尸侑主人主婦皆右之凡祭祀共其籩薦羞之實喪事及賔客共薦籩羞籩醢人奄一人掌四豆之實朝事之豆亦謂朝踐其實韭菹醓醢昌本麋臡菁菹鹿臡茆菹麇臡饋食之豆其實葵菹螺醢脾析蠯醢蜃蚳醢豚拍魚醢加豆之實芹菹兔醢深蒲醓醢箈菹鴈醢筍菹魚醢羞豆之實酏食糝食凡祭祀共薦羞之豆實賔客亦如之疏籩是竹器依漢禮器制度而知也云如豆者皆面徑尺柄尺亦依漢禮知之朝事謂祭宗廟二灌之後祝延尸於户外后薦此八籩儀禮特牲少牢士二籩二豆大夫四籩四豆諸侯宜六天子宜八醢人饋食之豆有八籩人饋食之籩言六不類上文朝事之籩言八下加籩亦八豆與籩並設節數與四籩同時周語品其百籩修其簠簋禮器天子之豆二十有六籩豆之薦四時之和氣也周玉豆魯玉豆雕纂春官內宗掌宗廟祭祀薦加豆籩及以樂徹則佐傳豆籩外宗佐王后薦玉豆眂豆籩以樂徹亦如之王后以樂羞齍則贊大宗伯大祭祀王后不與則攝而薦豆籩徹夏官司士帥屬割牲羞俎豆郊特牲云云疏掌客云上公豆四十侯伯三十二子男二十四禮器云天子之豆二十有六諸公十六諸侯十二上大夫八下大夫六公羊傳注云士三明堂位魯祀周公於太廟灌用玉瓚大圭薦用玉豆雕纂注纂籩屬以竹為之雕刻飾其直疏玉豆以玉飾豆下云殷玉豆是也纂籩也形似筥雕鏤其柄武王於觴豆為銘考工記以瓦為豆醢人四豆以木齊晏子言四升為豆以金為之公羊傳田狩一曰乾豆注豆祭器名狀如鐙周房俎夏嶡殷椇明堂位季夏六月以禘禮祀周公于太廟俎用梡嶡注梡始有四足也嶡為之距疏兩代俎也虞俎名梡按禮圖云梡長二尺四寸廣二尺二寸髙一尺諸臣加雲氣天子犧飾之虞氏尚質未有餘飾夏漸文夏俎名嶡亦如梡而橫柱四足中央如距賀云直有腳曰梡加腳中央橫木曰嶡嶡為之距猶少牢禮言俎距也俎足間有橫似有橫蹶之象俎有虞氏以梡夏后氏以嶡殷以椇周以房俎注梡斷木為四足嶡之言蹶也謂中足為橫距之象周禮謂之距椇之言枳距也謂曲撓之也疏椇枳之木枝多曲橈殷俎似之房謂足下跗也上下兩間有似於堂房魯頌曰籩豆大房魯頌注大房半體之俎疏引明堂位曰周以房俎周語云王公立飫則有房蒸云云周公之廟用梡嶡魯公之廟用大房陸氏曰椇所謂全蒸陳氏曰詩言大房傳言房蒸此房俎也少牢禮言俎距此橫距也雕俎始於禹韓非子堯有天下飯於土簋飲於土鉶舜作為食器流漆墨其上禹作為祭器墨染其外而朱畫其內觴酌有采樽俎有飾此彌侈矣漢算器史記鄭當時傳餽遺人不過算器食注徐廣曰算先管反竹器索隱曰言無銅漆也漢書作具器食漢嘉籩籩豆禮樂志郊祀歌惟泰元章嘉籩列陳庶幾宴享後禮儀志注春秋釋疴曰漢家郡守行大夫禮鼎俎籩豆工歌唐宗廟籩豆光祿式六典奉禮郎凡祭器之位簠簋為前登鈃次之籩豆為後每坐四簋四簠次以六鈃六登籩豆為後會要永徽二年禮部尚書許敬宗言按光祿式祭天地日月嶽瀆先蠶籩豆各四宗廟籩豆各十二社稷先農等各九風雨師等各二籩豆以多為貴宗廟乃踰于天請大祀十二中祀十小祀八詔可傳云顯慶中乾封元年六月二十三日詔宗廟薦享爵及簠簋登鈃各宜别奠開元二十三年正月十八日赦令以籩豆之薦未能備物詔禮官學士共議太常卿韋縚請宗廟籩豆皆加十二又奠爵小宜增大之韋縚傳同兵部侍郎張均職方郎中韋述議曰物有品器有數不可變古從俗舊制一升曰爵五升曰散禮凡宗廟貴者以爵賤者以散此貴小賤大以示節儉請如故賔客崔沔曰未有進時饌用古器者徒以近侈見訾縚又請室加籩豆各六每四時以新果珍羞實之制可天寶五載四月十六日每室加常食一牙盤貞元九年十二月博士韋彤裴堪等議曰禮經前代故事宗廟無朔望祭食之儀園寢則有自貞觀至開元修定禮令皆遵舊典天寶十一載閏三月二十九日初令尚食朔望進食于太廟禮司無著令禮志載籩豆簠簋㽅鈃之實博古圖銘曰叔邦父作簠用征用行用從君王子子孫孫其萬年無疆京叔作饗簋其萬壽永寶用單疑生作養豆用享弡伯作旅匜其子子孫孫永寶用周太師望簋銘曰大師小子師望作鬺彛劉公鋪銘曰劉公作杜嬬尊鋪永寶用是器形若豐然豆類豐似豆而卑劉敞在長安得煮簋銘曰叔髙父作煮簋其萬年子子孫孫永寶用玉海卷八十九
