body:
  text: 玉海卷一百二十一宋王應麟撰官制臺省漢書舊名禁中避元后諱改名省中師古曰省察也言入此中者皆當察視不可妄也說文臺觀四方而髙者也歴代三省三省屬官門下省門下省後漢謂之侍中寺熹平六年改侍中寺晉志曰給事黄門侍郎侍中俱管門下衆務或謂門下省唐龍朔二年改門下省為東臺咸亨初復舊武后光宅初改為鸞臺開元元年改為黄門省至五年復舊侍中晉志曰侍中案黄帝時風后為侍中於周為常伯之任應劭曰侍中周官也秦為侍中本丞相史也漢為加官秦漢無定員冠武弁大冠亦曰恵文冠加金璫附蟬為文貂尾為飾漢谷永對曰昔龍筦納言而帝命惟允四輔既備成王靡有過事誠敕正左右齋栗之臣戴金貂之飾執常伯之職者皆使學先王之道知君臣之義羣寮仰法也魏晉選用稍増華重後周初有御伯中大夫二人掌出入侍從保定四年改為納言斯侍中之職也唐初為納言武徳四年改為侍中龍朔二年改為左相光宅元年改為納言開元元年又改黄門監五年復為侍中天寳元年改為左相至徳初復為侍中按令文掌侍從獻替贊相禮儀審覆奏抄駮正違失監起居注總判省事晉任愷魏舒山濤嵇紹王坦之唐劉洎王珪魏徵元忠馬燧宋璟郝處俊髙儉魏知古門下侍郎秦有黄門侍郎漢因之凡禁門黄闥故號黄門其官給事於黄門之内故曰黄門侍郎魏晉以來並為侍衛之官唐龍朔二年改黄門侍郎為東臺侍郎光宅初改鸞臺侍郎神龍初復舊天寳元年改為門下侍郎員二人掌侍從駮正違失通判省事黄門侍郎魏杜恕任嘏晉稽紹張華給事中加官也秦置漢因之所加或大夫博士議郎掌顧問應對東京省魏復置晉無常員任熈袁凖隋初無至開皇六年始置吏部給事郎煬帝乃移吏部給事郎為門下之職員四人以省讀奏案唐武徳三年改為給事中龍朔二年改為東臺舍人咸亨元年復舊前代雖有給事中之名非今任也今之給事中盖因其名用隋之職散騎常侍秦置漢因之並加官魏文帝用孟達為之魏蒋濟衛臻髙堂隆何晏晉鄭黙阮孚華嶠傅玄王珣譙周諌議大夫秦置掌議論無常員二漢並屬光禄勲後周地官府有保氏規諌天子盖此其任也隋亦曰諌議大夫置七人屬門下省煬帝廢之唐武徳五年復置屬門下省凡四人掌侍從規諷起居郎舍人周官有左右史記其言事盖今起居之本漢武帝有禁中起居注後漢馬皇后撰明帝起居注則漢起居似在禁中為女史之任自魏至晉起居注則著作掌之北齊有起居省後周有内史掌書王言及動作之事以為國志隋以納言統之至煬帝以為古有内史今著作如外史矣宜置起居官以掌其内乃於内史置起居舍人二員唐貞觀二年省於門下省置起居郎二人顯慶中復置遂與起居郎分掌左右龍朔三年改為左右史神龍初復舊每皇帝御殿則對立於殿有命則臨軒俯聽退而書之以為起居注史館得之以撰述焉中書省中書之官舊矣謂之中書省自魏晉始焉梁陳時凡國之政事並由中書省後魏謂之西臺隋初改為内史省唐武徳三年復中書省龍朔二年改為西臺光宅元年改為鳯閣神龍初復舊開元元年改為紫微省五年復舊中書令舜攝位命龍作納言出入帝命周官内史掌王之八柄爵禄廢置生殺與奪執國法及國令之貳以考政事盖今中書之任其所置中書之名因漢武游宴後庭始宦者典事尚書謂之中書謁者置令僕射元帝時恭顯秉勢用事蕭望之以為中書政本宜以賢明充選更置士人自武帝改用宦者掌出入奏事非舊制也成帝建始四年改中謁者令更以士人為之皆屬少府魏文帝黄初初改為中書令又置監魏黄初初改祕書為中書以劉放為監孫資為令掌機宻及明帝時中書監令號為専任其權重矣晉因之張華為監裴楷為令和嶠為令荀朂為監王獻之洽温嶠為令王沈張華華表顧榮庾亮王濛劉琰王濟為郎自魏晉以來中書監令掌贊詔命記㑹時事典作文書以其地在樞近多承寵任是以人固其位謂之鳯皇池焉唐武徳初為内史令三年改為中書令龍朔二年改為右相光宅二年又為内史神龍元年復舊開元元年改為紫微令五年復為中書令天寳元年復為右相按令文掌侍從獻替制敕冊命敷奏文表監起居注總判省事中書侍郎漢置中書領尚書事有丞郎魏初中書既置監令又置通事郎掌詔章後改為中書侍郎晉王基羊祜李重范甯殷康王濛隋初為内史侍郎唐初因之武徳三年改為中書侍郎龍朔以後隨省改號而侍郎之名不易員二人掌侍從獻替制敕冊命敷奏文表通判省事中書舍人魏置中書通事舍人晉江左謂之通事舍人晉劉超徐邈宋鮑照梁裴子野北齊魏收武冠絳服掌呈奏案章後省之而以侍郎一人直西省晉孝武以來常居内殿武官主書於中通呈以省官一人司詔誥位在西省因謂之西省郎即侍郎兼其職而掌其詔命齊永平初置中書通事舍人四員各住一省時謂之四户權傾天下梁用人殊重専簡才能不限資地後除通事直日中書舍人専掌詔誥自是詔誥之任舍人専之隋内史舍人八員専掌詔誥唐初為内史舍人武徳三年改為中書舍人置六員龍朔以後隨省改號而舍人之名不易専掌詔誥侍從書勅宣㫖勞問分判省事自永淳以來天下文章道盛臺閣髦彦無不以文章達故中書舍人為文士之極任朝廷之盛選梁陳五人分掌二十一局事尚書省昔堯試舜於大麓領録天下似其任也周之司㑹又其職焉漢成帝罷中書宦者置尚書五人然其任猶輕至後漢則為優重唐六典秦置尚書禁中有令丞掌通章奏而已事皆决丞相府漢武宣後稍委任光武親總吏職天下事皆上尚書與人主參决乃下三府出納王命敷奏萬機盖政令之所由宣選舉之所由定罪賞之所由正斯乃文昌之府衆務淵藪故李固云陛下之有尚書猶天之有北斗斗為天喉舌尚書亦為陛下喉舌斗斟酌元氣運平四時尚書出納王命賦政四海令及左丞總領綱紀無所不統僕射及右丞分領錢榖二漢皆屬少府詳見少府屬官自魏晉重中書之官尚書之職日以疎逺至梁陳舉國機要悉在中書獻納之任又歸門下尚書但聴命受事而已後周無隋唐皆有制畧同凡尚書省事無不總龍朔二年改為尚書省為中臺光宅初改為文昌臺垂拱元年又改為都臺長安三年又改為中臺神龍初復為尚書省都堂居中左右分司都堂之東有吏部户部禮部三行毎行四司左司統之都堂之西有兵部刑部工部三行每行四司右司統之凡二十四司分曹共理而天下之事盡矣尚書令商制有冡宰為天官六卿總屬焉秦置尚書漢因之後漢衆務悉歸尚書三公但受成而已尚書令主總領綱紀事無不統與司隷中丞朝㑹専席而坐號曰三獨坐魏晉以下任總機衡事無大小咸歸令僕令晉樂廣王戎裴秀荀朂王彪之衛瓘卞壼刁協謝石王述蜀蔣琬費褘勉左丞漢黄香楊喬晉卻詵孔坦梁徐賀琛右丞漢楊喬晉傅咸隋亦總領衆務唐武徳初太宗為秦王時嘗為之其後人臣莫敢當故自龍朔二年二月七日制廢尚書令舊尚書令有大㕔當省之中今謂之都堂僕射秦官漢因之成帝初置尚書五人以一人為僕射後漢尚書僕射一人書尚書事經魏至晉省置無常隋開皇三年詔左右僕射從二品左掌判吏部兵部禮部三尚書右掌判都官度支工部三尚書唐左右僕射因前代本副尚書令自令廢二僕射則為宰相武后改二僕射為文昌左右相神龍初復舊開元元年改為左右丞相天寳元年復唐六典後漢以令僕射六曹尚書為八座魏氏省為五曹則僕射有二若僕射省一則尚書有六今以二丞相六尚書為八座後漢尚書稱臺魏晉已來為省唐貞觀十年治書侍御史劉洎言尚書萬機本八座比於文昌二丞方於管轄爰至曹郎上應列宿中書令張説擇丞轄以王丘左齊澣右唐左僕射裴寂房玄齡于志寧右僕射裴寂蕭瑀杜如晦李靖温彦博髙士亷張行成左丞戴胄王丘韋弘景仁約席豫顔真卿崔從右丞魏徴宇文節齊澣韋温思謙杜正倫劉洎庾承宣西漢中書之權重東漢尚書之權重至魏中書重尚書漸輕政歸尚書漢事也歸中書魏事也元魏時歸門下世謂侍中黄門為小宰相後世相承並號三省隋大業三年四月壬辰以中書省與尚書門下内史祕書為五省増謁者司隷臺與御史為三臺分太府寺置少府監與長秋國子将作都水為五監唐代宗以前中書在上憲宗以後門下在上楊收曰漢制總羣官而聴曰省分務而専治曰寺漢御史臺二臺三臺蘭臺令史五曹隋監察御史古者有御史之名見於周官中士下士為之特小國傳命令者掌贊書授法令至戰國其職益親故獻書多云獻書於大王御史澠池之㑹秦趙各命御史書事淳于髠曰御史在前執法在後皆記事之職至秦人主自親事以操制臣下侍御僕從其勢益重而御史大夫遂與丞相分權矣通典云秦漢為糾察之任表御史有兩丞一曰中丞在殿中蘭臺掌圗籍祕書外督部刺史内領侍御史十五人受公卿奏事舉劾按章元夀二年更名御史長史續志中丞一人御史大夫之丞也舊别監御史在殿中察舉非法及大夫轉為司空因别留中為御史臺率後又屬少府注蔡質漢儀中丞故二千石為之或選侍御史髙第執憲中司朝㑹獨坐内掌蘭臺督諸州刺史糾察百僚出為二千石髙紀十一年二月詔御史中執法下郡守注晉灼曰中丞也陳咸傳為中丞總領州郡奏事課第諸刺史内執法殿中薛宣傳數舉奏部刺史郡國二千石執憲轂下不吐剛茹柔趙后傳詔記盛緑綈方底封御史中丞印于定國傳中丞從事周禮注小宰若今御史中丞漢舊儀中丞督司隷後傳宣秉建武元年拜中丞特詔與司隷校尉尚書令三司各専席而坐號三獨坐趙禮馮緄周紆樊凖馬嚴為中丞周紆傳中丞典司京輦韋昭曰居殿中故曰中丞志治書侍御史二人六百石表御史治書者有印綬選明法律者為之凡天下讞疑事掌以法律當其是非注蔡質漢儀曰選御史髙第補之胡廣曰宣帝齋居决事令侍御史二人治書御史起此冠法冠秩百石與符節郎共平廷尉奏事銅印青綬嚴延年傳注天子欲有拜召持書一作治書御史發符下太尉來歴傳有持書侍御史龔調通典中丞舊持書侍御史也云云魏置治持書執法梁天監初始重其選車前依尚書二丞給三騶執盛印青囊唐永徽初改為中丞隋改中丞為治書侍御史志侍御史十五人六百石掌察舉非法受公卿羣吏奏事有違失舉劾之凡郊廟祠及大朝㑹封拜則一人監威儀有違失劾奏和帝紀注十三州志侍御史周官即柱下史秩六百石掌記注言行糾諸不法員十五人出有所案則稱使者張蒼傳秦時為柱下御史漢官儀冠以鐵為柱漢儀注衣絳給事殿中宿廬在石渠門外列傳嚴延年劾霍光張湯兒寛杜林杜詩張綱朱穆王景王渙王允桓典陳翔何敞楊秉晉志侍御史漢所掌有五曹曰令曹掌律令印曹掌刻印供曹掌齋祀尉馬曹掌廄馬乘曹掌䕶駕豹尾之内便為禁省通典周柱下史秦改為侍御史冠法冠一名柱後恵文後漢皆公府掾屬髙第為之蔡質漢儀云初稱守滿嵗拜真出治劇為刺史二千石平選補令見中丞執板揖寒明以謁者守魏置八人所掌凡八部有持曹課第曹餘則史闕云晉置九人所掌十三曹吏課第直事印中都督外都督媒符節水中壘營軍法筭東晉初省課第曹置庫曹分為外右内左庫曹宋置十八人表侍御史有繡衣直指出討姦猾治大獄武帝所制不常置天漢二年遣直指使者衣繡衣持斧遣元始四年譙玄為繡衣使者持節趙充國傳繡衣來責将軍繡伏湛王莽時為衣執法通典直指而行無私也衣以繡者尊