監不隷麟臺俄改渾儀監七月六日置副監及丞主簿改司辰師曰司辰長安二年八月二十八日復曰太史局廢副監及丞隷麟臺如故改天文博士曰靈臺郎後漢太史有靈臺丞厯博士曰保章正隋置厯博士景龍二年六月二十六日改太史局曰太史監不隷袐書省復置丞景雲元年七月二十八日丁丑又為局隷祕書省踰月為監八月七日嵗中復為局十一月二十一日二年閏九月十日改曰渾儀監開元二年二月二十一日復為太史監改令為監置少監十四年㑹要十五年正月二十七日復為局以監為令而廢少監天寳元年十月三日太史局復為監自是不隷祕書省乾元元年三月十九日曰司天臺藝術人韓頴等建議改令為監置通玄院薛頥善天歩李淳風明厯筭並為太史丞遷為令嚴善思以著佐兼太史令淳風直太史局鑄黄道儀撰法象志春秋夏冬中官正各一人副正各一人掌司四時各司其方之變異冠加一星珠以應五緯衣從其方色乾元元年二月三日司天監韓頴奏請元日冬至朔朝㑹及大禮各奏方事而服以朝見乾元元年置五官正及副五官保章正二人周保章氏後周保章上士中士五官監候三人五官司厯二人掌厯法及測景分至表凖五官靈臺郎各一人掌候天文之變五官挈壺正二人五官司辰八人漏刻博士六人武后長安二年置挈壺正周挈壺司寤氏鷄人凡三職乾元元年與靈臺郎保章正司辰皆加五官之名有漏刻生四十人典鍾典皷三百人㑹要同安隋有天文博士唐初因之長二年改為靈臺郎通典秦漢以來太史之任蓋併周之太史馮相保章三職秦燔書天文星占存而不毁㑹要司天臺内有靈臺以候雲物崇七丈周八十丈總置官六十員臺在永寧坊乾元元年三月十九日制曰舊紀同建邦設都必稽玄象分曹列局皆應物宜靈臺二星主觀察雲物天文正位在太微西南今興慶宮上帝廷也攷符之所合置靈臺宜令所司量事修理靈臺舊在祕書省南天寳十年勅太史監官除朔望朝外非别有公事一切不須入朝宋朝因梁曰司天監元豐改太史局有天文院鍾鼓測驗渾儀刻漏所唐殿中省志殿中省監一人少監二人丞二人監掌天子御服之事其屬有六局曰尚食尚藥尚衣尚乘尚舍尚輦少監為之貳凡聴朝率屬執繖扇列左右大朝㑹祭祀則進爵行幸則侍奉仗内驂乘百司皆納印而藏之大事聴焉有從行百官之印左右仗廐左曰奔星右曰内騎兩仗内又有六廐一曰左飛二曰右飛三曰左萬四曰右萬五曰東南内六曰西南内園苑有官馬坊毎嵗河隴羣牧進其良者以供御六閑馬以殿中監及尚乘主之武后萬嵗通天元年置仗内六閑一曰飛龍二曰祥麟三曰鳯苑四曰鵷鸞五曰吉良六曰六羣亦號六廐以殿中丞檢校仗内閑廐以中官為内飛龍使聖厯中置閑廐使以殿中監承恩遇者為之分領殿中太僕之事而専掌輿輦車馬自是宴游供奉殿中監皆不預開元初閑廐馬至萬餘疋駱駝巨象皆養焉以馳馬隷閑廐而尚乘局名存而已閑廐使押五坊以供時狩一曰鵰坊二曰鶻坊三曰鷂坊四曰鷹坊五曰狗坊侍御尚醫二人上主事二人武徳元年改殿内監曰殿内省龍朔二年曰中御府監曰大監丞曰大夫又進馬五人尚食局奉御二人進御必辨時禁周膳夫内饔尚藥局奉御二人掌和御藥診視侍御醫四人司醫二人尚衣局周司服奉御二人閻立徳武徳中嘗為之掌供冕服几案祭祀則奉鎮圭於監而進于天子大朝㑹設案尚舍局周堂舍奉御二人掌殿庭祭祀張設大朝㑹設黼扆施躡席薫爐尚乗局周巾車奉御二人張萬嵗貞觀中為之掌内外閑廐之馬左右六閑飛黄吉良龍媒騊駼駃騠大苑凡外收嵗進良馬印以三花飛鳯之字飛龍廐日以八馬列宫門之外號立仗馬仗下乃退六典凡十二閑分二廐曰祥麟鳯苑又司廩司庫各一人尚輦局奉御二人直長三人尚輦二人掌輿輦繖扇大朝㑹則陳于庭大祭祀則陳于廟六典注魏氏初置殿中監晉宋因之齊有内外殿中監北齊門下省屬官有殿中監四人隋改為殿内局監大業三年分門下省尚食尚藥御府殿内等局分太僕府車府驊騮等署置殿内省又有奉車都尉十二人唐改為殿中省龍朔二年改曰奉膳奉醫奉冕奉扆奉駕奉輿局宋朝以朝官一員判省事至道元年三月詔殿東省以御街東屋三楹為庫貯法物一楹為省局一楹為吏舍崇寧三年二月辛酉建殿中省至靖康元年廢初元豐五年欲復置六尚如唐故事而禁中未有其地七月壬寅詔御輦院不隷省寺令得自達唐内侍省志内侍省監一人少監二人内侍四人監掌内侍奉宣制令其屬六局曰掖庭宫闈奚官内僕内府内坊少監内侍為之侍皇后親蠶則升壇執儀大駕出入為夾引武徳四年改長秋監曰内侍監内承奉曰内常侍内承直曰内給事龍朔二年改監為省武后垂拱元年曰司宫臺天寳十三年置内侍監改内侍曰少監尋更置内侍有髙品一千六百九十六人品官白身二千九百三十二人令史八人書令史十六人隋大業三年改内侍省為長秋監宦者傳唐制内侍省宦有内侍四内常侍六内謁者監内給事各十謁者十二典引十八寺伯寺人各六又有五局曰掖廷宫闈奚官内僕内府局各有令有丞皆宦官為之太宗詔内侍省不立三品官貞觀中定制以内侍為之長階第四不任以事唯門閤守禦廷内掃除稟食而已㑹要唐制内侍省内侍四人内常侍六人内謁者監六人内給事八人謁者十二人典引十八人内寺伯二人寺人六人别有五局同上李庾西都賦宦者别省延縁右藏建子亭於弄外設蘭錡於廡下唐御史臺記三院六察志御史臺大夫一人中丞二人大夫掌以刑法典章糾百官之罪惡中丞為之貳其屬有三院一曰臺院侍御史隷焉二曰殿院殿中侍御史隷焉三曰察院監察御史隷焉凡寃而無告者三司詰之三司謂御史大夫中書門下大事裁奏小事専達凡有彈劾御史以白大夫有制覆囚則與刑部尚書平閲行幸乘輅車為導朝㑹則率其屬正百官之班序遲明列於兩觀監察御史専舉不如法者大夫杜淹蕭瑀魏元忠宋璟尹思貞李傑朝隠栖筠王丘鄭覃中丞魏元忠宋璟裴度盧坦温造魏謩狄兼謩牛僧孺免盧懷慎奐奕三居其官時傳其美李景讓為大夫劾侍御史髙元裕為中丞言紀綱地宫屬須選奏罷監察不稱職者杜宣猷等開元二十一年十一月大夫崔琳以祕書省東北地修二中丞㕔事髙宗改治書侍御史為中丞以避帝名龍朔二年四月四日改御史臺曰憲臺大夫曰大司憲中丞曰司憲大夫武后文明元年改御史臺曰肅政臺光宅元年九月甲寅分左右臺左臺知百司監軍旅右臺察州縣省風俗尋命左臺兼察州縣兩臺嵗再發使八人春曰風俗秋曰廉察以四十八條察州縣景雲三年即先天元年以兩臺望齊糾舉苛察百僚厭其煩乃廢右臺二月辛酉延和元年㑹要先天二年九月一日即開元元年復置嵗中以尚書省隷左臺月餘而右臺復廢至徳後諸道使府參佐皆以御史為之謂之外臺㑹昌初升大夫中丞品以侍御史殿中侍御史監察御史主留臺務而三院御史亦不常備文宗時中丞髙元裕謂監院御史隷本臺侍御史六人掌糾舉百僚大事法冠朱衣纁裳白紗中單小事常服久次者一人知雜事謂之雜端殿中監察掌臺内事専决亦號臺端次一人知公廨次一人知彈分京城諸司及諸州為東西次一知西推贓贖三司受事號副端次一人知東推理匭等以殿中侍御一人同知東推莅太倉出納第二人同知西推莅左藏出納號四推御史隻日臺院受事雙日殿院受事唐法殿中侍御史遷拜及職事與侍御史鈞開元以降權屬侍御史而殿中兼知庫藏宫門内事故事御史臺不受訟有訴可聞者畧其姓名託以風聞其後御史嫉惡者少通状壅絶開元十四年乃定授事御史一人知其日劾状題告事人姓名其後宰相以御史權重建議彈奏先白中丞大夫復通状中書門下然後得奏自是御史之任輕矣建中元年以侍御史分掌公廨推彈自是雜端之任輕矣元和八年命四推御史受事周而復始罷東西分日之限通典言侍御史職有四謂推彈公廨雜事知雜事者謂雜端最為雄劇食坐之南設横榻謂之南床侍六典云職有六曰奏彈三司西推東推贓贖理匭御史李素立柳範王義方徐有功韋仁約温造隋末廢殿内侍御史義寧元年丞相府置察非掾二人武徳元年改曰殿中侍御史龍朔元年八月置監察御史裏行王立本為之周六典云始於馬武后文明元年置殿中裏行後亦専以裏行名官長安二年置内供奉在正員之外開元十四年崔隠甫奏供奉及裏行並與正員同級殿中侍御史九人六典云六人武徳五年置四人貞觀二十三年加員通典云六員掌殿庭供奉之儀京畿諸州兵皆隷焉正班列於閤門之外糾離班語不肅者元日冬至朝㑹則乘馬具服戴黒豸升殿晉志魏蘭臺遣二御史居殿中伺察非法即其始也晉置二人江左二人唐臨張行成崔仁師許景先源乾曜上官儀曰殿中侍御史赤墀下供奉接武䕫龍簉羽鵷鷺監察御史十五人掌分察百寮廵按州縣獄訟軍戎祭祀營作太府出納皆莅焉凡十道廵按以判官二人為佐務繁則有支使其一察官人善惡二察户口流離賦役不均三察農桑不勤四察妖猾盜賊五察徳行孝悌茂材異等六察黠吏豪宗兼并縱横馬周宋璟蘇頲杜暹李勉顔真卿柳渾陸贄韋貫之韓愈陸元方齊澣初開元中十六年七月十九日兼廵傳驛至二十五年五月以監察御史鄭審檢校兩京館驛大厯十四年九月兩京館御史一人知館驛號館驛使監察御史分察尚書省六司繇下第一人為始出使亦然興元元年十月四日以第一人察吏部禮部兼監祭使第二人察兵部工部兼館驛使第三人察户部刑部嵗終議殿最元和中四年五月以新人不出使無以觀能否乃命顓察尚書省號六察官開元十九年正月二十一日以監察御史二人蒞太倉左藏庫三院御史皆初領繁劇外府推事其後以殿中侍御史上一人為監太倉使第二人為監左藏庫使㑹要御史臺云云與志同光宅元年九月五日改左肅政臺更置右臺令地官尚書韋方質為條例刪定為四十八條以察州縣李嶠上疏垂拱時諸道廵察使科條四十有四至别敕令又有三十而使以三月出盡十一月奏事令所察按凖漢六條而推廣之則無不包矣烏在多張事目也㑹昌三年十一月二十八日中書門下奏大夫秦為上卿漢為副相後為大司空宜升正三品大夫秩崇不常置中丞為憲臺之長升正四品與丞郎出入迭用以重其任殿中侍御史武徳五年三月二十二日置四員貞觀二十二年十二月九日大夫李乾祐奏増兩員李文禮張敬一為之監察御史武徳初因隋至八員貞觀二年二月九日加兩員以李義琰韋務静為之監察非因奏事不得入至殿庭開元七年三月勅隨仗入閤杜易簡御史臺雜注云監察自永徽後又勅授龍朔中李義甫掌選始注御史後遂無吏部注者蘇氏曰御史勅授是開元四年六月十九日勅通典後漢亦謂之蘭臺寺梁及後魏北齊或謂之南臺後周曰司憲屬秋官府隋及唐曰御史臺門北闢取陰殺也鄴都故事龍朔中置司直為東宮之憲府亦開北門故御史為風霜之任貞觀末二十二年大夫李乾祐奏置東西二獄開元中十四年大夫崔隱甫復奏罷之蓺文志杜易簡御史臺雜注五卷髙宗時御史記臺中故事通典四卷韓琬御史臺記十二卷開元初監察卷書目云殿中侍御史韓琬御史臺記十二自唐初訖開元五年臺中官屬凡十有一人皆論建置沿革附以名氏爵里美惡必書敘傳一篇自紀世家并附雜説一十八事韋述御史臺記十卷李植御史臺故事三卷唐朝集使述自周迄隋御史故事併叙漢唐間大夫以下名氏李華御史大夫壁記曰義寧至先天登宰相者十二人以本官參政者十三人故相任者四人開元天寳中至宰輔四人宰輔兼一人世謂除大夫百日有他官相者為辱臺無蕭至忠曰故事臺中長官唐東都留臺㑹要東都留臺官七員中丞一侍御史一殿中二監察三元和十三年三月以中丞崔元畧東都留臺二年四月盧坦自後但以侍御史殿中監察共主留臺之務而三院御史亦不常備焉盧奕蔣沇趙曄東都留臺石柱記曰天垂象聖人則之故星有執法職有司憲皆鐵冠繡衣直指不阿俾在位者肅如也天子在鎬庶官分守於是有留臺上至中司鶚峙都邑髙元裕傳故事三司監院官帶御史者號外臺察風俗舉不法元裕請隷本臺祥符御史臺又見宮室元豐六察開寳四年邊光範兼判御史臺公事興國四年候隲權中丞雍熙三年趙昌言以知制誥正為中丞端拱二年右諫議王化基權中丞始定班制正衙常㕘立中丞磚位内殿起居立本班咸平五年五月温仲舒以禮書為中丞天禧元年右丞趙安仁兼安仁請給御寳印厯書三院糾彈事祥符七年九月知雜王隨請兩制撰重修御史臺記國朝大夫止為兼官中丞除正官外帶他官次有知雜侍御史又有左右廵使分糾違失監察使掌祠祭廊下使掌入閤食監香使掌行香謂之五使有四推臺殿開寳六年九月馮炳為侍御史知雜判臺事十月雷徳驤分判三院初三院多出外任興國三年命張巽為監察始正名舉職天禧元年二月八日丁丑始置言事御史侍御史以下六員不兼領職務其後久不除慶厯五年正月乙亥以殿中梅摯監察李京並為言事御史今中丞聴之南有諌官御史聽盖御史得兼諌職也唐制御史不專言職景祐元年四月二十四日置御史裏行舉三丞歴知縣者為之從中丞韓億之言也元豐二年李定請復六察十二月丙午從之以御史専領二年四月二十七日詔六察官以所糾多寡為殿最中書置簿以時書之五月二日増置臺主簿一員十一月六日詔御史六員三分察三言事六年正月二十四日都司置御史房六月乙巳朔詔六察各置一御史九月二十四日置檢法官八年十月丁丒詔監察兼言事殿中兼察事用吕公著劉摰之言也元豐正名不除太夫檢校官亦除去以中丞為長知雜為侍御史言事為殿中侍御史六察為監察御史使名悉罷二年十二月六日詔御史臺重修一司敕五年六月十四日詔尚書省得彈奏六察失職紹興元年九月侍御史沈與求請舉行元豐六察舊法乾道二年三月十五日詔非歴兩任縣令不除監察非任守臣不除郎官著為令乾道六年五月二十八日詔給舍正於未然之前臺諌救於已然之後事雖至微少有不當隨時奏聞淳熙四年修御史臺彈奏格一卷三百五條以六察為門又有前司一門六察通用一門刑賞為一時之榮辱而其權在時君名義為萬世之榮辱而其權在清議祥符修尚書省祥符四年八月乙巳修尚書省畢命翰林學士晁逈撰記四年四月乙丑葺尚書省天禧四年十一月八日修尚書省龍圗學士陳堯咨總其事通畧云太平興國七年十月十四日壬申幸新尚書省當攷元豐三省中書門下兩省後省兩朝史志中書門下同平章事為宰相之職上相為昭文館大學士監修國史其次為集賢院大學士或置三相則昭文集賢兩學士并監修國史並除參知政事貳宰相參庶務乾徳二年四月以薛居正吕餘慶為之不押班知印不升政事堂止令就宣徽使㕔上視事開寳六年六月詔於都堂與宰相同議公事親王樞宻使留守節度兼中書令侍中同平章事者謂之使相不預政事中書在朝堂西是為政事堂其屬有舍人職誥命闕則以他官知制誥或直舍人院院在中書之西南舍人六員與學士對掌内外制神宗史志中書門下在朝堂西榜曰中書為宰相治事之所又有中書省門下省者存其名列皇城外中書省但掌冊文覆奏考帳門下省主乘輿八寳朝㑹位版流外校考而已中書令侍中不任職官制行悉釐正之乃廢中書門下省舍之在皇城外者併朝堂之西中書堂為門下中書兩省以左右僕射兼門下中書侍郎又以兩侍郎副之元豐三年六月二十一日詔罷中書門下省主判官歸省事於中書五年四月癸丑更官制左僕射兼門下侍郎右僕射兼中書侍郎六月五日丙辰詔事不以大小並中書取㫖門下覆奏尚書施行三省同得㫖更不帶三省字行出輔臣有言中書獨取㫖事體太重上曰三省體均中書省揆而議之門下省審而覆之尚書省承而行之有不當自可論奏先是雖倣舊三省之名而莫究分省建官之意乃釐舊中書門下為三各得取㫖紛然無統至是上一言遂定哲宗即位元豐八年未改元七月六日左丞吕公著言唐太宗以三省長官共議國政事無不總不專治本省事國朝之制便殿奏事止是中書樞宻兩班先帝定官制毎省各為一班三省同上進呈者鮮矣今陛下初聴政責成輔弼執政之臣當一心同力望令三省執政同上奏禀退就本省各舉官制施行從之初元豐五年改官制政柄皆歸中書省王珪以左相在門下拱手不復較故公著為上陳之元祐四年司馬康進其父遺稾乞合中書門下兩省為一朝廷未遑施行按光集盖與吕公著韓維張璪同具奏至建炎三年四月始合三省為一四月十三日庚申右僕射吕頥浩言被㫖參詳元祐中司馬光建請併省奏状臣等㕘酌欲尚書左右僕射同中書門下平章事門下中書侍郎並為參知政事左右丞並罷從之孝宗乾道八年二月六日乙巳詔曰以僕臣而長百僚朕所不取且丞相者道揆之任也三省者法守所自出也捨其大而舉其細豈責實之義乎其改尚書左右僕射同中書門下平章事為左右丞相二月辛亥並命虞允文梁克家三月二十日詔侍中中書尚書令設而不除可並刪去以左右丞相充其位孝宗復六察之彈糾清三省之煩苛門下省神宗史志凡官十有一侍中侍郎左散騎常侍各一人給事中四人左諫議大夫起居郎左司諌左正言各一人國初循唐制以平章事為宰相之職復用兩制以上一員判門下省事其通進銀臺司及門下封駁又離為别司而領於他官至是始釐正焉凡中書密院所被㫖尚書省所上皆奏覆審駁之若制詔宣誥下奏鈔斷案上則給事中讀之侍郎省之侍中審之凡分房十侍中以秩髙未嘗除用他官兼領而不任其事門下外省元豐改官制給事中四人分治六房舊係門下封駁事判後省事鑄印以門下外省為文元豐四年十月按㑹要六年三月十七日壬辰詔後省詳定六曹條貫給事中韓忠彦乞以詳定所為名四月癸亥詔稱中書門下外省先是四年十月二十七日鑄中書舍人印以中書外省為文淳化四年六月戊寅魏庠柴成務同知給事中事制敕不便者凖故事封駁咸平四年九月詔封駁用門下省印遂改為兼門下封駁事中書省神宗史志凡官十有一令侍郎右散騎常侍各一人舍人四人右諌議大夫起居舍人右司諌正言各一人一中書省掌承詔㫖及中外取㫖之事六后妃封親王皇子公主拜三師三公侍中中書尚書令則用冊頒赦降徳音命左右僕射儀同三司節度使則用制遷改官職命詞則用誥非命詞則用勅牒賜中大夫觀察使以上則用詔布告大號令則用御札賜酺戒百官諭軍民則用敕牓皆承制畫㫖授門下省令宣之侍郎奉之舍人行之凡分房八令自建隆以來未嘗除兼領者謂之使相不與政事門下中書後省元豐官制門下中書増建後省以左散騎常侍左諫議大夫左司諌左正言給事中起居郎符寳郎為門下後省設案六以右散騎右諌議右司諌正言中書起居舍人為中書後省設案五八年十月癸酉倣唐六典置諌官中興建炎三年七月辛卯詔諌院别置局不隷兩省又符寳郎並罷其後因舊制置門下後省以給事中為長官四員為額専主封駁書讀設案四中書後省以中書舍人為長官六員為額常除二員掌行誥命設案四又以起居郎舍人専掌修起居注後殿及崇政延和殿侍立講筵亦入侍郎隷門下舍人隷中書隆興初詔前殿侍立乾道九年三月二十一日詔進奏院依舊隷門下後省五房淳化四年八月堂後官五房置六人一人都提㸃五人外掌孔目又吏主户房兵禮房刑房有事勾銷印開寳六年四月癸丑詔堂後官參用士人興國元年以京朝官為之熙寧五年五月増二府胥史之俸熙寧三年九月一日戊午朔置檢正五房公事一人毎房各置檢正二人用先王設攷置輔之意紹興二年三月十五日丁丑復置一員元豐尚書省舊制尚書令僕射丞左右司郎中員外郎主都省事國朝以諸司三品以上官或學士一員權判凡尚書諸司悉他官主判省舊在興國坊太平興國中移於利仁坊祥符四年八月重修晁逈撰記天禧四年十一月八日復修元豐五年四月二十六日詔尚書省寓治舊三司五月朔詔左右僕射丞合治省事六年十一月十九日庚申幸尚書省駐輦令㕔上顧執政曰新省宏壮與官制相稱次至僕射㕔上原闕且率勵官屬勉修職事既又召尚書侍郎以下隨其曹問以職事尚書省即殿前司廨舍地為之自令僕㕔事下至吏舍為屋四千楹有竒四千三十一間曹令㕔在中僕丞分左右六列於後以五年五月癸巳即工六年十月庚子乃成榜曰文昌府上稽古董正治官既復尚書二十四司職掌剏作新省規摹區處皆出制㫖裁定上自為圗授之又以舊中書東西㕔為門下中書省都堂為三省都堂徙建樞宻院於中書省之西以故樞宻宣徽學士院地為中書門下後省列左右常侍至正言㕔事直兩省之後都承㫖司直樞宻院之後由是佐著官儀煥然一新矣先是熙寧三年九月癸丑作東府以居執政官崇寧三年六月庚午改修尚書省從家安國之請也政和四年五月五日幸尚書省神宗史志官凡九人令左右僕射丞左右司郎中員外郎各一人掌行天子之命令及受付中外之事及分房十令國朝以來未嘗除惟親王元佐元儼以使相兼領不與政僕射為宰相之任左右丞貳之元豐祕書省紹興祕書省右文殿秘閣見閣類國朝祕書省判省事一人以判祕閣官兼惟掌常祭祝版凡圗籍悉歸祕閣元豐五年初以崇文院為祕書省以王益柔為監職官志祕書省監掌圗籍國史天文厯數之事祥符三年六月癸亥以尚書右丞向敏中兼祕書監少監為之貳而丞參預之其屬有五修時政記起居注修纂日厯祭祀祝辭則著作郎佐郎主之刋寫分貯集賢院史館昭文館祕閣圗籍則祕書郎主之編校正誤則校書郎正字主之各以其職隷於長貳惟日厯非編修官不預元豐十一月己亥詔分案四太史局隷焉政和五年四月八日丁未幸省庚戌改集賢修撰為右文殿修撰八月十二日詔以祕書省地為明堂遷祕書省於新左藏庫宣和二年九月新省成十二月詔王安中撰記四年三月辛酉幸省御右文殿觀書及古器紹興元年二月十九日丙戌詔復置祕書省寓法恵寺十三年十二月十一日重建是年以殿司寨為省中有殿曰右文政和中亦有之十四年五月御書祕閣右文殿牌七月丙子二十七日幸省淳熙五年九月壬申幸省十二日嘉定六年六月重修紹定四年十一月重建紹興元年五月初復故事召試五年八月甲辰倣唐十八學士之制以十八人為額己巳命著作郎佐祕書郎各二人校書郎正字通十二人少丞不與焉又移史館於省之側别為一所九年修徽宗實録即史館開實録院分案有四又參酌舊制校書正字召試學士院而後命之中興至紹定宰相由此選十四人淳熈二年三月初除莫濟為監祕書監至道宋白淳化李至兼咸平楊徽之景徳畢士安祥符向敏中兼九年楊億以監判祕閣元豐初除龍圖學士王益柔又除趙彦若紹興提舉祕書省麟臺故事舊有提舉官政和七年五月辛卯置即近古修圗書使之任一員以從臣充紹興十四年七月十三日壬戌詔復置以禮部侍郎秦熺兼掌求遺書十五年閏十一月置編定書籍官二十六年十月十四日壬午併歸省二十七年二月十六日壬子復命孟忠厚提舉尋廢淳祐十一年十一月復命趙以夫寳祐二年九月尤焴又提舉太史局紹熙五年閏十月十九日以命薛叔似盖祖宗時有提舉司天監如司馬光錢彦逺沈栝王安禮輩皆為之太史局五官舊止於五官正孝宗時始増春夏秋冬中官五官大夫後魏馮熙為太師領祕書事唐開元十年張說都知麗正殿修書事祕書監徐堅為副天寳十二載左相為祕書省圗書使祥符八年十二月甲辰樞宻使原闕大提點寫校館閣書籍其後命參政提舉原闕寫校書籍慶厯元年宋庠二年王舉正四原闕仲淹嘉祐七年三月歐陽修玉海卷一百二十一
