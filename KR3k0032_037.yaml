body:
  text: 玉海卷三十七宋王應麟撰藝文書隋經籍志書之所興盖與文字俱起孔子觀書周室得虞夏商周四代之典删其善者上自虞下至周為百篇編而序之遭秦滅學至漢惟濟南伏生口傳二十八篇又河南女子得泰誓一篇獻之伏生作尚書傳四十一篇以授同郡張生張生授千乘歐陽生歐陽生授同郡兒寛寛授歐陽生之子世世傳之至曾孫歐陽高謂之尚書歐陽之學又有夏侯都尉受業於張生以授族子始昌始昌傳族子勝為大夏侯之學勝傳從子建别為小夏侯之學故有歐陽大小夏侯三家並立訖漢東京相傳不絶而歐陽最盛初漢武帝時魯㳟王壊孔子舊宅得其末孫恵所藏之書字皆古文孔安國以今文校之得二十五篇其泰誓與河内女子所獻不同又濟南伏生所誦有五篇相合安國並依古文開其篇第以隷古字寫之合成五十八篇其餘篇簡錯亂不可復讀並送之官府安國又為五十八篇作傳㑹巫蠱事起不得奏上私傳其業於都尉朝朝授膠東庸生謂之尚書古文之學而未得立後漢扶風杜林傳古文尚書同郡賈逵為之作訓馬融作傳鄭玄亦為之注然其所傳惟二十九篇又雜以今文非孔舊本自餘絶無師説晉世秘府所存有古文尚書經文今無有傳者及永嘉之亂歐陽大小夏侯尚書並亡濟南伏生之傳惟劉向父子所著五行傳是其本法而又多乖戻至東晉豫章内史梅賾始得安國之傳奏之時又闕舜典一篇齊建武中吳姚興方於大桁市得其書奏上比馬鄭所注多二十八字於是始列國學梁陳所講有孔鄭二家齊代惟傳鄭義至隋孔鄭並行而鄭氏甚微自餘所存無復師説又有尚書逸篇出於齊梁之間考其篇目似孔壁中書之殘缺者故附尚書之末三皇五帝書古三墳禮外史掌三皇五帝之書注楚靈王所謂三墳五典疏按孝經緯三皇無文有文字之後仰錄三皇時事昭十二年左史倚相能讀墳典三墳三皇時書五典五帝之常典延叔堅馬季長等説不同惟孔安國尚書序解與鄭同書序三墳言大道五典言常道春秋正義賈逵云三墳三王一作皇之書五典五帝之典延篤言張平子説三墳三禮禮為人防天地人之禮五典五帝之常道馬融説三墳三氣隂陽始生天地人之氣也五典五行也諸家各以意言杜注云皆古書名史記太史公曰尚書獨載堯以來而百家言黄帝其文不雅馴中興書目三墳之目見於孔序漢志不載元豐中七年毛漸奉使京西得之其書以山氣形為别山墳謂之連山氣墳歸藏形墳坤乾與先儒言三易異其中有姓紀一篇皇策一篇政典二篇合為三卷皆依託也序曰三墳各有傳墳乃古文傳乃隷書胤征引政典今政典之文頗與書合史通諸子廣造竒説其語不經其書非聖故馬遷有言神農已前吾不知矣班固亦曰顓頊之事未可明也程子曰如許行為神農之言及隂陽醫方稱黄帝之説帝典大學帝典曰克明峻徳注堯典虞書舜道經説文虞書曰仁閔覆下則稱旻天荀子解蔽篇舜之治天下不以事詔而萬物成故道經曰人心之危道心之微注今虞書有此語而云道經葢有道之經也夏書左傳賦納以言明試以功戒之用休云云勿使壊念兹在兹成允成功寧失不經官占惟能蔽志皆以為夏書沈潜剛克高明柔克無偏無黨三人占從二人皆以為商書夏書多帥彼天常一句又字小異晉語夏書曰怨豈在明今有書正義左傳荘八年夏書曰臯陶邁種徳僖二十四年夏書曰地平天成二十七年夏書曰賦納以言襄二十六年夏書曰寧失不經皆在大禹臯陶謨當云虞書而云夏書者以事關禹故引為夏書若洪範以為周書以箕子至周商人所陳而傳引之即曰商書也周語夏書有之衆非元后何戴書曰民可近也而不可上也注逸書在湯誓曰余人有辠無以萬夫萬夫有辠在余一人注今湯誓無此言按夫湯誥有作方禹雒書本文緑字九章洪範天錫禹洪範九疇注天與禹洛出書神龜負文而出列於背有數至于九禹遂因而第之以成九類以五行為始一正義云有數從而至于九正義漢書謂為九章劉歆以為禹治洪水錫洛書法而陳之洪範是也龜負洛書經無其事中候及諸緯多説黄帝堯舜禹湯文武受圖書之事皆云龍負圗龜負書緯候之書不知誰作通人討覈謂偽起哀平五行志云凡此六十五字皆雒書本文初一曰等二十七字必是禹加之敬用農用等十八字大劉頋氏以為龜背先有揔三十八字小劉以為敬用等亦禹所第叙其龜文惟有二十字未知孰是皇極稽疑庻徵不言數漢五行志箕子在父師位而典之武王虚己問焉初一至次九凡此六十五字皆雒書本文所謂大法九章大戴禮明堂篇二九四七五三六一八鄭氏注云法龜文也漢人固以九數為洛書隋志洛書六篇晉志大禹觀濁河而受緑字寰瀛之内可得而言緑字非洛出也宋志黄帝龜書岀洛堯沈璧于洛玄龜負書湯東至洛有黑龜赤文成字成王禮洛玄龜背甲刻書赤文成字東京賦龜書畀姒淮南子至徳之世洛出丹書白虎通徳至淵泉則洛出龜書爾雅注河圗曰靈龜負書丹甲青文文選注雒書曰秦失金鏡魚目入珠中候曰玄龜負圗出洛周公援筆以寫光武禪文引雒書劉牧曰易曰天地之數五十有五即洛書自然之數朱文公曰洛書本文四十五㸃葢取龜象凡數自一至五五在中自九至五五亦在中戴九履一左三右七五亦在中關子明曰洛書之文九前一後三左七右四前左二前右八後左六後右黄度曰一九二八三七四六分據八方而五居中商書墨子經五夏書曰禹七年水殷書曰湯五年旱呂氏春秋夏書曰天子之徳廣運乃神乃武乃文注逸書也商書曰五世之廟可以觀怪萬夫之長可以生謀注逸書商書曰刑三百罪莫重於不孝周書曰若臨深淵若履薄氷注周書周文公所作説文商書相時􅧴民記兌命曰民立而正事純而祭祀是為不敬敬孫務時敏尹吉曰吉當作告惟尹躬及湯自周有終孟子伊訓曰天誅造攻自牧宫荀子臣道篇書曰從命而不拂微諌而不倦為上則明為下則遜注書伊訓今無漢書伊訓篇曰誕資有牧方明周書左傳成十六年范文子戒晉侯周書曰惟命不于常注康誥今有襄二十五年衛大叔儀言書曰慎始而敬終終以不困注逸書昭六年叔向言書曰聖作則注逸書二十年苑何忌云康誥曰父子兄弟罪不相及注周書康誥今無傳引周書惟徳是輔乃大明服庸庸祗祗明徳慎罰不敢侮鰥寡大國畏其力恵不恵茂不茂皆今有國語周書所謂重黎實使天地不通周書曰文王至於日中􅉴不皇暇食恵于小民惟政之㳟周書有之曰怨不在大今有孟子康誥凡民罔不憝泰誓曰無畏寕爾也惟曰其助上帝記甫刑曰苗民匪用命君雅曰夏日暑雨君奭曰昔在上帝周田觀文王之徳緇衣注古文為割申勸寧王之徳今博士讀為厥亂勸寧王之徳三者皆異古文似近之呂氏春秋周書曰允哉允哉注逸書説苑周書曰前車覆後車戒文選注周書曰乃辨九服之國又曰湯歸於亳三千諸侯大㑹武王将渡河中流白魚入王舟㑹武王於郊下者八百諸侯周書周史記周記青史氏記周百二十國寶書漢志周書七十一篇注周史記師古曰劉向云周時誥誓號令也葢孔子所論百篇之餘今所存者四十五篇隋志雜史周書十卷雜史七十二部周書十卷為之首汲冡書似仲尼删書之餘唐志雜史汲冡周書十卷孔晁注周書八卷崇文目同史通周書與尚書相類即孔氏刋約百篇之外凡為七十一章上自文武下終靈景其有典雅高義亦有淺末常説殆似後之好事者所増益也書多駁辭宜孔子所不取抑戰國處士私相綴續以周為名孔子亦未必見至若職方之言與周官無異時訓之説比月令多同斯百王之正書五經之别録史通引周書殷祝篇今按汲冡周書十卷晋五經博士孔晁注凡七十篇始於度訓終於器服序在卷末其畧曰昔在文王商紂並立困於虐政将弘道以弼無道作度訓車服制度民不茍踰作器服周道於焉大備孔晁注或稱十卷或稱八卷隋唐志皆云此書得之晉太康中汲郡魏安釐王冡武帝紀咸寕五年十月得竹簡古書然劉向班固所錄並著周書七十一篇且謂孔子删削之餘而司馬遷史記武王克殷事與此合周紀武王登豳阜望洛邑徐廣曰出周書鄭玄注周禮行人云周書王㑹備焉注儀禮鄉射云周書曰比唐以閭説文引逸周書大翰若翬雉豈漢世已入中秘其後稍隱耶篇目比漢但闕其一必班劉司馬鄭許所見繫之汲冢失其本矣時訓明堂記禮者所采録克殷度邑遷史所援據杜氏左傳注引千里百縣疏云周書存者其文非尚書之類左傳疏引周書諡法周公諡法一卷即此書第五十四篇也晉狼瞫曰周志有之勇則害上不登於明堂注周書也其語今見篇中漢小説家虞初周説應劭謂以周書為本説文爾雅注引逸周書楊賜修徳修政之言馮衍傳注小開篇司馬相如傳注王李宅程唐大衍厯議維元祀二月丙辰朔武王訪于周公又竹書十一年庚寅周始伐商文選注周史梓闕之夢皆是書也楚世家欲起無先蘇秦説魏緜綿不絶蔓蔓奈何墨子國無三年之食非其國蒙恬傳必參而五之王商傳以左道事君者誅史貨殖傳農不出則乏食工不出則乏事商不出則三寶絶大戴保傅篇注習之為常皆曰周書淮南汜論訓周書曰上言者常下言者權注以為周史之書蕭何云天予不取反受其咎顔氏注周書本與尚書同類葢孔子所删百篇之外劉向所奏有七十一篇主父偃云安危在出令存亡在所用注以為本尚書之餘陳湯傳谷永云記功忘過宜為君注以為尚書之外周書今書有無其語者豈在逸篇乎文選注引古文周書穆王事遷書正義引汲冡古文云盤庚自奄于殷書正義漢張霸偽造尚書百兩篇而為緯者附之鄭作書論依尚書緯云孔子求書得黄帝玄孫帝魁之書迄於秦穆公凡三千二百四十篇斷逺取近定可為世法者百二十篇以百二篇為尚書十八篇為中候去三千一百二十篇公羊疏公羊以為哀公十四年獲麟之後孔子得端門之命乃作春秋按閔因叙云昔孔子受端門之命制春秋之義使子夏等十四人求周史記得百二十國寶書九月經立感精符考異郵説題辭具有其文如楚之書鄭之志魯之春秋魏之紀年此其可言者又引觧疑論云云詳見古史墨子吾見百國春秋周公朝讀書百篇左傳哀三年南宮敬叔命周人出御書注周人司周書典籍之官史記周紀周太史伯陽讀史記曰云云正義諸國皆有史以記事十二諸侯表太史公讀春秋厯譜諜至周厲王云云孔子西觀周室論史記舊聞興於魯而次春秋左丘明因孔子史記具論其語六國表秦燒詩書諸侯史記尤甚為其有所刺譏也詩書復見者多藏人家而史記獨藏周室以故㓕惜哉獨有秦記不載日月其文畧不具陳氏曰古者諸侯無私史有邦國之志小史掌之而藏周室魯人所謂周人御書晉人所謂辛有之二子董之於是有董史是也陳世家孔子讀史記至楚復陳韓非子周記曰無尊大臣以擬其主國語晉瞽史之記曰唐叔之世将如商數嗣續其祖如榖之滋西方之書有之曰懐與安實疚大事注西方謂周也大戴禮保傅篇青史氏之記曰古者胎教漢志小説家青史子五十七篇古史官記事也風俗通義引青史子書隋志梁有青史子一卷文心雕龍青史曲綴於街談荘子孔子西藏書於周室又金板六弢釋文皆周書篇名蘇秦讀周書隂符左傳注轡之柔矣逸詩見周書疏彼引詩云馬之剛矣轡之柔矣馬亦不剛轡亦不柔志氣麃麃取與不疑其書今在文非尚書之類左傳正義沈氏云嚴氏春秋引觀周篇云孔子将修春秋與左丘明乗如周觀書於周史歸而修春秋之經丘明為傳共為表裏蜀志秦宓曰書非史記周圗仲尼不采漢九家書三家經文藝文志書九家四百一十二篇入劉向稽疑一篇注七畧之外班氏新入古文經四十六卷孔安國作傳疏云同序者同卷經二十九卷大小夏侯二家歐陽經三十二卷師古曰二十九卷伏生傳授者疏云泰誓非伏生所傳傳四十一篇即伏生大傳歐陽章句三十一卷大小夏侯章句各二十九卷大小夏侯解詁二十九篇歐陽説義二篇劉向五行傳記十一卷許商五行傳記一篇周書七十一篇議奏四十二篇石渠論孔子篹凡百篇而為序言作意秦燔書濟南伏生勝獨壁藏之漢興亡失得二十九篇古文出孔壁多十六篇劉向以中古文校歐陽大小夏侯三家經文酒誥脱簡一召誥脱簡二文字異者七百有餘脱字數十劉歆曰孝文始使鼂錯從伏生受尚書泰誓後得博士集而讀之失揚子曰昔之説書者序以百酒誥之篇俄空焉今亡漢儒未嘗見古文仲舒魚烏劉歆丙午還師之言皆與古文不同為禮記以咸有一徳尹牙為尹告君雅司馬遷以盤庚帝辛時文侯之命為重耳鄭玄以胤征為臣名旅獒為酋豪夏侯以嵎夷為鍝銕唐虞官百鄭云官六十劉歆引伊訓誕資有牧方訓漢書曰自古書契之作而有史官其載籍博矣至孔氏篹之上繼唐堯下訖秦繆唐虞以前雖有遺文其語不經故言黄帝顓帝之事未可明也漢古文尚書蓺文志尚書古文經四十六卷為五十七篇注師古曰孔安國書序云凡五十九篇為四十六卷承詔作傳引序各冠篇首定五十八篇鄭玄叙賛云後又亡其一篇故五十七古文出孔子壁中皆古字也隋志孔恵所藏家語孔騰漢記尹敏傳孔鮒藏安國孔子後十一世孫悉得其書攷二十九篇得多十六篇獻之遭巫蠱事未列于學官儒林傳孔氏有古文尚書安國以今文字讀之逸書得十餘篇遭巫蠱未立學官安國授都尉朝司馬遷亦從安國問故遷書載堯典禹貢洪範微子金縢諸篇多古文説朝授膠東庸生生授胡常五十九篇其一是百篇之序伏生所出為今文世所傳百兩篇出東萊張霸分析合二十九篇為數十采左氏傳書叙為作首尾凡百二篇文意淺陋成帝時以中書校之非是注中書天子所藏之書黜其書隋志古文尚書十三卷唐志崇文目同馬融注十一卷鄭玄注九卷唐志同王肅注十一卷唐志十卷晉范寗注古文舜典一卷唐志任孝㳟古文大義二十卷顧彪音義五卷杜林傳古文賈逵作訓馬融作傳鄭玄為注然其所傳惟二十九篇雜今文非孔舊本晉世祕府所存有古文尚書經文今無傳者正義安國傳不行張霸之徒偽作舜典汩作九共大禹謨益稷五子之歌胤征湯誥咸有一徳典寶伊訓肆命原命武成旅獒冏命二十四篇除九共九篇共卷為十六卷故以伏生二十八篇分出舜典益稷盤庚二篇康王之誥及泰誓三篇為三十四篇合於孔氏五十八篇四十六卷之數志云古文又多十六篇篇即卷也即是偽書二十四篇不見孔傳劉向班固劉歆賈逵馬融皆不見真古文而誤以此為古文馬鄭諸儒莫覩其學見於經典者諸儒皆謂逸書鄭玄亦不見之鄭注書仲虺之誥太甲説命等見在而云亡其汩作典寶等十三篇見亡而云逸賛鄭序以為虞夏書二十篇商書四十篇周書四十篇云三科之條五家之教是虞夏同科也百篇次第孔鄭不同孔依壁内篇次及序為文鄭依賈氏所奏别録為次鄭注禮記遇引今尚書所有之文皆曰逸書桓譚新論云古文尚書舊有四十五卷服䖍杜預皆不之見注左傳亂其紀綱云夏桀時杜又注左傳成允成功念兹在兹寧失不經辰不集于房官占唯能蔽志惟彼陶唐怨不在明皇天無親民之所欲大國畏其力官師相䂓趙岐注孟子天降下民作之君作之師綏厥士女湯一征自葛始丕顯丕承韋昭注國語衆非元后何戴關石和鈞皆以為逸書孟子引太誓曰我武惟揚趙岐謂古尚書百二篇之時太誓也按伏生所傳三十四篇謂之今文則夏侯勝夏侯建歐陽和伯三家所傳及蔡邕所勒石經是也孔所傳者庸生劉歆賈逵馬融等所傳是也劉歆賈逵馬融等並傳孔學云十六篇逸與安國不同者良由孔注之後其書散逸傳注不行庸生賈馬等惟傳孔學經文三十三篇鄭與三家同題曰古文尚書篇與夏侯等同而經字多異晉王肅注書始似竊見孔傳注亂其紀綱為夏太康時晉皇甫謐得其書載於世紀鄭冲得而傳之授蘇愉愉授梁栁栁即謐之外弟也授臧曹曹授梅賾一作頥奏上其書元帝時亡舜典一篇自乃命以位以上二十八字世所不傳乃取王肅注堯典慎徽五典以下分為舜典一篇續之晉末范寗為解時已不得焉至齊建武四年姚方興於大航頭得而獻之事亦随寝釋文若稽古以下十二字是姚方興上孔氏傳本無或更有濬哲以下凡二十八字異至隋開皇二年募遺典乃得其篇自漢武至隋開皇凡六百七十餘年然後五十八篇傳學者正義又曰史記及儒林傳云伏生獨得二十九篇以教齊魯則今之泰誓非初伏生所得鄭玄書論云民間得泰誓别録曰武帝末得於壁内獻之與博士使讀説之數月皆起傳以教人房宏等説云宣帝元年河内女子有壊老人屋得古文泰誓三篇今史漢書皆云伏生則司馬遷時已得泰誓以并歸於伏生不得云宣帝時始出也書是本名尚是伏生所加伏生本二十八篇盤庚出二篇加舜典益稷康王之誥凡五篇為三十三篇加所增二十五篇為五十八加序一篇為五十九為例有十曰典謨貢歌誓誥訓命征範孔依壁内篇次及序為文鄭依賈氏所奏别録為次百篇次第孔鄭不同孔傳三十三篇與鄭注同二十五篇増多鄭注畢命正義漢初不得此篇有偽作其書以代之者漢律厯志云康王十二年六月戊辰朔三日庚午故畢命豐刑曰惟十有二年六月庚午朏王命作䇿書豐刑此偽作者不知豐刑之言何所道也鄭康成曰今其逸篇有册命霍侯之事不同與此序相應非也康成所見又似異於豐刑皆妄作也君奭五義鄭玄不見周官之篇言此師保為周禮師氏保氏大夫之職言賢聖兼此官無逸疏鄭玄云祖甲帝甲也盤庚疏束晢云尚書序将治亳殷孔子壁中尚書云将始宅殷豈與古文不同也晢不見壁内之書妄為説耳春秋正義今尚書太誓謂漢魏諸儒馬融鄭玄王肅等所注者漢初尚書唯得二十八篇故大常孔臧與孔安國書云二十八篇前世以為放二十八宿不知有百篇也後又得偽太誓一篇通為二十九篇漢魏未立於學官馬融尚書傳序云太誓後得按其文似若淺露書傳所引太誓不在太誓者甚衆畧舉五事以明之春秋國語孟子孫卿禮記王肅亦云太誓近非本經杜氏在晉初亦未見真本元帝時梅賾始獻安國所注古文其内有泰誓三篇記傳所引悉有之漢魏諸儒不見古文因伏生之謬從堯典至胤征凡二十篇摠名曰虞夏書故傳通謂大禹謨以下皆為夏書竹書說伊尹之事與書序大乖杜不見古文唯以書序考正按王肅注尚書其言多是孔傳疑肅見古文匿之而不言也後漢紀章帝建初八年十二月戊申詔選髙才生受古文安帝延光二年正月選三舍郎及吏人能通古文尚書毛詩榖梁春秋各一人傳杜林博洽多聞時稱名儒河南鄭興東海衛宏等皆長於古學興嘗師劉歆林遇之訢然濟南徐廵始事宏後更受林學林前於西州得漆書古文尚書一卷寶爱之出示宏等曰林雖兵亂常恐斯經将絶何意二子復能傳之斯道竟不墜於地宏為作訓㫖於是古文遂行林張敞外孫能讀古字作訓詁鄭玄從張㳟祖受古文尚書以山東無足問者乃西入關事馬融賈逵父徽受古文尚書於塗惲風俗通曰塗姓塗山氏之後惲字子貢學尚書於胡常見前書張楷通古文作尚書注周磐學古文洪範盧植上書曰少從通儒馬融受古學願詣東觀專心研精合尚書章句劉祐學古文尚書傳注尹敏習歐陽尚書後受古文周防事葢豫受古文尚書撰尚書雜記孔僖自安國以下世傳古文尚書楊倫師事丁鴻習古文尚書特徵博士衛宏從杜林更受古文尚書作訓㫖儒林傳師古注引衛宏定古文尚書序以儒林傳有私行金貨定蘭臺漆書經字合私文吳志虞翻傳奏鄭玄解尚書違失事目古文篆卯字讀當為栁古栁卯同而以為昧分北三苗北古别字又訓北猶别也又云所注五經違義尤甚者六十七事不可不正周禮注書曰度西曰栁榖釋文云古文宅與度字相似月令疏異義云今文尚書歐陽說古尚書說記緇衣注古文周田觀文王之徳為割申勸寧王之徳今博士讀為厥亂勸寧王之徳三者皆異古文似近之詩鹿鳴箋書曰篚厥玄黄疏鄭禹貢注引胤征曰篚厥玄黄鄭不見古文而引張霸尚書詩箋又引書曰天将有立父母民之有政有居今泰誓文詩疏洪範稽疑論卜兆有五曰圛注云圛者色澤光明葢古文作悌今文作圛賈逵以今文較之定以為圛鄭依賈氏所奏大明疏太誓曰師乃鼓譟前歌後舞格于上天下地咸曰孜孜無怠疏又引太誓云司馬在前王肅曰司馬太公也商頌疏賈逵馬融説尚書云史記惟刑之静哉注今文云惟刑之謐哉魯世家作餽禾殷紀小辛立百姓思盤庚乃作盤庚三篇伯禽作肹誓索隠按尚書大傳作鮮誓索隱古文在治忽今文作采政忽史記作來始滑平章百姓今文作辯章春言東作夏言南為漢郊祀志太誓曰正稽古立功立事可以永年丕天之大律今文後楊賜傳書曰天齊乎人假我一日劉愷傳尚書曰上刑挾輕下刑挾重注與今尚書不同水經注淇水又北逕頓丘縣故城西古文尚書以為觀地葉氏曰安國自以博考經傳採摭羣言然孟子載伊訓造攻自牧宫不言鳴條春秋傳述五子之歌衍率彼天常一句證康誥父子兄弟罪不相及今文乃無有若荀卿引中蘬曰諸侯自為得師者王得友者霸引康誥曰惟文王敬忌一人以擇其繆妄如此禮記以申勸寧王之徳為田觀文王以庻言同亡則繹字其乖啎如此朱文公曰漢書引泰誓云立功立事疑即武帝世所得者律厯志所引畢命伊訓字畫有與古文略同者疑即伏生口傳而晁錯所屬讀者其引武成則伏生無此篇必張霸所偽作漢尚書逸篇記坊記注今泰誓無此章正義鄭不見古文尚書漢時别有尚書逸篇四月太子發上祭於畢以下三篇之事隋志徐邈撰古文尚書音一卷尚書亡篇序一卷梁五經博士劉叔嗣注尚書逸篇二卷出於齊梁間考其篇目似孔氏壁中書之殘缺者故附尚書之末唐志徐邈注尚書逸篇三卷書正義錯亂摩滅四十二篇以不可復知亦上送官張霸之徒於鄭注之外偽造二十四篇劉向别録云五十八篇藝文志云古文又多十六篇篇即卷也即是偽書劉歆三統厯論武王伐紂引今文泰誓云丙午逮師武成越若來三月五日甲子咸劉商王受並不與孔同亦不見孔傳也賈逵云流為烏與孔亦異董仲舒對䇿引偽泰誓文是武帝時已得之漢律厯志引武成篇云惟一月壬辰至祀於周廟與此經不同彼是焚書之後有人偽為之漢世謂之逸書其後又亡其篇鄭玄云武成逸書建武之際亡謂彼偽武成也孟子注孟子時尚書凡百二十篇逸書有舜典之叙亡失其文孟子諸所言舜事皆堯典及逸書所載孟子注自常常以下皆尚書逸篇之辭白虎通書逸篇曰厥兆天子爵尚書亡篇曰太社唯松東社唯栢南社唯梓西社唯栗北社唯槐北史劉芳傳尚書逸篇曰太社唯松南史任昉得一篇缺簡劉顯曰是古文尚書所刪逸篇昉檢周書果如其説左傳聖作則慎始而敬終終以不困命以伯禽唐誥皆䇿命篇名漢律志先其筭命注逸書孔叢子維高宗報上甲微孟子不及貢以政接于有庳史記恃徳者昌恃力者亡說文引逸周書漢五行志注引逸周書厯志引古文月采篇畢命豐刑莽傳有書逸嘉禾篇趙岐杜預韋昭注書凡見於二十五篇之内者皆謂逸書實未嘗逸也漢尚書三家博士尚書古文同異蓺文志歐陽章句三十一卷大小夏侯章句各二十九卷大小夏侯解故二十九篇歐陽説義二篇訖孝宣世歐陽大小夏侯氏立於學官後儒林傳前書伏生傳尚書授歐陽大小夏侯氏三家皆立博士孔安國傳古文未得立前傳賛武帝立五經博士開弟子員百有餘年傳業寖盛初書唯有歐陽至孝宣世復立大小夏侯尚書平帝時又立古文歐陽生字和伯千乗人事伏生授兒寛寛授生子世世相傳至曾孫高為博士高孫地餘為博士論石渠至歙八世博士林尊事高為博士論石渠授平當陳翁生當以明經為博士由是有平陳之學翁生授殷崇為博士當授朱普為博士桓榮受朱普學章句四十萬言浮辭過實榮入授顯宗顯宗師事博士桓榮學通尚書世祖受尚書於許子威减為二十三萬言子郁復刪省定成十二萬言由是有桓君大小太常章句榮世相傳授代作帝師建寧初詔太傅三公選通尚書桓君章句者三公舉楊賜侍講華光殿楊震受於桓郁張酺事榮丁鴻從榮明章句善論難為都講牟長習歐陽拜博士著録萬人著尚書章句皆本之歐陽氏俗號牟氏章句宋登教授數千人尹敏初習歐陽後受古文張奐事朱寵學歐陽尚書初牟氏章句浮辭繁多注牟卿受書於張堪為博士有四十五萬餘言奐減為九萬言杜喬治歐陽徐穉學歐陽鮑永習之大夏侯都尉名從濟南張生張生受尚書於伏生傳族子始昌始昌傳勝勝又事蕳卿兒寛門人勝從始昌又從歐陽氏問為學精熟所問非一師宣帝時遷太子太傅受詔撰尚書論語説賜黄金百斤師古曰解説其意若今義疏也志論語魯夏侯説二十一篇孔霸事勝為博士周堪事勝論石渠經最高堪授牟卿為博士及許商覇子光亦事牟卿由是有孔許之學商門人炔欽為博士宋意父京張子雋賈逵以大夏侯教授牟融習大夏侯吳良習大夏侯學通師法經任博士小夏侯勝傳從兄子建建師事勝又事歐陽高左右采獲又從五經諸儒問與尚書相出入者牽引以次章句具文飾説勝非之曰建所謂章句小儒破碎大道建亦非勝為學疎畧難以應敵建卒自顓門名經張山拊事建為博士論石渠授李尋鄭寛中張無故秦恭近君假倉無故善脩章句恭增師法至百萬言倉論石渠寛中以博士授太子由是有鄭張秦假李氏之學恭授馮賓為博士蓺文志說五字之文至於二三萬言注桓譚新論云秦近君能説堯典篇目兩字之説至十餘萬言但説曰若稽古三萬言中興王良習小夏侯古文周防薦補博士楊倫特召博士晉太興初尚書鄭氏古文孔氏置博士儒林傳兒寛又受業孔安國初見武帝語經學上曰吾始以尚書樸學弗好及聞寛説可觀乃從寛問一篇歐陽大小夏侯氏學皆出於寛後賈逵傳肅宗好古文尚書逵數為帝言古文與經傳爾雅詁訓相應詔令撰歐陽大小夏侯尚書古文同異逵集為三卷帝善之復令撰齊魯韓詩與毛氏異同并作周官解詁建初八年乃詔諸儒各選高才生受古文尚書逵著經傳義詁及論難百餘萬言學者宗之儒林傳扶風杜林傳古文同郡賈逵作訓馬融作傳鄭玄注解由是古文遂顯輿服志永平二年乘輿服從歐陽氏説公卿以下從大小夏侯氏説元初六年以歐陽家説更六宗祠隋志三家並立而歐陽最盛晉永嘉之亂歐陽大小夏侯尚書並亡史記正義七録云三家至西晉並亡書正義歐陽夏侯謂父族四母族三妻族二堯典九族歐陽大小夏侯說皆云在六者之間助隂陽變化舜典六宗詩正義異義九族今禮載尚書歐陽說云九族乃異姓有親屬者父族四母族三妻族二古尚書說上從髙祖下至玄孫凡九皆為同姓類上帝尚書夏侯歐陽說以事類祭之就南郊月令疏引異義云今文歐陽說古尚書說云云周禮疏夏侯歐陽說其罰百率古文尚書說百鍰正義按史記秦時焚書伏生壁藏之後求其書亡數十篇獨得二十九篇以教於齊魯之間而云口以傳授者盖傳教既久誦文則熟又言裁二十餘篇意以為少之辭又二十九篇自是計卷若計篇則三十四去泰誓猶有三十一劉歆云泰誓後得别録云武帝時民得於壁内獻之隋志伏生口傳二十八篇又河内女子得泰誓一篇三統厯引武成粤若來三月武王燎于周廟刑法志引泰誓立功立事皆今文也尚書大傳漢蓺文志傳四十一篇即大傳也隋志大傳三卷鄭玄注崇文目同顧彪撰音二巻伏生作尚書傳四十一篇授同郡張生張生授千乘歐陽生唐志伏勝注大傳三卷又暢訓一卷舊唐志尚書暢訓三卷㐲勝注中興書目按鄭康成序云盖自伏生也伏生為秦博士至孝文時年且百嵗張生歐陽生從其學而授之音聲猶有訛誤先後猶有差舛重以篆隷之殊不能無失生終後數子各論所聞以己意彌縫其闕别作章句又特撰大義因經屬指名之曰傳劉向校書得而上之凡四十一篇至康成始詮次為八十三篇經典序録尚書大傳三卷伏生作大傳篇目有九共帝告嘉禾揜誥之類虞傳有九共引書曰予辯下土使民平平使民無傲殷傳有帝告引書曰施章乃服明上下又大傳云子夏讀書畢見夫子夫子問何為於書對曰書之論事昭昭如日月之代明離離如參辰之錯行禮記周禮注疏白虎通文選注多引大傳史記厥恊六經異傳索隱云如尚書大傳劉向傳賛鴻範論發明大傳著天人之應後漢五行志五行傳注稱鄭玄曰皆出注大傳也郎顗傳尚書洪範記曰月行中道移節應期徳厚受福重華留之晉五行志漢文帝時虙生創紀大傳周禮疏書曰者是濟南伏生書傳文王制疏伏生書傳有虞夏傳玉藻疏唐傳云古者有命民有餙車駢馬衣錦詩疏堯典平章百姓書傳作辯章平辯義通又引殷傳書正義引伏生書傳西伯戡黎引伏生書傳云書序伏生口以傳授裁二十餘篇伏生以舜典合於堯典益稷合於臯陶謨盤庚三篇合為一康王之誥合於顧命釋文曰即馬鄭所注二十九篇疏泰誓本非伏生所傳武帝世始出而得行史因以入於伏生所傳之内故云二十九篇堯典臯陶謨禹貢甘誓湯誓盤庚高宗肜日西伯戡黎微子牧誓洪範金縢大誥康誥酒誥梓材召誥洛誥多方多士立政無逸君奭顧命吕刑文侯之命費誓秦誓凡二十八篇加泰誓為二十九古文增多二十五篇大禹謨至冏命復出五篇儒林傳秦時伏生壁藏漢定求其書亡數十篇獨得二十九篇教于齊魯之間孝文詔太常使掌故晁錯徃受之注師古曰衛宏定古文尚書序云伏生老不能正言言不可曉使其女傳言教錯齊人語多與潁川異錯所不知凡十二三畧以其意屬讀而已史記漢定天下伏生求其書亡數十篇獨得二十九篇以教于齊魯之間掌故朝錯受之何比干學於錯尚書中候隋志尚書中候五卷鄭玄注梁有八卷今殘缺正義鄭玄注中候依運斗樞以伏犧女媧神農為三皇又云五帝帝鴻金天高陽高辛唐虞氏六人名五帝詩正義中候苗興稱堯受圖書已有稷名在録中候合符后云云握河紀說堯考河命說舜契握云云云洛予命云天乙在亳東觀於洛我應云云稷起云蒼耀稷生感迹昌南齊志引儀明篇漢中文尚書劉陶傳明尚書春秋為訓詁推三家尚書夏侯勝建歐陽和伯及古文是正文字七百餘事名曰中文尚書漢尚書雜記後儒林傳周防受古文撰尚書雜記三十二篇四十萬言張奐傳學歐陽著尚書記難三十餘萬言漢鄭玄書贊正義鄭玄書贊云我先師棘子下生安國亦好此學衛賈馬二三君子之業又云孔子乃尊而命之曰尚書選序名故謂之贊藝文志注師古曰鄭玄序贊云後又亡其一篇書正義鄭玄注書序舜典云入麓伐木注五子之歌云避亂於洛汭注胤征云胤征臣名又注禹貢引胤征云厥篚玄黄昭我周王又注咸有一徳云伊陟臣扈曰又注典寳引伊訓云載孚在亳又曰征是三朡又注旅獒謂酋豪之長漢尚書正經荀爽傳爽著禮易傳詩傳尚書正經春秋條例又作公羊問及辨䜟朱文公以諸篇本文為經而復合序篇於後漢尚書史通晉廣陵相孔衍以為國史所以表言行昭法式至於人理常事不足備列乃删漢魏諸史取其美詞典言足為龜鏡者定以篇第纂成一家由是有漢尚書後漢尚書漢魏尚書凡為二十六巻唐志雜史類孔衍漢尚書十巻後漢尚書六卷漢魏尚書十四卷隋志雜史魏尚書八卷孔衍撰梁十卷書傳畧説禮大行人疏按書傳畧説云天子太子年十八授孟侯詩正義引之孟侯者四方諸侯來朝迎於郊或可逺郊勞使世子為之是以孝經注亦云世子郊迎郊迎即郊勞也彼雖據夏法周亦然玉藻疏按書傳畧説云祀上帝於南郊即春迎日於東郊王制疏見學類檀弓疏周以至動殷以萌夏以芽公羊疏書傳畧説魏尚書釋問隋志魏侍中王粲尚書釋問四卷唐志四卷王粲問田瓊韓益正王肅尚書駁議五卷唐志云釋駁義問三卷鄭玄王肅及晉博士孔晁撰唐志王肅孔安國問答三卷顧歡百問一卷巢猗百釋三卷尚書釋問一卷虞氏撰詩正義引王肅注晉集解尚書隋志東晉李顒集解尚書十一卷唐志云集注尚書新釋二卷宋姜道盛集釋尚書十一卷唐志云集注經典序録李顒注十卷姜道盛集解十卷范寗集解十卷正義李顒集注尚書於偽泰誓引孔安國南史孔子祛著尚書義二十卷集注尚書三十卷梁尚書大義隋志尚書大義二十卷梁武帝撰梁主言本有兩泰誓兼而存之古文伐紂今文觀兵時事唐志任孝㳟古文大義二十卷唐二十五家書藝文志經録二曰書類二十五家三十三部三百六卷始於古文孔安國傳注釋有謝沈王肅范寗李顒姜道盛鄭玄呂文優王玄度傳有孔安國古文伏勝大傳暢訓劉向洪範五行傳論馬融傳義疏有伊説巢猗費甝蔡大寶劉焯顧彪劉炫孔頴逹注逸篇則徐邈古文大義則任孝㳟音義則顧彪王儉王孔之問答王粲之釋問顧歡巢猗之百問百釋衛包之今文終於正義不著録者王元感糾繆穆元休洪範外傳陳正卿續尚書崔良佐演範四家二十卷隋志三十二部二百四十七卷崇文目七部八十一卷中興書目二十二家一百八十七卷續目十二家二百六十六巻今所傳乃唐天寶所定之本唐尚書正義志尚書正義二十卷國子祭酒孔頴逹太學博士王徳韶等奉詔撰四門博士朱長才蘇徳融助教王士雄趙弘智覆審書目云永徽四年長孫無忌等承詔刋定正義序古文經晚行隋初始流河朔其為正義者蔡大寶三十卷巢猗三卷費甝十卷顧彪二十卷劉焯三十卷劉炫二十巻諸公文義淺畧唯焯炫最詳雅貞觀十六年奉敕與長才等對敕使趙弘智覆審穎逹因費甝義疏質其異同或存或去卷隋書顧彪為祕書學士撰古文尚書義疏二十晉伊説義疏四卷亡譏唐志劉炫述義二十卷目顧彪文外義一卷卷南史張尚書義十五卷崇文又有廣疏十八唐今文尚書隋今字尚書志今文尚書十三卷開元十四年八月十四日玄宗以洪範無偏無頗聲不協詔改為無偏無陂天寶三載七月又詔集賢學士衛包改古文從今文其蒨本仍藏書府隋志古文尚書十三卷今字尚書十四巻孔安國傳釋文孔氏用隷書寫古文凡四十二篇亡汩作至亳姑亡虞書十六篇十一篇五篇存為夏書九篇五篇亡一云夏書唯四篇馬鄭以五亡篇商書商書三十四篇十七篇亡十七篇存周書四十一篇九篇亡三十二篇存正義衛宏古文竒字序云秦改古文以為篆隷又曰古文者蒼頡舊體周世所用之文字自蒼頡至周宣皆蒼頡之體史籀始有大篆十五篇號曰篆籀惟篆與蒼頡二體而已秦罷古文而有八體非古文矣以至亡新六書并八體亦用書之六體以造字於秦八體用其小篆蟲書摹印隷書去其大篆刻符殳書署書而加以古文竒字大篆非古文蟲書非科斗書也唐尚書糾繆志王玄感尚書糾繆十卷㑹要長安三年三月上又禮繩愆三十卷春秋振滯二十巻魏知古謂五經指南唐尚書演範洪範外傳志崔良佐演範卷亡穆元休外傳十卷元休穆寕父撰外傳十篇開元中獻之賜帛授偃師丞唐無逸圖見圖類唐尚書君臣事迹圖見圖類舊紀穆宗即位元和十五年三月壬子召侍講學士韋處厚路隋於太液亭講毛詩關雎尚書洪範等篇既罷並賜緋魚唐李至逺周書見編年類唐續尚書文中子續書志陳正卿續尚書纂漢至唐十二代詔䇿章疏歌頌符檄論議成書開元末上之巻亡不著録蕭頴士代正卿表尋討載籍始有漢二典次我唐二典以續唐虞之典文景明章之後魏晉宋齊以還南訖有陳北起元魏歴周隋洎高氏至聖朝總十二代詔䇿章疏歌頌符檄忠臣之正議武士之權謀類而刋之次以年代以續夏商秦魯之篇嘗讀貞觀實録太宗因聴政之暇觀覽尚書謂侍臣曰朕每庻希唐虞亦思公等齊肩稷契愚臣緬述太宗之㫖勒成帝典不亦宜乎王勃傳祖通隋末居白牛溪教門人甚衆起漢魏盡晉作書百二十篇以續古尚書後亡其序有録無書者十篇勃補全缺逸定著二十五篇杜淹撰世家云文中子續書一百五十篇列為二十五巻勃序云董薛之徒並受其義貞觀中太原府君考六經之目亡其小序有録無篇者又十六焉為作序補其闕始總章二年洎咸亨元年定成百二十篇二十五卷時龍集閹茂唐御天下五十七祀也文中子中説續書始於漢以存漢晉之實起漢高祖止晉武帝續書帝制公命惟漢有之君志臣事至晉太康而止以制命不及黄初志事不及大熈魏承漢有魏無吳蜀天子之義列乎範者四曰制誥志䇿大臣之義載乎業者七曰命訓對讚議誡諌賈瓊習書至桓榮之命又至郅惲之事曰制命著其道志事著其節白居易補湯征陳黯作禹誥蘇綽為大誥開寶尚書釋文咸平古文音義唐陸徳明釋文用古文後周顯徳六年郭忠恕定古文刻板忠恕定古文尚書并釋文太祖命判國子監周惟簡等重修開寶五年二月詔翰林學士李昉校定上之詔名開寶新定尚書釋文咸平二年十月乙丑孫奭請摹印古文尚書音義唐志顧彪古文音義五卷王儉音義四卷與新定釋文並行從之奭言古文尚書釋文印板猶存請雕印天聖八年九月十二日雕新定釋文晁氏志古文尚書十三卷孔安國以隷古定以隷寫籕自漢迄唐行於學官明皇改從今文由是古文遂絶陸徳明獨存其一二於釋文呂大防得本於宋次道王仲至家以校釋文雖小有異同而大體相類中興書目古文尚書二卷鄭樵書考六卷考證古今文同異國史志唐孝明寫以今字藏其舊本開寶别定今文音義與古文並行經典序録近惟崇古文馬鄭王注遂廢今以孔氏為正其舜典一篇仍用王肅本景徳尚書禮記圖祥符觀尚書圖皇祐無逸孝經圖紹興無逸圖見圖類又見帝學聖文類唐盧碩以洪範篇書于縑素為章以奏之上洪範圖章宋朝吳仁傑撰洪範辨一卷増立新圖辨歐陽修蘇洵轍所論陳伯達為翼範一卷仁宗時樞副范雍繪尚書四代圖進之以備中覽元祐無逸講義淳熈尚書講義書目元祐五年二月壬寅講無逸終篇侍講司馬康吳安詩范祖禹等録進講義一卷淳熈十六年正月二十三日太傅史浩進講義二十二卷藏祕府晁氏志元祐中顔復吳安詩范祖禹司馬康無逸説命解三卷紹興三墳訓義紹興十六年九月六日祕書省言撫州布衣吳沆進三墳訓義三卷文理可采晁氏志三墳書七卷張商英得於比陽民家墳皆古文傳乃隷書所謂三墳者山氣形也世以為偽撰盖以比李筌隂符經云淳熈禹貢論四年七月九日刑部侍郎程大昌上禹貢論五十二篇後論八篇詔付祕閣序云天下大川如江河淮漢濟弱水黒水七者名稱迹道世傳失實因著論辨證之書目禹貢論五卷後論一卷専論河汴二水之患又禹貢論圖五卷因禹貢備論歴代山川郡縣名稱改易以唐世地書為正大昌攷究年代地理等為書譜二十卷尚書治要圖中興書目五卷不知作者有月令後漢志中星圖周禮九禮圖等篇取其與尚書參㑹也書九意晁氏志楊繪元素書九意一卷斷堯禪讓虞書稽古夏書商書周書意費誓篇秦誓凡九張晦之洪範論一卷景祐三年著七篇胡翼之洪範論一卷王氏洪範傳一卷安石蘇洵洪範論一卷三論二圖孫諤洪範㑹傳一卷元祐中博士頗攻王氏之失孫覺莘老尚書解十三卷王雱新經尚書十三卷楊時中立書義辨疑一卷専攻王雱之失蘇軾書傳十三卷駁王氏之説為多顔吳范司馬無逸説命解三卷元祐中所進講説伊川書説一卷門人記其師所談四十餘篇吕大臨書傳十三卷胡旦尚書演聖通論七卷國史志王晦叔周書音訓十二卷洪範數蔡沉謂體天地之撰者易之象紀天地之撰者範之數數始於一竒象成於二偶竒者數之所以立偶者數之所以行故二四而八八卦之象也三三而九九疇之數也由是八八而又八之為四千九十六而象備矣九九而又九之為六千五百六十一而數周矣易更四聖而象己著範錫神禹而數不傳後之作者昧象數之源窒變通之妙或即象而為數或反數而擬象洞極有書潜虚有圖非無作也牽合傅㑹自然之數益晦焉嗟夫天地之所以肇人物之所以生萬事之所以失得莫非數也數之體著於形數之用妙於理非窮神知化者曷足以語此朱文公皇極辨曰皇者君之稱極者至極之義標凖之名邵氏曰唐虞其中天而興乎堯舜其應運而生乎其猶夏之將至日之向中乎聖人刪書斷自唐虞時之盛也玉海卷三十七
