body:
  text: 玉海卷一百八十六宋王應麟撰食貨理財虞乘馬策管子桓公問曰請問乘馬曰國無儲在令虞國得策乘馬之數矣公曰何謂管子曰百畝之夫豫之策率二十七日為子之春事資子之幣春秋子榖大登國榖之重去分謂農夫曰幣之在子者以為榖而廩之州里國榖之分在上國榖之重再十倍謂逺近之縣里邑皆當奉器械備曰國無幣以榖凖幣此有虞之策乘馬也湯輕重策地數管子桓公問曰地數可得聞乎管子曰地之東西二萬八千里南北二萬六千里其出水者八千里受水者八千里出銅之山四百六十七出鐵之山三千六百九此所以分壤樹榖也戈矛之所發刀幣之所起也能者有餘拙者不足封泰山禪梁父者七十二家得失之數皆在此內是謂國用昔者桀霸有天下而用不足湯有七十里之薄而用有餘天非獨為湯雨菽粟而地非獨為湯出財物也伊尹善通移輕重開闔決塞通於髙下徐疾之策坐起之費時也公曰請問天財所出地利所在曰山上有赭者其下有鐵上有鉛者其下有銀一曰上有鉛者其下有鉒銀上有丹沙者其下有鉒金上有慈石者其下有銅金此山之見榮者也齊管氏輕重九府書七策漢志管仲相桓公通輕重之權人民有餘則輕之故人君斂之以輕民不足則重之故人君散之以重管子輕重篇地數篇管子曰昔者武王有巨橋之粟貴糴之數立重泉之戍令曰民有粟者不行民舉所最粟以避重泉之戍而國榖二十倍巨橋粟亦二十倍楚有汝漢之金齊有渠展之鹽燕有遼東之煮此三者亦可當武王之數揆度篇管子曰燧人以來未有不以輕重為天下也堯舜之王北用禺氏之玉南貴江漢之珠令諸侯之子將委質者皆以雙虎之皮卿大夫豹飾列大夫豹幨大夫散其邑粟財物以市虎豹之皮此堯舜之數也桓公問管子曰吾聞海內玉幣有七策可得而聞乎對曰陰山之礝珉燕之紫山白金發朝鮮之文皮汝漢水之右衢黃金江陽之珠秦明山之曾青禺氏邉山之玉此謂以寡為多以狹為廣天下之數盡於輕重矣又山至數篇管子曰黃金一策也江陽之珠一策也秦明山之曾青一策也此謂以寡為多以狹為廣輕重乙篇桓公曰吾欲殺商賈之利益農夫之事對曰請重粟之價輕重丁篇桓公曰欲西朝天子而賀獻不足為此亦有數乎管子對曰使玉人刻石以為璧管子西見天子曰諸侯不以彤弓石璧者不入朝諸侯載金玉五榖布帛輸齊以收石璧桓公曰崢丘之戰民多稱貸負息以給上之急管子對曰表稱貸之家堊其門而高其閭使使者式璧聘之鹽鐵論文學曰管仲設九府徼山海史記管仲傳太史公曰吾讀管氏牧民山高乘馬輕重九府注劉向别録曰九府書民間無有索隱曰皆管仲著書篇名九府蓋錢之府藏其書論鑄錢之輕重貨殖傳管子設輕重九府桓公以霸魏平糴漢食貨志李悝既為魏文侯作盡地力之教又曰糴甚貴傷民甚賤傷農民傷則離散農傷則國貧故甚貴與甚賤其傷一也善為國者使民無傷而農益勸今一夫挾五口治田百畝歲收畝一石半為粟百五十石除什一之稅十五石餘百三十五石食人月一石半五人終嵗為粟九十石餘有四十五石石三十為錢千三百五十除社閭嘗新春秋之祠用錢三百餘千五十衣人率用錢三百五人終歲用千五百不足四百五十不幸疾病死喪之費及上賦斂未與此農所以常困有不勸耕之心而令糴至於甚貴者也是故善平糴者必謹視嵗有上中下熟上熟其收自四餘四百石中熟自三餘三百石下熟自倍餘百石小飢則收百石中飢七十石大飢三十石故大熟則糴三而舍一中熟則糴二下熟則糴一使民適足價平則止小飢則發小熟之所斂中飢則發中熟之所斂大飢發大熟之所斂而糴之故雖遇飢饉水旱糴不貴而民不散取有餘而補不足也行之魏國國以富強常平乃古法周官司稼以年之上下出斂法出則減價糶斂則增價糴也是非常平乎自鄭氏以出其斂法為解後人遂攻周禮耳孟子曰狗彘食人食而不知斂塗有餓莩而不知發今文作檢漢食貨志作斂是也今世言常平出耿中丞不知乃古法漢平凖均輸史記平凖書食貨志武帝元狩間以東郭咸陽孔僅為大司農丞領鹽鐵而桑弘羊貴幸孔僅使天下鑄作器三年中至大司農而弘羊為大司農中丞管諸會計事稍稍置均輸以通貨物元封元年卜式貶為太子太傅以弘羊為治粟都尉領大司農盡代僅斡天下鹽鐵弘羊以諸官各自市相爭物以故騰踊而天下賦輸或不償其僦費乃請置大農部丞數十人置均輸鹽鐵官令逺方各以轉販者為賦而相灌輸置平凖於京師都受天下委輸召工官治車諸器皆仰給大農大農諸官盡籠天下之貨物貴則賣之賤則買之如此富啇大賈無所牟大利則反本而萬物不能騰踊故抑天下之物名曰平凖天子以為然而許之於是天子北至朔方東封太山巡海上旁北邊以歸所過賞賜用帛百餘萬匹金錢以巨萬計取足大農弘羊又請令民得入粟補吏及罪以贖令民入粟甘泉各有差以復終身不復告緡他郡各輸急處而諸農各致粟山東漕益歲六百萬石一歲之中太倉甘泉倉滿邊餘榖諸均輸帛五百萬匹民不益賦而天下用饒鹽鐵論文學曰今郡國有均輸與民爭利是以百姓就本寡而趨末衆願罷均輸大夫曰往者郡國諸侯各以其物貢輸往來煩雜物多苦惡故郡置輸官以相給運以便逺方之貢故曰均輸開委府于京師以籠貨物是以縣官不失實商賈無所牟利故曰平凖文學曰古者賦稅於民也農人納其獲女紅效其功今釋其所有責其所無百姓賤賣貨物以便上求未見輸之均也縣官猥發闔門擅市物騰踊則商賈牟利自市牟利自市則吏容姦豪吏富商儲物以待急輕賈姦吏收賤以取貴未見凖之平也古之均輸所以齊勞逸便貢輸非以為利也嘗觀桓寬之論從大夫之計則曰修鄣塞備屯戍必蕃貨長財以禦不軌通有無調緩急必建本抑末以制豪人文學之䇿則曰廣道德開仁義必本修民慤以興教化遏貪鄙醇至誠必防塞利門以劭農業管子通輕重之權曰凡輕重斂散之以時則凖平地理志千乘郡有均輸官百官表大司農屬官有均輸平凖令丞水衡都尉屬官有均輸令丞上林均輸四丞黃霸傳河東均輸長趙廣漢傳舉茂才為平凖令續志平凖令一人六百石掌知物賈主練染屬大司農均輸等皆省劉盆子傳光武賜滎陽均輸官地以為列肆使食其稅朱暉傳肅宗召拜尚書僕射尚書張林上言宜自交址益州上計吏來市珍怪武帝所謂均輸也詔議之暉曰均輸之法與賈販無異非明主所宜行帝卒以林言為然後紀靈帝熹平四年十月改平凖為中凖使宦者為令列於內舍六典注和帝改平凖為中凖以宦者為令丞晉少府有平凖令丞唐因之周禮地官質人中士二人下士四人主平定物賈者掌成市之貨賄珍異凡賣儥者質劑稽市之書契同其度量一其淳制王莽立五均官六斡漢榷酤紀武帝天漢三年二月初榷酤昭帝始元六年二月議罷榷酤七月罷榷酤官令民得以律占租賣酒升四錢志王莽時羲和魯康令官作酒賈捐之傳元帝初上書今天下民賦數百造鹽鐵榷酒之利以佐用度猶不能足翟方進傳上賜册曰制詔下君君云賣酒醪後請止未盡月復奏議令賣酒醪鹽鐵論大夫以心計䇿國用參以酒榷陳天嘉中虞荔奏請榷酤隋開皇三年罷唐廣德三年十二月敕天下州量定酤酒戶隨月納稅大厯十四年七月辛邜罷榷酤建中三年官自酤正月辛未復榷酤收利助軍費貞元二年十二月行榷酒法每斗榷一百五十文元和六年罷京師酤肆太和八年二月九日罷京師榷酤王仲舒罷江西酤錢九十萬裴諝不對榷酒酒有榷非古也妹土之誥萍氏之幾文帝之詔皆害之懲匪利之奪也文帝後元年三月詔為酒醪以糜榖者多景中三年夏旱禁酤酒漢司農少府錢穀周禮司勳疏先鄭云祿田亦有給公家之賦貢舉漢法侯國有司農少府錢穀者漢法穀入司農錢入少府鍾離意傳張恢坐臧以資物簿入大司農詔賜降胡子縑帝見司農上簿唐廣關輔糴食貨志貞觀開元後邊土西舉髙昌龜茲焉耆小勃律北抵薛延陀故地緣邊數十州戍重兵營田及地租不足以供軍於是初有和糴牛仙客為相開元二十五年九月戊子有彭果者獻䇿廣關輔之糴京師糧廪益羡自是玄宗不復幸東都天寶中歲以錢六十萬緡賦諸道和糴斗增三錢每歲短遞輸京倉者百餘萬斛米賤則少府加估而糴貴則減價而糶八年關內河東河西隴右和糴一百十三萬九千五百三十石貞元初吐蕃劫盟召諸道兵十七萬戍邊關中為吐蕃蹂躪者二十年矣北至河曲人戶無幾諸道戍兵月給粟十七萬斛皆糴於關中宰相陸贄以關中穀賤請和糴可至百餘萬斛計諸縣船車至太倉穀價四十餘米價七十則一年和糴之數當轉運之二年一斗轉運之資當和糴之五斗減轉運以實邊存轉運以備時通鑑貞元八年九月減江淮運米令京兆邉鎮和糴要江淮米至河隂者罷八十萬斛河陰米至太原倉者罷五十萬太原米至渭橋者罷二十萬以所減米糶江淮水葘州縣斗減時五十以救之京城東渭橋之糴計增時三十以利農以江淮糶米及減運直市絹帛送上都帝乃命度支增估糴粟三十三萬斛然不能盡用贄議贄奏朝錯論安邊之䇿要在積穀充國建破羌之説務在屯田憲宗初有司以歲豐請畿內和糴會要證聖元年三月二十一日敕州縣不得輒取和糴物興元元年閏十月詔度支於淮浙加價和糴三五十萬石減價出糶貞元四年八月詔京兆加估和糴先給直所司自運長慶元年三月戊申以春農方興停京北京西和糴使先是度支以邉儲無備請置使擇竇易直表置和糴貯備使郎中為之四年八月詔關內外折糴和糴一百五十萬石寶厯元年八月詔兩京河西和糴二百萬斛趙充國曰金城湟中榖斛八錢吾謂景中丞糴三百萬斛羌人不敢動矣中丞請糴百萬斛乃得四十萬斛耳列傳鄭覃擢諫議大夫憲宗取五中官為和糴使覃奏罷之杜佑建中初為和糴使羅珦遷京兆尹請減平糴半以常賦充之歸融傳有平糴官百官志比部掌句會內外賦斂經費俸祿及和糴屯收所入平糴之令始於李悝耿壽昌開常平之法至晉齊不能廢晉武帝欲立平糴法見常平倉後魏定和糴之制北齊築富人之倉隋置監唐置東西市之糴其法一也宋建隆間始因河內之稔修邊糴之事至淳化而天下之糴大備唐常平法見常平倉唐市舶使傳栁澤開元中二月十二日嶺南市舶使周慶立造竒器以進澤上書曰露臺無費明君不忍象箸非大忠臣憤歎王方慶廣州都督南海舊有崑崙舶市外區珠琲秋豪無所索孔戣拜嶺南節度使蕃舶泊步有下碇稅始至有閲貨宴所餉犀琲下及僕隸戣禁止之盧鈞節度嶺南海道商舶始至異時帥府爭先往賤售其珍鈞一不取貞元中嶺南請於安南置市舶中使陸贄奏曰玉毁櫝中是將誰咎珠飛境外安可復追書曰不貴異物則逺人格豈必重中使輕外使宋朝開寶四年六月壬申廣州兼市舶使初置後又置於杭淳化中徙于明之定海明年復置於杭咸平中杭明各置司海舶至者視所載十算其一市其三四元豐三年八月二廣閩浙並以漕臣兼提舉元祐二年十月六日增置于泉州三年三月置于密州崇寧元年七月復置于杭明大觀元年三月癸卯復置提舉官建炎元年七月己亥閩浙併于漕臣二年五月丁未復置四年二月復置廣司紹興二年七月甲子廢閩司八月併罷廣浙提舉官已而閩廣復置乾道二年罷兩浙提舉市舶海舶歲入象犀珠寶香藥之類皇祐中五十三萬有餘治平中增十萬中興歲入二百萬緡唐和市法張耀卿傳為長安令舊有配戶和市法人厭苦耀卿責豪門坐賈豫給以直絶僦欺之弊百官志金部掌和市之事宋朝天聖四年二月庚午置西界和市場和預買起於興國七年景德二年二月諸道歲市紬絹百餘萬匹上供減三之一每匹給錢千後以虛劵充數以鹽折支其後以歲額科納建炎三年九月蠲四之一以寬民河北榷場四陜西二太平興國七年幽薊還師始置榷場于靜戎軍李允則典其事慶厯四年十二月辛亥置保安靜戎軍榷場唐陸贄均節財賦六條貞元十年五月贄奏請均節財賦凡六條一論兩稅之弊二請兩稅以布帛為額不計錢數三論長吏以增戶加稅闢田為課績四論稅限迫促五請以稅茶錢置義倉以備水旱六論兼並之家私斂重於公稅宋朝三司使淳化總計使熙寧會計司會計式度支使始於唐乾元元年第五琦鹽鐵使亦始於琦國初沿後唐制後唐長興元年張延明請置三司使就命延明班宣徽使之下併戶部為三司使凡二十四案吏千餘人建隆元年八月李崇矩為使乾德四年正月定考課之法興國增判官之員興國元年十二月丁巳始置副使以賈琰為之八年三月癸亥分三司各置使淳化四年五月戊申併為一使魏羽判三司判官六員十月庚午置二使分領左右計魏羽董儼閏十月己酉置總計使陳恕為之判左右計事左右計使分判十道事分天下為十道曰河南河北河東關西劍南淮南江南東西兩浙廣南道東京為左計西京為右計各置判官領之五年七月詔給御前印紙考課以别能否五年十二月辛丑三司復各置使罷十道左右計恕及張延德張鑑領之兩京十道復歸三部三使各領一司局分相違簿書交錯綱條失序言論盈庭咸平六年六月丁亥復合為一使以命冦凖復置副天聖元年正月癸未命中丞劉子儀等與三司議裁減冗費寶元二年五月癸卯詔張若谷等減省冗費慶厯二年四月戊寅命賈昌朝等省浮費嘉祐三年十一月癸酉置減省司學士韓絳及陳升之吕景初等領之五年五月丁酉置寬恤民力司六月乙亥遣官往諸路訪寬恤事六年八月乙卯命知諫院楊畋詳定寬恤民力事遣使四出自是州縣力役多所裁損凡省二萬三千六百二十三人先是詔條奏衙前之役為害者治平元年十二月擇三司尤繁要者五員用資淺人久任而責效熙寧三年八月二十八日命王圭等編修三司令式十二月庚辰宰臣王安石提舉七年三月八日三司敕式成四百卷十月十六日己卯詔三司置會計司以宰臣韓絳提舉初絳奏三司總天下財賦其出入之數並無總要考校盈虛之法三司使亦請刪修為䇿歲校增虧故有是命八年六月二十三日提舉三司會計司上一州一路會計式九月十一日丁卯絳奏罷會計司元豐五年改官制四月二十三日以三司使安燾為戶部尚書左右曹其屬有三曰度支金部倉部凡官十有三左曹分案五設吏四十右曹分案五設吏五十有六唐劉晏為九使財賦悉歸于一宋朝始分為二而三司使居中發運使居外相為表裏祖宗外置轉運司以漕一路之賦內置三司使以總天下之財神宗始分天下之財以為二司轉運司獨主民常賦與州縣酒稅之課其餘財利悉收於常平司掌其發斂儲之以待非常之用罷三司而為户部轉運之財則左曹隸焉常平之財則右曹隸焉開寶六年八月乙巳令諸州舊屬公使錢物盡數係省毋得妄有支費以留州錢物盡數係省始於此淳化五年十二月二十一日初置諸州應在司具元管新收已支見在錢物申省熙寧五年十月九日專置司驅磨天下帳籍繼以旁通目子而天下無遺利而公使錢始立定額宋朝歲賦國朝混一之初天下歲入緡錢千六百餘萬太宗以為極盛兩倍唐室矣天禧之末所入又增至二千六百五十餘萬緡嘉祐間又增至三千六百八十餘萬緡其後月增歲廣至熙豐間合苖役市易等錢所入乃至六千餘萬元祐之初除其苛急歲入尚四千八百餘萬渡江之初東南歲入不滿千萬逮淳熙末遂增至六千五百三十餘萬今東南歲入之數獨上供錢二百萬緡此祖宗正賦也其六百六十餘萬緡號經制蓋吕頥浩在户部時復之七百八十餘萬緡號經總制蓋孟庾秉政時創之陳傳良奏疏云宣和以贍軍糴本與應奉司無名之斂合而為經制紹興以稅契之類十餘色合而為總制四百餘萬緡號月樁後又均撥為月樁六軍蓋朱勝非當國時取之自經制以下皆增賦也合茶鹽酒算坑冶榷貨糴本和買之入又四千四百九十餘萬緡宜民力之困矣政和間陳亨伯為陜西轉運使始議創經制錢大率添酒價取量添酒錢增稅額增收一分稅錢官賣契紙頭子契錢公家出納每千收二十三取之微而積之衆其後行之東南又行之京東西河北歲入數百萬緡靖康初廢建炎二年十月癸亥戶書吕頥浩翰學葉夢得請復之於是先取鈔旁定帖錢命提刑掌之毋得擅用經制錢自此始建議於陜西後乃行於東南總制之法創於紹興五年四月己未參政孟庾請頭子錢增十錢癸亥收耆户長雇錢等辛未收人戶合零就整等錢八月己酉又收常平五文頭子錢並令諸州通判諸路提刑拘催一本云紹興五年閏三月二十五日己巳參政孟庾置總制司以稅賦合零就整者别置籍拘收無額窠名尤多取最髙之數以紹興十九年數為額二十六年七月賀允中請改立經總制歲額從中制百十六年用李朝正計専委倅二歲入至一千七二十五萬其後東南諸路歲收總制錢七百八十餘萬緡而四川不預大凡東南經總司錢歲收一千四百四十餘萬緡四川歲收五百四十餘萬緡江浙月樁錢自紹興二年始自頥浩勝非並相以軍國不足創取江浙湖南諸路大軍月樁錢以上供經制係省封樁等充數崇寧三年十一月始立上供錢物新格宣和元年户部稽考諸路上供錢物之數方今版圖僅及承平之半而賦入過宣和之數天聖節浮費紀天聖元年正月癸未命官同三司議節浮費丁亥命官較茶鹽礬稅歲入登耗以聞二月庚申命張士遜吕夷簡魯宗道議茶鹽法三月甲申詔比者營造土木多內侍傳宣不關有司工費無節自今先由三司度實用然後給之明道二年四月壬子詔內外毋得進獻以祈恩澤寶元二年五月癸卯命近臣同三司詳定節省浮費六月壬戌詔曰自乘輿服御及宫掖所須宜如前詔務從簡約若吏兵祿賜毋得裁減慶厯二年四月戊寅命御史中丞諫官同三司較景德以來用度罷其不急者五月壬子減皇后及宗室婦郊賜之半乙丑罷左藏庫月進錢三年正月辛巳詔輔臣議蠲減天下差徭賦斂七年三月癸未詔求寬恤民力之事聽官吏驛置以聞上其副于轉運利害明白者轉運顓行之皇祐二年正月壬子命近臣同三司較天下財賦出入之數五年五月戊申詔轉運使毋得掊刻百姓取羡餘以助三司嘉祐三年九月癸酉議罷榷茶法十月癸亥除河北鹽錢十一月癸酉議減冗費十二月乙巳詔三司歲上天下稅賦之數三歲一會虧贏以聞四年二月己巳罷榷茶三月戊戌命近臣同三司減定民間科率五年四月丙戌命近臣同三司議均稅六月乙亥遣官分行天下訪寬恤民力事志天聖初命三司及中丞劉均等取景德一歲用度較天禧所出省其不急者寶元中賈昌朝言省不急用度命密學張若谷諫議任中師司諫韓琦議省冗費琦言當自掖庭始取賜豫支費之數裁為中制詔內侍省裁定有司不與西兵久不解財用益屈詔內侍以先帝時及天聖初籍較近嵗禁中用度增損外則命中丞賈昌朝諫官田况張方平同三司議省冗費內出詔書減皇后至宗室婦郊祠所賜之半著為式公卿近臣以次減時王堯臣為三司使取陜西河北河東三路未用兵前及用兵後歲出入財用之數會計以聞至和中諫官范鎮上疏今中書主民樞密院主兵三司主財各不相知財已匱而樞密院益兵不已民已困而三司取財不已願使中書樞密通知兵民財利大計與三司量其出入制為國用則民力少寬嘉祐三年樞副張升請罷民間科率及營造不急之物於是置減省司於三司命學士韓絳陳升之御史吕景初總其事多所裁省景祐元年程琳上疏河北歲費芻糧千二十萬其賦入支十之三陜西歲費千五百萬其賦入支十之五餘悉仰給京師范鎮奏疏備契丹莫若寬河北河東之民備靈夏莫若寬關陜之民備雲南莫若寬兩川湖嶺之民備天下莫若寬天下之民民力寬則知自愛知自愛雖有外厄人人可用為兵用人人自愛之兵以禦外虞何往而不克司馬光言為今之術在隨才用人而久任之養其本原而徐取之減損浮冗而省用之至和便糴建隆元年正月丁未詔河北歲豐榖賤命使置場增價以糴至道二年八月以歲豐糴於江浙淮三年五月詔三司市糴咸平六年九月出內府綾錦糴於河北景德元年九月出內府銀糴於天雄祥符五年五月又出內帑緡錢命三司博糴先是三年九月罷江淮和糴九年正月行陜西平糴天禧元年十一月減河北便糴天聖元年七月十七日命朝臣往河北沿邊提舉便糴六年十一月京西榖斗十錢命三司市糴至和二年薛向言河北糴法之弊歲費錢五百萬得百六十萬斛才直二百萬緡十一月己未詔向提舉便糴治平元年八月十六日罷之以屬漕臣元祐元年五月一日李常請復置紹聖四年四月罷元豐七年八月十六日給户部右曹錢六千萬充陜西邊糴乾道元年正月二十日少農張宗元言輦下供餽歲用糧一百五十餘萬石二浙苖米不過八十餘萬七十萬皆仰收糴紹興十八年閏八月甲子命臨安平江府淮東西湖北三總領歲糴米百二十萬石有竒先是八年四月庚申初置户部糴場於臨安建炎提舉户部財用建炎元年六月壬午戶書張慤同知密院李綱請以版曹事委之七月二十五日命慤兼提舉措置戶部財用十二月日厯九月丁未户書黃潛厚為延康殿學士提舉醴泉觀同提舉措置紹興五年閏二月丁卯二十二日詔足食足兵今日先務户書章誼専功措置財用參政孟庾提領己巳庾乞以總制司為名七月己卯沈與求以參政兼措置財用孟庾以提領措置財用為名與求止云兼權措置三十二年四月己巳吳芾言大農之財一歲所入幾五千萬而內藏激賞不與焉會其多寡比景德全盛時十增其四地不足而賦加多建炎三年三月尚書左丞葉夢得除資政殿學士提舉中太乙宫兼侍讀提舉户部財用夢得辭不拜嘉熙四年五月與歡以端明殿學士提舉萬夀觀提領戶部財用兼侍讀紹興末始造楮乾道四年造成第一界才一千萬耳至七年行第二界即置局收第一界自是率以為常淳熙六年始疊用第六第七兩界共四千八百餘萬其後又以第八界收換第六界兩界之數增至六千二百餘萬自是每界增至四千萬兩界並行止八千萬開禧用十一十二兩界調度不給又出十三界併行遂增至十四千萬嘉定初出十四十五界共八千萬以收三界以一易二嘉熙中四十一千萬有竒孝宗用錢端禮䇿用會子先積見錢以為之母所出不過二千萬三年一界必與換易紹熙間印出寖多其後每當兊界輒復展年至開禧纍界之數凡一億萬餘過隆興元額幾五倍矣紹興復常平法常平之政有提舉官自熙寧始建炎元年六月併歸提刑司常平之財所存一二猶以億萬計二年八月癸丑朔復諸路常平官十月壬戌詔翰學葉夢得等討論常平法條具取旨青苖斂散永不施行又命戶書吕頥浩十二月戊午頥浩等言此法不宜廢如免役坊場亦可行惟青苖市易當罷三年正月庚寅追還糴本紹興八年冬李光言常平法本於耿壽昌豈可以安石而廢九年復提舉官使掌其政十五年八月己未復命提舉茶鹽官兼領常平先是三年正月己未命憲臣兼提舉常平乾道制國用使乾道二年十二月辛卯詔宰相兼制國用使參政同知國用事以三省戶房國用司為名庶幾上下同德永底阜康三年二月庚申詔國用司具宫禁百官三司將校軍人月支數及泛用造册以進永為定式五年二月戊申二十一日罷制國用司併歸戶房八年正丞相官名四月詔丞相事無不統其兼制國用與參政更不入銜嘉泰四年十二月五日詔右丞相兼國用使參政同知國用事侍從卿監為參計同參計官參考內外財賦所入經費所出會計而總核之周以冢宰制國用質歲成漢以丞相調軍食唐以宰相兼度支元和二年八月辛酉宰相武元衡兼判戶部事開寶五年十一月庚辰命參政薛居正兼提點三司吕餘慶天聖元年詔三路軍儲出山澤之利移用不足二府大臣其經度之遂置計置司司馬光請以宰相領總計之職慶元役法撮要淳熙十四年二月十四日中書舍人陳居仁請下敕令所取祖宗免役舊法并紹興十七年後續旨參考刪修為一書名曰役法撮要後敕局中廢事寢慶元二年九月二十一日吏書許及之言敕局修海行法令求以便民者莫切於役法請以新舊法刪潤成一書赴尚書省審訂然後繕寫進呈鏤板頒天下六年四月十五日上之凡一百八十九卷并慶元寬恤詔令四百二十六卷同進始繇踐阼萃三百餘事之詔書上踵中興别二十五章之役要紹興十七年十一月丙寅宰臣上紹興常平免役敕令格式四百九十九卷詔鏤板頒之玉海卷一百八十六
