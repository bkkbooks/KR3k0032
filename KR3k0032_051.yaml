body:
  text: 玉海卷五十一宋王應麟撰藝文玉牒圖譜周用中士奠繫世漢晉用九卿典屬籍唐開成以玉名牒與史册並驅玉牒如帝紀而特詳於國書最為嚴重漢有玉版圖籍漢諸王世譜後百官志宗正注胡廣曰又歲一治諸王世譜差序秩第晉志宗正統皇族宗人圖牒隋志齊帝譜屬十卷梁有齊梁帝譜四卷梁帝譜十三卷唐宗正屬籍舊史宗室傳髙祖廣封宗室以威天下太宗即位因舉宗正屬籍問侍臣曰遍封宗子於天下便乎右僕射封德彞對曰兩漢已降唯帝子及親兄弟若疏逺非有大功如周郇滕漢賈澤不得濫封所以别親疏也先朝睦族一切封王非至公之道於是以屬疏降爵為郡公唯有功者數十人封王世系表宗室四十一房定著三十九房自定州刺史至惠宣太子唐皇室新譜又見上志柳芳永泰新譜二十卷柳璟續譜十卷見上李衢大唐皇室新譜一卷崇文目同會要會昌六年十一月禮官集議按神堯本紀及皇室圖譜開成四年正月敕大理少卿李衢修撰皇后譜牒後周武帝敇鮑宏修皇室譜分為帝緒疏屬賜姓三篇唐玉牒志皇唐玉牒一百一十卷開成二年李衢林寶撰舊紀册府元龜云三年四月癸丑進寶舊史作一百五十卷屯田郎中李衢沔王府長史林等開成元年閏六月乙未召宗正卿李弘澤問圖譜對以自肅宗已來並未修續癸卯敇沔王府長史林寶同修七聖玉牒會要開成二年六月修玉牒官屯田郎中李衢等奏切以聖唐玉牒與史册並驅立號建名期於不朽伏乞特創嘉名以光帝籍敕旨宜以皇唐玉牒為名宗正寺有知圖譜官一人修玉牒官一人開成後始置修玉牒官一人志李匡文玉牒行樓一卷崇文目二卷子書目一卷李匡文編次唐室宗屬孫各附以院額後目之為天房鑑槩唐書總紀帝系三卷崇文目同唐皇室維城録天潢源派譜志唐皇室維城録一卷崇文目同衢國史志云李李匡文天潢源派譜一卷史記天官書咸池曰天五潢又皇孫郡王譜一卷元和縣主譜一卷書目皇孫郡王譜一卷唐宗正卿李匡文撰起髙祖訖憲宗諸王封孫又元和縣主昭穆譜一卷記元和至開成三年所封五十九人唐圖譜院會要大中六年十二月宗正寺奏修圖譜官李弘簡狀德明之後興聖已來宗祊有序昭穆無差請宗子常參州縣官等各具始封建諸王及五代祖見在子孫録一家狀送圖譜院每房納於官最髙處昭穆尊即送本寺奏可六典司封凡皇家五等親及諸親三等皆立簿籍三年一造除附之制並載於宗正寺宗正寺掌屬籍以别昭穆九廟之子孫其族五十有九至道修皇屬籍咸平屬籍樓新修屬籍太宗至道初詔刑部郎張洎史館修撰梁周翰編皇屬籍未成咸平初猶未備宗正卿趙安易請纂修命於祕閣廳編纂又詔於宗正寺建屬籍樓以嚴奉之四年正月辛丑二十六日修玉牒官趙安易宗正卿梁周翰知制誥上新修皇屬籍三十三卷周翰創意為之頗有倫貫一云二十卷詔送宗正寺續修祥符皇宋玉牒咸平宗正寺玉牒殿屬籍堂祥符重建宗正寺康定重修祖宗玉牒紹興玉牒所屬籍堂纍朝玉牒祖簿凡例元豐宗正寺牒譜圖籍皇朝修玉牒昉於至道其官掌帝籍玉牒及皇族昭穆之序唐本宗正之職開成始置官凡玉牒書以銷金花白羅紙黃金軸銷金紅羅褾帶復墨漆金飾匣紅錦裏金鎖鑰十年一進神宗時詔為黃金梵夾以軸大難披閲也后德始末附載卷後重天合章母道也祥符六年癸丑歲正月辛酉判宗寺趙世長可封等請於皇屬籍之上别崇懿號詔名皇宋玉牒又令屬籍别録一本藏祕閣五月癸巳世長請以御製聖祖降臨記藏于玉牒樓詔可國史志皇宋玉牒三十三卷先是咸平二年正月甲申徙宗正寺於延和坊建樓以藏宗籍舊在闕前廡下以湫隘徙之祥符八年二月乙卯詔鹽鐵副使段燁擇地營建徙于福善坊建殿堂于寺九月庚午二十三日賜殿名曰玉牒殿堂曰屬籍堂天禧元年二月乙亥賜宗正寺板本經史以備修撰玉牒十一月宗正卿趙安仁請以聖祖降臨記并皇宋玉牒諸王屬籍自玉清昭應宫移於堂殿內祕藏從之初命安仁重修玉牒屬籍請先是二月丁巳奉安于昭應宫之齋殿趙安仁傳依唐故事置修玉牒官奏劉均夏竦楊億宋綬宋庠等初梁周翰創其制而未備安仁重加裁定景祐元年李淑請以編修院廳西閣修纂玉牒康定元年四月庚子重修祖宗玉牒成既而五月甲子玉牒所請自今歲一貼修十歲一編録送宗正寺以其副留中奏可熙寧三年六月玉牒所於三班院置局後徙編修院南渡有司失職盡棄江滸紹興二年七月丁亥宗正少卿李易請編次玉牒二十年二月九日始作玉牒所以舊車輅院為之二十六年閏十月二十七日御書玉牒殿及殿門祖宗屬籍堂榜十一年十二月二十六日詔宰臣提舉修玉牒所侍從一人兼修玉牒官宗正卿少咸與修纂二十九年八月二十三日詔玉牒所併入宗正寺不置修玉牒檢討以少卿及丞編修宰臣提舉修書官一人太祖玉牒紹興二十七年四月己未沈該等上太祖今上玉牒登進于垂拱殿藏玉牒殿副本藏龍圖閣太宗真宗玉牒乾道三年林劭言太宗朝已成真宗至欽宗七世未加一筆五月戊戌上太宗真宗玉牒真宗四十卷淳熙元年十二月乙巳復進真宗仁宗英宗玉牒寶元二年十月甲子六日李淑上新修皇帝玉牒二卷皇子籍一卷熙寧元年十一月癸酉四日玉牒所上仁英二帝玉牒各四卷淳熙四年三月己酉重進仁宗五年十月戊戌七年四月丙戌又進仁宗十三年十一月二十一日進仁英玉牒先是七年四月三日進慶厯二年至皇佑三年二十七日詔續修并修英神玉牒從王希吕之言也神宗哲宗玉牒崇寧三年十月重修紹興七年汪藻鮑延祖編哲宗玉牒上之淳熙五年八月十九日宗正簿胡南逢言藻失紀事之體詔重修七年四月丙戌上哲宗玉牒慶元三年二月五日進神宗八十卷徽宗欽宗玉牒淳熙四年三月己酉進徽宗嘉泰三年四月十七日又上一百二十卷開禧元年閏八月二十四日上欽宗二十册并憲聖慈烈后聖德事迹十卷髙宗玉牒紹興二十七年四月己未始進乾道六年五月己未八日進庚申恭進于德壽宫九年九月六日又進一本云八月丙申孝宗玉牒始進于乾道九年八月丙申淳熙四年三月己酉又進于紹熙元年八月戊戌己亥恭進三年十二月壬寅并聖政會要癸卯恭進光宗玉牒四十卷進于慶元六年二月二十二日又進于嘉定十三年五月寧宗玉牒嘉泰四年八月九日進五十卷嘉定六年二月二十五日刋正辨誣之書上之嘉泰至開禧淳祐二年上寧宗玉牒玉牒祖簿舊止二十一帙本支不分世系難别政和六年六月戊寅十六日許份請增廣編録以命宗正少卿閭丘籲八年九月二十日籲以宣祖之後分三祖編纂修至政和六年太祖下九十九帙太宗下二百六十九帙魏王下一百四十八帙詔付宗寺先是六年八月乙亥籲奏玉牒屬籍太祖下以德惟從世令子伯師太宗下以元允宗仲士木善汝魏王下以德承克叔之公彥以昭穆分位從之玉牒凡例赦令御札聖旨親筆處分郊祀行幸大臣拜罷試賢良大議論更革廢置大祥瑞災異戶口增減官雖卑因事賞罰關治體者紹興十二年奏請九事一親祠天地宗廟一皇子出閣公主下降一宰臣除罷一巡狩行幸一大慶一臨軒册后妃封皇子一蕃國入貢一大賞罰一官雖小事係大體嘉定四年十月一日己卯朔修玉牒章頴等言玉牒體制未定凡例乖牾蓋玉牒書一代大事視遷固帝紀而元降格目內分十條若盡用帝紀之體則為太簡然金箋寶匣藏於祕殿若沿襲案牘之詞登之簡策似不雅正至於事有當書而不書有細事而纍書今欲定體制開列某事當書某事不當書編成一册定為玉牒之凡例官吏遵為成式先後編集不至異同至非常之事則自立言辭鋪敘本末隨事刪潤以為成書從之志修玉牒官以學士典領掌修玉牒序宗派紀族屬歲撰宗子名以進元豐改制宗正卿少丞簿各一人掌修纂牒譜圖籍凡編年紀帝系厯數政令因革為玉牒序同姓五服之戚疏者為屬籍具官爵功罪宗婦族姓男女者為仙源類譜推其所自出列子孫名位者為宗藩慶系録考定世次支分派别而歸於本統者為仙源積慶圖録一歲圖三歲牒譜籍十歲修纂以進置大宗正司統皇族故長二不専以國姓至和元年十二月丙戌詔故事屬籍十年一修今雖及八年而宗支蕃衍其增修之建炎三年四月庚申併宗寺于太常紹興三年六月復置少卿五年閏二月辛未復置寺玉牒每朝為一牒載人主系序及歷年行事如帝紀而差詳其後附以皇后事迹其親王宗室則有録譜圖三書詳焉玉牒奉安于本殿類譜等書安于屬籍堂祥符仙源積慶圖天源録先天紀祥符八年十月壬辰十五日知制誥盛度上聖祖黃帝天源録五卷詔王曾晏殊與度增纂乙巳十八日樞密使王欽若纘聖祖事迹十二卷請御製序名曰先天紀十二月欽若又言所集天源録於經史道藏諸子書中取其事之本始續成二十卷九年三月戊午上之九年三月癸亥趙安仁宗正卿言唐故事祖宗玉牒皆首載混元皇帝請以御製聖祖降臨記冠于列聖玉牒及别修皇朝新譜如唐天潢源派譜製為美名詔名曰仙源積慶圖歲寫一本藏龍圖閣請御製序從之藝文志八年進積慶圖與此不同以劉筠夏竦為修玉牒官紹興二十七年四月十五日詔修三祖下積慶圖二十八年三月丁卯七日上之乾道三年五月戊戌六日上十八軸淳熙五年十月戊戌又進書目積慶圖一卷紀帝系起僖祖迄哲宗凡諸王公主諡號陵廟配侑樂舞等事皆載之安仁重修玉牒屬籍又為是圖皆統例精簡祥符仙源類譜兩朝志仙源類譜三十卷祥符八年建玉牒殿屬籍堂于新寺趙安仁重修玉牒屬籍因上仙源積慶圖歲寫一本藏龍圖閣明年又請御製降臨記冠玉牒别修皇室新譜賜名仙源類譜二十卷景祐五年歲寫皇族名位一編黃綾裝題宗藩慶緒録與仙源積慶圖同上並在有司書目祖宗屬籍譜一卷紀帝系太祖太宗秦王以下子孫凡六百六人公主附之仙源類譜一卷王鞏撰見下慶厯仙源類譜元祐元年正月戊戌玉牒官黃履奏修熙豐玉牒屬籍類譜十月己酉宗正丞王鞏奏宗正寺條例玉牒十年一進修玉牒官以學士典領自熙寧中范鎮等進玉牒之後神宗玉牒未修仙源類譜自慶厯八年張方平進書之後慶厯三年七月壬午命張方平修玉牒補綴失亡為書數百卷僅五十年並無成書請更立法玉牒二年一具草繳進類譜亦如之十年類聚修纂從之二年五月修濮安懿王以下屬籍宣和四年二月二十九日少卿趙子嵩請纂神哲兩朝帝系類譜九月書成命藏于玉牒殿紹興十二年六月十一日修玉牒楊願請自宣祖後編修九朝宗派二十七年四月己未二十四日宰臣沈該上宣祖太祖魏王下仙源類譜并玉牒等共三百七十六册用黃麾細仗教坊樂前導六月甲午官吏進秩先是修玉牒陳康伯言先修太祖今上玉牒太祖今上皇后命氏之源三祖類譜五世昭穆三月四日詔涓日登進淳熙五年十月戊戌進第六世類譜嘉定六年二月二十五日修玉牒臣之柔請進第七世仙源類譜從之書目天源類譜一卷起僖祖訖英宗以熙寧廟系圖附其後熙寧宗藩慶系録紹興太祖慶系中興聖統熙寧三年一作元年十一月十八日六月十八日宗寺言每歲正月一日裝寫仙源積慶圖宗藩慶緒録元祐六年八月十二日己亥改慶系録送龍圖天章寶文閣如漢宗正歲上名籍今祖宗非袒免親不賜名授官請定所修圖册詔太常禮院詳定禮官言聖王於其族上殺而殫於六世以明親疏之異記其源流百世不紊以著世系之同親疏異則恩禮不得不異世系同則圖籍不得不同系以姓而不别綴以食而弗殊周道然也鄭元注系之以姓謂若今宗室屬籍蓋據宗正歲上名籍又今皇宗祖廟雖毁子孫皆於宗寺附籍歲送宗寺逺近之恩有差而譜牒之紀不可不存况皇族授官之制不與匹庶法則屬雖疏而恩禮不絶請仍舊修入圖録在外者宗寺歲時取附籍從之紹興五年六月丁巳十五日宗寺上編修太祖慶系四册八年續修十年閏六月續修上之又搜訪慶緒録及宗正班位宗女宗婦簿十五册送宗寺二十年五月己丑八日玉牒所王曮等上皇帝中興聖統權奉安於景靈宫天興殿其後建玉牒殿二十七年三月十八日奉安聖統于殿淳熙元年十二月乙巳十六日進三祖下五世慶系録十三年十一月二十一日一云九月甲子又進嘉定十三年五月又進并憲聖慈烈皇后聖德事迹紹興八年五月六日柴宗愈上中興聖統博采傳記序次詳明元豐宗室世表元豐四年八月二十七日趙彥若司馬光同修百官公卿表十卷彥若又修成宗室世表三卷上之賜銀幣紹興三年六月二十三日大宗丞謝伋請下州縣索名籍修玉牒或先為宗室世表攽天下從之楊傑作宗室世系表首著諡號名推爵德也屬次之親親也子孫次之源深而流長也宗室撰名並用兩字內一字相聨以别源派異昭穆熙寧二年十一月甲戌詔非袒免以下並罷賜名授官而天支訓名皆無定制元祐七年九月甲午宗寺建言於是聨名之制始定屬籍諸王書以銷金白綾紙銀軸紅錦褾帶黑漆塗銀匣銀鎖鑰公侯以下白綾紙牙軸它如諸王漢有王子侯表唐有宗室世系表漢表止於王侯王侯以降族裔不可得知唐表略於明皇明皇以後本支不可得詳慶仙源之逺則親親之誼不可忘思祖烈之貽則繼繼之心不敢怠紹興仙源慶系屬籍總要紹興五年四月二十六日少卿范沖等修纂仙源慶系屬籍總要一太祖太宗一秦王一母氏一始生一宗婦一宗女一宫院一官爵一壽考一賜諡十一月辛未上之宗丞孫緯進秩條分類書之各為一八年十二月十七日少卿張絢請續修從之十一年十月戊寅十三日宗丞邵大受言周官小宗伯掌三族辨親疏小史奠繫世辨昭穆漢唐以來建寺設官循古制也國朝宗寺舊掌之書有四曰皇宋玉牒曰仙源積慶圖曰宗藩慶系録曰宗支屬籍建炎南渡四書逸於江滸比命搜訪闕遺重加修纂賜名總要合圖録屬籍三者而一之而玉牒獨闕請裒次以備中興盛典從之九年正月少卿鄭剛中言三京宗司所報與舊書抵牾請新舊俱存從之十二年五月命起居舍人楊願兼修玉牒十一月丁未范雩為校書郎兼檢討裳裳者華其葉湑兮氣相屬潤相滋也常棣之華鄂不韡韡體相親意相承也典故會要古者朝廷之政發號施令百司奉之藏于宫府各修其職守而弗忘周官御史掌治朝之法太史掌萬民之約契然則百官庶府各藏其事太史之職又總而掌之漢時定律令制章程定儀法條流派别制度漸廣夏政典書胤征政典曰先時者不及時者殺無赦注政典夏后為政之典籍若周官六卿之治典先時謂厯象之法四時節氣弦望晦朔先天時則罪死不赦不及謂厯象後天時雖治其官茍有先後之差則無赦況廢官乎疏胤侯夏之卿士引政典而不言古典則當時之書禹有典有則貽厥子孫周禮大宰建邦六典四曰政典以平邦國正百官均萬民殷册書典籍書多士惟殷先人有册有典注殷先世有册書典籍康誥罰蔽殷彝注用殷家常法請典刑故事晉語陽人有夏商之嗣典周六典周禮大宰掌建邦之六典治教禮政刑事乃施典于邦國小宰掌邦之六典之二司書掌邦之六典大史掌邦之六典周政周法漢志儒家周政六篇周時法度政教周法九篇法天地立百官河間周制十八篇河間獻王所述魯象魏舊章魯故事晉故府周記府象魏制左傳哀三年夏五月辛卯司鐸火火踰公宫季孫至御公立於象魏之外命藏象魏曰舊章不可忘也注周禮正月縣教治之法于象魏使萬民觀之故謂其書為象魏晉士伯曰吾視諸故府禮記檀弓夫魯有初注初謂故事也禮運仲尼出遊於觀之上注象魏舊章之處周語樊穆仲曰魯侯賦事行刑必問於遺訓而咨於故實史世家作固實史記蒙恬傳成王觀於記府得周公旦書陳肅慎氏矢求之故府果得之晉志熊逺奏周建象魏之制漢創畫一之法劉頌上疏夏殷及周書法象魏魯語非故也注云故事也楚故志訓典楚語莊王使士亹傅太子葴問於申叔時叔時曰教之故志使知廢興而戒懼焉注故志所記前代成敗之書教之訓典使知族類行比義焉訓典五帝之書也又王孫圉曰左史倚相能道訓典以敘百物以朝夕獻善敗于寡君寡君無忘先王之業戰國策楚蒙穀負雞次之典蒙穀獻典五官得法趙牛贊諫曰國有固籍兵有常經左傳蒍敖為宰擇楚國之令典王子朝奉周之典籍以奔楚吕氏春秋荆王發平府而視故記文選王簡棲云擇方城之全典酌龜蒙之故實注方城楚也龜蒙魯也漢故事詔書魏相傳宣帝始親萬機而相總領衆職甚稱上意好觀漢故事及便宜章奏以為古今異制元康中方今務在奉行故事而已數條漢興以來國家便宜行事及賢臣賈誼朝錯董仲舒所言奏請施行之曰竊伏觀先帝孝昭帝聖德仁恩之厚勤勞天下垂意黎庶憂水旱之災為民貧窮發倉廪振乏餧遣諫大夫博士循行天下察風俗舉賢良平寃獄冠蓋交道省諸用寬租賦弛山澤陂池禁秣馬酤酒貯積所以周急繼困慰安元元便利百姓之道甚備相不能悉陳昧死奏故事詔書凡二十三事見詔令上施行其策相又奏天子之義必純取法天地而觀於先聖髙皇帝所述書天子所服第八注如淳曰第八天子衣服之制也於施行詔書第八表地節三年六月魏相代韋賢為相封髙平侯列傳朱博曰故事封丞相不滿千戶孔光為尚書觀故事品式數歲明習漢制及法令弘恭習法令故事史外戚世家褚先生曰臣為郎時問習漢家故事者陸澄曰周稱舊章漢言故事漢家故事常以列侯尚主漢孝文故事章紀永平十八年冬十二月癸巳有司奏言宜尊孝明帝廟曰顯宗進武德舞如孝文皇帝祫祭髙廟故事鼂錯傳為太常掌故注應劭曰掌故六百石吏主故事漢武帝故事郊祀志宣帝修武帝故事盛車服敬齊祠之禮頗作歌詩列傳何武宣帝時王褒作中和樂職宣布詩武共習歌之宣帝循武帝故事求通達茂異士召見武等於宣室王吉宣帝頗修武帝故事宫室衣服盛於昭帝時王褒宣帝時修武帝故事講論六藝羣書褒待詔金馬門劉向宣帝循武帝故事詔選名儒俊材置左右更生以通達能屬文辭與王褒等進對張放鴻嘉中上欲遵武帝故事與近臣遊宴後竇固傳明帝欲遵武帝故事擊胸奴通西域以固明習邊事祭祀志建武三十二年求元封時封禪故事唐志漢武帝故事二卷隋志同崇文目五卷班固撰本題二篇今世誤析為五篇書目五卷雜記武帝舊事及神怪之説末略載宣帝事通鑑考異漢武故事後人為之托班固名語多誕忘非固書漢武故事二卷世言班固撰唐張柬之之書洞冥記後云漢武故事王儉造尚書先發副封故事也魏相白去之歲漕關東榖四百萬斛故事也壽昌奏省焉漢建武永平故事舊制列傳侯霸建武四年拜尚書令時無故典朝廷又少舊臣霸明習故事收録遺文條奏前世善政法度有益於時者皆施行之每春下寬大之詔奉四方之令皆霸所建也張純在朝歷世明習故事前傳云明習漢家制度故事建武初舊章多闕每有疑議輒以訪純自郊廟昏冠喪紀禮儀多所正定六年純奏漢舊制三年一祫郭賀建武中為尚書令在職六年曉習故事陳寵初為尚書是時承永平故事吏政尚嚴切尚書決事率近於重子忠建光中尚書令奏光武絶告寧之典宜復建武故事忠上疏云云帝紀明帝遵奉建武制度無敢違者後宫之家不得封侯與政論曰明帝善刑理法令分明日晏坐朝幽枉必達內外無幸曲之私在上無矜大之色斷獄得情號居前代十二故後之言事者莫不先建武永平之政順帝永建四年二月戊戌詔以民入山鑿石發泄藏氣敕有司檢察所當禁絶如建武永平故事桓帝永興二年二月癸卯詔輿服申明舊令如永平故事唐志建武故事三卷永平故事二卷又漢建武律令故事三卷紀光武建武元年即位告天地采用元始中郊祭故事十三年詔曰漢家舊制丞相拜日封為列侯章帝元和二年五月戊申詔神爵甘露屢臻祖宗舊事或班恩施其賜爵建初五年夏五月辛亥詔曰朕思遲賢士仄席異聞其先至者皆已發憤吐悶略聞子大夫之志矣皆欲置之左右顧問省納建武詔書曰堯試臣以職不直以言語筆札今外官多曠並可以補任列傳劉祐補尚書侍郎間練故事杜林議郊祀曰祖宗故事所宜因循伏湛拜尚書使典定舊制班固北單于求和固議曰建武之世復修舊典宜依故事復遣使者襄楷上疏永平舊典先請後刑袁安上封事曰漢故事供給南單于費直歲一億九千餘萬西域歲七千四百八十萬朱穆案漢故事中常侍參選士人胡廣舊章憲式無所不覽李法上疏和帝以為朝政苛碎違永平建初故事李固對策曰梁氏子弟榮顯兼加永平建初故事殆不如此清河王慶永元四年帝將誅竇氏欲得外戚傳令慶求之又令慶求索故事濟北王壽和帝遵肅宗故事兄弟皆留京師恩寵篤密楊秉言舊典中臣子弟不得居位班勇上議宜復置護西域副校尉如永元故事王允集漢朝舊事當施用者奏之蔡雍封事曰孝元策書曰禮之至敬莫重於祭又元和故事復申先典前後制書推心懇惻馬融廣成頌曰刋禁臺之祕藏發天府之官常由質要之故業率典刑之舊章厯志孝章厯度審正宜如甲寅詔書故事通典漢魏故事皇太子稱臣漢南宫故事臺閣故事列傳陳忠為尚書令前後所奏條於南宫閣上以為故事鄭弘建初中為尚書令前後所陳有益王政者著之南宫以為故事楊賜去位帝徙南宫閲録故事得賜所上奏及侍講注籍楊秉曰漢世故事三公之職無所不統黃香久習舊事和帝留為尚書令文苑黃瓊隨父在臺閣習見故事及為尚書僕射練達官曹左雄掌納言每有章表奏議臺閣以為故事雄言案尚書故事無阿母封邑之制陽球補尚書侍郎間達故事章奏處議為臺閣所崇信酷吏樊準為尚書令明習故事謝承漢書明帝條李壽前後所上便宜為南宮故事前傳丙吉曰西河太守杜延年明法度曉國家故事孔光曰竊見國家故事尚書以久次轉遷非有殊絶之能不相踰越光領尚書守法度修故事陳遵日出醉歸曹事數廢西曹以故事適之故事有百適者斥注舊法令成帝詔尚書奏文帝時誅將軍薄昭故事尚書閻章曉舊典漢甘露故事石渠故事見白虎通議漢官禮儀故事尚書舊事見律令應劭傳時始遷都于許舊章堙沒書記罕存劭慨然歎息乃綴集所聞著漢官禮儀故事凡朝廷制度百官典式多劭所立唐志應劭漢官五卷漢官儀十卷中興書目今存一卷載光武以來三公百官名氏李􅌫續補一卷華嶠漢書應奉著後序十餘篇子劭撰述風俗通等凡百餘篇續漢書應劭著中漢輯敘漢官儀及禮儀故事凡十一種百三十六卷朝廷制度百官典式所以不亡者由劭記之楊惲傳遷中郎將郎官故事令郎出錢市財用給文書乃得出名曰山郎移病盡一日輒償一沐惲罷山郎移長度大司農以給財用其休謁洗沐皆以法令從事蜀志孟光長於漢家舊典杜佑上壽樂議引漢故事上壽四會曲漢丞相故事見辟士四科馬將軍故事馬援傳為伏波將軍所過輒為郡縣治城郭穿渠以利民條奏越律與漢律駁者十餘事與越人申明舊制以約束之自後駱越奉行馬將軍故事列傳陳忠上疏曰漢典舊事丞相所請靡有不聽何敞説宋由曰二府以為故事三公不與賊盜楊秉上疏云云尚書召對掾屬曰公府外職而奏劾近官經典漢制有故事乎秉使對曰漢世故事三公之職無所不統尚書不能詰前傳薛宣為相府辭訟例不滿萬錢不為移書後皆遵用杜欽建九女之制太后以為故事無有漢三輔舊事禮儀風俗韋彪傳扶風平陵人肅宗建初七年車駕西狩行太常數召入問以三輔舊事禮儀風俗彪因建言追録髙祖中宗功臣彪著書十二篇號韋卿子馬援傳善述前世行事三輔長者自太子諸王侍聞者屬耳忘倦唐志故事類韋氏三輔舊事一卷地理類始于三輔黃圖一卷又有三輔舊事三卷隋志地理類三輔故事二卷晉世撰武帝元鼎二年春柏梁臺師古引三輔舊事昭紀始元元年弄田臣瓚引西京故事弄田在未央宫中儒林傳石渠閣師古引三輔故事班固傳注文選注皆引之唐禮志賈曾議引三輔故事祭于圜丘上帝后土位皆南面會要云三輔故事漢祭圜丘儀漢蔡雍獨斷蔡雍傳著獨斷勸學書目二卷采前古及漢以來典章制度品式稱謂考證辨釋凡數百事其書間有顛錯嘉祐中余擇中更為次序釋以已説故别本題新定獨斷光武紀注引之漢事應奉傳注見雜史蔡雍傳馬日磾曰伯喈多識漢事當續成後史為一代大典雍撰集漢事作靈紀及十意又補諸列傳四十二篇胡廣傳注漢雜事曰羣臣書四品唐志故事秦漢以來舊事八卷隋志十卷八漢魏吳蜀舊事卷雜史後漢雜事十卷魏志注引魏武故事班超傳注引西河舊事晉故事公卿故事唐志晉太始大康故事八卷孔愈晉建武咸和咸康故事四卷隋志晉咸和咸康故事四卷孔愈撰晉建武以來故事三卷隋志建武故事一卷晉氏故事三卷晉朝雜事二卷隋志同故舊唐志晉諸雜事二十二卷晉故事四十三卷隋志同晉諸雜故事二十二卷晉宋舊事一百二十卷南史庾詵撰晉朝雜事五卷晉傳暢為公卿故事九卷隋志傳暢公卿禮秩故事宋禮志引故事晉臺省故事荀嵩傳元帝時上疏武帝崇儒興學臺省有宗廟太府金墉故事太學有石經古文列傳裴秀創制朝儀廣陳刑政朝廷遵為故事刁協久在中朝諳練舊事凡制度皆稟協王隱父銓私録晉事未就而卒隱受父業西都舊事多所諳究太興初令撰晉史王導料檢中書故事見周顗表唐故事十七家志故事類十七家四十三部四百九十六卷始於秦漢以來舊事終於王方慶南宫故事秦漢以來舊事八卷武帝二卷建武永平五卷諸王奏事十卷而韋氏之三輔舊事葛洪之西京雜記應劭之漢朝駮附焉漢魏吳蜀舊事八卷魏名臣奏事訪議南臺奏事總四十二卷廷尉決事十卷晉泰始太康建武以來故事雜議要事晉宋舊事華林故事名總二百二十六卷又有交州中興伐逆陶公郗太尉及春坊舊事而孔愈之建武咸康車灌盧綝張敞范汪之山陵八王四王東宫尚書劉道薈之先朝溫子升蕭大圜之梁魏應詹王愆期之江南襄陽上都武后之述聖紀杜正倫春坊要録王方慶南宫故事以至僧無名之天正舊事附焉失姓名二十五家不著録自裴矩馬總張齊賢盧若虛令狐德棻敬播而下及劉禕之張大業王方慶李仁實謝偃陳諫終於丘據涼公録凡十六家九十卷隋志舊事二十五部六典自漢武故事等二十部四百四卷舊志列代故事四十二家中興書目一百二十六家七百三十六卷唐六典志職官類六典三十卷開元十年起居舍人陸堅被詔集賢院修六典玄宗手寫六條曰理典教典禮典刑典政典事典張説知院委徐堅經歲無規制乃命母煚余欽咸廙業孫季良韋述參撰始以令式象周禮六官為制十九年三月蕭嵩知院加劉鄭蘭蕭晟盧若虛張九齡知院加陸善經李林甫代九齡加苑咸二十六年書成集賢注記云二十六年奏草上詔下有司百竂表賀至今在書院亦不行用韋述傳張説既領集賢院薦述為直學士先是詔修六典徐堅造意歲餘未成疑曰吾更修七書而六典歷年未有所適及蕭嵩之引述撰定始以令式象周禮六官官領其屬事歸於職規制遂定賀知章傳張説為麗正殿修書使薦知章徐堅趙冬曦入院撰六典會要開元二十六年二月中書令張九齡撰六典三十卷成百官稱賀九齡二十三年已罷中書令當考大要書三十卷歷十六年知院四人參撰官十二人內自省臺寺監外逮鎮戌嶽瀆關津上自三師三公至令丞曹掾簿尉貞元二年定班序每班以尚書省為首及監察涖祭元和元年十二月髙郢奏警嚴及牛僧孺奏升諫議為三品皆據六典會昌六年九月博士胡德章議案開元六典敕曰法以周官作為唐典通典以三師三公門下中書兩省為先會要亦以兩省為首惟六典準周禮六官以尚書省居上宋朝熙寧十年九月命劉摯等校六典元豐元年正月成上之三年禁中鏤板以摹本賜近臣及館閣曾鞏曰其本原設官因革之詳上及唐虞以至開元其文不煩其實甚備可謂善述作者此書其前有序明皇自撰篇首皆曰御撰李林甫等注第四一篇則曰張九齡等奉敕撰書目皇朝趙氏訂正為唐典備對六卷天禧二年正月庚戌中丞趙安仁請修國朝六典從之五月安仁卒六典不及成崇寧元年六月二十九日詔修六典亦不就見官名唐政典止戈記志類書類劉秩政典三十五卷止戈記七卷秩至德初為給事中劉秩傳著政典止戈記至德新議十二卷凡數十篇唐通典理道要訣志類書類杜佑通典二百卷杜佑傳佑資嗜學雖貴猶夜分讀書先是劉秩托百家侔六官法為政典三十五篇房琯稱其才過劉向佑以為未盡因廣其缺參益新禮為二百篇自號通典奏之優詔褒美儒者服其書約而詳會要貞元十九年二月淮南節度使杜佑撰通典二百卷上之其書凡九門敘食貨十二篇禮百篇樂七篇兵六篇刑七篇州縣十四篇邊防十六篇識者知其必登公輔之位舊紀貞元十七年十月庚戌淮南節度使杜佑進通典凡九門二百卷今通典食貨十二卷選舉六卷職官十二卷禮一百卷樂七卷兵十五卷刑八卷州縣十四卷邊防十六卷貞元十年表上中興舊目云通典貞元十年撰以事分類左補闕李翰序曰凡八門勒成二百卷非聖之書不取事非經國不録佑自敘曰所纂通典實採羣言徵諸人事夫理道之先在乎行教化教化之本在乎足衣食洪範八政一食二貨夫子曰既富而教斯之謂矣夫行教化在乎設職官設職官在乎審官才審官才在乎精選舉制禮以端其俗立樂以和其心此先哲王致治之大方也故職官設然後興禮樂焉教化隳然後用刑罰焉列州郡俾分領焉置邊防遏戎敵焉是以食貨為之首選舉次之職官又次之禮又次之樂又次之刑又次之大刑用甲兵十五卷其次五刑八卷州郡又次之邊防末之或覽之者庶知篇第之旨也本初纂録止於天寶之末其有要須議論者亦便及以後之事志雜家杜佑理道要訣十卷佑表曰竊思理道不録空言由是纍記修纂通典包羅數千年事探討禮法刑政遂成二百卷先已奉進從去年春末更於二百卷中纂成十卷目曰理道要訣凡三十三篇書目云三十二篇詳古今之要酌時宜可行貞元十九年二月十八日上佑自序曰隋季文博理道集唐志法家類治道集十卷多主於規諫而略於體要臣頗探政理竊究始終遂假問答方冀發明第一至第三食貨四選舉命官五禮教六封建州郡七兵刑八邊防九十古今異制議權德輿以為誕章閎議錯綜古今經世立言之旨備焉朱文公謂非古是今之書唐理典會要貞元十一年八月司業裴澄撰乘輿月令十二卷理典十二卷上之舊紀閏八月己丑表上唐典聖典志雜史類王彥威唐典七十卷儒家楊浚聖典三卷校書郎開元中上天聖四年閏五月宋綬録進會要太和二年二月戶部侍郎王彥威以所撰唐典七十卷上之起武德終永貞舊史王彥威集國初以來至貞元帝代功臣如左氏傳體敘事號曰唐典紀開成二年二月戊申進唐貞觀故事會要神龍元年三月三日制書一事已上並依貞觀故事景雲二年七月置都督崔涖議曰貞觀故事足可依行桓彥範傳神龍初對曰陛下龍飛下制云軍國政化並依貞觀故事李翺傳條興復太平大略曰復髙祖太宗舊制用忠正屏邪佞改稅法不督錢而納布帛絶進獻寬租賦厚邊兵數引待制官問以時事任骨鯁正直與之修復故事陸贄奏議人到于今論理道之崇則必慕貞觀之故事崇文目中朝故事一卷唐貞觀開元故事舊史蔣係曰憲宗嗣位之初讀列聖寶録見貞觀開元故事竦慕不能釋卷顧謂丞相曰太宗之創業如此玄宗之致理如此既覽國史乃知萬倍不如先聖先聖之代猶須宰輔同心輔助豈朕今日獨能為理哉自是延英議政晝漏率下五六刻乃退官志元和四年集賢院學士直學士皆用五品如開元故事宣宗感章武舊事振拔元和大臣子孫唐南宫故事官卿舊事天官舊事志故事類王方慶南宫故事十二卷又盧若虛三十卷職官類王方慶官卿舊事一卷劉貺天官舊事一卷雜傳記有劉餗國朝傳記三卷傳記凡一百九十事國朝舊事四十卷集賢注記開元十九年三月盧若虛入集賢院修撰博綜墳史尤明族姓撰南宫故事劉鄭蘭私撰南宫故事一卷南史梁丘仲孚為左丞撰皇典二十卷南宫故事一百卷唐具員故事志梁載言撰十卷書目具員故事七卷鳳閣舍人梁載言紀唐朝官號歷代沿革事迹崇文目十卷三卷今缺唐翰林故事書目翰林故事一卷貞元二年學士韋執誼撰述貞觀以來翰苑建置沿革記云自立此院連飛繼鳴者逾三十人因以官秩名氏次敘為故事今是書名氏皆缺翰林學士記一卷長慶元年韋處厚撰論得人之意承旨學士院記一卷元稹撰記云以十一賢名氏書坐隅今名氏皆缺崇文目翰林盛事一卷唐張著撰記唐朝儒臣美事凡三十八唐臺閣舊事盧簡辭傳遷侍御史習知法令及臺閣舊事會要景龍元年中書侍郎蕭至忠上疏臣見貞觀永徽故事宰相子弟多居外職李德裕曰公卿子弟臺閣之儀不教自成唐元和故事通鑑大中元年六月知制誥令狐綯入謝上問以元和故事綯條對甚悉上悅遂有大用之意唐會稡鄭虔傳天寶初集掇當世事著書八十餘篇有告虔私撰國史虔焚之虔追紬故書可志者得四十餘篇國子司業蘇源明名其書為會稡杜甫詩云薈蕞之會要泉貨類引唐百司舉要志職官類李吉甫元和百司舉要一卷元和八年二月宰臣吉甫上書目一卷取唐興以來百官名品集成此書舊史纂六典諸職為百司舉要一卷奏上之唐御史臺雜注舊史杜易簡撰五卷唐文場盛事書目一卷不知作者載唐人世取科第及父子兄弟門生座主同時者唐開元天寶遺事書目一卷五代唐王仁裕采托前史不載者凡一百五十九條開元傳信記一卷鄭棨撰載開元天寶事迹唐故事稽疑崇文目十卷咸鎬故事一卷唐韋慎微撰纂長安自元日至除夜朝廷慶賀事唐會要志類書類蘇冕會要四十卷貞元中杭州刺史蘇辨與兄冕纘國朝故事為是書辨先聚書至二萬卷皆手自刋正至今言蘇氏書次於集賢藝閣續會要四十卷楊紹復裴德融崔瑑薛逢鄭言周膚敏薛廷望于圭于球等撰崔鉉監修會要云大中七年十月左僕射崔鉉及修撰官楊紹復等賜物有差中興書目云記德宗以後至大中六年事迹補蘇冕前録之缺建隆新編唐會要五代會要漢會要建隆二年正月丁未司空平章監修國史王溥等上新編唐會要一百卷始於帝號終於夷狄文簡理備太祖嘉之詔藏史館賜物有差德宗時蘇冕始撰四十卷宣宗時崔鉉又續四十卷至是溥采宣宗以降故事共勒成百卷之書目云起武德迄太和補蘇崔二書缺國有大政必稽焉溥又采梁開平至周顯德事迹為五代會要三十卷乾德元年即建隆四年七月甲寅上之掇君臣事迹以類詮次詔付史館嘉定四年九月徐天麟表進所編西漢會要七十卷目録二卷總為十五門分三百六十有七事十一月丁卯有旨藏祕閣三館看詳謂詳於西漢而略於東都猶為缺典寶慶三年六月天麟為武學博士表進東漢會要四十卷目録一卷總十五門宋朝龍飛故事建隆遺事書目龍飛故事一卷集賢殿大學士趙普紀載太祖龍飛事迹建隆遺事一卷翰林學士王禹稱述太祖事迹十四條洪䄖纂太祖創業故事十二卷凡二百三十七條不克上子興祖隨事著論訓釋又後録一卷附乾德名臣事迹乾德元年十月吏部尚書張昭上新撰名臣事迹五卷詔藏史館咸平續修通典咸平三年十月監修國史季沆請命官續修通典己未詔翰林承旨宋白知制誥李宗諤編修白等又請命舒雅楊億李維石中立任隨同編修杜鎬檢討先是淳化中命翰林學士蘇易簡與三館文學之士續修此書會易簡等各涖官務尋罷至是復纂四年九月丙戌書成白等上之凡二百卷目録二卷詔藏祕府命中使就祕閣張宴以勞之賜白等器幣起唐至德初至周顯德末凡食貨二十選舉十二職官六十三禮四十樂五兵十二刑十一州郡二十六邊防十一時論非其重復不以傳布景祐中書總例元豐中書備對景祐二年九月己酉參政宋綬編修中書總例四百一十九册上之詔褒之吕夷簡奏為此書皇祐五年十二月續編二千六十八册嘉祐三年閏十二月己丑詔中書五房編總例從韓琦請也六年參政歐陽修與琦同心輔政凡兵民官吏財利之要中書所當知集為總目遇事不復求之有司元豐三年八月戊子檢正畢仲衍奏周官冡宰歲終令百官府正其治受其會而詔王廢置小宰受羣吏之要宰夫以八職待王之詔令可謂約而詳漢唐莫克議此故有錢穀決獄不克對者創自睿意俾加纂集一本云元年閏正月命檢正畢仲衍編修中書備對凡為一百二十五門附五十八事分為六卷事目多者分上中下共為十卷八月十二日庚子詔寫一本納執政分令諸房揭貼上以此書乃臣備君問不當奏御詔納執政大觀四年六月二十日命左右司效前制修書十一月右僕射張商英請編熙豐政事號皇宋政典戊寅置局尚書省書目中書備對十卷畢仲衍承詔編次國家內外官制諸道賦入禮儀法律等凡一百二十五門宰相吳充以聖問多出意表請為此書慶厯國朝會要元豐增修五朝天聖八年七月丁巳詔史官修國朝會要明道二年十二月癸巳命參政宋綬看詳修纂康定元年四月己亥命綬同提舉編修景祐四年六月甲申命史館檢討王洙編修慶厯四年四月己酉修國史章得象上新修國朝會要一百五十卷一本云編修官王洙纂建隆以來止慶厯三年凡八十五年以編修官王洙兼直龍圖閣賜三品服制度沿革小大畢録會要止修至慶厯三年後事莫述熙寧三年九月十六日翰林學士王圭請續修慶厯四年以後止熙寧三年時編修院修國史詔於崇文院修纂年仍詔增修至十年凡三十四圭以舊書尚有遺事所載頗多吏文因略加增損凡十二年乃成一本云熙寧十年十二月戊子命李德芻陳知彥修會要於崇文院置局先是命王存林希元豐四年九月己亥宰臣王圭上之表云禮樂政令之大綱儀物事為之細目帝后以底臣庶朝廷施于蠻夷有關討論顧無不載信疊矩重規之盛便遺訓故實之求會稡之書舉綱撮要續慶厯四年止熙寧十年通舊增損成三百卷總二十一類别為八百五十五門文簡事詳紀載有法後莫能及編修李德芻陳知彥遷秩二一本云元豐四年八月十五日進呈於延和殿二十一類帝系后妃禮分為五樂輿服儀制崇儒運厯瑞異職官選舉道釋食貨刑法兵方域蕃夷元符三年十二月甲辰徽宗詔祕省修詔即祕書省置局命王覿曾肇續編元豐至元符又詔起治平四年止崇寧五年凡四十年二書皆弗克成政和八年十二月丁未有司獨上帝系后妃吉禮三類凡一百一十一卷并目録其書通章得象王圭所編稍益以熙寧後事纍朝已成之書通加刪改皇朝衣冠盛事錢明逸載建隆以來訖熙寧衣冠盛事一卷有景靈宫五朝繪像功臣姓名附於後紹興麟臺故事唐韋述作集賢注記元祐中宋匪躬作館閣録紹興元年九月十九日祕書少監程俱上麟臺故事五卷十二篇淳熙四年秋陳騤續為館閣録十卷記沿革省舍儲藏修纂撰述故實官聨廪祿職掌宋程皆祖韋氏而宋録後四卷俄空焉紹興元年二月丙戌復祕書省乾道續四朝會要紹興三年四月靜江守臣許中上政和重修會要一百十卷九年詔館職續編三十一年正月庚寅上曰會要乃祖宗故事之統轄不可缺宜自元豐後續為之舊書分門有法不必改壬寅命館職自元豐元年以後編次乾道五年四月戊子祕書少監汪大猷言蔡攸所修自元豐至政和吉禮妄有刪改欲再刪定以續會要為名從之六年五月己未宰臣虞允文上之斷自神宗之初訖于靖康之末凡六十年總二百卷分二十一類六百六十六門綴集於散亡之餘十僅得其六七命宰臣提舉閲再歲乃成書乾道中興會要乾道九年七月自建炎初元續修成書二百卷八月丙申右相梁克家等上之進呈於垂拱殿九月祕書少監陳騤請名曰中興會要自建炎元年至紹興三十二年六月十一日淳熙會要嘉泰孝宗會要初淳熙六年七月甲戌十八日進一百五十八卷十三年十一月二十一日進一百三十卷紹熙三年十二月壬寅進八十卷計三百六十八卷事雖備載而首尾前後紛錯慶元六年閏二月二十五日祕丞邵文炳言孝宗會要三書統紀未一願彚次為全書制曰可越明年嘉泰元年七月十一日書成上之凡二百卷藏于祕閣蓋比而同之者六百九十有二條刪而正者二千八十有七條潤色初緒凡三千八百十八條别門析類傳合者九芟煩者四增多四十有六事詳文省紀綱制度粲然有章序曰孝宗憲章前烈乂我受民驟帝馳王跨越周漢品式備具規摹宏逺詒謀垂範將億萬年天敘有典以正罔缺熙朝簡册煒燁相望繼今立政立事其一以孝宗為準慶元光宗會要慶元六年二月戊寅二十二日上太上會要光宗一百卷京鏜等上自淳熙己酉二月迄紹熙甲寅七月總二十三類三百六十四門禮樂兵財之大原儒術刑法之要指取賢斂才之品式設官分職之制度九州之别合四夷之叛服槩見於斯嘉泰寧宗會要嘉泰三年八月二十一日進今上寧宗會要一百十五卷嘉定六年閏九月二十七日進一百卷七年五月十六日詔二年一具草繳進十四年五月壬辰九日進改正會要一百十五卷及續修一百一十卷淳祐二年上寧宗會要嘉定國朝會要淳熙七年十月九日祕書少監汝愚言國朝會要續會要中興會要今上會要分為四書去取不同詳略各異請合而為一俾辭簡事備勢順文貫從之將作少監張從祖類輯會要自國初至孝廟為一書凡二百二十三册五百八十八卷嘉定元年四月十六日詔祕省寫進三年六月十六日上之自昔帝王之興必有一代之制著在方册作則垂憲若夫國有大典朝有大疑於是稽以為決操以為驗使損益廢置之序離合因革之原不待廣詢博考一開卷而盡見此會要之書所以不可廢也會要之書典故盡在所以彌縫律令之闕相為表裏堯舜聰明之君也首曰若稽古湯齊聖之君也而曰率厥典書至髙宗始言學而曰監于成憲詩至成王始言極治而曰率由舊章道問學而咨故實有自來矣漢魏相奏漢興以來詔書二十三事唐憲宗詔李絳等搜次君臣成敗五十事懿我國朝以百代為元龜以烈祖為寶鑑前朝事近於治道者詔儒臣日進五條慶厯故事也本朝事關治體者輪侍從日進一兩事建炎故事也王弗進楚令尹定國是之議洪適進仁宗朝久任監司之説乾道間故事也玉海卷五十一
