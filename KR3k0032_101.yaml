body:
  text: 玉海卷一百一宋王應麟撰郊祀祠壇古者祀天地日月神示及即位慶賀建拜皆有壇場以行事誠之至禮之盡也黃帝封祭壇管子地數篇黃帝問於伯髙曰吾欲陶天下以為一家為之有道乎伯髙對曰上有丹沙者下有黃金上有慈石者下有銅金上有陵石者下有鉛錫赤銅上有赭者下有鐵此山之見榮者也茍山之見其榮者君謹封而祭之距封十里而為一壇使乘者下行行者趨修教十年而葛盧之山發而出水金從之蚩尤受而制之以為劍鎧矛戟雍狐之山發而出水金從之蚩尤受而制之以為雍狐之戟芮戈黃帝圜丘漢武紀元封二年六月賜雲陽都百戶牛酒注晉灼曰雲陽甘泉黃帝以來祭天圜丘處師古曰縣之所居在宫側者稱都堯河洛壇龍馬圖文選赭白馬賦注尚書中候曰帝堯即政七十載修壇河洛仲月辛日禮備至于日稷榮光出河龍馬銜甲赤文緑色臨壇吐甲圗宋符瑞志湯乃東至于洛觀帝堯之壇沈璧舜設壇于河依堯故事至于下昃榮光休氣至黃龍負圗出于壇畔赤文緑錯成王少周公攝政七年與成王觀于河洛沈璧禮畢候至日昧榮光出青雲浮青龍臨壇銜圗玄龜止壇赤文成字庾信堯登壇銘曰登壇洛汭沈玉河湄丹圗馭馬緑甲乘龜榮光上幕休氣連帷周圜丘方丘見上類泰壇郊特牲疏王肅以郊丘是一而鄭氏以為二聖證論王肅難鄭云祭法説禘無圎丘之名周官圓丘不名為禘是禘非圎丘之祭也詩思文后稷配天之頌無帝嚳配圓丘之文知郊則圓丘圓丘則郊所在言之則謂之郊所祭言之則謂之圓丘於郊築泰壇象圓丘之形以丘言之本諸天地之性故祭法云燔柴於泰壇則圓丘也郊特牲云周之始郊日以至周禮云冬至祭天於圜丘知圜丘與郊是一也大司樂疏土之髙曰丘取自然之丘圜者象天圜因髙以事天故於地上因下以事地故於澤中水鍾曰澤取自然之丘方象地方郊之祭以后稷配圜丘禘以嚳配祭法云禘黃帝之等皆據祭天於圜丘禮天必於冬至地必於夏至之日者天陽地隂於陽生隂生之日祭之也郊天必於建寅者郊所感帝以祈穀實取三陽爻生之日萬物出地之時祭神州於北郊亦應取三隂爻生之月萬物秀實之時也祭法疏張融以禘為五年大祭又以圜丘即南郊與王肅同燔柴於泰壇瘞埋於泰折疏曰此祭感生之帝於南郊神州地祇於北郊也禮器云至敬不壇此謂燔柴在壇設饌在地家語兆丘於南注謂圜丘之兆於南郊圜丘人之所造故謂之泰壇掃地而祭注圜丘之地掃焉而祭既至泰壇王脫裘矣服衮以臨燔柴春官凡以神仕者注祭天圜丘象北極祭地方澤象后妃春秋繁露春秋之法王者歲一祭天於郊四祭於宗廟漢志王商等以為兆於南郊所以定天位也祭地於大折在北郊就隂位也郊處各在聖王所都之南北折杜鄴曰古者壇場有常處燎禋有常用贊見有常禮犧牲玉帛雖備而財不匱車輿臣役雖動而用不勞每舉其禮助者歡説大路所歷黎元不知周朝日夕月壇見上類周合諸侯壇方明壇禮司儀掌九儀之賓客擯相之禮將合諸侯則令為壇三成宫旁一門注天子春帥諸侯拜日於東郊則為壇於國東夏禮日於南郊則為壇於國南秋禮山川丘陵於西郊則為壇於國西冬禮日月四瀆於北郊則為壇於國北既拜禮而還加方明於壇上而祀焉所以教尊尊也覲禮曰諸侯覲於天子為宫方三百步四門壇十二尋深四尺是也司盟詔明神注神之明察者謂日月山川覲禮加方明于壇上所以依之左傳子産曰大適小有五美作壇以昭其功宣告後人無怠於德南史陳大建十年九月乙巳立方明壇于婁湖甲寅臨誓衆魯雩壇春秋大雩書凡二十一左傳桓五年秋大雩書不時也凡祀啓蟄而郊夏正建寅之月祀天南郊龍見而雩建巳之月蒼龍宿之體昏見東方祭天祈膏雨始殺而嘗建酉之月閉蟄而蒸建亥之月過則書正義天官東方之星盡為蒼龍之宿雩之言逺也逺為百穀祈膏雨豫為秋收意深逺也諸侯雩山川魯得雩上帝故稱大公羊傳大雩旱祭也注君親之南郊以六事謝過自責童男女各八人舞而呼雩穀梁傳雩者為旱求者也求者請也注其禱辭曰方今大旱野無生稼寡人當死百姓何謗不敢煩民請命願撫萬民以身塞無狀注又云傳例曰雩得雨曰雩不得雨曰旱疏天子雩上帝諸侯雩上公魯與天子同雩上帝上帝既雩雩及百辟卿士有益於民者考異郵説僖公三時不雨禱于山川以六過自責云云案春秋考異郵三時唯有禱禮無雩祭之事唯四月龍星見始有常雩月令大雩帝云云正義凡正雩在周之六月常事不書書秋大雩傳不云旱者皆過雩也傳言旱者皆為旱修雩也雩書月者為修旱雩得禮故定元年穀梁傳曰雩月雩之正也秋大雩非正也僖公三時不雨帥羣臣禱山川以六過自責凡雩必先禱祭法雩宗祭水旱也宗當作禜疏亦壇名也雩吁嗟也禜為營域而祭之詩雲漢云靡愛斯牲鄭注大祝云類造禬禜皆有牲攻説用幣而已論語樊遲從遊於舞雩之下左傳莊十年雩門注魯南城門水經注南門亦曰雩門門南隔水有雩壇壇髙三丈曽點所欲風舞處也郊特牲疏鄭注論語云沂水在魯城南雩壇在其上史記正義括地志云沂水亦名雩水衛宏漢舊儀云魯雩壇在城東南引龜山水為沂至壇西行曰雩水南齊志鄭玄云雩壇在南郊壇之旁而不辨東西論衡董仲舒雩祭之法設土龍以為感劉子駿掌雩祭典土龍事漢昭帝紀始元六年夏旱大雩不得舉火注抑陽助隂也漢大將壇髙紀元年夏四月漢王既至南鄭韓信為治粟都尉亡去蕭何追還之薦於漢王王齋戒設壇埸拜信為大將軍傳云以為大將蕭何曰王必欲拜之擇日齋戒設壇場具禮乃可王許之張良傳漢王之將獨韓信可屬大事當一面九域志興元府有韓信壇漢髙祖即位壇髙紀五年二月甲午漢王即皇帝位于汜水之陽注張晏曰泛水在濟隂史記正義括地志云髙祖即位壇在曹州濟隂縣界漢五帝壇泰一壇紫壇甘泉圜丘泰畤壇見郊祀類漢嘉壇志郊祀歌后皇十四后皇嘉壇立玄黃服五神十六扢嘉壇椒蘭芳漢夀福壇洞冥記元光元年起夀福靈壇闊百步四周起銅梁銀堤漢髙邑即位壇光武紀建武元年旃蒙作噩歲四月行至鄗命有司設壇場於鄗南千秋亭五成陌注壇築土場除地其地在今趙州柏鄉縣水經注曰亭有石壇壇有圭頭碑其隂云常山相馮龍所造壇廟之東有兩石翁仲南北相對焉六月己未即皇帝位燔燎告天禋六宗望羣神其祝文曰云云建元大赦改鄗為髙邑祭祀志建武元年光武即位于鄗為壇營於鄗之陽祭告天地采用元始中郊祭故事六宗羣神皆從未以祖配天地共犢餘牲尚約郡國志常山國髙邑故鄗光武更名有千秋亭五成陌光武即位於此肅宗紀元和三年三月丙子詔髙邑令祠光武即位壇金石録光武即位壇碑唐開元二十二年四月王預撰漢社稷方壇詳見前類祭祀志建武二年立太社稷于雒陽在宗廟之右方壇無屋有墻門而已漢先虞壇祭祀志立秋之日迎秋于西郊祭白帝蓐收月令章句曰西郊九里因金數也車旗服色皆白歌西皓八佾舞育命之舞使謁者以一特牲先祭先虞于壇有事天子入囿射牲以祭宗廟名曰貙劉禮儀志立秋之日白郊禮畢始揚威武斬牲於郊東門以薦陵廟其儀乘輿御戎路白馬朱鬛躬執弩射牲牲以鹿麛月令曰天子乃厲飾執弓挾矢以獵月令章句曰親執弓以射禽所以教兆民載戰事也四時間習以救無辜以伐有罪所以強兵保民安不忘危也太宰令謁者各一人載獲車馳駟送陵廟還宫遣使者齎束帛以賜武官漢官名秩曰賜太尉將軍各六十匹執金吾諸校尉各三十匹武官倍於文官武官肄兵習戰陳之儀斬牲之禮名曰貙劉兵官皆肄孫吳兵法六十四陳名曰乘之月令孟冬天子講武習射御角力盧植注曰角力如漢家乘之引閾踏踘之屬今月令季秋天子乃教田獵以習五戎月令章句曰寄戎事之教於田獵武事不可空設必有戒故寄教於田獵間肄五兵天子諸侯無事而不田為不敬田不以禮為暴天物周禮司馬以旗致民平列陳如戰之陳王執路鼓諸侯執賁鼓軍將執晉鼓師帥執提旅帥執鼙卒長執鐃兩司馬執鐸公司馬執鐲以教坐作進退疾徐疏數之節士卒聽聲視旗隨而前却故曰師之耳目在吾旗鼓春教振旅以搜田夏教苃舍以苗田秋教治兵以獮田冬教大閲以狩田春夏示行禮取禽供事而已秋者殺時田獵之正其禮盛獨斷曰巡狩獵還公卿以下陳雒陽都亭前街上乘輿到公卿以下拜天子下車公卿識顔色然後還宫古語曰在車為下唯此時施行立春遣使齎束帛以賜文官漢官名秩曰賜司徒司空帛四十匹九卿十五匹古今注曰建武八年立春賜公十五匹卿十匹貙劉之禮祠先虞執事告先虞已烹鮮時有司乃逡巡射牲獲車畢有司告事畢古今注曰永平元年六月乙卯初令百官貙膢白幕皆霜風俗通稱韓子書山居谷汲者膢臘而置水楚俗常以十二月祭飲食也又曰當新始殺食曰貙膢漢雒陽圓壇北郊方壇見郊兆漢雩場鍾離意傳永平二年夏旱而大起北宫意上疏帝策詔報曰湯引六事咎在一人比上天降旱密雲數會朕戚然慙懼思獲嘉應故分布禱請窺候風雲北祈明堂南設雩場注明堂在洛陽城南言北禱者蓋時修雩埸在明堂之南又勑大匠止作諸宫減省不急詔因謝公卿百僚遂應時雨紀安帝永初七年五月庚子京師大雩順帝陽嘉元年二月戊辰雩甲戌詔曰分禱祈請靡神不禜通典後漢行雩禮以求雨閉諸陽衣皂興土龍立土人舞僮二佾七日一變朱索縈社伐朱鼓禱以少牢禮儀志同魏太和五年三月辛巳大雩漢泰山祠壇章紀元和二年二月辛未幸太山柴告岱宗有黃鵠三十從西南來經祠壇上東北過于宫屋翺翔升降魏圜丘方丘魏志景初元年冬十月乙卯營洛陽南委粟山為圜丘注詔曰號圜丘曰皇皇帝天方丘所祭曰皇皇后地天郊所祭曰皇天之神地郊所祭曰皇地之祇至晉泰始二年并圜丘方丘二至之祀於南北郊十二月壬子冬至始祀續漢志注雒陽魏氏春秋曰有委粟山在隂鄉魏時營為圜丘魏志注魏略曰正始中有詔議圜丘普延學士時郎官及司徒領吏二萬餘人雖復分布見在京師者尚且萬人而應書與議者略無幾人又是時朝堂公卿以下四百餘人其能操筆者未有十人晉先蠶壇見親蠶類晉雩壇南齊書何佟之議曰鄭玄云雩吁嗟求雨之祭也雩帝謂為壇南郊之旁祭五精之帝配以先帝也百辟卿士古者上公以下謂句龍后稷之類傳曰龍見而雩止當以四月晉永和中中丞啓雩制在國之南為壇祈上帝百辟舞童八列六十四人歌雲漢詩皆以孟夏得雨報太牢勾芒等五神是五帝之佐依鄭玄説宜配食於庭雩壇方郊壇為輕理宜在左宜於郊壇之東營城之外築壇壇宜圓崇四尺徑四丈周圍十二丈而四階設五帝之位各於其方舞雩依晉朝之議使童子司馬彪禮志云雩祀著皂衣崇隂之義今祭服皆緇建武二年議通典晉穆帝永和中制雩壇於國南郊之旁依郊壇近逺祈上帝百辟旱則祈雨齊建武二年旱雩以武帝配饗於雩壇晉元帝大興元年六月旱帝親雩宋先農壇宋文帝元嘉二十一年春親耕立先農壇於藉田中阡西陌南髙四尺方二丈為四出陛陛廣五尺外加埒去阡陌各二十丈隋於國南十四里啓夏門外置地千畝為壇孟春吉亥祭先農於其上以后稷配牲用一太牢梁南北郊壇隋禮志梁南郊為圎壇在國之南髙二丈七尺上徑十一丈下徑十八丈其外再壝四門常與北郊間歲正月上辛行事太史設柴壇於丙地齋於萬夀殿乘玉輅備大駕以行禮北郊為方壇於北郊上方十丈下方十二丈髙一丈四面各有陛其外為壝再重何佟之議自晉太始二年并圓丘方澤同於二郊今之郊禋禮兼祈報後周司量掌為壇之制圓丘三成方丘一成梁雩壇隋志梁制大雩禮立圓壇於南郊之左髙及廣輪四丈周十二丈四陛舞童八列歌雲漢詩一章天監九年有事雩壇以為雨既類隂求之正陽其謬已甚東方生養之始遂移於東郊大同五年又築於藉田兆內有祈禜則齋官寄藉田省云後齊歌雲漢詩於壇南隋國南十三里詳見羣祀後齊迎氣壇隋志梁制迎氣以始祖配牲用特牛一其儀同南郊後齊五郊迎氣為壇各於四郊又為黃壇於未地後周五郊壇其崇如其行之數廣四丈方百二十步內壝半之隋五時迎氣為壇各依其方隋青帝壇禮儀志開皇十四年羣臣請封禪十五年春行幸兖州次岱嶽為壇如南郊又壝外為柴壇又陳樂設位於青帝壇如南郊服衮冕乘金輅備法駕行禮隋先蠶壇禮儀志隋制於宫北三里為壇髙四尺季春上已皇后服鞠衣乘重翟率三夫人九嬪內外命婦以太牢制幣祭先蠶於壇上用一獻禮隋圜丘志髙祖為圜丘於國南太陽門外道東二里其丘四成各髙八尺一寸下成廣二十丈再成廣十五丈又三成廣十丈四成廣五丈後魏太和十二年築圜丘於南郊唐圜丘方丘神州壇五帝壇朝日壇夕月壇社稷壇蠟壇燎壇小祀壇海瀆壇禮志唐壇坎之數皆略依古四成而成髙八尺一寸下成廣二十丈而五減之至于五丈而十有二陛者圜丘也八觚三成成髙四尺上廣十有六步設八陛上陛廣八尺中陛一丈下陛丈有二尺者方丘也髙廣皆四丈者神州之壇也其廣皆四丈而髙八尺者青帝七尺者赤帝五尺者黃帝九尺者白帝六尺者黑帝之壇也廣四丈髙八尺者朝日之壇也為坎深三尺縱廣四丈壇於中髙一尺方廣四丈夕月之壇也廣五丈以五土為之者社稷壇也髙尺廣丈蠟壇也髙五尺周四十步先農先蠶壇也其髙皆三尺廣皆丈者小祀壇也嶽鎮海瀆祭於其廟無廟則壇於坎廣一丈四向為陛者海瀆之壇也廣二丈五尺髙三尺四出陛者古帝王之壇也廣一丈髙一丈二尺戶方六尺者六祀之燎壇也廣八尺髙一尺戶方三尺者中祀之燎壇也廣五尺戶方二尺者小祀之燎壇也賈餗圜丘賦覆玉葉之卿雲昭扶桑之初日韓愈元和聖德詩圜壇帖妥唐受瑞壇地理志北都倉城中有受瑞壇髙祖使元吉留守獲瑞石築壇祠以少牢唐龍池壇龍池樂章乂見樂類頌類會要開元二年閏二月詔令祠龍池六月四日右拾遺蔡孚獻龍池篇公卿以下百三十篇付太常寺考其詞合音律者為龍池樂章共録十首姚元崇蔡孚沈佺期盧懷謹薑皎崔日用蘇頲李乂薑晞裴漼十人等為樂章十六年詔置壇及祠堂每仲春將祭則奏之十八年十二月二十九日有龍見于興慶宫池因祀而見也太常卿韋縚草祭儀請用二月云云二十三年五月一日宗子請率月俸於興慶宫建龍池聖德頌以紀符命望令皇太子書中書令張九齡為文從之詳見興慶宫社通典祭興慶宫五龍壇大樂令設判懸郊令率齋郎設散樽五龍各二貞元六年六月復祭五龍壇唐社稷壇見社稷類唐雩壇通典開元十一年孟夏後旱則祈雨于雩壇唐夀星壇會要開元二十四年七月十二日庚子上封事者言月令云八月日月會于夀星居次列宿之長請至八月社日配夀星祠于太社壇又請兩京各改一殿以萬夀為名千秋節會百僚於此殿勑特立夀星壇以千秋節日修其祠典二十六日甲辰勑夀星壇宜祭老人星及角亢七宿著之常式舊紀開元二十四年七月己巳初置夀星壇八月庚戌老人星見月令八月有司秋分日享夀星于南郊一本云明皇生于八月以仲秋日月會於夀星特置壇用千秋節日祭老人星及角亢七宿著之常式爾雅夀星角亢也注列宿之長故曰夀星漢元封二年郊雍還拜祝祠太一贊饗曰夀星仍出淵耀光明索隱曰老人星也東漢仲秋祀老人星廟角亢與老人别星唐青帝壇九宫壇詳見下王璵傳玄宗廣修祠祭璵請築壇東郊祀青帝肅宗乾元元年入相乃奏置太一壇勸帝身見九宫祠肅宗乾元二年正月丁丑親祠九宫通鑑云戊寅祀九宫用王璵之言也上元元年正月又祀九宫會要開元二十五年十月一日辛丑制自今立春親迎春於東郊二十六年正月八日親迎氣於東郊祀青帝壇天寶五載十月十六日術士蘇嘉慶上言請於城東置九宫神壇招搖軒轅太隂天乙天符攝提咸池青龍太乙唐風伯雨師壇中祀會要天寶四載七月二十七日敕風伯雨師濟時育物謂之小祀頗紊彛倫自今已後宜升中祀仍令諸郡各置一壇九月十六日勑諸郡置風伯壇于社稷之東雨師壇于西其壇卑小於社壇造以立春後丑日祀風伯立夏後申日祭雨師五載四月十七日己亥詔祀雨師以雷神同壇上元元年停中祀小祀永泰二年復風師雨師貞元六年二月十七日復靈星等壇貞元三年閏五月二十一日徙風師壇於滻水東國史志立春後丑日祀風師壇髙四尺東西四步三尺南北四步二尺皇祐定髙三尺周三十三步立夏後申日祀雨師雷師壇髙三尺方一丈九尺皇祐定周六步祥符元年九月查道言外州風伯雨師令長吏親享二年三月澤州請建風伯雨師廟令禮官考儀頒下有司言唐制諸郡置風伯壇于社壇之東雨師壇于西各稍北三數十步卑下於社壇無立廟之文唐九宫壇太一壇紀天寶三載十二月癸丑祠九宫貴神于東郊實録十二月癸巳制曰九宫所主百神之貴上分天極下統坤維隂隲生靈功深亭育式昭新典肇建明祠以今月立春親祠九宫壇癸丑親祠會要天寶三載十月十六日術士蘇嘉慶上言請於京城置九宫壇壇一成三尺四陛其上依位置小壇髙尺五東南曰招搖正東曰軒轅東北曰太隂正南曰天一中央曰天符正北曰太一西南曰攝提正西曰咸池西北曰青龍五數為中戴九履一左三右七二四為上六八為下符於遁甲十月十六日詔曰漢禱八神晉祠六宗惟九宫神實司水旱其令有司以來月甲子日立壇禮次昊天上帝壇而在太清宫太廟上用牲牢璧幣十二月二十四日親祀於東郊五載四月己亥制自今四孟月擇吉日祀天地九宫令宰臣行禮乾元二年正月丁丑通鑑戊寅上親祠至德三年即乾元元年六月九日置太一神壇於南郊東舊紀乾元元年六月己酉初置太一神壇於圓丘東九宫以四孟隨歲改位行棊謂之飛位乾元後遂不易位太和三年崔龜從言九宫皆列星不容為大祀遂詔降為中祀會昌元年十二月令有司崇飾舊壇以宰相行事二年正月左僕射王起等奏案黃帝九宫經及蕭吉五行大義一宫其神太一星天逢卦坎行水方白二宫其神攝提星天內卦坤行土方黑三宫其神軒轅星天衝卦震行木方碧四宫其神招搖星天輔卦巽行木方緑五宫其神天符星天禽卦坤行土方黃六宫其神青龍星天心卦乾行金方白七宫其神咸池星天柱卦兊行金方赤八宫其神太隂星天任卦艮行土方白九宫其神天一星天英卦離行火方紫統八卦運五行土飛于中數轉于極兩朝親祠而臻百祥斡造化於混茫賦品彚於隂隲與天地日月相參請復用大祀之禮祝版以社稷為凖國史禮志春秋二仲祀九宫貴神壇再成下髙三尺五寸上髙三尺三寸東西十步四尺景祐二年學士定司天監生奏案郤良遇九宫法有飛棊立成圖每歲一移主九州災福事天寶中術士蘇嘉慶始置九宫神壇一成髙三尺四陛上依位置九小壇東南曰招搖正東曰軒轅東北曰太隂正南曰天一中央曰天符正北曰太一西南曰攝提正西曰咸池西北曰青龍五數為中戴九履一左三右七二四為上六八為下符於遁甲此九宫定位也每嵗祭以四孟位隨歲改謂之行棊自乾元後止依本位祭遂不飛易仍減冬夏二祭國朝因乾元故事皇祐增定壇如郊祀録三成成三尺四階上依位置小壇九皆髙尺五寸縱廣八尺西南為坤階詳見後咸平復為大祀景祐更定飛棊皇祐二年明堂分祀九宫用兩圭有邸黃帝九宫經隋志一卷又三卷行棊經三卷鄭玄注房氏行棊法一卷九宫之説出於乾鑿度漢黃香九宫賦伊黃靈之典度存文昌之會宫握璇璣而布政總四七而持綱和日月之光耀均節度以運行唐太一壇會要至德三年即乾元元年六月九日置太一神壇於南郊東中書侍郎王璵奏置舊紀云置於圓丘東通鑑云乾元元年六月己酉立太一壇命璵祭之元年即上元二年是歲去年號建丑月一日辛亥親拜南郊一作祀圜丘又祭太一壇非舊制也唐先農壇禮志永徽以前皆謂藉田壇至垂拱後乃為先農又因韋叔夏張齊賢等議改為帝社壇元和二年一作五年詔以來歲正月籍田太常修撰韋公肅言藉田禮廢久矣有司無所考乃據禮經參采開元乾元故事為先農壇於藉田髙五尺廣五尺四出陛其色青舊紀大厯五年四月丙午復置先農馬祖壇命太常置唐黃帝壇會要天寶九載四月二十九日一作十載四月辛巳制曰頃者每祀黃帝乃就南郊禮亦非便宜於皇城內西南坤地改置黃帝壇朕當親祀以昭誠敬唐五龍壇實録貞元六年六月己酉復祭五龍壇初開元中每嵗以二月祭之有司行事著於新禮自上元中元年閏四月己卯罷中小祀其祭遂廢及是宰臣請復之帝始以是日親祭宋朝仲春祭五龍於堂廟在國門東唐雩祀壇實録乾元二年三月舊紀四月癸亥以久旱徙東西二市於是祭風伯雨師修雩祀壇為泥人土龍及望祭名山大川而祈雨晉武咸寧二年春久旱四月丁巳詔廣加祈請五月庚午始祈雨于社稷山川六月戊子獲雨此雩禜舊典也太康三年四月十年二月又如之隋雩壇國南十三里啓夏門外道左高一丈周百二十尺孟夏龍星見則雩五方上帝配以五人帝以太祖配饗五官從配於下旱則祈雨開皇二年四月甲申旱上親祀雨師於國城之西南癸巳上親雩成湯六事克已魯僖自責祈雨禮有旱暵之舞詩有昭回之詠唐柴壇宋朝元豐三年六月九日詳定奉祀禮文言後漢志郊祀既送神燔俎實於壇南已地晉賀循議積柴之壇宜於神壇南二十步丙地當太微明堂之位唐禮因之柴壇在圜丘南內壝之外丙地宋朝五帝壇四郊迎氣及土王日祀五方上帝以五人帝配五官三辰七宿從祀正月上辛祀感生帝乾德元年置感生帝壇興國八年十月五日祀土德於黃帝壇圭幣牢具如大祠淳化二年二月八日祕書監李至請祀青帝日去金提配坐嘉祐元年十二月九日詔祝文位版去五帝之名元豐六年八月改置白帝壇元祐九年正月重修黑帝壇齋宫紹聖四年閏二月八日徙白帝壇宫紹興三年四月十五日詔祀五方帝于四郊十八年升感生帝為大祀三十一年宗祀升五帝五人帝於堂用籩豆十二乾德感生帝壇乾德元年閏十二月乙亥二十八日太常博士聶崇義上言皇家以火德承正統請奉赤帝為感生帝即五方上帝之一也以每歲正月上辛别壇而祭下尚書省集議有司酌隋制感生帝為壇南郊髙七尺廣四丈奉宣祖配牲用騂犢二玉用四圭幣如方色二年十一月二十五日禮官請上辛從祀不設赤帝位熙寧五年四月三日詔以僖祖配感生帝元豐四年十月禮官請用犢其後或祀於立夏迎氣之壇大觀四年四月二十八日議禮局請於南郊别立感生帝壇依赤帝髙廣之制從之紹興十八年十一月一日祕書少監張杞言我朝火德題運世以僖祖配之祥符大觀或至親祠中興以為小祀宜升為大祀於是用羊豕各一於望祭齋宫行事升大祀乾德元年撰八曲仁宗御撰二曲紹興十六曲炎精之神飛軿碧落駕以浮雲丹書赤爵赤旗霞曳從以炎官乾德南郊壇四年九月乙卯改築南郊壇徙於舊壇南五里俄罷之太平興國黃帝壇興國八年十月戊子詔祀土德於黃帝壇圭幣牢具如大祠制俾祠官領之雍熙先農壇紹興觀耕壇見藉田雍熙四年九月二十七日詔來年正月親耕二十八日命宋白賈黃中等定儀注十月一日詳定所言北齊壇髙九尺廣輪三十六尺四陛三壝四門唐制髙五尺周廽四十步今請壇髙九尺周圍四十步飾以青唐祀先農長安在通化門外十里洛陽在上東門外七里今請於朝陽門七里外十五里內為壇十五日禮儀使言宋齊之制於先農壇東立觀耕臺請築臺髙五尺周四十步四出陛飾以青二十一日詳定所又言先農壇設二壝樂懸二舞俱在壇前請定御耕位在壝城東南外壝設於大次御耕位觀耕臺樂懸之外端拱元年正月十七日親饗神農氏于壇以后稷配淳化元年五月二十三日禮官言端拱親耕壇設兩壝無周圍步數請四面各封五十步為兩壝壝各五十步從之景德四年十二月庚戌判禮院孫奭言六典禮閣新儀皆言吉亥饗先農今以正月一日望改用正月上辛後亥日詔禮官議從其請明道元年十二月庚子詔以來年二月丁未藉田就端拱壇位耕地因加修飾二十五日以農壇三壝地狹請自外壝十步限以青繩元豐二年十月詔於京城東南度地十畝為藉田置令一員徙先農壇於其中立神倉於東南以郊社令辛公祐兼藉田令冬則藏氷凡祠祭取具焉三年五月九日王存請以千畝為藉田百畝建先農壇兆神倉齋宫并耕作廬舍之類繪圖上之紹興十五年十一月十七日詔以來歲之春祇祓青壇親載黛耜十六年正月五日定饗先農儀注二十一日行禮壇在嘉會門外南四里玉津園之南衮冕執大圭入正門宫懸奏靜安之樂儲靈錫慶之舞三成止皇帝升壇耕藉使從登歌奏嘉安之樂奠鎮圭於繅藉奠幣奉爼宫懸豐安之樂作升壇登歌奏禧安之樂執爵祭酒文舞退武舞進宫懸正安之樂作皇帝飲福受胙登歌歆安之樂作賜行事陪祠官胙宫懸乃奏靜安之樂一成止景德夀星壇景德二年八月辛未朔知樞密院事王欽若上言謹按月令八月命有司秋分日享夀星于南郊唐會要開元二十四年七月勑七月庚寅上封事者言日月會于夀星居列宿之長令所司特置夀星壇二十六日勑以千秋節日祭老人星及角亢七宿方今三代之禮莫不兼修百神之祠於焉咸秩而蕭薌之祭獨略夀星望詔禮官俾崇祠事詔禮院檢討以聞禮院言案月令注云秋分日祭夀星於南郊夀星南極老人星也爾雅云夀星角亢也注數起角亢列宿之長故曰夀唐開元二十四年上封事者言月令云八月日月會于夀星居列宿長請八月社日配夀星于太社壇饗之當時勑置壇常以千秋節日祭老人及角亢七宿著之常式今參詳享夀星及角亢七宿請用祀靈星小祠禮例其壇亦依靈星壇制度築於南郊以秋分日祭之詔可壇在南薰門外七里祥符二年九月庚午詔自今郊祀列周伯星位于氐宿夀星之次從邢中和之請也元豐四年十月止設老人星一位南向壇下七宿皆不設位紹興七年五月十一日太常博士黃積厚請秋分日享夀星從之用籩一豆一著尊一景德先蠶壇見親蠶類景德中判太常寺李宗諤以諸神祠壇多缺外壝之制因深塹列木以表之營葺齋室月視其缺咸平九宫貴神壇祥符九宫壇紹興九宫壇國朝初承唐制祀于東郊建壇于朝陽門外與青帝鄰咸平四年三月二十四日直祕閣杜鎬言今禮以五帝為大祀太一為中祀九宫所主風雨霜雪雷電疾疫之事請復為大祀從之學士宋白等議御書祝版禮同社稷增設壇兩壝玉用兩圭有邸藉藁秸加褥如幣色八月七日詔以九宫壇不合禮禮官請第一成四方各一百二十尺髙三尺再成各一百尺髙如之壇上小壇九每壇縱廣八尺各相去一丈六尺列祭器及公卿酌奠郊祀録九宫壇在京城東壇三成成三尺四階小壇九階髙一尺九寸縱廣八尺又西南為一階曰坤道人門景德二年十月十六日王欽若言往者列九宫為大祀靈心合答景福並輳祥符元年東封八月壬辰詔俯邇岱宗别興墠壇癸巳五日於泰山行宫東别建壇二成三尺四階其上小壇九髙一尺五寸四面各八尺壇下四面為兩壝各二十五步三年十一月以將祀汾隂命向敏中祀九宫六年九月十六日禮官言恭謝天地遣官祭初唐天寶三載蘇嘉慶言九宫位隨歲改謂之行棊飛位自乾元後止用一局失飛宫之位景祐二年乙亥歲司天監生于淵與役人單訓議其失請依九宫太一經飛位詔學士章得象詳定四月七日庚申得象等言按郤良遇九宫法有飛棊立成圖每歲一移兼推九州所主災害之法唐天寶中祭以四孟隨歲改位行棊謂之飛位今淵所請合天寶之禮良遇之圗請祭九宫之時命司天監一員赴祠所隨每年貴神飛棊之方以定祭位從之其法自天聖七年己巳入厯太一在一宫歲進一位飛棊周而復始治平元年五月四日己亥學士胡宿言貴神實司水旱請水旱命官祈禱詔禮官議從之紹興十八年五月甲戌太常簿林大鼐請建九宫壇六月十八日詔於國城之東建壇壇制二成髙三尺闊五丈上設小壇九廣八尺各髙一尺五寸壇下四面為兩壝各二十五步在東青門外一里先是十三年太常丞朱輅請舉行祀典至是禮官言十神太一九宫太一皆天之貴神國朝分而為二並為大祀比新太一宫而九宫屋而不壇與小祀雜請擇地重建故也禮如感帝舊咸平制與此同制酌天寶之儀循祥符之定元豐六年二月何洵直請每位皆一牢樂章云靈壇九位直符處中元祐六年閏八月以飛位不常易之崇寧三年四月十三日禮官請用禮神玉大觀四年改用圭璧燧人觀斗極而定方名庖羲因河圖而畫八卦黃帝造甲子定厯數八卦九宫之義由是興焉招搖權星太陰天一天符太一攝提咸池青龍漢張衡傳聖人明審律厯以定吉凶重之以卜筮雜之以九宫注易乾鑿度曰太一取其數以行九宫鄭康成注云太一者北辰神名也下行八卦之宫起於坎終於離也唐明皇肅宗嘗親祠太和降為中祀會昌復重其禮以宰相修祠事祥符風伯雨師壇太平興國三年十一月北征遣官祭風伯雨師壇用少牢行磔風之祭祥符二年四月二十六日澤州請建廟命禮官考其儀有司言唐制諸郡置風伯壇于社壇東雨師壇于西國朝每歲以立春後丑日祭風伯立夏後申日祭雨師雷師元豐四年十月詳定禮文所請稽四類之義兆風師於西郊祠以立春後丑兆雨師於北郊祠以立夏後申兆司中司命司民司祿於南郊祠以立冬後亥壇兆從其氣類祭辰從其星位雨師雷師為一壇同壝司中司命司民司祿為四壇同壝壇制髙廣如舊制周制大宗伯以槱燎祀風師雨師注云風師箕雨師畢也後漢以丙戌日祀風師於戌地以己丑日祀雨師於丑地牲用羊豕唐天寶四載勑風伯雨師升中祀諸郡各置一壇因春秋祭社之日同祀九月勑諸郡風伯壇置社壇之東雨師壇之西五載四月詔祀雨師以雷師同壇祭共牲别置祭器康定大火壇實録康定元年七月戊午五日太常博士集賢校理胡宿言竊聞南京鴻慶宫災此上天示變以告人主臣未暇推言災異願國家修火祀謹按春秋士弱對晉侯曰古之火正或食於心或食於咮陶唐之火正曰閼伯居商丘祀大火紀時焉説者曰火正火官也掌祭火星行火政後世以為火祖相土契之曾孫代閼伯後主火星宋其後也商丘在今南京太祖受命之地當房星之次以宋建號用火紀德實本於此至真宗祥符七年正月始升建京邑號為三都南京正殿以離明為名則閼伯之神上配大火祀典尤宜超異今閼伯祀在商丘之上丘髙二十餘丈祠屋制度狹小又不領於天子之祀官嵗時但府吏享祀非報本尊始崇神秩祀之意願詔太常列於祠官春秋二時遣使持祝版祠具或遣近臣或委留司長吏攝行祠事對祭大火仍崇飾祠宇以申嚴奉詔禮院詳定以聞十月辛丑十七日宿又言春秋傳髙辛二子長曰閼伯遷於商丘主辰故辰為商星且五行之官祀為貴神五時祀之謂之五祀大辰房心尾也大火謂之大辰周官保章氏分星鄭氏云大火宋也左氏傳曰宋大辰之墟漢地理志宋房心之分野按圗經云商丘在宋城縣西南二里髙八十丈周回二百步今閼伯之祠直當其上蓋房心天帝之明堂太祖於此受命傳序四聖享祀弗及又按國語董因曰君之出也歲在大火閼伯之星也是為大辰辰以成善又曰嗣續其祖如穀之滋韋昭以為辰為農祥周先后稷之所經緯以成善道則東方七宿房心通有農祥之稱若因舊丘古祠除壇對祭不惟講修火政亦足以祈求年豐詒厥子孫永錫純嘏禮院言閼伯為髙辛火正實居商丘主祀大火能宿其官後世因之祀為貴神配火侑食亦如周棄配稷后土配社之比宜因興王之地商丘之舊作為壇兆秩祭大火以閼伯配之其閼伯舊廟并壇兆之制官為修崇每遇辰戌出納之月內降祝版詔留司長吏奉行祭事籩豆牲幣視中祀於是令禮官詳定十二月乙酉禮院上言南京大火壇髙五尺廣二丈出四陛陛五尺壝一重四面距壇各二十五步位版以黑漆朱書曰大火位配位曰閼伯位牲用羊一豕一器凖中祠歲以三月九日擇日命南京長吏及以次官分三獻攝祠從之一本云詔陪京尹正之臣行事慶厯七年二月十六日胡宿又請增葺壇場及商丘祠宇詔南京增修靖國元年建陽德觀崇奉熒惑政和六年六月五日幸陽德觀崇寧元年七月甲申朔建長生宫以祀熒惑四年七月六日禮官請於南郊赤帝壇外為熒惑壇以時致祭大觀三年七月封閼伯商丘公廟曰光德紹興二年十二月丙申博士趙霈請設位望祭三年正月癸酉初復大火之祭七年六月禮官討論於辰戌之月依五方帝之禮望祭十八年五月四日辛酉禮官請建一殿奉火德配以閼伯其後建于太一宫道院名曰明離宋城縣閼伯廟曰光德紹興七年三月加封王爵錫諡宣明髙辛有祝融陶唐有閼伯士弱之對晉侯公孫僑之告叔向慶厯欽天壇紀慶厯三年五月辛卯築欽天壇于禁中仁宗事天地齋栗或時災變必跣足露立致禱于禁中凡水旱甚則車駕親禱寺觀仁宗八皆為旱皇祐五帝壇禮志四立土王日祀五方帝青帝壇髙七尺方六步四尺赤帝壇髙六尺東西六步三尺南北六步二尺黃帝壇髙四尺方七步白帝壇髙七尺東西七步南北七步一尺黑帝壇髙五尺方三丈七尺皇祐定壇如唐郊祀録各廣四丈其髙用五行八七五九六為尺數皇祐五年閏月定諸壇皇祐地祇壇志皇祐三年禮官馮浩言皇地祇壇各再成面廣四丈九尺東西四丈六尺上等髙四尺五寸下等髙五尺方五丈三尺陛廣三尺五寸大抵卑陋不應禮典禮院請如郊祀録增廣五年諸壇皆改孟冬祭神州地祇壇方三丈一尺皇祐定壇髙三尺廣四十八步四出陛皇祐朝日夕月壇志皇祐五年定朝日壇舊髙七尺東西六步一尺五寸增修髙八尺廣四丈如唐郊祀録夕月壇與隋唐制度不合從舊則壇小如唐則坎狹定坎深三尺廣四丈壇髙一尺廣二丈四方為陛降入坎中然後升壇皇祐先農壇先蠶壇志立春後亥日享先農壇髙九尺東西十步南北十步三尺明道二年二月親耕籍田修飾先農壇如雍熙制皇祐定壇髙五尺周四十步如唐制季春吉已享先蠶壇髙四尺五寸周四步二尺皇祐定壇如新禮髙五尺方四丈四出陛陛各五尺元豐四望壇元豐二年知湖州陳侗請依周禮建於四郊八月詳定禮文所言小宗伯兆四望鄭注為壇之營域祭法四坎壇祭四方也壇以祭山川丘陵坎以祭山谷泉澤魏立四望位於祭地壇隋史官南郊圗有東西南北望之位各居其方唐開元禮祈嶽鎮四瀆于郊四方山川各附嶽瀆下請兆四望於四郊每方嶽鎮海瀆共為一壇望祭以五時迎氣日祭之用血祭瘞貍四年三月禮官言五時望祭製兩圭有邸及瘞玉六年二月請每位皆一牢八月修白帝夕月西方嶽鎮海瀆馬祖四壇政和三年八月加四鎮王封建炎元年九月四日常少滕康請如虞望秩周時邁循幸祭所過名山大川詔望祭紹興七年五月十一日舉嶽瀆祀典從博士黃積厚之言也元豐雩壇五年七月己丑五日禮部奏太常參詳雩壇當立圜壇於南郊之左已地依郊壇逺近髙一丈廣輪四丈周十二丈四陛為三壝二十五步周垣四門燎垣一如郊壇之制從之祀上帝以太宗配元豐朝日夕月壇天禧元年四月戊寅十日監察御史王博文言祀稱夕月壇號夜明翻居晝祭恐未合宜請於未後三刻行禮從之唐劉禹錫夕月壇詩注云其禮用晝元豐六年正月二十三日禮部言熙寧祀儀朝日壇廣四丈夕月壇廣二丈以唐王涇郊祀録考之夕月壇方廣四丈今止方二丈比日壇甫及其半望改造夜明壇為坎深三尺從廣四丈為壇於坎中髙一尺方廣四丈從之紹興三年四月十五日司封郎鄭士彥上言始舉祀典於惠照院望祭齋宫行事元祐七年三月庚寅詔朝日夕月去祀字建炎受命中興壇髙宗即位于南京建炎元年五月庚寅朔王登壇告天禮畢即位于府之正衙壇在府治中門之東實耿延禧建議所築後名曰受命中興之壇漢高在泛光武在鄗魏受漢禪設壇繁陽即位壇王者所以興也漢鄗南魏繁陽壇至今皆在紹興圜丘紹興十三年三月丙午詔修築圜丘于龍華寺之西先是二月二十五日命楊存中等相視壇四成上成縱廣七丈下成二十有二丈分十三陛陛七十有二級壇及內壝凡九十步中壝外壝共二十五步以龍華寺為望祭殿不築齋宫十一月二十九日太常禮部言已修建圓壇凡祀天及非時慶賀奏告宜於本壇行禮從之先是建炎二年於江都縣築壇十一月壬寅祀昊天上帝奉太祖配自元符三年再罷合祀因不改紹興十三年十一月庚申郊祀始復合祭設大神大示及太祖太宗配位十六年十一月丙子再郊十九年十一月壬辰二十二年十一月戊申二十五年十一月癸亥二十八年十一月己卯郊乾道五年九月十一日林栗等言歲祀上帝者四春祈夏雩秋饗冬報其二在南郊圓壇其二在城南惠照院望祭齋宫今未建雩壇端誠殿欲四祭並即圎壇以遵舊制從之紹興圜丘在嘉會門外南四里中興祀典冬至圜丘夏至皇地祇太祖配孟春祈穀孟夏雩祀神州地祇並太宗配季秋明堂淳熙十六年改高宗配感生帝僖祖配充已上宰執獻官髙禖青帝配以太昊髙辛朝日大明夕月夜明九宫貴神太一攝提權星招搖天符青龍咸池太隂天一熒惑商丘宣明王配太社太稷土正后稷出火納火祀大辰宣明王配蠟祭東蠟大明配以神農后稷西蠟夜明配以神農南蠟神農無配北蠟神農配以后稷五方嶽鎮無配四海四瀆無配風雨雷師無配先農神農后稷配先蠶至聖文宣王兖鄒公配昭烈武成王留侯配祚德廟強濟英略啓佑公今為忠佑顯應慶善崇福王忠利彰應慶逺隆福王忠濟靈應慶順嘉福王紹興初大祀三十有六止行二十三其五帝神州蠟祭等十二祭皆為中祀二十七年五月辛卯一云四月二十六日臣僚建請復為大祀乾道四年九月十九日禮部郎李濤請復嶽瀆農蠶風雨雷師之祀從之玉海卷一百一
