body:
  text: 玉海卷五十四宋王應麟撰藝文總集文章屈原作離騷為百代詞章之祖衆士慕嚮綴文接踵於道各名一家之言别而聚之命之曰集其原起於東京而極於有唐至七百餘家晉摯虞彚分之曰文章流别後世祖述為總集至唐亦七十五家楚辭漢離騷傳唐七家楚辭楚辭章句史記屈原傳原名平楚之同姓也為楚懷王左徒上官大夫讒之王怒而疏平平憂愁幽思而作離騷離騷者猶離憂也既死之後楚有宋玉唐勒景差之徒者皆好辭而以賦見稱然皆祖屈原漢地理志楚屈原被讒作離騷諸賦後有宋玉唐勒之屬漢淮南王安著書而吳有嚴助朱買臣貴顯文辭並發故世傳楚辭漢藝文志屈原賦二十五篇唐勒四篇宋玉十二篇漢傳淮南王安武帝使為離騷傳旦受詔日食時上王逸云武帝使安作章句其隋志淮南王章句書已亡朱買臣召見説春秋言楚辭帝甚説之宣帝召能為楚辭九江被公召見誦讀王褒傳揚雄作書托離騷文而反之名曰反離騷又旁離騷作重一篇名曰廣騷又旁惜誦以下至懷沙一卷名畔牢愁班固敘贊二篇固云孝武詔淮南王安敘離騷傳以為國風好色而不淫云云斯論似過其實班彪有悼離騷王逸順帝時著楚詞章句行於世隋志云後漢校書郎王逸集屈原迄劉向又自為一篇并敘而注之梁竦感悼子胥屈原作悼騷賦繫玄石沈之應奉著感騷三十篇數萬言愍屈原因以自傷文心雕龍辨騷隋志楚辭十部二十九卷王逸至劉杳宋何偃刪逸注十一卷亡皇甫遵訓參解七卷又楚辭音各二卷餘見唐志原著離騷宋玉傷而和之其後賈誼東方朔劉向揚雄擬作以原楚人也謂之楚辭隋時有釋道騫善讀之今傳楚辭者祖騫公之音唐志集録楚辭類七家七部三十二卷王逸注十六卷隋志十二卷郭璞注十卷隋志三卷楊穆九悼一卷劉杳離騷草木蟲魚疏二卷孟奧徐邈僧道騫音各一卷樂類離騷譜一卷中興書目楚辭九家九十四卷宋朝黃伯思翼騷一卷伯思曰屈宋諸騷皆書楚語作楚聲紀楚地名楚物故謂之楚辭洪興祖補注十七卷考異一卷黃銖協韻一卷朱熹集注八卷辨證二卷朝補之集續變二書各二十卷熹刋補定著五十二篇為楚辭後語離騷經九歌東皇太一雲中君湘君湘夫人大司命少司命東君河伯山鬼國殤禮魂十一章九章惜誦涉江哀郢抽思懷沙思美人惜往日橘頌悲回風天問逺遊卜居漁父屈原九辨招魂宋玉大招屈原或言景差惜誓賈誼招隱淮南小山七諌東方朔哀時命莊忌九懷王褒九歎劉向九思王逸凡十六卷唐志太史公曰屈平之作離騷蓋自怨生也國風好色而不淫小雅怨誹而不亂若離騷者可謂兼之矣其文約其辭微其志潔其行亷其稱文小而指極大舉類邇而見義逺其志潔故其稱物芳其行亷故死而不容自疏濯淖汙泥之中蟬蛻於濁穢以浮遊塵埃之外不獲世之滋垢皭然泥而不滓者也推此志也雖與日月爭光可也朱文公曰其寓情草木托意男女以極逰觀之適者變風之流也其敘事陳情感今懷古以不忘乎君臣之義者變雅之類也至於語冥昏而越禮攄怨憤而失中則又風雅之再變矣其語祀神歌舞之盛則幾乎頌其變也又有甚焉自原之後作者繼起而宋玉賈生相如揚雄為之冠七諫以下無足觀者而褒為最下朝氏曰離騷遭憂也終窶且貧莫知我艱北門之志也何辜於天我罪伊何小辨之情也以附益六經之教於詩最近懷沙言賦橘頌言頌九歌言歌天問言問皆詩也離騷備之矣蓋詩之流至於楚而為離騷至漢而為賦其後復變而為詩又變而為雜言長謡問對銘贊操引漢連珠三輔決録注趙岐擬前代連珠之書四十章上之假喻以逹旨而覽者微悟歷歷如貫珠故謂之連珠蔡雍傳著連珠韓説奏連珠文苑傳傅毅著連珠劉珍著連珠文選陸機演連珠五十首注傅玄敘連珠興於漢章之世班固賈逵傅毅受詔作之合於古詩諷興之義文心雕龍揚雄覃思文閣碎文璅語肇為連珠擬者間出杜篤賈逵劉珍潘朂欲穿明珠多貫魚目唯士衡理新文敏文選注引揚雄連珠杜篤連珠宋庠撰連珠一卷倣陸機之作隋志陸機連珠一卷何承天注文選劉孝標注謝靈運連珠集五卷唐志同陳證連珠十五卷黃芳連珠一卷梁武連珠一卷沈約注約謂金鑣互騁玉並馳梁武帝制旨連珠十卷邵陵王綸注又陸緬注武帝著連珠羣臣繼作者數十人丘遲文最美梁有設論連珠十卷謝靈運撰南齊書劉祥著連珠十五首唐志謝靈運連珠集五卷梁武帝制旨連珠四卷陸緬注十一卷康顯海藏連珠三十卷文章緣起連珠揚雄作沈約曰連珠之作始自子雲蓋謂辭句連續互相發明若珠之結排也漢魏文章書目漢魏文章二卷宋玉及漢魏人文賦凡八十八首三國志文類六十卷集詔書表奏評論序文等集者不知名晉文章流别集文章志善文摯虞傳撰文章志四卷後漢桓麟傳注文選長笛賦注引文章志注解三輔決録又撰古今文章類聚區分為三十卷名曰流别集各為之論辭理愜當為世所重唐志摯虞集十卷資張華傳虞撰官書皆華本以取正華廙傳集經書要事名曰善文行於世隋志總集類文章流别等一百七部二千二百一十三卷六典同總集者以建安之後辭賦轉繁衆家之集日以滋廣晉代摯虞苦覽者之勞倦於是採擲孔翠芟翦繁蕪自詩賦下各為條貫合而編之謂為流别摯虞文章流别集四十一卷梁六十卷志二卷論二卷唐志三十卷謝混流别夲十二卷孔寧續流别三卷唐志杜預善文四十九卷隋志五十卷將史記李斯傳注辨士隱姓名遺秦章邯書在善文中文選注引文章録流别録詩正義引流别論云詩有九言顧凱之有晉文章記晉集苑文苑宋集林唐志謝混集苑六十卷隋志四十五卷孔逭文苑一百卷隋志同又文苑鈔三十卷中興書目孔逭集漢以後諸儒文章今存十九卷賦頌騷銘弔典書表論凡十屬目録有書寫校正官吏姓名題龍朔二年或大中十年蓋唐祕書所藏夲也南史逭會稽人有才藻製東都賦三吳決録隋志劉義慶集林一百八十一卷梁二百卷王唐志二百卷宋臨川義慶撰唐志謝沈名文集四十卷丘遲集鈔四十卷隋志沈約集抄十卷庾自直類文三百七十七卷晉七林枚乘作七發文選注七發者説七事以起發太子猶楚詞七諫之流屬文之士若傳毅劉廣世崔駰李尤桓麟崔琦劉梁馬融張衡作七激興依疑説蠲舉厲辨之篇傅玄作七謨又集七林曹植作七啓并命王粲作張協作七命陸機七證劉劭七華顔延之七繹沈佺期七引唐志卞氏七林集十二卷隋志十卷梁十二卷録二卷卞景撰梁又有七林三十卷音一卷亡謝靈運七集十卷晉江左文章志唐志目録類摯虞文章志四卷宋明帝晉江左文章志二卷沈約宋世文章志二卷沈約傳撰文章志三十卷傅亮續文章志二卷隋志同雜家任昉文章始一卷張績補姚察續文章始一卷書目昉文章緣起一卷凡八十五題世説注多引江左文章志又有丘淵之文章録别集録顧凱之晉文章記文章敘録丘靈鞠著江左文章録序起太興訖元熙魏志注引文章序録摯虞文章志後漢注引文章志梁昭明太子文選唐李善注文選文選辨惑五臣注文選唐續文選擬文選隋志文選三十卷梁昭明太子撰唐志同音三卷蕭該撰唐志十卷唐志李善注文選六十卷又文選辨惑十卷公孫羅注文選六十卷音義十卷五臣注文選三十卷衢州常山尉吕延濟都水使者劉承祖男良處士張銑吕向李周翰注開元六年工部侍郎吕延祚上之曹憲文選音義卷亡康國安注駁文選異義二十卷僧道淹許淹文選音義十卷李雍傳父善淹貫古今不能屬辭人號書簏顯慶中擢崇賢館學士為文選注敷析淵洽表上之賜賚頗渥善釋事而忘意書成以問雍雍不敢對善詰之雍意欲有所更善曰試為我補益之雍附事見義善以其不可奪故兩書並行雍居汴鄭間講授諸生傳其業者號文選學曹憲傳以文選授諸生魏模公孫羅李善傳授其學大興會要顯慶六年正月二十七日右內率府參軍崇賢直學士李善上注文選六十卷藏於祕府文選注表以顯慶三年九月日上望表云昭明太子居肅成而講藝開傳以招賢搴中葉之詞林酌前修之筆海吕向傳嘗以李善釋文選為繁冗與吕延濟劉良張銑李周翰等更為注解時號五臣注中興書目文選昭明太子蕭統集子夏屈原宋玉李斯及漢迄梁文人才士所著賦詩騷七詔册令教表書啓箋記檄難問議論序頌贊銘誄碑志行狀等為三十卷輿何遜劉孝綽等選集李善注析為六十卷集賢注記開元十九年三月蕭嵩奏王智明李元成陳居注文選先是馮光震奉敇入院校文選上疏以李善舊注不精請改注從之光震自注得數卷嵩以先代舊業欲就其功奏智明等助之明年五月令智明元成陸善經專注文選事竟不就唐志孟利貞續文選十一卷卜長福續文選三十卷開元十七年上授富陽尉卜隱之擬文選三十卷開元處士目録類常寶鼎文選著作人名目三卷崇文目文選抄十二卷蘇易簡文選菁英十二卷唐志昭明太子古今詩苑英華二十卷蕭圓文海集三十六卷蕭圓撰文海集四十卷隋杜正藏著文章體式時號文軌梁文心雕龍南史文學傳劉協字彥和天監中兼東宫通事舍人撰文心雕龍論古今文體其序略云云云沈約謂深得文理隋志總集類文心雕龍十卷梁劉協撰唐志文史類史通詞人屬文其體非一譬甘辛殊味丹素異彩後來祖述識昧圓通家有詆訶人相掎托故劉協文心生焉五十篇原道至序志末各系贊唐七十五家總集志丁部總集七十五家九十九部四千二百二十三卷始於摯虞文章流别集杜預善文次以謝沈名文集孔逭文苑梁昭明文選詩苑英華終於劉孝孫古今類聚詩苑三十卷郭瑜古今詩類聚七十九卷歌録集八卷附以文史自李充翰林論至鍾嶸詩評四家四部十八卷總七十九家一百七部不著録七十八家八百一十三卷自李淳風注顔之推稽聖賦至林逢續掌記略文史自劉子玄史通至孫郃文格不著録二十三部一百七十九卷隋志總集一百七部二千二百十二卷晉摯虞作流别作者繼軌并解釋評論總於此篇終於法集國朝志文史魏晉以前尚古文有李充翰林論江左用聲律有顔竣詩例鍾嶸詩品唐以來詩賦有張仲素賦樞范傳正賦訣史官欲明職業有劉氏史通史例總集七十五家若摯虞流别杜預善文謝沈名文集孔逭文苑昭明文選蕭圓文海集康明貞辭苑麗則庾自直類文李德林霸朝雜集蕭淑西府新文要集虞綽類集文苑詞英謝混集苑劉義慶集林丘遲集鈔劉允濟金門待詔集許敬宗文館詞林麗正文苑芳林要覽之類皆集文也昭明古今詩苑英華元嘉宴會千寶百志崔光百國應璩李夔百一伏滔元正宴會顔延之西池宴會齊之清溪釋奠集徐伯陽文會北齊文林詩府以至劉孝孫郭瑜之類聚終於歌集録皆集詩也賦自宋明帝集至綦母邃三京賦音頌自瑞應頌集至靖恭堂頌碑有諸郡碑雜碑論有殷仲堪雜論及設論連珠自謝靈運至陸緬三家讃針銘誡有謝莊等四家書有王履書集夏赤松書林啓表有山濤啓事至薦文集䇿有元嘉䇿及宋伯宜之集七林有卞氏集十二卷及顔之推七悟若小辭林五十三卷集古今帝王正位文章九十卷皆失名氏别集始于荀况宋玉自漢武帝二卷淮南王二卷至揚雄集五卷凡二十一家先漢之文也崔篆一卷東平王蒼二卷至王粲十卷五十七家東漢之文也魏武三十卷至鍾會十卷魏之文也許靖二卷至諸葛二十卷蜀之文也吳自張溫至紀隲晉自宣帝至滕演宋自武帝至袁粲齊自竟陵二十卷至張融玉海六十卷梁始於文帝後魏始於文帝後周陳隋皆有集録唐之文自太宗四十卷至盧藏用三十卷凡一百十六家不著録自玄宗至羅衮皆集也李嶠至皎然皆詩也盧獻卿至李山甫皆賦也陸贄至薛廷圭皆制詞也郭元振至趙璘皆表奏也四六若崔致逺贊若崔融䇿若魏徴至劉蕡判若駱賔王至鄭寬唐三類集録志丁部集録其類有三曰楚辭别集總集凡著録八百一十八家八百五十六部一萬一千九百二十三卷不著録四百八家五千八百二十五卷楚辭自王逸注至道騫音七家七部三十二卷别集自荀况至盧藏用七百三十六家七百五十部七千六百六十八卷玄宗集至鄭寬百道判不著録四百六家五千十二卷别集古人但以名氏命名張融始著玉海之號六十卷總集見上舊志丁部集録三類楚詞别集總集共九百三十一部書一萬一千八百六十二卷右集録楚詞七家帝王二十七家太子諸王二十一家七國趙楚各一家前漢二十家後漢五十家魏四十六家蜀二家吳十四家西晉一百十九東晉一百四十四宋六十南齊十二梁五十九陳十四後魏十北齊四後周五隋十八唐一百十二沙門七婦人七家總集一百二十四家大凡八百九十二部一萬二千二十八卷此與母煚目同隋虞世南等四十人選文章自楚詞訖大業為五千卷號文章總集唐文史四家志文史類四家四部十八卷李充翰林論三卷劉協文心雕龍十卷顔竣詩例録二卷鍾嶸詩評三卷唐搖山玉彩志類書類許敬宗搖山玉彩五百卷孝敬皇帝令太子太師許敬宗司議郎孟利貞崇賢館學士郭瑜顧胤右史董思恭等撰孝敬皇帝傳名弘顯慶元年為皇太子四年加元服龍朔元年命賔客許敬宗右庶子許圉師中書侍郎上官儀中舍人楊思儉即文思殿採摘古今文章英詞麗句以類相從號搖山玉彩凡五百篇奏之帝賜帛三千假餘臣賜有差會要龍朔三年十月一日遣司元大常伯竇德玄進詔藏書府唐芳林要覽志總集類芳林要覽三百卷許敬宗顧胤許圉師上官儀楊思儉孟利貞姚璹竇德玄郭瑜董思恭元思敬集唐麟閣詞英麗正文苑辭苑麗則志雜家麟閣詞英六十卷髙宗時敇撰總集類麗正文苑二十卷許敬宗顧胤等集康顯辭苑麗則三十卷又康明貞二十卷著録唐文館詞林志雜傳記許敬宗文館詞林文人傳一百卷總集類文館詞林一千卷許敬宗劉伯莊等撰崔玄暐訓注文館詞林䇿二十卷梁元帝著詞林三卷會要顯慶三年十月二日許敬宗修文館詞林一千卷上之崔玄暐等訓注垂拱二年二月十四日新羅王金政明遣使請唐禮并雜文章令所司寫吉凶要禮并於文館詞林采其詞涉規戒者勒成五十卷賜之崇文目文館詞林彈事四卷唐珠英學士集志五卷崔融集武后時修三教珠英學士李嶠張説等詩唐金門待詔集志劉允濟十卷唐花蕚集聫珠集志李氏花蕚集二十卷李乂尚一尚貞竇氏聫珠集五卷竇羣常牟庠鞏皆工辭章百義取兄弟若五星然合一首書目一卷唐文府志徐堅文府二十卷開元中詔張説括文選外文章乃命堅與賀知章趙冬曦分門討會詔從之堅乃先集詩賦二類為文府上之餘不能就而罷會要開元十九年二月禮部員外郎徐安貞等撰文府二十卷上之集賢注記燕公初入院奉詔搜括文選外文章别撰一部於是徐常侍及賀趙分部檢討徐等且集詩賦二類獨簡雜文歷年撰成三十卷燕公以所撰非精更加研考及蕭令嵩知院以文選是先祖所撰喜於嗣美十九年嵩為學士知院事奏皇甫彬徐安貞孫逖張環修續文選徐孫所取與常侍相乖别為二十卷張始興嫌其取舍未允其事竟寢志雜家徐陵文府七卷宗道寧注别集類李道古文輿唐麗文集志劉明素麗文集五卷興元中集李吉甫麗則集五卷唐貞觀新書志唐稟三十卷集貞觀以前文章唐太和通選裴潾傳潾嘗裒古今文章以續梁昭明太子文選自號太和通選上之當時文士非與逰者不取世恨其隘志裴潾太和通選三十卷會要太和八年四月集賢學士裴潾上通選三十卷唐古今文集略類表志李吉甫古今文集略二十卷又類表五十卷亦名表啓集書目李吉甫集梁陳訖唐開元歌詩三百二十首為麗則集五卷又集唐人表章箋啓露布等為類表五十卷崇文目唐初表草一卷唐詞圃志類書張仲素詞圃十卷書目張仲素編經傳以字數虛實等類相從為十篇為詞賦之備志孟利貞碧玉芳林四百五十卷玉藻瓊林一百卷劉綺莊集類一百卷集傳記雜事一類者唐西漢文類東漢文類志桞宗直西漢文類四十卷宗元序之類其書不傳宋朝陶叔獻次為四十卷梅堯臣序竇嚴東漢文類三十卷中興書目竇嚴類次後漢書中詔册及羣臣書表章議檄對䇿説問文賦歌詩附以范曄序論隋志梁有漢書文府三卷蕭琛撰唐文章龜鑑志文史類倪宥文章龜鑑一卷孫郃文格二卷唐古今類聚䇿苑志周仁瞻十四卷唐續古今詩苑英華書目十卷唐僧惠淨集梁大同至唐永徽合一百五十四人詩五百四十八首以續劉孝孫古今類聚詩苑雍熙文苑英華會要兼寶訓太平興國七年九月帝以諸家文集其數至繁各擅所長蓁蕪相間乃命翰林學士承旨李昉學士扈蒙直院徐鉉中書舍人宋白知制誥賈黃中吕蒙正李至司封員外郎李穆庫部員外郎楊徽之監察御史李範祕書監丞楊礪著作佐郎吳淑吕文仲胡汀戴貽慶國子監丞杜鎬將作監丞舒雅凡十七人以徽之尤精風雅特命編詩為百八十卷閲前代文章撮其精要以類分之為千卷目録五十卷雍熙三年十二月壬寅書成號曰文苑英華後李昉等相繼改外任續命翰林學士蘇易簡等共成之帝覽之稱善降詔褒諭以書付史館賜器帛各有差景德四年八月丁巳詔三館分校文苑英華以前所編次未盡允愜遂令文臣擇前賢文章重加編録芟繁補缺換易之卷數如舊景德中上謂宰臣曰今方患學者少書誦讀不能廣博文苑英華先帝纘次當擇館閣文學之士校正與李善文選並鏤板頒布庶有益於學者實録雍熙三年十二月壬寅翰林學士宋白等上宋白等表曰席翻經史堂列縑緗咀嚼英腴總覽翹秀撮其類列分以布居使沿泝者得其餘波慕味者接其雅唱上覽而善之詔答曰近代以來斯文浸盛雖述作甚多而妍媸不辨遂令編緝止取菁英所謂擲鸞鳳之羽毛截犀象之牙角書成來上實有可觀宜付史館景德四年八月丁巳命直館校理校勘文苑英華及文選摹印攽行祥符二年十月己亥命太常慱士石待問校勘十二月辛未又命張秉薛映戚綸陳彭年覆校孝宗以祕閣本多舛錯命周必大校讐以進淳熙八年正月二十二日以一百十册藏祕閣淳熙唐登科文選三年正月樂史上登科記三十二卷唐登科文選五十卷崇文目同唐孝悌録十五卷景德西昆酬唱集書目二卷景德中楊億與錢惟演劉筠李宗諤朝逈及同館唱和七言五言律詩二百四十七章祥符唐文粹姚鉉纂百卷祥符四年祀汾隂后土之月集文粹成古賦樂章歌詩贊頌碑銘文論針表傳録書序止以古雅為命不以雕篆為工天禧四年六月鉉子嗣復上之癸巳以嗣復為永城簿朝氏志鉉字寶臣廬州人采唐世文章分門編類初為五十卷後復增廣之為薛映掎其事卒後其子以其書上詔藏內府書目紹興中樊汝霖集唐人文不見於新書傳者五百二十九篇名唐書文藝補六十三卷宋朝集選晏殊集類古今文章為集選二百卷刪次梁陳迄唐楊億集當世述作為筆苑時文録數十編慶厯五年李淑上光祿丞謝曄所編集鑒五月六日賜同出身眺文莊公宗慤以文選續文選藝文類聚初學記文苑英華南北朝洎隋唐人文集美字粹語分百七十有四門十卷名曰文林啓秀宋白類故事十餘門號建章集聖宋文粹書目三十卷又聖宋文選十六卷謝氏蘭玉集書目十卷集謝安而下子孫歷宋齊梁陳凡十有六人詩三百四十餘篇序題吳興汪聞淳熙皇朝文鑑孝宗命著作郎吕祖謙發三館四庫之所藏裒搢紳故家之所録所得文集凡八百家斷自中興以前彚次古賦詩騷典册詔誥表章奏疏針銘贊頌碑記論序書啓雜著以至律賦經義定為一百五十卷凡六十一門承詔於淳熙四年之仲冬庚戌奏御於六年之正月癸未賜名曰皇朝文鑑而命周必大為之序略曰建隆雍熙之間其文偉咸平景德之際其文博天聖明道之辭古熙寧元祐之辭逹祖謙云國初文人尚少故所取稍寬仁宗以後文士輩出故所取稍嚴大雅之詩棫朴官人也旱麓受祖也俱以作人為言蓋魚躍于淵氣使之也追琢其章理貫之也雲漢昭于上豈弟施于下濟濟多士其有不觀感而化者乎先是臨安書坊有江鈿新編文海淳熙四年丁酉十一月命校正刻板壬寅學士周必大召對清華閣奏委館閣官銓擇甲辰以命祖謙因請增損銓次庚戌許之六年正月癸未上對大臣問之祖謙乃以書進二月壬戌除祖謙直祕閣丙午命必大撰序四月辛卯賜名文鑑後别命他官修定而鋟版之議寢孝宗謂采取精詳有益治道朱文公謂此書編次篇篇有意真文忠公德秀集文章正宗以明義理切世用為主又有續文章正宗陸機曰詩緣情而綺靡賦體物而瀏亮碑披文以相質誄纒綿而悽愴銘博約而溫潤針頓挫而清壯頌優遊以彬蔚論精微而朗暢奏平徹以間雅説煒煜而譎誑雖區分之在兹亦禁邪而制放要辭逹而理舉故無取乎冗長韓愈曰將蘄至於古之立言者則無望其速成無誘於勢利飬其根而俟其實加其膏而希其光根之茂者其實遂膏之沃者其光曄仁義之人其言藹如也進學解曰沉浸醲郁含英咀華作為文章其書滿家上規姚姒渾渾無涯周誥殷盤佶屈聱牙春秋謹嚴左氏浮誇易竒而法詩正而葩下逮莊騷太史所録子雲相如同工異曲先生之於文可謂閎其中而肆其外矣栁宗元曰吾每為文章未嘗敢以輕心掉之懼其剽而不留也未嘗敢以怠心易之懼其弛而不嚴也未嘗敢以昏氣出之懼其昧沒而雜也未嘗敢以矜氣作之懼其偃蹇而驕也抑之欲其奧揚之欲其明疏之欲其通亷之欲其節激而發之欲其清固而存之欲其重此吾之所以羽翼夫道也本之書以求其質本之詩以求其恆本之禮以求其宜本之春秋以求其斷本之易以求其動此吾所以取道之原也參之穀梁氏以厲其氣參之荀孟以暢其支參之莊老以肆其端參之國語以慱其趣參之離騷以致其幽參之太史公以著其潔此吾所以旁推交通而以為之文也又曰文有二道辭令褒貶本乎著述導揚諷諭本乎比興著述者流蓋出於書之謨訓易之象繫春秋之筆削比興者流蓋出於虞夏之詠歌殷周之風雅秉筆之士罕有兼者唐興以來稱是選而不怍者陳拾遺子昂其後燕文貞張説以著述之餘攻比興而莫能極張曲江九齡以比興之隟窮著述而不克備汪藻曰古之作者無意於文也理至而文隨之六經之書皆是物也逮左氏屈原始以文章自為一家而稍與經分漢公孫弘董仲舒蕭望之匡衡以經術顯司馬遷相如枚乘王褒以文章著當是時已不能合而為一至後世流别而為六七靡靡然入於流連光景之文其去經逺矣朱熹曰自聖學不傳世之為士者不知學之有本而惟書之讀則所以求於書不越乎記誦訓詁文詞之間以釣聲名干祿利而已是以天下之書愈多而理愈昧學者之事愈勤而心愈放詞章愈麗論議愈髙而其德業事功之實愈無以逮乎古人然非書之罪也讀者不知學之有本而無以為之地也學者稍厭折揚黃荂而窺咸韶之音用三代文章律度當世辭嚴義密追古作者如彈有虞氏之琴鼓清廟之瑟一唱而三歎也大音希聲震越渾鍠如鈞天之奏撞千石之鐘振萬石之虡也大吕徑鳴洪鐘橫撞戞切韶護堯醲舜薰入神出天氣平理夷日星垂而江漢流巨手魁筆磊落相望續典紹謨還雅歸頌凌躒百代直趨三王魁竒偉麗九鼎十鼓震越渾鍠歌周頌魯承詔撰述類書學古貴乎博患其不精記事貴乎要患其不備古昔所専必慿簡䇿綜貫羣典約為成書漢新語見著書類魏皇覽魏志文帝好學黃初中散騎侍郎劉劭等受詔集五經羣書以類相從凡千餘篇號曰皇覽見劭傳撰文帝紀使諸儒集經傳隨類相從魏略常侍王象受詔撰皇覽使象領祕書監象從延康元年始撰集數嵗成藏於祕府合四十餘部部有數十篇通合八百餘萬字史記注引之索隱曰是王象繆襲等撰隋志雜家皇覽一百二十卷繆卜等撰梁六百八十卷何承天合一百二十三卷徐爰合五十卷目四卷梁蕭琛抄二十卷唐志何承天并合皇覽一百二十二卷徐爰并合皇覽八十四卷類事之書始于皇覽韋誕諸人撰建雲臺者非一枝成珍裘者非一掖言集之者衆也晉陸機要覽唐志雜家陸士衡要覽三卷書目一卷機自序云直省之暇乃集要術三篇上曰連璧集其嘉名取其連類中曰述聞實述豫之所聞下曰析名乃搜同辨異也陸機集十卷以文賦為首雲集十卷以逸民賦為首梁華林遍略梁書天監十五年敕太子詹事徐勉舉學士入華林撰遍略勉舉何思澄顧協劉杳王子雲鍾嶼等五人應選八年乃成合七百卷劉峻類苑成凡一百二十卷武帝即命諸學士撰華林遍略以髙之唐志徐勉華林要略六百卷隋志六百二十卷徐僧權等撰隋志唐志同梁劉孝標類苑一百二十卷梁七録八十二卷劉杳壽光書苑二百卷陶弘景著學苑百卷張纘著鴻寶一百卷梁諡法歷代諡法書目沈約諡法十卷案約序大戴禮及世本舊並有諡法而二書傳至約時已亡其篇唯取周書及劉熙諡法廣諡舊文仍采乘奧帝王世紀諡法篇之異者以為此書首列周書二篇闕以熙為本敘次舊文廣諡及乘奧諡法各於其下注本文所出自周迄宋帝王名臣凡有諡者並列其人名號於左方今本卷數存文多舛梁賀琛諡法三卷采舊諡法及廣諡又益以已所撰新諡分君臣婦人三卷卷各分美平惡三等梁書琛精三禮髙祖詔撰新諡法至今施用其條比沈約諡例頗多亦有約載而琛不取者續古今諡法十四卷唐王彥威撰續沈約諡例博采傳記掎托衆流起自南齊迄于唐代錯綜名諡以類相從又分單復其唐帝后諡别為尊諡凡一卷編定六家諡法二十卷判太常寺范鎮同判寺周沆掌禹錫張瓌呂公著王獵同知禮院王瓘吕夏卿李育雍子方禮院編纂姚闢蘇洵等撰取周公春秋廣諡沈約賀琛及扈蒙六家别其同異去其重復刋謬補缺集為一書諡法三卷蘇洵撰嘉祐中采今文尚書汲冢師春蔡雍獨斷加以新意得一百六十八諡三百十一條又為總論一篇辨論三篇以盡去取之意而表上之論四篇今不入此書又見後皇朝諡録二十卷蘇洵撰洵為歷代諡録自周至顯德為皇朝諡録上自祖宗下逮卿相其有議者皆列之於左凡三十五卷今缺歷代諡録十五卷政和修定諡法八十卷蔡攸等修定為六家沿革統論一卷參照六家二十六卷看詳六家三十五卷增立諡法十卷又合是三者著為定諡為修定諡法六卷總目二卷合八十卷上之內參照二十六卷缺蔡攸略去治平中周沆所上者蓋時禁元祐學術以出於蘇洵故也諡法三卷紹興中鄭樵撰梁金海南史武帝撰金海三十卷北齊修文殿御覽唐志祖孝徴等修文殿御覽三百六十卷崇文目同書目有之采托羣書分二百四十部以集之修文殿御覽放天地之數為五十部象乾坤之䇿成三百六十卷書目北齊聖夀堂御覽陽休之傳武平三年與朝士撰聖夀堂御覽隋志雜家三百六十卷陽休之取芳林遍略加十六國春秋六經拾遺録魏史為玄洲苑御覽後改為聖夀堂祖孝徴等又改為修文殿御覽三百六十卷上之唐十七家類書志丙部子録十五曰類書十七家二十四部七千二百八十八卷始於何承天并合皇覽次以徐爰并合皇覽劉孝標類苑劉杳夀光書苑徐勉華林遍略祖孝徴等修文殿御覽虞綽等長洲玉鏡諸葛頴玄門寶海一百二十卷張氏書圖泉海七十卷隋志張式髙士亷等文思博要許敬宗搖山玉彩纍璧東殿新書歐陽詢藝文類聚虞世南北堂書鈔一百七十三卷張太素䇿府五百八十二卷武后玄覽一百卷張昌宗等三教珠英孟利貞碧玉芳林四百五十卷玉藻瓊林一百卷失姓名三家要録六十卷檢事書二百六十卷帝王要覽二十卷不著録者自王義方筆海十卷玄宗事類一百三十卷初學記三十卷及政典通典會要終於劉揚名戚苑纂要袁説戚苑英華凡三十二家一千三百三十八卷崇文目類書四十六部四千六百五十卷始於太平御覽又五十一部八百六十五卷終於搢紳集唐羣書治要志雜家魏徴羣書治要五十卷劉伯莊音五卷會要貞觀五年九月二十七日癸未祕書監魏徴撰羣書理要上之太宗欲覽前王得失爰自六經訖于諸子上始五帝下盡晉年徴與虞世南褚亮蕭德言等成五十卷上之諸王各賜一本實録作政要二書之賜始於儲蕭德言傳太宗欲知前代得失詔魏徴虞世南褚亮及德言裒次經史百氏帝王所以興衰者上之帝愛其書博而要曰使我稽古臨事不惑者公等力也賚賜尤渥李泌事見王政記羣書政要序例俯協堯舜式遵稽古以為六籍紛綸百家踳駁窮理盡性則勞而少功周覽泛觀則博而寡要爰命臣等採托羣書自六經訖諸子始五帝盡晉年凡為五帙合五十卷本求政要故以政要為名並棄春華采秋實庶弘兹九德簡而易從觀彼百王不疾而速太宗覽之稱善敕太子諸王各傳一本賜徴帛二百匹集賢注記天寶十三載十月敇院內别寫羣書政要刋出所引道德經文先是院中進魏文正所撰羣書政要上覽之稱善令寫十數本分賜太子以下鄴侯家傳上曰朕欲知有古政理之要而史籍廣博卒難尋究讀何書而可對曰昔魏徴為太子略羣書之言理道者撰成五十卷謂之羣書理要今集賢合有本又肅宗朝宰相裴遵慶撰自上古已來至貞觀帝王成敗之政謂之王政紀凡六十卷比寫本送臣欲令進獻於先朝竟未果其書見在臣請進之以廣聖聰上曰此尤善也宜即進來於是表獻中興書目十卷祕閣所録唐人墨迹乾道七年寫副本藏之起第十一止二十卷餘不存隋志崔安帝王集要三十卷唐志元氏類集三百卷稹集古今刑政之書唐藝文類聚志歐陽詢藝文類聚一百卷令狐德棻袁朗趙弘智等同修歐陽詢傳武德七年詔與裴矩陳叔逹撰藝文類聚一百卷奏之賜帛二百假會要武德七年九月十七日給事中歐陽詢奉敕撰藝文類聚成上之中興書目一百卷分門類事附見前世詩賦贊頌箋啓之作序曰流别文選専取其文皇覽遍略直書其事唐文思博要文樞祕要志文思博要一千二百卷目十二卷右僕射髙士亷左僕射房玄齡特進魏徴中書令楊師道岑文本顔相時朱子奢劉伯莊馬嘉運許敬宗崔行功吕才李淳風褚遂良姚思廉司馬宅相等奉詔撰貞觀十五年上凡一百二十帙於文思殿名龍朔中許敬宗此撰搖山玉彩會要貞觀十五年六月十五日上詔藏祕閣志同撰人無崔行功李淳風有祕書郎宋正乂餘同文苑英華髙士廉序云精義窮神微言探賾觀書貴要則十家並馳觀要貴博則七略殊致總質文而分流混古今而共轍萬物雖衆可以同類千里雖遙可以同聲頓天網於蓬萊綱目自舉馳雲車於策府轍迹可尋義出六經事兼百氏究帝王之則極聖賢之訓豈止刻石漢京懸金秦市比丘明之作傳侔子長之著書墳素之苑囿文章之江海書目一卷大中十年祕書監楊漢公奏排理亂書得此書一百七十二一卷墨迹今藏于皇朝祕閣乾道七年録副本藏之集庫志目録類尹植文樞祕要目七卷鈔文思博要藝文類聚為之崇文目同崔融請修書表云近代書鈔實繁如華林遍略修文御覽夀光書苑長洲玉鏡及國家新撰藝文類聚文思博要等書唐北堂書鈔志虞世南一百七十三卷崇文目同中興書目一百六十卷虞世南於省後堂集羣書中事可為文用者號北堂書鈔分一百六十門眺氏志云一百七十三卷分八十部八百一類又世南兔園䇿十卷纂古今事為四十八門皆偶儷之語二館舊闕虞世南北堂書鈔惟趙安仁家有夲真宗命內侍取之嘉其好古手詔褒美唐東殿新書志東殿新書二百卷許敬宗李義府奉詔於武德殿內修撰其書自史記至晉書刪其繁辭龍朔元年一作二年上髙宗製序會要顯慶元年十月詔禮部尚書弘文館學士許敬宗等修東殿新書成上曰略看數卷全不似抄撮文書又日月復淺豈不是卿等用意至此因新製序四百八十字舊紀顯慶元年五月己卯進上自製序許敬宗傳自貞觀以後論次諸書自晉盡隋及東殿新書西域圖志姓氏録新禮等數十種劉禕之傳遷右史弘文館直學士上元中與元萬頃等偕召入禁中論次新書凡千餘篇唐纍璧志纍璧四百卷又目録四卷許敬宗等撰龍朔元年上會要龍朔元年六月二十六日中書令許敬宗等撰纍璧六百三十卷上之舊紀龍朔元年六月庚寅進六百三十卷目録四卷隋志梁庾肩吾採璧三卷唐三教珠英志三教珠英一千三百卷目十三卷張昌宗李嶠崔湜閻朝隱徐彥伯張説沈佺期宋之問富嘉謨喬侃貟半千薛曜等撰開成初二年十月辛卯朔改為海內珠英武后所改字並復舊又武后玄覽一百卷會要大足元年十一月十二日麟臺監張昌宗撰三教珠英一千二百卷成上之初聖厯中上以御覽及文思博要等書聚事多未周備遂令張昌宗召李嶠及魏知古于季子王無競沈佺期王適徐堅尹元凱張説馬吉甫元希聲李處正髙備劉知幾房元陽宋之問崔湜韋元旦楊齊哲富嘉謨蔣鳳等二十六人無喬侃白劉禹錫集云珠英卷後列學士姓名蔣鳳衣在選一本吳少微亦預修同撰於舊書外更加佛道二教及親屬姓名方域等部開成二年十月敕改天后朝所撰三教珠英為海內珠英列傳徐彥伯武后撰三教珠英取文辭皆天下選而彥伯李嶠居首朱敬則張易之集名儒撰三教珠英又繪武三思李嶠蘇味道李逈秀王紹宗等十八人像為圖欲引敬則固辭不與世潔其為人張昌宗入禁中論著引李嶠等三十六人撰三教珠英徐堅與徐彥伯劉知幾張説等與修三教珠英時張昌宗李嶠總領彌年不下筆堅與説専意撰綜條彚粗立諸儒因之乃成書李適修三教珠英與劉允濟在選志總集有珠英學士集五卷崔融集學士李嶠張説等四十七人詩總二百七十六首唐初學記志初學記三十卷張説類集要事以教諸王徐堅韋述余欽施敬本張烜李鋭孫季良等分撰唐平臺祕略王勃傳沛王聞其名召為府修撰論次平臺祕略書成王愛重之集序云撰平臺鈔略十篇書就賜帛五十匹文苑英華有論有贊論十首孝行正修文藝忠武益政尊師褒容幼俊規諷慎終唐白氏經史事類志三十卷白居易一名六帖書目白居易以天地事分門類為聲偶而不載所出唐十九部書語類志類書是光乂十卷開元祕書監正字上授集賢院修撰後賜姓齊集賢注記開元二十二年十一月祕書正字是光乂上十九部書語類敇留院修撰崇文目十卷舊史鄭浣撰經史要録成文宗以十九書語類發問見録類建隆新撰名臣事迹四年十月戊午吏部尚書張昭上新撰名臣事迹五卷詔藏之書府昭傳云所著嘉善集五十卷名臣事迹五卷太平興國太平御覽太平廣記實録太平興國二年三月戊寅詔翰林學士李昉扈蒙左補闕知制誥李穆太子少詹事湯悅太子率更令徐鉉太子中允張洎左補闕李克勤右拾遺宋白太子中允陳鄂光祿寺丞徐用賔太府寺丞吳淑國子寺丞舒雅少府監丞吕文仲阮思道等十四人同以前代修文御覽藝文類聚文思博要及諸書分門編為一千卷又以野史傳記小説雜編為五百卷八年十一月庚辰詔史館所修太平總類一千卷宜令日進三卷朕當親覽焉自十二月一日為始宰相宋琪等言曰天寒景短日閲三卷恐聖躬疲倦上曰朕性喜讀書頗得其趣開卷有益豈徒然也因知好學者讀萬卷書非虛語耳十二月庚子書成凡五十四門書目云雜采經史傳記小説自天地事物迄皇帝王霸分類編次詔曰史館新纂太平總類一千卷包括群書指掌千古頗資乙夜之覽何止名山之藏用錫嘉稱以傳來裔可改名太平御覽戊申上於禁中讀書一云清心殿自巳時至申時始罷有蒼鸛一作鶴自上始開卷飛止殿鴟尾逮掩卷而去上怪之以語近臣宰相宋琪對曰此上好學之感也昔楊震方講間有鸛雀銜三鱣魚墮於庭亦同其應會要先是帝閲類書門目紛雜遂詔修此書興國二年三月詔昉等取野史小説集為五百卷五十五部天部至百卉三年八月書成號曰太平廣記二年三月戊寅所集八年十二月庚子成書六年詔令鏤版廣記鏤本頒天下言者以為非學者所急墨板藏太清樓二書所命官皆同唯克勤用賔思道改他官續命太子中允王克正董淳直史館趙鄰幾預焉淳化太平雜編二年八月癸酉參政張齊賢獻太平雜編二卷崇文目卷同付史館所涉歷聞見及賦詠皆編類之景德册府元龜景德二年九月丁卯命資政殿學士王欽若知制誥楊億修歷代君臣事迹欽若等奏請直祕閣錢惟演刁衎龍圖閣待制杜鎬戚綸直集賢院李維直史館王希逸陳彭年薑嶼陳越太子右贊善大夫宋貽序同編修初令惟演等各撰編目送欽若暨億參詳欽若等又自撰集上用欽若等所撰為定有未盡者奉旨增之又令內臣劉承圭劉崇超典其事編修官供帳飲饌皆異常等俄又令祕書丞陳從易校理劉筠同編修又直館查道太常博士王曉未成又增直集賢院夏竦職方司外郎孫奭注撰音義三年四月丙子四年八月壬寅車駕再幸編修之所再閲門類楊億悉以條對編次未及倫理者改正之帝曰朕編此書蓋取著歷代君臣德美之事為將來取法至於開卷覽古亦頗資於學者皆命從官坐賜編修官器幣王欽若以南北史有索虜島夷之號欲改去王旦曰舊史文不可改趙安仁曰杜預注春秋以長厯推甲子多誤亦不敢改但注云日月必有誤乃詔欲改者注釋其下凡所録以經籍為先億又以羣書中如西京雜記明皇雜録之類皆繁碎不可與經史並行今並不取止以國語戰國䇿管孟韓子淮南子晏子春秋吕氏春秋韓詩外傳與經史俱編歷代類書修文殿御覽之類采托銓擇凡三十一部部有總序千二百四門門有小序初撰篇序諸儒皆作帝以體例不一祥符元年二月丙午遂擇李維等六人撰訖付楊億竄定五月甲申手札詔凡悖惡之事及不足為訓者悉刪去之日進草三卷帝親覽之擲其舛誤多出手書詰問或召對指示商略三月丁卯詔或有增改事標記覆閲之二年十月丁未手札令欽若等書名其增損悉書之凡八年而成之六年八月十三日壬申欽若等以獻進表曰推明凡例分别部居皆仰稟於宸謨惟奉遵於成憲刋除非當櫽括無遺每煩乙夜之覽觀率自清衷而裁定昔甘露石渠止於議奏開元麗正徒有使名矧皇覽博要之言玉鑑珠英之作但詞林之見采非治本之宜先洪惟上聖之能獨出百王之首崇政殿進呈凡千卷目録十卷音義十卷詔題曰册府元龜御製序序曰太宗皇帝始則編小説而成廣記纂百氏而著御覽集章句而製文苑聚方書而撰神醫次復刋廣疏於九經校闕疑於三史修古學於篆籀總妙言於釋老洪猷丕顯能事畢陳朕遹遵先志肇振斯文載命羣儒共司綴緝粵自正統至于閏位君臣善迹邦家美政禮樂沿革法令寬猛官師論議多士名行靡不具載用存典刑凡勒成一千一百四門門有小序述其指歸分為三千一部部有總序言其經制凡一千卷祥符八年十二月乙丑欽若等上版本宴編修官上作詩一章賜令屬和一本云景德四年九月戊辰上謂輔臣曰所編君臣事迹蓋欲垂為典法異端小説咸所不取觀所著篇序援據經史頗盡體要而誡勸之理有所未盡也欽若等曰自纘集此書發凡起例類事分門皆上稟聖意授之羣官間有凝滯皆答陳論今蒙宣諭動以懲勸為本埀世之急務也十月癸亥上謂輔臣曰朕每因暇日閲君臣事迹草本遇事簡則從容省覽事多或至夜漏二鼓乃終卷編修官自王欽若陳彭年至劉筠十一人貽景德二年奉敕編修楊億至宋序七人天禧四年閏十二月癸丑賜輔臣各一部景祐四年二月甲子賜御史臺帝王部一百二十八門閏位七十八門僭偽三十七門列國君四十門儲宫十七門宗室四十二門外戚二十三門宰輔四十一門將帥一百六門臺省二十九門邦計二十九門憲官十五門諫諍六門詞臣八門國史十三門掌禮九門學校十五門刑法九門卿監十五門環衛九門銓選八門貢舉十門奉使十七門內臣十六門牧守四十二門令長二十一門宫臣十一門幕府十六門陪臣二十一門總録二百四十一門外臣三十四門唐志類書有張大素䇿府五百八十二卷祥符彤管懿範八年閏六月庚辰樞密使王欽若上奉詔編修后妃事迹七十七卷崇文目類書類七十卷賜名彤管懿範大約如册府元龜凡六部百四十門詔欽若撰序先是元年詔婦人事别為一書九月丙寅欽若上所撰序又見宗戚類乾興天和殿御覽邇英要覽乾興初命翰林侍讀學士晏殊等於册府元龜中掇其善美事得其要者四十卷為二百一十五門書目天聖中撰崇文目四十卷名曰天和殿御覽天和殿禁中藏書之所因為名仁宗嘗謂輔臣曰天和殿御覽可命校定模本刋行之因言朕聼政之暇於舊史無所不觀思考歷代治亂事迹以為監戒晏殊序曰上稽雅誥下采信書削糟粕之繁撮丹青之要實録天聖二年五月甲寅內出天和殿御覽四十卷隋書八十五卷下祕閣鏤板丁度傳著邇英聖覽十卷龜鑑精義三卷編年總録八卷寶元詩苑類格二年翰林學士李淑承詔編為三卷上卷首以真宗御製八篇條解聲律為常格别二篇為變格又以沈約而下二十二人評詩者次之中卷敘古詩雜體三十門下卷敘古人體製别有六十七門國朝類要范師道撰國朝類要一十二卷雜抄皇朝歷代事實分類為三百六十四門晏殊類要七十四篇開禧二年正月晏帙上之勒成一百卷列為二千六十一門書目七十七卷曽鞏序云七十四篇今多三篇崇文目十五卷嘉祐編定諡法七家諡法諡起於今文周書諡法篇汲冡有周公諡法書目一卷即汲冢周書諡法篇也春秋諡法廣諡沈約賀琛扈蒙六家之書蔡雍獨斷所載止四十六自劉乘沈賀之書諡法乃備太平興國八年八月辛亥詔增周公諡法五十五字命學士扈蒙等詳定其沈約賀琛續廣諡廢不行美諡七十一字為百字平諡七字為二十字惡諡十七字為三十字嘉祐六年十月壬午禮院言雍熙中所定字多舛誤請重修於是蘇洵編定六家諡法自周公以來記為三十五卷政和三年十月王禹得言奉常諡法自周公而下凡六家總二十卷請修成一書六年十二月成八十卷六家舊書凡取四百六十二條修一百五十九條刪九百二條增立一百十七條總二百七十九諡八百三十九條己丑詔行之唐六典注舊有周官諡法大戴禮諡法又漢劉熙注一卷晉張靖撰兩卷又有廣諡一卷至梁沈約總集凡有一百六十五條南史裴子野附益諡法一卷沈約諡例序云周書諡法一第五十六諡法二第五十七今汲冢書止一篇第五十四書目一卷唯崇文目有之學者就汲冢書採出春秋諡法一卷學者就杜預釋例諡法篇採出沈約案諡法上篇卷前云禮大戴記後云周書諡法第四十二又云凡有一百四十五諡案大戴禮及世本舊並有諡法今檢十許本皆無周書諡法一第五十六諡法二第五十七上篇有十餘諡下篇唯有第目無諡名與前所云第四十二又不同矣今諡法二篇有一百四十八名卷後又云靖按諡有一百九十四又云髙光明章和順沖七諡諡法無也而漢家用之約又檢二篇唯無光耳其餘並有而又多不同約又案靖應是張靖晉江左人也劉熙注諡法唯有七十六名所闕甚多或有異名殊號近世所不用耶又有廣諡一篇七十八諡與舊文多同時有異耳約以為同是一諡而互出諸篇不相比次難為尋覽劉熙既有注解時或有所發明今以熙所撰為本又舊文二篇廣諡一卷悉少拔次第令名相隨各於其下注本文所出又自周氏以來迄于宋末帝王名臣凡有諡者並列其人名號於所諡之左方吳興人乘奧撰帝王世記其一篇是諡法今採其異者蘇洵總論曰嘉祐六年七月詔修禮書十月詔古諡法有不可用者以屬修書之吏臣洵實典其事按始論諡者起於今文周書諡法之篇今文既以鄙野不傳其諡法之上篇獨存又簡略不備諸儒所傳又有周公春秋廣諡沈約賀琛扈蒙六家之書周公春秋為名尤古然條貫尤為雜亂而不精廣諡又疏略而不盡獨沈約賀琛紀綱粗備然琛好加以己意務為多而無窮扈蒙最後出酌取諸家簡而不精六書之中稍近古而可據者莫如沈約然亦非古之諡法約言之詳矣其最舊者見於世本大戴禮而約之時已不見於其書約徒得劉熙乘奧之所增廣今隋唐志作帝王本紀隋書又作來奧未知孰是與廣諡以為據依不聞有所謂周公春秋者也琛又因約而加之以其意今周公春秋之法往往反取琛之新法而載之其書至王彥威蘇冕之書因前人之法附世人之諡非有他也賈山有言古者聖王作諡不過三四十世而蔡雍獨斷所載亦不過四十有六臣受詔之三年二月而諡法乃定凡一百六十有八沈約為諡例記周已來帝王公卿之諡至宋而止王彥威繼之至唐而止賀琛之法有君諡臣諡婦人諡離而為三今取而合之婦人有諡自周景王之穆后始匹夫有諡自東漢之隱者始宦者有諡自東漢之孫程始蠻夷有諡自東漢之莎車始自周公以來籍而記之為三十五卷善者可以勸惡者可以懼善惡之失當者可以長歎息也宋敏求集類國朝諡幾二百人孫緯纂元豐後三百餘人為集諡總録一卷自宗室宰相以下分為九等七家諡法周公賀琛春秋扈蒙廣諡蘇洵沈約自有諡法以來至治平禮院書成始有所去取而論定慶元五年太社令龔頥正會粹六家增入蘇洵揭本字其上列為旁通其義有無分注于下離為八卷名七家諡法總括卷一諸家序篇諡論表二君美十九字君臣美三十三字后附十八三臣美上五十九字后附九四臣美下八十五字五君惡二十一字君臣平四字六臣惡一百五字七婦人美六十字婦人惡二十八字八通用四十四字諸家通二百六十七字嘉佑所定一百九十八字蘇洵曰周公之書文尤繁雜不經春秋次之比周公甚簡而微為不亂廣諡最簡比二書差為齊一沈約所取以成書約採諸家其書最詳賀琛因而增之尤詳備而皆病於無所去取扈蒙新書其意妄偽反為五家之所非笑李璧曰名周公者即汲冢周書諡法篇名春秋者即杜預釋例諡法篇唐及國史藝文志皆不載意近世學者就二書中采出元祐邇英要覽慶厯元年八月乙酉詔兩制檢閲唐書紀傳君臣事迹近於治道者日録一兩條上之以學士蘇紳言唐憲宗令近臣具前代得失之迹繪圖以備觀覽也元祐二年十一月壬申詔講讀官遇不開講日具漢唐故事有益政體者二條進入從蘇頌之請也頌每進可為規戒有補時政者述以已意反復言之四年三月甲戌三日吏部尚書兼侍讀蘇頌等奏臣等撰進漢唐故事得旨分門編修成册進呈詔以邇英要覽為名六月六日頌等進呈凡二十卷自修身至禦戎六十門元祐三年十月講讀官顔復范祖禹趙彥若孫覺李常蘇軾蘇頌孫固等奉旨撰建炎四年八月四日令侍從一員日進前代本朝故事關涉治體者一兩事從謝克家之言也後止命講讀官翰苑兩省進紹興中興備覽中興要覽六年十月庚戌右僕射張浚入見上嘗召對便殿問所宜為且命以所聞見置䇿來上浚承命條列以進號中興備覽凡四十一篇莫不備具自議征伐至議聽言之難上深嘉歎置之坐隅諸臣奏議云五年十二月上八年二月戊午夔州教授李昌言應詔撰成中興要覽十篇自始至終行之將永享治安不止恢復而已詔投進乾道翰苑羣書乾道間洪遵纂唐李肇翰林志元稹承旨學士院記韋處厚學士記韋執誼翰林院故事楊巨學士院舊規丁居晦壁記本朝李昉禁林燕會集錢惟演金坡遺事眺逈别書金坡遺事李宗諤雜記蘇易簡續志蘇耆次續志沈該中興翰苑題名及學士年表翰苑遺事不著名氏粹為一書凡三卷小説九百比虞初之聿成奏牘三千效東方而為獻藝文類聚會粹小説則失之雜羣書理要事止興衰則病乎簡修文御覽門目紛錯又不足觀矣玉海卷五十四
