body:
  text: 玉海卷一百二十八宋王應麟撰官制儲官訓導東宫事附賈誼作保傅傳其言有曰天下之命繫於太子太子之善在於早諭教與選左右教得而左右正則太子正太子正而天下定矣此天下之至言萬世不可易之定論也至論教諭之方必以孝仁禮義為本而條目之詳至於容貌詞氣之微衣服器用之細纎悉曲折皆有法度一有過失則史書之䇿宰徹其膳而又有進善之旌誹謗之木敢諫之鼓瞽史誦詩工誦針諫士傳民語必使至於化與心成中道若性而猶不敢怠其選左右之法則有三公之尊有三少之親有道有充有弼有承上之必得周公太公召公史佚之流乃勝其任下之猶必取孝悌博聞有道術者不幸一有邪人厠其間則必逐而去之是以太子朝夕所與居處出入左右前後無非正人未嘗見一惡行此三代之君所以有道之長也當誼之時已病此法之不備然考孝昭之詔猶知誦習誼之所言而不忘先王之意降及近世帝王教子之法益疏略矣周三公三少二傅四輔漢賈誼傳新書大戴禮保傅篇同昔者成王幼在襁褓之中召公為太保周公為太傅太公為太師保保其身體傅傅之德義師道之教訓此三公之職也於是為置三少皆上大夫也曰少保少傅少師是與太子宴者也故乃孩提有識三公三少因明孝仁禮義以道習之逐去邪人不使見惡行於是皆選天下之端士孝悌博聞有道術者以衛翼之使與太子居處出入故太子乃生而見正事聞正言行正道左右前後皆正人也及既冠成人免於保傅之嚴則有記過之史徹膳之宰云云文王世子凡三王教世子必以禮樂禮樂交錯於中發形於外是故其成也懌恭敬而溫文立太傅少傅以養之欲其知父子君臣之道也太傅審父子君臣之道以示之少傅奉世子以觀太傅之德行而審喻之太傅以身教少傅以言教太傅在前少傅在後在學時入則有保出則有師燕居出入時是以教喻而德成也以有四人維持之師也者教之以事而喻諸德者也天下無事外之德保也者慎其身以輔翼之而歸諸道也天下無身外之道記曰虞夏商周有師保有疑丞設四輔及三公不必備唯其人語使能也君子曰德德成而教尊教尊而官正官正而國治世子之記曰朝夕至于大寢之門外云云大戴禮保傅篇明堂之位曰篤仁而好學多聞而道順天子疑則問應而不窮者謂之道道者導天子以道者也常立於前是周公也誠立而敢斷轉善而相義者謂之充充者充天子之志也常立於左是太公也潔廉而切直正過而諫邪者謂之弼弼者弼天子之過者也常立於右是召公也博聞強記捷給而善對者謂之承承者承天子之遺忘者也常立於後是史佚也故成王中立而聽朝則四聖維之是以慮無失計舉無過事殷周之長久其輔翼天子有此具也注立道於前處承於後置充於左列弼於右順名義也道者有疑則問或謂之疑充者輔善或謂之輔通典太子師保二傅殷周已有太傅少傅也後漢楊終傳禮制人君之子年八嵗為置少傅教之書計以開其明十五置太傅教之經典以道其志樊準傳上疏曰賈誼有言人君不可以不學故雖成王賢主崇明師傅唐于志寧傳周王升儲見正毛畢漢帝居震取資黃綺姬旦抗法於伯禽賈生陳事於文帝莫不殷勤於端士懇切於正人周世子齒於學學正父師文王世子仲尼曰昔者周公攝政踐阼而治抗世子法於伯禽使之與成王居欲令成王之知父子君臣長幼之義也行一物而三善皆得者唯世子而已其齒於學之謂也故世子齒於學國人觀之曰將君我而與我齒讓何也曰有父在則禮然然而衆知父子之道矣其二曰有君在則禮然然而衆著於君臣之義矣其三曰長長也然而衆知長幼之節矣父子君臣長幼之道得而國治語曰樂正司業父師司成一有元良萬國以貞世子之謂也文王世子又云其登餕獻受爵則以上嗣文選王融曲水詩序入虎闈而齒胄李善注蔡雍明堂月令論曰周官有門闈之學周禮諸子下大夫二人掌國子之倅國有大事則帥國子而致於太子唯所用之郊特牲天子之元子士也天下無生而貴者也晉閻瓚云按古典太子居以士禮與國人齒周庶子官又見宗官類燕義周天子之官有庶子官注庶子猶諸子也周禮諸子之官司馬之屬職諸侯卿大夫士之庶子之卒掌戒令教治别其等正其位國有大事則率國子而致於太子唯所用之凡國之政事國子存遊卒使之修德學道春合諸學秋合諸射以考其藝而進退之夏官諸子下大夫二人注或曰庶子燕禮有庶子官疏天子謂之諸子諸侯謂之庶子文王世子古者庶子之官治而邦國有倫衆鄉方矣康誥外庶子訓人注在外掌衆子之官主訓民者疏即周官云諸子文王世子云庶子也以致教諸子故為訓人周禮諸子之官亦是王朝之臣言在外者對父子兄弟為外惟舉庶子之官者以其教訓公卿子弟最為急也鄭玄以訓人為師長晉太傅楚師保傅諸侯世子晉語羊舌肸習於春秋以為太傅平公文公謂胥臣曰吾使陽處父傅歡也其能善之乎曰是在歡也昔文王在傅弗勤處師不煩事王不怒敬友二虢而惠慈二蔡及其即位也詢于八虞而咨于二虢度于閎夭而謀于南宫諏于蔡原而訪于辛尹重之以周召畢榮是則文王匪專教誨之力也賈誼新書周文王使太公望傅太子發楚語鍾儀曰其為太子也師保奉之以朝于嬰齊而夕于側也共王莊王使士亹傅太子葴恭王名曰賴子之善善之也對曰夫善在太子問於申叔時叔時曰教之春秋教之世教之詩禮樂教之令教之語教之故志教之訓典教備而不從者非人也秦亦有太子師傅趙使周紹傅王子曰詩云立傅以行教少以學義之經也漢太子太傅少傅家令門大夫先馬中庶子舍人侍講詹事表太子太傅少傅古官屬官有太子門大夫庶子應劭曰皆員五人秩六百石中燕禮獻庶子于阼階上注世子之官也史記虢有庶子秦中庶子蒙環濟要略曰庶子主宫中授八次八舍之職并諸吏之適子及支庶版籍先馬張晏曰員十六人秩比謁者如淳曰前驅也國語句踐親為夫差先馬或作洗舍人詹事秦官掌皇后太子家有丞應劭曰詹省也給也臣瓚曰茂陵書秩真二千石師古曰皇后太子各置屬官有太子率更家令丞僕中盾衛率厨廏長丞張晏曰太子稱家故曰家令臣瓚曰茂陵中書家令秩八百石應劭曰中盾主周衛徼道秩四百石如淳曰漢儀注衛率主門衛秩千石師古曰掌知漏刻故曰率更以上皆太子之官續志太子太傅職掌輔導太子禮如師不領官屬選注引應劭漢官儀曰太子太傅琢磨玉質宋志後漢省詹事太子官屬悉屬少傅而太傅不復領官屬少傅二千石以輔導為職悉主太子官屬漢官曰員吏十二人門大夫六百石漢官曰門大夫二人選四府掾屬職比郎將舊有左右户將别主左右户直郎建武以來省之庶子四百石無員如三寺中郎洗馬比六百石員十六人職如謁者太子出則當直者在前導威儀選郎中補書輿服志尚陳忠奏門大夫職如諫大夫洗馬職如謁者故皆服其服先帝之舊也門大夫冠兩梁進賢洗馬冠髙山舍人秩二百石無員更直宿衛如三寺郎中漢官曰十三人選良家子孫中庶子六百石五人職如侍中率更令一人千石主庶子舍人更直職似光祿家令一人千石主倉榖飲食職似司農少府朝錯傳注臣瓚曰茂陵中書太子家令秩八百石僕一人千石主車馬職如太僕中盾一人四百石主周衛徼循哀帝由定陶王為太子數遣中盾請問近臣注盾讀曰允衛率一人四百石主門衛廏長一人四百石主車馬倉令一人六百石主倉榖食官令一人六百石主飲食並屬少傅凡初即位未有太子官屬皆罷唯舍人不省領屬少府太傅叔孫通張相如石奮慶衛綰丙吉蕭望之嚴彭祖疏廣卜式黃霸林尊師丹夏侯勝韋元成後漢張湛張佚王丹杜喬少傅留侯王臧疏廣受周堪張談匡衡夏侯建千秋後漢桓榮焉張興王丹家令朝錯疏受以賢良舉洗馬汲黯孝景時為太子洗馬以嚴見憚司馬安中庶子史丹元帝為太子時王商以肅敬稱馮野王金敞歐陽地餘以書授太子劉軼昆之子永平中庶子王生蕭育傅喜舍人周仁朝錯鄭當時公孫賀聞人通漢以舍人論石渠董賢侯霸成帝時袁良平帝時淳于恭子孝肅宗時袁敞黃瓊詹事宋畸竇嬰壺遂深中篤行孔霸馬宫鄭莊韋賢許商門大夫朝錯孟但廣川受易為太子門大夫金欽舉明經為門大夫惠帝紀太子御驂乘賜爵五大夫舍人滿五嵗二級列傳張良上謂子房強卧傅太子上欲易太子良及叔孫太傅諫不聽及宴置酒太子侍四人者從太子年皆八十餘須睂皓白衣冠甚偉上乃驚曰煩公幸卒調護太子吳張儼曰髙祖初基引張良叔孫通出為師保入與朝政梁明山賓等曰昔漢惠為太子髙祖因敕蕭曹張陳同吾時人皆加殊敬石奮文帝選可為傅者皆推奮為太子太傅張歐孝文時以治刑名侍太子朝錯受尚書伏生所詔以為太子舍人門大夫遷博士上書言皇太子所讀書多矣而未深知術數願擇聖人之術可用今世者以賜太子上善之於是拜太子家令太子家號曰智囊服虔曰太子稱家疏廣地節二年立皇太子選丙吉為太傅廣為少傅遷太傅平恩侯白使其弟舜監護太子家上以問廣曰太子國儲副師友必天下英俊不宜獨親外家且太子自有太傅少傅官屬已備今復使舜護太子家視陋非所以廣太子德於天下也上善其言順帝立太子居承光宫以侍御史种皓監護疏受以賢良舉為太子家令好禮恭謹敏而有辭宣帝幸太子宫受迎謁應對及置酒宴奉觴上夀辭理間雅上甚歡恱頃之拜為少傅太子每朝因進見太傅在前少傅在後父子並為師傅朝廷榮之在位五嵗皇太子年十二通論語孝經遂上疏乞骸骨歸觀者皆曰賢哉二大夫嚴彭祖遷太傅廉直不事權貴蕭望之為太傅以論語禮服授皇太子元帝詔曰國之將興尊師而重傅望之傅朕八年道以經術厥功茂焉周堪為少傅以孔霸為太中大夫授太子張敞元帝即位鄭朋薦敞先帝名臣宜傅輔太子上以問蕭望之望之以敞非師傅之器王褒宣帝令褒等虞侍太子朝夕讀誦竒文史丹元帝以丹舊臣皇考外屬詔丹護太子家贊曰丹之輔道副主掩惡揚美雖宿儒達士無以加焉儒林傳平帝時增元士之子得受業如弟子嵗課乙科二十人為太子舍人袁良平帝時舉明經為太子舍人後傳班彪建武十九年東宫初建師保多闕彪上言漢興太宗使鼂錯道太子以法術賈誼教梁王以詩書及至中宗亦令劉向王褒蕭望之周堪之徒以文章儒學保訓東宫以下莫不崇簡其人就成德器今皇太子雖結髮學問而傅相未置賢才宜博選名儒有威重通政事者以為太子太傅東宫及諸王國備置官屬舊制太子食湯沐十縣設周衛交戟五日一朝因坐東箱省視膳食其非朝日使僕中允旦旦請問而已明不媟黷廣其敬也上納之桓榮建武十九年顯宗始立為皇太子選求明經擢榮弟子豫章何湯為虎賁中郎將以尚書授太子世祖問湯本師為誰曰沛國桓榮帝即召榮令説尚書甚善之拜為議郎賜錢十萬使入授太子帝常令榮止宿太子宫積五年榮薦門下生九江胡憲侍講乃聽得出旦一入而已榮嘗病太子朝夕遣中傅問病後愈復入侍講二十八年大會百官詔問誰可傅太子者皆言太子舅隂識可博士張佚正色曰今陛下立太子為隂氏乎為天下乎帝稱善曰置傅以輔太子也今博士不難正朕況太子乎即拜佚為太子太傅而以榮為少傅賜以輜車乘馬張興習梁丘易永平十年拜太子少傅顯宗數訪問經術桓焉安帝永寧中為太子少傅贊曰父子兄弟代作帝師漢授太子經侍講儒林傳武帝詔太子受公羊春秋太子既通復私問榖梁而善之列傳蕭望之為太傅以論語禮服授皇太子歐陽髙孫地餘以太子中庶子授太子尚書孔霸宣帝時為大中大夫以選授皇太子經霸治尚書遷詹事元帝即位以師賜爵號褒成君張禹初元中立皇太子而博士鄭寬中以尚書授太子儼然總五經之眇論立師傅之顯位谷永云薦言禹善論語詔令禹授太子論語後傳劉昆受施氏易建武二十三年為光祿勳令入授皇太子及諸王小侯五十餘人子軼傳昆業永平中為太子中庶子桓榮弟子何湯以尚書授太子世祖復召榮令説尚書榮薦門下生胡憲侍講榮為少傅以太子經學成畢上疏謝曰臣師道已盡皆在太子謹遣掾臣汜再拜歸道太子報書曰莊以童蒙學道九載而典訓不明云云三十年拜為太常顯宗即位尊以師禮乘輿嘗幸太常府令榮坐東面設几杖會百官東平王蒼以下及榮門下數百人天子親自執業每言輒曰太師在是鍾興受嚴氏春秋光武召見問以經義善之遷左中郎將詔令定春秋章句去其復重以授皇太子又使宗室諸侯從興受章句封關內侯興以無功不受帝曰生教訓太子及諸王侯非大功邪興曰臣師丁恭於是復封恭興終不受爵郅惲光武令惲授皇太子韓詩侍講殿中包咸舉孝廉為郎中建武中入授皇太子論語又為其章句永平五年遷大鴻臚每進見錫以几杖經傳有疑輒遣小黃門就舍質問顯宗以咸有師傅恩而素清苦常特賜珍玩子福拜郎中亦以論語入授和帝鄭衆建武中皇太子及山陽王因梁松以縑帛聘衆欲為通義引籍出入殿中衆辭不受桓郁榮子以虎賁中郎將永平十五年入授皇太子經遷越騎校尉詔敕太子諸王各奉賀致禮郁數進忠言多見納録張酺字孟侯永平九年置五經師酺以尚書教授數講於御前除為郎賜車馬衣裳遂令入授皇太子為人質直守經義每侍講間隙數有諫正之辭以嚴見憚太子家時為奢侈物未嘗不正諫酺出後帝每見諸王師傅常言張酺前入侍講屢有諫正誾誾惻惻有史魚之風元和二年幸東郡引酺及門生並會庭中帝先備弟子之儀使酺講尚書一篇而後修君臣之禮召馴建初元年以韓詩遷騎都尉侍講肅宗拜左中郎將入授諸王帝嘉其義學曹騰侍皇太子書漢思賢苑文帝博望苑武帝龍樓門見後漢保傅傳又見前見傳類新書有傅職保傅容經胎教四篇大戴禮之保傅蓋錯出諸此蔡雍明堂論引禮記保傅篇漢皇太子生賦洞簫賦見前枚臯傳武帝春秋二十九乃得皇太子羣臣喜臯與東方朔作皇太子生賦及立禖祝生禖作賦步障裁詩並太子生日事魏陳王植皇子生頌夏侯元皇嗣賦見初學記漢四章歌詩崔豹古今注日重光月重輪羣臣為漢明帝所作也明帝為太子樂人作歌詩四章以贊太子之德一曰日重光二曰月重輪三曰星重輝六帖作山重暉四曰海重潤漢未其二章亡舊説云天子之德光明如日規輪如月衆輝如星沾潤如海太子皆比德焉故云重梁劉孝威重光詩戴皓月重輪行漢太子謁廟輿服志安帝立皇太子太子謁髙祖廟世祖廟門大夫從冠兩梁進賢洗馬冠髙山侍御史任方奏請非乘從時皆冠一梁不宜以為常服事下有司尚書陳忠奏門大夫職如諫大夫洗馬職如謁者故皆服其服先帝之舊也方言可寢奏可謁者古者一名洗馬魏贊述太子賦魏志注魏略曰卞蘭獻賦贊述太子德美太子報曰作者不虛其辭受者必當其實此賦豈吾實哉藝文類聚載贊述太子賦曰著典憲之髙論作敘歡之麗詩道無深而不測術無細而不敷乃作頌曰明明太子既睿且聰博聞強記聖思無雙猗之左右如虎如龍八俊在側旁無諛凶研精書籍留思異同表曰所作典論及諸賦頌沈思泉涌華藻雲浮博納多容海渟嶽峙梁蕭曄獻儲德頌魏二傅四友漢魏故事太子於二傅執弟子禮文帝為太子涼茂為太傅何夔為少傅謂之二傅六典注魏置太子文學魏武為丞相司馬懿為文學掾與陳羣吳質朱鑠並為世子所信號為太子四友吳太子登四友左輔諸葛恪右弼張休輔正顧談翼正陳表梁簡文居監撫安陸侯曅與新渝映建安闕南浦推並預密宴號東宫四友魏文帝在東宫太祖曰荀公達人之師表當盡禮敬太子獨拜牀下晉華常以選為太子賓友漢任疏廣晉選山濤少傅晉二傅六傅紀兼傳武帝泰始三年正月丁卯立皇子衷為皇太子惠帝三月丁未以李喜為太子太傅魏明帝以後久曠東宫制度廢闕詹事左右率庶子中舍人諸官並未置唯置衛率令典兵二傅并攝衆事晉初東宫不置詹事事由一傅命諸公居之太康初衛瓘以司空領少傅傅任愷為少傅護太子針山濤少傳齊王攸太獻針傅玄有少傅惠帝太熙元年八月壬午立廣陵王遹愍懷太子為皇太子愍懷建宫備六傅之職何劭為太子太師避景帝諱改為帥王戎太傅楊濟太保裴楷少師楊珧少傅一作張華為少傅和嶠少保晉公卿禮秩曰時號太子六友文永平元年劉實為太保志通省尚書事詹事書關由六傅元帝太興元年正月庚午立子紹為皇太子明帝賀循太傅王導代之周顗少傅置二傅而無師保曰太寧初荀嵩領太傅選注山濤啓事保傅不可不髙天下之選羊祜克已復禮東宮少事養德而已宋志晉武太始五年詔太子拜太傅少傅如弟子事師之禮二傅不得上疏曲敬晉東宫舊事太子於二傅執子弟禮二傅入見太子詣崇賢門迎太子為二傅拜各答拜入坐對坐閭纘云漢太子四皓為師子房為傅晉庶子宋志中庶子四人職如侍中漢東京員五人晉減為四人秩六百石吳顧談為之晉東宫舊事中庶子四人準侍中若皇太子八宫與中舍人各一人更日直永福坊武帝初置應正孔恂為之咸郭奕鄭默裴顧鄧攸鄒湛丈立棗據王衍湛為之寧二年十二月召處士皇甫謐為之嶠元帝以鄧攸孔衍卞壼為之同顔含以篤行選溫數規諫獻侍臣針通典班二令四率云山濤啓事東宫顯選宋志庶子四人職比散騎常侍中書監令晉制也漢西京員五人東京無員職如三舍中郎古者諸侯世子有庶子之官秦因其名秩四百石晉五率又見兵制通典衛率府秦官漢因之屬詹事後漢主門衛徼循衛士而屬少傅魏因之晉武時東宫置衛率初曰中衛率泰始五年分為左右衛率各領一軍惠帝時又加前後二衛率成都王穎為太弟又置中衛率是為五率江左已後多不置前後率孝武大元中又置止置左右二率晉太康八年詔曰太子家令率更令僕東宮之達官宜進品第五與中庶子二率同潘尼頌三率備衛元嘉中有四率通典中庶子班同三令四率之左率山濤之子該褚翜右率向雄武韶傅詠吳隱郭奕宋志太子左衛率七人右衛率二人五率職如三衛秦時直云衛率漢因之主門衛晉初曰中衛率太始分為左右各領一軍惠帝時東宫加置前後二率成都王穎為太弟又置中衛是為五率江左省前後二率大元中又置皆有丞晉初置宋止置左右二率秩舊四百石太子屯騎步兵翊軍三校尉各七人並宋初置屯騎步兵因臺校尉翊軍晉太康初置始為臺校尉以唐彬居之江左省劉卞曰四率精兵萬人晉詹事又見後宋志太子詹事一人丞一人職比臺尚書令詹省也晉初太子官屬通屬二傅咸寧元年復置詹事二傳不復領官屬晉公卿禮秩曰泰始中立詹事後周置宫正宫尹隋開皇元年更置詹事晉少傅針傅玄太子少傅針云金木無常方圎應形亦有櫽括習與性成正人在側德義盈堂云云傅臣司訓齊王攸為太傅獻針曰保相之才必擇賢明昔在周成旦奭作傳後周蕭圎肅為少傳作針曰東序養德震方主器三善既備萬國以正姬周長久實係元良嬴秦短祚亦由少陽晉東宫侍講傳傅暢裴憲卞壼侍講東宫庾亮侍講諫帝以韓子賜太子王恱亦侍講杜夷元帝以為國子祭酒太子凡三至夷舍執經問義齊永明三年太子於崇正殿講孝經建元中率更令伏曼容侍太子講建武中何佟之侍講梁庾黔婁侍太子讀與中庶子殷鈞博士明山賓等遞日講五經義天監八年九月於夀安殿講孝經論語講畢釋奠國學徐勉傳領中庶子侍東宫昭明太子於殿講孝經臨川王宏尚書令沈約備二傅勉與祭酒張充為執經王瑩張稷栁憕王暕為侍講天監元年十一月甲子立皇子統為皇太子拜東宫官屬文武皆入直永福省五年五月庚戌出居東宫五日一朝十四年正月乙巳朔冠大赦陳天嘉中顧越侍東宫讀晉宣猷堂見後太子宴元圃宣猷堂陸機賦詩曰體輝重光承規景數茂德淵沖天姿玉裕蕞爾小臣振纓承華匪願伊始惟命之嘉晉皇太子釋奠詳見釋奠潘尼頌曰尊道遜齒降心下問鋪以金聲光以玉潤袁曜釋奠詩曰南庠貴齒東學上親卑躬下問降禮師臣員冠濟濟方領恂恂宋何承天詩顔延年詩尚席函丈承疑奉帙侍言稱辭敦史秉筆齊永明五年冬太子臨國學親䇿試諸生問王儉曲禮毋不敬義三年十月釋奠王儉詩金鎔乃器水術伊瀾晉侍臣針溫嶠侍臣針均士抗禮以卑厥情入學齊齒言稱先生不以賢自盛不以貴為榮師傅是瞻正人在側屛彼佞諛納此亮直齊王攸獻太子針有固親以道修身以敬之語晉東宫舊事梁東宫新記又見下長春義記唐春坊要録唐志故事類張敞晉東宫舊事十卷顧氏家訓引東宫舊事又太平御覽選注引之杜正倫春坊要録四卷儀注類梁蕭子雲東宫雜事二十卷選注引蕭子雲東宫雜記奏子雲傳遷太子舍人撰東宫新記二十卷之賜束帛王僧孺撰東宫新記陸開明宇文愷東宫典記七十卷隋志左庶子宇文愷撰十卷劉杳為通事舍人撰東宫新舊記三隋志皇儲故事二卷失姓名經解類梁簡文帝長春義記一百卷隋志同及梁簡文以沈文阿為東宫學士撰長春義記使撮異聞廣之晉東宫舊事皇太子初拜有石山安車一建九旗青色四馬有眊幢一鹵簿有黃麾太子大小會庭設三廂樂舞六佾納妃四望車羽葆前後部鼓吹有織成衮帶白玉佩步搖一具九鈿函盛之通典魏收按東宫舊事太子宴會多以西面為禮唐會要開元六年侍中宋璟上表曰皇太子冠準東宫典記有上禮之儀謹按上禮非古宜停宋東宫儀記隋志儀注篇宋東宫儀記二十三卷宋新安太守張鏡撰劉孝綽等議按東宫儀記東宫新記二十卷蕭子雲撰見上南史劉杳撰東宫新舊記三十卷崇文目類書有青宫懿典十五卷王純臣撰宣和四年四月葉焕上繼明集論總六十五卷齊皇太子九言文選齊竟陵王子良行狀文惠太子養德東朝同符作者爰造九言實該百行命公注解注竟陵王集有皇太子九言注解言德言賢言親言生言靜言昭言真言節言義後魏東宫侍臣針後魏書宗欽仕河右為世子洗馬上東宫侍臣針曰恢恢玄古悠悠生民五才迭用經敘彛倫匡父維子弼君伊臣顛而能扶屈而能伸昔在上聖妙鑒厥趣不曰我明而乖其度不曰我新而忽其故如彼在泉臨深是懼如彼覆車望塗改步是以令問宣流英風逺布及於三季道喪紀遷桀起瓊臺紂醊糟山周滅妖姒羿喪以田險詖蔽其耳目鄭衛陳於其前怙才肆虐異端是纒豈伊害身厥嗣殱焉茫茫禹迹畫為九區昆蟲鳥獸各有巢居雲歌唐后垂拱美虞疏網改祝殷道攸敷龍盤應德隋蛇銜珠勿謂無心識命不殊勿謂理絶千載同符爰在子桓靈數攸臻儀形徐阮左右劉陳披文採友叩典問津用能重離襲曜魏鼎維新於昭儲后運應元籙夕惕乾乾虛矜逺屬外撫幽荒內懷煢獨猶懼思不逮逺明不遐燭君有諍臣庭立謗木本枝克昌永符天祿微臣作針敢告在僕文選注卞壼議曰太子所居宫稱東宫不言太子官者二宫以東西為稱明是天子之離宫使太子居之也後周皇太子針藝文類聚初學記同後周王褒皇太子針其略云令問令望聞詩聞禮秋坊通夢春宫養德