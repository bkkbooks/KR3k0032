body:
  text: 玉海卷一百八十二宋王應麟撰食貨漕運三代之前漕運之法不備禹貢州末繫河先儒以為運道至於青達濟揚達泗荆止於南河雍止於西河此正裴耀卿節級轉輸之法先王賦藏天下自都達境周禮遺人凡師役掌道路之委積委人軍旅共委積薪芻積倉于豳峙糧于申會搜之備取于衛而無轉輸之勞唯職內待邦之移用注謂轉運均人掌牛馬車輦力政注以為轉委積之屬黍苗詩曰我任我輦我車我牛箋云召伯營謝轉餫之役廩人有師役之事治其糧食注有行道止居之異而他未之見秦輸粟于晉自雍及絳曰泛舟之役從渭水運入河汾吳城𨝍溝通江淮於𨝍江築城穿溝東北通射陽湖西北至永口入淮通糧道也齊師之出陳鄭共糧晉軍楚地食其館穀荀首如齊宣伯餫之晏子對齊景公謂師行而糧食勞者弗息蘇秦曰秦攻楚則韓絶其糧道張儀曰秦西有巴蜀方船積粟起於汶山循江而下至郢三千餘里舫江載卒一舫載五千人與三月之糧下水而浮一日行三百餘里秦漢而下漕法始詳秦章邯築甬道而輸粟趙充國奏大司農所轉穀至者足支萬人一嵗食傾不虞之用以贍一隅後將軍征西羌張敞言隴西以丘安定以西吏民並給轉輸田事頗廢永光二年秋馮奉世擊羌對善用兵者役不再興糧不三載往者再三發軵曠日頗費于定國云前擊朱崖卒士轉輸費用三萬萬餘建始四年河決遣謁者二人發河南以東漕船五百艘徙民避水溝洫志漢關中轉漕張良傳良曰關中沃野千里河渭漕挽天下西給京師諸侯有變順流而下足以委輸此天府之國虞詡曰雍州厥田惟上水舂河漕蕭何傳漢二年何守關中計户轉漕給軍鄂秋曰漢與楚相守滎陽數年軍無見糧蕭何轉漕關中給食不乏髙帝日給餉餽不絶糧道志漢興糧吏祿度官用云云漕運關東粟以給中都官嵗不過數十萬石孝惠髙后之間衣食滋殖文景遵業屢勑有司以農為務民遂樂業武帝因文景之蓄忿胡粵之害即位數年嚴助朱買臣等招徠東甌事兩粵江淮之間蕭然煩費矣買臣治樓船備糧食可淮南王諫伐閩越曰不以大船載食糧下唐蒙司馬相如始開西南夷鑿山通道千餘里廣巴蜀巴蜀之民罷焉相如傳云郡多為發轉漕萬餘人擅為轉粟運輸彭吳穿穢貊朝鮮置滄海郡則燕齊之間靡然發動及王恢謀馬邑胸奴絶和親侵擾北邊兵連而不解天下共其勞行者齎居者送其後衛青嵗以數萬騎出擊胸奴逐河南北築朔方時又通西南夷道作者數萬人千里負擔餽餉率十餘鍾致一石轉漕甚逺自山東咸被其勞費數十百巨萬元狩四年大將軍票騎擊胡步軍轉者踵軍數十萬矣官多徒衆而下河漕度四百萬石及官自糴乃足元封元年桑弘羊為治粟都尉領大農弘羊置平準於京師山東漕益嵗六百萬石一嵗之中大倉甘泉倉滿邊餘穀均輸帛五百萬匹民不益賦而天下用饒古今轉漕之盛極於此矣酈生曰蜀漢之粟方船而下灌嬰絶楚糧道漢軍滎陽築甬道取敖倉食項羽傳漢通褒斜道溝洫志孝武時有上書欲通褒斜道及漕褒斜二谷名事下御史大夫張湯問之言抵蜀從故道多阪回逺今穿褒斜道少阪近四百里而褒水通沔斜水通渭皆可以行船漕漕從南陽上沔入褒褒絶水至斜間百餘里以車轉從斜下渭如此漢中穀可致而山東從沔無限便於底柱之漕且褒斜材木竹箭之饒擬於巴蜀上以為然拜湯子卭為漢中守發數萬人作褒斜道五百餘里道果便近而水多湍石不可漕後郡國志右扶風武功有斜谷注褒斜谷在長安西南南曰褒北曰斜長百七十里其水南流杜篤論都賦鴻渭之流徑入于河大船萬艘轉運相過昭紀元鳳二年六月詔曰閔百姓未贍前年減漕三百萬石三年正月詔曰民被水災其止四年毋漕漢漕渠武元光六年春穿漕渠通渭如淳曰水轉運曰漕畨係鄭當時見河渠枚乘説吳曰二十四郡十七諸侯方輸錯出運行數千里不絶於道其珍怪不如東山之府轉粟西鄉陸行不絶不如海陵之倉漢五鳳省轉漕志孝宣即位嵗數豐穰穀石五錢農人少利時耿壽昌以商功利得幸五鳳中奏言故事嵗漕關東穀四百萬斛給京師用卒六萬人宜糴三輔弘農河東上黨太原等郡穀可以省關東漕卒過半天子從其計蕭望之言今欲近糴漕關內之穀築倉治船費直二萬萬有動衆之功恐生旱氣帝不聽漕事果便紀五鳳四年春正月司農中丞壽昌奏設常平倉以給北邊省轉漕賜爵關內侯通典管子曰粟行三百里則國無一年之積粟行四百里則國無二年之積粟行五百里則衆有飢色孫武曰千里饋糧士有飢色食敵一鍾當吾二十鍾且言粟不可推移而糴之者無利糴之處受害秦欲攻胸奴運糧使天下飛芻挽粟起於黃腄琅琊負海之郡轉輸北河率三十鍾而致一石主父偃云轉海瀕之粟至于西河伍被云使尉屠雎將樓雎之士攻越使監祿鑿渠運糧丁男被甲丁女轉輸嚴安云朝錯言募民實塞使輸將之費益寡主父偃請置朔方內省轉輸戍漕丞相賀令耕者自轉自輸穀於邊元鼎元年秋九月詔水潦移於江南方下巴蜀之粟致之江陵六年初置張掖酒泉郡餽糧逺者三千近者千餘里皆仰給大農太初元年八月發七科適載糒給二師轉車人徒相屬趙充國奏循河湟漕穀馮奉世傳再三發軵淮南子內郡軵車而餉卜式為成臯令將漕最漢護漕都尉朱博為護漕都尉王尊為護羌將軍轉校尉護送軍糧委輸而羌人反絶轉道建武七年二月辛巳罷護漕都尉官漢河內轉運後漢傳冦恂為河內太守光武謂恂曰昔髙祖留蕭何鎮關中今委公河內堅守轉運給足軍糧恂收租四百萬斛轉以給軍時軍食乏恂以輦車驪駕轉輸前後不絶尚書升斗以稟百官贊曰子翼守溫蕭公是埒係兵轉食以集鴻烈鄧晨為常山守遣委輸給軍不絶王霸為上谷太守上書陳委輸可從溫水漕以省陸轉輸之勞張堪遷謁者使送委輸金帛詣吳漢建武八年春大轉糧運使來歙率諸將擊公孫述明年隴西民流傾倉廩轉運諸縣振之十二年發委輸金帛繒絮供給軍士杜茂亦建屯田驢車轉運十一年臧宫將兵屯中盧屬縣送委輸車數百乘漢武都下辨漕水運虞詡傳羌冦武都鄧太后以詡有將帥之略遷武都太守詡乃占相地勢築營壁二百八十所招還流亡假賑貧人郡遂以安先是運道艱險舟車不通驢馬負載僦五致一詡乃自將吏士案行川谷自沮至下辨數十里中皆燒石翦木開漕船道以人僦直雇借庸者於是水運通利嵗省四千餘萬注沮今興州順政縣下辨今成州同谷縣續漢志下辨東三十餘里有狹中當水泉生大石障塞流水至春夏輒溢詡使人燒石以水溉之石皆裂因鐫去石遂無汜溺之患鄭弘傳舊交址七郡轉運皆從東治汛海建初八年弘為司農奏開零桂嶠道蜀木牛流馬運三國志建興九年春二月諸葛亮復出軍圍祁山始以木牛運六月糧盡退軍亮軍祁山李平催督運事秋夏之際霖雨運糧不繼亮退軍十年亮休士勸一作勤農於黃沙作流馬木牛畢教民一作兵講武十一年冬亮使諸軍運米集於斜谷口治斜谷邸閣十二年春二月亮悉大衆由斜谷出始以流馬運據武功五丈原分兵屯田本傳亮性長於巧思損益連弩木牛流馬皆出其意注魏氏春秋曰亮損益連弩謂之元戎亮集載作木牛流馬法曰木牛方腹曲頭一腳四足頭入項一作領中舌著於腹載多而行少宜可大用特行者數十里羣行者二十里曲者為頭雙者為腳橫者為領轉者為足覆者為背方者為腹垂者為舌曲者為肋刻者為齒立者為角抑一作細者為鞅攝者為鞦胄牛仰雙轅人行六尺牛行四步載一嵗糧日行二十里而人不大勞流馬尺寸之數肋長三尺五寸有左右又有前軸後軸前腳後腳前杠後杠皆有尺寸方囊二枚每枚受米二斛三斗前後四腳形制如象陳壽言立法施度整理戎旅工械技巧物究其極亮屯沔陽以轉漕回逺使子喬親帥諸將子弟傳運於谷中南史齊祖沖之以諸葛亮有木牛流馬乃造一器不因風水施機自運不勞人力唐劉濛經略河湟始議木牛運魏漕渠鄧艾見屯田杜畿傳太祖西征至蒲阪與賊夾渭為軍軍食一仰河東征漢中遣五千人運鄭渾傳大軍入漢中運轉軍糧為最魏武建安九年正月濟河遏洪水入白溝以通糧道晉漕運紀武帝泰始十年鑿陜南山決河東注洛以通運漕懷帝永嘉元年九月修千金堨於許昌以通運成帝咸和六年正月戊午以海冦運漕不繼發王公已下千餘丁各運米六斛穆帝升平三年三月甲辰糧絶不繼制王公已下十三户共借一人助度支運志大司農統東西南北部護漕掾傳杜預通零桂之漕張華為度支尚書量計運漕謝元堰吕梁利運漕桓溫使豫州刺史袁真攻譙梁開石門以通水運真克譙梁而不能開石門水運路塞應遵上便宜求壤泗陂徙運道王羲之論北伐曰今轉運供繼西輸許洛北入黃河晉督運御史紀太元六年正月丁酉初置督運御史官又見通典宋何承天言繤耦車牛以載糧械隋漕運開皇三年以倉廩尚虛議為水旱之備詔於蒲陜等十三州置募運米丁衛州置黎陽倉陜州置常平倉華州置廣通倉轉相灌注漕關東汾晉之粟以給京師元魏經略江淮轉運中州以實邊鎮有司請於水運之次隨便置倉立邸閣凡八所應機漕引費役徵省孝文太和七年刁雍請造船二百艘一運二十萬斛方舟順流五日而至輕於車運十倍唐水陸運遞場海運六典自洛至陜運於陸自陜至京運於水置使以統之駕部諸司有備運之車食貨志唐都長安而關中號沃野然土地狹所出不足給京師備水旱常轉漕東南之粟髙祖太宗時用物有節而易贍水陸漕運嵗不過二十萬石故漕事簡髙宗後嵗益增多初江淮漕租米至東郡輸含嘉倉以車或馱陸運至陜水行來逺多風波覆溺率一斛得八斗為成勞陸運至陜才三百里率兩斛計錢千民送租皆有水陸之直河有三門底柱之險顯慶元年苑西監褚朗議鑿三門山為梁通陸運功不成其後大匠楊務廉又鑿為棧以挽漕舟人以為苦初裴耀卿興漕路請罷陸運而不果自景雲中陸運北路分八遞雇民車牛以載開元初河南尹李傑為水陸運使運米嵗二百五十萬石而八遞用車千八百乘會要開元二年傑為水運使大興漕事耀卿罷久之天寶九載九月河南尹裴迥以八遞傷牛乃為交場兩遞濱水處為宿場分官總之自龍門東山抵天津橋為石堰以遏水通典逈以遞場為交場近水處為宿場會要開元二十九年除朔方節度王忠嗣加水運使二十七年十二月李適之為幽州節度河北海運使建中元年罷轉運使既而復以杜佑權江淮水陸轉運使通典天寶中每嵗水陸運米二百五十萬石入關舊於河南運至陜郡太原倉又運至永豐倉及京太倉開元初河南尹李傑始為陸運使從含嘉倉至太原倉置八遞場每嵗冬初起運八十萬石後至一百萬石每遞用車八百乘分為前後交兩月而畢天寶七載滿二百五十萬石每遞用車千八百乘自九月至正月畢大厯後水陸運每嵗四十萬石入關傳任瓌留戍永豐倉秦王東討瓌從邙山主水運餉軍又見後李襲譽授太府少卿伐王世充拜潞州總管詔典運餉東軍竇琮武德初留守陜護餉道房玄齡為太子太傅伐遼留守京師總糧械飛輸韋挺主餉運作漕艫轉糧崔仁師副挺知海運又别知河南漕事以漕路回逺恐所輸不時至以便宜發近海租賦餉軍崔湜建言山南可引丹水通漕至商州自商鑱山出石門抵北藍田可通挽道以湜充使開大昌關役徒數萬竟不通薑師度神龍初並海鑿平虜渠以通餉路罷海運省功多為陜州刺史太原倉水陸運所湊轉屬諸道使依髙為廥而注米于舟故人不勞李泌貞元九年拜陜虢觀察使始鑿山開車道至三門便餉漕王播長慶初浚七里港以便漕王仲丘祖師順仕髙宗議漕輸事韓重華為代北水運使狄仁傑督太原運陸贄奏議崔造作相懲元琇罷運之失請每年轉漕百萬石以贍京師地理志平州馬城古海陽城也開元二十八年置以通水運金石録元和二年五月席夔撰東渭橋河運院記興元江運見河渠唐漕渠廣運潭洛漕新潭會要大足元年六月九日於東都立德坊南穿新漕置諸州租船神龍二年滄州刺史薑師度傍海穿漕號平虜渠開元二十八年九月魏州刺史盧暉開通濟渠製樓百餘間以貯江淮之貨二十九年十一月陜郡太守李齊物鑿三門路便漕運開渠得古犁鏵三於石下遂改河北縣為平陸天寶元年正月二十五日辛未渠成其年三月陜郡太守韋堅引滻水開廣運潭於望春東自華隂永豐倉以通河渭至二年三月二十六日丙寅名潭曰廣運京兆尹韓朝宗分渭水置潭以貯水永泰二年七月十日通鑑云八月京兆尹黎幹奏鑿運水渠通鑑云京兆尹黎幹自南山引澗水穿漕渠入長安不成開元二十六年十一月五日齊浣奏請開伊婁河又立伊婁埭地志同類詳見河渠志韋堅漕山東粟四百萬石自裴耀卿言漕事進用者常兼轉運之職而堅為最地理志河南有洛漕新潭大足元年開以置租船泗州漣水有新漕渠南通淮垂拱四年開以通海沂密等州興元初治漕渠引湖陂築坊庸入渠中起隄貫城以通大舟者淮南節度杜亞也元和中以漕渠庳下築隄閼以防泄者李吉甫也大和初疏秦漢時故漕興成堰東達永豐倉罷車挽之勞者咸陽令韓遼也神龍初韋景駿令肥鄉縣地瀕漳舊防迫漕渠景駿相地勢益南干步因髙築鄣又維艚以梁其上唐開元漕事便宜北運志開元十八年宣州刺史裴耀卿朝集京師玄宗訪以漕事耀卿條上便宜曰江南户口多而無征防之役然送租庸調物以嵗二月至揚州入斗門四月已後始渡淮八汴常苦水淺六七月乃至河口而河水方漲須八九月水落始得上河入洛而漕路多梗船檣阻隘江南之人不習河事轉雇河師水手重為勞費得行日少阻滯日多今漢隋漕運路瀕河倉廩遺迹可尋可於河口置武牢倉鞏縣置洛口倉使江南之舟不入黃河黃河之舟不入洛口而河陽柏崖太原永豐渭南諸倉節級轉運水通則舟行水淺則寓於倉以待則舟無停留而物不耗失此其利也玄宗初不省二十一年耀卿為京兆尹京師雨水穀涌貴玄宗將幸東都復問耀卿漕事耀卿因請罷陜陸運而置倉河口使江南漕舟至河口者輸粟於倉而去縣官雇船以分入河洛置倉三門東西漕舟輸其東倉而陸運以輸西倉復以舟漕以避三門之水險玄宗以為然乃於河隂置河隂倉河西置柏崖倉三門東置集津倉西置鹽倉鑿山十八里以陸運自江淮者皆輸河隂倉自河隂西至太原倉謂之北運自太原倉浮渭以實關中玄宗大悅拜耀卿為黃門侍郎同中書門下平章事兼江淮都轉運使表耀卿以二十一年十二月丁巳同平章事二十二年八月為江淮以南回運使以鄭州刺史崔希逸河南少尹蕭景為副使益漕晉絳魏濮邢貝濟博之租賦輸諸倉轉而入渭凡三嵗漕七百萬石省陸運傭錢三十萬緍時力豐用廣民間言用斗錢運斗米耀卿罷相北運頗艱米嵗至京師才百萬石二十五年遂罷北運崔希逸為河南陜運使嵗運百八十萬石其後以太倉積粟有餘嵗減漕數十萬石會要云自江淮而泝鴻溝悉納河隂倉自河隂送納含嘉倉又遞納太原倉河通典云自河隂侯水調浮漕至含嘉倉又取曉習水者遞送納于太原倉所謂北運也傳裴耀卿為京兆尹京師飢帝將幸東都召問所以救人者曰陛下既東巡百司必從則太倉三輔可遣重臣分道賑給自東都益廣漕運以實關輔關輔既實則乘輿西還事蔑不濟且國家大本在京師但秦地狹水旱易匱貞觀永徽時祿廩未廣每嵗漕粟不過二十萬略足今用度浸廣漕運數倍且不支故數東幸以就敖粟為國大計臣願廣陜運道使京師常有三年食雖水旱不足憂今天下輸丁約四百萬使丁出百錢為陜洛運費又益半為營窖用分納司農河南陜州又令租米悉輸東都從都至陜河益湍阻若廣漕路變陸為水所支尚贏萬計且河南租船候水始進吳工不便河漕在處停留易生隱盜請置倉河口以納東租然後官自雇載分入河洛度三門東西各置敖倉自東至者東倉受之二門迫險則旁河鑿山以開車道運十數里西倉受之度宜徐運抵太原倉趍河入渭更無留阻可減費巨萬天子然其計於是置河隂集津三門倉引天下租繇盟津泝河而西三年積七百萬石省運費三十萬緡通鑑二十二年八月壬寅置倉和河隂上倉天寶中廢百大厯四年劉晏置汴口倉元三年增置河隂倉屋五十間三貞元中陸贄奏河隂太原等倉米百二十餘萬石河隂所貯尤多裴寬耀卿領江淮運列倉河隂奏寬為戶部侍郎自副歸融湖南進羡錢億萬置錢河隂院以虞水旱會要十八年耀卿上言請理敖倉於河口立輸場以受米置河隂河陽柏崖集津三門倉又鑿崖開山以車運數十里積于太原倉以利漕運二十一年召京兆尹耀卿問以救人之術奏曰貞觀永徽之際祿廩未廣每嵗運不過二十萬石國用漸廣漕運數倍猶不能支請置倉河口以納東租然後官自雇載分入河洛度三門東西各築敖倉自太原倉泝河入渭更無留阻可減費巨萬二十二年八月十四日置河隂柏崖集津倉開三門山十八里以避湍險自江淮泝鴻溝納河隂倉自河隂納含嘉倉又遞納太原倉謂之北運自太原倉浮渭以實關中其月耀卿為江淮轉運使以崔希逸蕭景為副副使自此始三年凡運七百萬石會要武德八年十二月十八日薑行本於隴州開五節堰引水通運永徽元年薛大鼎開無棣河顯慶元年十月褚朗開底柱三門鑿山通陸運咸亨三年王師順運晉絳之粟于河渭增置渭橋倉官志貞觀六年置舟楫令掌運漕漕正一人監漕一人上元二年丞二人掌運漕隱失開元二十六年廢唐轉運使發運使志開元二十一年拜裴耀卿黃門侍郎同平章事兼江淮都轉運使以鄭州刺使崔希逸河南少尹蕭炅為副使二十五年希逸為河南陜運使二十九年韋堅兼水陸運使肅宗末年劉晏兼度支轉運鹽鐵鑄錢使及楊炎為相罷晏轉運使復歸度支凡江淮漕米以庫部郎中崔河圖主之趙贊又以錢貨出淮迂緩分置汴州東西水陸運兩稅鹽鐵使以度支總大綱貞元初二年正月壬寅崔造為相疾錢榖諸使顓利乃奏諸道觀察刺史選官部送兩稅至京師廢諸道水陸轉運使及江淮轉運使增江淮之運浙江東西嵗運米七十五萬石復以兩稅易米百萬石江西湖南鄂嶽福建嶺南米亦百二十萬石詔浙江節度韓滉淮南杜亞運至東西渭橋倉滉方領轉運奏國漕不可改復以為江淮轉運使會要開元二十一年八月侍中裴耀卿充江淮轉運使轉運置使始於此自開元迄于天祐凡為轉運使者四十八人自裴耀卿至栁璨若裴耀卿韋堅第五琦劉晏杜佑韓滉李巽裴休此其著名者也河南水陸運使開元二年閏二月李傑為之後有畢建李齊物齊抗元和六年十月停陜州水陸運使先天二年十月李傑為刺史始充使李傑傳先天中進陜州刺史水陸發運使置使自傑始自後刺史常帶使天寶十載五月崔無詖為太守不帶水陸運使以度支使楊國忠為之十二載正月崔無詖為使國忠為都使貞元十三年于頔兼之元和六年十月停建中三年八月丁未分置汴東西水陸運兩稅鹽鐵使十二月二十日包吉崔縱為之貞元二年正月諸道水陸運使並停裴耀卿為轉運使命崔希逸蕭炅為之副轉運有副使自此始肅宗初第五琦請於江淮分置租庸使市輕貨以救軍食寶應元年六月乙亥劉晏為度支鹽鐵轉運使鹽鐵兼轉運自晏始詳見後建中元年詔天下錢榖皆歸金倉部既而出入無統三月癸巳以韓洄判度支杜佑為水陸轉運使行劉晏韓滉舊制傳韓滉貞元元年加江淮轉運使元琇判度支以關輔旱請運江南租米西給京師帝委滉專督之琇請自江至揚子滉主之揚子以北自主之二月甲戌元琇為陜州水陸運使兼江淮運米大至上嘉滉功十二月丁巳以滉度支諸道鹽鐵轉運等使第五琦見肅宗彭原言兵賦所出江淮為淵請悉東南寶資飛餉函洛拜江淮租庸使遷轉運乾元九年三月人不益賦而用饒廣德二年永泰元年復為使劉晏度支兼侍御史領江淮租庸事分置諸道租庸使簡臺閣士掌之出納委士人吏惟行文書晏辟置皆用材顯循其法亦能富國盧坦表韓重華為代北水運使開廢田列壁二十益兵三千人嵗收粟二十萬石蔣沇領渭橋出納使德宗以鄭元鈞為靈夏運糧使轉米峙塞下通鑑廣明元年二月高駢奏改揚子院為發運使發運有使始于唐先天中李傑而改揚子院為使則廣明初也唐漕運有三節江南陜西最重者京口唐開砥柱漕路山西運道李齊物傳天寶初擢陜州刺史開砥柱通漕路志開元二十九年陜郡太守李齊物鑿砥柱為門以通漕開山顛為挽路燒石沃醯而鑿之然棄石入河激水益湍怒舟不能入新門候水漲以人挽舟而上嵗漕經底柱覆者幾半貞元二年陜虢觀察使李泌益鑿集津倉山西徑為運道屬于三門倉又為入渭船方五板輸東渭橋太倉米至凡百三十萬石遂罷南路陸運通鑑鑿山開車道十八里避底柱之險二月道成史記正義底柱山俗名三門山在陜石縣東北五十里在河之中唐劉晏漕運通鑑廣德二年三月己酉晏為河南江淮轉運使議開汴水庚戌命晏與諸道節度使均節賦役聽從便宜行畢以聞大厯元年正月丙戌晏為轉運常平鑄錢鹽鐵等使與第五琦分理天下財賦傳代宗擢晏領東都河南江淮轉運使時大兵後京師米斗千錢甸農挼穗以輸晏自按行浮淮泗達汴入河右循底柱硤石觀三門遺迹至河隂鞏洛見宇文愷梁公堰厮河為通濟渠視李傑新隄盡得利病移書元載陳利害各四盡以漕事委晏故得盡其才嵗輸始至天子大悅遣衛士以鼓吹迓東渭橋馳使勞曰卿朕鄼侯也凡嵗致四十萬斛關中雖水旱物不翔貴晏以常平法豐則貴取飢則賤與率諸州米常儲三百萬斛初州縣取富人督漕挽晏始以官船漕陳諌以為管蕭之亞贊言晏操天下贏資佐軍興斂不及民而用度足唐中僨而振晏有勞焉志肅宗末年淮運阻晏兼使江淮粟帛繇襄漢越商於以輸京師代宗廣德二年以晏顓領轉運凡漕事皆決焉晏即鹽利顧役分吏督之自江淮至渭橋率十萬斛役七千緡隨江汴河渭所宜故時繇潤州陸運至揚州斗米費錢十九晏命囊米而載以舟減錢十五繇揚州距河隂斗米費錢百二十晏為歇艎支江船二千艘每船受千斛十船為綱每綱三百人篙工五十人自揚州遣將部送至河陰上三門號上門填闕船米斗減錢九十調巴蜀襄漢麻枲竹篠為綯挽舟以朽索腐材代薪物無棄者未十年人人習河險江船不入汴汴船不入河河船不入渭江南之運積揚州汴河之運積河隂河船之運積渭口渭船之運入太倉嵗轉粟百一十萬石無升斗溺者又分官吏主丹陽湖禁引溉河漕不涸大厯八年以關內豐穰減漕十萬石度支和糴以優農晏自天寶末掌出納監嵗運知左右藏主財穀三十餘年及楊炎為相罷晏轉運使復歸度支凡江淮漕米以庫部郎中崔河圖主之晏於揚子院置十船場以官主之會要晏遺元載書運之利病各有四得江湖米二三十萬石則徭役減一利也米運流通則飢人附二利也雲帆桂楫輸納帝鄉可以震耀夷夏三利也舟車既通百貨雜集四利也所可疑者武牢成臯人煙蕭條一病也千里泗上罔水行舟二病也奪攘姦宄夾河為藪三病也淮隂蒲坂屯戍相望船到便留非單車使折簡書所能制四病也晏見一水不通願荷臿先往見一粒不運願負米而趨自此嵗運米數十萬石晏之任事起廣德二年迄建中元年凡二十餘年官雖數遷職未嘗易唐浚儀運路漢運路食貨志田悅李惟嶽李納梁崇義拒命建中二年舉天下兵討之諸軍仰給京師而李納田悅兵守渦口梁崇義扼襄鄧南北漕引皆絶京師大恐江淮水陸轉運使杜佑以漢運路一本云秦漢運路出浚儀十里入琵琶溝絶蔡河至陳州而合自隋鑿汴河官漕不通若導流培岸功用甚寡疏雞鳴岡首尾可以通舟陸行才四十里則江湖黔中嶺南蜀漢之粟可方舟而下繇白沙趣東關歷潁蔡涉汴抵東都無濁河泝淮之阻減故道二千餘里會李納將李洧以徐州歸命淮路通而止王紹傳李希烈阻兵江淮輸物留梗乃徙餉道自潁入汴通鑑建中三年東南轉輸不敢由汴渠自蔡水而上李希烈傳李納遣遊兵導希烈絶汴餉路李勉治蔡渠引東南饋帝使陜虢觀察使姚明剔治上津道置館通南方貢貨崔縱為汴西水陸運使王師圍田悅餉四節度糧軍無乏建中二年李正已反屯兵甬橋江淮漕船積千餘不敢踰渦口張萬福刺濠州因馳至渦口駐馬于岸悉發漕船相銜進賊兵熟視不敢動伊慎傳包吉轉東南財糧至蘄口賊遏江道不得西慎選士七千列三屯奮擊漕無留艱李晟屯渭北韓滉運米饋之船置十弩相警張建封傳李泌建言東南漕自淮達諸汴徐之甬橋為江淮計口請以建封帥徐貞元四年唐淮潁水運會要元和十一年十二月舊紀甲寅始置淮潁水運以餽討淮西諸軍揚子等諸院米自淮陰泝流至夀州西四十里入潁口又泝流至潁州沈丘界五百里至于陳州項城又泝流五百里入于溵河又三百里輸于郾城得米五十萬石附之以茭一千五百萬束計其功省汴運七萬六千貫平淮西碑士飽而歌馬騰於槽蔡人告飢船粟往哺舊紀長慶二年八月丁丑轉運使王播進開潁口圖唐李巽裴休漕運新法十條會要舊制每嵗運江淮米五十萬斛至河隂留十萬四十萬送渭倉晏沒不登數李巽秉使三載無升斗缺志自劉晏後江淮米至渭橋浸減至李巽復多巽以元和二年三月為鹽鐵轉運使大中五年二月裴休為轉運使明年八月為相依前判使始者溺米嵗四十萬斛其能至漕倉者十不三四官舟之沈至七十餘休使僚屬按之委縣令董之自江津達渭以四十萬斛之庸計緡二十八萬悉使歸之漕吏為法凡十事奏之由是三嵗漕米至渭濱積百二十萬斛無升合沉棄焉裴休傳大和後嵗漕江淮米四十萬斛至渭河倉者才十三休乃命在所令長兼董漕著新法十條居三年粟至渭倉者百二十萬斛建隆發運使紹興經制發運使建隆二年九月癸酉以盧浚為京畿東路發運副使始見此乾德二年二月以何幼沖充京畿東南水陸發運使興國五年正月命姚沆為陜西三門發運八年九月癸丑朔置水陸發運於京師王賓許昌裔水路發運王繼升劉璠陸路發運一本置江淮水陸發運使王賓王繼升雍熙四年四月己亥以董儼王繼升掌水陸路發運先是興國八年水陸各為一路至是合為一端拱元年四月罷水陸發運至道元年七月癸亥以楊允恭為江淮兩浙發運使一本云淳化四年二月以楊允恭為淮南兩浙都大發運允恭籍三路舟江浙所運止於淮泗由淮泗輸京師行之一嵗上供者六百萬三年五月壬申真宗詔罷之咸平四年以淮南轉運王子輿兼都大發運使自後並以轉運領其務而無使名景德三年二月復置一人馬亮制置茶鹽兼是嵗除李溥發運副使大中祥符間胡則為發運使又有三門白波黃渭汴河水路發運使一人在三門使判官迭入奏事祥符三年九月己亥江淮發運李溥言今春運米六百七十九萬石諸路留三年之儲景祐元年十月庚申罷江淮制置發運使命淮南轉運兼領寶元元年八月丁卯復置楊日嚴楊告為之天聖四年閏五月戊申初定江淮發運司嵗漕米課六百萬斛嘉祐以前嵗運六百萬石欠折不過六七萬石元祐六年運四百五十餘萬石欠折約三十餘萬石蘇軾論綱運五弊寶元元年賈昌朝言臣嘗掌京廩計江淮嵗運糧六百餘萬以一嵗之入僅能充朝廷之用三分二在軍旅一在冗食東南六路汴河嵗漕六百萬石浮江泝淮更數千里計其費率數石而致一石慶厯三年五月江淮嵗漕不給諸大臣以為憂樞副范仲淹言國子博士許元可獨倚辦辛未擢江浙荆湖發運判官元曰以六路七十二州之粟不能足京師吾不信也命瀕江州縣留三月糧餘悉發之逺近以次相補引千餘艘轉漕而西京師足食皇祐二年十一月壬辰賜元進士出身上謂輔臣曰發運使總六路八十一州軍之廣宜得人而久任之元在職十三年四年二月戊寅上謂輔臣曰東南嵗比不登嘗詔損嵗漕百萬石今發運使施昌言許元欲分往江浙調發軍儲必謀誅剝求羡餘以希進因詔遵前詔母科率元請以六路轉運司自隸五月丁卯詔仍舊制嘉祐三年十一月庚寅詔曰國家建都河汴仰給江淮六路所供之租各輸於真楚度支所用之數悉集於京師以發運司總其綱條以轉運使斡其嵗入荆湖舟楫回載海鹽淮汴舳艫不涉江路方冬閉塞役卒少休近嵗因循兹事遂廢吏緣為蠧人實告勞始自五年令諸道據年額赴真楚泗州轉般倉復運鹽歸本路不得撥裏河鹽糧綱往諸路初許元言汴船不出外江比嵗糧船大半為雜般綱沉失者多從元議降是詔慶厯七年八月十二日詔發運副使許元令久任嘉祐三年十月二十七日詔發運使孫長卿令久任治平四年十月一日副使張芻為使令久任發運一司其制始於淳化而備於皇祐之後權六路豐凶而行平糴之法一員在真州督江浙等路糧運一員在泗州趣自真州至京糧運四河之漕汴為重二發運之權江淮為重治真州造船之法六路之船以供江外之綱淮南之船以供入汴之綱常六千隻一舟之運嵗常千石人船之力有餘不勞而辦祖宗設制置發運司蓋始于王朴之議朝廷捐數百萬緡以為糴本使總六路之計通融移用與三司為表裏以給中都六路豐凶不常稔則增糴以充漕計飢則罷糴使輸折斛錢上下俱寬而京師不乏轉般之法始於唐裴耀卿成於劉晏國朝舊制江湖運舟至儀真昔揚子也入轉般倉復載鹽以歸諸路嵗得鹽課無慮數十萬緡以充經費故漕計不乏橫斂不加於民而上下裕矣又以運舟自儀真漕河由汴達于都邑六路八十四州漕京師凡六百萬石自仁宗朝至崇寧初發運司常有六百餘萬石米百餘萬緡之蓄真泗二倉常有數千石之儲自胡師文以糴本為羡餘以獻而轉般無一年之儲崇寧三年七月己亥曾孝廣立直達之法雖湖南北亦直至京師因毁淮南轉般倉既行直達而鹽法隨變改為鈔鹽太倉積粟充溢增置延豐倉于外發運使以應奉充職自錢鹽之法行課歸榷務諸路無所得漕計日以不給上下俱受其弊轉般與鹽法相因鹽法既變回舟無所得舟人逃散船必隨壞大觀三年十月詔復行轉般而終不克宣和六年十一月詔盧宗原興復轉般曽鞏曰宋興承周制置集津之運轉關中之粟以給大梁用侯贇典其任及收南北之地興國初始漕江淮四五百萬石至汴至道間楊允恭漕六百萬石自此嵗增廣焉周邦彥汴都賦越舲吳艚官艘賈舶閩謳楚語風帆雨楫聨翩方載鉦鼓鏜鎝人安以舒國賦應節自淮而南邦國之所仰百姓之所輸紹興二年三月戊戌罷江淮發運使以其錢帛赴行在祖宗時發運司嵗漕江湖粟六百萬斛即真揚楚泗置轉般倉泝流摺運以贍中都且因豐凶而平其糴至是省之八年四月丁丑户侍李彌遜言不必盡循舊制當於經費之外給糴本數百萬緡復置一司廣行儲積詔吏户部修具會要二十二日議復置六月乙卯朔會要十八日徽猷閣待制程邁為江淮荆浙閩廣等路經制發運使専掌糴事降本錢四百萬十二月辛未參政李光請罷發運司令户部侍郎專領九年正月丁酉十六日復廢戊戌以户部侍郎梁汝嘉兼經制使去發運二字乾道六年三月虞允文奏復之己卯二十八日以户侍史正志為都大發運使江州置司降緡錢三百萬為糴本十二月癸酉二十八日復廢嘉熙三年復置以平江守臣兼寶祐五年十月兼發運大使乾德轉運使乾德元年正月以沈義倫為京西韓彥卿為淮南轉運使諸道置轉運始見此興國三年四月諸道置轉運判官景德三年十二月三司使丁謂始立比較轉運之法皇祐元年置考課院東萊吕氏曰國初轉運使專主糧餉太祖時高防邊光範滕白沈義倫何幼沖劉仁遂曹翰胡玩太宗時劉保勳樂沖郭泌王在田崔邁水路判官皆緣用武以餽運也開寶五年命參政薛居正吕餘慶提舉諸州水陸轉運使纍朝以武臣文臣任帥守而兼漕事始轉運一司廢置初無定制興國二年而後邊防盜賊刑訟金榖按廉之任皆委轉運使又節次以天下土地形勢分路而治繼增判官以京官為之於是轉運使於一路之權無所不總慶厯中帶按察使後二年罷開寶更漕運法三年秋寶訓以為二年春有司言倉儲止及明年二月皇弟開封尹召陳從信問其事對曰楚泗至京千里舊一嵗三運今若運米入船與入倉各宿儲運無淹留則嵗可增一運募民船堅實者運糧其損敗者任民自載則公私俱濟又京師米貴官乃定價商賈無至者若聽其自便則四方奔湊米多而價自賤上從其言於是事集宋朝水運太平興國四河漕運亦見河渠及倉庾會要凡水運自江淮兩浙湖南北運每嵗租糴至真揚楚三州置轉般倉受納調舟計綱泝流入汴至京師發運使領之或云真泗二州置轉般倉江船不入汴者納於二倉回運官鹽給舟人真楚等州共有轉般七倉諸州錢帛雜物軍器上供亦如之陜西菽粟自黃河三門沿流入汴至京師三門白波發運使判官催綱領之陳潁許蔡光夀諸州粟帛自石塘思民河沿泝而至催綱領之周顯德六年引閔水入蔡河通漕運京東諸州粟帛自廣濟河而至催綱領之顯德二年於京城西引水入五丈河連于濟藝祖開國首浚諸河四河所運國初未有定數太平興國六年始制汴河嵗運江淮米三百萬石豆百萬石黃河粟五十萬石豆三十萬石惠民河粟四十萬石豆二十萬石廣濟河粟十二萬石凡五百五十萬石至道初汴運米五百八十萬石祥符初七百萬石此最登之數也又廣南金銀香藥犀象百貨陸運至虔州而水運入京師天禧末諸州軍水運陸運上供金帛緡錢十三萬一千餘珠寶香藥三十七萬五千斤河北衛州東北有御河至乾寧軍運軍食餽邊亦有使臣主之川益諸州布自嘉州水運至荆南遣綱送京師嵗六十六萬分十綱江湖浙建茶亦水運送沿江榷務諸州嵗造船至道末三千三百三十七艘天禧末減四百二十景德三年江淮漕米增至六百萬祥符二年四月壬辰江淮發運李溥言江淮廪粟除留州約支三年外當上供者凡一千二百餘萬石每嵗水運止五百萬今嵗及七百萬望少損其數天聖四年臣僚吳耀卿言咸平景德中嵗漕江淮米不過四百五十萬石近年增至六百五十萬請約舊數立為中制閏五月戊申詔嵗課六百萬石一本云嵗以五百五十萬為額東沈括曰發運司嵗六百萬石淮南一百三十萬江一百萬江西一百二十萬湖南六十五萬湖北三十五萬兩浙一百五十萬通餘羡入六百二十萬按張方平奏廣濟河上供額六十二萬石實五十萬石惠民河額六十萬石實五十五萬石嘉祐元年請減十五萬石黃河馬料三十萬石汴河額六百萬石康定後有折納又撥以賑濟慶厯四年三月辛未省廣濟河嵗漕軍儲二十萬石嘉祐漕運十四䇿元年八月癸亥以張方平為三司使既對畫漕運十四䇿上供斛斗不得折錢諸路災傷不得截撥上供廣濟河上供不得折錢帛惠民河上供減十五萬石只令運二十萬黃河年額馬料三十萬石般運到京汴河漕挽令般粳米年退錢一項充糴本通漕運當令河道疏通折中倉坐倉收糴事簡利博京師河北兵就糧淮南京東㨂剩員租稅視凶穰弛斂發運使屬官久任補填綱欠今日之藝國依兵而立兵以食為命食以漕運為本宰相富弼讀奏于上前晝漏盡十刻上太息稱善弼曰此國計大本也悉如新啓施行其後未期年而京師有五年之蓄二年十一月十三日乙酉詔三司以來春開漕運河此十四䇿之一元豐清河輦運初廣濟河置渠通漕嵗六十二萬石以旱不通置輦運司元豐五年二月十一日罷之移上供物於淮陽軍界入汴名為清河輦運司命張士澄提舉七年八月置斗門復通廣濟河以漕南屯北壘雲布鶴列章溝虎威環拱離衛蠻君夷長國官郡計奉琛執幣來觀厥光輪運輻湊充岐衍術嘉倉細栁殆不足以擬之騰波沄沄靡悍靡激萬舶連檣艫銜軸接順流而行飈趠雲駛百里瞬息篙工楫師嘯歌卧至輸粟太倉陳陳如京千夫雲萃萬臿雲連乃墾乃闢乃宣乃理支分股引淡為安流犀舟利楫百舍一赴吳檣蜀艦沄泝夷懌謳謡載路駭若神設畚挶雲興綆臿麇集在漢之世開南山渠鑿褒斜道在唐之世開三門山鑿廣運潭或利船漕或資田溉著在史册炳炳如丹漕渠玉海卷一百八十二
