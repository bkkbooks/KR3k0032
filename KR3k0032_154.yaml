body:
  text: 玉海卷一百五十四宋王應麟撰朝貢獻方物通典聖人不貴竒貨不寶遠物夷狄來朝坐之門外使舌入體委以食之獲其聲不列於庭廟受其貢不過楛矢獸皮黃帝南夷獸鬯宋志黃帝時南夷乘白鹿來獻鬯瑞應圖云獻褐裘舜僬僥氏貢沒羽虞西戎獻白環帝王世紀舜時僬僥氏來貢沒羽西王母慕舜之德來獻白環東倭重譯而納貢魏志自虞暨周西戎有白環之獻東夷有肅慎之獻皆曠世而至宋志西王母舜時來獻白環白琯又云西王母獻白環玉玦禹渠搜獻裘宋志禹時渠搜來獻裘瑞應圖乘白鹿來獻渠魏文帝令曰王母來獻白環搜未見珍裘西禹貢析支渠搜戎即敘夏諸夷獻樂舞見樂類周肅慎貢楛矢石砮魯語有隼集陳侯之庭楛矢貫之石砮其長尺有咫陳惠公問仲尼仲尼曰此肅慎氏之矢也昔武王克商通道于九夷八蠻使各以其方賄來貢使無忘職業於是肅慎氏貢楛矢石砮其長尺有咫先王欲昭令德之致遠以示後人使永監焉故銘其括曰肅慎氏之貢矢以分大姬配虞胡公而封諸陳使有司求諸故府得之金櫝如之禮大宰物貢注九州之外各以其所貴為摯肅慎氏貢楛矢之屬是也書成王既伐東夷肅慎來賀魏志青龍四年五月丁巳肅慎氏獻楛矢晉紀魏景元三年四月肅慎來獻楛矢長一尺八寸石砮三百枝弓甲貂皮等天子命歸於大將軍府賜其王傉雞錦罽綿帛晉武咸寧五年十二月來獻楛矢石砮傳云元康初元帝大興二年八月又獻挹婁國有山出石其利入鐵宋大明三年十一月己巳獻周越裳獻白雉錫文錦軿車太公金匱曰武王伐殷四夷來貢越裳白雉成王以歸周公曰德不加君子不饗其質政不施君子不臣其人吾何以獲此賜其使請曰吾受命國之黃耉曰久矣天之無烈風雷雨尚書大傳作别風淮雨一作淫雨意者中國有聖人乎盍往朝之周公乃歸之於王薦于宗廟見文選注古今注周公致太平越裳氏重譯來獻白雉一黑雉二象牙一使者迷其歸路周公錫以文錦二匹軿車五乘皆為司南之製使越裳氏載之以南漢書云周公之讓白雉太宗之郤走馬論衡周時天下太平越裳獻白雉倭人貢鬯草韓詩外傳成王之時越裳獻白雉於周公詩韓奕其追其貃奄受北國獻其貔皮赤豹黃羆山海經春山多赤豹中山東胡有黃羆成王時東胡獻此獸魯頌憬彼淮夷來獻其琛元龜象齒大賂南金周西旅獻獒書惟克商通道于九夷八蠻西旅砥貢厥獒太保乃作旅獒用訓于王四夷咸賓畢獻方物注西戎遠國貢大犬周洋水獻良馬水經注穆天子傳曰天子自舂山西征西至赤烏氏己卯北征庚辰濟于洋水辛巳入于曹奴人戲觴天子于洋水之上乃獻食馬九百牛羊七千天子使逢固受之天子乃賜之黃金之鹿戲乃膜拜而受開山圖曰隴西神馬山有淵池龍馬所生周語穆王征犬戎得四白狼四白鹿以歸自是荒服不至漢南越獻馴象武紀元狩二年夏南越獻馴象教能拜起周旋從人意也能言鳥即鸚鵡也南粵傳文帝元年獻白璧一雙翠鳥千犀角十紫貝五百桂蠧一器生翠四十雙孔雀二雙建元四年遣子嬰齊入宿衛漢閩越獻黑鷴見後漢樂志安世房中歌蠻夷竭歡象來致福象譯也漢大宛獻天馬烏孫獻馬南單于獻文馬西域傳大宛治貴山城去長安萬二千五百五十里宛王蟬封與漢約獻天馬二匹漢使採蒲陶目宿種歸詳見馬政烏孫大昆彌治赤谷城去長安八千九百里武帝令張騫齎金幣往乃發使送騫因獻馬數十匹報謝其後使使獻馬願尚漢公主為昆弟後南胸奴傳建武二十六年獻駱駝二頭文馬十匹注畫馬為文漢西域獻吉光裘十洲記天漢三年西國王獻靈膠吉光毛裘又云日西國王貢吉光裘二領使者曰常占東風入律十旬不休青雲干吕連月不散意中國有好道之君故搜竒藴而貢神香文選注引之西京雜記武帝時西域獻吉光裘上服以聽朝西域傳贊孝武睹犀布玳瑁則建珠崖七郡感枸醬竹杖則開牂柯越嶲聞天馬蒲陶則通大宛安息明珠文甲通犀翠羽之珍盈於後宫蒲梢龍文魚目汗血之馬充於黃門巨象師子猛犬大雀之羣食於外囿殊方異物四面而至長楊賦殊鄰絶黨之域自上仁所不化茂德所不綏莫不蹻足抗手請獻厥珍漢康居貢獻西域傳成帝時康居遣子侍漢貢獻董仲舒傳夜郎康居殊方萬里説德歸義漢黃支國獻犀牛紀元始二年春黃支在日南之南去京師三萬里漢車師等十八國獻珍寶西域傳建武二十八年冬車師前王鄯善焉耆等十八國俱遣子入侍獻其珍寶天子還其侍子厚賞賜之紀建武十四年莎車國鄯善國遣使奉獻十七年莎車國遣使貢獻二十一年冬鄯善王車師王等十六國皆遣子入侍奉獻漢日南獻生犀白雉南越獻白雉白兔疏勒獻獅子後紀光武建武十二年九真徼外蠻夷張遊率種人內屬封為歸漢里君十三年九月日南徼外蠻夷獻白雉白兔南蠻傳光武中興錫光為交趾任延守九真教耕稼制冠履設媒聘立學校導之禮義建武十二年九真徼外蠻酋張遊內屬明年南粵外蠻夷獻白雉白兔章帝元和元年正月日南徼外蠻夷獻生犀白雉順帝陽嘉二年疏勒獻師子封牛東觀記曰疏勒王盤遣使文時詣闕師子似虎正黃有􅐖耐尾端茸毛大如斗封牛其領上肉隆起若封然因以名之即今之峯牛靈帝熹平二年十二月日南徼外國重譯貢獻西域傳疏勒國順帝永建二年臣磐遣使奉獻五年遣侍子與大宛莎車使俱詣闕貢獻陽嘉二年復獻師子封牛大秦國延熹九年紀云九月遣使自日南徼外獻象牙犀角玳瑁大秦一名黎靬亦云海西後漢始通天竺國有大秦珍物使帝時數遣貢獻揚雄交州針曰航海三萬闕牽其犀闕魏明帝太和五年四月鮮卑丁零詣幽州貢名馬後置護胸奴中郎將漢西南夷貢獻明紀永平十七年是歲西南夷哀牢儋耳僬僥槃木白狼動黏諸種前後慕義貢獻西域諸國遣子入侍夏五月戊子公卿百官以帝威德懷逺奉觴上壽制曰其敬舉觴告宗廟東京賦惠風廣被澤洎幽荒北燮丁令南諧越裳西包大秦東過樂浪重舌之人九譯僉稽首而來王西南夷傳論緩耳雕腳之倫獸居鳥語之類莫不舉種盡落回面而請吏陵海越障纍譯以內屬故其録名中郎校尉之署編數都護部守之曹動以數百萬計若乃藏山隱海之靈物沈沙棲陸之瑋寶莫不呈表怪麗雕被宫幄賨幏火毳馴禽封獸之賦軨積於內府夷歌巴舞殊音異節之技列倡於外門鏤體卉衣改襟輸寶班超傳每有貢獻異物輒詔作賦頌漢百蠻貢職明紀永平二年春正月辛未宗祀光武於明堂禮畢登靈臺詔曰衆郡奉計百蠻貢職烏桓濊貊咸來助祭單于侍子骨都侯亦皆陪位斯固聖祖功德之所致也漢月氏獻扶拔師子安息獻師子條支大爵紀章帝章和元年月氏國獻扶拔注似麟無角師子和帝永元二年十月安息國遣使獻師子扶拔傳作符拔永元十三年安息國獻師子及條支大爵即今之駝鳥復傳云安息王滿屈獻師子及條支大鳥時謂之安息雀條支國臨西海出大雀前西域傳烏弋有桃拔師子犀牛注桃拔一名符拔似鹿長尾一角者或為天鹿兩角者或為辟邪師子似虎正黃有􅐖耐尾端茸毛大如斗即爾雅狻猊也西域傳永元六年班超復擊破焉耆於是五十餘國悉納質內屬其條支安息諸國至于海瀕四萬里外皆重譯貢獻班超傳月氐貢奉珍寶符拔師子漢徼外蠻奉珍寶西南夷傳永元六年郡徼外莫延慕義遣使譯獻犀牛大象九年徼外蠻及撣國王雍由調遣重譯奉國珍寶和帝賜金印紫綬永初元年徼外僬僥種夷陸類等三千餘口舉種內附獻象牙水牛封牛永寧元年撣國王雍由調復遣使者詣闕朝賀獻樂及幻人漢蒙竒兜勒貢獻西域傳和帝永元九年十二月西域都護班超遣掾甘英窮臨西海而還皆前世所不至山經所未詳莫不備其風土傳其珍怪於是遠國蒙竒兜勒皆來歸服遣使貢獻甘英抵條支而歷安息臨西海以望大秦拒玉門陽關者四萬餘里靡不周盡漢于置入貢順紀永建四年五月壬辰詔桂陽太守遠獻大珠今封以還之是歲拘彌國遣使貢獻西域傳順帝永建六年于置王遣侍子詣闕貢獻又見前初學記魚豢魏略漢陽嘉三年疏勒國王獻西海青石帶魏文帝黃初元年三月濊貊扶餘單于焉耆于闐王遣使奉獻魏景初三年二月西域重譯獻火浣布梁天監九年于闐始通江左遣使獻方物齊永明九年天竺獻火浣布魏倭國獻珠錦魏志倭人在帶方東南大海之中依山島為國邑舊百餘國漢時有朝見者今使譯所通三十國景初二年六月倭女王求朝獻詔書報以綘地交龍錦皺粟罽答所獻又特賜紺地句文錦細班華罽刀鏡真珠鉛丹正始入貢白珠青大句珠異文雜錦晉大宛獻汗血馬武紀泰始六年大宛獻汗血馬焉耆來貢方物晉林邑獻象紀成帝咸康二年二月庚申高句驪遣使貢方物六年冬十月林邑獻馴象康帝建元元年十二月高句驪遣使朝獻穆帝升平元年正月扶南天竺旃檀獻馴象詔曰先帝以殊方異獸或為人患禁之今及其未至可令還本土武帝大元七年三月林邑范熊遣使獻方物九月東夷五國遣使來貢方物九年七月己酉百濟遣使來貢方物梁滑國貢黃師子白貂裘通典滑國車師别種漢順帝永建初八滑從班勇擊北虜有功以為後部親漢侯梁武帝普通初其王厭帶夷粟陀始遣使獻貢黃師子白貂裘波斯錦隋罽賓瑪瑙杯通典隋煬帝時遣韋節杜行滿使於西蕃諸國至罽賓得瑪瑙杯王舍城得佛經史國得十舞女師子皮火鼠毛而還大業中來朝者四十餘國置西戎校尉以應接之唯天竺不通唐罽賓獻名馬貢寶帶疏勒獻名馬西域傳罽賓武德二年遣使貢寶帶金鎖水精盞玻璃狀若酸棗貞觀十一年獻名馬太宗語大臣曰魏徵勸我修文德安中夏令四夷君長皆來獻此徵力也開元七年遣使獻天文及祕方疏勒貞觀九年遣使者獻名馬又四年與朱俱波甘棠貢方物上謂房玄齡等曰朕定四海逺夷率服宜相輔弼毋進諛言天寶十二載疏勒首領裴國良來朝賜紫袍金魚唐百濟獻明光鎧東夷傳百濟扶餘别種也東明之後帶方故地有八姓有元嘉厯有三島生黃漆武德四年王扶餘璋遣使獻果下馬自是數朝貢高祖册為帶方郡王百濟王後五年獻明光鎧貞觀中再遣使朝上鐡甲雕斧賜帛段三千至十九年圍遼東時百濟上金髹鎧唐高麗貢方物溫彥博傳高麗貢方物高祖欲讓而不臣彥博曰遼東本周箕子國漢玄莵郡不使北面則四夷何所瞻仰帝納而止會要武德八年三月十一日云云同上元和十三年四月進樂兩部唐林邑獻象五色帶朝霞布火珠南蠻傳環王本林邑也至德後更名王所居曰占城武德中其王范梵志再遣使獻方物六年二月也八年四月己丑高祖為設九部樂饗之貞觀四年五月王頭黎獻馴象鏐鎖五色帶朝霞布火珠與婆利羅剎二國使者偕來八年又獻五色鸚鵡有詔還之十四年獻通天犀永徽總章中纍獻馴象舊紀永徽四年四月戊子林邑王遣使來朝貢馴象開元中又獻馴象貞元九年十月癸酉貢犀牛上令見于太廟藝文志林邑國記一卷以二月為嵗首稻歲再熟齊永明九年五月獻金簟唐于闐入獻傳貞觀六年于闐遣使入獻後三年遣子入侍阿史那社爾平龜兹其王伏闍信大懼使子獻橐它三百長史薛萬備願假輕騎羈于闐王獻京師社爾許之至于闐陳唐威靈勸入見天子乃隨使者來會德宗求玉唐康國獻師子馬金桃舊紀貞觀九年四月壬寅康國獻師子會要兼本傳本康居之裔武德七年其王屈术支獻名馬康國康居國也是大宛馬種形容極大武德中康國獻四千匹今官馬猶是其種貞觀五年請臣太宗郤不