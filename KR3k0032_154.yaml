質築館以受降質魏志鮮卑傳青龍元年歸泥降拜歸義王賜幢麾曲蓋鼓吹居并州漢臨軒賜單于南胸奴傳漢漢安二年六月丙寅立南胸奴兜樓儲為單于上親臨軒授璽綬引上殿賜車馬器服金帛詔太常大鴻臚與諸國侍子於廣陽城門外祖會饗賜作樂角抵百戲唐賜薛延陀精刀寶鞭薛延陀傳貞觀二年太宗册拜夷男為真珠毗伽可汗建牙鬱督軍山三年八月丙子其弟統特勒入朝帝以精刀寶鞭賜之曰下有大過者以吾鞭鞭之夷男以為寵頡利大懼始遣使稱臣請尚主年月據通鑑唐宴蠻夷玄武門實録貞觀七年正月癸巳宴三品已上及州牧蠻夷酋長於玄武門奏七德九功之舞會要貞觀十四年宴羣臣及河源王諾曷鉢于玄武門奏倡優百戲之樂賜物有差唐賜思摩鼓纛會要貞觀十年二月封吐谷渾諾曷鉢為河源郡王賜以鼓纛十二月來朝實録貞觀十三年七月庚戌詔李思摩為乙彌泥孰俟利苾利苾可汗賜之鼓纛其行也上為置酒御齊政樓餞之思摩奉觴上萬歲壽願子孫世事唐以報厚德就其部築壇場河上拜受册通鑑開元八年四月丙午遣使賜烏萇骨咄俱位王册命三國皆在大食之西大食欲誘之叛不從故褒之唐賜回紇玄金魚符錦文袍寶刀珍器芳蘭殿賜宴天成殿十部樂朱提瓶回紇傳貞觀三年始來朝獻方物突厥已亡惟回紇與薛延陀最雄其酋胡祿俟利發吐迷度與諸部攻薛延陀破之遣使者獻欵二十年太宗為幸靈州次涇陽受其功紀二十年八月己巳宴通鑑八月庚午車駕至涇陽辛未詔回紇等使賜酋長璽書遣中郎將安永壽報使壬申上幸漢故甘泉宫詔以鐡勒百餘萬戶委身內屬備禮告廟九月上至靈州於是鐡勒十一部皆來言薛延陀不事大國以自取亡今各有分地願歸命天子請置唐官有詔張飲高會太宗為五言詩敘其事引見渠長以唐官官之凡數千人明年復入朝二十一年正月丙申乃以回紇部為瀚海多濫葛部為燕然僕骨部為金微拔野古部為幽陵同羅為龜林思結為盧山皆號都督府餘部皆以酋領為都督刺史即故單于臺置燕然都護府統之六都督七州皆隸屬以李素立為燕然都護都督刺史給金魚符黃金文天子方招寵逺夷作絳黃瑞錦文袍寶刀珍器賜之會要云親賚緋黃瑞錦及褾領袍捧戴拜謝帝坐袐殿陳十部樂通鑒云上御天成殿殿前設高坫置朱提瓶其上實録云銀瓶潛泉浮酒自左閣通坫趾注之瓶轉受百斛鐐盎回紇數千人飲畢尚不能半又詔文武五品祖飲尚書省實録云尚書都堂渠長共言生荒陋地歸身聖化天至尊賜官爵與為百姓依唐若父母然請於回紇突厥部治大塗號參天至尊道世為唐臣乃詔置過郵六十八所具羣馬湩肉待使客歲內貂皮為賦乃拜吐迷度為懷化大將軍瀚海都督龍朔三年二月以燕然都督府領回紇更號瀚海都護府以磧為限磧北諸蕃皆隸之通鑑貞觀二十年十二月戊寅回紇多濫葛僕骨拔野古同羅思結渾斛薛奚結阿跌契苾白霫酋長皆來朝庚辰上賜宴芳蘭殿命有司百日一會二十一年正月丙申以酋長為都督刺史賜袍己未上御天成殿宴一云二十二年正月己未設十部樂而遣之正月甲寅以中外又安賜酺二十二年二月結骨入朝上宴之於天成殿謂侍臣曰昔渭橋斬三突厥首自謂功多今斯人在席更不以為怪耶戊午以為堅昆都督府是時四夷君長爭遣使入獻見元正朝賀常數百千人辛酉上引見諸胡使者謂侍臣曰漢武窮兵所獲無幾豈若今日綏之以德使窮髮之地盡為編戶乎六月乙丑以白霫部為居延州唐兩儀殿宴西突厥見上壽類唐相思殿太饗上壽又見上通鑑貞觀十六年九月癸亥薛延陀真珠可汗請昏獻馬三千貂皮三萬八千瑪瑙鏡一十七年閏六月使其姪突利設來納幣獻馬五萬匹牛槖駝萬頭羊十萬庚申突利設獻饌上御相思殿大饗羣臣設十部樂突利設再拜上壽賜賚甚厚傳召突利失大享羣臣侍陳寶器奏慶善破陳盛樂及十部伎突利失頓首上千萬歲壽唐宴賀魯嘉壽殿傳賀魯內屬會討龜兹請先馳為向導詔授崑丘道行軍總管宴嘉壽殿厚賜豫解衣衣之貞觀二十二年四月乙亥賀魯帥千餘帳內屬唐宴日本麟德殿傳長安元年會要三年日本遣朝臣真人貢方物宴麟德殿授司膳卿唐前殿勞賜唐書傳烏質勒部娑葛襲爵神龍中詔十姓可汙阿史那懷道持節册命景龍中遣使入謝中宗為御前殿引萬騎羽林二仗引見勞賜箇失密開元八年遣使者物理多來朝宴中殿唐賜天竺錦袍金帶賜南詔金印見上傳開元時中天竺遣使者三至南天竺獻五色能言鳥丐名其軍玄宗詔賜懷德軍會要開元八年五月使者曰蕃夷惟以袍帶為寵帝以錦袍魚袋并七事賜之貞觀二十三年六月十日于闐王伏闍信來朝賜金帶錦袍唐紫宸殿宴突厥使內殿宴吐蕃傳開元十三年四月突厥默棘連遣大臣阿史德頡利發入獻遂從封禪詔四夷諸酋入仗佩弓矢令馳射扈封畢厚宴賜遣之十五年九月丙戌遣梅録啜入貢初吐蕃約與連和冦邊不從封上其書天子嘉之宴使者紫宸殿詔朔方西受降城許互市歲賜帛數十萬天寶元年九月辛亥御花萼樓宴突厥降者會要開元二年五月吐蕃使宰相尚欽藏御史名悉獵來獻盟書通鑑六月丙寅玄宗御承天門樓命有司引見置酒內殿宴遣之唐丹鳳樓宴突騎施突厥通鑑開元十八年突騎施遣使入貢上宴之於丹鳳樓突厥使者豫焉二使爭長乃命設東西幕突厥在東突騎施在西舊紀開元九年九月丁巳御丹鳳樓宴突厥首領二十四年八月甲寅以突騎施遣首領胡祿達于求和宴于內殿賜錦衣一副帛綵百開元七年三月壬子御丹鳳樓宴九姓同羅及契丹乾元二年八月壬戌十姓突騎施并波斯貢物宴于內殿唐賜新羅瑞文錦繡袍傳開元中賜王興光瑞文錦五色羅紫繡紋袍金銀精器唐月魚會要故事西蕃諸國銅魚雌雄相合銘其國名第一至十二雄者留內雌者付本國以國使正月來者賫第一魚餘月凖此閏月即賫本月而已校其雌雄合乃依常禮待之差即推按開元十六年十一月五日以突騎施叛多散失鴻臚改鑄制可又見符節唐賜吐蕃五經會要兼本傳開元十九年實録十八年吐蕃請五經吐蕃又請五經敕祕書寫賜正月二十四日賜以毛詩禮記左傳文選于休烈上疏言不可裴光庭曰西戎請詩書庶使漸陶聲教上曰善乃與之實録七月癸未命有司寫詩禮賜金城公主休烈諫八月辛卯降書與吐蕃通鑑十九年正月辛未遣崔琳使吐蕃金城公主求書實録誤在前年七月二十六年六月二十七日渤海求寫唐禮及三國志晉書三十六國春秋許之唐賜新羅晉書見前唐護蜜入朝宴內殿西域傳護蜜亦吐火羅故地元魏曰鉢和顯慶時以地為鳥飛州開元八年册為王十六年與米忽汗同獻方物二十九年王護真檀入朝宴內殿拜左金吾將軍賜紫袍金帶天寶賜鐡劵八載來朝請宿衛又遣首領朝貢乾元元年其王來朝賜氏李通鑑開元十八年十月甲寅護蜜王羅真檀入朝留宿衛天寶元年九月戊午護蜜王頡吉里匐請降唐賜拔悉蜜金鈿帶突厥傳拔悉蜜天寶初擊突厥立大酋阿史那施為賀臘毗伽可汗遣使者入謝玄宗賜紫文袍金鈿帶魚袋突騎施可汗蘇祿開元五年來朝拜羽林大將軍賜錦袍鈿帶魚袋七事六年五月辛亥為羽林順國公金方道經略大使七年十月壬子册拜蘇祿為忠順可汗唐宴東蠻麟德殿東蠻三王來朝南蠻傳烏蠻分七部其語四譯乃與中國通有卭部六姓勿鄧南七十里有兩林勿鄧豐琶兩林謂之東蠻天寶中受封爵後屬吐蕃貞元中復歸欵兩林王苴那時遺韋臯書乞兵攻吐蕃韋臯傳貞元五年東蠻斷瀘水橋攻吐蕃臯遣將劉彰彩出銅山道吳鳴鶴出清溪關道鄧英俊出定蕃柵道逼臺登城苴那時戰甚力分兵大破吐蕃青海臘城二節度軍於北谷進拔于蔥柵詔封苴那時順政郡王苴夢衝勿鄧懷化郡王驃傍和義郡王豐琶部落給印章袍帶三王皆入朝宴麟德殿賞賚加等歲給祿鹽衣綵黎嶲二州築館授賜而遣之通鑑貞元四年驃傍苴夢衝烏星入見五月乙卯宴麟德殿封王給印唐麟德殿賜室韋會要會昌二年十二月御麟德殿引見室韋首領督熱論等十五人宴賜有差唐高麗求書傳高麗嘗遣使求歐陽詢書新羅國人傳馮定黑水碑畫鶴記西蕃所館寫定商山記於屏新羅日本使至為出金寶求張鷟之文建隆賜李彛興玉帶建隆三年四月彛興遣使貢馬上以玉帶賜之至道二年七月賜交趾玉帶淳化賜占城馬淳化三年十二月占城來貢賜其王白馬兵器景德元年九月賜占城良馬二祥符四年七月辛巳賜蒲端國旗幟鎧淳化賜高麗九經祥符賜經文政和賜雅樂寶尊高麗國後唐長興中王建代高氏為君長命為玄莵州都督封國王建隆二年三月賜王昭衣帶鞍馬三年十一月遣使來貢乾德三年正月獻錦罽刀劒開寶九年九月王胄遣入貢太宗時遣金行成就學胄監興國二年擢第雍熙三年十月又遣崔罕等肄業淳化元年十月王治遣使朝貢進奉使韓彥恭等獻神龜壽樽賜銀帶又賜以藏經及御製祕藏詮等二年二月治又遣使謝四年十一月二十七日庚辰治因劉式等復命上言願賜板本九經從之咸平三年十月王誦遣周仁紹至登州自陳慕化之意召見便殿賜誦鈿函詔祥符八年十二月癸酉遣使郭元至闕下請賜厯日及登科記御製賜詩九年正月丙寅郭元辭賜王詢詔書七函衣帶器幣鞍馬九經史記兩漢書三國志晉書諸子厯日聖惠方從其請也天禧五年九月入貢表請陰陽地理書從其請景祐元年四月三日舍人院試賓貢進士康撫民詩論各一賜同出身元豐元年正月草五日遣安燾等使其國先是王徽屢入貢二年六月錢藻等修高麗入貢儀式八年十一月十二日錢協再看詳李士京編修元祐元年二月賜文苑英華八年正月請太平御覽不許又請册府元龜歷代史政和五年十月遣金端等五人入太學七年二月賜雅樂及樂譜三月賜籩豆十二簠簋四登一鉶一鼎二罍洗一尊二銘曰惟爾令德孝恭世稱東藩用錫寶尊以寧爾祖考子子孫孫其永保之十二月修高麗敕令格式例儀範坐圖太宗命起居舍人吕祐之使高麗復命獻海外覃皇澤詩十九章咸平賜龜兹錦衣金帶咸平四年二月龜兹王祿勝奉表來貢詔賜暈錦衣一襲金帶銀器祥符賜交趾御書祥符三年三月十三日李公藴貢方物詔賜大宗御製御書一百卷軸景德賜交趾九經賜占城神旗景德四年七月丙子賜黎龍廷九經從其請也八月庚子蒲端國進貢使上言伏見占城使蒙恩賜鞍勒馬二神旗二願依例霑賚有司以蒲端在占城之下請給雜采小旗五從之九月己巳鑄交趾郡王印製安南旌節付廣南運司賜之祥符二年二月辛卯賜大食鞍馬旗幟太平興國元年十二月辛酉契丹使歸國賜器幣金蹀躞帶以遣之嘉祐賜夏國九經嘉祐七年四月諒祚上表求太宗御製真草及九經册府元龜唐書詔止以九經賜之八年四月英宗即位後以九經及正義孟子醫書賜夏國從所請也端拱二年五月十五日親書五色金花箋賜李繼捧姓名趙保忠治平賜李日尊衣帶治平四年賜李日尊對衣金帶銀器銀鞍轡馬紹興二十五年七月賜李天祚襲衣銀器金御仙花帶鞍轡二十六年八月乙未賜天祚襲衣金帶鞍馬器幣以其來貢也淳熙四年四月賜李龍翰馬二匹金鍍銀鞍轡金帶銀匣楊子訩訩北夷被我純繢帶我金犀觀月窟之入附覩日勒之來遊羽族卉儀懷音革狀辨髮左衽之酋欵關請吏木衣卉服之長航海來庭豈惟肅慎獻楛越裳薦翬而已通鳳冗以文軌襲龍庭以冠帶舍夷言於藳街陳方物於王會流沙蟠木鳳穴龜林異類歸欵萬方宅心鴻臚納賮王會書琛青雲干吕薰風入琴方志亦不傳荒經所不載地彌天區界軼海外章亥所步禹契所書四面輻湊各修貢職怛威愧德繩谷鈎山驛化馳威風揮日舒咸順指令被風濡化藁街質館致其俘入恩澤布濩嚚頑簫勺日月所照梯山航海風雨所均削衽襲帶玉海卷一百五十四
