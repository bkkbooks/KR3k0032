body:
  text: 玉海卷六十三宋王應麟撰藝文藝術漢志曰數術者明堂羲和史卜之職方技者生生之具王官之一守也周三兆三夢龜八命四兆占書六龜十龜九簭八簭六夢春官太卜下大夫二人掌三兆之法一曰玉兆杜子春云顓頊之兆二曰瓦兆帝堯之兆三曰原兆有周之兆經兆之體皆百有二十其頌皆千有二百兆者灼龜發於火其形可占者有象似玉瓦原之舋鏬上古以來作其法原原田頌謂繇也之疏近師皆以為夏殷周兆易氏曰玉陽也卜得陽數竒其象在上在左曰玉瓦隂也卜得隂數之耦其象在下在右曰瓦兆原再也竒耦錯列再以其變推之曰原兆三易之法見易類三夢之法一曰致夢言夢之所至夏后氏作二曰觭夢讀如掎言夢之所得殷人作三曰咸陟言夢之皆得周人作其經運十其别九十每輝九變此術今亡以邦事作龜之八命一曰征司農云征伐人康成云行巡守二曰象災變雲物器有所造立易曰制尚象三曰與子人物事所與共四曰謀謀議也五曰果事成與不子以勇決為之若楚司馬魚卜戰令龜六曰至謂至與不也七曰雨謂雨不也八曰瘳謂疾瘳不也其國之大事待蓍龜而決者有八定作辭於將卜以命龜也以八命者贊三兆三易三夢之占以觀國家之吉凶詔救政司農云以八事命卜筮蓍龜參之以夢春秋傳曰筮襲於夢武王所用疏凡命龜辭大夫以上有三命筮辭有二士命龜辭有二命筮辭一卜師上士四人掌開龜之四兆一曰方兆二曰功兆三曰義兆四曰弓兆開開出其占書也經兆百二十體此言四兆者分之為四部若易之二篇書金縢曰開籥見書是謂與方功義弓之名未聞凡卜辨龜之上下左右隂陽授命龜者詔相之卜人中士六人下士十有六人唐六典太卜令雜龜之九類五色依四時用之石泉蔡江洛海河淮旱春用青夏赤秋白冬黑四季用黃龜人中士二人掌六龜之屬各有名物屬言非一也天龜曰靈屬地龜曰繹屬東龜曰果屬西龜曰靁屬南龜曰獵屬北龜曰若屬各以其方之色與其體辨之東方發生有果於必為之義南方假火有獵而相較之義凡取龜用秋時攻龜用春時各以其物入于龜室注色謂天龜玄地龜黃東龜青西龜白南龜赤北龜黑爾雅同龜俯者靈仰者繹前弇果後弇獵左倪靁右倪若是其體也爾雅左倪不類即靁也右倪不若即若也東龜南龜長前後在陽象經也西龜北龜長左右在隂象緯也天龜俯地龜仰東龜前南龜卻西龜左北龜右各從其耦也疏龜有六室六龜各入於一室易損卦六五或益之十朋之龜鄭注引爾雅有十龜一曰神龜龜之最神明者在宫沼者二曰靈龜涪陵郡出大龜甲可以卜緣中文似玳瑁俗謂為靈龜即今大觜蠵龜也與天龜靈屬一也一曰靈蠵能鳴也三曰攝龜小龜也腹甲曲折解能自張閉好食蛇江東呼為陵龜也當周禮地與四方之龜皆有奄斂之義四曰寶龜大寶龜也即遺我大寶龜皆樂記青黑緣公羊青純是也五曰文龜甲有文采者河圖丹甲青文是也河圖云靈龜負書丹甲青文六曰筮龜常在蓍叢下者七曰山龜八曰澤龜九曰水龜十曰火龜山澤水火各言生出之所也火龜猶火鼠也禮記正義同通大凡神靈寶文攝唯五體而已侯曲禮正義案白虎稱三正記天子龜一尺二寸諸一尺大夫八寸士六寸九少牢大夫立筮鄭云大夫蓍長五尺推此而言天子尺諸侯七尺士三尺龜隂數偶蓍陽數竒箠氏下士二人共燋契吹焌契以授卜師占人下士八人掌占龜以八簭占八頌以八卦占簭之八故以眂吉凶注謂將卜八事先以筮筮之非八事則用九筮凡卜簭君占體大夫占色史占墨卜人占坼體兆象也色兆氣也墨兆廣也坼兆舋也體有吉凶色有善惡墨有大小圻有微明簭人中士二人掌三易以辨九簭之名曰巫更九巫讀為筮筮遷都邑巫咸筮衆心歡不巫式制作法式巫目事衆筮其要巫易所改易巫比與民和比巫祠筮牲與日巫參筮御與右巫環筮可致師不也凡國之大事先簭而後卜正義易伏羲為之巫咸為揲蓍之法世本巫咸作筮占夢中士二人掌其嵗時觀天地之會辨隂陽之氣以日月星辰占六夢之吉凶一曰正夢無所感動二曰噩夢驚愕而夢三曰思夢覺時思念四曰寤夢覺時道之而夢五曰喜夢喜悅而夢六曰懼夢恐懼而夢季冬聘王夢獻吉夢于王舍萌四方贈惡夢漢志黃帝長栁占夢十一卷甘德十卷詩隋志京房占夢書三卷占泰誓朕夢協朕卜乃占我夢史記秦有夢博士大禹謨帝曰官占惟先蔽志昆命于元龜洪範七稽疑擇建立卜筮人乃命卜筮龜曰卜蓍曰筮大誥寧王遺我大寶龜紹天即明命洛誥惟洛食詩爰始爰謀爰契我龜宅是鎬京維龜正之曲禮假爾泰龜有常假爾泰筮有常卜筮不過三卜筮不相襲龜為卜策為筮卜筮者先聖王之所以使民信時日敬鬼神畏法令也使民決嫌疑定猶與也衛成昭兆句臧氏蔡僂祭義易抱龜南面左傳晉卜人曰筮短龜長晉韓簡曰龜象也筮數也物生而後有象象而後有滋滋而後有數吳語貞於陽卜注問卜內曰隂外曰陽夏官疏龜取生數一二三四五蓍取成數六七八九十曲禮疏劉向云龜之言久蓍之言耆龜千嵗而靈蓍百年而神白虎通龜之言久也蓍之言耆也崔靈恩云凡卜筮天子皆用三代蓍龜班固典引曰經五繇之碩慮周醫師天官醫師掌醫之政令聚毒藥以共醫事凡邦之有疾病者疕瘍者造焉則使醫分而治之嵗終則稽其醫事疾醫掌養萬民之疾病以五味五穀五藥養其病五藥草木蟲石榖也以五氣五聲五色眂其死生兩之以九竅之變參之以九藏之動凡民之有疾病者分而治之乂食醫瘍醫獸醫吕氏春秋巫咸初作醫世本説文同帝王世紀黃帝使岐伯嘗味草木定本草經造醫方物理論夫醫者非仁愛不可託非聰明理達不可任非亷潔淳良不可信古之用醫必選名姓之後晉龜經隋志龜經一卷晉掌卜大夫史蘇撰梁有十卷崇文目龜經三卷史蘇撰龜經一卷又三卷春秋龜策經一卷龜經要略一卷南史柳世隆著龜經祕要二卷張衡傳注龜經有棲鶴兆晉文公遇黃帝戰于阪泉之兆漢文帝兆得大橫梁后兆得壽房漢蓍龜十五家蓍書藝文志龜書五十二卷夏龜二十六卷南龜書二十八卷巨龜三十六卷雜龜十六卷蓍書二十八卷周易三十八卷周易明堂二十六卷周易隨曲射匿五十卷大筮衍易二十八卷大次雜易三十卷鼠序卜黃二十五卷於陵欽易吉凶二十三卷任良易旗七十一卷易卦八具右蓍龜十五家一百四卷蓍龜者聖人之所用也書曰汝則有大疑謀及卜筮易曰定天下之吉凶莫善於蓍龜及至衰世解於齊戒而屢煩卜筮神明不應故筮瀆不告易以為忌龜厭不告詩以為刺易繫辭蓍之德圓而神説卦幽贊神明而生蓍注受命如響不知所以然而然説文蓍生千嵗三百莖易以為數天子九尺魏管輅云靈蓍者二儀之明數隂陽之幽契漢數術六種志自泰一雜子星至圖書祕記為天文二十一家天文者序二十八宿步五星日月以紀吉凶之象聖人所以參政也易曰觀乎天文以察時變自黃帝五家厯至杜忠算術為厯譜十八家厯譜者序四時之位正分至之節會日月五星之辰以考寒暑殺生之實自泰一隂陽至五音定名為五行三十一家五行者五常之形氣也自龜書至易卦八具為蓍龜十五家見上自黃帝長柳占夢十一卷至種樹臧果相蠶十三卷為雜占十八家三百一十三卷雜占者紀百事之象侯善惡之徵易曰占事知來自山海經至相六擾為形法六家百二十二卷形法者大舉九州之藝以立城郭室舍形人及六畜骨法之度數器物之形容以求其聲氣貴賤吉凶凡數術百九十家二千五百二十八卷數術者皆明堂羲和史卜之職也春秋時魯有梓慎鄭有禆竈晉有卜偃宋有子韋六國時楚有甘公魏有石申夫漢有唐都庶得粗粗蓋有因而成易無因而成難故因舊書以序數術為六種漢方技四種志自黃帝內經十八卷至旁篇為醫經七家醫經者原人血脈經絡骨髓隂陽表裏而用度針石湯火所施調百藥齊和之所宜自十二病方至神農黃帝食禁為經方十一家經方者本草石之寒溫量疾病之淺深假藥味之滋因氣感之宜辨五苦六辛致水火之齊以通閉解結反之於平自容成隂道至三家方為房中八家房中者情性之極至道之際是以聖王制外樂以禁內情而為之節文自宓戲雜子道至泰一雜子黃冶為神仙十家神仙者所以保性命之真而遊求於其外者也凡方技三十六家八百六十八卷方技者皆王官之一守也太古有岐伯俞拊中世有扁鵲秦和蓋論病以及國原診以知政漢興有倉公今其技術暗昧故論其書以序方技為四種禮疾醫注治合之齊存乎神農子儀之術察其盈虛休王吉凶可知審用此者莫若扁鵲倉公參兩變動能專是者其唯秦和乎岐伯俞拊兼彼數術疏案劉向云扁鵲使子儀脈神又中經簿云子義本草經一卷儀與義一人也子義亦周末時人張仲景金匱云神農能嘗百藥史記秦越人傳長桑君禁方書淳于意受陽慶禁方定可治及藥論甚精詔問太倉長臣意方技所長有其書無有安受學公孫光善為古傳方黃帝內經黃帝九經八十一難經漢志醫經七家二百一十六卷黃帝內經十八卷外經三十七卷扁鵲內經九卷外經十二卷白氏內經三十八卷外經三十六卷旁篇二十五卷隋志黃帝甲乙經十卷晉一卷梁十二卷唐志十二卷八十一難二卷素問九卷唐志黃帝明堂經三卷楊玄注黃帝內經明堂十三卷秦越人黃帝八十一難經二卷王勃序曰八十一難經醫經之祕録也岐伯授黃帝黃帝歷九師以授伊尹伊尹授湯湯歷六師以授太公太公授文王文王歷九師以授醫和醫和歷六師以授秦越人秦越人始定立章句歷九師以授華他華他歷六師以授黃公黃公以授曹夫子元全元起注黃帝素問九卷王砅注素問二十四卷釋文一卷砅號啓玄子黃帝內經太素三十卷書目太素經三卷蘭內經者黃帝藏之靈而天元紀論而下七篇明五運六氣陽晉皇甫謐傳曰黃帝創制於九經漢淳于意師公乘慶傳黃帝扁鵲脈書上下經中興書目黃帝內經素問十四卷王砅注八卷全元起注序云素者本也問者黃帝問岐伯也陳性情之原五行之本故名黃帝坐明堂之上與岐伯上窮天紀下極地理逺取諸物近取諸身更相問難雷公之倫授業傳之而內經作矣秦和述六氣之論越人演述難經倉公傳其舊學仲景撰其遺論晉皇甫謐刺為甲乙隋楊上善纂為太素唐王砅篤好之為次注班固曰內經十八卷素問即其經之九卷兼靈樞九卷第七一卷師氏藏之今唯行八卷皇甫謐甲乙經序云七略藝文志內經十八卷今有針經九卷素問九卷即內經也張仲景云撰用素問則素問之名雖著於隋志而己見於漢代隋全元起注已亡第七卷唐寶應初王砅自謂舊藏之卷凡八十一篇析為二十四卷而注之皇朝林億等校正孫兆重改誤億以天元紀大論等七篇所載與素問略不相通疑是隂陽大論之文砅取以補所亡云黃帝靈樞經書目黃帝靈樞經九卷黃帝岐伯雷公少俞伯高答問之語隋楊上善序凡八十一篇針經九卷大氐同亦八十一篇針經以九針十二原為首靈樞以精氣為首又間有詳略王砅以針經為靈樞故席延賞云靈樞之名時最後出漢六緯河洛七緯內學李尋傳五經六緯注孟康曰六緯五經與樂緯也後樊英傳善風角星算河洛七緯注七緯者易緯稽覽圖乾鑿度坤靈圖通卦驗是類謀辨終備也書緯琁璣鈐考靈曜刑德放帝命驗運期授也詩緯推度災汜歷樞含神務也禮緯含文嘉稽命徵斗威儀也樂緯動聲儀稽耀嘉叶圖徵也孝經緯援神契鉤命決也春秋緯演孔圖元命包文耀鉤運斗樞感精符合誠圖考異郵保乾圖漢含孳佑助期握誠圖潛潭巴説題辭也隋志自河圖至孝經內事十三部九十二卷通計六書合三十二部三百三十二卷其書出于前漢河圖九篇洛書六篇云自黃帝至周文王所受本文又别有三十篇云自初起至于孔子九聖之所增演以廣其意又有七經緯三十六篇並云孔子所作并前合為八十一篇光武以圖讖興遂盛行于世宋大明中始禁圖讖隋煬帝又焚之自是無復其學祕府亦多散亡元魏太和九年正月戊寅禁圖讖今録其見存者以備異説河圖二十卷梁河圖洛書二十四卷目録一卷亡河圖龍文一卷易緯八卷鄭玄注梁有九卷尚書緯三卷梁六卷中候五卷梁八卷今殘缺並鄭玄注詩緯十八卷魏博士宋均注梁十卷禮緯三卷鄭玄注亡禮記默房二卷宋均注梁三卷鄭玄注亡樂緯三卷宋均注春秋災異十五卷鄱萌撰梁有春秋緯三十卷宋均注春秋內事四卷包命二卷祕事十一卷書易詩孝經春秋河洛緯祕要一卷五帝鈎命決圖一卷亡孝經鈎命決六卷孝經援神契七卷並宋均注孝經內事一卷梁有孝經雜緯十卷宋均注孝經元命包一卷孝經分野圖一卷孝經內事星宿講堂七十二弟子圖一卷論語讖八卷宋均注堯戒舜禹一卷唐志讖緯自宋均注易緯至鄭玄注詩緯二家九部八十四卷均注易詩禮樂春秋論語孝經緯玄注詩書緯中興書目讖緯五家十三卷文心雕龍正緯曰按經驗緯其偽有四八十一篇皆託於孔子或説隂陽或序災異若鳥鳴似語蟲葉成字通儒謂為起哀平張衡云至光武篤信斯術學者比肩沛獻集緯以通經沛王通論曹褒撰讖以定禮是以桓談疾其虛偽談上疏巧慧小才伎數之人矯稱讖記尹敏戲其深瑕敏曰讖書非聖人所作頗類世俗之辭張衡發其僻謬衡以圖緯虛妄非聖人之法上疏宜禁絶之荀悅明其詭誕申鑒俗嫌第三世稱緯書仲尼之作臣悅叔父爽辨之蓋發其偽也列傳郅惲上書王莽曰漢歷久長孔為赤制莽以惲據經讖難即害之蘇竟善圖緯孔丘祕經為漢赤制朱浮講圖讖張純以建辟雍案七經讖注謂書禮樂易春秋及論語也尹敏世祖以敏博通經記令校圖讖儒林景鸞受河洛圖緯儒林薛漢建武初為博士受詔校定圖讖儒林曹褒次序禮事依準舊典雜以五經讖記之文樊倏以讖記正五經異説韓説善圖緯之學鄭玄通京氏易馬融集諸生考論圖緯聞玄善算乃召見玄曰時覩祕書緯術之奧注中候賈逵擲讖互異三十餘事張衡集上事云河洛五九六藝四九謂八十一篇也注楊厚引見問以圖讖翟酺善圖緯天文歷算著援神鈎命解詁十二篇孝經緯篇名趙典學孔子七經河圖洛書內外藝術靡不貫綜注劉瑜尤善圖讖天文歷算之術徐稚兼綜星官算歷河圖七緯注申屠蟠明圖緯李固明河圖讖緯注任安從楊厚學圖讖究極其術儒林法真博通內外圖典逸民方術傳序緯候之部注七經緯尚書中候光武尤信讖言王梁孫咸名應圖籙越登槐鼎之任鄭興賈逵以附同稱顯桓談尹敏以乖忤淪敗自是習為內學尚竒文貴異數注內學謂圖讖之書其事祕密故稱內李郃善河洛風星公沙穆鋭思河洛推步之術祭祀志封禪文曰建武元年以前舊典不具不能明經文以章句細微相況八十一卷其十卷皆不昭晳禮記郊特牲注易説疏曰易説者鄭引易緯也凡鄭云説者皆緯候也鄭志張逸問禮注曰書説何書也答曰尚書緯也嫌引祕書所牽圖讖皆謂之説禮器注孝經説曰云云月令注易及樂春秋説云云禮大司樂注孝經説曰祭天南郊就陽位疏説即緯也時禁緯故云説馮相氏注樂説云云孝經説曰云云巾車注禮家説曰云云宋志孔子告備于天曰孝經四卷春秋河洛凡八十一卷謹已備又云握河括地緑文赤字之書孔廟銘曰刪定六藝象與天談鈎河擲雒却揆未然漢綈帙祕記見天文楊春卿戒子統曰吾綈帙中有先祖所傳祕記其修之淮南有枕中鴻寶苑祕書劉德得其書更生幼而讀誦以為竒魏武四時食制文選海賦注引魏武四時食制唐志趙武四時食法一卷諸葛穎淮南王食經一百三十卷晉青囊書洞林郭璞傳妙於隂陽算厯有郭公者客居河東精於卜筮璞從之受業公以青囊中書九卷與之由是遂洞天文五行卜筮之術攘災轉福通致無方雖京房管輅不能過也璞門人趙載嘗竊青囊書未及讀而為火所焚璞撰前後筮驗六十餘事名為洞林隋志三卷又有梁元帝洞林三卷書目止存一卷載二十二事又抄京費諸家要最更撰新林十篇卜韻一篇注釋爾雅别為音義圖譜又注三蒼方言穆天子傳山海經及楚辭子虛上林賦數十萬言皆傳於世璞著客傲曰摹洞林乎連山唐志五行類郭璞周易洞林解三卷隋志新林四卷又九卷梁有周易林五卷亡易斗圖一卷郭璞撰璞集十七卷唐志五行類馬雄絳囊經一卷兵書有青囊括一卷梁真誥唐志道家十卷陶弘景撰登真隱訣二十五卷弘景撰書目真誥十卷陶弘景撰載楊權許長史口授仙真修鍊等術道書神仙修真祕訣十二卷題潁陽子撰唐本草圖志神農本草三卷雷公集撰四卷隋志四卷雷公集注吳普本草因六卷華他弟子李氏三卷原平仲靈秀本草圖六卷殷子嚴音義二卷病源合藥節度五卷要術三卷要妙五卷名醫别録三卷陶弘景集注七卷隋志同又有本草十卷太清草木方集要三卷顯慶四年司空英公李績太尉長孫無忌兼侍中辛茂將弘文館學士許敬宗禮部郎中孔志約尚藥奉御許孝崇胡子蒙蔣季璋藺復圭許弘直巢孝儉蔣季瑜吳嗣宗蔣義方蔣季琬許弘蔣茂昌以上並醫官太常丞吕才賈文通太史令李淳風潞王府參軍吳師哲禮部主事顧仁楚右監門長史蘇敬等合二十三人撰本草二十卷目録一卷藥圖二十卷圖經七卷會要顯慶二年右監門長史蘇敬言陶弘景本草事多舛謬請加刪補四年正月十七日撰成并圖五十卷詔藏祕府于志寧傳初志寧與司空李績修定本草并圖合五十四篇帝曰本草尚矣今復修之何所異耶對曰昔陶弘景以神農經合雜家别録注之江南偏方不周曉藥石往往紕繆四百餘物今考正之又增後世所用百餘物此以為異帝曰本草别録何為而二對曰班固記黃帝內外經不載本草至齊七録乃稱之世謂神農氏嘗藥以拯含氣而黃帝以前文字不傳以識相付至桐雷乃載篇册然所載郡縣多是漢時疑張仲景華他所記其别録者魏晉以來吳普李譡之所記其言華葉形色佐使相須附經為説故弘景合而録之帝曰善其書遂行或云五十三卷六典注凡藥八百五十種三百六十神農本經一百八十二名醫别録一百一十四新修本草新附一百九十四有名無用志孔志約音義二十卷隋志有姚最音義三卷蘇敬新修二十一卷又新修圖二十六卷音三卷圖經七卷甄立言一作權音義七卷藥性三卷會要甄立撰音義七卷古今録驗方五十卷孟詵食療三卷王方慶新本草四十一卷又藥性要訣五卷李含光音義二卷陳藏器拾遺十卷開元中鄭虔胡本草七卷藝術類貞觀尚方令王定畫本草訓誡圖隋志神農本草八卷帝王世紀黃帝使岐伯嘗味草木定本草經造醫方梁有五卷屬物二卷神農明堂圖一卷蔡雍本草七卷陶隱居十卷秦承祖六卷王季璞本草經三卷李譡之本草經經鈔各一卷趙贊經一卷甄氏三卷李譡之藥録六卷神農採藥經二卷名醫别録三卷陶氏撰中興書目本草圖經二十卷漢書藝文志不著録平帝紀元始五年正月舉天下通知方術本草者郊祀志成帝初有本草待詔樓護傳少誦醫經本草方術數十萬言本草之名蓋見於此梁七録載神農三卷陶隱居序云疑仲景元化等所記今以本經三品藥三百六十五種名醫副品亦三百六十五凡七百三十種合為七卷唐顯慶中李績等刋定增一百十四種廣為二十卷舊經三卷藥三百六十五種弘景進名醫别録為之注釋分為七卷李績等參考增一百十四種凡八百味廣為二十卷世謂唐本草復有圖經載形色釋同異而明皇御製又有天寶單方藥圖今存一卷蜀孟昶命韓保升等以唐本圖經參比世謂蜀本草開寶中詔盧多遜等重注嘉祐二年掌禹錫等再加校正後蜀張文懿撰本草括要詩三卷熙寧中崔源辨誤一卷鄭樵外類五卷成書二十五卷文選養生論注引天老養生經曰神農本草名醫别録經方小品養生要又引本草曰上藥一百二十種為君主養命以應天中藥一百二十種為臣主養性以應人謝靈運山居賦本草所載山澤不一雷桐是别和緩是悉參核六根五華九實二冬並稱而殊性三建異形而同出唐孔志約本草序岐和彭緩騰絶軌於前李華張吳振英聲於後桐雷衆記唐志桐君藥録三卷雷公藥對二卷璞漢司馬相如傳注郭曰藥對曰云云周禮疏見上岐黃彭扁抑揚輔導至于桐雷乃著編簡唐開元廣濟方貞元集要廣利方志玄宗開元廣濟方五卷德宗貞元集要廣利方五卷崇文目同舊紀開元十一年九月己巳頒上所撰廣濟方于天下令諸州置醫博士一人實録七月丁亥天寶五載八月癸未詔廣濟方令郡縣長吏選其要者録于大板以示坊村貞元十二年二月十三日乙丑上製貞元廣利方頒于天下揔六十三種五百八十六首親製序散題于天下通衢李吉甫傳為淮南節度使帝為御通化門祖道賜御餌禁方孫思邈千金方三十卷攝生真録一卷唐外臺祕要志王燾外臺祕要方四十卷又外臺要略十卷王燾傳性至孝為徐州司馬母有疾彌年不廢帶視絮湯劑數從高醫遊遂窮其術因以所學作書號外臺祕要討繹精明世寶焉中興書目外臺祕要四十卷唐天寶中持節鄴郡軍事兼守刺史王燾撰燾久知弘文館得古今方上自神農下及唐世無不採托集成經方四十卷以出守于外故號曰外臺祕要方皇祐中孫兆校正隋志姚僧坦集驗方十卷唐志伏適醫苑一卷甘伯宗名醫傳七卷陸贄集驗方十五卷南史陶弘景著肘後百一方開元十一年七月丁亥敕諸州寫本草及百一集驗方與經史同貯唐醫術六十四家藝術十一家志子録醫術六十四家始神農本草至崔知悌方百二十部四千四十六卷失姓名三十六家王方慶新本草至嚴龜食法不著録五十五家四百八卷明堂經脈十六家自針經至內經太素三十五部二百三十一卷雜藝術十一家自投壺經至五星等圖二十部一百四十二卷失姓名八家張彥逺歷代名畫記至李郃骰子選格不著録十六家百十七卷隋志醫方二百五十六部合四千五百十卷始於素問甲乙經終於四海類聚單要方五行二百七十二部合一千一十二卷始於黃帝飛鳥厯終於相馬經崇文目醫書六十五部一百三十卷唐太宗武德九年九月壬子詔龜易五兆之外禁雜占卜唐歷代名醫録書目七卷唐甘伯宗撰自伏羲至唐凡一百二十人唐志名醫傳同崇文目唐投壺經唐志郝沖虞談法投壺經一卷上官儀投壺經一卷朝氏志唐上官儀奉敕刪定史玄道續注采周顒郝同梁簡文數家書為之唐志有其目司馬光投壺新格一卷舊格多取竒中者以為僥幸因盡改之開寶重定本草嘉祐紹興校定本草圖開寶中命醫工劉翰道士馬志等詳定附益一百二十三種學士多遜昉蒙刋定之六年四月癸丑知制誥王祜等上之二十卷墨凡神農所説以白字别之名醫所傳字别之崇文目二十一卷御製序合九百八十三種并目二十二卷頒天下嘉祐二年八月辛酉詔掌禹錫林億蘇頌張洞等再校正既而補注成書奏御又詔天下郡縣圖上所産藥以頌刻意是書俾專撰述總二十卷圖經二十卷目録各一卷頌為之序曰主上至仁厚德函養生類屢敕近臣讐校岐黃內經重定針艾俞穴或範金揭石或鏤板聨編作慶厯善救方以賜南方作簡要濟衆方以示下民今復廣藥譜之未備圖地産之所宜納斯民於壽康召和氣於穹壤六年九月集賢校理蘇頌上之總新舊一千八十二條新補八十有二種新定十有七種合一千七十六種紹興二十七年八月十五日王繼先上校定大觀證類本草三十二卷釋音一卷詔祕省修潤付胄監鏤板行之大觀經史證類本草唐慎徽撰太平聖惠方太宗留意醫術自潛邸得妙方千餘首太平興國三年詔醫官院獻經驗方合萬餘首集為太平聖惠方百卷凡千六百七十門萬六千八百三十四首并序論總目録每部以隋巢元方病源候論冠其首凡諸論證品藥功效悉載之目録一卷御製序淳化三年二月癸未賜宰相李昉參政黃中沆樞臣仲舒準內出五部賜五月己亥頒天下諸州置醫博士掌之書目首卷興國中王懷隱等承詔㦏慶厯四年正月賜德順軍雍熙神醫普效方太平興國六年十月丙戌詔賈黃中等於崇文院編録醫書雍熙三年十月纂成千卷目録十卷名神醫普效方御製序長編四年上趙自化以醫術稱獻所撰四時養頤録真宗改名調膳攝生圖仍為製序又纘自古以方技至貴仕者為名醫顯秩傳三卷天聖校定內經素問天聖四年十月十二日乙酉命集賢校理朝宗慤王舉正校定黃帝內經素問難經巢氏元方病源候論唐志五十卷五年四月乙未令國子監摹印頒行詔學士宋綬撰病源序景祐二年七月庚子命丁度等校正素問嘉祐二年八月辛酉置校正醫書局于編修院命掌禹錫等五人從韓琦之言也琦言靈樞太素甲乙經廣濟千金外臺祕要方之類多訛舛本草編載尚有所亡於是選官校正政和八年四月二十四日詔刋正內經重和元年十一月十五日詔以內經考其常以天元玉册極其變景德龍圖閣醫書一千三百二十六卷崇文目六十五部一百三十卷國史志扁鵲針傳一卷許希請興扁鵲廟築于城西隅因立太醫局其旁希著神應針經要談天聖針經五年十月壬辰醫官院上所鑄腧穴銅人式二詔一置醫官院一置大相國寺仁濟殿先是上以針砭之法傳述不同命尚藥奉御王惟一考明堂氣穴經絡之會鑄銅人式又纂集舊聞訂正訛繆為銅人腧穴針灸圖經三卷至是上之摹印頒行翰林學士夏竦序曰聖人有天下論病以及國原診以知政王澤不流則姦生於下故辨淑慝以制治真氣不榮則疢動於體故謹醫砭以救民昔聖祖之問岐伯以為善言天必有驗於人上下有紀左右有象督任有會腧合有數盡書其言藏於金蘭之室洎雷公請問其道乃坐明堂以授之後世言明堂者以此針艾之法舊列王官之守思革其謬王惟一授禁方精厲石定偃側於人形正方寸於腧膜總會諸説勒成三篇又以傳心豈如會目著辭不如按形復鑄銅人為式內分臟腑旁注溪谷竅而達中刻題于側將使多瘠咸詔巨刺靡差案説蠲痾若對談於涪水涪翁著針經􅎃法披圖洞視如舊飲於上池長桑君以禁方傳扁鵲飲以上池之水保我黎蒸介乎壽考昔夏后敘六極以辨疾帝炎問百藥以惠人當遜德歸功矣序以天聖四年嵗次折木秋八月丙申上七年閏二月乙未賜諸州元祐八年高麗所獻書有黃帝針經正月庚子祕書監王欽臣請宣布俾學者誦習隋志黃帝針經九卷梁有黃帝針灸經十二卷唐志皇甫謐黃帝三部針經十二卷即甲乙經黃帝雜注針經一卷玉匱針經十二卷甄權脈經一卷針經鈔三卷針方一卷明堂人形圖一卷崇文目黃帝針經一卷慶厯善救方皇祐簡要濟衆方慶厯八年二月癸酉以南方病毒者乏方藥為頒善救方又嘗出通天犀命太醫和藥賜疫者皇祐三年集簡要濟衆方五卷頒行標脈證敘病源去諸家之浮冗國史志慶厯善救方一卷八年頒行紀二月癸酉皇祐簡要濟衆方一作廣濟五卷皇祐中仁宗謂輔臣曰外無善醫其令太醫簡聖惠方之要者頒下諸道仍敕長史拯濟令醫官使周應編三年頒行紀三年五月己亥頒命長史按方劑救民疾開寶修本草興國中纂聖惠方皇祐擇取精者為簡要濟衆方嘉祐間命掌禹錫等校正醫書置局編修院後徙太學十餘年補注本草修圖經而外臺祕要千金方翼金匱要略悉從摹印天下皆知學古方書天禧二年八月丁未內出鄭景岫四時攝生論陳堯叟所集方一卷示輔臣上作序紀其事命有司刋板賜廣南官仍分給天下宋朝七元圖書目一卷王欽若圖北斗及諸經符咒之法真宗御製序陳搏著指玄論八十一章言導養及還丹之事王溥著八十一章以箋其指天禧雲笈七籖書目一百二十卷天禧中張君房以道藏經書浩博乃為類例載其旨要熙寧太醫局熙寧九年五月癸亥命許將熊本提舉太醫局不隸奉常提舉一員判局二員每科置教授一學生以春試補三百人為額嵗終較功過為三等大觀中陳師文等校正和劑局方五卷一百九十七道二十一門紹興二年四月定醫官為八十五員禮部請止以四十三員為額六年正月四日置藥局四所其一曰和劑局十八年閏八月二十三日改熟藥所為太平惠民局二十一年十二月十七日以監本藥方頒諸路周天官醫師漢太醫令唐醫學政和聖濟經書目聖濟經十卷政和中御製并序體真原化慈幼達道正紀食頤守機衛生藥理審劑凡十篇隂陽適平精神內守而次凡四十二章一本云政和八年五月壬辰頒御製聖濟經以廣黃帝之傳其篇五十其章四十有二唐志梁武帝坐右方十卷神農嘗草岐伯品藥玉海卷六十三
