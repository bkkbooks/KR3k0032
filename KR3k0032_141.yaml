body:
  text: 玉海卷一百四十一宋王應麟撰兵制兵法魏武帝新書魏志太祖自統御海內芟夷羣醜其行軍用師大較依孫吳之法而因事設竒譎敵制勝變化如神自作兵書十餘萬言諸將征伐皆以新書從事從令者克捷違教者負敗抄集諸家兵法名曰接要又注孫子十三篇隋志兵書接要十卷唐志七卷兵法接要三卷魏武帝兵法一卷李靖問對引曹公新書魏兵書要略唐志魏文帝兵書要略十卷太平御覽引之隋志兵書略要九卷魏武帝撰梁有兵要二卷兵書要略五卷後周宇文憲撰梁武帝兵書要鈔一卷唐志宋高祖兵法要略一卷梁武帝兵法一卷魏兵書魏志王昶著兵書十餘篇言竒正之用青龍中奏之晉兵林隋志兵林一卷東晉孔衍撰齊漢武北伐圖闕梁玉韜隋志梁元帝玉韜十卷劉祐隋開皇中奉詔撰兵書十卷名曰金韜唐志同唐二十三家兵家藝文志丙部子録十二曰兵書類二十三家六十部三百十九卷始於黃帝問玄女法終於李淳風縣鏡失姓名十四家不著録二十五家一百六十三卷李筌注孫子以下終於張道古兵論隋志一百三十三部司馬法至象經唐兵法三等見陳法類唐兵家正史志吳兢兵家正史九卷唐四十六訣裴行儉傳為營陳步伍勝負等為四十六訣唐六軍鏡書目六軍鏡三卷李靖撰各五章以天子六軍故取為名起政理終尅敵唐諸葛亮竒正法詳見陳法李靖問對靖曰臣前進黃帝太公二陳圖并司馬法諸葛亮竒正之法此已精悉唐玉帳經李衛公問對志兵書五行類李靖玉帳經一卷李筌六壬玉帳歌十卷抱朴子外篇軍在太乙玉帳之中不可攻也崇文目彭門玉帳一卷書目李靖兵鈐新書一卷載靖與秦王論兵如問對書朝氏志李靖對太宗問兵事史臣謂李靖兵法世無完書略見於通典今對問出於阮逸家或云逸因附益之唐閫外春秋書目閫外春秋十卷李筌撰起周武王至唐武德凡八代録明君良將用兵得失以事繫年擬左丘明而為之褒貶唐太白隂經志李筌太白陰經十卷書目記出師用兵之事凡一百篇太白主兵故以為名唐臨戎孝經志兵書員半千臨戎孝經二卷小説郭良輔武孝經一卷兵書論語三卷唐天寶軍防録鄭虔傳長於地理山川險易方隅物産兵戍衆寡無不詳當為天寶軍防録志兵書類卷亡崇文目一卷唐定逺安邊䇿志郭元振定逺安邊䇿三卷書目安邊䇿三卷郭元振撰凡三篇朝氏志元振以總兵進攻聚衆退守不可無權謀乃著此書故舊題曰定逺安邊䇿唐統軍靈轄祕䇿武紀志李光弼統軍靈轄祕䇿一卷一作武記書目一名武紀述用兵為將之略凡一百二條讀書志曰其書凡五十章唐禦戎新録志兵書類李渤禦戎新録二十卷會要元和九年四月右拾遺李渤撰舊書元和初召為左拾遺家東都朝廷政有得失附章疏陳論又撰禦戎新録二十卷表獻之唐西南備邊録見録類志李德裕西南備邊録十三卷在文宗朝吐蕃間釁河隴失險締從南詔協以謀我并絡坤維我棘守臣韋臯鑿青溪道要結蠻好掎鹿效順纂集事狀為卷十七質幣結轍闓户誨盜爰命德𥙿改紀其政乃建籌邊之樓凡險要與蠻相入者圖之左與戎密邇者圖之右而部落饋運靡不察乃立雄邊之軍其精兵曰南燕及連弩騎士曰飛星及突騎而農戰器械靡不飾仗義城以制大度清溪關之阻作禦侮城以控榮經犄角勢作柔逺城以扼西山吐蕃復卭崍關從巂州治臺登以奪蠻險猶慮敵去而備弛也兵將糧械之數城鎮種落之名嵗計經用之目講求利病輯為一書諸郡固實外夷情狀臚分縷析粲如指掌創立陴壘咸以朱書總繪小圖標之首卷而第四卷敘維州本末尤詳書成於太和六祀逮會昌中秉國之均始奏上之唐藝文志列在兵書今館閣書目存者一卷唐兵要闕唐兵書兵書要訣志王公亮兵書十八卷長慶元年上杜希全新集兵書要訣三卷張道古兵論一卷唐裴子新令志新令二卷裴緒撰書目採拾諸家部署習練等法及五行諸陳形勢凡三十一章建隆軍律張方平言太祖訓齊軍法甚嚴軍人不得衣皂但許衣褐制不得過膝蔥韭不得入軍門又制更戍之法逺妻孥外戍之日多人人少家纍衣食易足每月請糧營在城西者即於城東支不許顧車乘須令自負以勞役之故士卒足衣食無外慕安辛苦而易使范祖禹言祖宗兵法本於樞密有發兵之權而無握兵之重京師之兵總於三司有握兵之重而無發兵之權彼此相維不専制此所以百三十年無兵變太平興國軍誡太平興國八年六月己亥以宣徽南院使樞密副使王顯為樞密使上召謂顯曰卿世非儒家少罹兵患必寡學問今在朕左右典掌萬機因年暇博覽羣書左右取軍誡三篇賜顯曰讀此亦可以免面牆矣富弼政要釋曰大臣不知學術則暗於大體王顯一武人雖以才力任用至樞密使太宗慮其不學不能曉通變之事故以軍戒授之使知賢者行事也唐藝文志裴守一軍誡三卷端拱二年春户部郎中張洎奏議曰軍志曰凡臨敵法令不明賞罰不信聞鼓不進聞金不止雖有百萬之師何益於用又曰將從中御兵無選鋒者必敗臣頃聞涿州之戰元戎不知將校之能否將校不知三軍之勇怯各不相管轄以謙謹自任未聞賞一功臣戳一叛命也軍志曰弩不及逺與短兵同射不能中與無矢同中不能入與無鏃同臣聞涿州之戰敵人未至萬弩齊張虜騎既還箭如山積乃知戈戟刀劒其用皆然是驅天兵奮空弩而對勍敵也軍志曰三軍耳目在吾旗鼓臣頃聞涿州之戰陳場既布或取索兵仗或遷移部隊萬口傳呌囂聲沸騰乃至轍亂塵驚莫知攸往昔湯武戡定天下桓文攘却四夷項羽之滅強秦闔閭之摧徑楚隋楊素削平禍亂悉以銛鋒而定戎業臣頃聞涿州之戰王師霧集聲怛強敵然而矢石未交竒正先亂嗚呼軍政如此孰救敗亡尚賴天威逺臨全師以濟陛下懲覆車於既往收大功於將來若不揭重賞以圖其勞示嚴刑以齊其後置三軍於死地然後為用則不能集大勳而摧徑敵矣軍志曰凡出師臨陳一夫不用命則斬一夫一校不用命則斬一校一隊不用命則斬一隊故穰苴斬愛姬成蕩冦之勳魏絳戮揚干顯臨戎之烈諸葛亮斬馬謖定庸蜀之士李光弼斬崔衆摧燕薊之師闕嚴刑方成大略臣請陛下申命元帥自禆闕以降有違犯命令者並以軍法從事其闕得鞍馬財貨等悉以與之仍優加錫賚嚴刑以制闕重賞以誘其心示金鼓進退之宜謹三令五申闕端拱三年春刑部尚書宋琪上疏曰中原所長秋夏霖霪天時也山川河津地利也槍突劒弩兵勝也財豐士衆力強也乘時互用較然可知王師破虜之計每秋冬時河朔軍州緣邊柵寨但専守境勿輒侵漁令彼尋戈其詞無措或戎馬既肥長驅入寇戎主親行胡羣萃至寒雲翳日朔雪迷空鞍馬相持氊褐之利所宜守陴坐甲以逸待勞其騎士並屯於天雄軍貝磁相州以來若分於邊城緩急難於會合近邊州府只用步兵多屯弩手大者萬卒小者千人堅壁固守勿令出戰彼以全國戎羯此以一郡貔貅雖勇懦之有殊慮衆寡之不敵也國家别命大將總統前軍以遏侵軼只在天雄軍邢洺貝州以來設掎戎之備俟其陽春啓候戎虜計窮新草未生陳荄已朽蕃馬無力疲寇思歸逼而逐之必自奔北前軍行陳之法馬步精卒不過十萬自招討已下更命三五人藩侯充都監副戎排陳先鋒等臨事分布所貴有權追戎之陳須列前後其前陳萬五千騎陳身萬人是四十指揮左右廂各十指揮是二十將每指揮作一隊自軍主都虞候指揮使押當每隊用馬突或刃子槍一百條餘並弓劒骨䤪其陳身解鐙排之候與戎人相搏之時無問薄厚十分作氣槍突交衝馳逐往來後陳更進虜若乘我深入陳身之後更以馬步人五千分為十頭以撞竿鐙弩俱進為回騎之舍也陳廂不可輕動蓋防橫騎奔衝此陳以都監領之進退賞罰便可裁決後陳以馬步軍八萬招討董之與前陳不得過三五里展廂實心布常山之勢左右排陳分押之或前陳擊破虜寇後陳亦禁其馳驟輕進蓋師正之律也牧誓云四伐五伐乃止齊焉慎重之誡也雍熙賜御書六韜雍熙四年五月以北虜未服召北面諸將田重進潘美崔翰及殿前劉延翰對于便殿上訪以禦戎備邊之䇿延翰曰臣等皆鷹犬之才奉指蹤之命猶懼不給破虜之䇿惟聖心裁處上因手書六韜兵法將有五才十過之説以賜之又內出平戎陳圖指畫卷舒進退號令出沒以賜至道邊防形藝圖至道三年九月丙子真宗上因言西川叛卒事輔臣或曰地無城池所以失其制禦上曰在德不在險初上命左藏庫使楊允恭等馳傳往西邊圖上山川形勝丙寅上御滋福殿召輔臣以圖示之歷指州縣堡壁謂曰朕已令屯兵內地且簡其間冗轉餉當減省矣景德禦寇圖録慶厯五年九月癸巳詔近臣考先朝正史實録為景德禦寇圖録寶訓中丞拱辰言乞詔近臣詳定景德禦寇圖上命采閲先朝史録而考詳之景德虎鈐經闕祥符兵要祥符七年十一月癸未朔張質纂軍旅更易之制三篇名曰兵要以進上稱善祥符軍儀祥符七年十二月辛未河西節度使石晉上軍儀條目三卷用將機宜要訣二圖詔奬之天聖將帥要略天聖五年十二月二十二日祕書監胡旦上將帥要略五十三卷景祐神武祕略景祐四年六月戊子以御製神武祕略賜河北河東陜西緣邊總管鈐轄知州軍每得代更相授之仁宗景祐中授古今行兵用師之要及諸家兵書纂為三十卷準漢志四種分門序曰禮記出征受成於學漢禮遣將尚書授以古兵書魏武帝命將行師皆以新書從事藝祖臨遣將勉其為治太宗嘗出軍誡以賜樞臣是用啓金鎖祕室之藏究鶡冠黃石之旨採古賢軍法及舊史成敗為十五卷三十篇其標目始於敘兵將才終於教射教弩實閫外之津梁幕中之龜鑑景祐四年六月以賜三路帥守國家自景德中與契丹氏平而夏人效職貢無事且四十年武備浸弛廟堂言不及兵及韓億任同知樞密院事乃建請執政舉堪任將帥者以備任使又言武臣宜知兵法權謀之書而今禁絶盍類次四種之要使通習之上為親集神武祕略頒諸邊將康定備邊要覽見議邉類丁度上十䇿名備邊要覽仁宗問禦邊之計度奏曰中國抗夷狄宜以智勝難以力克蓋地形武技與中國異也今當謹亭障逺斥堠控扼要害為制禦萬全之計因上備邊十䇿康定風角集占康定元年十一月四日丙辰親製風角集占三卷鏤板印賜輔臣遍賜陜西都總管等書目風角占一卷康定間司天臺奉詔集諸家候風之説前有御製序後漢注風角謂候四方隅之風以占吉凶康定兵説闕康定論兵康定元年正月趙元昊冦邊詔近臣陳攻守䇿同知樞密陳執中請修沿邊城池廣土兵減騎卒靜守以驕其志蓄鋭以挫其鋒學士丁度條上十䇿名備邊要覽同修起居注吳育録真宗朝通西域諸蕃并昊父祖本末上之殿中侍御文彥博言將權不可不専軍法不可不峻兵法曰畏我者不畏敵畏敵者不畏我使之畏我非嚴刑何以濟乎古者什伍之長皆得専殺今統師之重乃不能誅一小校則軍中之令可謂隳矣議者以今寇非大敵師不深入將校有犯宜從中覆倘遇大敵則孰肯奮邪著作佐郎張方平上平戎十䇿大略以為宜屯重兵河東示以形勢賊入寇必自延渭而興州巢穴之守必虛我師自麟府渡河不十日可至此所謂攻其所救形格勢禁之道也經略夏竦議將在軍雖得自便然攻守大計當稟算於朝廷乃畫攻守二䇿詔取攻䇿都官員外郎景泰上邊臣要略二十卷平戎䇿三卷十五篇學士王堯臣等上渭州推官魏庭堅所撰四夷龜鑑三十卷殿中丞王琥獻平戎方略堯臣又上蔡旦所撰通志論十三篇備言攻守之䇿陜西略判官田況上兵䇿十四事康定行軍賞罰格康定元年八月韓琦闕康定聚米圖經聚米圖經五卷康定間閣門通事舍人趙珣圖進西邊地形因授以兵寄慶厯重修兵書闕慶厯三朝經武聖略王洙編十五卷中興書目今止十卷仁宗慶厯中命待制官集太祖太宗真宗料敵制勝之法而為此書始於議兵終於蕃夷凡十五卷慶厯五年二月庚戌御邇英閣讀三朝經武聖略十一月癸未又讀乙未又御邇英閣讀之書目寶元中王洙承詔撰朝氏志經武聖略王洙撰寶元中西邊用兵朝廷講武備是時洙奉詔編祖宗任將用兵邊防事迹分二十門慶厯兵録又見録類慶厯五年樞密副使丁度搜次首末鉤考纖微掇其攻守戰者為禁兵民兵兵録五篇宋祁為序略曰宋興經武制衆凡軍有四一曰禁兵殿前馬步三司隸焉二曰廂兵諸州隸焉三曰役兵羣有司隸焉四曰民兵農之健而材者籍之今參預丁公為兵録合羣曹所分擲指諸條所隱彚而聮之部分班如也離而判之區處戢如也雖伍符猥并邊瑣曲折嵗列廢置月比耗登披文指要坐帷而判蓋簡稽之決要搜乘之總凡録成乃上於官軍篇之首公各述其所由近衛别録示有尊也餘軍弗載略所緩也文約事明成一王法慶厯武經總要書目武經總要四十卷天章閣待制曽公亮等承詔編定參政丁度總領之書成仁宗御製序冠篇首內制度十五卷邊防五卷故事十五卷占候五卷慶厯三年十月乙卯命學士承旨丁度提舉修兵書亮為檢討前集校理曽公亮始於選將終於邊防後集始於伐謀終於遁甲四十卷三百十八門慶厯臨機抵勝圖見陳法至和御製攻守衛圖實録至和元年三月壬申賜邊臣御製攻守禦衛圖會要皇祐六年即至和元年三月七日是年四月改元樞密副使王堯臣進兵䇿詔以聖製攻守衛圖為名送崇文院鏤板書目三卷嘉祐樞密院機要嘉祐二年樞密使韓琦言國朝機要文字盡在密院嵗久散逸蠧朽多所不全請差官於諸房討尋編録一本進內一本留本院於是自建隆以來以嵗月先後事類相從而纂集之其年八月乙巳樞密副使程戡提舉編修大理寺丞周革等點檢編排至六年十一月乙亥編成上之凡一千一百六十二册治平二年五月丙辰樞密院編機要文字九百八十一册以進嘉祐祕閣兵書嘉祐六年四月丙子以大理寺丞郭固編校祕閣所藏兵書先是四館置官編校書籍而兵書與天文為祕書獨不預大臣有言固曉知兵法乃命就祕閣編校抄成黃本一百七十二册治平四年六月編畢熙寧經武要略熙寧二年五月癸巳樞密院言本諸文書凡關祖宗以來制所宜施於久逺者今欲刪取大旨著為一書及聖政釐革條章以次紀録或有條理未備更該説使羣所冀當職者得以屢省其要以時考察則本兵大計綱紀不廢其事目凡十曰兵制馬政邊防夷狄屬國城守器械捕盜選才責效各以事類相從候編次成册仍於逐門各留空紙以備書載將來措置事件從之仍賜名經武要略三年十月丙戌以著作佐郎館閣校勘王存大理寺丞館閣校勘顧臨著作佐郎錢長卿大理寺丞劉奉世同編令都副丞旨管當至九年秋修畢上之五年五月癸未命內藏庫副使同編修熙寧御製攻守圖熙寧五年十二月己亥朔詔賜王韶攻守圖行軍環珠武經總要神武祕略風角集占四路戰守約束各一部仍令秦鳯路經略司抄録七年九月丙午內出攻守圖二十五部賜河北熙寧重校李靖兵法熙寧三年元豐校定兵法元豐三年四月皇朝軍政要覽書目軍政備覽一卷皇朝都官員外郎曽公奭撰述天文地勢鄉兵為將竒正向背凡二十七篇皇朝兵籌類要李垂兵制書建炎軍制二十一條建炎纂集祖宗兵制紹興玉壘忠書見兵制隆興武經龜鑑武經龜鑑二十卷王彥上自始計至用間隆興二年五月辛丑御製序乾道三年二月十六日賜將帥乾道籌邊圖志乾道三年十二月辛丑參政蔣芾上上曰所進籌邊䇿如指諸掌嘉定中興經武要略寶祐七朝經武要略漢兵本末徐天麟南北籌邊曽三英百將傳十卷張預撰每傳必以孫子兵法斷之渭南祕訣謝淵得之瀘州蓋八陳圖法也為之注釋隂符元機朱安國注隂符經也蘇洵著權書五篇心術法制攻守強弱用間又衡論十篇漢刑法志善師者不陳善陳者不戰善戰者不敗善敗者不亡舜善師而不陳者也湯武善陳不戰者也齊桓善戰不敗者也楚昭王善敗不亡者也穀梁傳出曰治兵習戰也入曰振旅習戰也兵事以嚴終故曰善陳者不戰善戰者不死善死者不亡淮南子易則用車險則用騎涉水則多弓隘則用弩晝則多旌夜則多火晦冥多鼓此為善設施也孫子善用兵者如常山之蛇也擊其首則尾至擊其尾則首至擊其中則首尾俱至荀子臨武君曰兵之所貴者勢利也所行者變詐也善用兵者感忽悠暗莫知所從出孫吳用之無敵於天下淮南子飛鳥之鷙也總其首猛獸之攫也匿其爪虎豹不外其牙噬犬不見其齒故用兵之道示之以柔而迎之以剛示之以弱而乘之以強為之以翕應之以張七書形人而我無形此乃竒正之極能因敵變化以取勝謂之神五行無常勝四時無常位日有短長月有死生三略軍井未達將不言渴軍竈未炊將不言飢軍幕未辦將不言倦冬不服裘夏不撰扇是謂禮也管子鼓所以任也起也進也金所以造也退也免也旗所以立兵也偃兵也此所謂三官有三令而兵法治也抱朴子良將如收電可見不可追通典孫子曰兵者國之大事死生之地存亡之道不可不察故經之以五事校之以計而索其情謂下五事彼我之情一曰道德化二曰天惠覆三曰地慈愛四曰將經略五曰法制作道者令民與上下同意也故可與之死與之生而人不佹天者隂陽寒暑時制也地者逺近險易廣狹死生也凡用兵之法全國為上破國次之敵國來服為上以兵擊破為次全軍為上破軍次之全卒為上破卒次之全伍為上破伍次之百戰百勝非善之善者也不戰而屈人之兵善之善也敘兵收衆選擇立軍今制論將搜才孫子曰法者曲制官道主用也曲制者部曲幡幟金鼓之制也官者百官之分用也道者糧路也主用者主軍費用也軍政曰言不相聞故為金鼓視不相見故為旌旗夫金鼓旌旗者所以一人之耳目也人既専一則勇者不得獨進怯者不得獨退紛紛紜紜鬬亂而不可亂渾渾沌沌形圓而不可敗法制雜教令孫子曰用兵之道校之以計而索其情曰主孰有道將孰有能天地孰得法令孰行兵衆孰強士卒孰練賞罰孰明吾以此知勝負矣夫料敵制勝計極險易利害逺近上將之道也䇿之而知得失之計候之而知動靜之理形之而知死生之地角之而知有餘不足之處知勝有五知可以戰與不可以戰者勝識衆寡之用者勝上下同欲者勝以虞待不虞者勝將能而君不御者勝此五者知勝之道料敵制勝敵十五形帥十過察而後動驗虛聲知無實敵降審察用間有五有因間內間反間死間生間五間俱起莫知其道是謂神紀因間者因其鄉人而用之者也內間者因其官人而用之者也反間者因其敵間而用之者也死間者為誑事於外令吾間知之而傳於敵間者也生間者反報者也故三軍之親莫親於間賞莫厚於間事莫密於間非聖智不能用間非仁義不能使間非微密不能得間之實凡軍之所欲擊城之所欲攻人之所欲殺必先知其守將左右謁者門者舍人之姓名令吾間必索知之敵人之間來間我者因以利道而舍之故反間可得而用也因是而知之故因間內間可得而使也因是而知之故死間為誑事可使告敵因是而知之故生間可使如期五間之事主必知之故反間不可不厚也間諜視卒如嬰兒可與之赴深溪視卒如愛子可與之俱死撫士兵者詭道也故能用示之不能用近而示之逺逺而示之近古之善用兵者能使敵人前後不相及衆寡不相待貴賤不相救上下不相收卒離而不集兵合而不齊合於利而動不合於利而止示弱佯北勿從敵方戰形勢未衰便奔走而陳却者必有竒伏勿深入從之故太公曰夫出甲陳兵從卒亂所以多為變佯敗引退取之鋭卒勿攻強而避之少而逃之不若則能避之故小敵之堅大敵之擒也無邀正正之旗無擊堂堂之陳此治變者也是故朝氣鋭晝氣惰暮氣歸善用兵者避其鋭氣擊其惰歸此理氣者也避鋭凡先處戰地而待敵者佚後處戰地而趨戰者勞故善戰者致人而不致於人能使敵人自至者利之也以近待逺以逸待勞以飽待飢此治力者也以逸待勞凡戰者以正合以竒勝故善出竒者無窮如天地不竭如江河終而復始日月是也死而復生四時是也兩軍相對取背破之忿速可侮主不可以怒而興師將不可以愠而致戰合於利而動不合於利而止挑戰凡處軍視生處高戰降無登此處山谷之軍也無附於水而迎客視生處高無迎水流此處水上之軍也絶斥澤惟亟去無留若交軍於斥澤之中必依水草而背衆樹此處斥澤之軍也平陸處易而右背高前死後生此處平陸之軍也行軍下營審擇其地好高而惡下貴陽而賤陰養生而處實軍無百疾是為必勝敵處高勿攻安能動之故我欲戰敵雖高壘深溝不得不與我戰者攻其所必救也攻其必救夫兵之形象水水之形避高而趨下兵之形避實而擊虛故水因地而制流兵因地而制勝兵無常勢水無常形能因敵變化而取勝者謂之神進而不可禦者衝其虛也必攻其易地形者兵之助故用兵有散地有輕地有爭地有交地有衢地有重地有圮地有圍地有死地散地吾將一其志輕地吾將使其屬爭地吾將趨其後交地吾將固其結衢地吾將謹其市重地吾將繼其食圮地吾將進其塗圍地吾將塞其闕死地吾將示之以不活按地形知勝負上兵伐謀其次伐交其次伐兵其下攻城攻城之法為不得已修櫓轒輼具器械三月而後成距鬬又三月而後已將不勝其忿而蟻附之殺士卒三分之一而城不拔者此攻之災也故善用兵者屈人之兵而非戰拔人之城而非攻毁人之國而非久故兵不頓而利可全此謀攻之法也故用兵之法十則圍之伍則攻之圍敵勿周尚書厚齋王先生所稡玉海刋已七年而兵制未完者六卷欲求其成未能也既而臺諫奏之於朝命憲司檄所屬而訪求之其家無有也昔牟君景陽從事浙東帥幕時抄以成帙帥閫乃令會府責成於郡庠遂俾鄮山書院山長王士貴同尚書之孫厚孫給筆札往録之會部使者楊公按四明亟命豫選諸生繕寫校讎鋟版不閲月而畢嗚呼玉海之刋已七年于兹而始克成書書之成否固係乎時然事機之來則其成亦易易耳他日是書之行於世信有資於博學非尋常類書比也因識其嵗月云至正三年十月一日曉望慶元路儒學教授天台朱文剛書訓導紹興路上虞縣儒學教諭陳子翬校正玉海卷一百四十一
