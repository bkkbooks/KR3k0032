  text: 玉海卷一百九十三卷八欽定四庫全書
  hash: sha256:8f4984e86edc4db50c2cfd47542f115df9407bde4a47556ea93d204c5eeeea90
  markers:
  - {type: page-break, offset: 10, content: '', id: KR3k0032_WYG_008-1a, image: WYG0943/WYG0943-0201a.png}
body:
  text: 玉海卷八宋王應麟撰律厯度少皥氏度量左傳昭十七年少皥五雉為五工正利器用正度量夷民者也通厯少昊用度量作樂器舜度書舜典同律度量衡夏商尺通鑑外紀夏禹十寸為尺成湯十二寸為尺武王八寸為尺史記禹聲為律身為度天下皆宗禹之明度數聲樂周尺記王制古者以周尺八尺為步今以周尺六尺四寸為步古者百畝當今東田百四十六畝三十步古者百里當今百二十一里六十步四尺二寸二分鄭氏注周尺之數未詳聞也案禮制周猶以十寸為尺蓋六國時多變亂法度或言周尺八寸則步更為八八六十四寸以此計之古者百畝當今百五十六畝二十五步古者百里當今百二十五里正義古者八寸為尺周尺八尺為步則一步有六尺四寸周尺六尺四寸為步則一步有五十二寸李氏曰按史記秦始以六尺為步此言古者即秦也司馬法以六尺為步説文周制寸尺咫尋常仞諸度量皆以人之體為法春秋正義引説文云手長八寸謂之咫周尺也禮璧羡以起度大戴禮主言篇孔子曰布指知寸布手知尺舒肘知尋十尋而索百步而堵三百步而里千步而井三井而句烈三句烈而距五十里而封百里而有都陳祥道曰先王制法近取諸身遠取諸物指尺黍尺一也周之法十寸八寸皆為尺考工記於案言十有二寸於鎮圭言尺有二寸此十寸尺也説文王制所云此八寸尺也舜以五歲同度量周十有一歲同度量此步尺所以一而得其正也後世之尺或以黍或以忽或以指然黍有小大絲有巨細指有長短此步尺所以異也周公頒度量出以內宰掌以司市以合方氏一之以質人行之同之其同民心出治道如此古之度在樂則起於黃鍾在禮則起於璧羡何休云側手為膚案指為寸月令日夜分同度吕大臨考古圖有玉尺樣乃周尺之寸漢五度漢官尺志度者分寸尺丈引所以度長短本起於黃鍾之長以子穀秬黍中者一黍之廣度之九十分黃鍾之長一為一分十分為寸積十而登以至於引而五度審矣其法用銅度者别於分忖於寸蒦音約於尺張於丈信於引職在內官廷尉掌之張蒼定章程注云丈尺之法隋志漢官尺黃鍾容黍九百三十九房庶説見上晉古尺新度銅律吕周玉尺銅尺周玉律鐘磬漢建武銅尺銅尺銘晉律志泰始九年中書監荀勗校大樂揔章鼓吹八音不和始知後漢至魏尺長於古四分有餘乃部佐著作郎劉恭依周禮制尺所謂古尺也依古尺更鑄銅律吕以調聲韻樂志亦引起宋志云依周禮更積黍度以鑄新律以尺量古器與本銘尺寸無差汲郡發六國時魏襄王冡得周玉律及鐘磬與新律聲韻暗同時郡國或得漢故鐘吹律合之皆應勗銘其尺曰晉泰始十年中書考古器揆校今尺長四分半所校古法有七品一姑洗玉律二小吕玉律三西京銅望臬四金錯望臬五銅斛六古錢七建武銅尺姑洗微強西京望臬微弱其餘皆與此尺同銘八十二字此尺者勗新尺也今尺者杜夔尺也勗造新鐘律與古器諧韻時人稱其精密唯散騎侍郎阮咸譏其聲高阮咸妙達八音論者謂之神解咸譏勗律聲高不近中和以其異已出咸為始平相必古今尺有長短所致也武帝以勗律與周漢器合故施用之後始平掘地得古銅尺嵗久欲腐不知出何代果長勗尺四分時人服咸之妙而莫能厝意焉隋志晉前尺黃鍾容黍八百八粒史臣案勗於千載之外推百代之法度數既宜聲韻又契可謂切密信而有徵也而時人寡識據無聞之一尺忽周漢之兩器雷同臧否何其謬哉世説稱有田父於野地中得周時玉尺便是天下正尺荀勗試以校已所治金石絲竹皆短校一黍又漢章帝時零陵文學史奚景於泠道舜祠下得玉律度以為尺相傳謂之漢官尺以校荀勗尺勗尺短四分漢官始平兩尺長短度同又杜夔所用調律尺比勗新尺得一尺四分七釐魏景元四年劉徽注九章云王莽時劉歆斛尺弱於今尺四分五釐比魏尺其斛深九寸五分五釐即荀勗所謂今尺長四分半是也元帝後江東所用尺比荀勗尺一尺六分二釐趙劉曜光初四年鑄渾儀八年鑄土圭其尺比荀尺一尺五分荀勗新尺惟以調音律至於人間未甚流布故江左及劉曜儀表並與魏尺略相準律志又云泰始十年光祿大夫勗造新度更鑄律吕樂志泰始九年光祿大夫勗始制古尺作新律吕以調聲韻仍以張華等所制髙文陳諸下管穆天子傳序以臣勗前所考定古尺度甚簡裴頠傳勗之修律度也檢得古尺短世所用四分有餘頠上言宜改度量太醫權衡不見省元康中摯虞傳陳協協為將作大匠掘地得古尺尚書奏今尺長於古尺宜以古為正潘嶽以為不宜改虞駁曰今尺長於古尺幾於半寸樂府用之律吕不合史官用之厯象失占醫局用之孔六乖錯宜如所奏詳見後隋律厯志審度篇尺度有十五等一周尺荀勗依周禮制二晉田父玉尺三梁表尺四漢官尺始平掘地得之六晉後尺漢志王莽時劉歆銅斛尺後漢建武銅尺晉泰始十年荀勗律尺為晉前尺祖沖之所傳銅尺銘曰晉泰始十年雷次宗何胤之作鍾律圖所載古尺與此銘同王隱晉書武帝泰始元年中書監荀勗上元魏太和十九年定銅尺詔以一黍之廣定為分命高閭以黍裁寸六月戊午改用長尺大斗其法依漢志永平中公孫崇造樂尺以十二黍為寸劉芳非之更以十黍為寸梁武帝鍾律緯稱主衣相承有周時銅尺一枚古玉律八枚吳人掘地得銀尺上有刻文後魏銅尺魏志太和中詔中書監高閭修正音律十八年表曰公孫崇自作鐘磬志議二卷器數為備景明四年并州獲古銅權詔付崇以為鍾律之準永平中崇更造新尺以一黍之長纍為寸法太常卿劉芳受詔修樂以秬黍中者一黍之廣即為一分而中尉元匡以一黍之廣度黍二縫以取一分久未能決太和十九年通鑑是年六月戊午改用長尺大斗其法依漢志為之高祖詔以一黍之廣用成分體九十黍之長以定銅尺有司奏從前詔而芳尺同高祖所制遂典修金石通鑑公孫崇造樂尺以十二黍為寸劉芳非之更以十黍為寸張普惠上疏曰高祖廢大斗去長尺改重稱以愛民薄賦梁新尺鍾律緯辨宗第一宋渾天儀土圭云是張衡所造驗其名題晷景乃光初八年作渾天光初四年作皆劉曜所製非平子也今制以為尺長今新尺四分三釐短俗間尺二分又得祖沖所傳銅尺其銘曰晉泰始十年中書考古器揆今尺云云主衣云從上相承有周時銅尺一枚古玉律八枚尺不復存夾鍾玉琯有昔題刻乃制為尺以相參驗長祖沖尺校半分今為鐘者莫能取齊律管之妙罕有能知京房準法傳而莫曉今以新尺證分毫製為四器名之為通唐吕才尺吕才傳貞觀時祖孝孫增損樂律與音家王長通等白明達質難不能決上詔舉善音者侍中王圭魏徵盛稱才製尺八凡十二枚長短不同與律諧契即召才直弘文館參論樂事托言尺八樂器之名又逸史云取尺八來乃笛也仙隱傳房介然善吹竹笛名曰尺八於洪邁曰尺八所出見此無由曉其形製唐中和節賜尺鏤牙尺紫檀尺李泌傳請以二月朔為中和節因賜大臣戚里尺謂之裁度官志中尚令歲二月獻牙尺貞元八年宏詞以此命題李觀裴度有詩六典中尚令二月二日進鏤牙尺紫檀尺白居易謝賜尺表紅牙為尺白銀為寸美而有度煥以相宣咫尺之顏不違分寸之功未效吕頌謝賜金縷牙尺後周王朴尺五代會要王朴依周法以秬黍校定尺度長九寸虛徑三分為黃鍾之管與見在黃鍾之聲相應以上下相生之法推之得十二律管進所定尺所吹黃鍾管顯德六年正月自魏以來以尺起律房庶言尺當生於律古人以度定量以量定權必參相得然後黃鍾之律可求建隆新尺見律類景祐黍尺四等尺樂尺景表尺大府尺漢錢尺王朴律準尺景祐二年李照改大樂以京縣秬黍纍尺鑄鐘聲高更以太府布帛尺為法又以潞州黍纍之尺成與太府尺合三年三月丙申翰學馮元等上秬黍新尺詔以尺别為鐘磬各一架六月丙寅鄧保信上所制樂尺并籥言其法本漢志可合律度量衡詔馮元聶冠卿宋祁同較定七月己亥命翰學丁度知制誥胥偃司諌高若訥韓琦同詳定黍尺鐘律八月甲戌琦言阮逸之用方分保信之用長黍質之典據悉無所聞逸瑗造律圍徑乖古保信新尺長廣未合請下有司記二家律法及所造管鐘磬權量存而未行詔度等速詳定九月丁亥度等言詳定保信逸瑗所造黍尺律管權量鐘磬保信用圓黍逸等用大黍纍之尺既有差難以定鐘磬漢志積分之法為近然逸等以大黍纍尺小黍實籥自戾本法保信以長為分雖合後魏公孫崇所説然當時已不施用前代皆以一黍之廣為分唯崇以長纍為寸臣等以王朴律準為率則太府寺鐵尺比律準尺長三寸二分強景表尺長四分保信尺長一寸九分強逸等尺長七分強詔度等以太府寺四等尺比校詳定可行用者以聞然論者謂漢制本起黃鍾之長云云然則尺生於黃鍾也晉隋以來諸儒之議乃先制尺為律至有縱黍橫黍之别而容受不能合由漢志脫起積一千二百黍之八字度等不能是正壬辰推恩逸瑗遣之十月丁卯十九日度等言奉詔校四等尺古之制尺非特纍黍必求古雅之器以參校之晉泰始十年荀公曽以古物七品校尺度隋志載前代尺度十有五等然皆以晉之前尺為本以其與周尺劉歆銅斛尺建武銅尺相合也臣以為古物有分寸明著史籍唯有錢法今司天監景表尺和峴所謂西京銅望臬者洛都舊物也荀公曽所用西京銅望臬蓋西漢之物和峴謂洛陽為西京乃唐東都耳五代不聞測景此即唐尺今以貨布錯刀貨泉大泉等校之則景表尺長六分有奇略合宋氏周隋之尺是銅斛與貨布等尺寸灼然可用矣今必求尺度之中當依漢錢分寸若以為太祖詔和峴等用景表尺修金石稽合唐制以示詒謀則可且依景表舊尺俟妙達鐘律者考正其王朴律準尺比漢錢尺長二分有奇比景表尺短四分既前代未嘗施用復經太祖朝更改逸瑗保信并照所用太府寺等尺其制彌長去古彌遠又逸進周禮度量法議欲先鑄嘉量其説疏舛謹再定景表尺一及以漢錢校定尺二內一陷古泉貨十枚并大泉錯刀貨布貨泉總十七枚上之四品參校分寸正同詔度等以錢尺景表尺各造律管比驗逸瑗及太常新舊鐘磬音韻高下以聞度等言律管非臣素習乃罷之會要云度等言取保信逸瑗所造黍尺二參稜分寸不合司天監景表尺比晉前尺長六分三釐與晉後尺同與宋氏鐵尺樂尺渾儀尺後周鐵尺並同度慶厯七年八月丙寅觀郊祭器以景表尺較其制王朴律準尺比晉前尺長二分一釐比梁表尺短一釐三司布帛尺比周尺一尺三寸五分馮元言古者橫黍度寸今以縱亂橫其法非是上因出橫黍新尺示羣臣比縱尺差二寸一分而弱以校衡斗皆不讎皇祐十五等古尺隋志禹以身為度禮記布手為尺周官璧羡起度鄭司農云璧徑尺易緯通卦驗十馬尾為一分淮南子十二粟而當一寸説苑一粟為一分孫子算術十釐為分此皆起度之源漢志起黃鍾之長以黍度之今略諸代尺度一十五等并異同之説如左一周尺漢志劉歆銅斛尺後漢建武銅尺晉泰始十年荀勗律尺為晉前尺祖沖之所傳銅尺今以此尺為本以校諸代尺二晉田父玉尺梁法尺比晉前尺一尺七釐此兩尺長短近同三梁表尺比晉前尺一尺二分二釐一毫有奇蕭吉云出司馬法即祖暅所造銅圭景表大業用之調律四漢官尺比晉前尺一尺三分七毫晉始平得古銅尺兩尺長短近同五魏尺杜夔所用調律比晉前尺一尺四分七釐六晉後尺比晉前尺一尺六分二釐江東所用七後魏前尺比晉前尺一尺二寸七釐八中尺比晉前尺一尺二寸一分一釐九後尺比晉前尺一尺二寸八分一釐後周市尺比玉尺一尺九分三釐或傳梁時志公作周朝行用及開皇初著令以為官尺百司用之開皇官尺即鐵尺一尺二寸後魏初及東西分國後周未用玉尺之前雜用之十東魏後尺比晉前尺一尺五寸八毫此元延明纍黍用半周之廣為尺齊因而用之十一蔡雍銅籥尺相承有銅籥一以銀錯題其銘曰籥黃鍾之宫長九寸空圍九分容秬黍一千二百粒稱重十二銖兩之為一合三分損益轉生十二律祖孝孫云相承傳是蔡雍銅籥後周玉尺此晉前尺一尺一寸五分八釐保定中詔盧景宣等纍黍造尺不定後修倉掘地得古玉斗以為正器據斗造律度量衡用此尺改元天和其律黃鍾與蔡雍古籥同十二宋氏尺比晉前尺一尺六分四釐錢樂之渾天儀尺後周鐵尺開皇初調鍾律尺及平陳後調鍾律水尺宋代人間所用傳入梁陳以制樂律與晉後尺梁俗尺劉曜渾儀尺略相近周建德六年以此同律度量頒天下牛弘曰今之鐵尺蘇綽所造與宋尺同即以調律均田周漢古錢大小有合宋氏渾儀尺度無舛漢志云黃金方寸其重一斤今鑄金校驗鐵尺為近至於玉尺纍黍以廣為長恐不可用晉梁尺短律聲必高急臣謂用鐵尺為便宣帝時議祖孝孫云平陳後廢周玉尺律用此鐵尺律以一尺二寸即為市尺十三開皇十年萬寶常所造律吕水尺比晉前尺一尺一寸八分六釐今太樂庫及內出銅律一部是寶常所造名水尺律十四雜尺趙劉曜渾天儀土圭尺長於梁法尺四分三釐比晉前尺一尺五分十五梁朝俗間尺長於梁法尺六分三釐於劉曜渾儀尺二分比晉前尺一尺七分一釐實録高若訥傳皇祐中詔纍黍定尺以制鐘律爭論連年不決若訥以漢貨泉度一寸依隋書定尺十五種上之藏於太常寺長編載於景祐三年云云宋祁獨以周尺為本以考諸尺陳襄集載十五尺同隋志皇祐二年閏十一月丁卯十四日置局祕閣詳定大樂庚午十七日翰學承旨王堯臣等請借參政高若訥所校古尺十五等從之三年二月己丑詔諸道漕臣訪民間有藏古尺律者上之四年六月乙酉范鎮上書曰周尺有八寸十寸之别璧羡之制長十寸廣八寸同謂之度尺今以百黍為尺不起於黃鐘非是纍黍為尺始失於隋書律房庶謂以尺生不合古法五年四月二十六日乙未知制誥王洙言鎛鐘特磬制度欲以皇祐中黍尺為法鑄大吕應鍾鐘磬各一景祐二年乙亥九月十二日依新黍定律尺每十黍為一寸景祐三年丙子詔臣逸臣瑗準古法纍秬黍以興尺度監鑄造臣保信皇祐二年閏十一月用烏圓小黍之廣纍百滿尺其二云中黍之廣大黍之廣四年十一月大樂所造新定中黍連三鐵尺三年五月大樂所造太府寺鐵尺五年五月大樂所奉詔以景表尺均通為皇祐中黍尺又載胡阮二家所定十二律尺四清律尺分寸之異陳襄集近嵗司馬備刻周尺漢劉歆尺晉前尺蓋文正公光舊物也景祐二年四月八日李照言太守寺石記云官尺每寸十黍臣以今黍十二方盈一寸欲更造官尺律管一景祐中韓琦丁度纍黍尺二其一亦與周尺相近比周尺一尺三分五釐元豐元年制樂所定銅本尺度黃鍾籥尺一條長九十黍元祐樂尺元祐三年閏十二月楊傑言范鎮有元祐新定樂法以為國朝李照以縱黍纍尺胡瑗以橫黍纍尺皆失之於以尺而生律也房庶之法以律而生尺得古之制鎮用太府尺以為樂尺下今樂一律有奇以為得其理鎮以謂世無真黍乃用太府尺為樂尺蓋出於鎮一家之言而又下一律有奇其實下舊樂三律矣管笛之類比舊差長竅比舊差大而短未知久長可用之乎鎮曰黍之施於權衡由黃鍾之重施於量由黃鍾之籥施於尺由黃鍾之長其實皆一千二百也鎮又云周兼用十寸八寸為尺漢專用十寸為尺胡瑗謂周豈用兩等之尺惑於天下鎮云據瑗尺為釜為斛容受俱不合據房庶尺為量得周漢之法鎮鎮謂蔡雍謂黃鍾銅律為黃鍾銅籥故有銅籥尺與司馬光論鍾律反復相非不能相一胡李之律生於尺房庶之律生於量崇寧三年正月二十九日魏漢津言伏羲以一寸之器名為含微其樂曰扶桑女媧以二寸之器名為葦籥其樂曰光樂黃帝以三寸之器名為咸池其樂曰大卷三三而九乃為黃鍾之律至唐虞未嘗易禹效黃帝之法以聲為律以身為度用左手中指三節三寸謂之君指裁為宫聲之管用第四指三節三寸謂之臣指裁為商聲之管用第五指三節三寸謂之物指裁為羽聲之管第二指為民為角大指為事為徵故不用為裁管之法得三指合之為九寸則黃鍾之律定餘律生焉漢儒用纍黍之法晉末法廢隋牛弘用萬寶常水尺唐田畸周王朴並用水尺之法今請聖人三指為法均絃裁管從之大觀四年四月己卯十一日翰學張閣請頒指尺于天下政和元年五月六日頒大晟樂尺自七月朔旦行之比官小尺短五分有奇紹興牙尺大樂尺圖皇祐中黍尺紹興十六年五月十八日給事中段拂等言禮器局準降下景鍾制度大晟樂書并金字牙尺二十八量及太常少卿李周等所立碑刻太樂尺圖本付局參照欲依樂書制度以皇祐二年大樂中黍尺為準從之後禮部攽祭祀儀式畫到造禮器尺比周尺一尺三寸二分三十二年七月十一日工部言尊號玉寶四寸九分厚一寸二分用皇祐中黍尺後周聶崇義三禮圖玉瑞玉器之屬造指尺璧羡以規之冠冕鼎俎之屬設黍尺嘉量以度之量衡黃帝五量家語五帝德篇黃帝治五氣設五量權衡升斛尺丈里步十百撫萬民度四方垂衣裳作為黼黻治民以順天地之紀大戴禮同吕氏春秋黃帝使伶倫作黃鍾之律因律以為量栁貞傳一統類齊制量禹制量周語伯禹釐改制量比類百則書關石和鈞王府則有史天下皆宗禹之明度數聲樂越絶書禹循守會稽審銓衡平斗斛吳越春秋禹調權衡平斗斛造井示民以為法度周嘉量銘數器齊四量考工記栗氏栗堅也為量釜深尺內方尺而圜其外其實一釜釜六斗四升也釜十則鍾方尺積千寸於今粟米法少二升八十一分升之二十二其臀一寸其實一豆其耳三寸其實一升重一鈞其聲中黃鍾之宫槩而不稅其銘曰時文思索允臻其極嘉量既成以觀四國永啓厥後兹器維則內宰佐后立市出其度量淳制司市掌市之度量以量度成賈而徵儥合方氏同其數器一其度量行人十一歲同度量同數器注度丈尺量斗區釡數器銓衡也質人同其度量一其淳制玉人璧羡度尺好三寸以為度駔琮五寸宗后以為權駔琮七寸鼻寸有半寸天子以為權角人以度量受之掌葛以權度量受之典同度數齊量量人凡祭祀脯燔之數量輪人量其藪以黍以視其同權之以視其輕重之侔論語武王謹權量審法度明堂位周公頒度量周語單穆公曰先王制鐘大不出鈞重不過石律度量衡於是乎生注生於黃鍾左傳昭二年晏子曰齊舊四量豆區釜鍾四升為豆各自其四以登於釜釜十則鍾晉志以算術考之古斛之積凡一千五百六十二寸半方尺而圓其外減傍一釐八毫其徑一尺四寸一分四毫七秒一忽有奇而深尺即古斛之制也范鎮言周釜重一鈞漢釜重二鈞尺有長短故也春秋正義近世以來或輕或重魏齊斗稱於古二而為一周隋斗稱於古三而為一漢嘉量五量銅量漢斛銘銅甬律志一曰備數二曰和聲三曰審度四曰嘉量五曰權衡量本起於黃鍾之籥用度數審其容以子榖秬黍中者千二百實其籥以井水準其槩合籥為合二籥也胡瑗新樂圖曰今文誤作十唐六典二籥為合十合為升十升為斗十斗為斛而五量嘉矣其法用銅方尺而圓其外旁有庣焉庣吐雕反謂不滿之處也其上為斛其下為斗左耳為升右耳為合籥其狀似爵以縻爵祿上三下二參天兩地圜而函方左一右二隂陽之象也其圜象規其重二鈞備氣物之數聲中黃鍾君制器之象也注鄭氏曰今尚方有王莽時銅斛制盡與此同量躍於籥合於合登於升聚於斗角於斛職在太倉大司農掌之凡律度量衡用銅者所以同天下齊風俗也銅為物之至精介然有常有似士君子之行隋志漢十斗為斛方尺圓其外旁有庣焉其斛銘曰律嘉量斛方尺圓其外庣旁九釐五毫羃百六十二寸深尺積一千六百二十寸容十斗祖沖之考劉歆庣旁少一釐四毫有奇歆數術不精所致也范鎮按今斛方尺深一尺六寸二分此斛之非是也易氏曰周用指尺八寸漢用黍尺十寸方尺深尺同而有長短之差晉志魏景元四年劉徽注九章云王莽時劉歆斛尺弱於今尺四分五釐比魏尺其斛深九寸五分五釐魏斛大尺長莽斛小尺短石勒造建德殿得圓石銘曰律權石重四鈞有新氏造是莽時物也嘉祐中劉敞守長安得谷口銅甬銘其一始元四年其一甘露元年左馮翊府造金石録有漢巴官鐵量銘曰永平七年景紀中五年九月詔曰法令度量所以禁暴止邪也張蒼定章程注云斗斛之平法第五倫領長安市平銓衡正斗斛漢五權五則法品百工程品章程律度見律令志衡所以任權均物平輕重也其在天佐助旋機斟酌建指以齊七政故曰玉衡權者銖兩斤鈞石也所以稱物平施知輕重也本起於黃鍾之重一籥容千二百黍重十二銖兩之為兩二十四銖為兩十六兩為斤三十斤為鈞四鈞為石五權之制以義立之以物鈞之始於銖兩於兩明於斤均於鈞終於石五權謹矣權與物鈞而生衡衡運生規規圜生矩矩方生繩繩直生準準正則平衡而鈞權矣是為五則百工繇焉以定法式輔弼執玉以翼天子詩曰秉國之鈞咸有五象其義一也以隂陽言之冬權夏衡秋矩春規中央為繩五則揆物有輕重圜方平直隂陽之義四方四時之體五常五行之象厥法有品各順其方而應其行職在大行鴻臚掌之大隂北冬水知謀權大陽南夏火禮齊衡少隂西秋金義方矩少陽東春木仁生規中央四季土信誠繩魏相曰太昊乘震執規司春炎帝乘離執衡司夏少昊乘兌執矩司秋顓頊乘坎執權司冬黃帝乘坤艮執繩司下土吕氏春秋仲春日夜分則同度量鈞衡石角斗桶正權槩仲秋日夜分則一度量平權衡正鈞石齊升甬漢書白煒象平考量以銓量斗斛銓權衡也張蒼傳若百工天下作程品注如淳曰百工為器物皆有尺寸斤兩斛斗輕重之宜師古曰百工程品皆取則也紀張蒼定章程注程者權衡丈尺斗斛之平法史記自序漢既初定文理未明蒼為主計整齊度量序律厯詳見律令説文程品也十髮為程十程為分十分為寸稱銓也春分而禾生日夏至晷景可度禾有秒秋分而秒定律數十二秒而當一分十分而寸其以為重十二粟為一分十二分為一銖故諸程品皆從禾管仲傳貴輕重慎權衡商君傳平斗桶權衡丈尺行之管子曰準者五量之宗也秦紀天下之事無小大皆決於上上至以衡石量書日夜有程石百二十斤前食貨志秦并天下黃金以溢為名注孟康曰二十兩為溢師古曰改周一斤之制更以溢為金之名數也考工記注今東萊稱或以大半兩為鈞十鈞為環環重六兩大半兩又栗氏疏十二辰各有律十二律以黃鍾為初九故擊釜器之時其聲中黃鍾之宫辰各有五聲今中其宫聲地官廪人掌九穀凡萬民之食食者人四釜上也三中也二下也不能人二釜令邦移民就穀六斗四升曰釜冬官陶人甗實二釜鬲實五觳庾實二觳鄭司農云觳讀為斛觳受三斗聘禮記有斛旊人豆實三而成觳司農云斛受十斗康成謂觳受斗二升豆實四升疏曰小爾雅掬二升二掬為豆豆四升四豆曰區四區曰釜二釡有半謂之庾聘禮記云十六斗曰籔即庾也庾有二法內宰注度丈尺也量豆區之屬杜子春讀淳為純純謂幅廣制謂匹長康成謂純制天子巡守禮所云制丈八尺純四􅡥四咫三尺二寸魏斛通典魏初杜夔造斛即周禮嘉量也晉志魏景元四年劉徽注九章商功曰當今大司農斛圓徑一尺三寸五分五釐深一尺積一千四百四十一寸十分寸之一王莽銅斛於今尺為深九寸五分五釐徑一尺三寸六分八釐七毫魏斛大尺長莽斛小尺短後魏古銅權律厯志景明四年并州獲古銅權詔付公孫崇以為鐘律之準隋志景明中并州人王顯達獻古銅權一枚上銘八十一字銘云同律度量衡稽當前人龍在己巳嵗次實沈初班天下萬國永遵子子孫孫享傳億年此王莽所製也元匡曰銅權古志明是漢作案銘云虞帝始祖德布於新非漢權明矣樂志永平二年大樂令公孫崇造八音之器并五度五量劉芳考其尺寸度數與周禮不同後周玉升銘銅升銅律度玉斗見尺類隋志後周玉升銘曰保定元年歲在重光月旅㽔賓晉國之有司修繕倉廩獲古玉升形制典正若古之嘉量太師晉公以聞勑納于天府北史保定元年五月丙午晉公護獲玉斗以獻暨五年歲在叶洽皇帝乃詔稽準繩考灰律不失圭撮不差絫黍遂鎔金寫之用頒天下五年乙酉冬十月詔改制銅律度為銅升頒天下天和二年丁亥正月戊子十五日校定移地官府為式此銅升之銘也後周得玉斗據斗造律兼制權量亦不合周漢制度建德六年八月壬寅議權衡度量頒於天下史記正義顏之推云隋開皇二年五月長安人穿地得秦皇鐵稱權有銘二所凡九十八字云丞相隗狀王綰二人列名顏之推録二銘載之家訓歐陽修得二物一銅鍰一銅方版其銘亦同秦孝公十四年平斗桶權衡丈尺始皇二十六年一法度衡石丈尺隋開皇二年五月長安人穿地得金版有銘曰始皇時量後周玉稱隋志後周玉斗并副金錯銅斗及建德六年金錯題銅斗實同以秬黍定量以玉稱權之一升之實皆重六斤十三兩周玉稱四兩當古稱四兩半衡以任權鈞物在天曰玉衡唐太府二法六典志同金部掌權衡度量之制志作數太府卿掌以二法平物一曰度量分寸丈尺合升斗斛二曰權衡凡官私斗稱尺每年八月詣寺平校開元九年勑格無或差繆然後用之月令仲春仲秋日夜分平權衡同度量會要武德八年九月勑諸州斗稱京大府較之大和五年八月大府奏斗稱新印改篆文以舊印真書多偽也大厯十年三月二十二日敕斗稱尺度準式取大府較印然後行用樂志聲無形而樂有器古之作樂者懼器失而聲亡多為之法以著之故始求聲者以律而造律者以黍一黍之廣積為分寸一黍之多積為籥合一黍之量積為銖兩此造律之本也為長短多少輕重之法著於度量權衡三物亦有時而敝又總其法著於數使其分寸籥合銖兩皆起於黃鍾使得律者可以制度量衡因度量衡亦可以制律不幸皆亡則推法數而制之四者既同而聲必至聲至而後樂可作矣官志太府主簿平權衡度量歲以八月印書然後用之諸市令丞掌度量六典京都諸市令以二物平市稱以格斗以概隋志開皇以古斗三升為一升古稱三斤為一斤大業中復古斗稱三年四月壬辰改度量權衡並依古式隋趙賢通為冀州刺史為銅斗鐵尺置於肆百姓便之唐銅斛嘉量通鑑武德八年九月癸卯初令太府檢校諸州權量通典貞觀中張文收鑄斗稱尺升合咸得其數詔以其副藏於樂局至武延秀為太常卿以為奇玩以律與古玉尺玉斗升合獻焉開元十七年將考宗廟樂有司請出之敕惟以銅律付太常而亡其九管今正聲有銅律三百五十六銅斛二銅稱二銅甌十四斛左右與臀耳皆正方積十而登以至於斛銘云大唐貞觀十年歲次玄枵月旅應鍾依新令纍黍尺定律校籥成兹嘉量與古玉斗相符同律度量衡協律郎張文收奉勑修定稱盤銘云大唐貞觀稱同律度量衡匣上有朱漆題稱尺二字尺亡其迹猶存以今常用度量校之尺當六之五衡皆三之一一斛一稱是文收總章年所造舊紀大厯十年八月大府寺奏諸州府所用斗稱當寺給銅斗稱州府依樣製造而行栁仲郢為京兆尹置權量於東西京使貿易用之禁私製者會要大厯十一年十月十八日太府少卿韋光輔奏請改造銅斗斛尺稱等行用十二年二月草九日敕依舊制敬括嘉量賦窮微於子穀之數酌憲於黃鍾之音姚崇執稱誡云衡天下之平也君子執之以平其心夫衡在天以齊七政在人以均萬物稱物平施為政以公毫釐不差輕重必得是執稱衡之理也聖人為衡四方取則志守公平體兼正直存信去詐以公滅私無偏無黨君子似之建隆新量衡嘉量太祖受命之初受藏吏歲輸金幣權衡失準建隆元年八月丙戌十九日有司請造新量衡以頒天下詔精考古制按前代舊式作之禁私造者紀云攽新量衡于天下按此乃新造未攽也一本云作為嘉量以示天下其後平江南蜀嶺凡斛斗不中法者去之以嘉量為定制元年夏五月乙巳首擇廷臣王伸而下八人分掌京廩明年春二月己卯賜節度符彥卿粟以愧之自是斛量始平民情感恱乾德元年七月戊午頒于潭澧等州開寶四年七月丙申以嶺南用大斗詔均同度量每石納耗二升太宗興國二年七月十一日庚午以受藏吏捶鈎為姦詔敢有欺度量取羡餘者誅之熙寧四年十二月十一日詔以太府寺所掌量衡屬文思院紹聖四年十一月增損衡量及私製有禁命漕臣置局製之政和二年八月詔量權衡以大晟樂尺為度三年十月令文思院下界造新權衡度量紹興元年四月十三日詔工部以省倉升斗令文思院校定頒其式于諸州二年二月七日命榷務製百隻頒諸路禁用私量十月二十九日命文思院造升斗稱尺鬻之先以法式朌諸路漕司依以製造分給州縣七年三月十九日製五斗斛頒諸路二十五年四月四日製一石斛頒之以革倉庾之敝二十九年十一月二十四日詔租斗止於百合禁豪民用大斗三十二年九月事寢不行各隨鄉例淳化權衡新式大府寺銅式實録淳化三年三月癸卯詔曰書云同律度量衡所以建國經立民極也國家底慎財賦校量耗登既府庫之充盈須權衡之平允秬黍之制或差毫釐捶鈎為姦害及黎獻宜詳定稱法著為通規事下有司內藏庫使劉承圭劉蒙正言大府寺銅式自一錢至十五斤凡五十一輕重無準府藏歲受黃金必自毫釐計之式自錢始則傷於重權衡法以十黍為絫十絫為銖二十四銖為兩度之法起於忽十忽為絲至十釐為分每分為二絫四黍以開元通寶錢肉好周郭均者校之十分為一錢積十錢為一兩凡一錢為十萬忽自一錢至半錢作稱以校之差擇得錢二千四百并以絲忽毫釐銖絫之準奏御上詔三司重校定以御書淳化三體錢二千四百磨令與開元通寶錢輕重等付有司以為定制仍命别鑄新式頒行天下志云遂尋究本末别製法物景德權衡新式銅式新定權衡法志景德中承圭重加參定而權衡之制益備其法權衡之法起於黍度之法起于忽取漢志子穀秬黍為則廣十黍以為寸從其大樂之尺就成二術因度尺而求釐自積黍而取絫以御書真草行三體淳化錢較定實重二銖四絫為一錢者凡一錢為十萬忽以二千四百得十有五斤為一稱之則其則用銅而鏤文以識其輕重新法既成并以絲忽毫釐銖絫之準奏御詔以新式留禁中復鑄銅式以三體錢二千四百暨新式三十有三銅牌二十授於太府又置新式於內府外府攽于四方凡十有一副詔三司使重校定以御書淳化錢磨令與開元通寶錢輕重等付有司中外以為便會要景德二年八月丙戌詔承圭所定權衡法附編敕而不攽下紀景德二年八月丙戌有司上新定權衡法實録景德元年三月丁酉宫苑使劉承圭言會要四年五月先監內藏庫凡權衡皆虧欠遂上奏先朝别製法物自端拱元年至淳化三年校定畢功其重定稱法皆上稟先帝睿謀參以古法請知制誥趙安仁撰權衡新式序仍付所司從之王曉為記以述其事祥符五年八月辛丑幸內藏庫觀所立聖製銘因閲新製權衡法物六年四月壬午承圭言先奉詔以權衡之法刋石為記請州郡及庫務各賜石記一本從之承圭傳云取秬黍以定尺積黃鍾以成度由度而立權衡法趙安仁序曰權衡之法先王所以平物一民也漢志其事甚詳分職鴻臚所以同四方也著式太府所以均九府也太宗憲章三五制作禮樂端拱元祀詔有司謹權衡之法蓋有虞氏同律度量衡之義也執事者稟睿謀立新法乃考黃鍾之律因大樂之尺自黍絫至鈞石本舊制也别絲忽之狀立毫釐之準成絫銖至斤兩發新意也粵淳化三載上言新法成詔以新式留禁中命與計臣同詣太府取稱四十舊式六十以新式校之乃見舊式所謂一斤而輕者有十謂五斤而重者有一新式由黍絫而齊鈞石不可增損也先帝嘉之是年夏六月乃更鑄銅式即以御書淳化三體錢二千四百暨新式三十有三銅牌二十授於太府又置新式於內府外府復頒于四方凡十有一副自下詔至頒行凡六年由是惟金三品厥篚纖纊出納之吝吏不能欺聖人一天下之志是之謂矣論語言為政之術先之以謹權量以道寓器以器明道天下得以因器會道所謂謹權量四方之政行焉景祐權量律度式周漢量法樂斗御製歷代度量衡篇會要景祐二年五月二十五日李照上造成今古權量律度式凡新尺律籥合升斗稱共七物尺準太府寺尺以起分寸為方籥廣九分長一寸高七分積六百三十分其黃鍾律管橫實七分高實九十分亦計六百三十分樂合方寸四分高一寸樂升廣二寸八分長三寸高二寸七分樂斗廣六寸長七寸高五寸四分總計三百六十方籥以應乾坤二䇿之數樂稱以一合水之重為一兩一升水之重為一斤一斗水之重為一稱又造漢書升合二枚周禮升豆二枚臣以新律籥合升斗比校周漢舊制今欲以塗金熟銅鑄造新定律籥合升斗及别以木造周漢升合豆升四等以備聖覽從之照以太府尺寸為本作量法木式四等而所容受不合絫黍之數又以太府尺寸作周漢量法木式各二等欲通己説亦不能合且漢志云合籥為合謂二十四銖而照誤云十籥識者譏之錢希白南部新書亦誤先是二月照請依神瞽律法鑄編鐘一簴使度量權衡協和四月丁巳詔制玉律請取秬黍葭莩照纍黍尺成律鑄鐘審之其聲猶高更用大府布帛尺為法下太常四律又自為律管之法以九十黍之量為四百二十星為十二管定法又鑄銅為籥合升斗四物率三百三十黍為黃鍾之容合三倍於籥升十二倍於合斗十倍於升既改造定法又鎛之容受差大更增六籥為合十合為升十升為斗銘曰樂斗及潞州上秬黍擇大黍縱絫之以考長短尺成與太府尺合法愈堅定三年九月十一日丙戌阮逸言臣造鐘磬皆稟馮元宋祁臣獨執周禮嘉量聲中黃鍾之法及國語鈞鐘絃準之制皆抑而不用竊觀御製樂髓新經歷代度量衡篇言隋書依漢志黍尺制管或不容千二百或不啻九寸之長此則明班志以後歷代無聞符合者惟蔡雍銅籥尺本得於周禮遺範故明堂月令章句云鐘以容受斤兩輕重為法管以大小長短為法皆率千二百黍以為本也御製新經又引禮記布手為尺白虎通八寸為尺説文八寸為咫同尺等法今議者不知鐘有鈞石量衡之制唐張文收定樂亦鑄銅甌臣欲更鑄嘉量逸進周禮度量法議欲先鑄嘉量然後取尺度權衡十月丁卯丁度等詳定言其疏舛不可用九月丁亥詳定黍尺鐘律丁度等言量器分寸既不合古則權衡之法不可獨用詔罷之壬辰推思逸瑗以遣之相秋官正楚衍等算籥合升斗皆不合阮逸胡瑗參周禮漢志歷代至聖朝天聖令文量法制皇祐籥合升斗以太府量校之二升九合一籥弱得太府升一升以二斗九升五合得太府一斗皇祐四年二月庚寅房庶上律吕旋相圖初庶以律尺籥進呈云云元豐銅量元祐三年閏十二月范鎮上新樂楊傑撰樂議七篇議量曰臣元豐議樂時見鎮所造銅量斛在上斗在下左耳為升右耳上為合下為籥上三下二與漢制符漢制曰聲中黃鍾叩鎮之量聲不合黃鍾但以黃鍾之鍾參考量聲則知中否先是鎮言胡瑗籥皆方制非似爵也房庶之籥圓徑九分深十分瑗用方分庶用圓分算之鎮鑄周釜漢斛司馬光謂考工記非經見劉歆不足法淳熙三器圖議程回撰重校三器圖議敘曰天地肇判隂陽攸分六位時成萬物形著是故體有長短所以起度也受有多寡所以生量也物有輕重所以用權也是器也皆準之上黨羊頭山之秬黍焉以之測幽隱之情達精微之理推三光之運則不失其度通八音之變則可召其和以辨上下則有品以分隆殺則有節凡朝廷出治生民日用未有頃刻不資焉者也歷考往古如虞舜垂重華之典周公作太平之書孔子欲行政於四方孟軻用揆敘於萬類舍是則何以哉嘗見有司頒禮既繆誤而莫知先儒談經亦闕略而未講於是采歷代之制考載籍之文而述度量衡三器圖議焉楊子雲曰大器其猶規矩準繩以其先定而後應也淳熙十年閏十一月丁酉序司馬公曰使古之律存則吹其聲而知聲度其長而知度審其容而知量校其輕重而知權衡今古律已亡矣非黍無以見度非度無以見律夫度量衡所以佐律而存法也古人所為制四器者以相參校以為三者雖亡茍其一存則三者從可推也又謂器或壞亡故載之於書形之於物夫黍者自然之物有常而不變者也故於此寓法焉然量有虛實衡有低昂皆易差而難精不若因度求律之為審也長短相形大小相乘輕重相抑昂皆物之所自有而度量權衡因焉范景仁曰若以尺生律漢書不當先言本起黃鍾之長而後論用黍之法也司馬公曰非謂太古以來律必生於度也特以古律不存故反從度法求之耳景仁樂書曰周禮璧羡度尺好三寸以為度璧羡之制從十寸廣八寸同謂之度尺以為度者是周之法十寸八寸皆為尺也量之法曰深尺內方尺而圓其外其實一釜積百三萬六千八百分鄭康成云積千寸非也是以方分百萬置於方尺之間而云也是不知方八寸圓其外深十寸之為算數也深尺者十寸之尺也方尺者八寸之尺也與璧羡之制同也漢之量法方尺而圓其外旁有庣焉其實一斛積百六十二萬分言方尺而不言深尺者無八寸之别也是漢用十寸為尺也漢書始有十寸為尺之説王制注步畝之法以為六國時始為八寸之尺是失於不知璧羡之法與釜之數也胡瑗云六十四升為釜六十四斗為鍾自是容受之量名殊非短長之尺法今鎮云周以八寸尺為量八八六十四故容六斗四升何穿鑿之甚又云漢以十寸為量故容十斗瑗云周量漢斛各有庣數范鎮曰樂者和氣也發和氣者聲音也聲音生於無形古人以有形之物傳其法然後無形之聲音得矣玉海卷八
