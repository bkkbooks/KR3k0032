body:
  text: 玉海卷一百六十八宋王應麟撰宫室院下開寶舍人院唐見上院在中書制敇院内初入者有儤直晉開運中楊昭儉約舊例刻石院中開寶九年十一月張洎興國三年正月丙申王克正直舍人院雍熙三年十月六日李沆宋湜王化基知制誥正員闕以正言以上至給事中知制誥中書召試制誥三篇惟梁周翰薛映梁鼎梁億陳堯佐歐陽修不召試石西京舊有題名石柱都汴廢咸平三年李宗諤始為壁刻記名氏故事知制誥上事設紫褥於庭面北拜㕔閣長立褥之東北隅謂之壓角熙寧三年五月六日蔡延慶王益柔直舍人院至是復除元豐四年十月二十七日鑄印以中書外省為文五年四月二十五日正除舍人曾鞏趙彦若陸佃元祐初蘇轍直舍人院改為權舍人嘉泰四年李璧直舍人院宋庠掖垣叢志三卷載官曹故事為十三門太平興國崇文院崇文院閱羣書三館書籍二館六庫書籍祥符崇文外院太平興國二年九月壬辰朔乙未幸新修三館賜役夫錢有差三年二月丙辰朔成通畧庚辰詔曰國家聿新宗宇大集羣書宜賜佳名以光䇿府其三館新修書院宜為崇文院崇文院有祕閣見閣類自經始至畢工臨幸者再按六典武徳中始置修文館貞觀建史館於禁中掌國史開元五年乾元殿束廊寫四部書十三年改集仙殿為集賢以修書院為集賢殿書院三館之名肇於此矣自是集賢殿昭文館置大學士史館置監修國史皆以宰相兼領史館集賢修撰史館有直館檢討集賢有直院校理皆以他官領之其昭文館隷門下省史館寓集賢尚未合為一自梁徙汴都舊制未備禎明中始於今右長慶門東北小屋數十間為三館五代時三館在右掖門内湫隘卑陋僅庇風雨周廬徼道多出其旁衛士騶卒朝夕喧雜每受詔撰述多移他所上即位因幸故館一本云太平興國中幸歴覽舊趾顧左右曰若此之陋豈所以待天下之賢俊耶即日詔有司度左昇龍門東北車府地為三館舊車輅院地命中貴人督工徒晨夜兼作其棟宇之制皆上親授自舉役車駕凡再幸二年九月久又三年二月辛未帝御崇文院觀羣書之詔親王宰相恣其檢閱三年二月丙辰朔有司奏畢功乃下詔詔在前輪奐壯麗冠乎内廷近世鮮比又詔敞園苑植花木引溝水以灌溉之西序啓便門以備臨幸盡遷西館之書分於兩廊貯焉東廊為昭文書庫南廊為集賢書庫西廊為史館書庫凡六庫分經史子集四部正副本凡八萬卷初乾徳中平蜀得書萬三千卷開寶中平吳得書二萬餘卷參以舊書為八萬卷凡六庫書籍皆以類相從用雕木為架以青綾帕羃之簡冊之府翕然一變矣一云前列三館後建祕閣書是年錢俶歸朝收籍送館閣是月十六日辛未帝幸新崇文院觀羣書久之詔宰相親王恣其檢閱問難少頃召劉鋹李煜至亦令縱觀因即中堂宴從臣盡醉而罷真宗咸平元年十一月命内臣監秘閣圖書三館書籍二年七月甲辰幸崇文院開書庫閱羣書登秘閣觀太宗御書賜館閣官器幣五年七月庚戌幸三館秘閣閱四庫書賜直閣校理器幣並詳見觀書類景徳四年十一月辛巳宴館閣官於院祥符八年夏禁中火五月翰學陳彭年言唐制中書門下兩省宫城之内有内省宫城之外有外省請於左右掖門外建外院别置三館書庫壬辰詔於右掖門外别置崇文外院内院奉安太宗聖容御書天文圖畫四廊為書庫及史館日厯庫館閣官宿直校勘抄寫雕印並於外院時内廷嚴火禁因命有司討論故事而改之又借太清樓本補寫天聖三年成萬七千六百卷自建隆至祥符藏書著録三萬六千三百八十卷天禧元年一云三年八月丁亥詔崇文外院以三館為額仁宗天聖五年十月同太后幸上曰三館書校開元四録所失甚衆宜加求募直史館謝泌言請依唐薛稷沈佺期武平一馬懐素人掌一庫上嘉之命泌等分領九年十一月上以迫近市囂非多士討論之地辛巳復遷三館於崇文院景祐中編次崇文總目三年十一月賜㑹於院嘉祐六年十二月二十三日壬寅賜輔臣兩制館閣官宴於崇文院宰臣韓琦以下刻石記於院之西壁先是詔置編定編校一員據崇文院總目刋正補寫至是寫校畢凡黄本六千四百九十六卷白本二千九百五十四卷上之神宗熙寧二年十一月丙寅命邢恕為崇文院校書以備訪問閏十一月壬寅張載為之元豐五年初以崇文院為秘書省建秘閣於中哲宗元祐五年九月十六日復置集賢院學士紹聖二年四月三日戊辰易為集賢殿修撰徽宗政和六年四月六日改右文太平興國文思院唐有文思院蓋天子内殿之比非工作之所興國三年志在六年始置文思院隷少府監掌工作之事有使監四人監門二人今屬工部分上下界上金銀珠玉下銅鐵竹木文青箱雜記考工記㮚氏量銘曰時思索故工作之所號文思院熙寧三年定制監官文武各一人罷内侍隆興二年併禮物局入焉乾徳五年十月丙辰朔置綾錦院以處蜀工興國三年二月十六日辛未幸西綾錦院命近臣縱觀織室機杼咸平元年九月令改織絹太平興國差遣院六年九月丙午詔京朝官除兩省御史臺自少卿監已下奉使從政於外受代而歸者令中書舍人郭䞇御史知雜滕中正户部郎中雷徳驤考勞積量才器以中書門下缺員類能擬定引對而授之謂之差遣院唐有選院案前代常參官一品以下皆曰京官今謂常參曰朝官秘書郎而下未嘗參曰京官舊制京官有員數京朝皆屬吏部三十月為滿任校其考第赴集國初之制月限既滿停其俸而釐務者復支罷則已但不常參除授皆出中書至是與朝官悉差遣院主之淳化四年五月丁未廢差遣院令審官院總之又以判流内銓蘇易簡王旦等同兼知考課院凡常調選人流内銓主之奏舉及歴任有殿累者考課院主之并吏員省司局議者以為當太平興國御書院唐有集賢殿御書院皇朝太宗留意筆札即位之後募求善書許自言於公車置御書院以王著為祗侯遷翰林侍書太平興國中選善書者七人為御書院祗侯自是書詔筆體一變人用傳寶逺追唐室矣院在崇政殿東北横門外内侍掌之有御書待詔祗侯後遷臨華門北又遷拱宸門閶闔門内北城下吕文仲為翰林侍讀寓直御書院祥符元年三月庚辰命給事中張秉等宿於御書院覆考試卷天聖五年十月甲午上與皇太后幸御書院觀太宗真宗御書院太宗所置在東宫學士宋綬撰記刻石院壁皇祐三年五月丁卯召近臣觀書於御書院嘉祐五年正月省御書院并圖畫院待詔以下冗員雍熙元年置翰林圖畫院在謻東門内咸平元年徙右掖門外待詔二人藝學六人又有天文醫官院太平興國進奏院唐藩鎮皆置邸京師以大将主之謂之上都留後大厯十二年五月甲寅改為上都知進奏院會要十一日改十四年二月四日敕諸道上都知進奏院官今後不與正貟貞元六年九月收諸道進奏官印三十紐碎之及五代以後支郡不隷藩鎮者聽自置邸隷藩鎮者則兼掌焉國初沿舊制皆本州鎮補人為進奏官其軍監場務轉運司則差知後官就京師新城門裏各置進奏院總天下之郵遞毎日早集内前待漏院東廊下承受宣敕諸司文字各就本州院發遞太平興國八年命供奉官張文粲就相國寺行香院簡閱進奏知後官得李楚等一百五十人並充進奏官分掌諸州罷知後官之名命張文粲與王禮都領之始為鈐轄諸道進奏院是年十月詔於大内側近置都進奏院踰年以石熙載宅充院以鈐轄諸道扁院額摹印章率用名流九年七月召進奏官李楚等於崇政殿擇三十三人㑹要曰三十人補殿前承㫖始定進奏官以百二十人為額監官二人熙寧四年二月十一日詔諸道進奏院以知銀臺司官提舉中興隷門下後省建炎四年五月二十五日命朝奉郎盧伸監院乾道九年二月二十一日隷門下後省哲宗正史云進奏院隷給事中進奏院掌邦國傳遽之事周官行夫其職也漢郡國有邸唐柳宗元邠寧進奏院記凡諸侯述職之禮必有棟宇建於京師朝覲為修容之地㑹計為交政之所其在周典則皆邑以具湯沐其在漢制則皆邸以奉朝請唐興因之則皆院以備進奏政以之成禮於是具由舊章也皇帝十一載以朗寧王張公為能俾其建節剖符守股肱之郡統爪牙之職董制三軍撫柔萬人乃新斯院弘我舊規髙其閈閎壮其門閤以奉王制以脩古典至敬也以尊朝覲以率貢職至忠也執忠與敬臣道畢矣公嘗鳴珮執玉展禮天朝又嘗伐叛獲醜獻功魏闕其餘歸時事修常職賔屬受辭而來使旅賁奉章而上謁稽疑於大宰質政於有司下及奔走之臣傳遽之役川流環運以達教令大凡展采於中都率由是焉故領斯院者必獲歴閶闔登太清仰萬乘之威而通内外之事王宫九闗而不間轅門十舍而如近斯乃軍府之要㑹朗寧之能政也惟公施徳下邑而黎人咸懐設險西陲而戎虜伏息茂功溢於太常盛烈動於人聽則斯院之設乃他政之末者也賛公於他政之末故詞不周徳稱公於天子之都故禮不稱位斯古道也太平興國登聞院理檢院唐置匭太平興國九年即雍熙元年七月庚申十二日詔改匭院為登聞院命諫官領之東延恩匭為崇仁檢南招諫匭為思諫檢西申寃匭為申明檢北通玄匭為招賢檢淳化三年又置理檢院以兩省官判淳化三年五月辛亥置理檢院於乾元門之西北廊以知制誥錢若水領之復唐制也今登聞院鼓司進状人有稱寃濫沈屈者即引送理檢院審問至道三年十一月乙酉廢理檢院景徳四年五月戊申改登聞院為登聞檢院亦置鼔在宣徳門南街東廊院在鼓院之西天聖七年上因讀唐史乃置匭函二月癸丑以御史中丞領理檢使中興初置局闕門之前紹興戊寅移置雙闕之左建炎三年隷諫院太平興國譯經院傳法院乾華院唐元和以後不復譯經翻譯之廢載祀二百非國家通道夷貉暨聲葱雪疇能復之乾徳四年三月遣僧行勤等一百五十七人訪經西域興國五年北天竺僧天息災與施䕶各持梵夾來獻息災賜名法賢又中天竺僧法天開寶七年至有意翻譯乃詔内侍鄭守鈞於太平興國寺大殿西度地作譯經院中設譯經堂其東序為潤文堂西序為正義堂七年壬午六月院成召息災等三人入院以所賫梵本各譯一經命光禄卿湯悦兵部郎張洎潤色法進等筆受綴文慧達等證義十月壬申臨幸七月十二日息災等各上新譯經一卷詔鏤版入藏自是取禁中梵夾藏録未載者譯之毎誕聖節五月一日即獻新經八年改譯經院為傳法院真宗景徳二年九月幸傳法院又置印經院十月甲申出新譯經五卷示宰相雍熙元年九月刋新譯經論二年詔四天竺僧精通梵語者悉館於院三年十月戊午御製新譯三藏聖教序以冠經首令刋石御書院雍熙二年十月丙午以天竺僧天息災等試鴻臚少卿初詔令與張洎同譯西天梵夾而潤色之至是成六十卷以獻詔附經蔵至三年十月成九十七卷戊午上親製序賜宰相李昉等真廟祗遹先訓咸平二年七月壬寅繼作聖教序賜之又著釋氏論以為戒律之書與周孔荀孟迹異道同祥符三年九月中天竺僧覺稱獻讃聖頌六年八月參政趙安仁等纂集新經并所降制詔賜名祥符法寶録凡二十一卷丁亥御製序賜之八年閏六月甲辰出太宗御製妙覺集五卷付院入藏得靈山之宻印冠汾水之英辭天禧二年九月以趙安仁所刻禮懴禪觀法印板送院附經藏三年二月法䕶等請以御製四十二章遺教經傳寫入藏四年二月袐演等請以聖製述釋典文章箋注附大藏詔可五年十一月丁丑以宰臣丁謂王欽若為譯經使仁宗述三寶賛以冠藏録天聖三年十月庚午欽若兼使四年十二月丙子夏竦上譯經音義七十卷是書祥符九年詔趙安仁楊億等刋定景祐二年九月法䕶惟淨以華梵對參為天竺字源七卷帝作序賜之六月詔史官夏竦撰傳法院碑銘十月上之序曰自興國壬午距今乙亥五十四載其貢獻并内出梵經無慮一千四百二十八夾譯成經論凡五百六十四卷譯者釋也交釋華梵對傳句讀辯佉樓之筆簡韋陀之辭云云詔刋石於院三年十二月詔續修法寶録四年四月上法寶新録寶元二年十一月二十五日立譯經碑銘工印賚官吏慶厯五年正月命宰臣章得象撰御製傳法院譯經碑後記三月二十二日以傳法院新建御書西竺聲源字毋碑殿為乾華殿熙寧四年三月廢印經院元豐元年十月三日甲辰命參政元絳參定新編法寶録五年七月八日丁亥罷譯經潤文使命禮部尚書領之初陳恕請罷傳法院不許乾道三年五月七日召僧若訥對選徳殿隋志佛經一千九百五十部六千一百九十八卷為三部曰大乗小乘雜經疑經别為一部又有論及戒律記凡十一種唐志釋氏二十五家四十部三百九十五卷不著録七十四家九百四十一卷又云貞觀内典録十卷智升續内典録一卷王彦威内典目録十二卷三元和三年三月辛亥惠琳撰經音目録一百卷靖邁古今譯經圖記四卷智昇續一卷書目開皇歴代三寶記十四卷隋開皇中費長房與劉慿為翻經學士與僧曇琨彥琮等譯經於興善寺長房因撰録自佛生周莊王時止隋開皇十七年一千二百餘年厯以甲子記其興廢事迹及諸經翻譯年世人名總目二卷附又開皇三寶録總目一卷僧智升撰開元録圎升撰正元録圎照續正元録天聖四年惟淨請以皇朝經總成一録詔合三録令續譯經律論西方東土聖賢集傳為之凡六千一百九十七卷初祥符六年八月趙安仁請以大宗及皇帝聖製編入東土聖賢集既成賚金帛事始隋文以沙門彥琮為繙經館學士唐紀武徳九年四月辛巳廢浮屠老子法六月復之傅弈髙識傳韓愈佛骨表沙門玄奘翻經大宗製聖教序髙宗為太子為述聖記並勒碑銘貞元初以誕日詔佛老大論麟徳殿文選周魯二莊親昭夜景之鑒漢晉兩明並勒丹青之飾然後遺文間出列刹相望澄什結轍於山西林逺肩隨乎江左慈孝寺銘采楹叢倚紺瓦翬飛寶網羅空金繩表道有殿中峙實奉先朝彤雲麗幄綺棟陵歊隆準如生清輝若在祗薦馨香疑聞謦欬嚴衛岑寂靈斿往來雨華紛馥飇馭徘徊日監孝思永錫純嘏時萬斯年在宥天下傳法院銘夏竦森沉天禄古經肇煥窈窱甘泉金人聳觀具偈難解譯法肇興四貉同文五天底貢竺典嵗増華經日續液金賁字彫瓊麗軸雍熙修史院元祐國史院紹興國史實録院史館見上雍熙四年九月直史館胡旦言自建隆元年至雍熙三年實録日厯皆未備臣按漢明帝後撰光武紀至靈帝時成百二十七卷今東觀記是也唐太宗述國初起義紀傳表志毎朝編録至代宗成百三十卷今舊唐書是也望準漢唐故事撰紀表傳志以備將來國史詔以史館西廡别置修史院給錢五百千為公用寫御書吏七人供其役旦又條追冊四祖宗室邕王宰相范質合為傳江南廣南河東西川湖南兩淛夏州為表律厯天文地理五行禮樂刑法食貨溝洫書籍道釋為志未幾成三卷㑹遷知制誥罷史職以孔維李覺代之以不稱職罷修纂淳化五年四月癸未以李至張洎同修國史景徳四年九月辛卯修太祖太宗正史宴監修王旦等於修史院乙丑以路振崔遵度為修國史院編修官壬辰令中書宻院檢閱建隆以來行事可書簡䇿者送院天聖九年五月乙亥徙修史院於宣徽北院之東初修真宗史寓中書第一㕔及史成續纂㑹要故徙之謂之編修院任天聖修真宗史欲重其宰臣為提舉參政樞副修史學士以上同修庶僚編修嘉祐三年八月辛酉置校正醫書局於編修院元豐四年十一月廢編修院歸史館明年改官制日厯隷國史案修前朝國史實録則置院一云國史院有故則置假左散騎常侍㕔為之元祐五年十一月十三日尚書省言舊置編修院掌國史實録日厯元豐罷入史館今神宗實録将畢盍嚴其藏詔移國史案就今置局處専掌國史實録編修日厯以國史院為名隷門下省明年又置國史院脩撰兼知院事紹聖二年三月詔日厯復歸祕省靖國元年九月移著局就實録院脩哲宗日厯元符三年十二月甲辰脩㑹要即秘省置局紹興初實録國史皆寓史館先是建炎元年五月八日詔史館重修神哲實録紹興六年正月神録成八年九月哲録成後又移於省側别為一所九年二月癸酉二十二日修徽録即史館為實録院置提舉一員脩撰同脩撰檢討無定員以史館前㕔為院側門通史館秘省十年二月二十九日罷史館併於實録院四月十九日始除范同兼脩撰二十一日詔實録院就編徽宗御製二十八年七月十九日丙子詔置脩國史院在秘省門内之東修神哲徽正史先是十年二月十三日提舉官請俟徽録成修正史置院故有是命八月十四日庚子命宰臣監脩侍從同脩庶僚編脩明年八月二十四日詔宰臣提舉脩史同脩共二貟編脩二貟從給舍裁定也乾道二年十二月十四日脩欽宗實録復置實録院以國史院官兼脩四年四月二十二日書成併入國史院六年四月七日重脩徽録復置淳熙四年三月九日書成罷乾道四年六月國史院增編修官二貟五年九月二日又増三貟録淳熙十五年五月二十三日復置實録院脩髙監修舊惟修日厯乾徳二年正月壬寅命趙普乾興元年命馮拯監修真宗實録元豐以後宰臣不入銜紹興三年十二月六日右相朱勝非監修唐制監修國史降制自趙普止以敇除非故事也提舉紹興三年六月二十七日命左相吕頤浩提舉國史二十六年五月沈該万俟卨並相分提舉監修為二至今因之修撰故事史館撰日厯修撰官直官分季修纂其後止修撰判館撰次興國中直史館趙隣幾等皆曾修撰淳化四年翰學宋湜以修國史亦修日厯元豐七年十一月己亥詔記注送著作所其日厯非編修官不與翰林學士為修國史侍從為同修庶官為編修無定員執政權監修國史自隆興二年錢端禮始權提舉國史院自乾道元年三月虞允文始權提舉實録院自乾道二年魏杞始庶官同修國史自隆興初胡銓始權同修國史自淳熙三年李燾始雍熙啓聖院又見下二年四月己卯啓聖禪院成詔僧睿濟主之其地即晉之䕶聖營也天福四年上誕於其地興國中詔建為寺六年而功畢殿宇凡九百餘間皆以瑠璃瓦覆之七月丁巳幸三年十月己酉幸淳化審刑院掌詳讞大理所斷案牘而奏之以朝臣一人或二人知院事有詳議官六人皆自館閣為之書令史十二人先是天下案牘先定於大理覆之於刑部太宗慮法吏舞文淳化二年八月己卯詔置審刑院於禁中以樞宻直學士李昌齡知院事凡具獄案牘先經大理斷讞既定闗報審刑知院定成文章奏訖然後下丞相府丞相又以聞始命論決蓋重慎之至也一云太宗以中書權太重諫官向敏中請分吏房置審官院刑房置審刑院以兩制領之使先是刑部設詳覆之官諸路命糾察之㑹要審刑院在右掖門内掌詳讞大理所斷案牘而奏之嘉祐六年八月戊辰徙院於右掖門西院舊在長慶門東併其地入中書而徙之或云淳化二年置在右掖門内或云在中書西南隅元豐二年二月六日以審官東院地為審刑院太常禮院地為刑部詳斷司三年八月己亥詔審刑院官為判刑部蘇頌記曰院舊在中書西南隅嘉祐四年徙於右掖之西墉外淳化審官院東院西院考課院三班院詳見銓選門磨勘院差遣院詳見上紀淳化三年十月戊寅始置京朝幕職州縣官攷課院㑹要云磨勘京朝官院徳先是雍熙二年四月以中丞劉保勲十月右諫議雷驤端拱元年六月左諫議劉蟠同知京朝官考課詔曰三攷黜陟有虞之茂典八使按行東漢之舊章茍課最之不明於賞勸而何在應諸道知州通判及釐務京朝官録事判官縣令簿尉内有徳行尤異吏民畏服及居官廉恪莅事明敏獄訟無滯倉庫盈羨冦盜剪滅部内清肅者本道轉運使各以名聞當驛召赴闕親臨問狀增秩懋賞以旌其能其有貪猥自私臨涖無取條狀來上當行貶斥壬午以王沔謝泌王仲華同知京朝官考課張宏髙象先范正辭同知幕職州縣官考課魏廷式趙鎔季著同較三班院殿直上慮内外官吏清濁混淆莫能甄别故分命沔等考校其課績以其狀聞因行黜涉之典沔既條奏其法於是御史戈子元郎吏張紳皆以負黜焉四年二月丙戌以考課京朝官院為審官院幕職州縣官院為攷課院謝泌言磨勘之名非典訓故易之初建隆初始以戸口増耗為州縣吏嵗課之升降興國又定三等之法以覈能否其後六年九月詔郭䞇滕中正雷徳驤典其事雍熙間閱班簿欲擇用人而患不能徧知羣才始詔徳驤以羣臣功過之迹引與俱對實録淳化四年五月丁未以翰林學士錢若水樞宻直學士劉昌言同知審官院先是置京朝官差遣院以别令校其殿最至是併而為一命若水等主之淳化五年五月戊寅親書課最之意一十餘幅以賜若水等又以幕職州縣官考課院歸流内銓俾承㫖蘇易簡虞部王旦同領其事從易簡之請也唯三班無所改易一云太宗初置京朝磨勘院差遣院京朝官院四年二月丙戌改為審官院又太平興國中所置差遣院至是併入院在宣徳門外西北廊掌校考京朝官之殿最分擬内外之任而奏之知院事二人書令史七人舊制右職升朝以上並除授於樞宻院咸平四年四月丙辰審官院引對京朝官上親閱殿最而黜涉之熙寧三年五月丁巳二十八日詔以審官院為審官東院置主簿二别置西院如文臣格知院官兩員専領閤門祗候以上至諸司使磨勘掌程差遣命天章閣待制齊恢為知院兵部侍郎韓縝同知仍以太常禮院治所為審官西院從參政王安石韓絳之言也省樞宻院六十有二事歸之六月九日鑄印五年十二月六日知西院沈立等上新修條貫十卷總領一卷元豐五年五月改東西院為尚書左右選雍熙四年七月庚辰置三班院置局禁中嘉祐八年正月癸丑徙文思院之西舊在宣徽院内客省使㕔以出入禁中非便故徙之淳化起居院崇政殿起居注㑹要起居院國初置但關敕送史館不復撰集淳化五年始别命官掌起居注以備史官以館閣官兼掌焉四月丙戌即五日右諫議大夫史館修撰張佖言伏見聖朝編年謂之日厯惟紀報狀畧叙敕文至於聖徳嘉言皇猷美事羣臣之忠邪善惡庶務之沿革弛張汗簡無聞國經曷紀謹按六典故事起居郎掌記天子法度以修記事之史凡記事之制必書朔日甲乙以紀厯數典禮文物以攷制度遷拜旌賞以勸善誅罰黜免以懲惡季終則授於國史舍人掌録天子詔制徳音修記言之史如記事之制季終則授於國史欲望依故事請置起居院修左右史之職以記録為起居注毎月與時政記同送史館上覽而嘉之乃置起居院於禁中命起居舍人史館修撰梁周翰掌起居郎直昭文館李宗諤掌起居舍人事其修撰注記體式委周翰等檢討故事以聞是月丁酉周翰等言按禮記天子動則左史書之言則右史書之又曰左史記言右史記事言則尚書是也事則春秋是也漢武有禁中起居注自魏至晉起居之職歸著作後魏始置起居令史後周别置起居注二人北齊有起居省隋置舍人二人掌内史唐隷於門下顯慶中郎舍人分屬兩省起居注季終授史官以俟筆削請自令百官封拜除改沿革具條件報起居院以備編録月具所録送史館從之仍令郎舍人更直於崇政殿以記言動别為起居注付史官又言起居注先進御後付史館自後授者為同修起居注天子御正殿不侍左右惟朝㑹對立香案前常日遞直於崇政延和二殿行幸則從上出入祥符六年八月庚午徙起居院於三館八年四月移院於右掖門外西廊天禧三年十二月管起居院事劉崇超言事當嚴宻今在宫城外慮有漏泄宜依舊制徙右掖門内從之元豐二年八月十一日丙午詔修注官於崇政延和殿直前陳奏從王存請也甲辰存上言二十四日詔諸司關報史館文字歸起居院五年四月二十五日改為郎舍人各為㕔於兩後省景徳應天院雍熙啓聖院見上景徳四年春二月車駕朝陵因幸西京癸酉詔太祖誕生之地太祖降誕於西京山子營建為應天院中置神御殿圖繪聖容天禧元年成凡九百九十一區在西京上東門内祥符元年命李宗諤覆視二年賜名天禧元年五月己未命宰臣敏中奉安聖容天聖中欲置真宗神御而難於遺太宗因以殿後齋宫並置二殿曰三聖殿慶厯中名太祖殿曰興先太宗曰帝華真宗曰昭考太宗降生之地興國六年建啓聖院晉䕶聖營也雍熙二年成凡九百六十區在京舊城内北隅咸平二年九月甲午奉安太宗聖容於院之新殿天聖八年十月二十六日幸洪福院明道二年二月八日再幸景徳禮賔院唐見上在歸徳坊舊有蕃驛院景徳三年併入掌蕃夷朝貢互市天禧三年三月詔禮賔院不得以外國人充通事熙寧九年四月四日省禮賔院監官景徳登聞鼔院檢院見上國初日鼓司内臣掌之鼔在宣徳門南街西廡院在門西之北廊至道三年命中舍王濟掌之始用朝臣民有訴失猳豚者上亦為聽決且謂推此心臨天下可以無寃民咸平二年四月丙辰嚴封事進入限己未選從臣張宏王旦兼知登聞院慮壅蔽也景徳四年五月戊申改鼔司為登聞鼓院院在宣徳門西之北廊命知制誥周起領之掌諸上封受而進之以達人情判院二人監鼔内侍二人隷司諫正言文武官無例於閤門上封者許詣鼓院進狀登聞院為登聞檢院天禧二年正月辛亥禮部侍郎王曽判檢院天聖七年閏二月癸丑置理檢使以中丞為之其登聞院匭函改為檢匣時上封者言至道三年廢理檢院而天下寃枉朝廷得失浸不達上讀唐史見匭函故事夏竦因請復置使領乙卯以命中丞王曙淳化三年五月置至道三年十一月乙酉廢六月辛卯命晏殊等看詳轉對章疏及檢院所上封事類次可行者以聞元豐改制中丞始不帶理檢使建炎元年六月四日壬戌置院於闕門之前行宫宫門之外一云便門從宰臣李綱之言也三年詔隷諫院旬申理檢院名存實廢乾道三年六月二十一日監檢院李木請因名責實詔後省議給事中王曮等請進狀人沈屈者送中丞審問中丞闕付以次官事體重者降付臺諫閏七月十五日從之紹興二十八年十月二十七日右正言朱倬言設敢諫之鼔置理檢之司以通下情達寃抑故實封條目鼔院有八檢院有六外此則通封投陳初鼔院次檢院次理檢此其序也舜鼓禹軺周鼓廣言路通下情祥符錫慶院祥符元年十二月二十八日一作甲寅以南衙為錫慶院以備宴㑹先是酺宴集於尚書省或都亭驛誕節齊㑹則就相國寺上以佛舍中烹飪優笑有虧恭潔乃令内臣度舍宇顯敞者易之南衙即太宗尹京師府邸秦王許王居焉後虚其正位故以為院三年十二月戊辰奉祀官習儀於院四年九月乙未六年十月五日宴百官天禧五年宴契丹使天聖元年以後誕節宴慶厯五年十月癸亥宴百官皇祐二年十月宴父老治平二年正月三日宴羣臣及契丹使並於是院祥符南宫北宅書院祥符三年七月壬寅詔南宫北宅大將軍已下各赴書院講讀經史諸院十嵗已上並入學受經學書委侍教勤心誘勸祥符御史臺三院大中祥符五年始定御史六員之制有大夫中丞侍御史殿中侍御史監察御史主簿以侍御史為臺院殿中侍御史為殿院監察御史為察院謂之三院祥符七年九月知雜王隨請命兩制撰重修御史臺記從之天禧元年二月丁丑初選諫官御史各六員不兼他職専掌諫爭祥符禮儀院天聖太常禮院祥符六年八月庚午詔以起居院詳定所為禮儀院命兵部侍郎趙安仁翰林學士陳彭年同知院初置詳定所即命彭年領之以彭年修起居注故命就起居院置局長編注詳定所自元年四月置至六年八月庚午改名禮儀院徙起居院於三館按唐制有知禮儀院禮儀使之目自建中後唯郊祀權置禮儀使事畢即罷國初止以禮院掌其事雍熙初議封禪特命學士常參官扈蒙等七人同詳定儀注事畢即罷大中祥符元年東封又命學士待制晁逈等五人與判禮院李維等三人詳定儀注事畢遂不廢至七年二月庚辰以參知政事丁謂判禮儀院而翰林學士陳彭年知院如故自是多以參政一員判院以學士丞郎諸司三品以上一員知院揭榜刻印移文他局悉以銀臺司為準所掌有四案又選判禮院官二人赴院編修其後别置院於右掖門外凡行禮所用儀仗法物有未合典禮者悉裁定制度内外書奏中書禮房所主者悉付之天聖元年四月樞宻副使張士遜言禮儀院占公人二十二人嵗費錢千七百貫詳定儀制久來屬太常寺及禮院勾管今請停罷辛丑遂廢焉以知禮儀院翰學晏殊龍圖閣直學士馮元為判太常禮院而同判太常禮院為同知院明道元年五月庚辰詔太常禮院日輪知院一人在院檢㸃典禮公事初知禮院薛紳言漢魏以來朝廷大政必下禮官博士定議唐六典太常博士四人今知院古博士職也國初同知院四員日更直本院其後或别領職事請如故事乃下兩制議翰學馮元等言咸平元年正月敕日輪一員在院祥符七年四月敕同判院四員張復張嵎専主祠祭而宋綬晏殊常在禮儀院移三館於左掖門西與禮儀院禮院相接同判院官皆帶館職今既廢禮儀院又三館移入禁中請如紳奏康定元年十一月禮院言奉常禮樂之司請改判院為判寺兼禮儀事其同知院凡事先申寺然後施行乙丑改命李仲容兼禮儀事判太常禮院吳育宋祁同判院兼禮儀事熙寧三年五月詔以太常禮院為審宫西院其禮院歸太常寺置局四年六月二十四日以舊審刑院為太常禮院元豐五年更官制以太常卿少領之始復古制總局十有三祥符嘉慶院禮㑹院見宗室類祥符九年五月乙巳以新昌坊第一區為皇親禮㑹院額曰嘉慶景祐三年九月庚寅以潞王舊宅嘉慶院為殿前都虞候公廨寶元元年十一月乙未以嘉慶院為景靈宫道院熙寧初以嘉慶院為將作監天禧納質院天禧元年七月乙巳命府州置納質院蕃落毎為冦盜慮其復叛因置是院收其子弟景徳三年九月乙丑詔西靣諸州納質院繫戎人皆編遣之漢質館見上明道諫院端拱元年二月乙未改補闕拾遺為司諫正言天禧元年二月丁丑置御史諫官十二人兩省諫官六貟諫院以兩省官一貟判院事其員有左右諫議大夫司諫正言御史臺置侍御史以下六員毎日領一員奏事國朝承五代之敝官失其守官職差遣離而為二今之官用以定俸入不親職事諫議大夫司諫正言别降敕許赴諫院供職乃曰諫官天聖九年七月甲戌右正言陳執中罷三司度支判官諫院供職舊未有治舍明道元年即天聖十年七月辛卯一作辛亥二十七日以門下省為諫院徙舊省於右掖門西執中請選臣僚主判詔諫院印并公事命石中立兼領自先朝除諫官未嘗置院及執中為諫官屡請之置諫院自此始真宗於門下省置諫院御史臺别立憲官後執政畏忌而罷之天聖元年上封者請増置言職詔翰學以下各舉一貟以名聞擢諫官御史自後言職始備慶厯三年三月癸巳命王素歐陽脩知諫院余靖右正言諫院供職四月己酉蔡襄知諫院熙寧八年閏四月丙午詔知諫院綴兩省班元豐用唐制置諫官八員分左右隷兩省建炎三年七月辛卯詔諫院别置局不隷後省許與兩省官相見議事淳熙十五年林栗奏諫官侵御史之事願倣唐制置遺補不任糾劾之職上命考前代本末曰若諫官専務規正雖增十員亦可正月八日復置拾遺補闕二月八日命薛叔似許及之元豐正名左右散騎常侍闕不除而諫議大夫遂為諫垣之長六年十月六日初以趙彥若為右諫議省淳熙十六年三月遺補之官真宗下詔增置十二員月責諫疏後纔得四人諫官二人魯宗道劉曄御史二人劉平章穎孜孜獻替唯宗道而已司馬光諫院題名記云天禧初詔置諫官六員責其職事仁宗復置諫官又得四員諫官二人劉隨孔道輔御史二人曹修古王碩天聖元年四月丁巳詔近臣舉諫官御史慶厯五年正月乙亥復置言事御史四年八月戊午詔毋以輔臣所薦官為諫官御史漢諫大夫列職清近日侍人主諫官於隋屬門下省唐初因之亦嘗屬中書省及分列兩省夫御史諫官均任言責然御史臺在外而獨諫官既為侍從又别兩省蓋不在政事之地則無以盡聞政事之過差不列待從之班則無以盡知人主之闕失元祐元年令隔截兩省諫官别開門出入不得與給舍相通欲以後省常侍諫議起居舍人正言㕔為制敕院王巖叟王覿言之十二月十八日詔諫官直舍令依舊景祐朝集院咸平四年四月癸丑一作癸亥置朝集院於朱雀門外凡百餘區以朝臣外任代還者寓逆旅故置焉尋罷景祐二年十月辛亥朔詔曰國家分建羣臣外釐庶務毎代還於京輦或寓止於客坊稽信書於往載有朝邸之舊規爰飭攸居用昭予眷宜於京師置朝集院三年十月甲寅新作朝集院成詔常參官並以至闕先後為次仍令三司御史臺檢轄之建炎承慶院建炎元年十二月時先朝嬪御皆至行在建承慶院以處之又置升暘宫以治兵器及服御所須之物戊辰右諫議衛膚敏上疏紹興御書院建炎三年罷御書院紹興十六年十一月十七日癸未復置於宫門内資善堂後隷翰林院學生試五體書祗候試六體書藝學待詔試七體書十七年四月十七日畢工二十年正月十七日罷御書院歴代院名隋椒房朝采含香春風滋蘭南風大業東西芳華延光承華凝暉麗景飛英流芳耀儀結綺百福萬善長春永樂清暑明徳唐飛香襲芳仙居山齋花光翔龍神居歴代房名隋永徽流景丹臺新録所載東華九靈上清琳房髙晨寢瓊室玉海卷一百六十八
