body:
  text: 玉海卷八十宋王應麟撰車服鹵簿有文事必有武備故整法物之駕嚴師兵之衛總名鹵簿唐人謂鹵櫓也甲楯之别名兵衛以甲楯居外為前導皆著之簿故曰鹵簿五禮精義曰鹵大盾也以大盾領一部之人故言鹵簿漢甘泉鹵簿漢官鹵簿圖鹵簿篇又見屬車漢志甘泉在雲陽黃帝接萬靈之明庭自古祭天圜丘處本秦林光宫自文帝郊五畤三歲一郊車駕必幸雍甘泉故有甘泉鹵簿輿服志乘輿大駕屬車八十一乘備千乘萬騎西都行祠天郊甘泉備之官有其注名曰甘泉鹵簿文選注胡廣漢官制度云云注蔡雍表志曰國家舊章幽僻藏蔽莫之得見應劭漢官鹵簿圖曰乘輿大駕則御鳳皇車以金根為副宋志宣和鹵簿記云應劭漢鹵簿圖有騎執箛箛即笳通典同漢唐六典注云官儀鹵簿篇西京雜記漢朝輿駕祠甘泉汾陰備千乘萬騎太僕執轡大將軍陪乘名為大駕車有司馬辟惡記道靖室象車武剛九遊雲罕皮軒闟戟鸞旗建華相風烏金根之名儀衛有騎隊鼓吹黃麾騎罼罕節御馬華蓋剛鼓之制或分八校或分十六校式道有候護駕有官晉志孝武總文景之資揚霓拂翳皮軒記鼓橫汾河而祠后土登甘泉而祭昊天奉常獻儀謂之大駕車千乘而騎萬匹揚雄所謂彏天狼之威弧張曜日之靈旄者也宋禮志甘泉鹵簿者道車五乘遊車九乘文選曲水序注同在乘輿車前又有象車最在前試橋道晉江左駕猶有之大駕漢都長安時祠天於甘泉用之都洛陽上原陵又用之後漢祠天郊用法駕祠宗廟用小駕小駕減損副車也南齊禮志車服之儀率遵漢制南郊大駕北郊明堂降為法駕衮冕之服諸祠咸用云春秋正義異義古毛詩説天子之大夫皆駕四故詩四牡如今乘輿有大駕中駕小駕為行之等差也其諸侯大夫士唯駕二漢春秋正義服虔云纓如索裙今乘輿大駕有之然則魏以來大駕之馬膺有索裙是纓之遺象隋志卓彼上天宫室混成玄戈居其左上將居其右弧矢揚威羽林置陳天垂象聖人則之軒轅以師兵為營衛至二代其儀大備漢武上甘泉則列鹵簿車千乘騎萬匹其居前殿則植戟懸楯以戒不虞所由來尚矣文選甘泉遺儀注胡廣漢官制度曰天子出車駕次第謂之鹵簿長安時出祠天於甘泉用之名曰甘泉鹵簿司馬遷傳從上上雍注如淳曰遷時從上在鹵簿中也上林賦鼓嚴簿注孟康曰簿鹵簿也甘泉賦乃命羣僚歷吉日協靈辰星陳而天行詔招搖與泰陰兮伏鉤陳使當兵屬堪輿以壁壘兮梢夔魖抶獝狂八神奔而警蹕兮振殷轔而軍裝蚩尤之倫帶干將秉玉戚駢羅列布魚頡而鳥𦐄乘輿乃登夫鳳皇兮翳華芝駟蒼螭兮六素蚪蠖略㽔綏灕呼襂纚帥爾陰閉霅然陽開騰清霄而軼浮景兮夫何旟旐郅偈之旖旎也流星旄而電燭兮咸翠蓋而鸞旗敦萬騎於中營兮方玉車之千乘聲駍隱以陸離兮輕先疾雷以馺遺風集禮神之囿登頌祇之堂建光耀之長旓兮昭華覆華蓋也之威威風漎漎而扶轄兮鸞鳳紛其銜㽔云云揚雄從上祠甘泉還奏賦以風時趙昭儀在屬車豹尾中故雄盛言車騎之衆參麗之駕非所以感動天地逆釐三神漢大駕見上法駕文紀奉天子法駕迎代邸注如淳曰法駕侍中驂乘奉車郎御屬車三十六乘孝文詔曰鸞旗在前屬車在後谷永傳朝覲法出而後駕陳兵清道而後行霍光傳昌邑王駕法駕皮軒鸞旗叔孫通傳注應劭曰月旦出高帝衣冠備法駕名曰遊衣冠上林賦襲朝服乘法駕建華旗鳴玉鸞西都賦乘鸞輿備法駕西京賦大駕幸乎平樂張甲乙而襲翠被攢珍寶之玩好紛瑰麗以奓靡宫曰法宫坐曰法坐服曰法服漢大駕鹵簿儀式法駕法物後紀建武十三年四月大司馬吳漢自蜀還京師益州傳送公孫述瞽師郊廟樂器葆車輿輦於是法物始備注法物謂大駕鹵簿儀式也時草創未暇今得之始備官志大僕卿掌車馬天子每出奏駕上鹵簿用大駕則執馭侍中侍顧問應對法駕出則多識者一人參乘負傳國璽操斬白蛇劍餘皆騎在乘輿車後永元九年八月魯恭拜侍中特使陪乘十五年賜駙馬從駕五營注案大駕鹵簿五校在前各有鼓吹一部文選注應劭漢官儀曰大駕鹵簿五營校尉在前名曰填衛輿服志見乘輿諸侯王法駕官屬傅相以下皆備鹵簿鴻嘉中太傅奏梁王立願令非耕祠法駕毋得出宫設鮑宣乘傳去法駕彪禮儀志皇后親蠶車府令鹵簿莊子司馬注秋駕法駕也儒林傳明帝行三雍之禮備法物之駕盛清道之儀注胡廣漢制度曰天子出有大駕法駕小駕大駕公卿奉引大將軍驂乘大僕御屬車八十一乘法駕公不在鹵簿唯河南尹執金吾洛陽令奉引侍中驂乘奉車郎御屬車三十六乘小駕太僕奉駕侍御史整車騎楊秉傳王者至尊出入有常警蹕而行靜室而止非郊廟之事則鑾旗不駕齊志江淹議云後漢唯南郊備大駕自北郊以下車駕十省其二衛宏漢舊儀曰皇帝起居儀宫司馬內百官所傳按籍而後出入營衛周廬晝夜誰何殿外門屬衛尉殿內郎舍屬光祿勳黃門鉤盾屬少府輦動則左右帷幄者稱警車駕則衛官填街騎士塞路出殿則傳蹕止人清道建五旗丞相九卿執兵奉引先置索清宫而後往所以重威防未然也乘輿冠高山冠飛羽之纓幘耳赤丹素裏帶七尺斬蛇劍履虎尾絇履漢東京鹵簿續官志太僕天子每出奏駕上鹵簿輿服志輕車洞朱輪輿大駕法駕出射聲校尉司馬吏士載以次屬車在鹵簿中郊天黃門從官四人冠巧士冠在鹵簿中以備宦者四星晉志象車漢鹵簿最在前宋志每出警蹕清道建五旗大僕奉駕條上鹵簿漢儀曰出稱警入稱蹕隋禮儀志闟豬車其飾如木輅重輞漫輪蚪龍繞轂漢東京鹵簿所謂獵車者也六典注漢官儀鹵簿篇太常駕四馬主簿前車八乘晉中朝大駕鹵簿鹵簿圖輿服志中朝大駕鹵簿先象車鼓吹一部次洛陽亭長赤車洛陽令皂車黃門前部鼓吹司南九遊武剛雲罕闟戟皮軒鸞旗建華車相風五時車高蓋左罼右罕華蓋棡鼓金根車建青旗十二曲華蓋黃鉞車五牛旗大輦五色立車安車建旗十二如車色闟豬耕根車赤旗十二御軺四望衣書藥車豹尾車自豹尾後鹵簿盡矣次輕車二十乘流蘇馬六十匹次金鉞金鉦車駕三中道黃門後部鼓吹次戟鼓車此車輿之制也靜室令中道式道候分左右次洛陽尉令亭長河南掾尹簿記次司隸廷尉太常光祿衛尉太尉司徒司空或駕一或駕三或駕駟次中護軍步兵長水射聲翊軍越屯騎校尉驍騎遊擊左右前後領軍將軍並鹵簿左右二行鼓吹一部次領護驍騎遊軍校尉繖扇憧麾各一騎鼓吹一部七騎領護軍加大車斧終於金顔督將此百官之儀也兵器則有大戟楯九尺楯刀楯弓矢弩細楯由基細弩迹禽椎斧鑿􅠱斧又以神弩二十張夾道騎皆持矟終於騎十隊大戟九尺楯刀楯弓弩各一隊儀仗則有遮列騎御麾騎馬鞭方扇鞉角金鼓信幡憧麾之屬服飾則有朱衣絳袍黑袴褶之屬職官志武帝每出入將軍陳協持白獸幡在乘輿左右鹵簿陳列齊肅宋志晉武帝問侍臣旄頭何義禮志元帝大興中詔左右衛及諸營依大習儀作鴈羽仗鄭默傳武帝出祠南郊詔使默驂乘夏統傳賈充欲耀以文武鹵簿命建朱旗舉幡校分羽騎為隊軍伍肅然須臾鼓吹亂作胡葭長鳴車乘紛錯隋志晉鹵簿圖一卷鹵簿儀二卷齊鹵簿儀陳鹵簿圖各一卷儀注類唐志大駕鹵簿一卷史記索隱按中朝鹵簿圖云雲罕駕駟正義中朝鹵簿圖云九斿車駕駟雲罕車駕駟隋志唐六典注引中朝鹵簿宋綬云中朝江左嘗圖鹵簿晉皇太子鹵簿初學記張敞晉東宫舊事曰皇太子初拜有赤毦幢一石山安車一建九旗青色四馬皇太子鹵簿有黃麾大小會庭設三廂樂舞六佾宋劉韞歷湘雍二州刺史令畫工圖鹵簿羽儀常自披玩王僧孺遇中丞鹵簿隋書曰晉氏鹵簿御史軺車行中道北史故事刺史奉辭備鹵簿後同南朝御史中丞建康令皆有鹵簿君臣之通稱今有張司空鹵簿圖後魏三駕鹵簿禮志太祖天興二年正月乙丑命禮官採古事制三駕鹵簿一曰大駕設五輅建太常屬車八十一乘千乘萬騎魚麗鴈行前驅皮軒闟戟芝蓋雲罕指南後殿豹尾鳴葭唱上下作鼓吹軍戎大祠則設之二曰法駕屬車三十六乘小祠則設之三曰小駕屬車十二乘天賜二年初改大駕魚麗鴈行更為方陳鹵簿列步騎內外為四重列檦建旌通門四達五色車旗各處其方孝文太和十三年正月辛亥祀圓丘初備大駕制太和中詔李韶監造車輅一遵古式考舊典以冠服百竂六宫各有差次唐鹵簿大駕法駕小駕鹵簿圖鹵簿令東宫鹵簿儀衛志唐制天子居曰衙行曰駕人君舉動必以扇出入則撞鐘庭設樂宫道路有鹵簿鼓吹禮官百司備物而後動大駕鹵簿天子將出太樂令設宫縣之樂於庭侍中奏中嚴有司陳鹵簿諸衛以次陳殿庭既外辦太僕卿執轡天子乘輿以出天子升路太僕授輿黃門侍郎奏請發鑾駕動警蹕鼓傳音萬年令先導次京兆牧太常卿司徒御史大夫兵部尚書皆乘路鹵簿如本品五路玉金象革木皆有副車有指南記里鼓白鷺鸞旗辟惡皮軒耕根安車四望羊車黃鉞豹尾及屬車十二乘輿有相風行漏腰輿小輿五牛旗輿輦有大輦方輦小輦以旗計者二十七曰青龍白虎辟邪應龍玉馬三角獸黃龍負圖黃鹿飛麟駃騠鸞鳳飛黃麟角端赤熊兕太平犀牛駿鸃騼䮷騶牙蒼烏白狼龍馬金牛衙門旗并黃麾玄武幢絳麾孔雀毦罕畢總三十二名一本云二十七名當考以隊者七曰清遊朱雀步甲持鈒玄武諸衛馬隊大戟隊以兵計者自金吾果毅佽飛至衙門右左廂凡大駕一千八百三十八人分為二十四隊列為二百十四行參六典仗則有黃麾仗細仗儀刀仗殳仗衛則有親勳翊衛散手衛儀物有曲直華蓋六寶香蹬大繖雉尾障扇雉尾扇方雉尾扇花蓋小雉尾扇朱畫團扇俾倪之屬戎器有鈒戟弓箭橫刀䂍矟細矟鐵甲甲騎具裝銀裝儀刀班劔金裝長刀御刀黃鉞楯䂎弩黑鍪甲之屬服飾有平巾幘緋裲襠大口褲緋衫紫黃纁朱緑綟綬紛武辨朱衣革帶繡衣青衫赤綦襖黃冒黃袍衫紫誕帶行縢緋袴褶戎服大袍之屬鼓吹有掆鼓金鉦大鼓長鳴鐃鼓歌簫笳大橫吹節鼓笛簫觱篥桃皮觱篥小鼓中鳴羽葆鼓大角之屬凡五部七十五曲警嚴則夜十二曲中三曲五更三遍樂有宫縣㽔賔鍾采茨大和回路南向侍中請降路乘輿乃入繖扇侍御警蹕如初皇帝入侍中版奏請解嚴叩鉦將士皆休法駕官則減太常司徒兵部尚書車則減白鷺辟惡大輦五副路安車四望車及屬車四六典云四分屬車之一隊則清遊持鈒玄武皆減四之一鼓吹減三之一小駕又減御史大夫及指南記里鼓鸞旗皮軒車象革木三路耕根羊黃鉞豹尾車屬車小輦小輿諸隊及鼓吹減大駕之半凡小駕鹵簿一千五百人分二十四隊列一百二十行參六典大駕鹵簿以官計者自導駕萬年縣令六引至豹尾之後金吾折衝總一百六員以車計者自指南記里至黃鉞豹尾車總三十六乘以儀物計者自白澤朱雀旗至黃麾仗繡幡總二十七名以鼓吹計者自掆鼓金鉦至笛簫觱篥總十五事以兵計者自金吾折衝果毅至殳仗牙門左右箱總若干人此大駕鹵簿也至於法駕則屬車減四諸隊四分減一鼓吹三分減一威儀亦三分減一小駕車輦隊仗鼓吹各減大駕其中或與前小異當考太皇太后皇太后皇后出司仗布侍衛六尚以下詣室奉迎內僕進車閣外馭者執轡后乘輿以出華蓋侍衛警蹕內命婦從出門后升車從官皆乘馬內命婦宫人以次從有清遊隊旗車有重翟腰􅓅厭翟翟車安車四望金根及宫人車儀仗有偏扇團扇方扇香蹬行障坐障雉尾扇大繖錦花蓋朱畫團扇錦曲蓋錦六柱絳麾黃麾牙門東宫鹵簿皇太子出