制無定然又減於鸞駕之制凡親征御樓省方還京迎天書聖像六廟上册則用之淳化三年五月增二百五十人政和三年四月禮局上大朝會儀衛五千二十五人黃麾仗用太常鼓吹部太僕金玉輅殿中省大輦唐黃麾其制十二愊開寶通禮義纂曰黃中央之色此仗最近車輅故以應象大駕六引開封令牧兵部尚書太常卿司徒御史大夫法駕則開封令牧御史大夫為三引始於金吾纛矟清遊隊朱雀旗隊十六騎佽飛前隊殳仗龍旗十二指南等車引駕十二重前部馬隊步甲前隊太常前部鼓吹司天相風行漏等輿持鈒前隊殿中黃麾前部黃麾仗六軍儀仗引駕十六旗龍墀十三旗御馬日月合璧等旗青龍白虎旗隊班劍儀刀隊金吾細仗受命寶殿中繖扇千牛親勳衛翊驍衛等隊夾轂捧日奉宸隊導駕官鳴鞭御馬繖扇腰輿玉輅大輦持鈒後隊金吾大角後部鼓吹黃麾芳亭等輿輦五牛旗輿金象革木輅副五輅耕根車進賢明逺車羊車屬車十二乘黃鉞豹尾後部黃麾仗步甲後部馬隊後隊殳仗真武隊大黃龍負圖旗黃龍大神等二十旗大駕鹵簿凡繡文金吾衛以辟邪左右衛以瑞馬驍衛以雕虎屯衛以赤豹武衛以瑞鷹領軍衛以白澤監門衛以師子千牛衛以犀牛六軍以孔雀樂工以鸞耕根車駕以鳳銜嘉禾進賢車以瑞麟明逺車以對鳳羊車以瑞羊指南車以孔雀記里鼓黃鉞車以對鵝白鷺車以翔鷺鸞旗車以瑞鸞崇德車以辟邪皮軒車以虎屬車以雲鶴豹尾車以立豹相風烏輿士以烏五牛旗以五色牛餘皆以寶相花六引繡衣文清道以雲鶴幰弩以辟邪車輻以白澤駕士司徒以瑞馬牧以隼御史大夫以獬豸兵部尚書以虎太常卿以鳳縣令以雉餘悉以寶相花輿服志陶穀再為南郊禮儀使法物制度多穀所定時范質為大禮使以鹵簿清遊隊有甲騎具裝莫知制度以問穀如其説造以給用又乘輿大輦久亡其制榖立意造之至今用焉傳周必大繡衣鹵簿記藝祖皇帝受天眷命用肇造區夏武功既成文治斯廣躬郊禋正會朝祲威盛容以次畢行惟是承五季搶攘之後鹵簿雖設踳駮為甚易而新之兹惟其時於是制誥范質張昭等正其繆盩參定典式已而禮儀使陶榖奏言金吾諸衛將軍暨押仗導駕等官服皆以紫於禮未稱請按開元禮咸用繡袍至若執仗之士舊服五色畫衣先後靡倫無所準式請以黑為先而青赤黃白以次分列用協五行相生之序逮有司以儀注上帝御便殿陳而閲之凡馬步儀仗總萬有一千二百二十有二人悉以綜絲施繡文代彩畫之服揚輝絢采丕釐舊弊亹亹三代兩漢之盛矣稽諸會要始造於乾德之四年而告備於開寶之三年越明年謁欵圓丘實始用之想夫䂍矟前驅五輅增副里以鼓記車以南指雞翹豹尾夭矯婀娜公卿執事前導後陪細仗大角壯其容幰蓋繖扇備其飾耋老幼稚族觀聚歎向也目熟乎兵革今乃窺文物旗常之美向也耳厭乎金鼓今也聞鍚鸞和鈴之音皇哉治世之巨典華夏之偉觀也切讀三聖寶訓而知藝祖恭儉之德出於天資衣用浣濯器御質素齊官無三服之獻織室罷纂組之工顧於羽衛乃顯設藩飾如此得無意乎蓋恭儉者帝王之盛德也備羽衛者國家之上儀也在漢孝文殿設書囊之帷身以敦朴為先及其詔令則曰鸞旗在前屬車在後儀物明盛猶可想於千載之下然其聖人所以奉己與華國者固自殊轍也耶是以知藝祖之意有在也列聖繼承制作益詳曰大駕曰法駕曰鸞駕曰黃麾仗或施之躬郊或用之封祀或設之朝覲其多寡有差其先後可序揆厥所元皆自繡衣啓之貽謀垂𥙿永永無極肆皇帝陛下紹復祖宗之大業乃紹興十有三年築壇南郊共祀天地鹵簿之制實纂乾德至於歲用癸亥則視建隆初郊之歲若合符節敻觀簡册未之攸聞蓋莫為於前無以彰異時創業之功莫繼於後無以知中興之治是不可以不特書也景德鹵簿記二年十一月乙巳朔是年郊祀鹵簿使王欽若上三卷詔付史館欽若表云掌西京之鹵簿獲奉屬車之塵閲東觀之圖書幸覿羽陵之簡先是九月二日丁未詔欽若閲仗衛中司天監行漏十二神輿殿中省芳亭鳳輦等減製修飾以舊制太重也祥符二年八月甲子詳定所言法駕鹵簿三引內寶鼎令河中尹别造車上題榜天聖新修鹵簿記景祐鹵簿圖記景德二年郊祀王欽若上記三卷頗疏略天聖六年十一月癸卯翰林學士宋綬上天聖鹵簿記十卷付祕閣初綬攝太僕卿侍玉輅上問儀物典故占對辨洽因命撰記序云再飾大駕郊見上帝景祐五年即寶元元年十一月乙巳禮儀使資政殿大學士宋綬上景祐南郊鹵簿圖記十卷詔褒諭蓋因前書而增飾之以親政初元冠篇質正古義傳以新制圖繪注説援據精詳圖記序曰黃帝創軒冕之容列營衛之警輿駕儀物蓋本於此唐堯彤車有虞鸞和夏后之綏商人之路周官有司常巾車之職虎賁旅賁之從三五之際所由來尚矣秦并六國兼屬車九九之數漢上甘泉備千乘萬騎之衆自時厥後損益可知藝祖始議郊饗即諏典文扞衛既崇羽儀兼備初吏士所服皆用畫帛乃命易以厚繒加之文繡采綷相錯煥乎一時至道中詔翰林承旨宋白與內侍畫郊丘仗衛緘在祕府一本云圖飾仗衛置在中祕景德中資政殿學士欽若上鹵簿記三卷敕付太史皇上紹庭正統粵再郊之明年命華光侍臣圖寫大簿臣充儀仗使督攝容衛又以太僕奉車承顧問乃與侍讀馮元侍講孫奭議曰前二圖書寫形紀事不相參會盍象設而又文陳乎繇是著為圖記十篇嵗在戊寅燔祀有期敕重飾帝車爰及法物並加釐正云云戊寅景祐五年十一月戊申享景靈宫己酉享太廟奉慈廟庚戌祀圜丘改元寶元會要志同景祐五年七月十一日丙午詔鹵簿儀物未合典制者釐正之令內侍張永和等領工修飾既成八月庚辰帝親閲於大慶殿門實録八月庚辰御大慶殿門閲新作南郊儀仗車輅九月侍講賈昌朝言儀衛三事一曰南郊鹵簿車駕出宫詣郊廟日執毬杖迎至齋宫唐世以資玩樂宜徹去二曰大駕鹵簿有羊車前列本漢晉乘於後宫遂為法從冝改革三曰鹵簿儀衛五使略行按閲先後失序名物差互請於致齋前詳視詔禮儀使宋綬與太常禮院同詳定以奏綬等言羊車按劉熙釋名隋禮儀志漢代已有自唐至今著禮令宜仍舊其鹵簿儀仗南郊前五使預閲素隊使之齊肅從之又去誕馬鞍韉用纓轡緋紲幡麾以小篆易隸字六引朱團扇用雜花大駕用盤龍重定戟鈒小戟重制雉尾扇犦矟殳義唐末以御史中丞為儀仗使後唐始有鹵簿使兵部侍郎為之國朝故事中丞領儀仗天聖二年用中丞薛奎領鹵簿而翰林學士晏殊領儀仗蓋誤也治平二年詔中丞賈黯易儀仗使翰林學士范鎮鹵簿使皇祐明堂法駕鹵簿圖志會要同皇祐二年三月己亥詔將享明堂乘輿服御務裁簡六月己巳四日鹵簿使奏法駕減大駕三分之一而兵部無字圖故本詔禮官與兵部考正為圖以奏八月辛未上字圖法駕鹵簿用萬一千八十八人初乾德初有司定制唯得唐長興南郊鹵簿字圖校以令文猶多闕焉至是禮官共議制圖九月辛亥宗祀嘉祐二年祫享禮儀使奏南郊仗金吾上將軍左右千牛皆服紫繡戎服珂佩騎而前節度衣袴褶導駕如舊制是月禮官奏南郊還禮乘金輅而或乘大輦宜著令常以大輦從熙寧七年八月十二日太常看詳兵部大駕鹵簿字圖請以副輅列正輅後減羊車五牛旗元豐元年二月詳定所言大駕輿輦仗衛儀物兼取歷代訛舛茍簡不足為法詔令更定於是去二十八宿五星攝提旗所繪人形及龍虎仙童大神金黃鸚鵡網子螣蛇神龜等旗及拂翟三年正月十二日詔以緡錢七萬下成都造大駕鹵簿儀物大駕仗下官一百四十六員執仗押引從軍員職掌諸軍諸司二萬二千二百二十一人法駕三分減一鸞駕減指南等車餘並減半元祐七年十月丙子二十七日太常言鹵簿圖六引王公已下紫繖改用青興國六年五月詔殿中省細仗服碧舊服黃十一月南郊蘇軾為鹵簿使導駕內中紅車爭道亂行軾於車上草奏明日敕有司嚴整仗衛自皇后以下皆不復迎謁中道十三日奏宣和重修鹵簿圖記書目三十五卷初王欽若三卷宋綬十卷宣和别為一書益號詳備三十三卷目録二卷志三駕之制詳見於政和禮局所上迄宣和而大備先是政和七年二月九日兵部尚書蔣猷言陛下稽古制禮大輅之乘元戎之旗六引之名與車導駕之官與服革而新之多矣宜命有司取天聖圖記考正詔改修宣和元年書成凡人物器服盡從古制飾以丹采三十有三卷目録二卷紹興三年十月靜江守臣許中上宣和重修鹵簿記政和三年四月二十九日議禮局上皇太子鹵簿之制又上皇后皇太子妃王公一品二品三品鹵簿之制七年正月二十七日禮制局請墨車駕士衣皂夏縵皂質繡五色團花紹興大駕鹵簿法駕鹵簿十三年郊祀二月九日詔排設大駕鹵簿令禮兵部討論依政和新儀十八日兵部言國初大駕儀仗總一萬一千二百二十二人今已有黃麾半仗三千四百八十三人玉輅腰小輿大輦平逍遙輦下一千九人外其金象革木輅芳亭鳳輦屬車寶輿一千二百七十三人天武捧日奉宸隊六千四百五十七人仗內六引六引止用一象鼓吹前後部一千五百人法物儀仗望下有司製造詔合用文繡並代以纈命兵郎錢時敏戎監劉才邵等參訂兵部長二提舉十月畢工十六年至二十八年郊祀增捧日奉宸隊共一萬五千五十人一本云紹興二十五年十一月癸亥郊祀增鹵簿為萬五千二百二十有二人建靈芝瑞木等旗三十一年明堂五月十三日有司陳法駕鹵簿視郊祀三分減一用一萬一千五人隆興二年二月詔遵太祖典故省約儀仗減半用六千八百八十九人鼓吹警場三分減一省四輅祀回止乘平輦乾道六年九月一日詔郊祀用五輅大安輦如舊儀開元開寶政和禮書親祠乘輅皆以大僕卿為御千牛將軍為右蓋倣周禮大馭諸右等官今乃差執綏官以綵繩維於箱柱又至尊不立乘而設倚以坐不以千牛陪乘而差帶甲內侍二人立御坐之旁皆失禮居則重門擊柝以戒不虞行則清道按節以養威嚴動設先置止則交戟清道而後行清室而後御所以重衛也帝王之居外則飾周衛內則重禁門將行則設兵而後出幄稱警而後踐墀張弧而後登輿清道而後奉引遮列而後轉轂靜室而後息駕所以顯至尊務戒謹垂法戒也帝暉臨幄百司定列鳳蓋俄軫虹旗委斾旄頭先馳屬車齊躅奔星舞於旗斿行月棲於羽箙夀犀注鎧肅給乎師營蒼虬范馭秋遊乎天轡瓊鈒流景金根照塗顔行山則銜枚無聲五精來同七聖景從鑾聲佩節次于帷宫夷道如砥呼蹕填街梢夔獝以護野離荆牟以守燎天兵威威羅列衛營有闟有斿龍軛離衡耳耳其驅雅雅于行旖旎連蜷風舞雲縈士若銜枚驂牡不鳴服章天地車駕風雲日隨月侍嶽走川奔列缺收聲而聽蹕豐隆鼓力以扶輪大丙弭節長庚曳髾五老翼轅八神弭䇿矯翠鳳於黃屋絢交龍於彩旗日下奉圖鮮虞守燎揚六鑾齊八騄堯步舜趨禹馳湯驟矩坤度規乾則月御按節星驅扶輪撫翠鳳之駕六先景之乘奮電鞭驂雷輜羲和司日顔倫奉輿天清日晏天華爽霽赤旗絳庭式道執殳展軨效駕徐鑾警節明鍾暢音七萃連鑣九斿齊軌重英曲瑵之飾絶景追風之騎回輿駐罕嶽鎮淵渟天兵四羅旗常婀娜駕龍十二魚魚雅雅山靈護陳方神蹕御武旅俠馳玉梢金戚千官扈從珮鳴笏澤舉星畢曳雲梢召風伯以清塵命山靈而護野茸騎髦頭虹旃羽斾魚麗鶴列之陳扈帶鮫函之旅敘和植表箕張翼舒屯萬旅以森沈翼千祇而護衛漸鴻之士陟恪以奉輿戴鶡之夫凝嚴而戒道碧輦驂龍瓊干跂鳳駕鏤象蔭華芝謁欵靈場陟降紫幄應龍受轡招搖翼輈曳星之髾歷天之旗雷軸電鞭翠華葳㽔拭翠鳳之駕開日月之旗撞鴻鐘發雷輜辨格澤之修竿決河漢之淋漓赤松前驅彭祖後馳方明夾轂昌宇侍衣山靈秉鉞而踉蹡海若護蹕而參差風馭冉以縱􅑨雲螭縒而遲蚭五牛翻其析羽六龍輝其鏤錫望舒先驅飛亷奔屬千乘萬騎魚魚雅雅禮神頌祇福祿來下武騎仡以清道被練煥以波燭浮埃沈而瑞氣翔前清塵兮天罼密扶路兮雲輜六駿駮兮沛艾萬虎賁兮髬髵垣直太紫庭儼雲龍扇交翟兮葳㽔旗升龍兮蠖略天子御玉輅動金根八驥揚衡雙龍翼蓋雲罕徐回鳴鐃韻響風承豹尾日映鶡冠萬騎天行千乘雷動石鎧犀衣之士聨七萃而雲屯珠旗月羽之兵亘五營而星列撫元虯載翠鳳鼉鼓按節鯨鐘疏響千乘嶽動萬騎林回星陳而天行雷震而霧合屏翳清曉飛亷警旦孫叔奉轡王良聳䇿國容象物而動朝章視令而肅備萬乘整法駕延喬松於東序詔韓岐於西廂麾天閬使啓關儒僚展采禮官相儀垂㽔動音洪鍾竦節陽路整衛正途清禁於是綪環佩端玉藻鳴鳳佇律騰駕流文間綵比象之容昭明紀數之服徽焯天陳容藻神行翠蓋懷陰羽華列照金支宿垂鏞石潤響命五神以相列闢九關以集靈警衛兵而開靈先雨祇以灑路上摩星以旓雲下藻野而縟川命期門使按蹕六龍驤首以啓路八駿騰光而夾輈灼楚焞練剛日百官戒嚴乘輿乃出奮六經以攄容奔八神而警蹕拖虹霓之宛延植星槍而蒙密玉軔浮霞霜戈燁日然後招翠龍驂絳螭疏飛雲之法輅揭太一之靈旗升黃屋翳華芝山立玉色出乎南端之闈紫雲華蓋上玉斗帝車前雕雲麗璇蓋祥飈被綵斿儀仗周禮法物宋禮志按周禮辨載法物莫不詳究然無相風罼網旄頭之屬此非古制明矣周官大僕王出入自左馭前驅注如今道引隸僕掌蹕宫中之事注謂止行者清道若今警蹕宋志警誓戒也蹕止行也小司冦大賔客前王而辟注若今執金吾下至令尉奉引漢宫室出入儀太平御覽漢名臣奏曰丞相薛宣奏漢興以來深考古義惟萬變之備於是制宫室出入之儀正輕重之冠故司馬殿省門闥至五六重周衛擊刁斗近臣侍側尚不得著鈎帶入房宋志天子坐漆牀居朱屋按何休注公羊有朱屋以居漆牀亦當是漢代舊儀而漢儀不載殿屋為員淵方并兼植荷華梁三駕二仗隋志梁乘輿行則有大駕法駕小駕行幸則槊仗近燕則隊仗三駕法天二仗法地其動參天而兩地也大同五年正月丁巳賀琛奏南北二郊籍田御輦不復乘路以侍中陪乘停大將軍及太僕隋三仗志齊河清中定令宫衛之制後周警衛之制置左右宫伯掌侍衛之禁更直於內小宫伯二之左右武伯掌內外衛之禁令兼六率之士皇帝臨軒則備三仗於庭髙祖因齊宫衛微有變革左右武衛開府各領三仗六行在大仗內行别六十人大駕則執黃麾仗古今注麾所以指麾乘輿以黃諸公以朱刺史二千石以纁唐儀衛制儀衛志舊史不志儀衛唐制天子居曰衙行曰駕皆有衛有嚴衙朝會五仗內仗千牛仗挾門隊長搶隊黃麾仗五旗仗殳仗步甲隊辟邪旗隊清遊隊朱雀隊玄武隊駕大駕鹵簿法駕小駕羽葆華蓋旌旗罕畢車馬之衆盛矣皆安徐而不譁其人君舉動必以扇出入則撞鐘庭設樂宫道路有鹵簿鼓吹禮官百司必備物而後動所以為慎重也儀衛所以尊君而肅臣官志殿中侍御史九人掌殿庭供奉之儀正班列於閣門之外唐朝會五仗衙內五衛黃麾仗五旗仗諸衛儀仗儀衛志凡朝會之仗三衛畨上分為五仗號衙內五衛一曰供奉仗以左右衛為之二曰親仗以親衛為之三曰勳仗以勳衛為之四曰翊仗以翊衛為之皆服鶡冠緋衫夾五曰散手仗以親勳翊衛為之服緋絁裲襠繡野馬皆帶刀捉仗列坐東西廊下每月以四十六人立內廊閣外號曰內仗以左右金吾將軍當上中郎將一人押之有押官知隊仗官朝堂置左右引駕三衛六十人分五畨引駕佽飛六十六人分六畨元日冬至大朝會宴見蕃國王則供奉仗散手仗立於殿上黃麾仗樂縣五路五副路屬車輿輦繖二翰一陳于庭扇一百五十有六三衛三百人執之陳于兩廂黃麾仗左右廂各十二部十二行一長戟六色氅二儀鍠五色幡三大矟小孔雀氅四小戟刀楯五短戟五色鸚鵡毛氅六細射弓箭七小矟鸚鵡毛氅八金花朱縢絡楯刀九戎雞毛氅十細射弓箭十一大鋋白毦十二金花緑縢絡楯刀皆有五色雲花襖冒每行一色及行縢鞋襪黃麾仗首尾廂各絳引幡二十引前十掩後十廂各獨揭鼓十二重重二人首二部師子袍次一部豹文袍次當御廂後廂後左右廂每黃麾仗一部鼓一諸衛大將軍各一人檢校被繡袍次左右衛黃旗仗立于兩階之次左右驍衛赤旗仗坐于東西廊下左右武衛白旗仗居驍騎之次左右威衛黑旗仗立于階下左右領軍衛青旗仗居威衛之次鍪甲弓箭刀楯矟􅗋各隨其五旗之色又有夾轂隊廂各六隊隊三十人親勳翊衛仗廂各三隊隊四十人武衛內有持鈒隊執銀裝長刀絳引幡一金節十二分左右罕畢朱雀幢青龍白虎幢隊各一百四十四人分左右二行又有殳仗步甲隊殳仗左右廂千人廂别二百五十人執殳二百五十人執義步甲隊從左右廂各四十八前後皆二十四次左右金吾衛辟邪旗隊又有清遊隊朱雀隊玄武隊清遊建白澤旗朱雀玄武各建其旗諸衛挾門隊長搶隊與諸隊相間明日殿上設黼扆躡席熏爐香案百官唱門籍入畢序班于通乾觀象門南次入宣政門宰臣兩省官對班于香案前百官班于殿庭扇合皇帝升御坐內謁者承旨喚仗左右羽林軍勘以木契自東西閣而入朝罷皇帝步入東序門然後放仗內外仗隊七刻乃下宴蕃客日隊下復立半仗于兩廊朔望受朝及蕃客辭見加纛矟隊儀仗減半凡千牛仗立則全仗立禮志皇帝