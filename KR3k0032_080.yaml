徑騎頗與乘輿相逺而士庶觀者率隨扈從之人夾道馳走喧呼不禁非所謂旄頭先驅清道後行之謹且自黃帝以師兵為營衛漢魏有大駕小駕之儀至唐又分殿中諸衛黃麾等仗國朝承五姓荒殘之弊事從簡略儀衛寡薄頗同藩鎮欲望専委一二博學近臣檢討前代儀注及鹵簿令以乘輿常時出入之儀比之三駕諸仗斟酌儀物增嚴條禁上以示尊極下以防未然詔太常禮院與兩制詳定遂合奏諸班直禁兵步騎以為禁防仍舊數復增清道馬百騎而執罕畢者一騎執牙門旗前後各四騎而執緋繡鳳氅二十四雉扇十有二皆分左右並騎增一百六十二人天武兵執柯舒為一重親從官三百人為一重殿前指揮使二百人為一重左右相對開二門以擬周禮之人門臣寮起居並令中道候起居於左右門出其諸色人止令牙門旗前道傍起居不得便入禁衛中志乘輿常出入儀合奏班直禁兵步騎為禁衛增清道馬百佩弓矢為五重騎而執罕畢者一執牙門旗前後四執緋繡鳳氅二十四雉扇十二皆分左右天武兵徒行者執柯舒親從兵增為三百殿前指揮使增為二百並騎左右開二門門間容二丈以擬周禮人門凡前牙門旗後牙門旗前為禁衛禁乘髙下瞰垂簾外蔽夾道喧呼馳走者頗著于令會要云或言新制嚴密因不果行著于令其後浸弛云嘉祐六年中丞韓絳奏請嚴儀衛先是幸睦親宅內侍墮馬駕頭壞事下閣門禮院議七月十二日壬辰請以閣門祇候內侍各二員挾駕頭左右次扇筤又以皇城親從兵二十人從其後駕頭乃初即位御坐三朝志七寶牀一覆以緋羅繡帕內臣馬上捧之謂之駕頭元豐更造仗衛元豐六年正月丁丑朔御大慶殿受朝先是上以朝會儀物敝當改為詔閣門御史臺詳定朝會儀更造仗衛輿輅冠服至是始陳于殿政和三年四月議禮局上大慶殿大朝會儀衛黃麾大仗五千二十五人文德殿受朝半仗發册細仗建炎二年十一月初郊用細仗二千人取東京儀仗法物用之八月二十八日取東京祭器大樂朝祭服儀仗法物赴揚州十一月壬寅冬至用細仗二千人詣圜壇行禮建炎元年十一月丁亥朔以揚州路滑始聽百官乘轎紹興二十七年四月巳朱玉牒所進呈仙源類譜用黃麾細仗前導慶厯五年八月乙亥太常禮院言升祔二后請如慶厯四年改上諸后尊諡用兵部黃麾仗一千二百五十人又設大慶殿細仗三百九十人太常鼓吹儀仗四百九十四人殿中省細仗十二人及設太尉本品儀仗四百八十三人從之紹興儀仗車輅制度黃麾仗圖十二年七月己酉十八日命有司製太常行儀仗自南巡儀物草創時皇太后且至上將躬迎于郊乃命工部尚書莫將户部尚書張澄同內侍邵諤製造將等言文德殿視朝大慶殿册命用黃麾仗二千三百六十五人陳腰輿小輿於東西朵殿今降到圖册又有紫宸殿黃麾角仗排設儀仗法物等用一千一百十五人又孫授所進圖册用二千二百四十五人并御輦院左右金吾仗等三百一十八人詔太常寺詳定製造儀仗車輅等制度請先造玉輅及黃麾仗二千二百六十五人從之八月辛巳上奉迎皇太后于臨平鎮用黃麾半仗二千四百八十三人壬午太后還慈寧宫九月戊申新玉輅成上觀于射殿十三年閏四月甲辰册皇后設黃麾半仗千四百九十九人十五年正月丁未朔初行大朝會禮于大慶殿用黃麾仗三千三百五十人視東都舊儀損三之一輦出房不鳴鞭以殿狹也自建炎以來正至不受朝至是始講乾道元年十月十八日皇太子受册畢稱謝紫宸殿望參官赴起居依儀制設仗兵部言紹興十三年六月六日紫宸殿望參設黃麾角仗一千五十六人從之淳熙元年正旦稱賀依紹興十三年文德殿視朝之制用黃麾半仗二千四百十五人殿門外設大旗三十四十一月九日詔冬至朝賀用黃麾角仗一千五十六人寶慶三年郊祀鹵簿儀仗用六千四百九十六人淳祐十一年明堂用四千一百四十八人黃麾半仗二千四百十五人正旦朝賀上尊號册寶親享用之半仗一千四百九十九人皇太子皇后受册寶用之角仗一千五十六人冬至朝賀紫宸殿望參金國使賀正旦生辰進受玉寶皇帝御正殿皇太子稱謝起居用之細仗五百人迎奉册寶玉牒用之細仗二百人奉安進書用之細仗一百人獨進玉牒經武要略用之大駕鼓吹八百八十四人法駕鼓吹五百八十八人耕藉鹵簿政和新儀用六百八十八人紹興十六年止用其半紹興車駕行幸圖紹興三十一年四月二十三日洪邁言天子之出清道警蹕旄頭前驅豹尾後殿其往來馳道與闌出入者皆有厲禁自六飛時巡務為簡便四孟朝獻前為駕頭後止曲蓋爪牙拱扈之士步趨離立無復行列觀者接袂不聞誰何願詔有司凡車駕行幸從駕禁旅以若干人為一列相去各若干步其乘馬前導者豫上其數有司繪為圖先一日以聞有不如令及不在圖而冒至者糾之令御史覺察詔可散句見鹵簿行幸易曰風行地上觀先王以省方觀民設教詩時邁序曰巡守告祭柴望般詩曰巡守以祀四嶽河海古之王者以嵗時巡狩方嶽其次則二伯述職不然則行人循省撢人誦志漢書文紀上幸甘泉注引蔡雍云天子車駕所至民臣以為僥幸故曰幸見令長三老官屬親臨軒作樂賜以酒食帛葛越巾佩帶之屬民爵有級數或賜田租之半故因謂之幸也漢永平省方東都賦至于永平云云乃動大輅遵皇衢省方巡狩窮覽萬國之有無考聲教之所被散皇明以燭幽紀永平二年十月甲子西巡幸長安祠髙廟遂有事十一陵歷覽館邑會郡縣吏勞賜作樂進幸河東所至賜二千石以下十年閏月甲午南巡幸南陽祠章陵舊宅召校官弟子作雅樂還幸南頓勞饗三老官屬十三年四月辛巳幸滎陽巡行河渠渡河登太行進幸上黨十五年二月庚子東巡幸偃師進幸彭城耕下邳幸魯又幸孔子宅祠仲尼七十二弟子親御講堂命太子諸王説經又幸東平大梁漢四巡頌崔駰傳元和中肅宗巡狩方嶽駰上南北東西四巡頌頌曰建初七年初四巡十月癸丑幸咸亰日當丙辰謁髙廟遂有事于十一陵岐鼎既得獲白鹿元和首嵗復南巡中秋丁酉季辛丑親屈鸞車幸章陵舊宅園陵設祠祭遍見宗室與故人江陵進幸祠南嶽還幸宛兮歸洛闉次年車駕修柴告時用二月日丙辰耕于定陶祀堯帝明堂祀畢會羣神耕懷祠嶽在三祀丙申之辰當孟春章和八月後癸酉祠沛原廟還汝陰南巡至此凡再舉太學作頌惟崔駰班固有東巡南巡頌見御覽孝安延光三年東巡馬融作頌見御覽唐幸孔子宅紀乾封元年正月辛卯幸曲阜祠孔子贈太師開元十三年十一月丙申幸孔子宅遣使以太牢祭其墓太祖創業之始甫及二年三十三日兩幸儒學五十二日三幸飛龍院一歲之內四幸造船務其後主勢日尊儀衛日盛六飛順動輒為曠典天䇿夜而動星鉤陳朝而按軌嵗習其祥祥習則符雲披日霽緹帷宿置帟幕宵垂既而滅宿澄霞登光辨色式道執殳展軨效駕七萃連鑣九斿齊軌重英曲瑵之飾絶景追風之騎虎視龍超雷駭電逝乃回輿駐罕嶽鎮淵渟虞風載帝狩夏諺頌王遊天行肅輦路日馭翼華輈辰旗星罕雕輦翠旃珠旗玉軑鸞旗雲動寶軑天行山祇蹕路水若警流天行於健雷奮而豫搜漢儀以按厯法夏遊而布度吾道如砥吾轡如絲固可使大路所歷黎元不知詔翠華而徐動按清道而來歸帝暉順動貔貅六師雷霆萬乘初海沸而雲湧忽山峙而川靜天子粹然玉溫健然天運雲流日行海運天聲弛威弧戢天戈垂鴻襲裕樂華禮葉文物葳㽔聲明蔥蒨天旋雲遊掣翠旄於華蓋之角彗黃屋於鈎陳之星玉海卷八十
