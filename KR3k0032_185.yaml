body:
  text: 玉海卷一百八十五宋王應麟撰食貨會計禹會計史記禹會諸侯江南計功命曰會稽會計也張衡傳注吳越春秋曰禹登茅山大會計理國之道更名其山曰會稽周司會歲會月要日成土會法禮天官司會中大夫二人下大夫四人上士八人中士十六人注計官之長若今尚書掌典法則書契版圖之二聽其會計以參互考日成謂司書之要二與職內之入職歲之出以月要考月成以歲會考歲成司書上士二人中士四人凡上之用財用必考于司會三歲大計羣吏之治事成則入要二職歲掌賦出以待會計而考之以式法贊逆會注助司會鈎考羣吏之計職幣以式法贊會事太宰嵗終令百官各正其治受其會小宰六敘五曰以敘受其會八成八曰聽出入以要會月終受羣吏之要主每月之小計贊冢宰受嵗會嵗終令羣吏致事齎嵗盡文書若今上計宰夫八職一曰正掌官法以治要若嵗計也二曰師掌官成以治凡若月計也三曰司掌官法以治日若今日計也歲終令羣吏正歲會月終正月要旬終正日成宫正月終會稍食歲終會行事膳夫外府司裘庖人掌皮典絲典枲歲終則會大府歲終會貨賄入出酒正日入其成月入其要小宰聽之歲終則會內宰歲終則會稍食會內宫之財用天官言歲終則會者凡十一唯王及后世子之膳禽王及后之飲酒服王之裘與皮事不會宰王制司會以歲之成質于天子冢齊戒受質大司徒以土會之法辨五地物生以土計貢稅之法小司徒歲終考屬官之治成而誅賞治事之計令羣吏正要會而致事鄉大夫歲終令六鄉之吏會政致事州長黨正族師遂大夫鄙師歲終會政縣正既役則稽功會事而誅賞泉府歲終會其出入而納其餘舍人歲終會計其政巾車歲終則會車之出入占人歲終則計其占之中否大司馬受其要大司冦盟書司會受其二藏之小司冦命其屬入會司民民數司會二之士師歲終則令正要會司馬於要則受之士師於要則任之管子曰歲一言者君也時省者相也月稽者官也易氏曰冢宰天官之長也歲終受歲會而無月要之文小宰天官之二也月終受月要而無日成之文宰夫天官之考也旬終正日成而無參互之文三官各舉其一而司會乃考其全會之欲其詳也歲會以統月要月要以統日成日有成日考之也宰夫受之月有要月考之也宰夫令之而小宰受之歲有會歲考之也小宰贊之而大宰受之考績設官其序如此尊者總其綱卑者舉其目周九式式法太府式法禮太宰以九式均節財用祭祀賔客喪荒羞服工事幣帛芻秣匪頒好用注式謂用財之節度小宰執九式之二以均財節邦用司會以九式之法均節財用司書掌九職九正九事以周知入出百物敘其財受其幣注九事謂九式鉤考財幣所給及其餘見為之簿書疏九式言用財九事所為之事其理一也宰夫以式法掌祭祀之戒具薦羞酒正以式法授酒材以酒式誅賞大府凡頒財以式法授之注此九賦之財給九式者凡式貢之餘財以共玩好之用注謂先給九式及弔用足府庫而有餘財乃可以共玩好職幣以式法斂幣職歲以式法出財掌皮以式法頒皮革委人以式法共祭祀之薪蒸木材注故事之多少也廪人掌九榖之數以待國之匪頒賙賜稍食注賙賜謂王所賜豫給好用之式舍人以法掌其出入歲終會計其政典婦功常婦式之法注法其用財舊數周計簿禮大司徒歲終則令教官正治而致事注上其計簿士師歲終則令正要會注定計簿小司徒大比則受邦國之比要注要謂其簿天府治中注謂其簿書之要天官司書受其幣職內執其總皆簿書也小宰八成聽師田以簡稽聽出入以要會注稽猶計也計其士之卒伍閲其兵器為之要簿要會謂計最之簿書月計曰要歲計曰會疏云計吏其使人計簿其文書也魯語收攟而蒸納要也注因祭社以納五榖之要周役要地官鄉師以國比之法時稽其夫家之衆寡辨其可任與施舍者大役則帥民徒而至治其政令既役則受州里之役要以考司空之辟以逆其役事注役要所遣民徒之數辟功則章程小司徒凡起徒役毋過家一人以其餘為羡唯田與追胥竭作大宰八則八曰田役以馭其衆小宰六聨五曰田役之聨事八成一曰聽政役以比居注鄭司農云比居謂伍籍比地為伍因內政寄軍令以伍籍發軍起數職方氏辨數要司徒正要會司書及事成則入要二大司馬大役與慮事築城邑也屬其植受其要司農云要者簿書也士師歲終令正要會左傳昭三十二年士彌牟營成周屬役賦文書以授帥周比法比要大比九比禮小宰八成一曰聽政役以比居注伍籍也宫正比宫中之官府次舍小司徒稽國中四郊都鄙之夫家九比之數職謂九比者冢宰出九賦之人數乃頒比法於六鄉之大夫使各登其衆寡六畜車輦辨其物以歲時入其數三年則大比大比則受邦國之比要注大比謂簡閲民數及財物也鄭司農云五家為比故以比為名今時八月案比是也要謂其簿乃會萬民卒伍而用之鄉師以國比之法時稽夫家衆寡受州里之役要正歲稽其鄉器若國大比則考教察辭稽器展事以詔誅賞鄉大夫三年則大比考德行道藝興賢能州長三年大比大考州里贊鄉大夫廢興黨正以歲時涖校比注如今小案比疏比舉漢法小案比對三年大比為小族師以邦比之法帥四閭之吏以時屬民校登夫家衆寡閭胥既比則讀法縣師大比則考羣吏均人大比則均力政遂大夫大比則帥吏興氓縣正掌比以頒田里鄼長比衆寡以治祭祀之事里宰比其邑以治稼穡秋官司民大比以民數詔司冦司冦及孟冬獻于王小司冦大比登民數自生齒以上登天府王制冢宰制國用必於歲之杪注制國用如今度支經用以三十年之通制國用量入以為出後漢紀安帝元初四年詔方今案比之時注八月案比案户口次比之禮儀志仲秋之月縣道皆案户比民江革傳每至歲時縣當案比注案驗以比之猶今貌閲後漢書論漢法常因八月算民急就篇潁川臨淮集課録注諸郡各上其計總會京師次其名録漢甘泉明堂受計計相計簿帝紀武帝元光五年八月詔吏民有明世務習聖術者令與計偕師古注計者上計簿使也郡國每歲遣詣京師上之元封五年三月至泰山甲子祠髙祖明堂因朝諸侯王列侯受郡國計太初元年祠后土春還受計于甘泉注受郡國所上計簿若今之諸州計帳天漢三年三月幸泰山祀明堂因受計太始四年三月幸泰山壬午祀明堂因受計武帝一受計于帝都三受計于方嶽宣帝黃龍元年二月詔曰方今天下少事而民多貧盜賊不止其咎安在上計簿具文而已御史察計簿疑非實者按之列傳張蒼髙祖六年為計相後更以列侯主計蒼自秦時為柱下御史明習天下圖書計籍令以列侯居相府領主郡國上計者石慶元封四年上報曰間者河水滔陸惟吏多私征求無已故為流民法以禁重賦今流民愈多計文不改司馬談為太史公注如淳曰漢儀注天下計書先上太史公副上丞相云嚴助為會稽太守上書願奉三年計最注如淳曰舊法當使丞奉歲計今助自欲入奉之晉灼曰最凡要也朱買臣隨上計吏詣闕上書注郡國丞長吏與計吏俱送計也貢禹言武帝時郡國擇便巧史書習於計簿能欺上府者以為若職匡衡封僮之安樂鄉屬臨淮郡建始元年郡乃定國界上計簿更定圖言丞相府集曹掾陸賜以為舉計令郡實之師古注舉發上計之簿司隸校尉駿奏衡位三公輔國政領計簿知郡實正國界計簿已定而背法制專地以自益賜猥舉郡計亂減縣界附益大臣文翁為蜀守選小吏遣受業博士省少府用度買刀布蜀物齎計吏以遺博士循吏王成為膠東相卒官後詔使丞相御史同郡國上計長吏守丞以政令得失或對言前膠東相成偽自增加以蒙顯賞黃霸為丞相張敞奏霸曰丞相請與中二千石博士雜問郡國上計長吏守丞為民興利除害成大化條其對有耕者讓畔男女異路道不拾遺及舉孝子正婦者臣恐各為私教澆淳散朴有名亡實宜令貴臣明飭長吏守丞天子使侍中臨飭上計吏如敞指意後光武紀建武十四年夏四月越巂人任貴自稱太守遣使奉計注若今計帳上傳云長貴遣使三年計張堪傳光武召見諸郡計吏問風土及前後守令能否蜀郡計掾樊顯進曰張堪昔在蜀仁以惠下云云拜顯魚復長周禮疏漢時八月案比而造籍書周以三年大比未知定用何月漢上計律周禮典路鄭注云漢朝上計律陳屬車於庭疏云漢朝集使上計會之法小宰歲終令羣吏致事注云若今上計也衛宏漢舊儀朝會上計律常以正月旦受羣臣朝賀天下郡國奉計最貢獻歲終遣吏上計正月旦天子幸德陽殿臨軒受賀而計吏皆在列表元狩二年上谷太守郝賢坐計謾免師古曰計簿欺謾説苑晏子治東阿三年明上計新序魏文侯東陽上計錢布十倍左傳臧會為賈正計於季氏注逸計簿齊五官之計秦昭王拜王稽河東守三歲不上計漢郡守上計蓋秦制也漢郡國上計又見前後百官志大鴻臚郡國上計屬焉刺史初歲盡詣京都奏事中興但因計吏郡國常以春行縣勸民農桑振救乏絶秋冬遣無害吏案訊諸囚平其罪法論課殿最歲盡遣吏上計注盧植禮注曰計斷九月因秦以十月為正故令長秋冬集課上計於所屬郡國胡廣曰秋冬歲盡各計縣戶口墾田錢穀入出盜賊多少上其集簿丞尉以下歲詣郡課校最殿百官志注又載漢舊儀曰元夀二年以丞相為大司徒郡國守長吏上計事竟遣公出庭上親問百姓所疾苦記室掾史一人大音讀敕曰云云和紀永元十四年初復郡國上計補郎官注舊制使郡丞奉歲計列傳陸康守廬江遣計吏奉貢度尚為郡上計吏拜郎中龎參以被奏稱疾不得會上計掾廣漢段恭因會上疏楊秉桓帝時郡國計吏多留拜為郎秉上言計吏無復留拜者皇甫規舉上計掾公孫瓉舉上計吏趙一光和元年舉郡上計到京師時司徒袁逢受計計吏數百人皆拜伏庭中莫敢仰視一獨長揖逢延置上坐因問西方事劉翊舉上計掾建安中劉劭為計吏詣許巴郡板楯叛問益州計吏考以征討方略漢中上計程包對云云南蠻建武十四年卭榖王長貴光武紀作任貴遣使上三年計授越巂太守西南夷三輔決録注竇叔髙以明經為郡上計吏朝會數百人云周禮注若今計文書斷於九月小行人注今時詔書或曰齎計吏掌皮注謂疏云漢時考使之計吏疏漢之朝集使謂之上計吏上一年計會文書及功狀小宰疏晉武帝泰始五年正月癸巳申戒郡國計吏守相令長務盡地利禁遊食商販王渾傳帝訪王渾元會問郡國計吏方俗之宜渾曰舊三朝元會計吏詣軒下侍中讀詔計吏跪受之察其答對以觀計吏人才之實左傳戎朝于周發幣于公卿注如今計獻詣公府卿寺疏曰晉時諸州年終遣會計之吏獻物於天子北史蘇綽傳牧守令長非通六條及計帳者不得居官漢郡國錢榖簿後志大司農郡國四時上月旦見錢榖簿陳平傳文帝朝而問右丞相勃天下錢榖一歲出入幾何勃謝不知左丞相平曰問錢榖責治粟內史黃霸傳領郡錢榖計簿書正以廉稱周禮注祿田亦有給公家之賦貢若今時侯國有司農少府錢榖司勳注公侯伯子男必足其國禮俗祭祀之用乃貢其餘若今度支經用餘為司農榖矣大司徒注桓談新論漢百姓賦斂一嵗為四十餘萬萬吏俸用其半餘二十萬萬藏於都內為禁錢少府所領園地作務八十三萬萬以給宫室供養諸賞賜唐計帳開元戶部帳三司六典一歲一造計帳三年一造户籍縣成于州州成于省户部總而領焉武德六年三月令每歲一進帳三年一造籍後魏蘇綽制計帳户籍之法計顔師古漢書注計若今之諸州帳地理志開元二十八年户部帳凡郡府三百二十八縣