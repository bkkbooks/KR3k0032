増五十五萬三千四百一十户二百萬二千二百一十四口賦入之數總六千三百七十三萬一千二百二十九貫石匹斤比咸平六年計増三百四十六萬五千二百九切以版圖之設生齒必登所以一其租庸辨其衆寡前朝丁黄之數悉載縑緗國家幅員萬里阜成兆民惟國用之缺書由有司之曠職臣今以景徳三年民賦户口之籍較咸平六年具上史館望歳較其數以聞從之三年十二月三司使丁謂始立比較轉運之法八月丁巳丁謂上景徳㑹計録詔奬之以其書付祕閣凡六卷一户賦二郡縣三課入四歳用五禄食六雜記衆務之劇莫先㑹府歳收兩京十七路圖籍四萬四千百一十七日入事一千五百移文倍之十二月詔諸道軍儲之數籍于宻院較初咸平五年四月壬午詔三司置籍天下户口之數中興書目共六門總四十目集户賦郡縣課入歳用禄食出納之數以一歳為凖張方平曰慶厯五年諸路鹽酒商稅歳課比景徳㑹計録増三數倍以上祥符閱元和國計圖祥符三年八月甲寅召近臣觀書于龍圖閣閱元和國計圖三司使丁謂進曰唐朝自江淮歳運米四十萬至長安今江淮歳運米五百餘萬即今府庫充實倉庾盈衍上曰民康俗阜誠頼天地宗廟降祥而國儲有備亦自計臣宣力也崇文目地里有元和國計圖一卷盛度為鹽鐵判官奉詔編祖宗朝沿革制置勅三卷天下户口賦稅目别為一卷祥符㑹計録祥符九年正月辛酉林特上凡三十卷詔奬之仍付袐閣特前為三司使特拜三司使真宗賜詩寵之奉詔纂大中祥符八年天下户口財賦凡户八百四十二萬二千四百三口一千八百八十萬一千九百三十計入兩稅錢帛糧斛二千二百七十六萬四千一百三十二綿絲鞋草二千二百八十三萬六千六百三十六茶鹽酒稅榷利錢帛金銀二千八百萬二千癸亥發内藏錢五十萬給三司特又為東封西祀朝謁太清宫慶賜總例二十六卷慶厯㑹計録書目二卷慶厯三年三司具在京出納及十九路錢帛芻糧之數景徳中鹽課收三百五十五萬緡慶厯五年七百十五萬緡景徳中商稅收四百五十萬緡慶厯五年收一千九百七十五萬景徳中酒課收四百二十八萬緡慶厯五年收一千七百一十萬慶厯元年八月戊子詔御藥院内東門司取先帝時及天聖初帳籍比較近年内中用度増損之數以聞六年七月甲申三司使王拱辰言太祖時兵十二萬太宗時十八萬章聖時四十萬今遂倍之三司雖總大計而事寔在外乙酉乃詔大名并州永興帥臣兼本路計置糧草事皇祐㑹計録書目田況撰六卷每卷别為題辭皇祐二年田況為三司使約景徳㑹計録以今財賦所入多於景徳其歳所出又多於所入因撰皇祐㑹計録畧依丁謂所述集成六卷一户賦二課入三經費四儲運五禄賜六雜記其出入之數取一年㝡中者為凖如謂所録郡縣疆理復以宫館祠宇附焉此皆不取至於糧芻運餽國之大計特為儲運一篇補其缺上嘉之況為三司使金榖利害纎悉脩舉議者謂三司使自陳恕李士衡之後惟況稱軄崔伯易曰以皇祐之書較景徳之録雖増田三十四萬餘頃反減賦七十一萬餘斛皇祐二年正月壬子命學士承㫖王堯臣都知王守忠右司諌陳升之與三司較天下每嵗財賦出入之數以聞四年正月堯臣等較慶厯皇祐總四年天下財賦出入凡金幣絲纊薪芻之類皆在其數相參耗登皇祐元年入一億二千六百二十五萬一千九百六十四而所出無餘為書七卷丙辰上之詔送三司取一歳中數以為定式二月癸未命中丞王舉正與三司同詳定冗費至和元年八月丙申知諌院范鎮言願詔大臣考求祖宗朝逮天聖中官吏與兵及天下賦入之數而斟酌裁節之嘉祐三年十一月癸酉命學士韓絳等詳定減省冗費十二月乙巳詔三司每歳上天下歳賦之數自今三歳㑹其盈虧以聞六年諌官司馬光言民既困而倉廪府庫又虚為今之術在隨材用人而久任之在養其本原而徐取之在減損浮冗而省用之願復置總計使之官使宰相領之凡天下金帛錢榖隷於三司如内藏奉宸庫之類總計使皆綂之昔舜舉八愷使主后土奏庶艱食懋遷有無地平天成九功惟叙周禮冢宰以九職九賦九式九貢之法治財用唐制以宰相領鹽鐵度支户部國初亦以宰相都提舉三司水陸發運等使則錢榖皆宰相之職也李徳𥙿曰人君不以聚貨制用之臣處將相弼諧之任則姦邪無所容在俞獻卿言巵不盈者漏下木不茂者蠧在内治平㑹計録治平四年九月五日庚辰神宗已立三司使韓綘上治平㑹計録六卷詔奬諭内外歳入一億一千餘萬出一億二千餘萬諸路積一億萬而京師不與時兵數少損隷籍者猶百十六萬而宗室吏員視皇祐亡慮増十之三志蔡襄治平㑹計録六卷治平經費節要書目八卷治平中編具經常出入之數分三帙上帙户口賦稅中帙應奉上供下帙諸色經費寳元二年宋祁言去三冗節三費専備西北之屯熈寧㑹計式見後熈寧三司㑹計司熈寧七年十月庚辰詔三司置㑹計司以宰臣韓絳提舉先是絳奏三司總天下財賦其出入之數並無總要考校盈虚之法欲選官置司以户口稅賦場務坑冶河渡房園之類租額年課及一路錢榖出入之數歳校増虧以能否為黜陟三司使章惇亦言財賦帳籍汗漫無以察耗登之數請刪修為䇿校増虧考能否故有是命八年九月庚午罷㑹計司從絳請也元豐議經費元豐三年十一月二十一日壬子曽鞏議經費曰景徳户七百三十萬墾田一百七十萬頃皇祐户一千九十萬墾田二百二十五萬頃治平户一千二百七十萬墾田四百三十萬頃天下歳入皇祐治平皆一億萬以上歳費亦一億萬以上景徳官一萬餘員皇祐二萬餘員治平并幙職州縣官三千三百餘員總二萬四千員景徳郊費六百萬皇祐一千二百萬治平一千三百萬以二者校之官之衆一倍於景徳郊之費亦一倍於景徳七年十二月十六日詔朝廷封樁錢物令尚書省歳終具旁通冊進入元祐㑹計録元祐元年四月十八日左正言朱光庭請置局取户部天下一歳出入與三年郊費四夷歳賜凡百經費㑹計可省者省之量入為出著為令式詔户部相度二年七月户部言三司即令户部之職自景徳皇祐治平熈寧並修㑹計録事目類分出納具見宜復講修以備觀覽詔可三年閏十二月庚戌户部尚書韓忠彦侍郎蘇轍韓宗道等言編成元祐㑹計録大抵一歳天下所收錢榖金帛等物未足以支一歳之出欲取費用詳加裁節多不傷財少不害事詔浮費並行裁省忠彦等請仰法寳元慶厯節用𥙿民自宫禁始前後裁減浮費約及二十餘萬貫李常傳有元祐㑹計録三十卷蘇轍元祐㑹計録叙曰景徳皇祐治平熈寜四書網羅一時出内之計首尾八十餘年凡計㑹之實取元豐之八年其别有五一曰收支二曰民賦三曰課入四曰儲運五曰經費五者既具著之以見在列之以通表若内藏右曹之積天下封樁之實非昔三司所領不入㑹計將著之它書蘇轍熈寧二年三月奏請去三冗宣和兩浙㑹計總録七年八月十七日兩浙運副程昌弼奏漕司以計度經費為軄臣分别科目使多寡出入盈虚登耗之數可指諸掌請詔臣編纂宣和兩浙㑹計總録頒之郡縣從之靖國元年右司員外郎陳瓘進國用須知言廣恩恵以收人心有益之事也因邊費而壊成法無益之舉也已往之費不可追究未然之費所宜㑹計大觀中河北漕臣任諒著河北根本録凡户口升降官吏増損與一歳出納竒贏之數皆披籍可見紹興㑹計録紹興五年殿中侍御史張絢言周制國用之法在用地小大視年之豐耗量入以為出漢祖定天下之本在於得秦圖籍周知四方盈虚强弱之實是知國之財用必得節制之法節財之要必資㑹計之書所以察其登耗量其多寡參酌損益因時制宜故用度有常而民力不困也國家景徳皇祐皆有㑹計録至治平熈寧間亦有此書其後蘇轍又倣其法作元祐㑹計録雖書未及上其大畧亦可觀皆所以總括巨細網羅出納凡天下賦入與官吏養兵之數章條各立支費有限謹視其書上下遵守此作㑹計録之本意也國家比年以來財賦浸虚用度滋廣正宜括歳入之厚薄計歳出之多寡分其品目别其名色摠貫旁通載之圖册揆考之間如運諸掌斯可以裁減浮費増益邦賦今日之先務也伏望明詔大臣選委詳練財賦之官俾倣景徳皇祐等書撰進成録自紹興元年止四年為率以每歳所入之數列之於前却以今歳計之除預借已支費外摠計見今歳入實有之數合計若干復以日下至歳終凡官吏之費養兵之費及應合用錢物通計若干名曰紹興㑹計録量入為出既可以見有無之實絶長補短斯可以制裁損之宜庶幾國用有節云閏二月己酉詔户部撰集紹興㑹計録其後户部第具去歳收支數以聞而已四月戊申户部奏出入之數以為皇祐治平㑹計天下財賦當時取㑹動經歳月方可成録故但具去年出入之數國朝時令季冬之月命有司造計籍注云周禮小宰聴出入以要㑹鄭司農曰要㑹謂計日取之簿書日計月要歳計月㑹故宰夫之職曰歳終則令羣吏正歳㑹月終則令正月要禮記冢宰制國用必以歳之杪唐六典度支掌判天下財賦多少數物産豐約之宜水陸道路之利每歳計其所出而支其所用淳化中詔三司諸道歳計所入悉具數總計司置籍録之其諸路歳終所收財賦置籍出納亦如之景徳中令三司每歳較天下稅帳耗登以聞紹興戊午之歳光堯嘗以六䇿詢于宰執觀當時大臣所對財用出入之數可見宣和初國家月費九十五萬紹興三年月費一百六十萬今以紹興初為率通一歳計之國家定費計一千九百二十萬此皆當時大臣所對財用所出之數也宣和初榷貨所入淮南鹽利二千四百五萬兩浙鹽利計七百八萬今淮浙路所入之鹽利通一歳計之共三千二百萬此當時大臣所對財用所入之數也夫以淮浙鹽利一節自足以當國家支費之數此外又有諸路之賦所入不知其幾倍矣三十年十二月二十一日户侍錢端禮言以紹興二十九年一歳之用編類成册詔户部條具均節聞奏乾道㑹計録乾道元年十一月十七日執政進呈户部每歳收支總數十八日復呈細數六年五月丁丑詔依皇祐元祐紹興作㑹計録從發運史正志之請也七月二十八日詔户侍王佐造簿籍淳熈六年十二月丁未臣僚請為㑹計録上曰向者欲為此録縁取民太重色目太多若遽蠲則妨經費須他日恢復之後乃可盡除之十三年九月己未詔輔臣以每月財賦册進呈欲知豐耗淳熈十年八月輔臣奏封樁庫錢及三千萬餘緡及奏内外樁積緡錢四千七百餘萬十三年庫中所儲金至八十萬兩銀一百八十六萬餘兩下庫見緡常五六百萬先是六年四月左藏封樁庫言緡錢五百三十萬乾道度支都籍參考上計録乾道四年六月度支郎趙不敵言今一歳内外支用之數大槩五千五百萬緡有竒賦入分隷於户部之五司支用悉經度支臣置為都籍㑹計窠名總為掲貼請付本曹自茲歳一易之先是二年正月癸亥十八日知秀州孫大雅奏書四卷名曰州郡拘催上供錢物格奏入詔大雅奏漢上計之法可行於今令侍從臺諫參考古制御史張端實劉貢言漢上計之制不能無弊今日能盡革其偽乎在東漢則逺方未必皆至今川廣能如期而至乎莫若歳終令户部造册進呈選一人考覈而明其殿最户侍曽懷請立式行下從之其年三月丁未也先是户部有上中末限之格法有月旬五日之期會歳終以常平牧支户口租稅造册進呈而州郡窠目尚畧隆興元年三月議節浮費置局於户部於是省官吏員減貴戚俸紹熈㑹計録紹熈元年五月甲戌置紹熈㑹計録命户書葉翥等為之仍自宫掖始以慶厯隆興為法從户侍趙彦逾之請也二年正月辛未丁丑兩降㫖後亦未聞有所減紹熈三年吏部郎陳傳良奏自建隆至景徳四十五年南征北伐未甞無事而金銀錢帛糧草雜物七千一百四十八萬計在州郡不㑹祥符元年三月始奏立諸道上供歳額熈寧新法増額一倍崇寧重修上供格頒之天下率一路之増至十數倍熈寧有令項封樁元豐有無額上供迄今為額宣和經制紹興摠制月樁取之悉而民困極矣慶元㑹計録慶元二年三月用殿中侍御史姚愈建請命金部郎中趙師炳户部郎中楊文炳編集以㑹計司為名三年三月書成六月十九日户部言以紹熈元年至慶元元年左藏庫諸倉并總領所出納増損及十二路州軍窠名錢參究源流登耗為慶元中外㑹計録分五十八册已進呈復條具撙節之數上之宫掖出入之數令内侍自稽考九月議者言裁抑當先宫禁詔侍從臺諫兩省集議吏書許及之等請内庭裁約中制立為定額從之嘉泰元年九月臣僚言户部歳入約一千八百餘萬支數僅亦相當姚愈言熈豐間月支三十六萬宣和末用二百二十萬渡江之初連年用兵月支猶不過八十萬比年月支百二十萬大畧官俸居十之一吏禄十之二兵廩十之七端平㑹計録元年唐制總制邦用度支是司出納貨財太府攸職凡是太府出納皆稟度支文符太府依符以奉行度支憑按以勘覆互相關鍵用絶姦欺出納之數每旬申聞見在之數每月計奏皆經度支勘覆又有御史監臨陸贄奏議舊制天下財賦皆入左藏庫而太府四時以數聞尚書比部覆出納楊炎傳國朝三司有帳案内自府庫外至州縣嵗會月計以上三司自治平二年至熈寧二年十一月凡四年而未鉤考帳已踰十有二萬錢帛芻粟積其虧損不可勝計遂置提舉帳司領之元豐官制行釐其事歸比部參掌鉤考中外帳籍之事周官宰夫所謂乘其財用之出入者也轉運司常以計帳申省三司鉤考無法至道初置行帳司以㑹財用之數命邊肅主之葉適云王安石大挈利柄封樁之錢所在充滿紹聖元符間拓地進築而斂不及民熈豐舊人矜伐其美然陳瓘譏切曾布以為轉天下之積耗之西邊邦本自此撥矣於是蔡京變茶鹽法括地寶走商賈所得五千萬内窮奢侈外熾兵革宣和之後方臘甫平理傷殘之地則士色始立燕雲乍復急新邊之用而免夫又興自是以來羽檄交警増取之目大者十數而東南之賦遂以八千萬緡為額焉祖宗時嵗百五十萬元豐月三十六萬宣和月百二十萬渡江之後月八十萬休兵之後循習承平舊典費擬宣和淳熙末月支百二十萬緡玉海卷一百八十五
