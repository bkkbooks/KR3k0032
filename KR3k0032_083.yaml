body:
  text: 玉海卷八十三宋王應麟撰車服旌旗觜觿西九星一曰天旗爾雅注旄首曰旌有鈴曰旂黄帝五旗牙旗外紀有熊制陳法設五旗五麾天下不順者征之東至海西至空桐南至于江北逐葷粥而邑于涿鹿之阿通典黄帝振兵教熊羆貔貅云云同上世本黄帝作旃河圗風后曰予告汝帝之五旗東方法青龍曰旗西方法白虎曰典南方法赤鳥曰䉭一作鼠北方法玄武曰旂中央法黄龍曰常黄帝出軍决有所攻伐作五采牙幢始立牙之日吉氣來應旗幡指敵或從風舉勇氣奔逸是謂堂堂之陣正正之旗此大勝之徴青牙旗引東赤南白西黒北黄中列子黄帝與炎帝戰阪泉以鵰鶡鷹鳶為旗幟蓋旌旗之始也堯進善旌舜告善旌見招諫類文選王融䇿秀才文或揚旌求士注管子曰舜有告善之旌舜太常子華子舜游巖廊之上被袗衣而鼓五弦之琴畫日月于太常釋名曰言常明也備十有二章黼黻玄黄爛如也禮司常疏聖人與日月齊明旌旗畫日月象之臧哀伯云三辰旂旗昭其明也太常畫日月兼有星書疏王肅以為舜時三辰即畫於旌旗子廣雅云天子之旌髙九仞春杖疏曰穆天傳天子建日月七星舜皂游史記秦之先大費與禹平水土舜曰咨爾費是為伯翳贊禹功其錫爾皁游索隠皁色旒斾後漢志秦玄旗皁游從水徳虞旂夏綏魯四代旌旗明堂位有虞氏之旂下文言有虞氏之緌夏后氏之綏殷之大白周之大赤注四者旌旗之屬綏當為緌虞當言綏夏當言旂此盖錯誤緌謂注旄牛尾於杠首所謂大麾書曰武王右秉白旄以麾禮王建大旂以賓建大赤以朝建大白以即戎建大麾以田正義此論魯有四代旌旗虞緌但注旄竿首未有旒縿夏旂漸文既注旄竿首又有旒縿大白大赤各随代之色無所畫也王制天子下大綏注有虞氏之旌旗也通典夏奚仲為車正建旗斿旐以别尊卑等級巾車注大麾色黒夏后氏所建司常疏夏采注云禹貢徐州貢夏翟之羽有虞氏以為緌後世或無染鳥羽象而用之冬官鍾氏染鳥羽荀子武王誅紂垂之赤斾墨子天賜武王黄鳥之旗夏旌旗旂常宋禮志夏建旌旗以表貴賤隋志奚仲為夏車正加以旂常於是旒就有差用明尊卑之别商龍旂周龍旂又見下渠門赤旂綪茷商頌玄鳥龍旂十乘大糦是承疏諸侯建龍旂助祭魯頌龍旂承祀疏建交龍之旂周頌載見龍旂陽陽和鈴央央鞗革有鶬注陽陽言文章和在軾前鈴在旂上齊語管子同葵丘之㑹天子使宰孔致胙于桓公賞服大路龍旂九旒管子云九斿渠門赤旂注渠門兩旗所建以為軍門若今牙門也赤旂大旂也管子注渠門旗名左傳分魯公以大旂交龍為旂分康叔以少帛雜帛綪茷大赤也取染草名通東京賦帛綪茷旌旗通帛為旃析羽為旌吳語建肥胡幡白常白旂赤常赤旟玄常玄旗詩出車疏文王時未制周禮則南仲以下或建旗或載旐載旟荀子禮論龍旂九斿所以養信吕氏春秋孟春載青旂注交龍為旂載者若今之雞翹車是也漢書韋孟詩肅肅我祖國自豕韋黼衣朱黻四牡龍旂云云揔齊羣邦以翼大商注應劭曰旗上畫龍為之國語云豕韋為商伯後漢志注東觀書永平二年正月東平王蒼議曰旂有龍章日月以備其文周九旗大常旂旜物旗旟旐旞旌巾車旗物大閱旗物大旂春官司常中士二人掌九旗之物名各有屬以待國事日月為常交龍為旂通帛為旜雜帛為物熊虎為旗鳥隼為旟龜蛇為旐全羽為旞析羽為旌注物名者所畫異物則異名屬謂徽識也大傳謂之徽號今城門僕射所被及亭長著絳衣皆其舊象通帛謂之大赤從周正色無飾雜帛者以帛素飾其側白殷之正色全羽析羽皆五采繫於旞旌之上所謂注旄於干首凡九旗之帛皆用絳疏周建子物萌色赤殷建丑為正物牙色白詩干旄干旌注云孤卿建旃大夫建物首皆注旄太常已下首皆有旄羽周尚赤故爾雅云纁帛縿也及國之大閱贊司馬頒旗物王建大常注王畫日月象天明也諸侯建旂畫交龍一象升朝一象下復孤卿建旜不畫言奉王之政教而已載聘禮使者旜大夫士建物雜帛言以先王正道佐職也疏中赤旁白白是先王殷之正色師都建旗六鄉六遂大夫鄉遂出軍賦熊虎象其守猛莫敢犯州里建旟鳥隼象勇捷縣鄙建旐龜蛇象捍難避害道車載旞象路也王以朝夕燕出入斿車載旌木路也王以田以鄙全羽析羽五色象其文徳也大閱王乗戎路建大常玉路金路不出皆畫其象焉官府各象其事州里各象其名家各象其號徽識以題别衆臣樹之於位朝各就焉三者旌旗之細也異外内凡祭祀各建其旗㑹同賓客亦如之注皆建大常置旌門掌舎設旌門軍事建旌旗致民置旗弊之甸亦如之巾車下大夫二人辨旗物玉路建大常十有二斿以祀九旗之畫日月者正幅為縿斿則屬焉金鼓建大旂以賓九旗之畫交龍者象路大赤以朝九旗之通帛革路建大白以即戎殷之旗猶周大赤蓋象正色也旗周書尅殷武王乃手大白以麾諸侯百夫荷素質之以前于王世俘云王佩赤白旂木路建大麾以田不在九旗中以正色言之刪黒夏后氏所建夏官大司馬中秋教治兵王載大常諸侯載旂軍吏載旗師都載旜鄉遂載物郊野載旐百官載旟各書其事與號節服氏衮冕六人維王之大常司勲凡有功者銘書王之大常祭於大烝司勲詔之注生則書于王旌識其功書君牙成績紀于大常冬官輈人龍旂九斿以象大火也注交龍為旂諸侯之所建也大火蒼龍宿之心其屬有尾尾九星䟽車上皆建旌旂故因說旌旂之義已下九斿七斿六斿四斿之旌旗皆謂天子自建若臣下皆依命數然天子以十二為節而今建九七六四斿者上得兼下也尾九星九斿所象此謂天子龍旂其上公亦九斿若侯伯則七斿子男則五斿大行人所云是也樂記曰龍斿九斿天子之旌也齊輿人疏案禮緯諸侯旗軫大夫齊較鳥旟七斿以象鶉火也注鳥隼為旟州里所建鶉火朱鳥宿之栁其屬有星星七星疏鶉火三星栁為首熊旗六斿以象伐也注熊虎為旗師都之所建也伐屬白虎宿與參連體而六星龜蛇四斿以象營室也注龜蛇為旐縣鄙之所建營室玄武宿與東璧連體而四星弧旌枉矢以象弧也注覲禮曰侯氏載龍旂弧韣則旌旂之屬皆有弧也弧以張縿之幅有衣謂之韣又為設矢象弧星有矢也妖星有枉矢者蛇行有毛目此云枉矢蓋畫之也疏弧旌者弧弓也旌旗有弓所以張縿幅弓上畫枉矢於上韣韜也以衣韜其弓月令帶以弓韣是也不晉志弧九星在狼東南天弓也輈人此制與周官合四旗非周制亦非前代之制正合曲禮之言然則戰國之制乎秋官大行人上公建常九斿侯伯七斿子男五斿注常旌旗也明堂位是以魯君孟春乗大路載弧韣旂十有二旒日月之章祀帝于郊配以后稷天子之禮也左傳分魯公以大旂茷泮水言觀其旂其旂茷有虞氏之旂夏后氏之綏商之大白周之大赤左傳三辰旂旗昭其明也注日月星畫於旂旗象天之明疏九旗之物唯日月為常不言畫星者蓋大常之上又畫星也穆天子傳稱建日月七星蓋畫北斗七星也通典黄帝振兵教熊羆貔貅制陳法設五旗五麾夏后氏奚仲為車正建其斿旐殷因之周制司常掌九旗云云周虞旗虞旌地官山虞若大田獵則萊山田之野及弊田植虞旗于中致禽而珥焉注山虞有旗以其主山得畫熊虎其仞數則短也山多虎故用熊虎澤虞若大田獵則萊澤野及弊田植虞旌以屬禽注澤鳥所集故得注析羽大司徒大軍旅田役以旗致萬民而治其徒庶之政令鄉師凡四時之田及期以司徒之大旗致衆庶而陳之以旗物辨鄉邑而治其政令刑禁注司徒致衆庶者以熊虎之旗遂人若起野役則令各帥其所治之民而至以遂之大旗致之注遂之大旗熊虎天官獸人及弊田令禽注于虞中注置虞人所立虞旗之中夏官田僕凡田令獲者植旌大司馬大閱司馬建旗于後表之中以旌為左右和之門儀禮鄉射君國中射則皮樹中以翿旌獲疏用羽為之白羽與朱羽糅注燕射也以翿旌獲尚文徳也於郊則閭中以旌獲大射也析羽為旌於竟則虎中龍旜與鄰國君射也畫龍於旜尚文章也通帛為旜大夫兕中各以其物獲士鹿中翿旌以獲詩車攻悠悠斾旌建旐設旄搏獸于敖注田者褐纒旃以為門天子發抗大綏諸侯發抗小綏疏舉綏為表抗綏謂既射舉之因置虞旗於其中受而致禽焉受禽獵止則弊之故王制曰下大綏下謂弊之齊招虞人以旌不至楚公子圍為王旌以田周獲旌又見上更旌春官司常凡射共獲旌嵗時共更旌注獲旌獲者所持旌更旌取舊予新夏官服不氏射則贊張侯以旌居乏而待獲田僕令獲者植旌注以告獲也儀禮鄉射司馬命獲者執旌以負侯大射儀獲者坐而獲舉旌以宮偃旌以商孟子齊景公田招虞人以旌不至周龍章司馬法禮巾車疏引之天子之義章夏后氏以日月象一作上明也商以虎尚一作上威也周以龍尚一作上文也注章畫飾也巾車疏周雖以日月為常以龍為章明堂位周以龍章為冕服之韍郊特牲旂十有二旒龍章而設日月以象天也注魯禮詩六月宣王北伐也織文鳥章白斾央央注錯革鳥為章疏畫急疾之鳥隼是也百官建旟箋云織徽織也將帥以下衣皆著焉織史記漢書謂之幟疏自王以下其制如所建旌旗而畫之其象但小耳以絳為縿各畫其章又絳為旒書名於末韓奕王錫韓侯淑旂綏章注交龍為旂綏大綏也疏即王制下大綏即交龍旂竿所建與旂共一竿為貴賤表章故云綏章覲禮天子乘龍載大斾象日月升龍降龍注大斾大常也漢東觀書東平王蒼議曰旂有龍章日月以備其文周罕旗史記武王入商百夫荷罕旗以先驅後漢志注同麾書右東白旄以東京賦雲罕九斿注薛綜曰旌旗名春秋正義鄭有蝥弧齊有靈姑銔皆諸侯之旗也趙簡子有蠭旗卿之旗也詩王錫韓侯淑旗綏章江漢既設我旟車攻悠悠斾旌出車設旐建旄衛干旄干旌干旟晉趙簡子蠭旗吳肥胡宋旌夏左傳鄭命二拒旝動而鼓晉中軍風于澤亡大斾之左旃張侯曰師之耳目在吾旗鼓城濮之戰狐毛設二斾而退之吉行以綪茷師行以白斾繼旗者旐繼旐者斾周鳬旌隋巢子一云墨子天賜武王黄鳥之旗以伐殷隋禮志周書王㑹張羽鳬旌禮記云龍旂九旒天子之旌也晉志成王之㑹壇垂隂雨五方之盛有八十物宗馬鳥旌奚往不格秦皇并國豐貂東至獬豸南來又有玄旗皁旒之制旄頭罕車之飾周黄旂司馬法天子之義旂夏后氏玄首人之執也殷白天子之義也周黄地之道也旌首有鈴曰旂管仲九章管子兵法篇第十七三官不繆五教不亂九章著明三官一曰鼓二曰金三曰旗旗所以立兵利兵偃兵也五教一曰教其目以形色之旗二曰教其身以號令之數三曰教其足以進退之度四曰教其手以長短之利五曰教其心以賞罰之誡九章一曰舉日章則畫行二曰舉月章則夜行三曰龍章行水四曰虎章行林五曰鳥章行陂六曰蛇章行澤七曰鵲章行陸八曰狼章行山九曰舉𤭔章則載食而駕𤭔韜也謂韜其章而舉之九章既定而動静不過禮大司馬中夏教茇舎辨號名之用帥以門名縣都各以其名家以號名鄉以州名野以邑名百官各象其事以辨軍之夜事古者晝戰則目相視故為之旌幟夜戰則聲相聞故為之號名揚大傳殊徽號昭二十一年宋廚人濮曰徽者公徒也詩六月織文鳥章漢赤幟朱旗紀髙祖為沛公祠黄帝祭蚩尢於庭而釁鼓旗幟皆赤由所殺白帝子者赤帝子也贊旗幟上赤協于火徳自然之應得天統矣叙傳神母告符朱旗廼舉東京賦髙祖膺籙受圗杖朱旗而建大號燕然山銘朱旗絳天韓信傳拔趙旗幟立漢赤幟二千功臣表周昌為職志注主旗幟之屬東觀漢記段熲為并州刺史曲蓋采旗文選注引之漢大將旗韓信傳信謂軍吏曰趙已先據便地壁且彼未見大將旗鼓未肯擊前行平旦信建大將旗鼓鼓行出井陘口漢黄屋左纛史記贊朝以十月車服黄屋左纛髙紀乘王車黄屋左纛注李斐曰天子車以黄繒為蓋裏纛毛羽幢也在乘輿車衡左方上注之蔡邕曰以犛牛尾為之如斗或在騑頭或在衡續志聖人處天子之位黄屋左纛所以副其徳章其功也賈誼傳諸王或戴黄屋注師古曰天子車蓋之制河東賦揚左纛被雲梢東京賦方釳左纛鉤膺玉瓖鑾聲噦噦和鈴鉠鉠屬車九九乘軒並轂􅕈弩重旃朱旄青屋雲罕九斿鈒㦸轇轕髶髦被繡虎夫載鶡注薛綜曰左纛以旄牛尾大如斗置騑馬頭上以亂馬目不令相見朱旄旄牛尾赤色者也髶髦髦頭茸騎也東方朔傳對曰羿為旄頭注應劭曰旄頭以羽林為之髮正上向而長衣繡衣在乘輿車前梁丘賀傳先敺旄頭注同上旄天文志昴曰頤光武紀建武二十八年正月己巳賜東海王疆虎賁旄頭注魏文帝列異傳曰秦文公時梓化為牛以騎擊之或墮地被髮牛畏之入水因是置旄頭騎使先驅宋禮志周禮無相風罼網旄頭之屬此非古制明矣何承天謂戰國並争師旅數出懸烏之設務察風祲晉武問侍臣旄頭何義彭推對曰秦國有竒怪觸山截木惟畏旄頭故虎士服之則秦制也張華曰有是言而事不經臣謂壯士之怒髮踊衝冠義取於此摯虞决疑無所是非徐爰曰彭張各言意義無所承據案天文畢昴之中謂之天街故車駕以罼罕前引畢方昴圎因其象星經昴一名旄頭故使執之者冠皮毛之冠也栁宗元祭纛文豐有大特化為巨梓秦人憑神乃建茸頭是為兵主用以行師漢宗蚩尤亦作靈旗既類既禡指于有罪北面詔盟抗侯以射雖有古典今棄不用太白隂經曰纛六大將軍中營建出引六軍元魏有纛頭行幸及征伐建于旗上唐衛尉器用纛居其一蓋旄頭之遺象節度使植六纛本朝有皁纛十二左右各六漢大旂見金根車漢泰一鏠旗靈旗井旟郊祀志元鼎五年秋為伐南越告禱泰一以牡荆畫幡日月北斗登龍以象太一三星為泰一鏠旗命曰靈旗為兵禱則太史奉以指所伐國其春滅南越五年夏吕嘉反秋遣路博徳等五將軍討之上食貨志治樓船旗幟加其注李竒曰牡荆作幡柄也晉灼曰天極星其一明者太一也旁三星三公也畫一星在後三星在前師古曰以牡荆為幡竿禮樂志泰元歌招揺靈旗九夷賓將注師古曰畫招揺於旗以征伐甘泉賦招繇泰壹舉洪頤旗名樹靈旗西京賦建玄弋植招揺注薛綜曰玄弋北斗第八星名為矛頭招揺第九星名為盾今鹵簿中畫於旗建以前驅郎顗傳以五月丙午遣太尉服干戚建井旟注書井星之文於旟唐獨孤授靈旗賦三星前列九仞髙懸戰國䇿建九斿從七星之旟此天子之位也傳三辰旂旗疏曰畫北斗七星曲禮行前朱鳥而後玄武左青龍而右白虎以四獸為軍陳象天也招揺在上急繕其怒畫招揺星於旌旗上以堅勁軍之威怒象天帝也招揺星在北斗杓端主指者北斗第七星曹植七啓垂宛虹之長緌抗招摇之華旍光武紀贊神旌乃顧遞行天討漢太常牙旗羽旗翠旌翠華旗續志太常十二斿九仞曳地日月升龍象天明也校獵賦靡日月之朱竿曳彗星之飛旗李善注朱竿太常之竿也穆天子傳曰日月之旗七星之文立歴天之旂曳捎星之旃南都賦望翠華兮葳㽔建太常兮裶裶東京賦建辰旒之太常紛飈悠以容裔戈矛若林牙旗繽紛西京賦垂翟葆建羽旗注隼羽為旌旗郊祀志置夀宫北宫張羽旗禮樂志房中歌芬植羽林雲景杳㝠金支秀華庶旄翠旌師古曰析五采羽注翠旄之首而為旌上林賦建翠華之旗張揖注以翠羽為葆也歴吉日以齊戒襲朝服乘法駕建華旗鳴玉鸞田蚡傳前堂立曲旃注禮大夫建旃曲柄上曲也司馬相如賦楚王云云靡魚須之橈旃曳明月之珠旗師古曰大魚之須出東海見尚書大傳橈旃即曲旃也漢鸞旗賈捐之傳孝文帝詔曰鸞旗在前屬車在後注師古曰鸞旗編以羽毛列繫幢旁載於車上大駕出則陳於道而先行屬車相連屬而陳於後也甘泉賦流星旄而電燭兮咸翠蓋而鸞旗輿服志鸞旗者編羽毛列繫幢旁民或謂之雞翹非也注胡廣曰鸞旗以銅作鸞鳥車衡上與本志不同楊秉傳上疏曰非郊廟之事則鑾旗不駕注漢官儀曰前驅有雲罕皮軒鑾旗車東京賦鸞旗皮軒通帛綪茷雲罕九斿注鸞旗以象鸞鳥也雲罕旌旗别名九斿亦旗名晉有鸞旗車漢龍旂熊旗通典漢制龍旂九斿七刃以象大火鳥旟七斿五刃以象鶉火熊旗六斿五刃以象參伐龜蛇旐四斿四刃以象營室弧旌枉矢以象弧也此諸侯以下所建也宋志漢制五色安立車建龍旂隋志應劭漢官大輅龍旂畫龍於旂上也東京賦咸龍旂而繁纓注交龍為旂西都賦張鳯蓋建華旗西京賦棲鳴鳶曳雲梢弧旌枉矢虹旃蜺旌注上林賦曰拖蜺旌博古圗有漢旂鈴漢五旗晉九旗五旗唐五旗見車類揚雄傳河東賦鳴洪鍾建五旗注漢舊儀云皇帝車駕建五旗蓋謂五色之旗也以木牛承其下取負重致逺也宋志五旗者五色各一旗以木牛承其下徐廣云木牛取負重而安穏也五旗纒竿即禮記徳車結旌不盡飾也戎事乃散之武車綏旌垂舒之也晉潘岳傳藉田賦九旗揚斾雲䍐晻藹晉志五牛旗平吳後所造以五牛建旗車設五牛青赤在左黄在中白黑在右旗常纒而不舒唯天子親戎五旗舒斾通典同周遷車服記晉元帝始制五牛之旗唐儀衛志五牛旗隊黄居内赤青居左白黒居右各八人執通典同漢江都王非以軍功賜天子旗魏赤旂魏志明帝景初元年三月定厯改年為孟夏四月服色尚黄犠牲用白戎事乘黑首白馬建大赤之旂朝㑹建大白之旗晉輿服志太元中東宫建乘路有青赤旂徐邈議太子既不備五路赤旂宜省吳黄龍大牙牙幢吳志黄武八年夏黄龍見樊口權因瑞改元又作黄龍大牙常在中軍諸軍進退視其所向後漢袁紹傳注真人水鏡經曰凡軍始出立牙竿必令全堅牙門旗竿軍之精也即周禮司常軍旅㑹同置旌門是也胡綜作黄龍大牙賦狼弧垂象實惟兵精聖人觀法是效是營乃律天時制為神軍取象太乙五將三門疾則如電遲則如雲進止有度約而不煩四靈既布黄龍處中周制日月實曰太常桀然特立六軍所望軍欲轉向黄龍先移金鼓不鳴寂然變施闇謨若神可謂秘竒吳都賦吳王乃巾玉輅軺驌驦旗魚須常重光羽旄揚㽔雄㦸耀芒貝胄象弭織文鳥章陸遜傳為右部督討丹陽賊益施牙幢潛出谷間晉元帝加陶侃奮威將軍假赤幢曲蓋軺車鼓吹牙旗黄帝出軍决五色牙旗随天氣四時真人水鏡經凡軍始出立牙竿必令堅魏志典韋傳牙門旗長大人莫能勝韋一手建之吳志陸遜討山越益施牙幢分布鼓角後魏書大將行師唯長孫嵩奚斤給漏刻及十二牙旗太白隂經纛六口大將中營建出引六軍古者天子六軍諸侯三軍今天子十二諸侯六軍故纛有六以主之門旗二口色紅八幅大將牙門之旗出引將軍前列門槍二根以豹尾為刃榼出居紅旗後止居帳門前左右安立五方旗五各具方色大將中營建出六纛後在營亦於纛後随方而建隊旗二百五十面尚色圗禽與本陣同五幅認二百五十口後漢滕輔晉袁宏顧愷之有祭牙文烈烈髙牙晉白獸幡騶虞幡職官志武帝以陳勰為殿中典兵中郎將遷將軍帝每出入勰持白獸幡在乗輿左右鹵簿陳列齊肅張華傳白帝遣騶虞幡淮南王允傳陳淮遣麾騶虞幡以解圍桓温傳殷浩欲以騶虞幡住桓温軍安帝紀元興元年討桓玄二月丁巳遣侍中齊王柔之以騶虞幡宣告荆江二州使罷兵古今注魏有青龍朱鳥玄武白虎黄龍幡五以詔四方晉朝唯用白虎幡信幡用鳥書取其飛騰輕疾也乘輿畫為白虎取其義而有威信之徳也晉青龍旂禮志康帝建元元年納皇后而儀注陛者不設旄頭殿中御史奏云云昔迎恭皇后惟作青龍旂其餘皆即御物今當臨軒遣使而五牛旂旗旄頭罼罕並出隋青龍騶虞旗唐青龍旗盧賁傅髙祖受禪賁奏改周代旗幟更為嘉名其青龍騶虞朱雀玄武千秋萬歲之旗皆賁所創後周太常畫日月五星禮緯稽命徴云天子旗九刃曳地諸侯七刃齊軫大夫五刃齊較士三刃齊首唐志金吾胄曹大朝㑹行從給青龍旗䂍矟於衛尉唐麟旗二十四旗三十二旗鸞旗儀衛志大駕鹵簿第一辟邪旗二應龍旗三玉馬旗四三角獸旗五黄龍負圗旗六黄鹿旗七飛麟旗八駃騠旗九鸞旗十鳳旗十一飛黄旗十二麟旗開元禮義羅曰髙宗時麟見苑囿改元麟徳制麟旗十三角端旗十四赤熊旗十五兕旗十六太平旗十七犀牛旗十八鵔䴊旗十九騼䮷旗二十騶牙旗二十一蒼烏旗二十二白猿旗二十三龍馬旗二十四金牛旗又有青龍白虎旗元日冬至大朝㑹左右衛黄旗仗立兩階之次鍪甲弓箭刀楯皆黄第一麟旗隊二角端旗隊三赤熊旗隊次左右驍衛赤旗仗坐于東西廊下鍪甲弓箭刀楯皆赤一鳯旗隊二飛黄旗隊三吉利旗隊四兕旗隊五太平旗隊次左右武衛白旗仗居驍衛之次鍪甲弓箭刀楯皆白一五牛旗隊黄居内赤青居左白黑居右各八人執二飛麟旗隊三駃騠旗隊四鸞旗隊五犀牛旗隊六鵕䴊旗隊七麒麟旗隊八騼䮷旗隊次左右威衛黒旗仗立于階下鍪甲弓箭楯矟皆黒一黄龍負圗旗隊二黄鹿旗隊三騶牙旗隊四蒼烏旗隊次左右領軍衛青旗仗居威衛之次鍪甲弓箭楯䂎皆青一應龍旗隊二玉馬旗隊三三角獸旗隊四白狼旗隊五龍馬旗隊六金牛旗隊二十四旗無吉利第一隊執鶡鷄旗第二隊執豹旗六典武庫令旗之制三十有二曰青龍白獸朱雀玄武黄龍負圗應龍龍馬玉馬鳯皇鸞鵕䴊太平麒麟飛麟飛黄駃騠白澤五牛犀牛金牛兕三角獸角端吉利騼䮷騶牙黄鹿白狼赤熊辟邪苣文刃旗注周司常掌九旗黄帝鵰鶡鷹鳶為旗今白澤朱雀辟邪玄武等旗金吾隊所執青龍白獸麒麟角端赤熊等旗左右衛隊所執鳯皇飛麟駃騠鸞旗犀牛鵕䴊騼䮷等旗武衛隊所執應龍三角玉馬白狼龍馬金牛等旗領軍隊所執黄龍負圗黄鹿騶牙蒼烏等旗威衛隊所執苣文旗脚為苣文刃旗火焰旛也六典注五旗仗見鹵簿隋志諸衛左右廂旗圗様十五卷唐五旗通典唐衛公李靖兵法曰諸軍將五旗各准方色赤南方火白西方金皂北方水碧東方木黄中央土土既不動用為四旗之主而大將行動持此黄旗於前立如東西南北有賊各随方色舉旗問對太宗曰方色五旗為正乎旛麾折衝為竒乎分合為變其隊數曷為得宜靖曰臣參用古法凡三隊合則旗相倚而不交五隊合則兩旗交十隊合則五旗交吹角開五交之旗則一復散而為十開二交之旗則一復散而為五開相倚不交之旗則一復散而為三兵散則以合為竒合則以散為竒三令五申三散三合復歸于正四頭八尾乃可教焉此隊法所宜也李光弼代郭子儀朔方麾幟無所更一號令之氣色益精明唐衙門旗五采牙旗儀衛志大駕鹵簿衙門旗二人執四人夾官志殿中侍御史巡幸則往來門旗之内檢校文物虧失者禮志講武於都外建五采牙旗建旗為和門如方色本朝志古者天子出建大牙今制赤質錯采為神人象中道前後各一門左右道分五門門二旗蓋取周制建旌表門及天子五門之制含元殿賦火烈門旂霜交陛㦸赤旗絳庭張衡東京賦牙旗繽紛薛綜注曰將軍之旌開元禮義羅曰牙旗後周所制畫獸示兵威取爪牙之義魏典韋一手建牙門旗唐黄麾絳麾儀衛志黄麾仗左右廂各十二部大駕鹵簿左右翊駕在黄麾内次玄武幢一义一居絳麾後次絳麾一左右夾玄武幢次細矟十二孔雀為毦左右横行西京雜記漢大駕有前黄麾古晉中朝鹵簿有黄門麾御麾崔豹今注麾所以指麾乗輿以黄開元禮義纂唐太宗法夏后之前制取中方之正色故制大麾色黄今禮其制十二幅㑹要天寶九載七月五日諸衛隊仗緋色旗幡改為赤黄以符土運唐六色氅告止旛傳教幡五色幡儀衛志黄麾仗第一行長㦸六色氅領軍衛赤威衛青黑武衛鶩驍衛白左右衛黄第二行儀鍠五色幡又有孔雀鸚鵡戎鷄毛氅首尾廂皆絳引幡二十太子鹵簿儀鍠五色旛六人絳引旛十二親王鹵簿有絳引旛六告止旛四傳教旛四信旛八凡旛皆絳為之書官號篆以黄飾以鳥翅取其疾也金塗鉤竿長一丈二尺左麾右幢一品告止傳教旛皆二信旛六二品三品信旛四四品五品信旛二萬年令有告止傳教信旛皆二宋孝武詔信旛非臺省官悉用絳本朝志氅緝鳥毛為之唐有六色孔雀大小鵝毛雞毛之制今為四角小蓋每角垂珠佩間以朱縁周綴五色帶繡雲龍孔雀白鵝有三色之别繫龍頭竿竿制如㦸幡本幟也古之徽號貌幡幡然皆絳帛錯采為字上有朱縁小蓋四角垂羅之佩繫龍頭竿上畫錯采字下告止為雙鳯傳教為雙白虎信幡為雙龍又有絳引幡制頗同作五色間暈無字兩角垂佩景祐五年改制旛麾易為小篆舊用隷字志古今注曰信旛用鳥書漢曰蟲書書旛信建隆攝提旗建隆四年將郊祀禮儀使陶穀建議取天文大角攝提之象作攝提及北斗二十八宿十二辰龍墀十三旗五方神五方鳯四瀆等旗元豐三年改製各著其象以則天文攝提旗舊圗色赤繪為人形元豐三年七月十三日更定鹵簿去所繪人形有司循舊未改元祐七年十月二十七日太常始請改造政和四年改著其象旗色用青從天之色以放天文宣和鹵簿記左右攝提旗二天官書大角者天王帝庭兩旁各有三星曰攝提直斗杓所指以建時節張衡東京賦攝提運衡薛綜注攝提有六星飾於車上國朝制旗猶車飾也東都賦屬御方神曲禮招揺在上左傳三辰旂旗疏曰畫北斗七星建隆二十一旗見下段國初増二十一旗取諸天文瑞物開寶龍旗引駕旗龍墀旗合璧連珠旗黄龍負圗旗龍旗十二謂風伯雨師雷公電母各一星五左右攝提二北斗一也引駕旗十六謂十二辰天王二等旗唐天寶元年安西城樓上有天王現形龍墀旗十三謂天下太平一五方龍旗各一君王萬歲一金鸞金鳯各一師子二日月各一以上舊令無並開寶通禮新禮加見皇祐大饗明堂記漢武帝造太初厯日月如合璧五星如連珠皇朝取此義制旗日月合璧一苣文二夾之五星連珠一祥雲二夾之建隆中將郊祀太祖又詔别造大黄龍負圗旗一黄龍負圗旗一顧野王符瑞圗曰魚龍負圗從河中出付黄帝黄龍從洛水出五采負圗出舜前大神旗一日月旗二君王萬歲一天下太平一師子二金鸞鳯各一五龍旗五凡二十一旗皆有架南郊用之大黄龍負圗旗陳於明徳門前餘二十旗悉立於宿頓宫前朝㑹冊禮陳於殿庭唐六典有黄龍負圗太平旗今黄龍負圗旗青色錯采為黄龍負一九二四六八三七五之數政和四年六月十一日所改矣周顯徳中有狂僧呼於宋城曰不數年天下當太平俄而太祖受命因為天下太平旗開元禮義羅曰漢武帝時老人星見有謠曰天下太平故制其旗書天下太平字於上開寶通禮新加吏兵力士并赤豹黄羆龍君虎君旗淳熙元年正月朔朝賀殿門外車立大旗三十四乾道七年冊太子同上尊號冊寶亦如之堂郊杞騎立大旗十一明車立大旗十一開寶錯繡諸旗黄麾仗詳見鹵簿類志唐禮殿庭屯門皆列諸衛黄麾大仗太祖増創錯繡諸旗并幡氅等著於通禮正至五月朔御正殿則陳之青龍白虎旗各一五嶽旗五五星旗五五方龍旗二十五五方鳯旗二十五紅門神旗二十八朱雀真武旗一皂纛十二天一太一旗一攝提旗二五神旗五北斗二十八宿旗各一風伯雨師旗各一白澤馴象仙鹿玉免馴犀金鸚鵡瑞麥孔雀野馬聱牛旗各二合璧連珠旗各一雷公電母旗一軍公旗六黄鹿飛麟兕騶牙白狼蒼烏辟邪網子貔旗各一信幡二十二傳教告止幡各十二黄麾二以上兵部日月君王萬歲天下太平師子金鸞金鳯五方龍旗各一以上龍墀龍君虎君赤豹黄熊各五小黄龍旗天馬旗一吏兵力士旗各五天王旗五太歲旗十二天馬旗六排闌旗六十左右幡氅各六行大黄龍旗二大神旗六以上六軍文徳殿入閣淳化三年五月增黄麾仗二百五十人志黄麾其制十二幅絳帛為之如幡錯采成黄麾字下繡交龍朱漆竿金龍首上垂未絲小盖開寶禮同大朝㑹黄麾大仗陳殿庭然闕畧不悉如唐制而旗氅有加焉西京雜記漢大駕有前黄麾崔豹古今注乗輿黄諸公朱刺史二千石纁所以指麾開寶三瑞旗建隆二年隴州楊勲獻鸚鵡鄆州姚光輔獻白免二夀州王審琦獻白免一三年有象至安復黄州開寳初有象至京師羣臣表賀以為撫有南海之兆未㡬平嶺南乾徳六年親郊有司請以祥瑞著旗章遂作金鸚鵡玉免馴象三旗十二月癸卯郊祀改六年為開寶元年拾遺記月中青瑤為免開寶七年瓊州獲白鹿守臣周仁俊以獻乾徳四年開封及耀果州麥兩岐單州三岐澶州三岐至六岐長春節甘露降於江陵連十日霏微如煙霧漬栢葉皆甘守臣盧懐忠采葉以獻通禮加仙鹿瑞麥甘露旗各二元豐元年更定鹵簿請去龍虎仙童大神金鸚鵡網子螣蛇神龜等旗元符二年黄裳言南郊大駕諸旗因事命名乃製寶符重輪祥光瑞鶴旗政和四年十二月庚午製芝禾並秀日有戴承旗先是大觀中有嘉禾芝草並生戴二月日有承氣又有雙蓮翔鶴六年十二月製瑞鶴天正堯瑞萬年連理木旗宣和中有文石祥光旗元豐車旃旂物制度黄麾制度元豐三年七月十四日乙亥詳定禮文所言㸔詳鹵簿記公卿奉引開封令乘軺車開封牧革車隼旗太常卿革車鳯旗司徒革車瑞馬旗御史大夫革車獬豸旗兵部尚書革車虎旗臣等考之皆為非是縣令當乗墨車而建物牧當乘墨車而建旂太常卿當乘夏縵而建旃司徒當乘夏篆而建旃御史大夫當乘夏縵而建旃所以參備周禮九旗之制從之仍令講求車旃旂物制度以聞二年十月八日癸夘詳定朝㑹儀注所言御殿儀仗有黄麾幡一而無黄麾請製大麾一注旄於干首以取夏制黄色以取漢制用十二幅以取唐制用一旒以取今龍墀旗之制元㑹陳仗衛建於當御廂之前以為表識後則建黄麾幡二并上其制度帝曰黄麾制度考詳前志終有可疑今鑿而為之植於大庭或致博聞多識者譏議姑闕之遂止紹興十三年閏四月禮官請玉輅並建旂常四輅各建所載之旗政和中玉輅以太常大旂建於左右而去闟㦸今玉輅左建太常繡日月星辰右建龍旂繡交龍皆用靑羅表裏文繡三禮圗覲禮注云王建太常縿首畫日月其下及斿交畫升龍降龍縿皆正幅用絳帛為質斿則屬焉又用弧張縿之幅又畫枉矢於縿之上注旄與羽於竿首其杠長九仞其斿曳地左傳三辰旂旗昭其明也太常之上又畫星阮氏梁正等圗旂首為金龍頭唐志云金龍頭銜結綬及鈴綏則古注旄羽竿首之遺制也熙寧七年八月十二日太常言五牛旗蓋古之五時副車也以木牛載旗用人輿之失其本制宜省去詔可紹興華旗紹興二十五年十月九日周麟之言太廟生靈芝九莖蓮葉宜製華旗繪靈芝之形以章偉績奏可十一日禮部侍郎王珉等言贛州太平瑞木黎州甘露道州連理木遂寜嘉禾鎮江瑞瓜南安雙蓮嚴信州芝草皆太平盛事請命有司圗狀製為華旗從之參照鹵簿行旗内未盡者製造十一月癸亥郊祀建靈芝瑞木等旗玉海卷八十三
