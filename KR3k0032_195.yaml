武帝祠首山故神為出珍物化為黃金祭后土神光三燭其赦汾隂太初二年三月幸河東祠后土夏四月詔曰朕用事介山祭后土皆有光應介山在河東皮氏縣東南其山特立其赦汾隂祀五帝於渭陽之廟如輝屬天禮太一於甘泉之郊有光照夜漢雲陽美光黃氣郊祀志元鼎五年十一月辛巳朔旦冬至曶爽未明時天子始郊拜泰一有司云祠上有光公卿言皇帝始郊見泰一雲陽有司奉瑄玉嘉牲薦饗是夜有美光及晝黃氣上屬天太史令談祠官寬舒等曰宜因此地光域立泰畤壇以明應劉向對曰甘泉汾隂及雍五畤始立皆有神祇感應然後營之武宣之世奉此三神禮敬敕備神光尤著漢神光志宣帝三年西河立世宗廟神光興殿旁又興于房中如燭狀廣川國世宗廟殿上有鐘音夜有光殿上盡明上乃下詔赦天下漢神光集太一壇神光降紫殿宣紀神爵四年春二月詔曰鳯凰甘露降集京師嘉瑞並見修興太一五帝后土之祠祈為百姓蒙祉福鸞鳯萬舉蜚覽翺翔集止于房齋戒之暮神光顯著薦鬯之夕神光交錯或降于天或登于地或從四方來集于壇上帝嘉嚮海內蒙福其赦天下賜民爵髙年帛成紀永始四年正月幸甘泉郊泰畤神光降集紫殿漢神光耀齋宫宣紀五鳯三年春三月詔曰今北邉晏然靡有兵革之事朕飭齋戒郊上帝祠后土神光並見或興于谷燭耀齋宫十有餘刻漢神光見宣紀甘露二年春正月詔曰乃者鳯凰甘露降集神光並見咸受禎祥其赦天下漢赤光照室光武紀生有赤光照室中又舂陵舍南火光屬天金樓子曰赤光照室影如五麟七鳯唐青光實録開元十九年二月癸未皇太子奏正月二十七日興慶宫親耕三百餘步既而青光紫氣覆地祥符瑞光見星類哲宗朝神光曲曰惟皇上德伊嘏我王將受厥明載錫之光於昭于天赫赫煌煌緝熙敬止其永無疆神策黃帝神䇿史記冕侯問於鬼臾區對曰黃帝得寶鼎神䇿是嵗己酉朔旦冬至得天之紀終而復始於是黃帝迎日推䇿後率二十嵗復朔旦冬至凡二十推三百八十年黃帝仙登于天漢郊祀志黃帝作寶鼎三象天地人餘同史記數晉灼曰䇿數也迎之也按日月也搜神記舜耕厯山得玉厯於河際之巖舜知天命在己體道不倦河圖天帝以寶文太字賜禹尚書璇璣鈐湯受金符注禹録也周丹書文王疏洛誥注云文王得赤雀武王俯取白魚皆七年中候我應云季秋之月甲子赤雀銜丹書入豐止昌戶再拜稽首受易是類謀云文王受赤雀丹書稱王注戊午蔀二十九年時赤雀銜丹書而命之春秋元命苞曰鳯凰銜丹書於文王之都闕田闕子少闕丹晉志赤烏銜書有周以興漢寶鼎神䇿史記封禪書六月紀元鼎四年得鼎其秋上雍且郊齊人公孫卿曰今年得寶鼎其冬辛巳朔旦冬至與黃帝時等卿有札書曰黃帝得寶鼎冕侯問於鬼臾區對曰黃帝得寶鼎神䇿是嵗己酉朔旦冬至得天之紀終而復始於是黃帝迎日推䇿後率二十嵗復朔日冬至凡二十推三百八十年黃帝仙登于天卿曰漢興復當黃帝之時十一月辛巳朔旦冬至昧爽天子始郊拜泰一其贊饗曰天始以寶鼎神䇿授皇帝朔而又朔終而復始皇帝敬拜見焉漢泰元神䇿闕漢赤伏符紀建武元年夏四月光武先在長安時同舍生疆華自關中奉赤伏符曰劉秀發兵捕不道四夷雲集龍鬬野四七之際火為主羣臣因復奏曰受命之符人應為大萬里合信不議同情周之白魚曷足比焉六月己未即位祝文曰讖記曰卯金修德為天子魏丹書魏志黃初元年十一月柴於繁陽有黃鳥銜丹書集于尚書臺於是改元唐玉版祕記天寶八載方士李渾上言見太白老人告玉版祕記事因是羣臣上帝號于邵有玉版元記頌黃帝封壇受三寸五分之祕䇿夏王觀洛得六十五字之靈文周人獲瑞於丹書漢氏受符於赤伏太中祥符天書元年正月乙丑降于左承天門鴟尾之上啓封乃太中祥符三篇戊辰改元錢惟演上祥符頌二年正月乙丑改浚儀縣為祥符三年九月十一日對輔臣龍圖閣觀宫中迎奉天圖二猶蒼水之感禹夢同金人之翔漢庭育聖符瑞青虹繞神毋生伏羲拾遺記神龍感女登生炎帝長於薑水世紀大電光繞北斗樞星感附寶二十五月生黃帝於壽丘世紀附詩含神霧大電繞樞照郊野感寶生黃帝又沈約宋書大星如虹流下華渚女節意感生白帝朱宣少昊氏峻河圖論文選劉辨命星虹樞電昭聖德之符注李善曰春秋元命苞大星如虹下流華渚女莭意感生朱宣宋均曰少昊氏瑶光貫月正白感女樞生顓頊於若水首戴干戈含神霧慶都感赤龍十四月而生堯於丹陵河圖説記大傳正義案師引河圖云慶都感赤龍而生堯甫堯眉八采足履翼宿舜華封人祝堯使聖人夀皇謐曰堯以甲申嵗生以堯之二十一年甲子生握登感大虹生舜於姚墟詩緯之書緯曰感樞星精李周翰曰舜母感樞星之精生舜無所據修巳吞神珠薏苡生禹世紀流鈎命決曰星貫昴循紀感之生禹鈐蜀紀生於石紐禹首載鈎胸有玉斗扶都見白氣貫月感而以乙日生湯世紀乙殷以生日甲為名堯翼星舜斗星湯虛星文王房星之精感精符注堯赤精舜黃禹白湯黑文王蒼大傳正義含始吞赤珠上刻曰玉英而生劉季含神霧遊於洛池有玉雞銜赤珠刻曰玉英吞此者王含始取而吞之夢神遇大澤之陂本紀王夫人夢日入懷生武帝與曩日所夢日符生於猗蘭殿孝景前元年生昭帝十四月而生立堯毋門太始三年生成帝生甲觀畫堂光武生赤光照室如晝論衡曰光武産於濟陽宫鳯凰集於地嘉禾生於屋甲建平元年十二月子夜生魏文帝生於譙有雲氣青色如車蓋晉元帝以咸寧二年生洛陽有神光之異一室盡明唐太宗生於武功之别館慶雲屬天二龍戲水一云戲於館門之外開皇十八年十二月戊午生肅宗以景雲二年九月三日乙亥生於東宫之别殿祥光照室功成慶善樂太宗繼天誕聖樂德宗始生堂漢明帝玄鳥祚商赤光啓漢鳴社春秋潛潭巴曰里社鳴此里有聖人出繞樞九龍浴聖五緯聨光億舜日萬堯年珠薏玉英烈山神井南頓嘉禾玉斗儲算金篋賜齡樞紐薦符勾芒錫夀繞樞之電照室之光尚想河清之色如聞里社之聲稽貞觀開元之舊章述慶善千秋之令範星虹沓祉電虬發慶玉斗珠衡塗吟野抃席羅圖創璿厯臨翠偽而則道坐玄扈而披圖篤生白水載誕丹陵山稱萬歲雲浮五采發祥流慶舄奕千秋照舂陵之赤光發芒山之紫氣夀於旗翼詩生此文王篤生武王保右命爾濬哲維商長發其祥帝立子生商誕節名始於開元十七年千秋節唐玄宗八月五日天長節同上天成地平節肅宗九月三日天興節代宗十月十三日聖夀節順宗正月十二日慶成節文宗十月十日慶陽節武宗六月十一日夀昌節宣宗六月二十二日延慶節懿宗十一月十四日應天節僖宗五月八日嘉會節昭宗三月二十二日乾和節昭宣帝九月三日大明節梁太祖十月二十一日明聖節末帝九月十二日萬夀節唐莊宗十二月二十二日應聖節明帝九月九日千春節末帝正月二十三日天和節晉髙祖二月二十八日啓聖節少帝六月二十七日聖壽節漢髙祖二月四日嘉慶節隱帝三月九日永壽節周太祖七月二十八日天清節世宗九月二十四日天壽節恭帝八月四日長春節宋朝太祖二月十六日乾明節太宗七月七日壽寧節同上承天節真宗十二月二日乾元節仁宗四月十四日壽聖節英宗正月三日同天節神宗四月十日興龍節哲宗十二月八日天寧節徽宗十月十日乾龍節欽宗四月十三日天申節高宗五月二十一日會慶節孝宗十月二十二日重明節光宗九月四日瑞慶節寧宗十月十九日天基節理宗正月五日乾會節度宗四月九日長寧節章獻明肅后正月八日坤成節宣仁聖烈七月十六日嘉慶節恭聖仁烈五月十六日玉海卷一百九十五
