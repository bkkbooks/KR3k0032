body:
  text: 玉海卷一百九十五宋王應麟撰祥瑞宋符瑞志云夫體睿窮幾含靈獨秀謂之聖人所以能君四海而役萬物使動植之類莫不各得其所自中智以降則萬物之為役者也易曰河出圖洛出書聖人則之符瑞之義大矣天瑞日月少昊日五色尸子少昊邑於窮桑日五色互照田俅子少昊金天氏邑於窮桑天開日五色丕照窮桑禮斗威儀政太平則日五色隋志君乘土而王日五色春秋元命包代殷者姬昌日衣青光堯日月如合璧宋志帝堯在位七十年景星出翼鳯皇在庭日月如合璧五星如連珠朱草生嘉禾秀甘露潤醴泉出厨中自生肉其薄如箑搖動則風生名曰箑脯草夾階而生名曰蓂莢漢日再中曰中有王字志文帝十七年新垣平言候日再中居頃之日郤復中於是更為元年令天下大酺易辨終備日再中烏連嬉仁聖出握知時帝王世紀又望氣經文帝時日中有王字春秋緯君應陽君臣和得道度則日含王字册府元龜文十五年春黃龍見成紀又日中有王字唐鄭錫有賦漢日宣重光兒寬傳元封元年從登封泰山兒寬上壽曰癸亥宗祀日宣重光注李奇曰太平之世日抱重光謂日有重日也符瑞圖曰日外一暈更赤也郊祀歌月穆穆以金波日華耀以宣明漢日月如合璧見太初厯晉日有重暈紀武帝太康元年春正月己丑朔五色氣一作雲冠日是嵗三月吳平元帝日有重暈以為中興之象志建興五年正月日有重暈左右有兩珥陳卓觀臺令曰當有大慶三月而江東改元建武唐日重輪月重輪開元十三年十一月禪社首五色雲見日重輪十八年六月甲申沁州奏月揚光五色張説月重輪頌月之重輪示我金鏡璧采內徹環規外映見十九瑞潘炎日抱戴賦景龍元年四月二十七日皇帝初臨上黨日抱戴表至聖之無二呈繼照於明兩陽光杲耀抱黃道而再中喜氣氤氳戴赤霄而直上月重輪賦八月十有四日夜月重輪金波耀景璧彩揚輝兩耀齊美一人之慶韋展日月如合璧賦珥作如虹之氣波為旁達之華李嶠賀日抱戴表樞紐薦符勾芒錫壽粲玉葉以繁布抱金輪而半出越五馳聲超三表聖臣如雲君並日慶雲抱日賦日者君之德雲者臣之狀彼無私以臨下此竭誠而奉上黃雲捧日賦黃雲抱日輔臣納忠援神契唐日五色開元二十五年十一月青州奏日光五色長慶元年五月饗太廟畢出朱雀門中路日抱珥五色宰臣稱賀貞元十二年進士試日五色賦李程景德日有五色雲景德四年九月壬辰日下有五色雲祥符二年十一月丙寅日上有五色雲八年三月癸卯日有赤黃承戴氣至和二年正月十二日日傍有五色雲淳熙七年正月甲寅輔臣奏前月二十八日日有戴氣太史奏君德至於天為萬民愛戴則有是瑞是日乃便殿議蠲稅之時八年元日朝德壽宫次日太史奏日有戴氣又次日雪韓琦家傳天聖五年初臨軒試進士公名在第二太史奏日下五色雲見左右從官賀殿上祥符日月重輪祥符元年十月辛亥封禪日重輪三年閏二月壬子翰林天文邢中和言正旦至二月終日珥赤黃者十七青赤者九冠氣八承氣六戴氣五日有黃色二五色雲見一背氣三占曰國家有大慶之兆願進賢恤刑治兵經武其間背氣宜謹邊防上嘉之四年二月祠后土月重輪天禧三年十一月己巳月重輪元符二年日重輪製重輪二旗天禧日有戴氣天禧元年三月甲寅日有戴氣文暈連環三年六月己丑日有赤黃冠承戴氣八月丁未日上有五色雲暈珥戴氣十一月己巳齋于太廟日有赤黃珥承戴氣淳化五年十二月戊寅朔日當蝕隂雲蔽之羣臣賀賀日不蝕蓋始於此災不勝德雲為垂隂賀太陽當虧不虧瑞星黃帝景星宋志黃帝有景雲之瑞有赤方氣與青方氣相連赤方之中有兩星青方中有一星凡三星皆黃色以天清明時見於攝提名曰景星符瑞圖景星大星也狀如半月生於晦朔助月為明爾雅四氣和為景星孫氏瑞應圖王者不私人則見摘輔象照景飲醴蓂莢為厯謂景星所照援神契德至八表則景星見堯舜景星中候堯時天下和景星出翼軫册府元龜云出翼宋志同世紀舜景星見房春秋感精符曰堯時文選任彥升曰五老遊河飛星入昴注論語比考讖仲尼曰吾聞帝堯率舜登首山觀於河有五老遊于河渚一老曰河圖將來告帝期二老曰告帝謀三老曰告帝圖四老曰河圖將來告帝符五老曰河圖推龍銜玉繩歌訖五老為流星飛入昴注入昴宿復為星文王五星聚房禮大宗伯疏二十八宿隨天左轉為經五星右旋為緯案元命包云文王之時五星聚房金陵驗異録五星聚有三周將伐殷聚房齊桓將伯聚箕漢高入秦聚東井周漢以王齊以伯春秋元命包殷五星聚房房者蒼神之精周據而興中候文王在豐九州諸侯咸至星聚於房晉中興垂象記武王伐紂五星聚房漢祖入秦亦聚東井所謂先天弗違宋志文王孟春六旬五緯聚房昭理四海又見鳯類漢五星聚東井高紀元年冬十月五星聚于東井沛公至霸上注如淳曰張蒼傳云高祖十月至霸上故以十月為嵗首應劭曰東井秦分野五星所在其下當有聖人以義取天下占見天文志天文志凡五星所聚宿其國王天下從嵗以義從熒惑以禮從填以重從太白以兵從辰以法五星若合是謂易行有德受慶改立王者掩有四方子孫蕃昌漢元年十月五星聚于東井以厯推之從嵗星也此高皇帝受命之符也故客謂張耳曰東井秦地漢王入秦五星從嵗星聚當以義取天下秦王子嬰降以屬吏閉宫封門約法三章民無不歸心可謂能行義矣天之所豫也五年遂定天下即帝位此明嵗星之崇義東井為秦地明效劉向傳漢之入秦五星聚東井得天下之象也張耳傳甘公曰漢王之入關五星聚東井東井秦分也先至必王楚雖強後必屬漢魏高允傳崔浩集諸術士考校漢元以來日月薄蝕五星行度允曰案星傳金水二星常附日而行冬十月日旦在尾箕昏沒於申南而東井方出於寅北二星何因背日而行浩曰果如君語以前三月聚東井非十月也論都賦杜篤聚五星於東井提干將而呵暴秦西都賦仰悟東井之精西京賦五緯相汁旅于東井王命論西入關則五星聚漢德星壽星信星景星郊祀志元封元年武帝封泰山還至甘泉其秋有星孛于東井後十餘日有星孛於三能望氣王朔言後獨見瑱星出如瓜史記作旗星如符瑞圖曰芒豔旗食頃復入有司皆曰陛下建漢家封禪天其報德星云即瑱星也來年冬郊雍五帝還拜祝祠泰一贊饗曰德星昭衍厥維休祥壽星仍出淵耀光明信星昭見皇帝敬拜泰祝之享樂志郊祀歌天門十一星留俞塞隕光照紫幄珠熉黃景星十二景星顯見信星彪列象載昭庭日親以察參侔開闔爰推本紀天文志天暒而見景星者德星也其狀無常出有道之國孟康曰有赤方氣與青方氣相連赤方中有兩黃星青方中有一黃星凡三星合而為景星也填星所居國吉五星同色天下偃兵百姓安寧白虎通景星大星也常見可以夜益於民人也堯在位七十載景星出翼世紀舜景星耀於房文選注河圖龍文曰鎮星光明八方歸德黃帝占云壽星色黃見則人主壽昌漢客星守招搖天文志太初中星孛于招搖星傳曰客星守招搖蠻夷有亂民死君其後漢兵擊大宛斬其王招搖逺夷之分也天官書越之亡熒惑守斗朝鮮之拔星茀于河兵征大宛星茀招搖漢燭星見奎婁志元鳯五年燭星見奎婁間占曰有土功其六年正月築遼東玄菟城二月度遼將軍范明友擊烏桓還漢五星出東方趙充國傳宣帝賜充國進兵璽書曰今五星出東方中國大利蠻夷大敗太白出高用兵深入敢戰者吉弗敢戰者凶將軍急裝因天時誅不義萬下必全勿復有疑魚豢曰五星聚冀方而魏有天下漢四星聚晉四星聚驗異録四星聚者有四漢元始四年四星聚栁張各五日而光武復興於洛晉永嘉六年四星聚牛女而元皇復興於揚土漢初平元年四星聚心又聚箕尾而魏武定兖豫建安二十二年四星聚二十五年魏受禪太元十九年義熙三年四星各一聚劉𥙿有天下晉王廙傳壬申嵗七月四星聚于牽牛元帝紀永嘉中嵗鎮熒惑太白聚牛女之間魏黃星魏志初桓帝時有黃星見楚宋之分殷馗善天文言後五十嵗當有真人起梁沛之間至是凡五十年而太祖破袁紹晉老人星見紀孝武太元二年七月己卯老人星見三年七月乙酉見南方十年七月丁巳老人星見隋志老人一星在弧南一曰南極常以秋分之旦見于丙春分之夕沒于丁見則化平主壽昌漢志有大星曰南極老人見治安常以秋分時候之南郊唐德星舍秦分清臺薛頤傳武德初直秦王府密語曰德星舍秦分王當帝天下表為太史丞貞觀時為道士帝為築觀九嵏山號曰紫府拜太中大夫往居之即祠建清臺候辰次災祥以聞所上與太史李淳風合通鑑貞觀十五年五月己酉星孛太微太史令薛頤上言未可東封丙辰詔罷封禪唐景星開元十八年六月乙酉鄂州奏景星見唐老人星見貞觀十九年十月老人星見開元七年八月老人星見色黃又開元二十四年八月庚戌老人星見太史奏孫氏瑞應圖云王者承天則老人星見臨其國又黃帝占云老人星一名壽星色黃明大則主壽昌天下多賢士陛下以千秋節日祀于星壇而祭期將臨美應先至請付史官熊氏瑞應圖王者承天得理則老人星臨其國春秋分候懸象文曜鈎云王者安靜則老人星見常以秋分候之郤昻老人星賦書玉諜以垂範紀緗圖而播分節長春而隱見當丙丁而的皪秋分之旦見乎丙春分之夕入乎丁配神山之呼萬嵗符聽水之兆千齡晃如金粟粲若銀燭其光如丹其大如李稽元命之攸述按星經之所紀見則化平主昌明則天下多士獻仙壽兮祝堯奏昌言兮拜禹表澄霞助月非唯石氏之占散翼垂芒何獨斗樞之説玉管凝商珠躔麗極皓氣肅于西成祥輝麗于南極嵩極萬壽之呼河圖五老之告曰皓氣凝于商中騂芒射于弧外唐五星聚會要天寶九年五星聚尾箕大厯三年七月五星聚于東井九月四星聚井唐嵗星居心文粹權德輿嵗星居心頌皇上六祀春三月司天奏嵗星居心宿五度其色黃詔頒示中外頌曰敷祐四方發為天祥重華煌煌乃居明堂乾德壽星乾德三年八月辛酉四年八月乙卯六年正月戊申開寶二年七月乙亥壽星出於丙薦人君之壽既稽元命之圖表天下之安又載西京之志乾德五星聚奎景德五星聚東井實録初顯德中竇儼楊徽之盧多遜同在諫垣儼曰丁卯嵗五星聚奎自此天下太平矣乾德五年丁卯三月五日丙辰一云辛亥紀云是月無甲子五星如連珠聚于奎當魯分從鎮星晨見東方占曰有德受慶大人奄有四方子孫蕃昌從鎮星王者以重致天下重福也自是四方平定明年戊辰十二月庚戌真宗降誕在魯分時太宗鎮兖海一云在降婁之次建隆元年藝祖受禪五星聚于奎鎮星主之奎主文章識者以為大平之符乾德五年又聚奎當考雍煕端拱二年亦有連珠之瑞見後景德四年五星聚東井一云聚而伏于鶉火慶雲見六月庚申知密院王欽若奉表賀詔付史館志不載天文志景德四年七月五星當聚鶉火既而近太陽同時伏占曰猶臣避君之明開寶景星見四年八月辛卯景星見太平興國壽星見一云老人星四年八月乙亥五年八月己卯六年八月己卯八年八月辛卯雍煕三年八月己酉四年八月辛亥二十日夜端拱元年八月己卯朔二年八月癸亥淳化元年八月丁卯二年八月辛未一作癸酉三年八月戊寅四年八月辛巳九月己亥五年八月己丑至道元年八月己亥二年閏七月己亥一云八月己亥朔見丙地雍熙五星如連珠雍熙二年十月辛丑端拱二年五月雍熙二年正月壬戌有星出東井其大倍於金星至輿鬼