body:
  text: 玉海卷一百十七宋王應麟撰選舉銓選王者各有所貴堯舜貴道徳夏貴功商貴老周貴同姓秦貴法吏西漢貴才謀東漢貴經術魏貴文章晉貴名理周隋貴氏族觀其所貴知治體之優劣然最無謂者其氏族乎周司士漢選部魏九品官人法見科舉夏官司士下大夫二人中士六人下士十有二人掌羣臣之版版名籍故書版為班以徳詔爵以功詔禄以能詔事以久奠食王制曰司馬辨論官材論進士之賢者以告于王而定其論論定然後官之任官然後爵之位定然後禄之凡邦國三嵗稽士任而進退其爵禄通典鄉大夫鄉老舉賢能而賔其禮司徒教三物而興諸學司馬辨官材以定其論太宰詔廢置而持其柄内史贊予奪而貳於中司士掌其版而知其數擇材取士如此之詳也天官太宰當為尚書令非吏部之任今吏部之始宜出於夏官之司士云漢成帝建始四年初置尚書有常侍曹主公卿事又有二千石曹掌郡國二千石後漢改為吏曹主選舉祠祀東漢初置選職尚書令總之後又為選部靈帝以梁鵠為選部尚書董卓以周毖為吏部尚書魏改選部為吏部主選事陳羣延康元年始建九品官人之法拜吏部尚書毛玠亦為之崔琰及玠為丞相椽典選舉俾趙戬為尚書選部郎許靖除尚書郎典選舉文帝䕶軍將軍主武官選吳有選曹尚書裴子野曰周禮始於學校論之州里告諸六事而後貢于王庭其在漢家州郡積其功能然後為五府所辟五府舉其掾屬而升於朝三公參其得失尚書奏之天子一人之身所閲者衆一賢之進其課也詳故官得其才魏晉易是所失弘多萬品千羣俄折於一面庶僚百位専斷於一司吏曹按閥閲而選舉不遑訪採於鄉邑江總表曰漢置五曹魏隆八凱漢郡國選舉又見前龔勝傳為司直郡國皆謹選舉後傳馮嚴上疏曰故事州郡所舉上奏司直察能否以懲虚實郎顗言今選舉皆歸有司非有周召之才而當則哲之重不如還屬尚書宦者傳陳蕃為光祿勳與五官中郎將黄琬共典選舉上疏曰陛下宜擇從忠善尺一選舉委尚書三公吕强上疏曰舊典選舉委任三府三府有選參議掾屬咨其行狀度其器能若無可察然後付之尚書今但任尚書或復敕用梁沈約上疏曰漢代無士庶之别學優而仕始自鄉邑本於小吏幹佐方至文學功曹積以嵗月乃得察舉人才秀異始為公府所辟遷為牧守入作台司漢之得人於斯為盛唐薛謙光上疏曰漢法所舉之主終身保任揚雄之坐田儀責其冒薦成子之居魏相酬於得賢韋嗣立上疏曰古者取人先采鄉曲之譽然後辟於州郡州郡有聲然後辟於五府才著五府然後升之天朝用一人所擇者甚悉擢一士所歴者甚深陸贄上疏曰周命伯煚慎簡乃僚漢求多士不惟公府辟召而已又有父任兄任皆得為郎魏晉以後暨於國初采擇庶官多由選部惟髙位重職考庶官之有成者請而命焉晉山濤為吏部尚書中外員品多所啓授宋以蔡廣為尚書徐羨之云黄散已下悉以委之廣猶以為失職宋書云選案黄紙録尚書與吏部尚書名故廣云書紙尾匡衡傳隨牒在逺方注師古曰隨選補之常牒不被超擢者何武傳欲除吏先為科例以防請託王制注命於天子者天子選用之如今詔書除吏矣晉山公啓事山濤傳泰始間通鑑在十年濤為吏部尚書典選十餘年每一官缺輒擇才資可為者啓擬數人得詔㫖有所向然後顯奏甄拔人物各為題目時稱山公啓事子簡領吏部欲令朝臣各舉所知以廣得才之路史臣曰恵絶臣名恩馳天口世稱山公啓事者豈斯之謂與通典濤用人皆先密啓然後公奏舉無失才凡所題目終始如其言惟用陸亮尋以賄敗陸贄曰晉山濤為吏部尚書中外品員多所啓授隋志總集類山公啓事三卷别集類山濤集九卷梁五卷又一本十卷齊裴聿注唐志山濤啓事十卷唐會要王方慶上疏曰山濤啓事稱皇太子而不言名山公啓事法帖有之云侍中尚書僕射奉車都尉新沓伯臣濤言臣近啓崔諒史曜陳淮可補吏部郎詔書可爾此三人皆衆可稱諒尤質止少華可以崇教雖大化未可倉卒風尚所勸為益者多臣以為宜先用諒謹隨事以聞文選注引山濤啓事曰保傅不可不高天子之選又引賈弼之山公表注蜀志注世説注引啓事尋啓事曰臣欲以郗詵為温令詔可义啓有異同之議請更選之傅咸正始中任何晏以選舉内外衆職各得其才王戎户調門選晉選例梁選簿選品元魏停年格晉傳李胤為吏部刋定選例而著令李重著選曹箴王戎領吏部始為甲午制凡選舉皆先治百姓然後授用沈約曰東西兩漢左雄孤絶於前南北二晉山濤莫嗣於後宋時吏部尚書領吏部刪定三公比部四曹謝莊上表孝武曰提鈞懸衡委之選部一人之鑒易限天下之才難源請大臣各舉所知付尚書銓用不從大明二年六月戊寅分吏部尚書置二人以散其權莊及顧覬之補選職省五兵後還置一尚書齊和帝時梁武帝表曰前代選官皆立選簿貫魚有次臧否素定自今選曹宜立簿使冠屨無爽名實不違天監中徐勉為尚書定百官九品為十八班七年正月定官品又撰選品三卷唐志職官類徐勉梁選簿三卷謝覽三世居選部謝莊再典選至舉又三為此職隋志梁勲選格一卷後魏吏部統吏部考功主爵三曹孝明時神龜二年尚書崔亮為停年格不問賢愚以停解日月為斷劉景安與書曰殷周以鄉塾貢士兩漢由州郡薦才魏晉因循又置中正朝廷察孝㢘惟論章句不及治道立中正不考才行空辨姓氏宜改張易調反為停年格以限之誰復修厲名行哉後甄琛等踵行之魏之失才自亮始太和十六年七月壬戌詔選舉每以季月本曹與吏部銓簡薛淑上言選曹惟取年勞不問賢否義均行鴈次若貫魚勘簿呼名一吏足矣數人而用何謂銓衡請令王公薦賢依漢立四科不從東魏元象元年一云二年乃革崔亮年勞之制務求才實一云髙澄攝尚書始改年勞之制衡鏡之美辛術一人而已齊王儉曰選曹之始近自漢末今若反古使州郡貢計王府辟士與衆共之猶賢一人之意隋制尚書舉其大者侍郎銓其小者五品以上中書門下擇之六品以下選部奏而授之一命以上州郡無復辟置通典以為執政參吏部之職吏部總州郡之權機牛弘為尚書選舉先徳行後文才侍郎髙孝基鑒賞寤弘推心委任隋之選舉於斯為最唐三銓選格四事十銓宏詞拔萃又武選小選選舉志唐制凡選有文武文選吏部主之武選兵部主之皆為三銓尚書侍郎分主之每嵗頒格于州縣選人應格則本屬或故任取選解列其罷免善惡之狀以十月㑹于省過其時者不叙凡擇人之法有四一曰身體貌豐偉二曰言言辭辨正三曰書楷法遒美四曰判文理優長四事可取則先徳行行均以才才均以勞六典吏部以三銓分其選曰尚書銓中銓東銓以四事擇其才曰身言書判以三類觀其異曰徳行才用勞効官志吏部掌文選以三銓之法官天下之才以身言書判徳行才用勞効較其優劣而定其留放為之注擬㑹要云三年一大集六年一小集尚書曰尚書銓侍郎二人分為東銓中銓六典通典同國通鑑尚書曰中銓侍郎曰東西銓天寶十一載楊忠兼文部尚書密定員闕於都堂注唱於是門下過官三銓注官之制皆廢侍郎惟試判而已太和四年七月吏部奏舊以尚書㕔之次為中銓其次為東銓乾元中侍郎崔器奏改中銓為西銓以久次居左新除居右議者非其倒置請以久次居西銓新除居東銓奏可草權徳輿吏部員外郎南曹壁記漢尚書郎主文書起之任東漢方冠以曹名用諸曹功次超卓者轉遷選部融劉禹錫云是曹在南宫為眉目在選士為司命崔議曰東西兩曹兩部分簡謂吏兵部五品以上不試上名中書門下六品以下始集而試觀其書判已試而銓察其身言已銓而注詢其便利已注而唱不厭者得反通其辭三唱而不厭聴冬集故事必三銓三注三唱而後擬官季春始畢乃過門下省厭者為甲上於僕射乃上門下省給事中讀之黄門侍郎省之侍中審之然後以聞主者受㫖而奉行焉謂之奏受視品及流外則判補皆給以符謂之告身選未滿而試文三篇謂之宏詞試判三條謂之拔萃中者即授官明皇時開元十三年宇文融建議置十銓以選限漸迫蘇頲等主之十二月甲戌以蘇頲韋㧖盧從愿徐堅宇文融崔琳沔韋虚心賈曾王丘等十人主之左庶子吳兢諫謂萬乘之君下行選事帝悟遂止復以三銓還有司通典云明年復故舊制尚書掌六品七品選侍郎掌八品九品選景雲元年宋璟為尚書始通其員品而分典之遂以為常蘇氏駁之以為貞觀二十二年侍郎盧承慶曰五品選事職在尚書郎尚書兼知五品選事明矣武選凡納課品子嵗取文武六品以下勳官三品以下五品以上子年十八以上每州解上兵部量文武授散官凡一嵗為一選自一選至十二選視官品髙下以定其數因功過而增損之六典兵部掌武選以三銓領其事五等閲其人長垜馬射馬槍步射應對三竒拔其異驍勇材藝可為統領尚姚崇三為宰相常兼兵部不景雲元年宋璟為吏部書李乂盧從愿為侍郎皆畏强禦請謁路絶集者萬餘人留者三銓不過二千人服其公姚元之為兵部尚書陸象先盧懐慎為侍郎武選亦治一張九齡用嚴挺之知吏部選陸景融知兵部選皆為時精選韓熀以給事中知兵部崔琯判兵部西銓狀張嘉貞為兵部員外郎功盈几廷無稽牒凡流外兵部禮部舉人郎官得自主之謂之小選六典吏部郎中一人掌小選凡未入仕而吏京司者復分為九品應選之人以其未入九流謂之流外銓亦謂小銓其校試銓注與流内銓畧同凡擇流外職有三曰書計時務開元二十五年敕留放皆尚書侍郎定之通典自貞觀以前尚書掌五品選事開元以來宰臣多兼領兵吏尚書不自銓綜其選試之任皆侍郎専之齊抗傳初吏部嵗考書言以他官第上下中書門下遣官審實抗以尚書侍郎皆大臣選今更覈非任人勿疑之道奏罷之貞元二十年三月抗上言明年遂不置考判官武后時敇吏部糊名考判惟劉憲王適司馬鍠梁載言入第二等開元十五年九月敇依例糊名試判上元元年劉嶢言國家以吏部為銓衡侍郎為藻鏡開元四年六月十九日敇始詔郎御史起居遺補不擬舊制六品以下官尚書奏擬至是始更此制陸贄曰國朝之制庶官五品以上制敇命之六品以下則並㫖授制命者官臣奏可㫖授者吏部銓才志唐天成中詔三銓合為一後復分為三唐取人著令志唐取人之路多矣方其盛時著於令者納課品子萬人諸館及州縣學六萬三千七十人太史厯生三十六人天文生百五十人太醫生二百十一人太卜卜筮三十人千牛備身八十人備身左右二百五十六人進馬十六人齋郎八百六十二人諸衛三衛監門直長三萬九千四百六十二人諸屯主副千九百八人折衝府府史一千七百八十二人校尉三千五百六十四人執杖執乘每府三十二人親事帳内萬人集賢院御書手百人史館典書楷書四十一人尚藥童三十人諸臺省寺監軍衛坊府之胥吏六千餘人凡此皆入官之門户而諸司主祿已成官及州縣佐史未叙者不在焉㑹要顯慶二年劉祥道上疏曰每年入流數過千四百人永徽五年一千四百三十人六年一千十八人顯慶元年一千四百五十人今内外文武官一品以下九品以上一萬三千四百六十五員蘇氏議曰今官數比天寶中三分減一入流之人三分加一士子二年守官十年待選開耀元年四月以選人多集議崔融欲負譴者限年收其𣏌梓搴其蕭稂通典按格令内外官萬八千八十五員而合入官者自諸館學生以降凡十二萬餘員大率八九人争官一員劉秩曰官倍於古士十於官求官者又十於士故士無官官乏祿吏擾人唐長名榜姓厯狀様銓厯甲厯四時注擬選譜志唐初銓法簡而任重髙宗總章二年㑹要四月一日司列少常伯裴行儉始設長名榜引銓注法復定州縣為八等其三京五府都督都䕶府悉有差次量官資授之其後十一月李敬玄為少常伯委事於員外郎張仁褘仁褘又造姓厯改狀様銓厯等程式而銓總之法密矣敬玄因其法衡綜有序於楊國忠建罷長名銓日即定留放憲宗時楊於陵為侍郎請修甲厯南曹置别簿相檢實吏不能為奸始奏選者納直給符告居四年凡調三千員志貞觀二年侍郎劉林甫言隋制以十一月為選始至春乃畢今選者衆請四時注擬林甫傳隋制十一月選集日薄事叢建請四時㕔選隨到輒擬官無滯人十九年十一月尚書馬周以四時選為勞乃復以十一月一日選至三月三十日畢㑹要按韋述唐書貞觀八年唐皎為侍郎請以冬初大集季春而畢又云馬周未知孰是新史唐皎傳同陸贄傳唐制吏部選以嵗集乾元後兵興率三年一調吏員稽壅案牒叢淆偽冒蒙真吏緣為姦士或十年不得官員闕亦累嵗不補貞元八年春贄為相請以内外員三分之計闕集人天下便之㑹要云䞇令吏部每年集五代史唐制嵗集以孟冬而選盡季春之月裴行儉傳譔選譜草字雜體數萬言志裴行儉選譜十卷職官類唐循資格志初吏部求人不以資考為限所奬拔惟其才往往得俊乂開元十八年四月十一日侍中裴光庭兼吏部尚書始作循資格傳云因行儉長名榜為之而賢愚一槩必與格合乃得銓授限年躡級不得踰越二十年正月二十二日光庭又奏促選限盡正月於是久滯不收者皆便之謂之聖書宋璟争之不從及光庭卒㑹要二十一年中書令蕭嵩以為非求才之方奏罷之張九齡傳上言廢循資格二十二年九齡為中書令上言廢之乃下詔二十一年六月二十八日曰凡人年三十而出身四十乃得從事更造格以分寸為差若循新格六十未離一尉自今選人才業優異有操行及逺郡下寮名迹稍著者吏部隨才甄擢之蕭嵩奏凖舊例至三月三十日圍甲畢藝文志唐循資格一卷崇文目同天寶中修定王涯唐循資格五卷崇文目一卷王涯修定陸贄奏議開元中吏部奏置循資格限自起居遺補及御史等官猶並列於選曹銓綜之例著在格令至今不刋資格之法起於崔亮復行於裴光庭是二子者當世固已非之然而行之不過數十年今踵為常法世世舉行王徽為尚書時銓選失序吏肆為奸補調重複徽為手籍以檢實遂無奸滯開元三年張九齡言吏部精案牘而忽人才所謂遺劍中流刻舟以記唐選舉志吏部甲令藝文志沈既濟選舉志十卷中興書目三卷大厯中撰沈既濟以前代史官於選舉闕而不論乃為志四篇述吏部銓授欲復州郡辟召之制今存三篇第四篇亡第三篇有闕文崇文目十卷志自中葉兵興天下多故官員益濫銓法敝壊徳宗時大厯十四年八月試協律郎沈既濟言其弊上選舉議曰古今選用之法九流常叙三科而已曰徳曰才曰勞今吏部甲令雖曰度徳居位量才授職計勞升叙然考校之法皆在書判簿厯言辭俯仰之間安行徐言非徳也空文善書非才也累資積考非勞也前代選用皆州府察舉齊隋署置多由請託議者以為與其率私不若自舉與其外濫不若内收是以罷州府之權而歸吏部此矯世懲弊之權法非經國不刋之常典臣請五品以上及羣司長官宰臣進叙吏兵部參議焉六品以下或僚佐之屬聴州府辟用則銓擇之任委於四方結奏之成歸於二部必先擇牧守然後授其權或選用非公則吏兵部得察而舉之小加譴黜大正典刑責成授任誰敢不勉州郡察舉在兩漢則理在魏齊則亂吏部選集在神龍景龍則紊在開元天寶則理云云天子嘉其言重於改作不能用貞觀元年太宗謂杜如晦曰今以言辭刀筆取人而不悉其行乃欲放古今諸州辟召㑹功臣行世封乃止它日謂侍臣曰吾將使人自舉可乎魏徵以為長澆競又止垂拱元年七月侍郎魏玄同言伯煚為大僕正慎簡乃僚太史内史並掌爵祿廢置司徒司馬别掌興賢是分命羣司而統以數職漢諸侯自置吏四百石以下州郡掾吏督郵從事悉任之牧守由魏晉以後始歸吏部以迄於今以刀筆量才簿書察行願少遵周漢之規以分吏部選不納陸贄請臺省長官薦屬吏曰尊者領其要卑者任其詳人主擇輔臣輔臣擇庶長庶長擇佐僚論進瓜果人擬官狀命秩之載甲令者有職事官散官勳官爵號唐東選南選志太宗時以嵗旱穀貴東人選者集於洛州謂之東選一本云貞觀元年髙宗上元三年以嶺南五管黔中都督府得即任土人而官或非其才乃遣郎官御史為選補使謂之南選一本八月壬寅其後江南淮南福建因嵗水旱皆遣選補使即選其人而廢置不常選法又不著㑹要貞觀元年京師米貴始分於洛州置選開元元年十二月以魏知古盧懐慎分知東都選太和三年四月停開元八年八月二十五日移嶺南選補使於桂州通鑑云開元元年大厯十四年十二月敇南選掌以郎官不復以御史監臨興元元年侍郎劉滋知洪州南選元和二年八月王絜充選補使御史崔元方監焉大和三年二月權停嶺南選補通鑑儀鳳元年敕桂廣交黔等都督府注擬未精自今每四年遣五品已上官充使令御史同注擬人謂之南選蘇晉齊澣更典二都選桞澤開元中殿中侍御史監嶺南選徐浩為嶺南選補使又領東都選張九齡以桂州兼嶺南選補使仲子陵典黔南選補唐選院蘇晉傳榜選院曰門下㸃頭者更擬開元十八年為侍郎六典吏部員外郎掌選院謂之南曹開元十二年初定員外郎専判南曹注其曹在選曹之南也㑹要開元二十年八月以考功貢院地置吏部南院以懸選人文榜或謂之選院長安志選院在尚書省之南亦曰吏部南院選人看榜之所也選院本銓曹之内至是移出之東都至二十二年七月以太常園置之故事嵗揭版南院為選式選者自通一辭不如式輒不得調有十年不官者吏部銓常三銓三注三唱自春止夏乃訖楊國忠使吏預定其員集百官尚書省注唱一日畢唐選格舊紀開成二年四月丁夘宰相李石奏定長定選格六月庚子吏部奏長定選格請加置南曹郎中一人别置印一面以新置南曹之印為文從之三年二月庚子吏部奏去年所修選格或乖往例不可久行請用舊格從之㑹要貞元九年正月中丞韋正伯奏按選格銓狀自書試日書跡不同即駁放殿選開成三年五月准長定選格加置南曹郎一人六月别置印陸贄奏議國朝之制庶官五品以上制敕命之六品已下則並㫖授制敇所命者宰相商議奏可而除拜之也㫖授者吏部銓才上言詔㫖畫聞從之而不可否者也漢制部刺史秩六百石郡守二千石刺史髙第即遷為郡守郡守髙第入為九卿從九卿遷為亞相相國是乃從六百石吏至台輔所歴三四轉耳近代建官甚多列級逾密今縣邑有七等之異州府有九等之差同謂省郎即有前中後行郎中員外五等之殊並稱諫官則有諫議大夫補闕拾遺三等之别洎諸臺寺率類於斯遣戍嵗増䇿勳日廣財賦不足供賜而職官之賞興職員不足容功而散試之號行通典按兵部格破敵戰功各有差等其授官千纔一二唐舉選衡鏡用人權衡審官六議㑹要貞元十二年賀蘭正元進用人權衡十卷志雜家十三年十一月昭義判官舉選衡鏡三卷志作衡鑑職官類先是顯慶中劉祥道典選陳六事貞元十一年二月門下侍郎平章事趙憬進審官六議議相臣庶官京司闕官考課遺滯藩府官屬憬嘗對延英開陳大體以任賢尚徳為本唐典選有聲者前有裴馬行儉載後有盧李從愿朝隠貞觀初杜淹采訪七十餘人並聞嘉聲髙季輔之清鑒賜金背鏡李乂之不受私謁李下無蹊宋璟之平允髙儉之鑒裁韋陟公平楊綰精允姜晦精明劉竒舉賢無私李敬玄衡綜有序席豫拔寒逺士崔郾黜陟必當鄭杲得韓元二子以為不負朝廷崔琳收盧裴等十數人皆入臺省李固言收寒素柅吏奸貞觀二年杜如晦侍中攝吏部尚書四年民部尚書戴胄兼唐吏部校辭判通典顯慶初黄門侍郎劉祥道奏雜色入流人試判簡為四等一付吏部二付兵部三付主爵四付司勳志有司以僻書隠學為判目初試選人皆糊名令學士考判武后以非委任之方罷之開元十五年九月復糊名試判考等第奏聞糊名校判侍郎蘇晉獨事賞拔當時譽之苗晉卿傳承平選常萬人嵗命它官同校書判覈才實天寶二載㑹要云元年冬選判入等凡六十四人分甲乙丙三科張奭第一御史中丞倚子也正月二十一日帝御花萼樓覆實㑹要云勤政樓下重試中裁十一二㑹要天寶九載三月十三日敕文學政事異科良宰豈必文人自今簡縣令勿限以書判及循資格楊於陵傳初吏部程判别詔官參考貞元二十年齊抗當國罷之至是尚書鄭餘慶移疾乃循舊制元和中於陵言他官第判能否不知限員有司計員為留遣之格事不相謀不如勿置乃詔三考官止較科目選至常調悉還吏部藝文志别集張文成龍筋鳳髓十卷崔鋭判一卷大厯人鄭寛百道判一卷元和拔萃駱賔王百道判集一卷書目龍筋鳳髓判十卷張鷟撰雜抄唐人判語分門為類張鷟四參選判䇿為銓府最嚴挺之為吏部侍郎施特榻試崔渙彝樽銘時入判者千餘裴垍為考功員外郎吏部侍郎鄭珣瑜委垍校辭判研覈精密李鄘孔戢書判髙等顔杲卿春卿曜卿書判超等于邵書判超絶拔萃齊澣裴寛鄭珣瑜畢諴盧鈞李珏異等崔珙盧邁李巽顧少連韋溫白居易鄭肅鄭亞李商隠平判異等崔弘禮判入等元􅍬博學宏詞陸贄齊映崔元翰劉禹錫栁宗元裴度之獨孤授舉博學宏詞吏部考當乙于邵覆置甲科人咨其公又韓愈二試于吏部一既得之黜于中書唐令長科㑹要貞元四年正月命常參官舉清白政術任刺史縣令者朕當親自策試元和二年正月敇江淮大縣每嵗據闕委省臺諸司長官節度觀察使各舉堪任縣令不限選數赴集臺省官及刺史赤令闕先於縣令中簡擇能否與舉人同賞罰三年四月敕吏部精加考覈四時注擬四年正月中書門下請中外舉縣令並隨表狀十月三日到省依平選人分入三銓注擬停四時集六年十月又奏周之羣僚委於冢宰漢之多士辟於有司陛下念黎元之困設令長之科羣僚舉知天下蒙福然薦延相繼崇勸未行請所舉縣令到任後有刑罰寃濫及贓犯者其舉薦官削階停任書下考令長以資授多才不稱官故令庶僚薦舉所知長慶元年五月停舉縣令大中元年敇貞元中頻詔縣令五考方改移近者諸州縣令或得三考兩府畿赤罕及二年今後刺史縣令滿三十六月方替替後量課績作三等聞奏貞觀十一年八月太宗謂侍臣曰刺史朕當自簡縣令詔京官五品以上各舉一人開元二十九年正月十五日令百官於親屬之中舉牧宰制曰祁奚舉午謝安舉玄寧限嫌疑建隆循資格建隆三年八月乙未知制誥髙錫請注授法官職官試書法十條以代試判九月癸未復置書判拔萃科十月癸巳有司上新刪定循資格長定格編敕格各一卷曾鞏曰建隆初定考判之制著循資之格乾徳二年正月甲申詔流内銓聴四時參選不俟冬集仍命陶榖等重詳定循資格及四時參選條二月戊申朔竇儀等上新定四時參選條七月庚寅中書詳定上之行少尹幕職官循資格銓選漸有倫矣甲午詔吏部奏擢選人開寶六年七月己未志在嵗末命參政盧多遜知制誥扈蒙張澹參詳長定循資格取悠久可用之文為長定格三卷塗注一二十條總二百八十七事循資格一卷制敕一卷起請條一卷書成上之書目有之頒為永式自是銓選益有倫矣太平興國二年十二月詔選人試判定為四等景徳元年八月詔流内銓選人以所試書判備親覽乾徳詔書紹興三年二月丁亥朔兼吏部尚書席益言魏晉而下甄别人物専任選曹至唐而銓法密矣然不盡拘以微文激濁揚清時出度外杜淹表薦四十餘人後多知名韋思謙坐公事負殿髙季輔遽擢為監察國初猶存舊制乾徳四年七月癸酉詔曰自今常調集選人吏部南曹取歴任中多課績而無闕失其人才可擢者具名送中書引驗加奬是尚或任人不専任法也其後官制釐改典選者一切不得以意從事振拔幽滯無復聞焉望稽用乾徳詔書凡常調中材行可取者許長貳具名以聞從之乾徳二年七月詔吏部南曹以人才可副升擢者送中書門下引驗以聞上慮銓衡止憑資歴英俊或沈於下僚故也四年七月癸酉令吏部南曹引驗選人可升擢者具名聞奏對見雍熙三班院淳化審官院考課院見院類國初張昭為尚書領選京官七品以下猶屬銓筦昭致仕始用它官權判雍熙四年七月庚辰置三班院供奉官殿直承㫖為三班以崇儀副使蔚進掌之先是小使臣隸宣徽院至是别置興國六年二月始命楊守素等㸃檢三班公事權以内密省使聴事為局嘉祐八年正月徙三班院于文思院之西淳化三年十月戊寅始置京朝幕職州縣官考課院四年二月丙戌以考校京朝官為審官院幕職州縣官為考課院五月以考課院歸流内銓志三班院文臣以兩制以上武臣以諸司使以上掌之元豐五年改侍郎右選國史志審官院編敕十五卷銓曹格敕十四卷慶厯定任子令慶厯三年十一月丁亥更䕃補法詔曰周大司樂掌學政以六藝教羣國子漢光祿勳典仕籍以四行察三署郎今䕃法之所原古典刑之是憲敝生作法之涼濫起推恩之過上因朝廷法制之不立下自父兄訓義之不孚故俾宰臣詳為定令冢嗣先録以篤為後之體支子限年以明入官之重設考藝之格立保行之條庶乎位有稱職之才朝多濟世之美非惟為國造士是乃為臣立家用范仲淹所上十事二曰抑僥倖也十月壬戌定遷秩格十一月癸未定館職格紹興初中書舍人趙思誠上任子限員之議淳熙九年八月庚子始用廷臣集議行之以品秩崇卑立為定數十年二月辛丑又從集議致仕遺表恩三分減一唐制禮部簡試太廟郊社齋郎兵部簡試千牛備身太子千牛葢文武䕃補之制乾徳元年六月初定任子之法臺省六品諸司五品必嘗登朝歴兩任然後得請淳化改元恩霈奏薦始廣至道二年始有夀寧節推恩之令祥符元年東封推恩則郊禋奏薦自此為例嘉祐元年罷聖節奏薦熙寧裁定而限員之法立淳熙九年八月始立止數嘉祐定補䕃選舉法紀嘉祐元年四月丙辰裁定補䕃選舉之法志龍圖直學士李柬之建請更定選舉補䕃之法知諫院范鎮請云云侍御史母湜請云云下兩制議翰林承㫖孫抃等言今二府及使相宣徽節度使三年䕃二人已減舊恩之半餘文武請一嵗及三嵗當任子者皆倍之内臣毋得過二人嬪御皇族約此為法罷南省特奏名百司入流者如吏部格弗聴減半或換武遂敕中書樞密院裁定詔見任二府使相宣徽節度御史知雜悉罷乾元節恩䕃云云取士以皇祐四年進士限四百人諸科毋得過其數罷特奏名治平銓曹格式元豐備選具員慶厯四年二月丁巳命天章侍講臣公亮刪定審官院流内銓條貫至和二年十二月又令編修皇祐三年後裁改者嘉祐元年九月辛夘制以審官院選格頗繁密令别行裁定務從寛簡治平三年五月壬申進銓曹格式十四卷吏部流内銓進詔行之熙寧五年閏七月詔吏部南曹併入流内銓從許將請三年二月七日命楊全編修條例先是判銓陳襄請取銓曹所用例去其不可行者編為䇿本治平元年四月知審官院王珪新編院敕十五卷詔行之元豐二年十一月十二日知審官東院陳襄請重定敕令式三年八月七日改流内銓為尚書吏部六年八月九日吏部尚書李清臣編集承務郎已上鄉貫出身歴行功過為備選具員凡十冊詔録上中書省元祐元年六月十四日詔吏部重修簡要選法以聞元豐四選舊制以審官東西院流内銓三班院分治四選復於尚書都省置司封司勳考功南曹官元豐五年五月名實始正吏部分選有四文臣自朝議大夫大理正以下非敕授者歸尚書左選武臣自皇城使以下非宣授者歸尚書右選自初仕至幕職歸侍郎左選自監當至供奉官歸侍郎右選蘇頌傳唐制吏部主文選兵部主武選神宗謂三代兩漢無文武之别頌言唐有三銓分品秩而掌選事今欲文武一歸吏部宜分左右曹以品秩分治四年七月戊申命頌同詳定官制仍權吏部事於是吏部有四選之法元祐元年二月壬午尚書省上吏部四選敕命格式頒行先是熙寧五年三月戊戌立文武換官法閏七月詔吏部南曹併入流内銓三年十一月甲子李常言四選官共三萬四千餘人入流名品幾七八十数至道二年四月定任子出官制先是五品以上子孫每覃慶中書皆授攝官未幾即補正員上以其太濫詔任子止賜同學究出身依例赴選集咸平四年二月壬戌令奏補京官及出身者試讀一經熙寧四年十月立選人及任子試出官法以二月八日試斷案律義時議紹興十三年九月詔兼試經賦律義惟同進士出身人試律紹興元年八月司業計衡奏中選者吏部簾試試中然後許參選明年四月從之宗室銓試自乾道八年始三班使臣試兵書自熙寧三年十二月戊辰雷珣始試六韜孫吳三家義十道及弓馬五年八月十七日都承㫖曾孝寛詳定武臣試格元豐元年十二月癸亥立武臣試藝業法元豐二年六月十五日命知制誥張璪光祿丞陸佃於祕閣考試宗室元豐吏部敕令式書目元豐新修吏部敕令式十五卷四年檢正吏房曾伉撰凡三百十三條又元豐新修吏部式三卷紹興重修吏部敕令格式并通用格式一百二卷紹興三年朱勝非等撰建炎四年臣僚請下省部諸司省記條例類奏讀詔以廣東運司所上元豐元祐吏部條法與七司省記元豐崇寧看詳政和重修格式等參酌修定紹興參附吏部敕令格式七十卷三十年陳康伯等撰先是賀允中等請以舊制續降參訂異同修為定制黄祖舜又請以舊七司條法與今事體不同者立為參附條參照漢世諸侯自得置吏四百石以下其傅相大官則漢置之郡吏督郵從事悉任之於牧守魏晉而降始歸吏部所以尊王朝而削郡國之權也紹興編七司例冊紹興四年八月庚辰詔吏部編七司例冊胡交修言以例決事吏部最多乞將敕劄批狀指揮可為例者編為冊以俟檢閲從之二十六年九月戊辰中丞湯鵬舉請明詔吏刑部條具合用之例修入見行之法以為中興成憲從之後四年乃成三十二年四月甲戌侍郎凌景夏請吏部七司置例冊淳熙元年十二月修七司法紹興三十二年四月癸巳上謂大臣曰朕有一人才簿每臨朝臣下有薦揚人才者退朝則記姓名於簿遇有選用搜而尋之無不適當紹興七司通用法紹興十年十二月乙未兵部侍郎張宗元請命有司以續降朝㫖便人合理者裒為一書以進許之後九年乃成十九年六月戊午上吏部續降七司通用法四百二十五卷隆興武選薦舉格隆興元年正月一日三省密院奏奉詔武選拔擢之路未廣其令觀察使以上各舉所知三人詳議立格以聞今立薦舉格式謀畧沈雄可任大計寛猛適宜可使御衆臨陣驍勇可鼓士氣威信有聞可守邊郡思智精巧可治器械五等令曾立軍功觀察使以上薦舉通習典章可掌朝儀練達民事可任郡寄諳曉財計可裕民力持身㢘潔可律貪鄙詞辯不屈可備奉使五等令非軍功觀察使以上薦舉於密院置籍録用立功則賞舉官敗事則加罰不許舉宰執管軍及内侍親戚玉海卷一百十七
