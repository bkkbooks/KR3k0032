body:
  text: 玉海卷九十二宋王應麟撰郊祀郊祀上易先王作樂崇德薦之上帝以配祖考則祖考配帝其來逺矣黃帝圓丘見後舜肆類上帝虞圜丘舜典正月上日肆類于上帝禋于六宗注告天及五帝疏以事類而祭也王制疏古尚書説非時祭天謂之類祭法有虞氏禘黃帝而郊嚳注禘謂祭天於圜丘也疏禘謂虞氏冬至祭昊天上帝於圜丘大禘之時以黃帝配祭郊謂夏正建寅之月祭感生之帝於南郊以嚳配尚書大傳維十有三祀帝乃稱王而入唐郊注舜承堯殷祭南郊商頌長發大禘也疏謂殷王髙宗之時以正嵗之正月祭其所感之帝於南郊歌此詩焉經稱帝立子生商謂感生之帝祭法云殷人禘嚳而郊冥注云禘謂冬至祭天於圜丘書君奭殷禮陟配天多歷年所太甲先王顧諟天之明命以承上下神祇周祀天圜丘通典周制冬日至祀天於圜丘大宗伯以禋祀祀昊天上帝禮神玉以蒼璧牲幣隨玉色鄭注云圜丘所祀天皇大帝牲用一犢幣用繒長丈八尺王服大裘其冕無旒乘玉路錫樊纓十有再就建太常十有二斿以祀樽及薦器以瓦爵以匏以藁秸及蒲為席配以帝嚳凡樂圜鐘為宮黃鐘為角太蔟為徴姑洗為羽靁鼓靁鼗孤竹之管雲和之琴瑟雲門之舞冬日至於地上之圜丘奏之若樂六變則天神皆降可得而禮矣其感生帝大傳曰禮不王不禘王者禘其祖之所自出以其祖配之因以祈穀壇名泰壇在國南五十里玉用四圭有邸牲用騂犢青幣配以稷其配帝牲亦騂犢奏黃鐘歌大呂舞雲門以祀天神日用辛注天神謂五帝以夏正月祀其所受命之帝於南郊牧人陽祀用騂牲注祭天南郊及清廟隂祀用牲注祭地北郊及社稷祭前期十日王親戒百官太宰又戒羣官乃習射於澤宮選可與祭者其日王乃齋於路寢之室祭日之晨雞人夜呼晨以叫百官巾車鳴鈴以應典路乃出玉路建太常大司樂既宿縣以聲展之王將出奏王夏所過於田首設燭祭前掌次先於丘東門外道北設大次小次掌次張氊案設皇邸王服大裘而立於丘之東南西面大司樂奏圜鐘為宮以下之樂以降神若感生帝則奏黃鐘以下次則積柴於丘壇上王親牽牲次則實牲體玉帛燔之謂之禋祀韓詩外傳曰天子奉玉升柴加於牲上而燔之乃掃丘壇上而祭王乃以匏爵酌瓦甒之泛齊以獻尸云云每獻奏樂一成云云七獻畢天子舞六代之樂古制天子親在舞位若感帝舞當代之樂樂章用昊天有成命周禮掌次大旅上帝注祭天於圜丘大宗伯以禋祀祀昊天上帝注冬至於圜丘所祀天皇大帝祭法禘嚳注謂祭昊天於圜丘大祝凡大禋祀執明水火而號祝注禋祀祭天神也孝經郊祀后稷以配天注郊謂圜丘祀天周書作雒篇設丘兆於南郊以祀上帝配后稷南齊志周禮祭天圜丘取因髙之義兆於南郊就陽位也上昭天明旁流氣物唐書褚無量議周禮冬至祭天圜丘不以地配唯始祖為主周五帝郊兆周禮小宗伯兆五帝於四郊四望四類亦如之注兆為壇之營域五帝蒼曰靈威仰赤曰赤熛怒黃曰含樞紐白曰白招拒黑曰汁光紀黃帝亦於南郊疏春秋緯運斗樞云太微宫有五帝坐星大宗伯注祀五帝亦用實柴之禮鄭氏謂天有六天賈逵馬融王肅等以五帝非天肅合郊丘而一之以五帝為人帝典祀掌外祀之兆守皆有域掌其禁令注外祀謂所祀於四郊也掌次祀五帝則張大次小次設重帟重案注祀五帝於四郊疏謂四時迎氣月令四立之祭司服王祀昊天上帝則服大裘而冕祀五帝亦如之太宰祀五帝則掌百官之誓戒與其具修前期十日帥執事而卜日遂戒及執事視滌濯及納亨贊王牲事及祀之日贊玉幣爵之事注祀五帝謂四郊及明堂大司寇若禋祀五帝則戒之日涖誓百官戒于百族及納亨前王祭之日亦如之奉其明水火小司寇凡禋祀五帝實鑊水納亨亦如之注祭天曰燔柴即禋祀也五帝所祀謂四時迎氣總享明堂士師祀五帝則沃尸及王盥洎鑊水充人掌牲牷祀五帝則繫于牢芻之三月展牲則告牷碩牲則贊大司徒祀五帝奉牛牲羞其肆大宗伯祭五祀注五官之神在四郊四時迎五行之氣於四郊而祭五德之帝亦食此神焉句芒食於木蓐收食於金玄冥食於水祝融后土食於火土疏月令四時陳五德之帝并五人神為十二月聽朔及四時迎氣故青圭赤璋之下注皆云迎氣時並祭五人帝五人神也鄭司農云五祀五色之帝於王者宮中曰五祀後鄭不從詩我將疏大宗伯禮四方謂四時迎氣牲如其器之色則五帝之牲當用五色月令季秋上丁命樂正入學習吹大饗帝言大饗者遍祭五帝也嘗犧牲告備於天子饗帝之外亦饗羣神使有司祭于羣神季冬乃畢祀帝之大臣天之神祇四時之功成于冬孟月祭其宗至此祭其佐帝之大臣勾芒之屬天之神祗司中司命風師雨師疏云五帝為宗大臣勾芒等為佐家語孔子曰聞諸老聃曰天有五行水火金木土分時化育以成萬物其神謂之五帝五行佐成上帝而稱五帝太皥之屬配焉亦云帝變禮有旅掌于大宗伯類造掌于小宗伯禱祠柴望有告有用牲又其略矣周祈穀詩噫嘻春夏祈穀于上帝箋月令孟春祈榖于上帝左傳夏則龍星見而雩是祈穀之事與疏郊特牲云郊之祭大報天而主日書傳曰祀上帝於南郊所以報天德報其已往又祈其將來故祈報兩言也左傳曰郊祀后稷以祈農事故啓蟄而郊郊而後耕是郊天祈穀為一祭也夏正郊天祭所感一帝而已雩祭總祀五帝禮運祭帝於郊所以定天位禮行於郊而百神受職月令乃擇元日祈穀于上帝注元日謂上辛郊祭天也公羊傳郊必祭稷王者必以其祖配郊用正月上辛穀梁傳郊自正月至于三月郊之時也郊三卜禮也魯語天子祀上帝諸侯會之受命焉左傳啓蟄而郊注夏正建寅之月祀天南郊疏杜注不言靈威仰與鄭異明堂位曰魯君孟春祀帝於郊雜記孟獻子曰正月日至可以有事於上帝則魯郊以周之孟春禮記後人所録未必皆是正禮郊特牲云云疏鄭以郊丘為二者玉蒼璧四圭牲蒼騂犢樂圜鍾黃鍾皆不同以蒼璧蒼犢圜鍾為祭圜丘以四圭騂犢黃鍾為祭五帝及郊天所用皇氏曰天有六天嵗有八祭冬至圜丘一也夏正郊天二也五時迎氣七也九月大饗八也雩與郊禖為祈祭不入數崔氏以雩為常祭九也又見下祀天常禮嵗九郊雩明堂圜丘兆五帝於四郊也夏正之月祈穀詩噫嘻郊特牲迎長日春秋書郊左傳啓蟄而郊是也夏祈穀詩噫嘻月令春秋大雩左傳龍見而雩是也季秋大享明堂詩我將月令大饗帝孝經宗祀是也冬至祀圜丘詩昊天有成命大司樂地上之圜丘禮器因吉土饗帝于郊是也兆五帝四郊小宗伯所掌月令迎氣是也嵗凡九祭皆祀天神宋書王燮之議郊特牲曰郊之用辛也周之始郊日以至鄭玄注曰三王之郊一用夏正用辛者取其齋戒自新也月令曰乃擇元日祈穀於上帝注曰元日謂上辛郊祭天也春秋載郊有二成十七年九月辛丑郊公羊曰曷用郊用正月上辛哀元年四月辛巳郊穀梁曰自正月至于三月郊之時也則郊祭之禮未有不用辛日者晉氏或丙武帝十二月丙寅南郊受禪或已太始三年十一月己卯始并圓丘方澤二至之祀合於二郊或庚三年十一月庚寅冬至祠天郊于圓丘猶用圜丘之禮非專祈穀之祭故不用辛並有別議今宜用辛朱膺之議先儒論郊其議不一周禮有冬至日圓丘之祭月令孟春有祈穀于上帝鄭氏説圓丘祀昊天上帝以帝嚳配所謂禘也祈穀祀五精之帝以后稷配所謂郊也二祭異時其神不同諸儒云圓丘之祭以后稷配取其所在名之曰郊以形體言之謂之圓丘名雖有二其實一祭晉武捨鄭而從諸儒是以郊用冬至不用辛日江左以來皆用正月何偃議左傳啓蟄而郊則鄭説有據云云泰始六年五月乙亥詔曰古禮王者每嵗郊享爰及明堂自晉以來間年一郊明堂同日自今間二年一郊間嵗一明堂三禮義宗鄭玄謂天有六名嵗有九祭王肅謂天惟有一嵗有二祭靈恩謂宜從鄭吳志注志林曰棫朴之作有積燎之薪文王郊酆經有明文南齊志蔡仲熊議鄭志云正月上辛祀后稷於南郊還於明堂以文王配宋立明堂郊還即祭是用鄭志之説禮以辛郊書以丁祀漢郊祀志郊柴饗帝之義掃地而祭上質也歌大呂舞雲門以俟天神歌太蔟舞咸池以俟地祇其牲用犢其席稿秸其器陶匏皆因天地之性不敢修其文也周郊祀天地周頌昊天有成命郊祀天地也疏周人木德感蒼帝靈威仰而生祭之於南郊神州之神則祭之於北郊雖南北有異祭俱在郊故總言郊祀祀天南郊鄭云夏之正月其祭神州之月則無文蓋與郊天同此經不言地大司樂圜丘方丘注天神則主北極地祇則主昆崙彼以二至之日祭之於丘不在於郊大宗伯注此禮天以冬至謂天皇大帝在北極者禮地以夏至謂神在崑崙者禮器因吉土以饗帝于郊疏謂饗祭五方之帝於都之四郊雜記孟獻子曰正月日至可以有事上帝郊特牲云云疏先儒説郊其義有二聖證論以天體無二郊即圓丘圓丘即郊鄭氏以為天有六天丘郊各異圓丘之祭周人則以嚳配之祭法禘嚳是也感生之帝則以后稷配之五時迎氣及雩祭則以五方人帝配之九月大饗五帝則以五人帝及文武配之以文王配五天帝謂之祖以武王配五人神謂之宗郊之祭迎長日之至也注易説曰三王之郊一用夏正建寅之月也疏此易緯乾鑿度文郊之用辛也周之始郊日以至注魯禮也三王之郊一用夏正魯以建子之月郊天示先有事也儒者推魯禮言周事用辛日者取齋戒自新疏王肅用董仲舒劉向之説以此為周郊謂周之郊祭於建子之月而迎此冬至長日之至也以冬至陽氣新用事故用辛通典黃帝封禪天地少昊載時以象天顓頊命重司天以屬神髙辛順天之義堯欽若昊天郊以明天道所從來尚矣家語郊問篇孔子曰萬物本於天人本於祖郊之祭也大報本反始也郊所以明天道也周之始郊其月以日至其日用上辛至於啓蟄之月則又祈穀于上帝注啓蟄而郊郊而後耕此二者天子之禮也魯無冬至大郊之事兆丘於南就陽位也於郊故謂之郊注郊之名有三象天自然謂之圓丘人之所造謂之泰壇禮器至敬不壇掃地而祭疏謂祭五方之天初則燔柴於泰壇於壇下掃地而設正祭此周法也孝經周公郊祀后稷以配天疏鄭玄以祭法有周人禘嚳之文遂變郊為祀感生之帝魏王肅著論駁之馬昭抗章固執勑博士張融質之融稱周人祀昊天於郊以后稷配周禮圜丘則孝經之郊聖人因尊事天因下事地安能復得祀帝嚳於圜丘配祀稷於蒼帝之禮乎且周頌思文后稷配天昊天有成命郊祀天地則郊非蒼帝肅説為長王義具聖證論鄭義具三禮義宗曲禮天子祭天地嵗遍疏天有六祭之一嵗有九地神有二嵗有二祭大宗伯注鄭司農云昊天天也疏孝經云郊祀后稷以配天典瑞云四圭有邸以祀天先鄭與王肅同一天而已似無六天之義春秋繁露郊祝曰皇皇上天照臨下土集地之靈降甘風雨庶物羣生云云郊祀九句九句者陽數也郊特牲兆日於南郊就陽位左傳啓蟄而郊郊祀后稷以祈農事詩思文后稷克配彼天大司樂祀天神注謂五帝王者各以夏正月祀其所受命帝於南郊祭法周人禘嚳而郊稷注禘謂祭昊天於圜丘也祭上帝於南郊曰郊祭五帝五神於明堂曰祖宗郊祭一帝而明堂祭五帝隋志儒者各守所見一云祀天之數終嵗有九祭地之數一嵗有二圓丘方澤一年三行若丘澤之年祭天有九祭地有二若天不通圓丘之祭終嵗有八地不通方澤之祭終嵗有一此則鄭學所宗也一云唯有昊天無五精之帝而一天嵗二祭壇位唯一圓丘之祭即是南郊日南至祭天春又一祭祈農事謂之二祭無別天也五時迎氣皆祭五行之人帝太皥之屬非祭天也文武配祭明堂皆祭人帝此則王學所宗也梁陳迄隋議者各宗所師故郊丘互有變易云云梁明山賓議周以建子祀天五月祭地殷以建丑祀天六月祭地夏以建寅祀天七月祭地祭法夏禘黃帝而郊鯀殷禘嚳而郊冥周禮典瑞四圭有邸以祀天注夏正郊天也大宗伯以蒼璧禮天注禮天以冬至謂天皇大帝在北極者祀大神帥執事而卜日周郊禮漢志丞相衡奏言昔者周文武郊於豐鄗成王郊于洛邑天隨王者所居而饗之王商等以為郊處各在聖王所都之南北書曰越三日丁巳用牲于郊牛二周公加牲告徙新邑定郊禮於雒洛誥周公曰王肇稱殷禮祀于新邑咸秩無文王若曰惇宗將禮稱秩元祀召誥越三日丁巳用牲于郊牛二注於乙卯三日用牲告立郊位於天以后稷配故二牛疏此郊與社於攻位之時已經營之今非常祭之月而特用牲祭天禮郊用特牲以后稷配故二牛也郊特牲及公羊傳云養牲必養二帝牛不吉以為稷牛丁巳三月十四日也告立祭天之位楚語郊禘不過繭栗其自時配皇天毖祀于上下其自時中乂注愼事天地用是土中大致治曲禮疏孝經説云后稷為天地之主文王為五帝之宗后稷配天南郊又配地北郊則周人以嚳配圜丘亦當配方澤也天有六祭之一嵗有九昊天上帝冬至祭之一也蒼帝立春祭之東郊二也赤帝立夏祭之南郊三也黃帝季夏土王日祭之南郊四也白帝立秋祭之西郊五也黑帝立冬祭之北郊六也王者各稟五帝之精氣而王天下於夏正之月祭之南郊七也四月龍星見而雩總祭五帝於南郊八也季秋大饗五帝於明堂九也大傳王者禘其祖之所自出以其祖配之注大祭曰禘大祭其先祖所由生謂郊祀天也王者之先祖皆感大微五帝之精以生用正嵗之正月郊祭之孝經曰后稷配天配靈威仰也文王配上帝泛配五帝也大戴禮踐阼篇武王銘曰隨天之時以地之財敬祀皇天敬以先時公符篇皇皇上帝照臨下土集地之靈降甘風雨庶物羣生各得其所靡今靡古維豫一人某敬拜皇天之祜薄薄之土承天之神興甘風雨庶卉百穀莫不茂者既安且寧維豫一人某敬拜下土之靈泰誓類于上帝詩維清肇禋箋云文王受命始祭天疏文王之時禘郊未備所祭不過感生之帝而已周禮鼓人以雷鼓鼓神祀注祀天神也周書文王在酆王乃命三公九卿及百姓之人曰恭敬齋潔咸恪而祀于上帝周公格于左閎門會羣臣曰大門宗子助王恭明祀用能承天嘏命先人神祇報職用休萬子孫被先王之靈光表記后稷之祀易富也其辭恭其欲儉其祿及子孫中庸明乎郊社之禮禘嘗之義治國其如示諸掌乎祭義惟聖人為能饗帝孝子為能饗親五經異義春秋公羊説禮郊及日皆不卜常以正月上丁也成王命魯使卜從乃郊魯以上辛郊不敢與天子同也楚語一純二精三牲四時五色六律七事八種九祭十日十二辰以致之百姓千品萬官億醜兆民經入畡數以奉之明德以昭之和聲以聽之周祀天三禮大宗伯吉禮以禋祀祀昊天上帝以實柴祀日月星辰以槱燎祀司中司命飌師雨師疏此祀天神之三禮以尊卑先後為次謂歆神始也以血祭祭社稷五祀五嶽以貍沈祭山林川澤以疈辜祭四方百物疏言祭地示三等之禮尊卑之次亦是歆神始也唐文粹賈曽表春秋説云王者一嵗七祭天地合食於四孟别立分至王肅曰孔子云兆圜丘於南郊又云祭天而地配此合祭之明説唯鄭康成不論禘當合祭而分昊天上帝為二神專憑緯文事匪經見其注大傳不王不禘云正嵗之正祭感帝之精注大司樂圓丘則引大傳五禘以為冬至祭遞相矛盾魯郊祭禮運魯之郊禘非禮也公羊傳卜郊何以非禮魯郊非禮也呂氏春秋魯惠公使宰讓請郊廟之禮於天子桓王使史角往郊特牲疏魯之郊祭師説不同崔氏皇氏用王肅之説以魯冬至郊天至建寅之月又郊以祈穀故左傳云啓蟄而郊又云郊祀后稷以祈農事是二郊也鄭康成之説魯唯一郊不與天子郊天同月轉卜三正但春秋魯禮也無建丑之月耳明堂位云魯君以孟春祀帝于郊配以后稷注孟春建子之月魯之始郊日以至案聖證論王肅與馬昭之徒或云祭天用冬至之日或云用冬至之月據周禮似用冬至之日禮記郊日用辛似用冬至之月張融案郊與圓丘是一又引韓詩説三王各正其郊與王肅同又魯以轉卜三正王與鄭同説文魯郊以丹雞祝漢九天祠郊祀志髙祖六年長安置祠祀官九天巫祠九天皆以嵗時祠宮中成帝初匡衡奏罷之注師古曰九天者謂中央鈞東方蒼東北旻北玄西北幽西方浩西南朱南炎東南陽其説見淮南子一説東旻東南陽南赤西南朱西成西北幽北玄東北變中央鈞史記正義尚書考靈曜云東昊東南隂云云同上東蒼東北閔北玄西北幽西昊西南朱南炎東南陽太玄經云中從羡更睟廓減沈成天呂氏春秋天有九野中央鈞其星角亢氐東方蒼其星房心尾東北變其星箕斗牽牛北方玄其星婺女虛危營室西北幽其星東壁奎婁西方皓其星胃昴畢西南朱其星觜巂參東井南方炎其星輿鬼柳七星東南陽其星張翼軫郊祀志神明臺注師古曰漢宮閣疏云上有九室常置九天道士百人漢五畤北畤渭陽五帝廟五帝壇議郊祀圜丘郊祀志秦襄公列為諸侯自以為主少昊之神作西畤祠白帝年表襄公八年平王之元年立西畤六國表曰位在藩臣而臚于郊祀僣端見矣説文云畤者天子五帝所止祭僣敘傳曰大夫臚岱侯伯畤其後十四年秦文公作鄜畤用三牲郊祭白帝焉年表秦文公十年平王之十四年作自未作鄜畤而雍旁故有吳陽武畤雍東有好畤皆廢無祀或曰自古以雍州積髙神明之隩蓋黃帝時嘗用事雖晚周亦郊焉秦德公卜居雍雍之諸祠自此興秦宣公四年作密畤渭南祭青帝後二百五十年秦靈公四年於吳陽作上畤祭黃帝作下畤祭炎帝秦獻公作畦畤於櫟陽而祀白帝唯雍四畤上帝為尊三年一郊秦以十月為嵗首故常以十月上宿郊見月上旬也通權火拜於咸陽之旁而衣上白西畤畦畤祠如其故上不親往漢髙祖以十月至霸上立為漢王因以十月為嵗首色上赤二年冬東擊頃籍而還入關問秦時上帝祠何帝也對曰四帝有白青黃赤帝之祠髙祖曰吾聞天有五帝而四何也莫知其説於是髙祖曰吾知之矣乃待我而具五也乃立黑帝祠名曰北畤有司進祠上不親往悉召故秦祠官復置太祝太宰如其故儀禮下詔曰吾甚重祠而敬祭今上帝之祭及山川諸神當祠者各以時禮祠之如故文帝十三年紀十三年夏下詔曰祕祝之官移過於下朕甚弗取其除之始名山大川在諸侯諸侯祝各自奉祠天子官不領及齊淮南國廢令太祝盡以嵗時致禮如故明年十四年春以嵗比登詔有司增雍五畤路車各一乘駕被具西畤畦畤寓車各一乘寓馬四匹駕被具河湫漢水玉加各二及諸祀皆廣壇場圭幣爼豆以差加之魯人公孫臣上書以漢當土德土德之應黃龍見宜改正朔服色色上黃張蒼以為漢乃水德遂罷臣言明年紀十五年春黃龍見成紀於是召臣拜博士與諸生申明土德草改厯服色事其夏下詔曰有異物之神見于成紀毋害于民嵗以有年朕幾郊祀上帝諸神禮官議毋諱以朕勞有司皆曰古者天子夏親郊祀上帝于郊三王之郊一用夏正于時十月為嵗首故言夏郊故曰郊於是夏四月文帝始幸雍郊見五畤祠漢興至此方親郊衣皆上赤新垣平以望氣見上言長安東北有神氣成五采若人冠冕或曰東北神明之舍天瑞下宜立祠上帝以合符應於是作渭陽五帝廟同宇帝一殿面五門各如其帝色祠所用及儀物亦如雍五畤明年十六年四月郊見權火舉而祠若光輝然屬天元始五年大司馬奏孝文十六年初起渭陽五帝廟祭泰一地祇以太祖髙皇帝配日冬至祠泰一夏至祠地祇皆并祠五帝而共一牲上親拜郊於是使博士諸生刺六經中作王制議巡狩封禪事帝出長門若見五人道北遂因其直立五帝壇祠以五牢使祠官致禮平誅乃不復自親使有司行事紀景帝中六年冬十月行幸雍郊五畤武帝元光二年冬十月初至雍郊見五畤史大事記元光元年帝初之雍二年郊見五畤後常三嵗一郊元狩元年冬十月行幸雍祠五畤獲白麟作白麟之歌徐廣曰武帝立已十九年然志云郊雍獲一角獸若麃有司曰陛下肅祇郊祀上帝報錫一角獸蓋麟云於是以薦五畤畤加一牛以燎錫諸侯白金以風符應合于天也二年冬十月行幸雍祠五畤元鼎四年冬十月行幸雍祠五畤賜民爵一級女子百户牛酒五年冬十月行幸雍祠五畤遂踰隴登空桐西臨祖厲河而還元封二年冬十月行幸雍祠五畤四年冬十月行幸雍祠五畤通回中道大始四年十二月行幸雍祠五畤凡八年太初二祠官進畤犢牢具宣帝五鳯二年三月行幸雍祠五畤史大事記神爵二年上郊雍五畤祋祤出寶璧玉器元帝初元五年行幸雍祠五畤永光四年三月行幸雍祠五畤建昭元年三月行幸雍祠五畤成帝建始二年春正月罷雍五畤志云建始二年丞相衡言今雍鄜密上下畤本秦侯各以其意所立非禮所載漢初因秦故祠復立北畤今既稽古郊見上帝五方畢陳各有位饌不宜復修永始二年十一月行幸雍祠五畤三年冬十月庚辰復雍五畤元延元年綏和元年並三月行幸雍祠五畤郊祀志秦祠雍四畤春為嵗禱因泮凍秋涸凍冬賽祠五月嘗駒春夏用騂秋冬用駵駒一本云駒四匹木寓龍一駟木寓車馬一駟各如其帝色黃犢羔各四圭幣各有數皆生瘞埋無爼豆之具三年一郊秦以十月為嵗首故常十月上宿郊見通爟火拜於咸陽之旁而衣上白文帝十四年一本十三年詔增雍五畤路車各一乘被駕具武帝太初二年有司言雍五畤無牢孰具芬芳不備乃令祠官進畤犢牢具色食所勝以木寓馬代駒云地理志扶風雍縣有五畤太昊黃帝以下祠三百三所百官表五畤各一尉括地志漢五帝畤在岐州雍縣南鄜密吳陽上下北史記正義西畤在秦州括地志三畤原在岐州雍縣南二十里鄜上下畤並在此原上因名三畤原在吳山之陽畦畤在雍州櫟陽縣東二十五里櫟陽故城中晉灼云形如種韭一畦畤中各一土封也張晏云漢祠五畤於雍丘五里一烽火括地志云渭陽五帝廟在雍州咸陽縣東三十里宮殿疏云五帝廟一宇五殿也一宇之內設五帝各依其方帝别為一殿而門名如帝色齊志王儉議秦為諸侯雜祀諸畤始皇并天下未有定祠漢髙受命因雍四畤而起北畤始祠五帝未定郊丘文帝十六年新垣平議初起渭陽五帝廟武帝初至雍郊見五畤後常三嵗一郊祠雍元鼎四年始立后土祠於汾隂明年立太一祠於甘泉自是以後二嵗一郊與雍更祠成帝初匡衡於長安定南北郊哀平之際又復甘泉汾隂祠元始五年復長安南北二郊光武建武二年定郊祀兆於洛陽魏晉因循率由漢典隋志案前漢黃圖上帝壇徑五丈髙九尺后土壇方五丈髙六尺文帝紀十五年春黃龍見於成紀上乃下詔議郊祀公孫臣明服色新垣平設五廟即渭陽五帝廟夏四月上幸雍始郊見五帝赦天下修名山大川祀有司以嵗時致禮十六年夏四月上郊祀五帝于渭陽師古曰志云在長安東北郊祀志注師古曰廟記云五帝廟在長安東北廟志云夏四月文帝親拜霸渭之會以郊見渭陽五帝臨渭其北穿蒲池溝水後文帝怠於改正服鬼神之事而渭陽長門五帝使祠官領以時致禮不往焉郊祀志八神云云蓋天好隂祠之必於髙山之下畤命曰畤地貴陽祭之必於澤中圓丘云史記正義蓋在今寶鼎縣北圜丘上祠后土是也漢宣室受釐賈誼傳文帝思誼召之至入見上方受釐宣室注宣室未央前正室漢儀注祭天地五畤皇帝親自行祠還致福釐文紀十四年春詔曰祠官祝祭皆歸福於朕躬漢甘泉泰畤泰一壇紫壇泰一祠五帝壇甘泉圜丘寶鼎神䇿泰一鏠旗天文壇泰畤壇紀元鼎五年十一月辛巳朔旦冬至立泰畤于甘泉王莾奏元鼎五年十一月癸未立太一祠于甘泉三嵗一郊與雍更祠亦以髙祖配天子親郊見注師古曰祠太一也朝日夕月應劭曰天子春朝日秋夕月朝日以朝夕月以夕臣瓚曰漢儀注郊泰畤皇帝平旦出竹宮東向揖日其夕西鄉揖月便用郊日不用春秋也師古曰春朝朝日秋暮夕月常禮也郊泰畤而揖日月此又別儀常晉志曰漢武云云後遂旦夕拜詔曰朕以眇身託于王侯之上德未能綏民民或飢寒故巡祭后土以祈豐年冀州脽壤乃顯文鼎獲薦于廟渥窪水出馬朕其御焉戰戰兢兢懼不克任思昭天地內惟自新詩云四牡翼翼以征不服親省邊陲用事所極望見泰一修天文禪古禪字祭也臣瓚曰此年初祭泰畤于甘泉此祭天于文禪也祭天則天文從故曰修天文禪也師古曰朝日夕月即天文禪也辛卯夜若景光十有二明易曰先甲三日後甲三日先甲三日辛也後甲三日丁也朕甚念年嵗未咸登敕躬齋戒丁酉拜况于郊郊祀志兼本紀元光二年亳人繆忌奏祠泰一方曰天神貴者曰泰一泰一佐曰五帝古者天子以春秋祭泰一東南郊日一太牢七日每日以一太牢凡七日祭也為壇開八通之鬼道於是天子令太祝立其祠於長安城東南郊常奉祠如忌方通鑑綱目元光二年立泰一祠後人上書言古者天子三年一用太牢祠三一天一地一泰一天子許之令太祝領祠之於忌泰一壇上如其方後人復有言古者天子常以春解祠祠黃帝用一梟破鏡冥羊用羊祠馬行用一青牡馬泰一臯山君用牛武夷君用乾魚隂陽使者以一牛令祠官領之如其方而祠於忌泰一壇旁元鼎四年秋上雍且郊或曰五帝泰一之佐也宜立泰一而上親郊之上疑未定齊人公孫卿曰今年得寶鼎其冬辛巳朔旦冬至與黃帝時等卿有札書曰黃帝得寶鼎冕侯問於鬼臾區對曰黃帝得寶鼎神䇿是嵗己酉朔旦冬至得天之紀終而復始黃帝迎日推策率二十嵗復朔旦冬至五年冬十月上遂郊雍至隴西登空桐幸甘泉令祠官寬舒等具泰一祠壇放亳忌泰一壇三陔陔重也五帝壇環居其下各如其方黃帝西南除八通鬼道服虔曰坤位在未黃帝從土位泰一所用如雍一畤物而加醴棗脯之屬殺一氂牛音貍西南夷長髦之牛也以為爼豆牢具而五帝獨有爼豆醴進其下四方地為腏食羣神從者及北斗云腏謂聨續而祭也已祠胙餘皆燎之其牛色白白鹿居其中彘在鹿中水而酒之言以白鹿納牛中以彘肉納鹿中又以水及酒合內鹿中祭日以牛祭月以羊彘特泰一祝宰則衣紫及繡五帝各如其色日赤月白史平凖書既得寶鼎立后土太一祠注元鼎四年立后土五年立泰畤十一月辛巳朔旦冬至曶爽天子始郊拜泰一朝朝日夕夕月則揖而見泰一如雍郊禮其贊享曰天始以寶鼎神䇿授皇帝朔而又朔終而復始皇帝敬拜見焉而衣上黃其祠列火滿壇壇旁亨炊具有司云祠上有光公卿言皇帝始郊見泰一雲陽有司奉瑄玉璧大六寸謂之瑄嘉牲薦享漢舊儀云祭天養牛五嵗至三千斤是夜有美光及晝黃氣上屬天太史令談祠官寬舒等曰神靈之休祜福兆祥宜因此地光域立泰畤壇以明應令太祝領秋及臘間祠三嵗天子一郊見兒寬上壽曰宗祀泰一席漢舊儀祭天用六采綺六重用玉几玉飾器凡七十其秋為伐南越告禱泰一以牡荆畫幡日月北斗登龍以象泰一三星為泰一鏠旗命曰靈旗為兵禱則太史奉以指所伐國注李竒曰牡荆作幡柄也如淳曰牡荆荆之無子者皆潔齋之道晉灼曰牡節間不相當也月暈刻之為劵以畏病者天文志中宫天極星其一明者泰一之常居也旁三星三公也畫一星在後三星在前為泰一鏠旗也師古曰李晉二説是以牡荆為幡竿而畫幡為日月龍及星泰揚雄甘泉賦招搖泰一舉洪頤樹靈旗郊祀歌惟元尊招搖靈旗九夷賔將晉志太一星在天一南相近亦天帝神也主使十六神知風雨水旱兵革飢饉疾疫災害所在之國淮南子云太微者太一之庭紫宮者太一之居元鼎六年春既滅南越下公卿議曰民間祠有鼓舞樂今郊祠而無樂豈稱乎於是塞南越禱祠泰一后土始用樂舞作二十五絃及空侯瑟元封元年冬北巡朔方乃歸甘泉且用事泰山先類祠泰一類祠謂以事類祭之類元鼎五年郊見元封元年祠泰一二年冬郊雍五帝還拜祝祠泰一贊享曰德星昭衍厥為休祥壽星仍出淵耀光明信星昭見皇帝敬拜泰祝之享史記元封元年秋有星茀于東井後十餘日有星茀于三能望氣王朔言候獨見填星出如瓜食頃復入有司曰陛下建封禪天其報德星云師古以德星即鎮星索隱曰德星嵗也壽星南極老人也信星鎮星也五年冬行南巡守春三月還至太山增封四月還幸甘泉郊泰畤天漢元年正月行幸甘泉郊泰畤後元元年正月行幸甘泉郊泰畤二月詔曰朕郊見上帝巡于北邊見羣鶴留止以不罔羅靡所獲獻薦于泰畤光景並見其赦天下至宣帝修武帝故事敬齊祠之禮神爵元年正月行幸甘泉郊泰畤數有美祥改元神爵四年二月詔修興泰一五帝后土之祠齊戒之暮神光顯著薦鬯之夕神光交錯上帝嘉嚮海內承福五鳯元年正月幸甘泉郊泰畤甘露元年正月三年正月行幸甘泉郊泰畤胸奴呼韓邪單于稽侯㹪來朝黃龍元年正月行幸甘泉郊泰畤單于來朝凡五郊元帝初元二年四年永光元年五年建昭二年並正月行幸甘泉郊泰畤志凡五奉泰畤后土之祠間嵗一幸甘泉成帝建始元年匡衡張談奏十二月作長安南北郊罷甘泉汾隂祠是日大風拔甘泉畤中大木十圍以上壞竹宮二年正月罷雍五畤詔曰乃者徙泰畤后土於南北郊朕親飭躬郊祀上帝皇天報應神光並見匡衡言甘泉泰畤紫壇八觚宣通象八方五帝壇環周其下又有羣神之壇以尚書禋六宗望山川遍羣神之義紫壇有文章采鏤黼黻之飾及玉女樂石壇仙人祠瘞鸞輅騂駒寓龍馬上質不飾以章天德紫壇偽飾宜皆勿修服虔曰八觚如今社壇師古曰觚角也永始三年冬十月庚辰皇太后詔復甘泉泰畤汾隂后土雍五畤陳倉陳寶祠語在郊祀志四年春正月行幸甘泉郊泰畤神光降集紫殿元延二年四年綏和三年並正月幸甘泉郊泰畤太后詔復南北郊長安如故哀帝建平三年十一月壬子復甘泉泰畤汾隂后土罷南北郊遣有司禮祠太一與泰一不同禮樂志武帝定郊祀之禮祠太一甘泉就乾位在京之西北若立泰一祠壇於東南郊即與就乾位異矣楚詞九歌首以東皇太一漢以正月上辛祠泰畤甘泉以昏時夜祠至明而終常有流星經于祠壇上使童男女七十人俱歌春歌青陽夏歌朱明秋歌西皓冬歌玄冥又得神馬渥窪中復次以為太一歌置壽宫神君臣瓚曰壽宫奉神之宫神君最貴者曰太一其佐曰太禁司命之屬皆從之非可得見聞其言來則風肅然居室帷中時晝言然常以夜天子祓然後入又置壽宫北宫張羽旗設共具以禮神君元朔四年志云諸所興如薄忌泰一及三一以嵗時致禮皆太祝領之甘泉泰一汾隂后土三年親郊祠平帝元始五年大司馬奏孝文十六年用新垣平初起渭陽五帝廟祭泰一地祇以太祖髙皇帝配日冬至祠泰一夏至祠地祇皆并祠五帝而共一牲上親郊拜後平伏詐誅乃不復自親而使有司行事孝武元鼎四年十一月甲子始立后土祠於汾隂五年十一月癸未始立泰一祠於甘泉三嵗一郊與雍更祠亦以髙祖配禮樂志武帝祠太一於甘泉就乾位也師古曰在京師西北作十九章之歌以正月上辛用事甘泉圓丘郊祀歌帝臨二帝臨中壇四方承宇惟泰元七惟泰元尊媪神蕃釐繼統共勤順皇之德鸞路龍鱗罔不肸飾鐘鼓笙竽雲舞翔翔招搖靈旗九夷賔將天地八天地並况惟豫有慕爰熙紫壇思求厥路恭承禋祀緼豫為紛黼繡周張承神至尊千童羅舞成八溢合好效歡虞泰一天門十一天門開詄蕩蕩穆並騁以臨饗光夜燭德信著星留俞塞隕光照紫幄珠熉黃月穆穆以金波日華耀以宣明后皇十四后皇嘉壇立玄黃服物發冀州兆蒙祉福華􅏎􅏎十五神之揄臨壇宇神安坐鴹吉時神嘉虞申二觴五神十六扢嘉壇椒蘭芳璧玉精垂華光揚雄甘泉賦正月從上甘泉還奏賦曰惟漢十世將郊上玄定泰畤雍神休尊明號乃命郡僚歷吉日協靈辰星陳天行逆釐三神齊陽靈之宫集呼禮神之囿登呼頌祇之堂欽祡宗祈燎熏皇天招繇泰一舉洪頤植靈旗樵蒸焜上配藜四施玄瓚觩䚧秬鬯泔淡肸蠁豐融懿懿芬芬炎感黃龍兮熛訛碩麟選巫咸兮叫帝閽開天庭兮延羣神儐暗藹兮降清壇瑞穰穰兮委如山天閫決兮地垠開八荒協兮萬國諧雲飛揚兮雨滂沛子胥德兮麗萬世崇崇圜丘隆隱天兮增宫嵾差駢嵯峨兮聖皇穆穆信厥對兮徠祗郊禋神所依兮俳佪招搖靈迉迡兮黃圖漢圜丘在昆明故渠南有漢故圓丘髙二丈周回百二十步續漢志注漢舊儀祭天紫壇幄帷水經注應劭曰天郊在長安南即此也漢郊祀禮上帝后土壇禮樂志武帝定郊祀之禮祠太一於甘泉就乾位也在京師西北祭后土於汾隂澤中方丘也祭地以方象地形乃立樂府以正月上辛用事甘泉圜丘師古曰依周禮郊天日也辛取齋戒自新之義圜丘象取天形昏祠至明夜有神光止集祠壇天子自竹宫望拜漢舊儀云竹宫去壇三里百官侍祠者數百人皆肅然動心焉後漢陳忠傳郊祀之禮定於元成衛宏漢舊儀皇帝祭天居雲陽宫齋百日上甘泉通天臺髙二十丈以候天神之下天神下壇所舉烽火皇帝就竹宫望壇拜不至壇所竹宮去壇三里甘泉臺去長安三百里望見長安城黃帝以來所祭天之圓丘也魏志王朗傳注魏名臣奏載朗節省奏曰西京雲陽汾隂之大祭千有五百之羣祀通天之臺入阿房之宫齋必百日養犧五載牛則三千其重玉則七千其器文綺以飾重席童女以蹈舞綴釀酎必貫三時而後成樂人必三千四百而後備隋禮儀志陳大建十一年祠部郎王元規議曰案前漢黃圖上帝壇徑五丈髙九尺后土壇方五丈髙六尺翼奉傳漢家郊兆寢廟祭祀之禮多不應古春秋繁露郊事對第七十一廷尉臣湯承制以郊事問故膠西相仲舒仲舒對曰魯郊用純騂剛周色上赤魯以天子命郊故以騂後漢陳元傳數陳郊廟之禮帝不能用宋志袁山松漢百官志云郊祀之事太尉掌亞獻光祿掌三獻太常每祭祀先奏其禮儀及行事掌贊天子漢齊祠禮郊祀志宣帝即位十二年下詔曰蓋聞天子尊事天地修祀山川古今通禮也間者上帝之祠闕而不親十有餘年朕親飭躬齋戒親奉祀為百姓蒙嘉氣獲豐年焉明年正月上始幸甘泉郊見泰畤數有美祥修武帝故事盛車服敬齊祠之禮頗作詩歌其三月幸河東祠后土有神爵集改元為神爵制詔太常以四時祠江海雒水祈為天下豐年漢長安南北郊成都南北郊紀建始元年十二月作長安南北郊罷甘泉汾隂祠是日大風拔甘泉畤中大木十圍以上二年正月罷雍五畤辛巳上始郊祀長安南郊詔曰乃者徙泰畤后土于南郊北郊朕親飭躬郊祀上帝皇天報應神光並見三輔長無共張繇役之勞赦奉郊縣長安長陵應劭曰天郊在長安城南地郊在長安城北三月辛丑始祠后土於北郊郊祀志兼紀成帝初即位丞相衡御史大夫談奏言帝王之事莫大於承天之序承天之序莫重於郊祀故聖王盡心極慮以建其制祭天於南郊就陽之義也瘞地於北郊即隂之象也天之於天子也因其所都而各享焉往者孝武皇帝居甘泉宮即於雲陽立泰畤祭於宮南今常幸長安郊見皇天反北之泰隂祠后土反東之少陽事與古制殊又至雲陽行溪谷中厄陜且百里汾隂則度大川有風波舟楫之危皆非聖王所宜數乘郡縣治道共張吏民困苦百官煩費勞所保之民行危險之地難以奉神靈而祈福祐殊未合於承天子民之意昔者周文武郊於豐鄗成王郊於雒邑由此觀之天隨王者所居而饗之可見也甘泉泰畤河東后土之祠宜可徙置長安合於古帝王願與羣臣議定奏可大司馬車騎將軍許嘉等八人以為所從來久遠宜如故右將軍王商博士師丹議郎翟方進等五十人以為禮記曰燔柴於太壇祭天也瘞薶於太折祭地也兆於南郊所以定天位也祭地於大折在北郊就隂位也郊處各在聖王所都之南北天地以王者為主故聖王制祭天地之禮必於國郊長安聖主之居皇天所觀視也甘泉河東之祠非神靈所饗宜徙就正陽太隂之處違俗復古循聖制定天位如禮便於是衡談奏議曰陛下聖德聰明承天大典詩曰毋曰髙髙在上陟降厥士言天之日監王者之處也乃眷西顧此維豫宅言天以文王之都為居也宜於長安定南北郊為萬世基天子從之翼奉傳奉言漢家郊兆寢廟祭祀之禮多不應古匡衡為相奏徙南北郊其議皆自奉發之班彪曰匡衡改郊兆後皆數復其後衆庶多言不當變動祭祀又初罷甘泉泰畤作南郊日大風壞甘泉竹宮折畤中木十圍以上百餘天子異之以問劉向對曰家人尚不欲絶種祠况於國之神寶舊畤且甘泉汾隂及雍五畤始立皆有神祇感應然後營之非茍而已也於是上無繼嗣故令皇太后詔有司曰孝武皇帝大聖通明始建上下之祠營泰畤於甘泉定后土于汾隂而神祇安之享國長久子孫蕃滋今皇帝寬仁孝順靡有大愆而久無繼嗣思其咎職在徙南北郊春秋大復古善順祀其復甘泉泰畤汾隂后土如故及雍五畤陳倉陳寶祠在陳倉者時永始三年冬十月庚辰詔也綏和二年三月皇太后詔有司復長安南北郊哀帝建平三年冬十一月壬子復甘泉泰畤汾隂后土祠罷南北郊平帝元始五年大司馬王莽奏言王者父事天故爵稱天子孔子曰人之行莫大於孝孝莫大於嚴父嚴父莫大於配天王者尊其考欲以配天緣考之意欲尊祖推而上之遂及始祖是以周公郊祀后稷以配天宗祀文王於明堂以配上帝禮記天子祭天地及山川嵗遍春秋穀梁傳以十二月下辛卜正月上辛郊髙皇帝受命因雍四畤起北畤而備五帝未共天地之祀孝文十六年用新垣平議初起渭陽五帝廟祭泰一地祇以太祖髙皇帝配冬至祠泰一夏至祠地祇皆并祠五帝而共一牲上親郊拜後平伏詐誅乃不復自親而使有司行事孝武皇帝祠雍曰今上帝朕親郊而后土無祠則禮不答也於是元鼎四年十一月甲子始立后土祠于汾隂或曰五帝泰一之佐宜立泰一五年十一月癸未立泰一祠於甘泉三嵗一郊與雍更祠亦以髙祖配不嵗事天皆未應古制建始元年徙甘泉泰畤河東后土於長安南北郊永始元年三月以未有皇孫復甘泉河東祠綏和二年以卒不獲祐復長安南北郊建平三年懼孝哀皇帝之疾未瘳復甘泉汾隂祠竟復無福臣謹與太師孔光長樂少府平晏大司農左咸中壘校尉劉歆太中大夫朱陽博士薛順議郎國由等六十七人議皆曰宜如建始時丞相衡等議復長安南北郊如故改其祭禮曰周官天墬之祀樂有別有合以孟春正月上辛若丁天子親合祀天地于南郊以髙帝髙后配以日冬至使有司奉祠南郊髙帝配而望羣陽日夏至使有司奉祭北郊髙后配而望羣隂奏可三十餘年間天墬之祠五從焉又立長安諸廟樂志孔光何武奏郊祭樂人員六十二人給祠南北郊蜀志章武二年十月詔丞相亮營南北郊於成都昭烈漢長安五兆廣畤郊祀志元始五年孔光等八十九人議曰今稱天神曰皇天上帝泰一兆曰泰畤而稱墬祇曰后土與中央黃靈同又兆北郊未有尊稱宜令墬祇稱皇墬后祇兆曰廣畤分羣神以類相從為五部兆天墬之別神中央帝黃靈后土畤及日廟北辰北斗填星中宿中宮于長安城之未墬兆東方帝太昊青靈句芒畤及靁公風伯廟嵗星東宿東宫于東郊兆南方炎帝赤靈祝融畤及熒惑星南宿南宫于南郊兆西方帝少皥白靈蓐收畤及太白星西方西宫于西郊兆北方帝顓頊黑靈玄冥畤及月廟雨師廟辰星北宿北宮于北郊兆奏可於是長安兆畤盛矣漢祭圓丘儀漢郊禋制見後唐禮志賈曾議曰三輔故事祭于圓丘上帝后土位皆南面則漢嘗合祭矣會要云三輔故事漢祭圓丘儀上帝位正南面后土位亦南面而少東漢雒陽郊兆增廣郊祀圓壇雒陽北郊議郊祀南北郊制度紀建武二年正月壬子起髙廟建社稷於洛陽立郊兆於城南始正火德色上赤注續漢書曰制郊兆於洛陽城南七里十三年益州傳送瞽師郊廟樂器葆車輿輦於是法物始備十年平隴十二年平蜀十八年三月幸蒲坂祠后土中元元年丙辰嵗初立北郊兆域二年丁巳嵗春正月辛未初立北郊祠后土祭祀志建武元年光武即位于鄗為壇營於鄗之陽祭告天地采用元始中郊祭故事六宗日月星辰山川海羣神皆從未以祖配天地共犢餘皆尚約注黃圖載元始儀最悉曰元始四年宰衡莽奏曰帝王之義莫大於承天承天之序莫重於郊祀祭天於南就陽位祀地於北主隂義圓丘象天方澤則地圓方因體南北從位燔燎升氣瘞埋就類牲欲繭栗味尚清玄器成匏勺貴誠因質天地神所統故類乎上帝則禋于六宗望于山川班于羣神皇天后土隨王所在而事祐焉甘泉太陽河東少陽咸失厥位不合禮制聖王之制必上當天心下合地意中考人事故曰豈弟君子求福不回回而求福厥路不通在易泰卦乾坤合體天地交通萬物聚出其律太蔟天子親郊天地先祖配天先妣配地隂陽之別以日冬至郊天夏至祀后土君不省方而使有司於是定郊祀長安南北郊罷甘泉河東祀建武二年正月初制郊兆於雒陽城南七里依鄗采元始中故事為圓壇八陛中又為重壇天地位其上皆南鄉西上其外壇上為五帝位青帝甲寅赤帝丙巳黃帝丁未白帝庚申黑帝壬亥其外為壝重營皆紫以象紫垣有四通道以為門日月在中營內南道日在東月在西北斗在北道之西皆别位不在羣神列中八陛陛五十八醊合四百六十四醊五帝陛郭帝七十二醊合三百六十醊中營四門門五十四神合二百一十六神外營四門門百八十神合四百三十二神皆背營內向中營四門門封神四外營四門門封神四合三十二神凡千五百一十四神背中營神五星也及中宫五官神及五嶽之屬背外營神二十八宿外宫星雷公先農風伯雨師四海四瀆名山大川之屬也至七年五月詔三公曰漢當郊堯其與卿大夫博士議時御史杜林以為漢起不因緣堯舊制以髙帝配方軍師在外可且如元年郊祀故事上從之語在杜林傳隴蜀平後乃增廣郊祀髙帝配位在中壇上西面北上漢舊儀曰祭天紫壇帷幄髙皇配天居堂下西向紺帷帳紺席天地黃帝各一犢青赤帝共一犢白黑帝共一犢凡六犢日月北斗共用牛一四營羣神共用牛四凡樂奏青陽朱明西皓玄冥及雲翹育命舞中營外營四門凡用席二百一十六枚皆莞簟率一席三神日月北斗無陛郭醊既送神燌爼實於壇南已地中元元年初起北郊兆域遷呂太后于園上薄太后尊號曰髙皇后以配地祇語在光武紀北郊在雒陽城北四里為方壇四陛張璠記云在城北六里通典云北郊在雒陽城北四里上薄太后尊號曰髙后以配地祇中元二年即三十一年正月辛未初立北郊祠后土地祇位南面西上髙皇后配西面北上皆在壇上地理羣神從食皆在壇下如元始中故事中嶽在未四嶽各如其方孟辰之地中營內海在東四瀆河西濟北淮東江南他山川各如其方皆在外營內四陛醊及中外營門封神奏樂如南郊地祇髙后用犢各一五嶽共牛一四瀆共牛一羣神共二牛奏樂亦如南郊既送神瘞爼實于壇北與南郊同月禮儀志正月天郊夕牲注周禮展牲干寶曰若今夕牲晝漏未盡十八刻進熟宰祝燔柴天子再拜明堂五郊宗廟社稷六宗晝漏未盡七刻進熟永平二年正月上丁祀南郊禮畢次北郊明堂髙廟世祖廟謂之五供五供畢以次上陵大鴻臚設九賔禮畢郡國上計吏以次在前當神軒占其郡穀價民所疾苦欲神知其動靜漢官儀北郊壇在城西北角去城一里張璠記云城北六里志云城北四里所謂方壇四陛但存壇祠舍而已其鼓吹樂及舞人御帳皆從南郊之具南郊焚犢北郊埋犢杜林傳明年建武七年大議郊祀制多以為周郊后稷漢當祀堯詔復下公卿議議者僉同帝亦然之林獨以為漢業特起功不緣堯祖宗舊事所宜因循定從林議東平王蒼傳永平二年蒼以天下化平宜修禮樂乃與公卿共議定南北郊冠冕制度及光武廟登歌八佾舞三年正月癸巳詔朕奉郊祀登靈臺鄧耽郊祀賦曰豐恩羡溢含唐孕殷昭假烈祖以孝以仁自天降福保定我民東京賦將祀天郊報地功孤竹之管雲和之瑟雷鼓􅞵􅞵六變既畢冠華秉翟列舞八佾元祀惟稱羣望咸秩揚槱燎之炎煬致髙煙於太一神歆馨而顧德祚靈主以元吉漢郊祀故事祭祀志建武元年為壇營於鄗之陽祭告天地采用元始中郊祭故事二年正月初制郊兆於雒陽依鄗采元始中故事七年五月詔三公曰漢當郊堯其與卿大夫博士議時御史杜林上疏以為漢起不因緣堯與殷周異宜而舊制以髙帝配且可如元年郊祀故事上從之注東觀書云且如元年郊祭故事三十二年求元封時封禪故事告祠泰山如親耕貙劉先祠先農先虞故事禪祭地于梁隂以髙后配山川羣神從如元始中北郊故事永平二年迎氣采元始中故事元和二年二月至泰山辛未柴祭天地羣神如故事元初六年以元始中故事謂六宗易六子之氣為非是漢五郊祭祀漢七郊漢七郊禮樂七郊三雍禮儀漢四時迎氣洛陽五郊兆禮儀志永平二年三月上始養三老五更於辟雍行大射之禮於是七郊禮樂三雍之義備矣輿服志漢承秦故世祖始修三雍正兆七郊顯宗永平二年初服旒冕衣裳文章赤舄絇屨以祠天地五郊各如方色曹充傳建武中為博士從狩岱宗定封禪禮還受詔議立七郊三雍大射養老禮儀注五帝及天地為七郊董鈞傳永平初為博士時草創五郊祭祀及宗廟禮樂威儀章服輒令鈞參議多見從用樊倏傳永平元年拜長水校尉與公卿雜定郊祠禮儀梁松傳明習故事光武時與諸儒修明堂辟雍郊祀封禪禮儀常與論議張純傳建武初舊章多闕每有疑議輒以訪純自郊廟冠昏禮儀多所正定紀永平二年是嵗始迎氣於五郊祭祀志永平中二年以禮讖及月令有五郊迎氣服色因采元始故事兆五郊於雒陽四方中兆在未壇皆三尺階無等立春之日迎春東郊祭青帝勾芒車旗服飾皆青歌青陽八佾舞雲翹之舞立夏迎夏南郊祭赤帝祝融車旗服飾皆赤歌朱明八佾舞雲翹之舞立秋迎秋西郊祭白帝蓐收車服皆白歌西皥八佾舞育命之舞立冬迎冬北郊祭黑帝玄冥車服皆黑歌玄冥八佾舞育命之舞宋志云祭其帝與神車服各順方色魏晉依之江左未建先立秋十八日郊黃帝京都百官皆衣黃至立秋迎氣於黃郊樂奏黃鍾之宮歌帝臨冕而執干戚舞雲翹育命禮記禮器因吉土以享帝于郊注以四時所兆祭於四郊者也今漢亦四時迎氣其禮則簡月令立春迎春東郊注靈威仰于東郊之兆王居明堂禮曰出十五里迎嵗蓋殷制也周近郊五十里蔡雍傳熹平六年上封事曰明堂月令天子以四立及季夏之節迎五帝於郊所以導致神氣祈福豐年書奏帝乃親迎氣北郊一本云熹平六年蔡雍上封事曰迎氣五郊帝者之大業而廢闕不行自今齋制宜如故典帝乃親迎氣北郊獻紀建安八年冬十月己巳公卿初迎冬於北郊總章始復八佾舞晉志立春之日皆青幡幘迎春于東郊外野中迎春至自野中出則迎拜之三時不迎漢禮邠郊文苑傳杜篤論都賦皇帝以建武十八年衍陳於岐梁東橫乎大河瘞后土禮邠郊注甘泉祭天所也在邠地之郊周祀天位此段合在前漢厯志武成篇曰惟四月既旁生霸粵六日庚戌武王燎于周廟翌日辛亥祀于天位粵五日乙卯乃以庶國祀馘于周廟注師古曰今文尚書玉海卷九十二
